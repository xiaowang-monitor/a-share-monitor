tps://news.10jqka.com.cn/20261116/c681872138.shtml"}, {"id": "5676611", "title": "奥海科技：拟1.67亿元受让智新控制21.58%股权，工商变更尚在推进中", "content": "奥海科技公告，公司此前披露拟以挂牌转让底价1.67亿元受让南斗六星（武汉）技术有限公司所持智新控制系统有限公司21.58%股权，本次交易完成后公司持股比例由57.547%增至79.127%。截至公告披露日，《产权交易合同》已签署并生效，广东联合产权交易中心已出具产权交易凭证，公司已付清全部交易价款及交易服务费，标的公司股权工商变更登记尚在推进中。", "ctime": 1794827499, "time_str": "19:11:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261116/c681872114.shtml"}, {"id": "5676587", "title": "外汇局：10月跨境资金净流入保持总体稳定 近期企业结汇和购汇意愿均有所上升", "content": "日前，国家外汇管理局公布了2026年10月银行结售汇和银行代客涉外收付款数据。国家外汇管理局副局长、新闻发言人李斌就2026年10月外汇市场形势回答了记者提问。问：10月我国外汇市场运行情况如何？答：10月以来，国际股市和债市延续震荡走势，国际汇市相对稳定。我国外汇市场保持平稳运行，呈现三个特点：一是涉外交易持续活跃。10月，企业、个人等非银行部门跨境收支合计1.45万亿美元，较9月日均增长10%。外汇市场交易量3.77万亿美元，较9月日均增长7%。前10个月，跨境收支规模、外汇市场交易量同比分别增长20%和9%。二是跨境资金净流入保持总体稳定。10月跨境资金净流入769亿美元，较9月有所增加。受国庆假期影响，节前企业付款加快，节后收款较为集中，假期后资金净流入通常高于9月末水平。从9至10月综合情况看，跨境资金月均净流入588亿美元，较8月下降6%。三是近期企业结汇和购汇意愿均有所上升。综合9至10月情况看，企业等主体月均结汇率为64.3%，月均购汇率为59.3%，分别较8月提高2.8个和1.5个百分点，表明外汇市场各类需求比较多元，预期总体保持稳定。（外管局）", "ctime": 1794827402, "time_str": "19:10:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261116/c681872047.shtml"}, {"id": "5676541", "title": "高争民爆：回购价格上限自11月24日起调整为48.09元/股", "content": "高争民爆公告，公司原计划以不超过48.34元/股回购股份，回购股份用于股权激励计划或员工持股计划。因实施2026年前三季度权益分派，公司自2026年11月24日起将回购价格上限调整为48.09元/股。调整前，公司已累计回购358.52万股，成交总金额1.5亿元（不含交易费用）；除价格上限调整外，回购其他事项均无变化。", "ctime": 1794827154, "time_str": "19:05:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261116/c681871833.shtml"}, {"id": "5676501", "title": "继峰股份：王义平任董事长，冯巅任总经理", "content": "继峰股份公告，2026年11月16日，公司第六届董事会第一次会议选举王义平为董事长、王继民为副董事长；聘任冯巅为总经理、刘杰为副总经理兼董事会秘书、张思俊为财务总监、潘阿斌为证券事务代表，任期均与公司董事会任期一致。", "ctime": 1794827064, "time_str": "19:04:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261116/c681871792.shtml"}, {"id": "5676387", "title": "唐源电气：浙江全资子公司完成工商登记，注册资本1000万元", "content": "唐源电气公告，公司此前审议通过使用自有资金1000万元在浙江省嘉兴市设立全资子公司浙江唐源智能科技有限责任公司，持股100%。近日，浙江唐源已完成工商注册登记并取得嘉兴市市场监督管理局核发的《营业执照》，注册资本壹仟万元整，成立日期2026年11月11日，法定代表人蒲继华。", "ctime": 1794826807, "time_str": "19:00:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261116/c681871612.shtml"}, {"id": "5676379", "title": "*ST美丽：股票收盘价0.95元/股低于1元，可能被终止上市", "content": "*ST美丽公告，公司股票于2026年11月16日收盘价为0.95元/股，低于1元，根据《深圳证券交易所股票上市规则》第9.2.3条规定，公司应当披露股票可能被终止上市的风险提示公告。此外，公司2025年度财务报告被出具无法表示意见的审计报告，股票已于2026年4月30日开市起被实施退市风险警示；若2026年年度报告披露后出现规定情形之一，深交所将决定终止公司股票上市交易。公司董事会已聘请第三方机构，争取尽早消除“非标准审计报告”有关事项的影响；福田企业重组服务中心已受理对公司的庭外重组申请，能否达成重组方案或相关协议存在不确定性。", "ctime": 1794826645, "time_str": "18:57:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261116/c681871517.shtml"}, {"id": "5676353", "title": "纳芯微：拟以现金4.87亿元收购隔空智能78.1520%股权", "content": "纳芯微公告，公司拟以现金方式收购宁波隔空智能科技有限公司合计78.1520%的股权（对应注册资本691.7196万元），收购对价合计4.87亿元。本次交易完成后，隔空智能将成为公司控股子公司，纳入合并报表范围。资金来源为公司自有资金及自筹资金，公司拟向银行申请不超过3.5亿元的并购贷款用于支付部分股权转让价款。本次交易不构成关联交易，也不构成重大资产重组，已获公司第四届董事会第五次会议审议通过，无需提交股东会审议。", "ctime": 1794826478, "time_str": "18:54:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261116/c681871478.shtml"}, {"id": "5676335", "title": "埃斯顿：实控人一致行动人吴侃增持93.42万股H股，权益变动触及1%整数倍", "content": "埃斯顿公告，公司实际控制人吴波先生的一致行动人吴侃先生于2026年11月16日以自有资金通过港股通增持公司H股93.42万股，占公司A+H总股本的0.10%。本次增持后，吴波先生、派雷斯特和吴侃先生合计持有公司股份3.68亿股，占公司总股本的比例由37.92%增加至38.01%，权益变动比例触及1%整数倍。本次权益变动不会导致公司控股股东、实际控制人发生变化。", "ctime": 1794826376, "time_str": "18:52:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261116/c681871426.shtml"}, {"id" are": false, "source": "", "url": "https://news.10jqka.com.cn/20261116/c681871176.shtml"}, {"id": "5676191", "title": "美交通部长拒绝为全美航班停飞道歉", "content": "11月15日，美国交通部长达菲表示，他不会为11月13日全美航班地面停飞事件道歉，称根源是历史遗留问题，民主党和共和党都对此负有责任，因美国航空业基础设施投资不足可追溯至二三十年前。截至当晚，超11500架次航班受影响，约2100架次取消、9400架次延误，为美国连续第3天上万架航班延误或取消。达菲称事故原因目前仍不明确，无证据表明涉及网络攻击或其他恶意行为，预计到11月16日航空运行将恢复正常。（央视新闻）", "ctime": 1794825239, "time_str": "18:33:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261116/c681871085.shtml"}, {"id": "5676165", "title": "舒泰神：子公司产品注射用波米泰酶α纳入2026年国家医保目录", "content": "舒泰神公告，根据国家医保局、人力资源社会保障部发布的《2026年国家医保目录》，公司子公司江苏贝捷泰生物科技有限公司的产品注射用波米泰酶α（博佳凝）纳入《2026年国家医保目录》，医保分类为乙类，编号59，适应症为凝血因子VIII或IX的抑制物＞5个Bethesda单位（BU）的先天性血友病A或B成人患者的出血治疗。《2026年国家医保目录》将于2027年1月1日起正式执行。", "ctime": 1794825168, "time_str": "18:32:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261116/c681871065.shtml"}, {"id": "5676161", "title": "华润新能源：2026年10月售电量63.71亿千瓦时，同比增加31.96%", "content": "华润新能源公告，2026年10月公司售电量为63.71亿千瓦时，同比增加31.96%，其中风力发电项目售电量为48.22亿千瓦时，同比增加25.70%；太阳能发电项目售电量为15.49亿千瓦时，同比增加56.31%。2026年1-10月累计售电量为593.44亿千瓦时，同比增加9.49%，其中风力发电项目售电量为442.55亿千瓦时，同比增加3.95%；太阳能发电项目售电量为150.9亿千瓦时，同比增加29.76%。", "ctime": 1794825162, "time_str": "18:32:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261116/c681871063.shtml"}, {"id": "5676147", "title": "宏达电子：拟以2000万元-4000万元回购公司股份", "content": "宏达电子公告，拟以不低于2000万元且不超过4000万元回购公司股份，回购价格不超过62.88元/股。回购股份的用途为出售，将在披露回购结果暨股份变动公告12个月后采用集中竞价交易方式出售，并在披露回购结果暨股份变动公告后3年内完成出售；若未能在规定期限内实施上述用途，未实施部分股份将依法予以注销。回购方式为集中竞价，回购期限为自公司董事会审议通过本次回购方案之日起不超过3个月，资金来源为自有资金或自筹资金。", "ctime": 1794825099, "time_str": "18:31:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261116/c681871044.shtml"}, {"id": "5676059", "title": "铁路建设高效推进前10月完成投资超6700亿元", "content": "记者16日从中国国家铁路集团有限公司获悉，今年以来，铁路建设科学高效推进，1至10月全国铁路完成固定资产投资6773亿元，同比增长0.9%，保持高位运行，有效发挥铁路投资拉动作用，为扩内需、稳增长注入新动能。(新华社)", "ctime": 1794824576, "time_str": "18:22:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261116/c681870897.shtml"}, {"id": "5676009", "title": "2030年我国将基本形成全球领先的轻工业标准体系", "content": "工业和信息化部、市场监管总局16日对外发布《以标准提升引领轻工业优化升级实施方案》，提出到2030年，基本形成全球领先的轻工业标准体系，标准供给更加有效，有力支撑、引领我国轻工业高质量发展。轻工业是重要的民生产业。实施方案明确加快推动以标准提档升级引领轻工业向智能化、绿色化、融合化全面转型，并提出到2027年，轻工业标准化工作机制更加健全，制修订产品标准、方法标准等200项左右，开展100项左右标准实施情况评估分析和复审，译制轻工标准外文版30项左右，牵头制修订的国际标准占比提升至8%左右。实施方案围绕优体系提质量行动、强制性国家标准筑基行动等6个行动部署了一系列举措，包括组织编制“十五五”轻工业标准体系；制定轻工业数智化转型标准体系建设指南；探索制定“零碳工厂”标准；鼓励老年群体、养老机构等采购获得认证的老年用品产品；依托“一带一路”、金砖国家等国际或区域合作机制，深化开展标准联通行动等。(新华社)", "ctime": 1794824274, "time_str": "18:17:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261116/c681870789.shtml"}, {"id": "5675957", "title": "吉尔伯特·洪博连任国际劳工组织总干事", "content": "当地时间16日，国际劳工组织宣布，现任总干事吉尔伯特·洪博以51票再次当选该组织总干事，获得第二个总干事任期，任期5年。（央视新闻）", "ctime": 1794824028, "time_str": "18:13:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261116/c681870653.shtml"}, {"id": "5675953", "title": "英特尔美股盘前跌超5%", "content": "英特尔美股盘前跌超5%，现报56.65美元。", "ctime": 1794824002, "time_str": "18:13:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261116/c681870644.shtml"}, {"id": "5675949", "title": "ST东尼：申请撤销股票其他风险警示", "content": "ST东尼公告，公司于2026年11月16日召开第四届董事会第十五次会议，审议通过《关于申请撤销公司股票其他风险警示的议案》，同意向上海证券交易所提交撤销申请。公司股票自2025年10月31日起被实施其他风险警示。截至申请日，公司收到《行政处罚决定书》已满12个月，相应年度财务会计报告已全部完成追溯重述，且不涉及投资者索赔事项及计提相关预计负债。本次申请尚需上交所审核，能否获批存在不确定性。", "ctime": 1794823957, "time_str": "18:12:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261116/c681870625.shtml"}, {"id": "5675947", "title": "先声药业：SIM0712获药物临床试验批准通知书", "content": "先声药业公告，本集团自主研发的靶向STAT6的口服小分子降解剂SIM0712已获中国国家药品监督管理局签发的药物临床试验批准通知书，拟开展用于治疗特应性皮炎的临床试验。SIM0712基于本集团蛋白降解靶向嵌合体（PROTAC）技术平台自主研发，临床前研究显示其具备较高的靶点活性及选择性，在特应性皮炎、哮喘等2型炎症性疾病中具有广泛应用前景。", "ctime": 1794823953, "time_str": "18:12:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261116/c681870623.shtml"}, {"id": "5675935", "title": "吴政隆在黑龙江辽宁调研时指出加力推动政策落地见效努力实现“十五五”良好开局", "content": "国务委员兼国务院秘书长吴政隆13日至16日在黑龙江、辽宁调研。他强调，要深入学习贯彻党的二十届五中全会精神，认真落实党中央、国务院决策部署，牢牢把握维护“五大安全”重要使命，充分发挥存量和增量政策效能，加力扩大内需、优化供给，持续优化营商环境，增强发展动力、激发社会活力，推动经济向新向优向好发展。吴政隆先后到齐齐哈尔、大庆、哈尔滨和铁岭、沈阳等地，深入调研石油化工、先进制造、农产品加工等企业，并与有关地方政府、企业座谈交流。他指出，在以习近平同志为核心的党中央坚强领导下，前三季度我国经济运行总体平稳、稳中有进，高质量发展取得新的成效。要坚定信心、抢抓机遇，上下协同推动政策落实，努力实现全年经济社会发展目标任务。要纵深推进全国统一大市场建设，挖掘需求潜力，增强“两新”“两重”政策实施效能，综合整治低价无序非理性竞争，加快清理拖欠企业账款，打造更优营商环境。要因地制宜发展新质生产力，深化拓展“人工智能+”行动，以新技术赋能传统产业改造升级，以新场景引领新兴产业和未来产业发展壮大，加快构建以先进制造业为骨干的现代化产业体系。(新华社)", "ctime": 1794823868, "time_str": "18:11:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261116/c681870589.shtml"}, {"id": "5675933", "title": "睿创微纳：拟以5000万元-1亿元回购公司股份", "content": "睿创微纳公告，拟以不低于人民币5000万元（含）、不高于人民币1亿元（含）回购公司股份，回购价格不高于220元/股（含），该价格不高于公司董事会审议通过回购股份方案决议前30个交易日公司股票交易均价的150%。回购股份用途为维护公司价值及股东权益，回购股份将在披露回购实施结果暨股份变动公告12个月后采用集中竞价交易方式出售，并在披露回购结果暨股份变动公告后3年内完成出售；若未能在上述期限内出售完毕，将依法履行减少注册资本程序，尚未出售的已回购股份予以注销。回购期限为自董事会审议通过本次回购方案之日起3个月内，资金来源为公司自有资金及自筹资金。", "ctime": 1794823866, "time_str": "18:11:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261116/c681870587.shtml"}, {"id": "5675929", "title": "伊朗向海湾国家索赔主打舆论战", "content": "伊朗外交部发言人表示，伊朗将对开放本土基地供美国、以色列打击伊朗的海湾国家索赔，相关文件已经准备妥当，伊朗已就此致函联合国。为什么伊朗会在此时打出这张“法律外交牌”？这会不会进 // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
