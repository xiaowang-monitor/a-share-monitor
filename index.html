qka.com.cn/20261109/c681609439.shtml"}, {"id": "5606253", "title": "欧洲主要股指开盘集体下跌", "content": "欧洲主要股指开盘集体下跌，欧洲斯托克50指数跌0.27%，英国富时100指数跌0.19%，法国CAC40指数跌0.05%，德国DAX指数跌0.05%。", "ctime": 1794211493, "time_str": "16:04:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261109/c681608149.shtml"}, {"id": "5606233", "title": "商务部：继续暂停对韩华海洋株式会社5家美国相关子公司实施反制措施2个月", "content": "商务部：为落实中美经贸磋商共识，现公布《关于继续暂停对韩华海洋株式会社5家美国相关子公司实施反制措施2个月的决定》，自2026年11月10日起施行。", "ctime": 1794211398, "time_str": "16:03:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261109/c681607607.shtml"}, {"id": "5606225", "title": "商务部新闻发言人就调整不可靠实体清单措施答记者问", "content": "商务部新闻发言人就调整不可靠实体清单措施答记者问。问：有消息称，根据中美第八轮经贸磋商共识，中方将调整一批针对美国的非关税措施。请问在不可靠实体清单方面有什么考虑？答：根据《中华人民共和国反外国制裁法》《不可靠实体清单规定》及有关规定，不可靠实体清单工作机制于2025年4月4日发布公告，将11家美国实体列入不可靠实体清单，采取相应措施。为落实中美第八轮经贸磋商共识，中方决定自2026年11月10日起，继续暂停2025年4月4日公告（不可靠实体清单工作机制公告〔2025〕7号）相关措施2个月。根据《不可靠实体清单规定》相关规定，国内企业可申请与上述实体进行交易，不可靠实体清单工作机制将依法进行审核，对符合条件的申请予以批准。（新华社）", "ctime": 1794211320, "time_str": "16:02:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261109/c681607270.shtml"}, {"id": "5606167", "title": "美国疾控中心代表团访问中国疾控中心，交流中美流感合作项目", "content": "11月5日，美国疾控中心总部及驻华团队Melissa ROLFES博士、Alexander MILLMAN博士等一行7人访问中国疾控中心昌平园区，围绕中美流感合作项目交流，美方三位总部专家作学术报告。上午项目交流会由全球公共卫生中心中美项目部与中心外事处共同主持，各子项目负责人汇报流感疫苗接种优化、流感防控多部门协同能力建设项目进展，美方团队对项目实施、管理及进展给予高度评价。同日下午，中美疾控合作项目专家技术报告会举行，70余人参会，ROLFES、CHARD、JOO三位博士分别围绕流感严重程度监测、流感疫苗效力、季节性流感疫苗接种经济学评价作分享。（界面新闻）", "ctime": 1794210719, "time_str": "15:51:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261109/c681606679.shtml"}, {"id": "5606163", "title": "嵘泰股份：控股股东协议转让6.00%股份过户完成", "content": "嵘泰股份公告，公司控股股东赣州润诚此前披露拟以24.54元/股向陈慧协议转让17116509股股份（占公司总股本的6.00%），转让总价款4.2亿元。本次协议转让已通过上海证券交易所合规性确认，并于2026年11月8日取得中国证券登记结算有限责任公司出具的《证券过户登记确认书》，过户日期为2026年11月6日，过户数量为17116509股，股份性质为无限售流通股，过户登记手续已办理完毕。本次转让后，赣州润诚持股比例由33.32%降至27.32%，陈慧持股比例由0.53%升至6.53%，不涉及公司控制权变更。受让方陈慧承诺自标的股份过户登记至其名下之日起12个月内不会减持。", "ctime": 1794210665, "time_str": "15:51:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261109/c681606658.shtml"}, {"id": "5606149", "title": "阿里健康与多家跨国药企在进博会期间达成战略合作", "content": "第九届中国国际进口博览会上，阿里健康与默克中国、欧加隆、森世海亚集团、阿斯利康、诺和诺德等多家全球领先药企达成战略合作，并就创新药可及性、慢病全周期管理等话题与礼来举行高层对谈。公司同时宣布，近日已推出“健康全家卡”，将检测、问诊、用药、医护、配送、支付六大环节整合到家庭健康服务中。（人民财讯）", "ctime": 1794210537, "time_str": "15:48:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261109/c681606599.shtml"}, {"id": "5606145", "title": "大秦铁路：2026年10月大秦线货物运输量3202万吨，同比下降1.51%", "content": "大秦铁路公告，2026年10月公司核心经营资产大秦线完成货物运输量3202万吨，同比下降1.51%，日均运量103.29万吨。大秦线日均开行重车77.2列，其中日均开行2万吨列车49.6列。2026年1-10月，大秦线累计完成货物运输量3.3亿吨，同比增长3.52%。", "ctime": 1794210510, "time_str": "15:48:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261109/c681606583.shtml"}, {"id": "5606143", "title": "中原内配：泰国公司获国际客户气缸套项目定点，预计年销售额约5000万元", "content": "中原内配公告，下属孙公司Fidelity Auto Components（Thailand）Co.,Ltd近日收到某国际著名工程机械与动力设备企业发出的《定点通知》，获得该客户部分型号柴油与燃气发动机气缸套项目定点，预计2028年四季度开始供货，根据客户需求预测，预计年销售额约5000万元。公司泰国生产基地已于2025年末竣工投产。本次定点不会对公司当期经营业绩产生重大影响。", "ctime": 1794210501, "time_str": "15:48:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261109/c681606579.shtml"}, {"id": "5606137", "title": "克明食品：10月生猪销量6.23万头同比增长52.38%", "content": "克明食品公告，控股子公司兴疆牧歌2026年10月销售生猪6.23万头，销量环比增长6.52%，同比增长52.38%；销售收入4153.94万元，销售收入环比增长0.18%，同比增长15.25%。2026年1-10月累计销售生猪62.99万头，较去年同期增长37.69%；累计销售收入4.59亿元，较去年同期下降1.89%。10月生猪销售数量及1-10月累计销售数量同比上升主要系产能释放所致。", "ctime": 1794210455, "time_str": "15:47:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261109/c681606569.shtml"}, {"id": "5606123", "title": "“志愿联盟”多国部队启动首次联合演习 重点演练对乌安全支持", "content": "当地时间9日，由英国和法国共同牵头的“志愿联盟”多国部队在波兰启动首次联合演习，代号为“KOALICJA 26.2”，将持续至22日，来自11个国家的约2800名军人参加，重点演练未来乌克兰停火或结束冲突后多国部队如何快速部署并为乌克兰提供安全支持。参演国家包括比利时、爱沙尼亚、法国、德国、立陶宛、荷兰、波兰、西班牙、瑞典、土耳其和英国，法英将共同负责指挥。波兰国防部和英国国防部均强调，该部队不负责维和，也不承担停火监督任务，独立于北约军事指挥体系。法国方面有分析称，演习范围和持续时间有可能触怒俄罗斯。（央视新闻）", "ctime": 1794210189, "time_str": "15:43:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261109/c681606445.shtml"}, {"id": "5606117", "title": "外交部介绍古巴党和政府特使罗德里格斯访华有关安排", "content": "11月9日，外交部发言人郭嘉昆在例行记者会上介绍，中方发布古巴党和政府特使、古共中央政治局委员、外交部长罗德里格斯即将访华的消息。郭嘉昆表示，中国和古巴是好朋友、好同志、好兄弟，罗德里格斯特使访华凸显两国高水平政治互信。中方高度重视此访，愿就中古关系和共同关心的议题同古方深入交换意见，进一步落实两国领导人达成的重要共识，加强沟通协调，深化各领域交流合作，持续构建中古命运共同体。（央视新闻）", "ctime": 1794210126, "time_str": "15:42:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261109/c681606433.shtml"}, {"id": "5606073", "title": "新五丰：2026年10月生猪销量38.47万头，同比下降36.93%", "content": "新五丰公告，公司2026年10月销售生猪38.47万头，同比下降36.93%，其中销售商品猪18万头，商品猪销价9.69元/公斤；2026年1-10月累计销售生猪474.31万头，累计销售商品猪255.66万头。", "ctime": 1794209646, "time_str": "15:34:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261109/c681606242.shtml"}, {"id": "5606071", "title": "环旭电子：2026年10月合并营业收入66.44亿元，同比增长18.87%", "content": "环旭电子公告，2026年10月合并营业收入为人民币66.44亿元，较去年同期的合并营业收入增加18.87%，较2026年9月合并营业收入环比减少11.25%。公司2026年1月至10月合并营业收入为人民币535.24亿元，较去年同期的合并营业收入增加8.72%。", "ctime": 1794209634, "time_str": "15:33:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261109/c681606236.shtml"}, {"id": "5606069", "title": "神农集团：2026年10月商品猪销售收入5.91亿元，同比增长49.24%", "content": "神农集团公告，2026年10月公司销售商品猪42.84万头，同比变动55.90%，其中向集团内部屠宰企业销售商品猪6.55万头；商品猪销售收入5.91亿元，同比变动49.24%；商品猪销售均价9.83元/公斤，环比变动-6.02%。2026年1-10月商品猪累计销量303.25万头，累计销售收入40.31亿元。", "ctime": 1794209624, "time_str": "15:33:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261109/c681606230.shtml"}, {"id": "5606055", "title": "海大集团成立生物科技发展公司", "content": "据企查查APP显示，近日，莱阳海大生物科技发展有限公司成立，法定代表人为邹毅，注册资本1000万元，经营范围包含生物饲料研发、畜牧渔业饲料销售、饲料添加剂销售、货物进出口、粮食收购等。企查查股权穿透显示，该公司由海大集团间接全资持股。（人民财讯）", "ctime": 1794209507, "time_str": "15:31:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261109/c681606179.shtml"}, {"id": "5606053", "title": "天翼电信终端与优必选达成全面战略合作", "content": "11月9日，天翼电信终端与优必选科技签署全面战略合作协议，双方将力争推动家庭陪伴机器人行业规模破百万台，超仿生人形、轮式人形机器人销售规模突破10万台，在机器人规模化推广、联合创新攻关、渠道共享、场景打造、产业生态共建等多维度开展合作，并共建“天翼终端—优必选机器人联合创新实验室”，将机器人打造为AI服务重要触点与场景创新入口。（人民财讯）", "ctime": 1794209500, "time_str": "15:31:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261109/c681606175.shtml"}, {"id": "5606043", "title": "阿里云Token Plan大幅上调额度，三档套餐额度提升超七成、月费不变", "content": "11月9日，阿里云上调Token Plan个人版订阅额度，Lite、Essential、Standard三档套餐月费不变，月度额度提升约74%至78%。Token Plan是阿里云推出的大模型订阅服务。具体来看，Lite套餐额度由1.15万Credits提升至2万Credits，月费39元；Essential套餐额度由2.55万提升至4.5万Credits，月费79元；Standard套餐额度由4.5万提升至8万Credits，月费139元。最高一档的Pro套餐同时调整了额度和价格：额度由18万提升至20万Credits，月费由499元降至312元，降幅约37.5%。按月费除以月度额度测算，Lite、Essential、Standard、Pro四档的单位额度成本分别下降约42.5%、43.3%、43.8%和43.7%，降幅均超过四成。（澎湃新闻）", "ctime": 1794209434, "time_str": "15:30:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261109/c681606158.shtml"}, {"id": "5606037", "title": "外交部：中方在美国输华芯片问题上的立场是一贯的", "content": "11月9日，外交部发言人郭嘉昆主持例行记者会。法新社记者提问，路透社报道，60万块美国英伟达高级芯片正在香港，即将被送往中国大陆，中国大陆正在批准这些芯片进口。请问外交部对此有何评论？郭嘉昆表示，中方在美国输华芯片问题上的立场是一贯的。具体情况建议向中方主管部门询问。（北京日报）", "ctime": 1794209366, "time_str": "15:29:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261109/c681606117.shtml"}, {"id": "5606029", "title": "外交部：中国率先批准《关于成立世界人工智能合作组织的协定》体现真诚意愿和坚定承诺", "content": "11月9日，外交部发言人郭嘉昆主持例行记者会。郭嘉昆介绍，作为世界人工智能合作组织的发起国和东道国，中国率先批准《关于成立世界人工智能合作组织的协定》，体现了推进合作组织筹建进程的真诚意愿和坚定承诺。郭嘉昆表示，我们将继续秉持共商、共建、共享理念，积极推进合作组织实体化运行，聚焦面向全球南方国家的务实合作和能力建设，让各国分享人工智能带来的机遇和红利。我们欢迎并期待更多国家加入世界人工智能合作组织，共促人工智能向善普惠发展，共同推动构建公正合理的全球人工智能治理体系。（澎湃）", "ctime": 1794209164, "time_str": "15:26:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261109/c681605921.shtml"}, {"id": "5606007", "title": "千问办公2.0发布", "content": "千问办公2.0今日发布，定位于面向个人与组织协作的Team Agent，在协作、自动任务和人机共创等核心场景下进行了能力升级，希望让团队成员和AI能够在共同上下文中工作。（科创板日报）", "ctime": 1794208902, "time_str": "15:21:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261109/c681605834.shtml"}, {"id": "5606005", "title": "特朗普政府要求中国协助结束与伊朗冲突？外交部：相关方应该坚持和平选择", "content": "11月9日，外交部发言人郭嘉昆主持例行记者会。有外媒记者提问，据《华盛顿邮报》报道，特朗普政府要求中国协助其结束与伊朗的冲突，郭嘉昆表示，美伊战事延宕不符合当事方和国际社会的共同利益，相关方应该坚持和平选择，通过对话谈判化解争端，推动尽早恢复中东海湾地区的和平安宁。（澎湃新闻）", "ctime": 1794208890, "time_str": "15:21:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261109/c681605829.shtml"}, {"id": "5606003", "title": "美官员称与黄仁勋婚外情女子为中国情报机构工作，外交部：纯属捕风捉影", "content": "11月9日，外交部发言人郭嘉昆主持例行记者会。法新社记者提问，英伟达CEO黄仁勋周日承认与一名女子存在婚外情，英伟达已对黄仁勋启动调查。此前，美国官员称该女子为中国情报机构工作。中国外交部能否就此事作出回应？这起事件是否会影响下周中美元首在深圳的会晤？对此，郭嘉昆表示：“我们此前已就此作出回应，所谓中国间谍的论调纯属捕风捉影，污蔑抹黑。”（澎湃）", "ctime": 1794208880, "time_str": "15:21:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261109/c681605827.shtml"}, {"id": "5606001", "title": "特朗普称将与中俄元首在APEC讨论美伊冲突及无核化问题，外交部回应", "content": "11月9日，外交部发言人郭嘉昆主持例行记者会。针对法新社记者提问，特朗普称可能会同中国和俄罗斯两国元首在APEC深圳峰会期间会晤，讨论终止美伊冲突及无核化等问题。郭嘉昆表示，中方就中俄美元首会晤同相关方保持着沟通，关于该具体问题，他目前没有可以提供的信息。（澎湃新闻）", "ctime": 1794208845, "time_str": "15:20:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261109/c681605803.shtml"}, {"id": "5605995", "title": "胡塞武装称沙特主导的联军空袭也门工厂及学校", "content": "当地时间9日上午，胡塞武装称沙特主导的联军空袭了也门荷台达省一家工厂和拉赫季省的一所学校。（央视新闻）", "ctime": 1794208631, "time_str": "15:17:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261109/c681605662.shtml"}, {"id": "5605991", "title": "国债期货收盘集体下跌", "content": "国债期货收盘集体下跌，30年期主力合约跌0.14%报118.63元，10年期主力合约跌0.06%报110.2元，5年期主力合约跌0.04%报106.875元，2年期主力合约跌0.01%报102.67元。", "ctime": 1794208563, "time_str": "15:16:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261109/c681605616.shtml"}, {"id": "5605993", "title": "互联网新技术新应用信息服务备案系统上线", "content": "为进一步提升新技术新应用备案工作规范化水平，便捷企业、公众线上填报查询备案信息，国家互联网信息办公室建设“互联网新技术新应用信息服务备案系统”，可一体化开展生成式人工智能、算法、深度合成、区块链等新技术新应用备案。系统于2026年11月9日正式上线运行，原“互联网信息服务算法备案系统”和“区块链信息服务备案管理系统”同步停止使用。（人民财讯）", "ctime": 1794208541, "time_str": "15:15:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261109/c681605617.shtml"}, {"id": "5605989", "title": "海峡环保：目前不存在已敲定、需要披露的股权投资或并购计划", "content": "海峡环保在2026年第三季度业绩说明会上表示，公司战略以内生增长为主，外延并购、股权投资围绕主业审慎开展，不会盲目对外投资。优先级上，优先看市政和工业废水治理协同标的，夯实主业基本盘；其次是固废资源化方向，布局循环经济赛道；智慧水务现阶段更多依靠自主研发和技术合作，外延并购会更加审慎。截至目前，公司不存在已经敲定、需要披露的股权投资或并购计划。（人民财讯）", "ctime": 1794208520, "time_str": "15:15:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url" const META     = {"update_time": "2026-11-09 16:15:00", "sentiment_score": 57.04545454545455, "agents": []};

// 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
