}

  height: 6px; border-radius: 3px; background: #1e293b; overflow: hidden;
}
.score-bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s; }
.up { color: var(--red); }
.down { color: var(--green); }
.pulse { animation: pulse 2s infinite; }
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}
.glow { box-shadow: 0 0 20px rgba(59,130,246,0.15); }

云天励飞：实控人、董事长、经理陈宁提议回购公司股份，资金总额2500万元-5000万元", "content": "云天励飞公告，公司董事会于2026年11月19日收到实际控制人、董事长、经理陈宁《关于提议深圳云天励飞技术股份有限公司回购公司股份的函》。陈宁基于对公司长期发展的信心和对公司价值的认可，提议公司通过集中竞价交易方式回购已发行的部分人民币普通股（A股），回购股份拟在未来适宜时机用于员工持股计划或股权激励。回购资金总额不低于人民币2500万元（含），不超过人民币5000万元（含），回购价格不高于董事会通过回购股份决议前三十个交易日公司股票交易均价的150%，回购期限自董事会审议通过回购股份方案之日起3个月内，资金来源为公司自有资金和/或自筹资金。陈宁承诺将积极推动公司尽快推进回购股份事项，并在董事会上对回购股份议案投赞成票。", "ctime": 1795077680, "time_str": "16:41:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261119/c682004909.shtml"}, {"id": "5711313", "title": "习近平：大国良性互动不是选择题，而是必答题", "content": "11月19日下午，国家主席习近平在深圳同俄罗斯总统普京、美国总统特朗普举行中俄美元首会晤。习近平指出，当今世界早已不是彼此隔绝的孤岛。人类生活在同一个地球村，大家一荣俱荣、一损俱损，是一个命运共同体。在这个地球村里，大国肩负着特殊责任。大国良性互动不是选择题，而是必答题。近年来，中国推进中俄新时代全面战略协作伙伴关系，积极构建中美建设性战略稳定关系，推动形成和平共处、总体稳定、均衡发展的大国关系格局，既惠及彼此，又造福世界。当前，世界百年变局加速演进，天下并不太平。风雨见担当。作为世界主要大国和联合国安理会常任理事国，中俄美应该当好表率，合作应对全球性挑战，共同维护世界和平稳定，为人类进步作出更大贡献。(新华社)", "ctime": 1795077473, "time_str": "16:37:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261119/c682004466.shtml"}, {"id": "5711275", "title": "快手－Ｗ：2026年第三季度收入315.92亿元同比下降11.1%", "content": "快手－Ｗ公告，公司2026年第三季度收入315.92亿元，同比下降11.1%；毛利152.16亿元，同比下降21.7%；经营亏损6.35亿元，上年同期经营利润52.99亿元；期内亏损9.59亿元，上年同期期内利润44.89亿元；经调整利润净额7.9亿元，同比下降84.2%。2026年前三季度收入1008.43亿元，同比下降2.3%；期内利润50.98亿元，同比下降61.9%。2026年第三季度平均日活跃用户4.17亿，平均月活跃用户8.19亿。", "ctime": 1795077364, "time_str": "16:36:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261119/c682004266.shtml"}, {"id": "5711227", "title": "习近平：大国和，则世界安；大国斗，则世界乱", "content": "11月19日下午，国家主席习近平在深圳同俄罗斯总统普京、美国总统特朗普举行中俄美元首会晤。习近平：大国和，则世界安；大国斗，则世界乱。（央视新闻）", "ctime": 1795077234, "time_str": "16:33:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261119/c682003977.shtml"}, {"id": "5711141", "title": "诺唯赞：控股股东增持计划实施完毕，累计增持2.2230%股份", "content": "诺唯赞公告，控股股东南京诺唯赞投资管理集团有限公司此前计划自2026年6月9日起6个月内，以集中竞价方式增持公司A股股份，增持总金额不低于1.15亿元且不高于2.25亿元。截至本公告披露日，诺唯赞投资于2026年6月9日至2026年11月17日累计增持公司A股股份11492599股，约占公司总股本的2.2230%，增持金额为2.22亿元人民币（不含交易费用），已达到本次增持计划拟实施金额的下限，且未超过上限，本次增持计划已实施完毕。增持计划完成后，诺唯赞投资及其一致行动人合计持股3.13亿股，持股比例60.5985%。", "ctime": 1795076848, "time_str": "16:27:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261119/c682003158.shtml"}, {"id": "5711139", "title": "中俄美元首会晤开始举行", "content": "中俄美元首会晤开始举行。（新华社）", "ctime": 1795076804, "time_str": "16:26:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261119/c682003077.shtml"}, {"id": "5711137", "title": "九芝堂：参股公司沃拉德单抗注射液获国内临床试验批准", "content": "九芝堂公告，公司参股公司科信美德与其关联公司美国瑞美德研发的针对胰高血糖素受体的1类创新抗体药沃拉德单抗注射液近日获得国家药品监督管理局核准签发的《药物临床试验批准通知书》，同意本品在中国1型糖尿病患者中开展临床试验。该药为全球首例开发的针对胰高血糖素受体的全人源单克隆抗体临床分子，国内外尚无同类产品上市。", "ctime": 1795076801, "time_str": "16:26:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261119/c682003072.shtml"}, {"id": "5711125", "title": "商务部：1-10月社会消费商品和服务零售总额同比增长2.5%", "content": "商务部消费促进司负责人谈2026年1-10月我国消费市场情况。今年以来，我国消费市场规模继续稳步扩大，呈现商品消费稳、服务消费旺、新型消费热的特点。1-10月，社会消费商品和服务零售总额同比增长2.5%。1-10月，社会消费品零售总额增长1.0%，除汽车以外的消费品零售额增长2.8%。1-10月，服务零售额增长4.9%，增速高于商品零售额4.0个百分点。在消费品以旧换新政策强有力的带动下，绿色、智能消费持续增长。1-10月，限额以上单位通讯器材（含手机）、文化办公用品（含电脑、平板）零售额分别增长16.5%、6.0%。(商务部)", "ctime": 1795076764, "time_str": "16:26:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261119/c682003008.shtml"}, {"id": "5711115", "title": "习近平主持中俄美元首会晤", "content": "11月19日下午，国家主席习近平在深圳同俄罗斯总统普京、美国总统特朗普举行中俄美元首会晤。（央视新闻）", "ctime": 1795076750, "time_str": "16:25:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261119/c682002982.shtml"}, {"id": "5711035", "title": "澄星股份：对外投资进展，澄聚创星完成工商变更登记", "content": "澄星股份公告，公司此前审议通过全资子公司澄星瑞祥与天际新能源、永太科技共同增资澄聚创星（宏达产业投资持股平台），并由该平台投资徐州宏达9514万元持有其45%股权，徐州宏达已于2026年9月29日完成工商变更登记并纳入合并报表范围。近日，澄聚创星已完成工商变更登记手续，取得上海市崇明区市场监督管理局核发的营业执照，注册资本为9514万元整。", "ctime": 1795076345, "time_str": "16:19:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261119/c682002189.shtml"}, {"id": "5710965", "title": "国家主席习近平会见美国总统特朗普", "content": "11月19日下午，国家主席习近平在深圳会见来华出席亚太经合组织领导人非正式会议的美国总统特朗普。习近平指出，过去几个月，从北京到华盛顿，我和特朗普总统共同探索中美两个大国正确相处之道，确立了“中美建设性战略稳定关系”的新定位，并赋予其“基于尊重、公平、对等”的新内涵，受到中美两国人民认可和国际社会欢迎。中美关系总体稳定向好，给两国人民带来实实在在的利益，也给世界注入稳定性和确定性。我期待同特朗普总统一道，继续为中美关系领航掌舵，确保这艘大船始终沿着正确航线扬帆远航。（央视新闻）", "ctime": 1795076092, "time_str": "16:14:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261119/c682001639.shtml"}, {"id": "5710895", "title": "俄罗斯总统普京抵达会晤现场", "content": "11月19日下午，国家主席习近平将在深圳同俄罗斯总统普京、美国总统特朗普举行中俄美元首会晤。普京抵达会晤现场。（央视新闻）", "ctime": 1795075903, "time_str": "16:11:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261119/c682001225.shtml"}, {"id": "5710889", "title": "巴基斯坦军方说打死22名恐怖分子", "content": "巴基斯坦三军新闻局19日发表声明说，巴安全部队16日至17日在该国西北部开伯尔－普什图省开展多次反恐行动，共打死22名恐怖分子。声明说，巴安全部队在该省南瓦济里斯坦地区的行动中与恐怖分子展开激烈交火，共打死15名恐怖分子。此外，安全部队在该省的本努地区和丹格地区的行动中共打死7名恐怖分子，并在行动中缴获大量武器弹药。声明说，清剿行动仍在进行中，巴安全部队和相关部门将继续推进反恐行动，以彻底清除国内恐怖主义势力。（新华社）", "ctime": 1795075876, "time_str": "16:11:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261119/c682001160.shtml"}, {"id": "5710883", "title": "港股收评：恒生指数跌1.95%，恒生科技指数跌2.33%", "content": "港股收盘，恒生指数跌1.95%，恒生科技指数跌2.33%。恒指港股通ETF银华（159318）跌1.75%，港股通科技ETF鹏华（159751）跌2.42%。板块方面，休闲设施、工程咨询服务板块涨幅靠前；航空货运、摄影器材板块跌幅靠前。个股方面，奥克斯电气涨16.84%，MOMENTA-W涨8.21%，华虹宏力涨8.01%，芯碁微装涨7.44%，曦智科技-P涨6.01%；天数智芯跌17.45%，本末科技跌11.49%，怡俊集团控股跌11.07%，登临科技-P跌10.36%，自由黄金-DRS跌9.77%。", "ctime": 1795075854, "time_str": "16:10:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261119/c682001091.shtml"}, {"id": "5710881", "title": "中国航天集团等成立航天时代低空安全技术创新中心", "content": "企查查APP显示，近日，北京航天时代低空安全技术创新中心有限公司成立，经营范围包含：信息系统集成服务；信息系统运行维护服务；大数据服务；互联网数据服务等。企查查股权穿透显示，该公司由中国航天科技集团有限公司全资子公司中国航天时代电子有限公司等共同持股。（人民财讯）", "ctime": 1795075853, "time_str": "16:10:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261119/c682001085.shtml"}, {"id": "5710833", "title": "溯联股份：实控人韩宗俊增持计划实施完毕，累计增持62.17万股", "content": "溯联股份公告，公司实际控制人、控股股东、董事长兼总经理韩宗俊先生此前披露的增持计划实施期限已届满。韩宗俊先生通过深圳证券交易所集中竞价方式累计增持公司股份62.17万股，占公司当前总股本2.02亿股的0.31%，增持金额合计约人民币2000.66万元（不含交易税费），达到本次增持计划金额下限（人民币2,000万元），未超过金额上限（人民币4,000万元）。本次增持计划已实施完毕。增持期间为2026年5月18日至2026年11月17日，增持均价32.18元/股。本次增持后，韩宗俊先生合计持有公司股份6438.05万股，占总股本比例31.85%。", "ctime": 1795075646, "time_str": "16:07:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261119/c681999903.shtml"}, {"id": "5710687", "title": "美诺华：盐酸文拉法辛原料药获欧洲CEP证书", "content": "美诺华公告，公司近日收到欧洲药品质量管理局签发的盐酸文拉法辛原料药欧洲CEP证书（证书编号CEP 2026-030-Rev 00）。公司于2025年12月提交CEP申请，截至目前该项目已投入约125.12万元。盐酸文拉法辛制剂适用于治疗抑郁症及广泛性焦虑症。目前国内含公司共有5家企业获得该原料药CEP证书，2025年该原料药全球销售额为15.11亿美元，全国销售额为6081.66万美元。", "ctime": 1795075251, "time_str": "16:00:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261119/c681998062.shtml"}, {"id": "5710651", "title": "辽宁成大：拟以5000万元-1亿元回购公司股份", "content": "辽宁成大公告，拟以集中竞价交易方式回购公司股份，回购资金总额不低于人民币5000万元（含），不高于人民币1亿元（含），上述金额均不含交易佣金等交易费用。回购价格不超过14.94元/股。回购股份用途为用于员工持股计划或者股权激励。回购期限为自董事会审议通过本方案之日起12个月内，即2026年11月18日至2027年11月17日。按回购资金总额上限1亿元、回购价格上限14.94元/股测算，预计回购股份数量约为669.34万股，约占公司已发行总股本的0.44%；按下限5000万元测算，预计回购股份数量约为334.67万股，约占公司已发行总股本的0.22%。", "ctime": 1795075212, "time_str": "16:00:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261119/c681997976.shtml"}, {"id": "5710603", "title": "键邦股份：拟以1000万元-2000万元回购公司股份", "content": "键邦股份公告，拟以集中竞价交易方式回购公司股份，回购资金总额不低于人民币1000万元（含）且不超过人民币2000万元（含），回购价格不超过人民币43元/股（含），回购股份将在未来适宜时机用于实施员工持股计划或者股权激励。按回购价格上限43元/股测算，本次拟回购股份数量为23.26万股~46.51万股，约占公司总股本的0.15%~0.29%。回购期限为自公司董事会审议通过本次回购方案之日起不超过12个月，资金来源为公司自有资金。", "ctime": 1795074998, "time_str": "15:56:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261119/c681997904.shtml"}, {"id": "5710601", "title": "西子洁能：终止筹划发行H股股票并在香港联交所上市", "content": "西子洁能公告，公司于2026年7月20日披露了筹划发行H股股票并在香港联合交易所有限公司上市的提示性公告，相关事项未提交董事会和股东会审议。鉴于当前宏观经济环境、公司自身实际情况、发展规划，以及结合资本市场环境变化等多重因素的综合考量，经公司与相关中介机构审慎讨论分析后，公司决定终止H股发行上市相关筹备工作。本次终止筹划境外发行股份（H股）事项无需提交董事会和股东会审议。", "ctime": 1795074989, "time_str": "15:56:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261119/c681997901.shtml"}, {"id": "5710589", "title": "以军在约旦河西岸大规模搜捕", "content": "据巴勒斯坦官方通讯社及地区媒体报道，当地时间11月18日，以色列军队在约旦河西岸的拉姆安拉市多个街区及周边西尔瓦德镇、拜图尼亚镇等地展开大规模搜捕行动。以军士兵闯入居住区挨家挨户搜查并现场审讯，多名巴勒斯坦人被铐上手铐带走。据悉，当天以军在约旦河西岸各地共拘押至少34名巴勒斯坦人。 (CCTV国际时讯)", "ctime": 1795074912, "time_str": "15:55:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261119/c681997856.shtml"}, {"id": "5710573", "title": "君禾股份：控股股东君禾控股首次增持30万股，增持金额171.21万元", "content": "君禾股份公告，控股股东宁波君禾控股集团有限公司此前披露增持计划，拟自2026年11月13日起12个月内通过集中竞价交易方式增持公司股份，增持金额不低于3000万元（含）、不超过5000万元（含），增持比例不超过公司总股本的2%。2026年11月19日，君禾控股首次增持公司股份30万股，占公司目前总股本的0.08%，增持金额171.21万元（不含交易费用）。本次增持后，君禾控股持股比例由31.72%增至31.80%。", "ctime": 1795074591, "time_str": "15:49:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261119/c681997743.shtml"}, {"id": "5710569", "title": "中国人民对外友好协会会长杨万明访问尼泊尔", "content": "11月17日至19日，中国人民对外友好协会会长杨万明应邀率团访问尼泊尔，分别会见尼众议院议长阿亚尔、外交部长希西尔、加德满都大都市代理市长丹戈尔、巴德岗市长普拉贾帕蒂等中央和地方政府、议会负责人，与尼中经贸协会主席阿努伯、阿尼哥协会主席苏希尔、尼中文化教育协会主席哈利仕等友好人士进行集体座谈会，就今年8月26日中尼边境发生严重泥石流灾害向尼方致以诚挚慰问，表示中国人民对外友好协会愿为尼方重建家园提供力所能及的支持。双方表示，将认真落实两国领导人达成的重要共识，坚持中尼面向发展与繁荣的世代友好的战略合作伙伴关系定位，不断深化两国地方、议会、民间、经贸、人文、旅游和青少年等领域友好交流合作。(新华社)", "ctime": 1795074485, "time_str": "15:48:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261119/c681997663.shtml"}, {"id": "5710559", "title": "海南热带雨林国家公园发布八条生态旅游精品线路", "content": "记者19日从2026热带雨林生态伙伴大会上获悉，为推动生态资源与户外旅游体验相结合，海南热带雨林国家公园发布八条生态旅游精品线路。八条精品线路涵盖海南长臂猿科普、黎苗文化寻访、五指山登山挑战、低地雨林观瀑、喀斯特地貌探秘、山地雨林瞰海、环海南热带雨林国家公园旅游公路自驾、山海联动体验等方向，设置观察、记录、体验和分享等环节，兼顾教育性、趣味性、可操作性与安全性。据介绍，海南热带雨林是我国分布最集中、类型最多样、保存最完好、连片面积最大的大陆性岛屿型热带雨林，也是众多珍稀濒危物种的重要栖息地。（新华社）", "ctime": 1795074377, "time_str": "15:46:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261119/c681997629.shtml"}, {"id": "5710547", "title": "浙江黎明：控股股东一致行动人佶恒投资协议转让25.53%股份过户完成", "content": "浙江黎明公告，公司控股股东黎明投资的一致行动人佶恒投资此前披露，拟将其持有的30156000股（占总股本20.53%）协议转让给实际控制人之一郑晓敏，将其持有的734.4万股（占总股本5.00%）协议转让给皋颐凯华。本次协议转让已通过上海证券交易所合规性确认，并取得中国证券登记结算有限责任公司出具的《证券过户登记确认书》，过户日期为2026年11月18日，过户数量为37500000股，占公司总股本的25.53%。本次转让后，佶恒投资不再持有公司股权，控股股东黎明投资、实际控制人之一郑晓敏及其一致行动人俞振寰合计控制公司66.48%股权，不会导致公司控股股东、实际控制人发生变化。", "ctime": 1795074314, "time_str": "15:45:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261119/c681997615.shtml"}, {"id": "5710545", "title": "广西修复经营主体信用信息24.9万条", "content": "记者从广西壮族自治区市场监督管理局获悉，今年以来，广西已累计修复经营主体信用信息24.9万条，同比增长65.27%，惠及经营主体17.66万户，帮助经营主体重塑信用、激发活力。(新华社)", "ctime": 1795074305, "time_ const SECTORS  = [{"name": "金融", "hit_count": 36, "etfs": []}, {"name": "人工智能", "hit_count": 33, "etfs": []}, {"name": "半导体", "hit_count": 25, "etfs": []}, {"name": "数据要素", "hit_count": 20, "etfs": []}, {"name": "消费", "hit_count": 13, "etfs": []}, {"name": "军工", "hit_count": 6, "etfs": []}, {"name": "新能源", "hit_count": 3, "etfs": []}, {"name": "机器人", "hit_count": 3, "etfs": []}];
const META     = {"update_time": "2026-11-19 16:59:03", "sentiment_score": 54.357798165137616, "agents": []};

// 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';

  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">

        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
