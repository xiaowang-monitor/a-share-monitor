, "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260702/c677894885.shtml"}, {"id": "4641909", "title": "机构：厄尔尼诺或带来大水电估值修复机会", "content": "华泰证券研报称，2026年5月底南方电网负荷提前创历史新高，大幅提升了市场对极端天气及水电来水的关注度。本报告基于官方机构对我国不同地区主汛期降雨预测和历史上厄尔尼诺/拉尼娜事件对水电站主汛期发电量影响复盘，发现：1）厄尔尼诺事件并不完全代表当年主汛期来水偏枯，反而水电站发电量总体上会受益于厄尔尼诺事件；2）2Q26以来高频出库流量数据不好的雅砻江水电有可能迎来主汛期的发电量yoy转正。我们认为当前水电资产配置性价比突出，估值处于历史较低水平，且2026E股息率较高。", "ctime": 1782972750, "time_str": "14:12:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260702/c677894862.shtml"}, {"id": "4641893", "title": "上期所原油主力合约大跌6%", "content": "上期所原油主力合约大跌6%，报432.6元/桶。", "ctime": 1782972636, "time_str": "14:10:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260702/c677894842.shtml"}, {"id": "4641857", "title": "广电总局：微短剧精品化正成行业自觉行动", "content": "国家广播电视总局相关负责人表示，近期优秀微短剧作品呈现出题材更加丰富、立意更加升华、叙事更加成熟、特色更加突出的鲜明特征，微短剧精品化正成为行业共识和自觉行动。日前在京举办的2026精品微短剧夏季点评会上，广电总局网络司司长王小亮作上述论断后认为，未来的微短剧精品创作，要正方向、守底线，在纷繁的市场中把稳“方向盘”；要树标杆、出精品，在千帆竞发中树立“风向标”。（新华社）", "ctime": 1782972411, "time_str": "14:06:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260702/c677894761.shtml"}, {"id": "4641853", "title": "香港金管局总裁余伟文：拓展人民币跨境应用场景", "content": "香港金管局总裁余伟文发文称，人民币国际化近年来备受关注，推进人民币国际化也是国家“十五五”规划的重点之一。作为全球重要的国际金融中心和离岸人民币业务枢纽，香港一直积极把握机遇，扎实推动多项具体措施，着力于深化离岸人民币市场发展，并持续推动内地与香港金融市场互联互通。与此同时，我们积极推动企业在国际贸易和投融资等实体经济活动中更广泛使用人民币，便利企业跨境营运，强化香港联通内地与国际市场的桥梁角色。我们与业界保持沟通，了解企业使用人民币面临的挑战。与金融市场不同，实体经济的难点在于：企业使用其他国际货币有其惯性，营运与会计等内部系统有一套沿用已久的实务操作流程，未必能支援人民币交易，以致转型动力相对不足；部分企业对银行提供的人民币产品认识有限，亦未深入分析成本效益。针对这些难点，我们积极与业界和内地政策部门磋商，探讨可行解决办法。", "ctime": 1782972385, "time_str": "14:06:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260702/c677894743.shtml"}, {"id": "4641831", "title": "韩国综指跌幅扩大至7%", "content": "韩国综指跌幅扩大至7%，现报7719.31点。个股方面，SK海力士跌超12%，三星电子跌超9%。", "ctime": 1782972291, "time_str": "14:04:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260702/c677894716.shtml"}, {"id": "4641829", "title": "香港证监会：2025年香港管理资产总值按年上升20%至历史新高", "content": "香港证监会今天发布《2025年资产及财富管理活动调查》，显示香港作为领先的全球资产及财富管理枢纽于2025年表现出色，管理资产总值按年上升20%至42.2万亿港元（5.4万亿美元）的历史高位。创纪录的管理资产规模突破了2021年录得的35.5万亿港元（4.6万亿美元）先前高位，其中部分增长动力来自于净资金流入，后者按年急涨193%至2.1万亿港元（2650亿美元），已连续第三年录得上升。在各大板块中，资产管理及基金顾问业务的管理资产按年上升19%至31万亿港元（4万亿美元），而私人银行及私人财富管理业务的管理资产更按年大升24%至12.9万亿港元（1.7万亿美元）。", "ctime": 1782972283, "time_str": "14:04:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260702/c677894714.shtml"}, {"id": "4641799", "title": "阿里整合QoderWork、悟空、MuleRun 将推出新的生产力AI产品", "content": "记者获悉，阿里巴巴正在对旗下Agent产品线进行整合：以QoderWork为基础，整合悟空、MuleRun的能力，整合升级成一款更强大的面向企业生产力场景的AI产品。新产品由陈宇森负责。阿里巴巴方面回应：QoderWork、悟空、MuleRun现有产品服务未来将无缝升级，所有用户权益不会受影响。（科创板日报）", "ctime": 1782972203, "time_str": "14:03:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260702/c677894680.shtml"}, {"id": "4641791", "title": "昆仑万维：天工AI业务ARR突破8亿美元", "content": "昆仑万维7月2日宣布，旗下天工AI在2026年第二季度实现历史性突破：AI Native模型与产品业务年度经常性收入（ARR）已超过8亿美元大关。其中AI短剧平台业务ARR超过7亿美元，AI工具业务ARR突破1亿美元。同时，天工AI旗下短剧平台DramaWave正式完成AI原生化转型。目前平台超过80%的新增发布内容由AI生成，标志着天工AI引领全球短剧行业正式进入AI原生内容时代。（昆仑万维官方公众号）", "ctime": 1782972172, "time_str": "14:02:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260702/c677894668.shtml"}, {"id": "4641777", "title": "振华科技股价大跌 公司回应MLCC涨价与主业无关", "content": "7月2日早盘，振华科技股价大跌。截至午间收盘，公司股价报58.97元/股，跌幅为5.35%。前一个交易日，受MLCC行业巨头涨价利好刺激，振华科技股价涨停。\n\n对于MLCC涨价，振华科技方面独家回应中国证券报·中证金牛座记者称，用于AI服务器的MLCC涨价和公司主业没有关系。市场提到的AI领域MLCC涨价，主要是一些市场份额占比较高的大厂，属于民品领域。公司MLCC业务占比很小，没有做过统计。\n\n“受原材料涨价影响，公司部分产品确实有涨价，但涨价幅度没有市场想象的那么大。除涨价外，公司采取原材料替代、降本增效等举措，以应对原材料涨价带来的冲击。”振华科技方面表示。(中证金牛座)", "ctime": 1782972135, "time_str": "14:02:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260702/c677894660.shtml"}, {"id": "4641531", "title": "创新药板块午后回暖", "content": "创新药板块午后回暖，科伦药业、泽璟制药盘中创新高，海南海药4连板，石药景峰、联化科技、京新药业、华丽家族涨停，热景生物涨超15%，石药创新、万邦医药、津药药业、康芝药业、双鹭药业跟涨。相关ETF方面，科创创新药ETF汇添富（589120）涨1.15%，成交额2.94亿元。", "ctime": 1782971680, "time_str": "13:54:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260702/c677894558.shtml"}, {"id": "4641525", "title": "智度股份间接控股股东正在推进引入战投 已有意向投资人", "content": "智度股份间接控股股东北京智度德正投资有限公司正在推进引入战略投资人。意向产业投资人包括国资和非国资背景的。（澎湃新闻）", "ctime": 1782971624, "time_str": "13:53:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260702/c677894548.shtml"}, {"id": "4641477", "title": "求是网：从战略上发展壮大耐心资本", "content": "中国国新控股有限责任公司党委书记、董事长徐思伟在求是网发文指出，耐心资本是专注于长期投资、价值投资、战略投资的一种资本形式。国有资本作为耐心资本生态中的“国家队”，必须聚焦主责主业，持续优化布局，切实强化核心功能、提升核心竞争力，自觉担当“基石投资者”角色。通过设立或运营专注于长期创新的投资基金，勇于在市场认知不清晰、风险较高的前沿技术与基础研究领域进行前瞻性布局，将资源坚定不移地向前瞻性战略性新兴产业和未来产业集中，向市场释放坚定信号，撬动并引导更多社会资本共同投资。（求是网）", "ctime": 1782971291, "time_str": "13:48:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260702/c677894484.shtml"}, {"id": "4641433", "title": "工信部：全力巩固工业经济稳中向好态势 加强国家关键信息基础设施安全防护", "content": "工业和信息化部部长李乐成7月1日下午主持召开党组会议。会议强调，践行以人民为中心的发展思想，走好新时代党的群众路线，编制实施工业和信息化领域“十五五”系列规划，全力巩固工业经济稳中向好态势，着力提升制造业供给体系质量和信息通信业服务水平，认真解决人民群众急难愁盼问题，努力让人民群众获得感成色更足、幸福感更可持续、安全感更有保障。要增强斗争本领。强化忧患意识、坚持底线思维，发扬斗争精神，知重负重、迎难而上，防范化解各方面风险隐患。加强国家关键信息基础设施安全防护，提升网络和数据安全保障能力，守牢人工智能安全底线。", "ctime": 1782970871, "time_str": "13:41:11", "stock_code": "", "stock_name": "", "stock_market": "" 不应求。富乔（东莞）玻纤有限公司工作人员告诉记者，目前7628、2116、1080等型号均已无现货库存，暂无法承接新订单。“现有客户订单都还交付不过来。”（上证报）", "ctime": 1782970095, "time_str": "13:28:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260702/c677894217.shtml"}, {"id": "4641323", "title": "港股AI硬件股持续下挫，长飞光纤光缆港股跌超19%", "content": "港股AI硬件股持续下挫，剑桥科技港股、广合科技港股跌超20%，长飞光纤光缆港股跌超19%，ASAMT、天数智芯跌超17%，中芯国际港股跌超10%。", "ctime": 1782970055, "time_str": "13:27:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260702/c677894211.shtml"}, {"id": "4641321", "title": "多地证监局近期正推动辖区券商申报基金投顾业务资格", "content": "据记者了解，多地证监局近期正积极推动辖区内符合条件的券商积极申报基金投顾资格，此前中证协已发文明确鼓励更多券商申请基金投顾业务资格。值得关注的是，监管层对基金投顾业务的支持信号正持续强化，证监会将《证券基金投资顾问业务管理办法》列入“需要抓紧研究、择机出台的项目” ，6月证监会主席吴清明确表示要加快推进买方投顾转型，并在2026陆家嘴论坛上宣布鼓励外资持牌机构参与基金投顾业务扩大试点。业内人士指出，此次监管集中推动资格申报，是基金投顾试点转常规之前的重要中间过渡环节。去年8月，基金投顾业务已被正式纳入券商分类评价专项指标，随着试点转常规进入倒计时，资格申报扩容意在引导更多券商提前布局基金投顾业务。 (财联社)", "ctime": 1782970009, "time_str": "13:26:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260702/c677894195.shtml"}, {"id": "4641319", "title": "沪深京三市成交额超2.5万亿元，较上日此时缩量2506亿元", "content": "据同花顺iFinD数据，沪深京三市成交额超2.5万亿元，较上日此时缩量2506亿元，预计全天成交金额约3.3万亿元。截至目前，沪市成交额11284亿元，深市成交额13550亿元，北证50成交额172亿元。", "ctime": 1782969871, "time_str": "13:24:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260702/c677894177.shtml"}, {"id": "4641309", "title": "海南公积金新政：购买自住住房夫妻双方最高贷款基准额提至120万元", "content": "海南省住房公积金管理局发布《关于进一步优化调整住房公积金贷款政策的通知》，该通知自印发之日起施行。新政明确，提高购买自住住房最高贷款基准额度。缴存人家庭购买新建、二手自住住房申请住房公积金贷款，单方缴存住房公积金的，最高贷款基准额度分别由现行新房80万元和二手房60万元统一提高至100万元；夫妻双方均缴存住房公积金的，最高贷款基准额度分别由现行新房110万元和二手房90万元统一提高至120万元。", "ctime": 1782969687, "time_str": "13:21:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "ur 康科学发展，扩大受教育机会。不过，该技术发展速度之快，潜在应用范围之广，也给政策制定者带来重大挑战。大规模、未加管控地快速部署人工智能技术会带来巨大风险，对社会、经济和环境等产生负面影响。报告指出，快速提升的能力与有效的风险管理方法之间的差距可能导致灾难性后果。要充分实现人工智能的效益，同时尽量降低风险，就需要良好的治理。政策制定者通常需要科学证据来实现有效治理，但等到证据确凿时再采取行动，或许为时已晚，因为证据的积累滞后于人工智能的发展速度。这份报告为联合国会员国的决策提供了一个共享的证据基础。", "ctime": 1782968410, "time_str": "13:00:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260702/c677893829.shtml"}, {"id": "4641109", "title": "阿布扎比迎接中国旅游业高管访问团，中国内地往返阿布扎比每周航班总数将达到35班", "content": "阿布扎比文化与旅游部携手阿提哈德航空及旅游业重要合作伙伴，接待了中国旅游业高管访问代表团。近期，阿提哈德航空与中国东方航空宣布成立合资合作项目，未来将为阿布扎比与中国之间新增每周28班往返航班。数据显示，2025年，阿布扎比共接待来自中国的酒店住客24.8万人次，游客平均停留时间增加至2.3天；此外，阿布扎比2025年全年酒店平均入住率达81%。（澎湃新闻）", "ctime": 1782967677, "time_str": "12:47:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260702/c677893700.shtml"}, {"id": "4641107", "title": "极端天气影响到AI了 全球AI数据中心面临极端高温威胁", "content": "热浪席卷多国，全球的大型科技公司也面临着一场严峻的挑战，那就是如何确保人工智能数据中心内的高性能芯片能够持续稳定地运行。报道援引一家气候风险分析机构近日公布的研究数据称，目前全球数据中心高达79%的算力容量面临着各种突发气候灾害的威胁，包括洪水、极端大风及山火等，这些灾害可能导致运营中断、停机时间增加，并推高保险和维修成本。目前，各大科技企业也正意识到气候因素给人工智能数据中心运行带来的挑战，并探索解决方案。微软公司表示，正在通过选址、完善冗余系统和实时监控等手段，来管理极端高温和恶劣天气带来的风险。英伟达公司上周表示，其新型的人工智能服务器可以在最高45摄氏度的冷却液环境下运行。英伟达称，冷却液温度提高1摄氏度，就可以使冷却系统能耗降低约4%。（央视财经）", "ctime": 1782967622, "time_str": "12:47:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260702/c677893694.shtml"}, {"id": "4641095", "title": "珠海发布全国首个城市级“海上新基建”建设行动方案", "content": "广东珠海发布了全国首个城市级“海上新基建”建设行动方案及首批投资机会清单。根据《珠海市“海上新基建”建设行动方案（2026-2028年）》，到2028年底，珠海将全面建成物理、数字、生态空间深度融合的现代化海上新基建体系。33个投资机会清单涵盖智慧航运、深远海绿能、海底算力、海洋牧场、海岛开发等领域，包括万山海域海底数据中心、海上综合能源岛、具身智能海洋特色模拟训练区等。（证券时报）", "ctime": 1782967244, "time_str": "12:40:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260702/c677893628.shtml"}, {"id": "4641   if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
