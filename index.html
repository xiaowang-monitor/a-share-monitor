const NEWS     = [{"id": "5759537", "title": "陈文清赴德国出席第六次中德高级别安全对话", "content": "当地时间11月24日，第六次中德高级别安全对话在德国柏林举行，中共中央政治局委员、中央政法委书记陈文清与德国联邦总理府部长瓦尔肯共同出席并致辞。陈文清说，在习近平主席与德国领导人重要共识引领下，中德关系保持良好发展势头。双方在坚持多边主义、维护地区和平稳定等重大问题上具有相近立场，进一步加强执法安全合作，携手构建更加公正合理的全球治理体系，符合两国人民的根本利益与普遍期待。陈文清说，中德高级别安全对话机制建立以来，两国执法安全等相关部门不断深化交流合作，为落实习近平主席和德国领导人在安全领域达成的共识发挥了积极作用。中方愿与德方一道，进一步夯实机制成果，就共同关注的安全议题加强协调，通过务实合作应对共同风险挑战，维护好两国安全利益，促进国际和地区和平稳定，为共筑持久和平、普遍安全的世界作出更大贡献。中央政法委秘书长訚柏与德国联邦总理府有关负责人共同主持专业交流，中国外交部、工信部、公安部、国家安全部、中国人民银行与德方相关部门针对共同打击跨国有组织犯罪、网络安全及地区热点问题等议题进行深入交流。(新华社)", "ctime": 1795611837, "time_str": "21:03:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261125/c682219259.shtml"}, {"id": "5759497", "title": "期市夜盘开盘，国内期货主力合约涨跌互现，沪锡跌超4%", "content": "期市夜盘开盘，国内期货主力合约涨跌互现。涨幅方面，燃油涨超2%，焦煤、PVC、乙二醇、沥青、焦炭等涨超1%。跌幅方面，沪锡跌超4%，沪银跌超3%，20号胶、菜油、沪锌、沪金、橡胶等跌超1%。", "ctime": 1795611659, "time_str": "21:00:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261125/c682219142.shtml"}, {"id": "5759409", "title": "胡塞武装称沙特主导联军空袭也门荷台达港", "content": "胡塞武装称沙特主导联军空袭也门荷台达港据也门胡塞武装当地时间25日下午消息，沙特主导的多国联军空袭了也门荷台达港。对于这一说法，沙特方面暂无回应。荷台达港是也门最大、最重要的港口之一，目前处于胡塞武装控制之下。胡塞武装军事发言人叶海亚·萨雷亚此前曾表示，如果联军袭击荷台达港，胡塞武装将对沙特吉达港及红海沿岸其他港口发动袭击。未经许可，请勿转载使用。（央视新闻）", "ctime": 1795611172, "time_str": "20:52:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261125/c682219009.shtml"}, {"id": "5759321", "title": "金田股份：首次回购公司股份128万股，支付1011.03万元", "content": "金田股份公告，公司此前审议通过回购公司股份用于员工持股计划或股权激励，回购资金总额不低于人民币2亿元且不超过人民币4亿元，回购价格不超过人民币14.06元/股。2026年11月25日，公司通过集中竞价交易方式首次回购股份128万股，占公司目前总股本的比例为0.07%，成交最高价格7.97元/股，最低价格7.81元/股，支付资金总额1011.03万元（不含交易费用）。", "ctime": 1795610670, "time_str": "20:44:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261125/c682 e": "欧洲议会批准欧盟2027年年度预算", "content": "当地时间11月25日，欧洲议会以406票赞成、184票反对、69票弃权的表决结果，批准欧盟2027年年度预算。欧盟理事会已于23日批准该预算协议。欧洲议会议长在表决后签署了预算案。据欧洲议会当天发布的公报，2027年年度预算的承诺拨款为1997亿欧元，支付拨款为2115亿欧元。前者指欧盟当年承诺可在当年或以后年度支付的金额，后者指当年实际用于支付的金额，包括履行往年承诺所需的款项。与欧盟委员会提出的预算草案相比，最终通过的预算为重点领域增加了3亿欧元拨款。其中，交通和能源网络增加2250万欧元，科研增加2150万欧元，教育交流项目增加1400万欧元，欧盟民事保护机制增加1350万欧元。这是欧盟2021年至2027年长期预算框架下的最后一份年度预算。（央视新闻）", "ctime": 1795607732, "time_str": "19:55:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261125/c682215780.shtml"}, {"id": "5758679", "title": "COMEX白银期货跌超3%", "content": "COMEX白银期货跌超3%，现报39.53美元/盎司。", "ctime": 1795607276, "time_str": "19:47:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261125/c682215646.shtml"}, {"id": "5758669", "title": "*ST开元：公司称经营正常无应披露未披露事项", "content": "*ST开元公告，公司股票交易价格连续两个交易日（2026年11月24日、2026年11月25日）收盘价格涨幅偏离值累计超过30%，属于股票交易异常波动情形。经核实，公司前期披露的信息不存在需要更正、补充之处；未发现近期公共传媒报道可能或已经对公司股票交易价格产生较大影响的未公开重大信息；公司目前经营情况正常，内外部经营环境未发生重大变化；公司无控股股东及实际控制人，经向第一大股东赵君问询，公司及第一大股东不存在应披露而未披露的重大事项或处于筹划阶段的重大事项；股票异常波动期间，第一大股东不存在买卖公司股票的情形。", "ctime": 1795607144, "time_str": "19:45:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261125/c682215612.shtml"}, {"id": "5758667", "title": "北新路桥：控股股东兵团建工集团增持300万股，持股比例增至37.02%", "content": "北新路桥公告，控股股东新疆生产建设兵团建设工程（集团）有限责任公司根据2026年11月21日披露的增持计划，于2026年11月23日至24日通过集中竞价交易方式增持公司股份300万股，占公司总股本的0.18%。本次权益变动后，兵团建工集团合计持有公司股份6.1亿股，占公司总股本的比例由36.84%增加至37.02%，触及1%整数倍。本次增持计划尚未实施完毕，兵团建工集团承诺在增持期间及法定期限内不减持公司股份。", "ctime": 1795607126, "time_str": "19:45:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261125/c682215604.shtml"}, {"id": "5758661", "title": "伊朗副总统称不惧美国封锁 将采取措施稳物价", "content": "伊朗第一副总统穆罕默德·礼萨·阿雷夫25日说，伊朗不惧怕美国海上封锁，伊朗政府正采取措施遏制物价上涨。阿雷夫表示，除沿波斯湾的南部边境外，伊朗其他边境口岸的货物卸载和清关量显著增加，表明伊朗“不惧敌方海上封锁”。他表示，伊朗目前战略物资储备充足，供应丰富。但他未提及具体数据。阿雷夫还表示，政府计划在至少三个月内确保基本生活物资价格稳定。（央视新闻）", "ctime": 1795607041, "time_str": "19:44:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261125/c682215592.shtml"}, {"id": "5758611", "title": "王小洪会见联合国毒罪办执行主任朱马", "content": "国务委员、公安部部长王小洪25日在京会见联合国毒罪办执行主任朱马。王小洪表示，中方将积极践行习近平主席提出的构建人类命运共同体理念和四大全球倡议，坚决维护联合国核心地位，与联合国毒罪办深化禁毒领域务实合作，携手应对跨国有组织犯罪威胁，共创打击电诈国际合作新范式，推动构建更加公正合理的全球治理体系。朱马表示，高度赞赏中方打击毒品等跨国犯罪的坚定决心和务实成效，愿进一步加强合作，共同应对全球安全新挑战。(新华社)", "ctime": 1795606506, "time_str": "19:35:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261125/c682215422.shtml"}, {"id": "5758601", "title": "美军开始在日本冲绳常态部署新型战斗机", "content": "据日本共同社25日报道，美军已开始在其位于日本冲绳县的嘉手纳基地部署新型F-15EX战斗机，以替代老旧的F-15战斗机。这是美军首次在海外基地常态部署该型战斗机。报道称，随着旧型F-15战斗机陆续退役，美军自2022年起在嘉手纳基地采取轮换方式部署F-22、F-35等战斗机。此次部署F-15EX将使该基地恢复战斗机的常态化部署。美军共计划在该基地部署36架F-15EX战斗机。另据《日本经济新闻》报道，F-15EX战斗机的弹药搭载量增至约13吨，还可搭载远程导弹。长期以来，美军在冲绳的军事部署持续引发当地民众对加剧地区紧张局势的担忧。此外，军机噪音、美军人员违法犯罪等问题也长期困扰当地民众。今年10月，冲绳县那霸市发生一起美军士兵涉嫌抢劫杀害一名日本女性的案件，进一步加剧了当地民众对驻日美军的不满情绪。(新华社)", "ctime": 1795606375, "time_str": "19:32:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261125/c682215367.shtml"}, {"id": "5758591", "title": "易联众：金莉莉等5名股东合计增持至6.42%", "content": "易联众公告，股东金莉莉、龚银芝、何彬、何金琳、何芳华通过深圳证券交易所集中竞价方式增持公司股份，不触及要约收购。截至2026年11月24日，上述股东合计持有公司股份27626782股，持股比例为6.42%，其中金莉莉持股198.45万股占0.46%，龚银芝持股12788900股占2.97%，何彬持股429.22万股占1.00%，何金琳持股184.88万股占0.43%，何芳华持股671.24万股占1.56%。本次权益变动不会导致公司控股股东、实际控制人发生变化。", "ctime": 1795606304, "time_str": "19:31:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261125/c682215244.shtml"}, {"id": "5758587", "title": "现货白银失守40美元/盎司", "content": "现货白银失守40美元/盎司，日内跌2.2%。此前白银价格一度升至121.678美元/盎司的历史高点，按此计算，目前较高点累计回落约67%。", "ctime": 1795606291, "time_str": "19:31:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261125/c682215242.shtml"}, {"id": "5758583", "title": "台积电美股盘前跌超4%", "content": "台积电美股盘前跌超4%，现报335.03美元。", "ctime": 1795606266, "time_str": "19:31:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261125/c682215232.shtml"}, {"id": "5758543", "title": "“十五五”时期我国将全面提升粮食安全保障能力", "content": "记者从国家发展改革委了解到，“十五五”时期，我国将扎实推进国家粮食安全战略，以新一轮千亿斤粮食产能提升行动为牵引，建良田、育良种，全面提升粮食生产、购销、储备、加工协同保障能力。目前，全国已累计建成高标准农田超10亿亩，“十五五”期间，还将高质量推进高标准农田建设，逐步把具备条件的永久基本农田全部建成高标准农田。同时，布局“十五五”时期现代种业工程，培育高产优质、抗逆广适新品种，把当家品种牢牢攥在自己手里。在提升粮食产能方面，要在确保播种面积稳定的基础上，进一步提高单产水平，推动良田、良种、良机、良法集成增效，实现主要粮油作物大面积均衡增产。（央视新闻）", "ctime": 1795605997, "time_str": "19:26:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261125/c682215100.shtml"}, {"id": "5758533", "title": "西班牙年初高铁脱轨事故初步原因指向焊接缺陷与地基沉降", "content": "总台记者当地时间11月25日获悉，三名司法专家在一份初步报告中指出，今年年初西班牙科尔多瓦省高铁列车脱轨事故的主要原因，可能是轨道焊接施工不当及轨道下方地基沉降。报告称，事故轨道的一处钢轨焊接点连接了两段材质和使用年限不同的钢轨，可能存在施工缺陷。同时，另一侧钢轨此前出现6.4毫米的持续沉降，在列车动态载荷的反复冲击下，可能加速了钢轨焊接处的裂纹扩展并最终导致断裂。专家强调，目前仍有部分检测结果尚未公布，相关原因假设仍需进一步验证。（央视新闻）", "ctime": 1795605922, "time_str": "19:25:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261125/c682215086.shtml"}, {"id": "5758527", "title": "中航重机：增持计划主体由胡灵红变更为冯彦成，尚需股东会审议", "content": "中航重机公告，公司于2025年12月16日披露部分董事及高级管理人员增持股份计划，合计拟增持金额430-860万元。截至2026年11月25日，上述增持主体累计增持公司股份29.36万股，占公司总股本的0.0189%，增持总金额为人民币484.18万元，已达到前次增持计划下限430万元的112.60%。前董事、总经理胡灵红女士因个人原因无法继续增持，公司于2026年11月25日召开第八届董事会第五次临时会议，审议通过将增持计划主体由胡灵红女士变更为董事、总经理冯彦成先生，冯彦成先生将在胡灵红女士已增持56.53万元的基础上继续履行其剩余未完成的增持计划。除部分增持主体变化外，原增持计划主要内容不变。该议案尚需提交股东会审议。", "ctime": 1795605891, "time_str": "19:24:51", "s // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `

}

  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
