de": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260622/c677610366.shtml"}, {"id": "4565223", "title": "液冷服务器板块震荡拉升，大元泵业涨停", "content": "液冷服务器板块震荡拉升，大元泵业涨停，冰轮环境此前封板，川润股份、永太科技、英维克跟涨。消息面上，四部门《促进人工智能与能源双向赋能行动方案》已落地，明确新建大型AI智算中心须100%配套液冷，2028年前完成高功耗风冷机房改造，未达标者将受限用电审批并上调电价。东数西算枢纽要求PUE≤1.2，风冷机房普遍PUE为1.3–1.4无法达标，液冷可将PUE压至1.1以内，已成为项目立项硬性门槛。多地配套采购补贴，推动IDC与云厂商加速替换，冷板式液冷国家标准下半年实施，行业规模化条件成熟，三年高增逻辑确立。", "ctime": 1782109049, "time_str": "14:17:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260622/c677610020.shtml"}, {"id": "4565199", "title": "“脱欧”公投十年后，多数英国人给出“差评”", "content": "智库欧洲对外关系委员会21日发布的调查结果显示，多数英国选民认为脱离欧盟是“错误”决定，对他们关心的几乎所有问题都产生了负面影响。这项调查于5月7日至14日展开，超过2000人作答。受访者中，57%的人认为“脱欧”是错误决定，13%回答“不知道”，30%认为决定“正确”。调查显示，66%的受访者认为“脱欧”对英国生活成本产生负面影响；认为“脱欧”殃及英国经济、年轻人发展机会和非法移民管控的人分别占65%、57%和56%。即便在当年投票支持“脱欧”的受访者中，也有58%的人认为英国的移民问题愈加突出。至于“脱欧”带来的主要好处，绝大多数受访者回答“不知道”和“所给选项均不是”。（新华社）", "ctime": 1782108945, "time_str": "14:15:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260622/c677610000.shtml"}, {"id": "4565139", "title": "三星电子向韩国所有员工开放ChatGPT和Codex", "content": "OpenAI宣布，三星电子正在向全球员工部署ChatGPT Enterprise（企业版）和Codex，以加速公司内部对AI的采用。根据协议，ChatGPT和Codex将提供给韩国所有三星电子员工，以及全球范围内所有设备体验（DX）部门员工。这是OpenAI迄今为止最大的企业级部署之一。三星电子将在其运营中全面使用ChatGPT和Codex，涵盖研发、制造、营销、企业职能以及其他业务领域。(财联社)", "ctime": 1782108624, "time_str": "14:10:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260622/c677609841.shtml"}, {"id": "4565095", "title": "创业板指涨超2%再度刷新历史新高", "content": "创业板指涨超2%再度刷新历史新高，成份股中同花顺、阳光电源、香农芯创涨幅居前。", "ctime": 1782108487, "time_str": "14:08:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260622/c677609749.shtml"}, {"id": "4565075", "title": "伊朗媒体称伊美谈判达成5项要点", "content": "伊朗和美国在瑞士举行首轮谈判后，伊朗谈判团队说，达成的协议包含5项要点：为巩固黎巴嫩停火，将建立一个监督机制，伊朗将参与其中。在霍尔木兹海峡管理问题上，为确保海峡逐步重新开放，已决定设立一条联络热线。在伊美谅解备忘录第13条执行之后，伊朗才会进入最终阶段的谈判。伊朗与卡塔尔签署了关于解冻伊朗被冻结资产的执行谅解备忘录。美国方面签发了为期60天的解除对伊朗石油、石化产品及其衍生品制裁的文件。（新华社）", "ctime": 1782108400, "time_str": "14:06:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260622/c677609717.shtml"}, {"id": "4565055", "title": "印度继续对原产于或进口自中国的聚对苯二甲酸乙二醇酯树脂征收反倾销税", "content": "据中国贸易救济信息网，6月19日，印度财政部税收局发布第12/2026-Customs(ADD)号通报称，接受印度商工部于2026年3月20日对原产于或进口自中国的特性粘度大于等于0.72分升/克的聚对苯二甲酸乙二醇酯树脂[Polyethylene terephthalate resin having an intrinsic viscosity of 0.72 decilitres per gram or higher]作出的第一次反倾销日落复审终裁建议，决定继续对中国涉案产品征收为期5年的反倾销税，税额为200.66美元/吨。涉案产品为瓶级PET树脂，不包括再生PET树脂。本案涉及印度海关编码39076110、39076190、39076930和39076990项下的产品。措施自本通报发布于官方公报之日起生效。", "ctime": 1782108261, "time_str": "14:04:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260622/c677609628.shtml"}, {"id": "4565045", "title": "三部门：支持外资企业参与提振消费行动", "content": "商务部、国家发展改革委、财政部发布印发《利用外资固稳促优行动方案》。其中提到，支持外资企业参与提振消费行动。支持外资企业充分参与绿色消费、国际消费中心城市建设等促消费工作，不得以外资品牌产品、外资企业为由，排斥符合条件的产品或服务适用各类促消费支持政策。优化营商网络环境。建立健全涉企网络侵权举报联动机制，优化举报处置流程，发布涉企网络侵权信息线上举报渠道相关指引，维护外资企业网络合法权益。", "ctime": 1782108248, "time_str": "14:04:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260622/c677609624.shtml"}, {"id": "4565027", "title": "隆华科技集团晶联光电无铟靶材助力光伏技术实现新突破", "content": "近日，正泰新能李子佳博士、苏州大学杨新波老师团队在国际顶刊《Science》发布全新无铟钙钛矿/硅叠层电池技术，该技术所制备的太阳能电池实现了33.2%的光电转换效率。技术所用关键靶材由隆华科技集团旗下晶联光电提供，RPD-SnOx氧化锡靶材是由晶联光电研发团队自主研发生产，凭借靶材优异的成膜特性，构筑兼具界面复合层、透明导电电极双重功能的纯锡基薄膜，成功助力该技术实现新的突破。这项突破标志着在无铟(Indium-free)太阳能电池领域取得了重要进展，为未来低成本、高效率光伏技术的发展提供了新路径。该技术的成功，摆脱了对稀有金属铟的依赖，同时保持了高转换效率，具有重要的产业应用前景。（人民财讯）", "ctime": 1782108222, "time_str": "14:03:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260622/c677609609.shtml"}, {"id": "4564973", "title": "商务部等部门发布利用外资固稳促优行动方案，围绕扩大市场准入等提出15条举措", "content": "商务部等部门6月22日发布利用外资固稳促优行动方案，围绕扩大市场准入、提升外商投资便利度、提高投资促进水平、健全外商投资服务保障体系、优化外资管理五方面提出15条举措。方案聚焦服务业、金融业、医药产业等扩大市场准入。提出稳步扩大职业技能培训机构、职业院校、高水平理工农医类大学对外开放试点；支持更多外资机构利用包括国债期货在内的风险管理工具，加强金融风险管理；支持外资机构依法开展基金投资顾问业务；抓紧研究报批进一步扩大生物技术、外商独资医院领域开放试点区域范围等。（新华社）", "ctime": 1782108134, "time_str": "14:02:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260622/c677609567.shtml"}, {"id": "4564887", "title": "端午节假期666.7万人次出入境", "content": "记者6月22日从国家移民管理局获悉，今年端午节假期全国边检机关共计保障666.7万人次中外人员出入境，日均222.2万人次，较去年端午节同期增长12.9%。单日出入境通关最高峰出现在6月20日，达230.8万人次。 其中，内地居民出入境292.1万人次，较去年同期增长5.5%；港澳台居民出入境296.9万人次，较去年同期增长18.4%；外国人入出境77.7万人次，较去年同期增长23.3%。入境外国人中，适用免签政策入境26.6万人次，较去年同期增长15.2%。共计查验出入境交通运输工具30.5万架（艘、列、辆）次，较去年同期增长16%。 按照国家移民局统一部署，全国边检机关加强出入境流量监测，及时发布本口岸客流高峰预警提示，为广大群众出行提供参考；科学组织勤务，开足查验通道，全力保障中外旅客快速通关；密切协作配合，强化应急处置，稳妥做好交通配套综合保障。端午节期间，全国口岸出入境安全高效、平稳有序。(新华社)", "ctime": 1782108027, "time_str": "14:00:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260622/c677609531.shtml"}, {"id": "4564803", "title": "A股三大指数午后均涨超1%", "content": "A股三大指数午后均涨超1%，大金融、培育钻石、化工、有色金属板块涨幅居前。", "ctime": 1782107510, "time_str": "13:51:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260622/c677609405.shtml"}, {"id": "4564779", "title": "培育钻石板块涨幅扩大，惠丰钻石30cm涨停", "content": "培育钻石板块涨幅扩大，惠丰钻石30cm涨停，力量钻石、四方达20cm涨停，黄河旋风、恒林股份此前封板。东吴证券研报分析认为，AI芯片功耗提高，金刚石散热成为未来重要解决方案。随着2.5D/3D异构集成技术(如CoWoS、SOIC)的普及，芯片内部的热流密度呈指数级上升。金刚石热导率是铜的5倍以上，是硅的近15倍；CTE约为1.1ppm/K，与硅(2.6ppm/K)较为接近，能够有效降低热循环中的热应力。", "ctime": 1782107294, "time_str": "13:48:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260622/c677609309.shtml"}, {"id": "4564773", "title": "沪深京三市成交额超3万亿元，较上日此时放量3923亿元", "content": "据同花顺iFinD数据，沪深京三市成交额超3万亿元，较上日此时放量3923亿元，预计全天成交金额约3.8万亿元。截至目前，沪市成交额13624亿元，深市成交额16185亿元，北证50成交额202亿元。", "ctime": 1782107197, "time_str": "13:46:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260622/c677609249.shtml"}, {"id": "4564749", "title": "零售板块局部走低，锦和商管跌停", "content": "零售板块局部走低，锦和商管跌停，宁波中百、浙江东日、华致酒行、供销大集跟跌。", "ctime": 1782106542, "time_str": "13:35:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260622/c677609067.shtml"}, {"id": "4564703", "title": "上证50股指期货(IH)主力合约日内涨超2%", "content": "上证50股指期货(IH)主力合约日内涨超2%，现报2957.0点。", "ctime": 1782105977, "time_str": "13:26:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260622/c677608926.shtml"}, {"id": "4564689", "title": "富时中国A50指数期货涨1%", "content": "富时中国A50指数期货由跌转涨，现涨幅扩大至1%。", "ctime": 1782105811, "time_str": "13:23:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260622/c677608889.shtml"}, {"id": "4564681", "title": "港股中资券商股午后持续冲高，中信证券涨超9%", "content": "港股中资券商股午后持续冲高，中信证券涨超9%，广发证券、中金公司涨超7%，中信建投证券、东方证券涨超5%。", "ctime": 1782105764, "time_str": "13:22:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260622/c677608879.shtml"}, {"id": "4564675", "title": "安徽社科院林斐谈长鑫科技上市：合肥“押中”的不是具体企业，而是产业趋势", "content": "从IPO正式受理到注册生效仅耗时165天，长鑫科技集团股份有限公司（以下简称“长鑫科技”）成为资本市场关注焦点。日前，证监会同意长鑫科技首次公开发行股票并在科创板上市的注册申请。这也意味着，有“中国海力士”之称的DRAM（动态随机存取存储器)巨头登陆资本市场已“箭在弦上”。据了解，长鑫科技在持续搅动半导体行业与资本市场之时，也成为合肥市再度“押中”“赌对”明星企业的最新案例。经穿透股权计算后，合肥国资合计持有长鑫科技的股权比例超过35%。在长鑫科技之前，合肥市已成功“押中”京东方、蔚来等知名企业。对于外界将合肥市接连成功“押注”明星企业的原因归结为政府“豪赌”的说法，安徽省社会科学院研究员、安徽省发展战略研究会副会长林斐日前在接受记者采访时并不认可：“合肥市成功的原因不是简单‘押注’，而是基于对国家战略方向、产业演进规律和技术变革趋势的战略研判，‘押中’的也不是具体企业，而是产业发展趋势。”（中国经营报）", "ctime": 1782105670, "time_str": "13:21:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260622/c677608849.shtml"}, {"id": "4564671", "title": "广发银行：上调代理上海黄金交易所个人延期业务保证金比例", "content": "广发银行发布关于调整代理上海黄金交易所个人延期业务保证金比例的公告。自2026年6月22日（星期一）收盘清算时起，广发银行黄金延期合约的保证金比例由100%调整至140%，白银延期合约的保证金比例由100%调整至140%。相关延期合约交易保证金比例的后续调整，将另行通知。请投资者做好仓位控制，理性投资。（财联社）", "ctime": 1782105603, "time_str": "13:20:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260622/c677608828.shtml"}, {"id": "4564667", "title": "新华保险触及涨停", "content": "新华保险触及涨停，成交额29.12亿元。", "ctime": 1782105340, "time_str": "13:15:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260622/c677608735.shtml"}, {"id": "4564655", "title": "互联网金融板块午后拉升，银之杰20cm涨停", "content": "互联网金融板块午后拉升，银之杰20cm涨停，联迪信息涨超15%，汇金科技涨超10%，赢时胜、艾融软件、同花顺、兆日科技跟涨。相关ETF方面，金融科技ETF富国（515720）涨2.54%，成交额965.13万元，金融科技ETF易方达（159299）涨2.67%，成交额1577.11万元。", "ctime": 1782105253, "time_str": "13:14:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260622/c677608684.shtml"}, {"id": "4564649", "title": "能源金属板块午后震荡回暖，永杉锂业涨停", "content": "能源金属板块午后震荡回暖，永杉锂业涨停，腾远钴业、寒锐钴业、华友钴业、博迁新材、天齐锂业跟涨。相关ETF方面，有色ETF富国（159168）涨3.93%，成交额4511.99万元，有色ETF汇添富（159652）涨2.9%，成交额2.53亿元。", "ctime": 1782105162, "time_str": "13:12:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260622/c677608660.shtml"}, {"id": "4564591", "title": "氟化工板块午后持续走高，多氟多此前涨停", "content": "氟化工板块午后持续走高，多氟多此前涨停，巨化股份、三美股份、永和股份、金石资源、昊华科技等跟涨。", "ctime": 1782104651, "time_str": "13:04:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260622/c677608515.shtml"}, {"id": "4564565", "title": "高伟达与零克云达成战略合作 布局MaaS业务新赛道", "content": "近日，高伟达与零克云(北京)科技有限公司正式签署战略合作协议。双方将充分发挥各自在AI产品研发、解决方案研发、算力调度及MaaS(Model as a Service,模型即服务)资源配置等方面的核心优势，建立长期稳定的战略合作关系，共同开拓行业MaaS服务新生态。(人民财讯)", "ctime": 1782104241, "time_str": "12:57:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260622/c677608432.shtml"}, {"id": "4564563", "title": "以部长称整个黎巴嫩都是以色列的打击目标", "content": "以色列国家安全部长本-格维尔当地时间6月21日在接受媒体采访时表示，整个黎巴嫩都应该成为以色列的游乐场和打击目标。此外，对于美伊谈判，本-格维尔表示，伊朗人应该被“轰炸、轰炸、再轰炸”，美国人在这件事上是天真的，美国不应向伊朗妥协，也不应签署任何协议。他还声称，自己无惧任何谴责。 （CCTV国际时讯）", "ctime": 1782103771, "time_str": "12:49:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260622/c677608345.shtml"}, {"id": "4564561", "title": "澳大利亚警方查获2.7吨可卡因", "content": "澳大利亚联邦警察局22日通报说，澳警方在悉尼西北部查获2.7吨可卡因，为该国迄今最大宗可卡因走私案。 澳联邦警察局在一份声明中说，警方19日在悉尼伦敦德里地区一处房产的地下储藏间内发现了这批可卡因。两名犯罪嫌疑人已被逮捕并遭起诉，如果罪名成立，最高面临终身监禁。 昆士兰州警方5月在该州一处水域发现40公斤可卡因，后续又查获178公斤可卡因和142公斤甲基苯丙胺（俗称“冰毒”），逮捕6名犯罪嫌疑人。澳警方说，在悉尼查获的可卡因和上述毒品可能是同一批走私货。目前，涉嫌参与此次走私的母船被扣押在所罗门群岛。(新华社)", "ctime": 1782103619, "time_str": "12:46:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260622/c677608318.shtml"}, {"id": "4564559", "title": "央行购金意愿创纪录，超跌+低PE概念股揭晓", "content": "近日，世界黄金协会发布的《2026年全球央行黄金储备调研》（CBGR）显示，近九成受访央行认为，未来12个月内全球央行黄金储备将继续增加。这种信心同时也反映在各央行自身的储备计划中：45％的受访储备管理者表示，预计其所在机构将在未来12个月内增加黄金储备，这一比例打破了历史纪录。2026年年初，黄金概念曾是大热门题材，多只股票一度创下历史新高。但从当前股价表现来看，不少黄金概念股已有明显降温。据证券时报·数据宝统计，截至6月18日收盘，最新收盘价与年内高点相比，46只黄金概念股回撤幅度超20%。6股回撤幅度超50%，分别是盛达资源、白银有色、山东黄金、湖南白银、曼卡龙、晓程科技。上述回撤幅度超20%的黄金概念股中，截至6月18日收盘，滚动市盈率（PE）低于30倍的有28只，航民股份、菜百股份滚动市盈率低于10倍。从资金角度来看，截至6月18日收盘，滚动市盈率低于30倍且回撤超20%的黄金概念股中，6月以来融资净买入超1亿元的有4只，分别是洛阳钼业、江西铜业、西部矿业、藏格矿业。(人民财讯)", "ctime": 1782103499, "time_str": "12:44:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260622/c677608248.shtml"}, {"id": "4564553", "title": "同比增长31.1%，今年前5个月深圳进出口规模继续保持内地城市首位", "content": "深圳海关6月22日发布统计数据显示，今年前5个月，深圳累计进出口2.32万亿元，较去年同期增长31.1%，进出口规模继续保持内地城市首位。其中，出口1.22万亿元，增长15.9%；进口1.1万亿元，增长53.4%。今年以来，深圳外贸延续稳中有进的良好态势。(人民财讯)", "ctime": 1782103074, "time_str": "12:37:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260622/c677608162.shtml"}, {"id": "4564545", "title": "6月22日午间公告一览：英矽智能与SK生物制药达成一项价值高达25亿美元的神经免疫疾病领域的AI驱动研发合作", "content": "英矽智能公告，公司已与SK生物制药公司达成一项研发合作，旨在发掘AI驱动的针对中枢神经系统神经免疫疾病领域的创新候选药物。在该合作中，英矽智能将利用其覆盖标靶验证、生成式化学和分子优化的专有Pharma.AI平台，结合临床前药物发现专业能力，以发现、设计并优化用于神经免疫适应症的新型候选药物。SK生物制药则将发挥其在神经免疫疾病领域深厚的研发与临床能力，主导所有合作计划后期开发及商业化推进。", "ctime": 1782102944, "time_str": "12:35:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260622/c677608134.shtml"}, {"id": "4564511", "title": "豆包APP灰测打车出行", "content": "记者获悉，豆包APP在北京、杭州两地灰测一键打车服务，由曹操出行提供打车服务。（科创板日报）", "ctime": 1782102261, "time_str": "12:24:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260622/c677607949.shtml"}, {"id": "4564509", "title": "美军在加勒比海打击“贩毒船”致2人死亡", "content": "美军南方司令部当地时间21日发表声明说，美军当天在加勒比海打击了一艘“贩毒船”，船上2人被打死。声明说，根据美军南方司令部司令弗朗西斯·多诺万的命令，美军“南方之矛”联合特遣部队对一艘由“被认定的恐怖组织”运营的船只实施打击，打死船上2名男性，无美军人员伤亡。自2025年9月初以来，美军在加勒比海和东太平洋对美方指称的所谓“贩毒船”进行多次打击，并于当年11月13日宣布发起“南方之矛”军事行动。然而，美国政府一直未公布任何可以证明其攻击目标涉毒的证据。（央视新闻）", "ctime": 1782102246, "time_str": "12:24:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260622/c677607946.shtml"}, {"id": "4564507", "title": "中汽协：1—5月销量排名前十轿车生产 // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
