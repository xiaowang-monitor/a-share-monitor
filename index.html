}
.score-bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s; }
.up { color: var(--red); }
.down { color: var(--green); }
.pulse { animation: pulse 2s infinite; }
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}
.glow { box-shadow: 0 0 20px rgba(59,130,246,0.15); }

3:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260626/c677749948.shtml"}, {"id": "4605233", "title": "民德电子：控股子公司增资引入投资者，公司持股比例下降至42.3380%", "content": "民德电子公告，公司控股子公司浙江广芯微电子有限公司拟通过增资扩股方式引入投资者华西银峰投资有限责任公司和昌科知衡数智（北京）创业投资基金中心（有限合伙），其中华西资本以人民币3500万元认购新增注册资本215.66万元，占增资后注册资本3.2864%；昌发展资本以人民币1000万元认购新增注册资本61.62万元，占增资后注册资本0.9390%。公司及广芯微电子其他股东均放弃本次增资优先认购权。增资后广芯微电子注册资本由6284.85万元增加至6562.12万元，公司持有广芯微电子股权比例由44.2059%下降至42.3380%，公司仍为第一大股东且能实施控制，广芯微电子继续纳入合并报表范围。", "ctime": 1782467626, "time_str": "17:53:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260626/c677749947.shtml"}, {"id": "4605231", "title": "青龙管业：中标5.57亿元PCCP管材采购项目", "content": "青龙管业公告，公司此前披露被确认为广西桂西北治旱龙江河谷灌区工程PCCP管材采购（重）的中标单位。近日，公司收到河池市龙江河谷灌区开发建设有限公司签发的《中标通知书》，中标金额为5.57亿元，占公司2025年度经审计营业总收入的21.18%，交货期为48个月。", "ctime": 1782467613, "time_str": "17:53:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260626/c677749942.shtml"}, {"id": "4605229", "title": "世界油阀通航量回升 油轮租金大幅跳涨", "content": "标普全球能源公司25日发布报告说，24日共有78艘船舶通过霍尔木兹海峡，创下美以伊战事爆发以来单日最高通航纪录。本月霍尔木兹海峡的船舶日均通航量已恢复至冲突前水平的约57%。记者了解到，霍尔木兹海峡通航量回升，叠加多国秋冬能源补库，国际油轮租金大幅跳涨，传导到国内上下游呈现冷暖分化。一方面航道局势缓和后，航运企业避险保费回落，叠加运价上涨，盈利空间上升。而炼化企业承压明显，海运成本抬升直接推高原油到岸价，压缩炼油加工利润。由于我国原油高度依赖进口，不少炼化企业仍抢抓当前窗口期加快原油补库。（央视财经）", "ctime": 1782467603, "time_str": "17:53:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260626/c677749938.shtml"}, {"id": "4605227", "title": "包浩斯国际：2026财年由盈转亏，净亏损300万港元", "content": "包浩斯国际公告，截至2026年3月31日止年度，集团营业额1.77亿港元，同比减少8.9%；毛利1.26亿港元，同比减少9.0%。本年度录得净亏损300万港元，而2025年同期为纯利1170万港元。每股基本及摊薄亏损为0.8港仙，2025年同期每股基本及摊薄盈利为3.2港仙。", "ctime": 1782467576, "time_str": "17:52:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": 持公司股份149.35万股，持股比例由11.90%降至10.85%。本次减持属于此前披露的减持计划，不触及强制要约收购义务，不会导致公司控股股东及实际控制人变化。", "ctime": 1782467353, "time_str": "17:49:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260626/c677749795.shtml"}, {"id": "4605175", "title": "绿色经济：预期年度纯利约850万港元，较上年减少约690万港元", "content": "绿色经济公告，公司根据未经审核管理账目初步审阅，预期截至2026年3月31日止年度录得本公司拥有人应占未经审核综合纯利约850万港元，较截至2025年3月31日止年度的约1540万港元减少约690万港元。利润减少主要由于持续经营业务溢利减少约1650万港元（因毛利减少约2220万港元及销售费用增加约820万港元，部分被其他收入增加约970万港元及所得税开支减少约260万港元抵销），以及已终止经营业务溢利增加约960万港元（因出售录得收益约1100万港元）。全年业绩仍在落实中。", "ctime": 1782467152, "time_str": "17:45:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260626/c677749709.shtml"}, {"id": "4605171", "title": "华达科技：董事刘丹群减持计划实施完毕，累计减持615万股占总股本1.31%", "content": "华达科技公告，董事刘丹群女士出具的《股份减持进展告知函》，截至2026年6月25日，刘丹群通过集中竞价交易方式减持465万股，通过大宗交易方式减持150万股，合计减持615万股，占公司总股本的比例为1.31%，本次减持计划已实施完毕。本次减持价格区间为32.32～40.14元/股，减持总金额为2.22亿元。本次减持后，刘丹群持有公司股份1846.04万股，占公司总股本比例为3.93%。", "ctime": 1782467137, "time_str": "17:45:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260626/c677749678.shtml"}, {"id": "4605151", "title": "华亚智能：实控人及一致行动人持股比例因可转债转股被动稀释至47.84%", "content": "华亚智能公告，2026年6月22日至6月25日期间，公司“华亚转债”累计转股279.41万股，总股本由1.35亿股增至1.38亿股。在公司实际控制人及一致行动人（王彩男、陆巧英、王景余、苏州春雨欣投资咨询服务合伙企业）持股数量不变的情况下，持股比例由48.83%被动稀释至47.84%，权益变动触及1%整数倍。本次变动不涉及持股数量变化，不会导致公司控股股东及实际控制人发生变化。", "ctime": 1782467100, "time_str": "17:45:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260626/c677749597.shtml"}, {"id": "4605149", "title": "金河生物：拟投资5.5亿元建设地霉素及辅酶Q10中间体项目", "content": "金河生物公告，公司拟投资建设年产10000吨地霉素、20000吨辅酶Q10中间体柔性生产建设项目。该事项已获公司第七届董事会第三次会议审议通过，预计总投资5.5亿元，资金来源为自有资金或自筹资金。项目计划建设起止年限为2026年08月01日至2028年04月30日，实施主体为金河生物科技股份有限公司，建设地点为托克托经济开发区西区，不涉及新增获取土地。", 续性。该补助预计对公司2026年度利润总额的影响金额为827.14万元，全部计入其他收益。", "ctime": 1782466833, "time_str": "17:40:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260626/c677749458.shtml"}, {"id": "4605117", "title": "彩虹股份：控股股东咸阳金控将所持如意广电90%股权无偿划转至如意电子，已完成", "content": "彩虹股份公告，公司于2026年6月26日收到控股股东咸阳金控函告，根据咸阳市国资委关于国企改革的统一部署，咸阳金控将持有的如意广电90%股权无偿划转至如意电子。如意广电持有公司股份1.09亿股，占公司总股本的3.03%。本次划转后，如意电子持有如意广电90%股权，如意电子与咸阳金控均为咸阳产投全资子公司，实际控制人均为咸阳市国资委。咸阳金控与如意广电仍为一致行动人，合计持股34.04%不变，本次权益变动不会导致公司控股股东及实际控制人变化，不会导致所持股份数量发生变化。本次国有股权划转已经完成。", "ctime": 1782466804, "time_str": "17:40:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260626/c677749423.shtml"}, {"id": "4605115", "title": "中国医疗队在尼日尔成功实施手臂神经修复手术", "content": "第25批援尼日尔中国医疗队日前在尼日尔综合示范医院成功实施了全臂丛神经根性撕脱伤修复手术，实现当地在高难度周围神经显微外科领域的突破。患者约8个月前因摩托车交通事故导致右上肢严重损伤，右上肢运动和感觉功能完全丧失。由于当地此前尚不具备相关专科诊疗能力，患者最终来到尼日尔综合示范医院，经中国医疗队诊断并实施手术。根据患者病情，第25批援尼日尔中国医疗队创伤骨科医生王静威制定手术方案，并与中国国内臂丛神经损伤专家进行远程会诊，最终确定采用健侧C7神经根跨侧转位联合自体尺神经移植桥接重建术。手术全程历时6个小时，尼日尔医务人员参与了本次手术和现场教学。据悉，医疗队还将持续开展随访，并与尼方合作收集相关临床资料，为双方开展周围神经损伤领域科研合作提供支持。（新华社）", "ctime": 1782466800, "time_str": "17:40:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260626/c677749421.shtml"}, {"id": "4605111", "title": "航天工程：不涉及商业航天及航天相关业务，股价异动经自查无应披露未披露信息", "content": "航天工程公告，公司股票于2026年6月24日、6月25日、6月26日连续3个交易日内日收盘价格涨幅偏离值累计达到20%，构成股票交易异常波动。经公司自查及向控股股东、实际控制人核实，公司目前生产经营活动正常，内外部经营环境未发生重大变化；公司不涉及商业航天及航天相关业务；公司控股股东及实际控制人不存在应披露而未披露的重大信息，包括但不限于重大资产重组、股份发行、重大交易类事项、业务重组、股份回购、股权激励、破产重整、重大业务合作、引进战略投资者等重大事项。公司未发现可能对公司股价产生较大影响的重大事件和敏感信息，控股股东、实际控制人及公司董事、高级管理人员在异动期间不存在买卖公司股票的情况。", "ctime": 1782466794, "time_str": "17:39:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260626/c677749410.shtml"}, {"id": "4605107", "title": "威派格：股票交易异常波动，公司无液冷产品收入且2024年及2025年连续两年亏损", "content": "威派格公告，公司股票于2026年6月24日、6月25日、6月26日连续三个交易日内日收盘价格涨幅偏离值累计超过20%，属于股票交易异常波动。经公司自查并书面询证控股股东、实际控制人，截至公告披露日，公司、控股股东和实际控制人不存在应披露而未披露的重大事项或重要信息。公司经营业绩已连续两年亏损，2024年度归属于上市公司股东的净利润为-2.12亿元，2025年度归属于上市公司股东的净利润为-1.53亿元；截至目前，公司无液冷产品收入。", "ctime": 1782466782, "time_str": "17:39:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260626/c677749405.shtml"}, {"id": "4605101", "title": "中国证监会严肃查处私募基金玖瀛资产、腾创投资违法违规案件", "content": "近日，中国证监会对深圳前海玖瀛资产管理有限公司（以下简称玖瀛资产）、深圳市前海腾创投资有限公司（以下简称腾创投资）及相关责任人员违法违规行为作出行政处罚。经查，玖瀛资产、腾创投资及相关责任人员利用私募基金向玖瀛资产及关联主体输送利益，报送虚假信息，严重侵害投资者合法权益，严重违反私募基金法律法规。深圳证监局对玖瀛资产、腾创投资罚没5800余万元，对3名责任人员罚款100余万元，对玖瀛资产、腾创投资实际控制人采取5年证券市场禁入措施及5年证券市场禁止交易措施。中国证券投资基金业协会将按程序注销相关私募机构管理人登记。对于相关违法行为可能涉及的犯罪问题线索，证券监管部门将坚持应移尽移的工作原则，依法依规移送公安机关。（证监会）", "ctime": 1782466749, "time_str": "17:39:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260626/c677749395.shtml"}, {"id": "4605093", "title": "*ST尼雅：董事长王毅2026年6月26日离任，未持有公司股份", "content": "*ST尼雅公告，公司董事长王毅因工作调动向董事会申请辞去董事、董事长、董事会战略委员会主任委员、董事会薪酬与考核委员会成员等职务，辞职报告自送达董事会时生效。王毅未持有公司股份，不存在未履行完毕的公开承诺。公司副董事长柯超代行董事长职务，将尽快完成董事补选和新任董事长选举工作。", "ctime": 1782466667, "time_str": "17:37:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260626/c677749359.shtml"}, {"id": "4605089", "title": "有研新材：暂无磷化铟相关产品和技术", "content": "有研新材公告称，公司关注到近期磷化铟概念受市场关注度较高，公司暂无磷化铟相关产品和技术。2026年6月9日至2026年6月26日，公司股票交易价格涨幅累计达119.75%，股票价格近期涨幅较大，可能存在短期涨幅较大后的下跌风险，敬请广大投资者理性投资，审慎决策，注意防范投资风险。", "ctime": 1782466593, "time_str": "17:36:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260626/c677749319.shtml"}, {"id": "4605085", "title": "第四届链博会今天闭幕，多项指标创新高", "content": "为期5天的第四届链博会今天（6月26日）落下帷幕。在今天下午举办的新闻发布会上，中国贸促会对外公布，本届链博会多项指标创历届链博 // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
