ws.10jqka.com.cn/20261012/c680608460.shtml"}, {"id": "5368051", "title": "英国首相：拒绝深化对欧关系将是“重大失职”", "content": "当地时间10月12日，英国首相伯纳姆在议会下议院发表讲话时，呼吁英国与欧盟建立更紧密的关系，强调维持现有关系已不足以满足英国的需要，拒绝探索新的合作可能性将构成“重大失职”。伯纳姆表示，达成有利于促进经济增长的协议符合英国利益，他将在未来五周努力推动相关谈判。他认为，英国应以开放态度讨论与欧盟的长期关系，以促进经济增长、管控移民、维护共同价值观和保障安全。（央视新闻）", "ctime": 1791818584, "time_str": "23:23:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261012/c680608402.shtml"}, {"id": "5368033", "title": "也门胡塞武装称沙特空袭也门北部致9死7伤", "content": "据也门胡塞武装控制的马西拉电视台12日报道，沙特阿拉伯战机当天空袭了也门北部焦夫省，造成至少9人死亡、7人受伤。报道说，焦夫省北部靠近沙特边境的海卜沙夫地区一处政府办公设施和一栋民宅遭到空袭，9名死者中包括5名儿童和一名妇女。报道说，胡塞武装指责沙特袭击民用和政府设施。沙特方面尚未就此次空袭及人员伤亡情况作出回应。（新华社）", "ctime": 1791818410, "time_str": "23:20:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261012/c680608390.shtml"}, {"id": "5368027", "title": "美国放松对俄罗斯柴油贸易制裁，特朗普被指为中期选举对俄让步", "content": "美国上周宣布放松对俄罗斯柴油贸易制裁，美国国内民主、共和两党对此都有批评之声，认为美国总统特朗普“出于对中期选举的考量而单方面对俄让步”。（CCTV国际时讯）", "ctime": 1791818214, "time_str": "23:16:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261012/c680608375.shtml"}, {"id": "5368021", "title": "尼日利亚西北部袭击事件致22人死亡", "content": "尼日利亚方面12日消息，该国西北部扎姆法拉州11日发生袭击事件，造成22人死亡。袭击者当天洗劫了3个村庄并纵火焚烧了12辆汽车。袭击发生时，有安全人员在现场执勤。扎姆法拉州一名社区领袖说，遇害者主要是商人，事发时他们正乘车前往当地每周举行的集市。尼日利亚军方发言人表示，遇害者中还包括4名军方人员。近年来，尼日利亚面临恐怖主义、绑架、匪患等多重安全挑战，武装袭击事件频发。（央视新闻）", "ctime": 1791818172, "time_str": "23:16:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261012/c680608374.shtml"}, {"id": "5368009", "title": "英国首相伯纳姆：“欧洲制造”相关政策对英国制造商构成风险", "content": "英国首相伯纳姆表示，“欧洲制造”相关政策对英国制造商构成风险。（新浪财经）", "ctime": 1791818101, "time_str": "23:15:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261012/c680608369.shtml"}, {"id": "5368005", "title": "中国政府向约旦捐赠人道主义医疗物资", "content": "中国政府向约旦捐赠人道主义医疗物资交接仪式12日在约旦首都安曼举行。这批医疗物资将主要用于救助加沙地带来约旦的伤病人员。据了解，这批物资包括医疗设备和医疗耗材，将被分发到约旦多个医院和医疗机构。（新华社）", "ctime": 1791818081, "time_str": "23:14:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261012/c680608368.shtml"}, {"id": "5367999", "title": "原糖期货重拾涨势 交易员防范厄尔尼诺冲击", "content": "原糖期货上涨，看涨交易员继续押注强劲的厄尔尼诺现象将导致主要产糖国供应趋紧。纽约交投最活跃的原糖期货合约一度上涨3.2%，恢复了上周伦敦糖业周之前开始的涨势。Green Pool Commodity Specialists周一在一份报告中表示，在创纪录降雨以及厄尔尼诺预期影响下，市场消化了巴西中南部地区2026-27年度甘蔗产量预估可能“大幅下调”的影响，推动期货价格走高。预计本周降雨还将增强，可能令收割进一步推迟。与此同时，分析师写道，投机者“在这轮涨势中一直积极买入，而生产商显然也利用价格回升带来的机会进行卖出”。（财联社）", "ctime": 1791817989, "time_str": "23:13:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261012/c680608362.shtml"}, {"id": "5367959", "title": "马迪塞宣誓就任爱沙尼亚总统", "content": "爱沙尼亚当选总统于勒·马迪塞12日下午在首都塔林宣誓就职，成为该国历史上第二位女性总统。马迪塞在就职致辞中表示，爱沙尼亚能否保持现有国家面貌并继续发展，取决于社会信任以及对未来的希望和勇气。针对当前国际局势的不稳定性，马迪塞强调要加强国防建设，并深化与波罗的海国家、北欧国家及波兰等盟友的合作。（新华社）", "ctime": 1791817456, "time_str": "23:04:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261012/c680608338.shtml"}, {"id": "5367955", "title": "英伟达与思科计划制定 USFP 开放行业规范", "content": "英伟达与思科联合推出新型可插拔光模块外形规格USFP（超密小型可插拔），旨在扩展AI工厂的网络规模。USFP是首个支持每通道400Gb/s电信号的模块，单模块容量最高可达12.8Tb/s，使AI建设者能在不增加网络层级的前提下连接更多计算系统，同时降低每比特数据的传输功耗。相比现有的200Gb/s-per-lane光模块，USFP的带宽密度提升4倍，能效提升1.3倍。英伟达和思科正与TE Connectivity和安费诺合作，围绕USFP构建多源硬件生态系统。", "ctime": 1791817367, "time_str": "23:02:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261012/c680608328.shtml"}, {"id": "5367937", "title": "期市夜盘收盘，国内期货主力合约多数上涨，低硫燃油涨超6%", "content": "期市夜盘收盘，国内期货主力合约多数上涨。涨幅方面，低硫燃油涨超6%，燃油涨超4%，丙烯、LPG、聚丙烯、塑料、纯苯等涨超1%。跌幅方面，甲醇跌超5%，合成橡胶、PVC、沥青、乙二醇跌超1%。", "ctime": 1791817255, "time_str": "23:00:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261012/c680608320.shtml"}, {"id": "5367929", "title": "欧盟外交与安全政策高级代表卡拉斯：欧盟正在制定限制俄罗斯签证的提案", "content": "欧盟外交与安全政策高级代表卡拉斯：欧盟正在制定限制俄罗斯签证的提案。", "ctime": 1791817233, "time_str": "23:00:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261012/c680608316.shtml"}, {"id": "5367899", "title": "险资“追涨杀跌”致科技股持续回调？机构人士回应", "content": "10月12日，A股四大指数集体收跌，其中创业板指、科创综指均跌超2%，沪深两市成交额1.54万亿，较上一个交易日缩量3627亿。全市场超过4300只个股下跌，银行股逆势走强，但AI算力硬件等科技方向继续承压。记者多方采访发现，更多机构观点不一。有保险资管机构人士对记者表示，目前监管层面没有对保险公司规定统一的硬性止损线，各家机构为保证自身收益或控制风险，会有内部止损要求，但“个别机构阶段性调仓并不足以说明其一直是‘追涨杀跌’的投资风格”。一位券商非银分析师向记者表示，保险资管机构会自行设置止损线，但具体标准可以调整。该分析师提到，部分保险账户可能在季度末、年末出于报表调整等因素调整权益仓位，“但是这些资金体量没有那么大，至于说影响到大盘的大幅调整，这是不成立的。”该分析师表示。另有机构人士表示，美联储加息、美债利率走高等因素是境内市场波动的前提因素，“资金行为只是加速了下跌”。（第一财经）", "ctime": 1791817116, "time_str": "22:58:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261012/c680608309.shtml"}, {"id": "5367847", "title": "重庆机电：签订协议出售标的公司51%股权，代价8979.16万元", "content": "重庆机电公告，2026年10月12日，公司与控股股东之全资附属公司四联集团签订股权转让协议，同意转让标的公司51%股权，四联集团同意受让，出售代价为人民币8979.16万元。出售事项构成上市规则第14A章下本公司的关连交易。", "ctime": 1791816638, "time_str": "22:50:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261012/c680608269.shtml"}, {"id": "5367845", "title": "美捷汇控股：Max Premier完成53.77%股份买卖并提要约", "content": "美捷汇控股公告，公司此前披露Max Premier Limited拟收购公司股份并提出强制性无条件现金要约。本次公告称，买卖协议已于二零二六年十月五日完成，Max Premier Limited及其一致行动人士合共持有2.98亿股，占已发行股本总额53.77%；要约价为每股现金0.3428港元，公司已申请股份自二零二六年十月十三日上午九时正起恢复买卖。", "ctime": 1791816632, "time_str": "22:50:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261012/c680608268.shtml"}, {"id": "5367823", "title": "我国部署“十五五”铁路科技创新重点任务", "content": "记者12日从国家铁路局了解到，国家铁路局近日印发《铁路科技创新“十五五”规划》，部署基础研究和前沿技术、工程建造、技术装备、运输服务、数智铁路、安全保障、绿色低碳等领域重点任务，提出到2030年基本建成引领铁路现代化发展的科技创新体系。（新华社）", "ctime": 1791816463, "time_str": "22:47:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261012/c680608250.shtml"}, {"id": "5367779", "title": "锅圈：控股股东承诺1年不出售42.76%股份", "content": "锅圈公告，公司收到控股股东杨明超先生、孟先进先生、李欣华先生及相关企业出具的承诺函，三位股东自2026年10月13日至2027年10月12日不以任何方式出售其直接及间接持有的公司股份，涉及10.85亿股，占已发行股本约42.76%。", "ctime": 1791816218, "time_str": "22:43:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261012/c680608227.shtml"}, {"id": "5367769", "title": "道琼斯指数涨0.52%，报51922.1点", "content": "道琼斯指数涨0.52%，报51922.1点，创9月22日以来新高。", "ctime": 1791816038, "time_str": "22:40:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261012/c680608208.shtml"}, {"id": "5367763", "title": "沙特利雅得国际机场将继续关闭至当地时间18日", "content": "当地时间10月12日，航空通告消息，位于沙特阿拉伯首都利雅得的哈立德国王国际机场将继续关闭至协调世界时10月17日21时，即沙特当地时间10月18日零时。沙特民航总局当天稍早表示，为继续完成机场设施安全检查，哈立德国王国际机场暂停运营的安排将延长，但当时未公布具体恢复时间。近期，哈立德国王国际机场连续遭到袭击，造成多人伤亡。（央视新闻）", "ctime": 1791815972, "time_str": "22:39:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261012/c680608187.shtml"}, {"id": "5367749", "title": "波兰军方称“爱国者”导弹交付将延迟", "content": "当地时间10月12日，波兰武装部队作战司令伊雷纽什·诺瓦克表示，“爱国者”PAC-3导弹的交付“肯定会延迟”，与美国签订的其他武器合同也可能出现延迟。当天，在“华沙安全论坛”的一场讨论中，诺瓦克表示，由于美国卷入世界其他地区的冲突，波兰以及波罗的海国家与美方签订的武器合同都会延迟执行，“这在‘爱国者’系统的PAC-3导弹方面非常明显——它们肯定会延迟”。此外，诺瓦克补充说，目前不确定“海马斯”高机动火箭炮系统的合同能否按时执行，但当前局势肯定会影响其他合同的执行，已经规划并已签订合同的订单也将出现进一步延迟。（央视新闻）", "ctime": 1791815760, "time_str": "22:36:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261012/c680608169.shtml"}, {"id": "5367715", "title": "觅蜂科技提出4D数据重建框架MEgoVista", "content": "近日，觅蜂科技联合西北工业大学、西安交通大学提出第一视角运动重建框架“MEgoVista”，可将第一视角（Ego）视频更精准地转化为具身模型预训练所需的4D数据。相关论文已发布。\n\n当前，Ego视频虽让数据采集走进真实生活与工作场景，但“拍下操作”不等于“获得4D数据”。系统需准确辨认佩戴者双手、还原手指弯曲姿态并测量手在空间中的移动距离，仍面临场景覆盖与重建精度难兼顾、单摄像头距离估计偏差、多人互动遮挡导致跟踪中断等多重挑战。(上海证券报)", "ctime": 1791815388, "time_str": "22:29:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261012/c680608135.shtml"}, {"id": "5367697", "title": "俄方最新回应泽连斯基：普京愿意下令不在选举日当天对乌克兰实施打击", "content": "10月12日，俄罗斯总统新闻秘书佩斯科夫表示，“如果乌克兰真的想举行选举，普京愿意下令不在选举日当天对乌克兰实施打击”。10月11日，泽连斯基回应美国总统特朗普所称“乌克兰该换总统了”的言论时称：“请告诉普京，给我们两个月，60天的全面停火，我们将组织选举。”（澎湃新闻）", "ctime": 1791815196, "time_str": "22:26:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261012/c680608109.shtml"}, {"id": "5367683", "title": "现货白银跌超1%", "content": "现货白银跌超1%，现报60.3美元/盎司。", "ctime": 1791814717, "time_str": "22:18:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261012/c680608064.shtml"}, {"id": "5367653", "title": "北京市规自委出台新文件 推动新建住宅公共品质提升", "content": "记者从北京市规划和自然资源委员会了解到，《关于本市住宅公共空间品质提升的意见（试行）》今日正式发布。《意见》提出，为丰富北京市住宅空间形态，优先在存在地形高差、滨水沿线或位于轨道“微中心”的居住用地开展抬板设计；同时，明确了社区与城市空间合理衔接、技术指标计算相关规则、立体空间复合利用、创造开放城市空间等方面要求。（央视新闻）", "ctime": 1791814111, "time_str": "22:08:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261012/c680607993.shtml"}, {"id": "5367643", "title": "上期所沥青主力合约跌超3%", "content": "上期所沥青主力合约跌超3%，报5005元/吨。", "ctime": 1791814000, "time_str": "22:06:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261012/c680607980.shtml"}, {"id": "5367625", "title": "黎外长近五年来首访莫斯科 俄方重申支持黎领土完整", "content": "俄罗斯外交部网站12日发布通报说，俄外长拉夫罗夫当天在莫斯科会见到访的黎巴嫩外交部长优素福·拉吉，这是黎外长近五年来首次访问莫斯科。拉夫罗夫重申俄方支持维护黎巴嫩的主权和领土完整。（新华社）", "ctime": 1791813891, "time_str": "22:04:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261012/c680607973.shtml"}, {"id": "5367617", "title": "也门战事何以来到重大升级与外溢的危险边缘", "content": "沙特阿拉伯主导的多国联军证实，沙特首都利雅得哈立德国王国际机场再度遭袭。也门胡塞武装表示使用导弹和无人机对沙特境内机场和能源设施实施4次军事行动。分析人士认为，胡塞武装加大袭击力度主要是迫于前线军事压力，同时也有国内政治考量。若双方对抗持续升级，更多国家卷入冲突的风险将上升，地区局势或更趋复杂化。（新华社）", "ctime": 1791813828, "time_str": "22:03:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261012/c680607954.shtml"}, {"id": "5367573", "title": "国际原油价格持续走高 升破107美元/桶", "content": "国际原油价格持续走高，WTI原油期货价格涨2.28%，报93.94美元/桶；布伦特原油期货价格涨2.25%，报107.073美元/桶。", "ctime": 1791813523, "time_str": "21:58:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261012/c680607849.shtml"}, {"id": "5367503", "title": "王毅与俄罗斯总统助理、海事委员会主席帕特鲁舍夫举行会晤", "content": "2026年10月12日，中共中央政治局委员、中央外办主任王毅在北京与俄罗斯总统助理、海事委员会主席帕特鲁舍夫举行会晤。王毅说，当今世界处于百年未有之大变局。海洋是联通世界的蓝色纽带，事关世界各国安全和长远发展。中俄同为联合国安理会常任理事国和海洋大国，在国际海洋事务方面都肩负重要职责，具有广阔合作前景。中方建设“冰上丝绸之路”与俄方推进北极航道建设不谋而合，海洋事务合作在中俄全面战略协作中的重要性不断提升。中方愿同俄方一道，加强两国海洋战略对接，实现优势互补，维护彼此正当海洋权益，维护亚太地区海上安全，维护全球关键航道正常通行。要尊重沿岸国主权与安全，保障能源资源稳定供应和产供链安全运行；拓展双方涉海和北极事务交流，发动中俄关系发展的“蓝色引擎”，为完善全球海洋治理贡献中俄力量，推动构建海洋命运共同体。（外交部）", "ctime": 1791812761, "time_str": "21:46:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261012/c680607692.shtml"}, {"id": "5367491", "title": "微软准备在数据中心大规模部署自研芯片 规模达数吉瓦", "content": "微软公司正准备在数据中心部署最新版自研芯片，目标是主要依靠自家硬件为其AI软件提供算力支持。微软周一表示，计划在其数据中心部署总规模达数吉瓦的Maia芯片，其中最新一代Maia 300将从明年开始投入部署。这类芯片专为AI推理而设计，即利用AI模型执行总结电话会议内容或回答研究问题等任务。微软、亚马逊和Alphabet旗下谷歌都在开发自研人工智能加速器，此举可能有助于降低他们对英伟达 const SECTORS  = [{"name": "金融", "hit_count": 59, "etfs": []}, {"name": "人工智能", "hit_count": 42, "etfs": []}, {"name": "数据要素", "hit_count": 31, "etfs": []}, {"name": "半导体", "hit_count": 28, "etfs": []}, {"name": "消费", "hit_count": 19, "etfs": []}, {"name": "新能源", "hit_count": 17, "etfs": []}, {"name": "军工", "hit_count": 11, "etfs": []}, {"name": "机器人", "hit_count": 5, "etfs": []}];
const META     = {"update_time": "2026-10-13 00:40:47", "sentiment_score": 57.25190839694656, "agents": []};

// 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
