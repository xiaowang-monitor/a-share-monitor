", "ctime": 1778042155, "time_str": "12:35:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260506/c676469112.shtml"}, {"id": "4323009", "title": "美元/日元短线跳水，日内跌超1%", "content": "美元/日元短线跳水，日内跌超1%。", "ctime": 1778042056, "time_str": "12:34:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260506/c676469054.shtml"}, {"id": "4323003", "title": "韩国KOSPI指数日内暴涨7%", "content": "韩国KOSPI指数日内暴涨7%，现报7422.26点。三星电子飙涨16%，SK海力士公司大涨超10%。", "ctime": 1778041976, "time_str": "12:32:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260506/c676469035.shtml"}, {"id": "4323001", "title": "国家数据领域国际合作上海综合试点启动", "content": "记者从5月6日在上海开幕的2026全球数字合作交流会暨全球数据周活动上了解到，在国家数据局指导下，上海作为数据领域国际合作首批试点，正式启动国家数据领域国际合作上海综合试点工作。本次试点聚焦6大板块、17项具体任务，面向2030年，上海着力构建设施领先、规则互认、载体赋能、场景融合的国际数据合作新体系，紧扣释放数据价值、繁荣数字经济、推进数字出海服务，打造“高标准跨境数据新基座、高质量规则互认新体系、高能级国际合作新载体、高协同出海服务新生态”的工作格局，为参与全球数字治理、推动数据跨境便捷流动探索创新。（央视新闻）", "ctime": 1778041969, "time_str": "12:32:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260506/c676469033.shtml"}, {"id": "4322997", "title": "全球AI电源芯片龙头MPS：今年营收目标上调至同比增长85%", "content": "全球电源芯片龙头MPS（Monolithic Power Systems）首席财务官在财报电话会上表示，受光模块和交换机电源需求拉动，公司将制造产能目标从40亿美元上调至约60亿美元。他提到，今年一季度后，管理层看到去年开始的强劲订单势头仍在延续，有信心把将今年的营收目标进一步上调，预计将同比增长约85%。（界面新闻）", "ctime": 1778041851, "time_str": "12:30:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260506/c676469009.shtml"}, {"id": "4322977", "title": "泰国4月整体通胀率达2.89%，创三年多新高", "content": "泰国商务部周三公布，泰国4月整体居民消费价格指数同比上涨2.89%，为三年多来最大涨幅；3月该指数曾同比下降0.08%。商务部表示，能源价格高企推升了通胀水平，本次数据远高于媒体调查预估的1.81%涨幅。这是自2025年3月以来泰国整体CPI首次实现同比上涨，同时创下2023年2月以来的最高同比增幅。泰国商务部维持今年全年通胀预期在1.5%至2.5%区间，处于央行1%至3%的目标区间之内。剔除波动较大的能源及生鲜食品价格后，泰国4月核心CPI同比上涨0.83%。泰国贸易政策与战略办公室主任南塔蓬 吉拉莱萨蓬在新闻发布会上表示，受能源价格影响，预计5月整体通胀率将达3.06%，二季度整体通胀率为3.67%。南塔蓬称，尽管经济增速放缓、通胀居高不下，但泰国经济并未陷入滞胀。（新浪财经）", "ctime": 1778041410, "time_str": "12:23:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260506/c676468908.shtml"}, {"id": "4322967", "title": "五一假期长三角铁路发送超2138万人次，同比增长超5.6%", "content": "5月6日，记者从中国铁路上海局集团有限公司获悉，刚刚过去的“五一”假期（5月1日-5日）长三角铁路发送旅客约2138.1万人次，日均发送427.6万人次，日均较去年同期多发送旅客约22.8万人次，增幅超5.6%。其中，5月1日单日发送旅客473.8万人次，创上铁集团单日旅客发送量新高，5月5日返程最高峰发送431.1万人次。5月6日，长三角铁路将继续迎来返程客流小高峰，预计当天发送旅客370万人次，计划增开旅客列车260列（其中直通旅客列车121列，管内旅客列车139列，含夜间高铁列车104列），动车组重联256列。（澎湃新闻）", "ctime": 1778041106, "time_str": "12:18:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260506/c676468831.shtml"}, {"id": "4322963", "title": "聚焦四个方面 新版绿色物流国家标准增加这些关键指标", "content": "记者今天了解到，5月1日起，新修订的《绿色物流指标构成与核算方法》国家标准开始实施。相比2018年版标准，新版标准对绿色物流评价指标体系进行升级，从管理、资源、运营、环境四个方面，共提出14个二级指标和42个三级指标。在管理方面，此次修订将“管理指标”提级为一级指标，引导企业在物流活动中采用先进技术和管理方法，优化资源利用，减少环境影响和温室气体排放。在资源方面，此次修订新增可再生能源发电与储能系统、环保油墨使用率等指标，修订载运工具吨公里能耗、减量化包装使用率等指标，从设施建设、设备选用、能源消耗、包装材料等方面，系统推动物流要素资源绿色化转型。（央视新闻）", "ctime": 1778040921, "time_str": "12:15:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260506/c676468708.shtml"}, {"id": "4322959", "title": "中东战火烧高能源成本 意大利瓷砖业遭重创", "content": "近日，受中东局势紧张影响，全球能源价格上涨，意大利瓷砖制造企业的成本也水涨船高。意大利共有超过120家瓷砖制造企业，雇佣1.8万名员工，年营业收入约为60亿欧元。其中大多数企业集中在北部鲁比亚市的萨苏奥洛区，该区域生产了全国超过80%的瓷砖。由于生产瓷砖所用的窑炉高度依赖天然气，该行业极其容易受到天然气供应中断或价格上涨的冲击。（央视新闻）", "ctime": 1778040866, "time_str": "12:14:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260506/c676468697.shtml"}, {"id": "4322945", "title": "5月6日午间公告一览：石四药集团三款药品获国家药监局生产注册批件", "content": "盛龙股份公告，根据中共洛阳国晟投资控股集团有限公司委员会的决定，任命李建科同志为中共洛阳盛龙矿业集团股份有限公司委员会党委委员、副书记、纪委书记，免去张保民同志中共洛阳盛龙矿业集团股份有限公司委员会党委委员、副书记职务，免去王二军同志中共洛阳盛龙矿业集团股份有限公司委员会党委委员、纪委书记职务。石四药集团发布自愿公告，公司成为国内首家获批脂溶性维生素注射液（I）（10ml）药品生产注册批件的企业，该产品属化学药品第3类、视同通过一致性评价；同时获批盐酸二甲双胍片（0.5g和0.25g）、甲磺酸多沙唑嗪缓释片（4mg）药品生产注册批件，均属化学药品第4类、视同通过一致性评价。相关批件将进一步丰富公司仿制药产品管线，增强在专科用药领域的市场竞争力，并为后续收入增长提供新动力。", "ctime": 1778040401, "time_str": "12:06:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260506/c676468432.shtml"}, {"id": "4322925", "title": "“五一”假期海南离岛免税购物金额5.54亿元", "content": "据海口海关统计，今年“五一”假期期间（2026年5月1日至5月5日），海口海关共监管离岛免税购物金额5.54亿元，购物人数8.46万人次，购物件数44.17万件，比2025年同期分别增长10.4%、7.4%、3.8%。面对假期增长的客流与购物需求，海口海关提前部署各项监管服务措施，全面应用“集中+自动”审单、远程视频查验等便利化模式，确保免税品入出库高效顺畅，热门商品得以实现快速补货上架，有效满足了节日市场的消费需求。（央视新闻）", "ctime": 1778040028, "time_str": "12:00:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260506/c676468328.shtml"}, {"id": "4322923", "title": "港股午评：恒生指数涨0.79%，恒生科技指数涨1.32%", "content": "港股午间收盘，恒生指数涨0.79%，恒生科技指数涨1.32%。恒指港股通ETF银华（159318）涨1.2%，港股通科技ETF鹏华（159751）涨1.71%。板块方面，工业集团企业、休闲设备与用品板块涨幅靠前；生命科学工具、医疗保健技术板块跌幅靠前。个股方面，澜起科技涨19.39%，兆易创新涨16.95%，广合科技涨16.2%，美图公司涨15.99%，华虹半导体涨12.61%；力量发展跌11.97%，轩竹生物-B跌9.39%，基石药业-B跌9.01%，五一视界跌7.26%，迅策跌6.92%。", "ctime": 1778040019, "time_str": "12:00:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260506/c676468325.shtml"}, {"id": "4322911", "title": "Meta计划面向用户推出AI助手", "content": "据报道，Meta Platforms正开发智能助手工具，其中包括一款由其新型Muse Spark人工智能模型驱动的高级数字助手，旨在为用户执行日常任务。（界面新闻）", "ctime": 1778039664, "time_str": "11:54:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260506/c676468214.shtml"}, {"id": "4322901", "title": "美国ITC发布对有源电缆及其组件的337部分终裁", "content": "4月30日，美国国际贸易委员会（ITC）发布公告称，对特定有源电缆及其组件作出337部分终裁，对本案行政法官于2026年4月14日作出的初裁（No.43、44）不予复审，即基于和解，终止对列名被告美国Molex、爱尔兰TE Connectivity的调查；本案调查全部终止。", "ctime": 1778039417, "time_str": "11:50:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260506/c676468140.shtml"}, {"id": "4322889", "title": "古巴外长驳斥美国务卿“古巴未受石油封锁”言论", "content": "古巴外长罗德里格斯5日表示，美国国务卿鲁比奥称“古巴并未遭受石油封锁”的言论是在“撒谎”。\n\n根据美国国务院官网发布的消息，当天下午，鲁比奥在白宫主持记者会时称古巴并未遭受石油封锁。\n\n罗德里格斯在社交媒体上说，现实不容掩盖：1月29日，美国总统特朗普签署行政令，威胁对向古巴提供石油的国家输美商品加征从价关税。过去一段时间，只有一艘运送燃料的船只抵达古巴。所有古巴的供应商都受到恐吓和威胁，这违反了自由贸易规则和航行自由原则。5月1日颁布的新行政令扩大了对古巴制裁范围。(新华社)", "ctime": 1778038897, "time_str": "11:41:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260506/c676467994.shtml"}, {"id": "4322887", "title": "美股光模块巨头Lumentum总裁：公司订单已排到2028年 盈利能力将进一步增强", "content": "美股光模块巨头Lumentum总裁兼CEO迈克尔·赫尔斯顿表示，Lumentum第三财季业绩表现卓越，营收同比增长90%，创下8.08亿美元的历史新高。虽然营收增长持续占据新闻头条，但近期业绩更令人印象深刻的是利润率的提升。第三财季，毛利率环比提升540个基点，营业利润率环比提升700个基点。利润率的提升得益于多方面因素。随着共封装光学器件和光路开关等关键增长动力开始发挥作用，预计盈利能力将进一步增强。赫尔斯顿表示，公司的订单已经排到2028年，因为连接GPU集群所需的组件的需求增长速度已经远远超过了供应的生产速度。（财联社）", "ctime": 1778038862, "time_str": "11:41:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260506/c676467988.shtml"}, {"id": "4322879", "title": "淘宝510答题免单零点已上线，新增AI试穿玩法", "content": "今日零点，“淘宝答题免单”页面正式上线。据悉，作为淘宝510周年庆的招牌活动，答题免单前年首次上线就吸引了上亿人次围观，今年已经是第三届。规则上，5月6日0点到5月9日24点，用户搜索\"淘宝免单\"，根据活动页面的提示线索猜数字。提交金额后系统会自动匹配历史订单，金额对上了直接参与成功，不够可以喊朋友组队凑单。只要全队猜中且在名额内，就能赢免单红包。时间上，每天11点、15点各一场答题。此外，今年还在晚间时段新增了AI试穿新玩法。（新浪科技）", "ctime": 1778038778, "time_str": "11:39:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260506/c676467966.shtml"}, {"id": "4322869", "title": "四会富仕：公司目前已实现800G光模块PCB的小批量交付", "content": "四会富仕5月6日在互动平台表示，公司目前已实现800G光模块PCB的小批量交付；同时，1.6T光模块PCB也经客户样品认证成功。但目前相关产品营收占比低于1%。", "ctime": // 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
