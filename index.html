期间，共出现1243例全因超额死亡。据此前估算，法国6月17日至7月2日热浪期间的全因超额死亡数为5764例。(新华社)", "ctime": 1787196532, "time_str": "11:28:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260820/c679127346.shtml"}, {"id": "4990361", "title": "仲量联行：亚太区商业地产投资市场回暖 中国核心资产流动性持续改善", "content": "仲量联行8月20日发布的报告显示，2026年第二季度亚太地区商业地产投资额达455亿美元，同比增长38%；上半年投资总量达925亿美元，同比增长35%。仲量联行中国区投资及资本市场部负责人庞树东表示，2026年上半年，中国内地及香港商业地产投资市场活跃度提升，核心资产流动性持续改善。当前资本配置逻辑已深度转向兼顾稳定收益与抵御风险的双重驱动，投资者正积极把握估值修正窗口，更加注重资产在长期经济转型中的现金流稳定性与战略价值，持续聚焦并加码配置优质办公楼及零售等类别资产。（证券时报）", "ctime": 1787196361, "time_str": "11:26:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260820/c679127272.shtml"}, {"id": "4990347", "title": "黑河东居延海已实现连续22年不干涸", "content": "记者从水利部获悉，截至今天（20日），黑河东居延海已实现连续22年不干涸。在2025—2026调度年，黑河流域管理局克服流域整体气温偏高、冬季干流河道冰储量偏少等不利条件，实施春季集中调度措施40天，其间精准调度黄藏寺水利枢纽及各梯级电站，动态调整水库下泄流量，集中向下游生态输水。受厄尔尼诺事件影响，2026年6月以来，黑河流域遭遇较重旱情。黑河流域管理局发挥黄藏寺水利枢纽关键调控作用，动态加大水库下泄流量，全力保障中游应急抗旱用水；7月、8月，中游地区先后组织实施为期7天、5天的集中调度措施，有力保障了东居延海及周边用水需求。（央视新闻）", "ctime": 1787196211, "time_str": "11:23:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260820/c679127215.shtml"}, {"id": "4990329", "title": "时安生物完成近4亿元A轮系列融资", "content": "苏州时安生物技术有限公司宣布完成A轮系列融资，合计金额近4亿元人民币，涵盖Pre‑A轮、A轮及A+轮。其中，Pre-A轮由蓝驰创投领投，朗煜投资、苏创投-天使母基金、中启资本共同投资；A轮及A+轮由IDG资本连续领投，A+轮由阳光融汇资本联合领投，国投招商、华泰紫金共同投资；老股东元生创投、蓝驰创投、中启资本、苏州颢平持续超额追加。（第一财经）", "ctime": 1787195555, "time_str": "11:12:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260820/c679126931.shtml"}, {"id": "4990311", "title": "先声药业与瑞阳生物达成战略合作", "content": "先声药业8月20日宣布，与瑞阳（山东）生物制药有限公司（简称“瑞阳生物”）就国产1类生物新药库莱韦拜单抗注射液达成战略合作。根据协议，先声药业将获得库莱韦拜单抗在大中华区的独家商业化权益。目前，库莱韦拜单抗上市许可申请已获国家药品监督管理局药品审评中心（CDE）受理，并被纳入优先审评审批程序。本次合作将进一步丰富和强化先声药业在抗感染领域的产品布局。（人民财讯）", "ctime": 1787195127, "time_str": "11:05:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260820/c679126769.shtml"}, {"id": "4990301", "title": "我国牵头制定！全球首个算电协同领域国际标准立项", "content": "由我国向国际电工委员会提出的《数据中心微电网监控与能量管理系统技术规范》提案近日获批立项。该标准是全球首个聚焦数据中心算电协同领域的国际标准，由我国专家担任项目负责人，联合法国、德国、西班牙等多国专家共同制定。（央视新闻）", "ctime": 1787194889, "time_str": "11:01:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260820/c679126610.shtml"}, {"id": "4990285", "title": "房地产板块走高，福星股份涨停", "content": "房地产板块走高，福星股份涨停，荣安地产、城投控股、城建发展、深振业A、京投发展跟涨。", "ctime": 1787194690, "time_str": "10:58:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260820/c679126482.shtml"}, {"id": "4990275", "title": "菲律宾近期恶劣天气已致29人死亡", "content": "菲律宾国家减灾委发布消息称，截至8月20日上午6时，受近期台风“白海豚”和“鲸鱼”的影响，以及西南季风增强导致的降雨，菲律宾共有29人死亡，19人受伤，另有3人失踪。受灾人口超过651万。基础设施方面的损失超过46亿比索，约合人民币5亿元，农业方面的损失超过14亿比索，约合人民币1.5亿元。（央视新闻）", "ctime": 1787194478, "time_str": "10:54:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260820/c679126358.shtml"}, {"id": "4990261", "title": "京东：未来5年将创造超10万个机器人维修工程师就业岗位", "content": "在2026世界机器人大会（WRC 2026）举办之际，京东发布机器人战略布局，未来5年将构建覆盖全球超过100个国家的机器人售后维修网络，并创造超10万个机器人维修工程师就业岗位。（京东物流黑板报）", "ctime": 1787194348, "time_str": "10:52:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260820/c679126275.shtml"}, {"id": "4990239", "title": "MatriQ原子矩阵完成数亿元A+轮融资", "content": "8月20日，MatriQ原子矩阵宣布近期完成数亿元人民币A+轮融资。本轮融资由云锋基金、三七互娱、普华资本、财通资本、上海半导体产投、唐兴资本、博睿资本、合创资本、海邦投资等多家机构共同参与，老股东民银国际持续加注，融资阵容覆盖头部财投、产业资本、国有资本等多元资本。界面新闻了解到，自2025年下半年启动首轮融资至今，原子矩阵在一年内密集完成四轮，累计融资近10亿元。（界面新闻）", "ctime": 1787193760, "time_str": "10:42:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260820/c679125851.shtml"}, {"id": "4990231", "title": "据悉银行大幅下调SK海力士韩股杠杆投资成本", "content": "在SK海力士赴美上市以及AI相关股票经历暴跌后，全球投资者对SK海力士韩股进行杠杆投资的融资成本在最近几周内已减半。据知情人士透露，包括美国银行、花旗集团、高盛集团和摩根大通在内的多家银行，正向客户报价在担保隔夜融资利率（SOFR）基础上加价约150至300个基点，以通过互换交易获得SK海力士韩股的敞口。今年6月中旬，一些银行针对希望新建SK海力士互换合约或续约的客户，报价一度超过SOFR上浮1000个基点。自5月1日以来，SOFR一直在3.50%至3.69%之间波动。此前，银行为在客户之间分配有限的额度，以满足新增SK海力士互换交易的需求，曾报出极高的融资利率，甚至在某些情况下直接拒绝客户请求。当时，AI热潮推动SK海力士韩股在截至6月22日的12个月内累计上涨11倍。随着市场情绪变得极度看涨，银行担心自身投资组合过度集中于这类股票，进而推高其在回购市场的融资成本。知情人士称，一些此前拒绝客户请求的银行如今已开始主动寻求新的业务。(新浪财经)", "ctime": 1787193582, "time_str": "10:39:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260820/c679125736.shtml"}, {"id": "4990225", "title": "今年上半年中国人形机器人出货量已超过4万台", "content": "8月20日，在2026世界机器人大会上，中国电子学会理事会党委书记、中国人形机器人与具身智能百人会理事长张峰发布《2026年人形机器人产业发展报告》。《报告》中提到，2026年上半年，中国人形机器人出货量已超过4万台，全球占比进一步提升至97%。(大河财立方)", "ctime": 1787193206, "time_str": "10:33:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260820/c679125519.shtml"}, {"id": "4990219", "title": "文化传媒概念板块短线拉升，百纳千成涨超10%", "content": "文化传媒概念板块短线拉升，百纳千成涨超10%，凯撒文化、吉视传媒、欢瑞世纪、因赛集团、天龙集团等跟涨。", "ctime": 1787193173, "time_str": "10:32:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260820/c679125495.shtml"}, {"id": "4990187", "title": "豪恩汽电新设子公司，含集成电路销售业务", "content": "企查查APP显示，近日，深圳市豪恩汇科技有限公司成立，经营范围包含：集成电路销售；电子专用材料销售；密封件销售；橡胶制品销售等。企查查股权穿透显示，该公司由豪恩汽电全资持股。（人民财讯）", "ctime": 1787192592, "time_str": "10:23:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260820/c679125145.shtml"}, {"id": "4990185", "title": "旅游及酒店板块短线拉升，南京商旅涨停", "content": "旅游及酒店板块短线拉升，南京商旅涨停，九华旅游、陕西旅游、众信旅游、西域旅游跟涨。", "ctime": 1787192554, "time_str": "10:22:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260820/c679125125.shtml"}, {"id": "4990139", "title": "中澳海关执法部门联合侦破一起跨国烟草走私案", "content": "近日，中国海关缉私部门与澳大利亚边境执法部门开展联合执法行动，成功侦破一起跨国烟草走私案件。中澳执法部门共查获走私卷烟9000余万支，取得联合打击跨国烟草走私重大成果。（央视新闻）", "ctime": 1787191919, "time_str": "10:11:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260820/c679124499.shtml"}, {"id": "4990135", "title": "商务部公布对原产于美国、欧盟、台湾地区和日本的进口共聚聚甲醛反倾销措施相关企业税率继承的决定", "content": "2025年5月18日，商务部发布2025年第25号公告，决定对原产于美国、欧盟、台湾地区和日本的进口共聚聚甲醛征收反倾销税，实施期限为5年。其中，宝理塑料株式会社适用的反倾销税税率为35.5%，台湾宝理塑胶股份有限公司适用的反倾销税税率为3.8%。经审查，商务部认为，上述公司的申请符合要求并附相应证据。公司关于共聚聚甲醛的生产设备、生产能力、供应商关系、客户基础、销售渠道等在业务转移和更名前后均未发生实质变化。由株式会社大赛璐继承宝理塑料株式会社在共聚聚甲醛反倾销措施中所适用的35.5%反倾销税税率及其他权利义务。由台湾大赛璐工程塑胶股份有限公司继承台湾宝理塑胶股份有限公司在共聚聚甲醛反倾销措施中所适用的3.8%反倾销税税率及其他权利义务。以宝理塑料株式会社名称向中国大陆出口的共聚聚甲醛，适用共聚聚甲醛反倾销措施中“其他日本公司”所适用的35.5%反倾销税税率。以台湾宝理塑胶股份有限公司名称向中国大陆出口的共聚聚甲醛，适用共聚聚甲醛反倾销措施中“其他台湾地区公司”所适用的32.6%反倾销税税率。（商务部）", "ctime": 1787191837, "time_str": "10:10:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260820/c679124413.shtml"}, {"id": "4990125", "title": "《网络数据安全风险评估办法》实施有关事项答记者问", "content": "《网络数据安全风险评估办法》于2026年8月20日起施行，公安部有关负责人就其实施有关事项回答了记者提问。公安机关将建立全流程监管机制，掌握辖区内网络数据处理者相关情况，建立并完善动态监管台账。对发现存在较大安全风险、发生数据安全事件等情形的，依法督促网络数据处理者委托通过认证的第三方评估机构开展风险评估。对未按规定开展风险评估的网络数据处理者，将依据《中华人民共和国数据安全法》《网络数据安全管理条例》等有关法律、行政法规予以处理；第三方评估机构违反《网络数据安全风险评估办法》开展风险评估的，公安机关将依法予以处理。（新华社）", "ctime": 1787191658, "time_str": "10:07:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260820/c679124243.shtml"}, {"id": "4990123", "title": "据报道，三星将公布规模达100万亿韩元的股东回报计划", "content": "据报道，三星将公布规模达100万亿韩元的股东回报计划。（财联社）", "ctime": 1787191607, "time_str": "10:06:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260820/c679124202.shtml"}, {"id": "4990121", "title": "宇树上市后，王兴兴首场公开演讲谈了具身智能ChatGPT时刻", "content": "8月20日，在2026世界机器人大会上，宇树科技创始人、董事长王兴兴进行“展品到产品：人形机器人产业的下一个十年”的主题演讲。王兴兴表示，这些年公司其实一直在推动机器人真正走进生活，比如在汽车工厂进行落地应用、在自家工厂部署机器人进行简单测试等，另外AI团队也在推进机器人去家庭干活。但他提到，由于目前整体效率、泛用性能力还是不够高，宇树并没有进行大规模推广。王兴兴希望，迈向具身智能的ChatGPT时刻，理想情况下需要2-3年，或者更长5-10年的时间。他认为，达到这一时刻，即要在80%的陌生场景中，通过语音或文字指令，机器人能够顺利完成大约80%的任务。目前，最核心的挑战是AI大模型的输入输出和真实机器人的对齐。（第一财经）", "ctime": 1787191536, "time_str": "10:05:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260820/c679124131.shtml"}, {"id": "4990119", "title": "上期所沪银主力合约大涨5%", "content": "上期所沪银主力合约大涨5%，报16405元/千克。", "ctime": 1787191534, "time_str": "10:05:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260820/c679124129.shtml"}, {"id": "4990117", "title": "当虹科技机器人多模态感知上装件在2026世界机器人大会上发布", "content": "记者从当虹科技获悉，公司在2026世界机器人大会上正式发布机器人多模态感知上装件，该设备可根据不同场景搭载双光云台，集成声光、通信、算力等模块，同时支持气体、温湿度等外接传感器。在工业巡检场景中，可识别仪表读数，检测温度异常、气体风险、设备异响以及液体跑冒滴漏等问题，将更多现场信息实时带回，为后续AI识别和任务决策提供数据基础。（人民财讯）", "ctime": 1787191511, "time_str": "10:05:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260820/c679124113.shtml"}, {"id": "4990113", "title": "贵金属板块持续走强，山东黄金触及涨停", "content": "贵金属板块持续走强，山东黄金触及涨停，兴业银锡、赤峰黄金此前涨停，晓程科技涨超10%，招金黄金、中金黄金、湖南白银、山金国际、四川黄金跟涨。", "ctime": 1787191474, "time_str": "10:04:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260820/c679124074.shtml"}, {"id": "4990105", "title": "工信部副部长辛国斌：推动机器人产业创新发展，聚焦农业、医疗、养老、应急等重点行业", "content": "工业和信息化部副部长辛国斌在2026世界机器人大会上表示，工业和信息化部推动机器人产业创新发展。一是强化创新合作，鼓励中外科研机构、企业开展联合攻关，打通产学研用创新链条，共同推动智能化升级。二是深化应用联动，聚焦农业、医疗、养老、应急等重点行业，分类组织开展产用结对攻关、实地应用验证和成熟场景推广，共同推动产业化进程。三是坚持以人为本，秉持向上向善理念，推动技术向善、科技为民，兼顾效率提升与就业保障，让机器人更好服务人的生产生活。（财联社）", "ctime": 1787191342, "time_str": "10:02:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260820/c679123937.shtml"}, {"id": "4990103", "title": "北京市市长殷勇：推进“机器人+”示范应用，打造全球机器人应用标杆城市", "content": "北京市市长殷勇在2026世界机器人大会上表示，北京市将统筹各类创新资源，全力营造开放包容、充满活力的机器人与具身智能发展环境。提供更加完善的要素保障，出台人形机器人产业高质量发展三年行动方案，完善中试平台、检验检测、投融资服务体系，打造快速响应、更具韧性的机器人产业链供应链。拓展更加广阔的应用空间，用好超大城市丰富场景优势，推进“机器人+”示范应用，打造全球机器人应用标杆城市。（财联社）", "ctime": 1787191331, "time_str": "10:02:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260820/c679123931.shtml"}, {"id": "4990099", "title": "合成生物板块掀涨停潮", "content": "合成生物板块掀涨停潮，卫光生物、近岸蛋白、智飞生物、华大智造、康希诺、沃森生物等十余股封涨停板。相关ETF方面，生物医药ETF天弘（159859）涨7.07%，成交额2.22亿元，生物医药ETF汇添富（159839）涨7.37%，成交额8281.01万元。", "ctime": 1787191270, "time_str": "10:01:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260820/c679123830.shtml"}, {"id": "4990097", "title": "中国240小时过境免签“朋友圈”扩展至57国", "content": "国家移民管理局8月20日发布公告，自2026年8月20日起，吉尔吉斯斯坦、越南公民可适用240小时过境免签政策和海南30天入境免签政策来华。至此，240小时过境免签政策适用国家增至57国，海南30天入境免签政策适用国家增至61国。 吉尔吉斯斯坦、越南公民持普通护照和确定日期及行程的联程客票，从中国过境前往第三国或地区，可从北京、上海等65个对外开放口岸免签入境，并在规定区域内免签停留不超过240小时。两国公民持普通护照可由海南省对外开放口岸入境，在海南省行政区域内免签停留不超过30天。适用上述2项免签政策停留期间可从事旅游、商贸、访问、探亲等短期活动，工作、学习、新闻采访等需事先批准的活动仍应在来华前办妥签证。 国家移民局相关负责人介绍，对吉尔吉斯斯坦、越南公民实施2项免签政策，是稳步推进高水平对外开放、推动构建周边命运共同体的务实举措，有利于进一步促进双方互信合作，推动旅游商贸、访问投资更加便利高效。下一步，国家移民局将统筹发展和安全，坚决维护规范有序的出入境管理秩序，更好促进中外人员往来和国际交流合作，服务国家高水平开放高质量发展。(新华社)", "ctime": 1787191256, "time_str": "10:00:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260820/c679123820.shtml"}, {"id": "4990093", "title": "光纤概念板块走高，长盈通涨超15%", "content": "光纤概念板块走高，长盈通涨超15%，太辰光、 // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
