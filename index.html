n/20260910/c679783576.shtml"}, {"id": "5146891", "title": "围海股份：重大合同补充协议签约合同价3亿元", "content": "围海股份公告，公司此前披露联合体中标并签订云南省曲靖市罗平县智慧农业项目工程总承包（EPC）三标段重大合同。近日，因政府土地流转问题及项目优化，公司与相关方签署补充协议，签约合同价调整为3亿元，项目占地面积约150亩、建筑面积约为78000平方米，工期360日历天。", "ctime": 1789027906, "time_str": "16:11:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260910/c679783569.shtml"}, {"id": "5146889", "title": "商务部：延长对原产于墨西哥和美国的进口碧根果反倾销调查期限至2027年3月25日", "content": "商务部公告2026年第38号，延长对原产于墨西哥和美国的进口碧根果反倾销调查期限至2027年3月25日。", "ctime": 1789027897, "time_str": "16:11:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260910/c679783558.shtml"}, {"id": "5146869", "title": "港股收评：恒生指数跌1.27%，恒生科技指数跌2.04%", "content": "港股收盘，恒生指数跌1.27%，恒生科技指数跌2.04%。恒指港股通ETF银华（159318）跌1.0%，港股通科技ETF鹏华（159751）跌2.1%。板块方面，穿戴式设备、电子设备板块涨幅靠前；电脑与电子产品零售、塑料包装板块跌幅靠前。个股方面，优地机器人涨25.57%，怡俊集团控股涨9.54%，溜溜梅涨9.38%，嘉耀控股涨8.78%，梅卡曼德机器人涨8.75%；海致科技集团跌12.75%，群核科技跌10.94%，深演智能跌10.66%，智谱跌10.34%，博泰车联跌8.99%。", "ctime": 1789027838, "time_str": "16:10:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260910/c679783501.shtml"}, {"id": "5146849", "title": "国家外汇局：我国直接投资项下已实现基本可兑换", "content": "国家外汇管理局副局长、新闻发言人李斌9月10日在国新办举行的“开局起步‘十五五’”系列主题新闻发布会上介绍，我国直接投资项下已实现基本可兑换，跨境证券投资形成了以机构投资者制度、互联互通机制、境外投资者直接入市为主的跨境投资制度安排，对跨境融资实施全口径宏观审慎管理。（新华社）", "ctime": 1789027735, "time_str": "16:08:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260910/c679783069.shtml"}, {"id": "5146845", "title": "彩虹股份：TV面板价格有望在四季度逐步企稳", "content": "彩虹股份在9月10日召开的2026年半年度业绩说明会上表示，受前期需求提前释放影响，三季度行业供需关系趋于宽松，TV面板价格环比小幅下滑；四季度受年末大促备货拉动以及大尺寸化持续，价格有望逐步企稳。（人民财讯）", "ctime": 1789027723, "time_str": "16:08:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260910/c679783017.shtml"}, {"id": "5146843", "title": "新恒泰：公司及子公司签署投资协议，拟投合计3.6亿元", "content": "新恒泰公告，公司及全资子公司浙江弘泰分别与新丰镇人民政府签署《投资协议》，拟投资建设高性能聚合物微孔发泡材料项目（一期）和高性能聚合物轻量化材料项目，计划总投资金额分别为1.1亿元、2.5亿元。2026年9月10日，公司董事会审议通过相关议案，无需提交股东会审议。", "ctime": 1789027721, "time_str": "16:08:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260910/c679783009.shtml"}, {"id": "5146821", "title": "中机认检：中汽认证被责令停业整顿1个月", "content": "中机认检公告，全资子公司中汽认证收到国家认监委《停业整顿通知书》，因对不属于强制性产品认证目录内的汽车用制动器衬片进行强制性产品认证并颁发证书，被责令自2026年9月9日至2026年10月8日停业整顿1个月，期间不得从事指定范围内的强制性产品认证活动。预计减少公司2026年归属于上市公司股东的净利润不超过207.04万元。", "ctime": 1789027592, "time_str": "16:06:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260910/c679782485.shtml"}, {"id": "5146807", "title": "金融监管总局丛林：将支持中间品出口、海外仓建设和跨境电商发展", "content": "9月10日，在国新办新闻发布会上，金融监管总局副局长丛林表示，下一步，金融监管总局将引导金融机构顺应消费提质升级需要，支持扩大商品消费，持续释放服务消费和新型消费潜力。坚持投资于物和投资于人紧密结合，强化“两重”“两新”“六张网”和“十五五”109项重大工程的重点领域金融支持，着力促进稳外贸，支持中间品出口、海外仓建设和跨境电商发展。（人民财讯）", "ctime": 1789027554, "time_str": "16:05:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260910/c679782343.shtml"}, {"id": "5146789", "title": "李开复：AI没有办法承担责任", "content": "在第二十六届投洽会期间，2026未来投资大会人工智能与新型工业化投资专题讨论同步举行。零一万物首席执行官、创新工场董事长李开复指出，人工智能正在从提供答案走向执行任务、协调工作流程和辅助决策，其对企业的影响将延伸至组织和管理体系。真正的转型需要最高管理层推动，打破信息孤岛、重新配置资源，并把人工智能应用于企业最重要的经营与战略问题。他以企业管理和投资分析中的智能体应用为例，说明人工智能可以帮助管理者识别风险、梳理证据和提高决策质量，但最终的判断与责任仍须由人承担。他强调：“AI没有办法承担责任。”（人民财讯）", "ctime": 1789027498, "time_str": "16:04:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260910/c679782232.shtml"}, {"id": "5146787", "title": "成都1宗宅地3.43亿元底价成交", "content": "9月10日，成都出让1宗新津区宅地，土地出让面积为69721.6㎡（合104.5824亩），规划建筑面积83665.92㎡，容积率1.2，起拍楼面价4100元/㎡，折合起始总价3.43亿元。最终成都新城兴产业投资有限公司以楼面价4100元/㎡底价竞得该地块，成交总价3.43亿元。（人民财讯）", "ctime": 1789027484, "time_str": "16:04:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260910/c679782209.shtml"}, {"id": "5146773", "title": "国家外汇局李斌：“十五五”时期我国外贸出口和进口发展将更加协调", "content": "9月10日，在国新办新闻发布会上，国家外汇局新闻发言人、副局长李斌表示，“十五五”时期，我国外贸出口和进口发展将更加协调，对外的投资和来华投资将进一步扩展，国际收支有望保持基本平衡。未来国家外汇局将更好统筹发展和安全，持续推进跨境贸易和投资的便利化增强涉外经济发展的动能，推动国际收支规模稳步提升，结构持续优化。不断完善宏观审慎管理，加强跨境资金流动的监测预警，持续增强外汇市场的活力和韧性，稳妥应对外部冲击风险。(人民财讯)", "ctime": 1789027398, "time_str": "16:03:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260910/c679781920.shtml"}, {"id": "5146769", "title": "工银安盛资管尚鹏：坚定看好资本市场长期发展，立足基本面积极布局优质资产", "content": "9月10日，由证券时报社主办的“2026金融机构年会”在深圳举行。在下午举行的“2026保险业资产负债管理年会”分论坛上，工银安盛资管党委书记、总经理尚鹏发表主题演讲时表示，利率风险与资本市场风险共振叠加，对保险资金的精细化及专业化提出更高要求。权益投资方面，公司坚定看好资本市场的长期发展；同时，保持敬畏和战略定力，严控风险，立足基本面积极布局优质资产。尚鹏表示，近年来，利率环境和负债端的变化，以及中长期资金入市等因素叠加，深刻影响着保险行业投资行为。当前，保险资产配置正发生三大变化：一是收息资产结构中长债配置上升，非标资产下降；二是权益资产配置上升，高分红股票结构抬升，且结构转化的趋势仍将继续；三是利率与权益波动对于保险投资的收益稳定性带来相较以往更剧烈的冲击。据介绍，工银安盛资管结合实践，在权益投资方面已形成四点核心应对思路：一是敬畏市场、坚定信心；二是策略均衡、降低波动；三是适度集中、有效分散，四是研究先行、AI赋能。（人民财讯）", "ctime": 1789027371, "time_str": "16:02:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260910/c679781785.shtml"}, {"id": "5146757", "title": "美股中概股盘前涨跌互现，哔哩哔哩跌2%", "content": "美股中概股盘前涨跌互现，腾讯音乐涨0.7%，贝壳涨0.4%，携程涨0.1%，阿里巴巴持平，网易跌0.2%，京东跌0.4%，百度跌0.9%，哔哩哔哩跌2%。", "ctime": 1789027273, "time_str": "16:01:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260910/c679781304.shtml"}, {"id": "5146753", "title": "美股大型科技股盘前涨跌互现，SK海力士跌超2%", "content": "美股大型科技股盘前涨跌互现，苹果涨0.6%，Meta涨0.5%，谷歌A涨0.2%，亚马逊涨0.1%；微软持平；SK海力士跌超2%，美光科技跌0.4%，SpaceX跌0.3%，特斯拉跌0.2%，英伟达跌0.1%。", "ctime": 1789027267, "time_str": "16:01:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260910/c679781275.shtml"}, {"id": "5146711", "title": "宇树科技开源UnifoLM-WLA-1.0具身基座模型", "content": "9月10日，宇树科技宣布完全开源UnifoLM-WLA-1.0具身基座模型。据介绍，单模型统筹桌面与全身移动操作，支持跨任务、跨末端执行器泛化。（界面新闻）", "ctime": 1789027198, "time_str": "15:59:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260910/c679781109.shtml"}, {"id": "5146691", "title": "证监会李超：进一步织密财务造假预防、发现和惩处网络 推动重大案件严查快办", "content": "9月10日，在国新办新闻发布会上，证监会副主席李超表示，证监会将继续坚持“惩防治”并举、“行民刑”协同，进一步织密财务造假预防、发现和惩处网络，推动重大案件严查快办。与相关部委、地方政府齐抓共治，共同营造“不敢造假、不能造假、不想造假”的市场生态。（人民财讯）", "ctime": 1789026996, "time_str": "15:56:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260910/c679781014.shtml"}, {"id": "5146681", "title": "山河药辅：签署合同并取得73965.74平方米不动产权证书", "content": "山河药辅公告，公司此前经董事会审议通过拟参与竞拍淮南市经济技术开发区相关工业用地。公司已竞得该土地使用权，并于2026年9月9日签署《国有建设用地使用权出让合同》，截至公告披露日已付清人民币2440.87万元全部款项，取得《不动产权证书》。", "ctime": 1789026915, "time_str": "15:55:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260910/c679780976.shtml"}, {"id": "5146675", "title": "证监会李超：进一步严格规范控股股东、实控人减持行为", "content": "9月10日，在国新办新闻发布会上，证监会副主席李超表示，近年来，证监会开展多轮上市公司治理专项行动，修订上市公司治理准则，推动独立董事制度改革，着力提升上市公司规范运作水平。下一步，证监会将深入实施新一轮上市公司治理专项行动，进一步严格规范控股股东、实控人减持等行为，加强董事高管任职履职离职全流程监管，引导更多上市公司加快健全中国特色现代企业制度。（人民财讯）", "ctime": 1789026861, "time_str": "15:54:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260910/c679780963.shtml"}, {"id": "5146671", "title": "证监会李超：超2000家公司连续五年分红", "content": "9月10日，在国新办新闻发布会上，证监会副主席李超表示，2024年“并购六条”出台以来，上市公司累计披露重大资产重组370单，一批优质企业通过并购重组加快转型升级，实现价值成长。新“国九条”以来，上市公司累计分红、回购超7万亿元，超2000家公司连续五年分红，超1000家公司开展中期分红，分红频次和金额持续提升。（人民财讯）", "ctime": 1789026804, "time_str": "15:53:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260910/c679780946.shtml"}, {"id": "5146667", "title": "消息人士称也门胡塞武装已控制红海沿岸城市穆哈", "content": "路透社10日援引3名也门政府消息人士的话报道称，也门胡塞武装已控制也门红海沿岸城市穆哈。(新华社)", "ctime": 1789026761, "time_str": "15:52:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260910/c679780928.shtml"}, {"id": "5146659", "title": "加拿大国际贸易法庭：美进口蔬菜罐头损害本国产业", "content": "加拿大国际贸易法庭9日向联邦政府提交调查报告，认定从美国进口的蔬菜罐头对加拿大国内相关产业造成严重损害。 报告指出，在2023年至2025年的调查期内，加拿大蔬菜罐头进口量大幅增加。其中，来自美国的蔬菜罐头不仅占主要份额且在2025年出现大幅激增，是造成加拿大本土生产者遭受严重损害的主要原因。法庭认定，美国商品不能获得自贸协定豁免，须纳入限制措施范围。 报告同时重点论述引入关税配额以应对产业损害等内容，还涉及相关限制措施对平衡加国内食品安全及消费者承受能力的内容。 报告统计显示，加拿大蔬菜罐头进口总量从2024年至2025年激增约357.6万公斤，其中绝大部分增量来自美国，来自美国的进口量2025年激增151%。目前，加拿大所消费的腌制水果和蔬菜中45%来自进口，其中来自美国的进口量占进口总量的58%。 报告援引加拿大总理马克·卡尼的话说：“加拿大种植的农产品中有太多是在其他地方进行加工的，也有太多的加拿大人仍在依赖价格更高的进口食品。加拿大农场主理应获得更多销售其农产品的渠道，加拿大人也理应获得更多选购食品的渠道。” 加拿大国际贸易法庭是准司法机构。根据相关法定程序，法庭的建议将提交加拿大联邦政府进行最终评估与决策。(新华社)", "ctime": 1789026712, "time_str": "15:51:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260910/c679780917.shtml"}, {"id": "5146657", "title": "证监会李超：严把发行上市入口关 继续加大退市监管力度", "content": "9月10日，在国新办新闻发布会上，证监会副主席李超表示，证监会将继续严把发行上市入口关，把握好包容性与严监管的关系，持续提升A股市场对优质公司的吸引力。继续加大退市监管力度，发挥好强制退市震慑效应。加强退市后监管和退市过程中的投资者保护，坚决防止“一退了之”。（人民财讯）", "ctime": 1789026681, "time_str": "15:51:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260910/c679780902.shtml"}, {"id": "5146647", "title": "罗牛山：2026年8月生猪销量7.17万头，同比增长33.72%", "content": "罗牛山公告，2026年8月销售生猪7.17万头，环比增长2.66%、同比增长33.72%；销售收入9377.02万元，环比增长4.83%、同比下降1.9%。2026年1-8月累计销售生猪59.78万头，同比增长39.94%；累计销售收入7.43亿元，同比下降7%。生猪销售数量同比上升主要因部分猪场产能增加、“公司+农户”合作养殖规模扩大。", "ctime": 1789026638, "time_str": "15:50:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260910/c679780886.shtml"}, {"id": "5146643", "title": "华安证券董秘储军：向“产业合伙人”转型，主营业务同步升级", "content": "9月10日，由证券时报社主办的“2026金融机构年会暨证券业投资银行论坛”在深圳举行。华安证券董事会秘书、华富瑞兴董事长储军在主题演讲中表示，华安证券的角色定位正转变为“产业合伙人”，即用投资人的眼光筛选客户，用合伙人的心态服务客户，从企业成长早期就开始陪伴、培育、赋能，在企业价值创造的全过程中分享收益。在储军看来，上述角色转变带来的是各业务条线价值的全面升维，包括投行业务从“通道服务”向“产业投行”升级；股权投资业务从“资本供给”向“产业赋能”升级；权益投资业务从“交易博弈”向“价值发现”升级；研究业务从“卖方服务”向“价值中枢”升级。华安“投行+投资+投研”积累的产业关系链，也转化为财富管理的差异化客群入口，财富管理从“到处找客户卖产品”变成了“深耕产业、水到渠成”。（人民财讯）", "ctime": 1789026606, "time_str": "15:50:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260910/c679780870.shtml"}, {"id": "5146633", "title": "以军空袭加沙地带一民宅致4人死亡", "content": "以色列军队当天空袭了加沙地带北部拜特拉希亚地区的一栋居民住宅，造成4人死亡。报道说，4人当场死亡，还有数名伤员已被送到位于加沙城的希法医院接受治疗。除在拜特拉希亚地区的空袭外，以军还炮击了加沙城东部地区，并用军舰炮击了加沙地带南部汗尤尼斯附近地区。（新华社）", "ctime": 1789026532, "time_str": "15:48:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260910/c679780835.shtml"}, {"id": "5146631", "title": "金融监管总局:金融业主要监管指标均处于“健康区间”", "content": "国家金融监管总局副局长丛林在今日国新办新闻发布会上表示，金融业运行整体稳健，主要监管指标均处于健康区间。到2025年末，商业银行拨备覆盖率205.21%，资本充足率15.46%；保险公司平均综合偿付能力充足率181.1%。去年国有大行补充资本5200亿元，近期又有8家中央金融企业增资3600亿元，这将进一步增强国有大型金融机构稳健经营、抵御风险和服务实体经济的能力。（南方财经）", "ctime": 1789026525, "time_str": "15:48:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260910/c679780834.shtml"}, {"id": "5146629", "title": "澳琴数字枢纽港数据跨境综合服务平台正式上线", "content": "9月10日，澳琴数字贸易国际枢纽港-数据跨境综合服务平台正式上线。平台将围绕数据跨境流动全链条，为企业提供规则查询、合规评估、可信流通、日志留存等专业服务。为多维度服务支撑跨境合规，平台内置跨境合规知识库，汇聚中国、葡萄牙、巴西、美国、欧盟、英国、新加坡、韩国及东盟等全球36个国家和地区的数据跨境法律法规、监管政策及专业解读，并持续动态更新，便利企业及时掌握最新规则。围绕出境行为识别、主体性质、数据类型、个人信息规模、大湾区便利化机制及负面清单适用等关键维度，平台构建体系化评估清单。企业输入相关信息后，平台可输出评估参考及对应法律依据，辅助企业精准识别数据出境风险并提出应对建议，为企业规避跨境合规风险及提供科学、高效的数字化支撑。针对可信流通需求，平台提供定制化跨境可信流通方案与落地支持，包括跨境合规咨询、数据合规化加工、数据空间接入、数据存储与计算、大模型备案与评估等综合性服务，助力企业安全合规开展数据流通与大模型业务，助力企业打通数据跨境流通壁垒，合规拓展跨境数字业务版图。此外，在合规存证与溯源监管方面，平台具备专业的风险排查与日志留存服务能力，可协助识别企业安全存证缺口与相关风险，并提供完善建议。同时，根据企业具体业务需求，提供跨境日志接入与留存服务，为其数据跨境业务提供合规支撑和监管适配保障。平台上线即日起，企业可通过线上渠道注册使用或通过线下咨询了解。（央视新闻）", "ctime": 1789026492, "time_str": "15:48:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260910/c679780828.shtml"}, {"id": "5146621", "title": "央行陆磊：央行将完善存款准备金制度，更加灵活精准开展公开市场操作", "content": "9月10日，在国新办新闻发布会上，中国人民银行副行长陆磊表示，“十五五”时期，人民银行将持续健全基础货币投放机制，完善存款准备金制度，更加灵活精准开展公开市场操作，不断健全市场化利率形成、调控和传导机制，增强政策利率引导作用，引导短端货币市场利率围绕政策利率更加平稳运行。（人民财讯）", "ctime": 1789026467, "time_str": "15:47:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260910/c679780776.shtml"}, {"id": "5146615", "title": "央行陆磊：中国没有必要也无意通过汇率贬值来获取贸易竞争优势", "content": "9月10日，在国新办新闻发布会上，中国人民银行副行长陆磊表示，中国实施有管理的浮动汇率制度，坚持市场在汇率形成中的决定作用，防范市场羊群效应和非理性预期的自我强化，中国没有必要也无意通过汇率贬值来获取贸易竞争优势。（人民财讯）", "ctime": 1789026406, "time_str": "15:46:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260910/c679780761.shtml"}, {"id": "5146611", "title": "国家外汇局李斌：“十五五”时期将有效防范跨境资金大进大出可能形成的风险", "content": "9月10日，在国新办新闻发布会上，国家外汇局新闻发言人、副局长李斌表示，“十五五”时期，将推动跨境资金流动风险防控和监管更加有力有效，持续健全外汇市场“宏观审慎+微观监管”两位一体管理，不断完善跨境资本流动宏观审慎管理，有效防范跨境资金大进大出可能形成的系统性风险。（人民财讯）", "ctime": 1789026380, "time_str": "15:46:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260910/c679780758.shtml"}, {"id": "5146601", "title": "证监会李超：完善符合我国国情的投资者保护体系", "content": "9月10日，在国新办新闻发布会上，证监会副主席李超表示，证监会将抓紧推动证券投资基金法、上市公司监管条例等重要法律法规的制定修改。同时，进一步完善符合我国国情的投资者保护体系，积极营造公平公开公正的市场环境。（人民财讯）", "ctime": 1789026350, "time_str": "15:45:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260910/c679780749.shtml"}, {"id": "5146597", "title": "港股优地机器人尾盘大幅拉升，一度涨超30%", "content": "港股优地机器人尾盘大幅拉升，一度涨超30%，现涨23%。", "ctime": 1789026334, "time_str": "15:45:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260910/c679780742.shtml"}, {"id": "5146591", "title": "证监会李超：四个“更大力度”持续提升资本市场韧性和信心", "content": "9月10日，在国新办新闻发布会上，证监会副主席李超表示，证监会将以更大力度推进实施进一步全面深化资本市场改革，持续提升资本市场韧性和信心。一是更大力度激发市场活力；二是更大力度夯实稳的基础；三是更大力度提升监管效能；四是更大力度加强法治保障。（人民财讯）", "ctime": 1789026304, "time_str": "15:45:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260910/c679780729.shtml"}, {"id": "5146587", "title": "证监会李超：沪深两市IPO平均审核周期缩短至6个多月", "content": "9月10日，在国新办新闻发布会上，证监会副主席李超表示，支持新质生产力优质企业发展壮大，是新征程上资本市场的时代使命。近年来，证监会推出深化科创板、创业板等改革，进一步提升再融资灵活性便利性，改革成效逐步显现。今年以来，沪深两市IPO平均审核周期缩短至6个多月，一些优质公司再融资审核不到1个月。（人民财讯）", "ctime": 1789026242, "time_str": "15:44:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260910/c679780709.shtml"}, {"id": "5146581", "title": "中国—上海合作组织基础教育合作中心在京揭牌", "content": "中国—上海合作组织基础教育合作中心揭牌仪式10日在京举行。据介绍，中心将积极搭建与上合组织成员国的交流合作平台，重点围绕青少年人文交流、教师培养培训与交流、人工智能赋能基础教育等方面开展工作。 教育部有关负责人介绍，中国—上海合作组织基础教育合作中心揭牌后，各成员国将共享基础教育发展经验，进一步丰富多边教育合作的内涵。中国愿以数智教育为纽带，深化各国在教育、科技、人才等领域的务实合作，共同构建开放、多元、普惠、共赢的全球教育发展新格局。 据悉，中心办公地点设在北京市朝阳区。北京市教育部门有关负责人表示，将充分发挥首都国际交往中心优势，深化上合组织成员国间基础教育交流与合作，促进各成员国基础教育改革创新，厚植相知相亲的民意根基。 记者了解到，后续，中心将邀请上合组织成员国教育部门、全国重点省区市基础教育各相关单位参与共建。(新华社)", "ctime": 1789026221, "time_str": "15:43:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260910/c679780697.shtml"}, {"id": "5146579", "title": "金融监管总局：大力整治“价格战”等行为", "content": "金融监管总局副局长丛林9月10日在国新办举行的“开局起步‘十五五’”系列主题新闻发布会上表示，将多措并举 // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';

}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
