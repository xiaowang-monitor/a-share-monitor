ml"}, {"id": "4450833", "title": "2026年全国高考报名人数为1290万人", "content": "记者从教育部获悉，2026年全国高考报名人数为1290万人。2026年全国统一高考将于6月7日开考。今年，教育部门将继续为盲人考生专门命制盲文试卷，这是自2014年起，连续13年为盲人考生在高考中提供盲文试卷。此外，教育部还将指导各地为1.4万余名残障考生参加考试提供合理便利。(央视新闻)", "ctime": 1780466388, "time_str": "13:59:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260603/c677181968.shtml"}, {"id": "4450823", "title": "菲律宾股市指数上涨2%至6033.66点", "content": "菲律宾股市指数上涨2%至6033.66点。", "ctime": 1780466262, "time_str": "13:57:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260603/c677181928.shtml"}, {"id": "4450821", "title": "科威特国际机场因袭击暂停起降", "content": "科威特民航总局今天（6月3日）上午发布消息称，科威特国际机场1号航站楼在当天早间的“敌对”无人机袭击中被严重损毁，袭击还造成现场多人受伤。受此影响，民航部门已暂停在科威特国际机场的飞机起降，并启动了应急计划。科威特国防部发言人在一份声明中称无人机袭击是“伊朗的侵略行径”，并强调科威特军方正在与相关部门密切关注相关局势，并已做好充分准备应对事态变化，确保将采取一切必要措施维护国家安全与稳定。(CCTV国际时讯)", "ctime": 1780466244, "time_str": "13:57:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260603/c677181916.shtml"}, {"id": "4450811", "title": "波兰计划禁止小学生在校使用手机", "content": "波兰总理图斯克2日表示，波兰计划自9月1日起禁止小学生在校使用手机。波兰政府当天通过《教育法》修正案草案，小学生将被禁止在校园内使用手机，包括课间休息以及在校外组织的教育活动期间。具有录音、录像和信息通信功能的电子设备同样受到限制。波兰小学教育学制为8年，面向7至15岁的儿童。草案还将提交波兰众议院和参议院审议，并交由总统签署。根据安排，该法将于今年9月1日正式生效。（央视新闻）", "ctime": 1780466177, "time_str": "13:56:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260603/c677181885.shtml"}, {"id": "4450791", "title": "硅业分会：预计6月国内多晶硅产量将增加至9-9.1万吨", "content": "据硅业分会消息，据安泰科统计，n型复投料（棒状硅）成交价格区间为3.4-3.5万元/吨，成交均价为3.47万元/吨，环比下滑1.70%；n型颗粒硅成交价格区间为3.3-3.5万元/吨，成交均价为3.4万元/吨，环比下滑0.87%。根据企业排产计划，6月份多晶硅市场将进入供需双增阶段。供应端，预计5家企业有复产增量释放，同时另有一家企业安排检修，综合影响下，预计6月国内多晶硅产量将增加至9-9.1万吨。需求端，下游硅片排产也有提升预期，对应多晶硅需求量预计在8.7万吨左右。综合判断，6月份市场或将处于微幅累库或供需紧平衡状态，但在行业库存尚未实现有效去化的前提下，供应增量的预期对市场情绪影响更为直接。下游需求的增长预期是否能有效消化这部分供应增量并实现真正的平衡，将是影响未来市场走势的关键。（南方财经）", "ctime": 1780465966, "time_str": "13:52:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260603/c677181819.shtml"}, {"id": "4450773", "title": "璞泰来在四川成立高聚材料科技公司", "content": "企查查APP显示，近日，四川高聚材料科技有限公司成立，注册资本1亿元，经营范围包含：新型膜材料制造；新型膜材料销售；新材料技术研发；电子专用材料制造等。企查查股权穿透显示，该公司由璞泰来全资持股。（人民财讯）", "ctime": 1780465843, "time_str": "13:50:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260603/c677181779.shtml"}, {"id": "4450767", "title": "中国中煤在武汉成立新能源公司", "content": "企查查APP显示，近日，中煤资源（武汉）新能源有限公司成立，注册资本6500万元，经营范围包含：发电技术服务；风力发电技术服务；太阳能发电技术服务；储能技术服务等。企查查股权穿透显示，该公司由中国中煤能源集团有限公司间接全资持股。（人民财讯）", "ctime": 1780465768, "time_str": "13:49:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260603/c677181770.shtml"}, {"id": "4450765", "title": "国家核电核岛装备产业计量测试中心在烟台成立", "content": "日前，经国家市场监管总局批复，依托烟台市标准计量检验检测中心筹建的“国家核电核岛装备产业计量测试中心”在烟台正式成立。该中心是国内核电装备领域唯一一家国家级产业计量测试中心，将为核电产业高质量发展、筑牢核安全屏障、清洁能源转型提供关键计量技术支撑。（人民财讯）", "ctime": 1780465751, "time_str": "13:49:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260603/c677181767.shtml"}, {"id": "4450729", "title": "茶颜悦色将入驻安徽合肥", "content": "6月3日，茶颜悦色宣布将在安徽合肥开店，开业时间预估为8月初。(界面)", "ctime": 1780465250, "time_str": "13:40:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260603/c677181572.shtml"}, {"id": "4450701", "title": "煤炭开采加工板块午后持续拉升，晋控煤业触及涨停", "content": "煤炭开采加工板块午后持续拉升，晋控煤业触及涨停，昊华能源、云煤能源、郑州煤电跟涨。", "ctime": 1780464941, "time_str": "13:35:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260603/c677181488.shtml"}, {"id": "4450651", "title": "火山引擎提升MaaS营收目标至全年150亿元，Seedance 2.0单月营收已超10亿元", "content": "字节跳动火山引擎在今年4月已将MaaS业务营收目标上调至150亿元，且这个营收目标几乎每月都在上调。而在2025年底，这一目标还是100亿元。36氪了解到，在2025年，火山全年的MaaS收入约15亿元左右，等于截止目前2026年的营收目标是去年实际营收的10倍。可以说，火山这一波MaaS营收增长几乎都归功于Seedance2.0的爆发——视频模型Seedance2.0如今已经能带来单月超10亿元的收入。一位接近火山的人士透露，截至目前，火山引擎Token日均消耗量仍然保持着月度近40%的增速。(36氪)", "ctime": 1780464579, "time_str": "13:29:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260603/c677181346.shtml"}, {"id": "4450639", "title": "商业航天板块震荡走高，中国卫星涨超8%", "content": "商业航天板块震荡走高，中国卫星涨超8%，信维通信、上海瀚讯、电科蓝天、西部材料跟涨。", "ctime": 1780464343, "time_str": "13:25:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260603/c677181263.shtml"}, {"id": "4450635", "title": "俄称圣彼得堡市遭乌无人机袭击 有人员受伤", "content": "俄罗斯圣彼得堡市政府当地时间6月3日发布消息称，乌克兰无人机当天凌晨袭击了圣彼得堡的喀琅施塔得、基洛夫和红村等区域的基础设施，有人员受伤。（央视新闻）", "ctime": 1780464332, "time_str": "13:25:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260603/c677181260.shtml"}, {"id": "4450585", "title": "南向资金净买入超80亿港元", "content": "据同花顺iFinD数据，截至目前，南向资金净买入超80亿港元，其中港股通（沪）买入超69.09亿港元，港股通（深）买入超11.34亿港元。", "ctime": 1780463926, "time_str": "13:18:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260603/c677181156.shtml"}, {"id": "4450583", "title": "电力板块局部拉升，京能电力直线涨停", "content": "电力板块局部拉升，京能电力直线涨停，华银电力、赣能股份、上海电力跟涨。", "ctime": 1780463903, "time_str": "13:18:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260603/c677181153.shtml"}, {"id": "4450561", "title": "半导体板块涨幅扩大，盛美上海涨超14%", "content": "半导体板块涨幅扩大，盛美上海涨超14%，珂玛科技、沐曦股份涨超13%，寒武纪涨超8%。", "ctime": 1780463753, "time_str": "13:15:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260603/c677181102.shtml"}, {"id": "4450501", "title": "沪深京三市成交额超2万亿元，较上日此时放量932亿元", "content": "据同花顺iFinD数据，沪深京三市成交额超2万亿元，较上日此时放量932亿元，预计全天成交金额约2.9万亿元。截至目前，沪市成交额9003亿元，深市成交额10860亿元，北证50成交额149亿元。", "ctime": 1780463239, "time_str": "13:07:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260603/c677180926.shtml"}, {"id": "4450473", "title": "东非共同体召开应对埃博拉疫情会议", "content": "当地时间2日，为期两天的东非共同体卫生事务部长会议在坦桑尼亚北部的阿鲁沙结束。会议讨论了遏制本迪布焦型埃博拉病毒疫情的区域措施。东非共同体秘书长史蒂芬·姆本迪表示：“我们正在调动区域机制，并与伙伴国家、非洲疾病预防控制中心、世界卫生组织和发展伙伴密切合作，以加强监测、实验室诊断、感染预防和控制、风险沟通和快速反应能力。”另据东非共同体成员国乌干达当天公布的数据，该国新增6例埃博拉确诊病例。截至目前，乌干达本轮埃博拉疫情确诊病例累计15例，其中1例死亡，2例康复。（央视新闻）", "ctime": 1780463139, "time_str": "13:05:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260603/c677180901.shtml"}, {"id": "4450457", "title": "机器人板块短线拉升，埃斯顿涨停", "content": "机器人板块短线拉升，埃斯顿涨停，拓斯达、凯尔达、绿的谐波、埃夫特、雷赛智能等跟涨。", "ctime": 1780463027, "time_str": "13:03:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260603/c677180880.shtml"}, {"id": "4450435", "title": "南向资金净买入超70亿港元", "content": "据同花顺iFinD数据，截至目前，南向资金净买入超70亿港元，其中港股通（沪）买入超56.14亿港元，港股通（深）买入超14.02亿港元。", "ctime": 1780462969, "time_str": "13:02:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260603/c677180848.shtml"}, {"id": "4450431", "title": "创业板指午后涨4%", "content": "创业板指午后涨4%，沪指涨0.56%，深成指涨2.32%。培育钻石、光通信、光纤、半导体芯片等方向涨幅居前。", "ctime": 1780462940, "time_str": "13:02:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260603/c677180845.shtml"}, {"id": "4450419", "title": "科威特境内有导弹无人机残骸起火", "content": "路透社今天（6月3日）发布了据称是科威特境内来袭导弹或者无人机残骸落地起火画面。科威特国家通讯社科威特通讯社援引军方消息报道，科威特防空部队于今天（6月3日）凌晨拦截了来袭导弹与无人机，但军方未披露袭击来源。科威特通讯社援引科威特总参谋部表态称，民众听到的爆炸声均来自防空拦截作业，同时提醒民众遵照安全指引，远离残骸与不明物品。美东时间6月2日晚，美军中央司令部在社交媒体发文称，伊朗向地区邻国发射多枚弹道导弹，但所有导弹均未命中。其中，两枚射向科威特的导弹未能飞抵目标区域或者在飞行途中解体；三枚射向巴林的导弹被防空部队拦截。(CCTV国际时讯)", "ctime": 1780462890, "time_str": "13:01:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260603/c677180837.shtml"}, {"id": "4450415", "title": "科创50指数涨幅扩大至5%", "content": "科创50指数涨幅扩大至5%，现报1776.01点。", "ctime": 1780462883, "time_str": "13:01:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260603/c677180836.shtml"}, {"id": "4450387", "title": "欧盟部署最大规模应对野火措施", "content": "欧盟委员会发表声明，为应对日益加剧的欧洲野火风险，部署了最大规模的应对措施。这包括通过欧盟民防机制协助筹措资金，协调部署创纪录数量的消防员、飞机和应急专家。近800名消防员将被派往塞浦路斯、希腊、意大利、法国、西班牙和葡萄牙等野火高发地区，22架飞机和5架直升机已处于待命状态。此外，欧盟还计划在塞浦路斯设立一个新的区域消防枢纽，预先部署6架飞机。（新华社）", "ctime": 1780462737, "time_str": "12:58:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260603/c677180814.shtml"}, {"id": "4450383", "title": "顿涅茨克地区遭袭致7人死亡", "content": "顿涅茨克地区领导人普希林3日在社交媒体上表示，一辆巴士当天清晨在该地区遭乌克兰无人机袭击，造成7人死亡、11人受伤。遇袭车辆当时在从莫斯科开往克里米亚的辛菲罗波尔途中。（新华社）", "ctime": 1780462501, "time_str": "12:55:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260603/c677180766.shtml"}, {"id": "4450381", "title": "印尼股市基准指数下跌4.9%", "content": "印尼股市基准指数下跌4.9%，至5889点。", "ctime": 1780462415, "time_str": "12:53:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260603/c677180752.shtml"}, {"id": "4450373", "title": "景顺长城基金旗下全球芯片LOF基金二级市场交易价格明显高于基金份额净值", "content": "景顺长城基金管理有限公司公告，近期，公司旗下全球芯片LOF(501225)二级市场交易价格明显高于基金份额净值，出现较大幅度溢价。为保护投资者利益，该基金将于6月3日下午开市起停牌至当日收市，停牌期间 ode": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260603/c677180400.shtml"}, {"id": "4450317", "title": "机构：长江存储有望凭借存储需求跃居全球市场第三", "content": "研究公司Counterpoint表示，中国存储芯片制造商长江存储有望从人工智能基础设施建设中受益。人工智能热潮正推动对长江存储专攻的Nand闪存创纪录的需求，推动第一季度该市场规模同比增至3.5倍，达到460亿美元。Counterpoint在一份报告中称，在第一季度，随着长江存储从强劲的国内需求和供应短缺中获利，其收入同比飙升445%，使其在全球市场的份额达到13%。研究员MS Hwang认为，注资将为长江存储提供所需的火力，使其领先于竞争对手铠侠和美光科技，并确立其作为全球第三大Nand供应商的地位。（新浪财经）", "ctime": 1780461059, "time_str": "12:30:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260603/c677180372.shtml"}, {"id": "4450313", "title": "安徽马鞍山市和县一大巴车失控造成2人死亡2受伤", "content": "今日（6月3日），安徽省马鞍山市和县公安局发布警情通报，2026年6月2日10时08分，和县历阳镇龙潭路与迎江路交叉口附近发生一起交通事故。接警后，公安机关警力到达现场，联动120急救部门进行救援，同步开展交通秩序维护、事故情况调查等相关工作。经查，张某某（男，57岁）驾驶大型普通客车行至该路段时突发昏厥致车辆失控，碰撞行人和车辆，造成2人死亡，2人受伤（生命体征平稳），其余人员经检查无明显伤情。目前，张某某正在接受公安机关调查，经检测，已排除酒驾、毒驾嫌疑，事故调查、伤者救治、善后处置等工作正在进行。（央视新闻）", "ctime": 1780460655, "time_str": "12:24:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260603/c677180271.shtml"}, {"id": "4450309", "title": "日本10年期国债收益率上涨5个基点，至2.615%", "content": "6月3日，日本10年期国债收益率上涨5个基点，至2.615%。", "ctime": 1780460435, "time_str": "12:20:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260603/c677180220.shtml"}, {"id": "4450301", "title": "玻利维亚两名部长接连辞职", "content": "拉巴斯消息：据玻利维亚《责任报》等媒体2日报道，玻国防部长马塞洛·萨利纳斯和教育部长比阿特丽斯·加西亚当天接连辞职。玻政府尚未公布两人的辞职原因。近期因经济形势恶化和燃料短缺问题加剧，玻利维亚国内抗议活动持续升级，示威者通过封锁道路等方式阻断食品、燃料等物资运输。（新华社）", "ctime": 1780459966, "time_str": "12:12:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260603/c677180012.shtml"}, {"id": "4450297", "title": "广州往返阿斯塔纳首条直飞航线开通，白云机场口岸中亚客流攀升", "content": "6月3日凌晨，随着KC8217航班平稳降落广州白云国 // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
