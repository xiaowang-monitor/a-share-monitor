: "5048925", "title": "期市夜盘收盘，国内期货主力合约多数上涨，焦煤涨超1%", "content": "期市夜盘收盘，国内期货主力合约多数上涨。涨幅方面，焦煤、焦炭、丙烯涨超1%。跌幅方面，豆一、乙二醇、纸浆、燃油跌超1%。", "ctime": 1787842827, "time_str": "23:00:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260827/c679364184.shtml"}, {"id": "5048891", "title": "美加贸易争端升级 双方官员隔空交锋", "content": "加拿大总理卡尼此前宣布，鉴于美国对价值200亿美元的加拿大商品征收50%的关税，加拿大的等额报复性关税计划于9月8日正式生效执行。目前美加双方的谈判陷入停滞，美加政界人士继续上演隔空交锋。美国贸易代表格里尔26日在接受媒体采访时表示，自上周美加贸易谈判破裂后，特朗普政府现阶段与加拿大政府之间没有开放的沟通渠道。同一天，加拿大安大略省省长道格·福特重申，所有反制措施选项仍在考虑范围内。如果贸易冲突进一步恶化，加拿大应当做好切断对美电力、关键矿产出口的准备。（央视新闻）", "ctime": 1787842690, "time_str": "22:58:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260827/c679364170.shtml"}, {"id": "5048867", "title": "Strategy股价12周来首次突破135美元", "content": "Strategy股价12周来首次突破135美元，日内大涨10%，其比特币持仓目前未实现盈利40亿美元。", "ctime": 1787842510, "time_str": "22:55:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260827/c679364151.shtml"}, {"id": "5048847", "title": "西藏吉隆泥石流原因查明 专家组将围绕冰崩源区开展调查", "content": "8月26日10时30分许，因尼泊尔一侧发生泥石流灾害，造成西藏日喀则市吉隆县吉隆口岸重大人员伤亡、失联。自然资源部专家分析，此次灾害是由尼泊尔境内高位冰川崩塌引发的碎屑流链式灾害。冰崩物质高速下泄，沿沟道裹挟冰碛物演变为碎屑流，进而汇入东林藏布形成泥石流，冲击吉隆口岸。8月27日，来自自然资源部中国地质调查局、西藏自治区自然资源系统的45名地质灾害应急专业技术人员陆续抵达受灾核心区域。自然资源部专家工作组根据灾前灾后的高分辨率卫星遥感影像，结合地震报告数据以及现场回传影像，初步判断此次灾害的源头位于尼泊尔境内，在吉隆口岸上游东林藏布河支流郭巴峡曲支沟错坚河上游发生高位冰崩，崩塌后势能巨大，铲刮沟道冰碛物，形成高速碎屑流，沿沟道运动并演变为泥石流，冲击了口岸设施，造成重大人员伤亡。据推算，冰崩碎屑流平均速度超过50米/秒。据了解，根据救援保障需要，专家工作组已组成冰崩源区、堰塞湖、沟道沿岸及流域周边等4个应急调查组，编制形成应急调查工作方案。下一步，自然资源部专家工作组将围绕冰崩源区其他冰体致灾风险开展调查，排查冰崩下游沟道及口岸区域成灾范围，对堰塞湖开展调查监测，同时围绕村民安置点、变形斜坡、救援通道和高风险冰湖开展排查，评估对救援安全可能产生的风险，并会同相关部门落实防范措施。（央视新闻）", "ctime": 1787842175, "time_str": "22:49:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260827/c679364115.shtml"}, {"id": "5048823", "title": "大量调运物资已陆续到达西藏吉隆", "content": "记者27日从西藏自治区应急管理厅了解到，西藏自治区日喀则市吉隆县吉隆镇已调运到位青稞20吨、大米50吨、面粉20吨、食用油1吨，帐篷1122顶、折叠床2361张、棉被8054床、褥子2126床、毛毯2519床、藏式被1261床、藏毛毯1141床、雨衣裤2579套、雨胶鞋3829双，火炉47个、担架100个、发电机14台、饮用水15500箱、方便面2600箱、牛奶和酸奶300箱、火腿肠和午餐肉罐头300箱等生活物资。同时，应急管理部调拨的中央3万件救灾物资预计也将在27日23时前全部到达。（央视新闻）", "ctime": 1787841944, "time_str": "22:45:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260827/c679364077.shtml"}, {"id": "5048787", "title": "霍尔木兹海峡局势趋紧 海湾产油国多措并举欲保原油出口", "content": "近期有英国方面消息显示，受霍尔木兹海峡航运安全局势紧张影响，海湾产油国近期多方调整原油外运策略，或是自建、扩充油轮船队，或是调整转运模式，带动油轮成交价、租船费率同步走高，航运市场格局随之发生显著变化。船舶经纪商布雷马尔的数据显示，最大级别油轮的新船以及较新二手船的价格，在上个季度均已超过1.3亿美元，创下2008年以来新高，与此同时，超大型油轮一年期租船费率同样攀升至历史高点。据了解，阿布扎比国家石油公司本月已投入13亿美元，购入6艘超大型油轮和5艘大型液化气运输船，并迅速投入运营，公司还计划继续大规模收购二手油轮扩充运力。沙特国家航运公司巴赫里（Bahri）本月早些时候表示，其船队规模已达到创纪录的107艘，市场判断沙特还有进一步购船的潜在需求。（央视新闻）", "ctime": 1787841527, "time_str": "22:38:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260827/c679363925.shtml"}, {"id": "5048785", "title": "伊朗议长与卡塔尔首相会晤 就缓和地区局势交换意见", "content": "当地时间27日，伊朗议会议长卡利巴夫在德黑兰会见了到访的卡塔尔首相兼外交大臣穆罕默德。双方就地区当前局势以及如何缓和紧张局势、为重启对话创造有利条件交换了意见。穆罕默德强调有必要重启外交途径，并表示对话是解决分歧、防止地区紧张局势进一步升级的最佳途径。（央视新闻）", "ctime": 1787841462, "time_str": "22:37:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260827/c679363915.shtml"}, {"id": "5048777", "title": "英特尔股价涨幅扩大至5%，报92.700美元/股，总市值报4900亿美元", "content": "英特尔股价涨幅扩大至5%，报92.700美元/股，总市值报4900亿美元。", "ctime": 1787841366, "time_str": "22:36:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260827/c679363900.shtml"}, {"id": "5048769", "title": "美国天然气期货涨幅收窄", "content": "美国能源信息署（EIA）公布天然气库存增幅低于预期后，美国天然气期货涨幅收窄，最新上涨2.3%。", "ctime": 1787841293, "time_str": "22:34:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260827/c679363892.shtml"}, {"id": "5048741", "title": "伊朗消息人士：仍与阿曼磋商霍尔木兹海峡协议细节", "content": "伊朗伊斯兰革命卫队发言人侯赛因·穆赫比26日称，伊朗与阿曼就各自在霍尔木兹海峡控制水域的占比及收益分配达成双方均认可的协议。不过，伊朗一名高级消息人士表示，双方仍在磋商具体细节。伊朗本月早些时候曾表示，协议已接近达成。伊朗方面同时指责美国持续阻挠伊朗与阿曼的谈判，导致谈判进程拖延。（央视新闻）", "ctime": 1787841077, "time_str": "22:31:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260827/c679363855.shtml"}, {"id": "5048735", "title": "美国8月21日当周EIA天然气库存变动 150亿立方英尺", "content": "美国8月21日当周EIA天然气库存变动 150亿立方英尺，前值 160亿立方英尺。", "ctime": 1787841050, "time_str": "22:30:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260827/c679363852.shtml"}, {"id": "5048719", "title": "白宫：美伊目前没有进行任何谈判", "content": "美国白宫新闻秘书莱维特27日说，目前美国和伊朗之间没有进行任何谈判。即将离任的莱维特当天在接受福克斯新闻频道采访时说：“目前没有任何谈判进行，这种情况会一直持续下去，直到总统觉得他们或许会以有意义的方式回到谈判桌前。我们还没有看到这种情况。”莱维特说，美方继续动用一切经济手段对伊朗施压。她同时称，美国总统特朗普“仍然保留所有选项”，特朗普的首要目标是“确保伊朗永远无法获得核武器”。（新华社）", "ctime": 1787841041, "time_str": "22:30:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260827/c679363851.shtml"}, {"id": "5048705", "title": "美联储哈玛克：担心通胀思维可能开始形成", "content": "美联储哈玛克：担心通胀思维可能开始形成。", "ctime": 1787840888, "time_str": "22:28:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260827/c679363800.shtml"}, {"id": "5048681", "title": "国晟科技第四大股东刘鑫二季度减仓1900万股", "content": "国晟科技发布2026年半年报显示，与2026年一季报相比，第四大股东刘鑫减仓1900万股至666.66万股，占总股本比例1.01%。", "ctime": 1787840833, "time_str": "22:27:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260827/c679363792.shtml"}, {"id": "5048631", "title": "国晟科技：上半年净亏损8634.56万元", "content": "国晟科技公告，2026年 const SECTORS  = [{"name": "金融", "hit_count": 33, "etfs": []}, {"name": "人工智能", "hit_count": 29, "etfs": []}, {"name": "数据要素", "hit_count": 24, "etfs": []}, {"name": "半导体", "hit_count": 16, "etfs": []}, {"name": "新能源", "hit_count": 10, "etfs": []}, {"name": "军工", "hit_count": 8, "etfs": []}, {"name": "消费", "hit_count": 7, "etfs": []}, {"name": "医药", "hit_count": 5, "etfs": []}];

// 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'

  container.innerHTML = agents.map(a => `

      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>

        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
