 "", "url": "https://news.10jqka.com.cn/20260501/c676436392.shtml"}, {"id": "4311833", "title": "内外压力叠加 欧元区经济复苏前景堪忧", "content": "欧盟统计局4月30日发布的最新数据显示，今年第一季度欧元区经济增速放缓，4月通胀率显著上升。欧洲央行同日决定，维持欧元区三大关键利率不变。分析人士指出，在全球地缘冲突影响外溢、能源价格剧烈波动、贸易环境趋紧和内部结构性矛盾交织作用下，欧元区正陷入增长乏力、需求疲弱、不确定性高企的困局，滞胀风险明显上升，经济复苏前景堪忧。（新华社）", "ctime": 1777620700, "time_str": "15:31:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260501/c676436388.shtml"}, {"id": "4311829", "title": "泽连斯基称乌克兰多地遭袭 多人受伤", "content": "当地时间5月1日，乌克兰总统泽连斯基通过社交媒体发文称，该国多地夜间遭俄军袭击。泽连斯基称，俄方袭击了敖德萨，致5人受伤、两栋建筑起火；克里沃罗格遭无人机袭击，致1人受伤；哈尔科夫铁路基础设施遭袭，牵引变电站被毁，数千户家庭断电；此外，苏梅和扎波罗热地区也遭袭击。泽连斯基说，俄军此次出动210架攻击型无人机，其中约140架为“见证者”系列。目前俄罗斯方面对此暂无回应。（央视新闻）", "ctime": 1777620363, "time_str": "15:26:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260501/c676436381.shtml"}, {"id": "4311821", "title": "美元兑日元在急挫约150点后，又拉升约90点", "content": "美元兑日元在急挫约150点后，又拉升约90点，现报156.35。", "ctime": 1777620133, "time_str": "15:22:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260501/c676436377.shtml"}, {"id": "4311817", "title": "5月1日全社会跨区域人员流动量预计超3.4亿人次", "content": "记者从交通运输部获悉，预计2026年5月1日（“五一”假期第一天），全社会跨区域人员流动量3.44亿人次，环比增长55.9%，同比增长3.4%。其中：铁路客运量2480万人次，环比增长25.3%，同比增长7.3%。公路人员流动量（包括高速公路及普通国省道非营业性小客车人员出行量、公路营业性客运量）3.15亿人次，环比增长59.5%，同比增长3.2%。其中，公路营业性客运量4069万人次，环比增长12.4%，同比增长3.1%；高速公路及普通国省道非营业性小客车人员出行量2.75亿人次，环比增长70.0%，同比增长3.2%。水路客运量173万人次，环比增长97.0%，同比增长4.9%。民航客运量233万人次，环比下降2.1%，同比下降0.7%。（人民日报）", "ctime": 1777620063, "time_str": "15:21:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260501/c676436375.shtml"}, {"id": "4311809", "title": "LME镍主力合约涨超1%", "content": "LME镍主力合约涨超1%，现报19590.0美元/吨。", "ctime": 1777619907, "time_str": "15:18:27", "stock_code": "", urce": "", "url": "https://news.10jqka.com.cn/20260501/c676436311.shtml"}, {"id": "4311759", "title": "特朗普再批主持人 美监管机构提前审查电视台执照引质疑", "content": "美国总统特朗普4月30日再次“炮轰”美国知名脱口秀节目主持人吉米·基梅尔，并称电视台让基梅尔主持节目是在自找麻烦。同一天，美国联邦通信委员会否认因承受外界压力启动对美国广播公司旗下电视台的“提前审查”。（央视新闻）", "ctime": 1777618728, "time_str": "14:58:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260501/c676436309.shtml"}, {"id": "4311757", "title": "乌克兰官员称日本放宽武器出口限制或可让乌获得日本武器", "content": "乌克兰驻日本大使尤里·卢托维诺夫日前在接受采访时称，日本放宽武器出口限制，让两国未来有机会就日本向乌克兰出口军事装备举行对话。卢托维诺夫称，“印太地区与欧洲大陆不可分割”，“如果乌克兰沦陷”，将产生“多米诺骨牌效应”。日本此举让双方“有了进行对话的机会”，乌方可从日方获得资助以开发防空系统，从而减少对美国制“爱国者”导弹的依赖。卢托维诺夫还称，有关日本参与“乌克兰优先需求清单”的讨论也在进行中。“每个国家都可在尊重本国法律框架的情况下参与这一机制，也可提供非致命武器。”他称，乌克兰需要为前线部署的数千架无人机提供电子产品和微型部件，日本公司可帮助乌克兰实现电子产品和微型部件来源的多样化。（央视新闻）", "ctime": 1777618589, "time_str": "14:56:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260501/c676436303.shtml"}, {"id": "4311755", "title": "电影《寒战1994》总票房破3000万元", "content": "据猫眼专业版数据，电影《寒战1994》上映1天，总票房破3000万元。（人民财讯）", "ctime": 1777618351, "time_str": "14:52:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260501/c676436295.shtml"}, {"id": "4311727", "title": "日经225指数收涨0.38%", "content": "日经225指数收涨0.38%，报59513.12点。韩国股市休市。", "ctime": 1777617067, "time_str": "14:31:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260501/c676436261.shtml"}, {"id": "4311723", "title": "现货白银跌超1%", "content": "现货白银跌超1%，现报73.58美元/盎司。", "ctime": 1777617019, "time_str": "14:30:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260501/c676436260.shtml"}, {"id": "4311711", "title": "现货黄金失守4600美元/盎司", "content": "现货黄金失守4600美元/盎司，日内跌0.47%。", "ctime": 1777616383, "time_str": "14:19:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260501/c676436223.shtml"}, {"id": "4311709", "title": "“我没意见”　特朗普就伊朗队赴美参加世界杯表态", "content": "美国总统特朗普4月30日就伊朗国家男子足球队将赴美参加2026年世界杯一事表态，称他“没意见”。特朗普在总统办公室告诉媒体记者，既然国际足联主席因凡蒂诺发话了，“那我没意见”。“你们猜怎么着？就让他们踢比赛呗。”(新华社)", "ctime": 1777616253, "time_str": "14:17:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260501/c676436221.shtml"}, {"id": "4311703", "title": "东风奕派4月销量20537辆", "content": "5月1日，东风奕派科技公布，2026年4月销量20537辆，1-4月累计销量同比增长18%。(界面)", "ctime": 1777615665, "time_str": "14:07:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260501/c676436207.shtml"}, {"id": "4311699", "title": "日本开始追加释放国家石油储备", "content": "当地时间5月1日，日本政府表示，已在茨城县内的石油基地开始追加释放国家石油储备。受中东局势影响，日本近期原油进口量骤降，引发广泛担忧。3月26日，日本政府开始释放国家石油储备。4月10日，日本首相高市早苗表示，将在5月追加释放约相当于20天用量的国家石油储备。(央视新闻)", "ctime": 1777615628, "time_str": "14:07:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260501/c676436206.shtml"}, {"id": "4311631", "title": "上海签署首份覆盖全市快递行业的劳动规则协议", "content": "4月30日，上海市签署首份覆盖全市快递行业的劳动规则协议。该协议由快递行业职工方代表与企业方代表面对面平等协商达成，聚焦收入保障、权益保障、劳动保护和关心关爱四大核心议题。协议明确了快递从业人员月最低工资标准不低于本市月最低工资标准的110%，并规定每单派费直达快递员比例原则上不低于应得派费的25%。此外，协议还要求快递企业与符合建立劳动关系的快递员签订劳动合同，保障休息休假权利，并提供劳动防护用品等。（央视新闻）", "ctime": 1777614384, "time_str": "13:46:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260501/c676436178.shtml"}, {"id": "4311615", "title": "今起施行 杭州为具身智能机器人立法", "content": "5月1日，全国首部具身智能机器人领域地方性法规《杭州市促进具身智能机器人产业发展条例》正式施行。数据显示，杭州已集聚机器人产业相关企业700余家，2025年具身智能产业集群产值达1068亿元。创新是引领发展的第一动力，但创新活动天然伴随未知风险。促进具身智能机器人产业专门立法，是以高质量法治供给护航科技创新，让科技创新的“关键变量”转化为推动高质量发展的“最大增量”。（杭州发布）", "ctime": 1777613551, "time_str": "13:32:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260501/c676436158.shtml"}, {"id": "4311591", "title": "跨境客流持续走高 广深港高铁成为大湾区互联互通“黄金通道”", "content": "记者从深圳铁路部门获悉，2026年1至4月，广深港高铁跨境客流持续走高，累计运送跨境旅客1108万人次，较去年同期增加144万人次，增幅15%。其中，香港发往内地旅客537.8万人次，内地发往香港旅客570.2万人次，客流双向奔赴日益密切，广深港高铁“黄金通道”作用更加彰显。今年“五一”假期，旅客出行意愿强烈，广深港高铁预计日均运送跨境旅客11.9万人次，客流高峰将出现在5月1日，预计达到14万人次。为更好保障旅客出行需求，铁路部门加大运力投放，日均开行跨境旅客列车超230列。其中，4月30日至5月3日，香港西九龙站至福田站间每日加开旅客列车13列，助力跨境客流更加高效畅通。（央视新闻）", "ctime": 1777611892, "time_str": "13:04:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260501/c676436096.shtml"}, {"id": "4311569", "title": "11国外长谴责以袭击全球坚韧船队", "content": "据土耳其外交部消息，4月30日，土耳其、巴西、约旦、巴基斯坦、西班牙、马来西亚、孟加拉国、哥伦比亚、马尔代夫、南非和利比亚等国外交部长发表联合声明，强烈谴责以色列袭击“全球坚韧船队”。声明指出，该船队所进行的是一项旨在引起国际社会关注加沙人道主义局势的民间人道主义行动。以方对船只实施攻击并在国际水域拘押活动人士，严重违反了国际法和国际人道主义法。(央视军事)", "ctime": 1777611203, "time_str": "12:53:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260501/c676436065.shtml"}, {"id": "4311547", "title": "国务院安委办部署“五一”假期期间安全生产明查暗访工作", "content": "记者今天从应急管理部获悉，国务院安委会办公室日前对“五一”假期安全生产防范工作作出安排，要求各地区和有关部门切实加强假期期间安全生产工作，坚决防范遏制重特大事故，有效防范较大和重大涉险事故，切实维护人民群众生命财产安全和社会稳定。国务院安委办指导协调有关部门派出工作组，对重点地区、重点行业领域和重点企业假期期间安全生产进行明查暗访。文化和旅游部对景区景点安全防范、热门旅游景点人流管控、旅行社和导游安全管理、“黑景点”整治等情况开展暗访。国务院国资委针对工程建设、危险化学品、施工作业现场、生产车间等安全管理情况，指导有关中央企业总部对所属企业安全生产情况开展暗访。国家消防救援局组织对人员密集场所防火工作开展暗访。国家矿山安全监察局对煤矿、非煤矿山开展暗访。应急管理部聚焦节假日重点行业领域开展综合暗访。通过明查暗访推动各地各有关部门压紧压实安全生产责任，及时消除安全隐患，确保假期全国安全生产形势平稳有序。针对明查暗访发现的典型案例将依法查处、追责问责、公开曝光。各地区也将结合实际，同步组织开展针对性安全生产明查暗访工作。（央视新闻）", "ctime": 1777609456, "time_str": "12:24:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260501/c676436012.shtml"}, {"id": "4311535", "title": "中国常驻联合国副代表孙磊对美起草安理会涉南苏丹决议一意孤行表示遗憾", "content": "中国常驻联合国副代表孙磊4月30日在安理会表决联合国南苏丹特派团（联南苏团）授权延期决议草案后作解释性发言，对美国作为草案执笔国的做法表示遗憾。孙磊说，联南苏团为维护南苏丹和平稳定、推进政治进程发挥了重要作用，中方一贯全力支持联南苏团工作，支持联南苏团授权继续延期。当前，南苏丹正处于实现和平发展的关键阶段，联南苏团的授权和能力需要根据形势优化加强。中方本着建设性态度参与决议草案磋商，会同安理会其他成员提出了不少合理修改建议。遗憾的是，决议草案弱化联南苏团支持南苏丹和平进程和重振协议落实的授权、削减联南苏团兵力上限、向南苏丹政府过度施压。鉴于此，中方不得不投出弃权票。（央视新闻）", "ctime": 1777608480, "time_str": "12:08:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260501/c676435998.shtml"}, {"id": "4311529", "title": "蔚来汽车四月交付量为29356辆 同比增长23%", "content": "蔚来汽车四月交付量为29,356辆，同比增长23%。其中，蔚来品牌交付新车19,024台；乐道品牌交付新车5,352台，同比增长21.6%；firefly萤火虫品牌交付新车4,980台。今年前四个月，蔚来公司共交付新车112,821台，同比增长71.0%。截至目前，蔚来公司已累计交付新车1,110,413台。", "ctime": 1777608234, "time_str": "12:03:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260501/c676435995.shtml"}, {"id": "4311503", "title": "商务部新闻发言人就美国联邦通信委员会审议通过检测认证和电信领域相关限制措施事答记者问", "content": "商务部新闻发言人就美国联邦通信委员会审议通过检测认证和电信领域相关限制措施事答记者问。问：美东时间4月30日，美国联邦通信委员会（FCC）审议通过相关限制措施，拟取消未与美国签署“互认协议”国家检测认证机构资质，禁止被列入所谓“覆盖清单”的实体在美开展电信业务。后续相关措施将征求公众意见。请问商务部对此有何评论？答：美国联邦通信委员会摒弃技术中立原则，泛化国家安全概念，在没有事实依据的情况下，频频出台限制措施，歧视性对待包括中国在内的他国企业和产品，严重损害中国及其他相关贸易伙伴利益。这些限制措施冲击中美经贸关系来之不易的稳定，违背两国元首达成的共识，中方对此高度关注，坚决反对。(商务部)", "ctime": 1777607485, "time_str": "11:51:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260501/c676435981.shtml"}, {"id": "4311473", "title": "南非葡萄酒行业欢迎中国零关税举措", "content": "南非葡萄酒协会和南非葡萄酒业协会4月30日发表新闻公报，对中国自2026年5月1日起对所有非洲建交国实施零关税表示欢迎，认为此举为南非葡萄酒行业提供了“至关重要的机遇”。 新闻公报说，零关税举措将显著提升南非葡萄酒的价格竞争力，为南非葡萄酒在中国市场提升品牌地位提供重要机遇，预计短期内南非葡萄酒的价值定位将有所提升，出口量有望复苏。长远来看，机遇将不仅限于销量增长，还包括推动产品高端化、强化品牌定位以及与中国分销商和电商平台建立更深入的战略合作伙伴关系。 南非葡萄酒业协会首席执行官茜奥班·汤普森在新闻公报中说，零关税举措让南非葡萄酒行业看到了与中国消费者和贸易伙伴建立更深层次关系的巨大潜力。南非葡萄酒行业已做好充分准备，与进口商、分销商及当地合作伙伴携手合作。 南非葡萄酒协会是代表南非葡萄酒行业全价值链的全国性机构。南非葡萄酒业协会是负责在国际市场推广南非葡萄酒的官方行业机构。( // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>

}

      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
