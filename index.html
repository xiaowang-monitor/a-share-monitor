: "4192969", "title": "信维通信：向特定对象发行股票申请获深交所受理", "content": "信维通信公告，公司于近日收到深圳证券交易所出具的《关于受理深圳市信维通信股份有限公司向特定对象发行股票申请文件的通知》。深交所对公司报送的向特定对象发行股票的申请文件进行了核对，认为申请文件齐备，决定予以受理。公司本次向特定对象发行股票的事宜尚需通过深交所审核，并获得中国证监会同意注册后方可实施，最终能否通过深交所审核并获得中国证监会同意注册的决定及时间仍存在不确定性。", "ctime": 1775556715, "time_str": "18:11:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260407/c675803769.shtml"}, {"id": "4192967", "title": "林泰新材：2025年净利润1.41亿元，同比增长74.22%", "content": "林泰新材公告，2025年营业收入4.2亿元，同比增长34.44%。净利润1.41亿元，同比增长74.22%。公司董事会提出2025年度权益分派预案，每10股派现6元（含税），不送股、不转增。", "ctime": 1775556694, "time_str": "18:11:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260407/c675803755.shtml"}, {"id": "4192965", "title": "云汉芯城：预计2026年第一季度净利润同比增长139.40%–164.60%", "content": "云汉芯城公告，预计2026年第一季度归属于上市公司股东的净利润为4904.41万元–5420.66万元，比上年同期的2048.62万元增长139.40%–164.60%；归属于上市公司股东的扣除非经常性损益后的净利润为4526.91万元–5003.42万元，比上年同期的1691.14万元增长167.68%–195.86%。2026年第一季度，人工智能算力、新能源汽车等领域需求旺盛，带动相关电子元器件需求持续增长，为公司业务发展提供了有利的行业环境。同时，公司持续推进产业互联网平台建设，优化供应链服务能力，提升运营效率与客户体验，线上平台业务、“芯晶采”数智化内采平台业务、互联网+授权代理业务、国产器件销售、海外业务等主要业务领域均呈快速增长态势，共同推动电子元器件销售收入较上年同期实现较大幅度增长。", "ctime": 1775556689, "time_str": "18:11:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260407/c675803753.shtml"}, {"id": "4192961", "title": "英国海事贸易组织：一艘集装箱船在伊朗附近海域被击中", "content": "英国海事贸易组织7日说，一艘集装箱船报告称在伊朗附近海域被一枚不明发射物击中，导致船只受损，船员均安全。该组织说尚未收到任何环境影响报告。（新华社）", "ctime": 1775556666, "time_str": "18:11:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260407/c675803749.shtml"}, {"id": "4192953", "title": "宗馥莉与弟妹握手言和？知情人士：完全没有的事", "content": "日前，有消息称，今年清明节期间，宗馥莉主动邀请同父异母的弟弟妹妹宗继昌和宗婕莉见面，释放了一个“和解”的信号。消息还称，宗馥莉邀请弟妹二人共同收购上城文旅拥有的娃哈哈股份。此前，宗馥莉与宗继昌等人关系紧张。2025年7月，据媒体报道，宗继昌、宗婕莉和宗继盛在香港和杭州提起诉讼，以宗馥莉同父异母弟妹的身份，要求获得各价值7亿美元的信托基金权益。原告方称，这些基金是宗庆后生前承诺设立。宗庆后曾指示下属通过香港汇丰银行设立信托，该汇丰账户在2024年初的余额约为18亿美元。就此，一名知情人士告诉记者，该消息完全是不实消息，完全没有的事。他同时表示，此前宗继昌等人起诉宗馥莉一事也依然处于诉讼阶段。（经济参考报）", "ctime": 1775556569, "time_str": "18:09:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260407/c675803632.shtml"}, {"id": "4192949", "title": "龙净环保：拟与亿纬锂能共同投资设立合资公司", "content": "龙净环保公告，公司拟与亿纬锂能共同投资设立合资公司，共同投资建设60GWh大容量储能电池工厂。合资公司注册资本为人民币9亿元，亿纬锂能持股80%，龙净环保持股20%。后期注册资本金增加根据合资公司发展届时商议决定，双方根据股权比例等比例增加并实缴，龙净环保累计出资不超过人民币2.4亿元。", "ctime": 1775556503, "time_str": "18:08:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260407/c675803606.shtml"}, {"id": "4192943", "title": "西部矿业：西矿资产拟增持股份1.1%-2%", "content": "西部矿业公告，自2026年4月8日起6个月内，一致行动人青海西矿资产拟通过上交所集中竞价增持公司股份1.1%-2%，即2621.3万股-4766万股，增持价格不设区间，资金来源为自有资金与专项贷款结合。目前西矿集团及其一致行动人合计持股7.37亿股，占30.93%，其中西矿资产持股1.78亿股，占7.46%。", "ctime": 1775556413, "time_str": "18:06:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260407/c675803570.shtml"}, {"id": "4192939", "title": "东瑞股份：2026年3月份，公司共销售生猪收入1.93亿元，环比下降2.69%", "content": "东瑞股份公告，2026年3月份，公司共销售生猪17.47万头，销售收入1.93亿元，环比下降2.69%；商品猪销售均价10.94元/公斤，环比下降11.09%。其中向全资子公司河源市东瑞肉类食品有限公司销售生猪0.67万头。", "ctime": 1775556322, "time_str": "18:05:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260407/c675803495.shtml"}, {"id": "4192933", "title": "德黑兰今天已遭到三轮袭击", "content": "当地时间今天（4月7日）13点20分，伊朗首都德黑兰再次遭袭，爆炸现场升起浓烟。截至目前，德黑兰当天已至少已经遭到三轮袭击。当天，伊朗政府发言人穆哈杰拉尼表示，截至目前伊朗已有 218个卫生单位遭到袭击，24名医护人员死亡。（CCTV国际时讯）", "ctime": 1775556282, "time_str": "18:04:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260407/c675803474.shtml"}, {"id": "4192929", "title": "盛屯矿业：拟3亿美元收购Nkoyi 50%股权", "content": "盛屯矿业公告，全资下属公司宏盛国际及Preeminence拟以3亿美元收购Nkoyi 50%股权，从而获得Nkoyi间接持有的特定铜钴矿采矿权30%权益。交易完成后，Nkoyi将成为盛屯矿业参股子公司，不纳入合并报表范围。本次交易不构成关联交易或重大资产重组，已获董事会审议通过，无需提交股东会审议。", "ctime": 1775556271, "time_str": "18:04:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260407/c675803469.shtml"}, {"id": "4192917", "title": "伊拉克阿萨德空军基地遭袭 伊国防部称有权予以回击", "content": "当地时间7日，伊拉克国防部发表声明称，当天8时55分，伊拉克特种部队成功拦截了一架企图袭击伊西部安巴尔省阿萨德空军基地内特种部队驻地雷达系统的无人机，该无人机“来源不明”，被击落后未发生爆炸，避免了人员伤亡和财产损失。声明指出，阿萨德空军基地是伊拉克军事基地，驻扎于该基地的所有部队均隶属于伊拉克国防部，基地内所有装备属于伊拉克军队。此类袭击损害国家利益，危及维护伊拉克及其人民安全的军队士兵的生命安全。声明重申，对于任何以伊拉克国防部驻地或人员为目标的势力，伊国防部均有权予以回击。（央视新闻）", "ctime": 1775556173, "time_str": "18:02:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260407/c675803430.shtml"}, {"id": "4192909", "title": "我国心脏除颤器校准装置计量比对工作完成", "content": "国家市场监督管理总局近日组织完成我国心脏除颤器校准装置计量比对工作。这项工作为自动体外除颤器（AED）的精准度进行了一次全国统一的“标尺”考核，从源头确保其在心脏骤停抢救的“黄金四分钟”内可靠可用。（新华社）", "ctime": 1775556103, "time_str": "18:01:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260407/c675803391.shtml"}, {"id": "4192901", "title": "中国政府中东问题特使翟隽会见法国驻华大使白玉堂", "content": "2026年4月7日，中国政府中东问题特使翟隽应约会见法国驻华大使白玉堂，双方就当前中东紧张局势交换意见。白玉堂表示，法方对中东地区局势升级、战事对全球经济带来负面影响深表关切。中国和巴基斯坦关于恢复海湾和中东地区和平稳定的五点倡议同法方立场较为契合。法方愿同中方保持协调，推动地区恢复和平稳定。翟隽表示，当前战事持续升级外溢，危及地区和平稳定，冲击全球经济、能源安全。中法同为联合国安理会常任理事国，应秉持公道正义，携手促和止战，推动地区紧张局势降温，支持当事方重回对话谈判的正确轨道。（外交部网站）", "ctime": 1775556035, "time_str": "18:00:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260407/c675803346.shtml"}, {"id": "4192873", "title": "伊朗首都德黑兰再次遭袭", "content": "当地时间7日13时20分，伊朗首都德黑兰再次遭袭。当天早些时候，德黑兰传出密集爆炸声，伊朗防空系统已启动。（央视新闻）", "ctime": 1775555841, "time_str": "17:57:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260407/c675803247.shtml"}, {"id": "4192861", "title": "海立股份：2025年净利润7182.09万元，同比增长112.18%", "content": "海立股份公告，2025年营业收入204.98亿元，同比增长9.34%。净利润7182.09万元，同比增长112.18%。公司拟以10.73亿股为基数，向全体股东每10股派发现金红利0.28元（含税），合计拟派发现金红利3005.36万元（含税），占2025年度合并报表中归属于上市公司普通股股东的净利润的比例为41.85%。", "ctime": 1775555555, "time_str": "17:52:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260407/c675803121.shtml"}, {"id": "4192857", "title": "黎明兴当选越南总理并宣誓就职", "content": "经越南第十六届国会第一次会议7日投票表决，越共中央政治局委员、中央组织部部长黎明兴当选越南政府总理，任期为2026年至2031年。越南国会当天以电子投票方式通过黎明兴出任新任越南政府总理的决议。投票结果显示，495名与会代表全部投赞成票。黎明兴随后宣誓就职。黎明兴在就职演说中说，将“以最高决心调控经济，实现高速、可持续增长”，并承诺将与政府和各部委、各地方团结一心，带领国家进入突破发展、富强繁荣、文明幸福的新阶段。（央视新闻）", "ctime": 1775555385, "time_str": "17:49:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260407/c675803046.shtml"}, {"id": "4192855", "title": "福元医药：丁二磺酸腺苷蛋氨酸肠溶片获得药品注册证书", "content": "福元医药公告，近日，公司收到了国家药品监督管理局颁发的丁二磺酸腺苷蛋氨酸肠溶片《药品注册证书》，批准该药品生产。", "ctime": 1775555365, "time_str": "17:49:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260407/c675803036.shtml"}, {"id": "4192853", "title": "斯迪克：与全资子公司斯迪克江苏在泰国投资设立斯迪克新材料（泰国）有限公司，总投资额50万美元", "content": "斯迪克公告，为满足公司海外业务发展需要，公司与全资子公司斯迪克新型材料（江苏）有限公司共同在泰国投资设立斯迪克新材料（泰国）有限公司。本项目总投资额50万美元，公司以自有资金出资45万美元，占比90%；斯迪克江苏以自有资金出资5万美元，占比10%。", "ctime": 1775555360, "time_str": "17:49:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260407/c675803035.shtml"}, {"id": "4192849", "title": "广弘控股：子公司投资建设智慧冷链物流中心，投资金额不超过18.43亿元", "content": "广弘控股公告，公司所属广东广弘智慧港产业运营管理有限公司投资建设广弘控股食品智慧冷链物流中心项目。项目位于广州市增城区中新镇福宁大道西侧，总用地面积95173.8平方米，总建筑面积约20.78万平方米，规划冷库库容11.87万吨，达产后每年可实现冷冻生鲜食品快速分拣配送能力超100万吨。项目投资金额不超过18.43亿元，资金来源为自有资金和银行贷款。", "ctime": 1775555216, "time_str": "17:46:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260407/c675802975.shtml"}, {"id": "4192847", "title": "日本拟放宽武器出口限制引发批评", "content": "日本政府4月6日在自民党安全保障调查会上，提出了放宽武器出口限制的方案。围绕该方案，日本国内出现不少批评声音。日本法政大学教授白鸟浩表示，在无需国会批准的情况下出口杀伤性武器，日本可能成为“对外输出战争的国家”。此外，部分日本民众针对方案中“事后通知国会”提出质疑称，“事后才通知国会？那还要国会干嘛？完全是自民党在为所欲为。”还有民众表示，“在自民党的把控下，国会正变得越来越形同虚设。”（CCTV国际时讯）", "ctime": 1775555198, "time_str": "17:46:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260407/c675802970.shtml"}, {"id": "4192833", "title": "香飘飘：与路凯等共同设立基金，认缴出资3000万元", "content": "香飘飘公告，公司与路凯（海南）投资合伙企业（有限合伙）、海南诺圆智能科技有限公司、无锡市新吴区科产沣泽投资合伙企业（有限合伙）、北京易明海众投资管理有限公司、杭州华盛汇泽自有资金投资有限公司共同投资设立路威凯腾机遇壹号（无锡）股权投资合伙企业（有限合伙）。该基金目标认缴出资总额为5亿元，首期认缴出资额为1.64亿元，公司作为有限合伙人认缴出资3000万元，占首期认缴出资额的18.35%。", "ctime": 1775555008, "time_str": "17:43:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260407/c675802800.shtml"}, {"id": "4192819", "title": "龙泉股份：公司与襄阳中环水务有限公司签订工程货物购销合同，合同总价款为人民币9942.75万元", "content": "龙泉股份公告，公司与襄阳中环水务有限公司签订工程货物购销合同，合同总价款为人民币9942.75万元。", "ctime": 1775554823, "time_str": "17:40:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260407/c675802725.shtml"}, {"id": "4192815", "title": "伊朗说正为保障霍尔木兹海峡和波斯湾安全制定计划", "content": "据伊朗伊斯兰共和国广播电视台7日报道，伊朗议会国家安全与外交政策委员会发言人易卜拉欣·雷扎伊当天在电视采访中表示，伊朗正在为保障霍尔木兹海峡和波斯湾安全制定计划及相关立法，并重申霍尔木兹海峡不会恢复到以前的状态。雷扎伊还说，目前伊朗石油出口一切照常，石油产能甚至比以往更高，已采取必要措施保障哈尔克岛的安全。哈尔克岛位于波斯湾西北部，距离伊朗海岸大约25公里，长约6公里、宽约3公里，是伊朗最大原油出口基地，伊朗90%的原油都从这里出口。(新华社)", "ctime": 1775554793, "time_str": "17:39:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260407/c675802707.shtml"}, {"id": "4192805", "title": "诺思兰德：子公司平衡盐溶液（供灌注用）获药品补充申请批准", "content": "诺思兰德公告，子公司北京汇恩兰德制药股份有限公司于近日收到国家药品监督管理局核准签发的关于“平衡盐溶液（供灌注用）”《药品补充申请批准通知书》。药品名称为平衡盐溶液（供灌注用），剂型为冲洗剂，注册分类为化学药品，规格为250ml（氯化钙0.48mg/ml；氯化镁0.3mg/ml；氯化钾0.75mg/ml；醋酸钠3.9mg/ml；氯化钠6.4mg/ml；枸橼酸钠1.7mg/ml），适应症为眼科手术中，作为眼内或眼外的灌注液。申请内容为增加规格250ml，审批结论为批准增加规格250ml，药品批准文号为国药准字H20269084。", "ctime": 1775554461, "time_str": "17:34:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260407/c675802595.shtml"}, {"id": "4192801", "title": "华纳药厂：控股股东华纳医药协议转让8.44%公司股份过户完成", "content": "华纳药厂公告，公司控股股东华纳医药于2026年3月23日与一致行动人华纳至臻签署《股份转让协议》，华纳医药将其持有的公司1107.96万股无限售条件流通股（占公司总股本的8.44%）转让给华纳至臻。本次协议转让已在中国证券登记结算有限责任公司办理完成过户登记手续，并取得《证券过户登记确认书》，过户日期为2026年4月3日。华纳至臻承诺自本次协议转让股份过户登记至其名下之日起12个月内不会减持所受让的股份。", "ctime": 1775554405, "time_str": "17:33:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260407/c675802585.shtml"}, {"id": "4192795", "title": "全国社会保障基金理事会党组成员、副理事长王文灵接受中央纪委国家监委审查调查", "content": "全国社会保障基金理事会党组成员、副理事长王文灵涉嫌严重违纪违法，目前正接受中央纪委国家监委纪律审查和监察调查。(新华社)", "ctime": 1775554313, "time_str": "17:31:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260407/c675802562.shtml"}, {"id": "4192787", "title": "WTI原油失守112美元/桶 布伦特原油失守108美元/桶", "content": "WTI原油失守112美元/桶，日内跌0.42%。布伦特原油失守108美元/桶，日内跌1.65%。", "ctime": 1775554164, "time_str": "17:29:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260407/c675802156.shtml"}, {"id": "4192783", "title": "海伦哲：2025年净利润3.09亿元，同比增长38.19%", "content": "海伦哲发布业绩快报，2025年度营业总收入17.2亿元，同比增长8.07%。净利润3.09亿元，同比增长38.19%。经营业绩变动的主要原因系：（1）公司继续坚定不移地贯彻“技术领先型的差异化”发展战略，将产品可靠性与核心技术突破作为提升市场竞争力的核心驱动力，在多个关键领域取得实质性进展；（2）公司持续深化营销模式创新与市场攻坚，显著提升主导产品市场占有率；（3）公司成功落地智能制造项目，推动生产体系更加柔性化、数字化，同时公司引入外部咨询，供应链管理显著优化提升，生产效率大幅提高，满足市场需求，销售规模增加；（4）公司强化期间费用管理，严控费用支出，提升费用使用效能；公司加强应收款项管理，盘活短长期资产使用活性，提高资产使用效率，增加公司现金流；（5）公司对外出售全资子公司上海良基实业有限公司100%股权，确认投资收益2702.86万元。", "ctime": 1775554012, "time_str": "17:26:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260407/c675802079.shtml"}, {"id": "4192781", "title": "长源东谷：拟发行股份购买襄阳康豪机电工程有限公司100%股权", "content": "长源东谷公告，公司拟通过发行股份方式向湖北芯源动力科技集团有限公司购买其持有的襄阳康豪机电工程有限公司100%股权，并拟向不超过35名特定投资者募集配套资金。截至预案摘要签署日，本次交易相关的审计、评估工作尚未完成，标的公司经审计的财务数据和资产评估结果将在重组报告书中予以披露。", "ctime": 1775554004, "time_str": "17:26:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260407/c675802077.shtml"}, {"id": "4192775", "title": "摩根士丹利将Arm Holdings评级从增持下调至持平", "content": "摩根士丹利将Arm Holdings评级从增持下调至持平。", "ctime": 1775553923, "time_str": "17:25:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260407/c675802042.shtml"}, {"id": "4192773", "title": "NYMEX汽油主力合约跌超1%", "content": "NYMEX汽油主力合约跌超1%，现报3.27美元/加仑。", "ctime": 1775553914, "time_str": "17:25:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260407/c675802039.shtml"}, {"id": "4192767", "title": "国创高新修正2025年度业绩预告 扣非净利润预计为-200万元至-100万元", "content": "国创高新发布2025年度业绩预告修正公告，预计净利润为1600万元至2400万元。公司原预计净利润为1600万元至2400万元。扣非净利润预计为-200万元至-100万元，原计划为200万元至300万元。", "ctime": 1775553895, "time_str": "17:24:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260407/c675802027.shtml"}, {"id": "4192763", "title": "ST中装：注销回购专户库存股94.22万股", "content": "ST中装公告，公司2022年回购计划存放于回购专用账户中的94.22万股已回购未使用股份按规定予以注销。本次注销完成后，公司相应减少股本94.22万股，公司总股本由19.51亿股变更为19.5亿股。", "ctime": 1775553841, "time_str": "17:24:01", "stock_code": "", "stock_name": "", "stock_mar // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
