ka.com.cn/20260515/c676717270.shtml"}, {"id": "4368473", "title": "阿根廷将在乌斯怀亚开展汉坦病毒调查", "content": "阿根廷卫生部14日确认，一支调查团队将于下周前往该国南部火地岛省首府乌斯怀亚展开调查，以确定当地是否存在汉坦病毒。 荷兰一家公司运营的“洪迪厄斯”号邮轮4月1日驶离阿根廷乌斯怀亚，驶往大西洋岛国佛得角，途中暴发汉坦病毒疫情。 世界卫生组织官员曾表示，“洪迪厄斯”号首个感染病例可能不是在船上感染，而是发生在邮轮出发之前。但火地岛省卫生部门基于病毒潜伏期等因素，对乌斯怀亚为感染源头的说法表示怀疑。一名卫生官员14日在接受媒体采访时说，当前距离船只出发已经过去了40多天，“但乌斯怀亚的流行病学情况并没有太大变化，也没有发现任何病例”。 据阿根廷《布宜诺斯艾利斯时报》报道，目前无法确定船上乘客最初感染的时间或地点，阿根廷国家实验室与卫生研究所管理局卡洛斯·马尔夫兰研究所的专家将与火地岛省卫生部门共同调查，预计4周后可公布相关结果。（新华社）", "ctime": 1778820704, "time_str": "12:51:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260515/c676717151.shtml"}, {"id": "4368469", "title": "韩国综指跌幅扩大至5%", "content": "韩国综指跌幅扩大至5%，现报7581.52点。", "ctime": 1778820647, "time_str": "12:50:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260515/c676717137.shtml"}, {"id": "4368439", "title": "广东中山启动防汛Ⅲ级应急响应 多个地区停课", "content": "总台记者从广东省中山市应急管理局获悉，目前中山市中南部出现1小时70毫米强降水，预计未来降水持续。中山市气象台5月15日11时57分将三乡镇、坦洲镇、五桂山街道暴雨预警信号升级为红色，神湾镇暴雨红色预警、其他镇街暴雨橙色预警信号正在生效。根据《中山市防汛防旱防风防冻应急预案》规定，中山市三防指挥部决定同步启动防汛（防暴雨）Ⅲ级应急响应。中山市三乡镇、坦洲镇、五桂山街道中小学、幼儿园、托育机构停课，各类托管中心、教育培训中心参照执行。未启程上学的学生不必到学校上课；在校学生（含校车、寄宿）应当服从学校安排，学校应保障在校学生的安全；上学、放学途中的学生应当就近到安全场所暂避。（央视新闻）", "ctime": 1778820200, "time_str": "12:43:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260515/c676717029.shtml"}, {"id": "4368437", "title": "以军对黎南部外围村庄发布“紧急”撤离警告", "content": "总台记者获悉，当地时间15日，以色列国防军在对黎真主党发动打击前，对黎巴嫩南部提尔地区外围的几个村庄发出“紧急”撤离警告。（央视新闻）", "ctime": 1778820138, "time_str": "12:42:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260515/c676717019.shtml"}, {"id": "4368435", "title": "产能倾斜下利基型存储“接涨” SLC NAND年内预计再涨120%", "content": "在三星、铠侠等头部大厂的大规模“撤退”之下，利基型存储的上游供给预计在今年明显减少，进而引起产品价格飙涨。东芯股份证券部人士表示，公司SLC NAND价格在一季度涨幅约为50%-60%；北京君正证券部人士也表示，目前利基型存储产品的确在涨价。多位业内人士认为，利基型存储的这轮升浪远未结束。TrendForce集邦咨询分析师罗智文表示，SLC预计2Q26至4Q26期间，价格仍有约120%涨幅；MLC 今年下半年预估仍有约100%的上涨空间。（财联社）", "ctime": 1778820131, "time_str": "12:42:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260515/c676717018.shtml"}, {"id": "4368423", "title": "英国改革党领袖法拉奇再次回应“收受赠款争议”", "content": "5月14日，英国极右翼政党改革党领袖奈杰尔·法拉奇再次就其“收受赠款争议”作出回应。他表示，自己在成为新任议员前确实收到一位加密货币亿万富豪500万英镑（约合675万美元）的捐款，但这笔钱是对他“为英国脱欧奔走造势”的个人酬劳，无须申报。根据英国议会规定，新任议员必须申报当选前一年内收到的捐赠和礼品。目前，英国议会标准监察机构正在对法拉奇进行调查，以核实其2024年当选议员时是否应该申报这笔捐赠款项。但法拉奇辩称，这笔钱属于无条件赠与，因此不受相关申报条例约束。但反对党则质疑这笔款项的合规性，认为存在利益输送风险。（央视新闻）", "ctime": 1778819802, "time_str": "12:36:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260515/c676716969.shtml"}, {"id": "4368407", "title": "机构：预估2030年Micro LED CPO光收发模块产值达8.48亿美元", "content": "根据TrendForce集邦咨询最新Micro LED产业研究，生成式AI驱动高速光通信需求急速攀升，由于Micro LED具备仅1-2 pJ/bit的能耗，以及具有低于百亿分之一的误码率(Bit Error Rate, BER)，有望在垂直扩展(Scale-Up)的数据中心网络中，与AEC（主动式电缆）及VCSEL NPO（垂直共振腔面射型雷射近封装光学）并列为机柜内(Intra-Rack)三大短距高速传输方案。因此，TrendForce集邦咨询预估，Micro LED CPO光收发模块市场产值将于2030年达8.48亿美元。（科创板日报）", "ctime": 1778819427, "time_str": "12:30:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260515/c676716891.shtml"}, {"id": "4368401", "title": "雄安新区举办人才交流会，提供7700多个岗位信息", "content": "今天（5月15日），雄安新区举办“职引未来—2026年全国城市联合招聘青年人才交流会”。活动由人社部、河北省联合主办，200多家优质企业参会，覆盖北京、雄安新区以及保定等周边地区，涉及数字科技、信息技术、现代服务等多个行业领域，为高校毕业生提供有针对性的7700多个岗位信息。现场同步开展“网络直播带岗”“走播宣岗”线上活动，搭建线上线下对接桥梁。活动设置政策咨询、就业指导专区，并推出AI就业赋能区，提供智能简历优化、模拟面试、职业测评等服务，以数字化手段助力高校毕业生高质量就业，为雄安新区建设汇聚青年人才。（央视新闻）", "ctime": 1778819404, "time_str": "12:30:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260515/c676716889.shtml"}, {"id": "4368391", "title": "中证协就两项投资者保护类团体标准公开征求意见", "content": "中国证券业协会发布关于就两项投资者保护类团体标准公开征求意见的公告，为推动提升证券公司投资者保护工作质效，提供可供行业借鉴的投资者适当性管理和纠纷调解工作标准，协会投资者服务与保护专业委员会成员单位华福证券、华安证券分别起草编写了《证券公司投资者适当性管理规范》和《证券公司投资者纠纷调解规范》团体标准的征求意见稿，现向社会公开征求意见。（人民财讯）", "ctime": 1778818712, "time_str": "12:18:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260515/c676716773.shtml"}, {"id": "4368381", "title": "5月15日午间公告一览：“万顺转2”最后转股日为2026年5月15日", "content": "万顺新材公告，万顺转2最后转股日为2026年5月15日，当日收市前持有万顺转2的投资者仍可进行转股，收市后未转股的将按100.87元/张（含息税）强制赎回。截至2026年5月15日上午收市后，距离停止转股仅剩半个交易日。投资者需开通创业板交易权限，不符合要求的不能转股。赎回资金到账日为2026年5月25日。", "ctime": 1778818579, "time_str": "12:16:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260515/c676716696.shtml"}, {"id": "4368361", "title": "俄梁赞市遭乌无人机袭击3死12伤", "content": "俄罗斯梁赞州州长今天（5月15日）在社交媒体上表示，乌克兰无人机袭击了该州首府梁赞市，造成3人死亡、12人受伤，多处高层住宅楼受损，一家工业企业设施被击中。（CCTV国际时讯）", "ctime": 1778818104, "time_str": "12:08:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260515/c676716586.shtml"}, {"id": "4368341", "title": "美官员称以黎第三轮会谈“富有成效且积极”", "content": "美国国务院官员14日说，当天在美首都华盛顿举行的以色列和黎巴嫩第三轮会谈“富有成效且积极”，会谈15日将继续举行。 美国媒体援引该官员的话报道说，当天的会谈从当地时间9时开始，8小时后结束，但没有提供更多细节。 报道说，本轮会谈标志着以黎双方朝着更实质性谈判迈出了一步。除两国驻美大使，黎巴嫩特使、黎前驻美大使西蒙·卡拉姆以及以色列高级安全官员也参加了当天的会谈。 报道指出，此次会谈正值以黎停火即将结束之际，但以黎双方仍存在巨大分歧。一名黎巴嫩高级官员14日说，黎方希望首先实现全面停火，随后再就以军撤离问题进行谈判。至于黎巴嫩真主党武装问题，将在停火后通过黎国内政治途径加以解决。而一名以政府官员当天稍早时对新华社记者说，此轮谈判旨在解除黎真主党武装，并达成与黎巴嫩建立正式外交关系的协议。 在美方斡旋下，以黎分别于4月14日和23日在华盛顿举行了两轮大使级会谈。以黎于4月17日开始为期10天的临时停火，美国总统特朗普4月23日宣布停火延长三周。然而，以色列继续以黎真主党违反停火协议为由发动袭击，并在其占领的黎南部地区拆除和炸毁所谓真主党“军事基础设施”。(新华社)", "ctime": 1778817822, "time_str": "12:03:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260515/c676716524.shtml"}, {"id": "4368321", "title": "港股午评：恒生指数跌0.87%，恒生科技指数跌1.26%", "content": "港股午间收盘，恒生指数跌0.87%，恒生科技指数跌1.26%。恒指港股通ETF银华（159318）跌0.96%，港股通科技ETF鹏华（159751）跌1.16%。板块方面，地面运输、建筑材料板块涨幅靠前；客运航空公司、电气设备板块跌幅靠前。个股方面，兆威机电涨17.46%，国恩科技涨15.45%，埃斯顿涨14.23%，天域半导体涨11.04%，智云科技建设涨8.5%；剂泰科技-P跌11.17%，科济药业-B跌10.58%，天岳先进跌10.1%，创新实业跌8.2%，经纬天地（旧）跌7.41%。", "ctime": 1778817684, "time_str": "12:01:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260515/c676716487.shtml"}, {"id": "4368251", "title": "国家信息光电子创新中心成功研发超宽带光子芯片 可用于6G通信", "content": "光纤通信网络就像高速公路，要想更多的数据在上面跑，就需要一辆载货量够大的“超大卡车”——超宽带光子芯片。近日，国家信息光电子创新中心（简称“中心”）自主研发的超宽带光子芯片，以250吉赫兹的带宽，刷新了“大卡车”的载货量。中心未来技术部经理张红广介绍，基于该芯片技术，中心已开发出全球首款170吉赫兹强度调制器并应用于国产化光电子测量设备。未来，这款芯片将为6G“空天地一体化”通信提供底层支撑，并有望延伸应用于星载通信，助力国产化卫星通信设备开发。（中国光谷公众号）", "ctime": 1778817086, "time_str": "11:51:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260515/c676716330.shtml"}, {"id": "4368247", "title": "主动偏股基金年内新发1364亿元 4只规模超50亿", "content": "数据显示，今年以来新成立的主动偏股型基金合计规模达到1363.58亿元，规模前10只产品合计为450.35亿元，4只成立规模超过50亿元。其中广发研究智选成立规模最大，为72.21亿元；永赢锐见成长、华宝优势产业、银华智享的成立规模分别为58.67亿元、57.77亿元、50.99亿元。今日刚完成募集的华夏智胜全景首募也达到50亿上限，或成为第5只成立规模50亿的公募产品。此外，大摩沪港深科技、广发成长回报、兴业臻选回报、易方达平衡精选、景顺长城景气驱动新发规模也超过30亿元。（财联社）", "ctime": 1778817054, "time_str": "11:50:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260515/c676716306.shtml"}, {"id": "4368243", "title": "TD COWEN：将博通公司目标价从405美元上调至500美元", "content": "TD COWEN：将博通公司目标价从405美元上调至500美元。", "ctime": 1778816937, "time_str": "11:48:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260515/c676716277.shtml"}, {"id": "4368217", "title": "ETF午评：半导体设备ETF领涨7.71%，上证580ETF领跌6.88%", "content": "ETF午间收盘涨跌不一，半导体设备ETF（159516）领涨7.71%，半导体设备ETF（159327）涨7.66%，半导体设备ETF（560780）涨7.57%，上证580ETF（530100）领跌6.88% ）系列国家标准，清晰界定了人工智能终端的智能化水平，为建设安全、有序、高效的人工智能终端生态奠定了良好基础。中国信息通信研究院是系列标准的主要起草单位之一，在手机、平板、微型计算机、眼镜、耳机、音箱、电视、汽车座舱等产品领域具备完整的检测资质与技术能力。现启动第一轮人工智能终端智能化分级标准符合性检测工作，欢迎相关企业积极参与测试，共同推动标准落地实施，助力产品智能化水平提升。(蓝鲸新闻)", "ctime": 1778815840, "time_str": "11:30:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260515/c676715830.shtml"}, {"id": "4368205", "title": "股指期货早盘收盘 主力合约全线下跌", "content": "股指期货早盘收盘，主力合约全线下跌。沪深300股指期货(IF)主力合约跌0.61%，上证50股指期货(IH)主力合约跌0.59%，中证500股指期货(IC)主力合约跌0.65%，中证1000股指期货(IM)主力合约跌0.31%。", "ctime": 1778815818, "time_str": "11:30:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260515/c676715825.shtml"}, {"id": "4368191", "title": "国新办将于5月18日举行新闻发布会 介绍加力优化离境退税措施扩大入境消费有关情况", "content": "国务院新闻办公室将于2026年5月18日（星期一）下午3时举行新闻发布会，请商务部副部长盛秋平和税务总局、北京市、上海市、深圳市有关负责人介绍加力优化离境退税措施扩大入境消费有关情况，并答记者问。（国新网）", "ctime": 1778815418, "time_str": "11:23:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260515/c676715658.shtml"}, {"id": "4368175", "title": "北京：优化临床急需药械进口审批绿色通道 探索优化临床研发用药进口流程", "content": "北京市商务局印发《推进医药健康产业发展促进药械产品进口工作方案》的通知。方案提出，聚焦医药健康产业进口关键环节，通过政府跨部门协同与企业精准服务，将政策优势、监管优势、市场优势切实转化为产业发展动能，提高医药健康产业“北京服务”水平，提升进口便利性和通关效率，扩大药品和医疗器械产品进口，做大“出口中国”品牌。优化临床急需药械进口审批绿色通道，探索优化临床研发用药进口流程。", "ctime": 1778815060, "time_str": "11:17:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260515/c676715511.shtml"}, {"id": "4368173", "title": "南向资金净买入超60亿港元", "content": "据同花顺iFinD数据，截至目前，南向资金净买入超60亿港元，其中港股通（沪）买入超45.20亿港元，港股通（深）买入超16.29亿港元。", "ctime": 1778815053, "time_str": "11:17:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260515/c676715487.shtml"}, {"id": "4368171", "title": "电力板块探底回升，大唐发 "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260515/c676714904.shtml"}, {"id": "4368073", "title": "外交部发言人就伊朗局势答记者问", "content": "外交部发言人就伊朗局势答记者问。问：据报道，特朗普总统访华期间，中美两国元首就中东局势等重大国际和地区问题交换了意见。请问双方是否谈及伊朗局势？中方对当前伊朗局势有何看法？\n\n答：中方在伊朗局势上的立场十分明确。这场战事已对包括伊朗在内的地区各国人民造成严重损失，外溢影响还在持续扩大，严重冲击世界经济发展、产供链畅通、国际贸易秩序和全球能源供应稳定，损害国际社会共同利益。这场本不该发生的战事没有任何进行下去的必要，早一点找到解决出路，对美伊双方有利，也对地区各国乃至整个世界有利。\n\n近来，美伊实现停火，探索通过谈判解决问题，受到地区国家和国际社会欢迎。中方始终认为，对话谈判才是正道，武力解决没有出路。对话的大门既然打开，就不应再次关上。应稳住局势缓和势头，坚持政治解决大方向，通过对话协商，就伊核等问题达成兼顾各方关切的解决方案。应尽快重开航道，回应国际社会呼声，共同维护全球产供链稳定畅通。应尽快达成全面、持久停火，推动中东海湾局势早日恢复和平稳定，为构建一个可持续的地区安全架构奠定基础。\n\n自战事爆发以来，中方一直为止战奔走，为和平尽力。习近平主席郑重提出维护和促进中东和平稳定的四点主张，中国同巴基斯坦提出关于恢复海湾和中东地区和平稳定的五点倡议。中方将继续秉持习近平主席四点主张精神，同国际社会一道，为和谈提供更大助力，为最终实现中东地区持久和平发挥建设性作用。(外交部网站)", "ctime": 1778813458, "time_str": "10:50:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260515/c676714798.shtml"}, {"id": "4368069", "title": "科创50指数翻红，此前一度跌超3%", "content": "科创50指数翻红，此前一度跌超3%。", "ctime": 1778813352, "time_str": "10:49:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260515/c676714728.shtml"}, {"id": "4368067", "title": "佳力图拜访之江实验室三体计算星座项目团队 交流液冷散热与太空算力温控技术", "content": "佳力图官微消息，近日，佳力图拜访之江实验室三体计算星座项目团队。双方围绕太空计算基础设施的温控散热需求，以及佳力图地面液冷技术在航天应用场景下的转化前景进行了交流。会谈中，佳力图代表团介绍了公司在液冷散热领域的最新进展，公司近期与多家产业合作伙伴就航天级液冷模块在天基算力领域的应用前景进行了交流，各方认为，地面液冷技术与极端环境温控研发经验可为太空算力热控方向提供参考。双方将围绕太空算力温控技术路线、散热方案极端环境验证等课题持续推进交流对接。另外，近日，佳力图拜访中国电建集团西部区域总部，双方围绕四川天府新区零碳算力园区与青海零碳算力园区的前期策划及可行性研究进行了交流。", "ctime": 1778813330, "time_str": "10:48:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260515/c676714718.shtml"}, {"id": "4368057", "title": "外交部发言人就美国总统特朗普访华情况答记者问", "content": "外交部发言人就美国总统特朗普访华情况答记者问。问：5月14日，习近平主席为正在访华的美国总统特朗普举行系列国事活动，国内外高度关注。中方能否进一步介绍相关情况？答：应习近平主席邀请，美国总统特朗普正在对中国进行国事访问。这是中美两国元首继 // 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
