": "", "url": "https://news.10jqka.com.cn/20260525/c676953202.shtml"}, {"id": "4403957", "title": "燕文物流股份有限公司向港交所提交上市申请书", "content": "据港交所文件：燕文物流股份有限公司向港交所提交上市申请书。", "ctime": 1779705972, "time_str": "18:46:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260525/c676953197.shtml"}, {"id": "4403955", "title": "赛特新材：股东汪美兰已减持1.56%股份", "content": "赛特新材公告，股东汪美兰女士原持股1047.82万股，占6.24%。其减持计划自2026年5月25日至2026年8月24日，以大宗交易方式拟减持不超261.79万股，占1.56%。2026年5月25日已通过大宗交易减持261.79万股，减持价格27～27元/股，套现7068.33万元，减持比例1.56%，计划已实施完毕。减持后其持股786.03万股，占4.68%；汪美兰及一致行动人合计持股7498.68万股，占44.68%。", "ctime": 1779705963, "time_str": "18:46:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260525/c676953195.shtml"}, {"id": "4403951", "title": "黎真主党喊话黎政府勿向美以屈服", "content": "当地时间5月24日晚，黎巴嫩真主党领导人纳伊姆·卡西姆发表视频讲话，强调“任何解除武装的行为都会导致真主党遭到重创，从而使黎巴嫩逐步被占领，为灭亡铺平了道路”。卡西姆誓言真主党将持续作战，直至以军全部撤出黎巴嫩领土。他还直接喊话黎巴嫩政府，要求其明确拒绝同以色列直接谈判，警告其不要成为美国和以色列的工具，不要采取反对抵抗力量的立场，不要“背后捅刀”。\n黎巴嫩与以色列自4月以来在美国华盛顿举行3轮会谈，形同虚设的临时停火期限多次延长——自临时停火生效以来，以军以真主党违反停火协议为由，持续空袭黎巴嫩南部。 (CCTV国际时讯)", "ctime": 1779705949, "time_str": "18:45:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260525/c676953185.shtml"}, {"id": "4403947", "title": "欧陆通：已在越南生产基地顺利完成通用及高功率服务器电源产线的建设与调试", "content": "欧陆通5月25日在业绩说明会上表示，目前，公司已在越南生产基地顺利完成通用及高功率服务器电源产线的建设与调试，预计2026年底前实现小批量生产，于2027年可实现规模化量产，满足海外客户的订单交付需求。（人民财讯）", "ctime": 1779705819, "time_str": "18:43:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260525/c676953115.shtml"}, {"id": "4403943", "title": "俄称在一艘液化气运输船上发现北约国家制造的水雷", "content": "俄罗斯联邦侦查委员会通报称，一艘从比利时安特卫普港抵达列宁格勒州乌斯季卢加港的液化气运输船上，发现了由某北约国家制造的磁性水雷。相关信息显示，该船原计划在乌斯季卢加港加注燃料后前往土耳其，但抵达时间已延误数日。俄安全部门人员在该船只轮机舱附近船体外侧发现多枚磁性水雷，俄联邦安全局、国防部及国民卫队已联合将水雷拆除，每颗水雷内的爆炸物约7公斤。安全专家已经认定，水雷并非在俄罗斯境内被安装。俄方已按策划恐怖袭击和非法贩运爆炸装置立案调查。（央视新闻）", "ctime": 1779705710, "time_str": "18:41:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260525/c676953068.shtml"}, {"id": "4403941", "title": "创源股份：拟以债权转股权方式向全资子公司增资1亿元", "content": "创源股份公告，为优化全资子公司宁波创源海纳科技有限公司的资产负债结构，公司拟以债权转股权的方式对创源海纳增资人民币1亿元。本次增资完成后，创源海纳的注册资本将由人民币5000万元增加至人民币1.5亿元。增资完成后，公司仍持有创源海纳100%的股权，创源海纳仍为公司的全资子公司。", "ctime": 1779705701, "time_str": "18:41:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260525/c676953066.shtml"}, {"id": "4403939", "title": "创源股份：董事长陈刚因个人原因辞职", "content": "创源股份公告，公司第四届董事会非独立董事、董事长陈刚因个人原因辞去公司第四届董事会非独立董事、董事长职务，同时辞去战略与ESG委员会主任委员职务。陈刚辞职后不再担任公司任何职务。公司董事华天代为履行公司董事长职责，代行期限至公司选举产生新任相关职务人员之日止。", "ctime": 1779705694, "time_str": "18:41:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260525/c676953063.shtml"}, {"id": "4403917", "title": "卓锦股份：实控人兼董事长卓未龙因犯违规披露重要信息罪被判处有期徒刑一年、缓刑一年并处罚金20万元", "content": "卓锦股份公告，公司实际控制人兼董事长卓未龙与董事陈奉连收到杭州市中级人民法院《刑事判决书》。卓未龙因违规披露重要信息罪被判处有期徒刑一年，缓刑一年，并处罚金20万元；陈奉连被判处拘役四个月，缓刑四个月，并处罚金2万元。两人已辞去相关职务，判决不影响公司正常业务运作，但最终结果尚存不确定性。", "ctime": 1779705356, "time_str": "18:35:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260525/c676952932.shtml"}, {"id": "4403915", "title": "中国和塞尔维亚将发表两份联合声明", "content": "中华人民共和国和塞尔维亚共和国将发表关于持续推进构建新时代中塞命运共同体的联合声明、关于共同推动落实四大全球倡议的联合声明。（新华社）", "ctime": 1779705333, "time_str": "18:35:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260525/c676952908.shtml"}, {"id": "4403913", "title": "抖音：AI求真大模型助力辟谣，谣言被处置时平均浏览量下降62%", "content": "记者5月25日获悉，将AI大模型技术应用于谣言治理和辟谣运营工作一年之际，抖音公布数据：自AI求真大模型上线后，谣言被处置时的平均浏览量下降62%，一年来，抖音持续提升AI求真大模型的识别信号范围、准确度、时效性、主动性。今年以来，在热点事件中，平台对谣言的处置时效提升50%以上。\n在识别和研判层面，2026年，大模型上线了DeepResearch和交叉验证等能力，能够针对不同信息要点分别进行多轮联网检索和核实。在此过程中，一方面，大模型在联网检索过程中会优先采纳权威度排名较高的信源；另一方面，大模型也深度学习了抖音过去多年来积累的人工审核经验。数据显示，AI求真大模型判断谣言的准确率已提升至95%。(新京报网)", "ctime": 1779705326, "time_str": "18:35:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260525/c676952903.shtml"}, {"id": "4403911", "title": "黄仁勋拜访台积电创始人张忠谋", "content": "据报道，英伟达CEO黄仁勋5月23日下午抵达中国台北松山机场，较外界原先预期的27日明显提前。昨（24日）晚，黄仁勋登门拜访台积电创始人张忠谋，张忠谋妻子张淑芬亲自下楼迎接。餐叙畅聊近三个小时后，黄仁勋直奔饶河夜市，大口吃胡椒饼和鸡腿卷。黄仁勋表示：“张忠谋近况非常好，我们享用了很棒的晚餐，聊了各种各样的事。”关于此次行程，黄仁勋透露：“我会去拜访我们许多伙伴，希望可以见到（广达电脑董事长）林百里，周二晚上会去见（台积电董事长）魏哲家。”（科创板日报）", "ctime": 1779705302, "time_str": "18:35:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260525/c676952895.shtml"}, {"id": "4403907", "title": "ST龙大：2025年度内部控制被出具否定意见", "content": "ST龙大公告，2025年度内部控制被和信会计师事务所（特殊普通合伙）出具了否定意见的《内部控制审计报告》。根据《深圳证券交易所股票上市规则》第9.4.1条第（六）项的规定，若公司下一个年度的财务报告内部控制被出具无法表示意见或者否定意见的审计报告，公司股票将会被实施退市风险警示。敬请广大投资者注意投资风险。", "ctime": 1779705258, "time_str": "18:34:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260525/c676952884.shtml"}, {"id": "4403903", "title": "兴齐眼药：终止定增事项并撤回申请文件", "content": "兴齐眼药公告，公司于2026年5月25日召开第五届董事会第十七次会议，审议通过了《关于终止公司向特定对象发行A股股票事项并撤回申请文件的议案》。此前，公司于2025年5月27日召开第五届董事会第九次会议，并于2025年6月13日召开2025年第一次临时股东大会，审议通过了本次向特定对象发行股票相关议案。公司于2025年8月26日收到深圳证券交易所出具的《关于受理沈阳兴齐眼药股份有限公司向特定对象发行股票申请文件的通知》。2025年9月15日，公司收到深交所出具的《关于沈阳兴齐眼药股份有限公司申请向特定对象发行股票的审核问询函》。2025年9月28日，公司召开第五届董事会第十一次会议，审议通过了《关于公司2025年度向特定对象发行股票预案（修订稿）的议案》等相关议案。", "ctime": 1779705171, "time_str": "18:32:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260525/c676952844.shtml"}, {"id": "4403901", "title": "华图山鼎：股东车璐减持计划完成，累计减持1.19%股份", "content": "华图山鼎公告，自2026年2月24日至2026年5月22日，持股5%以上股东车璐通过集中竞价和大宗交易分别以57.45元/股减持125.3万股、49.29元/股减持108.3万股，累计减持233.6万股，占公司总股本1.19%，持股比例由13.59%降至12.41%，本次减持计划已实施完成，未超过拟减持不超589.69万股（占3%）的原计划。", "ctime": 1779705151, "time_str": "18:32:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260525/c676952839.shtml"}, {"id": "4403899", "title": "美国针对埃博拉疫情入境限制影响刚果（金）队世界杯备战", "content": "刚果（金）足球协会25日说，受美国针对埃博拉疫情实施的旅行和入境限制影响，刚果（金）国家男子足球队已取消原定在首都金沙萨启动的世界杯备战计划，改为直接在欧洲集训并停留至少21天后再赴美参赛。（新华社）", "ctime": 1779705129, "time_str": "18:32:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260525/c676952827.shtml"}, {"id": "4403897", "title": "《给阿嬷的情书》总票房突破11亿元！将延期上映至6月30日", "content": "据猫眼专业版，截至5月25日，电影《给阿嬷的情书》上映26天，总票房正式突破11亿元！《给阿嬷的情书》是今年第五部票房超十亿的国产片，也是今年春节档之后首部票房破十亿的电影，预测票房已经达到18.05亿元。", "ctime": 1779705117, "time_str": "18:31:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260525/c676952825.shtml"}, {"id": "4403891", "title": "日本羽田机场一架航班因故障紧急返航", "content": "日本东京羽田机场方面表示，当地时间25日下午，一架从羽田机场飞往福冈的航班发生故障紧急返航。目前该航班客机已在羽田机场安全着陆，机上含机组成员在内共有169人，暂无人员伤亡报告。据警方透露，故障原因是轮胎出现了爆胎情况。（央视新闻）", "ctime": 1779704986, "time_str": "18:29:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260525/c676952752.shtml"}, {"id": "4403885", "title": "两部门联合发布橙色山洪灾害气象预警", "content": "水利部和中国气象局5月25日18时联合发布橙色山洪灾害气象预警：预计，5月25日20时至5月26日20时，安徽南部、江西东北部、湖北东南部和西南部、湖南西北部、重庆东北部等地部分地区发生山洪灾害可能性较大（黄色预警），其中，安徽西南部、湖北东南部、湖南西北部局地发生山洪灾害可能性大（橙色预警），预警区域涉及的县（市、区）见下表。其他地区也可能因局地短历时强降水引发山洪灾害，请各地注意做好实时监测、防汛预警和转移避险等防范工作。（央视新闻）", "ctime": 1779704838, "time_str": "18:27:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260525/c676952703.shtml"}, {"id": "4403883" // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>

      <span class="text-xs text-gray-400">${item.mentions}次提及</span>

  `).join('');

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}
