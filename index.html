, {"id": "4712909", "title": "韩国KOSPI指数转涨", "content": "韩国KOSPI指数转涨，此前一度跌超5%。", "ctime": 1784004678, "time_str": "12:51:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260714/c678158913.shtml"}, {"id": "4712901", "title": "弘信电子等成立技术公司 含光电子器件制造业务", "content": "企查查APP显示，近日，甘肃趋境燧弘拓垦技术有限公司成立，法定代表人为王博，经营范围包含：云计算装备技术服务；人工智能基础软件开发；通信设备制造；电子元器件零售；光电子器件制造等。企查查股权穿透显示，该公司由北京趋境科技有限责任公司、弘信电子旗下江苏燧弘华创科技有限公司共同持股。（人民财讯）", "ctime": 1784004594, "time_str": "12:49:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260714/c678158902.shtml"}, {"id": "4712893", "title": "伊朗伊斯兰革命卫队对美军驻约旦空军基地进行报复打击", "content": "当地时间14日，伊朗伊斯兰革命卫队公共关系部发布第9号公告，确认其向美军驻约旦一处空军基地的关键设施发射了弹道导弹。声明指出，此次行动代号为“纳斯尔行动2”，旨在回应美军利用该基地对伊朗实施军事挑衅的行为。（央视新闻）", "ctime": 1784004400, "time_str": "12:46:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260714/c678158874.shtml"}, {"id": "4712889", "title": "机构：对宁德时代可能流失市场份额的担忧似乎被夸大了", "content": "星展集团研究部分析师认为，对宁德时代可能将市场份额流失给二线供应商的担忧似乎被夸大了。他们写道，中国电池行业的竞争正转向能够提供综合能源系统解决方案的公司，而不是那些仅仅提供独立电芯供应的公司。宁德时代的业务模式包含针对各种电池类型的解决方案，并能满足包括电力转换在内的领域的客户需求。他们补充说，随着下游客户将重点放在系统效率和能源管理上，而不仅仅是电池采购成本上，宁德时代的竞争优势应该会增强。星展集团维持买入评级，对A股和H股的目标价分别为人民币624元和925港元。（新浪财经）", "ctime": 1784004283, "time_str": "12:44:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260714/c678158806.shtml"}, {"id": "4712879", "title": "美联邦航空局结束“星舰”事故调查 准许13次试飞", "content": "美国联邦航空局13日宣布，已结束对美国太空探索技术公司重型运载火箭“星舰”第12次试飞异常事故的调查，接受该公司提出的整改措施，准许其开展第13次试飞。太空探索技术公司当天宣布，计划最早于16日实施“星舰”第13次试飞。“星舰”于今年5月22日实施第12次试飞。这是新一代“星舰”系统首次整体投入飞行测试，旨在对多项升级后的关键技术进行验证。试飞期间，火箭第一级“超级重型”助推器未能完成返航制动燃烧，随后以非受控状态坠入墨西哥湾。（新华社）", "ctime": 1784004189, "time_str": "12:43:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260714/c678158787.shtml"}, {"id": "4712849", "title": "上海发布高温橙色预警：预计中心城区最高温将超37℃", "content": "上海市气象台2026年7月14日11时54分更新中心城区高温黄色预警信号为高温橙色预警信号：预计今天中心城区大部的最高气温将超过37℃，高温黄色预警信号更新为高温橙色预警信号，请注意防范强高温对城市运行、人体健康、大功率电气设备的不利影响，注意用火用电安全。（澎湃新闻）", "ctime": 1784003902, "time_str": "12:38:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260714/c678158741.shtml"}, {"id": "4712811", "title": "现货黄金站上4020美元/盎司", "content": "现货黄金站上4020美元/盎司，日内涨0.52%。", "ctime": 1784003581, "time_str": "12:33:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260714/c678158639.shtml"}, {"id": "4712805", "title": "约旦称拦截并击落四枚来自伊朗的导弹", "content": "当地时间14日，约旦方面称拦截并击落了四枚从伊朗进入约旦领空的导弹。（央视新闻）", "ctime": 1784003502, "time_str": "12:31:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260714/c678158619.shtml"}, {"id": "4712797", "title": "巴林境内再次拉响防空警报", "content": "当地时间14日上午7时20分左右，巴林境内拉响防空警报。这是当天凌晨以来巴林境内拉响的第三轮防空警报。（央视新闻）", "ctime": 1784003215, "time_str": "12:26:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260714/c678158585.shtml"}, {"id": "4712795", "title": "阶跃发布全球首个智能体原生操作系统Step AOS", "content": "7月13日，阶跃正式发布全球首个智能体原生操作系统Step AOS (Step Agentic-native OS)，新一代个人智能体阶跃Amoo，以及面向汽车、手机等终端场景的端侧模型家族——Step Edge。作为阶跃的战略合作伙伴，千里科技同步宣布将Step AOS、阶跃Amoo、Step Edge引入汽车领域，融合双方在大模型、汽车智能化系统的技术积淀，率先打造面向智能体时代的大模型原生汽车终端体验，让智能体真正进入车端。（财联社）", "ctime": 1784003191, "time_str": "12:26:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260714/c678158583.shtml"}, {"id": "4712791", "title": "日本20年期国债拍卖需求强于12个月平均水平", "content": "周二日本20年期国债拍卖需求强于12个月平均水平，高收益率支撑了买盘。此次发行的投标倍数为4.52，高于上次的2.97，以及过去12个月的平均值3.54。另一个反映投资者兴趣强劲的指标是平均中标价格与最低中标价格之差，本次为0.00，而上月为0.24，与2010年创下的纪录低点持平。20年期国债拍卖后，日本国债期货涨幅扩大。日本财务大臣片山皋月上周五呼吁该国政府养老投资基金(GPIF)增加对国内资产的投资，日本国债收益率有所回落。不过，媒体随后的一篇报道缓和了这种预期，称政府没有计划全面改革GPIF的资产配置。（新浪财经）", "ctime": 1784003060, "time_str": "12:24:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260714/c678158573.shtml"}, {"id": "4712773", "title": "李乐成会见沙特通信和信息技术大臣阿卜杜拉·苏瓦哈", "content": "工业和信息化部部长李乐成在京会见沙特通信和信息技术大臣阿卜杜拉·苏瓦哈，双方就深化中沙信息通信领域合作进行深入交流。李乐成表示，在两国领导人战略引领下，中沙关系进入历史最好时期。中沙在信息通信和数字领域合作基础扎实，潜力巨大。工业和信息化部愿同沙方加强数字基础设施、人工智能等领域的政策经验交流，充分发挥各自产业优势，鼓励和支持两国企业开展务实合作，进一步丰富中沙全面战略伙伴关系内涵。苏瓦哈高度评价中国在信息通信和数字领域取得的成就，表示沙方愿同中方探索人才培养、能力建设等方面合作，共同为两国信息通信和数字领域互利共赢合作创造有利条件。沙方欢迎更多中国企业在沙投资，持续深化海缆、云计算等领域合作。（财联社）", "ctime": 1784002563, "time_str": "12:16:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260714/c678158379.shtml"}, {"id": "4712763", "title": "长江中下游全面恢复双向通航", "content": "记者从长江海事局了解到，今天（14日）8时起，随着台风“巴威”对长江中下游影响基本结束，长江干线湖北鄂州至安徽马鞍山段临时交通管制同步解除，长江中下游全面恢复双向通航。为保障复航秩序，海事部门采取分时段、分水域、分批次方式组织船舶恢复通行。13日8时起，1500余艘上行船舶先行解封，恢复通行和到港作业；14日8时起，3200余艘下行船舶解封，1800余艘本港作业及港内船舶恢复作业，85艘涉客船舶恢复常态化运营。复航按照先重点后普通、先快船后慢船、先空载后重载、先干线后支线的原则有序推进，避免船舶扎堆造成航道拥堵。（央视新闻）", "ctime": 1784002406, "time_str": "12:13:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260714/c678158354.shtml"}, {"id": "4712755", "title": "具身智能企业灵巧智能完成数亿元A轮融资", "content": "近日，具身智能企业DexRobot灵巧智能正式宣布完成数亿元A轮融资，融资资金将主要用于灵巧操作全栈技术研发、核心灵巧手产品迭代、多行业场景规模化落地与具身智能产业生态建设。2026年内公司已先后落地天使轮、A轮两轮股权融资，上海电气参与本轮融资中，双方将同步落地产业合资。（科创板日报）", "ctime": 1784002166, "time_str": "12:09:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260714/c678158321.shtml"}, {"id": "4712753", "title": "IDC：内存危机导致智能手机市场两极分化", "content": "7月14日，IDC发布《全球 // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
