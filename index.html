le": "伊朗称将敌军打回石器时代之前", "content": "伊朗陆军司令阿里·贾汉沙希今天（4月3日）在社交媒体上向美以发出警告，称将把敌军士兵“打回石器时代之前”。贾汉沙希称，伊朗陆军突击队多年来一直保持高度戒备，进行了高强度训练，“伊朗的土地是侵略者的坟场，如果不信，就来试试”。（CCTV国际时讯）", "ctime": 1775208402, "time_str": "17:26:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260403/c675759864.shtml"}, {"id": "4184477", "title": "乌称基辅州遭大规模袭击 已致人员伤亡", "content": "当地时间3日，乌克兰基辅州州长卡拉什尼克发布消息称，当天，基辅州遭俄罗斯发起的大规模导弹与无人机联合袭击。袭击已造成1人死亡，另有1人受伤。当地防空部队已在该区域展开防空作战任务。（央视新闻）", "ctime": 1775208323, "time_str": "17:25:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260403/c675759822.shtml"}, {"id": "4184475", "title": "工信部提示及时更新iOS特定版本 防范漏洞攻击利用的风险", "content": "近日，工业和信息化部网络安全威胁和漏洞信息共享平台（NVDB）监测发现，有攻击者利用针对苹果公司终端产品的漏洞利用工具实施网络攻击活动，可导致信息窃取、系统受控等严重危害。影响范围包括运行iOS13.0至17.2.1的iPhone、iPad等苹果公司终端产品。攻击者通过短信、邮件或网页投毒等方式，诱导用户使用Safari浏览器访问包含恶意代码的网页，综合利用终端设备中存在的安全漏洞，向受害终端产品植入远程控制木马，窃取用户敏感信息，获取最高权限并控制。建议使用苹果公司终端产品的用户做好风险排查，尽快通过升级版本和安装补丁等方式修复漏洞。（网络安全威胁和漏洞信息共享平台）", "ctime": 1775208297, "time_str": "17:24:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260403/c675759803.shtml"}, {"id": "4184473", "title": "广电网络：收到陕西证监局行政监管措施决定书", "content": "广电网络公告，公司及相关责任人收到陕西证监局《关于对陕西广电网络传媒(集团)股份有限公司采取责令改正并对韩普、张云采取出具警示函行政监管措施的决定》。经查，截至2025年7月2日公司连续12个月内发生的诉讼和仲裁事项涉案金额累计2.42亿元，超过公司最近一期经审计净资产的10%，应当及时披露，但公司迟至2025年12月26日才予以披露，不符合相关规定。公司董事长兼总经理韩普、董事会秘书张云对上述违规事项负有主要责任。", "ctime": 1775208003, "time_str": "17:20:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260403/c675759686.shtml"}, {"id": "4184471", "title": "渤海租赁：首次回购0.15%公司股份，成交总金额为4002.58万元", "content": "渤海租赁公告，2026年4月3日，公司通过回购专用证券账户以集中竞价交易方式首次回购公司股份数量为930.15万股，占公司总股本的0.15%，回购最高成交价为4.33元/股，最低成交价为4.28元/股，成交总金额为4002.58万元（不含交易费用）。", "ctime": 1775207879, "time_str": "17:17:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260403/c675759636.shtml"}, {"id": "4184469", "title": "伊朗警告将摧毁美以在中东所有资产", "content": "伊朗媒体3日报道，伊朗军方发表声明说，若美国敢对伊朗基础设施动手，伊朗将摧毁美国和以色列在中东地区的“所有资产和基础设施”。(新华社)", "ctime": 1775207878, "time_str": "17:17:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260403/c675759633.shtml"}, {"id": "4184467", "title": "苏奥传感：董事滕飞、财务总监孔有田已分别减持0.86555%和0.12527%", "content": "苏奥传感公告，公司董事兼总经理滕飞及副总经理兼财务总监孔有田于2026年1月14日至16日通过大宗交易完成减持。滕飞以9.5元/股减持693万股，减持0.86555%，减持后持股2150.5万股，占2.68596%；孔有田以9.5元/股减持100.3万股，减持0.12527%，减持后持股335.94万股，占0.41959%。两人均已完成此前披露的减持计划。", "ctime": 1775207793, "time_str": "17:16:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260403/c675759577.shtml"}, {"id": "4184463", "title": "中闽能源：公司股票连续3个交易日内日收盘价格跌幅偏离值累计达到20%以上", "content": "中闽能源公告，公司股票连续3个交易日（即2026年4月1日、4月2日和4月3日）内日收盘价格跌幅偏离值累计达到20%以上，根据《上海证券交易所交易规则》的有关规定，属于股票交易异常波动的情形。经公司自查，并向控股股东福建省投资开发集团有限责任公司核实，截至本公告披露日，公司不存在应披露而未披露的重大事项。公司股票价格短期波动较大，敬请广大投资者注意二级市场交易风险，审慎决策，理性投资。", "ctime": 1775207510, "time_str": "17:11:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260403/c675759435.shtml"}, {"id": "4184461", "title": "千方科技：因违规减持未及时披露被出具警示函", "content": "千方科技公告，公司于近日收到中国证券监督管理委员会浙江监管局《行政监管措施决定书》。2026年1月7日，公司持有杭州鸿泉物联网技术股份有限公司股份比例由10.39%减少至9.99%，触及5%整数倍，未在规定时间内停止交易，未及时披露《简式权益变动报告书》，迟至2026年3月11日才披露。因上述行为，公司被采取出具警示函的监督管理措施，并记入证券期货市场诚信档案。", "ctime": 1775207504, "time_str": "17:11:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260403/c675759433.shtml"}, {"id": "4184459", "title": "仙鹤股份：实际控制人王明龙收到浙江监管局行政监管措施决定书", "content": "仙鹤股份公告，公司实际控制人之一王明龙先生收到中国证券监督管理委员会浙江监管局出具的《关于对王明龙采取责令改正措施的决定》。王明龙作为公司实际控制人之一，未将借用他人证券账户持有仙鹤股份股票事项及时告知公司，导致公司控股股东及一致行动人合计持有公司股份比例达到80%时未及时披露。上述行为违反了《上市公司收购管理办法》相关规定，监管局决定对王明龙采取责令改正的监督管理措施，并记入证券期货市场诚信档案。", "ctime": 1775207499, "time_str": "17:11:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260403/c675759430.shtml"}, {"id": "4184457", "title": "红豆股份：收到江苏证监局行政监管措施决定书", "content": "红豆股份公告，公司及相关责任人收到江苏证监局行政监管措施决定书。经查，截至2024年12月31日，红豆股份对红豆集团的1.1亿元应收账款发生逾期，相关逾期应收账款于2025年4月30日前全部收回。但2025年，红豆股份对红豆集团的应收账款再次发生逾期。截至2025年9月30日，公司对红豆集团逾信用期应收账款余额为4509.43万元。红豆股份在2024年对红豆集团应收账款已经出现逾期的情况下，2025年未对关联应收账款进行严格控制并及时催收，导致再次发生应收账款逾期，构成控股股东在日常经营活动中占用上市公司资金的情形。", "ctime": 1775207496, "time_str": "17:11:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260403/c675759428.shtml"}, {"id": "4184455", "title": "科威特一电力和海水淡化厂遭袭", "content": "据科威特通讯社3日报道，科威特电力、水利和可再生能源部发言人法蒂玛·哈亚特说，伊朗当日发动的袭击导致科威特一座电力和海水淡化厂受损。 报道说，技术和应急小组已立即着手处理该事件，以确保设备继续运行。 科威特电力、水利和可再生能源部3月30日说，该国一处电力和海水淡化设施29日晚在一场袭击中严重损坏，一名印度籍工作人员死亡。(新华社)", "ctime": 1775207277, "time_str": "17:07:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260403/c675759306.shtml"}, {"id": "4184453", "title": "工业和信息化部推动普惠算力赋能中小企业", "content": "工业和信息化部日前印发关于开展普惠算力赋能中小企业发展专项行动的通知，提出到2028年底，基本建成覆盖广、成本低、服务优、生态活、人才强的普惠算力服务体系，在中小企业划分标准适用的15类行业中覆盖门类不少于10类。 通知围绕算力资源配置提升行动、算力服务普惠供给行动、重点行业企业赋能行动、产业生态协同共建行动、人才培养能力建设行动等五项重点任务作出一系列安排，包括鼓励设立中小企业专属算力池；探索“算力银行”“算力超市”等创新业务，支持中小企业存入闲置算力资源等。 通知还提出，开展“模数共振”专项行动，推动中小企业人工智能模型训练应用与数据资源开发利用协同互促；组织开展大中小企业融通对接活动；分层分类开展精准化人才培训等。 保障措施方面，通知明确有关方面要建立健全本地工作推进体系，明确任务分工、时间节点和责任主体，对普惠算力赋能中小企业发展专项行动给予必要的配套支持。(新华社)", "ctime": 1775207216, "time_str": "17:06:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260403/c675759282.shtml"}, {"id": "4184445", "title": "金钼股份：2025年净利润31.55亿元，同比增长5.77%", "content": "金钼股份公告，2025年营业收入138.34亿元，同比增长1.94%。净利润31.55亿元，同比增长5.77%。公司2025年度利润分配预案为：每10股拟派发现金股利4元（含税）。按2025年12月31日的股本32.27亿股计算，拟派发现金股利12.91亿元，其余未分配利润待以后年度分配。", "ctime": 1775207018, "time_str": "17:03:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260403/c675759176.shtml"}, {"id": "4184443", "title": "帝科股份：子公司涉案金额2亿的侵害发明专利权纠纷案已受理", "content": "帝科股份公告，子公司浙江索特材料科技有限公司因侵害发明专利权纠纷起诉浙江凯盈新材料有限公司及其上海分公司，上述诉讼已获上海市高级人民法院受理，涉案金额为2亿元。原告请求判令二被告立即停止制造、销售、许诺销售侵犯原告发明专利的光伏银浆系列产品，并销毁专用于制造该类浆料产品的设备和相关模具，同时要求连带赔偿经济损失及合理维权费用共计2亿元。", "ctime": 1775207014, "time_str": "17:03:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260403/c675759174.shtml"}, {"id": "4184441", "title": "金融监管总局：稳妥有序推进金融行业人工智能试点应用", "content": "4月1日，金融监管总局举办党委理论学习中心组集体（扩大）学习，李云泽强调，要聚焦金融主业，推动构建与未来产业全生命周期融资需求相适应的金融服务体系，以科技金融精准服务人工智能等未来产业发展，为中国式现代化注入新动能。要统筹发展与安全，深刻认识和把握人工智能发展态势，稳妥有序推进金融行业人工智能试点应用，建立健全人工智能安全开发应用治理架构，促进数字金融高质量发展。要强化科技赋能，高质量启动“金监工程”建设，筑牢金融监管科技支撑，持续提升监管数智化水平和穿透监管能力，切实提升强监管严监管质效。（金融监管总局）", "ctime": 1775206986, "time_str": "17:03:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260403/c675759166.shtml"}, {"id": "4184427", "title": "豫光金铅：拟向特定对象发行股票募集18.39亿元", "content": "豫光金铅公告，拟向特定对象发行股票募集资金不超过18.39亿元，扣除发行费用后拟用于先进稀贵金属材料智造项目（116,000.00万元）、数智化升级改造项目（5,000.00万元）、废水资源化项目（7,900.00万元）及补充流动资金（55,000.00万元）。发行对象为包括豫光集团在内的不超过35名投资者，豫光集团拟以不低于2亿元认购，认购股票总数不超过本次发行总股数的30%。本次发行尚需国有资产监督管理部门批准、公司股东会审议通过、上海证券交易所审核通过并经中国证监会同意注册后方可实施。", "ctime": 1775206732, "time_str": "16:58:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260403/c675758911.shtml"}, {"id": "4184425", "title": "菲林格尔：收到上海证监局行政监管措施决定书", "content": "菲林格尔公告，公司及相关人员收到上海证监局行政监管措施决定书。经查，公司存在工程项目收入确认不实、部分金融资产分类不准确、董事高管薪酬审议程序不合规等问题，导致年度报告存在虚假记载。上海证监局决定对公司采取责令改正措施，并对相关责任人员采取出具警示函措施。", "ctime": 1775206727, "time_str": "16:58:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260403/c675758908.shtml"}, {"id": "4184417", "title": "宇通客车：3月生产4201辆，同比下降12.41%", "content": "宇通客车公告，2026年3月生产量4201辆，同比下降12.41%，其中大型1976辆、中型1183辆、轻型1042辆；销售量4118辆，同比下降15.79%，大型1859辆、中型1157辆、轻型1102辆。本年累计生产量8429辆，同比下降5.65%，销售量7652辆，同比下降15.08%。", "ctime": 1775206528, "time_str": "16:55:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260403/c675758770.shtml"}, {"id": "4184415", "title": "韩国深圳总商会在首尔成立", "content": "韩国深圳总商会4月2日在首尔正式揭牌成立，来自中韩两国政商界及侨界代表200余人出席活动。中国驻韩国使馆公使衔参赞兼总领事钟洪糯在成立大会致辞表示祝贺。他强调，深圳是中国改革开放的重要窗口和创新发展的标杆城市，在数字经济、绿色产业、智能制造等领域与韩国合作潜力巨大。相信总商会将把握历史机遇、积极有为，在推动中韩经贸合作、促进两国友好交流方面发挥更大作用。成立大会上，主礼嘉宾共同为商会揭牌。创会会长郑朝辉表示，未来将围绕投资促进、产业对接、科技创新等重点领域，推动深圳与韩国在多层次、多领域的合作，同时积极服务国家对外开放大局，凝聚在韩企业资源，促进互利共赢。（新华社）", "ctime": 1775206472, "time_str": "16:54:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260403/c675758740.shtml"}, {"id": "4184411", "title": "十部门：开展人工智能科技活动应将科技伦理要求贯穿全过程", "content": "工信部等十部门印发《人工智能科技伦理审查与服务办法（试行）》的通知。开展人工智能科技活动应将科技伦理要求贯穿全过程，遵循增进人类福祉、尊重生命权利、坚持公平公正、合理控制风险、保持公开透明、保护隐私安全、确保可控可信的人工智能科技伦理原则，遵守我国宪法、法律法规和有关规定。", "ctime": 1775206224, "time_str": "16:50:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260403/c675758595.shtml"}, {"id": "4184409", "title": "以军称伊朗发射集束弹头导弹 击中以北部地区", "content": "总台记者获悉，当地时间3日上午，以色列北部地区遭伊朗导弹袭击。以国防军评估称，此次伊朗发射的弹道导弹携带集束弹头。据悉，海法和基里亚特阿塔共出现6处坠落点。在基里亚特阿塔，弹药击中一处住宅，一人受伤，另有两辆汽车起火；海法部分道路受损，暂无人员伤亡报告。（央视新闻）", "ctime": 1775206169, "time_str": "16:49:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260403/c675758537.shtml"}, {"id": "4184405", "title": "通用股份：持股5%以上股东红豆集团被采取行政监管措施", "content": "通用股份公告，持股5%以上股东红豆集团有限公司因未及时告知公司其持有的公司股票被质押、冻结情况并配合信息披露，收到中国证券监督管理委员会江苏证监局出具的警示函。红豆集团作为公司原控股股东，截至2024年8月19日持有公司6.57亿股，占总股本的41.35%。2024年8月19日新增1.1亿股股票被质押，占总股本的6.92%；2024年9月11日新增1516万股股票被质押，占总股本的0.96%。截至2025年2月14日，累计1.12亿股股票被冻结，占总股本的7.04%。", "ctime": 1775206106, "time_str": "16:48:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260403/c675758495.shtml"}, {"id": "4184401", "title": "市场监管总局就食品安全抽样检验核查处置管理办法公开征求意见", "content": "记者今天了解到，市场监管总局近日组织起草了《食品安全抽样检验核查处置管理办法（征求意见稿）》，现在开始公开征求意见。食品安全抽样检验是食品安全监管的重要技术支撑，核查处置则是抽检工作的“后半篇文章”，是实现抽检效能、防范化解食品安全风险的关键环节。征求意见稿清晰界定各级市场监管部门的职责边界，建立市场监管总局统筹协调、省级市场监管部门牵头负责、市县分级落实的分级分类核查处置工作机制，构建上下联动、权责明晰、运转高效的工作体系。(央视新闻)", "ctime": 1775206052, "time_str": "16:47:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260403/c675758472.shtml"}, {"id": "4184397", "title": "康泰生物：吸附破伤风疫苗获得药品注册证书", "content": "康泰生物公告，全资子公司北京民海生物科技有限公司研发的吸附破伤风疫苗于今日收到国家药品监督管理局签发的《药品注册证书》。", "ctime": 1775205899, "time_str": "16:44:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260403/c675758359.shtml"}, {"id": "4184391", "title": "蓝箭航天张晓东：朱雀三号2026上半年遥二箭回收试验 四季度力争首次复用飞行", "content": "今日，在2026太空算力产业大会上，蓝箭航天朱雀三号可重复使用火箭总设计师张晓东表示，2026年将继续尝试回收复用，其中2026年上半年遥二箭再次开展回收试验；根据回收试验情况争取于第四季度尝试首次回收复用飞行。（科创板日报）", "ctime": 1775205797, "time_str": "16:43:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260403/c675758324.shtml"}, {"id": "4184385", "title": "广誉远：多名股东合计增持0.0245%股份", "content": "广誉远公告，任岩、吕洪宇、王鹏浩、张华中、柳花兰、唐云于2026年3月27日至2026年4月3日通过上海证券交易所集中竞价各增持公司股份20000股，合计增持12万股，占公司总股本0.0245%，合计耗资205.31万元，已完成既定增持计划。", "ctime": 1775205724, "time_str": "16:42:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260403/c675758295.shtml"}, {"id": "4184383", "title": "梅德韦杰夫：欧盟正考虑组建一支完整军事力量", "content": "针对美国总统特朗普抱怨北约盟友不帮助打击伊朗，进而考虑让美国退出北约的言论，当地时间4月3日，俄罗斯联邦安全会议副主席梅德韦杰夫称，他认为，特朗普和美国绝不会退出北约——“既没有理由，国会也不会允许”。梅德韦杰夫表示，真正值得警惕的是，北约内部矛盾因伊朗战事加剧，欧洲政客正认真考虑在欧盟内部建立一支完整的军事力量。他表示，欧盟已不再是一个经济联盟，它可能很快转变为极端敌视俄罗斯的军事联盟，“在某些方面甚至比北约更糟糕”。梅德韦杰夫称，俄罗斯应放弃此前容忍邻国加入欧盟的态度。（央视新闻）", "ctime": 1775205695, "time_str": "16:41:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260403/c675758277.shtml"}, {"id": "4184377", "title": "国内首个太空算力专业委员会成立", "content": "4月3日，2026太空算力产业大会在北京市经开区通明湖会展中心召开。记者现场了解到，业界首个太空算力产业协同平台“太空算力专业委员会”（下称专委会）正式成立。专委会依托“算力产业发展方阵”成立。该方阵由中国信息通信研究院牵头成立，重点围绕产业研究、应用培育、协同创新、国际合作推进算力产业发展。中国信息通信研究院云大所副所长李洁在会上表示，太空算力是地面产业在太空的延伸和集成，是构建全球泛在算力网络的前沿布局，将有力支撑人工智能等应用高质量发展。专委会的成立将提升算力与航天产业链协同程度，打造全要素融合的产业生态圈。（界面新闻）", "ctime": 1775205632, "time_str": "16:40:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260403/c675758238.shtml"}, {"id": "4184375", "title": "川金诺：预计2026年第一季度净利润同比下降33.35%—47.24%", "content": "川金诺公告，预计2026年第一季度净利润为3800万元—4800万元，同比下降33.35%—47.24%。报告期内，预计非经常性损益对净利润影响金额约为300万元。2026年一季度利润同比出现下降，主要原因为：一是核心原材料之一硫元素的采购成本上涨，挤压了利润空间；二是受市场及其他因素影响，部分产品毛利率下滑。", "ctime": 1775205551, "time_str": "16:39:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260403/c675758052.shtml"}, {"id": "4184373", "title": "金发拉比：业绩承诺人收广东证监局行政监管措施决定书", "content": "金发拉比公告，广东韩妃医院投资有限公司业绩承诺人广州问美企业管理咨询合伙企业、黄招标收到广东证监局《行政监管措施决定书》。2021年至2024年韩妃投资净利润均未实现业绩承诺，广州问美和黄招标作为业绩补偿承诺人未能及时履行业绩补偿承诺，广东证监局决定对其采取责令改正的监管措施。", "ctime": 1775205546, "time_str": "16:39:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260403/c675758048.shtml"}, {"id": "4184367", "title": "伊朗称摧毁以色列先进隐形巡航导弹", "content": "据伊朗媒体3日报道，伊朗伊斯兰革命卫队宣布，革命卫队新型先进防御系统在赞詹省上空摧毁了以色列一枚先进隐形远程巡航导弹，该导弹携带重量为1000磅（约合454公斤）的弹头。伊朗媒体发布了该导弹残骸的照片。(新华社)", "ctime": 1775205459, "time_str": "16:37:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260403/c675758008.shtml"}, {"id": "4184363", "title": "乘联分会：2026年1-2月汽车行业利润435亿元 同比下降30%", "content": "乘联分会数据显示，2026年1-2月汽车行业收入14,824亿元，同比下降0.9%；成本13,147亿元，增长0.2%；利润435亿元，同比下降30%；汽车行业利润率2.9%，相对于下游工业企业利润率5.8%的平均水平，汽车行业仍偏低。", "ctime": 1775205374, "time_str": "16:36:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260403/c675757966.shtml"}, {"id": "4184361", "title": "清明假期全国水路发送旅客预计403.5万人次", "content": "记者从交通运输部海事局了解到，随着清明祭扫与春季短途出游需求集中释放，清明假期全国水路旅客发送量预计403.5万人次。清明假期，浙江水上客流量预计将达到75万人次。当地政府开通了小蚂蚁岛祭扫专渡，定向服务海岛祭扫群众。除祭扫出行外，春季短途水上旅游也成为清明假期热门选择。在青岛，“夜游青岛 海上灯光秀”航线迎来客流高峰，客船从奥帆中心码头出发，在浮山湾海域航行，主打“海上打卡灯光秀”及邂逅“荧光海”等特色夜景体验。（央视新闻）", "ctime": 1775205333, "time_str": "16:35:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260403/c675757945.shtml"}, {"id": "4184359", "title": "ST联创：累计回购公司股份1210.49万股", "content": "ST联创公告，截至本公告披露日，公司通过回购专用证券账户，以集中竞价交易方式累计回购公司股份1210.49万股，占目前公司总股本的1.13%，最高成交价为4.28元/股，最低成交价为3.93元/股，成交总金额为5019.49万元（不含交易费用）。公司本次回购股份使用的资金总额已达到回购方案中回购股份资金总额下限，且不超过回购股份方案中的资金总额上限，本次回购股份方案实施完毕。", "ctime": 1775205271, "time_str": "16:34:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260403/c675757880.shtml"}, {"id": "4184357", "title": "俄称3月俄对欧液化天然气出口创新高", "content": "据俄罗斯方面4月2日消息，今年3月，俄罗斯向欧盟国家供应的液化天然气达24.6亿立方米，创历史新高。1月至3月，欧盟国家从俄罗斯进口的液化天然气总量约为68亿立方米，高于上年同期的57亿立方米。（央视新闻）", "ctime": 1775205242, "time_str": "16:34:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260403/c675757864.shtml"}, {"id": "4184355", "title": "国家药监局：暂停一款印度原料药进口", "content": "记者今天（3日）从国家药监局获悉：近期，国家药监局组织对印度一家企业（名为Cadila Pharmaceuticals Limited）的苯磺酸氨氯地平原料药开展现场检查，这款原料药的登记号：Y20190009999；生产地址：294，GIDC ESTATE, ANKLESHWAR, GUJARAT STATE, INDIA。经查，上述产品部分工序实际生产地址与注册信息不一致，生产过程中还存在多项变更未按要求及时申报、实际生产工艺与批准工艺不一致等情况，不符合我国《药品生产质量管理规范（2010年修订）》及附录有关要求。根据《中华人民共和国药品管理法》第九十九条、《药品医疗器械境外检查管理规定》第三十条等有关规定，国家药监局决定，自即日起：一、暂停进口上述原料药，各口岸药品监督管理部门暂停发放该原料药产品的进口通关单。二、上述原料药在国家药监局药品审评中心“原辅包登记信息”中“与制剂共同审评审批结果”调整为“I”，即未通过与制剂共同审评审批。三、上述原料药不得在境内销售、不得用于药品制剂生产，对已使用上述原料药生产的制剂不得放行；已上市放行的制剂，药品上市许可持有人应当立即开展调查与评估，并根据评估结果采取必要的风险控制措施。（央视新闻）", "ctime": 1775205234, "time_str": "16:33:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260403/c675757857.shtml"}, {"id": "4184351", "title": "西测测试：李泽新协议转让公司5.00%股份给中投国联", "content": "西测测试公告，公司控股股东、实际控制人李泽新与中投国联（北京）投资基金有限公司签署了《股份转让协议》，李泽新拟通过协议转让方式将其持有的公司无限售流通股422万股转让给受让方，占公司目前总股本的5.00%，转让价格为82.44元/股。此次股份协议转让事项已在中国证券登记结算有限责任公司深圳分公司办理完成过户登记手续，并于2026年4月3日取得《证券过户登记确认书》。", "ctime": 1775205180, "time_str": "16:33:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260403/c675757824.shtml"}, {"id": "4184343", "title": "乘联会：3月全国乘用车新能源市场零售78.4万辆 同比下降21%", "content": "据乘联会，初步统计3月1-31日，全国乘用车新能源市场零售78.4万辆，同比去年3月下降21%，较上月增长69%，今年以来累计零售184.4万辆，同比下降24%；3月1-31日，全国乘用车厂商新能源批发112.6万辆，同比去年3月增长0%，较上月增长56%，今年以来累计批发271.6万辆，同比下降5%。", "ctime": 1775205141, "time_str": "16:32:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260403/c675757810.shtml"}, {"id": "4184337", "title": "正海生物：Longwood Biotechnologies Inc.已减持0.79%", "content": "正海生物公告，Longwood Biotechnologies Inc.于2026年3月24日至2026年4月2日通过集中竞价减持143.17万股，占总股本0.79%，持股比例由7.67%降至6.88%，触及1%整数倍。该减持为2026年3     el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
