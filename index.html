“政治施压”。 马里亚卡2024年在时任玻利维亚左翼总统路易斯·阿尔塞任内当选现职，任期6年。(新华社)", "ctime": 1790837704, "time_str": "14:55:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261001/c680429465.shtml"}, {"id": "5292663", "title": "数字人民币跨境联通合作范围稳步拓展", "content": "记者日前从数字人民币国际运营中心获悉，在首批26家金融机构签约后，截至9月末，又新增39家境内外金融机构提交申请，作为直接参与者接入“数币达”跨境结算综合服务平台（CBETS）。今年以来，数字人民币国际运营中心持续优化CBETS服务，稳步拓展合作范围，既支持与境外货币当局支付系统、法定数字货币系统双边对接，也支持境外金融机构直接接入。依托这一底层平台，数字人民币跨境服务既覆盖贸易，也支撑人员跨境往来。（新华社）", "ctime": 1790837232, "time_str": "14:47:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261001/c680429434.shtml"}, {"id": "5292613", "title": "港珠澳大桥供港鲜活食品通关时间延长至24小时", "content": "从今天起，经港珠澳大桥供港鲜活食品通关时间由每天16小时延长至全天24小时。调整后，水产、果蔬等鲜活食品可根据采收、运输和销售节奏安排通关，满足香港早市、午市、夜市等不同时段的补货需求。今年1至8月，大桥累计验放供港蔬菜、水果、鲜活水产等超过5.8万吨。随着通关时段延长，内地农产品供应与香港市场需求将实现更紧密地衔接。（央视新闻）", "ctime": 1790836968, "time_str": "14:42:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261001/c680429428.shtml"}, {"id": "5292585", "title": "国产300兆瓦级变速抽水蓄能机组主体安装完成", "content": "10月1日，位于广东肇庆的浪江抽水蓄能工程变速机组转子成功完成吊装，标志着国产300兆瓦级变速抽水蓄能机组主体安装完成。（新华社）", "ctime": 1790836551, "time_str": "14:35:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261001/c680429410.shtml"}, {"id": "5292551", "title": "以军称过去一个月空袭超500个军事目标", "content": "当地时间10月1日，以色列国防军发表声明称，在刚刚过去的一个月内，以色列空军在黎巴嫩南部“安全区”及加沙地带累计空袭超过500个军事目标。根据以军通报，在黎巴嫩方向，以军在各级指挥部及军事情报局的指引下，对黎巴嫩南部的真主党武装实施高频打击，共摧毁超过370个真主党目标。在加沙战线，以色列空军过去一个月内共袭击了140多个目标，包括3名巴勒斯坦伊斯兰抵抗运动（哈马斯）旅级指挥官以及策划袭击并对以军构成威胁的武装人员、哈马斯的武器库和其他基础设施等。（央视新闻）", "ctime": 1790836388, "time_str": "14:33:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261001/c680429405.shtml"}, {"id": "5292539", "title": "日韩股市集体收涨", "content": "日经225指数收涨3.30%，报68956.72点。韩国综指收涨1.95%，报6971.36点。", "ctime": 1790836333, "time_str": "14:32:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261001/c680429401.shtml"}, {"id": "5292273", "title": "实现海上发电就地制氢 中国团队首提交流电直接电解海水制氢新策略", "content": "记者10月1日从中国科学院理化技术研究所(理化所)获悉，该所低温科学与技术全国重点实验室最近首次提出以交流电替代传统直流电驱动直接电解海水制氢策略，实现海上发电就地制氢，从根源上破解了海水电解制氢的沉淀瓶颈难题。这项技术成果展现出显著的经济性与灵活性优势：无需海水预处理和离子交换膜，显著降低了制氢成本与系统复杂度，且可与海上可再生能源发电系统耦合，实现“海上发电—就地制氢”一体化，为氢能产业链上游提供低成本、可持续的绿氢来源。同时，交流电直接电解海水制氢的新策略，通过耦合乙二醇氧化反应，可在产氢的同时联产高附加值乙醇酸产物，实现“一电两得”，进一步提升经济效益。（中国新闻网）", "ctime": 1790834967, "time_str": "14:09:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261001/c680429340.shtml"}, {"id": "5291761", "title": "纽约期金站上4220美元/盎司", "content": "纽约期金站上4220美元/盎司，日内涨0.82%。", "ctime": 1790832999, "time_str": "13:36:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261001/c680429281.shtml"}, {"id": "5291753", "title": "华为乾崑智驾国庆出行数据公布，110.7万用户使用", "content": "10月1日，华为高级副总裁、引望公司CEO靳玉志公布华为乾崑智驾国庆出行数据。自9月30日0点至10月1日9点，仅1天多时间内，已有110.7万用户使用华为乾崑智驾自驾出行，辅助驾驶里程超过7116万公里，人均辅助驾驶里程达到9月日均水平的3倍。（人民财讯）", "ctime": 1790832904, "time_str": "13:35:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261001/c680429275.shtml"}, {"id": "5291529", "title": "巴基斯坦说空袭阿富汗两地 阿方表示已致9死", "content": "巴基斯坦新闻与广播部10月1日发表声明说，巴军方空袭阿富汗境内两个地点。阿富汗政府发言人当天说，巴方当天凌晨对阿东部库纳尔省的空袭已造成9人死亡、11人受伤。 巴基斯坦新闻与广播部的声明说，巴军方对阿富汗境内两处“恐怖分子营地”实施精准空袭。初步报告显示，行动造成22名恐怖分子死亡，并摧毁大量武器和弹药。 阿富汗政府发言人扎比乌拉·穆贾希德当天在社交媒体发文说，巴方对库纳尔省的空袭造成9人死亡、11人受伤，“死者中有妇女和儿童”。阿政府对此予以谴责，认为这种行为属于“侵略和犯罪”。 此外，阿富汗赫尔曼德省省长发言人穆罕默德·卡西姆·里亚兹向当地媒体证实，当天凌晨该地区也遭到来自巴基斯坦的空袭，人员伤亡情况尚未确认。(新华社)", "ctime": 1790831342, "time_str": "13:09:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261001/c680429195.shtml"}, {"id": "5291519", "title": "英国称伊朗涉空军基地袭击图谋 伊方再否认", "content": "英国首相伯纳姆9月30日称，有“强烈迹象”表明，伊朗涉嫌参与针对英国皇家空军费尔福德基地的可疑活动。伊朗方面驳斥伯纳姆说法，再度否认与该事件有关。（央视新闻）", "ctime": 1790831256, "time_str": "13:07:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261001/c680429166.shtml"}, {"id": "5291499", "title": "美股纳斯达克100指数期货涨超1%", "content": "美股纳斯达克100指数期货涨超1%，标普500指数期货涨0.55%，道琼斯指数期货涨0.34%。", "ctime": 1790831142, "time_str": "13:05:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261001/c680429161.shtml"}, {"id": "5291467", "title": "日经225指数涨幅扩大至3%", "content": "日经225指数涨幅扩大至3%，现报68763.36点。", "ctime": 1790831042, "time_str": "13:04:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261001/c680429158.shtml"}, {"id": "5291465", "title": "赛力斯和华为合作模式再调整", "content": "10月1日，记者获悉，在9月15日，赛力斯和华为联合发布声明称合作模式变更后，双方近日开启了新一轮谈判，合作模式预计将再调整。双方将于今日晚些时候再次发布联合声明。（第一财经）", "ctime": 1790831035, "time_str": "13:03:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261001/c680429157.shtml"}, {"id": "5291331", "title": "小鹏集团9月共交付新车41256台，环比增长5%", "content": "据小鹏汽车官方消息，小鹏集团9月共交付新车41256台，环比增长5%；第三季度累计交付新车118390台，环比增长15%。", "ctime": 1790830157, "time_str": "12:49:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261001/c680429100.shtml"}, {"id": "5291315", "title": "2026年国庆档电影总票房破1亿元", "content": "据网络平台数据，2026年国庆档电影总票房（含预售）破1亿元。(21财经)", "ctime": 1790829943, "time_str": "12:45:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261001/c680429089.shtml"}, {"id": "5291185", "title": "蔚来汽车：9月交付37,408辆汽车，同比增长7.7%", "content": "蔚来汽车：9月交付37,408辆汽车，同比增长7.7%。", "ctime": 1790827954, "time_str": "12:12:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261001/c680428853.shtml"}, {"id": "5291167", "title": "欧盟就沙特空域发布安全建议", "content": "欧盟航空安全局9月30日表示，今年9月也门胡塞武装加大了对沙特海上、能源和基础设施目标的袭击频率及范围。因靠近胡塞武装控制区，沙特南部和西南部空域面临的风险尤为突出。欧盟航空安全局建议航空运营商不要在沙特部分空域的任何高度飞行。(CCTV国际时讯)", "ctime": 1790827630, "time_str": "12:07:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261001/c680428799.shtml"}, {"id": "5291147", "title": "零跑汽车：9月全球交付量达10.5656万台，同比增长59%", "content": "零跑汽车10月1日公布9月全球交付量，9月，零跑全球交付量达10.5656万台，同比增长59%，实现连续三个月月销超10万台。2026年1-9月，海外累计出口超15万台；截至2026年9月底，零跑全球累计交付超180万台。（界面新闻）", "ctime": 1790827253, "time_str": "12:00:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261001/c680428768.shtml"}, {"id": "5291139", "title": "我国完成1∶500万中国及邻区大地构造图", "content": "中国地质科学院地质研究所领衔，我国学者完成1∶500万中国及邻区大地构造图，为认识地球和保障资源安全提供了基础支撑。记者从中国地质科学院地质研究所获悉，该图经世界地质图委员会提议，在中国地质调查局支持下完成，图幅西起中伊朗地块，东到西太平洋岛链，北接西伯利亚克拉通，南抵爪哇岛弧，编图范围包括日本和东南亚岛屿。全图按超大陆旋回建立中国大地构造年表，划分努纳、罗迪尼亚、冈瓦纳、潘吉亚和新地巨旋回；从全球动力体系入手划分中国显生宙大地构造单元，恢复多旋回造山运动与沉积盆地演化；强调切穿地壳或岩石圈的深断裂控制作用，划分古亚洲洋、特提斯和太平洋三大断裂体系。海域部分通过洋壳、洋底高原、裂陷盆地和坳陷盆地的分级表达，结合关键钻井数据，与陆上构造演化阶段相衔接，首次突破海陆界线，展示统一的区域构造动力学过程。（新华社）", "ctime": 1790827090, "time_str": "11:58:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261001/c680428762.shtml"}, {"id": "5291111", "title": "《求是》杂志评论员：以改革发力破解供强需弱矛盾", "content": "《求是》杂志评论员文章指出，供强需弱矛盾是当前我国经济运行面临的突出问题。破解供强需弱矛盾，既要宏观政策给力，稳定经济大盘；也要改革发力，增强经济发展的动力和活力。以改革发力破解供强需弱矛盾，必须进一步提高供给体系的质量和效率。供强需弱矛盾，既有总量不平衡问题，也有供需结构不适配问题。随着我国居民生活水平提高和需求层次提升，部分领域供给的产品和服务跟不上消费升级步伐，中低端供给过剩和优质供给短缺的问题并存。要加快建设现代化产业体系，增强供给体系对国内需求的适配性，适应不同群体消费需求扩大优质供给。传统产业是国民经济的重要组成部分，在民生保障、促进就业等方面发挥着不可替代作用，要健全支持引导传统产业开展技术改造的有效机制，促进制造业数智化转型。完善推动战略性产业发展政策和治理体系，建立未来产业投入增长机制。深化服务业监管改革，完善支持政策体系，促进服务业优质高效发展。完善市场出清机制，依靠市场化法治化手段推动企业纵向整合与横向兼并，引导产业健康有序发展。", "ctime": 1790826330, "time_str": "11:45:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261001/c680428732.shtml"}, {"id": "5291093", "title": "WTI原油跌超1%", "content": "WTI原油跌超1%，现报89.44美元/桶。", "ctime": 1790826074, "time_str": "11:41:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261001/c680428722.shtml"}, {"id": "5291081", "title": "财政部部长蓝佛安《求是》撰文：精准有效实施更加积极的财政政策", "content": "财政部部长蓝佛安《求是》撰文，财政是国家治理的基础和重要支柱。财政政策作为宏观调控的重要手段，具有扩大总需求和定向调结构的双重优势。“十四五”以来，我国财政政策始终保持积极取向，并根据形势变化适时调整完善，不断增强与经济运行的适配性，有力支撑了经济平稳健康发展。今年以来，面对国内外复杂环境带来的困难挑战，财政部门坚决落实党中央和国务院决策部署，牢牢把握高质量发展这个首要任务，扎实实施更加积极的财政政策，着力稳就业、稳企业、稳市场、稳预期，着力推改革、强管理、防风险、增效益，促进经济实现质的有效提升和量的合理增长。", "ctime": 1790825840, "time_str": "11:37:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261001/c680428715.shtml"}, {"id": "5291035", "title": "华为Mate90系列发布，售价5999元起", "content": "10月1日，华为Mate90系列手机正式发布，全系搭载旗舰τ芯片、HarmonyOS 7，屏幕采用第二代灵珑屏搭配全彩显示技术，搭载第三代红枫影像系统，可配合扩展华为睿影Z10模块相机。价格方面，华为Mate90售价5999元起，华为Mate90 Pro售价6999元起，华为Mate90 Pro Max售价9499元起，华为Mate90 Pro Max典藏版售价10999元起，华为Mate90 RS非凡大师售价12999元起。（界面新闻）", "ctime": 1790825027, "time_str": "11:23:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261001/c680428663.shtml"}, {"id": "5291003", "title": "《国铁集团铁路货物运输规程》今起实施", "content": "记者从国铁集团获悉，《国铁集团铁路货物运输规程》今天（10月1日）起正式实施。规程进一步明确了承运人、托运人等铁路货物运输各方权责关系，对既有铁路货物运输制度办法进行了修订，将“承运人确定重量”改为“谁装车谁确定重量，承运人有权复核”；将超过运到期限的违约金由“向收货人赔偿”改为“向托运人赔偿”；将托运人向承运人提出赔偿或退补费用的有效期由180天改为三年；将对易腐等时效性强的货物容许运到期限由须大于货物运到期限3天改为2天。（央视新闻）", "ctime": 1790824188, "time_str": "11:09:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261001/c680428623.shtml"}, {"id": "5290959", "title": "国家外汇管理局：上半年，我国经常账户顺差3780亿美元", "content": "国家外汇管理局日前发布的《2026年上半年中国国际收支报告》显示，上半年，我国经常账户收支总额为4.6万亿美元，同比增长16%；经常账户顺差3780亿美元，与国内生产总值（GDP）比值保持稳定。在货物贸易方面，上半年，国际收支口径的货物进出口总额同比增长18%，人工智能、绿色能源等相关贸易表现突出。货物进口同比增长近20%，较出口增速快2.3个百分点。在服务贸易方面，上半年，服务贸易出口同比增长21%，外籍人员来华旅行增多、新兴生产性服务贸易出口加快分别贡献服务出口增长的16%和42%。服务贸易进口同比增长7%，我国仍是全球主要服务贸易进口国。（新华社）", "ctime": 1790823607, "time_str": "11:00:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261001/c680428590.shtml"}, {"id": "5290911", "title": "美媒：谈判陷入僵局 鲁比奥要求伊朗代表团立即离美", "content": "美国务卿鲁比奥28日曾要求伊朗外长率领的代表团在双方谈判陷入僵局后立即离开美国。报道援引美官员的话称，在鲁比奥授意下，美常驻联合国代表团28日晚告知伊朗常驻联合国代表团，伊朗外长阿拉格齐率领的伊朗代表团必须立即离开纽约。报道称，28日早些时候，美方认为当天同伊朗的谈判可能会取得进展，但随后的谈判陷入僵局。报道认为，伊朗代表团本就计划在28日晚返程，鲁比奥此举是“一种非常不寻常的外交谴责，暴露了两国间根深蒂固的不信任”。（新华社）", "ctime": 1790822235, "time_str": "10:37:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261001/c680428519.shtml"}, {"id": "5290877", "title": "今天全国铁路预计发送旅客2480万人次", "content": "今天是国庆假期第一天，预计铁路将迎来假期客流最高峰。今天全国铁路预计发送旅客2480万人次，加开旅客列车2324列。今天，热门出行地区集中在京津冀、长三角、粤港澳大湾区和成渝地区。国铁北京局预计发送旅客175万人次，创出国庆假期客流量新高；国铁广州局今天预计发送旅客383.7万人次，增幅达9.4%。（央视新闻）", "ctime": 1790821807, "time_str": "10:30:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261001/c680428491.shtml"}, {"id": "5290849", "title": "美光科技CFO：2027财年第一财季收入将达615亿美元 各季度毛利率预计逐步回升", "content": "美光科技首席财务官Mark Murphy在财报电话会上表示，2027财年第一财季收入将达615亿美元，每股收益38.15美元，环比继续攀升，并明确指出这一季度将是2027财年全年毛利率的低点，此后各季度毛利率预计逐步回升。", "ctime": 1790820752, "time_str": "10:12:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261001/c680428431.shtml"}, {"id": "5290777", "title": "国庆长假来临 横琴口岸单日车流量创新高", "content": "国庆长假来临，琴澳跨境出游持续火热，横琴口岸通关人流、车流攀升。总台记者从拱北海关获悉，9月30日，海关在横琴口岸监管进出境车辆、进境车辆、出境车辆均创历史新高，数值分别为14975辆次、7573辆次、7402辆次，同比分别增长22.2%、20.2%、24.2%。当日，澳门单牌车通行数量突破9731辆次，占比达65%，同样创下历史新高。（央视新闻）", "ctime": 1790819762, "time_str": "09:56:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261001/c680428336.shtml"}, {"id": "5290751", "title": "韩国9月出口1200亿美元创新高 半导体出口额同比大增262.8%", "content": "韩国产业通商部1日表示，韩国9月出口额同比增长83.5%，为1209.4亿美元，创下单月最高纪录。前9个月累计出口额突破8000亿美元，已远超去年全年水平。9月半导体出口额为603亿美元，同比大增262.8%，首次突破600亿美元。(人民财讯)", "ctime": 1790819027, "time_str": "09:43:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261001/c680428276.shtml"}, {"id": "5290517", "title": "日经225指数涨幅扩大至2%", "content": "日经225指数涨幅扩大至2%，现报68076.03点。", "ctime": 1790817301, "time_str": "09:15:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261001/c680428136.shtml"}, {"id": "5290491", "title": "华为泡泡玛特联名款手表开售", "content": "10月1日，华为泡泡玛特联名款手表华为WATCH FIT 5开售，搭载华为自研芯片、64GB存储、蓝牙6.0，新增数字温度传感器，支持腕温趋势监测，售价1199元。（界面新闻）", "ctime": 1790817039, "time_str": "09:10:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261001/c680428109.shtml"}, {"id": "5290479", "title": "武汉：完善商品住房销售制度，推行“拿地即开工”、“交房即交证”", "content": "武汉市住房和城市更新局、武汉市自然资源和城乡建设局、武汉市地方金融管理局发布关于贯彻落实《关于完善商品住房销售制度的通知》的实施意见。推行“拿地即开工”。房地产开发企业签订土地出让合同并取得宗地不动产预告登记证明的，可先行办理建设工程规划许可、建筑工程施工许可、不动产测绘及楼盘表等手续。对按土地出让合同约定按时缴纳土地出让价款的项目，其对应部分可申请办理预售许可手续。房地产开发企业为保障项目开工建设，申请商品住房开发贷款，在主办银行会同市房产交易中心对项目资金进行封闭管理的前提下，可办理宗地不动产抵押权预告登记，具体办法另行制定。推行“交房即交证”。现房销售前，应办理不动产首次登记。推广商品住房买卖合同网签备案和不动产预告登记一体办理，优化税费缴纳、不动产登记、抵押贷款办理等流程，强化工作协同，推动商品住房交付时购房人同步取得不动产权证书。", "ctime": 1790816828, "time_str": "09:07:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261001/c680428041.shtml"}, {"id": "5290475", "title": "小米汽车：2026年9月，小米汽车交付量超过40000台", "content": "小米汽车：2026年9月，小米汽车交付量超过40000台。", "ctime": 1790816804, "time_str": "09:06:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261001/c680428035.shtml"}, {"id": "5290413", "title": "长三角铁路预计今日发送旅客440万人次，有望创历史新高", "content": "长三角铁路国庆节全力迎战假期客流最高峰。10月1日国庆节，澎湃新闻记者从中国铁路上海局集团有限公司获悉，长三角铁路迎来中秋国庆假期运输客流最高峰，计划开行旅客列车3161列，预计发送旅客440万人次，有望创国庆黄金周单日客发量新高。9月30日，长三角铁路发送旅客372.7万人次，同比增长3%。（澎湃新闻）", "ctime": 1790816036, "time_str": "08:53:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261001/c680427922.shtml"}, {"id": "5290369", "title": "现货黄金失守4140美元/盎司", "content": "现货黄金失守4140美元/盎司，日内跌0.41%。", "ctime": 1790814902, "time_str": "08:35:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261001/c680427840.shtml"}, {"id": "5290359", "title": "韩国综指跌幅扩大至1%", "content": "韩国综指跌幅扩大至1%，现报6766.67点。个股方面，三星电子、SK海力士跌超1%。", "ctime": 1790814689, "time_str": "08:31:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261001/c680427798.shtml"}, {"id": "5290323", "title": "全球最大的黄金ETF SPDR Gold Trust持仓较前日减少1.71吨", "content": "截至2026年09月30日，全球最大的黄金ETF SPDR Gold Trust持仓量为1055.70吨，较前一个交易日减少1.71吨。", "ctime": 1790814314, "time_str": "08:25:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261001/c680427682.shtml"}, {"id": "5290295", "title": "现货白银失守60美元/盎司", "content": "现货白银失守60美元/盎司，日内跌0.73%。", "ctime": 1790813956, "time_str const SECTORS  = [{"name": "金融", "hit_count": 54, "etfs": []}, {"name": "人工智能", "hit_count": 34, "etfs": []}, {"name": "半导体", "hit_count": 27, "etfs": []}, {"name": "消费", "hit_count": 21, "etfs": []}, {"name": "数据要素", "hit_count": 21, "etfs": []}, {"name": "地产", "hit_count": 15, "etfs": []}, {"name": "军工", "hit_count": 10, "etfs": []}, {"name": "医药", "hit_count": 9, "etfs": []}];
const META     = {"update_time": "2026-10-01 15:22:30", "sentiment_score": 58.81226053639847, "agents": []};

// 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
