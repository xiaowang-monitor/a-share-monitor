697", "title": "美芯晟战略投资金钢科技", "content": "美芯晟宣布，公司对国内人形机器人核心零部件公司北京金钢科技有限公司进行战略投资，并正式达成战略合作，全面推动人形机器人所需多品类传感器的研发布局。双方将以具身智能系统的智能感知技术为核心，卡位下一代AI硬件核心入口，助力机器人产业迈向高阶智能。（人民财讯）", "ctime": 1779687623, "time_str": "13:40:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260525/c676940742.shtml"}, {"id": "4402691", "title": "沪深京三市成交额超2.5万亿元，较上日此时放量3287亿元", "content": "据同花顺iFinD数据，沪深京三市成交额超2.5万亿元，较上日此时放量3287亿元，预计全天成交金额约3.3万亿元。截至目前，沪市成交额11196亿元，深市成交额13640亿元，北证50成交额168亿元。", "ctime": 1779687507, "time_str": "13:38:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260525/c676940712.shtml"}, {"id": "4402689", "title": "北证50指数跌幅扩大至1%", "content": "北证50指数跌幅扩大至1%，现报1313.77点。", "ctime": 1779687486, "time_str": "13:38:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260525/c676940708.shtml"}, {"id": "4402663", "title": "郑商所对二甲苯主力合约大跌6% 大商所乙二醇主力合约大跌5%", "content": "郑商所对二甲苯主力合约大跌6%，报8370元/吨。大商所乙二醇主力合约大跌5%，报4356元/吨。", "ctime": 1779687077, "time_str": "13:31:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260525/c676940603.shtml"}, {"id": "4402661", "title": "电力板块震荡走高，华能蒙电涨停", "content": "电力板块震荡走高，华能蒙电涨停，长源电力、京能电力此前封板，晋控电力、华电辽能、大唐发电、华银电力、建投能源等跟涨。", "ctime": 1779687074, "time_str": "13:31:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260525/c676940602.shtml"}, {"id": "4402657", "title": "上海试行出租车限制名单措施，拒载、议价等行为将被纳入限制名单", "content": "上海市交通委建立枢纽场站限制名单机制，针对出租车司机的拒载、议价、中途抛客等行为进行限制。浦东国际机场、虹桥国际机场、铁路上海虹桥站已试行该措施。首次违规将限制车辆及驾驶员进入枢纽场站3个月，第二次违规延长至6个月，第三次违规将永久禁止进入上述枢纽场站开展运营。已有35辆违规出租车被纳入“限制名单”，违规行为主要集中在拒载、绕道、多收费等类别。市民可通过12345市民服务热线进行投诉维权。（央视新闻）", "ctime": 1779687043, "time_str": "13:30:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260525/c676940591.shtml"}, {"id": "4402645", "title": "经港珠澳大桥珠海公路口岸出入境港澳单牌车总量突破1000万辆次", "content": "据珠海边检总站港珠澳大桥边检站数据统计，自2023年“澳车北上”“港车北上”政策相继实施以来，截至今年5月25日上午11时50分，经港珠澳大桥珠海公路口岸出入境港澳单牌车总量正式突破1000万辆次，人流、物流、资金流加速流通，自驾“北上”已成为港澳居民融入国家发展大局、共享粤港澳大湾区政策红利的主流出行方式。“澳车北上”“港车北上”政策不设投资纳税限制，申请流程简便，出行范围广，自落地实施以来广受港澳居民欢迎，备案申请情况持续火热。据边检部门统计，截至今年5月25日，完成“澳车北上”“港车北上”边检备案的司机数量超过22.8万人，备案车辆超过19.2万辆。（央视新闻）", "ctime": 1779686744, "time_str": "13:25:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260525/c676940515.shtml"}, {"id": "4402637", "title": "高能环境成立技术新公司，含金属材料业务", "content": "企查查APP显示，近日，广西高能时代技术有限公司成立，经营范围包含：金属材料销售；高性能有色金属及合金材料销售；有色金属合金销售；机械设备销售等。企查查股权穿透显示，该公司由高能环境全资持股。(人民财讯)", "ctime": 1779686568, "time_str": "13:22:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260525/c676940479.shtml"}, {"id": "4402627", "title": "多位算力租赁人士：没有收到任何“新要求” 大厂采购海外卡均有发票", "content": "针对“未来一切上市公司禁止披露没有发票的海外卡的部署”的算力租赁市场传闻，今日记者从多位算力租赁企业人士处了解到，大厂采购设备均有发票，否则意味着偷税漏税。一位A股算力租赁公司相关负责人称，“不信谣、不传谣。我们的（卡）都是合法合规，也没有收到任何部门指示。”一位从业者称，“之前的A系列也好，H系列、B系列也好，只要能到中国大陆正式上架运营的海外设备，全都是正规报关进来的。”（财联社）", "ctime": 1779686351, "time_str": "13:19:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260525/c676940428.shtml"}, {"id": "4402621", "title": "绿的谐波股价创历史新高", "content": "绿的谐波盘中股价创历史新高，现涨4.91%，报358.80元，总市值为632.67亿元。", "ctime": 1779686093, "time_str": "13:14:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260525/c676940334.shtml"}, {"id": "4402595", "title": "美国务卿：已在开放海峡和伊核问题上有“可靠方案”", "content": "当地时间5月25日，美国国务卿鲁比奥表示，目前有一份“相当可靠”的方案摆在面前，内容涉及伊朗“开放霍尔木兹海峡”的可能性，以及“就伊朗核问题展开一次切实、重大且有时间限制的谈判”。同日，鲁比奥还称，美国将尽一切努力通过外交途径取得成功，称美方“更希望达成一项好的协议”。同时，他表示，美国要么“会与伊朗达成一项好的协议”，要么“另寻他法”应对伊朗。(央视新闻)", "ctime": 1779685584, "time_str": "13:06:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260525/c676940203.shtml"}, {"id": "4402589", "title": "中芯国际股价创历史新高", "content": "中芯国际盘中股价创历史新高，现涨16.6%，报153.13元，总市值为7106.97亿元。", "ctime": 1779685520, "time_str": "13:05:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260525/c676940172.shtml"}, {"id": "4402587", "title": "多氟多触及跌停", "content": "多氟多触及跌停，成交额79.23亿元，封单4078手。", "ctime": 1779685489, "time_str": "13:04:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260525/c676940158.shtml"}, {"id": "4402569", "title": "科创50指数午后快速拉升 涨幅扩大至5%", "content": "科创50指数午后快速拉升，涨幅扩大至5%现报1880.53点。", "ctime": 1779685331, "time_str": "13:02:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260525/c676940043.shtml"}, {"id": "4402561", "title": "存储芯片板块午后持续走高 华虹公司等股涨停", "content": "存储芯片板块午后持续走高，华虹公司、华大九天、快克智能涨停，博敏电子、雅克科技、百傲化学此前封板，概伦电子、上海新阳、盛美上海涨超10%，拓荆科技、南大光电、广立微、盛合晶微、金太阳等跟涨。相关ETF方面，芯片ETF广发（159801）涨5.89%，成交额2.44亿元，芯片ETF易方达（516350）涨5.56%，成交额1.5亿元。", "ctime": 1779685293, "time_str": "13:01:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260525/c676940035.shtml"}, {"id": "4402539", "title": "铁凝会见黑山议会副议长努尔科维奇", "content": "5月25日，全国人大常委会副委员长铁凝在京会见黑山议会副议长努尔科维奇。双方就加强两国立法机构交往、推动中黑双边关系和中国－中东欧国家合作向前发展等共同关心的议题深入交换意见。（新华社）", "ctime": 1779685142, "time_str": "12:59:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260525/c676940004.shtml"}, {"id": "4402479", "title": "全国首单挂钩蓝色债券合约类信用衍生品交易落地山东", "content": "近日，在中国人民银行山东省分行指导和推动下，山东省成功落地挂钩蓝色债券的合约类信用衍生品交易。该业务是全国首单以蓝色债券为保护标的的信用风险缓释合约（CRMA），其中，浦发银行与申万宏源证券以山东能源集团新能源集团有限公司发行的蓝色债券“G26新能1”为标的达成信用风险保护交易，交易规模3000万元，上海清算所提供清算服务。该模式通过运用金融衍生工具有效缓释了投资者在蓝色债券配置中的信用风险，在增强市场投资信心的同时，有助于进一步降低我省海洋经济实体企业的融资成本，有力引导金融资源流向蓝色经济领域。（上海清算所）", "ctime": 1779683792, "time_str": "12:36:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260525/c676939662.shtml"}, {"id": "4402455", "title": "中韩半导体ETF华泰柏瑞自下午开市起至收市停牌", "content": "华泰柏瑞基金5月25日午间公告，旗下中韩半导体ETF华泰柏瑞（513310）二级市场交易价格明显高于基金份额参考净值，出现较大幅度溢价。为保护投资者利益，基金于5月25日下午开市起至收市停牌。", "ctime": 1779683415, "time_str": "12:30:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260525/c676939544.shtml"}, {"id": "4402451", "title": "应急管理部启动2026年油气储存企业部级专家指导服务", "content": "为深入推进化工和危险化学品安全生产治本攻坚三年行动，应急管理部近日启动2026年油气储存企业部级专家指导服务，从5月底至7月初，5个专家组分两批次对100家企业开展专家指导服务，并选取30家2025年指导服务企业开展“回头看”。\n本次指导服务首次将其他易燃可燃液体企业纳入指导服务范围，延续以往“行前培训、现场指导、全程服务”经验做法，严格按照专家指导服务管理办法对专家工作情况和服务质量进行量化考评。通过现场指导排查问题隐患，精准研判企业风险，示范带动各地应急管理部门、央企扎实开展中小油气储存企业安全风险深度评估，持续防控油气储存领域重大安全风险。同时，结合“打非治违”工作部署，对《危险化学品安全法》《化工和危险化学品生产经营企业重大生产安全事故隐患判定准则》有关条款进行宣贯，督促企业依法依规组织生产经营。\n目前，专家组已分赴山东、广东、重庆等地开展工作。（新华社）", "ctime": 1779683402, "time_str": "12:30:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260525/c676939541.shtml"}, {"id": "4402431", "title": "巴基斯坦与阿里巴巴达成多项合作", "content": "据阿里巴巴25日消息，巴基斯坦日前在杭州与阿里巴巴宣布达成多项合作，涉及AI基础设施、医疗AI科技、中小企业发展、人才培养、电子支付等领域。据悉，在数字经济领域，阿里巴巴国际站将依托旗下跨境生意AI工作台Accio Work，为1万家巴基斯坦中小企业提供AI和数字化培训，双方共同推动至少2000家当地企业入驻，并设立“巴基斯坦馆”，连接超5000万全球买家。Daraz旗下Koko Tech计划投资300万美元，拓展巴基斯坦数字支付业务。巴基斯坦总理夏巴兹·谢里夫表示，此次合作可推动数字普惠、赋能青年、促进农业现代化以及实现金融领域的数字化。(国是直通车)", "ctime": 1779682684, "time_str": "12:18:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260525/c676939317.shtml"}, {"id": "4402423", "title": "日本政府称“石脑油供给不存在问题”，民调显示超六成民众不接受", "content": "据日本方面24日消息，日本读卖新闻社于22日至24日实施的全国舆论调查结果显示，对于日本政府称“由原油提炼的石脑油供给不存在问题”，64%的受访者表示“无法接受”，即便是在支持内阁的群体中，也有57%的人表示“无法接受”政府的说明。石脑油是原油提炼过程中的衍生品，被广泛应用于塑料、绝缘泡沫、黏合剂、合成纤维、注射器等医疗用品和印刷油墨溶剂等材料。日本高度依赖从中东进口原油和石脑油，由于霍尔木兹海峡航运受阻，日本建筑、食品加工、日用品生产等多个行业都已感受到石脑油短缺带来的冲击。（央视新闻）", "ctime": 1779682367, "time_str": "12:12:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260525/c676939205.shtml"}, {"id": "4402421", "title": "ST喜临门董事长陈阿裕缺席股东会，儿子回应：董事长外出统筹推进债务化解工作，目前一切正常", "content": "5月22日下午，ST喜临门在其总部召开2025年年度股东会，董事长陈阿裕缺席。陈阿裕儿子、公司副董事长兼总裁陈一铖解释称，董事长外出统筹推进债务化解工作，因故缺席本次股东会。他透露，公司董事长现在一切正常，身体状态各方面都正常，目前正常履职，没有任何问题。对于陈阿裕离婚涉及股权分割传闻，陈一铖称，这个时候想通过这种方式逃债是不可能的。越是这个时候，大股东越要承担责任与担当。有现场股东提出更换董事长提议，陈阿裕女儿陈萍淇回应说，领导层更换是极其严肃的大事，核心考量是是否有利于企业持续健康发展。她表示，公司董事长过往确实有非常不恰当的行为，但目前正积极应对、处理问题、维护各方关系、对接重要资源，并未逃避责任，“这方面，董事长会比我们更有力量。”（财联社）", "ctime": 1779682362, "time_str": "12:12:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260525/c676939204.shtml"}, {"id": "4402419", "title": "航宇微：公司正在推进玉龙910的研制工作，暂未进入流片阶段", "content": "有投资者向航宇微提问，请问玉龙910芯片是不是进入流片阶段？\n5月25日，公司回答表示，公司正在推进玉龙910的研制工作，暂未进入流片阶段。有关公司具体产品及业务发展情况请以公司公告为准。(财闻)", "ctime": 1779682319, "time_str": "12:11:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260525/c676939199.shtml"}, {"id": "4402417", "title": "孟加拉国达卡发生卡车翻车事故 致15死10伤", "content": "当地时间25日凌晨，在孟加拉国达卡西北部的坦盖尔县，一辆卡车翻车造成至少15人死亡，约10人受伤。伤者已被送往附近医院紧急救治。（央视新闻）", "ctime": 1779682294, "time_str": "12:11:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260525/c676939188.shtml"}, {"id": "4402415", "title": "字节反击腾讯称“都是卖猪食的，谁也别看不起谁”？抖音副总裁李亮：相关内容系谣言", "content": "近日，有传言称腾讯、字节跳动高管“隔空互怼”，腾讯高管将部分“低质洗脑短视频”比作“猪食”，随后字节副总裁回应称，“大家都是卖猪食的，谁也别互相看不起。”5月24日，抖音集团副总裁李亮在微博发文辟谣：相关内容系谣言，“我没有说过这样的话，也没有其他‘字节副总裁’说过这样的话”，并表示其此前发文都可公开查证，要求微博、网易及时清理相关谣言。（澎湃新闻）", "ctime": 1779682154, "time_str": "12:09:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260525/c676939156.shtml"}, {"id": "4402407", "title": "华大九天：新推出首款Argus 3DIC物理验证平台，全面支持2.5D/3D异构集成封装设计", "content": "华大九天在互动易回复称，在3DIC方面，公司前瞻性洞察到当前AI、GPU、存储等芯片正依托3DIC技术突破后摩尔时代先进工艺及算力瓶颈，在3DIC设计EDA领域提前布局，构建了覆盖从异构集成三维芯片协同设计到验证的全流程解决方案，填补了国内高端3DIC设计工具的空白，是国内唯一的3DIC设计验证全流程EDA提供商。公司新推出首款业界领先的Argus 3DIC物理验证平台，全面支持2.5D/3D异构集成封装设计，可实现3DIC多元化协同设计到封装的全链路物理验证。", "ctime": 1779681995, "time_str": "12:06:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260525/c676939089.shtml"}, {"id": "4402405", "title": "广东省战略性新兴产业投资引导基金正式启动", "content": "5月25日上午，广东省战略性新兴产业投资引导基金启动仪式在广州举行。经省委、省政府批准，广东省战略性新兴产业投资引导基金组建成立，总规模 1000亿元 ，首期注册规模 500亿元，是广东首支永续经营的公司制省级政府投资基金。该基金将按照“政府引导、市场化运作、专业化管理”原则，通过构建“引导基金-母基金-子基金”架构，发挥杠杆效应和“长钱长投”优势，强化“投早、投小、投长期、投硬科技”正向激励，引导和撬动国家级基金、央企资金、金融资本、产业资本及投资机构等各方资金投入，带动打造万亿级产业投资基金集群，更好助推广东现代化产业体系建设。（南方+）", "ctime": 1779681915, "time_str": "12:05:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260525/c676939070.shtml"}, {"id": "4402403", "title": "交通运输部：上周国家铁路运输货物8077.3万吨，环比下降1.48%", "content": "交通运输部公布5月18日—5月24日全国物流保通保畅运行数据。国家铁路运输货物8077.3万吨，环比下降1.48%；全国高速公路货车通行5447.4万辆，环比下降1.46%；监测港口完成货物吞吐量2.6亿吨，环比增长0.37%，完成集装箱吞吐量634.5万标箱，环比下降3.41%；民航保障航班11.2万班（其中货运航班5027班，包括国际货运航班3314班，国内货运航班1713班），环比增长1.75%；邮政快递揽收量约42.96亿件，环比下降1.17%；投递量约43.17亿件，环比增长0.54%。", "ctime": 1779681908, "time_str": "12:05:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260525/c676939068.shtml"}, {"id": "4402399", "title": "5月25日午间公告一览：长高电新控股子公司完成工商注销登记", "content": "长高电新公告，控股子公司湖南长高新材料股份有限公司完成工商注销登记；\n三友联众公告，已完成工商变更登记及《公司章程》备案手续，并取得了东莞市市场监督管理局换发的《营业执照》；\n浩物股份公告，下属公司天津高德与公司关联方荣浩公司签订《房屋租赁协议》。", "ctime": 1779681841, "time_str": "12:04:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260525/c676939043.shtml"}, {"id": "4402385", "title": "2026智源大会论道具身智能产业跃迁", "content": "2026年智源大会将于6月12日至13日在北京·中关村国际创新中心举办。本届智源大会上，多位图灵奖得主将带来对于下一代智能的前沿思考，同时，40余位AI企业CEO、创始人、首席科学家们将齐聚北京，中国大模型与 Agent 领域最具代表性的创新力量将首次集中同台。大会将设置1场主论坛，24场平行论坛与特色活动，深度覆盖 Agent、世界模型、具身智能、安全等 AI 全栈前沿方向。（21世纪经济报道）", "ctime": 1779681258, "time_str": "11:54:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260525/c676938756.shtml"}, {"id": "4402357", "title": "以军说一名士兵在黎巴嫩南部死亡", "content": "以色列国防军25日发表声明说，一名19岁以军士兵在黎巴嫩南部的战斗中死亡，另有一名士兵重伤。（新华社）", "ctime": 1779680735, "time_str": "11:45:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260525/c676938593.shtml"}, {"id": "4402347", "title": "水利部：全国10条中小河流发生超警以上洪水", "content": "记者从水利部了解到，昨天到今天（25日），受降雨影响，浙江钱塘江上游常山港及支流芳村溪，安徽新安江支流练江、扬之水，江西乐安河上游，湖北内荆河支流峰白河，重庆嘉陵江支流小安溪，四川渠江支流新民河、关门河，陕西汉江支流椒溪河等10条中小河流发生超警以上洪水，最大超警幅度3.11米，其中安徽练江、四川新民河等2条中小河流发生超保洪水，当前大部已出峰回落。（央视新闻）", "ctime": 1779680506, "time_str": "11:41:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260525/c676938530.shtml"}, {"id": "4402345", "title": "到2030年底全国城市生活垃圾资源化利用率力争达到76%以上", "content": "记者25日从住房城乡建设部了解到，到2030年底，全国城市生活垃圾资源化利用率将力争达到76%以上。 5月25日至31日是第四届全国城市生活垃圾分类宣传周。住房城乡建设部25日在北京组织召开全国城市生活垃圾分类工作现场会。住房城乡建设部相关负责人表示，今年，住房城乡建设部将坚持垃圾分类和减量化、资源化、无害化目标不动摇，不断优化完善政策体系，因地制宜强化可回收物管理，提升垃圾资源化回收利用率，推动城市高质量发展，建设美丽中国。 这位负责人表示，近十年，住房城乡建设部坚持典型引路、示范引领，统筹推动垃圾分类工作持续走深走实。目前，297个地级及以上城市居民小区垃圾分类基本实现全覆盖。地级及以上城市出台垃圾分类有关地方性法规或规章199部，制定出台技术标准规范100余部，垃圾分类成为各地基础性工作，依法推进、依规实施。 住房城乡建设部最新数据显示，截至2025年底，全国焚烧设施达1137座，日处理能力提升至118万吨，北京、浙江、山东等15个省市实现原生生活垃圾“零填埋”，主要污染物排放控制居世界领先水平。(新华社)", "ctime": 1779680427, "time_str": "11:40:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260525/c676938504.shtml"}, {"id": "4402301", "title": "期货午评：煤矿紧急停产，焦煤焦炭涨停", "content": "期货午评：截止午盘，大宗商品以上涨为主。涨幅方面，焦炭、焦煤封涨停板，线材、沪银、豆一、硅铁涨超2%，双胶纸、锰硅、纯碱涨近2%。跌幅方面，燃料油、原油、低硫燃料油跌超7%， LPG、对二甲苯、瓶片跌超5%，PTA、短纤、纯苯、乙二醇、甲醇跌超4%。", "ctime": 1779679940, "time_str": "11:32:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260525/c676938196.shtml"}, {"id": "4402295", "title": "A股午评：科创50指数震荡走强涨超3%，CPO、半导体板块表现强势", "content": "A股三大指数早盘集体上涨，截至午盘，上证指数涨0.57%，深证成指涨0.87%，创业板指涨1.14%，北证50跌0.27%，科创50指数涨3.56%。全市场成交额20913亿元，较上日放量3001亿元，全市场近2000只个股上涨。板块题材上，培育钻石、机场航运、白酒、煤炭开采加工、半导体、PCB、CPO板块涨幅居前；油气开采及服务、电池、游戏板块跌幅居前。盘面上，培育钻石板块早盘持续上扬，黄河旋风、博云新材、恒林股份涨停，惠丰钻石、四方达、力量钻石跟涨。白酒板块低开高走迎来修复，金徽酒、皇台酒业涨停，迎驾贡酒、金种子酒、今世缘涨幅居前。半导体板块延续涨势，东芯股份20cm涨停，华虹公司、盛美上海、东微半岛、中芯国际、纳芯微等多股涨超10%。跌幅方面，受美伊谈判向好，中东局势缓和影响，油气开采及服务板块低开后持续下挫，潜能恒信跌超10%，科力股份、通源石油跌超9%，中油工程、中曼石油、海油发展纷纷下挫。电池股亦表现不佳，天际股份跌停，里奇智能、尚水智能、天赐材料跌幅居前。", "ctime": 1779679871, "time_str": "11:31:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260525/c676938180.shtml"}, {"id": "4402291", "title": "ETF午评：中韩半导体ETF领涨5.89%，标普油气ETF领跌4.12%", "content": "ETF午间收盘涨跌不一，中韩半导体ETF（513310）领涨5.89%，集成电路ETF（562820）涨5.29%，半导体ETF（512480）涨5.03%，标普油气ETF（513350）领跌4.12%，能源化工ETF（159981）跌3.58%，标普油气ETF（159518）跌3.13%。", "ctime": 1779679864, "time_str": "11:31:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260525/c676938179.shtml"}, {"id": "4402285", "title": "ETF两市成交额2878.19亿元", "content": "截至目前，ETF两市成交额报2878.19亿元，分类型来看，股票型ETF成交额1143亿元，债券型ETF成 ka.com.cn/20260525/c676937971.shtml"}, {"id": "4402217", "title": "5月第3周生猪和猪肉价格略有下跌", "content": "据农业农村部对500个县集贸市场和采集点监测，上周（5月第3周，5月18日—24日，下同），全国活猪价格为10.12元/公斤，环比跌0.4%；猪肉集贸市场价格为19.98元/公斤，环比跌0.4%。据农业农村部对200个批发市场监测调度，上周全国猪肉批发市场均价为14.76元/公斤，环比跌0.5%，同比低28.5%。专家分析认为，上周全国多数地区出现降雨天气，但气温总体较前期升高，猪肉消费稳中略降，生猪和猪肉价格略有下跌。展望后市，预计本周生猪和猪肉价格仍以小幅震荡为主。(农业农村部)", "ctime": 1779678941, "time_str": "11:15:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260525/c676937793.shtml"}, {"id": "4402213", "title": "天融信与郑州医药健康职业学院达成战略合作", "content": "近日，天融信与郑州医药健康职业学院达成战略合作，正式签署校企合作协议并举行“教育部供需对接就业育人项目-就业实习基地项目”授牌仪式。双方将通过多层次合作，深入推进产教融合、协同育人，为数字产业高质量发展提供人才支撑。(人民财讯)", "ctime": 1779678864, "time_str": "11:14:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260525/c676937766.shtml"}, {"id": "4402209", "title": "《给阿嬷的情书》延长放映至6月30日", "content": "电影《给阿嬷的情书》官宣密钥延期，延长放映至6月30日，据猫眼专业版数据，电影2026年4月30日上映，截至当前累计票房10.83亿元。（人民财讯）", "ctime": 1779678820, "time_str": "11:13:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260525/c676937758.shtml"}];

  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
