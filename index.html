<style>
:root {

}
.card:hover { background: var(--bg-card-hover); border-color: #334155; }
.badge {
  display: inline-flex; align-items: center; padding: 2px 8px;
  border-radius: 6px; font-size: 12px; font-weight: 500;
}
.badge-s { background: rgba(239,68,68,0.2); color: #ef4444; }
.badge-a { background: rgba(245,158,11,0.2); color: #f59e0b; }
.badge-b { background: rgba(59,130,246,0.2); color: #3b82f6; }
.badge-c { background: rgba(100,116,139,0.2); color: #94a3b8; }
.score-bar {
  height: 6px; border-radius: 3px; background: #1e293b; overflow: hidden;
}
.score-bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s; }
.up { color: var(--red); }
.down { color: var(--green); }
.pulse { animation: pulse 2s infinite; }
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}
.glow { box-shadow: 0 0 20px rgba(59,130,246,0.15); }

</style>

</div>

 "同心医疗全球首个全磁悬浮人工心脏儿童临床试验获美国FDA批准", "content": "同心医疗美国全资子公司BrioHealth Solutions宣布，公司已获得美国食品药品监督管理局（FDA）附条件批准，启动针对晚期心力衰竭儿科患者的BrioVAD 系统临床评估。Brio4Kids试验作为INNOVATE 试验向儿科领域的延伸，将依托后者的研究器械豁免（IDE）进行。这不仅实现了全磁悬浮人工心脏面向儿科的首个前瞻性临床试验，更首次将同一款左心室辅助装置（LVAD）同时在成人与儿科人群中开展平行临床评估，填补了儿童心衰治疗的空白。（界面新闻）", "ctime": 1777349818, "time_str": "12:16:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260428/c676335441.shtml"}, {"id": "4287035", "title": "港股午评：恒生指数跌0.66%，恒生科技指数跌1.23%", "content": "港股午间收盘，恒生指数跌0.66%，恒生科技指数跌1.23%。恒指港股通ETF银华（159318）跌0.6%，港股通科技ETF鹏华（159751）跌0.85%。板块方面，居家用品板块涨幅靠前；通信设备、客运航空公司板块跌幅靠前。个股方面，曦智科技-P涨359.61%，药明康德涨14.92%，群核科技涨8.47%，凯莱英涨8.38%，建滔积层板涨8.38%；361度跌19.51%，海西新药跌19.37%，威胜控股跌11.32%，南山铝业国际跌10.76%，剑桥科技跌10.07%。", "ctime": 1777348966, "time_str": "12:02:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260428/c676335208.shtml"}, {"id": "4287009", "title": "4月28日午间公告一览：锦鸡股份提前赎回锦鸡转债的第十次提示性公告", "content": "锦鸡股份公告，根据安排，截至2026年05月08日（赎回登记日）收市后仍未转股的“锦鸡转债”，将按照101.18元/张的价格被强制赎回，特提醒“锦鸡转债”持券人注意在限期内转股。若“锦鸡转债”持券人不符合创业板股票适当性管理要求的，不能将所持“锦鸡转债”转换为股票，特提醒投资者关注不能转股的风险。", "ctime": 1777348725, "time_str": "11:58:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260428/c676335065.shtml"}, {"id": "4287003", "title": "国家电网浙江1000千伏特高压交流环网工程开工", "content": "国家电网浙江1000千伏特高压交流环网工程28日开工。工程起于嘉兴，止于丽水，串起杭州、绍兴、宁波、台州、温州等7个地市，线路总长508公里，总投资293亿元，全面建成后，每年将消纳清洁能源电量超570亿千瓦时，为长三角能源转型提供绿色动能。工程将于2029年建成，届时将与浙江现有电网架构闭合，形成省内环线加省外四条直流线路的特高压网架，增强浙江省内电力保供能力。（央视新闻）", "ctime": 1777348193, "time_str": "11:49:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260428/c676334916.shtml"}, {"id": "4286997", "title": "日经225指数跌幅扩大至1%", "content": "日经225指数跌幅扩大至1%，现报59972.4点。", "ctime": 1777348039, "time_str" 07%，深证成指跌0.41%，创业板指跌0.54%，北证50跌1.19%。全市场成交额16701亿元，较上日成交额缩量408亿元，全市场超3700只个股下跌。板块题材上，中船系、证券、煤炭开采加工、环氧丙烷、游戏、油气开采及服务、工程机械、磷化工板块涨幅居前；旅游及酒店、教育、贵金属、华为昇腾、乳业、军工电子板块跌幅居前。盘面上，药明康德一季报超出市场预期推动CRO概念股一度冲高，其股价封死涨停。利通电子一季报惊艳，算力租赁板块盘中反复活跃，利通电子一字涨停，宏景科技、协创数据纷纷上扬。此外，煤炭、化工、证券等板块盘中有所表现，但市场呈现防御姿态。另一方面，旅游及酒店板块表现不佳，陕西旅游盘中跌停。昨日上涨的半导体板块亦有所调整，盛美上海大跌10%，新相微、灿芯股份跟随下跌。", "ctime": 1777347042, "time_str": "11:30:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260428/c676334483.shtml"}, {"id": "4286951", "title": "股指期货早盘收盘 主力合约涨跌互现", "content": "股指期货早盘收盘，主力合约涨跌互现。沪深300股指期货(IF)主力合约涨0.12%，上证50股指期货(IH)主力合约涨0.55%，中证500股指期货(IC)主力合约跌0.38%，中证1000股指期货(IM)主力合约跌0.68%。", "ctime": 1777347033, "time_str": "11:30:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260428/c676334477.shtml"}, {"id": "4286943", "title": "印尼列车相撞事故已致14死84伤", "content": "印度尼西亚国家铁路公司4月28日说，27日晚发生在西爪哇省勿加泗市的列车相撞事故目前已造成14人死亡，另有84人受伤。印尼铁路公司声明，所有伤者的医疗费和死者的丧葬费将由保险公司和印尼铁路公司承担。印尼铁路公司总裁表示，死者已被送往医院进行身份确认。初步信息显示，27日晚，一列长途列车驶入勿加泗市停有一列通勤列车的轨道，与通勤列车相撞。勿加泗市位于印尼首都雅加达以东20多公里处，是雅加达重要的卫星城之一。（央视新闻）", "ctime": 1777346629, "time_str": "11:23:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260428/c676334321.shtml"}, {"id": "4286939", "title": "美国会预算办公室：未来十年美政府赤字增加超万亿美元", "content": "美国国会预算办公室主任菲利普·斯瓦戈尔27日说，未来十年，联邦政府预算赤字将增加约1.1万亿美元。他表示，当前中东战事导致能源价格飙涨，让美国政府尝试通过减税提振经济的努力“白费”。（新华社）", "ctime": 1777346591, "time_str": "11:23:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260428/c676334306.shtml"}, {"id": "4286931", "title": "化工品主力合约多数走高", "content": "郑商所瓶片主力合约大涨5%，报8798元/吨。甲醇主力合约涨超2%，报2973元/吨。丙烯主力合约涨超3%，报8516元/吨。大商所聚丙烯主力合约涨超2%，报8653元/吨。", "ctime": 1777346467, "time_str": "11:21:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260428/c676334264.shtml"}, {"id": "4286929", "title": "子材大桥通车 平陆运河27座跨运河桥梁全部建成", "content": "今天（28日），平陆运河子材大桥正式通车，这标志着平陆运河27座跨运河桥梁全部建成。平陆运河是西部陆海新通道的骨干工程、加快建设交通强国的标志性工程，也是新中国成立以来第一条通江达海的大运河。（央视新闻）", "ctime": 1777346450, "time_str": "11:20:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260428/c676334260.shtml"}, {"id": "4286917", "title": "日本岩手县已有超3000人因山火接到避难指示", "content": "据日本共同社28日报道，岩手县大槌町22日发生山火后，当地已有超过3000名居民接到避难指示。报道说，当地山火28日进入第7天，火势大体已得到控制。截至28日上午，过火面积已达1633公顷。目前，来自日本各地的消防人员以及自卫队正继续开展灭火作业。（新华社）", "ctime": 1777346201, "time_str": "11:16:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260428/c676334136.shtml"}, {"id": "4286913", "title": "我国首款正向设计自转旋翼机完成首飞", "content": "今天（4月28日），我国首款正向设计的自转旋翼机在山东烟台成功首飞，标志着我国补齐轻型自转旋翼机短板，在核心技术自主研发、规范化适航体系建设上实现突破。自转旋翼机是介于直升机与固定翼飞机之间的航空器。顶部装有和直升机类似的大旋翼，但旋翼不靠发动机直接驱动，而是依靠飞行时的迎面气流吹动旋转产生升力。此次首飞时长超38分钟，整机姿态平稳、操控精准，动力、旋翼、航电、飞控等核心系统运行稳定，各项性能指标均达到设计与适航审定预期。（央视新闻）", "ctime": 1777346175, "time_str": "11:16:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260428/c676334120.shtml"}, {"id": "4286903", "title": "斯塔默：议会针对自己投票是政治对手“作秀”", "content": "针对英国议会将就是否对首相斯塔默展开调查进行投票，斯塔默27日说，这是政治对手的“政治作秀”，不会增加事件透明度。（新华社）", "ctime": 1777345945, "time_str": "11:12:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260428/c676334042.shtml"}, {"id": "4286901", "title": "支付宝推出“AI收”", "content": "4月28日，支付宝正式上线“支付宝AI收”，帮助商家和个人开发者通过OpenClaw（俗称“龙虾”）这类AI Agent提供商业化服务，实现按调用即时收款。这是继推出“AI付”之后，支付宝在智能体支付领域的进一步布局。（人民财讯）", "ctime": 1777345919, "time_str": "11:11:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260428/c676334028.shtml"}, {"id": "4286877", "title": "中国气象局：我国将实施极端天气应对攻坚行动", "content": "今天，国务院新闻办公室举办“开局起步‘十五五’”系列主题新闻发布会，中国气象局相关负责人介绍了“十五五”时期，加快推进气象高质量发展的重点部署和各项举措，其中提到要实施极端天气应对攻坚行动，更加注重从监测预报、预警“叫应”、应急联动和气候适应性支撑等全链条发力，整体提升极端天气应对的综合能力，到2030年，气象科技、监测、预报达到同期世界先进水平，特别是极端天气应对能力显著提升。（央视新闻）", "ctime": 1777345671, "time_str": "11:07:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260428/c676333928.shtml"}, {"id": "4286841", "title": "日本央行如期维持利率不变", "content": "日本央行连续第三次会议将目标利率维持在0.75%不变，符合市场预期。", "ctime": 1777345487, "time_str": "11:04:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260428/c676333850.shtml"}, {"id": "4286833", "title": "中国气象局：持续推进“人工智能+气象” 提升气象预报准确率 时效性", "content": "中国气象局表示，“十五五”时期，气象部门将持续推进“人工智能+气象”，努力做强雄安气象人工智能创新研究院，进一步夯实数据、算力和平台等基础支撑，加快建设国际一流气象人工智能研发中心。推动人工智能等技术深度融入预报预警业务，提升气象预报准确率、时效性。近年来，中国气象局发布了“风雷”“风清”“风顺”等覆盖0—60天无缝隙的人工智能气象预报模型系统。“风雷”模型对短时临近强降水量级和落区有较好的预报能力。“风清”模型对3—10天全球中短期天气有较强的预报能力。“风顺”模型则能够大幅增强15天以上天气气候系统的预报能力。（央视新闻）", "ctime": 1777345409, "time_str": "11:03:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260428/c676333811.shtml"}, {"id": "4286821", "title": "中国气象局：将绘制5大类25种作物气候区划图谱 摸清气候资源底数", "content": "中国气象局：将联合农业农村部，全面启动新一轮农业气候资源普查和区划工作，系统绘制5大类25种作物气候区划图谱，推动气候资源转化为农业发展优势，助力农业生产提质增效。（央视新闻）", "ctime": 1777345344, "time_str": "11:02:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260428/c676333787.shtml"}, {"id": "4286817", "title": "算力租赁板块反复活跃，群兴玩具等股涨停", "content": "算力租赁板块反复活跃，群兴玩具、三人行、智微智能涨停，利通电子此前涨停，宏景科技、协创数据纷纷上扬。", "ctime": 1777345321, "time_str": "11:02:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260428/c676333774.shtml"}, {"id": "4286811", "title": "美国ITC发布对半导体器件及其下游计算产品和组件的337部分终裁", "content": "4月27日，美国国际贸易委员会（ITC）发布公告称，对特定半导体器件及其下游计算产品和组件（Certain Semiconductor Devices, Computing Products Containing the Same,and Components Thereof，调查编码：337-TA-1465）作出337部分终裁：对本案行政法官于2026年3月31日作出的初裁（No.11）不予复审，即基于和解，终止对列名被告美国Advanced Micro Devices, Inc., Santa Clara, California的调查，同时基于申请方撤回，终止对列名被告中国广东Lenovo Information Products (Shenzhen) Co., Ltd, Shenzhen, Guangdong, China联想信息产品（深圳）有限公司、美国Lenovo (United States) Inc., Morrisville, North Carolina、中国香港特别行政区Lenovo Group Limited, Quarry Bay, Hong Kong SAR、美国Super Micro Computer, Inc., San Jose, California的调查，因此本案调查终止。（中国贸易救济信息网）", "ctime": 1777345252, "time_str": "11:00:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260428/c676333751.shtml"}, {"id": "4286809", "title": "沪深京三市成交额超1.5万亿元，较上日此时缩量465亿元", "content": "据同花顺iFinD数据，沪深京三市成交额超1.5万亿元，较上日此时缩量465亿元，预计全天成交金额约2.5万亿元。截至目前，沪市成交额6542亿元，深市成交额8388亿元，北证50成交额78亿元。", "ctime": 1777345239, "time_str": "11:00:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260428/c676333750.shtml"}, {"id": "4286807", "title": "“磐石100”模型体系发布 为科学研究提供智能支撑", "content": "中国科学院发布“磐石100”模型体系，该体系将推动人工智能驱动的科学研究从分散的单点探索迈向协同高效的平台化创新阶段，为各领域的前沿科学研究提供智能支撑。“磐石100”模型体系以“磐石·科学基础大模型”为根基，搭配各个专业学科的专属模型作为主力支撑，同时针对各类具体科研场景，开发出细分应用模型和智能工具。整套系统组合在一起，形成了覆盖面广、协同高效的智能化科研服务平台。（央视新闻）", "ctime": 1777345234, "time_str": "11:00:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260428/c676333749.shtml"}, {"id": "4286785", "title": "小鹏汽车投资成立汽车贸易新公司", "content": "企查查APP显示，近日，广州鹏禹汽车贸易有限公司成立，经营范围包含充电桩销售；新能源汽车生产测试设备销售；电池零配件销售等。企查查股权穿透显示，该公司由小鹏汽车关联公司广州橙行智动汽车科技有限公司全资持股。（人民财讯）", "ctime": 1777344999, "time_str": "10:56:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260428/c676333659.shtml"}, {"id": "4286783", "title": "绿色动力与阿里云深化战略合作 行业首个“智控一体”智能体落地", "content": "记者从绿色动力获悉，近日，绿色动力集团与阿里云正式签署深化合作协议。双方将围绕智慧电厂升级、行业智能体开发及海外业务拓展等方向开展深度合作，共同推动固废处理行业向高质量、智能化转型。目前，双方已基于千问模型打造出行业首个固废焚烧“智控一体”智能体，并在绿色动力集团下属武汉项目落地应用。（证券时报）", "ctime": 1777344982, "time_str": "10:56:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260428/c676333649.shtml"}, {"id": "4286779", "title": "广东：支持深交所、广期所发展壮大，大力发展风投创投等股权投资业务", "content": "《广东省国民经济和社会发展第十五个五年规划纲要》正式发布。其中提到，突出发展银行业，支持银行法人或分支机构做大做强，支持城商行、农商行、村镇银行兼并重组。加快发展证券业，加快构建更具竞争力的多层次资本市场，支持深交所、广期所发展壮大，大力发展风投创投等股权投资业务。创新发展保险业，支持保险机构创新责任险、巨灾险等服务机制，围绕科创、海洋、养老等领域创新保险产品。推动保理、担保、小贷等泛金融类金融稳健发展。稳步扩大金融制度型开放，有序推进粤港澳金融市场互联互通，扩大“跨境理财通”、本外币合一银行结算账户系试点。", "ctime": 1777344855, "time_str": "10:54:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260428/c676333608.shtml"}, {"id": "4286775", "title": "凌激副部长兼国际贸易谈判副代表会见瑞士安波福集团董事会主席兼首席执行官凯文·克拉克", "content": "4月27日，商务部副部长兼国际贸易谈判副代表凌激会见瑞士安波福集团董事会主席兼首席执行官凯文·克拉克，双方围绕外资企业在华本土化发展、汽车产业国际合作等议题进行交流。凌激表示，中国坚持高水平对外开放，支持外资参与产业链上下游配套协作。智能网联新能源汽车是“十五五”时期中国着力发展的战略性新兴产业。欢迎包括安波福在内的跨国公司充分利用中国高效完备的汽车工业体系、富有活力的创新生态、丰富多元的应用场景，持续深耕中国市场，不断提升创新发展水平，在全球市场上实现更高水平的互利共赢。（商务部）", "ctime": 1777344803, "time_str": "10:53:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260428/c676333568.shtml"}, {"id": "4286773", "title": "华为擎云发布教育AI解决方案", "content": "4月28日，在首届鸿蒙教育AI峰会期间，华为联合生态伙伴发布教育AI战略及全场景校园方案。据介绍，该方案依托鸿蒙分布式技术与AI大模型，可覆盖多类校园场景。（界面新闻）", "ctime": 1777344780, "time_str": "10:53:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260428/c676333561.shtml"}, {"id": "4286771", "title": "解决新旧海商法衔接适用问题 最高法出台司法解释", "content": "今天（28 // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片

  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;

    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
