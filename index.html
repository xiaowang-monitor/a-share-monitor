/20260618/c677569432.shtml"}, {"id": "4555957", "title": "外交部：中方期待同金砖成员加强沟通协调", "content": "6月18日，外交部发言人林剑主持例行记者会。有记者问：中方发布了王毅出席第十六次金砖国家安全事务高级代表会议的消息。能否进一步介绍王毅与会有关安排，中方对此次会议有何期待？\n\n林剑表示，第十六次金砖国家安全事务高级代表会议将于6月22日至23日在印度新德里举行。会议期间，中方将同金砖成员就当前国际安全形势、重大国际和地区问题、统筹应对传统和非传统安全挑战等交换意见，为今年9月金砖国家领导人会晤做好政治准备。中方期待以此次会议为契机，同金砖成员加强沟通协调，不断深化金砖政治安全领域合作内涵，为维护世界和平安全贡献积极力量。(央视新闻)", "ctime": 1781770584, "time_str": "16:16:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260618/c677569426.shtml"}, {"id": "4555927", "title": "智飞生物：重组轮状病毒亚单位疫苗临床试验申请获受理", "content": "智飞生物公告，由全资子公司北京智飞绿竹生物制药有限公司研发的重组轮状病毒亚单位疫苗（大肠杆菌）获得国家药品监督管理局药物临床试验申请受理通知书（受理号：CXSL2600643）。自受理之日起60日内，未收到药审中心否定或质疑意见的，智飞绿竹可以按照提交的方案开展临床试验。", "ctime": 1781770410, "time_str": "16:13:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260618/c677569313.shtml"}, {"id": "4555901", "title": "美伊签署谅解备忘录，但以军仍在袭击黎巴嫩，外交部回应", "content": "6月17日，特朗普签署美伊谅解备忘录，与此同时，以色列仍在袭击黎巴嫩。18日，外交部发言人林剑称，在此关键阶段，包括以色列在内的相关各方都顺应地区和平稳定大局。（澎湃新闻）", "ctime": 1781770326, "time_str": "16:12:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260618/c677569256.shtml"}, {"id": "4555889", "title": "商务部：持续优化在华工作生活指引 提升外国商务人士便利度", "content": "在今天召开的商务部例行新闻发布会上，新闻发言人何亚东介绍，商务部会同相关部门已经连续三年编制发布《外国商务人士在华工作生活指引》，受到了来华外国商务人士的欢迎。近期发布的2026年版《指引》，对相关内容进行了更新升级。何亚东表示，在政策方面，比如扩大实施单方面免签政策，优化240小时过境免签的政策范围。另外，新增离境退税的内容，系统介绍离境退税政策、办理流程等。在便利服务方面，比如新增了办理使用eSIM卡有关介绍，提升通信便利。另外也更新了外国人拍卡过闸乘坐地铁的城市范围。商务部将持续关注外国商务人士的诉求，为他们营造更加友好、高效和便利的发展环境。（央视新闻）", "ctime": 1781770232, "time_str": "16:10:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260618/c677569195.shtml"}, {"id": "4555875", "title": "港股收评：恒生指数跌1.59%，恒生科技指数跌1.39%", "content": "港股收盘，恒生指数跌1.59%，恒生科技指数跌1.39%。恒指港股通ETF银华（ ttps://news.10jqka.com.cn/20260618/c677568544.shtml"}, {"id": "4555851", "title": "普门科技：取得糖化血红蛋白测定试剂盒注册证，有效期至2031年", "content": "普门科技公告，公司于近期收到1个广东省药品监督管理局颁发的《中华人民共和国医疗器械注册证（体外诊断试剂）》，产品为糖化血红蛋白测定试剂盒（高效液相色谱法），注册分类II类，注册证编号粤械注准20262400629，有效期至2031年6月15日，用于定量检测人全血中糖化血红蛋白（HbA1c）的含量，临床上用于糖尿病的辅助诊断和血糖水平的监控。", "ctime": 1781770009, "time_str": "16:06:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260618/c677568410.shtml"}, {"id": "4555835", "title": "天阳科技：签订3.03亿元算力云服务协议", "content": "天阳科技公告，公司与云粒智慧科技有限公司于2026年6月16日签署《算力云服务协议》，协议总金额（含税）为3.03亿元人民币。协议约定，天阳科技为云粒智慧提供算力云服务，每个采购订单服务期限为不间断48个月，服务以月为结算周期收取月度服务费。本次协议的签署不构成关联交易，也不构成重大资产重组，无需提交公司董事会和股东会审议。", "ctime": 1781769877, "time_str": "16:04:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260618/c677568084.shtml"}, {"id": "4555821", "title": "国家能源局：5月份，全社会用电量8671亿千瓦时，同比增长6.9%", "content": "据国家能源局，5月份，全社会用电量8671亿千瓦时，同比增长6.9%。1～5月，全社会用电量累计42018亿千瓦时，同比增长5.7%。从分产业用电看，第一产业用电量574亿千瓦时，同比增长5.6%。第二产业用电量27324亿千瓦时，同比增长5.1%。第三产业用电量8055亿千瓦时，同比增长8.6%。", "ctime": 1781769820, "time_str": "16:03:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260618/c677567851.shtml"}, {"id": "4555819", "title": "博通盘前涨3.07%，现报404.97美元", "content": "博通盘前涨3.07%，现报404.97美元。消息面上，摩根大通称博通与谷歌TPU五年合作项目按计划推进、AI收入可见性延伸至2031年，并维持“买入”上调目标价至580美元。", "ctime": 1781769798, "time_str": "16:03:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260618/c677567746.shtml"}, {"id": "4555813", "title": "超威半导体盘前涨3.08%，现报528.27美元", "content": "超威半导体盘前涨3.08%，现报528.27美元。消息面上，AMD与Rackspace签署协议部署30兆瓦AI算力基础设施，并获联博集团与伯恩斯坦上调目标价至600美元推动盘前走强。", "ctime": 1781769788, "time_str": "16:03:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260618/c677567695.shtml"}, {"id": "4555801", "title": "艾华集团：超级电容相关产品目前不属于公司主营业务范围 截至目前未形成相关销售收入", "content": "艾华集团公告，近期超级电容产品关注度较高，公司核心主营业务为研发、生产和销售铝电解电容器、薄膜电容器、电极箔和金属化膜，超级电容相关产品目前不属于公司主营业务范围，未纳入公司现有主营业务体系，截至目前未形成相关销售收入，对公司当期及近期经营业绩无重大影响。在AI服务器业务方面，公司现阶段主要处于产品导入和产能爬坡阶段，放量节奏取决于客户验证进度和供应链配套成熟度。目前AI服务器在公司整体收入中的占比低，且当前该业务仍处于早期阶段，客户认证周期、订单释放节奏及行业整体需求变化等因素均存在正常的不确定性。", "ctime": 1781769749, "time_str": "16:02:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260618/c677567540.shtml"}, {"id": "4555799", "title": "美股存储芯片、光通信盘前走高 英特尔涨超6%", "content": "美股存储芯片、光通信盘前走高，英特尔涨超6%，西部数据、ARM、美光科技、闪迪涨超4%，Coherent、迈威尔科技、Credo涨超3%，康宁、Lumentum、高通、AMD涨超2%。", "ctime": 1781769746, "time_str": "16:02:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260618/c677567522.shtml"}, {"id": "4555783", "title": "巴基斯坦总理签署美伊谅解备忘录", "content": "巴基斯坦总理办公室18日发表声明说，巴基斯坦总理夏巴兹作为调解人签署了美国和伊朗谅解备忘录。（新华社）", "ctime": 1781769707, "time_str": "16:01:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260618/c677567335.shtml"}, {"id": "4555775", "title": "美股中概股盘前涨跌互现，盛美涨5%", "content": "美股中概股盘前涨跌互现，盛美涨5%，百度、蔚来涨1%，京东跌0.8%，阿里巴巴跌1%，携程、理想汽车、贝壳跌2%。", "ctime": 1781769690, "time_str": "16:01:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260618/c677567263.shtml"}, {"id": "4555773", "title": "美股大型科技股盘前普涨，SpaceX涨1%", "content": "美股大型科技股盘前普涨，Meta、SpaceX、亚马逊、英伟达涨1%，微软涨0.8%，特斯拉涨0.7%，苹果涨0.6%，谷歌A持平。", "ctime": 1781769688, "time_str": "16:01:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260618/c677567250.shtml"}, {"id": "4555771", "title": "市场监管总局督导货拉拉落实反垄断合规整改", "content": "国家市场监督管理总局6月18日通报，市场监管总局加强对货拉拉反垄断合规整改的全过程督导，压实平台主体责任。前期，市场监管总局依据《中华人民共和国反垄断法》公开约谈货拉拉，要求其停止利用算法不合理压低货运价格、利用平台规则实施强制独家车贴等行为，全面开展自查整改，依法合规经营，主动回应各方关切，自觉接受社会监督。\n\n市场监管总局督促其严格落实整改要求，具体包括四方面内容：一是停止利用算法不合理压低货运价格，严格控制多因素计价订单占比，公平合理运用调价算法，推动平均每单运价、每公里运价合理回升，并常态化公示计价规则和运价涨降理由；二是全面取消强制独家车贴规则，停止提高抽成、罚款等惩罚措施，并向司机退还不合理费用1.2亿元；三是切实降低平台抽成费率，平台整体抽成费率由整改前约11%降至约9%，每年可减轻司机负担超13亿元；四是全面保障司机合法权益，取消非付费会员司机每天接2单限制，提升车型与订单匹配度，取消扣减里程机制，每年投入里程偏差补偿金1000万元，优化司机申诉流程，投入司机帮扶资金5000万元。\n\n市场监管总局将深入整治平台经济领域“内卷式”竞争，督促货拉拉持续深化反垄断合规整改质效，保护货车司机和消费者利益，形成优质优价、良性竞争的市场秩序，促进平台企业与平台内经营者、劳动者实现共赢发展。(新华社)", "ctime": 1781769677, "time_str": "16:01:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260618/c677567208.shtml"}, {"id": "4555747", "title": "美光科技美股盘前涨超3%", "content": "美光科技美股盘前涨超3%，现报1084.51美元。", "ctime": 1781769647, "time_str": "16:00:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260618/c677567085.shtml"}, {"id": "4555709", "title": "安诺其：正在筹划购买烽云科技100%股权", "content": "安诺其公告，公司正在筹划以发行股份及支付现金的方式购买广州烽云信息科技有限公司100%股权，同时拟向不超过35名特定投资者发行股份募集配套资金。预计本次交易可能构成《上市公司重大资产重组管理办法》规定的重大资产重组，并构成关联交易。截至本公告披露日，除本次交易预案中披露的风险因素外，公司尚未发现可能导致公司董事会或者交易对方撤销、中止本次交易方案或者对本次交易方案作出实质性变更的相关事项，本次交易相关工作正在持续推进过程中。", "ctime": 1781769625, "time_str": "16:00:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260618/c677567019.shtml"}, {"id": "4555679", "title": "集智股份：终止收购浙江谱麦科技不低于51%股权", "content": "集智股份公告，公司原计划以支付现金的方式收购浙江谱麦科技有限公司不低于51%股权，但因交易双方未能就关键条款达成一致意见，决定终止《收购意向协议》。此次终止不会对公司财务状况和经营状况产生重大影响。", "ctime": 1781769615, "time_str": "16:00:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260618/c677567015.shtml"}, {"id": "4555661", "title": "让AI走进千家万户，17项举措推进“人工智能+消费”发展", "content": "今天（18日），商务部等八部门发布《关于加快“人工智能+消费”发展的实施意见》，围绕提升人工智能+商品消费、扩大人工智能+服务消费等五方面，提出17项具体举措，促进人工智能进千家万户、进千商万店，更好满足人民美好生活需要。此次《意见》从供需两侧同时发力，打通了人工智能应用过程中“有产品无市场”或“有需求无供给”的结构性堵点。（央视新闻）", "ctime": 1781769521, "time_str": "15:58:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260618/c677566946.shtml"}, {"id": "4555657", "title": "迈阿密林火或将影响世界杯", "content": "美国佛罗里达州迈阿密-戴德县近日先后发生两处灌木丛火灾。截至6月17日上午，火情仍未得到完全控制。火灾产生的浓烟导致当地部分地区空气质量和能见度下降。有当地媒体指出，此次火灾浓烟或将影响本届世界杯场馆迈阿密体育场。该场馆为露天设计，夏季本就面临雷暴风险，如果火灾持续、空气质量进一步恶化，可能对赛事组织和人员健康产生影响。不过，截至当地时间6月17日上午，赛事组织方尚未宣布调整相关赛程。 （CCTV国际时讯）", "ctime": 1781769478, "time_str": "15:57:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260618/c677566918.shtml"}, {"id": "4555613", "title": "外交部：日本右翼势力掩盖真相 根本目的是否认历史定论", "content": "6月18日，外交部发言人林剑主持例行记者会。有记者问：近日，《揭秘731部队：日本的秘密人体实验》纪录片播出，通过采访日军侵华第731部队唯一在世老兵、细菌战受害者及家属、新加坡学者等，让观众得以进一步了解历史真相。该纪录片受到了广泛关注。网民评论称，日军暴行惨无人道，不应逃脱历史审判。发言人对此有何评论？林剑表示，二战期间，侵华日军第731部队进行了灭绝人性的活体实验和细菌战，受害者既有大量的中国平民，也有苏联战俘、朝鲜劳工、英美被俘的军人等。这段极其黑暗、残忍的历史，拷问着人类的良知和底线。令人警醒的是，面对铁证如山的事实，日本右翼势力不仅拒不反省，还把臭名昭著的731部队美化为“从事卫生研究的单位”，大搞历史修正主义，极力掩盖真相、淡化否认罪责。其根本目的是否认历史定论，挑战以二战胜利成果为基础的战后国际秩序，这对地区和平稳定构成威胁。（央视新闻）", "ctime": 1781769032, "time_str": "15:50:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260618/c677566540.shtml"}, {"id": "4555605", "title": "外交部：中国将同非洲和阿拉伯国家进一步携手合作，共建命运共同体", "content": "6月18日，外交部发言人林剑主持例行记者会。\n\n有记者提问，据报道，“中国同非洲和阿拉伯国家开启外交关系70周年：携手共建命运共同体”研讨会昨天在北京举行。发言人能否介绍有关情况？\n\n林剑表示，今年是中国同非洲和阿拉伯国家开启外交关系70周年。70年前，以新中国同埃及建交为发端，中非中阿关系的发展掀开了新篇章。进入新时代，在习近平主席和非洲阿拉伯国家领导人的指引下，中非中阿关系实现了跨越式发展，迈进历史最好时期，树立了构建人类命运共同体的典范。\n\n昨天，中方主办的“中国同非洲和阿拉伯国家开启外交关系70周年：携手共建命运共同体”研讨会在北京成功举行。外交部副部长苗得雨出席了开幕式并致辞，非洲和阿拉伯国家驻华使节、专家学者等约200人相聚线下和云端，共同回顾70年来中非中阿合作成果，畅谈未来的合作愿景。非方和阿方的代表普遍认为，中非中阿是肝胆相照的好兄弟，风雨同舟的好朋友，志同道合的好伙伴。\n\n中国的“十五五”规划为深化中非中阿合作提供了广阔的新机遇。中国将同非洲和阿拉伯国家进一步携手合作，奏响全球南方发展振兴的团结乐章，朝着构建人类命运共同体的共同愿景不懈努力。(澎湃新闻)", "ctime": 1781769000, "time_str": "15:50:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260618/c677566495.shtml"}, {"id": "4555585", "title": "“九章四号”同系列光量子计算机“天衍-P2000”首次正式开放云服务", "content": "在中国科学院量子信息与量子科技创新研究院指导下，中国电信旗下中电信量子集团联合九章（济南）量子科技有限公司建设的“九章四号”同系列光量子计算机“天衍-P2000”已正式运行，并接入中国电信“天衍”量子计算云平台，首次面向全球用户推出光量子线上优越性服务能力。（科创板日报）", "ctime": 1781768887, "time_str": "15:48:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260618/c677566383.shtml"}, {"id": "4555579", "title": "中方是否会参与美伊第二阶段和平谈判？外交部回应", "content": "6月18日，外交部发言人林剑主持例行记者会。法新社记者提问，关于美国与伊朗签署谅解备忘录并将进入第二阶段和平谈判，中方是否会参与调解与谈判？林剑表示，自战事爆发以来，中方一直为止战奔走、为和平尽力。习近平主席郑重提出维护和促进中东和平稳定的“四点主张”，充分体现了中方促和止战、倡导对话、化解分歧的一贯立场和积极努力，为破解中东危局提供了中国方案，为凝聚国际共识发挥了重要作用。中方愿继续秉持习近平主席“四点主张”的精神，劝和不停歇、促谈不止步，为早日恢复中东的和平稳定与发展持续做出努力。(澎湃新闻)", "ctime": 1781768872, "time_str": "15:47:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260618/c677566366.shtml"}, {"id": "4555557", "title": "外交部：敦促日方反躬自省 切实履行《不扩散核武器条约》义务", "content": "6月18日，外交部发言人林剑主持例行记者会。有记者就美日等加强所谓“延伸威慑”合作提问。林剑表示，中方对美日等加强“延伸威慑”动向表示担忧和严正关切。“延伸威慑”是冷战产物。个别国家出于地缘政治目的强化核威慑合作，加剧核扩散与核冲突的风险。在《不扩散核武器条约》审议大会上，许多国家对“延伸威慑”安排表达严重关切和强烈反对。我们敦促日方反躬自省，切实履行《不扩散核武器条约》义务，恪守“无核三原则”，不以任何形式寻求核武器。（央视新闻）", "ctime": 1781768714, "time_str": "15:45:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260618/c677566294.shtml"}, {"id": "4555535", "title": "光庭信息：董事王军德因违规减持收警示函", "content": "光庭信息公告，公司董事、总经理王军德于2025年10月10日公告减持计划，拟在15个交易日后的3个月内通过集中竞价方式减持不超过80000股。但2026年1月8日至1月13日，王军德实际通过集中竞价交易方式合计减持公司股份86625股，超出已披露减持计划6625股。湖北证监局认为该行为违反了相关证券法规，决定对王军德采取出具警示函的行政监管措施，并将违规情况记入诚信档案。", "ctime": 1781768623, "time_str": "15:43:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260618/c677566255.shtml"}, {"id": "4555533", "title": "富祥股份：预计上半年净利润1.65亿元–2.15亿元，上年同期亏损691.12万元", "content": "富祥股份公告，预计2026年上半年净利润为1.65亿元–2.15亿元，上年同期亏损691.12万元。报告期内，公司紧抓市场机遇，将电解液添加剂VC产品产能增加至10000吨/年，同时FEC产品产能约4000吨/年。2026年上半年公司前述产品销售量价齐增，推动公司业绩大幅增长且扭亏为盈。新能源业务已成为公司业绩增长的核心引擎。", "ctime": 1781768615, "time_str": "15:43:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260618/c677566249.shtml"}, {"id": "4555519", "title": "外交部：北约应深刻反思对和平稳定发挥了什么作用", "content": "针对北约秘书长就乌克兰危机发表涉华言论，外交部发言人林剑18日在例行记者会上表示，中方在乌克兰危机问题上始终秉持着客观、公正立场，一直积极致力于止战停火、劝和促谈，从未向冲突的任何一方提供致命性武器，严格管控军民两用物项。林剑说，北约应纠正错误的对华认知，停止挑动对抗、甩锅推责。同时深刻地反思，自身作为冷战时代的产物，对当今世界的和平稳定发挥了什么作用，造成了什么影响。（新华社）", "ctime": 1781768537, "time_str": "15:42:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260618/c677566203.shtml"}, {"id": "4555511", "title": "G7称降低对中国关键矿产的依赖 外交部：中方立场没有变化", "content": "外交部发言人林剑主持例行记者会。记者提问，G7峰会发表的声明中称，将降低对中国稀土和关键矿产的依赖。请问外交部对此有何评论？林剑表示，中方维护关键矿产全球产供链稳定与安全的立场没有变化，同时各方都有责任，为此发挥建设性作用。中方对出口管制体系进行规范和完善，符合国际通行做法，目的是更好地维护世界和平与地区稳定，履行防扩散等国际义务。我们敦促七国集团切实遵守市场经济原则和国际经贸规则，停止以小圈子的规则来破坏国际经贸秩序。（澎湃新闻）", "ctime": 1781768386, "time_str": "15:39:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260618/c677566113.shtml"}, {"id": "4555497", "title": "乌称再袭莫斯科地区炼油厂 俄称击落137架无人机", "content": "当地时间6月18日，乌克兰总统泽连斯基通过社交媒体证实，当天凌晨，乌方实施远程打击，再度击中俄罗斯莫斯科地区炼油厂，这是一周内乌方针对该设施实施的第二次打击。另据总台记者自俄罗斯方面获悉，当地时间18日4时32分至7时19分（北京时间18日9时32分至12时19分），莫斯科市市长索比亚宁通过社交媒体多次发布消息称，俄军防空系统共击落137架飞向莫斯科的无人机。他称，数架无人机突破防线抵达莫斯科地区一炼油厂，相关部门正在采取措施以应对袭击造成的后果。（央视新闻）", "ctime": 1781768350, "time_str": "15:39:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260618/c677566090.shtml"}, {"id": "4555495", "title": "美加强对韩日核保护，外交部答澎湃：奉劝美停止采取挑衅性政策与行动", "content": "外交部发言人林剑主持例行记者会。记者提问，据报道，近期美国先后同日本举行“延伸威慑”对话，同韩国举行“核磋商小组”会议。美日、美韩均致力于加强“延伸威慑”合作。美方还重申将动用包括核力量在内的全部防务能力履行对日防卫承诺。中方对此有何评论？林剑表示，中方对美日等加强“延伸威慑”的动向表示担忧和严正关切。“延伸威慑”是“冷战”产物，个别国家出于地缘政治目的，强化核威慑合作，加剧了核扩散与核冲突的风险。在《不扩散核武器条约》审议大会上，许多国家对“延伸威慑”的安排表达严重的关切和强烈反对。我们敦促日方反躬自省，切实履行不扩散核武器条约义务，恪守“无核三原则”，不以任何形式寻求核武器。中方奉劝美方摒弃“冷战”思维，停止采取挑衅性政策与行动，废除核共享、“延伸威慑”等安排，以实际行动维护地区和平安全，维护全球的战略稳定，也希望韩方慎重行事，多做有助于地区稳定的事。（澎湃新闻）", "ctime": 1781768343, "time_str": "15:39:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260618/c677566083.shtml"}, {"id": "4555483", "title": "外交部：敦促七国集团切实遵守市场经济规则", "content": "6月18日，外交部发言人林剑主持例行记者会。有记者就七国集团对中方稀土出口表态提问。林剑表示，中方维护关键矿产安全的意愿没有变化。同时，各方都有责任并发挥建设性作用。我们敦促七国集团切实遵守市场经济规则，停止以小圈子破坏金融秩序。（央视新闻）", "ctime": 1781768324, "time_str": "15:38:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260618/c677566070.shtml"}, {"id": "4555461", "title": "外交部：望美伊以理性务实态度对待第二阶段谈判", "content": "据报道，美伊已签署第一阶段谅解备忘录。外交部发言人林剑18日在例行记者会上就此答问时说，美伊双方签署第一阶段谅解备忘录对缓和局势紧张、巩固停火势头有积极意义，中方对此表示欢迎。希望包括美伊在内的相关各方都能秉持契约精神，切实兑现承诺。\n\n林剑说，中方希望美伊双方都能以理性务实态度对待第二阶段谈判，相向而行，共同努力，争取下阶段谈判取得积极成果。(新华社)", "ctime": 1781768202, "time_str": "15:36:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260618/c677565945.shtml"}, {"id": "4555453", "title": "外交部回应美伊签署谅解备忘录：平等谈判才是正道", "content": "6月18日，外交部发言人林剑主持例行记者会。有记者问：据报道，17日白宫官员表示，美国总统特朗普已经签署美伊第一阶段谅解备忘录，伊朗外交部发言人表示，伊美谅解备忘录文本已最终正式敲定，双方已经签署。对此有什么评论？林剑表示，美伊双方签署第一阶段谅解备忘录，对缓和局势紧张、巩固停火势头有积极意义。中方对此表示欢迎，希望包括美伊在内的相关各方都能秉持契约精神，切实兑现承诺。武力解决不了问题，平等谈判才是正道。中方希望美伊双方都能以理性务实态度对待第二阶段谈判，相向而行，共同努力，争取下阶段谈判取得积极成果。（央视新闻）", "ctime": 1781768157, "time_str": "15:35:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

      { name: '板块', val: p.sector, w: 20 },

      { name: '封单', val: p.seal, w: 10 },

      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
