:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260624/c677674518.shtml"}, {"id": "4582989", "title": "软银孙正义：称AI为泡沫是对它的“亵渎”", "content": "软银CEO孙正义称将坚持工作至70岁，以追求其人工智能领域的雄心，并驳斥了人工智能领域已进入泡沫阶段的观点，称该论调为“亵渎”。孙正义周三在股东大会上表示，自己变得“贪婪”，放弃了原本在60岁时交棒的计划，他希望再有“10到15年”的时间来追逐人工超级智能（ASI）。“人们可能会像当初对互联网一样，怀疑AI是否也是一场泡沫，”孙正义在演讲中说道，“但回顾过去30年，顶级互联网公司实现了巨大增长。相比之下，人工智能革命才刚刚开始。”他补充说：“把AI称为泡沫，是对AI的亵渎，因为它的潜在力量将从现在起全面爆发。”", "ctime": 1782277695, "time_str": "13:08:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260624/c677674472.shtml"}, {"id": "4582977", "title": "沪深京三市成交额超2.2万亿元，较上日此时缩量2197亿元", "content": "据同花顺iFinD数据，沪深京三市成交额超2.2万亿元，较上日此时缩量2197亿元，预计全天成交金额约3.1万亿元。截至目前，沪市成交额10172亿元，深市成交额11694亿元，北证50成交额147亿元。", "ctime": 1782277624, "time_str": "13:07:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260624/c677674453.shtml"}, {"id": "4582975", "title": "机构：2026年GenAI智能手机预计占全球出货量45%", "content": "根据Counterpoint Research最新发布的GenAI智能手机市场预测报告，具备GenAI能力的智能手机预计将占2026年全球智能手机出货量的45%，高于2025年的36%。不过，持续的存储供应紧张预计将导致2026年全球智能手机出货量同比下降13.9%，降至10.8亿部，创历史新低。与此同时，GenAI智能手机市场份额预计将进一步提升，预计到2027年占全球智能手机出货量的52%，使GenAI技术有望成为整个市场的标准功能。（第一财经）", "ctime": 1782277620, "time_str": "13:07:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260624/c677674451.shtml"}, {"id": "4582969", "title": "锂矿板块午后持续走高，盛新锂能涨停", "content": "锂矿板块午后持续走高，盛新锂能涨停，永杉锂业、融捷股份此前封板，天齐锂业、赣锋锂业跟涨。消息面上，伯恩斯坦预计，2027年锂价可能达到每吨32500美元。从供给侧结构看，中国增长约30%，智利约25%，阿根廷约106%，而澳大利亚仅增长约6%，津巴布韦约16%。供给增长的地区分化是市场收紧快于预期的重要原因。", "ctime": 1782277508, "time_str": "13:05:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260624/c677674420.shtml"}, {"id": "4582939", "title": "成都林家坝5宗打包地块43.44亿元底价成交 未来新房售价或达5.2万元/平", "content": "成都林家坝TOD核心区5宗约195亩组合地块今日成功出让，成交总价43.44亿元，竞得方为成都轨道集团与锦江统建联合体。上述5宗土地采取整体打包出让方式，意向竞买人须同时报名参与全部地块竞买。该地块位于林家坝TOD核心区域，叠加TOD开发、商业自持、约120米地标建筑建设及代建绿地等多重成本约束。中指研究院分析师表示，经初步测算，在扣除相关开发及持有成本后，项目实际可售住宅楼面价已突破26500元/平方米，接近板块历史“地王”水平，项目未来新房售价预计将站上5.2万元/平方米。（财联社）", "ctime": 1782277202, "time_str": "13:00:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260624/c677674344.shtml"}, {"id": "4582915", "title": "挖金客成立新公司 含多项AI相关业务", "content": "企查查APP显示，近日，北京惠金智创科技有限公司成立，经营范围包含：人工智能应用软件开发；人工智能基础软件开发；工业互联网数据服务；人工智能行业应用系统集成服务等。企查查股权穿透显示，该公司由挖金客(301380)等共同持股。", "ctime": 1782276858, "time_str": "12:54:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260624/c677674280.shtml"}, {"id": "4582913", "title": "上海出台若干措施 支持生物医药外资企业高能级项目落地", "content": "上海市科委、市发展改革委等部门近日联合发布《关于支持生物医药外资企业高能级项目落地的若干措施》。其中提出，加快进口药品销售流通。境外已上市药品在取得我国药品批准证明文件后，对符合药品上市放行要求的获批前生产的药品，可以上市销售，加强对其业务指导与服务。", "ctime": 1782276523, "time_str": "12:48:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260624/c677674226.shtml"}, {"id": "4582911", "title": "美国银行：动力煤预计将受厄尔尼诺现象支撑", "content": "美国银行表示，尽管中东紧张局势有所缓解，但动力煤价格可能仍会受到支撑，理由是预计将出现强烈的厄尔尼诺现象，这将带来新的有利因素。本月早些时候，澳大利亚纽卡斯尔煤炭价格攀升至每吨150美元上方，创下约两年来的新高。美银表示：“尽管在海湾地区紧张局势缓解的情况下，近期市场有所走软，但厄尔尼诺天气模式通常与南亚和东南亚部分地区更炎热、更干燥的天气条件有关，应该会支撑增量煤炭消耗。”", "ctime": 1782276156, "time_str": "12:42:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260624/c677674113.shtml"}, {"id": "4582881", "title": "美国洛杉矶仓储设施火灾持续 严重影响空气质量", "content": "美国洛杉矶一处大型商业仓储设施自17日起发生火灾。据美国方面消息，截止到当地时间23日上午，火灾仍未扑灭，救火工作仍在进行中。此前一度有美国媒体报道称，该仓储设施火灾已受控。洛杉矶消防局方面表示，由于仓库建筑结构及冷库货架系统限制，消防人员无法对隔热屋顶进行排烟通风，只能从外部灭火。该仓库内储存了大量冷冻食品。目前火势没有蔓延至其他建筑，但由于大火释放的浓烟不断蔓延，导致东洛杉矶等地居民区的空气质量受到严重影响。（央视新闻）", "ctime": 1782275740, "time_str": "12:35:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260624/c677674056.shtml"}, {"id": "4582875", "title": "Pragmatic半导体推出Pragmatic NFC Protect", "content": "Pragmatic半导体发布Pragmatic NFC Protect PR1311，一款集成即时篡改检测、产品真伪验证等功能的新型柔性低碳NFC芯片。该芯片柔性且触感无痕，可无缝集成至产品及包装中，消费者用手机轻触即可确认产品开封状态与真伪。该方案早期获取计划已开放，面向零售、医药与工业等市场。（财联社）", "ctime": 1782275673, "time_str": "12:34:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260624/c677674013.shtml"}, {"id": "4582867", "title": "特朗普称国会限制总统战争权力“不合时宜”", "content": "美国总统特朗普23日称，美国国会限制总统战争权力的决议“不合时宜”。特朗普当天在社交媒体上称：“我已将伊朗逼至绝境……伊朗愿作出实质性让步……而美国参议院却偏偏选在这个时候，搞了一场不合时宜、毫无意义的《战争权力法》表决。”特朗普称，这一表决等于是“在给敌人提供援助和安慰”。特朗普还称：“这些参议员让我的工作变得更难了，但我会把它搞定。”（新华社）", "ctime": 1782275419, "time_str": "12:30:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260624/c677673966.shtml"}, {"id": "4582849", "title": "施耐德电气以软件锚定AI时代能源管理方向", "content": "智能经济飞速发展，AI驱动产业变革。从能源供给到算力突破，从软件研发到智能运维，每一项技术创新都离不开科技企业的创新探索。施耐德电气长期深耕能源管理与自动化技术，凭借在能源管理软件领域的持续创新与深厚积淀，已成功破解多个行业能效难题。而这些突破的创新源头，就来自强大的软件研发实力。（新华社）", "ctime": 1782275146, "time_str": "12:25:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260624/c677673929.shtml"}, {"id": "4582831", "title": "阿里QoderWork推“峰谷Token” 夜间使用Qwen3.7低至2折", "content": "阿里QoderWork推出“峰谷Token”，Agent在每晚22:00到次日08:00运行可自动享受优惠，其中Qwen3.7-Max模型低至2折。这是国内首个上线“峰谷Token”的Agent产品，将大幅降低用户的使用成本。例如，用户可在白天设定好定时任务、或者睡前提交长程任务指令，选择Qwen3.7模型，让Agent自动跑完全流程，早上起来验收即可。据介绍，夜间折扣产品涵盖QoderWork、Qoder Desktop等产品。（科创板日报）", "ctime": 1782274729, "time_str": "12:18:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260624/c677673854.shtml"}, {"id": "4582825", "title": "受降雨影响 全国6条河流发生超警洪水", "content": "记者从水利部了解到，受降雨影响，昨天到今天，广西西江干流平南江段及支流白沙江、柳江上游都柳江，贵州北盘江支流打邦河，湖南沅水支流渠水，江西长江中游支流乌石港等6条河流发生超警洪水，最大超警幅度0.49米，目前除白沙江外均已退至警戒以下。（央视新闻）", "ctime": 1782274501, "time_str": "12:15:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260624/c677673751.shtml"}, {"id": "4582823", "title": "6月24日午间公告一览：香港信贷授出新贷款本金总额为1500万港元", "content": "香港信贷公告，于2026年6月24日，公司作为贷款人与借款人订立新贷款协议。根据新贷款协议，公司同意向借款人授出本金金额为1500万港元之新贷款。此前，公司已订立过往贷款协议，以向借款人授出本金总额为2300万港元之过往贷款。新贷款之所得款项用作悉数结清过往贷款A的本金。", "ctime": 1782274497, "time_str": "12:14:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260624/c677673745.shtml"}, {"id": "4582801", "title": "德国铁路列车服务逐步恢复", "content": "德国铁路无线通信系统故障已经得到解决。德国范围内的铁路列车服务于当地时间今天凌晨开始逐步恢复，但是不排除还会有一些列车延误或者取消的情况。此前，德国铁路公司发言人证实，当地时间23日晚，因无线通信系统故障，德国铁路公司暂停了全国范围内的列车服务。长途列车、区域列车以及城际列车均受到影响。（央视新闻）", "ctime": 1782274240, "time_str": "12:10:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260624/c677673695.shtml"}, {"id": "4582781", "title": "贵州黔西南州贞丰县发生3.0级地震 震源深度10公里", "content": "中国地震台网正式测定：6月24日11时44分，在贵州黔西南州贞丰县（北纬25.54度，东经105.74度）发生3.0级地震，震源深度10公里。（央视新闻）", "ctime": 1782274046, "time_str": "12:07:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260624/c677673620.shtml"}, {"id": "4582759", "title": "美企发射“星落”返回舱 演示再入返回技术", "content": "美国太空探索技术公司23日利用“猎鹰9”号火箭首次发射“星落”返回舱，旨在对这种新型无人再入返回飞行器进行演示与验证。太空探索技术公司表示，完成受控飞行演示后，飞行器将在太平洋海域溅落。美联邦航空局相关文件显示，“星落”返回舱为扁圆形无人舱，高约0.75米，直径约3.1米，重量约2100公斤，可携带约1000公斤载荷，太空探索技术公司计划实施两次“星落”返回舱演示任务。该项目旨在实现太空和地面间关键货物快速点对点运输，并通过提供微重力和真空环境、轨道驻留以及规模化轨道返回服务，推动商业太空制造能力发展，有望成为国际空间站的后续商业替代平台之一。目前，太空探索技术公司尚未公布关于本次任务的更多细节，比如载荷内容和再入返回时间。（新华社）", "ctime": 1782273801, "time_str": "12:03:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260624/c677673558.shtml"}, {"id": "4582753", "title": "港股午评：恒生指数涨0.04%，恒生科技指数涨1.34%", "content": "港股午间收盘，恒生指数涨0.04%，恒生科技指数涨1.34%。恒指港股通ETF银华（159318）涨0.17%，港股通科技ETF鹏华（159751）涨1.69%。板块方面，生命科学工具、客运航空公司板块涨幅靠前；金属与采矿、林业与纸制品板块跌幅靠前。个股方面，麦科医药-B涨89.56%，凯莱英涨16.22%，华虹宏力涨16.0%，海西新药涨14.56%，仙工智能涨13.48%；海清智元跌27.89%，星源材质跌12.82%，博泰车联跌11.46%，曦智科技-P跌10.52%，威胜控股跌8.99%。", "ctime": 1782273766, "time_str": "12:02:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260624/c677673548.shtml"}, {"id": "4582745", "title": "中国代表呼吁国际社会为落实安理会决议作出更多努力", "content": "中国常驻联合国代表傅聪23日在“弥合落实鸿沟：安理会决议与维护国际和平与安全”安理会阿里亚模式会议上发言，呼吁国际社会在落实安理会决议方面作出更多努力。 傅聪说，安理会决议是安理会维护和平、预防冲突、解决争端的重要工具，是国际社会共同意志的体现。安理会决议的重要性在于执行。他就此谈四点看法：坚决维护安理会决议的法律权威；着力化解安理会决议的落实赤字；切实提高安理会决议的可执行性；反对未经安理会决议授权的单边行径。 傅聪强调，作为安理会常任理事国，中方将以全球治理倡议为引领，继续推动安理会决议得到全面、有效、及时落实，捍卫联合国和安理会作用与权威，为维护国际和平与安全作出不懈努力。(新华社)", "ctime": 1782273711, "time_str": "12:01:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260624/c677673536.shtml"}, {"id": "4582733", "title": "国际足联主席确认：特朗普将出席世界杯决赛，并向冠军颁奖", "content": "据环球网援引法新社、美国《纽约时报》等媒体报道，国际足联主席因凡蒂诺当地时间周二（23日）确认，美国总统特朗普将出席下月19日在新泽西州举行的世界杯决赛，并向冠军球队颁发奖杯。“我们将和总统（特朗普）在一起，一起享受决赛，当然我们也会一起为获胜者颁奖。”因凡蒂诺当天在美国福克斯电视台一档节目上称，“我们一直都在一起”。法新社称，因凡蒂诺与特朗普建立了密切关系。另据美国MS Now新闻频道介绍，按照世界杯常规颁奖流程，通常由国际足联主席在东道主国家元首见证下颁发冠军奖杯，由国家元首直接颁奖属于少见情况。", "ctime": 1782273540, "time_str": "11:59:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260624/c677673475.shtml"}, {"id": "4582707", "title": "特朗普指责国会限武决议毫无意义", "content": "当地时间6月23日，美国国会参议院通过一项限制总统战争权力的决议，要求总统特朗普结束对伊朗军事行动，并在今后对伊朗采取军事行动前必须获得国会授权。该决议此前已由众议院通过。对此，美国总统特朗普在社交平台发文，指责该投票\"时机不当且毫无意义\"，并指控赞成者向伊朗提供\"慰藉\"，使他的工作\"更加艰难\"。据美国哥伦比亚广播公司等媒体报道，这项决议不具有法律效力，很大程度上只是象征性的，但在参众两院通过也反映出包括部分共和党人在内的国会议员对特朗普战争策略的不满。（CCTV国际时讯）", "ctime": 1782272887, "time_str": "11:48:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260624/c677673346.shtml"}, {"id": "4582701", "title": "国家药监局副局长杨胜赴福建调研两岸医药融合发展政策", "content": "近日，国家药监局党组成员、副局长杨胜带队赴福建调研，实地走访平潭对台小额商品交易市场、复旦大学附属华山医院福建医院等，并召开座谈会听取医疗机构、台资企业、省级及相关地市药品监管部门对于两岸医药融合发展的政策诉求和意见建议。杨胜强调，要继续支持两岸融合发展示范区建设，研究出台推动两岸医药融合发展的政策措施，更好保障公众用药用械需求。", "ctime": 1782272655, "time_str": "11:44:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260624/c677673291.shtml"}, {"id": "4582683", "title": "日经225指数跌幅扩大至1%", "content": "日经225指数跌幅扩大至1%，现报69096.51点。", "ctime": 1782272458, "time_str": "11:40:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260624/c677673236.shtml"}, {"id": "4582677", "title": "美滥施关税等导致拉美和加勒比海地区外资流入遇阻", "content": "联合国拉丁美洲和加勒比经济委员会（拉加经委会）23日在智利首都圣地亚哥发布报告指出，由于美国越来越频繁地采取滥施关税等贸易措施，甚至动辄把关税用作政治谈判工具引发巨大不确定性，外资在拉美和加勒比海地区投资日趋谨慎，导致该地区去年部分产业的投资额大幅减少。最新数据显示，受全球地缘政治紧张和美国关税政策变化等因素影响，2025年拉美和加勒比地区吸引外国直接投资1942.33亿美元，同比仅增长1.7%。（新华社）", "ctime": 1782272299, "time_str": "11:38:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260624/c677673151.shtml"}, {"id": "4582675", "title": "特朗普称对委军事行动“回报率”已超28倍", "content": "据俄罗斯卫星社6月24日报道，美国总统特朗普表示，美国通过出售从委内瑞拉运出的数百万桶石油所获得的收入，已超过2026年1月在该国开展军事行动支出金额的28倍以上。 报道称，今年1月初，华盛顿对加拉加斯发动袭击，并强行控制委内瑞拉总统马杜罗及其妻子。随后，特朗普宣布有意控制委内瑞拉石油并通过出售石油获利。 特朗普在宾夕法尼亚州向支持者发表讲话时表示：“我们现在从委内瑞拉赚了很多钱，为了赢得那场战争，我们只用了48分钟。我们完全收回了战争成本，回报率达到28倍以上，甚至更多，至少是28倍。我们已经收回了所有军事支出，因为我们从那里运出了数百万桶石油。” （参考消息）", "ctime": 1782272295, "time_str": "11:38:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jq 述音频数据中存在笑声，提取识别到的第一笑声对应的第一笑声特征；将所述第一笑声特征与所述电子设备的循环缓存区中存储的第二笑声特征进行匹配，以得到所述第一笑声特征与所述第二笑声特征的相似度，其中，所述第二笑声特征是过去经过的预设时长内提取的至少一个第二笑声对应的笑声特征；基于所述第一笑声特征与所述第二笑声特征的相似度触发与所述电子设备当前播放内容的交互。", "ctime": 1782271718, "time_str": "11:28:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260624/c677672775.shtml"}, {"id": "4582643", "title": "多家私募收到通知 暂停跨境TRS新增", "content": "多位私募业人士向记者透露，昨晚陆续收到合作券商的通知，监管要求暂停管理人跨境TRS（总收益互换）规模新增。据公开资料，TRS为Total Return Swap（总收益互换)是一种金融衍生品，私募可以通过这一工具在不直接持有境外资产（本金不出境）的前提下，通过与对手券商签订收益互换协议，获得该资产的收益（或亏损）。今年以来，由于全球科技板块的亮眼表现，不少私募通过跨境TRS配置海外资产。5月以来，证监会等八部门联合印发《综合整治非法跨境证券期货基金经营活动实施方案》，对老虎证券、富途控股、长桥证券等头部跨境互联网券商亮出重拳，内地居民违规跨境炒股空间收缩后，使用跨境TRS配置海外科技标的的私募产品愈发受到资金关注。多位私募人士透露：“相关通知较为突然，部分产品策略短期可能出现一定变化，目前正在等待进一步细化的跨境TRS额度规范。” (上海证券报)", "ctime": 1782271653, "time_str": "11:27:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260624/c677672753.shtml"}, {"id": "4582631", "title": "软银集团董事长孙正义：将“建造世界上最大的数据中心”", "content": "6月24日，软银集团董事长孙正义在股东大会上被问及数据中心投资，孙正义透露，他正在与一位客户就美国俄亥俄州的一个开发计划签署谅解备忘录，并解释说，如果该计划最终敲定，“仅此一项业务就将带来巨额利润”。谈及数据中心的电力消耗，孙正义称，旗下SB能源正推进美国俄亥俄州数据中心项目，“单一设施将提供相当于10座核电站的电力”，将“建造世界上最大的数据中心”。（新浪财经）", "ctime": 1782271389, "time_str": "11:23:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260624/c677672684.shtml"}, {"id": "4582627", "title": "伊朗总统：若无弹道导弹，伊朗已成加沙", "content": "伊朗总统佩泽希齐扬23日说，导弹问题不在伊朗和美国的谈判之中，也永远不会成为议题。佩泽希齐扬当天率团访问巴基斯坦。他在与巴基斯坦总理夏巴兹共同出席记者会时说，如果伊朗没有用于自卫的导弹，“以色列和美国就会像在加沙那样袭击伊朗”，“他们（以色列和美国）不会有任何怜悯，会摧毁我们的力量”。佩泽希齐扬说：“在任何情况下，我们都不会与任何人就我们的防御能力进行谈判。”（新华社）", "ctime": 1782271298, "time_str": "11:21:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260624/c677672650.shtml"}, {"id": "4582617", "title": "中国移动董事长陈忠岳：将构建一体化算力网 布局超大规模智算中心", "content": " // 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
