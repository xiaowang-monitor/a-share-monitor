.score-bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s; }

.down { color: var(--green); }

const NEWS     = [{"id": "4547033", "title": "晶丰明源：股东晶哲瑞询价转让292.85万股", "content": "晶丰明源公告，股东海南晶哲瑞创业投资合伙企业（有限合伙）通过询价转让方式转让292.85万股，转让价格为146.55元/股。此次转让后，晶哲瑞及其一致行动人持有公司股份比例由25.08%减少至23.68%，权益变动触及5%的整数倍。本次转让不会导致公司控股股东、实际控制人发生变化。", "ctime": 1781697129, "time_str": "19:52:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260617/c677542428.shtml"}, {"id": "4547001", "title": "沃什美联储首秀要来了 市场预期美联储将按兵不动", "content": "当地时间16日，为期两天的美联储议息会议在美国首都华盛顿召开。这也是凯文·沃什就任美联储主席后、首次主持议息会议。除了当地时间17日公布的利率决议，市场也在密切关注议息会议之后的新闻发布会上，沃什就美国通胀、就业市场现状，以及经济前景做出何种表态。根据安排，当地时间17日下午，也就是北京时间18日凌晨，美联储将公布利率决议，外界普遍预期，美联储此次将按兵不动。分析人士指出，由于美伊即将签署谅解备忘录，能源价格回落、市场对通胀压力缓解抱有期待。但这也意味着，沃什将不得不在缓解通胀与降低利率的政治压力之间取得平衡。（央视财经）", "ctime": 1781696843, "time_str": "19:47:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260617/c677542305.shtml"}, {"id": "4546991", "title": "千方科技：拟以1亿元-2亿元回购公司股票", "content": "千方科技公告，拟以不低于1亿元且不超过2亿元回购公司股份，回购价格不超过12.42元/股。回购股份将用于员工持股计划或股权激励以及维护公司价值及股东权益（维护公司价值及股东权益而回购的股份将全部用于出售）。回购期限为自董事会审议通过之日起，用于员工持股计划或股权激励的股份不超过6个月，用于维护公司价值及股东权益的股份不超过3个月。", "ctime": 1781696748, "time_str": "19:45:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260617/c677542273.shtml"}, {"id": "4546989", "title": "6月17日 周三《新闻联播》要闻16条", "content": "1、习近平对常态化做好东西部协作工作作出重要指示强调 总结运用闽宁协作等有益经验 不断增强区域发展协调性 推动全体人民共同富裕迈出坚实步伐；\n2、韩正会见美国前运输部长；\n3、国务院印发《实施就业优先战略“十五五”规划》；\n4、【在希望的田野上】全国夏粮丰收成定局；\n5、中国政府发布关于全球治理的白皮书；\n6、我国荒漠化防治取得显著成效；\n7、多项金融开放举措今天发布；\n8、财政部在香港发行2026年第三期150亿元人民币国债；\n9、《外卖平台补贴行为规范十条（征求意见稿）》公开征求意见；\n10、7月1日起全国铁路实行新的列车运行图；\n11、我国成功发射卫星互联网低轨22组卫星；\n12、伊朗称第二阶段谈判将聚焦核问题及解除制裁 美称与伊朗谈判已进入第二阶段 海事情报公司称伊朗油轮驶出美军封锁线 国际油价大幅下跌；\n13、俄舰在英吉利海峡向一逼近游艇开火示警；\n14、德国机构警告依赖美AI模型存在风险；\n15、非疾控警告本轮埃博拉疫情恐严重恶化；\n16、美国加州和佛州发生林火火灾。（央视新闻）", "ctime": 1781696678, "time_str": "19:44:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260617/c677542252.shtml"}, {"id": "4546987", "title": "*ST金比：公司股票将于6月22日撤销退市风险警示", "content": "*ST金比公告，公司股票将于2026年6月18日开市起停牌1天，并于2026年6月22日开市起撤销退市风险警示并复牌。公司证券简称将由“*ST金比”变更为“金发拉比”，证券代码仍为“002762”，股票交易的日涨跌幅限制由“5%”变更为“10%”。", "ctime": 1781696614, "time_str": "19:43:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260617/c677542225.shtml"}, {"id": "4546971", "title": "金博股份：公司目前正有序推进年产500吨高导热氮化铝粉体产能建设，尚未取得订单", "content": "金博股份公告，公司股票连续3个交易日（2026年6月15日至6月17日）收盘价格涨幅偏离值累计超过30%，属于股票交易异常波动。经公司自查并向控股股东、实际控制人核实，截至公告披露日，公司无应披露而未披露的重大信息。公司关注到市场对前期发布的高纯氮化铝粉体产品关注度较高，目前正有序推进年产500吨高导热氮化铝粉体产能建设，但该产品客户导入和验证工作存在不确定性，尚未取得订单，尚未形成收入，预计对公司2026年经营业绩不构成影响。此外，公司2025年归属于母公司所有者的净利润为-12.81亿元，2026年第一季度归属于母公司所有者的净利润为-7861.36万元（未经审计），目前仍处于亏损状态。", "ctime": 1781696371, "time_str": "19:39:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260617/c677542067.shtml"}, {"id": "4546939", "title": "伊媒称3艘伊朗油轮通过霍尔木兹海峡", "content": "伊朗国家电视台当地时间今天（6月17日）报道称，搭载着约500万桶原油的3艘伊朗油轮突破美国海上封锁，已通过霍尔木兹海峡，驶向其目的地。（CCTV国际时讯）", "ctime": 1781696026, "time_str": "19:33:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260617/c677541931.shtml"}, {"id": "4546933", "title": "影石高管发声：专利诉讼期间遭遇黑水军攻击，异常账号集体涌现", "content": "影石创新（Insta360）中国区负责人袁跃发布长文，称在与某友商互诉专利侵权后，短时间内密集遭遇黑水军有组织攻击。公司发现，诉讼消息发布后24小时内，多个平台涌现1490余个异常账号，集中发布内容高度雷同的评论，且这些账号呈现出明显的批量特征，比如IP相同、主页相似、发帖时间集中、评论话术一致等。袁跃认为，车圈、数码圈的产品相关水军并不罕见，但针对尚处于司法程序中的案件发起有组织舆论攻击，则触碰了红线。“法院受理只是诉讼程序的起点，黑水军和背后黑手，却试图一步跨过立案、举证、审理和判决，直接把企业钉上‘抄袭侵权’的耻辱柱。”（新浪科技）", "ctime": 1781696016, "time_str": "19:33:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260617/c677541925.shtml"}, {"id": "4546927", "title": "央行：支持上海先行先试发展离岸金融", "content": "今天（6月17日），2026陆家嘴论坛在上海举办。记者从论坛上了解到，上海汇聚全球金融要素资源，作为国际金融中心的独特优势不断显现，将支持上海先行先试发展离岸金融，加快建设人民币资产全球配置中心和风险管理中心，提升跨境贸易投资便利化水平，进一步丰富完善包括航运保险在内的信贷、保险、债券等产品体系，推动上海国际金融中心建设实现新的突破和提升。中国人民银行行长 潘功胜：在上海自贸区开展离岸人民币外汇交易试点。为推动外汇市场的双向开放，促进在岸和离岸市场的融合，助力上海打造人民币资产全球配置中心和风险管理中心。我们将授权工行、农行、中行、建行、交行、中信等六家银行，利用中国外汇交易中心平台在上海自贸区开展离岸人民币外汇交易。未来，我们将根据试点情况，进一步推动离岸人民币外汇交易市场的发展。（央视新闻）", "ctime": 1781695966, "time_str": "19:32:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260617/c677541886.shtml"}, {"id": "4546921", "title": "瑞普生物：董事总经理徐雷完成增持50万股，占总股本0.11%", "content": "瑞普生物公告，公司董事、总经理徐雷于2026年6月16日通过大宗交易方式增持公司股票50万股，占公司总股本比例0.11%（剔除回购专用账户股份后占比同为0.11%），成交均价14元/股。出让方为持股5%以上股东梁武的一致行动人盛利娜，其同步通过大宗交易向徐雷转让所持公司股票50万股。本次转让计划实施前，徐雷持有公司股份16.48万股，占总股本0.04%；转让后持有66.48万股，占总股本0.14%。盛利娜转让前持有207.33万股，占总股本0.45%；转让后持有157.33万股，占总股本0.34%。该增持及转让计划此前已于2026年5月25日披露预披露公告，现均已实施完毕。", "ctime": 1781695908, "time_str": "19:31:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260617/c677541851.shtml"}, {"id": "4546917", "title": "奥瑞金：拟以1.5亿元-2.5亿元回购公司股份", "content": "奥瑞金公告，拟以1.5亿元-2.5亿元回购公司股份，回购价格不超过7.49元/股。回购股份将用于实施员工持股计划或股权激励。", "ctime": 1781695888, "time_str": "19:31:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260617/c677541803.shtml"}, {"id": "4546873", "title": "市场监管总局修订发布三项自行车国家标准", "content": "记者今天了解到，市场监管总局修订发布《自行车通用技术要求》《自行车装配要求》《自行车检测设备和器具技术要求》三项国家标准，分别对自行车的技术性能、装配工艺和检测设备及器具作出系统性规定，为提升我国自行车产品质量性能水平、推动产业高质量发展提供坚实标准支撑。（央视新闻）", "ctime": 1781695820, "time_str": "19:30:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260617/c677541774.shtml"}, {"id": "4546853", "title": "国际能源署：自中东战事爆发以来，经济合作与发展组织国家石油储备累计减少1.63亿桶", "content": "国际能源署17日发布最新月度石油报告说，自中东战事爆发以来，经济合作与发展组织国家石油储备累计减少1.63亿桶，降至1990年12月以来最低水平，主要原因是应急库存加速释放。报告说，美国与伊朗日前达成谅解备忘录，被视为缓和地区局势的重要进展，可能为霍尔木兹海峡重新开放以及美国解除对伊朗封锁创造条件。（新华社）", "ctime": 1781695795, "time_str": "19:29:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260617/c677541741.shtml"}, {"id": "4546839", "title": "兴森科技：子公司FCBGA封装基板项目处于市场拓展和小批量生产阶段，占公司合并报表营业收入的0.37%", "content": "兴森科技公告，公司股票于2026年6月15日至17日连续3个交易日收盘价格涨幅偏离值累计超过20%，属于股票交易异常波动。经自查并向控股股东、实际控制人核实，公司近期经营情况未发生重大变化，不存在应披露而未披露的重大事项。公司目前存在处于筹划阶段且尚未正式披露的向特定对象发行A股股票事项，以及子公司广州兴森FCBGA封装基板项目战略投资者退出方案正在协商中。公告同时披露，子公司广州兴森2025年营业收入2689.99万元（占合并报表营收0.37%），净利润-5.33亿元；FCBGA封装基板项目处于市场拓展和小批量生产阶段，全年各项投入合计6.62亿元；2025年公司应用于光模块的PCB收入不超过1.5亿元（占营收比不超过2.08%）；玻璃基板研发项目处于技术储备阶段，尚无量产订单。", "ctime": 1781695753, "time_str": "19:29:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260617/c677541728.shtml"}, {"id": "4546823", "title": "宁夏多举措加强困难高校毕业生兜底保障", "content": "根据宁夏回族自治区最新印发的《关于促进高校毕业生就业创业和服务高品质供给的实施方案》，针对困难高校毕业生，宁夏将通过强化公益性岗位兜底和社会救助、实施精准帮扶等，多措并举进行兜底保障。一方面，宁夏将延续实施城镇公益性岗位兜底安置城镇困难高校毕业生政策，优先安置2026年度困难高校毕业生，剩余岗位拓展至离校2年未就业毕业生；规范支持符合条件的防止返贫致贫家庭毕业生从事公益岗位；将符合条件的离校未就业困难毕业生按规定纳入低保、临时救助等社会救助范围。另一方面，宁夏将健全困难高校毕业生就业帮扶机制，完善“一人一策”精准帮扶台账，优先为困难高校毕业生推荐高质量就业岗位；做好高校离校未就业毕业生就业帮扶，精准提供“1131”就业服务，为困难高校毕业生发放一次性求职补贴2000元；实施“中央专项彩票公益金宏志助航计划”，组织困难高校毕业生全员参加线上线下培训1000人以上，提高困难毕业生综合素质和就业能力。（新华社）", "ctime": 1781695679, "time_str": "19:27:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260617/c677541708.shtml"}, {"id": "4546817", "title": "*ST新研：公司股票将于6月22日起撤销退市风险警示", "content": "*ST新研公告，公司股票交易自2026年6月22日开市起撤销退市风险警示，股票简称由“*ST新研”变更为“新研股份”，证券代码“300159”保持不变。公司股票交易将于2026年6月18日停牌一天，并于6月22日复牌。股票交易价格的日涨跌幅限制仍为±20%。", "ctime": 1781695527, "time_str": "19:25:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260617/c677541667.shtml"}, {"id": "4546815", "title": "韶能股份：深圳兆伟已减持公司3%股份，持股比例降至4.40%", "content": "韶能股份公告，股东深圳兆伟恒发能源有限公司此前披露拟在2026年3月26日至6月25日期间减持不超过3188.58万股（占剔除回购专户后股本的3%）。深圳兆伟于2026年3月27日、3月30日通过集中竞价累计减持1062.58万股（占总股本1%），于2026年6月3日、6月8日至9日、6月17日通过大宗交易累计减持2125.62万股（占总股本2%），合计减持3188.2万股，占总股本3.00%。减持后，深圳兆伟持股比例由7.40%降至4.40%，低于公司总股本5%，本次减持计划已实施完毕。", "ctime": 1781695487, "time_str": "19:24:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260617/c677541654.shtml"}, {"id": "4546813", "title": "*ST华闻：将于2026年6月18日停牌1个交易日", "content": "*ST华闻公告，公司股票将于2026年6月18日停牌1个交易日，预计于2026年6月22日开市起复牌。根据海口中院裁定批准的《华闻传媒投资集团股份有限公司重整计划》，公司将按照每10股转增12股的比例实施资本公积转增股本，转增后总股本将增至43.94亿股。", "ctime": 1781695463, "time_str": "19:24:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260617/c677541645.shtml"}, {"id": "4546809", "title": "乖宝宠物：拟以不超过人民币2.25亿元受让K9 Natural持有的NPFG品牌知识产权等标的资产", "content": "乖宝宠物公告，公司拟以自有资金不超过人民币2.25亿元受让K9 Natural持有的专用于在中国大陆运营“NPFG品牌”的知识产权等标的资产，交易对价包含首付款、固定尾款及浮动尾款，其中首付款及固定尾款金额合计为人民币1.25亿元的等值美元，浮动尾款待根据约定的结算终止日前的十二个月内公司就“NPFG品牌”产品在中国大陆实现的销售总额及运营利润率情况而定是否需要支付。", "ctime": 1781695448, "time_str": "19:24:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260617/c677541638.shtml"}, {"id": "4546795", "title": "联合国儿童基金会：本轮黎以冲突已致247名儿童死亡", "content": "联合国儿童基金会17日发表声明说，今年3月以来黎巴嫩和以色列的冲突已造成247名黎巴嫩儿童死亡、992名儿童受伤。声明警告，持续不断的暴力冲突对黎巴嫩儿童的影响日趋严重。声明说，受安全局势影响，许多家庭无法返回原居住地，社会基本公共服务中断，数十万儿童流离失所。据估计，黎境内有超77万名儿童正在承受暴力冲突带来的心理影响。儿基会驻黎巴嫩代表马尔科路易吉·科尔西表示，冲突导致许多儿童被迫多次搬迁，流离失所，还有一些儿童在冲突期间失去亲人，或经历创伤性事件。儿基会呼吁立即停止敌对行动，切实保护平民及关键基础设施，确保人道主义组织能够不受限制地进入受影响地区开展援助工作。国际社会需加大支持力度，帮助儿童重返校园、恢复获得基本公共服务的机会，并减轻冲突造成的长期负面影响。（新华社）", "ctime": 1781695350, "time_str": "19:22:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260617/c677541604.shtml"}, {"id": "4546791", "title": "首批中证REITs全收益指数基金获批", "content": "证监会官网6月17日信息显示，首批4只跟踪中证REITs全收益指数的公募基金产品获批。这类基金以中证REITs全收益指数为跟踪标的，是公募REITs领域首批指数基金。数据显示，截至2026年6月17日，中证REITs收益指数成份券共53只，按市值计算约1711.2亿元，占REITs数量和总市值的比重分别为60.9%和76.6%。（人民财讯）", "ctime": 1781695307, "time_str": "19:21:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260617/c677541591.shtml"}, {"id": "4546785", "title": "三峡水利：拟预挂牌转让武陵锰业100%股权", "content": "三峡水利公告，公司下属全资子公司重庆乌江实业（集团）有限公司拟在重庆市联合产权交易所将预挂牌转让其全资子公司贵州武陵锰业有限公司股权调整为100%，并增加预挂牌条件，包括乌江实业下属全资子公司重庆乌江电力有限公司所属油菜沟锰渣库扩建工程资产一并交易。截至2025年12月31日，武陵锰业资产总额6.95亿元，负债总额3.48亿元，所有者权益3.46亿元，2025年营业收入7.2亿元，净利润1490万元。截至2026年3月31日，武陵锰业资产总额6.98亿元，负债总额3.25亿元，所有者权益3.73亿元，2026年1-3月营业收入2.21亿元，净利润2630万元。", "ctime": 1781695253, "time_str": "19:20:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260617/c677541575.shtml"}, {"id": "4546781", "title": "三峡水利：终止对外投资并注销项目公司", "content": "三峡水利公告，公司决定终止重庆万州燃气发电项目的对外投资并注销项目公司。该项目原计划投资不超过12.65亿元，旨在提高万州区域电网供电保障能力。由于国内外宏观环境和政策影响，天然气指标和价格无法锁定，导致项目投资边界变化，预期经济效益较差，不具备建设条件。终止投资不会对公司生产经营及财务状况产生重大不利影响。", "ctime": 1781695247, "time_str": "19:20:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260617/c677541573.shtml"}, {"id": "4546761", "title": "俄称乌军袭击载有白俄罗斯儿童的大巴致1死7伤", "content": "俄罗斯布良斯克州代理州长叶戈尔·科瓦尔丘克17日在社交平台发文说，乌克兰武装部队当天使用无人机袭击一辆载有白俄罗斯儿童足球运动员的大巴，造成1人死亡、7人受伤，伤者中包括5名儿童。 科瓦尔丘克说，遭袭大巴从白俄罗斯戈梅利市出发驶往俄罗斯格连吉克市，途经布良斯克州时遇袭。大巴载有44名乘客，其中包括28名儿童足球运动员。 另据俄联邦侦查委员会发布通报说，伤亡人员具体情况正在进一步核实中。(新华社)", "ctime": 1781695055, "time_str": "19:17:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260617/c677541504.shtml"}, {"id": "4546753", "title": "中方决定向伊朗和黎巴嫩提供新一批人道主义援助", "content": "外交部发言人林剑17日表示，中方决定近期向伊朗和黎巴嫩提供新一批人道主义援助。林剑表示，中方对美以伊战事及其外溢在中东地区造成人道主义灾难深感痛心。今年3月，中方向伊朗等国提供了紧急人道主义援助。考虑到相关国家的实际情况，中方决定近期向伊朗和黎巴嫩提供新一批人道主义援助，进一步帮助两国民众推进恢复重建、改善经济民生。（新华社）", "ctime": 1781694985, "time_str": "19:16:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260617/c677541480.shtml"}, {"id": "4546749", "title": "美国向SandboxAQ拨款5亿美元，用于寻找新的芯片制造材料", "content": "美国政府周三向SandboxAQ拨款5亿美元，用于开发美国本土半导体制造所需的新型化学品与材料，包括PFAS（全氟和多氟烷基物质）的替代品。这笔资金属于美国总统特朗普依据芯片法案（CHIPS Act）配置科研资金的一部分。此前该计划已提供1.5亿美元投资于新型芯片制造设备，以及20亿美元投入量子运算领域。由英伟达支持的SandboxAQ，在2025年4月的估值为57.5亿美元，至今已募资超过10亿美元。", "ctime": 1781694884, "time_str": "19:14:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260617/c677541417.shtml"}, {"id": "4546737", "title": "悦安新材：多名股东及董事一致行动人拟合计减持不超1.44%股份", "content": "悦安新材公告，公司股东赣州岳龙企业管理合伙企业（有限合伙）拟于2026年7月10日至2026年10月9日，通过集中竞价减持不超过120.34万股（占总股本0.70%）；股东赣州宏悦企业管理合伙企业（有限合伙）拟同期减持不超过28.5万股（占总股本0.17%）；公司董事、总经理、核心技术人员王兵先生的一致行动人中航信托股份有限公司－中航信托·中金财富【1081】号家族信托拟同期减持不超过97.57万股（占总股本0.57%）。减持原因均为自身资金需求。", "ctime": 1781694764, "time_str": "19:12:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260617/c677541378.shtml"}, {"id": "4546731", "title": "方直科技：持股5%以上股东及董事陈克让拟减持不超过2.40%股份", "content": "方直科技公告，持股5%以上股东及董事陈克让持有公司股份2415.8万股，占总股本比例9.60%，计划在2026年7月10日至2026年10月9日期间，通过集中竞价或大宗交易方式减持不超过603.94万股，占公司总股本比例不超过2.40%，占剔除回购股份后总股本比例不超过2.41%。减持原因为个人资金需求。", "ctime": 1781694742, "time_str": "19:12:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260617/c677541367.shtml"}, {"id": "4546711", "title": "海兴电力：公司中标国家电网项目总金额约为3.12亿元", "content": "海兴电力公告，全资子公司南京海兴电网技术有限公司、宁波恒力达科技有限公司在国家电网有限公司2026年各区域第一次联合采购中中标，中标总金额约为3.12亿元，占公司2025年度营业收入的6.55%。项目包括电能计量箱、配电箱、环网柜、电力电缆等，中标后将对公司未来经营业绩产生积极影响。", "ctime": 1781694604, "time_str": "19:10:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260617/c677541298.shtml"}, {"id": "4546707", "title": "博迁新材：申请在香港联交所发行上市H股", "content": "博迁新材公告，公司已于2026年6月17日向香港联交所递交首次公开发行H股股票并在香港联交所主板上市的申请，并于同日在香港联交所网站刊登了本次发行上市的申请材料。本次发行上市尚需取得中国证券监督管理委员会、香港证监会和香港联交所等相关政府机关、监管机构、证券交易所的批准、核准或备案，该事项仍存在不确定性。", "ctime": 1781694568, "time_str": "19:09:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260617/c677541288.shtml"}, {"id": "4546705", "title": "旭光电子：向特定对象发行A股股票申请获受理", "content": "旭光电子公告，公司于2026年6月16日收到上海证券交易所出具的《关于受理成都旭光电子股份有限公司沪市主板上市公司发行证券申请的通知》。上交所对公司报送的募集说明书及相关申请文件进行了核对，认为申请文件齐备，符合法定形式，决定予以受理并依法进行审核。本次向特定对象发行A股股票事项尚需上交所审核通过，并获得中国证监会同意注册的决定后方可实施。", "ctime": 1781694556, "time_str": "19:09:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260617/c677541284.shtml"}, {"id": "4546703", "title": "旭光电子：可控核聚变相关业务占营收比重约2%，氮化铝相关产品占营收比重约7%", "content": "旭光电子公告，公司股票于2026年6月15日、16日、17日连续三个交易日以涨停价收盘，收盘价涨幅偏离值累计达到20%，构成股票交易异常波动。经公司核查，部分媒体将公司归类到“可控核聚变”“氮化铝”相关概念；2025年度，公司可控核聚变相关业务占整体营业收入比重约为2%，氮化铝相关产品占整体营业收入比重约为7%，占比较低，不会对当前经营业绩产生重大影响。公司目前生产经营正常，控股股东及实际控制人确认不存在应披露而未披露的重大事项。", "ctime": 1781694550, "time_str": "19:09:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260617/c677541283.shtml"}, {"id": "4546699", "title": "通鼎互联：与英伟达不存在任何业务关系，康宁仅作为光棒供应商采购规模有限", "content": "通鼎互联公告，公司股票于2026年6月15日、16日、17日连续三个交易日收盘价格涨幅偏离值累计超过20%，属于股票交易异常波动。经公司核实，近期某微信公众号发表《搭上英伟达，A股光纤牛股年内涨超300%》文章，公司澄清：康宁仅作为公司光纤预制棒原材料供应商，采购规模有限，不存在独家供货情形，也无其他合作关系；公司与英伟达不存在任何业务关系。公司目前经营情况正常，内外部经营环境未发生重大变化。", "ctime": 1781694532, "time_str": "19:08:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260617/c677541260.shtml"}, {"id": "4546697", "title": "美伊谅解备忘录将在瑞士一度假村签署", "content": "瑞士外交部表示，美伊谅解备忘录的签署仪式将于当地时间6月19日在瑞士比尔根山度假村举行。据了解，美国副总统万斯和伊朗议会议长卡利巴夫预计将出席签字仪式。为何此次签署仪式选在瑞士比尔根山度假村举行？中国现代国际关系研究院中东研究所副所长秦天分析指出，瑞士比尔根山度假村曾举办过很多类似的重要活动，也曾是伊核谈判的地点。此外，比尔根山度假村背后有非常强大的卡塔尔资本，这也在一定程度上反映出卡塔尔居间斡旋对弥合美伊分歧起到了非常关键的作用。（CCTV国际时讯）", "ctime": 1781694529, "time_str": "19:08:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260617/c677541251.shtml"}, {"id": "4546695", "title": "特朗普：同伊朗的谅解备忘录不是最终协议", "content": "美国总统特朗普17日表示，同伊朗的谅解备忘录不是最终协议，“如果我不满意，我们将恢复向伊朗投掷炸弹”。（新华社）", "ctime": 1781694480, "time_str": "19:08:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260617/c677541107.shtml"}, {"id": "4546689", "title": "*ST星光：公司股票将于6月22日起撤销退市风险警示", "content": "*ST星光公告，公司股票交易将于2026年6月18日开市起停牌1天，并于2026年6月22日开市起复牌。自2026年6月22日开市起撤销退市风险警示，股票简称由“*ST星光”变更为“星光股份”，股票代码仍为“002076”，股票交易日涨跌幅限制由“5%”变更为“10%”。", "ctime": 1781694451, "time_str": "19:07:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260617/c677541022.shtml"}, {"id": "4546643", "title": "美迪凯：2025年玻璃基板销售收入占营收约2.00%，TGV工艺尚未形成量产收入", "content": "美迪凯公告，公司股票于2026年6月15日、16日、17日连续三个交易日收盘价格涨幅偏离值累计达到30%，属于股票交易异常波动。经公司自查，近期资本市场对“玻璃基板”概念关注度较高，公司向客户供应的半导体用玻璃基板为未打孔基板，2025年相关产品销售收入占公司总营收比重约为2.00%，占比较低；公司开发的玻璃通孔、孔内金属化等TGV工艺尚未形成量产收入。此外，公司通过收购进入三星供应链，2025年该业务销售收入占营收比重不足2.50%，产品为手机摄像模组用软膜滤光片；功率芯片的晶圆级封测业务尚未形成量产收入。公司目前生产经营正常，控股股东及实际控制人不存在应披露而未披露的重大事项。", "ctime": 1781694219, "time_str": "19:03:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260617/c677540923.shtml"}, {"id": "4546633", "title": "中材科技：全资子公司泰山玻纤特种纤维布产品占营收2.08%，经营未发生重大变化", "content": "中材科技公告，公司股票于2026年6月15日、16日、17日连续3个交易日收盘价格涨幅偏离值累计超20%。经核实，公司全资子公司泰山玻纤生产的特种纤维布产品 // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';

  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
