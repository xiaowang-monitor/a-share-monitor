l"}, {"id": "5340923", "title": "陕西煤业：2026年9月煤炭产量1500万吨，同比增长3.02%", "content": "陕西煤业公告，2026年9月煤炭产量1500万吨，同比增长3.02%；自产煤销量1340万吨，同比增长6.18%；2026年年内累计煤炭产量1.35亿吨、自产煤销量1.24亿吨；总发电量51.55亿千瓦时，同比增长41.12%，总售电量48.68亿千瓦时，同比增长41.72%。", "ctime": 1791444923, "time_str": "15:35:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261008/c680472654.shtml"}, {"id": "5340921", "title": "汉马科技：2026年9月货车销量1320辆，同比增长8.20%", "content": "汉马科技公告，2026年9月货车（含非完整车辆）产量1348辆、销量1320辆，同比分别增长11.59%、8.20%；本年累计产量11822辆、销量11358辆，同比分别增长26.72%、20.17%。", "ctime": 1791444879, "time_str": "15:34:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261008/c680472636.shtml"}, {"id": "5340919", "title": "外交部：中方提名宋莉博士参与竞选世卫组织总干事", "content": "外交部发言人毛宁主持例行记者会。有记者就中方或提名候选人竞选世卫组织总干事一事提问。毛宁表示，世卫组织是联合国卫生健康领域的专门机构，在全球卫生治理中发挥着领导协调作用，当前多边主义受到冲击，全球卫生健康事业发展任重道远，世卫组织如何在新变局和新形势下行稳致远，总干事的作用尤为重要。中方提名宋莉博士参与竞选，体现了中方同各方携手努力，共同推动构建人类卫生健康共同体的积极意愿，表明了中方对多边主义和世卫组织的坚定支持。我们相信如果宋莉博士当选世卫组织的总干事，将有助于这一组织在提升全人类健康福祉方面发挥更为积极的作用。 (澎湃新闻)", "ctime": 1791444871, "time_str": "15:34:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261008/c680472628.shtml"}, {"id": "5340907", "title": "广州港：9月预计完成集装箱吞吐量239.6万标准箱，同比增长19.6%", "content": "广州港公告，2026年9月预计完成集装箱吞吐量239.6万标准箱，同比增长19.6%；货物吞吐量5130.5万吨，同比增长12.5%。2026年1-9月预计完成集装箱吞吐量2107.4万标准箱，同比增长4.8%；货物吞吐量4.48亿吨，同比增长3.8%。", "ctime": 1791444828, "time_str": "15:33:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261008/c680472605.shtml"}, {"id": "5340901", "title": "傲农生物：2026年9月生猪销量25.36万头，同比增长54.20%", "content": "傲农生物公告，2026年9月生猪销售量25.36万头，同比增长54.20%，较2026年8月增长21.77%；本年累计销售量170.45万头。9月末生猪存栏100.94万头，同比增长58.92%，较2026年8月末下降1.15%，较2025年12月末增长35.79%。", "ctime": 1791444799, "time_str": "15:33:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261008/c680472575.shtml"}, {"id": "5340895", "title": "外交部：再次敦促日方严惩凶犯、以儆效尤", "content": "10月8日，外交部发言人毛宁主持例行记者会。有记者问：据报道，10月1日，东京地方法院对非法侵闯中国使馆的村田晃大进行首次公开庭审。中方对此有何评论？毛宁表示，日本自卫队现役官员持刀侵闯中国驻日本使馆，向中方外交人员发出暴力威胁，是国际社会前所未闻的恶性事件，严重违反《维也纳外交关系公约》，严重威胁中方外交人员人身安全和外交馆舍安全，暴露出日本国内右翼势力猖獗、自卫队人员失管失教等诸多深层次问题。日方能否依法严肃处理，考验日本政府能否切实履行国际法义务，关系到日本的国家信誉和国际形象。我们再次敦促日方严惩凶犯、以儆效尤。（央视新闻）", "ctime": 1791444774, "time_str": "15:32:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261008/c680472563.shtml"}, {"id": "5340853", "title": "美防长登“林肯”号航母 抨击媒体负面报道", "content": "美国国防部长赫格塞思7日登上“林肯”号航母，抨击媒体对该舰的负面报道，称一些媒体把该航母描绘成“失能”“士气低落”和“任务失败”的象征，与事实不符。此前，“林肯”号航母被曝因对伊朗高强度作战节奏和恶劣生活条件导致舰员士气低落，多人精神崩溃试图跳海。该舰自2025年11月出港，直至2026年9月才在泰国靠港。五角大楼说，“林肯”号创下连续260多天不靠港的部署纪录。（新华社）", "ctime": 1791444483, "time_str": "15:28:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261008/c680472285.shtml"}, {"id": "5340823", "title": "消息称三星手机四季度最高减产30%", "content": "据韩媒报道，三星电子旗下的移动体验事业部（MX）已开始削减今年第四季度的产量，预计减产幅度高达30%。外界认为，此举原因是假日季内存芯片价格大幅上涨，导致营业利润率承压。（界面）", "ctime": 1791444186, "time_str": "15:23:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261008/c680472172.shtml"}, {"id": "5340821", "title": "多哥部长会议主席福雷将访华", "content": "外交部发言人宣布：应国务院总理李强邀请，多哥部长会议主席福雷·埃索齐姆纳·纳辛贝将于10月9日至16日对中国进行正式访问。(新华社)", "ctime": 1791444162, "time_str": "15:22:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261008/c680472165.shtml"}, {"id": "5340789", "title": "外交部阿富汗事务特使岳晓勇出席第八次阿富汗问题“莫斯科模式”会议", "content": "2026年10月5日，外交部阿富汗事务特使岳晓勇在俄罗斯出席第八次阿富汗问题“莫斯科模式”会议。其间，岳晓勇会见阿富汗外长穆塔基，并同各方参会代表广泛交流。(外交部网站)", "ctime": 1791443844, "time_str": "15:17:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261008/c680471893.shtml"}, {"id": "5340783", "title": "公司是否有TGV方面的技术储备？鸿利智汇回应", "content": "有投资者向鸿利智汇提问，在AI大背景下，公司是否会利用公司在MicroLED玻璃基板方向的技术积累向应用于PCB方向的玻璃基板拓展吗？另外公司是否有TGV方面的技术储备？10月8日，公司回答表示，公司是集研产销于一体的LED半导体封装器件企业，主要业务有LED半导体封装、Mini/MicroLED新型显示和汽车照明业务，在玻璃基板封装技术方面，公司MicroLED已形成支持P0.6-P1.2全系列玻璃基MicroLED产品封装。", "ctime": 1791443789, "time_str": "15:16:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261008/c680471871.shtml"}, {"id": "5340771", "title": "乌克兰多地紧急停电 恢复时间未定", "content": "当地时间10月8日，乌克兰国家电力公司通报称，基辅市以及基辅州、切尔尼戈夫州等多个地区于当日上午启动紧急停电措施。\n\n乌克兰能源企业DTEK表示，遵照国家电力公司指令，基辅正式实施紧急停电，常规供电排班表暂停生效，居民无法依照原有计划预判供电情况。\n\n目前，电力全面恢复时间暂未明确。(央视新闻)", "ctime": 1791443702, "time_str": "15:15:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261008/c680471837.shtml"}, {"id": "5340707", "title": "机构：成本压力转向需求端，2027年笔记本市场或面临出货、价格双重影响", "content": "根据TrendForce集邦咨询最新笔记本产业研究，2027年笔记本市场的主要风险将由供应限制转向成本上升对需求的影响。TrendForce集邦咨询目前预期2027年全球笔记本出货量将呈低个位数衰退，但若DRAM与CPU价格维持高位，品牌被迫扩大成本转嫁，导致终端售价上涨，可能进一步延长消费者换机周期，全年出货衰退幅度不排除加剧至高个位数。TrendForce集邦咨询指出，以建议售价（MSRP）900美元的主流产品来看，2026年第三季CPU、DRAM与SSD合计占笔记本BOM比重已升至约68%，显示核心零部件成本对产品定价的影响明显提高。面对成本上升，品牌若提高售价，将面临需求下滑风险；若自行吸收成本，毛利率势必承压；若通过降低存储器等规格控制BOM，则可能削弱产品竞争力。预计2027年品牌将难以同时维持价格、规格与利润率，成本转嫁的程度将成为影响需求的重要变量。", "ctime": 1791443421, "time_str": "15:10:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261008/c680471728.shtml"}, {"id": "5340687", "title": "法国总统外事顾问博纳将来华举行中法战略对话", "content": "外交部发言人宣布：法国总统外事顾问博纳将于10月9日至13日来华，同中共中央政治局委员、中央外办主任王毅举行新一轮中法战略对话。(外交部网站)", "ctime": 1791443317, "time_str": "15:08:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261008/c680471660.shtml"}, {"id": "5340677", "title": "长光华芯：大摩相关报告非正式法规，国内800G/1.6T光芯片短期内仍极度紧缺", "content": "针对摩根士丹利报告中提及的“FCC 65%”相关条款，以及今日公司股价或因此受到的影响，长光华芯证券部人士表示，该份报告是政策情景推演报告，不是正式落地的法规或条款，只是“一家之言”。其次，报告涉及的光模块及其物料为3.2T，但国内目前3.2T产业处于起步阶段，预计要到2028-2029年才规模化放量，而今明两年的主要出货产品仍为800G/1.6T，这两大速率的产品目前仍极度紧缺，短期内国内光芯片仍会快速增长。（科创板日报）", "ctime": 1791443281, "time_str": "15:08:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261008/c680471652.shtml"}, {"id": "5340595", "title": "厄瓜多尔花卉业看好对华出口前景", "content": "在日前举办的2026厄瓜多尔国际花卉展上，厄瓜多尔花卉出口商协会及多家参展企业表示，随着厄中两国经贸合作深化，中国市场展现出巨大潜力，厄鲜花出口行业正积极寻求拓展对华业务，开辟中国高端鲜花市场。 厄瓜多尔鲜花生产与出口商协会董事会主席阿德里安·莫雷亚诺表示，自2024年中厄自贸协定正式生效以来，两国间关税减让等利好政策进一步降低贸易成本，为厄瓜多尔鲜花等优质农产品进入中国市场提供了便利。“行业目前正致力于推动出口目的地多元化，并将亚洲特别是中国确定为重点开拓的新兴市场。我们希望以高品质、新颖且差异化的产品切入中国细分市场。” 近年来，中国消费者对高品质进口鲜花的需求持续增长，厄瓜多尔高山玫瑰等品种凭借茎干粗长、花头硕大、色彩鲜艳及花期长的特点，在中国高端鲜花消费圈中受到好评。 在展会现场，不少厄本土出口企业介绍针对中国市场制定的精细化策略。神秘花卉公司总经理克里斯蒂安·萨万多说，厄瓜多尔的高端玫瑰和特色夏日花卉具备国际竞争力，公司正积极寻找中国分销商与潜在合作伙伴。 据厄鲜花生产与出口商协会统计，作为全球第三大花卉出口国，厄瓜多尔2025年花卉出口额达10.45亿美元。业内人士认为，在国际运输成本上升及传统市场需求波动的背景下，厄进一步深化对华经贸合作将推动两国特色农业合作迈上新台阶。(新华社)", "ctime": 1791443054, "time_str": "15:04:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261008/c680471483.shtml"}, {"id": "5340545", "title": "欧洲主要股指开盘多数下跌", "content": "欧洲主要股指开盘多数下跌，欧洲斯托克50指数跌0.98%，英国富时100指数跌0.7%，法国CAC40指数持平，德国DAX指数跌0.77%。", "ctime": 1791442918, "time_str": "15:01:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261008/c680471399.shtml"}, {"id": "5340541", "title": "阿里巴巴蔡崇信：提升知识工作者的生产力是AI最确定的应用场景", "content": "阿里巴巴集团主席蔡崇信在意大利都灵出席国际科技与投资盛会Wave by Vento 2026期间表示，未来AI将从显性话题转为隐性基础设施。对于AI当前的能力边界，蔡崇信认为，AI擅长帮助人们“省时间”，但在帮助人们“花时间”上，尚未取得同样的突破，还有巨大的发展潜力。在他看来，提升知识工作者的生产力，是AI最确定的应用场景。他估算，相关的总潜在市场规模（TAM）约为50万亿美元。在医疗、科研等领域，AI也可以成为加速创新的工具。 （科创板日报）", "ctime": 1791442904, "time_str": "15:01:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261008/c680471398.shtml"}, {"id": "5340529", "title": "科创50ETF华夏全天成交额近85亿元", "content": "科创50ETF华夏（588000）收跌4.89%，全天成交额近85亿，为今年8月19日以来（连续30个交易日）最大单日成交额。此外，创业板ETF易方达（159915）收跌3.2%，全天成交额突破55亿。", "ctime": 1791442878, "time_str": "15:01:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261008/c680471387.shtml"}, {"id": "5340525", "title": "期货收评：地缘风险引爆能源狂潮！燃油飙涨18% 原油涨近9% 甲醇、LPG等均封涨停", "content": "期货收评：大宗商品涨跌不一，涨幅方面，燃油飙涨18%，原油大涨近9%，甲醇、LPG等均封涨停，低硫燃油、沥青等涨幅均超9%；跌幅方面，钯跌超6%，红枣跌超4%。", "ctime": 1791442878, "time_str": "15:01:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261008/c680471385.shtml"}, {"id": "5340513", "title": "A股收评：创业板指高开低走跌超3%，CPO、半导体等AI硬件股表现不佳", "content": "A股三大指数今日集体下跌，截至收盘，上证指数跌0.79%，深证成指跌2.07%，创业板指跌3.15%，北证50跌2.65%，科创50指数跌4.82%。全市场成交额16943亿元，较上日放量2442亿元，全市场超3700只个股下跌。板块题材上，油气开采及服务、电池、港口航运、煤炭开采加工、电力、化肥、银行、染料板块涨幅居前；半导体、CPO、玻璃基板、存储芯片、光纤概念股跌幅居前。盘面上，中东局势僵持，原油价格维持高位，石油天然气板块集体走高，山东墨龙尾盘涨停，中国石油、中国石化、中国海油纷纷上涨。七部门日前出台“十五五”电池规划，固态电池方向受益上涨，其中力王股份30cm涨停，领湃科技20cm涨停。银行板块同样表现积极，工商银行、中国银行、杭州银行盘中刷新历史新高。另一方面，半导体、CPO等AI硬件股表现不佳，光通信方向领跌，源杰科技、长光华芯、东山精密、沃格光电、均胜电子等股跌停，天孚通信午后跌超10%，存储芯片龙头长鑫科技盘中跌超8%。", "ctime": 1791442865, "time_str": "15:01:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261008/c680471384.shtml"}, {"id": "5340493", "title": "ETF收评：巴西ETF领涨10.02%，科创成长ETF领跌7.45%", "content": "ETF收盘涨跌不一，巴西ETF（520870）领涨10.02%，标普油气ETF（159518）涨9.99%，巴西ETF（159100）涨9.96%，科创成长ETF（589700）领跌7.45%，科创成长ETF（588020）跌7.24%，科创成长ETF（588070）跌7.2%。", "ctime": 1791442853, "time_str": "15:00:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261008/c680471379.shtml"}, {"id": "5340457", "title": "股指期货午盘收盘 主力合约全线收跌", "content": "股指期货午盘收盘，主力合约全线收跌。沪深300股指期货(IF)主力合约跌1.20%，上证50股指期货(IH)主力合约跌0.50%，中证500股指期货(IC)主力合约跌2.61%，中证1000股指期货(IM)主力合约跌2.14%。", "ctime": 1791442819, "time_str": "15:00:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261008/c680471378.shtml"}, {"id": "5340451", "title": "WTI原油涨超3%", "content": "WTI原油涨超3%，现报91.02美元/桶。", "ctime": 1791442803, "time_str": "15:00:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261008/c680471359.shtml"}, {"id": "5340449", "title": "国庆假期全国安全形势总体平稳", "content": "记者8日从应急管理部获悉，截至10月7日22时，国庆假期全国安全形势总体平稳，未发生重大以上灾害事故。假期期间，国家综合性消防救援队伍在重点部位和场所设立5096个前置执勤点，接警出动5.4万次，出动消防救援人员50.2万人次，营救疏散转移群众3500余人。国家安全生产应急救援队伍出动8100余人次，为1048家（次）企业提供风险防范和安全技术服务。国务院安委办、应急管理部节前专题部署国庆假期前后安全防范重点工作，国家防减救灾办、应急管理部会同相关部门对国庆假期全国自然灾害风险形势进行会商研判，针对性部署洪涝、地质灾害、森林草原火灾等防范应对工作。假期期间每日会商调度，派出工作组赴地方进行暗访检查，发现各类问题隐患1900余个，及时督促立行立改、强化安全管控。（新华社）", "ctime": 1791442755, "time_str": "14:59:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261008/c680471340.shtml"}, {"id": "5340437", "title": "国庆假期交通出行人数超21亿人次", "content": "记者8日从交通运输部获悉，2026年国庆假期（10月1日至7日），全社会跨区域人员流动量21.42亿人次，日均3.06亿人次，比2025年中秋国庆假期日均增长0.6%。具体来看，铁路客运量1.5187亿人次，比2025年中秋国庆假期日均水平增长12.7%；公路人员流动量（包括高速公路及普通国省道非营业性小客车人员出行量、公路营业性客运量）19.6182亿人次，比2025年中秋国庆假期日均水平下降0.3%；水路客运量1093万人次，比2025年中秋国庆假期日均水平增长7.1%；民航客运量1692万人次，与2025年中秋国庆假期日均水平基本持平。（新华社）", "ctime": 1791442597, "time_str": "14:56:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261008/c680471307.shtml"}, {"id": "5340409", "title": "英外交大臣：不接受以色列关闭英驻耶路撒冷领事馆", "content": "英国外交大臣米利班德8日说，英方已明确表示不接受以色列政府有权关闭英国驻耶路撒冷领事馆。米利班德说，英国方面在与以色列政府进行讨论后，英国驻耶路撒冷领事馆建筑不会关闭，自8日起将作为英国驻耶路撒冷使团驻地，继续提供重要服务。(新华社)", "ctime": 1791442460, "time_str": "14:54:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261008/c680471253.shtml"}, {"id": "5340371", "title": "菲律宾参议院通过法案 拟限制未成年人使用社交媒体", "content": "10月8日，菲律宾参议院三读通过一项旨在限制18岁以下未成年人使用社交媒体的法案，名为《儿童网络安全与保护法案》。该法案规定，18岁以下未成年人不得在设有年龄限制的社交媒体平台上注册、访问、使用、维护、运营或创建账户。此外，法案规定在菲律宾运营的国际社交媒体平台必须遵守该法案，并需要在菲律宾指定一名代表，与菲律宾方面合作落实该法案。若违反该法案，平台将可能面临500万至2000万比索的行政罚款。父母和监护人如果违反法案，也将面临五千至两万比索的罚款，或被要求履行社区服务。（央视新闻）", "ctime": 1791442255, "time_str": "14:50:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261008/c680471208.shtml"}, {"id": "5340343", "title": "沪深京三市成交额超1.6万亿元，较上日此时放量2601亿元", "content": "据同花顺iFinD数据，沪深京三市成交额超1.6万亿元，较上日此时放量2601亿元，预计全天成交金额约1.7万亿元。截至目前，沪市成交额7679亿元，深市成交额8206亿元，北证50成交额114亿元。", "ctime": 1791442039, "time_str": "14:47:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261008/c680471141.shtml"}, {"id": "5340335", "title": "首创期货：成本与供需共振，纯苯期价强势涨停", "content": "成本方面，美军准备重启对伊朗重大军事行动，特朗普权衡时机，行动重启时间可能落在以色列大选和美国中期选举之前。地缘局势或进一步激化，国际油价继续上涨。\n供应方面，节前国内纯苯负荷环比下降0.5个百分点，国内加氢苯负荷环比下降1.7个百分点，亚洲纯苯负荷环比提升1.1个百分点。节后华东港口库存环比增加1.5万吨。目前纯苯自身港口库存偏低，现货流通不多，且中国炼油厂陆续出现装置防御性降负，供应恢复不及预期，部分工厂担心高油价将导致更多炼厂加入减产降负中。\n需求方面，下游己二酸、CPL、苯胺、MDI开工提升，苯乙烯开工下降。\n综合看，国内纯苯供应恢复慢于预期，现货紧张，加之炼厂减产消息传闻，对纯苯期价形成较强支撑，关注纯苯开工变动及原油价格走势。（首创期货）", "ctime": 1791441984, "time_str": "14:46:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261008/c680471129.shtml"}, {"id": "5340317", "title": "上期所原油主力合约暴涨10%", "content": "上期所原油主力合约暴涨10%，报765.9元/桶。", "ctime": 1791441933, "time_str": "14:45:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261008/c680471119.shtml"}, {"id": "5340287", "title": "上期所沥青主力合约暴涨9%", "content": "上期所沥青主力合约暴涨9%，报5550元/吨。", "ctime": 1791441771, "time_str": "14:42:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261008/c680471076.shtml"}, {"id": "5340273", "title": "中证协：上半年136家券商实现盈利 盈利面超90%", "content": "近日，记者获悉，中证协向券商下发了今年上半年券业的经营情况分析。分析称，上半年，全行业150家证券公司实现营业收入3298.1亿元、净利润1386.64亿元，同比分别增长31.38%、23.50%。其中，136家券商实现盈利，盈利面超90%，亏损券商主要为投行子公司等。（人民财讯）", "ctime": 1791441659, "time_str": "14:40:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261008/c680471047.shtml"}, {"id": "5340245", "title": "首创期货：成本和低库存提振，PTA期价盘中一度涨停", "content": "供应方面，华东一条300万吨PTA装置10月初停车检修，华东另一条150万吨10月6日停车检修。节前PTA供需转弱，进入累库阶段，但PTA社会库存和码头库存绝对水平仍处于低位。随着地缘紧张原油上涨，成本端支撑强劲，且化工供应链担忧加剧，或导致PTA现货流通性维持偏紧局面。\n需求方面，节前终端负反馈已部分兑现，市场对节后银十需求存在预期。\n综合看，本月PTA供应商缩减合约供应，现货流通可控，绝对库存低位，加之成本继续抬升，预计短期PTA期价维持强势格局。关注地缘局势进展、原油价格及终端订单情况。（首创期货）", "ctime": 1791441481, "time_str": "14:38:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261008/c680471005.shtml"}, {"id": "5340233", "title": "上期所原油主力合约暴涨9%", "content": "上期所原油主力合约暴涨9%，报758.8元/桶。", "ctime": 1791441433, "time_str": "14:37:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261008/c680470993.shtml"}, {"id": "5340227", "title": "中证协：全行业平均净佣金率下降至万分之1.71", "content": "近日，记者获悉，中证协向券商下发了今年上半年券业的经营情况分析。分析称，上半年证券公司为112.74万亿元客户资产提供交易、托管服务，全行业平均代理买卖证券净佣金率下降至万分之1.71，投资者交易成本显著降低。（人民财讯）", "ctime": 1791441404, "time_str": "14:36:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261008/c680470987.shtml"}, {"id": "5340213", "title": "首创期货：节后补涨，PX期价盘中一度涨停", "content": "成本 const SECTORS  = [{"name": "金融", "hit_count": 57, "etfs": []}, {"name": "人工智能", "hit_count": 35, "etfs": []}, {"name": "半导体", "hit_count": 34, "etfs": []}, {"name": "数据要素", "hit_count": 23, "etfs": []}, {"name": "消费", "hit_count": 21, "etfs": []}, {"name": "医药", "hit_count": 9, "etfs": []}, {"name": "军工", "hit_count": 7, "etfs": []}, {"name": "机器人", "hit_count": 4, "etfs": []}];
const META     = {"update_time": "2026-10-08 15:40:24", "sentiment_score": 63.61788617886179, "agents": []};

// 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
