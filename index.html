<style>
:root {
  --bg-primary: #0a0e17;
  --bg-card: #111827;
  --bg-card-hover: #1a2332;
  --border: #1e293b;
  --text-primary: #e2e8f0;

* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Noto Sans SC', sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  min-height: 100vh;
}
.mono { font-family: 'JetBrains Mono', monospace; }
.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 20px;
  transition: all 0.2s;
}
.card:hover { background: var(--bg-card-hover); border-color: #334155; }
.badge {
  display: inline-flex; align-items: center; padding: 2px 8px;
  border-radius: 6px; font-size: 12px; font-weight: 500;
}
.badge-s { background: rgba(239,68,68,0.2); color: #ef4444; }
.badge-a { background: rgba(245,158,11,0.2); color: #f59e0b; }
.badge-b { background: rgba(59,130,246,0.2); color: #3b82f6; }
.badge-c { background: rgba(100,116,139,0.2); color: #94a3b8; }
.score-bar {
  height: 6px; border-radius: 3px; background: #1e293b; overflow: hidden;
}
.score-bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s; }
.up { color: var(--red); }
.down { color: var(--green); }
.pulse { animation: pulse 2s infinite; }
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}
.glow { box-shadow: 0 0 20px rgba(59,130,246,0.15); }
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg-primary); }
::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
</style>

      <div class="overflow-x-auto">
        <table class="w-full text-sm">

              <th class="text-left py-2 px-1">名称</th>
              <th class="text-right py-2 px-1">现价</th>
              <th class="text-right py-2 px-1">涨幅</th>
              <th class="text-right py-2 px-1">评分</th>
              <th class="py-2 px-1 text-center" style="min-width:160px">评分分布</th>
              <th class="text-right py-2 px-1">板块</th>
              <th class="text-right py-2 px-1">连涨</th>
            </tr>
          </thead>
          <tbody id="picks-table"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- 新闻流 + 交易代理 -->
<div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
  <div class="card">
    <h2 class="text-sm font-medium text-gray-400 mb-4">实时新闻流</h2>

  <div class="card">

    <div id="agent-status" class="space-y-3"></div>
  </div>
</div>

4", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260402/c675717564.shtml"}, {"id": "4178525", "title": "我国科研人员提出温和条件下费托合成制低碳烯烃的新策略", "content": "近日，中国科学院大连化学物理研究所孙剑研究员和葛庆杰研究员团队在合成气制低碳烯烃方面取得重要进展。团队提出了一种基于费托合成体系的催化新策略，实现了合成气在温和条件下向低碳烯烃的高效转化。相关成果于北京时间4月1日发表在《自然》期刊上。(新华社)", "ctime": 1775106637, "time_str": "13:10:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260402/c675717542.shtml"}, {"id": "4178481", "title": "恒宇信通应收账款增加引质疑，最新回应", "content": "4月2日早盘，恒宇信通股价出现下跌。消息面上，恒宇信通4月1日晚间发布2025年年报，市场对公司应收账款占营业收入比重持续增加存在质疑。对此，恒宇信通证券部工作人员回应记者称，2025年年报可能在一些方面存在不及投资者预期的情况，但股价受多方面因素影响。对于应收账款增加，恒宇信通证券部工作人员表示，确实存在风险，部分应收账款可能收不回来，公司也计提了坏账减值准备。应收账款占比增加，主要和客户对公司的结算存在周期性有关。客户对公司的结算有一定的流程，存在支付周期，公司只是客户结算流程中的一环。(中证金牛座)", "ctime": 1775106190, "time_str": "13:03:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260402/c675717258.shtml"}, {"id": "4178479", "title": "创业板指跌2%", "content": "创业板指跌幅扩大至2%，上证指数跌0.63%，深证成指跌1.33%。全市场超4400家个股下跌。", "ctime": 1775106165, "time_str": "13:02:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260402/c675717250.shtml"}, {"id": "4178471", "title": "能源冲击韩公共部门车辆将单双号限行", "content": "近一段时间来，中东局势紧张，能源运输要道霍尔木兹海峡通行受阻，国际能源供应受到冲击，多国政府4月1日宣布紧急应对措施。韩国政府4月1日宣布，自当地时间4月8日起，公共机关车辆限行将由原先的工作日“尾号限行”升级为更严格的“单双号限行”。马来西亚内阁会议决定自4月15日起，所有马来西亚政府部门、机构、以及政府关联公司等全面实施居家办公政策。（CCTV国际时讯）", "ctime": 1775106145, "time_str": "13:02:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260402/c675717244.shtml"}, {"id": "4178455", "title": "上证50股指期货(IH)主力合约日内跌超1%", "content": "上证50股指期货(IH)主力合约日内跌超1%，现报2827.8点。沪深300股指期货(IF)主力合约日内跌超1%，现报4399.0点。", "ctime": 1775106071, "time_str": "13:01:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260402/c675717224.shtml"}, {"id": "4178427", "title": "大众汽车与大众汽车（安徽）、一汽-大众签署经销商网络战略合作备忘录", "content": "4月2日，大众汽车（中国）、大众汽车（安徽）数字化销售服务有限公司与一汽-大众签署经销商网络战略合作备忘录。双方将在一汽-大众部分经销商推出“店中店”模式，展示和销售大众汽车（安徽）最新的新能源车型，与众08将成为双方合作的首款车型。ID.与众品类的另一款车长5米的轿车将于今年下半年上市并开展类似合作。（界面新闻）", "ctime": 1775105958, "time_str": "12:59:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260402/c675717199.shtml"}, {"id": "4178423", "title": "英媒：欧洲国家曾被特朗普威胁加入“霍尔木兹联盟”", "content": "据英国媒体4月1日报道，美国总统特朗普曾向欧洲国家施压，要求他们加入所谓“霍尔木兹联盟”以管控霍尔木兹海峡，否则将停止向乌克兰提供武器。 英国《金融时报》援引相关人士的话说，特朗普3月曾要求北约国家海军协助重新打开霍尔木兹海峡，但遭欧洲多国拒绝，特朗普对此回应称将停止向“乌克兰优先需求清单”机制提供物资。该机制由部分北约欧洲成员国出资，向美国购买武器援助乌克兰。 据报道，当时在北约秘书长吕特敦促下，一些主要北约成员国于3月19日匆忙发表了一份联合声明，称愿为确保霍尔木兹海峡通航安全作出“适当努力”。 报道援引知情人士的话说，吕特之所以坚持要发表联合声明，是因特朗普威胁对“乌克兰优先需求清单”断供，欧洲拒绝提供帮助令特朗普“歇斯底里”。 4月1日，英国《每日电讯报》刊载对特朗普的专访文章写道，在北约盟友拒绝帮助打击伊朗后，特朗普正“认真考虑”让美国退出北约。报道称，特朗普对北约盟国未参与打击伊朗、不愿保障霍尔木兹海峡通航深表不满，称这“难以置信”。(新华社)", "ctime": 1775105837, "time_str": "12:57:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260402/c675717158.shtml"}, {"id": "4178419", "title": "港仔机器人与NVTHK订立战略合作协议 共同开发机器人RWA融资商业模式", "content": "港仔机器人在港交所公告，4月2日，公司与NVTHK Limited（简称“NVTHK”）订立一项战略合作协议。根据协议约定，公司与NVTHK共同开发和实施以机器人为重点的RWA（真实世界资产）融资商业模式，主要侧重于机器人RWA的发行、分销和市场开发。董事会认为，该协议项下的潜在合作如能落实，将令公司能够快速创建一个全面的机器人RWA平台，为公司拥有的机器人资产，集团客户及其他第三方拥有的机器人及机器人资产提供RWA代币化服务。", "ctime": 1775105626, "time_str": "12:53:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260402/c675717109.shtml"}, {"id": "4178415", "title": "四川：到2027年底在全省范围内建成205万个充电设施", "content": "四川省发展和改革委员会等部门印发《四川省电动汽车充电设施服务能力倍增行动方案》。行动方案提出，加快健全充电网络、完善充电结构、提升充电效能、优化服务品质、创新产业生态，进一步提振消费信心，促进电动汽车更大范围内购置使用。到2027年底，在全省范围内建成205万个充电设施，提供超过1700万千瓦的公共充电容量，基本建成布局均衡、结构合理、普惠共享、智慧创新的高质量充电设施体系，满足400万辆电动汽车充电需求，实现充电服务能力翻倍增长。（人民财讯）", "ctime": 1775105541, "time_str": "12:52:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260402/c675717087.shtml"}, {"id": "4178413", "title": "北上广深二手房成交集体井喷 喜提“小阳春”", "content": "一线城市房地产市场，在今年3月份迎来楼市“小阳春”。数据显示，广州二手住宅网签套数破万套，环比大增141.38%；深圳一二手商品房合计成交11851套，环比上升117.1%；北京二手住宅成交3月共19886套，环比上升144.63%，创近15个月来最高峰值；上海二手房累计网签量达3.13万套，创2021年3月以来近五年的最高纪录。（南方日报）", "ctime": 1775105337, "time_str": "12:48:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260402/c675717044.shtml"}, {"id": "4178407", "title": "王毅同巴林外交大臣扎耶尼通电话", "content": "2026年4月2日，中共中央政治局委员、外交部长王毅应约同海湾合作委员会轮值主席、巴林外交大臣扎耶尼通电话。\n扎耶尼介绍了中东局势最新进展和巴方立场，表示当前海湾国家安全面临严峻挑战，霍尔木兹海峡航行受阻，巴方愿通过联合国安理会发挥作用，解决海峡通航问题。巴方希同中方加强沟通协调。\n王毅阐明了中方反对侵略、倡导和平的原则立场。表示中国和巴基斯坦最近发表恢复海湾和中东地区和平稳定五点倡议，其中就包含呼吁停止对平民和非军事目标攻击、确保霍尔木兹海峡安全、恢复正常通航等内容。停火止战是国际社会共同呼声。联合国安理会的行动应有助于缓和局势，止战复谈，而不能为非法战争行为背书，更不能火上浇油。中国作为安理会常任理事国和负责任大国，愿同巴方一道推动平息战火、恢复和平，实现地区持久稳定，维护全球南方国家尤其是中小国家的正当权益。(外交部网站)", "ctime": 1775105150, "time_str": "12:45:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260402/c675717002.shtml"}, {"id": "4178399", "title": "以军称监测到伊朗四次对以袭击", "content": "当地时间今天（4月2日）上午，以色列国防军称，再次监测到伊朗方面发动的导弹袭击，目前尚未有人员伤亡或财产损失报告。这也是当天伊朗方面发动的第四次袭击。以军称，本次发射的少数导弹中有一枚携带集束弹头。(CCTV国际时讯)", "ctime": 1775104893, "time_str": "12:41:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260402/c675716886.shtml"}, {"id": "4178397", "title": "飞天茅台原箱批价涨至1730元/瓶 i茅台再度“收紧”抢购规则", "content": "“易茅时价”披露的批发参考价显示，近日2026年飞天茅台原箱价格已多日上涨，今日报1730元/瓶。与此同时，贵州茅台官方自营平台——i茅台再度“收紧”抢购规则，每人每天限购1单。即每人每天仅一次抢购资格，单次可购1-6瓶，完成1次下单后当日无法再抢购。注：今年1月初i茅台上线飞天茅台时，每人每天累计限购12瓶；1月4日起，改为每人每天累计限购6瓶，可分多次下单。（财联社）", "ctime": // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
