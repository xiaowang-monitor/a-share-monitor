<style>
:root {
  --bg-primary: #0a0e17;
  --bg-card: #111827;

* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Noto Sans SC', sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  min-height: 100vh;
}
.mono { font-family: 'JetBrains Mono', monospace; }
.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 20px;
  transition: all 0.2s;
}
.card:hover { background: var(--bg-card-hover); border-color: #334155; }
.badge {
  display: inline-flex; align-items: center; padding: 2px 8px;
  border-radius: 6px; font-size: 12px; font-weight: 500;
}
.badge-s { background: rgba(239,68,68,0.2); color: #ef4444; }
.badge-a { background: rgba(245,158,11,0.2); color: #f59e0b; }
.badge-b { background: rgba(59,130,246,0.2); color: #3b82f6; }
.badge-c { background: rgba(100,116,139,0.2); color: #94a3b8; }
.score-bar {
  height: 6px; border-radius: 3px; background: #1e293b; overflow: hidden;
}
.score-bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s; }
.up { color: var(--red); }
.down { color: var(--green); }
.pulse { animation: pulse 2s infinite; }
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}
.glow { box-shadow: 0 0 20px rgba(59,130,246,0.15); }
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg-primary); }
::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
</style>

  <!-- 中列: 精选个股 -->

              <th class="text-left py-2 px-1">名称</th>
              <th class="text-right py-2 px-1">现价</th>
              <th class="text-right py-2 px-1">涨幅</th>
              <th class="text-right py-2 px-1">评分</th>

              <th class="text-right py-2 px-1">板块</th>
              <th class="text-right py-2 px-1">连涨</th>
            </tr>
          </thead>
          <tbody id="picks-table"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- 新闻流 + 交易代理 -->
<div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
  <div class="card">

  <div class="card">

  </div>
</div>

is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260513/c676651819.shtml"}, {"id": "4356341", "title": "日本尼得科公司承认部分产品“疑似”存在质量问题", "content": "日本大型电机制造企业尼得科公司13日说，已发现部分产品“疑似”存在质量问题，包括未经客户批准擅自更改材料、工艺和设计。据共同社报道，这家总部设在京都的企业表示，正考虑成立由外部专家组成的调查委员会以查明此事，并补充道：“目前尚未发现会立即影响产品功能或安全性的问题。”日本媒体12日报道，尼得科公司存在质量违规问题，涉及电机零部件设计变更、检测数据篡改等，相关问题或超过1000项。尼得科公司此前被披露过财务造假问题。此次曝出的质量问题可能会再次引发外界对其公司管理的质疑。据知情人士透露，这些疑似质量问题是在调查财务造假问题期间发现的。尼得科于2025年9月成立第三方委员会调查财务造假问题，这一丑闻还引发尼得科高层人事变动。（新华社）", "ctime": 1778646831, "time_str": "12:33:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260513/c676651778.shtml"}, {"id": "4356329", "title": "大疆销售回应Pocket3降价", "content": "5月13日，大疆官方商城上线多款产品的优惠活动，包括Osmo Pocket 3、Osmo Action 6、DJI Air 3S等产品。其中，此前一度断货的人气手持相机Osmo Pocket 3再降500元，售价2299元起。 5月13日，就Pocket 3的优惠活动致电多家大疆门店，销售人员均表示当天起该机型的价格再下调500元，标准版由此前的2799元降至2299元，全能套装由3599元降至3099元。但此前发布的新一代手持相机Pocket 4并不参与此次优惠活动，“Pocket 4目前一直都没有现货，而且比较火爆，做活动的可能性很小。”", "ctime": 1778646773, "time_str": "12:32:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260513/c676651763.shtml"}, {"id": "4356307", "title": "日本北海道东部雌阿寒岳火山性地震增加", "content": "日本气象厅13日发布消息称，北海道东部的雌阿寒岳火山性地震正在增加，若今后火山活动进一步增强，可能会将喷火警戒级别从目前的2级上调至3级，并实施登山限制。截至13日上午10时，过去24小时内已观测到127次火山性地震，但目前尚未发生火山性微动。此外，11日进行的空中观测显示，与去年9月观测时相比，火口温度持续维持在较高状态。日本的火山“喷火警戒级别”最高为5级，5级要求立即避难。（央视新闻）", "ctime": 1778646561, "time_str": "12:29:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260513/c676651721.shtml"}, {"id": "4356305", "title": "南非将生产新型抗艾仿制药", "content": "国际卫生组织“国际药品采购机制”12日宣布，将选定一家南非实验室生产新型防治艾滋病药物来那帕韦的仿制药，作为非洲迈向实现医疗主权的“重要一步”。\n\n来那帕韦由美国吉利德科学公司研发，是一种注射用艾滋病毒暴露前预防药物，患者每年仅需两次给药，与传统的每日口服治疗方案相比，治疗流程大幅简化。临床研究报告显示，来那帕韦可大幅降低艾滋病病毒传播风险。(央视新闻)", "ctime": 1778646539, "time_str": "12:28:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260513/c676651713.shtml"}, {"id": "4356303", "title": "百度智能云：昆仑芯完成文心5.1重要版本训练 天池256卡超节点6月正式上市", "content": "在Create 2026百度AI开发者大会上，百度集团执行副总裁、百度智能云事业群总裁沈抖披露，目前昆仑芯P800已完成规模化验证，2025年至今已交付多个万卡集群。在昆仑芯全国产集群上，已成功完成对文心5.1重要版本的训练。此外，基于昆仑芯的天池256卡超节点已经在上个月点亮，将于6月正式上市，吞吐性能较上一代提升25%，并完成包含文心、DeepSeek、GLM、MiniMax等主流模型的适配，推理效率提升50%，支持按需搭建数十万卡乃至百万卡超大集群。（科创板日报）", "ctime": 1778646194, "time_str": "12:23:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260513/c676651666.shtml"}, {"id": "4356301", "title": "番茄小说2026年计划投入20亿元用于版权激励、IP孵化与创作者扶持", "content": "记者了解到，2026年，番茄小说计划投入20亿元用于优质版权激励、IP孵化与创作者扶持；推出短剧专项计划，对优质短剧改编版权给予最高单书60万元奖励。同时联合抖音短剧版权中心发起首届短剧IP联合征文，设置多重现金奖励与千万级版权激励；同步落地百万IP护航计划，以最高200万元版权保底扶持头部优质作者。番茄小说总编辑谢思鹏表示，番茄小说正在跳出单部作品爆红的短期逻辑，通过系列化开发、多体裁布局、扶持政策多重举措，推动IP从单点爆款升级为具备长期价值的资产。(科创板日报)", "ctime": 1778646182, "time_str": "12:23:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260513/c676651664.shtml"}, {"id": "4356285", "title": "德国官员：期待中国车企来德合作生产汽车", "content": "德国萨克森州经济部长迪尔克·潘特日前表示，在德国汽车产业面临转型压力之际，应以更务实态度看待与中国汽车制造商的合作，可通过合资等形式引入中国合作伙伴参与该州汽车工厂生产。\n\n位于德国东部的萨克森州是该国重要汽车产业基地，大众汽车、宝马、保时捷等车企均在当地设有生产设施。潘特在萨克森州经济部11日发表的声明中提到，大众汽车与中国制造商建立合资企业是一种可行方案，期待中方企业在萨克森州生产汽车。(新华社)", "ctime": 1778645725, "time_str": "12:15:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260513/c676651480.shtml"}, {"id": "4356281", "title": "5月13日午间公告一览：名创优品预计一季度经营利润同比增加约113%至116%", "content": "名创优品在港交所公告，基于对截至2026年3月31日止季度的未经审计综合管理账目的初步审阅及评估，预计本集团将录得收入约人民币5,678百万元至人民币5,728百万元，同比增加约28%至29%；经营利润约人民币1,511百万元至人民币1,531百万元，同比增加约113%至116%；及期内利润约人民币1,228百万元至人民币1,248百万元，同比增加约195%至200%。\n科伦药业公告，控股子公司四川科伦博泰生物医药股份有限公司已收到国家药品监督管理局(NMPA)药品审评中心(CDE)同意程序性细胞死亡蛋白-1(PD-1)x血管内皮生长因子(VEGF)双特异性抗体SKB118(亦称CR-001)新药临床试验(IND)申请的临床试验通知书，用于治疗晚期实体瘤。", "ctime": 1778645527, "time_str": "12:12:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260513/c676651447.shtml"}, {"id": "4356263", "title": "韩国综指涨幅扩大至2% 此前一度跌超3%", "content": "韩国综指涨幅扩大至2%，现报7799.63点，此前一度跌超3%。", "ctime": 1778645067, "time_str": "12:04:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260513/c676651343.shtml"}, {"id": "4356261", "title": "沙特被曝3月曾对伊朗发动多次“报复性”空袭", "content": "据英国方面12日消息，有匿名西方官员和伊朗官员称，沙特阿拉伯为报复美以伊战事期间在该国境内发生的袭击事件，对伊朗发动了多次未公开的空袭。据悉，由沙特空军发起的袭击发生在3月下旬。据披露，伊朗官员表示，沙特已向伊朗通报了这些袭击，随后双方展开了密集的外交接触，并同意缓和局势，以防止紧张局势进一步升级。针对这一消息，沙特和伊朗官方都没有作出回应。（央视新闻）", "ctime": 1778645033, "time_str": "12:03:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260513/c676651338.shtml"}, {"id": "4356237", "title": "港股午评：恒生指数涨0.26%，恒生科技指数涨0.52%", "content": "港股午间收盘，恒生指数涨0.26%，恒生科技指数涨0.52%。恒指港股通ETF银华（159318）跌0.22%，港股通科技ETF鹏华（159751）跌0.42%。板块方面，居家用品、海上运输板块涨幅靠前；酒店和度假村REIT、个人护理用品板块跌幅靠前。个股方面，剂泰科技-P涨146.86%，英派药业-B涨117.71%，京西国际涨17.89%，大族数控涨16.76%，时代电气涨15.86%；中国星集团跌17.12%，国富量子跌10.67%，轩竹生物-B跌9.09%，泽景股份跌8.54%，英矽智能跌7.54%。", "ctime": 1778644879, "time_str": "12:01:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260513/c676651305.shtml"}, {"id": "4356231", "title": "阿根廷近日发现的汉坦病毒感染者确认感染安第斯病毒", "content": "阿根廷国家实验室与卫生研究所管理局卡洛斯·马尔夫兰研究所12日表示，此前在该国南部著名旅游城市圣卡洛斯-德巴里洛切（巴里洛切）确诊的汉坦病毒感染者感染的是安第斯病毒。安第斯病毒是汉坦病毒“家族”成员，具有一定的人际传播能力，但传染需通过非常密切的接触才会发生，因此不太容易在人群中形成持续传播。（新华社）", "ctime": 1778644847, "time_str": "12:00:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260513/c676651302.shtml"}, {"id": "4356227", "title": "科伦药业：子公司SKB118新药临床试验申请获国家药监局批准", .10jqka.com.cn/20260513/c676650270.shtml"}, {"id": "4356025", "title": "泡泡玛特：不以传统模式推动家电业务", "content": "泡泡玛特管理层在5月13日举行的电话会上表示，今年推出的小家电产品在整体收入中占比极低。泡泡玛特家电业务处于极早期阶段，公司不以传统家电的模式推动该业务，未来将把小家电和生活方式、IP以及潮流玩具文化结合，把小家电打造成重要的补充品类。（人民财讯）", "ctime": 1778641949, "time_str": "11:12:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260513/c676650237.shtml"}, {"id": "4356019", "title": "马克龙称法国汉坦病毒局面得到“控制”", "content": "法国总统马克龙12日表示，政府已经“控制”了汉坦病毒局面。此前，一艘邮轮上的一场罕见疫情暴发引发了全球健康恐慌。马克龙在内罗毕举行的新闻发布会上说，法国已经根据专家建议制定了“极其严格的方案”，并呼吁欧洲与世界卫生组织进行强有力的协调。他强调，政府“作出了正确的决定，多亏了我们的医护人员，形势在政府主导下得到了控制”。总统还鼓励保持“动员、警惕和高标准”，同时警告不要把当前局面与新冠肺炎疫情进行比较，称汉坦病毒是一种“已知病毒”，不同于曾导致全球大流行的新冠病毒。（参考消息）", "ctime": 1778641794, "time_str": "11:09:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260513/c676650194.shtml"}, {"id": "4356007", "title": "1至4月全国铁路完成固定资产投资2008亿元", "content": "今年1至4月，铁路建设优质高效推进，全国铁路完成固定资产投资2008亿元，同比增长3.2%。（中国铁路）", "ctime": 1778641592, "time_str": "11:06:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260513/c676650113.shtml"}, {"id": "4355995", "title": "泡泡玛特今年下半年将围绕LABUBU推出两大新产品", "content": "泡泡玛特管理层在5月13日举行的电话会上表示，将通过优质的产品和丰富的内容，进一步挖掘LABUBU IP的商业价值。例如，LABUBU大电影正处于剧本创作阶段，电影有望加深消费者和LABUBU的情感连接；泡泡玛特乐园区域可以沉浸式感受LABUBU家族及背后故事；等等。今年下半年泡泡玛特将围绕LABUBU推出两大新产品。（人民财讯）", "ctime": 1778641423, "time_str": "11:03:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260513/c676650068.shtml"}, {"id": "4355977", "title": "英国将派军舰、战斗机等参与霍尔木兹海峡护航行动", "content": "英国国防部12日发表声明说，英国将派遣军舰、战斗机以及无人扫雷设备和反无人机系统，参与霍尔木兹海峡多国护航行动。 英国国防大臣约翰·希利当天在一个有40多个国家代表参加的线上防长会议后公布了这一计划。英国国防部表示，英国将为相关任务新增1.15亿英镑（约合10.57亿元人民币）资金，用于无人扫雷设备和反无人机系统。 根据计划，具备实战经验的“台风”战斗机将执行空中巡逻任务，扫雷专家也将参与相关行动。英国“龙”号驱逐舰正在前往中东，以备参加行动，其搭载的“海毒蛇”防空系统具备反无人 // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

        <p class="text-xs text-gray-500 mono">${item.symbol}</p>

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
