, "time_str": "17:09:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260513/c676661423.shtml"}, {"id": "4358241", "title": "海大集团：副总裁黄志健增持金额2199.53万元", "content": "海大集团公告，副总裁兼董事会秘书黄志健于2026年5月13日以集中竞价方式增持公司股份48.82万股，占总股本0.0297%，成交均价45.05元/股，增持金额2199.53万元。增持前持股41.22万股，占比0.0251%；增持后持股90.04万股，占比0.0547%。暂无后续增持计划。", "ctime": 1778663371, "time_str": "17:09:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260513/c676661417.shtml"}, {"id": "4358237", "title": "Gaming And Leisure美股盘前跌超12%", "content": "Gaming And Leisure美股盘前跌超12%，现报41.672美元。", "ctime": 1778663329, "time_str": "17:08:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260513/c676661403.shtml"}, {"id": "4358229", "title": "市场监管总局：清理地方标准 打通市场流通堵点", "content": "从市场监管总局发布会了解到，将开展地方标准清理规范，通过清理整合一批与全国统一大市场建设原则冲突、与国家标准交叉重复、超范围制定、技术内容低于强制性标准要求，以及实施效果不佳等地方标准，着力消除由地方标准造成的市场流通卡点堵点，破除制约全国统一大市场建设的标准障碍，切实形成国家统一规则和地方特色补充的良好格局。一是全面梳理排查。组织31个省（区、市）对存量的省级、市级地方标准开展全面梳理，分领域分批次逐项提出清理意见，按照完成一批、上报一批原则，及时在地方标准信息服务平台填报清理意见。二是开展技术评估。组织国家标准技术审评中心对各地提供的清理意见开展技术评估，提供反馈意见。各地根据反馈意见，会同有关部门、设区的市确定最终清理结论，力争到2026年底，废止、整合一批地方标准，基本消除地方标准造成的潜在市场分割和地方保护。三是加强工作指导。将会同国务院有关部门加强统筹指导，强化地方和部门工作联动，处理好国家层面标准和地方标准的关系。推动地方标准向国家标准提升转化，定期梳理评估地方标准备案情况、征集地方标准升级为国家标准的需求建议，对于多地共性需求的地方标准，比如：养老托育、快递物流等这些大家关心的服务业重点领域，将地方成熟技术、管理经验、创新实践评估后，形成地方标准升级为国家标准的建议清单。四是加强总结提炼。（央视新闻）", "ctime": 1778663191, "time_str": "17:06:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260513/c676661328.shtml"}, {"id": "4358227", "title": "北京出台场景培育开放应用新方案，聚焦5大领域18个场景", "content": "记者今日获悉，北京市发展改革委，北京市科委、中关村管委会等部门联合制定了《北京市加快推动场景培育和开放应用工作方案》，系统推动场景培育开放应用，加速更多新技术、新产品、新业态在北京率先应用推广，因地制宜培育发展新质生产力。《工作方案》围绕建设北京特色现代化产业体系、扩大内需、城市治理、公共服务、首都安全等提出5方面18个场景建设领域，包括数字经济、绿色经济、智能制造、生产性服务业、现代农业等。此外，还提出4方面15条重点任务，包括强化场景供给、供需对接、政策协同和改革创新等。到2028年，力争打造15个以上国家层面标志性重大应用场景、100个以上市级示范应用场景，推动200项以上新技术新产品在实际场景落地应用。（央视新闻）", "ctime": 1778663122, "time_str": "17:05:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260513/c676661263.shtml"}, {"id": "4358223", "title": "市场监管总局：严查算法违规乱象 规范市场竞争秩序", "content": "从市场监管总局发布会了解到，市场监管总局将部署开展反不正当竞争专项执法。聚焦平台经济、民生、科技创新等重点领域，统筹运用各类反不正当竞争措施，综合整治“内卷式”竞争，推动形成优质优价、良性竞争市场秩序。一是持续推进高效能执法。专项执法期间，市场监管总局将提升网络不正当竞争行为常态化监管水平，坚决规制利用数据和算法、技术、平台规则等实施的各类网络不正当竞争行为，依法保护经营者、消费者，特别是平台各方参与主体的合法权益；围绕打击社会关注度高、群众反映强烈的各类不正当竞争行为，开展全链条执法、穿透式监管，切实维护公平竞争市场环境。二是着力强化商业秘密保护。一方面加强商业秘密侵权案件查办力度，保护企业创新成果；另一方面，加强事前保护，持续完善商业秘密保护规则体系，研究制定重点领域保护标准，完善新兴产业保护指引，探索建立商业秘密管理体系认证制度。持续开展商业秘密保护创新试点工作，举办商业秘密保护月主题活动，指导重点企业、重点产业加强自我保护意识和能力，防范泄密风险，有效激发企业创新活力。三是深化宣传倡导。加强法律宣传解读，培育公平竞争文化。适时曝光典型案例，加大以案释法、以案促改、以案促治力度。压实平台主体责任，督促指导平台经营者遵守反不正当竞争法等法律法规要求，自身合规经营的同时，引导和规范平台内经营者依法公平竞争。鼓励行业组织、依托新闻媒体加强社会监督，共同构建社会共治格局。（央视新闻）", "ctime": 1778663092, "time_str": "17:04:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260513/c676661249.shtml"}, {"id": "4358221", "title": "市场监管总局：开展破除妨碍统一市场和公平竞争卡点堵点专项行动", "content": "记者今天（13日）从市场监管总局发布会了解到，市场监管总局部署开展破除妨碍统一市场和公平竞争卡点堵点专项行动，时间自5月持续至12月。专项行动紧盯妨碍企业公平准入与自主经营、限制商品要素自由流动、资质认定内外有别、不当实施信用评价设置招投标隐性壁垒4类堵点，进一步加大执法、审查、抽查力度，依法从严纠治不当干预市场竞争问题。到年底，依法查办一批重大案件，推动废除和修改一批妨碍全国统一市场和公平竞争的政策措施，公开曝光一批典型案例，加快出台一批制度机制，推动公平竞争、质量标准等市场基础制度更加科学完备，地方政府经济促进行为更加规范有序，市场监管执法更加公平公正，市场环境更加透明可预期。 (央视新闻)", "ctime": 1778663046, "time_str": "17:04:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260513/c676661236.shtml"}, {"id": "4358209", "title": "市场监管总局：推动价格法等多部法律法规修订", "content": "今天从市场监管总局发布会了解到，目前，市场监管总局正在积极推动《中华人民共和国价格法》《中华人民共和国计量法》《中华人民共和国认证认可条例》《中华人民共和国工业产品生产许可证管理条例》的修订，通过完善反垄断、反不正当竞争、价格、标准、质量监管等领域的法律法规，为纵深推进全国统一大市场建设提供法律支撑。与此同时，《市场监督管理行政处罚裁量规定》正在抓紧制定中，指导地方进一步优化裁量权基准，促进严格规范公正文明执法。同时继续梳理基层执法难点问题，起草《市场监督管理若干法律疑难问题指引（二）》，以基层执法堵点的破解，助力破除妨碍统一大市场的卡点。（央视新闻）", "ctime": 1778662972, "time_str": "17:02:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260513/c676661200.shtml"}, {"id": "4358203", "title": "宁波建工：中标价9.45亿元项目", "content": "宁波建工公告，全资子公司建工建乐为宁波市东部新城核心区以东片区A6#区块A6-2#地块项目（施工）中标单位。项目总用地面积44267平方米，总建筑面积约17.13万平方米。中标价为9.45亿元，工期为1050日历天。", "ctime": 1778662948, "time_str": "17:02:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260513/c676661180.shtml"}, {"id": "4358199", "title": "特发服务：股东银坤公司未实施3%减持计划", "content": "特发服务公告，股东新余市银坤企业管理股份有限公司原计划于2026年2月13日至2026年5月12日通过集中竞价和大宗交易方式减持不超过507万股，占公司总股本的3%；截至公告披露日，减持期限已届满，银坤公司未实施减持，仍持有公司股份1140.75万股，持股比例6.75%。", "ctime": 1778662900, "time_str": "17:01:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260513/c676661158.shtml"}, {"id": "4358187", "title": "泰格医药：拟使用不超过人民币10亿元回购公司股份", "content": "泰格医药公告，拟使用自有资金或自筹资金以集中竞价交易或其他法律法规允许的方式回购部分公司A股股份，用于后期实施A股股权激励计划或A股员工持股计划，以及减少公司注册资本。回购资金总额不低于人民币5亿元且不超过人民币10亿元；回购价格不超过人民币60元/股（含60.00元/股）；预计回购数量为833.33万股至1666.67万股，占公司当前总股本的0.97%至1.94%。", "ctime": 1778662849, "time_str": "17:00:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260513/c676661135.shtml"}, {"id": "4358181", "title": "森泰股份：控股股东唐道远、张勇、王斌拟增持600万至1200万", "content": "森泰股份公告，公司控股股东、实际控制人唐道远、张勇、王斌计划自公告披露之日起6个月内，通过深交所集中竞价以自有资金增持公司股份，拟增持金额合计600万元至1200万元，其中唐道远400万元至800万元，张勇100万元至200万元，王斌100万元至200万元，增持期间及法定期限内不减持所持股份。", "ctime": 1778662835, "time_str": "17:00:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260513/c676661101.shtml"}, {"id": "4358179", "title" // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}

  return '#64748b';

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
