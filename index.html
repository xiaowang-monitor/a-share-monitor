"当地时间11月23日，联合国世界粮食计划署警告称，霍尔木兹海峡、曼德海峡和黑海三大关键贸易通道持续受阻，正推高全球粮食、能源及运输成本，加剧粮食安全危机。目前全球约2.66亿人面临严重粮食不安全问题。世界粮食计划署执行主任林德伯格当天向联合国安理会通报称，全球约30%的化肥供应经由霍尔木兹海峡运输，贸易通道受阻叠加地区冲突和极端气候事件，正在影响农业生产和粮食供应。数据显示，今年以来国际小麦价格已上涨近10%。截至10月中旬，经博斯普鲁斯海峡运输小麦和玉米的船舶数量较去年同期减少63%，可能导致约1000万吨俄罗斯和乌克兰小麦无法进入全球市场。世界粮食计划署指出，粮食、燃料和运输成本上涨也在挤压人道主义援助资金。如果当前局势持续，到2027年年中，该机构预计将额外承担约7.27亿美元成本，可能导致约730万人面临粮食援助中断风险。（央视新闻）", "ctime": 1795531068, "time_str": "22:37:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261124/c682171994.shtml"}, {"id": "5750001", "title": "费城半导体指数跌幅扩大至6%", "content": "费城半导体指数盘初跌幅扩大至6%，AMD跌超9%，美光科技跌超8%，COHERENT跌超6%，英伟达、英特尔跌超5%，博通跌超3%，台积电跌超2%。", "ctime": 1795531050, "time_str": "22:37:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261124/c682171992.shtml"}, {"id": "5749929", "title": "上期所沪锌主力合约跌超2%", "content": "上期所沪锌主力合约跌超2%，报23550元/吨。", "ctime": 1795530774, "time_str": "22:32:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261124/c682171947.shtml"}, {"id": "5749875", "title": "美股开盘：美股三大指数集体低开", "content": "美股三大指数集体低开，标普500指数跌1.1%，道指跌0.55%，纳指跌1.5%。大型科技股方面，亚马逊跌1.28%，英伟达跌3.43%，超威半导体跌6.50%。中概股方面，小鹏集团涨2.48%，京东跌1.58%，理想汽车跌1.96%，携程跌2.48%，拼多多跌2.57%，阿里巴巴跌2.65%，蔚来跌2.72%，网易跌2.73%，哔哩哔哩跌6.01%。", "ctime": 1795530683, "time_str": "22:31:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261124/c682171934.shtml"}, {"id": "5749821", "title": "联合国机构呼吁提高艾滋病防治服务可及性", "content": "总部位于日内瓦的联合国艾滋病规划署24日发布题为《终结艾滋病始于可及性》的世界艾滋病日报告，呼吁在服务、法律、资源和技术等方面扩大艾滋病防治可及性。(新华社)", "ctime": 1795530548, "time_str": "22:29:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261124/c682171923.shtml"}, {"id": "5749809", "title": "王毅同英国外交大臣米利班德通电话", "content": "中共中央政治局委员、外交部长王毅24日应约同英国外交大臣米利班德通电话。王毅表示，今年以来，在两国领导人引领下，中英关系改善势头取得积极进展，值得双方共同珍惜。历史和事实将证明，中英发展长期稳定的全面战略伙伴关系完全符合两国和两国人民根本利益。明年是中英建立大使级外交关系55周年，是两国关系承前启后的重要年份。中方愿同英方一道努力，推动中英关系成熟、稳健、可持续向前发展，为地区和世界和平稳定发挥建设性作用。王毅说，双方要沿着两国领导人确定的方向，规划好下阶段高层往来，充分释放各领域合作潜力，不断丰富中英全面战略伙伴关系内涵。希望英方切实恪守一个中国原则，维护好双边关系政治基础。中国“十五五”时期将继续扩大对外开放，为两国务实合作开辟广阔空间，希望英方坚持自贸原则和开放姿态，为中国企业赴英合作提供稳定政策预期和良好营商环境。中方支持英国明年担任二十国集团轮值主席国工作，愿同英方加强多边协作，为动荡世界注入更多稳定性和确定性。米利班德祝贺中方成功举办亚太经合组织领导人非正式会议，表示英方高度重视发展对华关系，期待同中方密切高层交往，拓展互利合作，推动英中关系健康稳定发展。英方重申在台湾问题上立场没有改变，愿同中方在气候变化和国际地区热点问题上加强对话沟通，共同应对挑战，维护世界和平。双方还就当前的中东局势、乌克兰等问题交换了意见。(新华社)", "ctime": 1795530331, "time_str": "22:25:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261124/c682171894.shtml"}, {"id": "5749773", "title": "NYMEX汽油主力合约涨超2%", "content": "NYMEX汽油主力合约涨超2%，现报2.44美元/加仑。", "ctime": 1795529941, "time_str": "22:19:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261124/c682171857.shtml"}, {"id": "5749771", "title": "NYMEX取暖油主力合约涨超1%", "content": "NYMEX取暖油主力合约涨超1%，现报3.68美元/加仑。", "ctime": 1795529878, "time_str": "22:17:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261124/c682171849.shtml"}, {"id": "5749749", "title": "布伦特原油站上88美元/桶", "content": "布伦特原油站上88美元/桶，日内涨1.57%。", "ctime": 1795529690, "time_str": "22:14:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261124/c682171827.shtml"}, {"id": "5749729", "title": "上期所原油主力合约涨超2%", "content": "上期所原油主力合约涨超2%，报582元/桶。", "ctime": 1795529369, "time_str": "22:09:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261124/c682171790.shtml"}, {"id": "5749723", "title": "超威半导体美股盘前跌超 短缺问题，美国防部正与通用汽车公司、福特汽车公司等制造商洽谈，寻求其协助大规模生产军用无人机。报道指出，美军方希望利用汽车行业庞大的装配线以提升关键弹药和装备的产量。美国防部领导层意识到，许多美国无人机公司规模小且缺乏经验和产能，无法满足国防部未来几年数百万架无人机的采购需求。国防部近几个月一直在争取利用汽车制造商成熟的供应链，提升从导弹到战术卡车等各类武器的产量。报道还称，美国防部长赫格塞思已于今年秋季成立一个作战司令部来统筹无人机制造工作，整合各军种的无人机生产和研发工作。报道援引知情人士消息说，美国防部官员已与福特汽车公司、加拿大汽车零部件企业麦格纳国际公司等企业负责人会面，但目前尚未达成任何协议。参与谈判的相关人士表示，汽车公司高管对该提议的反应不一。报道说，对于美国汽车制造业巨头及其供应商而言，加入美国军工供应链“前景充满风险”。汽车公司面临利润率低、与武器生产挂钩损害自身名誉等问题。自中期选举以来，美国民主党对国防部官员及其与企业达成协议的审查日益严格，与政府签订协议的潜在政治风险也随之增加。(新华社)", "ctime": 1795528817, "time_str": "22:00:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261124/c682171661.shtml"}, {"id": "5749609", "title": "海南省省长刘小明会见明阳集团客人", "content": "据海南日报消息，11月24日，海南省省长刘小明在海口会见明阳集团董事长张传卫一行。双方围绕发挥海南自由贸易港政策优势和明阳集团海上风电装备领域领军优势，优化明阳东方国际进出口产业母港项目布局、加大风氢一体化技术创新和漂浮式海上风电场景创新、加快三亚深海能源科创中心投运，共同推动海南清洁能源岛建设和先进制造业发展等方面进行交流探讨。(证券时报)", "ctime": 1795528025, "time_str": "21:47:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261124/c682171553.shtml"}, {"id": "5749607", "title": "民调显示更多德国人不再支持军援乌克兰", "content": "据德国方面24日消息，德国科贝尔基金会近期一项研究称，越来越多德国人反对向乌克兰提供军事援助。如今，大约53%的德国人希望停止向乌克兰提供武器。科贝尔基金会的这项研究显示，德国民众对乌克兰危机的看法发生了较大改变，更多的民众不再支持向乌克兰提供军事援助。9月的调查显示，仅46%的调查对象支持继续向乌克兰提供军事援助；这一数字在去年的调查中是59%。如今，53%的调查对象希望停止向乌克兰提供武器。（央视新闻）", "ctime": 1795527996, "time_str": "21:46:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261124/c682171551.shtml"}, {"id": "5749573", "title": "据港交所文件：合肥酷芯微电子股份有限公司通过港交所上市聆讯", "content": "据港交所文件：合肥酷芯微电子股份有限公司通过港交所上市聆讯。", "ctime": 1795527726, "time_str": "21:42:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261124/c682171510.shtml"}, {"id": "5749549", "title": "叶尔羌河大型灌区续建配套与现代化改造项目开工", "content": "记者24日从水利部了解到，国家“两重”水利工程——叶尔羌河大型灌区续建配套与现代化改造项目近日在新疆喀什地区泽普县开工。 const SECTORS  = [{"name": "金融", "hit_count": 41, "etfs": []}, {"name": "人工智能", "hit_count": 29, "etfs": []}, {"name": "数据要素", "hit_count": 18, "etfs": []}, {"name": "半导体", "hit_count": 16, "etfs": []}, {"name": "军工", "hit_count": 14, "etfs": []}, {"name": "新能源", "hit_count": 11, "etfs": []}, {"name": "消费", "hit_count": 7, "etfs": []}, {"name": "低空经济", "hit_count": 5, "etfs": []}];
const META     = {"update_time": "2026-11-25 02:49:55", "sentiment_score": 57.32217573221757, "agents": []};

// 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
