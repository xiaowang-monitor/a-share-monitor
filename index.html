const NEWS     = [{"id": "4687319", "title": "百事可乐：2026年第二季度净营收增长6.4%，核心EPS增4%", "content": "百事可乐（NASDAQ:PEP）公布2026年第二季度财报：净营收达241.81亿美元，同比增长6.4%，其中有机营收增长2.4%，汇率贡献2.2个百分点，收购与剥离净贡献1.8个百分点。每股收益（EPS）为2.18美元，同比飙升137%；核心EPS为2.2美元，同比增长4%，核心固定汇率EPS增长1%。运营利润为40.23亿美元，同比增长125%，运营利润率16.6%扩张875个基点，主要受上年同期Rockstar与Be & Cheery品牌减值支出及重组费用下降影响；核心运营利润40.67亿美元同比增4%，核心运营利润率16.8%收缩40个基点。北美便利食品销量市场份额上升但净营收下降；北美饮料业务净营收强劲增长，受益于2025年收购及有机增长。国际业务各板块均实现强劲净营收增长，亚太食品、国际饮料特许经营及欧非中东地区有机销量提升。上半年累计净营收436.24亿美元同比增7.3%，EPS 3.88美元增72%，核心EPS 3.81美元增6%。公司确认2026年全年财务指引不变。", "ctime": 1783591365, "time_str": "18:02:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260709/c678071286.shtml"}, {"id": "4687301", "title": "外交部介绍朝鲜内阁总理朴泰成访华背景和中方期待", "content": "应中国共产党中央委员会、中华人民共和国政府邀请，朝鲜劳动党中央委员会政治局常务委员会委员、朝鲜民主主义人民共和国国务委员会副委员长、内阁总理朴泰成将于7月10日至12日率朝鲜民主主义人民共和国党政代表团对中国进行正式访问，并出席《中朝友好合作互助条约》签订65周年纪念活动。外交部发言人毛宁7月9日在例行记者会上介绍了朴泰成访华背景和中方期待。毛宁表示，中朝是传统友好邻邦。维护好、巩固好、发展好中朝关系始终是中国党和政府坚定不移的战略方针。今年是《中朝友好合作互助条约》签订65周年，双方商定将共同隆重举办纪念活动。中方愿同朝方一道，以两党两国最高领导人重要共识为指引，加强战略沟通，密切交往合作，推动中朝传统友好合作关系不断向前发展。（新华社）", "ctime": 1783591302, "time_str": "18:01:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260709/c678071257.shtml"}, {"id": "4687221", "title": "宇信科技与硅基流动战略合作 打造适配金融行业的AI综合解决方案", "content": "7月9日，宇信科技与北京硅基流动科技有限公司签署战略合作协议。双方围绕大模型基础设施与金融行业场景开展深度协同合作，联合打造适配金融行业的AI综合解决方案，全面赋能金融机构智能化体系建设与落地应用。目前，双方合作已快速进入实战验证阶段，正与某银行客户联合开展基于硅基流动推理加速技术的算力卡适配与性能测试，率先在真实金融场景中完成技术可行性与效能增益的先行验证。（宇信科技）", "ctime": 1783591191, "time_str": "17:59:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260709/c678071189.shtml"}, {"id": "4687207", "title": "腾讯控股：7月9日回购106.5万股，耗资约5.01亿港元", "content": "腾讯控股公告，2026年7月9日于香港联交所购回普通股106.5万股，每股回购价介于HKD 467.4至HKD 473.2付出的价格总额为HKD 500,68.89万（约5.01亿港元）。所购回股份拟作注销用途。截至当日，公司根据2026年5月13日股东授权累计已购回股份3607.27万股，占授权获通过当日已发行股份（不包括库存股份）数目的0.39562%。", "ctime": 1783591154, "time_str": "17:59:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260709/c678071174.shtml"}, {"id": "4687203", "title": "上海推出检验检测认证领域先行先试九项改革举措", "content": "记者从7月9日举行的上海市政府新闻通气会上了解到，《关于在上海检验检测认证领域开展先行先试的意见》日前正式出台，聚焦制度创新、质量品牌提升、产业提质升级、国际互认协作等方向，推出九项改革举措，进一步增强上海在全球检测认证网络中的节点功能。在具体任务方面，上海将与欧盟、“一带一路”共建国家的标准认证组织，开展合作互认机制研究，为重点出口产品破解合格评定技术法规壁垒，探索“一次检测认证、多地认可或多证获取”等互认新范式，解决企业因重复检测、多次认证导致的时间、经济成本增加等问题，降低出口成本，推进贸易便利化。（央视新闻）", "ctime": 1783591138, "time_str": "17:58:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260709/c678071172.shtml"}, {"id": "4687201", "title": "恒鼎实业：第二季度原煤产量120.5万吨，同比下降15%", "content": "恒鼎实业公告，截至2026年6月30日止第二季度经营数据：原煤产量集团总计120.5万吨，同比下降15%；精煤产量25.4万吨，同比下降45%。截至2026年6月30日止六个月，原煤产量集团总计230.6万吨，同比下降12%；精煤产量54.1万吨，同比下降34%。其中四川省上半年原煤产量7.2万吨，同比下降49%；贵州省上半年原煤产量223.4万吨，同比下降10%。上述数据为公司内部统计，可能与定期报告存在差异。", "ctime": 1783591122, "time_str": "17:58:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260709/c678071167.shtml"}, {"id": "4687195", "title": "山东墨龙：A股股价异常波动，经核查无未披露重大事项", "content": "山东墨龙公告，公司A股股票连续两个交易日（2026年7月8日、9日）收盘价涨幅偏离值累计超过20%，属于股票交易异常波动。经公司董事会向控股股东及实际控制人问询核实，近期公司生产经营情况及内外部经营环境未发生重大变化，公司、控股股东及实际控制人不存在关于公司的应披露而未披露的重大事项，未发现可能对公司股价产生较大影响的媒体报道或市场传闻，控股股东及实际控制人在股票异常波动期间未买卖公司股票。", "ctime": 1783591084, "time_str": "17:58:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260709/c678071156.shtml"}, {"id": "4687193", "title": "丰元股份：预计2026年上半年实现扭亏为盈，净利润为1.4亿-2亿元", "content": "丰元股份公告，预计2026年上半年归属于上市公司股东的净利润为1.4亿元至2亿元，上年同期亏损2.43亿元，实现扭亏为盈；扣除非经常性损益后的净利润为7000万元至1亿元，上年同期亏损2.45亿元。业绩变动主要因新能源行业景气上行，锂电池正极材料需求增长，公司产销量及产能利用率大幅提升，叠加政府补助收益，盈利能力显著改善。", "ctime": 1783591077, "time_str": "17:57:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260709/c678071152.shtml"}, {"id": "4687185", "title": "盛航股份：控股股东万达控股拟增持不低于6600万元", "content": "盛航股份公告，控股股东万达控股集团计划自本公告披露之日起6个月内，以自有资金及股份增持专项贷款资金，通过深圳证券交易所交易系统以集中竞价的方式增持公司股份，拟增持股份数量不超过610万股，增持总金额不低于人民币6600万元（含），不超过人民币9600万元（含）。中信银行股份有限公司东营分行同意提供最高不超过人民币6000万元增持贷款。", "ctime": 1783590967, "time_str": "17:56:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260709/c678071100.shtml"}, {"id": "4687181", "title": "工业富联：预计2026年上半年净利润234亿元到244亿元，同比上升93%到101%", "content": "工业富联公告，预计2026年第二季度实现归属于母公司所有者的净利润128亿元到138亿元，与上年同期相比，将上升59亿元到69亿元，同比上升86%到101%；预计2026年半年度实现归属于母公司所有者的净利润234亿元到244亿元，与上年同期相比，将上升113亿元到123亿元，同比上升93%到101%。", "ctime": 1783590962, "time_str": "17:56:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260709/c678071095.shtml"}, {"id": "4687175", "title": "高能环境：预计2026年上半年净利润同比增长79.13%到118.94%", "content": "高能环境公告，预计2026年半年度实现归属于上市公司股东的净利润为9亿元至11亿元，与上年同期相比，将增加3.98亿元到5.98亿元，同比增长79.13%到118.94%。预计2026年半年度实现归属于上市公司股东的扣除非经常性损益的净利润为8.5亿元到10.5亿元，与上年同期相比，将增加3.96亿元到5.96亿元，同比增长87.02%到131.03%。", "ctime": 1783590829, "time_str": "17:53:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260709/c678070957.shtml"}, {"id": "4687173", "title": "西部矿业：预计2026年半年度净利润同比增加114%到130%", "content": "西部矿业公告，预计2026年半年度实现归属于母公司所有者的净利润40亿元到43亿元，与上年同期相比，将增加21.31亿元到24.31亿元，同比增加114%到130%。预计2026年半年度实现归属于母公司所有者的扣除非经常性损益的净利润40.4亿元到43.4亿元，与上年同期相比，将增加22.06亿元到25.06亿元，同比增加120%到137%。本报告期内，有色金属市场价格持续向好，铜类、金银类产品价格较上年同期上涨，本期业绩同比上升。", "ctime": 1783590810, "time_str": "17:53:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260709/c678070954.shtml"}, {"id": "4687167", "title": "博隆技术：预计2026年上半年净利润同比下降56.69%到63.70%", "content": "博隆技术公告，预计2026年上半年净利润为8800万元到1.05亿元，同比减少56.69%到63.70%。预计2026年上半年扣除非经常性损益的净利润为8200万元到9900万元，同比减少57.59%到64.87%。2025年上半年公司净利润为2.42亿元。营业收入下降20%左右，中小型项目毛利率较低且占比增加，欧元存款出现汇兑损失是业绩预减的主要原因。", "ctime": 1783590763, "time_str": "17:52:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260709/c678070934.shtml"}, {"id": "4687165", "title": "盛洋科技：控股子公司FTA公司拟以419万英镑收购Triax UK Limited 100%股权", "content": "盛洋科技公告，控股子公司FTA Communication Technologies S.àr.l.拟以现金支付方式收购Triax UK Limited 100%股权，交易金额为419万英镑，按2026年7月9日英镑兑人民币汇率中间价测算，交易金额为人民币3817.01万元。交易完成后，Triax公司将成为公司控股子公司，并纳入公司合并报表范围。本次交易已获公司第六届董事会第二次会议审议通过，不构成关联交易和重大资产重组。", "ctime": 1783590756, "time_str": "17:52:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260709/c678070930.shtml"}, {"id": "4687163", "title": "三维通信：预计2026年上半年净利润同比增长1428.58%-2001.80%", "content": "三维通信公告，预计2026年1月1日至2026年6月30日归属于上市公司股东的净利润为4000万元–5500万元，比上年同期的261.68万元增长1428.58%-2001.80%；扣除非经常性损益后的净利润为3500万元–5250万元，比上年同期的亏损527.96万元增长762.93%-1094.39%。报告期内，公司互联网业务收入实现增长，主要受市场需求波动驱动。2025年第四季度以来，短剧、漫剧等内容商业模式快速迭代，市场推广需求显著提升，行业迎来阶段性红利窗口。公司紧抓市场机遇，积极布局相关业务，有效把握流量与变现机会，推动互联网业务收入实现增长。", "ctime": 1783590746, "time_str": "17:52:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260709/c678070926.shtml"}, {"id": "4687161", "title": "深圳市委召开专题会议 研究部署工业投资重点项目推进等工作", "content": "7月8日，深圳市委召开专题会议，分析上半年全市工业投资情况，研究部署重点项目推进工作。会议强调，要坚持实体经济为本、制造业当家，准确把握深圳市工业投资潜力巨大、支撑有力的发展态势，坚定信心、奋发有为，抢前抓早、先谋快动，全力推动工业投资稳定增长，为“十五五”乃至更长期发展打下坚实基础。要充分把握产业发展的阶段性特征，积极抢抓人工智能等新技术快速迭代、市场加速成形、需求加快释放的机遇期窗口期，加强产业研究和项目谋划，加大关键领域和前沿领域投资布局力度，不断塑造高质量发展新动能新优势。要积极探索投资模式创新，综合用好各种金融工具，更好发挥国资国企资源整合枢纽作用，促进社会资本参与重大项目建设，加快培育和发展新质生产力。要强化市、区“一盘棋”协同联动，加强产业规划，优化功能布局，大力推进集中连片产业用地整备，积极盘活低效用地，用心用情做好企业服务，切实解决好制约项目投资建设的瓶颈问题，推动形成实施一批、前期一批、储备一批、谋划一批的良好局面。（深圳特区报）", "ctime": 1783590736, "time_str": "17:52:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260709/c678070921.shtml"}, {"id": "4687159", "title": "大族激光：预计2026年上半年净利润同比增长156.07%~176.55%", "content": "大族激光公告，预计2026年1月1日至2026年6月30日归属于上市公司股东的净利润为12.5亿元~13.5亿元，比上年同期增长156.07%~176.55%；扣除非经常性损益后的净利润为13.5亿元~14.5亿元，比上年同期上升417.12%~455.42%。", "ctime": 1783590713, "time_str": "17:51:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260709/c678070905.shtml"}, {"id": "4687155", "title": "百润股份：实控人刘晓东已增持0.1079%并拟继续增持", "content": "百润股份公告，控股股东、实际控制人、董事长兼总经理刘晓东于2026年7月9日通过集中竞价方式增持公司股份112.42万股，占公司总股本的0.1079%，增持金额为1797.91万元。其拟自2026年7月9日起未来6个月内继续增持，增持金额不低于人民币5000万元，不超过人民币1亿元（含首次增持股份金额17,979,067.20元），不设置增持价格区间。", "ctime": 1783590696, "time_str": "17:51:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260709/c678070894.shtml"}, {"id": "4687153", "title": "兴蓉环境：股东信环绿色控股已增持1.12%", "content": "兴蓉环境公告，持股5%以上股东信环绿色控股于2026年6月29日至2026年7月8日通过集中竞价方式累计增持公司股份3330.76万股，占公司总股本的1.12%；增持后持有1.83亿股，占6.12%，触及1%的整数倍。信环绿色控股计划自公告披露之日起6个月内继续增持公司股份数量不少于7000万股。", "ctime": 1783590689, "time_str": "17:51:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260709/c678070880.shtml"}, {"id": "4687095", "title": "中研股份：财务总监杨丽萍拟减持不超过0.1233%", "content": "中研股份公告，代财务总监杨丽萍持有公司股份60.07万股，占总股本0.4937%，股份来源为IPO前取得。因个人资金需求，杨丽萍计划自2026年8月3日至2026年11月2日通过集中竞价或大宗交易方式减持不超过15万股，不超过总股本0.1233%。", "ctime": 1783590161, "time_str": "17:42:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260709/c678070628.shtml"}, {"id": "4687085", "title": "济川药业：小儿豉翘清热颗粒纳入国家基药目录", "content": "济川药业公告，近日，国家卫生健康委员会、国家中医药管理局、国家疾病预防控制局发布了《国家基本药物目录（2026 年版）》，全资子公司济川药业集团有限公司的小儿豉翘清热颗粒纳入国家基药目录。小儿豉翘清热颗粒为公司独家品种，适用于小儿风热感冒挟滞证，是《国家基本医疗保险、生育保险和工伤保险药品目录（2025 年）》乙类产品。", "ctime": 1783590072, "time_str": "17:41:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260709/c678070604.shtml"}, {"id": "4687081", "title": "国家防总对浙江福建启动防汛防台风三级应急响应", "content": "据气象部门预报，今年第9号台风“巴威”（超强台风级）的中心7月9日14时位于台湾省基隆市东偏南方向约1030公里的西北太平洋洋面上，中心附近最大风力有16级（52米每秒），七级风圈半径为500公里。预计，“巴威”将以每小时10～15公里的速度向西北方向移动，可能将于11日白天登陆或擦过台湾岛北部沿海（超强台风或强台风级），然后11日晚上在福建福清至浙江温岭一带沿海登陆（强台风或台风级）。根据《国家防汛抗旱应急预案》及有关规定，国家防总决定于7月9日17时将防汛防台风四级应急响应提升至三级。台风“巴威”登陆强度大、影响范围广、致灾性强，防范应对形势严峻复杂。后续，国家防总将根据台风发展形势，提升和调整防汛防台风应急响应。（新华社）", "ctime": 1783590041, "time_str": "17:40:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260709/c678070590.shtml"}, {"id": "4687075", "title": "全国总工会下拨1350万元救灾资金", "content": "针对近期我国多地遭遇极端天气，全国总工会今日下拨1350万元工会救灾资金，支持广西、湖北、甘肃、贵州、湖南、重庆工会开展抢险救灾工作，资金主要用于慰问受灾职工和抢险救灾人员。（央视新闻）", "ctime": 1783589970, "time_str": "17:39:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260709/c678070540.shtml"}, {"id": "4687065", "title": "证监会同意天博智能科技（山东）股份有限公司首次公开发行股票注册", "content": "证监会同意天博智能科技（山东）股份有限公司首次公开发行股票注册。", "ctime": 1783589923, "time_str": "17:38:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260709/c678070524.shtml"}, {"id": "4687061", "title": "宇晶股份：预计2026年上半年净亏损6500万元-8500万元", "content": "宇晶股份公告，预计2026年1月1日至2026年6月30日归属于上市公司股东的净亏损为6500万元-8500万元，上年同期为盈利1179.65万元。扣除非经常性损益后的净亏损为7000万元-9000万元，上年同期为盈利112.43万元。", "ctime": 1783589891, "time_str": "17:38:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260709/c678070516.shtml"}, {"i // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
