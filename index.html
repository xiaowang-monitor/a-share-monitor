const NEWS     = [{"id": "5564299", "title": "美众议长称输中期选举是历史规律", "content": "当地时间11月3日晚，美国媒体预测民主党在中期选举中大获全胜，重夺参众两院控制权。对此，美国国会众议院议长、共和党人约翰逊表示，过去90年里，现任总统能在任期前两年内为本党增加或保住席位的情况只出现过两次，直言“今晚历史规律似乎仍将延续”。他还表示，若民主党人将未来两年变成关于报复、法律战及党派博弈的闹剧，会伤害所有美国人，众议院共和党人将构成“防火墙”，确保这种情况不会发生。（CCTV国际时讯）", "ctime": 1793777964, "time_str": "15:39:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261104/c681452784.shtml"}, {"id": "5564291", "title": "吉利、湖州国资等成立远醇航运公司", "content": "企查查APP显示，近日，湖州远醇航运有限公司成立，法定代表人为张强，注册资本4000万，经营范围包含：水路普通货物运输；国内船舶管理业务；船舶设计；国内货物运输代理；海上国际货物运输代理等。企查查股权穿透显示，该公司由吉利旗下浙江远程新能源商用车集团有限公司、湖州市低空产业发展有限公司、湖州南浔交通实业发展集团有限公司共同持股。", "ctime": 1793777833, "time_str": "15:37:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261104/c681452682.shtml"}, {"id": "5564271", "title": "赛微微电：聚核投资拟增持不低于1750万元、不高于3500万元", "content": "赛微微电公告，控股股东、实际控制人之一致行动人珠海市聚核投资合伙企业（有限合伙）拟自2026年11月5日起6个月内，以自有及自筹资金增持公司股份，金额不低于人民币1750万元（含）且不高于人民币3500万元（含）。增持方式包括集中竞价、大宗交易等；聚核投资目前持有公司股份495.34万股，占总股本5.73%。", "ctime": 1793777652, "time_str": "15:34:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261104/c681452609.shtml"}, {"id": "5564267", "title": "高通全球首个符合3GPP最新定义的6G终端原型机将首次公开实物展出", "content": "记者获悉，在明日即将开幕的第九届中国国际进口博览会上，高通公司将集中展示6G、智能体AI及多元智能终端最新成果，全球首个符合3GPP最新定义的6G终端原型机将首次公开实物展出。据悉，该原型机已用于与中国移动、中兴通讯等中国产业伙伴开展6G技术测试和验证，现场将呈现面向6G网络的“AI记忆”前沿技术应用，实现智能眼镜通过无线网络和AI对所见内容的识别与追溯检索。（财联社）", "ctime": 1793777622, "time_str": "15:33:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261104/c681452601.shtml"}, {"id": "5564241", "title": "英政府报告称2028年中国“极有可能”频繁利用AI搞黑客活动，外交部回应", "content": "11月4日，外交部发言人毛宁主持例行记者会。有记者提问，据报道，英国政府通讯总部下属国家网络安全中心3日发布年度网络安全报告称，中国是人工智能技术大国。到2028年，中国“极有可能”频繁利用AI开展黑客行动，是英国面临的“最复杂、最持久的”网络威胁。中方对此有何评论？“我们注意到相关报道。”毛宁表示，中方对英方在缺乏证据的情况下，使用推测性语言抹黑中国表示严重关切，人工智能引发的网络安全风险是各国面临的共同挑战，应当在联合国制定新的国际规则共同应对。令人遗憾的是英方此前长期将网络安全问题政治化，现在又借黑客攻击的“旧瓶”装打压中国人工智能发展的“新酒”，这种错误做法无助于增进中英互信，也将损害英方在全球人工智能安全治理合作中的信誉。毛宁强调，中方一贯主张人工智能发展应当坚持向上向善、开放普惠，统筹安全与发展，确保安全、可靠、可控。（澎湃新闻）", "ctime": 1793777474, "time_str": "15:31:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261104/c681452543.shtml"}, {"id": "5564207", "title": "外交部：愿继续同美方维护好落实好两国元首重要共识", "content": "11月4日，外交部发言人毛宁主持例行记者会。有记者就美国中期选举提问，毛宁表示，中期选举是美国内政。中方愿继续同美方一道，维护好落实好两国元首重要共识，加强沟通，妥处分歧，拓展合作，构建“基于尊重、公平、对等的中美建设性战略稳定关系”。（央视新闻）", "ctime": 1793777279, "time_str": "15:27:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261104/c681452289.shtml"}, {"id": "5564205", "title": "外交部：当前中东局势紧张升级，中方愿意同沙特、伊朗等地区国家加强沟通对话", "content": "11月4日，外交部发言人毛宁主持例行记者会。有记者问：近日，沙特国家安全顾问艾班、伊朗最高国家安全委员会副秘书巴盖里同期访华，中方对沙伊关系和中东海湾地区形势有何看法？毛宁表示，面对当前中东局势紧张升级，中方愿意同沙特、伊朗等地区国家加强沟通对话，当务之急是避免中东战端重启、殃及地区人民。中方将继续以习近平主席就促进中东地区和平和安全提出的系列倡议主张为指引，秉持客观公正立场，支持伊朗和美国通过谈判化解争端，推动也门问题寻求政治解决，助力就开放霍尔木兹海峡形成稳妥全面的解决方案。期待地区国家秉持相互尊重、睦邻友好原则，共同打造共同、综合、合作、可持续的地区安全新架构，实现地区长治久安。（央视新闻）", "ctime": 1793777200, "time_str": "15:26:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261104/c681452248.shtml"}, {"id": "5564191", "title": "Authentic Brands Group完成收购牛仔品牌Lee", "content": "11月4日，全球品牌与娱乐平台Authentic Brands Group宣布，已完成从Kontoor Brands, Inc.收购Lee知识产权的交易。Lee创立于1889年，是全球最知名的牛仔品牌之一，业务遍布全球73个国家，年零售等值销售额约为15亿美元，其中近四成来自美国及加拿大以外的地区。", "ctime": 1793777044, "time_str": "15:24:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261104/c681452190.shtml"}, {"id": "5564177", "title": "光大期货：地缘风险溢价松动，中期选举前夜黄金窄幅波动", "content": "11月4日（周三），隔夜伦敦现货金银冲高回落。地缘信号密集但方向一致，中东局势阶段性降温，原油先跌后涨。政治面上，中期选举计票正在进行，在今晚ADP、ISM非制造业与周五非农落地前，预计金价随中期选举计票进展维持窄幅震荡。\n宏观方面，美国9月JOLTS职位空缺增至752.3万个，高于预期的716.4万个，裁员及解雇人数降至2025年3月以来最低，就业市场继续凸显韧性。地缘政治方面，伊朗方面表示，美方须完整回应伊朗提出的7项条件并付诸实施，霍尔木兹海峡才会开放；特朗普承认发动一场小规模攻击。央行购金方面，世界黄金协会数据显示，全球三季度全球央行净购金321吨，同比增42%。油价继续回落，“油价-通胀-利率”链条传导下，市场避险情绪减弱。另外，中期选举投票正在进行，美股出现回落后的反弹，关注市场情绪能否持续回暖。笔者认为，若中东地缘继续朝着预期缓和方向进展，结合中期选举落地、12月利率路径两个维度来看，金价触底回升概率较大，一是选举结果不确定性本身会带来阶段性避险溢价，二是市场已对12月利率路径有所定价，但反弹更多基于风险溢价的修复，属于脉冲式行情，空间可能有限。同时，世界黄金协会11月3日表示，三季度金价走弱可能促使部分央行增加购买，美元反弹也推动部分央行将外汇储备转换为黄金，并据此上调全年央行购金预期。（光大期货）", "ctime": 1793776962, "time_str": "15:22:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261104/c681452163.shtml"}, {"id": "5564123", "title": "道达尔能源将向江苏省国信集团每年供应90万吨液化天然气，为期15年", "content": "11月4日，道达尔能源宣布与江苏省国信集团签署液化天然气长期购销框架协议（HoA），每年向其供应90万吨液化天然气，在完成最终购销协议（SPA）的前提下，该协议将于2028年开始执行，为期15年。液化天然气将交付至江苏省国信集团位于如东新建的液化天然气接收站，用于城市燃气供应和灵活发电。", "ctime": 1793776538, "time_str": "15:15:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261104/c681451852.shtml"}, {"id": "5564103", "title": "股票回购增持再贷款扩容，5家城商行进入支持机构名单", "content": "11月4日，央行宣布，股票回购增持再贷款的支持对象为21家全国性银行和5家系统重要性城商行，对比来看，此次政策新增了5家系统重要性城商行。记者梳理发现，宁波银行、江苏银行、上海银行、南京银行和北京银行为新增再贷款支持机构，记者从多位城商行人士处证实了上述消息。一位城商行人士对记者表示，这对于该行而言是很大的突破，有助于借助区域性银行的客户资源和属地服务能力，进一步拓宽上市公司及主要股东的融资渠道。(界面新闻)", "ctime": 1793776392, "time_str": "15:13:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261104/c681451803.shtml"}, {"id": "5564039", "title": "伊朗官员：调解方斡旋下伊美分歧仍难弥合", "content": "伊朗高级官员称，伊美距离达成结束战事协议仍很遥远，虽卡塔尔、埃及等地区国家推动斡旋，但伊美在关键问题上分歧明显，军事对峙未缓和。该官员称伊朗不会接受美方“过分要求”，若美国希望霍尔木兹海峡重新开放，须满足伊朗解除石油制裁、结束海上封锁及解冻伊朗资金等条件；最高国家安全委员会秘书雷扎伊称美方回应“缺乏说服力”，核问题谈判难以启动。埃及呼吁政治途径解决危机，卡塔尔称“不能丧失希望”。伊朗革命卫队2日夜间向美军航空器发射导弹，美军摧毁其地对空导弹发射器；特朗普称对僵局现状满意，暗示可能再次对伊采取军事行动，伊朗警告将强硬回应。（新华社）", "ctime": 1793776158, "time_str": "15:09:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261104/c681451703.shtml"}, {"id": "5564025", "title": "嘀嗒出行宣布产品升级：顺风车与网约车可一键呼叫", "content": "嘀嗒出行App近日完成产品升级：顺风车与聚合打车合并至同一页面，用户输入起终点后可一键呼叫顺风车与网约车，也可分别呼叫。（新浪科技）", "ctime": 1793776104, "time_str": "15:08:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261104/c681451623.shtml"}, {"id": "5563685", "title": "股指期货午盘收盘 主力合约全线收涨", "content": "股指期货午盘收盘，主力合约全线收涨。沪深300股指期货(IF)主力合约涨2.70%，上证50股指期货(IH)主力合约涨1.83%，中证500股指期货(IC)主力合约涨4.86%，中证1000股指期货(IM)主力合约涨4.77%。", "ctime": 1793775732, "time_str": "15:02:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261104/c681451409.shtml"}, {"id": "5563667", "title": "ETF两市成交额报7058.68亿元，较昨日此时放量1186.78亿元", "content": "截至目前，ETF两市成交额报7058.68亿元，较昨日此时放量1186.78亿元，分类型来看，股票型ETF成交额2610.5亿元，债券型ETF成交额2573.43亿元，货币型ETF成交额653.5亿元，商品型ETF成交额175.24亿元，QDII型ETF成交额1046.02亿元。其中，成交额最高的非货币型ETF分别是中韩半导体ETF（513310）、创业板ETF（159915）、科创50ETF（588000），成交额分别为：315.66亿元、202.00亿元、190.59亿元。", "ctime": 1793775726, "time_str": "15:02:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261104/c681451406.shtml"}, {"id": "5563565", "title": "ETF收评：科创半导体ETF领涨20.03%，标普油气ETF领跌2.94%", "content": "ETF收盘涨跌不一，科创半导体ETF（588170）领涨20.03%，科创半导体设备ETF（589020）涨19.74%，科创半导体设备ETF（588710）涨18.70%，标普油气ETF（159518）领跌2.94%，标普油气ETF（513350）跌2.92%，能源化工ETF（159981）跌2.71%。", "ctime": 1793775666, "time_str": "15:01:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261104/c681451389.shtml"}, {"id": "5563579", "title": "A股收评：科创50指数午后大幅上攻涨近10%，贵金属板块及算力硬件股集体爆发", "content": "A股三大指数今日集体上涨，截至收盘，上证指数涨2.16%，深证成指涨4.22%，创业板指涨6.4%，北证50涨4.56%，科创50指数涨9.92%。全市场成交额20519亿元，较上日放量3368亿元，全市场超4600 news.10jqka.com.cn/20261104/c681451361.shtml"}, {"id": "5563387", "title": "A股重回2万亿成交！", "content": "沪深京三市午后大幅放量，成交额自9月22日以来再度突破2万亿元，较昨日放量3251亿元，市场活跃度显著提升。", "ctime": 1793775306, "time_str": "14:55:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261104/c681451269.shtml"}, {"id": "5563361", "title": "以总检察长要求情报机构提交选举舞弊调查进展", "content": "以色列总检察长巴哈拉夫-米亚拉3日要求国家安全总局提交阿拉伯裔政党涉嫌选举舞弊的初步调查进展，指责其未将材料移交特别调查组；利库德集团指责其掩盖外国势力操纵选举，阿拉伯裔政党否认指控。以中央选举委员会3日晚表示不会推迟公布选举结果，总统赫尔佐格定于4日中午接收结果后与各党派磋商。以反对派3日发表联合声明支持埃森科特尽快组阁，重申承认以色列为“犹太民主国家”、哈马斯为“恐怖组织”等4项原则，可能将部分阿拉伯裔政党排除在执政联盟外。选举结果：执政阵营获53席，反对派获48席，阿拉伯裔政党获19席，均未达61席组阁门槛。（新华社）", "ctime": 1793775125, "time_str": "14:52:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261104/c681451204.shtml"}, {"id": "5563303", "title": "魔芯科技：发布昇腾原生4D世界模型MoWorld 2.0", "content": "11月4日，在世界互联网大会上，魔芯科技创始人兼CEO陈天润联合具身智能、文化旅游、时空地理信息方向的三家国家人工智能应用中试基地代表，正式发布基于华为昇腾原生的4D世界模型MoWorld 2.0。（人民财讯）", "ctime": 1793775033, "time_str": "14:50:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261104/c681451149.shtml"}, {"id": "5563301", "title": "宝马集团第三季度营收304.52亿欧元，同比下降5.8%", "content": "宝马集团11月4日发布财报：第三季度汽车交付量551,075辆，同比下降6.3%；摩托车交付量46,605辆，同比下降12.5%；第三季度营收304.52亿欧元，同比下降5.8%；息税前利润（EBIT）15.89亿欧元，同比下降29.7%。（界面新闻）", "ctime": 1793775020, "time_str": "14:50:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261104/c681451141.shtml"}, {"id": "5563219", "title": "科创半导体ETF华夏一度触及20cm涨停", "content": "临近尾盘半导体板块大幅上涨，科创半导体ETF华夏、科创半导体设备ETF华泰柏瑞等多只ETF逼近20cm涨停，半导体设备ETF广发、半导体设备ETF国泰、半导体设备ETF华夏等触及10cm涨停。科创芯片ETF富国、科创芯片ETF汇添富、科创芯片ETF易方达等多只科创芯片ETF涨超13%。", "ctime": 1793774658, "time_str": "14:44:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261104/c681450931.shtml"}, {"id": "5563207", "title": "王文涛部长会见挪威工商大臣米尔塞特", "content": "11月3日，商务部部长王文涛会见挪威工商大臣米尔塞特，双方就中挪经贸关系、共同维护多边贸易体制等议题交换意见。王文涛表示，中挪双边贸易增长迅速，中方愿深化在水产品、绿色发展、海事航运等领域合作，欢迎挪威连续第三年参加进博会国家展；挪威是欧洲经济区和世贸组织重要成员，希望挪方坚持多边主义和自由贸易，为中国企业提供公平、透明、非歧视、可预期的营商环境。米尔塞特表示，率规模空前的经济代表团访华并出席第九届进博会，体现挪方加强对华合作的坚定信心和浓厚兴趣，愿扩大农渔产品对华出口，鼓励对华投资合作，欢迎更多中国企业赴挪投资；挪威坚定支持以世贸组织为核心的多边贸易体制，愿加强在世贸组织框架下的沟通协调。（商务部）", "ctime": 1793774605, "time_str": "14:43:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261104/c681450919.shtml"}, {"id": "5563165", "title": "英科医疗与腾讯云达成战略合作", "content": "据英科医疗消息，近日，英科医疗与腾讯云签署战略合作协议。双方将围绕企业智能办公、AI应用落地及信息安全建设等领域展开深度合作，以数字技术赋能企业运营管理与业务创新，共同探索制造业数字化、智能化转型新路径。（人民财讯）", "ctime": 1793774448, "time_str": "14:40:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261104/c681450802.shtml"}, {"id": "5563145", "title": "农业农村部与河南省政府举行工作会谈", "content": "11月4日，农业农村部与河南省政府举行工作会谈。农业农村部党组书记、部长张柱，河南省委副书记、代理省长王陆进出席会谈。 张柱表示，河南省委省政府高度重视“三农”工作，扎实建设“中原粮仓”，盯紧抓实常态化帮扶，加快推进农业科技创新，大力培育乡村富民产业，持续提升乡村面貌，取得一系列新进展新成效。农业农村部将深入贯彻习近平总书记关于“三农”工作的重要论述和对河南工作的重要讲话重要指示精神，认真落实党的二十届五中全会部署，以学习运用“千万工程”经验为引领，进一步支持河南加快建设农业强省。支持抓好粮食生产，强化高标准农田建设质量监管，集成推动粮油作物大面积均衡增产，抓细农业防灾减灾救灾。务实做好常态化帮扶各项工作，守牢不发生规模性返贫致贫底线，“志智双扶”增强内生发展动力。强化农业科技装备支撑，推动农业发展全面绿色转型，延伸现代农业产业链条，健全联农带农机制，因地制宜建设宜居宜业和美乡村。希望部省加强联动、同频共振，共同推进河南乡村全面振兴。 王陆进感谢农业农村部对河南“三农”工作的支持，表示河南将全面贯彻落实习近平总书记关于河南工作的重要讲话和重要指示批示精神，深入贯彻党的二十届五中全会精神，坚持农业农村优先发展，扛牢保障国家粮食安全重任，扎实抓好乡村产业发展、乡村建设、乡村治理，加快农业强省建设步伐。(农业农村部)", "ctime": 1793774409, "time_str": "14:40:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261104/c681450775.shtml"}, {"id": "5563115", "title": "华为、阿里等20家单位：共建智能体互联基础设施加速智能体赋能千行百业", "content": "今日，中国信通院、华为、阿里、腾讯、小米等20家单位联合发布《智能体发展自律公约》。其中提到，建设智能体互联基础设施。共建可互联的基础设施，发展智能体注册与解析、能力描述与发现、意图理解与转换、网络路由与连接、资源调度与计量、协议兼容与互认等技术与标准。不断降低智能体跨域发现连接成本，支撑智能体互联协同；加速智能体赋能千行百业。坚持服务实体经济，发展低门槛智能体开发部署工具，合作研发面向真实作业场景、创造实际价值的智能体，推动智能体嵌入现有生产系统和业务流程，打造标杆型应用。不断降低智能体落地应用成本，助力行业提质增效。（中国信通院）", "ctime": 1793774321, "time_str": "14:38:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261104/c681450696.shtml"}, {"id": "5563091", "title": "美民众借中期选举表达对移民执法不满", "content": "美国国会中期选举当地时间11月3日举行，明尼苏达、得克萨斯等州民众借选票表达对联邦移民执法行动的不满。自2025年美国加强针对移民的执法行动以来，已有至少10人丧生；今年1月联邦执法人员在明尼阿波利斯枪杀两名美国公民，7月得州休斯敦一名墨西哥籍建筑工人遭ICE特工枪杀，纪念地点民众留下“我投票了”等贴纸。得州沃思堡40岁玛丽亚·塞尔达称不少同事已被拘留或遣返，54岁维克托·加西亚称强硬执法政策驱动他投票。伊利诺伊州芝加哥29岁教师瑞安·布朗称部分学生因执法行动每天不敢上学。美国分析称中期选举正测试特朗普2024年拉美裔选民支持是否持久，民调显示拉美裔选民因不满移民政策等问题逐渐“回流”至民主党。（央视新闻）", "ctime": 1793774245, "time_str": "14:37:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261104/c681450574.shtml"}, {"id": "5563051", "title": "美股三大股指期货继续反弹 道琼斯指数期货转涨", "content": "美股三大股指期货继续反弹，道琼斯指数期货转涨，此前一度跌近1%；纳斯达克100指数期货现跌0.4%，此前一度跌超2%；标普500指数期货现跌0.3%，此前一度跌超1%。", "ctime": 1793774146, "time_str": "14:35:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261104/c681450507.shtml"}, {"id": "5563047", "title": "科创50指数涨幅扩大至10%", "content": "科创50指数涨幅扩大至10%，现报1266.56点。拓荆科技、中科飞测涨停。", "ctime": 1793774137, "time_str": "14:35:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261104/c681450505.shtml"}, {"id": "5562879", "title": "日韩股市收盘涨跌互现", "content": "日经225指数收跌1.42%，报62188.63点。韩国综指收涨0.62%，报5683.67点。", "ctime": 1793773909, "time_str": "14:31:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261104/c681450415.shtml"}, {"id": "5562715", "title": "科创综指涨近10%，科创宽基大反攻", "content": "午后科创综指涨近10%，科创100ETF鹏华、 科创   } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
