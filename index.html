}
.score-bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s; }
.up { color: var(--red); }
.down { color: var(--green); }
.pulse { animation: pulse 2s infinite; }
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}
.glow { box-shadow: 0 0 20px rgba(59,130,246,0.15); }

": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260410/c675905351.shtml"}, {"id": "4211831", "title": "长安汽车：2025年净利润40.75亿元，同比下滑44.34%", "content": "长安汽车发布2025年年度报告，营业收入1640亿元，同比增长2.67%；净利润40.75亿元，同比下滑44.34%。公司董事会审议通过的利润分配预案为每10股派发现金红利1.15元（含税），不以公积金转增股本。", "ctime": 1775816586, "time_str": "18:23:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260410/c675905336.shtml"}, {"id": "4211827", "title": "雪龙集团：终止对外投资设立全资子公司宁波雪龙铝镁科技有限公司", "content": "雪龙集团公告，公司于2025年12月10日召开董事会，审议通过设立全资子公司“宁波雪龙铝镁科技有限公司”，注册资本1亿元。但经审慎研究，公司决定终止该项对外投资。公司将以内部车间形式统筹推进压铸项目布局，依托现有主体实施产业链延伸，精简管理架构、提升运营效率、降低管理成本，进一步减少对外委外加工依赖，优化生产流程与成本结构，持续夯实核心竞争力。截至目前，该子公司尚未设立，公司亦未实际出资，本次终止事项不会对公司财务状况及经营产生重大影响。", "ctime": 1775816559, "time_str": "18:22:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260410/c675905325.shtml"}, {"id": "4211825", "title": "长安汽车：首次回购公司股份300万股", "content": "长安汽车公告，2026年4月10日，公司通过股份回购专用证券账户以集中竞价交易方式首次回购公司股份。回购A股股份300万股，占公司目前总股本的0.03026%，最高成交价为10.21元/股，最低成交价为10.02元/股，成交总金额为3030.2万元（不含交易费用）。回购B股股份81.05万股，已回购股份占公司总股本的比例为0.00818%，回购成交的最高价为4港币/股，最低价为3.95港币/股，成交总金额为322.08万港币（不含交易费用），折合人民币282.28万元（按2026年4月10日港币对人民币汇率中间价1:0.87641折算）。", "ctime": 1775816555, "time_str": "18:22:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260410/c675905323.shtml"}, {"id": "4211823", "title": "雪龙集团：2025年净利润8998.51万元，同比增长48.96%", "content": "雪龙集团公告，2025年实现营业收入4.34亿元，同比增长20.65%；净利润8998.51万元，同比增长48.96%。公司2025年度利润分配预案为：向全体股东每股派发现金红利0.22元（含税），合计拟派发现金红利4636.21万元（含税）。", "ctime": 1775816551, "time_str": "18:22:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260410/c675905322.shtml"}, {"id": "4211821", "title": "五部门：拟人化互动服务提供者不得向未成年人提供虚拟亲属、虚拟伴侣等虚拟亲密关系的服务", "content": "国家网信办、国家发展改革委、工业和信息化部、公安部、市场监管总局联合公布《人工智能拟人化互动服务管理暂行办法》，自2026年7月15日起施行。《办法》提到，拟人化互动服务提供者不得向未成年人提供虚拟亲属、虚拟伴侣等虚拟亲密关系的服务；向不满十四周岁未成年人提供其他拟人化互动服务的，应当取得未成年人的父母或者其他监护人的同意。拟人化互动服务提供者应当建立未成年人模式，提供未成年人模式切换、定期现实提醒、使用时长限制等个性化安全设置选项；针对不同年龄段未成年人保护需要，支持监护人接收安全风险提醒、了解未成年人服务使用概况、屏蔽特定角色、限制充值消费等。拟人化互动服务提供者应当在保护用户隐私权和个人信息的前提下，采取有效措施识别未成年人用户身份；识别为未成年人用户的，应当将相关服务切换至未成年人模式或者按照国家有关规定采取其他措施，并提供相应申诉渠道。", "ctime": 1775816541, "time_str": "18:22:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260410/c675905314.shtml"}, {"id": "4211819", "title": "光大同创：拟与安徽国控壹号等设立注册资本2.8亿元合资公司", "content": "光大同创公告，拟与安徽国控壹号产业投资基金合伙企业（有限合伙）、安徽科转投担联动创业投资基金合伙企业（有限合伙）、蚌埠市得时创业投资有限公司、蚌埠市中城国合新兴产业股权投资基金合伙企业（有限合伙）共同出资设立安徽光速同创科技有限公司，注册资本2.8亿元。公司拟以自有资金认缴出资1.5亿元，占注册资本的53.57%。安徽国控壹号拟认缴出资2300万元，占注册资本的8.21%。安徽科转投担拟认缴出资700万元，占注册资本的2.50%。蚌埠得时拟认缴出资5000万元，占注册资本的17.86%。蚌埠中城国合拟认缴出资5000万元，占注册资本的17.86%。", "ctime": 1775816375, "time_str": "18:19:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260410/c675905219.shtml"}, {"id": "4211817", "title": "星云股份：全资子公司拟出售资产预计收益超10%", "content": "星云股份公告，全资子公司福州兴星投资发展有限公司拟出售其持有的FranklinWH Energy,Inc.1.5682%的股权。交易完成后，兴星投资将不再持有该公司的股份。预计本次交易产生的收益将超过公司最近一个会计年度经审计净利润的10%。", "ctime": 1775816370, "time_str": "18:19:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260410/c675905214.shtml"}, {"id": "4211815", "title": "国家网信办等五部门联合公布《人工智能拟人化互动服务管理暂行办法》", "content": "国家网信办、国家发展改革委、工业和信息化部、公安部、市场监管总局联合公布《人工智能拟人化互动服务管理暂行办法》（以下简称《办法》），自2026年7月15日起施行。国家网信办有关负责人表示，《办法》旨在促进人工智能拟人化互动服务（以下简称拟人化互动服务）健康发展和规范应用，维护国家安全和社会公共利益，保护公民、法人和其他组织的合法权益。《办法》践行以人为本、智能向善的理念，明确国家坚持发展和安全并重、促进创新和依法治理相结合的原则，鼓励拟人化互动服务创新发展，对拟人化互动服务实行包容审慎和分类分级监管；提出拟人化互动服务促进措施，明确支持技术研发创新，鼓励有序拓展文化传播、适老陪伴等相关领域应用；规定提供拟人化互动服务的基本要求，明确不得从事生成危害国家安全、荣誉和利益，煽动颠覆国家政权、推翻社会主义制度等内容的活动，规定拟人化互动服务提供者的安全管理义务；完善网络用户权益保护制度，规定拟人化互动服务提供者的未成年人、老年人权益保护和个人信息保护等义务。此外，《办法》还规定了安全评估、算法备案、指导推动人工智能沙箱安全服务平台建设等制度。国家网信办有关负责人表示，拟人化互动服务的发展与治理需要政府、企业、社会、网民等多方参与，共同维护良好网络生态，促进人工智能向上向善。（新华社）", "ctime": 1775816351, "time_str": "18:19:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260410/c675905201.shtml"}, {"id": "4211811", "title": "“新三样”成拉动外贸增长重要引擎", "content": "在商务部今天举行的专题新闻发布会上，商务部外贸司负责人介绍，今年以来，我国出口商品呈现竞“智”逐“新”特点，高技术、高附加值、绿色低碳产品引领效果十分明显。电动汽车、锂电池、光伏产品“新三样”出口增长50.7%，成为拉动外贸增长重要引擎。跨境电商、保税维修这些新业态展现出蓬勃生机。新兴市场与传统市场协同发力，对共建“一带一路”国家进出口增长20%，对东盟、欧盟分别增长20.3%、19.9%。民营、外资、国有企业各具优势、协同互促，均实现较快增长。（央视新闻）", "ctime": 1775816315, "time_str": "18:18:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260410/c675905177.shtml"}, {"id": "4211807", "title": "人民同泰：2025年净利润1.34亿元，同比下降37.24%", "content": "人民同泰公告，2025年营业收入103.79亿元，同比增长3.29%。净利润1.34亿元，同比下降37.24%。公司拟定2025年度不进行利润分配，不进行资本公积金转增股本。", "ctime": 1775816147, "time_str": "18:15:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260410/c675905082.shtml"}, {"id": "4211803", "title": "华阳新材：拟1元转让全资子公司100%股权", "content": "华阳新材公告，拟将全资子公司山西华阳生物降解新材料有限责任公司100%股权以非公开协议方式转让给控股股东太原化学工业集团有限公司，转让价格为人民币1元。截至基准日，太化集团直接持有公司43.48%的股权，为公司的控股股东。本次交易尚需提交公司股东会审议。", "ctime": 1775816074, "time_str": "18:14:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260410/c675905039.shtml"}, {"id": "4211801", "title": "严管平台定价 中国互联网协会发布《互联网平台价格行为自律倡议》", "content": "中国互联网协会发布《互联网平台价格行为自律倡议》，围绕依法合规、自主定价、明码标价、抵制低价倾销、规范算法应用、杜绝价格串通、保障消费者选择权七个方面提出具体自律要求。倡议的发布是落实平台经济价格行为常态化自律管理、营造透明诚信市场环境的重要举措。中国互联网协会将持续引导互联网平台自觉遵守价格行为规范，共同维护公平有序的市场竞争秩序，助力平台经济高质量发展。（央视新闻）", "ctime": 1775816072, "time_str": "18:14:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_shar ，召回2025年9月1日至2025年10月13日期间生产的部分第十一代索纳塔汽车，共计953辆。本次召回范围内的车辆，因仪表控制器内的电源管理集成电路发生异常信号，可能导致仪表显示卡顿，方向指示灯开启时，仪表显示屏后侧方界面可能出现绿屏等故障，存在安全隐患。北京现代汽车有限公司将通过远程升级（OTA）技术为召回范围内的车辆免费升级软件，对于未能通过OTA技术升级的车辆，将通过授权经销商邀约相关用户实施召回，以消除安全隐患。（市场监管总局）", "ctime": 1775815660, "time_str": "18:07:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260410/c675904820.shtml"}, {"id": "4211781", "title": "魔法原子近三百台机器人即将亮相“苏超”开幕式", "content": "4月11日，2026年江苏省城市足球联赛开幕式将在常州举行。江苏本土具身智能科技企业魔法原子将以290台机器人完成集群展演。这是“苏超”这一体育超级IP首次引入超大规模机器人协同表演阵容。（人民财讯）", "ctime": 1775815641, "time_str": "18:07:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260410/c675904813.shtml"}, {"id": "4211779", "title": "凌霄泵业：2025年净利润4.55亿元，同比增长2.83%", "content": "凌霄泵业公告，2025年营业收入17.22亿元，同比增长8.17%；净利润4.55亿元，同比增长2.83%。公司董事会审议通过的利润分配预案为：以3.58亿为基数，向全体股东每10股派发现金红利10元（含税），送红股0股（含税），不以公积金转增股本。", "ctime": 1775815636, "time_str": "18:07:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260410/c675904807.shtml"}, {"id": "4211777", "title": "东风商用车召回15104辆东风牌汽车", "content": "日前，东风商用车有限公司根据《缺陷汽车产品召回管理条例》和《缺陷汽车产品召回管理条例实施办法》的要求，向国家市场监督管理总局备案了召回计划。召回编号S2026M0041V：自即日起，召回2025年4月1日至2025年12月9日期间生产的部分东风D560载货系列、D310载货系列、牵引KL系列、牵引纯电动系列汽车，共计15104辆。本次召回范围内的车辆，由于制造原因，部分前下防护总成热处理冷却不充分，导致强度不足，不符合相关国家标准要求，如果车辆发生碰撞，可能无法对其它道路使用者起到有效的防护作用，存在安全隐患。东风商用车有限公司将免费为召回范围内的车辆更换合格的前下防护总成，以消除安全隐患。（市场监管总局）", "ctime": 1775815627, "time_str": "18:07:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260410/c675904806.shtml"}, {"id": "4211775", "title": "灿瑞科技：董事长罗立权提议以1600万元-3200万元回购公司股份", "content": "灿瑞科技公告，董事长罗立权提议以1600万元-3200万元回购公司股份，回购价格不高于董事会通过回购股份决议前30个交易日公司股票交易均价的150%。", "ctime": 1775815616, "time_str": "18:06:56", "stock_code": "", "stock_name": "", "s const SECTORS  = [{"name": "金融", "hit_count": 47, "etfs": []}, {"name": "数据要素", "hit_count": 17, "etfs": []}, {"name": "新能源", "hit_count": 16, "etfs": []}, {"name": "人工智能", "hit_count": 16, "etfs": []}, {"name": "半导体", "hit_count": 13, "etfs": []}, {"name": "消费", "hit_count": 11, "etfs": []}, {"name": "医药", "hit_count": 11, "etfs": []}, {"name": "军工", "hit_count": 7, "etfs": []}];
const META     = {"update_time": "2026-04-10 18:36:48", "sentiment_score": 52.5974025974026, "agents": []};

// 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'

  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';

  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
