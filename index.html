const NEWS     = [{"id": "4314703", "title": "伊朗回应美国“引导”被困船只驶离霍尔木兹海峡", "content": "据伊朗伊斯兰共和国通讯社4日报道，伊朗外交部发言人巴加埃当天在回应美国“引导”被困船只驶离霍尔木兹海峡时说，“负责应对此类非法行动的人员已作好充分准备，也清楚如何捍卫伊朗的利益和安全”。巴加埃在新闻发布会上说：“伊朗已经表明，视自身为霍尔木兹海峡这一重要水道的守护者与保卫者。”伊朗伊斯兰共和国广播电视台4日早些时候援引伊朗武装部队哈塔姆安比亚中央总部高级官员阿卜杜拉希的话报道说，“我们警告任何外国武装力量，特别是侵略成性的美国军队，若其意图接近或进入霍尔木兹海峡，将遭到打击”。美国总统特朗普3日在社交媒体发文称，美国将于中东当地时间4日上午开始一项疏导行动，“引导”被困在霍尔木兹海峡的船只驶离海峡。(新华社)", "ctime": 1777886949, "time_str": "17:29:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260504/c676450150.shtml"}, {"id": "4314683", "title": "伊朗革命卫队：违规海上活动将面临“强制拦截”", "content": "伊朗伊斯兰革命卫队公共关系部副主管兼发言人萨达尔·侯赛因·穆哈比4日发布消息称，霍尔木兹海峡的管理流程没有发生任何变化。所有符合革命卫队海军所发布运输通行协议，并在指定路线内、经协调进行的民用与商用船舶航行，均是安全且有保障的。同时他指出，任何不符合革命卫队海军原则的海上活动，都将面临严重风险。违规船只将被强制拦截。所有航运公司及运输保险机构，必须严格关注革命卫队发布的相关通告。（央视新闻）", "ctime": 1777885308, "time_str": "17:01:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260504/c676450032.shtml"}, {"id": "4314681", "title": "伊朗公布伊控制下的霍尔木兹海峡地区新地图", "content": "当地时间5月4日，伊朗伊斯兰革命卫队海军当天公布了一份霍尔木兹海峡地区的新地图。伊朗伊斯兰革命卫队海军表示，由伊朗武装力量控制和管理的霍尔木兹海峡新区域范围为：南界为，连接伊朗穆巴拉克山（Kuh-e Mobarak）与阿联酋富查伊拉（Fujairah）南部的连线；西界为，连接伊朗格什姆岛（Qeshm Island）末端与阿联酋乌姆盖万（Umm Al Quwain）的连线。(央视新闻)", "ctime": 1777885289, "time_str": "17:01:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260504/c676450030.shtml"}, {"id": "4314643", "title": "朝媒批驳日本供奉和参拜靖国神社", "content": "近期，日本首相高市早苗向供奉有二战甲级战犯的靖国神社供奉祭品和祭祀费，大量日本政客集体参拜靖国神社。对此，朝鲜劳动党中央机关报《劳动新闻》、朝鲜中央通讯社先后发表文章予以批驳。题为《鼓吹军国主义的参拜闹剧》的文章称，日本一方面借靖国神社参拜，在全社会持续散播军国主义毒素；另一方面大肆歪曲历史、拆除束缚战争国家化的法律枷锁，疯狂扩充军备、强化武力。日本应当摒弃不切实际的妄想，深刻反省沾满罪孽的侵略过往，走上改过自新、和平发展的正道。文章《召唤靖国神社亡魂的新型军国主义狂热分子》表示，这些呼唤靖国神社亡灵的新军国主义狂热分子的丑态，无疑暴露出其执意重现过往侵略与战争行径的扩张野心，这必然是对国际社会追求和平与稳定愿景的公然挑战。（CCTV国际时讯）", "ctime": 1777884500, "time_str": "16:48:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260504/c676449960.shtml"}, {"id": "4314637", "title": "泽连斯基：乌欧一致同意加快推进落实无人机合作协议", "content": "当地时间5月4日，乌克兰总统泽连斯基在社交媒体发文透露，当天与欧盟委员会主席冯德莱恩举行重要会晤，就欧盟对乌援助及无人机领域安全合作展开磋商。双方一致同意将加快推进乌克兰与欧盟签署 “无人机协议”，并研讨相关安全合作的具体细节与落地细则。泽连斯基表示，乌方将完善安全合作配套基础设施，并已向乌军总参谋长、国家安全与国防事务委员会秘书及总统办公室外交团队下达相关任务，落实此次会谈共识，推动相关合作落地实施。（央视新闻）", "ctime": 1777884231, "time_str": "16:43:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260504/c676449950.shtml"}, {"id": "4314629", "title": "奥地利宣布驱逐3名俄罗斯外交官", "content": "当地时间4日，奥地利政府指控三名俄罗斯外交官从事间谍活动，宣布这三名俄罗斯外交官为“不受欢迎的人”。奥地利外长贝娅特·迈因尔-赖辛格在一份声明中表示：“利用外交豁免权从事间谍活动是不可接受的。”她同时证实，这三名外交官已离开奥地利。截至目前，俄罗斯方面暂无回应。（央视新闻）", "ctime": 1777883906, "time_str": "16:38:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260504/c676449938.shtml"}, {"id": "4314627", "title": "韩国油轮改道红海运油 首艘已安全驶离", "content": "韩国海洋水产部3日说，又一艘韩国籍油轮从沙特阿拉伯延布港装货后，经红海航道返回本国。这是霍尔木兹海峡通行受阻以来，韩国油轮第二次通过该替代路线运回原油。该油轮当天已安全驶离红海。海洋水产部提供了24小时实时监控和航行安全信息，并与船只及其运营方保持实时沟通，以确保船只和船员安全。（央视新闻）", "ctime": 1777883446, "time_str": "16:30:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260504/c676449909.shtml"}, {"id": "4314621", "title": "伊朗外交部强烈谴责美国针对古巴的威胁", "content": "伊朗外交部发言人巴加埃4日在回应“美国近期对古巴的威胁”问题时表示，在拉丁美洲地区正在发生的相关行动令人非常担忧，同时也反映出美国长期以来的一种行为模式。他指出，美国在过去几十年中一直表明，其并不尊重国家主权与政治独立，任何试图保持独立发展道路的国家，都会以各种借口遭到美国的施压与干涉。他表示，伊朗强烈谴责美国针对古巴的行为，并强调美国对古巴的封锁给古巴人民带来了巨大痛苦，这些行为明显违反国际法、人权法以及人道主义法。（央视新闻）", "ctime": 1777883123, "time_str": "16:25:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260504/c676449891.shtml"}, {"id": "4314599", "title": "伊朗外交部：将继续与阿曼磋商霍尔木兹海峡通行及管理机制", "content": "当地时间5月4日，针对此前伊朗外长出访并与阿曼讨论霍尔木兹海峡新的通行机制一事，伊朗外交部发言人巴加埃表示，伊朗与阿曼同为霍尔木兹海峡沿岸国家，双方对维护这一战略水道的航运安全负有共同责任，会谈的重点在于制定明确的协议与机制，以确保船只安全通行，会谈期间既讨论了该问题的法律层面，也就未来推进路径交换意见，强调双边协调以及与相关国际机构的磋商。巴加埃透露，预计这些对话将在未来几天继续进行。（央视新闻）", "ctime": 1777882430, "time_str": "16:13:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260504/c676449861.shtml"}, {"id": "4314593", "title": "港股收评：恒生指数涨1.24%，恒生科技指数涨2.16%", "content": "港股收盘，恒生指数涨1.24%，恒生科技指数涨2.16%。板块方面，半导体产品与设备、客运航空公司板块涨幅靠前；酒店和度假村REIT、燃气板块跌幅靠前。个股方面，天数智芯涨20.22%，轻松健康涨18.86%，群核科技涨18.63%，剑桥科技涨16.39%，曦智科技-P涨15.23%；先导智能跌8.67%，应星控股跌6.75%，康方生物跌5.89%，四川成渝高速公路跌5.61%，浙江沪杭甬跌5.28%。", "ctime": 1777882208, "time_str": "16:10:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260504/c676449848.shtml"}, {"id": "4314591", "title": "波音因737 MAX坠机事故再遭民事起诉", "content": "美国波音公司将于4日在芝加哥联邦法院出庭，就一起与2019年埃塞俄比亚航空公司波音737 MAX客机坠机事故有关的民事诉讼应诉。原告系事故遇难者萨米娅·斯图莫的家属。斯图莫是一名美国籍非政府组织工作人员，2019年3月前往肯尼亚工作时，在上述坠机事故中丧生。2018年10月和2019年3月，印度尼西亚狮子航空公司和埃塞俄比亚航空公司分别发生空难，总计346人丧生，失事飞机均为波音737 MAX客机，且都关联客机的机动特性增强系统的自动防失速软件错误激活。（央视新闻）", "ctime": 1777882081, "time_str": "16:08:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260504/c676449839.shtml"}, {"id": "4314589", "title": "美股大型科技股盘前涨跌互现，英伟达涨0.5%", "content": "美股大型科技股盘前涨跌互现，特斯拉、英伟达涨0.5%，Meta、谷歌A涨0.4%，亚马逊持平，苹果跌0.1%，微软跌0.2%。", "ctime": 1777881687, "time_str": "16:01:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260504/c676449807.shtml"}, {"id": "4314587", "title": "美股中概股盘前多数上涨，蔚来涨3%", "content": "美股中概股盘前多数上涨，蔚来涨3%，富途控股、阿里巴巴涨2%，理想汽车涨1%，拼多多涨0.6%，百度涨0.5%，携程、网易跌1%。", "ctime": 1777881676, "time_str": "16:01:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260504/c676449806.shtml"}, {"id": "4314585", "title": "美光科技美股盘前涨超3%", "content": "美光科技美股盘前涨超3%，现报559.52美元。", "ctime": 1777881656, "time_str": "16:00:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260504/c676449805.shtml"}, {"id": "4314583", "title": "台积电美股盘前涨超2%", "content": "台积电美股盘前涨超2%，现报407.346美元。", "ctime": 1777881646, "time_str": "16:00:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260504/c676449803.shtml"}, {"id": "4314581", "title": "布伦特原油站上110美元/桶", "content": "布伦特原油站上110美元/桶，日内涨1.98%。", "ctime": 1777881616, "time_str": "16:00:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260504/c676449801.shtml"}, {"id": "4314569", "title": "绕开霍尔木兹海峡韩国油轮再经红海运油", "content": "据韩国政府发布的消息，又一艘韩国籍油轮从沙特阿拉伯延布港装货后，经红海航道返回本国。这是霍尔木兹海峡通行受阻以来，韩国油轮第二次通过该替代路线运回原油。韩国海洋水产部3日说，该油轮当天已安全驶离红海。这一过程中，海洋水产部提供了24小时实时监控和航行安全信息，并与船只及其运营方保持实时沟通，以确保船只和船员安全。此前，韩国海洋水产部于4月17日发布消息说，首艘韩国油轮在延布港装载原油后安全驶离红海。新一轮巴以冲突2023年10月爆发后，也门胡塞武装不时对穿行红海的西方船只发动袭击，韩国政府曾建议本国船只避开红海水域。美国和以色列2月底对伊朗发动军事行动后，霍尔木兹海峡通行持续受阻，韩国政府4月批准了改道红海运油的方案。韩国能源高度依赖进口，约七成原油来自中东地区，其中95%以上经由霍尔木兹海峡运输。韩国4月向中东和中亚地区派出特使，寻求可绕开霍尔木兹海峡的原油供应替代渠道。(新华社)", "ctime": 1777881584, "time_str": "15:59:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260504/c676449799.shtml"}, {"id": "4314551", "title": "伊朗外交部：美方所提相关议题目前仍在审议中", "content": "当地时间4日，伊朗外交部发言人巴加埃表示，美国方面提出的相关议题目前仍在审查之中，考虑到美方一贯提出过分且不合理的要求，其提出的条件可能会使任何外交进程复杂化甚至受阻。他强调，当前对话与信息传递的唯一主题是——全面结束战争。他表示，当前地区局势，是美国及以色列对伊朗领土进行军事干预和侵犯的直接结果。美国政府应当明白，对伊朗人民使用威胁与强权毫无效果，重蹈覆辙只会让其在地区和国际社会中陷入自己制造的泥潭，更加难以自拔。（央视新闻）", "ctime": 1777881198, "time_str": "15:53:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260504/c676449782.shtml"}, {"id": "4314545", "title": "全国铁路迎来假期返程客流高峰", "content": "记者4日从中国国家铁路集团有限公司获悉，5月3日，全国铁路发送旅客1859.8万人次，运输安全平稳有序。5月4日，全国铁路预计发送旅客2030万人次，计划加开旅客列车1641列。假期接近尾声，铁路迎来返程客流高峰，客流持续保持高位运行。从铁路12306车票预售情况看，4日热门出发城市主要有北京、广州、成都、上海、杭州、武汉、西安、南京、郑州、重庆；热门到达城市主要有北京、上海、广州、成都、杭州、深圳、武汉、郑州、西安、南京；南宁至广州、成都至西安、北京至上海、武汉至上海、长沙至武汉等热门区间客流集中。各地铁路部门积极应对返程客流高峰，细化站车服务措施，全力保障旅客平安有序返程。国铁北京局集团公司北京站开启急客和爱心绿色通道，北京南站启用南出口出租车调度站，为旅客提供便利。国铁武汉局集团公司汉口站加强空铁接驳，乘坐动车组可直达机场。国铁西安局集团公司开行“秦岭号”银发旅游专列，让“银发族”坐着火车畅游黑龙江、内蒙古、辽宁、河北等地。国铁乌鲁木齐局集团公司开行“新东方快车”旅游专列，方便旅客坐着火车游新疆。(新华社)", "ctime": 1777880695, "time_str": "15:44:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260504/c676449755.shtml"}, {"id": "4314539", "title": "北约秘书长：北约欧洲国家听懂特朗普的话了正落实美军请求", "content": "北约秘书长吕特5月4日在亚美尼亚举行的欧洲政治共同体峰会期间称，欧洲国家已经“领会了”美国总统特朗普“传达的信息”，目前正在确保落实有关美军使用其军事基地的协议。近来，特朗普一再指责一些北约国家在美国对伊朗的战争中“没有给予美国足够支持”。此前有消息称美国国防部正酝酿“对北约欧洲盟友的惩罚措施”。美国国防部5月1日宣布计划从德国撤出5000名美军。特朗普5月2日又称，美国从德国撤军人数将“远超5000人”。吕特称，“美方确实有些失望，但欧洲人听进去了，他们现在正在确保落实所有双边驻军协议。”北约成员国西班牙此前坚决表示，其领土上的军事基地“不能用于针对伊朗的战争”。而据吕特称，黑山、克罗地亚、罗马尼亚、葡萄牙、希腊、意大利、英国、法国和德国等其他北约国家“正在落实关于美军使用其基地及其他后勤支持的请求”。吕特还称，“越来越多的”欧洲国家正在波斯湾附近“预先部署扫雷舰等军事资产”，为“下一阶段”做好准备。(央视新闻)", "ctime": 1777880253, "time_str": "15:37:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260504/c676449740.shtml"}, {"id": "4314531", "title": "美联航一波音客机降落时失控，撞上公路灯柱和拖车", "content": "美国联合航空公司一架客机3日准备在美国新泽西州纽瓦克自由国际机场降落时，撞上附近高速公路上一根灯柱和一辆行驶中的拖车。客机最终安全降落，无人员受伤，拖车司机受轻伤。监管部门已展开调查。出事客机从意大利威尼斯起飞，搭载221名乘客和10名机组人员。美国联邦航空局声明说，这架波音飞机于当地时间14时左右撞上纽瓦克机场附近高速公路上的灯柱，客机轻微受损。据纽约州和新泽西州港务局声明，事故造成灯柱和拖车受损。拖车司机受轻伤，就医后出院。机场在确认跑道安全后恢复正常运转。新泽西州警方发言人说，客机机腹与灯柱和拖车发生碰撞。据美国媒体报道，纽瓦克自由国际机场一条跑道垂直于相邻的高速公路，进港航班会在公路上方低空飞行以准备降落。美联航方面表示，目前正评估客机受损情况，调查期间涉事机组将暂时停飞。美国联邦航空局和国家运输安全委员会已展开调查，初步调查报告定于30天内出具。(新华社)", "ctime": 1777879798, "time_str": "15:29:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260504/c676449706.shtml"}, {"id": "4314529", "title": "港股中原建业尾盘涨近80%", "content": "5月4日，中原建业上一交易日收涨逾40%，今日尾盘再涨近80%，截至发稿涨74.7%，报0.145港元，成交额5509.19万港元。", "ctime": 1777879430, "time_str": "15:23:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260504/c676449693.shtml"}, {"id": "4314525", "title": "欧盟称美军从德撤出时机令人意外 欧洲国家需加强在北约中的支柱性力量", "content": "当地时间4日，欧盟外交与安全政策高级代表卡拉斯表示，美国宣布计划从德国撤军5000名美军的时机令人意外，美军在欧洲不仅仅是为了保护欧洲利益，而且也是为了保护美国利益。她强调，计划从德国撤军5000名美军表明，欧盟国家需要加强其在北约中的支柱性力量，而且必须要做得更多。（央视新闻）", "ctime": 1777879254, "time_str": "15:20:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260504/c676449682.shtml"}, {"id": "4314519", "title": "伊朗中北部高速公路发生连环车祸，27人受伤", "content": "伊朗中北部一条高速公路发生4辆汽车连环相撞事故，造成27人受伤。事故发生后，救援人员立即赶赴现场进行处置，并将一名伤者送往医疗机构。（央视新闻）", "ctime": 1777878525, "time_str": "15:08:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260504/c676449644.shtml"}, {"id": "4314517", "title": "菲律宾火山地震研究所将东萨马省地震震级下调至6.0级", "content": "5月4日下午，菲律宾火山地震研究所将5月4日发生在东萨马省的地震等级从6.1级下调至6.0级，震源深度更正为56公里。（央视新闻）", "ctime": 1777878521, "time_str": "15:08:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260504/c676449643.shtml"}, {"id": "4314515", "title": "外交部发言人就孟加拉国外长卡利勒访华答记者问", "content": "外交部发言人就孟加拉国外长卡利勒访华答记者问。问：中方发布了孟加拉国外长卡利勒访华的消息。中方如何评价当前中孟关系？对此访有何期待？答：中国和孟加拉国是传统友好邻邦和全面战略合作伙伴。建交50多年来，两国始终在和平共处五项原则基础上发展友好关系，相互尊重、平等相待，双边关系持续稳定向前发展，给两国人民带来实实在在的利益。中方高度重视中孟关系，愿以此访为契机，同孟加拉国新政府一道努力，增进政治互信，深化各领域交流合作，高质量共建“一带一路”，推动中孟全面战略合作伙伴关系进一步向前发展。", "ctime": 1777878514, "time_str": "15:08:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260504/c676449642.shtml"}, {"id": "4314511", "title": "五一档票房破6亿！", "content": "据网络平台数据，截至5月4日，2026年度电影总票房（含预售）突破135亿元。五一档票房（含预售）突破6亿元。(央视新闻)", "ctime": 1777878267, "time_str": "15:04:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260504/c676449618.shtml"}, {"id": "4314509", "title": "孟加拉国外交部长卡利勒将访华", "content": "外交部发言人宣布：应中共中央政治局委员、外交部长王毅邀请，孟加拉国外交部长卡利勒将于5月5日至7日访问中国。(央视新闻)", "ctime": 1777878223, "time_str": "15:03:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260504/c676449615.shtml"}, {"id": "4314507", "title": "欧洲主要股指开盘集体下跌", "content": "欧洲主要股指开盘集体下跌，欧洲斯托克50指数跌0.14%，法国CAC40指数跌0.01%，德国DAX指数跌0.13%。", "ctime": 1777878196, "time_str": "15:03:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260504/c676449614.shtml"}, {"id": "4314491", "title": "法国政府批准拆除最老核电站", "content": "法国政府3日发布公告说，已授权法国电力公司拆除该国最早建成的核电站费斯内姆核电站。费斯内姆核电站位于法国东部阿尔萨斯地区，靠近德国边境，1977年投入运营，是法国使用时间最长的核电站。该核电站2020年关闭，乏燃料2022年移除。法国电力公司说，拆除核电站的前期准备工作已经完成，下一步将分四个阶段进行，头年工作重点是移除1号反应堆的3个蒸汽发生器和乏燃料储存仓。法国电力公司打算从2027年起在核电站原址建一个冶炼厂，处理核电站遗留的低放射性金属废料。这座新建工厂投资总额约4.5亿欧元（约合5.28亿美元），预计将于2031年投入运行，可处理至多50万吨金属。法国高度依赖核电。法国今年2月宣布一项扩展核能的计划，打算从2038年起新建6个或8个核反应堆，并将现有57个核反应堆的使用寿命延长至50年或60年。(新华社)", "ctime": 1777877962, "time_str": "14:59:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260504/c676449601.shtml"}, {"id": "4314489", "title": "韩国KOSPI指数收涨5.12%刷新历史新高", "content": "韩国KOSPI指数收盘上涨5.12%，报6936.99点，刷新历史新高。SK海力士收涨12.5%，创历史最高收盘价。三星电子收涨5.44%，创下历史最高收盘纪录。", "ctime": 1777877764, "time_str": "14:56:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260504/c676449599.shtml"}, {"id": "4314485", "title": "一艘被扣押伊朗货船上的22名船员被转移至巴基斯坦", "content": "巴基斯坦外交部4日发表声明说，作为与美国建立互信的措施，一艘被扣押的伊朗货船上的22名船员已被转移至巴基斯坦。(新华社)", "ctime": 1777877607, "time_str": "14:53:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260504/c676449590.shtml"}, {"id": "4314435", "title": "伊朗武装部队警告美军不要接近或进入霍尔木兹海峡", "content": "据伊朗媒体4日援引伊朗武装部队哈塔姆安比亚中央总部高级官员的话报道说，“我们警告任何外国武装力量，特别是侵略成性的美国军队，若其意图接近或进入霍尔木兹海峡，将遭到打击”。 (新华社)", "ctime": 1777874505, "time_str": "14:01:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260504/c676449391.shtml"}, {"id": "4314411", "title": "22 家公司境外业务收入超过千亿元", "content": "按照境外业务收入排序，2025 年境外收入 50 强显示，入围门槛由上一年的约 400 亿元提升至接近 442 亿元，头部企业更加集中。50 家公司 2025 年境外业务收入合计 6.43 万亿元，占全部 A 股总境外业务收入比重超半数。具体来看，22 家公司 2025 年境外收入超过千亿元，前 5 名依次是中国石油、工业富联、比亚迪、立讯精密、紫金矿业。", "ctime": 1777873210, "time_str": "13:40:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260504/c676449310.shtml"}, {"id": "4314383", "title": "美官员称霍尔木兹海峡护航倡议或不包含美舰直接护航", "content": "美国阿克西奥斯新闻网站3日援引两名美国官员的话报道，美国总统特朗普当天宣布的“引导”被困船只通过霍尔木兹海峡的行动，不一定包括美军舰艇直接护送商业船只。报道说，其中一名官员称，美国军舰将停留在霍尔木兹海峡“附近区域”，以便在必要时阻止伊朗军方对通过该海峡的商业船只发动袭击。两名官员还说，美军将向商业船只提供有关霍尔木兹海峡最优海上航线的信息，特别在涉及使用未被伊朗军方布设水雷的航道方面。 (新华社)", "ctime": 1777872461, "time_str": "13:27:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260504/c676449304.shtml"}, {"id": "4314379", "title": "豆包将在免费模式外新增付费订阅 官方回应", "content": "近日，豆包App Store页面出现付费版本服务声明。对此，豆包官方回应称，豆包始终提供免费服务，在免费服务的基础上，豆包也在探索推出更多增值服务，相关方案细节目前还在测试阶段。另据接近豆包的人士透露，付费功能将主要专注在复杂任务和生产力场景，如PPT生成、数据分析、影视制作等。随着模型能力持续升级，产品已经能满足越来越多的复杂高价值任务。但此类任务需消耗更多算力与推理时间，因此豆包计划上线付费服务，满足好这部分复杂场景需求。免费版本则继续面向用户的日常使用。 (第一财经)", "ctime": 1777872010, "time_str": "13:20:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260504/c676449303.shtml   } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
