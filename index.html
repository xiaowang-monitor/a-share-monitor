_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260730/c678546268.shtml"}, {"id": "4838753", "title": "汉得信息：重新递交H股发行上市申请并刊发申请资料", "content": "汉得信息公告，公司此前已披露拟发行H股并在香港联交所主板上市的计划。本次为进展更新，公司已于2026年7月29日向香港联交所重新递交本次发行并上市的申请，并于同日在香港联交所网站刊登了申请材料。该申请材料为草拟版本，所载资料可能适时更新，最终数据以经审计财务报告为准。本次发行上市尚需取得相关监管机构备案、批准或核准，仍存在不确定性。", "ctime": 1785383399, "time_str": "11:49:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260730/c678546074.shtml"}, {"id": "4838745", "title": "港深签署皇岗口岸“一地两检”合作安排及港方口岸区场地使用权协议", "content": "香港特区政府今日（30日）与深圳市人民政府签署《深圳市人民政府与香港特别行政区政府关于在皇岗口岸实施“一地两检”的合作安排》（《合作安排》），落实港深双方在重建后的皇岗口岸实施“一地两检”的合作框架。香港特区政府保安局与深圳市人民政府口岸办公室亦于同日签署《关于皇岗口岸港方口岸区及相关延伸区场地使用权协议》（《场地使用权协议》），由保安局副秘书长徐诗妍及深圳市人民政府口岸办公室主任刘卫翔代表签署。（大湾区之声）", "ctime": 1785383011, "time_str": "11:43:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260730/c678545879.shtml"}, {"id": "4838721", "title": "世界最大直径高铁盾构机成功穿越长江", "content": "30日上午，世界最大直径高铁盾构机——崇太长江隧道“领航号”，成功穿越长江水域，实现崇太长江隧道水域段盾构隧道贯通，为我国首次实现高铁时速350公里“穿江不减速”奠定基础。崇太长江隧道是国家“两重”项目沪渝蓉高铁沪宁段的控制性“咽喉”工程，连接上海崇明与江苏太仓，隧道全长1.43万米。该工程由上海国铁建管公司建设，中铁隧道局施工，是目前我国建设标准最高、施工难度最大的高铁越江隧道工程之一。中铁隧道局崇太长江隧道项目总工程师李斌介绍说，高铁全速过江需要满足三大条件——一是隧道的洞口必须是大直径，二是隧道笔直，三是隧道结构必须稳定。但要达到以上三个条件，施工难度极大，存在很多不可预知的风险。（新华社）", "ctime": 1785382534, "time_str": "11:35:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260730/c678545500.shtml"}, {"id": "4838707", "title": "A股午评：创业板指低开低走跌5.89% AI硬件方向大幅领跌", "content": "截至午盘，上证指数跌1.15%，深证成指跌3.79%，创业板指跌5.89%，北证50跌0.46%。三市成交额14627亿元，较上日缩量269亿元。全市场超3400家个股下跌。\n盘面上，白酒板块再度走高，金种子酒、舍得酒业、金徽酒涨停，皇台酒业、口子窖、酒鬼酒、迎驾贡酒、洋河股份跟涨。教育板块持续走高，传智教育4连板，学大教育涨停，创业黑马、昂立教育、华图山鼎、凯文教育、科德教育跟涨。汽车整车板块表现强势，江淮汽车涨停，北汽蓝谷、赛力斯、金龙汽车、千里科技、长安汽车跟涨。电子化学品板块低开低走，天通股份、宏和科技触及跌停，三孚新科、唯特偶、天承科技、广钢气体、中巨芯、思泉新材跌超10%，安集科技、中石科技、海星股份、莱特光电、方邦股份跟跌。半导体持续走弱，全志科技、有研硅、微导纳米、华虹宏力等数十个个股跌超10%。元件板块再度弱势，东山精密、兴森科技、江海股份、深南电路、广合科技、红板科技触及跌停，中富电路跌超15%，胜宏科技、科翔股份、中英科技、生益电子跌超10%，鹏鼎控股、景旺电子、迅捷兴、沪电股份、金安国纪跟跌。", "ctime": 1785382420, "time_str": "11:33:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260730/c678545379.shtml"}, {"id": "4838693", "title": "ETF两市成交额报2978.16亿元，较昨日此时缩量125.9亿元", "content": "截至目前，ETF两市成交额报2978.16亿元，较昨日此时缩量125.9亿元，分类型来看，股票型ETF成交额1366.6亿元，债券型ETF成交额968.18亿元，货币型ETF成交额100.93亿元，商品型ETF成交额39.43亿元，QDII型ETF成交额499.54亿元。", "ctime": 1785382311, "time_str": "11:31:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260730/c678545284.shtml"}, {"id": "4838695", "title": "再放量！创业板ETF易方达半日近百亿成交", "content": "截至上午收盘，创业板ETF易方达（159915）成交额95.41亿元、科创50ETF华夏（588000）成交额91.69亿元，均较此前半日成交额显著放量。", "ctime": 1785382308, "time_str": "11:31:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260730/c678545287.shtml"}, {"id": "4838691", "title": "ETF午评：酒ETF领涨3.90%，通信ETF领跌9.89%", "content": "ETF午间收盘涨跌不一，酒ETF（512690）领涨3.90%，消费ETF（159928）涨2.80%，汽车ETF（516840）涨2.78%，通信ETF（159583）领跌9.89%，通信ETF（515880）跌9.8%，通信ETF（159994）跌9.47%。", "ctime": 1785382278, "time_str": "11:31:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260730/c678545263.shtml"}, {"id": "4838673", "title": "股指期货早盘收盘 主力合约全线下跌", "content": "股指期货早盘收盘，主力合约全线下跌。沪深300股指期货(IF)主力合约跌2.17%，上证50股指期货(IH)主力合约跌0.61%，中证500股指期货(IC)主力合约跌3.73%，中证1000股指期货(IM)主力合约跌2.78%。", "ctime": 1785382218, "time_str": "11:30:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260730/c678545215.shtml"}, {"id": "4838667", "title": "巴西里约热内卢等地遭遇强风 5人死亡", "content": "巴西局部地区29日遭遇强风，里约热内卢市和圣保罗州部分地区一度出现停电和公共交通瘫痪，5人死于强风导致的事故。据悉，当地早高峰时段前不久，时速100公里的强风突袭里约热内卢市一带，令居民猝不及防。该市三条地铁线路全部停运，受困人数高达数千。当地消防部门发表声明说，强风导致里约热内卢市超过90棵树木倒伏；市内有两人因墙体倒塌身亡。该市多地一度停电，不过现已恢复供电。在圣保罗州桑托斯市，阵风时速高达111公里，造成大范围破坏，一名无家可归者被倒下的树木砸中身亡。强风还影响到里约热内卢和圣保罗的多家机场运营。里约市中心主要经营国内航线的圣杜蒙特机场在一份声明中说，该机场因强风停运约两个小时。里约市政厅说，强风由来自海洋的冷锋逼近所致。（央视新闻）", "ctime": 1785382052, "time_str": "11:27:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260730/c678545049.shtml"}, {"id": "4838665", "title": "日本熊本地震已致28人死亡，供电供水设施受损", "content": "日本内阁官房长官木原稔30日在记者会上表示，截至当天6时30分，熊本地震已致28人死亡。熊本县灾害对策总部当日早些时候说，此次地震已确认造成17人死亡、6人心肺停止、5人重伤，另有至少1人下落不明。当地时间28日16时27分许，熊本县发生7.1级地震，随后余震不断。（新华社）", "ctime": 1785381959, "time_str": "11:25:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260730/c678544996.shtml"}, {"id": "4838659", "title": "日本首相高市早苗计划明年4月起将食品消费税降至1%", "content": "据日本自民党高层透露，日本首相高市早苗已决定从2027年4月起，暂时将食品和不含酒精饮料的消费税率降至1%，为期两年。（新浪财经）", "ctime": 1785381900, "time_str": "11:25:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260730/c678544948.shtml"}, {"id": "4838655", "title": "美媒：沙特国防大臣访美 希望缓和地区局势", "content": "据美国阿克西奥斯新闻网站29日报道，在美国和沙特阿拉伯军队对伊拉克什叶派民兵武装发动空袭后，沙特国防大臣哈立德·本·萨勒曼29日在华盛顿同美国副总统万斯会晤时表示，沙特王储穆罕默德有意缓和与伊朗的紧张局势。报道说，哈立德会晤万斯时表示，伊拉克亲伊朗民兵组织针对沙特基础设施和能源设施的袭击触及了红线，沙特必须作出回应。“王储希望向万斯传达这样的信息：在伊拉克的打击行动并不意味着沙特主张局势升级，而是表明沙特在必要时已准备好自卫。”（新华社）", "ctime": 1785381733, "time_str": "11:22:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260730/c678544823.shtml"}, {"id": "4838649", "title": "富时中国A50指数期货盘中跌超2%", "content": "富时中国A50指数期货盘中跌超2%。", "ctime": 1785381637, "time_str": "11:20:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260730/c678544728.shtml"}, {"id": "4838643", 日气温创历史新高，釜山市气温打破122年来最高纪录；首都首尔市当天也发布高温预警。韩国气象厅数据显示，韩国东南部庆尚南道梁山市29日午后出现40.3摄氏度高温，创下2008年以来最高气温纪录。据韩国方面消息，这是韩国连续第三年有地区气温超过40摄氏度。梁山市26日出现39.3摄氏度高温，追平2024年的高温纪录。釜山市当天午后测得38.8摄氏度气温，创下1904年有气象记录以来最高温纪录。釜山此前最高气温纪录为2016年测得的37.3摄氏度。首尔市南部地区29日午后体感温度达到35.1摄氏度。韩国气象厅当天早些时候把首尔市东部和西南部部分地区的高温预警级别由“注意”升至“警报”。这是首尔今年入夏以来，韩国气象厅第二次发布高温警报。据韩国方面说法，发布高温“警报”标准为最高体感温度在35摄氏度以上的天气持续两天以上，或高温天气可能会在广大地区造成重大损失；“注意”则为最高体感温度在33摄氏度以上的天气持续两天以上，或高温天气可能会造成重大损失。（央视新闻）", "ctime": 1785379826, "time_str": "10:50:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260730/c678543414.shtml"}, {"id": "4838463", "title": "2026上半年国内游戏市场收入超1884亿元，同比增长超12%", "content": "7月30日，在ChinaJoy期间举办的CDEC高峰论坛上，中国音像与数字出版协会第一副理事长张毅君发布了《2026年1-6月中国游戏产业报告》。报告显示，2026上半年国内游戏市场实际销售收入1884.5亿元，同比增长12.17%。截至6月，我国游戏用户规模6.84亿，同比增长0.82%。在游戏出海方面我国继续保持高增长，上半年自研游戏海外市场实际销售收入123.72亿美元，同比增长30.2%。同时小游戏也仍有亮眼增速，上半年小程序移动游戏市场收入316.6亿，同比增长约36%。张毅君提到，上半年游戏产业规模增幅显著，AI技术全面渗透，游戏经济日趋壮大。（第一财经）", "ctime": 1785378918, "time_str": "10:35:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260730/c678542751.shtml"}, {"id": "4838457", "title": "广东金融监管局：辖内AIC股权投资试点加速加力 15支大行系基金规模近200亿", "content": "今日广东金融监管局副局长曹光群在上半年新闻通气会上透露，目前广东辖内AIC股权投资试点加速加力，15支大行系AIC基金完成工商登记，基金规模合计198亿元，已落地14个项目，投资金额合计29亿元。去年在广州开业的信银AIC目前已投放项目8个，金额50.64亿元。(财联社)", "ctime": 1785378887, "time_str": "10:34:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260730/c678542734.shtml"}, {"id": "4838423", "title": "我国自研世界最大直径高铁盾构机成功穿越长江", "content": "30日上午，我国自主研制的世界最大直径高铁盾构机——崇太长江隧道“领航号”，成功穿越长江水域，实现崇太长江隧道水域段盾构隧道贯通。崇太长江隧道建成运营后，将结束我国第三大岛崇明岛不通高铁的历史。(央视新闻)", "ctime": 1785378626, "time_str": "10:30:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260730/c678542579.shtml"}, {"id": "4838417", "title": "德国拟立法允许使用AI辅助审核移民申请", "content": "德国内阁29日提交一项法案草案，拟允许移民官员在审核庇护、签证和居留许可申请时使用人工智能(AI)辅助处理，以提升办事效率。据德新社报道，德国政府处理的移民申请数量长期处于高位，而政府部门人手不足。在此背景下，使用人工智能辅助审核的法案获内阁批准。根据法案，移民官员可使用人工智能自动将申请人陈述中的可疑内容同网上公开数据比对，从而核查申请信息。此外，移民官员可借助人工智能分析已办结的申请案例，从中总结决策模式、统一处理标准、找出可提升效率的环节。依据这一法案，德国外交部、联邦移民和难民事务局和地方移民管理部门可使用移民申请数据训练、验证和测试人工智能模型。根据德国政府的说法，人工智能只是作为辅助，移民申请的法律评估和最终决定仍将由移民官员作出。（新华社）", "ctime": 1785378423, "time_str": "10:27:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260730/c678542442.shtml"}, {"id": "4838413", "title": "科创50指数跌幅扩大至4%", "content": "科创50指数跌幅扩大至4%，现报1611.88点。", "ctime": 1785378406, "time_str": "10:26:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260730/c678542436.shtml"}, {"id": "4838409", "title": "创业板指跌4%", "content": "创业板指跌幅扩大至4%，上证指数跌0.37%，深证成指跌2.44%。", "ctime": 1785378382, "time_str": "10:26:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260730/c678542426.shtml"}, {"id": "4838401", "title": "沪深京三市成交额超1万亿元，较上日此时缩量296亿元", "content": "据同花顺iFinD数据，沪深京三市成交额超1万亿元，较上日此时缩量296亿元，预计全天成交金额约2.2万亿元。截至目前，沪市成交额4494亿元，深市成交额5447亿元，北证50成交额70亿元。", "ctime": 1785378352, "time_str": "10:25:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260730/c678542410.shtml"}, {"id": "4838395", "title": "俄罗斯寻求逮捕“电报”创始人", "content": "俄罗斯联邦安全局29日发布声明，寻求逮捕社交媒体“电报”创始人、首席执行官帕维尔·杜罗夫，他因涉嫌协助恐怖活动受到刑事指控，被列入全球通缉名单。俄联邦安全局在声明中说，乌克兰情报部门利用“电报”平台的频道、聊天工具密谋在俄罗斯境内搞破坏、支持恐怖主义活动、谋杀及网络诈骗，导致重大人员伤亡及数十亿美元财产损失，而“电报”管理方没有删除上述频道和聊天工具。依据俄罗斯刑法，对杜罗夫提起刑事指控并把他列入全球通缉名单。（新华社）", "ctime": 1785378289, "time_str": "10:24:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260730/c678542369.shtml"}, {" // 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
