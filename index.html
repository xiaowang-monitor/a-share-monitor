om.cn/20260907/c679650940.shtml"}, {"id": "5118675", "title": "多地“十五五”规划提就业影响评估，将新技术就业影响纳入监测", "content": "近日，多地陆续公布“十五五”就业、人力资源社会保障领域规划，在就业方面作出新的政策安排。《四川省就业促进“十五五”规划》提出，建立健全就业影响评估机制，完善就业失业监测预警和就业风险防控体系。《重庆市“十五五”人力资源和社会保障事业发展规划（2026—2030年）》提出，优先支持吸纳就业能力较强的政策、项目和生产力布局，探索就业友好型人工智能技术发展路径；当天发布的规划解读还提出，开展新增高质量就业岗位调查。上海、湖北等地近期公布的“十五五”规划中，也出现类似安排。上海提出，对重大政策制定、重大项目确定、重大生产力布局开展岗位创造和失业风险评估；湖北提出健全就业影响评估和监测预警机制，积极应对人工智能等新技术发展对就业的影响。从这些规划看，与以往强调稳就业、扩岗位相比，“十五五”时期就业政策的关注点进一步前移：在产业和项目布局时提前评估就业影响，加强岗位需求预测，同时关注人工智能等新技术带来的岗位结构和技能需求变化。（新京报）", "ctime": 1788760947, "time_str": "14:02:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260907/c679650906.shtml"}, {"id": "5118347", "title": "文化传媒板块短线拉升，读者传媒涨停", "content": "文化传媒板块短线拉升，读者传媒涨停，龙版传媒、三人行此前封板，凡拓数创、中国出版、荣信文化跟涨。", "ctime": 1788760230, "time_str": "13:50:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260907/c679650668.shtml"}, {"id": "5118343", "title": "机构：上半年全球AMOLED手机面板出货量同比增长3.8%", "content": "根据CINNO Research统计数据显示，2026年上半年全球市场AMOLED智能手机面板出货量约4.3亿片，同比增长3.8%，整体表现优于预期。尽管智能手机终端市场面临需求疲软的压力，但苹果与三星等头部品牌凭借稳固的供应链优势与较强的盈利韧性，维持了稳定的采购节奏，成为拉动出货增长的重要支撑。与此同时，面对后续市场的不确定性，部分国产面板厂商为维持产线稼动率并规避潜在的成本上涨风险，主动将部分未来需求前置释放，进一步推高了上半年的出货量。此外，在消费意愿趋于保守、新机换机周期延长的背景下，手机维修市场的需求显著提升，为整体出货提供了额外增量。（界面新闻）", "ctime": 1788760127, "time_str": "13:48:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260907/c679650639.shtml"}, {"id": "5118341", "title": "北京AI产投基金入股3D算力芯片研发商算苗科技", "content": "企查查APP显示，近日，算苗科技（北京）有限公司发生工商变更，新增北京市人工智能产业投资基金（有限合伙）等为股东，同时注册资本增至134.96万元。企查查信息显示，该公司成立于2022年，经营范围包含：集成电路销售；集成电路芯片设计及服务；集成电路芯片及产品制造；集成电路芯片及产品销售等。公开信息显示，该公司是一家3D算力芯片研发商。（人民财讯）", "ctime": 1788760115, "time_str": "13:48:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260907/c679650614.shtml"}, {"id": "5118303", "title": "中科世通亨奇完成近5亿元B系列融资", "content": "智能决策基础设施服务商中科世通亨奇（北京）科技有限公司（下称“中科世通亨奇”）近日宣布完成近5亿元B系列融资。本轮融资由中国兵器集团下属南方德茂基金、北京市信息产业基金、联通创投、厚纪资本、太平科创基金、广发信德、芯能创投等机构共同投资，老股东乐礼资本连续三次加注。此轮募集资金将重点用于AOS核心技术研发、“世通灵境”产品体系升级、行业生态建设及重点市场拓展，推动公司从国防等高可信场景向运营商、金融、能源电力、政府治理等关键行业复制。（科创板日报）", "ctime": 1788759865, "time_str": "13:44:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260907/c679650478.shtml"}, {"id": "5118301", "title": "NYMEX取暖油主力合约涨超2%", "content": "NYMEX取暖油主力合约涨超2%，现报4.64美元/加仑。", "ctime": 1788759852, "time_str": "13:44:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260907/c679650474.shtml"}, {"id": "5118297", "title": "1.2亿播放量创收80元？六连板龙版传媒回应", "content": "针对市场广泛争议的“80元营收”及信披违规问题，公司方面回应称，公告中披露的“AI视频业务6月产生营收约80元”确定来自AI漫剧《穿越1988》，并解释称因该剧上线时间较晚，收入较低可以理解。对于信披前后矛盾的原因，该工作人员仅回应“请关注后续公告，我们会把可以对外公开的都在公告中对外披露”。对于股价与基本面偏离的问题，该工作人员表示：“公司已经关注到股价连续涨停并发布股价异动公告，公司也会持续关注。” (蓝鲸新闻)", "ctime": 1788759749, "time_str": "13:42:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260907/c679650421.shtml"}, {"id": "5118245", "title": "2026国谈第三日下午场：百济神州、科伦博泰、罗氏、第一三共登场", "content": "今日13时许，2026年国家基本医保药品目录谈判竞价及商保创新药目录价格协商第三日下午场开启，记者在现场观察到，科伦博泰、百济神州、罗氏、阿斯利康、恒瑞医药、第一三共、诺华、皮尔法伯、赛诺菲、百时美施贵宝、辉瑞等国内外企业入场谈判，谈判企业约20家。（财联社）", "ctime": 1788759343, "time_str": "13:35:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260907/c679650187.shtml"}, {"id": "5118223", "title": "温氏股份：预计8月份公司养鸡业务实现扭亏为盈", "content": "温氏股份近日在券商策略会、路演活动中表示，上半年，受中华土鸡（黄羽肉鸡）行情低迷影响，公司养鸡业务小幅亏损约1亿元。8月份以来，受旺季需求提升等因素影响，鸡价快速回暖，近期达到约6.9元/斤。按照测算，预计8月份公司养鸡业务实现扭亏为盈。（人民财讯）", "ctime": 1788759209, "time_str": "13:33:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260907/c679650149.shtml"}, {"id": "5118215", "title": "培育钻石板块走高，恒盛能源涨停", "content": "培育钻石板块走高，恒盛能源涨停，沃尔德、英诺激光、四方达、惠丰钻石、国力电子跟涨。", "ctime": 1788759167, "time_str": "13:32:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260907/c679650075.shtml"}, {"id": "5118213", "title": "午后持续走高，多只通信、双创ETF涨幅居前", "content": "午后科技板块持续走高。通信ETF华夏（515050）、通信ETF国泰（515880）等多只通信ETF涨超6%，科创成长ETF广发（588110）、科创成长ETF易方达（588020）等科创成长ETF涨超5%，创业板成长ETF华夏（159967）、创业板成长ETF易方达（159597）等创业板成长ETF涨幅居前。", "ctime": 1788759159, "time_str": "13:32:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260907/c679650072.shtml"}, {"id": "5118207", "title": "东方证券：维持比亚迪“买入”评级，海外销量继续高增长", "content": "东方证券研报指出，比亚迪国内销量持续环比改善，海外销量继续高增长。8月公司销量44.03万辆，同比增长17.8%，环比增长5.0%；1-8月累计销量266.8万辆，同比下降6.8%。8月公司海外销量18.95万辆再创新高，同比增长134.4%，环比增长4.9%，海外销量占比43.0%。在欧洲市场，公司新能源车型销量在西班牙、意大利、英国等市场位居首位。公司海外闪充战略、多动力车型投放及本地化生产布局将有望持续助力公司海外销量及市场份额提升，2026上半年公司海外业务营收首次超过国内，预计未来海外市场将成为公司核心增长极。国内销量环比继续改善，中高端车型销售占比提升将促进公司国内盈利能力修复。该行预测2026-2028年EPS分别为4.64、5.39、6.18元，维持可比公司2026年PE平均估值27倍，目标价为125.28元，维持“买入”评级。（新浪财经）", "ctime": 1788759110, "time_str": "13:31:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260907/c679650060.shtml"}, {"id": "5118167", "title": "非金属材料板块震荡走高，太力科技涨超17%", "content": "非金属材料板块震荡走高，太力科技涨超17%，长江材料、坤彩科技此前涨停，金博股份、联瑞新材、金戈新材跟涨。", "ctime": 1788758908, "time_str": "13:28:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260907/c679649965.shtml"}, {"id": "5118155", "title": "530.4公斤！杂交水稻大面积超高产制种亩产创新高", "content": "今天（7日），湖南省农学会联合中国水稻研究所、武汉大学等多所高校和单位知名专家学者组成的测产团队，在湖南邵阳绥宁县开展杂交水稻大面积超高产制种现场测产活动，测得绥宁县武阳镇布局超级稻爽两优138大面积制种示范片，亩产达530.4公斤，首次突破1000斤大关。（央视新闻）", "ctime": 1788758787, "time_str": "13:26:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260907/c679649936.shtml"}, {"id": "5118139", "title": "CPO板块震荡走高，光迅科技触及涨停", "content": "CPO板块震荡走高，光迅科技触及涨停，此前剑桥科技、兴森科技、铭普光磁等十余股涨停，中际旭创涨近10%，仕佳光子、罗博特科、太辰光跟涨。", "ctime": 1788758462, "time_str": "13:21:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260907/c679649857.shtml"}, {"id": "5118135", "title": "以军再袭加沙 包括儿童在内至少4人死亡", "content": "以色列军队6日继续空袭加沙地带，造成至少4人死亡，其中包括两名儿童。加沙地带最大医疗机构希法医院的管理人员说，以军当天空袭加沙城西部，击中一辆汽车，造成一名男子及其8岁女儿死亡，另致6人受伤。以色列军方发言人称，这次袭击的目标是一名巴勒斯坦伊斯兰抵抗运动（哈马斯）武装人员。加沙地带医务人员说，以军6日晚些时候又在加沙城实施两次袭击：一名男子在加沙城东部一家电信公司附近遭袭死亡；以军坦克在一所收留无家可归人员的学校附近撞死一名7岁女童。（央视新闻）", "ctime": 1788758452, "time_str": "13:20:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260907/c679649856.shtml"}, {"id": "5118105", "title": "创业板指涨3%", "content": "创业板指涨幅扩大至3%，上证指数跌0.16%，深证成指涨1.6%。", "ctime": 1788758334, "time_str": "13:18:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260907/c679649844.shtml"}, {"id": "5118087", "title": "成都成立调查组查处监测报告造假企业", "content": "央视总台《财经调查》曝光了多地环境监测机构出具虚假环境合格的监测报告，这些公司对国家条例规定置若罔闻。从采样到报告出具，处处作假，给环境治理埋下了隐患。记者调查发现，西南地区的力博检测有限公司在油气田土壤采样工作过程中，存在使用违规工具、采样深度不达标、编造无实测项目数据等问题。节目播出后，成都市成华区高度重视，第一时间成立由生态环境、市场监管、公安等部门组成的联合调查组，在四川省、成都市相关部门指导下，连夜开展执法检查，对相关证据登记保存，对企业负责人及相关人员进行调查询问。目前调查工作正在进一步开展中。（财联社）", "ctime": 1788758204, "time_str": "13:16:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260907/c679649820.shtml"}, {"id": "5118051", "title": "霍尔木兹海峡通航量降至5月来最低", "content": "最新国际航运数据显示，截至本月6日的10天内，平均每日仅有10艘商业船舶通过霍尔木兹海峡，数量为5月以来最低，凸显美国和伊朗近期海上互袭对商业航运的冲击。根据总部位于比利时的克普勒公司发布的数据，截至5日霍尔木兹海峡日均通航量接近13艘，截至4日的对应数据超过15艘。6日有5艘船通过该海峡，5日则仅有两艘。自2日以来，没有任何超大型油轮驶出霍尔木兹海峡。(新华社)", "ctime": 1788757563, "time_str": "13:06:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260907/c679649736.shtml"}, {"id": "5118031", "title": "科创50指数涨幅扩大至2%", "content": "科创50指数涨幅扩大至2%，现报1608.56点。", "ctime": 1788757261, "time_str": "13:01:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260907/c679649694.shtml"}, {"id": "5118023", "title": "消息称1c nm有望2027年初成为SK海力士主流工艺", "content": "SK海力士正在迅速扩大其第六代10nm级DRAM工艺1c nm产能份额。由于1c DRAM将作为核心芯片堆叠HBM，并应用于下一代高带宽内存，该公司正在加速其工艺转型。据业内人士透露，SK海力士1c DRAM的市场份额从今年第一季度的约10%增长到第二季度的13%左右，预计第三季度将升至24%左右，第四季度将达到34%左右。明年第一季度，1c nm的市场份额有望攀升至35%左右，首次超过1b（33%左右），成为主流工艺。（ChosunBiz）", "ctime": 1788757175, "time_str": "12:59:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260907/c679649685.shtml"}, {"id": "5118021", "title": "超十家车企，掀起新一轮促销战", "content": "“金九银十”刚至，车市又掀起了新一轮的促销战。9月7日，特斯拉宣布，9月30日前下单并提现车，Model 3全系现金激励5000元、Model Y全系激励10000元，部分车型可叠加8000元保险补贴；叠加5年0息后Model 3售价22.25万元起。不只是特斯拉，据记者不完全统计，已有超过十家车企在9月集中释放购车权益，覆盖新势力、自主、合资与豪华品牌全阵营，主要促销措施包括金融政策、现金直降、置换补贴、一口价等形式。（第一财经）", "ctime": 1788757164, "time_str": "12:59:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260907/c679649684.shtml"}, {"id": "5118003", "title": "汇丰成为首批直联中国理财网的外资银行", "content": "9月7日，汇丰银行（中国）有限公司宣布，已完成与中国理财网的系统直联，成为自《银行保险机构资产管理产品信息披露管理办法》9月1日正式实施以来，首批与中国理财网实现直联的外资银行。（人民财讯）", "ctime": 1788756623, "time_str": "12:50:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260907/c679649605.shtml"}, {"id": "5117999", "title": "10月1日起港珠澳大桥进口鲜活食品延长至全日通关", "content": "香港特区政府食物环境卫生署食物安全中心发言人今日（7日）表示，由10月1日起，港珠澳大桥进口鲜活食品的通关时间将延长至全日二十四小时，让业界更灵活安排鲜活食品的抵港时间，更佳地配合各食物行业的运作模式。经文锦渡口岸进口鲜活食品的通关时间及安排维持不变。（新浪财经）", "ctime": 1788756604, "time_str": "12:50:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260907/c679649601.shtml"}, {"id": "5117979", "title": "富佳股份：尚未涉足人形机器人电机相关业务，暂无相关布局", "content": "富佳股份在9月7日召开的2026年半年度业绩说明会上表示，公司坚定推进全球化战略，积极整合全球优质资源，在稳固主业的基础上不断拓展新赛道，着力构建多轮驱动、多增长曲线并进的高质量可持续发展格局。目前，公司尚未涉足人形机器人电机相关业务，暂无相关布局。（人民财讯）", "ctime": 1788756317, "time_str": "12:45:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260907/c679649530.shtml"}, {"id": "5117963", "title": "世界黄金协会：金价年化回报约5%，长期趋势由财富贮存需求支撑", "content": "近日，世界黄金协会联合菜百首饰、周大福、周大生、老凤祥等十二家零售品牌，现场发布《2026年中国金饰零售趋势洞察》，并围绕硬足金品类演进与金饰消费结构转型答记者问。世界黄金协会中国区首席执行官王立新对媒体表示：“硬足金仍然是‘八九点钟的太阳’，未来一定是它，空间还巨大。”这句判断，落在一个结构剧烈调整的行业里，尤其值得关注。中国金饰市场正经历典型的“价升量降”趋势。协会数据显示，2026年上半年金饰消费量同比下滑30%至136吨，消费总额却增长5%至1437亿元；门店持续整合，自戴与悦己需求连续三年攀升，从“重要时刻”消费转向“每时每刻”消费。（21财经）", "ctime": 1788755979, "time_str": "12:39:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260907/c679649493.shtml"}, {"id": "5117959", "title": "豆包手机将在9月16日上市", "content": "今日，中兴努比亚官宣：搭载豆包手机助手的全新量产旗舰努比亚NaviX Ultra将于9月16日正式发布。据悉，作为全球首款AI智能体手机，努比亚NaviX Ultra实现一句话让手机从“需要用户手动操作”的工具进化成“能替用户办事”的智能助手。（21财经）", "ctime": 1788755890, "time_str": "12:38:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260907/c679649481.shtml"}, {"id": "5117957", "title": "加拿大油菜籽期货价格上涨", "content": "加拿大油菜籽期货市场收盘上涨，基准期约收高0.35%，扭转了早盘的跌势，主要反映了油菜籽产量前景存在不确定性。菜粕现货价格偏弱下跌，近期沿海压榨厂开机率提升。下游刚需及进口成本支撑，支撑菜籽粕现货价格跌幅有限。（饲料行业信息网）", "ctime": 1788755862, "time_str": "12:37:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260907/c679649478.shtml"}, {"id": "5117941", "title": "华依科技：IMU现有产能充分覆盖现有客户需求", "content": "华依科技在9月7日召开的2026年半年度业绩说明会上表示，公司IMU现有产能能够充分覆盖现有客户需求。公司将紧密跟踪包括数据采集在内的下游应用需求变化，动态规划产能布局，确保在客户需求快速放量时能够及时响应。IMU在机器人数采市场应用广泛，机器人数采下游市场具备较大的需求增长空间，但行业供需受多重因素影响具有不确定性。公司将密切关注市场动态，提前做好产能储备，保障客户订单稳定交付。（人民财讯）", "ctime": 1788755600, "time_str": "12:33:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260907/c679649423.shtml"}, {"id": "5117917", "title": "股价巨震，宇邦新材控制权拟变更，回应来了", "content": "9月7日早盘，宇邦新材股价巨震，股票以“20CM”涨停开盘，随后大幅回落。截至中午收盘，股价报26.18元/股，涨幅为4.85%。消息面上，宇邦新材9月6日晚间披露关于控股股东签署股份转让协议暨控制权拟发生变更的提示性公告。其中，拟变更的控股股东苏州德翎企业管理咨询有限公司（简称“苏州德翎”）成立于2026年8月28日，因成立时间较短引发市场关注。此外，股份转让存在折价，亦引发关注。对此，宇邦新材方面回应记者，苏州德翎确实成立时间比较短，但股权穿透后的上海捷德航空技术有限公司以及苏州德翎法定代表人江文全背后的捷德集团，在航空领域具有一定的知名度。公司原有光伏焊带业务竞争较为激烈，公司希望在原有业务基础上，寻找新的赛道。整个交易还没有完成，具体情况以公司公告为准。（中证金牛座）", "ctime": 1788755431, "time_str": "12:30:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260907/c679649370.shtml"}, {"id": "5117911", "title": "韩国综指涨幅扩大至4%", "content": "韩国综指涨幅扩大至4%，现报6956.73点。个股方面，SK海力士涨超7%，三星电子涨超4%。", "ctime": 1788755365, "time_str": "12:29:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260907/c679649363.shtml"}, {"id": "5117903", "title": "璇玑动力：行业级四足机器人正从“可展示”走向“可实用”", "content": "记者从璇玑动力获悉，该公司行业级重载四足机器人亮相2026年柏林国际消费电子展（IFA 2026）。璇玑动力相关负责人在IFA现场表示，行业级四足机器人正从“可展示”走向“可实用”，从单点试点走向规模化普及。目前，璇玑动力的四足机器人系列产品已在国内电网头部客户变电站实现常态化运行。（人民财讯）", "ctime": 1788755232, "time_str": "12:27:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260907/c679649348.shtml"}, {"id": "5117897", "title": "机构：预计下半年中国面板厂商将占全球汽车显示屏出货量的65%", "content": "根据Omdia的最新研究，预计2026年下半年，中国面板厂商将占全球车载显示出货量的65.2%，高于2026年上半年的59%。这一增长延续了车载显示生产格局长期以来显著的结构性转变：中国面板厂商的市场份额已从20     el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
