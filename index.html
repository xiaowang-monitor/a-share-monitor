赶赴现场。（央视新闻）", "ctime": 1787643420, "time_str": "15:37:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260825/c679262237.shtml"}, {"id": "5020963", "title": "美国制裁是否将对中国银行业造成冲击？外交部：密切关注相关动向", "content": "8月25日，外交部发言人林剑主持例行记者会。美国消费者新闻和商业新闻记者提问，面对美国制裁威胁，中国是否考虑采取应对措施保护自身利益？美国财政部的有关措施是否对中国银行业造成冲击？林剑表示，我刚才已经指出了，中方将采取一切必要措施，坚定维护自身的正当权益。该记者追问，美方表示，会给各国一定的时间结束与伊朗的合作。请问中方是否已经收到相关的要求？对美国财政部公告中提到的中国实体和个人，中方有何应对措施？林剑表示，我们正在密切地关注相关动向，将采取一些必要措施，坚定维护自身权益。（澎湃新闻）", "ctime": 1787643364, "time_str": "15:36:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260825/c679262204.shtml"}, {"id": "5020909", "title": "外交部谈机器人大会：中国底层逻辑始终是开放合作、互利共赢，而非封闭独占", "content": "8月25日，外交部发言人林剑主持例行记者会。有记者提问，2026年世界机器人大会在北京成功举行，第二届世界人形机器人运动会也在国家速滑馆“冰丝带”开赛，中国制造的机器人分别打破了人类百米跑和男子跳高等等多项世界纪录，也引发全球热议。但也有评论认为，相关产业落地和商业化前景并不明朗，部分国家对中国高科技产业采取防范和限制措施，也会让中国同世界分享机遇的承诺面临阻力。发言人对此有何评论？林剑表示，我们也看到了不少这方面的消息。除了赛场比拼，更值得关注的是人形机器人正加速从实验室走向产业化，不仅能在工厂里分拣包裹、组装零件，也能在社区中辅助养老护理、早教育儿，还能完成打乒乓球、折叠衣物等精细动作。这背后展现出整机厂商、核心零部件企业、算法研发团队的协同攻坚，更离不开中国长期稳定的政策支持，持续强化的创新驱动，丰富多元的应用场景。中国发展新质生产力、推进科技创新的底层逻辑始终是开放合作、互利共赢，而非人为设限、封闭独占。中方愿同世界各国一道，继续开展人工智能、具身智能等前沿领域对话合作，让“中国创造”“中国制造”真正转化为共同发展的动力，在技术互通、标准共建、市场共享中挖掘合作潜力，推动创新红利更多地惠及全人类。（澎湃新闻）", "ctime": 1787643164, "time_str": "15:32:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260825/c679262095.shtml"}, {"id": "5020887", "title": "西班牙政府召开国家安全委员会会议应对休达移民危机", "content": "西班牙政府召开国家安全委员会紧急会议，以应对西班牙北非飞地休达日益严重的移民危机。会议旨在协调政府各部门及欧洲机构的行动，以有效管理移民潮和解决移民问题。休达作为西班牙的海外领土，长期面临移民涌入的压力，此次危机促使西班牙政府采取紧急措施。（央视新闻）", "ctime": 1787643073, "time_str": "15:31:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260825/c679262026.shtml"}, {"id": "5020849", "title": "五部门发文支持三级医院进一步对口帮扶县级医院", "content": "国家卫生健康委、农业农村部等五部门8月25日公布《“十五五”时期三级医院对口帮扶县级医院工作方案》。方案明确，支持中高级职称退休医务人员通过对口帮扶灵活安排开展示范带教服务，发挥“银龄医师”专业及资源优势。 方案还明确，根据县域医疗卫生服务体系现状、发展规划、县级医院学科发展需要等，精准选派素质好、业务精的管理和卫生专业技术人员进行管理和技术帮扶。 在提升县级医院服务能力方面，方案提出支援医院要根据受援医院发展现状和县域医疗服务需求，以“一般病在市县解决”为导向，围绕受援地外转率高、就医需求量大的病种，帮助县级医院制定临床专科发展规划，进一步健全诊疗科目，通过团队带团队、远程医疗、远程手术等多种方式将优质医疗资源精准输送至基层与边远地区，加强常见病和多发病诊疗能力、急诊抢救能力和传染病防控等公共卫生服务能力。 方案还对统筹帮扶形式、加快专业人才培养、提高县级医院管理水平等作出规定。(新华社)", "ctime": 1787642473, "time_str": "15:21:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260825/c679261450.shtml"}, {"id": "5020843", "title": "日本高频交易公司Dharmacapital迁至新加坡", "content": "据报道，日本高频交易公司Dharmacapital本月初已将所有员工迁至新加坡。知情人士称，日本相对较高的税率是促使迁址的部分原因。（界面新闻）", "ctime": 1787642443, "time_str": "15:20:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260825/c679261431.shtml"}, {"id": "5020835", "title": "外交部：中国同伊朗的合作始终在国际法框架内进行", "content": "针对有报道说美方计划对不参与制裁伊朗的国家采取反制措施，外交部发言人林剑25日在例行记者会上表示，中方已多次表明，坚决反对没有国际法依据、未经联合国安理会授权的非法单边制裁。经济战、极限施压无助于解决问题，只会进一步激化矛盾冲突，造成风险外溢，扰乱全球经济金融秩序，损害他国正当权益。当务之急是推动局势降温，尽快回归对话谈判轨道。林剑说，中国同伊朗的合作始终在国际法框架内进行，不应受到干扰破坏。中方正密切关注相关动向，将采取一切必要措施，坚定维护自身权益。（新华社）", "ctime": 1787642403, "time_str": "15:20:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260825/c679261379.shtml"}, {"id": "5020819", "title": "今年1—7月我国全行业对外直接投资6845.1亿元", "content": "据商务部、外汇局统计，2026年1—7月，我国全行业对外直接投资6845.1亿元人民币，同比增长2.8%（以美元计为995.3亿美元，增长7.3%）。其中，我国境内投资者共对全球148个国家和地区的7742家境外企业进行了非金融类直接投资，累计投资5284.3亿元人民币，下降12.9%（以美元计为768.4亿美元，下降9.1%）。（央视新闻）", "ctime": 1787642283, "time_str": "15:18:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260825/c679261324.shtml"}, {"id": "5020769", "title": "优必选、常州国资等成立科技公司 注册资本5000万元", "content": "企查查APP显示，近日，常州常高新智采科技有限公司成立，法定代表人为徐理翔，注册资本为5000万元，经营范围包含：数据处理服务；数据处理和存储支持服务；大数据服务；人工智能基础资源与技术平台；智能机器人的研发等。企查查股权穿透显示，该公司由优必选、常州高新数运科技有限公司等共同持股。（人民财讯）", "ctime": 1787641828, "time_str": "15:10:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260825/c679261090.shtml"}, {"id": "5020767", "title": "第二十六届投洽会将于9月8日至11日在厦门举行", "content": "今天（8月23日），国务院新闻办公室举行新闻发布会，商务部介绍，第二十六届中国国际投资贸易洽谈会将于9月8日至11日在福建厦门举行，目前各项筹备工作已基本就绪。（央视新闻）", "ctime": 1787641809, "time_str": "15:10:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260825/c679261087.shtml"}, {"id": "5020757", "title": "韩国杠杆ETF热度降温，出现10亿美元资金流出", "content": "随着市场对人工智能交易行情的投资热情消退，叠加监管机构出台举措抑制相关投资需求，韩国挂钩芯片企业的杠杆ETF本月出现近10亿美元资金流出。数据显示，8月截至目前，挂钩三星电子的杠杆产品资金流出3.81亿美元，跟踪SK海力士的同类产品流出6.01亿美元。这是该类产品自5月末上市以来首次出现月度资金净流出。这类产品目标是放大芯片企业个股两倍的日间涨跌幅，被认为加剧了大盘整体波动。尤其是7月全球AI板块遭遇抛售，韩国综合指数出现22%的历史性大跌。此后，韩国监管机构提高了新投资者的最低入金门槛，还强制要求投资者完成为期五天的模拟交易。（新浪）", "ctime": 1787641719, "time_str": "15:08:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260825/c679261041.shtml"}, {"id": "5020737", "title": "广汽冯兴亚时隔一年再访华为任正非", "content": "8月25日，广汽集团董事长冯兴亚发文称，昨日与团队赴深圳再次拜访华为创始人任正非，上一次双方见面是去年的6月。此次双方围绕下一代汽车产品路径以及双方合作机制深化等议题展开，主要涉及智能化的深度合作，比如L3级别有条件自动驾驶、全新产品定义形态等。目前，广汽与华为合作的启境首款车型GT7已经上市，第二款车型启境GX7将于下个月上市。（第一财经）", "ctime": 1787641558, "time_str": "15:05:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260825/c679260970.shtml"}, {"id": "5020717", "title": "A股年内第10次成交额不足2万亿元", "content": "A股年内第10次成交额不足2万亿元，今日成交额仅18443亿元，较上一日缩量1769亿元。", "ctime": 1787641473, "time_str": "15:04:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260825/c679260939.shtml"}, {"id": "5020693", "title": "ETF收评：港股通医疗ETF领涨4.66%，有色ETF领跌3.65%", "content": "ETF收盘涨跌不一，港股通医疗ETF（159137）领涨4.66%，港股通医疗ETF（520510）涨4.65%，港股医疗ETF（159366）涨4.20%，有色ETF（159049）领跌3.65%，黄金股ETF（159321）跌3.53%，黄金股ETF（517400）跌3.37%。", "ctime": 1787641393, "time_str": "15:03:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260825/c679260902.shtml"}, {"id": "5020689", "title": "欧洲主要股指开盘集体上涨", "content": "欧洲主要股指开盘集体上涨，欧洲斯托克50指数涨0.55%，英国富时100指数涨0.22%，法国CAC40指数涨0.56%，德国DAX指数涨0.36%。", "ctime": 1787641377, "time_str": "15:02:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260825/c679260896.shtml"}, {"id": "5020681", "title": "美政商界人士：对加拿大加征关税将损害美经济民生", "content": "当地时间24日，美国总统特朗普宣布，将对加拿大部分商品加征50%关税。美国方面有消息称，这将对美国本土经济民生带来负面影响，多个与加拿大临近、贸易关系紧密的州物价承压更大、企业经营受影响更明显。当地政商界对相关关税政策提出疑问与反对。（央视新闻）", "ctime": 1787641366, "time_str": "15:02:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260825/c679260889.shtml"}, {"id": "5020677", "title": "ETF两市成交额报4488.59亿元，较昨日此时缩量297.21亿元", "content": "截至目前，ETF两市成交额报4488.59亿元，较昨日此时缩量297.21亿元，分类型来看，股票型ETF成交额1347.52亿元，债券型ETF成交额2119.29亿元，货币型ETF成交额216.19亿元，商品型ETF成交额178.21亿元，QDII型ETF成交额627.38亿元。", "ctime": 1787641366, "time_str": "15:02:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260825/c679260885.shtml"}, {"id": "5020663", "title": "A股收评：创业板指缩量下跌1% 全市场超4200只个股上涨", "content": "截至收盘，上证指数涨0.19%报3889.44点，深证成指跌0.35%报13745.87点，创业板指跌1.00%报3397.52点，北证50涨0.91%报1063.20点。三市成交额18442亿元，较上日缩量1769亿元。全市场超4200只个股上涨。\n板块题材上，粮食概念、小家电、CRO概念板块涨幅居前；贵金属、能源金属板块跌幅居前。\n盘面上，粮食概念大幅走强，新华百货3连板，登海种业2连板，万向德农、金健米业涨停，神农种业、华资实业、秋乐种业、天禾股份、康农种业跟涨。小家电板块震荡走高，石头科技涨停，欧伦电气、奥佳华、倍益康、荣泰健康、北鼎股份跟涨。CRO概念板块表现强势，凯莱英涨停，近岸蛋白、亨迪药业涨超10%，益诺思、美迪西、诚达药业、和元生物、金石亚药跟涨。贵金属板块大幅走弱，西部黄金、招金黄金跌超7%，湖南白银、兴业银锡、晓程科技跟跌。能源金属震荡走弱，盛新锂能、永兴材料、融捷股份跌超6%，赣锋锂业、永杉锂业跟跌。", "ctime": 1787641322, "time_str": "15:02:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260825/c679260875.shtml"}, {"id": "5020647", "title": "股指期货午盘收盘 主力合约全线收涨", "content": "股指期货午盘收盘，主力合约全线收涨。沪深300股指期货(IF)主力合约涨0.20%，上证50股指期货(IH)主力合约涨0.25%，中证500股指期货(IC)主力合约涨0.68%，中证1000股指期货(IM)主力合约涨1.10%。", "ctime": 1787641269, "time_str": "15:01:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260825/c679260855.shtml"}, {"id": "5020629", "title": "内塔尼亚胡：伊朗想杀我儿子，差点得手", "content": "以色列总理内塔尼亚胡24日接受以色列第14频道电视台采访时声称，伊朗曾“试图暗杀他的一个儿子”。内塔尼亚胡没有提供更多细节。内塔尼亚胡有两个儿子，他在采访中没有透露哪一个成为所谓暗杀目标，亦未指明所谓暗杀企图的性质和时间。《以色列时报》报道说，即使内塔尼亚胡在今年晚些时候举行的大选中落败，以国家安全总局（辛贝特）也会为内塔尼亚胡及其家庭成员提供至少5年的安全保护。以色列第12频道电视台报道称，过去几个月来，有关伊朗企图暗杀内塔尼亚胡儿子的信息一直受到以军方的审查封禁。（新华社）", "ctime": 1787641227, "time_str": "15:00:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260825/c679260838.shtml"}, {"id": "5020623", "title": "期货收评：碳酸锂暴跌6%！矿山复产引爆供给过剩恐慌", "content": "期货收评：截至收盘，大宗商品涨跌不一，涨幅方面，纯苯、对二甲苯、短纤涨近2%；跌幅方面，碳酸锂跌6%，欧线集运、PVC、低硫燃油跌超2%。", "ctime": 1787641222, "time_str": "15:00:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260825/c679260837.shtml"}, {"id": "5020613", "title": "广期所碳酸锂主力合约大跌6%", "content": "广期所碳酸锂主力合约大跌6%，报150360元/吨。", "ctime": 1787641202, "time_str": "15:00:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260825/c679260830.shtml"}, {"id": "5020607", "title": "外交部提醒中国公民暂勿前往斯威士兰", "content": "当前，斯威士兰安全形势复杂，电诈网赌犯罪活动猖獗，社会治安等风险极高。外交部和中国驻南非使领馆提醒中国公民近期暂勿前往斯威士兰，已在当地中国公民和机构请尽快撤离或转移至南非等相对安全区域，密切关注局势发展，加强安全防范和应急准备。如遇紧急情况，请及时报警并与中国驻南非使领馆联系寻求协助。执意前往或驻留人员将面临极高安全风险，并影响获得协助的时效。（新华社）", "ctime": 1787641183, "time_str": "14:59:43" // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
