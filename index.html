_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260914/c679882288.shtml"}, {"id": "5166283", "title": "都福美股盘前跌超10%", "content": "都福美股盘前跌超10%，现报168.768美元。", "ctime": 1789375696, "time_str": "16:48:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260914/c679881915.shtml"}, {"id": "5166211", "title": "约旦高官：约中务实合作迎来新局面", "content": "约旦工业、贸易和供应大臣亚鲁卜·古达日前接受专访时表示，约中两国各行业务实合作迎来新局面，双方牢固的政治关系向经济领域延伸，在工业、能源、贸易、信息技术、旅游等领域建立起更多实质性伙伴关系。古达表示，中国是约旦最大的进口来源国。下一阶段双方可进一步深化合作，持续扩大商品贸易，推动中国企业在约旦开展直接投资、建立合资企业和实施共同项目，努力形成面向地区乃至全球市场的合作。（新华社）", "ctime": 1789375211, "time_str": "16:40:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260914/c679881189.shtml"}, {"id": "5166209", "title": "抵制美国货 加拿大超市货架大洗牌", "content": "随着越来越多加拿大消费者抵制美国货，加拿大各零售商开始加强产地标识并开辟除美国之外的更多货源地，各大超市货架陈列因此面貌大变。安大略省超市“文斯市场”最近收到差评和愤怒的消费者邮件，批评该超市囤有美国货。为此，公司总裁贾恩卡洛·特里马尔基忙着在社交媒体上向消费者解释，该超市货架陈列的大部分商品其实产自加拿大。（新华社）", "ctime": 1789375168, "time_str": "16:39:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260914/c679881126.shtml"}, {"id": "5166207", "title": "百傲化学：首次回购公司股份50万股，支付603.63万元", "content": "百傲化学公告，公司此前审议通过回购方案，拟以8000万元~1.2亿元回购股份，回购价格不超过22.96元/股，用于维护公司价值及股东权益。2026年9月14日，公司首次回购股份50万股，占总股本的比例为0.07%，回购价格区间为12.01元/股~12.14元/股，资金总额为603.63万元（不含交易费用）。", "ctime": 1789375146, "time_str": "16:39:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260914/c679881097.shtml"}, {"id": "5166187", "title": "艾芬达：拟以5000万元-1亿元回购公司股份", "content": "艾芬达公告，拟使用自有资金或自筹资金，以集中竞价方式回购公司股份，回购资金不低于5000万元且不超过1亿元，回购价格不超过30元/股。回购股份将用于股权激励或员工持股计划，实施期限为自董事会审议通过回购方案之日起不超过6个月。", "ctime": 1789374981, "time_str": "16:36:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260914/c679880870.shtml"}, {"id": "5166159", "title": "八部门：加快制定实施智能家居互联互通等国家标准", "content": "记者从商务部了解到，今天，商务部、国家发展改革委等八部门联合发布《促进智能家居消费行动方案》，以适应不同群体消费需求，扩大优质供给，进一步促进智能家居消费。《行动方案》围绕扩大优质智能家居供给、完善智能家居标准体系、发展适老化智能家居、畅通废旧回收服务链条、优化社区便民服务等七个方面，提出推广家庭服务机器人、健康监测、智能照护等适老化产品，丰富适老化智能家居产品和家装服务供给；支持地方结合实际自主合理确定智能家居产品补贴品类、补贴标准，统筹支持全屋智能家居购新；鼓励生产企业加强智能家居产品研发，加快培育一批诚信经营、服务规范的大型家装企业和平台，推出个性化、多样化装修套餐，大力发展定制式、订单式、预约式服务；加快制定实施智能家居互联互通等国家标准；引导金融机构加大对智能家居消费等贷款支持力度，积极支持消费者购买智能家居相关产品。据了解，近年来，随着技术加快迭代升级、居民生活品质化需求不断提升，智能家居快速发展，市场渗透率不断提高。下一步，商务部将会同相关部门落实落细各项工作举措，推动相关政策尽快落地见效，带动更多智能家居产品走入百姓家庭，更好满足人民美好生活需要。（央视新闻）", "ctime": 1789374839, "time_str": "16:33:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260914/c679880711.shtml"}, {"id": "5166125", "title": "我国牵头制定 分散式多能系统通用总则国际标准发布", "content": "记者今日了解到，国际电工委员会（IEC）近日发布由我国牵头制定的《分散式多能系统 第一部分：总则》国际标准。该标准由我国专家担任工作组召集人，联合瑞士、法国、韩国等10个国家的专家共同编制，是我国在智慧能源标准国际化工作中的又一标志性成果。（央视新闻）", "ctime": 1789374621, "time_str": "16:30:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260914/c679880455.shtml"}, {"id": "5166099", "title": "德马科技：拟以人民币3000万元至人民币6000万元回购公司股份", "content": "德马科技公告，拟以集中竞价交易方式回购公司股份，回购资金总额不低于人民币3000万元（含）且不超过人民币6000万元（含），回购价格不超过人民币23.23元/股（含），回购股份拟用于员工持股计划或股权激励，回购期限为董事会审议通过回购方案之日起6个月内。", "ctime": 1789374374, "time_str": "16:26:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260914/c679880129.shtml"}, {"id": "5166089", "title": "也门胡塞武装称对沙特空军基地发动袭击", "content": "也门胡塞武装14日说，该组织向位于沙特阿拉伯西南部的一个空军基地发射了数十枚弹道导弹及无人机。(新华社)", "ctime": 1789374192, "time_str": "16:23:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260914/c679879884.shtml"}, {"id": "5166087", "title": "芯碁微装：下半年高阶PCB设备订单交付保持饱满 二期产能将完整释放", "content": "芯碁微装董事长程卓在今日举行的2026年半年度业绩会上表示，下半年来看，高阶PCB设备订单交付保持饱满，先进封装设备也进入验证与落地阶段；明年AI服务器、相关载板及先进封装扩产仍将带来设备增量。公司二期厂区上半年处于爬坡阶段，整体产能利用率维持高位。全年来看，二期产能将在下半年进入完整释放阶段，依托模块化生产与核心零部件前置备货，持续承接高阶PCB及先进封装设备订单。（科创板日报）", "ctime": 1789374165, "time_str": "16:22:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260914/c679879847.shtml"}, {"id": "5166079", "title": "统一股份：控股子公司9月10日签订战略合作备忘录", "content": "统一股份公告，2026年9月10日，控股子公司统一石化与新加坡油力特润滑油私人有限公司签订《战略合作备忘录》，双方拟在海外市场开展合作，由油力特作为统一在东南亚国家的区域合作工厂承接统一海外订单生产，并在市场协同、技术交流、品牌共建、资源共享等方面合作。本备忘录为框架性、意向性约定，不涉及具体金额及资产交易，预计对公司本年度经营业绩不会构成重大影响。", "ctime": 1789374065, "time_str": "16:21:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260914/c679879695.shtml"}, {"id": "5166071", "title": "双成药业：控股股东更名及经营范围变更完成", "content": "双成药业公告，公司控股股东海南双成投资有限公司名称变更为海南双成投资集团有限公司，经营范围同时变更；相关事项已办理完成工商变更登记手续并取得新的营业执照，注册资本为1000万元。本次变更不涉及持股情况变化，控股股东及实际控制人未发生变化。", "ctime": 1789374006, "time_str": "16:20:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260914/c679879621.shtml"}, {"id": "5166053", "title": "成渝中线高铁全线无砟轨道完工 正线全长约292公里", "content": "记者从长江沿岸铁路集团重庆公司获悉，9月14日，在重庆市井口嘉陵江特大桥建设现场，随着最后一段无砟轨道道床板浇筑完成，标志着新建成都至重庆高速铁路（以下简称“成渝中线高铁”）全线无砟轨道完工，为成渝中线高铁全线按期通车奠定了坚实基础。成渝中线高铁建成后，将与已建成运营的西安至成都高铁、郑州至重庆高铁，以及在建的西宁至成都高铁、成都至达州至万州高铁等多条线路互联互通，进一步完善成渝地区路网结构，大幅压缩成渝两地旅行时间，极大便利沿线群众出行。同时，该线路对助力成渝地区双城经济圈建设、推动形成西部大开发新格局，具有十分重要的战略意义。（央视新闻）", "ctime": 1789373910, "time_str": "16:18:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260914/c679879496.shtml"}, {"id": "5166013", "title": "上海职工医保个人账户历年结余资金可支付非免疫规划疫苗费用", "content": "自2026年9月15日起，上海市参保人员可按规定使用职工医保个人账户历年结余资金，支付定点医疗机构接种目录内非免疫规划疫苗产生的疫苗费用及注射服务费，同时支持医保家庭共济。疫苗分为免疫规划疫苗和非免疫规划疫苗。其中，免疫规划疫苗由政府免费向居民提供，接种全程不收取任何费用；非免疫规划疫苗为公民自费、自愿选择接种，接种需收取疫苗费用以及注射服务费。（新华社）", "ctime": 1789373629, "time_str": "16:13:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260914/c679878982.shtml"}, {"id": "5165997", "title": "普莱柯：子公司获二类新兽药注册证书", "content": "普莱柯公告，公司全资子公司洛阳惠中兽药有限公司与其他单位联合申报的“盐酸地那维林注射液”经农业农村部审查获批为二类新兽药，农业农村部于2026年9月14日公示核发《新兽药注册证书》。该产品上市前仍需取得兽药产品批准文号。", "ctime": 1789373492, "time_str": "16:11:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260914/c679878795.shtml"}, {"id": "5165979", "title": "英国5年期国债升至2008年7月以来最高水平，报4.9709%", "content": "英国5年期国债升至2008年7月以来最高水平，报4.9709%。", "ctime": 1789373472, "time_str": "16:11:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260914/c679878456.shtml"}, {"id": "5165993", "title": "科前生物：获批新兽药注册证书，监测期3年", "content": "科前生物公告，经中华人民共和国农业农村部审查，公司申报的猫鼻气管炎、杯状病毒病、泛白细胞减少症三联灭活疫苗获批为新兽药，并取得《新兽药注册证书》，证书号为（2026）新兽药证字108号，监测期3年。公司将申请产品批准文号。", "ctime": 1789373467, "time_str": "16:11:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260914/c679878767.shtml"}, {"id": "5165987", "title": "港股收评：恒生指数涨0.45%，恒生科技指数跌0.06%", "content": "港股收盘，恒生指数涨0.45%，恒生科技指数跌0.06%。恒指港股通ETF银华（159318）涨0.39%，港股通科技ETF鹏华（159751）涨0.72%。板块方面，其他能源储存运输、电脑与电子产品零售板块涨幅靠前；服装零售、广告营销板块跌幅靠前。个股方面，海清智元涨29.69%，诺诚健华涨14.55%，凯莱英涨14.23%，应星控股涨13.82%，华宝国际涨13.45%；海光芯正跌20.29%，深演智能跌14.61%，自由黄金-DRS跌13.48%，梅卡曼德机器人跌11.84%，曦智科技-P跌11.33%。", "ctime": 1789373423, "time_str": "16:10:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260914/c679878717.shtml"}, {"id": "5165981", "title": "央行：核心企业“两头吃”情况得到遏制 部分问题企业已退出账款凭证业务", "content": "9月14日，中国人民银行金融市场司司长曹媛媛在国务院政策例行吹风会上表示，截至7月末，账款凭证平均期限较去年同期缩短了92天；核心企业“两头吃”情况已得到有效遏制，部分存在“两头吃”问题的大型企业已退出账款凭证业务。曹媛媛指出，账款凭证业务在发展初期，规范性不足，部分核心企业用账款凭证拖延付款、拉长账期。服务平台管理规范同样缺乏，部分核心企业一边通过开立账款凭证，大量拖延付款来节约自身财务成本；另一边，则对拿着账款凭证融资的供应商，收取较高的融资服务费——甚至有的核心企业通过关联保理公司账款凭证来提供高息融资、赚取利息，就存在对供应商“两头吃”的情况。（人民财讯）", "ctime": 1789373387, "time_str": "16:09:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260914/c679878538.shtml"}, {"id": "5165943", "title": "宇树科技升级G1机器人", "content": "宇树科技9月14日宣布，人形机器人G1全面升级，正式推出G1+。G1+围绕运动性能、感知交互、智能体验三大维度一次性带来6项升级，重点补强颈部灵活性、关节电机输出与热管理、视觉与触觉感知、供电续航以及远场语音交互能力。（第一财经）", "ctime": 1789373176, "time_str": "16:06:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260914/c679877650.shtml"}, {"id": "5165929", "title": "新五丰：5374.3万元收购广联公司18.8812%股权", "content": "新五丰公告，公司拟以5374.3万元通过协议转让方式购买广联公司7名自然人股东合计持有的18.8812%股权。本次交易已经公司第六届董事会第三十一次会议审议通过，未达到股东会审议标准。", "ctime": 1789373093, "time_str": "16:04:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260914/c679877513.shtml"}, {"id": "5165899", "title": "外交部：愿推动构建网络空间命运共同体", "content": "9月14日，外交部发言人郭嘉昆主持例行记者会。有记者问，据报道，2026年国家网络安全宣传周开幕式今天在山东济南举行，主题为“网络安全为人民，网络安全靠人民——智能时代 网安护航”，发言人能否介绍中方开展这项活动的考虑？中方认为各国应如何共同守护智能时代的网络安全？郭嘉昆表示，网络跨越千万里、连接千万家。一个和平、安全、开放、合作的网络空间，对世界各国都具有重要意义。中国2014年起开展网络安全宣传周活动，旨在提升全民网络安全意识和技能，营造健康文明的网络环境，也为全球互联网治理提供了有益的中国实践。当前，以人工智能为代表的新兴技术深刻重塑网络空间格局。作为网络安全的坚定捍卫者，中国已将人工智能正式纳入国家网络安全法规体系，不断完善相关制度准则、伦理规范等。我们愿继续与国际社会一道，积极应对智能时代网络安全面临的风险挑战，推动构建网络空间命运共同体，让互联网更好造福各国人民。（央视新闻）", "ctime": 1789372910, "time_str": "16:01:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260914/c679876803.shtml"}, {"id": "5165897", "title": "两部门：四方面举措加快数字经济领域复合型人才培养", "content": "记者今天从国家数据局和教育部了解到，我国将重点通过四方面举措，加快培养数字经济领域复合型人才，更好促进数字经济发展。这些举措包括：成立全国数字经济教学指导委员会，其中高校代表占比约70%，产业界代表占比约30%，突出学科交叉、产教融合、科教融汇，将指导数字经济专业建设、课程开发、教材编写、教学改革；建设一批核心课程、核心教材、核心师资团队和核心实践项目，推动大模型、智能体等新技术工具融入课堂实训；为高校配套算力服务、高质量数据集等资源；建设一批数字经济领域国家级育人平台、数据要素产教融合创新平台和产教融合特色鲜明的实践基地。据了解，截至2025年底，全国已有超300所高校开设数字经济专业，广东、江苏、湖北、山东、安徽等省开设数量居全国前五。（央视新闻）", "ctime": 1789372903, "time_str": "16:01:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260914/c679876773.shtml"}, {"id": "5165889", "title": "长龄液压：夏继发向范春晓转让5.01%股份完成过户", "content": "长龄液压公告，2026年7月21日，公司股东夏继发与一致行动人范春晓签署协议，拟转让936.57万股（占公司当前总股本的5.01%）给范春晓；本次协议转让已获上海证券交易所合规性确认，并于2026年9月11日完成过户登记。", "ctime": 1789372884, "time_str": "16:01:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260914/c679876692.shtml"}, {"id": "5165885", "title": "美股大型科技股盘前普跌，SK海力士跌超6%", "content": "美股大型科技股盘前普跌，SK海力士跌超6%，美光科技跌超4%，SpaceX跌超2%，Meta、亚马逊、特斯拉、英伟达跌超1%，谷歌A跌0.9%，苹果跌0.6%，微软跌0.5%。", "ctime": 1789372874, "time_str": "16:01:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260914/c679876648.shtml"}, {"id": "5165883", "title": "辰欣药业：佛都药业首仿药获批上市，文号H20265821", "content": "辰欣药业公告，子公司山东辰欣佛都药业股份有限公司收到国家药品监督管理局核准签发的氯替泼诺妥布霉素滴眼液《药品注册证书》，药品批准文号为国药准字H20265821，本次为国内首仿上市。", "ctime": 1789372871, "time_str": "16:01:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260914/c679876632.shtml"}, {"id": "5165881", "title": "美股中概股盘前多数上涨，理想汽车涨2%", "content": "美股中概股盘前多数上涨，理想汽车、蔚来涨2%，携程、百济神州涨1%，网易涨0.3%，京东涨0.1%，百度跌0.3%，阿里巴巴跌1%。", "ctime": 1789372867, "time_str": "16:01:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260914/c679876615.shtml"}, {"id": "5165811", "title": "现货黄金失守4310美元/盎司 纽约期金失守4350美元/盎司", "content": "现货黄金失守4310美元/盎司，日内跌0.87%。纽约期金失守4350美元/盎司，日内跌1.34%。", "ctime": 1789372580, "time_str": "15:56:2 // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
