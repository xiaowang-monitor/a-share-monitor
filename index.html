科技板块依然呈现下跌态势，我们认为A股正从6月的一个极端走向现在的另一个极端并无必要。”\n\n陈果表示，AI产业中期逻辑并未破坏，后续国产AI技术追赶与扩产景气上行周期的逻辑不但没有削弱甚至有望进一步加强。(券中社)", "ctime": 1784539660, "time_str": "17:27:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260720/c678294081.shtml"}, {"id": "4758373", "title": "2026世界人工智能大会闭幕 预计达成超200亿元意向采购金额", "content": "今天，2026世界人工智能大会暨人工智能全球治理高级别会议在上海闭幕。本届大会展览面积10万平方米，展品总数4486项，351款产品全球首发。接待全球重要采购团组177个，预计达成意向采购金额约203.6亿元，同比增长约25%。(央视新闻)", "ctime": 1784539435, "time_str": "17:23:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260720/c678293961.shtml"}, {"id": "4758367", "title": "昊志机电：2026年上半年净利润2.32亿元，同比增长266.57%", "content": "昊志机电公告，2026年上半年营业收入11.66亿元，同比增长65.86%。净利润2.32亿元，同比增长266.57%。", "ctime": 1784539411, "time_str": "17:23:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260720/c678293940.shtml"}, {"id": "4758339", "title": "仙鹤股份：实控人王敏文、王敏良拟增持不低于6000万元", "content": "仙鹤股份公告，公司实际控制人王敏文、王敏良计划以自有或自筹资金，自2026年7月21日至2027年1月20日通过上海证券交易所系统以集中竞价方式增持公司A股股份，合计增持金额不低于人民币6000万元（含）且不超过人民币1亿元（含）。", "ctime": 1784539279, "time_str": "17:21:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260720/c678293874.shtml"}, {"id": "4758329", "title": "华通线缆：终止向不特定对象发行可转换公司债券", "content": "华通线缆公告，公司于2026年7月20日召开第四届董事会第十六次会议，审议通过了《关于终止向不特定对象发行可转换公司债券的议案》，同意公司终止向不特定对象发行可转换公司债券的事项。本次向不特定对象发行可转换公司债券募集资金总额不超过人民币8亿元（含本数），扣除发行费用后，募集资金净额拟投资于油服连续管及智能管缆扩产项目、潜油泵电缆技改及潜油电泵产业化项目和补充流动资金项目。终止本次向不特定对象发行可转换公司债券是结合公司实际情况、项目建设情况、发展规划等诸多因素后作出的决定。目前公司各项业务经营正常，终止本次向不特定对象发行可转换公司债券不会对公司正常经营造成重大不利影响。", "ctime": 1784539192, "time_str": "17:19:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260720/c678293792.shtml"}, {"id": "4758321", "title": "牧原股份：董监高信托计划增持0.22%耗资5亿元", "content": "牧原股份公告，截至2026年7月17日，公司董事、高级管理人员委托设立的信托计划通过深圳证券交易所交易系统以集中竞价方式累计增持公司A股股份1264.46万股，占公司总股本的0.22%，增持金额为5亿元（含交易费用），本次增持计划实施完毕。", "ctime": 1784539096, "time_str": "17:18:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260720/c678293725.shtml"}, {"id": "4758313", "title": "工业AI正从单点突破步入产业全链条赋能", "content": "2026世界人工智能大会上，工业人工智能成为产业赛道的核心看点。从单个智能应用的“点上突破”，到全面覆盖研发设计、生产制造、运维管控、供应链协同的全流程渗透，工业AI正步入“全链条赋能、全要素激活”的深度应用深水区，为制造业高质量转型注入核心动力。（央视新闻）", "ctime": 1784539035, "time_str": "17:17:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260720/c678293662.shtml"}, {"id": "4758311", "title": "摩根大通（JPMorgan）对宁德时代的多头持仓比例增至6.07%", "content": "据香港交易所披露，摩根大通（JPMorgan）对宁德时代新能源科技股份有限公司 - H股的多头持仓比例于2026年7月15日从5.96%增至6.07%。", "ctime": 1784539024, "time_str": "17:17:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260720/c678293657.shtml"}, {"id": "4758309", "title": "上海：至2030年，建立健全全周期的绿电直连服务保障体系，推动建成一批高质量绿电直连项目，电源侧开发规模达到50万千瓦", "content": "上海印发《上海市绿电直连有序发展工作方案》，其中指出，至2030年，建立健全全周期的绿电直连服务保障体系，推动建成一批高质量绿电直连项目，电源侧开发规模达到50万千瓦。至2035年，绿电直连成为新能源发展的重要方式，有力支撑经济社会发展全面绿色转型。", "ctime": 1784538931, "time_str": "17:15:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260720/c678293593.shtml"}, {"id": "4758303", "title": "万泰生物：冻干重组呼吸道合胞病毒疫苗临床试验申请获受理", "content": "万泰生物公告，全资子公司厦门万泰沧海生物技术有限公司收到国家药监局行政许可文书《受理通知书》，公司申报的“冻干重组呼吸道合胞病毒疫苗（CHO细胞）”临床试验申请已获得受理。该产品适用于预防由呼吸道合胞病毒（RSV）感染引起的下呼吸道疾病，主要活性成分为自主开发的RSV融合前构象膜融合蛋白F。临床前数据显示，本品安全性良好，且可在小鼠、棉鼠等多种动物体内诱导产生RSV特异性保护性免疫应答。", "ctime": 1784538876, "time_str": "17:14:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260720/c678293569.shtml"}, {"id": "4758301", "title": "金禄电子：预计上半年净利润5500万元–6000万元，同比增长5.04%-14.59%", "content": "金禄电子公告，预计2026年上半年净利润为5500万元–6000万元，同比增长5.04%-14.59%。2026年上半年，PCB主要原材料覆铜板及PP（半固化片）采购价格大幅上涨且供应紧张的局面日趋加剧。公司加大力度、更加坚决地开展产品调价工作，以产业链定价权逐渐前移及行业普遍缺料背景下保障产品供应为契机，强化与主要客户的合作关系，积极调整订单结构，上半年承接的订单金额同比增长101.14%（其中承接的订单数量同比增长55.89%，承接的订单平均单价同比增长29.03%）。尤其是第二季度以来，公司先后与所有主要客户（个别招投标客户除外）就产品调价机制或调价幅度达成一致，使得第二季度承接的订单平均单价环比第一季度增长21.77%，订单价格的涨幅预计在下半年体现的更为充分和明显。", "ctime": 1784538822, "time_str": "17:13:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260720/c678293554.shtml"}, {"id": "4758299", "title": "朗坤科技：董事长陈建湘拟回购5000万元-1亿元公司股份", "content": "朗坤科技公告，公司实际控制人之一、董事长兼总经理陈建湘提议公司使用自有资金以集中竞价方式回购公司已发行的部分人民币普通股（A股），回购价格上限不高于公司董事会审议通过回购股份决议前30个交易日公司股票交易均价的150%，回购股份的资金总额不低于人民币5000万元（含），不超过人民币1亿元（含），回购期限为自公司董事会审议通过回购方案之日起3个月内。", "ctime": 1784538813, "time_str": "17:13:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260720/c678293545.shtml"}, {"id": "4758295", "title": "科达利：董事长励建立提议以1.5亿至3亿元回购公司股份", "content": "科达利公告，董事长励建立提议以1.5亿至3亿元回购公司股份，回购价格上限不高于董事会审议通过回购股份决议前三十个交易日公司股票交易均价的150%。", "ctime": 1784538807, "time_str": "17:13:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260720/c678293513.shtml"}, {"id": "4758287", "title": "圆通速递：拟以3000万元～5000万元回购公司股份", "content": "圆通速递公告，拟以3000万元～5000万元回购公司股份，回购价格不超过25元/股。", "ctime": 1784538716, "time_str": "17:11:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260720/c678293475.shtml"}, {"id": "4758281", "title": "中国人民银行副行长宣昌能与欧盟委员会金融稳定、金融服务和资本市场联盟总司长约翰·贝里根通话", "content": "2026年7月20日，中国人民银行副行长宣昌能与欧盟委员会金融稳定、金融服务和资本市场联盟总司长约翰·贝里根通话，就中欧经济形势和金融合作等议题交换了意见。(中国人民银行)", "ctime": 1784538695, "time_str": "17:11:35", "sto 处", "content": "申万宏源首席策略分析师王胜指出，抛压已集中释放，反弹就在不远处。首先，绝对收益资金与中小投资者负循环有限，微观结构稳定性望自然恢复，行稳致远政策发力易见效，存储龙头上市构成反弹契机。其次，AI产业链超跌反弹在即，但需重磅催化开启中期行情，算力行情波段已分，供给瓶颈松动者估值下修，存储涨价遇阻、利润传导不畅，后续行情需经历“慢节奏”阶段。最后，反弹阶段AI占优，中期需催化挑战前高，大波段科技领涨不变；基本面改善来源更丰富，增量资金更多，结构百花齐放，科技内部机会增加，非科技首选非银，关注战略资源、新消费及出口/出海链Alpha。王胜还表示，科技股回调之后，整体市场容易出现共振反弹，A股市场的盈利韧性十分明显，国产替代自主可控的科技方向未来想象空间巨大。（财联社）", "ctime": 1784537561, "time_str": "16:52:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260720/c678292653.shtml"}, {"id": "4758097", "title": "华懋科技：董秘臧琨已增持0.0069%", "content": "华懋科技公告，公司董事兼董事会秘书臧琨先生于2026年7月20日通过上海证券交易所交易系统以集中竞价交易方式，以64.23元/股的均价增持公司股份2.26万股，占公司总股本的0.0069%，增持金额为人民币145.16万元（不含交易费用）。本次增持不触及权益变动，不会导致股东身份发生变化。", "ctime": 1784537466, "time_str": "16:51:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260720/c678292618.shtml"}, {"id": "4758091", "title": "AI智能体正从“能对话”转向“善执行”", "content": "记者在2026世界人工智能大会看到，以智能体为代表的AI应用正走出实验室，深度嵌入跨境贸易、体育赛事等真实生产生活场景，从“对话交互”转向“任务执行”，成为辅助决策、提升效率的“智能伙伴”。中国银联刚刚发布的《智能体支付开放协议框架》通过携手境内外产业伙伴，建立了一套统一的信任机制和交互范式，让生态各方以“即插即用”的方式无缝、安全地参与智能体支付流程。参展商 王煜婕：目前已经联合数十家生态伙伴完成境外酒店预订、车载智能体消费、AI机票预订、云闪付生活缴费、线下智能点单等多项真实场景的验证交易，打破不同厂商智能体互通壁垒，加速全域智能生态成型。（央视新闻）", "ctime": 1784537364, "time_str": "16:49:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260720/c678292582.shtml"}, {"id": "4758087", "title": "超达装备：累计回购占公司总股本1.0301%", "content": "超达装备公告，截至2026年7月20日，公司通过回购专用证券账户以集中竞价交易方式累计回购118.2万股，占公司总股本的1.0301%，最高成交价为41.02元/股，最低成交价为28.23元/股，成交总金额为3812.11万元（不含交易费用），符合公司既定的股份回购方案及法律法规要求。", "ctime": 1784537330, "time_str": "16:48:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260720/c678292568.shtml"}, {"id": "4758083", "title": "考虑延长股票交易时间、取消午休时段？港交所回应：仍在非常早期的探讨阶段", "content": "近日，有外媒报道称港交所考虑延长股票交易时间，取消一小时午休，对此，港交所方面对记者表示，现在首要研究延长衍生产品交易时段建议，而不是股票市场交易时段。香港交易所一直致力于提升香港作为国际金融中心的竞争力，目前正在研究包括延长交易时段在内的多项提升市场便利性的措施。我们当前首要的工作是研究延长衍生产品市场交易时段的建议，是否落实相关建议尚待收集市场意见及监管机构批准。有关优化现货市场交易时间的建议现在仍处于非常早期的探讨阶段。任何有关现货市场的调整均需审慎评估对市场的影响，并综合考虑市场各方的意见和互联互通机制的安排。（澎湃新闻）", "ctime": 1784537296, "time_str": "16:48:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260720/c678292548.shtml"}, {"id": "4758081", "title": "精艺股份：预计2026年上半年净利润同比下降59.70%-67.03%", "content": "精艺股份公告，预计2026年1月1日至2026年6月30日归属于上市公司股东的净利润为358.04万元–437.6万元，比上年同期下降59.70%-67.03%；扣除非经常性损益后的净利润为183.18万元–223.88万元，比上年同期下降73.52%-78.33%。受行业竞争加剧等因素影响，铜加工费持续处于低位，公司收入上升幅度小于成本上升幅度，综合毛利率较上年同期有所下降。同时，受部分客户回款不及预期等因素影响，公司呆滞应收款项有所增加，信用减值损失同比增加，进一步影响了本期利润。", "ctime": 1784537286, "time_str": "16:48:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260720/c678292543.shtml"}, {"id": "4758077", "title": "陕鼓动力：获准注册发行9亿元超短期融资券及9亿元中期票据", "content": "陕鼓动力公告，公司近日收到中国银行间市场交易商协会出具的两份《接受注册通知书》，同意接受公司注册金额为9亿元的超短期融资券及注册金额为9亿元的中期票据。超短期融资券注册金额为9亿元，注册额度自《接受注册通知书》落款之日起2年内有效，公司在注册有效期内可分期发行超短期融资券。中期票据注册金额为9亿元，注册额度自《接受注册通知书》落款之日起2年内有效，公司在注册有效期内可分期发行中期票据。公司后续将结合《接受注册通知书》和相关法律法规的要求及公司股东会的授权办理发行相关事宜。", "ctime": 1784537275, "time_str": "16:47:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260720/c678292535.shtml"}, {"id": "4758069", "title": "南极电商：首次回购0.07%公司股份，成交总金额为539.94万元", "content": "南极电商公告，2026年7月20日，公司首次通过回购专用证券账户以集中竞价交易的方式回购股份180万股，回购股数占公司目前总股本的0.07%，最高成交价为3元/股，最低成交价为3元/股，成交总金额为539.94万元（不含交易费用）。", "ctime": 1784537185, "time_str": "16:46:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260720/c678292504.shtml"}, {"id": "4758067", "title": "伯特利：股东奇瑞科技决定提前终止减持计划", "content": "伯特利公告，股东奇瑞科技在本次减持计划实施前持有公司股份1.31亿股， // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';

  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {

  const sentimentScore = META.sentiment_score || 50;

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>

    </div>

}

    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
