": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260707/c678000848.shtml"}, {"id": "4664683", "title": "日经225指数跌幅扩大至2%", "content": "日经225指数跌幅扩大至2%，现报68308.64点。", "ctime": 1783400252, "time_str": "12:57:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260707/c678000846.shtml"}, {"id": "4664671", "title": "韩国交易所启动KOSPI指数熔断机制 交易暂停20分钟", "content": "韩国交易所启动KOSPI指数熔断机制，交易暂停20分钟。", "ctime": 1783400009, "time_str": "12:53:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260707/c678000812.shtml"}, {"id": "4664669", "title": "法国检方：拉利克博物馆被盗，损失超450万欧元", "content": "法国媒体6日援引当地检方消息称，位于法国东北部莫代河畔的拉利克博物馆5日清晨遭遇入室盗窃，共计被盗走价值超450万欧元的27件展品。法媒援引检察官弗朗索瓦·安东纳的话说，失窃案发生在5日清晨5时25分许，三名戴着面罩和手套的窃贼在强行打开一道紧急出口和一扇防火门后，进入拉利克博物馆主展厅。窃贼砸碎了六个展柜并盗走27件展品。据初步估算，被盗物品的价值超过450万欧元。（新华社）", "ctime": 1783399989, "time_str": "12:53:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260707/c678000807.shtml"}, {"id": "4664655", "title": "韩国综指跌幅扩大至8%", "content": "韩国综指跌幅扩大至8%，现报7405.11点。个股方面，SK海力士跌超10%，三星电子跌超9%。", "ctime": 1783399696, "time_str": "12:48:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260707/c678000776.shtml"}, {"id": "4664651", "title": "安徽：打造“免申贷”“免申保”“免申担”等金融产品矩阵 丰富完善“基金丛林”", "content": "7月7日上午，在《安徽省财政金融协同实施方案》政策解读新闻发布会上，安徽省委金融办副主任马先先表示，下一步，我们将抓好《实施方案》贯彻落实，强化金融政策与财政政策衔接配合，持续完善贴息、贴费、风险补偿等支持措施，发挥政府性融资担保体系增信、分险和引领作用，打造“免申贷”“免申保”“免申担”等金融产品矩阵，丰富完善“基金丛林”，通过“投、贷、担、保、补”一体化机制，形成财政引导、金融放大、市场运作的传导链条，构建覆盖科技创新全链条、科技企业全生命周期的金融服务体系，更好促进“科技—产业—金融”良性循环。（人民财讯）", "ctime": 1783399669, "time_str": "12:47:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260707/c678000769.shtml"}, {"id": "4664623", "title": "生态环境部发布新规 规范工业园区污水处理标准", "content": "生态环境部近日发布《工业园区污水集中处理设施水污染物排放标准制订技术导则》，为各地工业园区污水排放标准提供明确技术指引。当前，我国工业园区污水集中处理设施排放标准缺失，主要参考执行城镇污水处理厂污染物排放标准，存在特征污染物管控不全、排放限值不精准、风险防控力度不足等问题。新规明确地方制定排放标准需坚持分类管理、全面防控、科学可行、依法合规原则。将工业园区分为单一行业型和综合型两类，综合型工业园区可再细分行业类似型、主导型、差异型三个小类。地方根据实际情况和环境管理需要，筛选排放量大、有毒有害水污染物种类多、对受纳水体水生态环境风险高且现行排放标准不适用的一类园区，开展园区排放标准的制订；行业差异型园区优先考虑制订“一园一策”管控要求。（央视新闻）", "ctime": 1783399374, "time_str": "12:42:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260707/c678000676.shtml"}, {"id": "4664607", "title": "交通运输部：优先保障广西防汛抢险人员、防汛救灾物资运输，做好灾害损毁路段抢通保通", "content": "中央气象台预计，7月7日14时至8日14时，广西东南部、广东中南部、海南岛、湖北东北部、安徽中部、江苏大部、山东南部和东部、辽宁东部、吉林东南部、云南中西部等地部分地区有大到暴雨，其中，广西东南部、江苏中部、山东半岛东部、辽宁东部等地部分地区有大暴雨，广西东南部沿海等地局地特大暴雨（250～260毫米）。上述部分地区伴有短时强降水（最大小时降雨量20～50毫米，局地可超过80毫米），局地有雷暴大风等强对流天气。7月7日，交通运输部视频调度广西、广东、海南、湖北、安徽、江苏、辽宁、吉林、山东、内蒙古、云南省(区)交通运输主管部门及省交投、高速集团，山东、广西、长江海事局，要求各单位要提高思想认识，树牢底线思维，极限思维，始终把保障人民生命财产安全放在首位，重点做好交通运输领域防汛工作，优先保障广西防汛抢险人员、防汛救灾物资运输，做好灾害损毁路段的抢通保通。（界面新闻）", "ctime": 1783399166, "time_str": "12:39:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260707/c678000647.shtml"}, {"id": "4664603", "title": "俄称将与美在乌问题上保持接触", "content": "当地时间6日，美国总统特朗普在出席活动时称，解决俄乌冲突将“比人们认为的要快得多”。俄罗斯副外长里亚布科夫当天对此回应说，如果美国准备在俄方向美方提出的方案基础上采取行动，那么冲突确实有可能很快得到解决。美方最近种种言行表明，他们倾向于放弃通过和平谈判以及寻求妥协的方式来解决俄乌冲突。反对和平解决俄乌冲突的国家正试图利用这一点，英法德以及北约和欧盟领导人试图拉拢美国，这加剧了冲突紧张局势。里亚布科夫还表示，即便如此，俄方任何情况下也不会中断俄美在乌克兰问题上的接触，俄美两国工作层面的对话几乎“每天都在进行”，两国总统也保持着沟通。（新浪财经）", "ctime": 1783399088, "time_str": "12:38:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260707/c678000632.shtml"}, {"id": "4664601", "title": "四川为高温户外作业划出三道“红线”", "content": "近日，四川部分地区持续出现高温天气。7月6日，省人力资源社会保障厅发布通知，要求各地把保护劳动者生命安全摆在首位，充分认识到高温对环卫工人、快递员、外卖员等户外作业劳动者的危害，切实维护好高温作业劳动者的合法权益，全力保障劳动者生命安全和身体健康。维护劳动者的休息权利，用人单位应合理安排高温天气下户外工作时间，尽量避开酷热时段作业，适当增加劳动者休息时间和轮换班次。日最高气温达到40摄氏度以上时，停止安排室外露天作业；日最高气温达到37摄氏度以上、40摄氏度以下时，室外露天作业时间累计不得超过6小时，不得安排在当日气温最高时段3小时内室外露天作业；日最高气温达到35摄氏度以上、37摄氏度以下时，采取换班轮休等方式，缩短室外露天作业连续工作时间，并不得安排加班。（四川日报）", "ctime": 1783399063, "time_str": "12:37:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260707/c678000630.shtml"}, {"id": "4664599", "title": "软通动力与曙光汽车集团携手打造无人驾驶Robobus产品", "content": "7月2日，软通动力旗下无锡软通天驰智行科技有限公司与辽宁曙光汽车集团股份有限公司旗下丹东黄海汽车有限责任公司正式签署合作协议，建立全面战略合作关系，重点围绕无人驾驶Robobus打造具备行业竞争力产品，共同推动智能驾驶技术在商用车领域的规模化应用。此次全面合作，双方将聚焦文旅接驳、园区通勤、城市微循环等核心场景，分阶段完成无人驾驶Robobus的开发、测试与交付，逐步探索从示范运行到规模化商用的路径。（人民财讯）", "ctime": 1783398962, "time_str": "12:36:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260707/c678000614.shtml"}, {"id": "4664597", "title": "国家发改委：目前我国人工智能原生办公智能体月访问量超2000万次", "content": "国家发展改革委表示，目前我国人工智能原生办公智能体月访问量超2000万次，日均词元调用量达数百万亿次，较去年大幅提升。（央视财经）", "ctime": 1783398880, "time_str": "12:34:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260707/c678000580.shtml"}, {"id": "4664583", "title": "广西横州市强降雨已致4人死亡8人失联 已紧急转移安置53808人", "content": "7月7日上午，广西南宁市召开第二场防汛救灾新闻发布会，通报横州市、宾阳县防汛救灾进展情况并回答记者提问。截至7日11时，横州市死亡4人、失联8人。据统计，横州市受灾群众84700人，应转移54468人，已紧急转移安置53808人，剩余660名群众还在分批次组织撤离，预计今天完成转移；宾阳县受灾群众8606人，应转移8150人，已全部紧急转移安置完毕。（央视新闻）", "ctime": 1783398480, "time_str": "12:28:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260707/c678000525.shtml"}, {"id": "4664581", "title": "全球首款AI智能体手机将在2026世界人工智能大会首发首秀", "content": "上海市政府新闻办举行新闻发布会，介绍2026世界人工智能大会暨人工智能全球治理高级别会议筹备进展和人工智能产业发展等情况，并回答记者提问。论坛聚焦AI热点，将围绕世界模型、开源智能体、AI Coding、Token经济、OPC等议题，深入探讨行业新趋势；展览将首发首秀最新AI产品，业界最大规模超节点华为Atlas 950真机亮相，行业领先的MiniMax M3多模态大模型、阶跃Agent操作系统、近存计算3D芯片、全球首款AI智能体手机，以及多款人形机器人、AI灵巧手等重磅新品，都将在大会展出。（新浪财经）", "ctime": 1783398364, "time_str": "12:26:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260707/c678000511.shtml"}, {"id": "4664571", "title": "欧洲高温引发山火，数万人被迫紧急撤离", "content": "本周，欧洲多国迎来今夏第三波极端高温，热浪引发的山火在法国、希腊、葡萄牙和西班牙等国快速蔓延。受持续的高温与干旱影响，不仅数以万计的居民被迫紧急撤离，欧洲脆弱的电力和核能供应系统也正面临严峻“烤问”。（澎湃新闻）", "ctime": 1783398073, "time_str": "12:21:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260707/c678000470.shtml"}, {"id": "4664565", "title": "重庆发布高温橙色预警信号，日最高气温将升至37℃以上", "content": "重庆市气象台2026年7月7日11时40分发布“高温橙色预警信号”，预计7日13:00-19:00，渝中、沙坪坝、大渡口、九龙坡、南岸、两江新区、高新区、北碚、巴南、潼南、合川、大足、铜梁、璧山、荣昌、永川、江津、万州、开州、云阳、奉节、巫溪、巫山、彭水等24个区县，日最高气温将升至37℃以上。", "ctime": 1783397958, "time_str": "12:19:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260707/c678000454.shtml"}, {"id": "4664563", "title": "强对流天气已致湖北11人死亡 救援救灾正有序开展", "content": "记者7日上午从湖北省相关部门获悉，7月6日晚，湖北东部多地遭遇强对流天气袭击，发生强降雨和雷暴大风，部分乡镇出现龙卷风。截至目前，雷暴大风已造成1.46万人受灾，11人死亡，1人失联，救援救灾工作正有序开展，相关灾情还在进一步核实。 据介绍，7月6日至7日，黄石、黄冈、鄂州、咸宁等地遭遇强降雨和雷暴大风。其中，6日19时至23时，53个乡镇出现雷暴大风，其中2个乡镇达到13级，部分乡镇出现龙卷风。截至目前，雷暴大风已造成1.46万人受灾，11人死亡，1人失联，331人受伤，紧急避险996人，转移安置246人；倒塌房屋22间，损坏房屋4855间。 本次强对流天气，突发性极强、短时风力大。灾害发生后，湖北省委、省政府高度重视，指导督促省内各相关地区进一步做好防控工作，并要求各级干部立即投入救灾，全力救治伤员，防止发生次生灾害。(新华社)", "ctime": 1783397926, "time_str": "12:18:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260707/c678000451.shtml"}, {"id": "4664557", "title": "日本舆论批评高市早苗“轻视国会”", "content": "多家日本媒体和各界人士近日对日本首相高市早苗出席国会审议及答辩情况提出批评，质疑其“轻视国会”。据日本《每日新闻》报道，截至6日，高市在本届国会出席集中审议8次，累计29小时36分钟，仅为过去5年间前首相菅义伟、岸田文雄、石破茂平均出席时间的40%左右。此外，根据日本朝野2025年达成的协议，在4月至6月例行国会会期内，应每月举行一次党首讨论，但高市仅在今年5月出席过一次。在野党方面6日在国会指出，本届国会立法进程明显放缓：2023年至2025年三届例行国会期间，政府提交法案的通过率均接近98%；而本届国会会期临近结束，法案通过率只有73%。（新华社）", "ctime": 1783397654, "time_str": "12:14:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260707/c678000373.shtml"}, {"id": "4664555", "title": "Omdia：中国半导体市场规模将在2026年超过8000亿美金 存储芯片市场总额暴涨262.9%", "content": "根据Omdia 《2026年第二季度，半导体应用领域市场预测工具（AMFT）- 中国地区》最新报告数据显示，2026年中国半导体市场预计同比增长率将大幅上修至92.9%，达8120.8亿美元，相较于《AMFT出货量：中国——2025年四季度更新》版本 (2026年中国半导体市场预计增长31.26%，市场规模将达到5465亿美元)整体上调了2656亿美金，增幅达到48.6%。根据Omdia 2026年二季度最新数据显示，2026年中国半导体存储市场预计增长率大幅上修至262.9%，达4496亿美元。（财联社）", "ctime": 1783397592, "time_str": "12:13:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260707/c678000368.shtml"}, {"id": "4664553", "title": "广西南宁水文中心升级发布洪水红色预警", "content": "7月7日8时，南宁水文中心升级发布洪水红色预警。南宁水文中心预计，未来6～18小时，受台风强降雨影响，清水河宾阳县邹圩镇河段将出现超警戒水位（88.0米）4.5米左右的洪水，郁江横州市城区河段将出现超警戒水位（54.2米）1.8米左右的洪水，郁江南宁城区河段将出现超设防水位（69.4米）1.5米左右的洪水。（央视新闻）", "ctime": 1783397516, "time_str": "12:11:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260707/c678000352.shtml"}, {"id": "4664551", "title": "兆科眼科：老花眼创新药YUVEZZI获批准", "content": "兆科眼科公告，于2026年6月26日，公司老花眼创新药YUVEZZI（卡巴胆碱及酒石酸溴莫尼丁滴眼液（2.75%/0.1%））已获海南省药品监督管理局批准，于博鳌超级医院作为临床急需进口药品使用。YUVEZZI为中国首款获批准用于治疗老花眼的创新药。", "ctime": 1783397417, "time_str": "12:10:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260707/c678000338.shtml"}, {"id": "4664545", "title": "英特尔、微软联手加持 AI芯片及软件公司Syntiant冲刺美股IPO", "content": "专注于人工智能半导体与软件研发的Syntiant已正式提交首次IPO申请，Syntiant由包括首席执行官库尔特·布施（Kurt Busch）在内的四位联合创始人于2017年创立，公司主打超低功耗芯片及配套软件，可在耳机、可穿戴设备及工业系统等终端上完成AI计算任务。文件显示，持有公司5%以上受益所有权的股东包括英特尔、微软及Knowles。据数据平台PitchBook统计，该公司迄今累计融资3.11亿美元，在2024年12月的一轮投资后估值达6.46亿美元。（科创板日报）", "ctime": 1783397320, "time_str": "12:08:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260707/c678000292.shtml"}, {"id": "4664541", "title": "中国红十字会总会救灾物资已抵达广西受灾地区 开始分发", "content": "记者从中国红十字会总会了解到，针对第10号台风“美莎克”对广西造成的严重影响，中国红十字会总会向广西受灾地区紧急调拨赈济家庭包5000个，支持当地受灾群众转移安置和生活保障工作。目前，物资已抵达受灾地区开始分发。（央视新闻）", "ctime": 1783397092, "time_str": "12:04:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260707/c678000165.shtml"}, {"id": "4664539", "title": "自然资源部对甘肃启动地质灾害防御Ⅲ级响应", "content": "7月7日，甘肃省陇南市宕昌县一林区发生一起山体滑坡事件，致多人被埋。根据《自然资源部地质灾害防御响应工作方案》，自然资源部于7月7日9时启动地质灾害防御Ⅲ级响应，并派工作组赴现场指导开展抢险救援等工作。自然资源部要求甘肃省自然资源厅立即先行派出专家工作组前往现场，协助地方做好人员搜救、抢险救援期间技术支撑等工作，并举一反三，做好类似情况下地质灾害巡查排查、监测预警和防范应对等工作；请中国地质调查局、自然资源部地质灾害技术指导中心加强专家调度、组织协调、会商研判，全力协助指导做好技术支撑等工作。（新浪财经）", "ctime": 1783397079, "time_str": "12:04:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260707/c678000161.shtml"}, {"id": "4664525", "title": "香港交易所：场外结算公司拟于2026年底前提交成为CIPS直接参与者的申请", "content": "香港交易所公告，已与人民币跨境支付系统（CIPS）的营运机构—跨境银行间支付清算有限责任公司（跨境清算公司）签署合作备忘录，共同探讨深化跨境人民币业务合作，支持香港固定收益及货币生态圈的长远发展。香港交易所旗下附属公司香港场外结算有限公司（场外结算公司）拟于2026年底前提交成为CIPS直接参与者的申请，跨境清算公司将为该申请提供必要的辅导及培训。成为CIPS直接参与者后，场外结算公司将可通过CIPS直接进行人民币资金结算，为其参与者提供更高效的跨境人民币清算及结算服务。", "ctime": 1783396878, "time_str": "12:01:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260707/c678000112.shtml"}, {"id": "4664523", "title": "港股午评：恒生指数跌0.42%，恒生科技指数跌0.28%", "content": "港股午间收盘，恒生指数跌0.42%，恒生科技指数跌0.28%。恒指港股通ETF银华（159318）涨0.16%，港股通科技ETF鹏华（159751）涨0.23%。板块方面，通信设备、地面运输板块涨幅靠前；能源设备与服务、金属与采矿板块跌幅靠前。个股方面，果下科技涨21.98%，深演智能涨19.71%，海光芯正涨15.97%，来福谐波涨13.96%，嘉耀控股涨9.56%；佳鑫国际资源跌10.57%，澜起科技跌10.49%，贵州银行跌10.0%，长飞光纤光缆跌9.85%，快手-W跌9.48%。", "ctime": 1783396870, "time_str": "12:01:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260707/c678000110.shtml"}, {"id": "4664521", "title": "国家发展改革委披露人工智能产业“十五五”五大工作思路，强化模型、算力、数据等关键技术攻关", "content": "在上海市政府新闻发布会上，国家发展改革委创新和高技术发展司副司长王若蒙7月7日披露了我国人工智能产业“十五五”期间的工作思路：一是加快自主创新。强化模型、算力、数据等关键技术攻关，加大基础研究，形成更多原创性成果，为全球人工智能发展贡献中国智慧。二是强化应用牵引。聚焦对经济贡献大、战略价值高、社会效益好的领域，开放一批高价值场景，打造一批标杆应用。同时，关注人工智能对就业的影响，促进人工智能创造新岗位、赋能传统岗位，优先在“险脏累繁重”场景推广应用。三是深化生态协同。持续推动软硬件深度适配、开闭源共同繁荣、产学研用贯通融合、区域错位发展，大幅提升生态协同效能。四是坚持开放共赢。广泛开展人工智能国际合作，推动技术开源普惠，支持全球南方国家加强人工智能能力建设，积极参与人工智能领域国际治理。五是确保安全可控。统筹发展和安全，加快推进人工智能领域立法，健全制度规则体系，防范数据滥用、深度伪造、隐私泄露等风险，确保人工智能发展为人类所用、为人类所控。（财联社）", "ctime": 1783396787, "time_str": "11:59:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260707/c678000054.shtml"}, {"id": "4664519", "title": "甘肃省陇南市宕昌县发生山体滑坡，自然资源部启动地质灾害防御Ⅲ级响应", "content": "7月7日，甘肃省陇南市宕昌县一林区发生一起山体滑坡事件，致多人被埋。自然资源部于7月7日9时启动地质灾害防御Ⅲ级响应，并派工作组赴现场指导开展抢险救援等工作。自然资源部要求甘肃省自然资源厅立即派出专家工作组前往现场，协助地方做好人员搜救、抢险救援期间技术支撑等工作，并做好类似情况下地质灾害巡查排查、监测预警和防范应对等工作；请中国地质调查局、自然资源部地质灾害技术指导中心加强专家调度、组织协调、会商研判，全力协助指导做好技术支撑等工作。（央视新闻）", "ctime": 1783396712, "time_str": "11:58:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260707/c678000021.shtml"}, {"id": "4664517", "title": "快手跌超10%", "content": "快手跌超10%，公司称预期腾讯控股出售事项将不会对本集团营运产生任何重大不利影响。", "ctime": 1783396386, "time_str": "11:53:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260707/c677999949.shtml"}, {"id": "4664515", "title": "南向资金净买入超30亿港元", "content": "据同花顺iFinD数据，截至目前，南向资金净买入超30亿港元，其中港股通（沪）买入超14.65亿港元，港股通（深）买入超15.38亿港元。", "ctime": 1783396263, "time_str": "11:51:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260707/c677999928.shtml"}, {"id": "4664499", "title": "美股纳斯达克100指数期货跌超1%", "content": "美股纳斯达克100指数期货跌超1%，标普500指数期货跌0.26%，道琼斯指数期货涨0.09%。", "ctime": 17 // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
