ime": 1784173103, "time_str": "11:38:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260716/c678217408.shtml"}, {"id": "4735369", "title": "努比亚官宣首款AI智能体手机NaviX Ultra", "content": "7月16日，中兴通讯旗下手机品牌努比亚宣布，其首款AI智能体手机——搭载豆包手机助手的努比亚NaviX Ultra正式亮相。（界面新闻）", "ctime": 1784173057, "time_str": "11:37:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260716/c678217355.shtml"}, {"id": "4735333", "title": "ETF两市成交额报3251.68亿元，较昨日此时缩量239.18亿元", "content": "截至目前，ETF两市成交额报3251.68亿元，较昨日此时缩量239.18亿元，分类型来看，股票型ETF成交额1176.22亿元，债券型ETF成交额1225.55亿元，货币型ETF成交额94.89亿元，商品型ETF成交额22.82亿元，QDII型ETF成交额730.97亿元。", "ctime": 1784172737, "time_str": "11:32:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260716/c678217241.shtml"}, {"id": "4735331", "title": "给千万千瓦级清洁能源基地配上AI“指挥官”", "content": "我国首个面向千万千瓦级水风光一体化清洁能源基地的智慧运营大模型——雅砻江水风光一体化智慧运营大模型正式发布，为大型清洁能源基地装上了一个AI“指挥官”。这个“指挥官”通过统一分析气象、水文、设备运行、电网调度等多个系统的数据，为运行人员提供辅助决策。大模型将流域径流有效预报预见期由传统十余天延长至60天，其中前10天实现小时级预测，第11天至60天实现日尺度预测；光伏场站设备故障识别准确率超过96%。（新华社）", "ctime": 1784172728, "time_str": "11:32:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260716/c678217239.shtml"}, {"id": "4735317", "title": "ETF午评：港股通互联网ETF领涨5.27%，科创综指ETF领跌4.57%", "content": "ETF午间收盘涨跌不一，港股通互联网ETF（520630）领涨5.27%，港股互联网ETF（513770）涨4.96%，港股通互联网ETF（513040）涨4.90%，科创综指ETF（589300）领跌4.57%，半导体设备ETF（159516）跌3.61%，半导体设备ETF（560780）跌3.55%。", "ctime": 1784172667, "time_str": "11:31:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260716/c678217221.shtml"}, {"id": "4735319", "title": "A股午评：科创50指数探底回升半日跌0.96%，影视院线、医疗服务、文化传媒板块涨幅居前", "content": "A股三大指数早盘集体下跌，截至午盘，上证指数跌0.82%，深证成指跌0.83%，创业板指跌1.73%，北证50跌1.63%，科创50指数跌0.96%。全市场成交额14897亿元，较上日缩量2367亿元，全市场超3200只个股上涨。板块题材上，影视院线、医疗服务、文化传媒、消费电子、猪肉板块涨幅居前；电子化学品、存储芯片、半导体、煤炭开采加工、油气开采及服务板块跌幅居前。盘面上，影视院线板块低开高走，儒意电影、上海电影、欢瑞世纪涨停，光线传媒、博纳影业、百纳千成涨幅居前。医疗服务板块探底回升持续走强，南华生物、创新医疗涨停，万邦医药、普蕊斯、百奥赛图、昭衍新药涨幅居前。消费电子板块表现活跃，格林精密、福日电子、芙蓉科技等多股涨停，福立旺、慧为智能、影石创新涨幅居前。电子化学品板块低开低走，海星股份、安集科技、格林达跌幅居前。存储芯片板块延续颓势，德明利二连跌停，天山电子、精测电子、江丰电子、澜起科技跌超10%。", "ctime": 1784172662, "time_str": "11:31:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260716/c678217222.shtml"}, {"id": "4735313", "title": "股指期货早盘收盘 主力合约全线下跌", "content": "股指期货早盘收盘，主力合约全线下跌。沪深300股指期货(IF)主力合约跌0.67%，上证50股指期货(IH)主力合约跌0.40%，中证500股指期货(IC)主力合约跌0.56%，中证1000股指期货(IM)主力合约跌0.59%。", "ctime": 1784172627, "time_str": "11:30:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260716/c678217217.shtml"}, {"id": "4735287", "title": "40家拟IPO企业主动撤单", "content": "数据显示，截至2026年7月15日，今年A股市场共有40家拟IPO企业终止上市进程，全部为发行人或保荐机构主动撤回申请。对比2025年同期74家的撤单规模，降幅接近五成。市场普遍认为，这一显著变化折射出IPO入口端质量把关持续升级，拟上市企业申报更趋审慎。不过，在现场检查常态化、中介机构责任持续压实的大背景下，仍有部分企业在被抽中现场检查后紧急撤退，“一查即撤”现象仍存。业内人士表示，主动撤单不等于免责，“申报即担责”已落地为刚性约束。 梳理40家撤单项目板块分布发现，北交所成为上半年IPO主动撤单的主要板块，共计23家企业终止IPO进程，占撤单总量的近六成；上交所主板4家、科创板6家、深交所主板2家、创业板5家。撤单企业主要集中于工业设备、基础化工、有色金属、半导体等行业。(新浪财经)", "ctime": 1784172423, "time_str": "11:27:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260716/c678217131.shtml"}, {"id": "4735261", "title": "南向资金净买入超20亿港元", "content": "据同花顺iFinD数据，截至目前，南向资金净买入超20亿港元，其中港股通（沪）买入超8.43亿港元，港股通（深）买入超11.78亿港元。", "ctime": 1784171950, "time_str": "11:19:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260716/c678217036.shtml"}, {"id": "4735251", "title": "伊朗袭击科威特和约旦境内美军设施", "content": "综合伊朗伊斯兰革命卫队16日发表的声明和伊朗媒体报道，在新一波攻势中，伊朗武装力量袭击了科威特、约旦境内的美军设施。 革命卫队16日在社交媒体发表声明说，革命卫队海军和空军部队使用导弹和无人机，摧毁了美军位于科威特的阿里·萨利姆空军基地的预警雷达系统和一处美军士兵集结场所。 伊朗伊斯兰共和国广播电视台报道，伊朗军队当日使用无人机袭击了位于约旦阿兹拉克的美军基地的雷达站、通信系统和燃料库。 革命卫队发言人此前在社交媒体上发文称，伊朗目前的行动集中于摧毁美国在该地区的“进攻性基础设施”，下一步行动随后将展开。(新华社)", "ctime": 1784171739, "time_str": "11:15:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260716/c678216958.shtml"}, {"id": "4735241", "title": "美媒：美国防部正研究对古巴军事行动方案", "content": "据美国哥伦比亚广播公司15日报道，据多名知情官员透露，美国防部的军事规划人员近几周来研究了对古巴采取军事行动的一系列方案，其中包括由陆军主导、第101空降师执行、动用数千名士兵的空中突击行动。 报道说，上月底，美军举行过一次作战构想简报会，讨论了执行特定任务的初期军事行动方案。但这并不表明美国总统特朗普或五角大楼已决定实施具体行动。 报道还说，美国国务院进一步加紧对古巴的金融制裁。美国国务卿鲁比奥多次强调，美方倾向于通过外交途径迫使古巴“向技术官僚领导、愿意推行经济改革的新政府过渡”。 接受哥伦比亚广播公司采访的官员还表示，鉴于上周美国对伊朗的军事行动重新开始，目前不太可能将军事重点转移到古巴。(新华社)", "ctime": 1784171482, "time_str": "11:11:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260716/c678216895.shtml"}, {"id": "4735235", "title": "零售板块震荡走高，大连友谊触及涨停", "content": "零售板块震荡走高，大连友谊触及涨停，新华百货此前涨停，宁波中百、小商品城、德必集团、三江购物跟涨。", "ctime": 1784171435, "time_str": "11:10:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260716/c678216885.shtml"}, {"id": "4735229", "title": "美国对三星电子等公司发起337调查", "content": "美国国际贸易委员会（ITC）决定对特定动态随机存取存储器（DRAM）设备及其下游产品和组件启动337调查，涉及三星电子、谷歌、英伟达等公司。Netlist, Inc.提出调查申请，主张产品违反美国337条款，请求发布有限排除令、禁止令。（界面新闻）", "ctime": 1784171292, "time_str": "11:08:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260716/c678216812.shtml"}, {"id": "4735221", "title": "今年上半年检察机关起诉破坏社会主义市场经济秩序犯罪5.8万人", "content": "记者从7月16日召开的第十六次全国检察工作会议上了解到，检察机关坚持和落实“两个毫不动摇”，依法平等保护各种所有制经济产权，2026年上半年，起诉破坏社会主义市场经济秩序犯罪5.8万人，促进营造法治化营商环境。检察机关深化违规异地执法和趋利性执法司法专项监督，依法办理案件1.1万件，监督侦查机关撤案1060件，决定不起诉1324人，监督解除、返还违法查封、扣押、冻结财物8.5亿元。会同税务总局等部门常态化联合打击涉税违法犯罪，起诉涉税犯罪3485人。依法严惩战略矿产走私出口等犯罪，起诉走私犯罪4435人。加强反垄断和反不正当竞争检察履职，起诉损害商誉、强迫交易等犯罪4759人，办理公益诉讼128件，服务构建全国统一大市场。（最高检）", "ctime": 1784171246, "time_str": "11:07:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260716/c678216743.shtml"}, {"id": "4735203", "title": "细胞免疫治疗板块短线拉升，海南海药涨停", "content": "细胞免疫治疗板块短线拉升，海南海药涨停，南华生物此前封板, 博瑞医药涨超10%，阳光诺和、舒泰神、和元生物、塞力医疗、泽璟制药等跟涨。相关ETF方面，生物医药ETF汇添富（159839）涨0.8%，成交额1.16亿元，生物科技ETF易方达（159837）成交额3928.7万元。", "ctime": 1784171060, "time_str": "11:04:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260716/c678216705.shtml"}, {"id": "4735201", "title": "医疗研发外包板块短线拉升，万邦医药涨超10%", "content": "医疗研发外包板块短线拉升，万邦医药涨超10%，阳光诺和、普蕊斯、博济医药、和元生物、睿智医药等跟涨。", "ctime": 1784171029, "time_str": "11:03:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260716/c678216700.shtml"}, {"id": "4735199", "title": "国家疾控局：新冠病毒疫情呈低流行水平", "content": "记者7月16日从国家疾控局新闻发布会获悉，当前全国呼吸道传染病整体呈低流行水平，鼻病毒、副流感病毒等呈现一定活动，新冠病毒疫情呈低流行水平。进入暑期后，蚊媒孳生活跃，人员流动增加，病媒生物传染病疫情风险升高，境外输入引起本地传播风险增加，南方部分省份存在登革热、基孔肯雅热聚集性疫情发生风险。（新华社）", "ctime": 1784171003, "time_str": "11:03:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260716/c678216694.shtml"}, {"id": "4735181", "title": "联合国秘书长古特雷斯抵达上海，出席2026世界人工智能大会暨人工智能全球治理高级别会议", "content": "16日上午，联合国秘书长古特雷斯乘机抵达上海浦东国际机场。他将出席7月17日至20日在上海举行的2026世界人工智能大会暨人工智能全球治理高级别会议。古特雷斯秘书长曾多次呼吁强化人工智能全球治理。近年来，联合国设立全球人工智能治理对话和国际人工智能科学小组两项机制，为各国加强沟通、凝聚共识、拓展合作提供了重要平台。（央视新闻）", "ctime": 1784170764, "time_str": "10:59:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260716/c678216601.shtml"}, {"id": "4735179", "title": "美国务院批准向沙特出售近20亿美元武器装备", "content": "美国国务院15日发表声明称，已批准一项面向沙特阿拉伯“可能的对外军售”，涉及“先进精确杀伤性武器系统及相关装备”，总价预计为19.6亿美元。(新华社)", "ctime": 1784170758, "time_str": "10:59:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260716/c678216600.shtml"}, {"id": "4735165", "title": "中欧班列（西安）上半年累计开行超3000列 同比增长8.3%", "content": "记者从国铁西安局了解到，今年1—6月，中欧班列（西安）开行3310自然列，同比增长8.3%。其中：中欧方向开行2858列，中亚方向开行452列；运送货物总重375.3万吨，同比增长6.2%；发送31.8万标箱，同比增长2.2%；开行量、货运量、重箱率多项核心指标连续8年领跑全国。（央视新闻）", "ctime": 1784170699, "time_str": "10:58:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260716/c678216592.shtml"}, {"id": "4735139", "title": "荷兰高温期间两周内超额死亡人数超900", "content": "荷兰国家公共卫生与环境研究所15日说，6月22日至7月5日的两周内，荷兰超额死亡人数达到911人，高温“极有可能”是导致超额死亡的原因之一。 超额死亡人数指特定地点和特定时期估计的总死亡人数与没有健康危机情况下的估计死亡人数之间的差额。统计数据显示，6月22日至7月5日，荷兰各地均记录到超额死亡，其中气温最高的南部和东部地区超额死亡人数最多，达576人。从年龄段看，全国80岁及以上老年人超额死亡人数达547人，增幅明显。 荷兰国家公共卫生与环境研究所说，极端高温下，器官功能相对较弱的老年人尤其脆弱。此外，患有心血管和肺部疾病的人群也面临更高的健康风险，高温可能加重这些疾病症状。 荷兰皇家气象研究所数据显示，6月22日至28日，荷兰遭遇罕见高温天气，最高气温一度达39.4摄氏度。目前，荷兰高温天气仍在持续，多地启动高温应对计划。荷兰政府呼吁医疗机构、护理人员等特别关注老年人、慢性病患者、婴幼儿等人群的健康，做好应急准备。(新华社)", "ctime": 1784170386, "time_str": "10:53:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260716/c678216524.shtml"}, {"id": "4735137", "title": "伊朗方面称打击科威特及约旦美军目标", "content": "伊朗方面当地时间7月16日消息，伊朗伊斯兰革命卫队使用导弹和无人机打击了位于科威特的阿里·萨利姆美军基地，打击目标包括雷达预警系统和美军人员集会地点。此外，伊朗伊斯兰革命卫队还打击了位于约旦的阿兹拉克美军基地，打击目标包括军方通信系统和燃料存储设施。（央视新闻）", "ctime": 1784170372, "time_str": "10:52:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260716/c678216523.shtml"}, {"id": "4735133", "title": "机构：2030年全球录制音乐市场规模将突破560亿美元，中国有望跃居全球第二", "content": "7月16日，根据Omdia最新预测，2026年全球录制音乐零售市场销售额预计将达到483亿美元，并将在2027年突破500亿美元，到2030年进一步增至568亿美元。Omdia预计，未来五年中国在全球录制音乐市场中的排名将持续攀升。中国于2022年超越法国，首次跻身全球前五；预计将于2028年超越英国，并于2029年超越日本。到2030年，中国录制音乐零售市场收入预计将占全球市场的8.7%，高于2025年的5.8%。美国仍将稳居全球第一大录制 const SECTORS  = [{"name": "金融", "hit_count": 31, "etfs": []}, {"name": "半导体", "hit_count": 29, "etfs": []}, {"name": "人工智能", "hit_count": 28, "etfs": []}, {"name": "数据要素", "hit_count": 27, "etfs": []}, {"name": "军工", "hit_count": 14, "etfs": []}, {"name": "消费", "hit_count": 12, "etfs": []}, {"name": "低空经济", "hit_count": 9, "etfs": []}, {"name": "医药", "hit_count": 7, "etfs": []}];
const META     = {"update_time": "2026-07-16 12:31:42", "sentiment_score": 52.926829268292686, "agents": []};

// 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
