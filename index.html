.score-bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s; }
.up { color: var(--red); }
.down { color: var(--green); }
.pulse { animation: pulse 2s infinite; }
@keyframes pulse {

  50% { opacity: 0.5; }

.glow { box-shadow: 0 0 20px rgba(59,130,246,0.15); }

总认缴出资额为人民币8000万元，贝特瑞以自有货币资金一次性实缴出资1000万元，占基金认缴出资总额的12.50%。", "ctime": 1779185601, "time_str": "18:13:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260519/c676806652.shtml"}, {"id": "4380659", "title": "哔哩哔哩：第一季度经调整净利润为人民币5.85亿元，同比增长62%", "content": "哔哩哔哩-W公告，2026年第一季度净营业额总额达人民币74.7亿元，同比增长7%。广告营业额为人民币25.9亿元，同比增长30%。净利润为人民币2.02亿元，2025年同期净亏损人民币1070万元。经调整净利润为人民币5.85亿元，同比增长62%。", "ctime": 1779185479, "time_str": "18:11:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260519/c676806612.shtml"}, {"id": "4380621", "title": "宁德时代与山西省共建新能源全产业链集群", "content": "近日，宁德时代与山西省人民政府在山西太原签署深度战略合作协议，并与大同市人民政府签署零碳城市合作协议。双方将紧抓“建设新型能源体系”与“能源强国”的战略机遇，共同打造“铝—锂”双轮驱动的新能源全产业链集群，并建设以换电重卡为核心的应用高地。（人民财讯）", "ctime": 1779185086, "time_str": "18:04:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260519/c676806048.shtml"}, {"id": "4380615", "title": "伊朗军方发言人称若再次遭袭将“开启新战线”", "content": "据伊朗方面19日消息，伊朗军方发言人表示，如果敌方“再次作出错误判断”并再次对伊朗发动袭击，伊方将“利用新的工具和方式开启新的战线”予以回应。(央视新闻)", "ctime": 1779184972, "time_str": "18:02:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260519/c676806008.shtml"}, {"id": "4380613", "title": "招商轮船：收到上海监管局行政监管措施决定书", "content": "招商轮船公告，公司于2026年5月19日收到中国证券监督管理委员会上海监管局出具的《关于对招商轮船采取出具警示函措施的决定》。因全资子公司中外运集装箱运输有限公司存在会计差错，导致公司2021年年报、2022年和2023年半年报、年报披露的财务报告不准确。", "ctime": 1779184967, "time_str": "18:02:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260519/c676806004.shtml"}, {"id": "4380611", "title": "贝壳：第一季度净收入189亿元，同比下降19.0%", "content": "贝壳-W公告，2026年第一季度总交易额人民币7117亿元，同比下降15.6%。净收入189亿元，同比下降19.0%。净利润12.55亿元，同比增加46.7%。经调整净利润16.11亿元，同比增加15.7%。", "ctime": 1779184936, "time_str": "18:02:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260519/c676805997.shtml"}, {"id": "4380609", "title": "贵州继续发布暴雨橙色预警", "content": "今天16时，贵州省气象台继续发布暴雨橙色预警。今天傍晚到明天白天，六盘水市南部、黔西南州大部、黔南州南部、黔东南州中南部、安顺市中南部等地区局地有暴雨，黔西南州北部和东部、黔南州南部、黔东南州南部、安顺市南部、六盘水市南部部分乡镇有大暴雨。贵州省的西南部和南部地区雷雨中局地伴有短时强降水、雷暴大风、冰雹等强对流天气。气象部门提示：当地群众要密切关注天气预报预警信息，避免在强降雨、强对流时段出行，户外如遇暴雨、强对流天气请尽快进入牢固建筑物内躲避，远离广告牌、大树、临时搭建物，近期不要前往山区、河流等灾害易发区域。（央视新闻）", "ctime": 1779184897, "time_str": "18:01:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260519/c676805973.shtml"}, {"id": "4380607", "title": "珠海机场香港太子城市候机楼今日正式启用", "content": "5月19日，珠海机场香港太子城市候机楼正式启用。这是珠海机场在香港市区布局的首个城市候机楼，标志着珠海机场港澳服务网络进一步完善，为珠港跨境航空出行一体化发展提供了全新支撑。（央视新闻）", "ctime": 1779184852, "time_str": "18:00:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260519/c676805954.shtml"}, {"id": "4380567", "title": "泽宇智能：股东拟转让1061.17万股 转让比例2.62%", "content": "泽宇智能公告，股东浙江汇盟创业投资合伙企业（有限合伙）拟通过询价转让方式转让1061.17万股，占公司总股本的2.62%。本次转让不通过集中竞价交易或大宗交易方式进行，受让方受让股份后6个月内不得转让。", "ctime": 1779184758, "time_str": "17:59:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260519/c676805895.shtml"}, {"id": "4380559", "title": "广西今夜至22日降雨频繁 局地或现特大暴雨并伴强对流", "content": "今天（5月19日）夜间至22日，广西降雨天气频繁，局地大暴雨或特大暴雨，并伴强对流，公众出行请留意交通安全，尽量避开强降雨和强对流时段，防范山洪、滑坡等次生灾害的发生。（央视新闻）", "ctime": 1779184579, "time_str": "17:56:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260519/c676805811.shtml"}, {"id": "4380553", "title": "WOAH呼吁加强动物源病毒监测", "content": "当地时间5月18日，第93届世界动物卫生组织国际代表大会在法国巴黎召开。鉴于近期汉坦病毒、埃博拉等疫情再次引发国际社会的高度关注，世界动物卫生组织总干事及与会专家指出，加强动物源病毒的监测、提升早期发现能力，对于降低公共卫生风险具有重要意义。（CCTV国际时讯）", "ctime": 1779184461, "time_str": "17:54:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260519/c676805659.shtml"}, {"id": "4380551", "title": "天阳科技：公司与海南航空签署航空互联网项目建设与运营合同", "content": "天阳科技公告，公司与海南航空控股股份有限公司、环球航通信息服务有限公司签署了《航空互联网项目建设与运营合同》。根据合同，天阳科技将为合作机队提供航空互联网平台运营服务，包括机上娱乐服务、广告经营、商业活动等。合同有效期为10年，合同的签署对公司当期的营业收入、净利润等经营业绩和生产经营不构成重大影响。", "ctime": 1779184432, "time_str": "17:53:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260519/c676805626.shtml"}, {"id": "4380549", "title": "晨化股份：完成注销204.65万股已回购股份", "content": "晨化股份公告，公司已完成注销204.65万股已回购股份，占注销前公司总股本的0.9518%。本次注销完成后，公司总股本由2.15亿股变更为2.13亿股。控股股东于子洲先生持股比例由23.83%被动增加至24.06%，持有公司股份的数量未发生变化。", "ctime": 1779184429, "time_str": "17:53:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260519/c676805625.shtml"}, {"id": "4380547", "title": "江西发布雷电黄色预警", "content": "江西省气象台5月19日16时55分发布雷电黄色预警信号：预计未来6小时内，萍乡、新余、宜春、南昌、景德镇五市和吉安、抚州、鹰潭三市北部及上饶市西部的部分地区有雷电活动，局地伴有短时强降水、雷暴大风等强对流天气，请注意防范。（央视新闻）", "ctime": 1779184422, "time_str": "17:53:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260519/c676805622.shtml"}, {"id": "4380543", "title": "美股股指期货跌幅扩大，纳指期货跌0.8%", "content": "美股股指期货跌幅扩大，纳指期货跌0.8%，触及日内低点，标普500指数期货跌超0.5%，道指期货跌0.3%。", "ctime": 1779184404, "time_str": "17:53:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260519/c676805615.shtml"}, {"id": "4380537", "title": "欧科亿：拟以不超过1.75亿元受让永鑫精工33.5%的股权", "content": "欧科亿公告，公司于2026年5月18日与永鑫精工及主要股东签署《股权收购及增资扩股框架协议》，拟以不超过1.75亿元受让目标公司原股东所持33.5%的股权，并以目标公司投前估值不超过7亿元，向目标公司现金增资2.5亿元，取得增资后目标公司26.3158%的股权。交易完成后，公司合计持有目标公司51%股权，将成为目标公司的控股股东，目标公司将成为公司的控股子公司。", "ctime": 1779184372, "time_str": "17:52:52", "stock_c     el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
