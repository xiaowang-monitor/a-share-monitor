<style>
:root {
  --bg-primary: #0a0e17;

  --text-primary: #e2e8f0;

* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Noto Sans SC', sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  min-height: 100vh;
}
.mono { font-family: 'JetBrains Mono', monospace; }
.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 20px;
  transition: all 0.2s;
}
.card:hover { background: var(--bg-card-hover); border-color: #334155; }
.badge {
  display: inline-flex; align-items: center; padding: 2px 8px;
  border-radius: 6px; font-size: 12px; font-weight: 500;
}
.badge-s { background: rgba(239,68,68,0.2); color: #ef4444; }
.badge-a { background: rgba(245,158,11,0.2); color: #f59e0b; }
.badge-b { background: rgba(59,130,246,0.2); color: #3b82f6; }
.badge-c { background: rgba(100,116,139,0.2); color: #94a3b8; }
.score-bar {
  height: 6px; border-radius: 3px; background: #1e293b; overflow: hidden;
}
.score-bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s; }
.up { color: var(--red); }
.down { color: var(--green); }
.pulse { animation: pulse 2s infinite; }
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}
.glow { box-shadow: 0 0 20px rgba(59,130,246,0.15); }
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg-primary); }
::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
</style>

            </tr>
          </thead>
          <tbody id="picks-table"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- 新闻流 + 交易代理 -->
<div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
  <div class="card">

_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261103/c681401259.shtml"}, {"id": "5551411", "title": "朝鲜国际部部长金成男今天访问北京？外交部回应", "content": "11月3日，外交部发言人毛宁主持例行记者会。日本共同社记者提问，据报道朝鲜劳动党中央政治局委员、国际部部长金成男今天访问北京，发言人能否介绍他将同中方哪位领导会谈交流？毛宁表示：“我还不了解有关情况。”（澎湃新闻）", "ctime": 1793691669, "time_str": "15:41:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261103/c681401212.shtml"}, {"id": "5551397", "title": "腾讯入股奇想文化传播公司", "content": "近日，郑州奇想文化传播有限公司发生工商变更，新增广西腾讯创业投资有限公司为股东，同时，注册资本由100万元人民币增至约118万元人民币。该公司成立于2021年5月，法定代表人为陈天源，经营范围包括组织文化艺术交流活动、咨询策划服务、市场营销策划等，由李渊、陈天源及上述新增股东等共同持股。", "ctime": 1793691625, "time_str": "15:40:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261103/c681401198.shtml"}, {"id": "5551383", "title": "万亿资管巨头发声：全球资本看好中国市场机遇", "content": "近日，富兰克林邓普顿联席总裁及首席商务官Daniel Gamba接受21世纪经济报道记者专访时表示：“中国资本市场正日益成为全球投资格局中不可或缺的重要组成部分。我们看到越来越多的中国投资者寻求全球化资产配置，同时全球投资者也在持续寻求中国市场的投资机遇。” 在Daniel Gamba看来，投资者的核心诉求始终是获取最优标的，而非局限于特定的投资方法。 （21财经）", "ctime": 1793691577, "time_str": "15:39:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261103/c681401173.shtml"}, {"id": "5551379", "title": "德众汽车：二级子公司拟以70.48万元向实际控制人销售汽车", "content": "德众汽车公告，公司二级子公司怀化宝悦汽车销售服务有限公司拟与公司实际控制人段坤良签订《汽车产品销售合同》，向其销售一台问界M9 Ultimate 2026款Ultimate先行者纯电五座四驱，成交价70.48万元。该交易属于偶发性关联交易，不构成重大资产重组。公司董事会已审议通过相关议案，关联董事段坤良回避表决；该议案经董事会审计委员会及独立董事专门会议审议通过，无需提交股东会审议。", "ctime": 1793691560, "time_str": "15:39:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261103/c681401165.shtml"}, {"id": "5551361", "title": "黑石总裁JonGray：对AI基础设施赛道信心十足 算力需求远超供给", "content": "黑石总裁兼首席运营官JonGray在香港出席国际金融领袖投资峰会时称，黑石所投企业过去一年AI模型相关支出大增20倍，驱动企业持续加码AI的核心原因，是内容创作、客户交互、代码编写等AI应用已经落地并产生实实在在的财务收益。JonGray表示，他对AI基础设施赛道信心充足，底层逻辑来自基础供需规律，当前算力需求十分旺盛。他对比90年代末电信热潮指出，当年行业模式是先搭建供给、等待需求跟进；而当下AI市场完全反过来，需求大幅跑赢供给，这令他对AI发展别具信心。", "ctime": 1793691461, "time_str": "15:37:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261103/c681401084.shtml"}, {"id": "5551359", "title": "富士达：董事兼总经理付景超增持4万股，持股比例升至0.0378%", "content": "富士达公告，董事兼总经理付景超于2026年11月2日通过集中竞价增持公司股份4万股，增持金额94.41万元，增持均价23.6元/股。增持后持股7.1万股，占公司总股本0.0378%。增持资金来源为自有资金；付景超承诺增持完成后6个月内不减持所持股份。截至公告披露日暂无后续增持计划，本次增持不会导致公司控股股东、实际控制人发生变化。", "ctime": 1793691457, "time_str": "15:37:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261103/c681401074.shtml"}, {"id": "5551345", "title": "外交部：互联网技术应当增强人的能力 不能让技术加剧人类发展的分化", "content": "11月3日，外交部发言人毛宁主持例行记者会。有记者提问：2026世界互联网大会刚刚在乌镇开幕。今年主题是“开源开放 共建共享——携手构建网络空间命运共同体”，重点围绕数智时代前沿热点议题特别是人工智能发展实践与治理理念进行交流，中方能否进一步介绍情况？人工智能时代也带来技术滥用、数字鸿沟、泛安全化等风险，中方如何看待？\n\n对此，毛宁表示，尽管技术发展日新月异，人们普遍关心的一个重大命题却始终没有变，那就是如何让互联网更好造福人类。习近平主席在2015年世界互联网大会上提出构建网络空间命运共同体理念，为解决互联网发展和治理问题提供了中国方案。互联网发展的最终目的，是促进人的全面发展，需要更加突出以人为本的价值取向。互联网技术应当增强人的能力、拓展人的选择、彰显人的价值、增进人的福祉，不能让人成为技术的附庸，更不能让技术加剧人类发展的分化。\n\n国际社会携手构建网络空间命运共同体，要坚持科技赋能，开拓新的发展空间，中国将坚持开门搞创新，促进技术转移和知识共享，与各国一道打造开放包容、充满活力的数字创新生态。(央视新闻)", "ctime": 1793691344, "time_str": "15:35:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261103/c681400985.shtml"}, {"id": "5551337", "title": "南向资金净买入超200亿港元", "content": "据同花顺iFinD数据，截至目前，南向资金净买入超200亿港元，其中港股通（沪）买入超135.30亿港元，港股通（深）买入超65.18亿港元。", "ctime": 1793691279, "time_str": "15:34:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261103/c681400968.shtml"}, {"id": "5551319", "title": "广东：推广“人工智能+”零售 拓展智能导购、无人售货等场景", "content": "广东省发展改革委印发《广东省扩大消费实施方案》。其中提出，加快零售业创新转型。统筹大型商超、品牌门店、社区便民店等多元零售业态布局，推动步行街（商圈）优化业态、突出特色。发展即时零售、仓储会员店等零售新业态，鼓励电商平台在粤设立销售总部或区域总部。鼓励发展融合型、时尚型、策展型、主题型、社区型零售。推广“人工智能+”零售，拓展智能导购、无人售货等场景。支持零售经营主体从商品经营转向多业态综合运营，发展深度联营、自采自营、批零兼营、制造型零售，鼓励中小零售经营主体联盟合作、自愿连锁。", "ctime": 1793691180, "time_str": "15:33:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261103/c681400902.shtml"}, {"id": "5551317", "title": "平高电气：中标国家电网项目约9.98亿元，占2025年营业收入7.97%", "content": "平高电气公告，公司及子公司、合营公司成为国家电网有限公司2026年输变电项目第五次变电设备（含电缆）公开招标采购及变电设备直接采购（单一来源）相关项目中标单位，中标金额合计约为9.98亿元，占2025年营业收入的7.97%。其中，公开招标采购项目中标金额合计约为9.22亿元，直接采购项目中标金额合计约为0.76亿元。目前公司尚未与国家电网有限公司相关机构签署正式商务合同，合同条款尚存在不确定性，交货时间需根据实际合同要求确定，对公司当期业绩影响存在不确定性。", "ctime": 1793691176, "time_str": "15:32:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261103/c681400901.shtml"}, {"id": "5551291", "title": "伊朗议会议长：伊方已在战场及军事领域处于最高级别防御状态", "content": "当地时间3日，伊朗议会议长卡利巴夫表示，伊朗已做好战斗准备，手指扣在扳机上，将对美方作出权威和理性的回应，球在美方这边，美方必须阻止战争发生；伊方已在战场及军事领域处于最高级别防御战备状态。若美国再次犯下战略错误，将面临全新战场，寻找出路时将比现在更加无助。他还表示，伊朗最高领袖已制定应对敌方可能进攻的军事战略，将对敌人的任何误判作出难以预料的军事和战略回应，彻底粉碎美以的误判。（央视新闻）", "ctime": 1793691091, "time_str": "15:31:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261103/c681400872.shtml"}, {"id": "5551283", "title": "中方：国际刑事法院应防止不当扩大管辖权", "content": "中国常驻联合国副代表孙磊2日在联大“国际刑事法院报告”议题下发言，指出国际刑事法院应防止不当扩大管辖权。中方不认同法院在安理会移交情势之外管辖非缔约国国民，认为未经非缔约国同意管辖该国国民违背国家主权原则；法院在有关国家退出《罗马规约》后继续对其行使管辖权、仅以犯罪行为部分要素发生于缔约国领土就主张管辖，应予反思。关于国家元首管辖豁免，中方认为《罗马规约》第27条仅对缔约国有约束力，不应提出可能导致被请求国违反对第三国豁免义务的协助请求。（新华社）", "ctime": 1793691044, "time_str": "15:30:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261103/c681400844.shtml"}, {"id": "5551233", "title": "阿曼代表团是否会与沙特和伊朗的安全官员会面？外交部回应", "content": "11月3日，外交部发言人毛宁主持例行记者会。\n\n路透社记者提问，阿曼代表团昨天也在北京。他们是否有机会与沙特和伊朗的安全官员会面？中方是否愿意为此提供会晤场所？\n\n对此，毛宁表示：“访问的情况我们都发布了消息。从中方的角度来说，我们始终愿意为促进对话，推动交流发挥作用。”(澎湃新闻)", "ctime": 1793691007, "time_str": "15:30:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261103/c681400747.shtml"}, {"id": "5551231", "title": "俄罗斯防长正在访问中国？外交部：没有可提供的信息", "content": "11月3日，外交部发言人毛宁主持例行记者会。\n\n彭博社记者提问，据报道，俄罗斯国防部长正在访问中国，请问外交部能否证实这一消息？\n\n“这个问题目前我没有可以提供的信息。”毛宁说。(澎湃新闻)", "ctime": 1793690994, "time_str": "15:29:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261103/c681400743.shtml"}, {"id": "5551227", "title": "美国将暂停对南非和卢旺达的关税优待", "content": "美国贸易代表格里尔2日宣布，自2027年1月1日起暂停南非和卢旺达依据《促进非洲增长与机会法》享有的对美出口部分商品免税待遇，称两国政府设置损害美贸易投资的壁垒、威胁美国家安全和外交利益等，但未列举具体事例。南非政府称决定可能影响出口企业、产业链、就业及社区，正评估影响并计划提供支持，推动出口市场多元化；贸易部长陶称美方提出谈判中未曾涉及的新问题。卢旺达尚未回应。美国国会民主党人尼尔批评该决定由不满情绪驱动。（央视新闻）", "ctime": 1793690958, "time_str": "15:29:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261103/c681400730.shtml"}, {"id": "5551225", "title": "美媒：佛州坠机事故遇难者身份已确认", "content": "据美国媒体2日报道，1日美国佛罗里达州棕榈滩县坠机事故的9名遇难者身份已确认，其中包括1名来自得克萨斯州的科技企业家。\n\n据报道，44岁的科技企业家亚当·鲁滨逊、其妻子海伦·夏普和他们的两个孩子以及孩子的保姆都在事故飞机上，同行的还有他们的两个朋友。机长为55岁的杰夫·格雷戈里，副驾驶为20岁的纳塔利娅·菲尔盖拉斯。(新华社)", "ctime": 1793690919, "time_str": "15:28:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261103/c681400713.shtml"}, {"id": "5551183", "title": "中方是否担心美国中期选举后恢复对伊朗军事打击？外交部回应", "content": "外交部发言人毛宁主持例行记者会，就法新社记者提问中方是否担心美国中期选举后美国或以色列可能恢复对伊朗军事打击回应称，王毅外长已详细阐述中国对中东海湾局势的立场。中方一贯认为军事手段无助于解决问题，只会加剧紧张升级，不符合任何一方的利益，希望相关方坚持和平选择，通过对话谈判化解争端，推动尽早恢复中东和海湾地区的和平安宁。（北京日报）", "ctime": 1793690732, "time_str": "15:25:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261103/c681400503.shtml"}, {"id": "5551167", "title": "外交部介绍阿曼苏丹海赛姆访华情况", "content": "11月3日，外交部发言人毛宁主持例行记者会。\n迪拜中阿卫视提问，阿曼苏丹海赛姆对中国进行了国事访问，请问发言人能否介绍有关情况？\n毛宁介绍，海赛姆苏丹访问期间，习近平主席同他就中阿关系和共同关心的问题深入交换意见，达成重要共识，为两国关系的下阶段发展作出了顶层设计。李强总理同海赛姆苏丹就加强两国各领域合作进行了全面交流。\n“中方已经就各场活动的详细情况发布了消息，你可以查阅。我们愿意同阿曼方面一道，深入落实两国元首达成的重要共识，携手推动中阿战略伙伴关系向更高水平迈进。”毛宁说。(澎湃新闻)", "ctime": 1793690615, "time_str": "15:23:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261103/c681400440.shtml"}, {"id": "5551163", "title": "欧洲央行管委拉德夫：10月暂停加息并不意味着紧缩周期结束", "content": "欧洲央行管委拉德夫：10月暂停加息并不意味着紧缩周期结束。", "ctime": 1793690599, "time_str": "15:23:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261103/c681400434.shtml"}, {"id": "5551129", "title": "广东：加快5G-A移动通信网络规模商用 推进万兆光网部署应用", "content": "广东省发展改革委印发《广东省扩大消费实施方案》。其中提到，强化消费基础设施支撑。推动消费投资良性互促，扩大消费基础设施、消费服务功能提升设施、消费新业态新模式的有效投资。实施城市商业提质行动，推动老旧商业街区业态升级，支持符合条件的商业综合体、购物中心、百货店、大型超市等线下消费商业设施设备更新。推进城市一刻钟便民生活圈建设。推进国家物流枢纽承载城市、国家骨干冷链物流基地建设。健全县乡村三级物流配送体系，支持建设改造县级物流配送中心和乡镇快递物流站点。加强公共停车场、充电设施、高速公路服务区等设施更新改造。开展旅游景区强基焕新行动。鼓励老旧厂房、历史文化建筑等活化改造，打造潮流集聚区和网红打卡点。加快5G-A移动通信网络规模商用，推进万兆光网部署应用，全面深化“双千兆”网络覆盖。", "ctime": 1793690382, "time_str": "15:19:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261103/c681400282.shtml"}, {"id": "5551123", "title": "广东：引导广州、深圳进一步优化小客车指标管理政策", "content": "广东省发展改革委关于印发《广东省扩大消费实施方案》的通知，方案指出，清理优化不合理限制性措施。引导广州、深圳进一步优化小客车指标管理政策，分年限保障“久摇不中”无车家庭购车需求。支持各地因城施策调整优化房地产政策，更好满足居民刚性和改善性住房需求。优化演艺活动审批管理，推广大型群众性活动“一站式”部门联合审批、全流程线上办理。持续简化促销活动、户外展示、临时性商业设施搭建等审批流程。放宽公园等公共场所商业业态准入。", "ctime": 1793690371, "time_str": "15:19:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261103/c681400275.shtml"}, {"id": "5551107", "title": "浙江：支持杭州等地人工智能OPC创新发展先行先试工作", "content": "据杭州发布，近日，浙江省市场监管局等5部门联合印发《关于支持杭州等地人工智能OPC创新发展先行先试工作的通知》，明确在杭州、宁波、温州、嘉兴等地先行探索，围绕空间、算力、数据、人才、金融、服务等方面出台OPC支持政策，推动OPC在智能制造、智慧医疗、数字创意等领域创新发展。", "ctime": 1793690298, "time_str": "15:18:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261103/c681400246.shtml"}, {"id": "5551085", "title": "广东：推动整车企业依规争取L3级自动驾驶车型准入和上路通行试点，有序开展大湾区智能驾驶测试和商业化运营", "content": "广东省发展改革委关于印发《广东省扩大消费实施方案》的通知。其中提到，发展数字消费。加快发展“人工智能+消费”，推动人工智能手机和电脑、智能穿戴、智能机器人、桌面级三维（3D）打印设备等高端化发展，加快智能安防、视频照护系统等研发及互联互通，丰富数字产品消费选择。加力支持智能网联汽车发展，推动整车企业依规争取L3级自动驾驶车型准入和上路通行试点，有序开展大湾区智能驾驶测试和商业化运营。创新数字服务与内容消费，运用人工智能、虚拟现实赋能景区街区、文博场馆，推出优质数字文博、超高清视听、虚拟现实电影等产品，拓展智能体应用场景。积极培育新电商发展，健全品质电商标准，拓展虚拟主播、数字人、3D直播间等新型带货模式，鼓励发展AI虚拟试穿、AIGC商品内容生成等数字消费场景。加快建设消费领域（移动终端方向）国家人工智能应用中试基地，打造全栈国产化AI终端创新平台，提升新型消费品供给能力。", "ctime": 1793690224, "time_str": "15:17:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261103/c681400202.shtml"}, {"id": "5551081", "title": "广东：更好满足多样化住房消费需求", "content": "广东省发展改革委关于印发《广东省扩大消费实施方案》的通知。方案指出，更好满足多样化住房消费需求。优化匹配住房供给和消费需求，增加保障性住房供给，因城施策满足改善性住房需求，规范发展住房租赁市场。加快构建房地产发展新模式，支持新出让土地的商品住房项目优先实行现房销售，优化个人住房贷款期限，加强购房资金监管。用好居民购房贷款贴息政策，支持城乡居民刚性住房需求。加力开展城市更新，加快既有建筑节能改造和“好房子”建设，稳步推进城中村、危旧房和城镇老旧小区改造。支持老旧住房原拆原建、自主更新，在新模式城中村改造中积极探索多元化安置方式。用好设备更新支持政策，推进老旧小区加装电梯。有序扩大物业服务覆盖面，支持物业服务企业发展居家养老、家政服务等增值服务。拓宽住房公积金使用范围，支持缴存人提取住房公积金用于装修自住住房和支付自住住房物业费。", "ctime": 1793690199, "time_str": "15:16:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261103/c681400186.shtml"}, {"id": "5551061", "title": "英国Drax电站将建大型数据中心，项目投资或超200亿英镑", "content": "11月3日，英国能源企业Drax、布鲁克菲尔德及其英国人工智能基础设施平台Radiant宣布达成战略合作，将在英国北约克郡Drax电站分阶段建设吉瓦级数据中心。项目由Brookfield-Qai人工智能基础设施合资企业提供资金支持，总投资预计超200亿英镑，首期投资约25亿英镑。首期规划容量最高达100兆瓦，目标2028年第一季度投入运营；第二阶段计划在2028年至2031年间将容量提升至500兆瓦。", "ctime": 1793690099, "time_str": "15:14:59", "stock_code": "", "stock_name": "", "stock_market": 99605.shtml"}];
const SECTORS  = [{"name": "金融", "hit_count": 50, "etfs": []}, {"name": "人工智能", "hit_count": 21, "etfs": []}, {"name": "消费", "hit_count": 18, "etfs": []}, {"name": "数据要素", "hit_count": 15, "etfs": []}, {"name": "半导体", "hit_count": 11, "etfs": []}, {"name": "新能源", "hit_count": 8, "etfs": []}, {"name": "军工", "hit_count": 6, "etfs": []}, {"name": "医药", "hit_count": 4, "etfs": []}];
const META     = {"update_time": "2026-11-03 16:08:20", "sentiment_score": 56.858407079646014, "agents": []};

// 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
