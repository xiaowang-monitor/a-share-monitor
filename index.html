}

.badge {

.score-bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s; }
.up { color: var(--red); }
.down { color: var(--green); }
.pulse { animation: pulse 2s infinite; }
@keyframes pulse {

  50% { opacity: 0.5; }
}
.glow { box-shadow: 0 0 20px rgba(59,130,246,0.15); }

金将提高资金使用效率，不会对公司正常生产经营造成重大不利影响。此议案尚需提交公司股东会审议。", "ctime": 1779444989, "time_str": "18:16:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260522/c676907499.shtml"}, {"id": "4396763", "title": "沙特媒体称获悉美伊协议草案 内容包括在所有战线实现停火", "content": "据沙特阿拉伯阿拉比亚电视台22日报道，该媒体独家获悉的美国和伊朗“接近达成”的协议草案内容包括，在所有战线立即、全面和无条件地实现停火。报道称，该草案内容还包括承诺不以军事、民用或经济基础设施为攻击目标；停止军事行动并停止媒体战；尊重主权和领土完整以及不干涉内政；保障海湾、霍尔木兹海峡和阿曼湾航行自由；建立联合监督和冲突解决机制等。（新华社）", "ctime": 1779444858, "time_str": "18:14:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260522/c676907445.shtml"}, {"id": "4396755", "title": "郑商所聚酯期货板块全面对外开放", "content": "22日，郑州商品交易所聚酯期货板块全面对外开放，包括对二甲苯、瓶片、短纤期货及期权，以及精对苯二甲酸期权等七个品种启动引入境外交易者。（新华社）", "ctime": 1779444779, "time_str": "18:12:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260522/c676907413.shtml"}, {"id": "4396753", "title": "伟创电气：南通伟创等3名股东拟合计转让853.55万股，占总股本3.99%", "content": "伟创电气公告，南通伟创等3名股东拟通过询价转让方式合计转让853.55万股，占公司总股本的3.99%。本次询价转让不通过集中竞价交易或大宗交易方式进行，受让方受让股份后6个月内不得转让。出让方声明其股份权属清晰，不存在限制或禁止转让情形。", "ctime": 1779444743, "time_str": "18:12:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260522/c676907394.shtml"}, {"id": "4396751", "title": "重庆燃气：股东农行重庆分行拟减持不超1.80%", "content": "重庆燃气公告，公司股东中国农业银行股份有限公司重庆市分行持有1.1亿股，占公司总股本7.05%；因经营需要，计划于公告披露之日起15个交易日后的3个月内，通过集中竞价减持不超过1561.03万股、大宗交易减持不超过1248.83万股，合计不超过2809.86万股，占公司总股本1.80%。", "ctime": 1779444479, "time_str": "18:07:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260522/c676907237.shtml"}, {"id": "4396749", "title": "俄国防部称一周内击落超四千架乌无人机", "content": "当地时间5月22日午间，俄罗斯国防部发布5月16日至22日战报。报告称，俄军共实施1次大规模打击和5次集群打击，目标包括乌军工企业、燃料能源设施、交通和港口基础设施和军用机场等。报告还称，过去一周，俄防空系统共击落4184架乌方固定翼无人机。目前，乌克兰方面对此暂无回应。（央视新闻）", "ctime": 1779444442, "time_str": "18:07:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260522/c676907221.shtml"}, {"id": "4396747", "title": "恩捷股份：终止在马来西亚投资建设锂电池隔离膜项目", "content": "恩捷股份公告，公司于2026年5月22日召开第六届董事会第五次会议，审议通过了《关于终止在马来西亚投资建设锂电池隔离膜项目的议案》，决定终止控股子公司上海恩捷在马来西亚新设子公司投资建设锂电池隔离膜项目。该项目原计划规划建设产能约10亿平方米/年，总投资额预计约20亿元人民币。终止原因是外部市场环境及行业竞争格局发生变化，公司决定调整投资策略以优化资源配置和降低风险。目前项目尚未建设投资，调整不会对公司财务状况及经营成果产生重大不利影响。", "ctime": 1779444392, "time_str": "18:06:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260522/c676907193.shtml"}, {"id": "4396745", "title": "中老联合打击跨国电诈 494名犯罪嫌疑人被移交我方", "content": "记者22日从公安部获悉，为依法严厉打击跨国电信网络诈骗等违法犯罪活动，我公安机关与老挝警方持续开展国际警务执法合作。近日，老挝警方将前期专项打击行动中，抓获的494名涉诈犯罪嫌疑人移交我方。这是两国警方联合打击跨国电信网络诈骗取得的又一重要战果。今年以来，随着柬埔寨不断加大对电信网络诈骗活动的打击清剿力度，部分电诈窝点及涉诈人员转移至老挝境内继续作案。按照中老警务合作协定，老挝警方近期开展专项打击行动，抓获涉诈犯罪嫌疑人494名，在云南省西双版纳磨憨口岸移交我方。公安部已组织指挥四川、重庆公安机关成功接收上述犯罪嫌疑人，依法开展相关工作。公安部有关负责人表示，公安机关将持续深化与相关国家警务执法合作，进一步固化完善联合打击机制，持续开展窝点清剿、“金主”缉捕、人员遣返等工作，全力挤压电信网络诈骗犯罪活动空间，坚决遏制跨国电信网络诈骗犯罪高发态势。（新华社）", "ctime": 1779444369, "time_str": "18:06:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260522/c676907175.shtml"}, {"id": "4396743", "title": "绿茵生态：丰镇市隆盛庄PPP项目提前终止及债务重组", "content": "绿茵生态公告，公司控股子公司丰隆生态与丰镇市财政局签署的《丰镇市隆盛庄镇文化遗产保护与旅游开发建设项目（一期工程）政府和社会资本方合作（PPP）项目合同》提前终止。债务重组方案涉及项目费用总额3.55亿元，其中丰镇市财政局已于2025年12月19日支付1.38亿元，剩余2.17亿元将分三年支付。项目终止自2026年1月1日起生效，对公司利润影响较小，2026年年度将新增经营性活动现金流入1.38亿元—1.81亿元。", "ctime": 1779444354, "time_str": "18:05:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260522/c676907170.shtml"}, {"id": "4396739", "title": "海天股份：子公司上诉涉案金额3.14亿元案件已立案", "content": "海天股份公告，公司全资子公司成都天府新区海天水务有限公司因与四川天府新区农业农村局、四川天府新区管理委员会关于双流县华阳第一污水处理厂（二期）特许经营权的撤回补偿方案未能协商一致，已向四川天府新区人民法院提起上诉。涉案金额为3.14亿元。一审判决未生效，二审尚未开庭，最终判决结果存在不确定性，对公司本期利润的具体影响尚存在不确定性。", "ctime": 1779444338, "time_str": "18:05:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260522/c676907160.shtml"}, {"id": "4396737", "title": "恒生指数公司发布季检结果：恒生科技指数纳入MINIMAX-W、智谱", "content": "恒生指数公司发布季检结果：恒生指数纳入极兔速递、百济神州、中国铝业。恒生科技指数纳入MINIMAX-W、智谱；剔除金蝶国际、金山软件。", "ctime": 1779444336, "time_str": "18:05:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260522/c676907159.shtml"}, {"id": "4396735", "title": "乌克兰5个州能源设施遭袭停电", "content": "乌克兰国家电力公司22日上午在社交媒体发文说，由于能源基础设施持续遭到俄罗斯无人机和火炮袭击，乌克兰前线地区5个州出现停电。乌国家电力公司说，截至22日早上，苏梅州、哈尔科夫州、第聂伯罗夫斯克州、扎波罗热州、赫尔松州出现停电。电力人员正尽一切可能修复受损设备。乌国家电力公司此前说，俄军近期持续袭击乌前线地区能源设施。（央视新闻）", "ctime": 1779444264, "time_str": "18:04:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260522/c676907122.shtml"}, {"id": "4396733", "title": "富途回应：中国内地有资产客户数占比已降至13%", "content": "中国证监会与香港证监会5月22日分别发布通告，就内地投资者跨境证券期货基金经营活动事宜作出指引更新。富途对此表示，这些指引和规范为面向全行业的统一要求，我们将严格按照监管机构要求稳步推进相关合规工作。富途强调，早前已全面停止为内地身份申请者开设账户，并在打击造假开户方面持续努力，过去两年间驳回了数以万计不符合规则的开户申请。一直以来，富途积极与监管机构沟通并遵循监管机构的整改要求，截至2026年一季度末，中国内地有资产客户数占全集团有资产客户总数的比例已降至13%。（人民财讯）", "ctime": 1779444230, "time_str": "18:03:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260522/c676907105.shtml"}, {"id": "4396731", "title": "老虎证券旗下分支机构均已注销", "content": "天眼查App显示，老虎证券关联公司北京向上融科科技发展有限公司成立于2014年6月，法定代表人为董明，注册资本约219万人民币，经营范围包括软件设计、应用软件服务、会议服务等，由巫天华、董明共同持股。对外投资信息显示，该公司对外投资13家企业，其中仅2家企业处于存续状态，其他11家企业已注销或被吊销。分支机构信息显示，该公司旗下分支机构均已注销。", "ctime": 1779444218, "time_str": "18:03:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260522/c676907101.shtml"}, {"id": "4396729", "title": "如意集团：因信息披露违法违规被罚700万元", "content": "如意集团公告，公司因信息披露违法违规，收到中国证监会山东监管局下发的《行政处罚决定书》。根据《证券法》第一百九十七条第二款的规定，对如意集团给予警告，并处以700万元罚款。同时，对时任董事长邱亚夫等多名高管也处以不同程度的罚款，其中邱亚夫被处以400万元罚款，并被采取终身证券市场禁入措施。公司表示，已对相关年度财务会计报告进行追溯重述，并承诺将加强内部治理和财务管理，确保财务报表的真实、准确、完整。", "ctime": 1779444205, "time_str": "18:03:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260522/c676907092.shtml"}, {"id": "4396719", "title": "特朗普宣布“暂缓执行”拜登政府的制冷剂环保规定", "content": "美国总统特朗普21日说，美国环境保护署推迟执行拜登政府制定的商用和家用制冷剂规定，以“大幅降低消费者的支出”。拜登政府2023年颁布规定，从2026年开始对氢氟碳化物实行严格使用限制。氢氟碳化物广泛用于冰箱、空调的制冷剂生产，属于温室气体的一种。（央视新闻）", "ctime": 1779444156, "time_str": "18:02:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260522/c676907061.shtml"}, {"id": "4396705", "title": "伊朗外长会见巴基斯坦内政部长", "content": "据伊朗媒体22日报道，伊朗外长阿拉格齐当天会见了正在德黑兰访问的巴基斯坦内政部长纳克维，双方就推动伊朗与美国结束战争的相关谈判进程交换意见。（新华社）", "ctime": 1779444097, "time_str": "18:01:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260522/c676906929.shtml"}, {"id": "4396671", "title": "哈森股份：拟发行股份购买苏州郎克斯45%股权", "content": "哈森股份公告，公司拟通过发行股份方式购买周泽臣、王永富、黄永强3名股东持有的苏州郎克斯45%股权；同时，拟向不超过35名符合条件的特定对象发行股票募集配套资金，募集配套资金总额不超过发行股份购买资产交易价格的100%。本次交易中，上市公司将新增发行2292.45万股用于向交易对方支付股份对价，占发行后上市公司总股本的比例为9.46%（不考虑募集配套资金）。", "ctime": 1779443773, "time_str": "17:56:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260522/c676906770.shtml"}, {"id": "4396639", "title": "伊朗革命卫队称过去24小时有35艘船通过霍尔木兹海峡", "content": "当地时间22日，伊朗伊斯兰革命卫队发表声明称，在过去24小时内，有包括油轮、集装箱船以及其他商船在内的35艘船只，在获得许可并在革命卫队海军的协调与安全保障下，顺利通过了霍尔木兹海峡。（央视新闻）", "ctime": 1779443583, "time_str": "17:53:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260522/c676906585.shtml"}, {"id": "4396635", "title": "央行将开展6000亿元MLF操作", "content": "央行：为保持银行体系流动性充裕，2026年5月25日，中国人民银行将以固定数量、利率招标、多重价位中标方式开展6000亿元MLF操作，期限为1年期。", "ctime": 1779443515, "time_str": "17:51:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260522/c676906564.shtml"}, {"id": "4396631", "title": "美湖股份：收到行政监管措施决定书", "content": "美湖股份公告，公司于2026年5月22日收到中国证券监督管理委员会湖南监管局出具的《关于对湖南美湖智造股份有限公司采取监管谈话措施的决定》。经查，公司存在违规事项：2026年5月11日，公司在微信公众号发布文章，标题为“美湖股份签署具身智能订单合同”，但合同标的物实际为机器狗相关部件，未准确披露；文章描述的“合同金额人民币9.43亿元”实际为框架合同测算的最高订单额，系估算而来，且未提示相关风险，文章内容存在不准确、不完整、风险提示不充分的情形。违反了《上市公司信息披露管理办法》相关规定，监管局决定对公司采取监管谈话措施。", "ctime": 1779443377, "time_str": "17:49:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260522/c676906460.shtml"}, {"id": "4396629", "title": "欧盟扩大对伊朗制裁 将“威胁中东航行自由”行为纳入制裁范围", "content": "欧盟理事会当地时间22日决定扩大针对伊朗制裁的法律框架，将伊朗“威胁中东地区航行自由”的相关行为纳入制裁范围。根据修订后的法律框架，欧盟可对相关个人和实体采取旅行禁令、资产冻结等限制性措施，并禁止欧盟公民和企业向其提供资金、金融资产或经济资源。（央视新闻）", "ctime": 1779443340, "time_str": "17:49:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260522/c676906451.shtml"}, {"id": "4396627", "title": "将被严厉处罚！富途控股美股盘前大跌逾40%，公司回应", "content": "5月22日，富途控股美股盘前一度跌超40%。消息面上，中国证监会宣布，Tiger Brokers（NZ）Limited、富途证券国际（香港）有限公司、长桥证券（香港）有限公司的非法跨境展业行为，违反了我国证券基金期货法律法规，破坏了市场秩序，必须坚决予以打击。依据相关规定，证监会拟决定没收老虎、富途、长桥境内外相关主体全部违法所得，并依法严厉处罚。对此，21快讯记者以客户身份致电富途控股，公司接线工作人员表示，公司已经关注到相关监管动态，正在仔细研究相关内容，待信息完整后公司将统一作出回应。目前公司业务运营一切正常，客户的账户资产及各项服务不受影响。（21世纪经济报道）", "ctime": 1779443333, "time_str": "17:48:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260522/c676906448.shtml"}, {"id": "4396621", "title": "九华旅游：副总经理何龙被立案审查调查并留置", "content": "九华旅游公告，公司党委委员、副总经理何龙被纪律检查委员会、监察委员会立案审查调查并实施留置。目前公司已对相关工作进行妥善安排，董事及其他高级管理人员均正常履职，生产经营情况正常，公告事项不会对公司产生重大影响。", "ctime": 1779443288, "time_str": "17:48:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260522/c676906433.shtml"}, {"id": "4396617", "title": "美媒：美国协助以色列防御消耗导弹数量远超以军", "content": "美国《华盛顿邮报》21日报道说，美国国防部给该报提供的一份评估报告显示，在打击伊朗的军事行动中，为协助以色列防御伊朗的导弹袭击，美军消耗的尖端弹药数量远超以军，美军先进拦截导弹的库存大幅减少。多名匿名的美国官员向该报透露说，在美军代号“史诗怒火”的军事行动期间，美国为保护以色列发射了超过200枚“萨德”反导系统拦截弹，约占美国国防部总库存的一半，还从地中海部署的军舰上发射了100多枚“标准-3”和“标准-6”拦截弹。而以色列只发射了不到100枚“箭”式拦截弹和约90枚“大卫投石索”拦截弹。（新华社）", "ctime": 1779443185, "time_str": "17:46:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260522/c676906377.shtml"}, {"id": "4396615", "title": "阿斯顿马丁拉共达（中国）汽车销售有限公司召回部分进口DBX系列汽车", "content": "日前，阿斯顿马丁拉共达（中国）汽车销售有限公司根据《缺陷汽车产品召回管理条例》和《缺陷汽车产品召回管理条例实施办法》的要求，向国家市场监督管理总局备案了召回计划。召回编号S2026M0054V：自即日起，召回2020年7月1日至2024年3月28日期间生产的DBX汽车，共计1162辆；2021年9月7日至2023年10月26日期间生产的DBXI6汽车，共计713辆；2022年3月22日至2025年6月16日期间生产的DBX707汽车，共计158辆。本次召回范围内的车辆，由于后桥下摆臂扭接杆的紧固螺栓螺杆直径选型偏小，可能导致扭接杆的安装销松动滑出。极端情况下，可能造成后桥下摆臂等悬挂部件及后制动器损坏，增加车辆发生碰撞的风险，存在安全隐患。阿斯顿马丁拉共达（中国）汽车销售有限公司将通过授权经销商，免费为召回范围内的车辆更换紧固螺栓并检查后桥下摆臂，如果损坏，则予以更换，以消除安全隐患。(市场监管总局)", "ctime": 1779443165, "time_str": "17:46:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260522/c676906371.shtml"}, {"id": "4396611", "title": "中国向美国出口小家电回暖，部分订单从东南亚回流", "content": "随着贸易环境的变化，近期电风扇、制冰机等部分小家电出口美国的订单从东南亚回流中国。记者从产业人士了解到，有企业正在重新对东南亚工厂与中国工厂的产能进行规划和分配。向美国出口电风扇的中山乐途电器的总经理黎明阳告诉记者，近期有美国客户将多款小风扇模具从越南调回，把百万台级别的批量订单重新交给中国工厂来生产。美国采购商对中国供应链稳定性的信心显著回升，他们现在把简单、低附加值的订单还留在东南亚生产，但大批量、高品质、交期紧、长周期的订单放回中国。据海关总署数据，2026年1月4日，中国向美国出口小家电的金额为38.47亿美元，同比减少21.1%；其中，4月份，中国向美国出口小家电的金额为10.9亿美元，同比增长3.9%。（第一财经）", "ctime": 1779443082, "time_str": "17:44:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com. // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
