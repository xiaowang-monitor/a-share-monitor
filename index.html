.badge {

.score-bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s; }
.up { color: var(--red); }
.down { color: var(--green); }
.pulse { animation: pulse 2s infinite; }
@keyframes pulse {

  50% { opacity: 0.5; }

const NEWS     = [{"id": "4821107", "title": "三未信安：预计2026年上半年亏损1256.16万元，同比减亏57.25%", "content": "三未信安公告，预计2026年半年度实现营业收入2.09亿元，同比增长7.38%；归属于母公司所有者的净利润为-1256.16万元，与上年同期相比亏损减少1682.42万元，亏损同比减少57.25%；扣非净利润为-1889.7万元，亏损同比减少43.35%。上年同期归母净利润为-2938.58万元。业绩变化主要因海外市场和密码芯片业务规模增加、抗量子密码项目落地，以及持续推进提质增效，研发和管理费用同比下降。", "ctime": 1785230192, "time_str": "17:16:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260728/c678490218.shtml"}, {"id": "4821087", "title": "纳指ETF嘉实：提示二级市场交易价格溢价风险", "content": "纳指ETF嘉实公告称，近期该基金二级市场交易价格明显高于基金份额参考净值，出现较大幅度溢价。7月28日，收盘价为1.95元，收盘时基金份额参考净值为1.78元。若7月29日溢价幅度未有效回落，基金有权申请停牌等措施。投资者可在二级市场交易或申赎，交易价格受多种因素影响。目前基金运作正常，无应披露未披露信息。", "ctime": 1785230083, "time_str": "17:14:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260728/c678490144.shtml"}, {"id": "4821083", "title": "两部门调整部分能源资源行业企业城镇土地使用税政策", "content": "财政部、税务总局7月28日对外发布公告，明确将调整部分能源资源行业企业城镇土地使用税政策。 根据此次发布的公告，此前出台的煤炭、矿山、油气、建材、电力等行业企业的部分主要生产经营用地免征城镇土地使用税优惠政策将取消。同时，上述企业中具有公益性、安全保障性质以及重大基础设施用地的免税政策将予以保留。 据了解，部分能源资源行业企业城镇土地使用税优惠政策已实施近40年。近年来，优惠政策长期实施带来的土地利用效率偏低、影响税收公平等负面效应日益突出。 “当初给予优惠政策时，能源资源行业的产品还在实行计划定价，属于需要支持的行业。经过近40年的发展，我国能源资源行业已今非昔比，这方面的优惠政策确实需要调整。”中国财科院公共收入研究中心主任梁季说。 她表示，上述行业土地使用面积大，继续对其主要生产经营用地实施城镇土地使用税优惠政策，不利于企业节约集约使用土地。取消该优惠，可引导企业盘活存量土地，提高土地利用效率。 根据公告，政策调整设置了过渡期，分两步到位。对恢复征税的土地，自2026年9月1日至2027年8月31日，按应纳税额减半征收城镇土地使用税；自2027年9月1日起，全额征收城镇土地使用税。(新华社)", "ctime": 1785230056, "time_str": "17:14:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260728/c678490129.shtml"}, {"id": "4821071", "title": "国城矿业：拟以3亿元-6亿元回购公司股份", "content": "国城矿业公告，拟以不低于3亿元且不超过6亿元回购公司股份，回购价格不超过45元/股。回购股份将用于未来实施员工持股计划或股权激励计划。", "ctime": 1785230013, "time_str": "17:13:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260728/c678490106.shtml"}, {"id": "4821069", "title": "金山办公：预计2026年半年度净利润23.16亿-27.19亿元，同比增209.98%-263.89%", "content": "金山办公公告，预计2026年半年度实现营业收入32.14亿元-34.13亿元，同比增长20.95%-28.43%；归属于母公司所有者的净利润23.16亿元-27.19亿元，同比增长209.98%-263.89%；扣除非经常性损益的净利润22.88亿元-26.86亿元，同比增长214.63%-269.35%。业绩增长主要因公司持续推进AI能力与办公场景深度融合，前期研发投入转化为产品竞争优势和商业化成果，部分对外投资基金项目实现较好投资回报。", "ctime": 1785230007, "time_str": "17:13:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260728/c678490105.shtml"}, {"id": "4821063", "title": "格灵深瞳：已累计回购161.08万股，耗资2480.44万元", "content": "格灵深瞳公告，截至2026年7月28日，公司通过集中竞价交易方式已累计回购股份161.08万股，占总股本0.62%，回购成交价格区间为14.95元/股至15.7元/股，累计支付资金总额为2480.44万元（不含交易费用）。本次回购方案资金总额为5000万元至1亿元，回购价格上限为25元/股，回购期限为2026年7月20日至2026年10月19日，回购用途为维护公司价值及股东权益。", "ctime": 1785229984, "time_str": "17:13:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260728/c678490090.shtml"}, {"id": "4821057", "title": "全筑股份：第二季度累计新签合同6.49亿元", "content": "全筑股份公告，2026年第二季度公司季末累计新签合同金额总计6.49亿元，其中设计2109.36万元，施工5.1亿元，海外9446.13万元，其他2326.12万元；新签流转中合同金额6898.79万元，截至报告期末累计已签约未完工合同金额23.16亿元。", "ctime": 1785229970, "time_str": "17:12:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260728/c678490086.shtml"}, {"id": "4821047", "title": "北京市防治病毒性肝炎五年行动计划发布", "content": "《北京市防治病毒性肝炎行动计划（2026—2030年）》近日发布。根据计划，到2030年，北京市儿童甲肝、乙肝疫苗全程接种率不低于95%，新生儿乙肝疫苗首剂及时接种率不低于90%，乙肝母婴传播率不高于1%，急性乙肝发病率不高于十万分之一，慢性乙肝患者诊断率不低于80%。计划提出，强化新生儿首剂乙肝疫苗及时接种措施，不断提升及时接种率。要持续做好适龄儿童甲肝、乙肝疫苗全程免疫和初一年级学生乙肝疫苗加强免疫工作，常态化开展儿童甲肝、乙肝疫苗查漏补种工作，巩固甲肝、乙肝疫苗免疫规划疫苗高接种率。（央视新闻）", "ctime": 1785229891, "time_str": "17:11:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260728/c678490041.shtml"}, {"id": "4821039", "title": "驻韩美军基地发生白磷泄漏事故", "content": "韩国媒体28日报道，驻韩美军乌山空军基地发生白磷泄漏事故，消防部门和警方正在调查事故原因。（新华社）", "ctime": 1785229837, "time_str": "17:10:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260728/c678490005.shtml"}, {"id": "4821037", "title": "贝莱德对江西铜业股份的多头持仓比例降至4.43%", "content": "据香港交易所披露，贝莱德（BlackRock）对江西铜业股份有限公司 - H股的多头持仓比例于2026年7月22日从5.04%降至4.43%。", "ctime": 1785229822, "time_str": "17:10:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260728/c678489980.shtml"}, {"id": "4821029", "title": "强震发生后 日本官员称正在确认人员伤亡和财产损失情况", "content": "在日本熊本县发生7.1级地震后，当地时间7月28日傍晚，日本内阁官房长官木原稔在首相官邸召开紧急记者会。木原稔表示，目前正在确认人员伤亡和财产损失情况。他还表示，尚未收到附近核电站出现任何异常情况的报告。据日本气象厅消息，熊本县当地时间28日16时27分许发生7.1级地震，震源深度约10公里。气象厅同时发布海啸预警。随后，熊本县又发生多次余震。（央视新闻）", "ctime": 1785229755, "time_str": "17:09:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260728/c678489943.shtml"}, {"id": "4821023", "title": "自助仓储领域首项国家标准8月1日起实施", "content": "8月1日起，《自助仓储运营管理规范》国家标准实施。该标准首次提出自助仓储业态的定义，并从企业经营管理、场地与设施条件、门店日常管理、安全管理等维度，明确行业规范化运营准则与管理要求。（央视新闻）", "ctime": 1785229702, "time_str": "17:08:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260728/c678489871.shtml"}, {"id": "4821021", "title": "瑞银集团对舜宇光学科技的多头持仓比例降至5.87%", "content": "据香港交易所披露，瑞银集团（UBS）对舜宇光学科技(集团)有限公司的多头持仓比例于2026年7月22日从6.33%降至5.87%。", "ctime": 1785229679, "time_str": "17:07:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260728/c678489866.shtml"}, {"id": "4821019", "title": "贝莱德对金蝶国际的多头持仓比例降至6.8%", "content": "据香港交易所披露，贝莱德（BlackRock）对金蝶国际软件集团有限公司的多头持仓比例于2026年7月22日从7.26%降至6.8%。", "ctime": 1785229668, "time_str": "17:07:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260728/c678489864.shtml"}, {"id": "4821017", "title": "宁波港：董事长提议2026年中期利润分配不低于半年度可分配利润30%", "content": "宁波港公告，公司董事长朱苗提议实施2026年度中期利润分配方案，以未来实施权益分派股权登记日总股本为基数，分配金额不低于公司2026年半年度可分配利润的30%。该利润分配方案尚需提交公司董事会审议通过后方可实施。", "ctime": 1785229655, "time_str": "17:07:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260728/c678489836.shtml"}, {"id": "4821013", "title": "贝莱德对中兴通讯的多头持仓比例降至6.52%", "content": "据香港交易所披露，贝莱德（BlackRock）对中兴通讯股份有限公司 - H股的多头持仓比例于2026年7月22日从7.12%降至6.52%。", "ctime": 1785229648, "time_str": "17:07:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260728/c678489802.shtml"}, {"id": "4821003", "title": "日本熊本地震致超4万户断电核电站未受影响", "content": "据中国地震台网正式测定，当地时间今天（28日）16时27分，在日本九州岛发生6.8级地震，震源深度10公里。日本气象厅表示，位于九州岛的熊本县发生7.1级地震。此后，熊本又发生多次余震。总台记者李卫兵：目前，地震已对当地交通基础设施等造成严重影响。据日本九州旅客铁道公司消息，受地震影响，目前九州地区所有普通铁路及九州新干线均已暂停运行。据九州电力公司消息，受地震影响，熊本地区已有超过48000户停电。总台记者李卫兵：此外，据日本原子力规制厅消息，目前鹿儿岛县的川内核电站、佐贺县的玄海核电站、爱媛县的伊方核电站，均未确认到异常情况。目前，综合日本相关部门和媒体消息，尚未确认到人员伤亡情况。关于此次地震，我们目前了解到的最新情况如上，将持续关注并带来后续报道。(央视新闻)", "ctime": 1785229568, "time_str": "17:06:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260728/c678489748.shtml"}, {"id": "4821001", "title": "市场监管总局发布《船舶和海上技术 固定结构冰载荷模型试验》国家标准", "content": "市场监管总局（国家标准委）组织制定的《船舶和海上技术 固定结构冰载荷模型试验》国家标准将于8月1日起实施。该标准对冰载荷模型试验的条件与工况设置、仪器设备与数据采集、试验流程与操作步骤，以及数据处理和报告编制等环节作出系统规定，为我国寒区海域的海上平台、风电基础等固定设施抗冰设计提供科学统一的试验依据，对保障寒区海洋工程安全具有重要意义。目前，该标准已在渤海寒区油田多型导管架平台的设计验证中得到应用，相关数据为寒区工程规范更新提供了关键支撑，将助力我国寒区海洋工程装备技术升级，为海洋强国建设筑牢安全根基。（央视新闻）", "ctime": 1785229530, "time_str": "17:05:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260728/c678489707.shtml"}, {"id": "4820999", "title": "央行：二季度末人民币房地产贷款余额50.74万亿元，同比下降4.9%", "content": "7月28日，央行发布2026年二季度金融机构贷款投向统计报告，2026年二季度末，人民币房地产贷款余额50.74万亿元，同比下降4.9%，上半年减少1.23万亿元。2026年二季度末，房地产开发贷款余额12.65万亿元，同比下降8.5%，上半年减少5402亿元。个人住房贷款余额36.29万亿元，同比下降3.8%，上半年减少7163亿元。", "ctime": 1785229505, "time_str": "17:05:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260728/c678489696.shtml"}, {"id": "4820991", "title": "普洛药业：左卡尼汀口服溶液获批，市场规模约4067万支", "content": "普洛药业公告，公司控股子公司浙江普洛康裕制药有限公司近日收到国家药品监督管理局签发的左卡尼汀口服溶液《药品注册证书》，规格为10ml：1g和10ml：2g。左卡尼汀口服溶液用于治疗原发性系统性卡尼汀缺乏症，也用于先天性代谢异常导致的继发性卡尼汀缺乏症的短期和长期治疗。根据相关数据显示，左卡尼汀2025年度国内市场规模约为4067万支，销售金额约为2.98亿元。该产品按照化学药品4类获批上市，视同通过仿制药一致性评价。", "ctime": 1785229424, "time_str": "17:03:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260728/c678489637.shtml"}, {"id": "4820989", "title": "两部文物管理文件出台：规范革命文物保护与国有文物数据管理", "content": "28日，国家文物局召开新闻发布会，介绍出台《革命文物保护工程技术导则（试行）》《国有文物资源数据管理办法》有关情况。据了解，《革命文物保护工程技术导则（试行）》日前印发，提出：“坚持价值保护优先，坚持真实性和完整性，坚持最小干预”三项基本原则和“坚持整体保护，以保护文物本体和历史环境为工作重心”。《国有文物资源数据管理办法》构建了国有文物资源数据全生命周期管理制度，实现了文物资源数据来源可溯，流向可查，利用可管，提升文物资源数据规范化和精细化的管理水平。（央视新闻）", "ctime": 1785229387, "time_str": "17:03:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260728/c678489591.shtml"}, {"id": "4820987", "title": "央行：二季度末本外币工业中长期贷款余额27.81万亿元，同比增长5.9%", "content": "中国人民银行统计，2026年二季度末，本外币工业中长期贷款余额27.81万亿元，同比增长5.9%，增速比各项贷款高0.8个百分点，上半年增加1.21万亿元。其中，重工业中长期贷款余额23.45万亿元，同比增长4.9%；轻工业中长期贷款余额4.36万亿元，同比增长11.3%。2026年二季度末，本外币服务业中长期贷款余额76.22万亿元，同比增长6.4%，增速比各项贷款高1.3个百分点，上半年增加3.33万亿元。不含房地产业的服务业中长期贷款余额同比增长9.2%；房地产业中长期贷款余额同比下降4.2%。2026年二季度末，本外币基础设施相关行业中长期贷款余额45.19万亿元，同比增长4.8%，上半年增加1.53万亿元。", "ctime": 1785229378, "time_str": "17:02:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260728/c678489583.shtml"}, {"id": "4820975", "title": "中国代表就乌克兰问题发声：全力推动局势降温", "content": "中国常驻联合国代表团临时代办孙磊27日在安理会乌克兰问题紧急公开会上发言，敦促停止任何针对平民的袭击，呼吁当事方保持冷静克制，严格遵守国际人道法，保护平民和民用基础设施安全，全力推动局势降温，为早日实现和平争取希望。孙磊说，当前乌克兰问题局势发展令人担忧，冲突烈度持续升级。当务之急是实现停火止战。战事升级只会给民众带来更沉重的苦难。早日停火止战符合当事方根本和长远利益，也顺应国际社会共同期待。孙磊指出，根本之道是坚持对话谈判。当前主要各方立场存在很大分歧，谈判之路艰难曲折。中方呼吁有关各方保持接触，展现政治意愿，在对话中增进互信，在谈判中积累共识，争取达成全面、持久、有约束力的和平协议。（新华社）", "ctime": 1785229359, "time_str": "17:02:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260728/c678489575.shtml"}, {"id": "4820963", "title": "拓新药业：子公司4个原料药获GMP符合性检查告知书", "content": "拓新药业公告，公司全资子公司新乡制药股份有限公司近日收到河南省药品监督管理局核发的《药品GMP符合性检查告知书》（编号：HNYS2026092），检查范围为原料药肌苷、利巴韦林、阿昔洛韦、单磷酸阿糖腺苷，检查结论为符合《药品生产质量管理规范（2010年修订）》要求。其中单磷酸阿糖腺苷为首次通过GMP符合性检查，其他为再次通过。", "ctime": 1785229336, "time_str": "17:02:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260728/c678489569.shtml"}, {"id": "4820965", "title": "日本强震一高架桥断裂", "content": "日本熊本县今天（7月28日）下午发生强烈地震后，熊本县八代地区一处高架桥出现断裂。（CCTV国际时讯）", "ctime": 1785229336, "time_str": "17:02:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260728/c678489570.shtml"}, {"id": "4820935", "title": "新宙邦：董事长提议2026年中期每10股派3元现金红利", "content": "新宙邦公告，公司董事会于2026年7月28日收到董事长覃九三先生提议，建议实施2026年中期利润分配，向全体股东每10股派发现金红利人民币3元（含税），不送红股，不以资本公积转增股本。覃九三先生承诺将在相关会议审议该事项时投“赞成”票。董事会将尽快制定具体方案并履行审批程序，该事项尚存在不确定性。", "ctime": 1785229217, "time_str": "17:00:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260728/c678489502.shtml"}, {"id": "4820927", "title": "日本气象厅提醒未来几天可能再次发生强震", "content": "当地时间28日傍晚，日本气象厅举行记者会，提醒发生地震区域民众在接下来的时间，特别是未来2到3天内，警惕发生最大震感达到震度7规模的地震。(央视新闻)", "ctime": 1785228991, "time_str": "16:56:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260728/c678489311.shtml"}, {"id": "4820919", "title": "台积电表示，位于日本熊本的JASM晶圆厂测得的地震强度已达到需疏散的标准", "content": "台积电表示，位于日本熊本的JASM晶圆厂测得的地震强度已达到需疏散的标准。（财联社）", "ctime": 1785228947, "time_str": "16:55:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260728/c678489285.shtml"}, {"id": "4820905", "title": "天齐锂业旗下泰利森第三期化学级锂精矿工厂预计未来数日内复产", "content": "澳大利亚矿企IGO披露2026财年第四季度业绩报告，透露其参股的全球最大硬岩锂矿——格林布什锂矿CGP3工厂在经历6月火灾后，预计将在数日内恢复生产（该设施已停产约7周）。全球锂行业龙头天齐锂业是格林布什锂矿的共同拥有者之一，此前曾披露CGP3工厂遭遇火情的公告。尽管火灾造成临时扰动，格林布什矿本季度仍实现锂辉石产量环比增长10%、实际售价环比大涨37%，EBITDA利润（息税折旧摊销前利润）率高达80%。（每日经济新闻）", "ctime": 1785228659, "time_str": "16:50:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260728/c678489089.shtml"}, {"id": "4820903", "title": "包头稀交所：今日稀土主流产品价格整体走弱", "content": "据包头稀土产品交易所，今日稀土主流产品价格整体走弱。氧化镨钕均价75.15万元/吨，下跌0.63万元/吨；金属镨钕均价91.27万元/吨，下跌0.86万元/吨；氧化镝均价140.08万元/吨，下跌0.74万元/吨；氧化铽均价676.18万元/吨，下跌0.40万元/吨。今日氧化镨、氧化钕、氧化镥、氧化铕、氧化镧铈等产品成交信息较少，请谨慎参考。今日，氧化镨钕贸易商主动下调报价，市场整体成交重心有所下移，金属厂采购开始积极询单，但实际成交仍以压价为主，上下游博弈加剧。金属镨钕价格同样有所下调，但市场询单情况依旧冷清。中重稀土市场询单冷清，钆、钬等产品的报价进行了小幅下调，然而成交量依然较少。综合来看，稀土市场价格整体偏弱运行，镨钕产品价格可能会在窄幅区间内震荡运行。", "ctime": 1785228621, "time_str": "16:50:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260728/c678489073.shtml"}, {"id": "4820887", "title": "WTI原油跌超3%", "content": "WTI原油跌超3%，现报80.13美元/桶。", "ctime": 1785228324, "time_str": "16:45:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260728/c678488928.shtml"}, {"id": "4820865", "title": "贵州燃气：董事会提议向下修正“贵燃转债”转股价格，尚需股东会审议", "content": "贵州燃气公告，公司股票在连续20个交易日中有10个交易日收盘价低于当期转股价格7.1元/股的85%（即6.035元/股），已触发转股价格向下修正条款。2026年7月28日，董事会审议通过议案，决定行使向下修正权利，并向股东会提议向下修正转股价格，修正后价格不低于股东会召开日前二十个交易日股票交易均价等较高者。该事项尚需提交股东会审议。", "ctime": 178522815 const SECTORS  = [{"name": "金融", "hit_count": 33, "etfs": []}, {"name": "人工智能", "hit_count": 28, "etfs": []}, {"name": "消费", "hit_count": 18, "etfs": []}, {"name": "数据要素", "hit_count": 18, "etfs": []}, {"name": "半导体", "hit_count": 17, "etfs": []}, {"name": "新能源", "hit_count": 6, "etfs": []}, {"name": "机器人", "hit_count": 5, "etfs": []}, {"name": "地产", "hit_count": 3, "etfs": []}];
const META     = {"update_time": "2026-07-28 17:17:39", "sentiment_score": 55.0, "agents": []};

// 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
