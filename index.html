 "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260707/c678002749.shtml"}, {"id": "4665813", "title": "两大航运巨头重启苏伊士运河航线", "content": "丹麦马士基航运集团6日宣布，将与德国赫伯罗特公司依托两大航运企业组建的“双子座”合作网络，让旗下部分船只恢复使用苏伊士运河航线。马士基6日在一份声明中说：“马士基与赫伯罗特宣布对‘双子座’合作网络旗下AE15航线作出结构性调整，这条航线将改行苏伊士运河，不再绕行好望角。”“双子座”是马士基与赫伯罗特联手组建的航运合作网络，AE15航线连通亚洲、地中海以及欧洲地区。赫伯罗特发言人透露，预计调整AE15航线后，整体海运航程可缩短四周。马士基说，两大航运巨头此番商定重启苏伊士运河航线，“是对红海地区安全局势开展全面评估后的结果，也意味着迈出逐渐回归苏伊士运河航道的一步”。双方均已制定应急预案，一旦红海局势恶化，航行方案将随时调整。（央视新闻）", "ctime": 1783406951, "time_str": "14:49:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260707/c678002715.shtml"}, {"id": "4665811", "title": "北京市推出城市更新项目资源 14个项目集中亮相", "content": "北京市首次从市级层面系统推出城市更新项目资源，14个代表性城市更新项目集中亮相“城市更新合伙人”2026北京城市更新推介会。推介会相关工作自3月启动，先后走进各区开展项目征集和交流，共征集1273个意向项目，组织经营主体对全市80余个重点项目开展实地踏勘，遴选出14个代表性城市更新项目。本次推介的14个项目覆盖意向类和实施类项目，既有片区统筹更新，也有重点地块、产业园区和老旧楼宇更新，体现北京城市更新由单体项目向综合组团、由空间更新向功能提升、由政府推动向市场协同转变的发展方向。（新华社）", "ctime": 1783406947, "time_str": "14:49:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260707/c678002711.shtml"}, {"id": "4665761", "title": "远景动力大圆柱电池产品已规模化量产 将供应宝马新世代纯电平台多款车型", "content": "电池企业远景动力的46120大圆柱电池产品有了新进展。记者获悉，远景动力的46120（即46毫米直径、120毫米高度）大圆柱电池产品已在沧州和无锡江阴工厂规模化量产，将供应宝马新世代纯电平台多款车型，后者近日全球首发的全新iX5纯电车型为首款采用该电池产品的车型。据相关知情人士向记者透露，除iX5外，远景动力46系大圆柱产品还将供宝马新世代平台的X3、X6、X7等车型，“供的都是纯电车型，比如北美市场的X3纯电版本，不过目前X6、X7纯电版本还没官宣。”该人士并透露，远景动力主要供应电芯，PACK等预计由宝马自己做，“双方2022年就建立合作了。”（财联社）", "ctime": 1783406474, "time_str": "14:41:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260707/c678002566.shtml"}, {"id": "4665735", "title": "日韩股市集体收跌", "content": "日经225指数收跌2.12%，报68256.96点。韩国综指收跌4.91%，报7655.92点。", "ctime": 1783406116, "time_str": "14:35:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": " m.cn/20260707/c678002072.shtml"}, {"id": "4665551", "title": "商业银行不良处置仍在加速 上半年全行业转让核销合计至少5000亿", "content": "商业银行仍在加快不良资产的处置。银登中心和机构最新统计数据显示，上半年银登中心转让不良为1011亿元，结合前5个月商业银行不良核销4868亿元，粗略合计上半年全行业不良资产处置至少超5000亿元。（财联社）", "ctime": 1783404814, "time_str": "14:13:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260707/c678002010.shtml"}, {"id": "4665535", "title": "市场研究机构预测：2030年全球模块化建筑市场规模将突破1428亿美元", "content": "模块化建筑，是指把建筑拆成一个个模块，在工厂里完成制造，再运到现场拼装成型。近期，这种建筑方式在海外市场走红，国产模块化建筑出口增长迅速。模块化建筑的高效精准，也为其打开了广阔的市场空间。据市场研究机构预测，2030年全球模块化建筑市场规模将突破1428亿美元。中国作为全球最大的建筑市场之一，从设计研发、智能生产到远洋物流、海外安装，全产业链优势正加速转化为出口竞争力。（央视财经）", "ctime": 1783404709, "time_str": "14:11:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260707/c678001975.shtml"}, {"id": "4665507", "title": "国家防总针对广西水库险情开展应急调度工作", "content": "记者从应急管理部获悉，7月6日，受台风及强降雨影响，广西壮族自治区南宁市、贵港市多座水库发生险情。国家防总办公室、应急管理部持续调度应急处置工作，组织中国气象局、水利部、自然资源部、住房城乡建设部、交通运输部等部门联合会商，国家应急指挥总部进入应急状态。（新华社）", "ctime": 1783404564, "time_str": "14:09:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260707/c678001942.shtml"}, {"id": "4665503", "title": "沪深京三市成交额超2.2万亿元，较上日此时缩量4908亿元", "content": "据同花顺iFinD数据，沪深京三市成交额超2.2万亿元，较上日此时缩量4908亿元，预计全天成交金额约2.5万亿元。截至目前，沪市成交额10101亿元，深市成交额11757亿元，北证50成交额144亿元。", "ctime": 1783404534, "time_str": "14:08:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260707/c678001904.shtml"}, {"id": "4665501", "title": "北证50指数跌幅扩大至1%", "content": "北证50指数跌幅扩大至1%，现报1233.434点。", "ctime": 1783404528, "time_str": "14:08:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260707/c678001902.shtml"}, {"id": "4665451", "title": "欧洲斯托克50期货下跌0.28%", "content": "欧洲斯托克50期货下跌0.28%，德国DAX期货下跌0.23%，富时期货上涨0.18%。", "ctime": 1783404288, "time_str": "14:04:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260707/c678001846.shtml"}, {"id": "4665073", "title": "支付宝AI开放平台开启邀测", "content": "继5月发布AI支付全栈产品、6月发布全新AI版支付宝（简称“阿宝”）后，支付宝今日正式上线AI开放平台。商家通过支付宝AI开放平台，可将服务能力接入“阿宝”。同时，还可通过阿宝接入手机AI助手、智能车机、AI眼镜、IoT设备、第三方大模型应用等多端场景。该平台现已面向企业、服务商开放邀测，多个品牌、机构已首批接入。（科创板日报）", "ctime": 1783403348, "time_str": "13:49:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260707/c678001669.shtml"}, {"id": "4665053", "title": "全国62条河流发生超警以上洪水", "content": "记者从水利部了解到，受降雨影响，昨天到今天，广西西江干流桂平至梧州江段及支流清水河蒙江、郁江及支流武思江、柳江支流洛清江、桂江及支流桃花江、桂南沿海南流江钦江，广东北江支流水边河，湖南资水及支流蓼水等62条河流发生超警以上洪水，其中广西清水河发生有实测资料以来最大洪水。此外，太湖周边杭嘉湖河网区4站超警0.02～0.07米。（央视新闻）", "ctime": 1783403099, "time_str": "13:44:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260707/c678001596.shtml"}, {"id": "4665017", "title": "纽约期金失守4130美元/盎司", "content": "纽约期金失守4130美元/盎司，日内跌0.96%。", "ctime": 1783402838, "time_str": "13:40:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260707/c678001556.shtml"}, {"id": "4665015", "title": "智谱港股涨超10%", "content": "智谱港股涨10.39%，报1688.00港元。此前智谱辟谣“撤回A股IPO辅导备案”：不属实，存在恶意炒作之嫌，A股发行辅导工作已完成。", "ctime": 1783402836, "time_str": "13:40:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260707/c678001554.shtml"}, {"id": "4664999", "title": "现货黄金失守4120美元/盎司", "content": "现货黄金失守4120美元/盎司，日内跌1.09%。", "ctime": 1783402774, "time_str": "13:39:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260707/c678001548.shtml" // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
