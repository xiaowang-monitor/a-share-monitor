ce": "", "url": "https://news.10jqka.com.cn/20260403/c675759636.shtml"}, {"id": "4184469", "title": "伊朗警告将摧毁美以在中东所有资产", "content": "伊朗媒体3日报道，伊朗军方发表声明说，若美国敢对伊朗基础设施动手，伊朗将摧毁美国和以色列在中东地区的“所有资产和基础设施”。(新华社)", "ctime": 1775207878, "time_str": "17:17:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260403/c675759633.shtml"}, {"id": "4184467", "title": "苏奥传感：董事滕飞、财务总监孔有田已分别减持0.86555%和0.12527%", "content": "苏奥传感公告，公司董事兼总经理滕飞及副总经理兼财务总监孔有田于2026年1月14日至16日通过大宗交易完成减持。滕飞以9.5元/股减持693万股，减持0.86555%，减持后持股2150.5万股，占2.68596%；孔有田以9.5元/股减持100.3万股，减持0.12527%，减持后持股335.94万股，占0.41959%。两人均已完成此前披露的减持计划。", "ctime": 1775207793, "time_str": "17:16:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260403/c675759577.shtml"}, {"id": "4184463", "title": "中闽能源：公司股票连续3个交易日内日收盘价格跌幅偏离值累计达到20%以上", "content": "中闽能源公告，公司股票连续3个交易日（即2026年4月1日、4月2日和4月3日）内日收盘价格跌幅偏离值累计达到20%以上，根据《上海证券交易所交易规则》的有关规定，属于股票交易异常波动的情形。经公司自查，并向控股股东福建省投资开发集团有限责任公司核实，截至本公告披露日，公司不存在应披露而未披露的重大事项。公司股票价格短期波动较大，敬请广大投资者注意二级市场交易风险，审慎决策，理性投资。", "ctime": 1775207510, "time_str": "17:11:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260403/c675759435.shtml"}, {"id": "4184461", "title": "千方科技：因违规减持未及时披露被出具警示函", "content": "千方科技公告，公司于近日收到中国证券监督管理委员会浙江监管局《行政监管措施决定书》。2026年1月7日，公司持有杭州鸿泉物联网技术股份有限公司股份比例由10.39%减少至9.99%，触及5%整数倍，未在规定时间内停止交易，未及时披露《简式权益变动报告书》，迟至2026年3月11日才披露。因上述行为，公司被采取出具警示函的监督管理措施，并记入证券期货市场诚信档案。", "ctime": 1775207504, "time_str": "17:11:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260403/c675759433.shtml"}, {"id": "4184459", "title": "仙鹤股份：实际控制人王明龙收到浙江监管局行政监管措施决定书", "content": "仙鹤股份公告，公司实际控制人之一王明龙先生收到中国证券监督管理委员会浙江监管局出具的《关于对王明龙采取责令改正措施的决定》。王明龙作为公司实际控制人之一，未将借用他人证券账户持有仙鹤股份股票事项及时告知公司，导致公司控股股东及一致行动人合计持有公司股份比例达到80%时未及时披露。上述行为违反了《上市公司收购管理办法》相关规定，监管局决定对王明龙采取责令改正的监督管理措施，并记入证券期货市场诚信档案。", "ctime": 1775207499, "time_str": "17:11:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260403/c675759430.shtml"}, {"id": "4184457", "title": "红豆股份：收到江苏证监局行政监管措施决定书", "content": "红豆股份公告，公司及相关责任人收到江苏证监局行政监管措施决定书。经查，截至2024年12月31日，红豆股份对红豆集团的1.1亿元应收账款发生逾期，相关逾期应收账款于2025年4月30日前全部收回。但2025年，红豆股份对红豆集团的应收账款再次发生逾期。截至2025年9月30日，公司对红豆集团逾信用期应收账款余额为4509.43万元。红豆股份在2024年对红豆集团应收账款已经出现逾期的情况下，2025年未对关联应收账款进行严格控制并及时催收，导致再次发生应收账款逾期，构成控股股东在日常经营活动中占用上市公司资金的情形。", "ctime": 1775207496, "time_str": "17:11:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260403/c675759428.shtml"}, {"id": "4184455", "title": "科威特一电力和海水淡化厂遭袭", "content": "据科威特通讯社3日报道，科威特电力、水利和可再生能源部发言人法蒂玛·哈亚特说，伊朗当日发动的袭击导致科威特一座电力和海水淡化厂受损。 报道说，技术和应急小组已立即着手处理该事件，以确保设备继续运行。 科威特电力、水利和可再生能源部3月30日说，该国一处电力和海水淡化设施29日晚在一场袭击中严重损坏，一名印度籍工作人员死亡。(新华社)", "ctime": 1775207277, "time_str": "17:07:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260403/c675759306.shtml"}, {"id": "4184453", "title": "工业和信息化部推动普惠算力赋能中小企业", "content": "工业和信息化部日前印发关于开展普惠算力赋能中小企业发展专项行动的通知，提出到2028年底，基本建成覆盖广、成本低、服务优、生态活、人才强的普惠算力服务体系，在中小企业划分标准适用的15类行业中覆盖门类不少于10类。 通知围绕算力资源配置提升行动、算力服务普惠供给行动、重点行业企业赋能行动、产业生态协同共建行动、人才培养能力建设行动等五项重点任务作出一系列安排，包括鼓励设立中小企业专属算力池；探索“算力银行”“算力超市”等创新业务，支持中小企业存入闲置算力资源等。 通知还提出，开展“模数共振”专项行动，推动中小企业人工智能模型训练应用与数据资源开发利用协同互促；组织开展大中小企业融通对接活动；分层分类开展精准化人才培训等。 保障措施方面，通知明确有关方面要建立健全本地工作推进体系，明确任务分工、时间节点和责任主体，对普惠算力赋能中小企业发展专项行动给予必要的配套支持。(新华社)", "ctime": 1775207216, "time_str": "17:06:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260403/c675759282.shtml"}, {"id": "4184445", "title": "金钼股份：2025年净利润31.55亿元，同比增长5.77%", "content": "金钼股份公告，2025年营业收入138.34亿元，同比增长1.94%。净利润31.55亿元，同 727, "time_str": "16:58:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260403/c675758908.shtml"}, {"id": "4184417", "title": "宇通客车：3月生产4201辆，同比下降12.41%", "content": "宇通客车公告，2026年3月生产量4201辆，同比下降12.41%，其中大型1976辆、中型1183辆、轻型1042辆；销售量4118辆，同比下降15.79%，大型1859辆、中型1157辆、轻型1102辆。本年累计生产量8429辆，同比下降5.65%，销售量7652辆，同比下降15.08%。", "ctime": 1775206528, "time_str": "16:55:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260403/c675758770.shtml"}, {"id": "4184415", "title": "韩国深圳总商会在首尔成立", "content": "韩国深圳总商会4月2日在首尔正式揭牌成立，来自中韩两国政商界及侨界代表200余人出席活动。中国驻韩国使馆公使衔参赞兼总领事钟洪糯在成立大会致辞表示祝贺。他强调，深圳是中国改革开放的重要窗口和创新发展的标杆城市，在数字经济、绿色产业、智能制造等领域与韩国合作潜力巨大。相信总商会将把握历史机遇、积极有为，在推动中韩经贸合作、促进两国友好交流方面发挥更大作用。成立大会上，主礼嘉宾共同为商会揭牌。创会会长郑朝辉表示，未来将围绕投资促进、产业对接、科技创新等重点领域，推动深圳与韩国在多层次、多领域的合作，同时积极服务国家对外开放大局，凝聚在韩企业资源，促进互利共赢。（新华社）", "ctime": 1775206472, "time_str": "16:54:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260403/c675758740.shtml"}, {"id": "4184411", "title": "十部门：开展人工智能科技活动应将科技伦理要求贯穿全过程", "content": "工信部等十部门印发《人工智能科技伦理审查与服务办法（试行）》的通知。开展人工智能科技活动应将科技伦理要求贯穿全过程，遵循增进人类福祉、尊重生命权利、坚持公平公正、合理控制风险、保持公开透明、保护隐私安全、确保可控可信的人工智能科技伦理原则，遵守我国宪法、法律法规和有关规定。", "ctime": 1775206224, "time_str": "16:50:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260403/c675758595.shtml"}, {"id": "4184409", "title": "以军称伊朗发射集束弹头导弹 击中以北部地区", "content": "总台记者获悉，当地时间3日上午，以色列北部地区遭伊朗导弹袭击。以国防军评估称，此次伊朗发射的弹道导弹携带集束弹头。据悉，海法和基里亚特阿塔共出现6处坠落点。在基里亚特阿塔，弹药击中一处住宅，一人受伤，另有两辆汽车起火；海法部分道路受损，暂无人员伤亡报告。（央视新闻）", "ctime": 1775206169, "time_str": "16:49:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260403/c675758537.shtml"}, {"id": "4184405", "title": "通用股份：持股5%以上股东红豆集 // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {

    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>

  `).join('');
}

  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
