约为78天用量，连同国家储备计算，总储备量为222天。（央视新闻）", "ctime": 1776243134, "time_str": "16:52:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260415/c676010529.shtml"}, {"id": "4230293", "title": "哥斯达黎加附近海域发生5.7级地震", "content": "据美国地质调查局地震信息网消息，北京时间15日14时56分，哥斯达黎加塔马林多西南方向约72公里海域发生5.7级地震，震源深度约20公里。（央视新闻）", "ctime": 1776243114, "time_str": "16:51:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260415/c676010518.shtml"}, {"id": "4230291", "title": "科汇股份：2025年净利润4687.8万元，同比增长53.71%", "content": "科汇股份公告，2025年营业收入5.05亿元，同比增长20.31%。净利润4687.8万元，同比增长53.71%。公司拟向全体股东每10股派发现金红利人民币1.93元（含税）。", "ctime": 1776243078, "time_str": "16:51:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260415/c676010506.shtml"}, {"id": "4230289", "title": "热威股份：2025年净利润3.23亿元，同比增长7.80%", "content": "热威股份公告，2025年实现营业收入21.26亿元，同比增长10.49%；净利润3.23亿元，同比增长7.80%。公司拟向全体股东每股派发现金红利0.70元（含税），合计拟派发现金红利2.82亿元（含税），本年度公司现金分红占2025年度归属于母公司所有者的净利润的87.19%。", "ctime": 1776243052, "time_str": "16:50:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260415/c676010490.shtml"}, {"id": "4230275", "title": "欧洲央行管委Rehn称加息并非板上钉钉", "content": "欧洲央行管委会成员Olli Rehn表示，“加息并非必然。”Rehn周三在芬兰商业媒体Kauppalehti的网络直播采访中说：“我们的立场需要是保持冷静，并仔细评估能源冲击在中期内的影响。”“很大程度上取决于这场严重的能源冲击会持续多久。如果只持续几个月，那么教科书式的答案就是顺其自然，维持货币政策不变。”“但如果这推高了通胀预期，并对物价和工资造成第二轮冲击，那么货币政策显然需要做出反应，以将预期控制在欧洲央行2%的目标范围内。”（新浪财经）", "ctime": 1776242753, "time_str": "16:45:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260415/c676010321.shtml"}, {"id": "4230263", "title": "巴基斯坦总理率团访问沙特等国", "content": "巴基斯坦外交部4月15日发表声明说，巴基斯坦总理夏巴兹将于15日至18日正式访问沙特阿拉伯、卡塔尔和土耳其。声明说，夏巴兹访问沙特和卡塔尔期间将分别同两国领导人举行会晤，就双边合作以及地区和平与安全等议题交换意见。根据声明，夏巴兹还将访问土耳其，预计将同土耳其总统埃尔多安举行会见。(CCTV国际时讯)", "ctime": 1776242678, "time_str": "16:44:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260415/c676010268.shtml"}, {"id": "4230253", "title": "伊朗总统称没有任何力量能迫使伊朗人民屈服", "content": "当地时间15日，伊朗总统佩泽希齐扬表示，美以针对平民和儿童的袭击，以及对包括学校、医院在内的关键基础设施的破坏，均无法在国际法和人道原则框架下得到正当解释。他同时质问称：“对我国的攻击究竟基于什么理由？”佩泽希齐扬还指出，伊朗不寻求战争与动荡，始终主张与各国进行对话并开展建设性互动。但他强调，任何试图强加意志、迫使伊朗屈服的行为都注定失败，伊朗人民绝不会接受这种做法。（央视新闻）", "ctime": 1776242501, "time_str": "16:41:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260415/c676010196.shtml"}, {"id": "4230251", "title": "新华制药：获得布美他尼注射液药品注册证书", "content": "新华制药公告，近日，收到国家药品监督管理局核准签发的布美他尼注射液《药品注册证书》。", "ctime": 1776242482, "time_str": "16:41:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260415/c676010189.shtml"}, {"id": "4230245", "title": "美伊进入“比胆游戏” 而“时间在伊朗一边”", "content": "美国与伊朗在巴基斯坦的谈判无果而终，美国总统特朗普下令美军封锁霍尔木兹海峡，试图封堵伊朗石油出口，迫使对方妥协。美国有线电视新闻网14日说，美国和伊朗开始了一场“比胆游戏”，特朗普赌伊朗会先服软，但目前几乎没有迹象显示伊朗会在这场事关存亡的斗争中退缩。一些分析人士认为，美国海军的封锁难以完全阻止伊朗石油出口。多年来，伊朗已经找到规避美国制裁、出口石油的方法，比如从陆路通道外运。“目前措施不大可能在近期内从实质上阻断伊朗（石油出口）。”市场研究机构克普勒公司资深原油业分析师约翰内斯·劳巴尔说。(新华社)", "ctime": 1776242415, "time_str": "16:40:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260415/c676010130.shtml"}, {"id": "4230241", "title": "海正药业：一季度净利润3.56亿元，同比增长83.13%", "content": "海正药业发布业绩快报，第一季度营业总收入23.9亿元，同比下降9.17%；净利润3.56亿元，同比增长83.13%。公司对外转让浙江省医药工业有限公司100%股权，导致非经常性损益相应增加；同时受益于医药制剂产品销售增长，以及持续推进精益生产与工艺优化、实现生产降本增效等因素影响，公司扣除非经常性损益后的净利润实现较好增长。", "ctime": 1776242372, "time_str": "16:39:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260415/c676010096.shtml"}, {"id": "4230233", "title": "国邦医药：2026年第一季度净利润1.61亿元，同比下降25.28%", "content": "国邦医药公告，2026年第一季度营收为15.21亿元，同比增长5.61%；净利润为1.61亿元，同比下降25.28%。", "ctime": 1776242272, "time_str": "16:37:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260415/c676010011.shtml"}, {"id": "4230227", "title": "恒瑞医药：子公司HRS-7156片获临床试验批准", "content": "恒瑞医药公告，子公司山东盛迪医药有限公司收到国家药监局核准签发关于HRS-7156片的《药物临床试验批准通知书》，申请适应症为心力衰竭。HRS-7156片是公司自主研发的1类新药，临床前数据显示，HRS-7156可显著改善心脏功能和病变。经查询，目前国内外暂无同类药物获批上市。截至目前，HRS-7156片相关项目累计研发投入约为3760万元。", "ctime": 1776242099, "time_str": "16:34:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260415/c676009914.shtml"}, {"id": "4230225", "title": "舍得酒业：第一季度净利润2.32亿元，同比下降33.10%", "content": "舍得酒业公告，2026年第一季度营业收入14.81亿元，同比下降6.01%。净利润2.32亿元，同比下降33.10%。扣除非经常性损益后的净利润2.23亿元，同比下降34.91%。基本每股收益0.7067元／股，同比下降33.22%。", "ctime": 1776242081, "time_str": "16:34:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260415/c676009901.shtml"}, {"id": "4230221", "title": "吉祥航空：2026年3月，公司国内客运运力投入较上月环比下降0.47%", "content": "吉祥航空公告，2026年3月，公司客运运力投入（按可用座位公里计）同比上升4.17%，其中国内、国际和地区航线客运运力投入同比变动分别为8.25%、-4.74%和-13.14%；旅客周转量（按收入客公里计）同比上升8.92%，其中国内、国际和地区航线旅客周转量同比变动分别为8.73%、10.19%和-11.90%；客座率为88.36%，同比上升3.85%，其中国内、国际和地区航线客座率同比变动分别为0.38%、12.02%和1.22%。2026年3月，公司国内客运运力投入（按可用座位公里计）较上月环比下降0.47%，国内旅客周转量（按收入客公里计）环比下降2.59%，国内航线客座率环比下降1.92%。国际客运运力投入（按可用座位公里计）较上月环比下降4.36%，国际旅客周转量（按收入客公里计）环比上升4.94%，国际航线客座率环比上升7.87%。", "ctime": 1776242051, "time_str": "16:34:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260415/c676009881.shtml"}, {"id": "4230219", "title": "外汇局：3月银行结汇2736亿美元 售汇2576亿美元", "content": "国家外汇管理局统计数据显示，2026年3月，银行结汇18889亿元人民币，售汇17786亿元人民币。2026年1-3月，银行累计结汇53275亿元人民币，累计售汇43606亿元人民币。按美元计值，2026年3月，银行结汇2736亿美元，售汇2576亿美元。2026年1-3月，银行累计结汇7664亿美元，累计售汇6277亿美元。", "ctime": 1776242042, "time_str": "16:34:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260415/c676009877.shtml"}, {"id": "4230209", "title": "安利股份：预计2026年第一季度净利润同比下降87.07%-91.38%", "content": "安利股份公告，预计2026年第一季度净利润为400万元到600万元，同比下降87.07%到91.38%。业绩变动原因：受国内外宏观经济形势影响，下游需求不足，部分品类产品市场需求减弱，营业收入同比下降约6%；原材料价格上涨，美以伊军事冲突引发全球能源与供应链危机，推高国际油价，原材料等成本随之上行，增加了公司生产与运营成本；汇率波动产生不利影响，报告期内，人民币兑美元升值，公司海外业务主要以美元结算为主，人民币汇率波动导致汇兑损失。", "ctime": 1776242004, "time_str": "16:33:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260415/c676009860.shtml"}, {"id": "4230207", "title": "鼎通科技：第一季度净利润8032.74万元，同比增长51.86%", "content": "鼎通科技公告，2026年第一季度营业收入4.57亿元，同比增长20.78%。净利润8032.74万元，同比增长51.86%。主要由于通讯需求增加，112G和224G需求旺盛，液冷批量交付，营业收入增加，毛利率提升所致。", "ctime": 1776241967, "time_str": "16:32:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260415/c676009848.shtml"}, {"id": "4230203", "title": "中国东航：2026年3月客运运力投入同比上升10.63%", "content": "中国东航公告，2026年3月客运运力投入（按可用座公里计）同比上升10.63%；旅客周转量（按客运人公里计）同比上升16.56%；客座率为88.67%，同比上升4.51个百分点。2026年3月货邮周转量（按货邮载运吨公里计）同比上升9.87%。", "ctime": 1776241942, "time_str": "16:32:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260415/c676009845.shtml"}, {"id": "4230199", "title": "雄商高铁河北段开始联调联试", "content": "记者从中国铁路北京局集团有限公司获悉，15日，55463次检测列车从雄安站开出，标志着雄商高铁河北段正式进入联调联试阶段。据国铁北京局科信部副主任王齐涛介绍，此次雄商高铁河北段联调联试计划用时80天完成，铁路部门将采用专业检测列车、综合检测列车、测试动车组和相关检测设备对线路进行综合测试，评价验证牵引供电、接触网、通信、信号、客服、灾害监测等系统功能，验证轨道、道岔、路基、桥梁等结构工程的适用性，评价综合接地、电磁环境等设备是否满足标准要求，从而为线路各业务系统和整体系统的调试优化提供技术支持，使线路功能达到设计要求。雄商高铁河北段自2022年9月开工建设以来，雄安高速铁路有限公司统筹协调设计、咨询、施工、监理等各方参建单位，强化路地协同联动，攻克三电管线迁改、既有线施工和枢纽接入条件复杂等诸多难题。雄商高铁北起雄安站，终至商丘站，正线全长552公里，设计时速350公里，是我国“八纵八横”高铁网京港通道的重要组成部分。线路建成通车后将进一步完善京津冀轨道交通网，对于贯彻实施京津冀协同发展战略，助力雄安新区建设，促进沿线经济社会发展等具有重要意义。(新华社)", "ctime": 1776241903, "time_str": "16:31:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260415/c676009832.shtml"}, {"id": "4230195", "title": "港股AI储能概念股思格新能暗盘一度涨超90%", "content": "港股AI储能概念股思格新能暗盘一度涨超90%，最高报657港元。", "ctime": 1776241893, "time_str": "16:31:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260415/c676009831.shtml"}, {"id": "4230167", "title": "中煤能源：3月商品煤销量同比降21.4%", "content": "中煤能源公告，3月份商品煤产量1097万吨，同比下降5.7%，销量1946万吨，同比下降21.4%；累计产量3017万吨，同比下降9.5%，累计销量5602万吨，同比下降12.7%。", "ctime": 1776241698, "time_str": "16:28:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260415/c676009730.shtml"}, {"id": "4230149", "title": "圣晖集成：截至2026年03月31日订单余额21.81亿元，同比增长3.06%", "content": "圣晖集成公告，公司截至2026年03月31日在手订单余额21.81亿元（未含税），比上年同期增长3.06%；其中IC半导体行业16.46亿元（未含税），精密制造行业3.15亿元（未含税），光电及其他行业2.2亿元（未含税）。", "ctime": 1776241486, "time_str": "16:24:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260415/c676009662.shtml"}, {"id": "4230147", "title": "神剑股份今日涨停，国泰海通北京知春路净买入1.5亿元", "content": "神剑股份今日涨停，成交额54.60亿元，换手率38.16%，盘后龙虎榜数据显示，深股通专用席位买入6192.66万元并卖出1.66亿元，有2家机构专用席位净卖出9546.59万元。国泰海通北京知春路净买入1.5亿元。", "ctime": 1776241475, "time_str": "16:24:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260415/c676009661.shtml"}, {"id": "4230145", "title": "欧中汽车产业界探讨共同推动产业新生态发展", "content": "“武汉造全球行”欧中汽车新生态合作交流会14日在法国巴黎国际大学城举行。来自欧中汽车产业界、政界及相关机构近200位嘉宾出席活动，围绕绿色转型、技术创新、供应链优化及产业链协同等议题展开深入交流。法国前总理拉法兰在致辞中表示，法中汽车产业合作基础深厚、成果丰硕，双方在新能源、智能网联等前沿领域合作潜力巨大。他期待更多中国企业走进法国，同时鼓励欧洲企业积极参与中国开放合作的产业链体系。活动现场，东风猛士917等十余款“武汉造”新能源智能网联汽车集中亮相。东风进出口公司、小鹏汽车和莲花跑车等企业进行品牌推介，展示电动化、智能化最新成果。采埃孚汽车安全系统公司全球安全测试总监安德烈亚斯·沙赫特纳告诉记者，采埃孚将进一步深化在华发展，推进联合实验室建设，持续提升研发与测试能力。交流会期间，武汉经开区与法雷奥、采埃孚等欧洲企业签署合作协议，进一步拓展汽车产业链合作空间。同时，东风汽车集团达成千台级海外订单，莲花跑车公司与欧洲经销商签署合作协议，加快“武汉造”汽车进入欧洲市场步伐。(新华社)", "ctime": 1776241433, "time_str": "16:23:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260415/c676009639.shtml"}, {"id": "4230143", "title": "宇树、追觅等签约阿里速卖通“Brand+”出海计划", "content": "4月15日，阿里旗下跨境电商平台速卖通举办Top品牌出海闭门会。宇树、追觅、李宁、特步四大品牌现场签约加入了速卖通“Brand+”超级品牌出海计划。速卖通公布了其“Brand+”计划的最新进展：过去一年，品牌在速卖通上高速增长，增速超40%；年销售额超千万美元的品牌数增加64%；2026年，速卖通要帮助2000个中国品牌的出海规模实现翻倍。（人民财讯）", "ctime": 1776241418, "time_str": "16:23:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260415/c676009635.shtml"}, {"id": "4230141", "title": "圣阳股份今日涨停，有3家机构专用席位净卖出9619.16万元", "content": "圣阳股份今日涨停，成交额27.08亿元，换手率23.86%，盘后龙虎榜数据显示，深股通专用席位买入3555.47万元并卖出4119.33万元，有3家机构专用席位净卖出9619.16万元。", "ctime": 1776241413, "time_str": "16:23:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260415/c676009631.shtml"}, {"id": "4230139", "title": "普洛药业：控股子公司获得药品注册证书", "content": "普洛药业公告，近日，控股子公司康裕制药收到药监局签发的氟伐他汀钠缓释片《药品注册证书》。根据相关数据显示，氟伐他汀钠缓释片2025年度国内市场规模约为0.29亿片，销售金额约为1.19亿元。", "ctime": 1776241371, "time_str": "16:22:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260415/c676009610.shtml"}, {"id": "4230113", "title": "正泰电器：第一季度净利润12.67亿元，同比增长8.92%", "content": "正泰电器公告，2026年第一季度营收为213.03亿元，同比增长46.33%；净利润为12.67亿元，同比增长8.92%。", "ctime": 1776241068, "time_str": "16:17:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260415/c676009503.shtml"}, {"id": "4230111", "title": "美以或利用谈判为地面战做准备", "content": "俄罗斯联邦安全会议4月14日就美国和伊朗停火期间的中东局势发表评论称，鉴于五角大楼继续增兵中东地区，美国和以色列可能利用和平谈判为对伊朗发动地面军事行动做准备。另外，伊朗“仍然有大量武器”。伊朗政府目前保持着对国内局势的控制，伊朗并未出现美以“希望看到的动乱和内部动荡”。伊朗各社会政治团体在美以干涉背景下更加团结在中央政府周围。俄联邦安全会议称，如果在停火两周后，美伊谈判仍未达成预期目标，可能会爆发更高强度的敌对行为。(CCTV国际时讯)", "ctime": 1776241064, "time_str": "16:17:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260415/c676009498.shtml"}, {"id": "4230109", "title": "正泰电器：2025年净利润45.01亿元，同比增长16.19%", "content": "正泰电器公告，2025年实现营业收入591.45亿元，同比下降8.33%；净利润45.01亿元，同比增长16.19%。2026年4月14日，公司第十届董事会第十二次会议审议通过《关于公司2025年度利润分配预案的议案》，拟以本次实施权益分派股权登记日登记的可参与利润分配的总股本（扣除公司股份回购专用证券账户持有股数）为基数，向全体股东每10股分配现金股利6元（含税）。", "ctime": 1776241060, "time_str": "16:17:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260415/c676009496.shtml"}, {"id": "4230091", "title": "多氟多：2025年营业收入94.34亿元，同比增长14.37%", "content": "多氟多公告，2025年营业收入94.34亿元，同比增长14.37%，归母净利润2.13亿元，上年同期净亏损3.08亿元。", "ctime": 1776240800, "time_str": "16:13:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260415/c676009378.shtml"}, {"id": "4230087", "title": "李成钢国际贸易谈判代表兼副部长会见美国福特汽车公司全球执行副总裁兼首席政务官柯立", "content": "4月13日，李成钢国际贸易谈判代表兼副部长在京会见美国福特汽车公司全球执行副总裁兼首席政务官柯立。双方就中美经贸关系、福特公司在华发展等进行了交流。李成钢表示，习近平主席指出，经贸应该继续成为中美关系的压舱石和稳定器，而不是绊脚石和冲突点。去年以来，在两国元首重要共识战略引领下，中美双方经过六轮经贸磋商，在经贸领域达成一系列成果，为两国经贸关系和世界经济注入了更多确定性和稳定性。李成钢指出，中美汽车产业优势互补，合作空间广阔。希望福特汽车公司继续深耕中国市场，加强与中国企业交流合作，为中国和全球市场提供更多有竞争力的产品。柯立表示，福特汽车在华经营多年，高度重视中国市场和产业链供应链，愿与合作伙伴共同探索业务发展新机遇，希望美中经贸关系保持稳定发展。(商务部)", "ctime": 1776240779, "time_str": "16:12:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260415/c676009296.shtml"}, {"id": "4230085", "title": "港股收评：恒生指数收涨0.29%，恒生科技指数涨1.23%", "content": "港股收盘，恒生指数收涨0.29%，恒生科技指数涨1.23%。创新药板块领涨，荣昌生物涨超9%，君实生物涨超6%，恒瑞医药涨超4%；权重科技股普涨，京东集团涨超4%，百度集团、阿里巴巴涨超3%。 5:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260415/c676008281.shtml"}, {"id": "4230053", "title": "特朗普称战事“接近结束” 多方预计谈判重启", "content": "美国总统特朗普14日表示美对伊军事行动“接近结束”。同日，美国媒体报道，若美伊举行第二轮谈判，美副总统万斯预计将再次率团。俄罗斯媒体同一天援引阿拉伯国家外交消息人士的话报道说，有关方正在讨论延长伊朗和美国临时停火的可能性。(新华社)", "ctime": 1776240308, "time_str": "16:05:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260415/c676008196.shtml"}, {"id": "4230047", "title": "中国人民银行：将境内外商独资银行、境内中外合资银行、外国银行境内分行的境外贷款杠杆率由0.5上调至1.5", "content": "中国人民银行上海总部，各省、自治区、直辖市及计划单列市分行；国家外汇管理局各省、自治区、直辖市及计划单列市分局；国家开发银行，各政策性银行、国有商业银行，中国邮政储蓄银行，各股份制商业银行： 为更好发挥金融服务实体经济、促进贸易投资便利化作用，现就银行业金融机构境外贷款业务有关事宜通知如下： 一、将境内外商独资银行、境内中外合资银行、外国银行境内分行的境外贷款杠杆率由0.5上调至1.5，香港特别行政区、澳门特别行政区和台湾地区的金融机构在内地（大陆）设立的银行机构比照适用。将进出口银行的境外贷款杠杆率由3上调至3.5。如计算的境外贷款余额上限小于100亿元，核定该银行境外贷款余额上限为100亿元。 二、境内银行通过向境外银行融出资金等方式间接向境外企业发放一年期以上本外币贷款的，可由境外银行依据其所在国家或地区相关法律法规办理。 本通知自发布之日起实施。《中国人民银行国家外汇管理局关于银行业金融机构境外贷款业务有关事宜的通知》（银发〔2022〕27号）第七条中“境内银行通过向境外银行融出资金等方式间接向境外企业发放一年期以上本外币贷款的，原则上应要求境外银行等直接债权人参照本条规定办理”的规定不再适用。银行业金融机构境外贷款业务的其他事宜仍按照银发〔2022〕27号文执行。(央行)", "ctime": 1776240231, "time_str": "16:03:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260415/c676008115.shtml"}, {"id": "4230045", "title": "伊朗称美以袭击已致德黑兰约4万套住宅受损", "content": "当地时间15日，伊朗德黑兰省省长表示，自美以对伊朗发动袭击以来，该省已有约4万套住宅不同程度受损，学校、医疗机构及红新月会等民用设施也成为袭击目标。在人员伤亡方面，学生、女性和教育工作者占比较高。同一天，伊朗科学、研究与技术部长在谈及教育科研领域伤亡情况时表示，截至目前，该领域已有超过60名高校学生在冲突中身亡，另有约10名大学教师丧生。（央视新闻）", "ctime": 1776240097, "time_str": "16:01:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260415/c676007508.shtml"}];
const SECTORS  = [{"name": "数据要素", "hit_count": 24, "etfs": []}, {"name": "金融", "hit_count": 23, "etfs": []}, {"name": "人工智能", "hit_count": 23, "etfs": []}, {"name": "军工", "hit_count": 19, "etfs": []}, {"name": "医药", "hit_count": 15, "etfs": []}, {"name": "消费", "hit_count": 15, "etfs": []}, {"name": "新能源", "hit_count": 10, "etfs": []}, {"name": "半导体", "hit_count": 9, "etfs": []}];
const META     = {"update_time": "2026-04-15 17:06:09", "sentiment_score": 56.652360515021456, "agents": []};

// 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
