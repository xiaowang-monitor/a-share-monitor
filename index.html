ame": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260819/c679083744.shtml"}, {"id": "4983803", "title": "消息称三星电子目标今年9月率先完成1d nm DRAM内存研发", "content": "近日，据业内人士透露，三星电子目标2026年9月率先完成1d nm DRAM内存研发，2026年12月进入量产转移阶段，2027年上半年启动生产线建设，有望2027年底实现首批量产。（科创板日报）", "ctime": 1787125006, "time_str": "15:36:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260819/c679083456.shtml"}, {"id": "4983799", "title": "北京市新增20款已完成备案的生成式人工智能服务", "content": "截至2026年8月19日，北京市新增20款已完成备案的生成式人工智能服务，累计已完成279款生成式人工智能服务备案。", "ctime": 1787124997, "time_str": "15:36:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260819/c679083452.shtml"}, {"id": "4983793", "title": "国电南自：2026年半年度净利润1.94亿元，同比增长22.01%", "content": "国电南自公告，2026年上半年营业收入39.47亿元，同比下降7.82%。归属于上市公司股东的净利润1.94亿元，同比增长22.01%。归属于上市公司股东的扣除非经常性损益的净利润1.86亿元，同比增长24.57%。基本每股收益0.19元。本报告期无利润分配预案或公积金转增股本预案。", "ctime": 1787124973, "time_str": "15:36:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260819/c679083447.shtml"}, {"id": "4983781", "title": "外交部：国际社会坚持一个中国原则的基本格局不可撼动", "content": "8月19日，外交部发言人林剑主持例行记者会。有记者提问，据报道，马来西亚总理安瓦尔近日接受采访时表示，台湾是中国的一部分。中方对此有何评论?林剑表示，坚持一个中国原则是人心所向，大义所在。国际社会坚持一个中国原则的基本格局，不可撼动。中方对安瓦尔总理的表态表示赞赏。（央视新闻）", "ctime": 1787124884, "time_str": "15:34:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260819/c679083399.shtml"}, {"id": "4983777", "title": "外交部：中方愿同印尼遵循两国元首的战略引领 办好两大机制会议", "content": "8月19日，外交部发言人林剑主持例行记者会。有记者就王毅外长即将访问印尼及举行有关机制会的相关情况提问。对此，林剑表示，在两国元首战略引领下，中印尼命运共同体建设深入推进，五大支柱合作取得丰硕成果。当前世界百年变局加速演进。中印尼作为发展中大国和全球南方主要代表，加强战略沟通和团结协作具有重要意义。双方启动中国印尼全面战略对话机制，举行外长防长“2+2”对话机制第二次部长级会议，充分彰显中印尼关系的高水平和战略性。在全面战略对话机制首次会上，双方将着眼加强发展战略对接，探讨深化中印尼命运共同体建设的务实举措，助力两国的现代化进程。在“2+2”机制会上，王毅外长、董军防长将同印尼重点就政治安全与防务合作、国际地区形势等深入交换意见。中方愿同印尼遵循两国元首的战略引领，办好两大机制会议，统筹推进发展与安全合作，加快构建具有地区和全球影响力的中印尼命运共同体，为各自国家人民带来更多福祉，为地区和世界的和平发展作出更大贡献。（央视新闻）", "ctime": 1787124840, "time_str": "15:34:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260819/c679083377.shtml"}, {"id": "4983775", "title": "外交部：赞同俄罗斯外长有关涉日表态", "content": "据报道，俄罗斯外长拉夫罗夫日前表示，希望日本充分认真阅读《联合国宪章》，包括第107条“敌国条款”。外交部发言人林剑19日在例行记者会上说，中方赞同拉夫罗夫外长有关表态。“敌国条款”是《联合国宪章》的重要规定。今年是东京审判开庭80周年，重申“敌国条款”的含义，强调这一条款的约束力，对于捍卫中国人民抗日战争和世界反法西斯战争胜利成果、严防军国主义幽灵死灰复燃具有重要意义。(新华社)", "ctime": 1787124833, "time_str": "15:33:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260819/c679083372.shtml"}, {"id": "4983761", "title": "沙特证券交易所交易将于2026年8月19日周三恢复，开盘竞价阶段将于上午10:15开始", "content": "沙特证券交易所交易将于2026年8月19日周三恢复，开盘竞价阶段将于上午10:15开始。", "ctime": 1787124641, "time_str": "15:30:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260819/c679083189.shtml"}, {"id": "4983759", "title": "王毅外长即将访问韩国 外交部介绍此访期待", "content": "外交部发言人林剑主持例行记者会。有记者提问，中方发布了王毅外长即将访问韩国的消息，中方对此访有何期待？林剑表示，中韩互为近邻和合作伙伴。建交34年来，中韩关系全面快速发展，为两国人民带来实实在在的利益，也为促进地区和平稳定与发展繁荣作出积极贡献。林剑指出，去年底今年初，习近平主席同李在明总统成功实现互访，并达成重要共识，开辟中韩关系发展新局面。相信王毅外长此访将有助于双方进一步落实好两国元首重要共识，加强沟通、增进互信、深化交流合作，共同推动中韩战略合作伙伴关系不断向前发展。（央视新闻）", "ctime": 1787124631, "time_str": "15:30:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260819/c679083184.shtml"}, {"id": "4983753", "title": "美韩联合军演将提前结束，外交部：政治解决半岛问题符合各方共同利益", "content": "8月19日，外交部发言人林剑主持例行记者会。法新社记者提问，美韩双方今天表示将提前结束原定的年度联合军演。就在几天前，特朗普总统刚以他与朝鲜领导人金正恩的良好关系为由，提出缩减演习规模。请问中方如何看待美韩这些年度军演？对今年演习提前收场又有何评论？“我们此前回应过相关的问题。”林剑指出，维护朝鲜半岛的和平稳定，推动半岛问题的政治解决，符合各方的共同利益。（澎湃新闻）", "ctime": 1787124606, "time_str": "15:30:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260819/c679083173.shtml"}, {"id": "4983745", "title": "外交部：国际社会应共同抵制和阻止日本右翼势力危险动向", "content": "8月19日，外交部发言人林剑主持例行记者会。有记者提问，我们关注到俄罗斯外长拉夫罗夫17日对媒体表示，希望日本充分认真阅读《联合国宪章》，包括第一百零七条及“敌国条款”，日本当年是在承认军国主义罪行，承认联合国宪章全部内容的情况下加入联合国，如果日本领导层试图突破本国宪法约束，改写国际法，逃避历史责任，当然会引起严重担忧。请问中方对此有何评论？林剑表示，中方赞同拉夫罗夫外长的有关表态，“敌国条款”是《联合国宪章》的重要规定。今年是东京审判开庭80周年，重申敌国条款的含义，强调这一条款约束力，对于捍卫中国人民抗日战争和世界反法西斯战争胜利成果，严防军国主义幽灵死灰复燃具有重要意义。如今高市政府却对日本的历史罪行避而不谈，不仅不反思，还想方设法企图抛弃和平主义，突破日本宪法和国际、国内法规制，图谋加速“再军事化”，这是对战后国际秩序的公然挑战，世界上所有爱好和平的国家，都应共同抵制和阻止日本右翼势力这一危险动向，共同维护二战胜利成果和战后国际秩序，防止历史悲剧重演。（央视新闻）", "ctime": 1787124501, "time_str": "15:28:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260819/c679083141.shtml"}, {"id": "4983743", "title": "外交部回应美韩联合军演将提前结束", "content": "就美韩联合军演将提前结束，外交部发言人林剑19日在例行记者会答问时表示，维护朝鲜半岛和平稳定、推动半岛问题政治解决，符合各方共同利益。（新华社）", "ctime": 1787124480, "time_str": "15:28:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260819/c679083134.shtml"}, {"id": "4983735", "title": "美要求各方在美中人工智能生态系统中“选边站队”，外交部答澎湃：坚决反对搞阵营对抗", "content": "记者提问，据报道，美政府拟致信“人工智能机遇伙伴关系联合声明”联署国，要求各方不得同时加入美方相关倡议和与美方倡议冲突的其他机制。美匿名官员称，此举旨在向各方明确指出，不得同时加入美中两国的人工智能生态系统。中方对此有何评论？林剑表示，人工智能是全人类共同的智慧结晶和宝贵财富，国际社会普遍期待广泛开展人工智能合作。各国有权根据自身的国情和发展需要，选择合作伙伴。林剑强调，中方坚决反对在人工智能问题上搞选边站队，阵营对抗，希望各方摈弃零和思维，坚持和衷共济，尊重各国的数字主权，携手构建公正合理的全球人工智能治理体系，让人工智能成为促进共同繁荣，维护共同安全的重要动力源。(澎湃新闻)", "ctime": 1787124371, "time_str": "15:26:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260819/c679083099.shtml"}, {"id": "4983727", "title": "知情人士：五角大楼评估减少在中东军事存在", "content": "据多名要求匿名的知情人士18日披露，五角大楼正就美军在中东地区的军事存在作非正式评估，其中一个关键领域是伊朗战事结束后是否要从波斯湾撤军。设在那里的美军基地在战事中损毁严重，已有专家建议美军将部队和装备西撤至约旦、以色列或沙特的红海沿岸。\n\n据悉，这一评估由五角大楼政策办公室牵头，美军联合参谋部和中央司令部也在研究相关问题。知情人士强调，美国国防部长赫格塞思尚未正式下令评估美军在中东地区的军事态势，当前正在进行的评估属于“审慎规划”，最终有可能向美国政府提供重建美军基地的解决方案。(央视新闻)", "ctime": 1787124259, "time_str": "15:24:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260819/c679083056.shtml"}, {"id": "4983723", "title": "SK海力士美股夜盘涨超5% 公司拟回购40万亿韩元股票", "content": "SK海力士美股夜盘涨超5%，此前一度跌超3%。消息面上，SK海力士拟回购40万亿韩元（约合286亿美元）股份，股票回购后将注销，以提升股东回报。", "ctime": 1787124244, "time_str": "15:24:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260819/c679083048.shtml"}, {"id": "4983651", "title": "元力股份：公司超级电容炭已实现规模化量产与销售", "content": "元力股份在互动平台表示，公司超级电容炭已实现规模化量产与销售，并持续跟进市场应用的发展。", "ctime": 1787123864, "time_str": "15:17:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260819/c679082856.shtml"}, {"id": "4983645", "title": "山东数据集团揭牌成立", "content": "8月19日，山东数据集团有限公司（简称“山东数据集团”）在济南正式揭牌成立。山东数据集团将重点开展数据资源开发利用、数据基础设施建设运营、数字政府平台建设运营、数据产业生态构建、数字经济赋能增效以及数据科技创新与数字人才培养等工作，全力当好公共数据运营示范者、数字政府建设促进者、数据生态引领者，打造成为山东数据要素产业链的“链主”企业。（浪潮集团）", "ctime": 1787123823, "time_str": "15:17:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260819/c679082807.shtml"}, {"id": "4983633", "title": "电影《牛来》票房破2500万", "content": "据灯塔专业版实时数据，截至8月19日15时13分，影片《牛来》票房突破2500万。", "ctime": 1787123709, "time_str": "15:15:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260819/c679082714.shtml"}, {"id": "4983627", "title": "晨光生物：已战略布局合成生物学 针对相关产品进行研发", "content": "晨光生物8月19日在互动平台表示，合成生物学加宽了植物提取行业的技术边界，为公司产品提供新的技术和生产方案，并非简单的对植物提取技术的替代。公司高度关注合成生物技术的发展动向，已战略布局合成生物学，针对相关产品进行研发，其中莱鲍迪甙M高效生物合成项目入选河北省生物合成专项，番茄红素生物发酵开展发酵液制备试验，通过阶段性论证。", "ctime": 1787123593, "time_str": "15:13:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260819/c679082643.shtml"}, {"id": "4983619", "title": "机构：预估2026年中国人形机器人市场规模达150亿元人民币，商业化验收启动", "content": "根据TrendForce集邦咨询最新机器人产业研究，中国人形机器人部署开始进入汽车、3C、航空、物流及能源等多元场景，产品商业化的考验随之展开。8月19日的2026世界机器人大会(WRC)，首次规划“采购日”，集中进行采购洽谈与产业链对接，反映产业发展重心已从技术展示延伸至实际需求。TrendForce集邦咨询预估，2026年中国人形机器人市场规模将达150亿元人民币，且随量产规模扩大、应用场景增加，2027年市场规模至少可维持60%以上的成长。", "ctime": 1787123508, "time_str": "15:11:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260819/c679082612.shtml"}, {"id": "4983597", "title": "全球首项！我国牵头制定的钢铁行业智能制造国际标准发布", "content": "记者今天了解到，我国牵头制定的全球首项钢铁行业智能制造领域国际标准《钢铁行业智能制造指南》近日发布。该国际标准由我国专家担任项目负责人，汇聚日本、荷兰、法国等多国专家协同参与、联合研制，为全球钢铁行业的数字化转型搭建起互联互通的通用技术底座。（央视新闻）", "ctime": 1787123352, "time_str": "15:09:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260819/c679082529.shtml"}, {"id": "4983517", "title": "巴基斯坦强烈谴责以色列袭击叙利亚", "content": "当地时间8月19日，巴基斯坦外交部通报，巴基斯坦强烈谴责以色列对叙利亚伊德利卜省阿布杜胡尔空军基地发动的无端袭击。此类挑衅行为公然违反国际法，并可能进一步破坏地区和平与稳定。巴基斯坦表示坚定声援叙利亚人民，并重申全力支持叙利亚的主权和领土完整，以及叙利亚的和平与繁荣。巴基斯坦同时呼吁国际社会发挥应有作用，制止以色列一再违反国际法的行为，并追究其破坏地区稳定行为的责任。（央视新闻）", "ctime": 1787122946, "time_str": "15:02:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260819/c679082324.shtml"}, {"id": "4983485", "title": "ETF两市成交额报4967.73亿元，较昨日此时放量43.61亿元", "content": "截至目前，ETF两市成交额报4967.73亿元，较昨日此时放量43.61亿元，分类型来看，股票型ETF成交额2088.83亿元，债券型ETF成交额1845.78亿元，货币型ETF成交额284.63亿元，商品型ETF成交额89.47亿元，QDII型ETF成交额659.03亿元。", "ctime": 1787122890, "time_str": "15:01:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260819/c679082297.shtml"}, {"id": "4983487", "title": "A股收评：双创指数均大跌超6%，全市仅400余股红盘", "content": "A股三大指数今日集体下跌，截至收盘，上证指数跌2.4%，深证成指跌5.01%，创业板指跌6.26%，北证50跌4.89%，科 const SECTORS  = [{"name": "金融", "hit_count": 36, "etfs": []}, {"name": "半导体", "hit_count": 25, "etfs": []}, {"name": "数据要素", "hit_count": 25, "etfs": []}, {"name": "军工", "hit_count": 22, "etfs": []}, {"name": "人工智能", "hit_count": 20, "etfs": []}, {"name": "机器人", "hit_count": 17, "etfs": []}, {"name": "消费", "hit_count": 12, "etfs": []}, {"name": "地产", "hit_count": 6, "etfs": []}];
const META     = {"update_time": "2026-08-19 15:48:49", "sentiment_score": 54.424778761061944, "agents": []};

// 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
