长期向好的支撑条件和基本趋势依然强劲，资本市场运行底层逻辑已悄然发生深刻变化，中国资产的配置价值更加凸显”。对此，中信证券策略研究首席分析师包承超解读称，近些年来，随着国内经济转型升级和资本市场持续改革，A股的投资价值逐步提升。从基本面看，当前A股市场处于盈利上行周期，随着今年以来国内通胀的持续修复，上市公司业绩持续兑现，金融、创新药、新能源、有色、化工等领域的景气度显著改善，市场正由单一主线驱动向多元化定价转变。从产业趋势看，全球AI资本开支仍处于扩张阶段，国内AI产业链在算力、模型以及应用端均处于全球领先地位。此外，经过多年的转型与发展，当前中国制造业已经拥有全球最完备的产业链以及一大批研发实力深厚的制造业龙头，已然形成了强大的全球竞争力。从资本市场看，新“国九条”以来，A股上市公司分红规模持续扩张，为投资者带来稳定的投资红利。", "ctime": 1792418042, "time_str": "21:54:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261019/c680852667.shtml"}, {"id": "5417343", "title": "现货黄金失守4150美元/盎司", "content": "现货黄金失守4150美元/盎司，日内跌0.37%。", "ctime": 1792417425, "time_str": "21:43:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261019/c680852532.shtml"}, {"id": "5417311", "title": "费城半导体指数开盘上涨3.1%", "content": "费城半导体指数开盘上涨3.1%。", "ctime": 1792417078, "time_str": "21:37:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261019/c680852378.shtml"}, {"id": "5417291", "title": "SpaceX美股盘前涨超2%", "content": "SpaceX美股盘前涨超2%，现报149.05美元。", "ctime": 1792417043, "time_str": "21:37:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261019/c680852371.shtml"}, {"id": "5417145", "title": "纳斯达克指数高开逾1% AI硬件股票集体止跌反攻", "content": "美股三大股指开盘涨跌不一，道琼斯指数跌0.06%，标普500指数涨0.52%，纳斯达克综合指数涨1.04%。连跌数日后，AI硬件股票集体反弹，英伟达股价上涨1.4%，台积电股价上涨1.95%，博通股价上涨2.37%，SK海力士股价上涨4.65%，美光科技股价上涨3.92%，超威半导体股价上涨3.42%，阿斯麦股价上涨2.35%，英特尔股价上涨5%，泛林集团股价上涨3.84%，应用材料股价上涨3.74%，ARM股价上涨2.73%。迈威尔科技涨约5%。", "ctime": 1792416640, "time_str": "21:30:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261019/c680852165.shtml"}, {"id": "5417111", "title": "乌总统称再次未收到西方伙伴提供的俄方袭击预警", "content": "乌克兰总统泽连斯基19日在社交媒体上发文称，18日晚至19日凌晨，俄军向乌境内发动多次弹道导弹和无人机打击，造成多地能源设施受损，“乌方再次未收到西方伙伴提供的袭击预警”。\n\n泽连斯基称，俄军向乌境内发射了16枚弹道导弹和200多架无人机，袭击导致10余处能源设施受损，至少55万户家庭断电。文尼察州、沃伦州、基洛沃格勒州等多州的能源设施遭到袭击。此外，有医疗和教育机构以及居民楼在空袭中受损，乌首都基辅市也遭到袭击。(新华社)", "ctime": 1792416572, "time_str": "21:29:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261019/c680852152.shtml"}, {"id": "5417085", "title": "海天股份：公司终止筹划重大事项，2026年10月20日复牌", "content": "海天股份公告，公司此前筹划重大事项，停牌期间与交易对方就部分内容未能达成一致，决定终止筹划。公司股票及海天转债自2026年10月20日起复牌，海天转债同日起恢复转股。", "ctime": 1792416474, "time_str": "21:27:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261019/c680852063.shtml"}, {"id": "5417075", "title": "李强会见伊朗第一副总统阿雷夫", "content": "10月19日下午，国务院总理李强在杜尚别出席上海合作组织成员国政府首脑（总理）理事会第二十五次会议期间会见伊朗第一副总统阿雷夫。\n\n李强表示，中国和伊朗同为文明古国，传统友谊源远流长。建交55年来，中伊关系保持平稳健康发展，经受住了国际风云变幻考验。今年是中伊建立全面战略伙伴关系10周年，中方愿同伊方以此为契机，推动双方各领域交流合作取得新进展。(新华社)", "ctime": 1792416250, "time_str": "21:24:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261019/c680852013.shtml"}, {"id": "5417035", "title": "闪迪美股盘前涨超5%", "content": "闪迪美股盘前涨超5%，现报1366.401美元。", "ctime": 1792415908, "time_str": "21:18:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261019/c680851920.shtml"}, {"id": "5416993", "title": "美光科技美股盘前涨超4%", "content": "美光科技美股盘前涨超4%，现报914.03美元。", "ctime": 1792415631, "time_str": "21:13:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261019/c680851879.shtml"}, {"id": "5416957", "title": "英伟达美股盘前涨超2%", "content": "英伟达美股盘前涨超2%，现报218.48美元。", "ctime": 1792415413, "time_str": "21:10:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261019/c680851792.shtml"}, {"id": "5416903", "title": "汇源集团回应：与“汇源”商标全面切割 启用新品牌“咱家果源”", "content": "10月19日，“汇源集团不再生产汇源果汁”相关话题登上微博热搜。针对市场广泛关注，北京汇源饮料食品集团有限公司（下称“汇源集团”）在接受记者采访时回应称，因重整投资人违约，集团旗下企业将全面停止生产、代工带有“汇源”商标的果汁产品，正式启用新品牌“咱家果源”承接相关业务。(上海证券报)", "ctime": 1792415111, "time_str": "21:05:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261019/c680851716.shtml"}, {"id": "5416901", "title": "中文传媒：2026年度第七期超短融完成发行，规模5亿元", "content": "中文传媒公告，公司此前获准注册金额为人民币30亿元的超短期融资券。公司近日完成2026年度第七期超短期融资券发行，实际发行总额5亿元，期限270日，票面利率1.40%，募集资金已到达指定账户。", "ctime": 1792415111, "time_str": "21:05:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261019/c680851715.shtml"}, {"id": "5416875", "title": "外交部提醒赴法国中国公民加强安全防范", "content": "近日，法国巴黎、马赛、里昂等数十个大中城市爆发大规模游行示威，发生暴力事件和警民冲突。外交部和中国驻法国使领馆再次提醒赴法中国公民提高风险意识，密切关注当地形势，加强安全防范,避免前往游行示威区域，遇突发紧急情况及时报警并联系中国驻法使领馆寻求协助。（领事直通车）", "ctime": 1792415016, "time_str": "21:03:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261019/c680851687.shtml"}, {"id": "5416759", "title": "期市夜盘开盘，国内期货主力合约多数下跌，乙二醇跌超2%", "content": "期市夜盘开盘，国内期货主力合约多数下跌。跌幅方面，焦煤、乙二醇跌超2%，甲醇、PTA、合成橡胶、焦炭、沥青等跌超1%。涨幅方面，燃油涨超1%。", "ctime": 1792414803, "time_str": "21:00:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261019/c680851641.shtml"}, {"id": "5416741", "title": "长鑫科技：合肥、北京两地晶圆厂保持高产能利用率运转 订单饱满", "content": "长鑫科技于今日召开2026年第二次临时股东会。针对与会股东关心的产能落地与市场供需走势等问题，长鑫科技在交流中回应称，公司目前在合肥、北京两地的晶圆厂持续保持高产能利用率运转，订单饱满，有能力通过多元化的产品矩阵和持续优化的成本结构，从容应对市场变化。 (科创板日报)", "ctime": 1792414658, "time_str": "20:57:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261019/c680851614.shtml"}, {"id": "5416707", "title": "贝达药业：LUCIAⅢ期未达主要终点，第56周52%无补充治疗", "content": "贝达药业公告，公司控股子公司于2020年2月独家授权EyePoint在中国区域外开发伏罗尼布。EyePoint公布DURAVYU治疗湿性年龄相关性黄斑变性的第二项关键Ⅲ期LUCIA数据：研究未达到预设主要终点，未能证明相较阿柏西普2mg对照组的统计学非劣效性；关键次要终点均已达成，治疗负担显著降低38%，截至第56周，52%的受试者无需补充治疗，71%的受试者仅接受0次或1次补充治疗。公司正推进相关资产减值测试，减值金额暂未最终确定。", "ctime": 1792414367, "time_str": "20:52:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261019/c680851498.shtml"}, {"id": "5416703", "title": "ST恒信：10月16日获悉原董事长孟楠被采取刑事强制措施", "content": "ST恒信公告，公司于2026年10月16日晚间获悉，原董事长孟楠被采取刑事强制措施。孟楠已于2026年6月30日被股东会罢免非独立董事职务，此后不再在公司担任任何职务；截至目前，公司营业执照上的法定代表人仍为孟楠。相关事项对公司主要子公司产生重大影响，案件目前处于公安司法机关侦查当中，公司各项生产经营活动正常。", "ctime": 1792414346, "time_str": "20:52:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261019/c680851496.shtml"}, {"id": "5416611", "title": "李家超与亚投行行长会面 支持亚投行在港设办事处", "content": "香港特区行政长官李家超19日在香港礼宾府与亚洲基础设施投资银行（亚投行）行长邹加怡会面，他对于亚投行即将在香港设立办事处表示支持。\n\n李家超欢迎邹加怡率团访港，出席即将举行的2026年亚太经济合作组织（APEC）财政部长会。他表示，亚投行一直支持发展中经济体改善基础设施，促进经济可持续发展，香港作为亚投行成员，积极支持亚投行工作。(新华社)", "ctime": 1792413809, "time_str": "20:43:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261019/c680851403.shtml"}, {"id": "5416603", "title": "桂林旅游：公司转让桂圳公司100%股权暨债权获批", "content": "桂林旅游公告，公司拟在北部湾产权交易所公开挂牌转让全资子公司桂圳公司100%股权暨2.2亿元债权，挂牌价格为1.79亿元。本次公开挂牌转让事宜已获桂林市国资委批准，评估报告尚需完成备案，交易尚需提交股东会审议。", "ctime": 1792413749, "time_str": "20:42:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261019/c680851375.shtml"}, {"id": "5416591", "title": "*ST威领：山南锑金增持250万股并拟继续增持不低于2065.23万股", "content": "*ST威领公告，2026年10月13日至2026年10月19日，西藏山南锑金资源有限公司通过集中竞价增持公司250万股，占总股本0.96%；持股增至1843.64万股，占总股本7.07%，权益变动触及1%的整数倍。山南锑金拟在公告披露之日起3个月内继续增持不低于2065.23万股，该数量包含已竞得但尚未完成过户登记的1285万股。", "ctime": 1792413695, "time_str": "20:41:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261019/c680851361.shtml"}, {"id": "5416571", "title": "海洋王：经营及基本面未发生重大变化", "content": "海洋王公告，公司股票于2026年10月16日、10月19日连续2个交易日收盘价格涨幅偏离值累计超过20%。经核查，公司近期经营情况正常，内外部经营环境及基本面未发生重大变化；AI+智慧照明相关业务目前收入规模有限，对公司整体业绩尚不构成重大影响。", "ctime": 1792413418, "time_str": "20:36:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261019/c680850551.shtml"}, {"id": "5416507", "title": "肯尼亚出现埃博拉输入性疫情，我驻肯使馆发布提醒", "content": "10月6日，肯尼亚卫生部通报1例输入性本迪布焦型埃博拉病毒死亡病例。该患者在刚果（金）感染埃博拉病毒，后经陆路抵乌干达坎帕拉，并于10月3日搭乘航班抵达内罗毕乔莫·肯雅塔国际机场，送至内罗毕医院后于当地时间10月5日晚宣布死亡。目前，肯尼亚已累计确诊8例。请全体在肯同胞持续做好健康管理，避免前往刚果（金）疫区。近期有疫区旅居史、与疑似病例相同乘机史人员务必遵守肯卫生部门指引，完成21天自我健康监测。（央视新闻）", "ctime": 1792413139, "time_str": "20:32:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261019/c680849621.shtml"}, {"id": "5416373", "title": "河南省拟发行400.95亿元地方债", "content": "10月19日，河南省财政厅发布通知，决定发行2026年河南省政府一般债券（十三至十四期）、专项债券（七十五至八十六期），总计400.95亿元。本批债券品种为记账式固定利率附息债券，其中7年期新增一般债券计划发行24.85亿元，5年期、7年期、10年期、15年期、20年期、30年期新增专项债券分别计划发行7.02亿元、41.79亿元、9.21亿元、8.46亿元、128.49亿元、62.53亿元；7年期再融资一般债券计划发行15.57亿元；10年期、30年期再融资专项债券分别计划发行7.6亿元、95.43亿元。5年期、7年期债券利息按年支付，10年期、15年期、20年期、30年期债券利息按半年支付。2026年10月26日招标，10月27日开始计息。", "ctime": 1792412965, "time_str": "20:29:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261019/c680849213.shtml"}, {"id": "5416349", "title": "引望与宁德时代、时代电服达成战略合作", "content": "引望与宁德时代、时代电服于19日正式签署战略合作框架协议。三方将展开两大方向的深度合作：三方实现车端、站端与云端的系统级打通，通过宁德时代巧克力换电网络与华为乾崑智驾的深度打通；引望正式加入宁德时代巧克力换电生态：引望将联合战略伙伴，围绕合作车型与宁德时代巧克力换电网络的适配与接入，共同拓展换电补能生态。", "ctime": 1792412891, "time_str": "20:28:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10j const SECTORS  = [{"name": "金融", "hit_count": 58, "etfs": []}, {"name": "人工智能", "hit_count": 29, "etfs": []}, {"name": "半导体", "hit_count": 22, "etfs": []}, {"name": "数据要素", "hit_count": 21, "etfs": []}, {"name": "消费", "hit_count": 19, "etfs": []}, {"name": "军工", "hit_count": 9, "etfs": []}, {"name": "新能源", "hit_count": 7, "etfs": []}, {"name": "机器人", "hit_count": 5, "etfs": []}];
const META     = {"update_time": "2026-10-19 22:36:35", "sentiment_score": 54.83870967741935, "agents": []};

// 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7

  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';

      <div class="flex-1 min-w-0">

        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {

      { name: '资金', val: p.fund, w: 15 },

      { name: '封单', val: p.seal, w: 10 },

    const miniBar = dims.map(d => {

        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
