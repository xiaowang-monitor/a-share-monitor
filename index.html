": "据《日本经济新闻》15日报道，日本首相高市早苗14日在国会答辩中暗示，可能在今年年底修订《国家安全保障战略》等“安保三文件”时，调整其中有关“无核三原则”的表述。 据悉，高市14日在众议院预算委员会会议上回答公明党议员伊佐进一的相关质询时表示，日本政府在政策方针上仍在坚持“无核三原则”；目前正在推进“安保三文件”的修订工作，其中关于“无核三原则”的具体表述“仍有探讨余地”。 《日本经济新闻》将此解读为，高市虽然可能不会改变“无核三原则”本身，但可能调整“安保三文件”中有关这一原则的政策表述。 “无核三原则”指“不拥有、不制造、不运进核武器”。“安保三文件”中的日本《国家安全保障战略》明确写道：“坚持‘无核三原则’的基本方针今后不会改变。” 报道指出，高市在就任首相前长期主张修改“无核三原则”中“不运进核武器”的原则。与自民党共同组成执政联盟的日本维新会在今年6月提出的有关“安保三文件”修改建议中也主张对“不运进核武器”原则“进行符合现实情况的研究”。此外，自今年7月以来，日本防卫大臣小泉进次郎多次在公开场合提出“应不设禁忌地讨论核武器相关政策”。上述一系列动向持续引发日本国内对于高市政府核政策转变的担忧。(新华社)", "ctime": 1792043016, "time_str": "13:43:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261015/c680724252.shtml"}, {"id": "5394487", "title": "首创期货：美国通胀数据施压权益市场，期指全线暴跌", "content": "股市重挫崩盘，大盘跌破支撑，同时一度跌穿3700关口，四大期指全线暴跌，全市场超过五千只个股收跌，算力、存储芯片等前期领涨的科技成长板块成为主要杀跌方向，仅白酒、部分创新药等防御板块相对抗跌。本次下跌属于外部宏观冲击、全球科技资产共振回调叠加内部资金博弈共同引发的短期调整，并非国内基本面出现重大恶化。本次调整最核心的导火索来自美国高于预期的通胀数据，美国9月CPI同比上行幅度超出市场一致预期，推升了市场对于美联储维持高利率、甚至重启加息的交易预期，美债收益率上行压制全球成长股估值。操作上，建议静待行情企稳。（首创期货）", "ctime": 1792042973, "time_str": "13:42:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261015/c680724247.shtml"}, {"id": "5394481", "title": "C919安全运送旅客超840万人次", "content": "中国商飞总经理沈波15日在甘肃敦煌举行的第五届中国支线航空暨国产大飞机事业高质量发展大会上介绍，C919投入商业运营以来，安全运送旅客超840万人次，通航27座城市。“中国商飞持续实施‘边疆快线’等行动，大力拓展C909支线航空网络，为群众出行提供便利选择。”沈波说，C909投入商业运营以来，安全运送旅客超4100万人次。(新华社)", "ctime": 1792042943, "time_str": "13:42:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261015/c680724245.shtml"}, {"id": "5394477", "title": "宽基ETF午后显著放量 多只ETF成交额超昨日全天", "content": "午后宽基ETF显著放量，创业板ETF易方达（159915）成交超71亿，科创50ETF华夏（588000）成交超58亿，沪深300ETF华泰柏瑞（510300）成交超48亿，科创50ETF易方达（588080）、上证50ETF华夏（510050）成交超16亿，均超昨日全天成交额。", "ctime": 1792042940, "time_str": "13:42:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_ 场超5000只个股下跌", "content": "沪指午后跌超2%，深成指跌超2.5%，创业板指跌超3%。煤炭、油气开采及服务、港口航运板块跌幅居前。全市场超5000只个股下跌。", "ctime": 1792040774, "time_str": "13:06:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261015/c680723686.shtml"}, {"id": "5394065", "title": "海光DCU完成阶跃星辰Step 5 Preview开源适配", "content": "9月20日，阶跃星辰正式发布新一代旗舰基座模型Step 5 Preview；10月15日，Step 5 Preview完整权重全面开源。海光DCU在模型权重开源当天即完成Day0推理适配与全流程深度调优。（人民财讯）", "ctime": 1792040737, "time_str": "13:05:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261015/c680723659.shtml"}, {"id": "5394039", "title": "高市早苗将任命武部新接任农林水产大臣", "content": "据日本广播协会15日报道，日本首相高市早苗当天在首相官邸接受媒体采访时表示，将正式任命自民党众议员武部新接替因自身失言等丑闻辞职的梁和生出任农林水产大臣。这是武部新首次入阁。 武部新现年56岁，来自众议院北海道第12选区，已6次当选众议员，历任农林水产副大臣、自民党农林部会会长等职务，曾隶属于自民党原派阀“二阶派”。其父亲武部勤曾担任农林水产大臣、自民党干事长等职务。 前任农林水产大臣梁和生因声称未在选举中支持自己的地方自治体被大幅削减道路预算等言论引发争议，随后又被曝出涉嫌违反日本《公职选举法》等问题，他于14日向高市递交辞呈。 分析认为，高市起用熟悉农林水产行政事务的武部新，希望尽量降低此次大臣辞职风波对国会审议及政权运作的影响。然而，日本共同社指出，在野党准备就梁和生失言事件追究高市的任命责任，预计将对其今后的执政造成冲击。(新华社)", "ctime": 1792040610, "time_str": "13:03:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261015/c680723607.shtml"}, {"id": "5394003", "title": "沪深京三市成交额超1万亿元，较上日此时放量1232亿元", "content": "据同花顺iFinD数据，沪深京三市成交额超1万亿元，较上日此时放量1232亿元，预计全天成交金额约1.6万亿元。截至目前，沪市成交额4635亿元，深市成交额5298亿元，北证50成交额80亿元。", "ctime": 1792040447, "time_str": "13:00:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261015/c680723550.shtml"}, {"id": "5393913", "title": "亚康股份在乌兰察布新设子公司 含云计算相关业务", "content": "企查查APP显示，近日，亚康万玮信息技术（乌兰察布）有限公司成立，经营范围包含云计算装备技术服务；数据处理和存储支持服务；信息技术咨询服务；云计算设备销售等。企查查股权穿透显示，该公司由亚康股份全资持股。（人民财讯）", "ctime": 1792039839, "time_str": "12:50:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261015/c680723281.shtml"}, {"id": "5393911", "title": "美军或使用炸弹之母空袭伊朗", "content": "据美国有线电视新闻网（CNN）今天（10月15日）报道，美国政府消息人士透露，美国军方已经制定了新的对伊朗打击计划，其中包括考虑使用“炸弹之母”（GBU-43/B大型空爆弹）打击伊朗的能源基础设施和核设施。(CCTV国际时讯)", "ctime": 1792039816, "time_str": "12:50:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261015/c680723277.shtml"}, {"id": "5393905", "title": "APEC会议期间深圳倡议错峰出行 新增50条公交地铁接驳专线", "content": "今年11月18日至19日，亚太经合组织（APEC）第三十三次领导人非正式会议将在深圳举办。记者今天（10月15日）获悉，深圳将推出一揽子出行举措。包括：将分区域、分时段、分路段实施临时交通管控，同步倡导绿色出行、居家办公、错峰出行、带薪休假，同时加大公共交通运力调配，最大限度降低对市民日常出行的影响，实现高标准办会和民生服务“双保障”。会议期间，党政机关、事业单位、国有企业除保障任务车辆外，公务及国企公车按90%比例暂停使用。地铁方面视情况加密班次、延长运营时间；新增50条公交地铁接驳专线，公交整体运力提升20%。会议期间地铁、公交执行票价五折优惠。交通管控措施将梯次发布。11月16日至20日会议当周，倡导企业结合自身实际，与职工协商采取灵活工作模式。可安排居家远程办公；确需到岗人员，推行错峰、弹性上下班；也可结合职工意愿统筹安排带薪年休假，兼顾企业经营与职工权益。（央视新闻）", "ctime": 1792039455, "time_str": "12:44:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261015/c680723133.shtml"}, {"id": "5393863", "title": "挪威斯瓦尔巴种子库新增逾1.6万份样本", "content": "挪威政府14日发布消息说，来自世界各地21家基因库的超过1.6万份种子样本日前被存入位于挪威北部的斯瓦尔巴全球种子库，以保护全球农作物遗传多样性，助力粮食安全。挪威农业与食品部表示，此次种子存储活动于13日举行，参与机构包括多个国家的农业研究机构和国际基因库。其中，国际农业研究磋商小组（CGIAR）旗下6家基因库共存入8917份种子样本，涵盖小麦、玉米、水稻等农作物。意大利农业研究与经济委员会首次参与，存入包括传统小麦和水稻品种在内的种子样本。此外，乌克兰向该种子库存入773份种子样本，包括荞麦等农作物品种，以保护其农业遗传资源。（新华社）", "ctime": 1792038525, "time_str": "12:28:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261015/c680722700.shtml"}, {"id": "5393861", "title": "我国太空算力网持续“扩容”", "content": "10月14日，全球首个太空计算星座——“星算”计划的02组算力卫星成功发射升空并完成首次组网。随着8颗卫星的加入，“星算”星座在轨总算力达到50P，相当于每秒可在太空中进行5亿亿次运算。该星座采用“云边协同”分布式结构，既可分别处理任务，也可协同完成复杂计算，将算力利用效率发挥到极致。未来，“星算”计划将建成由2800颗计算卫星组成的太空计算网络，覆盖全球陆海空天。（央视新闻）", "ctime": 1792038503, "time_str": "12:28:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261015/c680722680.shtml"}, {"id": "5393843", "title": "格陵兰岛官员否认美国即将上岛大规模勘探", "content": "针对美国总统特朗普14日关于美国即将在格陵兰岛进行大规模石油、天然气和矿产资源勘探的言论，格陵兰岛官员表示，距离开展这些活动“还早”。与此同时，丹麦外交部表示，美国、丹麦及其自治领地格陵兰岛9月签署的协议并未给予美国在获取格陵兰岛自然资源方面任何优待。格陵兰岛矿业部副部长约恩·哈梅肯-霍尔姆称，的确有美国企业在该岛开展小型勘探活动，但“离大规模勘探还早”。（央视新闻）", "ctime": 1792037594, "time_str": "12:13:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261015/c680722263.shtml"}, {"id": "5393833", "title": "港股午评：恒生指数跌1.47%，恒生科技指数跌2.94%", "content": "港股午间收盘，恒生指数跌1.47%，恒生科技指数跌2.94%。大型科网股走弱，阿里巴巴、百度集团跌近5%，美团跌近3%，京东集团跌近2%。", "ctime": 1792037049, "time_str": "12:04:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261015/c680721994.shtml"}, {"id": "5393803", "title": "10月15日午间公告一览：凌霄泵业使用闲置自有资金购买理财产品", "content": "凌霄泵业公告，2026年10月13日，公司使用闲置自有资金人民币22,000.00万元向招商银行股份有限公司（简称“招商银行”）购买了名为“招商银行聚益生金系列公司（35天）B款理财计划【产品代码：99035】”的非保本型理财产品，该理财产品到期日为2026年11月17日。", "ctime": 1792036770, "time_str": "11:59:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261015/c680721878.shtml"}, {"id": "5393801", "title": "港股恒生科技指数跌幅达3%", "content": "港股恒生科技指数跌幅扩大至3%，恒生指数现跌1.51%。", "ctime": 1792036603, "time_str": "11:56:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261015/c680721817.shtml"}, {"id": "5393799", "title": "大连市交通运输局原党组书记、局长王少成严重违纪违法被开除党籍", "content": "大连市纪委监委15日通报，日前，经大连市委批准，大连市纪委监委对大连市交通运输局原党组书记、局长王少成严重违纪违法问题进行了立案审查调查。经查，王少成丧失理想信念，背弃初心使命，私自存放并阅看具有严重政治问题的资料；无视中央八项规定精神，收受可能影响公正执行公务的礼品、礼金；违反组织原则，不如实报告个人有关事项，在职务晋升方面为他人谋取利益；以高于市场价格向管理和服务对象出售房产获利；工作失察失管，导致财政资金损失；纪法底线失守，利用职务上的便利，为他人在业务承揽、款项拨付等方面谋取利益，并非法收受财物。王少成严重违反党的政治纪律、组织纪律、廉洁纪律和工作纪律，构成严重职务违法并涉嫌受贿犯罪，且在党的十八大后不收敛、不收手，性质严重，影响恶劣，应予严肃处理。依据《中国共产党纪 // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片

    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },

  container.innerHTML = kpis.map(k => `

      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
