<style>
:root {
  --bg-primary: #0a0e17;

* { margin:0; padding:0; box-sizing:border-box; }
body {

  background: var(--bg-primary);
  color: var(--text-primary);
  min-height: 100vh;
}
.mono { font-family: 'JetBrains Mono', monospace; }
.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 20px;
  transition: all 0.2s;
}
.card:hover { background: var(--bg-card-hover); border-color: #334155; }
.badge {
  display: inline-flex; align-items: center; padding: 2px 8px;
  border-radius: 6px; font-size: 12px; font-weight: 500;
}
.badge-s { background: rgba(239,68,68,0.2); color: #ef4444; }

.badge-c { background: rgba(100,116,139,0.2); color: #94a3b8; }
.score-bar {
  height: 6px; border-radius: 3px; background: #1e293b; overflow: hidden;
}
.score-bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s; }
.up { color: var(--red); }
.down { color: var(--green); }
.pulse { animation: pulse 2s infinite; }
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}
.glow { box-shadow: 0 0 20px rgba(59,130,246,0.15); }
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg-primary); }
::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
</style>

              <th class="text-right py-2 px-1">板块</th>
              <th class="text-right py-2 px-1">连涨</th>
            </tr>
          </thead>
          <tbody id="picks-table"></tbody>
        </table>

    </div>
  </div>
</div>

山博玺数据科技有限公司100%股权，交易对价为1.93亿元。本次交易完成后，博玺数据将纳入公司合并报表范围。", "ctime": 1789475277, "time_str": "20:27:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260915/c679935734.shtml"}, {"id": "5177979", "title": "上海量子科技企业达80余家 全链条产业生态加速成型", "content": "在2026浦江创新论坛・量子智算与精测专题论坛上，上海市科学技术委员会副主任屈炜表示，上海的量子科技相关企业已达80余家，基本形成了涵盖上游装备与材料、中游整机以及下游软件算法与应用的产业布局。相关专家在论述上表示，全球量子科技竞争正从单点技术比拼转向产业生态的综合较量，从核心器件的自主突破到制造工艺的成熟落地，从算法框架的持续创新到产业链路的协同打通，上海已率先完成政策、平台、资本、人才的体系化布局，依托三大核心优势构建全链条产业生态，向着全球量子算力产业价值转化高地加速冲刺。（科创板日报）", "ctime": 1789474746, "time_str": "20:19:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260915/c679935537.shtml"}, {"id": "5177973", "title": "巴基斯坦与黎巴嫩同意加强安全及反恐合作", "content": "当地时间15日，巴基斯坦内政部长穆赫辛·纳克维在首都伊斯兰堡会见到访的黎巴嫩内政部长哈贾尔。双方重点就加强安全、反恐、禁毒、打击非法移民、反洗钱和网络犯罪等领域合作进行讨论，并同意加强两国警察学院及人员培训方面的交流合作。双方同意通过情报共享共同打击恐怖主义和贩毒犯罪，应对新出现的安全挑战，并将尽快推动两国内政部门签署合作谅解备忘录，同时指定联络人以加强双边协调。两国内政部长表示，将进一步加强巴基斯坦与黎巴嫩双边关系，拓展内部安全等共同关心领域的合作。（央视新闻）", "ctime": 1789474710, "time_str": "20:18:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260915/c679935524.shtml"}, {"id": "5177961", "title": "鼎泰高科：子公司拟7亿元投建先进新材料制造基地项目主要从事织布磨刷玻璃镀膜等产品的研发生产", "content": "鼎泰高科公告称，公司全资子公司东莞市鼎泰鑫电子有限公司拟与东莞市厚街镇人民政府签订投资协议，投资建设“鼎泰鑫先进新材料制造基地项目”，项目投资总额7亿元，其中固定资产投资5.6亿元。项目位于厚街镇TOD片区，总用地面积约64亩，主要从事织布磨刷、陶瓷磨刷、刷磨轮、功能性膜产品及玻璃镀膜等产品的研发生产。本次投资旨在扩充公司在高端电子材料领域产能，与现有PCB精密刀具业务形成协同效应。", "ctime": 1789474626, "time_str": "20:17:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260915/c679935484.shtml"}, {"id": "5177945", "title": "美国至8月29日当周ADP就业人数周度变动1.625万人，前值1.2万人", "content": "美国至8月29日当周ADP就业人数周度变动1.625万人，前值1.2万人。", "ctime": 1789474547, "time_str": "20:15:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260915/c679935460.shtml"}, {"id": "5177897", "title": "宁德时代：全资子公司拟11.2亿元参与投资创业投资基金", "content": "宁德时代公告，公司全资子公司宁波问鼎拟作为有限合伙人参与投资厦门时代怡远创业投资基金合伙企业，认缴出资11.2亿元，持有基金19.4175%的认缴比例。公司控股股东厦门瑞庭亦作为有限合伙人参与该基金投资，因此本次投资构成关联共同投资。厦门瑞庭目前持有公司10.2亿股A股股份，占公司总股本的22.04%。", "ctime": 1789474380, "time_str": "20:13:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260915/c679935299.shtml"}, {"id": "5177883", "title": "国家药监局局长黄果会见美国盖茨基金会全球健康总裁特雷弗·蒙代尔", "content": "9月15日下午，国家药监局局长黄果在京会见了来访的美国盖茨基金会全球健康总裁特雷弗·蒙代尔一行。蒙代尔称赞中国药品监管改革取得的进展，肯定盖茨基金会与国家药监局合作的积极成果，并期待与国家药监局建立更加长期、稳定的合作关系，继续支持中国药品监管体系能力建设和全球卫生合作。（界面新闻）", "ctime": 1789474320, "time_str": "20:12:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260915/c679935275.shtml"}, {"id": "5177873", "title": "报道称字节跳动上半年营收同比增长30% 达到1200亿美元", "content": "据报道，字节跳动上半年营收同比增长30%，达到1200亿美元；今年上半年净利润下降至200亿美元，因公司加快了对人工智能的投资。（财联社）", "ctime": 1789474263, "time_str": "20:11:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260915/c679935258.shtml"}, {"id": "5177871", "title": "启明信息：一汽股份与广汽集团合作事项不涉及公司", "content": "启明信息公告，公司股票9月14日、9月15日连续2个交易日收盘价格涨幅偏离值累计超过20%，属于股票交易异常波动。针对市场关注的一汽股份与广汽集团签署《意向协议》事项，公司表示未参与相关事项的筹划、商谈及协议签署，该合作事项不涉及公司，公司2026年上半年与广汽集团及其关联方未发生业务往来。公司2025年网络安全业务收入占营业收入比例为5.08%，目前经营平稳，不存在应披露未披露的重大合同或新增订单；具身智能方面，公司主要探索其在制造业场景的规模化应用，并非从事具身智能机器人软硬件开发设计或生产制造，目前尚未形成商业化应用。", "ctime": 1789474261, "time_str": "20:11:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260915/c679935257.shtml"}, {"id": "5177855", "title": "初灵信息：控股股东累计减持633.9972万股 本次减持计划实施完毕", "content": "初灵信息公告，公司控股股东洪爱金于6月29日至9月15日期间，通过集中竞价及大宗交易方式累计减持633.9972万股，占扣除回购账户股份后总股本的2.9973%。其中，9月14日至9月15日通过大宗交易减持192.5万股，占比0.9101%。截至目前，本次减持计划已实施完毕。", "ctime": 1789474145, "time_str": "20:09:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260915/c679935141.shtml"}, {"id": "5177831", "title": "星华新材：股东询价转让价格初步确定为19.21元/股", "content": "星华新材公告，根据9月15日询价申购情况，本次股东询价转让价格初步确定为19.21元/股。共有19家机构投资者参与报价，合计有效认购955万股，对应有效认购倍数5.61倍。本次拟转让股份已获全额认购，初步确定受让方为4名机构投资者，拟受让股份总数为170.25万股。此次询价转让不属于通过二级市场减持，受让方所受让股份在受让后6个月内不得转让。", "ctime": 1789473988, "time_str": "20:06:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260915/c679935043.shtml"}, {"id": "5177789", "title": "锦富技术：子公司拟10.14亿元投建新材料东部生产基地", "content": "锦富技术公告，公司全资子公司上海金锦富已在上海金山区设立项目实施主体金山金锦富，推进“新材料东部生产基地项目”。金山金锦富拟购买46666.93平方米工业用地使用权，挂牌起始价7842万元，并拟与上海碳谷绿湾产业园管理委员会签订产业合作协议。该项目计划总投资约10.14亿元，其中固定资产投资总额不低于7.61亿元，主要建设无氟胶黏剂、电子粘结剂、热管理冷却液等产能。项目资金拟通过自有、自筹资金及银行项目贷款等方式解决。", "ctime": 1789473831, "time_str": "20:03:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260915/c679934971.shtml"}, {"id": "5177781", "title": "华为发布全球首个3D数据中心", "content": "华为今日发布全球首个3D数据中心，发行《3D数据中心》专著书籍，并开放《3D数据中心概要设计图库》。3D数据中心借鉴芯片工厂“动力层”与“生产层”严格分离的理念，将传统数据中心水平部署的各个功能空间垂直叠加，形成从下往上的供冷层、IT设备层、供电层、备电层的四层架构。 华为副董事长、轮值董事长汪涛表示，十万亿参数大模型和高速增长的Token需求对AI基础设施提出更高要求，十万卡以上的昇腾超节点集群将成为基础配置。3D数据中心通过分层解耦、立体堆叠支撑昇腾超节点集群的超级算力工厂。 (科创板日报)", "ctime": 1789473816, "time_str": "20:03:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260915/c679934963.shtml"}, {"id": "5177611", "title": "高端MLCC是买的海外产品回来贴牌？风华高科回应：公司拥有自主开发生产销售高端产品能力", "content": "9月15日，有投资者在风华高科的业绩说明会上提问，目前很多在自媒体提到贵厂的高端MLCC是买的海外产品回来贴牌的请问这个事情属实吗？风华高科回复称，公司深耕电子元件行业四十余年，拥有自主开发生产销售高端产品能力，同时公司近年来持续加大研发投入，主营产品技术水平持续突破，高端产品占比稳步提升，请各位投资者注意甄别各类信息的真实性、准确性，切勿轻信非官方渠道发布的传闻。（人民财讯）", "ctime": 1789473586, "time_str": "19:59:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260915/c679934850.shtml"}, {"id": "5177583", "title": "奕东电子：拟1.16亿元收购深圳冠鼎29%股权持股比例将升至80%", "content": "奕东电子公告，公司拟以1亿元收购梁立壮持有的深圳冠鼎25%股权，并以1600万元收购邱万盛持有的深圳冠鼎4%股权，交易对价合计1.16亿元。本次收购完成后，公司对深圳冠鼎的持股比例将提升至80%，公司合并报表范围不变。本次交易不构成关联交易及重大资产重组，无需提交股东会审议。", "ctime": 1789473473, "time_str": "19:57:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260915/c679934815.shtml"}, {"id": "5177575", "title": "世纪恒通：控股股东及董事拟合计减持不超2.99%公司股份", "content": "世纪恒通公告，公司控股股东、实际控制人、董事长杨兴海计划自公告披露之日起15个交易日后的3个月内，通过集中竞价、大宗交易方式减持不超过253.15万股，占剔除回购专用证券账户后总股本的2.57%；公司董事、总经理杨兴荣拟减持不超过42.75万股，占比0.43%。两人合计拟减持不超过295.90万股，占比不超过2.99%。", "ctime": 1789473354, "time_str": "19:55:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260915/c679934781.shtml"}, {"id": "5177553", "title": "荣耀MagicOS 11发布 CEO李健：AI正重写手机操作系统未来", "content": "9月15日晚，荣耀开发者大会上，荣耀发布实现系统级Agent Harness商用落地的手机操作系统MagicOS 11。据介绍，荣耀MagicOS 11能理解用户复杂意图，还能记住用户日常习惯，将“自动执行”与“主动服务”融为一体。荣耀CEO李健在会上表示，AI正在重写手机操作系统未来。（人民财讯）", "ctime": 1789473190, "time_str": "19:53:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260915/c679934375.shtml"}, {"id": "5177527", "title": "江天化学：南通江山农药化工股份有限公司拟减持公司不超过3.00%股份", "content": "江天化学公告，持股5%以上股东南通江山农药化工股份有限公司持有公司869.76万股，占公司总股本6.02%，拟于本减持计划公告发布之日起15个交易日后的3个月内，通过集中竞价或大宗交易合计减持不超过433.08万股，占公司总股本3.00%。其中，集中竞价减持不超过144.36万股，大宗交易减持不超过288.72万股，减持原因为自身资金需求。", "ctime": 1789472991, "time_str": "19:49:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260915/c679934114.shtml"}, {"id": "5177503", "title": "意华股份：公司近期经营情况正常", "content": "意华股份公告，公司股票于2026年9月11日、2026年9月14日、2026年9月15日连续三个交易日收盘价格涨幅偏离值累计超过20%，构成股票交易异常波动。经核查，公司近期经营情况正常，内外部经营环境未发生重大变化，前期披露信息无需更正或补充；股票异常波动期间，控股股东不存在买卖公司股票行为。", "ctime": 1789472765, "time_str": "19:46:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260915/c679934034.shtml"}, {"id": "5177491", "title": "9月15日 周二《新闻联播》要闻17条", "content": "1、习近平给福建省“漳州110”全体队员回信强调 坚守为民初心矢志担当奉献 做党和人民的忠诚卫士；\n2、央视快评：用心用情为群众排忧解难 兢兢业业守护万家灯火；\n3、【新思想引领新征程】通江达海 西部陆海新通道拓展开放新空间；\n4、8月我国国民经济运行总体平稳；\n5、2030年电子信息制造业规上企业营业收入将突破30万亿元；\n6、1至8月我国乡村建设已落实项目资金超1300亿元；\n7、8月份一二三线城市商品住宅销售价格同比降幅继续收窄；\n8、前8个月我国碳排放权交易市场累计成交近10亿吨；\n9、两部门对在线酒店预订平台服务行业开展行政指导；\n10、我国将试行医疗服务价格预立项制度；\n11、前8个月我国牵头制定可穿戴电子设备等国际标准214项；\n12、2026上合组织数字经济论坛举行；\n13、民营火箭首次执行规模化卫星互联网星座组网任务；\n14、美称对谈判持开放态度 伊朗称其条件被满足前不会与美谈判 美国防部报告称美在中东基地损失严重；\n15、也门胡塞武装称打击沙特空军基地；\n16、俄称多方向推进 又控制3处居民点；\n17、美10年期国债收益率达2007年以来新高。（央视新闻）", "ctime": 1789472718, "time_str": "19:45:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260915/c679934016.shtml"}, {"id": "5177487", "title": "北方长龙：陈跃等股东拟询价转让4.50%股份", "content": "北方长龙公告，陈跃、宁波中铁长龙投资有限公司、宁波华跃自有资金投资合伙企业（有限合伙）拟通过询价转让合计428.4万股，占公司当前总股本4.50%，原因为自身资金需求。其中，陈跃拟转让77万股，长龙投资拟转让331.94万股，宁波华跃拟转让19.46万股。本次转让不通过集中竞价交易或大宗交易，不属于通过二级市场减持；受让股份在受让后6个月内不得转让。", "ctime": 1789472662, "time_str": "19:44:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260915/c679933997.shtml"}, {"id": "5177483", "title": "同程旅行：坚决落实在线酒店预订平台服务行业合规要求，反对“内卷式”的恶性竞争", "content": "9月15日，市场监管总局会同文化和旅游部召开在线酒店预订平台服务行业行政指导会。随后，同程旅行发文表态：坚决拥护行政指导会的相关要求，并将积极推动落实，全力保障消费者和合作伙伴的合法权益，切实维护公平有序的市场环境。同程旅行坚决反对“内卷式”的恶性竞争。同程旅行将在有关部门的指导下，继续完善平台规则，维护酒店商家的自主经营权，杜绝排他性独家合作和“全网最低价”，助力实体经济有序健康发展。（界面新闻）", "ctime": 1789472654, "time_str": "19:44:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260915/c679933995.shtml"}, {"id": "5177481", "title": "艾德生物HRD试剂盒获得欧盟IVDR认证", "content": "9月15日，艾德生物宣布，公司自主研发的AmoyDxHRD Complete Panel已获得欧盟公告机构TUV南德意志集团颁发的《体外诊断医疗器械法规》（IVDR）认证，可作为伴随诊断产品，用于辅助识别转移性去势抵抗性前列腺癌(mCRPC）患者中携带BRCA1/2基因突变（胚系和/或体细胞突变）的患者，帮助筛选既往接受过包含新型激素类药物治疗且疾病进展、可能适合接受奥拉帕利单药治疗的患者。（人民财讯）", "ctime": 1789472624, "time_str": "19:43:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260915/c679933983.shtml"}, {"id": "5177461", "title": "小鹏全球首座兆瓦闪充站投入运营", "content": "9月15日，香港首座对外开放的兆瓦闪充站正式投入运营，该站由小鹏集团携手Halo共同建设，同时也是小鹏集团全球首座X- Energy兆瓦闪充站，标志小鹏自研兆瓦闪充技术全球首次落地，并面向全品牌车主开放。（人民财讯）", "ctime": 1789472467, "time_str": "19:41:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260915/c679933933.shtml"}, {"id": "5177451", "title": "气派科技：向特定对象发行股票获证监会同意注册", "content": "气派科技公告，公司近日收到中国证监会同意向特定对象发行股票注册的批复，要求严格按照报送上海证券交易所的申报文件和发行方案实施，并在批复作出十个工作日内完成发行缴款。", "ctime": 1789472329, "time_str": "19:38:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260915/c679933894.shtml"}, {"id": "5177323", "title": "星展银行中国新总部正式入驻上海金茂大厦", "content": "9月15日，星展银行在上海金茂大厦举行中国新总部的启用仪式。星展银行表示，新总部将所有业务部门汇聚于这一标志性地点，进一步强化了星展银行“One bank（一个银行）”的核心战略。（界面新闻）", "ctime": 1789471730, "time_str": "19:28:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260915/c679933597.shtml"}, {"id": "5177281", "title": "万科2027年到期美元债势创3个月最大跌幅", "content": "万科2027年11月到期美元债势创2026年6月10日以来最大跌幅。截至香港时间下午7:15，该公司3.975%债券每1美元跌1美分，至53.1美分2029年11月到期的3.5%债券每1美元跌0.9美分，至49美分。（蓝鲸新闻）", "ctime": 1789471351, "time_str": "19:22:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260915/c679933412.shtml"}, {"id": "5177279", "title": "郑栅洁主任主持召开民营企业座谈会 围绕优化发展环境、拓展投资空间听取意见建议", "content": "9月15日，国家发展改革委主任郑栅洁主持召开民营企业座谈会，围绕优化发展环境、拓展投资空间听取意见建议。来自电气设备、算力基础设施、文化旅游服务、养老服务、商业航天领域的德力西集团、润泽科技、清明上河园、瑞芝康健、蓝箭航天等5家企业负责人参加座谈会。参会企业负责人紧扣会议主题踊跃发言、积极建言。大家普遍认为，今年以来，国家坚持扩大内需这个战略基点，积极促进有效投资，加快政府投资资金投放，有力推进“两重”建设和“两新”工作，积极支持民营企业参与重大工程项目建设，为企业扩大投资、提质发展营造了良好政策环境。同时，企业还结合经营现状、行业发展和投资计划，就进一步开放应用场景、优化审批流程、拓宽融资渠道、盘活存量资产、强化要素保障、健全标准体系等方面提出意见建议。（国家发展改革委）", "ctime": 1789471305, "time_str": "19:21:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260915/c679933411.shtml"}, {"id": "5177275", "title": "金龙汽车与厦门国有资本公司签署战略合作协议", "content": "近日，金龙汽车与厦门国有资本运营有限责任公司（简称“厦门国有资本公司”）正式签署战略合作协议。根据协议，双方将以新能源商用车领域为合作核心，推动资本运营与实体制造高效协同。(人民财讯)", "ctime": 1789471238, "time_str": "19:20:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260915/c679933392.shtml"}, {"id": "5177273", "title": "东北制药：依非韦伦片新增0.2g规格获批", "content": "东北制药公告，公司全资子公司东北制药集团沈阳第一制药有限公司收到国家药品监督管理局核准签发的《药品补充申请批准通知书》，依非韦伦片本次申请增加0.2g规格获批，核发药品批准文号国药准字H20269225，有效期至2031年03月22日。", "ctime": 1789471175, "time_str": "19:19:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260915/c679933368.shtml"}, {"id": "5177271", "title": "*ST八钢：向特定对象发行A股股票申请获上交所受理", "content": "*ST八钢公告，公司于2026年9月15日收到上交所出具的受理通知，向特定对象发行A股股票申请文件齐备，符合法定形式，获上交所受理并依法审核。本次发行尚需上交所审核通过，并获得中国证监会同意注册的决定后方可实施。", "ctime": 1789471160, "time_str": "19:19:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260915/c679933366.shtml"}, {"id": "5177195", "title": "康为世纪：子公司获第8张消化道病原体Ⅲ类证", "content": "康为世纪公告，公司全资子公司江苏健为诊断科技有限公司自主研发的艰难梭菌tpi和毒素A、毒素B基因检测试剂盒（荧光PCR法）近日获得国家药品监督管理局颁发的Ⅲ类《医疗器械注册证（体外诊断试剂）》，注册证批准及生效日期为2026年9月14日，系公司取得的第8张用于消化道病原体检测的Ⅲ类医疗器械注册证。", "ctime": 1789470711, "time_str": "19:11:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "sou const META     = {"update_time": "2026-09-15 20:37:33", "sentiment_score": 53.76984126984127, "agents": []};

// 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

        <p class="text-xs text-gray-500 mono">${item.symbol}</p>

      <span class="text-xs text-gray-400">${item.mentions}次提及</span>

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
