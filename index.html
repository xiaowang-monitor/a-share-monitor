435107, "time_str": "19:31:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260903/c679576202.shtml"}, {"id": "5101975", "title": "信立泰：2026年9月3日更新递交H股发行上市申请", "content": "信立泰公告，公司正在申请发行境外上市股份（H股）并在香港联交所主板挂牌上市。公司于2026年9月3日向香港联交所更新递交本次发行上市申请，并于同日在香港联交所网站刊登更新申请资料。", "ctime": 1788435092, "time_str": "19:31:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260903/c679576163.shtml"}, {"id": "5101963", "title": "德国多家机构上调2026年经济增长预期", "content": "德国多家主要经济研究机构3日发布秋季预测，上调2026年德国经济增长预期，并认为出口回暖和政府支出增加正推动经济逐步复苏。 德国慕尼黑经济研究所预计，今年德国国内生产总值将增长1.4%，高于夏季预测的0.8%；同时将2027年经济增长预期由此前0.8%上调至1.2%。该机构认为，中东战事导致能源价格大幅上涨，加之内河水位偏低，拖累了德国经济；但海外工业需求增加以及政府扩大基础设施、国防等领域支出，在一定程度上抵消了这些负面影响。 德国基尔世界经济研究所和莱布尼茨经济研究所分别预计，今年德国经济将增长1.3%，较此前预期上调0.5个百分点。这两家机构均指出，此次上调主要受外贸推动，上半年德国出口增长超预期。 基尔世界经济研究所指出，德国出口在连续三年下滑后，预计2026年将增长3.8%，但仍难以弥补此前损失。莱布尼茨经济研究所认为，近期出口强劲增长一定程度上是受美国关税冲击后的追赶效应等短期因素推动，并不意味着德国企业国际竞争力已出现根本改善，预计下半年出口增速或再次放缓。 机构分析认为，尽管德国经济增长前景有所改善，但复苏基础仍较脆弱。(新华社)", "ctime": 1788435081, "time_str": "19:31:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260903/c679576155.shtml"}, {"id": "5101873", "title": "每日互动：向特定对象发行股票申请获同意注册，批复有效12个月", "content": "每日互动公告，公司此前推进向特定对象发行股票事项，近日收到中国证监会同意注册批复，同意公司向特定对象发行股票的注册申请；批复自同意注册之日起12个月内有效，公司将按发行方案办理相关事宜。", "ctime": 1788434858, "time_str": "19:27:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260903/c679576069.shtml"}, {"id": "5101859", "title": "国开行：2026年新型政策性金融工具已实现首批项目4.6亿元资金投放", "content": "记者今天（3日）从国家开发银行了解到，国开行已于9月2日实现2026年新型政策性金融工具对首批3个民间投资和民间资本参与项目4.6亿元投放，全部用于补充项目资本金，支持重大项目建设，加大对民间投资项目支持力度。新型政策性金融工具是由国家开发银行、中国进出口银行、中国农业发展银行三家政策性银行设立，通过发行金融债券等方式筹集资金，专项用于补充国家战略基础设施项目和特定产业重大项目资本金缺口的特殊金融工具。2026年新型政策性金融工具规模由2025年的5000亿元扩容到8000亿元，预计可撬动8万亿元到11万亿元的总投资。（央视新闻）", "ctime": 1788434835, "time_str": "19:27:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260903/c679576050.shtml"}, {"id": "5101757", "title": "内蒙古自治区乌兰察布市委书记周凯接受纪律审查和监察调查", "content": "据内蒙古自治区纪委监委消息：内蒙古自治区乌兰察布市委书记周凯涉嫌严重违纪违法，目前正接受内蒙古自治区纪委监委纪律审查和监察调查。", "ctime": 1788434311, "time_str": "19:18:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260903/c679575200.shtml"}, {"id": "5101671", "title": "三安光电：实际控制人林秀成、副董事长兼总经理林科闯仍在留置中", "content": "三安光电公告，2026年9月3日收盘价格上涨9.98%。截至公告披露日，公司生产经营情况正常。2026年上半年度实现营业收入64.68亿元，同比下降28.04%；归属于上市公司股东的净利润亏损9790.45万元，扣除非经常性损益的净利润亏损5.04亿元。实际控制人林秀成、副董事长兼总经理林科闯仍在留置中；三安电子和三安集团持有公司股份13.12亿股已被司法冻结，累计被轮候冻结股份70.31亿股。", "ctime": 1788433995, "time_str": "19:13:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260903/c679575114.shtml"}, {"id": "5101653", "title": "鑫宏业：拟发行可转债募资不超11亿元", "content": "鑫宏业公告，公司拟向不特定对象发行可转换公司债券，募集资金总额不超过11亿元（含发行费用），扣除发行费用后用于轻量化金属复合导体线缆研发及产业化项目等项目及补充流动资金。本次发行尚待公司股东会审议及深圳证券交易所发行上市审核并报经中国证监会注册。", "ctime": 1788433831, "time_str": "19:10:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260903/c679575035.shtml"}, {"id": "5101647", "title": "圣诺生物：全资子公司利那洛肽胶囊获注册证书", "content": "圣诺生物公告，公司全资子公司成都圣诺生物制药有限公司于近日收到国家药品监督管理局签发的利那洛肽胶囊《药品注册证书》。该药品规格为290μg，注册分类为化学药品4类，获批准注册并发给药品注册证书。", "ctime": 1788433820, "time_str": "19:10:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260903/c679575029.shtml"}, {"id": "5101615", "title": "报告：全球AI算力狂飙加剧水资源压力 “水能协同”成绿色算力竞争新赛道", "content": "一份最新发布题为《AI时代算力基础设施流体系统水能绿色发展报告》的行业研究报告指出，随着人工智能技术的爆发式增长，算力基础设施快速扩张正在加剧能源与水资源供给压力。“水资源利用效率与算力规模扩张速度不匹配，进一步放大局部地区水资源供需矛盾。”报告认为，AI时代的核心竞争力已从单纯比拼算力规模，转向了算力、能源与水资源协同利用能力的综合较量。报告首次提出了流体系统“架构层—设备层—平台层”三层技术能力体系，以及分布式按需输配、泄漏风险分级、余热回收利用、智能泵控协同、多层冗余容错、数据闭环调控和介质全生命周期管理七项核心技术主张，为算力中心从单点节能向系统优化演进提供了清晰的技术路径。报告强调，算力基础设施的绿色发展重点，已从单一能效优化，扩展到算力增长、资源利用和运行韧性的协同平衡。未来行业竞争的关键，在于能否以更少的能源和水资源消耗支撑更多的算力增长。 (澎湃新闻)", "ctime": 1788433720, "time_str": "19:08:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260903/c679574994.shtml"}, {"id": "5101603", "title": "“Token贷”兴起 银行竞逐算力金融赛道", "content": "中国经济信息社刊发的《中经社信号|“Token贷”兴起 银行竞逐算力金融赛道》报道称，近期，广东省首个词元经济专项金融产品“Token贷”在广州市海珠区落地，中国银行广州分行为相关企业授信约2800万元。此外，建设银行、农业银行、江苏银行、上海农商银行、张家港农商银行等也纷纷落地算力相关信贷产品，将算力算效、词元（Token）消耗等纳入授信评价。（中国经济信息社）", "ctime": 1788433649, "time_str": "19:07:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260903/c679574898.shtml"}, {"id": "5101591", "title": "前7个月我国服务进出口总额同比增长8.3%", "content": "商务部3日发布数据显示，今年1至7月，我国服务进出口总额44467.1亿元，同比增长8.3%。数据显示，1至7月，我国服务出口17732.3亿元，同比增长17.1%；服务进口26734.8亿元，同比增长3.2%。服务贸易逆差9002.5亿元，同比缩小1763.3亿元。具体来看，旅行和运输服务出口对整体服务出口增长的贡献率超过50%。1至7月，旅行服务出口2636.1亿元，同比增长27.7%；运输服务出口3632.3亿元，同比增长27.1%。旅行和运输服务出口对整体服务出口增长的贡献率分别为22.1%和29.9%。知识密集型服务出口占比超过一半。1至7月，知识密集型服务进出口19606.2亿元，同比增长6.6%，占服务进出口总额的44.1%。知识密集型服务出口9482.8亿元，同比增长12.2%，占服务出口额的53.5%。（新华社）", "ctime": 1788433611, "time_str": "19:06:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260903/c679574882.shtml"}, {"id": "5101549", "title": "燧原科技中签号出炉", "content": "燧原科技发布首次公开发行股票并在科创板上市网下初步配售结果及网上中签结果公告，中签号码共有20,657个，每个中签号码只能认购500股燧原科技A股股票。中签结果见配图如下：", "ctime": 1788433437, "time_str": "19:03:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260903/c679574848.shtml"}, {"id": "5101521", "title": "Snowflake美股盘前涨超25%", "content": "Snowflake美股盘前涨超25%，现报383.0美元。", "ctime": 1788433386, "time_str": "19   if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
