的一则帖文，引起了不少中外网民的关注。让人有些意外的是，她对深圳最感兴趣的是当地的垃圾焚烧发电项目。“辛鲍姆总统指派我前往这些设施参观考察，学习相关经验并在墨西哥落地应用”，巴尔塞纳在一则帖文中写道，“中国的实践成果十分突出：2005年至2024年间，中国城市生活垃圾的能源化利用率从9.8%提升至84.6%，填埋处置占比则从85%降至5%。”(环球时报)", "ctime": 1794844274, "time_str": "23:51:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261116/c681878484.shtml"}, {"id": "5680099", "title": "日竭力拉民企入局加快催熟军工业", "content": "日本政府不断突破“专守防卫”原则，推动在年内修订“安保三文件”。共同社11月16日披露了日本政府为配合修订“安保三文件”而制定的“防卫产业基础战略”部分概要内容——其中，为了强化应对长期战争的“持续作战能力”，日本政府拟写入所谓“预备生产力”的理念，也就是平时生产民用产品的工厂在“突发事态”下转为生产防卫装备，并计划创设支援制度，向相关合作企业提供贷款和补助。(CCTV国际时讯)", "ctime": 1794843937, "time_str": "23:45:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261116/c681878479.shtml"}, {"id": "5680095", "title": "波黑新一届主席团成员宣誓就职", "content": "当地时间11月16日，波黑新一届主席团在首都萨拉热窝举行宣誓就职典礼，中央选举委员会向新当选的3位主席团成员热莉卡·茨维亚诺维奇、达里亚娜·菲利波维奇和戴尼斯·贝契罗维奇颁发证书，三人宣读并签署就职誓言。10月4日波黑大选中，三人分别代表波什尼亚克族、克罗地亚族、塞尔维亚族当选。波黑宪法规定，主席团由三族各1名代表组成，任期4年，主席为轮值制，每8个月轮换。（央视新闻）", "ctime": 1794843895, "time_str": "23:44:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261116/c681878477.shtml"}, {"id": "5680037", "title": "习近平致电祝贺波黑新一届主席团成员就职", "content": "11月16日，国家主席习近平致电热莉卡·茨维亚诺维奇、戴尼斯·贝契罗维奇、达丽娅娜·菲利波维奇，祝贺他们就任波黑主席团成员。(新华社)", "ctime": 1794843307, "time_str": "23:35:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261116/c681878462.shtml"}, {"id": "5680023", "title": "伊朗称多艘油轮在霍尔木兹海峡触雷", "content": "伊朗伊斯兰革命卫队和伊朗海军11月16日称，多艘油轮在霍尔木兹海峡触雷。伊朗方面强调，“关闭导航系统且未经伊朗授权擅自进入限制区域或不安全海域，会使违规船只面临严重风险。(CCTV国际时讯)", "ctime": 1794843048, "time_str": "23:30:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261116/c681878456.shtml"}, {"id": "5680013", "title": "专家说金 ontent": "SAP宣布已完成对比利时AI工作智能平台提供商TechWolf的收购。TechWolf的专有“工作上下文图谱”（Context Graph）将成为SAP智能体查询工作及技能规划、人才管理相关信息的基础层，并整合至SAP SuccessFactors产品组合。SAP表示，该技术能够提高Token使用效率，降低部署劳动力智能体的成本，并增强AI在人力资源场景中的应用能力，包括技能导向招聘、劳动力规划及岗位重新设计。（财联社）", "ctime": 1794841924, "time_str": "23:12:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261116/c681878391.shtml"}, {"id": "5679941", "title": "今年中国与APEC经济体已达成近50项经贸务实成果", "content": "记者从16日举行的2026年APEC领导人会议周新闻中心第四场吹风会上获悉，今年以来中国与APEC经济体已达成近50项经贸领域务实成果，其中贸易数字化、人工智能等领域累计达成25项，占APEC“中国年”经贸成果的“半壁江山”。商务部副部长李成钢介绍，中方积极促成APEC经济体就世贸组织既定规则重要性、合作完善世贸组织、电子传输暂免关税、农业渔业补贴、投资便利化、电子商务等达成一系列共识；今年各方围绕贸易数字化、人工智能等议题提出倡议和文件，正式启动APEC无纸贸易卓越中心，中方牵头的亚太示范电子口岸网络成员范围已涵盖13个经济体的26个口岸或电子口岸。亚太贸易总额增长到2025年的约26万亿美元，2026年经济增长率预计为3.4%，高于全球增长预期。中方倡议制定亚太自贸区有关成果文件，有望在本次领导人会议期间达成。（新华社）", "ctime": 1794841792, "time_str": "23:09:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261116/c681878381.shtml"}, {"id": "5679869", "title": "美股纳斯达克100指数期货跌超2%", "content": "美股纳斯达克100指数期货跌超2%，标普500指数期货跌1.14%，道琼斯指数期货跌0.52%。", "ctime": 1794841230, "time_str": "23:00:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261116/c681878335.shtml"}, {"id": "5679863", "title": "期市夜盘收盘，国内期货主力合约多数下跌", "content": "期市夜盘收盘，国内期货主力合约多数下跌。跌幅方面，燃油跌超4%，合成橡胶跌超3%，玻璃、低硫燃油、塑料、焦炭、甲醇、聚丙烯、丙烯、纯苯跌超2%。涨幅方面，纸浆、粳米小幅上涨。", "ctime": 1794841226, "time_str": "23:00:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261116/c681878334.shtml"}, {"id": "5679861", "title": "现货白银失守47美元/盎司", "content": "现货白银失守47美元/盎司，日内跌3.55%。", "ctime": 1794841218, "time_str": "23:00:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261116/c681878333.shtml"}, {"id": "5679859", "title": "巴菲特将把6150股伯克希尔A类股票转换为922.5万股B类股票，并全部捐赠给四家家族基金会", "content": "当地时间11月16日，伯克希尔·哈撒韦公告称，公司荣誉董事长沃伦·巴菲特将把6150股伯克希尔A类股票转换为922.5万股B类股票，并全部捐赠给四家家族基金会。11月13日，伯克希尔B股收盘价592.94美元/股，据此计算，本次捐赠总市值近55亿美元。根据公告，苏珊·汤普森·巴菲特基金会将获得369万股B类股票，谢伍德基金会、霍华德·G·巴菲特基金会、诺沃基金会将分别获得184.5万股B类股票。此次捐赠完成后，巴菲特仍将持有伯克希尔18.21万股A类股票和1162股B类股票。巴菲特表示，此次捐赠延续了其此前公布的财富捐赠计划。按照该计划，他持有的全部伯克希尔股票最终都将捐赠给上述四家基金会，并力争逐年提高捐赠规模。能否实现这一目标，很大程度上取决于未来一段时间的股票市场表现。巴菲特称，自己的子女数十年来一直审慎支持各类公益事业，他完全信任他们的能力以及对公益使命的坚守。谈及伯克希尔，巴菲特再次表达了对公司的坚定信心。他表示，今年9月已充分阐述对伯克希尔的看法，目前这份信心“依然坚定不移”。(中国证券报)", "ctime": 1794841214, "time_str": "23:00:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261116/c681878332.shtml"}, {"id": "5679847", "title": "消息人士称360市场负责人被带走调查", "content": "11月16日，有消息人士确认，360副总裁、市场部负责人卜思南上周被警方带走调查。截至发稿，360方面暂未回应。今年8月，360集团宣布，为推进“安全+AI”战略，对集团市场与传播中心进行组织调整，设立公关部和市场部，任命卜思南为市场部负责人，向周鸿祎汇报。（第一财经）", "ctime": 1794841031, "time_str": "22:57:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261116/c681878312.shtml"}, {"id": "5679775", "title": "沙特国王下令调整沙特主导的多国联军指挥官", "content": "据沙特通讯社16日报道，根据沙特阿拉伯国王萨勒曼当天发布的国王令，沙特武装部队总参谋长法耶兹·本·哈米德·鲁韦利在履行现职的同时，代行沙特主导的多国联军指挥官一职。(新华社)", "ctime": 1794840477, "time_str": "22:47:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261116/c681878266.shtml"}, {"id": "5679711", "title": "中石科技：高性能VC吸液芯材料完成头部客户验证并实现量产交付", "content": "中石科技在投资者关系活动记录表中表示，2026年前三季度，高性能VC吸液芯材料已完成头部客户验证并实现量产交付；柔性石墨产品已在客户新品中应用，相关产品已实现客户新品导入及量产交付。", "ctime": 1794840379, "time_str": "22:46:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261116/c681878245.shtml"}, {"id": "5679653", "title": "标普500指数触及盘中低点，跌幅达1%", "content": "标普500指数触及盘中低点，跌幅达1%。", "ctime": 1794840193, "time_str": "22:43:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261116/c681878221.shtml"}, {"id": "5679601", "title": "本轮巴以冲突已致加沙地带74702人死亡", "content": "当地时间16日，加沙地带卫生部门发布声明称，自去年10月11日停火协议生效以来，加沙地带累计新增死亡1650人、另有5975人受伤，救援人员在废墟中累计寻获850具遇难者遗体。自2023年10月7日新一轮巴以大规模冲突爆发以来，以军在加沙地带的军事行动已累计造成74702人死亡、176105人受伤。（央视新闻）", "ctime": 1794840070, "time_str": "22:41:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261116/c681878209.shtml"}, {"id": "5679529", "title": "WTI原油跌超2%", "content": "WTI原油跌超2%，现报86.76美元/桶。", "ctime": 1794839686, "time_str": "22:34:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261116/c681878165.shtml"}, {"id": "5679425", "title": "美股开盘：美股三大指数集体低开", "content": "美股三大指数集体低开，标普500指数跌0.71%，道指跌0.16%，纳指跌1.18%。大型科技股方面，SpaceX跌1.27%，谷歌A跌1.33%，亚马逊跌1.96%，英伟达跌2.22%，超威半导体跌5.17%。中概股方面，小鹏集团涨6.08%，理想汽车涨2.23%，携程涨1.84%，网易涨1.28%，蔚来跌1.03%，阿里巴巴跌2.29%。", "ctime": 1794839454, "time_str": "22:30:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261116/c681878147.shtml"}, {"id": "5679289", "title": "布伦特原油失守94美元/桶", "content": "布伦特原油失守94美元/桶，日内跌2.23%。", "ctime": 1794838699, "time_str": "22:18:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261116/c681878079.shtml"}, {"id": "5679259", "title": "巴西南里奥格朗德州发生多起枪击 已致8死5伤", "content": "当地时间15日晚至16日凌晨，巴西南里奥格朗德州首府阿雷格里港市及其东部阿沃拉达市发生7起枪击事件，已造成8人死亡、5人受伤。其中阿雷格里港市4人死亡，阿沃拉达市4人死亡。枪手在夜间和凌晨驾车经过时向街上的受害者开枪。作案方式非常相似，警方正在调查案件之间是否存在关联，尚未确认嫌疑人身份。（央视新闻）", "ctime": 1794838206, "time_str": "22:10:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261116/c681877997.shtml"}, {"id": "5679251", "title": "亚洲物流航运及空运会议在港举行 聚焦全球供应链转型", "content": "由香港特区政府和香港贸易发展局合办的第16届亚洲物流航运及空运会议16日起在香港会展中心举行。会议汇聚世界各地与会者，共同探讨全球供应链变革、东盟及丝路机遇、高增值供应链和绿色能源等课题。(新华社)", "ctime": 1794838090, "time_str": "22:08:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261116/c681877969.shtml"}, {"id": "5679109", "title": "西班牙加那利群岛两天涌入逾两千移民", "content": "西班牙海上救援部门15日说，过去两天内已有近2200名非法移民乘船抵达加那利群岛。加那利群岛是西班牙17个自治区之一，位于非洲西北部海域，与非洲大陆最近距离仅100多公里，是许多非法移民经大西洋偷渡至欧洲的登陆地。为躲避海上检查和拦截，很多偷渡者选择绕远航行，在海上的时间可能长达数天乃至数周。由于当地海域在秋季更适宜航行，这一时期抵达加那利群岛的非法移民人数往往激增。（新华社）", "ctime": 1794837672, "time_str": "22:01:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261116/c681877885.shtml"}, {"id": "5679043", "title": "加拿大总理卡尼抵达深圳", "content": "今天（11月16日）晚上，加拿大总理卡尼乘飞机抵达深圳宝安国际机场。卡尼总理将出席在深圳举行的亚太经合组织第三十三次领导人非正式会议。(CCTV国际时讯)", "ctime": 1794837500, "time_str": "21:58:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261116/c681877854.shtml"}, {"id": "5679001", "title": "美银：10月中下旬以来NAND闪存现货价格大跌20% 预计通用IT领域NAND价格明年一季度还将继续下跌5%–10%", "content": "美银在一份报告中表示，自10月中下旬以来，NAND闪存现货价格已下跌约20%。512 Gb NAND晶圆现货价格报14.30美元，单周下跌12%，较上一季度下跌32%。分析师认为，本轮下跌原因在于：存储芯片价格大涨后，PC与手机厂商削减存储配置、减少元器件采购，同时大型云厂商订单回落。 NAND厂商抢占市场份额、供应商之间的价格竞争，也对价格形成压制。进一步加剧下行压力的是，全球20%–30%的NAND产能来自老旧产线，这类产能持续面向通用IT市场出货。美银预计，通用IT领域NAND价格明年一季度还将继续下跌5%–10%，带动整体平均售价（ASP）小幅走低，这和市场此前预期的涨幅超10%形成反差。一位行业人士表示：“本轮走弱主要集中在手机、PC所用的通用型NAND”，并补充称，AI数据中心所用企业级NAND需求依旧强劲。（财联社）", "ctime": 1794837020, "time_str": "21:50:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261116/c681877806.shtml"}, {"id": "5678913", "title": "超威半导体美股盘前跌超6%", "content": "超威半导体美股盘前跌超6%，现报502.01美元。", "ctime": 1794836345, "time_str": "21:39:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261116/c681877636.shtml"}, {"id": "5678903", "title": "美军在中东地区形成三航母部署", "content": "美国媒体15日援引美国官员的话报道称，美军“罗斯福”号航母已于当天抵达美军中央司令部责任区，目前该区域内部署三个航母打击群，覆盖波斯湾、红海、阿曼湾及阿拉伯海。“罗斯福”号及5000名官兵9月底离开圣迭戈母港，赴中东执行至少7个月部署任务。此次部署正值美方考虑是否重启对伊朗大规模军事行动之际，目前“布什”号和“华盛顿”号已部署在该地区，尚不清楚“罗斯福”号是否将替换其中一艘。以色列《耶路撒冷邮报》认为，三航母集结意味着美国在中东形成相当可观的海上兵力部署，今年4月也曾有过类似部署。（新华社）", "ctime": 1794836299, "time_str": "21:38:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261116/c681877633.shtml"}, {"id": "5678875", "title": "波罗的海国际航运公会首次与香港机构合作推出非英文版标准合约", "content": "16日，香港航商总会联合波罗的海国际航运公会发布《2022金康租约》中文香港版，这是该公会创立百余年来首个与香港机构合作推出的非英文版标准合约。香港航商总会主席赵式庆表示，译本契合普通法体系及国际航运惯例，填补中文国际航运规则空白，大幅降低中文市场用户的合规成本与法律争议风险。公会副秘书长斯蒂内·泰格·伊沃表示，发布有助扩大标准合约应用范围、提升业界认识。发布会现场还举行了该租约的首签及意向合作仪式。（新华社）", "ctime": 1794836220, "time_str": "21:37:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261116/c681877628.shtml"}, {"id": "5678809", "title": "浙江航信中标嘉兴市某公立医院会计电子档案项目", "content": "据航天信息消息，近日，浙江航天信息有限公司中标嘉兴市某公立医院会计电子档案项目。该项目将应用航天信息爱信诺云税产品，为医院构建规范化、智能化、系统化的会计电子档案管理系统。（人民财讯）", "ctime": 1794835953, "time_str": "21:32:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261116/c681877588.shtml"}, {"id": "5678685", "title": "上海社保科创基金及上海社保优选项目基金签约仪式在沪举行", "content": "11月16日，上海社保科创基金及上海社保优选项目基金签约仪式在沪举行。社保基金会与中国工商银行、国泰海通、浦东新区、静安区、徐汇区、上海国际集团签署上海社保科创基金协议，该基金将聚焦战略性新兴产业和未来产业，发挥领投定价、产业引导功能，领投能显著提升产业基础支撑能力、攻克关键核心技术的优质核心项目。社保基金会还与交通银行、中国人寿集团、上海国投公司、浦东新区签署上海社保优选项目基金协议，将通过基金份额接续、直接股权投资等方式支持集成电路、生物医药、人工智能三大先导产业发展，助力上海（长三角）国际科技创新中心建设。（人民财讯）", "ctime": 1794835708, "time_str": "21:28:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261116/c681877521.shtml"}, {"id": "5678669", "title": "广东与亚太经济体投资合作对接会在深圳举办", "content": "11月16日，由广东省商务厅主办的广东与亚太经济体投资合作对接会在深圳举办。活动现场，广东省人民政府与沃尔玛（中国）投资有限公司签署“十五五”时期战略合作框架协议，建立常态化贸易投资深度合作机制。对接会共签约重大经贸合作项目29个，涵盖制造业、现代服务业、半导体与电子信息制造等领域，总金额292.01亿元。会后还配套举办人工智能和金融服务专场对接活动，得到参会企业积极响应和踊跃参与。（人民财讯）", "ctime": 1794835523, "time_str": "21:25:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261116/c681877495.shtml"}, {"id": "5678657", "title": "伊朗军队称24小时内第三艘油轮在霍尔木兹海峡触雷起火", "content": "当地时间16日，伊朗军队海军表示，当天早些时候，一艘违反规定的油轮在霍尔木兹海峡以东海域航行，不仅偏离获准航线，还关闭导航系统，随后触雷起火。自当地时间前一天23时起，这已是第三艘在霍尔木兹海峡以东海域因触雷起火并丧失航行能力的违规油轮。伊朗军队称，霍尔木兹海峡目前处于关闭状态，所有船只必须经由获准航线通行，并严格遵守伊朗武装部队所制定的各项规定；再次重申，严禁船只使用未经许可的（霍尔木兹海峡）航线，严禁关闭其导航系统。（央视新闻）", "ctime": 1794835475, "time_str": "21:24:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261116/c681877488.shtml"}, {"id": "5678627", "title": "俄莫斯科国立国际关系学院因爆炸装置报警进行疏散", "content": "据俄罗斯媒体16日报道，莫斯科国立国际关系学院因收到有关爆炸装置的报警消息正在进行疏散。(新华社)", "ctime": 1794835298, "time_str": "21:21:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261116/c681877432.shtml"}, {"id": "5678573", "title": "何小鹏：明年一季度首批量产机器人进入小鹏门店开启商用", "content": "11月16日，小鹏集团董事长、CEO何小鹏表示，高阶智能是小鹏机器人最大的优势，IRON支持多人识别与身份记忆，与人交互时会实时观察和思考、及时响应需求。明年一季度，量产的首批机器人将进入小鹏的部分门店开启商用；明年二季度将面向外部商业客户正式发布小鹏IRON。（人民财讯）", "ctime": 1794834918, "time_str": "21:15:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261116/c681877352.shtml"}, {"id": "5678535", "title": "巴新总理马拉佩抵达深圳", "content": "今天（11月16日）晚上，巴布亚新几内亚总理詹姆斯·马拉佩乘飞机抵达深圳宝安国际机场。詹姆斯·马拉佩总理将出席在深圳举行的亚太经合组织第三十三次领导人非正式会议。(CCTV国际时讯)", "ctime": 1794834683, "time_str": "21:11:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/2 // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
