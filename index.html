据服务公司", "content": "据企查查APP显示，近日，乌兰察布优刻得骋风而今数据服务有限公司成立，法定代表人为刘奇，注册资本1000万元，经营范围包含数据处理和存储支持服务、大数据服务、云计算装备技术服务、人工智能硬件销售、人工智能公共数据平台等。企查查股权穿透显示，该公司由优刻得全资子公司北京优刻得科技有限公司、杭州骋风而今算力基础设施管理有限公司共同持股。", "ctime": 1793865021, "time_str": "15:50:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261105/c681501494.shtml"}, {"id": "5579435", "title": "国家算力互联互通区域（湖北）节点将启动", "content": "据2026中国5G+工业互联网大会新闻发布会介绍，本届大会将于11月18日至20日在武汉举办，聚焦人工智能与工业互联网融合。大会期间将启动国家算力互联互通区域（湖北）节点，同时首发国家算力互联互通“1+M+N”行业节点，并启动全国第二批“5G+工业互联网”融合应用城市试点。（科创板日报）", "ctime": 1793864993, "time_str": "15:49:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261105/c681501487.shtml"}, {"id": "5579433", "title": "汇通控股：实控人、董事长提议回购公司股份，资金总额2000万元-4000万元", "content": "汇通控股公告，公司董事会于2026年11月5日收到实际控制人、董事长陈王保先生《关于提议合肥汇通控股股份有限公司回购公司股份的函》，提议公司使用自有或自筹资金通过上海证券交易所股票交易系统以集中竞价交易方式回购公司发行的人民币普通股（A股）股票。回购资金总额不低于人民币2000万元（含），不超过人民币4000万元（含），回购股份拟用于员工股权激励/员工持股计划或减少公司注册资本，回购期限自董事会或股东会审议通过回购方案之日起12个月内。提议人承诺将积极推动公司尽快召开董事会审议回购股份事项并投赞成票。上述回购事项需按规定履行相关审批程序后方可实施，尚存在不确定性。", "ctime": 1793864944, "time_str": "15:49:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261105/c681501467.shtml"}, {"id": "5579429", "title": "媒体称美众议院议长约翰逊将不再竞选党派领袖", "content": "据多家媒体4日报道，美国国会众议院议长迈克·约翰逊已表示，将不会参与竞选新一届众议院共和党领袖。(新华社)", "ctime": 1793864894, "time_str": "15:48:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261105/c681501456.shtml"}, {"id": "5579427", "title": "润都股份：富马酸伏诺拉生原料药获上市批准", "content": "润都股份公告，公司近日收到国家药品监督管理局签发的富马酸伏诺拉生《化学原料药上市申请批准通知书》，批准注册。公司于2025年5月递交境内生产化学原料药上市申请并获受理，2026年3月收到CDE补充研究通知，2026年7月完成补充研究并递交资料，2026年11月获得批准通知书。富马酸伏诺拉生片用于反流性食管炎，与适当抗生素联用以根除幽门螺杆菌。本次获批有助于完善公司在消化系统治疗领域的产品布局。", "ctime": 1793864741, "time_str": "15:45:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261105/c681501347.shtml"}, {"id": "5579425", "title": "以岭药业：中药创新药小儿连花感冒颗粒获药品注册证书", "content": "以岭药业公告，公司近日收到国家药品监督管理局核准签发的中药创新药“小儿连花感冒颗粒”《药品注册证书》，药品批准文号为国药准字Z20260006，注册分类为中药1.1类，剂型为颗粒剂，药品有效期36个月。该药品为公司自主研发的中药创新药，功能主治为清热解表、宣肺泄热，用于4～12岁儿童风热感冒。公司拥有该药品独立完整的知识产权，预计不会对公司近期经营业绩产生重大影响，将尽快启动相关生产和销售工作。", "ctime": 1793864726, "time_str": "15:45:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261105/c681501337.shtml"}, {"id": "5579413", "title": "俄罗斯发生多节空车厢脱轨事故", "content": "当地时间11月5日，据俄罗斯鞑靼斯坦共和国紧急情况总局消息，卡马河畔切尔尼发生11节空车厢脱轨事故，无人受伤，邻近路段列车运行未中断。目前尚不清楚事故发生的原因。（央视新闻）", "ctime": 1793864642, "time_str": "15:44:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261105/c681501295.shtml"}, {"id": "5579411", "title": "摩根大通上调麦当劳目标价至270美元，看好门店现代化改造带来的长期增长潜力", "content": "11月5日，摩根大通将麦当劳（McDonald's）目标价从250美元上调至270美元，维持“增持”评级。该行分析师John Ivankoe认为，麦当劳正处于为期数年的业务转型阶段，重点改善现有门店的运营效率、技术系统及消费者体验。公司稳健的现金流为持续推进门店现代化改造提供了资金支持，使其具备部分资本实力较弱的餐饮连锁企业所不具备的投资能力。摩根大通预计，经过新店平均销售额及特许经营费率调整后，麦当劳新增门店对整体业务的有效增长贡献约为1.4%。不过，该行认为麦当劳第三季度业绩并未带来太多惊喜，且当前约280美元的股价已高于其2027年12月目标价270美元，因此更倾向于等待股价回落后的买入机会。", "ctime": 1793864630, "time_str": "15:43:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261105/c681501290.shtml"}, {"id": "5579377", "title": "外交部：中方愿继续同美方一道维护好落实好两国元首重要共识", "content": "11月5日，外交部发言人郭嘉昆主持例行记者会。在回答有关美国中期选举问题时，郭嘉昆表示，中期选举是美国的内政，中方此前已回应相关问题；中方愿继续同美方一道维护好落实好两国元首重要共识，加强沟通，妥处分歧，拓展合作，构建“基于尊重、公平、对等的中美建设性战略稳定关系”。（央视新闻）", "ctime": 1793864415, "time_str": "15:40:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261105/c681501217.shtml"}, {"id": "5579373", "title": "南向资金净卖出超180亿港元", "content": "据同花顺iFinD数据，截至目前，南向资金净卖出超180亿港元，其中港股通（沪）卖出超120.45亿港元，港股通（深）卖出超60.48亿港元。", "ctime": 1793864406, "time_str": "15:40:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261105/c681501212.shtml"}, {"id": "5579371", "title": "上交所召开并购重组专题座谈会 “并购六条”以来沪市新增披露资产重组1859单", "content": "上交所近日分别召开上市公司、市场机构两场并购重组专题座谈会，邀请7家上市公司及7家证券、评估、创投、保险机构代表，围绕央国企同业竞争解决、跨界并购转型升级、分期支付等工具创新、科技企业估值、并购保险增信交易等研讨。数据显示，“并购六条”发布以来，沪市新增披露各类资产重组1859单，其中重大资产重组178单。与会机构表示，“并购六条”以来股份对价分期支付、简易审核程序、私募基金锁定期“反向挂钩”等创新机制相继落地，上市公司通过并购实现产业整合、培育新增长点的意愿和能力持续增强。（财联社）", "ctime": 1793864403, "time_str": "15:40:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261105/c681501197.shtml"}, {"id": "5579359", "title": "加拿大对华无铠装建筑电缆作出双反终裁", "content": "2026年10月27日，加拿大边境服务署（CBSA）对原产于或进口自中国的无铠装建筑电缆（Unarmoured Building Cables）作出反倾销和反补贴终裁，详细税率见附表。加拿大边境服务署终止对天津市飞亚凤达线缆科技有限公司（Tianjin Feiya Fengda Wire & Cable Technology Co., Ltd.）的反补贴调查。预计加拿大国际贸易法庭（CITT）将于2026年11月26日前对本案作出产业损害终裁。本案涉及加拿大海关编码8544.49.00.19和8544.49.00.90项下的产品以及7408.11.10.00、7408.19.00.10、7605.29.00.00和7614.90.00.00项下的部分产品。", "ctime": 1793864348, "time_str": "15:39:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261105/c681501178.shtml"}, {"id": "5579329", "title": "鸿海10月销售额1.31万亿新台币，同比增长45%", "content": "鸿海10月销售额1.31万亿元新台币，同比增长45.7%；全年累计销售额8.98万亿元新台币，同比增长40.4％。", "ctime": 1793864194, "time_str": "15:36:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261105/c681501118.shtml"}, {"id": "5579327", "title": "盛和资源：恩古拉稀土矿规划年产5万吨稀土精矿，预计Q4稀土主要产品价格窄幅震荡", "content": "盛和资源总经理黄平在今天举行的业绩说明会上表示，公司目前控股的海外稀土矿为坦桑尼亚恩古拉稀土矿，该项目正在积极推动稀土矿采选技术出口前置许可申请工作，待获得前置许可手续后将启动项目建设，预计建设周期12个月，规划设计年产稀土精矿约5万吨（TREO 约45%)。结合当前的供需结构，预计Q4稀土主要产品价格将维持窄幅震荡。 (财联社)", "ctime": 1793864166, "time_str": "15:36:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261105/c681501098.shtml"}, {"id": "5579317", "title": "黑龙江年度电力外送首次突破200亿千瓦时", "content": "记者从黑龙江电力交易中心有限公司获悉，黑龙江日前首次完成向湖南外送清洁电能交易，交易电量24.5万千瓦时。至此，黑龙江年度电力外送签约电量首次突破200亿千瓦时，其中清洁电力外送签约电量137.11亿千瓦时，均创历史新高。外送电范围累计覆盖全国20个省级行政区。(新华社)", "ctime": 1793864023, "time_str": "15:33:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261105/c681501042.shtml"}, {"id": "5579255", "title": "软银集团收购瑞士-瑞典合资企业机器人业务将被中国发改委阻挠？外交部回应", "content": "11月5日，外交部发言人郭嘉昆主持例行记者会。法新社记者提问，据报道，中国已告知日本软银集团，不会批准其收购瑞士-瑞典合资企业ABB旗下的机器人业务，软银近期获悉该交易将被中国国家发展和改革委员会阻挠。郭嘉昆表示，该问题建议向中方主管部门进行询问。（澎湃新闻）", "ctime": 1793863852, "time_str": "15:30:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261105/c681500959.shtml"}, {"id": "5579199", "title": "华为发布首款鸿蒙台式机", "content": "在鸿蒙办公产业峰会上，华为首款鸿蒙电脑台式机华为擎云HM650系列发布，并发布鸿蒙电脑企业版，强化政企终端部署、设备管理与数据安全能力。（科创板日报）", "ctime": 1793863733, "time_str": "15:28:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261105/c681500903.shtml"}, {"id": "5579159", "title": "工信部：公开征求对《新能源汽车动力电池数字身份证管理暂行规定（征求意见稿）》的意见", "content": "为贯彻落实《健全新能源汽车动力电池回收利用体系行动方案》《新能源汽车废旧动力电池回收和综合利用管理暂行办法》，强化新能源汽车动力电池全链条监督管理，提升动力电池回收利用能力水平，工信部研究编制了《新能源汽车动力电池数字身份证管理暂行规定》，现向社会公开征求意见。(工信部)", "ctime": 1793863598, "time_str": "15:26:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261105/c681500855.shtml"}, {"id": "5579147", "title": "联想集团任命Amar Babu为移动业务总经理", "content": "联想集团任命集团高级副总裁、亚太区总裁Amar Babu为移动业务集团（MBG）总经理兼摩托罗拉全球总裁，自2027年1月1日起正式生效。履新后，Amar将向联想集团执行副总裁、智能设备业务集团（IDG）总裁Luca Rossi汇报，全面负责摩托罗拉全球业务，推动高端智能手机、个人AI及智能设备生态发展。（科创板日报）", "ctime": 1793863474, "time_str": "15:24:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261105/c681500810.shtml"}, {"id": "5579133", "title": "布伦特原油站上95美元/桶", "content": "布伦特原油站上95美元/桶，日内涨0.4%。", "ctime": 1793863407, "time_str": "15:23:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261105/c681500789.shtml"}, {"id": "5579131", "title": "商务部回应扩大自美采购农产品：持开放态度 对等降税落地是前提", "content": "商务部新闻发言人黄玲在5日举行的例行新闻发布会上回答有关进口美国农产品的提问时表示，中美农产品贸易是双边经贸合作的重要组成部分。扩大两国在农业领域合作，既可以丰富两国民众的餐桌，也能给两国企业和农民提供稳定的经济收入，为双方带来实实在在的好处。中方一直对扩大自美采购农产品持开放态度，但前提是双方达成的“300亿对300亿”对等降税安排落地。希望美方与中方共同努力，通过共同降低关税、减少非关税壁垒、扩大市场准入等方式，为两国农产品贸易创造更多有利条件。(新华社)", "ctime": 1793863395, "time_str": "15:23:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261105/c681500788.shtml"}, {"id": "5579109", "title": "日本新版“安保三文件”防卫开支翻倍，外交部：国际社会必须高度警惕", "content": "11月5日，外交部发言人郭嘉昆主持例行记者会。有记者提问，据报道，日本政府拟于12月通过新版“安保三文件”，有消息人士称，新版“安保三文件”中拟继续将中国定位为“最大战略挑战”，提及未来5年将防卫开支提高至现行计划的近2倍，总额将达到70万亿至80万亿日元，重点加码远程打击、无人作战等进攻型军力建设，请问中方对此有何评论？郭嘉昆表示，日本迫不及待修订“安保三文件”，大幅提升军费开支、发展进攻力量，加速“再军事化”的野心昭然若揭，所谓“最大战略挑战”不过是日方以“防卫”为名行军事扩张之实的借口。“我们注意到，日本国内也在担忧和平国家理念变质，经济民生受到严重影响。”郭嘉昆指出，历史上，日本军国主义曾经犯下滔天罪行，给亚太和世界人民造成深重灾难，殷鉴不远，不可不察。日本“再军事化”狂飙突进，不断突破“专守防卫”，严重威胁地区和平稳定，挑战战后国际秩序，国际社会必须高度警惕、共同遏制。（澎湃新闻）", "ctime": 1793863347, "time_str": "15:22:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261105/c681500775.shtml"}, {"id": "5578989", "title": "商务部回应欧盟对低价值进口商品叠加征收有关税费", "content": "欧盟自11月1日起对低价值进口商品征收2欧元手续费，此前已于7月开始征收3欧元关税。商务部新闻发言人黄玲在5日例行新闻发布会上表示，中方高度关注欧方有关新规，跨境电商为全球企业和消费者提供了多元化选择，希望欧方审慎评估相关政策影响，为中欧在电商等领域合作创造有利条件。（新华社）", "ctime": 1793862885, "time_str": "15:14:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261105/c681500426.shtml"}, {"id": "5578925", "title": "世卫组织：六项气候与健康措施每年可救160万人", "content": "世界卫生组织4日发布的一份报告显示，六项经过验证的气候与健康措施每年可挽救160万人的生命，并带来数万亿美元的经济和财政收益，同时帮助减少碳排放。这六项措施包括建立高温健康预警系统，增强饮用水服务应对气候冲击的能力，提供基本环境卫生服务，改善个人卫生条件、完善洗手设施，推广更清洁的烹饪、取暖燃料及技术，以及完善化石燃料定价政策。（新华社）", "ctime": 1793862717, "time_str": "15:11:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261105/c681500338.shtml"}, {"id": "5578851", "title": "鱼跃医疗投资成立飞鱼智创创投合伙企业", "content": "企查查APP显示，近日，江苏飞鱼智创创业投资合伙企业（有限合伙）成立，经营范围包含创业投资（限投资未上市企业）。企查查股权穿透显示，该企业由鱼跃医疗间接全资持股。", "ctime": 1793862615, "time_str": "15:10:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261105/c681500316.shtml"}, {"id": "5578791", "title": "行业人士看好中欧电池产业合作前景", "content": "第六届匈牙利电池日大会4日在匈牙利东部城市德布勒森开幕。与会行业人士表示，中国企业的投资和技术优势将为欧洲电池产业发展带来重要机遇，中欧双方应加强合作，推动产业竞争力提升和可持续发展。欧洲先进可充电与锂电池产业协会总干事伊尔卡·冯·达尔维克在接受记者采访时表示，中国在电池技术领域走在前列，中欧合作为欧洲学习中国技术和经验提供了良好机会。国际能源署能源建模师奥斯卡拉斯·阿尔绍斯卡斯表示，电动汽车和储能行业的发展将继续带动电池需求增长，需求的地区分布也将更加多元。电池产业不仅为能源电气化转型提供关键支撑，也为新兴产业带来重要的发展机遇。（新华社）", "ctime": 1793862522, "time_str": "15:08:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261105/c681500233.shtml"}, {"id": "5578677", "title": "宇树科技王兴兴：物理AI的核心挑战在于模型与物理世界的对齐", "content": "在第九届虹桥国际经济论坛上，宇树科技创始人、董事长王兴兴在“人形机器人与具身智能产业创新发展合作”分论坛上亮相。谈及物理AI的核心挑战，王兴兴认为主要在于模型与物理世界的对齐，目前多模态模型理解能力已较好，最大问题是输入输出对齐误差，包括传感器测量与真实状态的偏差及动作指令与实际运动的偏差，这部分问题未来1-2年或可解决。（财联社）", "ctime": 1793862414, "time_str": "15:06:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261105/c681500137.shtml"}, {"id": "5578437", "title": "比亚迪与vivo达成深度战略合作", "content": "据比亚迪消息，近日比亚迪与vivo在深圳正式签署战略合作协议，双方将在AI跨端融合、手车互联、数字车钥匙、车载快充等方向持续深化协同，联手打造标杆级跨端协同AI生态。（人民财讯）", "ctime": 1793862204, "time_str": "15:03:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261105/c681500041.shtml"}, {"id": "5578347", "title": "ETF两市成交额报7230.99亿元，较昨日此时放量172.31亿元", "content": "截至目前，ETF两市成交额报7230.99亿元，较昨日此时放量172.31亿元，分类型来看，股票型ETF成交额2494.57亿元，债券型ETF成交额3004.58亿元，货币型ETF成交额511.28亿元，商品型ETF成交额175.26亿元，QDII型ETF成交额1045.31亿元。其中，成交额最高的非货币型ETF分别是科创50ETF（588000）、中韩半导体ETF（513310）、创业板ETF（159915），成交额分别为：189.11亿元、182.56亿元、163.95亿元。", "ctime": 1793862168, "time_str": "15:02:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261105/c681500029.shtml"}, {"id": "5578275", "title": "ETF收评：半导体设备ETF领涨9.99%，标普油气ETF领跌6.83%", "content": "ETF收盘涨跌不一，半导体设备ETF（159327）领涨9.99%，半导体设备ETF（562590）涨9.73%，半导体设备ETF（560780）涨9.63%，标普油气ETF（513350）领跌6.83%，标普油气ETF（159518）跌6.67%，能源化工ETF（159981）跌5.85%。", "ctime": 1793862122, "time_str": "15:02:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261105/c681500009.shtml"}, {"id": "5578179", "title": "A股收评：创业板指冲高回落涨0.87%，光伏设备、贵金属板块涨幅居前", "content": "A股三大指数今日集体上涨，截至收盘，上证指数涨0.1%，深证成指涨1.19%，创业板指涨0.87%，北证50涨1.79%，科创50指数涨1.68%。全市场成交额21351亿元，较上日放量832亿元，全市场超4800只个股上涨。板块题材上，光伏设备、贵金属、影视院线、AI语料、文化传媒板块涨幅居前；油气开采加工、油气开采及服务、港口航运、银行、元件板块跌幅居前。盘面上，光伏设备板块表现强势，贝特利、时创能源、钧达股份、赛伍技术、欧晶科技等十余股涨停，金刚光伏、迈为股份、拉普拉斯等多股涨超10%。贵金属板块表现活跃，四川黄金涨停，赤峰黄金、兴业银锡、晓程科技涨幅居前。影视院线板块午后活跃，慈文传媒、博纳影业触及涨停，华策影视、中国电影、中广天择涨幅居前。煤炭开采加工板块震荡走低，广汇能源、中煤能源、中国神华、晋控煤业跌幅居前。油气开采及服务板块亦走势低迷，中国海油、中曼石油、中海油服跌幅居前。", "ctime": 1793862050, "time_str": "15:00:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261105/c681499991.shtml"}, {"id": "5578113", "title": "期货收评：能化大面积跌停！燃油暴跌超14% 贵金属领涨 钯涨超8%", "content": "期货收评：商品涨跌分化，贵金属、有色领涨，能化大面积跌停。涨幅方面，钯涨超8%，沪银涨近6%；跌幅方面，燃油跌超14%，低硫燃油跌超10%。", "ctime": 1793862031, "time_str": "15:00:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261105/c681499983.shtml"}, {"id": "5578079", "title": "股指期货午盘收盘 主力合约全线收涨", "content": "股指期货午盘收盘，主力合约全线收涨。沪深300股指期货(IF)主力合约涨0.55%，上证50股指期货(IH)主力合约涨0.30%，中证500股指期货(IC)主力合约涨1.84%，中证1000股指期货(IM)主力合约涨2.00%。", "ctime": 1793862021, "time_str": "15:00:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261105/c681499979.shtml"}, {"id": "5577939", "title": "日本国土交通大臣因涉嫌违规举办政治筹款活动道歉", "content": "据日本广播协会5日报道，日本国土交通大臣井林辰宪5日在参议院国土交通委员会会议上就涉嫌违规举办政治筹款活动公开道歉。其10月26日在东京都举办政治筹款聚会，邀请支持者参加，据阁僚行为规范，内阁大臣等官员在任期内原则上应避免举办此类活动，部分在野党议员质疑其涉嫌违规。井林辰宪称考虑不周，深表歉意。今年9月入阁的他还与梁和生、武部新等接连曝出丑闻，高市内阁支持率10月民调明显下滑，首相高市早苗的选人标准及管理能力受质疑。（新华社）", "ctime": 1793861907, "time_str": "14:58:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261105/c681499954.shtml"}, {"id": "5577921", "title": "鸿蒙笔记本电脑累计发货量超过100万台", "content": "从鸿蒙办公产业峰会获悉，鸿蒙笔记本电脑累计发货量超过100万台。（科创板日报）", "ctime": 1793861877, "time_str": "14:57:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261105/c681499949.shtml"}, {"id": "5577873", "title": "美副总统：伊朗战事是共和党选举失利根源所在", "content": "美国副总统万斯4日在社交媒体发文，直言伊朗战事是共和党中期选举失利的根源，并提出结束伊朗战事、聚焦生活成本和通胀、坚持“美国优先”、改变美以关系四项任务。美国媒体解读，此举是与特朗普切割、为2028年总统竞选布局。特朗普被问及表态时称“这在很大程度上是真的”，因伊朗战事短期内推高了汽油价格。福克斯新闻报道称，白宫要求统一信息发布口径，但万斯掌控信息发布，与特朗普在外交政策和美以关系上分道扬镳。（新华社）", "ctime": 1793861758, "time_str": "14:55:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261105/c681499905.shtml"}, {"id": "5577763", "title": "腾讯创投入股匠心互娱 后者含AI软件开发业务", "content": "据企查查APP显示，近日，北京匠心互娱科技有限公司发生工商变更，新增广西腾讯创业投资有限公司为股东，注册资本增至136.75万元。企查查信息显示，匠心互娱成立于2026年6月，经营范围包含人工智能应用软件开发、会议及展览服务（出国办展须经相关部门审批）、专业设计服务等。（人民财讯）", "ctime": 1793861344, "time_str": "14:49:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261105/c681499816.shtml"}, {"id": "5577711", "title": "丁仲礼会见中法市长圆桌会议2026双方代表", "content": "全国人大常委会副委员长丁仲礼5日在京会见中法市长圆桌会议2026双方代表。丁仲礼表示，地方合作是中法关系重要组成部分，双方要积极落实两国元首重要共识，加强务实合作与人文交流，助力中法全面战略伙伴关系行稳致远。(新华社)", "ctime": 1793861157, "time_str": "14:45:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261105/c681499683.shtml"}, {"id": "5577595", "title": "A股连续2个交易日2万亿元成交！", "content": "截止发稿时间，A股沪深京三市成交额再度突破2万亿元，较昨日此时放量1076亿元，连续2个交易日成交量在2万亿元以上。", "ctime": 1793860937, "time_str": "14:42:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261105/c681499570.shtml"}, {"id": "5577571", "title": "首创期货：油价重挫，纯苯期价跌停", "content": "成本方面，美国中期选举民主党获胜，并承诺将推动结束伊朗战争，美国副总统万斯也将共和党选举失败归因于伊朗战争，这进一步强化了市场对中东局势将逐步缓和的预期，布油跌破100关口，内盘SC原油盘中一度跌超9%。\n供应方面，上周国内纯苯开工环比下降2.3个百分点，国内加氢苯开工小幅下降0.2个百分点，亚洲纯苯开工持稳。后期随着原料陆续到岸和检修减少，加之炼油利润较好，国内纯苯开工率有所提升，供应趋于增加。上周华东纯苯港口库存增加0.1万吨。\n需求方面，下游苯乙烯开工下降，苯酚、CPL、苯胺开工提升。在高价原料影响下，下游利润普遍偏弱，导致整体开工率走低，需求端负反馈持续。\n总之，纯苯供应存恢复预期，加之油价下跌，预计短期纯苯期价震荡调整，关注地缘局势、原油价格、港口库存变化。（首创期货）", "ctime": 1793860897, "time_str": "14:41:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261105/c681499539.shtml"}, {"id": "5577485", "title": "美媒爆料：胡塞武装向沙特开出510亿美元条件，以结束敌对行动", "content": "美国《华尔街日报》当地时间11月4日援引多名知情人士消息披露，在也门胡塞武装袭击红海海域的沙特油轮，并控制战略要地曼德海峡关键地区后，沙特方面曾与胡塞武装接触，试图探寻通过谈判停止敌对行动的可能性，胡塞武装开出的条件是：510亿美元。(环球网)", "ctime": 1793860802, "time_str": "14:40:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261105/c681499503.shtml"}, {"id": "5577437", "title": "美国30年期国债收益率跌至八周低点5.229%", "content": "美国30年期国债收益率跌至八周低点 const SECTORS  = [{"name": "金融", "hit_count": 33, "etfs": []}, {"name": "人工智能", "hit_count": 28, "etfs": []}, {"name": "半导体", "hit_count": 16, "etfs": []}, {"name": "数据要素", "hit_count": 15, "etfs": []}, {"name": "新能源", "hit_count": 14, "etfs": []}, {"name": "消费", "hit_count": 12, "etfs": []}, {"name": "军工", "hit_count": 9, "etfs": []}, {"name": "机器人", "hit_count": 6, "etfs": []}];
const META     = {"update_time": "2026-11-05 16:02:41", "sentiment_score": 58.55855855855856, "agents": []};

// 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
