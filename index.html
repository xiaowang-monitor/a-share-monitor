发展营造良好环境。（新华社）", "ctime": 1788335734, "time_str": "15:55:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260902/c679526480.shtml"}, {"id": "5089861", "title": "敦煌种业跌停，公司及经销商回应：目前属于正常回调", "content": "9月2日，敦煌种业股价跌停。数据显示，公司跌停价报8.21元/股，收盘跌幅为9.98%，市值为43亿元。对于股价跌停，敦煌种业方面回应记者，股价受多重因素影响，目前属于正常回调，公司发布半年度业绩预告以来股价已经累计出现较大涨幅；公司主要销售玉米杂交种，销售主要集中在一季度和四季度，销售区域覆盖东北、西南、淮南等多个地区；具体情况以公司公告为准。(中证金牛座)", "ctime": 1788335678, "time_str": "15:54:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260902/c679526468.shtml"}, {"id": "5089849", "title": "知乎15亿注册成立人工智能公司", "content": "企查查数据显示，近日，北京智者探索科技有限公司成立，注册资本15亿元，经营范围包含：大数据服务；互联网数据服务；人工智能基础软件开发；人工智能应用软件开发等。企查查股权穿透显示，该公司由知乎关联公司北京智者天下科技有限公司全资持股。", "ctime": 1788335549, "time_str": "15:52:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260902/c679526427.shtml"}, {"id": "5089845", "title": "天宸股份：控股股东完成工商变更，注册资本2.5亿元", "content": "天宸股份公告，公司控股股东上海仲盛虹桥企业管理有限公司因经营发展需要变更工商信息，目前已完成变更登记并取得换发后的营业执照，名称变更为上海仲盛虹桥企业管理（集团）有限公司，类型变更为有限责任公司（外商投资企业法人独资），注册资本2.5亿元。此次变更不涉及持股变动，控股股东和实际控制人未发生变化。", "ctime": 1788335546, "time_str": "15:52:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260902/c679526423.shtml"}, {"id": "5089839", "title": "谷歌：正加快TPU迭代速度", "content": "谷歌AI基础设施负责人Amin Vahdat表示，谷歌正加快其定制AI芯片TPU的研发和迭代速度，将芯片更新周期从原先的两年一代缩短至每年推出两款，未来甚至可能进一步增加，以在人工智能竞赛中保持领先地位。（科创板日报）", "ctime": 1788335524, "time_str": "15:52:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260902/c679526415.shtml"}, {"id": "5089833", "title": "小米18 Fold将在IFA柏林展首发", "content": "小米首款中折叠旗舰手机小米18 Fold真机将在德国柏林国际电子消费品展览会（IFA 2026）迎来全球首秀。该产品是小米首款搭载新一代玄戒O3芯片的旗舰手机，将于9月7日正式发布。小米机器人CyberOne也将首次在海外展出。（科创板日报）", "ctime": 1788335493, "time_str": "15:51:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260902/c679526406.shtml"}, {"id": "5089811", "title": "习近平同埃及总统塞西会谈", "content": "当地时间9月2日上午，国家主席习近平在开罗太阳宫同埃及总统塞西举行会谈。(央视新闻)", "ctime": 1788335340, "time_str": "15:49:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260902/c679526364.shtml"}, {"id": "5089803", "title": "乌方称俄罗斯上空非常危险，中方如何应对航班飞行风险？外交部回应", "content": "9月2日，外交部发言人郭嘉昆主持例行记者会。乌通社记者提问，乌克兰总统称将加强对俄罗斯境内军事设施的打击，这使得俄罗斯上空已经变得非常危险，他已指示乌外交部向其他国家通报在俄罗斯领空飞行的危险性。考虑到中国的航空公司仍在使用俄罗斯领空执飞客运及其他航班，请问中方是否收到了乌克兰方面的通知？对于商业航班在俄罗斯领空飞行所面临的风险，中方将如何应对？郭嘉昆表示，对话谈判是解决乌克兰危机的唯一可行出路。中方敦促各方保持冷静克制，共同推动局势尽快降温，为政治解决危机积累条件。（澎湃新闻）", "ctime": 1788335267, "time_str": "15:47:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260902/c679526271.shtml"}, {"id": "5089789", "title": "芒果超媒董事长：AI长剧《后西游记》成本仅为同类S级真人剧几分之一", "content": "芒果超媒董事长蔡怀军表示，AI长剧《后西游记》总成本约为同类S级真人剧的几分之一；30集、单集40分钟的体量，从策划到上线，时间较传统三维动画压缩了70%。首批5集播出后，神话题材和电影级AI视觉呈现带来了新的用户，“特别是男性用户群体拉新率超出了我们的预期”。 (每经网)", "ctime": 1788335172, "time_str": "15:46:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260902/c679526142.shtml"}, {"id": "5089773", "title": "以色列5座海水淡化厂因海水浑浊继续停运", "content": "据以色列媒体9月1日援引政府部门的消息报道，由于海水浑浊度再次上升，以色列位于地中海沿岸的6座海水淡化厂中，有5座当天继续停运。\n\n由于异常天气和海流状况造成海水浑浊，以色列水务局8月31日宣布，上述5座海水淡化厂已停止运行，其中有工厂曾于31日短暂恢复运行。\n\n以色列水务局说，专业人员正密切监测水质变化，在海水重新变清澈后将尽快恢复运行所有设施。该部门要求以色列地方政府限制公共用水，减少农业以及公共区域的灌溉用水。以色列水务局运行中心将处理可能出现的局部供水短缺。\n\n以色列能源和基础设施部说，海水浑浊度升高导致淡化设施无法正常工作，类似现象是20年来首次出现。另据媒体报道，初步调查显示，浑浊可能与从尼罗河三角洲随海流漂来的微藻大量聚集有关。\n\n以色列地处干旱、半干旱地区，天然淡水资源匮乏。自本世纪初以来，以色列大规模发展海水淡化产业，海水淡化目前已成为该国生活用水的主要来源之一。(新华社)", "ctime": 1788335100, "time_str": "15:45:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260902/c679526120.shtml"}, {"id": "5089763", "title": "外交部：历史结论不容篡改 战后国际秩序更不容挑战", "content": "就有观点称《联合国宪章》中的“敌国条款”已经失效、没有实际意义，外交部发言人郭嘉昆2日在例行记者会上答问时表示，日本“新型军国主义”这头“灰犀牛”正在奔袭而来，再度对亚太和平稳定带来威胁。在这一背景下，全面遵守《联合国宪章》、重申“敌国条款”十分必要。我们敦促日本当局切实恪守《日本投降书》所确认的国际义务，正视历史、以史为鉴，同军国主义彻底切割，以实际行动取信于亚洲邻国和国际社会。（央视新闻）", "ctime": 1788335066, "time_str": "15:44:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260902/c679526110.shtml"}, {"id": "5089759", "title": "老百姓：截至2026年8月31日累计已回购0万股", "content": "老百姓公告，公司拟使用自有资金回购股份，回购资金总额不低于人民币4000万元（含）且不超过人民币8000万元（含），回购价格不超过人民币18.08元/股（含），股份拟用于员工持股计划或股权激励。截至2026年8月31日，公司尚未进行股份回购，累计已回购0万股，累计已回购金额0万元。", "ctime": 1788335041, "time_str": "15:44:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260902/c679526104.shtml"}, {"id": "5089727", "title": "外交部：敦促日本当局同军国主义彻底切割", "content": "就有观点称《联合国宪章》中的“敌国条款”已经失效、没有实际意义，外交部发言人郭嘉昆2日在例行记者会上答问时表示，日本“新型军国主义”这头“灰犀牛”正在奔袭而来，再度对亚太和平稳定带来威胁。在这一背景下，全面遵守《联合国宪章》、重申“敌国条款”十分必要。我们敦促日本当局切实恪守《日本投降书》所确认的国际义务，正视历史、以史为鉴，同军国主义彻底切割，以实际行动取信于亚洲邻国和国际社会。(新华社)", "ctime": 1788334834, "time_str": "15:40:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260902/c679526016.shtml"}, {"id": "5089717", "title": "外交部：对话谈判是解决乌克兰危机的唯一可行出路", "content": "9月2日，外交部发言人郭嘉昆主持例行记者会。针对乌克兰危机的有关提问，郭嘉昆表示，对话谈判是解决乌克兰危机的唯一可行出路。中方敦促各方保持冷静克制，共同推动局势尽快降温，为政治解决危机积累条件。(央视新闻)", "ctime": 1788334799, "time_str": "15:39:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260902/c679525977.shtml"}, {"id": "5089713", "title": "外交部谈“赛考斯”中国行：支持中美人民多来往", "content": "近日，美国友人“赛考斯”（本名罗纳德·萨科尔斯基）时隔27年再次访问中国，与全国劳动模范、治沙英雄殷玉珍实现跨洋重逢。外交部发言人郭嘉昆9月2日在例行记者会上就此答问时说，中美关系希望在人民、基础在民间，中美两国人民共同书写的一个又一个温暖故事，是中美民间友谊的生动写照，也再次证明中美两个大国完全可以相互成就、造福世界。“中方将一如既往支持两国人民多来往、多交流，续写两国人民友好故事，为中美关系发展作出新的贡献。”郭嘉昆说。（新华社）", "ctime": 1788334780, "time_str": "15:39:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260902/c679525961.shtml"}, {"id": "5089709", "title": "美国战略石油储备降至44年最低水平", "content": "美国能源部近日公布的数据显示，截至8月28日当周，美国战略石油储备较此前一周减少超过300万桶，库存量降至2.87亿桶，跌至1982年以来的最低水平。美国从1975年开始建立战略石油储备以应对供应中断风险，美国战略石油储备曾在2009年12月至2011年7月初维持7.26亿桶以上的高位。（央视新闻）", "ctime": 1788334727, "time_str": "15:38:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260902/c679525937.shtml"}, {"id": "5089707", "title": "千里科技：2026年8月整车销量8634辆，同比下降21.98%", "content": "千里科技公告，2026年8月汽车整车产量7070辆，同比下降29.43%；销量8634辆，同比下降21.98%。本年累计产量58419辆，同比增长28.12%；累计销量60651辆，同比增长1.06%。", "ctime": 1788334721, "time_str": "15:38:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260902/c679525934.shtml"}, {"id": "5089697", "title": "中俄领导人讨论了中美俄三方在APEC会晤可能性？外交部：目前无可提供的信息", "content": "外交部发言人郭嘉昆主持例行记者会。彭博社记者提问，据报道，俄罗斯总统普京在与中方领导人会谈期间，讨论了中俄美在今年中国主办亚太经合组织（APEC）峰会期间举行三方会晤的可能性。请问外交部对此有何评论？“关于你提到的问题，我目前没有可以提供的信息。”郭嘉昆表示，作为今年亚太经合组织东道主，中方愿同各方一道，共同推动APEC中国年圆满成功，为促进亚太和世界经济增长作出新贡献。（澎湃）", "ctime": 1788334694, "time_str": "15:38:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260902/c679525911.shtml"}, {"id": "5089695", "title": "外交部：中方正筹备第三批对尼泊尔紧急援助物资", "content": "外交部发言人郭嘉昆9月2日在例行记者会上说，根据尼泊尔需求，中方正在筹备第三批紧急援助物资，包括贝雷桥、防疫物资等，并将派出第二批DNA鉴定专家。郭嘉昆说，灾害发生后，中方同各相关国家驻华使馆持续密切沟通，共同做好失联人员摸排善后处置等工作。中方高度重视在尼泊尔中国公民和机构安全，会同尼方全力搜救失联中国公民，并协助大批中国公民安全转移。（新华社）", "ctime": 1788334648, "time_str": "15:37:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260902/c679525885.shtml"}, {"id": "5089691", "title": "首创期货：成本抬升，现货紧张，乙二醇期货再次触及涨停", "content": "供应方面，上周国内乙二醇总开工环比提升6.3个百分点，煤制开工环比提升3.6个百分点。本周华东主港地区乙二醇港口库存环比下降6.7万吨，港口库存降至历史极低水平。上周华东主港计划到货量约3.7万吨。预估9月份进口到港依然维持低位。\n需求方面，本周瓶片和短纤工厂加大减产力度，聚酯负荷下降3.1个百分点，为连续第6周下降。织造端新订单略有改善，整体依旧是针织好于梭织，梭织常规品种相对较弱。江浙终端开机率有所回升。\n总之，国内乙二醇开工大幅提升，供应增加，整体供需预计由之前的大幅去库修复至紧平衡。但是进口货源较少，港口库存降至历史低位，现货流通性依然紧张。加之地缘局势升级，油价大幅飙升，预计短期乙二醇期价维持偏强格局，正套参与，关注海峡通行情况、进口到港量、能源价格走势。（首创期货）", "ctime": 1788334636, "time_str": "15:37:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260902/c679525878.shtml"}, {"id": "5089687", "title": "中国航发召开民用燃机产业研讨会", "content": "中国航空发动机集团消息，8月31日，中国航发召开民用燃机产业研讨会，系统分析民用燃机产业发展形势，研讨集团民用燃机产业高质量发展路径。会议听取了集团民用燃机研发体系建设、产业市场及政策分析、产品经营及投资方向等工作汇报，围绕推动民用燃机产业“十五五”破局发展进行深入研讨交流，进一步凝聚共识、汇聚合力。（人民财讯）", "ctime": 1788334619, "time_str": "15:36:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260902/c679525865.shtml"}, {"id": "5089671", "title": "习近平将同埃及总统塞西会谈", "content": "当地时间9月2日上午，国家主席习近平将在开罗太阳宫同埃及总统塞西举行会谈。(央视新闻)", "ctime": 1788334529, "time_str": "15:35:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260902/c679525806.shtml"}, {"id": "5089665", "title": "税友股份：宁波思驰向张镇潮转让5.04%完成过户", "content": "税友股份公告，公司此前披露控股股东宁波思驰拟以35.59元/股向实际控制人张镇潮协议转让2050万股（占公司目前总股本的5.04%）。本次协议转让已于2026年9月1日完成过户登记，张镇潮过户后持有1.13亿股，持股比例27.76%；一致行动人合计持股比例仍为73.66%。", "ctime": 1788334496, "time_str": "15:34:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260902/c679525786.shtml"}, {"id": "5089657", "title": "伊朗称袭击科威特美军基地 造成多名美方人员死亡", "content": "伊朗伊斯兰革命卫队当地时间2日发布公告称，为报复美军此前袭击，革命卫队当天凌晨对美军在科威特的阿里·萨利姆空军基地实施导弹和无人机联合打击，目标包括美军指挥官指挥和住宿区域、无人机机库及停机坪。公告称，袭击造成多名美方人员死亡，多架参与对伊袭击的无人机被摧毁，相关机库和停机坪起火。伊朗伊斯兰革命卫队表示，此次行动与针对美军在约旦、巴林和伊拉克埃尔比勒相关基地的袭击同步进行。（央视新闻）", "ctime": 1788334440, "time_str": "15:34:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260902/c679525751.shtml"}, {"id": "5089653", "title": "富邦新材：一审驳回后润木公司就500万元案上诉", "content": "富邦新材公告，公司此前涉及润木公司诉“股东损害公司债权人利益责任纠纷”一案，2026年7月31日一审判决驳回原告诉讼请求。近日，公司收到润木公司提交的民事上诉状，润木公司请求撤销一审判决并改判支持其全部诉讼请求，二审法院为北京市第三中级人民法院。", "ctime": 1788334432, "time_str": "15:33:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260902/c679525741.shtml"}, {"id": "5089595", "title": "瑞银集团连沛堃：全球科技投资中，中国AI供应链日渐难以忽视", "content": "瑞银集团全球研究部亚太区总监连沛堃在第23届瑞银证券中国A股研讨会上表示，这轮A股调整更多体现为市场在前期上涨后的风险释放，而非中期趋势的根本性逆转。随着融资余额回落，市场去杠杆进程逐步接近尾声。维护资本市场平稳运行的积极因素正加速累积，市场修复基础持续夯实，这些都有助于下半年行情的延续。连沛堃认为，人工智能的结构性增长逻辑、中国科技供应链的国产化进程以及国内AI基础设施建设的发展方向并未改变。随着全球AI产业叙事改善、企业应用加快以及国内科技生态持续完善，中国AI产业链的中长期投资价值仍然值得关注。从海外交流情况看，许多投资者已认识到，中国AI供应链正成为全球科技投资组合中不可忽视的一环，亦有外资正用真金白银加码布局。（人民财讯）", "ctime": 1788334128, "time_str": "15:28:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260902/c679525594.shtml"}, {"id": "5089571", "title": "中埃·泰达苏伊士经贸合作区：从戈壁到新城，走出中埃互利共赢的合作之路", "content": "中埃·泰达苏伊士经贸合作区位于埃及苏伊士省，是中埃两国共建“一带一路”重点项目，也是中埃双边产业合作和经贸对话的实质性平台。2008年创建以来，合作区已成为对接共建“一带一路”倡议与埃及“苏伊士运河走廊经济带”战略的示范项目。截至2025年年底，泰达合作区实际吸引投资额超过38亿美元。泰达合作区吸引了大批世界一流企业入驻，这些企业填补了埃及相关领域的技术空白，生产的产品正销往全球市场，增强了埃及出口创汇能力。（央视新闻）", "ctime": 1788333936, "time_str": "15:25:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260902/c679525524.shtml"}, {"id": "5089545", "title": "应急管理部针对福建启动国家地质灾害四级应急响应", "content": "据气象部门预测，受台风“沙德尔”、季风槽和冷空气共同影响，9月2日至4日，江南、华南东部和南部等地部分地区有大到暴雨，局地大暴雨或特大暴雨。福建东北部部分地区发生地质灾害的风险高。根据《国家突发地质灾害应急预案》及有关规定，应急管理部于9月2日针对福建启动国家地质灾害四级应急响应。\n\n应急管理部要求，相关地区要增强风险意识、强化底线思维，全面抓实抓细地质灾害防范应对工作，压紧压实责任，强化多部门会商研判和协同联动，密切监视雨情汛情和地质灾害风险变化趋势，严格落实“灾害点+风险区”双控管理，对山区沟口、临崖陡坡、施工工地、旅游景区等重点部位加强排查，强化预警叫应，坚决果断实施转移避险，做到应转尽转、应转早转。同时要前置预置抢险救援力量和救灾物资，下沉力量加强对基层的指导帮扶，全面做好应急准备，确保人民群众生命财产安全。(新华社)", "ctime": 1788333796, "time_str": "15:23:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260902/c679525477.shtml"}, {"id": "5089517", "title": "贝壳：深圳近期部分业主上调房产挂牌价", "content": "深圳贝壳研究院院长肖小平表示，近期上调房产挂牌价的业主明显变多。据调查，不少业主觉得未来新房供应减少，二手房会变得吃香；有部分客户或业主，向经纪人咨询如何办理40年房贷；需求前端的数据也开始增长，对比前一周周末（8月22—23日），8月29—30日周末新增客量增长6.5%、咨询量增长3.2%。（人民财讯）", "ctime": 1788333506, "time_str": "15:18:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260902/c679525262.shtml"}, {"id": "5089471", "title": "伊朗议长：若美阻止伊朗石油出口 波斯湾将断油", "content": "当地时间9月1日，伊朗伊斯兰议会议长卡利巴夫表示，目前霍尔木兹海峡完全处于伊朗军方的控制之下，美国想违反伊美谅解备忘录，让船只从霍尔木兹海峡南线通过，伊朗绝不允许。卡利巴夫还表示，如果“敌人企图阻止伊朗从波斯湾出口石油，那谁都别想再从波斯湾运出任何石油”“（美方）必将为其一手推行的军事封锁付出代价”。此外，伊朗军方表示，已做好准备应对威胁。（央视新闻）", "ctime": 1788333297, "time_str": "15:14:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260902/c679525112.shtml"}, {"id": "5089461", "title": "瑞银证券孟磊：年内A股有望延续稳步反弹", "content": "瑞银证券中国股票策略分析师孟磊在最新观点中调高了对A股公司的整体盈利预期，预计2026年全年全部A股公司整体盈利有望增长15%。孟磊指出，在盈利复苏、增量资金入市及全球科技叙事的推动下，年内A股有望延续稳步反弹。但需注意，本轮A股后续或面临两大不确定因素：其一，地缘政治、美债利率和油价波动可能影响利率敏感的科技板块估值；其二，在公募基金大幅超配科技板块的前提下，或面临“回本赎回”压力，制约反弹空间。", "ctime": 1788333247, "time_str": "15:14:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260902/c679525103.shtml"}, {"id": "5089433", "title": "韩国外汇稳定基金的举措推高了该基金的美元持仓比例", "content": "韩国外汇稳定基金的举措推高了该基金的美元持仓比例。", "ctime": 1788333018, "time_str": "15:10:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260902/c679525003.shtml"}, {"id": "5089429", "title": "科技部部长阴和俊率团赴美国出席2026年二十国集团创新部长级会议", "content": "8月31日至9月1日，科技部部长阴和俊率领中国代表团赴美国出席G20创新工作组创新部长级会议。阴和俊表示，以人工智能为代表的新兴技术发展进入前所未有的活跃期，机遇与挑战并存，亟需各国携手应对。中国始终把科技创新摆在现代化建设的突出位置，持续扩大高水平科技开放。在人工智能领域，中国强调以人为本、向上向善理念，致力于推进全球人工智能能力建设，为弥合数智鸿沟贡献中国方案。本次创新部长级会议由美国白宫科技政策办公室主任迈克尔·克拉齐奥斯主持，以“人工智能和新兴技术的引领创新”为主题，围绕“创新支持政策框架”“技术赋能繁荣发展”“技术人才队伍建设”等议题进行了广泛深入的讨论。会议在人工智能和新兴技术创新政策原则、提升劳动者人工智能技能等方面达成诸多共识。会议期间，阴和俊与英国、阿根廷等国科技部长或其代表进行了会谈、会见和交流，就深化双多边科技创新合作深入交换意见。（人民财讯）", "ctime": 1788332936, "time_str": "15:08:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260902/c679524952.shtml"}, {"id": "5089381", "title": "年内第十一次！A股成交额再度不足2万亿元", "content": "今日三市成交额18202亿元，较上日缩量2316亿元，年内第十一次成交额再度不足2万亿元。", "ctime": 1788332738, "time_str": "15:05:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260902/c679524905.shtml"}, {"id": "5089379", "title": "腾讯WorkBuddy上线开放平台，开放Agent基座能力", "content": "9月2日，腾讯WorkBuddy宣布开放平台上线，首批引入超百家生态伙伴，面向智能硬件、行业应用与开发者等开放底层Agent（智能体）能力。9款联名智能硬件在发布会上亮相，合作方包括Plaud、Rokid、影石、科大讯飞、安克、猛玛、京东京造等。有30余个行业应用同步接入，覆盖金融、法律、医疗、教育、公益等20多个领域。（第一财经）", "ctime": 1788332721, "time_str": "15:05:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260902/c679524898.shtml"}, {"id": "5089371", "title": "习近平致电祝贺挪威国王哈康八世即位", "content": "2026年9月2日，国家主席习近平向挪威新任国王哈康八世致贺电，对其即位表示祝贺。\n\n习近平指出，中挪两国相距虽远，但友谊源远流长。挪威是最早承认并同新中国建交的欧洲国家之一。两国建交72年来，在挪威王室积极推动下，双边关系取得长足进步，各领域合作不断拓展，给两国人民带来实实在在的利益。我高度重视中挪关系发展，愿同哈康八世国王一道努力，书写中挪友好交往新篇章。(外交部网站)", "ctime": 1788332687, "time_str": "15:04:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260902/c679524886.shtml"}, {"id": "5089351", "title": "欧洲主要股指开盘集体下跌", "content": "欧洲主要股指开盘集体下跌，欧洲斯托克50指数跌0.11%，英国富时100指数跌0.11%，法国CAC40指数跌0.09%，德国DAX指数跌0.25%。", "ctime": 17 // 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
