/20261102/c681351728.shtml"}, {"id": "5543777", "title": "智元6台精灵G2便利店在岗4.5小时 累计完成337项任务", "content": "11月2日，截至14时30分，智元“机器人打工不能停”便利店中6台精灵G2机器人已在岗4.5小时，累计完成337项任务，包括接待顾客116次、商品取送84件、咖啡制作30次、早餐服务40次、补货及巡检27次、桌面清洁40次。直播挑战仍在继续，6台精灵G2将持续承担迎宾接待、咖啡制作、熟食服务、取货补货、桌面清洁等任务，接受连续24小时在岗作业的考验。（人民财讯）", "ctime": 1793604083, "time_str": "15:21:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261102/c681351688.shtml"}, {"id": "5543769", "title": "年内私募自购逾20亿元", "content": "据私募排排网不完全统计，截至2026年11月2日，今年以来共有39家私募管理人合计自购旗下产品20.03亿元。（人民财讯）", "ctime": 1793603990, "time_str": "15:19:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261102/c681351594.shtml"}, {"id": "5543743", "title": "阿布扎比与OpenAI签署四项协议，合作涵盖政府、能源及投资领域", "content": "11月2日，阿联酋阿布扎比王储哈立德会见OpenAI首席执行官山姆·奥特曼，见证双方签署四项合作协议，涉及政府、能源和投资领域。其中，阿布扎比国家石油公司将部署OpenAI先进人工智能技术，成为能源行业首家采用该技术的企业；阿布扎比政府还将与OpenAI推出机器可读政府计划，将部分政策法规转化为机器可读形式，辅助官员开展合规评估。（界面新闻）", "ctime": 1793603883, "time_str": "15:18:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261102/c681351502.shtml"}, {"id": "5543735", "title": "俄临时禁止向欧亚经济联盟以外地区出口6种石化产品", "content": "俄联邦政府网站11月2日发布消息，宣布临时禁止从俄罗斯向欧亚经济联盟成员国以外地区出口6种石化产品，旨在保障俄国内工业企业原料的稳定供应。禁令为期3个月，涉及焦化苯、石油苯、甲苯、邻二甲苯、对二甲苯和苯酚，上述产品用于汽车、航空、船舶、铁路机械制造用涂料，食品包装、地板材料和电缆绝缘材料，也用于医疗工业。禁令不适用于国际过境运输的石化产品、国际人道主义援助物资，以及向斯瓦尔巴群岛俄属机构的供应。（央视新闻）", "ctime": 1793603855, "time_str": "15:17:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261102/c681351479.shtml"}, {"id": "5543721", "title": "香港证监会公布首份AI准备情况调查", "content": "11月2日，香港证券及期货事务监察委员会（以下简称香港证监会）公布其首份《大型机构人工智能应用及准备情况调查》，结果显示机构已将人工智能（AI）广泛应用于业务及监控职能，但指出以负责任的方式扩展应用规模正面对挑战。本次调查于2026年7月至8月进行，涵盖20家大型金融机构及其78家香港联属持牌法团，覆盖今年上半年证券市场交易的75%。调查发现，全部受访机构均已运用AI；95%预期未来一年会加快AI应用；90%受访机构反映已运用或评估AI防范网络攻击风险；55%机构正运用或正在试用代理式AI。(中国基金报)", "ctime": 1793603743, "time_str": "15:15:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261102/c681351405.shtml"}, {"id": "5543691", "title": "远景：全球首套800V SST高压直流系统实现AI数据中心商业化运行", "content": "11月2日，远景科技集团宣布，其一体化800V高压直流供电系统已在乌兰察布星河基地投入商业化运行，成为全球首套在大型AI数据中心商业化运行的同类系统。该系统由天枢控制器、固态变压器（SST）、直流储能及DC/DC构成。该基地今年8月投产，规划容量3GW，绿电直连比例将超过80%。远景能源高级副总裁黄志勇表示，此次商业化运行标志着远景AIDC电力系统走通了从绿电生产到算力负荷的完整闭环。（人民财讯）", "ctime": 1793603543, "time_str": "15:12:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261102/c681351317.shtml"}, {"id": "5543689", "title": "万孚生物与山西医大二院签署战略合作协议", "content": "据万孚生物消息，近日，万孚生物与山西医科大学第二医院签署战略合作协议。双方将围绕科学研究、人才培养及学科建设等领域展开深度合作，共同探索以临床价值为导向的产学研融合新模式。(人民财讯)", "ctime": 1793603532, "time_str": "15:12:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261102/c681351307.shtml"}, {"id": "5543647", "title": "王毅、王文涛将共同主持亚太经合组织第37届外交和贸易双部长视频会议", "content": "外交部发言人宣布：中共中央政治局委员、外交部长王毅与商务部长王文涛将于11月3日在北京共同主持亚太经合组织（APEC）第37届外交和贸易双部长视频会议。(央视新闻)", "ctime": 1793603417, "time_str": "15:10:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261102/c681351176.shtml"}, {"id": "5543587", "title": "加蓬总统恩圭马将访华", "content": "外交部发言人宣布：应国家主席习近平邀请，加蓬共和国总统布里斯·克洛泰尔·奥利吉·恩圭马将于11月3日至7日对中国进行国事访问。(新华社)", "ctime": 1793603244, "time_str": "15:07:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261102/c681350866.shtml"}, {"id": "5543579", "title": "美团在厦门成立乐鲜科技公司，注册资本1000万", "content": "据天眼查App显示，近日厦门乐鲜科技有限公司成立，法定代表人为刘东伟，注册资本1000万元人民币，经营范围包括票务代理服务、汽车装饰用品销售、消防器材销售等，由深圳乐鲜科技有限公司全资持股，后者为美团旗下Xigua Limited全资子公司。", "ctime": 1793603227, "time_str": "15:07:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261102/c681350860.shtml"}, {"id": "5543517", "title": "“九章四号”光量子计算原型机等20项成果获2026年世界互联网大会领先科技奖", "content": "2026年世界互联网大会领先科技奖颁奖典礼11月2日在浙江乌镇举行，20项成果获奖，包括“九章四号”光量子计算原型机等基础研究2项，面向空间量子信息的光传输技术及应用等关键技术10项，面向物理AI的整车智能体技术平台等工程研发8项，涵盖量子计算、人工智能、空天信息、智能体生产力平台等前沿领域，展现出“智能引领、数实贯通、底座夯实”的特点。（央视新闻）", "ctime": 1793603093, "time_str": "15:04:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261102/c681350809.shtml"}, {"id": "5543395", "title": "ETF收评：创业板金融科技ETF领涨10.58%，标普油气ETF领跌3.75%", "content": "ETF收盘涨跌不一，创业板金融科技ETF（158062）领涨10.58%，创业板金融科技ETF（158052）涨10.35%，创业板金融科技ETF（158058）涨10.13%，标普油气ETF（159518）领跌3.75%，科创综指ETF（589580）跌3.61%，黄金ETF（159812）跌2.61%。", "ctime": 1793602936, "time_str": "15:02:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261102/c681350775.shtml"}, {"id": "5543373", "title": "ETF两市成交额报5044.11亿元，较昨日此时缩量543.54亿元", "content": "截至目前，ETF两市成交额报5044.11亿元，较昨日此时缩量543.54亿元，分类型来看，股票型ETF成交额2083.69亿元，债券型ETF成交额1433.23亿元，货币型ETF成交额592.94亿元，商品型ETF成交额98.44亿元，QDII型ETF成交额835.81亿元。其中，成交额最高的非货币型ETF分别是中韩半导体ETF（513310）、科创50ETF（588000）、创业板ETF（159915），成交额分别为：215.14亿元、166.95亿元、131.18亿元。", "ctime": 1793602909, "time_str": "15:01:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261102/c681350766.shtml"}, {"id": "5543339", "title": "股指期货午盘收盘 主力合约全线收涨", "content": "股指期货午盘收盘，主力合约全线收涨。沪深300股指期货(IF)主力合约涨0.87%，上证50股指期货(IH)主力合约涨0.70%，中证500股指期货(IC)主力合约涨2.22%，中证1000股指期货(IM)主力合约涨2.20%。", "ctime": 1793602873, "time_str": "15:01:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261102/c681350762.shtml"}, {"id": "5543323", "title": "A股收评：创业板指高开高走涨1.87%，影视院线、游戏、文化传媒板块集体爆发", "content": "A股三大指数今日集体上涨，截至收盘，上证指数涨1.08%，深证成指涨1.63%，创业板指涨1.87%，北证50涨0.58%，科创50指数涨3.11%。全市场成交额17952亿元，较上日放量1075亿元，全市场超4600只个股上涨。板块题材上，影视院线、游戏、文化传媒、AI视频、软件开发板块涨幅居前；贵金属、银行、煤炭开采加工、油气开采及服务板块下跌。盘面上，影视院线板块今日集体爆发，华智数媒、捷成股份、博纳影业、中视传媒、上海电影等多股涨停，华策影视、百纳千成、幸福蓝海涨幅居前。游戏板块持续走高，电魂网络、巨人网络、大晟文化等股涨停，富春股份、冰川网络、宝通科技涨幅居前。文化传媒板块低开高走掀涨停潮，中信出版、芒果超媒、海看股份、天下秀、出版传媒等二十余股涨停，流金科技、无线传媒、值得买涨幅居前。贵金属板块走势低迷，山金国际、赤峰黄金、中金黄金跌幅居前。银行板块震荡走低，上海银行盘中跌超9%，齐鲁银行、苏州银行、宁波银行跌幅居前。", "ctime": 1793602852, "time_str": "15:00:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261102/c681350755.shtml"}, {"id": "5543199", "title": "深蓝S07 10月全球销量6470辆", "content": "11月2日，深蓝汽车发文称，深蓝S07 10月全球销量6470辆。（界面新闻）", "ctime": 1793602769, "time_str": "14:59:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261102/c681350702.shtml"}, {"id": "5543193", "title": "国内首台汽车金融AI智能一体机将在世界互联网大会上亮相", "content": "由世界互联网大会、浙江省人民政府共同主办的“互联网之光”博览会今日开幕，易鑫推出的国内首台汽车金融AI智能一体机荣获“新光”产品奖。该一体机将传统约90分钟的办理流程压缩至15到20分钟，支持7×24小时服务，敏感证件信息全程无需第三方经手。易鑫首席科技官贾志峰表示，其标志着易鑫AI应用从“后台赋能”走向“前台革新”。目前设备已在部分新能源汽车门店运营，初期数据显示办理时效领先行业标准50%以上，自助办理达成率超95%。易鑫称将加快在4S店、二手车市场、县域网点等场景覆盖。该一体机将在本届乌镇大会易鑫展台亮相。（上观新闻）", "ctime": 1793602739, "time_str": "14:58:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261102/c681350690.shtml"}, {"id": "5543149", "title": "全球首套800V SST高压直流系统实现AI数据中心商业化运行", "content": "记者获悉，远景科技集团一体化800V高压直流供电系统已在乌兰察布星河基地投入商业化运行，成为全球首套在大型AI数据中心商业化运行的同类系统。据悉，远景乌兰察布星河基地今年8月投产，规划容量3GW，绿电直连比例将超过80%。(21财经)", "ctime": 1793602359, "time_str": "14:52:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261102/c681350559.shtml"}, {"id": "5543143", "title": "金融法草案二审稿充实金融消费者、投资者保护相关内容", "content": "《中华人民共和国金融法（草案）》11月2日提请十四届全国人大常委会第二十五次会议二次审议，二审稿充实金融消费者、投资者保护内容，并对互联网营销等活动增加针对性规定。草案规定提供金融产品和服务应设定公平合理交易条件，不得以格式条款排除或限制金融消费者、投资者权利；营销主体应加强客户适当性管理，如实说明内容、充分提示风险。对非公开发行的金融产品和服务，不得通过互联网等方式广告宣传、公开劝诱或变相公开劝诱。草案还增加金融工作坚持市场化法治化方向、推进国际金融中心建设等内容，并对资产管理业务、跨境金融活动监管等增加相关规定。（央视新闻）", "ctime": 1793602332, "time_str": "14:52:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261102/c681350549.shtml"}, {"id": "5543141", "title": "交通运输部：10月26日—11月1日国家铁路运输货物环比增长0.33%", "content": "交通运输部发布10月26日—11月1日全国物流保通保畅运行数据：国家铁路运输货物8349.6万吨，环比增长0.33%；全国高速公路货车通行5574.0万辆，环比下降0.96%；监测港口完成货物吞吐量27269.0万吨，环比增长11.02%，完成集装箱吞吐量662.7万标箱，环比下降1.81%；民航保障航班11.6万班，环比下降2.19%；邮政快递揽收量约42.24亿件、投递量约42.42亿件，均环比下降。（人民财讯）", "ctime": 1793602310, "time_str": "14:51:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261102/c681350544.shtml"}, {"id": "5543127", "title": "中指研究院：11月重点8城待拍涉宅用地总起始价超768亿元", "content": "中指研究院数据显示，11月四大一线城市北京、上海、广州、深圳均有土地出让安排；二线城市杭州、成都、武汉、南京均有多宗宅地出让，且均有核心板块优质宅地。上述8个城市本级范围内将有116宗涉宅用地出让，总起始价超768亿元。（人民财讯）", "ctime": 1793602167, "time_str": "14:49:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261102/c681350523.shtml"}, {"id": "5543117", "title": "中韩半导体ETF华泰柏瑞成交额突破200亿", "content": "截至发稿时间，中韩半导体ETF华泰柏瑞（513310）成交额突破200亿元位列今日股票型ETF成交榜首。该ETF最新涨幅为3.62%，前两大重仓股为SK海力士、三星电子，今日韩国综指收涨2.24%。", "ctime": 1793602045, "time_str": "14:47:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261102/c681350472.shtml"}, {"id": "5542997", "title": "工商银行提示贵金属市场风险", "content": "工商银行“工银金行家”公众号发布提示，近期受多重复杂因素叠加影响，贵金属市场价格波动显著加大。为保障资产安全，请投资者密切关注市场动态，理性参与投资交易，切勿盲目追涨杀跌。工行建议坚持“分散投资、长期配置”理念，通过多元化布局有效平滑短期波动风险。（人民财讯）", "ctime": 1793601437, "time_str": "14:37:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source" // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}

  return '#64748b';

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
