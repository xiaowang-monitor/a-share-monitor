豚”影响，未来三天，河北、河南、湖北有强降雨过程，河北南部、河南西部和北部、湖北西部等部分地区发生地质灾害的风险较高。自然资源部于8月10日9时对河北、河南、湖北启动地质灾害防御Ⅳ级响应。自然资源部要求河北、河南、湖北省自然资源主管部门增强风险意识和忧患意识，强化底线思维和极限思维，高度重视强降雨引发地质灾害防范应对，及时组织开展巡查排查，切实做好监测预警、会商研判、灾情险情处置和值班值守、信息报送等工作；中国地质调查局、自然资源部地质灾害技术指导中心加强会商研判和专家调度，全力协助地方做好地质灾害防御工作。（央视新闻）", "ctime": 1786334660, "time_str": "12:04:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260810/c678820656.shtml"}, {"id": "4922993", "title": "港股午评：恒生指数涨0.72%，恒生科技指数涨0.37%", "content": "港股午间收盘，恒生指数涨0.72%，恒生科技指数涨0.37%。恒指港股通ETF银华（159318）涨0.76%，港股通科技ETF鹏华（159751）涨0.55%。板块方面，焦炭加工Ⅲ、焦炭加工Ⅳ板块涨幅靠前；调查和咨询服务、环保设备板块跌幅靠前。个股方面，国泰君安国际涨36.3%，晶泰控股涨9.47%，礼邦医药-B涨9.18%，力量发展涨8.95%，老铺黄金涨8.52%；建滔积层板跌10.43%，深圳国际跌10.41%，伟禄科技股份跌10.19%，珞石机器人跌9.19%，天数智芯跌8.11%。", "ctime": 1786334473, "time_str": "12:01:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260810/c678820617.shtml"}, {"id": "4922987", "title": "葵花药业投资成立医药公司", "content": "企查查APP显示，近日，四川葵花医药有限公司成立，法定代表人为戴瑞全，注册资本为1000万元，经营范围包含：第一类医疗器械销售；第二类医疗器械销售；食品销售（仅销售预包装食品）；保健食品（预包装）销售等。企查查股权穿透显示，该公司由葵花药业全资持股。", "ctime": 1786334432, "time_str": "12:00:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260810/c678820614.shtml"}, {"id": "4922983", "title": "普洛斯上海多园区拓展半导体芯片产业客户", "content": "8月10日，据普洛斯消息，当前，上海正深入实施“人工智能+”行动，加快建设人工智能高地和世界级产业集群。近期，普洛斯上海浦东新区、奉贤区、临港新片区等地多处园区成功拓展半导体芯片产业客户，服务领域涵盖芯片设计、半导体设备及相关产业供应链运营。具体来看，普洛斯上海南汇园中物流园迎来国内领先的模拟芯片设计企业思瑞浦；普洛斯上海奉城物流园与半导体产业供应链服务商泓明供应链达成新的租赁合作；普洛斯上海合庆物流园引入一家国内半导体设备头部企业；普洛斯临港科创棱镜产业园迎来半导体设备头部企业盛美半导体入驻。（澎湃新闻）", "ctime": 1786334143, "time_str": "11:55:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260810/c678820556.shtml"}, {"id": "4922979", "title": "上海发布中心城区暴雨橙色预警 多区发布大风橙色预警信号", "content": "上海市气象台2026年8月10日10时54分更新中心城区暴雨黄色预警信号为暴雨橙色预警信号：预计未来12小时内，中心城区大部6小时累计降水量将达150毫米以上，暴雨黄色预警信号更新为暴雨橙色预警信号，强降雨可能引发城市积涝、交通拥堵等情况，请特别加强防范极端强降雨。此外，金山、青浦、松江、浦东发布大风橙色预警信号。此前发布的台风、黄浦江高潮位、海浪预警信号依旧高挂。（上海发布）", "ctime": 1786334029, "time_str": "11:53:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260810/c678820543.shtml"}, {"id": "4922975", "title": "今年以来深圳各口岸出入境客流屡创新高", "content": "随着亚太经合组织（APEC）第三十三次领导人非正式会议进入倒计时，深圳口岸出入境客流持续攀升。据深圳边检总站统计，截至8月4日，经深圳口岸入出境外国人已突破500万人次，较2025年提前58天达成。（央视新闻）", "ctime": 1786333755, "time_str": "11:49:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260810/c678820485.shtml"}, {"id": "4922973", "title": "科士达：逆变器销往美国规模较小 相关限制措施对整体业务基本无影响", "content": "科士达8月10日在互动平台表示，公司逆变器销往美国规模较小，相关限制措施对公司整体业务基本无影响。", "ctime": 1786333454, "time_str": "11:44:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260810/c678820428.shtml"}, {"id": "4922963", "title": "8月10日午间公告一览：晓鸣股份7月鸡产品销量2128.74万羽，同比增6.82%", "content": "晓鸣股份公告，2026年7月销售鸡产品2128.74万羽，销售收入8864.08万元，环比变动分别为9.44%、18.04%，同比变动分别为6.82%、17.97%；当年累计销售1.64亿羽，销售收入5.81亿元。", "ctime": 1786333219, "time_str": "11:40:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260810/c678820395.shtml"}, {"id": "4922957", "title": "中国卫通加入工信部6G推进组星地融合工作组", "content": "日前，在工业和信息化部信息通信发展司指导下，IMT-2030（6G）推进组星地融合（NTN）工作组在北京正式成立，中国卫通作为首批成员单位受邀加入工作组。NTN工作组主要职责是牵引支撑国内组织开展国际技术标准研制，统筹推进6G星地融合网络总体布局，培育6G卫星通信核心技术，推动产学研用各方协同联动。工作范围涵盖卫星空口接入技术、卫星终端技术、星地融合网络技术和运维与应用技术。（中国卫通）", "ctime": 1786333039, "time_str": "11:37:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260810/c678820261.shtml"}, {"id": "4922945", "title": "ETF两市成交额报3061.31亿元，较上一交易日此时缩量420.84亿元", "content": "截至目前，ETF两市成交额报3061.31亿元，较上一交易日此时缩量420.84亿元，分类型来看，股票型ETF成交额1078.88亿元，债券型ETF成交额1287.32亿元，货币型ETF成交额134.38亿元，商品型ETF成交额53.28亿元，QDII型ETF成交额507.05亿元。", "ctime": 1786332773, "time_str": "11:32:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260810/c678820166.shtml"}, {"id": "4922937", "title": "ETF午评：养殖ETF领涨3.31%，消费电子ETF领跌4.4%", "content": "ETF午间收盘涨跌不一，养殖ETF（159165）领涨3.31%，畜牧养殖ETF（159027）涨3.16%，养殖ETF（159011）涨3.09%，消费电子ETF（159779）领跌4.4%，通信ETF（159994）跌4.3%，通信ETF（515050）跌4.12%。", "ctime": 1786332674, "time_str": "11:31:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260810/c678820132.shtml"}, {"id": "4922933", "title": "A股午评：创业板指高开低走跌2.18%，医疗服务、能源金属、养鸡板块涨幅居前", "content": "A股三大指数早盘涨跌不一，截至午盘，上证指数涨0.2%，深证成指跌1.13%，创业板指跌2.18%，北证50跌0.78%，科创50指数跌1.57%。全市场成交额17452亿元，较上日放量566亿元，全市场超3400只个股上涨。板块题材上，兵装重组概念、医疗服务、能源金属、养鸡、猪肉板块涨幅居前；CPO、元件、通信设备、PCB概念、AI PC板块跌幅居前。盘面上，兵装重组概念板块大幅冲高，湖南天雁、长城军工涨停，建设工业、华强科技、东安动力涨幅居前。医疗服务板块高开高走，百花医药五连板，皓宸医疗、贝瑞基因、金域医学涨停，毕得医药、普瑞眼科、华康洁净涨超10%。猪肉板块持续走高，益生股份涨停，大禹生物、神农集团、傲农生物涨幅居前。CPO板块高开低走，长盈通跌超10%，泰金新能、武汉凡谷、光迅科技、炬光科技跌幅居前。元件板块亦表现疲软，迅捷兴、东山精密、本川智能、生益电子、红板科技跌幅居前。", "ctime": 1786332646, "time_str": "11:30:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260810/c678820126.shtml"}, {"id": "4922929", "title": "股指期货早盘收盘 主力合约多数下跌", "content": "股指期货早盘收盘，主力合约多数下跌。沪深300股指期货(IF)主力合约跌0.42%，上证50股指期货(IH)主力合约涨0.25%，中证500股指期货(IC)主力合约跌0.52%，中证1000股指期货(IM)主力合约跌0.32%。", "ctime": 1786332615, "time_str": "11:30:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260810/c678820116.shtml"}, {"id": "4922911", "title": "国家防总、应急管理部对湖北山东启动防汛四级应急响应", "content": "据气象部门预报，8月10日至13日，受台风“白海豚”影响，湖北中北部、山东等地有暴雨或大暴雨，局地有特大暴雨，山洪和地质灾害、中小河流洪水等风险较高。根据《国家防汛抗旱应急预案》及有关规定，国家防总、应急管理部决定于8月10日8时针对湖北、山东启动防汛四级应急响应。（新华社）", "ctime": 1786332132, "time_str": "11:22:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260810/c678819989.shtml"}, {"id": "4922907", "title": "华沿机器人等在广东横琴成立数智科技公司", "content": "企查查APP显示，近日，华沿数智科技（广东横琴）有限公司成立，法定代表人为董斌，注册资本为1000万元，经营范围包含人工智能基础软件开发；人工智能通用应用系统；区块链技术相关软件和服务；智能机器人销售等。企查查股权穿透显示，该公司由华沿机器人、奥特莱斯商业运营管理（海南）有限公司等共同持股。（人民财讯）", "ctime": 1786331912, "time_str": "11:18:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260810/c678819936.shtml"}, {"id": "4922897", "title": "美媒：特朗普倾向对伊朗经济施压而非军事打击", "content": "美国阿克西奥斯新闻网站9日报道称，美国总统特朗普在接受其采访时，倾向于对伊朗施加经济压力，而非发动新的军事行动。特朗普在此次简短电话采访中表示，“我们正在低调处理此事”。“我们只是与他们（伊朗）进行半正式谈判。我们只是在观望伊朗，他们（面临）严重的通货膨胀以及没钱的事实。”他强调，美国的海上封锁令伊朗的经济雪上加霜。（新华社）", "ctime": 1786331791, "time_str": "11:16:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260810/c678819847.shtml"}, {"id": "4922865", "title": "上海中心城区暴雨预警由黄变橙", "content": "上海市气象台10时54分更新中心城区暴雨黄色预警信号为暴雨橙色预警信号：预计未来12小时内，中心城区大部6小时累积降水量将达150毫米以上，暴雨黄色预警信号更新为暴雨橙色预警信号，强降雨可能引发城市积涝、交通拥堵等情况，请特别加强防范极端强降雨。", "ctime": 1786331179, "time_str": "11:06:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260810/c678819725.shtml"}, {"id": "4922861", "title": "中央政府将在澳门发行60亿元人民币国债", "content": "中华人民共和国财政部和澳门特别行政区政府今日公告，中央政府将于2026年8月20日在澳门发行60亿元人民币国债。2026年是国家“十五五”开局之年，中央政府连续第五年在澳门发行人民币国债，凸显了中央政府对澳门经济适度多元发展及特色金融产业竞争力提升的有力支持。此次国债发行的期限结构更趋多元，有利于进一步完善常态化发行机制，为投资者提供更多安全稳健的人民币投资选项，对持续优化澳门债券市场生态、推动澳门与内地及国际市场互联互通发挥积极作用。（央视新闻）", "ctime": 1786331007, "time_str": "11:03:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260810/c678819689.shtml"}, {"id": "4922859", "title": "广东省新型政策性金融工具培训视频会议（民营企业专场）在广州召开", "content": "近日，广东省发展改革委联合省工商联举办全省新型政策性金融工具培训视频会议（民营企业专场）。会上，广东省发展改革委介绍了2026年新型政策性金融工具的总体要求、重点投向和支持领域，要求各地各部门提高政治站位，充分认识此项工作的重要意义，积极推动广大民营企业参与重大项目建设，切实把政策红利转化为发展实效。下一步，广东省发展改革委将深化与三家政策性银行的日常沟通，全周期跟踪项目申报审批进展，全链条协调破解难点堵点，力争更多优质民营项目纳入国家“盘子”，为全省扩投资、稳增长作出新的更大贡献。（广东省发展改革委）", "ctime": 1786330996, "time_str": "11:03:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260810/c678819688.shtml"}, {"id": "4922837", "title": "美国芝加哥市多起枪击事件已致4死12伤", "content": "据美国方面近日消息称，在刚刚过去的周末，美国芝加哥市发生多起枪击事件，造成多人伤亡。据悉，截至9日，芝加哥周末发生的枪击事件已经造成至少4人死亡、12人受伤，部分人伤情严重。警方尚未逮捕任何嫌疑人。（央视新闻）", "ctime": 1786330601, "time_str": "10:56:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260810/c678819574.shtml"}, {"id": "4922835", "title": "捷豹路虎宣布路虎卫士110 HSE限时降价至72.8万元起", "content": "捷豹路虎宣布，2026年8月1日至9月30日，路虎卫士110 HSE推出限时价72.8万元起，最终价格以消费者与经销商协商为准。此前，该车型官方指导价为89.9万元。今年以来，BBA等豪车品牌也对部分燃油车型进行了官方降价。（第一财经）", "ctime": 1786330561, "time_str": "10:56:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260810/c678819551.shtml"}, {"id": "4922827", "title": "受台风影响，长江江苏段船舶全部停航", "content": "今日上午10时，江苏南通市公安局交管支队发布消息，受台风“白海豚”影响，苏通大桥、沪苏通大桥特级管制，禁止车辆通行。崇启大桥一级管制，限速40km/h，除小型客车外，其余车辆禁止通行。截至目前，长江江苏段船舶已全部停航，装卸作业全部停止。江苏海事局辖区18条渡线全部停航。动态更新203艘拖轮、68艘工程船等应急力量部署点位，安排84名执法人员随船驻守。（央视新闻）", "ctime": 1786330343, "time_str": "10:52:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260810/c678819444.shtml"}, {"id": "4922825", "title": "科创50指数跌幅扩大至2%", "content": "科创50指数跌幅扩大至2%，现报1708.99点。", "ctime": 1786330143, "time_str": "10:49:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260810/c678819331.shtml"}, {"id": "4922817", "title": "沪深京三市成交额超1. // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}
