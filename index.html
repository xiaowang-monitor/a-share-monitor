"集邦咨询：三季度存储器价格受AI服务器支撑，但涨幅收敛", "content": "根据TrendForce集邦咨询最新存储器价格调查，2026年第三季度整体DRAM格局持续极度紧缺，但因消费级应用需求下修及高基期作用，合约价涨幅收敛，预计将季增13%—18%。NAND Flash主要需求仍由AI推理与大型数据中心建设支撑，但因合约价格已达历史高点，消费端客户在需求放缓的情况下，对价格承受力已达极限，预估整体NAND Flash合约价将季增10%—15%，幅度较前几季明显缩减。（人民财讯）", "ctime": 1783054574, "time_str": "12:56:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260703/c677926688.shtml"}, {"id": "4649597", "title": "伊朗为已故最高领袖哈梅内伊举行遗体告别仪式", "content": "当地时间7月3日，伊朗为已故最高领袖哈梅内伊举行遗体告别仪式。伊朗各界人士、宗教领袖以及多国官员出席。(央视新闻)", "ctime": 1783054508, "time_str": "12:55:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260703/c677926682.shtml"}, {"id": "4649589", "title": "韩国综指涨幅扩大至5%", "content": "韩国综指涨幅扩大至5%，现报8031.69点。个股方面，SK海力士、三星电子涨超9%。", "ctime": 1783054377, "time_str": "12:52:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260703/c677926659.shtml"}, {"id": "4649577", "title": "韩国交易所启动KOSPI指数熔断机制，暂停程序化买盘", "content": "韩国交易所启动KOSPI指数熔断机制，暂停程序化买盘。", "ctime": 1783054271, "time_str": "12:51:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260703/c677926642.shtml"}, {"id": "4649561", "title": "降低物流成本国铁集团常态化开行“三农”物资班列", "content": "今天（3日），国铁集团与中华全国供销合作总社签署战略合作协议，充分发挥各自优势，常态化开行涉及棉花、粮食、化肥等“三农”物资班列，降低物流成本，助力纵深推进全国统一大市场建设。(央视新闻)", "ctime": 1783054047, "time_str": "12:47:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260703/c677926618.shtml"}, {"id": "4649553", "title": "何小鹏：小鹏GX本月产能将提升10%", "content": "小鹏集团董事长、CEO何小鹏今日接受记者采访时表示，小鹏MONA L03顶配版本订单占绝大多数，此前一日发布的小鹏MONA L03打破小鹏所有车型同期小订纪录。何小鹏同时透露，小鹏GX产能在本月将提升10%，到四季度销量有望冲击该细分市场前三。（财联社）", "ctime": 1783053553, "time_str": "12:39:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260703/c677926504.shtml"}, {"id": "4649547", "title": "今年第10号台风“美莎克”即将登陆海南，成为今年首个登陆我国的台风", "content": "今年第10号台风“美莎克”已于今天（7月3日）凌晨生成，即将登陆海南，成为今年的初台风。大数据显示，初台风多在6至7月登陆我国，广东最受青睐，海南排名第三。今年的“美莎克”属于典型的南海台风，生成后快速登陆，生命史较短，强度可能为热带风暴或强热带风暴级。尽管强度不大，但仍会给华南带来持续性强降雨，海南、广东、广西需防范次生灾害。（央视新闻）", "ctime": 1783053221, "time_str": "12:33:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260703/c677926446.shtml"}, {"id": "4649545", "title": "摩尔线程全功能GPU获百度飞桨III级兼容性认证", "content": "记者从国产GPU厂商摩尔线程处获悉，该公司旗舰级AI训推一体智算卡MTT S5000与百度旗下的深度学习平台百度飞桨（PaddlePaddle）完成III级兼容性测试。双方在兼容性方面表现优异，系统整体运行稳定可靠。目前，Paddle-MUSA算子适配率已达91%，能够为大语言模型、OCR、图像分类、目标检测、图像分割、推荐系统等应用场景提供稳定的运行基础。（每经）", "ctime": 1783053213, "time_str": "12:33:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260703/c677926444.shtml"}, {"id": "4649539", "title": "中国第16次北冰洋考察队起航", "content": "7月3日，由自然资源部组织的中国第16次北冰洋考察队“雪龙”号、“雪龙2”号、“极地”号从辽宁大连起航，奔赴北冰洋。这是“十五五”开局之年我国组织实施的首次北冰洋考察，由上述三艘船以及“探索三号”四船共同实施，预计10月上旬完成考察任务。（新华社）", "ctime": 1783052996, "time_str": "12:29:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260703/c677926394.shtml"}, {"id": "4649517", "title": "国家药监局公开征求《中药饮片追溯码编码技术指南（征求意见稿）》等两项信息化标准意见", "content": "国家药品监督管理局信息中心组织起草《中药饮片追溯码编码技术指南（征求意见稿）》《中药饮片追溯基本数据集（征求意见稿）》两项信息化标准，现向社会公开征求意见。公开征求意见的时间是2026年7月3日—8月3日。", "ctime": 1783052183, "time_str": "12:16:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260703/c677926226.shtml"}, {"id": "4649515", "title": "日本宫古岛西北近海发生6.4级地震", "content": "据日本气象厅3日消息，当地时间当天13时05分左右，日本宫古岛西北附近海域发生6.4级地震，最大震感为震度3，震源深度极浅。（央视新闻）", "ctime": 1783052152, "time_str": "12:15:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260703/c677926223.shtml"}, {"id": "4649509", "title": "韩国综指涨幅扩大至4%", "content": "韩国综指涨幅扩大至4%，现报7953.98点。个股方面，三星电子涨超8%，SK海力士涨超6%。", "ctime": 1783051988, "time_str": "12:13:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260703/c677926206.shtml"}, {"id": "4649507", "title": "美的集团旗下库卡机器人增资", "content": "企查查APP显示，近日，库卡机器人自动化（广东）股份有限公司发生工商变更，注册资本增至约10.04亿元，企业类型由其他股份有限公司（非上市）变更为股份有限公司（外商投资、未上市）。企查查显示，该公司成立于2017年3月，董事长、法定代表人为顾炎民，由美的集团全资持股。（人民财讯）", "ctime": 1783051961, "time_str": "12:12:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260703/c677926204.shtml"}, {"id": "4649503", "title": "7月3日午间公告一览：大金重工公司H股调入港股通标的证券名单", "content": "大金重工公告，公司境外上市外资股（H股）调入港股通标的证券名单。", "ctime": 1783051923, "time_str": "12:12:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260703/c677926194.shtml"}, {"id": "4649501", "title": "世界气象组织：厄尔尼诺预计将快速增强并加剧极端天气风险", "content": "当地时间3日，世界气象组织发布报告指出，热带太平洋已出现厄尔尼诺现象，预计未来几个月将快速增强，导致全球多地可能出现热浪、干旱、强降雨等极端天气事件。世界气象组织预计2026年7月至9月期间厄尔尼诺现象将发展为强厄尔尼诺事件，多模型集合预报表明，赤道中东太平洋海温将显著升高，预计厄尔尼诺现象将在北半球秋季继续加强，其影响将扩展至全球多个区域。世界气象组织秘书长绍洛表示，厄尔尼诺现象已经出现，并预计将快速增强为强厄尔尼诺事件，这将加剧全球多地出现干旱、强降雨以及陆地和海洋热浪的风险。世界气象组织正在加强协调气候信息服务和预警支持，以帮助各国政府、人道主义机构、农业和卫生等气候敏感部门以及脆弱社区为潜在的影响做好准备。", "ctime": 1783051632, "time_str": "12:07:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260703/c677926095.shtml"}, {"id": "4649497", "title": "港股午评：恒生指数涨1.57%，恒生科技指数涨2.02%", "content": "港股午间收盘，恒生指数涨1.57%，恒生科技指数涨2.02%。恒指港股通ETF银华（159318）涨2.7%，港股通科技ETF鹏华（159751）涨1.67%。板块方面，汽车、金属与采矿板块涨幅靠前；水务板块跌幅靠前。个股方面，埃斯顿涨21.5%，中科闻歌涨18.89%，嘉耀控股涨17.64%，赤峰黄金涨16.22%，灵宝黄金涨16.14%；云迹跌18.46%，英矽智能跌6.84%，驭势科技跌6.03%，安克创新跌5.48%，迅策跌4.93%。", "ctime": 1783051504, "time_str": "12:05:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260703/c677926070.shtml"}, {"id": "4649477", "title": "兆龙互连：公司上半年订单稳步上升 各下游板块需求景气度持续向好", "content": "兆龙互连7月2日接受机构调研时表示，公司上半年订单随着新产能的释放呈稳步上升，各下游板块需求景气度持续向好。其中高速互连、万兆布线、工业应用等业务市场需求较饱满。现阶段铜等核心原材料价格维持高位，新产线的扩建，新员工扩招等因素，短期内对业务毛利率带来一定承压。公司将持续优化产品结构，高附加值产品具备良好的毛利水平；后续将持续提升高速互连、工业互连、万兆布线等高附加值产品营收占比，依靠产品结构升级带动综合毛利率稳步改善。（人民财讯）", "ctime": 1783050649, "time_str": "11:50:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260703/c677925925.shtml"}, {"id": "4649473", "title": "《2026中国具身智能产业发展报告》发布", "content": "作为国内首个全域聚焦具身智能的专业行业展，2026上海国际具身智能产业博览会（CIEI 2026）正在国家会展中心（上海）举办。《2026中国具身智能产业发展报告》在展会期间发布。《报告》显示，当前全球具身智能产业格局呈现“中美双核驱动、欧日韩追赶”的竞争态势。其中，美国凭借在AI基础研究、大模型训练和风险投资方面的绝对优势，在具身智能的“大脑”层面保持领先。中国在全球具身智能产业中展现出独特的竞争优势，一方面，中国拥有全球最完整的机器人硬件供应链，涵盖电机、减速器、丝杠、传感器、控制器等全产业链环节，成本仅为欧美的40-60%；另一方面，中国丰富的制造业和服务业应用场景为具身智能提供了海量训练数据和落地机会。同时，国家政策持续加码，从中央到地方形成了系统化的产业支持体系。（上观新闻）", "ctime": 1783050488, "time_str": "11:48:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260703/c677925750.shtml"}, {"id": "4649461", "title": "广东湛江启动防热带气旋Ⅱ级应急响应", "content": "记者从广东湛江海事局了解到，受台风“美莎克”影响，湛江港、雷州半岛东部及西部沿海、琼州海峡北岸各台风警报站已同步升挂三号风球。为有效防范台风风险，湛江海事局于7月3日7时启动防热带气旋Ⅱ级应急响应，部署各项海上防台防御工作。为防范海上风险，湛江海事局对海上施工船、采运砂船、风电运维船、危险品船等重点船舶开展排查复核，核实船舶停泊位置、装载状态及人员撤离情况。 （央视新闻）", "ctime": 1783049875, "time_str": "11:37:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260703/c677925583.shtml"}, {"id": "4649457", "title": "湖南省金芙蓉智能衡器计量及智能制造产业基金成立", "content": "企查查APP显示，近日，湖南省金芙蓉智能衡器计量及智能制造产业基金合伙企业（有限合伙）成立，出资额约7.89亿元，经营范围包含以私募基金从事股权投资、投资管理、资产管理等活动。企查查股权穿透显示，该合伙企业由湖南省金芙蓉产业引导基金合伙企业（有限合伙）、浙江天澄新能源开发有限公司、曼恩斯特(301325)全资子公司深圳市曼恩斯特创投管理有限公司等共同持股。（人民财讯）", "ctime": 1783049844, "time_str": "11:37:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260703/c677925571.shtml"}, {"id": "4649455", "title": "A股午评：创业板指震荡走强涨1.58% 贵金属、机器人概念领涨", "content": "截至午盘，上证指数涨0.69%，深证成指涨1.39%，创业板指涨1.58%，北证50涨1.52%。三市成交额20741亿元，较上一日缩量1833亿元。全市场超3500家个股上涨。板块题材上，贵金属、电机、军工装备板块涨幅居前；氟化工、游戏概念板块跌幅居前。\n盘面上，贵金属板块震荡走强，招金黄金、赤峰黄金2连板，山金国际、西部黄金、四川黄金涨停，晓程科技涨超10%，山东黄金、中金黄金、紫金矿业、湖南黄金、兴业银锡跟涨。电机板块走高，大洋电机、卧龙电驱涨停，晨光电机涨超10%，江苏雷利、兆威机电、微光股份、鸣志电器、方正电机跟涨。军工装备板块持续走高，隆达股份盘中创新高，甘化科工2连板，航发科技涨停，中简科技涨超15%，爱乐达、天秦装备、广联航空、通易航天、航天环宇跟涨。氟化工概念今日大幅调整，晶瑞电材、泰和科技、金宏气体跌超10%，多氟多、滨化股份、江化微、中欣氟材、三美股份跟跌。游戏板块震荡回落，大晟文化跌近7%，昆仑万维跌近6%，中青宝、完美世界、冰川网络跟跌。", "ctime": 1783049583, "time_str": "11:33:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260703/c677925412.shtml"}, {"id": "4649441", "title": "俄罗斯采取措施稳定国内燃料供应", "content": "俄罗斯副总理诺瓦克日前指示俄相关部门和企业制定具体措施，以稳定燃料供应形势最严峻地区的供应。 塔斯社2日报道，诺瓦克表示，俄拥有充足的燃料储备，可满足国内市场需求，但抢购潮导致需求增加20%至30%。个别加油站油品短缺，是炼油厂向特定油库和加油站配送物流调整所致，重新调整物流系统需要时间。他还表示，为保障国内供应，俄或将出台短期柴油出口禁令。 俄总统普京日前在一场有关俄国内燃料供应情况的会议上说，必须最大限度减少乌克兰袭击对俄民用设施和基础设施造成的后果。 普京说，当前俄大型炼油厂已满负荷运转，同时充分挖掘了中小企业的潜力。预计7月份的初级燃料产量将超过6月份。为保护国内消费者利益，俄已暂时禁止出口汽油和部分燃料，正考虑全面禁止出口柴油。 此外，一些国家表示愿为俄供应燃料，以缓解其燃料短缺状况。据国际文传电讯社2日报道，哈萨克斯坦能源部表示，在保障本国供应的基础上，如果收到俄政府正式请求，哈萨克斯坦准备向俄供应燃料。 印度石油和天然气部长哈迪普·辛格·普里表示，如有需要，印度可能向俄供应燃料。路透社援引消息人士的话报道说，至少已有6万吨汽油从印度运往俄罗斯。另一消息人士说，俄罗斯计划每月从包括白俄罗斯在内的多个国家进口40万吨汽油。(新华社)", "ctime": 1783049413, "time_str": "11:30:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260703/c677925346.shtml"}, {"id": "4649425", "title": "中国发布全球首个地层学AI大模型 给地球建“共享数据库”", "content": "记者今天（7月3日）从正在苏州举行的第五届国际地层学大会上获悉，中国科学家面向全球发布了首个地层学AI大模型及智能全球地层剖面对比系统等新工具。这意味着，地球46亿年的演化历史将首次拥有一个全球共享的数据库。地层学是解读地球演化历史的基础学科，可以为人类认识生命起源、资源分布、气候演变提供核心科学依据。中国科学院院士、国际地层委员会副主席沈树忠介绍，希望通过时间轴和全球大数据的方式，能够把地球46亿年历史的所有地质记录，按照统一的时间标准进行排序。中国在地层学领域拥有很强的硬实力。目前，我国已发现11颗“金钉子”，也就是全球界线层型剖面和点位，数量稳居世界前列。这些“金钉子”的发现，为地球的演化历史标定了国际通用的“刻度”，给全球地质研究提供了统一的参照系。（央视新闻）", "ctime": 1783049282, "time_str": "11:28:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260703/c677925251.shtml"}, {"id": "4649421", "title": "中国乘用车欧洲市场份额首超日本", "content": "欧洲汽车制造商协会最新统计数据显示，5月中国乘用车在欧洲市场份额首次超过日本。 数据显示，5月，五家中国汽车制造商在31个欧洲国家共售出13.84万辆汽车，同比增长65%；六家日本汽车制造商在欧洲31国的汽车销量为13.04万辆，同比下降3%。 《日本经济新闻》报道称，日本企业在混合动力汽车的燃油效率方面有较高口碑，但由于电动汽车产品线有限，难以享受到欧洲各国优惠政策红利。报道引用德国汽车研究中心业务发展总监贝娅特丽克丝·凯姆的话说：“欧洲消费者在考虑购买电动汽车时，不会将日本车列为备选。” 报道还说，日本汽车存在感日益下降，而中国汽车在欧洲市场的影响力则与日俱增。(新华社)", "ctime": 1783049222, "time_str": "11:27:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260703/c677925189.shtml"}, {"id": "4649411", "title": "染料板块持续走弱", "content": "染料板块持续走弱，信凯科技跌超9%，怡达股份、福莱蒽特、润禾材料、鼎龙科技跟跌 ", "ctime": 1783048853, "time_str": "11:20:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260703/c677925087.shtml"}, {"id": "4649401", "title": "中国光伏行业协会人士：强制标准实施将打破光伏“内卷式”竞争", "content": "在今日举行的第二届晶硅光伏产业创新峰会上，中国光伏行业协会有关负责人表示，光伏组件强制性安全标准、能效标准有利于规范光伏行业竞争秩序，推动产业升级发展。下一步，协会将根据强制标准的要求，配合相关主管部门，进一步研究节能监察具体实施细则。光伏行业有了“一把尺子”，是很好的开端，央国企集采已经先行采用二级及以上标准（TOPcon2.0/BC1.0）。工信部近日联合国家发改委、市场监管总局发布的《硅单晶单位产品能源消耗限额》等三项强制性能效国家标准，将于2027年1月1日正式实施；由工信部组织制定的《光伏组件安全要求》等2项强制性安全国家标准5月25日正式发布，将于2027年6月1日正式实施。（财联社）", "ctime": 1783048766, "time_str": "11:19:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260703/c677925057.shtml"}, {"id": "4649395", "title": "比依股份成立机器人科技公司 含多项AI业务", "content": "企查查APP显示，近日，浙江致衡机器人科技有限公司成立，经营范围包含智能机器人的研发；人工智能硬件销售；人工智能应用软件开发；可穿戴智能设备制造；人工智能行业应用系统集成服务；人工智能基础软件开发等。企查查股权穿透显示，该公司由比依股份全资持股。（人民财讯）", "ctime": 1783048729, "time_str": "11:18:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260703/c677925033.shtml"}, {"id": "4649391", "title": "教育部：严控暑期作业总量，杜绝用手机布置作业", "content": "记者3日从教育部获悉，《关于做好2026年中小学、幼儿园暑期安全工作的通知》于近日印发，要求各地各校严控暑期作业总量，坚决杜绝用手机布置作业、要求学生利用手机完成作业或要求家长检查批改作业等现象，严禁在暑期及假期前后组织面向学生的区域性、校际性统一考试或测验，不得以“夏令营”“研学”等名义变相组织考试或测试。（央视新闻）", "ctime": 1783048545, "time_str": "11:15:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260703/c677924952.shtml"}, {"id": "4649389", "title": "美拒绝承认国际刑事法院对美国人有司法管辖权", "content": "美国司法部2日发表声明称，美国代理司法部长托德·布兰奇已致信国际刑事法院院长赤根智子，拒绝承认国际刑事法院对美国人有司法管辖权。 声明说，美国不是《国际刑事法院罗马规约》缔约国，也从未认可过国际刑事法院的管辖权。今后，美国将不会配合国际刑事法院开展任何调查、询问、传唤或诉讼程序，不会将任何美国人员引渡或移交国际刑事法院。 布兰奇在信中声称，国际刑事法院行事“越来越缺乏合法性和正当性”，并指称国际刑事法院有“选择性执法”的记录，且有“可信说法”称其内部有不当行为。 6月24日，国际刑事法院3名女法官在美国纽约联邦法院起诉美国总统特朗普及其政府，指控此前对她们实施的制裁措施非法。 近年来，美方以国际刑事法院调查美方人员和对以色列总理和前防长发出逮捕令为由，多次宣布制裁国际刑事法院法官和检察官。(新华社)", "ctime": 1783048357, "time_str": "11:12:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260703/c677924892.shtml"}, {"id": "4649387", "title": "非洲疾控中心说刚果（金）埃博拉疫情仍“非常严重”", "content": "非洲疾病预防控制中心主任卡塞亚2日在刚果（金）首都金沙萨说，该国本轮埃博拉疫情仍“非常严重”，确诊病例和死亡病例增长较快。刚果（金）政府2日晚发布的疫情数据显示，截至1日，该国本轮埃博拉疫情累计报告确诊病例1460例，其中死亡447例，595名患者正在隔离或接受治疗，213人治愈。（央视新闻）", "ctime": 1783048347, "time_str": "11:12:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260703/c677924888.shtml"}, {"id": "4649377", "title": "博腾双载荷ADC IND成功交付", "content": "近期，博腾一站式蛋白与偶联药物CDMO平台成功完成双载荷ADC工艺开发与GMP IND临床样品全流程交付，涵盖Payload-Linker、抗体、ADC研发、生产等核心环节，完整落地从工艺研发到注册样品放行全流程服务。此次双载荷ADC IND临床样品的成功交付，充分验证了博腾平台在复杂偶联药物领域的技术实力。(人民财讯)", "ctime": 1783048031, "time_str": "11:07:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260703/c677924787.shtml"}, {"id": "4649373", "title": "AI催热Micro LED光互连：2027年商用预期升温", "content": "在慕尼黑上海电子展上，思特威新一代高速光互连方案首次亮相，其高速光互连BG联席总经理王文轩透露：“Micro LED高速光互连方案有望在2027年商用落地。”随着大模型对数据中心传输速率的需求激增，传统铜缆在带宽、功耗和传输距离上已显疲态，“光进铜退”已成为必然趋势。然而，在光互连从板级向芯片间深入的过程中，传统的激光光源方案因不耐高温等物理特性限制，难以在极短距离内直接集成。因此，在CPO光源中，除了主流的硅光集成方案和VCSEL（垂直腔面发射激光器）方案外，Micro LED作为一种新兴的光互连光源正异军突起。（21财经）", "ctime": 1783047924, "time_str": "11:05:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260703/c677924718.shtml"}, {"id": "4649371", "title": "雷电、大风双预警 北京自北向南将出现雷阵雨并伴有阵风和冰雹", "content": "北京市气象台今天10时15分发布雷电黄色预警和大风蓝色预警。雷电黄色预警，北京将自北向南先后出现雷阵雨天气。预计，7月3日16时至22时，北京市自北向南将先后出现雷阵雨天气，影响城区的主要时段为3日18时至20时。延庆、怀柔、密云、平谷、昌平、顺义等区的局地短时雨强较大，并伴有8级以上阵风和冰雹。大风蓝色预警，延庆怀柔等区局地阵风可达8至10级。受雷雨云团影响，预计7月3日16时至22时，北京市自北向南将先后出现7级以上短时大风，影响城区的主要时段为3日18时至20时。其中，延庆、怀柔、密云、平谷、昌平、顺义等区的局地阵风可达8至10级，请注意防范。（央视新闻）", "ctime": 1783047665, "time_str": "11:01:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260703/c677924482.shtml"}, {"id": "4649361", "title": "央行6月公开市场国债买卖净投放100亿元", "content": "中国人民银行日前公布的2026年6月份各项工具流动性投放情况显示，当月，公开市场国债买卖净投放100亿元。据统计，今年前6个月，公开市场国债买卖净投放累计3000亿元。中国人民银行发布的2026年第一季度货币政策执行报告称，今年以来，中国人民银行常态化开展国债买卖操作，根据基础货币投放需要和债券市场运行情况，灵活调整操作规模。6月投放情况还显示，当月，中期借贷便利（MLF）净投放2000亿元，其他结构性货币政策工具净回笼1372亿元。此外，7天期逆回购净投放5826亿元，其他期限逆回购净投放3000亿元。（新华社）", "ctime": 1783047435, "time_str": "10:57:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260703/c677924409.shtml"}, {"id": "4649347", "title": "印尼北部海域发生6.2级地震", "content": "据印尼气象、气候和地球物理局发布的报告，当地时间7月3日9时31分，印尼北马鲁古省东北58公里海域发生6.2级地震。（央视新闻）", "ctime": 1783047129, "time_str": "10:52:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260703/c6 // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
