  color: var(--text-primary);

.card {

  border-radius: 12px;
  padding: 20px;
  transition: all 0.2s;
}
.card:hover { background: var(--bg-card-hover); border-color: #334155; }
.badge {
  display: inline-flex; align-items: center; padding: 2px 8px;
  border-radius: 6px; font-size: 12px; font-weight: 500;
}
.badge-s { background: rgba(239,68,68,0.2); color: #ef4444; }
.badge-a { background: rgba(245,158,11,0.2); color: #f59e0b; }
.badge-b { background: rgba(59,130,246,0.2); color: #3b82f6; }
.badge-c { background: rgba(100,116,139,0.2); color: #94a3b8; }
.score-bar {
  height: 6px; border-radius: 3px; background: #1e293b; overflow: hidden;
}
.score-bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s; }
.up { color: var(--red); }
.down { color: var(--green); }
.pulse { animation: pulse 2s infinite; }
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}
.glow { box-shadow: 0 0 20px rgba(59,130,246,0.15); }
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg-primary); }
::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
</style>

企稳，中国消费总量扩容、医药产业创新与国际化的趋势依然明确，结构性机会始终存在。李勇进认为，消费和医药是驱动中国经济社会迈向更高层次的双轮，也是人民美好生活的基石，长期产业方向和投资机会清晰，短期压力终将转化为发展动力。（上证报）", "ctime": 1783677268, "time_str": "17:54:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260710/c678101965.shtml"}, {"id": "4696327", "title": "国务院任免国家工作人员 任命范必为国务院研究室副主任", "content": "国务院任免国家工作人员。任命范必为国务院研究室副主任；任命唐洪武为中山大学校长（副部长级）。（人社部）", "ctime": 1783676975, "time_str": "17:49:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260710/c678101787.shtml"}, {"id": "4696319", "title": "国家海洋预报台发布海浪红色警报、风暴潮橙色警报", "content": "记者从自然资源部获悉，受今年第9号台风“巴威”的影响，今天（10日）下午国家海洋预报台发布海浪红色警报及风暴潮橙色警报。记者获悉，海浪红色警报今天下午，国家海洋预报台发布海浪红色警报。预计7月10日下午到11日下午，东海南部将出现9到14米的狂涛到怒涛区，东海北部、台湾海峡将出现4到6米的巨浪到狂浪区，近海海域海浪预警级别为红色；浙江、福建北部近岸海域将出现5到8米的巨浪到狂浪，该近岸海域海浪预警级别为红色，上海近岸海域将出现3到4.5米的大浪到巨浪，该近岸海域海浪预警级别为橙色，福建南部近岸海域将出现3到4米的大浪到巨浪，该近岸海域海浪预警级别为黄色，江苏南部近岸海域将出现2到3米的中浪到大浪，该近岸海域海浪预警级别为蓝色。请在上述海域作业的船只注意安全，沿海各有关单位提前采取防浪避浪措施。风暴潮橙色警报国家海洋预报台今天16时发布风暴潮橙色警报。预计7月10日夜间至11日傍晚，江苏南通到浙江宁波沿海将出现50到120厘米的风暴增水，浙江台州到温州沿海将出现100到200厘米的风暴增水，福建沿海将出现70到150厘米的风暴增水。浙江省温州市的风暴潮预警级别为橙色，福建省福州市的风暴潮预警级别为黄色，浙江省舟山市、宁波市、台州市和福建省宁德市的风暴潮预警级别为蓝色。（央视新闻）", "ctime": 1783676918, "time_str": "17:48:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260710/c678101751.shtml"}, {"id": "4696313", "title": "广西多地汛情趋缓 子弟兵持续奋战推进清淤安置", "content": "连日来，受台风“美莎克”带来的极端强降雨影响，广西多地遭受严重洪水灾害。目前，广西南宁、贵港、钦州、梧州等地洪涝水位逐步回落，全区防汛抢险工作转入群众安置、道路清淤、排涝消杀等阶段。解放军、武警部队官兵及各地民兵预备役人员闻令而动、接续鏖战，全力协助灾区生产生活秩序恢复。南部战区陆军调配1000余名官兵持续驻守各受灾点位，靠前开展河堤水库全天候巡查，防范滑坡、积水等次生灾害风险，分片协助村镇做好转移群众安置管理和灾后隐患排查工作。南部战区空军各部队出动400余名官兵、40余台救援车辆，投入横州市校椅镇救援，携带专业工具分组开展街道排涝、路面清淤，配合地方完善临时安置点配套保障。（新华社）", "ctime": 1783676809, "time_str": "17:46:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260710/c678101696.shtml"}, {"id": "4696305", "title": "海正药业：预计2026年上半年净利润同比增加100.62%到117.34%", "content": "海正药业公告，预计2026年半年度实现归属于上市公司股东的净利润为6亿元到6.5亿元，与上年同期相比，将增加3.01亿元到3.51亿元，同比增加100.62%到117.34%。预计2026年半年度实现归属于上市公司股东的扣除非经常性损益后的净利润4.9亿元到5.3亿元，与上年同期相比，将增加1.69亿元到2.09亿元，同比增加52.54%到64.99%。", "ctime": 1783676737, "time_str": "17:45:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260710/c678101635.shtml"}, {"id": "4696301", "title": "龙源电力：6月发电量同比下降7.48%", "content": "龙源电力公告，2026年6月按合并报表口径完成发电量534.88万兆瓦时，较2025年同期同比下降7.48%。本月风电发电量同比下降9.73%，太阳能发电量同比下降0.63%。截至2026年6月30日，2026年累计完成发电量3878.28万兆瓦时，较2025年同期同比下降2.19%，其中风电同比下降6.67%，太阳能发电同比增长22.22%。", "ctime": 1783676722, "time_str": "17:45:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260710/c678101621.shtml"}, {"id": "4696285", "title": "晶合集成：华勤通讯香港有限公司及其一致行动人持股比例降至10.00%", "content": "晶合集成公告，华勤通讯香港有限公司及其一致行动人华勤技术股份有限公司、合肥勤合电子科技有限公司因公司发行境外上市股份（H股）致总股本增加，合计持股比例由11.00%被动稀释至9.93%。随后，华勤通讯香港有限公司于2026年7月10日通过香港联合交易所有限公司系统以集中竞价方式增持公司H股股份162.82万股，占公司境外上市后总股本的0.07%。本次权益变动后，合计持股比例由9.93%增长至10.00%，触及5%的整数倍刻度。", "ctime": 1783676585, "time_str": "17:43:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260710/c678101562.shtml"}, {"id": "4696281", "title": "百亿私募上半年平均盈利13.36%，总数增至142家", "content": "第三方机构私募排排网最新数据显示，截至6月30日，百亿级证券私募机构数量已达142家，较去年底增加29家，较5月末增加3家，再次刷新历史纪录。同时，有业绩记录的100家百亿私募今年上半年平均收益达13.36%，显著跑赢同期沪深300指数7.55%的涨幅。此外，上半年取得正收益的百亿私募占比达91%，其中收益率超过20%的机构有27家。(中证金牛座)", "ctime": 1783676569, "time_str": "17:42:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260710/c678101556.shtml"}, {"id": "4696277", "title": "慧辰股份：多名股东拟减持股份", "content": "慧辰股份公告，琢朴管理因自身资金需求拟通过竞价交易和大宗交易方式减持公司股份合计不超过106.3万股，不超过公司当前总股本的1.3990%；韩丁拟通过竞价交易方式减持不超过22500股，不超过0.0296%；何东炯拟通过竞价交易方式减持不超过12500股，不超过0.0165%。减持期间为2026年8月3日～2026年11月2日。", "ctime": 1783676517, "time_str": "17:41:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260710/c678101534.shtml"}, {"id": "4696273", "title": "ST葫芦娃：获得2项药品注册证书", "content": "ST葫芦娃公告，公司及全资子公司广西维威制药有限公司近日分别收到国家药品监督管理局核准签发的盐酸纳洛酮注射液（规格2ml:2mg）、氨溴特罗口服溶液（规格100ml：盐酸氨溴索150mg与盐酸克仑特罗100μg）的《药品注册证书》。其中盐酸纳洛酮注射液累计投入研发费用339.01万元，氨溴特罗口服溶液累计投入研发费用151.49万元。", "ctime": 1783676507, "time_str": "17:41:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260710/c678101528.shtml"}, {"id": "4696261", "title": "中国人寿：拟出资49.99亿元与关联方共同成立半导体产业基金", "content": "中国人寿公告，公司拟作为有限合伙人与关联方国寿产业投资管理有限公司于2026年12月31日前订立合伙协议，成立天津晟和芯程股权投资基金合伙企业（有限合伙）。合伙企业全体合伙人认缴出资总额为人民币50亿元，其中中国人寿认缴出资额49.99亿元，国寿产业认缴出资额100万元。国寿资本投资有限公司将作为管理人。合伙企业存续期8年，重点投资于半导体行业公司。本次交易构成关联交易，未构成重大资产重组，未达到股东会审议标准。", "ctime": 1783676444, "time_str": "17:40:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260710/c678101505.shtml"}, {"id": "4696253", "title": "安彩高科：预计2026年半年度亏损2.8亿-3.3亿元，上年同期亏损2.15亿元", "content": "安彩高科公告，预计2026年半年度归属于上市公司股东的净利润为-2.8亿元到-3.3亿元，与上年同期-2.15亿元相比，亏损增加6451万元至1.15亿元；预计扣除非经常性损益的净利润为-2.83亿元到-3.33亿元，上年同期为-2.25亿元。业绩预亏主要因光伏玻璃行业仍处低谷期，产品价格处于历史低位，导致光伏玻璃业务毛利率同比下滑，同时基于谨慎性原则对存在减值迹象的存货计提减值准备。", "ctime": 1783676394, "time_str": "17:39:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260710/c678101452.shtml"}, {"id": "4696245", "title": "新五丰：上半年生猪销量276.02万头，同比增13.43%", "content": "新五丰公告，2026年1-6月公司销售生猪数量276.02万头，其中销售商品猪157.82万头；主要产品生猪销售量276.02万头，销售量同比增长13.43%，商品猪销价10.18元/公斤。6月生猪销量当月37.2万头、累计276.02万头，商品猪销量当月19.42万头、累计157.82万头，商品猪销价9.16元/公斤。", "ctime": 1783676298, "time_str": "17:38:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260710/c678101412.shtml"}, {"id": "4696243", "title": "兰石重装：预计2026年上半年净亏损1.8亿元至1.44亿元", "content": "兰石重装公告，预计2026年半年度实现归属于母公司所有者的净亏损为1.8亿元至1.44亿元，上年同期净利润为393.7万元。预计2026年半年度实现归属于母公司所有者的扣除非经常性损益后的净亏损为2亿元至1.64亿元。经营层面，公司传统能源装备行业市场竞争加剧，产品售价走低，营业收入规模未达盈亏平衡水平；同时公司金属新材料业务市场开拓不及预期，新产线产能释放不足导致固定成本难以充分摊销，上述情况导致公司出现经营亏损；资产减值层面，个别下游客户开展债务化解突发进入破产清算程序，公司对应计提了信用减值损失，进一步加大亏损。除此以外，本期发生的非经常性损益事项，对归属于上市公司股东的净利润的影响约为2000万元。", "ctime": 1783676286, "time_str": "17:38:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260710/c678101407.shtml"}, {"id": "4696241", "title": "洛阳钼业：预计2026年上半年净利润同比增长78.76%到90.29%", "content": "洛阳钼业公告，预计2026年上半年实现归属于上市公司股东的净利润为155亿元到165亿元，与上年同期相比增加68.29亿元到78.29亿元，同比增加78.76%到90.29%。预计2026年上半年实现归属于上市公司股东的扣除非经常性损益的净利润为150亿元到160亿元，与上年同期相比增加62.76亿元到72.76亿元，同比增加71.94%到83.40%。公司2026年上半年业绩同比上升的原因系主营铜产品量价同比双升，钼钨产品价格显著走高，叠加巴西金矿业务并表，由此带来的业绩提升。", "ctime": 1783676271, "time_str": "17:37:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260710/c678101396.shtml"}, {"id": "4696239", "title": "龙泉股份：预计2026年上半年净利润同比下降87.29% -90.63%", "content": "龙泉股份公告，预计2026年1月1日至2026年6月30日归属于上市公司股东的净利润为350万元至475万元，比上年同期下降90.63%至87.29%。扣除非经常性损益后的净利润为250万元至375万元，比上年同期下降92.99%至89.49%。", "ctime": 1783676235, "time_str": "17:37:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260710/c678101375.shtml"}, {"id": "4696227", "title": "顺鑫农业：推举康涛代行董事长职责", "content": "顺鑫农业公告，公司于2026年7月10日收到董事长宋立松的书面辞职报告，因工作调动申请辞去董事长、董事等职务。为保证公司运作，第十届董事会第三次会议推举董事康涛代行公司董事长、法定代表人及战略投资与可持续发展委员会主任委员职责，原总经理、董事会秘书职务不变，代行期限至选举产生新任董事长之日止。表决结果：同意8票，反对0票，弃权0票。", "ctime": 1783676126, "time_str": "17:35:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260710/c678101306.shtml"}, {"id": "4696221", "title": "继峰股份：控股子公司格拉默2026年上半年经营性息税前利润约4170万欧元，较上年同期增长17.2%", "content": "继峰股份公告，控股子公司格拉默预计2026年半年度业绩大幅增长。根据初步数据，格拉默2026年第二季度经营性息税前利润约为2340万欧元，较上年同期大幅增长。2026年前6个月格拉默集团经营性息税前利润约4170万欧元，较上年同期增长17.2%。格拉默预计2026年半年度的净利润约2430万欧元，公司财务部门初步测算，格拉默2026年半年度归属于上市公司股东的净利润为人民币1.72亿元，盈利同比实现大幅增长。", "ctime": 1783676048, "time_str": "17:34:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260710/c678101278.shtml"}, {"id": "4696219", "title": "丽岛新材：预计2026年上半年净利润3300万元到4500万元", "content": "丽岛新材公告，预计2026年半年度实现归属于母公司所有者的净利润为3300万元到4500万元。报告期内，铝价处于高位运行区间。受下游市场需求增长拉动，子公司丽岛新能源（安徽）有限公司产能得到进一步释放，产能利用率上升，铝箔高端产品占比提升，带动盈利能力改善。", "ctime": 1783675953, "time_str": "17:32:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260710/c678101226.shtml"}, {"id": "4696217", "title": "必易微：以1元收购单源半导体30%股权", "content": "必易微公告，公司拟以自有资金人民币1元收购单源半导体股东深圳市单源企业管理中心（有限合伙）持有的单源半导体30%股权，对应注册资本人民币30万元，并承担本次收购股权对应的认缴而尚未实缴部分30万元注册资本的实缴义务。", "ctime": 1783675902, "time_str": "17:31:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260710/c678101126.shtml"}, {"id": "4696213", "title": "至纯科技：预计2026年上半年净亏损2.6亿元至3.8亿元", "content": "至纯科技公告，预计2026年1月1日至2026年6月30日归属于母公司所有者的净利润在-2.6亿元至-3.8亿元之间，上年同期净利润为-3539.54万元。本期业绩亏损原因主要系公司收入同比下降导致。", "ctime": 1783675893, "time_str": "17:31:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260710/c678101121.shtml"}, {"id": "4696211", "title": "南向资金今日净卖出59.95亿港元 盈富基金遭净卖出居前", "content": "南向资金今日净卖出59.95亿港元。盈富基金、腾讯控股分别遭净卖出46.98亿港元、28.64亿港元；智谱、兆易创新分别获净买入约28.43亿港元、6.48亿港元。", "ctime": 1783675878, "time_str": "17:31:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260710/c678101117.shtml"}, {"id": "4696177", "title": "吉祥航空：预计2026年半年度净利润同比下降58.46%到72.30%", "content": "吉祥航空公告，预计2026年半年度实现归属于母公司所有者的净利润1.4亿元到2.1亿元，与上年同期相比，将减少2.95亿元到3.65亿元，同比下降58.46%到72.30%。预计2026年半年度实现归属于母公司所有者的扣除非经常性损益的净利润5900万元到8850万元，与上年同期相比，将减少3.19亿元到3.49亿元，同比下降78.29%到85.53%。受国际能源市场形势变化影响，二季度航油价格同比大幅上行，直接推高公司当期核心运营成本，导致二季度出现亏损，进而使得本期业绩预计同比出现下降。", "ctime": 1783675757, "time_str": "17:29:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260710/c678101036.shtml"}, {"id": "4696165", "title": "万东医疗：预计2026年上半年由盈转亏，净利润亏损8250万元-1.01亿元", "content": "万东医疗公告，预计2026年上半年归属于母公司所有者的净利润为-1.01亿元到-8250万元，上年同期为盈利5130万元，由盈转亏；预计扣除非经常性损益后的净利润为-1.11亿元到-9301万元。业绩预亏主要因集采“以价换量”致毛利率下滑、销售及研发费用增长、汇率波动导致汇兑损失增加。", "ctime": 1783675698, "time_str": "17:28:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260710/c678100994.shtml"}, {"id": "4696155", "title": "中国证监会与香港证监会举行第十七次两地执法合作工作会议", "content": "近日，按照中国证监会和香港证监会确立的执法部门主要负责人定期会晤机制，两地证监会召开第十七次两地执法合作工作会议，双方执法部门主要负责人出席会议。会议期间，双方相互通报了近期两地资本市场执法工作情况、违法违规行为趋势及案件办理情况，总结两地跨境执法合作工作成效，沟通双方关注的重大案件办理进展，讨论打击新型跨境违法违规行为、加强情报共享等议题，并就在现有框架下进一步合作开展探讨，以持续增强跨境执法协作效能，切实提升监管执法的有效性和震慑力。下一步，中国证监会将继续深入贯彻落实中央经济工作会议、全国金融系统工作会议精神和新“国九条”部署，按照防风险、强监管、促高质量发展的工作要求，会同香港证监会持续完善跨境执法协作机制，依法从严打击各类跨境违法违规行为，共同维护两地资本市场稳定健康发展。（证监会）", "ctime": 1783675594, "time_str": "17:26:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260710/c678100932.shtml"}, {"id": "4696151", "title": "大北农：6月商品肥猪销售数量31.34万头，销售收入3.66亿元", "content": "大北农公告，2026年6月公司商品肥猪销售数量为31.34万头，销售收入3.66亿元。其中销售数量环比变动-6.95%，同比变动12.33%；销售收入环比变动-7.58%，同比变动-25.91%；销售均价9.44元/公斤。2026年1-6月，公司累计销售商品肥猪210.16万头，同比变动26.43%。累计销售收入26.79亿元，同比变动-11.26%。", "ctime": 1783675587, "time_str": "17:26:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260710/c678100921.shtml"}, {"id": "4696147", "title": "万科A：预计2026年上半年净利润亏损120亿元-150亿元，上年同期亏损119.47亿元", "content": "万科A公告，预计2026年上半年归属于上市公司股东的净利润亏损120亿元-150亿元，上年同期亏损119.47亿元；扣除非经常性损益后的净利润亏损110亿元-140亿元；基本每股收益亏损1.01元/股-1.26元/股。业绩亏损主要因房地产开发项目结算规模下降、毛利率仍处低位、新增计提资产减值，以及部分经营性业务和非主业财务投资亏损。", "ctime": 1783675575, "time_str": "17:26:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260710/c678100914.shtml"}, {"id": "4696139", "title": "城投控股：预计2026年上半年由盈转亏，净利润亏损5000万元-7500万元", "content": "城投控股公告，预计2026年半年度实现归属于母公司所有者的净利润为-5000万元到-7500万元，与上年同期的净利润1.53亿元相比由盈转亏；预计扣非净利润为-4000万元到-6000万元。业绩变化主要因房地产项目交付数量缩减，营业收入和净利润同比下降，同时受证券市场波动影响，公司持有的金融资产公允价值下滑。", "ctime": 1783675546, "time_str": "17:25:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260710/c678100888.shtml"}, {"id": "4696119", "title": "大东方：拟以5000万元-1亿元回购公司股份", "content": "大东方公告，拟以5000万元-1亿元回购公司股份，回购价格不超过5.17元/股。", "ctime": 1783675459, "time_str": "17:24:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260710/c678100840.shtml"}, {"id": "4696115", "title": "中关村：预计2026年上半年净亏损2500万元-3000万元", "content": "中关村公告，预计2026年1月1日至2026年6月30日归属于上市公司股东的净亏损为2500万元-3000万元，上年同期净利润为3880.89万元。扣除非经常性损益后的净亏损为2800万元-3300万元，上年同期净利润为3685.49万元。业绩下降的主要原因是公司心血管线核心产品盐酸贝尼地平片（注册商标：元治®）2026年进入第十一批国家药品集中带量采购执标期，受集采政策影响，该产品销售单价大幅下调、销量同步下滑，对公司营业收入及经营利润形成较大冲击。", "ctime": 1783675450, "time_str": "17:24:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260710/c678100833.shtml"}, {"id": "4696113", "title": "国恩股份：预计2026年上半年净利润同比增长73.48%-116.85%", "content": "国恩股份公告，预计2026年1月1日至2026年6月30日归属于上市公司股东的净利润为6亿元至7.5亿元，比上年同期的3.46亿元增长73.48%-116.85%。扣除非经常性损益后的净利润为5.8亿元至7.2亿元 // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>

function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
