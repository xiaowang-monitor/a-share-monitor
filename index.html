.score-bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s; }
.up { color: var(--red); }
.down { color: var(--green); }
.pulse { animation: pulse 2s infinite; }
@keyframes pulse {

  50% { opacity: 0.5; }

法人资格注销，全部资产、债权、债务、业务、人员及其他一切权利和义务由公司承继。本次吸收合并无需支付对价，不构成关联交易及重大资产重组，无需提交股东会审议。欣贺茂宜注册资本3000万元。", "ctime": 1785921085, "time_str": "17:11:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260805/c678694436.shtml"}, {"id": "4889187", "title": "荣昌生物：预计2026年上半年净利润约47亿元，实现扭亏为盈", "content": "荣昌生物公告，预计2026年半年度营业收入约58.5亿元，同比增加约433%；归属于母公司所有者的净利润约47亿元，上年同期净亏损4.5亿元，实现扭亏为盈；扣非净利润约43亿元，亦实现扭亏为盈。业绩增长主要因核心产品泰它西普、维迪西妥单抗国内销售收入持续增长，以及与艾伯维就RC148签署独家授权许可协议带来的技术授权收入大幅增加。", "ctime": 1785921056, "time_str": "17:10:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260805/c678694426.shtml"}, {"id": "4889177", "title": "菱电电控：拟投资6亿元建设新能源电控产业园扩产扩建项目", "content": "菱电电控公告，公司计划在湖北省武汉市东西湖区投资建设“菱电电控新能源电控产业园扩产扩建项目”，投资总额预计为人民币6亿元。项目分两期投资，一期投资3亿元，建设期为2年，建成后全面投产；二期投资3亿元，将建设试验楼及厂房。项目仍处于前期筹备阶段，公司将尽快推进后续落地实施。", "ctime": 1785921027, "time_str": "17:10:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260805/c678694392.shtml"}, {"id": "4889171", "title": "兰州银行：部分董事高管等拟增持不低于600万元股份", "content": "兰州银行公告，董事长许建平，董事、行长、首席合规官刘敏，党委副书记蒲五斤，派驻纪检监察组组长周伟，工会主席雷鸣，副行长李涛、韩佳峻、盛柏涵，董事、董事会秘书张少伟及中层管理人员，基于对本行未来发展前景的信心和对长期投资价值的认可，拟自2026年8月6日起6个月内，通过深圳证券交易所交易系统集中竞价交易方式增持本行股份，合计增持金额不低于人民币600万元，本次增持计划不设价格区间，资金来源为自有资金。截至公告披露前，增持主体合计持有本行330.22万股股份，持股比例0.0580%。增持主体承诺在增持计划实施期间及法定期限内不减持所持股份，并在增持计划完成后的6个月内不减持本次增持的股份。", "ctime": 1785920965, "time_str": "17:09:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260805/c678694376.shtml"}, {"id": "4889169", "title": "贝莱德（BlackRock）对ASMPT的多头持仓比例增至5.05%", "content": "据香港交易所披露，贝莱德（BlackRock）对ASMPT Ltd.的多头持仓比例于2026年7月31日从4.76%增至5.05%。", "ctime": 1785920964, "time_str": "17:09:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url" , "content": "据香港交易所披露，摩根大通（JPMorgan）对领展房地产投资信托基金的多头持仓比例于2026年7月30日从4.96%增至5.01%。", "ctime": 1785920844, "time_str": "17:07:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260805/c678694307.shtml"}, {"id": "4889125", "title": "章源钨业上调2026年8月上半月长单采购报价", "content": "章源钨业公布2026年8月上半月长单采购报价：55%黑钨精矿：41.2万元/标吨；55%白钨精矿：41.1万元/标吨；仲钨酸铵(国标零级)：60.6万元/吨。注：以上单价含13%增值税。章源钨业2026年7月下半月长单采购报价为：55%黑钨精矿：41.1万元/标吨；55%白钨精矿：41万元/标吨；仲钨酸铵(国标零级)：60.5万元/吨。注：以上单价含13%增值税。（人民财讯）", "ctime": 1785920768, "time_str": "17:06:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260805/c678694291.shtml"}, {"id": "4889099", "title": "余承东：内存高昂涨价，手机之后可能都要大规模涨价", "content": "8月5日下午，华为常务董事、产品投资评审委员会主任、终端BG董事长余承东在华为新品发布会上表示，内存高昂涨价，所有的手机之后可能都要大规模涨价，否则在原来的价格都是亏损销售。（界面新闻）", "ctime": 1785920630, "time_str": "17:03:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260805/c678694261.shtml"}, {"id": "4889065", "title": "优然牧业：与赛科星订立资产置换意向书，涉18间奶牛养殖公司", "content": "优然牧业公告，于2026年8月5日，公司全资附属公司内蒙古优然牧业有限责任公司与公司非全资附属公司内蒙古赛科星繁育生物技术（集团）股份有限公司订立不具法律约束力之意向书，内容有关资产置换交易。根据意向书，赛科星须将其18间主要从事奶牛养殖业务之附属公司之全部股权出售予内蒙优然；内蒙优然须将其2间附属公司（主要从事饲料、反刍动物养殖耗用品的生产及销售）之全部股权出售予赛科星；代价差额须由一方向另一方以现金方式结算。截至公告日期，审计及估值工作尚未完成，代价尚未厘定，尚未订立任何最终协议。", "ctime": 1785920523, "time_str": "17:02:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260805/c678694213.shtml"}, {"id": "4889061", "title": "顺络电子：涉及专利诉讼一审胜诉后遭原告村田上诉至最高院", "content": "顺络电子公告，公司近日收到最高人民法院送达的《民事上诉状》，原告株式会社村田制作所不服上海知识产权法院此前作出的两案一审判决(均驳回其诉讼请求)，已向最高院提起上诉。一审判决认定公司不存在专利侵权行为，二审尚未开庭，对公司本期利润或期后利润的影响具有不确定性。", "ctime": 1785920477, "time_str": "17:01:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260805/c678694200.shtml"}, {"id": "4889051", "title": "今年上半年中国企业信用水平总体平稳", "content": "市场监管总局今天（5日）公布数据显示，今年上半年中国企业信用指数为161.88，企业信用水平呈现总体平稳、小幅波动的运行特征。全国企业信用水平高位波动。上半年，中国企业信用指数较2025年下半年微幅回落0.04点，但比2025年同期提升0.27点，企业信用水平整体保持稳定。2026年第二季度，中国企业信用指数为161.72，较第一季度小幅回调0.33点，与此同时，新移出经营异常名录的企业数量持续增多，新增企业数量稳步提升，向好基础不断稳固。6月，中国企业信用指数为161.22，虽较5月略有下行0.31点，但信用风险较高企业占比持续下降，企业信用水平仍保持高位运行态势。（央视新闻）", "ctime": 1785920427, "time_str": "17:00:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260805/c678694175.shtml"}, {"id": "4889027", "title": "阿斯利康与石药集团成立合资公司 共建新一代生物制剂生产基地", "content": "阿斯利康与石药集团有限公司8月5日宣布正式签署协议，进一步深化战略合作伙伴关系，共同成立合资公司，在石家庄建设新一代生物制剂生产基地。根据协议，阿斯利康持有合资公司49%股权，石药集团持股51%，双方共同推进合资公司的建设与管理。合资公司初期将聚焦双方约定品种的全球化生产与供应，未来双方还可能进一步拓展产品线。(人民财讯)", "ctime": 1785920329, "time_str": "16:58:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260805/c678694007.shtml"}, {"id": "4889025", "title": "得邦照明：股东横润科技减持完毕，累计减持476万股", "content": "得邦照明公告，股东浙江横润科技有限公司于2026年6月26日至2026年8月4日通过集中竞价交易方式累计减持公司股份476万股，占公司总股本的0.998%，减持总金额1.29亿元，本次减持计划已实施完毕。减持后，横润科技持有公司股份11.71万股，占公司总股本的0.02%。", "ctime": 1785920324, "time_str": "16:58:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260805/c678694005.shtml"}, {"id": "4889001", "title": "雅本化学：截至2026年7月31日尚未实施回购", "content": "雅本化学公告，公司于2026年7月17日审议通过回购方案，拟以不低于2500万元且不超过5000万元回购股份，回购价格不超过6.89元/股，用于员工持股计划或股权激励。截至2026年7月31日，公司尚未实施回购。", "ctime": 1785920179, "time_str": "16:56:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260805/c678693938.shtml"}, {"id": "4888939", "title": "金地集团：7月签约金额15亿元，同比下降41.86%", "content": "金地集团公告，2026年7月实现签约面积10.6万平方米，同比下降41.11%；实现签约金额15亿元，同比下降41.86%。2026年1-7月累计签约面积78.1万平方米，同比下降45.54%；累计签约金额110.3亿元，同比下降44.10%。", "ctime": 1785919645, "time_str": "16:47:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260805/c678693651.shtml"}, {"id": "4888933", "title": "上半年我国工业机器人产量超53万套", "content": "工业和信息化部数据显示，上半年，我国电子信息制造业生产继续加快。主要产品中，工业机器人产量53.8万套，同比增长28%。（新华社）", "ctime": 1785919561, "time_str": "16:46:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260805/c678693599.shtml"}, {"id": "4888921", "title": "苹果考虑将中国长鑫存储纳入新的供应链 但压价失败", "content": "据韩国IT媒体《Digital Daily》引述业内人士报道，苹果此前为了降低成本，曾考虑将中国长鑫存储纳入新的供应链，但如今在进一步压低采购价格的谈判中遭遇阻力。苹果近期为了缓解下一代iPhone及其他智能设备的制造成本压力，与长鑫存储就LPDDR5X等移动DRAM的供货价格进行了谈判，但其降价要求遭到拒绝。据了解，长鑫存储坚持的报价甚至高于三星电子、SK海力士，或者至少与二者处于相近水平。过去在消费电子市场拥有强大采购议价能力的苹果，如今却碰上了供应商强硬定价的“硬钉子”。长鑫存储之所以敢于果断拒绝苹果的降价要求，核心在于华为、小米等中国科技巨头正在大规模“扫货”。在这种情况下，长鑫存储没有必要为了苹果复杂严苛的质量认证和降价要求，主动压低价格、减少利润。有分析认为，中国国内市场旺盛的需求，为长鑫存储提供了强大的价格支撑。（中国基金报）", "ctime": 1785919515, "time_str": "16:45:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260805/c678693571.shtml"}, {"id": "4888891", "title": "包头稀交所：今日稀土主流产品价格小幅下跌", "content": "据包头稀土产品交易所，今日稀土主流产品价格小幅下跌。氧化镨钕均价73.94万元/吨，下跌0.52万元/吨；金属镨钕均价89.46万元/吨，下跌0.81万元/吨；氧化镝均价138.96万元/吨，下跌0.74万元/吨；氧化铽均价669.43万元/吨，下跌3.47万元/吨。今日氧化镨、氧化钕、氧化镥、氧化铕、氧化镧铈等产品成交信息较少，请谨慎参考。随着部分贸易商降价变现，镨钕产品价格跌幅明显扩大。氧化镨钕市场活跃度较低，磁材厂有少量刚需采购，但压价力度较大。中重稀土市场活跃度依旧不高，受部分商家降价影响，镝、铽、钆、钬等产品价格均出现下跌。整体来看，当前稀土市场成交仍然僵持，少数商家促销导致报价整体下跌，但成交表现一般，预计近期价格或偏弱运行。", "ctime": 1785919330, "time_str": "16:42:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260805/c678693502.shtml"}, {"id": "4888883", "title": "长春高新：子公司GenSci133注射液临床试验申请获受理，适应症为骨质疏松症", "content": "长春高新公告，公司控股子公司金赛药业收到国家药品监督管理局核准签发的《受理通知书》，GenSci133注射液境内生产药品注册临床试验申请获得受理，受理号为CXSL2600814。该药品为金赛药业自主研发的PTH多肽与抗RANKL抗体融合蛋白，属于治疗用生物制品1类，拟用于治疗骨质疏松症。", "ctime": 178 // 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';

    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
