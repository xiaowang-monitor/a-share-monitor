.score-bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s; }

.down { color: var(--green); }

.5%。其中，经大桥口岸对美国进出口总值101.8亿元，同比增长19.4%；经大桥口岸对APEC其他经济体进出口总值达989.4亿元，同比增长77.4%，占比超75%，成为拉动增长的重要引擎。（央视新闻）", "ctime": 1778733105, "time_str": "12:31:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260514/c676685676.shtml"}, {"id": "4362701", "title": "万斯说美伊谈判有进展但未透露细节", "content": "美国副总统万斯当地时间5月13日对媒体表示，美国与伊朗的谈判“正在取得进展”，但“非常敏感”，因此他不能透露细节。万斯强调，目前谈判的根本问题在于，是否能满足特朗普总统划定的“红线”要求——也就是伊朗绝不能拥有核武器。(CCTV国际时讯)", "ctime": 1778733095, "time_str": "12:31:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260514/c676685675.shtml"}, {"id": "4362675", "title": "联合国机构新增海湾地区内陆口岸代码绕开霍尔木兹海峡", "content": "联合国欧洲经济委员会13日宣布，为加强海湾地区供应链韧性并促进关键商品流通，该机构将快速为阿联酋签发3个新增联合国口岸及相关地点代码条目，并更新10个现有代码条目。 联合国欧洲经济委员会当天发布新闻稿说，新增和更新条目包括海湾地区重要内陆物流枢纽，如法亚、莎贾、艾因和阿布扎比战略物流走廊，涉及铁路货运站、内陆港口、内陆物流枢纽以及工业仓储和集散设施。 该机构说，这些新增和更新的地点将加强连接阿布扎比、沙迦和迪拜的工业和仓储枢纽与出口门户的内陆物流和多式联运走廊，包括通往富查伊拉港或吉达港的路线。这些路线是霍尔木兹海峡传统海运路线的重要替代路线。 联合国欧洲经济委员会执行秘书塔蒂亚娜·莫尔切安说，联合国物流代码和《国际公路运输公约》是促进全球贸易和国际供应链稳定的全球公共产品，帮助确保在霍尔木兹海峡及更广泛区域面临地缘政治紧张局势和干扰的情况下，必要的运输和物流业务仍能继续进行。 为应对霍尔木兹海峡事实性关闭后的替代运输需求，联合国欧洲经济委员会4月底宣布正式启动“海湾国家边境口岸监测平台”，旨在通过整合信息优化海湾地区内陆运输的货物规划和通关流程。 联合国口岸及相关地点代码是全球贸易和运输基础设施的基石，该代码系统确定了249个国家和地区的11.4万多个地点。(新华社)", "ctime": 1778732901, "time_str": "12:28:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260514/c676685634.shtml"}, {"id": "4362651", "title": "纳米比亚与欧盟加强可再生能源合作", "content": "为期3天的第二届纳米比亚—欧盟商业论坛13日在纳首都温得和克闭幕，双方宣布多项合作举措，其中包括推动可再生能源等领域的合作。\n\n论坛期间，纳米比亚与欧盟决定将《纳米比亚—欧盟战略伙伴关系路线图》延至2030年，以加强双方在绿色氢能、关键原材料、投资便利化等方面的合作。\n\n近年来，欧盟不断强化与非洲国家在可再生能源、循环经济等领域的合作。作为非洲西南部资源大国，纳米比亚凭借丰富的铀矿、锂矿及绿色氢能发展潜力，正成为欧洲资本和产业的重要目标市场。(新华社)", "ctime": 1778732649, "time_str": "12:24:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260514/c676685579.shtml"}, {"id": "4362643", "title": "塞拉利昂暴发麻疹疫情", "content": "塞拉利昂政府13日宣布该国暴发麻疹疫情，其中首都弗里敦已出现社区传播。 塞国家公共卫生署当天发布公告说，今年1月至4月，该国8个地区累计报告41例麻疹确诊病例，其中弗里敦受影响最为严重，仅4月就新增9例病例。 目前，塞政府已向受影响地区派遣应急响应小组，同时采取疫情监测、接触者追踪、疫苗接种等防控措施。塞卫生部门呼吁民众一旦出现发热、咳嗽、流鼻涕、眼睛发红等症状应立即就医，同时提醒家长确保儿童接种政府免费提供的麻疹疫苗。 麻疹是一种由麻疹病毒引起的急性出疹性呼吸道传染病，主要通过呼吸道飞沫和气溶胶传播。麻疹传染性强，儿童易感染，但可以通过接种疫苗预防。感染者在接触病毒后一到两周内会出现高烧、咳嗽、流涕、眼睛发红、皮疹等症状，病情严重时可引发肺炎等并发症，甚至导致死亡。(新华社)", "ctime": 1778732395, "time_str": "12:19:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260514/c676685521.shtml"}, {"id": "4362627", "title": "特朗普对习近平主席说：您是很伟大的领导人", "content": "5月14日上午，国家主席习近平在北京人民大会堂同来华进行国事访问的美国总统特朗普举行会谈。特朗普总统对习近平主席说：您是很伟大的领导人，我经常说您是伟大的领导人。我感到非常荣幸能够到中国来。(央视新闻)", "ctime": 1778731995, "time_str": "12:13:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260514/c676685368.shtml"}, {"id": "4362617", "title": "老佛爷百货北京门店将关闭", "content": "老佛爷百货5月14日官方宣布北京门店将于5月27日结束营业。北京门店关闭后，顾客仍可前往全国任意门店继续享受完整会员权益。在北京门店关闭后，老佛爷百货在上海和深圳还有门店。据记者了解，老佛爷百货来自法国，在全球具有很高知名度，但在进入中国市场后经营并不十分理想，在商品品牌和款式的引进、价格等方面都不太被消费者所接受。(第一财经)", "ctime": 1778731737, "time_str": "12:08:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260514/c676685310.shtml"}, {"id": "4362597", "title": "朱雀二号改进型遥五运载火箭发射成功 大重量载荷发射能力有提升", "content": "5月14日午间，朱雀二号改进型遥五运载火箭在东风商业航天创新试验区发射升空，将搭载的2.8吨定制化试验载荷顺利送入900公里高度预定轨道。蓝箭航天相关负责人表示，朱雀二号改进型遥五运载火箭进一步提升大重量载荷发射能力，具备承接一箭多星发射任务的工程条件，为加快发展卫星互联网、执行大型星座组网工程提供运载能力支撑。(新华社)", "ctime": 1778731438, "time_str": "12:03:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260514/c676685245.shtml"}, {"id": "4362595", "title": "港股午评：恒生指数涨0.34%，恒生科技指数涨0.3%", "content": "港股午间收盘，恒生指数涨0.34%，恒生科技指数涨0.3%。恒指港股通ETF银华（159318）涨0.44%，港股通科技ETF鹏华（159751）跌0.21%。板块方面，林业与纸制品、个人护理用品板块涨幅靠前；电气设备 tent": "5月13日，武田制药发布财报，公司计划在2026财年裁员约4500人，作为企业重组的一部分，以集中职能并降低成本。这一裁员比例接近总员工数量的10%。武田制药称，裁员后预计会有2200个空缺职位，将继续招聘。（第一财经）", "ctime": 1778730360, "time_str": "11:46:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260514/c676684939.shtml"}, {"id": "4362539", "title": "5月14日午间公告一览：同和药业公司原料药获得FDA注册批准函", "content": "同和药业公告，公司于近日收到美国食品药品监督管理局（FDA）签发的卡格列净原料药注册批准函 DMF First Adequate Letter（FA Letter）。卡格列净是一种钠-葡萄糖协同转运蛋白2（SGLT2）抑制剂，临床主要用于治疗2型糖尿病。公司卡格列净产品获得美国 FDA 签发的 FA Letter，表明 FDA 已完成对公司卡格列净原料药 DMF 文件的技术审评，可满足关联制剂客户的 ANDA（Abbrevitive New Drug Application，简略新药申请）申报要求。", "ctime": 1778730287, "time_str": "11:44:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260514/c676684925.shtml"}, {"id": "4362537", "title": "朱雀二号改进型遥五运载火箭发射成功", "content": "5月14日11时00分，朱雀二号改进型遥五运载火箭在东风商业航天创新试验区发射升空，运载火箭全程飞行正常，二子级进入预定轨道，飞行试验任务取得圆满成功。（新华社）", "ctime": 1778730128, "time_str": "11:42:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260514/c676684885.shtml"}, {"id": "4362523", "title": "十余名美商界代表进入中美元首会谈现场", "content": "5月14日上午，国家主席习近平在北京人民大会堂同来华进行国事访问的美国总统特朗普举行会谈。中美元首会谈进行过程中，特斯拉首席执行官马斯克、苹果首席执行官库克、英伟达首席执行官黄仁勋、波音首席执行官奥特伯格等十余名美方商界代表，在工作人员引导下进入会谈现场。（央视新闻）", "ctime": 1778729577, "time_str": "11:32:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260514/c676684600.shtml"}, {"id": "4362517", "title": "ETF两市成交额3546.48亿元", "content": "截至目前，ETF两市成交额报3546.48亿元，分类型来看，股票型ETF成交额1098亿元，债券型ETF成交额1663.31亿元，货币型ETF成交额86.83亿元，商品型ETF成交额37.84亿元，QDII型ETF成交额377.52亿元。其中，成交额最高的非货币型ETF分别是中韩半导体ETF（513310）、中证500ETF（510500）、恒生科技ETF（513180），成交额分别为：88.34亿元、57.21亿元、41.54亿元。", "ctime": 1778729495, "time_str": "11:31:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "sou // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}
