}

.score-bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s; }
.up { color: var(--red); }

: "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261005/c680440522.shtml"}, {"id": "5311481", "title": "鸿海：预计第四季度与人工智能相关的业务将继续增长", "content": "鸿海：预计第四季度与人工智能相关的业务将继续增长。仍需关注全球政治和经济环境波动的影响。", "ctime": 1791186146, "time_str": "15:42:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261005/c680440512.shtml"}, {"id": "5311409", "title": "3年期年化2%利率再现江湖！本轮大额存单重启发行潮仍在扩散，中小银行利率续刷新高", "content": "10月以来再有部分银行继续上新长期限大型存单。比如，邯郸银行通过官方微信公众号发文称，为更好满足客户多元化资金配置需求，提升金融服务能力，该行于10月1日起新增三款个人大额存单产品。“本产品20万元起存。具体挂牌利率为，1个月年利率1.0%、9个月年利率1.255、18个月年利率1.4%。”9月30日晚间，锡商银行通过微信号发布了大额存单产品额度上新的公告。在公告中，锡商银行表示，该行新发年利率2%、20万元起存、转让期限90天的3年期大额存单产品，“额度有限，先到限先得”。（财联社）", "ctime": 1791185438, "time_str": "15:30:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261005/c680440474.shtml"}, {"id": "5311381", "title": "国际油价承压下跌！利空又传来：中东原油出口量已超战前水平", "content": "周一公布的航运数据显示，尽管仍有船只在穿越霍尔木兹海峡时遭到袭击，但在9月最后一周7天中，有4天中东原油出口量超过了战前水平；由于中东原油出口回升，加上七国集团（G7）宣布释放能源储备，令供应担忧有所缓解，周一，国际油价承压下跌。（财联社）", "ctime": 1791185252, "time_str": "15:27:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261005/c680440469.shtml"}, {"id": "5311367", "title": "星展：英伟达估值仍低 AI股远未泡沫化", "content": "星展集团首席投资官Hou Wey Fook表示，英伟达的市盈率以及预计明年70%的盈利增速表明，由人工智能驱动的科技股距离泡沫仍有很大距离。汇总数据显示，英伟达目前的未来12个月市盈率为17倍。Hou将其与互联网泡沫破裂前思科系统约100倍的估值进行比较。他在接受电视采访时表示：“如果把人工智能领域的代表性公司定义为英伟达，而它目前的市盈率只有十几倍，那怎么能说这是泡沫？”他补充称，半导体和人工智能投资仍存在“顺风因素”。不过，Hou建议采用“杠铃策略”来“控制投资组合整体波动率”，即在增长端配置科技股，同时搭配投资级固定收益资产以提供稳定收益，并将对冲基金和黄金作为中间的风险分散工具。（财联社）", "ctime": 1791184880, "time_str": "15:21:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261005/c680440453.shtml"}, {"id": "5311353", "title": "西班牙首相宣布将提前举行大选", "content": "西班牙首相桑切斯5日宣布，将于11月29日提前举行大选。（央视新闻）", "ctime": 1791184564, "time_str": "15:16:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261005/c680440432.shtml"}, {"id": "5311201", "title": "欧股开盘普涨", "content": "德国DAX指数涨1.17%，英国富时100指数涨0.32%，法国CAC40指数涨0.79%，欧洲斯托克50指数涨1.02%，意大利富时MIB指数涨0.49%。", "ctime": 1791183752, "time_str": "15:02:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261005/c680440394.shtml"}, {"id": "5311179", "title": "机构：预计2026年四季度商品猪出栏量依旧在高位", "content": "2026年前三季度的生猪市场，总体供给宽松，猪价底部运行。南华期货认为，前三季度，生猪市场深陷供强需弱的困局。供给端，当期出栏对应能繁母猪高基数，叠加PSY（每头母猪年提供断奶仔猪数）、MSY（每头母猪每年出栏肥猪数）等生产效率跃升与出栏均重处于历史高位，实际供给体量充足，去化的“减量不减产”特征显著。需求端，淡季消费叠加替代品分流，鲜销率低位运行，冻品库存攀升至历史高位，形成负向循环。多家机构预计，周期拐点的真正确认，时间窗口或后移至2027年上半年。中信期货指出，供应方面，2025年下半年以来，母猪数量持续去化，但前期减产幅度缓慢，在2026年二季度养殖亏损扩大后，去产能开始增速，目前仍在去化中。2026年母猪生产效率继续提升，部分抵消了数量的去化，将供应拐点推迟。预计2026年四季度商品猪出栏量依旧在高位，2026年末或出现拐点，2027年一季度出栏量从高位缓慢递减。需求方面，宏观餐饮景气度不足，但低价猪肉对替代消费有支撑。四季度生猪需求逐渐进入旺季，屠宰端量、肉/猪比价多呈季节性上涨趋势，需求增加，对猪价有提振效果。供应周期的拐点预计在2026年末逐步兑现，2027年商品猪出栏压力开始减轻，周期见底修复。（澎湃）", "ctime": 1791183646, "time_str": "15:00:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261005/c680440389.shtml"}, {"id": "5311009", "title": "日经225指数收盘上涨2.40%", "content": "日经225指数收盘上涨2.40%，报69946.86点。", "ctime": 1791181938, "time_str": "14:32:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261005/c680440307.shtml"}, {"id": "5310805", "title": "10月5日全国铁路预计发送旅客2105万人次", "content": "据“中国铁路”公众号，10月4日，全国铁路发送旅客2032万人次，运输安全平稳有序。10月5日，铁路客流保持高位运行，中短途客流持续攀升，全国铁路预计发送旅客2105万人次，计划加开旅客列车1463列。", "ctime": 1791180537, "time_str": "14:08:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261005/c680440255.shtml"}, {"id": "5310405", "title": "美元指数升至2025年4月以来最高盘中水平", "content": "美元指数升至2025年4月以来最高盘中水平，最高触及102.53。", "ctime": 1791179882, "time_str": "13:58:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261005/c680440231.shtml"}, {"id": "5310307", "title": "受冷空气影响 浙江台州沿海10条客渡运航线停航", "content": "受南下冷空气影响，浙江台州沿海海面风急浪高，部分海域阵风已达8至9级，海上通航安全风险明显上升。为保障群众水上出行安全，台州沿海除玉环外的10条客渡运航线已全部停航。（央视新闻）", "ctime": 1791178623, "time_str": "13:37:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261005/c680440203.shtml"}, {"id": "5310201", "title": "智谱股价涨超5% GLM-5.3海外走红", "content": "智谱港股涨幅扩大至超5%。消息面上，智谱旗下GLM系列模型近期接连获得海外认可，近日，AI编程工具Cursor宣布上线GLM-5.3及GLM-5.3-Flash，并表示，GLM-5.3在Max推理设置下，取得其自有编程评测CursorBench 4.0中开放权重模型的最高分。官方榜单显示，该模型得分为42.6%。此外，德国主权AI Aleph Alpha发布的新模型Kolibri，也披露了对GLM的使用。", "ctime": 1791177795, "time_str": "13:23:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261005/c680440176.shtml"}, {"id": "5309969", "title": "澳大利亚调查迪拜航空副驾驶与澳关联", "content": "澳大利亚警方发言人10月4日说，该国一个由多机构人员组成的反恐小组正调查迪拜航空FZ1073航班副驾驶与澳大利亚的关联。这名副驾驶日前在该航班驾驶舱内袭击机长，有媒体报道说他曾在澳大利亚留学。两名了解澳方调查情况的消息人士说，哈马米曾在维多利亚州首府墨尔本的一所大学就读。第三名消息人士说，哈马米大约10年前就读于皇家墨尔本理工大学。皇家墨尔本理工大学拒绝对此置评。（新华社）", "ctime": 1791175344, "time_str": "12:42:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261005/c680440107.shtml"}, {"id": "5309897", "title": "美“艾森豪威尔”号航母将返美接受事故调查", "content": "美国大西洋舰队海军航空部队当地时间10月2日发表声明说，因9月28日发生事故，美“艾森豪威尔”号航母将返回位于美国东海岸的弗吉尼亚州诺福克海军基地，对该舰的飞机起降设备进行检查和全面评估。声明说，事故原因仍在调查中，海军技术专家将在恢复飞行作业前完成必要的维护工作。据美国海军9月28日通报，在美国弗吉尼亚州海岸附近的“艾森豪威尔”号航母当天发生舰载机着舰事故，两名飞行员弹射逃生，另有4名舰上人员受伤。两名飞行员被搜救人员救起后安全返回舰上。 (央视新闻)", "ctime": 1791173429, "time_str": "12:10:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261005/c680440046.shtml"}, {"id": "5309891", "title": "港股午间收盘：恒生指数跌0.08% 恒生科技指数涨0.27%", "content": "港股午间收盘，恒生指数跌0.08%，恒生科技指数涨0.27%。", "ctime": 1791173172, "time_str": "12:06:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261005/c680440036.shtml"}, {"id": "5309855", "title": "日本20年期国债收益率上升1个基点，至3.970%", "content": "日本20年期国债收益率上升1个基点，至3.970%。\n环球市场情报", "ctime": 1791172690, "time_str": "11:58:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261005/c680440007.shtml"}, {"id": "5309769", "title": "德国宣布向乌克兰提供10亿欧元军事援助", "content": "当地时间10月4日，德国总理默茨突访乌克兰首都基辅。在俄乌冲突即将迎来爆发后第五个冬天的关键时刻，默茨重申了德国对乌克兰“坚定不移”的支持。默茨说：“今天，我带来了非常具体的进一步援助措施。我们将推出新一轮军事援助计划。援助规模约为10亿欧元。我们正在为联合生产反无人机装备提供资金。过去几周，这一领域已经取得重大技术突破。这些突破也将加快无人机的生产进度。这也将迅速、切实增强乌克兰的防空能力。” (央视新闻)", "ctime": 1791171199, "time_str": "11:33:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261005/c680439935.shtml"}, {"id": "5309743", "title": "横琴口岸单日客流突破15万人次 创口岸启用以来新高", "content": "记者从珠海边检总站横琴边检站了解到，10月4日，横琴口岸迎来国庆假期出入境客流峰值。据横琴边检站统计，当日口岸出入境客流突破15万人次，超越今年5月2日14.79万人次的单日最高纪录，较去年同期增长20%，刷新口岸启用以来单日客流历史新高，这也是口岸首次突破15万人次大关。今年以来，口岸单日客流已多次超14万人次，琴澳往来热度持续攀升。（央视新闻）", "ctime": 1791170752, "time_str": "11:25:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261005/c680439912.shtml"}, {"id": "5309685", "title": "泰国SET指数开盘上涨0.5%", "content": "泰国SET指数开盘上涨0.5%，报1579.19点。", "ctime": 1791169512, "time_str": "11:05:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261005/c680439793.shtml"}, {"id": "5309669", "title": "截至二季度末资产管理产品总规模突破88万亿元", "content": "中国基金业协会最新发布的数据显示，截至2026年 const SECTORS  = [{"name": "金融", "hit_count": 56, "etfs": []}, {"name": "人工智能", "hit_count": 36, "etfs": []}, {"name": "消费", "hit_count": 26, "etfs": []}, {"name": "数据要素", "hit_count": 26, "etfs": []}, {"name": "半导体", "hit_count": 24, "etfs": []}, {"name": "军工", "hit_count": 14, "etfs": []}, {"name": "地产", "hit_count": 11, "etfs": []}, {"name": "医药", "hit_count": 9, "etfs": []}];
const META     = {"update_time": "2026-10-05 18:43:52", "sentiment_score": 59.60144927536232, "agents": []};

// 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
