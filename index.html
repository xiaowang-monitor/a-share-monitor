: "4236923", "title": "新凤鸣：2025年净利润10.18亿元，同比下降7.42%", "content": "新凤鸣公告，2025年营业收入715.57亿元，同比增长6.66%。净利润10.18亿元，同比下降7.42%。拟向全体股东每股派发现金红利0.20元（含税），合计拟派发现金红利3.31亿元（含税）。", "ctime": 1776329186, "time_str": "16:46:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260416/c676043659.shtml"}, {"id": "4236919", "title": "富奥股份：2026年第一季度新增订单共85项，预计订单生命周期收入总额167.5亿元", "content": "富奥股份公告，2026年第一季度公司合并口径新增订单共85项，预计订单生命周期收入总额167.5亿元。其中，传统市场以外订单52项，预计订单生命周期收入总额88亿元；新能源类订单占比66.3%。重点客户订单包括一汽大众63亿元，赛力斯汽车25.1亿元，奇瑞汽车16.3亿元，吉利汽车10.8亿元，德国大众6.5亿元，宁德时代5.7亿元，蔚来汽车5.5亿元，一汽丰田5.4亿元。公司在智能底盘、智能网联、全域热管理等领域取得技术突破，订单获取情况将推动公司市场化转型与新能源业务布局。", "ctime": 1776329070, "time_str": "16:44:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260416/c676043574.shtml"}, {"id": "4236905", "title": "华友钴业：2026年第一季度净利润24.97亿元，同比增长99.45%", "content": "华友钴业公告，2026年第一季度营业收入258.04亿元，同比增长44.62%。净利润24.97亿元，同比增长99.45%。主要受益于镍、钴、锂等金属价格的回升及公司产业一体化经营优势的持续释放。", "ctime": 1776328929, "time_str": "16:42:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260416/c676043519.shtml"}, {"id": "4236903", "title": "美民主党议员对赫格塞思发起弹劾", "content": "美国国会众议院民主党籍议员15日提交6项针对国防部长赫格塞思的弹劾条款，指控他犯有战争罪、滥用职权、鲁莽处理敏感信息等严重不当行为。这项弹劾动议由亚利桑那州联邦众议员亚萨明·安萨里牵头、多名民主党籍联邦众议员共同发起。6项针对赫格塞思的弹劾条款分别是：对伊朗发动“未经（国会）授权的战争”并罔顾美国军人生命安全；违反武装冲突法和以平民为攻击目标；疏忽和鲁莽处理敏感军事信息；妨碍国会行使监督权；滥用权力并对军队进行政治操弄；行为有损美国及其军队声誉。美国媒体分析，由于目前共和党在众议院占微弱多数，这一弹劾动议几乎肯定无法在众议院获得通过。五角大楼新闻秘书金斯利·威尔逊14日称民主党人试图通过弹劾赫格塞思“博取眼球”，并继续宣称五角大楼已经压倒性地实现总统特朗普在伊朗的目标、“取得重大成就”。(新华社)", "ctime": 1776328926, "time_str": "16:42:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260416/c676043517.shtml"}, {"id": "4236899", "title": "晋亿实业：拟将全资子公司泉州晋亿物流100%股权转让给泉州康和盛新材料科技有限公司", "content": "晋亿实业公告，拟将全资子公司泉州晋亿物流100%股权转让给泉州康和盛新材料科技有限公司，交易金额为5500万元。", "ctime": 1776328889, "time_str": "16:41:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260416/c676043499.shtml"}, {"id": "4236887", "title": "商务部：中国连续多年成为阿联酋第一大贸易伙伴国", "content": "在商务部今天下午举行的例行新闻发布会上，商务部新闻发言人何亚东介绍说，中国已连续多年成为阿联酋第一大贸易伙伴国。何亚东介绍，4月13日，在阿联酋阿布扎比王储哈立德访华期间，中国商务部和阿联酋外贸部成功举办中国—阿联酋企业推介会。近年来，中阿经贸合作取得了丰硕的成果，中国连续多年成为阿联酋第一大贸易伙伴国，阿联酋已经成为中国在阿拉伯地区重要的投资目的国和外资来源国。此次推介会期间，双方企业围绕能源、农业和粮食安全、产业合作和投资等三个专题进行研讨交流，积极探讨合作机遇，挖掘合作潜力，这将有助于深化两国贸易投资合作。（央视新闻）", "ctime": 1776328743, "time_str": "16:39:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260416/c676043384.shtml"}, {"id": "4236883", "title": "西部黄金：子公司新疆美盛预计还需停产50天", "content": "西部黄金公告，截至本公告披露日，新疆美盛道路及作业区域清雪工作持续进行中，现已工作至雪崩易发区域，因前期灾害地点已发生过雪崩，积雪厚实，工作面狭窄，工作量大且仍然存在雪崩风险，该区域道路清雪进度缓慢。同时，电塔组塔工作同步进行，目前塔材已运输至塔基处，但因矿区处于高海拔地区，气候多变，为保证作业人员安全，组塔工作需在良好天气情况下进行，但近日一直维持雨雪天气，组塔工作进展缓慢。新疆美盛将积极、持续推进道路清雪，电力恢复等相关工作，在充分考虑天气影响、确保作业人员安全的情况下，预计完成上述工作还需停产50天。", "ctime": 1776328673, "time_str": "16:37:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260416/c676043343.shtml"}, {"id": "4236873", "title": "渤海化学：2025年净亏损6.46亿元", "content": "渤海化学公告，2025年营业收入33.3亿元，同比下降30.39%。归属于上市公司股东的净亏损6.46亿元，上年同期净亏损6.32亿元。公司董事会决定2025年度不进行利润分配，亦不进行资本公积金转增股本。", "ctime": 1776328562, "time_str": "16:36:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260416/c676043290.shtml"}, {"id": "4236871", "title": "长三角铁路应对“五一”假期客流单日最高开行旅客列车超1700对", "content": "记者从中国铁路上海局集团有限公司获悉，长三角铁路2026年“五一”假期运输方案近日出台。自4月29日起至5月6日共8天内，长三角铁路预计发送旅客3180万人次，日均发送旅客397.5万人次，同比增长5%，为历年“五一”假期运输日均客发量新高。其间，单日旅客列车开行数量最高将达1701.5对，为历年同期最高。从假期运输客流走向看，假期运输期间，长三角往来北京、西安、福州、厦门等直通方向客流火爆，管内沪宁、沪杭、宁杭等多个方向客流增幅明显。从假期运输客流分布看，长三角区域整体呈现假期运输前3天集中出发、假期运输后3天集中返程的出行规律，客流最高峰预计将出现在5月1日，当天预计发送旅客440万人次。(新华社)", "ctime": 1776328548, "time_str": "16:35:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260416/c676043281.shtml"}, {"id": "4236863", "title": "王文涛部长会见越南工贸部部长黎孟雄", "content": "4月15日，商务部部长王文涛在京会见越南工贸部部长黎孟雄。双方就深化中越经贸关系等议题交换意见。王文涛表示，越共中央总书记、国家主席苏林此次访华，体现了双方最高领导人对中越关系和“同志加兄弟”情谊的高度重视。中越两党两国最高领导人会晤，达成一系列重要共识，为双边经贸合作提供了根本指引。中国商务部愿与越南工贸部共同落实好双方达成的重要共识，加强部门间交流合作，推动双边经贸关系迈上新台阶，为加快构建更高水平具有战略意义的中越命运共同体作出贡献。（商务部）", "ctime": 1776328422, "time_str": "16:33:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260416/c676043171.shtml"}, {"id": "4236861", "title": "以官员称以色列总理将与黎巴嫩总统通话", "content": "总台记者当地时间16日获悉，以色列科技部长加姆利尔称，以色列总理内塔尼亚胡当天晚些时候将与黎巴嫩总统奥恩通话。美国总统特朗普15日在社交媒体发文称，以色列和黎巴嫩领导人“明天”将对话。他在帖文中并未具体说明是哪两位领导人将对话。在特朗普发文后，一位黎巴嫩官方消息人士表示，黎巴嫩“并不知晓”即将与以色列进行任何接触。（央视新闻）", "ctime": 1776328416, "time_str": "16:33:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260416/c676043166.shtml"}, {"id": "4236857", "title": "“CMOS图像传感器提供商”长光辰芯港股暗盘涨超66%", "content": "“CMOS图像传感器提供商”长光辰芯港股暗盘涨超66%，最高报68港元。", "ctime": 1776328355, "time_str": "16:32:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260416/c676043116.shtml"}, {"id": "4236851", "title": "“杭州六小龙”之一群核科技港股暗盘一度涨超150%", "content": "“杭州六小龙”之一群核科技港股暗盘一度涨超150%，最高报19.5港元。数据显示，群核科技此次公开发售获约1071倍的超额认购，融资申购额达1312亿港元。据悉，本次港股IPO，群核科技计划全球发售约1.61亿股，其中香港发售1606.2万股，国际发售1.45亿股，分别占全球发售股份总数的10%和90%，另有约15%超额配股权。", "ctime": 1776328254, "time_str": "16:30:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260416/c676043073.shtml"}, {"id": "4236847", "title": "市场监管总局：动态调整CCC认证目录 避免低价低质“内卷式”竞争", "content": "市场监管总局有关负责人表示，为进一步强化产品质量安全源头治理，将优化CCC认证目录，实施动态管理，研究推动将涉及产业安全、公共安全、人身健康安全的产品纳入CCC认证管理。针对CCC认证目录内部分产品实施自我声明评价方式后，出现部分企业落实质量主体责任不到位、虚假承诺导致产品质量下降等问题，市场监管总局将小功率电动机、机动车安全玻璃等16种产品转为第三方认证模式管理。此次专项行动还将坚决治理行业“潜规则”， 针对现场检查“走过场”、不法中介机构过度参与认证活动、型式试验样品真实性等问题，明确型式试验为抽样检测、认证检测费用必须由企业直接支付、发现有中介人员参与工厂检查立即终止检查活动等具体要求。规定认证检测机构必须进行成本核算，并按照核算后的公开标准合理收取费用，避免低价低质“内卷式”竞争。同时要求认证机构在收集分析各类质量信息基础上，对生产企业实施分类分级管理，加大获证企业监督力度，增加生产现场抽样、市场买样等检测要求，提高“不预先通知”飞行检查比例，强化CCC认证对产品一致性持续管控的基础作用。强调型式试验、工厂检查、关键元器件和材料管控等重点环节记录的保存期限不低于10年，并对关键试验项目进行视频记录，进一步完善责任追溯链条，实现找得到人、查得清事、落得了责。（央视新闻）", "ctime": 1776328228, "time_str": "16:30:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260416/c676043066.shtml"}, {"id": "4236835", "title": "纽威数控：2025年净利润3.04亿元，同比下降6.43%", "content": "纽威数控公告，2025年营业收入28.93亿元，同比增长17.52%。净利润3.04亿元，同比下降6.43%。公司拟向全体股东每10股派发现金红利4.5元（含税），合计拟派发现金红利2.06亿元（含税），占公司2025年度合并报表中归属于上市公司股东净利润的67.64%。拟以资本公积向全体股东每10股转增4股，合计转增1.83亿股。", "ctime": 1776328089, "time_str": "16:28:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260416/c676043006.shtml"}, {"id": "4236831", "title": "巴基斯坦外交部：黎巴嫩是美伊停火谈判进程的一部分", "content": "巴基斯坦外交部发言人16日说，黎巴嫩是美伊停火谈判进程的一部分。过去两天，黎巴嫩和以色列关系出现好转迹象，令人欣慰。黎巴嫩局势缓和有利于推进停火谈判进程。(新华社)", "ctime": 1776327950, "time_str": "16:25:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260416/c676042922.shtml"}, {"id": "4236825", "title": "N大普微今日涨430.71%，4家机构专用席位净买入4.22亿元", "content": "N大普微今日涨430.71%，成交额48.64亿元，换手率82.94%，盘后龙虎榜数据显示，4家机构专用席位净买入4.22亿元，有1家机构专用席位净卖出2020.41万元。", "ctime": 1776327934, "time_str": "16:25:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260416/c676042919.shtml"}, {"id": "4236819", "title": "鑫宏业：2025年净利润1.33亿元，同比增长14.13%", "content": "鑫宏业公告，2025年营业收入37.81亿元，同比增长42.78%。净利润1.33亿 :47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260416/c676042603.shtml"}, {"id": "4236777", "title": "报告显示：消费品以旧换新引领家电市场向好发展", "content": "中华全国商业信息中心4月16日发布的2025年度消费品市场运行情况及2026年趋势展望显示，在新一轮“国补”带动下，家电以旧换新需求将稳步释放，为家电市场平稳运行提供支撑。报告显示，随着消费者对消费体验需求的提升，家电消费场景将加速迭代与丰富，为家电实体零售渠道注入强劲动力。当前家电零售逐渐摆脱单一专卖店的传统形态，场景化体验、一站式解决方案与互动式试用成为实体门店的核心竞争力。未来，随着科技的持续迭代与消费场景的不断丰富，家电实体门店的消费体验将持续优化，推动家电实体零售朝着更懂用户、更贴生活的方向稳步升级。报告指出，人工智能技术在家电领域加速落地，家电市场进一步实现智能化升级。家电产品逐步实现从单点智能向全屋智能的跨越，健康监测、场景联动、适老化等功能持续优化，家庭服务机器人、智能厨房机器人等具身智能品类也将不断丰富。整体来看，家电市场智能化转型将持续向纵深推进，不断以升级的优质供给满足消费者的多元需求，实现家电市场扩容。(新华社)", "ctime": 1776327128, "time_str": "16:12:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260416/c676042486.shtml"}, {"id": "4236771", "title": "港股收评：恒生指数涨1.72%，恒生科技指数涨3.67%", "content": "港股收盘，恒生指数涨1.72%，恒生科技指数涨3.67%。恒指港股通ETF银华（159318）涨1.72%，港股通科技ETF鹏华（159751）涨2.85%。板块方面，电气设备、水务板块涨幅靠前；工业集团企业、建筑材料板块跌幅靠前。个股方面，思格新能涨103.42%，滴普科技涨29.46%，壁仞科技涨26.65%，龙蟠科技涨22.98%，天数智芯涨17.47%；果下科技跌14.96%，国富量子跌13.17%，蓝思科技跌12.67%，轩竹生物-B跌8.61%，怡俊集团控股跌7.69%。", "ctime": 1776327010, "time_str": "16:10:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260416/c676042302.shtml"}, {"id": "4236767", "title": "昌红科技：部分半导体相关产品已进入客户验证或小批量试用阶段", "content": "昌红科技近日在业绩说明会上表示，公司在巩固现有客户合作的基础上，持续关注半导体产业链相关机会，积极推进与晶圆制造、硅材料及封装测试等领域客户的业务交流与合作拓展。相关客户拓展工作正在有序推进中。目前，公司部分半导体相关产品已进入客户验证或小批量试用阶段。鉴于半导体行业对产品性能、稳定性及一致性要求较高，相关产品从验证到规模化供货通常需要经过较长周期，具体进展受客户验证节奏、产品应用场景等多方面因素影响。", "ctime": 1776326919, "time_str": "16:08:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260416/c676042076.shtml"}, {"id": "4236761", "title": "国家电影局：提升优质影片供给能力", "content": "记者4月16日从国家电影局获悉，2026年全国电影工作会议提出要坚守创作初心、打造精品力作，大力提升优质影片供给能力，全面激发电影产业创新创造活力。2026年全国电影工作会议4月15日 // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

  }
  tbody.innerHTML = PICKS.map(p => {

      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);

        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
