: "工信部：组织服务商牵头组建模数共振、算电协同等类型的“人工智能应用服务团”", "content": "工业和信息化部办公厅发布关于开展人工智能应用服务商培育专项行动的通知。其中指出，提升服务供给水平。组织服务商牵头组建模数共振、算电协同等类型的“人工智能应用服务团”，联合上下游单位打造一体化解决方案。统筹用好本地区国家人工智能应用中试基地、科技型企业孵化器等创新载体，为服务商提供技术研发、测试验证、中试熟化等基础条件，加速解决方案创新，支持服务商“专精特新”发展壮大。支持服务商聚焦软硬件适配、多模型协同等重点技术难题开展靶向攻关。鼓励服务商提升对安全可靠的操作系统、数据库、人工智能训练推理芯片等基础软硬件产品相关集成应用能力。及时向服务商推送各类人工智能软硬件产品安全风险信息和风险事件。引导服务商将网络安全、数据安全、伦理治理、业务合规等管理要求内嵌到研发、部署、应用全流程，变被动应对为主动防控。（工信部）", "ctime": 1788159970, "time_str": "15:06:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260831/c679442513.shtml"}, {"id": "5066401", "title": "工信部：到2027年底，下辖国家人工智能产业创新应用先导区的省份，本地区服务商资源池内企业数量应不少于100家", "content": "工业和信息化部办公厅发布关于开展人工智能应用服务商培育专项行动的通知。其中指出，建立服务商资源池。各地区组织摸排本地区服务商情况（包括注册在本地的中央企业），建立服务商档案。到2027年底，下辖国家人工智能产业创新应用先导区的省份，本地区服务商资源池内企业数量应不少于100家。工业和信息化部汇总各地区服务商资源池信息，依据相关标准形成全国服务商资源池，并适时进行发布。", "ctime": 1788159948, "time_str": "15:05:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260831/c679442493.shtml"}, {"id": "5066389", "title": "工信部：探索通过首购首用、风险补偿等模式 加大大模型、智能体、Token等服务采购力度", "content": "工业和信息化部办公厅发布关于开展人工智能应用服务商培育专项行动的通知。其中提到，推动规模化应用。引导服务商围绕高频、刚需、可复用的业务，封装构建模块化、标准化解决方案产品包，形成一批“小快轻准”的人工智能产品服务。依托产业联盟、行业协会、开源社区等平台，分行业开展针对性供需对接活动，对服务商进行宣介推广。组织开放一批真实场景，积极引入服务商开展落地实践，推动服务商的技术研发和成果转化，打造标杆方案，形成带动效应。探索通过首购首用、风险补偿等模式，加大大模型、智能体、Token等服务采购力度，提升行业用模用智质效。有条件的地区建立完善“出海”综合服务体系，依托一带一路、金砖、中国-东盟等合作机制平台，推动优质人工智能应用项目出海落地。", "ctime": 1788159922, "time_str": "15:05:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260831/c679442477.shtml"}, {"id": "5066357", "title": "ETF两市成交额报4426.94亿元，较上一交易日此时放量493.16亿元", "content": "截至目前，ETF两市成交额报4426.94亿元，较上一交易日此时放量493.16亿元，分类型来看，股票型ETF成交额1319.68亿元，债券型ETF成交额2079.44亿元，货币型ETF成交额283.3亿元，商品型ETF成交额173.05亿元，QDII型ETF成交额571.46亿元。", "ctime": 1788159774, "time_str": "15:02:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260831/c679442399.shtml"}, {"id": "5066351", "title": "工信部：开展人工智能应用服务商培育专项行动", "content": "工业和信息化部办公厅发布关于开展人工智能应用服务商培育专项行动的通知，以专项行动为牵引，建立服务商资源池，靶向提升服务商技术创新、集成交付、安全合规能力，锻造一批懂行业痛点、通技术机理、知安全风险、善交付运营的人工智能应用服务商队伍。到2026年底，全国服务商资源池内服务商数量突破2000家，形成结构合理、分工有序、协同创新的多层次梯队，复杂场景交付能力显著增强。到2027年底，全国服务商资源池内服务商数量不少于3000家，支撑形成全要素协同、全链条贯通、全场景覆盖的人工智能应用服务生态。", "ctime": 1788159757, "time_str": "15:02:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260831/c679442387.shtml"}, {"id": "5066349", "title": "A股收评：上证指数低开高走涨0.86% 影视院线、AI应用板块全线爆发", "content": "截至收盘，上证指数涨0.86%报3986.30点，深证成指涨0.44%报14015.00点，创业板指涨0.42%报3438.68点，北证50涨0.14%报1065.29点。三市成交额21453亿元，较上日放量276亿元。全市场超3100只个股上涨。\n板块题材上，AI视频、影视院线、煤炭开采加工、液冷服务器、银行、元件、苹果概念股涨幅居前；贵金属、光伏设备、创新药、能源金属、培育钻石、汽车整车、机场航运板块跌幅居前。\n盘面上，国内首部上星播出的AI长剧《后西游记》点燃短剧概念，荣信文化、芒果超媒、中广天择等多股涨停，中文在线、流金科技涨幅居前。液冷服务器板块多股走强，金富科技、海鸥股份、金帝股份等股封板，此前有报道称山东、广东等地液冷产线满产运行，核心设备CDU订单已排至2026年底。银行板块同样表现积极，中国银行、中信银行再创新高。此外，AI硬件方向震荡走强，午后持续收复跌幅。另一方面，沃什杰克逊霍尔“首秀”放鹰，国际金价承压，黄金股跟随下跌，湖南白银、赤峰黄金、晓程科技跌幅居前。房地产板块高开后大幅回落，我爱我家、深物业A、天保基建维持涨停，招商蛇口、深深房A、京能置业等股则回落下跌。", "ctime": 1788159742, "time_str": "15:02:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260831/c679442370.shtml"}, {"id": "5066347", "title": "欧洲主要股指开盘多数下跌", "content": "欧洲主要股指开盘多数下跌，欧洲斯托克50指数跌0.13%，法国CAC40指数涨0.03%，德国DAX指数跌0.41%。", "ctime": 1788159738, "time_str": "15:02:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260831/c679442367.shtml"}, {"id": "5066335", "title": "首创期货：成本提振，苯乙烯期价逼近涨停", "content": "供应方面，上周苯乙烯开工环比下降0.5个百分点。安庆石化40万吨计划9月5日开始停车大修2个月；盛虹45万吨停车检修中；连云港石化60万吨由于换热器故障计划于9月下旬停车检修10天；京博思达睿67万吨苯推迟至9月初重启。苯乙烯港口总库存环比下降1万吨。\n需求方面，随着旺季临近，下游整体负荷略有提升，前期库存成品整体偏低，补货采购跟进略有好转，但苯乙烯价格维持高位，下游行业利润维持亏损，终端维持刚需采购，ABS行业负荷平稳，原料以合约采购为主。出口装船带动港口库存回落。\n总之，地缘局势再度升级，原油和纯苯价格上涨，成本支撑强劲。此外，海峡继续关闭，出口需求维持，苯乙烯延续去库。预计短期苯乙烯期价维持偏强格局，关注成本端价格走势及港口库存变动情况。（首创期货）", "ctime": 1788159724, "time_str": "15:02:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260831/c679442362.shtml"}, {"id": "5066319", "title": "期货收评：美伊战火重燃！原油暴涨7%！焦煤甲醇大涨超6%", "content": "期货收评：截止收盘，国内期货主力合约涨多跌少，SC原油涨超7%，液化石油气（LPG）、焦煤涨超6%，甲醇、丙烯、聚氯乙烯（PVC）、乙二醇（EG）、瓶片触及涨停，涨6%。跌幅方面，沪金、沪银跌超3%，铂跌超2%，多晶硅跌超1%，棉纱、沪镍、菜粕跌近1%。", "ctime": 1788159695, "time_str": "15:01:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260831/c679442352.shtml"}, {"id": "5066301", "title": "ETF收评：影视ETF领涨7.07%，纳指生物科技ETF领跌4.43%", "content": "ETF收盘涨跌不一，影视ETF（516620）领涨7.07%，影视ETF（159855）涨6.33%，能源化工ETF（159981）涨5.09%，纳指生物科技ETF（513290）领跌4.43%，标普生物科技ETF（159502）跌3.91%，黄金ETF（159812）跌3.83%。", "ctime": 1788159667, "time_str": "15:01:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260831/c679442337.shtml"}, {"id": "5066279", "title": "TrendForce：DDR5 16Gb (2Gx8) 4800/5600现货均价较上日下跌0.03%", "content": "TrendForce数据显示，8月31日内存颗粒DDR5 16Gb (2Gx8) 4800/5600现货均价较上日下跌0.03%，DDR4 16Gb (2Gx8) 3200现货均价较上日上涨0.53%，DDR4 8Gb (1Gx8) 3200现货均价较上日上涨0.40%。", "ctime": 1788159624, "time_str": "15:00:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260831/c679442322.shtml"}, {"id": "5066275", "title": "股指期货午盘收盘 主力合约全线收涨", "content": "股指期货午盘收盘，主力合约全线收涨。沪深300股指期货(IF)主力合约涨0.20%，上证50股指期货(IH)主力合约涨0.29%，中证500股指期货(IC)主力合约涨0.56%，中证1000股指期货(IM)主力合约涨0.59%。", "ctime": 1788159622, "time_str": "15:00:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260831/c679442319.shtml"}, {"id": "5066253", "title": "电影《奥德赛》票房破6亿", "content": "据猫眼专业版数据，电影《奥德赛》上映18天，总票房破6亿。（界面新闻）", "ctime": 1788159517, "time_str": "14:58:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260831/c679442280.shtml"}, {"id": "5066235", "title": "吉祥航空等成立智能制造新公司", "content": "企查查APP显示，近日，国城动力（合肥）智能制造有限公司成立，经营范围包含船用配套设备制造；汽轮机及辅机制造；机械零件、零部件加工；金属表面处理及热处理加工等。企查查股权穿透显示，该公司由吉祥航空等共同持股。（人民财讯）", "ctime": 1788159300, "time_str": "14:55:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260831/c679442205.shtml"}, {"id": "5066229", "title": "工业和信息化部—国际电信联盟“空间促进发展”高级别研讨会在上海举行", "content": "8月31日，工业和信息化部—国际电信联盟“空间促进发展”高级别研讨会在上海市开幕。当前全球航天产业加速演进，低轨卫星互联网、终端直连卫星、5G/6G天地一体化融合网络等新技术、新业态蓬勃兴起，深刻影响全球经济社会发展，国际电信联盟在弥合数字鸿沟、鼓励技术创新、赋能全球增长方面的价值更加凸显。中方就全球空间无线电发展提出三点倡议：一是坚持普惠共赢，在国际电信联盟多边框架下，切实保障各成员国特别是发展中国家公平开发利用卫星频率轨道资源的权利。二是坚持创新驱动，构建开放包容、良性竞争、互利互惠的全球空间产业生态。三是坚持可持续发展，凝聚兼顾发展权益与安全保障的行业共识，构建可持续的太空发展空间。（人民财讯）", "ctime": 1788159280, "time_str": "14:54:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260831/c679442199.shtml"}, {"id": "5066155", "title": "海信视像在青岛成立光芯科技公司", "content": "企查查APP显示，近日，海信光芯（青岛）科技有限公司成立，经营范围包含软件外包服务；信息技术咨询服务；机械设备租赁等。企查查股权穿透显示，该公司由海信视像全资持股。（人民财讯）", "ctime": 1788158804, "time_str": "14:46:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260831/c679441996.shtml"}, {"id": "5066127", "title": "报告：机器人六维力传感器实现国产主导切换，头部厂商市占率突破80%", "content": "8月31日，赛迪与《中国电子报》联合发布的《2026年中国人形机器人六维力传感器市场调研报告》显示，去年中国人形机器人六维力传感器首次突破万颗；市场规模进入亿元级体量，国产厂商已占市场主导地位，行业前三厂商合计占据92.8%市场份额，蓝点触控以超80%市场份额位居首位，坤维科技、宇立仪器分别占比9.2%和3.3%。（人民财讯）", "ctime": 1788158707, "time_str": "14:45:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260831/c679441962.shtml"}, {"id": "5066125", "title": "上期所沥青主力合约大涨6%", "content": "上期所沥青主力合约大涨6%，报4874元/吨。", "ctime": 1788158672, "time_str": "14:44:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260831/c679441954.shtml"}, {"id": "5066107", "title": "应急管理部、工业和信息化部调派翼龙无人机持续开展应急指挥通信保障任务", "content": "西藏日喀则市吉隆县泥石流灾害发生后，灾区道路损毁、电力瘫痪、通信中断，应急管理部会同工业和信息化部立即调派3架翼龙无人机赶赴灾区，持续开展应急指挥通信保障、灾情侦察等任务。截至8月31日12时，翼龙无人机累计飞行超130余小时，保障通话3900余次。作业期间，加强翼龙无人机运行保障，执飞团队克服高海拔低温、峡谷乱流、气象多变等多重恶劣环境影响，采用“异地远程起降”“长距离大范围转场”“双机同域飞行”的战术战法，实现快速就位、多机协同保障，为受灾区域持续建立应急通信“生命线”。同时，持续开展灾情侦察，为风险研判、指挥决策提供支撑。（新华社）", "ctime": 1788158548, "time_str": "14:42:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260831/c679441907.shtml"}, {"id": "5066065", "title": "国产AI芯片企业财报数据集体爆发", "content": "国产AI芯片龙头半年报密集发布，壁仞科技、寒武纪、摩尔线程等头部企业均实现营收大幅增长。高端算力市场需求激增，供应端全链紧缺，部分企业订单已排至3年后。智算中心资源供不应求，算力服务商订单连续两年高速增长，客户数量增长10倍。国产芯片在高端AI芯片上处于强势上行周期，2026年需求规模约400万颗，实际交付约300万颗，存在百万级产能缺口。（央视财经）", "ctime": 1788158249, "time_str": "14:37:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260831/c679441783.shtml"}, {"id": "5066047", "title": "海南瑞泽等成立智算科技新公司", "content": "企查查APP显示，近日，海南瑞泽智算科技有限公司成立，经营范围包含物联网技术研发；人工智能应用软件开发；人工智能基础软件开发；人工智能公共数据平台；信息系统集成服务等。企查查股权穿透显示，该公司由海南瑞泽等共同持股。（人民财讯）", "ctime": 1788158167, "time_str": "14:36:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260831/c679441748.shtml"}, {"id": "5066045", "title": "沪深京三市成交额超1.9万亿元", "content": "据同花顺iFinD数据，沪深京三市成交额超1.9万亿元，预计全天成交金额约2.1万亿元。截至目前，沪市成交额9002亿元，深市成交额9873亿元，北证50成交额131亿元。", "ctime": 1788158157, "time_str": "14:35:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260831/c679441744.shtml"}, {"id": "5066027", "title": "海默智算明道（杭州）科技有限公司成立", "content": "企查查APP信息显示，近日，海默智算明道（杭州）科技有限公司成立，其经营范围涵盖人工智能公共数据平台、通用应用系统、双创服务平台、基础软件开发及资源与技术平台等。股权结构显示，该公司由海默科技全资子公司海默智算科技（杭州）有限公司等共同持股。（人民财讯）", "ctime": 1788158005, "time_str": "14:33:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260831/c679441705.shtml"}, {"id": "5065999", "title": "日韩股市收盘涨跌互现", "content": "日经225指数收跌0.14%，报66311.93点。韩国综指收涨0.46%，报6820.10点。", "ctime": 1788157902, "time_str": "14:31:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260831/c679441661.shtml"}, {"id": "5065967", "title": "亚太经合组织标准与合格评定分委会2026年第二次全体会议成功举办", "content": "2026年亚太经合组织（APEC）标准与合格评定分委会（SCSC）第二次全体会议近日在辽宁省大连市成功举办。作为APEC 2026年第三次高官会（SOM3）重要配套活动之一，会议由中方担任轮值主席，市场监管总局牵头组织。来自APEC成员经济体、区域专业机构、国际标准组织、工商界等70余名代表齐聚大连，围绕年度工作重点展开深度交流，为高官会及后续领导人会议夯实成果基础。（央视新闻）", "ctime": 1788157822, "time_str": "14:30:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260831/c679441630.shtml"}, {"id": "5065951", "title": "日本9月将迎来年内最大一波食品涨价潮", "content": "日本一家调查机构8月31日公布的调查结果显示，预计日本9月将有近5000种食品要涨价，迎来“年内最大一波涨价潮”。 调查机构帝国数据库公司对日本195家主要食品企业的调查显示，9月将要涨价的食品种类达到4923种，约为去年同期的3倍。这也是自2025年4月以来，单月涨价种类再度突破4000种。受中东局势恶化导致的原油价格走高影响，包装材料价格上涨，企业不断把成本转嫁到商品售价上。此外，受创纪录的日元贬值影响，进口成本持续走高，预计10月涨价的食品种类也将超过3000种。 该机构指出，预计日本2026年全年涨价的食品种类总数将超过2025年。(新华社)", "ctime": 1788157811, "time_str": "14:30:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260831/c679441625.shtml"}, {"id": "5065911", "title": "中盐集团与中国铁建签署战略合作协议", "content": "8月28日，中盐集团与中国铁建签署战略合作协议。双方将围绕盐穴项目投建营、基础设施、绿色低碳、科技创新、战新产业等领域探讨进一步合作。中国铁建表示将以此次签约为契机，发挥全产业链优势，深化合作，打造标杆项目。（人民财讯）", "ctime": 1788157568, "time_str": "14:26:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260831/c679441529.shtml"}, {"id": "5065905", "title": "滴滴自动驾驶新一代车型开启载客测试服务", "content": "8月31日，据滴滴自动驾驶消息，滴滴自动驾驶新一代Robotaxi R2近期正式开启无人载客测试服务，用户在北京、广州部分示范区域内可呼单体验全新智能出行服务。(新浪财经)", "ctime": 1788157509, "time_str": "14:25:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260831/c679441511.shtml"}, {"id": "5065897", "title": "觅蜂已累计生产超过100万小时高质量无本体数据", "content": "8月31日，记者从觅蜂MEgo两万套设备暨百万小时无本体数据下线仪式上获悉，觅蜂已累计生产超过100万小时高质量无本体数据，全部来自开放环境中的真实采集，覆盖22大类场景、1万余个真实环境、5万余类物体以及500余种细分任务，构建物理AI规模化数据供给。（人民财讯）", "ctime": 1788157437, "time_str": "14:23:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260831/c679441480.shtml"}, {"id": "5065875", "title": "欧亚经济联盟继续对原产于中国的机动车弹簧片征收反倾销税", "content": "8月28日，欧亚经济委员会内部市场保护司发布第2026/507AD29R1号公告，依据委员会2026年8月25日第111号决议，决定继续对原产于中国的机动车弹簧片征收14.11%的反倾销税，措施有效期至2031年8月24日。涉案产品的欧亚经济联盟税号为732010。（中国贸易救济信息网）", "ctime": 1788157142, "time_str": "14:19:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260831/c679441395.shtml"}, {"id": "5065869", "title": "科创50指数涨幅扩大至1%", "content": "科创50指数涨幅扩大至1%，现报1679.05点。", "ctime": 1788157123, "time_str": "14:18:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260831/c679441384.shtml"}, {"id": "5065857", "title": "三大指数相继翻红", "content": "三大指数相继翻红，沪指涨超近0.5%，创业板指收复此前近2%跌幅。", "ctime": 1788157066, "time_str": "14:17:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260831/c679441336.shtml"}, {"id": "5065851", "title": "郑商所PTA主力合约大涨5%", "content": "郑商所PTA主力合约大涨5%，报5880元/吨。", "ctime": 1788156989, "time_str": "14:16:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260831/c679441307.shtml"}, {"id": "5065807", "title": "半导体板块低开高走 睿创微纳盘中创历史新高", "content": "半导体板块低开高走，午后持续走强，睿创微纳盘中创历史新高，博通集成、瑞芯微涨停，力芯微涨超15%，星宸科技涨超10%，炬芯科技、艾为电子、乐鑫科技、盛景微、晶晨股份跟涨。相关ETF方面，科创芯片ETF汇添富（588750）涨0.55%，成交额1.48亿元，芯片ETF广发（159801）成交额1.09亿元。", "ctime": 1788156687, "time_str": "14:11:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260831/c679441202.shtml"}, {"id": "5065789", "title": "首创期货：美伊冲突重启推动原油系全线暴涨，地缘风险溢价强势回归", "content": "受周末美军轰炸伊朗军事设施及伊朗向美军基地发射导弹的消息刺激，国内原油系品种大幅上涨。当地时间8月30日，美军对伊朗南部霍尔木兹甘省拉腊克岛上两处伊斯兰革命卫队军事设施实施轰炸，这是美军一个月来首次对伊朗采取军事行动。伊朗伊斯兰革命卫队31日凌晨在社交媒体发布消息称，已向美军基地发射导弹作为回应。伊朗外交部副部长加里巴巴迪此前明确表示，霍尔木兹海峡目前完全关闭，任何船只通过均需要经过伊朗的协调和许可。原油的基本面强势具有确定性，但当前价格不宜追高。（首创期货）", "ctime": 1788156582, "time_str": "14:09:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260831/c679441169.shtml"}, {"id": "5065779", "title": "光大期货：美伊战火重燃，甲醇涨停", "content": "周一，国内能化板块再现集体暴涨。甲醇主力合约在上午触及涨停，截至发稿前仍未开板。PVC、乙二醇同步涨停，SC原油、LPG涨超7%，能化板块全线飘红，形成了8月26日暴跌之后的又一次极端行情。\n从背后传导逻辑来看，美伊再度交火，地缘风险溢价骤然回归。8月31日凌晨，伊朗伊斯兰革命卫队在社交媒体发布消息称，伊朗向美军基地发射导弹。稍早前，伊朗拉腊克岛附近传出爆炸声，据外媒报道，美方对位于该岛的军事设施实施了轰炸。伊朗方面称袭击导致多名士兵和民众伤亡，并誓言将予以“回应和惩罚”。与此同时，霍尔木兹海峡局势再度紧绷。英国海上贸易行动办公室30日通报，阿曼海塞卜以北12海里处一艘油轮在穿越霍尔木兹海峡时遭到不明投射物袭击。伊朗外交部副部长加里巴巴迪此前已明确表示，霍尔木兹海峡目前完全关闭，任何船只通过均需经伊朗协调和许可。此前8月26日，市场曾因美伊停火预期升温而出现恐慌性抛售，甲醇当日触及跌停。然而短短数日，地缘局势180度反转，停火预期被战火重燃彻底取代，此前回吐的地缘风险溢价重新注入盘面。（光大期货）", "ctime": 1788156514, "time_str": "14:08:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260831/c679441154.shtml"}, {"id": "5065755", "title": "郑商所对二甲苯主力合约大涨5%", "content": "郑商所对二甲苯主力合约大涨5%，报8442元/吨。", "ctime": 1788156330, "time_str": "14:05:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260831/c679441091.shtml"}, {"id": "5065747", "title": "小红书内测“朋友圈”：取名“发日常”，可设“三天可见”", "content": "小红书内测“发日常”功能，可同微信朋友圈一样实现“3天可见”，还能与小红书其他笔记分开，在用户主页独立展示，并能够随时转化为笔记。打开小红书 App，在发布页面上，已出现“发笔记”和“发日常”两个选项，选择“发日常”后，就像正常发帖一样，选择好图片或视频，点击下一步，在发布页面就可以设置可见范围了。发布后，这条动态只会展示3天，3天后会自动从主页隐藏，整体操作逻辑近似于微信朋友圈。此外，除了“三天可见”，这个功能还支持“仅粉丝可见”、“自定义分组”等权限。但目前这个功能只支持新发布的动态，之前发的笔记暂时无法批量设置为“三天可见”。（新浪科技）", "ctime": 1788156316, "time_str": "14:05:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260831/c679441085.shtml"}, {"id": "5065733", "title": "东华软件：与华为保持生态合作 正积极洽谈昇腾384超节点算力集群相关业务", "content": "东华软件(002065)8月31日在投资者互动平台表示，在国产算力方面，公司规划建设自主可控的智能计算基础设施，布局千卡至万卡级智能计算集群；生态方面，公司已与华为、摩尔、燧原等企业建立深度合作，形成场景落地与算力底座相互支撑的协同模式。另外，公司与华为保持深度生态合作，目前正积极对接洽谈昇腾384超节点算力集群相关业务。该商务洽谈事项存在一定不确定性，后续若业务形成明确落地规划且达到信息披露标准，公司将及时发布相关公告履行披露义务。（人民财讯）", "ctime": 1788156272, "time_str": "14:04:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260831/c679441069.shtml"}, {"id": "5065727", "title": "大商所纯苯主力合约触及涨停", "content": "大商所纯苯主力合约触及涨停，报7983元/吨，现涨幅为5.99%。", "ctime": 1788156239, "time_str": "14:03:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260831/c679441057.shtml"}, {"id": "5065687", "title": "郑商所瓶片主力合约触及涨停", "content": "郑商所瓶片主力合约触及涨停，报7596元/吨，现涨幅为6.0%。", "ctime": 1788156101, "time_str": "14:01:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260831/c679441013.shtml"}, {"id": "5065663", "title": "涉及新能源、智能驾驶等运行安全 新版强制性国标发布", "content": "记者今天了解到，市场监管总局（国家标准委）批准发布《机动车运行安全技术条件》（GB 7258—2026）强制性国家标准。新版标准将自2027年7月1日起实施。近年来，我国机动车保有量持续增长、新能源智能网联汽车渗透率逐渐提高，与此同时，传统车辆先进主被动安全装备普及率偏低，新能源智能网联汽车配套安全约束要求不足，新旧安全风险交织叠加。为进一步提升我国机动车运行安全水平，夯实道路交通安全管理基础，公安部会同工业和信息化部、交通运输部等部门组织修订了《机动车运行安全技术条件》强制性国家标准，重点从以下四个方面更新完善相关技术要求。一是提升大中型客货车本质安全。扩大自动紧急制动、电子稳定性控制、电控制动系统配备车型范围，新增轮胎气压监测、车道偏离预警系统配备要求，降低车辆侧翻、制动失效等安全风险。二是规范新能源、智能驾驶等新技术应用安全要求。规范“单踏板”制动、虚拟操纵件、车载娱乐系统应用以及新能源汽车起步加速性能、碰撞后动力切断功能等要求，增加新能源载客汽车应具备踏板误踩加速抑制功能，并提出装备组合驾驶辅助系统的汽车应具备激活条件确认、手眼脱离检测和运行异常检测等功能要求。三是完善车辆登记管理安全技术要求。进一步严格车辆识别代号打刻和载货部位结构要求，增加放大号牌号码粘贴空间要求和特型机动车、轮式专用机械车安全技术要求。四是增加典型车辆事故安全风险防范技术要求。（央视新闻）", "ctime": 1788156068, "time_str": "14:01:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260831/c679441005.shtml"}, {"id": "5065603", "title": "新疆各口岸今年出入境人员总量突破353万人次", "content": "记者从新疆边检总站了解到，截至8月30日，新疆边检总站今年出入境人员查验总量已突破353万人次，同比增长28.2%，较去年提前54天达到这一数量级。其中，入出境外国人达160.7万人次，同比增长28.3%，享受免签和临时入境许可政策入境的外国人64.7万人次，占入境外国人总数的79%。随着中吉经贸合作持续深化和贸易往来活力充分释放，中吉口岸客、货流实现大幅双增长。伊尔克什坦边检站今年出入境人员查验总量29.5万人次，较去年同比增长46.8%；交通运输工具26.4万辆次，较去年同比增长45.2%；吐尔尕特边检站今年出入境人员查验总量已突破27万人次，同比增长47.6%，较去年同期提前110天完成，出入境交通工具查验总量已突破21万辆次，同比增长39.7%，较去年同期提前75天完成。（央视新闻）", "ctime": 1788155963, "time_str": "13:59:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260831/c679440969.shtml"}, {"id": "5065581", "title": "拓荆科技持股公司等在青岛成立微波技术公司", "content": "企查查APP显示，近日，青岛联明微波技术有限公司成立，法定代表人为张振伟，注册资本为1000万元，经营范围包含输配电及控制设备制造；智能输配电及控制设备销售；电子专用设备制造；电子专用设备销售等。企查查股权穿透显示，该公司由深圳市联明电源股份有限公司、拓荆科技持股的拓荆科技（青岛）有限公司等共同持股。（人民财讯）", "ctime": 1788155698, "time_str": "13:54:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260831/c679440922.shtml"}, {"id": "5065543", "title": "物流周转效率提升 上合示范区国际公路运输货物超1.5万吨", "content": "位于山东青岛的“上合示范区”，是我国面向上合组织国家开展地方经贸合作的国家级平台。近年来，示范区持续完善跨境物流体系，累计通过国际公路发运货物超1.5万吨。近日，满载水果蔬菜、日用百货、轻工产品的TIR国际公路运输车辆在上合示范区整装待发。车队将经新疆霍尔果斯口岸出境，7天左右即可抵达乌兹别克斯坦、哈萨克斯坦等上合组织国家。传化上合（青岛）国际经贸有限公司总经理张全文：回程带回吉尔吉斯斯坦的蜂蜜、乌兹别克斯坦的坚果等商品。与铁路相比，国际公路运输大约可以节约一半时间。TIR国际公路运输凭借“门到门”的优势，解决了短途跨境、高时效货运的难题，尤其适配生鲜农产品、高附加值小件货物的跨境贸易需求。（央视新闻）", "ctime": 1788155166, "ti // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

      { name: '资金', val: p.fund, w: 15 },

    const miniBar = dims.map(d => {

        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
