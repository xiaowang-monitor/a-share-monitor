  padding: 20px;
  transition: all 0.2s;
}
.card:hover { background: var(--bg-card-hover); border-color: #334155; }
.badge {

  height: 6px; border-radius: 3px; background: #1e293b; overflow: hidden;
}
.score-bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s; }
.up { color: var(--red); }
.down { color: var(--green); }
.pulse { animation: pulse 2s infinite; }
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}
.glow { box-shadow: 0 0 20px rgba(59,130,246,0.15); }

</style>

路受损 亚得里亚海输油管道暂停向塞尔维亚输送原油", "content": "据塞尔维亚方面当地时间11月9日消息，因克罗地亚境内输油线路受损，亚得里亚海输油管道（JANAF）自11月6日起暂停向塞尔维亚潘切沃炼油厂输送原油。11月6日，克罗地亚境内锡萨克至斯拉沃尼亚布罗德路段在翻新改造施工期间发生意外，导致约50万升原油泄漏，相关修复工作仍在进行中。塞尔维亚石油公司表示，目前塞尔维亚国内各加油站燃油供应正常，正密切关注管道修复进展，以尽快恢复原油运输。（央视新闻）", "ctime": 1794223975, "time_str": "19:32:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261109/c681623921.shtml"}, {"id": "5607359", "title": "金圆股份：拟公开挂牌转让灌南金圆100.00%股权，评估减值率16.97%", "content": "金圆股份公告，公司拟通过杭州产权交易所有限责任公司公开挂牌转让通过丽水金圆持有的灌南金圆100.00%股权。灌南金圆股东全部权益评估价值为9931.22万元，与账面价值1.2亿元相比，评估减值2029.63万元，减值率16.97%。灌南金圆2026年1-7月营业收入542.26万元，净利润亏损1340.37万元。本次交易已经公司第十一届董事会第二十八次会议审议通过，最终受让方及交易价格尚不确定。", "ctime": 1794223886, "time_str": "19:31:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261109/c681623885.shtml"}, {"id": "5607321", "title": "精测电子：拟以1亿元-2亿元回购公司股份", "content": "精测电子公告，拟以不低于人民币1亿元且不超过人民币2亿元回购公司股份，回购价格不超过210元/股。回购股份的用途为注销并相应减少公司注册资本。按回购金额上限2亿元测算，预计回购股份数量95.24万股，约占当前公司总股本的0.34%；按回购金额下限1亿元测算，预计回购股份数量47.62万股，约占当前公司总股本的0.17%。回购期限自公司股东会审议通过回购股份方案之日起12个月内。", "ctime": 1794223791, "time_str": "19:29:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261109/c681623837.shtml"}, {"id": "5607319", "title": "龙洲股份：拟公开挂牌转让中汽宏远51%股权及债权，首次挂牌底价合计13.1亿元", "content": "龙洲股份公告，公司拟以公开挂牌方式转让控股孙公司东莞中汽宏远汽车有限公司51%股权及公司和新宇汽车对中汽宏远的全部债权，首次挂牌底价合计为13.1亿元（其中股权0元，债权131023.15万元）。截至评估基准日2026年6月30日，中汽宏远51%股权评估价值为-3.08亿元，债权本息合计13.1亿元，评估值为7.03亿元。本次交易已经公司第七届董事会第六十二次会议审议通过，尚需提交股东会审议。交易完成后，中汽宏远及其子公司不再纳入公司合并报表范围。", "ctime": 1794223786, "time_str": "19:29:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261109/c681623836.shtml"}, {"id": "5607295", "title": "72岁王健林重新出山 时隔14年再任万达商管董事长", "content": "天眼查信息显示，近日大连万达商业管理集团股份有限公司发生工商变更，72岁的王健林接任董事长，系时隔14年再度掌舵。截至目前，万达商管仍有4条被执行人信息，总执行金额7.37亿元，并有两条尚未解除的限高令。(21世纪经济报道)", "ctime": 1794223445, "time_str": "19:24:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261109/c681623773.shtml"}, {"id": "5607283", "title": "东易日盛：设立全资子公司华彧科技并完成工商登记，注册资本5000万元", "content": "东易日盛公告，根据公司发展战略规划，公司设立全资子公司华彧（海南）科技有限公司，注册资本5000万元人民币，以自有货币资金出资，持股比例100%。近日，华彧科技已完成工商注册登记手续，并取得海南省市场监督管理局颁发的营业执照。截至公告披露之日，华彧科技股东认缴出资尚未实缴到位，相关出资义务由股东按照章程约定的期限履行。本次投资事项未达到董事会审议标准，无需提交董事会审议，不构成关联交易，亦不构成重大资产重组。", "ctime": 1794223343, "time_str": "19:22:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261109/c681623765.shtml"}, {"id": "5607281", "title": "*ST泉为：控股股东及一致行动人1520.54万股被司法冻结、轮候冻结", "content": "*ST泉为公告，控股股东泉为绿能投资（海南）有限公司所持600万股被东莞市第一人民法院司法冻结，占其所持股份的58.41%、占公司总股本的3.75%；一致行动人广东国立科技控股有限公司所持1320.54万股被轮候冻结，占其所持股份的69.23%、占公司总股本的8.25%。截至2026年11月6日，两者所持股份累计被司法冻结、轮候冻结或强制执行、拍卖1520.54万股，占公司总股本的9.50%。公司称，本次事项不会导致控制权发生变更，亦不会对持续经营、公司治理产生重大不利影响。", "ctime": 1794223317, "time_str": "19:21:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261109/c681623758.shtml"}, {"id": "5607277", "title": "沪电股份：拟以5亿元-10亿元回购公司股份", "content": "沪电股份公告，拟以集中竞价交易方式回购公司股份，回购资金总额不低于人民币5亿元（含）且不超过人民币10亿元（含），回购价格不超过156.7元/股。回购股份数量总数的50%用于实施员工持股计划或股权激励；50%用于维护公司价值及股东权益，将在披露回购结果暨股份变动公告12个月后根据相关规则通过集中竞价交易方式全部予以出售。按回购金额上限10亿元和价格上限156.7元/股测算，预计回购股份数量约为638.16万股，约占当前公司总股本的0.33%。回购期限：用于员工持股计划或股权激励为自董事会审议通过之日起不超过12个月；用于维护公司价值及股东权益为不超过3个月。", "ctime": 1794223291, "time_str": "19:21:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261109/c681623755.shtml"}, {"id": "5607273", "title": "沪电股份：实际控制人合拍友联拟增持不低于2000万元且不超过3000万元", "content": "沪电股份公告，公司实际控制人吴礼淦家族控制的合拍友联有限公司计划自本公告披露之日起6个月内，以自有资金或自筹资金通过深圳证券交易所交易系统（包括深股通方式）以集中竞价交易方式增持公司股份，增持金额不低于人民币2000万元（含）且不超过人民币3000万元（含）。截至公告披露日，合拍友联持有公司股票1981.13万股，约占公司总股本的1.02%。本次增持不设定价格区间，合拍友联承诺在增持计划实施期间及法定期限内不减持所持有的公司股份。", "ctime": 1794223282, "time_str": "19:21:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261109/c681623751.shtml"}, {"id": "5607263", "title": "欧晶科技：重大诉讼原告撤诉，涉案金额约8952.75万元", "content": "欧晶科技公告，公司此前披露原告中铁三局集团有限公司以建设工程施工合同纠纷为由起诉公司及子公司宁夏欧晶科技有限公司，涉案金额约8952.75万元。近日公司收到银川市西夏区人民法院民事裁定书，法院准许原告撤回对银川高新技术产业开发有限责任公司、宁夏欧晶科技有限公司、内蒙古欧晶科技股份有限公司、宁夏中环光伏材料有限公司的起诉。公司及子公司不属于案涉纠纷合同主体，无需对本案承担任何清偿责任，本次撤诉不会对公司本期利润及期后利润产生重大影响。", "ctime": 1794223181, "time_str": "19:19:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261109/c681623740.shtml"}, {"id": "5607241", "title": "*ST禾信：发行股份及支付现金购买量羲技术56.00%股权已完成资产过户", "content": "*ST禾信公告，公司此前披露拟发行股份及支付现金购买吴明、上海堰岛企业管理合伙企业（有限合伙）合计持有的上海量羲技术有限公司56.00%股权并募集配套资金。截至2026年11月5日，标的资产量羲技术56.00%股权已全部办理工商变更登记手续并取得新营业执照，过户事宜全部办理完毕，公司当前持有量羲技术56.00%股权，标的公司成为公司直接持股的控股子公司。后续尚需完成过渡期损益专项审计、支付交易对价及办理新增股份登记上市、配套募集资金等事项。", "ctime": 1794222999, "time_str": "19:16:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261109/c681623698.shtml"}, {"id": "5607237", "title": "白云山：子公司广州医药拟公开挂牌增资扩股募资不超60亿元", "content": "白云山公告，控股子公司广州医药拟通过广州产权交易所公开挂牌引入战略投资者并实施股票定向发行，计划征集不超过15家投资者，发行价格不低于3.46元/股，定向发行股票不超过17.34亿股，募集资金规模不超过60亿元。本次增资扩股已经公司第十届董事会第六次会议审议通过，尚须提交公司股东会审议。本次增资扩股完成后，预计公司持有广州医药股权不低于53.23%，公司仍为广州医药的控股股东。", "ctime": 1794222993, "time_str": "19:16:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261109/c681623696.shtml"}, {"id": "5607233", "title": "韩国高考将有专人查AI眼镜", "content": "今年的韩国大学修学能力考试（即高考）定于本月19日举行。韩国教育部9日发布“考生注意事项指南”，明确禁止考生携带任何电子设备进入考场，尤其是出现在近期多起作弊丑闻的人工智能（AI）眼镜。指南显示，禁带物品包括手机、平板电脑、AI眼镜、智能手表、具备蓝牙通信功能的耳机和电子烟。考生若误将电子设备带入考场，须在第一场考试开始前按监考人员要求上交，所有科目考完后方可领回；若未按要求上交，一经发现将按作弊处理，考试成绩作废。（新华社）", "ctime": 1794222989, "time_str": "19:16:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261109/c681623695.shtml"}, {"id": "5607231", "title": "新亚制程：拟向唯特偶出售标的公司不低于51%股权，已签署投资意向协议", "content": "新亚制程公告，公司与深圳市唯特偶新材料股份有限公司于2026年11月9日签署《投资意向协议》，公司拟将主要的电子胶粘剂等相关业务、资产和人员整合至全资孙公司深圳市新亚新材料有限公司及其下属子公司，唯特偶拟以现金方式收购标的公司不低于51%的股权。截至协议签署日，尽职调查、审计评估、公司内部整合等各项工作尚未完成，交易方案及最终交易价格尚未确定，尚需双方履行内部决策程序并签署正式协议。", "ctime": 1794222978, "time_str": "19:16:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261109/c681623691.shtml"}, {"id": "5607229", "title": "中化国际：发行股份购买南通星辰100%股权获上交所重组委审核通过", "content": "中化国际公告，公司此前披露拟以发行股份方式向中国蓝星（集团）股份有限公司购买其所持有的南通星辰合成材料有限公司100%股权。上海证券交易所并购重组审核委员会于2026年11月9日召开2026年第21次审议会议，审议结果为本次交易符合重组条件和信息披露要求。本次交易尚需经中国证券监督管理委员会同意注册后方可实施。", "ctime": 1794222968, "time_str": "19:16:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261109/c681623688.shtml"}, {"id": "5607205", "title": "布伦特原油失守96美元/桶", "content": "布伦特原油失守96美元/桶，日内跌2.49%。", "ctime": 1794222741, "time_str": "19:12:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261109/c681623630.shtml"}, {"id": "5607191", "title": "宏达电子：拟定增募资不超过10亿元用于片式高分子聚合物钽电容产业化建设项目及陶瓷薄膜电路与SLC产业化建设项目", "content": "宏达电子公告，拟向不超过35名特定对象发行股票，募集资金总额不超过10亿元（含本数），扣除发行费用后拟用于片式高分子聚合物钽电容产业化建设项目（拟投入53000.00万元）及陶瓷薄膜电路与SLC产业化建设项目（拟投入47000.00万元）。本次发行尚需取得国防科工局审查批准、公司股东会审议通过，并取得深交所审核通过及中国证监会同意注册后方可实施。", "ctime": 1794222580, "time_str": "19:09:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261109/c681623565.shtml"}, {"id": "5607189", "title": "大族数控：拟以2亿元-3亿元回购公司股份", "content": "大族数控公告，拟以不低于人民币2亿元（含）且不超过人民币3亿元（含）回购公司A股股份，回购价格不超过人民币214元/股（含），回购股份的用途为用于维护公司价值及股东权益（出售）。按回购金额上限3亿元（含）、回购价格上限214元/股（含）测算，预计回购股份数量140.19万股（含），约占当前公司总股本的0.29%；按回购金额下限2亿元（含）测算，预计回购股份数量93.46万股（含），约占当前公司总股本的0.19%。回购期限为自公司董事会审议通过本次回购股份方案之日起不超过2个月，资金来源为自有资金及/或自筹资金。", "ctime": 1794222514, "time_str": "19:08:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261109/c681623437.shtml"}, {"id": "5607187", "title": "天邦食品：2026年10月商品猪销售收入4.74亿元，环比增长2.53%", "content": "天邦食品公告，公司2026年10月份销售商品猪54.34万头（其中仔猪销售6.94万头），销售收入4.74亿元，销售均价8.84元/公斤（商品肥猪均价为9.03元/公斤），环比变动分别为7.94%、2.53%、-11.34%。2026年1-10月销售商品猪626.29万头（其中仔猪销售212.96万头），销售收入52.68亿元，销售均价10.54元/公斤（商品肥猪均价为10.06元/公斤），同比变动分别为17.65%、-21.28%、-31.07%。", "ctime": 1794222506, "time_str": "19:08:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261109/c681623421.shtml"}, {"id": "5607185", "title": "欧洲代表是否参加乌克兰问题三方谈判 俄方最新回应", "content": "当地时间11月9日，俄方新闻秘书佩斯科夫表示，即将在阿联酋阿布扎比举行的乌克兰问题谈判是在美国调解下的三方会谈，欧洲国家拥有与美国和乌克兰沟通的渠道，将在阿布扎比举行三方谈判。同日，欧盟委员会主席冯德莱恩表示，当天与乌克兰总统泽连斯基通话，双方讨论了即将在阿布扎比举行的乌克兰问题谈判，欧盟将“与其合作伙伴一同出席相关谈判”。美国高级官员此前透露，美国将于11月10日至11日在阿布扎比与乌克兰和俄罗斯举行三方会谈。（央视新闻）", "ctime": 1794222445, "time_str": "19:07:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261109/c681623298.shtml"}, {"id": "5607179", "title": "艾为电子：筹划发行股份及支付现金购买钰泰股份控股权，股票自2026年11月10日起停牌", "content": "艾为电子公告，公司正在筹划以发行股份及支付现金的方式购买钰泰半导体股份有限公司全部或部分股权（控股权）并募集配套资金，经初步测算可能构成重大资产重组，不会导致公司实际控制人变更，不构成重组上市。公司已与交易标的主要股东签署《股权收购意向协议》。因交易尚存在不确定性，公司股票及可转债自2026年11月10日开市起停牌，预计停牌时间不超过10个交易日。", "ctime": 1794222378, "time_str": "19:06:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261109/c681623261.shtml"}, {"id": "5607171", "title": "华银电力：调整2025年度定增方案，募资规模由不超过15亿元下调至不超过6亿元", "content": "华银电力公告，公司于2026年11月9日召开董事会，审议通过调整2025年度向特定对象发行A股股票方案。募集资金规模由不超过15亿元（含本数）调整为不超过6亿元（含本数），扣除发行费用后拟用于桂东普洛风电场项目（拟投入6000.00万元）、桂阳团结风电场项目（拟投入6000.00万元）、通道县金坑风电场项目（拟投入12000.00万元）、芷江县碧涌大树坳风电场项目（拟投入18000.00万元）及补充流动资金（拟投入18000.00万元）。除上述调整外，本次发行方案其他内容保持不变。", "ctime": 1794222338, "time_str": "19:05:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261109/c681623248.shtml"}, {"id": "5607165", "title": "华菱钢铁：子公司拟31.47亿元投建汽车板三期项目", "content": "华菱钢铁公告，公司下属子公司华菱安赛乐米塔尔汽车板有限公司拟实施汽车板三期建设项目，新建一条年产能85万吨的高效能真空涂镀生产线与一条年产能100万吨的连续退火线及其配套设施，项目总投资估算为31.47亿元（含税），资金来源为50%企业自有资金、50%银行贷款，建设工期28个月。项目投产后，汽车板公司镀锌年产能将由200万吨提升到300万吨。该议案已获公司第九届董事会第十二次会议审议通过，无须提交股东会审议。", "ctime": 1794222326, "time_str": "19:05:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261109/c681623241.shtml"}, {"id": "5607159", "title": "美团无人机Keeta Drone进入中亚市场", "content": "美团无人机海外品牌Keeta Drone以“解决方案提供商”模式正式进入中亚市场。美团与哈萨克斯坦当地合作伙伴及阿斯塔纳市政府签署合作备忘录，以战略合作伙伴身份参与当地低空配送体系建设，向本地合作伙伴输出技术与运营能力，培养本土化运营团队。（科创板日报）", "ctime": 1794222285, "time_str": "19:04:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261109/c681623216.shtml"}, {"id": "5607145", "title": "热景生物：SGC001创新药Ib期临床数据在AHA年会以壁报形式报告", "content": "热景生物公告，控股子公司舜景医药在美国心脏协会科学年会（AHA）以壁报形式报告SGC001注射液Ib期临床研究数据。安全性方面，低、中、高三个剂量组均表现良好安全性和耐受性，未发生3级及以上治疗中出现的不良事件，未发生严重不良事件，也无因不良事件导致停药的情况。心脏磁共振评估显示，中高剂量组心肌梗死面积百分比中位数分别降低20.5%和38.1%，三个治疗组在改善微血管阻塞方面均优于安慰剂组。", "ctime": 1794222227, "time_str": "19:03:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261109/c681622976.shtml"}, {"id": "5607141", "title": "迈为股份：周剑与王正根一致行动协议到期解除，控股股东变更为周剑一人", "content": "迈为股份公告，公司控股股东、实际控制人周剑与王正根签署的《一致行动协议之补充协议（六）》于2026年11月9日到期终止，双方决定不再续签新的《一致行动协议》。一致行动关系解除后，两人各自持股数量及比例保持不变，不再合并计算。周剑直接持有公司59111671股，占总股本21.19%，并通 function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';

  if (score >= 50) return '<span class="badge badge-b">B</span>';

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
