itle": "蚂蚁灵波启动首轮融资，拟募资 15 亿元，年底完成二轮融资", "content": "蚂蚁集团旗下具身智能公司灵波科技已启动首轮融资，首轮拟募资 15 亿元，目标在今年年底完成二轮融资。该融资若如期完成，将突破具身领域创业公司的融资速度。(晚点latepost)", "ctime": 1785737676, "time_str": "14:14:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260803/c678622470.shtml"}, {"id": "4865515", "title": "沪深京三市成交额超1.7万亿元，较上日此时缩量4746亿元", "content": "据同花顺iFinD数据，沪深京三市成交额超1.7万亿元，较上日此时缩量4746亿元，预计全天成交金额约2.0万亿元。截至目前，沪市成交额8033亿元，深市成交额8851亿元，北证50成交额115亿元。", "ctime": 1785737607, "time_str": "14:13:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260803/c678622455.shtml"}, {"id": "4865491", "title": "上半年我国分红险原保险保费收入同比增长94.4%", "content": "记者从中国保险行业协会获悉，2026年上半年，保险市场运行总体平稳，业务结构持续优化。人身险公司实现原保险保费收入约2.87万亿元，其中，分红险原保险保费收入约1.01万亿元，同比增长94.4%。(新华社)", "ctime": 1785737512, "time_str": "14:11:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260803/c678622421.shtml"}, {"id": "4865437", "title": "大连通报3起破坏营商环境典型案例", "content": "大连市纪委监委3日通报3起破坏营商环境典型案例。大连市政府原副秘书长董伟为他人在规划审批等方面提供帮助，破坏营商环境等问题。2001年至2014年，董伟利用职务上的便利，为多家企业和个人在规划审批、减少执法检查次数、工程款结算等方面提供帮助，非法收受财物。董伟还存在其他严重违纪违法问题。2026年2月，董伟被开除党籍、按规定取消其享受的待遇，涉嫌犯罪问题被移送检察机关依法审查起诉。（新华社）", "ctime": 1785737370, "time_str": "14:09:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260803/c678622401.shtml"}, {"id": "4865435", "title": "卢拉再次参选，誓言“绝不允许他国入侵巴西”", "content": "巴西劳工党8月2日正式确认现总统卢拉为该党总统候选人。卢拉将再次参加大选，角逐其第四个总统任期。当天，巴西劳工党全国代表大会在圣保罗举行，会议正式批准卢拉与现任副总统热拉尔多·阿尔克明（社会党）再次组成竞选搭档。劳工党主席埃迪尼奥·席尔瓦在会上宣布，该党已在高等选举法院完成相关候选人登记工作。现年80岁的卢拉在大会现场发表讲话表示，本届政府在全国各州取得的执政成绩将成为本次竞选重要依托。“我们可以充满自豪地向各地民众展现联邦政府所作出的贡献。”（新华社）", "ctime": 1785737366, "time_str": "14:09:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260803/c678622400.shtml"}, {"id": "4865433", "title": "倪虹出席2026中国—东盟建设部长圆桌会议", "content": "8月1日，2026中国—东盟建设部长圆桌会议在马来西亚怡保召开。住房城乡建设部部长倪虹率团出席会议，致开幕辞并作主题发言,介绍了中国住房城乡建设“十五五”规划、“好房子”建设、城市更新等方面的经验和做法。马来西亚房屋及地方政府部部长倪可敏主持会议，东盟秘书长高金洪出席活动。倪虹指出，在中国-东盟建设部长圆桌会议框架下，中国与东盟在住房城乡建设领域的战略互信持续深化，交流合作日益紧密，构建了政府、企业多层级合作机制，落地了一批合作项目，在专业人才联合培养及技术标准相互融通等方面均取得了显著成效，这是中国-东盟全面战略伙伴关系不断深化的生动体现。推动城市高质量发展是中国和东盟的共同目标，中方愿继续秉持睦邻、安邻、富邻、亲诚惠容、命运与共的理念方针，进一步加强住房和城市建设领域的合作，携手共创更具亚太特色、更加璀璨昌盛的城市文明。（住建部）", "ctime": 1785737263, "time_str": "14:07:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260803/c678622358.shtml"}, {"id": "4865423", "title": "马杜罗社媒账号发声 欢迎委内瑞拉政治对话", "content": "遭美国强行控制的委内瑞拉总统尼古拉斯·马杜罗2日借助社交媒体发声，对委内瑞拉政府与反对派拟于本周举行会晤表示欢迎。委内瑞拉政府和反对派本月1日宣布，预计接下来一周在首都加拉加斯举行对话。据称，这一对话得到美国支持。委反对派头面人物玛丽亚·科丽娜·马查多将不参加此次对话。她先前称，不会阻碍相关进程。（央视新闻）", "ctime": 1785737205, "time_str": "14:06:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260803/c678622345.shtml"}, {"id": "4865253", "title": "蚂蚁集团、东方国信入股AI投研科技公司熵简科技", "content": "企查查APP显示，近日，北京熵简科技有限公司发生工商变更，新增蚂蚁科技集团股份有限公司全资子公司上海云玡企业管理咨询有限公司、东方国信等为股东。企查查信息显示，该公司成立于2017年，经营范围包含：软件销售；计算机系统服务；软件开发；咨询策划服务等。公开信息显示，熵简科技是一家专注于智能投研辅助决策工具的研发机构。（人民财讯）", "ctime": 1785736742, "time_str": "13:59:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260803/c678622230.shtml"}, {"id": "4865251", "title": "造纸板块持续走高，凯恩股份涨停", "content": "造纸板块持续走高，凯恩股份涨停，宜宾纸业、五洲特纸、青山纸业、恒丰纸业、荣晟环保跟涨。", "ctime": 1785736734, "time_str": "13:58:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260803/c678622229.shtml"}, {"id": "4865225", "title": "硅料硅片板块走高，通威股份涨停", "content": "硅料硅片板块走高，通威股份涨停，大全能源、TCL中环、弘元绿能、华民股份、双良节能等纷纷走高。", "ctime": 1785736384, "time_str": "13:53:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260803/c678622175.shtml"}, {"id": "4865221", "title": "存储芯片概念股持续走弱，兆易创新逼近跌停", "content": "存储芯片概念股持续走弱，兆易创新逼近跌停，普冉股份跌超10%，德明利、佰维存储、香农芯创、江波龙、澜起科技等跌幅靠前。", "ctime": 1785736340, "time_str": "13:52:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260803/c678622167.shtml"}, {"id": "4865211", "title": "广期所多晶硅主力合约触及涨停", "content": "广期所多晶硅主力合约触及涨停，报35890元/吨，现涨幅为8.99%。", "ctime": 1785736259, "time_str": "13:50:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260803/c678622150.shtml"}, {"id": "4865175", "title": "《浙江省水路交旅融合发展行动方案（2026—2030年）》印发", "content": "《浙江省水路交旅融合发展行动方案（2026—2030年）》近日印发，方案提出，到2030年，全省水路交旅融合发展整体起势，“四带十链百珠”发展格局基本形成，“泛舟浙里”省域交旅融合品牌全面打响；水路客运量突破6100万人次；形成千年古运河、杭州“三江两岸”、舟山“蓝色岛链”等三大知名水上游线，培育精品游线30条；建成“微改精提”项目15个；举办“泛舟浙里”宣推活动超100场，品牌曝光度超10亿；拉动游客直接消费超100亿；建成杭州水路交旅融合试验区；水路旅游经济贡献度和游客关注度满意度显著提升。（人民财讯）", "ctime": 1785735791, "time_str": "13:43:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260803/c678621884.shtml"}, {"id": "4865167", "title": "7月公募基金打新获配近140亿元，浮盈比例达404.9%", "content": "公募排排网数据显示，截至7月31日，7月共有114家公募机构参与了5只当月上市新股网下配售，合计获配金额139.15亿元，按新股上市首日收盘价涨跌幅统计，公募打新合计浮盈563.42亿元，浮盈比例为404.9%。从整体获配金额看，公募基金参与长鑫科技获配金额居首，共有100家基金公司参与长鑫科技网下配售，合计获配金额108.29亿元。其次是华润新能源，78家基金公司参与该股网下配售，合计获配金额23.48亿元。第三是泰诺麦博，92家公募机构参与该股网下配售，合计获配金额3.44亿元。此外，98家公募机构参与了欣兴工具网下配售，合计获配金额1.99亿元。99家公募机构参与了托伦斯网下配售，合计获配金额1.94亿元。（中证金牛座）", "ctime": 1785735697, "time_str": "13:41:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260803/c678621841.shtml"}, {"id": "4865165", "title": "局地将超50℃，新疆发布高温红色预警", "content": "新疆维吾尔自治区气象台2026年8月3日12时39分将高温橙色升级为高温红色预警信号：预计今天白天至6日白天，巴州、吐鲁番市、哈密市等地的最高气温将升至40℃以上，巴州南部、吐鲁番市、哈密市等地的局部区域45℃以上，局地将达50℃以上。请注意防暑降温和用火用电安全，并加强防范山区局地融雪型洪水。（央视新闻）", "ctime": 1785735646, "time_str": "13:40:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260803/c678621820.shtml"}, {"id": "4864985", "title": "沪深京三市成交额超1.5万亿元，较上日此时缩量4606亿元", "content": "据同花顺iFinD数据，沪深京三市成交额超1.5万亿元，较上日此时缩量4606亿元，预计全天成交金额约1.9万亿元。截至目前，沪市成交额7049亿元，深市成交额7847亿元，北证50成交额104亿元。", "ctime": 1785734824, "time_str": "13:27:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260803/c678621389.shtml"}, {"id": "4864975", "title": "DeepSeek模型单日吞下8万亿Token OpenAI打折追赶", "content": "北京时间8月3日，海外开发者开源项目团队OpenCode发文称，其平台上DeepSeekV4Flash的调用量大幅飙升，单日处理达8T（万亿）Token。其中5T为免费试用额度消耗，3T为开发者通过OpenCode平台付费使用。与此同时，模型API分发平台OpenRouter最新数据显示，上周（7月27日至8月2日）DeepSeek V4 Flash以7.22万亿Token的周调用量位居第一。（新浪财经）", "ctime": 1785734707, "time_str": "13:25:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260803/c678621324.shtml"}, {"id": "4864881", "title": "四川宜宾市高县发生4.2级地震，震源深度5千米", "content": "中国地震台网正式测定：08月03日13时00分在四川宜宾市高县（北纬28.55度，东经104.67度）发生4.2级地震，震源深度5千米。（界面新闻）", "ctime": 1785733818, "time_str": "13:10:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260803/c678620829.shtml"}, {"id": "4864879", "title": "煤炭开采加工板块拉升，新大洲A涨停", "content": "煤炭开采加工板块拉升，新大洲A涨停，华电能源、安泰集团、恒源煤电、开滦股份、美锦能源跟涨。", "ctime": 1785733793, "time_str": "13:09:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260803/c678620819.shtml"}, {"id": "4864877", "title": "文远知行布局丹麦首个商业化自动驾驶共享出行项目", "content": "8月3日，文远知行WeRide与丹麦本土共享电动车出行平台GreenMobility宣布达成战略合作，共同打造丹麦首个商业化自动驾驶共享出行项目。根据计划，文远知行与GreenMobility将与丹麦公路管理局（Vejdirektoratet）、丹麦道路交通管理局（Færdselsstyrelsen）及其他国家和地方主管部门密切协作，在严格遵循丹麦及欧盟现行法律法规的前提下，有序推进项目测试与部署，为丹麦公众带来安全、普惠、可持续的自动驾驶出行服务，助力当地智慧出行发展。（人民财讯）", "ctime": 1785733723, "time_str": "13:08:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260803/c678620783.shtml"}, {"id": "4864833", "title": "四川：到2026年底智算规模较“十四五”末实现翻番、达到60EFLOPS，占比达80%以上", "content": "《四川省推进算力设施优化布局提质建设和算电融合发展实施方案（2026—2028年）》近日印发。其中提出，到2026年底，打造标杆引领、推动算力量质齐升。推动阿里云、四川数据集团等一批万卡集群建成投用，推动“三州”地区算电融合发展取得突破。智算规模较“十四五”末实现翻番、达到60EFLOPS（EFLOPS为每秒百亿亿次浮点运算），占比达80%以上。新建大型以上数据中心PUE降至1.2以下，绿电使用比例达80%以上。到2027年底，拓展发展格局、实现智算规模翻番。落地建设更多高能级算力设施项目，以天府数据中心集群（成都）为支撑，因地制宜拓展算力发展空间，推动“一区一带两节点”的总体格局初步形成。智算规模再翻一番、超过120EFLOPS，占比达到85%以上。2028年底，健全生态体系、建成西部算力高地。初步构建与四川省经济发展水平相适应、与全国一体化算力网深度融合的算力设施体系。智算规模较“十四五”末翻三番、达到240EFLOPS，占比超过90%。（第一财经）", "ctime": 1785733443, "time_str": "13:04:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260803/c678620650.shtml"}, {"id": "4864709", "title": "索尼集团股价一度下跌6.1%", "content": "索尼集团股价一度下跌6.1%，创下自5月14日以来的最大单日跌幅。尽管7月31日发布的盈利报告超出市场预期，但市场将业绩改善主要归因于关税退款。", "ctime": 1785732965, "time_str": "12:56:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260803/c678620443.shtml"}, {"id": "4864705", "title": "富瑞将花旗集团目标价从165美元下调至160美元", "content": "富瑞将花旗集团目标价从165美元下调至160美元。", "ctime": 1785732835, "time_str": "12:53:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260803/c678620399.shtml"}, {"id": "4864635", "title": "缅甸官方：昂山素季会见红十字国际委员会驻缅代表", "content": "缅甸总统办公室3日发布消息说，昂山素季当日上午会见了红十字国际委员会缅甸代表处常驻代表。（新华社）", "ctime": 1785731715, "time_str": "12:35:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260803/c678619937.shtml"}, {"id": "4864603", "title": "韩国总统李在明支持率跌至就职以来最低点", "content": "周一公布的一项民调显示，受股市暴跌等争议的影响，韩国总统李在明的支持率跌至去年6月就职以来的最低水平。这项由Realmeter公司进行、受媒体EKN委托的民调显示，民众对李在明的正面评价较前一周下降0.4个百分点至45.9%，这也是连续第三周下滑。民众对李在明的负面评价上升1个百分点至50.5%，首次突破50%关键位。同一民调机构进行的另一项民调显示，执政党共同民主党的支持率为45.1%，较前一周上升3.8个百分点；而主要反对党国民力量党的支持率则下降2.9个百分点，至37.7%。（韩联社）", "ctime": 1785730737, "time_str": "12:18:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260803/c678619621.shtml"}, {"id": "4864589", "title": "世界银行下调菲律宾2027年经济增长预期至5.2%", "content": "世界银行集团将菲律宾明年经济增长预期下调至5.2%，但该行预计投资将会回暖，菲律宾央行重启宽松政策。世界银行在年中版《菲律宾经济展望》中表示：“基准情景预测，随着治理环境趋于稳定、公共投资逐步复苏，菲律宾央行重启宽松政策，2027年经济增速回升至5.2%。”注：最新2027年增长预测低于6月《全球经济展望》给出的5.6%。世界银行指出：“在基准情景下，随着投资回归常态、金融环境宽松，2027年至2028年经济增长有望向潜在增速靠拢。”世界银行预计菲律宾2026年经济增速为3.7%。（新浪财经）", "ctime": 1785730355, "time_str": "12:12:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260803/c678619362.shtml"}, {"id": "4864575", "title": "台风“白海豚”减弱为强台风级 周四起影响我国", "content": "今年第13号台风“白海豚”已于今天早晨由超强台风级减弱为强台风级，其中心上午8时位于琉球群岛那霸市偏东方向大约2090公里的西北太平洋上。预计，“白海豚”将以每小时20～25公里的速度向西偏北方向移动，强度变化不大。它的风雨影响将会在本周四开始显现，华东沿海本周末将会有明显风雨天气，在缓和高温酷热的同时，浙江、江西等省份要防范台风可能带来的暴雨。（央视新闻）", "ctime": 1785730141, "time_str": "12:09:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260803/c678619282.shtml"}, {"id": "4864571", "title": "意军方称在地中海拦截一艘俄“影子舰队”油轮", "content": "意大利国防部2日发表声明说，在地中海执行欧盟长期军事行动的意大利海军当天拦截一艘受制裁的俄罗斯“影子舰队”油轮。意国防部在声明中说，这艘受欧盟制裁的油轮在地中海潘泰莱里亚以西海域被拦截。该油轮船长拒绝配合，意大利军方小组对其进行登船检查。行动得到一艘希腊海军舰艇和一架波兰海上巡逻机的支援。声明说，该船悬挂喀麦隆国旗，7月16日从贝宁科托努港出发，目的地为土耳其伊斯坦布尔。登船检查后获取的信息和文件正在审查中。西方国家指责俄罗斯利用油轮等商用船只逃避西方制裁，将这些商用船只称为“影子舰队”。(新华社)", "ctime": 1785729957, "time_str": "12:05:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260803/c678619201.shtml // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
