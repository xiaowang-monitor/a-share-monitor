": "", "url": "https://news.10jqka.com.cn/20260826/c679302522.shtml"}, {"id": "5031183", "title": "财政部：7月份全国共销售彩票875.71亿元 同比增长68.6%", "content": "财政部数据显示，7月份，全国共销售彩票875.71亿元，同比增加356.22亿元，增长68.6%，主要是足球世界杯期间竞猜型彩票销量增长较快。其中，福利彩票机构销售156.31亿元，同比减少22.96亿元，下降12.8%；体育彩票机构销售719.40亿元，同比增加379.18亿元，增长111.5%。1-7月累计，全国共销售彩票4144.45亿元，同比增加446.42亿元，增长12.1%。其中，福利彩票机构销售1157.20亿元，同比减少93.17亿元，下降7.5%；体育彩票机构销售2987.25亿元，同比增加539.60亿元，增长22.0%。", "ctime": 1787728705, "time_str": "15:18:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260826/c679302410.shtml"}, {"id": "5031177", "title": "川恒股份：目前未收到主管部门对公司主要出口产品限制出口的文件", "content": "川恒股份8月26日在互动平台表示，目前未收到主管政府部门对公司主要出口产品限制出口的相关文件。", "ctime": 1787728680, "time_str": "15:18:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260826/c679302385.shtml"}, {"id": "5031165", "title": "高盛当前预计澳大利亚央行将在11月加息", "content": "高盛经济学家Andrew Boak等人周三在研报中称，鉴于通胀数据强于预期，预计澳大利亚央行将在11月将现金利率上调至4.6%。此前预测会按兵不动。", "ctime": 1787728479, "time_str": "15:14:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260826/c679302267.shtml"}, {"id": "5031161", "title": "希腊数小时新增39场野火 海军基地暂无风险", "content": "希腊消防部门25日通报，该国各地数小时内新增39场野火，持续干旱带来的野火风险仍处于高位。据希腊广播和电视组织、德新社等媒体报道，此次灾情最严重的一场野火肆虐于萨拉米斯岛。该岛位于希腊首都雅典以西约20公里的萨罗尼克湾，岛上设有希腊最大的海军基地。参与灭火的消防员说，海军基地暂无火情风险。大火在萨拉米斯岛的一处峡谷地带蔓延。希腊当局派遣多架消防飞机与直升机，出动大批消防员以及志愿者赶赴现场灭火。（新华社）", "ctime": 1787728417, "time_str": "15:13:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260826/c679302247.shtml"}, {"id": "5031159", "title": "国家知识产权局关于做好《专利优先审查管理办法》有关实施工作的通知", "content": "新修订的《专利优先审查管理办法》将于2026年9月1日起正式实施，2017年发布的《专利优先审查管理办法》同时废止。为保障新旧规章平稳过渡、优先审查业务有序衔接，现将有关事项通知如下：2026年9月1日起提交的专利优先审查请求，按新《办法》相关规定办理；2026年9月1日前已经提交的，仍按照原《办法》规定办理。2026年9月1日起由复审或无效宣告案件的当事人提出的优先审查请求，相关业务均应通过国家知识产权局“专利业务办理系统”的“专利事务服务”模块线上办理。", "ctime": 1787728407, "time_str": "15:13:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260826/c679302228.shtml"}, {"id": "5031151", "title": "时代电服与昆发展新能源签署战略合作协议，计划共建100座巧克力换电站", "content": "宁德时代旗下时代电服科技有限公司近日与云南昆明发展新能源公司签署换电战略合作协议。双方计划共同建设100座巧克力换电站，并围绕全产业链合作展开深度探讨，携手探索新能源基础设施“国有资本持有+巧克力换电运营”共建新路径。（人民财讯）", "ctime": 1787728342, "time_str": "15:12:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260826/c679302192.shtml"}, {"id": "5031149", "title": "美国暂停处理移民签证申请", "content": "美国政府已暂停处理全球范围内的移民签证申请，同时向美国领事官员就处理签证申请提供培训。据英国《金融时报》报道，先前在美国使领馆预约好面试的移民签证申请者已收到电子邮件，被告知已重新安排预约时间，等待后续通知。美国国务院一名发言人表示，应确保签证申请者不太可能成为美国法律法规定义的公众负担，且不太可能依赖美国为有需要的合格美国人保留的公共福利。（新华社）", "ctime": 1787728333, "time_str": "15:12:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260826/c679302186.shtml"}, {"id": "5031137", "title": "多家公募与浦领基金销售有限公司终止合作；债券ETF规模创新高", "content": "多家基金公司集中公告，终止与浦领基金销售有限公司（以下简称浦领基金销售公司）的公募基金销售业务合作。据了解，此前浦领基金销售公司已多次公告，因战略调整将停止公募基金销售相关业务。数据显示，8月以来债券ETF合计净流入238.27亿元，总规模在8月首次突破9000亿元，本周一已创新高至9205.53亿元。（每日经济新闻）", "ctime": 1787728229, "time_str": "15:10:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260826/c679302150.shtml"}, {"id": "5031125", "title": "受台风影响 福建沿海57条航线停航 水工项目全部停工", "content": "今天，福建海上渔场出现8级以上大风。福建海事局维持防台风二级应急响应，根据台风动态调整防御部署，将泉州以北海域作为防御重点。为了确保海上交通安全，截至26日12时，泉州及以北沿海57条客渡运航线停航，福建全省118个水工项目全部停工。福建海事局进一步加强海上交通管理，于26日5时起暂停闽浙交界水域船舶南下，12时起暂停闽粤交界水域船舶北上。同时对台湾海峡航行船舶持续逐艘叫应，引导船舶加快离开台风影响区域。（央视新闻）", "ctime": 1787727986, "time_str": "15:06:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260826/c679302061.shtml"}, {"id": "5031093", "title": "算力用电爆发式增长 江苏常熟算力耗电超过空调", "content": "江苏常熟一家智算中心8月最大用电负荷较去年同期增长超70%，算力产业最高用电负荷已达20万千瓦，占全市用电负荷比重约4.1%。国网常熟市供电公司表示：“算力产业贡献全市近半数用电负荷增量，占比约49%，反映出算力负荷逐步取代季节性空调负荷，成为今夏用电增长的核心主力。”7月，江苏106家算力中心企业用电量突破13亿千瓦时，同比增长31%，其中超算和智算中心用电量占比超8成。根据预测，到2030年，我国数据中心用电量预计将激增至8000亿度。与此同时，我国光伏和风电装机也将增长到28亿千瓦以上。面对海量算力与绿电消纳的双重挑战，多地正通过算电协同，让算力跟着绿电走，实现降成本与促消纳的双赢。在内蒙古乌兰察布，全球单体最大的智算中心正在探索绿电直供的新模式，通过自建风电场和AI电力系统给智算中心供电，解决智算和绿电的波动性难题。 (央视财经)", "ctime": 1787727878, "time_str": "15:04:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260826/c679302006.shtml"}, {"id": "5031075", "title": "欧洲主要股指开盘多数上涨", "content": "欧洲主要股指开盘多数上涨，欧洲斯托克50指数涨0.21%，英国富时100指数涨0.18%，法国CAC40指数涨0.35%，德国DAX指数跌0.05%。", "ctime": 1787727830, "time_str": "15:03:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260826/c679301986.shtml"}, {"id": "5031069", "title": "习近平将出席2026年上海合作组织峰会并对吉尔吉斯斯坦、埃及进行国事访问", "content": "外交部发言人8月26日宣布：8月30日至9月3日，国家主席习近平将出席在比什凯克举行的2026年上海合作组织峰会，并应吉尔吉斯斯坦总统扎帕罗夫、埃及总统塞西邀请对两国进行国事访问。(新华社)", "ctime": 1787727815, "time_str": "15:03:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260826/c679301978.shtml"}, {"id": "5031059", "title": "ETF两市成交额报4256.08亿元，较昨日此时缩量232.51亿元", "content": "截至目前，ETF两市成交额报4256.08亿元，较昨日此时缩量232.51亿元，分类型来看，股票型ETF成交额1365.91亿元，债券型ETF成交额1882.47亿元，货币型ETF成交额229.92亿元，商品型ETF成交额115.45亿元，QDII型ETF成交额662.34亿元。", "ctime": 1787727797, "time_str": "15:03:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260826/c679301973.shtml"}, {"id": "5031035", "title": "A股收评：创业板指冲高回落涨0.51% 大金融方向表现强势", "content": "截至收盘，上证指数涨0.59%报3912.52点，深证成指涨0.69%报13841.33点，创业板指涨0.51%报3414.88点，北证50涨0.45%报1067.97点。三市成交额18218亿元，较上日缩量224亿元。已连续两日成交额不足2万亿元。全市场超2900只个股上涨。\n板块题材上，黄金概念、证券、造纸板块涨幅居前；医疗服务、电机板块跌幅居前。\n盘面上，黄金概念冲高震荡，深中华A5连板，迪阿股份、金诚信、白银有色、金一文化、江西铜业涨停，西部矿业、洛阳钼业、北方铜业、高能环境、云南铜业跟涨。证券板块表现强势，锦龙股份、湘财股份涨停，哈投股份、长江证券、招商证券、国元证券、西部证券跟涨。造纸板块盘初走强，青山纸业2连板，民士达、恒达新材、博汇纸业、荣晟环保、景兴纸业跟涨。医疗服务板块高开低走，诚达药业跌超5%，康龙化成、益诺思、博济医药、毕得医药跟跌。电机板块震荡走弱，华瑞股份跌超15%，江特电机、迪贝电气、兆威机电、晨光电机、奕帆传动跟跌。", "ctime": 1787727740, "time_str": "15:02:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260826/c679301952.shtml"}, {"id": "5030965", "title": "ETF收评：香港证券ETF领涨3.72%，能源化工ETF领跌4.92%", "content": "ETF收盘涨跌不一，香港证券ETF（513090）领涨3.72%，有色金属ETF（159157）涨3.11%，工业有色ETF（560970）涨3.10%，能源化工ETF（159981）领跌4.92%，标普油气ETF（159518）跌2.48%，标普油气ETF（513350）跌1.98%。", "ctime": 1787727654, "time_str": "15:00:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260826/c679301925.shtml"}, {"id": "5030941", "title": "股指期货午盘收盘 主力合约全线收涨", "content": "股指期货午盘收盘，主力合约全线收涨。沪深300股指期货(IF)主力合约涨0.98%，上证50股指期货(IH)主力合约涨1.14%，中证500股指期货(IC)主力合约涨0.92%，中证1000股指期货(IM)主力合约涨0.23%。", "ctime": 1787727621, "time_str": "15:00:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260826/c679301917.shtml"}, {"id": "5030937", "title": "期货收评：地缘风险降温重创能化品种！低硫燃油重挫超8% 对二甲苯、甲醇及乙二醇跌6%封跌停", "content": "期货收评：美伊就停火协议条款达成共识，地缘风险降温重创能化品种：低硫燃油盘中跌超9%，对二甲苯、甲醇及乙二醇跌6%封跌停，原油跌近6%。详情>>>", "ctime": 1787727548, "time_str": "14:59:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260826/c679301872.shtml"}, {"id": "5030873", "title": "DeepSeek前七月营收4.75亿元，推进5000亿元估值二轮融资", "content": "据知情人士透露，DeepSeek正全力推进第二轮融资，今年前七个月营收约4.75亿元人民币（7070万美元），约为其2025年全年营收的十倍。两位知情人士补充称，DeepSeek1 7月净亏损约7.15亿元，2025年全年净亏损为9.35亿元。公司正与现有及新投资者就本轮融资持续洽谈，计划以5000亿元人民币估值募资500亿元。（新浪财经）", "ctime": 1787727312, "time_str": "14:55:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260826/c679301794.shtml"}, {"id": "5030825", "title": "中科曙光：即将发布推理相关存储新技术", "content": "中科曙光相关人士透露，公司将发布面向大模型推理的新一代词元加速方案，重点处理推理过程中的重复计算和数据调度问题。目前，中科曙光ParaStor分布式存储已应用于国内首个全国产十万卡AI超集群曙光8000（登峰），为大规模计算任务提供数据吞吐和弹性扩展支持。赛迪顾问最新报告显示，中科曙光在AI、教育、具身智能和自动驾驶四个细分行业排名第一。（界面）", "ctime": 1787727081, "time_str": "14:51:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260826/c679301729.shtml"}, {"id": "5030821", "title": "俄远东天然气化工项目火灾已致7人死亡", "content": "位于俄罗斯远东阿穆尔州的阿穆尔天然气化工综合体项目26日在社交媒体上通报说，该项目25日发生的火灾已造成7人死亡、152人受伤，另有9人失联。中国驻哈巴罗夫斯克总领馆表示，暂时无法确认中国公民伤亡情况。（央视新闻）", "ctime": 1787727061, "time_str": "14:51:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260826/c679301725.shtml"}, {"id": "5030779", "title": "首趟适配NCD单证的西部陆海新通道跨境公路班车开行", "content": "8月25日，西部陆海新通道跨境公路班车顺利完成首票适配《联合国可转让货物单证公约》的单证（简称NCD单证）试运行。这趟跨境公路班车满载通机设备等货物，从重庆南彭保税物流中心出发，经友谊关口岸出境直达越南，全程约1400公里。本次试运行以《联合国可转让货物单证公约》为基础，标志着跨境公路运输单证向物权凭证功能实现关键跨越。以本次NCD单证成功试运行为契机，西部陆海新通道跨境公路将系统归集、深度研判全流程实操数据，持续完善跨境公路场景下NCD单证的签发流程、作业规范与风险防控体系，推动NCD单证由试运行走向常态化应用。（央视新闻）", "ctime": 1787726758, "time_str": "14:45:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260826/c679301564.shtml"}, {"id": "5030735", "title": "南向资金净买入超20亿港元", "content": "据同花顺iFinD数据，截至目前，南向资金净买入超20亿港元，其中港股通（沪）卖出超10.50亿港元，港股通（深）买入超30.88亿港元。", "ctime": 1787726630, "time_str": "14:43:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260826/c679301510.shtml"}, {"id": "5030727", "title": "广州出台机动车停放服务收费管理办法 推动停车收费降价改革", "content": "8月26日，《广州市机动车停放服务收费管理办法》正式发布，并将于9月1日起正式实施。《办法》通过对实行政府定价、政府指导价管理停车场优化计费时间单位、下调收费标准、降低封顶价格、缩减停车收费时段等多项举措，切实减轻群众停车支出。此外，结合当前经济社会发展和市民出行需求，《办法》鼓励实行政府指导价管理的社会公共（公益）性单位配套停车场经营者，为服务对象提供收费减免优惠。（人民财讯）", "ctime": 1787726486, "time_str": "14:41:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260826/c679301359.shtml"}, {"id": "5030725", "title": "古特雷斯谴责以色列非法进入联合国一培训中心", "content": "联合国秘书长古特雷斯25日通过发言人迪雅里克发表声明，强烈谴责以色列非法进入联合国近东巴勒斯坦难民救济和工程处（近东救济工程处）在东耶路撒冷的一处培训中心。声明说，古特雷斯以最强烈的言辞谴责以色列当局，包括其安全部队25日非法进入近东救济工程处在东耶路撒冷的卡兰迪亚培训中心，并进行未经许可的施工。以色列方面强行进入该培训中心时，有近东救济工程处工作人员在场。声明表示，卡兰迪亚培训中心以及其他近东救济工程处场所属于联合国机构，不容侵犯。以色列的行为完全无法接受，且有悖于国际法义务。古特雷斯敦促以色列政府立即停止对近东救济工程处场所的干涉，立即撤出并恢复原样，并确保近东救济工程处场所免受新的干涉和破坏。（新华社）", "ctime": 1787726460, "time_str": "14:41:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260826/c679301339.shtml"}, {"id": "5030723", "title": "上期所低硫燃油主力合约暴跌9%", "content": "上期所低硫燃油主力合约暴跌9%，报4638元/吨。", "ctime": 1787726460, "time_str": "14:41:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260826/c679301338.shtml"}, {"id": "5030711", "title": "郑商所甲醇主力合约触及跌停", "content": "郑商所甲醇主力合约触及跌停，报2769元/吨，现跌幅为6.01%。", "ctime": 1787726361, "time_str": "14:39:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260826/c679301313.shtml"}, {"id": "5030709", "title": "受台风“沙德尔”影响 浙江舟山72条水上客运航线全部停航", "content": "今年第18号台风“沙德尔”逐步向浙江沿海靠近，风力持续增强。浙江舟山海事局已于8月25日20时启动Ⅱ级防台应急响应，全面进入防御台风实战状态。自8月24日8时启动Ⅲ级防台应急响应以来，舟山六横、嵊泗、普陀山等重点海岛分区施策。六横沙岙码头利用停航前窗口期对客船开展安全巡检；嵊泗统筹离岛运力分批疏散旅客；普陀山动态优化班次，强化客流疏导与码头值守。截至26日14时，各海岛已累计疏散旅客近10万人次。舟山辖区72条水上客运航线已全部停航。（央视新闻）", "ctime": 1787726352, "time_str": "14:39:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260826/c679301312.shtml"}, {"id": "5030689", "title": "星海图在杭州成立人工智能科技新公司", "content": "企查查APP显示，近日，杭州星海图人工智能科技有限公司成立，经营范围包含：人工智能基础软件开发；人工智能应用软件开发；人工智能公共数据平台；人工智能理论与算法软件开发等。企查查股权穿透显示，该公司由星海图（北京）人工智能科技股份有限公司全资持股。（人民财讯）", "ctime": 1787726237, "time_str": "14:37:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260826/c679301286.shtml"}, {"id": "5030665", "title": "俄远东天然气化工项目火灾死亡人数升至7人", "content": "位于俄罗斯远东阿穆尔州的阿穆尔天然气化工综合体项目26日在社交媒体上通报说，该项目25日发生的火灾已造成7人死亡、152人受伤，另有9人失联。中国驻哈巴罗夫斯克总领馆表示，暂时无法确认中国公民伤亡情况。（新华社）", "ctime": 1787725991, "time_str": "14:33:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260826/c679301221.shtml"}, {"id": "5030663", "title": "特斯拉上海数据中心“人去楼空”，相关对接团队全部撤离？特斯拉中国回应：不实消息", "content": "日前，有网友爆料称，特斯拉专门为FSD（FullSelf-DrivingSupervised，监督版完全自动驾驶，以下简称FSD监督版）入华筹备的上海数据中心已“人去楼空”，相关对接团队全部撤离。8月26日，记者向特斯拉中国方面求证，一位内部人士回应称：“不实消息。”公开信息显示，特斯拉在中国的FSD数据合规及本土化准备仍在推进。特斯拉上海数据中心已实现境内数据全留存，位于上海临港的AI（人工智能）训练中心于2026年2月投入运营，并与百度地图合作使用合规高精地图。此前，特斯拉相关车型已通过四项汽车数据安全标准认证，为FSD进一步推进中国市场适配和数据合规奠定基础。（每日经济新闻）", "ctime": 1787725985, "time_str": "14:33:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260826/c679301219.shtml"}, {"id": "5030641", "title": "日韩股市集体收涨", "content": "日经225指数收涨0.62%，报66262.16点。韩国综指收涨0.97%，报6808.21点。", "ctime": 1787725900, "time_str": "14:31:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260826/c679301195.shtml"}, {"id": "5030627", "title": "第19号台风“紫檀”停止编号", "content": "今年第19号台风“紫檀”减弱后的热带低压已于今天（26日）下午在广东境内进一步减弱，目前已很难确定其环流中心，中央气象台于26日14时对其停止编号。（央视新闻）", "ctime": 1787725850, "time_str": "14:30:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260826/c679301179.shtml"}, {"id": "5030613", "title": "海南国资成立深蓝海洋科技公司", "content": "企查查APP显示，近日，海南国源深蓝海洋科技有限责任公司成立，经营范围包含：海洋气象服务；海洋工程装备制造；海洋工程 9", "title": "工信部回应新能源汽车“内卷”：要坚守住产品质量底线", "content": "工信部副部长辛国斌26日在国务院新闻办发布会上表示，非理性竞争的问题仍然较为突出，一些“激进式”创新设计未经充分实验验证就装车应用，还出现了个别引发社会关注的汽车产品质量、自动驾驶安全等事件。为此，工信部研究制定了《智能网联新能源汽车产业发展“十五五”规划》，通过规划引导、部门协同、政策支持等多措并举，推动产业持续高质量发展。辛国斌表示，完善行业治理体系。推进汽车企业生产资质集团化管理改革，优化产业布局。加强产品创新设计准入审查和测试验证管理，严禁未经充分测试验证的产品进入市场。加大产品生产一致性监督检查力度，切实维护好消费者的合法权益，进一步规范好产业竞争秩序。（证券时报）", "ctime": 1787724940, "time_str": "14:15:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260826/c679300921.shtml"}, {"id": "5030527", "title": "俄官员证实美国中情局局长访问俄罗斯", "content": "据俄新社26日报道，俄罗斯总统新闻秘书佩斯科夫证实，美国中央情报局局长拉特克利夫访问俄罗斯。 据报道，佩斯科夫在接受采访时说，拉特克利夫访问俄罗斯与俄美两国情报机构之间的接触有关。 多家美国媒体25日报道说，一架美国空军运输机从拉脱维亚首都里加起飞，抵达莫斯科伏努科沃机场。美国哥伦比亚广播公司25日援引消息人士的话报道说，拉特克利夫正在莫斯科参加会谈。(新华社)", "ctime": 1787724893, "time_str": "14:14:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260826/c679300903.shtml"}, {"id": "5030479", "title": "巴拿马因厄尔尼诺宣布进入紧急状态", "content": "巴拿马政府25日宣布，因厄尔尼诺现象带来的气候影响，全国进入紧急状态，以应对干旱、洪水等灾害风险及其对巴拿马运河航运、农业和能源供应等造成的潜在影响。巴拿马政府说，此次宣布进入紧急状态旨在提高政府机构应对极端天气的能力。巴拿马政府当天发布公告说，根据巴拿马气象和水文研究所预测，厄尔尼诺现象将在今年10月至明年3月期间进一步增强，该国部分地区可能出现降雨不足，其影响预计持续至明年5月。高温和降雨减少可能对水资源、农业生产等造成影响。公告说，干旱可能导致河流、湖泊和水库水位下降，并可能影响巴拿马运河船舶通行以及运河运营所需的水资源供应。此外，水力发电也可能受到影响。（新华社）", "ctime": 1787724692, "time_str": "14:11:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260826/c679300864.shtml"}, {"id": "5030443", "title": "俄罗斯：北约在乌克兰部署军队“不可接受”", "content": "俄罗斯总统新闻秘书佩斯科夫25日说，俄罗斯已多次声明，北约国家在乌克兰领土部署军队对俄罗斯而言“不可接受”。(新华社)", "ctime": 1787724425, "time_str": "14:07:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260826/c679300779.shtml"}, {"id": "5030333", "title": "沪深京三市成交额超1.5万亿元，较上日此时缩量281亿元", "content": "据同花顺iFinD数据，沪深京三市成交额超1.5万亿元，较上日此时缩量281亿元，预计全天成交金额约1.8万亿元。截至目 // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
