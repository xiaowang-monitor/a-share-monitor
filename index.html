ode": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260708/c678040183.shtml"}, {"id": "4676613", "title": "德美化工：预计2026年上半年净利润同比增长98.26%～108.70%", "content": "德美化工公告，预计2026年1月1日至2026年6月30日归属于上市公司股东的净利润为9500万元～1亿元，比上年同期增长98.26%～108.70%；扣除非经常性损益后的净利润为8835万元～9335万元，比上年同期增长117.66%～129.98%。2026年上半年，石油化学品受国际形势等因素影响导致产品价差扩大，带动盈利能力改善。", "ctime": 1783501289, "time_str": "17:01:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260708/c678040175.shtml"}, {"id": "4676571", "title": "第二十六届中国国际投资贸易洽谈会香港推介会举行", "content": "第二十六届中国国际投资贸易洽谈会香港推介会8日在湾仔举行，吸引超过200名嘉宾出席。 本次推介会旨在立足国家高水平对外开放大局，充分释放香港“超级枢纽”的独特优势，全方位展示第二十六届投洽会扩容升级的全新机遇。活动既为香港资本拓展内地产业合作空间，也为内地企业搭建链接全球资源的便捷通道。 商务部投资促进事务局副局长于广生致辞表示，即将举办的第二十六届投洽会，商务部将突出专业化、国际化和数智化发展方向。作为承办单位之一，商务部投资促进局正与福建省政府、厦门市政府密切配合，从系统设计入手，以“投资中国”“中国投资”“国际投资”三大板块为基础，增容扩能、优化结构，力争推动本届投洽会办出新特色、取得新实效。 香港特区政府投资推广署助理署长李淑菁致辞表示，在“一国两制”下，香港始终发挥背靠祖国、联通世界的独特制度优势。香港是国家唯一的普通法司法管辖区，营商环境高度开放且国际化，加之税制优越，资金、人才、货物、资讯自由流通，知识产权保护制度健全，是企业营商和拓展海外市场的理想平台，也是海外企业进入内地市场的重要门户。香港作为内地企业首选的“出海母港”，已准备就绪为各方提供导航服务，鼓励各界善用香港平台扬帆出海。 在专题对话环节，与会嘉宾围绕双向投资核心议题，就平台建设与出海战略、金融赋能、实业桥梁与新质生产力等话题展开深入交流，分享发展机遇，共商合作路径。(新华社)", "ctime": 1783501185, "time_str": "16:59:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260708/c678040093.shtml"}, {"id": "4676541", "title": "中金公司：预计2026年上半年净利润同比增加78%到90%", "content": "中金公司公告，预计2026年半年度实现归属于母公司股东的净利润为人民币77.08亿元到人民币82.27亿元，与上年同期相比，将增加人民币33.78亿元到人民币38.97亿元，同比增加78%到90%。扣除非经常性损益事项后，预计2026年半年度实现归属于母公司股东的净利润为人民币75.52亿元到人民币80.62亿元，与上年同期相比，将增加人民币33.09亿元到人民币38.19亿元，同比增加78%到90%。", "ctime": 1783500992, "time_str": "16:56:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260708/c678040020.shtml"}, {"id": "4676539", "title": "COMEX白银期货跌超4%", "content": "COMEX白银期货跌超4%，现报58.8美元/盎司。", "ctime": 1783500989, "time_str": "16:56:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260708/c678040018.shtml"}, {"id": "4676535", "title": "现货黄金失守4060美元/盎司 纽约期金失守4070美元/盎司", "content": "现货黄金失守4060美元/盎司，日内跌1.11%。纽约期金失守4070美元/盎司，日内跌2.21%。", "ctime": 1783500977, "time_str": "16:56:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260708/c678040009.shtml"}, {"id": "4676533", "title": "伊朗军方：任何为美军事行动提供支持的来源都将是合法打击目标", "content": "当地时间8日，伊朗武装部队哈塔姆·安比亚中央司令部发表声明称，任何为美军对伊朗伊斯兰共和国主权和领土发动军事行动提供支持的来源，都将成为伊朗武装部队的合法打击目标。（央视新闻）", "ctime": 1783500973, "time_str": "16:56:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260708/c678040008.shtml"}, {"id": "4676525", "title": "长春高新：子公司GenSci148注射液临床试验申请获受理", "content": "长春高新公告，子公司长春金赛药业有限责任公司收到国家药品监督管理局核准签发的《受理通知书》，GenSci148注射液的境内生产药品注册临床试验申请获得受理。GenSci148注射液是金赛药业自主研发的一款VEGF多重阻断剂，拟用于治疗新生血管性年龄相关性黄斑变性（nAMD）、糖尿病性黄斑水肿（DME）和视网膜静脉阻塞（RVO）。", "ctime": 1783500949, "time_str": "16:55:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260708/c678039994.shtml"}, {"id": "4676523", "title": "亚翔集成：预计2026年上半年净利润同比增长183.41%至226.29%", "content": "亚翔集成公告，预计2026年1月1日至2026年6月30日归属于上市公司股东的净利润为4.56亿元至5.25亿元，比上年同期增加2.95亿元至3.64亿元，同比增长183.41%至226.29%。预计公司2026年半年度实现归属于上市公司股东的扣除非经常性损益的净利润为4.56亿元至5.24亿元，比上年同期增加2.96亿元至3.64亿元，同比增长184.40%至226.82%。", "ctime": 1783500941, "time_str": "16:55:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260708/c678039980.shtml"}, {"id": "4676519", "title": "报告：中国城市新质人才竞争力指数，京深沪稳居三甲", "content": "7月8日，北京大学城市软实力研究院联合智联招聘发布《2025中国城市新质人才竞争力指数报告》，报告显示，京深沪稳居三甲，构成新质人才发展的第一梯队；新一线城市对新质人才的招聘需求占比达36.83%，位列所有城市等级首位，成为吸纳新质人才的核心增量。16-34岁青年新质人才的就业偏好正从一线城市向成都、杭州、苏州、南京等新一线及具备特色产业的城市延伸，北上广深的人才吸引增速有所放缓。（界面新闻）", "ctime": 1783500923, "time_str": "16:55:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260708/c678039916.shtml"}, {"id": "4676513", "title": "红日药业：终止抗丙肝一类化药新药项目研发", "content": "红日药业公告，公司于2026年7月8日召开董事会，决定终止抗丙肝一类化药新药项目研发。该项目处于IND申报前的研究阶段，因化合物开发风险大及当前治疗方案已更新，继续研发无临床意义。终止后，公司将聚焦优势项目，优化研发管线，不会对正常经营及财务状况产生重大影响。", "ctime": 1783500840, "time_str": "16:54:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260708/c678039865.shtml"}, {"id": "4676509", "title": "福晶科技：董事长陈辉因达法定退休年龄辞职", "content": "福晶科技公告，董事长陈辉先生因达到法定退休年龄，申请辞去公司第七届董事会董事长、董事、战略委员会相关职务及公司下属参控股公司董事职务。陈辉先生持有公司股份261.16万股。公司第七届董事会第十次会议选举张戈先生为新任董事长，任期至第七届董事会任期届满。同时，经控股股东推荐，董事会同意提名林恒丰先生为第七届董事会董事候选人。", "ctime": 1783500757, "time_str": "16:52:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260708/c678039816.shtml"}, {"id": "4676507", "title": "傅道鹏出任新开发银行副行长", "content": "7月8日，新开发银行宣布傅道鹏担任新开发银行副行长兼首席财务官，主管新开发银行的融资及资金管理、财务、预算、会计等业务。傅道鹏曾任中国财政部湖北监管局局长，拥有近30年公共部门从业经验，在财政政策、国际财政治理领域积累了扎实全面的专业基础，熟悉联合国预算、财务、会计框架及相关规章制度。新开发银行成立于2015年，是金砖国家财金合作的重要成果，其宗旨是支持新兴市场和发展中国家基础设施建设和可持续发展，总部设在中国上海。中国作为新开发银行创始成员国、重要股东国、借款国和东道国，与新开发银行一直保持着良好合作关系。(财政部)", "ctime": 1783500751, "time_str": "16:52:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260708/c678039814.shtml"}, {"id": "4676505", "title": "天邦食品：6月份销售商品猪67.41万头，销售收入4.91亿元", "content": "天邦食品公告，公司2026年6月份销售商品猪67.41万头（其中仔猪销售25.39万头），销售收入4.91亿元，销售均价9.62元/公斤（商品肥猪均价为9.17元/公斤），环比变动分别为-8.56%、-14.97%、-5.48%。", "ctime": 1783500724, "time_str": "16:52:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260708/c678039804.shtml"}, {"id": "4676503", "title": "韩国立法整治网络虚假信息", "content": "为整治泛滥的网络虚假信息乱象，韩国《信息通信网络法》修订法7月7日正式生效。修订法规定，故意散播虚假信息和篡改网络信息的用户，需承担最高5倍实际损失的赔偿责任；多次违规且相关内容被法院认定为违法的用户，最高面临10亿韩元（约合450万元人民币）的罚款。修订法还强制要求韩国本土互联网平台以及美国谷歌公司等海外平台开通虚假信息专项举报渠道，定期发布透明度报告。（央视新闻）", "ctime": 1783500673, "time_str": "16:51:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260708/c678039755.shtml"}, {"id": "4676501", "title": "中兴全球首款AI智能体手机将亮相2026WAIC", "content": "从知情人士处获悉，来自中兴努比亚的全球首款AI智能体手机，或将在2026世界人工智能大会（WAIC）正式亮相。小鲸注：此前，蓝鲸科技记者曾独家报道，这款新一代AI手机将于7—8月正式面世。（蓝鲸新闻）", "ctime": 1783500664, "time_str": "16:51:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260708/c678039745.shtml"}, {"id": "4676483", "title": "海正药业与泰格医药达成战略合作", "content": "7月7日，海正药业与泰格医药战略合作框架协议签约仪式举行。双方将围绕创新药BD与联合投资、临床研究、数字化临床服务、人才培养开展协同合作，依托各自优势互补联动，提升创新业务竞争力，助力医药产业协同发展。（人民财讯）", "ctime": 1783500503, "time_str": "16:48:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260708/c678039565.shtml"}, {"id": "4676481", "title": "杭电股份：公司近期日常生产经营情况正常，内部及外部经营环境未发生重大变化", "content": "杭电股份股票交易异常波动公告，经公司自查，公司近期日常生产经营情况正常，内部及外部经营环境未发生重大变化，也不存在预计将要发生重大变化的情形。", "ctime": 1783500464, "time_str": "16:47:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260708/c678039503.shtml"}, {"id": "4676471", "title": "正邦科技：2026年6月销售生猪收入6.25亿元，环比下降14.62%，同比下降19.37%", "content": "正邦科技公告，公司2026年6月销售生猪95.27万头，环比下降1.15%，同比上升39.99%；销售收入6.25亿元，环比下降14.62%，同比下降19.37%。商品猪（扣除仔猪后）销售均价9.68元/公斤，较上月下降3.31%。2026年1-6月，公司累计销售生猪558.21万头，同比上升56.07%；累计销售收入40.94亿元，同比上升0.42%。", "ctime": 1783500410, "time_str": "16:46:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/2 // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
