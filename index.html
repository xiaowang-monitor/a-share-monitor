<style>
:root {
  --bg-primary: #0a0e17;
  --bg-card: #111827;
  --bg-card-hover: #1a2332;
  --border: #1e293b;
  --text-primary: #e2e8f0;

  --red: #ef4444;
  --red-bg: rgba(239,68,68,0.1);

  --green-bg: rgba(34,197,94,0.1);
  --gold: #f59e0b;
  --blue: #3b82f6;
  --purple: #8b5cf6;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Noto Sans SC', sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  min-height: 100vh;
}
.mono { font-family: 'JetBrains Mono', monospace; }
.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 20px;
  transition: all 0.2s;
}
.card:hover { background: var(--bg-card-hover); border-color: #334155; }
.badge {
  display: inline-flex; align-items: center; padding: 2px 8px;
  border-radius: 6px; font-size: 12px; font-weight: 500;
}
.badge-s { background: rgba(239,68,68,0.2); color: #ef4444; }
.badge-a { background: rgba(245,158,11,0.2); color: #f59e0b; }
.badge-b { background: rgba(59,130,246,0.2); color: #3b82f6; }
.badge-c { background: rgba(100,116,139,0.2); color: #94a3b8; }
.score-bar {
  height: 6px; border-radius: 3px; background: #1e293b; overflow: hidden;
}
.score-bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s; }
.up { color: var(--red); }
.down { color: var(--green); }
.pulse { animation: pulse 2s infinite; }
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}
.glow { box-shadow: 0 0 20px rgba(59,130,246,0.15); }
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg-primary); }
::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
</style>

              <th class="text-right py-2 px-1">现价</th>

              <th class="py-2 px-1 text-center" style="min-width:160px">评分分布</th>
              <th class="text-right py-2 px-1">板块</th>
              <th class="text-right py-2 px-1">连涨</th>
            </tr>
          </thead>
          <tbody id="picks-table"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- 新闻流 + 交易代理 -->
<div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
  <div class="card">
    <h2 class="text-sm font-medium text-gray-400 mb-4">实时新闻流</h2>

  <div class="card">
    <h2 class="text-sm font-medium text-gray-400 mb-4">交易代理状态</h2>

</div>

信息服务；机动车充电销售；人工智能应用软件开发等。企查查股权穿透显示，该公司由信息发展全资持股。（人民财讯）", "ctime": 1788327839, "time_str": "13:43:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260902/c679523500.shtml"}, {"id": "5088327", "title": "Omdia：二季度拉美地区智能手机市场出货量同比下降12%", "content": "Omdia最新数据显示，2026年第二季度，拉美地区智能手机市场同比下降12%，出货量降至3030万部。DRAM和NAND成本上涨逐步传导至零售价格，对入门级设备的需求影响最为明显。厂商和渠道商此前通过提前备货和库存缓冲，在第一季度部分抵消了成本上涨的影响。但进入第二季度，这些缓冲作用有所减弱，市场低端需求面临更大压力，而中端、高端和高端旗舰市场表现则相对更具韧性。（人民财讯）", "ctime": 1788327712, "time_str": "13:41:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260902/c679523482.shtml"}, {"id": "5088323", "title": "上海防汛指挥部启动中心城区防汛防台四级响应行动", "content": "预计今天半夜以前，上海市中心城区大部将出现一小时雨量30-50毫米的短时强降水天气。上海市气象台2026年9月2日12时25分发布中心城区暴雨蓝色预警信号。上海市防汛指挥部决定同步启动中心城区防汛防台Ⅳ级响应行动。（央视新闻）", "ctime": 1788327544, "time_str": "13:39:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260902/c679523451.shtml"}, {"id": "5088303", "title": "局地有特大暴雨 福建提升防汛应急响应为二级", "content": "记者从福建省防汛抗旱指挥部了解到，今天，福建省沿海和南部地区有暴雨，其中漳州、厦门、泉州和宁德四市大部、龙岩多地有大暴雨，局部特大暴雨，其余地区局部暴雨。24小时累计雨量80~180毫米，局部300毫米，最大小时雨量120毫米。今年第18号台风“沙德尔”今天10时中心距离广东省汕尾市东偏南方向约200公里，中心附近最大风力8级（热带风暴级），将以每小时10公里左右的速度向东偏北方向移动。福建省防指于9月2日11时提升防汛应急响应为二级，并维持防台风四级应急响应。各地各部门密切关注降雨发展趋势，滚动研判暴雨及次生灾害风险，周密部署防范措施，组织转移避险，扎实做好应对工作。（央视新闻）", "ctime": 1788327315, "time_str": "13:35:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260902/c679523369.shtml"}, {"id": "5088259", "title": "星宇股份董事长回应“解约应届生”：公司深刻反省并道歉", "content": "9月2日，星宇股份召开网络业绩说明会，星宇股份董事长兼总经理周晓萍公开表示，公司对披露真实情况的媒体监督表示衷心感谢，公司深刻反省并真诚道歉。同时，公司对部分媒体的不实报道也已通过网信和网安部门进行投诉和举报，维护公司的合法权益。周晓萍表示，公司依据法律法规和规范性文件等制定各项用工制度和流程，并在本次事件发生后重新审视及整改，将以制度和流程切实保障劳动者合法权益。她表示，公司再次向社会和广大投资者真诚道歉，公司将严守合规运营底线，构建和谐劳动关系，积极承担更多社会责任，努力以更好的业绩回馈投资者。周晓萍表示，关于公司订单“断崖式下跌”的传闻不实，当前公司量产和开发中的项目充足，生产经营正常。(新京报)", "ctime": 1788326921, "time_str": "13:28:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260902/c679523304.shtml"}, {"id": "5088221", "title": "南向资金净买入超30亿港元", "content": "据同花顺iFinD数据，截至目前，南向资金净买入超30亿港元，其中港股通（沪）买入超40.87亿港元，港股通（深）卖出超10.77亿港元。", "ctime": 1788326608, "time_str": "13:23:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260902/c679523270.shtml"}, {"id": "5088193", "title": "两艘悬挂土耳其国旗的商船相撞 10人失联", "content": "据土耳其伊斯坦布尔省长办公室2日消息，两艘悬挂土耳其国旗的商船在土耳其马尔马拉海相撞，10名船员失联。（新华社）", "ctime": 1788326394, "time_str": "13:19:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260902/c679523219.shtml"}, {"id": "5088107", "title": "光大期货：美伊相互打击，原油大涨黄金回调", "content": "美伊冲突再次升级，隔夜伦敦现货贵金属大幅走弱。海外货币政策偏鹰，9 月加息预期再度升温，叠加原油大涨推升通胀担忧。短期黄金承压步入回调。\n宏观方面，美国8月制造业ISM指数降至54.6，低于预期的55.2，但仍为2022年来次高，其中新订单指数回落至53.7，为3月份以来最弱；工厂就业人数连续第二个月增加；价格指数维持71.1不变。美国7月JOLTS职位空缺727万，低于预期的731万，但制造业职位空缺升至2023年12月以来最高，7月裁员人数降至今年1月以来最低。地缘政治方面，美军开始打击伊朗境内目标，特朗普称若伊朗报复将遭更猛烈打击，伊能源枢纽港遭袭，伊开始反击。沃什偏鹰，美伊局势升级，油价再度高企下，美联储重启加息或成为9月绕不开的话题，受此影响黄金或表现持续偏谨慎。但加息抑通胀与美长期国债利率抬升矛盾难解决，黄金作为终极信用对冲工具，或再次受市场青睐，注意节奏。黄金短期波动加大甚至继续回调，但中期上行趋势难改，持续关注风险事件利空的释放进度。（光大期货）", "ctime": 1788325928, "time_str": "13:12:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260902/c679523173.shtml"}, {"id": "5088083", "title": "发运673列！前8个月“天山号”班列跑出亚欧联通加速度", "content": "今年前8个月，新疆自主品牌中欧（中亚）班列——“天山号”班列交出一份亮眼成绩单：累计发运673列，带动进出口贸易额117.09亿元，同比增长9.66%。日均发运2列以上，高峰时一天跑出3列，这条从2023年12月才首发的年轻班列，正以“加速度”穿梭在亚欧大陆上。目前，新疆以乌鲁木齐国际陆港区为主枢纽，已建成6条成熟的亚欧运输通道，一张贯通中亚、辐射欧洲的跨境物流网正越织越密。钢铁驼队不停歇，向西开放的“新疆速度”还在提挡加速。（央视新闻）", "ctime": 1788325873, "time_str": "13:11:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260902/c679523168.shtml"}, {"id": "5087975", "title": "韩国综指跌幅扩大至4%", "content": "韩国综指跌幅扩大至4%，现报6560.35点。个股方面，SK海力士、三星电子跌超4%。", "ctime": 1788325466, "time_str": "13:04:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260902/c679523113.shtml"}, {"id": "5087913", "title": "我国在高端遥感动态成像关键技术领域取得重要突破", "content": "记者今天从市场监管总局了解到，我国在高端遥感动态成像关键技术领域取得重要突破。针对无人机、卫星、机器人等领域亟待解决的轻量化、低功耗、高动态成像性能相互制约的矛盾，依托中国计量大学建立的市场监管总局重点实验室（光传感与图像计量）联合北京航空航天大学等单位组织开展技术攻关，实现了小型低功耗约束下厘米级超高分辨率三维成像，解决了低空经济和智能视觉等产业对场景信息的精准捕捉与解析问题。据介绍，研究团队突破了“小型化低功耗超高分辨率成像、高精度传递函数动态像差补偿、强噪声环境三维高精度重建”等关键核心技术，相关成果具有自主知识产权，总体技术达到国际先进水平，其中部分技术处于国际领先水平。目前，相关技术成果已应用于无人机、航空航天、森林防火、安防、边海防、工业机器人、特种设备监测、智慧城市等领域，经济与社会效益显著。（央视新闻）", "ctime": 1788325217, "time_str": "13:00:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260902/c679523077.shtml"}, {"id": "5087885", "title": "1—8月全国二手房交易网签面积54923万平方米，同比增长10.6％", "content": "1—8月份，全国二手房交易网签面积54923万平方米，同比增长10.6％。", "ctime": 1788324875, "time_str": "12:54:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260902/c679523034.shtml"}, {"id": "5087871", "title": "刘锐接任招商证券资管董事长 张良勇离任", "content": "招商证券资管董事长发生变更。公告显示，刘锐为新任董事长，任职日期为2026年9月1日。履历显示，刘锐现任招商证券副总裁、招商致远资本董事，此前曾任招商证券总裁助理等职务。与此同时，张良勇因工作调动离任招商证券资管董事长，离任日期同为2026年9月1日。", "ctime": 1788324230, "time_str": "12:43:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260902/c679522960.shtml"}, {"id": "5087851", "title": "伊朗称将继续打击美军基地 警告与美合作国家承担后果", "content": "当地时间9月2日凌晨，伊朗哈塔姆安比亚中央司令部发言人发表声明称，美军近期对伊朗南部多处军事和非军事目标实施空袭，造成平民伤亡。作为回应，伊朗武装力量使用导弹和无人机对地区内美军基地发动袭击。相关袭击对美军基础设施、武器和装备造成严重损失，并造成相当数量的美军指挥官和士兵死伤。声明表示，针对美军的军事行动将继续，直至美方“为其行动感到后悔”。声明同时警告，如果美方继续在地区采取军事行动，将面临“更沉重、更广泛、更具破坏性”的回应，任何与美军合作的国家都必须承担由此产生的“危险后果”。（央视新闻）", "ctime": 1788323580, "time_str": "12:33:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260902/c679522879.shtml"}, {"id": "5087835", "title": "日本2年期国债收益率上升5个基点至1.85%", "content": "日本2年期国债收益率上升5个基点至1.85%；日本5年期国债收益率上升5个基点至2.305%。", "ctime": 1788323243, "time_str": "12:27:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260902/c679522823.shtml"}, {"id": "5087817", "title": "本田计划到2030年削减超1.5万亿日元成本", "content": "据报道，本田计划到2030年削减超过1.5万亿日元（约合94亿美元）的成本，并已要求供应商降低价格。", "ctime": 1788322828, "time_str": "12:20:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260902/c679522765.shtml"}, {"id": "5087815", "title": "杰富瑞将甲骨文目标价从320美元下调至290美元", "content": "杰富瑞将甲骨文目标价从320美元下调至290美元。", "ctime": 1788322493, "time_str": "12:14:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260902/c679522565.shtml"}, {"id": "5087811", "title": "日韩股市跌幅扩大，日经225指数跌幅扩大至3%", "content": "日韩股市跌幅扩大，日经225指数跌幅扩大至3%，现报64225.19点。韩国综合指数现跌近4%。", "ctime": 1788322421, "time_str": "12:13:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260902/c679522559.shtml"}, {"id": "5087791", "title": "欧洲央行管委马赫鲁夫：欧洲央行必须做好进一步加息的准备", "content": "欧洲央行管委马赫鲁夫表示，欧洲央行必须做好进一步加息的准备。", "ctime": 1788321976, "time_str": "12:06:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260902/c679522512.shtml"}, {"id": "5087767", "title": "9月2日午间公告一览：安泰科技10亿元债务融资工具获准注册", "content": "安泰科技公告，公司此前审议通过拟以PDFI方式统一注册10亿元债务融资工具，首次发行4亿元三年期中期票据（科技创新债券）。公司于2026年9月1日收到交易商协会《接受注册通知书》，注册额度自2026年8月31日起2年内有效，公司将在注册有效期内择机发行。", "ctime": 1788321731, "time_str": "12:02:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260902/c679522469.shtml"}, {"id": "5087765", "title": "港股午评：恒生指数跌0.96%，恒生科技指数跌1.54%", "content": "港股午间收盘，恒生指数跌0.96%，恒生科技指数跌1.54%。恒指港股通ETF银华（159318）跌1.07%，港股通科技ETF鹏华（159751）跌1.37%。板块方面，电脑与电子产品零售、安全和报警服务板块涨幅靠前；能源金属、广告营销板块跌幅靠前。个股方面，新意网集团涨16.26%，百奥赛图-B涨11.69%，亮晴控股涨10.57%，瀚天天成涨10.56%，博泰车联涨8.99%；万国黄金集团跌9.91%，MOMENTA-W跌8.7%，金蝶国际跌8.31%，深演智能跌8.09%，科拓股份跌7.34%。", "ctime": 1788321671, "time_str": "12:01:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260902/c679522458.shtml"}, {"id": "5087761", "title": "救援持续推进中 消防力量携带专业设备开展精细化排查", "content": "9月2日，消防救援队伍持续开展不间断拉网式搜寻工作，摸排失联人员、排查灾害隐患、推进抢险救援各项任务。当前，G216线损毁路段抢修工作持续推进，消防救援人员持续向灾区纵深挺进。针对吉隆口岸核心受灾区、河谷滩涂、沟壑死角、道路损毁路段等关键区域，救援人员分组轮番作业，携带生命探测仪等专业设备，搭配搜救犬深入人力可及的每一处盲区，开展精细化排查。一线消防救援队伍将根据现场灾情动态调整搜寻方案、优化力量部署，推进后续抢险救援、灾情处置、善后保障等各项工作。（央视新闻）", "ctime": 1788321551, "time_str": "11:59:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260902/c679522424.shtml"}, {"id": "5087759", "title": "福建福鼎遭遇强降雨全市停课，当地居民：部分区域积水漫过一楼", "content": "9月2日，福建省宁德市福鼎市遭遇强降雨天气，当地发布暴雨红色预警。家住福鼎市点头镇的一名居民称大雨下了一夜，目前部分区域积水漫过一楼。据福建经济生活频道，受“沙德尔”影响，9月2日06时福鼎市气象台继续发布“暴雨预警I级”，福鼎市防指于9月2日6时，提升防汛应急响应至Ⅰ级，福鼎全市停课。（澎湃新闻）", "ctime": 1788321474, "time_str": "11:57:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260902/c679522413.shtml"}, {"id": "5087757", "title": "MSCI亚太指数下跌2%至273.46点", "content": "MSCI亚太指数下跌2%至273.46点。", "ctime": 1788321353, "time_str": "11:55:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260902/c679522393.shtml"}, {"id": "5087745", "title": "中央网信办：清理违法违规信息561万余条", "content": "据网信中国消息，近期，中央网信办组织开展“清朗·整治AI应用乱象”专项行动第二阶段工作，聚焦利用AI制作发布虚假信息、传播暴力低俗内容、假冒仿冒他人、侵害未成年人权益等突出问题，部署各地网信部门深入推进重点整治任务，督促网站平台集中清理AI生成各类违法不良信息，依法查处违规账号和移动应用程序，有效遏制AI生成合成信息内容乱象，推动AI应用服务健康有序发展。截至目前，累计清理违法违规信息561万余条，查处账号4.9万余个，处置违规网站、应用程序等2400余个。", "ctime": 1788321013, "time_str": "11:50:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260902/c679522336.shtml"}, {"id": "5087743", "title": "国家医保局：特例单议保障医疗机构收治疑难重症的积极性与合理性", "content": "国家医保局召开新闻发布会，发布按病种付费3.0版分组方案和技术规范。特例单议是按病种付费的重要配套机制，重点支持医疗机构使用新药耗新技术、收治疑难复杂重症，由医疗机构自主向医保经办机构申报，经专家审核评议后，符合条件的可给予合理补偿。3.0版分组的通知从制度层面进一步明确各地要推行按季度或按月开展特例单议评审，切实保障医疗机构收治疑难重症的积极性与合理性。（央视新闻）", "ctime": 1788320964, "time_str": "11:49:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260902/c679522330.shtml"}, {"id": "5087741", "title": "防范挤压夹伤风险，家用儿童学习桌椅国家标准发布", "content": "记者今天了解到，市场监管总局近日批准发布《家用儿童学习桌、椅》国家标准，针对家用儿童学习桌椅产品建立专项安全与性能指标体系。标准明确适用于3岁至14岁儿童阅读、书写、绘画的家用学习桌椅，充分兼顾当前市场产品在升降、角度调节、带电功能等方面的创新设计，系统规定产品技术要求与对应试验方法，为产品生产制造、质量检测、消费选购提供技术支撑。筑牢升降功能安全防护，防范挤压夹伤风险。标准确立电动升降遇阻回退安全保护机制，一键升降桌面受到外力阻碍时，必须在5秒内将挤压力下降至安全阈值，有效防止儿童发生挤压、夹伤事故；松开操作按键后，桌面位移不得超过10毫米，保障升降操作即时响应、可控可停。同时标准明确禁止使用声控、远程控制实现升降调节，从产品设计源头消除儿童误操作引发的机械安全风险。（央视新闻）", "ctime": 1788320835, "time_str": "11:47:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260902/c679522280.shtml"}, {"id": "5087725", "title": "现货黄金跌超1%", "content": "现货黄金跌超1%，现报4284.5美元/盎司。", "ctime": 1788320466, "time_str": "11:41:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260902/c679522221.shtml"}, {"id": "5087719", "title": "OpenAI即将发布新AI模型Astra", "content": "据报道，OpenAI计划很快推出一款名为Astra的AI模型。该模型前期执行高级网络安全相关任务的能力将仅限于部分测试人员。之后，该公司将通过“Daybreak Blue”计划向更多用户开放该模型，用于防御性网络安全工作。OpenAI周二表示，他们认为该模型已达到“关键网络安全门槛” // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;

  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>

}

    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
