_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260526/c676974274.shtml"}, {"id": "4406951", "title": "整治“幽灵外卖” 上海推出全国首个网络餐饮电子证照核验应用", "content": "5月26日，上海推出全国首个网络餐饮电子证照核验应用，构筑从商户申请到平台亮证的“申请-比对-授权-亮证”全套数字化管理闭环，旨在对“幽灵外卖”实现源头治理。经市场监管总局同意，上海市市场监管局依托电子营业执照系统，在全国首创试点，通过打通监管部门、平台与商户间的数据壁垒，构建起“真人、真证、真店”的可信核验机制。相较于以往政府单向供数、平台人工比对、问题事后处置的传统管理模式，此次改革通过构建政企数据交互、双向比对、协同共治的机制，将平台从被动的“接单审核者”转变为主动的“共治责任人”。（央视新闻）", "ctime": 1779777806, "time_str": "14:43:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260526/c676974220.shtml"}, {"id": "4406947", "title": "比亚迪与惠丰钻石持续深化金刚石导热应用合作", "content": "近日，比亚迪公司一行到访惠丰钻石考察交流，就深化2020年成立的联合实验室及金刚石导热材料的研发与产业化应用达成深度合作意向。双方将依托联合实验室，重点开展金刚石导热应用研究、高可靠性封装工艺开发、新型电子材料升级等合作。双方在会谈中深入交流，合作项目有望年内完成中试线建设，实现量产配套。未来双方还将继续探索更多的新材料延伸应用场景，构建更多的跨界创新生态。（人民财讯）", "ctime": 1779777783, "time_str": "14:43:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260526/c676974211.shtml"}, {"id": "4406933", "title": "成都一洗涤企业被曝布草混洗 涉事企业已停业接受调查", "content": "记者26日从成都市龙泉驿区商务局获悉，该局已组织区市场监管局、区卫健局等部门开展调查核实，检查发现现场存在管理不规范等问题，涉事企业现已暂停营业接受调查。据悉，下一步，成都市龙泉驿区将根据调查核实情况依法依规严肃处理，同时将会同相关部门加强对洗涤企业的监督检查。（新华社）", "ctime": 1779777655, "time_str": "14:40:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260526/c676974156.shtml"}, {"id": "4406931", "title": "台州市智联低空综合服务公司登记成立", "content": "企查查APP显示，近日，台州市智联低空综合服务有限公司成立，经营范围包含：通用航空服务；民用航空器驾驶员培训；民用航空器维修；飞行训练；民用航空器（发动机、螺旋桨）生产等。企查查股权穿透显示，该公司由台州市宏途数字科技集团有限公司等共同持股。（人民财讯）", "ctime": 1779777573, "time_str": "14:39:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260526/c676974114.shtml"}, {"id": "4406929", "title": "沪深京三市成交额超3万亿元，较上日此时放量322亿元", "content": "据同花顺iFinD数据，沪深京三市成交额超3万亿元，较上日此时放量322亿元，预计全天成交金额约3.2万亿元。截至目前，沪市成交额13451亿元，深市成交额16363亿元，北证50成交额192亿元。", "ctime": 1779777571, "time_str": "14:39:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260526/c676974112.shtml"}, {"id": "4406925", "title": "三大指数尾盘回升，深证成指、创业板指双双翻红", "content": "三大指数尾盘回升，深证成指、创业板指双双翻红，沪指跌幅收窄。", "ctime": 1779777454, "time_str": "14:37:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260526/c676974037.shtml"}, {"id": "4406923", "title": "AI助力能源发展趋势报告发布", "content": "据央视新闻消息，国家能源局发布首份《中国“人工智能+”能源发展报告2026》，全面分析全球与国内AI在能源领域的融合现状及趋势。报告指出，AI技术的快速发展推动全球算力设施的电力需求大增，预计到2030年数据中心用电量将比2025年翻倍。目前，中国已建成42个万卡级智算集群，算力中心总用电量达1700亿千瓦时。国内能源行业已应用数十个AI大模型，涵盖电网、新能源等多个领域。", "ctime": 1779777447, "time_str": "14:37:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260526/c676974035.shtml"}, {"id": "4406921", "title": "支付宝宣布完成AI支付的全域布局", "content": "5月26日，支付宝宣布，“AI支付”已完成3亿笔AI智能体支付、支持95%通用智能体框架，成为全球首个大规模商用的AI原生支付基建。同时，支付宝发布全球首个Token Pay服务和AI钱包产品。(券中社)", "ctime": 1779777443, "time_str": "14:37:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260526/c676974032.shtml"}, {"id": "4406917", "title": "海南矿业等新设联合矿业合伙企业", "content": "企查查APP显示，近日，海南圣飞联合矿业合伙企业（有限合伙）成立，经营范围包含：常用有色金属冶炼；有色金属合金销售；有色金属压延加工；金属切削加工服务等。企查查股权穿透显示，该公司由海南矿业等共同出资。（人民财讯）", "ctime": 1779777333, "time_str": "14:35:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260526/c676973991.shtml"}, {"id": "4406915", "title": "浙江省“十五五”水安全保障规划印发", "content": "浙江省人民政府办公厅印发《浙江省“十五五”水安全保障规划》，其中提出，推进浙东南、浙中、浙北等水资源配置工程，畅通浙江水网大动脉，将优质水资源输送到相对缺水地区，推动区域协调发展。实施宁波水库群东西线联通等区域引调水工程，串联已建水源，扩大原水管网覆盖范围，推进水厂备用水源和应急水源建设，实现重点区域“多源互备”。完善农村供水工程体系，建设一批小型水库、小型引调水和规模化供水工程，逐步推进农村供水管网更新改造，持续提高农村供水保障能力。大力推进节水工程，加快建设一批工业水厂、再生水利用、海水淡化等工程，推动用水循环化改造和非常规水利用。到2030年，新增年引调水能力10亿立方米，新增水库年供水能力4.6亿立方米，规模化供水工程覆盖农村人口比例达到92%。（人民财讯）", "ctime": 1779777300, "time_str": "14:35:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260526/c676973963.shtml"}, {"id": "4406913", "title": "中贝通信：公司各项算力项目均在稳步推进 供应商变动不会产生实质性不利影响", "content": "有投资者在互动平台向中贝通信提问：近期媒体报道中寅贸易相关事宜，引发广大投资者强烈担忧。请问公司2024年算力相关营收是否存在水分？该合作商突然退出，会不会影响后续算力供货、大额订单交付。中贝通信回复称，针对相关事项，公司高度重视并进行了核查，现就相关情况作进一步说明。公司与恒为科技、中寅贸易的交易均基于真实的商业需求与行业背景，会计处理及信息披露均严格遵循企业会计准则及上市规则，且相关采购合同均己履行完毕，采购所涉设备均已交付客户使用。公司智算相关营业收入真实、准确。目前，公司各项算力项目均在稳步推进，该供应商的变动不会对后续算力供货及大额订单交付产生实质性不利影响，公司生产经营与财务状况正常。（人民财讯）", "ctime": 1779777277, "time_str": "14:34:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260526/c676973956.shtml"}, {"id": "4406901", "title": "中国中煤、中国电建在绥中成立新能源公司", "content": "企查查APP显示，近日，中煤资源（绥化）新能源有限公司成立，注册资本2.8亿元，经营范围包含：风力发电技术服务；太阳能发电技术服务；生物质能技术服务等。企查查股权穿透显示，该公司由中国中煤能源集团有限公司、中国电建间接共同持股。（人民财讯）", "ctime": 1779777162, "time_str": "14:32:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260526/c676973928.shtml"}, {"id": "4406887", "title": "韩国法院驳回旨在暂停三星电子主要工会谈判的禁令申请", "content": "韩国法院驳回旨在暂停三星电子主要工会谈判的禁令申请。（财联社）", "ctime": 1779777100, "time_str": "14:31:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260526/c676973897.shtml"}, {"id": "4406883", "title": "日韩股市收盘涨跌互现", "content": "日经225指数收跌0.25%，报64996.09点。韩国综指收涨2.55%，报8047.51点。", "ctime": 1779777070, "time_str": "14:31:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260526/c676973883.shtml"}, {"id": "4406877", "title": "巴基斯坦防长：不会加入任何与以色列关系正常化的协议", "content": "当地时间5月26日，巴基斯坦国防部部长阿西夫表示，巴基斯坦不会加入任何与以色列关系正常化的协议，并称巴方不会接受任何与其“基本理念相冲突”的协议。此前，美国总统特朗普在社交媒体发文，呼吁参与斡旋美伊谈判的沙特、卡塔尔、埃及、约旦、土耳其和巴基斯坦“立即”加入“亚伯拉罕协议”，否则，上述国家不应参与美伊协议斡旋。特朗普还说，如果美伊达成协议，伊朗也应该加入“亚伯拉罕协议”。“亚伯拉罕协议”是以色列政府同阿联酋、巴林、苏丹、摩洛哥等阿拉伯国家签署的、意在快速推进以色列与阿拉伯国家关系正常化的协议。（央视新闻）", "ctime": 1779776997, "time_str": "14:29:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260526/c676973839.shtml"}, {"id": "4406875", "title": "兆易创新成交额达300亿元", "content": "兆易创新成交额达300亿元，现涨1.84%。", "ctime": 1779776994, "time_str": "14:29:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260526/c676973837.shtml"}, {"id": "4406871", "title": "段永平回应王宁像乔布斯，此前已开始布局泡泡玛特", "content": "5月25日晚，有网友问段永平：怎么看王宁，他是像乔布斯一样，既是报时人又是造钟人吗？段永平今日给出回复：我觉得王宁对自己产品的理解以及追求和Jobs是一个级别的，至少未来会是的。王宁对商业的理解好像比Jobs还要强一点点。今年4月，段永平发文称“我的泡泡玛特保险公司正式开张了”，正式确认已开始布局泡泡玛特，相关发言引发市场关注。(21世纪经济报道)", "ctime": 1779776838, "time_str": "14:27:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260526/c676973760.shtml"}, {"id": "4406843", "title": "雄韬股份触及涨停", "content": "雄韬股份触及涨停，成交额14.00亿元。", "ctime": 1779776244, "time_str": "14:17:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260526/c676973613.shtml"}, {"id": "4406823", "title": "广期所碳酸锂主力合约跌超4%", "content": "广期所碳酸锂主力合约跌超4%，报175760元/吨。", "ctime": 1779775883, "time_str": "14:11:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260526/c676973525.shtml"}, {"id": "4406821", "title": "俄官员：俄欧对话前景取决于欧盟是否尊重俄方利益", "content": "俄外交部欧洲事务司司长马斯连尼科夫称，欧盟与俄方接触的前景，取决于欧盟领导层是否愿意重新审视其反俄外交方针并充分尊重俄方合法利益。马斯连尼科夫强调，俄方从未拒绝与欧盟对话，始终主张通过外交途径解决分歧。但欧洲未准备好成为乌克兰问题谈判进程的一部分——既未恢复与俄对话，也未就对话内容达成内部共识。俄外交部无任所大使米罗什尼克表示，俄方未看到欧洲提出任何和平解决方案，“只有投降、赔款等要求”。据悉，乌克兰方面正试图将欧盟拉入谈判进程。（央视新闻）", "ctime": 1779775871, "time_str": "14:11:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260526/c676973524.shtml"}, {"id": "4406789", "title": "沪深京三市成交额超2.7万亿元", "content": "据同花顺iFinD数据，沪深京三市成交额超2.7万亿元，预计全天成交金额约3.2万亿元。截至目前，沪市成交额12057亿元，深市成交额14781亿元，北证50成交额172亿元。", "ctime": 1779775449, "time_str": "14:04:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260526/c676973381.shtml"}, {"id": "4406763", "title": "首创期货：地缘与政策博弈，镍价呈现暴涨暴跌", "content": "尽管昨日印尼能矿部表示冻结106个未提交RKAB的镍矿产与煤炭矿业业务许可证，显示镍矿供应呈现明确的收紧，但更大的扰动在于中东地缘状况反复，关乎海峡通航状况对于印尼湿法原料的供应情况，时好时坏的消息使得昨夜锡价暴跌暴涨，形成U字型行情，开盘大跌超2%，触及下方14万支撑后，又在尾盘大幅反弹，收复夜盘跌幅，回升至14.4万上方而今日早上又有报道美伊达成协议30天后重开海峡，镍价在开盘后又快速下跌至14.1万附近。近期镍价走势时常会出现短暂的暴涨暴跌的情况，虽然事后解盘多有消息的影响，但明显存在集中或者量化的操作，小资金极易在大波动后被洗出，交易需谨慎。对于镍因政策明确，供需边际呈现不断改善，下部支撑较强，逢低仍有入场机会，但上方宜见好就收。（首创期货）", "ctime": 1779775299, "time_str": "14:01:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260526/c676973334.shtml"}, {"id": "4406733", "title": "盐城国资成立黄海物流股权投资合伙企业，出资额20亿元", "content": "企查查APP显示，近日，盐城市黄海物流股权投资合伙企业（有限合伙）成立，出资额20亿元，经营范围包含：以私募基金从事股权投资、投资管理、资产管理等活动。企查查股权穿透显示，该企业由盐城盛州投资控股集团有限公司等共同出资。（人民财讯）", "ctime": 1779775248, "time_str": "14:00:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260526/c676973325.shtml"}, {"id": "4406659", "title": "润达医疗等成立新公司，含多项AI业务", "content": "企查查APP显示，近日，合肥问道整合医学科技有限公司成立，经营范围包含：人工智能公共服务平台技术咨询服务；人工智能双创服务平台；人工智能公共数据平台；软件开发；人工智能应用软件开发等。企查查股权穿透显示，该公司由润达医疗等共同持股。（人民财讯）", "ctime": 1779774515, "time_str": "13:48:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260526/c676973127.shtml"}, {"id": "4406641", "ti // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
