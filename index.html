见》，其中提出，扩大人民币使用。鼓励船舶制造、航运、外经贸企业和保险公司在航运保险领域更多使用人民币，优先在境内投保、理赔环节，以及中资企业“走出去”业务场景推广使用人民币结算。支持银行为境内外主体以人民币结算提供更加便利条件。", "ctime": 1793951803, "time_str": "15:56:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261106/c681549077.shtml"}, {"id": "5594843", "title": "七部门：鼓励能源、矿石、粮食等大宗散货在运输全流程做到应保尽保、足额投保", "content": "金融监管总局、交通运输部、国家发展改革委、财政部、商务部、中国人民银行、国务院国资委发布《关于加快航运保险高质量发展的指导意见》。其中提到，完善货物运输风险保障机制。引导贸易企业、物流企业强化风险意识，提升货物运输保险自主安排能力，系统构建货物运输全链条风险保障机制。鼓励能源、矿石、粮食等大宗散货在运输全流程做到应保尽保、足额投保。鼓励电子家电、精密仪器、高端装备、“新三样”等贸易企业和物流企业积极运用保险机制分散风险，提升产业链稳定性。引导发挥平台企业、货代企业作用，支持外经贸企业投保货运险等航运保险。", "ctime": 1793951784, "time_str": "15:56:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261106/c681549062.shtml"}, {"id": "5594815", "title": "七部门：支持自主航行、远程控制等智能船舶强化网络安全等新兴风险保障 引导沿海、内河船舶提高保险保障水平", "content": "金融监管总局、交通运输部、国家发展改革委、财政部、商务部、中国人民银行、国务院国资委发布《关于加快航运保险高质量发展的指导意见》。其中提到，健全船舶全生命周期风险管理体系。船舶制造企业、航运企业在推动绿色化、数智化发展等过程中，应主动运用保险工具分散风险。充分利用船检评估机制，推动油轮、液化天然气船、大型集装箱船、大型邮轮、大型散矿船、游艇等高价值船舶与海工装备健全覆盖设计、建造、营运、处置等全生命周期的保险管理方案。鼓励支持新能源清洁能源船舶提升对绿色燃料加注、电池系统更换、绿色改装、运营安全等相关产业链的保险保障水平。支持自主航行、远程控制等智能船舶强化网络安全等新兴风险保障。引导沿海、内河船舶提高保险保障水平。", "ctime": 1793951691, "time_str": "15:54:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261106/c681549028.shtml"}, {"id": "5594797", "title": "外交部：中方坚决反对美方干扰破坏中古合作", "content": "11月6日，外交部发言人郭嘉昆主持例行记者会。针对美国国务院宣布新一轮针对古巴的制裁措施并将两家中国企业列入清单，郭嘉昆表示，中国同古巴的合作光明正大，中方坚决反对没有国际法依据、未经联合国安理会授权的非法单边制裁和所谓“长臂管辖”，坚决反对美方干扰破坏中古合作，坚定支持古巴维护国家主权、反对外来干涉，将采取一切必要措施，坚定维护本国企业的正当权益。（央视新闻）", "ctime": 1793951437, "time_str": "15:50:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261106/c681548925.shtml"}, {"id": "5594759", "title": "习近平将会见奥地利总理施托克尔", "content": "11月6日下午，国家主席习近平将在北京人民大会堂会见来华进行正式访问的奥地利总理施托克尔。(央视新闻)", "ctime": 1793951130, "time_str": "15:45:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261106/c681548735.shtml"}, {"id": "5594753", "title": "无锡振华：首次回购公司股份98.1万股，支付2119.58万元", "content": "无锡振华公告，公司此前审议通过以集中竞价方式回购公司股份方案，回购资金总额为2500万元至5000万元，回购价格不超过33.26元/股，回购股份将全部用于股权激励或员工持股计划。2026年11月6日，公司首次通过集中竞价交易方式回购股份98.1万股，占公司总股本的比例为0.2802%，购买最高价为21.9元/股、最低价为20.8元/股，已支付总金额为2119.58万元（不含交易费用）。", "ctime": 1793951109, "time_str": "15:45:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261106/c681548730.shtml"}, {"id": "5594749", "title": "福田汽车：2026年10月汽车销量56503辆，去年同期56617辆", "content": "福田汽车公告，2026年10月汽车产量52355辆，去年同期56672辆，本年累计产量56.65万辆，去年累计54万辆，累计同比增长4.91%；销量56503辆，去年同期56617辆，本年累计销量57.44万辆，去年累计53.67万辆，累计同比增长7.02%。其中新能源汽车销量15318辆，去年同期8006辆，本年累计销量11.05万辆，去年累计82339辆，累计同比增长34.16%。发动机产品销量22068台，去年同期22819台，本年累计销量25.63万台，去年累计21.84万台，累计同比增长17.37%。", "ctime": 1793951105, "time_str": "15:45:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261106/c681548727.shtml"}, {"id": "5594747", "title": "麒盛科技：全资子公司1200万澳元收购境外公司股权交割完成", "content": "麒盛科技公告，公司全资子公司舒福德投资此前披露拟以自有资金1200万澳元收购澳大利亚企业A.H.Beard Holdings Pty Limited（AHB控股）100%股权。2026年11月5日，舒福德投资与交易各方按照约定的条款和条件完成股权交割，公司通过舒福德投资间接持有AHB控股100%股权，AHB控股纳入公司合并报表范围。", "ctime": 1793951101, "time_str": "15:45:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261106/c681548724.shtml"}, {"id": "5594737", "title": "国贸股份进博会上签订超25亿美元大豆采购合作", "content": "厦门国贸集团股份有限公司在第九届进博会上，分别与全球农业巨头ADM、路易达孚（LDC）签署大豆采购协议备忘录，总金额超25亿美元，旨在深化全球粮源协同，进一步夯实农产品供应链保障能力。（财联社）", "ctime": 1793950993, "time_str": "15:43:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261106/c681548675.shtml"}, {"id": "5594703", "title": "傲农生物：2026年10月生猪销售量29.45万头，同比增加54.83%", "content": "傲农生物公告，2026年10月，公司生猪销售量29.45万头，同比增加54.83%，较2026年9月增加16.14%。2026年10月末，公司生猪存栏量98.01万头，同比增加50.70%，较2026年9月末减少2.90%，较2025年12月末增加31.85%。2026年1-10月累计销售量199.9万头。", "ctime": 1793950719, "time_str": "15:38:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261106/c681548509.shtml"}, {"id": "5594701", "title": "江苏有线：控股股东省文化科技集团增持计划实施完毕，累计增持0.5538%股份", "content": "江苏有线公告，公司控股股东江苏省文化科技控股集团有限公司此前计划自2025年11月8日起12个月内通过集中竞价方式增持公司股份，增持金额不低于1亿元（含）且不高于1.5亿元（含）。截至本公告披露日，省文化科技集团通过上海证券交易所系统以集中竞价交易方式累计增持公司股份2769.48万股，占公司目前总股本的0.5538%，累计增持金额1亿元（不含交易费用），达到增持计划下限，本次增持计划实施完毕。增持完成后，省文化科技集团持股数量为26.57亿股，持股比例53.13%。", "ctime": 1793950711, "time_str": "15:38:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261106/c681548501.shtml"}, {"id": "5594697", "title": "陕西煤业：2026年10月煤炭产量同比增长2.40%", "content": "陕西煤业公告，公司2026年10月煤炭产量1535万吨，同比增长2.40%，累计产量1.51亿吨，同比增长3.75%；自产煤销量1410万吨，同比增长1.36%，累计销量1.38亿吨，同比增长3.54%。发电业务方面，10月总发电量43.1亿千瓦时，同比增长29.94%，累计发电量378.3亿千瓦时，同比增长8.49%；总售电量40.7亿千瓦时，同比增长30.67%，累计售电量355.92亿千瓦时，同比增长8.81%。", "ctime": 1793950704, "time_str": "15:38:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261106/c681548494.shtml"}, {"id": "5594693", "title": "商务部：欧盟需正视自身面临的经贸问题通过对话协商解决彼此关切才是正道", "content": "商务部新闻发言人就涉及欧盟的进口对位芳纶长丝和乙叉降冰片烯两起反倾销调查答记者问。有记者问：我们关注到商务部今日对涉及欧盟的进口对位芳纶长丝和乙叉降冰片烯发起两起反倾销调查，能否介绍相关情况？答：相关调查均应国内产业申请发起。申请人提供的初步证据显示，2023年至2026年上半年，自欧进口对位芳纶长丝产品的数量处于高位，价格累计跌幅超50%。自欧盟等地区进口的乙叉降冰片烯数量2023年至2025年累计增长27.35%，2026年上半年同比增长56%，且价格整体呈下降趋势。申请人主张，相关倾销进口产品对中国国内产业生产经营造成了损害。根据中国法律和世贸组织规则，相关申请符合反倾销调查立案条件，中方将依法依规开展调查，充分保障各利害关系方权利，客观公正作出裁决。需要强调的是，欧盟2026年以来已发起16起涉华贸易救济调查，案件数量同比接近翻番，其中涉及化工产品9起，占比近60%。特别是10月中旬以来，欧盟连续对中国糠醇、聚偏二氟乙烯等产品发起反倾销调查。与欧盟对华贸易救济立案数量相比，中方在贸易救济领域一贯审慎克制。中方想再次重申，欧盟需正视自身面临的经贸问题，保护主义提升不了竞争力，通过对话协商解决彼此关切才是正道。（证券时报）", "ctime": 1793950662, "time_str": "15:37:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261106/c681548464.shtml"}, {"id": "5594609", "title": "外交部：中国始终是非洲国家最可信任、最可依赖的伙伴", "content": "11月6日，外交部发言人郭嘉昆主持例行记者会。有记者就“福布斯刊文对比中美对非洲政策差异”一事提问。\n\n对此，郭嘉昆表示，中国与非洲国家是天然的命运共同体，中方始终秉持真实亲诚理念，支持非洲发展振兴、联合自强。\n\n今年5月1日起，中国对53个非洲建交国全面实施零关税举措，非洲农产品、轻工制成品进入中国市场更加便捷，牛油果、咖啡豆、碧根果、乳木果油等特色产品走进中国千家万户。今年前9个月，中非贸易额突破3100亿美元，同比增长22%。零关税举措有效降低中非贸易成本，给更多非洲中小企业和农户带来实惠。无论国际形势如何变化，中国始终是非洲国家最可信任、最可依赖的伙伴。中非高质量合作将继续助力双方携手迈向现代化。(央视新闻)", "ctime": 1793950252, "time_str": "15:30:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261106/c681548233.shtml"}, {"id": "5594543", "title": "外交部：格林纳达大选结果揭晓 中方表示祝贺", "content": "11月6日，外交部发言人郭嘉昆主持例行记者会。有记者问，据报道当地时间11月5日格林纳达大选结果揭晓，迪康·米切尔将连任总理。郭嘉昆表示，中方对米切尔总理获得连任表示祝贺，格林纳达是中国在加勒比地区的重要合作伙伴，中方愿同格方一道努力，继续深化两国互利友好合作，更好造福两国人民。（央视新闻）", "ctime": 1793950156, "time_str": "15:29:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261106/c681548169.shtml"}, {"id": "5594539", "title": "全球首台4000米级浮空风电系统完成城市首飞", "content": "11月6日，全球首台4000米级浮空风力发电系统S4000在湖南岳阳完成城市首飞，系该级别系统首次在城市场景放飞。系统长67米、宽40米、高23米，升空海拔可达4000米，输出电压覆盖10千伏至35千伏，设计寿命20年。首席架构设计师顿天瑞介绍，此次测试接网性能，城市试飞考验其在人群周边安全可靠飞行。中科院空天信息创新研究院研究员蔡榕称，试飞验证了系统可靠性及在城市周边工程交付的可能性和完整性，为适航取证、场景示范铺路。（央视新闻）", "ctime": 1793950151, "time_str": "15:29:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261106/c681548164.shtml"}, {"id": "5594529", "title": "伊朗革命卫队：霍尔木兹海峡两艘油轮起火", "content": "伊朗革命卫队海军公共关系部表示，两艘违规油轮，一艘在霍尔木兹海峡东部区域，另一艘在霍尔木兹海峡，试图通过非授权航道，被水雷击中并停在霍尔木兹海峡水域。这两艘油轮关闭了所有导航和识别系统，试图在美军的支持下，从霍尔木兹海峡的非法航道驶出，在触雷后发生火灾并被迫停航。霍尔木兹海峡现已被封锁，在“七项条件”得到落实之前，局势不会有任何改变。美军中央司令部试图迫使油轮通过被水雷覆盖的非法水域，除了接连不断的失败和耻辱之外，不会有任何其他结果。", "ctime": 1793950085, "time_str": "15:28:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261106/c681548120.shtml"}, {"id": "5594523", "title": "外交部：重量级展会接棒举行 赋能发展 惠及民生", "content": "11月6日，外交部发言人郭嘉昆主持例行记者会。有记者问：昨天，第九届中国国际进口博览会暨虹桥国际经济论坛在上海开幕。本周三，第140届广交会也在广州圆满闭幕。有媒体评论称，两场重量级展会接棒举行，展现出中国既是世界工厂也是世界市场，既是超级卖家也是超级买家，为解决贸易失衡问题发挥重要作用。发言人对此有何评论？\n\n郭嘉昆表示，这些展会是中国连接全球、赋能发展、惠及民生的重要窗口。中方愿同各方一道，进一步办好进博会，充分发挥国际采购、投资促进、人文交流、开放合作四大平台作用，更好造福世界各国人民。(央视新闻)", "ctime": 1793950008, "time_str": "15:26:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261106/c681548073.shtml"}, {"id": "5594521", "title": "美国对古巴实施新一轮制裁涉及中国企业 外交部回应", "content": "外交部发言人郭嘉昆主持例行记者会，就美国国务院针对古巴实施新一轮制裁、指控两家中国企业向古巴军方供应电子设备和安防设备一事回应称，中国同古巴的合作光明正大；坚决反对没有国际法依据、未经联合国安理会授权的非法单边制裁和所谓“长臂管辖”，反对美方干扰破坏中古合作，坚定支持古巴维护国家主权、反对外来干涉；将采取一切必要措施，坚定维护本国企业的正当权益。（北京日报）", "ctime": 1793949995, "time_str": "15:26:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261106/c681548068.shtml"}, {"id": "5594483", "title": "美国先减关税、中国再履行农产品采购承诺？外交部：建议询问主管部门", "content": "11月6日，外交部发言人郭嘉昆主持例行记者会。路透社记者提问，中国商务部发言人昨日表示，中国一贯对扩大自美国采购农产品持开放态度，但前提是双方落实此前商定的300亿美元互惠降税协议。这是否意味着除非关税削减，中方不会开始履行170亿美元的农产品采购承诺？郭嘉昆表示，这个问题建议向中方主管部门进一步询问，并强调维护中美经贸关系稳定发展符合两国和两国人民利益，双方要坚持互利共赢导向，推动中美经贸关系持续稳定向好发展。（澎湃新闻）", "ctime": 1793949755, "time_str": "15:22:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261106/c681547920.shtml"}, {"id": "5594475", "title": "外交部：中美要相向而行推动经贸关系持续稳定向好发展", "content": "外交部发言人郭嘉昆6日在例行记者会上表示，维护中美经贸关系稳定发展符合两国和两国人民利益，也有利于全球经济发展。双方要相向而行，坚持互利共赢导向，推动中美经贸关系持续稳定向好发展。（新华社）", "ctime": 1793949743, "time_str": "15:22:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261106/c681547912.shtml"}, {"id": "5594459", "title": "中金公司今日在第三批“证券、基金、保险公司互换便利”项下买入股票", "content": "11月6日，中金公司在第三批“证券、基金、保险公司互换便利”项下买入股票。中金公司相关负责人表示，下一步将继续使用互换便利业务获得的资金进一步增持股票，助力资本市场健康稳定发展。（财联社）", "ctime": 1793949615, "time_str": "15:20:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261106/c681547549.shtml"}, {"id": "5594371", "title": "海南离岛免税新政策实施满一年购物金额超300亿元", "content": "海南离岛免税新政策自2025年11月1日第十次优化调整以来已平稳实施一年。据海口海关统计，2025年11月至2026年10月，离岛免税购物金额、人数、数量分别为334.5亿元、487.9万人次、2764.4万件，同比分别增长13.8%、8.6%、2.4%；品类由45大类扩充至47大类，6类国内商品可进入免税渠道。岛内居民“即购即提”购物金额4.1亿元，离境旅客购物2.4万人次、1.6亿元。海口海关表示将继续深化监管服务创新，助力海南国际旅游消费中心建设。（新华社）", "ctime": 1793949187, "time_str": "15:13:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261106/c681547209.shtml"}, {"id": "5594343", "title": "诺贝尔经济学奖获得者皮萨里德斯：中国经济正朝着正确方向发展", "content": "11月5日，第九届虹桥国际经济论坛发布《世界开放报告2026》，报告认为世界开放正处于复杂严峻的调整期，2025年世界开放指数为0.7453，同比下降1%，为2016年以来最大降幅。诺贝尔经济学奖获得者皮萨里德斯表示，地缘政治局势和关税壁垒对贸易秩序产生负面影响，关税出台逻辑早已不是经济考量；开放极大地提高了中国人民的生活水平，中国经济正朝着正确的方向发展。报告还显示，1990年至2025年中国开放指数从0.5891上升至0.7551，提高28.18%，2025年排名较2024年上升1位、较2008年上升32位、较1990年上升50位。（央视新闻）", "ctime": 1793949047, "time_str": "15:10:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261106/c681547164.shtml"}, {"id": "5594307", "title": "替公募承担境外调研费用 国盛证券收警示函", "content": "据监管部门披露，因存在为公募基金管理人承担境外调研期间门票、调研中介等费用的情形，国盛证券被出具警示函，并记入证券期货市场诚信档案。经查，国盛证券违反了《公开募集证券投资基金证券交易费用管理规定》《证券期货经营机构及其工作人员廉洁从业规定》等相关规定。监管部门此前已集中点名5家券商、基金公司及个人，称部分基金公司参加券商研究所组织的境外调研活动时，存在由券商承担专家咨询、调研门票等费用的情形。（财联社）", "ctime": 1793948919, "time_str": "15:08:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261106/c681547091.shtml"}, {"id": "5594301", "title": "中国移动发布6G智能应用共创行动 将配置十亿级研发合作资金", "content": "中国移动在2026移动网络大会上发布6G智能应用共创行动，将聚合央国企、互联网大厂等千家伙伴，举措包括打造6G网络试验装置、配置十亿级研发合作资金、集聚专家人才智力资源、依托百亿元产业投资基金进行资本赋能、共享产业生态与市场渠道。中国移动总工程师王晓云表示，预计到2035年，6G服务的智能体数量将达到千亿级。距离3GPP 6G标准冻结已不到30个月。（财联社）", "ctime": 1793948856, "time_str": "15:07:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261106/c681546993.shtml"}, {"id": "5594287", "title": "何立峰将赴加拿大主持第二次中加经济财金战略对话", "content": "外交部发言人宣布：经中加双方商定，第二次中加经济财金战略对话将于11月9日在加拿大举行。中共中央政治局委员、国务院副总理、中加经济财金战略对话中方牵头人何立峰与对话加方牵头人、加财政部长商鹏飞、国际贸易部长西杜将共同主持对话。(央视新闻)", "ctime": 1793948797, "time_str": "15:06:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261106/c681546916.shtml"}, {"id": "5594249", "title": "国防部：国际社会应高度警惕日本重启“战争机器”", "content": "11月6日下午，国防部新闻发言人陈曦大校就近期涉军问题发布消息。\n\n记者：据报道，日本政府计划在年度修订的“安保三文件”中将“防卫与经济的良性循环”列为重要支柱之一。有分析称，日本政府将军工产业视为产业政策支柱，并让防卫省参与其发展，此举标志着日战后防卫政策重大转变。请问对此有何评论？\n\n陈曦：这是日本执政当局借所谓“军产兴国”策略，加速推进“再军事化”的障眼法。二战前，日本军工复合体曾深度嵌入日本经济、绑架国家决策、支撑军事扩张，成为驱动日本对外侵略的重要推手。如今，日本右翼势力撕下“专守防卫”伪装，重新激活军工复合体，加速日本社会“战备化”、经济“军事化”，给日本民众安全福祉、全球和平稳定带来系统性风险。国际社会必须高度警惕并坚决遏制日本重启“战争机器”、重走扩张邪路，共同守护战后国际秩序。(央视新闻)", "ctime": 1793948709, "time_str": "15:05:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261106/c681546866.shtml"}, {"id": "5594223", "title": "国防部：规范涉军信息传播秩序 共同营造清朗涉军网络环境", "content": "11月6日，国防部新闻发言人陈曦大校就涉军问题回应：为纠治网络涉军领域违法违规问题，规范涉军信息传播秩序，军地职能部门结合正在开展的网络涉军不当营销和炒作信息专项整治，公开曝光利用AI生成涉军虚假信息、虚假宣传违规开展“军考”培训等5个方面违法违规涉军“自媒体”账号典型案例。陈曦表示，将持续深化专项整治，加大查处惩戒力度，通过中央网信办违法和不良信息举报中心、中国军号客户端“网络涉军举报和辟谣平台”发动社会各界参与，共同营造清朗涉军网络环境。（央视新闻）", "ctime": 1793948677, "time_str": "15:04:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261106/c681546852.shtml"}, {"id": "5594089", "title": "商务部：对原产于欧盟、日本的进 // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
