d": "5077097", "title": "国家安全生产应急救援队伍持续在吉隆开展堰塞湖监测", "content": "西藏日喀则市吉隆县泥石流灾害发生后，应急管理部调派国家安全生产应急救援队伍跨区域增援，全力支持地方做好救援工作。9月1日，国家安全生产应急救援勘测队、国家隧道应急救援中交建重庆队、国家隧道应急救援中铁二局西藏队等3支国家安全生产应急救援队伍，携带边坡雷达、无人机、生命探测仪等专业装备，组成吉隆口岸堰塞湖联合监测组，持续在现场监测堰塞湖坝体、南岸滑坡体及堰塞湖下游沟底拐角山体。（新华社）", "ctime": 1788243287, "time_str": "14:14:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260901/c679483664.shtml"}, {"id": "5077085", "title": "美国联合包裹服务公司宣布高管人事调整，向全球运营模式转型", "content": "美国联合包裹服务公司（UPS）8月31日宣布，执行副总裁兼国际、医疗保健和供应链解决方案总裁凯特·古特曼（Kate Gutmann）将因个人家庭原因退休，继任者为公司资深高管Wilfredo Ramos。UPS另外宣布将向全球运营模式转型，在此模式下，公司将在各地区实现关键运营流程的标准化，同时保持必要灵活性，以满足当地市场的独特需求。Nando Cesarone已被任命为执行副总裁兼全球运营主管，负责领导这一新模式，将统筹管理公司的全球航空网络与转运中心、地面运输、设施与工程运营、“未来智能网络”计划等职能。（界面新闻）", "ctime": 1788243210, "time_str": "14:13:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260901/c679483645.shtml"}, {"id": "5076951", "title": "全链条治理流量造假、网络暴力 今日起互联网新规正式施行", "content": "今年5月，国家网信办、公安部、文化和旅游部、市场监管总局、广电总局联合公布《互联网信息内容多渠道分发服务管理规定》，自今天（9月1日）起正式施行。这是我国首部专门规范互联网信息内容多渠道分发服务的管理规定，明确了在境内提供和使用互联网信息内容多渠道分发服务及其监督管理的基本原则和制度规则。《规定》所称互联网信息内容多渠道分发服务，是指为互联网用户公众账号的信息内容生产发布活动提供的策划、制作、分发、营销、推广、经纪等服务，也就是通常所说的MCN机构相关业务。（央视新闻）", "ctime": 1788242630, "time_str": "14:03:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260901/c679483448.shtml"}, {"id": "5076669", "title": "我国难选铁矿资源综合利用取得重要突破", "content": "我国是全球最大的铁矿石消费国，铁矿石消耗量占全球半数以上，对外依存度高，资源定价权和供应链安全长期面临挑战。为了摆脱这种局面，中国科学院过程工程研究所经过二十余年持续攻关，在国际上首次突破了难选铁矿高效利用的核心技术瓶颈。基于该技术建成的全球最大难选铁矿磁化焙烧工程也在今天（9月1日）竣工验收。（央视新闻）", "ctime": 1788242417, "time_str": "14:00:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260901/c679483400.shtml"}, {"id": "5076635", "title": "儒意电影成立澳洲发行厂牌寰映发行", "content": "9月1日，儒意电影正式宣布成 智谱 “只会后训练” 的质疑，询问公司近期在参数规模上相对克制的原因。智谱创始人唐杰表示，下一代模型依旧会扩大基座规模，同时会对激活参数做管控，避免推理速度下滑和成本上升。算力层面，智谱披露，已实现10万级国产芯片规模化推理，单位Token推理成本较年初下降80%。GLM 5.3 Flash是智谱首款在超大规模真实流量下全面依托国产芯片集群提供服务的模型。公司称，对比同一硬件的初始基线，该模型端到端服务性能提升3倍。唐杰将未来GLM-6.0的一个方向概括为自进化，“这是一个很大的挑战，最大的问题是这个模型能自己判断自己什么时候停止，什么时候纠正自己，这是最大的问题，而不是简单地把模型训练大，在未来模型中，这是作为重点研究的”。（每经）", "ctime": 1788240975, "time_str": "13:36:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260901/c679482901.shtml"}, {"id": "5076445", "title": "2026年国家基本公共卫生服务经费人均财政补助标准增至99元", "content": "为指导各地做好2026年基本公共卫生服务工作，国家卫生健康委、财政部、国家中医药局、国家疾控局今天发布《关于做好2026年基本公共卫生服务工作的通知》。《通知》指出，2026年，基本公共卫生服务经费人均财政补助标准为99元，要求各地足额落实并规范管理使用经费，提升基本公共卫生服务均等化水平。《通知》要求各地依据基本公共卫生服务规范为城乡居民提供服务：一是广泛开展形式多样的健康教育，提高居民健康素养，引导群众积极参与自我健康管理，做自己健康的第一责任人。二是面向全人群，聚焦0~6岁儿童，孕产妇，65岁及以上老年人，高血压、2型糖尿病、慢性阻塞性肺疾病患者定期提供健康服务。三是各地结合实际，做好地方病防治、农村妇女“两癌”检查等服务项目，以国家乡村振兴重点帮扶县等地区为重点，做好新生儿疾病筛查和儿童营养改善等工作。（央视新闻）", "ctime": 1788240691, "time_str": "13:31:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260901/c679482838.shtml"}, {"id": "5076355", "title": "AI 3D公司VAST半年融资约50亿元", "content": "9月1日，AI 3D领域创业公司VAST宣布完成B轮和B+轮融资，合计约30亿元人民币，由经纬创投领投，完美世界、蓝色光标等机构联合参投，老股东达晨财智、春华资本等机构超额追投。不到半年，VAST累计融资约50亿元，本轮融资将投入3D原生模型与数据能力迭代、训练与推理基础设施扩建、产品开发与商业化落地加速。（第一财经）", "ctime": 1788240118, "time_str": "13:21:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260901/c679482700.shtml"}, {"id": "5076251", "title": "创业板指探底回升翻红", "content": "创业板指探底回升翻红，此前一度跌近2%。全市场超3600家个股上涨。", "ctime": 1788239617, "time_str": "13:13:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260901/c679482577.shtml"}, {"id": "5076233", "title": "上海砺铭科技有限公司成立，法定代表人为肖冰，注册资本为1.2亿元", "content": "企查查APP显示，近日，上海砺铭科技有限公司成立，法定代表人为肖冰，注册资本为1.2亿元，经营范围包含技术进出口；货物进出口；计算机软硬件及辅助设备批发；非居住房地产租赁；信息技术咨询服务等。企查查股权穿透显示，该公司由壁仞科技全资持股。（人民财讯）", "ctime": 1788239439, "time_str": "13:10:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260901/c679482540.shtml"}, {"id": "5076211", "title": "中际旭创港股涨超5%", "content": "中际旭创港股涨5.44%，报1084.00港元。", "ctime": 1788239373, "time_str": "13:09:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260901/c679482531.shtml"}, {"id": "5076207", "title": "CPO板块午后探底回升 青山纸业触及涨停", "content": "CPO板块午后探底回升，青山纸业触及涨停，则成电子、长盈通、天洋新材、中际旭创跟涨。", "ctime": 1788239368, "time_str": "13:09:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260901/c679482530.shtml"}, {"id": "5076141", "title": "火山引擎与芯朋微共创芯生态", "content": "8月31日，火山引擎华东大区通用行业负责人陈虔炜带队，火山引擎半导体行业解决方案负责人高思远等同行到访无锡芯朋微总部。双方围绕供应链合作、AI技术产业赋能及行业生态共建等议题展开深入交流，共同探索AI驱动半导体产业高质量发展的新路径。（人民财讯）", "ctime": 1788239127, "time_str": "13:05:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260901/c679482500.shtml"}, {"id": "5076129", "title": "华润新能源等成立新能源公司", "content": "企查查APP显示，近日，华润隆达新能源（锡林浩特）有限公司成立，法定代表人为王向前，经营范围包含风力发电技术服务；太阳能发电技术服务；储能技术服务；发电业务、输电业务、供（配）电业务。企查查股权穿透显示，该公司由华润新能源投资有限公司、锡林浩特市隆达能源有限责任公司共同持股。（人民财讯）", "ctime": 1788238997, "time_str": "13:03:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260901/c679482470.shtml"}, {"id": "5076051", "title": "首创期货：美伊冲突重启推动油价大涨，国内能化板块全线暴涨", "content": "美伊军事冲突时隔一个月后重启，霍尔木兹海峡航运安全成为市场核心交易主线，推动国际油价大幅跳涨，国内能化板块全线暴涨。当地时间8月31日，美军对霍尔木兹海峡伊朗拉拉克岛上的火箭发射装置实施精准打击，这是自7月29日大规模空袭后美军时隔一个月首次对伊朗发起军事行动，打破了双方数周的战场静默。美军中央司令部表示此次行动属于预防性防御打击，旨在保护全球商船通航安全。伊朗方面随即证实已向约旦境内美军基地发射弹道导弹实施反击。霍尔木兹海峡的通行状况成为影响油价的核心变量。调查显示，近期通过霍尔木兹海峡的石油流量已升至每天约700万至800万桶，较7月中旬的约400万桶/日显著上升，恢复至冲突前水平的四分之三左右，但整体上中东石油出口量仍明显低于战争爆发前水平。当前市场主要交易的是航运中断预期带来的风险溢价。原油的基本面强势具有确定性，但当前价格不宜追高。（首创期货）", "ctime": 1788238536, "time_str": "12:55:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260901/c679482406.shtml"}, {"id": "5076029", "title": "全球首艘32.5万吨甲醇双燃料矿砂船建造完工", "content": "9月1日上午，全球首艘32.5万载重吨甲醇双燃料矿砂船在江苏扬州建造完工并命名为“远海丝路”轮。该船搭载全球首套船舶数字化交付系统，标志着中国船舶工业在绿色动力与数字交付两大前沿领域实现新的突破。这艘巨轮由中远海运重工与上海船舶研究设计院联合设计，船长339.9米、型宽62米，载重量达32.5万吨。该船在建造过程中突破多项甲醇燃料应用关键技术，货舱舱容较传统同尺度矿砂船提升40%以上。据介绍，该船计划于今年10月投入运营，将为全球航运绿色智能转型提供“中国方案”，为大宗商品供应链稳定畅通提供更可靠的运力支撑。（央视新闻）", "ctime": 1788238270, "time_str": "12:51:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260901/c679482362.shtml"}, {"id": "5075977", "title": "研究：气候变化使儿童面临更多高温风险", "content": "东芬兰大学和比利时布鲁塞尔自由大学等机构完成的一项最新研究显示，全球40%以上的10岁以下儿童每年因人为造成的气候变化而多经历至少30天的危险高温。相关研究成果已发表在美国《科学进展》杂志上。东芬兰大学发布新闻公报介绍，研究团队聚焦湿热天气对各年龄段人群的影响，将人口数据与先进气候模型以及气候归因科学相结合。湿热比干热更危险，因为湿热会阻碍身体通过出汗降温，从而导致危险水平的热应激。（新华社）", "ctime": 1788237287, "time_str": "12:34:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260901/c679482187.shtml"}, {"id": "5075975", "title": "1—7月我国软件业务收入同比增长9.2%", "content": "记者从工业和信息化部了解到，2026年前7个月，我国软件和信息技术服务业运行态势良好，软件业务收入稳健增长，利润总额增势平稳，软件业务出口保持正增长。今年前7个月，我国软件业务收入89785亿元，同比增长9.2%；软件业利润总额超过万亿元，同比增长1.3%。软件业务出口406.1亿美元，同比增长12.2%。分领域运行情况显示，软件产品收入稳定增长。前7个月，软件产品收入占全行业收入比重为21.6%。信息技术服务收入继续保持两位数增长。今年1—7月，信息技术服务收入同比增长10%，占全行业收入的68.7%。（央视新闻）", "ctime": 1788237268, "time_str": "12:34:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260901/c679482180.shtml"}, {"id": "5075929", "title": "小鹏集团8月共交付新车39107辆，同比增长4%", "content": "小鹏集团8月共交付新车39107辆，同比增长4%。", "ctime": 1788236852, "time_str": "12:27:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260901/c679482119.shtml"}, {"id": "5075909", "title": "全国铁路暑运累计发送旅客9.54亿人次", "content": "记者1日从中国国家铁路集团有限公司获悉，8月31日，为期62天的铁路暑运圆满结束。7月1日至8月31日，全国铁路累计发送旅客9.54亿人次，国家铁路累计发送货物6.8亿吨，铁路运输安全平稳有序。国铁集团运输部负责人介绍，今年暑运，铁路部门在三季度列车运行图的基础上，同步实施暑期列车运行图，统筹用好武汉至西安高铁西安东至十堰东段、金华至建德高铁兰溪东至建德段等新线开通新增的运力资源，加大运力投放，全国铁路日均安排开行旅客列车11623列。与此同时，铁路部门积极适应暑期亲子游、研学游、红色游、康养游等市场需求，累计开行旅游列车699列，其中旅游专列415列、旅游专线284列，并精准对接各地赛事、展会、文艺演出活动安排，定制化开行“歌迷专列”“球迷专列”等351列，有效拉动沿线文旅消费，促进了服务消费扩能提质。（新华社）", "ctime": 1788236507, "time_str": "12:21:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260901/c679482061.shtml"}, {"id": "5075901", "title": "《微短剧发展管理办法》今起正式施行", "content": "国家广播电视总局日前公布的《微短剧发展管理办法》今天（9月1日）正式施行。这是我国首部针对微短剧领域的专项部门规章，法律效力层级高于此前行业指引类规范性文件。《微短剧发展管理办法》首次从国家层面搭建起覆盖创作、制作、播出、监管全链条的制度框架，标志着微短剧监管从阶段性引导转向制度化、法治化的长效治理，为行业健康繁荣发展划定边界、明确方向。《办法》核心确立分类分级管理机制，根据投资额度与题材属性，将微短剧划分为一类、二类、三类三个层级，对应不同的备案与审核要求。分类标准由广电总局制定，并结合行业发展实际适时动态调整。业内专家表示，这一分类监管思路，意味着不同体量、不同题材的微短剧将面临不同层级的审核标准，高投资、特殊题材的微短剧将适用更严格的审批流程。在分类管理的框架下，《办法》进一步对全链条内容规范与主体责任作出明确划定，筑牢行业合规底线。此外，《办法》规定，使用人工智能技术生成、制作的微短剧，制作机构和播出单位应当遵守国家有关规定，并依据有关规定在每集明显位置添加提示标识。这既是对观众知情权的保障，也是对AI内容创作的规范引导。（央视新闻）", "ctime": 1788236351, "time_str": "12:19:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260901/c679482041.shtml"}, {"id": "5075891", "title": "蔚来汽车：2026年8月交付35,836辆汽车，同比增长14.5%", "content": "蔚来汽车：2026年8月交付35,836辆汽车，同比增长14.5%。", "ctime": 1788236214, "time_str": "12:16:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260901/c679481906.shtml"}, {"id": "5075863", "title": "习近平出席上海合作组织成员国元首理事会第二十六次会议", "content": "当地时间9月1日上午，国家主席习近平在比什凯克出席上海合作组织成员国元首理事会第二十六次会议。(新华社)", "ctime": 1788235679, "time_str": "12:07:59", "stock_code": "", "st const SECTORS  = [{"name": "人工智能", "hit_count": 39, "etfs": []}, {"name": "金融", "hit_count": 36, "etfs": []}, {"name": "数据要素", "hit_count": 28, "etfs": []}, {"name": "消费", "hit_count": 19, "etfs": []}, {"name": "军工", "hit_count": 15, "etfs": []}, {"name": "半导体", "hit_count": 12, "etfs": []}, {"name": "地产", "hit_count": 10, "etfs": []}, {"name": "新能源", "hit_count": 9, "etfs": []}];
const META     = {"update_time": "2026-09-01 14:23:27", "sentiment_score": 62.39316239316239, "agents": []};

// 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },

      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
