ews.10jqka.com.cn/20260520/c676828412.shtml"}, {"id": "4384073", "title": "今年前四月国家铁路发送货物超13亿吨", "content": "记者20日从中国国家铁路集团有限公司获悉，今年1至4月份，国家铁路累计发送货物13.1亿吨，同比增长0.9%；日均装车18.38万车，同比增长2%，呈现量质齐升的良好态势。据介绍，国铁集团加快发展客车化班列和集装化运输，大力开行城际班列和专精特新、冷链定制化班列，进一步丰富铁路物流产品体系，为客户提供多样化选择，1至4月份国家铁路集装箱运量同比增长10.4%。（新华社）", "ctime": 1779253164, "time_str": "12:59:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260520/c676828330.shtml"}, {"id": "4384071", "title": "习近平：中俄关系进入更有作为、更快发展的新阶段", "content": "5月20日上午，国家主席习近平在北京人民大会堂同来华进行国事访问的俄罗斯总统普京举行会谈。\n\n习近平指出，近年来，面对变乱交织的国际形势，中俄两国坚持在平等相待、相互尊重、重信守义、合作共赢的基础上发展新时代全面战略协作伙伴关系，双方政治互信不断深化，经贸、投资、能源、科技、人文、地方等合作持续推进，民心相通更加牢固。中俄关系进入更有作为、更快发展的新阶段。", "ctime": 1779253145, "time_str": "12:59:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260520/c676828325.shtml"}, {"id": "4384069", "title": "罗欣药业：涉事批次产品发往黑龙江省时段正值夏季，推测高温导致产品有关物质指标异常", "content": "罗欣药业发布关于控股子公司山东罗欣药业集团股份有限公司产品注射用阿奇霉素情况说明的公告，近日，山东罗欣生产销售的注射用阿奇霉素（批号：524053043）在2025年黑龙江省药品监督抽检中被判定为“劣药”，山东省药品监督管理局依法对其作出行政处罚，罚没款合计186.84万元。事件发生后，山东罗欣启动召回程序，共计召回并封存现有库存产品609支。经自查，生产及留样环节符合规范，推测问题可能源于流通储运环节受极端高温影响。公司表示，对于本次事件诚恳接受批评、监督与指导，并采取停止生产和商业化该产品、对相关责任管理人员进行问责等整改措施。（界面新闻）", "ctime": 1779253124, "time_str": "12:58:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260520/c676828323.shtml"}, {"id": "4384067", "title": "哥伦比亚西南部发生无人机袭击，致1军官死亡6人受伤", "content": "当地时间5月19日，哥伦比亚西南部考卡省苏亚雷斯市农村地区发生一起无人机袭击事件，造成哥伦比亚国家陆军1名少尉死亡、6名军人受伤。据哥伦比亚国家陆军官方通报，一支正在当地执行军事行动的小队遭到疑似原反政府武装“哥伦比亚革命武装力量”分支组织利用无人机投掷爆炸物袭击。哥伦比亚陆军在声明中强烈谴责这种利用无人机无差别投放爆炸装置实施的恐怖袭击行为，并表示将继续在该地区开展持续军事行动，保护当地社区安全，打击活跃在周边地区的非法武装组织。（央视新闻）", "ctime": 1779253105, "time_str": "12:58:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260520/c676828312.shtml"}, {"id": "4384065", "title": "习近平同俄罗斯总统普京大范围会谈", "content": "5月20日，国家主席习近平在北京人民大会堂同来华进行国事访问的俄罗斯总统普京举行大范围会谈。(央视新闻)", "ctime": 1779253099, "time_str": "12:58:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260520/c676828307.shtml"}, {"id": "4384053", "title": "习近平同俄罗斯总统普京小范围会谈结束", "content": "5月20日，国家主席习近平在北京人民大会堂同来华进行国事访问的俄罗斯总统普京小范围会谈结束。(央视新闻)", "ctime": 1779252672, "time_str": "12:51:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260520/c676828229.shtml"}, {"id": "4384049", "title": "特朗普带记者参观白宫宴会厅工地 相关花费或飙升至14亿美元", "content": "美国总统特朗普19日带记者参观建设中的白宫新宴会厅，表示该建筑将具备强大安保能力，并称这是“送给美国的礼物”。特朗普政府近期推动追加10亿美元预算，用于包括新宴会厅在内的白宫园区“安保升级”。然而，该提案被质疑花费过高，遭到包括共和党人在内的不少人反对，能否顺利通过表决充满变数。白宫新宴会厅最初预算为2亿美元，此后不断上升，加上新增的安保预算，相关花费或高达14亿美元。（新华社）", "ctime": 1779252606, "time_str": "12:50:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260520/c676828213.shtml"}, {"id": "4384047", "title": "机构预测明晚过后国内成品油价格将上调", "content": "5月21日24时，国内成品油调价窗口将再度开启。第一财经记者从隆众资讯获悉，因本轮调价周期内国际原油价格先跌后涨，预计届时成品油价将迎年内第八次上涨。（第一财经）", "ctime": 1779252553, "time_str": "12:49:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260520/c676828198.shtml"}, {"id": "4384045", "title": "美国副总统万斯：美国不能充当“世界警察”", "content": "美国副总统万斯19日在白宫记者会上说，关于媒体报道美国最近取消本月向波兰部署一支4000多人美军部队的计划，“不是削减，而是一次例行轮换推迟”。万斯说，他认为这对欧洲而言“并非坏事”，实际上是“鼓励欧洲承担起更多的自主责任”。他说，美国不能充当“世界警察”，“且欧洲必须更多地依靠自身力量站稳脚跟。这将继续是我们的对欧政策”。万斯还说，这些美军人员可能会被派往欧洲其他地区，有关美国正在“大规模撤军”的说法并不准确，他认为许多欧洲媒体对此事反应“有些过度了”。（新华社）", "ctime": 1779252370, "time_str": "12:46:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260520/c676828159.shtml"}, {"id": "4384043", "title": "中国在世卫大会期间联合举办构建数智时代医疗卫生服务体系主题边会", "content": "第79届世界卫生大会18日在瑞士日内瓦开幕，中国同巴西、埃塞俄比亚、阿曼、秘鲁、南非、西班牙、坦桑尼亚、泰国当天在日内瓦万国宫联合举办“数智时代构建更加公平可及的医疗卫生服务体系——从愿景到实践”主题边会。世界卫生组织和相关国家代表、专家发言，近300名代表参会。中国国家卫生健康委主任雷海潮出席边会并发言。他指出，在世界百年未有之大变局加速演进大背景下，全球健康发展处于不确定难预料因素增多的时期，全球卫生治理需要加强和改善。中国政府坚持健康优先发展战略，从理念、规划、投入、要素保障和绩效产出上体现优先要求，加快建设健康中国，推进全民健康数智化建设和优质高效医疗卫生服务体系建设，努力推动卫生体系更加公平可及、系统连续、优质高效、富有韧性。（央视新闻）", "ctime": 1779252273, "time_str": "12:44:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260520/c676828099.shtml"}, {"id": "4384039", "title": "日本30年期国债收益率下跌11个基点至4.045%", "content": "日本30年期国债收益率下跌11个基点至4.045%。", "ctime": 1779252161, "time_str": "12:42:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260520/c676828073.shtml"}, {"id": "4384037", "title": "菲律宾一架小型飞机坠毁", "content": "总台记者获悉，当地时间5月20日上午，一架小型飞机在菲律宾本格特省坠毁。根据初步信息，机上载有2人，目前搜救工作正在进行当中。（央视新闻）", "ctime": 1779252151, "time_str": "12:42:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260520/c676828072.shtml"}, {"id": "4384035", "title": "普京访华俄方陪同人员前往欢迎仪式现场", "content": "5月20日上午，国家主席习近平在北京人民大会堂东门外广场举行仪式，欢迎俄罗斯总统普京访华。此次普京总统主要陪同人员有30人，包括5位副总理和8位部长。此外还有地方领导人，媒体负责人，教育界代表，大型企业、金融机构和社会团体负责人等30余人。(央视新闻)", "ctime": 1779252136, "time_str": "12:42:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260520/c676828064.shtml"}, {"id": "4384033", "title": "中国代表：在维持停火的基础上尽快重开霍尔木兹海峡", "content": "中国常驻联合国代表傅聪19日在安理会中东问题紧急公开会上发言，敦促各方保持克制、避免海湾紧张局势进一步升级。傅聪说，阿联酋巴拉卡核电站相关设施日前遭到无人机袭击，这一危险和不负责任的行动给国际社会拉响了警报。中方对事件深表关切。只要武装冲突不停息，其对地区核设施的安全风险就始终存在。当前中东战事的源起是美国和以色列对伊朗的非法武力袭击。这场战事本不该发生。早一点找到解决出路，对美伊双方有利，也对地区各国乃至整个世界有利。（新华社）", "ctime": 1779252118, "time_str": "12:41:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260520/c676828059.shtml"}, {"id": "4384031", "title": "利欧股份：未与宇树科技合作 亦未持有宇树科技股份", "content": "利欧股份5月20日在互动平台表示，公司未与宇树科技开展合作，亦未持有宇树科技股份。", "ctime": 1779252081, "time_str": "12:41:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260520/c676828051.shtml"}, {"id": "4384025", "title": "锐捷网络：1.6T LPO光模块、3.2T NPO光模块产品尚在研发中", "content": "锐捷网络5月20日在互动平台表示，目前，公司1.6T LPO光模块、3.2T NPO光模块产品尚在研发中，预计2026年内提供送样。", "ctime": 1779251983, "time_str": "12:39:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260520/c676828036.shtml"}, {"id": "4383989", "title": "谷歌推出“双子座全能”多模态生成模型", "content": "美国谷歌公司19日在年度开发者大会上宣布推出新一代多模态生成式人工智能模型“双子座全能”，首个发布版本为“双子座全能闪电”，可根据文本、图像、音频和视频等多种形式的输入生成视频内容，并支持用户用自然语言完成视频编辑。 谷歌在官方博客中说，“双子座全能”模型融合了推理能力与生成能力，是“能够通过任何输入形式生成任何内容”的新模型，目前优先应用于生成视频。 据谷歌介绍，“双子座全能闪电”已在“双子座”App、“谷歌流”人工智能工具和优兔短视频等平台上提供。 谷歌深层思维公司在官网发布公报说，尽管“双子座全能闪电”取得显著进展，但在编辑过程中保持完全一致性、生成复杂运动场景以及渲染完全准确的文字等方面仍面临挑战。(新华社)", "ctime": 1779251340, "time_str": "12:29:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260520/c676827904.shtml"}, {"id": "4383959", "title": "日本宫城县女川核电站2号机组恢复发电", "content": "东北电力公司20日宣布，在汽轮机厂房内水槽中曾检测出含有放射性物质的微量蒸汽、因而一度暂停反应堆的女川核电站2号机组目前已恢复发电。该机组自今年1月起处于定期检修中，该公司表示，原定于6月9日恢复商业运行的计划不受影响。女川核电站2号机组曾于本月14日开始发电，但15日确认到厂房内出现蒸汽，16日停止了反应堆运行。调查发现，原因是在连接汽轮机与水槽的阀门之间夹入金属碎片，导致阀门无法完全关闭。清除金属碎片后，于18日重新启动了反应堆。（央视新闻）", "ctime": 1779250883, "time_str": "12:21:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260520/c676827810.shtml"}, {"id": "4383947", "title": "阿里云发布为Agent而生的全新AI产品官网“千问云”，模型服务全面Skill、CLI化", "content": "在2026阿里云峰会上，阿里云发布为Agent而生的全新AI产品官网“千问云”（www.qianwenai.com），提供Qwen、GLM、Kimi、DeepSeek、Wan、HappyHorse等150多款主流模型API，并将模型服务的核心能力封装为Skills和CLI工具， // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>

    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],

    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
