, "ctime": 1792498559, "time_str": "20:15:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261020/c680897184.shtml"}, {"id": "5424785", "title": "华福证券任志强：统筹风险防范与金融改革开放", "content": "10月19日，2026金融街论坛年会开幕式在北京举办。中国人民银行行长潘功胜，国家金融监督管理总局局长丁向群，中国证监会主席吴清，中国人民银行副行长、国家外汇管理局局长朱鹤新等金融管理部门负责人出席开幕式并发表主题演讲。华福证券总裁助理兼研究所所长任志强接受采访表示，本次金融街论坛上，央行、金融监管总局、证监会、国家外汇管理局集中释放协同政策信号，整体坚持统筹发展和安全的主线。一方面，健全跨领域风险处置与流动性缓冲机制，稳妥化解重点领域风险，筑牢资本市场、债券市场风险防线，应对外部输入性与跨境联动风险。另一方面，同步推进资本市场制度改革、利率市场化深化、外汇便利化与跨境双向开放，通过引入长期资金、完善投融资生态、优化货币政策传导、便利企业跨境资金运作，持续提升金融市场韧性，更好服务实体经济、科创产业发展与“十五五”高质量发展大局。", "ctime": 1792498457, "time_str": "20:14:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261020/c680897139.shtml"}, {"id": "5424779", "title": "捷安高科：杜艳齐拟减持不超过0.2918%股份", "content": "捷安高科公告，股东杜艳齐持有公司股份492.32万股，占公司总股本2.3941%，拟自本公告披露之日起3个交易日后的3个月内，通过集中竞价方式减持不超过60万股，占公司总股本比例不超过0.2918%。此次减持原因为个人资金需求。", "ctime": 1792498306, "time_str": "20:11:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261020/c680897099.shtml"}, {"id": "5424775", "title": "国标拟新增自动驾驶系统标志灯要求 L2及以下禁用", "content": "工业和信息化部装备工业一司20日发布强制性国家标准《汽车及挂车外部照明和光信号装置的安装要求（征求意见稿）》，提出不具备L3级及以上自动驾驶系统的车辆，禁止安装自动驾驶系统标志灯（ADS标志灯）；同时增加了ADS标志灯专用的蓝绿色光色要求。ADS标志灯即向其他使用道路者表明车辆自动驾驶系统处于激活状态的灯具。根据征求意见稿，当激活L3级及以上自动驾驶功能时，所有ADS标志灯应同时自动点亮，且在自动驾驶系统处于激活状态时保持点亮；在车辆驾驶自动化系统处于L2级及以下自动驾驶功能时禁止点亮；当自动驾驶系统退出时，所有ADS标志灯应同时自动熄灭。（新华社）", "ctime": 1792498175, "time_str": "20:09:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261020/c680897053.shtml"}, {"id": "5424773", "title": "润建股份：股价异动期间AI、算力概念活跃，新业务收入占比较低", "content": "润建股份公告，2026年10月19日、2026年10月20日连续两个交易日收盘价格涨幅偏离值累计超过20%。公司称，近期资本市场对AI、算力等概念关注度较高，相关板块表现活跃；目前AI、算力、词元等业务占总营收比重仍较低，算力网络业务收入占比2025年为7.83%、2026年上半年为13.82%，新业务发展受技术迭代、市场环境及客户订单等因素影响，存在不确定性。此前披露的销售服务合同预计对公司2026年年度整体经营业绩不构成重大影响。", "ctime": 1792498104, "time_str": "20:08:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261020/c680897019.shtml"}, {"id": "5424771", "title": "通用汽车盘前跌幅扩大至8%", "content": "通用汽车盘前跌幅扩大至8%。", "ctime": 1792498087, "time_str": "20:08:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261020/c680897013.shtml"}, {"id": "5424745", "title": "天晟新材：2026年终止控股股东、实际控制人变更筹划", "content": "天晟新材公告，公司此前拟通过向特定对象发行A股股票及协议转让安排变更控股股东、实际控制人。公司于2026年10月19日经董事会审议通过终止2026年度向特定对象发行A股股票，因而终止筹划相关控股股东、实际控制人拟变更事项；截至公告披露日，公司无控股股东、无实际控制人。本次协议转让尚需通过深圳证券交易所合规性审核并办理过户手续。", "ctime": 1792497838, "time_str": "20:03:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261020/c680896922.shtml"}, {"id": "5424723", "title": "苹果公司将在未来三年内与Perryman共同承诺投入至多1亿美元", "content": "苹果公司将在未来三年内与Perryman共同承诺投入至多1亿美元。", "ctime": 1792497780, "time_str": "20:03:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261020/c680896894.shtml"}, {"id": "5424657", "title": "长江证券：首次回购公司股份452.29万股，成交价7.51元/股至7.64元/股，支付3413.81万元", "content": "长江证券公告，公司此前审议通过使用自有资金回购股份，资金总额不低于人民币1亿元（含）且不超过人民币2亿元（含），回购股份拟用于员工持股计划或股权激励；回购价格上限自2026年10月20日起由人民币14.01元/股（含）调整为人民币13.96元/股（含）。2026年10月20日，公司首次回购452.29万股，占公司总股本的0.08%，成交价为人民币7.51元/股至人民币7.64元/股，成交总金额为人民币3413.81万元（不含交易费用）。", "ctime": 1792497592, "time_str": "19:59:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261020/c680896765.shtml"}, {"id": "5424643", "title": "宁德时代：2026年第三季度净利润212.46亿元，同比增长14.54%", "content": "宁德时代公告，2026年第三季度营业收入1652.21亿元，同比增长58.58%；归母净利润212.46亿元，同比增长14.54%；扣非净利润188.62亿元，同比增长14.86%。2026年前三季度营业收入4421.37亿元，同比增长56.19%；归母净利润645.3亿元，同比增长31.60%；扣非净利润578.76亿元，同比增长32.68%。", "ctime": 1792497446, "time_str": "19:57:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261020/c680896743.shtml"}, {"id": "5424641", "title": "瑞银证券首席中国经济学家宋宇：经济增长修复，政策重心转向稳预期和稳增长", "content": "10月19日，证监会主席吴清在2026金融街论坛年会开幕式发表主旨讲话。瑞银证券首席中国经济学家宋宇认为，三季度GDP增速超出预期，实现全年4.5%左右增长的压力已经明显减轻。吴清近期讲话也释放出持续支持资本市场发展的政策信号。讲话重点强调了长期资金入市，这对中国经济和资本市场的发展都至关重要。科技创新融资有耐心资本才能实现长期发展，改革投资者考核机制是实现这一目标的关键之一。另外，很多潜在的长期资本在投资方面还受到了限制，放宽这些限制一方面可以提高市场的稳定性，另一方面也可以提高这些资金的回报。（人民财讯）", "ctime": 1792497417, "time_str": "19:56:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261020/c680896733.shtml"}, {"id": "5424635", "title": "俄总统新闻秘书：希望近期安排美总统特使与普京会面", "content": "俄罗斯总统新闻秘书佩斯科夫20日表示，希望近期可以安排美国总统特朗普的特使威特科夫与俄总统普京会面。佩斯科夫当天在例行记者会上谈到威特科夫近期在欧洲围绕乌克兰问题进行斡旋时说，希望美方尽快向俄方通报其斡旋沟通的情况。他同时强调，对俄方而言，与准备作出结束战争决策的乌克兰政权合法代表进行谈判至关重要。据美国方面19日消息，一名美国官员表示，威特科夫将于20日在挪威奥斯陆与乌克兰总统泽连斯基及其他欧洲领导人会晤。随后他计划前往俄罗斯，希望与普京会面并提交和平方案。（央视新闻）", "ctime": 1792497374, "time_str": "19:56:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261020/c680896726.shtml"}, {"id": "5424633", "title": "中色股份：中色哈萨克斯坦签署准备协议，涉及30万吨/年项目", "content": "中色股份公告，2024年6月3日，公司及控股子公司中色哈萨克斯坦与哈萨克斯坦矿业冶炼有限责任公司签署《哈萨克斯坦30万吨/年铜冶炼厂项目总协议》。2026年10月19日，中色哈萨克斯坦与业主签署《准备工作启动协议》，负责动员、勘测、场地准备及启动项目基本设计，协议最高金额45.21亿坚戈（不含增值税）。", "ctime": 1792497372, "time_str": "19:56:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261020/c680896725.shtml"}, {"id": "5424629", "title": "侨银股份：预中标安新县项目，金额约7731万元", "content": "侨银股份公告，公司近日预中标河北省保定市安新县农村环卫一体化项目，中标（成交）金额为7730.81万元/3年，项目运营年限3年。截至公告披露，公司尚未取得《中标通知书》，项目总金额及具体实施内容以正式合同为准。", "ctime": 1792497333, "time_str": "19:55:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261020/c680896658.shtml"}, {"id": "5424619", "title": "深圳宏芯宇电子股份有限公司通过港交所上市聆讯", "content": "据港交所文件：深圳宏芯宇电子股份有限公司通过港交所上市聆讯。", "ctime": 1792497229, "time_str": "19:53:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261020/c680896391.shtml"}, {"id": "5424607", "title": "10月20日 周二《新闻联播》要闻19条", "content": "1、习近平致信祝贺中央社会主义学院建院70周年强调 持续加强政治培训广泛凝聚政治共识 更好服务党和国家工作大局 王沪宁出席庆祝大会并讲话；\n2、央视快评：持续加强政治培训 广泛凝聚政治共识；\n3、【赓续长征精神 奋进复兴征程】传承红色血脉 打好实现建军一百年奋斗目标攻坚战；\n4、李强出席上海合作组织成员国政府首脑（总理）理事会第二十五次会议；\n5、李强会见伊朗第一副总统；\n6、李强会见白俄罗斯总理；\n7、丁薛祥在河北雄安新区出席国家数据集团有限公司成立大会并调研；\n8、【“十五五”开好局起好步】我国首次编制文化遗产保护传承五年规划；\n9、前三季度规模以上工业增加值同比增长5.3%；\n10、第140届广交会首期举办335场新品首发活动；\n11、南水北调东线启动2026—2027年度全线调水；\n12、今年三季度全国共1.92亿人次出入境；\n13、前三季度我国邮政行业寄递业务量同比增长3.7%；\n14、2026年秋招推出第二批就业服务活动；\n15、俄外长访问伊朗讨论地区局势等问题；\n16、也门胡塞武装称对沙特目标发动多次打击；\n17、美媒称美未批准向乌转让“爱国者”拦截弹；\n18、法国政府宣布多地实施宵禁；\n19、西班牙多地遭遇洪灾。（央视新闻）", "ctime": 1792497075, "time_str": "19:51:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261020/c680896155.shtml"}, {"id": "5424605", "title": "外媒：新质生产力持续释放助力中国经济增长", "content": "新质生产力正在成为中国经济增长的新引擎。近期，随着一系列创新技术和产业模式的不断涌现，中国经济展现出强劲的发展势头。外媒表示，中国政府积极推动科技自主创新，加强产业链供应链韧性，为经济高质量发展注入新动能。同时，消费升级、绿色转型等新趋势也为经济增长提供了新空间。（央视新闻）", "ctime": 1792497013, "time_str": "19:50:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261020/c680895912.shtml"}, {"id": "5424587", "title": "山东加力推进美丽中国省域先行区建设", "content": "10月20日，记者从山东省人民政府新闻办公室举行的省政府政策例行吹风会上了解到，近年来山东在产业绿色化、能源低碳化方面取得明显成果，有力推动美丽中国省域先行区建设。绿色低碳转型是美丽中国省域先行区建设的关键。山东省发展改革委副主任胡芳营介绍，山东精准管控“两高”、压减煤炭消费，“十四五”期间全部能源消费中煤炭占比已从61.1%下降至49.6%、下降了11.5个百分点，万元GDP能耗强度下降21.4%、高于国家激励目标5.9个百分点；重点行业先进产能占比超过40%，“十四五”期间全省高新技术产业产值占比由45.1%提升到55.7%，六大高耗能行业增加值占比从42%下降至39.7%。此外，山东绿色转型加力提速。目前全省30万千瓦及以下发电抽凝机组全部替代退出，胶东半岛核电、海上风电等大型清洁能源基地加快建设，去年一年发出2245.4亿度绿电、相当于减少二氧化碳排放1.8亿吨；截至今年9月底，非化石能源装机占比已达55.9%、比2020年提高25个百分点。（新华社）", "ctime": 1792496917, "time_str": "19:48:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261020/c680895870.shtml"}, {"id": "5424583", "title": "金龙汽车：福建省汽车工业集团有限公司增持1.01%，持股比例升至33.26%", "content": "金龙汽车公告，控股股东福建省汽车工业集团有限公司于2026年6月2日至10月20日通过集中竞价方式增持公司股份727.68万股，占公司已发行总股份的1.01%，持股比例由32.25%增至33.26%。本次增持为此前披露的增持计划实施事项，截至公告披露日，增持计划仍处于实施过程中。", "ctime": 1792496856, "time_str": "19:47:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261020/c680895815.shtml"}, {"id": "5424581", "title": "兆丰股份：兆聚智能预中标3亿元", "content": "兆丰股份公告，公司控股子公司浙江兆聚智能有限公司参与机器人创新服务平台项目公开招标，2026年10月20日被列为中标候选人，预中标价格为人民币3亿元，公示截止日期为2026年10月23日。截至公告披露日，项目尚处于中标候选人公示阶段，兆聚智能尚未收到中标通知书。", "ctime": 1792496850, "time_str": "19:47:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261020/c680895810.shtml"}, {"id": "5424573", "title": "精智达首个自建生产基地开工", "content": "据深圳龙华公众号消息，近日，精智达存储测试设备产业化智造项目正式开工。据介绍，这是精智达成立以来首个自建生产基地，也是企业定向增发募资投建的重点工程。精智达董事长张滨在开工仪式上表示，当前人工智能正推动半导体产业加速演进，测试正从量产验证环节向研发前端延伸，对测试设备企业的技术积累、工程转化效率和产业链协同能力提出了更高要求。公司将通过龙华基地进一步提升“研发—制造—全链条交付”效率，联合产业链伙伴突破关键瓶颈，保障设备稳定交付、支撑客户量产。", "ctime": 1792496767, "time_str": "19:46:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261020/c680895780.shtml"}, {"id": "5424501", "title": "平安证券：外资来华对本土券商既是压力也是参照系，本土机构立足点仍在深耕产业", "content": "10月19日，证监会主席吴清在2026金融街论坛年会开幕式讲话中提到，鼓励外资机构用好母公司专业能力和集团优势，进一步完善产品布局、参与创新业务，支持更多外资机构来华投资展业。平安证券表示，外资机构来华展业，对本土券商而言既是压力，也是参照系。2026年6月陆家嘴论坛上，证监会明确提出积极支持外资在华新设独资、合资证券基金期货机构，同时强调“开正门、堵偏门”，开放与安全统筹兼顾。2026金融街论坛年会进一步鼓励其完善产品布局、参与创新业务。外资带来的不只是资金，更有产品设计、风控体系与跨境服务的体系化成熟经验，财富管理、衍生品、跨境投行这些需要加快补强的环节会因此提速。在平安证券看来，本土券商应对 // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
