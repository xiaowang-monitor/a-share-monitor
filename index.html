4330883", "title": "首创期货：美伊有望进入新一轮谈判，油价暴跌", "content": "美国总统特朗普6日多次对能否同伊朗达成协议表示乐观，称美伊过去24小时内进行了“富有成效”的对话，最终达成协议“很有可能”。特朗普当天在白宫进行的一场活动中对媒体说，伊朗现在“迫切想要达成协议”，如果真能达成，那“他们就绝不能拥有核武器”。伊朗方面表示，正在“评估”华盛顿提出的14点和平方案。巴基斯坦方面称，美国和伊朗通过巴基斯坦进行的谈判似乎已显现希望，“低调的谈判有望转化为切实的成果”。随后，美国总统特朗普再度放狠话称，如果伊朗不同意协议，轰炸就会开始。原油市场依旧是以伊朗局势影响为主，新一轮谈判值得关注，但仍有变数，操作上不推荐。（首创期货）", "ctime": 1778132091, "time_str": "13:34:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260507/c676503115.shtml"}, {"id": "4330801", "title": "伊拉克空军空袭“伊斯兰国”据点", "content": "伊拉克联合行动指挥部下属安全媒体中心6日发表声明说，伊空军当天在北部基尔库克省山区实施两次空袭，打死3名极端组织“伊斯兰国”武装分子，并摧毁其藏匿据点。\n\n声明说，根据军事情报部门提供的精确信息，在连续三天监视和跟踪后，伊空军6日下午成功实施两次打击。空袭摧毁了两处“伊斯兰国”据点，并击毙3名武装分子。\n\n声明强调，伊拉克安全部队将继续推进清剿行动，彻底消除其残余势力，确保国家安全稳定。\n\n伊拉克政府2017年12月宣布打击“伊斯兰国”的行动取得胜利。此后，“伊斯兰国”残余势力主要在伊拉克偏远农村地区流窜，不时发动袭击。(新华社)", "ctime": 1778131839, "time_str": "13:30:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260507/c676503053.shtml"}, {"id": "4330745", "title": "AI应用概念股短线拉升，易点天下涨超10%", "content": "AI应用概念股短线拉升，易点天下涨超10%，引力传媒涨超7%，蓝色光标、浙文互联、天龙集团跟涨。", "ctime": 1778131744, "time_str": "13:29:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260507/c676503038.shtml"}, {"id": "4330737", "title": "上海：试点AI辅助评标和智慧监管", "content": "上海市政府副秘书长、上海市发展改革委主任刘健在5月7日举行的上海市新闻发布会上表示，今年将继续开展优化营商环境“十大攻坚突破任务”。其中，优化中小企业融资服务，重点建设全市统一的融资增信平台“随申融”，提升融资服务中心能级，规范融资中介服务。规范招投标和政府采购，重点是制定本国产品标准政策实施细则，完善异常低价甄别处置机制，试点AI辅助评标和智慧监管。", "ctime": 1778131599, "time_str": "13:26:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260507/c676503009.shtml"}, {"id": "4330735", "title": "沪深京三市成交额超2.3万亿元，较上日此时缩量727亿元", "content": "据同花顺iFinD数据，沪深京三市成交额超2.3万亿元，较上日此时缩量727亿元，预计全天成交金额约3.1万亿元。截至目前，沪市成交额9939亿元，深市成交额12880亿元，北证50成交额185亿元。", "ctime": 1778131598, "time_str": "13:26:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260507/c676503008.shtml"}, {"id": "4330707", "title": "港股锂电池板块震荡走低，天齐锂业跌超5%", "content": "港股锂电池板块震荡走低，天齐锂业跌超5%，赣锋锂业跌超4%，中创新航、中国铝业跟跌。", "ctime": 1778131241, "time_str": "13:20:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260507/c676502927.shtml"}, {"id": "4330699", "title": "半导体板块午后持续走高，华虹公司涨超10%创新高", "content": "半导体板块午后持续走高，华虹公司涨超10%创新高，澜起科技、阿石创、诚邦股份、裕太微涨幅居前。", "ctime": 1778131134, "time_str": "13:18:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260507/c676502900.shtml"}, {"id": "4330655", "title": "韩国前总理韩德洙因参与内乱重要任务等罪名二审被判15年", "content": "韩国前国务总理韩德洙7日因参与内乱重要任务等罪名二审被判有期徒刑15年，相比一审判决的23年刑期减少8年。 首尔高等法院当天上午就韩德洙涉嫌参与内乱重要任务等罪名作出判决。二审判决与一审相同，认定韩德洙的大部分主要罪名成立。 法院认为，为制造“2024年12月3日紧急戒严令的宣布经过了国务委员审议程序”的表象，韩德洙曾建议召开国务会议，并在戒严宣布后试图让国务委员们在相关文件上签字，因此构成参与内乱重要任务罪。 法院还认定韩德洙与韩国前行政安全部长官李祥敏讨论了封锁主要机构及对媒体实施断水断电的方案，同样构成参与内乱重要任务罪。法院同时认定韩德洙制造虚假公文、违反“总统档案法”、作伪证等罪行。 2024年12月3日晚，韩国时任总统尹锡悦以铲除“从北势力”为由发布紧急戒严令。次日凌晨，韩国国会通过要求解除戒严令的决议案。此后，尹锡悦先后被停职、逮捕、弹劾，目前其所涉案件也在审理中。2025年8月，韩国负责调查紧急戒严事件的特检组以涉嫌协助内乱、制造虚假公文、损坏公共文件、作伪证等罪名对韩德洙提起公诉。今年1月21日，首尔中央地方法院一审判处韩德洙有期徒刑23年。韩德洙方随后提起上诉。(新华社)", "ctime": 1778130646, "time_str": "13:10:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260507/c676502748.shtml"}, {"id": "4330653", "title": "科创50指数涨幅扩大至1%", "content": "科创50指数涨幅扩大至1%，现报1673.63点。", "ctime": 1778130643, "time_str": "13:10:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260507/c676502747.shtml"}, {"id": "4330647", "title": "新易盛成交额达200亿元", "content": "新易盛成交额达200亿元，现涨7.51%。", "ctime": 1778130630, "time_str": "13: 74%。", "ctime": 1778130053, "time_str": "13:00:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260507/c676502605.shtml"}, {"id": "4330469", "title": "沪深京三市成交额超2万亿元，较上日此时缩量939亿元", "content": "据同花顺iFinD数据，沪深京三市成交额超2万亿元，较上日此时缩量939亿元，预计全天成交金额约3.1万亿元。截至目前，沪市成交额8666亿元，深市成交额11238亿元，北证50成交额168亿元。", "ctime": 1778130045, "time_str": "13:00:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260507/c676502602.shtml"}, {"id": "4330449", "title": "“中国天眼”这一关键部件，已实现国产化", "content": "记者今天（5月7日）从中国科学院国家天文台获悉，近日，国家重大科技基础设施——500米口径球面射电望远镜（FAST）将更换6根总长近4000米、单根重达6吨多的巨型钢丝绳，更换工作预计持续到今年6月下旬。据了解，“中国天眼”的馈源舱重达30吨，6根钢丝绳需要牵引馈源舱在140米的高空、206米尺度范围内实现实时定位。每根钢丝绳每天平均要承受数百次弯曲和脉冲载荷。这种工况对钢丝绳的疲劳寿命提出了极端要求，5年不断丝才能更好地保障望远镜的高效运行。“中国天眼”从2016年落成启用至今，钢丝绳一直使用的是进口产品，2021年曾进行过一次更换。（央视新闻）", "ctime": 1778129937, "time_str": "12:58:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260507/c676502574.shtml"}, {"id": "4330447", "title": "日本日经225指数首次突破63000点", "content": "日本日经225指数首次突破63000点，日内涨超6%。", "ctime": 1778129929, "time_str": "12:58:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260507/c676502573.shtml"}, {"id": "4330445", "title": "“手机中的战斗机”两连板，波导股份回应存储涨价冲击", "content": "波导股份实现两连板，截至午盘报5.59元/股，涨幅达10.04%。对此，波导股份工作人员向以投资者身份咨询的记者表示，公司股价可能受市场整体情绪及公司刚刚“脱帽”的利好因素影响。目前，存储涨价已对公司业务产生一定影响，但具体影响程度及应对措施暂无法详细答复，后续需以公司官方公告为准。(21财经)", "ctime": 1778129915, "time_str": "12:58:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260507/c676502572.shtml"}, {"id": "4330443", "title": "巴基斯坦总理：美伊谈判将很快转化为持久和平", "content": "巴基斯坦总理夏巴兹6日表示，巴方促成美伊临时停火并主办伊斯兰堡会谈，这场会谈是“历史性进展”，相信美伊谈判将很快转化为持久和平。\n\n夏巴兹当天在巴首都伊斯兰堡出席一场会议时说：“巴基斯坦将继续进行外交努力结束冲突，推动地区和平，战争和动荡不符合该地区任何国家的利益。”\n\n他同时表示，美伊双方沟通渠道一直保持畅通，并对中国、沙特阿拉伯和土耳其在推动调解、缓和局势以及促进谈判方面发挥的建设性作用表示赞赏。\n\n巴基斯坦副总理兼外交部长达尔当天在会上表示，伊朗正努力促成和美国之间的直接谈判，“巴基斯坦现在的努力方向是使停火成为永久性的”。(新华社)", "ctime": 1778129845, "time_str": "12:57:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260507/c676502552.shtml"}, {"id": "4330439", "title": "科技赋能“西电东送”特高压通道全面检修", "content": "近日，±800千伏特高压宾金线完成全面检修。在浙江衢州，国网衢州供电公司工作人员正通过无人机四机联吊技术运输物资。此次吊运物资总重5.6吨，按以往单机吊运需要28架次，通过四联吊运只需要8架次便可完成，使得运输效率大大提升，也为重型物资运输提供了全新解决方案。（新华社）", "ctime": 1778129681, "time_str": "12:54:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260507/c676502513.shtml"}, {"id": "4330437", "title": "8天累计发送旅客1.59亿人次 铁路“五一”假期运输收官", "content": "记者从中国国家铁路集团有限公司获悉，4月29日至5月6日铁路“五一”假期运输期间，全国铁路累计发送旅客1.59亿人次，同比增长5.2%，其中，5月1日发送旅客2484.4万人次，创单日旅客发送量历史新高；国家铁路累计发送货物9350万吨，同比增长4.5%，5月2日装车20.24万车，创国家铁路单日装车历史新高。（央视新闻）", "ctime": 1778129580, "time_str": "12:53:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260507/c676502484.shtml"}, {"id": "4330433", "title": "广深港高铁“五一”假期运送跨境旅客59.6万人次", "content": "广深港高铁在今年“五一”假期（5月1日至5日）持续高位运行。数据显示，假期5天运送跨境旅客59.6万人次，日均客流11.9万人次。其中，内地往香港方向旅客达34万人次，香港往内地旅客达25.6万人次，“双向奔赴”态势明显。（人民财讯）", "ctime": 1778129528, "time_str": "12:52:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260507/c676502469.shtml"}, {"id": "4330431", "title": "上交所：景顺长城全球半导体芯片产业股票型证券投资基金（QDII-LOF）临时停牌", "content": "上交所发布通知，根据景顺长城基金管理有限公司申请，本所于2026年5月7日盘中即时起至收市暂停景顺长城全球半导体芯片产业股票型证券投资基金（QDII-LOF）（证券代码：501225）交易业务。", "ctime": 1778129520, "time_str": "12:52:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260507/c676502467.shtml"}, {"id": "4330403", // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
