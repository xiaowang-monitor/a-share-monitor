e": "优必选、常州国资等成立科技公司 注册资本5000万元", "content": "企查查APP显示，近日，常州常高新智采科技有限公司成立，法定代表人为徐理翔，注册资本为5000万元，经营范围包含：数据处理服务；数据处理和存储支持服务；大数据服务；人工智能基础资源与技术平台；智能机器人的研发等。企查查股权穿透显示，该公司由优必选、常州高新数运科技有限公司等共同持股。（人民财讯）", "ctime": 1787641828, "time_str": "15:10:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260825/c679261090.shtml"}, {"id": "5020767", "title": "第二十六届投洽会将于9月8日至11日在厦门举行", "content": "今天（8月23日），国务院新闻办公室举行新闻发布会，商务部介绍，第二十六届中国国际投资贸易洽谈会将于9月8日至11日在福建厦门举行，目前各项筹备工作已基本就绪。（央视新闻）", "ctime": 1787641809, "time_str": "15:10:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260825/c679261087.shtml"}, {"id": "5020757", "title": "韩国杠杆ETF热度降温，出现10亿美元资金流出", "content": "随着市场对人工智能交易行情的投资热情消退，叠加监管机构出台举措抑制相关投资需求，韩国挂钩芯片企业的杠杆ETF本月出现近10亿美元资金流出。数据显示，8月截至目前，挂钩三星电子的杠杆产品资金流出3.81亿美元，跟踪SK海力士的同类产品流出6.01亿美元。这是该类产品自5月末上市以来首次出现月度资金净流出。这类产品目标是放大芯片企业个股两倍的日间涨跌幅，被认为加剧了大盘整体波动。尤其是7月全球AI板块遭遇抛售，韩国综合指数出现22%的历史性大跌。此后，韩国监管机构提高了新投资者的最低入金门槛，还强制要求投资者完成为期五天的模拟交易。（新浪）", "ctime": 1787641719, "time_str": "15:08:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260825/c679261041.shtml"}, {"id": "5020737", "title": "广汽冯兴亚时隔一年再访华为任正非", "content": "8月25日，广汽集团董事长冯兴亚发文称，昨日与团队赴深圳再次拜访华为创始人任正非，上一次双方见面是去年的6月。此次双方围绕下一代汽车产品路径以及双方合作机制深化等议题展开，主要涉及智能化的深度合作，比如L3级别有条件自动驾驶、全新产品定义形态等。目前，广汽与华为合作的启境首款车型GT7已经上市，第二款车型启境GX7将于下个月上市。（第一财经）", "ctime": 1787641558, "time_str": "15:05:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260825/c679260970.shtml"}, {"id": "5020717", "title": "A股年内第10次成交额不足2万亿元", "content": "A股年内第10次成交额不足2万亿元，今日成交额仅18443亿元，较上一日缩量1769亿元。", "ctime": 1787641473, "time_str": "15:04:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.co 和元生物、金石亚药跟涨。贵金属板块大幅走弱，西部黄金、招金黄金跌超7%，湖南白银、兴业银锡、晓程科技跟跌。能源金属震荡走弱，盛新锂能、永兴材料、融捷股份跌超6%，赣锋锂业、永杉锂业跟跌。", "ctime": 1787641322, "time_str": "15:02:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260825/c679260875.shtml"}, {"id": "5020647", "title": "股指期货午盘收盘 主力合约全线收涨", "content": "股指期货午盘收盘，主力合约全线收涨。沪深300股指期货(IF)主力合约涨0.20%，上证50股指期货(IH)主力合约涨0.25%，中证500股指期货(IC)主力合约涨0.68%，中证1000股指期货(IM)主力合约涨1.10%。", "ctime": 1787641269, "time_str": "15:01:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260825/c679260855.shtml"}, {"id": "5020629", "title": "内塔尼亚胡：伊朗想杀我儿子，差点得手", "content": "以色列总理内塔尼亚胡24日接受以色列第14频道电视台采访时声称，伊朗曾“试图暗杀他的一个儿子”。内塔尼亚胡没有提供更多细节。内塔尼亚胡有两个儿子，他在采访中没有透露哪一个成为所谓暗杀目标，亦未指明所谓暗杀企图的性质和时间。《以色列时报》报道说，即使内塔尼亚胡在今年晚些时候举行的大选中落败，以国家安全总局（辛贝特）也会为内塔尼亚胡及其家庭成员提供至少5年的安全保护。以色列第12频道电视台报道称，过去几个月来，有关伊朗企图暗杀内塔尼亚胡儿子的信息一直受到以军方的审查封禁。（新华社）", "ctime": 1787641227, "time_str": "15:00:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260825/c679260838.shtml"}, {"id": "5020623", "title": "期货收评：碳酸锂暴跌6%！矿山复产引爆供给过剩恐慌", "content": "期货收评：截至收盘，大宗商品涨跌不一，涨幅方面，纯苯、对二甲苯、短纤涨近2%；跌幅方面，碳酸锂跌6%，欧线集运、PVC、低硫燃油跌超2%。", "ctime": 1787641222, "time_str": "15:00:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260825/c679260837.shtml"}, {"id": "5020613", "title": "广期所碳酸锂主力合约大跌6%", "content": "广期所碳酸锂主力合约大跌6%，报150360元/吨。", "ctime": 1787641202, "time_str": "15:00:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260825/c679260830.shtml"}, {"id": "5020607", "title": "外交部提醒中国公民暂勿前往斯威士兰", "content": "当前，斯威士兰安全形势复杂，电诈网赌犯罪活动猖獗，社会治安等风险极高。外交部和中国驻南非使领馆提醒中国公民近期暂勿前往斯威士兰，已在当地中国公民和机构请尽快撤离或转移至南非等相对安全区域，密切关注局势发展，加强安全防范和应急准备。如遇紧急情况，请及时报警并与中国驻南非使领馆联系寻求协助。执意前往或驻留人员将面临极高安全风险，并影响获得协助的时效。（新华社）", "ctime": 1787641183, "time_str": "14:59:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260825/c679260825.shtml"}, {"id": "5020597", "title": "蔚能电池在武汉成立新能源技术公司 注册资本2.53亿", "content": "天眼查App显示，近日，蔚恒壹号（武汉）新能源技术有限公司成立，法定代表人为虞琼，注册资本2.53亿元，经营范围含储能技术服务、蓄电池租赁、电动汽车充电基础设施运营、电池销售、资源再生利用技术研发等，由武汉蔚能电池资产有限公司全资持股。（界面新闻）", "ctime": 1787641100, "time_str": "14:58:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260825/c679260806.shtml"}, {"id": "5020583", "title": "北斗规模应用宣传媒体圆桌会在京召开", "content": "工业和信息化部办公厅、电子信息司8月24日在北京组织召开北斗规模应用宣传媒体圆桌会，明确宣传引导相关要求和工作重点，交流北斗规模应用工作成效，回应媒体关切，加快推动宣传引导工作落地见效。会议强调，要坚持以新时代北斗精神为引领，立足产业发展实际，紧扣规模应用主线，统筹中央媒体、行业媒体、地方宣传力量，既要讲技术突破、产业成就，更要讲落地场景、实际效益，客观务实展现北斗发展成果，凝聚全社会支持北斗规模应用的共识。下一步，工业和信息化部将与各专业媒体深化协同合作，扎实开展北斗宣传推广工作，共同讲好北斗创新发展故事，促进北斗社会影响力持续提升。（工信部）", "ctime": 1787640927, "time_str": "14:55:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260825/c679260759.shtml"}, {"id": "5020563", "title": "晶升股份自主研发大尺寸CVD SiC涂层成套设备完成交付", "content": "近日，晶升股份自主研发的大尺寸CVD SiC化学气相沉积涂层成套设备完成整机出厂检验，正式装车发运交付客户，标志着公司在大尺寸碳化硅涂层工艺装备领域取得重要进展，为半导体热场关键部件的国产化制造提供了有力支撑。(人民财讯)", "ctime": 1787640738, "time_str": "14:52:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260825/c679260718.shtml"}, {"id": "5020537", "title": "南向资金净卖出超50亿港元", "content": "据同花顺iFinD数据，截至目前，南向资金净卖出超50亿港元，其中港股通（沪）卖出超35.68亿港元，港股通（深）卖出超14.50亿港元。", "ctime": 1787640518, "time_str": "14:48:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260825/c679260663.shtml"}, {"id": "5020525", "title": "新疆能源监管办约谈12家市场异常行为发电企业", "content": "近期，新疆能源监管办对12家存在市场异常行为的发电企业开展集体约谈，重点纠治经济持留、串通报价、违反市场规则等突出问题，全力维护公平公正、规范有序的电力市场运行秩序。约谈会上，新疆能源监管办集中宣贯了《电力市场异常行为监测与处置工作指引》，明晰电力市场交易合规标准与处置规范，通报了近期市场监测排查发现的各类电力市场异常行为，明确了后续整改工作要求。会议强调，相关发电企业要正视问题、立行立改，全面开展内部核查，深挖问题根源、厘清责任链条，确保问题整改见底清零，杜绝同类问题重复发生。会议要求，相关发电企业要对照相关工作指引开展全流程自查自纠，全面排查量价申报、合同执行、结算履约等环节风险隐患，补齐制度和管理短板，坚持标本兼治，将合规交易要求融入日常业务全过程，持续规范电力市场交易行为，守牢电力市场交易合规底线。（国家能源局）", "ctime": 1787640420, "time_str": "14:47:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260825/c679260620.shtml"}, {"id": "5020499", "title": "香港恒生指数、恒生科技指数双双转涨", "content": "恒生科技指数涨0.11%，报4599.27点，香港恒生指数涨0.01%，报25518.94点。", "ctime": 1787640214, "time_str": "14:43:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260825/c679260535.shtml"}, {"id": "5020477", "title": "美对伊朗武装力量高级官员发布悬赏", "content": "在加大对伊朗制裁之际，美国政府24日发布最高1000万美元的悬赏，征集有关伊朗伊斯兰革命卫队总司令艾哈迈德·瓦希迪等伊朗武装力量高级官员的线索。 根据美国国务院网站发布的消息，美方本次发布的悬赏对象共计5人，除了瓦希迪外，还包括伊朗武装部队总参谋长阿里·阿卜杜拉希、革命卫队无人机司令部司令赛义德·阿加贾尼等。目前美方最新的相关悬赏单上共有14人。 今年3月13日，美方悬赏征集伊朗最高领袖穆杰塔巴·哈梅内伊以及伊朗军政高官的情报线索。 伊朗伊斯兰共和国军队总司令哈塔米8月中旬宣布，任何伊朗人抓捕或杀死一名美国“侵略者”，将获得由“伊朗人民”提供的3万美元奖励。(新华社)", "ctime": 1787639849, "time_str": "14:37:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260825/c679260417.shtml"}, {"id": "5020469", "title": "安克创新新设通用设备公司 含多项AI业务", "content": "企查查APP显示，近日，深圳市安克宝盈通用设备有限责任公司成立，经营范围包含：可穿戴智能设备制造；智能机器人的研发；人工智能应用软件开发；人工智能理论与算法软件开发；人工智能硬件销售等。企查查股权穿透显示，该公司由安克创新全资持股。（人民财讯）", "ctime": 1787639800, "time_str": "14:36:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260825/c679260408.shtml"}, {"id": "5020459", "title": "凌志软件中标某头部基金公司2026年洞察型智能CRM平台建设项目", "content": "近日，凌志软件成功中标某头部基金公司2026年洞察型智能CRM平台建设项目。项目将围绕客户洞察、服务运营与投顾陪伴等核心场景，建设面向AI的原子化、接口化能力底座，并对接客户侧智能体平台，助力头部基金公司打造可经营、可编排、可审计的洞察型智能CRM平台。(人民财讯)", "ctime": 1787639757, "time_str": "14:35:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260825/c679260389.shtml"}, {"id": "5020455", "title": "工业和信息化部绿色低碳标准化技术委员会成立", "content": "为进一步发挥标准对推动工业绿色低碳发展的支撑和引领作用，工业和信息化部绿色低碳标准化技术委员会（以下简称“绿标委”）成立，第一届绿标委由来自政府部门、部属单位、科研院所、高校、行业协会及龙头企业的71名委员组成，秘书处设在中国电子技术标准化研究院。近日，绿标委审议通过了章程、秘书处工作细则、标准制修订工作程序等制度文件，推动绿标委工作制度化、规范化运行。下一步，绿标委将深入贯彻落实部标准化工作领导小组会议精神，统筹协调各行业标准化机构，加强节能降碳、节水减排、清洁生产、资源综合利用、绿色制造等领域标准预研、制修订工作，加大标准宣贯力度。(工信部)", "ctime": 1787639694, "time_str": "14:34:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260825/c679260360.shtml"}, {"id": "5020427", "title": "日韩股市集体收涨", "content": "日经225指数收涨0.50%，报65856.43点。韩国综指收涨0.68%，报6742.73点。", "ctime": 1787639497, "time_str": "14:31:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260825/c679260281.shtml"}, {"id": "5020335", "title": "民调：伊朗战事拖累特朗普支持率创新低", "content": "一项最新民调结果显示，仅约三成美国人支持美国对伊朗战事，为战事爆发以来最低水平。受此影响，美国总统特朗普的支持率也创历史新低。按路透社说法，伊朗战事持续拖累特朗普的支持率。仅33%的受访者认可这位共和党籍总统的工作表现，是这一联合民调在特朗普两届总统任期内记录到的最低水平。民意正给共和党今年的国会中期选举选情造成压力。当被问及如果立即举行中期选举，他们将投票给谁时，受访的独立选民中，33%倾向支持民主党籍国会议员候选人，19%倾向支持共和党籍候选人。（新华社）", "ctime": 1787639052, "time_str": "14:24:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260825/c679260146.shtml"}, {"id": "5020311", "title": "安集科技在武汉成立微电子科技公司", "content": "企查查APP显示，近日，武汉安集微电子科技有限公司成立，经营范围包含：技术服务、技术开发、技术咨询、技术交流、技术转让、技术推广。企查查股权穿透显示，该公司由安集科技全资持股。（人民财讯）", "ctime": 1787638519, "time_str": "14:15:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260825/c679259937.shtml"}, {"id": "5020299", "title": "科力远在天津成立新能源发展公司", "content": "企查查APP显示，近日，科力远新能源发展（天津）有限公司成立，经营范围包含：储能技术服务；合同能源管理；碳减排、碳转化、 const META     = {"update_time": "2026-08-25 15:25:14", "sentiment_score": 51.875, "agents": []};

// 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
