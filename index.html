.shtml"}, {"id": "4224855", "title": "群核科技结束招股 券商统计获千倍超额认购", "content": "4月14日，“杭州六小龙”之一群核科技（Manycore）港股IPO申购正式收官。券商数据显示，群核科技此次公开发售获约1071倍的超额认购，融资申购额达1312亿港元，成为近期港股AI板块又一焦点新股。该股将于4月17日正式登陆港交所，正式成为“全球空间智能第一股”,股票代码为00068.HK。本次港股IPO，群核科技计划全球发售约1.61亿股，其中香港发售1606.2万股，国际发售1.45亿股，分别占全球发售股份总数的10%和90%，另有约15%超额配股权。本次发行每股定价最高为7.62港元，预计总募资额不超过12.27亿港元，摩根大通和建银国际担任联席保荐人。群核科技本次全球发售引入泰康人寿、阳光人寿、广发基金、Redwood、Mirae Asset、雾凇资本、Hesai HK、国惠香港、华营建筑等作为基石投资者。基石阵容覆盖了顶级长线险资、头部公募基金、专业私募投资机构、国际资管机构、产业龙头等，多元化机构合计认购约4.55亿港元。（人民财讯）", "ctime": 1776163685, "time_str": "18:48:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260414/c675983154.shtml"}, {"id": "4224853", "title": "两部门发文加大进出口信贷支持力度", "content": "记者14日从商务部获悉，商务部、中国进出口银行近日印发《关于强化进出口信贷支持服务“十五五”商务高质量发展良好开局的通知》，旨在加大进出口信贷支持力度，加快推动商务高质量发展。 聚焦进一步发挥政策性金融机构作用，通知提出推动贸易创新发展、拓展双向投资合作空间、推动共建“一带一路”高质量发展等三方面具体举措。 推动贸易创新发展方面，通知明确围绕开拓多元化市场、培育外贸新动能、推动进出口平衡发展，用足用好进出口信贷工具，丰富完善适配新业态新模式的产品服务，做好全链条进口服务保障。 拓展双向投资合作空间方面，通知明确从更大力度吸引和利用外资、推动产业链供应链国际合作、支持高水平开放平台建设三方面提出细化举措，支持进出口银行深度融入和服务扩大高水平对外开放，提供综合性金融服务。 推动共建“一带一路”高质量发展方面，通知明确支持进出口银行聚焦共建“一带一路”多双边经贸合作重点领域，统筹做好重大标志性项目和“小而美”民生项目金融服务，推动人民币跨境使用，强化投融资服务保障。 根据通知要求，各地商务主管部门和进出口银行各分行要加强政策衔接、工作对接和信息共享，在符合世贸组织规则前提下，探索强化财政金融与商务协同效应，聚焦外经贸主体、进出口环节、产供链国际合作等，提供更加精准、高效、有力的金融服务。(新华社)", "ctime": 1776163655, "time_str": "18:47:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260414/c675983125.shtml"}, {"id": "4224851", "title": "福日电子：2025年净利润亏损4850.57万元", "content": "福日电子公告，2025年营业收入138.88亿元，同比上升30.52%。归属于上市公司股东的净利润为-4850.57万元，同比减亏。母公司净利润为-3.16亿元。本期支付股利1185.98万元。2025年合并报表中，归属于母公司所有者的净利润为-4850.57万元，期末归属于母公司所有者的未分配利润为-12.9亿元。", "ctime": 1776163640, "time_str": "18:47:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260414/c675983120.shtml"}, {"id": "4224845", "title": "兆新股份：2025年净利润4258.77万元，同比增长129.71%", "content": "兆新股份公告，2025年营业收入4.97亿元，同比增长43.40%。净利润4258.77万元，同比增长129.71%。公司计划2025年度不派发现金红利，不送红股，不以公积金转增股本。", "ctime": 1776163530, "time_str": "18:45:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260414/c675983082.shtml"}, {"id": "4224831", "title": "报告：需求降温叠加供给高位，多尺寸电视面板价格趋稳", "content": "CINNO Research报告显示，今年3月，受国际体育赛事及“618”促销节日备货的影响，LCD TV面板短期需求维持高位，但由于整体供应较2月更为宽松，多数尺寸面板价格虽进入上涨通道，但涨幅已开始收窄。进入4月，国内“618”备货需求持续释放，短期热度延续；然而，受品牌厂商提前备货及芯片涨价带来的成本压力影响，二季度整体需求已呈现降温态势。综合判断，预计3月中下旬面板价格将延续分化走势：65”、75”等大尺寸产品仍将维持小幅上涨，其余主流尺寸面板价格或将逐步趋稳。（人民财讯）", "ctime": 1776163358, "time_str": "18:42:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260414/c675983031.shtml"}, {"id": "4224803", "title": "华立科技：2025年净利润6904.59万元，同比下降18.44%", "content": "华立科技公告，2025年营业收入9.97亿元，同比下降1.99%。净利润6904.59万元，同比下降18.44%。公司董事会审议通过的利润分配预案为：以1.54亿为基数，向全体股东每10股派发现金红利1.5元（含税），送红股0股（含税），以资本公积金向全体股东每10股转增0股。", "ctime": 1776163190, "time_str": "18:39:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260414/c675982984.shtml"}, {"id": "4224801", "title": "中密控股：使用自有资金5000万元投资设立全资子公司", "content": "中密控股公告，公司于2026年4月13日召开第六届董事会第九次会议，审议通过了《关于公司投资设立全资子公司的议案》。根据公司国际化战略发展规划及经营管理需要，公司拟使用自有资金人民币5000万元投资设立全资子公司中密国际有限公司，出资金额占其注册资本的100%。", "ctime": 1776163182, "time_str": "18:39:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260414/c675982981.shtml"}, {"id": "4224799", "title": "中密控股：2025年净利润3.85亿元，同比下降1.80%", "content": "中密控股公告，2025年营业收入17.69亿元，同比增长12.91%。净利润3.85亿元，同比下降1.80%。公司董事会审议通过的利润分配预案为：以公司实施2025年度权益分派时的股权登记日总股本为基数，向全体股东每10股派发现金红利5元（含税），送红股0股（含税），以资本公积金向全体股东每10股转增0股。", "ctime": 1776163176, "time_str": "18:39:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260414/c675982980.shtml"}, {"id": "4224795", "title": "2026年国家智能制造标准化总体组和专家咨询组全体会议在京召开", "content": "4月14日，2026年国家智能制造标准化总体组和专家咨询组全体会议在北京召开。工业和信息化部党组成员、副部长辛国斌，国家市场监督管理总局党组成员、副局长邓志勇出席会议并致辞。辛国斌指出，近年来，我国以智能制造为主攻方向，在应用深化、产业培育和标准体系完善方面协同发力，制造业智能化水平显著提升，有力支撑了制造强国建设。“十五五”时期，要深入贯彻落实党中央、国务院决策部署，以智能制造标准化工作为重要支撑，加快发展新一代智能制造。要健全组织体系，完善标准顶层设计，加快凝练新一代智能制造系统架构和标准体系；要强化项目牵引，优化标准供给结构，推动标准与装备系统协同攻关；要突出应用导向，依托智能工厂梯度培育等工作，推动标准规模化应用；要深化国际合作，拓展多双边合作机制，持续提升国际话语权和影响力。会上公布了新一届国家智能制造标准化协调推进组、总体组和专家咨询组成员名单，并向专家咨询组成员颁发了聘书。工业和信息化部、国家发展改革委、市场监管总局、中国工程院等协调推进组成员，总体组和专家咨询组代表等150余人参加会议。(工信部)", "ctime": 1776163091, "time_str": "18:38:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260414/c675982936.shtml"}, {"id": "4224793", "title": "摩根大通美股盘前跌近3%", "content": "摩根大通美股盘前跌近3%，此前直线拉升近1.5%。消息面上，摩根大通第一季度收入498.36亿美元，市场预期为491.69亿美元，高于市场预期。摩根大通料财年净利息收入约1030亿美元，原估约1045亿美元，低于市场预期。", "ctime": 1776163071, "time_str": "18:37:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260414/c675982935.shtml"}, {"id": "4224791", "title": "高德红外：2025年净利润6.86亿元 同比扭亏为盈", "content": "高德红外公告，2025年营业收入46.19亿元，同比增长72.50%。净利润6.86亿元，较2024年净亏损4.47亿元实现扭亏为盈。公司计划不派发现金红利，不送红股，不以公积金转增股本。", "ctime": 1776163068, "time_str": "18:37:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260414/c675982933.shtml"}, {"id": "4224789", "title": "北新路桥修正2025年度业绩预告 预计扣非净利润为亏损1.1亿元至1.55亿元", "content": "北新路桥发布2025年度业绩预告修正公告，预计扣非净利润为亏损1.1亿元至1.55亿元。公司原预计扣非净利润为亏损1.6亿元至2.2亿元。公司表示，本次业绩预告修正系因在2025年度财务审计过程中，发现公司投资的高速公路项目在政府优惠政策的会计处理与确认环节存在偏差，原预计的政府补贴事项应确认为工程相关收入。", "ctime": 1776163045, "time_str": "18:37:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260414/c675982922.shtml"}, {"id": "4224785", "title": "摩根大通第一季度收入498.36亿美元，市场预期为491.69亿美元", "content": "摩根大通第一季度收入498.36亿美元，市场预期为491.69亿美元；第一季度每股收益5.94美元；第一季度净利润164.94亿美元。", "ctime": 1776162990, "time_str": "18:36:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260414/c675982905.shtml"}, {"id": "4224779", "title": "网宿科技：2025年净利润8亿元，同比增长18.53%", "content": "网宿科技公告，2025年营业收入46.61亿元，同比下降5.50%。净利润8亿元，同比增长18.53%。公司董事会审议通过的利润分配预案为：以公司现有总股本24.59亿股为基数，向全体股东每10股派发现金红利2.5元（含税）。", "ctime": 1776162966, "time_str": "18:36:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260414/c675982886.shtml"}, {"id": "4224775", "title": "新疆开行全国首趟“雪莲速运”棉布班列", "content": "4月14日，一列满载1300吨优质棉布的货运班列从新疆喀什北站驶出，开往山东潍坊西站，这是全国首趟“雪莲速运”棉布班列，为南疆纺织工业品出疆新增一条高效稳定的常态化铁路物流通道。本次班列采用时速120公里的快速直达模式，将棉布出疆运输时效从以往的8天压缩至3天左右，大幅降低纺织企业综合物流成本。今年以来，新疆铁路部门深入实施“稳大宗、增白货”战略，打造“雪莲速运”特色货运体系，4月铁路调图后，相关棉纺班列线路已增至7条。截至目前，新疆铁路已累计运输棉花、棉纺制品71.8万吨，同比大幅增长137%。下一步，新疆铁路计划每周固定开行一列“雪莲速运”棉布班列，推动形成常态化、规模化开行模式，助力新疆棉纺产业高质量发展，全面赋能乡村振兴。（央视新闻）", "ctime": 1776162949, "time_str": "18:35:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260414/c675982878.shtml"}, {"id": "4224773", "title": "中顺洁柔：2025年净利润3.19亿元，同比增长312.80%", "content": "中顺洁柔公告，2025年营业收入87.8亿元，同比增长7.72%。净利润3.19亿元，同比增长312.80%。公司董事会审议通过的利润分配预案为：向全体股东每10股派发现金红利0.41元（含税）。", "ctime": 1776162933, "time_str": "18:35:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260414/c675982873.shtml"}, {"id": "4224767", "title": "顺威股份：2025年净利润7972.3万元，同比增长47.21%", "content": "顺威股份公告，2025年营业收入29.01亿元，同比增长7.56%。净利润7972.3万元，同比增长47.21%。公司经本次董事会审议通过的利润分配预案为：以7.2亿股为基数，向全体股东每10股派发现金红利0.1元（含税），送红股0股（含税），不以公积金转增股本。", "ctime": 1776162810, "time_str": "18:33:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260414/c675982796.shtml"}, {"id": "4224749", "title": "海南机场：控股子公司与控股股东签订资产租赁合同", "content": "海南机场公告，控股子公司三亚凤凰国际机场有限责任公司与控股股东海南机场集团签订资产租赁合同，租赁三亚凤凰机场T3航站楼等相关资产，租赁年限为3年，租赁金额合计约3.07亿元（含税）。交易构成关联交易，但未构成重大资产重组。公司董事会已审议通过该议案，关联董事回避表决。交易旨在提升机场运营业务保障能力和服务水平，有利于公司聚焦主业，提升核心竞争力。", "ctime": 1776162748, "time_str": "18:32:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260414/c675982756.shtml"}, {"id": "4224747", "title": "海南机场：3月旅客吞吐量552.79万人次，同比增长14.09%", "content": "海南机场公告，3月起降架次35186架次，同比增长8.84%，累计10.49万架次，同比增长1.57%；旅客吞吐量552.79万人次，同比增长14.09%，累计1699.41万人次，同比增长5.17%；货邮吞吐量37287吨，同比增长5.86%，累计11.48万吨，同比增长11.63%。", "ctime": 1776162725, "time_str": "18:32:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260414/c675982750.shtml"}, {"id": "4224713", "title": "闽东电力：预计2026年第一季度净亏损2400万元–3000万元", "content": "闽东电力公告，预计2026年第一季度归属于上市公司股东的净亏损为2400万元–3000万元，上年同期为盈利1123.89万元。扣除非经常性损益后的净亏损为2600万元-3200万元，上年同期为盈利470.5万元。本报告期宁德市区域内降水量较上年同期减少，水力发、售电量较上年同期减少；本报告期收到的财产保险理赔款较上年同期减少。", "ctime": 1776162589, "time_str": "18:29:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260414/c675982624.shtml"}, {"id": "4224711", "title": "濮阳惠成：预计2026年第一季度净利润同比下降40.00%～55.00%", "content": "濮阳惠成公告，预计2026年第一季度净利润为1629.77万元～2173.02万元，同比下降40.00%～55.00%。报告期内，受汇率波动影响，公司一季度预计产生汇兑损失约1765万元，该损失将对当期净利润产生直接负面影响。同时，2026年3月以来，受国际地缘政治局势影响，顺酐酸酐衍生物主要原材料价格出现显著上涨，直接推高了生产成本，导致企业盈利空间受到挤压。", "ctime": 1776162578, "time_str": "18:29:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260414/c675982621.shtml"}, {"id": "4224709", "title": "瑞丰高材：2025年净利润3033.24万元，同比增长37.40%", "content": "瑞丰高材公告，2025年营业收入为19.69亿元，同比下降1.59%；净利润为3033.24万元，同比增长37.40%。公司董事会审议通过的利润分配预案为：以2.51亿股为基数，向全体股东每10股派发现金红利1元（含税），送红股0股（含税），以资本公积金向全体股东每10股转增0股。", "ctime": 1776162572, "time_str": "18:29:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260414/c675982619.shtml"}, {"id": "4224707", "title": "瑞丰高材：一季度净利润2023.54万元，同比增长282.99%", "content": "瑞丰高材公告，2026年第一季度营收为5.22亿元，同比增长10.13%；净利润为2023.54万元，同比增长282.99%。", "ctime": 1776162566, "time_str": "18:29:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260414/c675982616.shtml"}, {"id": "4224683", "title": "和仁科技：2025年净利润4766.42万元，同比增长21.29%", "content": "和仁科技公告，2025年营业收入4.35亿元，同比增长7.15%。净利润4766.42万元，同比增长21.29%。拟向全体股东每10股派发现金红利0.3元（含税）。", "ctime": 1776162492, "time_str": "18:28:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260414/c675982590.shtml"}, {"id": "4224681", "title": "和仁科技：2026年第一季度净利润亏损918.55万元", "content": "和仁科技公告，2026年第一季度营业收入7601.55万元，同比下降3.04%。净利润亏损918.55万元，上年同期亏损384.41万元。", "ctime": 1776162487, "time_str": "18:28:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260414/c675982589.shtml"}, {"id": "4224679", "title": "长春高新：子公司伏欣奇拜单抗注射液获批开展临床试验", "content": "长春高新公告，子公司金赛药业伏欣奇拜单抗注射液境内生产药品注册临床试验申请获得国家药品监督管理局批准。伏欣奇拜单抗是金赛药业研发的全人源抗白介素-1β（IL-1β）单抗，拟用于治疗非感染性葡萄膜炎（NIU）。该药品有望为难治性非感染性葡萄膜炎患者提供更优且持久的治疗选择。此前，伏欣奇拜单抗注射液（水剂）已获批开展子宫内膜异位症的临床试验，其用于急性痛风性关节炎适应症的上市申请已于2025年1月获得受理；注射用伏欣奇拜单抗（粉剂）已获批开展用于结缔组织病相关的间质性肺病(CTD-ILD）、全身型幼年特发性关节炎（sJIA）适应症的临床试验，其用于急性痛风性关节炎适应症已在2025年6月30日获批上市。", "ctime": 1776162476, "time_str": "18:27:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260414/c675982585.shtml"}, {"id": "4224677", "title": "意大利总理说暂停自动续签与以色列的防务协议", "content": "据意大利媒体报道，意大利总理梅洛尼14日说，考虑到当前局势，意大利政府“已决定暂停自动续签与以色列的防务协议”。(新华社)", "ctime": 1776162410, "time_str": "18:26:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260414/c675982563.shtml"}, {"id": "4224675", "title": "高德将发布首款四足机器人", "content": "高德相关负责人对记者独家表示：“我们已在具身智能领域开展深入布局，连续公布多款具身模型，并积极探索四足机器人、人形机器人等硬件产品形态，预计近期将发布首款四足机器人。”（科创板日报）", "ctime": 1776162398, "time_str": "18:26:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260414/c675982558.shtml"}, {"id": "4224673", "title": "创业板ETF纳入基金投顾 超20家券商火速部署", "content": "创业板改革方案最新提到，支持基金投顾配置创业板ETF。据记者调研，已有超20家具备资格的券商第一时间响应，全面评估制度改革影响，个别券商起草方案与启动技术改造相关工作。包括中信证券、国泰海通、中金财富、东方证券、山西证券、国联民生、光大证券、华西证券等券商正推进筹备工作。从推进情况来看，券商重点在于技术预判，并围绕投顾策略适配、场内交易风控、系统对接改造等核心环节提早布局，确保业务落地后实现合规稳健运营。（财联社）", "ctime": 1776162340, "time_str": "18:25:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260414/c675982545.shtml"}, {"id": "4224671", "title": "ST司特：2025年净利润1.81亿元，同比下降39.92%", "content": "ST司特发布业绩快报，2025年度营业总收入46.62亿元，同比增长8.87%。净利润1.81亿元，同比下降39.92%。报告期内，公司积极通过拓展渠道、优化服务进一步开拓市场，磷复肥产品销量实现增长并带动营业收入有所提升，同时原材料价格大幅上升，导致磷复肥板块毛利率较同期呈下降趋势；公司控股子公司贵州路发实业有限公司明泥湾磷矿可采储资源余量降低，采矿量及销售量下降，公司营利能力受到一定程度的影响。", "ctime": 1776162338, "time_str": "18:25:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260414/c675982544.shtml"}, {"id": "4224669", "title": "ST司特：预计2026年第一季度净利润同比增长78.22%～109.67%", "content": "ST司特公告，预计2026年第一季度净利润为6800万元至8000万元，同比增长78.22%～109.67%。公司2026年第一季度业绩增长的主要原因：报告期内国内农业用肥需求刚性集中释放，公司主要磷复肥产品销量同比显著增加；受全球供应偏紧，地缘冲突扰动，原材料成本上行等原因，报告期主要化肥产品市场均价同比大幅提升，公司产品售价同步上涨，毛利率显著改善。", "ctime": 1776162330, "time_str": "18:25:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260414/c67598 const META     = {"update_time": "2026-04-14 18:53:18", "sentiment_score": 52.97872340425532, "agents": []};

// 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

        <p class="text-xs text-gray-500 mono">${item.symbol}</p>

      <span class="text-xs text-gray-400">${item.mentions}次提及</span>

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图

    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
