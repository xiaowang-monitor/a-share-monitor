": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260806/c678716704.shtml"}, {"id": "4898203", "title": "全球芯片LOF：将于8月6日下午开市起停牌至当日收市", "content": "景顺长城基金管理有限公司公告，近期旗下景顺长城全球半导体芯片产业股票型证券投资基金（QDII-LOF）（场内简称：全球芯片，扩位简称：全球芯片LOF，交易代码：501225）二级市场交易价格明显高于基金份额净值，出现较大幅度溢价。2026年8月6日中午收盘，本基金二级市场的收盘价为4.000元，截至2026年8月4日，本基金基金份额净值为3.0485元。特此郑重提醒广大投资者，应密切关注二级市场交易价格溢价风险，审慎做出投资决策，如盲目投资，后续可能遭受重大损失。为保护投资者利益，本基金将于2026年8月6日下午开市起停牌至当日收市，停牌期间本基金赎回业务照常办理。", "ctime": 1785989254, "time_str": "12:07:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260806/c678716630.shtml"}, {"id": "4898197", "title": "港股午评：恒生指数跌1.75%，恒生科技指数跌1.87%", "content": "港股午间收盘，恒生指数跌1.75%，恒生科技指数跌1.87%。恒指港股通ETF银华（159318）跌1.95%，港股通科技ETF鹏华（159751）跌2.06%。板块方面，计算机存储设备、焦炭加工Ⅲ板块涨幅靠前；可选消费经销Ⅳ、可选消费经销Ⅲ板块跌幅靠前。个股方面，MINIMAX-W涨16.15%，沪上阿姨涨10.75%，维立志博-B涨8.18%，胜宏科技涨7.69%，晋景新能涨6.84%；真健康医疗-B跌20.35%，友邦保险跌8.75%，友邦保险-R跌8.55%，首钢朗泽跌7.64%，长光辰芯跌7.6%。", "ctime": 1785989145, "time_str": "12:05:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260806/c678716571.shtml"}, {"id": "4898149", "title": "超研股份：公司积极开拓核电行业无损检测应用市场", "content": "超研股份8月6日在互动平台表示，公司研制的便携式、在线式超声成像检测设备和爬壁超声检测机器人等无损检测设备可用于核电设备生产制造和在役运行的质量检测控制中，公司积极开拓核电行业无损检测应用市场。", "ctime": 1785988393, "time_str": "11:53:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260806/c678716248.shtml"}, {"id": "4898143", "title": "科兴冻干人用狂犬病疫苗获药品注册证书", "content": "8月6日，北京科兴控股（集团）有限公司旗下科兴（成都）生物制品有限公司研制的冻干人用狂犬病疫苗（Vero细胞）获得国家药品监督管理局颁发的《药品注册证书》。该疫苗基于无血清、无动物源性工艺开发，同时获批“5针法”和“简易4针法”两种免疫程序，成为国内首个符合WHO推荐简易4针法的无血清狂犬病疫苗。（人民财讯）", "ctime": 1785988240, "time_str": "11:50:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260806/c678716210.shtml"}, {"id": "4898139", "title": "8月6日午间公告一览：温州宏丰定增申请获深交所受理", "content": "温州宏丰公告，公司于2026年8月5日收到深圳证券交易所出具的《关于受理温州宏丰电工合金股份有限公司向特定对象发行股票申请文件的通知》，深交所认为申请文件齐备，决定予以受理。该事项尚需通过深交所审核并获中国证监会同意注册后方可实施。", "ctime": 1785987937, "time_str": "11:45:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260806/c678716107.shtml"}, {"id": "4898137", "title": "万科组织架构再“瘦身”：办公事业部解散，事业部缩减至7个", "content": "8月6日上午消息，万科正式撤销办公事业部。调整后，公司事业部数量由8个缩减至7个。据知情人士透露，办公事业部撤销后，各个项目并入各自城市公司，事业部负责人卢冰转任中航万科负责人，事业部部分员工转岗至城市公司，部分员工按优化方案获赔离职。目前，万科官网组织架构资料也已作出更新。对此调整，截至发稿，万科方面暂无官方回应。（新浪财经）", "ctime": 1785987794, "time_str": "11:43:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260806/c678716048.shtml"}, {"id": "4898135", "title": "全国13条河流维持超警 最大超警幅度1.28米", "content": "今天上午，水利部举行会商，分析研判全国的防汛形势，目前全国13条河流仍维持超警。截至今天9时，黑龙江、内蒙古、陕西、河北、云南等地13条河流仍维持超警，最大超警幅度1.28米。据预报，8月6日至8日，受降雨影响，浙江曹娥江支流新昌江、陕西渭河支流滈河、海南南渡江支流南叉河、云南澜沧江支流南阿河等河流可能发生超警洪水。受上游来水影响，松花江干流及支流呼兰河、黑龙江干流同江江段将维持超警。水利部提醒暴雨洪水影响地区社会公众注意防范。（央视新闻）", "ctime": 1785987748, "time_str": "11:42:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260806/c678716038.shtml"}, {"id": "4898129", "title": "贝恩资本宣布收购茶饮品牌贡茶", "content": "当地时间8月5日，贝恩资本宣布，已同意从TA Associates及贡茶全球（Gong cha Global）其他股东手中收购茶饮品牌贡茶。交易财务条款未披露。交易预计于2026年第四季度完成，须满足惯常交割条件。贡茶2006年成立于中国台湾地区，现总部位于英国，目前在33个市场经营近2200家门店。（界面新闻）", "ctime": 1785987483, "time_str": "11:38:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260806/c678715879.shtml"}, {"id": "4898123", "title": "是否追究金容范引入杠杆ETF责任？青瓦台：应优先关注市场并采取对策", "content": "韩国总统府公共关系和沟通高级秘书成基鸿6日回应了外界要求就推出单一股票杠杆ETF一事追究总统办公室政策室长金容范责任的呼声。他表示：“目前更重要的是密切关注市场，并制定相应对策。”成基鸿当天在接受采访时表示：“房地产市场和股票市场都存在较高波动性，对民生的影响也非常大，”并还补充道，“总统府全体官员都正在细致审视每一种情况，并研究如何制定相关措施。”（第一财经）", "ctime": 1785987280, "time_str": "11:34:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260806/c678715696.shtml"}, {"id": "4898121", "title": "ETF两市成交额报3550.73亿元，较昨日此时缩量17.66亿元", "content": "截至目前，ETF两市成交额报3550.73亿元，较昨日此时缩量17.66亿元，分类型来看，股票型ETF成交额1315.93亿元，债券型ETF成交额1546.37亿元，货币型ETF成交额96.62亿元，商品型ETF成交额103.44亿元，QDII型ETF成交额488.38亿元。", "ctime": 1785987143, "time_str": "11:32:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260806/c678715613.shtml"}, {"id": "4898111", "title": "A股午评：创业板指冲高回落跌0.67%，贵金属、煤炭开采加工板块涨幅居前", "content": "A股三大指数早盘涨跌不一，截至午盘，上证指数涨0.01%，深证成指跌0.52%，创业板指跌0.67%，北证50跌0.38%，科创50指数跌0.16%。全市场成交额17651亿元，较上日放量626亿元，全市场超3700只个股下跌。板块题材上，电子化学品、贵金属、煤炭开采加工、元件、通信设备板块涨幅居前；教育、汽车整车、电力、证券、港口航运板块跌幅居前。盘面上，贵金属板块高开低走，涨幅收窄，招金黄金涨超5%，山金国际、西部黄金、兴业银锡涨幅居前。电子化学品板块低开高走，江化微涨停，中巨芯盘中触及20cm涨停，宏和科技、华特气体、中船特气涨幅居前。煤炭开采加工板块震荡走高，昊华能源涨停，淮北矿业、晋控煤业、潞安环能涨幅居前。教育板块集体回调，凯文教育、中公教育领跌板块，全通教育、传智教育、昂立教育跌幅居前。汽车整车板块持续走低，北汽蓝谷、众泰汽车、江淮汽车跌幅居前。", "ctime": 1785987059, "time_str": "11:30:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260806/c678715580.shtml"}, {"id": "4898109", "title": "ETF午评：煤炭ETF领涨3.32%，标普油气ETF领跌2.95%", "content": "ETF午间收盘涨跌不一，煤炭ETF（515220）领涨3.32%，黄金ETF（159812）涨2.27%，科创半导体ETF（588170）涨2.21%，标普油气ETF（159518）领跌2.95%，标普油气ETF（513350）跌2.71%，港股通非银ETF（513750）跌2.63%。", "ctime": 1785987054, "time_str": "11:30:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260806/c678715576.shtml"}, {"id": "4898107", "title": "国内多家金店金饰价格集体上涨，最高报1299元/克", "content": "据同花顺iFinD数据，今日国内黄金饰品价格对比显示，黄金珠宝品牌公布的境内足金首饰价格较昨日集体上涨，最高报1299元/克。", "ctime": 1785987031, "time_str": "11:30:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260806/c678715568.shtml"}, {"id": "4898105", "title": "股指期货早盘收盘 主力合约多数下跌", "content": "股指期货早盘收盘，主力合约多数下跌。沪深300股指期货(IF)主力合约跌0.43%，上证50股指期货(IH)主力合约跌0.36%，中证500股指期货(IC)主力合约跌0.35%，中证1000股指期货(IM)主力合约涨0.08%。", "ctime": 1785987025, "time_str": "11:30:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260806/c678715564.shtml"}, {"id": "4898085", "title": "粮食概念板块短线拉升，金健米业涨停", "content": "粮食概念板块短线拉升，金健米业涨停，神农种业、秋乐种业、京粮控股、新赛股份、敦煌种业等纷纷走高。", "ctime": 1785986844, "time_str": "11:27:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260806/c678715400.shtml"}, {"id": "4898069", "title": "瑞萨电子将展出具身智能机器人解决方案", "content": "Renesas（瑞萨电子）宣布，将携多款面向具身智能、工业机器人、服务机器人及AI开发平台的解决方案，首次亮相中国具身智能机器人产业大会暨展览会，包括传感器融合灵巧手、机器人关节、9轴电机控制、永磁同步马达控制解决方案，以及基于瑞萨RAA2P3226双路电涡流位置传感器的机器人关节编码器。（人民财讯）", "ctime": 1785986513, "time_str": "11:21:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260806/c678715220.shtml"}, {"id": "4898061", "title": "电魂网络成立动漫公司", "content": "企查查APP显示，近日，深圳漫魂幻新动漫有限公司成立，法定代表人为刘玉杰，经营范围包含：电子产品销售；皮革制品销售；玩具、动漫及游艺用品销售；动漫游戏开发；品牌管理；工业设计服务等。企查查股权穿透显示，该公司由电魂网络旗下上海漫魂幻新策划设计有限公司全资持股。", "ctime": 1785986381, "time_str": "11:19:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260806/c678715137.shtml"}, {"id": "4898057", "title": "第二批稳定币牌照国庆前后发放？香港金管局：不评论市场传闻 持开放而谨慎态度", "content": "近期有市场消息称，随着首批稳定币发行人推进测试和业务准备，香港稳定币发行或进一步提速，第二批稳定币发行人牌照或存在于国庆前后落地的可能性。针对上述市场传闻，香港金管局发言人今日复函称，不对市场传闻做出评论，但对是否增发稳定币发行人牌照以及时间安排，金管局持开放而谨慎的态度，现阶段未有明确倾向。该发言人进一步表示，目前金管局的工作重点，是推进两家持牌稳定币发行人开展业务准备，并在其成功发行合规稳定币后，观察相关应用场景落地、营运成效以及市场反应等情况。至于未来是否增发牌照，需要综合考虑多方面因素，包括申请是否符合发牌要求、市场对稳定币的需求、实际应用情况，以及国际层面的发展趋势和监管讨论等。（财联社）", "ctime": 1785986332, "time_str": "11:18:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260806/c678715115.shtml"}, {"id": "4898055", "title": "港股恒生科技指数跌幅达2%", "content": "港股恒生科技指数跌幅扩大至2%，恒生指数现跌1.86%。友邦保险跌超8%，保诚、富卫集团跌超5%，新华保险、阳光保险跌超2%。", "ctime": 1785986153, "time_str": "11:15:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260806/c678714954.shtml"}, {"id": "4898053", "title": "部分产品根据相关投资者下达的投资指令投资运作，长兴万乘私募基金被出具警示函", "content": "8月6日，浙江证监局网站发布关于对长兴万乘私募基金管理有限公司采取出具警示函措施的决定。经查，该公司在开展私募基金业务中存在公司部分产品根据相关投资者下达的投资指令进行投资运作的问题。上述行为违反了《私募投资基金监督管理暂行办法》第四条第一款的规定。根据《私募投资基金监督管理暂行办法》第三十三条的规定，浙江证监局决定对该公司采取出具警示函的监督管理措施，并记入证券期货市场诚信档案。（界面新闻）", "ctime": 1785986138, "time_str": "11:15:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260806/c678714947.shtml"}, {"id": "4898049", "title": "聚焦“AI+IT”赛道 雄安人工智能实训基地正式投运", "content": "雄安新区首届人工智能实训班今日开班，标志着雄安人工智能实训基地正式投运。该基地占地约53亩、建筑面积7万平方米，是服务北京非首都功能疏解、支撑雄安新区人工智能产业高质量发展的重点公共服务平台。基地采用“运营公司+实训基地+人才学院”三位一体模式，联动多家头部企业，打造全链条认证与赛训体系，覆盖从基础技能到高端研发的全层级人才培养。未来，雄安人工智能实训基地将致力于为智能经济时代培育更多AI实战型人才。（央视新闻）", "ctime": 1785985970, "time_str": "11:12:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260806/c678714846.shtml"}, {"id": "4898045", "title": "医药商业板块直线拉升，人民同泰、合富中国双双涨停", "content": "医药商业板块直线拉升，人民同泰、合富中国双双涨停，药易购涨超15%，开开实业、建发致新、塞力医疗、华人健康跟涨。", "ctime": 1785985883, "time_str": "11:11:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260806/c678714797.shtml"}, {"id": "4898043", "title": "我国首座抗17级台风高技术难度浮式风电平台投运", "content": "中国海油8月6日宣布，我国自主设计建造的首座16兆瓦张力腿深远海浮式风电平台“海油安澜号”成功接入陆丰油田电网并直供绿电。平台按可抵御17级台风极端工况设计建造，其投运标志着我国深远海浮式风电装备技术走向世界前列，为我国海上风电开发探索新路线。“海油安澜号”安装于珠江口盆地海域，安装位置水深136米、离岸136公里。整体高度近110层楼高，总重7800吨，扫风面积相当于7.5个标准足球场， 论表示，“十五五”规划将6G纳入未来产业重点发展方向，无疑是夯实下一代通信技术优势，以及开拓经济增长新赛道的战略部署。今年以来，我国6G产业发展提速，由地面网络、卫星互联网及低空飞行器融合的网络体系正在加速构建。据预测，到2035年，随着6G规模化商用，我国有望培育形成万亿元级的6G产业及应用市场，成为数字经济的核心底层支撑。6G不是简单的技术迭代，更是千行百业数字化转型的“底座”和“引擎”。张平院士表示，社会各行各业运转，都离不开信息和数据的传输与交换。作为通用底层技术，6G将同步推动数字产业化和产业数字化，打通通信、感知、控制一体化协同，无论是作为新兴产业的低空经济、自动驾驶、智慧农业，还是传统的医疗民生、文化娱乐……都将被深度赋能。（央视财经）", "ctime": 1785983549, "time_str": "10:32:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260806/c678713472.shtml"}, {"id": "4897911", "title": "闪迪CEO：已签署8份NBM长期协议 数据中心需求极度旺盛", "content": "美东时间周三盘后，闪迪公司管理层在财报会上宣布，公司已与8家覆盖数据中心、边缘赛道的多元化客户达成NBM长期协议，2027财年NBM协议供货比特量占公司总出货比特50%以上，2028财年占比约三分之二。公司CEO直言：“过去我们只能预判三个月以内需求，如今手握四年以上锁定采购量与明确盈利模型，对接全球顶级科技企业，进展超乎预期…部分最大客户签约仅一个季度后，就主动追加未来采购需求，足以证明当下需求环境极度旺盛，数据中心赛道尤为突出。”（财联社）", "ctime": 1785983454, "time_str": "10:30:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260806/c678713422.shtml"}, {"id": "4897901", "title": "向新向优转型提速 上半年我国机械工业行业运行稳中有进", "content": "中国机械工业联合会今天（6日）发布的信息显示，今年上半年，我国机械工业行业运行稳中有进，向新向优转型提速。最新数据显示，今年上半年，我国机械工业规模以上企业增加值同比增长6.4%，高于同期全国工业和制造业1个和0.8个百分点。主要涉及的五个国民经济行业大类——通用设备、专用设备、汽车、电气机械和仪器仪表制造业增加值同比增长均在6%以上。在重点监测的127种主要机械产品中，80种产品产量同比增长，增长面为63%，总体呈现上升趋势。此外，今年上半年，我国机械工业规模以上企业实现营业收入16.1万亿元，同比增长6.5%。分行业看，14个分行业营业收入全部实现增长，其中电工电器、工程机械、机床工具、机器人与智能制造行业增速超过10%。（央视新闻）", "ctime": 1785983317, "time_str": "10:28:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260806/c678713348.shtml"}, {"id": "4897897", "title": "科创50指数涨幅扩大至1%", "content": "科创50指数涨幅扩大至1%，现报1710.58点。", "ctime": 1785983297, "time_str": "10:28:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260806/c678713337.shtml"}, {"id": "4897895", "title": "住房消费跻身大宗消费首位，多个热点城市正研究出台住房消费提振举措", "content": "7月份，国务院批复的《扩大消费“十五五”规划》对外发布，将住房消费纳入大宗耐用商品消费范畴并置于首位。有机构认为，房地产的政策定位或向“防风险与促消费并重”转变。记者获悉，多个热点城市正谋划出台住房消费提振举措。其中，成都着力从优供给、增需求、去库存、稳预期方面提出住房销售政策，包括优化供给促进供需平衡、支持住房消费满足多元需求等，目前相关政策尚在内部研究中，最终确定后将第一时间公开发布；合肥正结合国家政策导向，会同相关部门统筹研究促进“大消费”部门协同联动行动方案。另外，记者获悉，武汉积极做好政策研究储备工作，下半年拟从一二手房市场联动、商办去化、高品质住房供应等完善政策工具箱；南京将结合市场实际适时优化相关政策举措，加大多样化“好房子”上市供应，深入开展住房消费“以旧换新”等活动，进一步促进居民各类刚性和改善性住房需求有效释放；另外，杭州、青岛、重庆、济南等热点城市也向记者透露，将持续做好政策储备和动态优化调整工作，着力稳定房地产市场。（证券时报）", "ctime": 1785983166, "time_str": "10:26:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260806/c678713260.shtml"}, {"id": "4897891", "title": "A股三大指数集体翻红，贵金属、元件、小金属板块领涨", "content": "A股三大指数集体翻红，创业板指、科创50指数此前均跌超2%。贵金属、元件、小金属板块领涨。", "ctime": 1785983146, "time_str": "10:25:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260806/c678713253.shtml"}, {"id": "4897887", "title": "中央气象台8月6日10时继续发布台风蓝色预警", "content": "中央气象台8月6日10时继续发布台风蓝色预警：今年第13号台风“白海豚”（强台风级）的中心今天（6日）上午8点钟位于浙江省温州市偏东方向约1300公里的西北太平洋上，就是北纬26.3度、东经133.7度，中心附近最大风力有14级（42米/秒），中心最低气压为955百帕，七级风圈半径为260—360公里，十级风圈半径为120—160公里，十二级风圈半径为60—80公里。预计，“白海豚”将以每小时15—20公里的速度向西偏北方向移动，强度变化不大或略有增强，7日白天穿过琉球群岛后移入东海，并逐渐向华东沿海靠近。此外，今年第14号台风“鲸鱼”今天上午由热带风暴级减弱为热带低压，上午8点钟其中心位于菲律宾吕宋岛上，就是北纬17.7度、东经120.9度，最大风力有7级（15米/秒），中心最低气压为1000百帕。预计，“鲸鱼”将以每小时15—20公里的速度向东偏南方向移动，强度逐渐减弱。（人民财讯）", "ctime": 1785983124, "time_str": "10:25:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260806/c678713237.shtml"}];

  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
