}
.card:hover { background: var(--bg-card-hover); border-color: #334155; }
.badge {

}
.score-bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s; }
.up { color: var(--red); }
.down { color: var(--green); }
.pulse { animation: pulse 2s infinite; }
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}
.glow { box-shadow: 0 0 20px rgba(59,130,246,0.15); }

: "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260915/c679923355.shtml"}, {"id": "5175331", "title": "中国东航：2026年8月客运运力投入313.1亿，同比增长5.17%", "content": "中国东航公告，2026年8月客运运力投入313.1亿，同比增长5.17%；旅客周转量280.59亿，同比增长6.69%；客座率89.61%，较同期提高1.27个百分点。货邮周转量3.74亿，同比增长3.61%。公司引进2架A320系列飞机、退出2架A320系列飞机，截至2026年8月末合计运营833架飞机。", "ctime": 1789460718, "time_str": "16:25:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260915/c679923256.shtml"}, {"id": "5175325", "title": "美敦力：将携约120款产品与解决方案参加第九届进博会", "content": "9月15日，距离第九届中国国际进口博览会（CIIE 2026）开幕还有50天，已连续八届参展的美敦力宣布，今年将携覆盖心脏及血管、神经科学、医疗外科、糖尿病等领域约120款创新产品与解决方案亮相，首展阵容、参展规模创美敦力历届新高。（人民财讯）", "ctime": 1789460706, "time_str": "16:25:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260915/c679923243.shtml"}, {"id": "5175295", "title": "阶跃发布语音大模型 StepAudio 3", "content": "阶跃发布新一代语音大模型 StepAudio 3 系列，一次性推出 StepAudio 3 Realtime、StepAudio 3 ASR、StepAudio 3 TTS、StepAudio 3 Gen 和 StepAudio 3 Music 五款模型，覆盖实时语音交互、语音识别、真人级语音生成和音乐创作等场景。其中，多款模型在权威第三方 AI 模型评测机构 Artificial Analysis 榜单中位列全球第一。 (科创板日报)", "ctime": 1789460455, "time_str": "16:20:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260915/c679923142.shtml"}, {"id": "5175237", "title": "威派格在鞍山成立水务科技新公司", "content": "企查查APP显示，近日，鞍山威派格水务科技有限公司成立，经营范围包含：智能水务系统开发；信息系统集成服务；泵及真空设备销售；移动终端设备销售；仪器仪表销售等。企查查股权穿透显示，该公司由威派格全资持股。（人民财讯）", "ctime": 1789460043, "time_str": "16:14:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260915/c679922085.shtml"}, {"id": "5175231", "title": "小鹏首座X-Energy兆瓦闪充站落地香港", "content": "9月15日，小鹏集团宣布全球首座X-Energy兆瓦闪充站正式落地香港并投入运营，该站由小鹏集团与Halo共同建设，并面向全品牌车主开放。（界面新闻）", "ctime": 1789459967, "time_str": "16:12:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260915/c679922065.shtml"}, {"id": "5175201", "title": "港股收评：恒生指数跌1.0%，恒生科技指数跌0.62%", "content": "港股收盘，恒生指数跌1.0%，恒生科技指数跌0.62%。恒指港股通ETF银华（159318）跌0.7%，港股通科技ETF鹏华（159751）跌0.59%。板块方面，安全和报警服务、计算机外围设备板块涨幅靠前；林业、储能设备板块跌幅靠前。个股方面，真健康医疗-B涨30.34%，海清智元涨11.83%，大金重工涨10.9%，怡俊集团控股涨9.5%，天域半导体涨8.11%；瀚天天成跌15.72%，德适-B跌13.61%，亮晴控股跌10.1%，复宏汉霖跌8.21%，美图公司跌8.06%。", "ctime": 1789459807, "time_str": "16:10:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260915/c679922002.shtml"}, {"id": "5175195", "title": "吉利内部正对电池板块进行新一轮整理", "content": "有吉利内部高管表示，在电池板块，目前公司内部正对旗下几个企业进行整理，长远来讲可能会并入吉利汽车上市公司内，“具体要等这个电池集团具备盈利条件之后。”其并表示，近日宁德时代被曝收购吉利系重庆电池项目只是个别情况，毕竟宁德时代方面也有产能扩充的需要。（蓝鲸新闻）", "ctime": 1789459734, "time_str": "16:08:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260915/c679921937.shtml"}, {"id": "5175189", "title": "报告显示：我国餐饮业发展显现韧性", "content": "中国饭店协会等单位日前发布的《2026中国餐饮业年度报告》显示，在市场竞争加剧背景下，国内餐饮收入等多项指标有所改善，餐饮业发展显现韧性，与此同时，新供给新场景不断涌现，为餐饮业发展注入新动能。报告认为，当前我国餐饮业正经历从快速扩张期向成熟调整期的结构性转换，从业态看，2025年快餐小吃门店达351.6万家，占全部商户的46.4%；中式正餐、烘焙饮品门店分别达112.34万家和101.49万家，依然是行业重要支撑。从城市看，三线城市餐饮门店数量最多，达171.52万家；五线城市餐饮门店数量增长2.2%，连续三年实现正增长。（新华社）", "ctime": 1789459708, "time_str": "16:08:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260915/c679921927.shtml"}, {"id": "5175171", "title": "COMEX黄金期货跌超1%", "content": "COMEX黄金期货跌超1%，现报4305.6美元/盎司。", "ctime": 1789459542, "time_str": "16:05:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260915/c679921874.shtml"}, {"id": "5175153", "title": "现货黄金失守4270美元/盎司 纽约期金失守4310美元/盎司", "content": "现货黄金失守4270美元/盎司，日内跌0.67%。纽约期金失守4310美元/盎司，日内跌0.99%。", "ctime": 1789459401, "time_str": "16:03:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260915/c679921698.shtml"}, {"id": "5175149", "title": "伊朗外长阿拉格齐将访华", "content": "外交部发言人宣布：伊朗外长阿拉格齐将于9月16日访华，中共中央政治局委员、外交部长王毅将同其举行会谈。(外交部网站)", "ctime": 1789459369, "time_str": "16:02:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260915/c679921563.shtml"}, {"id": "5175129", "title": "布伦特原油站上108美元/桶", "content": "布伦特原油站上108美元/桶，日内涨2.24%。", "ctime": 1789459312, "time_str": "16:01:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260915/c679921259.shtml"}, {"id": "5175135", "title": "两部门对在线酒店预订平台服务行业开展行政指导", "content": "今天（15日），市场监管总局会同文化和旅游部召开在线酒店预订平台服务行业行政指导会，要求美团、抖音、京东、携程、同程、飞猪等平台企业，严格落实合规主体责任，防范化解行业竞争风险，维护健康有序的旅游市场环境。会议指出，公平竞争是市场经济的法治基石，合规经营是企业发展的生命线。近年来我国在线酒店预订平台服务行业发展迅速，在便利人民群众生活、促进旅游消费等方面发挥了积极作用，与此同时，竞争风险也不容忽视。在线酒店预订平台企业作为行业关键主体，应当严守法律底线，坚持公平竞争，加强合规管理，推动行业规范健康发展。会议要求，各平台企业要严格遵守《中华人民共和国反垄断法》《中华人民共和国反不正当竞争法》《中华人民共和国电子商务法》《中华人民共和国旅游法》等法律规定，以案为鉴，对照自查，自觉防范化解独家合作、“全网最低价”等“内卷”问题和竞争风险。要增强合规意识，筑牢合规经营和安全发展底线，健全合规长效机制，共同营造优质优价、良性竞争的市场秩序，切实维护消费者合法权益，促进平台生态内多方主体共赢发展。（央视新闻）", "ctime": 1789459303, "time_str": "16:01:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260915/c679921285.shtml"}, {"id": "5175125", "title": "动力电池回收利用产业标准体系建设指南公开征求意见", "content": "工业和信息化部科技司15日发布《动力电池回收利用产业标准体系建设指南（2026版）》（征求意见稿），提出到2030年，制修订国家标准50项以上，基本建成覆盖全产业链、产品全生命周期的动力电池回收利用标准体系，逐步形成资源高效利用、产业链全覆盖、国内国际协同的标准体系。 动力电池富含镍、钴、锂等战略资源，其回收利用可有效缓解和减少进口依赖，提升国家矿产资源供给保障能力。建立健全动力电池回收利用标准体系，对于规范产业发展、保障战略资源安全、引领产业技术创新具有重要意义。 征求意见稿提出，加快构建覆盖废旧动力电池“收集—储运—物理处理—化学处理”全产业链和产品全生命周期的动力电池回收利用标准体系。动力电池回收利用产业标准体系结构包括基础通用标准、收集分类标准、物理处理标准、化学处理标准、综合利用产品标准以及绿色低碳标准6个部分。(新华社)", "ctime": 1789459284, "time_str": "16:01:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260915/c679921207.shtml"}, {"id": "5175117", "title": "美股中概股盘前涨跌互现，理想汽车跌3%", "content": "美股中概股盘前涨跌互现，携程、网易涨1%，京东、阿里巴巴持平，拼多多跌0.2%，百度跌1%，贝壳跌2%，理想汽车跌3%。", "ctime": 1789459271, "time_str": "16:01:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260915/c679921157.shtml"}, {"id": "5175113", "title": "美股大型科技股盘前涨跌互现，微软跌超1%", "content": "美股大型科技股盘前涨跌互现，美光科技涨0.5%，英伟达涨0.4%，SK海力士涨0.3%；SpaceX持平；微软、谷歌A跌超1%，Meta跌0.9%，苹果跌0.8%，亚马逊跌0.5%，特斯拉跌0.2%。", "ctime": 1789459267, "time_str": "16:01:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260915/c679921135.shtml"}, {"id": "5175033", "title": "美国30年期国债收益率突破5.40% 创2007年以来新高", "content": "美国30年期国债收益率持续上行，盘中最高升至5.40%关口，创2007年6月以来新高。随着长期美债收益率持续走高，市场对美国通胀、财政赤字及长期融资成本上升的担忧有所升温。", "ctime": 1789458824, "time_str": "15:53:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260915/c679920848.shtml"}, {"id": "5175011", "title": "现货黄金失守4280美元/盎司 纽约期金失守4320美元/盎司", "content": "现货黄金失守4280美元/盎司，日内跌0.42%。纽约期金失守4320美元/盎司，日内跌0.75%。", "ctime": 1789458710, "time_str": "15:51:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260915/c679920798.shtml"}, {"id": "5174977", "title": "珠免集团：华发集团转让股权推进中，格力集团将持股44.95%", "content": "珠免集团公告，公司此前披露华发集团拟将其直接或间接持有的海投公司96.28%股权、免税集团23%股权等资产转让给格力集团，变动后格力集团将通过海投公司间接持有公司44.95%股权。截至公告披露日，股权转让事项尚在推进中；投捷公司已支付交易对价16.55亿元，13.81亿元担保责任已完全解除，尚有2.63亿元担保未完成解除变更登记。", "ctime": 1789458364, "time_str": "15:46:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260915/c679920638.shtml"}, {"id": "5174973", "title": "鼎胜新材：公司出售三门峡铝业0.5714%股权交易终止", "content": "鼎胜新材公告，公司此前拟向焦作万方出售持有的三门峡铝业0.5714%股权；因焦作万方决定撤回本次重组申请文件，公司出售三门峡铝业0.5714%股权的交易方案相应终止。截至公告披露日，公司仍持有该股权。", "ctime": 1789458359, "time_str": "15:45:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260915/c679920633.shtml"}, {"id": "5174971", "title": "明泰铝业：向焦作万方出售三门峡铝业2.50%股权交易终止", "content": "明泰铝业公告，公司此前拟向焦作万方出售三门峡铝业2.50%股权；因焦作万方决定撤回发行股份购买资产重组申请文件，公司向焦作万方出售三门峡铝业2.50%股权的交易方案相应终止。截至公告披露日，公司仍持有三门峡铝业2.50%股权。", "ctime": 1789458348, "time_str": "15:45:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260915/c679920629.shtml"}, {"id": "5174931", "title": "海欣股份：副总裁周晓岑于2026年9月15日辞职", "content": "海欣股份公告，公司董事会于2026年9月15日收到副总裁周晓岑因个人原因提交的书面辞职报告，辞职报告自送达董事会之日起生效。辞职后，周晓岑不再担任公司及控股子公司任何职务，其辞职不会对公司正常运作及经营管理产生影响。", "ctime": 1789457678, "time_str": "15:34:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260915/c679920297.shtml"}, {"id": "5174929", "title": "春秋航空：2026年8月总载运人次336.28万人次，同比增长5.15%", "content": "春秋航空公告，2026年8月总载运人次336.28万人次，同比增长5.15%；客座率94.79%，同比增长0.92%；综合载运率79.01%，同比增长0.80%。2026年累计总载运人次2396.28万人次，同比增长11.53%。本月新增2架空客A320neo机型飞机，截至2026年8月末共运营140架空客A320系列机型飞机。", "ctime": 1789457673, "time_str": "15:34:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260915/c679920294.shtml"}, {"id": "5174921", "title": "外交部：中国将继续以优质服务链接国际市场 让“中国服务”更好惠及全球", "content": "9月15日，外交部发言人郭嘉昆主持例行记者会。有记者问，2026年中国国际服务贸易交易会日前在北京闭幕。本届服贸会吸引近百个国家和国际组织设展办会，众多首发首秀成果集中亮相，备受各方关注。有评论称，服贸会已成为观察中国扩大开放的窗口，发言人对此有何评论？郭嘉昆表示，“中国服务”是中国高水平对外开放的一张崭新名片。本届服贸会吸引1830余家企业线下参展，5300余家企业线上参展，达成1200余项成果，在信息通讯、金融科技、数智医疗、智慧教育、节能环保等领域展示了一系列新技术、新方案、新成果，创造了合作新机遇。中国将继续以优质服务链接国际市场，以互利合作推动成果共享，让“中国服务”更多走出国门、更好惠及全球。（央视新闻）", "ctime": 1789457635, "time_str": "15:33:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260915/c679920249.shtml"}, {"id": "5174919", "title": "小米18Pro系列本月发布，预计将6999/7999元起售", "content": "今日，小米正式官宣旗下数字旗舰新机小米18Pro系列将于本月正式发布。小米集团总裁卢伟冰表示“这将是小米数字旗舰系列，升级最显著最全面的一次。”据悉，此次小米18Pro系列将全系首发搭载高通骁龙2nm旗舰SoC芯片。受内存成本持续上涨因素，小米18Pro、Pro MAX预计将6999/7999元起售。（科创板日报）", "ctime": 1789457607, "time_str": "15:33:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260915/c679920230.shtml"}, {"id": "5174913", "title": "阶跃发布Step Audio 3系列模型", "content": "9月15日，阶跃正式发布Step Audio 3系列模型，包括StepAudio 3 Realtime、StepAudio 3 ASR、StepAudio 3 TTS、StepAudio 3 Gen和StepAudio 3 Music。以上五款模型，目前均已上线阶跃星辰开放平台。（界面新闻）", "ctime": 1789457582, "time_str": "15:33:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260915/c679920212.shtml"}, {"id": "5174895", "title": "阿里云：通用代金券关闭对Qoder CN支持", "content": "9月15日，阿里云发布通知，将于2026年9月30日起停止通用代金券在Qoder CN相关产品中的使用。阿里云官方通用代金券将无法继续用于Qoder CN产品购买或费用抵扣。据了解，Qoder CN是阿里云推出的AI智能体产品系列，覆盖软件开发与日常办公多元场景，包含面向编码场景的Qoder CN（含IDE、JetBrains插件）、面向日常工作的 QoderWork CN（桌面应用）、Qoder CN CLI（终端原生形态）、QoderWake CN（数字员工）、Qoder Cloud Agents（云端Agent平台）等子产品。（界面新闻）", "ctime": 1789457470, "time_str": "15:31:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260915/c679920158.shtml"}, {"id": "5174851", "title": "西班牙8月通胀率达到2023年年初以来最高水平", "content": "当地时间9月15日，西班牙国家统计局的最终数据显示，8月该国通胀率远高于预期水平，达到4.3%，比前一个月高出0.7个百分点，达到2023年2月以来的最高水平。据悉，中东冲突升级导致的燃油价格上涨是西班牙8月通胀率创下新高的主要原因。西班牙国家统计局的数据显示，该国8月燃油价格同比上涨24%，为2022年7月以来的最高水平。（央视新闻）", "ctime": 1789457318, "time_str": "15:28:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260915/c679920091.shtml"}, {"id": "5174827", "title": "伊朗称在霍尔木兹海峡以东击落MQ-1无人机", "content": "伊朗伊斯兰革命卫队15日发表声明说，革命卫队当天在霍尔木兹海峡以东空域拦截并击落一架MQ-1无人机。（新华社）", "ctime": 1789457183, "time_str": "15:26:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260915/c679919988.shtml"}, {"id": "5174821", "title": "外交部：菲对中国领土主张所谓海洋管辖权是非法的", "content": "外交部发言人郭嘉昆15日在例行记者会上说，根据“陆地统治海洋”的国际法原则，菲律宾对中国领土主张所谓海洋管辖权是非法的。中国在本国领土开展建设等活动是主权范围内的事，正当合法。“我们要再次强调，中方将继续采取坚决措施维护自身领土主权和海洋权益，坚决反对一切侵权行径。”（新华社）", "ctime": 1789457156, "time_str": "15:25:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260915/c679919976.shtml"}, {"id": "5174801", "title": "黑龙江全省口岸俄籍入境旅客同比增长76.9%", "content": "自去年9月15日我国对俄罗斯持普通护照人员试行免签政策以来，两国人员往来规模稳步增长，跨境旅游、人文交流更加活跃。据黑龙江边检总站统计，政策实施一年来，全省口岸累计查验出入境人员约338.8万人次，同比增长29.3%；其中俄籍入境旅客约61.7万人次，同比增长76.9%。（央视新闻）", "ctime": 1789457011, "time_str": "15:23:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260915/c679919905.shtml"}, {"id": "5174797", "title": "外交部：中方关注当前中东海湾地区局势", "content": "9月15日，外交部发言人郭嘉昆主持例行记者会。有记者就美伊问题提问。对此，郭嘉昆表示，中方关注当前中东海湾地区局势，希望有关方坚持通过政治外交途径化解争端。（央视新闻）", "ctime": 1789456961, "time_str": "15:22:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260915/c679919899.shtml"}, {"id": "5174791", "title": "外交部：高市早苗涉台错误言行是当前中日关系面临严重困难的最大症结", "content": "9月15日，外交部发言人郭嘉昆主持例行记者会。有记者就中日关系提问。对此，郭嘉昆表示，9月14日，中国外交部刘彬部长助理会见来华访问的日中友好议员联盟青年议员代表团。中方强调，日本首相高市早苗涉台错误言行是当前中日关系面临严重困难的最大症结。日方应恪守中日4个政治文件精神，汲取历史教训，以实际行动取信亚洲邻国和国际社会。希望日中议联秉持对华友好传统，展现责任担当，为两国关系重回正轨创造条件和环境。（央视新闻）", "ctime": 1789456748, "time_str": "15:19:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260915/c679919765.shtml"}, {"id": "5174787", "title": "美军因伊朗战事面临兵力或资源短缺，外交部回应", "content": "9月15日，外交部发言人郭嘉昆主持例行记者会。法新社记者提问，一名美军官员昨日称，受伊朗战事影响，美国在执行任务时面临兵力或资源短缺的问题。中方对此有何评论？对此，郭嘉昆表示：“中方关注当前中东海湾地区局势，希望有关方坚持通过政治外交途径化解争端。”（澎湃新闻）", "ctime": 1789456723, "time_str": "15:18:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260915/c679919747.shtml"}, {"id": "5174783", "title": "外交部：望日中友好议员联盟为两国关系重回正轨创造条件和环境", "content": "9月15日，外交部发言人郭嘉昆主持例行记者会。共同社记者提问，昨天刘彬部长助理会见了日中友好议员联盟，发言人能否介绍此次会见的意义及具体内容。郭嘉昆表示，9月14日，中国外交部刘彬部长助理会见来华访问的日中友好议员联盟青年议员代表团。中方强调，日本首相高市早苗涉台错误言行是当前中日关系面临严重困难的最大症结。日方应恪守中日四个政治文件精神，汲取历史教训，以实际行动取信亚洲邻国和国际社会。“希望日中议联秉持对华友好传统，展现责任担当，为两国关系重回正轨创造条件和环境。”郭嘉昆说。（澎湃新闻）", "ctime": 1789456715, "time_str": "15:18:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260915/c679919728.shtml"}, {"id": "5174781", "title": "美太空军称已拥有在轨太空武器，外交部：敦促美方停止在外空扩军备战", "content": "9月15日，外交部发言人郭嘉昆主持例行记者会。法新社记者提问，美国太空军称已经拥有了在轨太空武器，请问中方对此有何回应？中方是否也有在轨的太空武器？郭嘉昆表示，中国一贯坚持和平利用外空，维护外空安全，反对外空武器化、战场化和军备竞赛。“我们敦促美方停止在外空扩军备战，以实际行动维护全球战略稳定。”（澎湃新闻）", "ctime": 1789456709, "time_str": "15:18:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260915/c679919722.shtml"}, {"id": "5174775", "title": "中密控股：公司未切入爆破片产品领域", "content": "中密控股9月15日在互动平台表示，公司确已中标中石化湖南石化加氢装置爆破片采购项目。该爆破片是公司干气密封系统里的一个零部件，此次订单为代客户采购爆破片的业务，并非公司机械密封产品订单，项目金额较小。公司并未切入爆破片产品领域。（人民财讯）", "ctime": 1789456669, "time_str": "15:17:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260915/c679919687.shtml"}, {"id": "5174755", "title": "上台以来首次 高市早苗17日将改组内阁", "content": "日本首相、执政党自民党总裁高市早苗15日在自民党高层会议上说，16日将进行自民党人事调整、17日将改组内阁。据日本媒体披露，自民党和高市内阁的主要成员或将留任，与自民党联合执政的日本维新会成员拟首次入阁。分析人士指出，随着日本维新会成员入阁，自民、维新联合执政将由此前的阁外合作转向阁内合作。(新华社)", "ctime": 1789456516, "time_str": "15:15:16", "stock_code": "", "st const SECTORS  = [{"name": "金融", "hit_count": 44, "etfs": []}, {"name": "人工智能", "hit_count": 29, "etfs": []}, {"name": "半导体", "hit_count": 27, "etfs": []}, {"name": "消费", "hit_count": 23, "etfs": []}, {"name": "军工", "hit_count": 15, "etfs": []}, {"name": "数据要素", "hit_count": 15, "etfs": []}, {"name": "医药", "hit_count": 10, "etfs": []}, {"name": "新能源", "hit_count": 10, "etfs": []}];
const META     = {"update_time": "2026-09-15 16:50:59", "sentiment_score": 55.67226890756302, "agents": []};

// 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
