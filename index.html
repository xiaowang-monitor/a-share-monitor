653", "title": "日韩股市集体收跌", "content": "日经225指数收跌0.44%，报60550.59点。韩国综指收跌3.25%，报7271.66点。", "ctime": 1779172315, "time_str": "14:31:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260519/c676795955.shtml"}, {"id": "4379629", "title": "信托理财合作现新“花活”：券商投顾放弃浮动报酬以回补净值", "content": "记者5月19日从业内获悉，部分信托公司在与银行理财公司合作中，出现一种新的净值“润滑”操作：信托产品在聘请券商担任投顾时，约定固定和浮动投顾报酬，信托公司通过“打分”机制让券商主动放弃已计提的浮动报酬，将资金回补至信托资产，从而修复当日净值。\n\n“券商之所以愿意放弃浮动报酬，核心诉求是保规模、赚固定费用等。”某信托公司人士向记者表示。\n\n近年来，从信托平滑机制、收盘价估值到自建估值模型，理财机构对产品估值采取的一系列平滑举措受到监管部门关注。但在理财资金需求旺盛的背景下，银行理财与信托的委外合作仍是资管行业重要的业务模式。(中证金牛座)", "ctime": 1779172059, "time_str": "14:27:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260519/c676795780.shtml"}, {"id": "4379627", "title": "以色列科技界人士期待与中国加强智能出行合作", "content": "多名以色列科技界人士日前接受新华社记者采访时表示，中国在智能出行、电动汽车、无人机和城市交通创新等领域发展迅速，期待与中国加强技术合作。\n\n第九届“萨姆森国际智能出行峰会”17日至18日在以色列特拉维夫举行。智能交通是本届峰会的关注重点之一。新华社记者在会场了解到，当前智能出行技术正加速向自动驾驶、车辆感知和城市交通管理等场景延伸。(新华社)", "ctime": 1779171960, "time_str": "14:26:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260519/c676795741.shtml"}, {"id": "4379623", "title": "特朗普最新表态 “撤回”降息压力", "content": "特朗普在接受最新采访时表示，与伊朗冲突相关的不断上升的通货膨胀使美国降息的前景变得复杂。只有中东冲突稳定下来，才能对通胀数据进行全面评估。特朗普表示，新任美联储主席沃什与他一样，总体上倾向于降低利率和采取宽松的货币政策；但同时承认，他可能需要等到与伊朗的战争结束之后，才能进一步推动降息。特朗普的这番言论标志着他对降息的坚持有所缓和。(蓝鲸新闻)", "ctime": 1779171888, "time_str": "14:24:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260519/c676795725.shtml"}, {"id": "4379617", "title": "沪深京三市成交额超2.5万亿元，较上日此时缩量823亿元", "content": "据同花顺iFinD数据，沪深京三市成交额超2.5万亿元，较上日此时缩量823亿元，预计全天成交金额约2.8万亿元。截至目前，沪市成交额11212亿元，深市成交额13599亿元，北证50成交额193亿元。", "ctime": 1779171834, "time_str": "14:23:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_sha 1779171533, "time_str": "14:18:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260519/c676795588.shtml"}, {"id": "4379599", "title": "小摩：维持对三大中资电讯股正面看法，首选中国移动", "content": "摩根大通发表报告指，三大中资电讯股因推出针对中小企及零售用户的AI Token套餐，H股股价昨日上扬，反映投资者看好电讯商成为AI变现的实体经济受惠者。该行维持对中国移动、中国电信及中国联通的正面看法，均予“增持”评级。该行认为，AI变现及电讯服务“内卷”情况改善，有望带动ARPU从2026年起重拾增长，并使盈利从2027年恢复增长，而2026年则受增值税调整影响。三大电讯股中，摩通在H股首选仍为中国移动，其后为中国电信及中国联通。（新浪财经）", "ctime": 1779171525, "time_str": "14:18:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260519/c676795587.shtml"}, {"id": "4379591", "title": "海南：将推动琼州海峡滚装第二通道建设、尽快启动湛海高铁建设", "content": "记者从《海南省“十五五”综合交通运输（公路水路）发展规划（征求意见稿）》获悉，海南将推动琼州海峡滚装第二通道建设。“十五五”时期海南将拓宽出岛大通道，除尽快启动湛海高铁建设外，省交通运输厅正在谋划琼州海峡滚装第二通道。上述《规划》将全面提升琼州海峡“黄金水道”运输能力列为“十五五”重点任务，明确提出加强研究论证，适时推动琼州海峡滚装第二通道建设。目前，海南已成立由分管省领导担任组长的琼州海峡第二通道工作组，其办公室设在省交通运输厅。据悉，《规划》突出制度集成创新，持续深化航运制度改革创新，稳步推进政策红利加力扩围增效。海南将进一步优化航运政策，提升国际船舶登记服务质量和效率，吸引船舶落户“中国洋浦港”船籍港，吸引国际航运资源集聚。", "ctime": 1779171384, "time_str": "14:16:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260519/c676795493.shtml"}, {"id": "4379583", "title": "科创50指数涨幅扩大至2%", "content": "科创50指数涨幅扩大至2%，早盘一度跌超2%。成份股中，芯原股份涨超10%，沪硅产业、中微公司涨幅居前。", "ctime": 1779171191, "time_str": "14:13:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260519/c676795437.shtml"}, {"id": "4379573", "title": "伊朗副外长：解除制裁、解冻冻结资金、结束封锁均被纳入伊朗近期向美方提交的提案", "content": "伊朗副外长表示，解除制裁、解冻冻结资金、结束封锁均被纳入伊朗近期向美方提交的提案。（新浪财经）", "ctime": 1779171020, "time_str": "14:10:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260519/c676795383.shtml"}, {"id": "4379565", "title": "中韩半导体ETF再提示溢价风险 年内已提示140次", "content": "今天下午，中韩半导体ETF华泰柏瑞再发公告提示溢价风险。截至5月18日，该ETF年内累计发布溢价风险提示公告140次，实施停牌64次，其中包含3次盘中临时停牌，这也意味着。从5月13日到5月19日，再增加5次风险提示。截至发稿前，该ETF今天盘中跌3.36%；溢价23.7%，较前一日的25.73%有所回落。", "ctime": 1779170745, "time_str": "14:05:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260519/c676795290.shtml"}, {"id": "4379443", "title": "伊朗股市恢复交易", "content": "总台记者获悉，当地时间19日，伊朗德黑兰证券交易所恢复股票交易。（央视新闻）", "ctime": 1779170415, "time_str": "14:00:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260519/c676795211.shtml"}, {"id": "4379419", "title": "至正股份成立半导体新材料科技公司", "content": "企查查APP显示，近日，深圳市领先半导体新材料科技有限公司成立，经营范围包含：企业管理咨询；以自有资金从事投资活动；半导体器件专用设备制造；半导体器件专用设备销售等。企查查股权穿透显示，该公司由至正股份全资持股。", "ctime": 1779170298, "time_str": "13:58:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260519/c676795167.shtml"}, {"id": "4379415", "title": "IMF警告中东冲突削弱英国经济增长前景", "content": "国际货币基金组织（IMF）18日发布报告显示，中东局势正在削弱英国经济短期增长前景，预计今年英国经济增长率将降至1.0%。此外，能源价格上涨将暂时推高通胀率。（新华社）", "ctime": 1779170223, "time_str": "13:57:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260519/c676795126.shtml"}, {"id": "4379411", "title": "新一轮生猪产能调控目标确定", "content": "记者从相关知情人士处获悉，全国划定3750万头能繁母猪总调控目标，按区域实际情况逐级分解下达至各省市。在5月18日召开的全国生猪产业调控专项工作会议上，主管部门同时明确多项硬性管控举措与考核监管机制，并表示将严查产能逆势扩张行为。（财联社）", "ctime": 1779170212, "time_str": "13:56:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260519/c676795123.shtml"}, {"id": "4379403", "title": "助力人工智能发展，我国正前瞻布局一批数据领域前沿标准", "content": "记者今天从国家数据局了解到，我国正前瞻布局一批数据领域前沿标准。据了解，相关单位已研究制定算力并网、池化等全国一体化算力网国家指导性技术文件12项，编制高质量数据集建设、格式、分类、质量测评等国家标准7项，启动本体模型、算电协同等标准研究百余项，为我国人工智能发展筑牢数据根基。国家数据局局长刘烈宏表示，2026年，全国数据标准化技术委员会将研究制定不少于80项国家标准和技术文件，发布不少于30项重点标准，推动2~3项国际标准立项。（央视新闻）", "ctime": 1779170038, "time_str": "13:53:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260519/c676795090.shtml"}, {"id": "4379393", "title": "节能风电在黑龙江北安成立能源新公司", "content": "企查查APP显示，近日，中节能（北安市）能源有限公司成立，经营范围包含：风力发电技术服务；储能技术服务；发电技术服务等。企查查股权穿透显示，该公司由节能风电全资持股。", "ctime": 1779169884, "time_str": "13:51:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260519/c676795067.shtml"}, {"id": "4379389", "title": "外交部亚洲司司长刘劲松会见印度新任驻华大使魏嘉盟", "content": "2026年5月18日，外交部亚洲司司长刘劲松会见印度新任驻华大使魏嘉盟。\n\n刘劲松欢迎魏嘉盟大使履新，表示习近平主席和印度总理莫迪喀山、天津两次会晤为中印关系发展指明方向。双方应坚持中印是合作伙伴而不是对手、互为发展机遇而不是威胁的重要共识，紧紧把握发展这个最大“公约数”，加强各领域交往合作，妥善管控分歧，推动中印关系持续改善发展，为全球南方团结合作及国际地区稳定繁荣发挥重要作用。\n\n魏嘉盟表示，印方高度重视印中关系，近期两国关系保持良好发展势头。我作为新任驻华大使，愿同中方密切合作，落实两国领导人重要共识，推动印中关系取得更大进展。(外交部网站)", "ctime": 1779169676, "time_str": "13:47:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260519/c676795009.shtml"}, {"id": "4379387", "title": "威科赛乐：成功斩获某XX所激光项目，光芯片业务持续爆发", "content": "近日，威科赛乐成功中标某XX所激光项目，项目涵盖905nm/940nm MJ VCSEL及976nm系列产品，核心应用聚焦激光雷达领域，标志着公司在高端光芯片国产化进程中再添关键里程碑。本次中标的905nm/940nm MJ VCSEL芯片，产品性能指标直接对标海外头部芯片水平。（人民财讯）", "ctime": 1779169611, "time_str": "13:46:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260519/c676794953.shtml"}, {"id": "4379377", "title": "MicroLED概念股震荡上扬，英诺激光触及20cm涨停创新高", "content": "MicroLED概念股震荡上扬，英诺激光触及20cm涨停创新高，福光股份、精智达、三安光电、同兴达跟涨。", "ctime": 1779169520, "time_str": "13:45:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260519/c676794930.shtml"}, {"id": "4379371", "title": "多款贵州茅台酒将上架i茅台", "content": "5月19日，i茅台宣布，5月19日20:09起，i茅台APP“i购”商城将上架53%vol 500ml陈年贵州茅台酒（30）、53%vol "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260519/c676794175.shtml"}, {"id": "4379181", "title": "“微笑”卫星今天发射 为空间天气预报提供科学支撑", "content": "今天（19日）中欧联合研制的太阳风-磁层相互作用全景成像卫星（简称“微笑”卫星，SMILE）在法属圭亚那库鲁航天中心，由“织女星-C”火箭发射升空。卫星顺利进入预定轨道，状态正常，太阳翼展开到位，标志着发射任务取得圆满成功。“微笑”卫星任务是中国科学院（CAS）与欧洲空间局（ESA）首次开展任务级全方位深度合作的空间科学探测任务，也是中国科学院空间科学（二期）先导专项的收官之作。“微笑”卫星的核心使命就是要对我们地球的最外层磁层，进行软X射线的整体成像，来揭示太阳风跟我们地球空间相互作用的过程和物理的规律。太阳风是源自太阳的高速等离子体流。剧烈的太阳活动会引发磁暴、亚暴等空间天气事件，直接威胁到在轨卫星的安全、导航定位的精度、通信链路的稳定以及高纬度地区的电网运行。而地球磁层就像是抵御太阳风侵袭的天然“保护伞”，好比是地球最外层的一个保护壳。只有深入认识太阳风与磁层的耦合机理，才能减少太阳风带来的各种不利影响。（央视新闻）", "ctime": 1779166374, "time_str": "12:52:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260519/c676794150.shtml"}, {"id": "4379177", "title": "印尼股市基准指数扩大跌幅至3%报6403.80点", "content": "印尼股市基准指数扩大跌幅至3%报6403.80点。", "ctime": 1779166173, "time_str": "12:49:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260519/c676794119.shtml"}, {"id": "4379169", "title": "阿里千问大模型Qwen3.7 Max预览版即将发布", "content": "阿里千问大模型Qwen3.7 Max预览版和 Qwen3.7 Plus预览版即将发布。Arena（前大模型竞技场）的评测中，Qwen3.7-Max-Preview在文本领域排名第13，同时也是国产排名第一的模型。在视觉领域，Qwen3.7-Plus-Preview排名第16，同样是排行榜上国产排名第一的模型。（科创板日报）", "ctime": 1779166001, "time_str": "12:46:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260519/c676794099.shtml"}, {"id": "4379151", "title": "伊拉克4月原油出口环比下降近47%", "content": "伊拉克石油部18日发布声明说，该国4月原油出口量骤降至约988万桶，较3月的约1860万桶下降46.9%。声明援引伊拉克国家石油营销组织的统计数据说，伊拉克4月原油出口收入超过10.87亿美元。数据显示，伊拉克3月原油出口量约1860万桶，较2月的约9987万桶大幅下降超八成；3月原油出口收入约19亿美元，远低于2月的逾68亿美元。受美以伊战事影响，全球能源贸易关键通道霍尔木兹海峡通航几近停滞，导致近几个月来伊拉克原油出口量大幅减少。（新华社）", "ctime": 1779165547, "time_str": "12:39:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260519/c676793985.shtml"}, const META     = {"update_time": "2026-05-19 15:00:04", "sentiment_score": 52.534562211981566, "agents": []};

// 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
