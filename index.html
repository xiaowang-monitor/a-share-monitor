<style>
:root {

* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Noto Sans SC', sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  min-height: 100vh;
}
.mono { font-family: 'JetBrains Mono', monospace; }
.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 20px;
  transition: all 0.2s;
}
.card:hover { background: var(--bg-card-hover); border-color: #334155; }
.badge {
  display: inline-flex; align-items: center; padding: 2px 8px;
  border-radius: 6px; font-size: 12px; font-weight: 500;
}
.badge-s { background: rgba(239,68,68,0.2); color: #ef4444; }
.badge-a { background: rgba(245,158,11,0.2); color: #f59e0b; }
.badge-b { background: rgba(59,130,246,0.2); color: #3b82f6; }
.badge-c { background: rgba(100,116,139,0.2); color: #94a3b8; }
.score-bar {
  height: 6px; border-radius: 3px; background: #1e293b; overflow: hidden;
}
.score-bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s; }
.up { color: var(--red); }
.down { color: var(--green); }
.pulse { animation: pulse 2s infinite; }
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}
.glow { box-shadow: 0 0 20px rgba(59,130,246,0.15); }

::-webkit-scrollbar-track { background: var(--bg-primary); }

</style>

              <th class="text-left py-2 px-1">名称</th>
              <th class="text-right py-2 px-1">现价</th>
              <th class="text-right py-2 px-1">涨幅</th>
              <th class="text-right py-2 px-1">评分</th>

              <th class="text-right py-2 px-1">板块</th>
              <th class="text-right py-2 px-1">连涨</th>

          <tbody id="picks-table"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- 新闻流 + 交易代理 -->
<div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
  <div class="card">

</div>

", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260812/c678890840.shtml"}, {"id": "4943229", "title": "创业板指涨2%", "content": "创业板指涨幅扩大至2%，上证指数涨0.31%，深证成指涨1.38%。", "ctime": 1786510912, "time_str": "13:01:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260812/c678890838.shtml"}, {"id": "4943181", "title": "星巴克回应“蜜雪冰城代工”：对市场传闻和猜测不作评论", "content": "8月12日，星巴克纸杯、吸管、抹茶粉将由蜜雪冰城代工的消息引发关注。对此，星巴克中国方面12日回应记者称，“我们对市场传闻和猜测不作评论。目前星巴克各项业务均在正常运行中。”（中新经纬）", "ctime": 1786510711, "time_str": "12:58:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260812/c678890816.shtml"}, {"id": "4943163", "title": "驻日美军一架“鱼鹰”运输机紧急着陆", "content": "据日本共同社12日报道，驻日美军一架“鱼鹰”运输机10日在栃木县的日本陆上自卫队宇都宫机场紧急着陆。美方称之为避免事故发生的“预防性着陆”。 报道称，这架“鱼鹰”运输机隶属位于东京的驻日美军横田基地，已于11日离开宇都宫机场，目前暂未收到人员伤亡或财产损失报告。 报道还称，横田基地的“鱼鹰”运输机曾多次紧急着陆。今年2月和5月分别在日本岩手县的花卷机场和神奈川县的驻日美军厚木基地发生过类似情况。 “鱼鹰”运输机事故多发。2023年11月，美军一架“鱼鹰”运输机在鹿儿岛县屋久岛附近海域坠毁，机上8人全部死亡。(新华社)", "ctime": 1786510537, "time_str": "12:55:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260812/c678890797.shtml"}, {"id": "4943131", "title": "安靠智电：公司暂未与东方电气集团合作", "content": "安靠智电8月12日在互动平台表示，公司暂未与东方电气集团合作。", "ctime": 1786509397, "time_str": "12:36:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260812/c678890647.shtml"}, {"id": "4943129", "title": "Omdia：AI需求激增 2026年半导体市场增幅上调至94.1%", "content": "Omdia发文称，由于AI需求持续超过全球供应能力，推动DRAM和NAND市场实现强劲增长，Omdia将2026年全球半导体市场营收增长预测上调至同比增长94.1%。预计2026年存储器芯片（Memory IC）收入将占全球半导体总营收的50%以上。与此同时，AI需求已超出当前半导体产业的芯片制造和封装能力，高带宽内存（HBM）、先进封装以及先进制程产能等关键环节的瓶颈预计至少将持续至2027年。", "ctime": 1786509347, "time_str": "12:35:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_sha 息，公司目前持有23.35%广州图灵股份。", "ctime": 1786507700, "time_str": "12:08:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260812/c678890296.shtml"}, {"id": "4943053", "title": "宁德时代在北京成立汽车零部件制造公司，注册资本100万", "content": "天眼查App显示，8月11日，北京时代智科汽车零部件制造有限公司成立，法定代表人为杨汉兵，注册资本100万人民币。公司经营范围含汽车零部件及配件制造、汽车零部件研发、新能源汽车电附件销售、新能源汽车换电设施销售等，注册地址位于北京市顺义区。股东信息显示，该公司由宁德时代（上海）智能科技有限公司100%持股，认缴出资100万元人民币，企业类型为有限责任公司（法人独资）。", "ctime": 1786507689, "time_str": "12:08:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260812/c678890294.shtml"}, {"id": "4943039", "title": "广西南宁大王滩水库今早起开始泄洪", "content": "记者从广西南宁市水利局了解到，大王滩水库持续超汛限水位运行，为确保水库大坝安全运行，泄洪时间为8月12日8时至8月16日8时。由于泄洪时间较长，提醒市民群众自觉远离河道行洪范围，增强安全意识。(央视新闻)", "ctime": 1786507435, "time_str": "12:03:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260812/c678890246.shtml"}, {"id": "4943033", "title": "8月12日午间公告一览：中国光大绿色环保上半年收益34.92亿港元同比增3%", "content": "中国光大绿色环保公告，截至2026年6月30日止6个月，收益为港币34.92亿元，较2025年同期增加3%。本公司权益股东应占盈利为港币1.95亿元，较2025年同期增加2%。中期股息为每股2.9港仙。", "ctime": 1786507350, "time_str": "12:02:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260812/c678890230.shtml"}, {"id": "4943029", "title": "港股午评：恒生指数跌1.17%，恒生科技指数跌1.17%", "content": "港股午间收盘，恒生指数跌1.17%，恒生科技指数跌1.17%。恒指港股通ETF银华（159318）跌0.91%，港股通科技ETF鹏华（159751）跌1.1%。板块方面，种植业、通信设备Ⅲ板块涨幅靠前；可选消费经销Ⅳ、可选消费经销Ⅲ板块跌幅靠前。个股方面，伟禄科技股份涨19.63%，MINIMAX-W涨9.51%，天岳先进涨8.47%，中国金茂涨8.42%，曦智科技-P涨8.34%；腾讯音乐-SW跌13.59%，金蝶国际跌7.9%，傅里叶跌5.66%，万洲国际跌4.78%，溜溜梅跌4.59%。", "ctime": 1786507273, "time_str": "12:01:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260812/c678890227.shtml"}, {"id": "4943023", "title": "民德电子：今年以来控股子公司广芯微电子和广微集成订单处于饱满状态", "content": "民德电子8月12日在互动平台表示，今年以来，公司控股子公司晶圆代工厂广芯微电子和设计公司广微集成，订单处于饱满状态，随着功率半导体行业步入上行周期，公司结合市场情况，近期对产品价格进行了上调。", "ctime": 1786507198, "time_str": "11:59:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260812/c678890170.shtml"}, {"id": "4943017", "title": "迈为股份全自动D2W混合键合设备获客户追加订单", "content": "近日，迈为股份全自动D2W（芯片对晶圆）混合键合设备获得国内客户追加订单。（人民财讯）", "ctime": 1786506978, "time_str": "11:56:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260812/c678890141.shtml"}, {"id": "4943001", "title": "我国主导的生命科学领域国际学术期刊《Vita》纸质刊首期发布", "content": "今天，我国主导的生命科学领域《Vita》系列期刊纸质刊首期发布。“Vita”一词源自拉丁语，中文为“生命”之意。《Vita》系列期刊由主刊《Vita》和系列子刊组成，依托“生命科学开放联盟”相关高校和机构共同建设。生命科学开放联盟由内地与港澳15家高水平高校和科研机构共同发起，于2025年8月12日在香港正式成立，目前由39所内地与港澳高校和机构共同组成，联盟将高水平科技期刊、国际化科研数据开放平台等作为重要的建设内容。《Vita》系列期刊采用“主刊+子刊”的办刊模式，学术水平上对标三大国际顶刊及其子刊，打造我国生命科学领域自主一流期刊系列。该期刊将创新建立“以文评刊”的科学评价体系，通过对各刊所载原创论文学术水平的鉴定来评估期刊学术水平，摆脱对SCI等引证指标的片面依赖，引导期刊回归学术本质，推动营造良好学术生态。（央视新闻）", "ctime": 1786506496, "time_str": "11:48:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260812/c678890083.shtml"}, {"id": "4942985", "title": "起火印尼客轮上人员均已撤离 暂无人员伤亡报告", "content": "据印度尼西亚媒体12日报道，一艘载有一百多人的客轮在当天清晨从印尼旅游胜地巴厘岛驶往邻近的龙目岛途中起火。目前船上人员均已撤离，暂无人员伤亡报告。报道说，这艘客轮是从巴厘岛帕当拜码头出发，驶往邻近的西努沙登加拉省龙目岛，在途经龙目海峡时起火。巴厘岛当地官员表示，根据登船记录，该客轮载有114名乘客和17名船员。龙目岛马塔兰搜救局负责人当天上午对媒体表示，经救援人员确认，船上所有人员均已撤离，目前未收到任何人员伤亡的报告。客轮起火的具体原因尚不清楚。（新华社）", "ctime": 1786506176, "time_str": "11:42:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260812/c678890010.shtml"}, {"id": "4942971", "title": "网传英伟达欲投资中际旭创、新易盛？公司紧急回应", "content": "近日，有市场传闻称英伟达计划斥资20亿美元战略入股光模块龙头中际旭创，资金用于新一代光模块研发、全球产能扩充以及泰国新工厂建设；同时英伟达有意成为新易盛港股IPO的基石投资者。8月12日，致电中际旭创，相关人士回应：对于该市场传闻，公司并不了解，以公司相关公告为准。同时，新易盛回应称：对于该传闻，公司不便发表评论，有关于公司H股的事项，请投资者以公告为准。（财闻）", "ctime": 1786506001, "time_str": "11:40:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260812/c678889988.shtml"}, {"id": "4942965", "title": "新西兰总理赢得党团信任投票继续担任国家党领导人", "content": "新西兰主要执政党国家党领导人、总理克里斯托弗·拉克森12日赢得本党国会党团信任投票，继续担任国家党领导人。拉克森召集本党议员当天在国会举行3个半小时的闭门会议，力图平息党内近期对其领导地位的疑虑。近期，拉克森发表的争议性言论和一些相关的媒体报道引发了公众对其领导地位的猜测。《新西兰先驱报》10日报道称，一名国家党议员说自己接到数个有关可能更换党首的电话，并表示：“最高领导职位将会发生变动，问题只在于接任者会是谁。”（新华社）", "ctime": 1786505942, "time_str": "11:39:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260812/c678889980.shtml"}, {"id": "4942943", "title": "ETF两市成交额报2421.58亿元，较昨日此时缩量130.47亿元", "content": "截至目前，ETF两市成交额报2421.58亿元，较昨日此时缩量130.47亿元，分类型来看，股票型ETF成交额793.5亿元，债券型ETF成交额1105.11亿元，货币型ETF成交额100.43亿元，商品型ETF成交额60.37亿元，QDII型ETF成交额362.17亿元。", "ctime": 1786505581, "time_str": "11:33:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260812/c678889769.shtml"}, {"id": "4942937", "title": "ETF午评：通信ETF领涨4.29%，巴西ETF跌2.85%", "content": "ETF午间收盘涨跌不一，通信ETF（159583）领涨4.29%，通信ETF（159695）涨3.95%，通信ETF（159507）涨3.85%，石油ETF（159189）领跌3.54%，巴西ETF（520870）跌2.85%，巴西ETF（159100）跌2.75%。", "ctime": 1786505506, "time_str": "11:31:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260812/c678889759.shtml"}, {"id": "4942933", "title": "A股午评：科创50指数高开高走涨2.09%，算力硬件股表现活跃", "content": "A股三大指数早盘集体上涨，截至午盘，上证指数涨0.32%，深证成指涨1.25%，创业板指涨1.73%，北证50涨0.27%，科创50指数涨2.09%。全市场成交额13912亿元，较上日缩量1376亿元，全市场超3600只个股上涨。板块题材上，光纤概念、CPO、半导体、光刻机、通信设备板块涨幅居前；油气开采及服务、煤炭开采加工、养鸡、可燃冰、芬太尼板块跌幅居前。盘面上，CPO板块高开高走，炬光科技、永鼎股份、可川科技、天洋新材涨停，长盈通、金禄电子、天孚通信涨幅居前。脑机接口板块临近午盘前大幅拉升，创新医疗、澳洋健康涨停，爱朋医疗、菲沃泰、倍益康涨幅居前。半导体材料板块表现强势，先导基电涨停，欧莱新材、天岳先进、凯德石英涨幅居前。油气开采及服务板块低开低走，首华燃气、通源石油、科力股份跌幅居前。煤炭开采加工板块震荡走低，新大洲A盘中逼近跌停，淮北矿业、陕西煤业、恒源煤业跌幅居前。", "ctime": 1786505453, "time_str": "11:30:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260812/c678889743.shtml"}, {"id": "4942931", "title": "股指期货早盘收盘 主力合约全线上涨", "content": "股指期货早盘收盘，主力合约全线上涨。沪深300股指期货(IF)主力合约涨0.53%，上证50股指期货(IH)主力合约涨0.19%，中证500股指期货(IC)主力合约涨1.03%，中证1000股指期货(IM)主力合约涨1.13%。", "ctime": 1786505418, "time_str": "11:30:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260812/c678889738.shtml"}, {"id": "4942865", "title": "脑机接口板块走高，创新医疗涨停", "content": "脑机接口板块走高，创新医疗涨停，菲沃泰涨超10%，爱朋医疗、倍益康、世运电路、三博脑科、东方中科跟涨。消息面上，浙江省人民政府办公厅印发《关于推进脑机接口产学研联动的若干措施》的通知，优化产品应用路径，制定脑机接口产品医疗应用清单，根据产品获批上市情况动态更新。", "ctime": 1786504032, "time_str": "11:07:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260812/c678889262.shtml"}, {"id": "4942863", "title": "浙江：鼓励脑机接口企业自主合理定价 开通医用耗材挂网“绿色通道”", "content": "浙江省人民政府办公厅印发《关于推进脑机接口产学研联动的若干措施》的通知。其中提到，优化产品应用路径。制定脑机接口产品医疗应用清单，根据产品获批上市情况动态更新。鼓励脑机接口企业自主合理定价，开通医用耗材挂网“绿色通道”，在申报后10个工作日内办结。鼓励医疗机构根据临床需要，按照“应配尽配”原则配备使用列入医疗应用清单的脑机接口产品，或设立临时采购绿色通道。试点开展脑机接口创新医疗器械示范推广应用项目，推动重点产品和典型场景申报国家高端医疗装备推广应用项目。", "ctime": 1786503848, "time_str": "11:04:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260812/c678889180.shtml"}, {"id": "4942861", "title": "印制电路板板块走高，宝鼎科技涨停", "content": "印制电路板板块走高，宝鼎科技涨停，金禄电子涨超10%，南亚新材、东山精密、鹏鼎控股、迅捷兴、中英科技等跟涨。", "ctime": 1786503799, "time_str": "11:03:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260812/c678889173.shtml"}, {"id": "4942851", "title": "TrendForce：DDR5 16Gb (2Gx8) 4800/5600现货均价较上日上涨0.38%", "content": "TrendForce数据显示，8月12日内存颗粒DDR5 16Gb (2Gx8) 4800/5600现货均价较上日上涨0.38%，DDR4 16Gb (2Gx8) 3200现货均价较上日上涨0 // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },

      { name: '封单', val: p.seal, w: 10 },

    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);

        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
