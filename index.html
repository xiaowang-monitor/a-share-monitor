ck_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260605/c677244159.shtml"}, {"id": "4469033", "title": "千问App发布业内首份AI健康助手指南", "content": "6月5日，千问App发布《2026 AI健康助手使用指南》。这是业内首份系统梳理AI在健康生活中所扮演角色的指南，由北京协和医院、积水潭医院、广安门医院等20位主任医师参与审核，旨在帮助大家更科学、有效地使用AI。指南将AI在健康生活中的价值归纳为五个角色：健康管家、安全守门人、就诊小助手、健康档案员、康复陪伴者。“很多人只在看不懂体检报告或身体不适时才会想起AI，”北京大学人民医院皮肤科主任医师李厚敏说，“但更应该把它看作是一个长期参与健康生活的陪伴者。”（上证报）", "ctime": 1780637332, "time_str": "13:28:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260605/c677244154.shtml"}, {"id": "4469029", "title": "2026一季度全球扫地机榜单出炉，国产品牌霸榜全球", "content": "6月4日，国际数据公司IDC发布的《全球家用智能扫地机器人市场季度跟踪报告》显示，2026年第一季度，追觅扫地机拿下全球销量与销售额双第一。 数据显示，今年一季度，全球销量前五名的扫地机器人均为中国品牌，分别为：追觅（Dreame）、石头（Roborock）、科沃斯（Ecovacs）、小米（Xiaomi）、云鲸（Narwal）。有业内人士指出，当前国产扫地机器人在全球占据主导地位，行业竞争的焦点已从能扫地转向更高维度的“AI+具身智能”，产品正在突破二维平面清洁，迈向全场景的智能家庭清洁解决方案。(大河财立方)", "ctime": 1780637194, "time_str": "13:26:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260605/c677244088.shtml"}, {"id": "4468987", "title": "港股大模型概念股大幅下跌，智谱跌超10%", "content": "港股大模型概念股大幅下跌，智谱跌超10%，MINIMAX-W港股跌超15%。", "ctime": 1780636549, "time_str": "13:15:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260605/c677243915.shtml"}, {"id": "4468979", "title": "减速器板块持续拉升", "content": "减速器板块持续拉升，绿的谐波20cm涨停，丰光精密30cm涨停，宇环数控、光洋股份涨停，吉冈精密、易实精密、鼎智科技涨超10%，步科股份、中鼎股份、恒工精密、三协电机、恒锋工具跟涨。相关ETF方面，机器人ETF易方达（159530）涨5.23%，成交额11.13亿元，机器人ETF富国（159272）涨5.27%，成交额1.71亿元。", "ctime": 1780636414, "time_str": "13:13:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260605/c677243874.shtml"}, {"id": "4468971", "title": "胜利精密：复合铜箔项目仍处于工艺优化、样品测试和量产准备阶段", "content": "胜利精密在互动平台表示，现阶段公司拥有三台磁控设备、三条水镀线，新的一条水镀线正在安装调试中，目前复合铜箔项目仍处于工艺优化、样品测试和量产准备阶段，前期已实现小批量供货，尚未取得大批量订单，公司会结合自身项目进度、市场实际需求及行业整体进度来推进投资。（第一财经）", "ctime": 1780636359, "time_str": "13:12:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260605/c677243859.shtml"}, {"id": "4468941", "title": "巴拿马副外长：希望巴中继续开展多层次对话", "content": "巴拿马外交部副部长卡洛斯·格瓦拉·曼3日晚说，巴拿马同中国的关系不仅体现在外交和经贸领域，也体现在两国人民长期以来建立的深厚友谊和文化交流中。希望双方继续开展多层次对话，推动两国关系不断发展。中国驻巴拿马大使馆3日晚在巴拿马城举行招待会，庆祝中巴建交9周年。巴拿马政府官员及社会各界代表出席。曼在致辞中说，中国长期以来为巴拿马人才培养提供了重要支持。他希望中国和巴拿马继续开展多层次对话，以尊重、共情和建设性合作为基础，推动两国关系不断发展。（新华社）", "ctime": 1780636139, "time_str": "13:08:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260605/c677243781.shtml"}, {"id": "4468939", "title": "沪深京三市成交额超2万亿元，较上日此时放量1708亿元", "content": "据同花顺iFinD数据，沪深京三市成交额超2万亿元，较上日此时放量1708亿元，预计全天成交金额约3.0万亿元。截至目前，沪市成交额8773亿元，深市成交额11005亿元，北证50成交额226亿元。", "ctime": 1780636099, "time_str": "13:08:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260605/c677243761.shtml"}, {"id": "4468929", "title": "印度Nifty 50指数抹去盘中涨幅", "content": "印度Nifty 50指数抹去盘中涨幅，最新下跌0.02%。", "ctime": 1780636034, "time_str": "13:07:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260605/c677243733.shtml"}, {"id": "4468905", "title": "腾讯姚顺雨：多模态、具身智能等很多新事物正在或即将发生", "content": "在6月5日的腾讯云AI产业应用大会上，腾讯首席AI科学家姚顺雨表示，AI未来会变得更多元。他认为，Coding Agent生产力会变得更加重要，这个世界\"还有很多空间没有被填满\"，但是多模态、具身智能等很多新事物正在或即将发生。（第一财经）", "ctime": 1780635930, "time_str": "13:05:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260605/c677243703.shtml"}, {"id": "4468855", "title": "机器人板块走高，绿的谐波涨超17%", "content": "机器人板块走高，绿的谐波涨超17%，亿嘉和、埃夫特、三丰智能、派斯林、凯尔达等跟涨。", "ctime": 1780635674, "time_str": "13:01:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260605/c677243614.shtml"}, {"id": "4468847", "title": "上海电信联手淘宝闪购上线AI助餐服务，老人“动口不动手”即可点餐到家", "content": "6月4日，在上海市民政局指导下，中国电信上海公司与淘宝闪购依托天翼智屏平台，联合启动“AI+老年助餐”智慧养老服务合作。双方将充分发挥各自在通信基础设施、人工智能技术及即时零售服务领域的优势，通过天翼智屏终端为居家老年人提供语音点餐、一键下单、即时配送等便捷助餐服务，切实满足老年群体“在家吃好饭”的民生需求。(上观新闻)", "ctime": 1780635419, "time_str": "12:56:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260605/c677243544.shtml"}, {"id": "4468825", "title": "英伟达CEO黄仁勋表示，计划与现代、三星和SK集团举行会晤", "content": "英伟达CEO黄仁勋表示，计划与现代、三星和SK集团举行会晤，将与韩国合作伙伴讨论如何协调供应链。（财联社）", "ctime": 1780635088, "time_str": "12:51:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260605/c677243499.shtml"}, {"id": "4468805", "title": "腾讯发布效率智能体工具集 助力AI提效", "content": "据腾讯消息，在2026腾讯云AI产业应用大会上，腾讯正式发布“效率智能体工具集”，旨在满足个人和企业对AI提效的多元化需求。该工具集为不同人群和20多个垂直场景提供个性化解决方案，包括面向个人用户的轻量化AI助手，职场专业人群的“Buddy家族”以及企业级平台的全栈方案。腾讯强调，工具集的设计以用户需求为核心，支持多场景应用，助力组织建立超级团队，实现从产品力到生产力的跨越。大会上，腾讯还宣布全面开放智能体能力，携手生态伙伴共建Agent产业生态。(腾讯云)", "ctime": 1780634809, "time_str": "12:46:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260605/c677243439.shtml"}, {"id": "4468787", "title": "塞内加尔疟疾防控工作取得重要进展", "content": "塞内加尔卫生官员表示，该国疟疾防控工作取得重要进展，目前全国90%的卫生区已进入疟疾“预消除”阶段。全国疟疾发病率已从2024年的约每千人23例降至2025年的每千人12例，同期疟疾死亡人数从314人降至约150人。虽然大多数卫生区已进入“预消除”阶段，但疟疾传播在部分高负担地区仍较集中。下一阶段，塞内加尔将推进《2026至2030年消除疟疾国家战略计划》实施。（新华社）", "ctime": 1780634691, "time_str": "12:44:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260605/c677243402.shtml"}, {"id": "4468781", "title": "卓创资讯：5月白银冲高回落，后市关注美联储利率决议与美伊谈判", "content": "5月以来白银冲高回落，重心窄幅下探。截至6月4日，国内现货1#白银报价17711元/千克，相较5月初累计下跌4.41%。5月初美伊释放和谈信号，叠加主要资源国秘鲁开启能源紧急法令使市场担忧矿端产出，白银价格震荡上涨，但随着主要消费国印度提升白银进口关税、美联储鸽派票委米兰辞职以及美伊在关键问题上僵持，市场交易加息预期，白银承压为主。后市来看，宏观逻辑仍在于美联储利率决议和美伊谈判，国内库存目前水位较高，消费略偏疲软未能提供基本面支撑，短期关注美国5月非农就业报告和CPI数据，预计白银价格短期难有明显方向性。（卓创资讯）", "ctime": 1780634656, "time_str": "12:44:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260605/c677243398.shtml"}, {"id": "4468753", "title": "上海开展“清朗·整治AI应用乱象”专项行动", "content": "为规范AI服务和应用，促进行业健康有序发展，保障公民合法权益，根据中央网信办统一部署，上海网信办结合属地实际，积极组织开展为期4个月的“清朗·整治AI应用乱象”专项行动。本次专项行动分两个阶段开展。第一阶段为“清朗·AI应用服务典型违规问题”专项治理行动，重点整治未按规定履行大模型备案登记义务、安全审核能力不足、大模型训练语料安全、AI数据投毒、生成合成内容标识落实不到位等问题，强化AI技术源头治理。第二阶段为“清朗·整治AI信息内容乱象”专项行动，聚焦利用AI技术生成“数字泔水”、制作发布虚假信息、散播暴力低俗等不良信息、假冒仿冒他人、侵害未成年人权益、从事网络水军活动等问题，坚决清理违法不良信息，依法处置处罚违规账号、MCN机构和网站平台。（新浪财经）", "ctime": 1780634384, "time_str": "12:39:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260605/c677243344.shtml"}, {"id": "4468729", "title": "海外618，速卖通欧洲本地订单占比过半", "content": "阿里旗下跨境电商平台速卖通AliExpress的海外618大促首日数据显示，在西班牙、法国、波兰等核心市场，速卖通从欧洲本地仓发货的订单占比首次突破50%，超越跨境直发订单。随着欧盟收紧低值包裹税收政策，依赖跨境直发的小包模式面临清关成本上升与合规压力，履约环节前置到欧洲本地成为新选择。包括速卖通、SHEIN、Temu在内的平台都在加速欧洲本地仓储布局。（界面新闻）", "ctime": 1780633240, "time_str": "12:20:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260605/c677243121.shtml"}, {"id": "4468715", "title": "追觅科技创始人兼CEO俞浩微博被禁言", "content": "6月5日消息，追觅科技创始人兼CEO俞浩微博被禁言，俞浩微博主页显示：“因违反相关法律法规，该用户目前处于禁言状态” 。（界面新闻）", "ctime": 1780632386, "time_str": "12:06:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260605/c677242815.shtml"}, {"id": "4468705", "title": "港股午评：恒生指数跌0.81%，恒生科技指数跌1.23%", "content": "港股午间收盘，恒生指数跌0.81%，恒生科技指数跌1.23%。恒指港股通ETF银华（159318）跌0.38%，港股通科技ETF鹏华（159751）跌1.08%。板块方面，保险、居家用品板块涨幅靠前；半导体产品与设备、能源设备与服务板块跌幅靠前。个股方面，天辰生物-B涨44.7%，高鑫零售涨8.55%，中兴通讯涨8.53%，中远海控涨7.32%，九方智投控股涨7.0%；量化派跌14.21%，威华达控股跌13.47%，MINIMAX-W跌13.34%，首钢朗泽跌11.68%，明略科技-W跌11.54%。", "ctime": 1780632073, "time_str": "12:01:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260605/c677242730.shtml"}, {"id": "4468703", "title": "我国轴向磁通电机研究取得新突破", "content": "6月5日，我国高性能轴向磁通电机研究新突破在浙江金华发布。盘毂动力和中国科学院宁波材料所联合研发推出的专用磁钢与轴向磁通电机的适配度显著提升，磁能积、高温稳定性、力学强度等多项指标均实现大幅提升，进一步放大了轴向磁通电机高效率、高功率/扭矩密度、长期服役稳定性的优势，实现了产品极致性能和使用成本之间的平衡，为我国轴向磁通电驱动产业链实现全流程自主创新、大规模市场应用、对标国际顶尖水平提供了关键支撑。（央视新闻）", "ctime": 1780631809, "time_str": "11:56:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260605/c677242626.shtml"}, {"id": "4468701", "title": "6月5日午间公告一览：运达股份控股股东拟与国瑞科技控股股东进行战略性重组", "content": "运达股份：公司6月5日接到控股股东浙江省机电集团有限公司告知函，根据浙江省国资委通知要求，决定实施机电集团与浙江省二轻集团有限责任公司战略性重组。该事宜不涉及公司重大资产重组事项。此次控股股东战略性重组实施完成后，公司实控人不会发生变化，仍为浙江省国资委。", "ctime": 1780631800, "time_str": "11:56:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260605/c677242625.shtml"}, {"id": "4468695", "title": "富力地产等被执行11.5亿", "content": "天眼查法律诉讼信息显示，6月3日至4日，广州富力地产股份有限公司等新增两则被执行人信息，执行标的合计11.5亿余元，执行法院分别为北京市第二中级人民法院、上海金融法院。该公司成立于1994年8月，法定代表人为李思廉，注册资本约37.5亿人民币，经营范围包括房地产开发经营、酒店管理等，由李思廉、张力、陈量暖等共同持股。风险信息显示，该公司多条被执行人、限制消费令、失信被执行人（老赖）及终本案件信息。", "ctime": 1780631517, "time_str": "11:51:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260605/c677242562.shtml"}, {"id": "4468691", "title": "河北启动重大气象灾害（暴雨）Ⅲ级应急响应", "content": "记者从河北省气象灾害防御指挥部获悉，河北于6月5日10时启动重大气象灾害（暴雨）Ⅲ级应急响应，要求相关部门密切关注此次暴雨天气过程，加强风险研判和安全隐患排查，适时启动相应级别暴雨灾害应急响应，做好防范应对工作。河北省气象台6月5日9时32分发布暴雨黄色预警，预计5日傍晚到6日，保定、廊坊以南地区有大雨到暴雨（40-90毫米），个别地点有大暴雨（100-120毫米），保定南部、石家庄、沧州、衡水、邢台北部等地的部分地区6小时累计雨量可达70毫米以上，上述部分地区有城乡积涝、农田渍涝、冬小麦倒伏等风险，山区及浅山区有出现山洪、泥石流、滑坡等次生灾害的风险。（新华社）", // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');

  }
  tbody.innerHTML = PICKS.map(p => {

      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },

    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);

        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>

  }).join('');

    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
