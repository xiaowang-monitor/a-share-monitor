}
.card:hover { background: var(--bg-card-hover); border-color: #334155; }
.badge {

.badge-s { background: rgba(239,68,68,0.2); color: #ef4444; }

  height: 6px; border-radius: 3px; background: #1e293b; overflow: hidden;
}
.score-bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s; }
.up { color: var(--red); }
.down { color: var(--green); }
.pulse { animation: pulse 2s infinite; }
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}
.glow { box-shadow: 0 0 20px rgba(59,130,246,0.15); }

const NEWS     = [{"id": "5071949", "title": "微创医疗：二零二六年中期业绩延迟，九月一日暂停买卖", "content": "微创医疗公告，公司此前披露有关建议租赁事项，现仍需进一步磋商建议租赁主要条款及保证金安排，并审阅保证金可收回性、物业装修成本合理性及与业主及其联系人关系。公司将延迟刊发截至二零二六年六月三十日止六个月的中期业绩，原定二零二六年八月三十一日举行的董事会会议将延后；股份及债务证券自二零二六年九月一日上午九时正起暂停买卖，待刊发中期业绩。", "ctime": 1788188449, "time_str": "23:00:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260831/c679461679.shtml"}, {"id": "5071947", "title": "期市夜盘收盘，国内期货主力合约多数上涨，PVC涨超3%", "content": "期市夜盘收盘，国内期货主力合约多数上涨。涨幅方面，PVC、甲醇、对二甲苯涨超3%，乙二醇、沥青、瓶片、苯乙烯、丙烯、合成橡胶、PTA涨超2%。跌幅方面，豆一、菜油、焦煤、焦炭跌超1%。", "ctime": 1788188434, "time_str": "23:00:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260831/c679461675.shtml"}, {"id": "5071889", "title": "欧盟将对ChatGPT等3家美国服务平台加强监管", "content": "欧盟委员会8月31日宣布，根据欧盟《数字服务法》，将ChatGPT认定为“超大型在线搜索引擎”，并将“红迪网站”和“罗布乐思”认定为“超大型在线平台”。这意味着这3家美国服务平台将面临欧盟更严格的监管要求。\n\n欧盟委员会当天发布新闻公报说，ChatGPT是一种能够回应用户的提示和查询并包含在线搜索功能的人工智能系统，符合《数字服务法》关于“在线搜索引擎”的定义。“红迪网站”是基于内容讨论的网络平台，“罗布乐思”是游戏和创作平台，均属于《数字服务法》所定义的“在线平台”。(新华社)", "ctime": 1788188165, "time_str": "22:56:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260831/c679461609.shtml"}, {"id": "5071883", "title": "香港首家机器人全自主零售店即将运营", "content": "由香港投资管理有限公司合办的“银河通用Galbot Store香港启动礼暨机器人巡礼”8月31日在港举行。香港首家机器人全自主零售店将于9月1日正式运营，通过实体店向市民提供与具身智能应用的互动窗口。 启动礼上，机器人与小学生开场热舞互动。消费者下单后，人形机器人店长“小盖”在完全没有工作人员遥控的状态下，凭借自主感知与决策能力流畅地完成接单、精准取货及交付的全过程，展示“全自主运营”的AI零售新模式。 香港特区政府财政司司长陈茂波致辞表示，Galbot Store以香港作为境外首站，正是看准香港场景高效多元、国际化程度高的独特价值。香港乐见并支持具身智能在此落地，在完善规则标准、确保安全的前提下，为新技术留出“敢试、可试”的空间；并联动粤港澳大湾区的先进制造实力，配合香港扎实的上游研发能力、顶尖人才，以及以港投公司为中坚的耐心资本，让创意由研发走向市场。(新华社)", "ctime": 1788188094, "time_str": "22:54:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260831/c679461599.shtml"}, {"id": "5071835", "title": "香港首个真实场景服务机器人上岗兰桂坊", "content": "8月31日，具身智能企业智平方（AI  Robotics）宣布，搭载原创类脑架构具身大模型的AlphaBot 2（爱宝）机器人，已入驻香港兰桂坊酒吧，为顾客提供打鸡尾酒与互动等服务。此次在兰桂坊上岗的生产力型通用机器人为香港首个真实场景服务机器人，智平方已完成设备出关、清关以及当地饮品售卖资质办理，并建立付费服务体系。2025年底，智平方推出模块化具身智能服务空间“智魔方”，目前已在北京、上海、深圳等十余个省市常态化运营，机器人可完成咖啡、冰淇淋、抹茶等制作。（界面新闻）", "ctime": 1788187655, "time_str": "22:47:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260831/c679461537.shtml"}, {"id": "5071809", "title": "美国财长贝森特表示，将在G20峰会期间与加拿大对口官员会面", "content": "美国财长贝森特表示，将在G20峰会期间与加拿大对口官员会面。（财联社）", "ctime": 1788187391, "time_str": "22:43:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260831/c679461501.shtml"}, {"id": "5071787", "title": "尼泊尔北部泥石流灾害已致超900人遇难", "content": "根据尼泊尔警方和尼泊尔国家减少灾害风险管理局8月31日公布的数据，截至当地时间8月31日10时30分，尼泊尔北部大规模泥石流灾害遇难人数已经超过900人。当天，尼泊尔外交部举行例行记者会，介绍了有关救援的相关情况。（央视新闻）", "ctime": 1788187209, "time_str": "22:40:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260831/c679461485.shtml"}, {"id": "5071585", "title": "意大利和西班牙互延边境管控15天", "content": "意大利政府8月31日决定，将原定于当天结束的针对西班牙入境人员的边境检查措施延长15天。作为回应，西班牙政府当天也决定将针对意大利入境人员的边境检查措施延长15天。（新华社）", "ctime": 1788185971, "time_str": "22:19:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260831/c679461240.shtml"}, {"id": "5071561", "title": "日本三个在野党决定现阶段放弃合并", "content": "日本在野党“中道改革联合”、立宪民主党和公明党31日下午在国会内举行党首会谈，正式决定现阶段放弃三党合并。“中道改革联合”代表小川淳也在党首会谈上表示，希望探索让中道政治力量“重新启动”的新形式。立宪民主党党首水冈俊一表示，今后将重新就如何抗衡高市政权展开协商。公明党党首竹谷俊子表示，公明党此前曾推动本党参议院议员加入“中道改革联合”，并为合并后的地方组织调整作准备，但鉴于立宪民主党已决定不进行组织层面的合并，公明党也不会单独加入。（新华社）", "ctime": 1788185760, "time_str": "22:16:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260831/c679461209.shtml"}, {"id": "5071479", "title": "习近平会见俄罗斯总统普京（详讯）", "content": "当地时间8月31日下午，国家主席习近平在比什凯克出席2026年上海合作组织峰会期间会见俄罗斯总统普京。\n\n习近平指出，今年5月，普京总统成功对中国进行国事访问，我们从战略高度和长远角度，对引领两国关系向更高质量、更高水平发展作出部署，就新形势下深化中俄各领域合作达成共识。两国主管部门正在积极落实，已经取得很多成果，双方的交流合作保持着蓬勃发展势头。相信在我们的战略引领和双方共同努力下，中俄关系发展的根基将更加牢固、步伐将更加笃定、前景将更加光明。（央视新闻）", "ctime": 1788185201, "time_str": "22:06:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260831/c679461108.shtml"}, {"id": "5071403", "title": "习近平会见乌兹别克斯坦总统米尔济约耶夫（全文）", "content": "当地时间8月31日下午，国家主席习近平在比什凯克出席2026年上海合作组织峰会期间会见乌兹别克斯坦总统米尔济约耶夫。\n\n习近平指出，今年是中乌建立全面战略伙伴关系10周年。在我们共同引领下，两国关系持续提质升级，各领域合作硕果累累，中乌命运共同体建设成就斐然。中方愿同乌方一道，巩固战略互信，深化互利合作，共创中乌关系新的“黄金10年”。（央视新闻）", "ctime": 1788184589, "time_str": "21:56:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260831/c679460968.shtml"}, {"id": "5071369", "title": "协创数据：tokenshare.ai（net）为公司token业务的运营网站，处于试运行测试阶段", "content": "协创数据8月31日在互动平台表示，tokenshare.ai（net）为公司token业务的运营网站，目前处于试运行测试阶段。", "ctime": 1788184374, "time_str": "21:52:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260831/c679460947.shtml"}, {"id": "5071345", "title": "刚果（金）埃博拉确诊病例超6000例", "content": "刚果（金）卫生部8月31日公布的最新数据显示，该国本轮埃博拉疫情累计确诊病例已超过6000例，死亡病例超过2900例。\n\n数据显示，截至29日，刚果（金）6个省累计报告埃博拉确诊病例6041例，其中死亡2911例，病死率为48.2%。目前，疫情已波及伊图里、北基伍、南基伍、上韦莱、下韦莱和乔波6个省的60个卫生区。\n\n刚果（金）5月15日宣布暴发埃博拉疫情。世界卫生组织总干事谭德塞8月12日说，刚果（金）本轮疫情“已是有记录以来第二大埃博拉疫情”。世卫组织专家26日说，本轮疫情传播仍十分活跃，尚未出现拐点。(新华社)", "ctime": 1788184162, "time_str": "21:49:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260831/c679460909.shtml"}, {"id": "5071339", "title": "土耳其外长：土巴沙防务机制将扩大", "content": "土耳其外交部长菲丹8月31日在伊斯坦布尔表示，随着土耳其、巴基斯坦和沙特阿拉伯签署《麦加共同防御协议》，地区建立新的安全与合作架构的进程已经启动。菲丹当天在该协议框架下设立的战略政治与防务委员会首次会议后表示，这一防务联盟“从成立之初就是为了扩大”，未来随着联盟发展，地区稳定性将进一步增强，不确定性将减少。（央视新闻）", "ctime": 1788184096, "time_str": "21:48:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260831/c679460897.shtml"}, {"id": "5071313", "title": "快手：国家人工智能基金向北京可灵注入现金资本14亿元", "content": "快手在港交所公告称，北京可灵31日分别与国家人工智能基金及Charoen Pokphand Robot Limited（正大机器人）订立加入协议，据此，国家人工智能基金及正大机器人各自同意作为额外投资者成为增资协议的订约方，并分别向北京可灵注入现金资本人民币1,400.00百万元 及约19.29百万美元（相当于约人民币131.45百万元）（分别对应北京可灵註册资本人民币1,097,518元及人民币103,047元，分别占经认购事项及附属公司股份参与计划的    实施扩大后北京可灵註册资本的约1.14%及0.11%（假设认购限额及附属公司股份参与计划的计划授权限额均获悉数动用））。同日，北京可灵分别与国家人工智能基金及正大机器人订立股东协议的加入协议，据此（其中包括），国家人工智能基金及正大机器人均获授予回购权。", "ctime": 1788183966, "time_str": "21:46:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260831/c679460884.shtml"}, {"id": "5071289", "title": "税收法规执行标准更新，伊利、蒙牛、新乳业补税", "content": "蒙牛发布的半年报显示，截至2026年6月30日止6个月，该公司所得税支出为11.49亿元，2025年同期为6.85亿元，同比上升67.9%；所得税有效税率为31.5%，2025年同期为24.1%，同比上升7.4个百分点。“所得税增加主要由于本集团根据国家税收法律法规的相关要求，调整缴纳所得税金额人民币3.2亿元。”该公司解释。新乳业发布的半年报显示，其上半年所得税费用同比增长115.28%至1.1亿元。“主要系国家税收法律法规执行标准更新，导致企业所得税费用增加。”新乳业在财报中解释。银河证券研报则提到，在上半年，伊利所得税费用同比增加7.5亿元，主要系税收法规执行标准更新，纳税基数有所提升。（21世纪经济报道）", "ctime": 1788183787, "time_str": "21:43:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260831/c679460859.shtml"}, {"id": "5071205", "title": "NYMEX取暖油主力合约涨超4%", "content": "NYMEX取暖油主力合约涨超4%，现报4.42美元/加仑。", "ctime": 1788183422, "time_str": "21:37:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260831/c679460749.shtml"}, {"id": "5071083", "title": "美股开盘：美股三大指数集体低开", "content": "美股三大指数集体低开，标普500指数跌0.23%，道指跌0.39%，纳指跌0.18%。大型科技股方面，亚马逊跌1.14%，谷歌A跌1.16%。中概股方面，携程涨1.39%，拼多多跌1.55%，阿里巴巴跌2.09%。", "ctime": 1788183045, "time_str": "21:30:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260831/c679460674.shtml"}, {"id": "5071049", "title": "美联储主席沃什：当前时期是全球投资激增的阶段", "content": "美联储主席沃什：当前时期是全球投资激增的阶段。", "ctime": 1788182992, "time_str": "21:29:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260831/c679460662.shtml"}, {"id": "5071001", "title": "机器人六维力传感器实现国产主导切换 头部厂商市占率突破80%", "content": "8月31日，赛迪发布《2026年中国人形机器人六维力传感器市场调研报告》。报告显示，2025年中国人形机器人六维力传感器市场呈现极高寡占型格局，行业前三厂商合计占据92.8%的市场份额，其中蓝点触控以超过80%的市场份额位居首位，坤维科技、宇立仪器分别占据9.2%和3.3%的市场份额，整体市场形成“一超主导、长尾跟随”的产业结构。国内市场竞争格局已完成结构性切换，彻底告别此前外资品牌主导的发展阶段。多家机构一致预测2026—2027年行业将维持数倍级同比增长。报告预计。2030年国内六维力传感器出货量约120万颗，对应市场规模约60亿元，复合年均增长率超过100%。（科创板日报）", "ctime": 1788182834, "time_str": "21:27:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260831/c679460636.shtml"}, {"id": "5070999", "title": "沃什：我此前与贝森特的合作已证明富有成效", "content": "沃什：我此前与贝森特的合作已证明富有成效。", "ctime": 1788182826, "time_str": "21:27:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260831/c679460635.shtml"}, {"id": "5070843", "title": "贝森特：摆脱债务的唯一途径是通过经济增长走出债务困境", "content": "贝森特：摆脱债务的唯一途径是通过经济增长走出债务困境。", "ctime": 1788181939, "time_str": "21:12:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260831/c679460442.shtml"}, {"id": "5070839", "title": "中国巨石据悉已正式上调9月份电子布价格", "content": "记者自中国巨石获悉，公司已正式上调9月份电子布价格，其中厚布涨价15%、薄布上涨20%。2026年上半年，中国巨石电子布销量为5.44亿米，同比增长超12%。在产品研发方面，公司介绍，低介电系列玻纤及电子布产品的研发、客户认证及送样工作正有序推进，将根据客户验证进度与市场需求，稳步推进产品落地与产能释放。在具体扩产进展上，中国巨石称，巨石集团淮安有限公司年产10万吨电子级玻璃纤维零碳智能生产线于3月和6月分期点火投产，目前已达到满产状态。巨石集团淮安有限公司年产5万吨电子纱暨3.2亿米电子布生产线建设项目建设周期为1.5年，目前正在建设中。产能释放后，电子布总体供给是否会过剩？对此，中国巨石回应称，玻纤行业项目建设周期较长，扩产还受资金、窑炉建设、高端设备交付等多重条件约束。新增有效供给释放有限，行业供需格局整体有望维持相对平稳。在资本开支方面，公司后续计划聚焦主业、稳健投入，重点用于高端玻纤及电子布产品产能建设、现有产线技改升级、工艺优化及智能化、绿色化改造等领域，持续优化产品结构。(上海证券报)", "ctime": 1788181930, "time_str": "21:12:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260831/c679460437.shtml"}, {"id": "5070823", "title": "欧林生物：陈爱民拟减持公司不超过0.0338%股份", "content": "欧林生物公告，董事、副总经理陈爱民持有公司股份54.81万股，占公司总股本的0.14%，因个人资金需求，拟通过集中竞价或大宗交易方式减持不超过13.7万股，占公司总股本的比例不超过0.0338%，减持期间为2026年9月22日至2026年12月21日。", "ctime": 1788181889, "time_str": "21:11:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260831/c679460431.shtml"}, {"id": "5070815", "title": "美国称霍尔木兹海峡没有船只触碰到水雷", "content": "美国称霍尔木兹海峡没有船只触碰到水雷。（财联社）", "ctime": 1788181872, "time_str": "21:11:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260831/c679460430.shtml"}, {"id": "5070747", "title": "巴基斯坦总理与伊朗总统举行会晤 讨论双边合作", "content": "8月31日，巴基斯坦总理夏巴兹·谢里夫与伊朗总统马苏德·佩泽希齐扬在吉尔吉斯斯坦举行的上海合作组织峰会期间举行会谈。双方就巴伊双边关系与合作的最新进展，以及进一步加强两国互动与合作的途径交换意见。谢里夫与佩泽希齐扬强调，应充分利用现有合作潜力和资源，推动两国在各领域进一步发展和深化双边关系。（央视新闻）", "ctime": 1788181674, "time_str": "21:07:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260831/c679460363.shtml"}, {"id": "5070717", "title": "OpenAI：ChatGPT广告的年化收入已达到10亿美元", "content": "OpenAI称，自上线不到200天，ChatGPT广告的年化收入已达到10亿美元。", "ctime": 1788181605, "time_str": "21:06:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260831/c679460329.shtml"}, {"id": "5070701", "title": "特朗普称将“狠狠打击”伊朗", "content": "美国总统特朗普8月31日说，将对伊朗袭击美国驻约旦基地进行回击。特朗普当天在接受美国福克斯新闻频道采访时表示，对伊朗的袭击“一定会有回应”，“我们将狠狠打击他们（伊朗）”。特朗普称，美军防空系统在应对伊朗袭击时“放过了一枚导弹，因为它不会击中任何目标”，其他导弹均被拦截。伊朗外交部和军方8月31日说，作为对美军袭击伊朗拉腊克岛的回应，伊朗武装力量对约旦和阿联酋境内美军目标实施打击，并击落一架美军MQ-9无人机。（新华社）", "ctime": 1788181581, "time_str": "21:06:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260831/c679460323.shtml"}, {"id": "5070457", "title": "期市夜盘开盘，国内期货主力合约多数上涨，乙二醇涨超4%", "content": "期市夜盘开盘，国内期货主力合约多数上涨。涨幅方面，乙二醇涨超4%，瓶片、原油、甲醇、燃油、丙烯涨超3%，纯苯、苯乙烯、沥青、PVC涨超2%。跌幅方面，沪银跌超2%，纸浆、沪金跌超1%。", "ctime": 1788181199, "time_str": "20:59:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260831/c679460228.shtml"}, {"id": "5070431", "title": "赵乐际同奥地利国民议会议长罗森克兰茨会谈", "content": "全国人大常委会委员长赵乐际31日在北京人民大会堂同奥地利国民议会议长罗森克兰茨举行会谈。 赵乐际表示，2018年，习近平主席同范德贝伦总统共同确立中奥友好战略伙伴关系，开启双边关系发展新阶段，两国各领域务实合作取得丰硕成果。今年是中奥建交55周年，中方愿同奥方一道，落实两国领导人重要共识，巩固传统友好，深化互利合作，不断丰富中奥友好战略伙伴关系内涵。 赵乐际指出，双方要巩固政治互信，保持高层交往良好势头，加强政策沟通，照顾彼此核心利益和重大关切。拓展经贸合作，加强人工智能、数字经济、绿色发展等新兴领域合作，推动两国产业向新、向绿、向好发展。加强人文交流，出台更多务实举措，便利两国民众常来常往，夯实双边关系民意基础。深化多边协作，加强在国际事务中的协调配合，共同维护联合国权威和地位，维护自由贸易和多边贸易体制，推动构建更加公正合理的全球治理体系。中方愿同欧盟通过对话协商方式妥善解决经贸合作中的矛盾分歧，在发展中实现动态平衡。 (新华社)", "ctime": 1788181097, "time_str": "20:58:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260831/c679460211.shtml"}, {"id": "5070383", "title": "尹弘主持召开专题会议研究大健康产业培育发展工作", "content": "8月31日，江西省委书记尹弘主持召开专题会议，研究大健康产业培育发展工作。他强调，要深入贯彻习近平总书记关于健康中国重要论述，立足资源禀赋与产业基础，聚焦更好满足人民群众对美好生活的向往，发挥独特优势，精准发力突破，积极培育新技术新产品新模式新业态，加快推动大健康产业高质量发展。尹弘认真听取省发展改革委、省工业和信息化厅、省卫生健康委、省文化和旅游厅等关于大健康产业培育发展有关工作情况汇报，就产业发展具体问题与大家深入交流。他指出，推动大健康产业发展，不仅有利于增进人民群众健康福祉，也有利于我省优化产业结构、培育新的经济增长点。要从贯彻落实健康中国战略、提高群众健康水平的高度，加快培育发展大健康产业，坚持政府引导、需求牵引，加大投资于人的力度，持续增加有效供给，积极推进“治已病”到“治未病”转变，全力推动大健康产业规模化、融合化发展。（江西发布）", "ctime": 1788180765, "time_str": "20:52:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260831/c679460140.shtml"}, {"id": "5070359", "title": "星邑空间完成数亿元A轮融资 加速全球测控站网建设", "content": "航天器测运控解决方案服务商星邑空间正式完成A轮增资扩股暨战略投资人引入。此次A轮股权融资募集资金达数亿元人民币，引入了苏创投、力合清瞳、七匹狼控股、智宸投资、兰溪资本、海锶创投等多家知名投资机构。本轮融资落地后，将加速全球测控站网建设，进一步夯实大型星座测控管理、精密轨道确定与控制等关键技术能力。（财联社）", "ctime": 1788180619, "time_str": "20:50:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260831/c679460081.shtml"}, {"id": "5070345", "title": "晓程科技：周劲松、王含静拟减持公司不超过0.079%股份", "content": "晓程科技公告，董事周劲松拟减持不超过93750股，占公司总股本0.035%；高级管理人员王含静拟减持不超过12.25万股，占公司总股本0.045%，合计不超过21.62万股，占公司总股本0.079%。减持期间为2026年9月22日—2026年12月21日，方式为集中竞价交易。", "ctime": 1788180534, "time_str": "20:48:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260831/c679460046.shtml"}, {"id": "5070337", "title": "5连板捷荣技术：涉及AI液冷相关的精密结构件业务收入占公司营业收入比重极低", "content": "捷荣技术公告，针对市场关注公司为“AI液冷概念股”的情况，公司主营业务为生产、设计、研发及销售精密结构件，公司所销售的精密结构件产品中，涉及AI液冷相关的精密结构件业务收入占公司营业收入比重极低，经粗略统计，该部分业务收入不超过公司2026年上半年营业收入的1%，该业务对公司经营业绩不构成重大影响。针对市场关注公司为“折叠屏概念股”的情况，公司主营业务为生产、设计、研发及销售精密结构件，公司所销售的精密结构件产品中，涉及折叠屏相关的精密结构件业务收入占公司营业收入比重极低，经粗略统计，该部分业务收入不超过公司2026年上半年营业收入的1%，该业务对公司经营业绩不构成重大影响。", "ctime": 1788180513, "time_str": "20:48:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260831/c679460033.shtml"}, {"id": "5070331", "title": "伊朗副外长强硬回应拉腊克岛遭袭", "content": "伊朗塔斯尼姆通讯社8月31日报道，伊朗副外长加里巴巴迪就周日（30日）晚美军袭击伊朗拉腊克岛一事表示，美方的“侵略”行径将得到应有回应。此前，据多家美国媒体30日报道，美军当天打击了位于霍尔木兹海峡附近伊朗拉腊克岛上的两个火箭发射装置。此次行动是美军一个月来首次对伊朗目标实施军事打击。针对美方此次行动，加里巴巴迪表示，“我们将此次‘侵略’视为对我国发动的军事攻击”，并补充说，正如伊朗武装部队所展现的那样，“任何对我国领土完整的侵略，无论程度如何，都将得到坚决回应。”（环球网）", "ctime": 1788180486, "time_str": "20:48:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260831/c679460029.shtml"}, {"id": "5070325", "title": "2连板竞业达：股东江源东8月31日卖出竞业达股票231.38万股 本次减持执行完毕", "content": "竞业达公告，股票于2026年8月28日、2026年8月31日连续两个交易日收盘价格涨幅偏离值累计达到20.84%。公司目前主要在教育、考试业务的平台软件中嵌入智能体模块，独立销售的智能体相关业务收入占公司营业收入比重极低，经粗略统计， // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// 精选个股

  tbody.innerHTML = PICKS.map(p => {

      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },

    const miniBar = dims.map(d => {

      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>

  }).join('');

    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
