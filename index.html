<style>
:root {
  --bg-primary: #0a0e17;
  --bg-card: #111827;

  --border: #1e293b;
  --text-primary: #e2e8f0;

  --blue: #3b82f6;
  --purple: #8b5cf6;

* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Noto Sans SC', sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  min-height: 100vh;
}
.mono { font-family: 'JetBrains Mono', monospace; }
.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 20px;
  transition: all 0.2s;
}
.card:hover { background: var(--bg-card-hover); border-color: #334155; }
.badge {
  display: inline-flex; align-items: center; padding: 2px 8px;
  border-radius: 6px; font-size: 12px; font-weight: 500;
}
.badge-s { background: rgba(239,68,68,0.2); color: #ef4444; }
.badge-a { background: rgba(245,158,11,0.2); color: #f59e0b; }
.badge-b { background: rgba(59,130,246,0.2); color: #3b82f6; }
.badge-c { background: rgba(100,116,139,0.2); color: #94a3b8; }
.score-bar {
  height: 6px; border-radius: 3px; background: #1e293b; overflow: hidden;
}
.score-bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s; }
.up { color: var(--red); }
.down { color: var(--green); }
.pulse { animation: pulse 2s infinite; }
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}
.glow { box-shadow: 0 0 20px rgba(59,130,246,0.15); }
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg-primary); }
::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
</style>

        </table>

  </div>

支上调的增量需求来源于两方面：一、市场需求持续上行，客户强烈要求台积电同步扩充产能；第二，设备通胀抬升采购成本。（财联社）", "ctime": 1784193015, "time_str": "17:10:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260716/c678226007.shtml"}, {"id": "4738895", "title": "兴业银锡：公司发行H股上市申请已发回", "content": "兴业银锡公告，公司已于2026年5月25日向香港联交所递交发行境外上市股份（H股）并在香港联交所主板挂牌上市的申请，但该申请已发回。发回原因系合资格人士报告（即矿业报告）有效日期及预计招股书刊发日期需更新。公司正在补充更新申请资料，预计将在完成以2026年6月30日为基准日的申请文件更新后，在本季度内重新递交上市申请。本次发行上市尚需取得香港证监会、香港联交所及中国证券监督管理委员会等监管机构的批准或核准。", "ctime": 1784192972, "time_str": "17:09:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260716/c678225992.shtml"}, {"id": "4738889", "title": "万讯自控：上半年净利润亏损146.63万元，上年同期亏损1171.09万元", "content": "万讯自控发布业绩快报，上半年营业收入4.63亿元，同比下降7.23%。净利润亏损146.63万元，上年同期亏损1171.09万元。报告期内，受市场供需波动及产品销售结构战略性调整双重因素影响，公司营业收入同比小幅下降。与此同时，公司持续深化降本增效工作，优化资产运营效率，合理管控各项费用支出，本期归属于上市公司股东的净亏损同比收窄。", "ctime": 1784192850, "time_str": "17:07:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260716/c678225899.shtml"}, {"id": "4738887", "title": "realme在中国市场暂停产品更新，未来将聚焦海外市场", "content": "7月16日，记者从OPPO方面获悉，为了进一步整合集团资源，实现全球产品战略的协同，未来realme新品将聚焦海外市场，在中国市场暂停产品更新；一加在中国市场的产品更新保持不变。（界面新闻）", "ctime": 1784192826, "time_str": "17:07:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260716/c678225891.shtml"}, {"id": "4738885", "title": "陈文清会见越共中央政治局委员、中央内政部部长黎明智", "content": "中共中央政治局委员、中央政法委书记陈文清15日在京会见越共中央政治局委员、中央内政部部长黎明智。 陈文清指出，习近平总书记同苏林总书记为中越命运共同体建设在新的历史锚点上接续跃升作出关键战略引领。希望双方落实两党两国最高领导人最新重要共识，聚焦“安全合作更实”目标，持续深化国家安全、社会治安、司法改革等领域交流合作。 黎明智表示，愿加强社会主义法治国家建设交流互鉴，为越中携手同行社会主义道路提供法治保障。(新华社)", "ctime": 1784192808, "time_str": "17:06:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260716/c678225881.shtml"}, {"id": "4738883", "title": "欧元区5月季调后贸易逆差49.7亿欧元，前值为顺差13亿欧元", "content": "欧元区5月季调后贸易逆差49.7亿欧元，前值为顺差13亿欧元。", "ctime": 1784192770, "time_str": "17:06:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260716/c678225865.shtml"}, {"id": "4738871", "title": "中广核“元曜一号”光热熔盐槽式集热器型号发布", "content": "记者从中国广核集团获悉，7月16日，全球首个8.6米开口光热熔盐槽式集热器型号中广核“元曜一号”在青海西宁发布。该型号在光电转换效率与全链条自主可控方面取得重要进展，为我国光热发电规模化发展提供核心技术支撑。（人民财讯）", "ctime": 1784192686, "time_str": "17:04:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260716/c678225815.shtml"}, {"id": "4738867", "title": "预告 | 国新办7月21日举行“开局起步‘十五五’”系列主题新闻发布会", "content": "国务院新闻办公室将于2026年7月21日（星期二）上午10时举行“开局起步‘十五五’”系列主题新闻发布会，请交通运输部副部长徐成光和国家铁路局、中国民航局、国家邮政局负责人介绍加快建设交通强国、完善现代化综合交通运输体系有关情况，并答记者问。（国务院新闻办公室）", "ctime": 1784192668, "time_str": "17:04:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260716/c678225808.shtml"}, {"id": "4738865", "title": "三江购物：阿里泽泰减持公司2%股份，减持计划实施完毕", "content": "三江购物公告，持股5%以上股东杭州阿里巴巴泽泰信息技术有限公司于2026年4月29日至2026年7月15日期间，通过集中竞价交易减持547.68万股、大宗交易减持547.68万股，合计减持1095.36万股，占公司总股本的2.00%，减持价格区间为9.43～13.04元/股，减持总金额1.2亿元。本次减持计划已实施完毕，阿里泽泰当前持股数量为1.37亿股，持股比例由27.00%降至25.00%。", "ctime": 1784192666, "time_str": "17:04:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260716/c678225806.shtml"}, {"id": "4738861", "title": "探路者：预计上半年净利润同比增长128.92%～178.69%", "content": "探路者公告，预计2026年上半年净利润为4600万元到5600万元，同比增长128.92%到178.69%。本报告期公司业绩同比实现大幅增长，主要影响因素有，一是芯片业务发展整体向好，公司新收购的上海通途和深圳贝特莱纳入合并报表范围，同比增加了利润贡献；二是户外板块营业收入虽实现增长，但因业务调整，相关费用投入加大，导致同比经营利润下降；三是本期受汇率波动影响实现汇兑收益，而去年同期产生汇兑损失，同比导致产生利润贡献。", "ctime": 1784192609, "time_str": "17:03:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260716/c678225767.shtml"}, {"id": "4738859", "title": "王沪宁出席《中朝友好合作互助条约》签订65周年纪念招待会", "content": "7月16日，率中国党政代表团对朝鲜进行正式友好访问的中共中央政治局常委、全国政协主席王沪宁在平壤同朝鲜劳动党中央政治局常委、国务委员会副委员长、内阁总理朴泰成共同出席《中朝友好合作互助条约》签订65周年纪念招待会并致辞。 王沪宁表示，65年前，中朝老一辈领导人签署《中朝友好合作互助条约》，为巩固两国人民战斗友谊奠定了重要政治法律基础。65年来，双方秉持条约精神，相互支持、团结协作、并肩奋斗，政治互信持续巩固，交流合作与时俱进，战略协作日益深化，生动诠释了中朝关系世代友好、命运与共、守望相助的鲜明特征。中方愿同朝方一道，坚决贯彻落实好习近平总书记同金正恩总书记达成的重要共识，以共同隆重纪念《中朝友好合作互助条约》签订65周年为契机，弘扬优良传统，牢牢把握中朝关系前进航向；深化交流互鉴，持续增进两国人民福祉和友谊；彰显时代担当，携手促进地区和世界和平稳定。 朴泰成表示，《朝中友好合作互助条约》签订65年来，为大力推进朝中关系和两国社会主义事业发展、维护东北亚和平稳定与安全作出了重要贡献。今天我们隆重举行纪念活动，充分展现条约的重大战略意义和朝中友谊的强大生命力。朝方愿遵循金正恩总书记和习近平总书记达成的重要共识，继续弘扬条约精神，不断加强以社会主义为核心的朝中关系，共同谱写朝中友谊新篇章。 其间，朝方表演了歌颂中朝友谊的经典曲目。 王东峰出席活动，中朝双方约200人参加。(新华社)", "ctime": 1784192598, "time_str": "17:03:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260716/c678225761.shtml"}, {"id": "4738857", "title": "恒瑞医药：HRS9531获III期临床，投入约7.01亿元", "content": "恒瑞医药公告，子公司福建盛迪医药收到国家药监局核准签发的HRS9531注射液的《药物临床试验批准通知书》，同意本品在肥胖合并膝骨关节炎成人患者中开展Ⅲ期临床试验。HRS9531是一款新型靶向GIPR和GLP-1R的双激动剂，其用于成人长期体重管理的上市申请已于2025年9月获国家药监局受理。截至目前，HRS9531相关项目累计研发投入约7.01亿元（未经审计）。", "ctime": 1784192597, "time_str": "17:03:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260716/c678225760.shtml"}, {"id": "4738849", "title": "印尼一客船倾覆 已致1死24失踪", "content": "当地时间7月16日，印尼搜救部门表示，一艘客船15日在印尼南苏拉威西省附近海域因发动机故障倾覆，已造成1人死亡、24人失踪，另有49人获救。印尼国家搜救局官员安瓦尔表示，事故发生后，经核实后确认，事发时船上共有74人。目前，搜救工作仍在进行中。印尼是世界最大的群岛国家，岛屿之间交通高度依赖渡船和小型船只，海上交通事故时有发生。（央视新闻）", "ctime": 1784192563, "time_str": "17:02:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260716/c678225739.shtml"}, {"id": "4738847", "title": "华阳新材：出售全资子公司100%股权已完成，转让价1元", "content": "华阳新材公告，公司此前披露拟将全资子公司山西华阳生物降解新材料有限责任公司100%股权以非公开协议方式转让给控股股东太原化学工业集团有限公司，转让价格为1元。近日，生物新材公司已办结股权工商变更登记手续，公司不再持有其任何股权。同时，生物新材公司对公司借款本息已全部清偿，太化集团已为存续关联担保提供反担保。本次股权转让事项全部完成。", "ctime": 1784192558, "time_str": "17:02:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260716/c678225738.shtml"}, {"id": "4738827", "title": "宁德时代宜春锂矿复产传闻引关注，环评审批仍存疑虑", "content": "宁德时代枧下窝锂矿在停产十个月后，复产传闻持续升温。7月7日，宜春时代新能源矿业有限公司获得非煤矿山企业安全生产许可，许可范围为3000万吨/年。一位接近宁德时代的人士表示，目前采矿、选矿、冶炼环节均已复产，预计一两周内可满产。然而，记者实地探访发现，选矿厂暂无运输卡车进出，矿区内有工作人员进行实地测量和插旗作业，山坡上有挖掘机正在作业。法律人士表示，这些作业在法律意义上可能属于“筹备”而非“生产”。外界疑虑的焦点集中在环评审批环节。该项目自2025年12月发布第一次环评信息公示后，后续环评报告编制及审批进展均无公开信息可供查询。虽然接近宁德时代的人士称，恢复生产的前置手续都已办完，包括已依法依规取得政府的环评审批，但环评报告未按法定程序公示，环评进度在首次公示后“断档”长达半年，使得枧下窝锂矿的复产在法律程序上仍存明显瑕疵。在环评批复公开公示之前，枧下窝锂矿是否已正式复产，仍是一个悬而未决的问号。（上海证券报）", "ctime": 1784192462, "time_str": "17:01:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260716/c678225698.shtml"}, {"id": "4738823", "title": "金风科技：获准注册发行20亿元长期限含权中期票据", "content": "金风科技公告，公司收到中国银行间市场交易商协会的《接受注册通知书》，同意接受公司本次中期票据注册，注册金额为人民币20亿元，注册额度自《接受注册通知书》落款之日起2年内有效。", "ctime": 1784192461, "time_str": "17:01:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260716/c678225697.shtml"}, {"id": "4738815", "title": "川金诺：预计2026年上半年净利润1.1亿-1.3亿元，同比下降26.76%-38.03%", "content": "川金诺公告，预计2026年上半年营业收入20亿元-22亿元，同比增长14.68%-26.14%；归属于上市公司股东的净利润1.1亿元-1.3亿元，上年同期为1.77亿元，同比下降26.76%-38.03%；扣除非经常性损益后的净利润1.05亿元-1.25亿元，同比下降24.94%-36.95%。业绩变动原因：营业收入同比上升主要系产品销售价格上涨；净利润同比下降主要因核心原材料硫元素采购成本上涨、综合毛利率同比降低、财务费用及管理费用同比上升。", "ctime": 1784192451, "time_str": "17:00:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260716/c678225693.shtml"}, {"id": "4738731", "title": "伊朗称摧毁美军多处中东基地设施", "content": "据伊朗伊斯兰共和国通讯社16日报道，在新一波攻势中，伊朗摧毁了美军位于巴林、科威特、约旦境内的多处军事基地设施。报道说，伊朗摧毁了美军位于巴林的谢赫伊萨空军基地雷达探测与空中控制系统及抽油泵站，同时还 // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
