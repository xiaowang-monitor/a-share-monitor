发展理念，加快构建新发展格局，着力推动高质量发展。中国将坚持自由贸易，不断深化对外合作，稳步扩大制度型开放，高质量共建“一带一路”，促进全球贸易和投资自由化便利化，维护和发展开放型世界经济。中国将始终是全球发展的确定性基石与稳定性港湾。（央视新闻）", "ctime": 1775029935, "time_str": "15:52:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260401/c675692601.shtml"}, {"id": "4173225", "title": "南向资金净卖出超100亿港元", "content": "据同花顺iFinD数据，截至目前，南向资金净卖出超100亿港元，其中港股通（沪）卖出超62.65亿港元，港股通（深）卖出超39.13亿港元。", "ctime": 1775029619, "time_str": "15:46:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260401/c675692416.shtml"}, {"id": "4173209", "title": "工银投资、江苏国资等新设智造股权投资合伙企业", "content": "企查查APP显示，近日，苏州高投毅达战新智造股权投资合伙企业（有限合伙）成立，出资额10亿元，经营范围包含：创业投资（限投资未上市企业）；股权投资。企查查股权穿透显示，该企业由江苏苏州高端装备产业专项母基金（有限合伙）、工银金融资产投资有限公司、江苏高科技投资集团有限公司等共同出资。（人民财讯）", "ctime": 1775029487, "time_str": "15:44:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260401/c675691926.shtml"}, {"id": "4173187", "title": "中国物流集团湖南有限公司成立", "content": "企查查APP显示，近日，中国物流集团湖南有限公司成立，注册资本2亿元，经营范围包含航空运输货物打包服务、园区管理服务、船舶租赁、供应链管理服务等。企查查股权穿透显示，该公司由中国物流集团有限公司等共同持股。（人民财讯）", "ctime": 1775029342, "time_str": "15:42:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260401/c675691869.shtml"}, {"id": "4173181", "title": "覆盖消费品、能源交通等领域 《2025年5G工厂典型应用实践》发布", "content": "工业和信息化部今天（4月1日）发布《2025年5G工厂典型应用实践》。这些典型应用实践是从全国上千家5G工厂遴选出来的100个技术先进、标杆引领的5G工厂应用实践项目，覆盖装备、消费品、原材料工业和电子信息、能源交通领域。据了解，这100个应用实践项目的5G网络覆盖率超过99%，现场装备联网率和无线设备5G联网率都超过97%。数据显示，百家5G工厂平均产能增加24.7%，平均运营成本降低18.4%，平均产品质量提升20.5%，有效推动制造业提质增效、绿色发展。（央视新闻）", "ctime": 1775029261, "time_str": "15:41:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260401/c675691831.shtml"}, {"id": "4173179", "title": "卡塔尔能源公司证实旗下一艘油轮遭导弹袭击", "content": "总台记者获悉，当地时间4月1日，卡塔尔能源公司发布声明，证实该公司租用的一艘油轮当天凌晨在卡塔尔北部领海遭到导弹袭击。声明表示，船上所有船员均未受伤，此次事件也没有对环境造成任何影响。卡塔尔国防部4月1日表示，卡塔尔当天遭遇来自伊朗的三枚巡航导弹袭击，卡方成功拦截其中2枚，第三枚导弹击中了停泊在卡塔尔领海内、由卡塔尔能源公司租赁的一艘油轮。卡方有关部门成功疏散船上21名船员，无人员伤亡。（央视新闻）", "ctime": 1775029251, "time_str": "15:40:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260401/c675691828.shtml"}, {"id": "4173171", "title": "优必选等在秦皇岛成立具身智能数据公司", "content": "企查查APP显示，近日，海港具身智能（秦皇岛）数据有限公司成立，注册资本1.05亿元，经营范围包含：量子计算技术服务；人工智能应用软件开发；云计算装备技术服务等。企查查股权穿透显示，该公司由优必选全资子公司优必选（秦皇岛）机器人科技有限公司等共同持股。（人民财讯）", "ctime": 1775029205, "time_str": "15:40:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260401/c675691793.shtml"}, {"id": "4173159", "title": "税务部门将依法依规加力纠治“开票经济”", "content": "记者4月1日从国家税务总局获悉，税务部门近日专门作出部署，组织开展“开票经济”涉税问题集中整治，不断拓展工作成效。下一步，税务部门将持续立足自身职责，依法依规加力纠治“开票经济”。(新华社)", "ctime": 1775029089, "time_str": "15:38:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260401/c675691767.shtml"}, {"id": "4173155", "title": "北汽蓝谷：3月北京新能源汽车产量18652辆，同比增长61.50%", "content": "北汽蓝谷公告，子公司2026年3月份产销快报显示，北京新能源汽车股份有限公司本月产量18652辆，同比增长61.50%；销量13647辆，同比下降4.35%；本年累计产量37452辆，同比增长36.96%，累计销量29084辆，同比增长4.94%。", "ctime": 1775029031, "time_str": "15:37:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260401/c675691740.shtml"}, {"id": "4173151", "title": "美伊战争后 美国中期选举民主党在预测市场上大幅领先", "content": "预测市场Polymarket数据显示，民主党在2026年中期选举中赢得众议院的概率已升至86%，民主党赢得参议院的概率已升至52%，同时控制参众两院的“横扫”概率达到51%。 另一平台Kalshi的同类预测为47.1%。 而在一年前，共和党保住参议院的概率还超过80%。 这一变化发生在特朗普政府于2026年3月初发动对伊朗的军事打击之后。", "ctime": 1775028980, "time_str": "15:36:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260401/c675691637.shtml"}, {"id": "4173139", "title": "外交部：中巴双方发表关于恢复海湾和中东地区和平稳定的五点倡议", "content": "4月1日，外交部发言人毛宁主持例行记者会。毛宁表示，昨天中共中央政治局委员、外交部长王毅同巴基斯坦副总理兼外长达尔举行会谈，就海湾和中东地区局势深入交换意见，并达成重要共识。中巴双方在会后发表了关于恢复海湾和中东地区和平稳定的五点倡议，主要内容概括起来就是“一停二谈三确保”：即立即停止敌对行动，尽快开启和谈，确保非军事目标安全，确保航道安全，确保联合国宪章的首要地位。（央视新闻）", "ctime": 1775028787, "time_str": "15:33:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260401/c675691528.shtml"}, {"id": "4173131", "title": "泰和科技：碳酸亚乙烯酯（VC）项目目前已完成改造 正准备试生产", "content": "泰和科技4月1日在互动平台表示，泰和科技的碳酸亚乙烯酯（VC）项目目前已完成改造，正准备试生产。公司的磷酸焦磷酸铁钠（NFPP）项目已基本改造完成，正在进行试生产的准备。上述项目后续的试生产过程、市场拓展情况和市场行情存在一定的不确定性，请注意投资风险。（人民财讯）", "ctime": 1775028739, "time_str": "15:32:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260401/c675691519.shtml"}, {"id": "4173123", "title": "外交部：菲律宾对中国南沙群岛相关岛礁进行所谓命名侵犯中国领土主权", "content": "针对菲律宾计划将南沙群岛部分岛屿改名，外交部发言人毛宁1日在例行记者会上答问时表示，中国对南沙群岛及其附近海域拥有无可争辩的主权。菲律宾超越自身领土范围非法划设所谓“卡拉延岛群”，对中国南沙群岛相关岛礁进行所谓命名侵犯中国领土主权，违反联合国宪章及相关国际法。中方坚决反对菲律宾损害中国的主权和权益，将采取必要措施，坚定捍卫自身在南海的领土主权和海洋权益。(新华社)", "ctime": 1775028679, "time_str": "15:31:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260401/c675691498.shtml"}, {"id": "4173119", "title": "外交部：提升人员往来的便利化有利于中韩民众交流", "content": "4月1日，外交部发言人毛宁主持例行记者会。有记者提问，据报道，韩国政府从30日起放宽中国公民多次往返签证申请条件，并进一步延长签证有效期，中方对此有何评论？毛宁表示，中韩两国持续提升人员往来的便利化水平，有利于两国民众增进彼此的了解和交流。（央视新闻）", "ctime": 1775028650, "time_str": "15:30:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260401/c675691487.shtml"}, {"id": "4173109", "title": "美方操弄“通用许可证”对中委合作设限，外交部：坚决反对", "content": "4月1日，外交部发言人毛宁主持例行记者会。有记者提问，据报道，近日，美国财政部颁发“通用许可证”，授权同意在委内瑞拉矿产领域签订投资和运营合同。该部称，此举将帮助委经济重回正轨并惠及美、委人民。该“通用许可证”将中国、俄罗斯、朝鲜、古巴、伊朗排除在外。中方对此有何评论？毛宁表示，中方坚决反对美方通过操弄所谓“通用许可证”对中委合作设限。中方在委内瑞拉的合法权益必须得到保护，美方要做的是立即取消对委内瑞拉的非法单边制裁，而不是通过操弄所谓“通用许可证”美化其损害包括委内瑞拉在内有关各方合法权益的行径。（澎湃新闻）", "ctime": 1775028619, "time_str": "15:30:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260401/c675691472.shtml"}, {"id": "4173093", "title": "日方打着“防卫反击”幌子部署进攻性武器 外交部：这一动向十分危险", "content": "4月1日，外交部发言人毛宁主持例行记者会。毛宁表示，日方打着“防卫反击”的幌子部署进攻性武器，远远超出自卫和“专守防卫”的范畴，严重违背《开罗宣言》《波茨坦公告》《日本投降书》等具有国际法效力文件的规定，严重违背日本宪法和国内既有规范，这再次反映出日本右翼势力正在推动安保政策朝着进攻性、扩张性的方向转变。日本“新型军国主义”正在威胁地区和平稳定，国际社会应对此高度警惕。（央视新闻）", "ctime": 1775028603, "time_str": "15:30:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260401/c675691449.shtml"}, {"id": "4173087", "title": "汇顶发布新一代高性能柔性OLED触控芯片GT9926", "content": "4月1日，汇顶科技正式推出全新一代柔性OLED触摸屏控制芯片GT9926，并率先商用于OPPO K15 Pro+游戏手机。该芯片面向新一代轻薄化、高性能OLED柔性屏幕设计，针对高负载、强显示干扰等业界挑战全面优化升级，为游戏及各类极限使用场景带来更稳定、灵敏、顺滑的触控体验。(汇顶科技)", "ctime": 1775028437, "time_str": "15:27:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260401/c675691397.shtml"}, {"id": "4173077", "title": "上海金融法院去年收案量增长29.75%，证券虚假陈述排名第一", "content": "3月31日，从上海金融法院2025年度审判工作情况通报及十大典型案例新闻发布会上获悉，上海金融法院2025年共受理各类金融案件9485件，收案量同比增长29.75%。其中，证券虚假陈述责任纠纷为收案量第一的案由。审判类案件中，证券虚假陈述责任纠纷与金融借款合同纠纷、融资租赁合同纠纷三者合计占比超过收案总数的50%。涉外、涉港澳台案件239件，同比增长21.94%，连续四年增长，其中涉“一带一路”国家案件为139件，占比58.16%。证券业案件占比59.18%，总体呈现出“违法行为隐蔽化、责任主体多元化、追责路径立体化”态势。保险业案件占比7.54%，总体呈现出新业态保障不足、新领域衔接不畅等供需矛盾。（界面新闻）", "ctime": 1775028349, "time_str": "15:25:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260401/c675691326.shtml"}, {"id": "4173067", "title": "国际足联主席因凡蒂诺：伊朗队将按计划在美国参加世界杯小组赛", "content": "国际足联主席因凡蒂诺31日表示，伊朗队将按计划在美国参加三场2026美加墨世界杯小组赛。 因凡蒂诺当天在土耳其现场观看了伊朗队5：0战胜哥斯达黎加队的友谊赛，他在赛后接受记者采访时说：“比赛将在抽签决定的地点进行，我们会按计划进行比赛。正如我们今天所看到的，伊朗队是一支非常强大的球队，我非常高兴和伊朗队球员和教练进行了交流。” 伊朗足协随后透露，因凡蒂诺告诉伊朗球员们：“从现在到世界杯，我将尽我所能支持伊朗队……如果你们想组织集训，或者有任何与境外活动相关的事宜，无论是什么我都会帮忙。” 美加墨世界杯将于2026年6月11日至7月19日在美国、加拿大、墨西哥举行。根据赛程，伊朗队与比利时、新西兰和埃及队同处G组，三场小组赛都将在美国境内进行。 2月28日，美国和以色列对伊朗发动军事打击。伊朗体育部长艾哈迈德·多尼亚马利在3月11日接受采访时称，考虑到当前局势，伊朗队不可能参加今夏的世界杯。 据悉，伊朗足协近期一直在与国际足联沟通，申请将伊朗队的三场世界杯小组赛地点从美国改至墨西哥。墨西哥总统克劳迪娅·辛鲍姆在3月下旬曾表示，墨西哥已做好准备承办伊朗队的三场世界杯小组赛，但此事有待国际足联决定。(新华社)", "ctime": 1775028236, "time_str": "15:23:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260401/c675691266.shtml"}, {"id": "4173063", "title": "华强北部分内存条价格跳水30%", "content": "存储价格涨至高位后，价格终于开始松动。3月31日，记者走访深圳华强北了解到，以DDR5（一种内存规格）为代表的内存条近日开始降价，部分产品降幅达到30%。与此同时，此前存储产品涨价导致二手手机回收价格上涨，近日风向也开始扭转，回收价逐渐回落。但记者了解到，这波降价并不涉及所有存储产品，目前SSD（固态硬盘）价格较稳定，部分产品出现小幅降价，机械硬盘价格依然高位横盘。由AI数据中心吸纳太多存储产能导致的存储产品普遍缺货、涨价，是否到达了一个拐点，目前尚难以下定论。但在持续数月的价格上涨后，部分存储产品出现价格松动，可能已说明市场供需出现了变化。(第一财经)", "ctime": 1775028212, "time_str": "15:23:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260401/c675691234.shtml"}, {"id": "4173057", "title": "上期所贵金属及有色金属仓单日报：白银、铜仓单减少", "content": "4月1日，上期所贵金属及有色金属仓单及变化数据：\n铜期货仓单212893吨，环比上个交易日减少8368吨；\n铝期货仓单416582吨，环比上个交易日减少25吨；\n锌期货仓单93546吨，环比上个交易日减少1257吨；\n铅期货仓单51244吨，环比上个交易日减少1797吨；\n镍期货仓单57841吨，环比上个交易日减少17吨；\n锡期货仓单6677吨，环比上个交易日减少78吨；\n氧化铝期货仓库仓单420379吨，环比上个交易日增加605吨；\n氧化铝期货厂库仓单2700吨，环比上个交易日持平；\n黄金期货仓单106644千克，环比上个交易日持平；\n白银期货仓单323319千克，环比上个交易日减少45348千克；\n国际铜期货仓单13055吨，环比上个交易日持平。", "ctime": 1775028119, "time_str": "15:21:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260401/c675691198.shtml"}, {"id": "4173049", "title": "阿里巴巴图像生成与编辑统一模型Wan2.7-Image发布", "content": "4月1日，阿里巴巴图像生成与编辑统一模型Wan2.7-Image正式发布。针对当前AI生图中的审美疲劳、色彩失控等痛点，Wan2.7-Image带来了更具“活人感”的人物生成、精准的色彩控制以及超长文本渲染能力。（界面新闻）", "ctime": 1775027989, "time_str": "15:19:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": const SECTORS  = [{"name": "金融", "hit_count": 28, "etfs": []}, {"name": "数据要素", "hit_count": 24, "etfs": []}, {"name": "军工", "hit_count": 21, "etfs": []}, {"name": "医药", "hit_count": 14, "etfs": []}, {"name": "人工智能", "hit_count": 12, "etfs": []}, {"name": "半导体", "hit_count": 10, "etfs": []}, {"name": "新能源", "hit_count": 10, "etfs": []}, {"name": "消费", "hit_count": 9, "etfs": []}];
const META     = {"update_time": "2026-04-01 16:06:24", "sentiment_score": 53.36322869955157, "agents": []};

// 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
