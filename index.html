e": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260602/c677148484.shtml"}, {"id": "4441553", "title": "罗马尼亚关闭俄领馆 俄方：将对该不友好举动作出回应", "content": "当地时间6月1日，俄罗斯外交部发言人扎哈罗娃表示，俄方肯定会对罗马尼亚关闭俄罗斯在康斯坦察总领事馆的这一决定作出回应，具体反制措施将另行公布。近日，罗马尼亚称有俄无人机在罗马尼亚境内坠毁，造成2人受伤。罗马尼亚随后宣布俄罗斯驻康斯坦察总领事为“不受欢迎的人”，并关闭该总领事馆。俄方此前表示，西方国家借罗马尼亚无人机事件“大做文章”，但对俄的所有指控均缺乏证据，至今没有拿出任何“相关事实与佐证材料”。（央视新闻）", "ctime": 1780379989, "time_str": "13:59:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260602/c677148466.shtml"}, {"id": "4441551", "title": "华为哈勃入股五线宏音 后者含智能机器人业务", "content": "企查查APP显示，近日，五线宏音（重庆）科技有限公司发生工商变更，新增华为关联公司深圳哈勃科技投资合伙企业（有限合伙）为股东，同时注册资本增至116.67万元。企查查信息显示，该公司成立于2024年，经营范围包含：智能机器人的研发；智能机器人销售；可穿戴智能设备销售；乐器零售；乐器批发；乐器零配件销售等。（人民财讯）", "ctime": 1780379973, "time_str": "13:59:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260602/c677148462.shtml"}, {"id": "4441533", "title": "西门子能源宣布将收购Camlin集团", "content": "6月2日，西门子能源发表声明称，将收购总部位于北爱尔兰的Camlin集团，该公司是电网监控、分析及资产数字化技术领域的专业企业。西门子能源表示，此次收购将拓展其数字化电网产品组合。该交易尚需获得监管部门的批准，预计将于2026年底前完成。目前尚未披露财务细节。（界面新闻）", "ctime": 1780379683, "time_str": "13:54:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260602/c677148393.shtml"}, {"id": "4441519", "title": "三星电子涨超5%，再创历史新高", "content": "三星电子涨超5%，再创历史新高。", "ctime": 1780379570, "time_str": "13:52:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260602/c677148367.shtml"}, {"id": "4441509", "title": "浦东国际机场口岸今年出入境人员突破1500万人次", "content": "截至6月2日凌晨，上海浦东国际机场口岸今年出入境人员总量在全国空港口岸中率先突破1500万人次，较去年提前5天，约占全国空港口岸出入境人员总量的四分之一，稳居全国空港口岸首位。此外，上海机场边检站还高效保障了超177万人次中转旅客享受24小时直接过境免办边检手续的便利，充分彰显上海作为全方位门户复合型国际航空枢纽的强劲领先态势。（上观新闻）", "ctime": 1780379510, "time_str": "13:51:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260602/c677148357.shtml"}, {"id": "4441507", "title": "中欧班列“中通道”今年通行量突破2000列", "content": "6月2日，一列满载55个集装箱的中欧班列，经二连浩特铁路口岸出境，开往波兰马拉舍维奇，这是今年以来经二连浩特铁路口岸通行的第2000列中欧班列。截至6月1日，二连浩特铁路口岸中欧班列运送货物19.37万标箱、182.66万吨，同比分别增长10.94%、27.46%。作为共建“一带一路”的重要务实载体，中欧班列持续织密横跨亚欧的物流网络。目前，经二连浩特铁路口岸运行的中欧班列线路达75条，通达德国、波兰等10余个国家70多个枢纽站点，国内辐射范围覆盖中欧班列大部分首发城市。（央视新闻）", "ctime": 1780379467, "time_str": "13:51:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260602/c677148346.shtml"}, {"id": "4441485", "title": "教育部等八部门联合开展“国聘行动”", "content": "记者6月2日从教育部获悉，教育部、人社部、国务院国资委等八部门日前印发通知，于5月至12月联合开展“国聘行动”，全力促进2026届高校毕业生和2024、2025届离校未就业毕业生等重点群体尽早就业。据介绍，为深入挖潜拓展就业岗位，聚焦就业带动能力强、岗位规模增长较快的制造业、服务业等重点产业领域，开发更多有利于发挥毕业生所学所长的就业岗位。鼓励结合“十五五”规划和城市产业发展，组织优质企业开展以“国聘行动+城市产业专场”为主题的招聘活动，带动更多用人主体参与促就业。（新华社）", "ctime": 1780379206, "time_str": "13:46:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260602/c677148211.shtml"}, {"id": "4441481", "title": "乌称遭俄73枚导弹656架无人机袭击", "content": "当地时间今天（6月2日）凌晨，包括首都基辅在内，乌克兰全境大部分地区都响起了空袭警报，基辅接连传出剧烈爆炸声。乌克兰空军称，俄军共发射73枚导弹和656架无人机袭击基辅等地。乌克兰方面称，截至目前，俄军的大规模空袭造成基辅、第聂伯罗和哈尔科夫至少10人死亡、约100人受伤。俄罗斯国防部也证实对乌克兰境内目标发动大规模打击。（CCTV国际时讯）", "ctime": 1780379196, "time_str": "13:46:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260602/c677148206.shtml"}, {"id": "4441473", "title": "四部门启动“剑网2026”专项行动  以人工智能领域版权整治为重点", "content": "国家版权局、工业和信息化部、公安部、国家互联网信息办公室四部门联合启动打击网络侵权盗版“剑网2026”专项行动。以人工智能领域版权整治为重点，推动解决大模型训练语料版权合规问题，重点查处利用人工智能等新技术工具非法复制、改编、传播作品，未经授权对作品实施“魔改”“洗稿”、深度伪造、规避监测等侵权违法行为。(央视新闻)", "ctime": 1780379136, "time_str": "13:45:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260602/c677148192.shtml"}, {"id": "4441453", "title": "韩正会见英国外交大臣库珀", "content": "6月2日，国家副主席韩正在北京会见英国外交大臣库珀。 韩正表示，今年1月，习近平主席同斯塔默首相一致同意发展中英长期稳定的全面战略伙伴关系，开启两国关系新篇章。中英关系改善发展符合两国人民利益。双方要携手承担大国责任，加强战略沟通，巩固双边关系良好势头，不断挖掘新机遇，孕育新动能，促进人文交流和民心相通。共同践行真正的多边主义，携手推进全球治理体系改革，为世界注入更多稳定性和确定性。 库珀表示，英中在经贸投资、人工智能、绿色发展、应对气变等领域拥有广泛共同利益和合作潜力。英方愿同中方推进落实两国领导人达成的重要共识，开展建设性对话和合作，共同应对挑战。(新华社)", "ctime": 1780378874, "time_str": "13:41:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260602/c677148125.shtml"}, {"id": "4441443", "title": "晶科能源CEO曹海云：以“本土制造，供应本土市场”策略 从五大方向推动全球化布局", "content": "在今日举行的晶科能源2026 SNEC新品发布暨媒体交流会上，其CEO曹海云首次公开亮相并表示，公司将秉承“本土制造，供应本土市场”策略，从“合作、技术与专利授权、市场准入、服务、共享”五大方向推动全球化布局。“我们将在重点市场与合作伙伴共同推动合资公司建设，从而供应当地市场。晶科‘全球化3.0战略’正在相关市场，尤其是美国与中东市场进行实践。”（科创板日报）", "ctime": 1780378834, "time_str": "13:40:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260602/c677148117.shtml"}, {"id": "4441427", "title": "字节跳动Seed旗下AI4S团队核心成员顾全全自曝将离职", "content": "字节跳动Seed旗下聚焦科学智能领域的AI4S（Seed-AI for Science）团队核心成员顾全全在X平台上官宣自己将离职。据悉，顾全全于2023年加入字节Seed。他表示，自从加入字节跳动以来，一直主导着用于药物发现的AI工作。团队构建了以下成果：SeedFold、SeedProteo以及DPLM系列的蛋白质语言模型，还有数个其他的 AI for Science（AI 驱动科学研究）项目。顾全全于2007年和2010年分获清华大学自动化专业学士、控制科学与工程硕士学位，2014年获伊利诺伊大学香槟分校计算机科学博士学位。(蓝鲸新闻)", "ctime": 1780378656, "time_str": "13:37:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260602/c677148077.shtml"}, {"id": "4441393", "title": "筹划控制权变更事项“告吹”，和仁科技股价重挫逾17%，公司回应", "content": "6月2日，和仁科技早盘股价大跌。数据显示，截至午间收盘，公司股价报12.48元/股，跌17.46%。消息面上，和仁科技6月1日晚间披露关于终止筹划控制权变更事项暨复牌的公告。对于股价大跌，和仁科技方面回应记者，筹划控制权变更事项以及终止筹划控制权变更事项都是控股股东行为，上市公司层面无法控制。目前公司经营是正常的，公司业务具有一定的季节性。公司的客户主要是一些公立医院，项目的审批、立项、招投标会集中在一季度和二季度，项目的验收会集中在三四季度。(中证金牛座)", "ctime": 1780378478, "time_str": "13:34:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260602/c677148024.shtml"}, {"id": "4441375", "title": "俄南部一炼油厂遭无人机袭击起火", "content": "当地时间6月2日清晨，俄罗斯克拉斯诺达尔边疆区行动指挥部通报，伊利斯基炼油厂因遭无人机袭击发生火灾。此外，无人机碎片坠落在当地一栋公寓楼区域内。相关袭击未造成人员伤亡。据悉，伊利斯基炼油厂是俄罗斯南部最大的石油加工企业之一，经营烃原料的接收、储存、加工以及成品油的公路和铁路运输。该厂拥有6套炼油工艺装置，年产能达660万吨。（央视新闻）", "ctime": 1780378389, "time_str": "13:33:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260602/c677147973.shtml"}, {"id": "4441353", "title": "现货白银涨超2%", "content": "现货白银涨超2%，现报76.54美元/盎司。", "ctime": 1780378270, "time_str": "13:31:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260602/c677147952.shtml"}, {"id": "4441305", "title": "铜缆高速连接板块震荡走强，鑫科材料涨停", "content": "铜缆高速连接板块震荡走强，鑫科材料涨停，长飞光纤、中天科技、博威合金等股此前涨停，凯旺科技、太辰光、长芯博创、鼎通科技、华丰科技跟涨。", "ctime": 1780378179, "time_str": "13:29:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260602/c677147892.shtml"}, {"id": "4441291", "title": "现货白银站上76美元/盎司", "content": "现货白银站上76美元/盎司，日内涨1.64%。COMEX黄金期货涨超1%，现报4552.0美元/盎司。", "ctime": 1780378058, "time_str": "13:27:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260602/c677147849.shtml"}, {"id": "4441289", "title": "Arm首席执行官：存储芯片供应整体仍吃紧", "content": "Arm首席执行官Rene Haas告诉记者，包括高带宽存储芯片、DRAM和NAND在内的各类存储芯片的供需平衡都很紧张。Haas表示，未来一段时间内，供应整体仍将保持紧张。他表示，由于之前下行时期时产能扩张不足，存储芯片仍然是最难解决的瓶颈问题。（财联社）", "ctime": 1780378037, "time_str": "13:27:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260602/c677147830.shtml"}, {"id": "4441287", "title": "柬埔寨就海洋问题致函泰国和联合国，启动强制调解程序", "content": "当地时间6月2日，柬埔寨首相洪玛奈发表电视讲话称，柬埔寨政府已正式致函泰国政府和联合国秘书处，启动《联合国海洋法公约》框架下的强制调解程序，就柬泰重叠海域问题阐述柬埔寨政府立场，并重申柬方坚持依据国际法和和平原则推动解决重叠海域争议问题。（央视新闻）", "ctime": 1780377956, "time_str": "13:25:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260602/c677147810.shtml"}, {"id": "4441285", "title": "创业板指涨3%，元件、CPO、光纤概念板块领涨", "content": "创业板指涨幅扩大至3%，上证指数涨0.58%，深证成指涨1.78%，元件、CPO、光纤概念板块领涨。", "ctime": 1780377923, "time_str": "13:25:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260602/c677147804.shtml"}, {"id": "4441269", "title": "高通将发布全新数据中心业务品牌Dragonfly", "content": "高通总裁兼CEO安蒙在COMPUTEX 2026演讲时表示，智能体正成为AI词元（token）需求的核心来源，推动AI规模化落地，并将定义AI架构与经济模式。2026年，全球每10秒的词元需求约为317亿；到2030年，同样是每10秒，这一数值将达到1.27万亿，增幅高达40倍。而2030年全球词元总需求将达到千万亿级。这一爆发式增长，正是由智能体AI生成的海量词元所驱动。安蒙认为，这一数字后续还会变化。未来的智能体将能够主动代替用户运行计算，任务自动分配，充分利用全场景算力。安蒙还在高通将发布全新数据中心业务品牌Dragonfly（高通飞龙），他表示，高通将在本月底的投资者日上带来更多相关信息。（科创板日报）", "ctime": 1780377661, "time_str": "13:21:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260602/c677147728.shtml"}, {"id": "4441241", "title": "沪深京三市成交额超2万亿元，较上日此时缩量1297亿元", "content": "据同花顺iFinD数据，沪深京三市成交额超2万亿元，较上日此时缩量1297亿元，预计全天成交金额约2.7万亿元。截至目前，沪市成交额9058亿元，深市成交额10801亿元，北证50成交额144亿元。", "ctime": 1780377471, "time_str": "13:17:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260602/c677147660.shtml"}, {"id": "4441235", "title": "半导体板块震荡走高，裕太微20cm涨停，源杰科技、江丰电子、杰华特涨幅居前", "content": "半导体板块震荡走高，裕太微20cm涨停，源杰科技、江丰电子、杰华特涨幅居前。", "ctime": 1780377419, "time_str": "13:16:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260602/c677147646.shtml"}, {"id": "4441213", "title": "江西铜业触及涨停", "content": "江西铜业触及涨停，成交额33.33亿元。", "ctime": 1780377327, "time_str": "13:15:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260602/c677147625.shtml"}, {"id": "4441201", "title": "马尔代夫将限制16岁以下青少年访问部分社媒平台", "content": "当地时间6月1日，马尔代夫总统穆伊兹在新闻发布会上宣布，政府决定限制16岁以下青少年访问某些社交媒体平台，该规定将在一年内全面实施。马尔代夫政府表示，此举旨在保障儿童福祉和社区安全。目前，马尔代夫政府对针对青少年的网络诱骗、网络霸凌等内容的传播十分担忧。（央视新闻）", "ctime": 1780377198, "time_str": "13:13:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260602/c677147560.shtml"}, {"id": "4441199", "title": "美国五角大楼新闻办公室成为媒体禁区", "content": "美国国防部官员宣布，五角大楼新闻办公室已改为保密区域，禁止媒体记者进入。此举引起了媒体界的关注和讨论。此前，五角大楼新闻办公室是开放区域，媒体记者可以在没有国防部人员陪同的情况下进出，五角大楼新闻官员也会在该处举行吹风会。现在，由于国防部长赫格塞思的讲话稿撰写人需要在新闻办公室写稿，而“他们经常接触保密材料”并且使用军方保密互联网，因而新闻办公室成为“敏感”区域，禁止媒体记者进入。（新华社）", "ctime": 1780377158, "time_str": "13:12:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260602/c677147553.shtml"}, {"id": "4441197", "title": "恒生科技指数涨幅扩大至4%", "content": "港股恒生科技指数涨幅进一步扩大至4%，科网股全面爆发，腾讯控股、美团-W涨超8%，阿里巴巴-W涨超5%，哔哩哔哩-W涨超4%。", "ctime": 1780377148, "time_str": "13:12:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260602/c677147552.shtml"}, {"id": "4441185", "title": "量子计算公司Quantinuum与三菱电机达成量子计算合作协议", "content": "当地时间6月1日，霍尼韦尔旗下量子计算公司Quantinuum宣布与三菱电机签署了一份不具约束力的谅解备忘录，双方将建立战略合作伙伴关系，共同开发量子计算应用。此次合作的目标应用领域包括工厂自动化、能源公用事业以及楼宇系统等。（界面新闻）", "ctime": 1780376898, "time_str": "13:08:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260602/c677147458.shtml"}, {"id": "4441181", "title": "第九届“选择法国”峰会聚焦人工智能产业链", "content": "法国总统府爱丽舍宫1日说，当天在巴黎近郊凡尔赛宫举行的第九届“选择法国”国际商务峰会宣布系列投资项目，其中，人工智能产业链项目占据重要位置。 爱丽舍宫当天发布新闻公告说，本届峰会共公布71个投资项目，主要涉及人工智能、健康和制药、能源转型、工业脱碳等领域。多国投资机构和企业宣布在法国加码投资人工智能相关基础设施。本届峰会重点关注自主能源转型与数字化转型两大主题，吸引来自近50个国家的200多名企业负责人参会。 法国总统马克龙在闭幕式上表示，这是“迄今为止规模最大的一届峰会”。本届峰会投资承诺总额已超 // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
