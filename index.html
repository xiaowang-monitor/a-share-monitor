const NEWS     = [{"id": "4369875", "title": "市场监管总局部署开展2026年“守护消费”铁拳行动 一季度查处产品质量违法案件1.82万件", "content": "记者今天（15日）从市场监管总局发布会获悉：围绕重点工业产品质量安全，依托“铁拳”机制，部署开展2026年“守护消费”铁拳行动。纵深推进电动自行车、建筑保温材料、消防产品、网售重点工业产品、儿童和学生用品等专项行动。聚焦重点电商平台、重点生产销售企业集聚区、质量安全易发多发区以及重点市场，持续保持执法高压态势，严厉打击生产、销售的产品不符合强制性国家标准、不符合生产许可证、强制性产品认证准入要求等以及以假充真、以次充好、以不合格冒充合格产品违法违规行为，促进工业产品质量水平提升。聚焦重点产品，加大打击力度。市场监管系统聚焦电动自行车、化肥产品、建筑保温材料、燃气灶具、儿童玩具、电线电缆、消防产品等涉及人身健康安全重点产品，强化线上线下一体化执法，查处一批电动自行车非法改装、化肥产品不合格等质量领域大案要案，严守质量安全底线。2026年第一季度，全国市场监管系统共查处各类产品质量违法案件1.82万件，罚没金额1.3亿元，移送公安机关46件。加强宣传引导、曝光典型案例。市场监管系统采用多种形式开展普法宣传，综合利用“3·15”、质量月等重要节日活动，向消费者普及产品质量识假辨假知识、相关法律法规，畅通12315投诉举报渠道。同时，坚持执法普法并重，以案释法，持续公开曝光典型案例，形成有力警示和震慑。（央视新闻）", "ctime": 1778837274, "time_str": "17:27:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260515/c676728151.shtml"}, {"id": "4369869", "title": "高德红外：签订1.03亿元合同", "content": "高德红外公告，近日与客户签订了两份型号产品订货合同，合同金额合计为1.03亿元人民币。", "ctime": 1778837203, "time_str": "17:26:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260515/c676728107.shtml"}, {"id": "4369865", "title": "信立泰：注射用重组特立帕肽获得药品注册证书", "content": "信立泰公告，近日，全资子公司信立泰（苏州）药业有限公司收到国家药品监督管理局核准签发的注射用重组特立帕肽（欣复泰Plus®）药品注册证书。该药品适用于有骨折高发风险的绝经后妇女骨质疏松症的治疗，规格为56.5µg/瓶。欣复泰Plus®是国内首个上市的特立帕肽周制剂，为每周一次皮下注射的粉针剂，目前国内尚无同规格及用法用量的产品上市。", "ctime": 1778837191, "time_str": "17:26:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260515/c676728090.shtml"}, {"id": "4369853", "title": "联合国：苏丹近1950万人面临严重粮食不安全", "content": "当地时间5月15日，粮农组织、联合国儿童基金会和世界粮食计划署警告称，根据最新的“粮食安全阶段综合分类”（IPC）分析，苏丹目前有近1950万人，即全国每五人中就有两人，正面临危机级别或更严重的急性粮食不安全状况。随着苏丹内战进入第四年，截至2026年3月底，由冲突引发的流离失所问题依然极其严重，苏丹境内已有近900万人被迫离开家园。此外，目前苏丹的人道主义准入障碍仍是全球最严重之一。粮农组织、世界粮食计划署和联合国儿童基金会呼吁立即停止敌对行动，要求冲突各方保护平民及民用基础设施，并确保受冲突影响地区能够获得安全、迅速且不受阻碍的人道主义通道。（央视新闻）", "ctime": 1778836988, "time_str": "17:23:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260515/c676727979.shtml"}, {"id": "4369851", "title": "湖南浏阳华盛烟花厂爆炸事故已有35名伤员出院", "content": "记者从相关部门了解到，截至5月15日17时，湖南浏阳华盛烟花厂爆炸事故累计出院人数达35人。由湖南省第二人民医院（湖南省脑科医院）牵头，联合长沙市第九医院、湘潭市第五人民医院、郴州市精神病医院等6家专业机构，对伤员及其家属积极开展心理筛查，截至5月15日，累计干预809人次，发现存在心理问题54人，已好转52人，2人仍存在症状，持续予以干预；对出院伤员开展常规体检和心理评估；同步组建由主诊医师、护士和有家庭医生组成的随访团队，定期开展上门随访，目前已累计随访116人次。（央视新闻）", "ctime": 1778836983, "time_str": "17:23:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260515/c676727977.shtml"}, {"id": "4369847", "title": "超威半导体美股盘前跌超4%", "content": "超威半导体美股盘前跌超4%，现报431.55美元。", "ctime": 1778836912, "time_str": "17:21:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260515/c676727960.shtml"}, {"id": "4369841", "title": "北京证监局对国都证券股份有限公司采取监管谈话行政监管措施", "content": "北京证监局发布关于对国都证券股份有限公司采取监管谈话行政监管措施的决定，经查，国都证券在公司债券承销个别项目中，存在未审慎核查发行人主要客户的变化情况及相关销售收入真实性、应收账款和存货涉及的相关工程项目真实性等问题，违反了《公司债券发行与交易管理办法》(证监会令第113号)第七条的规定。根据《公司债券发行与交易管理办法》(证监会令第113号)第五十八条的规定，北京证监局决定对公司采取监管谈话的行政监管措施。请公司主要负责人按指定日期携带有效身份证件接受监管谈话。", "ctime": 1778836807, "time_str": "17:20:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260515/c676727894.shtml"}, {"id": "4369837", "title": "中东部大范围降雨波及十余省份 专家：华北等地降雨强度同期少见", "content": "近期，我国总体呈现南方降雨频繁、北方晴热持续的天气格局。不过今起五天（5月15日至19日），中东部将迎来一次大范围较强降雨过程，南北方降雨将会连接成片，波及湖北、河南、山东等十余省区市，部分地区雨量同期少见。哪些地方是降雨核心影响区域？常年5月雨带往往在南方，为何此次会贯穿南北？今起五天，随着高空槽东移、暖湿气流增强，中东部自西向东将有一次大范围较强降雨过程。气象分析师沈雨旸表示，这轮降雨过程具有影响范围广、持续时间长、累计雨量大等特点，局地会伴有短时强降水、雷暴大风、冰雹等强对流天气，华北、黄淮多地降雨强度或为同期少见。（央视新闻）", "ctime": 1778836739, "time_str": "17:18:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260515/c676727859.shtml"}, {"id": "4369829", "title": "盛科通信：股东国家大基金拟减持不超过2.50%", "content": "盛科通信公告，持股11.60%的股东国家集成电路产业投资基金股份有限公司拟因自身经营管理需要，自2026年6月8日～2026年9月7日期间，通过集中竞价或大宗交易方式减持不超过1025万股，占公司总股本2.50%。截至公告披露日，该股东持有公司4756.02万股，上述股份均为IPO前取得并于2024年9月18日起上市流通。", "ctime": 1778836696, "time_str": "17:18:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260515/c676727844.shtml"}, {"id": "4369825", "title": "现货黄金失守4540美元/盎司", "content": "现货黄金失守4540美元/盎司，日内跌2.37%。", "ctime": 1778836612, "time_str": "17:16:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260515/c676727762.shtml"}, {"id": "4369803", "title": "世界摔跤联合会：即日起取消俄白两国摔跤运动员参赛限制", "content": "当地时间5月15日，世界摔跤联合会发布声明称，即日起取消对俄罗斯和白俄罗斯摔跤运动员的参赛限制，允许两国运动员在未来举行的世界摔跤联合会赛事中，以本国身份参赛。根据声明，俄罗斯和白俄罗斯运动员可使用本国国旗、国家代码及国歌参加比赛和颁奖仪式。（央视新闻）", "ctime": 1778836414, "time_str": "17:13:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260515/c676727653.shtml"}, {"id": "4369797", "title": "光大期货：通胀压力难解，白银盘中放量大跌", "content": "本周以来，白银经历了一轮过山车行情。上半周受秘鲁发布能源危机紧急法令影响，市场担心白银供应量减少，价格大幅冲高。而本周后半周美国CPI、PPI数据相继发布，通胀压力显著增加，叠加美国4月零售销售同比增幅达4.9%，为近8个月来最强劲表现，市场对后续降息预期进一步降温，并催生加息预期，强美元对贵金属走势形成压制。此外，美参议院批准沃什担任美联储主席，沃什上台后通胀和降息问题无疑面临较大考验，市场关注其首次官方表态，表态前夕市场资金出于避险需求获利了结，白银减仓大跌，盘中最大跌幅超10%。（光大期货）", "ctime": 1778836339, "time_str": "17:12:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260515/c676727601.shtml"}, {"id": "4369795", "title": "南方航空：2026年4月，集团客运运力投入同比上升3.68%", "content": "南方航空公告，2026年4月，集团客运运力投入（按可利用座公里计）同比上升3.68%，其中国内和国际分别同比上升0.33%和12.54%，地区同比下降1.47%；旅客周转量（按收入客公里计）同比上升2.83%，其中国内同比下降0.72%，地区和国际分别同比上升1.71%和12.20%；客座率为84.88%，同比下降0.70个百分点，其中国内和国际分别同比下降0.90和0.26个百分点，地区同比上升2.59个百分点。货运方面，2026年4月，货运运力投入（按可利用吨公里—货邮运计）同比下降2.34%；货邮周转量（按收入吨公里—货邮运计）同比上升2.75%；货邮载运率为54.04%，同比上升2.68个百分点。", "ctime": 1778836315, "time_str": "17:11:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260515/c676727586.shtml"}, {"id": "4369789", "title": "贝莱德（BlackRock）对哔哩哔哩-W的多头持仓比例增至5.06%", "content": "据香港交易所披露，贝莱德（BlackRock）对哔哩哔哩股份有限公司 - W的多头持仓比例于2026年5月11日从4.8%增至5.06%。", "ctime": 1778836203, "time_str": "17:10:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260515/c676727473.shtml"}, {"id": "4369787", "title": "贝莱德（BlackRock）对万洲国际的多头持仓比例降至5.89%", "content": "据香港交易所披露，贝莱德（BlackRock）对万洲国际有限公司的多头持仓比例于2026年5月11日从6.07%降至5.89%。", "ctime": 1778836199, "time_str": "17:09:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260515/c676727469.shtml"}, {"id": "4369783", "title": "贝莱德（BlackRock）对药明康德的多头持仓比例降至4.96%", "content": "据香港交易所披露，贝莱德（BlackRock）对无锡药明康德新药开发股份有限公司 - H股的多头持仓比例于2026年5月11日从5.31%降至4.96%。", "ctime": 1778836196, "time_str": "17:09:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260515/c676727458.shtml"}, {"id": "4369779", "title": "中国驻宿务总领事馆发布涉水旅游项目安全问题领事提醒", "content": "5月15日，中国驻宿务总领馆发布涉水旅游项目安全问题领事提醒。全文如下：近期，我领区发生中国公民浮潜时不幸溺亡事件，令人十分痛心。游客在境外参与浮潜、潜水、游泳等涉水活动发生意外情况时有发生，部分事故与未规范穿戴救生衣、对海况认识不足、缺乏相关经验、擅自前往非开放海域以及身体状况不适宜下水等因素有关。当前正值高温酷热季节，海岛旅游和涉水项目进入高峰期，中国驻宿务总领馆再一次提醒广大中国公民切实提高安全防范意识，谨慎参与各类涉水活动，确保生命安全。（央视新闻）", "ctime": 1778836114, "time_str": "17:08:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260515/c676727394.shtml"}, {"id": "4369761", "title": "市场监管总局：2026年加大网售领域抽查力度", "content": "记者5月15日了解到，今年市场监管总局将加大网售领域抽查力度，计划抽样115种产品，占比67%，较2025年提高10个百分点，抽查批次数较2025年增加7个百分点，达47%。抽查将覆盖所有头部平台，同时加大对往年抽查不合格率较高、质量内控薄弱以及审核制度虚设等问题较多的中小型平台的抽查力度。（新华社）", "ctime": 1778835896, "time_str": "17:04:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260515/c676727179.shtml"}, {"id": "4369755", "title": "市场监管总局：部署开展2026年“守护消费”铁拳行动", "content": "记者今天（15日）从市场监管总局发布会获悉：围绕重点工业产品质量安全，依托“铁拳”机制，部署开展2026年“守护消费”铁拳行动。纵深推进电动自行车、建筑保温材料、消防产品、网售重点工业产品、儿童和学生用品等专项行动。聚焦重点电商平台、重点生产销售企业集聚区、质量安全易发多发区以及重点市场，持续保持执法高压态势，严厉打击生产、销售的产品不符合强制性国家标准、不符合生产许可证、强制性产品认证准入要求等以及以假充真、以次充好、以不合格冒充合格产品违法违规行为，促进工业产品质量水平提升。（央视新闻）", "ctime": 1778835763, "time_str": "17:02:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260515/c676727097.shtml"}, {"id": "4369753", "title": "普洛药业：头孢泊肟酯原料药获批准", "content": "普洛药业公告，全资子公司浙江普洛得邦制药有限公司收到国家药品监督管理局签发的头孢泊肟酯的《化学原料药上市申请批准通知书》。头孢泊肟酯为口服广谱第三代头孢菌素，适用于敏感菌引起的上呼吸道感染、下呼吸道感染、单纯性泌尿道感染、单纯性皮肤和皮肤软组织感染、急性单纯性淋球菌性尿道炎和子宫颈炎、由奈瑟氏淋球菌引起的肛周炎等。头孢泊肟酯原料药的获批，将有利于公司进一步推进“原料药+制剂”一体化战略，与制剂产品形成协同效应，提升生产成本控制和供应链稳定性等方面的核心竞争力，对公司经营发展具有一定的积极作用。", "ctime": 1778835696, "time_str": "17:01:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260515/c676727071.shtml"}, {"id": "4369731", "title": "乌称基辅遭俄无人机袭击", "content": "当地时间5月15日，乌克兰首都基辅市市长克利奇科发布通报称，基辅左岸区域正遭遇俄方无人机袭击，目前乌方防空部队正全力展开反击，抵御来袭目标。克利奇科紧急呼吁全体市民留在避难所内。此前基辅拉响防空警报。目前，俄方对此暂无回应。（央视新闻）", "ctime": 1778835530, "time_str": "16:58:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260515/c676726783.shtml"}, {"id": "4369715", "title": "高能环境今日跌停，有2家机构专用席位净卖出1.11亿元", "content": "高能环境今日跌停，成交额13.62亿元，换手率6.57%，盘后龙虎榜数据显示，沪股通专用席位买入9714.61万元并卖出7976.87万元，有2家机构专用席位净卖出1.11亿元。", "ctime": 1778835387, "time_str": "16:56:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260515/c676726721.shtml"}, {"id": "4369701", "title": "长盈通今日涨18.12%，1家机构专用席位净买入4.50亿元", "content": "长盈通今日涨18.12%，成交额34.06亿元，换手率26.12%，盘后龙虎榜数据显示，沪股通专用席位买入1.49亿元并卖出1.89亿元，1家机构专用席位净买入4.50亿元。", "ctime": 1778835317, "time_str": "16:55:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260515/c676726646.shtml"}, {"id": "4369689", "title": "蒙草生态：联合体中标3.11亿元沙漠林草带巩固建设项目", "content": "蒙草生态公告，公司与阿拉善左旗蓝马园林生态建设有限责任公司组成联合体，成为“内蒙古阿拉善盟阿拉善左旗-三北六期腾格里沙漠林草带巩固建设项目施工标段”第一中标候选人，拟定中标价3.11亿元。公司承担项目工程量约77.5%，若顺利实施将对经营产生积极影响。", "ctime": 1778835240, "time_str": "16:54:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260515/c676726603.shtml"}, {"id": "4369685", "title": "中国东航：2026年4月货邮周转量同比上升19.10%", "content": "中国东航公告，2026年4月客运运力投入（按可用座公里计）同比上升0.84%；旅客周转量（按客运人公里计）同比上升3.79%；客座率为87.87%，同比上升2.5个百分点。2026年4月货邮周转量（按货邮载运吨公里计）同比上升19.10%。", "ctime": 1778835207, "time_str": "16:53:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260515/c676726588.shtml"}, {"id": "4369681", "title": "迈威尔科技美股盘前跌超5%", "content": "迈威尔科技美股盘前跌超5%，现报173.0美元。", "ctime": 1778835184, "time_str": "16:53:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260515/c676726569.shtml"}, {"id": "4369673", "title": "非洲疾控中心：刚果（金）暴发埃博拉疫情", "content": "非洲疾病预防控制中心15日宣布，刚果（金）东部伊图里省暴发埃博拉疫情，目前已报告246例疑似病例和65例死亡病例。 非洲疾控中心当天在声明中说，刚果（金）国家生物医学研究所针对20份样本的初步实验室检测结果显示，13份样本确认感染埃博拉病毒，其中包括4例死亡病例。 非洲疾控中心表示，由于受影响地区包括城市、人口流动频繁且安全形势不稳，同时当地密切接触者追踪、感染预防和控制能力不足，加之邻近乌干达和南苏丹，因此当前疫情存在扩散风险。 非洲疾控中心主任卡塞亚表示，鉴于受影响地区与邻国之间人口流动频繁，迅速开展区域协调至关重要。非洲疾控中心正同刚果（金）、乌干达、南苏丹等国以及世界卫生组织、联合国儿童基金会等机构合作，加强监测和应对工作，以尽快控制疫情。 2025年12月，刚果（金）政府宣布，该国2025年9月开始的埃博拉疫情结束。 埃博拉病毒可引发埃博拉出血热，主要通过接触病患或被感染动物的血液、体液、分泌物、排泄物等感染，临床表现主要为发热、出血和多脏器损害，死亡率高达50%至90%。(新华社)", "ctime": 1778835104, "time_str": "16:51:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260515/c676726524.shtml"}, {"id": "4369671", "title": "俄乌双方进行阵亡军人遗体交换", "content": "当地时间5月15日，据消息人士称，俄罗斯与乌克兰正在开展阵亡军人遗体交换工作。乌方将接收526具遗体，俄方将接收41具。（央视新闻）", "ctime": 1778835033, "time_str": "16:50:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260515/c676726497.shtml"}, {"id": "4369655", "title": "潞安环能：2026年4月商品煤销量为445万吨，同比下降1.33%", "content": "潞安环能公告，2026年4月商品煤销量为445万吨，同比下降1.33%。", "ctime": 1778834792, "time_str": "16:46:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260515/c676726348.shtml"}, {"id": "4369643", "title": "上期所：关于调整螺纹钢等期货相关合约涨跌停板幅度和交易保证金比例的通知", "content": "上期所公告，经研究决定，自2026年5月19日（星期二）收盘结算时起，涨跌停板幅度和交易保证金比例调整如下：\n 螺纹钢期货rb2606、rb2607、rb2608、rb2609、rb2610、rb2611、rb2612、rb2701、rb2702合约的涨跌停板幅度从7%调整为5%，套保持仓交易保证金比例为6%，一般持仓交易保证金比例为7%； \n热轧卷板期货hc2606、hc2607、hc2608、hc2609、hc2610、hc2611、hc2612、hc2701、hc2702合约的涨跌停板幅度从7%调整为5%，套保持仓交易保证金比例为6%，一般持仓交易保证金比例为7%； \n不锈钢期货ss2606、ss2607、ss2608、ss2609、ss2610、ss2611、ss2612、ss2701、ss2702合约的涨跌停板幅度从8%调整为6%，套保持仓交易保证金比例为7%，一般持仓交易保证金比例为8%。", "ctime": 1778834623, "time_str": "16:43:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260515/c676726243.shtml"}, {"id": "4369629", "title": "昂利康：获得瑞舒伐他汀依折麦布片（I）药品注册证书", "content": "昂利康公告，近日，公司收到国家药品监督管理局签发的瑞舒伐他汀依折麦布片（I）《药品注册证书》。瑞舒伐他汀依折麦布片（I）主要用于治疗高胆固醇血症以及纯合子型家族性高胆固醇血症（HoFH）。公司于2024年11月获得药品上市许可申请受理通知书，并于近日获得国家药监局批准。根据国家相关政策规定，本次获得《药品注册证书》视同通过一致性评价。", "ctime": 1778834496, "time_str": "16:41:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260515/c676726177.shtml"}, {"id": "4369621", "title": "全链条补短板，多方发力推动生产性服务业“强筋健骨”", "content": "生产性服务业是推动经济增长、产业升级的关键力量。记者了解到，相关部门和地方正在协同发力全链条补强生产性服务业薄弱环节，推进生产性服务业向专业化和价值链高端延伸，为加快建设现代化产业体系提供有力支撑。国务院日前印发《关于推进服务业扩能提质的意见》，部署全链条补强生产性服务业薄弱环节，明确“强化科技服务支撑作用”“加快软件和信息服务创新发展”“做强做优商务服务”等，一系列举措将引导生产性服务业向专业化、定制化、精细化方向发展。“下一步，我们将重点围绕科技服务、现代物流、信息软件服务、供应链金融、节能环保、商务服务等6大领域17个重点环节进行布局。”国家发展和改革委员会副主任沈竹林表示，重点将促进设计研发环节向专业化、高端化发展，带动生产性服务业向研发和市场两端不断延伸。（新华社）", "ctime": 1778834375, "time_str": "16:39:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260515/c676726086.shtml"}, {"id": "4369619", "title": "中国中冶：2026年1-4月新签合同额2480.3亿元", "content": "中国中冶公告，公司2026年1-4月新签合同额为2480.3亿元，其中新签海外合同额为141.7亿元。4月份，公司部分新签单笔合同额在10亿元以上的重大工程承包合同包括梧州市万秀区龙湖镇旺步村富林建筑用砂岩矿EPC、矿山开采及矿产品加工服务总承包项目（47.0亿元）、广州市黄埔区云埔街火村社区莲潭经济合作社城中村改造项目（20.5亿元）和粤东城际铁路龙湖附中站TOD地块商住及配套工程项目（12.9亿元）。以上数据为阶段性数据，仅供投资者参考，最终数据以定期报告披露数据为准。", "ctime": 1778834329, "time_str": "16:38:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260515/c676726015.shtml"}, {"id": "4369615", "title": "香港经济今年第一季度强势扩张", "content": "香港特区政府今日（15日）发表2026年第一季度的本地生产总值修订数字。受对外贸易表现持续强劲和本地需求增强所带动，香港经济在2026年第一季度强劲扩张。实质本地生产总值在第一季度按年增长5.9%，较上一季度的4.0%增幅加快。经季节性调整后按季比较，实质本地生产总值明显上升2.9%。(大湾区之声)", "ctime": 1778834248, "time_str": "16:37:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260515/c676725965.shtml"}, {"id": "4369613", "title": "也门政府与胡塞武装将交换近1700名在押人员", "content": "也门政府与胡塞武装14日同意交换近1700名在押人员。联合国也门问题特使办公室说，这将是2014年9月也门冲突爆发以来规模最大的一次在押人员交换。胡塞武装参与交换在押人员谈判的官员阿卜杜勒-卡迪尔·穆尔塔达在社交媒体上宣布，根据与也门政府达成的协议，胡塞武装将释放580人，其中包括27名多国联军人员，也门政府将释放1100名胡塞武装人员。(新华社)", "ctime": 1778834211, "time_str": "16:36:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260515/c676725947.shtml"}, {"id": "4369589", "title": "仙琚制药：取得甲磺酸倍他司汀片境内生产药品注册证书", "content": "仙琚制药公告，近日收到国家药品监督管理局核准签发的关于甲磺酸倍他司汀片的《药品注册证书》（证书编号：2026S01523），公司甲磺酸 // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
