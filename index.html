迈基说，公司在中国设有生产基地，中国不仅有巨大的市场，也是重要的生产和供应链合作伙伴，希望未来在研发方面与中方伙伴有新的合作机会。 “中国不仅拥有丰富资源，还有巨大发展潜力。我们相信中国和芬兰两国在众多领域可以互相学习，彼此分享。”芬兰咨询公司英得弗集团高级咨询师先科说。(新华社)", "ctime": 1779425917, "time_str": "12:58:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260522/c676894841.shtml"}, {"id": "4395129", "title": "美众议院推迟表决限制特朗普对伊动武法案", "content": "美国众议院共和党领导层21日决定，推迟表决一项限制总统特朗普对伊朗动武权力的法案，引发民主党抗议。 美媒报道说，共和党领导层考虑到本党部分议员缺席，加之个别议员倒戈，可能难以否决民主党提出的这项法案，因此临时决定将原定当天的表决推迟到6月举行。 此举引发民主党不满。民主党众议员格雷戈里·米克斯说：“我们毫无疑问已经拿到了足够票数，他们也知道这一点，所以他们现在是在玩政治游戏。” 共和党方面则宣称，推迟投票是为了给当天缺席的议员保留投票机会。 美国国会参议院19日表决一项旨在限制特朗普动武权力的法案，要求特朗普结束对伊朗的军事行动，并在今后对伊朗采取任何军事行动前必须获得国会授权。当天的投票结果为50票赞成、47票反对。共和党参议员中有4人投了赞成票，另有3名共和党参议员缺席投票。此前，民主党人已7次在参议院提交旨在限制特朗普在伊朗问题上动武权力的法案。由于共和党占据参议院多数席位，法案均未获得通过。(新华社)", "ctime": 1779425708, "time_str": "12:55:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260522/c676894804.shtml"}, {"id": "4395081", "title": "“创客上海2026”暨第十一届“创客中国”上海中小企业创新创业大赛正式启动", "content": "5月21日上午，由上海市经济和信息化委员会主办的“创客上海2026”暨第十一届“创客中国”上海中小企业创新创业大赛启动仪式在漕河泾会议中心举行。本届“创客上海2026”赛事设置企业组与创业组两个类别，按八大赛道，从5月到9月分阶段开展预赛、复赛和决赛。优胜项目将推荐进入全国总决赛，并获得现金奖励、资金扶持、投融资对接、产业资源导入等全方位赋能服务。（科创板日报）", "ctime": 1779424415, "time_str": "12:33:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260522/c676894476.shtml"}, {"id": "4395079", "title": "洪都拉斯北部两起武装袭击事件已造成24人死亡", "content": "洪都拉斯北部21日发生两起武装袭击事件，已造成24人死亡。洪检察机关发言人尤里·莫拉接受媒体采访时说，科隆省特鲁希略市一座棕榈种植园当天发生武装袭击，已造成至少19人死亡。检方现场确认17具遗体，另有2具遗体可能已被家属带回家中。遇难者身份确认和尸检工作正在进行。另据洪都拉斯警方通报，同日，科尔特斯省奥莫阿市靠近危地马拉边境的地区发生另一起暴力事件，目前已造成5名警察死亡。据悉，洪北部部分地区长期受土地争端、毒品贩运和武装犯罪等问题影响，多年来谋杀、强制驱逐等事件频发。（央视新闻）", "ctime": 1779424156, "time_str": "12:29:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260522/c676894413.shtml"}, {"id": "4395067", "title": "联想集团董事长杨元庆：相信未来GPU服务器70%用于推理，30%用于训练", "content": "联想集团董事长兼CEO杨元庆在财报业绩沟通会上表示，AI基础设施正在爆发式增长，从训练向推理的转移速度非常快。目前AI基础设施GPU服务器70%、80%的用于训练，只有20-30%用于推理。相信未来会反过来，70%用于推理，30%用于训练，这并不意味着未来AI训练所需要的基础设施会减少，而是依然会进一步增长，仅靠大型云服务厂商已经不足以满足需求。（科创板日报）", "ctime": 1779423558, "time_str": "12:19:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260522/c676894304.shtml"}, {"id": "4395061", "title": "国家发展改革委：多举措保障春耕期间主要化肥品种供应充足价格稳定", "content": "记者从国家发展改革委今天举行的新闻发布会上了解到，受外部因素影响，今年春耕用肥高峰期间，国际化肥市场大幅波动。国家发展改革委正多举措有力保障春耕期间主要化肥品种供应充足、价格基本稳定。国家发展改革委新闻发言人李超表示，会压实重点企业保供责任、提前投放储备、保障口岸接卸和国内集疏运畅通、保障磷肥生产所需硫资源供应、加强市场预期引导，有力保障春耕期间主要化肥品种供应充足、价格基本稳定，比如国内尿素价格比国际市场每吨低3500元左右，有效满足了国内高峰用肥需求。下一步，将持续关注农业生产形势和粮食价格走势，统筹做好化肥保供稳价工作，为广大农民和农业经营主体提供更多便利。（央视新闻）", "ctime": 1779423487, "time_str": "12:18:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260522/c676894239.shtml"}, {"id": "4395047", "title": "5月22日午间公告一览：科伦药业子公司在ASCO年会上公布创新药物研究成果", "content": "科伦药业公告，公司控股子公司四川科伦博泰生物医药股份有限公司将在2026年美国临床肿瘤学会(ASCO)年会上公布多项临床研究成果。其中，靶向人滋养细胞表面抗原2(TROP2)抗体偶联药物(ADC)芦康沙妥珠单抗(sac-TMT)和新一代选择性转染过程中重排(RET)抑制剂富马酸仑博替尼(A400/EP0031)的研究入选转移性非小细胞肺癌口头报告专场。", "ctime": 1779423166, "time_str": "12:12:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260522/c676894125.shtml"}, {"id": "4395037", "title": "特朗普凯旋门方案获批", "content": "美国美术委员会当地时间5月21日批准了美国联邦政府提交的、拟在首都华盛顿特区建造类似“凯旋门”式建筑的设计方案。这是该项目推进过程中的关键一步。该委员会由美国总统特朗普亲自挑选的人员组成。委员会主席称：“这座建筑很美。”据了解，该方案较今年4月提交的版本略有修改，取消了底座的四头狮子雕像。根据效果图，这座“凯旋门”将位于林肯纪念堂和阿灵顿国家公墓之间的纪念环岛上。拱门从底部到装饰顶端将高达250英尺（约合76.2米），建成后将比30米高的林肯纪念堂高出很多，还将配有一系列金色装饰。特朗普今年2月初表示，计划在林肯纪念堂附近建造一座“巨型拱门”，以纪念美国独立250周年。这一计划引发争议，多名美国老兵和历史学家向华盛顿特区联邦地区法院提起诉讼，要求阻止建造拱门。 (CCTV国际时讯)", "ctime": 1779422643, "time_str": "12:04:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260522/c676894003.shtml"}, {"id": "4395013", "title": "港股午评：恒生指数涨1.22%，恒生科技指数涨2.08%", "content": "港股午间收盘，恒生指数涨1.22%，恒生科技指数涨2.08%。恒指港股通ETF银华（159318）涨0.3%，港股通科技ETF鹏华（159751）涨1.11%。板块方面，多品类零售、地面运输板块涨幅靠前；水务、食品板块跌幅靠前。个股方面，智谱涨19.6%，五一视界涨16.63%，联想集团涨16.05%，联想集团-R涨15.66%，滴普科技涨13.38%；伟易达跌12.75%，中国星集团跌6.14%，海底捞跌5.78%，同程旅行跌5.42%，贝壳-W跌5.0%。", "ctime": 1779422469, "time_str": "12:01:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260522/c676893971.shtml"}, {"id": "4395011", "title": "遭总统李在明痛批　韩媒就涉华假新闻道歉", "content": "韩国首尔经济TV电视台21日晚就其发布的“中国人大量购入首尔江南区公寓”节目内容以全体员工名义发表道歉声明。此前，韩国总统李在明批评该节目内容，称其为“故意捏造的虚假新闻”，“煽动厌华情绪”。(新华社)", "ctime": 1779422404, "time_str": "12:00:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260522/c676893908.shtml"}, {"id": "4395007", "title": "第四届链博会外资参展商中美国企业和机构数量居首", "content": "在今天的国新办发布会上，中国贸促会相关负责人在回答有关中美企业合作的问题时介绍，链博会是中美工商界合作的重要平台，在所有外资参展商中，美国参展企业和机构数量始终位居榜首。中国贸促会副会长刘健男表示，链博会是中美工商界开展务实合作的重要平台。从首届到今年第四届，美国参展企业和机构数量始终位列链博会外资参展商榜首。这次随访的多家世界500强美国企业都是链博会的“全勤生”或“老朋友”。美国佛罗里达州、新墨西哥州、犹他州等多地政府部门、商协会还将组团专程来华观展，美国大豆出口协会等机构将举办专题推介活动。（央视新闻）", "ctime": 1779422293, "time_str": "11:58:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260522/c676893882.shtml"}, {"id": "4395001", "title": "海关总署副署长王军会见乌拉圭牧农渔业部副部长卡拉姆布拉", "content": "5月21日下午，海关总署副署长王军在署会见乌拉圭牧农渔业部副部长卡拉姆布拉。双方就落实领导人共识、深化检验检疫和食品安全合作、建立智慧海关合作伙伴关系等议题交换意见。乌拉圭驻华大使卡夫拉尔参加会见。（海关发布）", "ctime": 1779421657, "time_str": "11:47:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260522/c676893719.shtml"}, {"id": "4394993", "title": "黎方称以军袭击黎南部多地 造成人员受伤", "content": "据黎巴嫩方面22日凌晨消息，以军对黎巴嫩南部多地发动袭击，造成人员受伤。黎真主党武装22日凌晨发布声明称，21日向黎南部多地的以军士兵和车辆发动多次火箭弹和无人机打击。以色列国防军22日早晨称，发现两名武装人员在黎巴嫩南部、距离以色列几百米的地方“以可疑方式移动”，以军随后发动空袭打击了这两人。（央视新闻）", "ctime": 1779421442, "time_str": "11:44:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260522/c676893658.shtml"}, {"id": "4394989", "title": "我国生物多样性保护成效显著", "content": "今天（5月22日）是国际生物多样性日。生态环境部今天在上海崇明岛举行2026年国际生物多样性日主题宣传活动，展示了我国生物多样性保护的实践成果。今年国际生物多样性日的主题为“护一方生灵，泽万物共荣”。2026年国际生物多样性日主题宣传活动发布《中国履行〈生物多样性公约〉第七次国家报告》。报告显示，与生物多样性有关的27个国家目标中，有21个目标取得了显著进展，为推进“昆蒙框架”全球目标实现作出中国贡献。同时，现场还举行了昆明生物多样性基金的捐资仪式等活动。（央视新闻）", "ctime": 1779421431, "time_str": "11:43:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260522/c676893657.shtml"}, {"id": "4394977", "title": "港股恒生科技指数涨幅达2%", "content": "港股恒生科技指数涨幅扩大至2%，恒生指数现涨1.10%。", "ctime": 1779421070, "time_str": "11:37:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260522/c676893529.shtml"}, {"id": "4394969", "title": "浙江推进科技创新和产业创新深度融合财政专项激励政策落地", "content": "近日，省财政厅联合省经信厅推出科技创新和产业创新深度融合财政专项激励政策，以工业大县为重点，支持18个县（市、区）率先在“两新”深度融合上探索新模式、取得新突破，扎实推进新型工业化。2026年—2028年创建期内，省财政每年安排15亿元、三年合计45亿元支持，紧扣产业结构显著优化和经济发展质效显著提升的目标，打通“两新”深度融合堵点卡点，促进各类优质创新要素向产业尤其是制造业高效集聚。", "ctime": 1779421053, "time_str": "11:37:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260522/c676893486.shtml"}, {"id": "4394941", "title": "ETF午评：港股通信息技术ETF领涨4.02%，创中盘88ETF领跌4.02%", "content": "ETF午间收盘涨跌不一，港股通信息技术ETF（159131）领涨4.02%，港股通信息技术ETF（526050）涨4.00%，创业板成长ETF（159967）涨3.82%，创中盘88ETF（159804）领跌4.02%，科创半导体设备ETF（588710）跌3.88%，半导体ETF（159582）跌3.83%。", "ctime": 1779420780, "time_str": "11:33:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260522/c676893204.shtml"}, {"id": "4394945", "title": " tock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260522/c676893124.shtml"}, {"id": "4394887", "title": "湖南省水利厅提升洪水防御应急响应至三级", "content": "根据当前防汛形势，按照《湖南省水利厅水旱灾害防御应急响应工作规程（修订）》有关规定，省水利厅于5月22日9时将洪水防御四级应急响应提升至三级。据气象水文部门最新预测预报，5月22日开始，湘中以北地区将再次遭遇强降雨过程，局地有暴雨、大暴雨。此次降雨过程累计雨量大、落区与前期降雨集中区高度重叠，致灾风险极高。全省各级水利部门要充分认识当前严峻的洪水防御形势，密切跟踪雨情、水情、汛情发展变化，及时启动洪水防御相应等级响应，进一步加强值班值守、会商研判、监测预报预警、水工程调度、巡查防守和抢险技术支撑，重点做好中小河流洪水、山洪灾害防御和水利工程安全度汛工作，全力确保人民群众生命财产安全。（央视新闻）", "ctime": 1779420004, "time_str": "11:20:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260522/c676892941.shtml"}, {"id": "4394879", "title": "MINIMAX-W港股涨超10%", "content": "MINIMAX-W港股涨10.56%，报730.00港元。", "ctime": 1779419894, "time_str": "11:18:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260522/c676892886.shtml"}, {"id": "4394865", "title": "中国贸促会：第四届链博会首次设立人工智能专区 集聚英伟达等中外人工智能领域领军企业", "content": "国新办就第四届中国国际供应链促进博览会筹备情况举行新闻发布会，中国贸促会副会长李兴乾表示，第四届链博会将“数字科技链”升级为“数智科技链”，是顺应经济发展与科技进步规律的主动作为。本届链博会与全球知名的半导体公司共同策划，首次设立人工智能专区，是按照从数据与感知，到算力与算法，再到应用与解决方案的产业演进路径进行的系统化设计。展陈目标是全链条展现人工智能从数据采集、智能计算到场景落地的完整生态。专区集聚了英伟达、英特尔、高通、阿里巴巴等中外人工智能领域的领军企业。本届链博会上，数字化、智能化应用将会无处不在，会覆盖展览展示、研讨交流、产业合作、智库成果以及服务保障的各环节。主宾省安徽省将以“人工智能+制造”为重点，展示智能网联汽车、新一代信息技术等硬核成果。以杭州“六小龙”为代表的浙江企业将携前沿成果亮相链博会。湖北将组织20多家高新技术企业专题展示具身智能产业链条。江苏等地方也将举办具身智能机器人产业推介对接活动。(人民财讯)", "ctime": 1779419611, "time_str": "11:13:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260522/c676892758.shtml"}, {"id": "4394829", "title": "国家发改委：夏粮丰产丰收基础稳固 预计异常气候不会有较大影响", "content": "记者从国家发展改革委今天举行新闻发布会上了解到，目前，我国夏粮丰产丰收基础较为稳固，预计异常气候不会对夏粮产量产生较大影响。国家发展改革委新闻发言人介绍说，夏粮是全年粮食生产的第一季，产量大概占全年粮食总产量的20%，直接关系全年粮食生产大局稳定。从生产情况看，占夏粮产量90%左右的冬小麦，长势与常年基本持平，夏粮丰产丰收基础较为稳固。根据国家气候中心监测，当前厄尔尼诺现象仍处于发展初期，冬小麦灌浆期已基本结束，也就是说产量已经大体形成，预计异常气候不 // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
