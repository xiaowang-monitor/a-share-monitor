const NEWS     = [{"id": "5363811", "title": "外交部：对话谈判是解决乌克兰危机的唯一可行出路", "content": "10月12日，外交部发言人毛宁主持例行记者会。有记者就美国总统称乌克兰和俄罗斯之间达成能源停火相关内容提问。毛宁表示，在乌克兰危机问题上，中方的立场是一贯的明确的。我们始终认为对话谈判是解决危机的唯一可行出路，支持一切有利于和平的努力。（央视新闻）", "ctime": 1791790518, "time_str": "15:35:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261012/c680585170.shtml"}, {"id": "5363795", "title": "小米入股初光跃迁 后者含AI及机器人业务", "content": "企查查APP显示，近日，上海初光跃迁智能科技有限公司发生工商变更，新增小米关联公司瀚星创业投资有限公司等为股东，同时注册资本增至60万元。企查查信息显示，该公司成立于2026年5月，经营范围包含智能机器人销售；智能机器人的研发；人工智能通用应用系统；人工智能基础资源与技术平台等。（人民财讯）", "ctime": 1791790336, "time_str": "15:32:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261012/c680585083.shtml"}, {"id": "5363791", "title": "外交部：对尼泊尔方面表示慰问 愿根据尼方需要提供力所能及的帮助", "content": "10月12日，外交部发言人毛宁主持例行记者会，有记者就尼泊尔滑坡相关内容提问。毛宁表示，目前我们还不掌握有中国公民在灾害中伤亡的情况，我们对尼泊尔方面表示慰问，也愿意根据尼方的需要提供力所能及的帮助。（央视新闻）", "ctime": 1791790319, "time_str": "15:31:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261012/c680585069.shtml"}, {"id": "5363779", "title": "教育部：已遴选出220所职业院校，打造技能型高校“国家队”", "content": "记者从教育部今天召开的新闻发布会获悉，落实分类推进高校改革部署，着眼“办学能力高水平、产教融合高质量”的“新双高”理念，教育部已启动实施第二期“双高建设计划”，遴选出220所职业院校，打造技能型高校“国家队”。这些学校服务国家经开区110个、高新区88个、自贸区等经济要素聚集区44个；服务万亿、千亿、百亿级区域产业占比分别为26.8%、43.9%、22.9%，服务一、二、三产业占比为6.1%、72.5%、21.4%，构建起适配区域产业发展的职业教育服务网络。在轨道交通装备、城市更新、工业母机等7个领域组建国家行业产教融合共同体，推动行业、企业开放283个重大工程项目和真实生产场景、60个重点实验室和技术中心，投入700余台生产设备，解密529份标准规范，共同推进高技能人才培养。在产教融合方面，企业和高校各自往前走一步，实现了人才供给直达产业岗位。（央视新闻）", "ctime": 1791790189, "time_str": "15:29:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261012/c680584993.shtml"}, {"id": "5363765", "title": "外交部：我们敦促日本当政者倾听和重视国内正义之声 正视问题的根源", "content": "10月12日，外交部发言人毛宁主持例行记者会。有记者问：近日，日本前外相、国际贸易促进协会会长访华后表示，导致中日关系恶化的原因在日方，日本政府应设法改善。日本国内也有声音批评逃避历史责任的做法导致日对华政策误入歧途，呼吁日本政府正视并解决问题。请问中方对此有何评论？对此，毛宁表示，这些表态体现了日本国内有识之士的理性和良知，中方予以积极评价。正如他们所说，问题的根源和实质在于日本当政者的历史观、中国观，出现严重偏差和谬误，严重破坏中日关系政治基础。这样的局面不符合双方利益，责任完全在日本一方。我们敦促日本当政者倾听和重视国内正义之声，正视问题的根源，恪守中日四个政治文件，在台湾、历史、对华认知的问题上切实反思纠错。（央视新闻）", "ctime": 1791790099, "time_str": "15:28:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261012/c680584969.shtml"}, {"id": "5363763", "title": "外交部回应反制措施：是对其加以惩戒以儆效尤", "content": "10月12日，外交部发言人毛宁主持例行记者会。有记者问，10月12日，外交部网站公布对巴拉圭通信和技术部长比利亚特、伯利兹外长丰塞卡采取反制措施决定，请发言人进一步介绍有关情况。毛宁表示，台湾问题是事关中国主权和国家统一的重大原则问题，是中国核心利益中的核心。巴拉圭和伯利兹个别政客甘当台湾当局“倚外谋独”的棋子，窜访台湾，并接待“台独”分裂分子窜访，严重干涉中国内政，散布中国网络攻击虚假信息，攻击抹黑中国，造成恶劣国际影响。针对有关人员行径，中方依据《中华人民共和国反外国制裁法》发布外交部令，公布反制措施，对其加以惩戒，以儆效尤。（央视新闻）", "ctime": 1791790056, "time_str": "15:27:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261012/c680584958.shtml"}, {"id": "5363761", "title": "外交部：美方应当慎重处理台湾问题", "content": "外交部发言人毛宁12日在例行记者会上答问时表示，中国在台湾岛以东海域拥有专属经济区和大陆架，中方在该海域开展活动完全是中国主权权利和管辖权范围内的事，正当合法、无可非议。“在这一海域挑起事端、破坏稳定的从来不是中方。”毛宁说，台湾问题是中国内政，不容任何外部干涉。美方应当恪守一个中国原则和中美三个联合公报，慎重处理台湾问题，以实际行动维护中美关系大局和地区和平稳定。（新华社）", "ctime": 1791790039, "time_str": "15:27:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261012/c680584950.shtml"}, {"id": "5363749", "title": "教育部：超12万个专业点 我国职业教育基本涵盖国民经济各领域", "content": "记者从教育部今天召开的新闻发布会获悉，我国建成了世界上规模最大且有质量的现代职业教育体系，在层次体系上，完成了“中等职业教育—高职专科教育—职业本科教育”的布局，截至2025年底，全国有中等职业学校（含技工学校）9151所，高职专科学校1554所。目前，职业本科学校共有124所，另有52所普通高校开设职业本科专业，打破了职业教育层次仅限于专科的“天花板”。在专业体系上，截至2025年底，职业教育设置19个专业大类、97个专业类、1491个专业，全国职校专业点超12万个，覆盖全部41个工业大类，基本涵盖国民经济各领域。（央视新闻）", "ctime": 1791789908, "time_str": "15:25:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261012/c680584920.shtml"}, {"id": "5363711", "title": "申昊科技等成立云感灵犀科技公司 含机器人业务", "content": "企查查APP显示，近日，云感灵犀科技（杭州）有限公司成立，经营范围包含人工智能应用软件开发；软件销售；智能机器人销售；通用设备修理等。企查查股权穿透显示，该公司由申昊科技全资子公司杭州申昊具身智能科技有限公司等共同持股。（人民财讯）", "ctime": 1791789391, "time_str": "15:16:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261012/c680584669.shtml"}, {"id": "5363659", "title": "叙利亚央行签发14年来首份信用证", "content": "叙利亚中央银行11日说，该行签发近14年来的首份信用证，为叙利亚石油公司与沙特阿美石油公司达成的石油产品供应协议提供便利。叙利亚央行说，这笔交易在一家美国主要银行的协调下完成。但叙方没有说明具体是哪家美国银行。信用证是银行根据开证申请人要求向受益人开立的有条件付款承诺，是国际贸易中最常用的结算方式之一。据悉，这笔交易标志着叙利亚在摘掉所谓“支持恐怖主义的国家”帽子和摆脱西方制裁后正重新接入国际金融体系。（央视新闻）", "ctime": 1791788843, "time_str": "15:07:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261012/c680584420.shtml"}, {"id": "5363637", "title": "王毅将作为习近平主席特别代表出席亚信峰会，并访问阿塞拜疆、克罗地亚、黑山、保加利亚", "content": "外交部发言人宣布：中共中央政治局委员、外交部长王毅将作为习近平主席特别代表出席10月15日在阿塞拜疆巴库召开的亚洲相互协作与信任措施会议第七次峰会，并于10月14日至20日访问阿塞拜疆、克罗地亚、黑山、保加利亚。(外交部网站)", "ctime": 1791788742, "time_str": "15:05:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261012/c680584355.shtml"}, {"id": "5363609", "title": "光大期货：远期过剩叙事下，碳酸锂暴跌超10%", "content": "周一，碳酸锂主力2701合约低开低走，盘中跌幅一度扩大至10%以上，自去年12月底以来首次跌破11万元整数关口。相较今年5月中旬超过20万元/吨的高点，不足半年间已近乎“腰斩”。 \n远期供应增量预期集中兑现，是压垮盘面的首要力量。上周末至本周初，多条供给端消息密集落地。10月11日，江特电机公告称收到国家矿山安全监察局下发的《江西省宜丰县茜坑锂矿300万吨/年采矿工程安全设施设计审查意见书》，原则同意该安全设施设计通过审查，该矿理论LCE产能约1.5万吨/年；此前10月8日，宜春市生态环境局再次发布枧下窝锂矿环评拟受理公示。作为全球最大单体锂云母矿，枧下窝满产年产能约10万吨碳酸锂当量，云母矿产能释放预期骤然强化，市场对远期供应进一步宽松的担忧集中发酵。\n后续来看，当前市场情绪较弱，现货暂未表现出短缺且需求弱预期压制。短期仍偏弱震荡运行，需要关注新的基本面及宏观变量，但鉴于仍然快速去库的节奏中，如若基差持续走强，叠加年底非洲及江西等供给扰动带来供需错配，锂价有望企稳反弹。而需求预期本身是既难证实又难证伪的，对这部分的预期修正较难，或将导致价格高度有限，如若负反馈出现，则价格仍可能继续下挫。（光大期货）", "ctime": 1791788602, "time_str": "15:03:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261012/c680584304.shtml"}, {"id": "5363577", "title": "ETF两市成交额报5295.24亿元，较昨日此时放量261.93亿元", "content": "截至目前，ETF两市成交额报5295.24亿元，较昨日此时放量261.93亿元，分类型来看，股票型ETF成交额1191.04亿元，债券型ETF成交额3040.51亿元，货币型ETF成交额413.49亿元，商品型ETF成交额77.27亿元，QDII型ETF成交额572.93亿元。其中，成交额最高的非货币型ETF分别是中韩半导体ETF（513310）、科创50ETF（588000）、纳指科技ETF（159509），成交额分别为：74.45亿元、61.89亿元、51.51亿元。", "ctime": 1791788507, "time_str": "15:01:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261012/c680584286.shtml"}, {"id": "5363555", "title": "ETF收评：纳指生物科技ETF领涨4.31%，通信ETF领跌5.07%", "content": "ETF收盘涨跌不一，纳指生物科技ETF（513290）领涨4.31%，巴西ETF（520870）涨2.87%，影视ETF（516620）涨2.65%，通信ETF（515880）领跌5.07%，纳指科技ETF（159509）跌4.84%，通信ETF（515050）跌4.64%。", "ctime": 1791788477, "time_str": "15:01:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261012/c680584279.shtml"}, {"id": "5363559", "title": "欧洲主要股指开盘集体上涨", "content": "欧洲主要股指开盘集体上涨，欧洲斯托克50指数涨0.42%，英国富时100指数涨0.34%，法国CAC40指数涨0.27%，德国DAX指数涨0.38%。", "ctime": 1791788477, "time_str": "15:01:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261012/c680584281.shtml"}, {"id": "5363557", "title": "A股收评：创业板指缩量调整跌2.61%，全市场超4300只个股下跌", "content": "A股三大指数今日集体下跌，截至收盘，上证指数跌0.43%，深证成指跌2.03%，创业板指跌2.61%，北证50跌2.46%，科创50指数跌2.1%。全市场成交额15507亿元，较上日缩量3659亿元，全市场超4300只个股下跌。板块题材上，AI视频、风电设备、银行、游戏、汽车整车、证券板块涨幅居前；贵金属、粮食概念、能源金属、油气开采及服务、MLCC、乳业板块跌幅居前。盘面上，字节跳动旗下海外短剧应用PineDrama下载量突破1亿，AI视频方向延续活跃，果麦文化、新华都、龙版传媒等10余股涨停。银行板块震荡上扬，中国银行、建设银行、工商银行盘中再创新高。风电设备板块同样表现积极，天顺风能封板，此前上市风电企业辟谣欧盟反倾销与反补贴立案调查的消息。另一方面，CPO、MLCC等算力硬件股午后继续表现疲弱，星网锐捷跌停，中际旭创、东山精密、长鑫科技等多股跌超5%，联讯仪器股价盘中失守1285元使得贵州茅台重回“股王”宝座。粮食概念股盘初冲高后大幅回落，新赛股份、辉丰股份领跌。", "ctime": 1791788473, "time_str": "15:01:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261012/c680584280.shtml"}, {"id": "5363539", "title": "期货收评：碳酸锂重挫跌超11%！甲醇大跌逾7% 橡胶沪银逆势走强", "content": "期货收评：截至收盘，大宗商品涨跌不一，碳酸锂重挫跌超11%，甲醇大跌超7%，沥青跌近4%；涨幅方面，橡胶、沪银涨超2%，沪锡、20号胶、豆一、焦煤、铂涨近2%。", "ctime": 1791788447, "time_str": "15:00:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261012/c680584269.shtml"}, {"id": "5363535", "title": "全国多地同步开展罚没走私烟草集中销毁活动", "content": "记者10月12日从公安部获悉，广东湛江、广西防城港、云南昆明、新疆乌鲁木齐等多地12日同步开展罚没走私烟草集中销毁暨“强治理、护民安、促发展”普法宣传活动，共计销毁走私卷烟1.88亿支、电子烟5.5万余支、烟丝2.7吨。此次销毁活动通过生物质发电等无害化环保方式实施，有效实现废弃物能源化、资源化利用。今年以来，国家烟草专卖局、公安部、海关总署等13个部门联合开展“清源断链”专项行动，集中打击各类涉烟违法犯罪活动。专项行动开展以来，全国共查处烟草走私案件4500余起，查获走私入境卷烟12.7亿支、雪茄烟15万支、烟丝烟叶39.8吨，货值23.7亿元。（新华社）", "ctime": 1791788440, "time_str": "15:00:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261012/c680584267.shtml"}, {"id": "5363525", "title": "股指期货午盘收盘 主力合约多数收跌", "content": "股指期货午盘收盘，主力合约多数收跌。沪深300股指期货(IF)主力合约跌0.49%，上证50股指期货(IH)主力合约涨0.35%，中证500股指期货(IC)主力合约跌1.87%，中证1000股指期货(IM)主力合约跌1.43%。", "ctime": 1791788416, "time_str": "15:00:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261012/c680584261.shtml"}, {"id": "5363527", "title": "TrendForce：DDR5 16Gb (2Gx8) 4800/5600现货均价较上日上涨0.91%", "content": "TrendForce数据显示，10月12日内存颗粒DDR5 16Gb (2Gx8) 4800/5600现货均价较上日上涨0.91%，DDR4 16Gb (2Gx8) 3200现货均价较上日上涨0.29%，DDR4 8Gb (1Gx8) 3200现货均价较上日下跌0.23%。", "ctime": 1791788416, "time_str": "15:00:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261012/c680584262.shtml"}, {"id": "5363485", "title": "美驻沙特使馆发布安全警示", "content": "美国驻沙特阿拉伯大使馆今天（10月12日）发布安全警示称：鉴于安全风险，在沙特工作的美国政府雇员使用利雅得的哈立德国王国际机场以及吉达、达曼的机场，都需要获得特别授权，使用沙特所有主要机场时都务必要保持高度警惕。(CCTV国际时讯)", "ctime": 1791788148, "time_str": "14:55:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261012/c680584202.shtml"}, {"id": "5363465", "title": "超3000亿！多只债券型ETF放量成交", "content": "债券型ETF成交持续火爆，截至发稿，债券型ETF成交额达3000亿元，较上一交易日的全天成交额2073亿大幅放量。ETF成交额前20中除华宝添益ETF（511990）、银华日利ETF（511880）与中韩半导体ETF（513310），余下17只全为债券型ETF：其中短融ETF海富通（511360）成交额超540亿、公司债ETF南方（511070）成交额超180亿、科创债ETF汇添富（551520）成交额超125亿。", "ctime": 1791788001, "time_str": "14:53:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261012/c680584179.shtml"}, {"id": "5363407", "title": "贵州：为白酒核心企业建立绿色通道，及时响应融资需求", "content": "近日，《贵州省金融支持“卖酒向卖生活方式”转变实施方案》公布。其中提到，提升白酒产业链金融服务水平，为白酒产业链提供结算、融资、财务管理等综合性金融解决方案；为白酒核心企业建立绿色通道，及时响应融资需求。拓宽现有经营主体融资渠道。支持地方性金融机构发行金融债券募集资金，用于支持“卖酒向卖生活方式”转变相关经营主体。鼓励金融机构为经营主体盘活存量资产提供参股或控股型并购贷款支持。（人民财讯）", "ctime": 1791787623, "time_str": "14:47:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261012/c680583921.shtml"}, {"id": "5363381", "title": "苹果首席运营官Sabih Khan参观富士康和裕同科技", "content": "10月12日，苹果公司大中华区董事总经理葛越发布消息，苹果公司首席运营官Sabih Khan到访郑州，与郑州富士康员工进行交流。Sabih Khan还到访了裕同科技。据介绍，双方通过共同努力，实现了从所有苹果产品包装中移除塑料的目标。（第一财经）", "ctime": 1791787453, "time_str": "14:44:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261012/c680583868.shtml"}, {"id": "5363367", "title": "侨源股份在新疆投资成立气体公司", "content": "企查查APP显示，近日，侨源气体（新疆）有限公司成立，经营范围包含石油天然气技术服务；陆地管道运输；气体、液体分离及纯净设备销售等。企查查股权穿透显示，该公司由侨源股份全资持股。（人民财讯）", "ctime": 1791787287, "time_str": "14:41:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261012/c680583770.shtml"}, {"id": "5363361", "title": "联讯仪器下跌，贵州茅台重回“股王”宝座", "content": "联讯仪器日内跌超7.5%，股价失守1285元，贵州茅台重回“股王”宝座。", "ctime": 1791787246, "time_str": "14:40:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261012/c680583739.shtml"}, {"id": "5363289", "title": "四季度伊始多地中小银行收提示：压降债券久期，金融投资增速不得高于贷款增速", "content": "从多位知情人士处获悉，近期部分省份中小银行收到提示，要求金融投资增速不得高于贷款增速、新增债券久期不得高于存量久期。相关知情人士表示，各地指导力度、形式存在差异。如华东某省明确要求中小银行压降债券久期，新增组合久期低于存量，还要求机构定期提交数据报告；西部某省强调金融投资增速不能高于贷款，显示并非直接限制配债总规模，初衷应该是希望地方银行加大对本地实体经济信贷投放。值得关注的是，这一要求是在四季度伊始、中小银行债券持仓量较低的时间点发出。（财联社）", "ctime": 1791786792, "time_str": "14:33:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261012/c680583561.shtml"}, {"id": "5363255", "title": "韩国综指收跌3.65%", "content": "韩国综指收跌3.65%，报6384.24点。日本股市休市。", "ctime": 1791786713, "time_str": "14:31:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261012/c680583520.shtml"}, {"id": "5363221", "title": "赛力斯港股短线拉升涨超10%，A股接近涨停", "content": "赛力斯港股短线拉升涨超10%，A股接近涨停。消息面上，据报问界汽车计划于2027年进入欧洲市场。此外，乘联分会数据显示，9月新能源乘用车企业总体走势较强，月度批发销量突破万辆的厂商达22家。其中赛力斯汽车9月批发销量为25373辆。", "ctime": 1791786627, "time_str": "14:30:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261012/c680583479.shtml"}, {"id": "5363185", "title": "港交所行政总裁：正积极研究延长衍生产品的夜市交易时间", "content": "10月12日，香港交易所集团行政总裁陈翊庭发布新一期CEO网志。值得注意的是，陈翊庭本次发声信息量巨大，其中包括还将就优化特专科技公司和GEM上市制度展开咨询；吸引更多国际企业来港进行主要或第二上市；与内地合作伙伴正在进行将房地产信托基金（REIT）纳入沪深港通和人民币股票柜台纳入港股通的准备工作；正积极研究延长衍生产品的夜市交易时间，至于延长股票市场交易时间，香港交易所将从引领市场讨论开始，寻找市场各方都能接受的方案。（证券时报）", "ctime": 1791786418, "time_str": "14:26:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261012/c680583387.shtml"}, {"id": "5363181", "title": "三一重工成立机械技术服务公司 含AI硬件销售业务", "content": "企查查APP显示，近日，浙江三一机械技术服务有限公司成立，经营范围包含集中式快速充电站；电池制造；电子产品销售；人工智能硬件销售等。企查查股权穿透显示，该公司由三一重工间接全资持股。（人民财讯）", "ctime": 1791786367, "time_str": "14:26:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261012/c680583369.shtml"}, {"id": "5363167", "title": "天顺风能：已停止向欧盟出口塔筒，相关反倾销措施对公司目前经营无影响", "content": "就“公司塔筒（风塔）产品出口欧盟目前适用的反倾销税率是多少？实施条例（EU）2021/2239将于2026年12月17日到期。公司是否知悉欧盟本土生产商已提交期终（日落）复审申请？若该措施到期失效或被延续，对公司欧洲业务的影响如何”等相关提问，天顺风能10月12日在互动平台表示，自受2021年12月反倾销措施的影响，公司已停止向欧盟出口塔筒。另外，当前公司战略发展业务重心聚焦海工装备与零碳实业等高附加值赛道。对公司目前经营无影响。（人民财讯）", "ctime": 1791786293, "time_str": "14:24:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261012/c680583324.shtml"}, {"id": "5363161", "title": "聚焦前沿发展与创新应用 首届亚太地球科学与遥感大会召开", "content": "今天（10月12日），首届亚太地球科学与遥感大会在青岛开幕。大会为期三天，以“面向可持续清洁地球发展的遥感应用”为主题，吸引了来自20个国家和地区，230余家高校、科研院所、相关企业的专家学者共1000余人参加会议。大会面向地球科学与遥感领域前沿发展，聚焦多源遥感观测、先进传感技术、数据分析方法与可持续发展应用，旨在搭建亚太地区及全球遥感科技工作者交流合作的重要平台，推动地球科学与遥感技术在资源环境监测、海洋与大气观测、灾害应急、气候变化应对和可持续发展等领域的创新应用。(央视新闻)", "ctime": 1791786231, "time_str": "14:23:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261012/c680583242.shtml"}, {"id": "5363153", "title": "和邦生物：厄尔尼诺等气候现象对除草剂需求的影响存在不确定性", "content": "和邦生物在10月12日召开的2026年半年度业绩说明会上表示，下半年以来，公司磷矿产品生产和销售一切正常，暂不存在销售价格及毛利率预期大幅波动的风险。草甘膦行业供需及价格受多重因素影响，公司保持正常生产经营，双甘膦、草甘膦产线均满负荷生产，今年公司以去库存、盘活现金流为工作重点，但会根据市场预判及时调整出货量。厄尔尼诺等气候现象对全球农业及除草剂需求的影响存在不确定性。（人民财讯）", "ctime": 1791786178, "time_str": "14:22:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261012/c680583211.shtml"}, {"id": "5363145", "title": "中国信通院启动首批“营销智能体应用能力”测评", "content": "为进一步推动营销智能体规范应用，中国信息通信研究院泰尔终端实验室启动首批“营销智能体应用能力”测评参与企业征集工作。本次测评重点关注模型接入与配置、任务理解与上下文处理、营销知识使用、任务规划与执行、工具调用、交互操作、运行记录以及访问控制与内容安全等通用能力，并围绕市场与客户分析、营销策划、营销内容创作、营销沟通与推荐四类场景开展测试，结合具体任务核验结果及其业务用途。（人民财讯）", "ctime": 1791786046, "time_str": "14:20:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261012/c680583077.shtml"}, {"id": "5363143", "title": "胡塞武装一天四袭沙特，四国联合谴责", "content": "据沙特阿拉伯主导的多国联军、沙特民航总局和也门胡塞武装等方面11日消息，10日至11日，胡塞武装对沙特境内机场和能源设施实施多次军事行动。此外，沙特主导的多国联军发言人12日在社交媒体上称，联军拦截并摧毁了也门胡塞武装向沙特西南部海米斯穆谢特发射的一枚弹道导弹。胡塞武装11日说，过去24小时内，该组织使用导弹和无人机对沙特境内机场和能源设施实施4次军事行动。沙特、埃及、巴基斯坦和土耳其11日发布联合声明，强烈谴责胡塞武装袭击沙特，并要求该组织立即、无条件停止此类袭击。（新华社）", "ctime": 1791786020, "time_str": "14:20:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261012/c680583066.shtml"}, {"id": "5363141", "title": "韩国：新生儿增多 商家争抢“宝宝VIP”", "content": "随着韩国新生儿数量增长，各大商家争相推出高档婴儿商品、配套服务，甚至为小宝宝量身定做VIP会员系统，带动相关市场迅速膨胀。韩国《中央日报》12日引述统计部门数据报道，截至今年7月，韩国新生儿数量已连续25个月同比增加。今年前7个月，新生儿数量同比增加14.7%。今年7月，韩国共有24275名婴儿出生，为2019年以来同期最高纪录。其中，一孩占全部出生人数的63.4%，同比上升1.7个百分点；二孩和三孩占比略有下降。（新华社）", "ctime": 1791786011, "time_str": "14:20:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261012/c680583064.shtml"}, {"id": "5363115", "title": "三星电子正在研发三种类型的 z-NAND闪存", "content": "业内人士12日透露，三星电子正在拓展其下一代NAND闪存产品“zNAND”的应用范围，初步研发三种类型的 z-NAND闪存，除了最近发布的z-NAND-O之外，还包括z-NAND-T和z-NAND-I。三星电子去年8月在美国举办的一场存储器相关活动上首次展示了z-NAND-O的样机。(科创板日报)", "ctime": 1791785852, "time_str": "14:17:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261012/c680582950.shtml"}, {"id": "5363105", "title": "深证成指跌2%", "content": "深证成指跌幅扩大至2%，上证指数跌0.57%，创业板指跌2.5%。", "ctime": 1791785812, "time_str": "14:16:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261012/c680582937.shtml"}, {"id": "5363101", "title": "科创50指数跌幅扩大至2%", "content": "科创50指数跌幅扩大至2%，现报1428.1点。成份股中仅9股飘红。", "ctime": 1791785748, "time_str": "14:15:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "" const SECTORS  = [{"name": "金融", "hit_count": 59, "etfs": []}, {"name": "人工智能", "hit_count": 41, "etfs": []}, {"name": "数据要素", "hit_count": 34, "etfs": []}, {"name": "半导体", "hit_count": 30, "etfs": []}, {"name": "消费", "hit_count": 20, "etfs": []}, {"name": "新能源", "hit_count": 19, "etfs": []}, {"name": "机器人", "hit_count": 9, "etfs": []}, {"name": "军工", "hit_count": 5, "etfs": []}];
const META     = {"update_time": "2026-10-12 15:36:03", "sentiment_score": 58.57142857142857, "agents": []};

// 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">

        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
