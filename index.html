"", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260505/c676453830.shtml"}, {"id": "4317349", "title": "阿联酋全国学校转为远程教学", "content": "当地时间4日，阿联酋教育部宣布，全国各地学校再次转为远程教学，相关安排将持续至8日。有关部门表示，此举与当前地区局势紧张有关。4日，阿联酋称遭到伊朗导弹和无人机的袭击。这也是自美伊临时停火以来，阿联酋首次遭袭。此前，在当地学生进行了近七周的远程学习后，阿联酋各地学校4月20日曾恢复线下授课。（央视新闻）", "ctime": 1777959324, "time_str": "13:35:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260505/c676453818.shtml"}, {"id": "4317293", "title": "飞猪、小红书发布“五一”出行趋势报告：近七成用户基于兴趣选目的地 体验型商品增速超大盘", "content": "5月5日，飞猪与小红书联合发布《“五一”出行趋势报告》。报告显示，人群分化、主题出行已跃升为旅行决策的首要驱动力。小红书数据显示，69%的用户基于兴趣决定出行目的地；在飞猪平台，体验型商品增速跑赢大盘，新一批各具特色的小众目的地集中爆发。与此同时，使用AI的用户咨询量显著攀升，“来自AI的建议”正成为游客出行决策的关键变量。（人民财讯）", "ctime": 1777958772, "time_str": "13:26:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260505/c676453795.shtml"}, {"id": "4317275", "title": "韩外交部：船只在霍尔木兹海峡爆炸起火原因有待调查", "content": "韩国外交部5日表示，由韩国公司运营的一艘巴拿马籍船只4日在霍尔木兹海峡发生爆炸起火的原因，将在该船被拖曳至附近港口后展开调查。 韩国外交部当天向新华社记者确认，包括6名韩国籍船员在内的全部24名船员均未受伤，目前船上火势已被扑灭。 韩国外交部还表示，爆炸起火原因以及船只受损情况将在该船被拖抵附近港口后进行详细调查。目前相关方面正在安排拖船，具体拖曳日程尚未确定。 另据韩联社5日报道，针对美国总统特朗普要求韩国加入所谓“自由计划”疏导行动，韩国总统府青瓦台官员当天回应说，政府的当务之急是查明事故原因。 特朗普4日在社交媒体发文，称伊朗当天向包括一艘韩国货船在内的船只开火，敦促韩国政府参与美国所谓霍尔木兹海峡被困船只疏导行动。(新华社)", "ctime": 1777958434, "time_str": "13:20:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260505/c676453783.shtml"}, {"id": "4317273", "title": "中证协启动案例征集 强化券商子公司合规风控", "content": "中国证券业协会近日启动了针对券商子公司在金融“五篇大文章”及合规风控管理方面的优秀实践案例征集。此次行动旨在挖掘和展示另类投资、私募基金和资产管理等子公司在创新实践中的突出成效，并通过标杆案例厘清券商母子公司联动服务国家战略的有效路径。通知要求，报送案例需为2024年1月1日以来有显著成效的项目，并强调案例的高质量和可推广性。这一征集工作将推动券商子公司更明确地服务国家战略，并在合规风控方面发挥积极作用。(中证金牛座)", "ctime": 1777958322, "time_str": "13:18:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260505/c676453773.shtml"}, {"id": "4317267", "title": "全国铁路“五一”假期运输期间旅客发送量突破1亿人次", "content": "记者5日从中国国家铁路集团有限公司获悉，5月4日，全国铁路发送旅客2038.3万人次，至此，4月29日“五一”假期运输启动以来全国铁路累计发送旅客1.17亿人次，运输安全平稳有序。 5月5日，铁路返程客流继续攀升，全国铁路预计发送旅客2300万人次，计划加开旅客列车2225列。 从铁路12306车票预售情况看，5日热门出发城市主要有北京、广州、成都、上海、杭州、武汉、西安、重庆、深圳、郑州；热门到达城市主要有北京、广州、上海、成都、深圳、武汉、杭州、西安、郑州、南京；南宁至广州、北京至上海、成都至西安、上海至北京、沈阳至北京、武汉至上海、西安至成都、太原至北京、广州至南宁、呼和浩特至北京等热门区间客流集中。 各地铁路部门积极应对返程客流高峰，统筹利用运力资源，全力保障旅客平安有序返程。国铁南昌局集团公司在南昌至杭州、九江至广州等热门方向加开旅客列车381列，其中夜间高铁12列。国铁广州局集团公司在广深地区往返潮州、汕头、湛江等热门方向加开旅客列车707列。国铁乌鲁木齐局集团公司在成都、兰州、和田等热门方向加开旅客列车66列，安排36列动车组列车重联运行。(新华社)", "ctime": 1777958081, "time_str": "13:14:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260505/c676453758.shtml"}, {"id": "4317251", "title": "港股汇丰控股午后直线下挫，现跌超4%", "content": "港股汇丰控股午后直线下挫，现跌超4%；公司此前在港交所公布一季度财报显示，第一季度除税后利润为73.94亿美元，去年同期为75.7亿美元。", "ctime": 1777957822, "time_str": "13:10:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260505/c676453741.shtml"}, {"id": "4317243", "title": "港股长和午后直线拉升，现涨近4.5%", "content": "港股长和午后直线拉升，现涨近4.5%；消息面上，长和午间公告，拟43亿英镑注销Vodafone Three49%持股。", "ctime": 1777957797, "time_str": "13:09:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260505/c676453738.shtml"}, {"id": "4317155", "title": "伊朗媒体：伊朗南部一港口多艘船只起火", "content": "据伊朗迈赫尔通讯社5日报道，伊朗南部一港口的多艘船只起火，火情仍在持续，起火原因尚不明确。(新华社)", "ctime": 1777956952, "time_str": "12:55:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260505/c676453705.shtml"}, {"id": "4317149", "title": "澳洲央行表示，一如预期，中东局势进展正对通胀产生影响", "content": "澳洲央行表示，一如预期，中东局势进展正对通胀产生影响。燃料价格上涨加剧通胀，且有迹象表明，这可能会对更广泛的商品和服务价格产生第二轮效应。", "ctime": 1777956419, "time_str": "12:46:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260505/c676453685.shtml"}, {"id": "4317115", "title": "澳洲央行宣布将指标利率从4.10%上调至4.35%，预估为4.35%", "content": "澳洲央行宣布将指标利率从4.10%上调至4.35%，预估为4.35%。", "ctime": 1777955481, "time_str": "12:31:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260505/c676453642.shtml"}, {"id": "4317059", "title": "世卫组织：涉疫邮轮出现7个病例　公众面临风险较低", "content": "世界卫生组织4日发布的“洪迪厄斯”号邮轮汉坦病毒疫情相关通报显示，目前船上已出现7个病例，根据现有信息和以往对病毒的了解，公众面临的总体风险较低。\n\n世卫组织4日发布的最新通报说，该机构2日接到“洪迪厄斯”号上有乘客发生严重急性呼吸道疾病并出现死亡病例的报告，截至4日已报告7个病例，包括2个经实验室确诊的汉坦病毒感染病例和5个疑似病例，其中3人死亡，1人病情危重，另外3人症状轻微。所有患者的发病时间介于4月6日至28日之间，症状表现为发热、胃肠道不适等，甚至迅速发展为肺炎、急性呼吸窘迫综合征和休克。(新华社)", "ctime": 1777954925, "time_str": "12:22:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260505/c676453618.shtml"}, {"id": "4317045", "title": "长和在港交所公告称，和记拥有的Vodafonethree 49%股份将按代价金额43亿英镑予以注销", "content": "长和在港交所公告称，和记拥有的Vodafonethree 49%股份将按代价金额43亿英镑予以注销。", "ctime": 1777954427, "time_str": "12:13:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260505/c676453603.shtml"}, {"id": "4317039", "title": "五一假期全国铁路累计发送旅客超1亿人次", "content": "记者从中国国家铁路集团有限公司获悉，5月4日，全国铁路发送旅客2038.3万人次，4月29日五一假期运输启动以来全国铁路累计发送旅客1.17亿人次，运输安全平稳有序。5月5日，铁路返程客流继续攀升，全国铁路预计发送旅客2300万人次，计划加开旅客列车2225列。（央视新闻）", "ctime": 1777954267, "time_str": "12:11:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260505/c676453592.shtml"}, {"id": "4317035", "title": "联合国结束从土耳其进入叙利亚的跨境人道主义行动", "content": "联合国秘书长发言人迪雅里克4日说，随着边境口岸重新向商业运输开放以及通过常规路线运送物资的状况得到改善，联合国已结束从土耳其进入叙利亚的跨境人道主义行动。 迪雅里克在例行记者会上说，自跨境人道主义行动开始以来，联合国成功调动超过6.5万辆卡车运送关键援助物资跨境运输，平均每年向125万叙利亚人提供援助。就行动规模、协调复杂性以及在叙境内运输面临的挑战而言，这是规模最大、最为复杂的人道主义供应链之一。 迪雅里克表示，叙利亚对外贸易关系逐步恢复正常，扩大了通过常规商业渠道运送人道主义物资的机会。这一变化反映了人道主义援助交付方式的转变。不过，叙利亚的人道主义需求依然十分巨大，目前超过1300万人需要粮食援助，1200万人需要清洁水源，另有近1300万人需要医疗卫生方面的支持。 联合国安理会2014年7月通过决议，授权联合国人道主义机构及其执行伙伴可跨越边界线和冲突线，向叙利亚人民提供紧急人道主义救援。安理会随后多次延长这一授权。(新华社)", "ctime": 1777953990, "time_str": "12:06:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260505/c676453569.shtml"}, {"id": "4316999", "title": "港股午评：恒生指数跌1.16%，恒生科技指数跌1.83%", "content": "港股午间收盘，恒生指数跌1.16%，恒生科技指数跌1.83%。板块方面，工业集团企业、半导体产品与设备板块涨幅靠前；通信设备、汽车板块跌幅靠前。个股方面，天星医疗涨132.49%，量化派涨9.35%，怡俊集团控股涨8.4%，华勤技术涨8.2%，粤港湾控股涨7.81%；群核科技跌7.19%，轻松健康跌7.05%，瑞浦兰钧跌6.42%，五一视界跌6.25%，赛力斯跌6.17%。", "ctime": 1777953681, "time_str": "12:01:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260505/c676453542.shtml"}, {"id": "4316985", "title": "2026年五一档观影人次突破1891万 超过去年", "content": "据灯塔专业版，截至5月4日11时40分，2026年五一档总观影人次突破1891万，已超过去年五一档最终观影人次成绩（1890.85万）。", "ctime": 1777953444, "time_str": "11:57:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260505/c676453533.shtml"}, {"id": "4316983", "title": "苏丹决定召回驻埃塞俄比亚大使", "content": "苏丹外交部5日凌晨发表声明说，苏丹决定召回本国驻埃塞俄比亚大使，并已做好与埃塞俄比亚公开对抗的准备。\n\n苏丹外交部长穆希丁·萨利姆在声明中说，4日袭击苏丹设施的无人机自埃塞俄比亚巴赫达尔机场起飞，苏丹有权以适当方式回应这一“侵略”。“我们无意对任何国家发动侵略，但对来犯之举必将予以回击。”(新华社)", "ctime": 1777953343, "time_str": "11:55:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260505/c676453530.shtml"}, {"id": "4316977", "title": "英特尔美股夜盘涨超3%", "content": "英特尔美股夜盘涨超3%，有报道称苹果正考虑与英特尔和三星合作，为其设备制造处理器。", "ctime": 1777952986, "time_str": "11:49:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260505/c676453515.shtml"}, {"id": "4316975", "title": "美军称在加勒比海打死两名毒贩", "content": "美军南方司令部4日说，美军当日在加勒比海对一艘由恐怖组织运营的船只进行了打击，两名毒贩被打死。(新华社)", "ctime": 1777952976, "time_str": "11:49:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260505/c676453514.shtml"}, {"id": "4316973", "title": "韩国通报该国霍尔木兹海峡起火船只最新情况", "content": "当地时间5月5日上午，据韩国外交部消息，此前一日在霍尔木兹海峡附近爆炸起火的韩国船只，经确认所有24名船员无人员伤亡，船只已经完成灭火，但相关船只能否继续正常航行仍不清楚，将在停靠临近港口后进行检查以及修理。韩国外交部表示，事故具体原因预计在停靠后检查船只过程中查清。据了解，这艘船只由韩国海运企业HMM（原现代商船）运营。HMM方面表示，爆炸声传出后，机舱左舷起火，船员随即释放二氧化碳展开灭火作业，持续约4小时。HMM方面表示，尚无法确认是遭受外部袭击，还是船舶内部问题引发爆炸。HMM计划调派拖船，将受损船舶转移至附近的迪拜港，相关作业预计需耗时数日。（央视新闻）", "ctime": 1777952865, "time_str": "11:47:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260505/c676453508.shtml"}, {"id": "4316967", "title": "比特币升破81000美元，日内涨1.46%", "content": "比特币升破81000美元，日内涨1.46%。", "ctime": 1777952394, "time_str": "11:39:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260505/c676453488.shtml"}, {"id": "4316963", "title": "ST华谊0.06%股权司法拍卖竞拍持续 出价已较二级市场溢价超5%", "content": "记者记者从京东资产平台获悉，在今日王忠磊持有的ST华谊180万股（约占公司总股本的0.06%）无限售流通股的司法拍卖中，目前竞拍最高出价345.06万元，折合每股价格约1.92元，较二级市场现价（4月30日收盘价 1.82元/股）溢价超过5%，目前竞拍仍在进行中。（财联社）", "ctime": 1777952207, "time_str": "11:36:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260505/c676453480.shtml"}, {"id": "4316945", "title": "印度尼西亚央行表示，将优化外汇市场干预措施", "content": "印度尼西亚央行表示，将优化外汇市场干预措施。", "ctime": 1777951839, "time_str": "11:30:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260505/c676453443.shtml"}, {"id": "4316917", "title": "业内人士：没有了精神航空，美国普通家庭可能更难买得起机票", "content": "业内观察人士预计，美国机票票价上涨已成定局。Spirit Airlines精神航空虽然宣布倒闭，但其增长及盈利能力，一度促使大型航司开发自己的基础经济舱产品，并加快了降价步伐。美国交通部监察长办公室（Office of Inspector General）在2024年的一份研究报告中发现，当包括Spirit、Frontier Airlines和Allegiant在内的廉价航司开始执飞新航线时，大型航空公司会相应下调最低档票价。 航空咨询公司Atmosphere Research Group创始人Henry Harteveldt表示，Spirit的策略让更多原本无力负担机票的普通大众也能乘飞机出行。他指出，没有了Spirit，时薪劳动者和普通家庭可能更难买得起机票。（新浪财经）", "ctime": 1777951288, "time_str": "11:21:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260505/c676453416.shtml"}, {"id": "4316915", "title": "高通前高管将加入英特尔，领导客户端计算与物理AI事业部", "content": "5月5日，英特尔宣布，英特尔公司宣布两项重要领导层任命。Alex Katouzian将于5月加入英特尔，担任执行副总裁兼客户端计算与物理AI事业部总经理。Katouzian此前任职于高通技术公司，担任执行副总裁兼手机、计算和XR事业群总经理。英特尔同时宣布，正式任命此前担任代理首席技术官的Pushkar Ranade出任首席技术官。", "ctime": 1777951158, "time_str": "11:19:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260505/c676453411.shtml"}, {"id": "4316913", "title": "巴西小飞机撞居民楼 3人死亡", "content": "巴西米纳斯吉拉斯州医院基金会4日晚证实，当天中午在该州首府贝洛奥里藏特市发生的小飞机撞楼事故中的一名伤者最终不治身亡，致使该事故死亡人数上升至3人。（新华社）", "ctime": 1777950560, "time_str": "11:09:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260505/c676453383.shtml"}, {"id": "4316909", "title": "苹果据悉正评估在美国用英特尔和三星来生产其主要设备芯片", "content": "苹果据悉正评估在美国用英特尔和三星来生产其主要设备芯片。(财联社)", "ctime": 1777949977, "time_str": "10:59:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260505/c676453330.shtml"}, {"id": "4316907", "title": "连续45年下降　日本15岁以下儿童人数创新低", "content": "日本总务省4日公布的数据显示，截至4月1日，日本未满15周岁的儿童人数为1329万，较去年减少35万，连续45年下降；当前日本15岁以下儿童占总人口比例为10.8%，较去年下降0.3个百分点；相关儿童人数及其所占人口比例均创1950年有相关统计数据以来新低。据日本共同社报道，日本15岁以下儿童人数在1954年达到2989万峰值后开始减少，迄今已缩减过半。1947年至1949年第一次婴儿潮时期过后的1950年，15岁以下儿童数量占总人口比例一度高达35.4%，随后占比整体呈下降趋势。(新华社)", "ctime": 1777949887, "time_str": "10:58:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260505/c676 // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
