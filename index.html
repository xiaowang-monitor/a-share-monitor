.score-bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s; }
.up { color: var(--red); }
.down { color: var(--green); }
.pulse { animation: pulse 2s infinite; }
@keyframes pulse {

  50% { opacity: 0.5; }

tps://news.10jqka.com.cn/20260506/c676479408.shtml"}, {"id": "4324841", "title": "美国政府关闭移民拘留监察员办公室", "content": "美国国土安全部5月5日证实，美国移民拘留监察员办公室已被关闭。美国土安全部发言人在向媒体发送的邮件中称，关停移民拘留监察员办公室缘于国会批准的拨款不足，“这是国会所为。众议院通过国土安全部拨款法案，上周经签署生效”。不过，有美国媒体报道指出，相关法案文本并未要求关闭该办公室，此举是为了迫使部分移民放弃相关申请。报道认为，当前的美国政府一直在扩充移民拘留设施容量，而关停监察员办公室直接削弱了对移民拘留设施的监管力度。移民拘留监察员办公室由美国会立法设立，2019年获批筹建、2021年正式成立，负责审查移民拘留系统中的虐待与不当行为。 (CCTV国际时讯)", "ctime": 1778059011, "time_str": "17:16:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260506/c676479403.shtml"}, {"id": "4324835", "title": "天舟九号顺利撤离空间站", "content": "天舟九号货运飞船顺利撤离空间站组合体，将于近期择机受控再入大气层。(新华社)", "ctime": 1778058737, "time_str": "17:12:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260506/c676479297.shtml"}, {"id": "4324833", "title": "南王科技：与杭州兑意等共同设立上海成真造物文化创意有限公司", "content": "南王科技公告，公司与杭州兑意文化创意有限公司、惠安伟煌投资合伙企业（有限合伙）共同出资设立上海成真造物文化创意有限公司，注册资本为人民币1000万元，公司认缴出资人民币510万元，占注册资本的51%。成真造物文化已完成工商注册登记手续，并取得了徐汇区市场监督管理局颁发的《营业执照》。成真造物文化设立后成为公司控股子公司，纳入公司合并报表范围。", "ctime": 1778058714, "time_str": "17:11:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260506/c676479277.shtml"}, {"id": "4324827", "title": "福田汽车：2026年4月销量60373辆，新能源汽车10349辆", "content": "福田汽车公告，2026年4月销量中重型货车18770辆、轻型货车36836辆、轻型客车3665辆，乘用车656辆，合计60373辆，其中新能源汽车10349辆；产量中重型货车13785辆、轻型货车31672辆、轻型客车1658辆，乘用车1184辆，合计48573辆，其中新能源汽车10284辆；发动机产品销量28176台、产量20330台。", "ctime": 1778058659, "time_str": "17:10:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260506/c676479251.shtml"}, {"id": "4324819", "title": "美媒：白宫认为与伊朗接近达成停战谅解备忘录", "content": "据美国媒体6日报道，两名美国官员及另外两名知情人士透露，白宫认为，与伊朗接近达成一份一页的谅解备忘录。该备忘录旨在结束战争，并为更详细的核问题谈判设定框架。(新华社)", "ctime": 1778058528, "time_str": "17:08:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260506/c676479151.shtml"}, {"id": "4324815", "title": "高盛对宁德时代的多头持仓比例降至6.35%", "content": "据香港交易所披露，高盛对宁德时代新能源科技股份有限公司 - H股的多头持仓比例于2026年4月30日从7.7%降至6.35%。", "ctime": 1778058494, "time_str": "17:08:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260506/c676479131.shtml"}, {"id": "4324811", "title": "人工智能能力建设国际合作之友小组专题会议在联合国总部举行", "content": "人工智能能力建设国际合作之友小组（人工智能之友小组）专题会议5日在联合国总部举行。中国常驻联合国代表傅聪和赞比亚常驻联合国代表莫莱博共同主持会议。中国科技部副部长陈家昌、中国科协党组成员罗晖出席会议并致辞。 傅聪表示，人工智能之友小组成立以来，通过务实项目合作推动数字化转型、能力建设。中国将继续坚持以人为本、多边主义、力求实效，推动人工智能普惠向善、惠及全球。 莫莱博强调，应促进人工智能普惠公平，服务全球南方发展优先事项。联合国数字和新兴技术特使吉尔呼吁在人工智能国际合作中构建政策、科学和能力建设三大支柱。 陈家昌表示，中国坚持走开源开放的人工智能创新之路，加快构建普惠全球的技术创新生态，为国际社会搭建交流互鉴平台。 罗晖表示，中国科协愿同各方共同打造多元共赢的人工智能能力建设开放生态，助力全球南方平等参与智能化发展进程。 来自50多个国家和国际组织的120多名代表参加了本次会议。中外专家分享了人工智能赋能工程能力、深空运算、国际合作前沿成果与实践经验。各国代表高度评价人工智能之友小组在人工智能能力建设领域的积极作用，希望进一步搭建合作框架、采取务实举措，确保人工智能普惠向善。(新华社)", "ctime": 1778058473, "time_str": "17:07:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260506/c676479121.shtml"}, {"id": "4324801", "title": "韩国船只爆炸起火同伊朗无关", "content": "今天（5月6日）下午，据多家韩国媒体消息，伊朗驻韩国使馆表示，一艘韩国船只5月4日在霍尔木兹海峡地区爆炸起火一事“同伊朗无关”。此前，事发后，美国总统特朗普曾称是“伊朗攻击了韩国船只”。(CCTV国际时讯)", "ctime": 1778058347, "time_str": "17:05:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260506/c676479049.shtml"}, {"id": "4324789", "title": "今年“五一”假期银联网联共处理支付交易金额7.85万亿元", "content": "记者从中国人民银行了解到，支付业务数据显示，2026年“五一”假期（2026年5月1日—5月5日），银联、网联共处理支付交易289.37亿笔，金额7.85万亿元，较去年“五一”假期（2025年5月1日—5月5日）分别增长23.45%和2.74%。其中，处理境外来华人员支付交易笔数、金额较去年同期分别增长45.15%和36.96%。（央视新闻）", "ctime": 1778058263, "time_str": "17:04:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260506/c676478958.shtml"}, {"id": "4324771", "title": "中指研究院：1—4月上海宅地出让金居全国首位", "content": "中指研究院的数据显示，1—4月，全国TOP20城市宅地出让金占全国的比重为60%，其中，上海出让金为285亿元，居全国首位；广州出让金为268亿元，位居第二；北京出让金为218亿元，位居第三。（人民财讯）", "ctime": 1778058053, "time_str": "17:00:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260506/c676478842.shtml"}, {"id": "4324755", "title": "今年前3个月 我国全行业对外直接投资同比增长5.4%", "content": "记者从商务部了解到，今年前3个月，我国全行业对外直接投资同比增长5.4%。今年1至3月，我国全行业对外直接投资3094.5亿元，同比增长5.4%。其中，对外承包工程业务完成营业额2593.5亿元，同比增长5.7%。1至3月，我国企业在共建“一带一路”国家非金融类直接投资612.7亿元。对外承包工程方面，我国企业在共建“一带一路”国家新签承包工程合同额3485.1亿元，同比增长2.4%；完成营业额2186.9亿元，同比增长10%。此外，我国境内投资者共对全球140个国家和地区的4111家境外企业进行了非金融类直接投资，累计投资2328.6亿元。（央视新闻）", "ctime": 1778057971, "time_str": "16:59:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260506/c676478557.shtml"}, {"id": "4324751", "title": "税收发票数据显示：“五一”假期消费相关行业销售收入同比增长14.3%", "content": "国家税务总局5月6日发布的增值税发票数据显示，“五一”假期消费相关行业销售收入同比增长14.3%。其中，旅游娱乐文体服务消费方面，旅游游览和娱乐服务销售收入同比增长21.2%；在生活服务消费方面，居民家庭服务销售收入同比增长14.2%，消费者健康消费活动有所增加，居民健康服务销售收入同比增长40.1%；在餐饮及住宿消费方面，餐饮销售收入同比增长31.4%、民宿服务同比增长13.3%；在商品消费方面，综合零售销售收入同比增长12.4%；消费潜力进一步释放。(新华社)", "ctime": 1778057942, "time_str": "16:59:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260506/c676478547.shtml"}, {"id": "4324743", "title": "NYMEX取暖油主力合约大跌6% CBOT豆油主力合约跌超2%", "content": "NYMEX取暖油主力合约大跌6%，现报3.78美元/加仑。CBOT豆油主力合约跌超2%，现报75.37美分/磅。", "ctime": 1778057863, "time_str": "16:57:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260506/c676478516.shtml"}, {"id": "4324741", "title": "金瑞矿业：股东李健已减持0.96%", "content": "金瑞矿业公告，持股5%以上股东李健原持股1527.66万股、占5.3011%，曾计划2026年2月2日至2026年5月1日集中竞价减持不超280万股（1%）。截至2026年5月1日，累计减持275.64万股，占0.96%，成交价区间14.82～1 arket": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260506/c676478251.shtml"}, {"id": "4324669", "title": "莎普爱思：终止购买上海勤礼实业100%股权", "content": "莎普爱思公告，公司决定终止购买上海勤礼实业有限公司100%股权暨关联交易的事项。本次终止购买股权暨关联交易的事项已经公司第六届董事会第十五次会议审议通过，关联董事已回避表决。终止本次交易事项是经公司审慎研究，并与交易对方协商一致的结果。终止本次交易事项不会对公司现有生产经营活动、财务状况造成重大不利影响，也不会影响公司未来的发展战略，不存在损害公司及全体股东利益的情形。", "ctime": 1778057307, "time_str": "16:48:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260506/c676478193.shtml"}, {"id": "4324667", "title": "珍宝岛：公司部分药品拟中选全国中成药采购联盟集中带量采购", "content": "珍宝岛公告，近日，公司及全资子公司羽迪药业分别参加了全国中成药联合采购办公室组织的全国中成药采购联盟集中带量采购项目（第四批）和全国中成药采购联盟集中带量采购项目（第二批接续），根据全国中成药联合采购办公室发布的《关于全国中成药采购联盟集中带量采购拟中选结果的公示》显示，公司及全资子公司羽迪药业部分产品在本次全国中成药集中带量采购项目中拟中选。", "ctime": 1778057301, "time_str": "16:48:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260506/c676478189.shtml"}, {"id": "4324665", "title": "九州通：子公司通过药品GMP符合性检查", "content": "九州通公告，子公司北京京丰制药（山东）有限公司收到山东省药品监督管理局核准签发的《药品GMP符合性检查告知书》。山东京丰的801车间片剂生产线年生产能力为35亿片，主要产品为盐酸二甲双胍肠溶片，适应症为2型糖尿病的治疗。该生产线于2026年3月18日至20日接受检查，符合《药品生产质量管理规范》（2010年版）的要求。此次通过GMP符合性检查，有利于公司保持产品质量和生产能力，满足市场需求。", "ctime": 1778057295, "time_str": "16:48:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260506/c676478186.shtml"}, {"id": "4324663", "title": "今年第5号台风“黑格比”生成", "content": "据中央气象台消息，今天（5月6日）14时，今年第5号台风“黑格比”（热带风暴级）在西北太平洋洋面上生成。其中心位于菲律宾马尼拉东偏南方向约2950公里的洋面上，就是北纬8.4度、东经147.3度，中心附近最大风力有8级（18米/秒）。预计“黑格比”将以每小时30公里左右的速度向西偏南方向快速移动，强度变化不大。（央视新闻）", "ctime": 1778057148, "time_str": "16:45:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260506/c676478130.shtml"}, {"id": "4324655", "title": "灿能电力：翟宁、姚东方、刘静已分别减持0.0821%、0.2563%、0.0421%", "content": "灿能电力公告，翟宁通过集中竞价于2026年3月3日至3月4日减持74000股，占总股本0.0821%，减持价区间30.02元/股-33.66元/股；姚东方于2026年2月10日至3月4日减持23.1万股，占0.2563%，价格26.12元/股-33.8元/股；刘静于2026年2月26日至4月28日减持37922股，占0.0421%，价格23.11元/股-33.43元/股；减持计划已完成。", "ctime": 1778057070, "time_str": "16:44:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260506/c676478093.shtml"}, {"id": "4324653", "title": "广汽集团：4月汽车产量同比增23.28%销量增3.88%", "content": "广汽集团公告，公司2026年4月汽车产量13.39万辆，同比增长23.28%；本年累计产量52.87万辆，同比增长1.71%。4月销量12.1万辆，同比增长3.88%；本年累计销量50.09万辆，同比增长2.74%。子公司广汽丰田本月产量60501辆，销量56500辆；广汽埃安本月产量37140辆，销量38034辆；新能源汽车本月产量47625辆，销量54605辆。", "ctime": 1778057067, "time_str": "16:44:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260506/c676478088.shtml"}, {"id": "4324649", "title": "特朗普建议中国停止进口伊朗原油，外交部：能源政策建议向有关方面了解", "content": "5月6日，外交部发言人林剑主持例行记者会。有记者提问，特朗普总统最近表示，中国领导人值得尊敬，并表示美国没有被中国挑战。他同时还建议中国停止从伊朗进口原油，并希望中国可以购买更多原油。中方如何回应他的这些言论？另外，美国财政部长日前表示，中国应该支持美国在霍尔木兹海峡的有关行动，并指责中国在联合国阻挠涉及霍尔木兹海峡的有关决议。中方对此有何回应？林剑表示，你提到的第一个问题，中美双方就特朗普总统访华一事保持着沟通，目前没有可以提供的信息。关于伊朗局势，中方已经多次阐明自己的立场。对于中国能源政策的具体问题，建议你向有关方面了解。第二个问题，中方对霍尔木兹海峡局势的立场很明确，就是希望相关各方审慎行事，避免局势升级，通过对话化解争端，早日恢复海峡和平安宁。中方将为推动海峡局势的降温继续做出努力，也将继续全力维护中资船舶和中国籍船员的安全。（澎湃新闻）", "ctime": 1778056941, "time_str": "16:42:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260506/c676478021.shtml"}, {"id": "4324647", "title": "伊朗官员：霍尔木兹海峡的安全只能由伊朗及其人民来保障", "content": "伊朗外交部议会与法律事务总司负责人努拉巴迪6日表示，美国此前以所谓“自由计划”为名，在阿曼湾部署多艘军舰试图为船只护航、打开霍尔木兹海峡通道，但由于伊朗武装力量的强力回应以及伊朗伊斯兰革命卫队的严正警告，美国未能成功通过霍尔木兹海峡，“该行动已以失败告终”。他表示，任何美国及其盟友在霍尔木兹海峡和波斯湾的军事冒险，都将给他们带来难以承受的代价，并使局势更加复杂。他指出，伊朗的立场已明确表达，霍尔木兹海峡的安全只能由伊朗及其人民来保障。（央视新闻）", "ctime": 1778056882, "time_str": "16:41:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260506/c676477992.shtml"}, {"id": "4324635", "title": "格力博：陈寅等多名股东合计增持金额1001.67万元", "content": "格力博公告，陈寅增持18.77万股，金额270.29万元；GHHK经平证资管QFII增持45.39万股，金额731.38万元；合计增持64.16万股，金额1001.67万元；董事LEE LAWRENCE增持65000股，金额100.52万元；财务总监徐友涛增持32900股，金额50.73万元。本次增持计划自2025年11月3日至2026年5月2日，现已完成。", "ctime": 1778056743, "time_str": "16:39:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260506/c676477939.shtml"}, {"id": "4324627", "title": "财政部今年将在香港发行840亿元人民币国债", "content": "经国务院批准，2026年财政部将在香港特别行政区，分六期发行840亿元人民币国债。其中，前两期共计295亿元人民币国债已分别于2月、4月发行。(财政部官网)", "ctime": 1778056703, "time_str": "16:38:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260506/c676477909.shtml"}, {"id": "4324623", "title": "月之暗面将完成20亿美元新融资，估值破200亿美元", "content": "Kimi（月之暗面）即将完成新一轮20亿美元融资，投后估值突破200亿美元。本轮融资由美团龙珠领投，中国移动、CPE（中信产业基金）等参投，其中仅龙珠就出手超2亿美元。今年1月和2月，Kimi刚密集完成3轮融资，分别融了5亿美元、7亿美元和7亿美元。算上这笔最新融资，不到半年里，Kimi融资超39亿美元，最新估值相比去年11月的约43亿美元翻了4倍有余。至此，Kimi累计融资额已超376亿人民币，成为大模型创业公司中累计融资最多的公司。算上IPO募资，MiniMax累计融资约150亿人民币，智谱约130亿人民币。截至5月6日午间休市，MiniMax市值约2100亿人民币，智谱约3470亿人民币。(财经网)", "ctime": 1778056604, "time_str": "16:36:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260506/c676477879.shtml"}, {"id": "4324609", "title": "工信部批复北京国电高科科技有限公司开展卫星物联网业务商用试验", "content": "近日，落实《工业和信息化部关于优化业务准入促进卫星通信产业发展的指导意见》工作部署，按照《工业和信息化部关于组织开展卫星物联网业务商用试验的通知》要求，工业和信息化部批复北京国电高科科技有限公司（以下简称国电高科）开展卫星物联网业务商用试验，试验期为两年。期间，国电高科可依法试点经营卫星物联网业务，依托“天启星座”为用户提供广覆盖、低功耗、高可靠的物联网连接服务，在海洋渔业、能源水利、交通物流等领域实现全天候、智能化的数据采集与远程控制。（工信部）", "ctime": 1778056478, "time_str": "16:34:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260506/c676477782.shtml"}, {"id": "4324603", "title": "“五一”假期上海口岸出入境人员达59.3万人次", "content": "5月6日，记者从上海边检总站获悉，今年“五一”假期，上海边检机关累计查验出入境人员59.3万人次，查验出入境（港）交通运输工具4091架（艘）次。节日期间，上海口岸出境内地居民达15.9万人次，占出境旅客总量的57.1%。受上海周边地区中小学春假带动，短途跨境亲子游格外火爆，韩国、中国香港、泰国等成为内地居民出境游玩的热门目的地。随着中国免签政策红利的持续释放，假日期间入境旅游热度同步攀升。众多外籍游客专程来到上海，游览城市地标、品鉴中式美食、感受传统文化。据统计，“五一”假期上海口岸入境外籍旅客达7.7万人次，同比增长2.3%。其中，利用免签政策入境的外籍旅客达5万人次，占入境外籍旅客总数的64.7%，免签政策持续为口岸入境旅游、经贸往来注入活力。（央视新闻）", "ctime": 1778056318, "time_str": "16:31:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260506/c676477718.shtml"}, {"id": "4324595", "title": "威胜信息：4月中标金额2.23亿元", "content": "威胜信息公告，4月中标国家电网有限公司2026年营销项目第一次计量设备公开招标采购项目，中标金额7743.73万元；南方电网数字电网科技（广东）有限公司2026年一季度第一批集采公开招标框架采购项目，中标金额3834万元；国网浙江省电力有限公司2026年第一次电网物资协议库存公开招标采购项目，中标金额2688.94万元；中国南方电网有限责任公司2025年数字变电站、数字输电和智能配电系列传感终端以及北斗终端第二批框架招标项目，中标金额2677.3万元；国网冀北电力有限公司2026年第一次物资框架协议公开招标采购项目，中标金额2261.55万元；国网安徽省电力有限公司2026年第一次物资公开招标采购项目，中标金额1832.52万元；国电南京自动化股份有限公司2026年度工程配套电能质量在线监测装置框架招标项目，中标金额1284.38万元。以上项目中标金额合计为人民币2.23亿元，占公司2025年度经审计的营业总收入的7.50%。", "ctime": 1778056235, "time_str": "16:30:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260506/c676477689.shtml"}, {"id": "4324559", "title": "潍柴动力今日涨停，有3家机构专用席位净卖出4.42亿元", "content": "潍柴动力今日涨停，成交额42.20亿元，换手率2.46%，盘后龙虎榜数据显示，深股通专用席位买入15.56亿元并卖出1.49亿元，2家机构专用席位净买入1.09亿元，有3家机构专用席位净卖出4.42亿元。", "ctime": 1778055853, "time_str": "16:24:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260506/c676477451.shtml"}, {"id": "4324553", "title": "德福科技今日20cm涨停，2家机构专用席位净买入1.05亿元", "content": "德福科技今日20cm涨停，成交额36.70亿元，换手率11.80%，盘后龙虎榜数据显示，深股通专用席位买入3.67亿元并卖出5.08亿元，2家机构专用席位净买入1.05亿元，有2家机构专用席位净卖出6621.72万元。", "ctime": 1778055817, "time_str": "16:23:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260506/c676477436.shtml"}, {"id": "4324547", "title": "云南锗业今日涨停，2家机构专用席位净买入1.56亿元", "content": "云南锗业今日涨停，成交额91.01亿 function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
