15日，证券时报记者从中国长城资产管理股份有限公司了解到，该公司日前与浙江省国有资本运营有限公司签署战略合作协议和浙江国有存量资产盘活基金合作协议。本次落地的浙江首只国有存量资产盘活基金，通过市场化模式盘活国有存量资产，依托REITs发行、物权转让、股权转让等方式实现退出，回笼资金将重点投向战略性新兴产业和未来产业。根据协议，中国长城资产与浙资运营将重点围绕国有存量资产盘活、基金设立运营、风险防范化解、产业协同投资等方面开展深度合作。（人民财讯）", "ctime": 1781502445, "time_str": "13:47:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260615/c677461902.shtml"}, {"id": "4528107", "title": "俄称赫尔松地区两座桥梁遭乌袭击受损", "content": "俄罗斯任命的赫尔松地区行政长官萨利多当地时间15日早间通报，乌军14日夜间至15日凌晨的大规模无人机袭击导致赫尔松地区两座连接克里米亚的桥梁受损。根据通报，琼加尔大桥再次遭袭，导致克里米亚半岛北部的占科伊公路检查站交通中断。连接格尼切斯克与阿拉巴特沙嘴的桥梁也遭到打击，交通中断。同日，俄罗斯图拉州州长米利亚耶夫通报称，15日凌晨图拉市住宅区遭无人机袭击。初步信息显示，3人遇难，3人受伤，包括1名1岁儿童。米利亚耶夫称，14日夜间至15日凌晨，16架乌克兰无人机在图拉州范围内被击落。图拉州位于首都莫斯科市以南，与莫斯科州接壤。目前乌克兰方面暂无回应。（央视新闻）", "ctime": 1781502369, "time_str": "13:46:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260615/c677461885.shtml"}, {"id": "4528097", "title": "电力板块局部走高，京能电力触及涨停", "content": "电力板块局部走高，京能电力触及涨停，广西能源、豫能控股、协鑫能科、大唐发电、长源电力跟涨。", "ctime": 1781502243, "time_str": "13:44:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260615/c677461839.shtml"}, {"id": "4528091", "title": "乌克兰首都遭大规模空袭 俄罗斯图拉市遭无人机袭击", "content": "据《乌克兰真理报》报道，乌克兰首都基辅15日凌晨遭俄军大规模空袭，造成4人死亡、至少25人受伤。俄罗斯图拉州州长德米特里·米利亚耶夫15日在社交媒体上说，图拉市多处民宅当天凌晨遭无人机袭击，造成3人死亡、3人受伤。（新华社）", "ctime": 1781502228, "time_str": "13:43:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260615/c677461836.shtml"}, {"id": "4528083", "title": "现货黄金短线走低超10美元", "content": "现货黄金短线走低超10美元，现报4320美元/盎司。", "ctime": 1781502140, "time_str": "13:42:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260615/c677461809.shtml"}, {"id": "4528079", "title": "山推股份：智能推土机产品尚处在小范围推广阶段 整体营收及利润占比较低", "content": "山推股份6月15日在互动平台表示，今年以来，公司已实现51台智能推土机的销售，产品尚处在小范围推广阶段，整体营收及利润占比较低。公司未来将持续推动产品迭代升级，进一步实现产品与业务场景的精准匹配，由技术创新驱动产品渗透率的持续提升。（人民财讯）", "ctime": 1781502059, "time_str": "13:40:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260615/c677461786.shtml"}, {"id": "4528071", "title": "极佳视界获10亿元B2轮融资", "content": "近日，极佳视界获10亿元B2轮融资，本轮融资由新加坡顶级跨境投资机构狮城资本（多轮持续追投）、中国-比利时基金（中比基金）、建投投资、万向钱潮、复星锐正、华盖创赢、金创投、德屹资本、华仓资本、元石基金等国家队基金、产业资本、财务机构、国资平台共同投资，国中资本、达晨财智、图灵资管等多个老股东持续加注。本轮融资将主要用于“双金字塔”数据与算法体系的持续投入、物理AGI基础模型的研发迭代，以及C端家庭场景与B端工业场景的规模化落地。此前2026年3月和4月，极佳视界已分别完成10亿元Pre-B轮和15亿元B1轮融资。（界面新闻）", "ctime": 1781502027, "time_str": "13:40:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260615/c677461773.shtml"}, {"id": "4528057", "title": "中科宇航：力箭一号今年发射任务基本已经排满", "content": "6月15日11时44分，力箭一号遥十四运载火箭在东风商业航天创新试验区点火升空，成功将8颗卫星精准送入预定轨道。这是该型号火箭今年的第三次发射，该型火箭累计已将105颗卫星送入太空，入轨载荷总质量超15吨，成为国内唯一发射卫星总数过百的民商火箭型号。“力箭一号，今年的发射任务基本已经排满。”中科宇航方面表示。（财联社）", "ctime": 1781501877, "time_str": "13:37:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260615/c677461713.shtml"}, {"id": "4528053", "title": "小金属板块持续拉升，中钨高新触及涨停", "content": "小金属板块持续拉升，中钨高新触及涨停，锡业股份、翔鹭钨业、章源钨业、华锡有色、东方钽业跟涨。", "ctime": 1781501835, "time_str": "13:37:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260615/c677461693.shtml"}, {"id": "4528035", "title": "黎巴嫩媒体称有村镇遭敌方袭击", "content": "据黎巴嫩国家通讯社15日报道，一架敌方无人机袭击了黎巴嫩泰卜尼特村的一辆汽车，有人员受伤。此外，泰卜尼特村等地还遭到敌方炮击。(新华社)", "ctime": 1781501624, "time_str": "13:33:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260615/c677461633.shtml"}, {"id": "4528027", "title": "京津冀进出口总值前5个月突破2万亿元", "content": "记者从天津海关获悉，今年前5个月，京津冀地区进出口总值达2.09万亿元，同比增长14.4%，占同期我国外贸进出口总值的10.1%。其中，出口6308.4亿元，增长11.5%；进口1.46万亿元，增长15.8%。5月当月实现进出口4843.4亿元，创单月历史新高。（天津日报）", "ctime": 1781501509, "time_str": "13:31:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260615/c677461610.shtml"}, {"id": "4528009", "title": "2026年“春招”共提供超1268万个岗位", "content": "记者从人力资源社会保障部了解到，2026年全国城市联合招聘高校毕业生春季专场活动日前结束，共提供超1268万个岗位信息。活动期间，各地聚焦人工智能、低空经济、绿色低碳、先进制造、数字经济等重点领域，加大优质岗位开发力度。举办西部地区、雄安新区等区域性专场招聘活动，运用AI、大数据，为毕业生提供个性化、精准化的求职服务。线上线下共举办2.3万场招聘会，67.4万家用人单位提供岗位信息1268.1万个，吸引1352.4万人次高校毕业生参与求职。（央视新闻）", "ctime": 1781501302, "time_str": "13:28:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260615/c677461551.shtml"}, {"id": "4528003", "title": "以方称不受美伊协议涉黎条款约束 将继续在黎军事部署", "content": "以色列消息人士15日透露，在以色列总理内塔尼亚胡与美国总统特朗普14日的通话中，内塔尼亚胡明确表示，以色列不认为自身将受可能达成的美伊协议中黎巴嫩相关条款的约束。以色列国防军不会从黎巴嫩撤离，并将留在近期占领的阵地，继续打击来自黎巴嫩真主党的威胁。打击行动将包括摧毁基础设施以及回应任何针对以色列的袭击。消息人士称，这意味着协议不会束缚以色列在黎巴嫩的行动，但以方这些表态能否经受住现实情况的考验，仍然有待观察。（央视新闻）", "ctime": 1781501145, "time_str": "13:25:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260615/c677461501.shtml"}, {"id": "4527987", "title": "光伏加工设备板块走高，晶盛机电涨超10%", "content": "光伏加工设备板块走高，晶盛机电涨超10%，帝尔激光、高测股份、捷佳伟创、奥特维、连城数控等跟涨。", "ctime": 1781500824, "time_str": "13:20:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260615/c677461408.shtml"}, {"id": "4527979", "title": "巴基斯坦外长欢迎美伊达成谅解备忘录", "content": "当地时间6月15日，巴基斯坦副总理兼外交部长达尔在社交媒体发文，欢迎美国与伊朗达成谅解备忘录。达尔说，这一重大突破体现了持续外交接触的力量，以及友好国家共同选择对话而非对抗的坚定决心。达尔说，巴基斯坦始终积极同所有相关方保持接触，并一贯倡导保持克制和开展建设性互动，坚持认为对话与外交仍是解决所有问题的唯一可行途径。达尔说，随着有关未决事项的谈判继续推进，巴基斯坦愿继续支持一切旨在巩固这一积极进展的努力。（央视新闻）", "ctime": 1781500642, "time_str": "13:17:22", "stock_code": "", "stock_name": "", "stock_market // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

  }
  tbody.innerHTML = PICKS.map(p => {

      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },

    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);

        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
