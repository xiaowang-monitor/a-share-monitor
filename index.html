为智能时代筑牢网络根基。当前，基于人工智能大模型的各类应用蓬勃发展，Token流量呈现爆发式增长趋势，对网络承载能力提出了新要求。IPv6凭借海量地址空间、高效路由机制和内生安全能力成为支撑大模型应用的关键底座。这次专项行动为期一年，将着力增强大模型IPv6规模化应用能力，完善大模型IPv6管理规范，提高大模型基础设施IPv6支持水平，推动大模型应用IPv6放量引流，提升大模型API调用IPv6访问占比，推进大模型与IPv6融合创新，促进互联网向原生智能演进。今天还正式启动了雄安新区IPv6单栈部署行动。雄安新区将全面推进单栈IPv6部署，从夯基础、广赋能、强攻关、育生态四个维度协同发力，到2030年新建片区将全面实现IPv6单栈规模化运行。（央视新闻）", "ctime": 1785212759, "time_str": "12:25:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260728/c678481827.shtml"}, {"id": "4818259", "title": "生益科技松山湖第二工厂项目正式动工", "content": "7月28日，总投资约52亿元的生益科技松山湖第二工厂项目正式动工。项目聚焦AI服务器高频高速材料、智能汽车电子基材、高端封装基板材料等前沿领域，建成后将年产4800万平方米高性能覆铜板、1亿米商品粘结片。（东莞发布）", "ctime": 1785212704, "time_str": "12:25:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260728/c678481803.shtml"}, {"id": "4818257", "title": "六部门发布通告：禁止涉军队退役报废装备销售活动", "content": "中央军委后勤保障部、中央军委装备发展部、中央军委政法委员会、公安部、国家市场监督管理总局、国家国防科技工业局于7月23日发布《关于禁止涉军队退役报废装备销售活动的通告》。通告指出，严禁任何单位和个人销售军队退役报废装备，严禁生产、改装或利用退役报废装备拆解件等拼装、组装，且销售足以使公众视为军队装备的仿制品，严禁以任何形式进行军队退役报废装备和足以使公众视为军队装备的仿制品商业营销宣传。相关职能部门要密切配合，加强对涉军队退役报废装备市场销售和商业营销宣传活动的常态化监督检查。对危及社会公共安全、军事秘密安全等，以及违反有关法律规定的，依法依规严肃查处；构成犯罪的，依法追究刑事责任。（央视新闻）", "ctime": 1785212641, "time_str": "12:24:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260728/c678481783.shtml"}, {"id": "4818255", "title": "香港特区政府与国家工信部签署《关于推进部港共建制造业创新中心的合作协议》", "content": "香港特区政府与国家工业和信息化部今日在特区政府总部签署《关于推进部港共建制造业创新中心的合作协议》。《合作协议》旨在切实推进双方于2024年9月签署的《关于发展新质生产力推进新型工业化的合作协议》，深化内地和香港产业合作，促进香港更好融入和服务国家发展大局，共同支持在香港建设制造业创新中心。创新科技及工业局局长孙东表示，今年的财政预算案已建议预留资金，在港建设首个境外的国家制造业创新中心，目标是促进关键技术突破、推动成果产业化，以及汇聚国际人才。就此，香港特区政府支持由香港微电子研发院基于现有基础，承担牵头营运创新中心的重任。此举将配合国家的技术与产业规划重点，并在香港现有的半导体生态系统基础上发挥独特优势。（大湾区之声）", "ctime": 1785212594, "time_str": "12:23:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260728/c678481764.shtml"}, {"id": "4818245", "title": "上海国投公司与中国进出口银行上海分行签署战略合作备忘录", "content": "7月27日，上海国投公司与中国进出口银行上海分行签署战略合作备忘录，双方将深化国有资本与政策性金融战略联动，聚焦政策性金融产品支持重点战略项目等领域探索投贷协同新模式，合力培育新质生产力。", "ctime": 1785212274, "time_str": "12:17:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260728/c678481633.shtml"}, {"id": "4818241", "title": "2026年APEC林业部长级会议今天在深圳开幕", "content": "今天（7月28日）上午，2026年亚太经合组织（APEC）林业部长级会议在深圳正式开幕。这是亚太经合组织时隔15年再次在中国举办生态领域专业会议。会议期间，来自APEC21个经济体及有关国际组织的高级别代表、专家学者，分享森林资源保护、可持续利用、生态产品价值实现、科技赋能等方面的政策机制、实践经验，共同探讨加强区域林业合作的新路径、新举措。此次会议的主题是“增强亚太森林韧性 共享全民生态福祉”。数据显示，亚太地区森林面积占全球一半以上，贡献了全球约60%的林产品生产和约40%的林产品贸易。（央视新闻）", "ctime": 1785212020, "time_str": "12:13:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260728/c678481495.shtml"}, {"id": "4818223", "title": "零跑汽车成立精密制造公司，含智能机器人的研发业务", "content": "企查查APP显示，近日，湖州凌昇精密制造有限公司成立，法定代表人为巫存，注册资本为2.1亿元，经营范围包含：汽车零部件及配件制造；电子元器件制造；电动机制造；工业机器人制造；智能机器人的研发等。企查查股权穿透显示，该公司由零跑汽车旗下浙江凌昇动力科技有限公司全资持股。（人民财讯）", "ctime": 1785211654, "time_str": "12:07:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260728/c678481298.shtml"}, {"id": "4818215", "title": "英伟达参与得克萨斯州一处价值500亿美元的数据中心租赁项目", "content": "英伟达参与得克萨斯州一处价值500亿美元的数据中心租赁项目，该数据中心将采用英伟达芯片。", "ctime": 1785211392, "time_str": "12:03:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260728/c678481177.shtml"}, {"id": "4818209", "title": "康诺亚-B：CMG901全球III期临床获积极顶线结果，OS改善具统计学显著性", "content": "康诺亚-B公告，公司与AstraZeneca合作的CMG901（AZD0901）全球III期临床试验CLARITY-Gastric01取得积极顶线结果。与研究者选择的治疗方案相比，CMG901在二线及后线CLDN18.2阳性晚期胃癌患者中展现出具有统计学显著性且极具临床意义的总生存期（OS）改善。试验达到了三线及后线治疗OS双重主要终点及二线及后线治疗整体试验人群OS关键次要终点；PFS呈现改善趋势但未达统计学显著性。安全性特征与已知一致，未发现新安全信号。", "ctime": 1785211278, "time_str": "12:01:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260728/c678481112.shtml"}, {"id": "4818207", "title": "港股午评：恒生指数跌0.11%，恒生科技指数涨0.16%", "content": "港股午间收盘，恒生指数跌0.11%，恒生科技指数涨0.16%。恒指港股通ETF银华（159318）跌0.31%，港股通科技ETF鹏华（159751）跌0.79%。板块方面，食品零售、日常消费经销与零售Ⅲ板块涨幅靠前；IT咨询与其他服务、半导体设备板块跌幅靠前。个股方面，旺山旺水-B涨10.59%，鸣鸣很忙涨8.04%，珞石机器人涨8.0%，中国财险涨7.12%，徽商银行涨6.13%；老铺黄金跌22.81%，建滔积层板跌16.48%，智谱跌16.47%，兆易创新跌15.93%，剑桥科技跌14.94%。", "ctime": 1785211272, "time_str": "12:01:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260728/c678481104.shtml"}, {"id": "4818203", "title": "IDC：2025年中国AI游戏云市场规模已达18.6亿人民币", "content": "国际数据公司(IDC)数据显示，2025年中国AI游戏云市场规模已达18.6亿人民币，其中，AI基础设施服务、模型服务与AI应用市场，分别达到16.1亿与2.5亿，市场处于爆发初期，两大子市场均实现三位数增长。而在高速增长的表象之下，AI游戏云正在更深层面重塑游戏工业化的技术底座，并推动行业客户针对AI技术产品的支出逻辑发生根本性迁移。", "ctime": 1785211252, "time_str": "12:00:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260728/c678481088.shtml"}, {"id": "4818191", "title": "机构：存储芯片价格可能更接近峰值", "content": "Jefferies分析师在一份研究报告中表示，存储芯片价格可能更接近峰值。虽然市场预计第三季度存储芯片价格将环比再上涨25%-30%，但Jefferies最新的行业核实表明，涨幅可能会更温和，在15%-20%之间。Jefferies的分析师认为，大部分价格上涨是由云服务提供商推动的，而消费电子产品制造商对进一步加价表现出疲态。“2027年进一步环比上涨的前景可见度较低，”Jefferies的分析师说，并补充称存储芯片价格见顶的时间可能早于预期。", "ctime": 1785210647, "time_str": "11:50:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260728/c678480800.shtml"}, {"id": "4818189", "title": "7月28午间公告一览：兴业银锡子公司发生安全事故", "content": "兴业银锡公告，2026年7月26日下午15时30分许全资子公司西乌珠穆沁旗银漫矿业有限责任公司矿山井下三区750分层西主运19-1至25-1之间，生产施工过程中，发生一起事故，造成1人死亡，无人受伤。目前，银漫矿业选厂处于正常生产状态，矿区地表现存35万吨矿石，可供应选厂生产两个半月左右，如采区短期无法正常生产，暂不会对公司生产经营产生重大影响，亦不会对公司未来业绩产生重大不利影响。", "ctime": 1785210629, "time_str": "11:50:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260728/c678480795.shtml"}, {"id": "4818177", "title": "国家税务总局：上半年排查确认“空壳”企业129万户", "content": "今年以来，税务部门加力排查违规开票企业、空壳企业，纠治“开票经济”涉税问题。据介绍，“开票经济”是违规招商引资和“内卷式”竞争的突出表现形式，破坏经济税收秩序，损害公平竞争环境。税务部门针对开票明显异常且基本无税收、无利润、无员工、无场所，以及集群注册的“空壳”企业进行监控预警。上半年，共排查确认“空壳”企业129万户，推动注销近70万户，对其他约60万户采取规范引导措施，促进了经营主体数据更实、质量更优。（央视新闻）", "ctime": 1785210282, "time_str": "11:44:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260728/c678480659.shtml"}, {"id": "4818167", "title": "交易员：印度央行在外汇市场抛售美元以支撑卢比汇率", "content": "交易员称，印度央行在外汇市场抛售美元以支撑卢比汇率。", "ctime": 1785210051, "time_str": "11:40:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260728/c678480605.shtml"}, {"id": "4818155", "title": "A股午评：创业板指低开低走跌5.37% AI硬件方向大幅领跌", "content": "截至午盘，上证指数跌0.98%，深证成指跌3.42%，创业板指跌5.37%，北证50涨0.55%。三市成交额13365亿元，较上日缩量205亿元。全市场超2500家个股下跌。\n板块题材上，乳业、白酒、脑机接口板块涨幅居前；元件、半导体、CPO概念板块跌幅居前。\n盘面上，乳业板块持续走高，一鸣食品涨停，品渥食品涨超15%，万辰集团、欢乐家、新乳业、骑士乳业、洽洽食品跟涨。白酒板块震荡走高，金种子酒涨停，皇台酒业、今世缘、迎驾贡酒、古井贡酒、泸州老窖跟涨。脑机接口持续强势，塞力医疗、创新医疗、海南海药、南京熊猫2连板，科蓝软件、岩山科技涨停，倍益康、翔宇医疗、中科信息、三博脑科、菲沃泰跟涨。元件板块持续走弱，东山精密、江海股份、深南电路触及跌停，生益科技、华正新材、鹏鼎控股、景旺电子、生益电子跟跌。半导体板块低开低走，兆易创新跌停，恒运昌、普冉股份跌超10%。CPO板块大幅下挫，源杰科技、中际旭创、新易盛等跌超10%。剑桥科技、东山精密跌停。", "ctime": 1785209677, "time_str": "11:34:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260728/c678480297.shtml"}, {"id": "4818133", "title": "ETF两市成交额报2995.82亿元，较昨日此时放量142.55亿元", "content": "截至目前，ETF两市成交额报2995.82亿元，较昨日此时放量142.55亿元，分类型来看，股票型ETF成交额1254.11亿元，债券型ETF成交额1119.28亿元，货币型ETF成交额122.47亿元，商品型ETF成交额25.9亿元，QDII型ETF成交额474.06亿元。", "ctime": 1785209544, "time_str": "11:32:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260728/c678480207.shtml"}, {"id": "4818131", "title": "ETF午评：食品ETF领涨2.44%，科创增强ETF领跌8.93%", "content": "ETF午间收盘涨跌不一，食品ETF（563850）领涨2.44%，食品ETF（560160）涨2.28%，酒ETF（512690）涨2.14%，科创增强ETF（588520）领跌8.93%，通信ETF（515050）跌7.85%，通信ETF（159994）跌7.78%。", "ctime": 1785209524, "time_str": "11:32:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260728/c678480199.shtml"}, {"id": "4818123", "title": "股指期货早盘收盘 主力合约全线下跌", "content": "股指期货早盘收盘，主力合约全线下跌。沪深300股指期货(IF)主力合约跌2.62%，上证50股指期货(IH)主力合约跌1.39%，中证500股指期货(IC)主力合约跌3.23%，中证1000股指期货(IM)主力合约跌2.09%。", "ctime": 1785209417, "time_str": "11:30:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260728/c678480148.shtml"}, {"id": "4818117", "title": "电影《大空头》原型：任何一家科技巨头削减AI支出 美国股市将直线下跌", "content": "大空头史蒂夫 艾斯曼最新警告说，如果任何一家超大规模科技巨头削减其人工智能（AI）资本支出，美国股市将“直线下跌”。他在接受最新采访时指出，当前的市场已经变成了一个完全依赖于人工智能成败的单一交易环境。他进一步警告称，市场对人工智能的看法与一年前相比发生了巨大变化，当时投资者对每一项资本支出增加都热情欢呼。“现在情况复杂得多。这并不意味着全是坏事，但确实复杂得多。”他说。", "ctime": 1785209258, "time_str": "11:27:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260728/c678480009.shtml"}, {"id": "4818113", "title": "力鸿二号计划今年完成首飞及百公里级回收验证", "content": "7月28日，据中科宇航微信公众号消息，其研制的力鸿二号可重复使用运载器目前已完成设计阶段，全面进入工程研制阶段，正在开展大型地面试验验证，计划今年完成首飞及百公里级回收验证。", "ctime": 1785209182, "time_str": "11:26:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260728/c678479970.shtml"}, {"id": "4818105", "title": "韩国KOSDAQ指数解除熔断机制，恢复交易", "content": "韩国KOSDAQ指数解除熔断机制，恢复交易。", "ctime": 1785208968, "time_str": "11:22:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260728/c678479874.shtml"}, {"id": "4818099", "title": "深圳上半年跨境人民币结算同比增37.9% FT账户交易增超9成", "content": "7月28日上午，记者在中国人民银行深圳市分行、国家外汇管理局深圳市分局2026年上半年新闻发布会上获悉，今年上半年，深圳跨境人民币结算规模达3.8万亿元，同比增长37.9%，规模稳居全国第三。其中，货物贸易项下人民币使用水平显著提升。上半年，深圳货物贸易跨境人民币收支合计8364亿元，同比增长50.2%，占本外币收支比重同比提升近5个百分点至31%，充分发挥本币结算优势，助力外贸企业减轻汇率波动影响，降低结算成本，提高交易效率。（上证报）", "ctime": 1785208921, "time_str": "11:22:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260728/c678479848.shtml"}, {"id": "4818095", "title": "青海海南州兴海县附近发生5.8级左右地震", "content": "中国地震台网自动测定：07月28日11时16分在青海海南州兴海县附近（北纬35.39度，东经99.67度）发生5.8级左右地震，最终结果以正式速报为准。", "ctime": 1785208848, "time_str": "11:20:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260728/c678479805.shtml"}, {"id": "4818081", "title": "芯和半导体携手联想集团在DAC 2026现场发布EDA Agent最新研发成果", "content": "2026年7月26日，全球规模最大的电子设计自动化（EDA）行业盛会——DAC 2026在美国加利福尼亚州长滩市开幕。本届大会以“AI For EDA”为核心议题，全球主要EDA厂商均在会上展示AI智能体（Agent）技术在芯片与系统设计中的最新应用。国产EDA企业芯和半导体在展台现场，联合联想集团发布双方EDA Agent战略合作的最新研发成果，成为本届大会上国产EDA的唯一落地案例。（科创板日报）", "ctime": 1785208672, "time_str": "11:17:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260728/c678479712.shtml"}, {"id": "4818071", "title": "税务总局：整治开票经济效果显现，全国每百元发票的含税量较2025年提升了13.7%", "content": "7月28日，国家税务总局局长胡静林在国新办发布会上表示，整治开票经济取得阶段性成效。一是促进了开票水分的有效挤出，全国每百元发票的含税量较2025年提升了13.7%, 经济税收的质量更高了。二是促进了空壳企业加快退出，上半年共排查确认空壳企业129万户，推动注销了70万户，对其他约60万户采取了规范引导措施，经营主体的数据更实了。三是促进了虚假贸易的有力纠治，通过对空转走单、循环开票的企业核查，对凭空虚造巨量营收的乱象，以及对借大宗贸易之名行虚假贸易之实的行为，起到了有效的遏制作用。四是促进了相关风险的提前防治，纠治开票经济，有利于防范数字繁荣背后潜藏的产业链风险，金融风险和债务风险。在对融资性贸易企业开票进行排查中，对发现虚增业绩骗取银行贷款的疑点，及时推送金融监管部门处置，助力防范信贷风险。（人民财讯）", "ctime": 1785208554, "time_str": "11:15:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260728/c678479643.shtml"}, {"id": "4818069", "title": "国家数据局：鼓励基于词元应用商业模式创新 探索词元交易等新型交易模式", "content": "国家数据局在北京召开2026中国国际大数据产业博览会新闻发布会。国家数据局副局长余英介绍了以数据赋能人工智能发展的情况。鼓励基于词元应用的商业模式创新。探索词元交易等新型交易模式，培育“为优质数据付费”的市场共识。深化词元应用与工业、医疗、金融等领域的深度融合，助力人工智能应用规模化落地，推动形成以模型应用牵引数据供给、以数据赋能模型迭代，助力打造“数据飞轮”应用闭环。下一步，将持续推进行业高质量数据集建设，深入实施强基扩容、标注攻坚、提质增效、应用赋能、管理服务、价值释放六大专项行动，推动行业高质量数据集建设推广与“人工智能+”同频共振、互促共进强化数据赋能人工智能创新发展。（蓝鲸新闻）", "ctime": 1785208531, "time_str": "11:15:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260728/c678479634.shtml"}, {"id": "4818055", "title": "俄外交部就日本防卫大臣涉核言论发出警告", "content": "俄罗斯外交部发言人扎哈罗娃27日表示，日本如果在加速推进的“再军事化”进程中引入核武器，不仅将给俄国家安全带来威胁和挑战，也危害整个地区的稳定。针对日本防卫大臣小泉进次郎近期声称“日本应毫无禁忌地讨论与核武器相关的政策”，扎哈罗娃27日在例行记者会上说，日本是“核门槛”国家，一旦作出决定，日本能够在较短时间内研制出核弹头。小泉此番言论并不能以“防卫”作为理由来自辩，因为没有国家威胁日本主权和领土完整，相反，日本军国主义思潮正死灰复燃。扎哈罗娃表示，俄方再次呼吁日方铭记二战历史教训并重回和平发展道路。(新华社)", "ctime": 1785208348, "time_str": "11:12:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260728/c678479559.shtml"}, {"id": "4818053", "title": "中际旭创成交额达300亿元", "content": "中际旭创成交额达300亿元，现跌13.31%。", "ctime": 1785208303, "time_str": "11:11:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260728/c678479537.shtml"}, {"id": "4818051", "title": "创业板指跌6% 中际旭创、新易盛双双跌超12%", "content": "创业板指跌幅扩大至6%，上证指数跌1.49%，深证成指跌3.97%。AI硬件方向大幅领跌，中际旭创、新易盛双双跌超12%。", "ctime": 1785208218, "time_str": "11:10:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260728/c678479505.shtml"}, {"id": "4818031", "title": "税务总局：互联网平台缴税商户增长37%", "content": "7月28日，国家税务总局新闻发言人、总经济师荣海楼在国新办发布会上表示，《互联网平台企业涉税信息报送规定》自去年6月20日公布实施以来，一大变化是缴税商户多了。今年一季度申报缴税的平台内商户数量较《规定》实施之前增长37%，较上次报送时提高了5个百分点，带来了线上线下税收负担差异进一步缩小。他表示，自《规定》实施以来，平台企业报数质效不断提升。今年一季度报送涉税信息的平台数量为9692家，基本实现了应报尽报。平台内商户税法遵从持续增强，比如今年一季度，平台内小规模纳税人向上游企业取得发票的金额同比增长48%，环比提升20个百分点，较去年首次报送时翻了一倍多。（第一财经）", "ctime": 1785208125, "time_str": "11 // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
