或将带动相关行业的价格上行。（人民财讯）", "ctime": 1784085581, "time_str": "11:19:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260715/c678188898.shtml"}, {"id": "4724399", "title": "杰恩股份在珠海成立微电子科技公司", "content": "企查查APP显示，近日，澄明芯智微电子科技（珠海）有限公司成立，法定代表人为周华，注册资本为1000万元，经营范围包含：集成电路芯片设计及服务；集成电路芯片及产品销售；集成电路芯片及产品制造；集成电路设计等。企查查股权穿透显示，该公司由杰恩股份间接全资持股。（人民财讯）", "ctime": 1784085458, "time_str": "11:17:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260715/c678188842.shtml"}, {"id": "4724397", "title": "广电计量无源医疗器械实验室正式启用", "content": "广电计量无源医疗器械实验室检测覆盖市场主流无源医疗器械品类，可满足各类医疗器械生产企业检测需求，核心覆盖品类包括：呼吸麻醉器械、体外循环器械等生命支持类器械；手术器械、输注器具、医用导管等介入/操作类器械；医用敷料、敷贴、医用防护用品等医用卫生材料及敷料产品；医药、食品、电子、医疗器械、实验室等领域的洁净区域；一、二、三类全线医疗器械包装件。(人民财讯)", "ctime": 1784085416, "time_str": "11:16:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260715/c678188834.shtml"}, {"id": "4724389", "title": "我国自主核级树脂实堆验证率先落地海南核电", "content": "7月14日，由海南核电联合中国核动力研究设计院、西安蓝晓科技协同攻关的国产核级离子交换树脂，通过中国核能行业协会权威产品鉴定。海南核电成为国内率先完成国产核级树脂在商用机组一回路实堆验证的核电企业。（人民财讯）", "ctime": 1784085270, "time_str": "11:14:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260715/c678188770.shtml"}, {"id": "4724387", "title": "港股恒生科技指数涨幅达2%", "content": "港股恒生科技指数涨幅扩大至2%，恒生指数现涨1.75%。", "ctime": 1784085219, "time_str": "11:13:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260715/c678188754.shtml"}, {"id": "4724381", "title": "国台办：福建高质量建设两岸融合发展示范区取得阶段性进展", "content": "7月15日，国务院台办举行例行新闻发布会。有记者问，国家市场监督管理总局近日发布了两年多来两岸共同研制实施两岸共通标准达378项，涉及特色农产品、现代服务业、食品、新能源、文化旅游等多个领域，充分发挥有关标准软联通作用，支持福建探索两岸标准共通工作新模式、新机制，为破除闽台经贸融合技术标准障碍，助力两岸融合发展发挥了积极作用，请问发言人对此有何评论？发言人朱凤莲表示，2023年9月《中共中央 国务院关于支持福建探索海峡两岸融合发展新路 建设两岸融合发展示范区的意见》发布，就支持福建建设两岸融合发展示范区作出了全面的部署。《意见》发布以来，中央台办、国家发展改革委牵头会同市场监管总局等中央和国家机关有关部门，扎实推动《意见》各项重点任务落实落细，支持福建高质量建设两岸融合发展示范区取得阶段性的进展。两岸标准共通，有效促进两岸的产业市场人才的融合，是两岸融合发展示范区建设的重要组成部分。市场监管总局于2023年率先出台了专项的支持措施，聚焦标准软联通，支持福建在两岸融合发展示范区建设中，系统开展两岸标准共通，探索两岸标准共通工作的新模式、新机制，形成了标准共研、市场共享、人才互通的融合发展格局。（央视新闻）", "ctime": 1784085106, "time_str": "11:11:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260715/c678188725.shtml"}, {"id": "4724369", "title": "国家统计局：总的看房地产市场供需关系逐步改善，市场预期有所回升", "content": "7月15日，国家统计局副局长毛盛勇在国新办新闻发布会上表示，总的来看，房地产市场供需关系在逐步改善，市场预期有所回升，市场出现了一些积极变化。下阶段，要继续因城施策控增量、去库存、优供给，推动房地产市场平稳健康运行。（澎湃新闻）", "ctime": 1784084989, "time_str": "11:09:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260715/c678188702.shtml"}, {"id": "4724357", "title": "国家统计局：居民消费价格仍将延续温和上涨态势", "content": "国家统计局新闻发言人、国民经济综合统计司负责人王冠华7月15日在国新办新闻发布会上表示，展望下半年，尽管国际大宗商品价格波动会对国内物价带来一定扰动，但中国经济具备强大韧性，民生商品供给充足，保供稳价政策体系有力有效。随着各项促消费政策持续落地，服务消费、升级类消费、新型消费需求有望稳步释放，居民消费价格仍将延续温和上涨态势。（新华财经）", "ctime": 1784084912, "time_str": "11:08:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260715/c678188672.shtml"}, {"id": "4724355", "title": "中国代表团完成国际电信联盟无线电通信部门第四研究组下设WP4A、WP4C工作组会议参会任务", "content": "7月6日至10日，国际电信联盟无线电通信部门第四研究组下设WP4A、WP4C工作组会议在瑞士日内瓦召开。本次会议为临时增设的工作组会议，旨在加快推进2027年世界无线电通信大会（WRC-27）相关空间议题的筹备工作。会议重点围绕WRC-27议题1.5（限制非授权地球站操作）、议题1.13（为手机直连卫星新增频段划分）展开深度磋商，更新了议题的大会筹备会议（CPM）案文草案，两项议题均取得阶段性成果。会议期间，我国专家担任议题1.13频谱共存研究起草组主席，牵头开展频段兼容共用研究报告起草工作；我国代表团积极参与议题讨论，推动议题CPM案文进一步完善。(人民财讯)", "ctime": 1784084867, "time_str": "11:07:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260715/c678188661.shtml"}, {"id": "4724351", "title": "科创50指数跌幅扩大至4%", "content": "科创50指数跌幅扩大至4%，现报1929.21点。", "ctime": 1784084834, "time_str": "11:07:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260715/c678188641.shtml"}, {"id": "4724333", "title": "星网锐捷在广西成立通讯科技公司 含多项卫星业务", "content": "企查查APP显示，近日，德明通讯科技（广西）有限公司成立，法定代表人为陈承平，注册资本为2000万元，经营范围包含：通信设备制造；移动通信设备制造；通讯设备销售；卫星移动通信终端制造；卫星导航服务等。企查查股权穿透显示，该公司由星网锐捷旗下德明通讯（上海）股份有限公司全资持股。（人民财讯）", "ctime": 1784084663, "time_str": "11:04:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260715/c678188591.shtml"}, {"id": "4724307", "title": "“囤猴”业绩赚翻，“猴茅”股价齐涨", "content": "7月15日上午，昭衍新药A股股价盘中涨停，港股股价大涨超过10%。得益于实验猴市场价格上涨叠加自身自然生长增值带来公允价值正向变动，昭衍新药预计2026年1-6月实现归属于上市公司股东的净利润约6亿元至9亿元，同比增加约8.85倍至13.77倍。昭衍新药的股价大涨也带动其他“猴茅”们股价上涨，其中康龙化成A股以及港股盘中股价大涨超过8%，药明康德A股以及港股股价也大涨超过4%。（第一财经）", "ctime": 1784084346, "time_str": "10:59:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260715/c678188478.shtml"}, {"id": "4724295", "title": "国台办：敦促欧洲议会立即纠正涉台错误言行", "content": "7月15日，国务院台办举行例行新闻发布会。有记者问：近日，欧洲议会通过一项关于东亚地缘政治局势的报告称，“反对任何以胁迫片面改变现状的行径”，台外事部门对此表示感谢。请问对此有何评论？发言人朱凤莲表示，世界上只有一个中国，台湾是中国的一部分，这是真正的台海现状。欧洲议会有关报告粗暴干涉中国内政，我们对此坚决反对。敦促欧洲议会立即纠正涉台错误言行，慎重妥善处理涉台问题。民进党当局妄图拉拢外部势力为其谋“独”挑衅行径背书，注定失败。（央视新闻）", "ctime": 1784084132, "time_str": "10:55:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260715/c678188433.shtml"}, {"id": "4724291", "title": "上期所燃油主力合约大涨6%", "content": "上期所燃油主力合约大涨6%，报3615元/吨。", "ctime": 1784084012, "time_str": "10:53:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260715/c678188391.shtml"}, {"id": "4724281", "title": "定行业标尺 聚发展共识 促良性竞争《中国汽车行业整车成本测算规则》团体标准正式发布", "content": "近日，由中国汽车工业协会牵头组织，国内18家主流整车企业共同参与编制的《中国汽车行业整车成本测算规则》团体标准正式发布。这是国内首套面向汽车整车领域的统一成本测算规则，   const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
