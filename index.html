025年具身智能产业集群产值达1068亿元。创新是引领发展的第一动力，但创新活动天然伴随未知风险。促进具身智能机器人产业专门立法，是以高质量法治供给护航科技创新，让科技创新的“关键变量”转化为推动高质量发展的“最大增量”。（杭州发布）", "ctime": 1777613551, "time_str": "13:32:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260501/c676436158.shtml"}, {"id": "4311591", "title": "跨境客流持续走高 广深港高铁成为大湾区互联互通“黄金通道”", "content": "记者从深圳铁路部门获悉，2026年1至4月，广深港高铁跨境客流持续走高，累计运送跨境旅客1108万人次，较去年同期增加144万人次，增幅15%。其中，香港发往内地旅客537.8万人次，内地发往香港旅客570.2万人次，客流双向奔赴日益密切，广深港高铁“黄金通道”作用更加彰显。今年“五一”假期，旅客出行意愿强烈，广深港高铁预计日均运送跨境旅客11.9万人次，客流高峰将出现在5月1日，预计达到14万人次。为更好保障旅客出行需求，铁路部门加大运力投放，日均开行跨境旅客列车超230列。其中，4月30日至5月3日，香港西九龙站至福田站间每日加开旅客列车13列，助力跨境客流更加高效畅通。（央视新闻）", "ctime": 1777611892, "time_str": "13:04:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260501/c676436096.shtml"}, {"id": "4311569", "title": "11国外长谴责以袭击全球坚韧船队", "content": "据土耳其外交部消息，4月30日，土耳其、巴西、约旦、巴基斯坦、西班牙、马来西亚、孟加拉国、哥伦比亚、马尔代夫、南非和利比亚等国外交部长发表联合声明，强烈谴责以色列袭击“全球坚韧船队”。声明指出，该船队所进行的是一项旨在引起国际社会关注加沙人道主义局势的民间人道主义行动。以方对船只实施攻击并在国际水域拘押活动人士，严重违反了国际法和国际人道主义法。(央视军事)", "ctime": 1777611203, "time_str": "12:53:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260501/c676436065.shtml"}, {"id": "4311547", "title": "国务院安委办部署“五一”假期期间安全生产明查暗访工作", "content": "记者今天从应急管理部获悉，国务院安委会办公室日前对“五一”假期安全生产防范工作作出安排，要求各地区和有关部门切实加强假期期间安全生产工作，坚决防范遏制重特大事故，有效防范较大和重大涉险事故，切实维护人民群众生命财产安全和社会稳定。国务院安委办指导协调有关部门派出工作组，对重点地区、重点行业领域和重点企业假期期间安全生产进行明查暗访。文化和旅游部对景区景点安全防范、热门旅游景点人流管控、旅行社和导游安全管理、“黑景点”整治等情况开展暗访。国务院国资委针对工程建设、危险化学品、施工作业现场、生产车间等安全管理情况，指导有关中央企业总部对所属企业安全生产情况开展暗访。国家消防救援局组织对人员密集场所防火工作开展暗访。国家矿山安全监察局对煤矿、非煤矿山开展暗访。应急管理部聚焦节假日重点行业领域开展综合暗访。通过明查暗访推动各地各有关部门压紧压实安全生产责任，及时消除安全隐患，确保假期全国安全生产形势平稳有序。针对明查暗访发现的典型案例将依法查处、追责问责、公开曝光。各地区也将结合实际，同步组织开展针对性安全生产明查暗访工作。（央视新闻）", "ctime": 1777609456, "time_str": "12:24:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260501/c676436012.shtml"}, {"id": "4311535", "title": "中国常驻联合国副代表孙磊对美起草安理会涉南苏丹决议一意孤行表示遗憾", "content": "中国常驻联合国副代表孙磊4月30日在安理会表决联合国南苏丹特派团（联南苏团）授权延期决议草案后作解释性发言，对美国作为草案执笔国的做法表示遗憾。孙磊说，联南苏团为维护南苏丹和平稳定、推进政治进程发挥了重要作用，中方一贯全力支持联南苏团工作，支持联南苏团授权继续延期。当前，南苏丹正处于实现和平发展的关键阶段，联南苏团的授权和能力需要根据形势优化加强。中方本着建设性态度参与决议草案磋商，会同安理会其他成员提出了不少合理修改建议。遗憾的是，决议草案弱化联南苏团支持南苏丹和平进程和重振协议落实的授权、削减联南苏团兵力上限、向南苏丹政府过度施压。鉴于此，中方不得不投出弃权票。（央视新闻）", "ctime": 1777608480, "time_str": "12:08:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260501/c676435998.shtml"}, {"id": "4311529", "title": "蔚来汽车四月交付量为29356辆 同比增长23%", "content": "蔚来汽车四月交付量为29,356辆，同比增长23%。其中，蔚来品牌交付新车19,024台；乐道品牌交付新车5,352台，同比增长21.6%；firefly萤火虫品牌交付新车4,980台。今年前四个月，蔚来公司共交付新车112,821台，同比增长71.0%。截至目前，蔚来公司已累计交付新车1,110,413台。", "ctime": 1777608234, "time_str": "12:03:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260501/c676435995.shtml"}, {"id": "4311503", "title": "商务部新闻发言人就美国联邦通信委员会审议通过检测认证和电信领域相关限制措施事答记者问", "content": "商务部新闻发言人就美国联邦通信委员会审议通过检测认证和电信领域相关限制措施事答记者问。问：美东时间4月30日，美国联邦通信委员会（FCC）审议通过相关限制措施，拟取消未与美国签署“互认协议”国家检测认证机构资质，禁止被列入所谓“覆盖清单”的实体在美开展电信业务。后续相关措施将征求公众意见。请问商务部对此有何评论？答：美国联邦通信委员会摒弃技术中立原则，泛化国家安全概念，在没有事实依据的情况下，频频出台限制措施，歧视性对待包括中国在内的他国企业和产品，严重损害中国及其他相关贸易伙伴利益。这些限制措施冲击中美经贸关系来之不易的稳定，违背两国元首达成的共识，中方对此高度关注，坚决反对。(商务部)", "ctime": 1777607485, "time_str": "11:51:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260501/c676435981.shtml"}, {"id": "4311473", "title": "南非葡萄酒行业欢迎中国零关税举措", "content": "南非葡萄酒协会和南非葡萄酒业协会4月30日发表新闻公报，对中国自2026年5月1日起对所有非洲建交国实施零关税表示欢迎，认为此举为南非葡萄酒行业提供了“至关重要的机遇”。 新闻公报说，零关税举措将显著提升南非葡萄酒的价格竞争力，为南非葡萄酒在中国市场提升品牌地位提供重要机遇，预计短期内南非葡萄酒的价值定位将有所提升，出口量有望复苏。长远来看，机遇将不仅限于销量增长，还包括推动产品高端化、强化品牌定位以及与中国分销商和电商平台建立更深入的战略合作伙伴关系。 南非葡萄酒业协会首席执行官茜奥班·汤普森在新闻公报中说，零关税举措让南非葡萄酒行业看到了与中国消费者和贸易伙伴建立更深层次关系的巨大潜力。南非葡萄酒行业已做好充分准备，与进口商、分销商及当地合作伙伴携手合作。 南非葡萄酒协会是代表南非葡萄酒行业全价值链的全国性机构。南非葡萄酒业协会是负责在国际市场推广南非葡萄酒的官方行业机构。(新华社)", "ctime": 1777606816, "time_str": "11:40:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260501/c676435965.shtml"}, {"id": "4311471", "title": "以色列防长称或很快恢复对伊朗打击", "content": "当地时间4月30日，以色列国防部长卡茨称，尽管以色列支持美国同伊朗谈判，但以色列或许“很快需要”恢复对伊朗的军事行动。卡茨称，伊朗过去一年受到“极其沉重的打击”，而以色列“随时准备在任何战线、任何地点打击敌人”。以色列国防部发言人当天还证实，过去一天内，两艘货船装载“数以千计航空弹药等军事装备”抵达以色列的海法港和阿什杜德港。这批总计6500吨的装备已被运往以色列“各地的军事基地”。以色列国防部还称，自美以袭击伊朗以来，以色列已累计接收超过11.56万吨军事装备，以军的采购和运输行动将在未来几周内继续“扩大规模”。 (CCTV国际时讯)", "ctime": 1777606679, "time_str": "11:37:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260501/c676435964.shtml"}, {"id": "4311469", "title": "宁德时代上线电池在供车型查询入口", "content": "5月1日，宁德时代上线国内新能源电车在供车型查询入口，查询表数据更新至4月30日，覆盖电池独供及混供车型。（界面新闻）", "ctime": 1777606299, "time_str": "11:31:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260501/c676435953.shtml"}, {"id": "4311467", "title": "成本上涨 消费品巨头联合利华决定提价", "content": "全球快消品企业联合利华公司4月30日说，受中东战事影响，公司成本上涨，决定上调产品价格。联合利华公司说，中东战事造成供应链不畅和大宗商品价格飙升，受此影响，预计其全年总成本将上涨约7.5亿至9亿欧元，包括物流和工厂成本上涨。关于涨价决定，联合利华公司首席财务官斯里尼瓦斯·帕塔克在分析师电话会议上说，将分多次涨价，每次涨幅较小。帕塔克告诉路透社记者，如果通胀压力持续，联合利华可能会将产品价格上调2%至3%。涨价商品将集中在特定市场和类别，特别是涉及原油衍生品的家庭日化产品，且主要在下半年调价。他说，亚洲、非洲和拉丁美洲部分地区涨价幅度相对较大。近来，雀巢、宝洁等消费品企业都表示，中东战事导致企业成本增加。他们需要权衡是否提价以及提高多少，因为在这样的大环境下，消费者更加精打细算，可能转而选择更便宜的本地替代品牌。（新华社）", "ctime": 1777605065, "time_str": "11:11:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260501/c676435861.shtml"}, {"id": "4311465", "title": "何立峰会见比利时副首相兼外交大臣普雷沃", "content": "中共中央政治局委员、国务院副总理何立峰4月30日下午在人民大会堂会见比利时副首相兼外交大臣普雷沃。 何立峰表示，中比建交55年来，两国建立了互利共赢的紧密合作关系。近年来，双方在医药、化工、金融、物流等领域开展了卓有成效的务实合作，助力两国关系向前发展。中比同为多边主义的维护者和开放型世界经济的支持者，应当延续互利共赢合作传统，促进中比、中欧关系向好发展。 普雷沃表示，比中是全方位友好合作伙伴，比方愿以比中建交55周年为契机推动双边关系发展，加强经贸等各领域合作，共同维护多边主义和自由贸易。(新华社)", "ctime": 1777604768, "time_str": "11:06:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260501/c676435852.shtml"}, {"id": "4311463", "title": "广东惠州实施人才房票政策：不限户籍社保 最高补贴10万元", "content": "广东惠州市住房和城乡建设局联合市财政局、市人力资源和社会保障局印发人才房票补贴政策，符合条件的人才在惠州购买新建商品住房，可直接申领房票充抵购房款，最高补贴10万元，政策总额度1亿元，“先到先得”。根据政策，本次人才房票根据人才层次实行分级发放，具体标准为：1、本科、中级职称、技师：每人3万元；2、硕士研究生、副高级职称、高级技师、惠州市C级高层次人才：每人5万元；3、博士研究生、正高级职称、惠州市B级及以上高层次人才：每人10万元。", "ctime": 1777604519, "time_str": "11:01:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260501/c676435841.shtml"}, {"id": "4311461", "title": "第四批全国中成药联盟采购开标 覆盖89种临床常用药品", "content": "4月30日，第四批全国中成药联盟采购（简称“全国联采”）在武汉开标产生拟中选结果。本次集采纳入28个采购组89种药品，全国4万余家医药机构参与报量。共有344家企业的468个产品符合投标条件，243家企业的310个产品中选。总体来看，企业投标积极踊跃，中选剂型规格齐全，当前临床使用的主流产品普遍中选，可有效满足临床用药需求。（人民财讯）", "ctime": 1777603531, "time_str": "10:45:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260501/c676435795.shtml"}, {"id": "4311459", "title": "特朗普称将取消对苏格兰威士忌的关税和进口限制", "content": "美国总统特朗普4月30日在社交媒体上发文说，他将取消针对英国苏格兰威士忌的关税和进口限制。 英国苏格兰威士忌协会数据显示，美国是苏格兰威士忌最大的海外单一出口市场，占2025年苏格兰威士忌出口总额近20%。受美国加征关税影响，2025年苏格兰威士忌对美国出口金额和数量分别下降4%和9.2%。 长期以来，美英威士忌产业保持双向贸易关系，在苏格兰威士忌出口美国的同时，美国企业向苏格兰威士忌厂家大量出口二手木制酒桶用于威士忌陈酿。根据美英2025年5月达成的贸易协议，美国对英国输美威士忌征收10%的进口关税，这一税率保持至今。(新华社)", "ctime": 1777603088, "time_str": "10:38:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260501/c676435781.shtml"}, {"id": "4311457", "title": "机构：4月深圳一二手网签量超9000套", "content": "乐有家研究中心今日公布的数据，2026年4月深圳一二手住宅总网签量9044套，环比上涨15%，时隔12个月再破9000套大关。其中，一手住宅合计网签3400套，环比上涨20%。具体来看，新房预售网签1844套，环比上涨17%，现售网签1556套，环比涨24%；二手住宅网签5644套，环比上涨11%。（财联社）", "ctime": 1777602905, "time_str": "10:35:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260501/c676435760.shtml"}, {"id": "4311455", "title": "2025年上市公司整体业绩企稳回暖 科技创新势能迸发", "content": "中国上市公司协会发布2025年上市公司经营业绩报告。报告显示，2025年上市公司整体业绩企稳回暖，核心资产稳健向好。全市场上市公司营收同比增长1.2%，整体实现净利润5.4万亿元，增长2.6%。全市场超七成上市公司实现盈利，北交所盈利面最高（83%）。3235家公司营收正增长，2425家公司盈利正增长，370家公司实现扭亏。政策引导下，科技创新和产业创新深度融合，未来产业保持快速发展势头，核聚变等前沿领域固定资产投资增长8.0%，传统产业转型升级不断深入，通用设备行业固定资产投资增长8.7%。2025年，全市场上市公司研发投入合计1.94万亿元，连续4年正增长，约占全社会研发经费投入的一半；研发强度2.66%，较上年继续提高。上市公司研发人员共327万人，占员工总数的10.4%。研发投入额前100名的上市公司主要分布于电子、汽车、电力设备等行业，其中17家公司研发强度超10%。（央视新闻）", "ctime": 1777602753, "time_str": "10:32:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260501/c676435756.shtml"}, {"id": "4311453", "title": "WTI原油涨超1%", "content": "WTI原油涨超1%，现报105.92美元/桶。", "ctime": 1777602716, "time_str": "10:31:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260501/c676435755.shtml"}, {"id": "4311449", "title": "长三角铁路迎来“五一”假期客流高峰，预计发送旅客470万人次", "content": "5月1日，长三角铁路迎来“五一”假期客流高峰，预计发送旅客470万人次，较去年同期多发送旅客43.2万人次，增幅10.1%，有望创单日客发量新高。“五一”假期，全国多地气温回暖，受浙江、湖南、山东、甘肃等多地春假与“五一”假期连休等“利好”因素推动，民众跨省出行需求被进一步激发，1500公里内的出行需求得到进一步释放。客流成分以旅游、探亲为主，铁路客运市场增势明显。在刚刚过去的4月30日，长三角铁路发送旅客逾397.8万人次，同比增长10.2%。（央视新闻）", "ctime": 1777601779, "time_str": "10:16:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260501/c676435694.shtml"}, {"id": "4311447", "title": "智己汽车：2026年4月销量10016台，1-4月累计销量同比增长130%", "content": "智己汽车：2026年4月销量10016台，1-4月累计销量同比增长130%。", "ctime": 1777601534, "time_str": "10:12:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260501/c676435682.shtml"}, {"id": "4311443", "title": "黎巴嫩真主党使用光纤无人机对抗以军", "content": "黎巴嫩真主党近期在社交媒体平台和其旗下灯塔电视台发布的视频显示，真主党在打击以色列军队时使用了新武器——光纤无人机。(新华社)", "ctime": 1777601010, "time_str": "10:03:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260501/c676435663.shtml"}, {"id": "4311439", "title": "理想汽车：2026年4月交付34,085辆汽车", "content": "理想汽车：2026年4月交付34,085辆汽车。", "ctime": 1777600890, "time_str": "10:01:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260501/c676435658.shtml"}, {"id": "4311421", "title": "武汉轨道交通12号线一期开通运营", "content": "5月1日9时16分，亚洲最长的地铁环线——武汉轨道交通12号线一期工程正式开通运营。该线路穿越长江、沙湖，途经武汉市青山区、武昌区、洪山区、汉阳区四个行政区，将便利沿线居民的出行。据了解，武汉12号线全长59.9公里，是亚洲最长的地铁环线，也是一条串联武汉三镇、覆盖7个中心城区的“黄金纽带”。环线开通后将使武汉地铁全网换乘量提升约25%，部分跨江通勤时间缩短30分钟以上。（央视新闻）", "ctime": 1777600178, "time_str": "09:49:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260501/c676435617.shtml"}, {"id": "4311419", "title": "哥伦比亚谴责以色列扣押本国援加沙船员", "content": "哥伦比亚外交部4月30日发表声明，强烈谴责以色列扣押3名哥伦比亚籍“全球坚韧船队”船员。哥政府已向以色列发出严正呼吁，要求立即释放这3名哥伦比亚公民。 声明说，上述3人事发时正随船队前往加沙地带运送人道主义援助物资。哥政府强烈要求以色列立即释放他们，并重申尊重国际法和人权的重要性。声明强调，当前巴以冲突导致巴勒斯坦人民面临严重人道困境，必须确保人道主义援助通道畅通无阻。 哥伦比亚总统佩特罗29日晚在社交媒体上发文，指责以色列军队在国际水域非法拦截并控制了船队船只，将此次事件定性为“绑架”。 巴勒斯坦伊斯兰抵抗运动（哈马斯）和巴勒斯坦伊斯兰圣战组织（杰哈德）4月30日发表声明，谴责以色列海军当天扣押驶往加沙地带的“全球坚韧船队”船只及人员。以色列外交部同日发表声明称，该船队的幕后推手是哈马斯，目的是为了阻挠加沙停火谈判推进、转移人们对哈马斯拒绝解除武装的注意力。 据外媒报道，“全球坚韧船队”载有人道主义援助物资，试图突破以色列对加沙地带的海上封锁。船队方面说，以方拦截了22艘船。(新华社)", "ctime": 1777599978, "time_str": "09:46:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260501/c676435599.shtml"}, {"id": "4311409", "title": "零跑汽车4月交付71387台，同比增长73.9%", "content": "5月1日，零跑汽车公布4月交付数据：全系交付71387台，同比增长73.9%。（界面新闻）", "ctime": 1777599319, "time_str": "09:35:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260501/c676435562.shtml"}, {"id": "4311407", "title": "美国汽油均价再创近4年来新高", "content": "美国汽车协会4月30日发布数据说，随着国际油价飙升至每桶100美元以上，且尚无迹象表明霍尔木兹海峡何时重新开放，目前全美普通汽油平均价格较去年同期高出1.12美元，再创近4年来新高。美国汽车协会指出，经过此前连续近两周小幅下降之后，美国油价再次上涨，全国平均油价最近一周内上涨了27美分。“上一次全美油价达到类似高位是在2022年7月下旬。”目前，加利福尼亚州普通汽油价格均价已突破每加仑6美元关口，继续领跑全美。（央视新闻）", "ctime": 1777599250, "time_str": "09:34:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260501/c676435549.shtml"}, {"id": "4311405", "title": "富时中国A50指数期货涨1%", "content": "富时中国A50指数期货涨幅扩大至1%。", "ctime": 1777599082, "time_str": "09:31:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260501/c676435535.shtml"}, {"id": "4311393", "title": "民航局副局长胡振江率团赴港澳开展民航安全技术交流", "content": "4月27日至5月1日，民航局副局长胡振江应邀率团赴澳门、香港开展民航安全技术交流，进一步深化拓展内地与港澳在航空安全管理、飞行标准、适航审定及事故调查等方面的合作。交流期间，民航局与香港民航处、澳门民航局共同签署了《关于相互接受型号合格证的合作安排》《关于C929型飞机型号合格审定的合作安排》《关于航油航化适航管理的合作安排》，修订了《联合维修管理合作安排》。上述安排在既有合作基础上，进一步扩大互认范围，涵盖飞机型号合格审定、航油航化产品审定，并延伸至三地局方核准的海外飞机维修与培训机构。同时，相关安排支持香港民航处与澳门民航局延续以往C919型飞机型号审定的合作，参与C929型飞机型号的审定工作，共同推进国产大飞机发展。（中国民航报）", "ctime": 1777598526, "time_str": "09:22:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260501/c676435473.shtml"}, {"id": "4311387", "title": "问界M6发布一周交付突破5000台", "content": "鸿蒙智行消息，问界M6上市1周交付突破5000台。（人民财讯）", "ctime": 1777597980, "time_str": "09:13:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260501/c676435438.shtml"}, {"id": "4311383", "title": "小米汽车2026年4月交付量超过30000台", "content": "小米汽车2026年4月交付量超过30000台。（财联社）", "ctime": 1777597910, "time_str": "09:11:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/202 const SECTORS  = [{"name": "金融", "hit_count": 37, "etfs": []}, {"name": "数据要素", "hit_count": 22, "etfs": []}, {"name": "军工", "hit_count": 19, "etfs": []}, {"name": "消费", "hit_count": 16, "etfs": []}, {"name": "人工智能", "hit_count": 14, "etfs": []}, {"name": "新能源", "hit_count": 13, "etfs": []}, {"name": "半导体", "hit_count": 12, "etfs": []}, {"name": "低空经济", "hit_count": 9, "etfs": []}];
const META     = {"update_time": "2026-05-01 14:25:40", "sentiment_score": 58.29787234042553, "agents": []};

// 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
