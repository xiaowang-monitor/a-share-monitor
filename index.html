ka.com.cn/20260722/c678354967.shtml"}, {"id": "4777759", "title": "津荣天宇：股份回购比例达到1%", "content": "津荣天宇公告，截至本公告披露日，本次回购公司股份方案已实施完毕。公司于2026年7月15日首次通过回购专用证券账户以集中竞价交易方式实施了股份回购，回购股份数量为39.55万股，占公司总股本的0.20%，最高成交价为14.13元/股，最低成交价为13.8元/股，成交总金额为553.68万元（不含交易费用）。2026年7月15日至2026年7月22日，公司通过回购专用证券账户以集中竞价交易方式累计回购公司股份数量为253.05万股，占公司当前总股本的1.28%，最高成交价为15.79元/股，最低成交价为12.5元/股，成交总金额为人民币3499.13万元（不含交易费用）。", "ctime": 1784710286, "time_str": "16:51:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260722/c678354961.shtml"}, {"id": "4777753", "title": "7月22日全国碳市场收盘价较前一日上涨0.54%", "content": "今日全国碳市场综合价格行情为： 开盘价90.4元/吨，最高价91.5元/吨，最低价90.4元/吨，收盘价91.03元/吨，收盘价较前一日上涨0.54%。今日挂牌协议交易成交量21.14万吨，成交额1924.32万元；大宗协议交易成交量61.5万吨，成交额5528.26万元；今日无单向竞价。今日全国碳排放配额总成交量82.64万吨，总成交额7452.58万元。2026年1月1日至7月22日，全国碳市场碳排放配额成交量6365.69万吨，成交额50.07亿元。截至2026年7月22日，全国碳市场碳排放配额累计成交量9.29亿吨，累计成交额626.69亿元。(全国碳交易)", "ctime": 1784710216, "time_str": "16:50:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260722/c678354935.shtml"}, {"id": "4777751", "title": "神开股份：董事叶明控制的畅怡投资拟增持500万元至1000万元", "content": "神开股份公告，董事叶明控制的畅怡投资于2026年7月21日通过集中竞价交易方式增持公司股份52.84万股，占公司总股本的0.14%，成交金额368.61万元；畅怡投资计划自2026年7月21日首次增持日起6个月内继续增持，增持金额不低于人民币500万元且不超过人民币1000万元。", "ctime": 1784710192, "time_str": "16:49:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260722/c678354926.shtml"}, {"id": "4777749", "title": "北京迎雷雨天气 已发布雷电黄色预警", "content": "记者22日从北京市气象部门了解到，受高空槽影响，22日下午至夜间北京有雷阵雨，房山、大兴、经开、通州、平谷、密云、怀柔等区局地相对明显，短时雨强较大，雷雨时伴有7级左右短时阵风，山区有冰雹。北京市气象台已于22日9时继续发布雷电黄色预警信号，请注意防范。\n\n据介绍，降雨对22日晚高峰交通出行有不利影响，请及时关注路况信息，注意出行安全，切勿涉水行车。若户外遭遇雷电、短时大风，切勿在高大建筑、广告牌、临时搭建物或大树下方停留，防止意外发生。(新华社)", "ctime": 1784710168, "time_str": "16:49:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "http s://news.10jqka.com.cn/20260722/c678354607.shtml"}, {"id": "4777689", "title": "商务部回应欧委会对全球速卖通罚款：强烈不满 严正关切", "content": "商务部新闻发言人22日就欧委会对全球速卖通罚款答记者问时表示，中方注意到有关情况，对此表示强烈不满和严正关切。有记者问：7月20日，欧委会宣布根据欧盟《数字服务法》，对全球速卖通处以5.5亿欧元罚款。请问中方对此有何评论？发言人说，中方坚决反对欧方以平台监管为由设置数字壁垒，并采取歧视性措施，限制打压中国电商企业在欧正常经营。中方敦促欧方停止利用法律条文的模糊性滥用自由裁量权，公平、公正对待中国企业。中方将坚定支持中国企业运用法律武器维权，并将采取有力措施坚定维护企业利益。（新华社）", "ctime": 1784709652, "time_str": "16:40:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260722/c678354602.shtml"}, {"id": "4777687", "title": "杰瑞股份：签署14.65亿美元重大合同", "content": "杰瑞股份公告，控股子公司J&FPowerSystemsLLC与某国际知名云服务提供商签署了燃气轮机发电机组供应合同，金额为14.65亿美元（约合994,984.05万元人民币）。合同将于2027年11月前分批交付，结算方式包括预付款、进度款和最终款项。此次合同金额约占公司2025年度经审计营业收入的61.33%，预计将对公司未来业绩产生积极影响。", "ctime": 1784709630, "time_str": "16:40:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260722/c678354595.shtml"}, {"id": "4777681", "title": "益生股份：2026年上半年净利润3.08亿元，同比增长4,897.29%", "content": "益生股份公告，2026年上半年营业收入16.97亿元，同比增长28.44%。净利润3.08亿元，同比增长4,897.29%。公司董事会审议通过的利润分配预案为：向全体股东每10股派发现金红利1.5元（含税），不送红股，不以公积金转增股本。", "ctime": 1784709576, "time_str": "16:39:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260722/c678354565.shtml"}, {"id": "4777671", "title": "圣泉集团：董事会提议向下修正“圣泉转债”转股价格", "content": "圣泉集团公告，自2026年6月25日至2026年7月22日，公司已出现任意连续三十个交易日中有十五个交易日的收盘价低于当期转股价格的85%的情形，触发“圣泉转债”转股价格向下修正条款。经公司第十届董事会第十六次会议审议通过，公司董事会提议向下修正“圣泉转债”的转股价格。本次向下修正“圣泉转债”转股价格尚需提交公司股东会审议。", "ctime": 1784709512, "time_str": "16:38:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260722/c678354467.shtml"}, {"id": "4777667", "title": "海伦哲：副总经理王俊鹏拟增持不低于50万元", "content": "海伦哲公告，副总经理王俊鹏先生拟自2026年7月23日至2027年1月22日期间，通过深圳证券交易所交易系统以集中竞价的方式增持公司股份，拟增持金额不低于50万元人民币，且不超过100万元人民币；本次增持不设定价格区间。", "ctime": 1784709480, "time_str": "16:38:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260722/c678354456.shtml"}, {"id": "4777657", "title": "迈克生物：首次回购0.0147%公司股份，支付的总金额为77.93万元", "content": "迈克生物公告，2026年7月22日，公司通过回购专用证券账户以集中竞价方式首次回购了公司股份，回购股份数量为88800股，占公司总股本的0.0147%，成交均价为8.78元/股，最高成交价为8.88元/股，最低成交价为8.67元/股，支付的总金额为77.93万元（不含交易费用）。", "ctime": 1784709340, "time_str": "16:35:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260722/c678354401.shtml"}, {"id": "4777649", "title": "威马农机：实控人严华、夏峰拟合计增持2000万元至3000万元", "content": "威马农机公告，公司控股股东、实际控制人严华先生、夏峰先生拟自本增持计划公告之日起6个月内，通过深圳证券交易所交易系统以集中竞价方式增持公司股份，拟增持金额合计为人民币2000万元至3000万元（均含本数）。严华、夏峰计划增持金额各不低于人民币1000万元（含），不超过人民币1500万元（含）。", "ctime": 1784709253, "time_str": "16:34:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260722/c678354348.shtml"}, {"id": "4777647", "title": "宏安地产：前四个月未经审核合约销售额约12.12亿港元", "content": "宏安地产公告，截至二零二六年六月三十日止三个月，集团连同其合营企业合共实现未经审核合约销售额约12.12亿港元。总合约销售实用面积约47784平方呎。", "ctime": 1784709186, "time_str": "16:33:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260722/c678354290.shtml"}, {"id": "4777643", "title": "瑞博生物：核心产品VORTOSIRAN针对CAD的2A期积极研究结果", "content": "瑞博生物公告，公司在上海举行的大国新药全球会议上公布了在欧洲进行的评估vortosiran (RBD4059)（靶向凝血因子XI (FXI)的小干扰RNA (siRNA)疗法）针对慢性冠状动脉疾病(CAD)患者的2a期研究的积极结果。该项随机、双盲、安慰剂对照研究显示，在接受阿司匹林标准治疗的患者中，vortosiran总体耐受性良好，可显著、剂量依赖且持久地抑制FXI活性。在完成高剂量vortosiran给药疗程、维持剂量为400 mg的患者中，FXI活性平均最大降幅达到92%，且在给药后持续数月。", "ctime": 1784709180, "time_str": "16:33:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260722/c678354282.shtml"}, {"id": "4777637", "title": "美国今年麻疹病例已超去年全年", "content": "美国约翰斯·霍普金斯大学21日发布的数据显示，截至当天，美国今年以来麻疹确诊病例已达2295例，超过2025年全年的2289例。约翰斯·霍普金斯大学布隆伯格公共卫生学院流行病学教授威廉·莫斯说，今年美国麻疹确诊病例数在“如此早的时候就达到如此高”，主要与今年早些时候在南卡罗来纳州、犹他州等地暴发大规模麻疹疫情有关。随着美国各地持续报告新增病例，今年麻疹病例“几乎肯定会继续增加”。（央视新闻）", "ctime": 1784709135, "time_str": "16:32:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260722/c678354262.shtml"}, {"id": "4777589", "title": "华强科技：预计2026年上半年净利润同比增长105.65%到158.15%", "content": "华强科技公告，预计2026年半年度实现归属于母公司所有者的净利润850万元到1067万元，与上年同期相比，将增加437万元到654万元，同比增加105.65%到158.15%。报告期内，利润同比增加的主要原因：一是公司积极优化医药包装产品结构和市场结构，加大力度拓市场抢订单，医药包装产品“基本盘”持续稳增长、“新品盘”持续加快放量，产品销量及收入同比增加，带动医药包装产品毛利率提升；二是持续实施提质增效行动，开源、节流、降成本三方面措施取得实效，公司经营质效得到提升。", "ctime": 1784708961, "time_str": "16:29:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260722/c678354136.shtml"}, {"id": "4777587", "title": "日本多地遭遇高温 首次出现“酷暑日”", "content": "日本气象厅数据显示，21日日本多地出现35摄氏度及以上高温天气。全国58个预报地区中有44个发布“中暑警戒警报”，为今年以来最多。截至当地时间21日17时，日本全国900多处气象观测点中，278处的最高气温达到或超过35摄氏度。其中，岐阜县郡上市气温达到40摄氏度。这也是日本气象厅今年决定将40摄氏度及以上高温天气称为“酷暑日”以来，首次出现这一情况。据东京消防厅统计，截至当地时间21日21时，东京都当天有261人因中暑被紧急送医，创下2022年开始相关统计以来单日最高纪录。另据日本媒体报道，兵库县、群马县和茨城县当天共有6人疑因中暑死亡。（新华社）", "ctime": 1784708925, "time_str": "16:28:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260722/c678354128.shtml"}, {"id": "4777585", "title": "巴西亚马孙2025年过火面积降至40年最低", "content": "巴西卫星图像分析机构“生物量地图”项目21日发布的年度报告显示，2025年巴西境内亚马孙雨林地区的过火面积降至40年来最低水平。根据这份报告，去年亚马孙地区约有310万公顷土地受到火灾影响，比2024年减少约80%，为过去40年来观测到的最小过火面积。巴西全国的野火灾情也有所缓解，全国过火总面积为1270万公顷，相较前一年逾3000万公顷的过火总面积有大幅下降，为2018年以来最低。“生物量地图”在另一份声明中表示，在经历了两年干旱后，得益于降雨量增加，2025年亚马孙地区水域覆盖面积有所增加，比历史平均水平高约2.6%。（央视新闻）", "ctime": 1784708919, "time_str": "16:28:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260722/c678354126.shtml"}, { // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
