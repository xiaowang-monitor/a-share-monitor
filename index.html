ode": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260701/c677862689.shtml"}, {"id": "4631709", "title": "科创50指数跌幅扩大至3%", "content": "科创50指数跌幅扩大至3%，现报2141.3点。", "ctime": 1782885042, "time_str": "13:50:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260701/c677862649.shtml"}, {"id": "4631705", "title": "国巨全系列电容产品价格调涨 现货市场涨幅或更大", "content": "7月1日，市场传闻被动元件大厂国巨向客户端通知价格调整，自当日开始调涨全系列电容产品价格，包括钽电、MLCC、铝电、固态铝电、薄膜电容、超级电容等，涉及的产品覆盖国巨约50%营收，且涨价对象首次纳入直接客户（EMS/OEM）。\n对此，记者致电东莞市超翔电子有限公司、深圳市河锋鑫科技有限公司等多家国巨代理商进行求证，相关代理商均表示国巨全系列电容产品涨价属实，且本次调涨的对象从代理商扩展至直接客户，等同现货价、合约价同步调涨。\n深圳市河锋鑫科技有限公司工作人员告诉记者，国巨电容产品本次原厂价格涨幅大约为50%，现货市场的价格涨幅相应会更大。“这次是原厂通知涨价，实际上，现货市场从今年5月到现在一直涨价，高端电容产品的价格一个月时间内最高涨幅接近10倍。最近经常出现延迟供货的情况，除了国巨，MLCC各大品牌都有延迟供货。”（上证报）", "ctime": 1782885023, "time_str": "13:50:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260701/c677862643.shtml"}, {"id": "4631701", "title": "阳光电源成交额达200亿元", "content": "阳光电源成交额达200亿元，现跌11.46%。", "ctime": 1782884967, "time_str": "13:49:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260701/c677862639.shtml"}, {"id": "4631595", "title": "韩国投资者上半年持续加仓A股", "content": "据中证报，2026年上半年，韩国投资者持续加码配置中国市场。韩国证券存托结算院（KSD）数据显示，在韩国投资者净买入金额居前的中国市场标的中，多只ETF强势挤进榜单前列，科技、人工智能、半导体、新能源等主题产品尤为受到追捧。A股市场中，韩国投资者净买入前20名中，有8只ETF产品，包括通信ETF华夏、芯片ETF华夏、人工智能ETF易方达、上证指数ETF富国、云计算ETF易方达、科创50ETF华夏、电网设备ETF华夏、机器人ETF华夏。个股方面，韩国资金重点投向人工智能、先进制造等成长领域。A股市场中，上半年被韩国资金买入最多的三一重工，获999.75万美元净买入；东山精密、宁德时代紧随其后，分别获558.20万美元、555.24万美元净买入；此外，亨通光电、麦格米特、云南锗业、长飞光纤等也获得韩国资金持续增持。", "ctime": 1782884418, "time_str": "13:40:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260701/c677862494.shtml"}, {"id": "4631583", "title": " "title": "光大期货：黄金跌势放缓，本周关注美就业数据", "content": "7月1日隔夜伦敦现货贵金属先抑后扬，SHFE黄金上涨0.80%。本周即将公布非农就业数据，市场预测6月将新增就业岗位11万，失业率保持在4.3%，劳动力市场表现或影响美联储未来政策方向，一旦就业数据表现强劲，进一步强化美联储加息预期，黄金下行压力或加大。\n宏观方面，美国5月JOLTS职位空缺数小幅增至759.4万个，略高于4月的758.5万和预期值730万，凸显就业市场韧性，市场也在等待周五美国6月非农就业数据的指引。地缘政治方面，中东局势再添变数，虽然美伊签署谅解备忘录，但局势依然复杂，霍尔木兹海峡通航问题进展偏缓慢，而以色列继续扩大针对巴勒斯坦地区的军事行动，并维持对伊朗的高压威慑。当前贵金属市场定价逻辑仍将由美联储货币政策路径主导，美联储是否加息也需要更多数据进行佐证，比如非农就业数据以及后期的通胀数据等，在此之前市场或依然处于鹰派政策预期中，对黄金持续利空压制。不过，昨晚纳斯达克指数实现三连阳，带动市场风险偏好回升，流动性主导下金价跌势也随之放缓，观察持续性。（光大期货）", "ctime": 1782882771, "time_str": "13:12:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260701/c677862058.shtml"}, {"id": "4631423", "title": "鸿蒙智行6月交付5.06万辆，上半年同比增长18.6%逆势领跑新能源车市", "content": "新能源市场“价格战”愈演愈烈之际，鸿蒙智行交出一份逆势增长的成绩单：今日官方发布6月销量数据，单月交付50624辆，环比增长9.7%；1-6月累计交付突破24万辆，同比增长18.6%。这与行业大盘形成鲜明反差——据中国汽车工业协会数据，今年1-5月国内乘用车产销同比分别下降6.6%和6.2%，整体承压明显。在全行业普遍收缩的竞争环境中，鸿蒙智行以51个月累计交付143万辆的记录刷新新势力品牌达成速度纪录，更突显其增长韧性。从问界M9两周交付破8000台，到问界M6 54天交付破3万台，再到尚界Z7系列单月破万，多车型协同放量的品牌体系已逐步成型。纵观全局，鸿蒙智行不依赖短期降价换量，而是靠华为乾崑智驾、鸿蒙全域互联等全栈自研技术形成差异化竞争力。随着车规芯片国产化新规与L3级准入政策即将落地，全栈自研的前置布局或将成为其穿越周期的关键底牌。（第一财经）", "ctime": 1782882415, "time_str": "13:06:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260701/c677861912.shtml"}, {"id": "4631407", "title": "沪深京三市成交额超2.5万亿元，较上日此时放量3005亿元", "content": "据同花顺iFinD数据，沪深京三市成交额超2.5万亿元，较上日此时放量3005亿元，预计全天成交金额约3.7万亿元。截至目前，沪市成交额11417亿元，深市成交额13430亿元，北证50成交额157亿元。", "ctime": 1782882222, "time_str": "13:03:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260701/c677861832.shtml"}, {"id": "4631401", "title": "科创50指数跌幅扩大至1%", "content": "科创50指数跌幅扩大至1%，现报2185.2点。", "ctime": 1782882106, "time_str": "13:01:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260701/c677861793.shtml"}, {"id": "4631347", "title": "JEITA：日本电子零部件企业出货额连续走高 电容出货规模单月破纪录", "content": "被动元件市场需求旺盛，拉动日本电子零部件企业出货额连续走高，其中电容出货规模4月刷新历史纪录。日本电子信息技术产业协会（JEITA）6月30日发布统计数据，2026年4月日本厂商被动元件出货额达2314亿日元，同比大幅增长18%。分品类来看，电容出货额同比增长20%至1676亿日元，连续15个月同比上升，单月出货规模已连续68个月突破1000亿日元，较3月的1625亿日元进一步走高，创下JEITA自2014年有统计数据以来历史新高；电阻出货额同比增长21%至170亿日元，变压器出货额同比增长8%至41亿日元，电感出货额同比增长6%至359亿日元。（科创板日报）", "ctime": 1782881545, "time_str": "12:52:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260701/c677861723.shtml"}, {"id": "4631341", "title": "联合国机构警告刚果（金）埃博拉疫情将冲击地区经济", "content": "联合国开发计划署、世界卫生组织6月30日警告说，刚果（金）本轮埃博拉疫情扩散速度超过当前应对能力，可能造成更广泛的社会经济冲击。世卫组织非洲区域办事处当天发布的最新报告显示，刚果（金）本轮由本迪布焦型埃博拉病毒引发的疫情仍处于“活跃”状态，疫情仍在刚果（金）多地传播，当前整体应对工作“仍低于快速阻断传播所需水平”。联合国开发计划署同日在金沙萨发布的一项评估报告警告说，刚果（金）暴发的埃博拉疫情正在引发一场影响深远的社会经济危机，可能使98.5万人陷入贫困。如疫情冲击进一步加剧，非洲地区经济可能蒙受最高达36亿美元的损失。（新华社）", "ctime": 1782881503, "time_str": "12:51:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260701/c677861716.shtml"}, {"id": "4631339", "title": "白宫称特朗普加密币获利无利益冲突", "content": "据美国媒体当地时间6月30日报告，美国总统特朗普提交给美国政府道德办公室的2025年度财务报告显示，去年特朗普家族的加密货币业务为其带来了超过10亿美元的收入。据披露的财务文件显示，特朗普家族的加密企业“世界自由金融公司”通过销售新型加密产品获得了逾5亿美元收入；另有约6.35亿美元来自其个人迷因币（Meme币）$TRUMP的销售。对于这次美国媒体披露出来的财务报告内容，白宫方面强调“不存在利益冲突”。白宫方面在一份给媒体的声明中称，特朗普及其家人“从未卷入——也绝对不会卷入——任何利益冲突”。（CCTV国际时讯）", "ctime": 1782881495, "time_str": "12:51:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260701/c677861714.shtml"}, {"id": "4631327", "title": "7月1日午间公告一览：新强联向特定对象发行股票申请获审核通过", "content": "新强联公告，公司于2026年6月30日收到深圳证券交易所上市审核中心出具的《关于洛阳新强联回转支承股份有限公司申请向特定对象发行股票的审核中心意见告知函》。深交所发行上市审核机构对公司向特定对象发行股票的申请文件进行了审核，认为公司符合发行条件、上市条件和信息披露要求。公司本次向特定对象发行股票事项尚需获得中国证监会同意注册的决定后方可实施。", "ctime": 1782881235, "time_str": "12:47:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260701/c677861683.shtml"}, {"id": "4631323", "title": "科瑞技术：已为国内大客户提供液冷相关设备", "content": "科瑞技术7月1日在互动平台表示，公司积极承接国内大客户需求，已为国内大客户提供液冷相关设备。目前营收占比较小，敬请注意投资风险。（人民财讯）", "ctime": 1782881153, "time_str": "12:45:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260701/c677861668.shtml"}, {"id": "4631319", "title": "应对AI时代“用电荒” 韩国拟研究缩短核电站建设周期", "content": "为满足AI发展带来的庞大用电需求，韩国政府准备研究缩短核电站建设周期，加快扩大电力供应。韩国总统秘书室室长姜勋植表示，具体方案将写入即将发布的长期电力供需基本计划。建造一座核电站通常需要9至10年，政府部门将研究如何缩短工期。AI热潮推动企业和各国政府重新重视核电，究其原因，在于能全天候稳定供电，碳排放也相对较低。韩国目前约三分之一电力来自核能，拟议中的大规模数据中心和半导体产业集群仍需要更多电力支持。（科创板日报）", "ctime": 1782881146, "time_str": "12:45:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260701/c677861666.shtml"}, {"id": "4631229", "title": "昊铂埃安BU 6月销量33682辆", "content": "7月1日，据广汽消息，昊铂埃安BU 2026年6月销量33682辆，同比上涨21%；2026年上半年同比上涨15%。", "ctime": 1782879971, "time_str": "12:26:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260701/c677861393.shtml"}, {"id": "4631225", "title": "国际金价6月下跌逾11%", "content": "受美伊谈判不确定性增加、美元走强、美联储加息预期等因素影响，国际黄金价格6月下跌幅度超过11%。今年第二季度黄金价格下跌约14%，创下2013年来最大季度跌幅。分析人士认为，美元走强和美国国债收益率上升将继续打压黄金价格，金价或难以出现任何实质性反弹。（新华社）", "ctime": 1782879909, "time_str": "12:25:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260701/c677861378.shtml"}, {"id": "4631223", "title": "蔚来：6月交付新车40597台，创今年以来新高，同比增长62.9%", "content": "蔚来：6月交付新车40597台，创今年以来新高，同比增长62.9%。其中，蔚来品牌交付新车21908台，同比增长50.1%；乐道品牌交付新车11743台，同比增长83.5%；firefly萤火虫品牌交付新车6946台，同比增长76.7%。2026年上半年，蔚来公司共交付新车19.11万台，创历史新高，同比增长67.4%，三品牌上半年交付量均创历史新高。其中，蔚来品牌交付新车11.95万台，创历史新高，同比增长60.5%；乐道品牌交付新车42463台，创历史新高，同比增长33.3%；firefly萤火虫品牌交付新车29172台，创历史新高，同比增长271.9%。截至目前，蔚来公司已累计交付新车118.87万台。（第一财经）", "ctime": 1782879902, "time_str": "12:25:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260701/c677861377.shtml"}, {"id": "4631221", "title": "问界汽车：6月交付新车30199台", "content": "7月1日，问界汽车官方微博宣布，6月交付新车30199台，上半年累计交付同比增长10.2%。全新一代问界M9系列，上市一个月大定突破42000台；问界M6上市54天，累计交付超30000台。", "ctime": 1782879888, "time_str": "12:24:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260701/c677861375.shtml"}, {"id": "4631217", "title": "岚图汽车：2026年6月交付新车14223辆，同比增长41%", "content": "岚图汽车：2026年6月交付新车14223辆，同比增长41%。", "ctime": 1782879874, "time_str": "12:24:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260701/c677861371.shtml"}, {"id": "4631177", "title": "京瓷将投资6500亿日元 加码半导体、数据中心相关零部件业务", "content": "京瓷计划向其零部件业务投资6500亿日元（约合人民币2712.45亿元），重点发展半导体制造设备和人工智能数据中心等高增长领域。（财联社）", "ctime": 1782879028, "time_str": "12:10:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260701/c677861173.shtml"}, {"id": "4631171", "title": "国际能源署预计今年美国在煤炭和天然气发电厂的支出将达到500亿美元", "content": "国际能源署预计今年美国在煤炭和天然气发电厂的支出将达到500亿美元。", "ctime": 1782878793, "time_str": "12:06:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260701/c677861086.shtml"}, {"id": "4631165", "title": "欧洲央行管委德马尔科：欧洲央行可以等到下一轮经济预测再决定是否需要进一步收紧政策", "content": "欧洲央行管委德马尔科：欧洲央行可以等到下一轮经济预测再决定是否需要进一步收紧政策。在油价下跌后，欧洲央行不应仓促推进下一次加息。", "ctime": 1782878691, "time_str": "12:04:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260701/c677861063.shtml"}, {"id": "4631153", "title": "美媒称美将在黎以驻军监督停火", "content": "美国《华盛顿邮报》6月29日援引消息人士的话报道称，美国将在黎巴嫩和以色列两国驻扎地面部队，直接监督黎巴嫩武装部队和以 // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');

      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
