.com.cn/20260923/c680212966.shtml"}, {"id": "5232359", "title": "众泰汽车：欣锦贸易诉讼涉案1540万元尚未开庭", "content": "众泰汽车公告，深圳欣锦贸易有限公司因合同纠纷向公司提起诉讼，诉请偿还欠款本金1540万元及资金占用期间利息暂计31.06万元。公司近日收到应诉通知书，本案尚未开庭审理，尚未判决，公司为被告。", "ctime": 1790150875, "time_str": "16:07:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260923/c680212941.shtml"}, {"id": "5232339", "title": "COMEX白银期货跌超1%", "content": "COMEX白银期货跌超1%，现报65.69美元/盎司。", "ctime": 1790150664, "time_str": "16:04:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260923/c680212169.shtml"}, {"id": "5232337", "title": "经合组织预计美国2026年经济增速为2.2%，2027年为2.1%，此前预计为2.0%和1.8%", "content": "经合组织预计美国2026年经济增速为2.2%，2027年为2.1%，此前预计为2.0%和1.8%。", "ctime": 1790150660, "time_str": "16:04:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260923/c680212160.shtml"}, {"id": "5232333", "title": "安科瑞：周中增持50万股，增持计划实施完成", "content": "安科瑞公告，控股股东、实际控制人、董事长周中先生截至2026年9月23日通过集中竞价交易增持公司股份50万股，占公司总股本的0.1994%，增持金额为人民币964.52万元（不含交易费用），增持计划已实施完毕。增持后，周中持有公司股份3969.8万股，占公司总股本的15.83%。", "ctime": 1790150649, "time_str": "16:04:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260923/c680212142.shtml"}, {"id": "5232329", "title": "全国铁路中秋国庆假期预计发送旅客2.84亿人次", "content": "记者从中国国家铁路集团有限公司获悉，铁路中秋国庆假期运输23日启动，至10月8日结束，为期16天，全国铁路预计发送旅客2.84亿人次，日均计划开行旅客列车约1.3万列，10月1日将迎来铁路客流最高峰。为应对假日客流高峰，铁路部门积极适应旅客假期多样化出行需求，精心制定假期运输方案，增加运力投放，落实便民利民服务举措。全国铁路实行高峰运行图，用好武汉至西安高铁西安东至十堰东段、金华至建德高铁兰溪东至建德段、杭州经绍兴至台州高铁温岭至玉环段和即将建成投用的新线新站资源，有效提升区域旅客运输能力。在高峰时段采取增开旅客列车、动车组重联、普速旅客列车加挂车厢等方式，及时在热门区域、线路和时段精准投放运力。（新华社）", "ctime": 1790150641, "time_str": "16:04:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260923/c680212127.shtml"}, {"id": "5232315", "title": "神农集团：何祖训离婚诉讼已受理，持股49.60%", "content": "神农集团公告，公司控股股东、实际控制人何祖训涉及的离婚纠纷案已由昆明市官渡区人民法院立案，案件已受理、尚未开庭审理；原告要求解除婚姻关系并进行财产分割。何祖训直接持有公司股份2.61亿股，占公司总股本的49.60%。双方已协商约定将在法院主持下先行调解。", "ctime": 1790150572, "time_str": "16:02:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260923/c680211890.shtml"}, {"id": "5232309", "title": "蒙草生态：快乐小草公司获1.42亿元项目中标通知书", "content": "蒙草生态公告，公司此前披露子公司快乐小草公司中标内蒙古自治区巴彦淖尔市乌拉特后旗三北工程林草湿荒一体化保护修复项目（2026年度）施工二标段；近日收到《中标通知书》，项目中标金额为1.42亿元，计划工期为建设期270日历天、管护期5年。", "ctime": 1790150555, "time_str": "16:02:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260923/c680211786.shtml"}, {"id": "5232285", "title": "美股大型科技股盘前涨跌互现，SK海力士跌超1%", "content": "美股大型科技股盘前涨跌互现，Meta、微软涨0.6%，谷歌A涨0.4%，亚马逊、苹果涨0.2%，特斯拉、美光科技、英伟达涨0.1%；SK海力士跌超1%，SpaceX跌0.2%。", "ctime": 1790150470, "time_str": "16:01:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260923/c680211386.shtml"}, {"id": "5232283", "title": "美股中概股盘前多数下跌，阿里巴巴跌3%", "content": "美股中概股盘前多数下跌，理想汽车涨1%，拼多多跌0.7%，京东、网易跌0.8%，哔哩哔哩跌1%，百度、百济神州跌2%，阿里巴巴跌3%。", "ctime": 1790150466, "time_str": "16:01:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260923/c680211366.shtml"}, {"id": "5232237", "title": "国台办：将继续积极推动两岸经济交流合作", "content": "国务院台办发言人朱凤莲23日在例行新闻发布会上应询表示，我们将继续秉持“两岸一家亲”理念，积极推动两岸经济交流合作，让两岸同胞共享两岸关系和平发展、融合发展的红利。她说，在各方共同努力下，台湾文旦柚在大陆多地展会亮相，并在超市、农贸市场以及电商平台上架销售，受到广大消费者欢迎。中秋和国庆假期，将有更多台湾文旦柚进入大陆千家万户，更多大陆消费者品尝到台湾优质果品，更多台湾基层果农得以分享大陆广阔的市场机遇。这种双向奔赴展现了一幅融合发展、互利共赢的生动图景。（新华社）", "ctime": 1790150406, "time_str": "16:00:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260923/c680211216.shtml"}, {"id": "5232235", "title": "优利德：已推出并销售矢量网络分析仪（VNA）产品", "content": "优利德9月23日在互动平台表示，公司已推出并销售矢量网络分析仪（VNA）产品，目前产品线主要包括VNA4000系列（频率范围100kHz～9GHz，2/4端口，动态范围大于138dB）和VNA3000系列（频率范围100kHz～8.5GHz），主要面向无线通信、广播电视、汽车电子、半导体、医疗器件等领域射频器件及组件的研发与生产测试，提供性能测试方案。从行业公开信息看，随着通信、数据中心高速互连、汽车电子智能化及半导体等下游领域的发展，射频及微波器件对更高频率、更高精度测试的需求整体呈增长趋势；高端VNA市场目前仍主要由海外头部厂商占据，国产替代空间较大。公司VNA相关产品收入基数较小，占整体营收比重较低。（人民财讯）", "ctime": 1790150390, "time_str": "15:59:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260923/c680211208.shtml"}, {"id": "5232187", "title": "蓝佛安会见香港特别行政区政府财政司司长陈茂波", "content": "　　2026年9月21日，蓝佛安部长在北京会见香港特别行政区政府财政司司长陈茂波。双方就亚太经合组织（APEC）财长会筹备工作、香港经济社会发展以及全球经贸议题交换了意见。(财政部)", "ctime": 1790149995, "time_str": "15:53:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260923/c680211026.shtml"}, {"id": "5232183", "title": "民政部：县级以上婚姻登记机关实现婚姻家庭辅导室全覆盖", "content": "民政部消息，县级以上婚姻登记机关实现婚姻家庭辅导室全覆盖，婚姻家庭辅导人员达1.8万人，服务从简单调解拓展到新婚辅导、心理疏导、关系修复等。婚俗新风更加深入，确定各层级婚俗改革实验单位2080家，建成户外颁证点1330个、公园等场所婚姻登记点525个、婚俗文化展示场所2045处，简约适度婚礼逐步成为新风尚。“十五五”时期，民政部门将聚焦群众需求，进一步优化婚姻管理服务，在提升登记服务水平、拓展辅导服务供给、优化登记场所建设、培育文明婚俗风尚、规范婚介行业发展等五方面重点发力。（央视新闻）", "ctime": 1790149979, "time_str": "15:52:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260923/c680211022.shtml"}, {"id": "5232171", "title": "华源证券：维持安克创新“增持”评级，储能+AI硬件双轮驱动", "content": "华源证券研报指出，安克创新收入环比提速，扣非归母净利率同比改善。2026H1公司实现归母净利润17亿元，同比+45.9%；单Q2营收同比+30.9%，收入环比提速；扣非归母净利润同比+71%。展望H2及中长期，储能+AI硬件双轮驱动，成长确定性有望增强。（1）充电储能：小充品类，我们预计2026H2收入增速有望修复（2025H2或受供应链切换及阶段性扰动拖累），下游需求与产品升级逻辑持续验证；中大充品类，公司发布SolarbankMaxAC、Solarbank4E5000Pro等新品，叠加区域拓展与渠道深化，我们认为需求与出货有望加快。（2）智能创新类：IFA发布MindBase家庭本地AI中枢，AI提升安防等产品体验。（3）智能影音类：公司推出搭载Thus AI音频芯片的多款耳机新品，AI持续赋能，持续巩固品类的增长势能与市场份额。预计公司2026-2028年归母净利润分别为36.2/41.1/49.2亿元，当前股价对应的PE分别为21/18/15倍，维持“增持”评级。（新浪财经）", "ctime": 1790149739, "time_str": "15:48:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260923/c680210883.shtml"}, {"id": "5232155", "title": "民政部部长李常官：我国社会救助将从“保生存”向“保基本、防风险、促发展”拓展", "content": "在国务院新闻办公室今天举行的“开局起步‘十五五’”系列主题新闻发布会上，民政部部长李常官介绍，“十五五”时期，民政部将锚定社会救助体系目标，推动社会救助从“保生存”向“保基本、防风险、促发展”拓展。一是进一步完善政策制度体系，增强政策供给“系统性”。二是进一步完善服务保障体系，增强救助帮扶“精准性”。三是进一步完善监督管理体系，增强落地实施“公平性”。四是进一步完善社会参与体系，增强资源力量“协同性”。（央视新闻）", "ctime": 1790149572, "time_str": "15:46:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260923/c680210820.shtml"}, {"id": "5232069", "title": "民政部：我国将推动失能照护服务扩容提质增效", "content": "在国务院新闻办公室今天举行的“开局起步‘十五五’”系列主题新闻发布会上，民政部副部长孙硕鹏介绍，“十五五”时期，我国将着力推动失能照护服务扩容提质增效，破解失能老年人照护以及残疾人托养照护难题。一是分级开展照护服务。完善老年人能力评估体系，根据能力等级和个人意愿，引导老年人选择居家、社区或机构照护服务。依托覆盖城乡的县乡村三级养老服务网络，加大照护服务供给。二是分类提升照护水平。着眼老年人的失能进程、经济条件和服务需求，按需提供普惠照护、兜底保障以及探访关爱、失智照护、康复护理、安宁疗护等服务，打造全生命周期、全链条照护服务模式。（央视新闻）", "ctime": 1790149112, "time_str": "15:38:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260923/c680210613.shtml"}, {"id": "5232049", "title": "南向资金净买入超30亿港元", "content": "据同花顺iFinD数据，截至目前，南向资金净买入超30亿港元，其中港股通（沪）买入超39.13亿港元，港股通（深）卖出超8.94亿港元。", "ctime": 1790148939, "time_str": "15:35:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260923/c680210545.shtml"}, {"id": "5232043", "title": "太极集团：国太牧业获批重整，投资款4137.62万元", "content": "太极集团公告，公司此前披露国太牧业破产清算程序拟转为破产重整程序。经第三次债权人会议暨出资人会议表决通过，科尔沁法院于2026年9月9日裁定批准重整计划草案，谦易（江苏）实业投资管理有限公司取得重整投资人资格，重整投资款为4137.62万元，现已正式签署《重整投资协议》《重整投资协议的补充协议》。", "ctime": 1790148862, "time_str": "15:34:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260923/c680210514.shtml"}, {"id": "5232041", "title": "江河集团：全资子公司中标幕墙工程1.74亿阿联酋迪拉姆", "content": "江河集团公告，公司全资子公司江河幕墙中东工程有限公司近日在中东迪拜中标W Residences幕墙工程，中标金额为1.74亿阿联酋迪拉姆（折合人民币317915000元），约占公司2025年度营业收入的1.46%。截至公告披露日，公司尚未完成与相关方签订正式合同。", "ctime": 1790148855, "time_str": "15:34:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260923/c680210511.shtml"}, {"id": "5232039", "title": "现货黄金失守4320美元/盎司", "content": "现货黄金失守4320美元/盎司，日内跌0.79%。", "ctime": 1790148852, "time_str": "15:34:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260923/c680210508.shtml"}, {"id": "5232035", "title": "东风汽车与华为高层会谈 深化战略合作", "content": "9月22日，东风汽车总经理、党委副书记冯长军赴深圳，与华为创始人任正非及华为高层代表会谈。双方围绕深化战略合作、产品技术协同创新等议题进行深入交流。双方就企业经营、业务发展情况作沟通交流，重点围绕奕境X9、猛士X700、岚图梦想家9等联合打造的战略新车型交换看法，并聚焦未来产品定义、智能技术落地、市场营销等维度探讨深化合作方向。面向新趋势，东风加快推进“东方风起2030”计划，并在近期发布了“天净零碳”计划、“具身智能汽车全域守护”计划、“天际扬帆”计划，双方将持续深化战略合作，打造面向未来的智能汽车与智慧出行解决方案。(人民财讯)", "ctime": 1790148808, "time_str": "15:33:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260923/c680210489.shtml"}, {"id": "5232001", "title": "外交部：“敌国条款”时至今日仍具有重要现实意义", "content": "针对日本首相高市早苗呼吁删除《联合国宪章》的“敌国条款”，外交部发言人郭嘉昆23日在例行记者会上答问时表示，当年日本以承认军国主义罪行、接受《联合国宪章》全部内容为前提加入联合国。《联合国宪章》中的“敌国条款”是重要制度安排，旨在防止法西斯主义、军国主义再度对国际和平与安全构成威胁，为捍卫战后国际秩序提供了重要制度保障，时至今日仍然具有重要现实意义。中方敦促日方以史为鉴、深刻反省，以实际行动取信于亚洲邻国和国际社会。（新华社）", "ctime": 1790148614, "time_str": "15:30:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260923/c680210408.shtml"}, {"id": "5231993", "title": "外交部：愿同各方共同推动世界技能运动发展", "content": "9月23日，外交部发言人郭嘉昆主持例行记者会。有记者问，第48届世界技能大赛正在上海举行。习近平主席向大赛致贺信，李强总理出席今天上午召开的世界技能大会开幕式并致辞。世界技能博览会也同期举办。发言人能否进一步介绍情况？郭嘉昆表示，第48届世界技能大赛在上海拉开帷幕，吸引了来自68个国家和地区近1400名选手参赛，规模空前。习近平主席向大赛致贺信指出，当前新一轮科技革命和产业变革加速突破，给全球技能发展带来深刻影响。中国将以举办这届大赛为契机，鼓励引导更多劳动者，特别是青年人走技能成才之路。我们愿同各方加强交流合作，推动世界技能运动发展，更好服务全球经济增长和民生福祉改善。(央视新闻)", "ctime": 1790148549, "time_str": "15:29:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260923/c680210344.shtml"}, {"id": "5231967", "title": "美方发出威胁后，中方还允许伊朗商业航班降落吗？外交部：中方立场是一贯的", "content": "9月23日，外交部发言人郭嘉昆主持例行记者会。法新社记者提问，美国威胁从今天开始，将惩罚那些允许伊朗航班降落的国家。中方是否还在允许伊朗商业航班降落？郭嘉昆表示，中方的立场是一贯的，我们坚决反对没有国际法依据，未经联合国安理会授权的非法单边制裁。（澎湃新闻）", "ctime": 1790148391, "time_str": "15:26:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260923/c680210168.shtml"}, {"id": "5231957", "title": "高市早苗在联大呼吁删除《联合国宪章》“敌国条款”，外交部回应", "content": "9月23日，外交部发言人郭嘉昆主持例行记者会。有记者提问，当地时间9月22日，日本首相高市早苗在联合国大会发言称，日本作为和平国家，坚守专守防卫政策，为国际社会的和平与繁荣贡献力量，将推进无核武器世界，呼吁删除《联合国宪章》中的“敌国条款”。请问中方有何评论？郭嘉昆表示，相比日方怎么说，国际社会更关注日本怎么做。战后日本“和平国家”理念是建立在深刻反省历史、彻底同军国主义切割的基础之上，但事实上，日本现政权不仅否认侵略历史、美化战争罪行，还持续强军扩武、加速再军事化，图谋抛弃“无核三原则”，修改“和平宪法”，公然挑战战后国际秩序，已经成为威胁地区和平稳定的突出因素。今年是联合国成立81周年，也是东京审判开庭80周年。当年日本以承认军国主义罪行，接受《联合国宪章》全部内容为前提加入联合国。《联合国宪章》中的“敌国条款”是重要制度安排，旨在防止法西斯主义、军国主义再度对国际和平与安全构成威胁，为捍卫战后国际秩序提供了重要制度保障。时至今日，仍然具有重要现实意义。我们敦促日方以史为鉴，深刻反省，以实际行动取信于亚洲邻国和国际社会。（澎湃新闻）", "ctime": 1790148332, "time_str": "15:25:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260923/c680210116.shtml"}, {"id": "5231951", "title": "民政部将从四方面发力持续提升儿童福利保障水平", "content": "民政部副部长胡海峰在发布会上介绍，“十四五”时期，我国困境儿童福利保障制度体系进一步完善、服务对象进一步拓展、关爱水平进一步提升、工作阵地进一步夯实，流动儿童、留守儿童关爱服务体系初步建立，有力有效保障了困境儿童合法权益。“十五五”时期，将从强制度、强服务、强供给、强队伍四方面持续发力。（央视新闻）", "ctime": 1790148299, "time_str": "15:24:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260923/c680210085.shtml"}, {"id": "5231939", "title": "福耀科大·诺瓦核聚变研究院成立，加速聚变能源技术商业化落地", "content": "福耀科大·诺瓦核聚变创新研究院及福耀科技大学·诺瓦核聚变创新实验室正式揭牌成立。记者了解到，研究院和实验室由福建福耀科技大学与诺瓦聚变能源科技（上海）有限公司联合共建。研究院定位为前沿聚变研究平台，主攻可控核聚变前沿工程技术攻关与关键科学问题研究；实验室承担项目研发、中试验证与成果转化，负责把研究院的前沿成果推向工程化、产业化——前沿出题、中试验证、产业落地，一条链贯通。研究院院长及创新实验室主任由福建福耀科技大学特聘教授、诺瓦聚变创始人郭后扬担任。（财联社）", "ctime": 1790148210, "time_str": "15:23:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260923/c680210059.shtml"}, {"id": "5231915", "title": "“十五五”时期民政部将推动制定养老服务法", "content": "民政部部长李常官9月23日在国新办举行的“开局起步‘十五五’”系列主题新闻发布会上介绍，“十五五”时期将推动修订老年人权益保障法，与时俱进完善保障制度体系，切实增进老年人福祉；推动制定养老服务法，健全分级分类、普惠可及、覆盖城乡、持续发展的养老服务体系。（新华社）", "ctime": 1790148111, "time_str": "15:21:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260923/c680210021.shtml"}, {"id": "5231907", "title": "德国正式加入《海洋生物多样性协定》", "content": "当地时间9月22日，德国正式加入《〈联合国海洋法公约〉下国家管辖范围以外区域海洋生物多样性的养护和可持续利用协定》（简称《协定》或《海洋生物多样性协定》）。德国环境部长卡斯滕·施耐德当天在纽约联合国总部提交批准书。《海洋生物多样性协定》于2023年6月19日通过，2026年1月17日正式生效，首次为保护国家管辖范围以外海域的海洋生物多样性建立具有约束力的国际规则，并为设立海洋保护区、开展环境影响评估等提供法律框架，涉及海域约占全球海洋面积三分之二。截至目前，该协定已有94个缔约方、145个签署方。德国联邦议院已于2026年春季通过相关国内法，协定及配套法律将于10月21日起对德国相关主体具有约束力。（央视新闻）", "ctime": 1790147961, "time_str": "15:19:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260923/c680209893.shtml"}, {"id": "5231905", "title": "五级飓风“波洛”威胁墨西哥太平洋沿岸", "content": "飓风“波洛”持续在墨西哥附近海域增强。美国国家飓风中心22日说，“波洛”已增强为五级飓风，“极其危险”，可能会给墨西哥太平洋沿岸地区带来洪涝和泥石流风险。该机构警告，墨西哥南部的格雷罗州和西南部的米却肯州沿海地区预计将出现强降雨，并有可能引发危及生命的洪水和泥石流。（央视新闻）", "ctime": 1790147947, "time_str": "15:19:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260923/c680209864.shtml"}, {"id": "5231875", "title": "乌官员说乌方已暂停黑海粮食出口", "content": "乌克兰农业政策与粮食部长塔拉斯·维索茨基22日表示，由于港口遭封锁，乌克兰已暂停通过黑海港口出口粮食。维索茨基在一段视频中说，“截至今天”，敖德萨地区“已没有粮食出口，（相关出口）已经停止”。维索茨基说，乌方已从8月开始通过铁路、内河、公路出口粮食，其中铁路和内河运输量占绝大多数。他介绍，乌方每月需出口至少500万吨粮食，每年至少6000万吨，但上述三条途径的运力仅为所需出口总量的一半。如果乌克兰试图进一步扩大陆路出口规模，将推高粮食运输成本，使出口变得无利可图。（央视新闻）", "ctime": 1790147733, "time_str": "15:15:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260923/c680209702.shtml"}, {"id": "5231841", "title": "超10家银行清退炒金通道 知情人士：是上金所发起的 实物黄金代销不受影响", "content": "光大银行近日宣布，自10月19日起停办代理上海黄金交易所(以下简称上金所)个人贵金属业务。银行代理的个人贵金属交易业务中，贵金属现货延期交易业务具有杠杆特征，风险较高。知情人士表示，银行代理上金所个人贵金属交易业务的停办，是上金所发起的。自上金所此前提出并正式确立停止这项业务代理后，客户就不能再从银行买入了。不再买入后这段时间，银行在持续推进清仓。目前，已超10家银行宣布停办该业务。 （每经）", "ctime": 1790147623, "time_str": "15:13:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260923/c680209639.shtml"}, {"id": "5231837", "title": "民政部：我国将持续推进普惠性、基础性、兜底性民生建设", "content": "民政部部长李常官介绍，“十四五”时期，我国兜底民生保障全面加强，常态化保障3936万名低保对象、488万名特困人员、57万名孤儿和事实无人抚养儿童基本生活，“两项补贴”惠及1198万名困难残疾人和1675万名重度残疾人。养老服务保障水平持续提升，基本养老服务制度全面建立，5300多万名老年人享受老年人补贴，养老服务机构和设施达到39.5万个。“十五五”时期，我国将持续推进普惠性、基础性、兜底性民生建设。重点推进四方面工作。一是着力增进老年人福祉。深入实施积极应对人口老龄化国家战略，健全城乡三级养老服务网络，加大养老机构护理型床位建设，推动养老机构护理型床位占比达到73%，加强失能失智老年人照护服务，因地制宜发展农村养老服务，保障养老服务质量安全，推动全体老年人享有基本养老服务。同时，大力发展银发经济，促进老年人社会参与，加强老年人权益保障，建设老年友好社会。（央视新闻）", "ctime": 1790147590, "time_str": "15:13:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260923/c680209603.shtml"}, {"id": "5231807", "title": "教育部：大力提升高等学科专业与产业适配度", "content": "教育部副部长杜江峰9月23日在国务院新闻办新闻发布会上说，面向“十五五”，大力提升高等学科专业与产业的适配度，推动高校主动对标科技发展、国家战略急需，优化学科的专业设置。（新华社）", "ctime": 1790147438, "time_str": "15:10:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260923/c680209549.shtml"}, {"id": "5231793", "title": "NYMEX铂金主力合约跌超1%", "content": "NYMEX铂金主力合约跌超1%，现报1804.8美元/盎司。", "ctime": 1790147360, "time_str": "15:09:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260923/c680209474.shtml"}, {"id": "5231773", "title": "千问发布 Qwen-Audio-3.1，下调 Qwen-Audio 全线语音模型价格", "content": "今天，千问正式发布 Qwen-Audio-3.1系列语音大模型。本次升级不仅对语音识别（ASR）、语音合成（TTS）和实时语音交互（Realtime）三大核心模型进行了全面进化，更重磅推出了全新的音频创作模型 Qwen-Audio-3.1-TTS-Next 和音频理解模型 Qwen-Audio-3.1-ASR-Next。五款全新的语音模型同时推出，形成了一套覆盖“理解-生成-交互-创作”的完整音频能力栈。为进一步降低用户使用成本，Qwen-Audio 全线语音模型价格均下调，其中TTS降价约70%，Realtime降幅约85%，ASR降幅达95%。（新浪财经）", "ctime": 1790147275, "time_str": "15:07:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260923/c680209398.shtml"}];

    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
