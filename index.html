.mono { font-family: 'JetBrains Mono', monospace; }
.card {

.card:hover { background: var(--bg-card-hover); border-color: #334155; }

.score-bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s; }
.up { color: var(--red); }
.down { color: var(--green); }
.pulse { animation: pulse 2s infinite; }
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}
.glow { box-shadow: 0 0 20px rgba(59,130,246,0.15); }

/c679257908.shtml"}, {"id": "5019399", "title": "台风“紫檀”持续影响广西，多地将现大到暴雨局地有大暴雨", "content": "今起三天（8月25日至27日），今年第19号台风“紫檀”将持续为广西多地带来强降雨，多地将现大到暴雨，局地有大暴雨并伴有强对流天气，需及时关注天气预警预报信息，做好防范措施。（中国天气网）", "ctime": 1787630286, "time_str": "11:58:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260825/c679257886.shtml"}, {"id": "5019397", "title": "日本9月和10月不再额外释放国家石油储备", "content": "日本经济产业大臣赤泽亮正周二表示，日本计划在9月和10月不再额外释放国家石油储备。", "ctime": 1787630201, "time_str": "11:56:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260825/c679257875.shtml"}, {"id": "5019393", "title": "河北省启动重大气象灾害（暴雨）Ⅲ级应急响应", "content": "河北省气象台8月25日9时发布暴雨橙色预警信号和雷电黄色预警信号，预计8月25日下午到26日上午，张家口南部、唐山南部、保定、雄安新区、廊坊、石家庄、沧州、衡水等地有暴雨到大暴雨，局地降雨量可能超过200毫米；降雨对流明显，部分地区1小时雨量可达70毫米以上或6小时雨量可达100毫米以上。山区及浅山区有出现山洪、泥石流、滑坡等次生灾害的风险，低洼地区有积水风险。(央视新闻)", "ctime": 1787630041, "time_str": "11:54:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260825/c679257838.shtml"}, {"id": "5019391", "title": "民营商业航天新突破 卫星研制到发射全链条首次出口东南亚", "content": "北京时间2026年8月25日11时21分，长征六号丙遥一运载火箭在太原卫星发射中心发射升空，将中科卫星14星、中科卫星15星、银河航天灵知09泰国立方星等7颗卫星顺利送入预定轨道，飞行试验任务取得圆满成功。其中，银河航天灵知09泰国立方星(GISTDA Cube Sat 1)由银河航天抓总研制，用户方为泰国地理信息与空间技术发展局(GISTDA)，主要用于为泰方提供国土、农业、生态等地表遥感数据收集服务，以及支撑泰国高校开展卫星设计研制、航天测控、遥感应用等方向的实践教学。这是中国商业航天卫星企业首次面向东南亚国家完成整星研制、发射及在轨交付，证明中国商业航天企业已具备面向海外客户提供交付、运营、教学一体化的完整解决方案能力。当前，海外业务正成为中国商业航天企业新的拓展方向之一，此前商业航天领域此前鲜有民营企业直接开展整星出口业务。 (央视财经)", "ctime": 1787629878, "time_str": "11:51:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260825/c679257806.shtml"}, {"id": "5019385", "title": "蓝思科技：运动相机组装业务两个项目已进入量产爬坡阶段", "content": "蓝思科技8月23日在电话会议上表示，公司报告期内新增国际知名客户运动相机组装业务，目前两个项目已进入量产爬坡阶段，另有新的NPI项目正在验证导入，预计年内实现量产。上述新型摄影消费电子产品市场渗透率快速提升，出货量大幅增长，公司大规模、高精度的自动化产线显著提 re": false, "source": "", "url": "https://news.10jqka.com.cn/20260825/c679257629.shtml"}, {"id": "5019337", "title": "日经225指数收复早前失地，现涨0.5%", "content": "日经225指数收复早前失地，现涨0.5%，报65837.27点。", "ctime": 1787628921, "time_str": "11:35:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260825/c679257427.shtml"}, {"id": "5019335", "title": "A股午评：创业板指震荡下挫跌1.43% 三市成交额较上日同期缩量2255亿元", "content": "截至午盘，上证指数跌0.15%，深证成指跌0.78%，创业板指跌1.43%，北证50涨0.7%。三市成交额11552亿元，较上日同期缩量2255亿元。全市场超3600只个股上涨。\n板块题材上，粮食概念、小家电、跨境支付板块涨幅居前；贵金属、电子化学品、半导体板块跌幅居前。\n盘面上，粮食概念大幅走强，登海种业2连板，万向德农、金健米业涨停，秋乐种业、神农种业、康农种业、京粮控股、天禾股份跟涨。小家电板块震荡走高，石头科技涨停，奥佳华、欧伦电气、莱克电气、倍益康、德尔玛跟涨。跨境支付板块表现强势，楚天龙3连板，凯撒旅业、新晨科技涨停，科蓝软件、艾融软件涨超10%，飞天诚信、中油资本、拉卡拉、华峰超纤、信雅达跟涨。贵金属板块大幅走弱，西部黄金、兴业银锡、招金黄金跌超7%，湖南白银、晓程科技跟跌。电子化学品震荡走弱，兴福电子跌近&%，奥来德、三孚新科、中巨芯、天承科技跟跌。半导体板块低开震荡，康希通信跌近9%，江丰电子、有研硅、微导纳米、臻宝科技跟跌。", "ctime": 1787628863, "time_str": "11:34:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260825/c679257398.shtml"}, {"id": "5019333", "title": "深圳：1—7月规模以上工业增加值同比增长9.2%", "content": "据深圳统计局，1—7月，深圳市规模以上工业增加值同比增长9.2%，比上半年加快0.5个百分点。分门类看，采矿业增加值同比增长3.3%，制造业增长9.9%，电力、热力、燃气及水生产和供应业增长3.3%。主要行业大类中，专用设备制造业增长14.4%，通用设备制造业增长14.3%，计算机、通信和其他电子设备制造业增长12.7%，电力、热力生产和供应业增长9.1%。高技术产品产量保持快速增长，其中，3D打印设备、工业机器人、锂离子电池产品产量分别增长62.3%、45.5%、27.1%。", "ctime": 1787628835, "time_str": "11:33:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260825/c679257390.shtml"}, {"id": "5019329", "title": "ETF午评：港股通医疗ETF领涨3.11%，有色ETF领跌5.33%", "content": "ETF午间收盘涨跌不一，港股通医疗ETF（159137）领涨3.11%，港股医疗ETF（159366）涨2.61%，纳指科技ETF（159509）涨2.57%，有色ETF（159049）领跌5.33%，科创100ETF（589270）跌4.57%，黄金股ETF（517520）跌4.36%。", "ctime": 1787628727, "time_str": "11:32:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260825/c679257297.shtml"}, {"id": "5019325", "title": "ETF两市成交额报2902.16亿元，较昨日此时缩量531.65亿元", "content": "截至目前，ETF两市成交额报2902.16亿元，较昨日此时缩量531.65亿元，分类型来看，股票型ETF成交额832.35亿元，债券型ETF成交额1493.58亿元，货币型ETF成交额105.77亿元，商品型ETF成交额130.41亿元，QDII型ETF成交额340.06亿元。", "ctime": 1787628704, "time_str": "11:31:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260825/c679257293.shtml"}, {"id": "5019315", "title": "股指期货早盘收盘 主力合约多数下跌", "content": "股指期货早盘收盘，主力合约多数下跌。沪深300股指期货(IF)主力合约跌0.12%，上证50股指期货(IH)主力合约跌0.01%，中证500股指期货(IC)主力合约跌0.17%，中证1000股指期货(IM)主力合约涨0.15%。", "ctime": 1787628620, "time_str": "11:30:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260825/c679257269.shtml"}, {"id": "5019309", "title": "越南VN指数上涨1%", "content": "越南VN指数上涨1%至1806.69点。", "ctime": 1787628418, "time_str": "11:26:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260825/c679257177.shtml"}, {"id": "5019305", "title": "保时捷与印度最大IT服务公司达成12.5亿欧元AI部署合作协议", "content": "保时捷与印度最大的信息技术服务公司塔塔咨询服务公司（TCS）签署了一份为期五年的合作协议，协议金额达12.5亿欧元（约14.6亿美元），用于人工智能领域的合作。TCS将建立一个专门的中心，负责监督保时捷公司的人工智能技术应用。作为协议的一部分，保时捷将将其信息技术咨询业务转让给TCS，转让金额约为3.2亿欧元。（财联社）", "ctime": 1787628325, "time_str": "11:25:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260825/c679257166.shtml"}, {"id": "5019303", "title": "人大常委会：农业法修订草案二审稿拟完善支持农业和农村经济发展措施", "content": "农业法修订草案二审稿25日提请十四届全国人大常委会第二十四次会议审议。草案二审稿拟完善支持农业和农村经济发展措施。农业法修订草案今年4月首次提请全国人大常委会会议审议，会后征求社会公众意见。经征求多方意见建议，形成了此次提请审议的草案二审稿。有的常委会组成人员和地方、部门建议，完善支持农业和农村经济发展的措施。对此，草案二审稿增加规定，包括统筹发展科技农业、绿色农业、质量农业、品牌农业；维护种业安全，提升种业现代化水平；提高农业保险保障水平和服务质量；鼓励物联网、人工智能等新技术与农业生产、经营、管理相融合。加强乡村建设和治理，对农业和农村经济发展至关重要。草案二审稿增加规定，国家加强乡村治理，推进平安乡村建设，构建和谐有序的乡村社会，不断增强广大农民的获得感、幸福感、安全感。为落实整治形式主义为基层减负的要求，草案二审稿增加各级人民政府应当建立健全整治形式主义为基层减负长效机制的规定。此外，草案二审稿还规定国家坚持平等互利、合作共赢的方针，支持开展农业领域的国际交流与合作，积极参与农业可持续发展与粮食安全国际治理。（新华社）", "ctime": 1787628180, "time_str": "11:23:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260825/c679257129.shtml"}, {"id": "5019299", "title": "南宁市发布通告：受洪水影响 部分区域进入紧急防汛期", "content": "8月25日，广西南宁市应急管理委员会发布通告，根据上游左右江最新水情分析，郁江南宁市城区南宁水文站将于8月27日2时前后出现75.5米左右的洪峰水位，超警戒水位（警戒水位73.0米）2.5米，防汛安全形势严峻。为确保人民群众生命财产安全，根据《中华人民共和国防洪法》《中华人民共和国防汛条例》及《南宁市防汛抗旱应急预案》等法律法规及有关规定，南宁市应急管理委员会经研究决定，自2026年8月25日9时起宣布受洪水影响部分区域进入紧急防汛期。（央视新闻）", "ctime": 1787628090, "time_str": "11:21:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260825/c679257107.shtml"}, {"id": "5019297", "title": "农业法修订草案二审稿拟完善支持农业和农村经济发展措施", "content": "农业法修订草案二审稿25日提请十四届全国人大常委会第二十四次会议审议。草案二审稿拟完善支持农业和农村经济发展措施。 农业法修订草案今年4月首次提请全国人大常委会会议审议，会后征求社会公众意见。经征求多方意见建议，形成了此次提请审议的草案二审稿。 有的常委会组成人员和地方、部门建议，完善支持农业和农村经济发展的措施。对此，草案二审稿增加规定，包括统筹发展科技农业、绿色农业、质量农业、品牌农业；维护种业安全，提升种业现代化水平；提高农业保险保障水平和服务质量；鼓励物联网、人工智能等新技术与农业生产、经营、管理相融合。 加强乡村建设和治理，对农业和农村经济发展至关重要。草案二审稿增加规定，国家加强乡村治理，推进平安乡村建设，构建和谐有序的乡村社会，不断增强广大农民的获得感、幸福感、安全感。(新华社)", "ctime": 1787628049, "time_str": "11:20:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260825/c679257087.shtml"}, {"id": "5019273", "title": "霍尔木兹海峡通行商船数量降至3个多月以来新低", "content": "船舶追踪机构克普勒公司最新数据显示，24日通过霍尔木兹海峡的商船数量降至3个多月以来最低水平。(新华社)", "ctime": 1787627733, "time_str": "11:15:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260825/c679256927.shtml"}, {"id": "5019271", "title": "优必选等在常州成立新公司 注册资本5000万", "content": "天眼查App显示，近日，常州常高新智采科技有限公司成立，法定代表人为徐理翔，注册资本5000万人民币，经营范围含大数据服务、人工智能公共数据平台、人工智能行业应用系统集成服务、智能机器人的研发、智能机器人销售等，由常州高新数运科技有限公司、深圳市优必选科技股份有限公司、道之森智能科技（常州）有限公司共同持股。", "ctime": 1787627683, "time_str": "11:14:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260825/c679256904.shtml"}, {"id": "5019267", "title": "亚马逊大幅上调硬件设备零售价 部分产品涨幅高达60%", "content": "据财联社，消费电子涨价潮迎来新的参与者。亚马逊在上周末大幅提高了其硬件设备的价格，部分商品涨幅高达60%。亚马逊旗下最受欢迎的电子产品，包括流媒体设备Fire TV、智能音响Echo、电子书阅读器Kindle和路由器品牌Eero都调整了价格。其中，亚马逊的平价智能音响Echo Dot价格从49.99美元上涨至79.99美元，涨幅高达60%。亚马逊发言人对此解释称，消费电子行业正面临内存和存储组件成本大幅上涨的问题。亚马逊在尽可能地消化这些成本上涨之后，调整了旗下所有产品线的价格。", "ctime": 1787627555, "time_str": "11:12:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260825/c679256881.shtml"}, {"id": "5019245", "title": "南向资金净卖出超20亿港元", "content": "据同花顺iFinD数据，截至目前，南向资金净卖出超20亿港元，其中港股通（沪）卖出超12.11亿港元，港股通（深）卖出超7.93亿港元。", "ctime": 1787627308, "time_str": "11:08:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260825/c679256798.shtml"}, {"id": "5019237", "title": "国家能源局：截至7月底全国累计发电装机容量40.8亿千瓦，同比增长11.0%", "content": "8月25日，国家能源局发布1-7月份全国电力统计数据。截至7月底，全国累计发电装机容量40.8亿千瓦，同比增长11.0%。其中，太阳能发电装机容量12.9亿千瓦，同比增长16.1%；风电装机容量6.9亿千瓦，同比增长19.5%。1-7月份，全国发电设备累计平均利用1671小时，比上年同期降低135小时。", "ctime": 1787627155, "time_str": "11:05:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260825/c679256759.shtml"}, {"id": "5019229", "title": "医药流通板块短线拉升", "content": "医药流通板块短线拉升，人民同泰涨停，合富中国、开开实业、鹭燕医药、药易购、建发致新等纷纷走高。", "ctime": 1787626939, "time_str": "11:02:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260825/c679256719.shtml"}, {"id": "5019225", "title": "伊朗货币里亚尔汇率跌至历史新低", "content": "据美联社报道，美国财政部长贝森特公布对伊朗实施“经济孤立”新措施数小时前，伊朗货币里亚尔对美元汇率跌至历史新低。(新华社)", "ctime": 1787626889, "time_str": "11:01:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260825/c679256703.shtml"}, {"id": "5019215", "title": "上海银行间同业拆放利率(Shibor)多数上涨", "content": "隔夜shibor报1.4350%，上涨1.60个基点；7天shibor报1.4535%，上涨2.15个基点；14天shibor报1.4420%，上涨1.20个基点；1月shibor报1.4178%，上涨0.03个基点；3月shibor报1.4300%，与前一交易日持平。", "ctime": 1787626835, "time_str": "11:00:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260825/c679256681.shtml"}, {"id": "5019213", "title": "TrendForce：DDR5 16Gb (2Gx8) 4800/5600现货均价较上日持平", "content": "TrendForce数据显示，8月25日内存颗粒DDR5 16Gb (2Gx8) 4800/5600现货均价较上日持平，DDR4 16Gb (2Gx8) 3200现货均价较上日下跌0.83%，DDR4 8Gb (1Gx8) 3200现货均价较上日上涨0.21%。", "ctime": 1787626812, "time_str": "11:00:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260825/c679256676.shtml"}, {"id": "5019209", "title": "Needham将SK海力士目标价格从200美元上调至220美元", "content": "Needham将SK海力士目标价格从200美元上调至220美元。（财联社）", "ctime": 1787626787, "time_str": "10:59:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260825/c679256665.shtml"}, {"id": "5019203", "title": "律师法修改拟明确鼓励支持律师依法提供法律援助", "content": "8月25日，律师法修正草案提请十四届全国人大常委会第二十四次会议二次审议。草案与法律援助法相衔接，鼓励和支持律师事务所、律师参与公益法律服务，依法提供法律援助。草案规定，国家积极发展涉外法律服务业，加强涉外律师人才培养，支持律师事务所提升涉外法律服务能力水平，鼓励律师行业加强国际交流合作，维护当事人的合法权益，服务高质量发展和高水平对外开放。草案还提出，律师依法执业受法律保护，任何组织和个人不得侵害律师的合法权益。人民法院、人民检察院、公安机关、国家安全机关、司法行政部门和有关单位应当建立健全律师执业权利保障制度，在职责范围内依法保障律师执业权利。（新华社）", "ctime": 1787626642, "time_str": "10:57:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260825/c679256592.shtml"}, {"id": "5019185", "title": "现货黄金失守4620美元/盎司 纽约期金失守4680美元/盎司", "content": "现货黄金失守4620美元/盎司，日内跌0.73%。纽约期金失守4680美元/盎司，日内跌0.58%。", "ctime": 1787626318, "time_str": "10:51:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260825/c679256472.shtml"}, {"id": "5019183", "title": "广期所碳酸锂主力合约大跌5%", "content": "广期所碳酸锂主力合约大跌5%，报152000元/吨。", "ctime": 1787626271, "time_str": "10:51:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260825/c679256453.shtml"}, {"id": "5019177", "title": "沪深京三市成交额超1万亿元，较上日此时缩量1672亿元", "content": "据同花顺iFinD数据，沪深京三市成交额超1万亿元，较上日此时缩量1672亿元，预计全天成交金额约1.7万亿元。截至目前，沪市成交额4738亿元，深市成交额5196亿元，北证50成交额70亿元。", "ctime": 1787626204, "time_str": "10:50:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260825/c679256415.shtml"}, {"id": "5019163", "title": "印度解除小麦出口禁令", "content": "当地时间24日，印度对外贸易总局宣布将小麦出口政策从“禁止”改为“自由”，该国长达四年的小麦出口禁令被解除。作为世界第二大小麦生产国，印度从2022年5月开始禁止小麦出口，以控制国内价格并保护粮食安全。（央视新闻）", "ctime": 1787626019, "time_str": "10:46:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260825/c679256314.shtml"}, {"id": "5019137", "title": "字节跳动发布豆包工作，与飞书深度打通构建企业级Agent", "content": "豆包工作正式发布。作为豆包面向生产力场景推出的全新Agent产品与品牌，豆包工作能围绕用户目标自主拆解任务、调用工具、持续推进复杂工作流程。豆包工作还与飞书深度打通，让Agent基于企业上下文更准确地完成工作。目前，豆包工作电脑版已可通过官网下载，用户也可在最新豆包电脑版中直接使用。即日起下载登录或升级，便可免费领取30天订阅权益。(新浪科技)", "ctime": 1787625688, "time_str": "10:41:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260825/c679256104.shtml"}, {"id": "5019131", "title": "蓝思科技：下半年开始折叠机项目上将显著受益于大客户新机型发布", "content": "蓝思科技8月23日在电话会议上表示，展望后续，公司在主营业务、AI端侧和AI算力侧几个板块都即将迎来业绩共振。今年下半年开始，主营业务方面在大客户今年的折叠机项目上，公司供应UTG玻璃、CPI膜、UTG玻璃支撑板、3D玻璃盖板等，上述产品加工难度大，价值量大幅提升，公司成为折叠机型相比直板机型结构件增量的最大受益者。公司强大的全球交付能力和量产能力确保公司市场份额，公司将显著受益新机型的发布。展望明年，大客户折叠屏全面放量，公司长期深度研发的钛框和3D打印、3D玻璃在高端机型全面采用，为公司未来几年提供显著业绩贡献。（人民财讯）", "ctime": 1787625636, "time_str": "10:40:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260825/c679256076.shtml"}, {"id": "5019121", "title": "国家公共数据资源登记平台已登记量超30万项", "content": "记者今天从国家数据局了解到，截至目前，国家公共数据资源登记平台上已登记的数据资源、产品和服务超过30万项，覆盖全部国民经济97个大类。供数方可以在平台上发布公共数据资源，用数方则可以在平台上查找资源、发布需求，从而完成供需对接。（央视新闻）", "ctime": 1787625482, "time_str": "10:38:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260825/c679255954.shtml"}, {"id": "5019117", "title": "国家数据局发布新一批50个公共数据“跑起来”示范场景", "content": "记者今天从国家数据局了解到，新一批50个公共数据“跑起来”示范场景发布，促进公共数据在场景应用中释放价值。公共数据，一般是指各级党政机关、企事业单位在依法履职或提供公共服务过程中产生的数据。本次是国家数据局发布第五批公共数据“跑起来”示范场景，包括交通运行数据促进物流优化、卫星遥感数据辅助减灾防灾、医疗卫生数据加速新药研发等。国家数据局副局长陈荣辉表示，交通运输、社会管理、医疗健康、应急管理等重点领域占比较高，达到32%。中宣部、民政部、住建部等12个部委以及新疆生产建设兵团等单位均为首次参与申报，充分说明深化公共数据资源开发利用，已成为各部门、各地方的广泛共识和迫切需求。（央视新闻）", "ctime": 1787625450, "time_str": "10:37:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260825/c679255923.shtml"}, {"id": "5019115", "title": "台风“沙德尔”强度有变 已进入48小时警戒线", "content": "今天（25日）早上，今年第18号台风“沙德尔”已进入我国台风48小时警戒线，目前已由超强台风级减弱为强台风级，中心附近最大风力15级（48米/秒）。中央气象台8月25日06时继续发布台风黄色预警：预计，“沙德尔”将以每小时20~25公里的速度向西偏北方向移动，强度变化不大，26日进入东海后逐渐转向西偏南方向移动，并向浙闽一带沿海靠近。今年第19号台风“紫檀”（热带风暴级）的中心今天早晨5点钟位于广西北海市南偏西方向约250公里的北部湾海面上，就是北纬19.5度、东经108度，中心附近最大风力有9级（23米/秒）。记者今天从海南省气象台了解到，预计，台风“紫檀”先向偏东方向移动，强度维持，将从海南昌江到临高一带近海擦过或登陆，尔后北上趋向桂粤沿海地区。（央视新闻）", "ctime": 1787625442, "time_str": "10:37:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260825/c679255916.shtml"}, {"id": "5019107", "title": "新洋丰与全国农技中心签署新一期五年合作协议", "content": "8月22—23日，第二十七届全国肥料信息交流暨产品交易会在内蒙古呼和浩特举办。在大会集中签约活动中，全国农业技术推广服务中心与新洋丰举行新一期五年合作协议签约仪式。此次签约标志着双方战略合作进入第三个五年周期（2026—2030年）。新一期合作将重点聚焦“增肥效·提单产”示范工程，深化新型肥料试验示范、科学施肥、技术培训与绿色种植推广等工作。（人民财讯）", "ctime": 1787625389, "time_str": "10:36:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_sh const SECTORS  = [{"name": "金融", "hit_count": 35, "etfs": []}, {"name": "数据要素", "hit_count": 29, "etfs": []}, {"name": "人工智能", "hit_count": 23, "etfs": []}, {"name": "半导体", "hit_count": 18, "etfs": []}, {"name": "消费", "hit_count": 15, "etfs": []}, {"name": "军工", "hit_count": 9, "etfs": []}, {"name": "新能源", "hit_count": 9, "etfs": []}, {"name": "医药", "hit_count": 7, "etfs": []}];
const META     = {"update_time": "2026-08-25 12:07:09", "sentiment_score": 55.333333333333336, "agents": []};

// 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
