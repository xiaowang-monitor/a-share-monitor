<style>
:root {
  --bg-primary: #0a0e17;

* { margin:0; padding:0; box-sizing:border-box; }

  background: var(--bg-primary);
  color: var(--text-primary);
  min-height: 100vh;
}
.mono { font-family: 'JetBrains Mono', monospace; }
.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 20px;
  transition: all 0.2s;
}
.card:hover { background: var(--bg-card-hover); border-color: #334155; }
.badge {
  display: inline-flex; align-items: center; padding: 2px 8px;
  border-radius: 6px; font-size: 12px; font-weight: 500;
}
.badge-s { background: rgba(239,68,68,0.2); color: #ef4444; }
.badge-a { background: rgba(245,158,11,0.2); color: #f59e0b; }
.badge-b { background: rgba(59,130,246,0.2); color: #3b82f6; }
.badge-c { background: rgba(100,116,139,0.2); color: #94a3b8; }
.score-bar {
  height: 6px; border-radius: 3px; background: #1e293b; overflow: hidden;
}
.score-bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s; }
.up { color: var(--red); }
.down { color: var(--green); }
.pulse { animation: pulse 2s infinite; }
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}
.glow { box-shadow: 0 0 20px rgba(59,130,246,0.15); }
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg-primary); }
::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
</style>

              <th class="text-right py-2 px-1">板块</th>
              <th class="text-right py-2 px-1">连涨</th>
            </tr>
          </thead>
          <tbody id="picks-table"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- 新闻流 + 交易代理 -->
<div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
  <div class="card">
    <h2 class="text-sm font-medium text-gray-400 mb-4">实时新闻流</h2>

</div>

const NEWS     = [{"id": "5597273", "title": "伊朗最高领袖法尔斯省代表呼吁审视核与威慑政策", "content": "伊朗最高领袖驻法尔斯省代表洛特福拉·德日卡姆周五以面临军事威胁为由，呼吁重新审议伊朗的核政策与威慑政策。他在设拉子的主麻日礼拜上称，伊朗已拥有制造核武器的技术能力，并提出当前威胁形势是否需要调整核政策，决定权在最高领袖穆杰塔巴·哈梅内伊手中。他还呼吁发展伊朗导弹能力，并表示若遭遇袭击，伊朗的反击将即时发起且不受地域限制。（新浪财经）", "ctime": 1793963718, "time_str": "19:15:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261106/c681566271.shtml"}, {"id": "5597215", "title": "爱彼迎 Airbnb 计划明年推出 AI 智能体，帮助用户规划旅行", "content": "民宿出租平台 Airbnb 爱彼迎在 2026 财年第三季度报告中透露，公司正开发全新 AI 智能体，计划 2027 年推出，可帮助用户规划旅行。Airbnb 表示：“我们的智能体并没有采用传统聊天窗口，而是调用带有数百种旅行专用界面元素的资源库，它包含地图、照片、对比信息、日历和行程安排，可根据用户需求实时组合。它将帮助房客探索不同选择，与同行者共同作出决定，最终直接在 Airbnb 完成预订。”", "ctime": 1793963505, "time_str": "19:11:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261106/c681565836.shtml"}, {"id": "5597211", "title": "国际复材：拟投资11.58亿元建设高性能电子纤维布项目", "content": "国际复材公告，公司于2026年11月5日召开董事会，审议通过《关于建设高性能电子纤维布（龙山）项目的议案》，同意公司投资11.58亿元建设高性能电子纤维布（龙山）项目，其中建设投资11.26亿元，铺底流动资金2023.6万元，建设期利息1215.9万元。项目为新建，建设地点为重庆市长寿经济技术开发区龙山路1号，生产规模为年产1.11亿米电子级玻璃纤维布，建设期限为2026年11月至2027年9月，资金来源为自有资金及银行贷款。本次投资事项在董事会审批权限内，无需提交股东会审议。", "ctime": 1793963481, "time_str": "19:11:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261106/c681565801.shtml"}, {"id": "5597205", "title": "东芯股份：控股股东东方恒信首次增持19万股，增持金额1026.75万元", "content": "东芯股份公告，控股股东东方恒信集团有限公司此前披露增持计划，拟自2026年10月31日起6个月内，通过集中竞价交易方式增持公司股份，增持总金额不低于4亿元（含）且不高于6亿元（含）。2026年11月5日，东方恒信首次增持公司A股股份19万股，占公司总股本0.0289%，增持金额合计为1026.75万元（不含手续费）。本次增持计划尚未实施完毕，增持主体将继续按照相关增持计划，在增持计划实施期间内增持公司股份。", "ctime": 1793963474, "time_str": "19:11:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261106/c681565777.shtml"}, {"id": "5597177", "title": "比利时国王拒绝接受首相辞呈 要求立即恢复预算谈判", "content": "当地时间11月6日，比利时王室发表公告称，国王菲利普在王宫会见首相德韦弗，并在此前与执政联盟五个政党主席会谈后，决定拒绝接受德韦弗此前提交的辞呈，要求其立即恢复预算谈判。各党均希望尽快结束预算谈判并就未来三年稳健预算规划达成协议，五个政党主席承诺愿意作出必要让步以推动执政联盟内部达成一致。国王强调预算谈判需在维护社会凝聚力与促进经济增长间寻求合理平衡。德韦弗将重新启动预算谈判，并于11月16日再次向国王汇报进展。（央视新闻）", "ctime": 1793963361, "time_str": "19:09:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261106/c681565461.shtml"}, {"id": "5597161", "title": "欧洲又有客机遭炸弹威胁", "content": "据意大利方面6日消息，罗马菲乌米奇诺机场塔台当天接到一通匿名电话，称一架从捷克布拉格飞往罗马的客机上有爆炸装置。该航班原定飞抵罗马，后改道降落威尼斯。目前，警方正对飞机进行安全排查。（央视新闻）", "ctime": 1793963298, "time_str": "19:08:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261106/c681565384.shtml"}, {"id": "5597137", "title": "*ST启环：桑德投资所持4919.6万股被拍卖完成过户，持股比例降至0.0003%", "content": "*ST启环公告，公司持股5%以上股东桑德集团及其一致行动人桑德投资合计持有的50713780股股份此前被公开拍卖，拍卖成交价8621.34万元。公司于2026年11月6日查询获悉，其中49196000股已完成过户登记。本次权益变动后，桑德投资持股由49200773股（3.45%）降至4773股（0.0003%），桑德集团持股维持53137780股（3.73%），二者合计持股由1.02亿股（7.18%）降至53142553股（3.7303%）。本次变动不会导致公司控股股东及实际控制人发生变化。", "ctime": 1793963235, "time_str": "19:07:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261106/c681565309.shtml"}, {"id": "5597131", "title": "登康口腔：重百集团减持计划实施完毕，累计减持298.77万股", "content": "登康口腔公告，公司股东重庆重百科技集团股份有限公司（重百集团）此前计划以集中竞价交易和大宗交易方式合计减持不超过298.77万股（占公司总股本比例1.74%）。近日公司收到重百集团告知函，其于2026年10月8日至2026年11月5日期间通过集中竞价及大宗交易方式减持公司股份298.77万股，占公司总股本比例1.74%，本次减持计划实施完毕。减持价格区间为30.5元/股至33.17元/股。本次减持后，重百集团不再持有公司股份，亦不再是公司间接控股股东重庆轻纺控股（集团）公司的一致行动人；公司控股股东、实际控制人未发生变更。", "ctime": 1793963210, "time_str": "19:06:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261106/c681565300.shtml"}, {"id": "5597113", "title": "俄方称俄涉嫌攻击欧洲冷柜说法荒谬无稽", "content": "俄罗斯总统新闻秘书佩斯科夫在5日例行新闻发布会上表示，有关俄罗斯涉嫌参与对部分欧洲超市的冷藏设备发动黑客攻击的指控荒谬无稽。 有西方媒体称，近期欧洲地区部分超市的冷藏设备遭网络攻击“似乎是两个为俄效力的黑客团体所为”。对此，佩斯科夫表示，这些说法荒诞不经，且一如既往地未经任何论证，拿不出任何证据。“遗憾的是，这种诬告在一些欧洲国家渐成惯常。” 据今日俄罗斯通讯社报道，近日比利时、爱尔兰、瑞典、卢森堡等国的部分超市冷藏设备受到网络攻击，不法分子控制了这些设备并开启解冻模式，在某些情况下冷柜的温度被升到超过50摄氏度，导致食品变质。有欧洲国家的媒体称，这些网络攻击可能与两个为俄罗斯效力的黑客团体有关。截至目前，相关调查机构对这些事件究竟由谁所为尚没有明确说法。(新华社)", "ctime": 1793963172, "time_str": "19:06:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261106/c681565275.shtml"}, {"id": "5597079", "title": "上交所对浙文影业予以监管警示", "content": "上交所发布关于浙文影业集团股份有限公司有关股价波动事项的监管工作函。浙文影业因股价波动事项被监管关注。监管工作函涉及对象为上市公司。", "ctime": 1793963052, "time_str": "19:04:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261106/c681565217.shtml"}, {"id": "5597019", "title": "格鲁吉亚央行10月斥资4亿美元购入货币黄金", "content": "格鲁吉亚央行10月斥资4亿美元购入货币黄金，截至10月末，该行货币黄金价值达13.65亿美元，占格鲁吉亚国际储备总额的16.6%。央行表示，购金目的是实现储备多元化，抵御全球金融市场波动。", "ctime": 1793962904, "time_str": "19:01:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261106/c681565134.shtml"}, {"id": "5596921", "title": "顶配价格超11万元苹果首款触控版MacBook Pro开售即“破发”", "content": "苹果首款触控版MacBook Pro正式开售，售价22999元起，成为苹果继iPhone Duo后的又一款高价新品。但正式发售当日，记者发现该产品已在部分电商渠道“破发”。（第一财经）", "ctime": 1793962740, "time_str": "18:59:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261106/c681564747.shtml"}, {"id": "5596903", "title": "国家药监局批准泊基奥仑赛注射液上市", "content": "国家药品监督管理局近日批准北京艺妙神州生物医药股份有限公司申报的泊基奥仑赛注射液（商品名：赛泊华）上市，用于治疗经过二线或以上系统性治疗后成人复发或难治性大B细胞淋巴瘤患者，包括弥漫性大B细胞淋巴瘤非特指型、3b级滤泡性淋巴瘤和高级别B细胞淋巴瘤。", "ctime": 1793962618, "time_str": "18:56:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261106/c681564694.shtml"}, {"id": "5596821", "title": "日本关东地区东部近海发生6.1级地震", "content": "据日本气象厅公布的数据，当地时间6日19时39分左右，日本关东地区东部近海发生6.1级地震， ock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261106/c681564373.shtml"}, {"id": "5596729", "title": "恒工精密：京津冀基金减持84.88万股，持股比例降至4.99999%", "content": "恒工精密公告，持股5%以上股东京津冀产业协同发展投资基金（有限合伙）实施已披露的减持计划，于2026年10月20日至2026年11月6日期间通过集中竞价方式减持公司股份84.88万股，占公司总股本的0.80483%。本次权益变动后，京津冀基金持有公司股份数量由612.22万股减少至527.34万股，占公司总股本比例由5.80482%降至4.99999%，不再是公司持股5%以上股东。京津冀基金不是公司控股股东或实际控制人，本次权益变动不会导致公司控制权发生变化。截至公告披露日，京津冀基金本次减持计划尚未全部实施完毕。", "ctime": 1793961711, "time_str": "18:41:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261106/c681564369.shtml"}, {"id": "5596649", "title": "沪电股份：董事长提议以5亿元-10亿元回购公司股份", "content": "沪电股份公告，公司董事会于2026年11月6日收到董事长陈梅芳女士出具的《关于提议沪士电子股份有限公司回购公司股份的函》，陈梅芳女士提议公司通过深圳证券交易所交易系统以集中竞价交易方式回购公司已发行的部分人民币普通股（A股）股票。本次回购的资金总额不低于人民币5亿元（含）且不超过人民币10亿元（含），回购股份的价格区间为不高于董事会审议通过股份回购决议前30个交易日公司股票交易均价的150%，回购股份将用于员工持股计划或股权激励、减少注册资本或用于维护公司价值及股东权益，具体以董事会或股东会审议通过的回购股份方案为准。提议人在提议前6个月内不存在买卖公司股份的情况，并承诺将积极推动公司尽快召开董事会审议回购股份事项，并在公司董事会上对回购股份事项投赞成票。", "ctime": 1793961335, "time_str": "18:35:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261106/c681564204.shtml"}, {"id": "5596635", "title": "研究显示美企AI模型能力加速提升", "content": "美国模型评估和威胁研究组织5日发布的一份报告显示，美国Anthropic公司的人工智能（AI）模型近期在执行特定任务上的能力提升速度可能达到此前的约两倍。而该公司首席执行官达里奥·阿莫代伊今年9月曾公开呼吁放缓前沿AI技术发展速度，以便安全防范措施跟上技术发展步伐。模型评估和威胁研究组织的研究人员于今年8月至10月对Anthropic公司开展了约11周的独立评估。结果显示，截至10月底，Anthropic公司模型在执行定义明确任务上的能力提升速度可能约为2024年3月至2025年10月期间的两倍。", "ctime": 1793961138, "time_str": "18:32:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261106/c681564117.shtml"}, {"id": "5596629", "title": "金融监管总局党委书记、局长丁向群带队赴河北调研", "content": "金融监管总局消息，金融监管总局党委书记、局长丁向群2026年11月5日带队赴河北调研，在河北金融监管局及有关分局、支局宣讲党的二十届五中全会精神，听取工作意见建议，并看望慰问基层监管干部。围绕地方中小金融机构改革化险、加强央地协同等问题，与省委省政府主要负责同志交流座谈。", "ctime": 1793961028, "time_str": "18:30:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261106/c681564063.shtml"}, {"id": "5596621", "title": "英伟达价值1140万美元货物在美国加州被盗", "content": "美国加州奥克兰警方正在调查发生在东奥克兰的英伟达计算机硬件被盗案，该盗窃案涉及价值1140万美元（约合人民币7605万元）的英伟达货物，这些货物由一辆被认定为食品运输公司的卡车按计划接走，在离开奥克兰前往德克萨斯的途中消失。(新浪财经)", "ctime": 1793960953, "time_str": "18:29:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261106/c681563962.shtml"}, {"id": "5596611", "title": "以总理回应美拟停止军援 称美以军事关系向“伙伴关系”转变", "content": "当地时间6日，以色列总理办公室通过社交媒体账号首次对美国拟停止向以色列提供安全援助作出正式回应，称总理内塔尼亚胡与美国总统特朗普正推动双边军事关系从“援助关系”向“伙伴关系”转变。声明称，美国对以色列的军事援助一直是一项跨党派共识，以色列此前利用该援助进行自卫，并对抗“威胁美国和西方的敌人”。鉴于以色列目前拥有强劲且稳定的经济，内塔尼亚胡与特朗普将美以军事援助关系调整为伙伴关系，既表明双边关系更加巩固和成熟，也体现双方关系随时间推移不断调适、保持稳固的能力。（央视新闻）", "ctime": 1793960878, "time_str": "18:27:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261106/c681563938.shtml"}, {"id": "5596607", "title": "交易商协会：加强债务融资工具账款信息披露有关事项", "content": "交易商协会进一步优化债务融资工具账款信息披露、加大融资支持力度，助力解决中小企业账款拖欠问题。发行人应在注册发行文件中披露近一年应付账款余额、占比及变动情况、主要账款及账期分布、应付账款周转天数等；涉及商业汇票及应收账款电子凭证的，披露金额及开立情况。发行人已按照《通知》要求采取压降账期、提高现金支付比例并及时支付、践行“60日付现承诺”等措施的，鼓励在注册发行文件中主动披露相关情况。对积极践行“60日付现承诺”、压减账期和账款规模成效明显且主动披露相关情况的企业，建立债务融资工具注册发行“绿色通道”，实行专人对接、即报即评，提升评议服务质效。", "ctime": 1793960812, "time_str": "18:26:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261106/c681563919.shtml"}, {"id": "5596605", "title": "欧洲股市震荡走低，德国DAX30指数日内跌幅达2%", "content": "欧洲股市震荡走低，德国DAX30指数日内跌幅达2%，至25,798.89点。英国富时100指数跌1.80%，法国CAC40指数跌1.27%，富时意大利MIB指数跌1.17%。", "ctime": 1793960754, "time_str": "18:25:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261106/c681563901.shtml"}, {"id": "5596587", "title": "信隆健康：控股股东一致行动人、董事廖哲宏拟增持不低于0.5%且不超过1%公司股份", "content": "信隆健康公告，公司控股股东利田发展有限公司的一致行动人、公司董事廖哲宏计划自公告披露之日起6个月内，通过国信证券（香港）资产管理有限公司-廖哲宏专户（RQFII）及个人A股证券账户，以集中竞价交易、大宗交易等方式增持公司股份，拟增持总股份数为不低于公司已发行股份总数的0.5%且不超过公司已发行股份总数的1%。本次增持不设定价格区间，资金来源为自有资金或自筹资金。截至公告披露日，廖哲宏合计持有公司股份权益1156.92万股，占公司已发行股份3.1589%；控股股东利田发展有限公司拥有公司股份权益1.53亿股，占公司已发行股份41.64%。", "ctime": 1793960508, "time_str": "18:21:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261106/c681563805.shtml"}, {"id": "5596585", "title": "ST京机：收到湖北证监局行政处罚决定书，公司被罚500万元", "content": "ST京机公告，公司及相关责任人于2026年11月6日收到中国证监会湖北监管局出具的《行政处罚决定书》。经查明，公司2018年年度报告存在虚假记载，虚增利润总额4670.46万元，占当期披露利润总额的25.49%，2021年非公开发行股票上市公告书引用了相关虚假财务数据。湖北证监局决定对公司给予警告并处以500万元罚款；对时任董事长兼总经理李健给予警告并处以250万元罚款；对时任副总经理曾涛给予警告并处以30万元罚款；对时任董事、高级副总裁周世荣给予警告并处以60万元罚款；对时任董事罗贤旭给予警告并处以50万元罚款。公司未触及重大违法强制退市情形，股票已被实施其他风险警示。", "ctime": 1793960502, "time_str": "18:21:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261106/c681563803.shtml"}, {"id": "5596567", "title": "盛弘股份：首次回购公司股份88900股，支付305.79万元", "content": "盛弘股份公告，公司此前审议通过回购公司股份方案，回购资金总额不低于人民币3000万元且不超过人民币6000万元，回购价格不超过人民币52.19元/股，回购股份用于实施公司员工持股计划及/或股权激励。2026年11月5日，公司首次通过回购专用证券账户以集中竞价交易方式回购公司股份88900股，占公司当前总股本比例为0.03%，最高成交价为34.98元/股，最低成交价为33.94元/股，成交总金额为人民币305.79万元（不含交易费用）。", "ctime": 1793960372, "time_str": "18:19:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261106/c681563709.shtml"}, {"id": "5596563", "title": "富满微：拟以5000万元-1亿元回购公司股份", "content": "富满微公告，拟以5000万元-1亿元回购公司股份，回购价格不超过70.78元/股。回购股份的用途为维护公司价值及股东权益（出售），公司如未能在股份回购完成之后三年内实施前述用途，未使用部分将履行相关程序后予以注销。按回购金额上限1亿元测算，预计回购股份数量141.28万股，约占当前公司总股本的0.63%；按回购金额下限5000万元测算，预计回购股份数量70.64万股，约占当前公司总股本的0.32%。回购期限为自董事会审议通过本次回购股份方案之日起不超过3个月。", "ctime": 1793960264, "time_str": "18:17:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261106/c681563642.shtml"}, {"id": "5596545", "title": "上交所：本周对119起拉抬打压、虚假申报等证券异常交易行为采取了自律监管措施", "content": "上交所发布监管公告，2026年11月2日至2026年11月6日，上交所公司监管部门共发送监管工作函10份；通过事中事后监管，要求上市公司披露补充、更正类公告4份。同时，加大信息披露和股价异常的联动监管，针对公司披露敏感信息或股价发生明显异常的，提请启动内幕交易、异常交易核查59单。上交所对119起拉抬打压、虚假申报等证券异常交易行为采取了自律监管措施，对31起上市公司重大事项等进行专项核查，向证监会上报涉嫌违法违规案件线索1起。", "ctime": 1793959940, "time_str": "18:12:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261106/c681563459.shtml"}, {"id": "5596525", "title": "华北制药：头孢拉定获化学原料药上市申请批准通知书", "content": "华北制药公告，公司近日收到国家药品监督管理局核准签发的头孢拉定《化学原料药上市申请批准通知书》，登记号Y20250000180，通知书有效期至2031年11月4日。该药品累计研发支出724.56万元（未经审计），通过现场GMP符合性检查后即可安排生产并上市销售。本次获批是对公司原料药产品的进一步补充，丰富产品线，不会对公司当期经营业绩产生重大影响。", "ctime": 1793959616, "time_str": "18:06:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261106/c681563264.shtml"}, {"id": "5596517", "title": "印度卢比兑美元汇率创下自10月12日以来最大单日涨幅", "content": "印度卢比兑美元汇率创下自10月12日以来最大单日涨幅。", "ctime": 1793959508, "time_str": "18:05:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261106/c681563198.shtml"}, {"id": "5596511", "title": "宁波港：2026年10月集装箱吞吐量同比增长5.6%", "content": "宁波港公告，2026年10月份，公司预计完成集装箱吞吐量482万标准箱，同比增长5.6%；预计完成货物吞吐量9856万吨，同比下降2.3%。", "ctime": 1793959481, "time_str": "18:04:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261106/c681563183.shtml"}, {"id": "5596507", "title": "杰瑞股份：董事长李志勇等三名高管拟增持股份，金额不低于1000万元且不超过1200万元", "content": "杰瑞股份公告，公司董事长李志勇、副总裁李慧涛、副总裁路伟计划自2026年11月9日起6个月内，使用自筹资金通过集中竞价方式增持公司股票，增持金额合计不低于1000万元且不超过1200万元。上述增持主体前次增持计划已于2026年5月27日至2026年11月6日期间实施完毕，累计增持公司股票66900股，成交金额合计930.93万元（不含交易费用）。本次增持计划不设价格区间。", "ctime": 1793959445, "time_s 告，公司董事会于2026年11月6日收到公司实际控制人、董事长李良彬先生《关于提议江西赣锋锂业集团股份有限公司回购公司股份的函》。李良彬提议公司使用自有资金和/或自筹资金以集中竞价交易方式回购公司已发行的部分人民币普通股（A股）股票，回购资金总额不低于人民币2亿元（含），不超过人民币4亿元（含），回购价格不高于公司董事会审议通过回购股份方案前30个交易日公司股票交易均价的150%，具体回购价格以董事会审议通过的回购股份方案为准。回购股份用于维护公司价值及股东权益，将在披露股份回购实施结果暨股份变动公告12个月后采用集中竞价交易方式全部出售，并在披露回购结果暨股份变动公告后3年内完成出售。", "ctime": 1793959314, "time_str": "18:01:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261106/c681563101.shtml"}, {"id": "5596441", "title": "亚振家居：持股5%以上股东亚振投资减持触及1%刻度，持股比例降至8.46%", "content": "亚振家居公告，持股5%以上股东上海亚振投资有限公司此前披露减持计划，拟于2026年10月9日至2027年1月6日期间减持不超过788.26万股，即不超过公司股份总数的3.00%。2026年11月2日至2026年11月5日，亚振投资通过大宗交易方式减持公司股份145.5万股，通过集中竞价方式减持公司股份260万股，持有公司股份从2627.52万股减至2222.02万股，持股比例从10.00%下降至8.46%，权益变动触及1%刻度。本次权益变动系实施此前披露的减持计划，不触及要约收购，不会导致公司控制权发生变化。", "ctime": 1793959152, "time_str": "17:59:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261106/c681563019.shtml"}, {"id": "5596419", "title": "北京：到2030年城镇住房总量保持稳定，供给结构与需求变化更加适配", "content": "北京市住房和城乡建设委员会近日印发《北京市“十五五”时期住房发展规划》。《规划》提出到2030年，城镇住房总量保持稳定，供给结构与需求变化更加适配，保障和市场相结合的供应体系更加完善，房地产市场运行持续平稳，租购并举住房制度持续健全，住房空间布局持续优化，职住商服功能更加融合，居住领域城市更新有力推进，更多家庭住上安全舒适绿色智慧的“好房子”。到2035年，推动实现更高水平的住有宜居，住房发展与人口、产业、土地、交通、生态等要素协同更加紧密。", "ctime": 1793958719, "time_str": "17:51:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261106/c681562707.shtml"}, {"id": "5596417", "title": "兰州银行：部分董事、高管等增持计划时间过半，已累计增持298.95万股", "content": "兰州银行公告，公司于2026年8月6日披露增持计划，董事长许建平、行长刘敏等部分董事、高级管理人员及中层管理人员拟以集中竞价方式合计增持金额不低于600万元。截至2026年11月5日，增持计划时间已过半，增持主体以自有资金累计增持公司股份298.95万股，占公司总股本的0.0525%，增持金额合计633.79万元，成交价格区间为每股2.05元至2.19元。本次增持计划尚未实施完毕，增持主体将继续按计划增持。", "ctime": 1793958688, "time_str": "17:51:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/2 // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片

  const sentimentScore = META.sentiment_score || 50;

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">

      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
