价成交", "content": "10月20日，长沙出让1宗岳麓区低密宅地，土地出让面积85500.62㎡（合128.25亩），规划建筑面积86355.63㎡，容积率1.01，起始价10.36亿元，起始楼面价12000元/㎡。最终湖南楚承置业有限公司以底价10.36亿元竞得该地块。（人民财讯）", "ctime": 1792474610, "time_str": "13:36:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261020/c680874928.shtml"}, {"id": "5420771", "title": "厨卫电器拉升，日出东方涨停", "content": "厨卫电器拉升，日出东方涨停，万和电气、火星人、亿田智能、浙江美大、奥普科技跟涨。", "ctime": 1792474329, "time_str": "13:32:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261020/c680874799.shtml"}, {"id": "5420707", "title": "仲量联行：三季度北京办公楼租赁市场活跃度呈现小幅回升态势", "content": "10月20日，仲量联行发布2026年第三季度北京房地产市场回顾报告。今年三季度，北京办公楼租赁市场活跃度呈现小幅回升态势，整层及以上的大面积成交显著增多。CBD核心区迎来四个新项目集中入市。受新项目集中入市的影响，全市空置率环比上升2.4个百分点至17.1%。受全年供应高峰的持续影响，预计2026年末全市空置率走势仍将承压。三季度市场流动性的增强尚未扭转租金下行通道，全市平均租金环比下降1.2%。(财经网)", "ctime": 1792474125, "time_str": "13:28:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261020/c680874750.shtml"}, {"id": "5420687", "title": "国信证券分析师王剑：政策利率或从7天过渡至隔夜，但不宜和降息划等号", "content": "在2026金融街论坛年会开幕式现场，中国人民银行行长潘功胜表示，进一步优化短端利率调控机制。为了进一步提高利率调控的精准性，人民银行将研究择机把央行公开市场主要操作品种的期限切换为隔夜，公开市场隔夜回购利率将相应成为主要政策利率。国信证券经济研究所所长助理兼银行业首席分析师王剑认为，随着隔夜操作走向常态化，政策利率或从7天过渡至隔夜，但不宜和降息划等号。广发证券首席经济学家郭磊也提到，央行在持续完善自身的货币政策调控框架，一系列制度设计是一脉相承的，沿袭了向价格型框架转型的思路，市场也要避免将央行操作机制改革举措当作降息来炒作。（金融时报）", "ctime": 1792473718, "time_str": "13:21:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261020/c680874605.shtml"}, {"id": "5420627", "title": "京东11.11首周服务品类订单量同比增长超130%", "content": "今年京东11.11于10月12日晚8点全面开启，截至10月19日，京东11.11服务品类订单量同比增长超130%，1098个实物品类销售额同比增长超一倍。家政服务、搬家服务、家电清洗服务、汽车保养服务、体检服务、局部装修服务、租赁服务、居家养老照护服务订单增长领跑。（界面新闻）", "ctime": 1792473414, "time_str": "13:16:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261020/c680874497.shtml"}, {"id": "5420583", "title": "新石器完成近4亿美元新一轮融资", "content": "10月20日，新石器宣布完成E轮近4亿美元融资。本轮融资由博裕投资与某基金联合领投。本轮融资也创造了今年国内自动驾驶领域最大单笔融资纪录。（人民财讯）", "ctime": 1792473169, "time_str": "13:12:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261020/c680874416.shtml"}, {"id": "5420581", "title": "广发证券刘晨明：资产、资金、制度三端夯实A股向好基础 中国资产配置价值持续凸显", "content": "10月19日，证监会主席吴清在2026金融街论坛年会开幕式发表主旨讲话。广发证券策略首席分析师刘晨明表示，结合当前中国权益市场运行态势，讲话释放的制度红利将从三个维度夯实A股中长期向好基础，中国资产配置价值有望持续凸显。其一，上市公司结构与质量进一步优化，新质生产力加速聚集。讲话强调落实落细“两创板”改革，完善科技企业识别筛选机制，研究推进更具包容性适应性的发行上市、并购重组制度；同时加快推动出台上市公司监管条例。其二，资金结构进一步优化，中长期资金“压舱石”作用强化。讲话提出健全适配长期投资的长周期考核机制，扩大中长期资金来源、渠道和入市方式，并同意首批18只主动ETF注册。刘晨明认为，险资、被动ETF等中长期力量占比提升，有助于熨平波动、重塑估值体系，引导资金从短期博弈转向长期配置。其三，政策环境更加科学有力、包容开放，市场生态持续净化。（人民财讯）", "ctime": 1792473161, "time_str": "13:12:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261020/c680874405.shtml"}, {"id": "5420559", "title": "上纬新材等成立智慧科技公司", "content": "企查查APP显示，近日，元动智慧（上海）科技有限公司成立，法定代表人为田华，经营范围包含：工业机器人制造；微特电机及组件制造；电子元器件制造；电动机制造；智能机器人的研发等。企查查股权穿透显示，该公司由上纬新材全资子公司启元新创（上海）科技有限公司等共同持股。（人民财讯）", "ctime": 1792472788, "time_str": "13:06:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261020/c680874225.shtml"}, {"id": "5420543", "title": "美防长未经事先宣布访以会见内塔尼亚胡", "content": "美国阿克西奥斯新闻网站19日援引两名知情人士的话报道称，美国国防部长赫格塞思当天在未事先宣布的情况下前往以色列进行访问，并在奥夫达空军基地会见以总理内塔尼亚胡。(新华社)", "ctime": 1792472705, "time_str": "13:05:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261020/c680874183.shtml"}, {"id": "5420525", "title": "影视院线板块走高", "content": "影视院线板块走高，华智数媒直线拉升，涨超10%，博纳影业、上海电影、光线传媒、幸福蓝海、奥飞娱乐跟涨。", "ctime": 1792472541, "time_str": "13:02:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261020/c680874129.shtml"}, {"id": "5420491", "title": "美舰冲闯中国南沙群岛仙宾礁附近海域 南部战区回应", "content": "10月20日凌晨，美“查尔斯顿”号濒海战斗舰未经中国政府允许，冲闯中国南沙群岛仙宾礁附近海域，中国人民解放军南部战区海军组织兵力依法依规跟踪监视。中国对南沙群岛及其附近海域拥有无可争辩的主权，美方行动侵犯中国主权权益，威胁海上安全，不利于地区和平稳定，美方应立即停止相关活动。战区部队时刻保持高度戒备，捍卫国家主权安全，维护地区和平稳定。(央视新闻)", "ctime": 1792472271, "time_str": "12:57:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261020/c680874056.shtml"}, {"id": "5420453", "title": "瓦努阿图群岛发生6.1级地震 震源深度10千米", "content": "中国地震台网正式测定：10月20日12时20分在瓦努阿图群岛（南纬14.05度，东经165.55度）发生6.1级地震，震源深度10千米。（央视新闻）", "ctime": 1792471929, "time_str": "12:52:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261020/c680873946.shtml"}, {"id": "5420437", "title": "印尼股市基准指数上涨4%，至5194.77点", "content": "印尼股市基准指数上涨4%，至5194.77点。", "ctime": 1792471672, "time_str": "12:47:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261020/c680873862.shtml"}, {"id": "5420427", "title": "山西发布寒潮黄色预警 最低气温将下降10℃以上", "content": "10月20日，山西省气象台发布寒潮黄色预警，预警区域为临汾市北部、忻州市西部、朔州市、大同市、太原市西部、吕梁市西部、晋中市南部、长治市西北部，预警区域48小时内最低气温将下降10℃以上，最低气温小于等于4℃。气象部门提示，政府及有关部门按照职责做好防寒潮工作；公众注意添衣保暖，照顾好老、弱、病人；农户对牲畜、家禽、农作物等采取防寒措施。（央视新闻）", "ctime": 1792470519, "time_str": "12:28:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261020/c680873413.shtml"}, {"id": "5420419", "title": "“十五五”时期我国将加强中外联合考古项目统筹管理", "content": "记者从国务院新闻办公室今天（20日）举行的“开局起步‘十五五’”系列主题新闻发布会上了解到，“十五五”时期，我国将加强中外联合考古项目统筹管理，积极开展南岛语族、环喜马拉雅地区、丝绸之路与海上丝绸之路沿线地区联合考古，增进文明交流互鉴。支持外国科研团队参与“考古中国”重大项目，鼓励依托良渚、三星堆、琉璃河等遗址建设国际交流平台。在亚洲文化遗产保护联盟框架下，科学布局“一带一路”境外考古科研基地，扩大中国考古国际影响力。（央视新闻）", "ctime": 1792469875, "time_str": "12:17:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261020/c680873142.shtml"}, {"id": "5420387", "title": "“十五五”时期考古工作将布局长江流域等区域性考古项目", "content": "记者从国务院新闻办公室今天（20日）举行的“开局起步‘十五五’”系列主题新闻发布会上了解到，在中华文明探源工程、“考古中国”重大项目框架下，中国考古工作将聚焦中华文明起源、形成、发展的基本图景、内在机制以及各区域文明演进路径等重大问题，布局长江流域、黄河流域、青藏高原、塔里木盆地等区域性考古项目，以及长城、大运河、石窟寺、海疆等专题性考古项目，控量提质主动性考古发掘项目，强化多学科、跨学科合作，以考古实证进一步讲清楚中华文明源流脉络。（央视新闻）", "ctime": 1792469047, "time_str": "12:04:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261020/c680872638.shtml"}, {"id": "5420381", "title": "港股午评：恒生指数跌0.95%，恒生科技指数跌1.21%", "content": "港股午间收盘，恒生指数跌0.95%，恒生科技指数跌1.21%。恒指港股通ETF银华（159318）跌0.8%，港股通科技ETF鹏华（159751）跌0.38%。板块方面，电机Ⅲ、电机Ⅳ板块涨幅靠前；其他能源储存运输、广播板块跌幅靠前。个股方面，五一视界涨26.89%，亮晴控股涨23.38%，梦金园涨12.11%，本末科技涨11.8%，怡俊集团控股涨11.23%；长光辰芯跌14.56%，奕斯伟计算跌9.06%，东莞农商银行跌8.03%，万国数据-SW跌7.9%，联想集团跌7.56%。", "ctime": 1792468898, "time_str": "12:01:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261020/c680872562.shtml"}, {"id": "5420375", "title": "达安基因正式加入广药集团", "content": "10月20日，记者从达安基因获悉，达安基因已正式加入广药集团。同日，达安基因与中山大学生命科学学院签署合作协议，双方将围绕科研成果转化开展合作，推动实验室研究成果向临床应用转化。达安基因还与中山大学创新促进中心合作，共同布局合成生物学领域。（界面新闻）", "ctime": 1792468763, "time_str": "11:59:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261020/c680872509.shtml"}, {"id": "5420373", "title": "李家超：把握APEC财长会机遇 展示香港全方位发展", "content": "香港特区行政长官李家超今日（20日）为2026粤港澳大湾区高峰论坛致辞时表示，今年的APEC财政部长会首次在香港特区举行，今日下午就会正式召开。李家超表示，香港会把握财长会这个高层次的国际平台，发挥作为国际金融中心的经验，向与会的APEC成员经济体财金官员和国际组织代表，以至国际社会展示香港在经济、金融及社会等方面的全方位发展，并介绍香港作为粤港澳大湾区中心城市，联系国家机遇和国际机遇的叠加优势。（大湾区之声）", "ctime": 1792468741, "time_str": "11:59:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261020/c680872491.shtml"}, {"id": "5420367", "title": "甲骨文与阿斯利康合作探索AI医疗应用", "content": "10月20日，甲骨文与阿斯利康宣布达成一项非约束性协议，计划探索利用人工智能（AI）和真实世界数据识别符合临床试验条件的患者、加快医学证据生成，并将相关研究成果融入日常诊疗流程。双方将结合阿斯利康的科研及治疗领域专长与甲骨文的数据、云计算、AI和临床工作流技术。双方初步考虑在肿瘤、心血管、肾脏及代谢疾病、呼吸与免疫疾病和罕见病等领域探索应用，并计划建立共同治理机制和效果评估指标，以评估相关方案能否推广至更多疾病领域和地区。此次合作仍处于探索阶段，尚未公布具体实施时间表。（界面新闻）", "ctime": 1792468582, "time_str": "11:56:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261020/c680872422.shtml"}, {"id": "5420355", "title": "10月20日午间公告一览：中原内配收到国际客户燃气发动机气缸套项目定点", "content": "中原内配公告，公司近日收到某国际著名工程机械与动力设备企业（限于保密要求，无法披露其名称，以下简称“客户”）的《定点通知》，公司获得该客户燃气发动机气缸套项目定点，上述燃气发动机主要应用于电力与能源基础设施领域。公司预计2028年开始供货，根据客户需求预测，预计年销售额约人民币5000万元。", "ctime": 1792468165, "time_str": "11:49:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261020/c680872238.shtml"}, {"id": "5420353", "title": "抖音电商双11“开门红”数据：消费券带动成交额破亿商家数涨2倍", "content": "抖音电商公布2026年双11“开门红”阶段数据报告。报告显示，10月15日至18日大促“开门红”阶段，由消费券带动的、成交额破百万元商家数量同比增长38%，破千万元的商家数量同比增长36%，破亿元的商家数量同比增长200%。成交额新突破百万元的商家数量同比增长59%，成交额从百万元增长到千万元的商家数量同比增长78%，成交额破亿元的直播间数量同比增长80%。（界面新闻）", "ctime": 1792468082, "time_str": "11:48:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261020/c680872194.shtml"}, {"id": "5420347", "title": "天猫“双11”10月20日晚8点正式开卖", "content": "10月20日，记者从天猫获悉，天猫“双11”活动将于10月20日晚8点正式开卖。今年的活动推出店铺立减、平台消费券等优惠，叠加后，部分商品可低至7.2折；若再叠加行业加补券、国家补贴、淘金币等优惠，部分商品到手价可低至5折。\n据介绍，今年天猫平台消费券新增“膨胀”玩法，消费者可根据购物车总价选择相应优惠券面额。商品方面，家电、手机、平板等符合条件的商品可额外享受最高15%的国家补贴，苹果天猫官方旗舰店配件首次支持使用消费券。(上海证券报)", "ctime": 1792467889, "time_str": "11:44:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261020/c680872089.shtml"}, {"id": "5420343", "title": "西昭高速金阳隧道今天贯通 全线预计年底实现通车", "content": "今早7时30分，全长12.18公里的金阳特长隧道实现贯通。在建的西昭高速是G7611（贵州都匀至云南香格里拉）的组成部分，预计今年年底将实现通车，西昌至香格里拉段也已经开始建设。全线建成后，将对释放西南旅游资源潜力、巩固拓展脱贫攻坚成果、助力乡村振兴，有着十分重要的现实意义。（央视新闻）", "ctime": 1792467729, "time_str": "11:42:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261020/c680872008.shtml"}, {"id": "5420335", "title": "国家文物局：“十五五”时期将努力办人民满意的博物馆", "content": "今天（10月20日）上午，国新办就“十五五”时期加强文化遗产保护情况举行新闻发布会。国家文物局相关负责人介绍，“十四五”期间，全国博物馆数量由5788家增长至7188家，累计接待观众超过62亿人次，共举办展览22.4万个，开展教育活动225.1万场次，“何以中国”等展览引发社会热议，全国各地乃至海外观众纷至沓来，“为展赴城”成为文化现象，博物馆作为文化殿堂和桥梁的作用越发彰显。进入新的阶段。“十五五”时期，博物馆事业发展将始终以“办人民满意的博物馆”作为工作的出发点和落脚点，推动博物馆事业高质量发展。（央视新闻）", "ctime": 1792467527, "time_str": "11:38:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261020/c680871900.shtml"}, {"id": "5420315", "title": "ETF两市成交额报3265.4亿元，较昨日此时缩量328.61亿元", "content": "截至目前，ETF两市成交额报3265.4亿元，较昨日此时缩量328.61亿元，分类型来看，股票型ETF成交额831.32亿元，债券型ETF成交额1809.36亿元，货币型ETF成交额166.04亿元，商品型ETF成交额39.51亿元，QDII型ETF成交额419.17亿元。其中，成交额最高的非货币型ETF分别是中韩半导体ETF（513310）、港股创新药ETF（513120）、科创50ETF（588000），成交额分别为：65.20亿元、58.64亿元、50.45亿元。", "ctime": 1792467180, "time_str": "11:33:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261020/c680871580.shtml"}, {"id": "5420309", "title": "中国保险行业协会会长赵宇龙：金融强国核心要素落实到保险篇可以细化为10个方面", "content": "中国保险行业协会会长赵宇龙10月20日在2026金融街论坛年会保险大会上发布《保险业“十五五”高质量发展研究》课题报告时介绍，保险业存在五方面不足：覆盖面和适配度不够，发展不平衡，发展方式较粗放，风险分散机制不健全，基础设施存在短板。\n金融强国需要一系列核心要素。赵宇龙表示，这一系列核心要素落实到保险篇章，可以细化为10个方面：强大的现代保险机构阵列，强大的风险保障与经济补偿能力，强大的长期资金管理和耐心资本供给能力，强大的自主创新能力，强大的行业韧性与资本实力，强大的数据建设和科技应用能力，强大的国际保险与风险定价中心，强大的复合型人才队伍，强大的自主理论与行业文化，强大的现代保险监管体系。\n他还提到，金融强国保险篇章发展路径可以分为三个阶段：“十五五”时期，是夯基发力阶段，保险业从底线安全、市场生态、供给能力、支撑体系、开放动能等方面夯实发展基础，从产品、结构、服务、数据、人才、平台建设、改革开放等多维度发力，全面提升保险保障能力；2031年至2035年，是提质增效阶段；2036年至2050年，是强国支柱阶段。(上海证券报)", "ctime": 1792467070, "time_str": "11:31:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261020/c680871520.shtml"}, {"id": "5420305", "title": "A股午评：创业板指探底回升涨0.27%，半导体、人形机器人、元件板块活跃", "content": "A股三大指数早盘涨跌不一，截至午盘，上证指数跌0.08%，深证成指涨0.18%，创业板指涨0.27%，北证50涨4.11%，科创50指数涨0.79%。全市场成交额9447亿元，较上日缩量339亿元，全市场超3900只个股上涨。板块题材上，自动化设备、人形机器人、消费电子、半导体、PCB概念板块涨幅居前；中船系、煤炭开采加工、保险、银行、汽车整车板块跌幅居前。盘面上，自动化设备板块持续走强，嘉晨智能、田中精机涨停，奥普特、均普智能、申昊科技涨幅居前。减速器板块表现强势，长盈精密、宁波东力、浙江荣泰等股涨停，均普智能、精研科技、步科股份涨幅居前。半导体板块亦表现活跃，银河微电、恒玄科技、博通集成涨停，乐鑫科技、泰凌微、矩芯科技涨幅居前。中船系板块走势低迷，昆船智能、中国海防、中船防务跌幅居前。煤炭开采加工板块低开低走，大有能源、安泰集团、郑州煤电跌幅居前。", "ctime": 1792467053, "time_str": "11:30:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261020/c680871507.shtml"}, {"id": "5420299", "title": "ETF午评：机器人ETF领涨5.24%，黄金股ETF领跌3.48%", "content": "ETF午间收盘涨跌不一，机器人ETF（159530）领涨5.24%，机器人ETF（159050）涨5.23%，机器人ETF（159048）涨5.17%，黄金股ETF（517400）领跌3.48%，黄金股ETF（517520）跌3.08%，黄金股ETF（159562）跌2.55%。", "ctime": 1792467048, "time_str": "11:30:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261020/c680871500.shtml"}, {"id": "5420295", "title": "股指期货早盘收盘 主力合约涨跌互现", "content": "股指期货早盘收盘，主力合约涨跌互现。沪深300股指期货(IF)主力合约跌0.70%，上证50股指期货(IH)主力合约跌0.90%，中证500股指期货(IC)主力合约涨0.23%，中证1000股指期货(IM)主力合约涨0.43%。", "ctime": 1792467026, "time_str": "11:30:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261020/c680871488.shtml"}, {"id": "5420293", "title": "华工科技与国机集团中机六院签署战略合作协议", "content": "10月19日，华工科技产业股份有限公司与国机集团机械工业第六设计研究院有限公司正式签署战略合作协议。双方将在智能工厂规划建设、智能产线落地、数字化技术应用、AI与制造深度融合等方面开展全方位协同，合力打造全要素智能工厂整体解决方案。（华工科技）", "ctime": 1792466956, "time_str": "11:29:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261020/c680871447.shtml"}, {"id": "5420289", "title": "重庆前三季度GDP为25711.51亿元，同比增4.3%", "content": "10月20日，重庆市统计局发布2026年前三季度重庆市经济运行情况。根据地区生产总值统一核算结果，前三季度重庆全市地区生产总值25711.51亿元，按不变价格计算，同比增长4.3%，高于上半年重庆市经济增速（4.2%）。其中，第一产业增加值1526.64亿元，同比增长3.9%；第二产业增加值8573.74亿元，同比增长1.7%；第三产业增加值15611.13亿元，同比增长5.8%。（澎湃新闻）", "ctime": 1792466875, "time_str": "11:27:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261020/c680871419.shtml"}, {"id": "5420275", "title": "食品加工制造板块短线拉升，安记食品涨停", "content": "食品加工制造板块短线拉升，安记食品涨停，朱老六、海欣食品、一致魔芋、盖世食品、康比特等纷纷走高。", "ctime": 1792466602, "time_str": "11:23:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261020/c680871258.shtml"}, {"id": "5420273", "title": "东方材料：碳巢新材下游客户产品验证程序有序推进中", "content": "东方材料在2026年半年度业绩说明会上表示，碳巢新材已纳入公司合并报表范围，当前碳巢新材正按照既定节奏准备四季度产品的下线交付。碳巢新材下游客户产品验证程序有序推进中，客户验证反馈积极，当前一期产能按计划推进。后续将根据客户需求及一期产销情况衔接二期规划。（人民财讯）", "ctime": 1792466508, "time_str": "11:21:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261020/c680871223.shtml"}, {"id": "5420271", "title": "伊朗称击落一架美国MQ-9无人机", "content": "当地时间20日，伊朗伊斯兰革命卫队宣布在霍尔木兹海峡上空拦截并摧毁了美国的一架MQ-9无人机。美国方面对此暂无回应。（央视新闻）", "ctime": 1792466492, "time_str": "11:21:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261020/c680871220.shtml"}, {"id": "5420269", "title": "国家发展改革委答记者提问：两批88个投资项目吸引民企300余次咨询，部分项目取得实质性进展", "content": "10月20日，国家发展改革委民营经济发展局副局长刘丹在发改委10月份新闻发布会上回答记者提问。刘丹表示，9月份国家发展改革委分两批向民营企业公开推介88个投资项目，计划引入民间资本311亿元。这些优质项目，是向广大民营企业发出的一份“诚挚邀约”，给项目方与民营企业架起了一座桥梁，希望以项目推介为抓手，着力破解项目投资信息供需不对称难题，持续拓宽民间投资渠道，切实保障民营企业既有“入场券”、又有“项目单”。整体来看，两批项目推介有三个方面特点：一是精准贴合企业投资需求。在与民营企业常态化沟通交流中，不少企业向我们反映在交通、物流、水利、能源、先进制造业等领域有较强的投资意愿，我们坚持分批次、小规模的原则，筛选了一批质量高、收益稳、预期好的投资项目向民营企业推介，让民营企业能够看得见、投得进、有回报。二是线上线下拓展推介渠道。一方面组织民营企业、行业协会召开专题对接座谈会；另一方面依托我委微信公众号、官方网站公开发布项目清单，不断提升项目覆盖面和知晓度。三是参与方式更加灵活多样。企业可根据自身经营实际，通过参股、控股、特许经营等多种方式参与项目建设，不设置不合理门槛。（人民财讯）", "ctime": 1792466409, "time_str": "11:20:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261020/c680871180.shtml"}, {"id": "5420267", "title": "我国已认定23个国家级文化生态保护区", "content": "记者从国务院新闻办公室今天（20日）举行的“开局起步‘十五五’”系列主题新闻发布会上了解到，目前我国已认定了齐鲁文化、河洛文化、闽南文化等23个国家级文化生态保护区，一批在中华文明传承发展中具有重要作用的文化形态得到有效保护。“十五五”期间，我国将健全国家级、省级文化生态保护区名录，实施文化生态保护区建设扩容提升工程，既要保护物质文化遗产所承载的营造技艺、民俗礼仪等文化传统，又要保护非遗所依托的村落、街巷、戏台、祠堂、园林等文化空间，以系统性思维推动各类文化遗产整体协同保护，促进非遗更好融入现代生活、服务美好生活。（央视新闻）", "ctime": 1792466377, "time_str": "11:19:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261020/c680871161.shtml"}];

  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
