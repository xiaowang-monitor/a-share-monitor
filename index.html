arket": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260724/c678410360.shtml"}, {"id": "4798681", "title": "派珀·桑德勒将特斯拉目标股价从500美元下调至450美元", "content": "派珀·桑德勒将特斯拉目标股价从500美元下调至450美元。", "ctime": 1784866493, "time_str": "12:14:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260724/c678410343.shtml"}, {"id": "4798679", "title": "SK海力士股价跌幅扩大，现跌7.7%", "content": "7月24日，韩国股指延续跌势，SK海力士股价跌幅扩大，现跌7.7%。", "ctime": 1784866394, "time_str": "12:13:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260724/c678410317.shtml"}, {"id": "4798677", "title": "全国首个海陆一体柔直工程海上换流站完成安装", "content": "7月23日，在离广东阳江市海岸近100公里的南海海域，阳江三山岛海上风电柔直输电工程海上换流站顺利完成安装，工程全面转入海缆贯通、海陆联调的冲刺新阶段。（央视新闻）", "ctime": 1784866306, "time_str": "12:11:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260724/c678410296.shtml"}, {"id": "4798675", "title": "港股瑛泰医疗“回A”辅导期卷入杭州“准独角兽”股权纠纷，德诺电生理股东会两议案遭投资方股东四大质疑", "content": "三个月前，“德诺系”公司——“准独角兽”杭州德诺电生理医疗科技有限公司（简称德诺电生理）被投资方股东曝出存在“反稀释权和优先清算权”的股东权利纠纷。近期，这起收购案又有了新的进展。\n记者从前新财富医药“一姐”张明芳处了解到，德诺电生理将于7月29日召开临时股东会，审议上海辰耀基金和瑛泰医疗提供的增资方案以及修改公司章程议案。张明芳对这两个议案的审议内容提出四点质疑：一是，本次增资是公司大股东为满足一己之私所做的“预备动作”；二是，公司以5亿元估值增资扩股已经触发了投资方小股东的“反稀释权”；三是，公司拒绝向包括馨瑞元福在内的股东提供财务报表、审计报告等重要信息；四是，瑛泰医疗多次公告收购德诺系医疗资产，且多为低价收购控制权实现实控人股权退出。\n对此，上海明伦律师事务所王智斌律师向记者表示，公司法明确规定股东享有查阅、复制财务会计报告的权利，投资协议或股东协议中也通常对此有具体约定。在公司拟进行增资扩股的背景下，财务信息是股东行使表决权的重要基础，公司更应当以合理方式保障股东获取相关文件的权利。(每日经济新闻)", "ctime": 1784866297, "time_str": "12:11:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260724/c678410291.shtml"}, {"id": "4798669", "title": "中方代表团有力驳斥日方攻击抹黑", "content": "在菲律宾马尼拉举行的东盟地区论坛和东亚峰会外长会期间，日本炒作台海、南海、中国威胁等问题，对此，中方代表团予以有力驳斥。关于台湾问题，中方指出，台湾问题是中国的内政。中国决不允许“台独”分裂势力以任何名义、任何方式把台湾从中国分裂出去。国际社会反对“台独”分裂活动的立场越鲜明，坚持一个中国原则的立场越坚定，台海的和平稳定就越有保障。关于南海问题，中方指出，作为世界上最繁忙、最安全、最自由的航道，每年全球30%的集装箱、34%的液化天然气和40%的原油运经南海，另有上百万架次民用飞机在南海上空活动，没有哪一艘船哪一架飞机受到过任何干扰和阻碍。倒是个别国家派军舰和军机不远万里来到南海挑事碰瓷。中国愿继续同有关直接当事国通过双边友好协商妥善解决有关争议，同时同东盟国家一道全面有效落实《南海各方行为宣言》，争取尽早达成“南海行为准则”，共同维护南海和平与稳定。外部势力越少挑拨离间，越少煽风点火，地区国家越有信心和能力维护好本地区和平稳定。（央视新闻）", "ctime": 1784866232, "time_str": "12:10:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260724/c678410272.shtml"}, {"id": "4798667", "title": "公司是否考虑增持进行维稳？捷捷微电回应", "content": "有投资者向捷捷微电（300623.SZ）提问，公司出现连续大跌，已经跌到近几年最低水平，行业上涨的时候你没怎么涨，下跌的时候一个星期就把这几年涨幅全跌没了，其他公司纷纷进行回购增持，公司是否考虑增持进行维稳？\n7月24日，公司回答表示，公司生产、销售及运营一切正常，二级市场股价波动的影响因素很多，股市有风险，投资需谨慎。公司高度重视品牌形象和股东信心，并已采取多项措施。在品牌建设方面，公司坚持弘扬捷捷文化与价值观，致力于打造功率器件世界一流品牌，深耕品牌价值，以提升市场影响力和竞争价值。在提振股东信心方面，公司强化投资者关系管理，严格遵守信息披露规则，通过电话、邮件、深交所互动易平台、业绩说明会等多种形式加强与投资者的双向沟通，及时传递公司发展战略和经营信息，有效传导公司价值。公司已制定了市值管理制度，市值管理主要目的是通过充分、合规的信息披露，增强公司透明度，引导公司的市场价值与内在价值趋同，同时利用资本运作、权益管理、投资者关系管理等手段，使公司价值得以充分实现，建立稳定和优质的投资者基础，获得长期的市场支持，从而达到公司整体利益最 大化和股东财富增长并举的目标。后续如有相关回购增持计划，公司将按照相关规定及时履行信息披露义务，敬请关注公司公告。", "ctime": 1784866225, "time_str": "12:10:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260724/c678410267.shtml"}, {"id": "4798665", "title": "多品牌金饰价格下调", "content": "北京时间24日，现货黄金、现货白银持续下跌。记者梳理发现，国内品牌金饰价格经历三连涨后再次大跌，周生生足金饰品报1227元/克，单日大跌31元；老庙黄金足金饰品现报1231元/克，单日大跌27元；老凤祥足金饰品现报1229元/克，单日大跌24元。（中新经纬）", "ctime": 1784866132, "time_str": "12:08:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260724/c678410239.shtml"}, {"id": "4798663", "title": "诺华盐酸伊普可泮胶囊获美国FDA常规批准", "content": "诺华近日宣布，美国食品药品监督管理局（FDA）已授予盐酸伊普可泮胶囊常规批准，用于减缓存在疾病进展风险的成人原发性免疫球蛋白A肾病（IgAN）患者的肾功能下降。盐酸伊普可泮胶囊是一款同类首创的补体抑制剂，此前已于2024年8月获得FDA的加速批准，用于降低原发性IgAN患者的蛋白尿。本次批准在FDA授予的优先审评资格下完成。（界面新闻）", "ctime": 1784865941, "time_str": "12:05:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260724/c678410127.shtml"}, {"id": "4798653", "title": "7月24日午间公告一览：金河生物向特定对象发行股票申请获受理", "content": "金河生物公告，向特定对象发行股票申请获受理；*ST康佳A公告，对子公司提供的内部借款逾期且预计无法全部收回的本金合计人民币 442,483.34 万元及对应利息。", "ctime": 1784865788, "time_str": "12:03:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260724/c678410060.shtml"}, {"id": "4798649", "title": "暂停在中国生产 CLA L？奔驰：仍在生产 月销量稳定", "content": "就“奔驰或将暂停在中国生产 CLA L”这一传闻，奔驰方面向记者回应表示，“CLA车型仍在生产，每个月的销量相对稳定。按照惯例，不同生产线会周转进行高温假，我们也将以此为契机进行设备检修。” (贝壳财经)", "ctime": 1784865729, "time_str": "12:02:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260724/c678410025.shtml"}, {"id": "4798647", "title": "美众院投票限制对伊动武 类似决议未获参院推进", "content": "美国国会众议院23日投票通过一项决议，要求总统特朗普停止对伊朗的军事行动。但参议院当天在程序性表决中未能推进一项类似决议。当天，众议院以214票赞成、208票反对的结果通过一项限制总统战争权力决议，要求特朗普结束对伊朗的军事行动，并在今后对伊朗采取军事行动前必须获得国会授权。其中，有4名共和党人投了赞成票。（新华社）", "ctime": 1784865706, "time_str": "12:01:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260724/c678410021.shtml"}, {"id": "4798645", "title": "国务院成立广西南宁横州市六蓝水库“7·6”溃坝灾害调查评估组", "content": "7月24日，国务院广西南宁横州市六蓝水库“7·6”溃坝灾害调查评估组在广西南宁召开第一次全体会议。\n7月6日，广西南宁横州市六蓝水库发生溃坝，造成重大人员伤亡。根据国家有关法律法规规定，国务院成立调查评估组，由应急管理部牵头，自然资源部、住房城乡建设部、水利部、农业农村部、国家发展改革委、工业和信息化部、公安部、财政部、交通运输部、中国气象局、国家能源局、国家消防救援局和广西壮族自治区人民政府等相关方面参加，对广西南宁横州市六蓝水库“7·6”溃坝灾害进行调查评估。(央视新闻)", "ctime": 1784865695, "time_str": "12:01:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260724/c678410016.shtml"}, {"id": "4798643", "title": "港股午评：恒生指数跌1.27%，恒生科技指数跌1.69%", "content": "港股午间收盘，恒生指数跌1.27%，恒生科技指数跌1.69%。恒指港股通ETF银华（159318）跌1.3%，港股通科技ETF鹏华（159751）跌1.47%。板块方面，电气设备、个人护理用品板块跌幅靠前。个股方面，现代牧业涨8.13%，智谱涨7.6%，中国再保险涨7.03%，大新金融涨6.95%，威华达控股涨6.8%；圣邦股份跌10.38%，旺山旺水-B跌9.55%，建滔积层板跌9.14%，海致科技集团跌8.9%，思格新能跌8.64%。", "ctime": 1784865670, "time_str": "12:01:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260724/c678410005.shtml"}, {"id": "4798625", "title": "美媒称伊朗拒绝特朗普停火提议", "content": "据美国《纽约时报》23日报道，伊朗和伊拉克官员称，伊朗当天拒绝了美国总统特朗普经由伊拉克总理扎伊迪转交的一份停火提议。此次调解努力正值特朗普威胁要重启对伊朗的大规模作战行动。 报道称，这些匿名官员表示，扎伊迪访问伊朗前在白宫与特朗普会面，但经由扎伊迪转交的停火提议细节尚不明确。伊朗官员表示，这是目前摆在谈判桌上的唯一一份停火方案，但伊朗政府对搁置霍尔木兹海峡控制权问题的临时协议不感兴趣。 报道援引伊朗外长阿拉格齐的话说，扎伊迪分享了其华盛顿之行的“看法和印象”，但伊美之间已有足够的调解人，“问题不在于传递信息。问题在于美国的态度是不合逻辑、贪婪且具有控制欲的”。 此前，美国媒体报道，卡塔尔、埃及、巴基斯坦等调解方已向美国和伊朗提出一项为期10天的停火提议。特朗普政府正在研究停火可能性，同时也在为全面战争做准备。 本月以来，美伊紧张局势持续升级。美军不仅打击伊朗军事目标，还轰炸伊朗铁路、桥梁和海港等基础设施。伊朗则实施报复性打击，向美国位于中东的军事设施发射弹道导弹和无人机。(新华社)", "ctime": 1784865190, "time_str": "11:53:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260724/c678409799.shtml"}, {"id": "4798593", "title": "伊朗称伊斯法罕省遭美国袭击", "content": "当地时间24日，伊朗伊斯法罕省相关负责人表示，当天凌晨3时，该省纳因县一处地区遭到美国袭击。目前，有关袭击造成的人员伤亡及设施受损情况尚不清楚。（央视新闻）", "ctime": 1784864707, "time_str": "11:45:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260724/c678409560.shtml"}, {"id": "4798587", "title": "渝厦高铁重庆菜园坝长江铁路隧道顺利贯通", "content": "记者从渝黔铁路公司获悉，7月24日，随着隧道最后一次掘进施工完成，渝厦高铁重庆菜园坝长江铁路隧道顺利贯通，为渝厦高铁全线通车运营打下坚实基础。重庆菜园坝长江铁路隧道是国内首条穿越长江并实现贯通的高铁隧道，隧道贯通后，工程将转入无砟轨道施工与铺轨工序。项目完工后，可实现重庆站与重庆东站互联互通。渝厦高铁是我国“八纵八横”高铁网的重要组成部分，起自重庆，途经湖南、江西，终至福建厦门。目前，重庆东至长沙段、赣州至厦门段已开通，待重庆至重庆东段、长沙至赣州段建成后，共同形成重庆至厦门的高铁大通道，将极大便利沿线群众出行，对促进区域互联互通和经济社会协调发展具有重要意义。（央视新闻）", "ctime": 1784864500, "time_str": "11:41:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260724/c678409476.shtml"}, {"id": "4798567", "title": "A股午评：创业板指大幅缩量跌1.78% 全市场超4900家个股下跌", "content": "截至午盘，上证指数跌1.2%，深证成指跌1.77%，创业板指跌1.78%，北证50跌3.0%。三市成交额12341亿元，较上日缩量2312亿元。全市场超4900家个股下跌。\n板块题材上，军工装备板块涨幅居前；贵金属、算力租赁、AI应用板块跌幅居前。\n盘面上，军工装备表现强势，长城军工2连板，建设工业涨停，超卓航科涨超15%，江龙船艇、天秦装备、北方长龙、晟楠科技涨超10%，内蒙一机、晨曦航空、新余国科、天海防务、国科军工跟涨。贵金属板块大幅低开，招金黄金、四川黄金、湖南白银跌超7%，兴业银锡、晓程科技跟跌。算力租赁持续走弱，利通电子、证通电子触及跌停，信通电子、群兴玩具、行云科技、亿田智能、深信服跟跌。AI应用板块低开低走，联迪信息、米奥会展跌超10%，立方控股、每日互动、深信服跟跌。", "ctime": 1784863985, "time_str": "11:33:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260724/c678409128.shtml"}, {"id": "4798563", "title": "ETF两市成交额报3153.91亿元，较昨日此时放量440.85亿元", "content": "截至目前，ETF两市成交额报3153.91亿元，较昨日此时放量440.85亿元，分类型来看，股票型ETF成交额1004.32亿元，债券型ETF成交额1529.04亿元，货币型ETF成交额108.41亿元，商品型ETF成交额38.97亿元，QDII型ETF成交额473.18亿元。", "ctime": 1784863964, "time_str": "11:32:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260724/c678409113.shtml"}, {"id": "4798553", "title": "ETF午评：标普油气ETF领涨2.96%，黄金股ETF领跌4.97%", "content": "ETF午间收盘涨跌不一，标普油气ETF（513350）领涨2.96%，科创半导体设备ETF（588710）涨2.67%，科创半导体ETF（588170）涨2.55%，黄金股ETF（517400）领跌4.97%，黄金股ETF（159562）跌4.92%，黄金股ETF（159321）跌4.83%。", "ctime": 1784863864, "time_str": "11:31:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260724/c678409081.shtml"}, {"id": "4798537", "title": "股指期货早盘收盘 主力合约全线下跌", "content": "股指期货早盘收盘，主力合约全线下跌。沪深300股指期货(IF)主力合约跌1.05%，上证50股指期货(IH)主力合约跌0.73%，中证500股指期货(IC)主力合约跌1.74%，中证1000股指期货(IM)主力合约跌2.33%。", "ctime": 1784863817, "time_str": "11:30:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260724/c678409060.shtml"}, {"id": "4798531", "title": "刘伯超已任工信部国际合作司司长", "content": "2026年7月23日，2026年亚太经合组织（APEC）数字和人工智能部长会议新闻发布会在成都召开。会议主席、工业和信息化部部长李乐成出席发布会，会同工业和信息化部科技司司长魏巍、国际合作司司长刘伯超，介绍有关情况并答记者问。上述消息显示，刘伯超已任工信部国际合作司司长。公开资料显示，刘伯超曾任工信部科技司副司长、工信部网络安全管理局副局长等职。据工信部官网介绍，工信部国际合作司（港澳台办公室）承担对外和对港澳台合作与交流相关事务；负责外事工作。（澎湃新闻）", "ctime": 1784863767, "time_str": "11:29:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260724/c678409038.shtml"}, {"id": "4798527", "title": "伊朗外长：扣押他国资产作赔偿将开创危险先例，加剧紧张局势", "content": "当地时间24日，伊朗外交部长阿拉格齐在社交媒体上发文表示，扣押一国资产、用于支付未来可能出现且与之无关的索赔，将开创危险先例，并加剧紧张局势。阿拉格齐称，支持此类做法或从中获利者应当认识到，一旦各国将没收他国财产常态化，任何资产都将不再安全，也无法获得豁免。阿拉格齐警告称，由此引发的混乱与不稳定将“既不令人乐见，也不会以和平方式发展”。美国总统特朗普23日在社交媒体发文称，美国将用其控制的伊朗资金“赔偿”因伊方袭击受损的船只和货物。特朗普表示，即日起，船只、货物及相关资产遭受的任何损失，都将由美国持有并控制的伊朗资金支付。特朗普称，相关损失金额可能十分庞大，但使用伊朗资金进行赔偿是“公平且合理的做法”。（央视新闻）", "ctime": 1784863731, "time_str": "11:28:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260724/c678409018.shtml"}, {"id": "4798497", "title": "国际能源署：今明两年全球电力需求将保持较快增长", "content": "国际能源署23日发布报告说，尽管近期中东战事扰乱全球天然气市场，推高多地发电成本，但由于工业、家用电器、制冷、电动汽车和数据中心等领域的电力需求持续增加，今明两年全球电力需求预计仍将保持较快增长。 报告预计，2026年全球电力需求将增长3.6%，2027年增长3.8%，均高于2025年3%的增速。到2027年，全球电力消费量预计将增至30700太瓦时。 报告预计，可再生能源将于2026年超过煤炭，成为全球最大电力来源。预计2026年太阳能光伏发电量将增加约600太瓦时，光伏发电有望超过风电，成为仅次于水电的全球第二大可再生能源发电来源。 报告认为，天气变化仍是影响全球电力需求前景的重要不确定因素。若2026年厄尔尼诺现象强于预期，制冷需求增加可能进一步推高全球电力消费。(新华社)", "ctime": 1784863273, "time_str": "11:21:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260724/c678408707.shtml"}, {"id": "4798495", "title": "京津冀三地消协组织约谈10家航空公司及5家线上售票平台", "content": "7月初，京津冀三地消协组织联合开展民航机票超售认知专项调查，针对调查中发现的问题，依据《中华人民共和国消费者权益保护法实施条例》第四十条，京津冀三地消协组织于7月24日在天津对中国国际航空、中国南方航空、中国东方航空、海南航空、厦门航空、天津航空、四川航空、吉祥航空、春秋航空、河北航空等10家航空公司，以及同程、携程、飞猪、去哪儿、美团等5家线上售票平台开展联合约谈，要求上述企业在2026年8月31日前完成自查整改。值得关注的是，在约谈前的沟通环节中，春秋航空的服务热线无法联系上人工客服，消协组织发函后也未收到任何回复。对此，京津冀三地消协组织予以公开批评，要求春秋航空公司正视自身在服务响应和消费者权益保障方面存在的不足，主动与消协组织对接沟通，按要求提交整改材料，确保整改工作落到实处。（央视）", "ctime": 1784863240, "time_str": "11:20:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260724/c678408694.shtml"}, {"id": "4798481", "title": "约旦境内美空军基地遭导弹袭击", "content": "总台记者当地时间24日清晨获悉，约旦境内拉响防空警报。初步消息称，位于约旦拜勒加省的穆沃费格萨勒提空军基地遭到导弹袭击。（央视新闻）", "ctime": 1784863023, "time_str": "11:17:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260724/c678408544.shtml"}, {"id": "4798477", "title": "深证成指跌2% 全市场仅有超500家个股上涨", "content": "深证成指跌幅扩大至2%，上证指数跌1.27%，创业板指跌2.16%。全市场仅有超500家个股上涨。", "ctime": 1784862996, "time_str": "11:16:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260724/c678408531.shtml"}, {"id": "4798473", "title": "中证500股指期货(IC)主力合约日内跌超2%", "content": "中证500股指期货(IC)主力合约日内跌超2%，现报7437.2点。", "ctime": 1784862942, "time_str": "11:15:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260724/c678408510.shtml"}, {"id": "4798469", "title": "特朗普称对伊朗战争进展顺利", "content": "当地时间7月23日，美国总统特朗普再次称，“美国在对抗伊朗方面进展很顺利，表现得极其出色，好得超乎任何人想象。”特朗普称，伊朗的无人机战损率达84%，导弹战损率高达91%，那些说“伊朗如今比4个月前更强了”的报道“不是事实，大错特错”。(CCTV国际时讯)", "ctime": 1784862897, "time_str": "11:14:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260724/c678408477.shtml"}, {"id": "4798449", "title": "上半年国家电网完成固定资产投资同比增长12.6%", "content": "记者今天从国家电网了解到，上半年，国家电网完成固定资产投资超3100亿元，同比增长12.6%。其中，15项特高压工程和37座抽水蓄能电站加快建设。同时，新能源并网工程投资力度持续加大，截至6月底，国家电网经营区新能源并网装机容量达到15.5亿千瓦。（央视新闻）", "ctime": 1784862474, "time_str": "11:07:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260724/c678408259.shtml"}, {"id": "4798429", "title": "长江干线货物吞吐量上半年达19.7亿吨", "content": "记者从交通运输部长江航务管理局了解到，今年上半年，长江干线港口完成货物吞吐量19.7亿吨，其中，集装箱吞吐量1421.8万标箱，同比增长3.9%；重点物资运输保障有力，长江黄金水道运行平稳有序。（央视新闻）", "ctime": 1784862100, "time_str": "11: // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');

    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
