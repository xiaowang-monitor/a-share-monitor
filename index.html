1673135, "time_str": "13:12:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260617/c677527587.shtml"}, {"id": "4543315", "title": "富时中国A50指数期货跌1%", "content": "富时中国A50指数期货跌幅扩大至1%。", "ctime": 1781672708, "time_str": "13:05:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260617/c677527467.shtml"}, {"id": "4543311", "title": "公司和长鑫科技是否有合作？蓝箭电子回应", "content": "有投资者向蓝箭电子提问，贵公司和长鑫科技有合作吗？是贵公司的客户吗？ 6月17日，公司回答表示，公司与长鑫科技暂无业务合作，所有信息请以公司在指定信息披露媒体披露的公告为准。(财闻)", "ctime": 1781672646, "time_str": "13:04:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260617/c677527456.shtml"}, {"id": "4543253", "title": "北京：前5月全市市场总消费额同比增长1.5%", "content": "北京市统计局发布2026年1-5月北京经济运行情况。1-5月，全市市场总消费额同比增长1.5%。其中，服务性消费额增长4.5%，信息、交通等领域较快增长；实现社会消费品零售总额5469亿元，下降2.5%。社会消费品零售总额中，按消费形态分，商品零售4942.7亿元，下降2.8%；餐饮收入526.3亿元，增长0.8%。从商品类别看，限额以上批发和零售业中，金银珠宝类商品零售额增长23.3%，受金价下行影响增速回落；新能源汽车类商品零售额增长4.1%，智能手表等可穿戴智能设备类、高能效等级家用电器和音像器材类商品零售额均增长5成以上；与基本生活相关的饮料类、烟酒类商品零售额分别增长4.1%和11.1%；受传统燃油车需求不足影响，汽车类商品零售额下降17.3%。（第一财经）", "ctime": 1781671775, "time_str": "12:49:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260617/c677527278.shtml"}, {"id": "4543247", "title": "快手：持续打击剧情演绎黑灰产，配合有关部门抓获34名犯罪嫌疑人", "content": "近日，快手安全中心在直播治理中发现，一些不法分子虚构富豪、法师、高官等人设，以剧情演绎方式向中老年用户高价售卖低价值商品，并承诺高价回收，诱骗中老年用户下单购买，实施诈骗行为。对此，快手安全中心不断升级风控策略，提升违规线索识别、研判和处置能力，严肃处理违规内容及账号，针对查实诈骗线索，依法固定证据并移交有关部门处理。今年以来，快手安全中心协助有关部门抓获剧情演绎诈骗犯罪嫌疑人共34名。（快手黑板报）", "ctime": 1781671603, "time_str": "12:46:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260617/c677527245.shtml"}, {"id": "4543193", "title": "现货黄金失守4320美元/盎司 纽约期金失守4340美元/盎司", "content": "现货黄金失守4320美元/盎司，日内跌0.25%。纽约期金失守4340美元/盎司，日内跌0.36%。", "ctime": 1781670888, "time_str": "12:34:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260617/c677527071.shtml"}, {"id": "4543163", "title": "伊朗央行称美应履行解冻伊资产承诺据", "content": "据伊朗塔斯尼姆通讯社6月16日报道，伊朗中央银行行长阿卜杜勒纳赛尔·赫马提在接受该媒体采访时表示，伊朗与美国签订的谅解备忘录明确规定了美国在解冻伊朗资产方面的义务，且这些义务具有清晰性和可执行性，美国方面将被要求履行其承诺。(CCTV国际时讯)", "ctime": 1781670473, "time_str": "12:27:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260617/c677526969.shtml"}, {"id": "4543133", "title": "银行理财两大业务资质低调开闸", "content": "银行理财迎利好，近日两大业务资质低调开闸。记者获悉，银行理财公司近日被首度引入银行间外币对市场，于6月16日完成理财资金在该市场的首笔交易；同时，三家理财公司已低调获批首批债券通“南向通”参与主体资格，首笔交易于上月末落地。具体来看，银行理财在银行间外币对市场的首笔交易由，由中银理财依托外汇交易中心平台与中国银行达成，业务品种是美元对瑞士法郎的即期、远期交易。而银行理财在债券通“南向通”的首笔交易，由招银理财和交行香港分行达成。据交行香港分行，在债券通“南向通”参与主体扩容后，该行主动对接理财公司，并迅速完成相关交易筹备流程。另据记者从业内多方确认，另外两家获得债券通“南向通”首批资格的理财公司，是两家国有行理财公司。（证券时报）", "ctime": 1781669355, "time_str": "12:09:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260617/c677526614.shtml"}, {"id": "4543125", "title": "6月17日午间公告一览：石基信息披露发行股份购买资产报告书（草案）", "content": "石基信息披露购买资产报告书（草案），拟通过发行股份的方式向上海云鑫、张育宏和张伟3名交易对方购买其持有的思迅软件13.50%股份（对应思迅软件14,312,500股）", "ctime": 1781669050, "time_str": "12:04:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260617/c677526467.shtml"}, {"id": "4543115", "title": "港股午评：恒生指数跌0.37%，恒生科技指数涨0.17%", "content": "港股午间收盘，恒生指数跌0.37%，恒生科技指数涨0.17%。恒指港股通ETF银华（159318）跌0.16%，港股通科技ETF鹏华（159751）跌0.35%。板块方面，建筑产品、工业集团企业板块涨幅靠前；能源设备与服务、汽车板块跌幅靠前。个股方面，琻捷电子科技涨118.52%，希迪智驾涨33.57%，建滔集团涨16.87%，中国建材涨16.45%，微创机器人-B涨12.49%；博泰车联跌9.7%，优然牧业跌8.05%，明略科技-W跌8.02%，拓璞数控跌7.52%，佳鑫国际资源跌6.92%。", "ctime": 1781668867, "time_str": "12:01:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260617/c677526395.shtml"}, {"id": "4543111", "title": "机器人持股公司在浙江成立智能机器人公司", "content": "企查查APP显示，近日，浙江多可智能机器人有限公司成立，法定代表人为史绪英，注册资本为5000万元，经营范围包含：工业机器人制造；工业机器人安装、维修；智能机器人的研发；智能机器人销售；软件开发等。企查查股权穿透显示，该公司由机器人(300024)持股的中科新松有限公司全资持股。（人民财讯）", "ctime": 1781668744, "time_str": "11:59:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260617/c677526356.shtml"}, {"id": "4543105", "title": "高伟达与国光量子、纬德信息签署三方战略合作协议", "content": "6月16日，高伟达软件股份有限公司与国内首家光量子芯片提供商北京中科国光量子科技有限公司、量子云平台服务商广东纬德信息科技股份有限公司正式签署三方战略合作协议，共同构建“量子芯片+量子云平台+金融安全应用”三位一体合作架构，联合开拓量子加密技术在金融行业的规模化产业化应用。（人民财讯）", "ctime": 1781668634, "time_str": "11:57:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260617/c677526327.shtml"}, {"id": "4543099", "title": "联创电子：公司微棱镜等光模块光学器件正在送样评测阶段", "content": "联创电子6月17日在互动平台表示，公司的微棱镜、模造玻璃透镜阵列、硅透镜阵列等光模块光学器件正在送样评测阶段。（人民财讯）", "ctime": 1781668461, "time_str": "11:54:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260617/c677526292.shtml"}, {"id": "4543079", "title": "我国将制定统一的航空医疗救护标准", "content": "记者今天了解到，市场监管总局（国家标准委）近日下达国家标准制定计划，由北京市地方标准《航空医疗救护服务规范》转化升级的《应急救援 航空医疗救护通用要求》国家标准工作启动。长期以来，我国航空医疗救护行业缺乏统一的技术规范，运营主体参差不齐、服务流程要求不一、权责边界划分不清、装备配置要求不明，严重制约了航空医疗体系整体效能的发挥。此次拟修订的国家标准，将全面吸纳北京地方标准的核心内容与实践经验，紧扣资源完备、流程规范、管理有效、持续改进四项工作重点，从机构资质、人员配置、装备设施、服务流程、安全管理等方面作出系统性规定，适用于各类有人驾驶航空器开展的医疗救护工作。《应急救援 航空医疗救护通用要求》国家标准的统一制定，将有力推动全国立体化航空医疗救护体系的构建，打通全域覆盖、响应迅速的“空中生命线”，夯实我国应急救援体系建设基础。（央视新闻）", "ctime": 1781668050, "time_str": "11:47:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260617/c677526187.shtml"}, {"id": "4543069", "title": "朱鹤新：全球创新资本配置中国动能增强，中国也为全球提供更多耐心资本", "content": "6月17日，在2026陆家嘴论坛上，国家外汇管理局局长朱鹤新表示，中国坚持全方位开放合作，依托跨境资本双向流动，创新生态、产业能力和金融服务与全球高效联通，与各国共享发展红利。一方面，全球创新资本配置中国的动能增强。从共享“中国制造”的成本与规模优势，向共建“中国创造”的科技和产业生态跃升。另一方面，中国正在为全球提供更多耐心资本，有力带动东道国产业发展，为全球产供链韧性提供支撑。此外，在中国与全球双向互动中，人民币金融纽带功能持续拓展，也为跨境资本流动创造了更加稳定、可预期的金融条件。（第一财经）", "ctime": 1781667895, "time_str": "11:44:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260617/c677526134.shtml"}, {"id": "4543063", "title": "中国—中亚荒漠化防治合作高级别会议在宁夏银川举行", "content": "在第32个世界防治荒漠化与干旱日到来之际，中国—中亚荒漠化防治合作高级别会议在宁夏银川举办。会议中，中外百余名代表围绕荒漠化防治、水土流失治理、盐碱地改良等议题展开学习与讨论。代表团实地观摩了毛乌素沙地治理成果，考察了光伏治沙、节水灌溉等生态治理项目，学习中国成熟的荒漠化防治技术和经验。外宾代表全面了解了我国荒漠化防治的发展历程、先进技术与实践经验。据悉，以此次会议为契机，宁夏将与哈萨克斯坦、乌兹别克斯坦相关机构达成合作协议，内容涵盖人员培训、技术共享及物资支持等领域。（央视新闻）", "ctime": 1781667752, "time_str": "11:42:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260617/c677526099.shtml"}, {"id": "4543061", "title": "朱鹤新：全球资本流动呈现“波动、分化与韧性”的新特征", "content": "6月17日，在2026陆家嘴论坛上，国家外汇管理局局长朱鹤新表示，2020年以来，世界动荡变革，不稳定不确定因素增多，全球资本流动呈现出“波动、分化与韧性”的新特征。一是全球金融条件快速变化，国际金融市场波动增加，叠加金融结构变化影响，资本流动的波动性上升。二是全球资金进一步向人工智能、半导体、生物制造、能源转型等未来产业集聚，不同国家、行业和资产之间分化加大。三是全球开放合作的基础依然坚实，各类主体跨境配置资源的内生动力强劲。全球金融体系韧性也持续提升，包括中国在内的许多新兴经济体，宏观调控政策和宏观审慎管理经验更加丰富，抵御外部冲击能力增强。（第一财经）", "ctime": 1781667742, "time_str": "11:42:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260617/c677526097.shtml"}, {"id": "4543057", "title": "美军印太司令部复用原名太平洋司令部", "content": "美国国防部16日宣布，美军印太司令部将正式恢复其原名，即美军太平洋司令部。美国国防部在一份声明中称，该司令部的所谓责任区域保持不变，即从美国西海岸沿岸海域延伸至印度西部边界。美军太平洋司令部1947年1月1日设立，以美军太平洋司令部的名义运作长达70余年，2018年更名为美军印太司令部。（新华社）", "ctime": 1781667516, "time_str": "11:38:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260617/c677525971.shtml"}, {"id": "4543053", "title": "广东发布山洪灾害风险预警", "content": "广东省水利厅6月17日9时发布山洪灾害风险预警：根据气象降雨预报分析，预计未来24小时，茂名高州市、化州市、信宜市，   const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
