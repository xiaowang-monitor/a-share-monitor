70, "time_str": "17:37:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260702/c677903181.shtml"}, {"id": "4643691", "title": "豪威集团：累计回购875.02万股耗资8.13亿元", "content": "豪威集团公告，公司此前披露拟以8亿元至10亿元回购股份，回购价格上限100元/股，用于员工持股计划或股权激励。截至2026年7月1日，公司已完成回购，通过集中竞价方式累计回购股份875.02万股，占总股本0.69%，回购价格区间85.22元/股至98.99元/股，支付总金额8.13亿元（不含交易费用）。回购方案实际执行情况与原方案无差异。", "ctime": 1782984963, "time_str": "17:36:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260702/c677903109.shtml"}, {"id": "4643683", "title": "“互联网企业云端招聘月”释放超20万就业岗位", "content": "记者从人力资源社会保障部了解到，“互联网企业云端招聘月”自6月开展至今，各地积极搭建供需对接平台，5000多家互联网企业超20万个岗位。活动期间，互联网大厂集中发布招聘资讯和岗位信息：京东集团释放就业机会2.5万个，覆盖技术服务、销售顾问、线下门店运营、到家服务等多类岗位。腾讯发布招聘需求8000余人，涵盖AI算法、大模型、高性能计算、基础架构等技术研究岗位。字节跳动提供约7000个岗位，涵盖大模型应用、AI搜索、视觉智能等前沿技术领域人才以及综合运营管理等多个方面。美团招聘6000人，涵盖技术、产品、金融、零售、商业分析、运营等岗位。各地深入走访互联网企业，摸清岗位空缺情况，动态更新招聘信息。运用AI、大数据等新技术，开展“沉浸式走播”、会场巡播等直播带岗活动，助力青年人才与企业精准对接。（央视新闻）", "ctime": 1782984956, "time_str": "17:35:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260702/c677903107.shtml"}, {"id": "4643675", "title": "利亚德：董事长李军提议以1亿元-2亿元回购公司股份", "content": "利亚德公告，董事长李军提议以1亿元-2亿元回购公司股份，回购价格上限不高于公司董事会审议通过回购股份方案决议前三十个交易日公司股票交易均价的150%。", "ctime": 1782984906, "time_str": "17:35:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260702/c677903068.shtml"}, {"id": "4643673", "title": "天山铝业：拟以2亿元-3亿元回购公司股份", "content": "天山铝业公告，拟以2亿元-3亿元回购公司股份，回购价格不超过20元/股。", "ctime": 1782984893, "time_str": "17:34:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260702/c677903057.shtml"}, {"id": "4643671", "title": "水晶光电：光存储业务现阶段正处于量产前验证环节", "content": "水晶光电公告，近期市场对公司AI光学业务关注度较高。公司AI光学板块主要涉及 : "", "url": "https://news.10jqka.com.cn/20260702/c677902782.shtml"}, {"id": "4643573", "title": "铜冠铜箔：选举甘国庆为董事长，获9票全票通过", "content": "铜冠铜箔公告，公司第三届董事会第一次会议于2026年7月1日召开，审议通过选举甘国庆为第三届董事会董事长，任期三年；选举产生各专门委员会委员，包括战略委员会、提名委员会、薪酬与考核委员会、审计委员会；聘任印大维为经理，王同、郑小伟、贾金涛、汪光志为副经理，王俊林为财务负责人兼董事会秘书，王宁为证券事务代表，任期均为三年。", "ctime": 1782984297, "time_str": "17:24:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260702/c677902727.shtml"}, {"id": "4643569", "title": "云中马：向特定对象发行股票申请获同意", "content": "云中马公告，公司于近日收到中国证券监督管理委员会出具的《关于同意浙江云中马股份有限公司向特定对象发行股票注册的批复》（证监许可〔2026〕1602号），同意公司向特定对象发行股票的注册申请。本次发行应严格按照报送上海证券交易所的申报文件和发行方案实施。本批复自同意注册之日起12个月内有效。公司董事会将按要求办理相关事项，并及时履行信息披露义务。", "ctime": 1782984274, "time_str": "17:24:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260702/c677902719.shtml"}, {"id": "4643561", "title": "自然资源部：日菲双边划界构成国际不法行为 中国有权追责", "content": "7月2日，自然资源部发布《关于日菲宣布启动双边海域划界的法律评论》。文件指出，日本和菲律宾近期宣布将启动在中国台湾岛以东海域的专属经济区和大陆架划界谈判。中日菲在这一区域互为海上邻国，日菲拟划界区域与中国根据国际法可主张的专属经济区和大陆架大面积重叠。此举未与中国协商，无视该区域的特定地理情况，违背国际法上主权平等和善意等原则以及合作与克制义务，构成国际不法行为。为履行国际义务、承担国家责任，日菲应立即停止推进双边海域划界谈判，积极与中国展开协商。（央视新闻）", "ctime": 1782984165, "time_str": "17:22:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260702/c677902657.shtml"}, {"id": "4643559", "title": "科大讯飞举办智能交互生态发布会，三大平台同步升级", "content": "7月2日，2026科大讯飞智能交互生态发布会在深圳举行，公司AIUI平台、多语种交互平台、机器人超脑平台同步升级。其中，AIUI平台从语音交互向多模态AI交互平台演进，融合图像理解与生成能力；多语种交互平台覆盖40余种语言，一站式赋能智能硬件出海；机器人超脑平台强化多模态感知、复杂任务理解与场景执行能力，加速机器人从实验室走向真实产业。（人民财讯）", "ctime": 1782984142, "time_str": "17:22:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260702/c677902639.shtml"}, {"id": "4643547", "title": "高凌信息：2026年第二季度获得10项发明专利证书", "content": "高凌信息公告，公司及全资子公司河南信大网御科技有限公司于2026年第二季度收到10项国家知识产权局颁发的发明专利证书，具体专利涉及拟态应用业务代码动态异构方法及系统、面向通信大数据的数据治理方法和系统、恢复拟态系统出厂设置的方法、检测有害URL的方法、互联网有害事件的检测方法、基于深度学习的声音隔离方法、基于深度学习的质谱图搜索匹配方法、一种基于FPGA实现的套接字描述符调度系统、拟态系统中基于状态检测的左括号防护方法及装置、基于边缘AI的城市噪声分析方法。", "ctime": 1782984118, "time_str": "17:21:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260702/c677902622.shtml"}, {"id": "4643545", "title": "上半年沪市红利类和现金流ETF吸引超230亿元资金净流入", "content": "2026年上半年，沪市宽基ETF分红总规模达170亿元，红利类和现金流ETF分红总规模近20亿元，在境内ETF分红总额中合计占比达93%。开年以来截至6月底，沪市红利类和现金流ETF已吸引超230亿元资金净流入，科创创新药ETF年内吸引18亿元资金净流入，总规模约30亿元，较发行规模增长近2倍。截至6月底，2025年以来上交所共推动36只主板宽基ETF、17只红利类ETF、16只自由现金流ETF及2只科创板创新药ETF上市。（第一财经）", "ctime": 1782984079, "time_str": "17:21:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260702/c677902599.shtml"}, {"id": "4643539", "title": "五粮液：截至2026年6月30日已累计回购约2亿元股份，占比0.0653%", "content": "五粮液公告，公司此前披露拟以不低于80亿元且不超过100亿元回购公司股份，回购价格不超过153.59元/股，用于减少注册资本。截至2026年6月30日，公司已累计回购股份253.58万股，占总股本0.0653%，最高成交价85.25元/股，最低成交价73.33元/股，支付总金额2亿元（不含交易费用）。其中2026年6月单月回购134.47万股，支付金额1亿元。本次回购符合相关法律法规及公司回购方案。", "ctime": 1782984052, "time_str": "17:20:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260702/c677902585.shtml"}, {"id": "4643529", "title": "先导基电：公司股票价格短期波动幅度较大", "content": "先导基电公告，公司股票于2026年6月30日、7月1日连续两个交易日内收盘价格涨幅偏离值累计达到20%，公司股票价格于2026年7月2日涨停，短期波动幅度较大，可能存在市场情绪过热、非理性炒作风险。根据中证指数有限公司发布的数据，截至2026年7月1日公司市净率为5.11倍，高于行业平均水平，存在估值较高的风险。公司2025年度及2026年第一季度业绩亏损，2025年度公司实现归属于上市公司股东净利润-1.27亿元，2026年第一季度实现归属于上市公司股东的净利润-1690.21万元。公司拟收购广东先导微电子科技有限公司（以下简称“先导微电子”或“标的公司”）的具体增资金额及对应股权比例等尚待相关工作完成后，签署相关协议予以确定；本次交易尚需公司董事会、股东会审议，最终能否实施及完成存在较大不确定性，敬请投资者注意投资风险。", "ctime": 1782984030, "time_str": "17:20:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260702/c677902577.shtml"}, {" // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
