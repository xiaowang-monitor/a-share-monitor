<style>
:root {
  --bg-primary: #0a0e17;
  --bg-card: #111827;
  --bg-card-hover: #1a2332;
  --border: #1e293b;
  --text-primary: #e2e8f0;
  --text-secondary: #94a3b8;
  --text-muted: #64748b;
  --red: #ef4444;
  --red-bg: rgba(239,68,68,0.1);

  --green-bg: rgba(34,197,94,0.1);
  --gold: #f59e0b;
  --blue: #3b82f6;
  --purple: #8b5cf6;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Noto Sans SC', sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  min-height: 100vh;
}
.mono { font-family: 'JetBrains Mono', monospace; }
.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 20px;
  transition: all 0.2s;
}
.card:hover { background: var(--bg-card-hover); border-color: #334155; }
.badge {
  display: inline-flex; align-items: center; padding: 2px 8px;
  border-radius: 6px; font-size: 12px; font-weight: 500;
}
.badge-s { background: rgba(239,68,68,0.2); color: #ef4444; }
.badge-a { background: rgba(245,158,11,0.2); color: #f59e0b; }
.badge-b { background: rgba(59,130,246,0.2); color: #3b82f6; }
.badge-c { background: rgba(100,116,139,0.2); color: #94a3b8; }
.score-bar {
  height: 6px; border-radius: 3px; background: #1e293b; overflow: hidden;
}
.score-bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s; }
.up { color: var(--red); }
.down { color: var(--green); }
.pulse { animation: pulse 2s infinite; }
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}
.glow { box-shadow: 0 0 20px rgba(59,130,246,0.15); }
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg-primary); }
::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
</style>

    </div>
  </div>

  <!-- 中列: 精选个股 -->
  <div class="lg:col-span-2">
    <div class="card">
      <div class="flex items-center justify-between mb-4">

      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-sm">
          <thead>
            <tr class="text-gray-500 text-xs border-b border-gray-800">
              <th class="text-left py-2 px-2">代码</th>
              <th class="text-left py-2 px-1">名称</th>
              <th class="text-right py-2 px-1">现价</th>
              <th class="text-right py-2 px-1">涨幅</th>
              <th class="text-right py-2 px-1">评分</th>
              <th class="py-2 px-1 text-center" style="min-width:160px">评分分布</th>
              <th class="text-right py-2 px-1">板块</th>
              <th class="text-right py-2 px-1">连涨</th>
            </tr>
          </thead>
          <tbody id="picks-table"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- 新闻流 + 交易代理 -->
<div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
  <div class="card">
    <h2 class="text-sm font-medium text-gray-400 mb-4">实时新闻流</h2>
    <div id="news-feed" class="space-y-2 max-h-96 overflow-y-auto pr-2"></div>
  </div>
  <div class="card">
    <h2 class="text-sm font-medium text-gray-400 mb-4">交易代理状态</h2>
    <div id="agent-status" class="space-y-3"></div>
  </div>
</div>

9日再次通过调解方举行会谈。伊朗外长阿拉格齐和卡塔尔调解方目前在美国，会谈预计将聚焦于磋商修订伊朗在联合国大会期间提出的七日内重开霍尔木兹海峡提议。22日，美国总统特使威特科夫和特朗普的女婿库什纳在纽约联合国大会期间与伊朗外长阿拉格齐通过调解方卡塔尔进行了间接会谈。据美媒报道，伊方提议，如美国解除海上封锁、取消石油销售制裁并恢复地区停火，伊朗将在七天内重新开放霍尔木兹海峡并重启核谈判。美国总统特朗普26日向媒体确认，他已拒绝伊朗的这一提议。27日，特朗普表示预计美国和伊朗将在接下来一周内重启谈判。(新华社)", "ctime": 1790603403, "time_str": "21:50:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260928/c680335047.shtml"}, {"id": "5261583", "title": "中国将援建斯里兰卡14座因热带气旋损毁的桥梁", "content": "中国援助斯里兰卡灾后桥梁重建紧急援助项目实施协议签署仪式28日在斯交通、公路和城市发展部举行，该援助项目旨在帮助斯里兰卡重建受热带气旋“迪特瓦”影响毁坏的桥梁。 中方专家团队经现场勘察研判后，确定为斯里兰卡重建14座桥梁，其中9座按照紧急项目标准执行。 中国驻斯里兰卡大使魏华祥在签署仪式上致辞说，此次实施协议的签署，彰显了中国政府和人民对斯里兰卡人民的深厚情谊，是对两国间“独立自强、团结互助”的米胶协定精神的传承与弘扬。他宣布，新建成的桥梁将被命名为“中斯友谊桥”，期待此次项目的顺利实施进一步拉近中斯两国人民之间的距离。 斯里兰卡交通、公路和城市发展部常务秘书阿西里·卡鲁纳瓦德纳在致辞中对中方此次援建表示感谢。他说，此次桥梁重建不仅能够解决斯里兰卡在遭受自然灾害后的短期交通运输难题，也有助于斯交通基础设施建设水平的长期提升，为广大斯里兰卡人民带来切实利益。 斯里兰卡于去年11月底至12月初遭遇热带气旋“迪特瓦”侵袭，导致600余人死亡、超过200万人受灾。(新华社)", "ctime": 1790603226, "time_str": "21:47:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260928/c680335017.shtml"}, {"id": "5261551", "title": "全国公安机关今年已立案侦办侵权假冒犯罪案件2.6万余起", "content": "公安机关依法严厉打击侵权假冒犯罪，今年以来，共立案侦办案件2.6万余起。 公安机关聚焦食品药品、生活日用、电子产品等重点行业，驰名商标、名优产品、国货潮牌等重点领域和电商平台、社交平台、直播带货等渠道环节，强化线索摸排，开展破案攻坚。公安部对177起案件挂牌督办，成功侦破浙江“4·16”制售假冒品牌汽车轮毂案、重庆“11·26”制售假冒品牌服装案、四川“12·11”制售假劣电动自行车头盔案等一批案件。公安部知识产权犯罪侦查局负责人表示，公安机关将坚持依法严厉打击各类侵权假冒犯罪，协同相关部门持续加大综合治理力度，为深入推进质量强国建设、促进高质量发展提供有力法治保障。（央视新闻）", "ctime": 1790603127, "time_str": "21:45:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260928/c680335004.shtml"}, {"id": "5261545", "title": "泽连斯基称乌国家科学院大楼遭袭致1死6伤", "content": "乌克兰总统泽连斯基当地时间9月28日表示，截至目前，俄罗斯对乌克兰国家科学院大楼的袭击已造成1人死亡、6人受伤，其中包括3名儿童。紧急救援部门仍在现场开展工作。此外俄罗斯当天下午袭击了基辅市中心一栋医疗机构建筑，救援人员正努力尽快扑灭火灾。（央视新闻）", "ctime": 1790603080, "time_str": "21:44:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260928/c680334993.shtml"}, {"id": "5261417", "title": "长鑫科技：拟241亿元和108亿元分别投建技术研发项目和存储器晶圆后道测试基地二期项目", "content": "长鑫科技公告，公司拟使用超募资金130亿元投资新建技术研发项目，同时拟通过增资和借款方式向全资子公司长鑫存储产品(合肥)有限公司提供超募资金50亿元，由其投资新建存储器晶圆后道测试基地二期项目，计划建设一座测试工厂，为DRAM存储芯片提供测试以及模组组装。上述项目投资总额分别为241亿元和108亿元。", "ctime": 1790602466, "time_str": "21:34:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260928/c680334774.shtml"}, {"id": "5261415", "title": "伊朗称已就美国航班限制措施提出申诉", "content": "据伊朗伊斯兰共和国通讯社28日报道，伊朗民航组织负责人阿布扎尔·希鲁迪当天表示，该组织已就美国对伊朗采取的航班限制措施向国际民航组织提出正式申诉。 希鲁迪说，伊朗民航组织和伊朗外交部将采取一切法律手段，致力于恢复受美国限制措施影响的伊朗国际航班。此外，伊朗已就针对其机场、飞机和雷达设施的袭击向海牙有关机构提起诉讼。 美国财政部长贝森特21日接受美国媒体采访时警告，伊朗所有航空公司23日起将被禁止开展国际业务，为受制裁伊朗航司提供服务的机场和公司也可能面临美国的处罚。 贝森特8月24日宣布美国对伊朗发起新一轮制裁措施。美国从当日起把对伊朗经济制裁范围扩大到航空、数字资产、黄金、航运和技术行业。美国财政部9月8日发布公告，把27家伊朗航空公司及其他多个公司列入“特别指定国民清单”以实施制裁。(新华社)", "ctime": 1790602463, "time_str": "21:34:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260928/c680334773.shtml"}, {"id": "5261399", "title": "鸿路钢构：2026年9月实际控制人及一致行动人持股44.25%", "content": "鸿路钢构公告，商晓波、邓烨芳及合肥鸿枫、合肥鸿轩本次权益变动前合计持有公司3.3亿股，占总股本47.77%。2026年6月30日至9月24日，因可转换公司债券转股，公司总股本由6.9亿股增加至7.45亿股，四方持股比例被动稀释至44.25%，持股数量未发生变化。", "ctime": 1790602414, "time_str": "21:33:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260928/c680334769.shtml"}, {"id": "5261303", "title": "美股开盘：美股三大指数集体低开", "content": "美股三大指数集体低开，标普500指数跌0.44%，道指跌0.71%，纳指跌0.47%。大型科技股方面，英伟达涨2.15%，亚马逊跌1.56%，微软跌2.32%。中概股方面，网易涨4.78%，哔哩哔哩涨2.75%，理想汽车涨2.17%，蔚来涨1.54%，携程涨1.14%。", "ctime": 1790602245, "time_str": "21:30:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260928/c680334561.shtml"}, {"id": "5261251", "title": "微软美股盘前跌超2%", "content": "微软美股盘前跌超2%，现报505.23美元。", "ctime": 1790601960, "time_str": "21:26:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260928/c680334498.shtml"}, {"id": "5261203", "title": "纽蒙特美股盘前跌超5%", "content": "纽蒙特美股盘前跌超5%，现报115.34美元。", "ctime": 1790601651, "time_str": "21:20:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260928/c680334432.shtml"}, {"id": "5261155", "title": "山姆回应顾客反应蛋糕内有活虫", "content": "针对顾客反映其在广东佛山山姆店购买蛋糕中吃发现上面有蛆虫，山姆方面对界面新闻回应表示：“山姆高度重视食品安全，在接到会员的相关反馈后，我们第一时间开展第三方核查，相关情况说明如下：因会员告知实物已被丢弃，第三方专业机构艺康通过会员提供的视频研判调查并出具报告显示，视频中活虫在适宜温度下发育周期约3 5天。而该产品生产、运输全程处于0 4℃冷链环境，该温度下虫卵难以发育；同时核查当日生产监控，蓝莓、草莓原料均经过规范清洗，会员视频画面里的蓝莓也未发现虫洞。综合各项信息，该虫在生产及冷链运输环节出现的可能性极低。”（界面新闻）", "ctime": 1790601361, "time_str": "21:16:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260928/c680334389.shtml"}, {"id": "5261071", "title": "14部门出台意见加强殡葬行业跨部门综合监管", "content": "记者28日从民政部获悉，为加强殡葬行业跨部门综合监管，规范殡葬服务管理秩序，民政部等14部门日前联合印发意见，就殡葬行业跨部门综合监管事项、机制、保障措施等作出要求。 意见明确跨部门综合监管事项，重点围绕死亡证明出具及遗体暂存、殡葬设施建设运营、殡葬服务机构收费行为、殡葬市场经营主体及从事殡葬相关活动的组织和个人、丧事活动、殡葬服务机构从业人员等6项重点监管事项，明确了民政、发展改革等14部门职责分工，实现监管全链条覆盖。 在建立完善跨部门综合监管机制方面，意见着眼构建常态化协同监管机制，要求加强风险隐患联合监测预警，开展跨部门联合执法抽查检查，推进问题线索跨部门联合处置，建立重大问题线索会商督办机制，加强行政执法与纪检监察、刑事司法衔接，强化信用监管及执法监督结果运用等，推动建立健全协同高效的跨部门综合监管机制。 据介绍，殡葬行业链条长、参与主体多，监管涉及部门多、协调事项多，亟需建立完善跨部门综合监管机制。出台意见是落实新修订的《殡葬管理条例》要求，补齐制度短板，消除监管盲区，建立健全各司其职、相互配合、齐抓共管的综合监管机制的重要措施。(新华社)", "ctime": 1790600934, "time_str": "21:08:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260928/c680334255.shtml"}, {"id": "5261061", "title": "海目星：拟定增募资不超过22.63亿元用于研发及补流", "content": "海目星公告，公司拟向不超过35名特定投资者发行A股股票，募集资金总额不超过22.63亿元，拟投入先进激光及智能自动化技术研发项目4.18亿元、新一代精密加工装备研发及产业化项目10.38亿元、数字化升级建设项目2.06亿元及补充流动资金6亿元。本次发行尚需股东会审议、上交所审核及中国证监会同意注册。", "ctime": 1790600880, "time_str": "21:08:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260928/c680334246.shtml"}, {"id": "5261033", "title": "*ST华幸：与产业投资人签署重整投资协议，拟受让20亿股", "content": "*ST华幸公告，公司此前披露已进入预重整，并确定杭州骋风而来与南阳木兰花联合体为中选重整投资人。近日，公司与相关重整投资人及临时管理人签署《重整投资协议》，产业投资人及指定主体合计拟受让华夏幸福20亿股转增股票，预计占重整后总股本约20.55%，重整投资款合计12亿元。", "ctime": 1790600753, "time_str": "21:05:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260928/c680334228.shtml"}, {"id": "5261023", "title": "SpaceX美股盘前跌超2%", "content": "SpaceX美股盘前跌超2%，现报145.36美元。SpaceX表示，星舰在太空中一台发动机故障后将不会进入轨道。", "ctime": 1790600707, "time_str": "21:05:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260928/c680334200.shtml"}, {"id": "5260961", "title": "东山精密：H股获中国证监会备案，不超2.34亿股", "content": "东山精密公告，公司正在申请发行境外上市股份（H股）并在香港联合交易所主板挂牌上市，拟发行不超过2.34亿股；近日已收到中国证监会出具的境外发行上市备案通知书。本次发行上市尚需取得香港证券及期货事务监察委员会和香港联合交易所等相关监管机构、证券交易所的批准、核准。", "ctime": 1790600493, "time_str": "21:01:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260928/c680334134.shtml"}, {"id": "5260937", "title": "期市夜盘开盘，国内期货主力合约涨跌互现", "content": "期市夜盘开盘，国内期货主力合约涨跌互现。跌幅方面，菜粕、沪银、沪金、豆二、20号胶跌超1%。涨幅方面，丙烯、燃料油、焦炭涨近1%。", "ctime": 1790600454, "time_str": "21:00:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260928/c680334127.shtml"}, {"id": "5260931", "title": "蓝丰生化：拟定增募资不超过3亿元偿还借款", "content": "蓝丰生化公告，公司拟向旭合资本、安徽兮茗发行股票，募集资金总额不超过3亿元，扣除发行费用后全部用于偿还金融机构借款。发行对象以现金全额认购，限售期为36个月。本次发行构成关联交易，尚需经股东会审议、深交所审核及中国证监会同意注册。", "ctime": 1790600430, "time_str": "21:00:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260928/c680334120.shtml"}, {"id": "5260845", "title": "ST美克：债务豁免事项实施完成，累计5.54亿元", "content": "ST美克公告，公司此前披露重整投资人分批实施债务豁免事项。2026年9月28日，小磁投资豁免债权1.19亿元，兴业资管豁免两笔债权合计2.23亿元。截至公告披露日，小磁投资和兴业资管已取代原债权人享有相关债权的全部权利，本次债务豁免事项已实施完成，公司已完成债务豁免的金额累计为人民币5.54亿元。", "ctime": 1790600320, "time_str": "20:58:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260928/c680334096.shtml"}, {"id": "5260795", "title": "英伟达美股盘前涨超2%", "content": "英伟达美股盘前涨超2%，现报229.69美元。", "ctime": 1790600078, "time_str": "20:54:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260928/c680334043.shtml"}, {"id": "5260791", "title": "八部门联合印发《关于金融支持服务业扩能提质的指导意见》 加大生产性服务业金融支持力度", "content": "中国人民银行等八部门联合印发《关于金融支持服务业扩能提质的指导意见》，《意见》指出，要推动金融机构转变传统重资产重抵押的融资支持理念，着力解决轻资产企业融资难题，增强服务业金融产品针对性有效性，持续提升中小企业、个体工商户等服务业经营主体的金融服务触达率，加快构建适应服务业高质量发展的金融服务体系，为服务业扩能提质提供有力金融支撑。《意见》强调，要构建多层次组织服务体系，加大生产性服务业金融支持力度，助力提升科技服务、现代物流、商务服务等发展能级；提高生活性服务业金融服务水平，促进住宿餐饮、居民服务、养老托育、文体旅游等高质量发展；做强做优金融服务业，持续完善支付、征信等服务，加强金融消费和投资权益保护。", "ctime": 1790600074, "time_str": "20:54:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260928/c680334042.shtml"}, {"id": "5260779", "title": "广汽集团：拟发行股份收购一汽丰田50%股权，发行价5.75元/股", "content": "广汽集团公告，公司拟通过发行股份方式购买中国第一汽车股份有限公司持有的一汽丰田汽车有限公司50%股权，并发行股份募集配套资金，发行对象不超过35名符合条件的特定对象。本次交易构成关联交易及重大资产重组，不构成重组上市；标的资产审计、评估尚未完成，交易价格尚未确定。", "ctime": 1790600013, "time_str": "20:53:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260928/c680334035.shtml"}, {"id": "5260769", "title": "广汽集团：拟发行股份收购一汽丰田50%股权预案获通过，2026年9月29日复牌", "content": "广汽集团公告，公司拟通过发行股份购买一汽丰田汽车有限公司50%的股权，并向不超过35名特定对象发行股份募集配套资金。2026年9月28日，公司董事会审议通过本次交易预案，相关审计、评估工作尚未完成；公司股票将于2026年9月29日复牌。", "ctime": 1790599994, "time_str": "20:53:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260928/c680334031.shtml"}, {"id": "5260655", "title": "扎克伯格：Meta推出企业平台，向企业和开发者开放AI技术", "content": "9月28日，Meta首席执行官马克·扎克伯格宣布，公司启动Meta Enterprise Platform（Meta企业平台），帮助企业利用人工智能实现业务增长和转型。扎克伯格表示，该平台将整合Meta的模型、AI智能体和基础设施等技术，初期将向企业和开发者提供包括Muse智能体、Meta Business Agent、Muse API和Muse Code在内的产品和服务。（界面新闻）", "ctime": 1790599328, "time_str": "20:42:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260928/c680333828.shtml"}, {"id": "5260645", "title": "应急管理部针对重庆、陕西启动国家地质灾害四级应急响应", "content": "受冷空气影响，今天白天，重庆北部，陕西东南部等地部分地区出现大雨或暴雨，其中重庆开州、城口等局地大暴雨（100~133毫米）。同时，据气象预测，未来三天，陕西南部、重庆等地有中雨，部分地区有大到暴雨。根据《国家突发地质灾害应急预案》及有关规定，应急管理部于9月28日针对重庆、陕西启动国家地质灾害四级应急响应。（央视新闻）", "ctime": 1790599234, "time_str": "20:40:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260928/c680333707.shtml"}, {"id": "5260633", "title": "OpenAI据报将于9月29日发布AI助手“o”", "content": "9月28日，据报道，OpenAI计划于9月29日举行的开发者日活动上发布名为“o”的AI助手。报道称，该助手定位为可持续运行、处理长期任务的个人AI助手，或采用GPT-6 Astra的一个名为“Aeon”的版本。目前OpenAI尚未公布“o”的详细信息。（界面新闻）", "ctime": 1790599204, "time_str": "20:40:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260928/c680333597.shtml"}, {"id": "5260591", "title": "刚果（金）本轮埃博拉疫情确诊病例超8000例", "content": "刚果（金）卫生部28日发布的疫情报告显示，该国本轮埃博拉疫情累计确诊病例已超过8000例。世界卫生组织日前表示，当前疫情传播仍处于较高水平，且波及范围继续扩大。(新华社)", "ctime": 1790598995, "time_str": "20:36:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260928/c680332903.shtml"}, {"id": "5260587", "title": "粤芯半导体：中签号码共有358,848个", "content": "粤芯半导体公告，公司首次公开发行股票并在创业板上市网上摇号中签结果已公布，中签号码共有358,848个，每个中签号码可认购500股粤芯半导体A股股票。网上投资者中签后需在2026年9月29日(T "url": "https://news.10jqka.com.cn/20260928/c680331543.shtml"}, {"id": "5260367", "title": "口腔种植体系统第二轮集采启动", "content": "在9月28日的口腔医用耗材集采成果发布会上，口腔种植体系统集采正式启动第二轮采购，拟将近年临床使用比较成熟的钛锆合金等种植体产品、以及临床需求较大的多牙种植基台纳入采购范围。 此次采购由国家医保局指导，四川省医保局和陕西省医保局牵头、各联盟省份共同参与。四川省医保局局长李德伟介绍，采购进一步完善集采规则，优化配套服务，坚持同一平台统一服务，通过四川招采平台同时提供口腔种植体系统、口腔正畸两类耗材的网上报量等服务。目前，采购方案制定、报量准备等相关工作正有序开展。 2023年，全国31个省份开展口腔种植医疗服务收费和耗材价格专项治理工作，实施口腔种植医疗服务收费、首轮种植体集采和牙冠竞价挂网综合治理，单颗种植牙平均费用从15000元降至7000元左右。 据介绍，截至目前，口腔种植体系统集采覆盖了1.8万家医疗机构，全国公立医院种植牙手术服务量从2022年的21万例提升至2025年的89万例，累计实际采购种植体系统347万套。(新华社)", "ctime": 1790598360, "time_str": "20:26:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260928/c680331537.shtml"}, {"id": "5260349", "title": "“江汉神农号”TBM始发 引江补汉工程9机并进", "content": "记者从中国南水北调集团了解到，“江汉神农号”TBM9月28日掘进始发，这是引江补汉工程第9台硬岩掘进机。记者了解到，“江汉神农号”为国产大直径双护盾硬岩掘进机，开挖直径11.93米，总长约175米，总重约3550吨，该设备采用洞内组装方式，将承担3号平洞上游段11.68公里输水隧洞的掘进任务。中国南水北调集团相关负责人介绍，针对岩爆、高地应力、高岩石强度、高外水压力以及断层破碎带的特殊工况，“江汉神农号”TBM配置了全套专项设备，搭载微震岩爆监测等多个系统，可实现地质风险提前预警与处置。该设备创新应用相关技术，有效抵御并降低设备在岩爆、超硬岩等不利地质条件下掘进产生的振动冲击，既可以保障施工连续性，又能够延长设备使用寿命、降低运维成本，实现施工效率与经济效益的双重提升。（新华社）", "ctime": 1790598259, "time_str": "20:24:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260928/c680331517.shtml"}, {"id": "5260335", "title": "大中矿业：加达锂矿通过评审备案，碳酸锂当量253.1万吨", "content": "大中矿业公告，公司全资子公司大中新能源提交的《四川省马尔康市加达矿区119～167线锂矿勘探报告》矿产资源储量申请近日获自然资源部复函，相关材料符合要求，四川加达锂矿首采区外围4.02平方公里新增资源量通过评审备案。此次增储后，加达锂矿累计备案碳酸锂当量由148.42万吨提升至253.1万吨。", "ctime": 1790598149, "time_str": "20:22:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260928/c680331494.shtml"}, {"id": "5260323", "title": "贝因美：实际控制人变更完成，金华臻合持有100%股权", "content": "贝因美公告，公司此前披露小贝大美控股重整计划获法院批准，实际控制人拟由自然人谢宏变更为金华市人民政府国有资产监督管理委员会。近日，相关股东变更及工商变更登记已完成，金华臻合现持有小贝大美控股100%股权；金华臻合及一致行动人合计控制公司13.35%股份，小贝大美控股已换发营业执照。", "ctime" function impactBadge(score) {

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
