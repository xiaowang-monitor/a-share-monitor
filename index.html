re": false, "source": "", "url": "https://news.10jqka.com.cn/20260401/c675698204.shtml"}, {"id": "4174129", "title": "蔚来：3月交付35486辆汽车，同比增长136.0%", "content": "蔚来公告，公司于2026年3月交付35486辆汽车，同比增长136.0%。第一季度交付83465辆汽车，同比增长98.3%。截至2026年3月31日，累计汽车交付量达108.11万辆。", "ctime": 1775037776, "time_str": "18:02:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260401/c675698180.shtml"}, {"id": "4174125", "title": "沪电股份：同意投资约68亿元建设印制电路板生产项目", "content": "沪电股份公告，同意投资约68亿元建设印制电路板生产项目及其配套设施。该项目计划以自有资金或自筹资金投资，旨在扩大公司产品产能，满足高性能、高信赖性印制电路板的中长期增量需求。项目实施后，将优化产品结构，增强核心竞争力，提高经济效益。", "ctime": 1775037741, "time_str": "18:02:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260401/c675698163.shtml"}, {"id": "4174117", "title": "韩国强化车辆限行措施 公共机关车辆单双号限行", "content": "随着中东冲突局势持续、能源供应紧张加剧，韩国政府4月1日宣布将进一步强化节能措施。韩国气候能源环境部当天宣布，自当地时间4月8日起，公共机关车辆限行将由原先的工作日“尾号限行”升级为更严格的“单双号限行”，民间车辆虽仍维持自愿限行，但在全国约3万个公共停车场将被强制实施尾号限行措施。根据韩国气候能源环境部发布的方案，韩国中央政府、地方政府、公共机构及国立、公立学校等约1.1万家单位、约130万辆公务及公务员通勤车辆将适用单双号制度，由公共机构运营的约3万个收费公共停车场（约100万个车位）将实行工作日尾号限行，周一至周五分别对应不同尾号车辆允许停放。民间车辆如不符合尾号限行规定，也将无法进入公共停车场。残疾人、孕妇、搭载学龄前儿童车辆，以及电动车、氢能源车和部分生计用车不受限行约束。（央视新闻）", "ctime": 1775037699, "time_str": "18:01:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260401/c675698155.shtml"}, {"id": "4174107", "title": "百利天恒：iza-bren的2个联合用药的II/III期临床试验获得批准", "content": "百利天恒公告，近日收到国家药品监督管理局(NMPA)正式批准签发的2个《药物临床试验批准通知书》，公司自主研发的创新生物药iza-bren（EGFR×HER3双抗ADC）的2个联合用药的II/III期临床试验获得批准。", "ctime": 1775037684, "time_str": "18:01:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260401/c675698150.shtml"}, {"id": "4174087", "title": "宁波港：2025年净利润51.68亿元，同比增长5.63%", "content": "宁波港公告，2025年营业收入310.2亿元，同比增长7.41%；净利润51.68亿元，同比增长5.63%。拟将2025年度可分配利润35.89亿元的65%向全体股东进行分配，包含2025年中期分红，公司2025年度向全体股东共计派发现金红利23.35亿元，即每10股派发现金红利1.2元（含税）。", "ctime": 1775037643, "time_str": "18:00:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260401/c675698141.shtml"}, {"id": "4174059", "title": "优思益被国务院食安办点名", "content": "记者今天了解到，针对总台报道的跨境电商进口“优思益”保健品涉嫌原产地造假、虚假宣传等问题，国务院食安办、市场监管总局、海关总署高度重视，立即组织涉事地市场监管部门和海关开展调查核实，严查违法违规行为，切实维护市场秩序，保护消费者合法权益。(央视新闻)", "ctime": 1775037607, "time_str": "18:00:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260401/c675698102.shtml"}, {"id": "4174057", "title": "十国外长强烈谴责针对联黎部队的袭击", "content": "英国外交部3月31日发表由英法等十国外长及欧盟高级代表发布的联合声明，强烈谴责近期针对联合国驻黎巴嫩临时部队（联黎部队）的袭击，敦促各方遵守国际法，保障联黎部队人员和驻地安全。 这份由比利时、克罗地亚、塞浦路斯、法国、希腊、意大利、马耳他、荷兰、葡萄牙、英国等十国外长及欧盟高级代表发布的联合声明说，坚定支持联黎部队在黎南部执行任务，呼吁保持冲突降级渠道畅通，并强烈谴责近期联黎部队遇袭事件。声明强调，这些袭击导致维和人员伤亡惨重，令人无法接受。 声明指出，应根据国际人道主义法，保护黎巴嫩平民、人道主义人员、维和人员以及包括机场、港口和桥梁在内的民用基础设施安全，同时必须尊重黎巴嫩的领土完整。声明还呼吁以色列避免进一步扩大冲突，避免在黎领土上开展地面军事行动。 近日，联黎部队安全多次受到交火影响，两起袭击事件造成3名维和人员死亡、多人受伤。(新华社)", "ctime": 1775037596, "time_str": "17:59:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260401/c675698100.shtml"}, {"id": "4174053", "title": "伊朗原子能组织发言人：袭击重水设施构成“战争罪”", "content": "据伊朗伊斯兰共和国通讯社4月1日报道，伊朗原子能组织发言人卡迈勒万迪当天表示，袭击伊朗受保障监督的核设施违反国际原则，针对伊朗重水设施的袭击构成“战争罪”，伊朗将在国内和国际层面诉诸法律途径。 国际原子能机构3月29日称，位于伊朗中央省的洪达卜重水工厂已严重损坏并停止运行。据伊朗报告，该设施在两天前遭到袭击。(新华社)", "ctime": 1775037567, "time_str": "17:59:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260401/c675698091.shtml"}, {"id": "4174037", "title": "据报道，美国官员在讨论油价达到每桶150美元的可能性", "content": "据报道，美国官员在讨论油价达到每桶150美元的可能性。（财联社）", "ctime": 1775037410, "time_str": "17:56:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.co "source": "", "url": "https://news.10jqka.com.cn/20260401/c675697849.shtml"}, {"id": "4173981", "title": "英国首相回应特朗普退出北约言论", "content": "针对美国总统特朗普抱怨北约盟友不帮助打击伊朗，进而考虑让美国退出北约的言论，英国首相斯塔默4月1日回应称：“不管我和其他人承受多大的压力，不管外界有多少杂音，我所做的决策都会以英国的国家利益为重。正因如此，我一直明确表示，这（伊朗战争）不是我们的战争，我们不会被卷入其中。”(新华社)", "ctime": 1775036892, "time_str": "17:48:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260401/c675697815.shtml"}, {"id": "4173937", "title": "三力制药：受让16个药品上市许可转让价款200万元", "content": "三力制药公告，公司与贵州汉方制药有限公司签署了《药品上市许可持有人转让协议》，约定汉方制药将其持有的16个药品的上市许可及相关权益转让给公司，其中顺铂氯化钠注射液为本次转让核心品种。合计转让价款（含税）人民币200万元。本次交易不构成关联交易，也不构成重大资产重组，根据《上海证券交易所股票上市规则》《公司章程》等相关规定，本次交易所涉事项无需提交董事会及股东会审议通过。药品上市许可持有人变更尚需药品监管部门的审批，能否顺利完成变更存在不确定性。", "ctime": 1775036316, "time_str": "17:38:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260401/c675697561.shtml"}, {"id": "4173935", "title": "凯众股份：股东杨颖韬拟减持不超过0.56%", "content": "凯众股份公告，股东杨颖韬持有2165.54万股，占总股本8.11%，计划于2026年4月24日至2026年7月23日，通过大宗交易减持不超过150万股，占总股本0.56%，所减持股份来源为IPO前取得及上市后转增股份，减持原因为个人资金需求。", "ctime": 1775036310, "time_str": "17:38:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260401/c675697560.shtml"}, {"id": "4173929", "title": "李云泽会见澳门金管局行政管理委员会主席黄善文", "content": "3月31日，国家金融监督管理总局党委书记、局长李云泽会见澳门金管局行政管理委员会主席黄善文一行。双方就加强两地监管合作、深化粤港澳大湾区金融市场互联互通、支持澳门经济发展等议题进行交流。（国家金融监督管理总局）", "ctime": 1775036206, "time_str": "17:36:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260401/c675697535.shtml"}, {"id": "4173911", "title": "长江流域今起正式进入汛期", "content": "4月1日，长江流域正式进入汛期。根据最新趋势预测，2026年汛期长江流域气候年景总体偏差，流域降水量正常偏少，但降水时空分布不均。长江委启动24小时水旱灾害防御值班值守，确保人民群众生命财产安全和城乡供水安全。（央视新闻）", "ctime": 1775036064, "time_str": "17:34:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260401/c675697475.shtml"}, {"id": "4173873", "title": "南向资金今日净卖出126.93亿港元 中国海洋石油遭净卖出居前", "content": "南向资金今日净卖出126.93亿港元。中国海洋石油、盈富基金分别遭净卖出28.81亿港元、26.28亿港元；腾讯控股、三生制药分别获净买入约10.63亿港元、1.12亿港元。", "ctime": 1775035882, "time_str": "17:31:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260401/c675697422.shtml"}, {"id": "4173871", "title": "泽连斯基：俄对乌发动大规模无人机袭击", "content": "乌克兰总统泽连斯基1日在其官方社交平台通报称，俄军当天凌晨对乌克兰发动了大规模无人机袭击，共使用了339架无人机，袭击导致卢茨克市等地发生火灾，多处民用设施受损。目前，乌克兰国家紧急服务局和公用事业部门已投入力量进行灭火和清理工作。泽连斯基透露，当天将举行多场外交活动。他强调，乌方已提议在传统节日期间停火，但得到的回应是俄军的无人机袭击。此外乌方还提议专门针对能源设施停火，但俄罗斯无视这一提议，继续攻击乌克兰的变电站等设施。他表示，是俄罗斯在继续拖延战争。（央视新闻）", "ctime": 1775035844, "time_str": "17:30:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260401/c675697414.shtml"}, {"id": "4173833", "title": "伊朗副议长：“目前最高领袖未批准任何谈判”", "content": "据伊朗法尔斯通讯社4月1日报道，伊朗伊斯兰议会副议长阿里·尼克扎德当天在伊朗塔夫雷什一场公众集会上发表公开讲话。他表示，根据伊朗宪法，战争、和平以及任何谈判的决定均属于伊朗最高领袖的权力范围，“目前最高领袖未批准任何谈判”。(新华社)", "ctime": 1775035740, "time_str": "17:29:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260401/c675697195.shtml"}, {"id": "4173823", "title": "俄国防部称俄军已完全控制卢甘斯克地区", "content": "总台记者获悉，俄罗斯国防部4月1日通报称，俄军西部集群完全控制了卢甘斯克地区。乌克兰方面对此暂无回应。(央视新闻)", "ctime": 1775035614, "time_str": "17:26:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260401/c675697121.shtml"}, {"id": "4173821", "title": "济高发展：全资子公司签署6300吨钢筋采购合同", "content": "济高发展公告，全资子公司山东瑞蚨祥贸易有限公司与济南东晟城市更新发展有限公司签署《钢筋采购合同》，瑞蚨祥贸易以（<我的钢铁网>当日项目所在地级市市场钢筋价格+37）元/吨为其房地产项目提供钢筋合计6300吨。", "ctime": 1775035610, "time_str": "17:26:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260401/c675697119.shtml"}, {"id": "4173799", "title": "我国将开展基层医疗质量改善三年行动", "content": "为保障基层医疗卫生机构医疗质量和医疗安全，国家卫生健康委等部门1日发布文件，明确开展为期三年的基层医疗卫生机构医疗质量改善行动。(新华社)", "ctime": 1775035497, "time_str": "17:24:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260401/c675697092.shtml"}, {"id": "4173791", "title": "江苏、浙江、安徽等地春假首日 长三角铁路迎来客流高峰", "content": "4月1日，长三角铁路迎来出行大客流，当日预计发送旅客318万人次，较2025年同期（4月1日）多发送旅客98.7万人次，增长约45%。在刚刚过去的3月31日，上铁集团发送旅客232.3万人次。春假与清明小长假“双假”叠加，形成6天连休假期，亲子家庭出行热情高涨，旅游、研学、探亲等客流增势明显。当天，上铁集团预售儿童票35万张，是2025年同期的20倍。其中，铁路南京直属站、合肥直属站、绍兴北站分别预售儿童票4.76万、4.07万、0.49万张，较2025年同期分别增加4.6万、3.96万、0.35万张。为让旅客假期出行更从容，上铁集团加强北京、广州、福州、南昌、长沙、汉口、郑州等直通方向以及管内往返上海、杭州、南京、合肥、扬州、苏州、无锡、常州、宁波、温州、金华、义乌、黄山、芜湖、阜阳、徐州等长三角区域内热门旅游城市间的运力增补。当天计划增开旅客列车102列、组织动车组列车重联运行261列，努力满足旅客乘车出行需求。（央视新闻）", "ctime": 1775035457, "time_str": "17:24:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260401/c675697079.shtml"}, {"id": "4173785", "title": "2025年国家自然科学基金共资助各类项目5.88万项", "content": "2025年，国家自然科学基金共资助各类科学基金项目5.88万项，资助经费370.69亿元。试点实施重大非共识项目，设立民营企业创新发展联合基金，在团队类项目中为年轻团队单设赛道，首次在青年科学基金项目（A、B类）中设置“科学工具”类赛道，深入实施面向全球的科学研究基金。 国家自然科学基金委员会近日在北京召开第九届委员会第四次全体委员会议，这是记者从会上了解到的信息。 据悉，过去一年，国家自然科学基金委员会强化基础研究体系化布局，重塑科学基金人才资助格局，强化科技战略咨询，深化全球科学交流合作，加强科研诚信建设，坚持将宝贵的科技资源投向最具创新活力的一线科研人员，圆满完成年度资助管理各项工作。 国家自然科学基金委员会主任窦贤康表示，2026年将强化基础研究战略性、前瞻性、体系化布局，进一步深化科学基金改革，持续提升资助效能，优化人才资助体系，打造基础研究“精兵强将”，拓展多元投入深度与广度，扩大国际科技交流合作，改进会风学风，构建公平公正的项目评审环境，营造良好科研生态，更好地发挥科学基金在国家创新体系中的基础性、引领性作用，推动基础研究高质量发展，有力支撑科技强国建设。(新华社)", "ctime": 1775035430, "time_str": "17:23:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260401/c675697063.shtml"}, {"id": "4173779", "title": "中国国贸：2025年净利润12.02亿元，同比下降4.76%", "content": "中国国贸公告，2025年营业收入37.7亿元，同比下降3.63%。净利润12.02亿元，同比下降4.76%。拟向全体股东每10股派发现金红利10.7元（含税），合计拟派发现 const SECTORS  = [{"name": "金融", "hit_count": 26, "etfs": []}, {"name": "数据要素", "hit_count": 21, "etfs": []}, {"name": "医药", "hit_count": 13, "etfs": []}, {"name": "军工", "hit_count": 12, "etfs": []}, {"name": "消费", "hit_count": 11, "etfs": []}, {"name": "人工智能", "hit_count": 11, "etfs": []}, {"name": "新能源", "hit_count": 9, "etfs": []}, {"name": "半导体", "hit_count": 8, "etfs": []}];
const META     = {"update_time": "2026-04-01 18:17:37", "sentiment_score": 52.14592274678112, "agents": []};

// 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',

        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
