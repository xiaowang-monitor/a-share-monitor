"source": "", "url": "https://news.10jqka.com.cn/20260806/c678719741.shtml"}, {"id": "4899101", "title": "矩阵起源完成超千万美元A轮融资", "content": "8月6日，企业级AI基础设施厂商矩阵起源宣布完成超千万美元A轮融资。本轮融资由汉得信息参与投资的基金、亚康股份与澳大利亚风险投资机构Artesian Venture Partners共同注资。本轮资金将重点用于MatrixOne Intelligence平台的研发迭代、全球市场拓展，以及智能体（Agentic AI）的规模化落地。（第一财经）", "ctime": 1785994672, "time_str": "13:37:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260806/c678719385.shtml"}, {"id": "4899081", "title": "日均近8000外籍客商涌入华强北扫货", "content": "进入暑期以来，深圳华强北迎来全球采购热潮。暑期历来是华强北外贸旺季，而今年AI硬件销售格外火热，几乎每个柜台前都有外籍面孔在询价、试戴、打包。华强北街道数据显示，今年以来华强北日均有近8000名外籍客商前来采购。截至2026年7月，华强北AI产品占商圈内电子产品的比重由2025年的41%大幅跃升至61%。2026年1-7月，华强北AI产品全品类销售额同比增长55%以上，其中AI眼镜销量激增100%，无人机、机器人销量增长60%至70%。（央视网）", "ctime": 1785994511, "time_str": "13:35:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260806/c678719281.shtml"}, {"id": "4899025", "title": "上汽集团入股核聚变公司星环聚能", "content": "企查查APP显示，近日，上海星环聚能科技有限公司发生工商变更，新增上汽集团旗下上海上汽创远创业投资合伙企业（有限合伙）等为股东，同时注册资本增至209.01万元。企查查信息显示，该公司成立于2021年，经营范围包含：余热发电关键技术研发；能量回收系统研发；节能管理服务；工业工程设计服务等。公开信息显示，星环聚能是一家核聚变公司。（人民财讯）", "ctime": 1785994407, "time_str": "13:33:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260806/c678719218.shtml"}, {"id": "4898737", "title": "张一鸣：字节跳动“拒绝蒸馏”，不用别人输出换榜单排名", "content": "8月6日，据字节跳动内部人士处消息，今年国内竞争对手开源模型的快速发展给字节跳动带来更大的压力。在近日的内部会议中，字节跳动创始人张一鸣表示，做模型要坚持长期主义、延迟满足感，而不是用别人的输出，换一时的榜单排名。据了解，张一鸣很少在Seed团队的会议上发言，但此次明确表态，字节跳动“应该愿意为长期目标牺牲一部分短期收益”。字节跳动内部对开源模型严禁蒸馏，甚至通过API检测等方式在内部加强相关限制，张一鸣认为，蒸馏会干扰真正意义上的长期技术突破。（澎湃新闻）", "ctime": 1785993769, "time_str": "13:22:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260806/c678718769.shtml"}, {"id": "4898577", "title": "电池板块短线走低，宁德时代跌近5%", "content": "电池板块短线走低，圣阳股份、宁德时代、领湃科技、金银河、容百科技等走低。", "ctime": 1785993200, "time_str": "13:13:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260806/c678718443.shtml"}, {"id": "4898423", "title": "中信证券：可灵2025—2030年收入复合增速或达104%", "content": "中信证券近日发布研报称，可灵作为快手旗下全球领先的AI视频生成模型，已成为影响快手估值的核心变量。伴随模型能力持续迭代及应用场景拓展，预计2025年至2030年可灵收入复合增长率将达到104%，2030年收入有望接近400亿元。（证券时报）", "ctime": 1785992854, "time_str": "13:07:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260806/c678718254.shtml"}, {"id": "4898305", "title": "危地马拉富埃戈火山持续喷发50小时", "content": "当地时间8月5日，危地马拉国家地震、火山、气象和水文局宣布，富埃戈火山在持续喷发50小时后归于平静。此前被迫撤离的逾1700名居民已获准返家。富埃戈火山于3日清晨开始喷发，熔岩沿山坡倾泻而下，火山灰、碎屑和高温气体形成的喷发柱高达数千米。危地马拉国家减灾协调委员会4日在火山周边三省拉响最高级别警报。该委员会5日提醒说，鉴于形势已经安全，被要求撤离的民众可以返回家中，但仍要保持警惕，因为火山随时可能再次喷发。（央视新闻）", "ctime": 1785992516, "time_str": "13:01:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260806/c678718081.shtml"}, {"id": "4898303", "title": "种植业与林业板块异动走高，秋乐种业涨超10%", "content": "种植业与林业板块异动走高，秋乐种业涨超10%，敦煌种业、康农种业、润农节水、平潭发展、永安林业等跟涨。", "ctime": 1785992463, "time_str": "13:01:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260806/c678718059.shtml"}, {"id": "4898295", "title": "国家能源局：核电将逐步进入电力市场 探索建立体现核电低碳价值的制度", "content": "国家能源局网站发布《中国核电发展报告（2026）》（编制单位：国家能源局直属中国核电发展中心）。报告显示，在全国统一电力市场体系有关政策指导下，核电将逐步进入电力市场，需加强核电参与电力市场的政策机制研究，探索建立体现核电低碳价值的制度，提升核电在市场的竞争力和友好性。", "ctime": 1785992095, "time_str": "12:54:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260806/c678717920.shtml"}, {"id": "4898293", "title": "国家能源局：我国商用钠冷快堆CFR1000完成标准设计", "content": "国家能源局网站发布《中国核电发展报告（2026）》。报告显示，我国1200兆瓦电功率商用钠冷快堆（CFR1000）完成标准设计，具备燃料增殖和核废料嬗变双重能力；2兆瓦热功率液态燃料钍基熔盐实验堆首次实现钍铀核燃料转换，成为国际上唯一在运且实现钍燃料入堆的液态燃料熔盐堆；300兆瓦电功率紧凑式小型压水堆已正式提交国际原子能机构技术安全评审申请。", "ctime": 1785992077, "time_str": "12:54:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260806/c678717911.shtml"}, {"id": "4898285", "title": "伊朗总统：最高领袖决策过程遭人利用", "content": "据伊朗伊斯兰共和国广播电视台5日报道，伊朗总统佩泽希齐扬说，目前与伊朗最高领袖穆杰塔巴联络“非常困难”，一些人利用穆杰塔巴的正常决策过程在伊朗内部制造分歧。 佩泽希齐扬说，穆杰塔巴曾在决策过程中表示，尽管自己原则上持反对意见，但如果相关程序推进，他也会接受。然而，一些试图制造分裂的人却不断夸大问题的严重性，以推进符合自身利益的议程。 佩泽希齐扬说，穆杰塔巴最近收到相关委员会提交的一份报告后表示，如果报告中的方案获得四分之三票数支持，他将接受。最终，该方案获得绝大多数支持，他接受了。“在这种尊重专家意见并据此作出决策的过程中，却有一些人伺机制造分裂，散布不公正、不诚实的言论，企图抹黑他人形象。” 佩泽希齐扬说，目前与穆杰塔巴联络“非常困难”。最高领袖对伊朗来说是“非常重要的力量源泉”，使伊朗能够继续前进。 佩泽希齐扬表示，敌人曾企图扰乱伊朗社会，但没能得逞。敌人通过加大制裁、发动军事行动等方式向伊朗施压。伊朗政府将“与人民站在一起”，维持局势稳定。 近期，有传闻称佩泽希齐扬与伊朗最高领袖、伊朗伊斯兰革命卫队存在分歧，称佩泽希齐扬可能辞职。伊朗总统办公室已多次辟谣。(新华社)", "ctime": 1785991660, "time_str": "12:47:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260806/c678717762.shtml"}, {"id": "4898281", "title": "SK海力士股价重挫10%", "content": "SK海力士股价重挫10%。", "ctime": 1785991612, "time_str": "12:46:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260806/c678717743.shtml"}, {"id": "4898279", "title": "以军称两名军人在黎南部遇袭身亡", "content": "以色列国防军6日发表声明说，两名军人在黎巴嫩南部遭黎真主党袭击身亡，另有4人受重伤。声明说，死者分别为以军第55装甲旅的一名连长与一名士兵，4名受伤士兵已送医治疗。声明没有提供更多细节。（新华社）", "ctime": 1785991598, "time_str": "12:46:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260806/c678717737.shtml"}, {"id": "4898251", "title": "德国电信将股票回购计划规模上调至最多30亿欧元", "content": "德国电信将股票回购计划规模上调至最多30亿欧元。", "ctime": 1785990853, "time_str": "12:34:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260806/c678717379.shtml"}, {"id": "4898213", "title": "台风“白海豚”影响我国已成定局 即将进入48小时台风警戒线", "content": "台风“白海豚”强度维持强台风级，中心附近最大风力14级（42米/秒）。目前“白海豚”云系结构保持完整，不过受干空气侵入的影响，外围螺旋云带存在轻微不对称，北侧对流更为明显，有“头重脚轻”之感。最新预报显示，“白海豚”将直奔我国华东沿海而来，尽管后期路径仍有较大变数，但影响我国已成定局。由此，“白海豚”即将成为1951年以来，登陆我国的、生成位置最偏东的台风，打破1822号台风“山竹”此前保持的纪录。（中国天气网）", "ctime": 1785989857, "time_str": "12:17:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260806/c678716997.shtml"}, {"id": "4898209", "title": "合肥加速打造具身智能完整产业链", "content": "机器人和具身智能是发展新质生产力的关键赛道，也是安徽聚力培育的先导产业。在安徽合肥的一处科技示范园里，当地专门建起了机器人的训练学校，从硬件制造到数据训练再到测试优化的完整产业链正在逐步形成。（央视新闻）", "ctime": 1785989651, "time_str": "12:14:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260806/c678716882.shtml"}, {"id": "4898207", "title": "韩国对原产于中国的丙烯酸丁酯作出反倾销终裁", "content": "据中国贸易救济信息网，7月23日，韩国贸易委员会发布第2026-13号公告（案件调查号23-2025-8），对原产于中国的丙烯酸丁酯作出反倾销肯定性终裁，建议韩国企划财政部对涉案产品征收为期五年的反倾销税，具体如下：泰兴市昇科化工有限公司及其关联企业税率为11.42%、上海华谊新材料有限公司及其关联企业税率为8.32%、平湖石化有限责任公司及其关联企业税率为19.17%、中国其他生产商/出口商税率为18.69%。涉案产品的韩国税号为2916.12.3000。", "ctime": 1785989498, "time_str": "12:11:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260806/c678716817.shtml"}, {"id": "4898205", "title": "安森美：预计2026年AI数据中心业务营收将增长两倍以上", "content": "安森美2026年第二季度营收为16.04亿美元，同比增长约9%，净利润约2.27亿美元，环比扭亏。据公司总裁兼首席执行官Hassane El-Khoury介绍，AI数据中心是公司增长最快的业务领域，预计该业务2026年营收将实现两倍以上增长。报告期内，公司获云基础设施电源供应商长城电源战略性AI数据中心平台项目；面向AI数据中心、机器人及工业基础设施等应用，公司推出了氮化镓（GaN）电源产品组合，覆盖40V至650V电压范围。", "ctime": 1785989319, "time_str": "12:08:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260806/c678716704.shtml"}, {"id": "4898203", "title": "全球芯片LOF：将于8月6日下午开市起停牌至当日收市", "content": "景顺长城基金管理有限公司公告，近期旗下景顺长城全球半导体芯片产业股票型证券投资基金（QDII-LOF）（场内简称：全球芯片，扩位简称：全球芯片LOF，交易代码：501225）二级市场交易价格明显高于基金份额净值，出现较大幅度溢价。2026年8月6日中午收盘，本基金二级市场的收盘价为4.000元，截至2026年8月4日，本基金基金份额净值为3.0485元。特此郑重提醒广大投资者，应密切关注二级市场交易价格溢价风险，审慎做出投资决策，如盲目投资，后续可能遭受重大损失。为保护投资者利益，本基金将于2026年8月6日下午开市起停牌至当日收市，停牌期间本基金赎回业务照常办理。", "ctime": 1785989254, "time_str": "12:07:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260806/c678716630.shtml"}, {"id": "4898197", "title": "港股午评：恒生指数跌1.75%，恒生科技指数跌1.87%", "content": "港股午间收盘，恒生指数跌1.75%，恒生科技指数跌1.87%。恒指港股通ETF银华（159318）跌1.95%，港股通科技ETF鹏华（159751）跌2.06%。板块方面，计算机存储设备、焦炭加工Ⅲ板块涨幅靠前；可选消费经销Ⅳ、可选消费经销Ⅲ板块跌幅靠前。个股方面，MINIMAX-W涨16.15%，沪上阿姨涨10.75%，维立志博-B涨8.18%，胜宏科技涨7.69%，晋景新能涨6.84%；真健康医疗-B跌20.35%，友邦保险跌8.75%，友邦保险-R跌8.55%，首钢朗泽跌7.64%，长光辰芯跌7.6%。", "ctime": 1785989145, "time_str": "12:05:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260806/c678716571.shtml"}, {"id": "4898149", "title": "超研股份：公司积极开拓核电行业无损检测应用市场", "content": "超研股份8月6日在互动平台表示，公司研制的便携式、在线式超声成像检测设备和爬壁超声检测机器人等无损检测设备可用于核电设备生产制造和在役运行的质量检测控制中，公司积极开拓核电行业无损检测应用市场。", "ctime": 1785988393, "time_str": "11:53:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260806/c678716248.shtml"}, {"id": "4898143", "title": "科兴冻干人用狂犬病疫苗获药品注册证书", "content": "8月6日，北京科兴控股（集团）有限公司旗下科兴（成都）生物制品有限公司研制的冻干人用狂犬病疫苗（Vero细胞）获得国家药品监督管理局颁发的《药品注册证书》。该疫苗基于无血清、无动物源性工艺开发，同时获批“5针法”和“简易4针法”两种免疫程序，成为国内首个符合WHO推荐简易4针法的无血清狂犬病疫苗。（人民财讯）", "ctime": 1785988240, "time_str": "11:50:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260806/c678716210.shtml"}, {"id": "4898139", "title": "8月6日午间公告一览：温州宏丰定增申请获深交所受理", "content": "温州宏丰公告，公司于2026年8月5日收到深圳证券交易所出具的《关于受理温州宏丰电工合金股份有限公司向特定对象发行股票申请文件的通知》，深交所认为申请文件齐备，决定予以受理。该事项尚需通过深交所审核并获中国证监会同意注册后方可实施。", "ctime": 1785987937, "time_str": "11:45:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260806/c678716107.shtml"}, {"id": "4898137", "title": "万科组织架构再“瘦身”：办公事业部解散，事业部缩减至7个", "content": "8月6日上午消息，万科正式撤销办公事业部。调整后，公司事业部数量由8个缩减至7个。据知情人士透露，办公事业部撤销后，各个项目并入各自城市公司，事业部负责人卢冰转任中航万科负责人，事业部部分员工转岗至城市公司，部分员工按优化方案获赔离职。目前，万科官网组织架构资料也已作出更新。对此调整，截至发稿，万科方面暂无官方回应。（新浪财经）", "ctime": 1785987794, "time_str": "11:43:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260806/c678716048.shtml"}, {"id": "4898135", "title": "全国13条河流维持超警 最大超警幅度1.28米", "content": "今天上午，水利部举行会商，分析研判全国的防汛形势，目前全国13条河流仍维持超警。截至今天9时，黑龙江、内蒙古、陕西、河北、云南等地13条河流仍维持超警，最大超警幅度1.28米。据预报，8月6日至8日，受降雨影响，浙江曹娥江支流新昌江、陕西渭河支流滈河、海南南渡江支流南叉河、云南澜沧江支流南阿河等河流可能发生超警洪水。受上游来水影响，松花江干流及支流呼兰河、黑龙江干流同江江段将维持超警。水利部提醒暴雨洪水影响地区社会公众注意防范。（央视新闻）", "ctime": 1785987748, "time_str": "11:42:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260806/c678716038.shtml"}, {"id": "4898129", "title": "贝恩资本宣布收购茶饮品牌贡茶", "content": "当地时间8月5日，贝恩资本宣布，已同意从TA Associates及贡茶全球（Gong cha Global）其他股东手中收购茶饮品牌贡茶。交易财务条款未披露。交易预计于2026年第四季度完成，须满足惯常交割条件。贡茶2006年成立于中国台湾地区，现总部位于英国，目前在33个市场经营近2200家门店。（界面新闻）", "ctime": 1785987483, "time_str": "11:38:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260806/c678715879.shtml"}, {"id": "4898123", "title": "是否追究金容范引入杠杆ETF责任？青瓦台：应优先关注市场并采取对策", "content": "韩国总统府公共关系和沟通高级秘书成基鸿6日回应了外界要求就推出单一股票杠杆ETF一事追究总统办公室政策室长金容范责任的呼声。他表示：“目前更重要的是密切关注市场，并制定相应对策。”成基鸿当天在接受采访时表示：“房地产市场和股票市场都存在较高波动性，对民生的影响也非常大，”并还补充道，“总统府全体官员都正在细致审视每一种情况，并研究如何制定相关措施。”（第一财经）", "ctime": 1785987280, "time_str": "11:34:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260806/c678715696.shtml"}, {"id": "4898121", "title": "ETF两市成交额报3550.73亿元，较昨日此时缩量17.66亿元", "content": "截至目前，ETF两市成交额报3550.73亿元，较昨日此时缩量17.66亿元，分类型来看，股票型ETF成交额1315.93 // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },

  container.innerHTML = kpis.map(k => `

    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
