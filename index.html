ime": 1785477503, "time_str": "13:58:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260731/c678581796.shtml"}, {"id": "4852573", "title": "润六尺科技：华为相关业务团队到访公司 深化推进国产算力合作", "content": "记者从润六尺科技获悉，近日，华为技术有限公司相关业务团队到访润六尺科技，双方就国产算力基础设施的行业趋势、应用场景及合作模式进行了深入交流与探讨，标志着双方在算力服务领域的合作迈出了实质性步伐。当前，深圳等多个城市的算力基础设施项目已陆续启动，全国各地的数据局也在密集推动相关规划，国产算力的市场窗口正在全面打开。面对这一历史性机遇，双方都认为，产业链各方应当发挥各自优势，形成合力。下一步，双方将继续深化沟通，围绕具体项目探索更加高效、务实的合作路径，共同推动国产算力从技术优势转化为产业价值。(人民财讯)", "ctime": 1785476788, "time_str": "13:46:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260731/c678581564.shtml"}, {"id": "4852491", "title": "国家发改委：下半年将多措并举推动经济持续向新向优向好发展", "content": "记者从国家发展改革委2026年上半年发展改革形势通报会上了解到，下半年，我国将多措并举推动经济持续向新向优向好发展。国家发展改革委表示，下半年要抓好“十五五”规划部署落实，宏观政策要发力提效，加大逆周期调节力度，充分发挥各项存量政策效能，及时谋划出台务实管用的增量政策，强化宏观政策取向一致性。在有效扩大国内需求方面，将促进投资止跌回稳，协同推进109项重大工程和“六张网”规划建设，扎实推进“两重”建设和“两新”工作，重点聚焦投资空间大、民营企业投资意愿强的成长性行业领域推出一批政策措施，让民间投资“放心投”“投得动”“多参与”；大力稳定提振消费，推动促消费政策落地。在加快建设现代化产业体系方面，将坚持因地制宜、分类施策培育壮大新兴产业和未来产业；深入实施“东数西算”工程，统筹布局、有序建设算力设施；加快打造一批人工智能标杆应用，在制造、农业、能源等重点行业加快赋能，加快人工智能法立法进程；促进服务业优质高效发展，推动重点行业提质降本降碳。在全面深化改革方面，将纵深推进全国统一大市场建设，营造公平有序的市场竞争环境，系统推进场景培育和开放，深化国资国企改革，依法促进民营经济高质量发展，保护民营企业合法权益，支持民营企业参与国家重大项目。（央视新闻）", "ctime": 1785476527, "time_str": "13:42:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260731/c678581432.shtml"}, {"id": "4852425", "title": "WTI原油跌超3%", "content": "WTI原油跌超3%，现报81.06美元/桶。", "ctime": 1785476064, "time_str": "13:34:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260731/c678581240.shtml"}, {"id": "4852419", "title": "沪深京三市成交额超2万亿元，较上日此时放量2258亿元", "content": "据同花顺iFinD数据，沪深京三市成交额超2万亿元，较上日此时放量2258亿元，预计全天成交金额约2.6万亿元。截至目前，沪市成交额9193亿元，深市成交额10668亿元，北证50成交额141亿元。", "ctime": 1785476035, 人民币2000万元。", "ctime": 1785472655, "time_str": "12:37:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260731/c678579835.shtml"}, {"id": "4851525", "title": "晶泰科技发布XtalPi Science，发起“科学智能开放生态联盟”", "content": "晶泰科技日前在沪发布XtalPi Science科学智能平台与Genius Agents科学智能体矩阵，并联合26家产业、高校及科研生态伙伴，共同发起成立 “科学智能开放生态联盟”。(上观新闻)", "ctime": 1785471709, "time_str": "12:21:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260731/c678579544.shtml"}, {"id": "4851503", "title": "美“猎鹰9”火箭第二级残骸预计将撞击月球", "content": "据美国媒体30日报道，美太空探索技术公司一枚废弃的“猎鹰9”号火箭第二级残骸预计将于8月5日撞击月球。这一事件有望产生可被地面和空间望远镜观测到的喷射羽流，为研究月球撞击过程和未来月球探测任务提供重要数据。 近日发表在预印本网站arXiv的两篇研究显示，这枚“猎鹰9”号火箭第二级重约3900公斤，预计将在美国东部时间8月5日2时35分左右（北京时间8月5日14时35分左右）以约每秒2.43公里的速度撞击月球表面。预计撞击地点位于月球爱因斯坦陨石坑附近区域。研究人员预测，撞击产生的闪光和喷射羽流可通过地面和太空观测设施观测到。 据美国媒体报道，该火箭第二级残骸来自2025年1月15日实施的一次月球着陆器发射任务。研究人员表示，在那次任务中，“猎鹰9”号火箭第二级被留在一条与月球轨道相交的高地球轨道上，目前正沿着预计将与月球表面相撞的轨道飞行。 美国洛斯阿拉莫斯国家实验室研究人员本杰明·费尔南多领衔的团队发文称，此次撞击还可用于验证未来月球地震探测任务所需的分析方法，研究月球撞击产生的尘埃和喷射羽流，评估人造太空碎片撞击可能带来的风险。研究人员表示，通过测量分析撞击产生的喷射物，能够帮助了解撞击区域月球地质状况，为研究月球构成提供数据。(新华社)", "ctime": 1785471411, "time_str": "12:16:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260731/c678579415.shtml"}, {"id": "4851501", "title": "莱茵河荷兰段水位降至历史最低", "content": "荷兰基础设施与水资源管理部30日说，受持续干旱和高温影响，莱茵河荷兰段水位已降至阿姆斯特丹标准水位（NAP）以上6.47米，创下有记录以来最低。 NAP是荷兰全国统一的高程基准面，又称水准零点。上述数据在紧邻德国边境的荷兰洛比特水文站测得，打破了该河段水位2022年8月创下的NAP以上6.48米的最低纪录。水利部门预计，未来几天莱茵河水位将进一步下降。 荷兰政府16日发布的一份公报显示，该国将水危机级别从“即将发生”调升至“实际缺水”。干旱对荷兰自然、农业和航运的影响日益加剧。 除莱茵河外，欧洲其他主要河流水位也在下降。国际科研机构“世界天气归因联盟”23日发布研究报告说，人类活动导致的气候变化加剧了欧洲当前的严重干旱。(新华社)", "ctime": 1785471394, "time_str": "12:16:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260731/c678579411.shtml"}, {"id": "4851473", "title": "恒隆集团：2026年上半年股东应占纯利7.46亿港元", "content": "恒隆集团公告，2026年上半年总收入63.41亿港元，同比增长22%。股东应占基本纯利11.23亿港元，同比下跌6%；股东应占纯利7.46亿港元，上年同期6.97亿港元。每股中期股息0.21港元。", "ctime": 1785471149, "time_str": "12:12:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260731/c678579349.shtml"}, {"id": "4851459", "title": "无视欧足联等抵制 国际足联称将继续推进商业计划", "content": "当地时间7月31日，国际足联表示，尽管受到以欧足联为首的强烈反对，但仍将继续推进拟议中的“世界杯等赛事业务股权出售”磋商程序。国际足联主席因凡蒂诺日前提出一项计划，旨在成立一家价值200亿美元的子公司来运营世界杯及其他赛事，并向私人投资者出售少数股权。因凡蒂诺称，此举是在全球推广足球的“黄金机遇”，将释放“此前未被挖掘的商业价值”，并增加对各会员协会的资金支持。（央视新闻）", "ctime": 1785470890, "time_str": "12:08:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260731/c678579202.shtml"}, {"id": "4851453", "title": "贵州省贵阳市委常委、秘书长刘本立接受审查调查", "content": "据贵州省纪委监委31日通报，贵州省贵阳市委常委、秘书长刘本立涉嫌严重违纪违法，目前正接受贵州省纪委监委纪律审查和监察调查。（新华社）", "ctime": 1785470826, "time_str": "12:07:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260731/c678579164.shtml"}, {"id": "4851423", "title": "7月31日午间公告一览：瑞丰新材完成工商变更登记并换发营业执照", "content": "瑞丰新材公告，完成工商变更登记并换发营业执照；明阳电气公告，公司为博瑞天成向中国民生银行股份有限公司广州分行(以下简称“民生银行广州分行”)申请授信业务提供连带责任保证担保，担保额度为 5,000 万元，公司与民生银行广州分行签订了《最高额保证合同》。", "ctime": 1785470684, "time_str": "12:04:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260731/c678579110.shtml"}, {"id": "4851399", "title": "习近平在中共中央政治局第二十七次集体学习时强调 强化政治引领 深化创新发展 高质量推进国防和军队现代化", "content": "中共中央政治局7月30日下午就高质量推进国防和军队现代化进行第二十七次集体学习。中共中央总书记习近平在主持学习时强调，“十五五”时期，要坚持以新时代中国特色社会主义思想为指导，深入贯彻新时代强军思想，强化政治引领，深化创新发展，高质量推进国防和军队现代化，如期实现建军一百年奋斗目标，推动基本实现国防和军队现代化取得决定性进展，为以中国式现代化全面推进强国建设、民族复兴伟业提供坚强战略支撑。(新华社)", "ctime": 1785470554, "time_str": "12:02:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260731/c678579061.shtml"}, {"id": "4851393", "title": "港股午评：恒生指数跌0.11%，恒生科技指数涨0.7%", "content": "港股午间收盘，恒生指数跌0.11%，恒生科技指数涨0.7%。恒指港股通ETF银华（159318）跌0.15%，港股通科技ETF鹏华（159751）涨0.34%。板块方面，IT咨询与其他服务、IT服务板块涨幅靠前；手机、可选消费经销Ⅳ板块跌幅靠前。个股方面，海致科技集团涨43.1%，芯碁微装涨26.99%，迈富时涨22.53%，广合科技涨20.94%，智谱涨20.53%；安克创新跌10.06%，小米集团-W跌6.89%，百威亚太跌5.39%，现代牧业跌4.61%，青岛啤酒股份跌4.53%。", "ctime": 1785470468, "time_str": "12:01:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260731/c678579023.shtml"}, {"id": "4851365", "title": "美联储年内加息？景顺首席全球市场策略师：即便加也是一次性，明年转向降息", "content": "景顺（Invesco）首席全球市场策略师莱维特（Brian Levitt）接受记者采访时表示，尽管年底前再加息一次的可能性有所增加，但鉴于通胀预期仍锚定在较低水平，即便再次加息，也仅属于本轮紧缩周期尾声阶段的“一次性”微调。他还判断，美联储最终将在2027年转向降息。（第一财经）", "ctime": 1785470247, "time_str": "11:57:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260731/c678578926.shtml"}, {"id": "4851361", "title": "江苏先导首台12寸高端晶圆级光学磁控溅射设备正式交付", "content": "7月30日，江苏先导微电子自主研发的首台Star600-EOSS 12寸高端精密光学磁控溅射量产设备，在江苏徐州高新区生产基地完成设备组装、联调，成功通过自动化与工艺验证，正式交付国内头部晶圆厂，标志着公司在高端晶圆级光学镀膜装备领域实现了从研发、制造到产业化交付的重要突破。", "ctime": 1785470130, "time_str": "11:55:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260731/c678578874.shtml"}, {"id": "4851357", "title": "12条中日航线7月取消全部航班，1195个赴日航班取消", "content": "航班管家DAST最新统计显示，在暑运前半段的7月，共有12条中日航线取消全部航班，比六月有所减少。整个7月中国大陆赴日本共有1195个航班取消，取消率为31.4%。（第一财经）", "ctime": 1785470062, "time_str": "11:54:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260731/c678578851.shtml"}, {"id": "4851349", "title": "高能环境投资成立半导体材料新公司", "content": "企查查APP显示，近日，北京高能时代半导体材料有限公司成立，经营范围包含：半导体分立器件制造；半导体分立器件销售；电子专用设备销售；半导体器件专用设备销售等。企查查股权穿透显示，该公司由高能环境全资持股。", "ctime": 1785469861, "time_str": "11:51:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260731/c678578767.shtml"}, {"id": "4851315", "title": "A股午评：创业板指高开震荡涨5.04% AI应用方向全面走高", "content": "截至午盘，上证指数涨0.76%，深证成指涨3.16%，创业板指涨5.04%，北证50涨3.4%。三市成交额17980亿元，较上日放量3353亿元。全市场超4500家个股上涨。\n板块题材上，智谱AI、存储芯片、元件板块涨幅居前；银行、保险概念板块跌幅居前。\n盘面上，智谱AI概念持续走高，传智教育5连板，正和生态、易点天下、凯文教育、蓝色光标、深桑达A、中文在线涨停，优刻得涨超15%，新致软件、科蓝软件、并行科技、海天瑞声、每日互动、平治信息、汉得信息、亚信安全、金山办公、青云科技、值得买、光云科技、彩讯股份、凡拓数创、拓斯达、华宇软件、首都在线、因赛集团涨超10%。存储芯片板块高开震荡，利和兴、炬光科技、中科飞测、南亚新材等数只个股涨超10%，快客智能、诚邦股份等数只个股涨停。元件板块大幅高开，宝鼎科技、泰晶科技涨停，南亚新材、中英科技、迅捷兴涨超10%，本川智能、弘信电子、三环集团、威尔高、鹏鼎控股跟涨。银行板块震荡走弱，农业银行跌超4%，中国银行、宁波银行、交通银行、工商银行跟跌。保险板块走弱，中国太保、中国平安跌超2%，中国人保、中国人寿跟跌。", "ctime": 1785468902, "time_str": "11:35:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260731/c678578247.shtml"}, {"id": "4851309", "title": "期货午评：贵金属板块领涨期市，碳酸锂暴跌超3%失守14万关口", "content": "期货午评：早盘收盘，商品跌多涨少，碳酸锂、焦煤、燃料油跌超3%，焦炭跌近3%，SC原油、低硫燃料油、纯苯、乙二醇、苯乙烯跌超2%。涨幅方面，沪锡、苹果、钯涨近2%，20号胶、铂、红枣涨超1%。", "ctime": 1785468803, "time_str": "11:33:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260731/c678578179.shtml"}, {"id": "4851305", "title": "ETF两市成交额报3903.65亿元，较昨日此时放量925.49亿元", "content": "截至目前，ETF两市成交额报3903.65亿元，较昨日此时放量925.49亿元，分类型来看，股票型ETF成交额1764.99亿元，债券型ETF成交额1252.4亿元，货币型ETF成交额263.54亿元，商品型ETF成交额31.92亿元，QDII型ETF成交额590.81亿元。", "ctime": 1785468718, "time_str": "11:31:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260731/c678578104.shtml"}, {"id": "4851301", "title": "ETF午评：创业板人工智能ETF领涨10.42%，银行ETF领跌3.22%", "content": "ETF午间收盘涨跌不一，创业板人工智能ETF（159388）领涨10.42%，创业板人工智能ETF（159381）涨10.40%，创业板人工智能ETF（159279）涨10.28%，银行ETF（515290）领跌3.22%，银行ETF（516210）跌2.99%，银行ETF（512410）跌2.84%。", "ctime": 1785468691, "time_str": "11:31:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": 加快推进《网络安全法》修订草案和欧盟《工业加速器法案》落地作出回应。《网络安全法》修订草案拟在信息通信、能源、交通等18个关键行业全面排除“高风险供应商”相关产品和服务，《工业加速器法案》拟对外国企业在欧投资、参加公共采购设置诸多限制条件。中国工商界对此表示关切，认为相关做法明显超过维护安全的必要限度，与世贸组织基本规则、国际服务贸易承诺及投资保护规则相冲突。（央视新闻）", "ctime": 1785468339, "time_str": "11:25:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260731/c678577820.shtml"}, {"id": "4851247", "title": "南向资金净买入超20亿港元", "content": "据同花顺iFinD数据，截至目前，南向资金净买入超20亿港元，其中港股通（沪）买入超10.61亿港元，港股通（深）买入超10.32亿港元。", "ctime": 1785468313, "time_str": "11:25:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260731/c678577798.shtml"}, {"id": "4851175", "title": "日本央行预计2026财年核心CPI涨幅为2.5%，低于此前预测的2.8%", "content": "日本央行预计2026财年核心CPI涨幅为2.5%，低于此前预测的2.8%。", "ctime": 1785467833, "time_str": "11:17:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260731/c678577480.shtml"}, {"id": "4851135", "title": "日本央行风险报告：经济活动面临的下行风险以及物价面临的显著上行风险均已减弱", "content": "日本央行风险报告：经济活动面临的下行风险以及物价面临的显著上行风险均已减弱。", "ctime": 1785467608, "time_str": "11:13:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260731/c678577331.shtml"}, {"id": "4851099", "title": "日本央行将目标利率维持在1%不变，符合市场预期", "content": "日本央行将目标利率维持在1%不变，符合市场预期。", "ctime": 1785467526, "time_str": "11:12:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260731/c678577279.shtml"}, {"id": "4851063", "title": "多支双创人工智能ETF涨超8%", "content": "创业板人工智能ETF华夏（159381）、科创创业人工智能ETF景顺（159142）、科创人工智能ETF广发（588760）涨超8%。AI相关个股持续走强，昆仑万维20cm涨停，金山办公涨超15%，澜起科技、寒武纪、新易盛等涨超6%。", "ctime": 1785467455, "time_str": "11:10:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/ const META     = {"update_time": "2026-07-31 14:28:05", "sentiment_score": 59.0, "agents": []};

// 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
