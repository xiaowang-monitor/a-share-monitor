.down { color: var(--green); }

@keyframes pulse {

const NEWS     = [{"id": "5194143", "title": "宁德时代拟以14亿元在雅安新建4万吨碳酸锂年产能", "content": "今日（9月17日），记者注意到，雅安经济技术开发区管理委员会近日发布宁德时代雅安锂盐生产基地项目环境影响评价信息第一次公示。项目总投资14亿元，拟建设年产约4万吨碳酸锂、3万吨磷酸二氢锂及13万吨元明粉产能。(每日经济新闻)", "ctime": 1789634530, "time_str": "16:42:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260917/c680015733.shtml"}, {"id": "5194137", "title": "广西超3万吨转体桥成功跨越两条铁路", "content": "记者从中铁二十五局集团有限公司了解到，17日，广西滨海公路长坜立交桥成功完成转体施工，顺利跨越钦防高铁与南防铁路两条铁路线，为全线如期建成通车奠定坚实基础。长坜立交桥位于广西防城港市茅岭镇，是广西滨海公路全线重难点工程。其转体段长158米，宽39.4米，采用双幅T构转体梁设计，面积相当于约14个标准篮球场大小，转体总重量达3.6万吨。(新华社)", "ctime": 1789634458, "time_str": "16:40:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260917/c680015657.shtml"}, {"id": "5194121", "title": "英特尔美股盘前涨超2%", "content": "英特尔美股盘前涨超2%，现报103.08美元。", "ctime": 1789634303, "time_str": "16:38:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260917/c680015391.shtml"}, {"id": "5194113", "title": "会畅科技：公司终止不超过人民币3000万元基金投资", "content": "会畅科技公告，公司此前披露拟以不超过人民币3000万元自有资金认购嘉兴银石恒拓股权投资合伙企业基金份额。因基金后续投资安排及相关交易条件发生变化，原定投资安排预计不具备继续实施条件，公司与基金管理人协商一致决定终止本次投资，并配合完成基金解散、清算及注销程序。", "ctime": 1789634268, "time_str": "16:37:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260917/c680015345.shtml"}, {"id": "5194085", "title": "澳大利亚宣布收紧签证政策以削减移民规模", "content": "澳大利亚内政部长托尼·伯克17日宣布，政府将收紧留学生家属签证并调整打工度假签证等政策，以削减移民规模。伯克当天在堪培拉表示，政府计划将本财年海外净移民人数降至24.5万人，2027至2028财年进一步降至22.5万人。根据新规，留学生将不再自动享有携家属赴澳的资格。家属已附属于其签证下的在澳留学生、来自太平洋岛国和东盟国家的留学生以及博士生将获豁免。澳政府数据显示，2025至2026财年，澳大利亚共批准约33.7万份学生签证，其中约4.6万份发给主申请人的附属申请人。（新华社）", "ctime": 1789634158, "time_str": "16:35:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260917/c680015164.shtml"}, {"id": "5194079", "title": "王文涛部长与欧委会贸易和经济安全委员谢夫乔维奇举行视频会谈", "content": "9月17日，商务部部长王文涛应约与欧委会贸易和经济安全委员谢夫乔维奇就中欧经贸问题举行视频会谈。（商务部）", "ctime": 1789634124, "time_str": "16:35:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260917/c680015121.shtml"}, {"id": "5194067", "title": "GLM披露国内首个RSI工程实践", "content": "记者获悉，今日，GLM团队披露了在递归自我改进（Recursive Self-Improvement，RSI）方向的首个工程化实践，由GLM-5.3驱动的Infra Agent完成了GLM-5.3-Flash推理基础设施的设计、调试与优化，实现模型对自身运行系统的反向改进。这是国内大模型厂商首次公开跑进生产环境的RSI案例。据官方博客，Infra Agent在超10万张国产芯片组成的集群上从零完成生产级推理服务搭建，不到两周将端到端吞吐提升至初始基线的3倍，硬件利用效率与单Token成本达到主流NVIDIA GPU相当水平，并支持1M上下文窗口与多模态请求。该系统已经受真实流量检验，GLM-5.3-Flash以匿名模型Ox-Alpha在OpenCode、OpenRouter上线，6天Token调用量超过62万亿。此次实践的技术突破在于，Agent已不再局限于生成代码，而是能够围绕推理系统开展完整的工程闭环：自主分析性能瓶颈、定位精度缺陷、修改底层代码、执行分层测试，并根据实验反馈持续迭代。GLM团队表示，系统尚未达到完全自主设计和训练下一代模型的阶段，但RSI的早期形态已经出现，即，模型建设推理系统，系统再反过来支撑模型运行。（21世纪经济报道）", "ctime": 1789633974, "time_str": "16:32:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260917/c680014904.shtml"}, {"id": "5194055", "title": "乌称俄军发动新一轮空袭，首都基辅18人受伤", "content": "乌克兰空军17日在社交媒体发文称，16日晚至17日凌晨，俄军对乌克兰发动新一轮空袭，俄军导弹和无人机击中了乌境内36处地点，另有5处地点被导弹或无人机碎片击中。空袭主要目标是乌首都基辅、扎波罗热州和敖德萨州。乌空军称，截至上午8时，乌防空火力和电子战部队拦截和压制了131架各型无人机。截至发稿时，乌防空预警系统显示俄军空袭仍在进行中。（新华社）", "ctime": 1789633945, "time_str": "16:32:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260917/c680014871.shtml"}, {"id": "5194015", "title": "蚂蚁集团正式接入千问办公", "content": "记者获悉，蚂蚁集团正式接入千问办公，千问办公将为蚂蚁集团全体员工提供智能办公解决方案，融合蚂蚁自有的Agent能力，打通数字员工、蚂蚁钉、项目管理等内部服务，并衔接蚂蚁内部AI安全管控底座，形成覆盖个人办公助理与企业数字员工的办公Agent基建。（人民财讯）", "ctime": 1789633717, "time_str": "16:28:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260917/c680014582.shtml"}, {"id": "5194013", "title": "小米、刘强东等入股上海五源识远私募基金", "content": "企查查APP显示，近日，上海五源识远私募基金合伙企业（有限合伙）发生工商变更，新增小米关联公司瀚星创业投资有限公司、刘强东控股的宿迁天强股权投资合伙企业（有限合伙）等为合伙人，同时出资额由1000万元增至4.5亿元。企查查信息显示，该企业成立于2026年6月，经营范围包含：以私募基金从事股权投资、投资管理、资产管理等活动。（人民财讯）", "ctime": 1789633638, "time_str": "16:27:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260917/c680014478.shtml"}, {"id": "5194009", "title": "江龙船艇：已交付“平陆001”号指挥管理船，还有3艘将服务于平陆运河的船舶在建中", "content": "江龙船艇9月17日在互动平台表示，公司关注平陆运河的开通。已经交付了“平陆001”号指挥管理船。该船总长近40米，专为平陆运河复杂江海联动水域量身打造，系集巡查监管、现场指挥、应急处置、会商调度于一体的水上“移动指挥中枢”，将为平陆运河安全高效地通航运行发挥重要保障作用。此外，公司还有3艘将服务于平陆运河的船舶在建中。（人民财讯）", "ctime": 1789633593, "time_str": "16:26:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260917/c680014416.shtml"}, {"id": "5194005", "title": "交大铁发：董事罗杰拟减持不超过0.12%股份", "content": "交大铁发公告，董事罗杰持有公司48.75万股，占总股本0.4735%，拟通过集中竞价或大宗交易方式减持不超过12.19万股，占总股本0.12%，减持期间为自公告披露之日起15个交易日之后的3个月内。", "ctime": 1789633566, "time_str": "16:26:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260917/c680014379.shtml"}, {"id": "5193997", "title": "翔港科技：牧鑫青铜2号协议转让8.14%股份完成过户", "content": "翔港科技公告，公司此前披露牧鑫青铜2号拟向董婷婷女士转让3449.6万股股份，占公司总股本的8.14%。本次协议转让已通过上海证券交易所合规性确认，并于2026年9月17日取得《证券过户登记确认书》，过户日期为2026年9月16日，过户登记手续已办理完毕。", "ctime": 1789633524, "time_str": "16:25:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260917/c680014274.shtml"}, {"id": "5193987", "title": "中巴举行边界联合委员会首次会议", "content": "9月16日至17日，中巴（基斯坦）边界联合委员会首次会议在伊斯兰堡举行。联委会中方首席代表、外交部边界与海洋事务司副司长李亚与巴方首席代表、外交部中国司司长乔杜里共同主持。两国中央部门和地方政府代表参会。会议在友好、坦诚的氛围中举行。双方积极评价《中巴边界管理制度协定》落实情况，就各领域涉边合作事项交换意见，同意发挥好边界联委会机制作用，进一步深化两国边界管理与合作。会后，双方签署会议纪要。（界面新闻）", "ctime": 1789633289, "time_str": "16:21:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260917/c680013930.shtml"}, {"id": "5193985", "title": "王毅会见印度尼西亚国家经济委员会主席卢胡特", "content": "2026年9月17日，中共中央政治局委员、外交部长王毅在北京会见印度尼西亚国家经济委员会主席卢胡特。(外交部网站)", "ctime": 1789633266, "time_str": "16:21:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260917/c680013899.shtml"}, {"id": "5193979", "title": "国际品牌超20%，上海将迎来世界设计之都大会", "content": "记者17日从上海市政府新闻发布会上获悉，由上海市人民政府、联合国教科文组织共同主办的2026年世界设计之都大会将于9月28日至30日召开，主会场设在上海市黄浦区。其中，主场展览将于9月26日提前向公众开放。上海自2010年加入联合国创意城市网络，今年即将迎来第5届世界设计之都大会，包含开幕式、主展览、工业文化发展大会以及系列论坛和活动。今年大会将紧扣智能化、绿色化设计发展趋势，汇聚近千名国内外专家学者、产业领军人物，研讨人工智能设计、绿色可持续设计、文化传承创新和设计之都建设。大会主展馆约8000平方米，AI设计主题展、绿色设计专题展、U35设计人才展将展示设计行业的最新趋势和创新成果，其中国际品牌超20%、新锐潮流品牌占比达40%。专题展馆约3000平方米，包括“上海设计100+”专题展、长三角工业设计展、上海大学展区等。户外嘉年华约4000平方米，打造创意市集和城市家具体验区。（新华社）", "ctime": 1789633061, "time_str": "16:17:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260917/c680013636.shtml"}, {"id": "5193973", "title": "航天智造：已向大股东核实，没有相关事项", "content": "有投资者在互动平台向航天智造提问，市场传闻有外资拟收购公司大股东股份，请问该消息是否属实？控股股东是否有相关接洽？航天智造回复称，公司控股股东四川航天技术研究院（简称“航天七院”）作为航天科技集团旗下以航天为本的大型高科技企业集团，是我国航天重大装备批生产基地、宇航产品研制生产基地和重要航天产品配套协作基地。对于相关市场传闻，公司已向大股东核实，没有相关事项，敬请投资者以公司在指定媒体发布的公告为准。（人民财讯）", "ctime": 1789633032, "time_str": "16:17:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260917/c680013598.shtml"}, {"id": "5193907", "title": "港股收评：恒生指数跌0.44%，恒生科技指数跌0.34%", "content": "港股收盘，恒生指数跌0.44%，恒生科技指数跌0.34%。恒指港股通ETF银华（159318）跌0.47%，港股通科技ETF鹏华（159751）跌0.24%。板块方面，摄影器材、添加剂板块涨幅靠前；油品石化贸易、非金属矿开采Ⅲ板块跌幅靠前。个股方面，金斯瑞生物科技涨14.31%，海光芯正涨13.86%，剂泰科技-P涨12.7%，华宝国际涨11.78%，中远海能涨7.85%；怡俊集团控股跌15.29%，凯乐士科技跌10.42%，真健康医疗-B跌10.12%，深演智能跌9.87%，三一国际跌7.21%。", "ctime": 1789632606, "time_str": "16:10:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260917/c680013004.shtml"}, {"id": "5193847", "title": "惠伦晶体为豆包AI手机提供核心时钟器件", "content": "9月16日，搭载豆包AI手机助手的努比亚NaviX Ultra（即“豆包手机”）正式发布。作为本款机型供应商之一，惠伦晶体TSX 76.8MHz（料号：1Z76800001）适配高通骁龙SOC，为终端通信稳定运行提供底层时钟保障。(人民财讯)", "ctime": 1789632214, "time_str": "16:03:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260917/c680011478.shtml"}, {"id": "5193823", "title": "美股大型科技股盘前普涨，SK海力士涨超1%", "content": "美股大型科技股盘前普涨，Meta、SK海力士、SpaceX、亚马逊、特斯拉、美光科技、英伟达、谷歌A涨超1%，微软涨0.9%，苹果涨0.4%。", "ctime": 1789632091, "time_str": "16:01:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260917/c680010850.shtml"}, {"id": "5193815", "title": "美股中概股盘前涨跌互现，哔哩哔哩跌1%", "content": "美股中概股盘前涨跌互现，小鹏集团涨1%，富途控股涨0.8%，百度涨0.5%，拼多多涨0.4%，网易涨0.2%，阿里巴巴跌0.1%，携程跌0.6%，哔哩哔哩跌1%。", "ctime": 1789632075, "time_str": "16:01:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260917/c680010775.shtml"}, {"id": "5193729", "title": "国铁集团试点铁路跨境运输运单无纸化", "content": "记者从国铁集团获悉，今天起，绥芬河口岸试点应用国际联运电子运单，替代传统纸质运单开展跨境运输。铁路国际联运运单是办理跨多国铁路运输的合同凭证，载明了货物品类、重量、运行线路、发收货人、承运人等信息，以往办理国际联运需要随车传递一式多份的纸质运单。试点应用国际联运电子运单后，客户无需办理纸质运单，从发站受理到口岸站交接、到站交付，全程运输途中都将基于各方可信的电子数据开展作业，将有效解决纸质运单随车传递效率低、纸质单证份数多、跨境交接手续复杂等痛点，规范国际联运数据采集，降低物流单证管理和传输成本，提升跨境运输综合效能。（央视新闻）", "ctime": 1789631489, "time_str": "15:51:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260917/c680010348.shtml"}, {"id": "5193711", "title": "中企在阿塞拜疆投资建设的大型光伏项目正式并网", "content": "由寰泰能源股份有限公司投资建设的戈布斯坦100兆瓦光伏电站项目16日在阿塞拜疆巴库举行并网仪式。 阿塞拜疆总统阿利耶夫在出席仪式期间表示，阿塞拜疆和中国自2025年建立全面战略伙伴关系以来，各领域务实合作进展良好。可再生能源领域成为两国合作亮点，欢迎更多中企来阿投资兴业。阿塞拜疆可再生能源丰富，开发潜力巨大，政府正加快推进能源转型，提升绿色电力出口能力。 戈布斯坦100兆瓦光伏电站项目位于加拉达格区，包含约20万块太阳能电池板，配套建设1座110千伏变电站。项目投入运营后，预计年发电量约2亿千瓦时，每年可节约天然气消耗约4500万立方米，减少碳排放约9.7万吨。(新华社)", "ctime": 1789631262, "time_str": "15:47:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260917/c680010186.shtml"}, {"id": "5193709", "title": "上半年A股上市公司税法遵从水平持续提升", "content": "记者9月17日从国家税务总局获悉，从A股上市公司已经公开披露的数据看，2026年上半年，我国A股上市公司合规管理水平持续提升，税法遵从意识明显增强。据中国上市公司协会发布的境内股票市场上市公司2026年半年度经营业绩报告，上半年，全市场上市公司实现营业收入37.76万亿元，同比增长7.6%，增速保持平稳；实现净利润3.58万亿元，同比增长19.5%，增速较上年全年提升16.7个百分点。税务部门统计，根据上市公司公开财务数据，今年上半年，A股上市公司缴纳各项税费2.53万亿元，同比增长4.5%，增速分别低于营收和净利润增速3.1个和15个百分点，上市公司综合税负较去年同期略降低0.2个百分点至6.7%。上半年，上市公司缴纳税收占税务部门征收的税收收入比重接近26%，自2023年以来基本稳定在这个水平。（新华社）", "ctime": 1789631250, "time_str": "15:47:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260917/c680010169.shtml"}, {"id": "5193693", "title": "日本高市内阁完成首次改组，维新会议员首次入阁", "content": "日本当地时间17日下午，内阁大臣认证仪式在位于东京的日本皇宫举行，改组后的高市内阁正式成立。这是高市自去年10月上任以来的首次内阁改组，标志着自民党与维新会由阁外合作转向阁内合作。当日下午公布的阁僚名单显示，内阁官房长官木原稔、外务大臣茂木敏充、防卫大臣小泉进次郎、财务大臣片山皋月等人留任。在首次入阁的人员中，众议员簗和生与关芳弘曾因自民党的“黑金”丑闻而受到党内处分，此次分别担任农林水产大臣和文部科学大臣。这也是“黑金”丑闻曝光后，首度有因此受到党内处分的议员入阁。维新会的前干事长中司宏担任规制改革担当大臣。此次改组的另一个焦点是日本前总务大臣林芳正没有入阁。林芳正是去年自民党总裁选举时高市的竞争者。（央视新闻）", "ctime": 1789631134, "time_str": "15:45:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260917/c680010105.shtml"}, {"id": "5193681", "title": "希荻微：公司涉4844.06万元诉讼已立案", "content": "希荻微公告，Nam David Ingyun以劳动争议为由起诉公司，涉案金额4844.06万元，诉请公司将325.76万股股票期权按1.73元/股行权登记或赔偿损失。目前法院已立案受理，案件尚未开庭审理，公司作为被告将积极应诉。", "ctime": 1789631055, "time_str": "15:44:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260917/c680010077.shtml"}, {"id": "5193673", "title": "福建高速：控股股东福建省高速公路集团有限公司拟增持不超过2%股份", "content": "福建高速公告，控股股东福建省高速公路集团有限公司拟自本公告披露之日起12个月内，通过集中竞价方式增持公司A股股份，增持金额不低于人民币1.3亿元（含）、不超过人民币2.3亿元，增持比例不超过公司总股本的2%。资金来源包括不超过人民币2亿元的专项贷款及自有资金。", "ctime": 1789630826, "time_str": "15:40:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260917/c680010000.shtml"}, {"id": "5193657", "title": "美国国会通过法案授权总统对购买俄石油国家加征关税，外交部回应", "content": "9月17日，外交部发言人郭嘉昆主持例行记者会。彭博社记者提问，美国国会已通过一项法案，授权美国总统特朗普可对购买俄罗斯石油产品的国家加征关税。请问外交部对此有何评论？郭嘉昆表示，中国历来在平等互利的基础上同世界各国开展正常的经贸合作，有关合作既不针对第三方，也不受第三方的干扰和胁迫。“我们一贯反对没有国际法依据，没有经过联合国安理会授权的长臂管辖。”(澎湃新闻)", "ctime": 1789630609, "time_str": "15:36:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260917/c680009823.shtml"}, {"id": "5193653", "title": "中国瑞林：与KCM签订4.98亿美元合同但尚未生效", "content": "中国瑞林公告，公司与KONKOLA COPPER MINES(KCM)PLC签署赞比亚7万吨/年新建铜尾矿浸出厂项目合同，合同金额约为4.98亿美元，折合人民币约33.78亿元。合同已由双方签字盖章完成但尚未生效，合同经双方签字盖章后28天或公司收到预付款后生效，以晚到时间为准。", "ctime": 1789630563, "time_str": "15:36:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260917/c680009804.shtml"}, {"id": "5193647", "title": "泽连斯基任命科瓦利斯基为代理总检察长", "content": "当地时间17日，乌克兰总统泽连斯基签署总统令，任命安东·科瓦利斯基为代理总检察长，乌克兰总统府网站已公布相关总统令。14日，泽连斯基签署总统令，解除了克拉夫琴科的总检察长职务。此前，乌克兰国家反腐败局启动相关侦查行动，克拉夫琴科牵涉相关案件材料。科瓦尔斯基于2025年7月1日起担任乌克兰赫梅利尼茨基州检察院负责人。（央视新闻）", "ctime": 1789630520, "time_str": "15:35:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260917/c680009785.shtml"}, {"id": "5193635", "title": "第四届中非和平安全论坛举行", "content": "第四届中非和平安全论坛17日在北京举行。本届论坛主题为“安全共筑：七十年风雨同舟新形势并肩担当”，来自非盟和41个非洲国家的防务部门和军队代表、驻华使节出席，国防部长董军出席论坛并作主旨发言。 董军说，今年是中非开启外交关系70周年。在双方领导人坚强引领下，中非在反帝反殖斗争中并肩作战，在促进和平发展事业中协力担当，走出一条同舟共济、安全共筑的防务合作之路。中非安全合作有利于双方发展和世界稳定，应赓续传统友谊，走好平等互利的长久合作之路。中国军队愿同非方加强战略协作，完善全方位多层级防务交流机制，深化区域海上安全合作，提升新兴领域防务能力，打造更多务实成果，为构建新时代全天候中非命运共同体作出新贡献。 与会的非方代表表示，中国是非洲国家的重要伙伴，感谢中方在国防和军队建设领域对非方的帮助和支持。非洲安全与全球安全紧密联系，愿与中方继续加强防务安全合作，为非中关系发展贡献力量。(新华社)", "ctime": 1789630431, "time_str": "15:33:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260917/c680009723.shtml"}, {"id": "5193595", "title": "现货黄金站上4330美元/盎司", "content": "现货黄金站上4330美元/盎司，日内涨1.61%。", "ctime": 1789630217, "time_str": "15:30:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260917/c680009597.shtml"}, {"id": "5193591", "title": "美股纳斯达克100指数期货涨超1%", "content": "美股纳斯达克100指数期货涨超1%，标普500指数期货涨0.84%，道琼斯指数期货涨0.83%。", "ctime": 1789630168, "time_str": "15:29:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260917/c680009550.shtml"}, {"id": "5193557", "title": "美团：中秋国庆机票预订量同比增长44%", "content": "9月16日，美团数据显示，今年中秋国庆机票预订量同比增长44%。其中，飞行距离超过2000公里的长线机票预订量同比增长76%，占比超过四分之一；预订两个及以上目的地的机票用户同比增长70%。（人民财讯）", "ctime": 1789629722, "time_str": "15:22:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260917/c680009399.shtml"}, {"id": "5193553", "title": "内蒙古满洲里公路口岸进出口贸易值创新高", "content": "记者17日从内蒙古自治区满洲里市口岸管理办公室获悉，今年1至8月，满洲里公路口岸进出口贸易值实现突破性增长，累计完成进出口贸易值1056.6亿元，同比增长58.2%，历史同期首次超过铁路口岸，创下公路口岸开通以来最好成绩；同期，满洲里铁路口岸完成进出口贸易值1051.9亿元，同比增长33.7%。满洲里市口岸管理办公室主任张世朴介绍，今年以来，满洲里口岸以机电产品为代表的高附加值商品出口保持强劲增长，汽车、电工器材、电脑及其零部件等品类出口量价齐升；电动载人汽车、锂电池、太阳能电池出口增势强劲，二手车出口规模持续扩大，出口产品结构加快向价值链中高端攀升。张世朴表示，公路口岸贸易值首超铁路口岸，标志着满洲里口岸“公铁并进”格局更加巩固、贸易结构更加均衡。满洲里市口岸管理办公室会同满洲里海关等部门，深化跨关区联动服务，让通关流程大幅精简，单台车每月物流和时间成本明显降低。（新华社）", "ctime": 1789629544, "time_str": "15:19:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260917/c680009216.shtml"}, {"id": "5193537", "title": "签署备忘录，特朗普将加拿大产品排除出美政府采购计划", "content": "美国总统特朗普当日签署一份总统备忘录，将源自加拿大的产品排除出美政府采购计划。根据备忘录，特朗普指示白宫管理和预算办公室主任和美国贸易代表与其他部门一起识别并采取一切法律允许的措施，把源自加拿大的产品排除在联邦民用采购体系之外。白宫管理和预算办公室主任还应告知其他部门有关美国国内替代产品的信息。特朗普还指示美国贸易代表继续监控加拿大联邦和省级政府采购过程中给予美国产品的待遇。备忘录称，加拿大政府的“购买加拿大”政策为美国企业进入加政府采购市场设置了新障碍，加拿大各省也限制美国企业进入地方政府采购市场。（新华社）", "ctime": 1789629461, "time_str": "15:17:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260917/c680009148.shtml"}, {"id": "5193495", "title": "捷克一核电站反应堆机组因故障暂停运行", "content": "捷克能源企业CEZ集团证实，泰梅林核电站二号反应堆机组16日因故障暂停运行。据德新社以CEZ集团和泰梅林核电站人士为消息源报道，这座核电站二号机组“非核部分控制系统”检测到故障，已与电网解列；一号机组未受影响，保持满负荷运行。泰梅林核电站发言人马雷克·斯维塔克16日说，技术人员当天对二号机组进行检查，“更换了控制柜内发生故障的电子板卡”。后续检测仍在进行，二号机组有望17日恢复运行。（新华社）", "ctime": 1789629188, "time_str": "15:13:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260917/c680009048.shtml"}, {"id": "5193475", "title": "现货黄金站上4320美元/盎司", "content": "现货黄金站上4320美元/盎司，日内涨1.36%。", "ctime": 1789629108, "time_str": "15:11:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260917/c680009021.shtml"}, {"id": "5193469", "title": "商务部回应欧委会公共采购法草案设置“欧洲优先”条款", "content": "商务部17日举行例行新闻发布会，新闻发言人何亚东在回应有关提问时表示，中方注意到欧委会发布了《公共采购法》的立法草案。草案设置了“欧洲优先”条款，还要求在评标标准中纳入安全等非市场因素，排除或限制不符合条件的第三国企业。中方对此高度关切。何亚东说，中方敦促欧方遵守世贸规则，保持市场开放，修改法案中的歧视性条款，为企业在欧投资经营创造公平、透明、非歧视的营商环境。中方将密切关注欧方立法进程，及时评估相关影响。（新华社）", "ctime": 1789629064, "time_str": "15:11:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260917/c680008995.shtml"}, {"id": "5193467", "title": "商务部：中美经贸团队正就降税等议题保持密切交流", "content": "商务部17日举行例行新闻发布会，新闻发言人何亚东在回答有关中美双方300亿美元相互降低关税安排磋商最新进展的提问时说，目前中美双方经贸团队正就有关议题保持密切交流，后续将适时发布有关进展。(新华社)", "ctime": 1789629036, "time_str": "15:10:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260917/c680008988.shtml"}, {"id": "5193379", "title": "欧洲主要股指开盘集体上涨", "content": "欧洲主要股指开盘集体上涨，欧 // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
