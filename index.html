<style>
:root {
  --bg-primary: #0a0e17;
  --bg-card: #111827;

  --blue: #3b82f6;
  --purple: #8b5cf6;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Noto Sans SC', sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  min-height: 100vh;
}
.mono { font-family: 'JetBrains Mono', monospace; }
.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 20px;
  transition: all 0.2s;
}
.card:hover { background: var(--bg-card-hover); border-color: #334155; }
.badge {
  display: inline-flex; align-items: center; padding: 2px 8px;
  border-radius: 6px; font-size: 12px; font-weight: 500;
}
.badge-s { background: rgba(239,68,68,0.2); color: #ef4444; }
.badge-a { background: rgba(245,158,11,0.2); color: #f59e0b; }
.badge-b { background: rgba(59,130,246,0.2); color: #3b82f6; }
.badge-c { background: rgba(100,116,139,0.2); color: #94a3b8; }
.score-bar {
  height: 6px; border-radius: 3px; background: #1e293b; overflow: hidden;
}
.score-bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s; }
.up { color: var(--red); }
.down { color: var(--green); }
.pulse { animation: pulse 2s infinite; }
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}
.glow { box-shadow: 0 0 20px rgba(59,130,246,0.15); }
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg-primary); }
::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
</style>

  <!-- 中列: 精选个股 -->
  <div class="lg:col-span-2">

              <th class="text-left py-2 px-1">名称</th>
              <th class="text-right py-2 px-1">现价</th>
              <th class="text-right py-2 px-1">涨幅</th>
              <th class="text-right py-2 px-1">评分</th>
              <th class="py-2 px-1 text-center" style="min-width:160px">评分分布</th>
              <th class="text-right py-2 px-1">板块</th>
              <th class="text-right py-2 px-1">连涨</th>
            </tr>
          </thead>
          <tbody id="picks-table"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- 新闻流 + 交易代理 -->
<div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
  <div class="card">
    <h2 class="text-sm font-medium text-gray-400 mb-4">实时新闻流</h2>
    <div id="news-feed" class="space-y-2 max-h-96 overflow-y-auto pr-2"></div>

  <div class="card">
    <h2 class="text-sm font-medium text-gray-400 mb-4">交易代理状态</h2>
    <div id="agent-status" class="space-y-3"></div>
  </div>
</div>

l"}, {"id": "5154813", "title": "康冠科技：多款AI眼镜产品正处于研发阶段", "content": "康冠科技9月11日在互动平台表示，公司持续布局AI终端硬件新赛道，目前多款AI眼镜产品正处于研发阶段。产品规划搭载近眼显示模块，融合多模态AI交互能力，着力打造新一代轻量化人机交互终端。相关产品计划于2026年下半年至2027年陆续推向市场。由于相关行业整体仍处于市场早期阶段，公司相关产品落地节奏、商业化成效尚存在不确定性，敬请投资者注意投资风险。", "ctime": 1789102201, "time_str": "12:50:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260911/c679820813.shtml"}, {"id": "5154789", "title": "富时中国A50指数期货跌幅收窄至1%以内", "content": "富时中国A50指数期货跌幅收窄至1%以内。", "ctime": 1789101777, "time_str": "12:42:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260911/c679820724.shtml"}, {"id": "5154769", "title": "美媒称沙特请求特朗普打击胡塞遭拒", "content": "据美国“阿克西奥斯新闻网（Axios）”援引两名美国官员的话报道，沙特王储兼首相穆罕默德·本·萨勒曼当地时间9月10日两次致电美国总统特朗普，敦促其对也门胡塞武装发动打击。报道称，特朗普拒绝了这一请求。美国官员表示，美国政府目前“无意对胡塞武装采取直接军事行动”。（CCTV国际时讯）", "ctime": 1789101328, "time_str": "12:35:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260911/c679820683.shtml"}, {"id": "5154751", "title": "行云科技：公司在手订单的利润率受上游供应商采购价格影响", "content": "行云科技9月11日在互动平台表示，公司在手订单的利润率受上游供应商采购价格影响。公司核心长单采用“按月交付、按月回款、逐月确认收入”模式，若上游供应商采购上涨或下跌，公司已签订但尚未完成交付的订单仍有可能根据市场行情协商调整服务合同。需要提示的是，公司受上游硬件供给、采购周期、资金筹集、产能及交付运维能力等多重因素约束，若相关条件发生不利变化或资源获取不及预期，可能对相关业务收入和利润实现产生一定影响。", "ctime": 1789101181, "time_str": "12:33:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260911/c679820638.shtml"}, {"id": "5154721", "title": "国铁南宁局中秋国庆假期预计发送旅客750万人次", "content": "今年中秋、国庆假期铁路运输期限为9月23日至10月8日，共16天，国铁南宁局预计发送旅客750万人次。其中，10月1日为客流高峰，预计发送旅客84万人次，同比增长4.2%。铁路部门提醒，按照火车票提前15天发售的规则，9月11日起可购买9月25日（中秋节）车票。（央视新闻）", "ctime": 1789100983, "time_str": "12:29:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260911/c679820611.shtml"}, {"id": "5154719", "title": "华为常务董事杨超斌：算力底座已成为智能时代不可或缺的新型基础设施", "content": "9月10日，在2026中国联通合作伙伴大会上，华为常务董事、ICT BG CEO杨超斌表示，随着Agentic AI走进现实，算力底座已成为智能时代不可或缺的新型基础设施。他介绍，中国联通已规模部署昇腾算力及384超节点落地，并推进昇腾950与联通云适配。华为支撑联通算力平台实现业界主流模型0Day首发，显著提升算效，构建AI Infra能力；双方基于昇腾底座联合拓展行业解决方案，推动办公、法律助手等行业AI应用上架联通云。未来，华为将持续助力中国联通构建端到端全栈AI服务能力体系。连接能力方面，杨超斌介绍，目前，中国联通已实现超330个城市的5G-A规模部署，华为支持联通在北京、天津、上海等地率先建成FDD大上行网络，并将AI技术融入语音、数据等核心业务，为用户提供差异化体验保障。（人民财讯）", "ctime": 1789100952, "time_str": "12:29:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260911/c679820609.shtml"}, {"id": "5154713", "title": "CBOT玉米主力合约跌超1%", "content": "CBOT玉米主力合约跌超1%，现报528.25美分/蒲式耳。", "ctime": 1789100856, "time_str": "12:27:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260911/c679820598.shtml"}, {"id": "5154711", "title": "道明证券：预计日本央行将在2026年9月和12月各加息25个基点", "content": "道明证券预计，日本央行将在2026年9月和12月各加息25个基点，随后在2027年4月、7月和10月再次加息。", "ctime": 1789100788, "time_str": "12:26:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260911/c679820591.shtml"}, {"id": "5154709", "title": "睿能科技：汽车水泵方案进入批量稳定供应阶段", "content": "睿能科技在9月11日举行的2026年半年度业绩说明会上表示，公司汽车水泵方案已通过多家头部厂商车规认证，进入批量稳定供应阶段。（蓝鲸新闻）", "ctime": 1789100751, "time_str": "12:25:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260911/c679820588.shtml"}, {"id": "5154703", "title": "马来西亚吉隆坡综合指数下跌1%", "content": "马来西亚吉隆坡综合指数下跌1%至1688.01点。", "ctime": 1789100542, "time_str": "12:22:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260911/c679820559.shtml"}, {"id": "5154695", "title": "耐科装备：截至8月底 在手订单3.3亿元", "content": "耐科装备在举行的2026年半年度业绩说明会上表示，截至8月31日，公司在手订单为3.3亿元，其中半导体封装设备业务占75%左右；半导体封装设备订单中，国内订单占比较高。", "ctime": 1789100214, "time_str": "12:16:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260911/c679820455.shtml"}, {"id": "5154693", "title": "印度NIFTY房地产指数下跌3.9%", "content": "印度NIFTY房地产指数下跌3.9%。", "ctime": 1789100186, "time_str": "12:16:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260911/c679820449.shtml"}, {"id": "5154689", "title": "日本央行观察：经济学家预计9月加息，明年1月前或再加息", "content": "9月11日，对52名经济学家的调查显示，受访者均预计日本央行将在9月18日结束的两日议息会议上加息，93%预计明年1月前还将再次加息，其中约三分之一预计12月加息。调查显示，约46%的受访者预计日本央行加息节奏将加快至大致每季度一次，较7月调查时普遍预计每半年加息一次明显提速。受访者对本轮紧缩周期终端利率的预期中值维持在1.75%，意味着未来还可能加息3次。", "ctime": 1789100042, "time_str": "12:14:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260911/c679820419.shtml"}, {"id": "5154683", "title": "9月11日午间公告一览：中广核新能源8月发电量1776.3吉瓦时，同比增长15.1%", "content": "中广核新能源公告，2026年8月完成发电量1776.3吉瓦时，同比增长15.1%；截至2026年8月31日止八个月累计发电量12719.2吉瓦时，同比下降0.6%。其中，中国风电项目发电量同比增长22.1%，韩国项目同比增长21.9%。", "ctime": 1789099802, "time_str": "12:10:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260911/c679820393.shtml"}, {"id": "5154677", "title": "我国面向全球首次发布“智能找矿”系统", "content": "自然资源部在2026中国国际矿业大会上，面向全球首次正式发布“智能找矿（AI-OreSeeking）”系统（以下简称“系统”）。该系统由中国地质调查局自主研发，为矿产资源预测评价提供一站式智能化解决方案，标志着地质找矿工作正式从“经验驱动”跨入“智能驱动”的全新阶段，为全球矿产勘查领域带来了新的技术范式。应用场景方面，系统能够适配多个矿种、多阶段矿产勘查工作需求。在矿种覆盖上，系统可应用于金、铁、铜、铝、锂、钴、镍、铅锌、铬、钾盐、铀等固体矿产资源调查、勘查与评价工作。（财联社）", "ctime": 1789099515, "time_str": "12:05:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260911/c679820295.shtml"}, {"id": "5154671", "title": "健信超导：3.0T无液氦超导磁体预计下半年完成样机开发", "content": "健信超导在9月11日召开的2026年半年度业绩说明会上表示，公司在研项目稳步 // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

function renderKPI() {

    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>

    </div>

}

    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [

    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }

}

    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
