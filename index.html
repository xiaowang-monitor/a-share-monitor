html"}, {"id": "4602963", "title": "上期所20号胶主力合约大跌5% 橡胶主力合约跌超3%", "content": "上期所20号胶主力合约大跌5%，报14135元/吨；橡胶主力合约跌超3%，报16465元/吨。", "ctime": 1782451915, "time_str": "13:31:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260626/c677739305.shtml"}, {"id": "4602941", "title": "韩国KOSPI指数跌幅收窄至不足6%，此前一度重挫近9%", "content": "韩国KOSPI指数跌幅收窄至不足6%，此前一度重挫近9%。", "ctime": 1782451674, "time_str": "13:27:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260626/c677739226.shtml"}, {"id": "4602937", "title": "沪深京三市成交额超2.7万亿元，较上日此时缩量281亿元", "content": "据同花顺iFinD数据，沪深京三市成交额超2.7万亿元，较上日此时缩量281亿元，预计全天成交金额约3.5万亿元。截至目前，沪市成交额12248亿元，深市成交额14594亿元，北证50成交额173亿元。", "ctime": 1782451578, "time_str": "13:26:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260626/c677739204.shtml"}, {"id": "4602935", "title": "韩国总统李在明表示，到2030年培育五家价值1万亿韩元的国防创新企业", "content": "韩国总统李在明表示，到2030年培育五家价值1万亿韩元的国防创新企业。(蓝鲸新闻)", "ctime": 1782451534, "time_str": "13:25:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260626/c677739197.shtml"}, {"id": "4602921", "title": "小鹏机器人调整：新设九部门，何小鹏兼任产品部负责人", "content": "为进一步推动机器人业务的发展和量产落地，小鹏集团最近对机器人中心作出了新一轮的组织架构升级和人事任命。记者获悉，小鹏机器人中心新设立九个二级部门。其中，何小鹏宣布亲自兼任机器人中心负责人，目前还兼任机器人中心产品部负责人，直接听取产品部内各组织负责人汇报。另外，何小鹏还直接听取顾捷、刘先明、于涛等部门负责人汇报，后者分别担任具身系统工程部、通用基座部（虚拟）与品牌营销部（代）的负责人。此前何小鹏在内部信中表示，他基本每周有完整的一天“围绕着机器人业务和机器人团队做深入的思考、讨论”。（21世纪经济报道）", "ctime": 1782451413, "time_str": "13:23:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260626/c677739170.shtml"}, {"id": "4602915", "title": "一季度全国市场监管部门完成食品安全监督抽检58.61万批次", "content": "记者今天了解到，2026年一季度，全国市场监管部门坚持问题导向，强化全链条抽检，完成食品安全监督抽检58.61万批次，总体不合格率为1.88%。从食品品种看，粮食加工品，食用油、油脂及其制品，畜禽肉及副产品，肉制品，鲜蛋，乳制品不合格率分别为0.30%、0.48%、0.51%、1.17%、1.53%、0.08%；蔬菜、水果、水产品不合格率分别为4.05%、5.28%、2.80%。从检验项目看，农药残留不合格率3.22%，有机物污染不合格率1.33%，超范围超限量使用食品添加剂不合格率0.86%，微生物污染不合格率0.84%，兽药残留不合格率0.81%，质量指标不合格率0.45%，重金属污染不合格率0.14%。从变化趋势看，水产制品、水产品、鲜蛋等15类食品不合格率与上年同期相比有所降低，特殊膳食食品、豆类、保健食品等24类食品不合格率与上年同期相比有所上升。针对抽检不合格产品，市场监管部门已经及时开展核查处置，严格控制食品安全风险。（央视新闻）", "ctime": 1782451319, "time_str": "13:21:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260626/c677739154.shtml"}, {"id": "4602911", "title": "泽连斯基称已批准新情报行动", "content": "乌克兰总统泽连斯基25日在社交媒体发文称已批准一项为期40天的情报行动，旨在“迫使”俄方结束战事。连续数月以来，乌克兰国家安全局通过使用各类无人机，在乌前线阵地上展现了“最高水平”的作战效能。乌国家安全局下属的“阿尔法”特种作战中心在打击俄军人员及装备方面“处于领先地位”。（新华社）", "ctime": 1782451183, "time_str": "13:19:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260626/c677739128.shtml"}, {"id": "4602909", "title": "半导体材料板块午后持续活跃，有研硅触及20CM涨停", "content": "半导体材料板块午后持续活跃，有研硅触及20CM涨停，此前TCL中环涨停，立昂微、沪硅产业、西安奕材跟涨。消息面上，随着成熟制程需求回暖、AI应用持续扩张，叠加能源、运费及原材料成本高企，半导体硅片厂商已经开始酝酿新一波涨价。据报道，环球晶、合晶、台胜科近期相继释放出涨价信号，这些供应商的6英寸硅片已率先完成涨价，8英寸需求快速升温，12英寸产品上则已陆续与客户展开新一轮价格协商。", "ctime": 1782451177, "time_str": "13:19:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260626/c677739126.shtml"}, {"id": "4602903", "title": "杭州今日成功出让永久河宅地 招商蛇口60.94亿元竞得", "content": "杭州今日成功出让永久河宅地。该地块规划建筑面积11.81万平方米，起始价34.04亿元，吸引房企激烈争夺，竞价历时约3小时、共243轮。最终，该地块由招商蛇口以60.94亿元竞得，成交楼面价51577元/平方米，溢价率79.03%。（财联社）", "ctime": 1782451030, "time_str": "13:17:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260626/c677739080.shtml"}, {"id": "4602899", "title": "我国在自主指令集领域发起的首个综合性开源社区启动", "content": "在6月25日召开的2026开放原子开源生态大会上，龙芯中科技术股份有限公司联合开放原子开源基金会正式启动开放原子龙架构社区，这是我国在自主指令集领域发起的首个综合性开源社区，标志着国产芯片根技术生态建设全面提速。据悉，龙架构已获得GNU组织编号258的专属指令集架构标识，成为与x86、ARM并列的开源世界顶层指令集系统。龙芯中科已向700多个国际开源社区贡献超百万行源代码，相关产品在电子政务、金融、能源等关键领域实现规模化落地。（科技日报）", "ctime": 1782451021, "time_str": "13:17:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260626/c677739078.shtml"}, {"id": "4602893", "title": "俄称击落47架飞向莫斯科的无人机", "content": "当地时间6月26日，总台记者获悉，根据俄罗斯首都莫斯科市长索比亚宁通过社交媒体发布的信息，当天2时24分至7时23分，俄军防空系统已击落47架飞向莫斯科的无人机。\n\n据俄罗斯国防部26日清晨通报，过去一夜，俄军防空力量在多地拦截并摧毁660架乌克兰固定翼无人机。(央视新闻)", "ctime": 1782450945, "time_str": "13:15:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260626/c677739053.shtml"}, {"id": "4602881", "title": "英国王室说白金汉宫翻修后国王不住", "content": "英国王室25日宣布，白金汉宫明年完成大规模翻修后，国王查尔斯三世和王后卡米拉不会在这里居住。这一决定意味着更多公众有机会参观这处建筑。查尔斯和卡米拉决定继续留在白金汉宫附近的克拉伦斯宫居住，查尔斯从王储时期就在这里居住。英国王室司库詹姆斯·查默斯25日说，白金汉宫现在和将来都是王室礼仪活动中心、主要办公场所。（新华社）", "ctime": 1782450722, "time_str": "13:12:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260626/c677738993.shtml"}, {"id": "4602865", "title": "国家税务总局推出集团企业“税收贡献账单”", "content": "继向纳税人推送“税收红利账单”之后，国家税务总局探索建立集团企业涉税数据准确归集、精准推送、高效应用的工作流程，创新推出集团企业“税收贡献账单”服务，按统一标准归集展示集团企业年度纳税数据，帮助其更准确全面地掌握整体纳税情况，更好提高纳税遵从、履行社会责任，为高质量发展营造法治公平的税收环境。税务总局纳税服务司有关负责人介绍，目前，税务部门初步选取了央企上市公司及民营企业等500多家重点集团，并于6月中旬试点开展了向集团总部推送整个集团上年度“税收贡献账单”的工作。（国家税务总局）", "ctime": 1782450498, "time_str": "13:08:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260626/c677738926.shtml"}, {"id": "4602853", "title": "习近平会见孟加拉国总理塔里克", "content": "6月26日上午，国家主席习近平在北京人民大会堂会见来华正式访问的孟加拉国总理塔里克。两国领导人共同宣布构建新时代中孟命运共同体，推动两国关系向更高水平发展。\n\n习近平表示，中方始终高度重视发展中孟关系，坚持面向全体孟加拉国人民的睦邻友好政策。无论国际形势如何变化，中方都将坚持中孟友好大方向不动摇，始终做孟方值得信赖的好朋友、好邻居、好伙伴。今年是中国共产党成立105周年。回顾历史，我们团结带领中国人民从积贫积弱成功走出中国式现代化道路，靠的就是坚持独立自主、自立自强，坚持把国家发展进步的命运牢牢掌握在自己手中。中方支持孟加拉国维护国家独立、主权和领土完整，反对外部干涉。愿同孟方加强治国理政经验交流，密切各层级往来，深化战略沟通，增进政治互信，在涉及彼此核心利益和重大关切问题上继续相互支持。(新华社)", "ctime": 1782450340, "time_str": "13:05:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260626/c677738886.shtml"}, {"id": "4602839", "title": "沪深京三市成交额超2.5万亿元，较上日此时缩量156亿元", "content": "据同花顺iFinD数据，沪深京三市成交额超2.5万亿元，较上日此时缩量156亿元，预计全天成交金额约3.6万亿元。截至目前，沪市成交额11284亿元，深市成交额13553亿元，北证50成交额162亿元。", "ctime": 1782450262, "time_str": "13:04:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260626/c677738855.shtml"}, {"id": "4602811", "title": "深半协：2025年深圳集成电路产业实现销售收入3610.4亿元", "content": "深圳市半导体行业协会咨询委员会主任周生明在2026中国（深圳）集成电路峰会上表示，长期以来，我国集成电路长期存在大额贸易逆差，但是近年来中国集成电路出口增长率超过进口增长率，也是国产半导体产业走向世界的一个佐证。据统计，2025年深圳集成电路产业实现销售收入3610.4亿元，同比增长27.1%，超额完成2700亿元的规划目标，产业链日趋完善，创新成果不断涌现。", "ctime": 1782450169, "time_str": "13:02:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260626/c677738828.shtml"}, {"id": "4602769", "title": "面向中小集成商，宁德时代线上直销平台上线", "content": "6月26日，记者获悉，宁德时代线上直销平台“宁德时代商城”正式上线，目标客户是小批量需求的中小集成商。该平台目前在售产品包括：100Ah，280Ah(1P)，314Ah三款储能电芯，3箱即可起订，降低采购门槛。（第一财经）", "ctime": 1782449794, "time_str": "12:56:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260626/c677738723.shtml"}, {"id": "4602765", "title": "深圳通报房地产领域违规自媒体账号典型案例", "content": "为进一步规范房地产领域网络信息传播秩序，深圳市住建、网信部门持续深入开展专项整治，督促属地网站平台严格落实主体责任，依法依约处置一批违规自媒体账号。现将部分典型案例通报。根据有关政策规定，相关账号已被平台依法依约予以关闭3个月处置。（人民财讯）", "ctime": 1782449787, "time_str": "12:56:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260626/c677738720.shtml"}, {"id": "4602755", "title": "杰富瑞将莫德纳目标价从45美元上调至53美元", "content": "杰富瑞将莫德纳目标价从45美元上调至53美元。", "ctime": 1782449353, "time_str": "12:49:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260626/c677738583.shtml"}, {"id": "4602753", "title": "阿根廷强调在国际法框架下维护马岛主权", "content": "阿根廷外交部长巴勃罗·基尔诺25日表示，阿根廷政府将在国际法框架下采取一切必要措施，维护对马尔维纳斯群岛（简称马岛，英国称福克兰群岛）的主权。 阿根廷外交部在一份声明中说，阿根廷将坚定不移恢复对马尔维纳斯群岛、南乔治亚岛、南桑威奇群岛及周边海域的主权，强烈反对相关国家企业在主权争议地区进行油气勘探和生产活动。 联合国非殖民化特别委员会24日通过决议，敦促英国与阿根廷就马尔维纳斯群岛主权争端进行谈判，寻求以和平方式解决这一主权争端。 阿根廷和英国一直对马岛主权归属存有争议。1965年联合国大会通过第2065号决议，认定英国和阿根廷之间存在主权争端。1982年4月2日，马岛战争爆发。阿根廷战败后一直没有放弃对马岛主权的要求，英国则拒绝与阿根廷就马岛主权问题进行谈判。(新华社)", "ctime": 1782449217, "time_str": "12:46:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260626/c677738556.shtml"}, {"id": "4602727", "title": "“十五五”能源领域新设两项指标 促进节能降碳", "content": "在国务院新闻办今天举行的新闻发布会上，国家能源局发展规划司司长任育之介绍，能源领域是碳达峰的主战场，“十五五”时期，我们将以更大力度、更实举措，加快能源绿色低碳转型。任育之介绍，“十五五”时期，围绕转型降碳，我国设置了5项量化指标。其中，非化石能源消费比重、非化石能源发电量比重、电能占终端能源消费比重这3项指标，接续“十四五”提出了更高目标；新设置了2项指标：一项是单位发电量碳排放指标，“十五五”的目标是下降10%以上，这是提升我国电力系统的绿色转型和效率提升的综合性指标；另一项是重点行业节能量指标，通过节能降碳改造和技术创新，重点行业“十五五”将节约用能1.5亿吨标准煤以上。（央视新闻）", "ctime": 1782447968, "time_str": "12:26:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260626/c677738271.shtml"}, {"id": "4602725", "title": "全球首艘2.4万箱甲醇双燃料集装箱船今日交付启航", "content": "今天（6月26日），在南通海事局全程监管保障下，全球首制2.4万箱甲醇双燃料集装箱船“东方智慧”轮从江苏南通长江段码头交付启航。该轮总长399.99米、型宽61.3米，最多可以装载24168个标准集装箱，为当前全球最大级别的甲醇双燃料集装箱船。据船舶技术人员介绍，该船舶搭载先进甲醇双燃料动力系统，使用绿色甲醇时碳排放显著降低，兼具大型化、低碳化、智能化技术优势，是我国清洁能源船舶制造领域的突破性产品。（央视新闻）", "ctime": 1782447962, "time_str": "12:26:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260626/c677738270.shtml"}, {"id": "4602723", "title": "受地震影响 日本成田机场部分跑道关闭", "content": "当地时间26日12时46分左右，日本千叶县东北部发生5.8级地震。受地震影响，位于千叶县的成田机场自12时47分起关闭两条跑道，正在进行安全检查。此外，连接茨城县筑波市和东京秋叶原的筑波快线12时50分起全线暂停运营。铁路公司表示，在确认安全后，将尽快恢复列车运行。（央视新闻）", "ctime": 1782447955, "time_str": "12:25:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260626/c677738269.shtml"}, {"id": "4602707", "title": "全国10条河流发生超警洪水", "content": "记者从水利部了解到，受近期降雨影响，昨天到今天，广东北江支流大坪水，广西红水河支流布柳河龙头河、郁江支流澄碧河田州河，贵州柳江支流龙江，四川大渡河上游及支流梭磨河、黄河上游支流白河，新疆渭干河支流卡拉苏河等10条河流发生超警洪水，最大超警幅度1.58米，目前大部河流已退至警戒以下。四川大渡河发生2026年第1号洪水。（央视新闻）", "ctime": 1782447557, "time_str": "12:19:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260626/c677738195.shtml"}, {"id": "4602703", "title": "国际刑事法院3名女法官起诉特朗普政府", "content": "国际刑事法院3名女法官24日在美国纽约联邦法院起诉美国总统特朗普及其政府，指控此前对她们实施的制裁措施非法。 来自加拿大、乌干达和贝宁的3名女法官在起诉书中表示，美国对她们实施的制裁旨在惩罚和胁迫国际刑事法院法官。 据媒体报道，一名白宫官员称，这些制裁是特朗普依据美国《国际紧急经济权力法》合法行使权力。但这3名法官指出，制裁超出了《国际紧急经济权力法》的授权范围，不仅违法，而且并非基于真正的国家紧急状态或特殊威胁。 近年来，美方以国际刑事法院调查美方人员和对以色列总理和前防长发出逮捕令为由，多次宣布制裁国际刑事法院法官和检察官。 国际刑事法院去年12月发表声明说，这些制裁是对“公正司法机构独立性的公然攻击”，并表示国际刑事法院坚定支持其工作人员以及暴行受害者，将继续履行其职责。(新华社)", "ctime": 1782447400, "time_str": "12:16:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260626/c677738120.shtml"}, {"id": "4602701", "title": "日本东海第二核电站处于停运状态", "content": "日本原子力发电公司当地时间26日表示，东海第二核电站目前处于停运状态。据日本气象厅消息，26日12时46分左右，日本千叶县东北部发生5.8级地震。截至目前，尚未确认此次地震导致核电站出现任何异常。此外，用于监测核电站周边辐射水平的监测站测得的辐射剂量数值也没有发生变化。（央视新闻）", "ctime": 1782447375, "time_str": "12:16:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260626/c677738117.shtml"}, {"id": "4602699", "title": "SpaceX计划为美国消费者推出新的星链移动服务", "content": "6月26日，据报道，SpaceX已告知投资者，计划为美国消费者推出一项新的星链移动服务。SpaceX总裁兼首席运营官Gwynne Shotwell在IPO路演中向投资者表示，公司正考虑推出星链零售产品。（界面新闻）", "ctime": 1782447370, "time_str": "12:16:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260626/c677738116.shtml"}, {"id": "4602691", "title": "6月26日午间公告一览：福森药业帕拉米韦注射液获批上市", "content": "福森药业公告，集团全资附属公司嘉亨（珠海横琴）医药科技有限公司研发的「帕拉米韦注射液」，上市申请已获得中国国家药品监督管理局批准，批准用于治疗甲型或乙型流行性感冒。", "ctime": 1782447254, "time_str": "12:14:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260626/c677738100.shtml"}, {"id": "4602659", "title": "港股午评：恒生指数跌1.87%，恒生科技指数跌3.32%", "content": "港股午间收盘，恒生指数跌1.87%，恒生科技指数跌3.32%。恒指港股通ETF银华（159318）跌1.92%，港股通科技ETF鹏华（159751）跌3.82%。板块方面，建筑产品板块涨幅靠前；通信设备、半导体产品与设备板块跌幅靠前。个股方面，科拓股份涨195.07%，中科闻歌涨87.48%，芯碁微装涨76.39%，圣邦股份涨25.0%，怡俊集团控股涨16.42%；长飞光纤光缆跌13.98%，天数智芯跌13.43%，舜宇光学科技跌12.31%，琻捷电子科技跌12.01%，壁仞科技跌11.69%。", "ctime": 1782446470, "time_str": "12:01:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260626/c677737950.shtml"}, {"id": "4602653", "title": "日本将设“航空宇宙自卫队” 军事扩张引发担忧", "content": "日本国会参议院26日上午表决通过了《防卫省设置法》修正案等法案，决定将航空自卫队改编为“航空宇宙自卫队”。由于相关法案已于4月底经众议院表决通过，此次在参议院通过意味着相关法案正式成立。此举进一步引发日本舆论担忧情绪。 根据法案，“航空宇宙自卫队”将于2026年内成立，并新设由航空自卫队最高级将官担任指挥官、专门负责太空领域的“宇宙作战集团”，从而推进卫星发射，加强对太空态势的监测能力。 此外，此次表决还通过了关于提高退役自卫队人员待遇、强化驻冲绳陆上自卫队编制等法案。 上述动向持续引发日本舆论担忧。爱知县和平委员会当天在社交平台发文说，此次修法为攻击他国而将军事领域扩展至太空，“对此坚决反对！这只会导致日本走向军事扩张，加剧对立，并招致战争”。 日本社民党党首福岛瑞穗25日在国会就相关问题向政府提出质询后也表示，在行使集体自卫权范围等基本问题尚未厘清、相关定义仍然模糊的情况下，政府却将“宇宙防卫”视为理所当然，并不断推进相关讨论，这种做法存在问题。 近期，日本除在多地加强军事部署外，还频繁通过制定和修订相关法案和政策文件，为进一步强化所谓“防卫力量”铺路。相关动向令日本国内的担忧情绪持续升温。(新华社)", "ctime": 1782446249, "time_str": "11:57:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260626/c677737885.shtml"}, {"id": "4602639", "title": "日本千叶县发生5.8级地震 东京地区震感强烈", "content": "据日本气象厅消息，当地时间26日12时46分左右，日本千叶县东北部发生5.8级地震，最大震感为震度4，震源深度50公里。据悉，东京地区有强烈震感。（央视新闻）", "ctime": 1782445951, "time_str": "11:52:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260626/c677737825.shtml"}, {"id": "4602637", "title": "斯迪克：部分客户已完成超薄MLCC离型膜认证 6月已实现小批量供货", "content": "斯迪克在互动平台表示，从当前客户验证情况来看，部分客户已完成超薄MLCC离型膜认证，6月已实现小批量供货，预计下半年相关业务将取得阶段性进展。（人民财讯）", "ctime": 1782445945, "time_str": "11:52:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260626/c677737823.shtml"}, {"id": "4602635", "title": "我国将开发和储备化石能源 显著提升非化石能源供给", "content": "国务院新闻办今天举行新闻发布会。国家发展改革委党组成员、国家能源局局长王宏志表示，“十五五”时期，我国将做好化石能源的“开发”和“储备”，同时显著提升非化石能源供给，打造坚强韧性的能源安全保障体系。（央视新闻）", "ctime": 1782445787, "time_str": "11:49:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260626/c677737771.shtml"}, {"id": "4602633", "title": "“十五五”全国年均用电增量预计约6000亿度", "content": "在国务院新闻办今天举行的新闻发布会上，国家能源局电力司负责人表示，“十五五”期间，我国用电量将持续增长，我国将采取更加有力有效的措施，做好电力供应保障。国家能源局电力司司长杜忠明介绍，“十五五”时期，随着算力用电的激增，电动充电设施的需求快速增加，以及其他行业和居民生活用电的刚性增长，预计全国年均用电增量将达到6000亿度左右，相当于每年新增一个中等经济体量国家的用电水平。为了做好电力供应保障，我国要加快形成绿色低碳的供给格局，继续发挥好气电、煤电的兜底保障作用。加快新型电网建设，提升电力互济能力和安全韧性水平。大力发展虚拟电厂，有效发挥新型储能作用，增强用电高峰时段的顶峰能力。（央视新闻）", "ctime": 1782445748, "time_str": "11:49:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260626/c677737759.shtml"}, {"id": "4602627", "title": "大北农回应“被停贷限贷”：经营及融资活动均正常开展", "content": "有投资者在互动平台提问大北农：网传大北农是被停贷限贷三家养猪企业之一，是否属实？大北农回复，公司目前已关注到相关市场传闻。截至目前，公司经营及融资活动均在正常开展中。（人民财讯）", "ctime": 1782445636, "time_str": "11:47:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260626/c677737737.shtml"}, {"id": "4602621", "title": "小米成立享看创境信息技术服务公司", "content": "企查查APP显示，近日，上海享看创境信息技术服务有限公司成立，法定代表人为刘婵，注册资本为1000万元，经营范围包含：信息技术咨询服务；广告制作；广告设计、代理；组织文化艺术交流活动；市场营销策划；社会经济咨询服务等。企查查股权穿透显示，该公司由小米通讯技术有限公司全资持股。（人民财讯）", "ctime": 1782445531, "time_str": "11:45:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260626/c677737694.shtml"}, {"id": "4602609", "title": "日经225指数大跌5%，软银集团跌超12%", "content": "日经225指数大跌5%，软银集团跌超12%。", "ctime": 1782445003, "time_str": "11:36:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260626/c677737458.shtml"}, {"id": "4602607", "title": "国家能源局：“十五五”时期将重点围绕三个方向，进一步加快布局建设新型能源基础设施", "content": "国家能源局新闻发言人、副局长万劲松在国新办新闻发布会上表示，“十五五”时期，我们将重点围绕三个方向，进一步加快布局建设新型能源基础设施。第一个方向是加快布局促进新能源发展的能源基础设施。我们将优化开发方式，建设“三北”风电光伏、西南水风光一体化等清洁能源基地，因地制宜发展绿电直连，建设低碳零碳油气田，推动新能源集成融合发展。同时，提升新能源的接入和消纳能力，加快打造安全可靠、绿色低碳、坚强韧性、智能灵活的新型电网，推动源储调节能力增长40%以上。第二个方向是加快布局新技术新模式带动的能源基础设施。这类基础设施包括可再生能源制氢、绿色燃料、充电设施、核能综合利用、虚拟电厂、综合能源站等。第三个方向是加快传统能源基础设施数智化转型。（人民财讯）", "ctime": 1782444911, "time_str": "11:35:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260626/c677737364.shtml"}, {"id": "4602595", "title": "行业首个！智能机器狗开启常态化实地无人巡逻执勤", "content": "近日，应用大晓机器人开放场景自主作业解决方案晓途的智能机器狗正式进驻上海西岸片区，投入常态化实地无人巡逻执勤工作。该方案由具身超级大脑模组A1与智能管控平台两大核心模块构成，可赋能机器狗实现全天候、全场景、高智能的自主作业，有效补齐传统人工巡逻时长有限、值守薄弱等短板。其中，具身超级大脑模组A1赋予机器狗开放环境下全流程自主导航能力，摆脱了传统巡检依赖预设轨道、封闭场地运行的局限。依托空间感知、实时研判与动态决策能力，机器狗可在户外复杂开放街区、大型活动场地等多元场景中自主识别环境、规划行进路线、智能避让行人与各类障碍物。在运维管理层面，配套的智能管控平台搭建了集群调度体系，可实现一人统筹管控多台机器狗的平台化作业模式。（人民财讯）", "ctime": 1782444759, "time_str": "11:32:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260626/c677737272.shtml"}, {"id": "4602591", "title": "ETF两市成交额报3332.41亿元，较昨日此时放量285.98亿元", "content": "截至目前，ETF两市成交额报3332.41亿元，较昨日此时放量285.98亿元，分类型来看，股票型ETF成交额1310.99亿元，债券型ETF成交额1324.42亿元，货币型ETF成交额166.6亿元，商品型ETF成交额44.46亿元，QDII型ETF成交额485.94亿元。", "ctime": 1782444706, "time_str": "11:31:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260626/c677737234.shtml"}, {"id": "4602587", "t l"}, {"id": "4602561", "title": "我国将加力支持民营企业投身新型能源体系建设", "content": "国务院新闻办今天举行新闻发布会。国家能源局相关负责人介绍，“十五五”期间，将加力支持民营企业投身新型能源体系建设。国家能源局副局长万劲松介绍，在能源重大项目上，将扩大民营企业投资空间。“十五五”期间，将继续推动能源项目敞开大门，出台民营企业参与大中型水电等项目投资指引，让企业投资有方向、收益有保障。在新模式新业态上，将进一步完善电力市场和价格机制，支持民营企业投资虚拟电厂、充电设施、新型储能等项目。国家能源局副局长万劲松表示，在优化营商环境上，为民营企业提供更好的服务。集中整治招投标乱象、光伏行业无序竞争、强制产业配套等行为，持续推进电网、油气管网等基础设施对民营企业公平开放。简化项目审批流程，推行“一网通办、一窗受理”，提升“获得电力”服务水平，让企业少跑腿、好办事。定期开展政企对话、评估政策效果、回应发展诉求，当好企业贴心人。（央视新闻）", "ctime": 1782444428, "time_str": "11:27:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260626/c677737081.shtml"}, {"id": "4602559", "title": "麦格理：预计年终白银将交投于70美元，明年底回落至65美元", "content": "麦格理表示，上个月获利了结打压了白银价格，且在美联储加息预期升温的背景下，价格走势重新由宏观因素驱动。与黄金类似，预计今年剩余时间内白银价格将维持区间震荡，2027年逐步走低，通胀压力和美联储加息的可能性将限制进一步上行空间。通胀和债券收益率越高，下行压力越大。尤其是白银，供应收紧、低库存和强劲需求所推动的看涨情绪已使其表现优于黄金，因此更容易出现回调。而从历史上看，白银回调速度很快。麦格理预计今年第四季度白银将交投于每盎司70美元，到2027年底回落至65美元。", "ctime": 1782444411, "time_str": "11:26:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260626/c677737075.shtml"}];
const SECTORS  = [{"name": "金融", "hit_count": 28, "etfs": []}, {"name": "数据要素", "hit_count": 22, "etfs": []}, {"name": "半导体", "hit_count": 22, "etfs": []}, {"name": "人工智能", "hit_count": 18, "etfs": []}, {"name": "新能源", "hit_count": 13, "etfs": []}, {"name": "消费", "hit_count": 12, "etfs": []}, {"name": "军工", "hit_count": 11, "etfs": []}, {"name": "机器人", "hit_count": 3, "etfs": []}];
const META     = {"update_time": "2026-06-26 13:41:46", "sentiment_score": 55.74162679425837, "agents": []};

// 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
