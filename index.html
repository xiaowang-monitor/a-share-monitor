长23%-41%；扣非净利润为6900万元-8000万元，较2025年前三季度盈利5528万元增长25%-45%。公司核心业务增长动能充足，预计报告期累计形成汇兑损失3918万元，2025年同期为汇兑收益1061万元。", "ctime": 1791966685, "time_str": "16:31:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261014/c680686949.shtml"}, {"id": "5385233", "title": "东杰智能：拟设新加坡全资孙公司，注册资本20万美金", "content": "东杰智能公告，公司拟通过全资子公司东杰智能（山东）有限公司在新加坡设立全资孙公司OMH INTELLIGENT TECHNOLOGY PTE.LTD.，注册资本20万美金。公司董事会已审议通过相关议案，设立事项尚需履行当地投资许可和企业登记等审批或登记程序。", "ctime": 1791966681, "time_str": "16:31:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261014/c680686941.shtml"}, {"id": "5385227", "title": "中材科技今日跌停，有3家机构专用席位净卖出2.69亿元", "content": "中材科技今日跌停，成交额30.25亿元，换手率3.76%，盘后龙虎榜数据显示，深股通专用席位买入4958.18万元并卖出9005.46万元，2家机构专用席位净买入2564.06万元，有3家机构专用席位净卖出2.69亿元。", "ctime": 1791966677, "time_str": "16:31:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261014/c680686930.shtml"}, {"id": "5385201", "title": "IMF总裁：美国的经济增长不足以缩减债务", "content": "国际货币基金组织（IMF）总裁格奥尔基耶娃14日表示，美国无法仅靠经济增长来化解不断攀升的公共债务，需要采取其他财政调整措施。格奥尔基耶娃当天在泰国曼谷举行的IMF与世界银行集团2026年秋季年会期间对记者说，美国财政部长贝森特承认，美国的赤字和总体债务过高。格奥尔基耶娃说，美国当局非常依赖经济增长来帮助减少债务。IMF认为，经济增长无法足够快地带来必要的调整，因此有必要采取一些财政措施。（新华社）", "ctime": 1791966511, "time_str": "16:28:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261014/c680686522.shtml"}, {"id": "5385195", "title": "宇通客车：2026年第三季度净利润13.16亿元，同比下降3.00%", "content": "宇通客车公告，2026年第三季度营业收入90.97亿元，同比下降11.13%；净利润13.16亿元，同比下降3.00%；扣非净利润13.03亿元，同比增长22.25%。2026年前三季度营业收入258.16亿元，同比下降2.09%；净利润31.84亿元，同比下降3.31%；扣非净利润30.99亿元，同比增长18.45%。", "ctime": 1791966474, "time_str": "16:27:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261014/c680686435.shtml"}, {"id": "5385189", "title": "威尔药业：首次回购5.3万股，成交价26.13元/股~26.47元/股，支付139.32万元", "content": "威尔药业公告，公司此前审议通过回购方案，拟使用不低于人民币5000万元且不超过1亿元的自有及自筹资金回购股份，用于员工持股计划或股权激励，回购价格不超过40.11元/股。2026年10月14日，公司首次回购5.3万股，占总股本的0.04%，成交价格为26.13元/股~26.47元/股，支付人民币139.32万元。", "ctime": 1791966431, "time_str": "16:27:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261014/c680686302.shtml"}, {"id": "5385187", "title": "沪电股份：预计2026年前三季度净利润54.5亿元–57亿元，同比增长100.54%–109.74%", "content": "沪电股份公告，预计2026年前三季度归属于上市公司股东的净利润为54.5亿元–57亿元，较2025年同期增长100.54%–109.74%；扣除非经常性损益后的净利润为53.6亿元–55.5亿元，较2025年同期增长100.27%–107.36%。公司称，受益于相关应用领域结构性需求及产品结构持续优化，营业收入和净利润预计较同期均有较快增长；泰国子公司已从产能爬坡期逐步迈入规模化运营期，实现扭亏为盈。", "ctime": 1791966393, "time_str": "16:26:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261014/c680686209.shtml"}, {"id": "5385183", "title": "广汽集团：支持中欧贸易投资磋商机制达成共识", "content": "广汽集团：近日，在中欧贸易磋商机制(TIC)的有效运作下，中欧双方在对等互利的基础上，就包括汽车领域在内的双边经贸议题磋商达成多项共识。本次磋商所确认的各项原则，体现了尊重事实、公平公正的原则，符合世贸组织规则，兼顾各方正当权益，回应合理关切，为双方企业开展长期稳定合作奠定了坚实基础。有助于避免贸易摩擦升级，维护汽车产业链供应链稳定畅通，为车企开展贸易投资合作创造更加可预期的环境从中国制造”到“全球信赖”，广汽集团始终坚持以坚定的战略定力、扎实的技术积淀和深度的本地化布局，高质量助推中国产业出海，为全球用户提供美好移动生活价值。在此基础上，广汽集团将一如既往地坚持依法合规经营，并以此次中欧混动汽车经贸磋商共识为契机，深耕欧洲市场，深化与欧洲伙伴的互利合作，以优质的产品和服务回馈消费者，为推动中欧汽车产业共同发展、促进中欧经贸合作行稳致远贡献力量。", "ctime": 1791966353, "time_str": "16:25:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261014/c680686122.shtml"}, {"id": "5385175", "title": "联科科技：2026年第三季度净利润9656.12万元，同比增长30.97%", "content": "联科科技公告，2026年第三季度营业收入7.3亿元，同比增长26.95%；归母净利润9656.12万元，同比增长30.97%；扣非净利润9372.49万元，同比增长28.79%。2026年前三季度营业收入20.04亿元，同比增长12.07%；归母净利润2.56亿元，同比增长11.00%；扣非净利润2.42亿元，同比增长6.35%。", "ctime": 1791966230, "time_str": "16:23:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261014/c680685779.shtml"}, {"id": "5385159", "title": "华通线缆：预计2026年前三季度净利润同比增长86.53%至117.62%", "content": "华通线缆公告，预计2026年前三季度归母净利润为4.8亿元至5.6亿元，同比增长86.53%至117.62%；扣非净利润为4.4亿元至5.2亿元，同比增长79.72%至112.40%。2025年前三季度归母净利润为2.57亿元，扣非净利润为2.45亿元。本次业绩增长主要系安哥拉电解铝项目产能及产品销售释放；该项目于2026年1月正式投产，经过产能爬坡阶段已达满产状态。", "ctime": 1791966182, "time_str": "16:23:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261014/c680685674.shtml"}, {"id": "5385155", "title": "招商证券：短期公司债注册获批，面值余额不超480亿元", "content": "招商证券公告，公司拟向专业投资者公开发行短期公司债券，近日收到中国证监会同意注册的批复，发行面值余额不超过480亿元；批复自同意注册之日起24个月内有效，注册有效期内可分期发行。", "ctime": 1791966173, "time_str": "16:22:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261014/c680685653.shtml"}, {"id": "5385153", "title": "俄军对乌能源和基础设施发动大规模打击", "content": "俄罗斯国防部14日在社交媒体发布通报说，当天俄军对位于乌克兰首都基辅、基辅州和哈尔科夫州的通信和能源设施发动大规模打击。通报说，当天凌晨，俄军使用陆基高精度武器和远程无人机发动大规模打击，打击目标是为乌军工企业和乌军服务的通信和能源设施。通报说，此次袭击造成乌克兰多个为乌军工企业和乌军供电的热电厂受损，基辅市一家银行的数据中心也遭到打击，该数据中心利用互联网收集俄罗斯武装部队的情报。同日，乌克兰总统泽连斯基在社交媒体发布消息说，过去一夜，俄方使用39枚弹道导弹、120多架攻击型无人机以及巡飞弹，对乌克兰基辅市、基辅州和哈尔科夫市的能源部门和关键基础设施发动袭击，造成26处电力系统设施及4处油气设施明显受损，至少60万人遭遇断电，袭击还造成人员伤亡。（新华社）", "ctime": 1791966171, "time_str": "16:22:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261014/c680685652.shtml"}, {"id": "5385121", "title": "报告：2025年全球森林减少速度放缓", "content": "由多家研究机构和组织共同发布的《森林宣言评估》年度报告显示，2025年全球约700万公顷森林遭到永久性破坏，接近爱尔兰的国土面积，这比前一年的减少面积下降了15%。与全球总体情况相反，非洲中部刚果盆地去年状况恶化，240万公顷雨林消失，首次接近亚马孙雨林的减少速度水平。报告警告，如果预期的2026年至2027年超强厄尔尼诺现象成为现实，可能导致热带森林地区的干旱和火灾风险进一步加剧。（央视新闻）", "ctime": 1791966051, "time_str": "16:20:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261014/c680685336.shtml"}, {"id": "5385107", "title": "港股收评：恒生指数收跌0.13%，恒生科技指数涨0.91%", "conten k_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261014/c680682175.shtml"}, {"id": "5385017", "title": "上海电气：富申实业诉讼按撤诉处理，涉9774.18万元", "content": "上海电气公告，控股子公司通讯公司与富申实业的诉讼中，富申实业曾要求撤销《产品销售合同》并返还已付预付款及已付货款合计9774.18万元。近日，通讯公司收到上海市杨浦区人民法院《民事裁定书》，裁定本次诉讼按原告富申实业撤诉处理。", "ctime": 1791964983, "time_str": "16:03:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261014/c680681637.shtml"}, {"id": "5385015", "title": "东方锆业：预计2026年前三季度净利润同比增长261.93%～365.34%", "content": "东方锆业公告，预计2026年前三季度归属于上市公司股东的净利润为1.4亿元～1.8亿元，上年同期为3868.12万元，同比增长261.93%～365.34%；扣除非经常性损益后的净利润为1.4亿元～1.8亿元，上年同期为3849.99万元，同比增长263.64%～367.53%。业绩增长主要受下游需求增长、产品量价齐升、降本增效及产能利用率提升等因素带动。", "ctime": 1791964980, "time_str": "16:03:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261014/c680681615.shtml"}, {"id": "5384995", "title": "美股中概股盘前多数上涨，理想汽车跌1%", "content": "美股中概股盘前多数上涨，网易、阿里巴巴涨1%，京东涨0.8%，富途控股涨0.7%，拼多多涨0.5%，携程涨0.3%，百度涨0.1%，理想汽车跌1%。", "ctime": 1791964896, "time_str": "16:01:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261014/c680681155.shtml"}, {"id": "5384991", "title": "美股大型科技股盘前涨跌互现，SK海力士跌超2%", "content": "美股大型科技股盘前涨跌互现，Meta、谷歌A涨0.7%，亚马逊涨0.4%，苹果涨0.3%，SpaceX、微软涨0.2%，特斯拉、英伟达涨0.1%；SK海力士跌超2%，美光科技跌0.7%。", "ctime": 1791964893, "time_str": "16:01:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261014/c680681142.shtml"}, {"id": "5384981", "title": "中关村：多多药业0.5g羟苯磺酸钙胶囊申请获受理", "content": "中关村公告，下属公司多多药业羟苯磺酸钙胶囊上市许可申请获国家药监局受理，规格为0.5g，受理号为CYHS2602461，标志着该品种上市许可工作进入审评阶段。", "ctime": 1791964851, "time_str": "16:00:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261014/c680680929.shtml"}, {"id": "5384935", "title": "矩阵股份：2026年第三季度净利润2777.39万元，同比下降2.02%", "content": "矩阵股份公告，2026年第三季度营业收入1.99亿元，同比下降3.45%；归母净利润2777.39万元，同比下降2.02%；扣非净利润2198.37万元，同比增长21.59%。2026年前三季度营业收入4.78亿元，同比下降5.49%；归母净利润5490.35万元，同比下降20.25%；扣非净利润3905.93万元，同比下降21.28%。", "ctime": 1791964765, "time_str": "15:59:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261014/c680680815.shtml"}, {"id": "5384931", "title": "欧盟批准解冻匈牙利42亿欧元欧盟资金", "content": "匈牙利常驻欧盟代表团13日在社交媒体上说，欧盟理事会当天决定结束针对匈牙利的“条件机制”程序，批准向匈牙利解冻此前被冻结的42亿欧元欧盟资金。 根据这一决定，欧盟还将解除影响匈牙利高校参与“伊拉斯谟+计划”和“地平线欧洲”项目的限制。匈牙利政府表示，在完成必要的协议签署后，相关计划有望于2027年春季恢复。 欧盟委员会主席冯德莱恩当天在社交媒体上对欧盟理事会的决定表示欢迎，称这标志着匈牙利和欧洲“开启了新篇章”。匈牙利总理毛焦尔·彼得也对这一决定表示欢迎，称此举将为匈牙利学生和研究人员带来新的机会。 匈牙利政府官网当天发表声明说，为满足欧盟资金解冻条件，匈牙利已修改100多项法律法规，加强对公共资金和欧盟资金使用的监管，扩大廉政局权限，实施新的利益冲突防范规定，并提高财产申报制度及私募股权基金的透明度。 欧盟委员会于9月23日提议解除相关限制措施，认为匈牙利已经解决此前在公共采购、反腐败制度、利益冲突风险以及检察机关履职效能等方面发现的薄弱环节和不足。 2022年，欧盟以匈牙利在司法改革、反腐措施等方面有违欧盟“法治原则”为由，对其启动“条件机制”程序，冻结对匈牙利的资金拨付。今年5月，冯德莱恩表示，欧盟将解冻属于匈牙利的164亿欧元欧盟资金，其中包括42亿欧元欧盟凝聚基金。(新华社)", "ctime": 1791964754, "time_str": "15:59:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261014/c680680814.shtml"}, {"id": "5384927", "title": "俄外交部：日方以新闻报道为掩护从事情报活动不可接受", "content": "俄罗斯外交部发言人扎哈罗娃14日接受俄媒体采访时说，日方以新闻报道为掩护从事情报活动是不可接受的。扎哈罗娃说，日本记者因间谍行为被俄方拘捕只是俄方首次披露，而非首次发生，俄方此前已经多次向日方表示，以新闻报道为掩护从事情报活动是不可接受的。俄罗斯联邦安全局13日发布通报说，俄方在萨哈林州拘留了日本《北海道新闻》驻南萨哈林斯克的一名记者，指控其涉嫌从事间谍活动。日本媒体14日说，日本政府已就此向俄方提出交涉，并将于当天召见俄罗斯驻日本大使。（新华社）", "ctime": 1791964737, "time_str": "15:58:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261014/c680680810.shtml"}, {"id": "5384881", "title": "布伦特原油跌破104美元/桶，日内跌0.74%", "content": "布伦特原油跌破104美元/桶，日内跌0.74%。", "ctime": 1791964620, "time_str": "15:57:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share   if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
