tock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261110/c681659735.shtml"}, {"id": "5614793", "title": "新一轮俄美乌三方会谈开始进行", "content": "据俄新社报道，新一轮俄美乌三方会谈今天（11月10日）在阿联酋阿布扎比开始。这是自今年2月以来俄美乌三国首次举行的三方会谈。(CCTV国际时讯)", "ctime": 1794298996, "time_str": "16:23:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261110/c681659692.shtml"}, {"id": "5614783", "title": "今年10月全国受理网络举报同比下降9.4%", "content": "中央网信办举报中心11月10日公布，2026年10月全国受理网民举报色情、赌博、侵权、谣言等违法和不良信息1761.9万件，环比增长1.2%、同比下降9.4%。其中，中央网信办举报中心受理76.2万件，各地网信举报工作部门受理54.9万件，全国主要网站平台受理1630.8万件。举报中心表示，各主要网站平台不断畅通举报渠道、受理处置网民举报，欢迎广大网民积极参与网络综合治理，共同维护清朗网络空间。（新华社）", "ctime": 1794298914, "time_str": "16:21:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261110/c681659531.shtml"}, {"id": "5614775", "title": "珍宝岛：鸡西分公司玛巴洛沙韦原料药获上市申请批准", "content": "珍宝岛公告，鸡西分公司此前于2025年4月递交玛巴洛沙韦原料药上市登记申请并获得受理，近日取得国家药品监督管理局颁发的《化学原料药上市申请批准通知书》，该原料药在CDE原料药、药用辅料和药包材登记信息公示平台上显示状态为“A”。截至目前，公司在该研发项目上累计投入研发费用约871.73万元。该原料药符合国家相关审评技术标准，在符合药品生产质量管理规范要求后可在国内市场生产销售；事项不会对公司当期经营业绩产生重大影响，药品生产和销售具有较大不确定性。", "ctime": 1794298809, "time_str": "16:20:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261110/c681659265.shtml"}, {"id": "5614771", "title": "美媒：美军从英国米尔登霍尔空军基地撤走加油机", "content": "美国《华尔街日报》9日援引知情人士消息报道称，美国国会当天收到有关伊朗威胁的简报，美军从位于英国的米尔登霍尔空军基地撤走加油机。据飞行追踪数据和另一名知情官员说法，两架此前使用该基地的美军加油机9日早些时候转飞德国，另有几架当天晚些时候转移至德国和其他地点。伊朗方面称，针对美国任何袭击伊朗的报复行动都将扩展到中东以外地区。美方仍在讨论和评估威胁的具体性质和紧迫性。美国国会“八人团”包括民主、共和两党在参众两院的领袖及情报委员会成员。（新华社）", "ctime": 1794298781, "time_str": "16:19:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261110/c681659219.shtml"}, {"id": "5614763", "title": "新天绿能：2026年10月发电量159.88万兆瓦时，同比增长68.22%", "content": "新天绿能公告，2026年10月公司及子公司按合并报表口径完成发电量159.88万兆瓦时，同比增长68.22%；累计发电量12286715.45兆瓦时，同比增长4.85%。当月输/售气量2.45亿立方米，同比减少38.12%，其中售气量2.22亿立方米，同比减少37.39%，代输气量2359.48万立方米，同比减少44.18%；累计输/售气量32.55亿立方米，同比减少23.92%。上述经营数据为初步统计数据，仅供参考。", "ctime": 1794298699, "time_str": "16:18:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261110/c681659018.shtml"}, {"id": "5614759", "title": "张小泉：联合同花顺开展股东回馈活动，11月11日起报名", "content": "张小泉公告，公司将联合浙江核新同花顺网络信息股份有限公司开展“上市公司股东节”股东回馈活动，活动时间为2026年11月11日起至2026年11月25日17:00止。活动期间持有过“张小泉”股票且个人交易账户可在同花顺App登录的投资者均可报名，奖品包括一等奖华曜大马士革套刀、二等奖雪花纹钛铁锅、三等奖银锋修甲两件套，11月25日17:00开奖。", "ctime": 1794298685, "time_str": "16:18:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261110/c681658982.shtml"}, {"id": "5614721", "title": "原中国银行保险监督管理委员会城市商业银行监管部一级巡视员李世谦受贿案一审宣判", "content": "北京市第二中级人民法院10日依法公开宣判原中国银行保险监督管理委员会城市商业银行监管部一级巡视员李世谦受贿一案，对李世谦以受贿罪判处有期徒刑十一年，并处罚金人民币一百万元。追缴被告人李世谦受贿违法所得，予以没收，上缴国库。(新华社)", "ctime": 1794298325, "time_str": "16:12:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261110/c681658119.shtml"}, {"id": "5614715", "title": "上海：积极推进深远海风电试点建设 探索海上能源岛建设可行性", "content": "上海市海洋局近日印发《上海市海洋资源利用与生态保护“十五五”实施方案》，提出推进南汇东滩、横沙浅滩等区域功能定位，稳妥推进其后续利用；落实《长江口疏浚土保护利用专项规划》，实施长江口疏浚土保护利用工程，推进南汇东滩风光储氢一体化基地前期研究；积极推进深远海风电试点建设，鼓励风光渔同场等可再生能源复合利用；开展人工离岛研究，探索海上能源岛建设可行性。（人民财讯）", "ctime": 1794298295, "time_str": "16:11:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261110/c681657993.shtml"}, {"id": "5614701", "title": "交权倒计时 美国共和党欲开启“立法冲刺”", "content": "美国国会参众两院议员9日中期选举后重返国会。据美国《华盛顿邮报》报道，选举失利的共和党人希望在明年1月3日权力交接前进行“立法冲刺”，推进向五角大楼拨款、批准法官人选等议程。预计本届国会今年底前还有约五周会期，共和党人呼吁节假日不休息。优先事项包括为补充伊朗战事消耗的美军弹药追加五角大楼预算，参议院共和党人还需确认特朗普提名的数十名法官人选。最紧迫任务是在联邦政府现有资金12月11日耗尽前批准拨款法案，避免政府“停摆”。两党围绕联邦政府资金谈判今年夏季陷入停滞，民主党人即将掌控国会两院，“基本没有动力”接受倾向共和党优先事项的协议。（新华社）", "ctime": 1794298212, "time_str": "16:10:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261110/c681657590.shtml"}, {"id": "5614697", "title": "港股收评：恒生指数涨0.44%，恒生科技指数涨1.08%", "content": "港股收盘，恒生指数涨0.44%，恒生科技指数涨1.08%。恒指港股通ETF银华（159318）跌0.08%，港股通科技ETF鹏华（159751）涨0.65%。板块方面，广播、其他能源储存运输板块涨幅靠前；油品石化贸易、非金属矿开采Ⅲ板块跌幅靠前。个股方面，芯德半导体涨28.38%，旺山旺水-B涨17.46%，白鸽在线涨17.2%，天数智芯涨15.49%，MOMENTA-W涨14.35%；海丰国际跌7.83%，登临科技-P跌7.79%，创新实业跌6.28%，中远海能跌5.51%，中国铝业跌4.91%。", "ctime": 1794298200, "time_str": "16:10:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261110/c681657490.shtml"}, {"id": "5614641", "title": "减少个人信息泄露 首批700专用码号服务业务试点获批", "content": "工业和信息化部近日批复十家企业开展号码保护服务业务试点，核配700专用码号资源。该业务受外卖、网约车等平台企业委托，为用户分配临时电话号码代替真实手机号，下单勾选后以700开头的15位专用号码联系，双方真实号码互不展示。中国信息通信研究院张大坤表示，700中间号订单结束后临时号码失效，不会留下长期联系通道。目前该业务日均订单量超3.5亿，试点过渡阶段结束后将全部使用700专用号码。首批试点企业采用全新网络技术架构并应用AI技术，其中一家企业去年9月已上线研发平台并率先打通700号码测试电话。（央视新闻）", "ctime": 1794297985, "time_str": "16:06:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261110/c681656511.shtml"}, {"id": "5614633", "title": "俄外长就俄美乌三方会谈称对特朗普政府“不抱幻想”", "content": "据今日俄罗斯10日报道，俄罗斯外长拉夫罗夫表示，相关方将在俄美乌三方会谈期间讨论保障集体安全问题，保障措施将在达成全面彻底的解决方案后生效。他同时称，俄罗斯对特朗普政府“不抱幻想”，希望美国有决心继续对话。（新华社）", "ctime": 1794297952, "time_str": "16:05:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261110/c681656431.shtml"}, {"id": "5614539", "title": "欧洲主要股指开盘多数上涨", "content": "欧洲主要股指开盘多数上涨，欧洲斯托克50指数涨0.83%，英国富时100指数涨0.73%，法国CAC40指数持平，德国DAX指数涨1.07%。", "ctime": 1794297684, "time_str": "16:01:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261110/c681655126.shtml"}, {"id": "5614491", "title": "改善健康 美国夏威夷居民食品也可纳入医疗补助", "content": "美国夏威夷州参加医疗补助计划的低收入家庭患者最早将从明年1月起，获得医生开具的肉、蛋、奶及蔬菜水果等“新鲜食物处方”，这是该州医疗补助计划下的特别项目，旨在应对低收入社区与饮食相关的慢性疾病问题。项目将分三阶段推出，提供营养教育、处方食品盒及逐步引入“医疗定制餐”。比格艾兰的摩西·帕约和苏齐特·帕约夫妇今年参加试点，苏齐特血糖降低一半，摩西减重约30公斤。塔夫茨大学数据显示，此类餐食每年有助于减少260万人次住院，净节省成本237亿美元。夏威夷食物赈济中心报告显示，全州三分之一家庭难以获得充足、有营养且可负担的食物，约半数原住民和太平洋岛民处于食物不安全状态。（新华社）", "ctime": 1794297610, "time_str": "16:00:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261110/c681654959.shtml"}, {"id": "5614463", "title": "第九届进博会期间 上海超2800家离境退税商店办理离境退税销售额超1亿元", "content": "第九届进博会闭幕新闻通气会11月10日举行。记者获悉，本届进博会期间，上海市2800多家离境退税商店共办理离境退税销售额超过1亿元。（人民财讯）", "ctime": 1794297550, "time_str": "15:59:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261110/c681654927.shtml"}, {"id": "5614429", "title": "顿涅茨克地区遭袭致6人受伤 逾15万户断电", "content": "据当地时间10日消息，顿涅茨克彼得罗夫斯基区夜间遭无人机袭击，造成6人受伤。据顿涅茨克能源公司消息，该市各区均出现断电，共有1169座变电站触发自动跳闸，逾15万户断电。（央视新闻）", "ctime": 1794297463, "time_str": "15:57:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261110/c681654884.shtml"}, {"id": "5614421", "title": "第九届进博会上海交易团采购成交再创新高", "content": "第九届进博会闭幕新闻通气会11月10日举行。本届进博会期间，上海交易团采购成交再创新高。上海市组织近1.5万家企业、12.2万名采购商参会，开展商务对接、投资促进等配套活动40场，按一年计意向成交金额112亿美元，同比增长5.47%，连续9年居地方交易团首位。（人民财讯）", "ctime": 1794297435, "time_str": "15:57:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261110/c681654869.shtml"}, {"id": "5614419", "title": "广深铁路：A股股份回购实施完成，实际回购3265.37万股", "content": "广深铁路公告，公司此前审议通过以集中竞价交易方式回购A股股份方案，回购资金总额为1亿元（不含交易费用），回购价格不超过4.53元/股，回购股份全部注销并减少注册资本。2026年11月9日，公司完成回购，已实际回购公司A股股份3265.37万股，占公司总股本比例为0.46%，成交最高价为3.28元/股，成交最低价为2.96元/股，回购均价为3.06元/股，支付的总金额为9999.92万元（不含交易费用）。公司将于2026年11月11日注销本次所回购的A股股份3265.37万股。", "ctime": 1794297419, "time_str": "15:56:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261110/c681654862.shtml"}, {"id": "5614393", "title": "押注选举变局 逾千名中美洲移民抵墨欲赴美", "content": "逾千名中美洲移民日前抵达墨西哥南部恰帕斯州塔帕丘拉市，打算继续北上入境美国。美国共和党中期选举惨败、失去国会多数席位，不少人预期民主党掌控国会两院后移民政策将放宽，决定冒险闯关。25岁洪都拉斯移民米萨埃尔·巴斯克斯称，民主党获胜让他看到希望。分析人士认为，该队伍抵达美墨边境并进入美国的可能性小，此前多支同类队伍往往在恰帕斯州就被墨方拦截。（新华社）", "ctime": 1794297332, "time_str": "15:55:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261110/c681654820.shtml"}, {"id": "5614379", "title": "俄美乌三方会议前 乌美欧在阿布扎比先谈", "content": "当地时间10日，乌克兰对外情报局局长乌梅罗夫表示，乌克兰、美国和欧洲的三方会谈已在阿联酋阿布扎比开始举行，随后将举行乌克兰、美国和俄罗斯三方会议。（央视新闻）", "ctime": 1794297228, "time_str": "15:53:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261110/c681654748.shtml"}, {"id": "5614377", "title": "“爱国者”导弹短缺　欧洲要保自用而不愿援乌", "content": "消息人士披露，欧洲国家“爱国者”防空系统所用拦截弹库存紧张，在未获美国明确承诺补充供应前不愿向乌克兰提供，乌方面临短缺局面可能还将持续至少一年。彭博社援引知情人士称，欧洲各国PAC-2和PAC-3型拦截弹库存已降至最低水平。美国政府上月30日宣布批准向乌出售500枚“爱国者”导弹及相关设备，价值21亿美元，由洛克希德－马丁公司总承包，费用完全由合作伙伴和盟友承担，但这批导弹难以短期内交付，美军因伊朗战事已消耗约65%库存。泽连斯基10月19日、29日及本月1日多次发文催促伙伴尽快提供防空支持。乌克兰预计2027年和2028年接收600枚在德国生产的PAC-2型拦截弹，届时供应短缺有望改善。（新华社）", "ctime": 1794297213, "time_str": "15:53:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261110/c681654739.shtml"}, {"id": "5614373", "title": "贵州茅台王莉：前期市场改革转型取得一定成效达到预期", "content": "11月10日，贵州茅台召开2026年第三季度业绩说明会，公司董事王莉（代行总经理职责）表示，目前贵州茅台酒、茅台酱香酒市场整体呈现产品供给适配、市场价盘稳定、渠道库存良性的态势，前期市场化改革和转型工作取得一定成效，达到预期。（人民财讯）", "ctime": 1794297192, "time_str": "15:53:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261110/c681654731.shtml"}, {"id": "5614357", "title": "生物股份：子公司牛结节性皮肤病灭活疫苗获新兽药注册证书", "content": "生物股份公告，经国家农业农村部审查，批准公司全资子公司金宇保灵研制的牛结节性皮肤病灭活疫苗（NMG株）为新兽药，并核发《新兽药注册证书》，注册分类为一类，证书号（2026）新兽药证字125号。该产品用于预防牛结节性皮肤病，免疫期为6个月。金宇保灵后续将开展产品批准文号申请及报审，取得批准文号后方可上市销售。", "ctime": 1794297026, "time_str": "15:50:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261110/c681654683.shtml"}, {"id": "5614327", "title": "仙坛股份：2026年10月鸡肉产品销售收入5.34亿元，同比增长6.15%", "content": "仙坛股份公告，2026年10月实现鸡肉产品销售收入5.34亿元，销售数量6.05万吨，同比分别增长6.15%、7.43%，环比分别增长4.15%、下降0.02%。其中，家禽饲养加工行业实现鸡肉产品销售收入4.58亿元，销售数量5.61万吨（抵消前销售收入50983.66万元，销售数量6.01万吨），同比分别增长0.40%、6.12%，环比分别增长5.40%、0.93%；食品加工行业实现鸡肉产品销售收入7532.83万元，销售数量0.44万吨，同比分别增长62.93%、27.49%，环比分别下降2.89%、10.73%。", "ctime": 1794296910, "time_str": "15:48:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261110/c681654619.shtml"}, {"id": "5614301", "title": "中美元首会晤是否会谈及“黄乐间谍案”一事？外交部：中方对这一论调已多次阐明立场", "content": "11月10日，外交部发言人郭嘉昆主持例行记者会。法新社记者提问，有指控称，Alice Huang（黄乐）曾为中国情报部门工作，且她与英伟达首席执行官黄仁勋关系密切。请问中美元首是否会在会晤时谈及此事？郭嘉昆表示，关于你提到的元首会晤，中美双方就两国元首年内互动安排保持着沟通。你还提到了关于“中国间谍”的论调，我们此前已就所谓“中国间谍”的论调多次阐明立场。（澎湃新闻）", "ctime": 1794296642, "time_str": "15:44:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261110/c681654439.shtml"}, {"id": "5614299", "title": "江苏华辰：拟1000万元认购股权投资基金份额，占认缴总额9.2584%", "content": "江苏华辰公告，公司拟作为有限合伙人以自有资金1000万元参与认购青岛景鸿股权投资合伙企业（有限合伙）份额，占本次投资后标的基金认缴出资总额的9.2584%。本次投资后，合伙企业募集资金总规模拟为1.08亿元。标的基金投资范围为中国大陆地区从事国家法律允许的与集成电路、芯片领域相关企业股权。本次投资不构成关联交易，亦不构成重大资产重组，未达到公司董事会和股东会审议标准。", "ctime": 1794296639, "time_str": "15:43:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261110/c681654438.shtml"}, {"id": "5614227", "title": "贵州茅台王莉：国际化业务发展承受较大压力，持续优化海外渠道体系和市场生态", "content": "11月10日，贵州茅台召开2026年第三季度业绩说明会，董事王莉（代行总经理职责）表示，2026年海外市场面临消费需求疲软、渠道体系与消费需求适配不足、文化及口味差异、政策监管和物流成本等多重挑战，国际化业务发展承受较大压力。茅台持续推进国际化战略转型：主动为渠道减负、合理调整投放节奏；持续整治“回流酒”，强化海外市场渠道管控，加大违规行为整治力度，防止出口产品回流扰动国内市场秩序。上述调整对当期国际化业务收入产生了一定影响，下一步将秉持长期主义，持续优化海外渠道体系和市场生态。（界面新闻）", "ctime": 1794296202, "time_str": "15:36:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261110/c681654256.shtml"}, {"id": "5614223", "title": "哈药股份：注射用头孢唑肟钠通过仿制药一致性评价", "content": "哈药股份公告，公司所属企业哈药集团制药总厂近日收到国家药品监督管理局颁发的关于注射用头孢唑肟钠的《药品补充申请批准通知书》，规格为0.5g和1.0g，以上药品通过仿制药质量和疗效一致性评价。截至公告日，公司对该项目已投入研发费用共计约679.27万元人民币（未经审计）。", "ctime": 1794296170, "time_str": "15:36:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261110/c681654244.shtml"}, {"id": "5614203", "title": "贵州茅台王莉：国际化业务发展承受较大压力 持续优化海外渠道体系和市场生态", "content": "11月10日，贵州茅台召开2026年第三季度业绩说明会，董事王莉（代行总经理职责）表示，2026年海外市场面临消费需求疲软、渠道适配不足、文化口味差异、政策监管和物流成本等多重挑战，国际化业务发展承受较大压力。茅台持续推进国际化战略转型：主动为渠道减负、合理调整投放节奏；持续整治“回流酒”，强化海外渠道管控，防止出口产品回流扰动国内市场秩序。上述调整对当期国际化业务收入产生了一定影响，下一步将秉持长期主义，持续优化海外渠道体系和市场生态。（人民财讯）", "ctime": 1794296087, "time_str": "15:34:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261110/c681654192.shtml"}, {"id": "5614199", "title": "宁波舟山港年集装箱吞吐量再破4000万标准箱", "content": "截至11月10日，宁波舟山港2026年集装箱吞吐量已超4000万标准箱，连续第二年达到这一作业量，较去年提前22天。2026年前三季度我国货物贸易进出口总值达39.94万亿元，同比增长18.8%。全港海铁联运线路达115条，辐射全国16个省份、71个地级市，今年海铁联运业务量已超180万标准箱；集装箱航线超310条，连接全球200多个国家和地区的700多个港口。中欧北极快航进入常态化运营，通航季已完成8个航次，穿越北极东北航道单程约20天抵达欧洲，较传统苏伊士运河航线航程缩短近一半。9月全港集装箱日均作业量突破14万标准箱，单月完成427万标准箱，处于历史最高水平。（新华社）", "ctime": 1794296075, "time_str": "15:34:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261110/c681654187.shtml"}, {"id": "5614187", "title": "合富中国：2026年1-10月累计营业收入同比下降6.60%", "content": "合富中国公告，公司2026年1-10月累计合并营业收入为5.48亿元，较去年同期的5.87亿元减少6.60%，相较去年对比前年同期降幅2 , "content": "11月10日，贵州茅台召开2026年第三季度业绩说明会，公司董事王莉（代行总经理职责）表示，2026年公司将以消费者为中心、以市场需求为驱动，改变向渠道“压货”的传统运营模式，推动供给与市场需求动态匹配。自营渠道直接触达消费能力增强，部分产品在社会渠道推行物权不转移的“代售”模式，两部分均不形成预收账款；公司建立以市场需求为驱动的社会渠道产品动态投放模型，投放前才安排打款。行业向渠道“预收款压货”的传统模式已不能适应消费端深刻变化，随着公司市场化运营深入推进，预收账款规模大小已不再是衡量市场供求态势的主要指标。（人民财讯）", "ctime": 1794295676, "time_str": "15:27:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261110/c681653965.shtml"}, {"id": "5614041", "title": "第十届进博会已有143家企业及机构签约", "content": "第九届中国国际进口博览会闭幕新闻通气会11月10日举行。记者从该场通气会获悉，本届进博会闭幕，第十届进博会筹备工作同步启动，目前已有143家企业及机构签约，展览面积已超过10万平方米。（人民财讯）", "ctime": 1794295648, "time_str": "15:27:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261110/c681653950.shtml"}, {"id": "5614037", "title": "消息称菲律宾一架载有6名外国公民的私人飞机坠毁", "content": "据菲律宾方面10日消息，一架载有6名外国公民的私人飞机当天上午在菲律宾棉兰老岛坠毁。（央视新闻）", "ctime": 1794295569, "time_str": "15:26:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261110/c681653908.shtml"}, {"id": "5614033", "title": "中方对中美俄会晤有何期待？外交部：中方就三方元首会晤保持着沟通", "content": "11月10日，外交部发言人郭嘉昆主持例行记者会。法新社记者提问，据《华尔街日报》报道，中方领导人不愿在亚太经合组织（APEC）会议期间与美、俄举行三方会晤，除非会谈能够就包括核军控在内的各项议题进行公开讨论，而不是事先敲定结果。中方对此次三方会晤有何期待？郭嘉昆表示：“中方就中俄美元首会晤同相关方保持着沟通，关于你提到的具体问题，我目前没有可以提供的信息。”（澎湃）", "ctime": 1794295526, "time_str": "15:25:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261110/c681653879.shtml"}, {"id": "5614027", "title": "与黄仁勋关系密切的女子Alice Huang（黄乐）是否为中国公民？外交部回应", "content": "11月10日，外交部发言人郭嘉昆主持例行记者会。彭博社记者提问，外交部能否确认‌Alice Huang（黄乐）是否为中国公民，以及她目前身在何处？“我们此前已经就此作出回应，所谓中国间谍的论调纯属是捕风捉影，污蔑抹黑。”郭嘉昆说。（澎湃新闻）", "ctime": 1794295230, "time_str": "15:20:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/2 // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
