<style>
:root {

* { margin:0; padding:0; box-sizing:border-box; }
body {

  background: var(--bg-primary);
  color: var(--text-primary);
  min-height: 100vh;
}
.mono { font-family: 'JetBrains Mono', monospace; }
.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 20px;
  transition: all 0.2s;
}
.card:hover { background: var(--bg-card-hover); border-color: #334155; }
.badge {
  display: inline-flex; align-items: center; padding: 2px 8px;
  border-radius: 6px; font-size: 12px; font-weight: 500;
}
.badge-s { background: rgba(239,68,68,0.2); color: #ef4444; }
.badge-a { background: rgba(245,158,11,0.2); color: #f59e0b; }
.badge-b { background: rgba(59,130,246,0.2); color: #3b82f6; }
.badge-c { background: rgba(100,116,139,0.2); color: #94a3b8; }
.score-bar {
  height: 6px; border-radius: 3px; background: #1e293b; overflow: hidden;
}
.score-bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s; }
.up { color: var(--red); }
.down { color: var(--green); }
.pulse { animation: pulse 2s infinite; }
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}
.glow { box-shadow: 0 0 20px rgba(59,130,246,0.15); }

</style>

              <th class="text-right py-2 px-1">现价</th>
              <th class="text-right py-2 px-1">涨幅</th>
              <th class="text-right py-2 px-1">评分</th>
              <th class="py-2 px-1 text-center" style="min-width:160px">评分分布</th>
              <th class="text-right py-2 px-1">板块</th>
              <th class="text-right py-2 px-1">连涨</th>
            </tr>
          </thead>
          <tbody id="picks-table"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- 新闻流 + 交易代理 -->
<div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
  <div class="card">
    <h2 class="text-sm font-medium text-gray-400 mb-4">实时新闻流</h2>

  <div class="card">
    <h2 class="text-sm font-medium text-gray-400 mb-4">交易代理状态</h2>
    <div id="agent-status" class="space-y-3"></div>
  </div>
</div>

": "", "url": "https://news.10jqka.com.cn/20260403/c675751116.shtml"}, {"id": "4183711", "title": "伊朗称再次击落美军F-35战斗机", "content": "当地时间3日，伊朗伊斯兰革命卫队公共关系部发布声明称，伊朗伊斯兰革命卫队部署的先进防空系统，在伊朗中部空域成功击落了第二架美军先进的F-35战斗机。该战机由洛克希德-马丁公司制造，目前已被彻底摧毁并坠毁。这是过去12小时内，伊朗革命卫队防空系统击落的第二架美军战机。由于机体已完全解体，目前尚未获得有关飞行员下落的消息。声明强调：“这是我们首次以防空行动回击特朗普的荒谬言论。”(央视新闻)", "ctime": 1775192784, "time_str": "13:06:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260403/c675751070.shtml"}, {"id": "4183703", "title": "天龙三号运载火箭发射失利", "content": "4月3日12时17分，天龙三号大型液体运载火箭在酒泉卫星发射中心发射升空，火箭飞行异常，发射任务失利。任务团队将严格执行航天归零程序，全面开展改进工作。（财联社）", "ctime": 1775192624, "time_str": "13:03:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260403/c675751020.shtml"}, {"id": "4183675", "title": "上证指数午后跌1%", "content": "上证指数跌幅扩大至1%，深证成指跌0.78%，创业板指跌0.25%。", "ctime": 1775192494, "time_str": "13:01:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260403/c675750978.shtml"}, {"id": "4183661", "title": "知情人士称美将延迟交付日本订购的“战斧”导弹", "content": "据美国方面4月3日援引知情人士消息，由于美国与以色列对伊朗袭击导致库存吃紧，日本从美国订购的数百枚“战斧”导弹面临交付延迟。消息称，美方已通知日本政府，其原定于2028年3月前交付约400枚导弹的计划将受到影响。(央视新闻)", "ctime": 1775192288, "time_str": "12:58:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260403/c675750933.shtml"}, {"id": "4183653", "title": "俄罗斯一客运列车部分车厢脱轨", "content": "据俄罗斯铁路公司3日消息，一辆开往莫斯科的客运列车的7节车厢当天在乌里扬诺夫斯克州脱轨。(新华社)", "ctime": 1775191913, "time_str": "12:51:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260403/c675750840.shtml"}, {"id": "4183651", "title": "泰国总理：将严厉打击石油走私与囤积行为", "content": "泰国总理阿努廷 查维拉库尔周五表示，泰国当局将对石油走私和囤积行为展开调查。阿努廷在新闻发布会上称，将对违法者依法予以最严厉惩处。他表示，政府正加大打击力度，整治囤积居奇、哄抬物价以及向邻国走私燃油的行为。阿努廷称，这些行为是导致近期国内燃油短缺的原因之一。警方在发布会上表示，调查已发现缅甸边境沿线的加油站存在囤积和走私燃油行为。", "ctime": 1775191707, "time_str": "12:48:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260403/c675750800.shtml"}, {"id": "4183647", "title": "小米 MiMo Token Plan正式上线", "content": "据小米技术消息，Xiaomi MiMo Token Plan正式上线。据介绍，Xiaomi MiMo Token Plan是面向个人用户与开发者的小米自研大模型调用套餐。", "ctime": 1775191371, "time_str": "12:42:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260403/c675750675.shtml"}, {"id": "4183645", "title": "日本财务大臣警告：特朗普言论加剧市场波动，或采取“大胆行动”", "content": "日本财务大臣片山皋月周五对近期金融市场的剧烈波动表达了深切担忧，并明确指出美国总统特朗普的相关言论是引发市场动荡的重要因素。片山皋月在记者会上表示：“特朗普的言论对全球市场——包括所有资产类别——产生了相当大的影响。”片山皋月特别提及原油期货市场，表明当局的监控范围已超出传统的外汇市场，正密切关注更广泛的金融市场动态。面对市场波动对民众生活和实体经济可能造成的影响，片山皋月重申了政府的强硬立场。她表示：“政府已做好从各方面采取措施的准备。”（新华财经）", "ctime": 1775191046, "time_str": "12:37:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260403/c675750624.shtml"}, {"id": "4183643", "title": "美军沙特基地一“萨德”反导雷达在伊朗袭击中受损", "content": "美国方面最新公布的卫星图像显示，位于沙特阿拉伯苏丹王子空军基地的一部美军关键雷达在3月1日伊朗对其袭击中受损。该雷达型号为AN/TPY－2，是美国“萨德”反导系统的核心设备。据悉，负责“萨德”项目的美国导弹防御局在其2025年预算中，将一部AN/TPY－2天线的成本列为1.36亿美元。目前，美国国防部及美军中央司令部尚未对苏丹王子空军基地雷达遭袭作出回应。（央视新闻）", "ctime": 1775191027, "time_str": "12:37:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260403/c675750623.shtml"}, {"id": "4183641", "title": "中国呼吁国际社会支持中东和平解决方案", "content": "中国常驻联合国代表傅聪在联合国安理会会议上强调，国际社会应尊重中东人民的自主选择，支持阿拉伯国家化解矛盾、加强团结，并探索符合自身国情的发展道路。傅聪指出，中东问题应通过政治手段解决，阿拉伯国家具备独特优势。当前中东局势紧张，国际社会应劝和促谈，防止战火升级。傅聪特别提到，“两国方案”是解决巴勒斯坦问题的唯一可行出路，中方愿与阿拉伯国家共同推动中东和平与发展。(新华社)", "ctime": 1775190883, "time_str": "12:34:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260403/c675750567.shtml"}, {"id": "4183639", "title": "4月3日午间公告一览：中赋科技之“中环转2”最后交易日为2026年4月3日", "content": "中赋科技公告，“中环转2”最后交易日为2026年4月3日，最后转股日为2026年4月9日。2026年4月9日收市后未转股的“中环转2”将停止转股，并按照101.49元/张的价格强制赎回。", "ctime": 1775190843, "time_str": "12:34:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260403/c675750557.shtml"}, {"id": "4183635", "title": "大湾区大学将首次面向港澳招生", "content": "近日，大湾区大学本科招生说明会暨校园开放日活动在东莞松山湖校区举行。本次说明会披露，2026年大湾区大学计划面向广东、广西、湖南、湖北、河南五省及港澳地区招收本科生。其中广东招收120人、广西招收15人、湖南招收15人、湖北招收15人、河南招收15人，港澳全国联考招收10人，总规模约190人。所有专业均要求选考物理和化学，按“计算机科学与技术”大类招生。学生入学后大一不分专业，大二可在数学与应用数学、物理学、材料科学与工程、未来机器人、人工智能等11个前沿专业中自由选择，转专业零门槛。（东莞发布）", "ctime": 1775190619, "time_str": "12:30:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260403/c675750518.shtml"}, {"id": "4183629", "title": "中原股权交易中心：已与7家银行签订战略合作协议", "content": "4月3日，记者从中原股权交易中心获悉，该中心设立的河南省“专精特新”专板近期完成了一项专属信贷服务，由中原银行对专板培育企业郑州科慧科技股份有限公司已放款“专精特新贷”1000万元，利率2.95%，较去年降低35个BP。据悉，目前多个省份“专精特新”专板已推出专属信贷服务，助力解决中小企业融资难、融资贵问题，如山西、陕西股权交易中心推出“专精特新专板贷”，福建海峡股权交易中心发布“专精特新专板·培育贷”。中原股权交易中心已与7家银行签订战略合作协议，为河南省“专精特新”专板培育企业提供贷款额度放大、利率下调等专属服务。（大河财立方）", "ctime": 1775190424, "time_str": "12:27:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260403/c675750484.shtml"}, {"id": "4183627", "title": "4月起两轮车集体涨价，成都多家品牌门店“下一批货将涨”，线上渠道暂未调价", "content": "近日，雅迪、九号、台铃、爱玛等电动两轮车品牌纷纷传出涨价消息。4月2日，记者走访成都多家门店并咨询线上旗舰店发现，这一轮涨价虽已启动，但在终端市场并未同步执行，呈现出分步调价的状态。相比之下，更多品牌仍处于“未涨但将涨”的阶段。多家门店表示，只要仍有库存，价格就暂时不会调整；一旦补货，终端售价将随进货成本同步上行。（四川日报）", "ctime": 1775190383, "time_str": "12:26:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260403/c675750477.shtml"}, {"id": "4183621", "title": "巴基斯坦将燃油价格上调近五成", "content": "巴基斯坦石油部长阿里 佩尔韦兹 马利克（ Ali Pervaiz Malik）在新闻发布会上宣布，该国将汽油价格上调43%，至每升458.4卢比；柴油价格上调55%，至每升520.35卢比。马利克表示，巴基斯坦还将从全面燃油补贴转向更具针对性的补贴方式。财政部长穆罕默德 奥朗则布称，巴基斯坦将向摩托车、运输车辆及铁路领域提供补贴。注：巴基斯坦此前通过发放1290亿卢比（约合4.62亿美元）补贴，将燃油价格维持了三周不变。", "ctime": 1775189933, "time_str": "12:18:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260403/c675750389.shtml"}, {"id": "4183615", "title": "中东冲突致能源供应受阻，新加坡制造业遭冲击", "content": "制造业是新加坡的支柱产业之一，且高度依赖能源进口。据新加坡制造商总会介绍，受此次中东冲突影响，近期新加坡制造业中的原油炼制、石化、半导体等领域受到了冲击。作为全球第三大炼油中心和重要石油贸易枢纽，新加坡炼油产业高度依赖中东原油供应。中东冲突发生之后，来自海湾地区的原油出现大量延迟或取消交付的情况，新加坡炼油公司作业率因此大幅下降。新加坡制造商总会会长陈展鹏表示，随着近期油价上涨，能源密集型企业的成本已经上升了大约2%到6%。由于原油供应不足，许多炼油厂目前的产能利用率仅维持在50%到60%左右。这既扰乱了供应链，也影响了运营效率。（央视新闻）", "ctime": 1775189510, "time_str": "12:11:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260403/c675750305.shtml"}, {"id": "4183597", "title": "智元：将于4月7日开启 “智元AI发布周” 密集展示具身智能领域AI自研成果", "content": "智元（AGIBOT）4月3日官宣，将于下周4月7日开启“智元AI发布周”（AGIBOT AI Week）。这场为期一周的集中发布，将是智元在具身智能领域AI自研成果的一次密集亮相，旨在推动全行业加速物理AI的进化。发布周期间，智元将每日解锁一项核心技术突破，六天时间完整展开智元在物理AI方面的能力版图，攻克行业“技术拼凑、落地断层”的普遍痛点，为具身智能产业发展建设AI能力基础设施，推动具身智能飞轮运转。", "ctime": 1775189057, "time_str": "12:04:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260403/c675750203.shtml"}, {"id": "4183585", "title": "美金融分析师：油气涨价已向更多领域传导", "content": "2日，美国金融分析师、恩迪科特学院兼职教授迈克尔·柯林斯表示，当前中东冲突引发最直接的风险仍然是能源价格冲击，国际油气价格已经被推高，并开始向更广泛的经济领域传导。柯林斯指出，能源依然是这场冲突带来的首要经济风险。除原油外，全球液化天然气贸易也面临冲击，市场波动已明显加剧。他说，战争影响不会停留在能源本身，还可能通过化肥、芯片、运输和供应链等渠道继续外溢。（央视新闻）", "ctime": 1775188920, "time_str": "12:02:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260403/c675750163.shtml"}, {"id": "4183583", "title": "两部门联合部署新一轮金融领域“黑灰产”违法犯罪集群打击工作", "content": "4月2日，公安部经济犯罪侦查局、国家金融监督管理总局稽查局召开视频会议，联合部署开展新一轮金融领域“黑灰产”违法犯罪集群打击工作，进一步整治金融非法中介乱象，坚决维护金融管理秩序，切实保护金融消费者合法权益，努力以高水平安全护航金融高质量发展。会议强调，要提升打击质效，深挖犯罪链条和犯罪团伙，分类制定打击策略，延伸打击幕后实际操控黑手，确保集群打击取得新突破。要突出打击重点，聚焦非法存贷款中介、非法网贷平台和助贷机构、非法保险代理中介、信用卡不正当“反催收”中介等，探索创新打击治理新策略、新路径、新手段。要强化部门协作、警种协作和区域协作，进一步健全线索通报等长效机制，确保打深打透打全。要严格依法办案，坚持以打促治、以打促防，加大防范宣传力度，提高社会公众防范意识。（央视新闻）", "ctime": 1775188914, "time_str": "12:01:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260403/c675750160.shtml"}, {"id": "4183577", "title": "美军沙特基地一萨德反导雷达在伊朗袭击中受损", "content": "据美国有线电视新闻网2日报道，最新公布的卫星图像显示，位于沙特阿拉伯苏丹王子空军基地的一部美军关键雷达在3月1日伊朗对其袭击中受损。 报道说，该雷达型号为AN/TPY－2，是美国“萨德”反导系统的核心设备。美国有线电视新闻网此前曾报道，苏丹王子空军基地一个放置该雷达的帐篷被击中，但无法确认袭击发生时雷达是否在帐篷内以及是否受损。最新图像显示，目前该雷达已被移出帐篷，露天放置。其天线有烧焦痕迹，且有大块缺损。 报道说，伊朗试图通过打击雷达来削弱美国探测来袭导弹和无人机的能力。此前，伊朗还曾对美军部署在约旦的AN/TPY－2雷达和部署在卡塔尔的预警雷达进行打击。 报道说，负责“萨德”项目的美国导弹防御局在其2025年预算中，将一部AN/TPY－2天线的成本列为1.36亿美元。目前，美国国防部及美军中央司令部尚未对苏丹王子空军基地雷达遭袭作出回应。(新华社)", "ctime": 1775188868, "time_str": "12:01:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260403/c675750151.shtml"}, {"id": "4183551", "title": "伊朗发动“真实承诺4”第90波军事行动", "content": "伊朗发动“真实承诺4”第90波军事行动。（央视新闻）", "ctime": 1775188057, "time_str": "11:47:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260403/c675749911.shtml"}, {"id": "4183547", "title": "“十五五”电子信息制造业规划座谈会在武汉召开", "content": "为深入贯彻落实党的二十大和二十届历次全会精神，科学谋划“十五五”时期电子信息制造业发展蓝图，2026年3月27日，工业和信息化部电子信息司在湖北省武汉市召开“十五五”电子信息制造业规划座谈会。工业和信息化部电子信息司司长杨旭东到会，工业和信息化部电子信息司、国家发展改革委高技术司相关处室同志参会。天津、辽宁、上海、江苏、福建、江西、湖北、湖南、广东、四川、陕西、新疆等12个省（区、市）代表参加会议。会上，工业和信息化部电子信息司介绍了“十五五”电子信息制造业规划编制的工作背景、已开展工作和主要思路。地方工信主管部门代表围绕规划征求意见稿，结合本地区电子信息制造业发展实际，从优化区域合理布局、与国家“十五五”规划纲要做好衔接、明确细分领域产业化方向、进一步强化对外开放等方面提出了意见建议。会议指出，电子信息制造业具有规模大、链条长、创新活跃，市场大、国际化程度高，产业链供应链安全风险大，长板和短板都很突出，区域集群化发展明显，赋能引领作用显著等特征，对于各省的工业经济发展带动性特别强。要准确把握“十五五”时期电子信息制造业发展面临的新形势新任务，坚持系统观念，加强统筹协调，充分吸纳地方意见建议，做好上下联动，加快“十五五”电子信息制造业规划编制工作，为推动电子信息制造业高质量发展、建设制造强国提供有力支撑。(工信部)", "ctime": 1775188001, "time_str": "11:46:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260403/c675749878.shtml"}, {"id": "4183545", "title": "紫光股份成立智联科技公司 含多项AI业务", "content": "企查查APP显示，近日，万数智联（北京）科技有限公司成立，法定代表人为黄辉华，注册资本为3000万元，经营范围包含：人工智能基础软件开发；人工智能公共数据平台；人工智能应用软件开发；移动终端设备销售等。企查查股权穿透显示，该公司由紫光股份控股的紫光计算机科技有限公司全资持股。", "ctime": 1775187946, "time_str": "11:45:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260403/c675749866.shtml"}, {"id": "4183531", "title": "期货午评：原油系持续走强，燃油涨超5%", "content": "期货午评：截止午盘，大宗商品涨跌不一。涨幅方面，低硫燃料油、燃油涨超5%，SC原油涨近5%，钯涨近4%，甲醇、PTA涨超3%。跌幅方面，多晶硅跌超5%，沪银、生猪跌超2%。", "ctime": 1775187156, "time_str": "11:32:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260403/c675749626.shtml"}, {"id": "4183529", "title": "ETF午评：港股通100ETF领涨5.19%，养殖ETF领跌3.19%", "content": "ETF午间收盘涨跌不一，港股通100ETF（513900）领涨5.19%，标普油气ETF（159518）涨4.01%，标普油气ETF（513350）涨3.96%，养殖ETF（159867）领跌3.19%，创新药ETF（517380）跌3.18%，粮食ETF（159698）跌3.14%。", "ctime": 1775187149, "time_str": "11:32:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260403/c675749623.shtml"}, {"id": "4183527", "title": "ETF两市成交额2992.41亿元", "content": "截至目前，ETF两市成交额报2992.41亿元，分类型来看，股票型ETF成交额602亿元，债券型ETF成交额1910.16亿元，货币型ETF成交额176.01亿元，商品型ETF成交额81.54亿元，QDII型ETF成交额155.77亿元。其中，成交额最高的非货币型ETF分别是A500ETF（563360）A500ETF（512050）A500ETF（159352）成交额分别为43.02亿元37.24亿元36.50亿元", "ctime": 1775187145, "time_str": "11:32:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260403/c675749616.shtml"}, {"id": "4183525", "title": "A股午评：三大指数持续缩量下跌沪指失守3900点 全市场超4700家个股下跌", "content": "截至午盘，上证指数跌0.93%，深 // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
