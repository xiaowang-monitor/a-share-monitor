.card {

  padding: 20px;
  transition: all 0.2s;
}
.card:hover { background: var(--bg-card-hover); border-color: #334155; }
.badge {

  height: 6px; border-radius: 3px; background: #1e293b; overflow: hidden;
}
.score-bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s; }
.up { color: var(--red); }
.down { color: var(--green); }
.pulse { animation: pulse 2s infinite; }
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}
.glow { box-shadow: 0 0 20px rgba(59,130,246,0.15); }
::-webkit-scrollbar { width: 6px; }

: false, "source": "", "url": "https://news.10jqka.com.cn/20260609/c677328996.shtml"}, {"id": "4492005", "title": "通源石油：中标阿尔及利亚油气服务项目，金额合计约10.21亿元", "content": "通源石油公告，公司近日成功中标阿尔及利亚国家石油公司（Sonatrach）的01/SH/PROD/OPR/2025第3、7标段油气服务项目。项目合同期4年，包括美元及阿尔及利亚第纳尔两部分，分别为1.24亿美元、35.01亿阿尔及利亚第纳尔（合计约1.5亿美元或者10.21亿元人民币）。该项目未签署正式合同，合同签署尚存在一定不确定性。", "ctime": 1780999109, "time_str": "17:58:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260609/c677328961.shtml"}, {"id": "4492001", "title": "甲骨文美股盘前涨超2%", "content": "甲骨文美股盘前涨超2%，现报216.5美元。", "ctime": 1780999081, "time_str": "17:58:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260609/c677328956.shtml"}, {"id": "4491999", "title": "昀冢科技：调整2025年度向特定对象发行A股股票方案 募集资金总额不超过8.75亿元", "content": "昀冢科技公告，公司调整2025年度向特定对象发行A股股票方案，募集资金总额不超过8.75亿元。调整后，募集资金将投资于DPC智能化产线技改扩建项目、片式多层陶瓷电容器智能化产线技改项目、高容量系列多层片式陶瓷电容器产业化技改项目以及补充流动资金及偿还银行贷款项目。本次发行决议的有效期为公司股东会审议通过之日起12个月。", "ctime": 1780999071, "time_str": "17:57:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260609/c677328953.shtml"}, {"id": "4491995", "title": "苏州固锝：董事、总经理滕有西拟减持0.0076%", "content": "苏州固锝公告，公司董事、总经理滕有西拟自本公告披露之日起15个交易日后的3个月内（2026年7月3日至2026年10月2日），以集中竞价方式减持不超过69191股，占公司2026年5月31日总股本9.08亿股的0.0076%，占其持股的25%。滕有西目前持有27.68万股，占总股本0.0305%。减持股份系股票期权激励计划行权所得，减持原因为个人资金需求。", "ctime": 1780998947, "time_str": "17:55:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260609/c677328903.shtml"}, {"id": "4491987", "title": "泽连斯基声称与美方进行“积极”对话", "content": "乌克兰总统泽连斯基8日说，他与美国总统特使威特科夫和特朗普的女婿库什纳进行了“积极”对话，并称两人有意在未来数周推动解决俄乌冲突。泽连斯基刚结束在英国首都伦敦与欧洲多国领导人的会晤。他回国途中在社交媒体“电报”发文说，在摩尔多瓦首都基希讷乌机场中转期间，他与威特科夫、库什纳进行了对话，感谢美方“愿在未来数周积极展开工作”。泽连斯基并未透露与美方对话的具体方式。但按法新社说法，双方通过电话沟通。泽连斯基随即又发文称，他与法国总统马克龙通过电话，告知对方自己与美方的对话内容并协调后续安排。他还说，与美方的对话也涉及他7日在伦敦同马克龙、英国首相斯塔默和德国总理默茨会晤的情况。（新华社）", "ctime": 1780998885, "time_str": "17:54:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260609/c677328819.shtml"}, {"id": "4491983", "title": "海伦哲：公司第一大股东之控股股东及其实际控制人因非本公司事项收到《行政处罚决定书》", "content": "海伦哲公告，公司第一大股东海徳资产管理有限公司之控股股东海南海德资本管理股份有限公司及其实际控制人王广西收到海南证监局出具的《行政处罚决定书》。因海南海德资本管理股份有限公司及其实际控制人王广西信息披露违法违规，海南证监局对海南海德资本管理股份有限公司给予警告，并处以200万元罚款。对王广西给予警告，并处以680万元罚款。其中，对其作为实际控制人处以500万元罚款，对其作为直接负责的主管人员处以180万元罚款。本次行政处罚涉及的事项与公司无关，不会对公司日常经营和业务活动产生影响。", "ctime": 1780998835, "time_str": "17:53:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260609/c677328805.shtml"}, {"id": "4491971", "title": "启迪设计：拟1元转让嘉力达100%股权", "content": "启迪设计公告，公司拟将持有全资子公司嘉力达100%股权以1元价格转让给轩世奇（北京）机电工程有限公司。嘉力达目前资不抵债，自2022年起持续亏损。交易完成后，嘉力达将不再纳入公司合并报表范围。此次交易旨在优化资产结构，提升公司盈利能力。", "ctime": 1780998825, "time_str": "17:53:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260609/c677328802.shtml"}, {"id": "4491955", "title": "泰凯英：拟以3000万元-5000万元回购公司股份", "content": "泰凯英公告，拟以3000万元-5000万元回购公司股份，回购价格不超过21元/股。", "ctime": 1780998689, "time_str": "17:51:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260609/c677328751.shtml"}, {"id": "4491951", "title": "伊朗媒体称2名伊军事人员在以色列袭击中丧生", "content": "据伊朗媒体8日报道，两名伊朗防空部队人员在以色列8日的袭击中丧生。(新华社)", "ctime": 1780998663, "time_str": "17:51:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260609/c677328738.shtml"}, {"id": "4491939", "title": "百傲化学：放弃增资芯慧联芯优先认购权 持股比例降至8.4851%", "content": "百傲化学公告，公司通过全资子公司芯傲华间接持股的芯慧联芯计划增资扩股。本轮投资人拟出资5000万元，后续投资人拟以1.5亿元认购新增注册资本，新设员工持股平台芯耀达拟出资181万元，芯辰达拟出资643.57万元。公司及芯慧联芯其他原有股东放弃增资事项的优先认 ml"}, {"id": "4491909", "title": "台基股份：长江产业集团受让185.59万股新仪元股权 持股比例升至44.64%", "content": "台基股份公告，公司控股股东襄阳新仪元半导体有限责任公司（简称“新仪元”）股权结构发生变动。长江产业投资集团有限公司（简称“长江产业集团”）受让邢雁、颜家圣、康进、吴拥军、徐遵立持有的部分新仪元股权，其中邢雁转让185.59万股，颜家圣转让23.96万股，康进转让63018股，吴拥军转让63018股，徐遵立转让46968股。变动后，长江产业集团持有新仪元803.6万股，持股比例由32.04%升至44.64%，公司控股股东及实际控制人未发生变化。", "ctime": 1780998265, "time_str": "17:44:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260609/c677328484.shtml"}, {"id": "4491907", "title": "道恩股份：控股子公司拟对外投资设立全资子公司青岛海纳新材国际贸易有限公司", "content": "道恩股份公告，基于业务发展的需要，公司控股子公司青岛海尔新材料研发有限公司拟对外投资设立全资子公司青岛海纳新材国际贸易有限公司（暂定名，以市场监督管理部门的最终登记为准），注册资本 1000 万元。同时董事会授权公司管理层全权负责办理本次设立全资子公司相关事宜。2026 年 6 月 9 日，公司召开第五届董事会第三十六次会议，审议通过了《关于控股子公司对外投资设立全资子公司的议案》。", "ctime": 1780998212, "time_str": "17:43:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260609/c677328466.shtml"}, {"id": "4491903", "title": "汉王科技：公司股票连续2个交易日收盘价格涨幅累计偏离21.80%", "content": "汉王科技公告，公司股票于2026年6月8日、6月9日连续2个交易日收盘价格涨幅累计偏离21.80%，属于股票交易异常波动。公司前期披露的信息不存在需要更正、补充之处，未发现近期公共传媒报道了可能或已经对本公司股票交易价格产生较大影响的未公开重大信息，公司已披露的经营情况、内外部经营环境未发生重大变化，公司、控股股东和实际控制人不存在关于本公司的应披露而未披露的重大事项，或处于筹划阶段的重大事项，股票异常波动期间，控股股东、实际控制人不存在买卖公司股票的情形。", "ctime": 1780998096, "time_str": "17:41:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260609/c677328412.shtml"}, {"id": "4491901", "title": "中船科技：公司拟对外投资41.49亿元项目", "content": "中船科技公告，根据公司主营业务发展需要，公司拟投资建设秦皇岛项目、甘南一期项目、福龙右项目，对外投资总金额合计约为 414,927.96 万元。其中，秦皇岛项目投资金额约为 170,449.13 万元，甘南一期项目投资金额约为153,322.36 万元，福龙右项目投资金额约为 91,156.47 万元。2026 年 6 月 9 日，公司召开第十届董事会第二十四次会议，审议通过《中船科技股份有限公司关于子公司对外投资的预案》。", "ctime": 1780998082, "time_str": "17:41:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260609/c677328408.shtml"}, {"id": "4491899", "title": "中孚实业：副总经理王力已减持0.015%", "content": "中孚实业公告，董事长马文超等5名董高自2026年3月10日至2026年6月9日实施减持计划期已届满，马文超、崔红松、宋志彬、杨萍减持0股，副总经理王力通过集中竞价减持60万股，占本人持股13.0435%，占公司总股本0.0150%，减持价格区间6.32～6.35元/股，成交金额380.15万元。", "ctime": 1780998016, "time_str": "17:40:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260609/c677328388.shtml"}, {"id": "4491885", "title": "索通发展：增资3.05亿元持股85%山西索通华阳炭材料有限公司", "content": "索通发展公告，为尽快完成项目备案、取得污染物排放与能耗指标，经与华阳集团协商，公司先行设立全资子公司申领上述指标，后续双方再对该全资子公司进行增资，以实现《合资协议》之目的。根据项目实施进展，《合资协议》约定的双方共同设立“合资公司”的模式无法继续履行，经双方协商一致，拟解除《合资协议》，签署《增资协议》。索通华阳注册资本暂定为3.6亿元人民币，索通发展以现金增资3.05亿元，华阳集团增资0.54亿元，增资款全部计入索通华阳的注册资本。增资完成后，索通华阳注册资本变更为3.6亿元，其中：索通发展认缴出资3.06亿元，持股85%；华阳集团认缴出资0.54亿元，持股15%。", "ctime": 1780997953, "time_str": "17:39:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260609/c677328365.shtml"}, {"id": "4491881", "title": "广东：积极布局重卡等商用车充换电设施", "content": "广东省发展改革委等部门近日印发《广东省电动汽车充电设施高质量发展行动方案》，方案提出，积极布局重卡等商用车充换电设施。各地结合产业、交通、物流发展、车辆推广实际，以车桩联动、互相促进为原则，研究推动重卡充换电设施规划建设。围绕重卡等商用车物流配送固定路线，在港口码头后方陆域、矿区、集装箱堆场、大型物流集散地、工业厂房仓库等具有特种工程车辆运用的场景，规划布局重卡充换电设施，服务电动重卡商用车应用，结合需求构建“干线+节点”电动重卡充换电组网，支持具有投资能力和运营经验的优质运营主体参与重卡充换电设施的建设和运营。（人民财讯）", "ctime": 1780997877, "time_str": "17:37:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260609/c677328328.shtml"}, {"id": "4491871", "title": "诺禾致源：公司被错误地纳入 1260H 清单，已与美相关方面开展沟通", "content": "诺禾致源公告，公司注意到，美国国防部于 2026 年 6 月 8 日发布依据《2021 财年国防授权法》第1260H条更新的相关清单，将“Novogene Company Limited”及其他七十余家中企列入其中。诺禾致源为独立经营的民营企业，与《2021 财年国防授权法案》1260H条款指出的相关部门无任何拥有、控制、受益所有、关联关系。将公司认定纳入1260H名单的指定依据与事实完全不符。诺禾致源已经与美相关方面开展沟通，澄清事实，并将采取必要措施，维护公司及全球利益相关方的合法权益。诺禾致源被错误地纳入 1260H 清单，并不意味着已被列入任何制裁或出口管制名单。截至目前，公司业务经营正常开展，未见异常。", "ctime": 1780997795, "time_str": "17:36:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260609/c677328290.shtml"}, {"id": "4491849", "title": "股价盘中触及跌停，业绩扭亏受益库存白银上涨，福达合金回应", "content": "6月9日，福达合金盘中触及跌停。截至收盘，公司股价报89.2元/股，跌0.89%。消息面上，公司昨晚公告提示风险。对此，福达合金方面独家回应中国证券报记者，股价受多重因素影响。对于市场关心的白银价格对业绩波动的影响，福达合金方面回应记者，白银价格波动对利润确实有影响，但影响不大。公司的定价模式是银的市场价再加上加工费。因此，客户下单的时候，公司会同步向供应商下单，是随行就市的购买。因此，风险敞口已经被承担了一大部分，只有剩余的风险敞口会影响利润。“随着银价回调，公司也会战略性地囤一部分货，但整体规模不大，因为白银毕竟是贵金属，多囤占用资金比较大。”福达合金方面告诉记者。(中证金牛座)", "ctime": 1780997636, "time_str": "17:33:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260609/c677328199.shtml"}, {"id": "4491845", "title": "赞宇科技：首次回购0.03%公司股份，成交总金额为人民币150万元", "content": "赞宇科技公告，截至2026年6月9日，公司通过回购专用证券账户以集中竞价交易方式累计回购股份数量为13.08万股，占公司股份总数的比例为0.03%，最高成交价为人民币11.47元/股，最低成交价为人民币11.46元/股，成交总金额为人民币150万元（不含交易费用）。", "ctime": 1780997629, "time_str": "17:33:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260609/c677328179.shtml"}, {"id": "4491839", "title": "永泰能源：实控人王广西因信息披露违法违规被罚款680万元", "content": "永泰能源公告，公司实际控制人王广西因信息披露违法违规行为，被海南监管局罚款680万元。王广西作为海德股份时任董事长，知悉海德股份资金占用相关情况，签字保证海德股份2021年年度报告、2022年年度报告、2023年年度报告、2024年半年度报告真实、准确、完整，未勤勉尽责，违反《证券法》第八十二条第三款的规定，是海德股份信息披露违法行为的直接负责的主管人员。", "ctime": 1780997522, "time_str": "17:32:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260609/c677328050.shtml"}, {"id": "4491837", "title": "南向资金今日净卖出86.14亿港元 盈富基金遭净卖出居前", "content": "南向资金今日净卖出86.14亿港元。盈富基金、南方恒生科技分别遭净卖出114.19亿港元、25.97亿港元；建滔集团、建滔积层板分别获净买入约18.30亿港元、12.32亿港元。", "ctime": 1780997488, "time_str": "17:31:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260609/c677328036.shtml"}, {"id": "4491807", "title": "春秋电子：预计现金分红总额为8936.17万元", "content": "春秋电子公告，截至2026年3月31日，公司总股本为4.47亿股，预计现金分红总额为8936.17万元（含税），占公司2 不快、检不准”的技术难题，促进近四千项科技成果转化与应用，有效补齐重点产业技术短板。（央视新闻）", "ctime": 1780997197, "time_str": "17:26:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260609/c677327828.shtml"}, {"id": "4491765", "title": "以军空袭黎南部城市提尔 已致4死11伤", "content": "总台记者获悉，以色列国防军9日上午对黎南部城市提尔的空袭已造成4人死亡、11人受伤。据了解，以军当天上午对提尔的一住宅区发动2次空袭。（央视新闻）", "ctime": 1780997122, "time_str": "17:25:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260609/c677327785.shtml"}, {"id": "4491759", "title": "倍加洁：股东小倍一号已减持0.1388%", "content": "倍加洁公告，公司股东及高管减持计划期满：小倍一号原拟减持不超210万股(2.0906%)，实际于2026年5月21日至2026年6月2日通过集中竞价减持13.94万股，占0.1388%，成交价28.5～30.31元/股；小倍二号原拟减持不超90万股(0.8960%)，嵇玉芳、薛运普各不超3000股(0.0030%)，期内均未减持，未完成部分已终止。", "ctime": 1780997043, "time_str": "17:24:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260609/c677327752.shtml"}, {"id": "4491711", "title": "新凤鸣：实控人及多名股东拟减持股份", "content": "新凤鸣公告，实控人屈凤琪拟大宗交易减持不超3354万股，占1.9994%；一致行动人桐乡市中聚投资拟竞价减持不超1677万股，占0.9997%；董事沈健彧、杨剑飞、副总裁许纪忠分别拟减持不超320万股、120万股、100万股，占0.1908%、0.0715%、0.0596%。减持期2026年7月2日至2026年10月1日。本次减持前上述股东合计持股9.09亿股，占54.1985%。", "ctime": 1780996863, "time_str": "17:21:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260609/c677327669.shtml"}, {"id": "4491709", "title": "格灵深瞳：公司不直接从事物理AI的产品及业务", "content": "格灵深瞳公告，公司股票交易连续3个交易日内（2026年6月5日、6月8日和6月9日）收盘价格涨幅偏离值累计超过30%，属于股票交易异常波动情形。经公司自查并向公司控股股东、实际控制人及其相关主体发函确认，截至本公告披露日，公司不存在应披露而未披露的重大信息。公司目前日常经营情况正常，未发生重大变化。公司的主营业务依托于视觉算法与多模态大模型技术，2025年度合并报表营业收入主要来源于政务及特种、城市管理、智慧金融领域的人工智能产品、智能终端计算设备及解决方案。公司不直接从事物理AI的产品及业务，公司现有的机器人感知与控制技术目前主要应用于轨交运维领域，应用场景较为单一，且该部分业务2025年度营业收入占公司合并报表营业收入的比例极小，对公司整体经营业绩不构成重大影响。物理AI技术研发投入大、技术迭代快，下游应用行业/场景拓展、商业化变现尚处早期，若市场需求、行业政策、技术竞争格局发生不利变化，相关场景收入及盈利贡献存在不确定性风险。", "ctime": 1780996853, "tim // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>

    </div>

}

      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
