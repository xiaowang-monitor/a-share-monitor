ource": "", "url": "https://news.10jqka.com.cn/20260618/c677562123.shtml"}, {"id": "4553785", "title": "中证指数有限公司：发布商业不动产REITs估值", "content": "中证指数有限公司公告，为更好服务市场投资者，满足市场用户对商业不动产REITs及其限售份额估值数据服务的需求，将于首批商业不动产REITs上市日起，在现有的公募REITs估值文件、流通受限公募REITs份额估值文件中纳入商业不动产REITs相关数据。中证估值授权用户可通过中证指数数据服务平台（“中证FTP”）获取数据文件。其他市场用户如有需求，请通过以下联系方式申请开通数据权限。（第一财经）", "ctime": 1781760652, "time_str": "13:30:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260618/c677562085.shtml"}, {"id": "4553775", "title": "三峡船闸通航23年累计过闸货运量达24亿吨", "content": "今天（6月18日），世界最大的内河船闸——三峡双线五级船闸迎来通航23周年。据长江三峡通航管理局统计数据，自2003年6月18日正式向社会船舶开放通航以来，三峡船闸累计运行22.5万闸次，通过船舶111.1万余艘次、旅客1232.7万余人次，过闸货运量达24亿吨。长江三峡通航管理局持续优化调度方案，稳步提升三峡船闸闸室空间利用率与通航效率；实现三峡船闸连续8000多天安全平稳运行，设备故障碍航率控制在0.2%以下。（央视新闻）", "ctime": 1781760593, "time_str": "13:29:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260618/c677562063.shtml"}, {"id": "4553771", "title": "科创50指数涨超5%，刷新历史新高", "content": "科创50指数涨超5%，刷新历史新高。寒武纪涨近16%，华虹宏力涨超12%.", "ctime": 1781760559, "time_str": "13:29:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260618/c677562053.shtml"}, {"id": "4553739", "title": "莫斯科遭无人机袭击", "content": "俄罗斯首都莫斯科18日清晨遭无人机袭击，一家购物中心和一家炼油厂受损。 莫斯科市长索比亚宁在社交媒体上说，截至目前，俄防空系统已击落50多架飞往莫斯科的无人机。无人机碎片导致莫斯科一家购物中心建筑受损，但无人员伤亡报告。此外，莫斯科一家炼油厂被数架无人机击中，目前正采取措施应对炼油厂遇袭受到的影响。 据俄罗斯媒体报道，莫斯科谢列梅捷沃机场等主要机场已对航班起降实施管制。(新华社)", "ctime": 1781760166, "time_str": "13:22:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260618/c677561886.shtml"}, {"id": "4553735", "title": "工业富联触及涨停", "content": "工业富联触及涨停，现报79.9元。", "ctime": 1781760101, "time_str": "13:21:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260618/c677561863.shtml"}, {"id": "4553725", "title": "光大期货：沃什首秀偏鹰，短线黄金或低位震荡", "content": "美联储靴子落地，隔夜伦敦现货贵金属冲高后快速回落，盘中跌幅一度超过2%。沃什首秀比预期偏鹰派，从结果导向来看对黄金偏利空，不过此前已有定价下，短线利空或不持续，但若从加息预期角度来看，利空影响或偏中期。另外，随着美伊谅解备忘录签署，市场关注点或放在霍尔木兹海峡通航问题以及原油价格方面，继而去预测利率走向。整体来看，黄金或仍在低位震荡运行。（光大期货）", "ctime": 1781759993, "time_str": "13:19:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260618/c677561823.shtml"}, {"id": "4553717", "title": "歌尔股份在青岛成立贸易公司 含电子专用设备销售业务", "content": "企查查APP显示，近日，青岛歌尔微通达贸易有限公司成立，法定代表人为董琨，经营范围包含：集成电路芯片及产品销售；电子专用设备销售；半导体器件专用设备销售；半导体分立器件销售等。企查查股权穿透显示，该公司由歌尔股份旗下歌尔微电子股份有限公司全资持股。（人民财讯）", "ctime": 1781759929, "time_str": "13:18:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260618/c677561802.shtml"}, {"id": "4553661", "title": "联合国报告：去年受武装冲突影响儿童人数创纪录", "content": "联合国秘书长“儿童与武装冲突问题”年度报告17日发布。报告显示，经联合国确认，受武装冲突影响的儿童人数去年达到24174人，创下自30年前联合国该报告首次发布以来的最高纪录。报告还说，2025年，儿童仍是被绑架为童子军或遭受性侵害的对象，针对儿童的强奸及其他性暴力案件数量未见减少。30年来，国家行为体首次成为武装冲突中侵害儿童的主要施害者。（新华社）", "ctime": 1781759583, "time_str": "13:13:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260618/c677561711.shtml"}, {"id": "4553651", "title": "无视以色列 特朗普不反对伊朗拥有弹道导弹", "content": "美国与伊朗签署谅解备忘录之际，美国总统特朗普称，他不反对伊朗拥有弹道导弹，而美国的“铁杆”盟友以色列对此坚决反对。特朗普17日在法国出席七国集团峰会后接受记者采访时表示，“如果别的国家有（弹道导弹），伊朗没有，这对伊朗有点不公平”。“如果沙特阿拉伯和卡塔尔有，而且他们确实都有一些，我想说，按比例的话，这（伊朗拥有弹道导弹）可以”。同一天，伊朗外交部发言人表示，伊朗的防卫能力和导弹计划“不容谈判”，不会就此与“任何一方、在任何进程中展开讨论”。（新华社）", "ctime": 1781759448, "time_str": "13:10:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260618/c677561669.shtml"}, {"id": "4553633", "title": "科创50指数涨超4%", "content": "科创50指数涨超4%，寒武纪涨超14%，华虹宏力涨超10%，盛科通信、晶合集成、海光信息、芯原股份涨幅居前。", "ctime": 1781759325, "time_str": "13:08:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260618/c677561637.shtml"}, {"id": "4553599", "title": "我国首次开展输电权交易，进一步畅通全国电力大循环", "content": "国家发展改革委今天举行新闻发布会，介绍云霄直流输电权市场化交易相关情况，这是我国首次开展输电权交易，进一步畅通全国电力大循环。李超表示，市场化的通道价格可以客观反映各区域、各输电通道的供需差异，就像实时反映道路车流量的“导航地图”，价格越高，说明通道资源越紧张，可以引导电力交易主体主动优化通道选择，提升电网整体效能。云霄直流位处福建、广东两省交界，是连接国家电网与南方电网的关键通道，不仅直接关系福建、广东两省的互补互济，还可以为周边其他省份提供输电服务，具备开展输电权市场化交易的客观条件和现实需求，具有比较强的示范性和可操作性。6月11日—12日，北京、广州两个电力交易中心联合组织了首笔输电权交易，预成交安徽送广东电量2116万千瓦时，其中包括绿电1607万千瓦时，本次交易共有113家经营主体参与申报。（央视新闻）", "ctime": 1781759153, "time_str": "13:05:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260618/c677561578.shtml"}, {"id": "4553519", "title": "科创金融生态共建合作框架协议在沪签署", "content": "中国长城资产与中国银行、中国中信金融资产、中国东方资产、上海国投公司在2026陆家嘴论坛上共同签署科创金融生态共建合作框架协议。合作由中国银行发起，聚焦上海三大先导产业，创新打造“股权投资＋银行服务+AMC资本盘活”一体化模式，覆盖科创企业全生命周期。依据协议，“十五五”期间合作各方将协同投入百亿级资金，构建多层次基金集群与服务闭环。（21世纪经济报道）", "ctime": 1781758910, "time_str": "13:01:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260618/c677561512.shtml"}, {"id": "4553503", "title": "长江存储出售武汉新芯39%股权", "content": "据重庆市市场监管局发布的报告，武汉光谷半导体产业投资有限公司、武汉市光新启航投资合伙企业（有限合伙）、长江存储控股股份有限公司与武汉新芯集成电路股份有限公司（“武汉新芯”）签署协议，光谷半导体产投（及通过其控制的光新启航）拟收购长存控股持有的武汉新芯39%股权。交易后，光谷半导体产投（及其一致行动人）直接或间接控制武汉新芯47.8846%的股权，单独控制武汉新芯。此前，武汉新芯曾于5月19日主动撤回了科创板IPO申请，上市审核终止。（科创板日报）", "ctime": 1781758732, "time_str": "12:58:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260618/c677561478.shtml"}, {"id": "4553501", "title": "Manifold AI流形空间完成近10亿元PreA轮融资", "content": "近日，Manifold AI流形空间宣布完成新一轮数亿元融资，本轮新投资方包括中国国新旗下国新基金，淡马锡旗下毅峰资本，产业资本北汽产投、芯能创投，同时四家老股东超额追加投资。（Manifold AI）", "ctime": 1781758600, "time_str": "12:56:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260618/c677561448.shtml"}, {"id": "4553495", "title": "深圳发布暴雨红色预警 进入暴雨紧急防御状态", "content": "今天12时25分，深圳市气象台发布暴雨红色预警。过去3小时，罗湖区、福田区、盐田区、龙岗区、坪山区、大鹏湾、龙华区（观湖、民治、龙华、观澜街道）和大鹏新区（葵涌街道）累计雨量已达大暴雨，预计未来1到2小时还将出现40~70毫米降水。深圳全市进入暴雨紧急防御状态，请迅速做好防御工作，远离低洼易涝等危险区域。上述区域山洪风险很大，注意防御暴雨及其引发的内涝、山洪、滑坡、泥石流、地面塌陷等灾害。（央视新闻）", "ctime": 1781758392, "time_str": "12:53:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260618/c677561410.shtml"}, {"id": "4553489", "title": "135座水工程纳入长江流域联合调度", "content": "当前，长江流域正处于主汛期。记者从水利部长江水利委员会了解到，今天（18日），水利部批复《2026年长江流域水工程联合调度运用计划》，与2025年相比，今年联合调度的水工程数量增至135座，进一步扩大了联合调度范围，新增金沙江上游叶巴滩水库、乌江渡水库和牛栏江-滇池补水工程等3座水工程，并根据最新研究成果优化调度方案。据了解，从2012年首个联合调度方案批复至今，长江流域已连续十五年开展水工程联合调度实践，调度范围从上游10座水库扩容至今年全流域的135座水工程，调度目标从“单一防洪”拓展至防洪、供水、生态、发电、航运、应急等多目标综合调度，为长江经济带高质量发展提供了坚实水安全保障。（央视新闻）", "ctime": 1781758316, "time_str": "12:51:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260618/c677561398.shtml"}, {"id": "4553487", "title": "启智机器人与犀准机器人签署战略合作协议", "content": "6月16日，埃夫特旗下启智（芜湖）智能机器人有限公司与芜湖犀准机器人有限公司正式签署战略合作协议。双方还同步签订了《复合机器人第一阶段联合开发协议》，确立“战略定长远、阶段保落地”的双层推进机制，标志着启智通用技术底座正式从平台构建阶段，迈入PCB垂直场景的工程化验证阶段。（人民财讯）", "ctime": 1781758306, "time_str": "12:51:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260618/c677561397.shtml"}, {"id": "4553477", "title": "英特尔美股夜盘直线拉升涨超5%", "content": "英特尔美股夜盘直线拉升涨超5%。", "ctime": 1781757796, "time_str": "12:43:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260618/c677561283.shtml"}, {"id": "4553469", "title": "特朗普称不反对伊朗拥有弹道导弹", "content": "美国与伊朗签署谅解备忘录之际，美国总统特朗普称，他不反对伊朗拥有弹道导弹，而美国的“铁杆”盟友以色列对此坚决反对。特朗普17日在法国出席七国集团峰会后接受记者采访时表示，“如果别的国家有（弹道导弹），伊朗没有，这对伊朗有点不公平”。“如果沙特阿拉伯和卡塔尔有，而且他们确实都有一些，我想说，按比例的话，这（伊朗拥有弹道导弹）可以”。同一天，伊朗外交部发言人表示，伊朗的防卫能力和导弹计划“不容谈判”，不会就此与“任何一方、在任何进程中展开讨论”。（央视新闻）", "ctime": 1781757294, "time_str": "12:34:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260618/c677561167.shtml"}, {"id": "4553467", "title": "五部门：开展2026年新能源汽车下乡活动 深入推进汽车以旧换新进乡村", "content": "工业和信息化部、商务部等五部门办公厅（综合司）开展2026年新能源汽车下乡活动，深入推进汽车以旧换新进乡村。在新能源汽车下乡活动中设置以旧换新专区，开展补贴政策宣介推广，提供旧车检测评估回收、补贴申请手续代办等“一站式”服务，进一步提高优惠政策知晓度、覆盖面，便利乡村地区消费者参与享受补贴。对换购新能源汽车的乡村地区消费者，均可按政策要求申领汽车以旧换新补贴，不受补贴资格数量限制。", "ctime": 1781757219, "time_str": "12:33:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260618/c677561153.shtml"}, {"id": "4553447", "title": "2026金砖国家未来网络创新论坛在深成功举办", "content": "6月16日上午，2026金砖国家未来网络创新论坛在深圳开幕。来自巴西、俄罗斯、南非、埃及、埃塞俄比亚、伊朗、阿联酋、印度尼西亚等30个金砖及“金砖+”国家的信息通信主管部门代表、国际组织代表，以及产学研各界代表约300人齐聚一堂，围绕“算力织网·智汇金砖”这一主题，共同探讨未来网络创新发展路径，助力大金砖合作提质升级。论坛期间多项国际交流合作硕果集中亮相：金砖国家新质互联网先锋城市成果、《数字经济中的金砖力量2026》报告、下一代通信网络与人工智能联合创新中心揭牌、中国-ESCAP大语言模型能力建设合作项目等，多方位展示了“金砖+”各国在数字经济、创新合作和能力建设等领域取得的务实成果，也生动体现了各方携手推进互联互通、深化协同合作的积极进展。（新华社）", "ctime": 1781756959, "time_str": "12:29:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260618/c677561078.shtml"}, {"id": "4553445", "title": "快舟十一号遥十三运载火箭发射成功", "content": "北京时间2026年6月17日11时58分，快舟十一号遥十三运载火箭在酒泉卫星发射中心发射升空，将微厘空间05组卫星送入预定轨道，飞行试验任务取得成功。此次任务是快舟十一号运载火箭的第6次飞行。（央视新闻）", "ctime": 1781756860, "time_str": "12:27:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260618/c677561057.shtml"}, {"id": "4553443", "title": "美伊公布谅解备忘录文本全文", "content": "伊朗官方媒体17日公布了同美国达成的谅解备忘录条款内容。同日，美国政府高级官员也通过媒体公布了谅解备忘录正式文本。双方文本内容基本一致。（新华社）", "ctime": 1781756851, "time_str": "12:27:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260618/c677561055.shtml"}, {"id": "4553441", "title": "广东省粤港澳游艇自由行管理办法印发", "content": "广东省人民政府办公厅印发《广东省粤港澳游艇自由行管理办法》，其中提出，本办法适用于经指定口岸入出内地且仅限在粤港澳大湾区内地九市自由行的港澳游艇、驾驶人员及其乘客的管理。港澳游艇依照本办法取得电子临时船舶国籍证书，并办结进口岸查验手续后，可在内地九市水域航行，在具备条件的停泊点停泊，在划定的休闲活动水域范围内进行水上休闲娱乐活动，在内地九市水域按照内地船舶相关制度进行管理。港澳游艇在临时船舶国籍证书有效期内，可以多次入出内地，在内地每次连续停留或者每年累计停留均不得超过180天。（人民财讯）", "ctime": 1781756807, "time_str": "12:26:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260618/c677561043.shtml"}, {"id": "4553439", "title": "俄称莫斯科等多地遭无人机或导弹袭击", "content": "俄罗斯莫斯科市市长索比亚宁18日在社交媒体发文称，俄罗斯防空系统当天击落了至少28架飞向莫斯科的无人机。俄罗斯布良斯克州代理州长科瓦尔丘克当天在社交媒体发布警告称，有导弹飞向布良斯克州。同时，罗斯托夫州州长斯柳萨里表示，罗斯托夫州前一天遭无人机袭击，造成1人死亡，另有2人受伤，而无人机袭击仍在持续。此外，俄罗斯别尔哥罗德州当天凌晨也遭到无人机袭击。对此，乌克兰方面暂未作出回应。（央视新闻）", "ctime": 1781756725, "time_str": "12:25:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260618/c677561025.shtml"}, {"id": "4553433", "title": "最新研究揭示青藏高原冻土风化碳抵消机制", "content": "传统观点认为，多年冻土融化会释放大量老碳，通过河流向大气排放二氧化碳，从而加剧全球变暖。然而，我国科学家的一项最新研究认为，多年冻土融化虽然会让河流释放更多二氧化碳，但同时也会加速岩石的自然风化过程，这种风化能吸收一部分二氧化碳，形成一个以前被忽视的天然“碳储存库”。一项由北京师范大学与中国科学院青藏高原研究所联合完成的研究发现，气候变暖导致多年冻土退化，不仅释放了封存的有机碳，同时也将大量活性矿物暴露出来，显著增强了水岩相互作用。这一过程能将水体中的二氧化碳转化为溶解无机碳，实现地质尺度的碳封存，从而有效减少河流向大气的净碳排放。（央视新闻）", "ctime": 1781756534, "time_str": "12:22:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260618/c677560992.shtml"}, {"id": "4553419", "title": "Omdia：XR头戴设备市场预计2027年重返增长，行业重心从头显转向眼镜形态", "content": "Omdia最新预测，全球XR头戴设备（XR headwear）出货量将在2026年下降12%，降至620万台。然而，市场预计将在2027年恢复增长，达到650万台，同比增长4.8%。此次复苏主要将由XR眼镜的快速扩张推动，并抵消XR头显出货下滑的影响。消费者和厂商正越来越倾向于更轻便的眼镜形态，而不是体积更大的头显设备。（人民财讯）", "ctime": 1781756304, "time_str": "12:18:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260618/c677560931.shtml"}, {"id": "4553415", "title": "国家网络安全通报中心：防范假冒公安机关恶意应用程序攻击", "content": "国家网络安全通报中心发文称，监测发现，近日一款伪装成中国公安机关对外提供服务的“公安一网通办”恶意APP在互联网上传播，下载地址为110GongAn.com，IP地址为207.56.30.188。该APP安装包内置木马程序，通过社会工程学手段诱导用户下载，实现支付信息窃取和远程控制等恶意行为。用户一旦通过移动终端下载安装该APP，攻击者可控制用户终端设备、获取对应访问权限，实施窃密等攻击行为。为保护个人信息和财产安全，建议广大用户做好以下安全防范：一是认准正规下载渠道。二是严格审核应用真伪。三是审慎开放手机权限。四是及时处置异常情况。（人民财讯）", "ctime": 1781756119, "time_str": "12:15:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260618/c677560832.shtml"}, {"id": "4553411", "title": "好奇婴幼儿纸尿裤被曝检出甲酰胺，金佰利客服这样回应", "content": "6月18日，有媒体报道称在“好奇”“碧芭宝贝”“Babycare”等多个品牌的婴幼儿纸尿裤中，检出毒性物质——甲酰胺。其中，“好奇”为美国金佰利旗下品牌。6月18日上午，金佰利客户服务电话工作人员回复称，公司会核实相关情况，目前还无法给出回应。（第一财经）", "ctime": 1781756083, "time_str": "12:14:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260618/c677560820.shtml"}, {"id": "4553409", "title": "北京：端午假期6条地铁线路延时运营", "content": "记者从北京市交通委员会了解到，今年端午假期，预计高速公路日均交通量环比平日上升17.9%，城际交通量较2025年同期上升6.8%。北京市交通部门通过地铁延时运营、公交增加运力、出租强化调度等措施，为市民、游客出行提供贴心服务。针对假期前一天（18日）晚高峰客流集中及假期最后一天（21日）返程高峰，交通部门启动重点场站夜间延时保障机制，结合火车站、机场客流数据，构建多部门协同、多方式联动的立体化保障体系，保障抵离京旅客高效疏运。（央视新闻）", "ctime": 1781755926, "time_str": "12:12:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260618/c677560791.shtml"}, {"id": "4553397", "title": "中国人民银行行长潘功胜会见新加坡金融管理局行长谢啇真", "content": "2026年6月17日，中国人民银行行长潘功胜在上海出席陆家嘴金融论坛期间会见了来访的新加坡金融管理局行长谢啇真。双方就当前经济金融形势以及中新双边金融合作等议题交换了意见。（央行）", "ctime": 1781755559, "time_str": "12:05:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260618/c677560638.shtml"}, {"id": "4553387", "title": "港股午评：恒生指数跌1.7%，恒生科技指数跌1.38%", "content": "港股午间收盘，恒生指数跌1.7%，恒生科技指数跌1.38%。恒指港股通ETF银华（159318）跌1.68%，港股通科技ETF鹏华（159751）跌1.04%。板块方面，客运航空公司、建筑产品板块跌幅靠前。个股方面，天数智芯涨15.67%，智谱涨12.59%   if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
