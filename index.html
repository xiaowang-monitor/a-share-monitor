成，累计回购186.4万股，金额5999.21万元。", "ctime": 1793618343, "time_str": "19:19:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261102/c681369841.shtml"}, {"id": "5545553", "title": "博泰车联：收购目标公司20%股权通过经营者集中反垄断审查", "content": "博泰车联公告，公司此前披露拟收购目标公司20%股权。本次公司收到国家市场监督管理总局于2026年10月29日出具的《经营者集中反垄断审查不实施进一步审查决定书》，决定对收购目标公司股权案不实施进一步审查，本次交易已通过经营者集中反垄断审查。公司正有序推进通函编制、股东会等相关程序；交易完成后，公司将持有目标公司全部已发行股本的20%，并成为其控股股东。", "ctime": 1793618308, "time_str": "19:18:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261102/c681369832.shtml"}, {"id": "5545551", "title": "大晟文化：许锦光减持559.45万股，持股比例降至5.00%", "content": "大晟文化公告，持股5%以上股东许锦光于2026年4月8日至2026年10月30日通过集中竞价方式合计减持公司559.45万股无限售流通股份，占公司总股本的1.00%。本次权益变动后，其持股数量由3356.78万股降至2797.33万股，持股比例由6.00%降至5.00%，触及5%刻度。", "ctime": 1793618274, "time_str": "19:17:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261102/c681369817.shtml"}, {"id": "5545549", "title": "美国总统特朗普表示，是否与伊朗达成协议还有待观察，伊朗希望达成协议", "content": "美国总统特朗普表示，是否与伊朗达成协议还有待观察，伊朗希望达成协议。（财联社）", "ctime": 1793618271, "time_str": "19:17:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261102/c681369816.shtml"}, {"id": "5545539", "title": "苏丹三处电力设施再遭袭击 引发大范围停电", "content": "当地时间11月2日，苏丹东部卡萨拉州两处发电站（阿罗玛、新哈勒法）和北部北方州一处发电站（加扎利）遭无人机袭击，三座电站严重受损，导致苏丹东部和北部地区大范围停电。据苏丹民间机构“紧急律师倡议”统计，截至11月1日，已有至少15处发电站遇袭。苏丹武装部队指责快速支援部队发动袭击，后者未予回应。2023年4月15日，苏丹武装部队与快速支援部队在喀土穆爆发武装冲突，持续三年多已造成至少5.9万人死亡。（央视新闻）", "ctime": 1793618081, "time_str": "19:14:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261102/c681369733.shtml"}, {"id": "5545537", "title": "国家外汇局公开征求意见 拟出台一揽子便利化新政策", "content": "国家外汇局11月2日就一揽子便利化新政策向社会公开征求意见，包括深化跨境贸易高水平开放外汇便利化业务、拓宽支付机构贸易新业态外汇业务范围、优化企业贸易信贷报告管理、优化个人外汇业务代办、扩大保险机构外汇资金运用账户收支范围等九个方面。此前，央行副行长、国家外汇管理局局长朱鹤新10月19日表示，外汇局近期将在存量政策提质增效基础上，结合新形势新要求及企业新诉求，集中推出经常项目和资本项目便利化一揽子增量措施。（新华社）", "ctime": 1793617981, "time_str": "19:13:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261102/c681369307.shtml"}, {"id": "5545533", "title": "武商集团：中期票据获准注册30亿元", "content": "武商集团公告，公司此前审议通过申请注册发行不超过人民币30亿元（含30亿元）中期票据。公司于2026年11月2日收到中国银行间市场交易商协会《接受注册通知书》，获准注册金额为30亿元，注册额度自通知书落款之日起2年内有效，注册有效期内可分期发行。", "ctime": 1793617895, "time_str": "19:11:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261102/c681369259.shtml"}, {"id": "5545531", "title": "佩斯科夫：俄总统网站每天遭到多次网络攻击", "content": "当地时间11月2日，俄总统新闻秘书佩斯科夫在简报会上表示，阿列什基人道行动已成功实施，俄方高度评价筹备期间各方达到的协调水平；是否在其他地点实施类似行动需单独考量，目前无类似计划和倡议。俄紧急情况部手机应用程序遭大规模网络攻击，佩斯科夫称俄所有部门电子资源持续面临此类威胁，俄总统网站每昼夜遭多次攻击，技术发展导致威胁增多，要求各部门高效防护。就美媒称美方主张尽快恢复俄天然气经乌克兰管道输往欧洲的消息，佩斯科夫表示现在讨论为时尚早，当前不可能落实，未来取决于买卖双方意愿及卖方是否具备供气条件。（央视新闻）", "ctime": 1793617874, "time_str": "19:11:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261102/c681369205.shtml"}, {"id": "5545523", "title": "讯飞医疗科技：已申请3511.96万股内资股转H股", "content": "讯飞医疗科技公告，公司拟实施H股全流通，已向中国证监会递交申请，将3511.96万股内资股转为H股，占公司已发行股本总额约29.0537%。在取得所有相关监管机构备案及/或批准并符合所有适用法律法规后，该等未上市股份将转为H股及合资格在联交所主板上市买卖；根据公司章程，毋须再召开股东会以批准转换及上市。", "ctime": 1793617776, "time_str": "19:09:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261102/c681368854.shtml"}, {"id": "5545521", "title": "李强会见阿曼苏丹海赛姆", "content": "11月2日下午，国务院总理李强在北京人民大会堂会见来华进行国事访问的阿曼苏丹海赛姆。 李强表示，中国和阿曼都有着悠久历史，两国友谊源远流长。建交48年来，无论国际风云如何变幻，中阿始终相互尊重、平等相待，推动双边关系持续稳健发展，切实惠及了两国人民。今天上午，习近平主席同苏丹陛下举行会晤，就进一步深化中阿战略伙伴关系作出新的规划。中方愿同阿方一道弘扬传统友好，巩固政治互信，坚定相互支持，促进各领域合作不断走深走实，更好服务两国现代化建设。 李强指出，中方愿同阿方加强发展战略对接，深入推进油气全产业链合作，开展更多优质清洁能源项目，拓展农渔业、航天卫星、信息通信、人工智能等领域合作，推动尽早结束中国－海合会自贸协定谈判，实现更高水平的互利共赢。双方要扩大文化、教育等人文交流，进一步便利双向人员往来，让两国友好更加可感可及。当前国际形势纷繁复杂，中阿同为全球南方国家，应当在多边事务中保持密切沟通协调，共同维护世界和平稳定。近段时期，中东局势反复震荡。中方愿秉持习近平主席提出的一系列重大倡议和主张，同阿方一道为早日恢复中东海湾地区和平安宁作出不懈努力。(新华社)", "ctime": 1793617754, "time_str": "19:09:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261102/c681368844.shtml"}, {"id": "5545511", "title": "泉阳泉：股价异动核查称生产经营正常，无应披露未披露重大事项", "content": "泉阳泉公告，公司股票于2026年10月29日、10月30日、11月2日连续三个交易日内日收盘价格涨幅偏离值累计达到20%，属于股票交易异常波动。经自查及向控股股东询证，公司生产经营活动正常，日常经营情况及外部环境未发生重大变化；控股股东不存在应披露而未披露的重大事项；公司未发现需澄清的媒体报道、市场传闻，亦未涉及市场热点概念。公告披露当日换手率14.22%，前期常态换手率多在2%-5%区间。", "ctime": 1793617672, "time_str": "19:07:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261102/c681368713.shtml"}, {"id": "5545505", "title": "汇顶科技：完成632万股股份回购，实际回购金额4亿元", "content": "汇顶科技公告，截至2026年10月30日，公司回购方案已实施完毕，实际回购股份632万股，占总股本的1.36%，回购价格区间为46.9元/股至80.08元/股，回购均价63.23元/股，使用资金总额4亿元（含交易费用）。回购股份拟全部用于实施员工持股计划；如未能在回购实施完成后36个月内使用完毕，尚未使用的股份将予以注销。", "ctime": 1793617531, "time_str": "19:05:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261102/c681368586.shtml"}, {"id": "5545503", "title": "泉阳泉：赵志华减持300万股，合计持股5.68%", "content": "泉阳泉公告，持股5%以上股东赵志华于2026年10月30日通过大宗交易方式减持公司股份300万股，占公司总股本的0.42%。本次权益变动后，赵志华及其一致行动人陈爱莉合计持股比例由6.10%下降至5.68%，触及1%刻度。本次减持系履行此前披露的减持股份计划，不触及要约收购，不会导致公司控股股东及实际控制人发生变化。", "ctime": 1793617514, "time_str": "19:05:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261102/c681368576.shtml"}, {"id": "5545499", "title": "青鸟智控：拟回购不低于总股本2.5%、不超过5%的股份", "content": "青鸟智控公告，拟以自有资金及自筹资金通过集中竞价方式回购公司股份，回购价格不超过12元/股；拟回购股份数量不低于总股本的2.5%、不超过5%。回购股份拟用于员工持股计划或股权激励，未能在股份回购实施结果暨股份变动公告日后3年内使用完毕的，尚未使用股份将予以注销。回购期限为董事会审议通过方案之日起12个月内。公 // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
