整", "content": "中国银行今日发布公告，我行将对代理个人上金所业务（包括白银延期合约和黄金延期合约）的交易保证金比例进行调整。具体如下：一、自2026年6月24日（星期三）收盘清算时起，我行黄金延期合约的保证金比例乘数由666%调整为800%，由此，我行黄金延期合约的客户保证金比例由99.9%调整为120%。二、自2026年6月24日（星期三）收盘清算时起，我行白银延期合约的保证金比例乘数由476%调整为571%，由此，我行白银延期合约的客户保证金比例由99.96%调整为119.91%。", "ctime": 1782118765, "time_str": "16:59:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260622/c677617446.shtml"}, {"id": "4566497", "title": "长盈通：停牌核查完成 公司股票将于6月23日复牌", "content": "长盈通公告，公司股票将于2026年6月23日开市起复牌。公司近期股票交易价格严重脱离基本面，存在市场情绪过热及非理性炒作的情形。2026年5月6日至6月22日，公司股票区间累计上涨幅度为249.36%，同期申万国防军工行业下跌8.26%，上证A指上涨1.24%。公司营业利润、利润总额、归属于母公司所有者的净利润均出现下滑，抵御市场波动和行业变化的能力仍相对有限。", "ctime": 1782118735, "time_str": "16:58:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260622/c677617437.shtml"}, {"id": "4566491", "title": "仁和药业：全资子公司获清肺汤颗粒药品注册证书，累计研发投入约800万元", "content": "仁和药业公告，公司全资子公司江西药都樟树制药有限公司近日收到国家药监局核准签发的关于清肺汤颗粒的《药品注册证书》。该药品为中药3.1类，独家品种，处方药，每袋相当于饮片15.81g。处方出自《万病回春》，属《古代经典名方目录（第一批）》第67首方剂，具有清热润肺、降气化痰功效。截至公告日，公司对清肺汤颗粒项目累计研发投入约800万元（未经审计）。", "ctime": 1782118706, "time_str": "16:58:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260622/c677617428.shtml"}, {"id": "4566489", "title": "卫星化学：预计2026年上半年净利润同比增长118.68%～155.13%", "content": "卫星化学公告，预计2026年1月1日至2026年6月30日归属于上市公司股东的净利润为60亿元至70亿元，比上年同期增长118.68%至155.13%；扣除非经常性损益后的净利润为56.87亿元至66.87亿元，比上年同期增长96.37%至130.90%；基本每股收益为1.78元至2.08元／股，上年同期为0.81元／股。", "ctime": 1782118695, "time_str": "16:58:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260622/c677617422.shtml"}, {"id": "4566485", "title": "中国首个且目前唯一口服 SERD 依仑司群在华获批", "content": "礼来公司宣布，旗下择叙 （依仑司群）已获得国家药品监督管理局批准，单药或联合阿贝西利用于既往接受过内分泌治疗的雌激素受体阳性（ER+）、人表皮生长因子受体2阴性（HER2-）、ESR1突变的局部晚期或转移性乳腺癌成人患者。依仑司群此次在华获批，成为国内乳腺癌领域首个且目前唯一获批的口服选择性雌激素受体降解剂（SERD），成功填补了国内由ESR1突变引起的乳腺癌内分泌耐药治疗的临床空白；其联合阿贝西利方案在中国市场领先全球其他市场，实现率先获批，让更多中国ESR1突变乳腺癌患者能够获得创新治疗方案。（21世纪经济报道）", "ctime": 1782118675, "time_str": "16:57:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260622/c677617412.shtml"}, {"id": "4566465", "title": "美国大峡谷国家公园极端高温致多人身亡", "content": "美国大峡谷国家公园近日发布声明说，近期高温引发的意外事件大幅增多，游客需警惕极端高温。声明称，位于亚利桑那州的峡谷腹地近期高温中暑事件频发，已有3名徒步旅行者不幸身亡。美国国家气象局对大峡谷国家公园发布了极端高温预警，预警时段为当地时间22日正午至23日。气象预报显示，位于大峡谷底部区域的幻影牧场气温可能达到或超过43摄氏度。美国国家气象局弗拉格斯塔夫分局气象学家约翰德罗提醒，大峡谷国家公园正迎来一年中最热的时间，要等到夏季后期季风降雨来临，高温状况才会有所缓解。（央视新闻）", "ctime": 1782118425, "time_str": "16:53:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260622/c677617257.shtml"}, {"id": "4566463", "title": "ST南新：子公司广州南新制药有限公司收到对乙酰氨基酚甘露醇注射液上市申请《受理通知书》", "content": "ST南新公告，子公司广州南新制药有限公司收到国家药品监督管理局核准签发的对乙酰氨基酚甘露醇注射液上市申请《受理通知书》。对乙酰氨基酚甘露醇注射液适用于治疗成人轻度至中度疼痛、辅助阿片类镇痛药缓解成人术后中重度疼痛及成人发热缓解。", "ctime": 1782118417, "time_str": "16:53:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260622/c677617248.shtml"}, {"id": "4566461", "title": "解决“停车61分钟”收费难题 多地推行精准按分钟计费", "content": "今年开始，全国不少地方都下调了道路、公共停车场的停车收费，不仅延长了免费停车时长，降低了收费标准，还推行精准按分钟计费。上海市发展改革委日前发布公告，对上海市道路停车收费政策优化方案公开征求意见。记者注意到，今年以来，湖北宜昌、江西南昌、湖南长沙等地，都已出台相关政策，优化城市道路停车管理细则。在宜昌城区一处政府投资的公共停车场，此前的停车起步价格是2小时5元，新标准更利于精准计费。北京交通大学北京综合交通发展研究院教授郑翔表示，我国城市道路停车收费管理，正在从先收费后服务的粗放模式向时停时付的精准化运营模式转型。(央视新闻)", "ctime": 1782118416, "time_str": "16:53:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260622/c677617247.shtml"}, {"id": "4566455", "title": "集智股份：楼荣伟协议转让5.81%公司股份给楼希完成过户", "content": "集智股份公告，公司控股股东、实际控制人楼荣伟向自然人楼希协议转让645.37万股，占总股本5.81%。过户登记已完成，楼希成为第二大股东。", "ctime": 1782118340, "time_str": "16:52:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260622/c677617127.shtml"}, {"id": "4566441", "title": "波兰一工业厂房起火，暂无人员伤亡", "content": "当地时间22日，波兰库亚维-波美拉尼亚省弗沃茨瓦韦克市一处存放化学品的工业厂房发生火灾，产生大量黑色浓烟。当地消防部门称，火势已得到控制，消防人员正在进行后续灭火和安全处置工作。受火灾影响，附近一家医院紧急疏散62名患者和医护人员。政府安全中心向周边居民发送警报，提醒关闭门窗、避免靠近现场。截至目前，暂无人员伤亡报告。火灾原因及空气质量监测工作正在进行中。（央视新闻）", "ctime": 1782118103, "time_str": "16:48:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260622/c677616992.shtml"}, {"id": "4566439", "title": "光启技术：全资子公司光启尖端近期累计与三家客户签订了合计6.12亿元的超材料产品批产合同和研制合同", "content": "光启技术公告，公司全资子公司深圳光启尖端技术有限责任公司与两家客户签订了合计5.65亿元的超材料产品批产合同，与另一家新客户签订了4700万元的超材料产品研制合同，合计6.12亿元。此前自2025年1月1日至本次合同签署前，光启尖端已累计签订超材料产品批产合同金额37.49亿元。其中3.07亿元相关产品及服务预计将于2026年12月31日之前完成交付，3.05亿元相关产品预计将于2027年5月31日之前完成交付。", "ctime": 1782118075, "time_str": "16:47:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260622/c677616976.shtml"}, {"id": "4566437", "title": "端午假期青茂口岸出入境旅客突破33万人次", "content": "记者6月22日从青茂边检站获悉，今年端午假期(6月19日至6月21日)，青茂口岸出入境客流量突破33万人次，同比增长约6%。\n据悉，端午节假期，粤港澳三地举办多场龙舟赛事和大型活动，叠加高考已经结束等多重因素，民俗体验游、探亲访友游、赴港澳短途游等热度上升明显。假期期间，连接粤澳的青茂口岸客流持续高位运行，日均旅客通关量超11万人次，其中6月19日单日客流量达到约11.5万人次，为假期客流峰值。(大湾区之声)", "ctime": 1782118026, "time_str": "16:47:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260622/c677616963.shtml"}, {"id": "4566435", "title": "浙商中拓：重大诉讼一审判决获支持，被告退还货款等约16.3亿元", "content": "浙商中拓公告，公司此前就买卖合同纠纷将响水龙拓实业有限公司等被告诉至杭州中院，诉讼标的额16.3亿元。近日公司收到一审民事判决书，判决溧阳宝润钢铁有限公司、溧阳瑞达金属科技有限公司、溧阳龙跃金属制品有限公司于判决生效之日起十日内向公司退还货款并支付利息损失合计约16.3亿元，被告戴国芳、戴笠、黄荷琴承担连带清偿责任，瑞达新材料在合计约1.07亿元至约5.77亿元范围内承担补充赔偿责任。公司诉讼请求均得到支持。本案尚处一审判决阶段，暂无法准确判断对公司本期利润或期后利润的影响。", "ctime": 1782118021, "time_str": "16:47:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260622/c677616958.shtml"}, {"id": "4566433", "title": "百利天恒：自主研发的EGFR×HER3双抗ADC伦康依隆妥单抗（宜泽康）获批上市", "content": "百利天恒公告，公司自主研发的全球首创（First-in-class）、新概念（New concept）且唯一进入III期临床阶段的EGFR×HER3双抗ADC伦康依隆妥单抗（商品名：宜泽康）获得国家药品监督管理局批准上市。该药品适用于治疗既往经至少二线系统化疗和PD-1/PD-L1抑制剂治疗失败的复发/转移性鼻咽癌患者。", "ctime": 1782118017, "time_str": "16:46:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260622/c677616956.shtml"}, {"id": "4566427", "title": "万凯新材：累计出让灵心巧手股权0.73% 收到股权转让款9960万元", "content": "万凯新材公告，截至本公告日，公司分别与海南网胜投资有限公司、嘉兴天启宇恩股权投资合伙企业（有限合伙）、扬州玖兆天航创业投资合伙企业（有限合伙）、广东新虎威建信股权投资合伙企业（有限合伙）四家单位完成灵心巧手部分股权的交割，合计出让灵心巧手股权0.73%，合计收到股权转让款9960万元。", "ctime": 1782117815, "time_str": "16:43:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260622/c677616840.shtml"}, {"id": "4566425", "title": "深天马A：子公司与关联方签订分布式光伏电站合同能源管理协议，预计25年累计交易金额为6.72亿元", "content": "深天马A公告，子公司上海天马、上海光电子、武汉天马、武汉天马上海分公司、成都天马、芜湖天马拟与中航成套签订分布式光伏电站合同能源管理协议。中航成套将在各子公司指定建筑物屋顶建设光伏电站并负责运行维护，运营期25年，预计累计交易金额6.72亿元。交易已获董事会审议通过，不构成重大资产重组。", "ctime": 1782117808, "time_str": "16:43:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260622/c677616835.shtml"}, {"id": "4566423", "title": "长春高新：子公司注射用醋酸曲普瑞林（II）获得《药品注册证书》", "content": "长春高新公告，控股子公司金赛药业注射用醋酸曲普瑞林（II）的境内生产药品注册上市许可申请获得批准。该药品为一款促性腺激素释放激素激动剂（GnRHa），主要活性成分为醋酸曲普瑞林，通过缓释技术实现缓慢释放，适用于体重20kg及以上儿童中枢性性早熟（CPP）治疗。本产品获批有利于丰富公司儿童健康领域的产品布局，为性早熟儿童提供更便捷的产品，增强公司在医药市场的竞争力。", "ctime": 1782117801, "time_str": "16:43:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260622/c677616832.shtml"}, {"id": "4566419", "title": "换新升级 中欧班列新型汽车箱整列首发", "content": "22日上午10时许，一列装载182辆长安汽车的X8013次中欧班列从重庆团结村中心站鸣笛启程，这是中欧班列首次整列采用新投用的40英尺35吨通用汽车箱，运输效率显著提升，将有效助力我国汽车出海。(新华网)" const META     = {"update_time": "2026-06-22 17:36:51", "sentiment_score": 59.53389830508475, "agents": []};

// 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

  const container = document.getElementById('hot7-list');

        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
