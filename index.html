智能产业发展工作，稳妥推进人工智能在金融领域的应用。(人民财讯)", "ctime": 1792399950, "time_str": "16:52:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261019/c680840426.shtml"}, {"id": "5413769", "title": "潘功胜：退出存贷款基准利率", "content": "在2026金融街论坛年会开幕式上，中国人民银行行长潘功胜表示，退出存贷款基准利率。随着利率市场化改革推进，存贷款基准利率逐步被市场化的定价基准替代。银行贷款利率已经有贷款市场报价利率、银行间隔夜回购利率等多个定价基准；自今年一季度开始，人民银行对外公布了各个期限的存款平均利率，作为银行存款定价的参考。下一步，人民银行将推动这些领域的计息依据用市场化的利率指标来替代，实现退出金融机构存贷款基准利率。", "ctime": 1792399911, "time_str": "16:51:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261019/c680840366.shtml"}, {"id": "5413757", "title": "金融监管总局：依法将所有金融活动全部纳入监管", "content": "2026金融街论坛年会开幕式今天下午在北京举行，国家金融监督管理总局局长丁向群介绍，当前，中国银行业保险业运行整体平稳，大型机构经营稳健，中小机构改革化险有序推进，风险总体可控。\n\n丁向群表示，聚焦重点领域，打好风险化解主动仗。完善处置机制，充实化险资源，综合运用兼并重组、市场退出等方式，稳妥处置高风险机构，推动风险持续收敛。加强协同联动，消除监管空白。\n\n金融监管总局会同各方严厉打击非法金融活动，强化对跨地区跨部门和新业态新产品金融活动的监管，依法将所有金融活动全部纳入监管，着力实现全覆盖、无例外。\n\n丁向群介绍，近年来，中国金融法治建设进入快车道，金融法、银监法、保险法等立法修法工作取得重大进展，监管制度也在加快完善。一方面，围绕不同类型机构防风险强监管需要，以及机构与第三方合作、网络安全等新情况新问题，加快补齐短板，扎牢制度防火墙。另一方面，严肃查处造成重大金融风险的关键人、关键事、关键行为，强化刚性约束，增强震慑效应，让监管制度真正成为“带电的高压线”。(央视新闻)", "ctime": 1792399822, "time_str": "16:50:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261019/c680840133.shtml"}, {"id": "5413755", "title": "潘功胜：推动贷款利率定价基准改革 从比较单一地参考贷款市场报价利率（LPR）定价向更加多元的定价基准转型", "content": "在2026金融街论坛年会开幕式上，中国人民银行行长潘功胜表示，推动贷款利率定价基准改革，从比较单一地参考贷款市场报价利率（LPR）定价向更加多元的定价基准转型。未来随着多元化贷款定价基准不断完善，一些财务能力强的企业，可与金融机构协商后自主选择银行间隔夜回购利率或贷款市场报价利率作为浮动利率贷款定价基准，贷款市场报价利率作为小企业、个人贷款的定价基准可继续发挥作用。债券、金融衍生品的定价基准也可考虑将银行间隔夜回购利率作为一个选择。人民银行将择机发布政策指引，指导金融机构做好相关工作。同时，也将持续改革完善贷款市场报价利率报价机制，提高报价质量。", "ctime": 1792399809, "time_str": "16:50:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261019/c680840104.shtml"}, {"id": "5413749", "title": "精工钢构：签约海外项目，金额7273.35万美元", "content": "精工钢构公告，公司近日签约尼日利亚及埃塞俄比亚丹格特化肥厂项目，合同金额为7273.35万美元（折合人民币约4.86亿元），占公司最近一期经审计营业收入的2.33%。项目范围包括钢结构材料采购、制作加工、运输及安装。", "ctime": 1792399746, "time_str": "16:49:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261019/c680839981.shtml"}, {"id": "5413737", "title": "京能置业：2026年第三季度签约面积同比下降42.31%", "content": "京能置业公告，2026年第三季度，公司及控股子公司全口径签约面积0.90万平方米，面积同比下降42.31%；签约金额1.25亿元，金额同比下降54.21%。权益口径签约面积0.55万平方米，面积同比下降42.71%；签约金额0.76亿元，金额同比下降59.57%。", "ctime": 1792399663, "time_str": "16:47:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261019/c680839754.shtml"}, {"id": "5413735", "title": "怡合达：回购股份方案实施完毕，累计回购418.11万股，支付9994.84万元", "content": "怡合达公告，公司此前审议通过以自有资金或自筹资金回购股份，回购资金总额不低于6000万元且不超过1亿元，回购股份用于实施股权激励或员工持股计划。截至公告披露日，回购方案已实施完毕，累计回购418.11万股，占公司当前总股本的0.66%；成交价格为22.72元/股至25.1元/股，成交总金额为人民币9994.84万元（不含交易费用）。", "ctime": 1792399656, "time_str": "16:47:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261019/c680839732.shtml"}, {"id": "5413733", "title": "涛涛车业：实际控制人提议以5000万元-1亿元回购股份", "content": "涛涛车业公告，2026年10月19日，公司实际控制人、董事长、总经理曹马涛提议公司以自有资金或自筹资金回购股份，资金总额不低于人民币5000万元（含）且不超过人民币1亿元（含），回购价格不高于董事会审议通过回购方案决议前30个交易日公司股票交易均价的150%。回购股份拟用于股权激励或员工持股计划；公司董事会将研究并制定回购方案。", "ctime": 1792399650, "time_str": "16:47:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261019/c680839724.shtml"}, {"id": "5413723", "title": "央行：试点进一步便利境外金融机构在境内外汇市场开展人民币购售业务", "content": "中国人民银行行长潘功胜在参加2026金融街论坛年会开幕式时表示，试点进一步便利境外金融机构在境内外汇市场开展人民币购售业务，拟试点允许8家中资和外资人民币境外清算行，根据国际金融市场实践和交易惯例，在境内银行间外汇市场开展自营交易。后续将根据试点情况，进一步加大外汇市场开放力度。", "ctime": 1792399607, "time_str": "16:46:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261019/c680839639.shtml"}, {"id": "5413711", "title": "潘功胜：加快构建与国际科技创新中心核心功能和国际化定位相适应的科技金融服务体系", "content": "在2026金融街论坛年会开幕式上，中国人民银行行长潘功胜表示，将会同科技部等10个部门出台《关于金融支持建设北京（京津冀）、上海（长三角）、粤港澳大湾区国际科技创新中心的指导意见》。中国人民银行将加快构建与国际科技创新中心核心功能和国际化定位相适应的科技金融服务体系，提升全链条、多元化金融供给水平，指导金融机构增强专业服务能力，加强区域内信息共享、标准互认和设施联通，推动再贷款、债券市场“科技板”、跨境投融资等政策在有关地区加大投入和先行先试，助力打造高水平科技金融生态。 (央视财经)", "ctime": 1792399456, "time_str": "16:44:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261019/c680839261.shtml"}, {"id": "5413705", "title": "紫竹高科：2026年董事会通过紫江新材拟终止挂牌议案", "content": "紫竹高科公告，公司控股子公司紫江新材拟主动申请在全国中小企业股份转让系统终止挂牌。公司董事会已于2026年10月19日审议通过相关议案；该事项尚需紫江新材股东会审议通过，并报全国中小企业股份转让系统有限责任公司审批。", "ctime": 1792399409, "time_str": "16:43:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261019/c680839163.shtml"}, {"id": "5413703", "title": "绿发电力：2026年第三季度发电量同比增长12.98%", "content": "绿发电力公告，公司2026年第三季度完成发电量66.15亿千瓦时，同比增长12.98%；2026年前三季度累计完成发电量178.49亿千瓦时，同比增长17.78%。其中，风电完成发电量61.65亿千瓦时，同比增长1.57%；光伏完成发电量110.14亿千瓦时，同比增长23.54%。", "ctime": 1792399399, "time_str": "16:43:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261019/c680839149.shtml"}, {"id": "5413697", "title": "科大智能：首次回购公司股份283.17万股，成交价人民币8.65元/股至人民币8.79元/股，金额2470.73万元", "content": "科大智能公告，公司此前审议通过回购方案，拟在12个月内以人民币5000万元（含）至人民币1亿元（含）回购股份，回购价格不超过人民币18.09元/股（含），用于注销并减少注册资本。2026年10月16日，公司首次回购283.17万股，成交最低价人民币8.65元/股、最高价人民币8.79元/股，成交总金额2470.73万元（不含交易费用）。", "ctime": 1792399337, "time_str": "16:42:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261019/c680839047.shtml"}, {"id": "5413693", "title": "中兴微旗下砺睿微面向智算中心高性能RISC-V芯片首次展出", "content": "在第六届RISC-V中国峰会期间，中兴微电子旗下砺睿微面向智算中心打造的高性能RISC-V CPU芯片——珠峰200首次对外展出。珠峰200是行业首款面向智算中心场景的RISC-V CPU芯片，聚焦Agent集群、推理超节点Host、企业级智算混合推理三大场景，原生搭载RISC-V AI指令加速，针对KV Cache、长上下文大模型推理做深度优化；集成Matrix、Vector、压缩、加密多类加速引擎，支持DDR5、PCIe、CXL高速互联接口，可适配RISC-V原生AI+GPU加速卡的MoE大模型混合推理方案。珠峰200详细产品规格将于今年底正式发布。（科创板日报）", "ctime": 1792399316, "time_str": "16:41:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261019/c680839017.shtml"}, {"id": "5413687", "title": "内塔尼亚胡称若胜选将消除伊朗威胁 伊朗外长回应", "content": "以色列总理内塔尼亚胡18日发布视频，表示自己一旦赢得议会选举，以色列将和美国继续合作，并力争在未来两年内甚至更早“彻底消除伊朗带来的威胁”。伊朗外长阿拉格齐在社交媒体上回怼说：“上次你想要‘完成工作’，伊朗却变得更强了。还想再试试运气吗？请便。但你要小心点，我们也有未完成的工作。”阿拉格齐警告说，内塔尼亚胡正把美国“引入另一场战争”。（新华社）", "ctime": 1792399238, "time_str": "16:40:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261019/c680838876.shtml"}, {"id": "5413685", "title": "上海能源：2026年1-9月商品煤销量473.33万吨", "content": "上海能源公告，2026年第三季度经营数据显示，公司2026年1-9月商品煤销量473.33万吨，2025年1-9月为455.98万吨；商品煤销售收入42.91亿元，2025年1-9月为32.77亿元；商品煤销售毛利11.84亿元，2025年1-9月为6.49亿元。同期发电量33.55亿千瓦时，售电量35.19亿千瓦时。", "ctime": 1792399237, "time_str": "16:40:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261019/c680838875.shtml"}, {"id": "5413673", "title": "海默科技：新越征程向范中华、杨宝和协议转让5926.1万股完成过户", "content": "海默科技公告，第一大股东宁波新越征程能源有限公司此前拟向范中华、杨宝和分别转让2743.8万股、3182.3万股，合计5926.1万股，占总股本的10.80%；相关股份已于2026年10月15日完成过户登记。过户后，新越征程持股5500万股，占10.02%；本次转让未导致公司控股股东、实际控制人变更，受让方承诺自过户登记之日起18个月内不转让所受让股份。", "ctime": 1792399174, "time_str": "16:39:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261019/c680838692.shtml"}, {"id": "5413671", "title": "物产环能：2026年第三季度净利润1.61亿元，同比增长6.96%", "content": "物产环能公告，2026年第三季度营业收入115.43亿元，同比增长34.89%；归母净利润1.61亿元，同比增长6.96%；扣非净利润1.52亿元，同比增长7.41%。2026年前三季度营业收入287.07亿元，同比增长6.41%；归母净利润5.22亿元，同比增长15.45%；扣非净利润4.92亿元，同比增长1 // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
