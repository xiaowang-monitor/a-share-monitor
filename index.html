": 1788785576, "time_str": "20:52:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260907/c679670955.shtml"}, {"id": "5121947", "title": "美国电网禁令是否波及燃气轮机订单？杰瑞股份回应", "content": "油服设备龙头杰瑞股份披露的投资者交流纪要显示，公司初步判断美国第14420号行政令对当前业务的直接影响有限。7月份签署的金额达14.65亿美元的燃气轮机大单已收到首笔预付款，订单正常推进中。（澎湃新闻）", "ctime": 1788785364, "time_str": "20:49:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260907/c679670827.shtml"}, {"id": "5121945", "title": "北方稀土与清华大学共建稀土新技术联合研究中心", "content": "9月5日，清华大学-中国北方稀土（集团）高科技股份有限公司稀土新技术联合研究中心揭牌成立。下一步，北方稀土将以联合研究中心为载体，锚定稀土新材料研发、高纯稀土生物分离、稀土资源高效综合利用等关键核心领域攻关。（界面新闻）", "ctime": 1788785289, "time_str": "20:48:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260907/c679670782.shtml"}, {"id": "5121935", "title": "随时能问、随手可查，“国家反诈AI”全新上线", "content": "为进一步提升防范电信网络诈骗工作的信息化、智能化水平，帮助群众有效识诈防诈，近日，由公安部刑侦局指导，上海市公安局自主研发的“国家反诈AI”App正式上线。“国家反诈AI”App融合了大语言、多模态模型和智能体技术，用户通过手机输入可疑场景，该App即可完成风险研判、识别诈骗套路、推送典型案例，从“文字+语音+视频”等多个维度拆解诈骗手法，提供识别防范对策。(上观新闻)", "ctime": 1788785116, "time_str": "20:45:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260907/c679670737.shtml"}, {"id": "5121897", "title": "登康口腔：重百集团拟减持公司不超过1.74%股份", "content": "登康口腔公告，间接控股股东渝富集团的一致行动人重百集团持有公司股份298.77万股，占总股本1.74%，拟于2026年10月8日至2027年1月7日通过集中竞价交易和大宗交易合计减持不超过298.77万股。其中，集中竞价交易减持不超过172.17万股，大宗交易减持不超过126.6万股。本次减持不会导致公司控制权变更。", "ctime": 1788784931, "time_str": "20:42:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260907/c679670646.shtml"}, {"id": "5121895", "title": "王文涛部长会见芬兰经济事务部长普伊斯托", "content": "9月7日上午，商务部部长王文涛会见芬兰经济事务部长普伊斯托，双方就中芬、中欧经贸关系交换意见。王文涛表示，近年来，在中芬两国领导人的战略指引下，双边经贸关系稳步向好发展，各领域合作日趋紧密，欢迎芬兰担任第二十六届中国国际投资贸易洽谈会主宾国。希望双方用好中芬经贸联委会、创新企业合作委员会等机制，不断深化清洁能源、循环经济、智能制造、生物制药等领域务实合作。希望芬政府继续为中国企业在芬投资营造公平、开放、非歧视的营商环境。王文涛表示，当前形势下，保持中欧经贸关系总体稳定具有重大意义。近期中欧双方在贸易投资磋商机制框架下就多个重要议题进行了密集磋商。希望芬政府坚持自由贸易，推动欧方同中方相向而行，坚持稳定、平衡的中欧关键贸易伙伴关系新定位，在符合世贸组织规则的基础上，通过对话磋商妥处经贸摩擦。普伊斯托表示，芬方高度重视对华经贸合作，很荣幸担任本届投洽会主宾国，希望继续用好芬中创新企业合作委员会等平台，进一步扩大芬中贸易投资和绿色创新合作。芬方欢迎欧中建立贸易投资磋商机制，期待双方通过对话达成共识，妥善解决彼此关切，避免经贸摩擦升级。（商务部）", "ctime": 1788784926, "time_str": "20:42:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260907/c679670644.shtml"}, {"id": "5121891", "title": "海默科技：新越征程拟转让10.80%股份", "content": "海默科技公告，2026年9月7日，第一大股东宁波新越征程能源有限公司拟将59260979股流通股（占总股本10.80%）分别转让给范中华、杨宝和；同日范中华与杨宝和签署《一致行动协议》。本次权益变动不会导致控股股东、实际控制人变更，尚需取得深交所合规性确认并办理过户手续。", "ctime": 1788784841, "time_str": "20:40:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260907/c679670623.shtml"}, {"id": "5121851", "title": "小米澎程N70 Pro定价20.99万元", "content": "9月7日晚，小米澎程N70正式发布，全系满配辅助驾驶，搭载700TOPS NVIDIA Thor芯片，N70 Pro定价20.99万元，N70 Max定价23.99万元。", "ctime": 1788784576, "time_str": "20:36:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260907/c679669818.shtml"}, {"id": "5121847", "title": "新华都：倪国涛减持计划届满未实施，仍持股9.51%", "content": "新华都公告，股东倪国涛原计划自2026年5月15日披露减持预披露公告后15个交易日起至2026年9月7日止，通过集中竞价方式减持不超过719.81万股（占总股本1%），通过大宗交易方式减持不超过991.59万股（占总股本1.38%）。截至公告披露日，减持计划时间届满，尚未实施减持；倪国涛仍持有6845.64万股，占总股本比例9.51%。", "ctime": 1788784469, "time_str": "20:34:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260907/c679669405.shtml"}, {"id": "5121845", "title": "北元化工与西安交通大学签署二氧化碳加氢制航空燃料中试项目合作协议", "content": "9月7日，陕煤集团所属北元化工与西安交通大学合作项目签约暨二氧化碳高值利用研究院揭牌仪式在中国西部科技创新港举行。双方签署二氧化碳加氢制航空燃料中试项目合作协议。据悉，从2023年起，北元化工联合西安交通大学启动二氧化碳加氢制航空煤油关键技术小试研究。经过两年集中攻关，小试取得重要突破，实现二氧化碳循环转化率90%以上，航煤馏分选择性>80%，完成公斤级催化剂制备，装置稳定运行时长可达1500小时，整体技术达到国际先进水平，项目先后通过行业成果鉴定以及陕西省科技厅验收。(人民财讯)", "ctime": 1788784393, "time_str": "20:33:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260907/c679669095.shtml"}, {"id": "5121843", "title": "鸿富诚：首次公开发行股票注册获同意，有效期12个月", "content": "鸿富诚公告，公司首次公开发行股票并在创业板上市的注册申请获中国证监会同意，批复自同意注册之日起12个月内有效，公司应严格按照报送深圳证券交易所的招股说明书和发行承销方案实施。", "ctime": 1788784376, "time_str": "20:32:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260907/c679669037.shtml"}, {"id": "5121841", "title": "外媒：也门胡塞武装称击落一架沙特侦察机", "content": "据美联社9月7日报道，也门胡塞武装发表声明称，在也门北部击落一架沙特侦察机。也门胡塞武装发言人叶海亚·萨雷亚在一份声明中表示，该侦察机在也门焦夫省上空被发现。这架飞机属于沙特，当时正试图执行“敌对行动”。截至发稿前，暂未看到沙特方面作出回应。(环球网)", "ctime": 1788784320, "time_str": "20:32:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260907/c679668835.shtml"}, {"id": "5121785", "title": "陕西金叶：瑞丰科技转让两子公司各51%股权", "content": "陕西金叶公告，公司全资子公司瑞丰科技拟将持有的金叶玉阳51%股权和新疆金叶51%股权转让给恒信汇科技，转让价款为人民币1.31亿元。相关《股权转让合同》已于2026年9月7日签订并经董事局审议通过后生效，完成股权交割、款项交割后方正式完成；完成后两公司将不再纳入公司合并报表范围。", "ctime": 1788783691, "time_str": "20:21:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260907/c679668256.shtml"}, {"id": "5121779", "title": "深水海纳：李海波等拟转让11.3211%股份，控制权拟变更", "content": "深水海纳公告，控股股东、实际控制人李海波及相关方与塔城西域矿业科技有限公司于2026年9月7日签署《合作框架协议》，拟协议转让2007.01万股股份，占公司总股本11.3211%；受让方提名董事当选后，公司控股股东拟由李海波变更为塔城西域矿业科技有限公司，实际控制人拟由李海波变更为塔城地区国有资产监督管理委员会。", "ctime": 1788783630, "time_str": "20:20:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260907/c679668244.shtml"}, {"id": "5121769", "title": "水利部：尼泊尔错坚河冲击坑上下游过流正常", "content": "记者从水利部了解到，根据最新的无人机和遥感影像分析，尼泊尔错坚河冲击坑上下游过流正常。原普热普强藏布堰塞湖下游小规模滑坡体无明显变化，河道 .com.cn/20260907/c679668030.shtml"}, {"id": "5121705", "title": "雷军：为造芯片已真金白银投入210个亿", "content": "9月7日，在小米秋季旗舰新品发布会上，小米CEO雷军再次介绍了3款芯片，玄戒O3、玄戒O100和玄戒D100。“从决定造芯片的第一天起，我们就做好了长期投入的打算。”雷军在发布会上表示，十年时间，预计芯片研发投入500个亿，截至今天，已经真金白银地投入210个亿。(北京日报)", "ctime": 1788782912, "time_str": "20:08:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260907/c679668006.shtml"}, {"id": "5121675", "title": "中金公司：吸收合并获批，A股股票将自9月15日开市起连续停牌", "content": "中金公司公告，公司已于2026年9月7日收到中国证监会出具的《关于同意中国国际金融股份有限公司吸收合并东兴证券股份有限公司和信达证券股份有限公司注册、核准中国国际金融股份有限公司吸收合并东兴证券股份有限公司和信达证券股份有限公司、中国国际金融股份有限公司变更主要股东、东兴基金管理有限公司变更主要股东、信达澳亚基金管理有限公司变更主要股东、东兴期货有限责任公司、信达期货有限公司变更股权的批复》，公司将尽快办理本次交易的相关事宜。公司于本公告同日发布了《中国国际金融股份有限公司关于公司换股吸收合并东兴证券股份有限公司、信达证券股份有限公司之A股异议股东收购请求权实施公告》，将通过上海证券交易所交易系统向公司全体A股异议股东提供平台申报，实施其所持A股异议股份的收购请求权。为确保A股异议股东收购请求权的实施顺利进行，公司A股股票将自2026年9月15日（即A股异议股东收购请求权申报首日）开市起连续停牌，并将于刊登A股异议股东收购请求权申报结果公告当日复牌，敬请广大投资者注意。", "ctime": 1788782746, "time_str": "20:05:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260907/c679667874.shtml"}, {"id": "5121633", "title": "科源制药：罗替高汀原料药获批，有效期5年", "content": "科源制药公告，公司近日收到国家药品监督管理局核准签发的罗替高汀原料药《化学原料药上市申请批准通知书》，审批结论为批准注册；该原料药在CDE原辅包登记信息平台与制剂共同审评审批结果显示为“A”，有效期5年。", "ctime": 1788782248, "time_str": "19:57:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260907/c679667074.shtml"}, {"id": "5121611", "title": "小米18 Fold陶瓷版售价15999元", "content": "9月7日晚，小米18 Fold陶瓷特别版折叠屏手机正式发布，使用新型氮化硅陶瓷，仅16GB+1TB版本，售价15999元，限量1500台。（界面新闻）", "ctime": 1788781946, "time_str": "19:52:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260907/c679666907.shtml"}, {"id": "5121595", "title": "龙版传媒：AI视频业务营收占比不足0.01%，对业绩无显著影响", "content": "龙版传媒公告，公司股票在9月4日、9月7日连续两个交易日收盘价格涨幅偏离值累计超过20%，2026年8月31日至9月7日 s://news.10jqka.com.cn/20260907/c679666581.shtml"}, {"id": "5121531", "title": "爱克股份：2026年9月7日重组事项获并购重组委审核通过", "content": "爱克股份公告，公司拟发行股份及支付现金向东莞市硅翔绝缘材料有限公司股东购买东莞硅翔100%股权并募集配套资金。2026年9月7日，深交所并购重组审核委员会审核本次交易，认为其符合重组条件和信息披露要求。本次交易尚需取得中国证券监督管理委员会同意注册的批复。", "ctime": 1788781185, "time_str": "19:39:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260907/c679666562.shtml"}, {"id": "5121529", "title": "小米发布“中折叠”手机小米18 Fold，售价10999元（12GB+256GB）", "content": "小米发布“中折叠”手机小米18 Fold，售价10999元（12GB+256GB）。", "ctime": 1788781158, "time_str": "19:39:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260907/c679666556.shtml"}, {"id": "5121517", "title": "李强会见卡塔尔首相兼外交大臣穆罕默德", "content": "9月7日下午，国务院总理李强在北京人民大会堂会见卡塔尔首相兼外交大臣穆罕默德。 李强表示，卡塔尔是中国在中东海湾地区的重要战略伙伴。在习近平主席和塔米姆埃米尔战略引领下，中卡战略伙伴关系保持稳健发展，政治互信不断巩固，互利合作成果丰硕。中方愿同卡方一道，进一步加强沟通协作，在涉及彼此核心利益问题上坚定相互支持，推动双边关系走深走实，更好造福两国人民。 李强指出，中方愿同卡方加强发展战略对接，高质量共建“一带一路”，深化传统能源、新能源、基础设施、人工智能、金融等领域合作，实现更高水平的互利共赢。中方欢迎卡方积极投资中国，也支持更多中国企业赴卡投资，促进双向投资提质增效。希望卡方继续为中国企业提供良好发展环境，保障在卡中国公民、机构和项目安全。双方还要加强文化、教育、大熊猫保护研究等人文交流合作，促进两国民众相知相亲。当前国际形势变乱交织，中卡同为发展中国家，应加强多边协调配合，推动构建更加公正合理的全球治理体系。中方支持卡方就中东局势发挥调解斡旋作用，愿同卡塔尔等地区国家以及国际社会一道不懈努力，推动地区早日恢复和平安宁。 穆罕默德表示，卡方珍视对华关系，两国始终坚持相互信任、相互尊重，实现互利共赢。2014年，塔米姆埃米尔同习近平主席共同宣布建立卡中战略伙伴关系，两国政治互信不断增强，能源、投资、工业、基建、人文等领域合作成果丰硕，开创了两国关系的“黄金时代”。(新华社)", "ctime": 1788781101, "time_str": "19:38:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260907/c679666540.shtml"}, {"id": "5121485", "title": "瑞晨环保：上海馨璞减持计划实施完成，累计减持300.7万股占2.9981%", "content": "瑞晨环保公告，控股股东、实际控制人的一致行动人上海馨璞此前计划减持不超过300.88万股，占总股本比例不超过3%。2026年7月24日至2026年9月4日，上海馨璞通过集中竞价交易和大宗交易累计减持300.7万股，占总股本比例2.9981%，减持计划已实施完成。减持后持有公司股份1179.8万股，持股比例11.76%。", "ctime": 1788780934, "time_str": "19:35:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
