779944828, "time_str": "13:07:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260528/c677038009.shtml"}, {"id": "4417845", "title": "晨丰科技等在辽宁成立能源公司，含发电业务", "content": "企查查APP显示，近日，北网新能（辽宁）能源有限公司成立，法定代表人为刘余，注册资本为1.4亿元，经营范围包含：储能技术服务；太阳能发电技术服务；发电技术服务；风力发电技术服务；发电业务、输电业务、供（配）电业务等。企查查股权穿透显示，该公司由沈阳市旭晖启耀新能源有限公司、晨丰科技全资子公司北网新能（内蒙古）能源有限公司持股。（人民财讯）", "ctime": 1779944690, "time_str": "13:04:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260528/c677037962.shtml"}, {"id": "4417827", "title": "中际旭创股价创历史新高", "content": "中际旭创盘中股价创历史新高，现涨2.58%，报1138.90元，总市值为12739.59亿元。", "ctime": 1779944503, "time_str": "13:01:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260528/c677037847.shtml"}, {"id": "4417785", "title": "国际空间站两名俄宇航员完成约6小时舱外作业", "content": "国际空间站两名俄罗斯宇航员于莫斯科时间27日23时许（北京时间28日4时许），顺利完成约6小时的舱外作业，在国际空间站外部安装了新的实验装置，并取回之前放在舱外的实验容器。据俄国家航天集团27日通过社交媒体发布的消息，留在国际空间站内的另一名俄宇航员安德烈·费佳耶夫通过遥控操纵舱外机械臂，将谢尔盖·库季-斯韦尔奇科夫和谢尔盖·米卡耶夫托举到指定位置实施作业。这两名宇航员在俄罗斯舱段“星辰”号服务舱外安装了一台射电望远镜。该装置将有助探究太阳耀斑发生机制，提升太阳耀斑预测的准确性。太阳耀斑是太阳上最剧烈的活动现象之一，可能导致地球磁场方向与强度急剧变化，引发地磁暴。（新华社）", "ctime": 1779944244, "time_str": "12:57:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260528/c677037780.shtml"}, {"id": "4417783", "title": "具身智能首次独立成馆 2026世界智能产业博览会今日开幕", "content": "为期四天的2026世界智能产业博览会28日在天津开幕。本届博览会以“智行天下 能动未来”为主题，集中发布涵盖低空经济、具身智能、智能制造等领域的200余项新标准、新产品、新技术，全景展现智能产业领域的前沿科技应用。本届智博会展览面积达13万平方米，汇聚了超700家国内外智能科技领域企业。展会设置人工智能核心技术、智能网联车、低空经济与商业航天等六大主题展区，其中具身智能展区首次独立成馆。博览会期间还将发布200余项创新成果，覆盖智能制造、低空经济、智能终端、AI教育等多个领域。在规模扩容的同时，展会所有参展技术、展品均具备落地应用能力，成为本届展会最大特色。“国际性”同样是本届展会的一大亮点，由外资客商组成的国际买手团将深度体验智慧产品，共同探讨智能产业发展新模式、寻求发展新机会。（央视新闻）", "ctime": 1779944235, "time_str": "12:57:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260528/c677037776.shtml"}, {"id": "4417691", "title": "深交所理事长沙雁：中国资产凸显独特“安全溢价”", "content": "在今天召开的深交所2026全球投资者大会上，深交所理事长沙雁表示，当前全球产业链供应链呈现深交所出从效率优先转向安全优先的趋势，中国工业体系完备，能源转型自给率足，规模超大市场，提供了产业链供应链效率与安全的双重保障。今年以来，国际油价剧烈波动，中国能源体系供应总体平稳有序，特别是一季度中国经济起步有力，GDP同比增长5%，其中进出口总额同比增长15%，服务消费保持较快增长，新型消费增速明显，中国资产凸显独特的“安全溢价”。（财联社）", "ctime": 1779943111, "time_str": "12:38:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260528/c677037465.shtml"}, {"id": "4417689", "title": "深圳一企业称股权价值被严重低估续：重估高出近23倍，当事人认为仍未反映市场价值", "content": "鸥富实业（深圳）有限公司（下称：鸥富公司）半数股权被拍卖一事有了新进展。5月27日，从鸥富公司负责人袁先生处获悉，深圳市公平衡资产评估有限公司（下称：公平衡公司）已于3月27日作出《资产评估报告》，欧富公司51%股权价值为2.09亿元，是初次评估价值876.65万元的近24倍。28日，深圳市中级法院对该部分股权进行拍卖，起拍价为1.46亿元。截至发稿前，该拍卖尚无人报名。袁先生仍认为，公平衡公司作出的评估报告仍存在重大遗漏，依然未能反映出该公司的真实市场价值，此次拍卖应当中止。此外袁先生认为，法院此次重新评估价值不应采取“顺延”的方式选定评估机构，而应由双方现场摇号选定评估公司对被漏评或低评资产重新评估。5月28日上午，深圳市中院执行局相关负责人表示，将了解一下情况。截至发稿前，该负责人未进一步回应。（澎湃新闻）", "ctime": 1779943092, "time_str": "12:38:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260528/c677037463.shtml"}, {"id": "4417687", "title": "以太坊下跌4.5%报1968.05美元，创3月30日以来新低", "content": "以太坊下跌4.5%报1968.05美元，创3月30日以来新低。", "ctime": 1779943084, "time_str": "12:38:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260528/c677037462.shtml"}, {"id": "4417659", "title": "嘉兴南湖机场首条国际货运航线正式开通", "content": "5月28日，嘉兴南湖机场首条国际货运航线正式开通。当日上午，一架装载电子电器、药品和纺织服装等货物的圆通航空“嘉兴号”（B767-300F）全货机从嘉兴南湖机场缓缓滑出，飞往孟加拉国达卡机场。据悉，除当日已开通的首条国际货运航线外，嘉兴南湖机场年内还将陆续开通19条国际货运航线，届时航线总数将达20条，其中亚洲9条、欧洲6条、美洲5条，初步构建起“辐射亚洲、通达欧美”的国际货运航线网络。（新华社）", "ctime": 1779942357, "time_str": "12:25:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260528/c677037264.shtml"}, {"id": "4417657", "title": "现货黄金日内跌幅扩大至2%", "content": "现货黄金日内跌幅扩大至2%，报4366.94美元/盎司。", "ctime": 1779942349, "time_str": "12:25:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260528/c677037263.shtml"}, {"id": "4417655", "title": "上海城投19.3亿摘取上海虹口瑞虹宅地 溢价率35.63%", "content": "上海今年第四批次土拍5月28日开拍，本批共5宗宅地分两天出让。在今日上午的土拍活动中，虹口瑞虹宅地吸引了12家竞买人参与现场竞拍。该地块土地出让面积7115平方米，起始价14.23亿元。经过63轮现场竞价，最终，上海城投置地以19.3亿元的价格摘得该地块，成交楼面价10.85万元/平方米，溢价率35.63%。（财联社）", "ctime": 1779942328, "time_str": "12:25:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260528/c677037258.shtml"}, {"id": "4417641", "title": "深交所理事长沙雁：已受理创业板改革后首批优质创新企业IPO申请 争取尽快形成一批典型案例", "content": "在今日召开的深交所2026全球投资者大会上，深交所理事长沙雁表示，深交所创业板是中国资本市场最早设立的支持科技创新的特色板块，经过16年的改革发展，上市公司达到1398家，总市值超过21万亿元，高新技术企业占比约九成、战略新兴产业企业占比约七成，吸引和培育了一大批实现跨越式发展的龙头科技企业，在新一代信息技术、新能源、医药生物和高端设备制造等领域形成了4个万亿级市值的产业链集群。上个月，中国证监会发布深化创业板改革意见，进一步提升创业板的包容性、适应性和吸引力。目前，深交所已受理改革落地后的首批优质创新企业IPO申请，争取尽快形成一批典型案例，确保创业板改革取得扎扎实实的成效。（财联社）", "ctime": 1779941764, "time_str": "12:16:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260528/c677037070.shtml"}, {"id": "4417635", "title": "韩国综指跌幅扩大至4%", "content": "韩国综指跌幅扩大至4%，现报7897.6点。", "ctime": 1779941601, "time_str": "12:13:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260528/c677037043.shtml"}, {"id": "4417631", "title": "习近平同奥地利总统范德贝伦就中奥建交55周年互致贺电", "content": "习近平同奥地利总统范德贝伦就中奥建交55周年互致贺电。(新华社)", "ctime": 1779941537, "time_str": "12:12:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260528/c677037035.shtml"}, {"id": "4417629", "title": "深交所理事长沙雁：将深入落实新一轮扩大资本市场开放部署，便利境外投资者投资A股", "content": "5月28日，深交所2026全球投资者大会举行。深交所理事长沙雁表示，将深入落实新一轮扩大资本市场开放部署，便利境外投资者投资A股。一是稳步拓展互联互通机制，研究细化QFII制度优化落实举措，更好服务在岸与离岸市场协同发展。二是丰富多元化产品供给，加强指数编制国际合作，积极推动境外ETF产品开发。三是完善面向上市公司和国际投资者的服务体系，支持和引导上市公司有序布局国际化业务，进一步丰富面向境外投资者的信息供给，不断增强市场透明度与可预期性。（新浪财经）", "ctime": 1779941425, "time_str": "12:10:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260528/c677037016.shtml"}, {"id": "4417621", "title": "MSCI亚太指数下跌2%至269.38点", "content": "MSCI亚太指数下跌2%至269.38点。", "ctime": 1779941304, "time_str": "12:08:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260528/c677036950.shtml"}, {"id": "4417607", "title": "欧股期货走低，欧洲斯托克50指数期货下跌1.2%", "content": "欧股期货走低，欧洲斯托克50指数期货下跌1.2%；英国富时100指数期货下跌0.95%；德国DAX30指数期货下跌0.93%。", "ctime": 1779941115, "time_str": "12:05:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260528/c677036897.shtml"}, {"id": "4417603", "title": "比特币跌破73000美元，日内跌超3%", "content": "比特币跌破73000美元，日内跌超3%。", "ctime": 1779941072, "time_str": "12:04:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260528/c677036880.shtml"}, {"id": "4417601", "title": "平陆运河航道主体工程完成", "content": "全长134.2公里的平陆运河是新中国成立以来建设的首条通江达海的大运河。平陆运河按内河Ⅰ级航道标准建设，可通航5000吨级船舶。今天（5月28日），平陆运河航道主体工程开挖全部完成，为平陆运河9月建成通航筑牢坚实基础。（央视新闻）", "ctime": 1779941062, "time_str": "12:04:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260528/c677036879.shtml"}, {"id": "4417599", "title": "科威特时隔一个多月再次拉响防空警报", "content": "当地时间28日5时20分许，科威特全国响起防空警报。这是该国时隔一个多月再次拉响防空警报。科威特军方随后称拦截了“敌方”导弹和无人机袭击。(新华社)", "ctime": 1779941047, "time_str": "12:04:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
