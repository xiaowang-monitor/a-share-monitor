cn/20260409/c675863767.shtml"}, {"id": "4204943", "title": "南向资金净买入超90亿港元", "content": "据同花顺iFinD数据，截至目前，南向资金净买入超90亿港元，其中港股通（沪）买入超63.27亿港元，港股通（深）买入超27.52亿港元。", "ctime": 1775720731, "time_str": "15:45:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260409/c675863744.shtml"}, {"id": "4204939", "title": "苏林即将访华 外交部：期待通过此访赓续两国传统友好", "content": "4月9日，外交部发言人毛宁主持例行记者会。有记者问：据越中双方今天发布的消息，越共中央总书记、国家主席苏林将于本月14日到17日对中国进行国事访问。请您介绍一下苏林的访华行程，中方对此访有何期待？如何评价越中两国关系近期的发展？毛宁表示，苏林总书记近日当选越南国家主席后，将中国作为出访的首个国家，充分体现对发展中越两党、两国关系的高度重视。中方期待通过此访赓续两国传统友好，持续深化中越全面战略合作伙伴关系，推动构建更高水平、具有战略意义的中越命运共同体，共同促进世界社会主义事业发展，共同维护地区和世界的和平稳定繁荣。（央视新闻）", "ctime": 1775720635, "time_str": "15:43:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260409/c675863356.shtml"}, {"id": "4204935", "title": "伊朗军方发言人：希望能达成协议，但如果谈判失败 “已做好长期战争的准备”", "content": "据伊朗学生通讯社9日报道，伊朗军方发言人就停火谈判表示，希望能达成协议，但如果谈判失败，“我们也已做好长期战争的准备”。伊朗提出的条件将是谈判的基础。(新华社)", "ctime": 1775720533, "time_str": "15:42:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260409/c675863281.shtml"}, {"id": "4204933", "title": "金达威：子公司取得投资项目备案告知书", "content": "金达威公告，全资子公司内蒙古金达威药业有限公司取得托克托县发展和改革委员会发布的《项目备案告知书》。项目名称为内蒙古金达威药业有限公司年产10万吨藻油 Omega-3项目，拟投资12亿元，主要建设内容包括新建发酵车间、提炼车间，配套建设凉水池、水泵房、各类库房、储罐区等公辅工程，以及倒班宿舍楼，项目建筑用地面积70129平方米。", "ctime": 1775720520, "time_str": "15:42:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260409/c675863273.shtml"}, {"id": "4204931", "title": "马斯克回应美国首条高铁造价或高达1260亿美元", "content": "据报道，美国官员表示，他们现在认为连接洛杉矶和旧金山的高速铁路最终造价可能达1260亿美元左右，是最初批准造价的三倍多。马斯克在X上回应网友转发的相关报道称：“如果由Boring Company建造一条从旧金山市中心到洛杉矶市中心的超级高铁隧道，成本将不到这一数字的5%。”有网友问：“为什么Boring Company不做呢？！”马斯克回应称：“这条‘高铁’的真正目的并非为了交通，而是为了给官僚、顾问和工会洗钱。迄今为止投入大量资金都用在了这些方面。这就是为什么他们不想要一个真正经济高效的高速交通系统。”（新浪财经）", "ctime": 1775720516, "time_str": "15:41:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260409/c675863269.shtml"}, {"id": "4204929", "title": "天地在线：全资子公司签署3000万元以内项目合作协议", "content": "天地在线公告，全资子公司海南旦生数字科技有限公司拟与陵水黎族自治县文旅投资开发有限公司签署《项目合作协议》，合作期限10年，合同总金额不超过3000万元。陵水黎族自治县文旅投资开发有限公司与公司持股5%以上股东海南陵发投资有限公司为同一控股股东、实际控制人，本次交易构成关联交易。", "ctime": 1775720509, "time_str": "15:41:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260409/c675863264.shtml"}, {"id": "4204927", "title": "晓鸣股份：2026年3月销售鸡产品收入1.01亿元，环比增加57.50%", "content": "晓鸣股份公告，公司2026年3月销售鸡产品2853.76万羽，销售收入1.01亿元，环比变动分别为30.38%、57.50%，同比变动分别为-3.15%、-22.50%。", "ctime": 1775720499, "time_str": "15:41:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260409/c675863260.shtml"}, {"id": "4204923", "title": "亨通光电：控股股东亨通集团2025年4月10日至2026年4月9日增持计划已完成", "content": "亨通光电公告，控股股东亨通集团2025年4月10日至2026年4月9日增持计划已完成，期间通过集中竞价累计增持753.56万股，占总股本0.31%，耗资1.5亿元；增持后亨通集团持股5.94亿股，占24.07%，其与一致行动人合计持股6.89亿股，占27.94%。", "ctime": 1775720458, "time_str": "15:40:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260409/c675863242.shtml"}, {"id": "4204919", "title": "京基智农：2026年3月，公司销售生猪收入2.39亿元", "content": "京基智农公告，2026年3月，公司销售生猪21.76万头（其中仔猪3.77万头），销售收入2.39亿元；商品猪销售均价10.12元/kg。2026年1-3月，公司累计销售生猪67.46万头（其中仔猪9.73万头），累计销售收入8.65亿元。", "ctime": 1775720436, "time_str": "15:40:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260409/c675863235.shtml"}, {"id": "4204915", "title": "熵基科技：拟发行H股并在香港联交所上市", "content": "熵基科技公告，公司正在筹划境外发行股份（H股）并申请在香港联合交易所有限公司（香港联交所）上市。此举旨在深入推进全球化战略布局，进一步拓展海外业务，提升国际品牌形象及全球市场综合竞争力。目前，公司正与相关中介机构就本次H股发行上市的相关工作进行商讨，相关细节尚未确定。本次H股发行上市不会导致公司控股股东和实际控制人发生变化。", "ctime": 1775720420, "time_str": "15:40:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260409/c675863228.shtml"}, {"id": "4204905", "title": "业绩预告“大变脸”，股价跌停，中化岩土回应", "content": "4月9日，中化岩土股票一字跌停，报2.7元/股。此前，中化岩土发布2025年度业绩预告修正公告，归母净利润从预计的-8亿元至-6亿元修正为-14亿元至-9.5亿元，扣非净利润从预计的-7.9亿元至-5.9亿元修正为-13.8亿元至-9.3亿元。公司预计2025年度期末归属于母公司所有者权益可能为负值，股票交易可能被深交所实施退市风险警示。中化岩土证券部工作人员回应记者，此次大幅下修是由于审计机构进驻后在审计过程中发现了问题，前期业绩预告与下修后的业绩差异巨大确实不应该。（中证金牛座）", "ctime": 1775720333, "time_str": "15:38:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260409/c675863168.shtml"}, {"id": "4204899", "title": "中方在伊朗问题上坦坦荡荡", "content": "今天，有记者问：有报道称，中芯国际向伊朗军方提供芯片制造设备，中国商业卫星公司公开美军中东基地影像。美官员声称清楚中俄为帮助伊朗所采取的行动，必要时将对这些行动加以应对。请问对此有何评论？ 国防部新闻发言人答：我们坚决反对有关方散布针对中方的猜测性、影射性虚假信息。中方在伊朗问题上坦坦荡荡、正大光明，始终秉持客观公正立场，一直在为劝和促谈而努力，从不做拱火浇油的事。谁在说一套做一套，谁在到处制造战乱冲突，国际社会看得清清楚楚。（央视军事）", "ctime": 1775720263, "time_str": "15:37:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260409/c675863135.shtml"}, {"id": "4204893", "title": "南向资金净买入超80亿港元", "content": "据同花顺iFinD数据，截至目前，南向资金净买入超80亿港元，其中港股通（沪）买入超57.60亿港元，港股通（深）买入超23.61亿港元。", "ctime": 1775720197, "time_str": "15:36:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260409/c675863064.shtml"}, {"id": "4204891", "title": "黎真主党称向以色列发射火箭弹 以回应其“违反停火协议”行为", "content": "黎巴嫩真主党9日发表声明，称为了保卫黎巴嫩及其人民，并回应以色列违反美伊停火协议的行为，于当天凌晨2时30分向以色列马纳拉定居点发射火箭弹。真主党表示，这种回应将持续下去，直到以色列和美国对黎巴嫩及其人民的袭击停止。（央视新闻）", "ctime": 1775720194, "time_str": "15:36:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260409/c675863048.shtml"}, {"id": "4204883", "title": "长江电力：2026年第一季度发电量618.25亿千瓦时，同比增长7.19%", "content": "长江电力公告，2026年第一季度，公司境内所属六座梯级电站总发电量约618.25亿千瓦时，较上年同期增加7.19%。乌东德水库来水总量约154.75亿立方米，较上年同期偏枯7.36%；三峡水库来水总量约585.68亿立方米，较上年同期偏丰5.49%。具体发电量为：乌东德电站63.76亿千瓦时，同比下降2.5976%；白鹤滩电站130.8亿千瓦时，同比增长4.0238%；溪洛渡电站144.83亿千瓦时，同比增长9.7064%；向家坝电站78.06亿千瓦时，同比增长10.8759%；三峡电站163.48亿千瓦时，同比增长10.5136%；葛洲坝电站37.32亿千瓦时，同比增长5.9021%。", "ctime": 1775720044, "time_str": "15:34:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260409/c675862959.shtml"}, {"id": "4204881", "title": "外交部：中国的成功是中国道路、中国理念、中国模式的成功", "content": "4月9日，外交部发言人毛宁主持例行记者会。有记者问：日前，希腊前财政部长、经济学家亚尼斯·瓦鲁法基斯在报业辛迪加网站刊文称，为了掩盖自身失败，西方编造出“中国依靠欺骗手段走向繁荣”的虚假叙事，应以更客观的视角看待中国经济成功的原因。发言人对此有何回应？毛宁表示，我也看了这篇文章，确实有理有据，客观理性，推荐大家都看一看。中国的成功不是偶然，更不是靠“欺骗”，而是中国制度优势的体现，是中国道路、中国理念、中国模式的成功。（央视新闻）", "ctime": 1775720043, "time_str": "15:34:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260409/c675862958.shtml"}, {"id": "4204879", "title": "美拟全面禁止中国实验室测试美国电子产品，外交部：坚决反对", "content": "4月9日，外交部发言人毛宁主持例行记者会。法新社记者提问，美国联邦通信委员会（FCC）表示，计划就一项提案进行表决，该提案将禁止所有中国实验室对在美国使用的电子设备进行检测。中方对此有何评论？毛宁强调，中方坚决反对美方泛化国家安全概念的做法，这种做法严重阻碍中美企业正常的经贸往来，不符合包括美国企业和消费者在内的各方利益。中方将继续坚定维护自身的正当合法权益。（澎湃新闻）", "ctime": 1775720031, "time_str": "15:33:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260409/c675862942.shtml"}, {"id": "4204877", "title": "华锐精密：核心技术人员易兵先生因病逝世", "content": "华锐精密公告，公司核心技术人员易兵先生于近日因病逝世。易兵先生与公司不存在涉及职务发明专利等知识产权权属纠纷或潜在纠纷的情形，易兵先生的逝世不会对公司的技术优势、核心竞争力、业务发展和产品创新产生实质性影响，不会影响公司现有核心技术及研发项目的工作开展。", "ctime": 1775720027, "time_str": "15:33:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260409/c675862941.shtml"}, {"id": "4204863", "title": "南向资金净买入超70亿港元", "content": "据同花顺iFinD数据，截至目前，南向资金净买入超70亿港元，其中港股通（沪）买入超50.21亿港元，港股通（深）买入超20.47亿港元。", "ctim s://news.10jqka.com.cn/20260409/c675862698.shtml"}, {"id": "4204823", "title": "外交部：中方将继续为缓和局势、平息战火作出努力", "content": "4月9日，外交部发言人毛宁主持例行记者会。在回答有关中东局势问题时，毛宁表示，中方一贯主张尽快停火止战，通过政治外交途径化解争端，最终实现中东、海湾地区的长治久安。希望各方通过对话谈判妥善化解分歧，中方将继续为缓和局势、平息战火作出努力。（央视新闻）", "ctime": 1775719424, "time_str": "15:23:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260409/c675862691.shtml"}, {"id": "4204821", "title": "美国就伊朗战争问题是否与中国举行了高层会谈？外交部回应", "content": "4月9日，外交部发言人毛宁主持例行记者会。法新社记者提问，白宫昨天表示，过去几天，美国就伊朗战争问题与中国举行了高层会谈。请问发言人能否证实会谈确已举行，会谈具体讨论了哪些内容？第二个问题，关于黎巴嫩，中方是否认为黎巴嫩也应包含在已达成一致的停火协议范围之内？“你的第一个问题，战事爆发以来，中方同各方保持着沟通，积极劝和阻战。”毛宁回应道。关于第二个问题，毛宁表示，刚刚我们已经介绍了我们对黎巴嫩形势的立场，我们希望各方能够以达成临时停火安排为契机，通过政治外交途径化解争端，平息战火。（澎湃新闻）", "ctime": 1775719412, "time_str": "15:23:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260409/c675862689.shtml"}, {"id": "4204817", "title": "王毅外长访问朝鲜将探讨哪些议题？外交部：相信将讨论共同关心的问题", "content": "4月9日，外交部发言人毛宁主持例行记者会。法新社记者提问，王毅外长将访问朝鲜，发言人能否进一步介绍王毅外长将在朝鲜探讨哪些议题？是否会提出重启中国赴朝旅游的问题？“昨天我介绍了王毅外长访问朝鲜的有关安排，如果有进一步的消息我们会及时发布，你可以保持关注。我相信双方将讨论共同关心的问题。”毛宁说。（澎湃新闻）", "ctime": 1775719394, "time_str": "15:23:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260409/c675862684.shtml"}, {"id": "4204815", "title": "外交部：希望有关方面抓住和平机会，推动中东早日恢复和平稳定", "content": "4月9日，外交部发言人毛宁主持例行记者会。俄罗斯卫星社记者提问，伊朗议长卡利巴夫8日列举伊朗10项停战条款中已遭到违反的3项，称“可行的谈判基础”在伊朗与美国谈判还没开始前就遭到公然破坏，其中包括以色列袭击黎巴嫩的情况，中方对此有何评论？毛宁表示，我们希望有关方面能够抓住和平的机会，通过对话协商弥合分歧，推动海湾和中东地区早日恢复和平稳定。（澎湃新闻）", "ctime": 1775719379, "time_str": "15:22:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260409/c675862681.shtml"}, {"id": "4204811", "title": "西班牙将立即恢复驻伊朗大使馆运作", "content": "据埃菲社9日报道，西班牙驻伊朗大使将返岗并立即恢复使馆运作。(新华社)", "ctime": 1775719370, "time_str": "15:22:50", "stoc // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
