息正式签署战略合作协议", "content": "近日，中控技术与浪潮电子信息产业股份有限公司（简称“浪潮信息”）正式签署战略合作协议。双方将基于中控技术在流程工业的深厚积累与浪潮信息在AI算力基础设施领域的全栈能力，围绕自主运行工厂AOP(Autonomous Operating Plant)，推动时间序列大模型TPT(Time-series Pre-trained Transformer)与多元算力底座的深度协同，联合打造高可靠、多业务并存的工业AI解决方案，加速流程工业从自动化向自主化的跨越。(证券时报)", "ctime": 1779086728, "time_str": "14:45:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260518/c676762183.shtml"}, {"id": "4374821", "title": "中国信通院启动首批“人工智能营销客服平台能力”测评", "content": "中国通信标准化协会、中国广告协会互联网广告标准联合工作组（CAA/CCSAJWG）研制发布的T/CCSA 737-2025（T/CAAAD 005-2025）《人工智能营销客服平台能力要求》，为人工智能营销客服平台能力建设和测评工作提供了标准基础。为进一步推动标准落地应用，中国信息通信研究院泰尔终端实验室启动首批“人工智能营销客服平台能力”测评单位征集工作。本次测评将围绕标准中与平台能力建设直接相关的要求开展，重点关注平台技术架构与服务流程、智能平台功能、智能推荐与营销引导、联络中心平台功能、平台接口和数据安全等内容。（中国信通院）", "ctime": 1779086583, "time_str": "14:43:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260518/c676762113.shtml"}, {"id": "4374815", "title": "沪深京三市成交额超2.7万亿元，较上日此时缩量4405亿元", "content": "据同花顺iFinD数据，沪深京三市成交额超2.7万亿元，较上日此时缩量4405亿元，预计全天成交金额约2.9万亿元。截至目前，沪市成交额12202亿元，深市成交额14585亿元，北证50成交额214亿元。", "ctime": 1779086512, "time_str": "14:41:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260518/c676762064.shtml"}, {"id": "4374809", "title": "5月18日农产品批发价格200指数比上周五下降0.45个点", "content": "据农业农村部监测，5月18日“农产品批发价格200指数”为114.61，比上周五下降0.45个点，“菜篮子”产品批发价格指数为114.94，比上周五下降0.52个点。（农业农村部）", "ctime": 1779086318, "time_str": "14:38:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260518/c676761978.shtml"}, {"id": "4374761", "title": "日韩股市收盘涨跌互现", "content": "日经225指数收跌0.97%，报60815.95点。韩国综指收涨0.30%，报7515.99点。", "ctime": 1779085872, "time_str": "14:31:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260518/c676761704.shtml"}, {"id": "4374749", "title": "海南四市县将对旅游市场严重失信联合惩戒", "content": "5月18日，记者从海南省委宣传部新闻发布处召开的新闻发布会上得知，《三亚市旅游市场严重失信联合惩戒若干规定》《陵水黎族自治县旅游市场严重失信联合惩戒若干规定》《乐东黎族自治县旅游市场严重失信联合惩戒若干规定》《保亭黎族苗族自治县旅游市场严重失信联合惩戒若干规定》自2026年6月1日起施行。这是全国首例旅游市场严重失信联合惩戒的协同立法。本次立法所规范的“旅游市场”不局限于旅行社、景区，还全面覆盖交通、住宿、餐饮、购物、娱乐等全链条涉旅领域，监管部门涵盖旅游文化体育、商务、交通运输、市场监督管理、公安、综合行政执法等多部门，构建起跨地区、跨行业的监管格局，实现对旅游市场严重失信主体的全域规范。（央视新闻）", "ctime": 1779085744, "time_str": "14:29:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260518/c676761656.shtml"}, {"id": "4374739", "title": "湖南省启动防汛四级和自然灾害救助四级应急响应", "content": "湖南省应急管理厅记者18日获悉，湖南省应急委员会决定：自5月18日8时起，启动防汛四级应急响应，同步启动自然灾害救助四级应急响应。湖南省应急委要求，各级各部门要按照应急响应要求，迅速落实各项防抗救工作措施。各类责任人要迅速到岗到位，突出水工程调度、山洪地质灾害防御、中小河流洪水防范、涉水工程防守、城镇防涝等重点，加强巡查防守，提前转移危险区群众，确保应转尽转、应转早转，坚决避免人员伤亡。同时，要加强灾情统计报送，有力有序做好受灾群众生活救助，全力确保度汛安全。（新华社）", "ctime": 1779085606, "time_str": "14:26:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260518/c676761603.shtml"}, {"id": "4374699", "title": "杭德市域铁路全线轨道贯通", "content": "记者从中国铁建股份有限公司了解到，18日，随着由中铁十一局参建的杭州至德清市域铁路Ⅱ标段最后一节轨排连接成功，杭德市域铁路全线轨道贯通，为线路按期开通运营奠定坚实基础。杭德市域铁路是连接杭州市与湖州市的首条市域铁路，也是浙江省重点交通项目，线路全长25.6公里，共设9座车站。据中铁十一局项目技术负责人金晓东介绍，在焊轨施工中，建设团队应用新能源多场景闪光焊轨机，灵活适配全系列道岔及正线钢轨焊接作业，同时通过统一钢轨和道岔焊接标准及参数，实现钢轨焊接达到正负0.5毫米精度，进一步提升轨道平顺性和列车运行稳定性。杭德市域铁路连通杭州市余杭区和湖州市德清县。这一线路开通后，将与杭州地铁10号线贯通运营，形成杭州至德清“一小时都市圈”，大幅提升两地间交通便利性，对进一步促进沿线经济社会高质量发展具有重要意义。（新华社）", "ctime": 1779085072, "time_str": "14:17:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260518/c676761434.shtml"}, {"id": "4374683", "title": "银行板块震荡下行，齐鲁银行、厦门银行跌超3%", "content": "银行板块震荡下行，齐鲁银行、厦门银行跌超3%，长沙银行、宁波银行、上海银行纷纷下挫。", "ctime": 1779084773, "time_str": "14:12:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260518/c676761336.shtml"}, {"id": "4374677", "title": "沪深京三市成交额超2.5万亿元，较上日此时缩量3887亿元", "content": "据同花顺iFinD数据，沪深京三市成交额超2.5万亿元，较上日此时缩量3887亿元，预计全天成交金额约2.9万亿元。截至目前，沪市成交额11293亿元，深市成交额13519亿元，北证50成交额197亿元。", "ctime": 1779084644, "time_str": "14:10:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260518/c676761308.shtml"}, {"id": "4374671", "title": "智元远征A3正式上线擎天租", "content": "5月18日，智元远征A3正式上线擎天租平台，远征A3的轻量化部署、长续航、强表现力与高定制能力，补齐了高端人形机器人在RaaS（Robot as a Service，机器人即服务）模式下规模化交付的关键拼图。（人民财讯）", "ctime": 1779084576, "time_str": "14:09:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260518/c676761290.shtml"}, {"id": "4374669", "title": "外交部阿富汗事务特使岳晓勇访问阿富汗和卡塔尔", "content": "2026年5月10日至16日，外交部阿富汗事务特使岳晓勇访问阿富汗和卡塔尔。在阿富汗期间，分别会见外长穆塔基、内政部长高级顾问阿纳斯·哈卡尼等，就中阿关系和有关国际地区问题交换意见。在卡塔尔期间，会见外交部国务大臣胡莱菲，就共同关心的问题交换意见。(外交部网站)", "ctime": 1779084506, "time_str": "14:08:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260518/c676761242.shtml"}, {"id": "4374665", "title": "日本40年期国债收益率上升13个基点至4.345%", "content": "日本40年期国债收益率上升13个基点至4.345%。", "ctime": 1779084439, "time_str": "14:07:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260518/c676761190.shtml"}, {"id": "4374647", "title": "A股三大指数震荡下挫，创业板指跌超1%", "content": "A股三大指数震荡下挫，创业板指跌超1%，深成指跌0.76%，沪指跌0.56%。", "ctime": 1779084172, "time_str": "14:02:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260518/c676761087.shtml"}, {"id": "4374631", "title": "上证50股指期货(IH)主力合约日内跌超1%", "content": "上证50股指期货(IH)主力合约日内跌超1%，现报2908.0点。", "ctime": 1779084096, "time_str": "14:01:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260518/c676761059.shtml"}, {"id": "4374589", "title": "华电辽能触及跌停", "content": "华电辽能触及跌停，成交额36.61亿元。", "ctime": 1779083978, "time_str": "13:59:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260518/c676761028.shtml"}, {"id": "4374583", "title": "三大电信运营商震荡走高，中国电信涨超5%", "content": "三大电信运营商震荡走高，中国电信涨超5%，中国联通涨近5%，中国移动涨超2%。消息面上，三大运营商齐发Token服务，行业商业化进程提速。", "ctime": 1779083818, "time_str": "13:56:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260518/c676760993.shtml"}, {"id": "4374527", "title": "浦发银行行长谢伟：商业银行应加快构建企业级AI平台和大模型体系", "content": "5月18日，在2026清华五道口全球金融论坛上，浦发银行行长谢伟表示，商业银行应加快构建企业级的AI平台和大模型体系，在智能风控、智能客服、智能投顾、智能审批等领域实现规模化的应用，推动由经验驱动向数智驱动的根本改变。（人民财讯）", "ctime": 1779083043, "time_str": "13:44:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260518/c676760795.shtml"}, {"id": "4374521", "title": "日本国债收益率高于东证指数股息收益率的幅度达到2007年以来之最", "content": "日本10年期国债收益率已远高于该国股息收益率，这使得债券市场波动平息后，资金从股票轮动至债券的可能性增大。东证指数成分股的股息收益率目前约为2.3%，低于日本国债10年期复合收益率2.75%。两者之间的差距达到2007年以来最大，当时日本央行处于紧缩周期中。“从股息收益率和盈利收益率的角度来看，债券都开始比股票更具吸引力，” T&D Asset Management首席策略师Hiroshi Namioka表示。“一旦油价开始企稳，债券买盘可能会增加。”", "ctime": 1779082971, "time_str": "13:42:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260518/c676760785.shtml"}, {"id": "4374497", "title": "由常住地提供基本公共服务相关文件将出台", "content": "记者日前从业内人士获悉，由常住地提供基本公共服务相关文件近期将出台。国家基本公共服务包括幼有所育、学有所教、劳有所得、老有所养、住有所居等内容。今年1月9日召开的国务院常务会议研究推行由常住地提供基本公共服务有关工作‌。“十五五”规划纲要明确，全面推进常住地提供基本公共服务。健全与常住人口相匹配的公共资源配置机制。在人口集中流入城市，规范实施以就业居住年限为主要条件的紧缺公共服务梯度供应，逐步减少梯度层次和服务差异。落实持居住证参加城乡居民基本医疗保险政策。逐步将未落户常住人口纳入常住地儿童关爱、社会救助等范围。(中证金牛座)", "ctime": 1779082572, "time_str": "13:36:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260518/c676760675.shtml"}, {"id": "4374485", "title": "以色列强推的“巴勒斯坦人死刑法”生效", "content": "以色列强推的“巴勒斯坦人死刑法”17日夜间生效。该法授权法官对其认定实施“致命袭击”的约旦河西岸巴勒斯坦人判处死刑，被批为针对巴勒斯坦人的歧视性法律，广受谴责。（央视新闻）", "ctime": 1779082525, "time_str": "13:35:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260518/c676760656.shtml"}, {"id": "4374469", "title": "世界铂金投资协会：伊朗局势使第一季铂金市场供过于求，为六个季度以来首见", "content": "世界铂金投资协会(WPIC)表示，受伊朗战争影响，第一季铂金市场出现了六季度以来的首次过剩，原因是投资需求下降，且高企的能源价格增加了通胀和利率上升的可能性。在2025年暴涨127%之后，现货铂金于今年1月触及每金衡盎司2919美元的纪录高位。随后，随着黄金领涨的行情势头减弱，加之2月底中东冲突爆发，投资者为应对保证金追缴而抛售贵金属，铂金价格回落至约2000美元。第一季铂金市场录得26.8万盎司过剩，较2025年同期65.8万盎司缺口形成对比。需求同比下降31%至150万盎司，因净投资流出达22.5万盎司，以及汽车和珠宝消费走弱所致。", "ctime": 1779082437, "time_str": "13:33:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260518/c676760641.shtml"}, {"id": "4374459", "title": "上期所低硫燃油主力合约大涨8%", "content": "上期所低硫燃油主力合约大涨8%，报5350元/吨。", "ctime": 1779082283, "time_str": "13:31:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260518/c676760604.shtml"}, {"id": "4374457", "title": "内塔尼亚胡再次要求取消涉贪腐案听证会", "content": "总台记者当地时间5月18日获悉，以色列总理内塔尼亚胡的律师已向法院提出申请，要求取消当天的涉腐败案听证会出庭。该听证会原定于当天上午9时30分开始，内塔尼亚胡的律师以“外交和安全原因”为由要求取消，这种情况在此前已多次发生。截至目前，该案法官尚未就是否接受该请求作出裁决。（央视新闻）", "ctime": 1779082272, "time_str": "13:31:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260518/c676760599.shtml"}, {"id": "4374453", "title": "沪深京三市成交额超2.2万亿元，较上日此时缩量3105亿元", "content": "据同花顺iFinD数据，沪深京三市成交额超2.2万亿元，较上日此时缩量3105亿元，预计全天成交金额约2.9万亿元。截至目前，沪市成交额9895亿元，深市成交额11935亿元，北证50成交额177亿元。", "ctime": 1779082258, "time_str": "13:30:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260518/c676760597.shtml"}, {"id": "4374443", "title": "我国具有北斗功能的终端产品总保有量超22亿台/套", "content": "中国卫星导航定位协会18日发布《2026中国北斗时空产业发展白皮书》显示，2025年国内北斗终端产品总销量超过4.1亿台/套。截至2025年底，国内北斗兼容型芯片及模块累计出货量接近26亿片（含智能手机），具有北斗功能的各类型终端产品社会总保有量超过22亿台/套（含智能手机）。其中，具有北斗定位功能的智能手机出货量近2.8亿部，车载导航仪市场终端销量超过2400万台，包括手持、物联网、穿戴式、车载（含两轮车）、高精度、船载等在内的各类监控及定位终端设备销量超过1.2亿台/套。（科创板日报）", "ctime": 1779082097, "time_str": "13:28:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260518/c676760569.shtml"}, {"id": "4374439", "title": "腾讯设计智能体Ardot公测 设计一键转代码", "content": "今天，腾讯自研AI设计智能体平台Ardot正式公测。用户可以用自然语言描述界面需求，Ardot实时流式生成可编辑的设计初稿，并一键转代码。（财联社）", "ctime": 1779082025, "time_str": "13:27:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260518/c676760554.shtml"}, {"id": "4374431", "title": "中国联通：当好Token的生产者、运营者、服务者", "content": "5月14日至15日，中国联通在雄安召开助力国家区域协调发展研讨会。会议强调，坚决贯彻落实党中央“六张网”建设部署要求，加强空天地一体、通感算一体等6G关键技术攻关，打造新一代通信网和算力网。坚持勇立潮头，加快创新转型。紧跟AI发展趋势，依托“连接”和“算力”核心能力，当好Token的生产者、运营者、服务者，彰显中国联通的先进性、安全性。（人民财讯）", "ctime": 1779081709, "time_str": "13:21:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260518/c676760487.shtml"}, {"id": "4374421", "title": "人形机器人概念股午后拉升，美格智能涨停", "content": "人形机器人概念股午后拉升，美格智能、北自科技涨停，江海股份、雷赛智能、瑞可达跟涨。", "ctime": 1779081584, "time_str": "13:19:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260518/c676760462.shtml"}, {"id": "4374405", "title": "融通基金杨泠枫： 算力进入稀缺时代 供需缺口催生三大投资主线", "content": "近期，以光模块、国产算力为代表的科技赛道再度成为资金焦点。融通科技臻选基金经理杨泠枫认为，人工智能（AI）大模型应用场景的持续拓宽正带动Token消耗量大幅攀升，行业算力供给已进入偏紧格局。AI产业链的高景气具备坚实的产业基础，其成长逻辑清晰可见。在他看来，AI产业包含算力、模型（算法）与应用三个紧密关联的环节。从产业端观察，AI目前仍处于投入期，算力需求旺盛，而应用的落地与业绩兑现节奏已是历史最快。杨泠枫分析道，模型 const META     = {"update_time": "2026-05-18 15:09:14", "sentiment_score": 54.651162790697676, "agents": []};

// 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
