闪迪涨超4%，美光科技涨超3%，迈威尔科技、英特尔、POET、西部数据涨超2%，AMD、高通、ARM、康宁涨超1%。", "ctime": 1781165140, "time_str": "16:05:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260611/c677388318.shtml"}, {"id": "4511069", "title": "机构：若美伊全面冲突重燃，油价或飙升至150美元", "content": "瑞斯塔德能源公司地缘政治分析主管豪尔赫·莱昂表示，如果美国和伊朗完全恢复敌对状态，油价可能飙升至每桶150美元。现阶段，要分清楚当前的局势升级标志着敌对行动全面恢复，还是一起危险但仍可控的事件，还为时过早。因此，在更清晰的证据出现之前，无论是停火能够维持，还是外交渠道重获动力，油价波动率都可能持续处于高位。", "ctime": 1781165092, "time_str": "16:04:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260611/c677388260.shtml"}, {"id": "4511047", "title": "美股中概股盘前涨跌互现，亚玛芬体育涨4%", "content": "美股中概股盘前涨跌互现，亚玛芬体育涨4%，蔚来涨1%，网易涨0.4%，拼多多、携程、百度跌1%，京东跌2%，阿里巴巴跌4%。", "ctime": 1781164976, "time_str": "16:02:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260611/c677387824.shtml"}, {"id": "4511045", "title": "美股大型科技股盘前普涨，特斯拉涨1%", "content": "美股大型科技股盘前普涨，特斯拉涨1%，亚马逊、英伟达涨0.7%，Meta涨0.6%，苹果涨0.5%，谷歌A涨0.3%，微软涨0.1%。", "ctime": 1781164972, "time_str": "16:02:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260611/c677387806.shtml"}, {"id": "4511041", "title": "甲骨文美股盘前跌超9%", "content": "甲骨文美股盘前跌超9%，现报181.21美元。", "ctime": 1781164966, "time_str": "16:02:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260611/c677387777.shtml"}, {"id": "4510953", "title": "商务部：中国网文、网剧、网游在全球刮起“中国旋风”，成为文化出海新引擎", "content": "6月11日下午，商务部举行例行新闻发布会。有媒体提问称，今年1-4月，我国服务贸易出口增长了15%，其中个人文化和娱乐服务的增速高达39.5%，知识产权使用费也实现了20.8%的高速增长。请问服务贸易出口高速增长背后的主要驱动力是什么？今年以来我国在推动服务出口方面采取了哪些具体举措？\n\n对此，商务部新闻发言人何亚东表示，在政策支持和产业发展的驱动之下，中国服务的国际竞争力不断提升，特别是知识密集型服务出口实现了较快增长。数据显示，1-4月，我国服务出口达到了9850亿元，同比增长15%，其中知识密集型服务出口增长了11.7%，占总体服务出口的比重达到了55.2%。\n\n何亚东介绍说，知识密集型服务涵盖了知识产权、文化娱乐等领域。在知识产权领域，相关研究机构数据显示，我国创新药对外授权金额屡创新高，2025年全球市场占比超过了40%；在文化娱乐领域，中国的网文、网剧、网游这些数字文化产品在全球刮起了“中国旋风”，已经成为文化消费和文化出海的一个新引擎，“内容+平台+模式”出海步伐加快。(环球网)", "ctime": 1781164701, "time_str": "15:58:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260611/c677387107.shtml"}, {"id": "4510941", "title": "商务部：全面零关税举措助力中非共同发展", "content": "在今天召开的商务部例行新闻发布会上，新闻发言人何亚东介绍：中国于今年5月1日起，对53个非洲建交国，实施为期两年的全面零关税举措。同时，继续推动商签《共同发展经济伙伴关系协定》。商务部新闻发言人何亚东表示，这是中国坚定不移扩大高水平对外开放，落实中非合作论坛成果的重大举措。在单边主义和保护主义给非洲国家带来困难挑战的背景之下，中国发挥超大规模市场优势，主动开放市场，实现共同发展。举措实施以来，受到广大非洲国家的普遍欢迎和国际社会的高度赞赏。（央视新闻）", "ctime": 1781164571, "time_str": "15:56:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260611/c677387032.shtml"}, {"id": "4510929", "title": "阿里云Meoo CLI发布 本地AI编程项目可直接部署上线", "content": "6月11日，阿里云Meoo（秒悟）推出开源命令行工具Meoo CLI。安装后，Claude Code、Codex、Cursor等本地AI编程助手可通过该工具调用云端能力，完成数据库接入、用户登录、文件存储及项目发布，将本地项目推进到线上可用状态。(第一财经)", "ctime": 1781164338, "time_str": "15:52:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260611/c677386872.shtml"}, {"id": "4510927", "title": "美国对进口自中国的厢式半挂车及其组件作出反倾销初裁", "content": "据中国贸易救济信息网消息，2026年6月10日，美国商务部发布公告，对进口自中国的厢式半挂车及其组件（Van-Type Trailers and Subassemblies）作出反倾销初裁，初步裁定中国出口商/生产商的倾销幅度为130.86%（抵消补贴后的保证金调整为130.76%）。美国商务部预计将于2026年8月25日对进口自中国的厢式半挂车及其组件作出反倾销和反补贴终裁。本案主要涉及美国海关编码8716.39.0040项下产品。2026年1月21日，美国商务部对进口自加拿大、中国和墨西哥的厢式半挂车及其组件发起反倾销和反补贴调查。2026年5月27日，由于申请方撤回了对进口自加拿大涉案产品的反补贴申请，美国商务部终止了对加拿大涉案产品的反补贴调查。2026年6月2日，美国商务部对进口自中国和墨西哥的厢式半挂车及其组件作出反补贴初裁。", "ctime": 1781164319, "time_str": "15:51:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260611/c677386865.shtml"}, {"id": "4510925", "title": "希腊48小时救起近550名海上偷渡者", "content": "希腊官员10日通报，希腊海岸警卫队48小时内在克里特岛、加夫佐斯岛附近海域展开多轮救援行动，共救起近550名海上偷渡者。规模最大的一次救援行动9日在克里特岛南部海域展开。救援人员从一艘渔船上救下192名非法移民，包括42名未成年人，并将获救者送抵岸边。据这些偷渡者叙述，他们从利比亚出发，每人向蛇头支付约3000美元。（新华社）", "ctime": 1781164307, "time_str": "15:51:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260611/c677386857.shtml"}, {"id": "4510919", "title": "马斯克将在阿斯麦活动上发表视频讲话", "content": "埃隆·马斯克将于周四以线上形式出席芯片设备巨头阿斯麦举办的活动，讨论其Terafab超级芯片工厂计划。阿斯麦发言人在一份声明中表示：“马斯克将分享他对人工智能、机器人、太空和半导体制造的愿景。”阿斯麦将其年度一日技术大会描述为“仅限员工参加的内部活动”，并未透露马斯克何时发言。大会将于格林尼治标准时间周四下午15点（北京时间周四晚23点）左右结束。（新浪财经）", "ctime": 1781164258, "time_str": "15:50:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260611/c677386816.shtml"}, {"id": "4510911", "title": "韩国股市强制平仓数量攀升", "content": "据Global Markets Investor称，在近期韩国股市调整的过程当中，因追缴保证金而被强制抛售的股票约为3000亿韩元，按提供的汇率换算，约合1.97亿美元。Global Markets Investor称，这是有史以来最高的抛售量。 韩国金融投资协会11日发布的数据显示，6月9日，受托股票交易中实际追缴保证金金额与未结算应收账款之差总额达1698亿韩元，创历史新高。仅6月1日至9日，追缴保证金金额就已超过5500亿韩元。（券商中国）", "ctime": 1781164165, "time_str": "15:49:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260611/c677386750.shtml"}, {"id": "4510903", "title": "天顺风能：中标华能阳江海上风电项目约6亿元海工订单", "content": "天顺风能公告，公司海工板块全资子公司近期新中标华能阳江三山岛二海上风电项目海工导管架产品订单约6亿元人民币。该项目规划装机容量500MW，拟安装31台单机容量16.2MW固定式风力发电机组，公司中标其中19套导管架和16套小管桩产品。公告提示，本次中标订单受合同签署、落地执行等因素制约，对业绩影响存在不确定性，订单具体金额以实际签署合同为准。", "ctime": 1781164090, "time_str": "15:48:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260611/c677386701.shtml"}, {"id": "4510899", "title": "三晖电气：控股子公司签订1.92亿元日常经营合同", "content": "三晖电气公告，控股子公司深圳三晖能源科技有限公司与江苏洞志居建设工程有限公司签订储能电池设备采购合同，项目名称为元氏主力100MW/400MWh共享储能电站项目，合同金额为人民币1.92亿元。根据合同履行条件，合同履行将对本年度经营业绩产生积极影响。", "ctime": 1781164079, "time_str": "15:47:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260611/c677386695.shtml"}, {"id": "4510895", "title": "李书福卸任极氪董事长", "content": "近日，浙江极氪智能科技有限公司发生工商变更，李书福卸任董事长，安聪慧卸任法定代表人，由淦家阅接任法定代表人。该公司成立于2021年7月，注册资本130亿人民币，经营范围包括数据处理服务、数据处理和存储支持服务、互联网数据服务、大数据服务等，由Zeekr Technology Limited全资持股。", "ctime": 1781164074, "time_str": "15:47:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260611/c677386691.shtml"}, {"id": "4510879", "title": "商务部：将与新西兰外交贸易部继续用好联委会机制，进一步推动双边经贸合作", "content": "6月11日，商务部召开例行新闻发布会。商务部新闻发言人何亚东表示，6月5日，第34届中新经贸联委会在京召开，中新双方围绕深化双边经贸关系、加强区域和多边领域合作等议题深入交换意见。双方同意共同推进中新自贸协定服务贸易负面清单谈判，加强在亚太经合组织、世贸组织等区域和多边框架下的沟通协作，继续支持以规则为基础的多边贸易体制。\n\n下一步，商务部将与新西兰外交贸易部继续用好联委会机制，进一步推动双边经贸合作，推进区域和多边议程，为构建中新全面战略伙伴关系作出更大贡献。", "ctime": 1781163835, "time_str": "15:43:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260611/c677386577.shtml"}, {"id": "4510875", "title": "亚太药业：全资子公司雅泰利众拟以自有资金2000万元设立子公司", "content": "亚太药业公告，全资子公司浙江雅泰利众控股有限公司拟以自有资金2000万元设立子公司浙江盛曜光研药业有限公司。", "ctime": 1781163809, "time_str": "15:43:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260611/c677386556.shtml"}, {"id": "4510869", "title": "上海雅仕：全资子公司湖北雅仕实业控股有限公司涉及诉讼，涉案金额1.04亿元", "content": "上海雅仕公告，全资子公司湖北雅仕实业控股有限公司涉及诉讼，涉案金额1.04亿元，包括货款本金9925.29万元及逾期付款违约金暂计433.62万元。", "ctime": 1781163751, "time_str": "15:42:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260611/c677386522.shtml"}, {"id": "4510865", "title": "茅台董事长陈华：茅台依然具备强劲的发展韧性与增长潜力", "content": "6月11日，贵州茅台酒股份有限公司2025年度股东会召开。茅台集团党委书记、董事长陈华认为，未来，白酒行业将步入存量竞争的新阶段，产业集聚效应会进一步凸显，茅台依然具备强劲的发展韧性与增长潜力。他指出，从当前看，茅台依然是一家非常健康的公司，拥有“高毛利、高净利、高分红、低负债”的独特优势。从长期价值看，15.03平方公里的产区产能天花板和工艺复杂性，决定了茅台酒的稀缺性将长期保持，供需紧平衡的格局不会改变。而茅台酒“越陈越香”的独特特性，使其具备更强的跨周期抗风险能力。（酒业内参）", "ctime": 1781163745, "time_str": "15:42:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260611/c677386513.shtml"}, {"id": "4510857", "title": "天正电气：拟以7500万元-1.5亿元回购公司股份", "content": "天正电气公告，拟以7500万元-1.5亿元回购公司股份，回购价格不超过11.5元/股。", "ctime": 1781163572, "time_str": "15:39:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260611/c677386411.shtml"}, {"id": "4510855", "title": "中方取消与欧盟高层会晤？外交部：双方就相关对话保持着沟通", "content": "6月11日，外交部发言人林剑主持例行记者会。法新社记者提问，据《金融时报》报道，由于贸易紧张局势加剧，中国已取消了本月份与欧盟的高层会晤。发言人对此有何看法？此外，商务部部长王文涛是否仍会如报道中所述，在本月晚些时候访问欧盟？\n\n林剑表示，关于你提到的第一个问题，据目前我们了解，中欧双方就相关对话保持着沟通。你提到的第二个问题，建议向中方的主管部门询问。(澎湃新闻)", "ctime": 1781163561, "time_str": "15:39:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260611/c677386406.shtml"}, {"id": "4510833", "title": "百万Token只要几块钱，算力价格还在往下降", "content": "在大模型与各类AI应用加速迭代扩张的当下，头部企业凭借雄厚资本纷纷布局规模化算力集群，而众多中小AI创业主体自建算力设施，不仅前期投入大，还易造成算力资源的浪费。针对这一行业痛点，普惠化、可共享的算力超市在不少地方应运而生，让中小AI企业能够按需灵活取用算力资源。央视财经记者在一家算力超市了解到，他们目前提供两种类型产品，一种是针对算力的产品，一种是针对大模型Token的产品，两种产品采用不同的计费模式。负责人介绍：“算力租赁的产品，一张卡一小时是一种计费方式。第二种是包年包月，就是按Token计费，根据不同的模型，一般都是以百万Token为单位，百万Token大概是几块钱。按照现在的趋势来看，价格还在往下降。”记者了解到，这个算力超市的算力来自多个渠道，用户选好产品，超市负责匹配、调度和交付。此外，这家算力超市的负责人告诉记者，目前他们服务的用户80%都是中小企业，覆盖了教科文、电商、人工智能、机器人、具身智能等多个传统和新兴行业。（央视财经）", "ctime": 1781163341, "time_str": "15:35:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260611/c677386186.shtml"}, {"id": "4510829", "title": "美方称其查封的互联网域名被中国情报部门利用 外交部回应", "content": "外交部发言人林剑主持例行记者会。法新社记者提问，美国官方宣布查封13个互联网域名，称这些域名被中国情报部门用来从美方那些有安全审查权限的人那里获取信息，中方对此有何回应？“我不了解你提到的具体情况。”林剑表示，中方一贯反对没有事实依据炒作所谓“中国间谍”，对华污蔑抹黑。在全球范围大肆公然搞间谍活动和情报搜集的，恰恰是美国自己。 (澎湃新闻)", "ctime": 1781163303, "time_str": "15:35:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260611/c677386174.shtml"}, {"id": "4510825", "title": "首药控股：ALK抑制剂康特替尼颗粒获批上市", "content": "首药控股公告，公司完全自主研发的1类创新药康特替尼颗粒（CT-707，商品名：首要泽 ）获得国家药品监督管理局批准上市，该产品单药适用于既往未经过间变性淋巴瘤激酶（ALK）抑制剂治疗的ALK阳性的局部晚期或转移性非小细胞肺癌（NSCLC）患者的治疗。", "ctime": 1781163290, "time_str": "15:34:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260611/c677386162.shtml"}, {"id": "4510823", "title": "星环科技：拟发行不超过2458.35万股境外上市普通股", "content": "星环科技公告，公司于近日收到中国证监会出具的《关于星环信息科技（上海）股份有限公司境外发行上市备案通知书》。公司拟发行不超过2458.35万股境外上市普通股并在香港联合交易所上市。", "ctime": 1781163281, "time_str": "15:34:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260611/c677386160.shtml"}, {"id": "4510821", "title": "博瑞医药：BGM0504注射液减重适应症新药上市申请获得受理", "content": "博瑞医药公告，全资子公司博瑞制药（苏州）有限公司自主研发的BGM0504注射液减重适应症的新药上市申请（NDA），已获国家药品监督管理局（NMPA）药品审评中心（CDE）受理。BGM0504注射液是公司自主研发的GLP-1（胰高血糖素样肽-1）和GIP（葡萄糖依赖性促胰岛素多肽）受体双重激动剂，可有效激活两种受体的下游通路，产生控制血糖、减重和治疗代谢功能障碍相关脂肪性肝病（MASLD）等生物学效应，展现多种代谢疾病治疗潜力。", "ctime": 1781163272, "time_str": "15:34:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260611/c677386156.shtml"}, {"id": "4510817", "title": "AI数据中心用电猛 得州拟出台新规让企业承担电力配套成本", "content": "美国得克萨斯州州长格雷格 阿博特（Greg Abbott）计划加码对大型数据中心的监管，要求相关企业遵循“使用者付费”原则，自行承担电力配套设施建设成本，不得将相关费用转嫁给普通民众。据报道，当地时间6月10日，阿博特致函得州公共事业委员会（PUC）与得州电力可靠性委员会（ERCOT），要求各方尽快拟定方案、对接相关企业，并在7月17日前出台全新管理规则。按照新规思路，今后大型数据中心运营方需自行承担电网升级、电力设施建设的全部费用，以此减轻普通家庭及中小用电用户的压力。除供电问题外，阿博特还提出，数据中心需普及节水型冷却技术，降低水资源消耗、提升用水效率，同时当地还将重新评估现有税收优惠政策。目前得州每年为数据中心产业提供超10亿美元税收减免。", "ctime": 1781163141, "time_str": "15:32:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260611/c677385996.shtml"}, {"id": "4510809", "title": "外交部回应当前伊朗局势：军事手段解决不了根本问题", "content": "外交部发言人林剑主持例行记者会，有记者就当前伊朗局势提问。林剑表示，中方对当前的局势表示严重关切。军事手段解决不了根本问题，地区国家的主权安全和领土完整也都应得到尊重和维护。中方强烈敦促有关方立即停止军事行动，回归对话谈判，尽早实现全面持久停火。 (央视新闻)", "ctime": 1781163048, "time_str": "15:30:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260611/c677385963.shtml"}, {"id": "4510807", "title": "中方取消了与欧盟的会晤？外交部：中欧就相关对话保持着沟通", "content": "外交部发言人林剑主持例行记者会。法新社记者提问，据《金融时报》报道，由于贸易紧张局势加剧，中国已取消了本月份与欧盟的高层会晤。发言人对此有何评论？此外，商务部部长王文涛是否仍会如报道中所述，在本月晚些时候出访欧盟？林剑表示，关于你提到的第一个问题，据目前我们了解，中欧双方就相关对话保持着沟通。你提到的第二个问题，建议向中方的主管部门询问。（北京日报）", "ctime": 1781163038, "time_str": "15:30:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260611/c677385954.shtml"}, {"id": "4510793", "title": "国家数据局：2025年全国活跃数据总量同比增长28.46%", "content": "国家数据局政策和规划司副司长栾婕6月11日介绍，“数据要素×”三年行动计划实施两年多来，数据要素价值加快释放。国家数据局累计发布417个典型案例、11个行业领域的760个“数据要素×”典型场景指引，提前超额完成打造300个以上场景的目标。2025年，全国活跃数据总量为1.67泽字节（ZB），同比增长28.46%；企业数据产品和服务数量同比增长29.29%，交易额同比增长39.8%。（新华社）", "ctime": 1781162921, "time_str": "15:28:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260611/c677385863.shtml"}, {"id": "4510791", "title": "白宫计划再促防务巨头加速生产", "content": "白宫计划再次召集美国主要防务企业高管，商议加快武器装备生产。五角大楼近期施压各家防务承包商，按照今年早些时候敲定的多项长期协议进一步提速生产，包括将“爱国者”防空系统拦截弹产能提升两倍，将“萨德”反导系统拦截弹产能增加三倍，同时增产“战斧”巡航导弹和先进中程空对空导弹。（新华社）", "ctime": 1781162916, "time_str": "15:28:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260611/c677385856.shtml"}, {"id": "4510789", "title": "外交部：日本已经摘下所谓“和平国家”的面具", "content": "6月11日，外交部发言人林剑主持例行记者会。有记者提问，据报道，多名消息人士称，针对中国和巴基斯坦5月下旬发表的联合声明中提及反对军国主义卷土重来的图谋，日本政府表示日本坚守“专守防卫”方针作为和平国家的发展道路并未改变。请问中方对此有何评论？\n\n林剑表示，反对军国主义是国际社会不容撼动的共同意志。日本嘴上喊着“和平”“防卫”，行动上却朝着“再军事化”狂飙突进，持续大幅扩充军费，放宽杀伤性武器出口，推进部署中远程导弹，扩充进攻性军事力量，囤积大量敏感 _share": false, "source": "", "url": "https://news.10jqka.com.cn/20260611/c677385352.shtml"}];
const SECTORS  = [{"name": "金融", "hit_count": 37, "etfs": []}, {"name": "半导体", "hit_count": 28, "etfs": []}, {"name": "人工智能", "hit_count": 27, "etfs": []}, {"name": "数据要素", "hit_count": 20, "etfs": []}, {"name": "消费", "hit_count": 19, "etfs": []}, {"name": "军工", "hit_count": 12, "etfs": []}, {"name": "机器人", "hit_count": 10, "etfs": []}, {"name": "医药", "hit_count": 6, "etfs": []}];
const META     = {"update_time": "2026-06-11 16:19:56", "sentiment_score": 56.30434782608695, "agents": []};

// 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
