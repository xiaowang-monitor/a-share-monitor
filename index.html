 "福元医药：甲磺酸溴隐亭片获得药品注册证书，规格2.5mg", "content": "福元医药公告，公司近日收到国家药监局颁发的甲磺酸溴隐亭片《药品注册证书》，批准该药品生产，药品批准文号为国药准字H20265621。本次获得《药品注册证书》视同通过一致性评价，公司截至公告日累计研发投入为人民币840.22万元（未经审计）。", "ctime": 1787298469, "time_str": "15:47:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260821/c679171661.shtml"}, {"id": "5002601", "title": "三祥新材：2026年上半年净利润7700.99万元同比增长71.48%", "content": "三祥新材公告，2026年上半年营业收入5.63亿元，同比增长0.23%；归属于上市公司股东的净利润7700.99万元，同比增长71.48%，上年同期4490.79万元；归属于上市公司股东的扣除非经常性损益的净利润7398.83万元，同比增长65.33%，上年同期4475.12万元。", "ctime": 1787298416, "time_str": "15:46:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260821/c679171569.shtml"}, {"id": "5002599", "title": "美财长喊话中国一道对伊朗进行经济施压，外交部回应", "content": "8月21日，外交部发言人林剑主持例行记者会。有记者提问，美国财政部长贝森特昨天在接受美国媒体采访时，称中国从伊朗购买了创纪录的原油，并敦促中国与美国一道对伊朗进行经济施压。外交部对此有何回应？林剑表示，我们昨天已就此作出回应。我愿重申，中方反对没有国际法依据、未经联合国安理会授权的非法单边制裁，呼吁相关各方采取负责任举措，通过政治外交途径解决问题。（澎湃新闻）", "ctime": 1787298368, "time_str": "15:46:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260821/c679171549.shtml"}, {"id": "5002589", "title": "浙大网新：2026年上半年亏损-5947.94万元", "content": "浙大网新公告，2026年上半年营业收入14.72亿元，同比-5.91%；归属于上市公司股东的净利润-5947.94万元，上年同期-1506.94万元；归属于上市公司股东的扣除非经常性损益的净利润-4158.26万元，上年同期-4947.87万元。", "ctime": 1787298262, "time_str": "15:44:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260821/c679171518.shtml"}, {"id": "5002561", "title": "天津港：2026年上半年净利润同比增34.54%", "content": "天津港公告，2026年上半年营业收入53.64亿元，同比增减-13.18%；归属于上市公司股东的净利润6.77亿元，同比增长34.54%，上年同期为5.03亿元；归属于上市公司股东的扣除非经常性损益的净利润6.74亿元，同比增长26.05%。", "ctime": 1787298060, "time_str": "15:41:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260821/c679171398.shtml"}, {"id": "5002555", "title": "我国牵头固态电池首项国际标准正式立项 推动新能源产业快速发展", "content": "记者今天从国家标准委了解到，由我国提出的国际标准提案《电动汽车驱动用二次锂离子电池 固态电池应用指南、测试项目及条件》近日在国际电工委员会成功立项。该标准是固态电池领域全球首个国际标准。固态电池被视为下一代锂离子电池重要发展方向。相比传统液态电池，它续航更长、安全性更高，性能也更稳定。这项国际标准依托我国固态电池研发积累，将清晰界定固态电池的测试规范。该国际标准将使未来全球车企在研发和生产固态电池时拥有统一的“标尺”，有助于加速更安全、长续航的电动车走进千家万户，推动新能源产业快速发展。该标准由我国牵头提出，法国、韩国、日本等多国专家参与研制。该标准的制定有利于向全球分享我国先进电池技术理念，为全球电池产业技术升级和能源转型贡献更多中国力量。（央视新闻）", "ctime": 1787297960, "time_str": "15:39:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260821/c679171353.shtml"}, {"id": "5002549", "title": "巴基斯坦俾路支省发生爆炸事件 4人死亡", "content": "记者获悉，当地时间8月21日，巴基斯坦俾路支省马斯通发生一起爆炸事件。警方证实爆炸造成4人死亡，另有数人受伤。\n\n目前，当地警方和安全部门已经封锁现场并展开搜查，爆炸原因仍在调查中。(央视新闻)", "ctime": 1787297894, "time_str": "15:38:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260821/c679171323.shtml"}, {"id": "5002539", "title": "中马传动：2026年上半年净利1311.73万元", "content": "中马传动公告，2026年上半年营业收入4.4亿元，同比增减-0.47%；归属于上市公司股东的净利润1311.73万元，同比增长12.59%，上年同期为1165.07万元；扣非净利润1293.12万元，同比增长6.13%。利润分配预案为不分配不转增。", "ctime": 1787297835, "time_str": "15:37:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260821/c679171299.shtml"}, {"id": "5002531", "title": "外交部：敦促日本以实际行动为中日正常交流创造必要条件", "content": "8月21日，外交部发言人林剑主持例行记者会。有记者提问，据报道，日本朝野政党国会议员计划下周访华，表示日中关系现状不符合任何一方利益，希望为推动两国关系改善发挥作用。中方对此有何评论?\n\n林剑表示，我们注意到，日本朝野政党一些有识之士对当前中日关系深感忧虑，希望为双边关系走上正确轨道作出努力。我们敦促日本当政者倾听、重视这些声音，恪守中日四个政治文件的各项原则，以实际行动为中日正常交流创造必要条件。(央视新闻)", "ctime": 1787297749, "time_str": "15:35:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260821/c679171260.shtml"}, {"id": "5002519", "title": "威龙股份：副总经理徐维峰于2026年8月20日辞职", "content": "威龙股份公告，公司董事会收到副总经理徐维峰因个人原因提交的书面辞职报告，其辞职自送达董事会之日起生效，辞职后不再担任公司任何职务，辞职不会影响公司的正常生产经营。", "ctime": 1787297633, "time_str": "15:33:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260821/c679171193.shtml"}, {"id": "5002517", "title": "美俄接连批评联大主席贝尔伯克", "content": "俄罗斯和美国指责联合国大会主席安娜莱娜·贝尔伯克在遴选下一任联合国秘书长的过程中“越权”。俄罗斯常驻联合国代表瓦西里·涅边贾在纽约说，俄罗斯对“大会主席试图赋予自己的角色”感到担忧。他的这番言论呼应了美方前一天对贝尔伯克的批评。此事涉及贝尔伯克在联合国秘书长古特雷斯继任者的遴选过程中扮演的角色。这位德国绿党政治人物曾多次表示，她致力于确保遴选过程“透明、包容、有条理、及时并且有公信力”。（参考消息）", "ctime": 1787297632, "time_str": "15:33:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260821/c679171192.shtml"}, {"id": "5002513", "title": "中国国贸：2026年半年度净利润6.33亿元，同比增长0.17%", "content": "中国国贸公告，2026年半年度实现营业总收入18.16亿元，同比变动-3.90%；归属于上市公司股东的净利润6.33亿元，同比增长0.17%，上年同期为6.32亿元；扣除非经常性损益的净利润6.28亿元，同比变动-0.11%。上述财务数据未经审计。", "ctime": 1787297582, "time_str": "15:33:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260821/c679171144.shtml"}, {"id": "5002505", "title": "朝鲜昨日发射弹道导弹 外交部回应", "content": "外交部发言人林剑主持例行记者会。韩联社记者提问，昨天朝鲜向东部海域发射10余枚弹道导弹，此次是今年的第十二次发射，也是三年以来最大规模的发射。中方对此有何评论？“我们注意到相关报道，对此没有新的评论。”林剑说。（北京日报）", "ctime": 1787297466, "time_str": "15:31:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260821/c679171088.shtml"}, {"id": "5002465", "title": "美对伊朗施压 外交部：军事手段和制裁施压无助于解决问题", "content": "外交部发言人林剑8月21日主持例行记者会。有记者就美对伊朗施压提问。林剑表示，中方始终认为，军事手段和制裁施压无助于解决问题，只会加剧紧张，升级局势不符合任何一方利益。我们呼吁通过对话协商化解矛盾分歧。 (央视新闻)", "ctime": 1787297294, "time_str": "15:28:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260821/c679170989.shtml"}, {"id": "5002441", "title": "厄尔尼诺扰乱中美洲降雨 巴拿马运河宣布减少船舶通行数量", "content": "由于厄尔尼诺现象加剧导致降雨量不足，巴拿马运河管理局将从9月起限制每日船舶通行数量。巴拿马运河管理局周四宣布，首批限航措施将于9月3日开始实施，每日通行船舶数量将从目前的36艘减 // 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
