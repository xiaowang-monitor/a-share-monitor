43376, "time_str": "15:49:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260331/c675662530.shtml"}, {"id": "4167267", "title": "万辰集团：重新向香港联交所递交H股发行并上市申请", "content": "万辰集团公告，公司已于2026年3月30日向香港联交所重新递交了发行境外上市股份（H股）并在香港联交所主板挂牌上市的申请，并于同日在香港联交所网站刊登了本次发行上市的申请资料。该申请资料为草拟版本，其所载资料可能会适时作出更新及修订。", "ctime": 1774943236, "time_str": "15:47:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260331/c675662410.shtml"}, {"id": "4167247", "title": "欧洲议会一代表团访华 外交部：将推动中欧立法机构交流合作", "content": "3月31日，外交部发言人毛宁主持例行记者会。有记者就欧洲议会代表团将于3月31日至4月2日期间前往北京和上海提问。毛宁表示，立法机构交往是中欧关系的重要组成。据我们了解，应中国全国人大常委会法制工作委员会的邀请，欧洲议会内部市场和消费者保护委员会的代表团从今天开始访华，相信此访将推动中欧立法机构的交流合作，增进欧洲议会对华了解和认知，促进中欧关系健康稳定发展。(央视新闻)", "ctime": 1774943006, "time_str": "15:43:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260331/c675662049.shtml"}, {"id": "4167219", "title": "以军称伊朗发射携带集束弹头的导弹 伊朗方面暂无回应", "content": "当地时间3月31日，以色列国防军探测到伊朗向以色列中部地区发射一枚弹道导弹，以色列中部地区多地拉响防空警报。据以色列国防军初步评估，伊朗向以色列中部发射的弹道导弹携带了一枚集束炸弹弹头，弹药在大范围区域散落，多地区报告有爆炸物落点，造成车辆起火。以色列方面表示，截至目前，袭击已造成6人受伤。伊朗方面对此暂无回应。（央视新闻）", "ctime": 1774942330, "time_str": "15:32:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260331/c675661742.shtml"}, {"id": "4167207", "title": "工信部NVDB提示：防范OpenClaw仿冒下载网站和安装文件", "content": "网络安全威胁和漏洞信息共享平台消息，近日，工业和信息化部网络安全威胁和漏洞信息共享平台（NVDB）监测发现，有攻击组织利用OpenClaw（俗称“龙虾”）热度，仿冒OpenClaw下载网站和安装文件，诱导用户下载包含恶意程序的安装文件。一旦用户运行包含恶意程序的安装文件后，该文件将在终端设备中隐蔽加载恶意程序，释放并植入远程控制木马，可能造成网络攻击、系统受控、信息泄露等后果。目前，监测发现的仿冒域名包括：ai-openclaw.com.cn、web-openclaw.com.cn，恶意安装包名称包括：openclaw.zip、openclawAI7beAolenc.zip、openclaw.exe、opealeAi_7beAole-x64.exe等。建议用户要通过可信渠道下载安装OpenClaw及其技能插件，谨慎点击不明链接，防范网络攻击风险。(界面)", "ctime": 1774942231, "time_str": "15:30:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260331/c675661713.shtml"}, {"id": "4167203", "title": "阿联酋迪拜传出爆炸声", "content": "总台记者获悉，当地时间3月31日，阿联酋迪拜传出至少3声爆炸声。(央视新闻)", "ctime": 1774942194, "time_str": "15:29:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260331/c675661684.shtml"}, {"id": "4167197", "title": "机构：AI服务器需求支撑2026年第二季度存储器合约价上行 CSP借长期协议锁定供货", "content": "根据TrendForce集邦咨询最新存储器价格调查，2026年第二季因DRAM原厂积极将产能转向HBM、Server应用，并采用“补涨”策略拉近各类产品价差，尽管终端市场面临出货下修风险，预估整体一般型DRAM(Conventional DRAM)合约价格仍将季增58-63%。NAND Flash市场持续由AI、数据中心需求主导，全产品线连锁涨价的效应不减，预计第二季整体合约价格将季增70-75%。（科创板日报）", "ctime": 1774941961, "time_str": "15:26:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260331/c675661604.shtml"}, {"id": "4167183", "title": "外交部：近日中方有三艘船舶过航霍尔木兹海峡", "content": "外交部发言人毛宁31日在例行记者会上答问时说，经同有关方面协调，近日中方有三艘船舶过航霍尔木兹海峡，我们对有关方面提供的协助表示感谢。霍尔木兹海峡及其附近水域是重要的国际货物和能源贸易通道，中方呼吁尽快停火止战，恢复海湾地区和平稳定。(新华社)", "ctime": 1774941848, "time_str": "15:24:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260331/c675661539.shtml"}, {"id": "4167179", "title": "巴基斯坦外长再度访华，外交部：双方将就伊朗局势加强战略沟通协调", "content": "3月31日，外交部发言人毛宁主持例行记者会。澎湃新闻记者提问，中方发布了巴基斯坦副总理兼外长达尔来华的消息，这是达尔副总理兼外长3个月内再次来华，请问此次来华是否同近期伊朗局势有关?毛宁表示，中国和巴基斯坦是相互信任、相互支持的全天候战略合作伙伴，两国在重大国际地区问题上立场相近、沟通紧密。“相信两国外长将就伊朗局势等共同关心的国际地区问题，加强战略沟通协调，共同发出和平正义之声，为劝和止战，维护地区和平稳定作出新的努力。”（澎湃新闻）", "ctime": 1774941761, "time_str": "15:22:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260331/c675661506.shtml"}, {"id": "4167175", "title": "外交部：中方对伊朗文物古迹在战争中遭受破坏深感痛惜", "content": "外交部发言人毛宁31日在例行记者会上答问时表示，世界文化遗产是全人类的宝贵财富。中方对伊朗的文物古迹在战争中遭受破坏深感痛惜，敦促交战各方特别是美国和以色列立即全面停止军事行动，尽快启动对话谈判，尽早结束这场本不应该发生的战争。(新华社)", "ctime" 要文章《树立和践行正确政绩观》", "content": "4月1日出版的第7期《求是》杂志将发表中共中央总书记、国家主席、中央军委主席习近平的重要文章《树立和践行正确政绩观》。这是习近平总书记2012年12月至2026年2月期间有关重要论述的节录。 文章强调，政绩观问题是一个根本性问题，关乎立党为公、执政为民。只有不断以良好政绩推动党和国家事业发展、造福人民，才能践行好党的宗旨，也才能完成好党的历史使命。要坚持从实际出发、按规律办事，通过科学决策和实干苦干，创造经得起实践和历史检验、真正造福人民、得到群众公认的业绩。 文章指出，树立和践行正确政绩观，起决定性作用的是党性。衡量党性强弱的根本尺子是公、私二字。(新华社)", "ctime": 1774940454, "time_str": "15:00:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260331/c675660522.shtml"}, {"id": "4167029", "title": "股指期货午盘收盘 主力合约全线收跌", "content": "股指期货午盘收盘，主力合约全线收跌。沪深300股指期货(IF)主力合约跌0.77%，上证50股指期货(IH)主力合约跌0.33%，中证500股指期货(IC)主力合约跌1.73%，中证1000股指期货(IM)主力合约跌1.69%。", "ctime": 1774940434, "time_str": "15:00:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260331/c675660518.shtml"}, {"id": "4166987", "title": "广期所碳酸锂主力合约大跌8%", "content": "广期所碳酸锂主力合约大跌8%，报157000元/吨。", "ctime": 1774940298, "time_str": "14:58:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260331/c675660491.shtml"}, {"id": "4166945", "title": "张雪机车销售称夺冠后两三天内订单大涨 已排至6月", "content": "在世界超级摩托车锦标赛（WSBK）葡萄牙站SSP组别比赛中，张雪机车820RR-RS赛车获得冠军，这是中国摩托车制造商在SSP组别历史上的首次胜利。有张雪机车的销售人员告诉记者，从夺冠到现在的这两三天时间里，购车订单已经被排到了今年6月。（红星新闻）", "ctime": 1774939766, "time_str": "14:49:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260331/c675660338.shtml"}, {"id": "4166941", "title": "“氢能产业链核心材料产业化攻关平台”启动 打造氢能产业创新策源地", "content": "3月31日，由广州市氢燃料电池产业创新联合体牵头打造的“国家氢能产业链安全能力建设—核心材料与装备中试验证及产业化攻关平台”在广州开工建设。该产业攻关平台将重点围绕氢能产业链的核心材料与关键装备，建设集“中试验证、检测认证、技术攻关、产业孵化”于一体的综合性能力中心，打通从实验室研发到产业化应用的“最后一公里”，加速形成具有自主知识产权的氢能装备制造体系。未来，联合体将依托攻关平台，全力推动全产业链降本增效，确保到2028年氢能重卡全生命周期成本实现市场化。（人民财讯）", "ctime": 1774939699, "time_str": "14:48:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_shar     el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
