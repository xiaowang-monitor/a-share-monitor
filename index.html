4.9999994%。", "ctime": 1790077599, "time_str": "19:46:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260922/c680181010.shtml"}, {"id": "5225317", "title": "四川力争2030年核产业规模突破2000亿元", "content": "9月22日，在四川省绵阳市举行的2026核技术应用暨核医疗产业创新发展大会上，四川省发布涉及核科技与产业高质量发展、可控核聚变产业中长期发展规划、核医疗产业发展“十五五”规划等一系列文件，其中提出到2030年全省核产业规模突破2000亿元。四川是核工业与核技术利用大省，目前已构建起“核素—核药—核医疗装备—临床应用”全产业链。“我们探索了‘创新平台遴选转化+科创投公司投早投小’成果转化模式，已在绵阳转化核医疗科研成果52项、实现投产27项，7个产品获批国省首台套（首批次）产品。”绵阳科技城管委会副主任韩晓清说。系列文件提出，到2030年，四川将培育2家以上百亿级龙头企业，核医疗产业直接经济产值突破300亿元；围绕核聚变能，加快关键核心技术攻关和非发电场景示范应用，建设国内一流的可控核聚变产业聚集区。（新华社）", "ctime": 1790077338, "time_str": "19:42:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260922/c680180691.shtml"}, {"id": "5225309", "title": "艾艾精工：主营业务未发生重大变化", "content": "艾艾精工公告，公司股票于2026年9月18日、21日、22日连续三个交易日内日收盘价格涨幅偏离值累计达到20%。经核查，公司生产经营正常，主营业务未发生重大变化，未发现应披露未披露的重大信息、媒体报道、市场传闻或热点概念；公司最新滚动市盈率为254.84倍，高于行业最近一个月平均滚动市盈率27.45倍。", "ctime": 1790077313, "time_str": "19:41:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260922/c680180682.shtml"}, {"id": "5225291", "title": "奥佳华：股票异动涉及拟向上海峄昕转让6237.39万股", "content": "奥佳华公告，公司股票于2026年9月21日、2026年9月22日连续两个交易日收盘价涨幅偏离值累计超过20%。公司此前披露，控股股东邹剑寒先生、李五令先生及股东魏罡先生拟合计向上海峄昕转让6237.39万股，约占公司总股本的10.000%，相关转让尚需审核及办理过户登记，最终实施结果存在不确定性；相关方拟签订补充协议。公司生产经营情况正常，健康服务机器人相关业务尚处于探索阶段。", "ctime": 1790077177, "time_str": "19:39:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260922/c680180359.shtml"}, {"id": "5225283", "title": "泉阳泉：拟正式挂牌转让园区园林100%股权", "content": "泉阳泉公告，公司此前披露拟预挂牌公开转让苏州工业园区园林绿化工程有限公司100%股权。本次公司董事会审议通过正式公开挂牌转让方案，拟将股权拆分为51%、30%、19%三部分挂牌，挂牌底价总额为3.21亿元；相关事项已获国资监管单位批准并完成国有资产评估备案，尚需提交2026年第三次临时股东会审议。", "ctime": 1790077150, "time_str": "19:39:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260922/c680180354.shtml"}, {"id": "5225275", "title": "长三角前8个月出口机器人160亿元", "content": "上海海关9月22日公布，今年前8个月，长三角区域出口手术机器人、智能仿生机器人、清洁机器人、工业机器人等四类机器人货值160亿元人民币，比去年同期猛增3倍。机器人是长三角出口快速增长的一个缩影。海关统计显示，前8个月，长三角出口机电产品5.35万亿元，占长三角同期出口总额的64.2%，同比增长26.6%。其中，集成电路出口7304.4亿元，同比增长1倍；船舶出口1813.7亿元，同比增长30.8%；汽车出口4344.9亿元，同比增长66.8%；高端装备出口4926.4亿元，增长22%。（新华社）", "ctime": 1790077057, "time_str": "19:37:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260922/c680180315.shtml"}, {"id": "5225273", "title": "*ST棒杰：控股子公司诉讼进入执行，涉案4833.05万元", "content": "*ST棒杰公告，公司此前因控股子公司棒杰新能源贷款违约涉及重大诉讼，并已与中国农业银行股份有限公司苏州工业园区支行达成调解。近日案件进入执行阶段，法院裁定冻结、扣划公司及相关子公司银行存款人民币4833.05万元，并冻结棒杰新能源对公司享有的应收债权，以4821.48万元为限。", "ctime": 1790077056, "time_str": "19:37:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260922/c680180314.shtml"}, {"id": "5225257", "title": "自然资源部：推动发展动力从“土地财政”转向“时空经济”", "content": "自然资源部副部长庄少勤22日表示，随着城乡发展进入存量阶段，国土空间规划要开辟存量增长新空间，推动发展动力从原来的“土地财政”转向高质量的“时空经济”。庄少勤在国新办“开局起步‘十五五’”系列主题新闻发布会上说，我国城乡发展已进入存量为主阶段，传统增量政策难以适应新形势。生态文明时代的国土空间规划要开辟存量增长新空间、培育内涵式发展新动能，持续深化“多规合一”改革，出台城市更新、产业发展新政策新标准，从安全、协调、集约、特色、共享等维度拓展空间价值，引导各地挖掘特色资源、盘活空间资产、优化功能结构，打造创新产业社区、商务社区与高品质生活圈，推动发展动力从原来的“土地财政”转向高质量的“时空经济”。（新华社）", "ctime": 1790076960, "time_str": "19:36:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260922/c680180287.shtml"}, {"id": "5225249", "title": "盟科药业：股东Best Idea及JSR等拟合计减持不超6%股份", "content": "盟科药业公告，公司股东BestIdea计划减持不超过1968.69万股，占总股本3%；股东JSR及GPTMT作为一致行动人，计划合计减持不超过1966.82万股，占总股本3%。", "ctime": 1790076928, "time_str": "19:35:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260922/c680180270.shtml"}, {"id": "5225243", "title": "李强在上海调研时强调 加快培育壮大新兴产业和未来产业 持续做大做强先进制造业", "content": "中共中央政治局常委、国务院总理李强9月22日在上海调研。他强调，要深入贯彻落实习近平总书记关于发展先进制造业的重要指示和全国先进制造业大会精神，坚持智能化、绿色化、融合化方向，推进科技创新和产业创新深度融合，大力发展新一代智能制造，加快培育壮大新兴产业和未来产业，持续做大做强先进制造业。 (新华社)", "ctime": 1790076917, "time_str": "19:35:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260922/c680180265.shtml"}, {"id": "5225207", "title": "朗高科技创业板IPO审核状态变更为“上市委会议通过”", "content": "苏州朗高电机科技股份有限公司创业板IPO审核状态变更为“上市委会议通过”，保荐机构为华泰联合。", "ctime": 1790076708, "time_str": "19:31:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260922/c680180014.shtml"}, {"id": "5225203", "title": "美国《连线》杂志创始主编、《失控》作者凯文·凯利表示，至少未来十年不会出现真正意义上的通用人工智能（AGI）", "content": "美国《连线》杂志创始主编、《失控》作者凯文·凯利表示，至少未来十年不会出现真正意义上的通用人工智能（AGI）。（财联社）", "ctime": 1790076690, "time_str": "19:31:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260922/c680180009.shtml"}, {"id": "5225145", "title": "行云科技：签署3份算力服务合同，金额4.53亿元", "content": "行云科技公告，公司此前与某国资供应商签署共128套高端算力服务器及配套算力服务的总框架性采购协议。近日，公司签署3份《算力服务合同》，购买GPU算力服务合计43套，服务期限均为5年，三份合同含税总金额合计4.53亿元。", "ctime": 1790076574, "time_str": "19:29:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260922/c680179889.shtml"}, {"id": "5225131", "title": "2026年中国制造宣传周启动", "content": "2026年中国制造宣传周启动活动9月22日在北京举行。本次宣传周以“先进制造 奋楫向新”为主题，于9月22日至28日在全国范围内开展。制造业是立国之本、强国之基。工业和信息化部总经济师高东升在启动活动上说，本次宣传周旨在集中展示我国先进制造业发展取得的成就，生动展现有关方面加快发展先进制造业的创新实践，持续擦亮“中国制造”品牌，凝聚全社会关心制造业、支持制造业、投身制造业的强大合力。本次宣传周由工业和信息化部新闻宣传中心、中国电子信息产业发展研究院、各地工业和信息化主管部门等联合举办，采取“1+30”组织模式，即在北京举办1场线下启动活动，联动30个省份同步开展主题宣传、成果展示和互动传播活动。（新华社）", "ctime": 1790076398, "time_str": "19:26:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260922/c680179843.shtml"}, {"id": "5225127", "title": "润泽科技：宁波大容减持计划期限届满，实际减持0.9678%", "content": "润泽科技公告，宁波大容此前拟于2026年6月24日至2026年9月21日通过集中竞价交易减持不超过1623.07万股。减持计划期限已届满，宁波大容实际减持1588.24万股，占总股本0.9678%，占扣除回购专用账户后总股本0.9745%，减持均价67.27元/股；减持后持有1780.68万股，占总股本1.0851%。", "ctime": 1790076359, "time_str": "19:25:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260922/c680179826.shtml"}, {"id": "5225125", "title": "曦智科技在云栖大会首发3.2T/6.4T SNPO硅光芯片", "content": "在2026云栖大会期间，曦智科技首发3.2T/6.4T SNPO（Scale-up NPO）硅光芯片，该芯片符合由阿里巴巴与ODCC牵头发起的NPO规范。本届云栖大会，阿里云发布了基于SNPO互连架构的磐久超节点服务器定义的光互连方案，接口设计兼容112G/224G SerDes并支持向448G演进。而曦智科技首发的3.2T/6.4T SNPO硅光芯片，集收发一体，在单芯片上实现了16路独立53/106Gbaud调制器通道，和16路独立53/106Gbaud探测器通道，调制器与探测器带宽均超过55GHz。（科创板日报）", "ctime": 1790076359, "time_str": "19:25:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260922/c680179827.shtml"}, {"id": "5225115", "title": "纽约市长再称内塔尼亚胡是战犯", "content": "以色列总理内塔尼亚胡将于9月23日启程前往美国纽约出席联合国大会会议。而就在内塔尼亚胡启程前，纽约市长马姆达尼在9月22日播出的采访中，再度称内塔尼亚胡是战犯，策划了针对巴勒斯坦人民骇人的种族灭绝。马姆达尼此前曾多次公开称“内塔尼亚胡是战犯，应该被送往海牙国际刑事法院”。今年7月，他还曾表示，如果内塔尼亚胡赴纽约出席联大会议，纽约市政府“可能会逮捕他”。但是几天后，他又称纽约市政府“没有独立的法律授权来执行国际刑事法院的逮捕令”，呼吁美国联邦政府与国际刑事法院合作，执行对内塔尼亚胡的逮捕令。有媒体注意到，内塔尼亚胡本次访美行程“十分短暂”，按照目前的计划，可能只在纽约停留几个小时，并将在联合国大会发表讲话后立即返回以色列。（央视新闻）", "ctime": 1790076350, "time_str": "19:25:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260922/c680179824.shtml"}, {"id": "5225049", "title": "伊朗外长阿拉格齐抵纽约发声", "content": "伊朗外交部长阿拉格齐抵达纽约发表声明称，此次访问是在美以发动懦弱战争及后续事态发展后展开，当前实际仍处于战争状态。他表示，伊朗的首要目标是在联合国这一核心国际平台，捍卫伊朗人民的合法性、权利与利益。他指出，伊朗总统佩泽希齐扬将在联大发表讲话，与各界人士会面并接受媒体采访，同时计划举行多场双边会晤，伊朗也将借此密集日程审视双边关系、阐明立场并维护国家利益。（新浪财经）", "ctime": 1790075783, "time_str": "19:16:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260922/c680179683.shtml"}, {"id": "5225019", "title": "“十五五”时期我国将推动北斗产业规模突破1万亿元", "content": "记者从国家发展改革委今天举行的新闻发布会上了解到，“十五五”时期，我国将推动北斗产业规模五年内突破1万亿元，实现北斗规模应用市场化、产业化、国际化新突破。国家发展改革委新闻发言人李超介绍，“十五五”时期，我国将推进高端芯片、关键零部件、融合算法等关键核心技术攻关，加强北斗与人工智能、卫星互联网等技术融合创新，推动卫星导航基础设施布局更加合理，培育壮大优质企业，筑牢安全可靠的时空底座。同时，加快推动《中华人民共和国卫星导航条例》出台实施，持续推动技术交流、人才培育、联合示范等务实合作项目落地，积极参与卫星导航全球治理，让北斗产品和服务造福更多国家、惠及更多人民，助力全球经济发展和民生改善。\n\n目前，我国北斗产业总体产值已突破6290亿元，国内北斗产业企事业单位达到3万多家，从业人员超200万人，应用场景和规模不断扩大。全国超过1200万辆营运车辆搭载北斗系统，高精度车道级导航覆盖99%以上的城乡道路，全国已有超过350万台套北斗终端设备应用于农机辅助驾驶、农机作业、无人机植保等场景。北斗相关产品已出口至全球140余个国家和地区，深度融入共建“一带一路”合作体系，为有关国家提供基础设施安全监测、自然灾害预警、重大工程测绘等服务，持续造福全球。（央视新闻）", "ctime": 1790075716, "time_str": "19:15:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260922/c680179670.shtml"}, {"id": "5224983", "title": "美国国务卿鲁比奥：认为特朗普与伊朗总统之间未安排任何会面。（新浪财经）", "content": "美国国务卿鲁比奥：认为特朗普与伊朗总统之间未安排任何会面。（新浪财经）", "ctime": 1790075472, "time_str": "19:11:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260922/c680179595.shtml"}, {"id": "5224945", "title": "印度与欧佩克共商能源安全与市场稳定", "content": "印度与石油输出国组织（OPEC）在第七届OPEC-印度能源对话高层会议上，就石油市场稳定与能源安全议题展开磋商。印度石油部声明称，会议同时聚焦市场前景，以及石油行业开展充足、及时投资的重要性。本次周二在新德里举行的会谈由印度石油部长哈迪普·辛格·普里与OPEC秘书长海赛姆·盖斯共同主持。普里表示，未来数十年印度仍将是全球能源需求的重要拉动力量，OPEC与印度需紧密协作，推动全球能源市场实现平衡、稳定与可预期。盖斯称，印度的诸多能源优先事项与OPEC的优先事项高度重合。（新浪财经）", "ctime": 1790075263, "time_str": "19:07:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260922/c680179450.shtml"}, {"id": "5224921", "title": "消息人士：胡塞武装在伊拉克拥有重要安全和政治存在", "content": "消息人士称，胡塞武装在伊拉克拥有重要的安全和政治存在。胡塞武装在伊拉克的活动与当地武装派别及黎巴嫩真主党协调进行。伊朗伊斯兰革命卫队代表哈吉·哈米德负责协调胡塞武装在伊拉克的活动。今年7月，多名胡塞武装指挥官在美国对迪亚拉省发动的空袭中身亡。(新浪财经)", "ctime": 1790075199, "time_str": "19:06:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260922/c680179374.shtml"}, {"id": "5224865", "title": "海南瑞泽：冯活灵拟减持公司不超过0.96%股份", "content": "海南瑞泽公告，海南省第一中级人民法院拟于2026年9月24日至2026年12月18日，以集中竞价方式强制变卖股东冯活灵名下1100万股公司股份，占总股本0.96%，因金融借款合同纠纷，减持价格按减持时的市场价格确定。本次变卖若全部完成，公司实际控制人及其一致行动人持股比例将由21.39%降至20.43%，不会导致实际控制人变更。", "ctime": 1790075014, "time_str": "19:03:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260922/c680179292.shtml"}, {"id": "5224857", "title": "巴西央行：紧缩政策拖累经济，货币政策仍需保持紧缩", "content": "巴西央行表示，已有迹象显示紧缩政策正逐步拖累经济，但货币政策必须继续保持紧缩。（新浪财经）", "ctime": 1790074996, "time_str": "19:03:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260922/c680179260.shtml"}, {"id": "5224661", "title": "华仁药业：公司基本面及内外部经营环境未发生重大变化", "content": "华仁药业公告，公司股票于2026年9月21日、2026年9月22日连续两个交易日收盘价格涨幅偏离值累计超过30%，构成股票交易异常波动。近期公司股票短期涨幅较大、换手率较高，存在市场情绪过热情形；公司股票最新滚动市盈率为负值，显著偏离医药制造业最新滚动市盈率26.98倍，公司基本面及内外部经营环境未发生重大变化。", "ctime": 1790074788, "time_str": "18:59:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260922/c680179132.shtml"}, {"id": "5224637", "title": "安德利：执行董事王萌增持38万股H股", "content": "安德利公告，执行董事王萌于二零二六年九月二十二日以每股约20.55港元的平均价，以个人名义购入38万股公司H股。增持后，王萌被视为拥有公司1.43亿股A股权益及927.45万股H股权益，分别占已发行总股本43.73%及2.83%，并不排除未来进一步增持的可能性。", "ctime": 1790074701, "time_str": "18:58:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260922/c680179083.shtml"}, {"id": "5224593", "title": "闽东电力：业绩下滑且热点业务尚未商业化", "content": "闽东电力公告，公司股票连续10个交易日内涨幅偏离值累计达到100.02%，股价自2026年9月9日以来从10.43元/股上涨至9月22日20.91元/股。公司基本面未发生重大变化，2026年上半年营业收入2.37亿元，同比下降17.65%；归母净利润2941.47万元，同比下降58.68%。公司未开展算电协同、绿电直连、智能电网业务，虚拟电厂尚未商业化运营，海上风电项目尚未形成收入。", "ctime": 1790074540, "time_str": "18:55:40", "stock_code": "", "stock_name": "", "stoc // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

      <span class="text-xs text-gray-400">${item.mentions}次提及</span>

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {

      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
