jqka.com.cn/20260508/c676541080.shtml"}, {"id": "4339237", "title": "四川：修订省促进人工智能产业链发展若干政策，扩容“算力券”、启动“词元（Token）券”", "content": "四川省人民政府办公厅近日印发《四川省加快推进“人工智能+”一号创新工程实施方案》，其中提出，加强政策保障。修订省促进人工智能产业链发展若干政策，扩容“算力券”、启动“词元（Token）券”，整合相关产业链资金资源对重大标志性应用场景予以集中支持，提升政策精准度和及时性。建立融资“白名单”，为符合条件的创新型企业设置便捷审贷制度和放款绿色通道。优化人工智能基础设施地方政府专项债工作流程，提升项目谋划和建设质效。支持协会、联盟等开展产品推广、供需对接等服务。加大人工智能领域财政支持力度，加快推进核心技术攻关、重大示范应用、重大项目实施，以政府资金引导更多社会资本参与。（人民财讯）", "ctime": 1778227199, "time_str": "15:59:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260508/c676541051.shtml"}, {"id": "4339231", "title": "四川：到2027年新一代智能终端、智能体等应用普及率超70%", "content": "四川省人民政府办公厅近日印发《四川省加快推进“人工智能+”一号创新工程实施方案》，方案提出，到2027年，实现人工智能与重点领域广泛深度融合，新一代智能终端、智能体等应用普及率超70%，形成2—3个具有全国竞争力的细分赛道产业集群，重点支持打造10个左右具有全国影响力的行业标杆大模型、研发一批轻量化端侧模型，建设10个左右行业领域重大标志性应用场景，建成20个左右应用场景实验室等公共平台。到2030年，争创1—2个国家级新兴产业集群、建设200家智能制造先进工厂，集聚人工智能企业2500家以上、产业规模突破4000亿元，加快建成具有全国影响力的人工智能创新策源地和应用先导区，新一代智能终端、智能体等应用普及率超90%。到2035年，全面步入智能经济和智能社会发展新阶段。（人民财讯）", "ctime": 1778227061, "time_str": "15:57:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260508/c676540950.shtml"}, {"id": "4339219", "title": "外交部：中洪合作不针对第三方 也不应受第三方干扰", "content": "5月8日，外交部发言人林剑主持例行记者会。有记者就中洪关系提问。对此，林剑表示，世界上只有一个中国，台湾是中国领土不可分割的一部分，中华人民共和国政府是代表全中国的唯一合法政府。一个中国原则是国际社会普遍共识和国际关系基本准则，也是中洪发展关系、开展合作的政治基础和前提条件。中洪的合作不针对第三方，也不应受第三方干扰。（央视新闻）", "ctime": 1778226892, "time_str": "15:54:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260508/c676540864.shtml"}, {"id": "4339201", "title": "外交部回应3家中国企业入选美国《时代》周刊 “最具影响力人工智能公司”榜单", "content": "5月8日，外交部发言人林剑主持例行记者会。有记者问：日前，美国《时代》周刊发布了“2026年最具影响力的10家人工智能公司”榜单，中国有3家企业入选。有观点称这充分体现了中国AI产业和技术发展的成就。发言人对此有何回应？对此，林剑表示，在许多人工智能相关评选中，中国企业和产品都榜上有名。这是科技自主创新与发展进步的直接体现。中国始终坚持走开放共赢的人工智能创新之路，欢迎各国企业到中国市场的“健身房”一展身手，在创新发展中锤炼筋骨、相互成就。（央视新闻）", "ctime": 1778226749, "time_str": "15:52:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260508/c676540744.shtml"}, {"id": "4339195", "title": "中关村：下属公司多多药业非布司他片获得《药品注册证书》", "content": "中关村公告，下属公司多多药业有限公司研制的“非布司他片”通过药品注册审评审批，获得国家药品监督管理局核准签发的《药品注册证书》（证书编号：2026S01403、2026S01404）。非布司他片为2-芳基噻唑衍生物，适用于痛风患者高尿酸血症的长期治疗。除多多药业外，国内非布司他片上市销售的企业有42家。药智数据显示，2025年非布司他片在国内样本医院终端销售额为6.21亿元。截至本公告披露日，非布司他片仿制药注册申请项目公司已累计投入研发费用1143.9万元。", "ctime": 1778226708, "time_str": "15:51:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260508/c676540701.shtml"}, {"id": "4339175", "title": "中疾控：我国无安第斯病毒人类感染病例报告", "content": "世界卫生组织日前通报，4月1日，一艘从阿根廷出发的极地探险邮轮上，暴发了汉坦病毒感染疫情。记者8日从中国疾控中心了解到，本次疫情涉及的安第斯病毒目前在我国境内无自然宿主分布，也无人类感染病例报告。 根据中国疾控中心发布的健康提示，汉坦病毒是一组主要由啮齿动物携带的病毒，可引起明确疾病的汉坦病毒有20多种，不同种病毒引起的临床表现差异显著，主要分为肾综合征出血热和汉坦病毒肺综合征。其中，引起汉坦病毒肺综合征的病毒，主要包括新诺柏病毒、安第斯病毒等。 健康提示明确，汉坦病毒感染一般不引起人与人之间传播，日常社交、公共场所普通接触不会造成病毒传播。 减少人与啮齿类动物的接触，是预防汉坦病毒感染的主要策略，有效的措施包括保持家庭和工作场所清洁，及时清理杂物，避免直接接触鼠类及其排泄物、尸体；在野外露营、在农田、林区、工地劳作、进入久未有人居住的屋舍，避免接触各类野生动物及其排泄物或分泌物，避免坐在草丛或鼠洞附近；对啮齿动物尿液和粪便消毒处理等。(新华社)", "ctime": 1778226599, "time_str": "15:49:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260508/c676540597.shtml"}, {"id": "4339173", "title": "叮咚买菜：将重点投入资源发力自有品牌", "content": "5月8日，记者从公司方面获悉，叮咚买菜正式升级自有品牌战略，将重点投入资源发力叮咚V5等自有品牌，未来将集中商品开发、供应链、品控、数字化及运营等资源，打造为面向家庭食品消费场景的高品质自有品牌。（人民财讯）", "ctime": 1778226584, "time_str": "15:49:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260508/c676540590.shtml"}, {"id": "4339169", "title": "新希望：2026年4月销售商品猪收入13.12亿元，环比减少15.24%", "content": "新希望公告，2026年4月销售商品猪120.99万头，环比变动-7.26%，同比变动11.07%。商品猪销售收入13.12亿元，环比变动-15.24%，同比变动-32.37%。商品猪销售均价9.15元/公斤，环比变动-6.06%，同比变动-37.76%。", "ctime": 1778226487, "time_str": 欧盟正推进出台“网络安全法”，禁止中国企业参与欧关键基础设施建设一事提问。对此，林剑表示，日前，中方的主管部门就欧盟“网络安全法修订案”等向欧方提交了评估意见，表达了中方严正关切和政治立场，希望欧方认真对待。中方正密切关注欧方有关的立法动向，愿与欧方就此进行对话沟通，希望欧方全面客观、积极看待中欧经贸关系，遵守世贸组织规则和市场原则，停止损人不利己的做法。如欧方执意惩罚、歧视性对待中国企业，中方将采取坚决措施维护中国企业的合法权益。（央视新闻）", "ctime": 1778225930, "time_str": "15:38:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260508/c676540305.shtml"}, {"id": "4339111", "title": "外交部：中方对大量船只和船员受战事影响被困霍尔木兹海峡深表关切", "content": "针对有关船只在霍尔木兹海峡遇袭的报道，外交部发言人林剑8日在例行记者会上答问时表示，根据目前掌握的情况，相关遇袭船只系马绍尔群岛籍，船上有中国籍船员。截至目前，该船只未报告有船员伤亡情况。林剑说，霍尔木兹海峡是用于国际航行的海峡，中方对大量船只和船员受战事影响被困海峡深表关切，认为尽早恢复海峡通行畅通、维护民用船只和船员安全符合地区国家和国际社会共同利益。(新华社)", "ctime": 1778225884, "time_str": "15:38:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260508/c676540279.shtml"}, {"id": "4339107", "title": "英国法院裁定两中国公民有罪，外交部：典型的政治闹剧", "content": "5月8日，外交部发言人林剑主持例行记者会。英国广播公司（BBC）记者提问，伦敦中央刑事法院于周四（5月7日）裁定两名中国公民有罪，将在日后宣判。请问中方对此有何评论？林剑表示，中方已经多次就有关案件表明了原则立场，英方以莫须有的罪名抓捕和起诉在英的中国公民，滥用法律，操弄司法程序定罪，公然为反中乱港分子站台，对中方进行无理指控和污蔑抹黑，是典型的政治闹剧。林剑强调，中方对此予以强烈谴责和坚决反对，已向英方提出严正交涉。我们敦促英方纠正错误做法，停止反华的政治操弄，停止为反中乱港分子撑腰打气，维护中英关系来之不易的良好发展势头。（澎湃新闻）", "ctime": 1778225850, "time_str": "15:37:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260508/c676540177.shtml"}, {"id": "4339105", "title": "外交部：中方就中东局势与包括以色列在内各方保持不同层级沟通", "content": "5月8日，外交部发言人林剑主持例行记者会。迪拜中阿卫视记者提问，美以伊战事发生以来，中方同伊朗、美国以及域内外其他有关国家密切沟通，日前伊朗外长阿拉格齐访华，中方同以色列有没有高层级沟通和交往？如有能否介绍相关情况？林剑表示：“当前中东局势处于战和转换的关键阶段，中方同包括以色列在内的有关各方，保持不同层级的沟通和交往，包括你所说的高层级。”林剑重申，中方支持各方通过政治外交途径化解矛盾和争端，实现全面持久停火止战，维护中东和海湾地区和平稳定。中方愿根据习近平主席提出的关于维护和促进中东地区和平稳定的四点主张精神，同国际社会一道继续为此发挥积极和建设性作用。(澎湃新闻)", "ctime": 1778225842, "time_str": "15:37:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260508/c676540174.shtml"}, {"id": "4339103", "title": "外交部：日本军国主义侵略罪行罄竹难书 铁证如山", "content": "5月8日，外交部发言人林剑主持例行记者会。总台央视记者提问，在东京审判开庭80周年纪念日之际，《远东国际军事法庭庭审记录·全译本》在中国首发，有关庭审记录是东京审判的核心历史文献，完整记载了法庭长达两年多的全部审理过程。参与东京审判的美国副检察官萨顿的亲笔日记也首次披露。请问中方对此有何评论？对此，林剑表示，《庭审记录·全译本》的出版和萨顿日记的披露，再次说明日本军国主义侵略罪行罄竹难书，铁证如山。80年过去了，日本右翼势力却始终未能深刻反省历史，极力美化侵略罪行，向日本社会灌输错误的历史观。一些政客还频繁参拜供奉甲级战犯所谓“靖国神社”，这实质是企图否定东京审判历史定论，挑战战后国际秩序。（央视新闻）", "ctime": 1778225808, "time_str": "15:36:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260508/c676540157.shtml"}, {"id": "4339101", "title": "特朗普称中美元首会谈将按计划举行，外交部：目前无进一步信息提供", "content": "5月8日，外交部发言人林剑主持例行记者会。日本广播协会（NHK）记者提问，美国总统特朗普日前表示，中美元首会谈会按计划举行，中方预计将在何时正式发布相关消息？此外，中方对本次元首会谈有何期待？双方会重点讨论哪些议题？“中美双方就特朗普总统访华事保持着沟通。我目前没有可以进一步提供的信息。”林剑说。(澎湃新闻)", "ctime": 1778225801, "time_str": "15:36:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260508/c676540135.shtml"}, {"id": "4339089", "title": "东亚药业：全资子公司富马酸伏诺拉生原料药获得韩国原料药品注册证书", "content": "东亚药业公告，近日，全资子公司江西善渊药业有限公司收到韩国食品药品监督管理局（韩国MFDS）原料药品注册证书。富马酸伏诺拉生是一种钾离子竞争性酸阻滞剂（简称P-CAB），可以抑制胃酸的生成和抑制胃肠道上部粘膜损伤，主要用于治疗胃食管反流，与适当的抗生素联用以根除幽门螺杆菌。相关数据显示，富马酸伏诺拉生相关制剂2025年度全国销售额约为7.22亿元，2025年度全球销售额约为82.5亿元。", "ctime": 1778225659, "time_str": "15:34:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260508/c676540025.shtml"}, {"id": "4339087", "title": "东安动力：2026年4月发动机销量同比下降21.10%", "content": "东安动力公告，2026年4月发动机销量27132台，同期34387台，同比下降21.10%；累计销量13.91万台，同比下降6.69%；产量35109台，同比下降19.41%。变速器销量8707台，同期19685台，同比下降55.77%；累计销量39437台，同比下降27.28%；产量13082台，同比下降39.21%。", "ctime": 1778225654, "time_str": "15:34:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260508/c676540023.shtml"}, {"id": "4339085", "title": "长城科技：拟向关联方出售资产，交易价格1458.62万元", "content": "长城科技公告，拟向公司关联方湖州上实新能源科 {"id": "4339011", "title": "《生活服务类平台算法负面清单（试行）》实施取得初步成效", "content": "贯彻落实党中央决策部署，为更好维护新就业群体和广大人民群众合法权益，2026年1月，中央网信委印发《生活服务类平台算法负面清单（试行）》。随后，中央网信办会同有关部门精心组织实施，北京、上海、江苏、浙江、广东等地网信部门迅速行动，督促外卖、网约车、货运、网购、在线旅游、票务领域重点平台对照《负面清单》，深入开展自查自纠。美团、淘宝闪购、淘宝天猫、京东、滴滴、高德、T3、百度、满帮、货拉拉、拼多多、抖音、携程、去哪儿网等平台积极响应，已实施优化改进措施63项，承诺遵守算法要求139项，限期推进125项，在提升算法透明度、公平性、合理性方面取得初步成效。中央网信办相关负责人表示，生活服务类平台算法治理取得了初步成效，但个别平台仍存在“选择性整改”“别人不改我不改”等问题，与广大新就业群体和人民群众的期盼期待相比还有不少差距。下一步，中央网信办将会同有关部门，持续抓紧抓实《负面清单》实施工作，进一步压实平台主体责任，适时组织专项检查，评估效果、督促进度。发现存在严重问题的，依法依规处置处罚。(网信中国)", "ctime": 1778224676, "time_str": "15:17:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260508/c676539344.shtml"}, {"id": "4338999", "title": "港股快手尾盘持续拉升涨超10%", "content": "港股快手-W尾盘持续拉升涨超10%，报53.45港元。消息面上，近日，可灵AI在视频3.0系列模型中推出原生4K直出功能，支持一键生成院线级质感视频，为业内首个原生4K直出的视频模型。该功能面向影视及广告等专业视频行业客户，可在无需复杂后期处理的情况下，直接输出高分辨率画面，实现影视工业级视觉效果。", "ctime": 1778224539, "time_str": "15:15:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260508/c676539284.shtml"}, {"id": "4338989", "title": "发布11年来首次 Apple Watch加入苹果教育优惠阵容", "content": "5月8日，苹果正式将AppleWatch全系列产品纳入教育优惠阵容。符合条件的高校学生、教师及教职员工可通过苹果在线教育商店或全球AppleStore零售店，以专属教育优惠价格购买AppleWatch，起售价为2699元。这是AppleWatch自2015年发布以来首次面向教育群体开放专项优惠。AppleWatch教育选购页面显示，本次教育优惠覆盖AppleWatchSeries11、AppleWatchSE3及AppleWatchUltra3三款主力机型。其中，AppleWatchSeries11教育优惠价2699元起，较原价便宜300元；AppleWatchSE3教育优惠价1799元起，较原价便宜200元；定位专业户外运动的AppleWatchUltra3教育优惠价5799元起，较原价便宜700元。(界面新闻)", "ctime": 1778224493, "time_str": "15:14:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260508/c676539167.shtml"}, {"id": "4338953", "title": "美情报界：伊朗仍保有战前水平70%的导弹库存", "content": "美国中央情报局本周向美国政府提交的一份分析报告认为，尽管遭受了美国和以色列的长时间密集轰炸，目前伊朗的导弹库存仍维持在战事爆发前水平的70%。7日，据3名现任情报官员和1名前情报官员透露的该报告要点显示，伊朗据信在战前拥有大约2500枚弹道导弹。一名美国情报官员说，伊朗的移动发射装置库存已恢复至战前的约75%，导弹 // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
