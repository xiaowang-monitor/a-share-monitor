const NEWS     = [{"id": "4557435", "title": "工信部部长李乐成会见加拿大工业部长梅拉妮·乔利", "content": "6月18日下午，工业和信息化部部长李乐成在北京会见加拿大工业部长梅拉妮·乔利，双方就深化中加产业合作进行交流。李乐成表示，在两国领导人战略引领下，中加关系重新起航。工业和信息化部愿同加方加强政策经验交流，充分发挥各自产业优势，鼓励和支持两国企业加强对接，拓展务实合作，为中加新型战略伙伴关系发展注入新动力。乔利表示，加方愿同中方相向而行，共同为两国产业互利共赢合作创造有利条件，助力双边关系发展。（工信部）", "ctime": 1781780020, "time_str": "18:53:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260618/c677576054.shtml"}, {"id": "4557429", "title": "埃森哲三季度营收187亿美元低于预期", "content": "埃森哲公布三季度营收187亿美元，预估187.6亿美元；预计四季度营收177.5亿美元至184亿美元，同比增长1%到5%。埃森哲预计全年调整后每股收益13.78美元至13.90美元。", "ctime": 1781779983, "time_str": "18:53:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260618/c677575993.shtml"}, {"id": "4557425", "title": "高峰期日均收获超1600万亩 全国“三夏”小麦大规模机收基本结束", "content": "记者从农业农村部了解到，今年“三夏”小麦大规模机收从5月28日启动，截至今天，全国夏粮小麦收获进度已过96%，除新疆、甘肃等西北地区麦收还将继续推进外，西南、黄淮海等重点麦区收获均已收官，今年“三夏”小麦大规模机收基本结束。今年“三夏”抢收进度快。小麦大规模机收从5月28日启动，自南向北快速推进，历时22天基本完成大规模麦收任务，较去年快2天，在5月31日到6月13日抢收高峰期，全国日均收获超1600万亩，麦收大省河南连续3天日收超1000万亩、1周左右顺利完成集中抢收任务。(央视新闻)", "ctime": 1781779956, "time_str": "18:52:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260618/c677575983.shtml"}, {"id": "4557423", "title": "国家数据局召开系列座谈会研究上半年数字经济形势", "content": "近日，国家数据局组织召开系列座谈会，会同有关部门、地方、行业协会、科研院所、投融资机构和企业共同研判上半年数字经济发展形势，分析面临的机遇与挑战，研究做好下一步工作。大家一致认为，上半年，词元（Token）计价、效用付费等业态初显，数字消费快速发展，数字贸易保持增势，数字经济领域投资活跃，充分彰显了我国数字经济的强大韧性和潜力，为国民经济平稳发展注入新动能。下一步，国家数据局将会同有关方面，持续完善数据要素市场化配置改革“531”工作体系，拓展数据要素价值化路径，加快构建以数据为关键要素的数字经济，紧扣“十五五”规划部署，紧密跟踪监测数字经济发展情况，靠前谋划政策储备，促进实体经济与数字经济深度融合，不断推动我国数字经济做强做优做大。（国家数据局）", "ctime": 1781779907, "time_str": "18:51:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260618/c677575960.shtml"}, {"id": "4557413", "title": "埃森哲美股盘前跌幅扩大至10%", "content": "埃森哲美股盘前跌幅扩大至10%。", "ctime": 1781779801, "time_str": "18:50:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260618/c677575659.shtml"}, {"id": "4557409", "title": "融资消息曝光后DeepSeek上线识图模式，但认不出梁文锋", "content": "6月18日，记者获悉，DeepSeek正式上线网页版的识图模式，APP则在内测阶段。从功能来看，此次上线的识图模式还处于初始阶段，记者用DeepSeek创始人梁文锋的照片多次试用模型，模型经过几分钟的思考，给出了不少错误答案，最后干脆承认“我真的很不确定。不推荐猜测名字，因为猜错比说‘不知道’更糟糕。”而在其他网友的测试中，面对创始人梁文锋的照片，DeepSeek甚至将其辨认为月之暗面创始人杨植麟、马化腾“年轻版”。值得注意的是，识图模式上线前夕，DeepSeek刚被爆出敲定了超500亿元的首轮融资。（澎湃新闻）", "ctime": 1781779765, "time_str": "18:49:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260618/c677575654.shtml"}, {"id": "4557403", "title": "华虹宏力：发行股份购买资产并募集配套资金暨关联交易事项获得审核通过", "content": "华虹宏力公告，上海证券交易所并购重组审核委员会于2026年6月18日召开2026年第9次审议会议，对公司发行股份购买资产并募集配套资金暨关联交易事项进行了审议。根据审议结果，本次交易符合重组条件和信息披露要求。公司拟通过发行股份方式向上海华虹（集团）有限公司等购买其合计持有的华力微97.4988%股权，并募集配套资金。本次交易尚需经中国证券监督管理委员会同意注册后方可实施，能否取得同意注册及最终完成注册的时间存在不确定性。", "ctime": 1781779739, "time_str": "18:48:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260618/c677575643.shtml"}, {"id": "4557393", "title": "辉瑞公司首席财务官即将离职", "content": "辉瑞公司首席财务官即将离职，以寻求在消费品领域的发展机遇。（财联社）", "ctime": 1781779646, "time_str": "18:47:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260618/c677575586.shtml"}, {"id": "4557377", "title": "伊朗总统佩泽希基扬在 X 平台发布伊美谅解备忘录全文", "content": "伊朗总统佩泽希基扬在 X 平台发布伊美谅解备忘录全文。(新浪财经)", "ctime": 1781779608, "time_str": "18:46:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260618/c677575569.shtml"}, {"id": "4557367", "title": "全国首单水土保持公共数据产品交易落地", "content": "记者从水利部了解到，2026年“数据要素×”大赛安徽分赛推介会6月18日在合肥启幕，全国首单水土保持公共数据产品交易在会上成功落地。会上，安徽省水利水电勘测设计研究总院股份有限公司等5家单位获颁《水土保持公共数据产品交易凭证》。这一交易在全国率先打通了水土保持领域“数据资源”向“数据资产”转化的通道，不仅为水利行业的数字化转型注入动力，更为全国水土保持数据资源的市场化配置改革走出了一条可复制、可推广路径。“首单交易是培育水土保持领域新质生产力的破题之举，既打通了数据合规供给堵点，又通过市场化机制倒逼数据治理提质，让数据在安全可控前提下真正‘活起来、用起来、跑起来’。”安徽省水土保持监测总站相关负责人说。（新华社）", "ctime": 1781779593, "time_str": "18:46:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260618/c677575564.shtml"}, {"id": "4557361", "title": "德舰艇驶往红海以备霍尔木兹海峡扫雷任务", "content": "据德国媒体18日报道，德国国防部长皮斯托里乌斯当天表示，德国海军两艘舰艇正驶往红海，以备在霍尔木兹海峡执行扫雷任务。 据德新社报道，皮斯托里乌斯在比利时布鲁塞尔出席北约国防部长会议前对媒体说，德国海军扫雷艇“富尔达”号和补给舰“摩泽尔”号正在穿越苏伊士运河，驶向红海。德方希望能够迅速抵达霍尔木兹海峡投入行动。 他说，此次航行首个目的地是吉布提，尚不需要德国联邦议院授权，因为相关行动已包含在欧盟红海护航军事行动——“盾牌”行动的授权范围内。 他表示，在霍尔木兹海峡开展扫雷行动需要有明确的国际法框架，并需征得伊朗和阿曼的同意。(新华社)", "ctime": 1781779585, "time_str": "18:46:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260618/c677575561.shtml"}, {"id": "4557313", "title": "金川集团股份有限公司原总经理李尚勇接受审查调查", "content": "据甘肃省纪委监委消息：金川集团股份有限公司原党委副书记、总经理李尚勇涉嫌严重违纪违法，目前正接受甘肃省纪委监委纪律审查和监察调查。", "ctime": 1781779475, "time_str": "18:44:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260618/c677575525.shtml"}, {"id": "4557307", "title": "硕世生物：人乳头瘤病毒核酸检测试剂盒预期用途变更", "content": "硕世生物公告，近日收到国家药品监督管理局审批通过的医疗器械变更注册（备案）文件（体外诊断试剂），对人乳头瘤病毒核酸检测试剂盒（荧光PCR法）产品的预期用途作变更。原预期用途为用于体外定性检测妇女宫颈脱落细胞中18种HPV型别核酸，且对HPV16和HPV18进行分型，其他16种HPV型别不做具体分型，不得用于宫颈癌筛查相关用途。变更后预期用途为用于体外定性检测妇女宫颈脱落细胞中18种HPV型别核酸，且对HPV16和HPV18进行分型，其他16种HPV型别不做具体分型，可用于30岁及以上女性通过检测是否有高危型HPV感染，与宫颈细胞学检查联合进行宫颈癌筛查，或单独进行宫颈癌筛查，此检测结合细胞学病史和其他风险因素的评估、以及临床诊疗和筛查指南的要求，用于指导患者的管理。", "ctime": 1781779446, "time_str": "18:44:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260618/c677575501.shtml"}, {"id": "4557301", "title": "北京丰台宅地溢价15.65%成交", "content": "6月18日，北京出让一宗丰台区宅地，4家房企竞价148轮，最终厦门国贸以总价11.95亿元斩获地块，成交楼面价56677元/平方米，溢价率15.65%。（人民财讯）", "ctime": 1781779409, "time_str": "18:43:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260618/c677575490.shtml"}, {"id": "4557297", "title": "国家金融监督管理总局：推动人工智能切实服务经济高质量发展和金融业务高效运转", "content": "国家金融监督管理总局发布关于银行业保险业人工智能安全开发应用的指导意见。坚持防风险、强监管、促高质量发展的工作主线，统筹发展和安全，加快培育发展金融行业新质生产力，推动人工智能应用合规、透明、可信赖，加强分类分级管理，有效应对人工智能发展带来的风险挑战，更好服务实体经济和满足人民群众需要。坚持谁使用谁负责，压实金融机构作为金融服务提供方、人工智能技术使用方的主体责任，强化金融机构内部各环节工作责任落实，明确人工智能开发应用各方分工和权责义务。坚持自主可控，持续提升人工智能相关技术、设备自主可控水平，提高对业务经营发展有重大影响的关键平台、关键软硬件的自主研发能力，加强信息技术应用创新适配。坚持务实高效，以提升业务价值为导向，科学规划人工智能开发应用投入，有效平衡成本与效益，推动人工智能切实服务经济高质量发展和金融业务高效运转。坚持安全发展，严格落实国家网络安全和信息化工作要求，遵守网络安全、数据安全各项法律法规制度，强化技术安全和应用安全保障，全面提升安全防护和应急处置能力。（人民财讯）", "ctime": 1781779403, "time_str": "18:43:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260618/c677575479.shtml"}, {"id": "4557285", "title": "外媒：伊朗战事以来首艘LNG船通过霍尔木兹海峡", "content": "外媒报道，海上交通网站追踪数据显示，一艘悬挂法国国旗的液化天然气（LNG）运输船18日经过霍尔木兹海峡。该船成为伊朗战事爆发以来首艘通行这一海域的液化天然气船舶。(新华社)", "ctime": 1781779340, "time_str": "18:42:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260618/c677575456.shtml"}, {"id": "4557275", "title": "首批商业不动产REITs在上交所上市", "content": "2026年6月18日，首批商业不动产REITs上市仪式在上海证券交易所成功举行。本次上市的4只产品分别为汇添富上海地产商业REIT、中信建投首农商业REIT、国泰海通砂之船商业REIT、中金唯品会商业REIT，募集资金规模合计约203亿元。产品底层资产涵盖商业零售、商业办公楼等成熟商业业态，分布于北京、上海、郑州、西安、哈尔滨等城市核心区域，参与主体汇聚地方国有龙头企业与行业头部民营企业，具备良好的市场代表性与示范效应。截至目前，全市场已受理项目共21只，近期还有多只首批项目将依规发行上市。(上交所)", "ctime": 1781779275, "time_str": "18:41:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260618/c677575435.shtml"}, {"id": "4557269", "title": "摩根大通将日本日经指数的2026年年末目标值上调至75,000点", "content": "摩根大通将日本日经指数的2026年年末目标值上调至75,000点，而此前的目标值为70,000点。", "ctime":  1781778564, "time_str": "18:29:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260618/c677575115.shtml"}, {"id": "4557091", "title": "安徽出台低空经济重要方案：2028年度低空飞行时长达500万小时", "content": "6月17日，安徽省人民政府办公厅正式印发《安徽省“低空+”应用场景拓展工程行动方案（2026—2028年）》（下称“方案”），明确全省低空经济三年工作目标、重点任务与推进举措。根据方案规划，到2028年，安徽省年度低空飞行时长达到500万小时，集聚低空运营类企业超300家，累计建成低空应用示范场景100个，形成安全有保障、商业可持续、群众易接受的发展模式。此外，方案还提出支持电动垂直起降航空器（eVTOL）企业加强验证飞行与技术积累，在确保安全的前提下，有序推进载客运营。到2028年，力争形成1至2条eVTOL商业化载客运营航线；力争安徽省低空旅游年参与人次达到3万。", "ctime": 1781778290, "time_str": "18:24:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260618/c677575025.shtml"}, {"id": "4557085", "title": "四川：实施煤炭清洁化利用激励，单个项目补助资金最高不超过2000万元", "content": "四川省发展和改革委员会印发《四川省支持绿色低碳发展若干政策措施》。其中提出，实施煤炭清洁化利用激励。支持煤炭高效清洁利用项目、煤层气（矿井瓦斯）规模化抽采利用项目、8%以下超低浓度瓦斯利用项目、余热余压利用项目、煤基清洁燃料与高端材料产业化项目、矿区大宗固废资源化利用与近零排放项目、矿区智慧能源管理与新能源耦合建设项目，省级预算内基本建设投资对符合条件的项目按照不超过单个项目总投资的30%给予补助，单个项目补助资金最高不超过2000万元。", "ctime": 1781778238, "time_str": "18:23:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260618/c677575004.shtml"}, {"id": "4557087", "title": "大连圣亚：上海潼程认购金额不超过9.56亿元", "content": "大连圣亚公告，公司与上海潼程企业管理合伙企业（有限合伙）签署《大连圣亚旅游控股股份有限公司向特定对象发行股票之附条件生效的股份认购协议之补充协议》。上海潼程同意以现金方式认购公司本次发行的全部股票，认购金额不超过9.56亿元。本次发行股票价格不低于定价基准日前20个交易日股票交易均价的80%。发行数量不超过3864万股，募集资金扣除发行费用后用于偿还债务和补充流动资金。此次发行尚需上海证券交易所审核通过及中国证监会同意注册。", "ctime": 1781778238, "time_str": "18:23:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260618/c677575005.shtml"}, {"id": "4557081", "title": "北京发布双预警 山区有发生崩塌等地质灾害的风险", "content": "北京市水务局与市气象局6月18日16时30分联合发布积水内涝风险蓝色预警：预计19日14时至20日2时，朝阳区、丰台区、大兴区存在积水内涝一般风险。请广大市民关注天气形势及雨水情变化，出行尽量避开低洼处，同时做好地下空间防护工作。北京市规划自然资源委联合市气象局发布地质灾害气象风险预警：6月18日16时30分至6月20日16时30分，北京市山区有发生崩塌、滑坡等地质灾害的风险（蓝色预警），请注意防范。（央视新闻）", "ctime": 1781778221, "time_str": "18:23:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260618/c677574999.shtml"}, {"id": "4557075", "title": "石药创新：司库奇尤单抗注射液上市申请获得受理", "content": "石药创新公告，控股子公司石药集团巨石生物制药有限公司于近日收到国家药品监督管理局核准签发的《受理通知书》，司库奇尤单抗注射液的上市申请获得受理。", "ctime": 1781778078, "time_str": "18:21:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260618/c677574932.shtml"}, {"id": "4557061", "title": "中国使馆：70名被菲方羁押的中国公民均已获释", "content": "中国驻菲律宾大使馆18日消息，使馆高度重视菲律宾东米萨米斯省一家钢铁厂70名中国公民5月中旬被菲方查扣案，已推动该案被扣的中国公民全部恢复自由。使馆说，在推动64名中国公民于5月28日获释后，使馆持续敦促菲方加快在押6人的身份核查程序，要求其依法公正快速处理，切实维护中国公民合法权益。使馆还派员探视在押人员，并协助安排庭审翻译。5月29日和6月3日又分别有两人获释，最后两人先后于6月15日与17日获释。（新华社）", "ctime": 1781777971, "time_str": "18:19:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260618/c677574874.shtml"}, {"id": "4557055", "title": "以军已部署在黎巴嫩南部指定区域", "content": "以色列国防军18日发表声明说，由于作战需要，以色列国防军已部署在黎巴嫩南部指定区域内，即位于黎巴嫩领土内约10公里处。（新华社）", "ctime": 1781777917, "time_str": "18:18:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260618/c677574859.shtml"}, {"id": "4557045", "title": "世界气象组织报告：去年极端天气影响非洲超千万人", "content": "世界气象组织18日在埃塞俄比亚首都亚的斯亚贝巴发布《2025年非洲气候状况》报告，数据显示去年极端天气和气候相关事件影响非洲至少1300万人，报告的死亡人数超过3000人，对经济社会各领域均造成连锁影响。报告指出，2025年，严重气候事件在非洲引发了深重的社会经济危机，需要加强应对。目前，尽管具备防灾备灾与应急响应能力的非洲国家不足40%，但各国参与联合国“全民预警倡议”的积极性不断提升，多个国家已承诺制定国家路线图。（新华社）", "ctime": 1781777876, "time_str": "18:17:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260618/c677574842.shtml"}, {"id": "4557041", "title": "ST人福：拟向特定对象发行A股股票，认购数量不超过2.34亿股", "content": "ST人福公告，公司拟向特定对象发行A股股票，发行对象为控股股东招商生科。原协议约定认购数量不低于2.01亿股，不超过2.34亿股。认购价格不低于定价基准日前20个交易日公司股票交易均价的80%。本次发行尚需上交所审核通过并经中国证监会同意注册后方可实施。", "ctime": 1781777857, "time_str": "18:17:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260618/c677574833.shtml"}, {"id": "4557039", "title": "顺丰控股：公司2026年5月速运物流业务、供应链及国际业务合计收入为人民币265.86亿元，同比增长5.87%", "content": "顺丰控股公告，公司2026年5月速运物流业务、供应链及国际业务合计收入为人民币265.86亿元，同比增长5.87%。其中，速运物流业务营业收入为人民币194.5亿元，业务量为14.15亿票，单票收入为人民币13.75元；供应链及国际业务营业收入为人民币71.36亿元，同比增长24.49%。", "ctime": 1781777848, "time_str": "18:17:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260618/c677574827.shtml"}, {"id": "4557035", "title": "追觅：将进行战略调整，聚焦四大核心赛道", "content": "据追觅官方消息，公司正在推进一项战略调整，追觅将全面聚焦智能清洁、全屋家电、智慧出行、具身智能四大核心赛道。据悉，追觅系业务单元数量大、业务多样，此次调整方式各不相同。据了解，其大体系中成熟的智能清洁板块，包括扫地机、吸尘器、洗地机等业务单元，将保持、加大投入力度；此前备受市场关注的汽车、手机等业务将以产业研究院形式推进，聚焦技术研发储备。（21世纪经济报道）", "ctime": 1781777773, "time_str": "18:16:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260618/c677574801.shtml"}, {"id": "4557025", "title": "键邦股份：拟通过全资子公司收购鑫浩自动化和宇腾自动化55%股权", "content": "键邦股份公告，拟通过全资子公司江苏键科智能科技有限公司以现金方式通过收购与增资形式分别取得深圳市鑫浩自动化技术有限公司和深圳市浩瀚宇腾自动化技术有限公司的股权，收购完成后，拟分别取得鑫浩自动化和宇腾自动化55%的股权。", "ctime": 1781777703, "time_str": "18:15:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260618/c677574773.shtml"}, {"id": "4557023", "title": "广东珠海部分地区暴雨预警信号升级为红色", "content": "记者从珠海市气象局了解到，受加强的雷雨云团影响，珠海市斗门区降雨再度增强。6月18日17时15分将斗门区暴雨预警信号升级为红色，香洲区、高新区、横琴粤澳深度合作区、金湾区、万山区、经开区暴雨橙色预警和全市雷雨大风黄色预警仍然生效。当前正值晚高峰时期，请注意强降雨的不利影响。（央视新闻）", "ctime": 1781777696, "time_str": "18:14:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260618/c677574771.shtml"}, {"id": "4557017", "title": "北自科技：未生产人形机器人本体及零部件", "content": "北自科技公 // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');

    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>

  }).join('');
}

    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
