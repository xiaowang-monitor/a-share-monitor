）方案，每个芯片组包含48个核心，并集成专属的DRAM内存控制器和PCIe 6.0 I/O控制器。四个芯片组之间通过定制互连提供高达420GB/s带宽，L3缓存暴增5倍至192MB，分支预测能力大幅提升，运行真实数据库等复杂代码时性能提升高达30%。Graviton5采用了台积电3nm制程工艺，在同样功耗下封装了更多晶体管，实现了更高的电路密度与能效比。根据AWS官方数据，M9g实例相比基于Graviton4的M8g实例，通用计算性能提升25%，Web应用提升35%，机器学习推理提升35%，数据库提升30%。（财联社）", "ctime": 1781157550, "time_str": "13:59:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260611/c677382786.shtml"}, {"id": "4509691", "title": "科威特宣布空中交通恢复正常", "content": "当地时间11日上午，科威特民航总局宣布，鉴于此前的“紧急情况”已得到解决，科威特领空内的空中交通恢复正常。科威特民航总局在一份通告中宣布，科威特国际机场恢复正常运营，航班按照既定时刻表恢复运行。通告强调，民航部门将继续全天候密切监控局势，并与科威特境内外相关部门持续协调，以确保空域安全。当天早些时候，科威特民航总局宣布，由于伊朗方面的袭击，科威特暂时关闭领空。（央视新闻）", "ctime": 1781157371, "time_str": "13:56:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260611/c677382715.shtml"}, {"id": "4509685", "title": "美团、淘宝闪购、京东外卖集体签约，建立“黑名单”共享机制", "content": "日前，广东省市场监管局举办网络餐饮平台自律公约和协同共治协议签署活动。活动中，在广东省市场监管局有关负责人的见证下，美团、淘宝闪购、京东外卖三家网络餐饮平台共同签署了《广东省网络餐饮行业高质量发展与食品安全自律公约》（下称“自律公约”），推动网络餐饮行业实现从“被动合规”到“主动治理”，从“规模扩张”到“品质优先”，从“单打独斗”到“协同共治”的转变。公约全文共五章二十一条，紧扣《网络餐饮服务经营者落实食品安全主体责任监督管理规定》（国家市场监管总局第123号令）核心要求，围绕平台主体责任、入网餐饮商户管理、配送人员关怀、社会共治等方面作出明确约定，首次提出建立跨平台“黑名单”共享机制，对严重违法商户实施跨平台联合约束，实现“一处违法、全网受限”。(南方plus)", "ctime": 1781157328, "time_str": "13:55:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260611/c677382711.shtml"}, {"id": "4509647", "title": "先进封装板块短线拉升", "content": "先进封装板块短线拉升，博敏电子、太极实业、兴福电子涨停， 方邦股份、光智科技、甬矽电子涨超10%，气派科技、江化微、科翔股份、苏试试验、拓荆科技等跟涨。相关ETF方面，科创芯片ETF汇添富涨1.08%，成交额2.32亿元，芯片ETF广发成交额1.3亿元。", "ctime": 1781157059, "time_str": "13:50:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260611/c677382677.shtml"}, {"id": "4509633", "title": "沪深京三市成交额超2万亿元，较上日此时缩量1126亿元", "content": "据同花顺iFinD数据，沪深京三市成交额超2万亿元， 航三证”的吨级以上eVTOL，V2000CG获得印尼VTC表明其设计既符合原产国（中国）的适航标准，同时也满足进口国（印尼）的适航要求，为V2000CG在“万岛之国”开启商业运营提供了先决条件。（第一财经）", "ctime": 1781155750, "time_str": "13:29:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260611/c677382217.shtml"}, {"id": "4509507", "title": "中巨芯触及涨停", "content": "中巨芯触及涨停，成交额42.11亿元，涨幅20.00%。", "ctime": 1781155513, "time_str": "13:25:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260611/c677382140.shtml"}, {"id": "4509487", "title": "光刻胶板块震荡走高，雅克科技触及涨停", "content": "光刻胶板块震荡走高，雅克科技触及涨停，南大光电、聚合材料、彤程新材、百合花跟涨。", "ctime": 1781155284, "time_str": "13:21:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260611/c677382106.shtml"}, {"id": "4509433", "title": "谌贻琴出席第114届国际劳工大会并会见瑞士联邦主席帕姆兰", "content": "6月10日，国务委员谌贻琴在瑞士日内瓦出席第114届国际劳工大会并发表讲话，宣介习近平主席提出的四大全球倡议，阐述中方立场主张，表示愿与各方一道，推动国际劳工组织坚守初心使命，促进社会正义。 会后，谌贻琴会见国际劳工组织总干事洪博，就深化与国际劳工组织合作进行交流。洪博表示，国际劳工组织高度重视与中国的合作，愿与中国一道为劳动世界的美好未来作出新贡献。 同日，谌贻琴在伯尔尼会见瑞士联邦主席兼经济、教研部长帕姆兰，双方表示愿落实好两国领导人重要共识，持续挖掘民生等领域务实合作潜力，倡导普惠包容的经济全球化，携手推动构建人类命运共同体。(新华社)", "ctime": 1781154766, "time_str": "13:12:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260611/c677382020.shtml"}, {"id": "4509431", "title": "钨原料长单含税单价较上月涨幅明显 翔鹭钨业：之前回落太多", "content": "翔鹭钨业6月份上半月55%黑钨精矿、55%白钨精矿、仲钨酸铵（国际零级）的长单采购报价(含税）分别为51.8万元/标吨、51.7万元/标吨、78万元/吨。此前，5月份下半月，公司55%黑钨精矿、55%白钨精矿、仲钨酸铵报价（含税）分别为41.4万元/标吨、41.3万元/标吨、66万元/吨。6月上半月涨幅明显。对于涨价原因，翔鹭钨业证券部工作人员称：“之前回落太多”。（财联社）", "ctime": 1781154737, "time_str": "13:12:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260611/c677382016.shtml"}, {"id": "4509411", "title": "A股锂矿股午后冲高，永杉锂业触及涨停", "content": "A股锂矿股午后冲高，永杉锂业触及涨停，国城矿业、盛新锂能双双涨超7%，天华新能、融捷股份、西藏矿业、永兴材料、赣锋锂业、天齐锂业等个股跟涨。", "ctime": 1781154294, "time_str": "13:04:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260611/c677381926.shtml"}, {"id": "4509409", "title": "伊朗说美国军事恐吓只会适得其反", "content": "在当地时间6月10日的联合国安理会公开辩论会上，伊朗常驻联合国代表伊拉瓦尼在发言中说，外国军队在波斯湾的持续存在无法给地区带来和平，美以政权作为侵略者应对其非法行动造成的任何升级承担全部责任。伊拉瓦尼指出，伊朗从来不会在威胁和压力下进行谈判。美国现在应该知道，威胁和军事恐吓只会适得其反，如果华盛顿真的对外交解决感兴趣，就必须放弃威胁的语言，在相互尊重、主权平等和完全遵守国际法的基础上与伊朗接触。(CCTV国际时讯)", "ctime": 1781154264, "time_str": "13:04:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260611/c677381913.shtml"}, {"id": "4509399", "title": "美国政府5月退还近220亿美元关税", "content": "美国财政部10日发布的月度财政数据显示，美国联邦政府5月关税退款金额接近220亿美元，当月美国海关关税净收入为负数。数据显示，美国5月海关关税总收入为219.3亿美元，关税退款金额达219.72亿美元，这意味着扣除关税退款后，当月关税净收入为负4200万美元。此外，美国联邦政府5月财政赤字为2926.48亿美元；2026财年（自2025年10月起）前8个月，联邦政府财政赤字达1.25万亿美元。（新华社）", "ctime": 1781154150, "time_str": "13:02:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260611/c677381890.shtml"}, {"id": "4509385", "title": "韩国交易所启动SIDECAR机制，暂停KOSDAQ程序化买入", "content": "韩国交易所启动SIDECAR机制，暂停KOSDAQ程序化买入。", "ctime": 1781153986, "time_str": "12:59:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260611/c677381874.shtml"}, {"id": "4509383", "title": "极兔回应被立案调查：高度重视，全面整改", "content": "关于国家邮政局依法对极兔速递有限公司立案调查一事，极兔回应：极兔速递中国区高度重视，诚恳接受，坚决服从、全力配合主管部门依法依规开展的各项调查工作。极兔方面强调，安全生产是企业不可逾越的红线。极兔中国对照关于安全生产的重要指示深刻反思，深感作为品牌总部，在对使用“极兔速递”商标、字号、快递运单经营的部分企业落实安全保障统一管理责任方面存在差距和不足，教训深刻。对此，极兔中国诚恳接受监督。（21世纪经济报道）", "ctime": 1781153974, "time_str": "12:59:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260611/c677381872.shtml"}, {"id": "4509373", "title": "新研究：血液检测可助结肠癌术后精准治疗", "content": "德国德累斯顿大学医院牵头开展的一项临床研究发现，检测Ⅱ期结肠癌患者术后血液中的循环肿瘤DNA，或可帮助识别复发风险，并为术后辅助化疗决策提供依据。相关研究成果日前发表在《肿瘤学年鉴》杂志上。（新华社）", "ctime": 1781153765, "time_str": "12:56:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260611/c677381817.shtml"}, {"id": "4509345", "title": "天文学家探测到极早期宇宙类星体的“闪烁”", "content": "美国天文学家发现一个遥远类星体会忽明忽暗地闪烁，它来自“宇宙黎明”时期，即大爆炸后仅8.5亿年。这是迄今探测到的最早的闪烁类星体，其亮度变化可帮助揭示幼年宇宙中的超大质量黑洞是怎样形成的。（新华社）", "ctime": 1781153294, "time_str": "12:48:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260611/c677381728.shtml"}, {"id": "4509317", "title": "保加利亚称将不再向乌克兰提供武器", "content": "保加利亚总理拉德夫6月10日在部长会议上说，保加利亚军方将不再向乌克兰提供武器。拉德夫认为，乌克兰危机的外溢影响给保加利亚造成了严重的社会经济损失。拉德夫认为，各方应以全面务实的态度看待俄乌之间的冲突，并寻求外交解决途径。据保加利亚国家电台报道，自乌克兰危机升级以来，保加利亚国防部已向乌克兰提供了13批武器援助，但援助的类型及其价值暂未公布。（CCTV国际时讯）", "ctime": 1781152869, "time_str": "12:41:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260611/c677381576.shtml"}, {"id": "4509307", "title": "5款国产脑机接口创新产品在上交会首发", "content": "第十二届中国（上海）国际技术进出口交易会（以下简称“上交会”）6月11日在上海开幕。5款国产脑机接口创新产品在上交会现场实现首发。这5款新品，完整覆盖从脑科学基础研究、高端医疗设备、康复康养到大众日常消费的全产业链条，代表了中国脑机产业自主创新的最新成果。（人民财讯）", "ctime": 1781152198, "time_str": "12:29:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260611/c677381458.shtml"}, {"id": "4509303", "title": "越南从加拿大进口7.3万吨液化天然气", "content": "越南石油天然气股份公司（PV GAS）发布邮件声明称，该公司已于上周日接收来自加拿大的约7.3万吨液化天然气，下周还将从澳大利亚接收1.5万吨液化天然气，以保障国内发电用气需求。上半年液化天然气进口总量将达35.4万吨。企业正为7月初的后续液化天然气船货对接供应商。该公司还从美国购入4.5万吨液化石油气。6月至7月已签约液化石油气总量达14万吨。", "ctime": 1781152068, "time_str": "12:27:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260611/c677381433.shtml"}, {"id": "4509301", "title": "中国驻南非大使馆召开促合规保安全视频会议", "content": "中国驻南非大使馆10日召开视频会议，针对近期南非国内持续紧张的社会安全形势，敦促在南中资企业和侨商侨企开展自查整改，依法合规经营，提高风险防范意识。中国驻南非大使吴鹏在讲话中强调，南非社会安全形势紧张，大家应保持高度警惕，提高风险防范意识。依法合规经营是企业和个人安身立命的根本，广大在南中资企业和侨商侨企务必认真开展自查整改，杜绝非法用工情况。（新华社）", "ctime": 1781151906, "time_str": "12:25:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260611/c677381399.shtml"}, {"id": "4509295", "title": "豆包手机硬件产品负责人林夕已离职", "content": "记者获悉，字节跳动AI硬件团队Ocean核心成员、豆包手机硬件产品负责人林夕已于近期离职。这是字节自2024年启动AI手机项目以来，首位出走的核心硬件负责人。据悉，林夕此前长期任职于华为终端，是Pura X阔折叠手机硬件产品负责人，2026年林夕从华为转入字节Ocean团队，直接向刘成城汇报。（科创板日报）", "ctime": 1781151671, "time_str": "12:21:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260611/c677381356.shtml"}, {"id": "4509289", "title": "中国与埃塞俄比亚签署中文教育合作协议", "content": "中国-埃塞俄比亚中文教育合作协议签约仪式暨中埃塞人文交流招待会10日在埃塞首都亚的斯亚贝巴举行，来自两国教育、文化、外交、媒体、智库等领域近百名嘉宾出席活动。中国驻埃塞俄比亚大使陈海和埃塞俄比亚教育部国务部长金德亚·加布雷希沃特分别代表两国教育部签署合作协议，这标志着中文教育正式纳入埃塞国民教育体系。（新华社）", "ctime": 1781151313, "time_str": "12:15:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260611/c677381210.shtml"}, {"id": "4509287", "title": "深圳三大可售人才房项目集中入市 提供近千套房源，最低均价“2”字头", "content": "从深圳市安居集团获悉，安居桐悦湾、安居华越龙苑、安居海岸悦府三个可售人才房项目近期集中供应，合计推出房源993套，最低配售均价为2.96万元/平方米。（新浪财经）", "ctime": 1781151234, "time_str": "12:13:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260611/c677381197.shtml"}, {"id": "4509285", "title": "机构：受存储器市场打破历史规律推动，第一季度半导体市场营收突破3000亿美元", "content": "在半导体行业创下历史新高的一年之后，新年伊始依然延续了强劲的增长势头。根据Omdia的最新研究，2026年第一季度的半导体营收较2025年第四季度环比增长27%，达到3190亿美元。存储器营收是推动这一增长的主要动力，其在2026年第一季度的环比增幅超过80%。（界面新闻）", "ctime": 1781151222, "time_str": "12:13:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260611/ const META     = {"update_time": "2026-06-11 14:10:32", "sentiment_score": 55.39906103286385, "agents": []};

// 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
