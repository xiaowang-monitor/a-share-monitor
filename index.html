的盐酸甲氧氯普胺注射液的《药品注册证书》。该药品主要用于治疗恶心、呕吐等症状，2025年前三季度全国医院销售额达6624.45万元。常乐制药针对该药品的研发投入约为318万元，已获得4个生产批件。", "ctime": 1776156265, "time_str": "16:44:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260414/c675978178.shtml"}, {"id": "4224133", "title": "世名科技：2026年第一季度净利润213.76万元，同比下降60.73%", "content": "世名科技公告，2026年第一季度营业收入1.52亿元，同比下降4.41%。净利润213.76万元，同比下降60.73%。", "ctime": 1776156131, "time_str": "16:42:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260414/c675978123.shtml"}, {"id": "4224123", "title": "上期所调整黄金等期货相关合约涨跌停板幅度和交易保证金比例", "content": "上期所发布关于调整黄金等期货相关合约涨跌停板幅度和交易保证金比例的通知，经研究决定，下述合约自上市时起，涨跌停板幅度和交易保证金比例调整如下： 黄金AU2607合约的涨跌停板幅度为17%，套保持仓交易保证金比例为18%，一般持仓交易保证金比例为19%； 白银AG2704合约的涨跌停板幅度为20%，套保持仓交易保证金比例为21%，一般持仓交易保证金比例为22%。如遇《上海期货交易所风险控制管理办法》第十三条规定情况，则在上述涨跌停板幅度、交易保证金比例基础上调整。关于涨跌停板和交易保证金的其他事项按《上海期货交易所风险控制管理办法》及相关业务规则执行。", "ctime": 1776156099, "time_str": "16:41:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260414/c675978113.shtml"}, {"id": "4224121", "title": "远东传动：预计2026年第一季度净利润同比增长47.90%～76.07%", "content": "远东传动公告，预计2026年第一季度净利润为4200万元至5000万元，同比增长47.90%～76.07%。报告期内，公司取得良好的经营业绩，主要原因是，一方面根据中国汽车工业协会数据统计，2026年1-3月，国内商用车产销分别完成113万辆和111.4万辆，同比分别增长7.9%和6%，其中，重型货车销量31.8万辆，同比增长19.9%，行业向好带动整车厂订单增长，直接拉动公司传动轴配套需求。另一方面公司作为传动轴行业龙头，为国内90%左右商用车、工程机械主机厂核心供应商，充分受益行业复苏，同时出口快速增长，销量与营收同步提升；公司核心零部件全部自研自产，产业链垂直整合降低成本，智能化产线提效，工艺技术和产品结构持续优化，毛利率与费用管控稳步改善。", "ctime": 1776156093, "time_str": "16:41:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260414/c675978111.shtml"}, {"id": "4224111", "title": "正业科技：2025年净利润3677.58万元，同比扭亏为盈", "content": "正业科技公告，2025年营业收入8.69亿元，同比增长22.30%。净利润3677.58万元，上年同期为净亏损2.23亿元。公司计划不派发现金红利，不送红股，不以公积金转增股本。", "ctime": 1776155971, "time_str": "16:39:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260414/c675978069.shtml"}, {"id": "4224109", "title": "金岭矿业：第一季度净利润3512.67万元，同比下降28.46%", "content": "金岭矿业公告，2026年第一季度营业收入3.89亿元，同比增长9.09%。净利润3512.67万元，同比下降28.46%。", "ctime": 1776155964, "time_str": "16:39:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260414/c675978068.shtml"}, {"id": "4224105", "title": "联合国机构警告中东战事外溢效应", "content": "联合国开发计划署13日发布报告说，中东战事延宕不仅直接冲击中东地区发展前景和民众生活，其外溢效应也将对全球经济造成持久影响。这份报告在国际货币基金组织2026年春季会议期间发布。报告说，中东战事给全球带来“三重冲击”，包括能源市场震荡、粮食价格攀升和经济增长疲软。报告针对中东战事可能造成的经济影响作出3种情景推演，其中“最糟糕”情景是油气生产严重受阻6周、高生活成本持续8个月。推演显示，部分能源净进口国民众遭遇经济冲击时尤其脆弱。(新华社)", "ctime": 1776155877, "time_str": "16:37:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260414/c675978007.shtml"}, {"id": "4224095", "title": "潞安环能：2026年3月原煤产量为512万吨，商品煤销量为460万吨", "content": "潞安环能公告，2026年3月原煤产量为512万吨，商品煤销量为460万吨；累计原煤产量为1432万吨，同比增长5.53%，累计商品煤销量为1259万吨，同比增长6.07%。", "ctime": 1776155590, "time_str": "16:33:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260414/c675977878.shtml"}, {"id": "4224081", "title": "中际旭创：2026年第一季度报告披露时间提前至4月17日", "content": "中际旭创公告，原定于2026年4月24日披露的《中际旭创2026年第一季度报告》因编制工作进展顺利，现申请将披露时间提前至2026年4月17日。公司对此次变更给投资者带来的不便表示歉意，并提醒投资者注意查阅。", "ctime": 1776155526, "time_str": "16:32:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260414/c675977865.shtml"}, {"id": "4224075", "title": "巴基斯坦消息人士：尚不确定美伊谈判仍在伊斯兰堡举行", "content": "巴基斯坦消息人士14日告诉新华社记者，美国与伊朗下一轮谈判是否仍在巴首都伊斯兰堡举行尚不确定。稍早前，路透社援引4名消息人士的话报道说，美伊代表团将于本周晚些时候重返伊斯兰堡进行谈判，随后更新报道援引伊朗驻巴基斯坦大使馆官员的话称，两国代表团最早可能在本周或下周初举行谈判。报道称，伊朗代表团预留了17日至19日的时间。一些巴基斯坦媒体当天早些时候报道称，美伊谈判将于16日在伊斯兰堡重启。美国媒体同日报道称，如美伊继续谈判，瑞士日内瓦等地也被列入谈判地点考量范围。美伊代表团11日在伊斯兰堡举行谈判，谈判于12日上午结束，双方未达成任何协议。(新华社)", "ctime": 1776155497, "time_str": "16:31:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260414/c675977852.shtml"}, {"id": "4224071", "title": "中际联合：2025年净利润5.3亿元，同比增长68.47%", "content": "中际联合公告，2025年实现营业收入18.78亿元，同比增长44.64%；净利润5.3亿元，同比增长68.47%。公司拟向全体股东每股派发现金红利0.38元（含税）。", "ctime": 1776155466, "time_str": "16:31:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260414/c675977848.shtml"}, {"id": "4224069", "title": "特斯拉美股盘前涨超2%", "content": "特斯拉美股盘前涨超2%，现报359.503美元。", "ctime": 1776155426, "time_str": "16:30:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260414/c675977827.shtml"}, {"id": "4224057", "title": "多部门启动2026年度集体协商“集中要约行动”", "content": "记者14日从全国总工会了解到，全国总工会、人力资源社会保障部、中国企业联合会/中国企业家协会、全国工商联近日联合印发通知，决定共同开展2026年度集体协商“集中要约行动”，推动已建工会企业普遍开展集体协商。此次“集中要约行动”以推动协商普遍开展、助力企业稳岗增效、促进职工提技增收为核心目标，旨在通过广泛深入的集体协商，进一步稳定就业岗位、保障职工权益、激发创新创造活力，为构建和谐劳动关系、推动经济社会高质量发展提供有力支撑。根据通知，行动将推动已建工会企业普遍开展集体协商，力争百人以上企业单独签订集体合同率动态保持在85%以上；重点产业集聚区和工业园区普遍推进行业（区域）集体协商；深化平台劳动规则和算法协商，推动新就业形态劳动者权益协商实现常态化、制度化。此次行动将推进行业性、区域性集体协商纳入行动重点，明确提出针对主导产业、重点发展行业及产业集聚区，围绕劳动定额、最低工资、工资增幅等开展协商。此外，还将探索推动产业链、供应链企业在用工规范、劳动报酬、技能等级认定等方面实现协商共决与标准互认。针对新就业形态劳动者，行动将深化平台劳动规则和算法协商，落实《平台劳动规则和算法协商指引（试行）》等文件要求，聚焦订单分配、收入抽成、工作时长、考核奖惩等重点问题，以头部平台企业为牵引，开展总部所在地、重点省域和全平台协商，并推动平台用工合作企业开展二次协商，确保协商成果落地见效。(新华社)", "ctime": 1776155226, "time_str": "16:27:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260414/c675977750.shtml"}, {"id": "4224053", "title": "甘李药业：GZR33注射液Ⅲ期临床试验完成首例受试者给药", "content": "甘李药业公告，全资子公司甘李药业山东有限公司自主研发的GZR33注射液在中国开展适应症为2型糖尿病的Ⅲ期临床试验，近日成功完成首例受试者给药。GZR33注射液是公司自主研发的、具备独特药理学特征的长效基础胰岛素日制剂。相较已上市的同类产品德谷胰岛素，GZR33血药浓度达峰时间延长、峰谷比更低，血药浓度更平稳，药效持续时间更长，有望实现长效且平稳的控糖效果。", "ctime": 1776155136, "time_str": "16:25:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260414/c675977713.shtml"}, {"id": "4224051", "title": "汇源通信今日涨7.36%，4家机构专用席位净买入1.08亿元", "content": "汇源通信今日涨7.36%，成交额17.58亿元，换手率40.84%，盘后龙虎榜数据显示，4家机构专用席位净买入1.08亿元。", "ctime": 1776155128, "time_str": "16:25:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260414/c675977708.shtml"}, {"id": "4224043", "title": "沪电股份今日涨停，2家机构专用席位净买入3.11亿元", "content": "沪电股份今日涨停，成交额89.99亿元，换手率4.88%，盘后龙虎榜数据显示，深股通专用席位买入6.06亿元并卖出4.04亿元，2家机构专用席位净买入3.11亿元，有2家机构专用席位净卖出2.59亿元。", "ctime": 1776155108, "time_str": "16:25:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260414/c675977687.shtml"}, {"id": "4224039", "title": "国际能源署：预计二季度全球石油需求将出现新冠疫情以来最大降幅", "content": "当地时间4月14日，国际能源署在最新发布的月度报告中预计，2026年第二季度全球石油需求将出现自新冠疫情以来最大幅度下降。报告指出，石油消费的需求破坏现象最初在中东和亚太地区显现，随着供应短缺持续、价格上涨，这一趋势预计将进一步扩大。国际能源署表示，中东战争已引发历史上最严重的石油供应冲击，上个月全球石油供应减少约1000万桶。同时，能源价格上涨也推动俄罗斯石油出口收入大幅增加，其相关收入在2月至3月间实现翻倍增长。（央视新闻）", "ctime": 1776155090, "time_str": "16:24:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260414/c675977681.shtml"}, {"id": "4224037", "title": "九安医疗今日跌9.46%，有3家机构专用席位净卖出6.14亿元", "content": "九安医疗今日跌9.46%，成交额47.60亿元，换手率13.49%，盘后龙虎榜数据显示，深股通专用席位买入4.65亿元并卖出1.94亿元，3家机构专用席位净买入1.41亿元，有3家机构专用席位净卖出6.14亿元。", "ctime": 1776155060, "time_str": "16:24:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260414/c675977667.shtml"}, {"id": "4224033", "title": "圣阳股份今日涨停，4家机构专用席位净买入1.32亿元", "content": "圣阳股份今日涨停，成交额39.26亿元，换手率39.03%，盘后龙虎榜数据显示，深股通专用席位买入7360.78万元并卖出9675.91万元，4家机构专用席位净买入1.32亿元。", "ctime": 1 1亿元，同比增长23.13%。网络文学IP衍生品受到市场欢迎，短剧、漫剧是网络文学IP转化新兴领域里活跃的双引擎。2025年短剧全年市场规模达1080亿元，同比增长超110%。(新华社)", "ctime": 1776154819, "time_str": "16:20:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260414/c675977534.shtml"}, {"id": "4223993", "title": "新安股份：预计2026年一季度净利润同比增长171.65%-201.84%", "content": "新安股份公告，预计2026年一季度净利润为9000万元至1亿元，同比增长171.65%至201.84%。预计归属于上市公司股东的扣除非经常性损益的净利润为7000万元至8000万元，与上年同期-2327万元相比，增加9327万元至1.03亿元。2026年一季度业绩预增的主要原因是：受宏观经济和市场供需格局改善影响，公司主导产品的市场价格呈现整体上涨趋势，使得公司盈利能力持续修复。公司通过精细化管理，积极推进降本增效工作，取得显著成效。公司紧抓市场机遇，灵活调整市场策略，凭借渠道与产品优势不断优化产品结构，终端高毛利产品比重进一步提升。", "ctime": 1776154711, "time_str": "16:18:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260414/c675977493.shtml"}, {"id": "4223985", "title": "美学者说美政府已失去体制约束", "content": "美国哥伦比亚大学教授杰弗里・萨克斯当地时间4月13日对媒体表示，美以伊战争是“一场灾难”，充分说明了美国政府已失去体制约束。萨克斯指出，对于美国来说，这基本上就是一场由总统特朗普再加上“一个病态的国防部长”选定的战争，特朗普身边的核心团队深知这是一场悲剧、一场闹剧，却仍然随声附和——而美国政府运作程序已经崩溃，国会形同虚设，国家安全委员会名存实亡，情报机构也基本相当于不存在。萨克斯说，以色列此前已经（在巴勒斯坦加沙地带）犯下了种族灭绝罪，如今又同美国在伊朗挑起了一场毫无意义的战争，导致数千人死亡，并且已经开始对整个世界造成毁灭性影响。(CCTV国际时讯)", "ctime": 1776154633, "time_str": "16:17:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260414/c675977460.shtml"}, {"id": "4223977", "title": "土耳其东南部一高中发生枪击事件，已致7人受伤", "content": "土耳其东南部尚勒乌尔法省希韦雷克区的一所高中发生一起校园枪击事件。据初步消息，一名学生持枪向校内人员开火，目前已造成7人受伤。接到报警后，当地医疗急救、警察以及特种作战部队已被紧急派遣至现场处置。有消息称，袭击者在校内劫持了部分学生作为人质。目前，安全部队已紧急疏散了校内大部分学生，相关部门正在全力采取行动试图制服袭击者。（央视新闻）", "ctime": 1776154596, "time_str": "16:16:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260414/c675977441.shtml"}, {"id": "4223973", "title": "和胜股份：签订2.38亿元建设工程标准施工合同", "content": "和胜股份公告，公司与广东建安昌盛控股集团有限公司签订了《广东省建设工程标准施工合同》，合同签约价格为人民币2.38亿元，合同工期预计545个日历天。该合同的签署有利于公司扩产新能源汽车项目按照计划实施、建成投产，提升公   const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
