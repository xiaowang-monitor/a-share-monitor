const NEWS     = [{"id": "4615975", "title": "今年上半年全国特种设备安全形势总体平稳", "content": "今天（29日）是全国特种设备安全日，记者从上海举办的2026年“全国特种设备安全日”主会场活动上了解到，今年上半年，全国特种设备未发生重特大事故，安全形势总体平稳。市场监管总局有关负责人介绍，全国市场监管系统持续推进安全生产治本攻坚三年行动，深入开展化工企业特种设备排查整治，检查化工企业4.47万家次，督促整改隐患4.68万项，开展电梯安全筑底三年行动，累计排查整改隐患电梯13.2万台。下一步，市场监管总局将加快制定《客运索道安全技术规程》、修订《大型游乐设施安全要求》强制性国家标准，提高涉旅特种设备基本安全要求。同时全面提升特种设备数字化监管、非现场监管水平。加强特种设备追溯体系建设，实施全生命周期质量追溯和源头治理。（央视新闻）", "ctime": 1782732683, "time_str": "19:31:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260629/c677808841.shtml"}, {"id": "4615939", "title": "东方钽业：原材料价格及产品销售价格变化直接影响公司的利润水平", "content": "东方钽业股票交易异常波动公告，公司主要从事稀有金属钽、铌及合金等的研发、生产、销售和进出口业务。公司主要产品原材料为钽铌矿石，钽铌矿石原料90%以上依赖进口，海外进口原材料会受国际政治、宏观经济等多种因素的影响，会导致一定时期内原材料供应不足或价格波动较大的风险。公司钽铌及其合金产品的原材料占其主营业务成本比例最高，为公司成本的主要构成部分，原材料价格及产品销售价格变化直接影响公司的利润水平。请投资者充分关注原材料、产品价格涨跌趋势及未来供需关系变化均存在较大不确定性。", "ctime": 1782732604, "time_str": "19:30:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260629/c677808809.shtml"}, {"id": "4615933", "title": "*ST艾艾：公司股票将于7月1日撤销退市风险警示", "content": "*ST艾艾公告，公司股票将于2026年6月30日停牌一天，2026年7月1日起复牌并撤销退市风险警示，证券简称变更为“艾艾精工”，日涨跌幅限制由5%变为10%。2025年年度实现利润总额4945.2万元，归属于母公司所有者的净利润为4383.99万元，营业收入为3.3亿元，归属于上市公司股东的净资产为4.52亿元。", "ctime": 1782732465, "time_str": "19:27:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260629/c677808764.shtml"}, {"id": "4615931", "title": "快意电梯：控股股东快意股权拟协议转让2525.16万股，占总股本7.5%", "content": "快意电梯公告，公司控股股东东莞市快意股权投资有限公司拟通过协议转让方式向实际控制人罗爱文女士转让其持有的无限售流通股2525.16万股，占公司总股本的7.5%。转让价格为12.35元/股，转让价款合计为3.12亿元。转让完成后，公司控股股东仍为东莞市快意股权投资有限公司，实际控制人仍为罗爱文女士。本次权益变动尚需经深圳证券交易所合规性确认，并在中国证券登记结算有限责任公司深圳分公司办理股份转让过户登记手续。", "ctime": 1782732452, "time_str": "19:27:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.c 5863", "title": "特许通讯美股盘前涨超20%", "content": "特许通讯美股盘前涨超20%，现报160.98美元。", "ctime": 1782731769, "time_str": "19:16:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260629/c677808579.shtml"}, {"id": "4615859", "title": "李强主持召开国务院常务会议，审议通过《“十五五”碳达峰行动方案》和《国民健康“十五五”规划》", "content": "李强主持召开国务院常务会议，审议通过《“十五五”碳达峰行动方案》和《国民健康“十五五”规划》。(央视)", "ctime": 1782731741, "time_str": "19:15:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260629/c677808574.shtml"}, {"id": "4615851", "title": "李强主持召开国务院常务会议，研究当前外贸形势和贸易强国建设有关工作", "content": "李强主持召开国务院常务会议，研究当前外贸形势和贸易强国建设有关工作。(央视)", "ctime": 1782731682, "time_str": "19:14:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260629/c677808546.shtml"}, {"id": "4615835", "title": "李强主持召开国务院常务会议，听取人工智能发展情况汇报", "content": "据央视新闻，李强主持召开国务院常务会议，听取人工智能发展情况汇报。会议指出，要深刻把握人工智能演进趋势，完善支持政策和治理体系，牢牢掌握发展主动权。要加力推进人工智能创新突破，加快关键技术攻关和超大规模智算集群建设，强化高质量数据供给，加强人才、资金等要素保障，支持企业开展基础研究和前沿探索。要深入实施“人工智能+”行动，发挥我国产业体系完备、应用场景丰富等优势，促进智能产品和服务加快规模化商业应用。要守牢人工智能安全底线完善科技伦理、测试认证等制度规则，构建动态适应、分级分类的安全监管体系，加强国际人工智能治理合作。", "ctime": 1782731607, "time_str": "19:13:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260629/c677808516.shtml"}, {"id": "4615823", "title": "合肥城建：公司与长鑫科技无任何业务往来", "content": "合肥城建股价异动的公告，公司目前主营业务为地产开发与销售，不涉及半导体、芯片及存储等相关领域，短期内也无转型计划。截至本公告披露日，公司与长鑫科技无任何业务往来。", "ctime": 1782731560, "time_str": "19:12:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260629/c677808509.shtml"}, {"id": "4615801", "title": "王沪宁出席建设强大国内市场调研协商座谈会", "content": "建设强大国内市场调研协商座谈会6月29日在京召开，就有关民主党派中央、无党派人士开展的重点考察调研成果进行协商。中共中央政治局常委、全国政协主席王沪宁出席并讲话。 王沪宁对有关民主党派中央、无党派人士围绕建设强大国内市场深入调查研究、积极建言献策给予充分肯定。他表示，建设强大国内市场是构建新发展格局、推动高质量发展的战略支撑，是进一步全面深化改革、构建高水平社会主义市场经济体制的重要任务。要锚定“十五五”时期建设强大国内市场的任务部署，围绕“五统一、一开放”的基本要求和重点难点问题，研究提出更具深入度、更有建设性的对策建议，为党和政府科学决策、有效施策提供参考。要提高中国特色社会主义参政党和参政力量履职质效，抓好思想政治引领、议政建言、自身建设等工作，以多党合作所长为党和国家事业发展广泛凝心聚力。 民革中央主席郑建邦、民盟中央主席丁仲礼、民进中央主席蔡达峰、台盟中央主席苏辉、无党派人士代表郭雷在座谈会上介绍调研成果，并就加快建设全国统一的能源市场，深化城乡土地制度改革，扩大文化消费，深入实施提振消费专项行动、积极拓展有效投资空间，完善有利于全国统一大市场建设的体制机制等，提出务实中肯的政策建议。 (新华社)", "ctime": 1782731469, "time_str": "19:11:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260629/c677808477.shtml"}, {"id": "4615783", "title": "ST龙韵：段佩璋受让方小琴5.15%公司股份", "content": "ST龙韵公告，实际控制人方小琴与段佩璋签署《股份转让协议》，方小琴拟以10.23元/股的价格转让其持有的474.6万股公司无限售流通股份给段佩璋，占公司总股本的5.15%。本次权益变动后，段佩璋将持有公司股份2784.03万股，占公司股份总数的30.21%。", "ctime": 1782731368, "time_str": "19:09:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260629/c677808418.shtml"}, {"id": "4615705", "title": "圆通速递：股东杭州灏月减持公司股份，合计持股比例降至15.00%", "content": "圆通速递公告，股东杭州灏月企业管理有限公司及其一致行动人杭州阿里创业投资有限公司和浙江菜鸟供应链管理有限公司合计持股比例从15.87%减少至15.00%。杭州灏月在2026年6月23日至6月29日期间，通过大宗交易方式转让公司股份2982.43万股。此次变动不违反承诺，不触发强制要约收购义务，也不会导致公司控股股东和实际控制人变化。", "ctime": 1782731104, "time_str": "19:05:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260629/c677808227.shtml"}, {"id": "4615691", "title": "沃顿科技：涉及半导体及液冷领域的业务收入占公司营业收入比例不超过1%", "content": "沃顿科技股票交易异常波动的公告，公司关注到近期市场对半导体及液冷行业关注度较高，公司的主营业务为反渗透膜、纳滤膜等膜产品生产制造、膜分离工程业务以及棕纤维床垫业务。2026年初至本公告披露日，涉及半导体及液冷领域的业务收入占公司营业收入比例不超过1%。", "ctime": 1782731051, "time_str": "19:04:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260629/c677808217.shtml"}, {"id": "4615539", "title": "兰石重装：拟终止盘锦浩业EPC募投项目并将剩余募集资金永久补充流动资金", "content": "兰石重装公告，公司拟终止盘锦浩业EPC募投项目并将剩余募集资金永久补充流动资金。盘锦浩业EPC项目总体建设进度已达95%，因业主自身原因收尾工程一直处于停缓建状态。现业 ck_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260629/c677808012.shtml"}, {"id": "4615461", "title": "工业和信息化部回应规范动力储能电池供应商账款支付", "content": "据新华社，工业和信息化部回应规范动力储能电池供应商账款支付。负责人表示，近年来我国动力和储能电池产业快速壮大，国内外市场同步扩容，产业链关键技术多点突破，已形成覆盖材料、电芯、系统集成、制造装备在内的全链条产业生态，为新能源汽车、新型储能等领域发展提供了有力支撑。但动力和储能电池产业整体仍处于成长期，技术路线迭代快、市场格局变化大，供应链各环节的协同机制尚不健全；上游企业面临持续研发投入与回款周期拉长的双重挤压，经营预期不稳，产业链抗风险能力偏弱；动力和储能电池企业支付供应商货款周期过长，将直接加剧供应商资金紧张，削弱其技术研发投入能力，影响产业链企业长远发展。推动缩短货款账期，既是缓解供应商经营压力、促进产业技术迭代的现实需要，也是企业完善内部治理、提升现代化管理水平的应有之义。动力和储能电池行业企业应立足长远发展，加强与供应商的互利共赢合作，携手推动产业向更高质量、更可持续的方向迈进。", "ctime": 1782730523, "time_str": "18:55:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260629/c677807981.shtml"}, {"id": "4615443", "title": "退市太和：公司股票将于2026年7月3日摘牌", "content": "退市太和公告，公司于2026年5月29日收到上海证券交易所《关于上海太和水科技发展股份有限公司股票终止上市的决定》，公司股票自2026年6月8日进入退市整理期交易，截至2026年6月29日退市整理期已结束。根据上海证券交易所安排，将于2026年7月3日对公司股票予以摘牌，股票终止上市。终止上市后，公司股票将转入全国中小企业股份转让系统依托两网公司及退市公司板块挂牌转让，主办券商为金圆统一证券有限公司。", "ctime": 1782730371, "time_str": "18:52:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260629/c677807894.shtml"}, {"id": "4615441", "title": "锐科激光：子公司拟投资5316万元建设高功率掺杂特种光纤数字化生产线二期项目", "content": "锐科激光公告，公司董事会审议通过子公司睿芯公司开展高功率掺杂特种光纤数字化生产线二期建设项目，总投资5316万元，新增MCVD系统、PCVD系统及特种光纤拉丝塔等核心设备，以提升通信、激光雷达、激光医疗等领域特种光纤研发生产能力。", "ctime": 1782730346, "time_str": "18:52:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260629/c677807861.shtml"}, {"id": "4615437", "title": "四川长虹：独立董事曲庆因连续任职满六年辞任", "content": "四川长虹公告，公司董事会于2026年6月29日收到独立董事曲庆先生的书面辞职函，因连续担任公司独立董事已满六年，曲庆先生申请辞去公司第十二届董事会独立董事职务及董事会审计委员会、提名委员会、薪酬与考核委员会、ESG管理委员会相关职务。辞任生效后，曲庆先生将不在公司担任任何职务。其辞职将在公司股东会选举产生新任独立董事之日起生效，在此之前曲庆先生将继续履行相关职责。公司正积极筹备新任独立董事候选人的提名及补选工作。", "ctime": 1782730310, "time_str": "18:51:50", "stock_code": "", "stock_n const META     = {"update_time": "2026-06-29 19:32:14", "sentiment_score": 54.977375565610856, "agents": []};

// 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
