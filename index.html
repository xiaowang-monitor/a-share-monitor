<style>
:root {

body {

  background: var(--bg-primary);
  color: var(--text-primary);

}
.mono { font-family: 'JetBrains Mono', monospace; }
.card {

  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 20px;
  transition: all 0.2s;
}
.card:hover { background: var(--bg-card-hover); border-color: #334155; }
.badge {
  display: inline-flex; align-items: center; padding: 2px 8px;
  border-radius: 6px; font-size: 12px; font-weight: 500;
}
.badge-s { background: rgba(239,68,68,0.2); color: #ef4444; }

  height: 6px; border-radius: 3px; background: #1e293b; overflow: hidden;
}
.score-bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s; }
.up { color: var(--red); }
.down { color: var(--green); }
.pulse { animation: pulse 2s infinite; }
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}
.glow { box-shadow: 0 0 20px rgba(59,130,246,0.15); }

e": 1782190818, "time_str": "13:00:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260623/c677642185.shtml"}, {"id": "4573501", "title": "现货黄金失守4120美元/盎司 纽约期金失守4140美元/盎司", "content": "现货黄金失守4120美元/盎司，日内跌1.5%。纽约期金失守4140美元/盎司，日内跌1.68%。", "ctime": 1782190770, "time_str": "12:59:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260623/c677642176.shtml"}, {"id": "4573499", "title": "阿曼重申将保障霍尔木兹海峡免费安全通行", "content": "当地时间22日晚间，阿曼外交大臣巴德尔在阿曼首都马斯喀特会见来访的伊朗伊斯兰议会议长卡利巴夫一行。会见结束后，巴德尔在社交媒体上表示，双方重点就近期美伊谅解备忘录中涉及霍尔木兹海峡的内容进行了建设性讨论，并重申将遵守国际法，保障海峡免费、安全通行。伊朗国家最高安全委员会18日发表声明称，60天内，不收取申请通过霍尔木兹海峡商船的相关费用。声明称，根据伊美谅解备忘录第5条，申请通过霍尔木兹海峡的商船必须向波斯湾海峡管理局提交申请。在60天内，申请方不需支付任何费用，这些费用将由伊朗政府承担。（央视新闻）", "ctime": 1782190765, "time_str": "12:59:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260623/c677642175.shtml"}, {"id": "4573495", "title": "现货黄金失守4130美元/盎司", "content": "现货黄金失守4130美元/盎司，日内跌1.22%。", "ctime": 1782190598, "time_str": "12:56:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260623/c677642128.shtml"}, {"id": "4573493", "title": "日本日经指数扩大跌幅，最新下跌2.0%，报70,919.03点", "content": "日本日经指数扩大跌幅，最新下跌2.0%，报70,919.03点。", "ctime": 1782190501, "time_str": "12:55:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260623/c677642111.shtml"}, {"id": "4573489", "title": "索尼集团计划近三十年来首次发行美元债券", "content": "索尼集团计划近三十年来首次发行美元债券。据一位不愿透露姓名的知情人士透露，这家日本企业集团将发行两期高级固定利率债券。5年期债券的承销商给出的收益率约为比同期限美国国债收益率高出70个基点，10年期债券利差约为90个基点。债券可能今日晚些时候定价。一位知情人士说，承销商美国银行和摩根士丹利周一与债券投资者召开了电话会议。知情人士称，新债券预计将获得穆迪评级的A2评级和标普的A+评级。(蓝鲸新闻)", "ctime": 1782190471, "time_str": "12:54:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260623/c677642104.shtml"}, {"id": "4573477", "title": "宁德时代发布全球首款实证型钠电储能场站解决方案", "content": "宁德时代近日发布了全球首款场站级钠电储能解决方案，推出了实证型钠电储能系统——天恒钠电。该钠电储能系统单套设备最高能量可达30 MWh以上，采用能量仓与功率仓分离的全模块化设计理念。交付节奏方面，宁德时代表示，中国市场将于今年9月向客户正式交付首批钠电储能系统，2026年底实现全年1 GWh出货，全球市场将于明年6月启动交付。（财联社）", "ctime": 1782190146, "time_str": "12:49:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260623/c677642034.shtml"}, {"id": "4573473", "title": "潜能恒信：公司在产项目一季度未发生非计划停产", "content": "潜能恒信在互动平台表示，一季度涠洲5-3油田的实际日产量有所下降，系公司结合当期原油价格行情、生产运营节奏主动优化开采提油安排所致。公司在产项目一季度未发生非计划停产。", "ctime": 1782190015, "time_str": "12:46:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260623/c677642016.shtml"}, {"id": "4573459", "title": "因员工数据泄露 Meta暂停其内部AI训练计划", "content": "Meta已暂停其内部人工智能训练计划，原因是员工的私人对话、绩效数据和文字记录在整个公司范围内遭到泄露。该事件被评为严重程度2级（SEV 2），严重程度等级分为0至5级，0级为最严重。今年4月，Meta公布了这项名为模型能力计划（Model Capability Initiative）的AI训练项目。该项目会采集员工的键盘输入、鼠标操作轨迹数据，用来迭代优化自家人工智能模型。(蓝鲸新闻)", "ctime": 1782189757, "time_str": "12:42:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260623/c677641926.shtml"}, {"id": "4573445", "title": "腾讯据悉考虑退出包括MARVELOUS在内的的游戏工作室", "content": "腾讯据悉考虑退出包括MARVELOUS在内的的游戏工作室。（财联社）", "ctime": 1782189589, "time_str": "12:39:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260623/c677641895.shtml"}, {"id": "4573431", "title": "美官员称美国已设立以黎停火“监督机制”", "content": "据美国有线电视新闻网（CNN）22日援引一名美国官员的话报道，美国已设立以黎停火“监督机制”，美方能够实时获取在黎巴嫩的战况信息。这名官员说，美国国务卿鲁比奥19日同以色列总理内塔尼亚胡和黎巴嫩总统奥恩通电话，“讨论巩固停火及未来对话事宜”。“基于这些通话，美国通过美军中央司令部启动了监督机制，确保我们的政策制定者实时、准确掌握在黎巴嫩的战况。”该官员说。（新华社）", "ctime": 1782189394, "time_str": "12:36:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260623/c677641853.shtml"}, {"id": "4573425", "title": "FF：发布全新Futurist人形机器人 定价8.99万美元", "content": "6月23日，Faraday Future（简称“FF”）官微消息，FF正式发布全新Futurist、FF Faber（美国首个工业级EAI轮臂机器人系列）。全新Futurist是美国首款原生适配NVIDIA Sonic全尺寸人形机器人运控系统的本体产品，定价8.99万美元。FF共拥有三大形态六大系列产品：三款人形机器人系列、两款四足仿生机器人系列、轮臂系列Faber。预计6月机器人本体出货将超100台。", "ctime": 1782189360, "time_str": "12:36:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260623/c677641839.shtml"}, {"id": "4573401", "title": "俄白呼吁共同铭记历史捍卫真相", "content": "第二届“伟大遗产-共同未来”俄罗斯与白俄罗斯联盟国家论坛20日至22日在白俄罗斯布列斯特举行。与会各方共同呼吁铭记二战历史，捍卫历史真相。 白俄罗斯总统卢卡申科向论坛致信说，此次论坛在布列斯特举行具有象征意义。85年前，在纳粹战争机器的蹂躏中，布列斯特首当其冲，向世界展现了苏联战士的伟大精神和不屈意志。他指出，当前首要任务是捍卫历史真相，防止篡改历史、拆毁英雄纪念碑以及遗忘祖辈英雄事迹的行径。 俄罗斯总统普京向论坛致信说，布列斯特要塞守卫者的精神和事迹将被永远铭记。在苏联伟大卫国战争战场上铸就的兄弟情谊和互助纽带助力俄白人民发展多方面合作，共同建设国家，并在国际舞台上捍卫合法权益。俄白和国际社会大多数国家坚决反对一切试图粉饰纳粹及其同伙暴行的企图，并将打击任何形式的新纳粹主义。 本次论坛期间，还举办了研讨会、展览、集会、文艺演出等活动。来自欧洲、亚洲和拉丁美洲等地的各国议会代表团、专家和学界代表参与论坛活动。(新华社)", "ctime": 1782188963, "time_str": "12:29:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260623/c677641719.shtml"}, {"id": "4573397", "title": "6月23日午间公告一览：桦欣控股完成收购公司74.91%股份", "content": "桦欣控股公告，香港伟业软件股份有限公司已完成收购公司74.91%股份。根据收购协议，香港伟业软件股份有限公司以1.99亿港元收购2397万股股份，占公司已发行股份总数的74.91%。此次收购由德林证券（香港）有限公司代表要约人提出无条件强制性现金要约。", "ctime": 1782188901, "time_str": "12:28:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260623/c677641699.shtml"}, {"id": "4573391", "title": "软银孙正义不看好马斯克太空数据中心 称AI竞赛决胜关键在地面算力", "content": "软银集团创始人孙正义表示，埃隆 马斯克主推的太空数据中心方案价值有限，人工智能赛道的竞争胜负将由地面算力决定。周二，孙正义在软银移动业务年度股东大会上谈及，建设太空数据中心的核心优势看似是大幅削减电力成本，但电费仅占数据中心运营总成本的极小部分，芯片等硬件才是主要开支。他补充道，即便能省下电费，也要承担高昂的物资太空运输费、维护成本，还会存在通信延迟问题，得不偿失。现场有软银股东提问，询问这家日本企业是否会效仿特斯拉CEO这套宏大构想。孙正义回应：“未来数年的AI角逐，远比十年后的远景布局更关键。”软银将专注打造规模庞大、实力雄厚的地面数据中心算力，他认为：“先发者胜。”", "ctime": 1782188621, "time_str": "12:23:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260623/c677641634.shtml"}, {"id": "4573387", "title": "国网江西省电力有限公司原党委委员、工会主席梁剑接受审查调查", "content": "国网江西省电力有限公司原党委委员、工会主席梁剑涉嫌严重违纪违法，目前正接受中央纪委国家监委驻国家电网有限公司纪检监察组和江西省宜春市监察委员会纪律审查和监察调查。（人民财讯）", "ctime": 1782188504, "time_str": "12:21:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260623/c677641610.shtml"}, {"id": "4573383", "title": "英特尔看好中国词元经济", "content": "6月22日，第四届链博会在北京开幕。Apple亚洲采购及运营管理副总裁崔玉善表示：“苹果公司在中国已经深耕了30年。在苹果全球200家最重要的供应商里，有80%在中国有生产基地。我们认为，中国的供应商和制造业，不断创新、不断探索、不断追求完美的精神，对我们非常重要。”英特尔中国区董事长王稚聪表示：“词元经济的提出和算电协同，是非常好的高屋建瓴的战略。我们觉得中国一直保持稳定的开放，营商环境也越来越好，所以英特尔在华经营，对未来的经营充满信心。”（央视财经）", "ctime": 1782188363, "time_str": "12:19:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260623/c677641585.shtml"}, {"id": "4573379", "title": "白宫将召集主要军工企业，讨论扩大弹药生产", "content": "当地时间6月22日，白宫将在24日召开主要国防承包商会议，以敦促军工企业扩大弹药生产。消息称，美国对伊朗发动的打击持续数月，导致美军弹药库存紧张。美国总统特朗普22日证实将举行此次会议，他表示，美国希望确保拥有足够的导弹储备，如果一些汽车公司有剩余产能，将推动它们签订协议生产导弹。他还指出，通用汽车公司有意愿转型生产武器。今年1月，白宫发布行政命令，禁止国防承包商发放股息或进行股票回购，要求他们集中精力提高武器产量。（央视新闻）", "ctime": 1782188189, "time_str": "12:16:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260623/c677641499.shtml"}, {"id": "4573377", "title": "杭州土拍收金28.34亿元 未来科技城宅地溢价率超33%", "content": "杭州两宗低密宅地今日成功出让，总成交金额28.34亿元。其中，未来科技城地块规划建筑面积6.88万平方米，经过41轮竞价，最终由建发以16.04亿元竞得，溢价率33.22%，成交楼面价23314元/平方米；湘湖地块经13轮竞价，由滨江集团以12.3亿元竞得，溢价率10.81%，成交楼面价20500元/平方米。业内人士表示，本次土拍延续核心优质地块受追捧态势，反映出房企对稀缺资源的争夺意愿依然较强，但市场并非全面回暖，优质地块仍具备获取溢价能力。（财联社）", "ctime": 1782188031, "time_str": "12:13:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260623/c677641458.shtml"}, {"id": "4573375", "title": "德意志银行：如果美联储加息，黄金价格可能会跌至3800美元/盎司", "content": "德意志银行：如果美联储加息，黄金价格可能会跌至3800美元/盎司。", "ctime": 1782187847, "time_str": "12:10:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260623/c677641422.shtml"}, {"id": "4573371", "title": "港股午评：恒生指数跌1.13%，恒生科技指数跌2.21%", "content": "港股午间收盘，恒生指数跌1.13%，恒生科技指数跌2.21%。恒指港股通ETF银华（159318）跌1.7%，港股通科技ETF鹏华（159751）跌2.56%。板块方面，生命科学工具、生物科技板块涨幅靠前；电气设备、客运航空公司板块跌幅靠前。个股方面，星源材质涨30.51%，英矽智能涨9.25%，极智嘉-W涨7.17%，中远海能涨6.16%，剂泰科技-P涨5.5%；MINIMAX-W跌14.84%，博泰车联跌12.0%，智谱跌11.37%，五一视界跌10.17%，胜宏科技跌8.92%。", "ctime": 1782187753, "time_str": "12:09:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260623/c677641397.shtml"}, {"id": "4573337", "title": "字节豆包Seedance 2.5将在7月初正式发布 单视频生成长度可达30秒", "content": "火山引擎Force大会上，豆包视频生成模型最新版本Seedance2.5亮相，实现三项核心升级：单条视频生成长度最长可达30秒，突破同类产品15至20秒瓶颈；支持最多50个全模态素材联合输入，生成过程可稳定保持复杂素材细节；提供灵活视频编辑能力，支持在不改变整体画面的前提下进行局部内容修改。新模型目前处于内测尾声，将于7月初正式上线。（科创板日报）", "ctime": 1782186988, "time_str": "11:56:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260623/c677641117.shtml"}, {"id": "4573327", "title": "端午假期收官 长三角铁路累计发送旅客1690余万人次", "content": "端午假期运输昨天（6月22日）落下帷幕，长三角铁路5天累计发送旅客1690余万人次，日均超338万人次，较去年同期增长逾4%。其中，6月19日端午节当天发送旅客403.1万人次，创历年端午假期运输单日客发量新高。今年端午恰逢高考结束，学生客流明显增长，长三角前往北京、广州、厦门、青岛等方向以及区域内上海、南京、杭州、合肥等城市间客流集中。18日、19日、21日、22日单日客流均保持在320万人次以上，形成持续客流高峰。为应对大客流，铁路部门增开旅客列车1044列，其中夜间高铁272列。为方便旅客夜间候乘，上海、南京、杭州、合肥等地车站启动通宵运营，部分列车开展了包粽子、编五彩绳、制作香囊等端午主题文化活动。针对夏季高温，车上还上新了时令鲜果、冰激凌等消暑餐饮。（央视新闻）", "ctime": 1782186869, "time_str": "11:54:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260623/c677641092.shtml"}, {"id": "4573315", "title": "伊朗副外长：伊美决定成立多个磋商工作组", "content": "据伊朗伊斯兰共和国通讯社23日报道，伊朗外交部副部长加里巴巴迪称，伊朗、美国等各方已决定成立多个磋商工作组，在未来谈判中推进解除对伊朗制裁、核问题等事宜。各方还同意，“解冻120亿美元被冻结资金”一事将立即进入执行阶段。 加里巴巴迪说，负责监督谈判的高级别委员会21日至22日举行会议后，各方进行了技术性会谈，以确定谅解备忘录的执行机制等事项，并达成了必要共识。 加里巴巴迪说，根据共识，各方决定成立4个工作组，分别负责制裁解除、核问题、经济重建与发展、监督与执行事宜。各方还决定设立一个“联络点”，负责商船安全通过霍尔木兹海峡事宜，并就黎巴嫩局势设立冲突预防机制。 加里巴巴迪同时说，在技术性会谈中，各方就发布伊朗石油等产品和服务出口许可事宜，以及解冻伊朗被冻结资产相关共识“进行了必要跟进”。 加里巴巴迪表示，接下来的谈判将在高级别委员会主持下进行，伊朗伊斯兰议会议长卡利巴夫、伊朗外长阿拉格齐、美国副总统万斯、巴基斯坦总理夏巴兹、卡塔尔首相兼外交大臣穆罕默德将出席下阶段谈判。 卡塔尔和巴基斯坦作为伊朗同美国谈判的调解方22日发表联合声明说，在谅解备忘录的基础上，各方同意设立一个高级别委员会，负责监督谈判进程。据伊朗媒体22日报道，从当日开始，由加里巴巴迪率领的伊朗团队在瑞士同美方举行技术性会谈，伊朗主要谈判团队已离开瑞士回国。(新华社)", "ctime": 1782186555, "time_str": "11:49:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260623/c677640992.shtml"}, {"id": "4573313", "title": "灵伴科技在深圳成立智能公司 含多项AI业务", "content": "企查查APP显示，近日，深圳洛奇智能有限公司成立，法定代表人为江涛，注册资本为2500万元，经营范围包含：人工智能基础软件开发；人工智能行业应用系统集成服务；信息系统集成服务；智能机器人销售等。企查查股权穿透显示，该公司由灵伴科技（杭州）股份有限公司全资持股。", "ctime": 1782186511, "time_str": "11:48:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260623/c677640976.shtml"}, {"id": "4573309", "title": "中国气象局：雨带北抬、极端性增强 北方气候格局出现新特征", "content": "应急管理部今天（6月23日）举行汛期安全知识发布会，通报近期防汛形势和重点工作举措。会上，总台央视记者提问，近年来，北方地区降雨明显增多，有的地方还出现极端强降雨，“雨带北抬”成为公众关注的热点，请问相关的负责人能否介绍一下有关情况？中国气象局国家气候中心首席预报员陈丽娟介绍，我国降水的年代际特征是自然变律和人类活动共同影响的结果，表现出周期性和趋势性混合的特征。（央视新闻）", "ctime": 1782186426, "time_str": "11:47:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260623/c677640948.shtml"}, {"id": "4573305", "title": "湖北黄石、咸宁发布暴雨红色预警", "content": "湖北黄石市气象台2026年6月23日11时6分发布暴雨红色预警信号：过去3小时阳新洋港镇（泉口）降雨量达60毫米，过去12小时该镇降雨量达127毫米。预计未来4小时洋港镇降水持续，累计雨量将达160毫米以上，山洪、地质灾害、中小河流风险极高，请特别加强防范。咸宁市气象台2026年6月23日9时2分升级暴雨预警信号为红色：过去3小时通城最大降水出现在石南镇为62毫米。目前，受强降雨云团持续影响，预计今天白天，通城石南镇、北港镇及其周边乡镇仍将有20-40毫米降水，最大小时雨强40毫米，并伴有雷暴大风，山区山洪、地质灾害、城乡积涝、中小河流洪水风险极   } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
