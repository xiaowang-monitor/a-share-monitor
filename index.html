com.cn/20260923/c680206613.shtml"}, {"id": "5230591", "title": "美国银行：如果伊朗战事久拖不决 油价可能攀升至每桶150美元以上", "content": "美国银行周二大幅上调了油价目标，并警告称，若供应进一步收紧，油价可能突破150美元。美银策略师还表示，他们预计2027年布伦特原油的平均价格约为每桶80美元，但同时指出战略储备下降以及市场指向近期严重短缺所带来的挑战。该行还表示，如果伊朗战事久拖不决持续消耗库存，油价未来可能会攀升至每桶150美元以上。", "ctime": 1790140621, "time_str": "13:17:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260923/c680206277.shtml"}, {"id": "5230585", "title": "《大湾区氢能汽车高速公路通行费优惠及跨省互认倡议》发布：推动氢能汽车高速免费", "content": "9月22日，大湾区氢能综合应用试点城市群工作部署会在广州召开。试点期内，城市群将推广氢燃料电池汽车1.6万辆，新建加氢站100座。另外，广州发起《大湾区氢能汽车高速公路通行费优惠及跨省互认倡议书》。倡议书提出，借鉴湖北、海南等省市先行经验，推动城市群内广东、福建、湖南等省份结合本地实际研究出台有关政策，对满足条件的氢能汽车给予高速公路通行费免收的优惠；依托国家零碳公路运输通道建设布局加氢站，力争实现终端用氢成本逐步降至每千克25元以下；探索建立城市群五省高速公路通行费优惠跨省互认机制，争取率先打通省际政策壁垒，打造试点城市群氢能高速走廊典型示范。（人民财讯）", "ctime": 1790140544, "time_str": "13:15:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260923/c680206257.shtml"}, {"id": "5230583", "title": "Dataforce：8月比亚迪等品牌占欧洲市场新车总销量的近12%", "content": "据Dataforce的数据显示，8月，比亚迪等品牌占欧洲市场新车总销量的近12%。这些品牌占到了所有混合动力汽车销量的四分之一，在插电式混合动力汽车销量中所占份额达到三分之一。8月电池和混合动力汽车的需求增长了27%，抵消了燃油汽车需求的下滑。得益于电动汽车的增长，整体市场增长了4.6%。", "ctime": 1790140527, "time_str": "13:15:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260923/c680206242.shtml"}, {"id": "5230527", "title": "富达投资：黄金的公允价值已达到每盎司5000美元", "content": "富达投资全球宏观总监Jurrien Timmer表示，随着黄金交易从基于利率转向基于流动性，黄金的公允价值已经达到每盎司5000美元。他在9月初时曾预期，市场假设美国财政部会为了压低收益率而继续大幅增加回购规模，并要求美联储的参与，这将强化货币贬值交易。而这种环境下，对黄金反而构成利好。（财联社）", "ctime": 1790140097, "time_str": "13:08:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260923/c680206074.shtml"}, {"id": "5230515", "title": "新加坡8月CPI同比增长2.3%", "content": "新加坡8月CPI同比增长2.3%，核心CPI同比增长2.2%。", "ctime": 1790139858, "time_str": "13:04:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260923/c680205978.shtml"}, {"id": "5230495", "title": "印尼失事客轮已确认20人遇难", "content": "当地时间23日，印尼搜救部门发布消息称，截至目前，救援人员已发现20具失事客轮遇难者遗体。此外，仍有115人失联。（央视新闻）", "ctime": 1790138841, "time_str": "12:47:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260923/c680205489.shtml"}, {"id": "5230493", "title": "国际绿色航运走廊联盟成立", "content": "全球可持续交通高峰论坛（2026）期间，国际绿色航运走廊联盟正式成立。国际绿色航运走廊联盟由中国国际可持续交通创新和知识中心联合中远海运集团、法国达飞集团、中国能建集团、上海港务集团等共同发起，是全球首个基于国际绿色航运走廊合作的非政府间国际组织。目前，该联盟创始会员涵盖来自12个国家的45家头部企业，业务范围覆盖绿色航运产业链上下游，多元化、国际化特点明显。未来，联盟将统筹推进国际绿色航运走廊建设合作，推动绿色船舶、绿色燃料、绿色港口等国内规则与国际标准相衔接，加快推动绿色船用燃料国际认证体系建设，协调落实运输便利化措施，打造具有国际影响力的示范项目，并开展技术研发、成果转化和能力建设，成为促进国际航运产业创新转型的新平台。（人民财讯）", "ctime": 1790138652, "time_str": "12:44:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260923/c680205406.shtml"}, {"id": "5230489", "title": "东软集团成立信息科技公司 含数字文化创意内容应用服务", "content": "企查查APP显示，近日，营口思芮信息科技有限公司成立，法定代表人为孟浩，经营范围包含数字文化创意内容应用服务；信息技术咨询服务；动漫游戏开发；数据处理和存储支持服务等。企查查股权穿透显示，该公司由东软集团旗下上海思芮信息科技有限公司全资持股。（人民财讯）", "ctime": 1790138523, "time_str": "12:42:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260923/c680205358.shtml"}, {"id": "5230447", "title": "9月23日午间公告一览：瑞和数智完成认购纳真科技股份", "content": "瑞和数智发布须予披露交易公告，公司已完成认购纳真科技公司国际发售项下之国际发售股份。公司已按发售价每股32.96港元获配发95万股纳真科技股份，该等获配股份的发售价总额为3131.2万港元。公司应缴付的认购款项总额为3162.78万港元，其中包括发售价总额以及经纪佣金、证监会交易征费、会计及财务汇报局交易征费及联交所交易费。纳真科技股份已于2026年9月22日在联交所主板上市及开始买卖，认购事项及认购款项缴付已于上市日期落实。", "ctime": 1790136945, "time_str": "12:15:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260923/c680204685.shtml"}, {"id": "5230445", "title": "IDC：2026 Q2全球手持智能相机出货589万台，大疆占73%市场份额", "content": "9月23日，国际数据公司（IDC）发布《2026年第二季度全球手持智能相机市场跟踪报告》。报告显示，2026年第二季度全球手持智能相机市场出货总量达589万台，同比增长57%。其中，大疆拿下了全球73%的市场份额。此外，口袋云台相机是该行业最大细分赛道，二季度全球出货量达279万台，大疆Pocket系列云台相机在该赛道份额达93%。", "ctime": 1790136724, "time_str": "12:12:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260923/c680204586.shtml"}, {"id": "5230443", "title": "沐曦股份等成立科技公司", "content": "企查查APP显示，近日，上海曦华基智科技有限公司成立，法定代表人为余竞超，注册资本为1000万元，经营范围包含计算机系统服务；销售代理；计算机软硬件及辅助设备批发；计算机软硬件及辅助设备零售等。企查查股权穿透显示，该公司由上海基流科技股份有限公司、沐曦股份全资子公司沐曦数智（上海）科技有限公司等共同持股。（人民财讯）", "ctime": 1790136711, "time_str": "12:11:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260923/c680204583.shtml"}, {"id": "5230437", "title": "完美世界成立科技创新产业合伙企业", "content": "企查查APP显示，近日，北京完美致远科技创新产业合伙企业（有限合伙）成立，出资额3亿元，经营范围包含信息技术咨询服务；企业管理；商务代理代办服务等。企查查股权穿透显示，该合伙企业由完美世界旗下重庆亚克科技发展有限公司及完美世界（重庆）企业管理咨询有限公司共同持股。（人民财讯）", "ctime": 1790136408, "time_str": "12:06:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260923/c680204414.shtml"}, {"id": "5230435", "title": "优必选发布全球首部《人形机器人科技伦理治理白皮书》", "content": "9月20日，主题为“具身向善，协同共治”的具身智能伦理治理研讨会在深圳举办。会上，优必选科技正式发布全球首部《人形机器人科技伦理治理白皮书》。由工业和信息化部电子第五研究所、深圳市标准技术研究院、深圳市区域科技伦理服务平台、深圳市律师协会等单位参与编制，北京大学、中国人民大学、复旦大学等高校专家学者给予指导。（新华社）", "ctime": 1790136294, "time_str": "12:04:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260923/c680204343.shtml"}, {"id": "5230423", "title": "港股午评：恒生指数跌0.76%，恒生科技指数跌0.97%", "content": "港股午间收盘，恒生指数跌0.76%，恒生科技指数跌0.97%。恒指港股通ETF银华（159318）跌0.7%，港股通科技ETF鹏华（159751）跌0.35%。板块方面，仪器仪表、计算机外围设备板块涨幅靠前；油品石化贸易、建筑产品Ⅲ板块跌幅靠前。个股方面，基本半导体涨8.71%，联想控股涨7.83%，琻捷电子科技涨5.96%，建滔积层板涨5.81%，金斯瑞生物科技涨4.94%；德适-B跌8.34%，天数智芯跌7.6%，伟禄科技股份跌7.42%，智谱跌6.87%，海致科技集团跌6.45%。", "ctime": 1790136073, "time_str": "12:01:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260923/c680204223.shtml"}, {"id": "5230421", "title": "中国警队赴塞尔维亚执行警务联合巡逻任务", "content": "应塞尔维亚内务部邀请，公安部组建中塞警务联合巡逻中国警队，于9月22日赴塞执行为期三周的警务联合巡逻任务。此系中方第3次赴塞开展警务联合巡逻，双方已形成稳定成熟的双边执法协作机制。公安部国际合作局有关负责人表示，警务联合巡逻是中方积极践行四大全球倡议的务实举措，中国警队将继续秉承“合作、创新、法治、共赢”的理念，协助塞警方稳妥解决在塞中国游客和华人华侨的安全诉求，充分展现中国警察良好形象，持续深化中塞执法安全合作，服务中塞双边关系发展。（央视新闻）", "ctime": 1790136038, "time_str": "12:00:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260923/c680204210.shtml"}, {"id": "5230417", "title": "iQOO公布自研电竞芯片Q4", "content": "9月23日，iQOO举办技术沟通会，公布自研电竞芯片Q4，该芯片支持全场景光线追踪，计划搭载于新机iQOO 16。（界面新闻）", "ctime": 1790135951, "time_str": "11:59:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260923/c680204148.shtml"}, {"id": "5230413", "title": "马斯克预测未来世界：20年后可能有1000亿台人形机器人", "content": "特斯拉CEO埃隆 马斯克接受央视财经专访。谈及机器人，他展望未来美好图景：每个人都能拥有专属机器人，它们可以照料年迈的父母，看护孩童，还能担任孩子的一对一私教，承担各类工作。未来世界，一个人可以操控成百上千台，甚至上万台实体机器人和数字智能体。“我的预测是十年内至少有10亿台人形机器人；未来15年或许达到100亿台；未来20年可能达到1000亿台。”（央视财经）", "ctime": 1790135569, "time_str": "11:52:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260923/c680203995.shtml"}, {"id": "5230411", "title": "美伊联大期间举行间接会谈 伊朗再提重开海峡条件", "content": "伊朗外交部发言人巴加埃23日表示，当地时间22日在美国纽约举行的第81届联合国大会一般性辩论期间，伊朗与美方通过调解方卡塔尔举行会谈，向美方传达关于重开霍尔木兹海峡的条件。巴加埃当天在纽约接受伊朗伊斯兰共和国通讯社采访时说，伊方提出的重开霍尔木兹海峡的条件包括美国应永久停止对伊朗及其地区盟友的军事行动，解除对伊海上封锁和全部制裁，归还伊朗被冻结资产并赔偿损失等。另据伊朗媒体消息，此次会谈是“应美方要求”。伊方同意美总统特使威特科夫的会晤请求，是出于传达“伊朗关于重开霍尔木兹海峡条件”的需要。（新华社）", "ctime": 1790135542, "time_str": "11:52:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260923/c680203979.shtml"}, {"id": "5230409", "title": "约旦国王说以色列野心不止巴勒斯坦", "content": "当地时间9月22日，约旦国王阿卜杜拉二世在纽约联合国大会上发表讲话时表示，这届以色列政府的肆无忌惮已达到了骇人听闻的程度。他警告，以色列的野心不止于巴勒斯坦，它的扩张欲望已成为地区性威胁。阿卜杜拉二世指出，巴以冲突久拖不决的后果十分危险，但国际社会仅选择管控冲突，而非直面它。他表示，以色列的目标就是“通过摧毁加沙以及事实上吞并约旦河西岸，让巴勒斯坦国的建立变得不可能”。（新浪财经）", "ctime": 1790135398, "time_str": "11:49:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260923/c680203909.shtml"}, {"id": "5230407", "title": "布伦特原油日内跌1%，现报94.43美元/桶", "content": "布伦特原油日内跌1%，现报94.43美元/桶。", "ctime": 1790135060, "time_str": "11:44:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260923/c680203750.shtml"}, {"id": "5230405", "title": "三六零首批获得国家级人工智能安全一级资质", "content": "记者今日获悉，中国信息安全测评中心颁发首批“国家信息安全测评信息安全服务资质（人工智能安全类一级）”，360集团成为首批6家获证企业之一。（人民财讯）", "ctime": 1790134846, "time_str": "11:40:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260923/c680203656.shtml"}, {"id": "5230403", "title": "青岛：出台推动知识产权质押融资实施方案", "content": "青岛市近日印发《关于推动知识产权质押融资提质扩面的实施方案（2026—2028年）》，同步配套发布《青岛市“青知贷”产品指引》《知识产权质押融资内部估值体系实施指引》，聚焦知识产权质押融资“降本、提质、扩面、增效”工作目标，积极营造全链条服务生态。《实施方案》涵盖总体要求、工作举措和保障机制三大板块，以“1+2”制度体系为保障，以“1+N”配套服务机制为支撑，推动构建优政策指引、优产品供给、优评估体系、优配套服务，促信息共享、促部门联动、促流程简化、促考核激励、促成本压降、促培训宣导、促生态共建的“四优七促”全流程工作体系，打造知识产权质押融资“青岛模式”。", "ctime": 1790134833, "time_str": "11:40:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260923/c680203648.shtml"}, {"id": "5230389", "title": "ETF两市成交额报2956.5亿元，较昨日此时缩量1033.71亿元", "content": "截至目前，ETF两市成交额报2956.5亿元，较昨日此时缩量1033.71亿元，分类型来看，股票型ETF成交额599.89亿元，债券型ETF成交额1795.33亿元，货币型ETF成交额202.74亿元，商品型ETF成交额33.3亿元，QDII型ETF成交额325.25亿元。", "ctime": 1790134308, "time_str": "11:31:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260923/c680203362.shtml"}, {"id": "5230387", "title": "2只摊余成本债基提前结募，分别为红土创新和贝莱德旗下产品", "content": "新批的摊余成本债基募集2天后即陆续出现提前结募。今天，贝莱德基金公告称，贝莱德稳利63个月封闭式债基募集截止日由原定的10月20日提前至9月22日，即募集期缩短至2天。红土创新基金的公告也提到，募集截止时间提前至9月23日，即募集期缩短至3天，其中，所有代销机构募集截止时间已提前至9月22日，9月23日仅可通过公司的直销中心办理认购。截至目前，本周开始认购的6只摊余成本债基，已有2只提前结募。（财联社）", "ctime": 1790134285, "time_str": "11:31:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260923/c680203359.shtml"}, {"id": "5230385", "title": "ETF午评：标普生物科技ETF领涨2.43%，能源化工ETF领跌3.27%", "content": "ETF午间收盘涨跌不一，标普生物科技ETF（159502）领涨2.43%，纳指生物科技ETF（513290）涨2.39%，科创200ETF（589320）涨2.00%，能源化工ETF（159981）领跌3.27%，传媒ETF（159805）跌2.65%，传媒ETF（512980）跌2.51%。", "ctime": 1790134270, "time_str": "11:31:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260923/c680203357.shtml"}, {"id": "5230383", "title": "A股午评：创业板指高开低走跌0.43%，PET铜箔、生物制品、培育钻石板块涨幅居前", "content": "A股三大指数早盘集体下跌，截至午盘，上证指数跌0.36%，深证成指跌0.58%，创业板指跌0.43%，北证50涨2.19%，科创50指数跌0.12%。全市场成交额11711亿元，较上日缩量2696亿元，全市场超3500只个股下跌。板块题材上，玻璃基板、培育钻石、PET铜箔、生物制品、PCB概念板块涨幅居前；影视院线、AI视频、文化传媒、煤炭开采加工、油气开采及服务板块跌幅居前。盘面上，PET铜箔板块震荡走高，中一科技、胜利精密、沃格光电涨停，泰金新能、江南新材、德龙激光涨幅居前。CRO概念板块表现活跃，奥浦迈、益诺思、义翘神州、昊帆生物、皓元医药涨幅居前。房地产板块冲高回落，华远控股、我爱我家涨停，万科A一度涨停，华丽家族、中华企业、陆家嘴涨幅居前。影视院线板块低开低走，中视传媒触及跌停，欢瑞世纪、博纳影业、北京文化跌幅居前。文化传媒板块走势低迷，龙版传媒、华媒控股触及跌停，中信出版跌超10%，中国出版、流金科技、新华都跌幅居前。", "ctime": 1790134250, "time_str": "11:30:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260923/c680203353.shtml"}, {"id": "5230381", "title": "股指期货早盘收盘 主力合约多数下跌", "content": "股指期货早盘收盘，主力合约多数下跌。沪深300股指期货(IF)主力合约跌0.40%，上证50股指期货(IH)主力合约跌0.26%，中证500股指期货(IC)主力合约跌0.23%，中证1000股指期货(IM)主力合约涨0.04%。", "ctime": 1790134224, "time_str": "11:30:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260923/c680203340. t": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260923/c680203157.shtml"}, {"id": "5230361", "title": "阿里云宣布新一轮全球基础设施扩建计划", "content": "阿里云在2026云栖大会上宣布新一轮全球基础设施扩建计划，未来一年将在8个国家和地区新增数据中心，包括：将于土耳其、芬兰和荷兰首次设立云计算地域节点（Region），并扩建马来西亚、德国、阿联酋、法国和中国香港的数据中心，进一步提升全球算力供给和本地化云与AI服务能力。同时，阿里云还将升级SmartFusion、SmartVideo等面向国际市场的AI产品。（科创板日报）", "ctime": 1790133681, "time_str": "11:21:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260923/c680203086.shtml"}, {"id": "5230351", "title": "拓竹科技回应专利诉讼：将申请审后复核并上诉", "content": "近日，拓竹科技与美国3D打印企业Stratasys之间持续两年多的专利诉讼迎来新进展。9月18日，美国得州东区联邦地区法院马歇尔分院陪审团作出裁决，认定拓竹科技相关公司侵犯Stratasys四项3D打印专利，并认定构成故意侵权，判赔约2760万美元，折合人民币约1.9亿元。不过目前，法院并没有因陪审团认定“故意侵权”而进一步提高赔偿额。拓竹方面仍可提出审后动议并进入上诉程序，因此目前的判决并不意味着双方专利争议的最终结果。从拓竹方面了解到，公司不认同本次陪审团裁决结果。根据相关法律，拓竹有权申请审判后复核并提起上诉，公司将依法行使上述权利，通过正当法律程序维护自身合法权益。（南方都市报）", "ctime": 1790133414, "time_str": "11:16:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260923/c680202932.shtml"}, {"id": "5230349", "title": "国家粮食和物资储备局：今年秋粮收购准备工作已就绪", "content": "国家粮食和物资储备局有关负责人日前在国新办举行的新闻发布会上介绍，我国秋粮旺季收购一般从9月下旬开始至次年4月底结束，目前秋粮收购准备工作已就绪，将围绕守住农民“种粮卖得出”底线、推动粮食价格保持在合理水平两个目标抓好秋粮收购。（新华社）", "ctime": 1790133368, "time_str": "11:16:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260923/c680202913.shtml"}];
const SECTORS  = [{"name": "金融", "hit_count": 46, "etfs": []}, {"name": "人工智能", "hit_count": 45, "etfs": []}, {"name": "数据要素", "hit_count": 31, "etfs": []}, {"name": "半导体", "hit_count": 29, "etfs": []}, {"name": "消费", "hit_count": 17, "etfs": []}, {"name": "新能源", "hit_count": 11, "etfs": []}, {"name": "医药", "hit_count": 9, "etfs": []}, {"name": "军工", "hit_count": 8, "etfs": []}];
const META     = {"update_time": "2026-09-23 14:11:45", "sentiment_score": 61.111111111111114, "agents": []};

// 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
