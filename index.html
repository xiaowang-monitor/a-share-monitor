const NEWS     = [{"id": "4403349", "title": "美媒：美伊框架协议“已达成95%”", "content": "美国福克斯新闻频道24日援引一名美国官员的话报道说，美国和伊朗的框架协议目前“已达成95%”，双方在伊朗“核储备”和霍尔木兹海峡问题上达成协议，目前正在就“措辞”进行磋商。这名未透露姓名的美国官员否认了美国很快与伊朗达成协议的可能性，他说：“我们尚未达成协议，也不会在今天或明天签署协议。”他推测美国总统特朗普可能给美伊双方谈判代表5到7天时间来达成协议。这名官员还表示，美国有多种选择，如果美伊双方未能达成协议，美国“可以恢复军事打击”。特朗普24日在社交媒体发文，称“如果我与伊朗达成协议，那将会是一份好的、合适的协议”。他还说：“目前没人看过它或知道它的内容。它还没有完全谈妥。”（新华社）", "ctime": 1779696062, "time_str": "16:01:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260525/c676945762.shtml"}, {"id": "4403341", "title": "陈茂波：香港是欧洲金融机构和投资者低配了的市场", "content": "香港特区财政司司长陈茂波发文分享欧洲三国之行。他表示感受最深的是欧洲求变意识强烈，在经贸、投资和创科等多个领域，香港和欧洲可以务实合作、共创双赢。对欧洲，香港价值主张在三方面尤为突出。首先，香港是欧洲金融机构和投资者低配了的市场。从证券、债券、货币、衍生工具以至数字资产等，香港提供了丰富投资产品和风险管理工具。其次，双方可探索跨境投资与监管合作，相互拓展市场。第三在于金融创新，香港在数字资产发展和监管方面走在欧洲的前面，彼此有不少合作和互鉴空间。(蓝鲸新闻)", "ctime": 1779695984, "time_str": "15:59:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260525/c676945559.shtml"}, {"id": "4403339", "title": "美方被曝敦促伊斯兰国家与以关系正常化 但“未获响应”", "content": "据美国方面24日消息，两名知情美国官员透露，美国总统特朗普23日与一些伊斯兰国家领导人通话时，试图把正在谈判的美伊协议同“亚伯拉罕协议”挂钩，敦促这些国家与以色列关系正常化，不过没有得到相关国家的响应。据披露，特朗普23日同沙特、阿联酋、卡塔尔、土耳其、埃及、约旦、巴林领导人以及巴基斯坦陆军参谋长穆尼尔通电话，讨论伊朗问题。特朗普在通话中称，如果美伊达成协议，他期望那些尚未与以色列关系正常化的国家能够加入“亚伯拉罕协议”。（央视新闻）", "ctime": 1779695913, "time_str": "15:58:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260525/c676945540.shtml"}, {"id": "4403337", "title": "维科技术：宁波市工业投资有限责任公司及宁波工业投资集团合计持股比例降至4.99%", "content": "维科技术公告，信息披露义务人宁波市工业投资有限责任公司及宁波工业投资集团通过集中竞价交易方式减持公司股份，持股比例从5.12%降至4.99%。其中，宁波市工业投资有限责任公司持股比例从4.8%降至4.67%，减持数量为66.44万股；宁波工业投资集团持股比例保持0.32%不变。此次权益变动是由于信息披露义务人自身资金需求所致，不会导致公司控股股东和实际控制人发生变化。", "ctime": 1779695902, "time_str": "15:58:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10 体迎来“韬（τ）定律”，中国定义将改写世界", "content": "据人民锐评消息，中国在全球半导体领域首次提出新原则，华为发布“韬（τ）定律”，主张通过“时间缩微”代替“几何缩微”，实现半导体的持续演进。这一创新技术路径已在华为的381款芯片中得到验证，展示出其可行性和商业潜力。此举不仅为中国科技自立提供了新启示，更为全球半导体产业探索出一条“第二曲线”。面对国际技术封锁，中国通过自主创新和开放合作，展现出科技自立自强的新可能性，为全球科技创新贡献力量。", "ctime": 1779694980, "time_str": "15:43:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260525/c676944840.shtml"}, {"id": "4403277", "title": "明阳电气：控股股东中山明阳新增质押4.77%", "content": "明阳电气公告，公司控股股东中山明阳于2026年5月22日解除质押835万股，占其所持6.39%、占公司总股本2.66%；同期新增质押1500万股，占其所持11.49%、占公司总股本4.77%，质权人为渤海国际信托股份有限公司，用于补充流动资金。截至披露日，中山明阳持股1.31亿股，已质押6245万股，占其所持47.83%、占公司总股本19.87%。", "ctime": 1779694961, "time_str": "15:42:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260525/c676944826.shtml"}, {"id": "4403273", "title": "天阳科技：实控人欧阳建平解除质押1.70%股份", "content": "天阳科技公告，公司控股股东、实际控制人欧阳建平于2026年5月21日解除质押828万股，占其所持股份10.06%、占公司总股本1.70%，质押起始日为2025年5月15日，质权人为云南国际信托有限公司。截至公告日，欧阳建平持股8228.02万股，累计质押5103万股，占其所持股份62.02%、占公司总股本10.45%。", "ctime": 1779694957, "time_str": "15:42:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260525/c676944824.shtml"}, {"id": "4403271", "title": "晶升股份：股东询价转让定价58.33元/股，有效认购倍数3.11倍", "content": "晶升股份公告，股东鑫瑞集诚（厦门）创业投资合伙企业（有限合伙）及其一致行动人吴亚宏此前披露拟通过询价转让股份。根据2026年5月25日询价申购情况，初步确定的本次询价转让价格为58.33元/股。参与询价转让报价及申购的机构投资者共29家，合计有效认购股份数量为860万股，对应有效认购倍数为3.11倍。本次拟转让股份已获全额认购，初步确定受让方为15家机构投资者，拟受让股份总数为276.73万股。受让方在受让后6个月内不得转让。", "ctime": 1779694939, "time_str": "15:42:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260525/c676944817.shtml"}, {"id": "4403269", "title": "九强生物：获得2项发明专利证书", "content": "九强生物公告，公司于近期收到中华人民共和国国家知识产权局颁发的2项专利证书，专利名称分别为“用于确定血型抗原的检测试剂”和“一种皮质醇检测试剂盒”，专利权人均为九强生物，专利类型均为发明，授权日期均为2026年5月19日。上述发明专利证书的取得不会对公司近期生产经营产生重大影响，但有利于发挥公司的知识产权优势，促进技术创新，提升公司的核心竞争力。", "ctime": 1779694921, "time_str": "15:42:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260525/c676944802.shtml"}, {"id": "4403267", "title": "上纬新材工商信息新增人工智能硬件研发销售等经营范围", "content": "记者注意到，根据企查查信息，近日上纬新材变更了经营范围，新增电子产品销售；人工智能硬件销售;智能家庭消费设备制造；智能家庭消费设备销售；软件开发；软件销售；人工智能基础资源与技术平台；人工智能公共服务平台技术咨询服务；人工智能应用软件开发；机械零件、零部件销售;计算机软硬件及辅助设备零售；电子、机械设备维护(不含特种设备)；互联网销售(除销售需要许可的商品)。 此前，该公司管理层面现核心调整：原董事长、法定代表人蔡朝阳卸任，田华接任法定代表人，“稚晖君” 彭志辉正式出任董事长一职。（科创板日报）", "ctime": 1779694895, "time_str": "15:41:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260525/c676944790.shtml"}, {"id": "4403257", "title": "意大利圣安娜高等研究学院推动机器人技术与人类生活结合", "content": "意大利比萨圣安娜高等研究学院的机械智能研究所正在推动机器人技术与人类生活的紧密结合。该研究所的人机交互实验室正致力于开发外骨骼设备和康复机器人，以改善人类生活质量和工作安全性。研究人员强调，机器人技术的核心在于适应和服务于人类需求，而非替代人类。圣安娜高等研究学院已与中国高校展开合作，希望在康复机器人、外骨骼等领域加强交流，共同推动技术的全球应用。(新华社)", "ctime": 1779694721, "time_str": "15:38:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260525/c676944669.shtml"}, {"id": "4403251", "title": "广期所碳酸锂、多晶硅期货仓单环比均减少 工业硅期货仓单持平", "content": "广期所品种仓单及变化如下：碳酸锂期货仓单52143手，环比上个交易日减少904手；多晶硅期货仓单15020手，环比上个交易日减少290手；工业硅期货仓单29406手，环比上个交易日持平。", "ctime": 1779694645, "time_str": "15:37:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260525/c676944617.shtml"}, {"id": "4403249", "title": "济民健康：控股子公司取得一项专利权转让手续合格通知书", "content": "济民健康公告，控股子公司海南济民博鳌国际医院有限公司与广州达博生物制品有限公司完成《一种多靶点溶瘤腺病毒的构建方法及应用》专利转让手续，取得国家知识产权局下发的《手续合格通知书》。该专利申请日为2023年9月28日，原专利权人为广州达博生物制品有限公司，变更后专利权人为海南济民博鳌国际医院有限公司。专利权转让涉及的DB006溶瘤腺病毒注射液项目，目前处于临床Ⅰ期，适应症聚焦于实体肿瘤相关疾病。", "ctime": 1779694585, "time_str": "15:36:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260525/c676944548.shtml"}, {"id": "4403235", "title": "立讯精密：商业航天业务方面目前已供应部分部件", "content": "立讯精密发布投资者关系活动记录表公告，在人形机器人领域，当前行业最需要的是机器人专用标准零部件。立讯常熟工厂已具备相关能力，可以配合核心客户同步开发这类专用零部件，不必完全沿用工业或汽车领域的现有零部件。商业航天业务方面，立讯目前已供应部分部件，但规模不大；海外客户普遍对地缘政治因素较为敏感，产业规模化仍需要一定时间。从物理极限来看，896G铜连接仍存在较大挑战，目前行业尚未找到明确的突破方案。行业专家判断，448G铜连接可以满足至2030年前后的需求。在公司当前服务的产品中，我们看到未来光连接的需求规模会远大于铜连接，但铜连接的技术门槛同样很高。两者并非简单替代关系，而是会长期共存：短距离场景适用铜连接，长距离及更高速率场景对光连接的需求更大；当铜连接接近信号传输极限时，需要通过光连接解决问题。因此，光铜并进与头部客户布局光芯片、光纤厂商并不矛盾。", "ctime": 1779694532, "time_str": "15:35:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260525/c676944509.shtml"}, {"id": "4403233", "title": "宣泰医药：公司产品盐酸安非他酮缓释片获得哥伦比亚INVIMA批准", "content": "宣泰医药公告，近日，公司收到哥伦比亚国家药品和食品监督管理局的通知，公司向其申报的盐酸安非他酮缓释片的仿制药申请获得正式批准。盐酸安非他酮缓释片的主要成分是盐酸安非他酮，盐酸安非他酮属于氨基酮类抗抑郁药，本次获批适应症为治疗重度抑郁症以及预防季节性情感障碍。", "ctime": 1779694522, "time_str": "15:35:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260525/c676944502.shtml"}, {"id": "4403225", "title": "光大期货：美伊局势缓和，燃料油周一跌超7%", "content": "船期数据显示，中东5月高硫发货量预计仅为45万吨，环比继续减少60万吨左右，同比下降380万吨；其中伊朗5月发货量在10万吨以下。俄罗斯5月高硫发货量同样不太理想，环比下降60万吨、同比下降90万吨至140万吨左右。需求方面，我国炼厂开工率继续下滑对于高硫燃料油进口需求形成抑制，我国截至目前5月高硫进口量仅有20万吨左右。发电端，备货需求仍在持续，埃及5月高硫进口量预计环比上升40万吨至50万吨左右。因此，尽管短期中东局势缓和或带来燃料油价格下修，但夏季燃料需求高峰期的到来，加上中东地区缺乏新的石油出口以及库存持续减少，以及俄罗斯能源基础设施屡遭无人机袭击，限制了其燃料油产量，可能导致7-8月期间石油市场进入危险区域，中期供应或仍有限制因素，价格或难以完全回吐地缘事件带来的全部溢价。（光大期货）", "ctime": 1779694453, "time_str": "15:34:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260525/c676944445.shtml"}, {"id": "4403215", "title": "中国化学：2026年1-4月新签合同额1284.66亿元", "content": "中国化学公告，2026年1-4月公司新签合同额合计1284.66亿元。按业务类型分，工程业务1242.96亿元（化学工程1124.85亿元，其他工程118.11亿元），实业业务38.92亿元，现代服务业2.78亿元；按地区分，境内合同额853.95亿元，境外430.71亿元。4月单笔合同额5亿元以上重大合同包括：衡阳绿色盐碱产业基地项目EPCC总承包25.5亿元、陕西延长榆林乙醇醋酸下游项目公辅系统EPC工程13.55亿元、磴口县风光制氢一体化项目制氢部分PC工程9.25亿元等。", "ctime": 1779694419, "time_str": "15:33:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260525/c676944412.shtml"}, {"id": "4403213", "title": "津药药业：子公司获贝美前列素滴眼液注册证书，累计研发投入1793.48万元", "content": "津药药业公告，公司子公司津药和平（天津）制药有限公司近日收到国家药品监督管理局核准签发的贝美前列素滴眼液（规格0.03%，3ml:0.9mg）《药品注册证书》，注册分类为化学药品4类。该药品用于降低开角型青光眼及高眼压症患者的眼压。津药和平于2020年1月提交境内生产药品注册上市许可申请，2026年5月取得注册证书，累计投入研发费用约1793.48万元。据米内网数据，该药品2024年、2025年国内销售额分别为1862万元、1669万元。", "ctime": 1779694408, "time_str": "15:33:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260525/c676944373.shtml"}, {"id": "4403209", "title": "ST龙元：公司及控股子公司累计涉案金额约8.2亿元", "content": "ST龙元公告，公司及控股子公司连续十二个月内诉讼事项累计涉案金额约8.2亿元，占公司最近一期经审计净资产的11.59%。作为原告涉及的诉讼事项金额为229.14万元，作为被告涉及的诉讼事项金额为8.17亿元。截至公告披露日，公司及控股子公司不存在单项涉案金额超过1000万元且占公司最近一期经审计净资产绝对值10%以上的重大诉讼、仲裁事项，也不存在其他应披露而未披露的诉讼、仲裁事项。", "ctime": 1779694375, "time_str": "15:32:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260525/c676944333.shtml"}, {"id": "4403197", "title": "万方城投：公司股票终止上市", "content": "万方城投公告，2026年3月16日至2026年4月13日期间，公司在连续二十个交易日的股票收盘总市值均低于5亿元，触及终止上市情形。深圳证券交易所决定公司股票终止上市，不进入退市整理期，将于终止上市决定后十五个交易日内摘牌。", "ctime": 1779694327, "time_str": "15:32:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260525/c676944300.shtml"}, {"id": "4403187", "title": "习近平将会见巴基斯坦总理夏巴兹", "content": "5月25日下午，国家主席习近平将在北京人民大会堂会见来华进行正式访问的巴基斯坦伊斯兰共和国总理夏巴兹·谢里夫。(央视新闻)", "ctime": 1779694232, "time_str": "15:30:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260525/c676944260.shtml"}, {"id": "4403181", "title": "伊朗外交部：伊美达成共识“不意味着即将签署协议”", "content": "据伊朗塔斯尼姆通讯社25日报道，伊朗外交部发言人巴加埃表示，伊朗和美国已就大部分问题达成共识，但“这并不意味着即将签署协议”。(新华社)", "ctime": 1779694212, "time_str": "15:30:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260525/c676944245.shtml"}, {"id": "4403179", "title": "机构：预测6月液晶电视面板价格继续全面持平", "content": "全球液晶电视面板市场的产品价格在5月全线停涨。事实上，4月的涨价动能已经明显收尾，其最后一涨后成为阶段性高点。洛图科技（RUNTO）认为，当前市场进入了弱势整理期，该阶段初步先看到7月。预测6月价格继续全面持平。至7月，市场稳中偏弱，存在小幅回落压力，但大跌概率低。（科创板日报）", "ctime": 1779694133, "time_str": "15:28:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260525/c676944163.shtml"}, {"id": "4403169", "title": "伊朗全国已有20座机场恢复运营", "content": "当地时间5月25日，伊朗民航组织发言人表示，在美伊临时停火生效后，目前伊朗全国已有20座机场恢复运营，这意味着约40%的机场已重新恢复运营。据悉，梅赫拉巴德机场、伊玛目霍梅尼国际机场、马什哈德机场、设拉子机场、伊斯法罕机场等机场目前均已重新开放。大不里士机场也将在未来一周内恢复运营。（央视新闻）", "ctime": 1779693986, "time_str": "15:26:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260525/c676943902.shtml"}, {"id": "4403167", "title": "伊朗外交部：现阶段不与美方谈核问题细节", "content": "伊朗外交部发言人巴加埃表示，同美国谈判的重点是结束战事，“现阶段我们不谈核问题的细节”。（新华社）", "ctime": 1779693811, "time_str": "15:23:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260525/c676943807.shtml"}, {"id": "4403165", "title": "迈威生物等投资成立生物科技公司", "content": "企查查APP显示，近日，迈威视（上海）生物科技有限公司成立，法定代表人为由伟智，注册资本为1000万元，经营范围包含：医学研究和试验发展；第一类医疗器械销售；第二类医疗器械销售；药品批发；药品进出口等。企查查股权穿透显示，该公司由迈威生物、上海迈威视康企业管理合伙企业（有限合伙）等共同持股。（人民财讯）", "ctime": 1779693803, "time_str": "15:23:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260525/c676943776.shtml"}, {"id": "4403159", "title": "银行对英国企业贷款降至近30年来最低水平", "content": "由于经济增长乏力以及针对贷款机构的监管收紧，银行对英国企业的贷款已降至近30年来的最低水平，这尤其削弱了小企业的信贷供应。（新华财经）", "ctime": 1779693690, "time_str": "15:21:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260525/c676943703.shtml"}, {"id": "4403131", "title": "伊朗媒体：伊美双方均未在协议草案中就核问题作出任何承诺", "content": "伊朗学生通讯社25日援引伊朗高级外交官的话报道称，在伊朗与美国达成的初步协议草案中，双方均未就核问题和高丰度浓缩铀问题作出任何承诺。（新华社）", "ctime": 1779693000, "time_str": "15:10:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260525/c676943036.shtml"}, {"id": "4403127", "title": "王毅同新加坡外长维文会谈", "content": "2026年5月25日，中共中央政治局委员、外交部长王毅在北京同新加坡外长维文举行会谈。王毅表示，过去一年来，在两国领导人战略引领和双方共同努力下，中新全方位高质量的前瞻性伙伴关系保持良好势头。两国总理去年实现互访，两国共同庆祝建交35周年，各领域合作不断迈上新水平。中新大小不同，但都是世界的稳定因素。面对变乱交织的国际形势，中新都坚定维护多边主义，都坚持自由贸易，都倡导以联合国为核心的国际体系。两国应持续加强战略沟通，增进相互信任，共同应对当前层出不穷的全球挑战，维护好地区和平稳定大局。(外交部网站)", "ctime": 1779692928, "time_str": "15:08:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260525/c676942975.shtml"}, {"id": "4403125", "title": "国家能源局：截至4月底全国累计发电装机容量39.9亿千瓦 同比增长14.2%", "content": "国家能源局发布1-4月份全国电力统计数据。截至4月底，全国累计发电装机容量39.9亿千瓦，同比增长14.2%。其中，太阳能发电装机容量12.5亿千瓦，同比增长26.2%；风电装机容量6.6亿千瓦，同比增长22.0%。1-4月份，全国发电设备累计平均利用925小时，比上年同期降低84小时。", "ctime": 1779692818, "time_str": "15:06:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260525/c676942923.shtml"}, {"id": "4403121", "title": "国家卫生健康委：我国累计发布1750项食品安全国家标准", "content": "国家卫生健康委今天举行新闻发布会，介绍食品安全与营养健康有关情况。会上介绍，目前我国已累计发布1750项食品安全国家标准，涉及2万多个指标，覆盖了340多种食品类别。这套体系分成了通用标准、产品标准、生产规范和检验方法四大类，从原料到生产、从运输到储存，每一个环节都有标准可依。（央视新闻）", "ctime": 1779692783, "time_str": "15:06:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260525/c676942904.shtml"}, {"id": "4403109", "title": "欧洲主要股指开盘集体上涨", "content": "欧洲主要股指开盘集体上涨，欧洲斯托克50指数涨1.05%，法国CAC40指数涨0.87%，德国DAX指数涨0.96%。", "ctime": 1779692655, "time_str": "15:04:15", "stock_code": "", "stock_n const META     = {"update_time": "2026-05-25 16:03:05", "sentiment_score": 56.27906976744186, "agents": []};

// 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
