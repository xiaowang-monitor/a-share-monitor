<style>

* { margin:0; padding:0; box-sizing:border-box; }
body {

  background: var(--bg-primary);
  color: var(--text-primary);
  min-height: 100vh;

.mono { font-family: 'JetBrains Mono', monospace; }
.card {

}
.card:hover { background: var(--bg-card-hover); border-color: #334155; }
.badge {
  display: inline-flex; align-items: center; padding: 2px 8px;
  border-radius: 6px; font-size: 12px; font-weight: 500;
}
.badge-s { background: rgba(239,68,68,0.2); color: #ef4444; }
.badge-a { background: rgba(245,158,11,0.2); color: #f59e0b; }
.badge-b { background: rgba(59,130,246,0.2); color: #3b82f6; }
.badge-c { background: rgba(100,116,139,0.2); color: #94a3b8; }
.score-bar {
  height: 6px; border-radius: 3px; background: #1e293b; overflow: hidden;
}
.score-bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s; }
.up { color: var(--red); }
.down { color: var(--green); }
.pulse { animation: pulse 2s infinite; }
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}
.glow { box-shadow: 0 0 20px rgba(59,130,246,0.15); }
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg-primary); }
::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
</style>

8", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260429/c676374831.shtml"}, {"id": "4295499", "title": "知情人士：泡泡玛特并非传统意义上进军家电领域 基本不对业绩增量有影响", "content": "近期，泡泡玛特跨界布局家电持续引发话题。尽管还未开售，目前LABUBU冰箱在二手交易平台的报价溢价超过数倍。对此，一位接近泡泡玛特的知情人士表示，泡泡玛特并非传统意义上进军家电行业，而是将小冰箱等作为承载IP表达的全新载体。从过往乐园、饰品、甜品、积木等业务路径来看，泡泡玛特对新业务的探索是为了进一步拓宽IP的创新表达，让泡泡玛特能以更丰富的形态陪伴融入消费者日常生活。“从业绩的角度来看，太早期了，短期内对业绩增量不会有太大影响。”（证券时报）", "ctime": 1777442316, "time_str": "13:58:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260429/c676374818.shtml"}, {"id": "4295457", "title": "民爆光电成立精密科技公司 含AI及机器人业务", "content": "企查查APP显示，近日，惠州厦芝精密科技有限公司成立，经营范围包含人工智能应用软件开发；智能机器人销售；人工智能硬件销售；数控机床销售等。企查查股权穿透显示，该公司由民爆光电全资持股。（人民财讯）", "ctime": 1777442091, "time_str": "13:54:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260429/c676374747.shtml"}, {"id": "4295455", "title": "“债市一姐”告别华西证券，拟转任兴业证券固收首席", "content": "4月29日，有消息称，华西证券原首席经济学家兼研究所副所长刘郁已离职，中国证券协会官网的证券从业系统已经查不到其信息。这位在固收研究领域享有“债市一姐”声誉的明星分析师，在加盟华西证券仅两年后再度选择新平台，其动向引发市场高度关注。记者经多方核实了解到，刘郁确已从华西证券离职，其下一站拟转任兴业证券固收首席分析师。(中国证券报)", "ctime": 1777442072, "time_str": "13:54:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260429/c676374741.shtml"}, {"id": "4295451", "title": "千味央厨短线闪崩触及跌停", "content": "千味央厨短线闪崩触及跌停，成交额4.37亿元。", "ctime": 1777441982, "time_str": "13:53:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260429/c676374682.shtml"}, {"id": "4295437", "title": "抖音“五一”消费预测：小城游火热 多地吃喝游玩团购订单增长超6成", "content": "4月29日，抖音生活服务发布“五一”消费前瞻数据显示，4月11日至4月27日，平台上地方菜团购销售额同比增长43%，酒店宾馆增长54%，景点票券增长45%，综合商场增长88%。三线及以下小城游受热捧，柳州、赣州、开封、湖州等抖音吃喝游玩团购订单增长超6成；上海、福州、厦门、郑州、成都等热门旅游城市消费走热。（人民财讯）", "ctime": 1777441772, "time_str": "13:49:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260429/c676374605.shtml"}, {"id": "4295427", "title": "国家中医药管理局：《中医体质分类与判定》从“治已病”转向“治未病”", "content": "国家中医药管理局今天（29日）召开新闻发布会，介绍中医药标准化工作进展及新发布中医药国家标准有关情况。作为国家标准之一的《中医体质分类与判定》在体质分类判定方面有哪些特点？在中医药养生保健领域发挥了什么作用？针对这些问题，在发布会现场，中国工程院院士、国医大师王琦介绍，《中医体质分类与判定》的核心价值，在于推动健康管理从“治已病”转向“治未病”，为中医药养生保健的科学化、规范化、个性化发展奠定了坚实基础。（央视新闻）", "ctime": 1777441683, "time_str": "13:48:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260429/c676374573.shtml"}, {"id": "4295419", "title": "沪深京三市成交额超2万亿元，较上日此时缩量79亿元", "content": "据同花顺iFinD数据，沪深京三市成交额超2万亿元，较上日此时缩量79亿元，预计全天成交金额约2.5万亿元。截至目前，沪市成交额8629亿元，深市成交额11226亿元，北证50成交额145亿元。", "ctime": 1777441560, "time_str": "13:46:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260429/c676374530.shtml"}, {"id": "4295415", "title": "中证500股指期货(IC)主力合约日内涨超2%", "content": "中证500股指期货(IC)主力合约日内涨超2%，现报8248.4点。", "ctime": 1777441475, "time_str": "13:44:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260429/c676374487.shtml"}, {"id": "4295397", "title": "百度美股夜盘跳水，现跌超3%", "content": "百度美股夜盘跳水，现跌超3%。港股百度集团跌幅扩大至4%。", "ctime": 1777441216, "time_str": "13:40:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260429/c676374405.shtml"}, {"id": "4295381", "title": "央国企数智创新联合实验室揭牌", "content": "第九届数字中国建设峰会期间，央国企数智创新联合实验室正式揭牌。该实验室由国务院国资委信息中心、北京市政务和数据管理局共同指导，中国电信、北京数据集团合作运营。中国电信还与中国石化、中国海油、中国航信等30余家央企，发布国资央企领域可信数据空间试点成果与示范应用场景，覆盖交通运输、文化旅游、装备制造等13个重点行业。此外，中国电信政企行业具身智能应用联盟成立。（科创板日报）", "ctime": 1777441012, "time_str": "13:36:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, 原子宣布未来五年将持续投入10亿美元，打造面向机器人二次开发的专属生态。（第一财经）", "ctime": 1777440354, "time_str": "13:25:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260429/c676374072.shtml"}, {"id": "4295261", "title": "十四届全国人大常委会举行第六十六次委员长会议 听取有关草案和议案审议情况汇报 赵乐际主持", "content": "十四届全国人大常委会第六十六次委员长会议29日上午在北京人民大会堂举行。赵乐际委员长主持。会议听取了全国人大宪法和法律委员会主任委员信春鹰作的关于监狱法修订草案修改意见的汇报、关于社会救助法草案修改意见的汇报，审议了相关草案修改稿。会议听取了全国人大外事委员会主任委员娄勤俭作的关于《中华人民共和国和阿塞拜疆共和国关于刑事司法协助的条约》《中华人民共和国和哈萨克斯坦共和国、吉尔吉斯共和国、塔吉克斯坦共和国、土库曼斯坦、乌兹别克斯坦共和国永久睦邻友好合作条约》审议情况的汇报，审议了关于批准条约的决定草案代拟稿。(新华社)", "ctime": 1777440277, "time_str": "13:24:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260429/c676374050.shtml"}, {"id": "4295259", "title": "有色金属板块震荡走高，大中矿业触及涨停", "content": "有色金属板块震荡走高，大中矿业触及涨停，西藏珠峰涨超9%，西部矿业、赤峰黄金、锌业股份跟涨。据自然资源部消息，我国发布新一轮找矿突破行动成果，新一轮找矿突破战略行动取得系列新突破。", "ctime": 1777440267, "time_str": "13:24:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260429/c676374039.shtml"}, {"id": "4295253", "title": "梅赛德斯-奔驰一季度营收同比下降4.9%", "content": "梅赛德斯-奔驰集团发布财报，2026年第一季度营收为316.02亿欧元，同比下降4.9%；第一季度净利润为14.33亿欧元，同比下降17.2%。", "ctime": 1777440220, "time_str": "13:23:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260429/c676374006.shtml"}, {"id": "4295249", "title": "福建省首台国产高性能算力服务器“闽都号”在闽清下线", "content": "28日，全省首台国产高性能算力服务器“闽都号”下线仪式在闽清县云龙乡万福产业园举行，该设备将亮相第九届数字中国建设峰会。闽清县2025年引进东华闽都（福州）科技有限公司，该公司服务器生产基地于2026年1月开工建设，填补了福建国产算力硬件制造空白，成为东南沿海AI算力产业的关键支点。该产线在闽清县政府的支持下，由东华软件投资打造，专注于国产算力服务器的授权生产，产品命名为“闽都号”。（新浪财经）", "ctime": 1777440181, "time_str": "13:23:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260429/c676373992.shtml"}, {"id": "4295225", "title": "国星宇航与上海气象局共同探索“气象+太空计算”", "content": "记者获悉，成都国星宇航科技股份有限公司与上海市气象局正式签署战略合作协议。双方将围绕“气象+太空计算”创新方向，发挥各自核心优势，联合打造天地协同的智能气象服务体系，共同服务超大城市精细化治理、全球防灾减灾及气候变化应对需求。本次战略合作的一项重要基础是，依托国星宇航全球首个太空计算卫星星座的太空算力，双方已完成短临预报模型、台风风场算法模型等首批模型的在轨计算工作，成功探索出关键气象模型太空计算的技术路径。这一突破有望提升气象模型智能处理与响应的时效性，为后续规模化太空计算气象应用奠定基础。根据协议，双方还将在气象载荷数据、共建“气象-太空计算联合实验室”以及全球服务协同等方面展开深入合作。（财联社）", "ctime": 1777439912, "time_str": "13:18:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260429/c676373932.shtml"}, {"id": "4295205", "title": "中证1000股指期货(IM)主力合约日内涨超2%", "content": "中证1000股指期货(IM)主力合约日内涨超2%，现报8252.8点。", "ctime": 1777439478, "time_str": "13:11:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260429/c676373765.shtml"}, {"id": "4295195", "title": "中央网信办：将发布《人工智能应用伦理安全指引（1.0版）》", "content": "中央网信办（国家网信办）副主任牛一兵在发布会上表示，人工智能的发展为优质内容生产、网络传播创新、文明风尚培育提供了新的技术支撑和实现途径，但同时也带来了虚假信息识别、个人信息保护、AI应用伦理安全等一系列新问题、新情况、新挑战，需要在推动发展的同时，加强规范引导和有效应对。今年以来，中央网信办聚焦人工智能的新技术新应用，持续加强制度供给，会同有关部门出台了《人工智能拟人化互动服务管理暂行办法》，并就数字虚拟人信息服务管理办法面向全社会公开征求意见。本届大会专门设置了人工智能赋能网络文明建设分论坛，聚焦人工智能技术演进、创新发展和安全治理，深入开展交流研讨，推动人工智能创新成果更好地转化为网络文明建设的实际成效。届时论坛将发布《人工智能应用伦理安全指引（1.0版）》，聚焦人工智能对社会关系、情感依赖、公共秩序、个体权益等方面可能造成的影响，提供相关的实践参考，帮助各方更好地把握发展方向，守好安全底线。（中国网）", "ctime": 1777439441, "time_str": "13:10:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260429/c676373752.shtml"}, {"id": "4295159", "title": "电池产业链午后持续走强，鹏辉能源触及20cm涨停", "content": "电池产业链午后持续走强，鹏辉能源触及20cm涨停，德方纳米、丰元股份、龙蟠科技此前涨停，石大胜华、恩捷股份涨幅居前。", "ctime": 1777439379, "time_str": "13:09:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260429/c676373721.shtml"}, {"id": "4295155", "title": "港股吉利汽车午后涨幅扩大至4%", "content": "港股吉利汽车午后涨幅扩大至4%，报22.74港元。公司第一季度营收首破800亿元，核心归母净利润劲增31%。", "ctime": 1777439255, "time_str": "13:07:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260429/c676373665.shtml"}, {"id": "4295153", "title": "沪深京三市成交额超1.7万亿元，较上日此时缩量299亿元", "content": "据同花顺iFinD数据，沪深京三市成交额超1.7万亿元，较上日此时缩量299亿元，预计全天成交金额约2.5万亿元。截至目前，沪市成交额7355亿元，深市成交额9529亿元，北证50成交额125亿元。", "ctime": 1777439170, "time_str": "13:06:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260429/c676373634.shtml"}, {"id": "4295149", "title": "中科创达与思必驰达成战略合作", "content": "4月27日，中科创达与思必驰在北京国际汽车展览会正式签署全面战略合作协议。双方将以AI原生技术为核心，深化全栈技术融合与产业生态协同，推动中科创达滴水AIOS与思必驰全链路语音交互技术深度融合，推动车载人机交互向更自然、更智能方向演进。(人民财讯)", "ctime": 1777438802, "time_str": "13:00:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260429/c676373505.shtml"}, {"id": "4295141", "title": "前海蛇口自贸片区挂牌成立11年 百项制度创新成果全国推广", "content": "今年是深圳前海蛇口自贸片区挂牌成立11年。11年来，前海蛇口自贸片区已累计形成107项制度创新成果在全国复制推广、124项在广东省内复制推广，这些创新成果广泛覆盖贸易、金融、法律等重点领域，涌现出“海外知识产权保护工作机制”“跨境信用数据认可机制”等一系列具有示范意义的创新实践，有力推动深港现代服务业深度融合发展。在制度创新的持续驱动下，片区经济发展实现跨越式增长。11年来，前海蛇口自贸片区的进出口总额从2015年的712亿元跃升至2025年的5612.5亿元，年均增长约23%，2026年首季度更实现进出口总额2159.3亿元、同比增长69.6%。（央视新闻）", "ctime": 1777438440, "time_str": "12:54:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260429/c676373395.shtml"}, {"id": "4295139", "title": "北京市场监管局约谈雅迪、爱玛等8家电动自行车企业，明确五严禁", "content": "4月29日，从北京市市场监管局获悉，今年以来，北京市市场监管部门通过暗访暗查、突击夜查、溯源追查、检验检测等多种手段，严厉打击电动自行车超标改装违法行为。针对专项整治行动中发现的典型问题，近日，北京市市场监管局对雅迪、爱玛、台铃、九号、小牛、小刀、新日、绿源8家电动自行车生产企业及其在京销售代理企业开展警示约谈，明确提出“两落实、五严禁”要求。即企业需严格落实质量安全主体责任、严格落实强制性产品认证规定；严禁生产销售与认证样品不一致的车辆，严禁预留改装空间，严禁销售未经认证车辆，严禁销售不合格车辆，严禁加装改装电动自行车，切实保障消费者出行安全。（北京青年报）", "ctime": 1777437574, "time_str": "12:39:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260429/c676373128.shtml"}, {"id": "4295137", "title": "习近平：着力提高防范应对自然灾害能力 切实维护人民群众生命财产安全", "content": "中共中央政治局4月28日下午就提高防灾减灾救灾能力进行第二十五次集体学习。中共中央总书记习近平在主持学习时强调，要站在统筹高质量发展和高水平安全的战略高度，充分认识做好防灾减灾救灾工作的重要性，着力提高防范应对自然灾害能力，切实维护人民群众生命财产安全。应急管理部国家自然灾害防治研究院杨思全同志就这个问题进行讲解，提出工作建议。中央政治局的同志认真听取讲解，并进行了讨论。(央视新闻)", "ctime": 1777437030, "time_str": "12:30:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260429/c676372953.shtml"}, {"id": "4295135", "title": "香港交易所：第一季度共有40家公司上市，总集资额达1,104亿元，是去年同期的近六倍", "content": "香港交易所公告，2026年第一季，香港继续稳居全球新股市场首位，上市活动和集资额延续2025年的强劲势头。2026年第一季共有40家公司上市，总集资额达1,104亿元，是2025年第一季的近六倍，创2021年以来的第一季新高纪录。于本季度内，香港交易所迎来牧原食品股份有限公司、东鹏饮料（集团）股份有限公司及澜起科技股份有限公司上市，三家公司分别集资121亿元、111亿元及81亿元，并跻身2026年第一季全球五大新股，进一步反映香港是中国内地公司首选的集资市场之一。正在处理中的新股上市申请数目持续上升，截至2026年3月31日已达431宗，较2025年12月31日增加25%。上市后再融资活动亦持续活跃，联交所上市公司2026年第一季的上市后再融资总额1,351亿元，是过去五年中第二高的第一季纪录。", "ctime": 1777436401, "time_str": "12:20:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260429/c676372816.shtml"}, {"id": "4295133", "title": "吉利汽车：第一季度母公司拥有人应占利润为人民币41.7亿元，同比下降27%", "content": "吉利汽车公告，2026第一季度，本集团继续保持稳健的增长势头，录得总销量709,358辆，同比增长1%。受益于出口销量的强劲增长及高价值产品销售占比提升，本集团期内收入同比增长15%，收入增速高于销量增速。2026年第一季度，母公司拥有人应占利润为人民币41.7亿元，同比下降27%，主要由于本期间与去年同期相比，外汇波动所产生的影响有所不同。", "ctime": 1777435699, "time_str": "12:08:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260429/c676372669.shtml"}, {"id": "4295131", "title": "港股午评：恒生指数涨1.23%，恒生科技指数涨1.07%", "content": "港股午间收盘，恒生指数涨1.23%，恒生科技指数涨1.07%。恒指港股通ETF银华（159318）涨1.2%，港股通科技ETF鹏华（159751）涨0.76%。板块方面，多品类零售、建筑材料板块涨幅靠前；生物科技、建筑产品板块跌幅靠前。个股方面，商米科技-W涨277.31%，龙蟠科技涨17.84%，剑桥科技涨14.03%，中创新航涨12.55%，瑞浦兰钧涨11.77%；泰格医药跌7.73%，天数智芯跌7.5%，群核科技跌6.56%，万洲国际跌6.43%，宝济药业-B跌6.39%。", "ctime": 1777435291, "time_str": "12:01:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260429/c676372555.shtml"}, {"id": "4295129", "title": "税务总局首次发布丹麦、爱尔兰、阿联酋全球最低税国别实施指引", "content": "4月29日，税务总局在重庆举办《全球最低税规则国别实施指引》发布活动，首次对外发布丹麦、爱尔兰、阿联酋三国《国别实施指引》，“税路通”跨境税收知识产品体系实现再升级。据了解，《国别实施指引》立足“走出去”企业视角，从立法背景、立法概况、重要条款和征管要求等几个维度，对全球最低税税收制度规定进行系统归纳梳理，形成便于理解、便于应用的知识产品，帮助企业更准确理解规则要点、更稳妥做好合规管理。同时，指引还提供立法文本的原文链接和OECD已发布的文件链接，供企业参考学习。“这是一套权威、系统、操作性强的本土化税务解决方案前瞻指引，为跨国企业全面评估投资环境、科学设计运营架构、系统筑牢合规防线提供了非常重要的参考依据，能够帮助我们深度掌握投资东道国的税务环境，让企业‘走出去’的步伐迈得更加稳健、更加自信。”中国电力建设股份有限公司海外事业部党工委委员、财务总监王红霞表示。税务总局国际税务司有关负责人表示，《国别实施指引》的发布，是“税路通”跨境税收服务品牌深化“一国一策”精细化服务的又一重大举措，也是税务部门主动回应“走出去”企业涉税服务诉求，提升跨境税收服务针对性和有效性的实际行动。税务部门将持续跟踪国别税制变化，动态更新指引，为企业走稳海外发展之路提供更加坚实的税务支撑。(国家税务总局)", "ctime": 1777435269, "time_str": "12:01:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260429/c676372549.shtml"}, {"id": "4295127", "title": "伊朗官员：美国试图以封锁逼迫伊朗的做法是徒劳的", "content": "据伊朗伊斯兰共和国通讯社29日报道，伊朗驻埃及开罗利益代表处负责人穆杰塔巴·菲尔多西普尔表示，美国试图以海上封锁迫使伊朗接受其单方面要求是徒劳的，伊朗可以利用与周边国家的陆地边界绕过封锁。菲尔多西普尔重申，伊朗有权掌控霍尔木兹海峡的安全。(新华社)", "ctime": 1777435019, "time_str": "11:56:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260429/c676372375.shtml"}, {"id": "4295125", "title": "4月29日午间公告一览：冰轮环境荣获“全国五一劳动奖状”", "content": "冰轮环境公告，2026年4月28日，为表彰激励先进典型，凝聚起团结奋进的强大力量，中华全国总工会发布了《关于表彰2026年全国五一劳动奖的决定》，授予379个单位“全国五一劳动奖状”，冰轮环境技术股份有限公司荣获“全国五一劳动奖状”。", "ctime": 1777434909, "time_str": "11:55:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260429/c676372338.shtml"}, {"id": "4295123", "title": "阿根廷与美国举行海军联合军事演习", "content": "阿根廷国防部28日说，阿根廷海军与美国海军正在南大西洋举行联合军事演习。演习在阿根廷专属经济区内展开，多艘阿根廷海军舰艇与美国海军“尼米兹”号航空母舰和“格里德利”号驱逐舰进行了海上搜救、防御和攻击等课目演习。（新华社）", "ctime": 1777434632, "time_str": "11:50:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260429/c676372259.shtml"}, {"id": "4295121", "title": "澳大利亚将担任第四届链博会主宾国", "content": "今天上午，中国贸促会举办新闻发布会，对外公布了第四届中国国际供应链促进博览会筹备情况的最新进展。发言人介绍，近日，澳大利亚政府正式确认，将担任第四届链博会主宾国，这是澳大利亚首次以官方国家级身份正式参与链博会，将由澳大利亚贸易投资委员会牵头组织设立澳大利亚国家馆和组织相关活动。中国贸促会新闻发言人王冠男表示：目前，第四届链博会各项筹备工作进展顺利。截至目前，已在境内外举办61场路演推介活动，相关国际组织、外国政商界嘉宾和专业观众，以及广大中外企业参展参会情况超出预期。（央视新闻）", "ctime": 1777434614, "time_str": "11:50:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260429/c676372255.shtml"}, {"id": "4295119", "title": "中铁特货：董事长于永利因工作调整辞职", "content": "中铁特货公告，公司董事会于2026年4月29日收到于永利先生提交的书面辞呈。于永利先生因工作调整原因请求辞去公司董事、董事长、董事会战略委员会委员及主任（召集人）职务。辞去上述职务后，于永利先生不再担任公司及控股子公司任何职务。根据《中华人民共和国公司法》《中铁特货物流股份有限公司章程》的相关规定，于永利先生的辞呈自送达公司董事会时生效。按照公司章程规定，由副董事长顾光明先生代为履行董事长职务。公司将尽快完成新董事长补选工作。", "ctime": 1777434425, "time_str": "11:47:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260429/c676372208.shtml"}, {"id": "4295117", "title": "台积电清仓ARM股份", "content": "台积电表示，旗下子公司台积电合作伙伴有限公司已出售111万股ARM股票，交易总额2.31亿美元。本次股票出售交易时段为4月28日至29日。交易完成后，台积电不再持有任何ARM股份。", "ctime": 1777434407, "time_str": "11:46:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260429/c676372199.shtml"}, {"id": "4295109", "title": "2025年我国系统软件、人工智能产生的数据量首超物联感知数据量", "content": "国家数据局局长刘烈宏在4月29日于福建福州开幕的第九届数字中国建设峰会上表示，2025年我国系统软件、人工智能产生的数据量达26.92泽字节，首次超过传统占主体地位的物联感知数据量。（新华社）", "ctime": 1777434080, "time_str": "11:41:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260429/c676372104.shtml"}, {"id": "4295103", "title": "天津：到2030年文商旅体展及相关产业增加值占地区生产总值比重显著提升", "content": "天津市商务局发布关于公开征求《天津市文商旅体展融合发展“十五五”规划（征求意见稿）》意见的公告。目标到2030年，全市文商旅体展及相关产业增加值占地区生产总值比重显著提升，社会消费品零售总额达到5000亿元，服务零售额增速进入全国前列， // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
