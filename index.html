但尚需基金合伙人会议审议、办理工商变更登记及基金业协会信息更新等，且尚未完成对价支付及份额交割。协议约定分两期付款：生效后5个工作日内支付2576万元，完成工商变更登记后5个工作日内支付1104万元。", "ctime": 1795087783, "time_str": "19:29:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261119/c682014307.shtml"}, {"id": "5713513", "title": "重庆：锚定千亿工业目标 大渡口建设中心城区产城融合新高地", "content": "11月19日，重庆市政府新闻办举行“开局起步十五五·建设现代化新重庆”新闻发布会。大渡口区委书记张果介绍，“十五五”时期，大渡口区将从产业迭代升级、民生福祉增进、改革创新赋能、城市治理增效4个维度发力，打造“现代产业集聚区、品质生活宜居区、改革创新先锋区、集成智治样板区”，加快建设中心城区产城融合新高地。目标是“十五五”时期GDP年均增长5.5%以上、总量突破700亿元，人均GDP达到14万元以上，力争工业总产值突破1000亿元，服务业增加值突破400亿元。（人民财讯）", "ctime": 1795087575, "time_str": "19:26:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261119/c682014267.shtml"}, {"id": "5713491", "title": "银河微电：发行股份购买资产申请获上交所受理", "content": "银河微电公告，公司拟以发行股份方式购买恒泰柯半导体（上海）有限公司100%股权并募集配套资金。2026年11月19日，公司收到上海证券交易所出具的受理通知，上交所认为申请文件齐备、符合法定形式，决定予以受理并依法进行审核。本次交易尚需经上交所审核通过并获得中国证监会同意注册后方可实施。", "ctime": 1795087377, "time_str": "19:22:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261119/c682013904.shtml"}, {"id": "5713485", "title": "行云科技：与新丝路控股签署AI词元跨境销售合同，首期订单2亿元", "content": "行云科技在投资者关系活动记录表中表示，公司AI词元海外销售取得订单突破，2026年11月与新丝路控股集团有限公司签署《AI词元跨境销售服务合同》及《销售订单》，首期订单2亿元，服务区域主要包括日韩、北美、东南亚地区，以应用程序接口（API）调用方式按实际调用量计价、按月结算，首批服务节点应于2027年6月30日前具备服务能力。新丝路控股集团为港股上市公司，通过旗下韩国子公司完成对韩国K-POP企业i-Aurora与&SOUL的战略投资，为其重要战略股东。本次词元服务将支撑其及关联主体在韩国等区域开展数字内容生成、食品研发、AI育种、全球贸易等业务场景的AI应用需求，并有助于公司拓展终端影视传媒等行业客户。", "ctime": 1795087327, "time_str": "19:22:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261119/c682013888.shtml"}, {"id": "5713477", "title": "金科股份：首次回购公司股份545.83万股，支付546.94万元", "content": "金科股份公告，公司于2026年11月18日召开第十二届董事会第十六次会议，审议通过回购部分社会公众股份的议案，拟以自有及自筹资金通过集中竞价交易方式回购，资金总额不低于人民币1.5亿元（含）且不超过人民币3亿元（含），回购价格不超过1.5元/股，实施期限为自董事会审议通过回购方案之日起3个月内。2026年11月19日，公司首次通过股份回购专用证券账户以集中竞价方式回购公司股份545.83万股，占公司总股本的0.0515%，最高成交价1.01元/股，最低成交价1元/股，成交金额546.94万元（不含交易费用）。", "ctime": 1795087285, "time_str": "19:21:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261119/c682013877.shtml"}, {"id": "5713461", "title": "广立微：拟以5000万元-1亿元回购公司股份", "content": "广立微公告，拟以5000万元-1亿元回购公司股份，回购价格不超过80元/股。回购股份的用途为在未来适宜时机用于股权激励或员工持股计划；若公司未能在股份回购实施结果暨股份变动公告后3年内转让完毕，则将依法履行减少注册资本的程序，未转让股份将被注销。按回购金额上限1亿元测算，预计回购股份数量125万股，约占当前公司总股本的0.62%；按回购金额下限5000万元测算，预计回购股份数量62.5万股，约占当前公司总股本的0.31%。回购资金来源为公司自有资金，回购期限为自董事会审议通过本次回购方案之日起不超过12个月。", "ctime": 1795087130, "time_str": "19:18:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261119/c682013635.shtml"}, {"id": "5713459", "title": "韵达股份：2026年10月快递服务业务收入47.41亿元，同比增长5.47%", "content": "韵达股份公告，2026年10月快递服务业务收入47.41亿元，同比增长5.47%；完成业务量21.43亿票，同比增长0.37%；快递服务单票收入2.21元，同比增长4.74%。", "ctime": 1795087126, "time_str": "19:18:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261119/c682013634.shtml"}, {"id": "5713457", "title": "赣锋锂业：拟以2亿元-4亿元回购公司股份", "content": "赣锋锂业公告，拟使用自有资金和/或自筹资金以集中竞价方式回购公司部分人民币普通股A股股份，回购资金总额不低于人民币2亿元（含），不超过人民币4亿元（含），回购价格上限为57.47元/股。本次回购股份用于维护公司价值及股东权益，将在公司披露股份回购实施结果暨股份变动公告12个月后采用集中竞价交易方式全部出售，并在披露回购结果暨股份变动公告后3年内完成出售；若未能在上述规定期限内出售完毕，将依法履行减少注册资本的程序，尚未出售的已回购股份将予以注销。按回购资金总额上限人民币4亿元（含）、回购价格上限57.47元/股测算，预计回购股份约为696.02万股，约占公司目前已发行总股本的0.33%。回购实施期限为自公司董事会审议通过回购股份方案之日起3个月内。", "ctime": 1795087122, "time_str": "19:18:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261119/c682013633.shtml"}, {"id": "5713391", "title": "亚太科技：拟以自有资金1亿元对辽宁亚太增资，注册资本增至2.5亿元", "content": "亚太科技公告，公司此前披露拟在沈阳市沈北新区投资建设汽车轻量化铝材制品东北总部生产基地（一期）项目，项目总投资6亿元，实施主体为全资子公司辽宁亚太。为满足项目建设及日常经营资金需求，在项目总投资保持不变的前提下，公司拟以自有资金1亿元对辽宁亚太进行增资，增资款全部计入注册资本。本次增资完成后，辽宁亚太注册资本由1.5亿元增加至2.5亿元，公司仍持有其100%股权，合并报表范围不变。", "ctime": 1795086770, "time_str": "19:12:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261119/c682013453.shtml"}, {"id": "5713389", "title": "*ST春兴：拟出售苏州部分土地房产，清算价值不低于1.53亿元", "content": "*ST春兴公告，公司于2026年11月19日召开第六届董事会第三十八次会议，审议通过《关于拟出售资产事项的议案》，该议案尚需提交公司股东会审议。公司目前正处于庭外重组阶段，为降低资产负债率、提高资产使用效率，拟出售位于江苏省苏州市的部分土地使用权及房屋建筑物，本次资产出售价格不低于标的资产的清算价值1.53亿元，最终出售价格以实际成交价格为准。截至目前，本次交易尚未确定交易对方、交易价格及具体交易方案。", "ctime": 1795086765, "time_str": "19:12:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261119/c682013452.shtml"}, {"id": "5713385", "title": "四川长虹：长虹源创基金首期募集资金1.01亿元已全额到账", "content": "四川长虹公告，公司此前披露拟与专业投资机构共同投资设立长虹源创基金，认缴出资合计5.68亿元。2026年10月26日全体合伙人签署合伙协议，合伙企业于2026年11月5日完成工商注册登记并取得营业执照。2026年11月18日，公司收到基金管理人通知，各合伙人已按合伙协议约定缴付首期出资款，首期募集资金合计1.01亿元已全额到账。截至公告披露日，长虹源创基金尚需在中国证券投资基金业协会备案。", "ctime": 1795086715, "time_str": "19:11:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261119/c682013436.shtml"}, {"id": "5713377", "title": "可孚医疗：拟9948万元收购康居人60%股权", "content": "可孚医疗公告，公司与郭本胜、郭本丽及安徽氧精灵企业管理咨询有限公司签署股权转让协议，以自有资金9948万元收购合肥康居人医疗器械科技有限责任公司60%股权，交易完成后康居人将成为公司控股子公司并纳入合并报表范围。本次交易已经公司第三届董事会第十一次会议审议通过，无需提交股东会审议，不构成关联交易及重大资产重组。", "ctime": 1795086664, "time_str": "19:11:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261119/c682013430.shtml"}, {"id": "5713375", "title": "京蓝科技：靶材产线尚未量产", "content": "京蓝科技公告，公司股票交易于2026年11月18日、2026年11月19日连续2个交易日收盘价格涨幅累计偏离超过20%，属于股票交易异常波动情形。截至2026年11月19日，公司市净率为12.43，所属资源循环类平均市净率为2.42，公司股票市净率与同行业情况存在显著差异。公司2025年度归属于上市公司股东的扣除非经常性损益的净利润亏损2.09亿元，2026年1-9月归属于上市公司股东的扣除非经常性损益的净利润3274.57万元，盈利基础还较为薄弱。公司靶材产线尚未量产，亦未产生相关营业收入及利润，后续还需通过工艺优化、良率爬坡方可实现量产，未来能否达成设计产能及目标良率均存在较大不确定性。", "ctime": 1795086656, "time_str": "19:10:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261119/c682013429.shtml"}, {"id": "5713373", "title": "西部数据美股盘前涨超5%", "content": "西部数据美股盘前涨超5%，现报302.75美元。", "ctime": 1795086618, "time_str": "19:10:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261119/c682013395.shtml"}, {"id": "5713353", "title": "远翔新材：董事会成员人数由9名调整为6名，三名董事同日离职", "content": "远翔新材公告，公司2026年第二次临时股东会审议通过调整董事会成员人数并修订《公司章程》的议案，董事会成员人数由9名调整为6名，其中非独立董事由6名调整为4名，独立董事由3名调整为2名。同日，董事WANG CHENGRI（王承日）、黄春荣、葛晓萍递交辞职报告并生效，王承日、黄春荣辞任后继续分别担任公司总经理、采购部经理，葛晓萍不再担任公司任何职务。辞职后公司董事人数为6人，未低于法定最低人数。", "ctime": 1795086488, "time_str": "19:08:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261119/c682013261.shtml"}, {"id": "5713347", "title": "青岛双星：拟对轮胎工业增资8亿元、东风轮胎增资4.5亿元", "content": "青岛双星公告，公司拟对控股子公司青岛双星轮胎工业有限公司增资8亿元，增资后注册资本由1.51亿元增至9.51亿元，公司持股仍为100%；拟对控股子公司双星东风轮胎有限公司增资4.5亿元，增资后注册资本由5亿元增至9.5亿元，公司持股比例由96%增至97.8947%。公司已于2026年11月19日召开第十一届董事会第五次会议审议通过该议案，本次增资以公司自有资金出资，不构成关联交易。", "ctime": 1795086483, "time_str": "19:08:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261119/c682013258.shtml"}, {"id": "5713313", "title": "闪迪盘前涨5.11%，现报815.90美元", "content": "闪迪盘前涨5.11%，现报815.90美元。消息面上，美股存储股盘前集体上涨，闪迪受AI工作负载带动高性能企业级SSD需求增长及板块情绪提振。", "ctime": 1795086382, "time_str": "19:06:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261119/c682013168.shtml"}, {"id": "5713287", "title": "HBM4的良率已突破70%？SK海力士回应：商业机密不便披露", "content": "随着AI计算需求的快速增长，模型规模不断扩大，计算复杂度也随之提升，HBM作为AI芯片的重要组成部分，一直是市场关注的重点。日前，有消息称，SK海力士HBM4的良率已突破70%。良率是合格产品占总产量的比例，直接决定了同样的晶圆、设备和工时投入能产出多少可交付的芯片。在当下HBM供给紧俏的背景下，良率越高不仅意味着更多的利润，也关乎存储厂商们的市场份额。对于市场传出的HBM4良率突破70%，以及未来预期良率何时会进一步突破等，财闻向SK海力士方面进行求证。SK海力士相关负责人回应称，公司始终致力于通过持续的技术创新和工艺优化，为客户提供高质量、高性能的存储解决方案，HBM相关产品的具体良率数据及未来预期属于核心商业信息，不便对外公开披露。天使投资人、资深人工智能专家郭涛向财闻表示，市场流传的SK海力士HBM470%的良率仅为渠道测算数据，存在明显的统计口径差异化情况。（财闻）", "ctime": 1795086250, "time_str": "19:04:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261119/c682013096.shtml"}, {"id": "5713277", "title": "大宏立：控股股东、实际控制人、董事长兼总经理甘德宏提议回购公司股份，资金总额不低于2000万元且不超过4000万元", "content": "大宏立公告，公司董事会于2026年11月18日收到控股股东、实际控制人、董事长兼总经理甘德宏出具的提议回购公司股份的函。甘德宏基于对公司未来发展的信心和长期价值的认可，提议公司以自有资金通过集中竞价交易方式回购已发行的部分人民币普通股（A股）股票，回购股份用于员工持股计划或股权激励，回购资金总额不低于人民币2000万元且不超过人民币4000万元（均含本数），回购价格不高于董事会审议通过股份回购决议前30个交易日公司股票交易均价的150%，具体以董事会审议通过的回购方案为准。", "ctime": 1795086231, "time_str": "19:03:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261119/c682013087.shtml"}, {"id": "5713265", "title": "新华百货：回购股份比例达8.85%，累计回购2795.55万股支付3亿元", "content": "新华百货公告，公司此前审议通过以集中竞价交易方式回购公司股份方案，回购资金总额不低于人民币2亿元且不超过4亿元，回购价格不超过人民币12.78元/股，用于员工持股计划或股权激励。截至2026年11月19日，公司已累计回购股份2795.55万股，占公司目前总股本的比例为8.85%，与上次披露数相比增加1.11%，购买最低价为9.9元/股、最高价为11.58元/股，累计已支付总金额为人民币3亿元（不含交易费用）。", "ctime": 1795086175, "time_str": "19:02:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261119/c682013067.shtml"}, {"id": "5713161", "title": "燧原科技：正与多家国内半导体产业伙伴合作，打造基于国产供应链的云端AI芯片产品", "content": "燧原科技公告，公司股票交易连续三个交易日内（2026年11月17日、11月18日、11月19日）收盘价格跌幅偏离值累计达到30%以上，属于股票交易异常波动情形。经公司自查并书面征询实际控制人，截至公告披露日，公司及实际控制人确认不存在应披露而未披露的重大信息。公司注意到近期相关产业新闻引发大量关注和讨论，公司在手订单充沛，正与多家国内半导体产业伙伴合作，打造基于国产供应链的云端AI芯片产品，构建稳定的供应链体系，目前按计划正常开展生产经营。目前公司无限售流通股数量为1790.03万股，占总股本的比例为4.1595%，流通股数量较少、占总股本比例较小。", "ctime": 1795085927, "time_str": "18:58:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261119/c682012918.shtml"}, {"id": "5713133", "title": "联合化学：控股股东终止协议转让7.00%公司股份", "content": "联合化学公告，公司控股股东龙口阳光化学有限公司此前披露拟以协议转让方式向广州金新私募基金管理有限公司（代表“金新启航2号私募证券投资基金”）转让其持有的公司10976000股无限售流通股股份，占公司当前总股本的7.00%。因市场整体风险偏好下行、市场募资环境发生较大变化，截至公告披露日上述拟转让股份尚未办理过户登记手续，双方经友好协商一致同意终止上述股份协议转让事项，并签署了《上市公司股份转让协议之终止协议》，原协议项下尚未履行的义务不再履行，双方互不承担违约或赔偿责任。本次终止不会导致公司控制权发生变更。", "ctime": 1795085794, "time_str": "18:56:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261119/c682012889.shtml"}, {"id": "5713129", "title": "习近平：三国会晤播下的种子必将生根发芽、开花结果", "content": "11月19日下午，国家主席习近平在深圳同俄罗斯总统普京、美国总统特朗普举行中俄美元首会晤，总结此次会晤达成的主要共识。习近平指出，今天的中俄美元首会晤是积极的、建设性的，也是富有成果的，三国在维护世界和平上看法是一致的。我们都记得二战期间并肩作战的历史，强调要珍惜来之不易的和平。我们都同意大国应该重视各国合理安全关切。我们都主张对话谈判是化解分歧的正确选择。只要对话不停止、大门不关上，和平就有希望。我们都认为合作是应对挑战的必由之路，要基于共同利益加强合作，以合作促和平、谋共赢。今天三国会晤播下的种子，必将生根发芽、开花结果。中俄美三国要落实好会晤共识，继续加强沟通，以对话聚共识，以担当迎挑战，以合作促和平，共同推动建设一个更加美好的世界。（新华社）", "ctime": 1795085717, "time_str": "18:55:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261119/c682012871.shtml"}, {"id": "5713109", "title": "蒙古国议会批准总统呼日勒苏赫辞职请求", "content": "蒙古国国家大呼拉尔（议会）19日召开全体会议，表决批准呼日勒苏赫辞去总统职务。国家大呼拉尔为一院制议会，共设有126个议席。当天投票的104名议员中，96人对总统辞职议案投赞成票。据报道，这是蒙古国历史上首次出现现任总统主动提前辞职。根据蒙古国宪法规定，如总统自愿辞职，由国家大呼拉尔主席代行总统职权，直至新总统宣誓就职。同时，国家大呼拉尔须在4个月内宣布并举行总统选举。呼日勒苏赫2021年当选总统。本月17日，他宣布辞去总统职务。针对外界流传的滥用职权、腐败敛财等指控，呼日勒苏赫表示自己并未犯下任何政策性错误，也未窃取过国家和人民的财产。(新华社)", "ctime": 1795085590, "time_str": "18:53:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261119/c682012844.shtml"}, {"id": "5713101", "title": "我国自主研发酶设计基座大模型“按需定制”工业酶", "content": "我国自主研发的合成生物领域人工智能基础大模型——“天华开物”酶设计大模型19日在天津大学发布。该大模型与天津大学合成生物自动化设备结合，形成工业酶闭环迭代优化系统，一周内可以给出酶设计方案，让三个月内完成菌种定制化构建和目标产品制备工艺开发成为可能。(新华社)", "ctime": 1795085573, "time_str": "18:52:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261119/c682012834.shtml"}, {"id": "5713097", "title": "阿斯麦美股盘前涨超4%", "content": "阿斯麦美股盘前涨超4%，现报1452.84美元。", "ctime": 1795085552, "time_str": "18:52:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261119/c682012828.shtml"}, {"id": "5713085", "title": "ST汇洲：撤销其他风险警示，股票简称变更为汇洲智能", "content": "ST汇洲公告，公司股票交易将于2026年11月20日开市起停牌一天，并于2026年11月23日开市起复牌。公司股票交易自2026年11月23日开市起撤销其他风险警示，股票简称由“ST汇洲”变更为“汇洲智能”，证券代码不变，仍为“002122”，日涨跌幅限制仍为10%。公司已就行政处罚决定所涉事项对相应年度财务会计报告进行追溯重述，并收到业绩补偿款共计4143.59万元，且自中国证监会作出行政处罚决定书之日起已满十二个月，不存在其他被实施风险警示的情形。撤销申请已获深圳证券交易所审核同意。", "ctime": 1795085440, "time_str": "18:50:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261119/c682012801.shtml"}, {"id": "5713083", "title": "申通快递：2026年10月快递服务业务收入56.96亿元，同比增长15.05%", "content": "申通快递公告，2026年10月快递服务业务收入56.96亿元，同比增长15.05%；完成业务量25.38亿票，同比增长11.67%；快递服务单票收入2.24元，同比增长2.75%。", "ctime": 1795085433, "time_str": "18:50:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261119/c682012798.shtml"}, {"id": "5713069", "title": "中青旅：公开挂牌转让青乐文旅51%股权，挂牌价不低于3619.08万元", "content": "中青旅公告，公司通过北京产权交易所公开挂牌转让所持有的中青旅天恒乐山文化旅游发展有限公司（青乐文旅）51%股权，挂牌价格不低于评估备案值3619.08万元。本次交易采用公开挂牌转让方式，能否成交及受让方、最终成交价格尚存在不确定性，暂不构成关联交易，不构成重大资产重组。根据挂牌价格，本次交易产生的利润可能占上市公司最近一个会计年度经审计净利润的10%以上，且绝对金额超过100万元。青乐文旅成立于2017年8月，经营乐山大佛北游客中心嘉定坊景区A区“嘉定坊山水S酒店”和C区“三江悦度假酒店”及配套餐饮、物业租赁业务。2025年度营业收入537.72万元，净利润-144.7万元；2026年1-9月营业收入298.51万元，净利润-171.55万元。本次评估基准日为2025年12月31日，青乐文旅净资产账面值4851.93万元，评估值7096.24万元，公司持有的51%股权评估值3619.08万元。若交易完成，公司将不再持有青乐文旅股权，不再将其纳入合并报表范围。", "ctime": 1795085363, "time_str": "18:49:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261119/c68201276 // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
