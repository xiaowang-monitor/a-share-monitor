.down { color: var(--green); }

@keyframes pulse {

const NEWS     = [{"id": "4260663", "title": "日本再现禽流感疫情 将扑杀23万只鸡", "content": "据日本农林水产省22日发布消息，经基因检测确认，日本青森县东北町一家家禽农场发生高致病性禽流感疫情。这是日本全国本流行季确认的第24起禽流感疫情。日本农林水产省当天发布公报说，发生禽流感的家禽农场共饲养了约23万只蛋鸡。青森县相关部门21日接到这家农场的通报后进行了禽流感简易检测，结果呈阳性。22日，基因检测结果确认这家农场的鸡感染了高致病性禽流感病毒。公报说，相关部门将对这家农场饲养的所有鸡进行扑杀、焚烧和掩埋处理。农场周边半径3公里以内范围划为“移动限制区域”，限制家禽尸体及可能导致病原体扩散的物品移动；周边半径3至10公里范围划为“搬出限制区域”，限制该区域内农场禽类和蛋类产品运出。每年秋冬到次年春季是日本的禽流感流行季。2025年10月22日，北海道白老町确认日本本季第一起禽流感疫情。（央视新闻）", "ctime": 1776841943, "time_str": "15:12:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260422/c676183904.shtml"}, {"id": "4260661", "title": "受中东局势影响，英国通胀率明显上升", "content": "当地时间22日，根据英国国家统计局公布的数据，英国3月通胀率上升至3.3%，较2月的3%有明显上升。今年年初，英国央行英格兰银行曾预计，通胀率将在4月降至2%以下，然而由于中东局势导致的石油和天然气价格上涨以及霍尔木兹海峡通道中断，英国央行预计7月至9月的通胀率可能会达到3.5%。（央视新闻）", "ctime": 1776841939, "time_str": "15:12:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260422/c676183903.shtml"}, {"id": "4260659", "title": "个人燃放类产品药量限制更严格 烟花爆竹新国标5月1日实施", "content": "记者今天从应急管理部了解到，强制性国家标准《烟花爆竹 安全与质量》将于今年5月1日正式实施。新标准适当压减含药量、降低声级值、限定运动轨迹范围、明确防撞击包装要求和禁用药种等，特别是对个人燃放类产品的药量限制更严格，从源头严控安全风险。（央视新闻）", "ctime": 1776841931, "time_str": "15:12:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260422/c676183883.shtml"}, {"id": "4260647", "title": "一季度我国交通运输主要指标增长明显", "content": "记者今天从交通运输部了解到，一季度，交通运输经济运行总体平稳、开局良好，货运量、港口货物吞吐量等主要指标延续较快增长势头，人员流动量持续旺盛，交通固定资产投资规模保持高位。一季度，我国营业性货运量达131.9亿吨，同比增长4.1%。其中，完成公路货运量98.8亿吨，同比增长4%；完成水路货运量20.3亿吨，同比增长5.7%。港口货物吞吐量一季度完成43.9亿吨，同比增长4%。其中，内、外贸吞吐量同比分别增长2.4%和7.6%。集装箱吞吐量完成8964万标箱，同比增长8%，延续较快增长势头。人员流动量方面，一季度，我国跨区域人员流动量达177.7亿人次，同比增长2.2%。其中，完成公路人员流动量163.8亿人次，同比增长1.9%；完成水路客运量5856万人次，同比增长6.8%。城市客运方面，一季度，完成城市客运量255.8亿人次，同比增长1.1%。其中，城市轨道交通、出租汽车分别完成80.4亿人次和88.8亿人次，同比分别增长3.7%和4.0%；公共汽电车、城市客运轮渡分别完成86.4亿人次和1727万人次，同比分别下降3.9%和3.0%。此外，一季度交通固定资产投资规模保持高位，达6519亿元，其中公路、水运分别完成投资4437亿元和493亿元。(央视新闻)", "ctime": 1776841840, "time_str": "15:10:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260422/c676183789.shtml"}, {"id": "4260645", "title": "国家疾控局：4月以来流感病毒和鼻病毒活动水平呈上升趋势", "content": "国家疾控局今天举行新闻发布会介绍近期重点传染病疫情形势分析和健康风险提示等情况。国家疾控局新闻发言人席晶晶介绍，进入4月以来，我国呼吸道传染病疫情有所波动，流感病毒和鼻病毒的活动水平呈上升趋势。随着“五一”假期临近，人员流动和聚集性活动将大幅增加，需关注登革热、基孔肯雅热等蚊媒传染病和诺如病毒感染、手足口病等肠道传染病。国家疾控局提醒公众，春夏之交天气多变，要及时增减衣物。旅游出行时，要提前了解目的地疫情情况，注意饮食饮水卫生，严防病从口入。在户外活动时，注意防蚊防蜱；野外碰到旱獭，旱獭虽然很萌，但不要近距离接触。做好健康监测，重点关注家中“一老一小”。如果有身体不适请及时就医，不要延误。（央视新闻）", "ctime": 1776841827, "time_str": "15:10:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260422/c676183786.shtml"}, {"id": "4260643", "title": "拒绝美制“爱国者” 丹麦选择欧洲制新一代防空系统", "content": "当地时间21日，法国泰雷兹集团发布公告称，已与丹麦签订合同，将在丹麦部署SAMP/T NG防空系统。预计2028年起交付。这是SAMP/T NG在欧洲的首个出口合同。该系统全称为“新一代陆基中程地空导弹系统”，是著名美国“爱国者”防空系统的竞争对手。SAMP/T NG防空系统承载欧洲摆脱外部防务依赖的诉求。它由欧洲导弹集团与泰雷兹合资成立的欧洲萨姆防空导弹公司研发，是欧洲目前唯一能同时应对弹道导弹、高机动目标和饱和攻击的中远程防空系统。据了解，六个月前，丹麦在欧洲方案与美制“爱国者”系统之间作出裁决，选择了前者。丹麦此次选择SAMP/T NG而非美制“爱国者”防空系统，在欧洲战略自主语境下，尤其是在当前跨大西洋关系紧张的背景下。具有显著特殊意义。（央视新闻）", "ctime": 1776841820, "time_str": "15:10:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260422/c676183783.shtml"}, {"id": "4260613", "title": "中国人民银行副行长宣昌能出席全球主权债务圆桌会等会议并会见相关机构负责人", "content": "2026年4月15日至17日国际货币基金组织/世界银行春季会议期间，中国人民银行副行长宣昌能出席了全球主权债务圆桌会、金融行动特别工作组部长级会议等会议。出席全球主权债务圆桌会期间，宣昌能表示，近期中东局势推高全球通胀预期，抬升融资成本，进一步加重发展中国家偿债负担。各方应加强多边合作，坚持“共同行动、公平负担”原则，推动私人部门按照可比方式参与重组。各方应推动完善全球主权债务治理体系，支持发展中国家在发展中解决债务问题，改进国际货币基金组织和世界银行的低收入国家债务可持续性分析框架。（中国人民银行）", "ctime": 1776841546, "time_str": "15:05:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260422/c676183513.shtml"}, {"id": "4260611", "title": "欧洲主要股指开盘多数 0", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260422/c676183372.shtml"}, {"id": "4260549", "title": "南向资金净买入超40亿港元", "content": "据同花顺iFinD数据，截至目前，南向资金净买入超40亿港元，其中港股通（沪）买入超43.36亿港元，港股通（深）卖出超3.12亿港元。", "ctime": 1776840877, "time_str": "14:54:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260422/c676183261.shtml"}, {"id": "4260547", "title": "沪深京三市成交额超2.5万亿元，较上日此时放量1395亿元", "content": "据同花顺iFinD数据，沪深京三市成交额超2.5万亿元，较上日此时放量1395亿元，预计全天成交金额约2.5万亿元。截至目前，沪市成交额10619亿元，深市成交额14201亿元，北证50成交额185亿元。", "ctime": 1776840872, "time_str": "14:54:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260422/c676183259.shtml"}, {"id": "4260537", "title": "寒武纪回应代工产能保障：与供应链上下游长期合作 并做好各项应对工作", "content": "4月22日，寒武纪在2025年度业绩说明会上就代工厂产能保障问题回复称，公司将基于产业政策与供应链上下游长期开展广泛、良好的合作，在产品研发各阶段继续与各相关方保持良好沟通，并积极探索，做好各项应对工作，推动公司业务持续发展。另据介绍，在大模型技术加速革新的行业背景下，智能计算需求持续攀升。公司凭借智能芯片领域的核心产品竞争优势与优质服务，赢得了行业客户的认可及良好市场口碑。（人民财讯）", "ctime": 1776840816, "time_str": "14:53:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260422/c676183187.shtml"}, {"id": "4260533", "title": "日本再现禽流感疫情　将扑杀23万只鸡", "content": "据日本农林水产省22日发布消息，经基因检测确认，日本青森县东北町一家家禽农场发生高致病性禽流感疫情。这是日本全国本流行季确认的第24起禽流感疫情。日本农林水产省当天发布公报说，发生禽流感的家禽农场共饲养了约23万只蛋鸡。青森县相关部门21日接到这家农场的通报后进行了禽流感简易检测，结果呈阳性。22日，基因检测结果确认这家农场的鸡感染了高致病性禽流感病毒。(新华社)", "ctime": 1776840801, "time_str": "14:53:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260422/c676183123.shtml"}, {"id": "4260529", "title": "全球化肥供应告急 化肥价格暴涨", "content": "目前，美以伊战事造成的影响已经从能源领域传导至农业领域。根据联合国的数据，全球约三分之一的海运化肥贸易需要经过霍尔木兹海峡运输。而该地区目前航运已经崩溃，过境量下降超过95%，导致能源和化肥运输中断。虽然一些国家本身也生产大量化肥，但该生产过程需要液化天然气LNG，而这些LNG又大多从海湾地区进口，目前同样严重受阻、供应紧张。这导致化肥价格大幅上涨，以使用最广泛的氮肥——尿素为例，中东颗粒尿素期货离岸价已经从冲突爆发前的每吨不到500美元上涨到现在的每吨850美元左右，涨幅超过75%。在美国，情况同样糟糕。由于担心错过播种季节，农民们已经联合致信特朗普，敦促他动用军舰护送化肥通过霍尔木兹海峡。化肥短缺正逐步演变为粮食与通胀风险。而专家担忧，目前留给农民的时间已经不多了，未来即使供应恢复，今年的粮食产量也可能已经难以挽回。(央视财经)", "ctime": 1776840661, "time_str": "14:51:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260422/c676183051.shtml"}, {"id": "4260527", "title": "寒武纪回应互联网大厂自研芯片影响：公司产品对各类人工智能技术具备较好普适性", "content": "就互联网大厂自研芯片的影响，4月22日寒武纪董事长、总经理陈天石在业绩说明会上表示，互联网企业研发人工智能芯片主要是围绕其主营业务或针对特定应用场景完成完整或较为完整的行业解决方案。寒武纪能提供云边端一体、软硬件协同、训练推理融合、具备统一生态的系列化智能芯片产品和平台化基础系统软件。公司产品是针对人工智能领域内多样化应用场景而设计、研发的通用型智能芯片，对视觉、语音、自然语言处理、传统机器学习技术等各类人工智能技术具备较好的普适性，可为多个行业领域客户提供不同尺寸、多场景的差异化产品，满足客户的差异化需求。（人民财讯）", "ctime": 1776840608, "time_str": "14:50:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260422/c676183030.shtml"}, {"id": "4260525", "title": "零一汽车增资至3585万，增幅约47%", "content": "天眼查App显示，4月21日，零一汽车关联公司江苏零一汽车科技股份有限公司发生工商变更，注册资本由约2437万人民币增至约3585万人民币，增幅约47%，同时，部分高管也发生变更。该公司成立于2022年6月，法定代表人为黄泽铧，经营范围含技术服务、技术开发、新能源汽车整车销售、汽车零部件研发等，由黄泽铧、扬州班纳瑞智卡投资合伙企业（有限合伙）、嘉兴实诺创业投资合伙企业（有限合伙）等共同持股。（界面新闻）", "ctime": 1776840498, "time_str": "14:48:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260422/c676182995.shtml"}, {"id": "4260523", "title": "百亿私募今年以来平均收益率超5%", "content": "私募排排网数据显示，截至4月17日，有业绩展示的88家百亿私募，今年以来平均收益率达5.54%，其中81家百亿私募实现正收益，占比达92.05%。（人民财讯）", "ctime": 1776840452, "time_str": "14:47:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260422/c676182971.shtml"}, {"id": "4260495", "title": "国家先进计算产业创新中心青岛基地正式启动", "content": "4月22日，国家先进计算产业创新中心青岛基地在青岛市崂山区正式启动。国家先进计算产业创新中心是2018年经国家发改委批复成立的国家级产业创新平台，旨在突破先进计算领域核心技术，培育具有国际竞争力的产业集群。此次启动的青岛基地，由中科曙光参与建设，将依托区域产业优势，打造集技术研发、成果转化、产业孵化于一体的先进计算创新平台，进一步汇聚行业资源，驱动区域产业智能化升级，为青岛乃至山东的数字经济发展注入强劲的“算力动能”。（人民财讯）", "ctime": 1776840147, "time_str": "14:42:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260422/c676182853.shtml"}, {"id": "4260491", "title": "千问AI眼镜持续位居线上市场第一", "content": "4月22日，维深Wellsenn XR最新数据显示，自3月8日正式开售以来，千问AI眼镜线上累计销量占国内AI眼镜市场总份额达53%，位居线上市场第一。（新浪财经）", "ctime": 1776839994, "time_str": "14:39:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260422/c676182773.shtml"}, {"id": "4260471", "title": "天津港集团总裁王洪海会见天津百利装备集团徐科华一行", "content": "4月21日，天津港集团党委副书记、总裁王洪海会见来访的天津百利装备集团党委副书记、总经理徐科华一行。双方围绕共同推动天津港交通电动化转型升级、新能源投资开发和储能应用、绿色基础设施建设等领域合作发展进行深入交流。(人民财讯)", "ctime": 1776839747, "time_str": "14:35:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260422/c676182659.shtml"}, {"id": "4260459", "title": "工业富联午后触及涨停", "content": "工业富联午后触及涨停，报67.55元/股。", "ctime": 1776839585, "time_str": "14:33:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260422/c676182602.shtml"}, {"id": "4260453", "title": "特斯拉中国车机将接入豆包大模型", "content": "据网信上海消息，特斯拉车机语音大模型服务于4月20日完成备案。从知情人士处获悉，特斯拉车机语音服务将接入豆包大模型。值得一提的是，此前特斯拉中国官网的《特斯拉车机语音助手使用条款》显示，特斯拉Model Y L车型将搭载豆包大模型与DeepSeek模型，两款模型均通过火山引擎接入。其中，豆包大模型将承担语音命令功能，如导航设定、媒体播放操控、空调温度调节等，同时还具备车主手册查询功能；DeepSeek模型提供AI互动服务。（科创板日报）", "ctime": 1776839549, "time_str": "14:32:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260422/c676182584.shtml"}, {"id": "4260441", "title": "日韩股市集体收涨", "content": "日经225指数收涨0.40%，报59585.86点。韩国综指收涨0.46%，报6417.90点。", "ctime": 1776839467, "time_str": "14:31:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260422/c676182566.shtml"}, {"id": "4260437", "title": "薪资无着落　美国机场或再陷安检混乱", "content": "美国国土安全部长马克韦恩·马林21日说，由于该部门“停摆”持续，用于支付5万名工作人员薪酬的资金即将耗尽。这意味着美国机场最早可能在5月再次出现安检混乱。(新华社)", "ctime": 1776839434, "time_str": "14:30:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260422/c676182550.shtml"}, {"id": "4260433", "title": "北京高院：用AI生成侵权图片并制作拼图销售，构成侵犯著作权罪", "content": "北京市高级人民法院发布2025年度北京法院知识产权司法保护状况及典型案例。其中，一起利用Stable Diffusion等开源AI模型生成侵权图片并制作拼图产品销售的刑事案件，成为涉利用人工智能生成模型侵犯著作权罪的典型案件。2025年北京法院新收各类知识产权案件69728件，审结64960件，其中专利案件2970件、商标案件40955件、著作权案件16419件。（澎湃新闻）", "ctime": 1776839408, "time_str": "14:30:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260422/c676182537.shtml"}, {"id": "4260431", "title": "美国交通部长寻求100亿美元拨款推进空管系统升级", "content": "美国交通部长肖恩·达菲21日说，他正在向美国国会寻求100亿美元资金，以推进空中交通管制系统的升级改造工作，从而减少系统性航班中断。由于空中交通管制系统老化问题严重，美国去年多次发生设备故障影响机场正常运转的事件。去年7月，国会批准125亿美元初始资金，用于更换过时技术设备、提升空管塔台的工作能力。(新华社)", "ctime": 1776839377, "time_str": "14:29:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260422/c676182528.shtml"}, {"id": "4260425", "title": "创业板综指创历史新高", "content": "创业板综指持续走强，盘中拉升涨超1.2%，突破2015年6月3日的4449.42历史高点。", "ctime": 1776839277, "time_str": "14:27:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260422/c676182499.shtml"}, {"id": "4260407", "title": "消息人士：巴基斯坦总理主持会议 同意继续推进美伊第二轮会谈", "content": "当地时间4月22日，巴基斯坦政府消息人士称，巴基斯坦总理夏巴兹主持召开了一次高级别会议，讨论伊朗美国停火延长后的局势。会议同意继续巴基斯坦的外交努力，以确保第二轮会谈的举行。（央视新闻）", "ctime": 1776838929, "time_str": "14:22:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260422/c676182397.shtml"}, {"id": "4260401", "title": "英国议会通过法案 2008年后出生者终身不得购烟", "content": "据英国媒体21日报道，英国议会两院已审议通过《烟草与电子烟法案》，现年17岁及以下青少年被终身禁止购买香烟。该法案规定，商家向2009年1月1日及以后出生的人群售卖烟草制品属违法行为。此举旨在杜绝该群体吸烟，打造无烟一代。英国卫生大臣韦斯·斯特里廷称这是“国民健康的历史性时刻”，将打造“第一代无烟者”，让他们免受终身成瘾与烟草的危害。法案成为法律后，英国政府有权将室内禁烟令扩大到儿童游乐场、学校和医院外等公共区域；限制电子烟的口味和包装，并在已实施禁烟令的场所禁止吸电子烟。英国国民保健制度的数据显示，英格兰每年约有7.5万人死于吸烟，这一数字约占全部死亡人数的四分之一。2022年，新西兰成为首个颁布此类法律的国家，同样禁止向2008年以后出生的人群销售香烟；但实施不到一年，该法在政府换届后被废除。2025年11月，马尔代夫宣布禁止向2007年1月1日之后出生的人群销售香烟。(新华社)", "ctime": 1776838806, "time_str": "14:20:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260422/c676182344.shtml"}, {"id": "4260397", "title": "苏州一宗宅地10.66亿元底价成交", "content": "4月22日，苏州出让一宗吴江东太湖度假区宅地，土地出让面积65833平方米，规划建筑面积78999.6平方米，起始价10.66亿元，起始楼面价13500元/平方米。最终苏州市吴江新吴城资本管理有限公司以底价10.66亿元竞得该地块。（人民财讯）", "ctime": 1776838714, "time_str": "14:18:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260422/c676182332.shtml"}, {"id": "4260375", "title": "英维克午后持续上扬接近翻红", "content": "英维克午后持续上扬接近翻红，早盘曾一度一字跌停，封单超30亿元。", "ctime": 1776838308, "time_str": "14:11:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260422/c676182192.shtml"}, {"id": "4260331", "title": "硅业分会：本周多晶硅价格止跌企稳", "content": "据安泰科统计，本周多晶硅n型复投料成交价格区间为3.5-3.6万元/吨，成交均价为3.53万元/吨，环比持平；n型颗粒硅成交价格区间为3.4-3.6万元/吨，成交均价为3.43万元/吨，环比持平。本周多晶硅现货价格结束连续两个月的下跌，呈现企稳迹象。据调研，本周下游询价积极性明显增强，虽实际签单企业数量仅有2-3家，但订单量环比有所增加。（界面新闻）", "ctime": 1776837735, "time_str": "14:02:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260422/c676181974.shtml"}, {"id": "4260327", "title": "柏楚电子等成立精密机电科技公司，含AI业务", "content": "企查查APP显示，近日，上海柏楚精密机电科技有限公司成立，经营范围包含：人工智能应用软件开发；智能基础制造装备制造；智能基础制造装备销售；金属切割及焊接设备制造等。企查查股权穿透显示，该公司由柏楚电子等共同持股。（人民财讯）", "ctime": 1776837724, "time_str": "14:02:04", "stock_code": "", "stock_name": "", "stock_market" alse, "source": "", "url": "https://news.10jqka.com.cn/20260422/c676181836.shtml"}, {"id": "4260249", "title": "美国防部欲投入数百亿美元增购关键弹药", "content": "美国军方官员称，美国国防部希望投入超过300亿美元，用于增购关键武器弹药，其中包括反导拦截弹。据称，此类拦截弹在对伊朗的军事行动期间库存告急。目前供应最为紧张的包括“爱国者”防空系统和 “萨德”反导系统所使用的拦截弹。此外，这笔超300亿美元的预算款项还将用于采购美军使用的远程精确打击导弹以及中程导弹系统。（央视新闻）", "ctime": 1776837228, "time_str": "13:53:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260422/c676181813.shtml"}, {"id": "4260243", "title": "沪深京三市成交额超2万亿元，较上日此时放量605亿元", "content": "据同花顺iFinD数据，沪深京三市成交额超2万亿元，较上日此时放量605亿元，预计全天成交金额约2.5万亿元。截至目前，沪市成交额8482亿元，深市成交额11372亿元，北证50成交额150亿元。", "ctime": 1776837196, "time_str": "13:53:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260422/c676181801.shtml"}, {"id": "4260233", "title": "中国驻尼泊尔大使馆提醒在尼中国公民规范办理签证", "content": "中国驻尼泊尔大使馆提醒在尼泊尔中国公民务必规范办理签证，避免逾期滞留遭重罚。近期，尼泊尔内政部移民局进一步加强执法核查，并启用外国人管理信息系统，全程记录在尼泊尔外籍人员居留信息，其中包括中国公民在尼泊尔签证逾期滞留等信息。最近，数名中国公民因签证逾期滞留、手续不全被罚款、遣返并限制入境；另有非法中介收取高额服务费代办商务签证，因材料造假或无法提供过往商务签证记录，导致当事人后续签证申请被拒。中国驻尼泊尔大使馆提醒在尼泊尔中国公民严格遵守尼泊尔移民法律法规，通过官方渠道办理相应签证手续，务必妥善留存历次签证材料，切勿轻信非法中介。（央视新闻）", "ctime": 1776836784, "time_str": "13:46:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260422/c676181738.shtml"}, {"id": "4260227", "title": "贝特瑞等新设光明科瑞创投基金", "content": "企查查APP显示，近日，深圳市光明科瑞创业投资基金合伙企业（有限合伙）成立，经营范围包含：以私募基金从事股权投资、投资管理、资产管理等活动。企查查股权穿透显示，该企业由贝特瑞等共同出资。（人民财讯）", "ctime": 1776836658, "time_str": "13:44:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260422/c676181702.shtml"}, {"id": "4260225", "title": "伊朗伊斯兰革命卫队：随时准备应对任何威胁", "content": "当地时间22日，伊朗伊斯兰革命卫队发表声明称，随时准备应对任何威胁。声明说，在与其他武装力量协同下，伊斯兰革命卫队通过导弹和无人机行动对以色列及美国相关目标实施打击，并称其在该地区的大部分军事基础设施已遭受重创、部分出现瘫痪。伊斯兰革命卫队目前保持高度战备状态，随时准备对任何威胁或再次发生的侵略作出果断、迅速回应 const META     = {"update_time": "2026-04-22 15:13:26", "sentiment_score": 55.45454545454545, "agents": []};

// 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

      <span class="text-xs text-gray-400">${item.mentions}次提及</span>

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {

      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
