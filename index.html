.score-bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s; }
.up { color: var(--red); }
.down { color: var(--green); }

4", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261112/c681754009.shtml"}, {"id": "5642535", "title": "诺德股份：RTF-1/2/3、HVLP系列产品实现批量供货、稳步上量", "content": "诺德股份11月12日在互动平台表示，公司拥有广东惠州、湖北黄石、江西贵溪、青海西宁四大电解铜箔生产基地，约3万吨产能具备高端电子电路铜箔生产能力，可覆盖RTF、HVLP等高端电子电路铜箔产品，产能可根据产品结构及客户需求在锂电铜箔与电子电路铜箔之间统筹调配。RTF-1/2/3、HVLP系列产品已进入国内及台系主流覆铜板及终端厂商供应链体系，并实现批量供货、稳步上量。（人民财讯）", "ctime": 1794471429, "time_str": "16:17:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261112/c681753738.shtml"}, {"id": "5642517", "title": "亿华通、远景能源等成立新能源公司", "content": "据企查查APP显示，近日，沽源亿晟泰新能源有限公司成立，法定代表人为李凌，经营范围包含储能技术服务、发电技术服务、风力发电技术服务、太阳能发电技术服务、新兴能源技术研发等。企查查股权穿透显示，该公司由亿华通旗下北京亿华通储能科技有限公司、远景能源有限公司全资子公司远景创业投资（海南）有限公司等共同持股。（人民财讯）", "ctime": 1794471364, "time_str": "16:16:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261112/c681753593.shtml"}, {"id": "5642477", "title": "永贵电器：控股子公司中标2145万元动力电池采购项目", "content": "永贵电器公告，公司控股子公司江苏永贵新能源科技有限公司近日收到中车物流有限公司的中标通知书，中标项目为中车大同电力机车有限公司动力电池采购项目，中标产品为换电动力电池柜，中标金额合计2145万元（含税）。上述中标项目尚未签订正式合同，若能够签订正式合同并顺利实施，将对公司2026年及未来年度的经营业绩产生积极影响。", "ctime": 1794471261, "time_str": "16:14:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261112/c681753358.shtml"}, {"id": "5642473", "title": "冀东装备：全资子公司诉讼案获法院立案执行，涉案金额4140.2万元", "content": "冀东装备公告，公司全资子公司唐山盾石建筑工程有限责任公司此前就与河南省环山环保科技有限公司、河南省太阳石集团水泥有限公司、新乡市振新水泥有限公司建设工程施工合同纠纷提起诉讼，涉案金额4140.2万元，一审判决已生效。2026年11月11日，盾石建筑收到辉县法院《受理执行案件通知书》，法院已收到执行申请并决定立案执行。案件已进入执行阶段，对公司本期及期后利润的影响视实际执行情况综合判断而定。", "ctime": 1794471239, "time_str": "16:13:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261112/c681753304.shtml"}, {"id": "5642443", "title": "港股收评：恒生指数跌1.26%，恒生科技指数跌2.36%", "content": "港股收盘，恒生指数跌1.26%，恒生科技指数跌2.36%。恒指港股通ETF银华（159318）跌1.36%，港股通科技ETF鹏华（159751）跌2.22%。板块方面，电子设备、装饰园林板块涨幅靠前；被动元件、安全和报警服务板块跌幅靠前。个股方面，传音控股涨22.47%，嘉耀控股涨21.15%，天数智芯涨8.85%，智云科技建设涨7.96%，商米科技-W涨7.65%；白鸽在线跌10.61%，紫金黄金国际跌10.35%，康耐特光学跌9.83%，智谱跌9.05%，万国黄金集团跌9.01%。", "ctime": 1794471114, "time_str": "16:11:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261112/c681752998.shtml"}, {"id": "5642425", "title": "广生堂：GST-Peak-Triple方案II期临床试验完成入组，合计176例", "content": "广生堂公告，创新药控股子公司福建广生中霖生物科技有限公司开展的GST-Peak-Triple方案II期临床试验，已于近日完成全部参与者入组，合计入组176例。本次入组完成不预示或保证后续临床研究结果及药品注册审批结论，方案尚需完成系列临床研究并经国家药品审评部门审批通过后方可上市。", "ctime": 1794471094, "time_str": "16:11:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261112/c681752910.shtml"}, {"id": "5642409", "title": "欧派家居：首次回购公司股份34.18万股，支付999.8万元", "content": "欧派家居公告，公司此前审议通过回购股份预案，拟使用不低于人民币1亿元（含）且不超过人民币2亿元（含）的自有资金或自筹资金，以不超过人民币46.25元/股（含）的价格回购公司股份，回购股份将全部予以注销并减少注册资本。2026年11月12日，公司以集中竞价交易方式首次回购公司股份34.18万股，占公司总股本的比例为0.056%，回购最高成交价格29.65元/股，最低成交价格28.95元/股，已支付总金额999.8万元（不含交易费用）。", "ctime": 1794471071, "time_str": "16:11:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261112/c681752774.shtml"}, {"id": "5642215", "title": "欧洲主要股指开盘集体上涨", "content": "欧洲主要股指开盘集体上涨，欧洲斯托克50指数涨0.24%，英国富时100指数涨0.5%，法国CAC40指数涨0.4%，德国DAX指数涨0.84%。", "ctime": 1794470489, "time_str": "16:01:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261112/c681750050.shtml"}, {"id": "5642129", "title": "“甲醛白菜”等18起涉食品安全重大犯罪案件被挂牌督办", "content": "据中央政法委消息，为依法从严查处危害食品安全违法犯罪，公安部、最高人民检察院、最高人民法院近日对18起涉食品安全重大犯罪案件集中挂牌督办，其中包括“甲醛白菜”案、“假洋保健品”案、“硫磺竹笋”案等。中央政法委有关部门负责同志表示，政法机关将持续保持对危害食品安全违法犯罪的高压严打态势，以严格执法解决突出问题，切实筑牢食品安全防线，全力维护人民群众“舌尖上的安全”。（央视新闻）", "ctime": 1794470419, "time_str": "16:00:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261112/c681749823.shtml"}, {"id": "5642089", "title": "美团在福州成立科技公司 含智能机器人研发业务", "content": "据企查查APP显示，近日，福州乐豹科技有限公司成立，法定代表人为令鸿嘉，经营范围包含智能机器人的研发、物联网技术研发、人工智能基础软件开发、供应链管理服务、智能机器人销售、工业机器人销售等。企查查股权穿透显示，该公司由美团旗下Xigua Limited全资持股。（人民财讯）", "ctime": 1794470318, "time_str": "15:58:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261112/c681749764.shtml"}, {"id": "5642063", "title": "埃泰克：拟以3000万元-5000万元回购公司股份", "content": "埃泰克公告，拟以不低于人民币3000万元（含）、不超过人民币5000万元（含）回购公司股份，回购价格不超过48.57元/股（含），回购股份拟用于股权激励或员工持股计划。按回购价格上限测算，预计回购股份数量61.77万股~102.94万股，占总股本比例0.34%~0.57%。回购期限为自董事会审议通过回购方案之日起12个月内，资金来源为公司自有资金或自筹资金。", "ctime": 1794470248, "time_str": "15:57:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261112/c681749742.shtml"}, {"id": "5642021", "title": "阿里国际站美国大促GMV涨超40%", "content": "外贸进入四季度备货旺季，美国买家采购需求加速释放。界面新闻获悉，阿里国际站日前上线的11月美国大促GMV大涨超40%，美容运动、机械新能源、汽摩配三大行业领涨。其中，活动房屋同比增长超400%，工程建筑机械增长近300%，发饰、礼品、车轮、轮胎及配件同比增长均超100%。（界面新闻）", "ctime": 1794470119, "time_str": "15:55:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261112/c681749686.shtml"}, {"id": "5641943", "title": "安集科技：华夏基金旗下ETF增持79.92万股，持股比例升至5.00%", "content": "安集科技公告，华夏基金管理有限公司旗下科创半导体ETF华夏于2026年11月11日通过集中竞价交易增持公司股份79.92万股。本次权益变动前，科创半导体ETF华夏持有公司股票10618579股，占公司总股本的4.65%；本次权益变动后，持股数量为11417828股，占公司总股本的5.00%。华夏基金管理有限公司（代表科创半导体ETF华夏）不是公司控股股东、实际控制人及其一致行动人，本次权益变动不会导致公司控股股东发生变化，亦不会导致公司的控制权发生变化。", "ctime": 1794469862, "time_str": "15:51:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261112/c681749580.shtml"}, {"id": "5641875", "title": "亿田智能：子公司算力资源服务合同含税总金额调整为7.8亿元", "content": "亿田智能公告，公司全资子公司甘肃亿算智能科技有限公司此前与客户Y公司签署《算力资源服务合同》，原合同含税金额为11.06亿元。近日双方签署补充协议，根据项目实际实施及设备升级情况，对原合同项下算力规模及服务费用等事项作出调整，调整后含税总金额为7.8亿元，最终按月度所提供服务据实结算。除上述调整外，原合同关于服务费用结算方式及周期、押金安排、付款安排等约定不变。", "ctime": 1794469552, "time_str": "15:45:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261112/c681749296.shtml"}, {"id": "5641819", "title": "外交部回应七国集团涉台相关声明", "content": "11月12日，外交部发言人毛宁主持例行记者会。有记者就七国集团涉台相关声明提问。毛宁表示，我们注意到这份联合声明，中方在台湾等问题上的立场是一贯明确、正当合理和光明磊落的。有关声明无视客观事实，无视中国为世界和平稳定与发展所做的积极贡献，粗暴干涉中国内政，恶意污蔑抹黑中国。有关内容言辞荒谬，再次证明七国集团是个抱守冷战思维、搞集团政治的意识形态小圈子，完全不能代表国际社会。中方奉劝七国集团管好自己的事情，履行好自身责任，为应对当今各种紧迫挑战、促进国际团结多发挥正面作用。（央视新闻）", "ctime": 1794469354, "time_str": "15:42:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261112/c681749161.shtml"}, {"id": "5641815", "title": "科博达：董事长提议回购公司股份，回购资金总额不低于1.5亿元且不超过2.5亿元", "content": "科博达公告，公司董事会于2026年11月12日收到董事长柯桂华先生《关于提议回购公司股份的函》。柯桂华基于对公司未来发展的信心和对公司价值的认可，提议公司使用自有或自筹资金通过上海证券交易所交易系统以集中竞价交易方式回购公司已发行的部分人民币普通股（A股）股票，回购股份拟用于员工股权激励/员工持股计划。回购资金总额不低于人民币1.5亿元（含），不超过人民币2.5亿元（含），回购价格不超过董事会通过回购股份决议前30个交易日公司股票交易均价的150%，具体以董事会审议通过的回购股份方案为准，回购期限为自公司董事会审议通过本次回购股份方案之日起6个月内。", "ctime": 1794469346, "time_str": "15:42:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261112/c681749156.shtml"}, {"id": "5641735", "title": "以防长：看守政府发动军事行动无需征得反对派同意", "content": "当地时间12日，以色列国防部长卡茨发表声明称，尽管以色列反对党阵营正就组建新联合政府展开磋商，但总理内塔尼亚胡领导的看守政府在指挥以军采取军事行动前，无需征得政治对手同意。他强调，选举后过渡时期政府无需获得反对派或任何法律机构批准，即可下令以军在加沙地带、黎巴嫩、叙利亚及约旦河西岸等地区展开军事行动；针对伊朗问题，政府已与以军充分协调，并将根据局势需要继续采取相应措施，国家安全事务不会因当前政治组阁进程而停滞。（央视新闻）", "ctime": 1794469087, "time_str": "15:38:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261112/c681748979.shtml"}, {"id": "5641677", "title": "海科新源：目前电解液溶剂、VC添加剂等核心产品整体保持满产满销", "content": "海科新源11月12日在互动平台表示，公司目前电解液溶剂、VC添加剂等核心产品整体保持满产满销，产能利用率维持高位。公司已与比亚迪、昆仑新材、法恩莱特、合肥乾锐等客户签署覆盖2026—2028年的长协，当前执行平稳，能够支撑在手订单交付。（人民财讯）", "ctime": 1794468964, "time_str": "15:36:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261112/c681748872.shtml"}, {"id": "5641637", "title": "与黄仁勋关系密切的女子（黄乐）是否在北京，外交部：不了解情况", "content": "11月12日，外交部发言人毛宁主持例行记者会。彭博社记者提问，据本社报道，超速国际（Megaspeed）高管黄乐（Alice Huang）现在正在北京。请问外交部能否证实以及有何评论？“我不了解你提到的情况。”毛宁说。（澎湃新闻）", "ctime": 1794468825, "time_str": "15:33:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261112/c681748769.shtml"}, {"id": "5641611", "title": "泰豪科技：孙公司七六四11月13日起在新三板正式挂牌", "content": "泰豪科技公告，公司下属孙公司天津七六四通信导航技术股份有限公司股票于2026年11月13日起在全国中小企业股份转让系统挂牌公开转让，证券简称七六四，证券代码873764，交易方式为集合竞价交易，所属层级为基础层。", "ctime": 1794468758, "time_str": "15:32:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261112/c681748715.shtml"}, {"id": "5641605", "title": "信诺维：1类新药注射用亚胺西福获药品注册批准", "content": "信诺维公告，公司近日收到国家药品监督管理局通知，批准公司自主研发的1类新药注射用亚胺西福（商品名：福诺凯）上市，剂型为注射剂，注册分类为化学药品1类，批准的适应症为医院获得性细菌性肺炎和呼吸机相关性细菌性肺炎（HABP/VABP）。本次获批基于一项国际多中心、随机、双盲、对照的III期临床研究，结果显示该药在HABP/VABP患者14天全因死亡率方面非劣效于对照药，且具有良好的安全性和耐受性。", "ctime": 1794468743, "time_str": "15:32:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261112/c681748708.shtml"}, {"id": "5641597", "title": "山东药玻：马来西亚全资子公司获境外投资项目备案及企业境外投资证书", "content": "山东药玻公告，公司此前披露拟在马来西亚设立全资子公司，该子公司已完成注册登记。截至本公告日，公司已取得山东省发展和改革委员会出具的《境外投资项目备案通知书》（鲁发改开放备〔2026〕412号）和山东省商务厅颁发的《企业境外投资证书》（境外投资证第N3700202600151号）。", "ctime": 1794468731, "time_str": "15:32:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261112/c681748700.shtml"}, {"id": "5641427", "title": "全国首个！上海破产企业电子营业执照应用系统上线", "content": "11月12日，上海在全国率先上线破产企业电子营业执照应用系统，实现破产案件府院信息共享。经国家市场监督管理总局批准，上海市市场监管局“开展破产程序中电子营业执照管理人权限调整机制改革试点”获批并在全国率先部署上线：进入破产程序的企业，原法定代表人所持电子营业执照同步失效，破产管理人可申请领取破产企业电子营业执照，可自主使用或授权他人使用，办理破产企业变更登记、对外投资企业清理登记，破产程序终结后代表企业电子签名，一站式办结注销登记。下一步将挖掘法院涉案涉诉信息在企业注销登记领域的应用场景，防范问题企业“恶意注销”。（央视新闻）", "ctime": 1794468579, "time_str": "15:29:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261112/c681748571.shtml"}, {"id": "5641419", "title": "外交部：坚决反对美方泛化国家安全概念，无理打压中国机构", "content": "11月12日，外交部发言人毛宁主持例行记者会。法新社记者提问，据报道，中国的西北工业大学显示购买了英伟达芯片，而这不符合美国对华的出口限制，这所学校据称与中国军方有紧密的联系。请问外交部对此有何评论？毛宁表示，你提到的具体情况我不了解，但是中方在美国输华芯片问题上的立场是一贯的。同时我们坚决反对美方泛化国家安全概念、划设各种名目的歧视性清单、无理打压中国机构。（澎湃新闻）", "ctime": 1794468533, "time_str": "15:28:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261112/c681748544.shtml"}, {"id": "5641383", "title": "云从科技与上海电影学院深化合作", "content": "记者从云从科技获悉，云从科技与上海大学上海电影学院围绕专业影视智能体研发、智能片场及内容生产实践等方向进一步深化合作，双方将探索实体片场与智能片场的“双片场”发展模式。（人民财讯）", "ctime": 1794468392, "time_str": "15:26:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261112/c681748452.shtml"}, {"id": "5641379", "title": "外交部：中方就中俄美元首会晤同有关方保持着沟通", "content": "外交部发言人毛宁12日在例行记者会上回答相关提问时表示，中方就中俄美元首会晤同有关方保持着沟通。（新华社）", "ctime": 1794468349, "time_str": "15:25:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261112/c681748415.shtml"}, {"id": "5641369", "title": "外交部：美方应当停止编造所谓的间谍叙事、为实施科技封锁寻找借口", "content": "11月12日，外交部发言人毛宁主持例行记者会，就涉英伟达相关问题表示，对于所谓“中国间谍”论调，中方已阐明立场，中国的科技进步靠的是自主创新和开放合作，美方应当停止编造所谓的间谍叙事、为实施科技封锁寻找借口。中美双方就两国元首互动保持密切沟通，中方愿同美方一道共同落实好两国元首重要共识，推动构建基于尊重、公平对等的中美建设性战略稳定关系。（央视新闻）", "ctime": 1794468302, "time_str": "15:25:02", "stock_code": "", // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
