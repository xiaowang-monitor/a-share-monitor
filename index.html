  border-radius: 12px;
  padding: 20px;
  transition: all 0.2s;
}
.card:hover { background: var(--bg-card-hover); border-color: #334155; }
.badge {
  display: inline-flex; align-items: center; padding: 2px 8px;
  border-radius: 6px; font-size: 12px; font-weight: 500;

.badge-s { background: rgba(239,68,68,0.2); color: #ef4444; }

  height: 6px; border-radius: 3px; background: #1e293b; overflow: hidden;
}
.score-bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s; }
.up { color: var(--red); }
.down { color: var(--green); }
.pulse { animation: pulse 2s infinite; }
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}
.glow { box-shadow: 0 0 20px rgba(59,130,246,0.15); }
::-webkit-scrollbar { width: 6px; }

          <tbody id="picks-table"></tbody>

  </div>
</div>

军方名为“滚石”的部门上传的，该部门长期掌握加沙和约旦河西岸巴勒斯坦民众的大量照片和个人信息。据《纽约时报》此前报道，以军此前在加沙地带多次使用商业技术识别无人机采集的人脸图像，有时会误将平民误认成他们的打击目标。报道称，亚马逊公司2023年便在以色列设立新的数据中心，还为以军提供了具有额外安全防护的独立云环境，用于存放军事行动和情报收集涉及的敏感资料。亚马逊公司发言人回应称，该平台“无法查看”客户在其云端运行的工作文件，并称“我们尊重客户隐私，未经客户同意，不会讨论我们与客户之间的关系。”以军发言人则表示，不对涉及作战需求的合作或业务发表评论。(CCTV国际时讯)", "ctime": 1794906842, "time_str": "17:14:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261117/c681914434.shtml"}, {"id": "5686173", "title": "商务部：加紧研究修订《再生资源回收管理办法》", "content": "11月17日下午，国新办举行介绍深入推进再生资源回收体系建设有关情况的新闻发布会。商务部流通业发展司司长李佳路介绍了如何确保《关于深入推进再生资源回收体系建设 促进回收行业高质量发展的意见》政策落地的举措。一是从政策保障上发力。商务部将牵头建立再生资源回收利用工作体系，完善横向协作、纵向联动的工作机制，制定工作方案，建立工作清单，开展定期调度。加紧研究修订《再生资源回收管理办法》，支持各地因地制宜健全再生资源回收法制体系。（澎湃新闻）", "ctime": 1794906715, "time_str": "17:11:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261117/c681914213.shtml"}, {"id": "5686171", "title": "博菲电气：拟以1500万元-3000万元回购公司股份", "content": "博菲电气公告，拟以不低于人民币1500万元（含本数）且不超过人民币3000万元（含本数）回购公司股份，回购价格不超过人民币38元/股。回购股份的用途为股权激励或员工持股计划。按回购金额上限3000万元测算，预计回购股份数量为78.95万股，约占公司当前总股本的0.91%；按回购金额下限1500万元测算，预计回购股份数量为39.47万股，约占公司当前总股本的0.45%。回购期限为自公司董事会审议通过本次回购方案之日起不超过12个月。公司已取得中国工商银行股份有限公司嘉兴分行出具的《贷款承诺函》，承诺给予公司不超过人民币1亿元的股份回购专项贷款，期限3年。", "ctime": 1794906706, "time_str": "17:11:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261117/c681914201.shtml"}, {"id": "5686155", "title": "贝莱德对金蝶国际的多头持仓比例降至6.2%", "content": "据香港交易所披露，贝莱德（BlackRock）对金蝶国际软件集团有限公司的多头持仓比例于2026年11月12日从7.01%降至6.2%。", "ctime": 1794906642, "time_str": "17:10:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261117/c681914109.shtml"}, {"id": "5686151", "title": "贝莱德对美团-W的多头持仓比例降至5.84%", "content": "据香港交易所披露，贝莱德（BlackRock）对美团 - W的多头持仓比例于2026年11月12日从6.09%降至5.84%。", "ctime" jqka.com.cn/20261117/c681913726.shtml"}, {"id": "5686071", "title": "重庆证监局：对重庆百盐投资及相关责任人出具警示函，涉及存在非市场化发行公司债等", "content": "重庆证监局近日披露，经查，重庆百盐投资（集团）有限公司（以下简称百盐投资或公司）存在非市场化发行公司债券、未按约定用途使用募集资金、未及时披露重大事项的行为，违反了有关规定，时任董事长冯树林、时任总经理吴鉴霖、时任总经理陈国政、时任信息披露事务负责人杨清华对前述行为负主要责任。决定对百盐投资及冯树林、吴鉴霖、陈国政、杨清华采取出具警示函的行政监管措施，并记入证券期货市场诚信档案。", "ctime": 1794906370, "time_str": "17:06:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261117/c681913604.shtml"}, {"id": "5686031", "title": "京东物流：2026年第三季度收入同比增长16.1%", "content": "京东物流公告，公司2026年第三季度收入639.53亿元，同比增长16.1%；毛利59.77亿元，同比增长19.4%；经营利润17.07亿元，同比增长32.6%；期间利润17.02亿元，同比下降13.3%；非国际财务报告准则经营利润20.95亿元，同比增长37.9%。外部一体化供应链客户收入105亿元，同比增长17.3%。", "ctime": 1794906276, "time_str": "17:04:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261117/c681913475.shtml"}, {"id": "5686015", "title": "兆驰股份：拟以1亿元-1.5亿元回购公司股份", "content": "兆驰股份公告，拟以不低于1亿元且不超过1.5亿元回购公司股份，回购价格不超过10.24元/股，回购股份用于维护公司价值及股东权益（出售）。按回购金额上限1.5亿元测算，预计回购股份数量1464.84万股，约占当前公司总股本的0.32%；按回购金额下限1亿元测算，预计回购股份数量976.56万股，约占当前公司总股本的0.22%。回购期限为自董事会审议通过本次回购股份方案之日起3个月内，资金来源为公司自有资金和/或自筹资金。公司已取得中国工商银行深圳市分行出具的贷款承诺函，同意提供不超过人民币4.5亿元的股份回购专项贷款。", "ctime": 1794906215, "time_str": "17:03:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261117/c681913390.shtml"}, {"id": "5686009", "title": "京东工业：2026年第三季度收入80.33亿元，同比增长36.2%", "content": "京东工业公告，2026年第三季度未经审计收入80.33亿元，2025年同期58.97亿元，同比增长36.2%；经营利润3.3亿元，2025年同期1.73亿元，同比增长90.3%；期间利润2.97亿元，2025年同期1.98亿元，同比增长49.7%。", "ctime": 1794906198, "time_str": "17:03:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261117/c681913362.shtml"}, {"id": "5685997", "title": "歌礼制药－Ｂ：向美国FDA递交ASC36_37o FDC新药临床试验申请", "content": "歌礼制药－Ｂ公告，公司已向美国FDA递交ASC36_37o FDC的新药临床 , "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261117/c681913246.shtml"}, {"id": "5685975", "title": "《数字广东建设“十五五”规划》：加快打造新的万亿级数字产业集群 壮大集成电路制造、先进封测等产业", "content": "广东省人民政府印发《数字广东建设“十五五”规划》，其中提到，锻造数字经济核心产业新优势。加快打造新的万亿级数字产业集群。壮大集成电路制造、先进封测等产业。培育光通信芯片、光传感芯片等产业集群，布局人工智能芯片设计和制造。做强高端机器人核心部件制造业。培育6G产业，加快新一代核心器件与网络通信设备产业化。发展“人工智能+”软件信息产业，推动传统软件智能重构。强化“模数共振”，培育模型即服务、智能体即服务等新业态，构建“通用模型一原生智能体一行业适配”体系，探索发展世界模型。发展超高清视频与新型显示等智能显示终端。推广工业机器人、服务机器人等智能产品。做强AI手机、AI电脑、智能家居、智能网联汽车等产业，支持低空产品研发制造。探索类脑智能等新一代智能终端。", "ctime": 1794906112, "time_str": "17:01:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261117/c681913239.shtml"}, {"id": "5685967", "title": "美股大型科技股盘前多数下跌，特斯拉跌0.7%", "content": "美股大型科技股盘前多数下跌，SK海力士涨0.4%，英伟达涨0.3%；SpaceX、美光科技持平；Meta、特斯拉跌0.7%，亚马逊跌0.4%，微软、苹果跌0.3%，谷歌A跌0.2%。", "ctime": 1794906089, "time_str": "17:01:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261117/c681913202.shtml"}, {"id": "5685927", "title": "我国牵头制定的全球首个物联网智慧水产养殖国际标准发布", "content": "记者今天从国家标准委获悉，由我国专家牵头，联合美国、挪威、印度、加拿大等多国专家共同研制的国际标准《物联网 内陆智慧水产养殖总体技术要求》正式发布。这是全球首个面向智慧水产养殖的国际标准，标志着我国在智慧农业与物联网融合领域的技术方案获得国际认可。当前，全球水产养殖行业数字化转型相对滞后，缺少统一规范的水质监测、环境管控、疫病预警等智慧化解决方案，普遍存在养殖风险高、人工管护效率偏低等痛点。该标准覆盖户外养殖鱼塘、陆基工厂化循环水养殖、活鲜水产品供应链等典型场景，从系统、设备、应用三个层级明确总体架构与技术要求，为智慧渔业搭建起一套可落地的国际技术框架。（央视新闻）", "ctime": 1794906016, "time_str": "17:00:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261117/c681913088.shtml"}, {"id": "5685895", "title": "蚂蚁技术研究院与西湖心辰共同发布世界模型Duo", "content": "11月17日，蚂蚁技术研究院与西湖心辰共同发布Duo，Reciprocal World Model（RWM，双向世界模型）的首个实现。据介绍，它通过Intent和Realization两个紧密耦合的模块，将智能主体内化为世界的一部分，原生支持全双体、实时、双向的交互。（界面新闻）", "ctime": 1794905802, "time_str": "16:56:42", "stock_code": "", "stock_name": "", "stock_marke   const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
