}
.score-bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s; }
.up { color: var(--red); }
.down { color: var(--green); }
.pulse { animation: pulse 2s infinite; }
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}
.glow { box-shadow: 0 0 20px rgba(59,130,246,0.15); }

9万元（不含交易费用）。", "ctime": 1784884763, "time_str": "17:19:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260724/c678419534.shtml"}, {"id": "4801571", "title": "伊拉克北部库区首府遭无人机袭击", "content": "伊拉克北部库尔德自治区（库区）安全部门一名消息人士24日告诉新华社记者，库区首府埃尔比勒当天上午遭到6架无人机袭击。\n\n该消息人士说，5架来袭无人机在埃尔比勒国际机场附近被击落，另有一架无人机在农田坠毁并引发火灾，民防人员已赶赴现场扑灭大火。\n\n据伊拉克媒体24日报道，当天上午，埃尔比勒上空传出爆炸声。\n\n埃尔比勒国际机场附近的军事基地驻有美国主导的国际联盟部队。近日，美国驻伊拉克埃尔比勒领馆频繁遭无人机袭击。(新华社)", "ctime": 1784884757, "time_str": "17:19:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260724/c678419527.shtml"}, {"id": "4801569", "title": "美称考虑重启对伊大规模作战 专家：意在施压伊朗让步", "content": "美伊2月28日爆发大规模冲突，至6月中旬双方签署谅解备忘录后，战事一度暂缓。然而进入7月，美军又开始对伊朗进行一定强度的军事打击。美国总统特朗普7月23日表示，他正在认真考虑在伊朗重新启动重大军事行动。在第一轮的冲突中，美国并未占据明显优势，如今美国为何又准备“大打出手”，胜算有多少？美意在施加战略压力 迫使伊朗妥协\n西北大学区域国别学院教授 王晋：美国咄咄逼人的表态，是为了向伊朗施加新的战略压力。在过去的10几天中，美国尽管向伊朗发动了激烈的、高频次的军事打击，但是始终没有能够压迫伊朗在外交立场上做出巨大让步。在此背景下，一方面，美国不仅发出威胁，而且从当前的军事部署来看，很可能会加码向伊朗发动新一轮规模更大、力度更强、范围更广的军事行动。其目的在于希望通过军事打击削弱伊朗的反击能力和战略能力，进一步向伊朗施加巨大的压力。（央视新闻）", "ctime": 1784884738, "time_str": "17:18:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260724/c678419517.shtml"}, {"id": "4801525", "title": "鱼跃医疗：腕部动态血压记录仪取得医疗器械注册证", "content": "鱼跃医疗公告，近日收到了江苏省药品监督管理局颁发的关于腕部动态血压记录仪的《医疗器械注册证》。该产品用于单次或24小时内设定的不同时间段里在静止情况下测量成人（18周岁及以上）的收缩压、舒张压、脉率，其数值供临床参考。", "ctime": 1784884407, "time_str": "17:13:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260724/c678419331.shtml"}, {"id": "4801481", "title": "永顺生物：完成回购注销50000股股票", "content": "永顺生物公告，公司于2026年5月22日召开年度股东会，审议通过回购注销1名激励对象已获授但尚未解除限售的50000股限制性股票。本次回购价格为4.1元/股，回购总金额为人民币20.5万元。公司通过股份回购专用证券账户，共回购50000股，占回购前公司总股本的比例为0.02%。已于2026年7月23日在中国证券登记结算有限责任公司北京分公司办理完毕上述50000股回购股份的注销手续。注销完成后，公司股份总额由2.73亿股减少至2.73亿股 e": "金冠股份：收到吉林证监局警示函", "content": "金冠股份公告，公司及相关责任人因项目中标金额披露不准确，违反了《上市公司信息披露管理办法》相关规定，收到吉林证监局警示函。2026年7月22日，公司公告中标金额约为2.52亿元，次日更正为1.57亿元，错误金额占更正前金额的37.76%。公司董事长邬劲松、副董事长张艳利、总经理马丹阳、董事会秘书吴帅未履行勤勉尽责义务，对违规行为负有主要责任。", "ctime": 1784883210, "time_str": "16:53:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260724/c678418356.shtml"}, {"id": "4801303", "title": "两高：依法从严惩处内幕交易、泄露内幕信息犯罪", "content": "最高人民法院、最高人民检察院7月24日联合发布《关于修改〈最高人民法院、最高人民检察院关于办理内幕交易、泄露内幕信息刑事案件具体应用法律若干问题的解释〉的决定》，修改决定自2026年7月27日起施行。据了解，修改决定进一步明确关键主体更严格的法律责任。新增规定“控股股东、实际控制人或者相关决策人员向关系密切人员透露形成内幕信息初步意向的时间，或者根据该初步意向进行相关交易的时间，应当视为动议的初始时间”。对内幕信息生成起关键作用的主体所涉内幕信息敏感期进行明确、具体的规定，杜绝其利用时间差进行内幕交易或者泄露内幕信息，进一步突出惩治重点，强化源头治理。（新华社）", "ctime": 1784883149, "time_str": "16:52:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260724/c678418303.shtml"}, {"id": "4801301", "title": "欧圣电气：调整全资子公司购买Producteers International GmbH 100%股权价款支付安排", "content": "欧圣电气公告，公司于2026年7月24日召开第四届董事会第五次会议，审议通过了《关于调整全资子公司购买Producteers International GmbH 100%股权相关价款支付安排的议案》。根据新协议，卖方2026及2027年度或有对价（Earn-Out）相关权利由一次性固定金额替代，买方向卖方支付总额为245万欧元的一次性支付款（Lump Sum Payment）。该一次性支付款应于买方书面确认卖方已完成全部交接事项，即协议中约定的Transition Period完成后10个工作日内支付。此外，卖方就其潜在的纳税义务向买方支付一次性支付25万欧元，卖方实际收到的Earn-Out支付金额为220万欧元。", "ctime": 1784883137, "time_str": "16:52:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260724/c678418296.shtml"}, {"id": "4801299", "title": "中重科技：实际控股人谷峰兰已增持83.5万元", "content": "中重科技公告，实际控股人、副董事长谷峰兰女士于2026年7月24日通过上海证券交易所交易系统以集中竞价的方式增持公司股份10万股，约占公司总股本的0.01577%，累计增持金额83.5万元（不含交易费用）。本次增持不触及权益变动，不会导致股东身份发生变化；增持主体目前无后续增持计划。", "ctime": 1784883131, "time_str": "16:52:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260724/c678418295.shtml"}, {"id": "4801291", "title": "基辅遭俄导弹袭击", "content": "当地时间今天（7月24日）中午，乌克兰首都基辅传出多声爆炸声。乌克兰空军称，有导弹正朝基辅市袭来。基辅市长称，防空系统正在拦截空中目标。俄罗斯国防部今天早些时候通报，过去一夜，俄军防空力量在莫斯科地区（含莫斯科市及莫斯科州）和其他14个州、边疆区上空，以及克里米亚地区、亚速海和黑海水域上空，拦截并摧毁571架乌克兰无人机。有消息称，乌克兰无人机袭击了位于俄罗斯圣彼得堡和列宁格勒州的电商物流仓库。乌克兰总统泽连斯基称，乌军发起远程打击，“命中俄罗斯基洛夫一处核心军工企业”。", "ctime": 1784882900, "time_str": "16:48:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260724/c678418105.shtml"}, {"id": "4801285", "title": "诺唯赞：控股股东已增持0.63%", "content": "诺唯赞公告，控股股东诺唯赞投资于2026年6月22日至7月23日通过集中竞价交易方式累计增持公司股份325.75万股，增持股份比例约占公司总股本的0.63%。本次权益变动后，诺唯赞投资持股由2.1亿股变动至2.14亿股，控股股东及其一致行动人合计持股比例由58.38%增加至59.01%，权益变动比例触及1%刻度。", "ctime": 1784882850, "time_str": "16:47:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260724/c678418031.shtml"}, {"id": "4801259", "title": "渤海汽车：北汽集团拟增持2500万元至5000万元", "content": "渤海汽车公告，间接控股股东北汽集团计划自本公告披露之日起6个月内，通过上海证券交易所系统以集中竞价方式增持公司A股股份，累计增持金额不低于人民币2500万元，不超过人民币5000万元。北汽集团直接持有公司股份2.06亿股，持股比例21.71%。", "ctime": 1784882681, "time_str": "16:44:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260724/c678417932.shtml"}, {"id": "4801247", "title": "工业和信息化部赴有关汽车生产企业开展监督检查", "content": "为进一步规范汽车产业竞争秩序、提升汽车产品生产一致性和质量安全水平，工业和信息化部装备工业一司24日赴广汽埃安新能源汽车股份有限公司、肇庆小鹏汽车有限公司开展道路机动车辆生产企业产品安全保障能力和生产一致性监督检查，重点检查企业的智能网联汽车安全保障能力、设计开发及生产能力、生产一致性保证能力等生产准入条件保持情况，现场随机抽取样车、动力电池等，转送至有关机构进行国家标准符合性等检验检测。据悉，下一步，工业和信息化部装备工业一司将持续组织对汽车、摩托车生产企业及产品开展监督检查，依法依规对发现存在问题的企业进行严肃处理，坚决守牢汽车产品安全底线，切实维护消费者合法权益。（新华社）", "ctime": 1784882524, "time_str": "16:42:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260724/c678417850.shtml"}, {"id": "4801231", "title": "广信材料：完成回购注销59.72万股股票", "content": "广信材料公告，完成回购注销59.72万股股票，占回购注销前公司总股本2.08亿股的0.29%。", "ctime": 1784882461, "time_str": "1 ": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260724/c678417072.shtml"}, {"id": "4801047", "title": "杭州园林：与清微智能等共同投资设立合资公司", "content": "杭州园林公告，公司拟与北京清微智能科技股份有限公司、道客智算（上海）科技有限公司、芯计源信息科技（上海）有限公司共同投资设立杭微天算（上海）智能科技有限公司，注册资本2000万元。其中，杭州园林认缴出资1020万元，持股51%；清微智能认缴出资300万元，持股15%；道客智算认缴出资300万元，持股15%；芯计源信息认缴出资380万元，持股19%。合资公司处于筹备阶段，尚未正式开展业务。", "ctime": 1784880997, "time_str": "16:16:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260724/c678417017.shtml"}, {"id": "4801045", "title": "浩辰软件：首次回购0.33%公司股份，已支付资金总额为人民币852.51万元", "content": "浩辰软件公告，2026年7月24日，公司通过上海证券交易所交易系统以集中竞价交易方式首次回购公司股份31.66万股，占公司总股本9542.04万股的比例为0.33%，回购成交的最高价为27.14元/股，最低价为26.56元/股，支付的资金总额为人民币852.51万元（不含印花税、交易佣金等交易费用）。", "ctime": 1784880993, "time_str": "16:16:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260724/c678417015.shtml"}, {"id": "4801041", "title": "全聚德：预计上半年净利润同比增长3.39%-25.20%", "content": "全聚德公告，预计2026年上半年净利润为1280万元–1550万元，同比增长3.39%-25.20%。报告期内，公司营业收入同比小幅下降，但是公司持续推进降本增效，对原材料、人工、能源等成本进行精细管控，有效压降成本费用；同时通过主动优化门店布局，持续提升整体盈利水平。", "ctime": 1784880988, "time_str": "16:16:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260724/c678417010.shtml"}, {"id": "4801039", "title": "巴西反对美国连连加税 卢拉称“会找新买家”", "content": "巴西政府发表声明，反对美国以所谓“强迫劳动”为由对巴西征收12.5%的关税，认为该措施“缺乏法律依据”。巴西方面将立即启动相关程序以维护国家利益。巴西发展、工业与贸易部长马尔西奥·罗萨指出，叠加美国近期对部分巴西产品加征25%的关税，巴西鞋类、机械设备、零部件、服装及非医药化工等多个行业面临最高37.5%的税率，产业或受到严重冲击。他表示，巴西希望通过谈判推动美国取消相关关税，但不放弃采取对等措施的可能性。（新华社）", "ctime": 1784880911, "time_str": "16:15:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260724/c678416962.shtml"}, {"id": "4801029", "title": "两部门明确离岸信托个税事项", "content": "记者从财政部了解到，财政部、税务总局7月24日发布公告，明确离岸信托个人所得税有关事项。根据公告，居民将财产装入离岸信托以及离岸信托存续期间产生的收益，需按照规定申报缴纳个人所得税。此次发布的公告对离岸信托设立环节、存续环节和终止环节的个人所得税有关事项分别予以明确。例如，在设立环节，居民个人将财产装入离岸信托，以装入财产的市场价值扣除财产原值和合理费用后的余额为应税所得，按照“财产转让所得”征收个人所得税，适用20%税率。再如，在存续环节，对于居民个人装入财产的离岸信托存续期间产生的收益，根据收益性质分别按照“财产转让所得”和“利息、股息、红利所得”，按年计算缴纳个人所得税，适用20%税率。（新华社）", "ctime": 1784880884, "time_str": "16:14:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260724/c678416949.shtml"}, {"id": "4801021", "title": "两部门：由于离岸信托往往设立在信息透明度低、税负较低的国家和地区，部分个人利用其转移资产、隐匿财富及逃避税", "content": "近日，财政部、税务总局发布了《关于离岸信托征收个人所得税有关事项的公告》。财政部税政司、税务总局所得税司有关负责人就此回答了记者提问。近年来，一些个人通过设立离岸信托进行财富代际传承、跨境资产配置以及风险管理。由于离岸信托往往设立在信息透明度低、税负较低的国家和地区，部分个人利用其转移资产、隐匿财富及逃避税。按照我国个人所得税法对居民全球所得征税的基本原则，《公告》明确了离岸信托设立、存续、终止清算等环节的征税规定，有利于提高税收确定性和透明度，便于纳税人合规遵从；有利于促进社会公平，维护国家权益，稳定纳税人预期。", "ctime": 1784880792, "time_str": "16:13:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260724/c678416903.shtml"}, {"id": "4801013", "title": "外交部：中方愿同巴西进一步拓展健康稳定的经贸合作", "content": "7月24日，外交部发言人林剑主持例行记者会。有记者就巴西输华牛肉配额相关情况提问。林剑表示，中方有关主管部门、商会已对进口牛肉启动保障措施调查事表态。中国连续17年是巴西第一大贸易伙伴，今年上半年，中巴贸易额同比增长近30%，对华出口在巴西对外出口总额占比超过30%。中方愿同包括巴西在内的有关各方保持沟通，进一步拓展健康稳定的经贸合作。（央视新闻）", "ctime": 1784880720, "time_str": "16:12:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260724/c678416830.shtml"}];

  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
