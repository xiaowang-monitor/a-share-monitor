76009", "title": "中物联发出“反内卷”倡议，引导规范采购行业发展", "content": "中国物流与采购联合会今天（22日）在第七届国有企业数智化采购与供应链大会上发出“科学采购、反对内卷，全面提升采购价值创造能力”倡议，倡导行业竞争从“比价格”向“比价值、比质量、比创新”转变，为行业规范发展提供有益引导。（央视新闻）", "ctime": 1784699834, "time_str": "13:57:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260722/c678348365.shtml"}, {"id": "4775953", "title": "峰飞航空与顺丰签署低空运输合作框架协议，将落地适配海上风电产业的专属低空运维方案", "content": "7月22日，2026国际低空经济博览会开幕首日，峰飞航空与顺丰正式签署低空运输合作框架协议。根据协议内容，双方将率先落地适配海上风电产业的专属低空运维方案，针对性解决远海风电场离岸距离远、物资人员运输响应慢、风机巡检效率不足等行业难题。通过聚焦海上能源设施运维、大件物流、海岛及远海运输等核心应用场景，共同研发标准化低空运输与智能运维解决方案，搭建行业可复制、规模化落地的海空一体化服务标杆。（人民财讯）", "ctime": 1784699492, "time_str": "13:51:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260722/c678348280.shtml"}, {"id": "4775917", "title": "网传“北京或将推出郊区专属号牌”  相关部门回应", "content": "近期，有关“北京或将推出郊区专属号牌”的消息在社交平台上出现并传播，引发了讨论。网友们猜测，北京市会不会面向远郊居民设立独立摇号池，中签难度更低，配套实施机动车差异化管理。就“郊区专属号牌”传闻，记者拨打了北京市小客车数量调控政策咨询电话，北京市交通委短信回复：北京自2011年实施小客车调控，有效控制机动车增速，服务治堵与大气治理，政策仍具备持续实施的必要性。主管部门多次优化调控细则，完善指标分配机制。按照现行规定，指标依靠摇号、积分排序等方式发放，普通摇号设置多重随机机制，中签结果存在随机性。下一步，将充分考虑市民的合理出行需求和道路交通、环境承载能力，持续科学优化政策，不断提高公共交通特别是绿色交通服务水平，努力构建不依赖小汽车也能便利出行的城市交通体系。“探索实行城区、郊区差异化车辆购置指标管理方式”不能简单理解为推行“郊区专属号牌”。然而公众关注、讨论这一话题的背后，是客观存在的出行需求。(央视新闻)", "ctime": 1784699357, "time_str": "13:49:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260722/c678348252.shtml"}, {"id": "4775909", "title": "协鑫能科新设科技公司 含多项AI业务", "content": "企查查APP显示，近日，苏州协鑫拓肯科技有限公司成立，法定代表人为费智，注册资本为5000万元，经营范围包含云计算装备技术服务；人工智能基础软件开发；人工智能应用软件开发；人工智能公共数据平台等。企查查股权穿透显示，该公司由协鑫能科旗下无锡协鑫元极科技有限公司及苏州协鑫鑫元科技有限公司共同持股。（人民财讯）", "ctime": 1784699198, "time_str": "13:46:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260722/c678348151.shtml"}, {"id": "4775881", "title": "三夫户外：今年会加快线下渠道的拓展", "content": "三夫户外7月21日接受机构调研时表示，公司线下线上销售渠道协同发展。公司今年会加快线下渠道的拓展，上半年，公司直营门店已经新开业6家，其中HOUDINI北京西红门荟聚店于4月1日开业，4月30日X-BIONIC、HOUDINI、Klattermusen北京首创奥莱三家店同时开业，6月5日三夫战术北京首创奥莱店开业、6月28日北京798X-BIONIC战术户外原点店开始营业，后续还会有北京蓝色港湾、哈尔滨西城红场、长春欧亚卖场店、沈阳万象城、上海青浦奥莱等新店落地或扩店计划。公司在门店选址上，注重当地经济水平、户外运动成熟度及消费认知度，现阶段门店在华北、东北地区较为集中。（人民财讯）", "ctime": 1784699018, "time_str": "13:43:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260722/c678348098.shtml"}, {"id": "4775857", "title": "国内首颗定量高光谱智算卫星成功入轨", "content": "2026年7月22日10时54分，由西安中科西光航天科技集团有限公司全自主研制的国内首颗定量高光谱智算卫星——“西光贰号01星（彩云高光谱01星）”，搭载引力一号遥四运载火箭在我国东海海域成功发射入轨。该星是中科西光航天为云南省地质矿产勘查开发局深度定制开发的首颗卫星，也是云南地矿“彩云星座”系列的首颗高光谱卫星。同时也是中科西光航天与之江实验室开启战略合作后，集高光谱定量遥感技术突破与在轨实时智能处理于一体的首颗AI算力卫星。（科创板日报）", "ctime": 1784698789, "time_str": "13:39:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260722/c678348069.shtml"}, {"id": "4775855", "title": "AI应用端逆势活跃，国安股份直线涨停", "content": "午后AI应用端逆势活跃，国安股份直线涨停，此前北投科技涨停，绿盟科技涨超10%，国子软件、奇安信、亚信安全、三六零等跟涨。", "ctime": 1784698767, "time_str": "13:39:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260722/c678348066.shtml"}, {"id": "4775853", "title": "伊朗称袭击美国亚马逊公司在巴林的数据基础设施", "content": "据伊朗塔斯尼姆通讯社22日报道，伊朗武装部队袭击了位于巴林的美国亚马逊公司中央数据基础设施，称该设施是美军军事信息交换关键站点之一。(新华社)", "ctime": 1784698760, "time_str": "13:39:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260722/c678348064.shtml"}, {"id": "4775849", "title": "报告：过度押注人形机器人可能带来产业资源错配", "content": "7月22日，普华永道中国宣布成立人工智能研究院，并同步发布首批核心研究成果《2026年智能机器人产业发展白皮书》。白皮书认为，人形机器人的核心价值在于场景独特性，而非对其他形态的全面替代。未来3—4年，单一的人形机器人形态无法适配全场景作业需求，过度押注可能带来产业资源错配与非理性发展。到2030年，三类机器人将形成清晰分工、长期共存的稳定格局。（人民财讯）", "ctime": 1784698730, "time_str": "13:38:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260722/c678348059.shtml"}, {"id": "4775831", "title": "南向资金净买入超50亿港元", "content": "据同花顺iFinD数据，截至目前，南向资金净买入超50亿港元，其中港股通（沪）买入超38.44亿港元，港股通（深）买入超12.05亿港元。", "ctime": 1784698672, "time_str": "13:37:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260722/c678348044.shtml"}, {"id": "4775819", "title": "中际旭创成交额达300亿元", "content": "中际旭创成交额达300亿元，现跌4.10%。", "ctime": 1784698574, "time_str": "13:36:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260722/c678348019.shtml"}, {"id": "4775811", "title": "三星拟投资AI初创公司Mistral数亿欧元", "content": "据报道，韩国三星电子正就向AI初创公司Mistral投资数亿欧元进行谈判，该轮融资有望将Mistral估值推至约200亿欧元（约合228.1亿美元）。报道称，三星在此轮融资中的投资额可能约为10亿欧元。（界面新闻）", "ctime": 1784698509, "time_str": "13:35:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260722/c678348008.shtml"}, {"id": "4775795", "title": "科创50ETF华夏成交额突破100亿", "content": "科创50ETF华夏（588000）成交额连续第四个交易日突破100亿，截至发稿时间该ETF跌2.43%。", "ctime": 1784698402, "time_str": "13:33:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260722/c678347995.shtml"}, {"id": "4775739", "title": "科创50指数跌幅扩大至2%", "content": "科创50指数跌幅扩大至2%，现报1864.92点。", "ctime": 1784698314, "time_str": "13:31:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260722/c678347943.shtml"}, {"id": "4775629", "title": "创业板指跌2% 午后AI硬件板块持续走弱", "content": "创业板指跌幅扩大至2%，上证指数涨0.06%，深证成指跌0.73%。全市场超4000家个股下跌。午后AI硬件板块持续走弱。", "ctime": 1784698216, "time_str": "13:30:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260722/c678347924.shtml"}, {"id": "4775625", "title": "存储芯片概念震荡回落 德明利8天6次跌停", "content": "午后存储芯片概念震荡回落，德明利8天6次跌停，江波龙、佰维存储、西测测试、北京君正、普冉股份等跟跌。", "ctime": 1784698125, "time_str": "13:28:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260722/c678347897.shtml"}, {"id": "4775601", "title": "港股恒生科技指数跌幅达3%", "content": "港股恒生科技指数跌幅扩大至3%，恒生指数现跌1.06%。", "ctime": 1784697967, "time_str": "13:26:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260722/c678347842.shtml"}, {"id": "4775589", "title": "港股PCB概念股快速走低，建滔积层板跌超16%", "content": "港股PCB概念股快速走低，建滔积层板跌超16%，建滔集团跌10%，鼎泰高科跌近6%。", "ctime": 1784697864, "time_str": "13:24:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260722/c678347821.shtml"}, {"id": "4775583", "title": "日经225指数转跌，此前一度涨超2%", "content": "日经225指数转跌，此前一度涨超2%。", "ctime": 1784697782, "time_str": "13:23:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260722/c678347796.shtml"}, {"id": "4775479", "title": "伊朗称对科威特美军基地设施实施打击", "content": "伊朗军方22日发表声明说，伊朗军队使用大量无人机打击了美军位于科威特西部的多哈军营，目标包括弹药库以及地面部队指挥中心的后勤装备。 声明称，多哈军营是驻西亚美军的支援中心，大量美军人员和装备部署于此。 美军中央司令部稍早前称，美军于美国东部时间21日20时15分（北京时间22日8时15分）结束对伊朗境内军事目标新一轮打击，这是美军连续第11晚采取此类行动。(新华社)", "ctime": 1784697157, "time_str": "13:12:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260722/c678347677.shtml"}, {"id": "4775441", "title": "终止与滔搏线上合作，耐克大中华区总经理申凯西回应", "content": "知名运动品牌耐克正进行线上渠道大调整。耐克集团副总裁、大中华区总经理申凯希（CathySparks）称将重构大中华区市场生态，其中重点聚焦打造线上数字市场生态。申凯希坦言，耐克正聚焦战略采取行动，从数字渠道开始重塑市场生态。自2027年1月起，耐克将以天猫、京东和抖音的官方旗舰店以及Nike官方网站和App为核心，重新打造在中国的数字市场生态。作为数字市场调整的一部分，除部分授权合作伙伴外，目前由合作伙伴运营并销售耐克产品的线上店铺，将逐步停止销售耐克产品。同时，申凯希透露，也正在开发由本地团队主导的全新零售概念，并将在未来六个月推向市场。（北京日报）", "ctime": 1784696952, "time_str": "13:09:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260722/c678347639.shtml"}, {"id": "4775427", "title": "航运数据显示21日没有油轮或液化天然气船通过霍尔木兹海峡", "content": "航运数据分析公司凯普勒的数据显示，21日仅有3艘大宗商品船通过霍尔木兹海峡，少于20日的4艘。数据显示，21日当天没有监测到任何超大型油轮或液化天然气运输船通过该海峡。（央视新闻）", "ctime": 1784696871, "time_str": "13:07:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260722/c678347620.shtml"}, {"id": "4775391", "title": "光大期货：金铜油共振走高，黄金波动加剧", "content": "宏观方面，美联储议息会议前开始进入静默期，市场焦点放在美伊冲突方面，昨日美总统明确给美伊会谈的前景泼冷水，称伊朗想会谈但美国“没兴趣”，并将“很快”重击镐山核设施。另外，美国贸易代表格里尔暗示，美国将很快出台新的关税政策以替代即将到期的10%全球进口关税。美伊再次爆发冲突以来，金价在通胀和利率预期反复交易的背景下情绪并未持续悲观，反而重心开始上移，或表明市场对下半年黄金的交易逻辑在逐渐发生转变，但能否持续需进一步观察，短期建议仍以防御为主应对高波动环境。投资者需持续关注美伊冲突、美联储政策预期以及利率抬升预期下海外金融市场是否触发流动性风险等。（光大期货）", "ctime": 1784696714, "time_str": "13:05:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260722/c678347585.shtml"}, {"id": "4775309", "title": "印尼亚齐省发生5.6级地震", "content": "据印度尼西亚气象、气候和地球物理局发布的报告，当地时间22日11时18分，印尼亚齐省加约卢斯县东北约41公里处发生5.6级地震。震源深度10公里。暂无海啸风险。（央视新闻）", "ctime": 1784696383, "time_str": "12:59:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260722/c678347558.shtml"}, {"id": "4775305", "title": "上交所：即时起至收市暂停景顺长城全球半导体芯片产业股票型证券投资基金（QDII-LOF）交易业务", "content": "上交所发布景顺长城全球半导体芯片产业股票型证券投资基金（QDII-LOF）临时停牌公告，根据景顺长城基金管理有限公司申请，本所于2026年7月22日盘中即时起至收市暂停景顺长城全球半导体芯片产业股票型证券投资基金（QDII-LOF）（证券代码：501225）交易业务。", "ctime": 1784696136, "time_str": "12:55:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260722/c678347518.shtml"}, {"id": "4775297", "title": "《林业草原保护利用“十五五”规划》向社会公布", "content": "《林业草原保护利用“十五五”规划》7月22日向社会公布。规划提出，到2030年，“三北”工程三大标志性战役取得决定性胜利，完成自然保护地整合优化，森林、草原、湿地、荒漠生态系统质量和服务功能不断增强，林草多元供给和消费场景更加丰富，林草产业总产值迈上新台阶。规划部署了科学开展大规模国土绿化行动、全面推进自然保护地体系建设、培育壮大林草产业、协同强化生态安全能力建设、持续深化重点领域改革、全力推动创新驱动与开放合作等方面工作。（新华社）", "ctime": 1784695497, "time_str": "12:44:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260722/c678347422.shtml"}, {"id": "4775295", "title": "伊朗军队称出动大批无人机打击美军驻科威特营地", "content": "伊朗军队当地时间22日发布声明称，为回应敌人再次侵犯伊朗部分地区，于数小时前出动大批自杀式无人机，对美军位于科威特西部多哈营地内的弹药库以及陆军指挥中心的后勤装备实施打击。声明表示，多哈营地是美军在科威特西部最核心、最重要的军事基地之一，也是美军在西亚地区的一处后勤保障中心。大量美军陆军装备和士兵，以及海军、空军人员驻扎于此。（央视新闻）", "ctime": 1784695469, "time_str": "12:44:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260722/c678347420.shtml"}, {"id": "4775293", "title": "广西百菲乳业股份有限公司向港交所提交上市申请书", "content": "据港交所文件：广西百菲乳业股份有限公司向港交所提交上市申请书。", "ctime": 1784695460, "time_str": "12:44:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260722/c678347418.shtml"}, {"id": "4775273", "title": "水利部：珠江、长江、淮河流域部分河流将出现涨水过程", "content": "水利部滚动会商分析研判全国的防汛形势，安排部署暴雨洪水防御工作。截至7月22日9时，吉林、辽宁、黑龙江、内蒙古、天津、河北、江苏、广西等地19条河流仍维持超警，最大超警幅度2.26米。据预报，7月22日至7月24日：受上游来水影响，松花江流域松花江干流肇源江段、辽河流域辽河下游干流盘山以下河段及浑河下游干流邢家窝棚以下河段、海河流域蓟运河等主要河流及江苏里下河地区部分河流将维持超警；受降雨影响，珠江流域桂南沿海、长江流域鄂东四水、淮河流域淠河等河流将出现涨水过程，暴雨区内部分中小河流可能发生超警洪水。7月22日8时至7月23日8时，湖北东部、安徽西部部分地区发生山洪灾害可能性大（橙色预警）。水利部7月22日发布橙色山洪灾害气象预警，提醒暴雨洪水影响地区社会公众注意防范。（央视新闻）", "ctime": 1784695048, "time_str": "12:37:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260722/c678347381.shtml"}, {"id": "4775269", "title": "伊朗多地遭美军袭击 首都德黑兰启动防空系统", "content": "据伊朗媒体22日报道，当天凌晨，包括首都德黑兰在内的伊朗多地遭到美军袭击。目前尚无人员伤亡报告。当地时间22日3时（北京时间7时30分）许，记者看到，德黑兰防空系统启动，在夜空中密集拦截不明飞行物，远处可听到爆炸声。德黑兰防空系统当天多次启动应对敌方袭击。（新华社）", "ctime": 1784695007, "time_str": "12:36:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260722/c678347374.shtml"}, {"id": "4775241", "title": "机构：预计2026年全球折叠屏市场同比增长21%，三星保持领先地位", "content": "根据Counterpoint Research最新发布的全球折叠屏智能手机市场预测，2026年全球折叠屏智能手机出货量预计将同比增长21%。得益于消费者对高端阔折叠设备的持续需求、头部智能手机厂商之间日益激烈的产品竞争，以及苹果预计正式入局折叠屏市场，折叠屏市场预计将在2025年的基础上持续扩张。预计三星将在2026年继续保持全球折叠屏智能手机市场领先地位，市场份额预计为32%。不过，随着苹果正式入局，加之华为（尤其是在中国市场）保持强劲势头，2026年的市场格局将与2025年大不相同。预计苹果将在2026年占据25%的市场份额，华为预计占24%，摩托罗拉和荣耀紧随其后，分别占据8%和3%。", "ctime": 1784694411, "time_str": "12:26:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260722/c678347244.shtml"}, {"id": "4775239", "title": "2026年世界互联网大会数字丝路发展论坛开幕", "content": "由世界互联网大会主办，陕西省人民政府承办的2026年世界互联网大会数字丝路发展论坛今天上午在西安开幕。来自全球52个国家和地区以及7个国际组织约800名嘉宾共同出席论坛。这是世界互联网大会连续第三年举办数字丝路发展论坛。本次论坛以“智汇丝路 数启新程——携手构建网络空间命运共同体”为主题，汇聚全球政产学研各界嘉宾，围绕“丝路电商”合作与发展、智能体协同创新发展、数智时代的文化遗产保护与传承、数智健康等议题举办专题论坛。共谋数智技术创新发展之策，共商数字基础设施互联互通之道，共筑数字文明交流互鉴之路，推动共建“一带一路”国家凝聚共识、携手合作，共同把握数智化发展新机遇。（央视新闻）", "ctime": 1784694320, "time_str": "12:25:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260722/c678347230.shtml"}, {"id": "4775237", "title": "辽宁省海洋经济发展大会召开", "content": "7月22日，全省海洋经济发展大会在沈阳召开。辽宁省委书记许昆林出席会议并讲话。许昆林强调，要坚持产业强海，加快建设现代海洋产业体系。深耕海洋渔业，高标准建设现代化海洋牧场，发展深水网箱、养殖工船等新型生产模式，促进海洋产品精深加工和流通，加强品牌建设，提升特色海产品知名度和市场竞争力。做强海洋制造业，加快推进“智改数转”，绘制好“强链补链延链”图谱，加强链主企业和配套企业招引；聚焦关键领域持续攻坚，加快打造高技术船舶与高端海工装备制造基地；积极培育海洋药物与生物制品、海洋新能源、海洋新材料等新产业，发展“海洋+低空经济”等新业态。升级海洋服务业，大力发展航运物流、金融保险、海事法律等现代海洋服务业；统筹推进岸线、湾区、海岛、海域等资源开发利用，推动文旅体商融合发展；前瞻谋划布局游艇产业，有力承接产业规模化扩张，赢得发展主动。（辽宁日报）", "ctime": 1784694102, "time_str": "12:21:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260722/c678347200.shtml"}, {"id": "4775235", "title": "越南VN指数下跌2%", "content": "越南VN指数下跌2%至1695.78点。", "ctime": 1784693995, "time_str": "12:19:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260722/c678347180.shtml"}, {"id": "4775233", "title": "马杜罗和美国检方共同提议明年6月审理其所涉指控", "content": "据美国媒体21日报道，遭美国强行控制的委内瑞拉总统马杜罗与美国司法部检方当天共同提议，将马杜罗所涉指控的审理开始日期定在2027年6月。 报道说，该联合提案是在马杜罗所涉指控听证会前提交的一份法庭文件，该听证会定于22日中午12时在纽约南区联邦地区法院举行。 据报道，控辩双方在文件中表示，他们可能寻求更改审理日程。美国联邦地区法官阿尔文·赫勒斯坦将最终确定日程。 美国1月3日对委内瑞拉发动军事打击，强行控制马杜罗夫妇并将他们带到美国，美国司法部门指控他们犯有毒品走私罪行。1月5日，马杜罗夫妇在纽约南区联邦地区法院首次出庭，拒绝美方所谓“犯罪”指控。目前，马杜罗被关押在纽约布鲁克林区的大都会拘留中心。国际社会广泛谴责美国严重侵犯委内瑞拉主权，威胁拉美地区和平稳定。(新华社)", "ctime": 1784693836, "time_str": "12:17:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260722/c678347049.shtml"}, {"id": "4775225", "title": "晨曦基金宣布不低于5000万元自购旗下私募基金产品", "content": "7月22日，晨曦基金公告，基于对中国资本市场长期稳健发展以及公司主动管理能力的坚定信心，为践行长期投资理念，公司及主要核心人员将于近期使用自有资金不低于人民币5000万元参与申购公司旗下私募证券基金产品。", "ctime": 1784693365, "time_str": "12:09:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260722/c678346998.shtml"}, {"id": "4775223", "title": "特朗普称愿与黎巴嫩真主党对话", "content": "当地时间7月21日，美国总统特朗普在白宫会见黎巴嫩总统奥恩。特朗普表示，美方愿为黎巴嫩提供帮助，包括审查黎武装部队在以军撤离后接管“试点地区”村镇的相关进展，以及解决黎真主党的问题。如果奥恩希望，他愿意与真主党对话。另外，在会谈结束后，特朗普在社交媒体上表示，他计划让所有美国航空公司恢复直飞黎巴嫩的航班。若该计划实现，这将是这条直飞航线暂停40多年后首次恢复。(CCTV国际时讯)", "ctime": 1784693305, "time_str": "12:08:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260722/c678346987.shtml"}, {"id": "4775221", "title": "花旗：中际旭创有望在光模块市场保持领先地位", "content": "花旗分析师在一份研究报告中表示，在AI时代，中际旭创有望在光模块市场保持领先地位。花旗分析师表示，中际旭创全面的产品组合、可扩展的产能以及与全球AI客户的牢固关系，应能巩固其领先地位。他们表示：“数据传输带宽、速度和密度的不断提高，正推动光互连产品迭代周期的加速。“花旗估计，中际旭创在2026年和2027年的光模块出货量可能分别达到3010万只和6020万只。花旗预计，在产能提升和产品组合向高速产品改善的推动下，2025年至2028年中际旭创的收入将以129%的复合年增长率增长。", "ctime": 1784693273, "time_str": "12:07:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260722/c678346982.shtml"}, {"id": "4775219", "title": "三星或向Mistral投资高达10亿欧元", "content": "三星或向Mistral投资高达10亿欧元，寻求成为美国科技巨头的主要替代选择。", "ctime": 1784693136, "time_str": "12:05:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260722/c678346952.shtml"}, {"id": "4775217", "title": "美媒称特朗普批准美国与沙特民用核项目协议", "content": "美国《华尔街日报》21日援引美官员的消息报道说，美国总统特朗普日前正式批准美国与沙特阿拉伯达成一项为沙特提供民用核项目的协议。报道说，这“或为沙特开展铀浓缩活动打开大门”。据报道，协议中一项关键条款规定，如果美国和沙特联合研究认定有必要，美国企业将在沙特建造一座铀浓缩设施。美方官员称，此举有助于美国对沙特核项目施加影响，并防止其“被用于军事目的”。（新华社）", "ctime": 1784693118, "time_str": "12:05:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260722/c678346948.shtml"}, {"id": "4775215", "title": "7月22日午间公告一览：山东墨龙拟配售2567.84万股新H股", "content": "山东墨龙公告，公司于2026年7月21日召开董事会，审议通过了《关于公司根据一般性授权发行H股的议案》。公司与配售代理签订《配售协议》，拟配售2567.84万股新H股，配售价格为每股4.58港元。配售事项所得款项总额预计约为1.18亿元，净额总额预计约为1.16亿元。公司拟将所得款项用于偿还未偿还借款及营运资金。", "ctime": 1784693093, "time_str": "12:04:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260722/c678346945.shtml"}, {"id": "4775213", "title": "日本今年上半年贸易逆差超1万亿日元", "content": "日本财务省22日公布的初步统计结果显示，2026年上半年日本贸易逆差达1.01万亿日元（1美元约合157.75日元），连续第10个半年度出现贸易逆差。 数据显示，今年上半年，日本货物出口额同比增长13.7%，至60.66万亿日元；进口额同比增长10.7%，至61.68万亿日元。半导体等电子部件进出口均大幅增长，是进出口增长的主要动力。此外，出口增长还受汽车等商品出口增加带动；进口增长还受有色金属等商品进口增加影响。 从地区来看，日本减少了从中东的石油进口，但日本自美国进口的原油和石油制品进口额则分别同比大增355.4%和210.0%。 同日公布的数据显示，由于日本原油进口成本持续处于高位，6月日本贸易逆差为4069亿日元。", "ctime": 1784692946, "time_str": "12:02:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260722/c678346876.shtml"}, {"id": "4775211", "title": "港股午评：恒生指数跌0.83%，恒生科技指数跌2.11%", "content": "港股午间收盘，恒生指数跌0.83%，恒生科技指数跌2.11%。恒指   const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
