意继续就此保持沟通对话。 (央视新闻)", "ctime": 1775634420, "time_str": "15:47:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260408/c675831471.shtml"}, {"id": "4198887", "title": "中方是否明确要求伊朗同意某种停火框架？外交部：中方一直在劝和促谈", "content": "4月8日，外交部发言人毛宁主持例行记者会。《纽约时报》记者提问，请问中方是否曾向伊朗提出明确要求，希望其同意某种停火框架？对此，毛宁表示：“刚刚我已经介绍了中方所做的工作，我们一直在积极劝和促谈，推动平息战火。”（澎湃新闻）", "ctime": 1775634408, "time_str": "15:46:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260408/c675831468.shtml"}, {"id": "4198885", "title": "如何评价朝鲜连日发射弹道导弹？外交部：有关方对发射物界定不同", "content": "4月8日，外交部发言人毛宁主持例行记者会。韩联社记者提问，第一，朝鲜于7日至8日连续两天发射了弹道导弹，此举违反了联合国安理会决议。中方对此如何评价？第二个问题，针对韩国总统李在明对无人机进入朝鲜领空事件表示遗憾一事，朝鲜劳动党中央委员会部长金与正6日说朝鲜国家元首评价其态度坦率而大方，但与此同时朝方重申了对韩国的敌对路线，中方如何评价朝鲜最近的动向？对此，毛宁表示，“你的第一个问题，我们注意到有关方面对发射物的界定存在不同的看法。”关于第二个问题，毛宁回应道，我们注意到近日有关方面的表态，中方在朝鲜半岛问题上的基本立场没有变化。（澎湃新闻）", "ctime": 1775634402, "time_str": "15:46:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260408/c675831464.shtml"}, {"id": "4198859", "title": "傲农生物：3月生猪销售量同比增41.3%", "content": "傲农生物公告，2026年3月生猪销售量18.58万头，同比增加41.3%，环比增加25.49%；当年累计销售量50.04万头。期末存栏80.38万头，同比增加47.77%，较2026年2月末增加3.20%，较2025年12月末增加8.13%。", "ctime": 1775634154, "time_str": "15:42:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260408/c675830409.shtml"}, {"id": "4198857", "title": "华海清科：第1000台CMP装备发往国内集成电路龙头企业", "content": "华海清科公告，公司第1000台CMP装备正式出机并发往国内集成电路龙头企业。该装备在出厂前已完成相关检测，但抵达客户现场后，仍需开展安装调试与工艺验证工作。公司依托在CMP领域积累的技术与产业经验，持续将技术能力向更多关键工艺环节延伸拓展，不断完善关键工艺装备矩阵，构建起“装备+服务”的平台化发展格局。", "ctime": 1775634140, "time_str": "15:42:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260408/c675830370.shtml"}, {"id": "4198855", "title": "南向资金净卖出超180亿港元", "content": "据同花顺iFinD数据，截至目前，南向资金净卖出超180亿港元，其中港股通（沪）卖出超125.65亿港元，港股通（深）卖出超54.61亿港元。", "ctime": 1775634134, "time_str": "15:42:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260408/c675830360.shtml"}, {"id": "4198847", "title": "上海医药：硫酸妥布霉素注射液通过仿制药一致性评价", "content": "上海医药公告，近日下属上海禾丰制药有限公司的硫酸妥布霉素注射液收到国家药品监督管理局颁发的《药品补充申请批准通知书》（通知书编号：2026B01918），该药品通过仿制药一致性评价。", "ctime": 1775634042, "time_str": "15:40:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260408/c675830337.shtml"}, {"id": "4198845", "title": "明泰铝业：2025年净利润19.77亿元，同比增长13.06%", "content": "明泰铝业发布业绩快报，2025年度营业总收入351.37亿元，同比增长8.71%；净利润19.77亿元，同比增长13.06%。报告期内，公司紧抓新能源、交通运输、电子轻工等下游领域结构性机遇，铝板带箔产销量同比稳健增长，推动营业收入保持合理增长。同时，公司持续优化客户结构与订单质量，聚焦高附加值、长周期订单，营收规模与盈利质量同步提升，整体运营效率与抗风险能力进一步增强。", "ctime": 1775634030, "time_str": "15:40:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260408/c675830334.shtml"}, {"id": "4198843", "title": "中恒电气：控股股东中恒科技投资拟接受宁德时代增资", "content": "中恒电气公告，为促进实现公司与宁德时代新能源科技股份有限公司的战略合作，公司控股股东杭州中恒科技投资有限公司拟接受宁德时代对其进行增资。宁德时代拟以41亿元认购中恒科技投资新增注册资本人民币1441.18万元，出资方式为货币及股权。", "ctime": 1775634010, "time_str": "15:40:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260408/c675830332.shtml"}, {"id": "4198837", "title": "济民健康：控股子公司DB006溶瘤腺病毒注射液获临床试验批准", "content": "济民健康公告，控股子公司海南济民博鳌国际医院有限公司的DB006溶瘤腺病毒注射液获得国家药品监督管理局药物临床试验批准通知书。该药品为治疗末线恶性实体肿瘤的基因治疗药物，此前已通过专利及技术转让自广州达博生物制品有限公司取得。", "ctime": 1775633986, "time_str": "15:39:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260408/c675830292.shtml"}, {"id": "4198819", "title": "黎巴嫩军方呼吁民众暂勿返回该国南部地区", "content": "当地时间8日，黎巴嫩军方发表声明，呼吁民众暂勿返回该国南部地区。声明称，鉴于当前地区局势发展，军方指挥部呼吁民众不要返回南部村镇，并避免靠近以色列国防军控制区域，以确保自身安全，特别是防范因接近相关地区而面临以军袭击的风险。当天早些时候，黎巴嫩南部多个城镇遭遇以色列国防军袭击。（央视新闻）", "ctime": 1775633853, "time_str": "15:37:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260408/c675830256.shtml"}, {"id": "4198817", "title": "伊朗议长将率团与美国谈判 美方由副总统万斯率团", "content": "伊朗媒体8日报道说，伊朗伊斯兰议会议长卡利巴夫将率领伊朗代表团在巴基斯坦伊斯兰堡与美国举行谈判，美方由副总统万斯率团参加。巴基斯坦总理夏巴兹8日在社交媒体上说，他邀请伊美双方代表团10日在伊斯兰堡进一步谈判，以达成解决所有争端的最终协议。(新华社)", "ctime": 1775633839, "time_str": "15:37:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260408/c675830254.shtml"}, {"id": "4198807", "title": "南向资金净卖出超170亿港元", "content": "据同花顺iFinD数据，截至目前，南向资金净卖出超170亿港元，其中港股通（沪）卖出超120.71亿港元，港股通（深）卖出超49.47亿港元。", "ctime": 1775633763, "time_str": "15:36:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260408/c675830221.shtml"}, {"id": "4198797", "title": "韩正会见葡萄牙议长阿吉亚尔-布兰科", "content": "国家副主席韩正8日在京会见葡萄牙议长阿吉亚尔-布兰科。韩正表示，上个月，习近平主席致电祝贺塞古罗总统就职，强调双方要加强战略沟通，巩固高水平互信，促进高质量合作，为中葡全面战略伙伴关系发展指明了方向。中方愿同葡方一道，遵循两国元首的战略引领，筑牢高水平互信，促进清洁能源、数字经济、人工智能、医药健康等领域合作，共同拓展以澳门为平台的合作，推动中欧坚持伙伴定位，维护国际团结协作，以中葡合作的稳定性、互利性、开放性，为中欧合作以及世界和平发展注入更多正能量。阿吉亚尔-布兰科表示，葡中拥有高水平互信，葡方赞赏“一国两制”在澳门成功实践，希望进一步促进双边务实合作和多边沟通协作。(新华社)", "ctime": 1775633648, "time_str": "15:34:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260408/c675830179.shtml"}, {"id": "4198779", "title": "张雪机车LOGO被指抄袭，设计公司称将发声明", "content": "4月8日，有网友在社交平台上指出，张雪机车的LOGO涉嫌抄袭，与ZETA、中乐国际等多家公司LOGO极为相似，“几何造型、线条走向都很像”。记者注意到，张雪机车的LOGO由杭州巴顿品牌设计公司负责。该公司官网展示了张雪机车的LOGO设计思路，该公司的客户还包括香飘飘、古茗、coco都可、街电等。4月8日，记者向张雪本人求证，截至发稿时张雪暂未回应。杭州巴顿品牌设计公司则表示，已经关注到了相关言论，公司稍后会发布声明。（新京报）", "ctime": 1775633574, "time_str": "15:32:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260408/c675830150.shtml"}, {"id": "4198763", "title": "南向资金净卖出超160亿港元", "content": "据同花顺iFinD数据，截至目前，南向资金净卖出超160亿港元，其中港股通（沪）卖出超116.92亿港元，港股通（深）卖出超43.73亿港元。", "ctime": 1775633422, "time_str": "15:30:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260408/c675830099.shtml"}, {"id": "4198753", "title": "特朗普认为是中国促使伊朗进行谈判？外交部回应", "content": "外交部发言人毛宁主持4月8日例行记者会。有记者提问称，特朗普对法新社表示他认为是中国促使伊朗进行谈判？如中方参与其中，由于目前局势仍不清楚，中方能否提供包括10项停战条款在内的更多细节？毛宁表示，伊朗战事爆发以来，中方一直积极致力于促和止战。王毅外长同相关国家的外长先后26次通话。中国政府中东问题特使对有关国家穿梭访问。中国和巴基斯坦还共同提出了关于恢复海湾和中东地区和平稳定的五点倡议。作为负责任的大国，中国将继续发挥建设性作用，为恢复海湾和中东地区和平安全作出贡献。(环球网)", "ctime": 1775633397, "time_str": "15:29:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260408/c675830084.shtml"}, {"id": "4198707", "title": "伊朗议长将率团前往伊斯兰堡参加伊美谈判", "content": "据伊朗方面当地时间4月8日消息，伊朗伊斯兰议会议长卡利巴夫将率领代表团参加10日在巴基斯坦首都伊斯兰堡举行的伊美谈判。此前，巴基斯坦总理夏巴兹证实，伊朗和美国以及双方各自盟友同意在包括黎巴嫩和其他地区在内的所有地点立即停火，即日起生效。他邀请伊美双方代表团10日在伊斯兰堡进一步谈判，以达成解决所有争端的最终协议。(央视新闻)", "ctime": 1775632835, "time_str": "15:20:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260408/c675829894.shtml"}, {"id": "4198689", "title": "南向资金净卖出超150亿港元", "content": "据同花顺iFinD数据，截至目前，南向资金净卖出超150亿港元，其中港股通（沪）卖出超114.33亿港元，港股通（深）卖出超36.09亿港元。", "ctime": 1775632656, "time_str": "15:17:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260408/c675829795.shtml"}, {"id": "4198683", "title": "伊拉克宣布开放领空及境内所有机场", "content": "当地时间8日，伊拉克民航局宣布，伊拉克领空及该国境内所有机场即日起重新开放。(央视新闻)", "ctime": 1775632617, "time_str": "15:16:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260408/c675829773.shtml"}, {"id": "4198663", "title": "阿曼外交部欢迎美伊停火 赞赏巴基斯坦斡旋努力", "content": "当地时间8日，阿曼外交部发表声明，对美国与伊朗同意停火表示欢迎，并称阿曼高度评价巴基斯坦在此进程中所作努力，同时对所有呼吁停止战争的各方表示赞赏。声明指出，当前应加大外交努力，从根本上推动危机解决，实现地区永久停火，并结束战争状态及各类敌对行动。（央视新闻）", "ctime": 1775632481, "time_str": "15:14:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260408/c675829670.shtml"}, {"id": "4198655", "title": "TikTok宣布将投资10亿欧元，在芬兰建第二座数据中心", "content": "4月8日，TikTok宣布将投资10亿欧元在芬兰拉赫蒂新建数据中心，为该公司在芬兰的第二个10亿欧元数据中心投资项目。声明称，这项投资是TikTok规模120亿欧元的“三叶草计划”（Project Clover）的一部分，该计划旨在处理和保护超2亿欧洲用户数据。TikTok另外表示，正按计划推进去年宣布的芬兰科沃拉数据中心项目。（界面新闻）", "ctime": 1775632396, "time_str": "15:13:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260408/c675829198.shtml"}, {"id": "4198627", "title": "第二批全国零售业创新提升试点城市申报工作启动", "content": "记者8日从商务部获悉，商务部等4部门日前印发通知，开展第二批全国零售业创新提升试点城市申报工作。 根据通知，试点申报城市应为地级及以上城市，在推动零售业发展方面积极性高、基础好、政策实，能够按照零售业创新提升工程实施方案要求编制试点工作方案，推动零售业创新转型，探索“一店一策”盘活商业设施经验，打造新业态新模式新场景。 据了解，2025年以来，商务部扎实推进首批38个零售业创新提升城市试点建设，在扩内需、促消费、惠民生等方面取得积极成效。试点城市共完成项目更新改造625个、建筑面积2410万平方米，拉动投资约756亿元。围绕“购在中国”、消费品以旧换新、中华老字号、“一刻钟便民生活服务月”等主题，累计开展消费促进活动约5000场次。(新华社)", "ctime": 1775632208, "time_str": "15:10:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260408/c675829107.shtml"}, {"id": "4198603", "title": "外交部长王毅将访问朝鲜", "content": "外交部发言人宣布：应朝鲜外务省邀请，中共中央政治局委员、外交部长王毅将于4月9日至10日访问朝鲜。(外交部）", "ctime": 1775632128, "time_str": "15:08:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260408/c675829072.shtml"}, {"id": "4198595", "title": "西班牙首相桑切斯将访华", "content": "外交部发言人宣布：应国务院总理李强邀请，西班牙首相桑切斯将于4月11日至15日对中国进行正式访问。", "ctime": 1775632097, "time_str": "15:08:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka ，树立和践行正确政绩观，扎扎实实帮助企业解决实际困难，深入基层一线开展调查研究，找准“小切口”，切实回应和解决企业各类“急难愁盼”问题。要坚持问题导向，聚焦企业经营全链条痛点综合施策，持续破除体制机制障碍与市场隐性壁垒，保障产业链供应链稳定与企业生产经营安全，在助企降本增效、激发发展活力、提升抗风险能力等方面持续用力，切实增强减负工作的针对性有效性。要强化制度建设，系统完善优化营商环境、规范涉企行政执法、保障经营主体公平竞争的配套制度体系，加强智慧监管、信用监管，以深化改革破解减负堵点难点，以法治建设筑牢减负制度底线。会议要求，各成员单位要对照2026年减轻企业负担工作实施方案，抓好贯彻落实，确保全年减轻企业负担各项目标任务圆满完成。要深化惠企政策落实，建立政策与企业精准匹配机制，强化政策落地闭环管理，实现对市场主体的靶向滴灌、定向赋能。要规范涉企行政行为，以常态化、清单化管理健全制度体系，筑牢企业发展稳定可预期的制度保障。要持续强化企业服务，推动政务服务提质增效，健全全链条企业服务体系与诉求闭环解决机制，不断提升企业获得感、满意度。(工信微报)", "ctime": 1775631310, "time_str": "14:55:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260408/c675828690.shtml"}, {"id": "4198411", "title": "郑商所丙烯主力合约暴跌11%", "content": "郑商所丙烯主力合约暴跌11%，报8312元/吨。", "ctime": 1775631261, "time_str": "14:54:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260408/c675828673.shtml"}, {"id": "4198401", "title": "华设集团成立船行科技公司 含AI相关业务", "content": "企查查APP显示，近日，江苏船行科技有限公司成立，注册资本2000万元，经营范围包含人工智能应用软件开发；网络与信息安全软件开发；人工智能公共数据平台；数字技术服务等。企查查股权穿透显示，该公司由华设集团(603018)间接全资持股。（人民财讯）", "ctime": 1775631150, "time_str": "14:52:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260408/c675828653.shtml"}, {"id": "4198393", "title": "上期所合成橡胶主力合约大跌8%", "content": "上期所合成橡胶主力合约大跌8%，报16350元/吨。", "ctime": 1775631125, "time_str": "14:52:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260408/c675828649.shtml"}, {"id": "4198377", "title": "沪深京三市成交额超2.3万亿元，较上日此时放量7664亿元", "content": "据同花顺iFinD数据，沪深京三市成交额超2.3万亿元，较上日此时放量7664亿元，预计全天成交金额约2.4万亿元。截至目前，沪市成交额10104亿元，深市成交额12744亿元，北证50成交额151亿元。", "ctime": 1775630922, "time_str": "14:48:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260408/ // 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
