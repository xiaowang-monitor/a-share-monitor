const NEWS     = [{"id": "4218227", "title": "也门胡塞武装警告美以：若恢复对伊朗攻击将升级军事行动", "content": "萨那消息：也门胡塞武装12日表示，如果美国和以色列恢复对伊朗以及“抵抗阵线”的军事打击，该组织将以不断升级的方式参与“有效的军事行动”。 也门胡塞武装在通过萨巴通讯社发表的声明中称，美国试图通过谈判强加其在军事对抗中未能实现的目标。美方的升级言论表明此前军事选项的失败和无效。美国总统特朗普及其盟友在此前几轮行动中曾试图推翻伊朗政权，如今又寻求“打开”霍尔木兹海峡，但这一目标同样不会实现。美国在该地区的任何新一轮升级举动，都将对供应链、能源价格以及全球经济产生负面影响。(新华社)", "ctime": 1776072046, "time_str": "17:20:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260413/c675946554.shtml"}, {"id": "4218225", "title": "印度启动涉华聚四氟乙烯反倾销调查", "content": "2026年3月20日，印度商工部发布公告称，应印度国内企业Gujarat Fluorochemicals Limited提交的申请，对原产于或进口自中国和俄罗斯的聚四氟乙烯[Polytetrafluoroethylene(PTFE)]启动反倾销调查。本案倾销调查期为2024年10月至2025年9月（12个月），损害调查期为2022年至2025年。（商务部）", "ctime": 1776071967, "time_str": "17:19:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260413/c675946499.shtml"}, {"id": "4218215", "title": "腾远钴业：2025年净利润11.11亿元，同比增长62.11%", "content": "腾远钴业发布业绩快报，2025年度实现营业总收入83.4亿元，同比增长27.47%；净利润11.11亿元，同比增长62.11%。报告期内，公司业绩增长的主要原因系：一是募投项目产能逐步释放，推动公司钴、锂产品等总金属产量实现同比增长，规模效应进一步显现；二是公司持续推动精益管理变革，全面落实降本增效措施，通过严控成本费用提升运营效率，增强了整体盈利能力；三是二次资源回收体系不断完善，再生原料在原料结构中的占比持续提升，供应链韧性及原料自给能力得到有效增强；四是受益于钴、铜等金属市场价格同比上涨，公司产品盈利能力大幅提升。", "ctime": 1776071868, "time_str": "17:17:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260413/c675946453.shtml"}, {"id": "4218213", "title": "腾远钴业：预计2026年第一季度净利润同比增长308.22%-351.95%", "content": "腾远钴业公告，预计2026年第一季度归属于上市公司股东的净利润为5.04亿元-5.58亿元，比上年同期的1.23亿元增长308.22%-351.95%；扣除非经常性损益后的净利润为4.89亿元-5.4亿元，比上年同期的1.14亿元增长328.44%-373.13%。报告期内，公司业绩实现良好增长，主要原因：一是公司经营稳健，构建了多元化原料采购体系，原料保供能力强，尤其是二次资源或再生原料的稳定供应，有效对冲了原生矿采购波动的影响，为业绩增长提供了支撑；二是受益于钴、铜等金属市场价格较上年同期明显上行，同时刚果腾远铜产品产量实现同比增长，并持续优化客户结构，公司产品产销及盈利能力大幅提升。", "ctime": 1776071862, "time_str": "17:17:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260413/c675946447.shtml"}, {"id": "4218209", "title": "港交所推出两只硬科技指数 华泰盈科、易方达国际、博时国际等5家公司拿到ETF授权", "content": "港交所今日下午宣布，新推出韩国交易所半导体指数、科技及美国科技100指数等2只科技类指数。港交所同时宣布，已与华泰盈科资管、博时国际、易方达香港、大成国际、广发国际等资管公司签订授权协议，待获得监管机构批准后，将在香港市场推出追踪上述2只新指数的ETF产品。(财联社）", "ctime": 1776071705, "time_str": "17:15:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260413/c675946353.shtml"}, {"id": "4218207", "title": "众鑫股份：2025年净利润2.66亿元，同比下降17.79%", "content": "众鑫股份公告，2025年营业收入15.06亿元，同比下降2.62%。净利润2.66亿元，同比下降17.79%。公司拟向全体股东每10股派发现金红利9.6元（含税），同时每10股转增4股。", "ctime": 1776071646, "time_str": "17:14:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260413/c675946322.shtml"}, {"id": "4218205", "title": "多家龙头公司辟谣：多晶硅控产挺价传闻不实", "content": "4月13日，多晶硅期货主力午后直线拉升，最终收于涨停板，报34770元/吨，涨幅为9%。与此同时，午后光伏概念股震荡反弹，硅料板块全线走强，其中，通威股份一度封板，大全能源盘中最高涨近12%。大涨背后，是一篇“小作文”推波助澜。当日，市场有传闻称，通威、协鑫等多晶硅龙头企业于本月初在成都召开闭门会议，商议强制控产挺价事宜。对此，记者第一时间向多位行业及企业人士独家求证，协鑫科技、TCL中环等均明确回应：该消息为假。隆基绿能表示，公司身处产业链下游，对相关会议并不知情。有业内人士表示，当前，多晶硅现货市场交易氛围偏弱，价格并未出现明显异动。投资者应以官方信息为准，警惕市场传闻引发的短期波动风险。（中证金牛座）", "ctime": 1776071644, "time_str": "17:14:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260413/c675946320.shtml"}, {"id": "4218203", "title": "道恩股份：预计2026年第一季度净利润同比增长80%-100%", "content": "道恩股份公告，预计2026年第一季度归属于上市公司股东的净利润为7971.19万元至8856.88万元，比上年同期增长80%-100%；扣除非经常性损益后的净利润为7363.17万元至8248.86万元，比上年同期增长99.13%-123.08%。报告期内，公司归属于上市公司股东的净利润较上年同期大幅增长，主要原因系公司自身业务的增长及2月份起合并报表中包含了子公司宁波爱思开合成橡胶有限公司的经营业绩。", "ctime": 1776071640, "time_str": "17:14:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260413/c675946318.shtml"}, {"id": "4218201", "title": "亚翔集成：预计2026年第一季度净利润同比增长180.52%至223.21%", "content": "亚翔集成公告，预计2026年第一季度实现归属于上市公司股东的净利润为2.3亿元至2.65亿元，比上年同期增加1.48亿元至1.83亿元，同比增长180.52%至223.21%。预计2026年第一季度实现归属于上市公司股东的扣除非经常性损益的净利润为2.29亿元至2.64亿元，比上年同期增加1.47亿元至1.82亿元，同比增长180.42%至223.28%。", "ctime": 1776071629, "time_str": "17:13:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260413/c675946313.shtml"}, {"id": "4218199", "title": "多只原油及白银基金将于4月14日上午停牌一小时", "content": "包括石油基金LOF (160416)、标普油气ETF嘉实 (159518)、嘉实原油LOF (160723)、原油LOF易方达 (161129)以及国投白银LOF (161226)在内的多只基金公告，将于2026年4月14日开市起停牌，并于当日10:30起复牌。", "ctime": 1776071623, "time_str": "17:13:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260413/c675946310.shtml"}, {"id": "4218197", "title": "摩根大通（JPMorgan）对ASMPT的多头持仓比例增至7.48%", "content": "据香港交易所披露，摩根大通（JPMorgan）对ASMPT Ltd.的多头持仓比例于2026年4月8日从7.29%增至7.48%。", "ctime": 1776071579, "time_str": "17:12:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260413/c675946265.shtml"}, {"id": "4218195", "title": "高盛对小鹏集团-W的多头持仓比例降至4.28%", "content": "据香港交易所披露，高盛对小鹏集团 - W的多头持仓比例于2026年4月2日从5.04%降至4.28%。", "ctime": 1776071569, "time_str": "17:12:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260413/c675946259.shtml"}, {"id": "4218193", "title": "贝莱德（BlackRock）对海尔智家的多头持仓比例降至7.45%", "content": "据香港交易所披露，贝莱德（BlackRock）对海尔智家股份有限公司 - H股的多头持仓比例于2026年4月7日从8.25%降至7.45%。", "ctime": 1776071564, "time_str": "17:12:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260413/c675946258.shtml"}, {"id": "4218191", "title": "摩根大通（JPMorgan）对阿里巴巴-W的多头持仓比例增至7.98%", "content": "据香港交易所披露，摩根大通（JPMorgan）对阿里巴巴集团控股有限公司 - W的多头持仓比例于2026年4月8日从7.97%增至7.98%。", "ctime": 1776071558, "time_str": "17:12:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260413/c675946249.shtml"}, {"id": "4218189", "title": "三安光电：控股股东部分股份被司法强制执行", "content": "三安光电公告，重庆中院在执行重庆高永与厦门三安电子有限公司合同纠纷一案过程中，依法作出裁定，在30个交易日内将三安电子所持公司6856.3万股股份（占总股本1.37%）予以强制处置。三安电子目前持有公司24.33%股份，其控股股东三安集团合计持股29.47%，本次被执行股份占三安电子所持股份比例较小，不会导致公司控制权变更。", "ctime": 1776071532, "time_str": "17:12:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260413/c675946242.shtml"}, {"id": "4218187", "title": "中证协全面摸底券商投教基地运行情况，评估运营效能与转型方向", "content": "记者4月13日从业内独家获悉，中国证券业协会近日在行业内下发通知，正式启动证券公司投教基地运行情况专项调研。调研问卷围绕多个核心维度展开，涵盖了运营投入、人员与硬件配置、服务覆盖、运营成效、影响预估与转型方案建议等多个方面。记者了解到，此次摸底调研并非简单的常规数据收集，其背后释放的政策信号与问卷设计的深度，被业内人士视为未来投资者教育工作方向调整与资源优化配置的重要信号。记者通过梳理调研问卷发现，此次调研的核心聚焦于券商投教基地的运营效能。具体评估指标方面，券商需从运营投入、人员配置、场地与设备、服务覆盖、运营成效、分层服务情况、文化与国际交流、产教融合、政策与合规支撑、基地核心功能发挥及影响预估、互联网替代方案等多个维度填报相关数据。(中证金牛座)", "ctime": 1776071526, "time_str": "17:12:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260413/c675946235.shtml"}, {"id": "4218183", "title": "聚合顺：2025年净利润1.45亿元，同比下降51.77%", "content": "聚合顺发布业绩快报，2025年度公司实现营业总收入55.24亿元，同比下降22.94%；净利润1.45亿元，同比下降51.77%。本期较上年同期相比，在行业深陷产能集中释放导致严重供过于求的态势下，下游行业需求疲软的压力之下，切片市场报价逐季、逐月下降，行业利润被严重挤压，全行业普遍进入亏损状态。行业整体开机率下降，中下游库存大幅度累积，去库压力陡增。传统优势的民用纤维级切片受国内消费放缓和出口节奏放缓双重影响，同比增速显著下滑，采购支撑力也显著减弱。公司主营业务收入和利润均呈现较大幅度的下滑。", "ctime": 1776071494, "time_str": "17:11:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260413/c675946215.shtml"}, {"id": "4218181", "title": "聚合顺：预计2026年第一季度净利润同比下降56.68%到69.05%", "content": "聚合顺公告，预计2026年第一季度实现归属于母公司所有者的净利润2500万元到3500万元，与上年同期相比，预计将下降4578.69万元到5578.69万元，同比下降56.68%到69.05%。预计2026年第一季度实现归属于母公司所有者的扣除非经常性损益的净利润2300万元到3300万元，与上年同期相比，预计将下降4367.72万元到5367.72万元，同比下降56.96%到70.00%。", "ctime": 1776071484, "time_str": "17:11:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260413/c675946211.shtml"}, {"id": "4218179", "title": "马克龙称将与英国共同举办霍尔木兹海峡问题会议", "content": "当地时间4月13日，法国总统马克龙在社交媒体发文表示，在霍尔木兹海峡问题上，法国将与英国在未来几天内共同组织会议，邀请有关国家参与，探讨开展一项多国参与的和平任务，以恢复该海峡的航行自由。马克龙还表示，应不遗余力通过外交途径，尽快推动中东冲突实现稳固、持久解决。马克龙指出，应建立一个稳固框架，使地区各方能够在和平与安全中共存。为此，必须对相关根本性问题作出持久回应，同时应尽快恢复霍尔木兹海峡的自由、无阻航行，并推动黎巴嫩在充分尊重其主权和领土完整的前提下重回和平轨道。(央视新闻)", "ctime": 1776071480, "time_str": "17:11:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260413/c675946207.shtml"}, {"id": "4218175", "title": "上海科创金融联盟与上海市金融学会科技金融专委会共同举办“走进上海技术交易所”活动", "content": "据人民银行上海总部消息，为深化技术要素与金融资本融合，破解科技企业融资难题，助力上海国际科创中心与国际金融中心协同建设，近日，在人民银行上海总部指导下，上海科创金融联盟、上海市金融学会科技金融专委会联合举办“走进上海技术交易所”专题活动。联盟和专委会的银行、证券、保险、股权投资机构、高校智库等成员单位代表以及上海市科技创业中心、上海市杨浦区科技和经济委员会相关负责同志参加活动，实地调研走访上海技术交易所，并围绕技术资产确权定价、知识产权质押融资、生物医药管线资本化、科技金融标准建设等议题深入研讨。本次活动搭建了技术交易平台与金融机构对接桥梁，明晰了技术要素市场化配置与金融服务创新的协同路径。", "ctime": 1776071370, "time_str": "17:09:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260413/c675946015.shtml"}, {"id": "4218167", "title": "成都银行：副行长陈海波因组织工作调动另有任用辞职", "content": "成都银行公告，公司董事会收到副行长、董事会秘书陈海波的辞职报告。因组织工作调动另有任用，陈海波自2026年4月13日起辞去职务，不再担任公司任何职务。公司已于2026年4月13日召开董事会，聘任罗结先生兼任董事会秘书，任期至第八届董事会届满，其任职资格需监管机构核准。", "ctime": 1776071251, "time_str": "17:07:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260413/c675945867.shtml"}, {"id": "4218165", "title": "神通科技：2026年第一季度净利润4643.06万元，同比增长420.14%", "content": "神通科技公告，2026年第一季度营业收入4.12亿元，同比增长20.40%。净利润4643.06万元，同比增长420.14%。主要系收入和毛利额增加及应收账款收回导致的信用减值损失减少所致。", "ctime": 1776071226, "time_str": "17:07:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260413/c675945862.shtml"}, {"id": "4218157", "title": "机构：预估苹果将于今年取得折叠手机市场近20%的市占", "content": "4月13日，根据TrendForce集邦咨询最新显示产业研究，折叠手机市场最快将于2026下半年迎来苹果入局，引发外界关注相关技术革新。其中，面板折痕的优化，正从以往依赖铰链与支撑结构的“机械对抗”，转向以材料堆叠为核心的“应力管理工程”，折痕处理已成为衡量品牌显示技术整合能力的核心指标。该机构预估，苹果凭借品牌形象与消费者的期待，将于2026年取得折叠手机市场近20%的市占，并压缩三星、华为的占比至30%上下。（界面新闻）", "ctime": 1776071151, "time_str": "17:05:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260413/c675945817.shtml"}, {"id": "4218153", "title": "品茗科技：拟通过全资子公司以640万新加坡元收购ZLX ENGINEERING PTE LTD 100%的股权", "content": "品茗科技公告，公司拟通过全资子公司品茗(香港)技术有限公司以自有资金640万新加坡元（以2026年4月13日汇率折合人民币约3,431万元）收购ZLX ENGINEERING PTE LTD 100%的股权。", "ctime": 1776071141, "time_str": "17:05:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260413/c675945814.shtml"}, {"id": "4218143", "title": "央行：一季度人民币贷款增加8.6万亿元", "content": "央行公告，3月末，本外币贷款余额284.51万亿元，同比增长5.7%。月末人民币贷款余额280.51万亿元，同比增长5.7%。一季度人民币贷款增加8.6万亿元。分部门看，住户贷款增加2967亿元，其中，短期贷款减少1640亿元，中长期贷款增加4607亿元；企（事）业单位贷款增加8.6万亿元，其中，短期贷款增加4.13万亿元，中长期贷款增加5.42万亿元，票据融资减少1.1万亿元；非银行业金融机构贷款减少3680亿元。3月末，外币贷款余额5779亿美元，同比增长7.9%。一季度外币贷款增加329亿美元。", "ctime": 1776070960, "time_str": "17:02:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260413/c675945734.shtml"}, {"id": "4218139", "title": "ST张家界：2026年第一季度净利润3.06亿元", "content": "ST张家界公告，2026年第一季度营业收入6685.59万元，同比增长13.34%。净利润3.06亿元。", "ctime": 1776070939, "time_str": "17:02:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260413/c675945729.shtml"}, {"id": "4218131", "title": "央行：3月末广义货币(M2)余额353.86万亿元，同比增长8.5%", "content": "央行公告，3月末，广义货币(M2)余额353.86万亿元，同比增长8.5%。狭义货币(M1)余额119.32万亿元，同比增长5.1%。流通中货币(M0)余额14.71万亿元，同比增长12.5%。一季度净投放现金6135亿元。 675945693.shtml"}, {"id": "4218109", "title": "泽璟制药：盐酸吉卡昔替尼片III期临床试验达到主要疗效终点", "content": "泽璟制药公告，公司自主研发的1类新药盐酸吉卡昔替尼片（曾用名：盐酸杰克替尼片）治疗中、重度特应性皮炎成年患者的多中心、随机、双盲、安慰剂平行对照III期临床研究（方案编号：ZGJAK025）达到了主要疗效终点，具有统计显著性（p<0.0001）。", "ctime": 1776070807, "time_str": "17:00:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260413/c675945529.shtml"}, {"id": "4218101", "title": "皖维高新：第一季度净利润1.36亿元，同比增长15.68%", "content": "皖维高新公告，2026年第一季度营收为19.45亿元，同比下降2.84%；净利润为1.36亿元，同比增长15.68%。", "ctime": 1776070799, "time_str": "16:59:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260413/c675945497.shtml"}, {"id": "4218097", "title": "苹果智能眼镜据悉已进入密集测试阶段 预计2027年亮相", "content": "科技记者古尔曼日前透露，苹果智能眼镜已进入密集测试阶段，至少四种镜框款式同步研发，主打高端设计与奢华材质，预计2027年正式亮相。据悉，该设备并非AR眼镜，而是一款轻量化智能穿戴产品，功能介于Apple Watch与AirPods 之间，可通过iPhone实现通知提醒、影音播放、拍照录像，并支持升级版Siri与视觉AI交互。（科创板日报）", "ctime": 1776070639, "time_str": "16:57:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260413/c675945430.shtml"}, {"id": "4218095", "title": "中国网络文学阅读市场规模达502.1亿元", "content": "中国社会科学院4月13日在京发布的《2025中国网络文学发展研究报告》显示，截至2025年底，中国网络文学阅读市场规模达502.1亿元，同比增长16.6%；网络文学IP改编市场规模达3676.1亿元，同比增长23.13%。报告指出，2025年网络文学继续保持了繁荣发展的良好势头。在政策支持引导、文艺和技术跨界融合等力量共同推动下，网络文学创作开发、全球传播和价值拓展链条日趋完整，持续为广大读者提供数量充足、题材多元、类型多样的阅读资源，为泛文娱产业提供了数量庞大的IP源头，在文旅深度融合、AI技术赋能等方面表现出创新特质，成为网络时代中国文化出海“新三样”的基础性力量。(央视新闻)", "ctime": 1776070623, "time_str": "16:57:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260413/c675945415.shtml"}, {"id": "4218093", "title": "农业农村部：推广应用智慧农机、无人机等智能技术装备 发展农业低空经济", "content": "4月13日，农业农村部党组书记、部长韩俊主持召开部党组会议。会议指出，要发展农业科技企业、农业数字服务平台，支持建设中试验证平台，推广应用智慧农机、无人机等智能技术装备，发展农业低空经济，提升一站式数智化综合服务能力。深入推进农产品市场流通体系建设，深化发展农村电商，加大农业品牌培育力度。要大力发展农村生活性服务业，做好“农业+康养”“农业+文旅”等文章，积极打造农业休闲旅游、观光体验等乡村消费新场景，推动农村养老、托育、医疗等公共服务改善提升。要促进农业服务贸易高质量发展，引导支持涉农企业深化农业贸易国际合作，推动中国农药、种子、肥料、农机、动物疫苗等产品和服务“走出去”，打造中国农业出海的“新名片”。（人民财讯）", "ctime": 1776070601, "time_str": "16:56:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260413/c675945407.shtml"}, {"id": "4218083", "title": "智界V9首发智能交互式侧门光毯", "content": "鸿蒙智行首款旗舰MPV智界V9首发智能交互式侧门光毯，可通过毫米波雷达主动感知用户接近，并同步升级全新一代DLP智慧投影大灯。（鸿蒙智行）", "ctime": 1776070469, "time_str": "16:54:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260413/c675945278.shtml"}, {"id": "4218077", "title": "光库科技：预计2026年第一季度净利润同比增长303%～323%", "content": "光库科技公告，预计2026年第一季度净利润为4370万元～4587万元，同比增长303%～323%。报告期内公司通过技术创新、推出新产品、积极开发国内外新客户，营业收入实现稳步增长。报告期内归属于上市公司股东的净利润较上年同期大幅增长，主要是报告期内公司营业收入增长带动了净利润的增长，同时加强费用管控、降本增效，且上年同期基数较小所致。", "ctime": 1776070336, "time_str": "16:52:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260413/c675945195.shtml"}, {"id": "4218063", "title": "四川内江市资中县发生3.9级地震，震源深度5千米", "content": "中国地震台网正式测定：04月13日16时39分在四川内江市资中县（北纬29.66度，东经104.85度）发生3.9级地震，震源深度5千米。", "ctime": 1776070091, "time_str": "16:48:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260413/c675945023.shtml"}, {"id": "4218061", "title": "荣耀win笔记本亮相，其主要代工厂为立讯精密和华勤技术", "content": "4月13日，荣耀PC新品技术沟通会在西安举行，荣耀“打洲本”荣耀WIN游戏本、“养虾本”MagicBook系列轻薄本等新品集中亮相。据荣耀相关人士透露，目前荣耀PC主要代工厂为立讯精密与华勤技术。记者此前曾独家报道，荣耀将推出Win系列笔记本电脑。(蓝鲸新闻)", "ctime": 1776070080, "time_str": "16:48:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260413/c675945010.shtml"}, {"id": "4218055", "title": "英国首相：英方不支持封锁霍尔木兹海峡", "content": "当地时间13日，英国首相斯塔默表示，英国不支持封锁霍尔木兹海峡。12日稍早时，有多位美国官员及知情人士透露，在美国和伊朗谈判未能达成协议后，美国总统特朗普正考虑在封锁霍尔木兹海峡的同时恢复对伊朗的有限军事打击。消息称，美军对伊朗进行全面轰炸的可能性较低，鉴于此举恐进一步加剧该地区的不稳定局势，加之特朗普不愿陷入长期军事冲突。特朗普还考虑向盟友施压，要求其承担长期护航任务。（央视新闻）", "ctime": 1776070046, "time_str": "16:47:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260413/c675944998.shtml"}, {"id": "4218053", "title": "中粮科工：董事长朱来宾因工作变动辞职", "content": "中粮科工公告，公司董事会收到董事长、董事朱来宾的书面辞职报告。朱来宾因工作变动原因申请辞去董事长、董事及战略与投资委员会主任委员职务，原定任期至2028年2月13日。辞任后，朱来宾不再担任公司任何职务。根据相关规定，朱来宾辞职未导致董事会成员低于法定最低人数，其辞职报告自送达董事会之日起生效。公司将尽快完成补选董事长工作。", "ctime": 1776070024, "time_str": "16:47:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260413/c675944987.shtml"}, {"id": "4218051", "title": "石大胜华：预计2026年第一季度净利润2.6亿元到3.1亿元", "content": "石大胜华公告，预计2026年第一季度实现归属于上市公司股东的净利润2.6亿元到3.1亿元，与上年同期相比，将实现扭亏为盈。本报告期归属于上市公司股东的净利润较上年同期增加，主要是行业景气度回升，核心产品价格上涨，提升盈利能力。", "ctime": 1776070007, "time_str": "16:46:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260413/c675944978.shtml"}, {"id": "4218049", "title": "外交部介绍俄罗斯外长拉夫罗夫访华有关安排", "content": "应中共中央政治局委员、外交部长王毅邀请，俄罗斯外长拉夫罗夫将于4月14日至15日对中国进行正式访问。外交部发言人郭嘉昆13日在例行记者会上答问时表示，拉夫罗夫外长访华期间，两国外长将就双边关系发展、各领域合作以及共同关心的国际地区问题交换意见，协调立场。“中俄是新时代全面战略协作伙伴。近年来，两国不断深化永久睦邻友好，拓展全面战略协作，坚持互利合作共赢，在国际和地区事务中保持密切沟通协调，为推动平等有序的世界多极化、改革完善全球治理、维护国际公平正义作出重要贡献。”郭嘉昆说。他介绍，拉夫罗夫外长访华期间，两国外长将就双边关系发展、各领域合作以及共同关心的国际地区问题交换意见，协调立场。“此访有关具体情况我们会及时发布，请大家保持关注。”郭嘉昆说。(新华社)", "ctime": 1776069987, "time_str": "16:46:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260413/c675944967.shtml"}, {"id": "4218039", "title": "土耳其外长：美伊停火期限或需延长 需警惕以色列“破坏作用”", "content": "当地时间4月13日，土耳其外长费丹在接受采访时指出，当前美伊双方均表现出停火的“诚挚意愿”，但现有的临时停火期限可能不足以达成全面协议，建议根据谈判进展将停火期延长至45天甚至60天。费丹表示，目前美伊双方的谈判代表已分别回国进行内部评估。他特别提到，伊朗方面正在就美国提出的相关提议进行深度研究并准备答复。费丹在采访中发出了明确警告。他强调，必须始终考虑到“以色列因素”。费丹指出，以色列在这一进程中扮演了“破坏性角色”，国际社会应对此保持高度警惕，防止由于外部干预导致脆弱的停火协议流产。（央视新闻）", "ctime": 1776069938, "time_str": "16:45:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260413/c675944940.shtml"}, {"id": "4218035", "title": "湖北省荆州市委原书记吴锦被“双开”", "content": "中央纪委国家监委网站4月13日通报，据湖北省纪委监委消息：经湖北省委批准，湖北省纪委监委对第十二届湖北省委委员、荆州市委原书记吴锦严重违纪违法问题进行了立案审查调查。吴锦严重违反党的政治纪律、组织纪律、廉洁纪律、工作纪律，构成严重职务违法并涉嫌受贿犯罪，且在党的十八大后不收敛、不收手，性质严重，影响恶劣，应予严肃处理。依据《中国共产党纪律处分条例》《中华人民共和国监察法》《中华人民共和国公职人员政务处分法》等有关规定，经湖北省纪委常委会会议、省委常委会会议讨论，并经中央纪委常委会会议研究报中共中央批准，决定给予吴锦开除党籍处分；由湖北省监委给予其开除公职处分；终止其荆州市第六次党代会代表、湖北省第十二次党代会代表、中国共产党第二十次全国代表大会代表资格；收缴其违纪违法所得；将其涉嫌犯罪问题移送检察机关依法审查起诉，所涉财物一并移送。给予其开除党籍的处分，待召开湖北省委全体会议时予以追认。（界面新闻）", "ctime": 1776069894, "time_str": "16:44:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260413/c675944906.shtml"}, {"id": "4218029", "title": "秘鲁对华涤棉混纺织物作出反倾销日落复审终裁", "content": "2026年4月12日，秘鲁国家竞争和知识产权保护局倾销、补贴和消除非关税贸易壁垒委员会在官方日报《秘鲁人报》发布第058-2026/CDB-INDECOPI号公告，对原产于中国的涤棉混纺织物作出反倾销第一次日落复审肯定性终裁，决定维持第273-2021/CDB-INDECOPI号公告确定的反倾销税不变，继续对涉案产品征收2.08美元/千克反倾销税，措施自2026年11月20日起生效，有效期为五年。（中国贸易救济信息网）", "ctime": 1776069811, "time_str": "16:43:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260413/c675944877.shtml"}, {"id": "4218025", "title": "秘鲁对华盘条作出反倾销终裁", "content": "2026年4月12日，秘鲁国家竞争和知识产权保护局倾销、补贴和消除非关税贸易壁垒委员会在官方日报《秘鲁人报》发布第065-2026/CDB-INDECOPI号公告，对原产于中国的盘条作出反倾销肯定性终裁，正式对涉案产品征收为期五年的反倾销税，具体如下：鞍钢股份有限公司、鞍钢集团香港有限公司、本溪北方轧钢有限公司、本钢集团香港有限公司及其他生产商/出口商税额均为81.3美元/吨。涉案产品为直径介于5.5～16毫米、表面和横截面光滑的低碳和高碳非合金盘条，涉及秘鲁税号7213.20.00.00、7213.91.10.00、7213.91.90和7213.99.00.00项下的产品。措施自公告发布次日起生效。（中国贸易救济信息网）", "ctime": 1776069778, "time_str": "16:42:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260413/c675944859.shtml"}, {"id": "4218021",   const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
