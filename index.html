荷兰全国新增1例西尼罗病毒感染死亡病例和3例确诊病例。今年以来，荷兰共报告59例西尼罗病毒感染病例，其中10人死亡。荷兰国家公共卫生与环境研究所于8月26日通报了荷兰今年首例西尼罗病毒感染死亡病例。此前，荷兰从一名献血者的血液样本中检测出西尼罗病毒，这是该国自2020年以来首例确诊的本土感染病例。西尼罗病毒通常由鸟类携带，经蚊子传播给人类或其他哺乳动物。感染者可能出现发烧、身体疼痛、恶心、呕吐等症状，但老人、慢性病患者和免疫力低下人群感染后可能并发脑炎或脑膜炎等，甚至死亡。（央视新闻）", "ctime": 1791466135, "time_str": "21:28:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261008/c680494718.shtml"}, {"id": "5345711", "title": "联合国警告说厄尔尼诺现象将于12月达到顶峰", "content": "联合国机构8日警告说，未来数月，厄尔尼诺现象将进一步加剧，并将于12月达到顶峰，或将成为1950年以来最强厄尔尼诺事件之一。联合国世界气象组织在月度《全球季节性气候最新通报》中说，“厄尔尼诺将持续增强，预计在12月达到顶峰”，很可能使全球大部分地区气温高于常年均值，并且改变降雨格局，加剧不同地区发生干旱与洪涝的风险。（新华社）", "ctime": 1791465758, "time_str": "21:22:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261008/c680494660.shtml"}, {"id": "5345689", "title": "力勤资源：FENG YI2026年增持后持股15.02%", "content": "力勤资源公告，FENG YI于2026年10月5日通过集中竞价增持公司H股股份72.62万股，占总股本0.04%，增持均价为19.91港元/股；增持后合计持有2.6亿股，占总股本15.02%，成为持股比例达到15.00%以上的股东。本次权益变动不会导致公司控制权发生变更。", "ctime": 1791465651, "time_str": "21:20:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261008/c680494637.shtml"}, {"id": "5345687", "title": "新华传媒：如公司股价进一步异常上涨可能申请停牌核查", "content": "新华传媒公告，公司股票2026年9月21日至2026年10月8日连续8个交易日涨停，日收盘价格涨幅偏离值累计达到117.06%，累计上涨114.50%。公司生产经营正常、基本面未发生重大变化；拟发行股份购买上海界面财联社科技股份有限公司100%股权事项的审计、评估等工作尚未完成，交易仍存在不确定性。公司最新滚动市盈率为253.42，高于行业最新滚动市盈率18.17。如公司股价进一步异常上涨，公司可能申请停牌核查。", "ctime": 1791465641, "time_str": "21:20:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261008/c680494635.shtml"}, {"id": "5345673", "title": "TCL中环：首次回购2663.3万股，成交总金额约2.5亿元", "content": "TCL中环公告，公司回购方案拟以人民币4亿元（含）至人民币5亿元（含）回购股份，回购价格不超过人民币14.11元/股（含），股份拟用于员工持股计划和/或股权激励。2026年10月8日，公司首次回购2663.3万股，占当前总股本的比例为0.66%，成交价格区间为9.15元/股至9.51元/股，成交总金额约2.5亿元（不含交易费用）。", "ctime": 1791465579, "time_str": "21:19:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261008/c680494621.shtml"}, {"id": "5345571", "title": "尊界汽车发布情况说明：自首批车辆交付以来，在用户实际使用场景中，未发生制动踏板支架底座断裂故障", "content": "尊界汽车发布情况说明，尊界汽车生产，尊界汽车的制动系统，按照高于国家标准（GB 21670 2025 / GB 7258 2026）、高于行业标准（QC/T 788 2018）的要求完成全流程开发与验证。自首批车辆交付以来，在用户实际使用场景中，未发生制动踏板支架底座断裂故障。 用户安全永远是第一优先级。即便是非标准的极端测试工况，仍希望为用户提供更高的安全冗余：尊界将进一步优化该部件设计，并为已交付用户提供免费升级选择。 同时，尊界将对相关部件的设计验证、试验边界与生产质量管理开展系统性复核与补强，持续完善安全体系。", "ctime": 1791465152, "time_str": "21:12:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261008/c680494564.shtml"}, {"id": "5345551", "title": "扎哈罗娃：与俄对抗只会使欧盟处境更加艰难", "content": "当地时间10月8日，俄罗斯外交部发言人扎哈罗娃在每周例行发布会中表示，美国在波罗的海沿岸国家部署军队的计划，与其宣称的缓和欧洲紧张局势的意愿相悖。扎哈罗娃强调，西方与俄罗斯对抗的道路只会使欧盟处境更加艰难，无法解决欧洲国家的“紧迫问题”。（央视新闻）", "ctime": 1791465060, "time_str": "21:11:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261008/c680494546.shtml"}, {"id": "5345517", "title": "世贸组织上调2026年全球货物贸易增长预期", "content": "世界贸易组织8日发布最新全球贸易展望报告说，由于供应链调整以及人工智能领域投资强劲，预计2026年全球货物贸易将增长3.9%，高于3月预测的1.9%，2027年有望增长4.1%。（新华社）", "ctime": 1791464882, "time_str": "21:08:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261008/c680494466.shtml"}, {"id": "5345495", "title": "亚马逊发布全新儿童专用平板电脑系列", "content": "亚马逊发布全新儿童专用平板电脑系列。新款亚马逊儿童平板电脑提供8.7英寸和11英寸两种尺寸。Amazon Kids Tablet 8起售价229.99美元，Amazon Kids Tablet 11起售价329.99美元。（蓝鲸新闻）", "ctime": 1791464779, "time_str": "21:06:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261008/c680494411.shtml"}, {"id": "5345335", "title": "期市夜盘开盘，国内期货主力合约多数下跌，甲醇涨超6%", "content": "期市夜盘开盘，国内期货主力合约多数下跌。跌幅方面，沪锡跌超2%，沪锌、铁矿石、铝合金、沪铅、纸浆等跌超1%。涨幅方面，甲醇涨超6%，苯乙烯涨超5%，燃油、原油涨超4%，LPG、沥青、对二甲苯涨超3%，纯苯、PTA、瓶片涨超2%。", "ctime": 1791464431, "time_str": "21:00:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261008/c680494276.shtml"}, {"id": "5345183", "title": "RSM：英国经济8月或萎缩0.1%，第四季度及2027年增长恐明显放缓", "content": "RSM英国公司经济学家托马斯·普格表示，随着6月和7月强劲增长势头的部分消退，英国经济8月可能萎缩0.1%，但这不应掩盖经济整体表现出的韧性。普格表示：“今年以来，英国经济平均每季度增长0.5%，第三季度仍有望实现约0.4%至0.5%的增长。”8月工业产出可能陷入停滞，建筑业和服务业产出预计下降。不过，人工智能技术的应用有望推动信息技术及其他关键行业的发展。普格补充称，展望未来，通胀上升、利率走高以及劳动力市场疲软，可能导致英国经济增长在第四季度及2027年明显放缓。他表示：“企业将不得不应对需求趋弱的市场环境。”", "ctime": 1791463957, "time_str": "20:52:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261008/c680494173.shtml"}, {"id": "5345179", "title": "好上好：点通投资等五股东减持计划完成，比例均为0.6000%", "content": "好上好公告，点通投资、前哨投资、聚焦投资、研智创投、持恒创投此前分别计划减持不超过259.51万股，分别不超过公司总股本的0.6%。2026年7月7日至2026年9月30日，五名股东分别减持259.5万股、259.5万股、259.5万股、259.5万股、259.51万股，减持比例均为0.6000%，合计减持1297.51万股，占总股本的2.9999%。本次减持计划已实施完毕。", "ctime": 1791463933, "time_str": "20:52:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261008/c680494163.shtml"}, {"id": "5345151", "title": "ASML和蔡司称下一代芯片制造技术可能在10年内准备就绪", "content": "ASML及其光学合作伙伴Carl Zeiss的工程师在一篇经同行评审的论文中表示，作为ASML最先进芯片制造设备的继任者，新一代设备预计将在约10年内问世。论文称，这款被命名为“Hyper NA”的设备将在大量复用两家公司现有技术的同时，实现更精细的电路图案化，尽管仍面临诸多挑战。ASML已开始研发该设备，但尚未承诺投入生产。该设备不仅关乎该公司未来的发展前景，也关系到其合作伙伴和竞争对手的前景。", "ctime": 1791463616, "time_str": "20:46:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261008/c680494082.shtml"}, {"id": "5345097", "title": "北交所公募产品密集上新，机构称预计注入最高135亿元增量资金", "content": "国庆假期后，北交所公募产品密集上新，3个月持有期基金陆续发行。根据公告，10月8日，“富国北交所精选3个月持有期混合型证券投资基金”开始募集，至10月21日终止。下周开始，华夏基金、汇添富基金、嘉实基金、南方基金也将陆续开启该主题基金的发售，均自10月12日起售，至本月下旬或月底终止。上述基金单只募集上限均为5亿元。前期，易方达北交所3个月持有期基金在9月下旬开始募集，原定的公开发售时间为9月14日至24日，最终因超募而延期至9月30日。在前述基金产品推出前，北交所市场的主动权益基金主要采用两年定开模式。“相比过去的两年定期开放的锁定期，3个月持有期大幅降低了时间成本，填补了市场的产品空白。”华兴会计师事务所副总裁朱为绎表示。前期完成上报的北交所三个月持有期主题基金共计9只，除前述6家基金管理人，还涉及广发证券、中信建投基金、东财基金。在业内看来，随着主题基金陆续发售，北交所市场将迎来重要增量资金。据开源证券测算，9只三个月持有基金或为市场带来45亿元至135亿元增量资金。（第一财经）", "ctime": 1791463460, "time_str": "20:44:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261008/c680494057.shtml"}, {"id": "5345091", "title": "金浦钛业：全资子公司徐州钛白被罚款37.9万元，仍停产整改", "content": "金浦钛业公告，因外排水氟化物超标外排，全资子公司徐州钛白自2026年7月15日起停产整改。2026年9月30日，徐州钛白收到行政处罚决定书，被责令立即停止违法行为并处以罚款37.9万元。目前徐州钛白仍处于停产整改中，持续时间及复产时间尚存在不确定性。", "ctime": 1791463439, "time_str": "20:43:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261008/c680494052.shtml"}, {"id": "5345039", "title": "九阳股份：澄清与华为无战略合作", "content": "九阳股份公告，股票交易价格于2026年9月30日、10月8日连续两个交易日收盘价格涨幅偏离值累计达到22.89%。公司表示，境外营业收入3.07亿元，占营业收入比重8.79%，相关关税政策变化对公司影响较小；公司与华为不存在市场传闻所称的战略合作关系，机器人等相关投资对公司当期营业收入及利润无重大影响。公司主营业务仍以厨房小家电及相关产品研发、生产和销售为主。", "ctime": 1791463061, "time_str": "20:37:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261008/c680493150.shtml"}, {"id": "5345035", "title": "太阳电缆：福建亿力集团有限公司减持计划实施完毕，减持722.33万股占1%", "content": "太阳电缆公告，福建亿力集团有限公司于2026年7月6日至2026年9月30日通过集中竞价交易减持公司股份722.33万股，占公司总股本比例1%，减持均价8.1元/股，价格区间7.63-8.67元/股。截至2026年9月30日，减持计划期限届满，持股比例由10.40%降至9.40%。", "ctime": 1791463007, "time_str": "20:36:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261008/c680492945.shtml"}, {"id": "5345019", "title": "华域汽车：上海汇众拟摘牌收购联创电子10.9569%股权", "content": "华域汽车公告，全资子公司上海汇众拟通过上海联交所公开摘牌收购绿色基金持有的联创电子10.9569%股权，挂牌转让底价为3.2亿元。公司董事会已审议通过相关议案，交易价格尚未确定；如摘牌成功，上海汇众持股比例将提升至16.25%。", "ctime": 1791462940, "time_str": "20:35:40", "stock_code": 箱门防护、楔块固定等具体操作规范，确保货物在箱内全程稳固。\n\n在安全检查方面，该标准按照“源头防控、互认互信、信息共享”原则，分别面向装箱前检查、装箱完毕检查、承运检查和联运交接检查四个环节，规范了托运人、承运人、港口、铁路等相关方的检查内容和具体要求，推动安全责任前移。\n\n集装箱铁水联运是多式联运的重要组织形式，是优化运输结构、促进交通物流降本提质增效的重要抓手。该标准解决了铁路与水路装载加固和安全检查要求不一致、装箱作业缺乏可操作技术依据等问题，有助于推动各方建立统一的装载记录和影像追溯手段，增进互认互信，减少无效开箱掏箱等情况，从而缩短集装箱周转时间，提升铁路与水路运输衔接效率，为降低全社会物流成本提供支撑。(央视新闻)", "ctime": 1791461073, "time_str": "20:04:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261008/c680491453.shtml"}, {"id": "5344489", "title": "伊朗外长称与美方谈判仍在继续", "content": "据伊朗塔斯尼姆通讯社8日报道，伊朗外交部长阿拉格齐当日接受采访时说，伊朗与美方的谈判仍在继续。伊朗仍在评估美对“七日内重开霍尔木兹海峡”提议的回应，将在几天内作出回复。(新华社)", "ctime": 1791460948, "time_str": "20:02:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261008/c680491406.shtml"}, {"id": "5344477", "title": "冠城新材：控股股东丰榕投资减持完成，持股降至29.34%", "content": "冠城新材公告，控股股东福建丰榕投资有限公司减持计划实施完毕，2026年7月7日至2026年10月6日合计减持8421.72万股，占总股本6.05%，其中集中竞价减持6304.22万股、大宗交易减持2117.5万股，当前持股4.08亿股，占总股本29.34%。2026年9月29日至9月30日，丰榕投资通过集中竞价减持1314.5万股，占总股本0.94%，其与一致行动人合计持股比例由30.94%降至30.00%，权益变动触及5%刻度，但未导致公司控制权变更。", "ctime": 1791460912, "time_str": "20:01:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261008/c680491342.shtml"}, {"id": "5344425", "title": "古麒绒材：回购实施完毕，回购120万股", "content": "古麒绒材公告，公司此前拟以不低于1500万元、不超过人民币3000万元回购股份，回购价格不超过31.87元/股，股份拟用于股权激励或员工持股计划。截至2026年10月8日，回购方案实施完毕，累计回购120万股，占总股本0.6%，最高成交价20.15元/股、最低成交价16.78元/股，支付人民币2131.57万元。", "ctime": 1791460846, "time_str": "20:00:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261008/c680491336.shtml"}, {"id": "5344313", "title": "奕帆传动：刘锦成拟协议转让5.00%股份", "content": "奕帆传动公告，控股股东、实际控制人刘锦成拟通过协议转让方式向国联证券资产管理有限公司（代“国联添益灵活配置11号集合资产管理计划”）转让466.5万股无限售流通股，占公司总股本5.00%，转让价格24.2元/股，价款1.13亿元。本次转让不涉及控制权变更，尚需取得深交所合规性确 // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

function renderKPI() {

  const sentimentScore = META.sentiment_score || 50;

    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>

}

function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
