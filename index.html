20260630/c677828920.shtml"}, {"id": "4620447", "title": "阿根廷：出发地采集的汉坦病毒变种与邮轮疫情无关", "content": "阿根廷卫生部29日说，在该国南部省份火地岛省首府乌斯怀亚捕获的啮齿类动物体内发现汉坦病毒，但基因分析表明此次发现的病毒变种与“洪迪厄斯”号邮轮上暴发的汉坦病毒疫情无关。卫生部表示，该结果排除了此次采样的啮齿动物是邮轮疫情传染源的可能性。（新华社）", "ctime": 1782796551, "time_str": "13:15:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260630/c677828812.shtml"}, {"id": "4620433", "title": "上海市新增13款已完成登记的生成式人工智能服务", "content": "据网信上海，截至6月30日，上海市新增13款已完成登记的生成式人工智能服务，累计已完成196款生成式人工智能服务登记。（网信上海）", "ctime": 1782796395, "time_str": "13:13:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260630/c677828771.shtml"}, {"id": "4620425", "title": "港股机器人概念午后走强 优必选涨近10%", "content": "港股机器人概念午后走强，优必选涨近10%，消息面上，优必选旗下品牌研发的全球首款全尺寸超仿生人形机器人于今日即将亮相。", "ctime": 1782796202, "time_str": "13:10:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260630/c677828728.shtml"}, {"id": "4620395", "title": "Kimi估值升至315亿美元 ARR突破3亿美元 收入曲线现Anthropic早期特征", "content": "记者获悉，月之暗面Kimi上一轮200亿美元估值融资于近日完成交割，新一轮融资已经启动，投前估值涨至315亿美元。据接近Kimi的机构人士介绍，Kimi在本轮融资沟通中披露了其最新收入数据：6月中旬，ARR（年度经常性收入）突破3亿美元。Kimi此轮收入增长主要来自模型迭代带动的开发者使用和API收入提升。目前，API收入已占Kimi整体收入7成以上并持续走高。Kimi的收入曲线初现Anthropic早期商业化阶段的特征：开发者调用放量、API占比提升、海外付费用户增长，并由模型能力迭代带动价格体系上移。 (财联社)", "ctime": 1782795945, "time_str": "13:05:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260630/c677828672.shtml"}, {"id": "4620295", "title": "英国拟投入50亿英镑优先发展无人机等无人作战装备", "content": "英国定于6月30日发布新版国防投资计划，拟投入50亿英镑优先发展无人机等无人作战装备。英国首相斯塔默29日在一份声明中说，国防投资计划的重点是攻击型无人机、无人驾驶船只和无人驾驶潜艇等无人作战系统。斯塔默表示，大量使用无人系统是俄乌冲突体现的现代作战特点，英国在这一“颠覆性”领域的投资将使英国防务得到加强。新任英国防务大臣丹·贾维斯也表示，无人作战系统定义了现代战争模式，国防投资计划将使英军更迅速地获得所需装备。（新华社）", "ctime": 1782795525, "time_str": "12:58:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260630/c677828549.shtml"}, {"id": "4620293", "title": "国家能源局：电网企业线上服务平台注册用户数达5.7亿户", "content": "国家能源局今天发布《中国供电发展报告2026》，《报告》显示，我国已建成全球规模最大的电力供应体系，形成覆盖城乡、全域贯通的世界级巨型供电服务网络。《报告》显示，2025年，我国全社会用电量迈上新的里程碑，突破10万亿千瓦时大关，电力用户也接近8亿户，用户体量领跑全球，全国各地还设有供电服务网点9.9万个，从业者超56万人，推动我国供电能力和服务水平跻身国际第一方阵。（央视新闻）", "ctime": 1782795410, "time_str": "12:56:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260630/c677828524.shtml"}, {"id": "4620275", "title": "新疆局地气温或超50℃ 黄淮高温增多华南闷热感强", "content": "随着大陆高压的发展和南方雨带的北抬，本周南北方多地热意增强，不少地区将迎高温天气。6月30日至7月3日，新疆、甘肃西部等地将迎同期少见的酷热，华北、黄淮多地气温会刷新今年来新高，华南则会变得极为闷热，需加强防暑措施，谨防中暑。本周，新疆、甘肃西部、内蒙古西部和宁夏一带热意最强。在持续发展加强的大陆高压控制下，未来4天左右上述地区晴热控场，高温天气发展增多，酷热程度加剧。尤其是在新疆和甘肃西部，不少地方最高气温可超40℃，酷热程度同期少见，甚至可能打破纪录。其中，吐鲁番盆地局部地区气温最高可能达到50℃至52℃，甚至有可能挑战我国实测最高气温纪录52.2℃。（央视新闻）", "ctime": 1782795109, "time_str": "12:51:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260630/c677828464.shtml"}, {"id": "4620263", "title": "五家房企激战168轮 上海静安宅地72.89亿元成交", "content": "上海今日迎来第五批次宅地出让，5宗涉宅用地总起始价104.22亿元。其中，静安区N070402单元081a-08地块吸引保利发展、中海、建发、招商蛇口、华润置地&越秀地产等5家房企参与竞拍。经过168轮竞价，最终该地块由建发以72.89亿元竞得，成交楼面价81665元/平方米，溢价率29.63%。（财联社）", "ctime": 1782794986, "time_str": "12:49:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260630/c677828440.shtml"}, {"id": "4620239", "title": "陕北—安徽±800千伏特高压直流输电工程投运 来自陕北的绿电将点亮大别山区的灯", "content": "国家电网6月30日宣布，陕北—安徽±800千伏特高压直流输电工程当日投运，这是我国“十五五”时期首个投运的特高压直流输电工程，也是国家西电东送的又一标志性工程，来自陕北的绿电将点亮大别山区的灯。工程起于陕西延安宝塔山换流站，途经陕西、河南、安徽三省，止于安徽合肥合州换流站，直流线路全长1000多公里。工程额定电压±800千伏，额定容量800万千瓦。投运后，每年可向安徽输送电量超过360亿千瓦时，其中新能源电量占比超过50%，除了有力支撑安徽及华东地区可靠用电外，每年还替代燃煤消耗550万吨，减少二氧化碳排放1400多万吨，具有显著的节能效益。（新华社）", "ctime": 1782794311, "time_str": "12:38:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260630/c677828260.shtml"}, {"id": "4620225", "title": "美国种植面积报告和季度库存报告公布前交易商调整仓位，CBOT大豆期货收盘下跌", "content": "美国种植面积报告和季度库存报告公布前交易商调整仓位，CBOT大豆期货收盘下跌，基准期约收低1.6%。美国中西部高温天气有望缓解，美豆生长状态整体较好，市场对今晚面积报告和库存报告均有利空预期，美豆下行压力显著升高。巴西大豆创纪录产量压力持续释放，国内正值进口大豆到港高峰期，供应逐渐增加后压榨量保持高位，豆粕产量较大，饲料养殖企业拿货谨慎，豆粕累库速度加快，库存压力持续攀升，即使进口成本上涨增强工厂挺价意愿，但供应继续增加限制了豆粕价格的反弹幅度。（饲料行业信息网）", "ctime": 1782794004, "time_str": "12:33:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260630/c677828129.shtml"}, {"id": "4620189", "title": "日本10年期国债收益率上升5个基点至2.680%", "content": "日本10年期国债收益率上升5个基点至2.680%。", "ctime": 1782793409, "time_str": "12:23:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260630/c677828014.shtml"}, {"id": "4620185", "title": "行云科技等成立智冷科技公司，注册资本5000万元", "content": "企查查APP显示，近日，长沙行云智冷科技有限公司成立，法定代表人为刘桐，注册资本为5000万元，经营范围包含计算机软硬件及辅助设备批发；数据处理和存储支持服务；通用设备修理；电气设备修理等。企查查股权穿透显示，该公司由行云科技全资子公司行云智冷（深圳）科技有限公司、深圳市行云智冷资本投资合伙企业（有限合伙）等共同持股。", "ctime": 1782793328, "time_str": "12:22:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260630/c677828005.shtml"}, {"id": "4620183", "title": "韩国KOSPI指数日内涨幅达2.00%", "content": "韩国KOSPI指数日内涨幅达2.00%。", "ctime": 1782793250, "time_str": "12:20:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260630/c677827991.shtml"}, {"id": "4620179", "title": "云知声：与双楼建设签订总承包工程合同 提供云知声AI芯片创新总部项目建设工程服务", "content": "云知声公告，本公司拟将杭州打造为长三角区域研发中心，建设云知声AI芯片创新总部研发大楼，重点配套搭建规模化高性能智算集群，进一步完善大模型服务底层算力基础设施，以承载本公司强基模、深应用的核心战略。为此，公司子公司与总承包人双楼建设订立总承包工程合同，双楼建设同意提供云知声AI芯片创新总部项目的建设工程服务，签约合同价为人民币2.53亿元。", "ctime": 1782793244, "time_str": "12:20:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260630/c677827988.shtml"}, {"id": "4620159", "title": "信达生物与礼来签订唯择中国商业化合作协议", "content": "公司公告显示，信达生物已与礼来制药达成分销推广协议，将在中国大陆地区独家商业化礼来旗下乳腺癌药物唯择（Verzenios）。信达生物将负责该药物在中国的进口、市场推广、分销及学术推广工作；礼来制药仍承担该药品的生产、供货以及后续研发相关工作。唯择已在中国获批多项适应症，涵盖早期乳腺癌、局部晚期及转移性乳腺癌。", "ctime": 1782792980, "time_str": "12:16:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260630/c677827825.shtml"}, {"id": "4620155", "title": "工信部人士：加大富锂锰基正极、硅基负极、固态电解质等材料攻关", "content": "6月30日，中国汽车动力电池产业创新联盟2026年度论坛召开，工信部装备工业一司汽车发展处处长马春生在论坛上表示：“当前全球新能源汽车产业已进入加速发展的新阶段，对动力电池安全、绿色、耐久等性能提出更高要求，需要进一步强化创新驱动。”“下一步我们将加强协同，完善支持政策，持续推动动力电池产业高质量发展。”马春生说。（中证金牛座）", "ctime": 1782792642, "time_str": "12:10:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260630/c677827748.shtml"}, {"id": "4620153", "title": "华懋科技等成立新材料公司", "content": "企查查APP显示，近日，东阳华懋恒启新材料有限公司成立，法定代表人为臧琨，注册资本为2800万元，经营范围包含工程塑料及合成树脂制造；合成材料销售；玻璃纤维增强塑料制品制造；新材料技术研发等。企查查股权穿透显示，该公司由华懋科技(603306)旗下东阳华懋新材料科技研究院有限公司、北京恒启源创科技合伙企业（有限合伙）共同持股。", "ctime": 1782792506, "time_str": "12:08:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260630/c677827732.shtml"}, {"id": "4620141", "title": "四川远海国际旅行社股份有限公司向港交所提交上市申请书", "content": "据港交所文件：四川远海国际旅行社股份有限公司向港交所提交上市申请书。", "ctime": 1782792419, "time_str": "12:06:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260630/c677827707.shtml"}, {"id": "4620131", "title": "6月30日午间公告一览：轩竹生物安奈拉唑钠治疗反流性食管炎新适应症上市申请获国家药品监督管理局受理", "content": "轩竹生物公告，公司自主研发的国家1类创新药安奈拉唑钠肠溶片（商品名：安久卫 ）用于治疗成人反流性食管炎（RE）的新适应症上市申请（NDA）于近日获国家药品监督管理局（NMPA）正式受理。本次受理是基于一项在中国开展的多中心、随机、双盲双模拟、阳性药平行对照的III期注册临床研究结果。该研究为以雷贝拉唑钠为阳性对照的随机对照试验，主要疗效终点为研究者评估的8周内镜下反流性食管炎治愈率。结果显安奈拉唑钠60 mg组治愈率为88.4%（95% CI：84.3%–92.5%），雷贝拉唑钠20 mg组为84.6%（95% CI：80.0%–89.2%），两组率差为3.8%（95% CI：-2.4%–10.0%）。试验结果达到方案预设的主要终点，安奈拉唑钠组数值上的治愈率高于对照组。", "ctime": 1782792363, "time_str": "12:06:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260630/c677827686.shtml"}, {"id": "4620125", "title": "110吨级液氧煤油发动机力擎二号完成连续长程鉴定试车", "content": "近日，由中科宇航研制的110吨级液氧煤油发动机力擎二号完成连续长程鉴定试车，全面考核了该发动机的工作可靠性，未来它将成为重复使用火箭“力箭二号”的主发动机。“长程”是指点火时长远超火箭实际飞行需求，用极限工况考核发动机的耐用性。此次试车将发动机工作时长延展至火箭实际飞行时长的3.5倍，完成了长达620秒的点火考核，其中单次点火时间400秒，刷新了该型发动机单次稳定工作时间的最高纪录。（央视新闻）", "ctime": 1782792218, "time_str": "12:03:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260630/c677827660.shtml"}, {"id": "4620105", "title": "港股午评：恒生指数跌1.19%，恒生科技指数涨1.4%", "content": "港股午间收盘，恒生指数跌1.19%，恒生科技指数涨1.4%。恒指港股通ETF银华（159318）跌1.42%，港股通科技ETF鹏华（159751）涨0.48%。板块方面，通信设备、半导体产品与设备板块涨幅靠前；客运航空公司、生命科学工具板块跌幅靠前。个股方面，真健康医疗-B涨197.31%，鲟龙科技涨44.5%，长光辰芯涨18.82%，领益智造涨15.56%，津上机床中国涨15.17%；智云科技建设跌13.69%，融创中国跌8.96%，沪上阿姨跌8.39%，中国东方航空股份跌8.33%，农夫山泉跌8.0%。", "ctime": 1782792101, "time_str": "12:01:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260630/c677827641.shtml"}, {"id": "4620083", "title": "新石器：获马来西亚首批无人配送车辆测试许可", "content": "6月30日，L4级自动驾驶物流企业新石器宣布，已正式获得马来西亚交通部（MOT）批准，成为首批获准在公共道路开展无人配送车辆沙盒测试的企业之一。测试将在马来西亚智慧城市赛城进行，这也标志着新石器在东南亚市场迈出重要一步。（人民财讯）", "ctime": 1782791716, "time_str": "11:55:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260630/c677827542.shtml"}, {"id": "4620081", "title": "美国媒体称美国总统特使威特科夫正前往多哈", "content": "美国有线电视新闻网29日晚援引两名美国官员的话报道，美国总统特使威特科夫正在前往卡塔尔首都多哈的途中。报道说，目前尚不清楚美国总统特朗普的女婿库什纳是否与威特科夫同行。（财联社）", "ctime": 1782791636, "time_str": "11:53:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260630/c677827527.shtml"}, {"id": "4620079", "title": "美媒称美国总统特使威特科夫正前往多哈", "content": "美国有线电视新闻网29日晚援引两名美国官员的话报道说，美国总统特使威特科夫正在前往卡塔尔首都多哈的途中。报道说，目前尚不清楚美国总统特朗普的女婿库什纳是否与威特科夫同行。特朗普29日在社交媒体发文称，伊朗已提出会谈请求，“会谈将于明日在（卡塔尔）多哈举行”。然而，伊朗方面29日说，未来几天伊朗不会同美国举行任何级别的谈判。（新华社）", "ctime": 1782791580, "time_str": "11:53:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260630/c677827508.shtml"}, {"id": "4620077", "title": "强震重创委内瑞拉 民众自发募集物资传递希望", "content": "地震发生后，从搜救幸存者到协助寻找遇难者，委内瑞拉各地涌现出大量自发的互助行动。由于前往重灾区拉瓜伊拉州参与救援的人数过多，政府不得不采取限行措施。与此同时，各地纷纷设立物资募集点，为受灾群众提供援助。近日，在加拉加斯，报名成为志愿者的人排起了长队。从医生、翻译到各类专业人士，这种团结互助的精神，在震后几天里得到了充分体现。（央视新闻）", "ctime": 1782791428, "time_str": "11:50:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260630/c677827464.shtml"}, {"id": "4620075", "title": "伊朗边境武装冲突致2名革命卫队成员身亡", "content": "据伊朗光明通讯社6月30日报道，伊朗西部边境城市帕韦当天发生武装冲突，两名伊朗伊斯兰革命卫队成员身亡。报道援引消息人士的话说，伊朗安全部队与分裂势力团伙30日凌晨在帕韦发生武装冲突，多名“恐怖分子”被击毙。(新华社)", "ctime": 1782791176, "time_str": "11:46:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260630/c677827382.shtml"}, {"id": "4620051", "title": "A股午评：科创50指数续创新高涨超3.51% 科技板块全线爆发", "content": "截至午盘，上证指数涨0.2%，深证成指涨2.47%，创业板指涨3.06%，北证50涨3.33%。三市成交额21175亿元较上一日缩量4000亿元。全市场超2700家个股上涨。\n板块题材上，PCB概念、光学光电子板块涨幅居前；创新药、白酒板块跌幅居前。\n盘面上，PCB概念持续走强，四川九洲、天山电子、方正科技、TCL科技涨停，昊志机电、乔锋智能涨超15%，海目星、方邦股份、奕瑞科技、胜宏科技、迅捷兴涨超10%，本川智能、大族激光、四方达、亿道信息、明阳电路跟涨。联建光电、联得装备20CM涨停，雷曼广电、翰博高新涨超10%，水晶光电、奥托电子涨停。创新药板块昨日暴力反弹后持续调整，济川药业逼近跌停，粤万年青、鲁抗医药、博腾股份、睿智医药跟跌。白酒板块走弱，金种子酒跌近4%。", "ctime": 1782790505, "time_str": "11:35:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260630/c677827035.shtml"}, {"id": "4620049", "title": "期货午评：大矿复产新进展 碳酸锂主力暴涨超4%！", "content": "期货午 // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片

    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>

}

      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
