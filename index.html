1/c676589388.shtml"}, {"id": "4344907", "title": "特朗普：期待访华之旅，一定会非常精彩", "content": "5月11日，中国外交部宣布，美国总统特朗普将于5月13日至15日对中国进行国事访问。5月10日播出的采访中，特朗普表示很期待访问中国，相信此次访华之旅将会很精彩。（澎湃）", "ctime": 1778480345, "time_str": "14:19:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260511/c676589372.shtml"}, {"id": "4344897", "title": "沪深300股指期货(IF)主力合约日内涨超2%", "content": "沪深300股指期货(IF)主力合约日内涨超2%，现报4931.0点。", "ctime": 1778480199, "time_str": "14:16:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260511/c676589272.shtml"}, {"id": "4344895", "title": "沙特国家石油公司：全球原油市场或到2027年才能恢复正常", "content": "当前中东局势前景不明，据美国方面10日消息，沙特阿拉伯国家石油公司总裁兼首席执行官阿明·纳赛尔当天表示，即使霍尔木兹海峡的航运立即恢复，原油市场仍需要几个月的时间来恢复供需平衡。但如果霍尔木兹海峡的航运受限再持续数周，全球原油市场或将到2027年才会恢复正常。纳赛尔还表示，过去两个月，全球石油供应减少约10亿桶。即便能源流动恢复正常，整个系统也需要一段时间才能回归常态。（央视新闻）", "ctime": 1778480181, "time_str": "14:16:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260511/c676589271.shtml"}, {"id": "4344875", "title": "机构：预估2030年Micro LED CPO光收发模块产值将达8.48亿美元", "content": "根据TrendForce集邦咨询最新Micro LED产业研究，生成式AI驱动高速光通信需求急速攀升，由于Micro LED具备仅1-2 pJ/bit的能耗，以及具有低于百亿分之一的误码率(Bit Error Rate, BER)，有望在垂直扩展(Scale-Up)的数据中心网络中，与AEC（主动式电缆）及VCSEL NPO（垂直共振腔面射型雷射近封装光学）并列为机柜内(Intra-Rack)三大短距高速传输方案。因此，TrendForce集邦咨询预估，Micro LED CPO光收发模块市场产值将于2030年达8.48亿美元", "ctime": 1778479900, "time_str": "14:11:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260511/c676589221.shtml"}, {"id": "4344859", "title": "证券板块短线拉升，锦龙股份涨停", "content": "证券板块短线拉升，锦龙股份涨停，长江证券、华安证券、光大证券、中原证券、东方财富等纷纷走高。相关ETF方面，证券ETF易方达（512570）涨1.29%，成交额1.24亿元，证券ETF天弘（159841）涨1.22%，成交额2.75亿元。", "ctime": 1778479629, "time_str": "14:07:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260511/c676589156.shtml"}, {"id": "4344855", "title": "沪深京三市成交额超3万亿元，较上日此时放量4494亿元", "content": "据同花顺iFinD数据，沪深京三市成交额超3万亿元，较上日此时放量4494亿元，预计全天成交金额约3.6万亿元。截至目前，沪市成交额13372亿元，深市成交额16417亿元，北证50成交额222亿元。", "ctime": 1778479574, "time_str": "14:06:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260511/c676589138.shtml"}, {"id": "4344853", "title": "日本40年期国债收益率上升6.5个基点，至4.04%", "content": "日本40年期国债收益率上升6.5个基点，至4.04%。", "ctime": 1778479524, "time_str": "14:05:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260511/c676589126.shtml"}, {"id": "4344849", "title": "神舟二十三号载人飞行任务标识发布", "content": "中国载人航天工程办公室正式发布神舟二十三号载人飞行任务标识。标识采用圆形设计，展现了神舟二十三号载人飞船即将与中国空间站对接的场景，彰显了中国载人航天的硬核科技实力。标识中三颗五角星对应执行任务的三位航天员；左侧以长征二号F运载火箭发射为视觉主体，搭配金色祥云、如意纹样，将传统吉祥元素与现代航天科技相融，寄托任务圆满成功的美好祝愿，彰显传统文化与航天事业的深度融合；右侧融合“飞天”形象与灵动飘带，线条昂扬向上，与圆形轮廓相得益彰，以经典文化符号承载中华民族千年飞天梦想与探索苍穹的坚定信念。标识色彩以科技蓝为主色调，象征着太空探索与科技突破；以中国红点缀，既传承神舟系列标识视觉基因，也寓意着任务顺利、一往无前。（央视新闻）", "ctime": 1778479504, "time_str": "14:05:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260511/c676589125.shtml"}, {"id": "4344839", "title": "上证指数涨幅扩大至1%", "content": "上证指数涨幅扩大至1%，深证成指涨2.05%，创业板指涨3.44%。", "ctime": 1778479430, "time_str": "14:03:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260511/c676589119.shtml"}, {"id": "4344833", "title": "中汽协：4月份新能源汽车产销量分别为132万辆和134.4万辆 同比分别增长5.5%和9.7%", "content": "记者今天（11日）从中国汽车工业协会获悉，4月份，我国新能源汽车产销量及出口量均实现稳定增长。最新数据显示，4月份，新能源汽车产销量分别为132万辆和134.4万辆，同比分别增长5.5%和9.7%，新能源汽车新车销量达到汽车新车总销量的53.2%。在出口方面，新能源汽车出口43万辆，同比增长1.1倍。不仅如此，今年1至4月份，我国新能源汽车出口138.4万辆，同比增长1.2倍。（央视新闻）", "ctime": 1778479390, "time_str": "14:03:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260511/c676589115.shtml"}, {"id": "4344767", "title": "高盛认为AI推动韩国呈现K型化 利率面临压力", "content": "高盛集团由Andrew Tilton领导的经济学家团队指出，他们目前预计韩国将在第三季度和第四季度分别加息25个基点。他们指出，今年，韩国AI相关出口可能增加两倍至国内生产总值(GDP)的近30%。与此同时，受区域性供应过剩和能源冲击的影响，非技术类出口可能仍将保持低迷。“K型周期表明，应采取有针对性、审慎的财政政策。”经济学家在5月11日的一份报告中写道：随着AI驱动的出口大幅增长，货币面临升值。”", "ctime": 1778479149, "time_str": "13:59:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260511/c676589078.shtml"}, {"id": "4344751", "title": "续航翻倍！拥有自主知识产权的工业无人机“氢能心脏”问世", "content": "记者从中国科学院大连化学物理研究所获悉，5月10日，该所研发的“高比功率阴极闭合式风冷电堆”技术在大连通过科技成果鉴定。这款新型电堆是为工业无人机量身打造的集轻量化、高功率、风冷散热等特点于一体的“氢能心脏”，可使工业无人机续航时间提升两倍以上，风冷电堆比功率达1970W/kg。目前，项目已构建起“材料—部件—系统”的全链条自主研发体系，形成了完整的自主知识产权。项目团队已建成阴极闭合式风冷电堆自动化产线，具备规模化交付能力，成果已成功应用于林业、农业、电力巡检、应急救援等实际工况中。（央视新闻）", "ctime": 1778478991, "time_str": "13:56:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260511/c676589068.shtml"}, {"id": "4344747", "title": "现货黄金失守4650美元/盎司", "content": "现货黄金失守4650美元/盎司，日内跌1.37%。", "ctime": 1778478962, "time_str": "13:56:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260511/c676589062.shtml"}, {"id": "4344745", "title": "纽约期金失守4660美元/盎司", "content": "纽约期金失守4660美元/盎司，日内跌1.51%。", "ctime": 1778478945, "time_str": "13:55:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260511/c676589060.shtml"}, {"id": "4344719", "title": "现货黄金失守4660美元/盎司", "content": "现货黄金失守4660美元/盎司，日内跌1.14%。纽约期金失守4660美元/盎司，日内跌1.51%。", "ctime": 1778478460, "time_str": "13:47:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260511/c676588943.shtml"}, {"id": "4344717", "title const SECTORS  = [{"name": "金融", "hit_count": 38, "etfs": []}, {"name": "半导体", "hit_count": 31, "etfs": []}, {"name": "数据要素", "hit_count": 25, "etfs": []}, {"name": "人工智能", "hit_count": 24, "etfs": []}, {"name": "军工", "hit_count": 15, "etfs": []}, {"name": "消费", "hit_count": 14, "etfs": []}, {"name": "新能源", "hit_count": 7, "etfs": []}, {"name": "低空经济", "hit_count": 5, "etfs": []}];
const META     = {"update_time": "2026-05-11 14:53:41", "sentiment_score": 60.84905660377358, "agents": []};

// 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'

  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
