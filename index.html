: "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260713/c678139293.shtml"}, {"id": "4706033", "title": "包钢股份：预计上半年净利润同比增加52%到98%", "content": "包钢股份公告，预计2026年半年度实现归属于母公司所有者的净利润2.3亿元到3亿元，与上年同期相比，将增加7867万元到1.49亿元，同比增加52%到98%。预计2026年半年度实现归属于母公司所有者的扣除非经常性损益的净利润3.4亿元到5亿元，与上年同期相比，将增加2.33亿元到3.93亿元，同比增加218%到368%。2026年上半年，钢铁市场需求偏弱、结构性分化明显，煤焦原料价格上行压缩企业利润空间。面对行业下行压力，公司坚定“优质精品钢+系列稀土钢”战略，深化产品结构调整，加大高附加值钢铁新材料产销占比，全面推进全流程降本增效，叠加公司部分产线逐步复产和稀土市场上行，二季度整体实现扭亏为盈，上半年盈利实现较大幅度提升。", "ctime": 1783936012, "time_str": "17:46:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260713/c678139238.shtml"}, {"id": "4706003", "title": "苏豪汇鸿：预计2026年上半年净亏损2.38亿元到1.98亿元", "content": "苏豪汇鸿公告，预计2026年1月1日至2026年6月30日归属于母公司所有者的净亏损为2.38亿元到1.98亿元，与上年同期相比将出现亏损。", "ctime": 1783935864, "time_str": "17:44:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260713/c678139050.shtml"}, {"id": "4706001", "title": "海思科：HSK60002片获得IND申请受理通知书", "content": "海思科公告，公司于近日收到国家药品监督管理局下发的《受理通知书》，HSK60002片申请境内生产药品注册临床试验已获受理。HSK60002片是公司自主研发的口服小分子制剂，拟用于炎症性疾病的治疗，属于化学药品1类。临床前研究数据显示，该药品在相关动物模型中表现出显著的药效活性，作用机制明确，具备良好的开发价值和转化前景。", "ctime": 1783935860, "time_str": "17:44:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260713/c678139048.shtml"}, {"id": "4705999", "title": "德冠新材：预计2026年上半年净利润同比增长53.21%～74.72%", "content": "德冠新材公告，预计2026年1月1日至2026年6月30日归属于上市公司股东的净利润为5700万元至6500万元，比上年同期的3720.3万元增长53.21%至74.72%。扣除非经常性损益后的净利润为5200万元至6100万元，比上年同期的3168.16万元增长64.13%至92.54%。基本每股收益为0.33元/股至0.38元/股，上年同期为0.21元/股。", "ctime": 1783935855, "time_str": "17:44:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260713/c678139044.shtml"}, {"id": "4705995", "title": "江盐集团：宁波龙脊拟减持公司不超过1%股份", "content": "江盐集团公告，持股5%以上股东宁波信达汉石龙脊股权投资合伙企业（有限合伙）（简称“宁波龙脊”）持有公司无限售条件流通股7796.17万股，占公司总股本12.13%，股份来源为首次公开发行前取得。因经营业务发展需要，宁波龙脊拟于2026年8月4日至2026年11月4日，通过集中竞价方式减持不超过642.78万股，占公司总股本的1%。若减持期间公司发生送股、配股等股份变动事项，减持数量可相应调整，可转换公司债券转股、股权激励增发新股、非公开发行股票等引起的股份变动不调整。", "ctime": 1783935849, "time_str": "17:44:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260713/c678139042.shtml"}, {"id": "4705991", "title": "立昂微：预计2026年上半年净利润8500万元左右，同比扭亏为盈", "content": "立昂微公告，预计2026年半年度实现营业收入20.95亿元左右，同比增长约25.77%。预计实现归属于上市公司股东的净利润为8500万元左右，同比扭亏为盈。主要得益于半导体硅片板块盈利能力的改善。随着产品结构持续向高端化迭代升级，产销规模的稳步扩张，尤其是12英寸硅片产销量实现大幅增长，硅片单位成本同步下降，硅片业务（含对立昂微母公司的销售）的综合毛利率同比上升。", "ctime": 1783935784, "time_str": "17:43:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260713/c678139022.shtml"}, {"id": "4705987", "title": "江丰电子在嘉兴成立半导体材料新公司", "content": "企查查显示，近日，嘉兴晶丰光曜半导体材料有限公司成立，经营范围包含：电子专用材料制造；电子专用材料销售；电子专用材料研发等。企查查股权穿透显示，该公司由江丰电子间接全资持股。", "ctime": 1783935758, "time_str": "17:42:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260713/c678139007.shtml"}, {"id": "4705985", "title": "洽洽食品：预计2026年上半年净利润2.4亿-2.65亿元，同比增长170.75%-198.96%", "content": "洽洽食品公告，预计2026年上半年归属于上市公司股东的净利润为2.4亿元-2.65亿元，比上年同期8864.16万元增长170.75%-198.96%；扣除非经常性损益后的净利润为2亿元-2.25亿元，比上年同期4309万元增长364.15%-422.16%。业绩增长主要因销售收入增加及葵花籽原料采购成本下降。", "ctime": 1783935708, "time_str": "17:41:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260713/c678138969.shtml"}, {"id": "4705983", "title": "伊朗阿巴斯港和格什姆岛附近传出爆炸声", "content": "据伊朗方面消息，当地时间7月13日下午，当地居民报告称，在伊朗阿巴斯港和格什姆岛附近听到爆炸声。\n\n据称，爆炸声来自远离市区的地方，可能与阿巴斯港西海岸有关。(央视新闻)", "ctime": 1783935702, "time_str": "17:41:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260713/c678138965.shtml"}, {"id": "4705975", "title": "中信保诚基金吴秋君：关注阶段性利率下行窗口", "content": "中信保诚稳悦债券基金经理吴秋君认为，当前10年期国债收益率运行在1.73%附近，市场关注的核心点位为1.70%。若达到该位置，对应约2—2.5BP的下行空间。与此同时，30年期与10年期国债期限利差持续压缩，超长端品种理论上存在一定的补涨空间，波段操作有望贡献收益。需要留意的是，30年期国债期货114元关口可能引发短期震荡盘整，此类波动或为关注窗口。吴秋君认为，四季度利率存在进一步下行的空间，10年期国债收益率突破1.70%的可能性或将相应上升。若将持有周期拉长至一至两个季度乃至一年以上，10年期国债收益率中枢存在向1.70%以下进一步运行的基础条件。", "ctime": 1783935645, "time_str": "17:40:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260713/c678138946.shtml"}, {"id": "4705959", "title": "恒誉环保：预计2026年上半年净利润同比增长约864.68%", "content": "恒誉环保公告，预计2026年半年度实现归属于母公司所有者的净利润约8100万元，与上年同期（法定披露数据）相比增长约864.68%。报告期内，全球循环经济政策提振市场需求，全球固体废弃物化学循环项目建设需求显著提高，市场活力显著增强。公司凭借核心技术在全球拥有的持续领先优势以及多个国际市场实践项目，公司高端装备销售订单显著增加，销售收入相应增长；报告期内，公司现有运营项目持续稳健发力，保持高效平稳运行，持续为营收和利润贡献常态化收益。", "ctime": 1783935608, "time_str": "17:40:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260713/c678138851.shtml"}, {"id": "4705955", "title": "亚太药业：预计2026年上半年净亏损40万元–60万元", "content": "亚太药业公告，预计2026年1月1日至2026年6月30日归属于上市公司股东的净亏损为40万元–60万元，上年同期盈利1.05亿元。扣除非经常性损益后的净利润盈利110万元–160万元，上年同期亏损4886.22万元。主要系公司上期出售全资子公司绍兴兴亚药业有限公司100%股权，相应增加公司2025年半年度利润总额（非经常性损益）约1.49亿元所致。", "ctime": 1783935596, "time_str": "17:39:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260713/c678138844.shtml"}, {"id": "4705953", "title": "航天彩虹：预计上半年净利润7500万元–9500万元，上年同期亏损48.96万元", "content": "航天彩虹公告，预计2026年上半年净利润为7500万元–9500万元，上年同期亏损48.96万元。报告期内，无人机海外业务景气度维持高位，手持订单和客户意向订单充足且呈现上升趋势，下半年将会按计划进行交付；新材料业务终端需求和产品价格压力较大的情况尚未好转，导致新材料业务经营持续承压，对公司整体利润水平造成负面影响；另外，上半年因美元贬值，汇兑损益也对公司利润水平产生较大不利影响；公司参与电科蓝天战略配售，对公司利润水平有较大正面影响。", "ctime": 1783935589, "time_str": "17:39:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260713/c678138840.shtml"}, {"id": "4705951", "title": "盛通股份：预计2026年上半年净利润为负，预计亏损2200万元至2000万元", "content": "盛通股份公告，预计2026年1月1日至2026年6月30日归属于上市公司股东的净利润为亏损2200万元至2000万元，上年同期为亏损656.78万元。扣除非经常性损益后的净利润为亏损2600万元至2000万元，上年同期为亏损950.44万元。报告期内，公司经营业绩承压，主要原因：1、受行业变化和市场激烈竞争等因素影响，公司营业收入同比下降，相应导致公司利润下降。2、公司积极布局包装战略产业，加大业务布局等投入。", "ctime": 1783935580, "time_str": "17:39:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260713/c678138833.shtml"}, {"id": "4705943", "title": "巴布亚新几内亚附近海域发生6.4级地震 震源深度10公里", "content": "中国地震台网正式测定：7月13日16时53分，在巴布亚新几内亚附近海域（南纬3.20度，东经148.65度）发生6.4级地震，震源深度10公里。(央视新闻)", "ctime": 1783935503, "time_str": "17:38:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260713/c678138780.shtml"}, {"id": "4705941", "title": "铜陵有色：预计上半年净利润同比增长84.13%-118.87%", "content": "铜陵有色公告，预计2026年上半年归属于上市公司股东的净利润为26.5亿元至31.5亿元，比上年同期（追溯调整后）的14.39亿元增长84.13%至118.87%；扣除非经常性损益后的净利润为26亿元至31亿元，比上年同期（追溯调整后）的13.99亿元增长85.81%至121.54%；基本每股收益0.20元至0.23元。业绩变动原因为报告期内阴极铜、硫酸等主产品价格同比大幅上升，铜箔加工费持续上涨，公司把握市场机遇，加强内部管理，降本增效，提升盈利能力。本次业绩预告未经会计师事务所预审计。", "ctime": 1783935442, "time_str": "17:37:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260713/c678138756.shtml"}, {"id": "4705935", "title": "云从科技：上线“云起ModelHub”统一模型服务平台", "content": "记者从云从科技获悉，公司正式上线“云起ModelHub”统一模型服务平台，面向企业客户、开发者和AI团队提供统一模型服务入口。该平台是云从科技AI基础设施体系的重要组成部分，提供统一API、模型调用、调用计量和模型服务管理能力，支撑上层AI团队在不同业务场景中稳定运行。(人民财讯)", "ctime": 1783935373, "time_str": "17:36:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260713/c678138717.shtml"}, {"id": "4705933", "title": "META宣布将追加400亿美元投资路易斯安那州数据中心 将该数据中心扩展至5GW的计算容量", "content": "META宣布将追加400亿美元投资路易斯安那州数据中心，Meta正在将该数据中心扩展至5GW的计算容量。Meta承担数据中心所用能 // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';

  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">

        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>

      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
