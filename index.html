}
.score-bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s; }
.up { color: var(--red); }
.down { color: var(--green); }
.pulse { animation: pulse 2s infinite; }
@keyframes pulse {

  50% { opacity: 0.5; }

_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260706/c677982366.shtml"}, {"id": "4659153", "title": "南极电商：拟以1亿元至2亿元回购公司股份", "content": "南极电商公告，拟以1亿元至2亿元回购公司股份，回购价格不超过4.29元/股，预计回购股份数量为2331万股至4662万股，约占公司目前总股本的比例为0.95%至1.90%。", "ctime": 1783335036, "time_str": "18:50:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260706/c677982313.shtml"}, {"id": "4659129", "title": "欧足联称国际足联“特赦”巴洛贡的决定越过了红线", "content": "欧足联6日发表声明称，国际足联决定暂缓执行对美国队球员巴洛贡吃到红牌后自动停赛一场的处罚，这一决定越过了红线。欧足联表示，足球和其他任何体育运动一样，都依赖于规则，而规则是公平、公正和透明比赛的基础。红牌罚下后至少自动停赛一场并非可自由裁量，也无需主管机构的批准。这是规则中明确规定的原则，不能有任何例外，更何况是在比赛进行中，其他多名球员都曾遭遇过类似情况并按时服完停赛期的情况下。当规则的确定性不再由其维护者保证时，比赛的公正性就会受到威胁，比赛的公信力也会受到损害。同样，这样的决定会在正在进行的比赛中开创先例，今后类似情况都必须得到同等对待，这对比赛本身有害无益。欧足联表示，对这一史无前例、令人费解且毫无道理的决定表示难以置信。（央视新闻）", "ctime": 1783334951, "time_str": "18:49:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260706/c677982276.shtml"}, {"id": "4659115", "title": "多座水库遇险 国家防总对广西启动防汛二级应急响应", "content": "记者从应急管理部获悉，国家防总将针对广西的防汛三级应急响应提升至二级，国家防灾减灾救灾委员会针对广西启动国家救灾四级应急响应。国家防总联合工作组赴广西指导。 7月6日，受台风及强降雨影响，广西壮族自治区南宁市、贵港市多座水库发生险情。国家防总办公室、应急管理部持续调度应急处置工作，组织中国气象局、水利部、自然资源部、住房城乡建设部、交通运输部等部门联合会商，国家应急指挥总部进入应急状态。 应广西请求，应急管理部调派两架翼龙无人机到灾区保障通信，会同国家粮食和物资储备局调拨应急物资，统筹做好群众生活保障；调派国家综合性消防救援队伍1372人、270车、140舟艇，自然灾害工程应急救援中心（中国安能集团）专业救援力量350人携带装备赶赴现场处置。(新华社)", "ctime": 1783334850, "time_str": "18:47:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260706/c677982240.shtml"}, {"id": "4659069", "title": "贝因美：销售代理合同纠纷一审判决，获赔176.87万元并退还授权费369万元", "content": "贝因美公告，公司此前就与浙江科露宝食品有限公司的销售代理合同纠纷提起诉讼。近日收到杭州市滨江区人民法院一审判决：确认双方《贝因美特医配产品合作协议》于2023年12月30日解除；科露宝于判决生效之日起十日内赔偿贝因美损失176.87万元；贝因美于判决生效之日起十日内退还科露宝授权费369万元；驳回双方其他诉讼请求。目前该判决处于一审阶段，尚在上诉期，最终结果及对公司利润的影响存在不确定性。", "ctime": 1783334682, "time_str": "18:44:42", "stock_code": "", "stock_name": " 260706/c677981705.shtml"}, {"id": "4658953", "title": "燕京啤酒：预计2026年上半年净利润同比增长25.00%-35.00%", "content": "燕京啤酒公告，预计2026年1月1日至2026年6月30日归属于上市公司股东的净利润为盈利13.79亿元-14.89亿元，比上年同期增长25.00%-35.00%。扣除非经常性损益后的净利润为盈利13.47亿元-14.51亿元，比上年同期增长30.00%-40.00%。报告期内，公司稳步推进“十五五”规划落地，以啤酒主业为核心，推动大单品放量增长，同时深化市场渠道建设，强化产销协同与费用管控，推动收入稳健增长和盈利能力持续改善。", "ctime": 1783333905, "time_str": "18:31:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260706/c677981660.shtml"}, {"id": "4658951", "title": "沃华医药：预计2026年上半年净利润同比增长45.49%～79.07%", "content": "沃华医药公告，预计2026年1月1日至2026年6月30日归属于上市公司股东的净利润为6500万元～8000万元，比上年同期增长45.49%～79.07%。扣除非经常性损益后的净利润为6380万元～7750万元，比上年同期增长49.29%～81.35%。", "ctime": 1783333900, "time_str": "18:31:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260706/c677981659.shtml"}, {"id": "4658937", "title": "日本机构：日本大米价格受库存过剩影响有望继续回落", "content": "日本“米谷稳定供应确保支援机构”6日公布数据显示，6月大米价格预期指数降至19，创历史最低水平。这项反映大米价格预期的业界调查显示，受库存过剩影响，日本大米价格有望继续回落。该机构由稻米生产者团体和批发企业等组成，每月对供需和价格进行调查。指数以50为荣枯线，高于50表示上涨预期占优，低于50则为下跌预期占优。该指数已连续9个月低于50，表明价格下行预期持续主导市场。（新华社）", "ctime": 1783333780, "time_str": "18:29:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260706/c677981595.shtml"}, {"id": "4658935", "title": "国家发展改革委紧急安排1亿元中央预算内投资支持广西台风灾害灾后应急恢复", "content": "近期，受今年第10号台风“美莎克”影响，广西多地发生严重暴雨洪涝灾害，造成人员伤亡和财产损失。7月6日，国家防灾减灾救灾委员会启动国家四级救灾应急响应。根据《国家自然灾害救助应急预案》和广西灾害损失情况，国家发展改革委紧急安排中央预算内投资1亿元，支持广西做好台风灾害灾后应急恢复，重点用于灾区受损道路、水利等基础设施和学校、医院等公共服务设施灾后应急恢复建设，推动尽快恢复正常生产生活秩序。（人民财讯）", "ctime": 1783333740, "time_str": "18:29:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260706/c677981574.shtml"}, {"id": "4658923", "title": "淮河防总启动防汛四级应急响应", "content": "记者从水利部淮河水利委员会了解到，7月6日，淮河防总、淮委启动防汛四级应急响应和洪水防御Ⅳ级应急响应。据了解，受10号台风“美莎克”倒槽及其残余环流影响，预计7月6日至7日，淮河流域将有一次大到暴雨、局地大暴雨的降雨过程，流域面雨量40至60毫米，其中淮河水系30至50毫米，沂沭泗河水系70至90毫米，山东半岛40至60毫米。受此影响，淮河干流、沂沭河、骆马湖等将出现明显涨水过程，暴雨落区内部分中小河流可能发生超警洪水。根据《淮河防汛抗旱总指挥部防汛抗旱应急预案》《淮河水利委员会水旱灾害防御应急预案》，淮河防总、淮委于7月6日12时针对淮河及南部支流、沂沭泗河水系、山东半岛启动防汛四级应急响应和洪水防御Ⅳ级应急响应。（新华社）", "ctime": 1783333634, "time_str": "18:27:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260706/c677981520.shtml"}, {"id": "4658919", "title": "广西将南宁、贵港洪水防御应急响应提升为一级", "content": "根据广西南宁市、贵港市当前的台风暴雨洪水防御形势，按照广西水利厅洪水防御工作预案，经综合分析研判，广西水利厅决定自7月6日16时将针对南宁市、贵港市的洪水防御二级应急响应提升为一级应急响应。（央视新闻）", "ctime": 1783333620, "time_str": "18:27:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260706/c677981513.shtml"}, {"id": "4658899", "title": "上港集团：6月母港集装箱吞吐量498.7万标准箱，同比增长6.1%", "content": "上港集团公告，2026年6月预计完成母港集装箱吞吐量498.7万标准箱，同比增长6.1%；预计完成母港货物吞吐量5357.4万吨，同比增长3.3%。2026年上半年，公司预计累计完成母港集装箱吞吐量2873.7万标准箱，同比增长6.2%；累计完成母港货物吞吐量3.05亿吨，同比增长2.7%。", "ctime": 1783333475, "time_str": "18:24:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260706/c677981464.shtml"}, {"id": "4658897", "title": "基石投资者有意购买高达70亿美元的SK海力士ADR股票", "content": "美国证券交易委员会（SEC）文件显示，SK 海力士在公开募股中发行1.78亿股美国存托股票，每ADS代表十分之一SK HYNIX普通股。基石投资者表示有意购买高达70亿美元的美国存托股票。（财联社）", "ctime": 1783333465, "time_str": "18:24:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260706/c677981453.shtml"}, {"id": "4658895", "title": "神州高铁：公司股票自7月7日起停牌", "content": "神州高铁公告，公司股票自2026年7月7日开市起停牌，预计停牌时间不超过2个交易日。公司控股股东国投高新正在筹划涉及公司控制权变更的重大事项，交易对手方为某国有综合交通集团，该事项可能导致公司控制权发生变更。目前，各方主体正在就相关事项进行论证和磋商，具体情况以各方签订的协议为准。本次交易尚需履行国有资产监督管理报批程序，存在不确定性。", "ctime": 1783333457, "time_str": "18:24:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260706/c677981451.shtml"}, {"id": "4658889", "title": "章源钨业下调2026年7月上半月长单采购报价", "content": "章源钨业公布2026年7月上半月长单采购报价：55%黑钨精矿：44.8万元/标吨；55%白钨精矿：44.7万元/标吨；仲钨酸铵(国标零级)：66万元/吨。注：以上单价含13%增值税。章源钨业2026年6月下半月长单采购报价为：55%黑钨精矿：52万元/标吨；55%白钨精矿：51.9万元/标吨；仲钨酸铵(国标零级)：78万元/吨。注：以上单价含13%增值税。（人民财讯）", "ctime": 1783333408, "time_str": "18:23:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260706/c677981434.shtml"}, {"id": "4658879", "title": "鹏欣资源：首次回购0.07%公司股份，已回购金额为999.84万元", "content": "鹏欣资源公告，2026年7月6日，公司通过集中竞价交易方式首次回购公司股份158.13万股，占公司总股本的比例为0.07%，回购成交的最高价格为6.63元/股，最低价格为6.13元/股，已回购金额为999.84万元（不含交易费用）。", "ctime": 1783333287, "time_str": "18:21:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260706/c677981387.shtml"}, {"id": "4658867", "title": "国家防总针对广西启动防汛二级应急响应", "content": "国家防总针对广西启动防汛二级应急响应。7月6日，受台风及强降雨影响，广西壮族自治区南宁市、贵港市多座水库发生险情。险情发生后，国家防总副总指挥、应急管理部部长张成中立即调度指导应急处置工作，与广西壮族自治区党委书记陈刚视频连线，传达中央领导同志批示精神，组织中国气象局、水利部、自然资源部、住房城乡建设部、交通运输部等部门联合会商，部署国家应急指挥总部立即进入应急状态。派出由国家防总办公室主任、应急管理部副部长陈敏带队的国家防总联合工作组赴广西指导。宋元明、宋新春等部领导持续调度。国家防总将针对广西的防汛三级应急响应提升至二级，国家防灾减灾救灾委员会针对广西启动国家救灾四级应急响应。应广西请求，应急管理部调派两架翼龙无人机到灾区保障通讯，会同国家粮食和物资储备局调拨应急物资，统筹做好群众生活保障；调派国家综合性消防救援队伍1372人、270车、140舟艇，自然灾害工程应急救援中心（中国安能集团）专业救援力量350人携带装备赶赴现场处置。（新华社）", "ctime": 1783333164, "time_str": "18:19:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260706/c677981328.shtml"}, {"id": "4658861", "title": "哈马斯宣布解散加沙战时紧急管理机构", "content": "当地时间6日，加沙地带政府媒体办公室宣布，战时紧急管理机构负责人穆罕默德·法拉已正式提交辞呈，并解散该机构。加沙地带的行政与民事管理权将全面移交给巴勒斯坦技术官僚委员会，相关准备工作已全部完成。（央视新闻）", "ctime": 1783333145, "time_str": "18:19:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260706/c677981320.shtml"}, {"id": "4658855", "title": "中欧班列中通道今年以来班列通行量突破2500列", "content": "记者7月6日从中国铁路呼和浩特局集团有限公司获悉，当日满载汽车配件和日用百货等商品的1293次中欧班列从二连浩特铁路口岸驶出，标志着今年以来中欧班列中通道班列通行量突破2500列。1293次中欧班列在二连浩特铁路口岸整装待发。（张海峰 摄）为保障中欧班列高效运行，二连浩特铁路口岸应用“铁路快通”模式，用好95306“数字口岸”系统，不断提高通关便利化水平。不仅如此，二连浩特铁路口岸持续深化与蒙古国扎门乌德站“两站一体化”运输组织模式，动态共享两站间车流结构与站存情况，目前每天出入境中欧班列13列左右。“在做好中欧班列无纸化通关的同时，我们加强与海关、边检等部门信息互联互通，不断提升中欧班列通行效率。现在中欧班列通关时间最短可压缩至约30分钟。”中国铁路呼和浩特局集团有限公司二连站货运交接所主任武树军说。二连浩特铁路口岸是中欧班列中通道唯一出入境铁路口岸。目前，经此运行的中欧班列线路达76条，通达德国、波兰等10余个国家70多个枢纽站点。（新华社）", "ctime": 1783333024, "time_str": "18:17:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260706/c677981274.shtml"}, {"id": "4658835", "title": "松霖科技：预计2026年上半年净利润同比增长50.40%到98.74%", "content": "松霖科技公告，预计2026年半年度实现归属于母公司所有者的净利润1.4亿元到1.85亿元，同比增加50.40%到98.74%；预计归属于母公司所有者的扣除非经常性损益的净利润1.25亿元到1.7亿元，同比增加76.08%到139.47%。报告期内，受益于公司越南生产基地产能投放，新项目转化，公司业务持续向好。", "ctime": 1783332824, "time_str": "18:13:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260706/c677981161.shtml"}, {"id": "4658833", "title": "金城医药：预计上半年净利润同比增长153.55%～222.71%", "content": "金城医药公告，预计2026年上半年净利润为1.1亿元到1.4亿元，同比增长153.55%～222.71%。报告期内，公司归属于上市公司股东的净利润较上年同期增长，主要原因如下：1、中间体板块部分产品销量较去年同期增加，产能利用率提高，产品成本下降。2、全资子公司北京金城泰尔制药有限公司完成“普罗雌烯阴道用软胶囊生产技术及上市许可持有人权益”转让，增加了非经常性损益。3、公司持续加大技术创新，开展“揭榜挂帅”等内部挖潜项目，提质增效。", "ctime": 1783332815, "time_str": "18:13:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260706/c677981160.shtml"}, {"id": "4658829", "title": "宋城演艺：股东QIAO LONG HUANG拟向配偶转让不超过1.65%", "content": "宋城演艺公告，持股8583.66万股（占公司总股本比例3.29%）的QIAO LONG HUANG先生计划自本公告披露之日起十五个交易日后的三个月内（即2026年7月28日至2026年10月27日），以大宗交易方式向其配偶刘萍女士转让不超过4300万股（含本数）公司股份，即转让比例不超过公司总股本的1.65%。", "ctime": 1783332804, "time_str": "18:13:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/202607 // 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
