: false, "source": "", "url": "https://news.10jqka.com.cn/20260813/c678922984.shtml"}, {"id": "4950319", "title": "股指期货早盘收盘 主力合约全线上涨", "content": "股指期货早盘收盘，主力合约全线上涨。沪深300股指期货(IF)主力合约涨0.44%，上证50股指期货(IH)主力合约涨0.34%，中证500股指期货(IC)主力合约涨0.86%，中证1000股指期货(IM)主力合约涨0.70%。", "ctime": 1786591818, "time_str": "11:30:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260813/c678922982.shtml"}, {"id": "4950311", "title": "凌志软件中标头部券商统一AI门户数字员工项目", "content": "近日，凌志软件成功中标某头部券商统一AI门户数字员工项目。围绕财富经纪一线场景建设数字员工能力，推动AI从对话问答走向任务执行、从单点应用走向平台化落地。（人民财讯）", "ctime": 1786591643, "time_str": "11:27:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260813/c678922889.shtml"}, {"id": "4950305", "title": "美官员批评以防长“长期占领黎南部”言论", "content": "美国国务院官员当天批评以色列国防部长卡茨，指出其发表的“准备长期占领黎巴嫩南部”言论与以色列政府此前作出的承诺相悖。据报道，卡茨12日早些时候在黎巴嫩南部声称，“以军将留在黎巴嫩、叙利亚和加沙的安全区，以保卫以色列”。他还称，已指示以军采取一切必要措施，为在该地区的长期驻留做好准备。美国国务院一名官员就此表示：“美国期望各方按照他们同意的框架协议采取行动，而以色列明确表示过在黎巴嫩没有领土野心。在黎南部保持永久性军事存在，既不符合该框架协议中（以方）所作的承诺，也不利于（以黎）两国长期的和平与安全。”这名官员强调，美国“完全支持黎巴嫩的领土完整和主权”。（新华社）", "ctime": 1786591448, "time_str": "11:24:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260813/c678922828.shtml"}, {"id": "4950299", "title": "安徽启用茨淮新河分泄洪水 降低颍河水位", "content": "受颍河上游河南省持续来水影响，安徽省颍河水位快速上涨，预计阜阳闸8月15日洪峰水位31.4米，超警戒水位0.9米。安徽省水利厅决定于8月13日11时启用茨淮新河分泄颍河洪水，全力降低颍河水位，最大限度减轻流域防洪压力。（央视新闻）", "ctime": 1786591360, "time_str": "11:22:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260813/c678922812.shtml"}, {"id": "4950295", "title": "臻宝科技落子光谷 拟5.2亿元投建半导体零部件研发生产基地项目", "content": "日前，国内半导体零部件领域上市企业臻宝科技落子光谷，将投资建设半导体零部件研发生产基地项目。项目总投资5.2亿元，建设周期为三年。基地核心布局碳化硅零部件、高纯硅精密零部件、氮化铝陶瓷材料及配套零部件三大品类，属于芯片刻蚀、薄膜沉积等前道制造环节刚需耗材。基地投产后，可快速扩充公司现有产能，就近服务华中区域晶圆制造企业，缩短交付周期。（中国光谷）", "ctime": 1786591314, "time_str": "11:21:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260813/c678922795.shtml"}, {"id": "4950289", "title": "复旦团队首次制备单铜氧层高温超导体", "content": "高温超导电性是未来高效电力传输和高性能电子器件发展的重要方向，但其微观机理始终是凝聚态物理的“皇冠之谜”。北京时间8月12日晚间，复旦大学物理学系张远波教授团队与合作者以“Superconducting 2D cuprate with a single CuO  plane”为题在《自然》（Nature）发表研究成果，成功将铜基高温超导体削薄至仅含一个超导平面——即单个CuO 面。这一“极限操作”不仅证实了高温超导的二维本质，更在超导-绝缘体转变的临界点发现了奇异的“反常金属态”和量子临界现象，为研究高温超导机理提供了全新的量子实验平台。（复旦大学）", "ctime": 1786591081, "time_str": "11:18:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260813/c678922657.shtml"}, {"id": "4950267", "title": "沪深京三市成交额超1.5万亿元，较上日此时放量2066亿元", "content": "据同花顺iFinD数据，沪深京三市成交额超1.5万亿元，较上日此时放量2066亿元，预计全天成交金额约2.5万亿元。截至目前，沪市成交额6785亿元，深市成交额8130亿元，北证50成交额94亿元。", "ctime": 1786590653, "time_str": "11:10:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260813/c678922498.shtml"}, {"id": "4950257", "title": "一年来我国已累计清理处置6000多万吨固体废物", "content": "国务院新闻办公室今天（13日）举行“开局起步‘十五五’”系列主题新闻发布会。会上介绍，自去年6月启动全国非法倾倒处置固体废物专项整治行动以来，我国已累计排查发现问题5.6万多个，完成整改4.5万多个，清理处置各类固体废物6000多万吨，一大批存量污染问题得到有效整治。（央视新闻）", "ctime": 1786590513, "time_str": "11:08:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260813/c678922430.shtml"}, {"id": "4950253", "title": "南向资金净买入超40亿港元", "content": "据同花顺iFinD数据，截至目前，南向资金净买入超40亿港元，其中港股通（沪）买入超24.56亿港元，港股通（深）买入超15.65亿港元。", "ctime": 1786590432, "time_str": "11:07:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260813/c678922398.shtml"}, {"id": "4950241", "title": "机构预测成品油价格将迎年内第五次下调", "content": "8月14日24时（本周六零点），成品油调价窗口将再度开启。记者获悉，因周期内国际原油价格震荡下行，届时国内成品油下调幅度在0.15元/升左右，预计将迎年内第五次下调。以70升的油箱来计算，私家车主加满一箱油将少花11元左右。（第一财经）", "ctime": 1786590240, "time_str": "11:04:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260813/c678922340.shtml"}, {"id": "4950239", "title": "第二届世界人形机器人运动会将举行51个项目1301场比赛", "content": "第二届世界人形机器人运动会将于8月22日在国家速滑馆“冰丝带”开幕，本届运动会由北京市人民政府、中央广播电视总台等联合主办。与首届运动会相比，第二届世界人形机器人运动会的竞赛项目、参赛队伍全面提质扩容，本届运动会正赛将于8月22日至26日在国家速滑馆“冰丝带”举行，共5天时间。按照赛程安排，将举行51个项目共1301场比赛。赛期从首届运动会的3天6个竞赛单元增加到5天9个单元，时间由上午和下午调整为下午和晚上，每个单元各3个小时。（央视新闻）", "ctime": 1786590230, "time_str": "11:03:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260813/c678922339.shtml"}, {"id": "4950235", "title": "“十五五”时期生态环境监测和执法将大力推进数智化转型", "content": "国务院新闻办公室今天（13日）举行“开局起步‘十五五’”系列主题新闻发布会。会上介绍，“十五五”时期，生态环境部围绕监测、执法，将采取更大力度推进数智化转型，进一步提升生态环境监管的质效。会上介绍，生态环境部将对大气、水、海洋等传统领域，全面实施数智化升级工程，推进国控站点仪器设备的智能化更新改造。（央视新闻）", "ctime": 1786590221, "time_str": "11:03:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260813/c678922333.shtml"}, {"id": "4950221", "title": "医药商业板块拉升，药易购涨超13%", "content": "医药商业板块拉升，药易购涨超13%，百洋医药、人民同泰、华人健康、建发致新、漱玉平民跟涨。", "ctime": 1786590072, "time_str": "11:01:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260813/c678922284.shtml"}, {"id": "4950207", "title": "TrendForce：DDR5 16Gb (2Gx8) 4800/5600现货均价较上日上涨0.38%", "content": "TrendForce数据显示，8月13日内存颗粒DDR5 16Gb (2Gx8) 4800/5600现货均价较上日上涨0.38%，DDR4 16Gb (2Gx8) 3200现货均价较上日上涨0.42%，DDR4 8Gb (1Gx8) 3200现货均价较上日持平。", "ctime": 1786590014, "time_str": "11:00:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260813/c678922272.shtml"}, {"id": "4950205", "title": "重大资产重组，股价4天翻倍，蓝盾光电回应", "content": "8月13日，蓝盾光电再度“20CM”一字涨停开盘，实现4连板，自8月10日复牌以来，该股4个 布会。会上介绍，我国大气污染治理成绩喜人，但目前还不能有松口气、歇歇脚的想法，仍要保持耐心和定力。目前，新一轮空气质量持续改善行动方案正在抓紧制定，蓝天保卫战将重点在“更高、更准、更科学”上下功夫。(央视新闻)", "ctime": 1786589040, "time_str": "10:44:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260813/c678921882.shtml"}, {"id": "4950165", "title": "日本民众在东京集会反对修宪", "content": "针对日本高市早苗政府的修宪企图，日本各界持续强烈抗议并呼吁守护和平宪法。当地时间13日，日本民众在东京日比谷公园举行集会，反对修改宪法。(央视新闻)", "ctime": 1786588867, "time_str": "10:41:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260813/c678921761.shtml"}, {"id": "4950161", "title": "医疗服务概念板块持续拉升，南模生物涨停", "content": "医疗服务概念板块持续拉升，南模生物涨停，博济医药、新里程、澳洋健康此前涨停，万邦医药、百奥赛图跟涨。", "ctime": 1786588823, "time_str": "10:40:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260813/c678921732.shtml"}, {"id": "4950153", "title": "“十五五”时期应对气候变化将聚焦“五个重点”", "content": "国务院新闻办公室今天（13日）举行“开局起步‘十五五’”系列主题新闻发布会。会上介绍，“十五五”时期是实现碳达峰的决胜期，也是落实2035年国家自主贡献的关键期。生态环境部将聚焦“五个重点”，统筹推进应对气候变化工作。一是持续推动重点领域绿色低碳转型。二是加快推进全国碳市场建设。三是完善碳排放统计核算体系。四是全面提升气候韧性。五是积极推动应对气候变化国际合作。(央视新闻)", "ctime": 1786588741, "time_str": "10:39:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260813/c678921692.shtml"}, {"id": "4950151", "title": "美国ITC终止对Reebok、华米等企业智能可穿戴设备、系统及其组件337调查", "content": "据中国贸易救济信息网，8月12日，美国国际贸易委员会（ITC）发布公告称，对特定智能可穿戴设备、系统及其组件作出337部分终裁：对本案行政法官于2026年7月9日、10日作出的初裁不予复审，即基于双方和解，终止对Reebok、RILUK IPCO、The Original Fit Factory、Truconnect、Zepp Health、安徽华米信息科技有限公司、Zepp及Zepp North America的调查。", "ctime": 1786588690, "time_str": "10:38:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260813/c678921650.shtml"}, {"id": "4950149", "title": "现货白银失守65美元/盎司", "content": "现货白银失守65美元/盎司，日内跌0.58%。", "ctime": 1786588641, "time_str": "10:37:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260813/c678921608.shtml"}, {"id": "4950133", "title": "我国牵头制定！智慧城市数据利用顶层框架国际标准发布", "content": "国际标准化组织（ISO）和国际电工委员会（IEC）近日联合发布国际标准《信息技术 智慧城市数据利用 第1部分：框架》。该国际标准由我国专家担任项目负责人，联合韩国、加拿大、日本、澳大利亚、德国、哈萨克斯坦、津巴布韦、墨西哥等11个国家的专家共同制定完成，是我国在智慧城市国际标准化领域取得的又一项标志性成果，为构建全球智慧城市数据利用共识提供了顶层框架。该国际标准首次构建起智慧城市数据利用的统一框架，从数据可用、数据有用、数据易用、数据善用和数据赋能五大方面，系统界定了智慧城市数据利用的核心特征及内涵。通过将智慧城市数据利用视为有机整体，突破单一视角局限，有效填补了该领域综合性国际标准的空白。（央视新闻）", "ctime": 1786588264, "time_str": "10:31:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260813/c678921403.shtml"}, {"id": "4950127", "title": "MLCC概念走高，火炬电子涨停", "content": "MLCC概念走高，火炬电子涨停，三环集团、双星新材、博迁新材跟涨。", "ctime": 1786587988, "time_str": "10:26:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260813/c678921188.shtml"}, {"id": "4950125", "title": "“十五五”时期我国将构建更加精准、高效的现代化生态监管体系", "content": "国务院新闻办公室今天（13日）举行“开局起步‘十五五’”系列主题新闻发布会，会上介绍，“十五五”时期，生态环境部将进一步加大生态监管力度，着力构建更加精准、高效的现代化生态监管体系。“十五五”时期，将重点在三方面发力：生态状况评估工作“体系化”。系统开展全国、重点区域、自然保护地和生态保护红线等多尺度生态状况评估，全面掌握生态本底及变化趋势，检验生态保护和修复工作的成效。生态破坏问题发现和处理“精准化”。持续优化“卫片监管”，提高发现生态破坏问题的准确度。开展“绿盾”行动，严厉查处各类生态破坏违法违规问题。健全生态破坏事件分级判定体系，明确判定的标准依据、工作流程和处置要求，实现全流程规范化管理。生态监测监管“数智化”。深化卫星遥感、AI图像解译、环境DNA、声纹识别、大模型及智能体等新技术应用，推动国家生态保护与修复监管平台迭代升级。持续优化生态质量综合监测站和样地布局，提升生态质量和生物多样性监测能力。以科技赋能生态监管，让监管更精准、更高效、更智慧。（央视新闻）", "ctime": 1786587983, "time_str": "10:26:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260813/c678921184.shtml"}, {"id": "4950121", "title": "中国移动成立长三角智算科技公司", "content": "企查查APP显示，近日，中移长三角（芜湖）智算科技有限公司成立，法定代表人为李坤滋，注册资本为1亿元，经营范围包含人工智能应用软件开发；移动通信设备销售；物联网设备销售；互联网安全服务；大数据服务等。企查查股权穿透显示，该公司由中国移动通信有限公司间接全资持股。", "ctime": 1786587872, "time_str": "10:24:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260813/c678921125.shtml"}, {"id": "4950119", "title": "同比增长138% 全球16国将参加第二届世界人形机器人运动会", "content": "第二届世界人形机器人运动会将于8月22日在国家速滑馆“冰丝带”开幕，本届运动会由北京市人民政府、中央广播电视总台等联合主办。本届赛事共吸引了六大洲16个国家的666支队伍、2056台机器人同台竞技，队伍总量同比增长138%，机器人数量翻了两番。国际方面，美国、德国、日本等机器人赛队悉数登场，巴西还集结了五支机器人足球世界杯冠军队伍，组建起一支国家联队参赛。国内方面，157家企业、641支队伍、1975台机器人齐聚赛场，第一梯队企业基本全部到场，27所985高校参赛，国内队伍覆盖30个省、自治区、直辖市和特别行政区，实现“遍地开花”。赛项总数从首届26个拓展至51个，构建起全维度的技术“练兵场”。（央视新闻）", "ctime": 1786587769, "time_str": "10:22:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260813/c678921052.shtml"}, {"id": "4950117", "title": "平陆运河冲刺全线通航 广西已设立专项工作组推进工程收尾与运营筹备", "content": "平陆运河即将全线通航。平陆运河是西部陆海新通道的骨干工程，是新中国成立以来建设的第一条通江达海的运河工程。记者获悉，广西壮族自治区始终把确保九月如期、安全、高质量建成通航作为核心任务，高位统筹、全力冲刺；设立专项工作组，对工程收尾、运营管理筹备等任务实行清单化、精细化、闭环式管理，实行周调度，确保各项工作压茬推进、落地见效，并为实现“河中有水、水上有船、船里有货、货通八方”的目标系统部署工作推进举措。(人民财讯)", "ctime": 1786587741, "time_str": "10:22:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260813/c678921031.shtml"}, {"id": "4950111", "title": "LME铝主力合约跌超1%", "content": "LME铝主力合约跌超1%，现报3279.0美元/吨。", "ctime": 1786587545, "time_str": "10:19:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260813/c678920924.shtml"}, {"id": "4950109", "title": "滁河、沙颍河发生2026年第1号洪水", "content": "受降雨影响，长江下游支流滁河、淮河中游支流沙颍河分别发生2026年第1号洪水。长江下游支流滁河，湖北汉江支流清河，河南沙颍河及支流澧河、北汝河、沙河、颍河、康沟河、洪汝河支流洪河，新疆和田河支流玉龙喀什河等10条河流发生超警以上洪水，最大超警幅度0.05～3.68米。（央视新闻）", "ctime": 1786587408, "time_str": "10:16:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260813/c678920860.shtml"}, {"id": "4950105", "title": "上海：依法依规支持新产业新业态新技术领域突破关键核心技术“卡脖子”企业、优质未盈利科技型企业登 // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
