所拟决定终止公司股票及可转换公司债券上市交易。公司有权申请听证或者提出书面陈述和申辩。", "ctime": 1792151619, "time_str": "19:53:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261016/c680792206.shtml"}, {"id": "5407439", "title": "蓝宇股份：可转债申请于2026年10月16日获深交所受理", "content": "蓝宇股份公告，公司向不特定对象发行可转换公司债券申请于2026年10月16日获深交所受理。深交所核对后认为申请文件齐备，决定予以受理；该事项尚需通过深交所审核并获得证监会作出同意注册的决定后方可实施。", "ctime": 1792151489, "time_str": "19:51:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261016/c680792113.shtml"}, {"id": "5407427", "title": "拉卡拉：拟发行股份及支付现金收购高富信息控股权，发行价12.88元/股", "content": "拉卡拉公告，公司拟通过发行股份及支付现金方式，向海南塔米、林健、广州零界、广州维周、海南微尘等5名交易对方购买其持有的部分或全部高富信息股权，以取得高富信息控股权。标的审计、评估工作尚未完成，交易作价及具体收购比例尚未确定；发行价格为12.88元/股。本次交易不构成重组上市，尚需履行后续审议及审批程序。", "ctime": 1792151374, "time_str": "19:49:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261016/c680791811.shtml"}, {"id": "5407423", "title": "*ST广糖：公司收到行政处罚决定书并被罚款400万元", "content": "*ST广糖公告，公司此前因涉嫌信息披露违法违规被立案，并于2026年7月收到行政处罚事先告知书；2026年10月16日，公司及相关当事人收到广西证监局《行政处罚决定书》。决定认定公司2023年、2024年年度报告存在虚假记载，对公司责令改正、给予警告并处以400万元罚款。公司未触及重大违法强制退市情形，将在决定书作出之日起满十二个月后申请撤销其他风险警示。", "ctime": 1792151309, "time_str": "19:48:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261016/c680791766.shtml"}, {"id": "5407421", "title": "央行注销两张支付牌照", "content": "央行更新的支付业务许可公示信息显示，湖南蓝天支付有限公司、河南建业支付科技有限公司的支付牌照被正式注销，业务类型均为储值账户运营Ⅱ类。数据显示，央行自2011年签发首批第三方支付牌照以来，已累计发出271张牌照，如今超四成支付机构已经退场。（上海证券报）", "ctime": 1792151255, "time_str": "19:47:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261016/c680791716.shtml"}, {"id": "5407413", "title": "欧盟：“星链”对乌至关重要 欧洲暂无替代方案", "content": "欧盟外交与安全政策高级代表卡拉斯16日在布鲁塞尔表示，美国太空探索技术公司旗下的“星链”卫星通信系统对于乌克兰至关重要，而欧洲在短期内尚不具备替代这一能力的条件。在谈及美国对乌政策时，卡拉斯表示，欧盟正努力说服美国伙伴，如果希望结束俄乌冲突，就必须向俄罗斯方面施加压力。她坦言，目前欧盟与美国之间的协调“非常困难”。（新华社）", "ctime": 1792151085, "time_str": "19:44:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261016/c680791672.shtml"}, {"id": "5407403", "title": "错估震级9.9级　日本气象厅再开记者会解释", "content": "据日本广播协会报道，日本气象厅在16日下午第二次召开的记者会中解释，当天中午错误推测发生9.9级地震并发出相应警报，可能是震源位置推定错误所致。", "ctime": 1792150964, "time_str": "19:42:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261016/c680791651.shtml"}, {"id": "5407397", "title": "航天智造：预计2026年前三季度净利润同比下降67.00%～55.00%", "content": "航天智造公告，预计2026年前三季度归母净利润为2.15亿元～2.93亿元，2025年同期为6.51亿元，同比下降67.00%～55.00%；扣非净利润预计为1.97亿元～2.47亿元，2025年同期为6.17亿元，同比下降68.00%～60.00%。报告期内，受汽车产销量下降及行业竞争加剧影响，公司汽车零部件业务收入同比降低约20%；产品价格持续承压，业务盈利水平进一步降低，毛利率同比降低超过4个百分点。", "ctime": 1792150934, "time_str": "19:42:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261016/c680791633.shtml"}, {"id": "5407395", "title": "国家粮食和物资储备局：中国粮食安全根基持续夯实", "content": "国家粮食和物资储备局局长刘焕鑫在2026年世界粮食日和全国粮食安全宣传周主会场活动上介绍，全国粮食年产量连续两年超过1.4万亿斤，人均粮食占有量超过500公斤且高于世界平均水平，实现谷物基本自给、口粮绝对安全，中国粮食安全根基得到持续夯实。刘焕鑫表示，实施全谷物行动计划，要常态长效推进科普，普及全谷物知识，培育多种消费场景，进一步完善全谷物标准体系，为产业升级和消费选择提供支撑和服务。同时要在科技创新和产业提升上下功夫，培育科技创新平台，推进关键技术研发，创制符合我国谷物消费特点的全谷物食品，扎实推进粮食流通提质增效和粮油加工设备更新，积极培育全谷物龙头企业、产业集群，不断丰富全谷物产品供给。（新华社）", "ctime": 1792150890, "time_str": "19:41:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261016/c680791625.shtml"}, {"id": "5407353", "title": "圣诺生物：特利加压素注射液获注册证书，规格8.5ml:0.85mg", "content": "圣诺生物公告，全资子公司成都圣诺生物制药有限公司近日收到国家药监局签发的特利加压素注射液《药品注册证书》，规格为8.5ml:0.85mg。该药获批注册，用于治疗胃肠道和泌尿生殖系统的出血症状。", "ctime": 1792150429, "time_str": "19:33:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261016/c680791503.shtml"}, {"id": "5407351", "title": "ST佳缘：2026年收到证监会处罚决定并被罚600万元", "content": "ST佳缘公告，2026年10月16日，公司收到中国证监会《行政处罚决定书》。因信息披露违法违规，公司被责令改正、给予警告并处以600万元罚款；王进、朱伟华、柳絮、尹明君分别被罚300万元、200万元、200万元、150万元。处罚认定公司《招股说明书》中2019年、2020年财务数据及2021年和2022年年度报告内容存在虚假记载，公司判断相关行为触及股票交易被实施其他风险警示情形。", "ctime": 1792150421, "time_str": "19:33:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261016/c680791498.shtml"}, {"id": "5407337", "title": "四部门：组织30余家车企座谈 加强汽车产品研发测试验证管理", "content": "今天从工业和信息化部获悉，工业和信息化部、公安部、生态环境部、市场监管总局四部门组织30余家重点汽车生产企业开展座谈，加强汽车产品创新设计和研发测试验证管理。\n据了解，汽车生产企业应落实质量提升专项行动工作要求，坚决抵制非理性竞争，加强汽车产品创新设计和研发测试验证管理，守牢产品安全底线。重点包括：\n全面加强测试验证，增强研发测试验证能力，充分开展产品创新设计安全评估和研发测试验证，及时消除安全隐患。\n如实宣传产品创新设计的使用边界、限制条件和研发测试验证等情况，不得作虚假、夸大或引人误解的宣传，不得使用违反道路交通法规的场景来宣传产品功能，不得诱导驾驶人忽视安全驾驶责任等内容。\n工业和信息化部表示，下一步，将加快推进有关标准制修订，进一步提升安全基线要求，对重点汽车生产企业持续开展监督检查，依法依规严肃处理存在问题的生产企业，并向社会公开曝光，督促汽车生产企业加强汽车产品测试验证，坚决守牢产品安全底线，推动汽车产业高质量发展。（央视新闻）", "ctime": 1792150297, "time_str": "19:31:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261016/c680791409.shtml"}, {"id": "5407321", "title": "伊朗称新型武器装备投入使用", "content": "伊朗军队发言人阿克里米尼亚今天（10月16日）表示，伊朗已将新型武器装备投入使用，“伊朗的防御能力比美以伊战争时期更强大”。他指出，近几周，伊朗击落了数架美国无人机。在国防部的领导下，军队制定并实施了新的作战和装备计划，“大幅加强了全国的防御覆盖范围”。此外近一段时间以来，伊朗军队与伊朗伊斯兰革命卫队航空航天部队也进行了联合演习，以加强协调。(CCTV国际时讯)", "ctime": 1792150199, "time_str": "19:29:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261016/c680791373.shtml"}, {"id": "5407311", "title": "博硕科技：江苏摩锐投资有限公司、宿迁市鸿德轩投资合伙企业（有限合伙）减持计划实施完毕，分别减持1.83%、2.45%", "content": "博硕科技公告，公司于2026年6月25日披露减持股份预披露公告。近日，公司收到江苏摩锐投资有限公司、宿迁市鸿德轩投资合伙企业（有限合伙）的告知函，两方减持计划均已实施完毕。江苏摩锐合计减持309.93万股，占公司总股本的1.83%，实施期间为2026年8月6日至2026年10月15日；鸿德轩合计减持414.51万股，占公司总股本的2.45%，实施期间为2026年7月17日至2026年10月16日。", "ctime": 1792149871, "time_str": "19:24:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261016/c680791303.shtml"}, {"id": "5407309", "title": "ST佳缘：因虚减营业收入76.64万元被责令改正", "content": "ST佳缘公告，2026年10月16日，公司收到四川证监局行政监管措施决定书。因公司2024年度虚减营业收入76.64万元、虚减利润总额56.53万元，四川证监局对公司采取责令改正措施，并对王进、朱伟民、朱伟华、柳絮采取出具警示函措施。公司已与会计师事务所沟通，对相应年度财务会计报告进行了追溯更正。", "ctime": 1792149862, "time_str": "19:24:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261016/c680791301.shtml"}, {"id": "5407307", "title": "伊朗海军：一艘违规油轮在霍尔木兹海峡东部起火", "content": "当地时间16日，伊朗海军表示，数小时前，海军监视小组在持续监控霍尔木兹海峡东部海域时，发现并确认了一艘在禁航区内起火的违规油轮。该违规油轮关闭了导航追踪系统，试图穿越阿曼湾禁航区域。伊朗海军强调，在禁航区域无序航行将危及安全，并给其他船只带来诸多危险。（央视新闻）", "ctime": 1792149833, "time_str": "19:23:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261016/c680791290.shtml"}, {"id": "5407283", "title": "丁薛祥出席2026年世界职业技术教育发展大会开幕式并会见与会外国政要", "content": "2026年世界职业技术教育发展大会16日在天津开幕，中共中央政治局常委、国务院副总理丁薛祥出席并致辞。\n\n丁薛祥表示，职业教育是培养高素质技能人才的基础工程，在经济社会发展中具有举足轻重的地位和作用。习近平主席强调，要构建职普融通、产教融合的职业教育体系，大力培养大国工匠、能工巧匠、高技能人才。这些年，中国不断完善现代职业教育制度，拓宽青年成长成才路径，夯实产业发展人才支撑，深化国际交流合作，推动职业教育发展取得历史性成就、发生格局性变化。(外交部网站)", "ctime": 1792149354, "time_str": "19:15:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261016/c680791095.shtml"}, {"id": "5407277", "title": "截至2025年底 我国户外运动参与人数超5亿", "content": "国家体育总局今天发布《中国户外运动产业发展报告》(2025—2026年)，截至2025年底，我国户外运动参与人数超过5亿，户外运动相关产业总规模约3.17万亿元。户外运动场地设施基础加快巩固。截至2025年底，全国共有冰雪场地2626个，较“十三五”末增长39%，包括滑冰场地1723个、滑雪场地903个。全国健身步道18.2万个、总长度达43.03万公里，较“十三五”末分别增长104%和106%；全国拥有经营性攀岩场馆970家、自然岩壁攀岩场700多处、自然岩壁线路1.4万余条。“十四五”期间全国新增公共码头泊位2200个，水上运动场地设施呈现沿海集聚、内河湖区加快布局的扩增趋势。首批高质量户外运动目的地建设稳步推进，为提升户外运动品质提供了有力支撑，部分入选地区客流量、跨省到访量和驻留时长等增长特征明显。（央视新闻）", "ctime": 1792149341, "time_str": "19:15:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261016/c680791090.shtml"}, {"id": "5407261", "title": "国常会：对《中华人民共和国档案法实施条例》等14部行政法规的部分条款予以修改", "content": "据央视：李强主持召开国务院常务会议，会议决定，对《中华人民共和国档案法实施条例》等14部行政法规的部分条款予以修改，对《中华人民共和国港口间海上旅客运输赔偿责任限额规定》等4部行政法规予以废止。", "ctime": 1792149283, "time_str": "19:14:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261016/c680791068.shtml"}, {"id": "5407251", "title": "李强主持召开国务院常务会议，会议讨论并原则通过《中华人民共和国教师法（修订草案）》", "content": "据央视：李强主持召开国务院常务会议，会议讨论并原则通过《中华人民共和国教师法（修订草案）》。", "ctime": 1792149233, "time_str": "19:13:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261016/c680791050.shtml"}, {"id": "5407241", "title": "李强主持召开国务院常务会议，会议讨论并原则通过《中华人民共和国价格法（修正草案）", "content": "据央视：李强主持召开国务院常务会议，会议讨论并原则通过《中华人民共和国价格法（修正草案）》。", "ctime": 1792149206, "time_str": "19:13:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261016/c680791044.shtml"}, {"id": "5407239", "title": "李强主持召开国务院常务会议", "content": "李强主持召开国务院常务会议。会议指出，人工智能是影响未来发展的关键变量，要从我国产业体系完备、应用场景丰富、工程化能力强等实际出发，注重以落地应用牵引技术创新，不断深化拓展“人工智能+”行动。 （央视新闻）", "ctime": 1792149183, "time_str": "19:13:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261016/c680790999.shtml"}, {"id": "5407233", "title": "卫星化学：2026年第三季度净利润28.32亿元，同比增长180.03%", "content": "卫星化学公告，2026年第三季度营业收入157亿元，同比增长38.81%；归母净利润28.32亿元，同比增长180.03%；扣非净利润29.69亿元，同比增长121.28%。2026年前三季度营业收入464.14亿元，同比增长33.49%；归母净利润90.59亿元，同比增长141.24%；扣非净利润90.22亿元，同比增长112.89%。", "ctime": 1792149166, "time_str": "19:12:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn // 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
