const NEWS     = [{"id": "4483821", "title": "居然智家：与优必选仅签署框架协议，尚未签署实质性订单协议", "content": "居然智家公告，公司股票于2026年6月5日、6月8日连续两个交易日收盘价格涨幅偏离值累计达20%以上，属于股票交易异常波动。针对网络媒体将公司与优必选关联的传闻，公司澄清：2025年3月与优必选签署的战略合作协议为框架性协议，对双方均无强制约束力；截至公告披露日，公司尚未就该合作签署任何具有法律约束力的实质性订单协议，与优必选无业务往来及明确的业务合作安排，相关合作对营业收入、利润无实际贡献。此外，公司2026年第一季度实现营业收入25.23亿元，同比下滑23.82%；归母净利润6210.45万元，同比下滑70.65%；扣非净利润7414.71万元，同比下滑65.23%。", "ctime": 1780920205, "time_str": "20:03:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260608/c677301528.shtml"}, {"id": "4483637", "title": "中老两国央行续签相关合作文件", "content": "近日，在老挝人民革命党总书记、国家主席通伦访华期间，经国务院批准，中国人民银行与老挝人民民主共和国银行续签了《中国人民银行与老挝人民民主共和国银行人民币/老挝基普双边本币互换协议》。同时，两国央行还续签了《中国人民银行与老挝人民民主共和国银行关于加强金融创新、数字支付和法定数字货币合作的谅解备忘录》。上述合作文件的签署将有助于促进中老双边金融合作，深化两国经贸关系。(央行)", "ctime": 1780919847, "time_str": "19:57:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260608/c677301318.shtml"}, {"id": "4483615", "title": "多家央企上市公司发声，多家央企多措并举加强市值管理", "content": "央企加强市值管理、提高上市公司质量，是进一步深化国资国企改革的重要内容。近期，中核集团、中国电建、国家电网等多家央企举办上市公司投资者交流会、业绩说明会等，明确多措并举提高上市公司质量和投资价值，通过提升分红比例、做优做强主业、深化改革创新等，打好提质增效“组合拳”，进一步提振市场信心，更好回报投资者。中国企业改革与发展研究会研究员吴刚梁接受记者采访时表示，近年来央企控股上市公司市值管理工作实现制度化、常态化推进，确立了价值创造与价值实现并重的管理导向。接下来，除了常规性市值管理手段，当前央企尤其要将市值管理嵌入产业布局与科技创新全过程，通过逐步增加战新产业与未来产业的营收占比，实现上市资产的替换与焕新。（第一财经）", "ctime": 1780919713, "time_str": "19:55:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260608/c677301211.shtml"}, {"id": "4483613", "title": "AMD苏姿丰：AI行业仍处于“非常早期阶段”，计划增加20亿英镑对英投资", "content": "当地时间周一（8日），2026年伦敦科技周开幕。美国超威半导体公司（AMD）董事会主席兼首席执行官（CEO）苏姿丰在大会主论坛上表示，尽管人工智能（AI）过去几年取得突破性进展，但行业整体仍处于“非常早期阶段”。她同时宣布，AMD计划未来五年增加在英国的投资，总规模最高可达20亿英镑，以扩大人工智能研发投入、深化科研合作并支持本地创新生态发展。（第一财经）", "ctime": 1780919688, "time_str": "19:54:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "sour 的高端MLCC询盘需求明显增加。公司是村田全球主要授权分销商。近期公司观察到客户下单增加，开始拉货、主动补库存。对部分缺货的型号，公司优先满足大客户的采购需求。", "ctime": 1780919152, "time_str": "19:45:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260608/c677301006.shtml"}, {"id": "4483503", "title": "荣昌生物：注射用泰它西普用于治疗干燥综合征的新适应症已获批上市", "content": "荣昌生物公告，公司已收到国家药品监督管理局核准签发的《药品注册证书》。注射用泰它西普（代号：RC18，商品名：泰爱 ，批文编号：国药准字S20210008，证书编号：2026S01909）用于治疗干燥综合征（干燥病）的新适应症已获批上市。", "ctime": 1780919056, "time_str": "19:44:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260608/c677300980.shtml"}, {"id": "4483453", "title": "中国加入港口国措施协定首年履约情况在沪公布", "content": "《关于预防、制止和消除非法、不报告、不管制捕鱼的港口国措施协定》全球实施十周年中国主题活动近日在上海举行。港口国措施协定中国国家联络点代表介绍中国加入协定一年来主要履约情况。据介绍，中国加入港口国措施协定一年来，认真履行各项义务要求，建设制度体系，建立多部门工作协调机制，指定国家联络点，完善法律保障，印发工作意见；规范港口检查，完成第一批23个港口指定工作，组织开展涉渔外国籍船舶港口国检查，指导中国籍远洋渔船接受其他港口国的检查；参与国际合作，参加港口国措施协定缔约方大会和相关国际会议，积极参与规则讨论，中国专家被提名为港口国措施协定可持续运行工作组亚洲区代表；开展履约培训，举办港口国措施协定国际研讨会，提升履约能力；加强港口国措施协定履约宣传，实施相关工作扎实起步。（新华社）", "ctime": 1780918885, "time_str": "19:41:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260608/c677300928.shtml"}, {"id": "4483379", "title": "广药集团在哈萨克斯坦、乌兹别克斯坦与多方达成合作意向", "content": "记者获悉，广药集团党委书记、董事长李小军近日随香港特区行政长官李家超率领的商贸代表团访问哈萨克斯坦和乌兹别克斯坦。访问期间，广药集团签署及达成多项合作协议：旗下白云山汉方与科伦（哈萨克斯坦）药业签署抗肿瘤原料药合作协议；白云山天心制药与乌兹别克斯坦药企ADN Pharm-Sanoat签署合作备忘录，涉及药品注册及本地运营，并与OMON MED PHARM达成联合建厂及协同研发合作意向；同时，广药集团与哈萨克斯坦主权财富基金（Samruk-Kazyna）、中乌物流公司分别就产业投资、冷链运输及保税仓储等业务达成合作意向。据了解，广药集团计划在2026年至2030年期间，投入200亿元用于科研创新、300亿元用于产业投资，其中中亚被列为重要投资区域。（财联社）", "ctime": 1780918454, "time_str": "19:34:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260608/c677300748.shtml"}, {"id": "4483359", "title": "菲律宾和印尼宣布解除海啸预警", "content": "6月8日早些时候，中国地震台网正式测定，菲律宾群岛地区发生7.9级地震。随后菲律宾火山地震研究所以及印尼气象、气候和地球物理局分别发布海啸预警。8日下午，菲火山地震研究所发布公告称，经过持续监测分析，发生的海啸波不足以造成严重破坏，因此宣布取消当天发布的海啸预警。印尼气象、气候和地球物理局最新通报称，目前海啸预警已解除。（央视新闻）", "ctime": 1780918360, "time_str": "19:32:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260608/c677300709.shtml"}, {"id": "4483327", "title": "诺唯赞：控股股东诺唯赞投资拟增持，金额不低于1.15亿元", "content": "诺唯赞公告，控股股东南京诺唯赞投资管理有限公司拟自2026年6月9日起6个月内，通过集中竞价方式增持公司股份，增持总金额不低于1.15亿元且不高于2.25亿元，资金来源为自有资金和自筹资金（包括股票增持专项贷款）。上海浦东发展银行南京分行已向诺唯赞投资出具《贷款承诺函》，提供额度不超过2亿元、期限3年的专项贷款。本次增持不设置价格区间，不触及要约收购，不会导致公司控股股东及实际控制人发生变化。", "ctime": 1780918244, "time_str": "19:30:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260608/c677300681.shtml"}, {"id": "4483305", "title": "美光科技美股盘前涨超6%", "content": "美光科技美股盘前涨超6%，现报916.985美元。", "ctime": 1780918202, "time_str": "19:30:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260608/c677300647.shtml"}, {"id": "4483303", "title": "韩国科学部长称，英伟达CEO黄仁勋承诺优先向韩国供应Vera Rubin", "content": "韩国科学部长称，英伟达CEO黄仁勋承诺优先向韩国供应Vera Rubin。(蓝鲸新闻)", "ctime": 1780918197, "time_str": "19:29:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260608/c677300644.shtml"}, {"id": "4483299", "title": "小米集团于公开市场增持金山软件，持股比例增至5.39%", "content": "6月8日，据港交所权益披露信息，小米集团于公开市场增持金山软件，截至当天收盘，小米集团持股比例增至5.39%。这一增持间接带来雷军个人在金山软件的持股比例增加。值得注意的是，雷军的股权变动并非其个人账户买入金山软件，而是作为小米集团实控人，因小米集团对金山软件的增持客观上带来的变动。", "ctime": 1780918152, "time_str": "19:29:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260608/c677300624.shtml"}, {"id": "4483297", "title": "市场监管总局组织食品安全监督抽检 不合格样品已启动核查处置", "content": "记者今天了解到，市场监管总局近期组织食品安全监督抽检1678批次样品，检出32批次样品不合格。对抽检发现的不合格食品，有关省级市场监管部门已组织开展核查处置。（央视新闻）", "ctime": 1780918135, "time_str": "19:28:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260608/c677300620.shtml"}, {"id": "4483269", "title": "通达股份：预中标2.2亿元国家电网等项目", "content": "通达股份公告，公司近期在国家电网有限公司2026年特高压项目第二次材料公开招标采购、2026年西北西藏区域第一次联合采购以及内蒙古电力（集团）有限责任公司2026年固定资产投资项目物资采购中，被推荐为中标候选人，预中标物资总价值共计2.2亿元，约占公司2025年度营业总收入的2.76%。", "ctime": 1780917986, "time_str": "19:26:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260608/c677300578.shtml"}, {"id": "4483255", "title": "泰和新材：对位芳纶在数据中心无直接应用，光纤光缆领域收入占比不足10%", "content": "泰和新材公告，公司股票交易价格连续三个交易日（2026年6月4日、5日、8日）收盘价涨幅偏离值累计超过20%。公司关注到部分投资者对对位芳纶在光纤光缆及数据中心中的应用比较关注，经核实：2025年，公司泰普龙®对位芳纶及其制品在光纤光缆领域的收入占主营业务收入的比例不足10%，2026年1-5月份占比未发生明显变化；公司产品在数据中心中没有直接应用；公司对位芳纶的产能利用率尚处于较低水平，今年1-5月产品售价与上年同期比没有出现明显变化。", "ctime": 1780917968, "time_str": "19:26:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260608/c677300573.shtml"}, {"id": "4483191", "title": "中巨芯：高纯六氟化钨尚未签署新的大额订单，产能600吨暂无扩产计划", "content": "中巨芯公告，公司股票连续3个交易日（2026年6月4日、5日、8日）收盘价格涨幅偏离值累计达到30%，属于股票交易异常波动。经公司自查，有媒体报道海外六氟化钨供应链紧张，国内六氟化钨出口量价齐升。公司对此澄清：截至目前，公司高纯六氟化钨尚未签署新的任何具有法律约束力的长期或大额实质性订单协议；该产品由子公司博瑞中硝生产（博瑞电子持股51%）；公司六氟化钨目前产能为600吨，暂无扩产计划；受上游钨材料价格上涨影响，原材料采购成本增加。公司2025年度归母净利润为-1659.62万元，2026年第一季度归母净利润为637.67万元（未经审计）。公司不存在应披露而未披露的重大信息。", "ctime": 1780917748, "time_str": "19:22:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260608/c677300532.shtml"}, {"id": "4483159", "title": "密尔克卫：拟将募投项目节余资金5629.4万元永久补充流动资金", "content": "密尔克卫公告，拟将募投项目节余资金5629.4万元永久补充流动资金。2020年非公开发行股票募投项目“宁波慎则化工供应链管理有限公司项目”、“广西慎则物流有限公司仓储物流项目”、“密尔克卫（烟台）供应链管理服务有限公司现代化工供应链创新与应用配套设施项目”、“扩建20000平方米丙类仓库项目”已达到预定可使用状态；2022年公开发行可转换公司债券募投项目“收购上海市化工物品汽车运输有限公司100%股权及转让方对标的公司1600万债权项目”、“超临界水氧化及配套环保项目”、“徐圩新区化工品供应链一体化服务基地A地块”、“镇江宝华物流有限公司改扩建普货仓库建设”已达到预定可使用状态。", "ctime": 1780917626, "time_str": "19:20:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260608/c677300505.shtml"}, {"id": "4483129", "title": "五粮液：董事会同意免去曾从钦董事职务 其担任的董事长等职务自董事解任生效之日起自动解除", "content": "五粮液公告称，根据宜宾市人民政府相关文件，经提名委员会审核、公司董事会提名，同意免去曾从钦董事职务，曾从钦担任的董事长、董事会专门委员会主任委员及委员职务，自董事解任生效之日起自动解除；同意增补邓敏为公司第七届董事会非独立董事候选人，任期自公司股东会审议通过之日起至公司第七届董事会任期届满之日止。", "ctime": 1780917486, "time_str": "19:18:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260608/c677300478.shtml"}, {"id": "4483127", "title": "中国新西兰外交部举行亚洲事务磋商", "content": "近日，外交部亚洲司司长刘劲松在北京同新西兰外交贸易部副秘书长毛瑞举行了中新外交部亚洲事务磋商。(外交部网站)", "ctime": 1780917481, "time_str": "19:18:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260608/c677300474.shtml"}, {"id": "4483117", "title": "中重科技：澄清不涉及机器人本体及零配件生产，不存在商业航天板块业务", "content": "中重科技公告，公司股票于2026年6月5日、6月8日连续2个交易日收盘价格涨幅偏离值累计超过20%，属于股票交易异常波动。公司就市场关注的机器人概念澄清，公司不涉及机器人及零配件的生产制造，控股子公司中重灵希机器人科技(江苏)有限公司亦不生产机器人本体及零配件，截至2026年一季度未实现任何营业收入；就商业航天概念澄清，公司不存在商业航天板块业务，相关领域投资金额极低。公司2025年度实现营业收入3.8亿元，同比下降60.23%；归属于上市公司股东的净利润为-2202.74万元，同比下降139.09%。", "ctime": 1780917468, "time_str": "19:17:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260608/c677300449.shtml"}, {"id": "4483101", "title": "伊朗称对以色列军事打击告一段落", "content": "伊朗武装部队哈塔姆·安比亚中央司令部最新宣布，“对以色列的军事打击行动告一段落”。 (CCTV国际时讯)", "ctime": 1780917433, "time_str": "19:17:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260608/c677300422.shtml"}, {"id": "4483089", "title": "中国新城市：与中兴发展法国签战略合作协议，拟开发约4万平方米AI数据中心", "content": "中国新城市公告，公司于2026年6月6日与中兴发展法国公司订立不具法律约束力的战略合作协议，内容有关本集团拟于法国普瓦捷中兴发展法国所拥有之科技园内合作开发建设人工智能数据中心项目（AIDC项目）。根据协议，本集团拟开发建设约4万平方米高标准AI数据中心，项目当前已具备15-20兆瓦电力负荷。双方将共同开发欧洲及全球AI客户资源，中兴发展法国保留参与项目建设与运营之投资权利。", "ctime": 1780917386, "time_str": "19:16:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260608/c677300405.shtml"}, {"id": "4483075", "title": "阿斯麦美股盘前涨超4%", "content": "阿斯麦美股盘前涨超4%，现报1708.04美元。", "ctime": 1780917334, "time_str": "19:15:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260608/c677300397.shtml"}, {"id": "4483053", "title": "顺丰同城：拟以4亿港元回购公司股份", "content": "顺丰同城公告，公司董事会已决定动用股份购回授权，视乎市场情况，不时于公开市场购回H股，动用资金上限为4亿港元。购回的H股将适时注销，资金来源为自有资金。建议股份购回实施期至下届年度股东会结束时、相关决议案通过后12个月届满之日或股东撤回授权之日（以最早者为准）。", "ctime": 1780917261, "time_str": "19:14:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260608/c677300366.shtml"}, {"id": "4483055", "title": "中国驻伊朗大使馆提醒中国公民暂勿前往伊朗", "content": "中国驻伊朗大使馆8日发布安全提醒说，鉴于当前复杂严峻形势，中国驻伊朗使领馆再次提醒在伊中国公民加强安全防范和应急准备，及时向驻伊使领馆报备。同时，中国公民暂勿前往伊朗。提醒说，目前，伊首都德黑兰及西部地区空域处于关闭状态，在伊中国公民可重点关注伊马汉航空离伊航班恢复情况。同时，综合考虑口岸情况和当地及周边安全等因素，目前在伊中国公民可通过前往亚美尼亚、土耳其、土库曼斯坦的陆路通道离伊。（新华社）", "ctime": 1780917261, "time_str": "19:14:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260608/c677300367.shtml"}, {"id": "4483039", "title": "国际原油期货涨幅回落至3%以内", "content": "国际原油期货涨幅回落至3%以内，WTI原油期货价格涨2.89%，报93.161美元/桶；布伦特原油期货价格涨2.62%，报95.525美元/桶。", "ctime": 1780917141, "time_str": "19:12:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260608/c677300333.shtml"}, {"id": "4483023", "title": "美股纳斯达克100指数期货涨超1%", "content": "美股纳斯达克100指数期货涨超1%，标普500指数期货涨0.59%，道琼斯指数期货涨0.15%。", "ctime": 1780917070, "time_str": "19:11:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260608/c677300288.shtml"}, {"id": "4483009", "title": "锐新科技：拟收购德恒装备51%股权，交易价格5亿元", "content": "锐新科技公告，拟通过发行股份及支付现金的方式购买德恒装备51%股权，交易价格5亿元。以2025年12月31日为基准日，收益法评估德恒装备股东全部权益价值9.8亿元，增值率140.99%。本次发行股份购买资产的股票发行价格为18.08元/股，发行数量1505.23万股。同时，公司拟向包括控股股东开投领盾在内的不超过35名特定对象发行股份募集配套资金不超过2.48亿元，用于支付本次交易的现金对价及中介机构费用等。本次交易完成后，上市公司2025年度归属于母公司股东净利润备考数据将由3259.77万元增至7108.26万元，基本每股收益由0.20元提升至0.37元。本次交易尚需经黄山市国资委备案、国资监管机构批准、股东会审议、深交所审核及中国证监会注册等程序。", "ctime": 1780916999, "time_str": "19:09:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260608/c677300023.shtml"}, {"id": "4483003", "title": "*ST华闻：公司诉林广茂股权转让纠纷案一审判决", "content": "*ST华闻公告，公司诉林广茂股权转让纠纷案一审判决。海口中院判决林广茂返还股权转让款5000万元及资金使用费1204.38万元，支付逾期付款违约金（计算方法：以62,043,835.62元为基数，自2023年11月14日起至债务实际清偿之日止，按每日万分之二计算），支付律师服务费50000元及保函保险费23340元。华闻集团对林广茂质押的江苏随易信息科技有限公司6.42%股权的折价或者拍卖、变卖所得价款在林广茂欠付的上述债务范围内享有优先受偿权。驳回华闻集团的其他诉讼请求及林广茂的全部反诉请求。", "ctime": 1780916978, "time_str": "19:09:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260608/c677300003.shtml"}, {"id": "4482975", "title": "方大集团：首次回购0.26%公司股份，成交总金额为996.46万元", "content": "方大集团公告，2026年6月8日，公司首次通过股票回购专用证券账户以集中竞价交易方式回购公司股份281万股，占公司总股本的0.26%，最高成交价为3.59元/股，最低成交价为3.51元/股，成交总金额为996.46万元（不含交易费用）。", "ctime": 1780916800, "time_str": "19:06:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260608/c677299790.shtml"}, {"id": "4482959", "title": "弘信电子：调整2024年度向特定对象发行股票方案 募集资金金额调整为不低于2.18亿元", "content": "弘信电子公告，调整2024年度向特定对象发行股票方案。定价基准日调整为发行期首日，发行价格不低于定价基准日前20个交易日公司股票交易均价的80%。募集资金金额调整为不低于2.18亿元且不超过5.18亿元，扣除发行费用后将全部用于补充流动资金。除上述调整外，本次发行方案其他内容不变。", "ctime": 1780916735, "time_str": "19:05:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn const META     = {"update_time": "2026-06-08 20:06:33", "sentiment_score": 56.026785714285715, "agents": []};

// 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
