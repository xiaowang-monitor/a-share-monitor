.score-bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s; }
.up { color: var(--red); }
.down { color: var(--green); }
.pulse { animation: pulse 2s infinite; }
@keyframes pulse {

  50% { opacity: 0.5; }

https://news.10jqka.com.cn/20260602/c677160914.shtml"}, {"id": "4444931", "title": "今世缘百亿品牌拟年内推出重磅单品“三开”，时隔22年补足空白价格带", "content": "今世缘旗下的百亿营收品牌“国缘”，拟于年内推出重磅大单品“三开”。该产品将补足“国缘”在300元-400元的空白价格带，整体地位位于核心产品对开与四开之间。（新浪财经）", "ctime": 1780398707, "time_str": "19:11:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260602/c677160912.shtml"}, {"id": "4444915", "title": "再升科技：公司针对相关市场主体未经事实核查编造虚假内容 已报案处理", "content": "再升科技公告，公司关注到相关市场主体未经事实核查编造虚假内容、误导资本市场，公司已固定全部涉案证据，必要时将向监管部门、公安机关报案处理，依法追究相关方的法律责任。公司相关信息以指定信息披露平台刊载的公告内容为准，敬请广大投资者理性甄别市场信息，警惕不实传言误导，审慎注意投资风险。", "ctime": 1780398616, "time_str": "19:10:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260602/c677160857.shtml"}, {"id": "4444891", "title": "NVIDIA Spectrum-X以太网硅光技术现已全面量产 较传统收发器的网络能效提升5倍", "content": "NVIDIA Spectrum-X以太网硅光技术现已全面量产，新一代 Spectrum-X交换机基于光电一体封装技术（CPO）构建，支持NVIDIA Vera Rubin平台在数据中心进行横向扩展和跨区域扩展部署AI工厂。Spectrum-X以太网硅光技术是NVIDIA全栈协同设计的典范代表之一。与使用传统收发器的网络相比，Spectrum-X以太网硅光技术可实现能效提升5倍，AI正常运行时间提升5倍，部署时间快1.3倍。（财联社）", "ctime": 1780398457, "time_str": "19:07:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260602/c677160719.shtml"}, {"id": "4444843", "title": "强脑科技预计今年灵巧手的销量将激增", "content": "6月2日，脑机接口公司强脑科技预计今年其灵巧手的销量将激增。强脑科技合伙人何熙昱锦接受采访时透露，数十家中国的机器人公司包括宇树和乐聚都在购买强脑科技的灵巧手装置。（澎湃）", "ctime": 1780398269, "time_str": "19:04:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260602/c677160651.shtml"}, {"id": "4444763", "title": "国家邮政局局长赵冲久赴浙江调研", "content": "6月1日至2日，国家邮政局党组书记、局长赵冲久带队赴浙江省义乌市、杭州市，督促指导邮政管理系统树立和践行正确政绩观学习教育，调研行业重点工作。在义乌，赵冲久一行实地考察了义乌市全球数贸中心、国际商贸城一区市场和云驿小镇，前往义乌邮政管理局听取工作汇报，看望慰问干部职工。赵冲久强调，要加强行业监管，严格执法，督促企业合规经营，整治“内卷式”竞争，营造公平竞争市场环境。要加强党建引领，深化“两个覆盖”工作成果，发挥基层党支部战斗堡垒作用，完善快递员诉求直通车机制，强化“友好场景”建设做好凝聚服务。要坚持有效市场和有为政府相结合，充分发挥市场在资源配置中的决定性作用，更好发挥政府作用，为经济社会发展贡献行业力量。（人民财讯）", "ctime": 1780398077, "time_str": "19:01:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260602/c677160545.shtml"}, {"id": "4444647", "title": "芯动联科：电子院及微电子院拟合计减持不超过2.987%股份", "content": "芯动联科公告，股东北方电子研究院有限公司（简称电子院）持有公司2.7275%股份，一致行动人安徽北方微电子研究院集团有限公司（简称微电子院）持有13.4407%股份。电子院基于自身资金需求，拟于2026年6月25日至2026年9月24日通过集中竞价或大宗交易减持不超过400万股（占0.9957%）；微电子院拟同期减持不超过800万股（占1.9913%）。", "ctime": 1780397890, "time_str": "18:58:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260602/c677160451.shtml"}, {"id": "4444635", "title": "呈和科技：全资子公司拟投资不超13亿元建设高频高速电子材料及高端助剂项目", "content": "呈和科技公告，公司全资子公司广东呈和电子材料有限公司拟在广东省东莞市投资建设高频高速电子材料及高端助剂项目，项目总投资额不超过13亿元（含土地出让金、建筑物、构筑物及附属设施、设备投资等），资金来源包括但不限于募集资金、自有资金、银行贷款。项目规划聚苯醚树脂2500吨、高频高速阻燃剂2500吨、高端合成水滑石20000吨，总用地面积14.1万平方米。本次投资已获公司第三届董事会第十七次会议审议通过，无需提交股东会审议。", "ctime": 1780397759, "time_str": "18:55:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260602/c677160393.shtml"}, {"id": "4444601", "title": "千里科技：5月汽车整车产量8921辆同比增长36.14%，销量8210辆同比增长2.10%", "content": "千里科技公告，2026年5月汽车整车产量8921辆，同比增长36.14%，销量8210辆，同比增长2.10%。本年累计产量35458辆，同比增长95.10%，本年累计销量35186辆，同比增长22.92%。其中燃油汽车本月产量8597辆，同比增长60.15%，销量7358辆，同比增长60.73%；新能源汽车本月产量324辆，同比下降72.66%，销量852辆，同比下降75.40%。", "ctime": 1780397591, "time_str": "18:53:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260602/c677160344.shtml"}, {"id": "4444599", "title": "中英战略对话聚焦合作与共赢", "content": "中共中央政治局委员、外交部长王毅2日在北京同英国外交大臣库珀举行第十一次中英战略对话。王毅表示，今年初，斯塔默首相成功访华，两国领导人就中英发展长期稳定的全面战略伙伴关系达成重要共识。当前，双方各领域交往合作全面恢复，逐步进入正轨，值得倍加珍惜。我们要落实好两国领导人重要共识，加强高层交往，推动形成更多务实可见的成果。王毅表示，希望英方为中资企业提供公平、公正、非歧视的营商环境，合理界定安全边界，为两国发展关系、深化合作营造良好氛围。（新华社）", "ctime": 1780397587, "time_str": "18:53:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260602/c677160343.shtml"}, {"id": "4444595", "title": "大唐发电：截至目前公司以火力发电为主，尚无已投运算电协同项目", "content": "大唐发电公告，2026年6月2日，公司股票价格连续五个交易日内日收盘价格累计涨幅28.21%，偏离大盘指数29.91%，存在交易风险。公司自2026年5月6日至6月2日期间发布了多次异常波动公告，截至目前公司以火力发电为主，尚无已投运算电协同项目，提醒投资者注意市场交易风险，理性投资。", "ctime": 1780397581, "time_str": "18:53:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260602/c677160341.shtml"}, {"id": "4444593", "title": "雅化集团：拟申请广州期货交易所氢氧化锂指定交割厂库", "content": "雅化集团6月2日公告，公司董事会审议通过议案，同意公司向广州期货交易所申请氢氧化锂指定交割厂库的资质，授权公司经营管理层向广期所提交申请材料，并具体办理相关事宜。公司本次申请广州期货交易所氢氧化锂指定交割厂库有利于公司将现货市场、期货市场、交割厂库三者有机结合，进一步增强公司的抗风险能力和市场竞争力，将对公司未来拓展业务渠道和提高盈利水平产生积极作用。（人民财讯）", "ctime": 1780397578, "time_str": "18:52:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260602/c677160339.shtml"}, {"id": "4444501", "title": "兆易创新：出资4亿元参与的私募基金完成备案", "content": "兆易创新公告，公司于2026年3月3日董事会审议通过以自有资金出资4亿元认购上海石溪兆易智芯创业投资合伙企业（有限合伙）的基金份额。2026年6月2日，公司收到管理人通知，该基金已在中国证券投资基金业协会完成备案手续，并取得《私募投资基金备案证明》，备案日期为2026年6月1日，备案编码SAMA40。", "ctime": 1780397266, "time_str": "18:47:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260602/c677160234.shtml"}, {"id": "4444499", "title": "“扬子江”轮在沪交付 高效绿色改装助力全球船舶低碳升级", "content": "6月2日，全球最大独立集装箱船东Seaspan 10K系列甲醇双燃料改装项目首制船“SEASPAN YANGTZE”（“扬子江”轮），在上海中远海运重工提前完成全部改造工程，顺利交付运营。这是企业交付的全球最大独立集装箱船东首个甲醇双燃料EPC（设计、采购、建造）总包项目，标志着我国船舶工业在绿色船舶改装领域从服务国内客户迈向接轨国际高端船东的跨越。（央视新闻）", "ctime": 1780397259, "time_str": "18:47:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260602/c677160227.shtml"}, {"id": "4444487", "title": "金龙汽车：控股股东拟首次增持0.8亿元至1.5亿元", "content": "金龙汽车公告，截至2026年6月2日，控股股东福汽集团首次通过集中竞价增持31万股，金额422.19万元，占公司总股本0.0432%。根据已披露计划，福汽集团拟于2026年5月22日～2026年11月21日继续增持，金额0.8亿元（含）～1.5亿元（含），增持比例不超过公司总股本的2%。目前累计增持数量31万股，金额422.19万元，占0.0432%。", "ctime": 1780397165, "time_str": "18:46:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260602/c677160191.shtml"}, {"id": "4444475", "title": "阿富汗帕尔万省一客车翻车 致8死16伤", "content": "当地时间6月2日，阿富汗帕尔万省警方发言人表示，该省一辆客车当天上午在行驶过程中偏离道路、发生翻车事故，导致包括4名儿童在内8人死亡，另有16人受伤。（央视新闻）", "ctime": 1780397135, "time_str": "18:45:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260602/c677160187.shtml"}, {"id": "4444471", "title": "上海制定生活垃圾分类提质增效三年行动计划", "content": "记者从2日举行的上海市人民政府新闻发布会上获悉，上海制定了《上海市生活垃圾分类提质增效三年行动计划（2026—2028年）》。据介绍，此次制定的三年行动计划主要目标是：到2028年，生活垃圾回收利用率超48%，低价值可回收物占可回收物总量25%以上，湿垃圾分出量占比超35%、分出纯净度达95%左右。上海市人民政府副秘书长张玉鑫介绍，上海计划用三年时间集中实施一系列政策举措，进一步巩固生活垃圾分类工作成果，推动绿色低碳转型发展。为此，围绕推动源头减量、提升分类实效、健全回收体系、强化共建共治、完善管理机制等方面制定18项重点任务。（新华社）", "ctime": 1780397129, "time_str": "18:45:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260602/c677160179.shtml"}, {"id": "4444457", "title": "银宝山新：股东布拉德已减持0.61%股份", "content": "银宝山新公告，持股5%以上股东淮安布拉德投资发展有限公司于2026/5/14-2026/6/2通过大宗交易减持300万股，减持均价7.37元/股，占总股本0.61%，减持计划已实施完毕；减持后持股4564.76万股，占总股本9.21%；此前预披计划期限为2026年4月30日至2026年7月29日，拟减持股份数量及比例均未突破原计划上限。", "ctime": 1780397112, "time_str": "18:45:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260602/c677160165.shtml"}, {"id": "4444431", "title": "*ST清越：公司可能被实施重大违法强制退市，于2026年5月12日起被实施退市风险警示", "content": "*ST清越公告，公司股票交易连续2个交易日内（2026年6月1日、2026年6月2日）收盘价格涨幅偏离值累计达到30%，属于股票交易异常波动。公司于2026年5月8日收到中国证监会《行政处罚事先告知书》，可能被实施重大违法强制退市。公司A股股票于2026年5月12日起被实施退市风险警示。", "ctime": 1780396890, "time_str": "18:41:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260602/c677160093.shtml"}, {"id": "4444407", "title": "全线通水 平陆运河迈入通航冲刺阶段", "content": "平陆运河工程全线通水，标志着这一重大水利工程进入通航的关键阶段。工程的推进对于区域经济发展、交通运输以及水资源管理具有重要意义。相关部门正加快施工进度，确保项目按计划顺利实施，为后续通航和运营奠定坚实基础。（新华社）", "ctime": 1780396726, "time_str": "18:38:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260602/c677160042.shtml"}, {"id": "4444405", "title": "财政部将发行2026年记账式贴现（三十三期）国债", "content": "财政部发布通知，拟发行2026年记账式贴现（三十三期）国债。本期国债为期限28天的贴现债，发行数量为200亿元，通过竞争性招标确定发行价格。招标时间为2026年6月3日上午10:35至11:35，采用修正的多重价格招标方式，标的为价格。中标承销团成员需于2026年6月4日前将发行款缴入财政部指定账户。本期国债将于6月8日起上市交易。（财政部）", "ctime": 1780396720, "time_str": "18:38:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260602/c677160040.shtml"}, {"id": "4444389", "title": "昊海生科：控股子公司三焦点人工晶状体产品获得医疗器械注册证", "content": "昊海生科公告，控股子公司河南赛美视生物科技有限公司于近日收到国家药品监督管理局颁发的三焦点人工晶状体产品的《中华人民共和国医疗器械注册证》。该产品适用于成人白内障患者无晶体眼的视力矫正，注册证有效期为2026年6月1日至2031年5月31日。本产品采用独家专利技术，定制化每一级衍射环的高度与光能分布，并采用精准滤波技术，进一步提升视觉质量和光能利用率。", "ctime": 1780396545, "time_str": "18:35:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260602/c677159984.shtml"}, {"id": "4444373", "title": "日本防卫省：以冲绳为前沿强化“战时医疗”体制", "content": "日本防卫省相关负责人表示，防卫省正以冲绳为前沿，强化“战时医疗”体制建设，推进多家自卫队医院扩充病床、强化医疗功能、构建医疗后送体制等。防卫省将宫古岛、石垣岛、与那国岛等设想为前沿地区，正构建从前线救护、野战医院、那霸医院向九州和本州地区转运的医疗后送体制。（央视新闻）", "ctime": 1780396454, "time_str": "18:34:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260602/c677159933.shtml"}, {"id": "4444367", "title": "山东黄金：拟确认公允价值变动损失7.05亿元", "content": "山东黄金公告，全资子公司山金金控拟参与东吴证券收购东海证券股权交易，并对其持有的东海证券股权确认公允价值变动损失。山金金控共持有东海证券18.71%的股份，本次拟向东吴证券出售其持有的14.13%的股份，转让价格为19.45亿元。根据初步测算，山金金控将对持有的东海证券18 // 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
