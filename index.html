.score-bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s; }

.down { color: var(--green); }

ime": 1795772064, "time_str": "17:34:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261127/c682310218.shtml"}, {"id": "5774811", "title": "神州数码：已就人保项目签署采购合同，总价款8662.4万元", "content": "神州数码公告，公司此前于2026年10月22日披露下属控股子公司神州鲲泰收到人保集团核心设备采购项目（人保财险2026年第三批次）中标通知书。近日，公司已收到双方签字盖章的采购合同，合同标的为二路机架服务器-配置3（鲲鹏）40台，总价款3161.6万元（含税）；二路机架服务器-配置4（鲲鹏）120台，总价款5500.8万元（含税）。交易对方为中国人民财产保险股份有限公司，与公司不存在关联关系。", "ctime": 1795772011, "time_str": "17:33:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261127/c682310167.shtml"}, {"id": "5774803", "title": "阿里巴巴美股盘前涨超5%", "content": "阿里巴巴美股盘前涨超5%，现报90.6美元。", "ctime": 1795771992, "time_str": "17:33:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261127/c682310139.shtml"}, {"id": "5774801", "title": "海南矿业：控股股东复星高科协议转让5%股份过户完成", "content": "海南矿业公告，公司控股股东复星高科此前与长兴鑫华签署《股份转让协议》，以9.08元/股转让其持有的99225500股无限售条件流通股份（占公司股本总额的5%），总转让价款9.01亿元。2026年11月27日公司收到复星高科通知，双方已取得中国证券登记结算有限责任公司出具的《证券过户登记确认书》，股份过户登记时间为2026年11月26日。过户后复星高科持股8.5亿股，占比42.82%；长兴鑫华持股99225500股，占比5.00%，并承诺限售期为过户完成之日起12个月。本次转让不会导致公司控股股东及实际控制人发生变化。", "ctime": 1795771985, "time_str": "17:33:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261127/c682310129.shtml"}, {"id": "5774791", "title": "天力锂能：拟开展商品期货套期保值业务，保证金和权利金上限不超过1亿元人民币", "content": "天力锂能公告，公司第四届董事会第二十八次会议审议通过开展商品期货套期保值业务的议案，拟由公司及子公司开展与生产经营直接相关的场内期货套期保值业务。占用的保证金和权利金上限最高额度不超过1亿元人民币，任一交易日持有的最高合约价值不超过（含）人民币2亿元，额度在有效期限内可循环滚动使用；授权有效期为董事会审议通过之日起12个月内有效。业务资金为公司自有资金，主要用于规避原材料价格波动风险、锁定产品成本，不以投机为目的。", "ctime": 1795771963, "time_str": "17:32:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261127/c682310107.shtml"}, {"id": "5774779", "title": "绝味食品：回购实施完毕，累计回购1816.28万股支付2亿元", "content": "绝味食品公告，公司此前审议通过回购方案，拟以不低于1亿元且不超过2亿元回购公司股份，回购价格上限经权益分派调整后为15.47元/股，回购股份用于员工持股计划或股权激励。截至2026年11月26日，本次回购已实施完毕，公司通过集中竞价交易方式累计回购股份1816.28万股，约占总股本的2.9972%，成交价格区间为9.33元/股至12.24元/股，使用资金总额2亿元（不含交易费用）。本次回购实际执行情况与已披露方案不存在差异。", "ctime": 1795771902, "time_str": "17:31:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261127/c682310010.shtml"}, {"id": "5774773", "title": "南向资金今日净买入45.87亿港元 阿里巴巴-W获净买入居前", "content": "南向资金今日净买入45.87亿港元。阿里巴巴-W、中国神华分别获净买入约12.67亿港元、11.09亿港元；剑桥科技、腾讯控股分别遭净卖出1.15亿港元、1.09亿港元。", "ctime": 1795771898, "time_str": "17:31:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261127/c682310000.shtml"}, {"id": "5774767", "title": "罗普特：公司提起诉讼追讨票据利益2.23亿元，法院已立案尚未开庭", "content": "罗普特公告，公司近日收到江苏省南京市中级人民法院《受理案件通知书》，案号为（2026）苏01民初2124号。公司因票据利益返还请求权纠纷主动提起诉讼，请求判令被告北信源系统集成有限公司返还票据利益2.23亿元，并承担诉讼费用。截至公告披露日，本案已立案受理，尚未开庭审理。公司为原告，本次诉讼不会影响公司正常生产经营，对本期及期后利润的影响具有不确定性，最终以法院判决为准。", "ctime": 1795771862, "time_str": "17:31:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261127/c682309962.shtml"}, {"id": "5774757", "title": "新钢股份：拟以8922.66万元收储公司及新钢金属土地资产", "content": "新钢股份公告，因城市发展需要，新余市人民政府拟收储公司及控股子公司新钢金属位于新余市高新区的部分土地使用权及地上建筑物等资产，土地面积合计28.71万平方米、房屋建筑面积共77232.51平方米，拟收储价格合计8922.66万元。公司及新钢金属已分别与新余市自然资源局储备中心签署收储意向协议，具体以最终收储协议为准；本次土地收储已经公司第十届董事会第二十一次会议审议通过，尚需提交股东会审议。", "ctime": 1795771822, "time_str": "17:30:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261127/c682309911.shtml"}, {"id": "5774751", "title": "珠海冠宇：财务负责人兼董事会秘书刘宗坤增持14.14万股", "content": "珠海冠宇公告，公司财务负责人兼董事会秘书刘宗坤于2026年11月27日通过上海证券交易所交易系统以集中竞价交易方式增持公司股份14.14万股，占公司总股本的比例为0.0124%，增持金额为200万元，资金来源为个人自有或自筹资金。本次增持前，刘宗坤持股43.14万股，占总股本0.0379%；增持完成后持股57.28万股，占总股本0.0503%。本次增持未触及权益变动，不会导致股东身份发生变化，增持主体暂未提出后续增持计划。", "ctime": 1795771735, "time_str": "17:28:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261127/c682309819.shtml"}, {"id": "5774749", "title": "唐人神：2026年1-10月生猪出栏459.12万头", "content": "唐人神在投资者关系活动记录表中表示，公司2026年1-10月生猪出栏459.12万头，其中肥猪出栏306.6万头，较2025年同期减少112.61万头。公司调整出栏节奏和结构，增加仔猪销量、减少肥猪出栏，以减少生猪价格持续低迷行情下的直接亏损。", "ctime": 1795771714, "time_str": "17:28:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261127/c682309766.shtml"}, {"id": "5774747", "title": "花旗：中国ETF单周净流入283亿美元，超过美国股票基金234亿美元的净流入规模", "content": "花旗援引EPFR Global数据指出，截至11月25日当周，中国ETF净流入资金达283亿美元，超过同期美国股票基金234亿美元的净流入规模。中国ETF资金流入占全球新兴市场股票基金净流入总额367亿美元的77%，成为推动新兴市场资金流入的主要力量。全球范围内，股票基金当周合计净流入630亿美元，其中全球股票基金净流入68亿美元，欧洲股票基金净流出7亿美元，日本股票基金则连续第二周遭遇资金净流出。(财联社)", "ctime": 1795771689, "time_str": "17:28:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261127/c682309742.shtml"}, {"id": "5774741", "title": "时代电气：拟回购不超过4617.95万股H股并注销", "content": "时代电气公告，公司董事会审议通过继续回购H股股份的议案，拟使用自有资金回购不超过4617.95万股H股，回购价格不得达到或超过H股实际回购日前5个交易日平均收市价格的105%。回购期限至公司2026年年度股东会结束时或股东会特别决议撤销或更改相关授权之日止，以较早发生者为准。回购完成后，公司将择机注销回购股份并相应减少注册资本。债权人自接到通知起30日内、未接到通知者自公告披露之日起45日内，可要求公司清偿债务或提供相应担保；申报时间为2026年11月28日至2027年1月11日。", "ctime": 1795771666, "time_str": "17:27:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261127/c682309689.shtml"}, {"id": "5774733", "title": "泰瑞机器：更正2026年半年度报告，其他权益工具投资为200万元", "content": "泰瑞机器公告，公司更正2026年半年度报告部分分类填列错误：在以公允价值计量的金融资产中补列其他权益工具投资200万元，期末合计由8488.08万元更正为8688.08万元；公允价值披露中，将该200万元列入其他权益工具投资，并相应更正交易性金融资产和其他非流动金融资产的分类。公司还重申可转债转股价格历次调整情况，截至目前最新转股价格为8元/股；2025年权益分派已于2026年6月4日实施完成。除上述更正及说明外，半年度报告其他内容不变。", "ctime": 1795771586, "time_str": "17:26:26", "stock_ .7亿元；设立后1年为扩募期，可扩募至不超过40亿元，中车资本拟新增认缴不超过2.9亿元。本次投资已经公司第四届董事会第十三次会议审议通过，不构成关联交易，也不构成重大资产重组。", "ctime": 1795771219, "time_str": "17:20:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261127/c682309052.shtml"}, {"id": "5774695", "title": "松发股份：下属公司拟投资170亿元建设绿色高端海工科技装备制造项目", "content": "松发股份公告，公司下属公司恒力造船（大连）有限公司拟投资约170亿元建设恒力重工绿色高端海工科技装备制造项目，项目规划陆域面积1053.48万平方米，建设期24个月，预计2026年12月开工。本项目已达到股东会审议标准，尚需提交公司股东会审议。项目拟使用自有资金、银行贷款及自筹资金，目前处于筹备阶段。", "ctime": 1795771193, "time_str": "17:19:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261127/c682309004.shtml"}, {"id": "5774663", "title": "法国第三季度经济环比萎缩0.2%", "content": "法国国家统计与经济研究所11月27日公布的修正数据显示，法国第三季度实际国内生产总值（GDP）环比下降0.2%，此前初步估算为下降0.1%。出口下降是第三季度经济萎缩的主要原因。法国出口额环比下降1.6%，进口额增长0.1%，外贸整体拖累经济增长0.6个百分点。同期，固定资产投资下降0.9%，家庭消费支出增长0.3%。如果第四季度GDP维持第三季度水平，法国经济全年增幅将为0.1%，低于政府预计的0.5%。如果第四季度GDP再次环比下降，法国经济将连续两个季度萎缩，进入技术性衰退。（央视新闻）", "ctime": 1795771058, "time_str": "17:17:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261127/c682308801.shtml"}, {"id": "5774661", "title": "力勤资源：控股股东及其一致行动人增持触及1%刻度，合计持股比例升至49.18%", "content": "力勤资源公告，公司控股股东浙江力勤投资有限公司全资子公司矩阵资源（浙江）有限公司于2026年11月3日至2026年11月26日，以自有资金通过沪港通及深港通系统以集中竞价交易方式买入公司H股股份2020.26万股，增持比例1.17%。本次增持后，力勤投资及其一致行动人合计持有公司股份总数由8.3亿股上升至8.5亿股，合计持股占公司总股本比例由48.01%上升至49.18%，权益变动触及1%刻度。本次增持为履行已披露的增持计划，该计划正在履行中，本次增持事项与已披露的增持计划一致。", "ctime": 1795771054, "time_str": "17:17:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261127/c682308791.shtml"}, {"id": "5774633", "title": "华邦健康：全资子公司克立硼罗软膏获药品注册证书", "content": "华邦健康公告，全资子公司重庆华邦制药有限公司近日收到国家药品监督管理局核准签发的克立硼罗软膏《药品注册证书》。该药品按化学药品4类申报，视同通过仿制药质量和疗效一致性评价，适用于3月龄及以上轻度至中度特应性皮炎患者的局部外用治疗。克立硼罗软膏涉及的专利有效期到期后，公司将尽快启动生产和销售，但仍存在市场竞争环境中的不确定因素。", "ctime": 1795770971, "time_str": "17:16:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261127/c682308660.shtml"}, {"id": "5774611", "title": "富春股份：首次回购公司股份65万股，支付309.3万元", "content": "富春股份公告，公司此前审议通过回购公司股份方案，同意使用自有资金或自筹资金以集中竞价交易方式回购公司已发行的部分人民币普通股（A股），本次回购的股份将全部予以注销并相应减少公司注册资本，回购股份资金总额不低于人民币1000万元（含）且不超过人民币2000万元（含），回购价格不超过人民币8.87元/股（含本数）。2026年11月27日，公司首次通过股份回购专用证券账户以集中竞价方式回购公司股份65万股，占公司目前总股本的0.09%，最高成交价为4.98元/股，最低成交价为4.57元/股，成交金额为309.3万元（不含交易费用）。", "ctime": 1795770934, "time_str": "17:15:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261127/c682308589.shtml"}, {"id": "5774589", "title": "欧盟农民举行游行集会捍卫共同农业政策", "content": "当地时间27日凌晨，欧洲理事会特别峰会在布鲁塞尔结束，会议重点讨论了2028年至2034年欧盟多年期财政框架，试图为下一轮为期七年的长期预算寻找妥协方案，但因欧盟内部分歧，会议最终未能取得实质性成果。26日，约200名来自欧盟各成员国的农民代表在布鲁塞尔举行游行集会，旨在捍卫共同农业政策。对于欧盟相关提案中可能将共同农业政策预算削减超过20%，现场集会者表示反对和担忧。欧盟的共同农业政策是指为确保欧洲粮食安全而为农民提供的系列支持。其目标在于统一欧盟各成员国农业补贴、平衡各国间农业竞争。参与游行集会的意大利中小农场主协会主席指出，欧盟方面将资源用于战争和军备，却不愿投入到农业的未来之中，这简直“令人难以置信”。（央视新闻）", "ctime": 1795770884, "time_str": "17:14:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261127/c682308493.shtml"}, {"id": "5774587", "title": "Lumentum控股美股盘前涨超10%", "content": "Lumentum控股美股盘前涨超10%，现报524.5美元。", "ctime": 1795770880, "time_str": "17:14:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261127/c682308489.shtml"}, {"id": "5774585", "title": "华林证券宣布下调融资保证金比例，存量合约同步调整无需了结", "content": "11月27日，华林证券发布公告称，自2026年11月30日起，两融标的证券融资保证金比例下限调整为80%。针对此次调整生效前的存量融资合约，在计算投资者的保证金可用余额时，将按照上述标准同步调整保证金比例，投资者无需了结存量融资合约。(第一财经)", "ctime": 1795770873, "time_str": "17:14:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261127/c682308478.shtml" const SECTORS  = [{"name": "金融", "hit_count": 53, "etfs": []}, {"name": "半导体", "hit_count": 25, "etfs": []}, {"name": "数据要素", "hit_count": 9, "etfs": []}, {"name": "人工智能", "hit_count": 9, "etfs": []}, {"name": "消费", "hit_count": 6, "etfs": []}, {"name": "新能源", "hit_count": 4, "etfs": []}, {"name": "机器人", "hit_count": 4, "etfs": []}, {"name": "军工", "hit_count": 3, "etfs": []}];
const META     = {"update_time": "2026-11-27 17:50:31", "sentiment_score": 63.242009132420094, "agents": []};

// 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
