: false, "source": "", "url": "https://news.10jqka.com.cn/20260514/c676695739.shtml"}, {"id": "4364257", "title": "*ST亚士：公司下属重庆工厂、石家庄工厂、滁州防水工厂目前处于停产停工状态，广州工厂停止建设", "content": "*ST亚士5月14日公告，公司股票于2026年5月12日、5月13日、5月14日连续三个交易日内日收盘价格涨幅偏离值累计超过12%，根据《上海证券交易所交易规则》的有关规定，属于股票交易异常波动情形。经公司自查，公司内外部经营环境和主营业务未发生重大变化。受房地产和建筑行业持续疲软和订单大幅下滑影响，公司下属重庆工厂、石家庄工厂、滁州防水工厂目前处于停产停工状态。同时，鉴于当前产能利用率处于较低水平，广州工厂也已停止建设。后续公司将根据经营发展情况的变化，对上述停工停产及停建工厂进行妥善安排与处置。", "ctime": 1778751164, "time_str": "17:32:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260514/c676695726.shtml"}, {"id": "4364247", "title": "国投资本：向专业投资者公开发行面值总额不超过90亿元公司债券获同意", "content": "国投资本公告，近日，公司收到中国证券监督管理委员会出具的《关于同意国投资本股份有限公司向专业投资者公开发行公司债券注册的批复》（证监许可〔2026〕1071号），同意公司向专业投资者公开发行面值总额不超过90亿元公司债券的注册申请。本次发行公司债券应严格按照报送上海证券交易所的募集说明书进行。批复自同意注册之日起24个月内有效，公司在注册有效期内可以分期发行公司债券。", "ctime": 1778751074, "time_str": "17:31:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260514/c676695688.shtml"}, {"id": "4364239", "title": "三部门召开加强新能源汽车安全管理工作视频会", "content": "5月14日，工业和信息化部装备工业一司、国家市场监督管理总局质量发展局、国家消防救援局消防监督司（以下统称三部门）联合召开加强新能源汽车安全管理工作视频会，研究部署本年度新能源汽车安全管理工作。会议指出，近年来，在党中央、国务院的坚强领导下，有关各方攻坚克难、锐意进取，共同推动我国新能源汽车产业发展取得显著成效，成绩来之不易，需要倍加珍惜。有关各方要深入学习贯彻习近平总书记重要讲话和指示批示精神，坚持统筹发展和安全，始终保持清醒头脑，持续加强新能源汽车安全管理，保障产业健康可持续发展。会议要求，车辆生产企业和动力电池生产企业要自觉扛起产品质量安全主体责任，将产品质量安全管理作为“一把手工程”切实抓实抓细。要围绕产品研发设计、生产制造、供应链管理、运行监测、售后服务等方面做好风险防范，并严格履行告知义务，引导消费者正确使用车辆，不得进行夸大和虚假宣传。要建立健全事故隐患内部报告奖励机制，深化事故隐患排查，坚决守牢安全底线。下一步，三部门将会同相关部门进一步加强工作协同，完善工作举措，组织开展安全隐患排查和缺陷调查，实施道路机动车辆产品生产一致性和质量提升专项行动，严肃查处企业违规行为，坚决维护产业发展良好秩序。(工信部)", "ctime": 1778750954, "time_str": "17:29:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260514/c676695620.shtml"}, {"id": "4364237", "title": "第三届东北图书交易博览会展出40多万种出版物", "content": "5月14日，第三届东北图书交易博览会在吉林长春开幕。本届书博会为期5天，300多家参展商携40多万种出版物参展。(新华社)", "ctime": 1778750911, "time_str": "17:28:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260514/c676695597.shtml"}, {"id": "4364235", "title": "倍杰特：公司及相关人员收到北京证监局警示函", "content": "倍杰特公告，公司及相关人员于2026年5月14日收到北京证监局出具的警示函。公司2026年4月4日发布《前期会计差错更正公告》，对2025年三季报、2025年年报财务数据进行更正。因个别业务合并财务报表内部未实现利润抵销不完整、煤炭抵债业务会计处理不准确，导致相关财务数据披露不准确。公司及相关人员将严格整改，提高财务核算规范性和会计信息质量，加强信息披露管理。", "ctime": 1778750864, "time_str": "17:27:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260514/c676695571.shtml"}, {"id": "4364233", "title": "我国首次成功批量克隆超高产奶山羊", "content": "西北农林科技大学14日向新华社记者独家披露，学校羊遗传改良与生物育种创新团队攻克关键核心技术，6只超高产体细胞克隆奶山羊11日在富平奶山羊产业研究院试验基地顺利诞生，经数天观察，状态良好。这是我国首次实现超高产奶山羊批量克隆，标志着我国奶山羊生物育种迈入世界前列。 奶山羊作为我国特色奶业核心种质资源，长期以来存在优良种源供给不足、育种周期长、扩繁效率低等问题，制约着产业转型升级。此次西北农林科技大学联合有关单位，依托全基因组选择+体细胞克隆前沿分子育种技术体系，以每天可产8千克以上羊奶的顶级高产萨能奶山羊为供体，精准分离优质体细胞，通过细胞建系、胚胎重构、胚胎移植、妊娠监护等全流程优化，成功实现批量克隆，让顶尖高产奶山羊的优良基因实现精准复制、快速扩繁。(新华社)", "ctime": 1778750838, "time_str": "17:27:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260514/c676695559.shtml"}, {"id": "4364231", "title": "近期全国小麦市场购销旺、价格稳", "content": "新华社北京5月14日电 5月中下旬是小麦主产区集中收获期。近期全国小麦市场整体呈现出“市场购销两旺、价格运行平稳”的特点。国家粮食和物资储备局14日就今年夏粮收购相关举措举行新闻通气会，国家粮食和物资储备数据中心主任王晓辉在通气会上介绍，综合来看，我国小麦库存充裕，新季小麦长势正常，供应有保障。据介绍，今年以来，各地严格落实粮食安全党政同责要求，层层压实粮食生产责任，冬小麦播种面积保持稳定。小麦播种后主产区大部气温偏高，降水适宜，土壤墒情较好，有利于小麦生长发育。当前新季小麦长势正常。在购销方面，王晓辉说，去年6到9月，国家有关部门先后在河南、安徽、河北、江苏、山东等5个小麦主产省启动小麦最低收购价执行预案，累计收购最低收购价小麦1640万吨，有效发挥了政策托底作用，保障了农民种粮收益。（新华社）", "ctime": 1778750792, "time_str": "17:26:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260514/c676695537.shtml"}, {"id": "4364227", "title": "众源新材：科惠投资拟减持不超0.6297%公司股份", "content": "众源新材公告，股东上海科惠股权投资中心（有限合伙）拟减持不超0.6297%公司股份。", "ctime": 1778750707, "time_str": "17:25:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260514/c676695504.shtml"}, {"id": "4364215", "title": "森鹰窗业：控股股东、实际控制人部分股份被冻结", "content": "森鹰窗业公告，近日通过中国证券登记结算有限责任公司深圳分公司系统查询到公司控股股东、实际控制人之一边书平先生所持有的公司部分股份被司法冻结。本次冻结股份数量为1,823,558股，占公司总股本的1.91%。截至本公告披露日，边书平先生尚未收到关于本次股份冻结相关的正式法律文书或通知。本次股份冻结对公司的日常经营、公司治理无重大影响，不会导致公司控股股东、实际控制人发生变更。若已被司法冻结的股份被法院强制执行，可能引发边书平先生持有公司的股份被动减持情形，公司将持续关注上述事项的进展情况，并按照相关法律法规及规范性文件的要求及时履行信息披露义务。", "ctime": 1778750457, "time_str": "17:20:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260514/c676695391.shtml"}, {"id": "4364211", "title": "智翔金泰：GR1803注射液（皮下注射）临床试验申请获得批准", "content": "智翔金泰公告，近日，公司收到国家药品监督管理局核准签发的《药物临床试验批准通知书》，公司在研产品GR1803注射液（皮下注射）临床试验申请获得批准。GR1803注射液是一款由公司自主研发的双特异性抗体药物，作用靶点为BCMA和CD3，注册分类为治疗用生物制品1类。", "ctime": 1778750385, "time_str": "17:19:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260514/c676695338.shtml"}, {"id": "4364209", "title": "京能电力：公司股票连续三个交易日内收盘价格涨幅偏离值累计超过20%", "content": "京能电力公告，2026年5月12日、5月13日及5月14日，公司股票连续三个交易日内日收盘价格涨幅偏离累计超过20%，根据《上海证券交易所交易规则》的有关规定，属于股票交易异常波动。经公司自查并向控股股东核实，公司生产经营正常，不存在应披露而未披露的重大事项。", "ctime": 1778750380, "time_str": "17:19:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260514/c676695335.shtml"}, {"id": "4364207", "title": "菲律宾参议院枪击事件引发混乱，嫌疑人已被逮捕", "content": "菲律宾参议院13日晚发生枪击事件，虽无人受伤但引发混乱。警方14日表示，涉枪击事件嫌疑人已被逮捕。总统马科斯当天召集高级官员举行紧急会议。国际刑事法院去年11月签发针对参议员德拉罗萨的逮捕令，理由是他参与了杜特尔特领导的打击毒品犯罪行动。本月11日，德拉罗萨重返参议院，参与罢免参议长投票。12日，多名议员敦促德拉罗萨自首，被他拒绝。（新华社）", "ctime": 1778750364, "time_str": "17:19:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260514/c676695329.shtml"}, {"id": "4364205", "title": "江苏：“苏超”将继续坚持草根底色和烟火气", "content": "“开局起步‘十五五’”江苏省专题新闻发布会14日在南京举行，“苏超”成为现场被多次提及的“热词”。江苏省副省长沈剑荣在会上表示，将继续坚持“苏超”的草根底色和烟火气，在提高办赛水平的同时，推动“苏超”与商旅文体健深度融合。 “去年‘苏超’每1元门票带动了7.3元（周边）消费，含金量十足。”沈剑荣介绍，为将赛场上的人气引流到千行百业，今年江苏各地推出了100多条主题旅游线路、600多个“苏超第二现场”、超百场“苏超嘉年华”等活动，打造更多“苏超”与千行百业融合的新业态。统计数据显示，今年“五一”假期的“苏超”比赛日，江苏全省纳入监测的重点文旅景区共接待国内外游客约3760万人次，同比增长7.2%，文旅消费同比增长6.7%。 记者从发布会上了解到，除“苏超”和省运会之外，今年江苏还将举办60余项国际赛事、300余项全国性赛事以及500多项省级赛事。聚焦提升群众观赛体验，江苏将着力拓展主题旅游、水上运动、冰雪运动等形式多样的消费场景，进一步释放体育消费潜力。(新华社)", "ctime": 1778750351, "time_str": "17:19:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260514/c676695316.shtml"}, {"id": "4364201", "title": "腾讯开源Agent Memory 最高降低61%Token消耗", "content": "5月14日，腾讯云宣布正式开源TencentDB Agent Memory，面向Agent长任务场景提供短期记忆压缩与长期个性化记忆能力。据介绍，TencentDB Agent Memory通过“上下文卸载（Context Offloading）+ Mermaid任务画布”的技术，将完整信息卸载到外部存储，同时以结构化任务图保留关键状态与执行路径，使Agent在长任务中保持轻量上下文，同时支持原始信息的逐层追溯与恢复。在多任务连续Session实验中，该方案最高降低61%Token消耗，同时提升长任务场景下的任务成功率。（每日经济新闻）", "ctime": 1778750243, "time_str": "17:17:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260514/c676695264.shtml"}, {"id": "4364199", "title": "广电计量与广西桂电技术服务中心达成战略合作", "content": "5月13日，广电计量与广西桂电技术服务有限责任公司（简称“广西桂电技术服务中心”）举行战略合作签约仪式。双方将在检测平台资质建设、检测业务协作、产教融合发展、人才联合培养、科研项目攻关及成果转化、联合运营共建等领域建立长期战略合作伙伴关系，实现资源共享、信息互通、能力互补，共同提升区域人工智能、新能源新材料、电子信息产业等高端检测服务能力与产业赋能水平。（人民财讯）", "ctime": 1778750193, "time_str": "17:16:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260514/c676695223.shtml"}, {"id": "4364195", "title": "腾讯回应“AI一号位即将离职”：纯属子虚乌有", "content": "5月14日，“鹅厂黑板报”微信公众号发文称，今天中午，有自媒体谣传“AI一号位即将离职”并影射腾讯，此谣言纯属子虚乌有。腾讯严正辟谣，并保留对相关恶意造谣者追究法律责任的权利。(中证金牛座)", "ctime": 1778750156, "time_str": "17:15:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://ne 水制药有限公司（以下简称“衡水万洋”）收到国家药品监督管理局下发的《化学原料药上市申请批准通知书》，由衡水万洋提交的“磷酸奥司他韦”化学原料药上市申请已获批准。", "ctime": 1778749686, "time_str": "17:08:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260514/c676694879.shtml"}, {"id": "4364167", "title": "一季度我国职工基本医疗保险缴费收入同比增长5.3%", "content": "记者从国家税务总局获悉，今年一季度，我国职工基本医疗保险缴费收入实现5981亿元，同比增长5.3%。目前，2026年属期的城乡居民基本医疗保险集中参保缴费工作也基本结束，缴费收入实现3504亿元。税务数据显示，今年一季度，缴纳基本医疗保险费的职工人数为2.6亿人，同比增长1.8%；加上城乡居民医保参保人员、退休人员等，我国基本医疗保险参保人数稳定在13亿以上，覆盖全民、城乡统筹、权责清晰、保障适度、可持续的中国特色医疗保障制度更加成熟定型，全民参保成果得到进一步巩固拓展。据了解，税务部门会同医保等部门，持续优化基本医疗保险参保缴费服务举措，不断提升便民缴费服务质效，目前已在全国范围内全面实现基本医疗保险缴费“网上办”“掌上办”，线上业务办理占比稳定保持在95%以上，并设置5000多个便民绿色通道，专门服务老年人等特殊缴费群体，大幅提升群众医保缴费便利度。（央视新闻）", "ctime": 1778749685, "time_str": "17:08:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260514/c676694878.shtml"}, {"id": "4364165", "title": "山金国际：完成回购419.48万股", "content": "山金国际公告，公司于2025年6月23日至2026年4月24日通过回购专用证券账户以集中竞价交易方式累计回购公司股份数量为419.48万股，占公司目前总股本的0.15%，其中最高成交价为29.68元/股，最低成交价17.85元/股，成交总金额为1.01亿元（不含交易费用）。本次回购股份的资金来源为公司自有资金及回购专项贷款，回购价格未超过回购方案中拟定的价格上限29.7元/股（含）。截至2026年5月14日，本次回购期限已届满，用于回购的资金总额已达到回购股份方案中的回购资金总额下限，且不超过回购股份方案中的回购资金总额上限。", "ctime": 1778749665, "time_str": "17:07:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260514/c676694871.shtml"}, {"id": "4364163", "title": "佐力药业：发行可转换公司债券募集资金总额调减至15.23亿元", "content": "佐力药业公告，公司决定调减向不特定对象发行可转换公司债券的募集资金总额，调减金额为3300万元。调整后，本次发行募集资金总额不超过15.23亿元（含本数）。募集资金将用于智能化中药大健康工厂（一期）、“乌灵+X”产品研发项目及补充流动资金。", "ctime": 1778749658, "time_str": "17:07:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260514/c676694840.shtml"}, {"id": "4364153", "title": "津膜科技：公司作为被告的诉讼案件中，涉案金额为1299.22万元及利息", "content": "津膜科技公告，公司作为被告的诉讼案件中，涉案金额为1299.22万元及利息。原告吕宝明与天津市华水自来水建设有 // 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
