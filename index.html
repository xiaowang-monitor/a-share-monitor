id": "4855887", "title": "伊朗革命卫队在霍尔木兹海峡击中并扣留两艘违反禁令油轮", "content": "当地时间31日，伊朗伊斯兰革命卫队发布声明称，革命卫队海军当天在霍尔木兹海峡击中并扣留了两艘违反禁令的油轮。声明指出，这两艘油轮试图在美军护航下无视警告通过霍尔木兹海峡。此外，另有四艘油轮在警告后迅速改变航向返回。伊朗方面再次警告称，任何试图干扰该海域通航秩序的行为都将遭到回应。(央视新闻)", "ctime": 1785490499, "time_str": "17:34:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260731/c678589848.shtml"}, {"id": "4855885", "title": "富瀚微：预计2026年上半年净利润同比增长1072.72%-1420.19%", "content": "富瀚微公告，预计2026年上半年归属于上市公司股东的净利润为盈利2.7亿元～3.5亿元，上年同期为2302.34万元，同比增长1,072.72%～1,420.19%；扣除非经常性损益后的净利润为盈利2.66亿元～3.46亿元，同比增长1,640.93%～2,164.52%。预计营业收入14亿元—15亿元，同比增长103.48%—118.01%。业绩增长主要因存储价格大幅上涨及上游原材料供应紧缺，公司上调产品价格，三大业务板块量价齐升。", "ctime": 1785490497, "time_str": "17:34:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260731/c678589847.shtml"}, {"id": "4855877", "title": "航旅纵横APP又崩了", "content": "今天下午，多位用户反映航旅纵横APP突然出现服务异常，用户无法正常进行航班动态和行程查询等功能，页面显示“服务暂时不可用，请稍后再试”。今年4月，航旅纵横APP曾突然出现服务异常长达19小时。(第一财经)", "ctime": 1785490440, "time_str": "17:34:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260731/c678589812.shtml"}, {"id": "4855839", "title": "太极股份：总裁仲恺因个人原因辞职，未持有公司股份", "content": "太极股份公告，公司董事会近日收到董事、总裁仲恺先生递交的书面辞职报告，仲恺先生因个人原因申请辞去公司董事、总裁职务，辞职后不再担任公司其他任何职务，其辞职报告自送达董事会之日起生效。截至本公告披露日，仲恺先生未持有公司股份，不存在应当履行而未履行的承诺事项。其辞职不会影响公司正常经营，公司将按照相关规定尽快完成董事、总裁的补选工作。", "ctime": 1785490287, "time_str": "17:31:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260731/c678589752.shtml"}, {"id": "4855841", "title": "南向资金今日净卖出4.81亿港元 小米集团-W获净买入居前", "content": "南向资金今日净卖出4.81亿港元。小米集团-W、阿里巴巴-W分别获净买入约17.16亿港元、12.34亿港元；美团-W、长飞光纤光缆分别遭净卖出6.36亿港元、2.16亿港元。", "ctime": 1785490287, "time_str": "17:31:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260731/c678589753.shtml"}, {"id": "4855777", "title": "科安达：回购方案实施完毕，累计回购87.8万股耗资998.36万元", "content": "科安达公告，公司于2026年7月20日审议通过回购方案，截至2026年7月31日回购方案已实施完毕。公司通过回购专用证券账户以集中竞价交易方式累计回购股份87.8万股，占公司总股本的0.3569%，最高成交价11.46元/股，最低成交价11.37元/股，成交总金额998.36万元（不含交易费用）。实际回购金额已达回购资金总额下限，未超过上限，与回购方案不存在差异。回购股份拟用于股权激励计划或员工持股计划。", "ctime": 1785490178, "time_str": "17:29:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260731/c678589695.shtml"}, {"id": "4855775", "title": "中天服务：首次回购公司股份142.42万股，成交总金额690.76万元", "content": "中天服务公告，公司于2026年7月30日审议通过回购方案，拟使用自有资金以集中竞价方式回购公司股份用于员工持股计划或股权激励，回购价格不超过7元/股，回购资金总额不低于1000万元且不超过1500万元。2026年7月31日，公司首次通过回购专用证券账户以集中竞价方式回购公司股份142.42万股，占公司当前总股本比例为0.435%，最高成交价4.9元/股，最低成交价4.79元/股，成交总金额为690.76万元（不含交易费用）。", "ctime": 1785490174, "time_str": "17:29:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260731/c678589694.shtml"}, {"id": "4855763", "title": "中创智领：拟以3亿元-4亿元回购公司A股股份", "content": "中创智领公告，拟以不低于人民币3亿元（含）且不超过人民币4亿元（含）回购公司A股股份，回购价格不超过21元/股（含）。本次回购的A股股份，50%用于注销并减少公司注册资本，50%用于在未来实施股权激励/员工持股计划。回购资金来源为公司自有或自筹资金，回购期限为自公司股东会审议通过回购方案之日起12个月内。", "ctime": 1785490115, "time_str": "17:28:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260731/c678589674.shtml"}, {"id": "4855755", "title": "七彩化学：实控人徐惠祥提前终止减持计划", "content": "七彩化学公告，公司实际控制人、董事长徐惠祥先生经综合考虑决定提前终止本次减持计划，剩余未减持股份在本次减持计划期限内不再减持。徐惠祥先生原计划于减持计划披露之日起15个交易日后的3个月内，通过集中竞价方式减持不超过399.12万股（占总股本1.00%），通过大宗交易方式减持不超过798.23万股（占总股本2.00%）。本次减持期间（2026年5月25日至2026年7月16日），徐惠祥先生通过集中竞价方式实际减持226.4万股，占总股本比例0.57%，减持均价14.07元。减持后，徐惠祥先生持有公司股份4599.68万股，占总股本的11.52%。", "ctime": 1785490059, "time_str": "17:27:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260731/c678589640.shtml"}, {"id": "4855745", "title": "第12批药品集采首轮报价结束 265家企业拟中选", "content": "7月31日16时，第12批国家组织药品集中带量采购产生首轮报价结果，共有265家企业直接获得拟中选资格。根据采购规则，首轮报价未中选的企业，有机会根据采购规则进行第二轮“复活”报价，以适宜价格供应临床。120家企业将于18时30分进行第二轮“复活”报价，预计19时30分将进行第二轮报价唱标。（新华社）", "ctime": 1785490029, "time_str": "17:27:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260731/c678589620.shtml"}, {"id": "4855739", "title": "兰石重装：因2025年一季度至三季度财务数据披露不准确收警示函", "content": "兰石重装公告，公司及相关人员近日收到甘肃证监局警示函，因2025年第一季度、半年度、第三季度合并资产负债表和合并利润表相关财务数据披露不准确，公司被采取出具警示函措施，董事长郭富永、总经理车生文、财务总监卫桐言被采取监管谈话并出具警示函措施，并记入证券期货市场诚信档案。", "ctime": 1785490012, "time_str": "17:26:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260731/c678589612.shtml"}, {"id": "4855737", "title": "爱伦医疗：2026年上半年净利润6277.78万元，同比增长26.17%", "content": "爱伦医疗公告，2026年上半年营业收入6.42亿元，同比增长46.43%。归属于上市公司股东的净利润6267.78万元，上年同期4967.89万元，同比增长26.17%。归属于上市公司股东的扣除非经常性损益后的净利润6352.9万元，同比增长32.78%。", "ctime": 1785489983, "time_str": "17:26:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260731/c678589593.shtml"}, {"id": "4855735", "title": "兆易创新：拟以10亿元-20亿元回购公司股份", "content": "兆易创新公告，拟以不低于人民币10亿元且不超过人民币20亿元回购公司A股股份，回购价格不超过750元/股，回购股份将全部用于注销并减少注册资本，回购资金来源为自有资金及/或自筹资金，回购期限自股东会审议通过之日起6个月内。", "ctime": 1785489976, "time_str": "17:26:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260731/c678589588.shtml"}, {"id": "4855711", "title": "保加利亚将于10月举行总统选举", "content": "保加利亚国民议会7月31日宣布，将于10月25日举行总统选举。现任保加利亚总统约托娃此前接受媒体采访时表示，她将参加此次选举。根据保加利亚宪法，总统由选民直选产生，任期5年，可连任一次。新一任总统选举应在现总统任期届满前2至3个月内举行。（新华社）", "ctime": 1785489866, "time_str": "17:24:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260731/c678589529.shtml"}, {"id": "4855709", "title": "华峰化学：两个投资项目延期至2030年12月", "content": "华峰化学公告，公司审议通过部分投资项目调整议案，将PTMEG项目（二期）达到预定可使用状态时间由2027年2月延期至2030年12月，一体化项目（一期）由2026年12月延期至2030年12月。截至2026年6月30日，两项目合计预计总投资78.6亿元，已投入9.59亿元，投资进度12.2%。延期原因为行业产能集中释放、市场需求减缓，避免加剧竞争、保障投资回报。", "ctime": 1785489822, "time_str": "17:23:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260731/c678589497.shtml"}, {"id": "4855707", "title": "中证投服中心新一代投资者损失测算系统正式上线", "content": "7月30日，中证投服中心自主开发的新一代证券投资者损失测算系统正式上线。该新系统积极回应司法审判实践需求，损失测算功能和效率进一步提升。其中，在优化证券市场系统性风险扣除模型基础上，新增以“事件分析法”为逻辑的非系统性风险因素扣除功能、重大事件股价影响显著性预检验功能、多类型多格式交易数据清理功能、损失测算意见智能化生成功能。截至目前，中证投服中心累计接受60余家法院1400多批次测损委托，涉及上市公司虚假陈述等案件250余起，累计为670余万人次投资者进行测损。（人民财讯）", "ctime": 1785489799, "time_str": "17:23:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260731/c678589488.shtml"}, {"id": "4855701", "title": "美团联合苏州正式上线“等灯停表” 即日起在全国20城落地试点", "content": "美团和苏州公安联合上线外卖骑手“等灯停表”功能首个正式版本，目前已率先在苏州道路进行实际路测。据介绍，在该功能支持下，外卖骑手等红灯时间将实现单独累加计算并在配送时间中顺延。美团方面表示，随着“等灯停表”功能正式上线，北京与无锡已经在同步对接测试，上海、杭州、成都、南昌、兰州等20余个城市也在评估中，具备条件的城市会陆续上线。（新浪科技）", "ctime": 1785489754, "time_str": "17:22:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260731/c678589471.shtml"}, {"id": "4855669", "title": "沪深交易所将自8月起对首批主动ETF管理人现场检查", "content": "记者了解到，上交所、深交所将自8月起对首批上报主动ETF的基金公司进行现场检查。两家交易所此前发布的主动ETF指引提到，基金管理人首次开发主动ETF的，应当通过交易所组织的专项检查验收。而在7月17日，首批18只主动ETF上报后，有业内人士猜测，由于需要对每家基金管理人进行场检，首批主动ETF整体审批节奏将慢于常规指数ETF。（财联社）", "ctime": 1785489551, "time_str": "17:19:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260731/c678589340.shtml"}, {"id": "4855653", "title": "联合水务：控股股东协议转让6.00%股份完成过户", "content": "联合水务公告，公司控股股东联合水务亚洲与交大菡源创投于2026年5月21日签署协议，拟以10.36元/股转让2539.32万股（占公司总股本6.00%）。该转让已取得中国证券登记结算有限责任公司上海分公司出具的《证券过户登记确认书》，过户日期为2026年7月30日，过户数量为2539.32万股，股份性质为无限售流通股。过户完成后，联合水务亚洲持股比例降至60.79%，交大菡源创投持股6.00%。", "ctime": 1785489416, "time_str": "17:16:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260731/c678589119.shtml"}, {"id": "4855651", "title": "世运电路：回购实施完毕，累计回购927万股占总股本1.29%", "content": "世运电路公告，公司于2026年7月19日审议通过回购方案，拟以不低于2亿元且不超过3亿元回购股份，用于员工持股计划或股权激励，回购价格不高于55元/股。截至2026年7月30日，公司本次回购已实施完毕，累计回购股份927万股，占总股本1.29%，回购成交最高价32.99元/股，最低价31.01元/股，使用资金总额2.96亿元（不含交易费用）。", "ctime": 1785489413, "time_str": "17:16:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260731/c678589116.shtml"}, {"id": "4855647", "title": "工业和信息化部赴部分汽车生产企业开展监督检查", "content": "为进一步规范汽车产业竞争秩序、提升汽车产品生产一致性和质量安全水平，工业和信息化部装备工业一司30日至31日赴奇瑞汽车股份有限公司、蔚来汽车科技（安徽）有限公司、安徽江淮汽车集团股份有限公司开展道路机动车辆生产企业产品安全保障能力和生产一致性监督检查。记者了解到，此番检查重点聚焦企业智能网联汽车安全保障能力、设计开发及生产能力、生产一致性保证能力等生产准入条件保持情况，现场随机抽取样车、动力电池等，转送至有关机构进行国家标准符合性等检验检测。据悉，下一步，工业和信息化部将会同相关部门深入开展道路机动车辆产品生产一致性和质量提升行动，进一步加强汽车产品“激进式”创新设计准入审查和测试验证有关管理工作，督促汽车、摩托车生产企业深入排查产品安全风险隐患，加强产品测试验证和安全评估，规范营销宣传行为，守牢产品安全底线，切实维护消费者合法权益。（新华社）", "ctime": 1785489367, "time_str": "17:16:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260731/c678589102.shtml"}, {"id": "4855627", "title": "国家防总、应急管理部对山西黑龙江陕西青海启动防汛四级应急响应", "content": "据气象部门预报，未来三天，华北、东北地区北部、西北地区东部等地有大到暴雨，部分地区有大暴雨。当前正值“七下八上”防汛关键期，降雨范围广、局地雨强大，洪涝灾害风险较高。根据《国家防汛抗旱应急预案》及有关规定，国家防总、应急管理部决定于7月31日15时针对山西、黑龙江、陕西、青海启动防汛四级应急响应。(新华社)", "ctime": 1785489227, "time_str": "17:13:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260731/c678588989.shtml"}, {"id": "4855621", "title": "苏州固锝：控股股东增持计划实施完成，累计增持806.88万股", "content": "苏州固锝公告，控股股东苏州通博电子器材有限公司自2026年4月13日至2026年7月30日期间，通过集中竞价交易方式累计增持公司股份80 const SECTORS  = [{"name": "金融", "hit_count": 40, "etfs": []}, {"name": "数据要素", "hit_count": 19, "etfs": []}, {"name": "人工智能", "hit_count": 19, "etfs": []}, {"name": "半导体", "hit_count": 17, "etfs": []}, {"name": "消费", "hit_count": 9, "etfs": []}, {"name": "军工", "hit_count": 7, "etfs": []}, {"name": "新能源", "hit_count": 4, "etfs": []}, {"name": "医药", "hit_count": 2, "etfs": []}];
const META     = {"update_time": "2026-07-31 17:50:47", "sentiment_score": 55.55555555555556, "agents": []};

// 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';

  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
