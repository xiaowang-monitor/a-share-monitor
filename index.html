<style>

* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Noto Sans SC', sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  min-height: 100vh;
}
.mono { font-family: 'JetBrains Mono', monospace; }
.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 20px;
  transition: all 0.2s;
}
.card:hover { background: var(--bg-card-hover); border-color: #334155; }
.badge {
  display: inline-flex; align-items: center; padding: 2px 8px;
  border-radius: 6px; font-size: 12px; font-weight: 500;
}
.badge-s { background: rgba(239,68,68,0.2); color: #ef4444; }
.badge-a { background: rgba(245,158,11,0.2); color: #f59e0b; }
.badge-b { background: rgba(59,130,246,0.2); color: #3b82f6; }
.badge-c { background: rgba(100,116,139,0.2); color: #94a3b8; }
.score-bar {
  height: 6px; border-radius: 3px; background: #1e293b; overflow: hidden;
}
.score-bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s; }
.up { color: var(--red); }
.down { color: var(--green); }
.pulse { animation: pulse 2s infinite; }
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}
.glow { box-shadow: 0 0 20px rgba(59,130,246,0.15); }
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg-primary); }
::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
</style>

  </div>

  <!-- 中列: 精选个股 -->
  <div class="lg:col-span-2">

      <div class="overflow-x-auto">
        <table class="w-full text-sm">
          <thead>
            <tr class="text-gray-500 text-xs border-b border-gray-800">
              <th class="text-left py-2 px-2">代码</th>
              <th class="text-left py-2 px-1">名称</th>
              <th class="text-right py-2 px-1">现价</th>
              <th class="text-right py-2 px-1">涨幅</th>
              <th class="text-right py-2 px-1">评分</th>
              <th class="py-2 px-1 text-center" style="min-width:160px">评分分布</th>
              <th class="text-right py-2 px-1">板块</th>
              <th class="text-right py-2 px-1">连涨</th>
            </tr>
          </thead>
          <tbody id="picks-table"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- 新闻流 + 交易代理 -->
<div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
  <div class="card">
    <h2 class="text-sm font-medium text-gray-400 mb-4">实时新闻流</h2>
    <div id="news-feed" class="space-y-2 max-h-96 overflow-y-auto pr-2"></div>
  </div>
  <div class="card">
    <h2 class="text-sm font-medium text-gray-400 mb-4">交易代理状态</h2>
    <div id="agent-status" class="space-y-3"></div>
  </div>
</div>

, {"id": "5279017", "title": "补贴15%，每件最高1500元 浙江省就开展智能家居购新补贴工作发布公告", "content": "为加快推动浙江省“人工智能+消费”深度融合，持续优化消费供给，释放消费市场活力，改善人民群众居家生活品质，省商务厅就开展智能家居购新补贴工作发布公告：2026年消费品以旧换新智能家居购新补贴自即日起至12月31日止。本次补贴覆盖以下10类智能家居产品，产品须具备1项以上智能功能要求：智能门锁（含智能摄像头）、智能加湿器/除湿器（含智能空气净化器）、智能扫地/洗地机（含智能擦窗机器人）、智能吸油烟机、智能洗碗机（含消毒柜）、智能马桶（含马桶盖）、智能相机（含运动相机）、智能床/床垫（含按摩椅、沙发）、智能微波炉（含微蒸烤一体机）。补贴标准：个人消费者购置上述品类商品，按扣除商家各环节优惠后最终成交价的15%予以补贴。每名消费者每个品类仅可享受1件商品补贴，每件补贴不超过1500元。（潮新闻）", "ctime": 1790750093, "time_str": "14:34:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260930/c680402628.shtml"}, {"id": "5278963", "title": "日韩股市收盘涨跌互现", "content": "日经225指数收涨1.94%，报66753.72点。韩国综指收跌0.48%，报6838.04点。", "ctime": 1790749896, "time_str": "14:31:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260930/c680402518.shtml"}, {"id": "5278865", "title": "上清所公布债券业务费用阶段性减免安排", "content": "银行间市场清算所股份有限公司发布通知，公司自2026年10月1日至2028年12月31日减免以下债券业务费用：一是继续免除所有债券的发行登记费、减半收取付息兑付服务费，并进一步免除熊猫债付息兑付服务费。二是对现券的结算过户费实施9折优惠，对质押式回购（本币）、买断式回购（本币）、债券借贷、债券远期的结算过户费实施9.5折优惠。本项举措适用债券全额结算业务。三是在第二项优惠基础上，对做市商通过做市成交的现券交易结算过户费进一步实施8折优惠（即按现行收费标准的7.2折收取），其中对做市商做市交易的识别和认定，以中国外汇交易中心（全国银行间同业拆借中心）提供的做市成交数据为准。本项优惠按季核算，并在后续季度发生的全额结算业务费用中予以抵扣。", "ctime": 1790749581, "time_str": "14:26:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260930/c680402358.shtml"}, {"id": "5278831", "title": "南向资金净买入超50亿港元", "content": "据同花顺iFinD数据，截至目前，南向资金净买入超50亿港元，其中港股通（沪）买入超37.09亿港元，港股通（深）买入超12.92亿港元。", "ctime": 1790749356, "time_str": "14:22:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260930/c680402236.shtml"}, {"id": "5278813", "title": "中国信通院云计算与数字化研究所发布《词元（Token）经济发展研究报告（2026年）》", "content": "近日，中国信息通信研究院（简称“中国信通院”）云计算与数字化研究所正式发布《词元（Token）经济发展研究报告（2026年）》，报告核心观点表示，词元由技术计量单元走向产业计费接口，词元经济三大核心特征奠定运行基础。一是可度量性，以词元为信息原子，为全产业链成本核算、性能评估与效率优化提供统一量化标尺；二是可交易性，依托标准化接口与规则体系，催生技术演进方向与能力分层等商业共识；三是可流动性，词元可在全球应用与模型间自由流动，其高度可组合性为RAG、智能体工具链等复杂应用提供基础能力。", "ctime": 1790749219, "time_str": "14:20:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260930/c680402173.shtml"}, {"id": "5278771", "title": "泰国修订工业产出指标，纳入AI相关产业，反映产能繁荣", "content": "泰国修订工厂生产指标，用以统计与人工智能、数据中心相关的高增长产业。调整后的制造业生产指数纳入笔记本电脑、光模块以及数据处理系统配套备用电源设备，并扩大集成电路及其他电子品类的统计覆盖范围。本次修订能够更完整展现全球AI投资热潮如何重塑泰国工业根基，同时抬升最新工业数据；8月制造业产出同比增长4.44%。（新浪财经）", "ctime": 1790748931, "time_str": "14:15:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260930/c680402058.shtml"}, {"id": "5278725", "title": "日本TDK与太阳诱电在下一代AI电子元件领域达成合作", "content": "今日，日本两大被动元件巨头 TDK（东京电气化学） 与 太阳诱电（Taiyo Yuden） 正式宣布签署合作备忘录，同意探讨建立全面的业务联盟，共同开发用于下一代AI领域的先进电子元件。（科创板日报）", "ctime": 1790748795, "time_str": "14:13:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260930/c680402017.shtml"}, {"id": "5278715", "title": "SK海力士扩大存储半导体倒装芯片封装外包规模", "content": "SK海力士扩大存储半导体倒装芯片封装外包规模，继OSAT（半导体封装测试外包）供应商A-PROTECH之后，SK海力士开始将更多业务外包给WINPAC，这是两家公司上次合作四年后再次合作。SK海力士计划将部分DDR4、DDR5 DRAM内存芯片封装订单交由Winpac承接，Winpac已在P围区封装工厂完成设备调试等产线投产准备，现已进入量产阶段。该围区负责DRAM、NAND闪存、eUFS嵌入式通用闪存等高性能产品封装，月产能已由4400万颗提升至5000万颗。（科创板日报）", "ctime": 1790748764, "time_str": "14:12:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260930/c680402009.shtml"}, {"id": "5278709", "title": "机构：AI服务器增量需求支撑Q4存储器合约价涨势 消费端压力未减", "content": "根据TrendForce集邦咨询最新存储器产业研究，2026年第四季，DRAM原厂持续将先进制程投入生产Server（服务器）应用的高性能产品，整体维持供不应求格局，但是合约价涨势放缓，预计Conventional DRAM（一般型DRAM）将季增10%~15%。NAND Flash市场呈现AI加速与消费性需求低但仍连带涨价的双轨发展，预计整体合约价格将季增15%~20%。（科创板日报）", "ctime": 1790748738, "time_str": "14:12:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260930/c680401988.shtml"}, {"id": "5278577", "title": "美防长拟削减20%军队将级军官岗位", "content": "美国国防部长赫格塞思预计于9月30日宣布缩减美军高级军官编制，将全军将级军官岗位削减20%。据美国福克斯新闻数字网援引数份美军备忘录报道，赫格塞思本月早些时候已批准陆军、海军、空军和联合军种的缩编方案，并要求于2027年1月1日前完成调整。赫格塞思预计于30日在弗吉尼亚州匡蒂科海军陆战队基地发表讲话，公布这一缩编计划和未来一年美军工作重点。一名五角大楼消息人士告诉福克斯新闻数字网，此次削减的是将官岗位，并非直接裁减20%的现役将级军官。其中，部分岗位不会直接撤销，而是降低对应军衔级别。（新华社）", "ctime": 1790748410, "time_str": "14:06:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260930/c680401761.shtml"}, {"id": "5278571", "title": "欧洲斯托克50指数期货上涨0.76%", "content": "欧洲斯托克50指数期货上涨0.76%，德国DAX指数期货上涨0.74%，富时指数期货上涨0.71%。", "ctime": 1790748374, "time_str": "14:06:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260930/c680401754.shtml"}, {"id": "5278507", "title": "摩根大通重新定调美股 今年预测“每发必中”", "content": "面对即将密集出炉的一系列重磅宏观与微观数据，小摩团队周二已重新切换为“战术性看多”立场。此前小摩团队转入“中性”的主要考量，包括美联储政策的不确定性、仓位结构、信用利差、不利的季节性因素以及动量行情的获利了结；当时他们认为，围绕“做多纳斯达克100/空头罗素2000”构建核心敞口是较为稳妥的对冲策略。自该研判发布以来，标普500指数基本持平，而“做多纳斯达克100/空头罗素2000”交易组合的收益率已突破8%。如今，小摩指出，该团队研判市场环境正在边际向好：债券收益率正逐步寻得支撑区间，而国际油价预计震荡下行。", "ctime": 1790748279, "time_str": "14:04:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260930/c680401694.shtml"}, {"id": "5278187", "title": "四川新一轮以旧换新补贴10月1日起实施 包括10个品类每件补贴最高1500元", "content": "9月29日晚间，四川省商务厅发布《关于实施消费品以旧换新自主品类补贴的通知》，决定实施消费品以旧换新自主品类补贴活动，补贴时间为2026年10月1日起，至2026年12月31日止。补贴资金从超长期特别国债支持消费品以旧换新所需地方配套资金中统一安排，采取总额控制、先到先得、补完即止。根据《通知》，补贴品类为智能吸油烟机、智能家用灶具、智能洗碗机、净水器（含直饮机、管线机）、智能清洁机器人（含扫地机、洗地机、吸尘器）、智能马桶（含马桶盖）、数码相机（含运动相机）、智能无人机、智能投影仪、智能耳机，共10类。补贴标准为扣除各环节优惠后最终销售价格的15%，每位消费者每类可补贴1件，每件补贴最高1500元。（人民财讯）", "ctime": 1790747988, "time_str": "13:59:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260930/c680401546.shtml"}, {"id": "5278167", "title": "白宫与美AI巨头签协议 涉及内外部审查", "content": "美国总统特朗普9月29日对媒体说，他在白宫会见多家科技企业负责人，讨论人工智能发展，并共同签署一份相关协议文件。当天稍晚时候，特朗普在其社交媒体上发布了这份文件。美国媒体报道说，这份文件涉及对人工智能技术的“内部和外部审查”。（新华社）", "ctime": 1790747860, "time_str": "13:57:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260930/c680401493.shtml"}, {"id": "5278157", "title": "OpenAI：正调查ChatGPT Pro和Plus用户错误率上升问题", "content": "OpenAI：正调查ChatGPT Pro和Plus用户错误率上升问题。", "ctime": 1790747748, "time_str": "13:55:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260930/c680401476.shtml"}, {"id": "5278111", "title": "贵州茅台旗下i茅台APP和43家自营公司将于10月6日暂停营业一天", "content": "9月30日，贵州茅台酒销售有限公司官微消息，计划于2026年10月6日全天对i茅台APP进行维护升级。在此期间，i茅台APP将暂停使用，需依托i茅台APP办理的线下相关服务同步暂停。此外，贵州茅台43家自营公司也将于10月6日暂停营业一天。", "ctime": 1790747349, "time_str": "13:49:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260930/c680401275.shtml"}, {"id": "5278099", "title": "白酒板块持续拉升，金徽酒涨停", "content": "白酒板块持续拉升，金徽酒涨停，古井贡酒、迎驾贡酒、泸州老窖、山西汾酒、今世缘跟涨。", "ctime": 1790747266, "time_str": "13:47:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260930/c680401181.shtml"}, {"id": "5278051", "title": "硅料硅片板块走高，弘元绿能涨停", "content": "硅料硅片板块走高，弘元绿能涨停，通威股份、大全能源、TCL中环、双良节能、华民股份等纷纷走高。", "ctime": 1790746750, "time_str": "13:39:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260930/c680400955.shtml"}, {"id": "5278039", "title": "万科A午后涨超7%，成交额超44亿刷新一年来最高记录", "content": "万科A午后涨超7%，成交额超44亿刷新一年来最高记录。", "ctime": 1790746541, "time_str": "13:35:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260930/c680400824.shtml"}, {"id": "5278027", "title": "金地集团上演“地天板”", "content": "金地集团盘中涨停，上演“地天板”，现报2.81元，成交额9.56亿元。", "ctime": 1790746459, "time_str": "13:34:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260930/c680400786.shtml"}, {"id": "5277979", "title": "乳业板块异动拉升，阳光乳业涨停", "content": "乳业板块异动拉升，阳光乳业涨停，骑士乳业、新乳业、熊猫乳品、科拓生物、西部牧业跟涨。", "ctime": 1790746048, "time_str": "13:27:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260930/c680400624.shtml"}, {"id": "5277967", "title": "总投资120亿元，先导芯光光电芯片基地在光谷通线", "content": "据“中国光谷”微信公众号消息，9月28日，先导科技集团旗下先导芯光电子科技（武汉）有限公司晶圆厂在东湖综保区通线。该厂是先导科技集团投资120亿元建设的高端化合物半导体材料及芯片产业化基地的制造核心，建有磷化铟4/6英寸与砷化镓6/8英寸双材料大尺寸光电芯片平台。通线后，基地由建设期转入工艺认证与产品导入阶段。", "ctime": 1790745877, "time_str": "13:24:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260930/c680400554.shtml"}, {"id": "5277957", "title": "世界知识产权组织报告：人工智能正在重塑创新投资", "content": "世界知识产权组织29日发布的《2026年全球创新指数报告》显示，人工智能正在开辟各个科学领域新技术前沿，重塑创新投资，拉动政府与企业的整体研发投入在2025年创下历史新高。2025年，支持创新型初创企业和商业构想的风险投资总额增长了28%，达到5100亿美元，这是自2021年以来的最大年度增幅，同时投资日益集中在人工智能领域，2025年该领域交易额占到全球风险投资总额的53%，2026年上半年这一比例更是高达77%。（新华社）", "ctime": 1790745762, "time_str": "13:22:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260930/c680400520.shtml"}, {"id": "5277941", "title": "台湾以东海域发生5.5级地震", "content": "中国地震台网正式测定：09月30日13时00分在台湾以东海域（北纬23.77度，东经122.96度）发生5.5级地震，震源深度10千米。", "ctime": 1790745538, "time_str": "13:18:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260930/c680400450.shtml"}, {"id": "5277915", "title": "淡水河谷正考虑发行首支熊猫债券，募资至多35亿元人民币", "content": "淡水河谷正考虑发行首支熊猫债券，募资至多35亿元人民币。", "ctime": 1790745317, "time_str": "13:15:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260930/c680400365.shtml"}, {"id": "5277909", "title": "伊朗向阿联酋等国发警告：以方活动“后果危险”", "content": "针对以色列总理内塔尼亚胡9月27日访问阿拉伯联合酋长国，伊朗外交部29日向阿联酋等中东地区国家发出警告。伊朗外交部在一份声明中强烈谴责内塔尼亚胡访问阿联酋，强调以方在中东地区的活动会引发“极其危险的后果”。声明指出，以色列政权“向来对伊朗及地区其他国家怀有敌意与仇视”，且屡次威胁伊朗。地区所有国家都应警惕此类访问所带来的后果与连锁反应，类似访问威胁“地区集体和平与安全”。伊朗外交部呼吁中东地区国家不要允许本国领土被用于开展破坏地区其他国家稳定的活动。(央视新闻)", "ctime": 1790745307, "time_str": "13:15:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260930/c680400360.shtml"}, {"id": "5277889", "title": "ETF两市成交额超3000亿元", "content": "截至目前，ETF两市成交额超3000亿元。其中，成交额最高的非货币型ETF分别是港股创新药ETF（513120）、中韩半导体ETF（513310）、科创50ETF（588000），成交额分别为73.05亿元、42.19亿元、40.69亿元。", "ctime": 1790745145, "time_str": "13:12:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260930/c680400312.shtml"}, {"id": "5277753", "title": "苹果在印度推出支付服务，挑战谷歌与Paytm", "content": "苹果公司已在印度正式推出其支付服务，旨在通过这一拥有超十亿消费者的关键增长市场，进一步扩大其业务版图。这家美国科技巨头在周三的一份声明中表示，Apple Pay 首先将与印度本土贷款机构 Axis Bank Ltd.（Axis 银行）合作推出。这意味着 Axis 银行的客户可以将其信用卡或借记卡添加到 iPhone 和 Apple Watch 的苹果钱包中，并使用设备进行支付。", "ctime": 1790744049, "time_str": "12:54:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260930/c680399900.shtml"}, {"id": "5277717", "title": "前8个月 宁波舟山港集装箱吞吐量突破3000万标箱", "content": "前8个月，宁波舟山港完成集装箱吞吐量3040万标箱，同比增长6.1%；海关监管国际航行船舶29945艘次，同比增长3.3%。目前，宁波舟山港航线总数达309条，连接全球200多个国家和地区的700多个港口。（央视新闻）", "ctime": 1790743229, "time_str": "12:40:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260930/c680399577.shtml"}, {"id": "5277711", "title" // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
