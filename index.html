rce": "", "url": "https://news.10jqka.com.cn/20261015/c680730686.shtml"}, {"id": "5396869", "title": "德国铁路公司在全国约5700座火车站实施禁酒令", "content": "当地时间10月15日起，德国铁路公司在全国约5700座火车站全面实施禁酒令，禁止旅客在车站大厅、站台等区域饮用酒精饮料，以改善车站安全和卫生状况。根据德国铁路公司的规定，车站内的餐饮场所不受禁令限制，旅客仍可携带未开封的酒精饮料乘车，列车上原则上允许饮酒。铁路安保人员将在日常巡查中劝阻违规行为，多次违反规定者可能被禁止进入车站。德国铁路公司表示，此前已在近40座大型火车站试行禁酒措施，其间车站垃圾和冲突事件有所减少。德国铁路公司从今年7月开始逐步在火车站推行禁酒措施，此次新规生效标志着禁酒令已覆盖其在德国运营的全部火车站。（央视新闻）", "ctime": 1792051825, "time_str": "16:10:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261015/c680730606.shtml"}, {"id": "5396867", "title": "港股收评：恒生指数跌1.03%，恒生科技指数跌2.72%", "content": "港股收盘，恒生指数跌1.03%，恒生科技指数跌2.72%。恒指港股通ETF银华（159318）跌1.59%，港股通科技ETF鹏华（159751）跌3.58%。板块方面，塑料制品、建筑产品Ⅲ板块涨幅靠前；个人电脑、计算机设备板块跌幅靠前。个股方面，中国星集团涨10.62%，国恩科技涨9.84%，怡俊集团控股涨6.57%，嘉耀控股涨5.95%，蓝月亮集团涨5.18%；纳真科技跌16.41%，万国数据-SW跌15.74%，中远海能跌15.64%，联想集团-R跌14.76%，联想集团跌14.54%。", "ctime": 1792051807, "time_str": "16:10:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261015/c680730448.shtml"}, {"id": "5396831", "title": "美股台积电盘前股价下跌2%", "content": "美国上市的台积电在第三季度财报发布后，盘前股价下跌2%，公司对2027年持谨慎态度。", "ctime": 1792051617, "time_str": "16:06:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261015/c680729342.shtml"}, {"id": "5396781", "title": "商务部部长王文涛会见美国苹果公司执行董事长蒂姆·库克", "content": "商务部部长王文涛会见苹果公司执行董事长蒂姆·库克。双方就中美经贸关系、人工智能发展、苹果公司在华业务等议题进行交流。王文涛表示，在两国元首构建“基于尊重、公平、对等的中美建设性战略稳定关系”的共识引领下，中美经贸磋商取得积极成果。中方倡导人工智能发展安全可控、普惠向善、治理合作。希望苹果公司发挥沟通桥梁作用，为推动中美经贸关系持续稳定向好发展贡献力量。当前，中国坚定不移扩大高水平对外开放，持续优化营商环境，消费市场扩容升级，绿色供应链不断壮大，将为跨国企业在华投资向智能、绿色、创新转型提供更广阔空间。希望苹果公司继续深耕中国市场，共享中国式现代化发展机遇。库克表示，苹果公司看好中国发展前景，将进一步扩大在华业务，并愿为推动美中经贸关系稳定健康发展发挥积极作用。", "ctime": 1792051415, "time_str": "16:03:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261015/c680728466.shtml"}, {"id": "5396765", "title": "婴幼儿纸尿裤甲酰胺问题调查结束，调查组通报结果", "content": "市场监管总局等四部门联合调查组针对婴幼儿纸尿裤甲酰胺问题展开调查，现已结束。调查组对全国168家婴幼儿纸尿裤生产企业进行全面抽检，共抽检180个品牌368批次纸尿裤成品样品，并对部分重点品牌婴幼儿纸尿裤的腰围、粘扣等重点部位开展32批次分部位检测。所有样品均未检出甲酰胺。同时，对相关自媒体博主检测剩余纸尿裤样品进行复检，复检的15个品牌58批次样品均未检出甲酰胺。此外，对山东省公共卫生临床中心质谱研究与临床应用中心进行调查核实，发现其相关检测存在多方面问题，检测过程不可靠，检测结论不可信。调查组已对合肥广测产品检测研究所有限公司和联信检测（江苏）有限公司的检测情况进行调查核实，均未检出甲酰胺。（市场监管总局）", "ctime": 1792051382, "time_str": "16:03:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261015/c680728272.shtml"}, {"id": "5396735", "title": "SK海力士盘前跌6.35%，现报138.18美元", "content": "SK海力士盘前跌6.35%，现报138.18美元。消息面上，美国9月CPI高于预期推升加息预期令半导体与存储板块走弱，同时市场担忧AI内存需求与资本开支持续性及SK海力士HBM4设备订单可能延后引发扩产节奏忧虑。", "ctime": 1792051328, "time_str": "16:02:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261015/c680727963.shtml"}, {"id": "5396733", "title": "美股中概股盘前涨跌互现，阿里巴巴跌2%", "content": "美股中概股盘前涨跌互现，携程、百胜中国涨1%，网易涨0.9%，哔哩哔哩、富途控股、拼多多跌1%，百度、阿里巴巴跌2%。", "ctime": 1792051323, "time_str": "16:02:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261015/c680727933.shtml"}, {"id": "5396731", "title": "美股大型科技股盘前多数下跌，SK海力士跌超6%", "content": "美股大型科技股盘前多数下跌；SK海力士跌超6%，美光科技跌超4%，Meta、SpaceX、亚马逊、特斯拉、英伟达、谷歌A跌超1%，微软跌0.3%。", "ctime": 1792051318, "time_str": "16:01:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261015/c680727907.shtml"}, {"id": "5396641", "title": "德国10年期国债收益率跌至自9月9日以来的最低水平，报3.3819%，最新下跌8.5个基点", "content": "德国10年期国债收益率跌至自9月9日以来的最低水平，报3.3819%，最新下跌8.5个基点。", "ctime": 1792051037, "time_str": "15:57:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261015/c680727520.shtml"}, {"id": "5396611", "title": "部分机构收到监管点名提醒 要求加强债券投资风险管理", "content": "本周以来，长债收益率加速下行。截至10月14日收盘，10年期国债收益率1.64%，逼近历史低位。记者从多位知情人士处获悉，针对近期长期国债收益率交易热度明显升温，部分券商和银行收到了监管部门点名提醒，要求相关机构加强债券投资风险管理。有业内人士认为，央行已多次表态加强金融市场宏观审慎管理，对市场运行情况高度关注。不排除后续对交易行为偏激进的机构采取宏观审慎管理措施。（财联社）", "ctime": 1792050817, "time_str": "15:53:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261015/c680727451.shtml"}, {"id": "5396585", "title": "宣泰医药：Finer捐赠20万股完成过户", "content": "宣泰医药公告，公司此前披露股东Finer Pharma Inc.拟将其持有的20万股公司股份捐赠给辽宁省沈阳药科大学教育基金会；近日双方已通过非交易过户完成20万股公司股份过户登记，Finer于2026年10月15日收到中国证券登记结算有限责任公司出具的《证券过户登记确认书》。", "ctime": 1792050674, "time_str": "15:51:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261015/c680727392.shtml"}, {"id": "5396579", "title": "路维光电：杜武兵拟增持2000万元～4000万元", "content": "路维光电公告，控股股东、实际控制人、董事长兼总裁杜武兵拟自本公告披露日起12个月内，使用自有及自筹资金增持公司股份，增持金额不低于人民币2000万元（含）、不超过人民币4000万元（含），增持股票价格不超过100元/股。增持股份数量及比例以实际增持数量为准。", "ctime": 1792050584, "time_str": "15:49:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261015/c680727348.shtml"}, {"id": "5396563", "title": "懂车帝回应：“245亿营收”“黑尊界”等均为谣言", "content": "汽车资讯平台懂车帝近日因尊界V800刹车踏板测试事件引发广泛关注。针对网络近日出现“懂车帝邀约博主黑尊界”“年营收超过245亿”等多个传言，懂车帝相关负责人回应记者称，网传“黑尊界”相关言论不实，公司已溯源取证，将采取法律措施维护公司合法权益。上述人士表示，“245亿营收”来源于3月份的一篇网络AI生成文章。相关信息均为谣言，公司将追究造谣者的法律责任。（上证报）", "ctime": 1792050457, "time_str": "15:47:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261015/c680727073.shtml"}, {"id": "5396553", "title": "东利机械：董事长提议注销100.95万股回购股份并减少注册资本", "content": "东利机械公告，公司董事长王征提议将回购专用证券账户剩余100.95万股股份（占公司当前总股本的0.69%）的用途由“用于实施股权激励计划”变更为“用于注销并减少注册资本”。本次变更尚需董事会、股东会审议通过；获批后，公司拟注销上述股份。", "ctime": 1792050401, "time_str": "15:46:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261015/c680727036.shtml"}, {"id": "5396511", "title": "吉峰科技新设低空科技公司 含通用航空业务", "content": "企查查APP显示，近日，吉峰低空科技（四川）有限公司成立，经营范围包含：智能无人飞行器销售；机械零件、零部件销售；通用航空服务；民用航空器驾驶员培训等。企查查股权穿透显示，该公司由吉峰科技全资持股。", "ctime": 1792050204, "time_str": "15:43:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261015/c680726927.shtml"}, {"id": "5396491", "title": "1—9月我国储能电池销量为595.4GWh，同比增长111.8%", "content": "中国汽车动力电池产业创新联盟发布的数据显示，9月，我国动力和储能电池合计产量为237.8GWh，环比增长0.3%，同比增长57.3%。1—9月，我国动力和储能电池产量为1833.1GWh，同比增长63.4%。销量方面，9月，我国动力和储能电池销量为222.7GWh，环比下降0.2%，同比增长52.0%。其中，动力电池销量为149.2GWh，占总销量67.0%，环比增长1.7%，同比增长35.0%；储能电池销量为73.5GWh，占总销量33.0%，环比下降3.7%，同比增长104.4%。1—9月，我国动力和储能电池销量为1681.7GWh，同比增长57.6%。其中，动力电池销量为1086.4GWh，占总销量64.6%，同比增长38.2%；储能电池销量为595.4GWh，占总销量35.4%，同比增长111.8%。", "ctime": 1792050036, "time_str": "15:40:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261015/c680726862.shtml"}, {"id": "5396489", "title": "新华百货：累计回购1666.56万股、比例达5.276%，价格区间9.9元/股~11.58元/股，支付1.79亿元", "content": "新华百货公告，公司此前审议通过回购方案，拟以2亿元~4亿元回购股份，回购价格不超过12.78元/股，用于员工持股计划或股权激励。截至2026年10月14日，公司累计回购1666.56万股，占总股本5.276%，回购价格区间为9.9元/股~11.58元/股，累计支付1.79亿元（不含交易费用）。", "ctime": 1792050028, "time_str": "15:40:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261015/c680726860.shtml"}, {"id": "5396473", "title": "春秋航空：2026年9月总载运人次304.88万人次，同比增长9.81%", "content": "春秋航空公告，2026年9月总载运人次304.88万人次，同比增长9.81%；旅客周转量54.14亿人公里，同比增长11.97%；可用座公里数58.19亿人公里，同比增长10.54%。当年累计总载运人次2701.16万人次，同比增长11.33%。截至月末，公司共运营140架空客A320系列机型飞机。", "ctime": 1792049889, "time_str": "15:38:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261015/c680726712.shtml"}, {"id": "5396469", "title": "五矿新能：2026年第三季度净利润8407.68万元，同比增长1,150.35%", "content": "五矿新能公告，2026年第三季度营业收入46.83亿元，同比增长117.80%；归属于上市公司股东的净利润8407.68万元，同比增长1,150.35%；归属于上市公司股东的扣除非经常性损益的净利润7985.26万元。2026年前三季度营业收入124.95亿元，同比增长147.22%；归属于上市公司股东的净利润4.62亿元，扣非净利润4.53亿元。", "ctime": 1792049882, "time_str": "15:38:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261015/c680726707.shtml"}, {"id": "5396451", "title": "台积电重申年内资本支出为600-640亿美元", "content": "台积电10月15日召开法说会，财务长黄仁昭重申，公司2026年全年资本预算将介于600亿至640亿美元之间，持续预期2026年至2028年的资本支出金额将比过去3年显著更高。他指出，台积电将善用在亚利桑那州日益扩大的规模，并致力于营运改善以优化成本结构。台积电也将持续与客户及供应商紧密合作，以控管相关影响。整体而言，凭借台积电在制造技术领先地位与大规模生产基地的根本竞争优势，有信心台积电在营运所在的每一个地区，依然是最具成本效益的制造商。（界面新闻）", "ctime": 1792049810, "time_str": "15:36:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261015/c680726652.shtml"}, {"id": "5396437", "title": "德业股份：首次回购56.2万股，价格70.22元/股~71.6元/股，支付4044.94万元", "content": "德业股份公告，公司此前审议通过回购方案，拟使用自有资金以集中竞价方式回购公司股份，金额不低于人民币1亿元（含）且不超过2亿元（含），回购价格不超过人民币133元/股（含），用于员工持股计划或股权激励。2026年10月15日，公司首次回购公司股份56.2万股，成交价格为70.22元/股~71.6元/股，支付资金总额为人民币4044.94万元（不含印花税、交易佣金等交易费用）。", "ctime": 1792049754, "time_str": "15:35:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261015/c680726600.shtml"}, {"id": "5396407", "title": "利柏特：签订3800万至4200万欧元模块制造合同", "content": "利柏特公告，公司与ECOPLANTA MOLECULAR RECYCLING SOLUTIONS S.L.签订《ECOPLANTA项目模块制造工程合同》，合同金额为3800万至4200万欧元（最终以竣工结算数额为准），履行期限自合同生效之日至2028年4月30日，合同已满足生效的全部条件。", "ctime": 1792049599, "time_str": "15:33:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261015/c680726479.shtml"}, {"id": "5396381", "title": "金健米业：全资子公司增资预挂牌，外部股东持股不超49%", "content": "金健米业公告，全资子公司金健植物油（长沙）有限公司拟通过湖南联交所公开挂牌增资扩股，引进外部投资者，外部股东合计持股不超过增资后股权的49%，募集资金预计不超过1亿元。 // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
