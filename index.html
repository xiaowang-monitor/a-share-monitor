}
.score-bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s; }
.up { color: var(--red); }
.down { color: var(--green); }
.pulse { animation: pulse 2s infinite; }
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}
.glow { box-shadow: 0 0 20px rgba(59,130,246,0.15); }

型企业通过技术调优提高单位芯片的词元产出效率，对符合条件的企业按实际投入给予最高不超过50%的扶持，单个企业每年最高150万元。在产业平台端，支持企业开展异构算力词元化封装、多模态模型聚合接入、一站式结算等业务，对符合条件的企业给予最高400万元扶持；支持建设跨模型、跨模态、多异构平台接入的词元调用中枢，最高给予400万元扶持。在应用端，海珠将推动大模型与新型工业化、游戏、时尚、营销、交通、医疗、金融、具身智能、低空等领域融合，符合条件的项目最高可获500万元扶持。针对数字营销、数字文娱等海珠优势产业，政策瞄准Token消耗成本，企业通过调用大模型API开展内容生成、短漫剧制作等业务产生的词元消耗费用，可按比例获得支持，单个企业每年最高200万元。（界面新闻）", "ctime": 1786694768, "time_str": "16:06:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260814/c678965517.shtml"}, {"id": "4959967", "title": "红旗连锁：2026年上半年净利润2.68亿元，同比下降4.57%", "content": "红旗连锁公告，2026年上半年营业收入46.76亿元，同比下降2.75%。归属于上市公司股东的净利润2.68亿元，同比下降4.57%。归属于上市公司股东的扣除非经常性损益的净利润2.77亿元，同比增长5.51%。公司计划不派发现金红利，不送红股，不以公积金转增股本。", "ctime": 1786694732, "time_str": "16:05:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260814/c678965463.shtml"}, {"id": "4959963", "title": "俄乌互袭波及粮食出口 乌方提议黑海停火", "content": "据乌克兰消息人士13日透露，乌方已向俄罗斯提议在黑海停止相互袭击民用目标。近期，俄乌双方针对黑海商业航运和港口设施的打击持续升级。俄方在黑海和亚速海的多座码头相继停止运营，乌南部粮食出口重要枢纽同样受到影响，两国粮食出口大幅下滑，推高全球粮价。（新华社）", "ctime": 1786694718, "time_str": "16:05:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260814/c678965450.shtml"}, {"id": "4959959", "title": "成都燃气：2026年上半年净利润2.51亿元同比降9.24%", "content": "成都燃气公告，2026年上半年营业收入26.98亿元，同比下降4.49%。归属于上市公司股东的净利润2.51亿元，同比下降9.24%。归属于上市公司股东的扣除非经常性损益的净利润2.44亿元，同比下降7.81%。", "ctime": 1786694605, "time_str": "16:03:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260814/c678965147.shtml"}, {"id": "4959957", "title": "创新医疗：2026年上半年净利润亏损5283.09万元", "content": "创新医疗公告，2026年上半年营业收入3.38亿元，同比下降15.88%。归属于上市公司股东的净利润亏损5283.09万元，上年同期亏损1136.13万元。", "ctime": 1786694514, "time_str": "16:01:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "sour _share": false, "source": "", "url": "https://news.10jqka.com.cn/20260814/c678964247.shtml"}, {"id": "4959931", "title": "科达利：2026年上半年净利润9.43亿元，同比增长22.57%", "content": "科达利公告，2026年上半年营业收入92.08亿元，同比增长38.58%；归属于上市公司股东的净利润9.43亿元，同比增长22.57%，2025年同期净利润7.69亿元；归属于上市公司股东的扣除非经常性损益的净利润9.17亿元，同比增长27.35%。公司计划不派发现金红利，不送红股，不以公积金转增股本。", "ctime": 1786693808, "time_str": "15:50:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260814/c678964198.shtml"}, {"id": "4959929", "title": "凯普生物：2026年上半年实现扭亏为盈，净利润3126.21万元", "content": "凯普生物公告，2026年上半年营业收入3亿元，同比下降4.74%。归属于上市公司股东的净利润3126.21万元，上年同期亏损8959.14万元，同比增长134.89%。归属于上市公司股东的扣除非经常性损益的净利润1213.04万元，上年同期亏损9561.04万元，同比增长112.69%。公司计划不派发现金红利，不送红股，不以公积金转增股本。", "ctime": 1786693771, "time_str": "15:49:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260814/c678964191.shtml"}, {"id": "4959917", "title": "泓淋电力：2026年上半年净利润1.02亿元同比增10.84%", "content": "泓淋电力公告，2026年上半年营业收入22.93亿元，同比增长22.24%。归属于上市公司股东的净利润1.02亿元，同比增长10.84%。归属于上市公司股东的扣除非经常性损益的净利润1.02亿元，同比增长25.45%。", "ctime": 1786693549, "time_str": "15:45:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260814/c678964066.shtml"}, {"id": "4959915", "title": "水利部安排部署贾鲁河堤防险情应急处置工作", "content": "今天上午，水利部召开专题会商，启动水利部重大水旱灾害事件调度指挥机制，分析研判淮河流域沙颍河汛情形势和贾鲁河堤防险情，安排部署洪水防御和险情应对处置工作。一要加强雨水情监测预报，密切关注降雨和贾鲁河上游洪水演进过程，精准把握洪峰流量、水位、历时和洪水总量，及时将预报预警信息直达地方防御一线。二要立即开展地毯式排查，第一时间撤离洪水淹没区受影响人员；根据地形条件加快构筑第二道防线，尽量缩小洪水淹没影响范围。三要加强贾鲁河沿线及下游沙颍河干流等河道堤防巡查防守，配足人员、料物和设备，紧盯穿堤、交叉建筑物等重点河段部位，及时排查并处置管涌、渗漏等险情，确保沿线城市和堤防防洪安全。（央视新闻）", "ctime": 1786693459, "time_str": "15:44:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260814/c678964023.shtml"}, {"id": "4959909", "title": "现代汽车工会将于8月18日恢复薪资谈判", "content": "8月14日，据报道，现代汽车与工会将在中断正式谈判逾40天后，于8月18日恢复薪资谈判。现代汽车管理层提出恢复谈判后，工会暂停了原定于8月18日举行的6小时部分罢工。此前劳资双方在工作层面谈判中未能缩小分歧，工会累计举行44小时罢工。工会主要要求加薪、提高奖金、恢复被解雇工会成员职位以及延长退休年龄等。(界面)", "ctime": 1786693347, "time_str": "15:42:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260814/c678963970.shtml"}, {"id": "4959903", "title": "铜冠铜箔到三孚新科考察交流", "content": "8月13日，铜冠铜箔总经理印大维携团队到三孚新科考察交流，双方围绕高端铜箔产业链的技术研发与产业协同展开深入交流。此次考察交流，为铜冠铜箔与三孚新科在高端铜箔制备领域的工艺、化学品、设备与耗材等方面的产业协同与合作奠定基础。双方一致认为，高端铜箔作为电子信息与新能源产业的关键基础材料，其制造装备与专用材料的协同创新与国产替代，对提升产业链自主可控水平、支撑下游高性能铜箔需求具有重要意义。未来，双方将保持密切沟通，围绕铜箔产业高质量发展，共同探讨铜箔产业链上下游协同发展的更多可能。(人民财讯)", "ctime": 1786693303, "time_str": "15:41:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260814/c678963942.shtml"}, {"id": "4959897", "title": "欣界能源完成超1亿美元B轮融资", "content": "近日，欣界能源宣布完成超1亿美元B轮融资，由普华资本领投。本轮资金将主要用于锂金属固态电池量产和持续交付、研发团队扩建，以及新增3GWh高能量高安全固态电池量产线。新增产线预计于2026年底至2027年初陆续投产。(人民财讯)", "ctime": 1786693251, "time_str": "15:40:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260814/c678963912.shtml"}, {"id": "4959883", "title": "应急管理部调派救援力量驰援河南周口处置溃口险情", "content": "记者从应急管理部获悉，应急管理部调派中国安能工程救援力量200人，携带动力舟桥、水陆两栖挖掘机、装载机等大型工程机械装备110台（套），紧急驰援周口灾区。以上力量14日已到达现场投入抢险救援工作。 据了解，8月13日23时许，受贾鲁河上游来水和沙颍河倒灌顶托挤压影响，河南省周口市川汇区新北环桥下贾鲁河东岸堤坝出现溃口。 国家防灾减灾救灾委员会14日针对今年第13号台风“白海豚”残涡及强降雨对河南的严重灾害影响，启动国家四级救灾应急响应，前期派出的救灾工作组继续在灾区实地查看灾情，指导和协助地方做好灾情核查、群众转移安置、基本生活保障等救灾救助工作。 同日，国家防灾减灾救灾委员会办公室、应急管理部针对近期持续暴雨洪涝灾害导致河南周口、许昌等地险情灾情，根据灾区群众避险转移和安置救助需要，会同国家粮食和物资储备局调拨折叠床、褥子、毛毯、夏凉被、夏装、家庭应急包等3万件中央救灾物资，支持河南做好受灾群众安置救助工作。(新华社)", "ctime": 1786693092, "time_str": "15:38:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260814/c678963818.shtml"}, {"id": "4959865", "title": "国电南瑞：拟以5亿元-10亿元回购公司股份", "content": "国电南瑞公告，拟以不低于人民币5亿元（含本数）、不超过人 // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
