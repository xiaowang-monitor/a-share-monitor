ontent": "记者今天（3日）从国家开发银行了解到，国开行已于9月2日实现2026年新型政策性金融工具对首批3个民间投资和民间资本参与项目4.6亿元投放，全部用于补充项目资本金，支持重大项目建设，加大对民间投资项目支持力度。新型政策性金融工具是由国家开发银行、中国进出口银行、中国农业发展银行三家政策性银行设立，通过发行金融债券等方式筹集资金，专项用于补充国家战略基础设施项目和特定产业重大项目资本金缺口的特殊金融工具。2026年新型政策性金融工具规模由2025年的5000亿元扩容到8000亿元，预计可撬动8万亿元到11万亿元的总投资。（央视新闻）", "ctime": 1788434835, "time_str": "19:27:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260903/c679576050.shtml"}, {"id": "5101757", "title": "内蒙古自治区乌兰察布市委书记周凯接受纪律审查和监察调查", "content": "据内蒙古自治区纪委监委消息：内蒙古自治区乌兰察布市委书记周凯涉嫌严重违纪违法，目前正接受内蒙古自治区纪委监委纪律审查和监察调查。", "ctime": 1788434311, "time_str": "19:18:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260903/c679575200.shtml"}, {"id": "5101671", "title": "三安光电：实际控制人林秀成、副董事长兼总经理林科闯仍在留置中", "content": "三安光电公告，2026年9月3日收盘价格上涨9.98%。截至公告披露日，公司生产经营情况正常。2026年上半年度实现营业收入64.68亿元，同比下降28.04%；归属于上市公司股东的净利润亏损9790.45万元，扣除非经常性损益的净利润亏损5.04亿元。实际控制人林秀成、副董事长兼总经理林科闯仍在留置中；三安电子和三安集团持有公司股份13.12亿股已被司法冻结，累计被轮候冻结股份70.31亿股。", "ctime": 1788433995, "time_str": "19:13:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260903/c679575114.shtml"}, {"id": "5101653", "title": "鑫宏业：拟发行可转债募资不超11亿元", "content": "鑫宏业公告，公司拟向不特定对象发行可转换公司债券，募集资金总额不超过11亿元（含发行费用），扣除发行费用后用于轻量化金属复合导体线缆研发及产业化项目等项目及补充流动资金。本次发行尚待公司股东会审议及深圳证券交易所发行上市审核并报经中国证监会注册。", "ctime": 1788433831, "time_str": "19:10:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260903/c679575035.shtml"}, {"id": "5101647", "title": "圣诺生物：全资子公司利那洛肽胶囊获注册证书", "content": "圣诺生物公告，公司全资子公司成都圣诺生物制药有限公司于近日收到国家药品监督管理局签发的利那洛肽胶囊《药品注册证书》。该药品规格为290μg，注册分类为化学药品4类，获批准注册并发给药品注册证书。", "ctime": 1788433820, "time_str": "19:10:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260903/c679575029.shtml"}, {"id": "5101615", "title": "报告：全球AI算力狂飙加剧水资源压力 “水能协同”成绿色算力竞争新赛道", "content": "一份最新发布题为《AI时代算力基础设施流体系统水能绿色发展报告》的行业研究报告指出，随着人工智能技术的爆发式增长，算力基础设施快速扩张正在加剧能源与水资源供给压力。“水资源利用效率与算力规模扩张速度不匹配，进一步放大局部地区水资源供需矛盾。”报告认为，AI时代的核心竞争力已从单纯比拼算力规模，转向了算力、能源与水资源协同利用能力的综合较量。报告首次提出了流体系统“架构层—设备层—平台层”三层技术能力体系，以及分布式按需输配、泄漏风险分级、余热回收利用、智能泵控协同、多层冗余容错、数据闭环调控和介质全生命周期管理七项核心技术主张，为算力中心从单点节能向系统优化演进提供了清晰的技术路径。报告强调，算力基础设施的绿色发展重点，已从单一能效优化，扩展到算力增长、资源利用和运行韧性的协同平衡。未来行业竞争的关键，在于能否以更少的能源和水资源消耗支撑更多的算力增长。 (澎湃新闻)", "ctime": 1788433720, "time_str": "19:08:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260903/c679574994.shtml"}, {"id": "5101603", "title": "“Token贷”兴起 银行竞逐算力金融赛道", "content": "中国经济信息社刊发的《中经社信号|“Token贷”兴起 银行竞逐算力金融赛道》报道称，近期，广东省首个词元经济专项金融产品“Token贷”在广州市海珠区落地，中国银行广州分行为相关企业授信约2800万元。此外，建设银行、农业银行、江苏银行、上海农商银行、张家港农商银行等也纷纷落地算力相关信贷产品，将算力算效、词元（Token）消耗等纳入授信评价。（中国经济信息社）", "ctime": 1788433649, "time_str": "19:07:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260903/c679574898.shtml"}, {"id": "5101591", "title": "前7个月我国服务进出口总额同比增长8.3%", "content": "商务部3日发布数据显示，今年1至7月，我国服务进出口总额44467.1亿元，同比增长8.3%。数据显示，1至7月，我国服务出口17732.3亿元，同比增长17.1%；服务进口26734.8亿元，同比增长3.2%。服务贸易逆差9002.5亿元，同比缩小1763.3亿元。具体来看，旅行和运输服务出口对整体服务出口增长的贡献率超过50%。1至7月，旅行服务出口2636.1亿元，同比增长27.7%；运输服务出口3632.3亿元，同比增长27.1%。旅行和运输服务出口对整体服务出口增长的贡献率分别为22.1%和29.9%。知识密集型服务出口占比超过一半。1至7月，知识密集型服务进出口19606.2亿元，同比增长6.6%，占服务进出口总额的44.1%。知识密集型服务出口9482.8亿元，同比增长12.2%，占服务出口额的53.5%。（新华社）", "ctime": 1788433611, "time_str": "19:06:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260903/c679574882.shtml"}, {"id": "5101549", "title": "燧原科技中签号出炉", "content": "燧原科技发布首次公开发行股票并在科创板上市网下初步配售结果及网上中签结果公告，中签号码共有20,657个，每个中签号码只能认购500股燧原科技A股股票。中签结果见配图如下：", "ctime": 1788433437, "time_str": "19:03:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260903/c679574848.shtml"}, {"id": "5101521", "title": "Snowflake美股盘前涨超25%", "content": "Snowflake美股盘前涨超25%，现报383.0美元。", "ctime": 1788433386, "time_str": "19:03:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260903/c679574829.shtml"}, {"id": "5101507", "title": "2026医保国谈将于9月5日举行", "content": "记者3日从多家药企处获悉，2026年国家基本医保药品目录谈判竞价及商保创新药目录价格协商工作，将于9月5日在全国人大会议中心启动。国家医保局与谈判企业的预沟通已于上周完成。今年也将同步进行商保创新药目录的价格协商工作，制定新一版商保创新药目录。业内人士预计，今年国家医保目录调整现场谈判竞价及商保创新药目录价格协商将为期4～5天。（第一财经）", "ctime": 1788433347, "time_str": "19:02:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260903/c679574787.shtml"}, {"id": "5101359", "title": "布伦特原油日内涨2%，现报97.56美元/桶", "content": "布伦特原油日内涨2%，现报97.56美元/桶。", "ctime": 1788433197, "time_str": "18:59:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260903/c679574639.shtml"}, {"id": "5101341", "title": "迎丰股份：领航投资减持394.73万股，权益变动触及1%刻度", "content": "迎丰股份公告，持股5%以上股东海南迎丰领航创业投资合伙企业（有限合伙）减持计划期限届满，于2026年6月3日至2026年9月2日通过集中竞价交易减持394.73万股，占公司总股本的0.90%，减持总金额4114.52万元，尚未完成52700股。减持后，领航投资持有公司股份3394.74万股，占公司总股本的7.72%；其与一致行动人合计持股比例由61.89%变为60.99%，权益变动触及1%刻度。", "ctime": 1788432945, "time_str": "18:55:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260903/c679574571.shtml"}, {"id": "5101337", "title": "精智达：签订15.76亿元半导体测试设备合同", "content": "精智达公告，公司近日与某客户签订半导体测试设备采购协议，合同总金额为15.76亿元（含税），合同项下标的预计2年内完成交付；若合同顺利履行，预计将对公司2026年至2028年度经营业绩产生积极影响。", "ctime": 1788432938, "time_str": "18:55:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260903/c679574569.shtml"}, {"id": "5101327", "title": "韵达股份：回购实施完毕，回购1382.62万股，成交总额9989.52万元", "content": "韵达股份公告，公司此前拟以5000万元（含）-1亿元（含）回购股份，用于股权激励计划或员工持股计划，回购价格上限调整为10.12元/股。2026年9月2日，本次回购方案已实施完毕，累计回购1382.62万股，占公司目前总股本的0.48%，最低成交价6.17元/股，最高成交价8.05元/股，成交总额9989.52万元（不含交易费用）。", "ctime": 1788432885, "time_str": "18:54:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260903/c679574551.shtml"}, {"id": "5101323", "title": "德豪润达：子公司出售闲置资产成交970.6万元", "content": "德豪润达公告，公司董事会审议通过子公司芜湖德豪润达光电科技有限公司出售闲置资产事项，拟向铜陵市浩天再生资源科技股份有限公司、芜湖久晟再生资源有限公司处置53项厂务系统及机器设备，总成交价格970.6万元，实际成交金额以资产交割过磅金额为准。", "ctime": 1788432874, "time_str": "18:54:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260903/c679574548.shtml"}, {"id": "5101321", "title": "建投能源：控股股东持股比例被动稀释至57.80%", "content": "建投能源公告，因公司向特定对象发行人民币普通股2.31亿股，发行价格为7.32元/股，公司总股本由18.03亿股增加至20.34亿股，控股股东河北建设投资集团有限责任公司持股数量未发生变化，持股比例由65.21%被动稀释至57.80%。新增股份将于2026年9月7日在深交所上市，公司控股股东、实际控制人未发生变化。", "ctime": 1788432840, "time_str": "18:54:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260903/c679574535.shtml"}, {"id": "5101295", "title": "东阳光：完成回购1649.97万股，支付6亿元", "content": "东阳光公告，公司此前拟以3亿元~6亿元回购股份，回购价格不超过51.33元/股，回购股份拟用于员工持股计划或股权激励。截至公告披露日，公司已完成回购，实际回购1649.97万股，占总股本0.55%，回购价格区间为31.55元/股~37.81元/股，已支付总金额6亿元（不含交易费用）。", "ctime": 1788432671, "time_str": "18:51:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260903/c679574427.shtml"}, {"id": "5101259", "title": "尼泊尔有声音要求美印中等国提供气候赔偿，外交部：中国是绿色发展的坚定行动派", "content": "9月3日，外交部发言人郭嘉昆主持例行记者会。彭博社记者提问，此次泥石流灾害后，尼泊尔有声音要求美国、印度、中国等全球最大温室气体排放国提供气候赔偿。中方有何评论？郭嘉昆表示，气候变化是全球性挑战，需要各方团结应对。中国始终是世界绿色发展的坚定行动派和重要贡献者，正积极稳妥落实“双碳”目标，将完成全球最高碳排放强度降幅。郭嘉昆指出，作为最大的发展中国家，中国始终坚定维护广大发展中国家的正当合法权益，推动构建公平合理、合作共赢的全球气候治理体系，并通过南南合作渠道向其他发展中国家提供力所能及的帮助。“中尼是山水相连的命运共同体，中方也是此次跨境灾害的受灾方。中方愿同包括尼方在内的国际社会加强合作，共同预防和减少气候变化的不利影响。”郭嘉昆说。（澎湃新闻）", "ctime": 1788432482, "time_str": "18:48:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260903/c679574347.shtml"}, {"id": "5101211", "title": "石大胜华：控股子公司投资建设20万吨/年锂电池电解液项目", "content": "石大胜华公告，控股子公司胜华新材料科技（连江）有限公司拟投资建设20万吨/年锂电池电解液项目，预计总投资6.87亿元人民币，建设周期12个月。2026年9月3日，公司董事会以9票同意、0票反对、0票弃权审议通过该议案，无需提交公司股东会审议。", "ctime": 1788432158, "time_str": "18:42:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260903/c679574271.shtml"}, {"id": "5101209", "title": "宁夏以算电协同助力算力企业“增绿降本”", "content": "截至2026年8月底，宁夏算力企业用电量16.43亿千瓦时、同比增长117.44%；2025年，宁夏数据中心绿电消费占比达87.6%，到户电价每度电同比降低约0.03元，今年截至8月底每度电再降0.012元……\n\n亮眼成效背后是宁夏紧扣算力产业发展需求，创新算电协同机制，发挥市场交易效能，助力算力产业绿电消纳提升、用电成本降低“双赢”。截至目前，宁夏已投运数据中心企业17家，最大负荷达46.72万千瓦。宁夏算电协同的创新实践，既为“东数西算”筑牢绿色能源底座，也为新型电力系统建设下的跨产业协同发展，探索可复制、可推广的实践路径。(新华社)", "ctime": 1788432153, "time_str": "18:42:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260903/c679574267.shtml"}, {"id": "5101205", "title": "广东省新增1款已完成备案的生成式人工智能服务", "content": "截至9月3日，广东省新增1款已完成备案的生成式人工智能服务，累计已完成194款生成式人工智能服务备案。", "ctime": 1788432132, "time_str": "18:42:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260903/c679574262.shtml"}, {"id": "5101187", "title": "海通发展：拟募资不超20亿元购置16艘船舶", "content": "海通发展公告，公司拟向特定对象发行A股股票，募集资金总额不超过人民币20亿元，用于船舶购置项目，拟购置16艘船舶。大云溟投资、大岚投资拟分别认购金额不低于1亿元，合计不低于2亿元。本次发行相关事项已经第四届董事会第四十七次会议审议通过，尚需股东会审议通过，并经上交所审核通过及中国证监会同意注册。", "ctime": 1788431917, "time_str": "18:38:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260903/c679574228.shtml"}, {"id": "5101165", "title": "普京：俄美接触仍在继续 有 // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
