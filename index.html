itle": "酒钢宏兴：预计2026年上半年净亏损2.1亿元", "content": "酒钢宏兴公告，预计2026年半年度归属于上市公司股东的净利润为亏损2.1亿元左右，与上年同期相比减亏约4.39亿元；归属于上市公司股东扣除非经常性损益的净利润为亏损2.51亿元左右，与上年同期相比减亏约4.15亿元。2026年上半年，国内钢铁行业供需偏弱，钢材售价持续低位波动，铁矿石、煤炭等原燃料价格维持高位，钢铁行业盈利承压。", "ctime": 1784020216, "time_str": "17:10:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260714/c678168036.shtml"}, {"id": "4716163", "title": "天地源：预计2026年上半年净亏损3.7亿元到5.5亿元", "content": "天地源公告，预计2026年半年度实现归属于母公司所有者的净利润为亏损3.7亿元到5.5亿元，上年同期为亏损1.24亿元。报告期内，受公司房地产项目销售及结转影响，本报告期营业收入规模降低，毛利率下降，对应毛利贡献减少。", "ctime": 1784020109, "time_str": "17:08:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260714/c678167957.shtml"}, {"id": "4716161", "title": "天普股份：预计2026年上半年净利润亏损1650万元到1100万元", "content": "天普股份公告，预计2026年半年度实现归属于母公司所有者的净利润亏损1650万元到1100万元，与上年同期相比将出现亏损。预计2026年半年度实现归属于母公司所有者的扣除非经常性损益后的净利润亏损1500万元到1000万元。2026年上半年，受下游整车市场需求变化、产品结构调整等相关因素影响，公司营业收入同比下降，叠加汇兑损失、借款利息计提、补缴税款及滞纳金的影响，公司将出现亏损。", "ctime": 1784020104, "time_str": "17:08:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260714/c678167950.shtml"}, {"id": "4716155", "title": "宝胜股份：预计2026年半年度净利润同比增长65.36%到110.46%", "content": "宝胜股份公告，预计2026年半年度实现归属于上市公司股东的净利润1.1亿元到1.4亿元，与上年同期相比，同比增长65.36%到110.46%；预计2026年半年度实现归属于上市公司股东的扣除非经常性损益的净利润9000万元到1.25亿元，与上年同期相比，同比增长55.90%到116.53%。2026年上半年，公司以价值创造为目标，紧抓装备线缆、航空航天、人工智能等行业发展机遇，主动布局新兴赛道，持续挖掘增量客户资源，培育多元增长动能；同时深耕电力能源、三重市场等传统优势领域，夯实业务根基，筑牢公司经营基本盘。", "ctime": 1784020091, "time_str": "17:08:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260714/c678167935.shtml"}, {"id": "4716151", "title": "翠微股份：预计2026年上半年净亏损6500万元至8000万元", "content": "翠微股份公告，预计2026年半年度实现归属于上市公司股东的净利润为-8000万元到-6500万元，与上年同期相比，预计减亏1.23亿元到1.38亿元。预计2026年半年度实现归属于上市公司股东的扣除非经常性损益的净利润为-1.85亿元到-1.65亿元，与上年同期相比，预计减亏0.18亿元到0.38亿元。", "ctime": 1784020070, "time_str": "17:07:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260714/c678167921.shtml"}, {"id": "4716149", "title": "截至2026年6月底，全国机动车保有量达4.76亿辆", "content": "据公安部统计，截至2026年6月底，全国机动车保有量达4.76亿辆，其中汽车3.71亿辆；机动车驾驶人5.67亿人，其中汽车驾驶人5.33亿人。", "ctime": 1784020069, "time_str": "17:07:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260714/c678167919.shtml"}, {"id": "4716147", "title": "巨星农牧：预计2026年上半年净亏损7亿元到9亿元", "content": "巨星农牧公告，预计2026年半年度实现归属于母公司所有者的净亏损7亿元到9亿元。2026年上半年公司销售生猪280.77万头，但由于受到市场行情波动影响生猪销售价格出现大幅下降，公司生猪养殖业务的利润同比下降，导致公司2026年上半年的经营业绩出现亏损。", "ctime": 1784020050, "time_str": "17:07:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260714/c678167884.shtml"}, {"id": "4716145", "title": "长鸿高科：预计2026年上半年由盈转亏，净利润亏损5500万至6500万元", "content": "长鸿高科公告，预计2026年半年度归属于上市公司股东的净利润为-6500万元到-5500万元，上年同期为167.66万元，同比由盈转亏；预计扣非净利润为-7500万元到-6500万元。预亏主要原因：地缘局势带动原油及基础化工原料价格上行，原材料采购成本抬升，产品售价传导滞后，价差收窄；道路沥青价格暴涨导致道改产品采购放缓，行业需求不及预期，形成较多高价库存；公司产品结构转型升级爬坡期，高毛利新产品市场推广及产能释放尚需时间；碳酸钙板块因矿石品质波动、运营成本增加及市场价格偏弱，效益同比下滑；广东长鸿丙烯酸相关项目尚处建设阶段，未产生经营收益，建设及财务费用持续发生。", "ctime": 1784020038, "time_str": "17:07:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260714/c678167883.shtml"}, {"id": "4716143", "title": "国内首个，京津冀联合发布小客车油改电碳普惠标准", "content": "近日，京津冀三地同步发布《京津冀碳普惠项目减排量核算技术规范油改电小客车》区域协同地方标准（以下简称“标准”）。这是国内首个面向小客车油改电行为的跨区域碳普惠标准，统一了京津冀区域碳减排量核算规则，将绿色出行转化为可核算、可交易、可激励的碳资产，引导全民参与低碳转型。 燃油小客车是交通大气污染物排放和碳排放重要来源之一，小客车也是三地跨区域通勤的重要交通工具。此次标准的发布，统一了京津冀区域小客车油改电碳减排量核算规范，将“绿色行为”转化为“绿色资产”，有助于推动形成绿色生产生活方式。(新京报)", "ctime": 1784020032, "time_str": "17:07:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260714/c678167881.shtml"}, {"id": "4716141", "title": "同方股份：预计2026年上半年净亏损1.8亿元到1亿元", "content": "同方股份公告，预计2026年半年度实现归属于母公司所有者的净利润为亏损1.8亿元到1亿元，将出现亏损。预计2026年半年度实现归属于母公司所有者的扣除非经常性损益后的净利润为亏损3.1亿元到2.3亿元。2026年上半年，公司围绕既定战略，持续加大在核心技术研发、国际市场布局的投入，海外市场逆势增长，公共安全、数智产业等主业拓展势头良好。高压电源、探测器等核心元器件取得自主突破，安检大模型、核行业大模型实现迭代升级，自主导航式安检装备、空箱查验四足机器人等创新产品相继上市，在安保、口岸、交通、数字化及新基建领域实现市场突破，有力支撑交通枢纽、数字政务及新基建领域安全运行。", "ctime": 1784020032, "time_str": "17:07:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260714/c678167879.shtml"}, {"id": "4716137", "title": "望变电气：预计2026年半年度净利润同比减少61.56%到67.05%", "content": "望变电气公告，预计2026年半年度实现归属于母公司所有者的净利润为1800万元至2100万元，与上年同期相比减少3363万元至3663万元，同比减少61.56%到67.05%。预计2026年半年度实现归属于母公司所有者的扣除非经常性损益的净利润为100万元至400万元，与上年同期相比减少4522万元到4822万元，同比下降91.87%到97.97%。", "ctime": 1784020025, "time_str": "17:07:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260714/c678167875.shtml"}, {"id": "4716109", "title": "钧达股份：预计2026年上半年净亏损1.8亿元～2.7亿元", "content": "钧达股份公告，预计2026年1月1日至2026年6月30日归属于上市公司股东的净亏损为1.8亿元～2.7亿元，上年同期为亏损2.64亿元。扣除非经常性损益后的净亏损为2.8亿元～3.8亿元，上年同期为亏损4.65亿元。基本每股收益亏损0.6元/股～0.9元/股，上年同期亏损1.11元/股。受制于此前全球光伏需求高增长带动的产业链规模扩张，中国光伏行业阶段性出现产能过剩，自2023年下半年进入去产能周期，光伏产业链价格整体下行。2026年上半年，光伏行业整体受电价政策调整、国内装机下滑、海外贸易限制等多重因素影响，光伏行业各环节供需格局尚未实现实质性改善，产业链价格未见显著提升，因此公司经营业绩受到影响。", "ctime": 1784019965, "time_str": "17:06:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260714/c678167853.shtml"}, {"id": "4716107", "title": "五矿资本：预计2026年上半年净利润同比增长81%-117%", "content": "五矿资本公告，预计2026年上半年净利润为9.5亿元到11.4亿元，同比增长81%到117%。报告期内，公司紧扣金融监管导向，充分发挥产业金融综合服务优势，总体经营情况稳中向好。本期归属于母公司所有者的净利润较上年同期增幅较大，主要系公司信托、证券及期货等金融业务经营情况良好，综合盈利水平较上年同期有所提升，同时公司积极把握市场机遇，金融资产的公允价值变动收益以及权益法核算的长期股权的投资收益较去年同期大幅增加。", "ctime": 1784019961, "time_str": "17:06:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260714/c678167851.shtml"}, {"id": "4716105", "title": "山煤国际：预计2026年上半年净利润同比增长46.57%到57.26%", "content": "山煤国际公告，预计2026年半年度实现归属于上市公司股东的净利润为9.6亿元到10.3亿元，与上年同期相比，将增加3.05亿元到3.75亿元，同比增加46.57%到57.26%。公司预计2026年半年度实现归属于上市公司股东的扣除非经常性损益的净利润为9.95亿元到10.65亿元，与上年同期相比，将增加3.13亿元到3.83亿元，同比增加45.88%到56.14%。报告期内，归属于本公司股东的净利润同比增长的主要原因，一是2026年上半年受煤炭行业供需形势变化影响，公司煤炭综合售价同比上升；二是公司精准调控生产节奏、持续优化产销联动，煤炭销售量同比提升。", "ctime": 1784019956, "time_str": "17:05:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260714/c678167847.shtml"}, {"id": "4716103", "title": "原尚股份：预计2026年上半年净亏损3900万元至4400万元", "content": "原尚股份公告，预计2026年半年度实现归属于母公司所有者的净利润为-3900万元至-4400万元，预计2026年半年度实现归属于母公司所有者的扣除非经常性损益后的净利润为-4100万元至-4600万元。本期业绩预告期间为2026年1月1日至2026年6月30日。本期业绩预亏的主要原因为营业收入结构性调整，部分业务盈利水平不及预期，综合毛利率有所回落。", "ctime": 1784019951, "time_str": "17:05:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260714/c678167843.shtml"}, {"id": "4716085", "title": "东方通信：预计2026年上半年净利润同比增长142.58%", "content": "东方通信公告，预计2026年半年度实现归属于母公司所有者的净利润为3.2亿元左右，同比增长142.58%左右。预计2026年半年度实现归属于母公司所有者的扣除非经常性损益后的净利润为2300万元左右，同比增长786.00%左右。本期公司处置交易性金融资产产生大额投资收益及期末持有的交易性金融资产产生公允价值变动损益的影响，同时本期公司经营利润增加。", "ctime": 1784019883, "time_str": "17:04:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260714/c678167799.shtml"}, {"id": "4716081", "title": "中原证券：预计2026年上半年净利润同比增长45.98%到65.19%", "content": "中原证券公告，预计2026年半年度实现归属于母公司所有者的净利润人民币3.8亿元到人民币4.3亿元，与上年同期相比，将增加人民币1.2亿元到人民币1.7亿元，同比增加45.98%到65.19%。预计2026年半年度实现归属于母公司所有者的扣除非经常性损益的净利润人民币3.6亿元到人民币4.1亿元，与上年同期相比，将增加人民币1.07亿元到人民币1.57亿元，同比增加42.17%到61.91%。", "ctime": 1784019874, "time_str": "17:04:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260714/c678167790.shtml"}, {"id": "4716077", "title": "航天信息：预计2026年上半年净亏损3.6亿元到4.6亿元", "content": "航天信息公告，预计2026年上半年净亏损3.6亿元到4.6亿元。随着政策、技术、市场环境变化，数字财税行业向智能化、合规化、无纸化演进，业务形态从SaaS向RaaS演化，航天信息持续投入、大力推广面向三类客群统一标准的智税、云税、微税、易账等“拳头”产品，并基于人工智能围绕合规风控、智能税务、穿透式监管等新需求打造数字财税创新产品。同时，智慧、网信业务紧抓数据要素与人工智能技术深度协同、双向赋能的变化趋势，着力聚焦、重点培育细分领域业务。总体上，公司主营业务正在加速系统性重构，营业规模和毛利水平仍面临较大下行压力。", "ctime": 1784019868, "time_str": "17:04:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260714/c678167787.shtml"}, {"id": "4716073", "title": "泰瑞机器：预计2026年上半年净利润同比减少85.81%至81.38%", "content": "泰瑞机器公告，预计2026年半年度实现归属于母公司所有者的净利润约800万元到1050万元，与上年同期相比，将减少4839.73万元到4589.73万元，同比减少85.81%至81.38%。预计2026年半年度实现归属于母公司所有者的扣除非经常性损益的净利润约520万元到780万元，与上年同期相比，将减少4798.62万元到4538.62万元，同比减少90.22%至85.33%。", "ctime": 1784019862, "time_str": "17:04:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260714/c678167780.shtml"}, {"id": "4716057", "title": "同庆楼：预计2026年上半年净利润同比下降98.29%-97.47%", "content": "同庆楼公告，预计2026年半年度实现归属于母公司所有者的净利润为123.16万元至181.94万元，同比减少98.29%至97.47%；预计2026年半年度实现归属于母公司所有者的扣除非经常性损益的净利润为31.57万元至46.64万元，同比减少99.53%至99.31%。上年同期归属于母公司所有者的净利润为7199.86万元，归属于母公司所有者的扣除非经常性损益的净利润为6716.32万元。", "ctime": 1784019819, "time_str": "17:03:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260714/c678167756.shtml"}, {"id": "4716055", "title": "宁波韵升：预计2026年上半年净利润同比增长122.56%到187.48%", "content": "宁波韵升公告，预计2026年半年度实现归属于上市公司股东的净利润为2.4亿元到3.1亿元，与上年同期相比增长122.56%到187.48%。预计2026年半年度实现归属于上市公司股东的扣除非经常性损益的净利润为2.1亿元到2.8亿元，与上年同期相比增长137.01%到216.01%。报告期内，公司坚持以客户需求为导向，深度聚焦新能源汽车、消费电子、工业及其他应用领域，积极开拓新兴市场和区域市场，把握新项目发展契机，持续优化业务构成，提高海外收入比例。与此同时，公司不断深化精细化管理，促使产品毛利上升导致净利润增加。", "ctime": 1784019815, "time_str": "17:03:35", "stock_code": "", "stock_name": "", 9756, "time_str": "17:02:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260714/c678167720.shtml"}, {"id": "4716019", "title": "中国人民银行将开展14000亿元买断式逆回购操作 期限为6个月（184天）", "content": "为保持银行体系流动性充裕，2026年7月15日，中国人民银行将以固定数量、利率招标、多重价位中标方式开展14000亿元买断式逆回购操作，期限为6个月（184天），到期日为2027年1月15日（遇节假日顺延）。(央行)", "ctime": 1784019716, "time_str": "17:01:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260714/c678167672.shtml"}, {"id": "4716017", "title": "时空科技：预计2026年上半年净亏损2600万元至3200万元", "content": "时空科技公告，预计2026年半年度归属于母公司所有者的净利润为亏损2600万元至3200万元，上年同期亏损6627.46万元。预计归属于母公司所有者的扣除非经常性损益后的净利润为亏损2700万元至3300万元。本报告期，公司所处行业景气度未发生较大变化，受战略转型影响各项成本支出相对刚性，本期经营业绩仍为亏损；但受益于部分项目结算及回款，前期计提的信用及资产减值损失冲回，导致本期亏损有所收窄。", "ctime": 1784019710, "time_str": "17:01:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260714/c678167669.shtml"}, {"id": "4716015", "title": "建设机械：预计2026年半年度净亏损5亿元", "content": "建设机械公告，预计2026年半年度归属于上市公司的净亏损5亿元左右，归属于上市公司股东扣除非经常性损益后的净亏损5.1亿元左右。2026年上半年，国内塔机租赁市场需求端未有明显改善，工程建设项目新开工面积同比减少，虽然公司近年来逐步降低房地产比重，顺应市场实施区域化整合，但是设备利用率和设备租赁价格仍处于低位水平。以上因素导致公司半年度利润出现亏损。", "ctime": 1784019705, "time_str": "17:01:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260714/c678167664.shtml"}, {"id": "4716013", "title": "国检集团：预计2026年上半年净亏损2059.44万元", "content": "国检集团公告，预计2026年半年度实现归属于母公司所有者的净利润为-2059.44万元，与上年同期（法定披露数据）相比，将出现亏损，同比下降2640.65万元。预计2026年半年度实现归属于母公司所有者的扣除非经常性损益后的净利润为-3897.64万元，同比下降2200.26万元。报告期内，公司营业收入保持稳定，利润端受阶段性因素影响有所波动。从外部环境看，传统业务板块受上下游行业景气度不足、市场竞争加剧影响，业务量和价格承压；从内部发展看，公司战新产业转型仍在投入期，尚未完全对冲传统业务的周期性影响，此外，公司在精益化管理、数智化水平以及业务协同机制方面仍存在提升空间；财务方面，受下游客户资金安排及项目付款进度影响，公司应收账款回收周期有所拉长，公司严格执行会计准则，按照既定坏账计提政策审慎计提信用减值准备，本期信用减值损失同比增加。", "ctime": 1784019696, "time_str": "17:01:36", "stock_code": " const SECTORS  = [{"name": "金融", "hit_count": 23, "etfs": []}, {"name": "数据要素", "hit_count": 19, "etfs": []}, {"name": "人工智能", "hit_count": 11, "etfs": []}, {"name": "新能源", "hit_count": 11, "etfs": []}, {"name": "消费", "hit_count": 10, "etfs": []}, {"name": "地产", "hit_count": 10, "etfs": []}, {"name": "军工", "hit_count": 9, "etfs": []}, {"name": "半导体", "hit_count": 8, "etfs": []}];
const META     = {"update_time": "2026-07-14 17:14:04", "sentiment_score": 44.713656387665196, "agents": []};

// 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}
