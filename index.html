: "5323835", "title": "商务部新闻发言人就法德要求欧盟强化贸易防御等保护主义工具答记者问", "content": "商务部新闻发言人就法德要求欧盟强化贸易防御等保护主义工具答记者问。问：据媒体报道，10月5日法国和德国向欧委会提交非正式文件，要求欧盟强化使用贸易防御措施，并推出多项保护主义新工具。请问中方对此有何评论？答：中方注意到有关报道。中方始终认为，相互依赖不是风险，利益交融不是威胁，开放合作才是发展的正道。保护主义提升不了竞争力，脱钩断链只会损人不利己。希望法国和德国作为全球重要经济体，能够坚持开放合作和自由贸易，遵守世贸规则，不要鼓动欧盟动辄使用保护主义工具，更不要将经贸问题政治化和泛安全化，避免以错误方式走错误道路并最终反噬自己。（财联社）", "ctime": 1791289207, "time_str": "20:20:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261006/c680444882.shtml"}, {"id": "5323739", "title": "美国至9月19日当周ADP就业人数周度变动为2.375万人，前值2万人", "content": "美国至9月19日当周ADP就业人数周度变动为2.375万人，前值2万人。（财联社）", "ctime": 1791288981, "time_str": "20:16:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261006/c680444876.shtml"}, {"id": "5323703", "title": "现货白银价格涨超1%", "content": "现货黄金价格涨0.94%，报4179.32美元/盎司；现货白银价格涨1.05%，报61.68美元/盎司。", "ctime": 1791288890, "time_str": "20:14:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261006/c680444872.shtml"}, {"id": "5323697", "title": "谷歌推出Google Cloud现代化改造组合，包含AI驱动的迁移和现代化工具", "content": "谷歌推出Google Cloud现代化改造组合，包含AI驱动的迁移和现代化工具。（财联社）", "ctime": 1791288879, "time_str": "20:14:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261006/c680444871.shtml"}, {"id": "5323681", "title": "2026年西部陆海新通道铁海联运班列运量突破100万标箱", "content": "从中国铁路南宁局集团获悉，截至10月6日，2026年西部陆海新通道铁海联运班列集装箱运输量已突破100万标箱，通道保通保畅能力持续增强，为西南地区外贸经济平稳发展、畅通国内国际双循环提供有力运力支撑。（财联社）", "ctime": 1791288636, "time_str": "20:10:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261006/c680444862.shtml"}, {"id": "5323601", "title": "纽约期银日内涨1%，现报61.92美元/盎司", "content": "纽约期银日内涨1%，现报61.92美元/盎司。", "ctime": 1791288324, "tim "}, {"id": "5323211", "title": "菲律宾宣称中国军队和海警在南海两处海域滋扰菲方飞机和船只 外交部驳斥", "content": "2026年10月6日外交部发言人郭嘉昆答记者问。法新社记者：4日，菲律宾方面称，中国军队和海警在南海两处海域滋扰菲律宾政府的飞机和船只。外交部对此有何评论？郭嘉昆：中国对黄岩岛和包括中业岛、铁线礁在内的南沙群岛及其附近海域拥有主权，对相关海域拥有主权权利和管辖权。菲律宾的领土范围是由一系列国际条约确定的，黄岩岛和南沙群岛不在菲律宾领土范围之内。近日，菲方飞机和船只未经中方允许，擅自闯入中国管辖海空域，干扰中方正常执法，严重侵犯中国主权和管辖权，蓄意破坏南海和平稳定。中国军队和海警依法采取措施应对，正当合理。中方坚决反对菲律宾损害中国主权和权益的任何行径，将继续采取必要措施，坚定捍卫自身在南海的领土主权和海洋权益。中方正告菲方，立即停止侵权挑衅。（财联社）", "ctime": 1791287447, "time_str": "19:50:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261006/c680444748.shtml"}, {"id": "5323143", "title": "外交部：中国一贯严格履行应尽的国际义务，反对借战事关联抹黑中国", "content": "2026年10月6日外交部发言人郭嘉昆答记者问。路透社记者：美国官员向本社表示，他们认为伊朗已从中国获得了卫星定位情报以及其他疑似定位信息。中方对此有何回应？郭嘉昆：中国一贯严格履行应尽的国际义务。我们反对借战事关联抹黑中国。（外交部）", "ctime": 1791287082, "time_str": "19:44:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261006/c680444738.shtml"}, {"id": "5323137", "title": "英国考虑对中国电动汽车提高关税，外交部回应", "content": "2026年10月6日外交部发言人郭嘉昆答记者问。《金融时报》记者：据报道，英国政府正在考虑对来自中国的电动汽车提高进口关税。中方对此有何评论？郭嘉昆：有关具体问题请询中方主管部门。经贸关系的本质是发挥各自比较优势，实现互利共赢。中国电动汽车产业的发展，为包括英国在内的全球消费者提供了有竞争力的选择，也为绿色低碳转型作出了积极贡献，是供不应求的优质产能。（财联社）", "ctime": 1791286971, "time_str": "19:42:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261006/c680444734.shtml"}, {"id": "5323133", "title": "外交部：中欧产业链供应链深度交融、相互依存 双方经贸关系本质上是互利共赢的", "content": "2026年10月6日外交部发言人郭嘉昆答记者问。彭博社记者：据报道，德法方面致信欧委会主席冯德莱恩，呼吁赋予欧盟新权限，对扰乱贸易关系的国家取消欧洲单一市场准入。信中还提议设立机制，推动欧洲降低在多条供应链上对外国的依赖。信中并未点名中国，但欧盟当前正在研究调整对华贸易关系。外交部对此有何评论？这是否会对欧委会贸易和经济安全委员谢夫乔维奇本周晚些时候的访华行程产生影响？郭嘉昆：中欧产业链供应链深度交融、相互依存，双方经贸关系本质上是互利共赢的。希望欧方同中方相向而行，通过对话协商解决彼此关切，共同维护全球产供链稳定畅通，推动中欧经贸关系健康稳定发展。关于你提到的具体问题，请向中方主管部门询问。（财联社）", "ctime": 1791286956, "time_str": "19:42:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261006/c680444733.shtml"}, {"id": "5323103", "title": "冯德莱恩：袭击黑海民用船只的行为不可接受", "content": "欧盟委员会主席冯德莱恩当地时间10月6日在社交媒体发文表示，袭击民用船只的行为不可接受。冯德莱恩说，商船及船员正成为袭击目标，已经有人在海上丧生。虽然有关事件的具体情况仍在调查中，但黑海局势的发展令人担忧。（央视新闻）", "ctime": 1791286556, "time_str": "19:35:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261006/c680444726.shtml"}, {"id": "5323093", "title": "穆迪评级上调4家头部券商评级", "content": "穆迪评级近日将4家券商的长期发行人评级从Baa1上调至A3。这4家券商分别是：中金公司、中金国际、中信证券以及国泰海通证券。此外，稍早前几日，国际评级机构标普上调了中国证券业的评级。穆迪评级表示，对上述券商的评级行动反映了穆迪认为这些公司在必要时获得官方支持的可能性有所上升。这些公司对于中国实现国家经济和金融政策目标的战略重要性日益提升，而且在中国资本市场的运行与发展中发挥着重要作用。多家头部券商对此做出回应。中信证券表示，将以本次评级上调为契机，进一步拓宽境外融资渠道、降低跨境资金成本，持续提升国际公信力与品牌影响力，加快一流投资银行和投资机构建设，持续赋能实体经济，助力金融强国建设。（证券时报）", "ctime": 1791286490, "time_str": "19:34:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261006/c680444724.shtml"}, {"id": "5322933", "title": "多家券商研判A股四季度行情：中性乐观，科技或仍有机会", "content": "“十一”长假结束后，A股将正式进入四季度的交易时间，届时市场行情将如何演绎？整体来看，多家券商对四季度的A股均保持了一定程度的乐观态度。例如，浙商证券便预计，四季度“菱形结构”仍将延续，特别是对四季度的国内政策、宽基估值评价中性偏乐观，因此总体对A股市场走势保持中性乐观态度。“经历三季度的震荡回调后，我们认为本轮牛市还未结束、仍有演绎空间。”国信证券表示。湘财证券预计，2026年第四季度多数时间宏观面和基本面保持较强格局，市场有望表现为盈利防御慢牛。配置方面，多家券商认为，科技仍有第二波机会，因此AI依然是四季度的配置主线之一。（财联社）", "ctime": 1791285705, "time_str": "19:21:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261006/c680444707.shtml"}, {"id": "5322925", "title": "拉脱维亚总统委托总理组建新内阁", "content": "拉脱维亚总统林克维奇斯当地时间6日宣布委托现任总理安德里斯·库尔贝格斯组建新内阁。库尔贝格斯领导的政党联盟“联合名单”在议会选举中赢得了最多席位。总统希望新政府能在11月前组建完成，但并未设定具体期限。（央视新闻）", "ctime": 1791285565, "time_str": "19:19:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261006/c680444704.shtml"}, {"id": "5322897", "title": "德国选择党候选人当选萨安州议长", "content": "德国萨克森-安哈尔特州（萨安州）议会今天（10月6日）选举议长。托比亚斯·劳施作为德国选择 const SECTORS  = [{"name": "金融", "hit_count": 58, "etfs": []}, {"name": "人工智能", "hit_count": 42, "etfs": []}, {"name": "半导体", "hit_count": 27, "etfs": []}, {"name": "数据要素", "hit_count": 26, "etfs": []}, {"name": "消费", "hit_count": 26, "etfs": []}, {"name": "军工", "hit_count": 12, "etfs": []}, {"name": "地产", "hit_count": 12, "etfs": []}, {"name": "医药", "hit_count": 10, "etfs": []}];
const META     = {"update_time": "2026-10-06 22:08:09", "sentiment_score": 58.69565217391305, "agents": []};

// 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
