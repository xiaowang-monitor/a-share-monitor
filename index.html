  height: 6px; border-radius: 3px; background: #1e293b; overflow: hidden;
}
.score-bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s; }
.up { color: var(--red); }
.down { color: var(--green); }
.pulse { animation: pulse 2s infinite; }
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}
.glow { box-shadow: 0 0 20px rgba(59,130,246,0.15); }

": 1780559167, "time_str": "15:46:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260604/c677216619.shtml"}, {"id": "4461549", "title": "香山股份：定增发行价调整为不低于交易均价的80%", "content": "香山股份公告，公司此前披露拟向特定对象发行股票，现调整发行价格和发行数量：发行价格由24.47元/股调整为不低于定价基准日前二十个交易日公司股票交易均价的80%，发行数量由不超过2637.11万股调整为不超过本次发行前总股本的30%且不超过原拟发行数量，募集资金总额不超过6.45亿元保持不变。公司补充说明，本次变更不构成重大变化。", "ctime": 1780559122, "time_str": "15:45:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260604/c677216594.shtml"}, {"id": "4461541", "title": "湖北宜化：向不特定对象发行可转换公司债券申请获得同意注册批复", "content": "湖北宜化公告，公司于近日收到中国证券监督管理委员会出具的《关于同意湖北宜化化工股份有限公司向不特定对象发行可转换公司债券注册的批复》（证监许可〔2026〕1267号）。批复同意公司向不特定对象发行可转换公司债券的注册申请。公司本次发行应严格按照报送深圳证券交易所的申报文件和发行方案实施。本批复自同意注册之日起12个月内有效。公司董事会将根据上述批复文件和相关法律法规的要求以及公司股东会的授权，在规定期限内办理本次向不特定对象发行可转换公司债券相关事宜，并及时履行信息披露义务。", "ctime": 1780559094, "time_str": "15:44:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260604/c677216580.shtml"}, {"id": "4461539", "title": "葵花药业：盐酸氨溴索口服溶液申请注册上市许可获得受理", "content": "葵花药业公告，全资子公司哈尔滨葵花药业有限公司于近日收到国家药品监督管理局下发的关于盐酸氨溴索口服溶液申请注册上市许可的《受理通知书》。产品名称为盐酸氨溴索口服溶液，剂型为口服溶液剂，受理号为CYHS2601288，申请事项为境内生产药品注册上市许可，注册分类为化学药品4类，拟定适应症为用于急、慢性支气管炎引起的痰液粘稠、咳痰困难。", "ctime": 1780559087, "time_str": "15:44:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260604/c677216576.shtml"}, {"id": "4461521", "title": "鲁比奥：俄乌谈判陷停滞 美国并非“中立”调停", "content": "美国国务卿鲁比奥3日说，近几个月，俄罗斯和乌克兰之间的谈判陷入停滞，局势存在升级风险。鲁比奥当天在美国国会参议院拨款委员会一个小组委员会的听证会上说，俄乌冲突无法通过军事手段解决，只能通过外交途径解决，但这一途径迄今未取得成效。“双方似乎都尚未准备作出达成协议所需的让步，因此前景并不乐观。”他说，俄罗斯具备实施远程打击的能力，但乌克兰也有能力对等反击，这意味着“局势升级的风险真实存在，且比两年前更为真切”。（新华社）", "ctime": 1780559021, "time_str": "15:43:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260604/c677216554.shtml"}, {"id": "4461519", "title": "华锐精密：董事高江雄减持0.0093%股份，李志祥丁国峰提前终止减持", "content": "华锐精密公告，公司于2026年3月14日披露董事、高级管理人员减持计划。截至公告日，董事高江雄通过集中竞价减持9261股（占0.0093%），减持计划实施完毕；董事李志祥减持7800股（占0.0078%），董事会秘书段艳兰减持7938股（占0.0079%），副总经理丁国峰减持7800股（占0.0078%）。其中，李志祥、丁国峰结合自身资金需求决定提前终止本次减持计划。", "ctime": 1780559019, "time_str": "15:43:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260604/c677216553.shtml"}, {"id": "4461515", "title": "以军称对黎南部真主党设施的打击还在继续", "content": "总台记者获悉，当地时间4日，以色列国防军阿拉伯语发言人阿德拉伊发表声明称，目前黎巴嫩南部的战斗仍在继续，以色列国防军正在持续打击位于黎巴嫩当地村庄内及附近的黎真主党设施。阿德拉伊表示，出于安全考虑，强烈要求黎巴嫩民众在收到进一步通知之前，切勿向扎赫拉尼河以南方向移动。任何前往该地区的人都将面临生命危险。（央视新闻）", "ctime": 1780559009, "time_str": "15:43:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260604/c677216534.shtml"}, {"id": "4461465", "title": "韩元兑美元汇率跌破2009年3月以来最低水平", "content": "韩元兑美元汇率跌破2009年3月以来最低水平。", "ctime": 1780558854, "time_str": "15:40:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260604/c677216421.shtml"}, {"id": "4461459", "title": "工信部：面向沉浸式通信、工业制造、低空经济、具身智能、智慧海洋等6G潜在场景 因地制宜开展6G应用场", "content": "工业和信息化部办公厅发布关于组织开展6G创新发展部省协同试点专项行动的通知。重点任务方面，面向沉浸式通信、工业制造、低空经济、具身智能、智慧海洋等6G潜在场景，发挥政策、数据、人才、资本等要素支撑作用，强化审批、用频、用地等要素保障，因地制宜开展6G应用场景培育。组织垂直行业企业联合通信企业共同开展6G应用场景和安全解决方案适配验证，探索6G新型应用需求。鼓励中小企业深度参与场景需求挖掘、商业模式探索等，促进6G应用繁荣发展。", "ctime": 1780558826, "time_str": "15:40:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260604/c677216411.shtml"}, {"id": "4461441", "title": "工信部：加强新型终端、芯片器件、操作系统、商业航天等6G关联产业培育", "content": "工业和信息化部办公厅发布关于组织开展6G创新发展部省协同试点专项行动的通知。重点任务方面，加强产业研发协同。结合6G标准和产业发展节奏，加强6G基站、核心网、承载网、专用仪器仪表等通信设备产业研发，提升产品性能和安全保障水平，支撑6G商用部署。优化关联产业研发布局，加强新型终端、芯片器件、操作系统、商业航天等6G关联产业培育，打造地方6G特色产业集群。", "ctime": 1780558732, "time_str": "15:38:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260604/c677216306.shtml"}, {"id": "4461419", "title": "乌克兰称多地遭袭断电", "content": "当地时间6月4日，乌克兰能源部发布消息称，受战事冲突及能源设施遭袭击影响，乌克兰多州部分区域暂时断电。乌克兰能源部指出，相关袭击目标不仅包含当地能源基础设施，能源行业一线工作人员也遭到波及。当天上午，苏梅州电力公司一辆公务车遭遇俄方无人机袭击，造成一名企业员工受伤。目前受伤人员已被送往医院接受救治。（央视新闻）", "ctime": 1780558528, "time_str": "15:35:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260604/c677216193.shtml"}, {"id": "4461417", "title": "多伦科技：多名董事及高管已增持30.15万股", "content": "多伦科技公告，董事李毅、张铁监、阮蔚及副总经理吕梅于2026年6月3日至6月4日通过上交所集中竞价合计增持A股30.15万股，金额204.31万元。其中李毅增持75000股/50.17万元；张铁监75800股/51.32万元；阮蔚73700股/50.4万元；吕梅77000股/52.42万元。本次增持不触及权益变动，暂无后续增持计划。", "ctime": 1780558508, "time_str": "15:35:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260604/c677216186.shtml"}, {"id": "4461409", "title": "鼎通科技：向不特定对象发行可转债申请获同意", "content": "鼎通科技公告，公司收到中国证券监督管理委员会出具的《关于同意东莞市鼎通精密科技股份有限公司向不特定对象发行可转换公司债券注册的批复》（证监许可〔2026〕1266号），同意公司向不特定对象发行可转换公司债券的注册申请。公司本次发行应严格按照报送上海证券交易所的申报文件和发行方案实施。本批复自同意注册之日起12个月内有效。", "ctime": 1780558435, "time_str": "15:33:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260604/c677216140.shtml"}, {"id": "4461407", "title": "概伦电子：重组事项将于2026年6月10日上会审核", "content": "概伦电子公告，公司拟通过发行股份及支付现金的方式购买成都锐成芯微科技股份有限公司100%股权及纳能微电子（成都）股份有限公司45.64%股权，并募集配套资金。根据上海证券交易所并购重组审核委员会公告，上交所并购重组审核委员会定于2026年6月10日召开2026年第8次并购重组审核委员会审议会议，审核公司本次交易的申请。本次交易尚需履行的决策和审批程序，包括但不限于经上交所审核通过并获中国证券监督管理委员会注册。", "ctime": 1780558428, "time_str": "15:33:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260604/c677216121.shtml"}, {"id": "4461399", "title": "思特威：向特定对象发行股票申请获同意", "content": "思特威公告，公司于近日收到中国证券监督管理委员会出具的《关于同意思特威（上海）电子科技股份有限公司向特定对象发行股票注册的批复》（证监许可〔2026〕1285号）。批复文件同意公司向特定对象发行股票的注册申请。本次发行应严格按照报送上海证券交易所的申报文件和发行方案实施。本批复自同意注册之日起12个月内有效。", "ctime": 1780558373, "time_str": "15:32:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260604/c677216042.shtml"}, {"id": "4461395", "title": "商务部公告2026年第22号 公布对原产于韩国、泰国和马来西亚的进口共聚聚甲醛反倾销措施相关企业税率继承的决定", "content": "2026年4月17日和4月22日，商务部分别收到大赛璐工程塑料马来西亚有限公司(Daicel HPP Malaysia Sdn. Bhd.)和可隆工业株式会社(KOLON INDUSTRIES, INC.)提交的申请。上述公司请求分别继承宝理塑料(亚太)公司(Polyplastics Asia Pacific Sdn. Bhd.)和可隆ENP株式会社(KOLON ENP，INC.)在对原产于韩国、泰国和马来西亚的共聚聚甲醛反倾销措施中适用的反倾销税率和其他权利义务。商务部对此进行了调查并作出继承税率的决定。", "ctime": 1780558318, "time_str": "15:31:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260604/c677216019.shtml"}, {"id": "4461377", "title": "杭州二手房市场走热 连续三个月成交超9000套", "content": "据杭州贝壳研究院发布数据，杭州已连续三个月网签单量超9000套，其中5月网签量9087套，同比提升17.8%，创近六年同期新高。杭州贝壳研究院院长上官剑受访时表示，当前杭州二手房市场整体仍处于“以价换量”阶段，刚需依然是市场绝对主力。5月份，总价200万元人民币以内刚需房源成交占比达56%；60平方米至90平方米中小刚需户型成交占比39.1%。从“金三银四”到“红五月”，上官剑认为，一方面政策环境持续优化，吸引更多新市民和外来人口入场。另一方面，杭州楼市低总价的优质新房供应有限，而二手房房源丰富，承接了大量刚需购房需求。从市场存量来看，5月份，杭州二手房市场新增挂牌量环比下降6%，同比下降19%。新增供给虽然有所放缓，但整体挂牌量达18.9万套，仍处于历史相对高位。（中新网）", "ctime": 1780558197, "time_str": "15:29:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260604/c677215956.shtml"}, {"id": "4461367", "title": "外交部：炮制借口、造谣抹黑不能成为美对古巴野蛮封锁的理由", "content": "6月4日，外交部发言人毛宁主持例行记者会。\n\n有记者提问，据报道，6月2日美国国务卿鲁比奥接受美参议院外交委员会质询，有参议员表示拜登政府时期美情报部门未发现古巴支恐行为。鲁比奥回应称，古巴曾支持西半球几乎所有左翼激进暴力恐怖组织，不需要什么证据。鲁比奥还表示，古巴需要新的领导层，以严肃改革实现转型，才能让古巴不再是对华盛顿的威胁。同日媒体报道称，因美国对古巴实施石油禁运政策，古巴国内运输困难，导致联合国拟为古巴提供的2万吨食品无法顺利分发。中方对此有何评论?\n\n毛宁表示，炮制借口、造谣抹黑不能成为美方对古巴野蛮封锁、非法制裁的理由。美方长期对古巴实施单边制裁封锁，严重冲击古巴经济民生，给古巴人民造成巨大灾难，国际社会普遍反对。\n\n“中方坚定支持古巴维护国家主权和安全，反对外来干涉。美方应倾听国际社会呼声，立即全面终止对古巴的封锁制裁和胁迫施压。”毛宁说。(澎湃新闻)", "ctime": 1780558100, "time_str": "15:28:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260604/c677215829.shtml"}, {"id": "4461359", "title": "外交部：希望欧方客观理性看待中欧经贸关系", "content": "外交部发言人毛宁今日在例行记者会上回答有关中欧经贸关系的提问时说，贸易保护主义违背经济规律，损人不利己。希望欧方客观理性看待中欧经贸关系，同中方一道压缩问题清单，做大合作蛋糕，实现互利共赢。毛宁表示，中欧经贸合作源于共同利益，本质上是比较优势和市场竞争共同作用的结果。优势互补不是风险，利益融合也不是威胁。越来越多的欧洲企业选择深耕中国，扩大在华业务，这本身就是对所谓“去风险”最有力的回应。（新华社）", "ctime": 1780558009, "time_str": "15:26:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260604/c677215711.shtml"}, {"id": "4461347", "title": "SAP大中华区总裁原欣：AI时代的企业壁垒，不在于有多少智能体", "content": "6月4日下午消息 ，在2026 SAP中国峰会上，SAP首次面向中国市场阐述了“自主运营企业”战略愿景——定义了一种从“人工驱动流程”迈向“AI驱动业务结果”的全新企业运行模式。该愿景本质是希望AI深度融入企业流程、数据与治理体系，使其能真正理解并参与企业运营逻辑，从而推动企业系统从“记录业务”走向“运行业务”。SAP大中华地区总裁原欣表示：“AI能为企业创造多大价值，不取决于模型能力有多强，而取决于企业最薄弱的一环能否打通，对今天大多数企业而言，这道‘弱链’就是AI与核心业务系统之间的断层。”在她看来，“AI时代企业的竞争壁垒不在于有多少智能体，而在于企业的数据、流程与业务知识，是否已经为智能体做好了准备，而这正是SAP自主运营企业架构的出发点，也是中国企业在这场组织变革中能否抢占先机的关键。”（新浪科技）", "ctime": 1780557889, "time_str": "15:24:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260604/c677215662.shtml"}, {"id": "4461335", "title": "外交部谈“五眼联盟”指责中方“间谍威胁”：很讽刺", "content": "就有报道称“五眼联盟”指责中方招募所谓“情报人员”，外交部发言人毛宁6月4日在例行记者会上答问时表示，作为全球最大的情报合作联盟，“五眼联盟”长期以来在世界各地开展大规模系统性的间谍活动，这样一个组织却指责所谓中国“间谍威胁”，这本身就很讽刺。（新华社）", "ctime": 1780557789, "time_str": "15:23:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260604/c677215598.shtml"}, {"id": "4461303", "title": "欧盟考虑推出新对华贸易限制工具，外交部：违背经济规律，损人不利己", "content": "6月4日，外交部发言人毛宁主持例行记者会。有记者提问，日前欧委会全体会议讨论对华关系，有观点认为中欧贸易和投资状况“不可持续”，欧盟应对华“去风险”，外界预计6月中旬欧盟将借G7和欧盟夏季峰会推出新的对华贸易限制工具，但同时我们也注意到中国欧盟商会最新的调查报告显示，68%的欧洲企业选择坚守或扩大在华业务，近1/3的企业将进一步深化在中国的本土化布局，“去风险”似乎并未成为欧洲企业的实际选择。发言人如何看待这种现象？毛宁表示，越来越多的欧洲企业选择深耕中国，扩大在华业务，这本身就是对所谓“去风险”最有力的回应。中欧经贸合作源于共同利益，本质上是比较优势和市场竞争共同作用的结果。优势互补不是风险，利益融合也不是威胁。（澎湃新闻）", "ctime": 1780557625, "time_str": "15:20:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260604/c677215512.shtml"}, {"id": "4461277", "title": "预告：国新办将于2026年6月8日（星期一）上午10时举行《城市更新“十五五”规划》有关情况政策例行吹风会", "content": "国务院新闻办公室将于2026年6月8日（星期一）上午10时举行国务院政策例行吹风会，请住房城乡建设部副部长秦海翔和国家发展改革委、财政部、自然资源部有关负责人介绍《城市更新“十五五”规划》有关情况，并答记者问。", "ctime": 1780557360, "time_str": "15:16:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260604/c677215272.shtml"}, {"id": "4461269", "title": "商务部：反对美以“强迫劳动”为由对华贸易限制", "content": "商务部新闻发言人何咏前4日在例行新闻发布会上回答关于美提出对所谓强制劳动经济体加征关税的提问时说，关于301调查，中方立场是一贯的。中方反对各种形式的单边限制措施，包括以“强迫劳动”为由对华实施的一系列贸易限制措施，对此中方已多次表达严正立场。我们敦促美方与中方相向而行，共同维护中美经贸关系稳定。(新华社)", "ctime": 1780557281, "time_str": "15:14:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260604/c677215248.shtml"}, {"id": "4461261", "title": "长电科技高密度3D系统集成新厂房启用，聚焦AI电源模组等高附加值领域", "content": "6月1日，长电科技位于江阴城东生产基地的高密度3D系统集成高端制造项目新厂房正式启用，并实现首批设备进场。本次启用的新厂房是长电科技在先进封装领域扩大产能建设的重要布局，也是公司“启新项目”的关键里程碑。新厂房包含约7000平方米洁净室，预计于本月底通线，将为AI算力中心电源模组等领域提供先进封装技术与服务，进一步提升公司在高密度系统集成与交付方面的综合实力。(长电科技)", "ctime": 1780557159, "time_str": "15:12:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260604/c677215149.shtml"}, {"id": "4461239", "title": "欧洲主要股指开盘多数上涨", "content": "欧洲主要股指开盘多数上涨，欧洲斯托克50指数涨0.04%，英国富时100指数跌0.17%，法国CAC40指数涨0.05%，德国DAX指数涨0.14%。", "ctime": 1780557021, "time_str": "15:10:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260604/c677215051.shtml"}, {"id": "4461221", "title": "商务部：美滥用出口管制冲击全球半导体产供链稳定", "content": "商务部新闻发言人何咏前在例行发布会上表示，美方以国家安全为由滥用出口管制，严重损害中国企业正当权益，破坏国际经贸秩序，冲击全球半导体产业链供应链稳定。中方敦促美方纠正错误做法，停止歧视性措施，维护全球产业链供应链稳定。（新华社）", "ctime": 1780556924, "time_str": "15:08:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260604/c677214923.shtml"}, {"id": "4461135", "title": "期货收评：全线下挫！碳酸锂跌近5% 多晶硅下跌超3%", "content": "期货收评：截止收盘，国内期货主力合约跌多涨少，碳酸锂、沪锡跌超4%，钯、沪镍、多晶硅跌近4%，瓶片、沪银跌近3%，橡胶、红枣、不锈钢、PVC、氧化铝、苯乙烯、20号胶跌超2%。涨幅方面，焦煤涨超4%，菜籽、焦炭涨超2%。", "ctime": 1780556783, "time_str": "15:06:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260604/c677214641.shtml"}, {"id": "4461157", "title": "中国维和部队在阿卜耶伊开展助学慰问人道主义援助", "content": "近日，中国第六批赴阿卜耶伊维和直升机分队与中国第三批赴阿卜耶伊维和快反分队官兵一同走进任务区阿卜耶伊综合中学，开展助学捐赠、文化交流等人道主义援助活动，以实际行动践行联合国维和使命，传递中国维和官兵的温情与善意。阿卜耶伊综合中学有数千名师生，教学、文体及生活物资长期短缺。两支维和分队在完成空中巡逻、地面警戒等既定任务前提下，根据联合国阿卜耶伊临时安全部队人道主义援助计划，先期开展实地调研，摸清学校需求，筹措物资并制定联合帮扶方案。在捐赠仪式上，维和部队向校方移交学习用品、体育器材和基础生活用品共千余件。学校师生代表接受物资，校长对中国维和部队长期支持当地教育表示感谢。两支分队带队指挥员表示，助学帮扶是中国蓝盔履行人道主义义务的重要抓手。两支维和分队常态化联动开展助学、义诊、便民帮扶等活动，既是落实联合国维和授权任务，也是深化与阿卜耶伊民众友谊的务实举措。下一步，分队将持续跟踪校园实际需求，常态化开展定点帮扶，以点滴善举播撒和平种子，持续擦亮中国蓝盔和平使者名片。（新华社）", "ctime": 1780556667, "time_str": "15:04:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260604/c677214684.shtml"}, {"id": "4461137", "title": "ETF两市成交额4336.14亿元", "content": "截至收盘，ETF两市成交额报4336.14亿元，分类型来看，股票型ETF成交额1383亿元，债券型ETF成交额2008.76亿元，货币型ETF成交额187.59亿元，商品型ETF成交额62.26亿元，QDII型ETF成交额449.86亿元。其中，成交额最高的非货币型ETF分别是中韩半导体ETF（513310）、科创芯片ETF（588200）、中证A500ETF（159338），成交额分别为：89.41亿元、46.15亿元、45.39亿元。", "ctime": 1780556573, "time_str": "15:02:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260604/c677214649.shtml"}, {"id": "4461131", "title": "ETF收评：科创半导体设备ETF领涨4.96%，有色ETF领跌3.66%", "content": "ETF收盘涨跌不一，科创半导体设备ETF（ 合约全线收跌。沪深300股指期货(IF)主力合约跌0.66%，上证50股指期货(IH)主力合约跌1.20%，中证500股指期货(IC)主力合约跌0.02%，中证1000股指期货(IM)主力合约跌0.06%。", "ctime": 1780556420, "time_str": "15:00:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260604/c677214593.shtml"}, {"id": "4461115", "title": "消息人士称日本央行预计将在6月的会议上升加息", "content": "据报道，消息人士称日本央行预计将在6月的会议上升加息。(蓝鲸新闻)", "ctime": 1780556396, "time_str": "14:59:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260604/c677214582.shtml"}, {"id": "4461111", "title": "中证投服中心启动新一期课题申报 研究网红非法荐股乱象成监管重点", "content": "记者获悉，中证中小投资者服务中心最新启动了第10期课题研究申报工作，旨在推进资本市场法治和投资者保护领域研究，有效提升投资者获得感。申报设有两大选题，分别为证券虚假陈述重大性认定问题研究、网络社交媒体对中小投资者交易行为的影响及监管研究。其中，对于网红非法荐股乱象的研究契合近年来资本市场重点，中证投服中心称，财经网红无牌推广、虚假信息传播、大V非法荐股、利用平台喊单拉涨后抛售等问题频发，严重扰乱市场秩序及侵害投资者合法权益。依据以往情况，依托实证研究，有望后续完善制度细则，补齐投资者保护制度短板，为资本市场精细化监管落地提供实务参考。(蓝鲸新闻)", "ctime": 1780556367, "time_str": "14:59:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260604/c677214568.shtml"}, {"id": "4461105", "title": "中越举行北部湾湾口外海域工作组和海上共同开发磋商工作组新一轮磋商", "content": "2026年6月3日，外交部边界与海洋事务代表胡炜与越南外交部国家边界委主任阮登胜在越南头顿共同主持中越北部湾湾口外海域工作组第十八轮磋商和海上共同开发磋商工作组第十五轮磋商，两国有关部门代表参加。双方就北部湾湾口外海域划界和南海共同开发深入交换意见，一致表示要认真落实两党两国领导人达成的重要共识，加快同步推进北部湾湾口外海域划界和南海共同开发，争取早日取得实质进展。双方还就其他涉海问题进行了沟通，一致认为应妥善管控海上分歧，积极推进涉海合作，共同维护南海和平稳定。（央视新闻）", "ctime": 1780556231, "time_str": "14:57:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260604/c677214528.shtml"}, {"id": "4461103", "title": "日本央行倾向2027财年起暂停或放缓缩减购债规模步伐", "content": "据报道，日本央行倾向于从2027财年起暂停或放缓缩减购债规模的步伐。（界面新闻）", "ctime": 1780556124, "time_str": "14:55:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260604/c677214505.shtml"}, {"id": "4461097", "title": "霍尔果斯口岸前5月出入境人员达64.6万人次", "content": "依托中哈30日互免签证政策实施，今年以来，霍尔果斯公路口岸跨境游迎来出行高峰。跨境出行、商贸往来热度持续攀升，出入境客流量、团队出行量均刷新历史纪录。据霍尔果斯出入境边防检查站数据，今年前5月口岸累计验放出入境人员64.6万人次，同比增长19.8%，创历史新高。（新华社）", "ctime": 1780556057, "time_str": "14:54:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260604/c677214491.shtml"}, {"id": "4461093", "title": "深圳证监局举办商业不动产REITs培训交流会", "content": "为推动落实商业不动产REITs试点工作，深圳证监局在第二十届深圳国际金融博览会期间，联合深圳市委金融办、深圳市商务局、深圳证券交易所指导深圳市投资基金同业公会公募REITs专业委员会于2026年5月28日成功举办深圳商业不动产REITs培训交流会。本次培训交流会旨在助力深圳企业和金融机构抢抓试点政策机遇、精准把握REITs市场发展趋势、准确理解首批申报项目发行审核和实操工作要点，搭建起市场主体、监管部门和交易所、中介机构、投资机构进行深度专业交流的对接平台。深圳证监局宣贯解读商业不动产REITs发展现状、试点政策要点与监管要求，深圳证券交易所资深专家对发行审核常见问题进行讲解，红土创新基金执业团队结合实务讲解项目申报操作要点，会后进行座谈答疑，深圳证券基金经营机构、上市公司、深圳国企、深圳房企等行业代表近90人参加培训开展交流，获得良好市场反馈。截至目前，作为原始权益人的深圳企业已向沪深证券交易所申报发行3只商业不动产REIT，预计募资规模81.92亿元。(证监会)", "ctime": 1780555971, "time_str": "14:52:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260604/c677214460.shtml"}];

  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
