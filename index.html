日此时放量599亿元", "content": "据同花顺iFinD数据，沪深京三市成交额超2.2万亿元，较上日此时放量599亿元，预计全天成交金额约2.4万亿元。截至目前，沪市成交额9322亿元，深市成交额12555亿元，北证50成交额129亿元。", "ctime": 1776235104, "time_str": "14:38:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260415/c676004498.shtml"}, {"id": "4229601", "title": "阿里ATH事业群发布首款AI开发工具秒悟", "content": "4月15日，阿里ATH事业群发布旗下首款AI开发工具Meoo（秒悟），该工具集成千问、Kimi、GLM、MiniMax四大模型，并内置阿里云数据库、存储等核心产品服务，用户只需用自然语言描述想法，Meoo最快1分钟就能自动生成前端后端完整的网站、H5页面，在阿里云上一键部署上线。（第一财经）", "ctime": 1776234965, "time_str": "14:36:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260415/c676004421.shtml"}, {"id": "4229599", "title": "信达生物在上海成立医药公司", "content": "企查查APP显示，近日，上海众煦嘉和医药有限公司成立，法定代表人为关战旗，经营范围包含：药品零售；药品进出口；国内货物运输代理；食品销售（仅销售预包装食品）；保健食品（预包装）销售等。企查查股权穿透显示，该公司由信达生物间接全资持股。（人民财讯）", "ctime": 1776234948, "time_str": "14:35:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260415/c676004409.shtml"}, {"id": "4229589", "title": "阿里云连续5年居中国游戏云市场份额第一", "content": "IDC《中国游戏云市场跟踪，2025H2》最新数据显示，2025年下半年阿里云市场份额位列第一，带动全年份额持续上涨。这也是阿里云连续第5年居中国游戏云市场第一。其中，在游戏云解决方案、基础设施两大细分市场，阿里云均为第一，份额分别为42%、39%。（南方财经）", "ctime": 1776234804, "time_str": "14:33:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260415/c676004349.shtml"}, {"id": "4229587", "title": "A股三大指数尾盘全线翻绿，全市场超3500只个股下跌", "content": "A股三大指数尾盘全线翻绿，前期强势的算力硬件、电池板块多数调整，全市场超3500只个股下跌。", "ctime": 1776234797, "time_str": "14:33:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260415/c676004344.shtml"}, {"id": "4229561", "title": "日韩股市集体收涨", "content": "日经225指数收涨0.44%，报58134.24点。韩国综指收涨2.07%，报6091.39点。", "ctime": 1776234674, "time_str": "14:31:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260415/c676004302.shtml"}, {"id": "4229557", "title": "浙江省4月15日起正式入汛 本月初已启动汛期工作机制", "content": "浙江省4月15日起正式进入汛期。据浙江省水文管理中心预测，今年浙江水文年景偏差，极端强降水洪水事件可能多发，甬江、杭嘉湖东部平原、钱塘江中上游、浦阳江、东苕溪发生洪水概率较大。目前，浙江全省水利系统已于4月1日启动汛期工作机制，通过压实工作责任、强化风险排查整治、完善方案预案、提升监测预报能力、加快防洪骨干工程建设等防汛工作，守牢大江大河水库不溃堤溃坝、城区不出现长时间大面积积水、不出现群死群伤“三条底线”。（央视新闻）", "ctime": 1776234631, "time_str": "14:30:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260415/c676004276.shtml"}, {"id": "4229553", "title": "美国参议院民主党领袖舒默：对伊作战是史诗失败行动", "content": "美国参议院民主党领袖查克·舒默4月14日在国会表示，特朗普政府对伊朗发动的“史诗怒火”军事行动，是一场“史诗失败”行动。他斥责国会无视该行动对美国及全球经济造成的重创，“没有听证会、监督和问责 ”，毫无作为。舒默说，民主党将在本周内提交一份限制总统战争权力议案，直到这场战争结束或国会追究政府的责任为止。 (CCTV国际时讯)", "ctime": 1776234501, "time_str": "14:28:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260415/c676004224.shtml"}, {"id": "4229549", "title": "乌称俄军袭击敖德萨州南部港口基础设施", "content": "当地时间15日，乌克兰敖德萨州军事行政长官基佩尔在社交媒体上发文表示，俄罗斯军队再次使用无人机袭击了敖德萨州南部港口基础设施。袭击导致多处起火，仓库和行政大楼遭到破坏。基佩尔表示，初步数据显示此次袭击没有造成人员受伤。俄方对此暂无回应。（央视新闻）", "ctime": 1776234284, "time_str": "14:24:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260415/c676004150.shtml"}, {"id": "4229547", "title": "存储芯片板块多数调整，大为股份盘中触及跌停", "content": "存储芯片板块多数调整，大为股份盘中触及跌停，盈新发展、朗科科技、商络电子、睿能科技、澜起科技等跟跌。", "ctime": 1776234267, "time_str": "14:24:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260415/c676004146.shtml"}, {"id": "4229543", "title": "宠物经济概念股震荡上扬，中宠股份涨停", "content": "宠物经济概念股震荡上扬，中宠股份涨停，华宝股份、乖宝宠物、天元宠物、源飞宠物跟涨。", "ctime": 1776234095, "time_str": "14:21:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260415/c676004085.shtml"}, {"id": "4229537", "title": "京东宣布推出“机器人救护车”", "content": "4月15日，京东宣布正式推出“机器人救护车”，为人形机器人、四足机器人、AI陪伴机器人等提供维修保养服务。目前，京东“机器人救护车”已服务北京地区，未来三年，机器人上门维修服务还将拓展至全国超50个核心城市。（界面新闻）", "ctime": 1776234066, "time_str": "14:21:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260415/c676004067.shtml"}, {"id": "4229533", "title": "隆盛科技董事长倪铭：将推动具身智能机器人创新中心独立上市", "content": "江苏隆盛唯睿具身智能机器人创新中心今日在无锡启用。该中心于2025年12月获得江苏省工信厅授牌，成为江苏唯三、无锡唯一的省级具身智能机器人创新中心，由隆盛科技控股，落户于无锡市滨湖区蠡湖街道。今日，中心与极佳视界、蚂蚁灵波、博世动力、宝钢股份、中物材料、逐际动力等企业合作签约共建生态。隆盛科技董事长倪铭表示，将为中心构建独立上市主体的发展架构与能力体系，全力打造具身智能机器人领域高质量上市主体，培育一支硬核科技上市的新军。（财联社）", "ctime": 1776233920, "time_str": "14:18:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260415/c676004033.shtml"}, {"id": "4229525", "title": "奈飞公司CEO与美国影院行业负责人举行会谈 双方未来或将合作？", "content": "美国影院行业贸易协会负责人4月14日表示，奈飞公司首席执行官特德·萨兰多斯在一次行业会议的间隙与美国影院的负责人们举行了会谈。目前，影院方面正在寻求与奈飞公司展开合作。美国一年一度的电影产业盛会——电影博览会于4月13日至16日在拉斯维加斯举行。该博览会的组织方“联合影院”，也就是曾经的美国全国影院主协会主席迈克尔 奥利里4月14日表示，奈飞公司首席执行官特德·萨兰多斯12日与该组织的代表们举行了一次“建设性的会谈”。（央视新闻）", "ctime": 1776233675, "time_str": "14:14:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260415/c676003943.shtml"}, {"id": "4229521", "title": "雄安卫星互联网科创基金设立，总规模3亿元", "content": "4月15日，据“雄安发布”微信公众号消息，雄安卫星互联网科技创新股权投资基金于近日正式完成设立审批。该基金由河北省科技投资引导基金联合河北雄安科技创新股权投资基金、财达资本管理有限公司等共同发起设立，总规模3亿元，首期出资1.5亿元。其中，省科技投资引导基金认缴4500万元，出资占比30%。该基金重点布局卫星互联网产业链上下游关键领域，包括卫星研发制造、通信运营、终端设备、应用服务等环节。(界面)", "ctime": 1776233647, "time_str": "14:14:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260415/c676003936.shtml"}, {"id": "4229517", "title": "深证成指跌1%", "content": "深证成指跌幅扩大至1%，上证指数涨0.1%，创业板指跌1.33%。", "ctime": 1776233591, "time_str": "14:13:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260415/c676003916.shtml"}, {"id": "4229513", "title": "CPO等算力硬件股多数调整，华工科技跌超7%", "content": "CPO等算力硬件股多数调整，华工科技跌超7%，生益电子、新易盛跌超5%，胜宏科技、天孚通信、德科立纷纷下挫。", "ctime": 1776233545, "time_str": "14:12:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260415/c676003898.shtml"}, {"id": "4229509", "title": "中际旭创成交额达200亿元", "content": "中际旭创成交额达200亿元，现涨0.16%。", "ctime": 1776233457, "time_str": "14:10:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260415/c676003864.shtml"}, {"id": "4229493", "title": "沪深京三市成交额超2万亿元，较上日此时放量307亿元", "content": "据同花顺iFinD数据，沪深京三市成交额超2万亿元，较上日此时放量307亿元，预计全天成交金额约2.4万亿元。截至目前，沪市成交额8488亿元，深市成交额11403亿元，北证50成交额117亿元。", "ctime": 1776233191, "time_str": "14:06:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260415/c676003783.shtml"}, {"id": "4229479", "title": "北京人工智能创新街区产业共建联盟成立", "content": "在2026酒仙桥论坛上，北京市朝阳区正式启动人工智能创新街区城市规划导则编制单位、街区LOGO及数字卡通形象全球征集，正式成立人工智能创新街区产业共建联盟，启动量算融合等三大重点项目。作为北京打造“全球人工智能第一城”的重要工作载体，今年北京市发布了朝阳区光智空间等首批4个人工智能创新街区。光智空间以“光算融合、智启新境”为定位，聚焦下一代算力形态与AI产业深度应用，搭建完善的AI科技创新服务体系，推动人工智能深度赋能场景应用，培育新业态、新模式。《科创板日报》了解到，北电数智等将深度参与创新街区建设。（科创板日报）", "ctime": 1776233036, "time_str": "14:03:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260415/c676003730.shtml"}, {"id": "4229477", "title": "李飞飞世界模型上线3D图像渲染器Spark 2.0", "content": "今日，斯坦福大学教授李飞飞的创业公司WorldLabs发布了新成果Spark 2.0。作为一个面向Web的动态3D高斯泼溅（3DGS）渲染器，Spark与当前最流行的Web 3D框架Three.js集成，并基于Web GL2运行，因此只要有浏览器，无论是桌面端、iOS、Android，还是VR设备，都可以使用。在 Spark 2.0 中，团队加入了一个细节层级（LoD）系统，可以在任意设备上流式加载并渲染超大规模的3DGS世界，这意味着原本只有专业设备才能运行的超大规模、高保真3D场景，现在变成任何人都可以在浏览器中 // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
