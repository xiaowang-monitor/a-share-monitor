alse, "source": "", "url": "https://news.10jqka.com.cn/20261009/c680535873.shtml"}, {"id": "5354083", "title": "禾材高科完成数千万元天使+轮融资", "content": "近日，辐射防护材料制造商禾材高科完成数千万元天使+轮融资，本轮由捷创资本领投，深创投、万联广生、道翼资本跟投。禾材高科成立于2025年，聚焦裂变核能、核医疗及可控核聚变领域，围绕中子慢化、吸收、屏蔽及极端核环境需求，已形成氟化物慢化陶瓷、稀土材料、硼化物中子吸收材料等产品与技术体系，并布局SiC/SiC复合材料、含锂陶瓷等下一代核能关键材料。（科创板日报）", "ctime": 1791541481, "time_str": "18:24:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261009/c680535854.shtml"}, {"id": "5354075", "title": "深圳前三季度用电量破千亿千瓦时", "content": "记者9日从南方电网深圳供电局获悉，2026年前三季度，深圳全社会用电量1030.42亿千瓦时，同比增长6.4%，历史首次前三季度突破千亿千瓦时。分产业看，第二产业用电量465.39亿千瓦时，同比增长4.89%；第三产业用电量383.05亿千瓦时，同比增长8.14%；居民生活用电量181.51亿千瓦时，同比增长6.69%。工业仍是深圳经济发展的核心基本盘，前三季度全市工业用电量450.61亿千瓦时，同比增长5.26%。其中，制造业用电量361.33亿千瓦时，同比增长4.89%。以新产业、新业态、新商业模式为代表的“三新”经济拉动作用强劲，前三季度用电量同比增长44.5%。其中，新能源整车制造用电量大幅攀升71.16%，光伏设备及元器件制造用电量增长30.45%。（新华社）", "ctime": 1791541357, "time_str": "18:22:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261009/c680535805.shtml"}, {"id": "5354053", "title": "国力电子：预计2026年第三季度净利润2700万元到3240万元，同比增长35.11%到62.13%", "content": "国力电子公告，预计2026年第三季度营业收入4.5亿元到5.4亿元，同比增长22.20%到46.65%；归属于母公司所有者的净利润2700万元到3240万元，同比增长35.11%到62.13%，2025年第三季度为1998.39万元；扣非净利润2600万元到3120万元，同比增长38.28%到65.94%，2025年第三季度为1880.24万元。业绩增长主要因电容器产品持续放量、高附加值产品在战略性新场景加速放量及成本与费用控制见效。", "ctime": 1791541197, "time_str": "18:19:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261009/c680535759.shtml"}, {"id": "5354049", "title": "龙源电力：2026年9月发电量同比增长7.08%，累计同比下降0.52%", "content": "龙源电力公告，2026年9月按合并报表口径完成发电量566.66万兆瓦时，同比增长7.08%。其中风电发电量同比增长3.20%，太阳能发电量同比增长20.21%。2026年累计完成发电量5625.04万兆瓦时，同比下降0.52%，其中风电发电量同比下降4.97%，太阳能发电量同比增长19.29%。", "ctime": 1791541170, "time_str": "18:19:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261009/c680535753.shtml"}, {"id": "5354037", "title": "交建股份：实际控制人俞发祥收到立案告知书", "content": "交建股份公告，2026年10月9日，公司实际控制人俞发祥收到中国证监会下发的《立案告知书》，因涉嫌信息披露违法违规被立案。俞发祥未在公司担任任何职务，公司生产经营一切正常，上述事项不会对公司正常生产经营产生重大影响。", "ctime": 1791541121, "time_str": "18:18:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261009/c680535737.shtml"}, {"id": "5354033", "title": "德昌电机控股：预计截至2026年9月30日止六个月溢利下降56%至62%", "content": "德昌电机控股公告，预计截至2026年9月30日止六个月股东应占溢利介于5000万美元至5800万美元，较去年同期净溢利1.33亿美元减少约7500万美元至8300万美元，或56%至62%；总营业额预计与去年同期大致相若。净溢利减少的相当部分由外汇相关影响所致，估计减少约4900万美元至5500万美元。另受定价措施、客户扣款及索偿拨备、原材料及投入成本上升、通胀压力等因素影响，部分被有利的其他收入、拨备及税项变动抵销。数据未经审核，可能调整。", "ctime": 1791541112, "time_str": "18:18:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261009/c680535734.shtml"}, {"id": "5354015", "title": "中共中央、国务院：全面实施“人工智能+”行动 强化算力、算法、数据等高效供给", "content": "中共中央、国务院印发《关于发展新质生产力的意见》。意见提出，全面实施“人工智能+”行动。推进人工智能对传统产业的改造，加快推进智能网联新能源汽车、人工智能手机和电脑、人形机器人等新一代智能终端场景应用。加快人工智能等数智技术创新，突破基础理论和核心技术，强化算力、算法、数据等高效供给。因地制宜、分业施策布局国家人工智能行业应用中试基地和高价值应用场景，大力推动人工智能在各行业应用。构建技术监测、风险预警、应急响应体系，确保人工智能安全、可靠、可控。", "ctime": 1791540897, "time_str": "18:14:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261009/c680535595.shtml"}, {"id": "5354011", "title": "马来西亚多地因烟霾采取停课措施", "content": "马来西亚教育部8日宣布，因烟霾导致空气质量恶化，在空气污染指数超过180的地区，教育部管辖的学校及教育机构自9日起停课；在连续3天空气污染指数超过150的地区，相关学校及教育机构自12日起停课。马来西亚教育部8日发布声明说，各州教育部门应密切关注当地空气质量变化，并根据相关标准采取措施，以保障学生健康与安全。停课期间，学校将实施居家教学，教师及行政、后勤人员可以居家办公。（新华社）", "ctime": 1791540805, "time_str": "18:13:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261009/c680535570.shtml"}, {"id": "5353981", "title": "财险公司保险产品开发新规落地 强化消费者权益保护", "content": "记者从国家金融监督管理总局获悉，《财产保险公司保险产品开发管理规定》于10月9日正式对外发布，要求坚守保险本源，强化标准规范，个人类条款应当通俗易懂、清晰明确，保护投保人、被保险人和受益人合法权益，提升保险产品供给质量。\n\n规定明确开发保险产品必须遵循损失补偿、诚实信用等原则，禁止开发不具备或然性、承保投机风险、单纯以恶意炒作为目的等保险产品；条款表述应当坚持规范化、标准化，对免除或减轻保险人责任的内容，应当使用足以引起投保人注意的方式作出提示，切实保障消费者的知情权。(新华社)", "ctime": 1791540594, "time_str": "18:09:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261009/c680535439.shtml"}, {"id": "5353979", "title": "*ST纳川：2026年10月9日收到中国证监会立案告知书", "content": "*ST纳川公告，2026年10月9日，公司收到中国证监会下发的立案告知书。因公司2023年年报涉嫌信息披露违法违规，中国证监会决定对公司立案。立案调查期间，公司将积极配合调查工作，并按要求履行信息披露义务。", "ctime": 1791540588, "time_str": "18:09:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261009/c680535434.shtml"}, {"id": "5353945", "title": "祥源文旅：实控人俞发祥因涉嫌信披违法违规被立案", "content": "祥源文旅公告，2026年10月9日，公司实际控制人俞发祥收到中国证监会下发的《立案告知书》，因其个人涉嫌信息披露违法违规，中国证监会决定对其立案。俞发祥未在公司担任任何职务，公司生产经营一切正常，上述事项不会对公司正常生产经营产生重大影响。", "ctime": 1791540502, "time_str": "18:08:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261009/c680535392.shtml"}, {"id": "5353931", "title": "中共中央、国务院：将符合国家战略需求的企业研发项目按程序上升为国家项目", "content": "中共中央、国务院印发《关于发展新质生产力的意见》。其中指出，强化企业科技创新主体地位。加强普惠激励政策供给，建立企业研发准备金制度，强化企业科技投入主导作用。鼓励科技型中小企业加大研发投入，提高企业研发费用加计扣除比例。将符合国家战略需求的企业研发项目按程序上升为国家项目，鼓励企业牵头国家科技任务，支持有能力的民营企业牵头承担国家重大技术攻关任务。建立用户考核评价成果的机制，强化企业成果转化主体地位。健全国有企业推进原始创新制度安排。支持专精特新中小企业发展。（新华社）", "ctime": 1791540405, "time_str": "18:06:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261009/c680535320.shtml"}, {"id": "5353859", "title": "阳光电源：截至2026年9月30日，已回购公司股份304.76万股", "content": "阳光电源公告，公司此前于2026年8月2日召开第六届董事会第二次会议，审议通过回购公司股份方案，拟以自有或自筹资金回购部分人民币普通股A股股份，用于未来适宜时机实施员工持股计划或股权激励计划。本次回购价格不超过188元/股（含），回购总金额不低于人民币5亿元（含）且不超过人民币10亿元（含），实施期限自董事会审议通过之日起12个月内。截至2026年9月30日，公司通过深圳证券交易所交易系统以集中竞价交易方式累计回购股份304.76万股，占公司总股本的比例为0.1470%，回购成交的最高价为114.99元/股，最低价为97.81元/股，支付的资金总额为人民币3.25亿元（含交易费用）。公司表示本次回购符合回购股份方案及相关法律法规的要求，后续将根据市场情况在回购期限内继续实施。", "ctime": 1791540185, "time_str": "18:03:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261009/c680535182.shtml"}, {"id": "5353843", "title": "艾比森：预计2026年前三季度净利润同比增长32.31%-43.11%", "content": "艾比森公告，预计2026年前三季度归属于上市公司股东的净利润为2.45亿元-2.65亿元，较2025年前三季度的1.85亿元增长32.31%-43.11%；扣除非经常性损益后的净利润预计为1.66亿元-1.86亿元，较2025年前三季度的1.63亿元增长1.87%-14.14%。业绩增长主要受营业收入同比增长、综合毛利率提升、高质量区域市场布局持续深化及数字化转型和人工智能应用成效逐步显现等因素影响。", "ctime": 1791540140, "time_str": "18:02:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261009/c680535140.shtml"}, {"id": "5353839", "title": "中共中央国务院发布关于发展新质生产力的意见", "content": "中共中央国务院发布关于发展新质生产力的意见，其中指出，发展新质生产力是推动高质量发展的内在要求和重要着力点。为加快发展新质生产力，现提出如下意见。坚持以习近平新时代中国特色社会主义思想为指导，深入贯彻党的二十大和二十届历次全会精神，认真落实四中全会部署，完整准确全面贯彻新发展理念，坚持创新主导、改革为要、因地制宜、先立后破，坚持高技术、高效能、高质量，统筹处理好政府和市场、质态和业态、改革和发展、自主和开放的关系，统筹发展和安全，以科技创新为引领，以全要素生产率大幅提升为核心标志，推动技术革命性突破、生产要素创新性配置、产业深度转型升级，推动劳动者、劳动资料、劳动对象优化组合和更新跃升，全方位推进科技创新、产业创新、发展方式创新、体制机制创新、人才工作机制创新，加快形成同新质生产力更相适应的生产关系，营造有利于科技创新和产业创新深度融合的良好发展生态，更好支撑高质量发展。(新华社)", "ctime": 1791540128, "time_str": "18:02:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261009/c680535128.shtml"}, {"id": "5353749", "title": "美团：将提高超重、体积大、步行上下楼等较难配送订单计费权重", "content": "2026年度美团劳动规则和算法协商恳谈会近日在北京召开。来自全国各地的一线骑手代表与美团平台围绕劳动报酬、派单规则、休息休假、劳动保护等议题开展协商，现场签署《2026年度美团劳动规则和算法协商协议》。协议明确，美团将提高超重、体积大、步行上下楼等较难配送订单的计费权重，增加特殊天气下的收入报酬；继续执行“取消超时扣款”，持续优化顺路派单、配送时限、商家出餐时间预估等机制；逐步扩大“红灯停表”试点；推动养老保险补贴政策落地，减轻骑手参保负担等。（澎湃新闻）", "ctime": 1791540006, "time_str": "18:00:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261009/c680535050.shtml"}, {"id": "5353745", "title": "证监会：持续运作的迷你基金不再要求召集持有人大会、管理人需承担基金固定费用", "content": "证监会今日发布《公开募集证券投资基金运作管理办法（征求意见稿）》。对于迷你基金难以召开持有人大会、运作成本相对较高的情况，《运作办法》明确，连续60个工作日达到迷你基金标准后，管理人选择继续运作的，不再要求召集持有人大会，但应承担基金运作过程中产生的固定费用；而拟转换运作方式、与其他基金合并或者提前终止基金合同的，基金管理人仍应当按照规定召开基金份额持有人大会进行表决。此外，《运作办法》还提到，基金管理人应当在基金合同中明确约定基金资产净值连续低于一定规模的，基金合同终止，中国证监会认可的情形除外。基金管理人还可以从基金份额持有人数量、基金份额持有人集中度等方面，约定基金合同终止的情形。", "ctime": 1791539975, "time_str": "17:59:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261009/c680535027.shtml"}, {"id": "5353731", "title": "海立股份：控股子公司海立电器拟计提预计负债1.48亿元", "content": "海立股份公告，控股子公司海立电器因与控股孙公司绵阳海立历史交易引发诉讼，收到一审判决后拟计提预计负债人民币1.48亿元，预计将减少公司2026年第三季度归属于上市公司股东的净利润约6326万元；海立电器将按照司法程序向四川省高级人民法院提起上诉。", "ctime": 1791539891, "time_str": "17:58:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261009/c680534973.shtml"}, {"id": "5353725", "title": "亚美尼亚总理：与阿塞拜疆之间的和平已成既定事实", "content": "亚美尼亚总理帕什尼扬9日在土库曼斯坦土库曼巴希举行的独联体国家元首理事会会议期间表示，亚美尼亚与阿塞拜疆之间的和平已成既定事实。帕什尼扬说，近年来，亚美尼亚与阿塞拜疆之间各类冲突事件已完全停止，包括铁路货运在内的交通联系得以恢复，双边贸易也已启动。（新华社）", "ctime": 1791539846, "time_str": "17:57:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261009/c680534953.shtml"}, {"id": "5353715", "title": "正虹科技：2026年9月销售生猪0.95万头，销量同比增长16.85%", "content": "正虹科技公告，2026年9月销售生猪0.95万头（其中商品猪0.45万头、仔猪0.50万头），销量环比下降39.65%，同比增长16.85%；销售收入738.85万元，环比下降18.99%，同比下降29.76%。2026年9月商品猪销售均价10.62元/公斤，同比下降18.88%。2026年1-9月累计销售生猪8.95万头，较去年同期下降14.15%；累计销售收入7204.46万元，较去年同期下降49.57%。公司本月商品猪销售环比下降主要因商品猪出栏量减少所致。", "ctime": 1791539788, "time_str": "17:56:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261009/c680534919.shtml"}, {"id": "5353701", "title": "景旺电子：预计2026年第三季度净利润同比增长205.46%到264.74%", "content": "景旺电子公告，预计2026年第三季度营业收入61.2亿元到69.8亿元，同比增长53.48%到7 // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// 精选个股

    const miniBar = dims.map(d => {

    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>

  }).join('');

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
