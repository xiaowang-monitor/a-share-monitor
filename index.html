rce": "", "url": "https://news.10jqka.com.cn/20260527/c677005734.shtml"}, {"id": "4412175", "title": "会稽山等在绍兴成立远年酒业公司", "content": "企查查APP显示，近日，绍兴会稽山远年酒业有限公司成立，经营范围包含：食品销售；酒类经营；食品进出口；日用百货销售等。企查查股权穿透显示，该公司由会稽山等共同持股。（人民财讯）", "ctime": 1779858278, "time_str": "13:04:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260527/c677005714.shtml"}, {"id": "4412169", "title": "国家医保局专项飞检公布6起典型案例", "content": "国家医保局表示，自2026年5月14日起，国家医保局在全国范围内开展定点零售药店违法违规使用医保基金专项飞检，并于日前公布了专项飞检中发现的6起典型案例。其中包括海南省三亚市林和堂医药有限责任公司吉阳区分公司串换套取医保基金案、海南省海口市千方大药房连锁经营有限公司东风分店空刷社会保障卡套取医保基金案等。医保部门提醒定点零售药店，通过倒卖“回流药”、空刷、串换等骗取或套取医保基金，均是违反医疗保障相关法律法规的行为。各定点药店应以案为鉴，严格依法合规经营，坚决杜绝任何形式的医保基金滥用行为。同时，也提醒广大参保人，自觉规范就医购药行为，合规使用医保基金。如发现社会保障卡遗失或被盗刷，请立即向公安部门报案，如发现“回流药”相关线索，请主动提交医保等相关部门，切实维护自身合法权益，共同守护医保基金安全。（央视新闻）", "ctime": 1779858271, "time_str": "13:04:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260527/c677005713.shtml"}, {"id": "4412165", "title": "白酒板块午后直线拉升，金徽酒、水井坊涨超5%", "content": "白酒板块午后直线拉升，金徽酒、水井坊涨超5%，皇台酒业、金种子酒、酒鬼酒跟涨。", "ctime": 1779858221, "time_str": "13:03:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260527/c677005700.shtml"}, {"id": "4412129", "title": "国家医保局公布6起定点零售药店违法违规使用医保基金典型案例", "content": "记者获悉，自2026年5月14日起，国家医保局在全国范围内开展定点零售药店违法违规使用医保基金专项飞检，并于日前公布了专项飞检中发现的6起典型案例。（央视新闻）", "ctime": 1779858003, "time_str": "13:00:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260527/c677005638.shtml"}, {"id": "4412127", "title": "加拿大实施与埃博拉疫情相关的临时边境管制措施", "content": "当地时间5月26日，加拿大公共卫生署称，为应对刚果（金）的埃博拉疫情，以及乌干达和南苏丹日益增长的风险，加拿大政府正采取果断行动，出台临时边境措施，降低病毒进入加拿大并传播的风险。加拿大政府计划自美国东部时间5月27日23时59分起，暂停向埃博拉疫情高风险或极高风险国家的居民发放移民文件，为期90天。目前，这些国家包括刚果（金）、乌干达和南苏丹。此外，加拿大政府计划自美国东部时间5月30日晚上11时59分起至2026年8月29日，实施一项额外措施，规定过去21天内曾到访过这些地区的没有症状的加拿大及外国公民，必须进行21天的隔离。（央视新闻）", "ctime": 1779857937, "time_str": "12:58:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260527/c677005631.shtml"}, {"id": "4412125", "title": "花旗：先进封装设备提供商将受益于华为的新芯片设计方法", "content": "花旗分析师在一份研究报告中表示，先进封装设备和服务的提供商可能会成为华为新芯片设计方法的主要受益者。先进封装设备制造商，尤其是混合键合设备提供商，可能会成为主要受益者；随着封装复杂性上升，外包芯片组装和测试提供商也可能从中受益。", "ctime": 1779857802, "time_str": "12:56:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260527/c677005592.shtml"}, {"id": "4412117", "title": "伊朗大不里士国际机场恢复运营", "content": "当地时间27日，伊朗民航组织发言人表示，近期冲突中遭袭的大不里士国际机场已在伊朗技术人员修复后恢复运营，并于27日重新开放。该发言人表示，大不里士国际机场是伊朗第三繁忙的国际机场，目前开通有9个国际航点。（央视新闻）", "ctime": 1779857569, "time_str": "12:52:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260527/c677005540.shtml"}, {"id": "4412115", "title": "北斗星通：公司陶瓷基板没有应用到光模块和功率器件领域", "content": "北斗星通在互动平台表示，公司的陶瓷基板主要材料为氧化铝，当前主要的下游领域是穿戴类设备的压力传感器，订单规模较小，属于培育的项目之一，产品没有应用到光模块和功率器件领域。", "ctime": 1779857512, "time_str": "12:51:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260527/c677005530.shtml"}, {"id": "4412109", "title": "韩国股市今年以来飙升100% 强劲涨势盖过互联网泡沫时期", "content": "韩国股市今年以来已经飙升100%，超过互联网泡沫破裂前夕以及韩国上世纪80年代末工业繁荣时期的历史性升势。在SK海力士和三星电子大涨的带动下，韩国Kospi指数不断刷新纪录，在短短数月内便从5000点飙升至8000点。该指数周三一度上涨5.1%。今年尚未过半，Kospi指数的表现已经可与纳斯达克100指数1999年上涨102%的走势相提并论，当时正值互联网泡沫破裂前夕。不过，很少有市场观察人士就韩国股市发出警告，他们认为，全球对存储芯片的需求出现结构性变化，正从周期性波动转向更持久的增长趋势。(财联社)", "ctime": 1779857276, "time_str": "12:47:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260527/c677005477.shtml"}, {"id": "4412097", "title": "浙江6部门印发方案 聚力打造海洋新材料新兴产业", "content": "近日，浙江省海洋经济发展厅等6部门联合印发《浙江省海洋新材料产业高质量发展实施方案（2026—2030年）》，明确到2030年，力争全省海洋新材料产业总产值翻番达1600亿元，新增专精特新企业60家以上、专精特新“小巨人”企业20家以上、涉海产值规模10亿元以上企业20家以上，在新型深海结构材料、绿色长效高性能防护材料、智能仿生前沿功能材料等领域形成一批国际领先的“硬核”标志性产品。（人民财讯）", "ctime": 1779856934, "time_str": "12:42:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260527/c677005377.shtml"}, {"id": "4412093", "title": "鹏鼎控股：不涉及半导体和芯片业务", "content": "鹏鼎控股5月27日在互动平台表示，公司主要从事各类印制电路板的研发、设计、制造、销售与服务，主要产品包括FPC、SMA、SLP、HDI、RPCB、Rigid Flex等，不涉及半导体和芯片业务。", "ctime": 1779856774, "time_str": "12:39:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260527/c677005353.shtml"}, {"id": "4412065", "title": "中信证券李春波：中国资本市场韧性和抗风险能力明显增强", "content": "中信证券2026年资本市场论坛在上海举行，中信证券执行委员、中信证券国际董事长李春波致辞称，在“韧链强基”夯实安全底座、“科创自立”打开发展空间的共同驱动下，资本市场服务新质生产力的功能定位将更加突出，价值投资的新机遇将加速形成。“韧链强基，科创自立”的产业与政策格局，将深刻重塑资本市场生态，成为资本市场践行金融强国的关键抓手。资本市场运行的积极动能正在不断积累，市场韧性和抗风险能力也在明显增强。（财联社）", "ctime": 1779856375, "time_str": "12:32:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260527/c677005236.shtml"}, {"id": "4412051", "title": "我国在算电协同相关国际标准化布局方面取得积极进展", "content": "记者5月27日从国家数据发展研究院获悉，在近期举行的国际电信联盟电信标准化局第20研究组（ITU-T SG20）全体会议上，由国家数据发展研究院牵头提交的标准项目“面向可持续智慧城市和社区的算电协同需求与框架”正式立项。这标志着我国在智慧城市算力基础设施与能源系统协同发展领域的国际标准化布局取得积极进展。（新华社）", "ctime": 1779856094, "time_str": "12:28:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260527/c677005199.shtml"}, {"id": "4412041", "title": "企业微信全量上线“面聊”功能", "content": "5月27日，据微信官方播客《微信公开Talk》消息，企业微信已在最新版本中正式推出“记录面聊”功能。根据官方介绍，在小组周会、项目讨论等线下场景，用户可通过手机端一键开启“记录面聊”。该功能依托声纹识别技术，能够精准区分并匹配企业通讯录中的发言人，实现“听声辨人”，并将语音实时转化为结构化的文字记录。此外，AI可根据对话内容自动提炼核心要点生成会议纪要，并直接拆解、分配待办事项至对应责任人。", "ctime": 1779855683, "time_str": "12:21:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, const SECTORS  = [{"name": "半导体", "hit_count": 30, "etfs": []}, {"name": "人工智能", "hit_count": 27, "etfs": []}, {"name": "金融", "hit_count": 27, "etfs": []}, {"name": "数据要素", "hit_count": 23, "etfs": []}, {"name": "消费", "hit_count": 11, "etfs": []}, {"name": "军工", "hit_count": 8, "etfs": []}, {"name": "新能源", "hit_count": 6, "etfs": []}, {"name": "机器人", "hit_count": 4, "etfs": []}];
const META     = {"update_time": "2026-05-27 13:46:38", "sentiment_score": 54.5045045045045, "agents": []};

// 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
