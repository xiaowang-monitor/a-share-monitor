714/c678158314.shtml"}, {"id": "4712741", "title": "天承科技：预计2026年上半年净利润最高达6500万元", "content": "天承科技公告，预计2026年上半年净利润最高达6500万元，与上年同期3673.36万元相比，将增加2326.64万元到2826.64万元，同比增加63.34%到76.95%。", "ctime": 1784001912, "time_str": "12:05:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260714/c678158253.shtml"}, {"id": "4712725", "title": "港股午评：恒生指数跌0.47%，恒生科技指数跌1.42%", "content": "港股午间收盘，恒生指数跌0.47%，恒生科技指数跌1.42%。恒指港股通ETF银华（159318）跌0.56%，港股通科技ETF鹏华（159751）跌1.26%。板块方面，海上运输、能源设备与服务板块涨幅靠前；生命科学工具、电气设备板块跌幅靠前。个股方面，真健康医疗-B涨16.44%，创新实业涨7.77%，深演智能涨7.66%，建滔积层板涨7.64%，广合科技涨7.6%；德适-B跌14.41%，首钢朗泽跌13.59%，海清智元跌11.2%，芯碁微装跌9.17%，百度集团-SWR跌8.9%。", "ctime": 1784001705, "time_str": "12:01:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260714/c678158210.shtml"}, {"id": "4712705", "title": "乌克兰与欧洲九国组建反导联盟", "content": "当地时间7月13日，“意愿联盟”峰会在法国巴黎举行。乌克兰与法国、德国、英国等9个欧洲国家当天发表联合声明，宣布启动建立“一体化反弹道导弹联盟”。声明指出，鉴于弹道导弹构成的威胁日益增长，防御能力对欧洲大陆安全的重要性不断上升，宣布即日启动建立纯防御性质的反弹道导弹联盟，并支持加快发展反弹道导弹能力。在当天早些时候的例行新闻简报会上，俄罗斯总统新闻秘书佩斯科夫将这一“意愿联盟”称为“好战分子联盟”。（CCTV国际时讯）", "ctime": 1784001550, "time_str": "11:59:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260714/c678158161.shtml"}, {"id": "4712699", "title": "7月14日午间公告一览：迪哲医药与阿斯利康签署许可协议 获6亿美元首付款", "content": "7月14日迪哲医药公告，公司与阿斯利康签署许可协议，授予阿斯利康在全球范围内的独家开发、商业化舒沃哲 的权利。公司将获得阿斯利康支付的一次性、不可返还首付款6亿美元，最高达4亿美元的临床开发里程碑款项以及最高达5亿美元的销售里程碑款项，以及按舒沃哲 全球销售额最高到低双位数的阶梯式比例的特许权使用费。", "ctime": 1784001530, "time_str": "11:58:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260714/c678158157.shtml"}, {"id": "4712695", "title": "陕西安康发布高温红色预警信号", "content": "陕西省安康市气象台7月14日9时57分升级发布高温红色预警信号：预计汉滨区、旬阳市、白河县未来24小时内最高气温将升至40℃以上，石泉县、汉阴县、紫阳县、岚皋县、平利县未来24小时内最高气温将升至37℃以上。（央视新闻）", "ctime": 1784001485, "time_str": "11:58:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260714/c678158154.shtml"}, {"id": "4712687", "title": "伊朗革命卫队证实袭击美军第五舰队", "content": "伊朗伊斯兰革命卫队14日在社交媒体上发表声明说，革命卫队海军和航空航天部队用导弹和无人机攻击了位于巴林的美军第五舰队，击中该舰队燃料库，成功击中并摧毁雷达系统以及“爱国者”防空系统。声明说，美军第五舰队的无人艇控制与监控中心也被彻底摧毁。伊朗的报复仍在继续。（新华社）", "ctime": 1784001251, "time_str": "11:54:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260714/c678158117.shtml"}, {"id": "4712683", "title": "韩国综指跌幅收窄至不到2%", "content": "韩国综指跌幅收窄至不到2%，稍早一度跌超5%。", "ctime": 1784001120, "time_str": "11:52:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260714/c678158097.shtml"}, {"id": "4712671", "title": "抖音电商：二季度为商家降本超百亿元", "content": "7月14日，抖音电商公布2026年九大商家扶持政策二季度落地进展：该季度平台累计为商家节省经营成本超百亿元。除直接费用减免外，二季度政策还覆盖了提升结算率、开放AI技术能力、分层扶持商家、后台服务升级等多个环节。（人民财讯）", "ctime": 1784000911, "time_str": "11:48:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260714/c678158033.shtml"}, {"id": "4712667", "title": "Omdia：二季度全球智能手机市场下滑4% 苹果与三星逆势增长", "content": "根据Omdia最新研究，2026年第二季度全球智能手机出货量同比下降4%。持续的存储器供应危机扰乱了市场供应，并推高了关键元器件成本，进一步加剧了市场压力。当前市场正呈现明显的两极分化，不同厂商在应对策略上出现显著差异，主要受到战略重点、市场规模、价格段侧重以及目标用户群体等多重因素影响。其中，三星和苹果逆势实现出货量增长，并分别较2025年第二季度提升2%和4%的市场份额，成为少数在整体市场下行背景下仍实现增长的厂商。（人民财讯）", "ctime": 1784000833, "time_str": "11:47:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260714/c678158024.shtml"}, {"id": "4712663", "title": "迪哲医药：与阿斯利康签署许可协议 获6亿美元首付款", "content": "迪哲医药公告，公司与阿斯利康签署许可协议，授予阿斯利康在全球范围内的独家开发、商业化舒沃哲 的权利。公司将获得阿斯利康支付的一次性、不可返还首付款6亿美元，最高达4亿美元的临床开发里程碑款项以及最高达5亿美元的销售里程碑款项，以及按舒沃哲 全球销售额最高到低双位数的阶梯式比例的特许权使用费。", "ctime": 1784000706, "time_str": "11:45:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260714/c678157990.shtml"}, {"id": "4712655", "title": "理财公司被传限投消费金融ABS，多家机构回应：业务正常，合规趋严", "content": "近日，市场传闻监管部门拟限制理财资金投资信托公司发行的消费金融ABS产品。就此，记者向多家信托公司及理财公司展开求证。多家信托公司人士表示，目前尚未收到明确监管文件，但普遍感受到业务合规要求正持续收紧。某信托公司高管透露，尽管未有正式信号落地，实操中消费金融类信托业务的合规门槛已明显提高，机构主动压降规模，更多是基于风险层面的考量。“倘若未来要压降或限制该类业务，仍希望能给机构留出一定缓冲空间，避免市场因预期骤变产生负反馈。”另有信托公司称，此前已对消金业务开展过内部风险排查。理财公司方面，多家理财公司均向记者表示未接到相关通知。一位股份行理财公司人士称：“前段时间传闻较多，但至今未有实质动作，相关业务仍在正常开展。”（中证金牛座）", "ctime": 1784000613, "time_str": "11:43:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260714/c678157979.shtml"}, {"id": "4712619", "title": "SK海力士正积极扩大其DRAM制造中铪基高k前驱体的供应商范围", "content": "为打破供应链单一依赖，SK海力士正积极扩大其DRAM制造中铪（Hf）基高k（High-k，高介电常数）前驱体的供应商范围。这种前驱体长期以来一直受日本Tri Chemical Laboratories Inc. (TCLC)公司持有的专利保护，但这些专利将于今年晚些时候到期。（科创板日报）", "ctime": 1784000236, "time_str": "11:37:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260714/c678157794.shtml"}, {"id": "4712599", "title": "ETF两市成交额报3465.27亿元，较昨日此时缩量340.53亿元", "content": "截至目前，ETF两市成交额报3465.27亿元，较昨日此时缩量340.53亿元，分类型来看，股票型ETF成交额1378.44亿元，债券型ETF成交额1278.88亿元，货币型ETF成交额83.98亿元，商品型ETF成交额30.21亿元，QDII型ETF成交额693.77亿元。", "ctime": 1783999992, "time_str": "11:33:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260714/c678157638.shtml"}, {"id": "4712589", "title": "国家铁路局发布《机车车辆防火》等三批铁路行业技术标准", "content": "近日，国家铁路局发布以《机车车辆防火》系列、《铁路机车车辆氢燃料电池》系列为代表的三批铁路行业技术标准，涵盖机车车辆安全要求、通信信号及调度系统、安全预警设备、工务作业管理要求等领域，对保障铁路运营安全和提高产品质量具有重要意义。（人民财讯）", "ctime": 1783999897, "time_str": "11:31:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260714/c678157613.shtml"}, {"id": "4712583", "title": "ETF午评：标普油气ETF领涨5.76%，数字经济ETF领跌10.0%", "content": "ETF午间收盘涨跌不一，标普油气ETF（513350）领涨5.76%，标普油气ETF（159518）涨4.03%，能源化工ETF（159981）涨3.94%，数字经济ETF（159311）领跌10.0%，卫星ETF（159206）跌8.53%，卫星ETF（512630）跌7.89%。", "ctime": 1783999852, "time_str": "11:30:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260714/c678157602.shtml"}, {"id": "4712581", "title": "A股午评：沪指低开低走跌破3900点，半导体、商业航天、6G概念板块跌幅居前", "content": "A股三大指数早盘集体下跌，截至午盘，上证指数跌0.66%，深证成指跌0.42%，创业板指跌0.29%，北证50跌0.22%，科创50指数跌3.45%。全市场成交额16352亿元，较上日缩量2290亿元，全市场超2900只个股下跌。板块题材上，油气开采及服务、医药商业、煤炭开采加工、可燃冰、转基因板块涨幅居前；国家大基金持股、半导体、6G概念、商业航天、通信服务板块跌幅居前。盘面上，美国总统特朗普已正式通知国会，伊朗战事重新爆发。油气开采及服务早盘高开高走，蓝焰控股涨停，科力股份涨超15%，通源石油涨超14%，潜能恒信、中曼石油、海油发展跟涨。医药商业板块低开高走，药易购、人民同泰涨停，建发致新、华人健康、大参林涨幅居前。煤炭开采加工板块表现活跃，大有能源涨停，昊华能源、淮北矿业、山煤国际涨幅居前。半导体板块持续下挫，上海合晶跌超15%，有研硅、盛科通信、华海清科、沪硅产业、航宇微等多股跌超10%。通信服务板块表现低迷，三维通信、数据港、润建股份触及跌停，奥飞数据、光环新网、蜂助手跌幅居前。商业航天概念股延续跌势，再掀跌停潮，中国卫星、中国卫通、航天动力、航天发展、通宇通讯等十余股触及跌停，航天环宇、超捷股份、电科蓝天等股跌超10%。", "ctime": 1783999843, "time_str": "11:30:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260714/c678157601.shtml"}, {"id": "4712571", "title": "股指期货早盘收盘 主力合约全线下跌", "content": "股指期货早盘收盘，主力合约全线下跌。沪深300股指期货(IF)主力合约跌0.21%，上证50股指期货(IH)主力合约跌0.92%，中证500股指期货(IC)主力合约跌1.01%，中证1000股指期货(IM)主力合约跌0.73%。", "ctime": 1783999818, "time_str": "11:30:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260714/c678157589.shtml"}, {"id": "4712555", "title": "海关总署回应贸易顺差：我们将继续积极扩大进口，推动进出口平衡发展", "content": "7月14日上午，国务院新闻办公室举行关于2026年上半年货物贸易进出口情况的新闻发布会。有媒体记者现场提问：中国的贸易顺差正在引起贸易伙伴的担忧，其中最强烈的是欧盟，您如何看待今年剩余时间中国的贸易顺差变化？另外，中国提出“向上平衡”，作为解决与欧盟贸易紧张关系的一种方式，这个术语是否意味着从欧盟国家进口更多？能否解释一下是什么意思？海关总署新闻发言人、统计分析司司长吕大良回复说，关于中国的贸易差额，我想指出的是，中国外贸具有大进大出的特点，我们不仅是全球的第一大出口国，同时也是全球的第二大进口国。今年上半年的数据显示，我国进口增速高于出口，贸易顺差收窄了4.7%。“十五五”期间，我们将继续积极扩大进口，推动进出口平衡发展。“关于您提到的‘向上平衡’这个问题，中国与欧盟在经贸领域已经建立了一个常态化的交流机制，这个机制就是中欧贸易投资磋商机制。近日，这个机制召开了首次会议，会议期间也讨论了您所提到的‘向上平衡’，具体情况建议您向有关部门了解。”他说。（澎湃新闻）", "ctime": 1783999425, "time_str": "11:23:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260714/c678157412.shtml"}, {"id": "4712541", "title": "国家药监局批准阿更葡糖钠注射液上市", "content": "近日，国家药品监督管理局批准杭州奥默医药股份有限公司申报的1类创新药阿更葡糖钠注射液（商品名称：奥美克松）上市，该药品用于拮抗罗库溴铵诱导的神经肌肉阻滞。该药品上市为患者提供了新的治疗选择。", "ctime": 1783999245, "time_str": "11:20:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260714/c678157357.shtml"}, {"id": "4712537", "title": "韩国综指跌幅扩大至5%", "content": "韩国综指跌幅扩大至5%，现报6465.97点。个股方面，SK海力士跌超8%，三星电子跌超2%。", "ctime": 1783999111, "time_str": "11:18:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260714/c678157314.shtml"}, {"id": "4712529", "title": "上期所原油主力合约暴涨9%", "content": "上期所原油主力合约暴涨9%，报514.8元/桶。", "ctime": 1783998938, "time_str": "11:15:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260714/c678157256.shtml"}, {"id": "4712517", "title": "紫光股份触及跌停", "content": "紫光股份触及跌停，成交额114.07亿元，封单6002手。", "ctime": 1783998851, "time_str": "11:14:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260714/c678157189.shtml"}, {"id": "4712515", "title": "北京电力具身智能机器人中试验证平台正式对外服务", "content": "近日，由北京市经济和信息化局指导，国网北京市电力公司牵头建设的北京电力具身智能机器人中试验证平台建成并对外提供服务。该平台位于大兴区磁各庄国网北京市电力公司实验实训基地，占地面积5000余平方米，包含输变电真型实验平台、配网真型实验平台、电力具身智能研发验证区等多个区域，重点聚焦输变配巡检、带电作业等电网核心业务场景，打造电力具身智能机器人自主巡视、状态检测、现场操作等中试验证能力。（人民财讯）", "ctime": 1783998843, "time_str": "11:14:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260714/c678157188.shtml"}, {"id" itle": "欧盟对华新乘用车和轻型卡车充气橡胶轮胎作出反倾销终裁", "content": "欧盟委员会发布公告，对原产于中国的新乘用车和轻型卡车充气橡胶轮胎作出反倾销肯定性终裁，裁定中国涉案企业韩泰集团（Hankook Group）：重庆韩泰轮胎有限公司（Chongqing Hankook Tire Co., Ltd.）、江苏韩泰轮胎有限公司（Jiangsu Hankook Tire Co., Ltd.）、韩泰轮胎有限公司（Hankook Tire China Co., Ltd.）的反倾销税率为 4.3%；山东永盛橡胶集团有限公司（Shandong Yongsheng Rubber Group Co., Ltd.）的反倾销税率为 45.3%；其他合作企业（详见原文附件）的反倾销税率为 24.4%；中国其他企业的反倾销税率为 45.3%。涉案产品的欧盟CN（Combined Nomenclature）编码为4011 10 00和4011 20 10。本案倾销调查期为2024年1月1日至2024年12月31日，损害调查期为2021年1月1日至倾销调查期结束。公告自发布次日起生效。（中国贸易救济信息网）", "ctime": 1783998546, "time_str": "11:09:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260714/c678157048.shtml"}, {"id": "4712469", "title": "韩国交易所启动SIDECAR机制，暂停KOSDAQ程序化卖盘", "content": "韩国交易所启动SIDECAR机制，暂停KOSDAQ程序化卖盘。", "ctime": 1783998501, "time_str": "11:08:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260714/c678157001.shtml"}, {"id": "4712465", "title": "科创50指数跌幅扩大至4%", "content": "科创50指数跌幅扩大至4%，现报1914.4点。", "ctime": 1783998453, "time_str": "11:07:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260714/c678156957.shtml"}, {"id": "4712461", "title": "荣耀与阿里将官宣重磅合作，或涉及下一代终端操作系统Agentic OS落地", "content": "荣耀将于7月18日在2026世界人工智能大会（WAIC 2026）举办“从数字屏幕到具身智能——物理世界新范式”分论坛。7月14日，荣耀官宣活动嘉宾阵容，除之前已官宣的世界著名科技未来学家凯文·凯利外，阿里巴巴集团副总裁、ATH事业群Token Foundry多模态交互负责人许主洪的加入，引发业界对后续各方合作的推测。从荣耀内部渠道获悉，双方将官宣重磅合作。据此前公开消息，本次论坛将聚焦AI的智能度和生命感，探讨从“工具”到“伙伴”的Agentic OS趋势演进。荣耀与阿里的联手方向极有可能是下一代终端操作系统Agentic OS的落地实践。（新浪科技）", "ctime": 1783998399, "time_str": "11:06:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260714/c678156947.shtml"}, {"id": "4712451", "title": "海关总署：上半年空调等清凉家电出口超千亿元，自主品牌家电出口占比达1/4", "content": "7月14日，海关总署新闻发言人、统计分析司司长吕大良在国新办新闻发布会上表示，在全球高温多发的情况下，空调、电扇、冰箱等清凉家电，上半年合计出口1079.1亿元。“近年来社会上比较关注的是‘新三样’，也就是电动汽车、锂电池和光伏产品，实际上我们还有‘老三样’，也就是手机、电脑和家电，也持续在稳外贸中发挥重要作用。”吕大良强调。吕大良指出，当前智能化正持续赋能，推动我国家电产业迭代焕新。我国出口家电不仅品质在提升，品牌也在升级，在出口家电中，自主品牌已占到1/4。（人民财讯）", "ctime": 1783998225, "time_str": "11:03:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260714/c678156907.shtml"}, {"id": "4712443", "title": "中共中央决定给予马兴瑞开除党籍、开除公职处分", "content": "经中共中央批准，中央纪委国家监委对马兴瑞严重违纪违法问题立案审查调查。6月30日，中共中央政治局会议审议并通过中共中央纪律检查委员会《关于马兴瑞问题审查结果和处理意见的报告》。马兴瑞完全背离党性原则，严重违背党中央对高级干部提出的政治要求，其行为严重违反党的纪律，构成职务违法并涉嫌受贿犯罪，且在党的十八大后不收敛、不收手，性质极其严重，影响极其恶劣。依据《中国共产党纪律处分条例》《中华人民共和国监察法》《中华人民共和国公职人员政务处分法》等有关规定，经中央纪委常委会会议研究并报中央政治局会议审议，决定给予马兴瑞开除党籍处分，由国家监委给予其开除公职处分，终止其党的二十大代表资格，收缴其违纪违法所得，将其涉嫌犯罪问题移送检察机关依法审查起诉。给予其开除党籍的处分，待召开中央委员会全体会议时予以追认。（央视新闻）", "ctime": 1783998103, "time_str": "11:01:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260714/c678156865.shtml"}, {"id": "4712433", "title": "上海银行间同业拆放利率(Shibor)集体上涨", "content": "隔夜shibor报1.3890%，上涨1.70个基点；7天shibor报1.4020%，上涨0.20个基点；14天shibor报1.4050%，上涨0.50个基点；1月shibor报1.4132%，上涨0.12个基点；3月shibor报1.4299%，上涨0.09个基点。", "ctime": 1783998059, "time_str": "11:00:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260714/c678156857.shtml"}, {"id": "4712423", "title": "TrendForce：DDR5 16Gb (2Gx8) 4800/5600现货均价较上日上涨0.35%", "content": "TrendForce数据显示，7月14日内存颗粒DDR5 16Gb (2Gx8) 4800/5600现货均价较上日上涨0.35%，DDR4 16Gb (2Gx8) 3200现货均价较上日上涨0.32%，DDR4 8Gb (1Gx8) 3200现货均价较上日上涨0.26%。", "ctime": 1783998028, "time_str": "11:00:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260714/c678156854.shtml"}, {"id": "4712411", "title": "海关总署：上半年中美货物贸易总值2万亿元", "content": "国务院新闻办公室今天（14日）举行发布会，介绍今年以来我国外贸运行情况。发布会上，海关总署新闻发言人介绍，据中国海关统计，上半年中美货物贸易总值2万亿元，占我国外贸总值的7 const SECTORS  = [{"name": "金融", "hit_count": 27, "etfs": []}, {"name": "数据要素", "hit_count": 19, "etfs": []}, {"name": "人工智能", "hit_count": 18, "etfs": []}, {"name": "消费", "hit_count": 14, "etfs": []}, {"name": "军工", "hit_count": 12, "etfs": []}, {"name": "半导体", "hit_count": 12, "etfs": []}, {"name": "医药", "hit_count": 8, "etfs": []}, {"name": "新能源", "hit_count": 7, "etfs": []}];
const META     = {"update_time": "2026-07-14 12:22:19", "sentiment_score": 50.25, "agents": []};

// 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">

        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股

  const tbody = document.getElementById('picks-table');

    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';

  tbody.innerHTML = PICKS.map(p => {

      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },

    const miniBar = dims.map(d => {

      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">

        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
