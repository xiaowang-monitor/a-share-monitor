}

}
.score-bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s; }
.up { color: var(--red); }
.down { color: var(--green); }
.pulse { animation: pulse 2s infinite; }
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }

.glow { box-shadow: 0 0 20px rgba(59,130,246,0.15); }

ock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260616/c677510002.shtml"}, {"id": "4538155", "title": "通达动力：完成回购281.68万股", "content": "通达动力公告，截至本公告披露日，公司通过回购专用证券账户以集中竞价交易方式回购公司股份281.68万股，占公司目前总股本的比例为1.7061%，最高成交价为19.26元/股，最低成交价为14.5元/股，支付的总金额为4999.43万元（不含印花税、交易佣金等交易费用）。公司回购股份总金额已超回购方案中回购资金总额下限3000万元，且未超过回购方案中回购资金总额上限5000万元。", "ctime": 1781611374, "time_str": "20:02:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260616/c677509998.shtml"}, {"id": "4538153", "title": "冠中生态：终止建水县历史遗留矿山生态修复项目并将剩余募集资金永久补充流动资金", "content": "冠中生态公告，公司于2026年6月16日召开第五届董事会第十次会议，审议通过了《关于终止部分募投项目并将剩余募集资金永久补充流动资金的议案》。同意公司终止“建水县历史遗留矿山生态修复项目勘查设计施工总承包”项目，并将剩余募集资金永久补充流动资金。该项目涉及募集资金投资金额为1.4亿元，占可转债募集资金净额的35.76%。截至2026年6月11日，该项目已使用募集资金5767.94万元，剩余尚未使用募集资金8756.75万元。终止该项目是基于市场环境变化及公司经营发展战略需要，旨在提高募集资金使用效率，对公司生产经营无重大不利影响。", "ctime": 1781611366, "time_str": "20:02:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260616/c677509993.shtml"}, {"id": "4538113", "title": "6月16日 周二《新闻联播》要闻15条", "content": "1、习近平举行仪式欢迎缅甸总统访华；\n2、习近平同缅甸总统会谈；\n3、《求是》杂志发表习近平总书记重要文章《一体推进教育科技人才发展》；\n4、以习近平党建思想为指引 推动党的事业不断开创新局面；\n5、新华社综述：不断开辟百年大党管党治党、兴党强党新境界——深入学习领会习近平党建思想；\n6、李强会见缅甸总统；\n7、赵乐际主持召开十四届全国人大常委会第六十八次委员长会议 决定十四届全国人大常委会第二十三次会议6月23日至26日在京举行；\n8、赵乐际会见缅甸总统；\n9、王沪宁会见尼泊尔外交部长；\n10、韩正出席第七届跨国公司领导人青岛峰会开幕式并致辞；\n11、第十九届中华图书特殊贡献奖颁奖仪式在京举行；\n12、5月份我国经济总体平稳 持续向新向优；\n13、国务院新闻办举行“新征程上的奋斗者”中外记者见面会；\n14、中央宣传部 应急管理部联合发布“最美应急管理工作者”；（央视新闻）", "ctime": 1781611295, "time_str": "20:01:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260616/c677509943.shtml"}, {"id": "4537963", "title": "李强会见缅甸总统敏昂莱", "content": "6月16日下午，国务院总理李强在北京人民大会堂会见来华进行国事访问的缅甸总统敏昂莱。\n\n李强表示，中缅是山水相连、友谊深厚的好邻居、好伙伴。今天上午，习近平主席同总统先生举行会谈，就深化发展中缅关系作出进一步规划。中方将一如既往支持缅方走符合本国国情的发展道路，坚定支持缅甸新政府顺利施政，愿同缅方一道遵循两国元首战略引领，弘扬传统友谊，巩固政治互信，深化互利合作，推动双边关系不断走深走实，更好服务两国现代化建设，共促地区稳定繁荣。\n\n李强指出，中方愿同缅方深化高质量共建“一带一路”合作，深入推进中缅经济走廊重大项目建设，进一步释放中方零关税政策红利，持续扩大双边贸易规模，拓展可再生能源、人工智能、数字经济等领域合作，在共同发展的道路上继续携手前行。双方要进一步加强执法安全合作，共同铲除网赌电诈等跨境犯罪毒瘤，切实保障中方在缅人员、机构、项目安全。中方也愿同缅方深化教育、文化、旅游、青年、卫生等领域交流合作，增进两国民众相知相亲。当前国际形势错综复杂，中缅应当在联合国、澜湄合作、上海合作组织等多边框架内密切协调配合，捍卫发展中国家共同利益，推动构建更加公正合理的全球治理体系。(新华社)", "ctime": 1781611084, "time_str": "19:58:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260616/c677509882.shtml"}, {"id": "4537955", "title": "Robinhood裁员10%约300人以保持精简运营", "content": "Robinhood表示，将裁减约10%的员工，约300个岗位，以便在开发新产品的同时“保持精简和纪律性”。根据周二提交的监管文件，公司除裁员外，还将关闭内部少量尚未招聘完成的职位。Robinhood加入了近期裁员的金融科技企业行列，其中包括Block、Crypto.com、Coinbase以及PayPal。虽然许多公司将人工智能视为裁撤岗位的原因之一，但Robinhood表示，此次裁员旨在帮助公司“维持高绩效文化、进一步加快产品开发速度，并保持精简和纪律性”。根据年报数据，截至去年年底，Robinhood共有2958名全职员工，其中超过2600人位于北美地区。根据周二的文件，公司本季度将确认约2000万美元的重组费用，主要与员工遣散费及福利成本相关；此外，还将产生约800万美元与股份薪酬相关的费用。", "ctime": 1781610998, "time_str": "19:56:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260616/c677509860.shtml"}, {"id": "4537829", "title": "张江高科：拟向张江集团转让张江科学之门16.51%股权", "content": "张江高科公告，拟以经资产评估机构出具并经上海市浦东新区国资委备案的评估结果为基础，通过非公开协议转让方式向上海张江（集团）有限公司转让上海张江科学之门科技发展有限公司16.51%的股权，转让价格人民币12.8亿元。", "ctime": 1781610196, "time_str": "19:43:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260616/c677509628.shtml"}, {"id": "4537791", "title": "金富科技：拟定增募资不超过3亿元用于液冷散热组件扩产 投产后预计有良好经济效益", "content": "金富科技公告称，公司拟以简易程序向特定对象发行股票，募集资金总额不超3亿元。扣除发行费用后，净额将全部投入3个项目，包括金富华南液冷板生产基地项目、卓晖金属液冷组件扩产项目、联益热能液冷组件扩产项目，拟投入金额分别为1.45亿元、0.45亿元、1.1亿元。若募资到位前先行投入，后续将置换；若净额不足，由公司自筹。项目建设期均为12个月，目前备案手续正在办理中，投产后预计有良好经济效益。 本次发行尚需深交所审核通过并经中国证监会同意注册。", "ctime": 1781609880, "time_str": "19:38:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260616/c677509433.shtml"}, {"id": "4537777", "title": "微信支付“AI专属卡”最快本周上线，支付巨头AI对垒战加速", "content": "支付宝之外，微信支付也在加速推进AI战略。记者从知情人士处获悉，微信支付正联合腾讯智能体产品WorkBuddy测试AI支付功能，计划在微信钱包中上线“AI专属卡”。该卡消费上限由用户充值金额决定，支付授权范围可随时管控，资金专款专用，智能体发起支付须经用户验密确认。该功能最快于本周上线。不过，记者今日就上述信息向微信支付官方求证，截至发稿未获回应。随着微信支付加速入场，本就拥挤的“支付+AI”赛道再添热度。6月16日，AI版支付宝正式推出，命名“阿宝”，成为全球首个完成全端AI化的超级应用；银联商务基于中国银联APOP协议推出AI支付产品，已落地园区食品预定、云缴费、AI点餐三个高频场景；京东发布国内首个智能体自主支付协议……巨头密集落子，路径各异。(财联社)", "ctime": 1781609745, "time_str": "19:35:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260616/c677509381.shtml"}, {"id": "4537749", "title": "SpaceX美股盘前涨超5%", "content": "SpaceX美股盘前涨超5%，现报203.867美元。", "ctime": 1781609640, "time_str": "19:34:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260616/c677509342.shtml"}, {"id": "4537743", "title": "中粮科技：拟公开挂牌转让所持子公司吉林中粮生化包装有限公司100%股权", "content": "中粮科技公告，拟通过北京产权交易所公开挂牌转让所持吉林中粮生化包装有限公司100%股权。公司直接持有63.0397%，通过全资子公司昌衡有限公司持有36.9603%。本次交易不构成重大资产重组，且不涉及关联交易。若交易顺利完成，公司将不再持有包装公司股权。根据2025年度审计报告，包装公司资产总额为6920.5万元，负债总额为667.18万元，所有者权益为6253.32万元，2025年实现营业收入5279.54万元，净利润为-4181.15万元。", "ctime": 1781609603, "time_str": "19:33:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260616/c677509312.shtml"}, {"id": "4537629", "title": "行云科技：深圳行云签订算力服务协议，金额10.14亿元", "content": "行云科技公告，公司全资子公司深圳市行云控股有限责任公司近日与VB客户签署《算力服务协议》，深圳行云向其提供算力服务，服务期限5年，含税总金额10.14亿元。该合同已获公司第七届董事会第二十次会议审议通过，无需股东会审议，不涉及关联交易，亦不构成重大资产重组。合同若能顺利履行，预计将对公司经营成果产生一定影响。", "ctime": 1781609287, "time_str": "19:28:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260616/c677509036.shtml"}, {"id": "4537623", "title": "一博科技：公司光模块PCBA业务已进入量产阶段", "content": "一博科技投资者关系活动记录表公告，公司跟光模块客户有广泛的业务合作，从前端的PCB设计逐渐切入到后端的PCB制板、PCBA生产制造。目前合作比较多的是PCBA生产。公司珠海PCBA工厂建设有数条专门的生产线，主要为国内某光模块头部企业提供PCBA生产服务。目前，公司光模块PCBA业务已进入了量产阶段，光模块PCB生产目前以研发样品为主，预计到年底具备一定的量产能力。整体来看，光模块业务目前占公司整体营收的比例还不大，对总体业绩影响尚小，公司的未来的业务发展空间较大。", "ctime": 1781609214, "time_str": "19:26:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260616/c677509014.shtml"}, {"id": "4537619", "title": "国家地方共建人形机器人创新中心将在年内推出2.0版本具身智能机器人实训场", "content": "国家地方共建人形机器人创新中心首席科学家江磊透露，年内将联合几大头部企业，共同推出2.0版本的具身智能机器人实训场。去年1月，全国首个异构人形机器人训练场在国地中心（上海）启用，截至目前全国已建成7个互联互通的实训基地。当天，国地中心机器人全生命周期示范应用区发布。江磊表示，下半年，上海张江机器人谷将开放超1万平方米的实体示范场地，集中承载机器人数据采集、产品中试、检测检验、机器人“一机一码”全流程管控等功能。再进一步展望，整个上海张江机器人谷、张江AI创新小镇乃至浦东新区有望纳入示范应用区，打破园区边界限制，实现机器人同步落地数字虚拟空间与实体物理场景。", "ctime": 1781609189, "time_str": "19:26:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260616/c677509012.shtml"}, {"id": "4537591", "title": "科达利：拟在泰国设子公司投建谐波减速机基地，投资不超3.5亿元", "content": "科达利公告，公司拟与台湾盟立、台湾盟英共同投资在泰国设立泰国科盟创新机器人科技有限公司并投资建设谐波减速机生产基地。该项目计划投资金额不超过3.5亿元，其中，公司出资比例51%，台湾盟立出资比例39%，台湾盟英出资比例10%。", "ctime": 1781609015, "time_str": "19:23:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260616/c677508969.shtml"}, {"id": "4537573", "title": "*ST航图：公司股票自6月17日起将被叠加实施其他风险警示", "content": "*ST航图公告，由于公司资金紧张，无法按期偿还债权人债务本息，导致公司主要银行账户被冻结。截至本公告披露日，累计冻结金额1.35亿元，占公司最近一期经审计货币资金的108.93%。根据相关规定，公司股票自2026年6月17日起将被上海证券交易所叠加实施其他风险警示。同时，因公司2025年度经审计的期末净资产出现负值，以及审计机构对公司2025年度财务会计报告出具无法表示意见的审计报告，公司股票已于2026年5月6日被实施退市风险警示。", "ctime": 1781608818, "time_str": "19:20:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260616/c677508911.shtml"}, {"id": "4537569", "title": "智能眼镜线上卖爆了 空气循环扇订单量暴涨近350%", "content": "今年以来，线上消费从衣食类刚需转向高新智能产品，科技大件电商常态化。上半年，智能穿戴、家用机器人、康养智能设备持续热销，科技消费品成为拉动大盘增长主力。基于国补政策和平台直降等优惠的加持，智能家居、家电、数码类产品销售数据亮眼。居住体验更好的同时，还要配备更高效的生活“助手”。商务大数据监测，1-4月，智能眼镜线上零售额同比增长175.2%，智能助行外骨骼等新型智能设备线上销售额暴涨785.5%。随着夏季的到来，“清凉经济”也全面爆发，空气循环扇、制冰机、手机散热器等订单量分别同比增长348%、122%、167%。 (央视财经)", "ctime": 1781608805, "time_str": "19:20:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260616/c677508907.shtml"}, {"id": "4537503", "title": "特朗普称俄罗斯应与乌克兰达成协议", "content": "美国总统特朗普16日称，俄罗斯应该与乌克兰达成协议。当天在法国埃维昂莱班举行的七国集团峰会首场会议聚焦乌克兰危机。特朗普在会后对记者表示，俄乌两国在冲突中伤亡惨重，他将“尽其所能”解决这一冲突。（新华社）", "ctime": 1781608540, "time_str": "19:15:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260616/c677508788.shtml"}, {"id": "4537483", "title": "湖南推出整治烟花爆竹违法违规行为“硬措施”", "content": "记者16日从湖南省应急管理厅获悉，为深刻汲取事故教训，湖南省应急管理厅、省安委办近期专门印发《整治烟花爆竹突出违法违规行为“五项硬措施”》。“五项硬措施”提出，存在相关严重情形或重大事故隐患，依法责令暂时停产停业的，按严重程度，期限从不少于1个月至6个月。存在多股东各自独立进行烟花爆竹生产活动的、从事礼花弹生产的企业将礼花弹销售给未经公安机关批准的燃放活动的等情形的，依法暂扣安全生产许可证6个月。“五项硬措施”还提出，存在相关情形之一的，由县级以上应急管理部门提请属地人民政府依法予以关闭，有关部门应当吊销安全生产许可证。生产经营单位主要负责人五年内不得担任任何生产经营单位的主要负责人；情节严重的，终身不得担任本行业生产经营单位的主要负责人。包括，经停产停业整顿，仍不具备法律、行政法规和国家标准或者行业标准规定的安全生产条件的；不具备法律、行政法规和国家标准或者行业标准规定的安全生产条件，导致发生重大、特别重大生产安全事故的等。湖南省应急管理厅、省安委办要求，强化现场处置，健全“检查—整改—复查”闭环管理机制，坚决杜绝“一罚了之”“以罚代管”现象。（新华社）", "ctime": 1781608415, "time_str": "19:13:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260616/c677508736.shtml"}, {"id": "4537475", "title": "中国民用航空局副局长胡振江会见波音民机集团飞机项目与客户支持高级副总裁兼总经理迈克·弗莱明", "content": "6月16日，中国民用航空局副局长胡振江在京会见波音民机集团飞机项目与客户支持高级副总裁兼总经理迈克·弗莱明，双方就波音在华业务发展、加强波音与中国民航业界合作等共同关心的问题交换意见。（中国民航局）", "ctime": 1781608323, "time_str": "19:12:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260616/c677508710.shtml"}, {"id": "4537473", "title": "金刚光伏：拟与中国信达共同投资设立合伙企业，公司方认缴出资4.86亿元", "content": "金刚光伏公告，公司及全资子公司凤凰高科、全资孙公司金信昊达与鑫盛利保、中国信达甘肃省分公司签署合伙协议，共同投资设立天津陇金信企业管理合伙企业。公司方以持有的苏州金刚和苏州型材100%股权作价8538.28万元以及货币4.01亿元合计认缴4.86亿元，占合伙企业投资总额54.81%；信达方以货币认缴4.01亿元，占45.19%。合伙企业将直接持有上述两家子公司100%股权，仍纳入公司合并报表。合伙企业拟将信达方实缴的4亿元以股东借款方式出借给下属公司，公司控股股东欧昊集团拟为上述借款无偿提供股票质押担保及连带责任保证。", "ctime": 1781608318, "time_str": "19:11:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260616/c677508709.shtml"}, {"id": "4537471", "title": "天宇股份：首次回购0.0150%公司股份，成交总金额为99.85万元", "content": "天宇股份公告，2026年6月16日，公司通过回购专用证券账户以集中竞价交易方式实施了公司股份的首次回购。本次回购股份数量为52100股，占公司总股本的0.0150%，最高成交价为19.25元/股，最低成交价为19.01元/股，成交总金额为99.85万元（不含交易费用）。", "ctime": 1781608284, "time_str": "19:11:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260616/c677508703.shtml"}, {"id": "4537449", "title": "长盈通：5月6日至6月16日累计涨幅249% 明起停牌核查", "content": "长盈通公告，公司股票自2026年5月6日至6月16日期间多次触及异常波动及严重异常波动，累计涨幅达249.36%，远超同期行业及上证指数。公司基本面未发生重大变化，但股价已脱离基本面，存在市场情绪过热和非理性炒作风险。公司滚动市盈率高达1130.56倍，显著高于行业平均的63.38倍。2026年一季度净利润为589.87万元，同比下滑28.72%。公司股票将于6月17日开市起停牌，预计停牌不超过3个交易日，待披露核查公告后复牌。", "ctime": 1781608078, "time_str": "19:07:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260616/c677508469.shtml"}, {"id": "4537441", "title": "中广核格尔木350兆瓦光热示范项目开建", "content": "中国广核集团有限公司通报，中广核格尔木350兆瓦光热示范项目在青海省格尔木市乌图美仁光伏光热园区正式开工。项目采用熔盐塔槽结合技术路线，实现了中广核自主研发的8.6米光热熔盐槽式集热器成套装备及工艺的规模化应用。项目镜场总采光面积达370万平方米，包括3个110万平方米的塔式镜场和1个40万平方米的槽式镜场。其中，槽式镜场全部采用中广核自主研发的8.6米大开口槽式集热器。项目配套15小时大容量熔盐储热装置，储热容量为11747兆瓦时，可实现稳定发电，具备优异的电网灵活调峰能力，能有效提升青海电网新能源消纳效率与全域供电保障能力。项目建成后预计年发电量可达10亿千瓦时，等效节约标煤消耗32万吨、减排二氧化碳86万吨。（新华社）", "ctime": 1781608001, "time_str": "19:06:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260616/c677508415.shtml"}, {"id": "4537421", "title": "广东广西等地暴雨大暴雨持续 18日起主雨带将北抬至江南北部等地", "co const META     = {"update_time": "2026-06-16 20:19:18", "sentiment_score": 55.630630630630634, "agents": []};

// 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');

  const tbody = document.getElementById('picks-table');

      { name: '封单', val: p.seal, w: 10 },

    const miniBar = dims.map(d => {

      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
