", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260715/c678196972.shtml"}, {"id": "4727333", "title": "鲁银投资：以4242.52万元竞得山东数科新能源有限公司15.42%股权", "content": "鲁银投资公告，公司以自有资金通过公开摘牌方式竞得山东数科新能源有限公司15.42%股权，其中竞得中能建数字科技集团有限公司持有的山东数科10%股权，竞得泰安市泰山新能源发展有限公司持有的山东数科5.41554%股权。本次竞买成交总价为人民币4242.52万元，后续公司需向山东数科实缴出资2267.27万元。", "ctime": 1784105299, "time_str": "16:48:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260715/c678196952.shtml"}, {"id": "4727331", "title": "迪哲医药：股票交易异常波动，与阿斯利康签署舒沃哲授权许可协议", "content": "迪哲医药公告，公司股票于2026年7月13日、14日、15日连续三个交易日内收盘价格涨幅偏离值累计达到30%，属于股票交易异常波动情形。经公司自查，近日公司与阿斯利康签署《许可协议》，授予阿斯利康在全球范围内的独家开发、商业化舒沃哲 的权利。公司将获得阿斯利康支付的一次性、不可返还首付款6亿美元，最高达4亿美元的临床开发里程碑款项及最高达5亿美元的销售里程碑款项，此外还将获得按舒沃哲 全球销售额最高到低双位数的阶梯式比例特许权使用费。截至本公告披露日，该交易尚需提交公司股东会审议，最终生效需满足惯例交割条件并取得境外反垄断监管机构等相关机构的必要批准，协议能否生效存在不确定性。", "ctime": 1784105295, "time_str": "16:48:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260715/c678196948.shtml"}, {"id": "4727329", "title": "恒瑞医药：HRS-8829获批临床试验，研发投入约1660万元", "content": "恒瑞医药公告，公司子公司北京盛迪医药有限公司近日收到国家药监局核准签发关于HRS-8829注射用浓溶液的《药物临床试验批准通知书》，同意本品开展联合依达拉奉注射液用于治疗急性缺血性卒中的临床试验，将于近期开展临床试验。HRS-8829为小分子药物，拟用于治疗急性缺血性卒中，单药的Ⅰ期临床试验正在推进中。截至目前，该药品累计研发投入约1,660万元（未经审计）。", "ctime": 1784105258, "time_str": "16:47:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260715/c678196917.shtml"}, {"id": "4727327", "title": "恒瑞医药：HRS-8797片临床试验获批，累计研发投入约3290万元", "content": "恒瑞医药公告，公司子公司成都盛迪医药有限公司收到国家药监局核准签发关于HRS-8797片的《药物临床试验批准通知书》，同意本品开展特应性皮炎的临床试验。HRS-8797片是公司自主研发的治疗特应性皮炎的1类创新药，全球范围内暂无同类药物获批上市，截至目前相关项目累计研发投入约为3290万元（未经审计）。", "ctime": 1784105238, "time_str": "16:47:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260715/c678196888.shtml"}, {"id": "4727309", "title": "和顺电气：中标中油技服移动储能项目合计1.41亿元", "content": "和顺电气公告，公司于近日收到中油技服2026-2028年度移动储能动力服务项目标包1辽河地区（206MWh）及标包4北疆地区（188MWh）的《中标通知书》，合计预估合同金额1.41亿元（含税），中标项目招标人分别为中国石油集团渤海钻探工程有限公司、中国石油集团长城钻探工程有限公司及中国石油集团西部钻探工程有限公司。", "ctime": 1784105061, "time_str": "16:44:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260715/c678196792.shtml"}, {"id": "4727307", "title": "北京市新增1款已完成备案的生成式人工智能服务", "content": "7月15日，据“网信北京”微信公众号消息，截至2026年7月15日，北京市新增1款已完成备案的生成式人工智能服务，累计已完成257款生成式人工智能服务备案。（网信北京）", "ctime": 1784105047, "time_str": "16:44:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260715/c678196784.shtml"}, {"id": "4727305", "title": "打造AI影像生产线 2026美图影像节发布MeituHub", "content": "在2026美图影像节上，美图发布全新产品MeituHub。作为“AI影像生产线”，该产品将于8月5日上线。本届影像节上，在MeituHub发布之前，美图已推出站酷、Picchi、美图设计室、开拍、Artflo、MVLAND、RoboNeo 7款产品，均聚焦于解决明确场景下的典型需求。相比之下，MeituHub并非聚焦某个具体场景，而是负责将美图的影像能力组织起来，围绕具体业务需求搭建适合当前任务的AI影像生产线。（新浪财经）", "ctime": 1784104941, "time_str": "16:42:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260715/c678196730.shtml"}, {"id": "4727303", "title": "新芝生物：拟发行股份并支付现金购买清博华100%股权 股票将于2026年7月16日起停牌", "content": "新芝生物公告，拟以发行股份并支付现金方式购买北京清博华科技有限公司股东所持有的清博华100%股权。为保证公平信息披露，维护投资者利益，避免造成公司股价异常波动，公司股票自2026年7月16日起停牌，预计将于2026年7月30日前复牌。停牌期间公司将根据重大事项的进展情况，及时履行信息披露义务，每5个交易日披露一次有关事项的进展情况。", "ctime": 1784104922, "time_str": "16:42:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260715/c678196713.shtml"}, {"id": "4727301", "title": "科林电气：史文伯因工作原因辞去公司常务副总经理职务", "content": "科林电气公告，2026年7月15日，公司董事会收到公司党委书记、第五届董事会董事、副董事长、提名委员会委员、薪酬与考核委员会委员、公司常务副总经理、公司子公司天津科林电气有限公司执行公司事务的董事及经理史文伯的书面辞职信。史文伯因工作原因辞去公司常务副总经理职务，辞职后继续担任公司党委书记、第五届董事会董事、副董事长、提名委员会委员、薪酬与考核委员会委员、公司子公司天津科林电气有限公司执行公司事务的董事及经理职务。", "ctime": 1784104855, "time_str": "16:40:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260715/c678196689.shtml"}, {"id": "4727295", "title": "云中马：股东弘悦私募减持公司1%股份，持股降至4.34%", "content": "云中马公告，持股5%以上股东浙江弘悦私募基金管理有限公司－弘悦兴丰1号私募证券投资基金于2026年6月26日至7月15日通过集中竞价交易方式累计减持公司股份137.51万股，占公司总股本比例1.00%。本次减持计划已全部实施完毕，减持后弘悦私募持有公司股份降至596.22万股，持股比例由5.34%变动至4.34%，不再是公司持股5%以上股东。", "ctime": 1784104692, "time_str": "16:38:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260715/c678196609.shtml"}, {"id": "4727293", "title": "紫光股份：控股子公司紫光计算机增资扩股引入投资者，投前估值6亿元", "content": "紫光股份公告，公司控股子公司紫光计算机科技有限公司拟进行增资扩股引入投资者，投前估值为6亿元，增资金额合计4.4亿元，对应新增注册资本3.67亿元。增资方包括豫铁智算、盐城华可、嘉兴众元、嘉兴沄航、海宸汇投。同时，郑州紫慧等五名现有股东拟将其合计持有紫光计算机12%的股权转让给海宸汇投。公司同意放弃本次增资的优先认购权及本次股权转让的优先购买权。本次增资完成后，公司对紫光计算机的持股比例将由51%变更为29.4231%，紫光计算机将不再纳入公司合并报表范围。该事项已获公司董事会审议通过。", "ctime": 1784104672, "time_str": "16:37:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260715/c678196602.shtml"}, {"id": "4727283", "title": "乘联分会：7月1-12日全国乘用车市场零售44.3万辆，新能源零售28万辆", "content": "乘联分会数据显示，7月1-12日，全国乘用车市场零售44.3万辆，同比去年7月同期下降15%，较上月同期下降1%，今年以来累计零售914.4万辆，同比下降20%；7月1-12日，全国乘用车厂商批发37.9万辆，同比去年7月同期下降26%，较上月同期下降17%，今年以来累计批发1292.6万辆，同比下降6%。7月1-12日，全国乘用车市场新能源零售28万辆，同比去年7月同期下降8%，较上月同期下降3%，今年以来累计零售498.4万辆，同比下降14%；7月1-12日，全国乘用车厂商新能源批发26.2万辆，同比去年7月同期下降9%，较上月同期下降15%，今年以来累计批发705万辆，同比增长4%。7月1-12日，全国乘用车市场新能源零售渗透率63.1%；7月1-12日，全国乘用车厂商新能源批发渗透率69.1%。（界面新闻）", "ctime": 1784104542, "time_str": "16:35:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260715/c678196538.shtml"}, {"id": "4727281", "title": "星光股份：预计2026年上半年净亏损1800万元至1400万元", "content": "星光股份公告，预计2026年1月1日至2026年6月30日，营业收入为2.05亿元至2.3亿元，归属于上市公司股东的净亏损为1800万元至1400万元，上年同期净利润为-266.09万元。扣除非经常性损益后的净亏损为1850万元至1450万元，上年同期净亏损为844.58万元。基本每股收益为-0.0162元/股至-0.0126元/股，上年同期基本每股收益为-0.0024元/股。", "ctime": 1784104531, "time_str": "16:35:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260715/c678196529.shtml"}, {"id": "4727279", "title": "阿里千问将作为AI能力集成至苹果智能", "content": "阿里千问将作为AI能力集成至Apple智能，为 iOS、iPadOS、macOS 和 visionOS 的中国用户带来智能体验。用户无需在应用间切换，即可在 Apple 设备上直接体验千问的文本与图像理解、内容生成等能力。今日，网信办发布7款提供手机端侧生成式人工智能服务备案信息，其中包括苹果智能、华为小艺大模型、OPPO AndesGPT大模型等。 （科创板日报）", "ctime": 1784104524, "time_str": "16:35:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260715/c678196525.shtml"}, {"id": "4727231", "title": "ASML预计2026年中国市场净销售额占比约20%", "content": "7月15日，ASML发布最新业绩指引及中长期规划。ASML首席财务官戴厚杰表示，预计2026年中国市场净销售额占比约20%。由于全年总销售额预期上调，中国市场绝对销售规模将相应增长，增量需求主要来自本土主导的逻辑芯片领域。此外，ASML计划将2027年EUV产能在2026年基础上提升30%。（第一财经）", "ctime": 1784104069, "time_str": "16:27:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260715/c678196206.shtml"}, {"id": "4727227", "title": "泰和科技：预计2026年上半年净利润同比增长112.89%至176.75%", "content": "泰和科技公告，预计2026年上半年净利润为1.2亿元至1.56亿元，同比增长112.89%至176.75%。报告期内，在原料价格大幅上涨的前提下，通过精细化管理及经营策略的调整，使成本费用均有较大幅度下降的同时，销售单价和收入同比增长带来了利润的倍增，但是氯碱由于行情太差，拖累整体业绩。", "ctime": 1784103960, "time_str": "16:26:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260715/c678196161.shtml"}, {"id": "4727225", "title": "国家发展改革委安排3000万元支持吉林台风暴雨洪涝灾害灾后应急恢复", "content": "记者15日从国家发展改革委获悉，国家发展改革委紧急安排中央预算内投资3000万元，支持吉林省做好台风暴雨洪涝灾害灾后应急恢复，重点用于灾区受损道路、水利等基础设施和学校、医院等公共服务设施灾后应急恢复建设，推动尽快恢复正常生产生活秩序。 7月15日，国家防灾减灾救灾委员会针对第9号台风“巴威”及强降雨对吉林省造成的严重影响，启动国家四级救灾应急响应。(新华社)", "ctime": 1784103946, "time_str": "16:25:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260715/c678196156.shtml"}, {"id": "4727223", "title": "交通运输部规划研究院：第二批零碳运输廊道补贴工作已处于调研论证阶段", "content": "交通运输部规划研究院环境资源所总工程师毛宁在今日举办的第二届车能融合与智慧生态发展论坛上表示，推动新能源重卡规模化应用，应加大政策保障力度，持续推动落实老旧营运货车报废更新政策；用足用好中央预算内节能降碳专项资金对零碳运输通道的支持政策。目前交通运输部已开展首批资金补贴，正统筹谋划第二批零碳运输廊道补贴相关工作。针对第二批建设里程、参与省份、补贴适用范围及补贴比例等核心内容，均处于前期调研论证阶段。（财联社）", "ctime": 1784103936, "time_str": "16:25:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260715/c678196152.shtml"}, {"id": "4727221", "title": "激励效果明显 超2万户科技型中小企首次拿到贷款", "content": "7月15日，国务院新闻办公室举行新闻发布会，介绍2026年上半年货币政策执行和金融统计数据情况，并答记者问。会上，有关负责人介绍，目前，科技创新和技术改造再贷款总额度1.2万亿元，主要作用是激励金融机构加强对中小型科技企业和大规模设备更新的金融服务，取得了不错效果。截至今年4月末，银行发放的科技创新和技术改造贷款已达到了1.5万亿元。其中，科技创新贷款是2188亿元，有2.1万户之前没有贷款的科技型中小企业实现了首次贷款，这些企业往往是处于初创期、成长期，有了首次的贷款记录以后，后续融资就会容易很多。技术改造和设备更新贷款目前余额发放了1.3万亿元，累计为8250个重点领域设备更新项目提供了资金支持。贷款的加权平均利率约为2.7%，有效激发了投融资需求。这项工具在金融侧和产业侧都有比较好的反映，今年科技型中小企业贷款保持了20%左右的较高增长速度。据统计，前5个月，设备工器具购置投资同比增长9.3%，增速比上年同期提高了2.2个百分点。（央视新闻）", "ctime": 1784103902, "time_str": "16:25:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260715/c678196125.shtml"}, {"id": "4727219", "title": "孩子王：预计2026年上半年净利润同比增长10.00%～30.00%", "content": "孩子王公告，预计2026年1月1日至2026年6月30日净利润为正值且属于同向上升情形。预计归属于上市公司股东的净利润为1.57亿元至1.86亿元，比上年同期增长10.00%～30.00%。预计扣除非经常性损益后的净利润为1.21亿元至1.44亿元，比上年同期增长5.00%～25.00%。本报告期业绩同比增长，主要得益于公司中长期“三扩”战略的持续落地，并充分发挥丝域生物并购协同效应。", "ctime": 1784103833, "time_str": "16:23:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260715/c678196091.shtml"}, {"id": "4727211", "title": "伊朗称美军再次袭击布什尔省", "content": "据伊朗方面15日消息，美军当天对伊朗南部布什尔省发动新一轮袭击。\n\n消息援引布什尔市长穆罕默德·莫扎法里的话称，美军当天袭击了该省港口城市布什尔3处地点。袭击造成的损失和人员伤亡情况尚未公布。\n\n伊朗境内唯一运转的核电站位于布什尔城外。(央视新闻)", "ctime": 1784103706, "time_str": "16:21:46", "stock_cod share": false, "source": "", "url": "https://news.10jqka.com.cn/20260715/c678195831.shtml"}, {"id": "4727141", "title": "成本上扬令渠道DDR5内存条价格续涨 渠道品牌抬高零售价持续传导下DDR4内存条迎来反弹", "content": "上游资源端自上月中下旬起缺货、涨价延续，支撑渠道DDR5内存条价格继续维持涨势。同时，在零售端部分渠道品牌主动抬高报价的带动下，存储厂商普遍跟涨，历经一季度下跌行情的DDR4内存条开始迎来反弹。行业内存条因同容量的海外与国产颗粒之间存在一定的价差，所对应的成品方案亦会在定价上有所差距，尤其是海外原厂D5次级颗粒长期供应紧缺且价格居高不下，部分PC客户如若指定海外原厂颗粒，则需支付更高的价格采购相应的成品方案；未来在上游资源被提前锁定加剧供货紧张，推动国产D5次级颗粒价格持续上涨，不同原厂颗粒生产的行业DDR5内存条价差也将逐渐缩小。(科创板日报)", "ctime": 1784103233, "time_str": "16:13:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260715/c678195811.shtml"}, {"id": "4727135", "title": "沪市主板超300家公司中报业绩预喜，超七成最高增幅超100%", "content": "截至2026年7月15日，沪市主板756家上市公司发布2026年半年度业绩预告，306家上市公司交出业绩增长或扭亏的“预喜”成绩单。统计显示，306家公司的预告中，215家预告最高增幅超100%，集中在基础化工、有色金属、电子，电力设备、非银金融等行业。尤其是基础化工、有色金属、电子三大板块，预喜公司数量领跑全市场，基础化工以35家预喜企业数位居首位，有色金属、电子分别为33家、25家紧随其后，三大行业合计预喜数量93家，占整体预喜数量的30%。（第一财经）", "ctime": 1784103104, "time_str": "16:11:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260715/c678195734.shtml"}, {"id": "4727129", "title": "建发致新：预计上半年净利润同比增长2.16%—16.76%", "content": "建发致新公告，预计2026年上半年净利润为1.4亿元—1.6亿元，同比增长2.16%—16.76%。报告期内，公司积极应对市场变化，持续推进业务结构优化和市场拓展，分销业务及医用耗材集约化运营(SPD)业务保持较快发展，带动公司整体毛利水平同比增加。受资产质量变化及存货减值因素影响，公司资产减值损失较上年同期减少，进一步改善了公司盈利水平。", "ctime": 1784102997, "time_str": "16:09:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260715/c678195592.shtml"}, {"id": "4727121", "title": "福龙马：张桂潮已减持0.1072%", "content": "福龙马公告，前任董事及高级管理人员、控股股东、实际控制人的一致行动人张桂潮通过集中竞价方式减持公司股票44.52万股，占公司总股本0.1072%，减持期间为2026年4月21日～2026年7月14日，减持价格区间12.27～19.06元/股，减持总金额576.88万元。本次减持计划实施完毕，当前持股数量0股。", "ctime": 1784102891, "time_str": "16:08:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';

  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">

        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
