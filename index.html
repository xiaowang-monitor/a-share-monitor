"IBM推出全球首款亚1纳米芯片技术，新芯片设计性能最高提升50%", "content": "IBM推出全球首款亚1纳米芯片技术，新芯片设计性能最高提升50%，能效比其2纳米节点芯片提高70%。IBM的新款亚1纳米芯片将近1000亿个晶体管封装在一颗指甲大小的芯片上，密度几乎是2021年发布的IBM2纳米芯片的两倍。该技术得益于一系列结构和材料创新，包括IBM开创性的三维纳米栈架构，展示了即使芯片特性接近原子级，性能和效率的持续提升依然可能。公布的技术结果报告显示，这款新芯片预计将在性能上实现显著飞跃——性能提升多达50%，能效提升70%，满足从生成式人工智能、云基础设施到下一代电子设备的计算能力。鉴于纳米栈技术在亚1纳米节点的早期采用，IBM预计最快五年内可实现量产。 （财联社）", "ctime": 1782381899, "time_str": "18:04:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260625/c677716073.shtml"}, {"id": "4595849", "title": "马来西亚中国银行举办人民币业务推介会", "content": "马来西亚中国银行25日在马来西亚首都吉隆坡举办“2026年人民币业务推介会暨在岸人民币结算行十五周年庆”活动。来自马中两国政府部门、金融机构及工商界等百余位代表出席活动，围绕人民币国际化、马中金融合作等议题展开交流。（新华社）", "ctime": 1782381884, "time_str": "18:04:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260625/c677716067.shtml"}, {"id": "4595797", "title": "*ST清越：公司股票可能被实施重大违法强制退市", "content": "*ST清越公告，公司因涉嫌定期报告等财务数据虚假记载，被中国证监会立案调查并收到《行政处罚事先告知书》。根据告知书认定情况，公司可能触及《上海证券交易所科创板股票上市规则》相关规定，可能被实施重大违法强制退市。同时，公司股票2026年6月25日收盘价为0.95元，首次低于1元，可能触及交易类强制退市。", "ctime": 1782381658, "time_str": "18:00:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260625/c677715972.shtml"}, {"id": "4595795", "title": "华电新能：完成发行5亿元绿色公司债券", "content": "华电新能公告，公司已于2026年6月25日完成2026年面向专业投资者公开发行绿色公司债券（第二期）的发行，实际发行规模为人民币5亿元，票面利率为1.83%。", "ctime": 1782381629, "time_str": "18:00:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260625/c677715957.shtml"}, {"id": "4595759", "title": "对标GPT-Image 2 商汤科技正研发多模态模型SenseNova-U1 Pro", "content": "记者获悉，商汤日日新SenseNova-U1 Pro正在研发中，定位为业界首个以“理解·生成·行动”原生统一为内核的多模态智能体基座，预计将于2026年7月正式启动邀请测试。值得注意的是，此次商汤将全球顶尖模型GPT-Image 2作为对标对象，并把“交付级”设计作为模型应用的重要赛道。据了解，SenseNova-U1 Pro率先支持原生8K分辨率输出，可以直接满足商用需求。而GPT-Image-2等当前全球最强的生成模型，原生直出分辨率上限为4K 381246, "time_str": "17:54:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260625/c677715675.shtml"}, {"id": "4595703", "title": "火炬电子：自产MLCC业务收入占比小，算力应用尚在培育期", "content": "火炬电子公告，公司股票于2026年6月24日、6月25日连续两个交易日内日收盘价格涨幅偏离值累计超过20%，属于股票交易异常波动。针对市场对公司MLCC业务的关注，公司说明截至2025年底，自产MLCC业务收入占主营业务收入比例较小，在算力基础设施方向的应用尚处于培育期，相关业务收入占比极低，对公司业绩影响有限。风险提示显示，公司最新滚动市盈率128.5倍，高于行业90.49倍；自2026年5月6日至6月25日收盘，股票区间涨幅131.38%，短期上涨幅度较大。2026年第一季度公司营业收入13.5亿元，同比增加77.16%；归属于上市公司股东的净利润0.40亿元，同比下降62.82%。经公司自查及向控股股东、实控人核实，不存在应披露而未披露的重大事项。", "ctime": 1782381202, "time_str": "17:53:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260625/c677715663.shtml"}, {"id": "4595701", "title": "京东方：公司已实现TGV开孔、深孔填铜、增层、布线等玻璃基封装载板全流程工艺拉通", "content": "京东方A发布投资者关系活动记录表，其中提到，公司2020年启动玻璃基载板技术调研，2022年投资3.9亿元建设玻璃基/硅基兼容的晶圆级创新实验平台，2024年投资9.93亿元建设板级玻璃基封装载板试验线，并于2025年内完成主设备搬入调试，2026年上半年已实现全自动化设备通线。该试验线设计产能1000片/月。目前，公司已实现TGV开孔、深孔填铜、增层、布线等玻璃基封装载板全流程工艺拉通，并于2025年完成大尺寸高层数（9-2-9，20层）玻璃基载板样品开发和送样。", "ctime": 1782381183, "time_str": "17:53:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260625/c677715654.shtml"}, {"id": "4595699", "title": "艾华集团：超级电容非主营业务暂无销售收入，AI服务器业务收入占比极低", "content": "艾华集团公告，公司股票于2026年6月24日至25日连续2个交易日收盘价格涨幅偏离值累计达20%，属异常波动。经自查并问询控股股东及实际控制人，不存在应披露而未披露的重大事项。针对市场热点，公司说明：超级电容产品目前非主营业务、暂无销售收入且未纳入现有体系；AI服务器及液冷服务器业务处于产品导入与产能爬坡阶段，整体收入占比极低，尚属早期。2026年第一季度，公司扣非净利润5905.95万元，同比下降13.88%。公司股票自2026年5月14日至6月25日累计上涨156.69%，提示股价快速回落风险。", "ctime": 1782381159, "time_str": "17:52:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260625/c677715643.shtml"}, {"id": "4595695", "title": "机构：英伟达800V Power Rack成Vera Rubin选用方案 预估至Rubin Ultra世代扩大采用", "content": "根据TrendForce集邦咨询最新AI Server供电架构研究，英伟达正积极打造自家800V HVDC P 热浪预警。", "ctime": 1782380768, "time_str": "17:46:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260625/c677715389.shtml"}, {"id": "4595657", "title": "浩欧博：股东解除一致行动关系", "content": "浩欧博公告，因公司股东苏州外润投资管理合伙企业（有限合伙）执行事务合伙人发生变更，公司持股5%以上股东海瑞祥天生物科技（集团）有限公司与其部分一致行动人解除一致行动关系，导致权益变动。此次变动不涉及实际持股数量增减，也不触及要约收购。变动前后，海瑞祥天持有公司股份763.14万股，占12.17%；JOHN LI持有23.16万股，占0.37%；苏州外润持有220.3万股，占3.51%。此次权益变动不会导致公司控股股东、实际控制人发生变化。", "ctime": 1782380704, "time_str": "17:45:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260625/c677715311.shtml"}, {"id": "4595635", "title": "海尔生物：控股股东提议以5000万元-1亿元回购公司股份", "content": "海尔生物公告，公司控股股东海尔生物医疗控股基于对公司未来发展的信心和对公司价值的高度认可，提议公司使用自有资金通过上海证券交易所系统以集中竞价交易方式回购公司已发行的部分人民币普通股（A股），并将回购股份在未来适宜时机全部用于员工持股计划或股权激励。回购股份的资金总额不低于人民币5000万元（含），不超过人民币1亿元（含），回购价格不高于公司董事会通过回购股份决议前30个交易日公司股票交易均价的 150%。", "ctime": 1782380518, "time_str": "17:41:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260625/c677715241.shtml"}, {"id": "4595629", "title": "南向资金今日净卖出88.74亿港元 盈富基金遭净卖出居前", "content": "南向资金今日净卖出88.74亿港元。盈富基金、阿里巴巴-W分别遭净卖出43.79亿港元、22.52亿港元；建滔集团、中芯国际分别获净买入约28.31亿港元、26.37亿港元。", "ctime": 1782380501, "time_str": "17:41:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260625/c677715223.shtml"}, {"id": "4595609", "title": "以色列官员否认以军已从黎巴嫩部分地区撤军", "content": "当地时间25日，以色列方面消息称，以色列安全和军方官员透露，以色列军方尚未接到政府要求其从黎巴嫩撤军的指示。消息同时称，在美国举行的新一轮黎以直接会谈中，以色列和黎巴嫩的确讨论了以军可能从黎巴嫩南部地区撤军的问题，但尚未达成任何协议。消息称，当天稍早前，一名美国国务院官员表示，以色列已从黎巴嫩南部部分地区撤军。（央视新闻）", "ctime": 1782380317, "time_str": "17:38:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260625/c677715115.shtml"}, {"id": "4595607", "title": "双鹭药业：获得硫酸镁钠钾口服用     el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
