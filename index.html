": 1787037016, "time_str": "15:10:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260818/c679043487.shtml"}, {"id": "4974525", "title": "Meta即将与州检长联盟对簿公堂 称一旦败诉或面临至多1.4万亿美元罚款", "content": "Meta周二将出庭，与一个由多州检察长组成的联盟进行干系重大的对质。这些检察官指控该公司故意将Facebook和Instagram设计得让年轻用户易于沉迷。Meta案的审判意义尤为重大，因其聚焦于涉嫌违反州消费者保护法和联邦隐私法的行为 —— 每次违规最高可处以2万美元的罚款，而乘上数以百万计的年轻Instagram和Facebook用户的话，罚金就会急速膨胀。据Meta自己测算，败诉的话可能面临至多1.4万亿美元的罚款，这一数额接近其全部市值，在法律史上前所未闻。（财联社）", "ctime": 1787036883, "time_str": "15:08:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260818/c679043372.shtml"}, {"id": "4974497", "title": "欧洲主要股指开盘多数下跌", "content": "欧洲主要股指开盘多数下跌，欧洲斯托克50指数跌0.24%，英国富时100指数涨0.29%，法国CAC40指数跌0.19%，德国DAX指数跌0.21%。", "ctime": 1787036607, "time_str": "15:03:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260818/c679043183.shtml"}, {"id": "4974473", "title": "ETF两市成交额报4922.78亿元，较昨日此时放量568.28亿元", "content": "截至目前，ETF两市成交额报4922.78亿元，较昨日此时放量568.28亿元，分类型来看，股票型ETF成交额1533.51亿元，债券型ETF成交额2397.12亿元，货币型ETF成交额244.45亿元，商品型ETF成交额83.4亿元，QDII型ETF成交额664.31亿元。", "ctime": 1787036501, "time_str": "15:01:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260818/c679043104.shtml"}, {"id": "4974477", "title": "能效指标平均提高15% 新版家用太阳能热水系统能效标准实施", "content": "记者今天从国家标准委了解到，新版《家用太阳能热水系统能效限定值及能效等级》（GB 26969—2025）今年8月1日起实施，将倒逼企业淘汰落后产能，加大高效集热材料、低热损保温技术、低能耗智能化生产设备的使用和智能控制系统的研发投入力度。\n\n预计标准有效实施后，全行业的产品平均能效水平将提升15%，各类型家用太阳能热水系统能效指标平均提高15%，最高提高50%。据初步测算，预计每年将节电240万度。(央视新闻)", "ctime": 1787036501, "time_str": "15:01:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260818/c679043108.shtml"}, {"id": "4974467", "title": "ETF收评：粮食ETF领涨10.05%，日经225ETF领跌2.83%", "content": "ETF收盘涨跌不一，粮食ETF（159063）领涨10.05%，粮食ETF（159072）涨8.33%，粮食ETF（159030）涨7.78%，日经225ETF（513000）领跌2.83%，日经ETF（159866）跌2.72%，港股通信息技术ETF（159185）跌2.58%。", "ctime": 1787036478, "time_str": "15:01:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260818/c679043084.shtml"}, {"id": "4974465", "title": "A股收评：沪指探底回升涨0.19% 种业及粮食概念股集体爆发", "content": "A股三大指数今日涨跌不一，截至收盘，上证指数涨0.19%，深证成指跌0.56%，创业板指跌0.93%，北证50涨2.67%，科创50指数涨0.11%。全市场成交额24198亿元，较上日放量173亿元，全市场超3200只个股下跌。板块题材上，转基因、种植业与林业、粮食概念、农业种植、猪肉板块涨幅居前；能源金属、影视院线、游戏、证券、算力租赁跌幅居前。盘面上，受“厄尔尼诺现象”来袭的影响，粮食概念板块大涨，金健米业、农发种业、京粮控股、黑芝麻、秋乐种业、神农种业等股涨停，康农种业、大北农、国投丰乐涨幅居前。猪肉板块表现活跃，天邦食品、罗牛山涨停，大禹生物、傲农生物、新希望涨幅居前。国产操作系统板块午后大幅拉升，诚迈科技、麒麟信安、中国软件等股涨停，润和软件、神思电子、软通动力涨幅居前。影视院线板块低开低走，北京文化逼近跌停，中广天择、奥飞娱乐、博纳影业跌幅居前。能源金属板块表现低迷，永杉锂业、融捷股份、博迁新材跌幅居前。", "ctime": 1787036467, "time_str": "15:01:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260818/c679043079.shtml"}, {"id": "4974437", "title": "股指期货午盘收盘 主力合约全线收跌", "content": "股指期货午盘收盘，主力合约全线收跌。沪深300股指期货(IF)主力合约跌0.50%，上证50股指期货(IH)主力合约跌0.19%，中证500股指期货(IC)主力合约跌0.55%，中证1000股指期货(IM)主力合约跌0.64%。", "ctime": 1787036418, "time_str": "15:00:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260818/c679043051.shtml"}, {"id": "4974411", "title": "期货收评：美伊谈判破裂引爆原油！暴涨6%领涨全场", "content": "期货收评：截至收盘，大宗商品以上涨为主，涨幅方面，原油涨近6%，燃油、低硫燃油、乙二醇、LPG涨超4%；跌幅方面，多晶硅跌超4%，沪铜、沪锌、氧化铝、铝合金、菜籽、红枣、中证500、沪深300、中证1000跌近1%。", "ctime": 1787036413, "time_str": "15:00:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260818/c679043048.shtml"}, {"id": "4974399", "title": "东方电气成立新公司 含风力发电技术服务业务", "content": "企查查APP显示，近日，东方电气风电设备（唐山汉沽管理区）有限公司成立，法定代表人为周健聪，经营范围包含：新能源原动设备制造；风力发电机组及零部件销售；风电场相关装备销售；风力发电技术服务等。企查查股权穿透显示，该公司由东方电气旗下东方电气风电股份有限公司全资持股。（人民财讯）", "ctime": 1787036166, "time_str": "14:56:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260818/c679042913.shtml"}, {"id": "4974397", "title": "四川：1—7月规模以上工业增加值同比增长6.6%", "content": "四川省统计局发布2026年1—7月四川省国民经济主要指标数据，1—7月，全省规模以上工业增加值同比增长6.6%，规模以上工业企业产品销售率为95.3%。分行业看，41个大类行业中33个行业增加值同比实现增长，其中，电气机械和器材制造业同比增长11.8%，计算机、通信和其他电子设备制造业增长10.7%，电力、热力生产和供应业增长7.9%，化学原料和化学制品制造业增长7.5%，医药制造业增长6.8%。分产品看，天然气产量同比增长0.8%，发电量增长3.6%，锂离子电池增长72.3%，智能电视增长30.3%，集成电路增长18.6%，液晶显示屏增长8.3%，工业机器人增长6.9%。（人民财讯）", "ctime": 1787036144, "time_str": "14:55:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260818/c679042896.shtml"}, {"id": "4974391", "title": "万科已正式撤销集团办公事业部，事业部数量由8个缩减至7个", "content": "新任董事长徐恩利履职后的“第一把火”，烧向了万科的组织架构。记者近日获悉，万科已正式撤销集团办公事业部，事业部数量由8个缩减至7个，原办公事业部负责人卢冰同步转任中航万科负责人。该事业部设立于2024年10月，至本次调整撤销，存续仅22个月。就上述调整，记者向万科方面求证，截至发稿未获回应。不过，万科集团网站已悄然完成组织架构信息更新：目前仅保留物业、商业与酒店、长租公寓、海外、食品、物流及财顾7个事业部，办公事业部已从列表中剔除。这是继2025年9月万科大规模调整组织架构、确立“集团总部+地区公司+事业部”新格局后，又一次关键精简。此次调整，亦被业内普遍视作徐恩利上任后的首个重大动作。（中国房地产报）", "ctime": 1787036029, "time_str": "14:53:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260818/c679042850.shtml"}, {"id": "4974383", "title": "新疆新能源装机总规模截至7月底突破1.74亿千瓦", "content": "8月18日，新疆维吾尔自治区常务副主席张迎春在国家数据局新闻发布会上表示，新疆数字产业根基扎实，转型动能持续迸发。持续推动能源、特色农业等传统优势产业数字化、智能化、绿色化转型，不断培育数字经济新赛道、新增长点。聚焦绿色算力、跨境数字贸易、智慧能源、数字文旅、智慧农业等重点领域，持续推进数字产业化、产业数字化双向赋能、协同发展。特别是新疆风、光资源无限，且与中部、东部约两小时的自然时差形成了能源时空优势互补，新能源装机总规模截至7月底突破1.74亿千瓦，已建成6个千万千瓦级新能源基地，丰富的清洁能源资源优势将为与上合国家开展数字基建共建、数字产业协同、技术成果共享奠定坚实产业基础。（中证金牛座）", "ctime": 1787035917, "time_str": "14:51:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260818/c679042784.shtml"}, {"id": "4974345", "title": "美的集团在重庆成立数智楼宇设备公司", "content": " // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
