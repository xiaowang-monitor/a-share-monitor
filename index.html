<style>
:root {
  --bg-primary: #0a0e17;
  --bg-card: #111827;

  --text-primary: #e2e8f0;

  --green-bg: rgba(34,197,94,0.1);

  --blue: #3b82f6;

* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Noto Sans SC', sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  min-height: 100vh;
}
.mono { font-family: 'JetBrains Mono', monospace; }
.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 20px;
  transition: all 0.2s;
}
.card:hover { background: var(--bg-card-hover); border-color: #334155; }
.badge {
  display: inline-flex; align-items: center; padding: 2px 8px;
  border-radius: 6px; font-size: 12px; font-weight: 500;
}
.badge-s { background: rgba(239,68,68,0.2); color: #ef4444; }
.badge-a { background: rgba(245,158,11,0.2); color: #f59e0b; }
.badge-b { background: rgba(59,130,246,0.2); color: #3b82f6; }
.badge-c { background: rgba(100,116,139,0.2); color: #94a3b8; }
.score-bar {
  height: 6px; border-radius: 3px; background: #1e293b; overflow: hidden;
}
.score-bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s; }
.up { color: var(--red); }
.down { color: var(--green); }
.pulse { animation: pulse 2s infinite; }
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}
.glow { box-shadow: 0 0 20px rgba(59,130,246,0.15); }
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg-primary); }
::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
</style>

              <th class="text-right py-2 px-1">现价</th>

              <th class="text-right py-2 px-1">评分</th>

              <th class="text-right py-2 px-1">板块</th>
              <th class="text-right py-2 px-1">连涨</th>
            </tr>
          </thead>
          <tbody id="picks-table"></tbody>
        </table>

    </div>
  </div>
</div>

<!-- 新闻流 + 交易代理 -->
<div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
  <div class="card">

</div>

const NEWS     = [{"id": "4786205", "title": "农业农村部组织开展我国台湾岛以东管辖海域渔业资源调查", "content": "为全面了解我国管辖海域渔业资源状况，支撑海洋渔业资源养护与可持续发展，7月17日至23日，农业农村部中国水产科学研究院东海水产研究所“蓝海201”科学调查船在我国台湾岛以东海域开展了渔业资源调查。该海域渔业资源种类丰富，是金枪鱼类等主要经济种类的重要产卵场。此次调查采用多学科调查手段，采集了鱼类、头足类、甲壳类等渔业生物样本与环境DNA样本，获取了渔业声学和水文气象等基础数据，为我国系统掌握该海域渔业资源状况奠定了基础，也为在该海域开展渔业资源养护管理、促进海洋渔业可持续发展提供了科学依据。(界面)", "ctime": 1784780754, "time_str": "12:25:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260723/c678378804.shtml"}, {"id": "4786189", "title": "巴西宣布将拓展贸易伙伴应对美关税冲击", "content": "巴西总统卢拉22日宣布，巴西将拓展贸易伙伴以应对美国关税影响，并凭借自身信誉和国际市场地位为本国经济找到新出路。 卢拉表示，巴西政府将推出总额185亿雷亚尔（约合37亿美元）的信贷支持计划，以减轻美国对巴西产品加征关税和中东局势对巴西出口带来的冲击。 据介绍，此次信贷支持计划主要扶持受美国加征关税影响的钢铁、铝、汽车、木材、机械等行业，以及化肥、制药等战略性工业领域和受中东局势影响的出口商。 同日，卢拉签署法案，为一项此前设立的信贷支持计划追加150亿雷亚尔（约合30亿美元）信贷额度。该计划旨在应对去年美国首轮加征关税对巴西经济造成的冲击。 美国贸易代表办公室15日发布声明，宣布依据《1974年贸易法》第301条款，对部分巴西产品加征25%的关税。加征关税措施从7月22日开始生效，涉及数千种巴西产品。(新华社)", "ctime": 1784780272, "time_str": "12:17:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260723/c678378757.shtml"}, {"id": "4786145", "title": "港股午评：恒生指数涨1.34%，恒生科技指数涨0.79%", "content": "港股午间收盘，恒生指数涨1.34%，恒生科技指数涨0.79%。恒指港股通ETF银华（159318）涨1.71%，港股通科技ETF鹏华（159751）涨0.68%。板块方面，工业集团企业、电力板块涨幅靠前；酒店和度假村REIT、航空货运与物流板块跌幅靠前。个股方面，真健康医疗-B涨14.23%，智云科技建设涨14.03%，旺山旺水-B涨13.17%，中伟新材涨12.71%，迅策涨11.4%；天数智芯跌8.46%，怡俊集团控股跌7.05%，华虹宏力跌6.44%，鸣鸣很忙跌5.41%，应星控股跌5.07%。", "ctime": 1784779336, "time_str": "12:02:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260723/c678378503.shtml"}, {"id": "4786131", "title": "卡莱特与天津具身智能创新中心展开战略合作", "content": "据卡莱特消息，近日，卡莱特与天津具身智能创新中心正式签署战略合作框架协议，双方将围绕具身智能领域建立长期合作机制，共同推动技术融合与产业生态建设。(人民财讯)", "ctime": 1784779157, "time_str": "11:59:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqk ": "https://news.10jqka.com.cn/20260723/c678378311.shtml"}, {"id": "4786101", "title": "上海：鼓励公募基金、银行理财等资产管理机构设立更多科创主题ETF基金、科创理财产品等", "content": "中共上海市委金融委员会办公室、上海市发展和改革委员会等部门印发《上海市充分发挥直接融资功能 进一步加强科技金融服务的若干措施》，其中提出，优化一二级市场投资接力。做好科创板重点硬科技企业规范培育工作、境外上市沟通协调工作和创业板地方政府推送企业信息工作，市区联动做好企业合规辅导，支持上海市重点科技企业对接境内外资本市场。优化面向科技企业的上市辅导体系，整合中介机构资源，提供精准的资本市场培训与对接服务。支持设立基石投资基金，并为其跨境投资提供审核备案汇兑等便利。鼓励公募基金、银行理财等资产管理机构设立更多科创主题ETF基金、科创理财产品等，培育二级市场科技投资力量。（人民财讯）", "ctime": 1784778486, "time_str": "11:48:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260723/c678378295.shtml"}, {"id": "4786099", "title": "上海：鼓励上海市国资基金与AIC合作设立股权投资基金", "content": "中共上海市委金融委员会办公室、上海市发展和改革委员会等部门印发《上海市充分发挥直接融资功能 进一步加强科技金融服务的若干措施》，其中提出，拓展金融资本来源。探索经相关决策程序后，对优秀基金管理人设定差异化国资出资比例、门槛收益率等条件，积极吸引社保基金、保险资金等在上海市出资设立股权投资基金。引导保险、养老金等长期资本扩大以“优先股+可转债”方式参与早期科技企业融资的规模。借鉴巨灾债券的风险分层设计，探索发行结构化科技金融产品。鼓励上海市国资基金与AIC合作设立股权投资基金。（人民财讯）", "ctime": 1784778448, "time_str": "11:47:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260723/c678378280.shtml"}, {"id": "4786095", "title": "上海：探索引入境外离岸人民币资金支持境内科技创新", "content": "上海市发展和改革委员会等部门印发《上海市充分发挥直接融资功能 进一步加强科技金融服务的若干措施》，其中提出，深化合格境外有限合伙人（QFLP）试点，发挥国资基金管理人的本土资源优势，推广“外资内管”模式，吸引境外优质资金。探索引入境外离岸人民币资金支持境内科技创新。对运作成熟、信誉良好的外资管理机构，推动优化设立审批流程，完善外汇资金汇兑便利，加强税务合规操作辅导。", "ctime": 1784778378, "time_str": "11:46:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260723/c678378268.shtml"}, {"id": "4786093", "title": "上海：建设直接融资试验区", "content": "中共上海市委金融委员会办公室、上海市发展和改革委员会等部门印发《上海市充分发挥直接融资功能 进一步加强科技金融服务的若干措施》，其中提出，建设直接融资试验区。依托上海市股权投资集聚区及张江科学城、大零号湾等高能级科创集聚区，规划建设直接融资试验区。建立政策评估与反馈机制，定期梳理政策落地堵点，推动及时解决落实，总结形成可复制推广的经验做法。推动在试验区内形成资本、人才、技术、信息的高度集聚，构建覆盖从“0到1”概念验证，到“1到10”孵化加速，再到“10到100”产业放大的全链条融资服务体系。", "ctime": 1784778364, "time_str": "11:46:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260723/c678378263.shtml"}, {"id": "4786089", "title": "上海：持续强化上市公司并购科技企业审核标准公开 支持交易双方以多元化的评估方法为基础协商确定交易作价", "content": "中共上海市委金融委员会办公室、上海市发展和改革委员会等部门印发《上海市充分发挥直接融资功能 进一步加强科技金融服务的若干措施》，其中提出，健全科技并购生态体系。持续强化上市公司并购科技企业审核标准公开，支持交易双方以多元化的评估方法为基础协商确定交易作价。发挥第三方市场化服务平台功能，建设科技企业并购案例库和估值数据库。推动科技企业适用简易审核程序典型案例落地，鼓励开展第三方并购。做好国家级并购基金对接服务，发挥上海市国资并购基金矩阵作用，吸引集聚市场化并购基金，围绕科技企业产业链开展并购交易。鼓励国内保险公司与海外机构开展技术合作，开发并推出本土化并购保险产品。", "ctime": 1784778205, "time_str": "11:43:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260723/c678378186.shtml"}, {"id": "4786085", "title": "上海：推动科创板持续深化改革 持续扩大科创板第五套上市标准的适用范围", "content": "中共上海市委金融委员会办公室、上海市发展和改革委员会等部门印发《上海市充分发挥直接融资功能 进一步加强科技金融服务的若干措施》，其中提出，推动科创板持续深化改革。推动出台科创板人工智能、低空经济等企业适用第五套标准上市审核指引，推动可控核聚变、具身智能、大模型、量子计算、脑机接口等新兴产业和未来产业领域企业在科创板上市，持续扩大科创板第五套上市标准的适用范围，增强资本市场对前沿科技领域未盈利企业的制度包容性与适应性。用好优质科技企业试点IPO预先审阅机制，推动进一步完善上海证券交易所与优质投资机构及专业投资者的沟通交流机制。", "ctime": 1784778074, "time_str": "11:41:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260723/c678378124.shtml"}, {"id": "4786083", "title": "上海：便利科技企业再融资 推动再融资储架发行制度落地实施", "content": "中共上海市委金融委员会办公室、上海市发展和改革委员会等部门印发《上海市充分发挥直接融资功能 进一步加强科技金融服务的若干措施》，其中提出，便利科技企业再融资。用好再融资支持政策，优化再融资审核流程和再融资时间间隔，允许按照未盈利标准上市且尚未盈利的企业及存在破发情形的企业再融资，优化再融资申报材料等，支持科技企业灵活运用增发、配股、可转债等多种工具进行融资。推动再融资储架发行制度落地实施。（人民财讯）", "ctime": 1784778049, "time_str": "11:40:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260723/c678378116.shtml"}, {"id": "4786081", "title": "上海：深化债券市场“科技板”建设", "content": "中共上海市委金融委员会办公室、上海市发展和改革委员会等部门印发《上海市充分发挥直接融资功能 进一步加强科技金融服务的若干措施》，其中提出，深化债券市场“科技板”建设。推动科技创新与民营企业债券风险分担工具、国家融资担保基金等政策工具在上海落地，鼓励金融机构创设信用风险缓释工具，形成央地协同的增信体系，为科技创新债券发行提供支持。用好上海市有关贴息政策，支持更多符合条件的企业发行科技创新债券。深化科技创新债券产品创新，支持更多科技企业发行科创可转债等股债关联产品。（人民财讯）", "ctime": 1784778042, "time_str": "11:40:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260723/c678378114.shtml"}, {"id": "4786057", "title": "A股午评：科创50指数跌超4% 半导体板块表现弱势", "content": "截至午盘，上证指数跌0.19%，深证成指跌0.19%，创业板指跌0.33%，北证50跌0.07%。三市成交额14654亿元，较上日缩量3242亿元。全市场超3200家个股上涨。\n板块题材上，贵金属、油气、电网设备板块涨幅居前；半导体板块跌幅居前。\n盘面上，贵金属板块高开高走，四川黄金涨停，兴业银锡、湖南白银、晓程科技、紫金矿业、赤峰黄金跟涨。油气板块震荡走强，中曼石油2连板，潜能恒信、科力股份涨超10%，通源石油、博迈科、首华燃气、蓝焰控股、惠博普跟涨。电力板块午后走高，长缆科技3连板，顺钠股份、三变科技、中电鑫龙、太阳电缆、汉缆股份、中能电气、宝光股份、百利电气、保变电气、中国西电、华菱线缆、望变电气、新亚电缆涨停。半导体板块震荡走弱，燕东微、华虹宏力跌超10%，甬矽电子、汇成股份、盛科通信、瑞芯微、晶合集成跟跌。", "ctime": 1784777639, "time_str": "11:33:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260723/c678377872.shtml"}, {"id": "4786051", "title": "ETF午评：有色金属ETF领涨3.96%，芯片ETF领跌4.92%", "content": "ETF午间收盘涨跌不一，有色金属ETF（516650）领涨3.96%，石油ETF（159026）涨3.90%，有色ETF（159652）涨3.88%，芯片ETF（159599）领跌4.92%，半导体ETF（159582）跌4.9%，芯片ETF（159560）跌4.9%。", "ctime": 1784777472, "time_str": "11:31:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260723/c678377797.shtml"}, {"id": "4786047", "title": "股指期货早盘收盘 主力合约涨跌互现", "content": "股指期货早盘收盘，主力合约涨跌互现。沪深300股指期货(IF)主力合约涨0.11%，上证50股指期货(IH)主力合约跌0.16%，中证500股指期货(IC)主力合约跌0.56%，中证1000股指期货(IM)主力合约涨0.29%。", "ctime": 1784777431, "time_str": "11:30:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260723/c678377774.shtml"}, {"id": "4786043", "title": "美军袭击伊朗与伊拉克接壤口岸致2死11伤", "content": "据伊朗伊斯兰共和国通讯社23日报道，伊朗胡齐斯坦省官员表示，当天凌晨美军导弹袭击了伊朗与伊拉克接壤的沙拉姆切赫口岸。袭击已造成2人死亡、11人受伤。（新华社）", "ctime": 1784777297, "time_str": "11:28:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260723/c678377705.shtml"}, {"id": "4786037", "title": "沙特阿联酋高层罕见同框力证关系修复", "content": "沙特阿拉伯和阿拉伯联合酋长国，此前因也门、伊朗问题“闹掰”，如今，两国高层不仅同框合影，而且高调发布照片。（央视新闻）", "ctime": 1784777022, "time_str": "11:23:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260723/c678377567.shtml"}, {"id": "4786017", "title": "美军连续第12晚打击伊朗 持续5个小时", "content": "美军中央司令部22日在社交媒体发表声明称，美军已完成最新一轮对伊朗的打击行动。这是美军连续第12晚打击伊朗，打击共持续5个小时。（新华社）\n　　", "ctime": 1784776719, "time_str": "11:18:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260723/c678377373.shtml"}, {"id": "4786007", "title": "北京2026年消费品以旧换新补贴产品扩容", "content": "北京市商务局发布关于新增2026年消费品以旧换新补贴产品的公告，经向商务部报备确认，增加10类补贴产品，现将有关事项公告如下：对在京个人消费者购买智能门锁、智能摄像头、智能扫地机（含智能洗地机、智能吸尘器）、智能马桶（含智能马桶盖）、数码相机（含运动相机）、智能耳机、全屋智能主机（含智慧家庭服务器、智能网关）、智能床（含智能床垫）、智能电动轮椅、具身智能机器人（含陪伴类机器人、机器狗、外骨骼机器人、养老照护机器人）等10类产品给予补贴。对个人消费者购买上述智能家居产品（含适老化家居产品），补贴标准为上述产品扣除各环节优惠后最终销售价格的15%，每人每类可补贴1件，每件补贴不超过1500元。", "ctime": 1784776657, "time_str": "11:17:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260723/c678377319.shtml"}, {"id": "4785997", "title": "港交所上市机制优化方案近期将正式对外公布", "content": "记者日前获悉，港交所筹备数月的上市机制优化方案近期将正式对外公布。预计将落地一系列重大优化措施，包括允许所有公司选择保密递表、大幅放宽“同股不同权”架构限制等。（中国证券报）", "ctime": 1784776590, "time_str": "11:16:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260723/c678377295.shtml"}, {"id": "4785993", "title": "迪拜为挽救旅游业出台激励措施", "content": "阿联酋迪拜近日出台经济激励措施，向本地居民及其来访亲友发放价值约800美元的文旅消费券，以提振在伊朗战事中受到严重冲击的旅游业。（新华社）", "ctime": 1784776491, "time_str": "11:14:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260723/c678377252.shtml"}, {"id": "4785987", "title": "智联招聘：二季度汽车设计/制造工程师以40%招聘增速领跑职业榜", "content": "7月23日，智联招聘发布《2026年二季度人才市场热点快报》，数据显示，二季度招聘企业数同比增加8.5%，增速走高。机器人、新材料、AI等新质生产力行业招聘依然保持较高增速。宠物、养老、美容保健是服务业吸纳就业的增长点。其中，宠物服务以43.2%职位数增速登顶全行业；银发经济催生护理人才刚需，护工需求同比增长3成；宠物、养老、美容保健行业的招聘岗位中，8成分布在二线及以上城市。此外，汽车设计/制造、人工智能、芯片、医药研发等技术人才需求增长且存在缺口。AI工程师中，智能驾驶系统工程师缺口最大，需供比3.41；芯片工程师中，IC设计人才最紧缺，需供比4.46；汽车设计/制造工程师以40%招聘增速领跑职业榜，多环节技术人才面临缺口。", "ctime": 1784776401, "time_str": "11:13:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260723/c678377223.shtml"}, {"id": "4785985", "title": "油服工程板块持续走高", "content": "油服工程板块持续走高，通源石油、科力股份涨超10%，石化油服、博迈科、惠博普、贝肯能源、中海油服等跟涨。", "ctime": 1784776398, "time_str": "11:13:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260723/c678377222.shtml"}, {"id": "4785979", "title": "株洲天桥特种机器人研究院成立", "content": "7月22日，株洲天桥特种机器人研究院揭牌仪式举行。株洲天桥特种机器人研究院由天桥起重牵头组建，将围绕高端化、智能化、绿色化发展，深耕重工领域极端、高危、重载作业场景，重点攻关重载天车机器人、特种机械手、智能巡检运维及远程操控系统等前沿产品，推动行业安全提质、降本增效、智能升级。（人民财讯）", "ctime": 1784776377, "time_str": "11:12:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260723/c678377212.shtml"}, {"id": "4785969", "title": "国内多家金店金饰价格集体上涨，最高报1258元/克", "content": "据同花顺iFinD数据，今日国内黄金饰品价格对比显示，黄金珠宝品牌公布的境内足金首饰价格较昨日集体上涨，最高报1258元/克。", "ctime": 1784776241, "time_str": "11:10:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260723/c678377140.shtml"}, {"id": "4785965", "title": "消息人士称伊朗已准备好应对美军地面入侵", "content": "俄罗斯媒体23日援引一名伊朗军方消息人士的话报道，伊朗军方已推演多种美军进攻场景，并为应对美军地面入侵做好准备。据今日俄罗斯通讯社报道，这名消息人士说：“伊朗武装力量已针对美国可能发动的任何新袭击准备多种应对方案，尤其是如果美国政府犯下错误发起地面入侵。”这名消息人士还说，如果美军再次打击伊朗核设施或基础设施，伊朗的回应将超出美方预期。美国总统特朗普的威胁只会促使伊朗武装力量提升战备水平，抵御可能的入侵。（新华社）", "ctime": 1784776105, "time_str": "11:08:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260723/c678 // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
