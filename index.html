shtml"}, {"id": "4747685", "title": "“云智手机”获中国信通院智能体安全能力L5级认证", "content": "中国电信旗下国脉文化打造的电信“云智手机”智能体通过中国信通院智能体安全能力L5级认证，并完成上海市生成式人工智能服务登记。据悉，这款智能体产品依托中国电信的云端算力与自研AI大模型，打通语音交互、服务调用、任务执行全链路，简化手机日常操作流程，为用户带来一站式的云端智慧体验。（人民财讯）", "ctime": 1784266265, "time_str": "13:31:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260717/c678247880.shtml"}, {"id": "4747535", "title": "国家防减救灾委启动国家四级救灾应急响应 指导重庆做好山体垮塌救灾救助工作", "content": "7月17日，国家防灾减灾救灾委员会针对重庆市彭水山体垮塌，启动国家四级救灾应急响应，派出工作组赴灾区一线实地查看灾情，指导和协助地方做好受灾群众基本生活保障等灾害救助工作。（央视新闻）", "ctime": 1784266086, "time_str": "13:28:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260717/c678247832.shtml"}, {"id": "4747513", "title": "约旦称拦截并击落3枚进入该国领空的伊朗导弹", "content": "当地时间7月17日，约旦武装部队总司令部发布声明称，当天上午，约旦防空系统成功拦截并击落3枚进入约旦领空、目标指向约旦境内的伊朗导弹。声明称，此次拦截行动按照既定防御措施和作战程序实施，旨在维护约旦国家主权、保障领空安全和民众安全。声明表示，此次拦截未造成人员伤亡或财产损失。约旦皇家工兵部队已前往导弹残骸和碎片坠落地点进行处置，并按照相关技术和安全程序完成现场排险工作。声明强调，约旦武装部队将继续密切监控领空态势，保持高度戒备，按照既定交战规则应对任何潜在威胁。（央视新闻）", "ctime": 1784265951, "time_str": "13:25:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260717/c678247800.shtml"}, {"id": "4747511", "title": "中证500股指期货(IC)主力合约日内跌超5%", "content": "中证500股指期货(IC)主力合约日内跌超5%，现报7474.6点。", "ctime": 1784265949, "time_str": "13:25:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260717/c678247799.shtml"}, {"id": "4747507", "title": "中证1000股指期货(IM)主力合约日内跌超5%", "content": "中证1000股指期货(IM)主力合约日内跌超5%，现报7176.6点。", "ctime": 1784265923, "time_str": "13:25:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260717/c678247796.shtml"}, {"id": "4747477", "title": "伊朗革命卫队称打击美军驻科威特军事基地", "content": "当地时间17日，伊朗伊斯兰革命卫队发布声明称，美军前一晚袭击了伊朗的民用设施、电信与铁路部门的工作人员以及过往车辆，导致多名平民伤亡。声明称，作为对美军袭击的回应，伊朗伊斯兰革命卫队航空航天部队打击了美军的一处防空导弹侦测雷达、多个武器库、两套火箭炮系统“海马斯”及该系统储备的部分导弹。袭击还导致美军在科威特的军事基地起火。声明表示，美国在地区内的袭击行为导致石油和天然气产量大幅下降，并造成霍尔木兹海峡石油和天然气出口完全中断。伊朗的对等反击行动仍在继续。（央视新闻）", "ctime": 1784265801, "time_str": "13:23:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260717/c678247761.shtml"}, {"id": "4747447", "title": "国家税务总局：进一步优化境外旅客离境退税服务", "content": "国家税务总局近日发布通知，多措并举推动离境退税业务办理智能化、便利化，进一步优化境外旅客离境退税服务，规范业务办理。根据通知要求，今后退税商店可开具电子退税申请单和电子发票，境外旅客离境退税实现无纸化办理。自2026年9月1日起，“即买即退”实现异地通办。退税商店开具“即买即退”申请单时，可在线上完成审核，境外旅客在异地离境时即可办结退税，打破地域限制，购物退税更灵活。此外，税务总局还积极推动网上商店离境退税试点工作，符合条件的退税商店可线上向境外旅客销售退税物品并办理相关业务，线上线下退税标准一致，拓宽旅客购物退税渠道。全国通用的离境退税服务码也将全面推广。境外旅客扫码就能预填信息、实时查看退税进度和到账情况；商家、海关和退税机构扫码即可快速办理，大幅缩短办理时间。此外通知明确，将严厉打击套代购、走私回流等违法违规行为，违规退税商店将被取消备案，保障市场规范有序。（央视新闻）", "ctime": 1784265790, "time_str": "13:23:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260717/c678247729.shtml"}, {"id": "4747415", "title": "港股恒生科技指数跌幅达5%", "content": "港股恒生科技指数跌幅扩大至5%，恒生指数现跌2.36%。", "ctime": 1784265588, "time_str": "13:19:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260717/c678247718.shtml"}, {"id": "4747399", "title": "兆易创新触及跌停", "content": "兆易创新触及跌停，成交额237.98亿元，封单435手。", "ctime": 1784265438, "time_str": "13:17:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260717/c678247674.shtml"}, {"id": "4747395", "title": "科创50指数跌幅扩大至6%", "content": "科创50指数跌幅扩大至6%，现报1735.89点。", "ctime": 1784265393, "time_str": "13:16:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260717/c678247666.shtml"}, {"id": "4747393", "title": "创业板指跌6%", "content": "创业板指跌幅扩大至6%，上证指数跌2.2%， rce": "", "url": "https://news.10jqka.com.cn/20260717/c678247486.shtml"}, {"id": "4747103", "title": "特步国际：第二季度主品牌零售销售中单位数同比下跌", "content": "特步国际公告，2026年第二季度主品牌零售销售中单位数同比下跌，零售折扣水平为七至七五折。索康尼零售销售低单位数同比增长。上半年主品牌零售销售低单位数同比下跌，渠道存货周转为四个半至五个月。索康尼零售销售低双位数同比增长。", "ctime": 1784264242, "time_str": "12:57:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260717/c678247474.shtml"}, {"id": "4747097", "title": "东土科技推出AI机器人通用学习训练平台MaDo", "content": "7月17日，2026世界人工智能大会（WAIC）在上海开幕。东土科技亮相WAIC，正式推出AI机器人通用学习训练平台MaDo。据悉，MaDo平台面向机器人个人创业公司及中小企业，提供从通用环境适应到专业场景训练的一站式解决方案，让开发者以更低门槛、更短周期构建行业专属能力。（人民财讯）", "ctime": 1784264193, "time_str": "12:56:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260717/c678247469.shtml"}, {"id": "4747079", "title": "昇腾384超节点已商用落地750多套", "content": "在2026世界人工智能大会上，昇腾950超节点（Atlas 950 SuperPoD）真机首次公开亮相，该产品基于灵衢互联协议和超节点架构，实现业界最大1024卡规模，提供1 EFLOPS FP8 、2 EFLOPS FP4算力，拥有256TB全局统一内存编址空间，依托TB级NPU互联超大带宽与3μs 超低RTT时延。据悉，昇腾384超节点已商用落地750多套，规模应用于互联网、运营商、金融、教育、医疗、交通、制造等行业，也是国内唯一训练出SOTA模型的超节点。（科创板日报）", "ctime": 1784264069, "time_str": "12:54:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260717/c678247423.shtml"}, {"id": "4747047", "title": "习近平出席2026世界人工智能大会暨人工智能全球治理高级别会议开幕式并发表主旨讲话", "content": "7月17日上午，国家主席习近平在上海世界会客厅出席2026世界人工智能大会暨人工智能全球治理高级别会议开幕式并发表主旨讲话。(新华社)", "ctime": 1784263735, "time_str": "12:48:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260717/c678247399.shtml"}, {"id": "4747045", "title": "国家发展改革委、国家数据局将在2026年APEC数字周期间举办数据领域系列活动", "content": "据国家数据局，7月25日至29日，国家发展改革委、国家数据局将在四川省成都市举办APEC数字周数据领域系列活动。数字周是APEC中国年“开放、创新、合作”三大优先领域中“创新”项下重要举措，是与会各方深入探讨数智赋能、数据领域创新合作等前沿议题的重要平台，也是我国场景化展示数字中国建设最新成果的重要窗口。（国家数据局）", "ctime": 1784263671, "time_str // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
