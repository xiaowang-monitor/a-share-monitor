false, "source": "", "url": "https://news.10jqka.com.cn/20260624/c677676244.shtml"}, {"id": "4584089", "title": "宁德时代创始人曾毓群：AI用电没想象得那么可怕", "content": "2026夏季达沃斯期间，宁德时代创始人曾毓群表示：“中国的电网与能源体系发展十分成熟。对整个行业而言，新增人工智能数据中心的总耗电量，相较于电力总量并不多。问题在于，数据中心使用化石能源还是可再生能源。如果把数据中心当作一个新类别，要用可再生能源供电的话会有一些困难和问题，因为我们需要足够的面积来建设光伏板、风力发电以及能源存储设施。中国要求新建的数据中心使用80%的可再生能源非常好，中国有能力解决这个问题。”", "ctime": 1782283856, "time_str": "14:50:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260624/c677676201.shtml"}, {"id": "4584087", "title": "南向资金净买入超90亿港元", "content": "据同花顺iFinD数据，截至目前，南向资金净买入超90亿港元，其中港股通（沪）买入超64.01亿港元，港股通（深）买入超26.21亿港元。", "ctime": 1782283843, "time_str": "14:50:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260624/c677676196.shtml"}, {"id": "4584085", "title": "兆易创新触及涨停", "content": "兆易创新触及涨停，成交额388.07亿元。", "ctime": 1782283838, "time_str": "14:50:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260624/c677676193.shtml"}, {"id": "4584073", "title": "李强出席2026年夏季达沃斯论坛开幕式并致辞", "content": "6月24日上午，国务院总理李强在大连出席2026年夏季达沃斯论坛开幕式并致辞。孟加拉国总理塔里克、几内亚总理乌里·巴、哈萨克斯坦总理别克捷诺夫、韩国总理金民锡、蒙古国总理乌其尔勒、黑山总理斯帕伊奇，以及约1800名全球各界代表出席。\n\n李强表示，正如习近平主席指出，抓创新就是抓发展，谋创新就是谋未来。这次论坛以“规模化创新”为主题，点出了当今世界经济发展的一项重大命题。结合中国经济发展实践，我同大家分享中国创新的故事，以及对全球创新合作的一些思考。(新华社)", "ctime": 1782283715, "time_str": "14:48:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260624/c677676162.shtml"}, {"id": "4584033", "title": "日本央行行长植田和男表示，预计通胀趋势有超过2%目标的风险", "content": "日本央行行长植田和男表示，预计通胀趋势有超过2%目标的风险。", "ctime": 1782283578, "time_str": "14:46:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260624/c677676110.shtml"}, {"id": "4584015", "title": "统战部：所谓新疆少数民族“强制迁徙”“强迫劳动”说法极其荒谬可笑", "content": "6月24日上午，国务院新闻办公室举行新闻发布会，介绍《中华人民共和国民族团结进步促进法》和我国民族工作有关情况。中央统战部副部长、国家民委主任陈瑞峰表示，新疆劳动力转移就业是尊重各族群众意愿前提下实施的，目的在于帮助各族群众增加就业机会，提高经济收入，完全是、纯粹是在为新疆老百姓办实事、做好事。所有外出就业的新疆群众，全部都是基于改善家庭生活、提升自身技能的个人意愿自主报名，根本不存在所谓的“强制迁徙”“强迫劳动”，此类说法是极其荒谬、极其可笑的。（央视新闻）", "ctime": 1782283433, "time_str": "14:43:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260624/c677676029.shtml"}, {"id": "4583967", "title": "智平方郭彦东：类脑智能将成为下一代机器人大脑的重要发展方向", "content": "6月23日至25日，世界经济论坛第十七届新领军者年会（夏季达沃斯论坛）在大连举行。智平方创始人兼CEO郭彦东在会上发表演讲时提出，类脑智能、小样本学习以及低功耗计算，将成为下一代机器人大脑的重要发展方向。下一代机器人大脑不应只是算力和数据的竞赛，更需要探索更高效、更可持续的发展路径。当前机器人产业面临的重要挑战之一，是工业、公共服务以及未来家庭场景之间长期存在的应用鸿沟。解决这一问题的关键，在于统一硬件与统一模型。与此同时，不同场景产生的数据持续回流至同一个机器人大脑。工业场景提升机器人精度与稳定性，公共服务场景增强交互与泛化能力，两类能力相互促进，并最终为未来家庭应用奠定基础。", "ctime": 1782283027, "time_str": "14:37:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260624/c677675925.shtml"}, {"id": "4583959", "title": "沪深京三市成交额超3万亿元，较上日此时缩量1634亿元", "content": "据同花顺iFinD数据，沪深京三市成交额超3万亿元，较上日此时缩量1634亿元，预计全天成交金额约3.3万亿元。截至目前，沪市成交额13792亿元，深市成交额16024亿元，北证50成交额200亿元。", "ctime": 1782282955, "time_str": "14:35:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260624/c677675908.shtml"}, {"id": "4583945", "title": "日本政府称将拟定日本作为资产管理国家的策略", "content": "日本政府称将拟定日本作为资产管理国家的策略。(财联社)", "ctime": 1782282880, "time_str": "14:34:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260624/c677675888.shtml"}, {"id": "4583919", "title": "日韩股市收盘涨跌互现", "content": "日经225指数收跌0.88%，报69174.97点。韩国综指收涨3.71%，报8507.81点。", "ctime": 1782282745, "time_str": "14:32:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260624/c urce": "", "url": "https://news.10jqka.com.cn/20260624/c677675612.shtml"}, {"id": "4583709", "title": "国家广播电视总局：使用人工智能技术生成、制作的微短剧应在每集明显位置添加提示标识", "content": "国家广播电视总局就《微短剧发展管理办法（征求意见稿）》公开征求意见。征求意见稿提出，使用人工智能技术生成、制作的微短剧，制作机构和播出单位应当遵守国家有关规定，并依据有关规定在每集明显位置添加提示标识。", "ctime": 1782281694, "time_str": "14:14:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260624/c677675533.shtml"}, {"id": "4583643", "title": "锂凰科技完成A+轮数千万元战略投资", "content": "近日，锂凰科技宣布，元禾厚望创新成长基金正式完成对其A+轮数千万元战略投资。据锂凰科技介绍，这是继纳尔股份（002825）A轮亿元级战略投资后，公司在短期内完成的又一轮融资。本轮资金将集中投入产线升级、研发深化与产能扩充，支撑公司千吨级量产交付提速。", "ctime": 1782281445, "time_str": "14:10:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260624/c677675476.shtml"}, {"id": "4583625", "title": "现货白银站上62美元/盎司", "content": "现货白银站上62美元/盎司，日内涨0.81%。", "ctime": 1782281272, "time_str": "14:07:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260624/c677675417.shtml"}, {"id": "4583621", "title": "国家广播电视总局：鼓励微短剧艺术表达、传播方式、新技术应用、商业模式等创新", "content": "国家广播电视总局发布关于《微短剧发展管理办法(征求意见稿)》公开征求意见的通知。其中指出，支持外向型微短剧创作生产和传播，为境外主创人员参与微短剧创作提供便利，支持优秀微短剧境内外同步播出。鼓励和支持微短剧行业开展平等互利的国际交流与合作，促进中外文明交流互鉴。鼓励微短剧艺术表达、传播方式、新技术应用、商业模式等创新。", "ctime": 1782281232, "time_str": "14:07:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260624/c677675403.shtml"}, {"id": "4583513", "title": "中国金融学会副会长方星海：相信中国资本市场对国际资本将变得极具吸引力", "content": "中国金融学会副会长方星海在2026夏季达沃斯论坛上表示，美国限制资本流入中国，反而在某种程度上刺激了中国的私募股权投资和风险投资。中国是一个高储蓄率国家，在这方面的潜力是非常巨大的。“归根结底，无论是证券投资、外商直接投资（FDI）还是其他资产类别，都取决于中国企业能否为这些资本所有者创造更多的回报。”方星海表示，只要创新的步伐不停，我相信中国资本市场对国际资本将变得极具吸引力，这才是决定资本流向的最终因素。（人民财讯）", "ctime": 1782280920, "time_str": "14:02:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260624/c677675330.shtml"}, {"id": "4583509", "title": "南向资金净买入超70亿港元", "content": "据同花顺iFinD数据，截至目前，南向资金净买入超70亿港元，其中港股通（沪）买入超46.05亿港元，港股通（深）买入超24.62亿港元。", "ctime": 1782280919, "time_str": "14:01:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260624/c677675329.shtml"}, {"id": "4583327", "title": "霍尔木兹海峡运输量回升 油轮租金直接翻倍", "content": "随着伊朗与美国签署关于重开霍尔木兹海峡的谅解备忘录后，航运数据显示，通过霍尔木兹海峡及海湾地区的船舶运量正逐步回升。而随着石油运输需求上升，油轮运费价格已经大幅飙升，油轮运营商本周的利润创下历史新高。根据船运经纪人和行业消息人士称，租用霍尔木兹海峡以外地区油轮的费用，已从一周前的每周10.65万美元飙升至每日19.05万美元，接近翻倍。同时，在海湾以外地区租用的船只价格也大幅上涨。(财联社)", "ctime": 1782280700, "time_str": "13:58:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260624/c677675294.shtml"}, {"id": "4583311", "title": "沪深京三市成交额超2.7万亿元，较上日此时缩量885亿元", "content": "据同花顺iFinD数据，沪深京三市成交额超2.7万亿元，较上日此时缩量885亿元，预计全天成交金额约3.3万亿元。截至目前，沪市成交额12384亿元，深市成交额14444亿元，北证50成交额180亿元。", "ctime": 1782280568, "time_str": "13:56:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260624/c677675266.shtml"}, {"id": "4583301", "title": "特朗普：因运出数百万桶石油 对委军事行动“回报率”已超28倍", "content": "据俄罗斯卫星社6月24日报道，美国总统特朗普表示，美国通过出售从委内瑞拉运出的数百万桶石油所获得的收入，已超过2026年1月在该国开展军事行动支出金额的28倍以上。特朗普在宾夕法尼亚州向支持者发表讲话时表示：“我们现在从委内瑞拉赚了很多钱，为了赢得那场战争，我们只用了48分钟。我们完全收回了战争成本，回报率达到28倍以上，甚至更多，至少是28倍。我们已经收回了所有军事支出，因为我们从那里运出了数百万桶石油。” (参考消息)", "ctime": 1782280442, "time_str": "13:54:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260624/c677675242.shtml"}, {"id": "4583299", "title": "兆易创新成交额达300亿元", "content": "兆易创新成交额达300亿元，现涨6.17%。", "ctime": 1782280386, "time_str": "13:53:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260624/c677675234.shtml"}, {"id": "4583297", "title": "英伟达压PCB降价10%？胜宏科技：公司经营一切正常，客户方案调整是正常现象", "content": "6月23日，算力链的PCB（印刷电路板）板块大跌，该板块概念龙头胜宏科技单日重挫逾7%。据上海证券报报道，PCB整体大跌与两个市场传闻有关，一个市场流传是英伟达要求PCB厂商降价10%，另外一则是胜宏科技扩产拖累英伟达Rubin平台出货等。6月24日，胜宏科技接线人士表示，市场传闻很多，公司没有办法就每个传闻都做出回应。但这位人士强调，公司经营一切正常，基本面没有变化。上述胜宏科技相关人士表示，客户对采用什么方案都不是一成不变，在生产过程中会有一些调整或者改进，这些都是正常现象。胜宏也有一些先发优势。投资者要甄别一下这些传闻，以公司公开披露信息为准。（澎湃）", "ctime": 1782280348, "time_str": "13:52:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260624/c677675231.shtml"}, {"id": "4583261", "title": "南向资金净买入超60亿港元", "content": "据同花顺iFinD数据，截至目前，南向资金净买入超60亿港元，其中港股通（沪）买入超37.09亿港元，港股通（深）买入超23.58亿港元。", "ctime": 1782279820, "time_str": "13:43:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260624/c677675087.shtml"}, {"id": "4583243", "title": "阿斯麦与荷兰应用科学研究组织TNO合作推进光子芯片量产", "content": "6月24日消息，阿斯麦（ASML）与荷兰应用科学研究组织（TNO）宣布达成合作，共同开发并推动光子芯片产业化。双方合作将围绕TNO位于荷兰埃因霍温高科技园区正在建设的光子芯片试验生产线展开。ASML将分阶段提供包括DUV和I-Line光刻设备在内的制造技术支持。项目投产后，该工厂将具备6英寸晶圆规模的磷化铟（InP）光子芯片量产能力。", "ctime": 1782279726, "time_str": "13:42:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260624/c677675066.shtml"}, {"id": "4583235", "title": "马云名下云锋基金入股峥研软件", "content": "天眼查App显示，近日，北京峥研软件有限责任公司发生工商变更，原股东李严峰、杭州金沙江初向量创业投资合伙企业（有限合伙）等退出，新增马云名下上海云锋新创投资管理有限公司为股东，李严峰卸任法定代表人、经理、董事长、财务负责人，陈睿接任法定代表人、经理、财务负责人，张伟接任董事长，同时，注册资本由约1204.8万人民币增至约1626.5万人民币。该公司成立于2022年8月，经营范围包括软件开发、人工智能应用软件开发、信息系统集成服务等，现由共青城智研投资合伙企业（有限合伙）、共青城效研投资合伙企业（有限合伙）及上述新增股东等共同持股。", "ctime": 1782279716, "time_str": "13:41:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260624/c677675062.shtml"}, {"id": "4583233", "title": "日本财务大臣片山皋月：与Alphabet高管进行了会面，讨论前沿人工智能", "content": "日本财务大臣片山皋月：与Alphabet高管进行了会面，讨论前沿人工智能。", "ctime": 178227 const SECTORS  = [{"name": "金融", "hit_count": 36, "etfs": []}, {"name": "数据要素", "hit_count": 34, "etfs": []}, {"name": "人工智能", "hit_count": 31, "etfs": []}, {"name": "半导体", "hit_count": 27, "etfs": []}, {"name": "医药", "hit_count": 11, "etfs": []}, {"name": "军工", "hit_count": 8, "etfs": []}, {"name": "消费", "hit_count": 7, "etfs": []}, {"name": "新能源", "hit_count": 4, "etfs": []}];
const META     = {"update_time": "2026-06-24 14:59:26", "sentiment_score": 54.5662100456621, "agents": []};

// 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'

  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';

  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
