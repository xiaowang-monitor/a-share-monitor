const NEWS     = [{"id": "4651175", "title": "中重科技：公司无人形机器人相关收入，商业航天板块业务不存在", "content": "中重科技公告，公司股票于2026年7月1日、2日、3日连续三个交易日收盘价格涨幅偏离值累计超过20%，且换手率持续增加，属于异常波动。经公司自查及向控股股东、实际控制人核实，公司目前生产经营正常，主营业务未发生变化，仍为冶金领域智能轧制装备及成套生产线。针对近期市场关注的人形机器人概念，公司目前无相关收入，也未有相关研发；子公司中重灵希主要业务为柔性自动化生产线，收入极低不超过100万元。针对商业航天概念，公司目前不存在相关板块业务，投资金额极低，对经营无重大影响。公司2025年度营收3.8亿元，同比下降60.23%；归母净利润亏损2202.74万元，同比下降139.09%。", "ctime": 1783071666, "time_str": "17:41:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260703/c677937597.shtml"}, {"id": "4651167", "title": "戈碧迦：秭归桐碧迦、吴林海拟分别减持1.57%和0.43%", "content": "戈碧迦公告，股东秭归桐碧迦企业管理咨询中心（有限合伙）拟自本公告披露之日起15个交易日后的3个月内，通过集中竞价、大宗交易减持227万股，占总股本1.57%；吴林海拟同期通过集中竞价减持61.86万股，占总股本0.43%，减持原因为股东自身资金需求。", "ctime": 1783071579, "time_str": "17:39:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260703/c677937495.shtml"}, {"id": "4651163", "title": "财政部副部长廖岷会见美国欧亚集团名誉董事长库普钱", "content": "2026年7月1日上午，财政部副部长廖岷在北京会见美国欧亚集团名誉董事长库普钱，就中美经贸关系、中美宏观经济形势等议题交换了意见。(财政部)", "ctime": 1783071554, "time_str": "17:39:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260703/c677937483.shtml"}, {"id": "4651161", "title": "中金岭南：预计上半年净利润同比增长87.89%-114.73%", "content": "中金岭南公告，预计2026年上半年净利润为10.5亿元–12亿元，同比增长87.89%-114.73%。报告期内，公司整体经营业绩同比实现较大幅度提升，主要原因系：1报告期公司主要产品金属价格同比上升；2报告期内公司持有交易性金融资产公允价值变动收益同比上升；3报告期内公司持有的子公司权益比例同比上升，归属于上市公司股东的净利润增加。", "ctime": 1783071517, "time_str": "17:38:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260703/c677937457.shtml"}, {"id": "4651159", "title": "国家金融监督管理总局决定对众邦银行实施接管", "content": "国家金融监督管理总局、湖北省人民政府关于对武汉众邦银行股份有限公司实施接管的公告。鉴于武汉众邦银行股份有限公司（以下简称众邦银行）出现严重信用风险，为保护存款人和其他客户的合法权益，依照《中华人民共和国银行业监督管理法》和《中华人民共和国商业银行法》有关规定，国家金融监督管理总局决定对众邦银行实施接管。", "ctime": 178 已完成工商变更", "content": "金橙子公告，公司此前披露拟以现金方式收购长春萨米特光电科技有限公司55.00%股权，交易价格为1.79亿元。截至公告披露日，萨米特已完成工商变更手续，并取得长春市市场监督管理局长春新区分局下发的《登记通知书》。变更后，金橙子持有萨米特55.00%股权，对应注册资本305.8万元。", "ctime": 1783070953, "time_str": "17:29:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260703/c677937090.shtml"}, {"id": "4651085", "title": "ST合纵：收到执行通知书，执行标的1.66亿元及利息", "content": "ST合纵公告，公司因未如期履行对浙江华友钴业股份有限公司的股权回购义务，被诉后经浙江省高级人民法院终审判决。近日公司收到浙江省嘉兴市中级人民法院《执行通知书》，要求立即履行判决义务，包括支付申请执行标的1.66亿元及利息、承担迟延履行期间的加倍债务利息，并支付执行费23.24万元。逾期不履行将强制执行。", "ctime": 1783070827, "time_str": "17:27:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260703/c677936997.shtml"}, {"id": "4651079", "title": "澜起科技：PCIe6.x/CXL3.xRetimer芯片目前正积极配合客户测试验证", "content": "澜起科技发布投资者关系活动记录表公告，目前，公司PCIeRetimer芯片的出货以Gen5产品为主。在国内市场中，依托优异的产品性能和本土服务支持的双重优势，澜起的PCIeRetimer芯片更受客户青睐。在产品升级迭代方面，公司于2025年1月推出PCIe6.x/CXL3.xRetimer芯片并向客户送样，目前正积极配合客户测试验证。由于支持PCIe6.0的服务器CPU尚未规模量产，相关Retimer芯片仍处于产业导入期，行业预期2027年PCIe6.0Retimer芯片将进入正式的规模应用阶段。此外，我们于今年1月发布了PCIe6.x/CXL3.x的AEC解决方案。", "ctime": 1783070745, "time_str": "17:25:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260703/c677936957.shtml"}, {"id": "4651059", "title": "动力源：筹划控制权变更，股票停牌预计不超过2个交易日", "content": "动力源公告，公司控股股东及实际控制人何振亚先生正在筹划可能导致公司控制权发生变更的股份转让事宜。鉴于该事项尚存在重大不确定性，为维护投资者利益，经向上海证券交易所申请，公司股票将于2026年7月6日开市起停牌，预计停牌时间不超过2个交易日。停牌期间，公司将根据事项进展履行信息披露义务。", "ctime": 1783070467, "time_str": "17:21:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260703/c677936796.shtml"}, {"id": "4651047", "title": "汇丰：布局中国人工智能全产业链 把握产业投资潜在机会", "content": "汇丰私人银行及财富管理中国首席投资总监发布观点称，今年下半年中国股票市场大概率维持“震荡上行、结构分化”的格局。配置上，维持杠铃策略，抓住成长和创新端，即AI、高端制造、半导体设备材料、算力链和部分涨价资源品等；同时上调高股息、低估值、现金流稳健资产的底仓比例，以应对海外利率扰动和市场波动放大的影响。短期内，A股在盈利上修、流动性和“AI硬科技”板块的权重较港股更具优势。但中长期来看，我们认为保持对中国整个AI生态系统的投资至关重要。", "ctime": 1783070392, "time_str": "17:19:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260703/c677936743.shtml"}, {"id": "4651035", "title": "国家海洋预报台继续发布海浪风暴潮预警", "content": "记者从自然资源部获悉，今年第10号台风“美莎克”（热带风暴级）的中心今天16时位于距离海南省陵水黎族自治县偏南方向约45公里的近海海面，这是今年首个即将登陆我国沿海的台风，国家海洋预报台今天下午继续发布海浪黄色警报和风暴潮蓝色警报。（央视新闻）", "ctime": 1783070304, "time_str": "17:18:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260703/c677936681.shtml"}, {"id": "4651007", "title": "海鸥股份：控股股东金敖大拟减持不超过3%", "content": "海鸥股份公告，控股股东及实际控制人金敖大持有公司股份5393.76万股，占公司总股本的12.4871%。金敖大拟自本公告披露之日起15个交易日后的90日内，通过集中竞价交易方式、大宗交易方式合计减持不超过1295.83万股，不超过公司总股本的3%。", "ctime": 1783070016, "time_str": "17:13:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260703/c677936493.shtml"}, {"id": "4651005", "title": "长源电力：6月发电量24.55亿千瓦时，同比降低2.12%", "content": "长源电力公告，2026年6月公司完成发电量24.55亿千瓦时，同比降低2.12%。其中，火电发电量19.6亿千瓦时，同比降低5.63%；水电发电量2.72亿千瓦时，同比增长54.04%；新能源发电量2.23亿千瓦时，同比降低12.44%。2026年1-6月累计完成发电量169.28亿千瓦时，同比增长1.28%。火电发电量148.55亿千瓦时，同比增长1.12%；水电发电量9.41亿千瓦时，同比增长67.28%；新能源发电量11.32亿千瓦时，同比降低22.50%。", "ctime": 1783070010, "time_str": "17:13:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260703/c677936492.shtml"}, {"id": "4651003", "title": "华银电力：预计2026年上半年净利润同比下降73.37%到78.21%", "content": "华银电力公告，预计2026年1月1日至2026年6月30日归属于上市公司股东的净利润为4500万元到5500万元，同比下降73.37%到78.21%。扣除非经常性损益后的净利润为4000万元到5000万元，同比下降75.59%到80.47%。2026年上半年湖南省处于丰水期且今年来水颇丰，省内水力发电同比增长约45%，阶段性压缩了公司火力发电和新能源发电的空间，也影响了电力现货交易市场价格走低，使得公司利润同比减少；自2026年6月1日起，湖南省火电容量电价提升至330元/千瓦，但前五个月依然实施165元/千瓦的容量电价，对公司火电收入的正向支撑未完全体现。", "ctime": 1783070003, "time_str": "17:13:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260703/c677936488.shtml"}, {"id": "4651001", "title": "国务院：推进重点用能行业绿色化清洁化发展，逐步明确可再生能源消费最低比重目标", "content": "国务院印发《美丽中国建设“十五五”规划》，其中提到，推进重点用能行业绿色化清洁化发展，逐步明确可再生能源消费最低比重目标，建设一批绿色工厂。推进西部地区可再生能源就近利用，有序推动符合要求的高载能产业向可再生能源资源富集区域转移。修订产业结构调整指导目录，将低效、高耗能、高排放工艺和装备纳入淘汰类目录。推进机场运行电动化和港口岸电应用尽用，发展可持续航空燃料。提高大宗货物铁路、水路运输比重和新能源汽车运输比重，推进新能源运输工具规模化应用，加快配套补能设施建设，构建“外集内配”货物运输模式，鼓励开展货运零排放试点，推进零碳运输走廊建设，重点行业清洁运输比例达到75%、大气污染防治重点区域重点行业清洁运输比例达到85%。加强既有建筑和市政设施节能降碳改造，发展城乡绿色建筑。制定重点行业和生态环境基础设施减污降碳协同治理技术指南，构建协同度指数，深化城市和产业园区减污降碳协同创新试点。", "ctime": 1783069978, "time_str": "17:12:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260703/c677936472.shtml"}, {"id": "4650991", "title": "厦门钨业：钨粉末产品可用于制造六氟化钨", "content": "厦门钨业在互动平台表示，公司钨粉产量位居国内前列，是最主要的钨粉供应商之一。公司钨粉末产品可用于制造六氟化钨。", "ctime": 1783069867, "time_str": "17:11:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260703/c677936388.shtml"}, {"id": "4650985", "title": "美诺华：签署产业基地项目投资协议，总投资不低于10亿元", "content": "美诺华公告，公司于2026年7月2日与宁波宁南新城开发建设管理中心签署《高端口服固体制剂和复杂注射剂全球化产业基地项目产业用地建设投资协议》，该协议经公司股东会审议通过相关投资事项后生效。项目总投资不低于10亿元，涉及宁南新城12号地块，宗地总面积10.18万平方米。本次对外投资尚需经公司股东会审议通过，并需完成项目备案、环境影响评价、节能审查等法定审批程序，土地使用权需通过招拍挂程序取得，存在不确定性。", "ctime": 1783069846, "time_str": "17:10:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260703/c677936379.shtml"}, {"id": "4650979", "title": "星辉娱乐：累计回购公司股份670.55万股", "content": "星辉娱乐公告，截至2026年6月30日，公司通过股份回购专用证券账户以集中竞价交易方式累计回购公司股份670.55万股，占公司目前总股本的0.54%，最高成交价为4.37元/股，最低成交价为4.07元/股，成交总金额为2831.72万元（不含交易费用）。", "ctime": 1783069767, "time_str": "17:09:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260703/c677936295.shtml"}, {"id": "4650975", "title": "三超新材：股东协议受让方变更为无锡博达新能科技有限公司", "content": "三超新材发布更正公告，原公告中关于股东协议转让部分公司股份的受让方存在错误。更正后，2026年6月18日，公司股东邹余耀与无锡博达新能科技有限公司签署了《关于南京三超新材料股份有限公司之第二期股份转让协议》，邹余耀拟向博达新能转让其所持公司873.54万股股份，占公司总股本比例为7.65%，转让价格为每股人民币24.52元，转让价款总额为2.14亿元。", "ctime": 1783069763, "time_str": "17:09:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260703/c677936287.shtml"}, {"id": "4650967", "title": "国务院：全面提升可再生能源电力消费比重，加快推进新增用电量由新增清洁能源电量覆盖", "content": "国务院印发《美丽中国建设“十五五”规划》，其中提到，积极稳妥推进和实现碳达峰。实施积极应对气候变化国家战略，落实国家自主贡献目标，扎实推进碳达峰行动，全面实施碳排放总量和强度双控制度。坚持风光水核等多能并举，深入开展节能降碳改造和控煤减煤，合理控制煤电装机规模和发电量，全面提升可再生能源电力消费比重，加快推进新增用电量由新增清洁能源电量覆盖。实施应对气候变化一揽子重大工程，推动碳捕集利用与封存技术发展和示范项目建设。", "ctime": 1783069735, "time_str": "17:08:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260703/c677936188.shtml"}, {"id": "4650963", "title": "华原股份：股东华盛企业已减持0.9953%", "content": "华原股份公告，持股5%以上股东华盛企业发展（深圳）有限公司减持计划实施完毕，2026.5.19-2026.7.2通过集中竞价减持151万股，占总股本比例0.9953%，减持价格区间9.4-12.93元/股，已减持总金额1635.59万元；当前持股3089万股，当前持股比例20.3608%。", "ctime": 1783069668, "time_str": "17:07:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260703/c677936084.shtml"}, {"id": "4650957", "title": "科蓝软件：科蓝转债已有10个交易日收盘价低于转股价85%", "content": "科蓝软件公告，公司此前发行的可转换公司债券“科蓝转债”当前转股价格为8.8元/股。截至2026年7月3日，公司股票已有10个交易日的收盘价格低于当期转股价格的85%（即7.48元/股），预计后续将触发转股价格向下修正条件。若触发条件，公司将按相关规定及时履行审议程序和信息披露义务。", "ctime": 1783069608, "time_str": "17:06:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260703/c677936034.shtml"}, {"id": "4650949", "title": "三部门负责人：恢复征收车船税，有利于促进税收公平，增强税收对收入分配的调节作用", "content": "财政部 、税务总局 、工业和信息化部有关司负责人就调整节能汽车、新能源汽车车船税优惠政策答记者问。近年来，我国汽车产业特别是新能源汽车产业加快发展。2025年，我国新能源汽车销量达1649万辆，新能源汽车国内新车销量占比突破50%。纯电动商用车、插电式（含增程式）混合动力汽车、燃料电池商用车、节能汽车与其他燃油汽车一样，都属于大额财产。根据有关数据，2025年插电式（含增程式）混合动力乘用车平均销售价格为21.8万元，部分车型销售价格达到百万元以上。对上述类型车辆恢复征收车船税，有利于促进税收公平，增强税收对收入分配的调节作用。（财政部）", "ctime": 1783069549, "time_str": "17:05:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260703/c677936005.shtml"}, {"id": "4650945", "title": "ST星农：股票交易异常波动，公司控制权拟发生变更", "content": "ST星农公告，公司股票于2026年7月1日、7月2日、7月3日连续三个交易日内收盘价格涨幅偏离值累计超过12%，属于股票交易异常波动。经公司自查及向控股股东核实，除公司已于2026年7月1日披露的控制权拟发生变更事项（股东钱菊花、新家园、南浔众兴、李伟红拟向玖元亨通协议转让合计5887.88万股，占总股本22.2004%，完成后控股股东将变更为玖元亨通，实际控制人变更为叶进）外，公司及控股股东不存在应披露而未披露的重大信息。公司目前生产经营正常，2025年度归属于上市公司股东的净利润为-9898.66万元，处于亏损状态。上述控制权变更事项尚需取得上交所合规性确认及办理股份过户登记，存在不确定性。", "ctime": 1783069524, "time_str": "17:05:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260703/c677935976.shtml"}, {"id": "4650937", "title": "国轩高科：全资子公司2026年上半年出售铜冠铜箔A股股票成交金额8.29亿元 占比年度经审计净利润10%以上", "content": "国轩高科公告，公司全资子公司合肥国轩于2026年上半年通过集中竞价交易方式，出售所持铜冠铜箔股票共计839.95万股，成交金额8.29亿元(含交易费用)。本次交易产生的利润占公司最近一个会计年度经审计净利润的10%以上，但未达50%以上。截至公告日，公司尚持有铜冠铜箔股票1053.16万股，占总股本1.27%。", "ctime": 1783069498, "time_str": "17:04:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260703/c677935963.shtml"}, {"id": "4650933", "title": "国务院印发《美丽中国建设“十五五”规划》", "content": "据新华社，日前，国务院印发《美丽中国建设“十五五”规划》，明确了“十五五”时期全面推进美丽中国建设的总体要求、目标指标、重点任务和重大工程。规划部署了深入打好蓝天碧水净土保卫战、全面实施固体废物和新污染物治理行动、统筹推进生态系统优化、积极应对气候变化、加快形成绿色生产生活方式、守牢美丽中国建设安全底线、健全美丽中国建设保障体系等7方面重点任务。规划提出了大气污染防治提升、水生态环境治理与保护修复、海洋生态环境保护修复、土壤污染源头防控和治理、工业固体废物环境风险隐患排查整治和综合利用、新污染物协同治理等重大工程。", "ctime": 1783069431, "time_str": "17:03:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260703/c677935928.shtml"}, {"id": "4650919", "title": "三部门：取消对纯电动商用车、插电式（含增程式）混合动力汽车、燃料电池商用车免征车船税政策", "content": "财政部等三部门公告，自2027年1月1日起，取消对节能汽车减半征收车船税政策，取消对纯电动商用车、插电式（含增程式）混合动力汽车、燃料电池商用车免征车船税政策；纳税人新取得及本公告实施前已取得的上述类型车辆，应按照《中华人民共和国车船税法》及其实施条例和其他相关规定征收车船税。", "ctime": 1783069339, "time_str": "17:02:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260703/c677935818.shtml"}, {"id": "4650903", "title": "央行：开展10000亿元买断式逆回购操作", "content": "央行公告，为保持银行体系流动性充裕，2026年7月6日，中国人民银行将以固定数量、利率招标、多重价位中标方式开展10000亿元买断式逆回购操作，期限为3个月（91天），到期日为2026年10月5日（遇节假日顺延）。", "ctime": 1783069272, "time_str": "17:01:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260703/c677935795.shtml"}, {"id": "4650857", "title": "盈峰环境成立进出口公司", "content": "企查查APP显示，近日，湖南联行寰宇进出口有限公司成立，法定代表人为林朋，经营范围包含：环境保护专用设备销售；汽车销售；新能源汽车整车销售；工业自动控制系统装置销售等。企查查股权穿透显示，该公司由盈峰环境间接全资持股。（人民财讯）", "ctime": 1783069158, "time_str": "16:59:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260703/c677935662.shtml"}, {"id": "4650855", "title": "华润双鹤：子公司黄体酮软胶囊获药品注册证书", "content": "华润双鹤公告，全资子公司山西晋新双鹤药业有限责任公司近日收到国家药品监督管理局颁发的黄体酮软胶囊《药品注册证书》。该药品为化学药品4类，规格为0.1g、0.2g，批准文号为国药准字H20264792、国药准字H20264791。黄体酮软胶囊用于治疗由黄体酮缺乏引起的机能障碍，晋新双鹤于2022年6月启动仿制药研发，2024年8月16日提交上市许可申请，近日获批上市。公司针对该药品累计研发投入为1726.75万元人民币。", "ctime": 1783069145, "time_str": "16:59:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260703/c677935657.shtml"}, {"id": "4650853", "title": "有研粉材：控股股东及一致行动人拟询价转让4.99%股份", "content": "有研粉材公告，公司控股股东中国有研科技集团有限公司及其一致行动人有研鼎盛投资发展有限公司拟通过询价转让方式转让股份，本次拟转让股份总数为517.33万股，占有研粉材总股本比例为4.99%，转让原因为自身资金需求。其中中国有研拟转让459万股（占4.43%），有研鼎盛拟转让58.33万股（占0.56%）。本次询价转让不通过集中竞价或大宗交易方式，受让方在受让后6个月内不得转让。", "ctime": 1783069125, "time_str": "16:58:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260703/c677935650.shtml"}, {"id": "4650851 // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
