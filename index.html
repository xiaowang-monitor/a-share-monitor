ck_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261007/c680446908.shtml"}, {"id": "5328919", "title": "港股午评：恒指跌0.53%  大型科网股、半导体股走弱", "content": "港股午间收盘，恒生指数跌0.53%，恒生科技指数跌0.91%。大型科网股走弱，阿里巴巴跌超3%，百度集团跌逾2%，美团、小米集团跌超1%。半导体股集体下跌，澜起科技跌逾6%，爱芯元智跌近6%，兆易创新跌超3%，江波龙跌超2%。", "ctime": 1791345763, "time_str": "12:02:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261007/c680446740.shtml"}, {"id": "5328877", "title": "AMD首席执行官苏姿丰将与三星半导体负责人会面 应对内存短缺", "content": "AMD首席执行官苏姿丰计划于周三与三星电子半导体业务负责人、副会长全永铉会面。这是AI产业两位关键人物的最新面对面交流。知情人士透露，苏姿丰此次访问韩国期间将举行会谈，但未披露具体细节。三星与AMD均拒绝置评。此次会面正值全球电子产业面临广泛内存产品短缺之际，该问题正制约AI基础设施与服务扩张。内存价格持续飙升，已成为数据中心运营商的主要成本之一。今年3月，AMD与三星已就下一代高带宽内存（HBM）及先进存储芯片达成供应协议。", "ctime": 1791344487, "time_str": "11:41:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261007/c680446642.shtml"}, {"id": "5328827", "title": "港股半导体股集体下跌 澜起科技跌近8%", "content": "港股半导体股集体下跌，澜起科技跌近8%，爱芯元智跌超5%，纳芯微、晶合集成、兆易创新跌超4%，华虹宏力、江波龙、上海复旦跌超2%。", "ctime": 1791342347, "time_str": "11:05:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261007/c680446552.shtml"}, {"id": "5328807", "title": "存储周期延续！DRAM大厂计划涨价，涨幅最高达20%", "content": "据台湾经济日报7日报道，中国台湾存储厂商南亚科近期陆续通知客户，将再度上调DRAM合约价格，最高涨幅可达20%。南亚科方面表示，针对客户报价相关事宜，不予置评。业内人士认为，随着南亚科启动新一轮合约价上调，涨价效应将逐步传导落地，有望抬升公司平均售价（ASP），改善盈利水平，推动整体经营持续向好。（每经）", "ctime": 1791341547, "time_str": "10:52:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261007/c680446515.shtml"}, {"id": "5328713", "title": "中国9月外汇储备 34002.51亿美元，前值34383.3亿美元", "content": "中国9月外汇储备 34002.51亿美元，前值34383.3亿美元。", "ctime": 1791339228, "time_str": "10:13:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261007/c680446385.shtml"}, {"id": "5328711", "title": "中国央行连续第23个月增持黄金", "content": "中国9月末黄金储备报7747万盎司（约2409.59吨），环比增加74万盎司（约23.02吨），8月末黄金储备报7673万盎司（约2386.57吨）。中国央行已连续第23个月增持黄金。", "ctime": 1791339161, "time_str": "10:12:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261007/c680446380.shtml"}, {"id": "5328635", "title": "恒生科技指数盘中下跌1%", "content": "恒生科技指数盘中下跌1%。阿里巴巴、百度集团跌逾2%，腾讯控股、小米集团跌超1%。", "ctime": 1791338147, "time_str": "09:55:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261007/c680446289.shtml"}, {"id": "5328623", "title": "大秦铁路开启20天秋季集中修 每天9至12时全线停运", "content": "10月7日，我国重要能源通道大秦铁路开启为期20天的秋季集中修施工，为即将到来的冬季电煤保供运输夯实线路基础。集中修期间，大秦铁路每天9时至12时全线列车停运，对线路钢轨、轨枕、道床及供电接触网、信号设备等进行立体式检修和更新升级。施工计划完成成段更换钢轨、成段更换轨枕、大机清筛道床等施工任务，共计投入157个施工队伍近1.6万人。", "ctime": 1791337652, "time_str": "09:47:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261007/c680446267.shtml"}, {"id": "5328605", "title": "三星电机计划斥资近50亿美元在韩国和越南扩产半导体基板", "content": "三星电机计划到2028年在韩国和越南投资近50亿美元，用于半导体基板生产，进一步提升越南在人工智能服务器和高性能计算关键零部件生产中的地位。作为韩国三星集团旗下的电子元件子公司，三星电机上周公布了两项FC-BGA（倒装芯片球栅阵列）基板投资计划。该产品用于AI服务器、机器人和智能汽车芯片。其中一项投资规模为4.27万亿韩元（32亿美元），用于韩国世宗工厂，是公司迄今针对单一产品进行的最大规模投资；另一项投资规模为2.51万亿韩元（18.7亿美元），用于越南子公司。该公司曾于2022年宣布将在越南北部太原省测试FC-BGA基板。如今该设施的扩建表明试生产结果符合预期，公司已准备好进入大规模量产阶段。", "ctime": 1791336961, "time_str": "09:36:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261007/c680446225.shtml"}, {"id": "5328581", "title": "港股开盘：恒生指数下跌0.45% 恒生科技指数跌0.33%", "content": "香港恒生指数开盘下跌0.45%，恒生科技指数跌0.33%。大型科网股走弱，阿里巴巴跌1.39%，美团、京东集团跌近1%。生物医药股回调，金斯瑞生物科技跌超10%，再鼎医药、药明生物跌逾3%。机械、钢铁、电气设备板块涨幅居前。", "ctime": 1791336502, "time_str": "09:28:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261007/c680446194.shtml"}, {"id": "5328495", "title": "10月解禁规模超2900亿元 11股解禁比例超50%", "content": "据统计，10月将有91只股解禁，按照最新收盘价计算，合计解禁市值2950.1亿元。从解禁比例来看，面临解禁的个股中有11股的解禁比例超50%。泰凯英的解禁比例最高，达73.64%；天元智能的解禁比例次之，达73.46%；长江能科、中船特气、西安奕材-U的解禁比例居前。 (证券时报)", "ctime": 1791334091, "time_str": "08:48:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261007/c680446085.shtml"}, {"id": "5328427", "title": "北部湾港成功开辟重庆铝土矿进口直达通道", "content": "据北部湾港股份7日消息，10月1日，载有16.8万吨几内亚进口铝土矿的船舶顺利靠泊防城港，并高效完成靠泊接卸、堆存、铁路疏运全链条作业，首批货物于10月3日通过铁路发运至重庆万州，有力保障博赛矿业万州生产基地原料稳定供应。此次落地的几内亚铝土矿物流新链路，创新构建“海外矿山—北部湾港入境—铁路直达重庆”铁海联运新模式。相较传统长江江海联运路径，整体运输时长缩短约25天。", "ctime": 1791331968, "time_str": "08:12:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261007/c680445985.shtml"}, {"id": "5328411", "title": "日韩股市开盘下跌", "content": "10月7日，韩国KOSPI指数开盘下跌1.11%，报6864.25点；日经225指数低开0.14%，报70582.11点。", "ctime": 1791331472, "time_str": "08:04:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261007/c680445946.shtml"}, {"id": "5328361", "title": "国庆假期第六天全国道路交通总体平稳", "content": "10月6日，全国多地陆续迎来集中返程车流，主要高速公路、国省道干线车流量高位运行。截至昨天下午6时，全国道路交通安全形势总体平稳有序。今天（7日），海南、四川、云南等地部分地区的降雨天气，将会导致路面湿滑，能见度下降，返程交通保畅压力攀升。公安部交通管理局提示广大驾驶人，注意行车安全。（央视新闻）", "ctime": 1791329732, "time_str": "07:35:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261007/c680445864.shtml"}, {"id": "5328333", "title": "SpaceX计划融资400亿美元采购英伟达芯片", "content": "SpaceX计划通过阿波罗主导的融资筹集400亿美元，以采购英伟达芯片。（财联社）", "ctime": 1791329273, "time_str": "07:27:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261007/c680445843.shtml"}, {"id": "5325455", "title": "北约拟以无人机和AI应对“可能的俄罗斯袭击”", "content": "彭博社5日披露了北约的一份非机密文件，文件显示北约最高军事指挥官正在制定一项名为“胜利理论”的战略，旨在利用人工智能等新兴技术迅速击退“俄罗斯可能对北约东翼发起的进攻”。报道称，北约的这项战略计划由北约欧洲盟军最高司令兼美军欧洲司令部司令格林克维奇于10月12日在波兰公布。知情人士透露，文件旨在阐明北约将如何应对可能遭遇的领土入侵，重点是把无人机和人工智能等新技术与传统军力结合起来；同时向北约成员国展示增加国防开支背后的具体军事需求。根据这份战略构想，如果遭到袭击，北约将首先动用东翼部署的陆军、低成本无人机和最低限度的载人操作系统，以及人工智能辅助目标锁定等技术，阻止对方推进。取得行动自由后，北约将寻求进一步打击对方的指挥与控制系统，目标是迅速并压倒性地击败进攻部队。（央视新闻）", "ctime": 1791298170, "time_str": "22:49:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261006/c680445125.shtml"}, {"id": "5325421", "title": "海地延长总统选举报名期限并推迟竞选期", "content": "海地临时选举委员会5日签署公告，宣布将总统选举和立法机构选举候选人报名期限延长至10月31日。原定于10月5日开始的首轮竞选期推迟，新的起止日期另行公布。（财联社）", "ctime": 1791297953, "time_str": "22:45:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261006/c680445122.shtml"}, {"id": "5325365", "title": "外地客户涌入深圳买房 有深圳房产中介销售额暴增200%", "content": "记者走访发现，国庆假期期间，深圳的二手房市场活跃度明显提升。周先生是湖南人，趁着国庆假期带着家人来深圳旅游，顺便看看房子。随着深圳非核心区域放开限购，越来越多像周先生这样的非深户开始将置业目光投向深圳。记者了解到，非深户在深圳非核心区域购房，无需社保或个税即可购买2套。（央视财经）", "ctime": 1791297586, "time_str": "22:39:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261006/c680445116.shtml"}, {"id": "5325337", "title": "冯德莱恩：欧盟将采取措施应对能源成本高企", "content": "欧盟委员会主席冯德莱恩6日表示，欧盟将采取启动欧洲炼油厂战略对话、加强能源联合采购等措施，以应对能源价格上涨，并进一步降低对进口化石燃料的依赖。冯德莱恩当天在欧洲议会全会上表示，自2月底以来，欧洲天然气价格上涨140%，柴油价格翻倍，进口化石燃料支出额外增加约1000亿欧元。随着冬季临近，高能源成本给企业和居民带来的压力可能进一步加剧。在供应端，欧盟将启动欧洲炼油厂战略对话，以降低成本并确保能源供应，包括满足国防领域的供应需求。在需求端，欧盟将成立新的工作组，汇集成员国能源需求，并进一步升级联合采购机制。（财联社）", "ctime": 1791297264, "time_str": "22:34:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261006/c680445109.shtml"}, {"id": "5325333", "title": "韩国考虑废除“金牌免兵役”制度", "content": "韩国部分亚运会金牌得主发表“免兵役比金牌重要”的不当言论后， time_str": "21:56:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261006/c680445054.shtml"}, {"id": "5324947", "title": "迈威尔科技涨超10%", "content": "迈威尔科技盘初拉升，现涨超10%，公司今日举行2026年投资者日，CEO表示公司预计28财年总收入约为200亿美元；到2030年，公司总潜在市场规模预计约为4000亿美元。（财联社）", "ctime": 1791294456, "time_str": "21:47:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261006/c680445042.shtml"}, {"id": "5324919", "title": "资深投资人Jim Paulsen称三重压力下美股或跌15% 科技股恐下挫20%", "content": "美股面对的“忧虑之墙”越高，爬升得似乎就越快，周一收盘距离历史高点仅一步之遥。不过，在备受关注的资深投资人士Jim Paulsen看来，油价位于每桶100美元、美债收益率达到5%以及美元走强所累积的压力，尚未真正对市场造成显著冲击。Paulsen表示，过去当这三项因素同时对标普500指数构成压力时，随后三至五个月内指数最多曾下跌15%。如果这一情形重演，标普500指数今年将自2022年以来首次录得年度下跌。他发现，标普500指数与一个“经济和政策压力”一篮子指标存在较强相关性。该指标中，10年期美国国债收益率权重为50%，美元和原油价格各占25%。过去当这一政策压力指标升至当前高位时，标普500随后曾下跌20%至25%。不过，Paulsen表示，标普500的11个板块中有7个已经长期横盘，因此这些板块可能不会出现如此剧烈的下跌。但他仍预计科技板块可能下跌20%。（财联社）", "ctime": 1791294247, "time_str": "21:44:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261006/c680445040.shtml"}, {"id": "5324897", "title": "迈威尔科技股价抹去盘前跌幅，上涨4%", "content": "迈威尔科技股价抹去盘前跌幅，上涨4%。（财联社）", "ctime": 1791293889, "time_str": "21:38:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261006/c680445029.shtml"}, {"id": "5324791", "title": "美股开盘：美股三大指数集体高开", "content": "美股三大指数集体高开，标普500指数涨0.46%，道指涨0.38%，纳指涨0.57%。大型科技股方面，超威半导体涨2.50%，英伟达涨1.37%，微软涨1.01%，SpaceX涨1.01%。", "ctime": 1791293459, "time_str": "21:30:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261006/c680445013.shtml"}, {"id": "5324731", "title": "力量发展金红石项目正式投产，康宁医院三季度门诊均次开支增约一成", "content": "力量发展金红石项目已于2026年10月1日正式投入生产。公告称，项目达产后有望成为新的收入增长来源。完全投产后，合计年处理原矿达致约1100万吨，年产能约33–3 // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
