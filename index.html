7/c678247159.shtml"}, {"id": "4746933", "title": "法国外长反对美国干涉欧洲事务", "content": "法国外长巴罗16日在社交媒体发文，反对美国国务院发布的以干涉欧洲事务为目的的招标项目。 巴罗发文说：“让我们明确这一点：法国和欧洲绝不容忍任何外国干涉其选举进程的企图，无论这种企图来自何方。” 巴罗在文后附上了美国国务院民主、人权和劳工局日前发布的一个名为“在欧洲发展文明纽带、民主韧性和法治”的招标项目书。该项目书说，其目的是征求提案，通过开展研究、举办会议或文化活动等方式，“在欧洲加强和发展民主韧性、法治、言论和新闻自由、人权保障等”。 巴罗此前在社交媒体还批评了美国企业家马斯克的言论。法国定于明年举行总统选举。马斯克日前在社交媒体就法国选情发表评论称，将参选的极右翼领导人勒庞是“法国最后的希望”。该言论引发法国舆论批评。(新华社)", "ctime": 1784262143, "time_str": "12:22:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260717/c678247131.shtml"}, {"id": "4746923", "title": "日经225指数跌幅扩大至5%", "content": "日经225指数跌幅扩大至5%，现报63481.92点。", "ctime": 1784261824, "time_str": "12:17:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260717/c678247012.shtml"}, {"id": "4746921", "title": "7月17日午间公告一览：欧林生物：网传重组金葡菌疫苗Ⅲ期临床试验数据不实", "content": "欧林生物公告，近日关注到个别网络平台出现关于公司重组金黄色葡萄球菌疫苗Ⅲ期临床试验数据的不实言论。公司披露的73.25%的保护效力数据等Ⅲ期临床试验结果由独立第三方统计团队统计得出，公司如实依据该独立第三方出具的报告进行了信息披露。经核实，网传的《重组金葡菌疫苗（rFSAV）Ⅲ期临床数据审计报告》采用的数据如确诊病例人数、受试者总数等关键数据及其结论均与公司临床试验实际情况不符。", "ctime": 1784261817, "time_str": "12:16:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260717/c678247010.shtml"}, {"id": "4746901", "title": "多只宽基ETF显著放量，逼近昨日全天水平", "content": "多只宽基ETF盘中显著放量 创业板ETF易方达(159915)成交超78亿，超昨日全天成交额，科创50ETF华夏(588000)、沪深300ETF华泰柏瑞(510300)、中证1000ETF南方(512100)、A500ETF华泰柏瑞(563360)、A500ETF南方(159352)成交额均超30亿，逼近昨日全天水平。（打开同花顺App，搜索“ETF资金”，进入功能页查看实时申购净流入）", "ctime": 1784261507, "time_str": "12:11:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260717/c678246968.shtml"}, {"id": "4746893", "title": "秘鲁西北部一辆汽车坠入山谷致14人死亡", "content": "据秘鲁媒体16日报道，该国西北部卡哈马卡省一辆小型客车当天失控坠入山谷，造成至少14人死亡、5人受伤。报道说，事发车辆当天下午行驶到卡哈马卡省圣胡安地区时失控冲出道路坠入山谷。事故发生后，秘鲁国家警察、医护人员和消防人员等赶赴 }, {"id": "4746827", "title": "新易盛：1.6T光模块目前订单情况良好 公司根据客户需求情况持续进行扩产", "content": "新易盛7月17日在互动平台表示，1.6T光模块目前订单情况良好，公司根据客户需求情况持续进行扩产，当前公司供应链体系整体稳定。（人民财讯）", "ctime": 1784260532, "time_str": "11:55:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260717/c678246770.shtml"}, {"id": "4746823", "title": "香港交易所支持以人民币缴付印花税及交易相关费用", "content": "香港交易所今天欢迎香港特别行政区政府于宪报刊登《2026年印花税（修订）（第2号）条例》，该条例订明双柜台证券人民币柜台交易的印花税以人民币计算和缴付的安排。为了向交易所参与者提供更简便一致的缴款机制，香港交易所亦将作出相应安排，支持交易所参与者以人民币缴付证监会交易征费、会财局交易征费、投资者赔偿征费（现暂停征收）及付予联交所的交易费（统称交易相关费用）。香港交易所首席营运总监刘碧茵表示：我们欢迎香港特区政府通过有关法例，这是支持人民币作为证券市场交易货币的重要一步。透过统一人民币柜台交易的印花税及交易相关费用的缴付货币，我们希望能够便利全球投资者使用人民币参与市场，并为日后将人民币柜台纳入港股通铺路。我们将继续与监管机构及市场参与者紧密合作，加强香港市场基础设施及拓展香港的人民币产品生态圈，推动人民币持续国际化的进程。（香港交易所）", "ctime": 1784260519, "time_str": "11:55:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260717/c678246764.shtml"}, {"id": "4746797", "title": "湖北：上半年GDP31336.72亿元，同比增长5.0%，增速高于全国0.3个百分点", "content": "7月17日，湖北省统计局、国家统计局湖北调查总队发布2026年上半年湖北经济运行情况。根据地区生产总值统一核算结果，2026年上半年湖北实现生产总值31336.72亿元，按不变价格计算，同比增长5.0%，增速高于全国0.3个百分点。分行业看，第一产业增加值1915.12亿元，增长2.7%；第二产业增加值12316.51亿元，增长6.2%；第三产业增加值17105.09亿元，增长4.5%。（湖北日报）", "ctime": 1784259913, "time_str": "11:45:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260717/c678246660.shtml"}, {"id": "4746773", "title": "刚果（金）埃博拉确诊病例超2100例", "content": "刚果（金）卫生部16日发布的最新疫情报告显示，该国本轮埃博拉疫情累计报告确诊病例已增至2124例。世界卫生组织总干事谭德塞16日在记者会上说，本轮埃博拉疫情已成为有记录以来第三大埃博拉疫情。在过去一个月内，疫情扩散速度超过此前所有埃博拉疫情。他说，目前疫情防控仍面临严峻挑战。超过80%的新增病例并非来自已知密切接触者名单，说明仍有大量传播链未被发现；许多死亡患者未曾到医疗机构接受治疗。此外，持续武装冲突也在阻碍疫情应对工作。在医疗研发方面，谭德塞说，英国牛津大学参与研发的候选疫苗安全性试验已于本周启动，刚果（金）国家生物医学研究所牵头的研究团队也启动了抗病毒药物奥贝德西韦的临床试验，用以验证其对高风险接触者暴露后的预防作用。（新华社）", "ctime": 1784259421, "time_str": "11:37:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260717/c678246485.shtml"}, {"id": "4746771", "title": "京东健康与鲁南制药集团签署战略合作协议 共促产业数字化", "content": "7月16日，京东健康与鲁南制药集团正式签署战略合作协议。此次签约是双方自2019年首次战略合作后的全面升级，双方将聚焦数字化平台、全域营销、医药供应链共建、新品研发、AI赋能等五大核心领域开展深度协同创新，全方位布局医药数字化赛道，构建全链路智慧健康服务体系，助力行业数字化、智能化转型升级。（人民财讯）", "ctime": 1784259227, "time_str": "11:33:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260717/c678246413.shtml"}, {"id": "4746769", "title": "期货午评：贵金属全线走弱！沪银暴跌近4% 失守14000元关口", "content": "期货午评：早盘收盘，国内期货主力合约有涨有跌。沪银、钯跌近4%，铂跌超3%，聚氯乙烯、聚氯乙烯月均价跌近3%，纯碱、玻璃、红枣、烧碱、棉花、多晶硅跌超2%。涨幅方面，集运欧线、沪铅涨超2%，碳酸锂涨近2%，液化石油气、低硫燃料油、沥青涨超1%。", "ctime": 1784259187, "time_str": "11:33:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260717/c678246406.shtml"}, {"id": "4746767", "title": "ETF两市成交额报3709.64亿元，较昨日此时放量457.96亿元", "content": "截至目前，ETF两市成交额报3709.64亿元，较昨日此时放量457.96亿元，分类型来看，股票型ETF成交额1495.41亿元，债券型ETF成交额1334.04亿元，货币型ETF成交额184.57亿元，商品型ETF成交额33.07亿元，QDII型ETF成交额662.54亿元。", "ctime": 1784259185, "time_str": "11:33:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260717/c678246403.shtml"}, {"id": "4746759", "title": "ETF午评：电力ETF领涨3.07%，科创创新药ETF领跌8.39%", "content": "ETF午间收盘涨跌不一，电力ETF（159611）领涨3.07%，电力ETF（560580）涨2.91%，电力ETF（560270）涨2.83%，科创创新药ETF（589120）领跌8.39%，科创创新药ETF（589720）跌8.25%，通信ETF（159994）跌8.22%。", "ctime": 1784259071, "time_str": "11:31:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260717/c678246369.shtml"}, {"id": "4746755", "title": "A股午评：创业板指低开低走大跌4.71%，CRO概念、元件、CPO板块跌幅居前", "content": "A股三大指数早盘集体下跌，截至午盘，上证指数跌1.64%，深证成指跌3.7%，创业板指跌4.71%，北证50跌0.71%，科创50指数跌4.53%。全市场成交额16129亿元，较上日放量1232亿元，全市场超4300只个股下跌。板块题材上，电力、港口航运、银行、证券、公路铁路运输板块涨幅居前；CRO概念、医疗服务、元件、CPO、铜缆高速连接板块跌幅居前。盘面上，电力板块低开高走，乐山电力、华银电力、赣能股份、深南电A等股涨停，珈伟新能、九洲集团涨超10%。港口航运板块震荡走强，海通发展、招商港口、国航远洋涨幅居前。证券板块有所表现，湘财股份涨停，国盛证券、天风证券、第一创业跟涨。CRO概念板块大幅回调，昭衍新药、百花医药、百诚医药等股跌停，百奥赛图、泓博医药、睿智医药等多股跌超10%。CPO板块延续跌势，长飞光纤、广合科技、光迅科技等多股跌停，长光华芯、鼎通科技、仕佳光子等多股跌超10%。", "ctime": 1784259061, "time_str": "11:31:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260717/c678246368.shtml"}, {"id": "4746739", "title": "股指期货早盘收盘 主力合约全线下跌", "content": "股指期货早盘收盘，主力合约全线下跌。沪深300股指期货(IF)主力合约跌2.50%，上证50股指期货(IH)主力合约跌1.85%，中证500股指期货(IC)主力合约跌3.28%，中证1000股指期货(IM)主力合约跌3.08%。", "ctime": 1784259018, "time_str": "11:30:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260717/c678246346.shtml"}, {"id": "4746737", "title": "港股恒生科技指数跌幅达4%", "content": "港股恒生科技指数跌幅扩大至4%，恒生指数现跌1.91%。", "ctime": 1784258946, "time_str": "11:29:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260717/c678246324.shtml"}, {"id": "4746727", "title": "伊朗称多座桥梁遭美军袭击", "content": "据伊朗方面消息，在当地时间7月16日晚至17日凌晨的美军新一轮袭击中，伊朗的多座桥梁遭袭。美军中央司令部16日说，美国东部时间21时40分，美军完成了针对伊朗的最新一轮大规模打击。美军中央司令部称，美军动用战斗机、无人机和军舰，发射精确制导弹药，击中数十个伊朗军事目标，包括沿海监视和防空设施、军事后勤基础设施以及海上作战设施。（央视新闻）", "ctime": 1784258734, "time_str": "11:25:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260717/c678246222.shtml"}, {"id": "4746721", "title": "巴西外长：美加征关税“毫无正当理由”", "content": "巴西外交部长毛罗·维埃拉16日在首都巴西利亚说，美国政府宣布对部分巴西产品加征25%关税“毫无正当理由”，相关措施带有明显政治动机。维埃拉当天在新闻发布会上说，巴西政府不认可美国政府依据《1974年贸易法》第301条款对巴西发起调查的结果及由此采取的关税措施。巴西政府已与美方举行过多次会谈与沟通，持续寻求通过对话解决分歧，但美方多次将贸易问题与政治议题挂钩。维埃拉说，巴西没有屈服于美国在谈判期间提出的过分要求和不合理条件，这令美国政府感到不满。美方要求巴西完全且排他性地向美国开放国民经济的各个领域。（新华社）", "ctime": 1784258679, "time_str": "11:24:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260717/c678246206.shtml"}, {"id": "4746717", "title": "SK集团会长崔泰源回应近期股价下跌：内存芯片需求支撑下股价将长期上涨", "content": "SK集团会长崔泰源认为，在内存芯片需求的支撑下，SK海力士股价将呈长期上涨趋势。“对内存芯片的需求呈指数级增长，这就是为什么SK海力士和三星电子股价自去年以来出现快速飙升，”他在周五韩国工商会主办的论坛上表示。被问及近期股价下跌时他表示，股价通常会随着市场预期上涨，然后在经历一波过度上涨后出现回调。“我认为内存芯片的需求将持续存在，因此股价走势将随着时间的推移呈现上行趋势，”他说。注：周四，由于韩国当局对追踪芯片制造商的杠杆基金采取限制措施，SK海力士和三星股价分别下跌12%和8.8%。（财联社）", "ctime": 1784258657, "time_str": "11:24:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260717/c678246198.shtml"}, {"id": "4746693", "title": "现货黄金站上4000美元/盎司", "content": "现货黄金站上4000美元/盎司，日内涨0.57%。", "ctime": 1784258371, "time_str": "11:19:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260717/c678246092.shtml"}, {"id": "4746679", "title": "皮尤调查：多国民众对中国好感度超过美国", "content": "美国皮尤研究中心日前发布的一项调查结果显示，在接受调查的36个国家和地区中，对中国的好感度超过对美国的好感度。 皮尤研究中心进行的年度调查显示，在这36个国家和地区中，有27个国家和地区的民众对中国的好感度超过对美国的好感度，在亚太和中东地区尤其如此。 调查显示，2023年以来，这些国家民众对中美两国好感度差距不断缩小，并在今年进行的调查中出现反转。对中国好感度比例的中位数为46％，对美国好感度比例中位数为36％。 皮尤研究中心表示，美国的近邻加拿大和墨西哥对中国的好感度也高于美国。对美国好感度明显超过中国的国家仅有6个。(新华社)", "ctime": 1784258036, "time_str": "11:13:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260717/c678245980.shtml"}, {"id": "4746677", "title": "千寻智能“最强大脑”亮相WAIC 展示具身大脑长程任务能力", "content": "7月17日，2026世界人工智能大会（WAIC）在上海拉开帷幕。专注构建通用具身大脑的千寻智能（Spirit AI）亮相，集中展示了其在具身大脑、机器人本体及场景应用方面的最新进展。具身大脑层面，千寻智能在大会上首次公开客厅收纳、桌面整理等长程复合任务真机演示。搭载了千寻自研Spirit v1.6的Moz1机器人可基于单条自然语言指令，自主完成任务拆解、连续规划和动态调整，展示其在长程推理与复杂任务执行方面的能力升级。在本体与应用场景方面，千寻智能Moz2机器人首次亮相。区别于主要聚焦工业场景的Moz1，首次亮相的Moz2主要聚焦商超、酒旅、办公楼宇等商用服务场景，进一步拓展机器人的应用边界。（人民财讯）", "ctime": 1784257856, "time_str": "11:10:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260717/c678245941.shtml"}, {"id": "4746675", "title": "卡塔尔首都多哈再次传出爆炸声", "content": "当地时间7月17日，有目击者称，卡塔尔首都多哈再次传出爆炸声，卡塔尔政府今天第二次向用户手机发送空袭警报。卡塔尔国防部表示，已拦截多起空中袭击。此外，据巴林内政部消息，该国也响起当天第二轮防空警报。(央视新闻)", "ctime": 1784257843, "time_str": "11:10:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260717/c678245938.shtml"}, {"id": "4746673", "title": "外汇局：守好开放条件下的安全底线，外汇便利化改革思路涉及六方面", "content": "7月17日，在国新办新闻发布会上，国家外汇管理局副局长李斌表示，近年来外汇便利化改革的基本思路概括为六方面。一是更加注重主体便利，让诚信合规主体业务办理更快、效率更高。二是持续减少事前行政许可事项，更加注重事中事后管理。三是更加注重本外币协同，各类跨境投融资业务已基本实现本外币一套规则，可以在外汇局或银行一站式办理。四是更加注重科技赋能，运用区块链技术搭建跨境金融服务平台。五是更加注重政策评估，建立“外汇政策成效”和“区域外汇生态”两个评估机制。六是守好开放条件下的安全底线。（第一财经）", "ctime": 1784257804, "time_str": "11:10:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260717/c678245924.shtml"}, {"id": "4746669", "title": "辽宁省印发数据标注产业创新发展三年行动计划", "content": "日前，辽宁省数据和政务服务局等多部门联合印发《辽宁省推进数据标注产业创新发展 加快建设高质量数据集行动计划（2026—2028年）》，明确未来三年全省数据标注产业发展和高质量数据集建设总体思路。提出，到2028年底，打造5个左右省级数据标注基地，从业人员超3万人，力争产业规模超80亿元。（辽宁发布）", "ctime": 1784257721, "time_str": "11:08:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260717/c678245898.shtml"}, {"id": "4746649", "title": "股票私募平均仓位创近4年新高", "content": "根据第三方机构私募排排网监测数据，截至2026年7月10日，股票私募平均仓位升至83.70%，较前一周上升0.15个百分点。自5月15日以来，该仓位数据呈现明显的上行趋势，累计升幅达3.61个百分点，并在近期实现连续三周加仓。在这一积极态势的推动下，股票私募平均仓位不仅再次刷新年内高点，更创下近4年以来的新高。(中证金牛座)", "ctime": 1784257512, "time_str": "11:05:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260717/c678245843.shtml"}, {"id": "4746617", "title": "铁路部门试点提前60天预约购票服务", "content": "记者17日从中国国家铁路集团有限公司客运中心获悉，7月20日起，铁路部门将在京沪高铁、京沪铁路的200多趟列车试点新增火车票预约购票服务，旅客可通过铁路12306手机客户端“预约购票”专区，在列车开车前第60天至第17天填报预约需求，铁路12306系统将于开车前第20天至第16天兑现预约订单。7月20日至8月29日为过渡期，可依次预约9月15日及以后的车票，8月30日起，可常态化预约开车前第60天至第17天车票。 国铁集团客运中心负责人介绍，火车票预约购票服务是指铁路部门在车票预售期开始前，提前对接旅客购票需求，统筹调配运力和票额资源，并在约定时间内向购票人反馈兑现结果的购票服务。实行预约购票，有利于铁路部门提前对接掌握旅客出行需求，科学配置运力资源，优化票额分配机制，更好匹配运能与需求关系，实现“按需开车”，确保运力资源最大化利用；有利于火车票发售更加均衡，可以更好地满足旅客个性化购票需求，进一步提升旅客购票体验，为旅客提前规划行程创造更加有利的条件。 这位负责人介绍，目前试点新增的火车票预约购票服务仅面向普通旅客，暂不支持超过19人的团体旅客预约。旅客可通过铁路12306手机客户端首页“预约购票”服务专区填写预约需求，可预约日期范围为列车开车前第60天至第17天，每日8时起可提交开车前第60天的预约订单。(新华社)", "ctime": 1784257228, "time_str": "11:00:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260717/c678245769.shtml"}, {"id": "4746591", "title": "外汇局：在必要时强化逆周期调节和预期引导，维护外汇市场平稳运行", "content": "国家外汇管理局副局长李斌在国新办新闻发布会上表示，国家外汇局始终坚持促便利和防风险相结合，坚决守好开放条件下的安全底线，持续完善“宏观审慎+微观监管”两位一体管理框架，在必要时强化逆周期调节和预期引导，维护外汇市场平稳运行，防范系统性风险。（证券时报）", "ctime": 1784257054, "time_str": "10:57:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260717/c678245722.shtml"}, {"id": "4746577", "title": "外汇局：一季度末，人民币外债占比55%，中长期外债占比稳定在40%以上", "content": "7月17日，在国新办新闻发布会上，国家外汇管理局资本司司长肖胜表示，我国外债规模总体保持稳定、结构持续优化、安全性较高。近3年我国外债规模基本稳定在2.3万亿美元至2.5万亿美元之间。2026年一季度末，人民币外债占比为55%，较2022年末提升10个百分点；中长期外债占比稳定在40%以上，外债期限和币种错配风险明显降低。2025年末，我国负债率、债务率、偿债率、短期外债与外汇储备比率分别为11.9%、56.3%、6.2%和39.2%，均明显低于国际安全警戒线。（第一财经）", "ctime": 1784256803, "time_str": "10:53:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260717/c678245645.shtml"}, {"id": "4746573", "title": "港股大模型概念股跌幅扩大，智谱港股跌超20%", "content": "港股大模型概念股跌幅扩大，智谱港股跌超20%，MINIMAX-W跌超14%。", "ctime": 1784256760, "time_str": "10:52:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260717/c678245637.shtml"}, {"id": "4746567", "title": "富时中国A50指数期货跌3%", "content": "富时中国A50指数期货跌幅扩大至3%。", "ctime": 1784256595, "time_str": "10:49:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {

  }
  tbody.innerHTML = PICKS.map(p => {

      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);

        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
