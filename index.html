.down { color: var(--green); }

确认书》，过户日期为2026年8月7日，过户数量为9906.54万股，占公司股份总数的23.36%，股份性质为无限售流通股，过户手续已办理完毕。本次转让不涉及公司控制权变更。", "ctime": 1786351121, "time_str": "16:38:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260810/c678827661.shtml"}, {"id": "4924801", "title": "中熔电气：获美国新势力车企全球独家定点，销售总金额预计2亿元", "content": "中熔电气公告，公司于近期收到美国某新势力车企900VDC平台车型电池包多工位转换开关全球独家定点的定点通知书，并已签署正式合同。项目周期内销售总金额预计为2亿元人民币，预计2028年4季度开始SOP，不会对公司本年度业绩产生重大影响。", "ctime": 1786351113, "time_str": "16:38:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260810/c678827654.shtml"}, {"id": "4924763", "title": "库尔德工人党就解散法案向土政府提异议", "content": "土耳其议会定于10日审议一项旨在彻底解散库尔德工人党（PKK）及其武装的法案草案。库尔德工人党9日就此提出异议，要求土政府释放仍被监禁的该组织领导人阿卜杜拉·厄贾兰。据称，这项草案将允许库尔德工人党成员放下武器后，回归平民生活，但没有许诺全面特赦。一些罪行较轻的成员将获5至10年缓刑，但犯故意杀人罪等严重罪行的成员仍将被追究责任。（央视新闻）", "ctime": 1786350727, "time_str": "16:32:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260810/c678827420.shtml"}, {"id": "4924759", "title": "阿里云计划将全球数据中心产能提升两倍以上", "content": "记者获悉，基于全模块化设计架构，阿里云已将大型AIDC数据中心的交付工期缩短至100天。据了解，在大幅缩短工期的同时，阿里云数据中心整体建设成本反而降低10%以上。今年，阿里云正计划将模块化数据中心的全球产能提升两倍以上。（人民财讯）", "ctime": 1786350701, "time_str": "16:31:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260810/c678827406.shtml"}, {"id": "4924731", "title": "两部门对河北河南启动防汛四级应急响应", "content": "据气象部门预报，未来三天，受台风“白海豚”影响，河北中南部、河南等地有暴雨或大暴雨，局地有特大暴雨。中央气象台8月10日10时继续发布暴雨橙色预警。根据《国家防汛抗旱应急预案》及有关规定，国家防总、应急管理部决定于8月10日15时针对河北、河南启动防汛四级应急响应。(新华社)", "ctime": 1786350468, "time_str": "16:27:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260810/c678827298.shtml"}, {"id": "4924719", "title": "潍柴重机：拟投资5.38亿元建设电力能源高端装备制造基地项目", "content": "潍柴重机公告，公司拟投资建设电力能源高端装备制造基地项目，投资预算金额约为5.38亿元，项目位于潍柴重机潍坊滨海工业园，建设周期不超过18个月，将扩大公司大功率发电机组产能。", "ctime": 1786350271, "time_str": "16:24:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260810/c678827233.shtml"}, {"id": "4924717", "title": "8月第1周生猪和猪肉价格略有下跌", "content": "据农业农村部对500个县集贸市场和采集点监测，上周（8月第1周，8月3日—9日，下同），全国活猪价格为11.13元/公斤，环比跌0.8%；猪肉集贸市场价格为20.82元/公斤，环比跌0.4%。据农业农村部对200个批发市场监测调度，上周全国猪肉批发市场均价为15.73元/公斤，环比跌0.5%，同比低22.6%。专家分析认为，上周多数生猪养殖主体正常出栏，市场总体供给充裕，消费需求偏弱，生猪和猪肉价格略有下跌。展望后市，预计本周生猪和猪肉价格以窄幅波动为主。(农业农村部)", "ctime": 1786350258, "time_str": "16:24:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260810/c678827228.shtml"}, {"id": "4924699", "title": "芯片通胀压力下苹果寻求采购长鑫科技芯片？公司回应：以公告披露为准", "content": "8月10日，据《华尔街日报》消息，受人工智能投资热潮引发的“芯片通胀（Chipflation）”成本压力影响，苹果将目光投向国产存储半导体。对此，财闻致电长鑫科技证券部，相关人士回应称：公司对外所有重大合作、产能进度等信息，以公司公告、招股书、以及后续的中期报告为主；至于DDR6产能规划、量产进度等，出于信息合规管理要求，暂不方便对外透露。关于市场传闻等，公司将会严格遵照上市信息披露规则，结合实际情况推进相关信披工作。（财闻）", "ctime": 1786350089, "time_str": "16:21:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260810/c678827142.shtml"}, {"id": "4924695", "title": "快意电梯：控股股东向实控人转让7.5%股份完成过户", "content": "快意电梯公告，公司控股股东东莞市快意股权投资有限公司向实际控制人罗爱文女士协议转让2525.16万股（占公司总股本7.5%）的股份，已于2026年8月7日完成过户登记手续。本次转让价款总额为人民币3.12亿元，转让完成后公司控股股东及实际控制人未发生变化。", "ctime": 1786349975, "time_str": "16:19:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260810/c678827081.shtml"}, {"id": "4924693", "title": "日本显示器千叶工厂收到多份收购报价", "content": "日本显示器公司（JDI）周一表示，已收到多家制造企业以及数据中心运营商的正式收购要约，标的为该公司位于东京东侧千叶县的显示面板工厂。首席执行官赤间润在财报电话会上称，公司正与潜在合作方开展尽职调查。首席财务官表示，JDI 力争在明年 3月前完成工厂出售，以此改善自身财务状况。至于是否有可能在美国新建一座显示面板工厂，该事项取决于美日两国政府的态度。（新浪财经）", "ctime": 1786349972, "time_str": "16:19:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260810/c678827078.shtml"}, {"id": "4924685", "title": "中指研究院：地方国企系长租公寓开业规模稳中有增", "content": "中指研究院最新发布《2026年7月中国住房租赁企业规模排行榜》，据中指研究院统计，2026年7月，TOP30集中式长租公寓企业累计开业房源量为147.1万间，较6月增加2.3万间；具体来看，地方国企系开业规模稳中有增，在TOP30中的规模占比提升至30%。市场运行方面，受毕业季租赁需求持续释放影响，2026年7月50城住宅平均租金环比涨幅有所扩大。（人民财讯）", "ctime": 1786349736, "time_str": "16:15:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260810/c678826922.shtml"}, {"id": "4924657", "title": "港股收评：恒生指数涨1.05%，恒生科技指数涨1.26%", "content": "港股收盘，恒生指数涨1.05%，恒生科技指数涨1.26%。恒指港股通ETF银华（159318）涨0.83%，港股通科技ETF鹏华（159751）涨1.43%。板块方面，焦炭加工Ⅲ、焦炭加工Ⅳ板块涨幅靠前；调查和咨询服务、环保设备板块跌幅靠前。个股方面，国泰君安国际涨36.78%，五一视界涨15.48%，森松国际涨12.86%，老铺黄金涨12.39%，百奥赛图-B涨11.08%；中国星集团跌9.88%，深圳国际跌9.88%，珞石机器人跌9.47%，天数智芯跌8.24%，怡俊集团控股跌7.93%。", "ctime": 1786349405, "time_str": "16:10:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260810/c678826688.shtml"}, {"id": "4924655", "title": "永茂泰：拟以1.5亿元-3亿元回购公司股份", "content": "永茂泰公告，拟以1.5亿元-3亿元回购公司股份，回购价格不超过22.8元/股。回购股份的用途为维护公司价值及股东权益，将在披露回购结果暨股份变动公告12个月后采用集中竞价交易方式全部出售。回购资金来源为公司自有资金和自筹资金，其中公司已取得中国银行上海长三角一体化示范区分行不超过2.7亿元的贷款承诺函。回购期限为董事会审议通过之日起3个月。", "ctime": 1786349338, "time_str": "16:08:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260810/c678826405.shtml"}, {"id": "4924637", "title": "鑫科材料：2026年上半年净利润4261.15万元，同比增115.97%", "content": "鑫科材料公告，2026年上半年营业收入27.23亿元，同比增长25.55%。归属于上市公司股东的净利润4261.15万元，同比增长115.97%；扣除非经常性损益的净利润3840.62万元，同比增长170.72%。基本每股收益0.02元。本报告期不进行利润分配或公积金转增股本。", "ctime": 1786349150, "time_str": "16:05:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260810/c678825950.shtml"}, {"id": "4924629", "title": "《煤炭工业发展“十五五”规划》印发：到2030年 全国大型现代化煤矿产能比重提升至87%", "content": "国家发展改革委、国家能源局印发《煤炭工业发展“十五五”规划》。其中指出，到2030年，煤炭兜底保障能力进一步增强，生产开发布局持续优化，优质先进产能比重进一步提升，产供储销体系更加完善，全国大型现代化煤矿产能比重提升至87%；安全绿色开发和清洁高效利用水平明显提高，全系统智能化建设深入推进，智能化煤矿产能比例提升至75%；煤基多元化产业格局加快形成，煤炭消费实现达峰，供需动态平衡保障机制进一步健全，行业现代化治理能力显著提高，现代煤炭产业体系基本建成，煤炭高质量发展迈上新台阶。", "ctime": 1786349046, "time_str": "16:04:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260810/c678825571.shtml"}, {"id": "4924615", "title": "完成天使轮融资 橡木果发布全球首个具身本能模型", "content": "8月10日，橡木果机器人正式发布Natus AGE-0具身本能模型。这是全球首个以触觉感知为核心、复刻人类操作机理的通用操作基座模型。同日，橡木果披露完成由招商局创投和蔚来资本共同领投的天使轮融资，资金将主要用于面向工业柔性生产的机器人产品研发、品牌体系构建与市场拓展。（证券时报）", "ctime": 1786348922, "time_str": "16:02:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260810/c678825096.shtml"}, {"id": "4924609", "title": "美股大型科技股盘前普涨，SpaceX涨1%", "content": "美股大型科技股盘前普涨，SpaceX涨1%，特斯拉、美光科技涨0.9%，英伟达涨0.5%，SK海力士、谷歌A涨0.4%，Meta涨0.2%，亚马逊、微软、苹果持平。", "ctime": 1786348889, "time_str": "16:01:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260810/c678824974.shtml"}, {"id": "4924607", "title": "美股中概股盘前多数上涨，贝壳涨2%", "content": "美股中概股盘前多数上涨，贝壳涨2%，百济神州涨0.8%，阿里巴巴涨0.7%，京东涨0.4%，携程涨0.3%，拼多多涨0.2%，理想汽车、网易跌1%。", "ctime": 1786348884, "time_str": "16:01:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260810/c678824955.shtml"}, {"id": "4924593", "title": "中矿资源：子公司两条高纯锂盐生产线恢复生产", "content": "中矿资源公告，公司全资子公司江西中矿锂业此前因锂精矿运输与生产调度错配，自2026年6月30日起对“年产3万吨高纯锂盐”和“年产3.5万吨高纯锂盐”生产线临时停产检修。截至公告披露日，检修工作已完成，公司决定“年产3万吨高纯锂盐”生产线于2026年8月10日恢复生产，“年产3.5万吨高纯锂盐”生产线计划于2026年8月中旬逐步恢复生产。", "ctime": 1786348783, "time_str": "15:59:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260810/c678824720.shtml"}, {"id": "4924591", "title": "水利部针对冀鲁豫鄂4省启动洪水防御Ⅳ级应急响应", "content": "据预报，受第13号台风“白海豚”和冷空气共同影响，8月10日至16日，湖北、河南、河北、山东将先后出现大到暴雨，其中湖北西北部、河南东南部和北部、河北中部南部等地部分地区将有大暴雨，局部将有特大暴雨。受降雨影响，长江中游干流及支流汉江，淮河上中游干支流及沂沭泗水系，黄河中下游干流及支流伊洛河、沁河，海河流域漳卫河、徒骇马颊河、子牙河、大清河等主要河流将出现明显涨水过程；其中沙颍河、伊洛河、黄河、卫河等主要河流可能发生编号洪水，湖北汉江支流北河，河南沙颍河上游支流北汝河、伊洛河支流蛮峪河、卫河支流淇河，河北滏阳河水系李阳河，山东沭河支流鸡龙河等中小河流可能发生较大洪水。依据《水利部水旱灾害防御应急响应工作规程》，水利部于8月10日14时针对河北、山东、河南、湖北省启动洪水防御Ⅳ级应急响应。督促指导地方水利部门和相关流域管理机构强化值班值守和会商研判，及时发布预警信息；科学调度运用水库和水闸枢纽，做好有关蓄滞洪区启用准备；加密水库、堤防巡查防守，及时发现和处置险情，并第一时间报告相关信息；突出抓好中小河流洪水和山洪灾害防御，提醒有关地方及时转移受威胁人员，确保人民群众生命财产安全。（央视新闻）", "ctime": 1786348766, "time_str": "15:59:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260810/c678824712.shtml"}, {"id": "4924571", "title": "倍杰特：全资子公司收购金鑫冶金55%股权已完成工商变更登记", "content": "倍杰特公告，公司全资子公司倍杰特新材料以5434万元通过股权转让及增资扩股方式取得金鑫冶金55%股权，近日已完成相关工商变更登记手续，金鑫冶金纳入公司合并报表范围。", "ctime": 1786348530, "time_str": "15:55:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260810/c678824614.shtml"}, {"id": "4924569", "title": "普洛药业：子公司获己酮可可碱缓释片药品注册证书，规格0.4g", "content": "普洛药业公告，公司控股子公司浙江普洛康裕制药有限公司收到国家药品监督管理局签发的己酮可可碱缓释片《药品注册证书》。该药品规格0.4g，注册分类为化学药品3类，上市许可持有人及生产企业均为浙江普洛康裕制药有限公司。己酮可可碱缓释片为周围血管扩张药，根据相关数据显示，该产品2025年度国内市场规模约为5227万片，销售金额约为2.62亿元。公司该产品以化学药品3类获批，视同通过仿制药一致性评价。", "ctime": 1786348510, "time_str": "15:55:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260810/c678824611.shtml"}, {"id": "4924567", "title": "*ST广糖：2026年上半年净利润亏损1602.86万元", "content": "*ST广糖公告，2026年上半年营业收入15.82亿元，同比增长17.39%。净利润亏损1602.86万元，上年同期净利润912.35万元。", "ctime": 1786348487, "time_str": "15:54:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260810/c678824591.shtml"}, {"id": "4924557", "title": "苏州市发布京杭运河苏州段洪水红色预警", "content": "苏州市水务局8月10日15时发布京杭运河苏州段洪水红色预警。提醒影响区域各级政府及有关部门密切关注水雨情变化，加强应急值守和分析研判，组织巡堤查险，做好应急抢险准备。（央视新闻）", "ctime": 1786348386, "time_str": "15:53:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260810/c678824558.shtml"}, {"id": "4924545", "title": "宁夏7月外送电量、外送新能源电量双创新高", "content": "记者8月10日从宁夏电力交易中心有限公司获悉，宁夏7月外送电量112.59亿千瓦时，同比增长5.3%；外送新能源电量32.72亿千瓦时，同比增长12.7%，单月外送电量、新能源外送电量均创新高。与此同时，8月10日，宁夏首次成交8月外送蒙东地区电量0.02亿千瓦时，今年宁夏至此已实现向福建、广东等4省区首次送电，外送范围由19个省份扩展至23个省份。据介绍，为完成年度外送目标，宁夏电力交易中心有限公司全力增加外送方向及规模，多部门协同配合滚动开展电网平衡测算，释放晚峰送电能力，跟踪购电省购电意向，拓展新增外送方向，抢抓各直流通道送电空间。（新华社）", "ctime": 1786348116, "time_str": "15:48:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260810/c678824402.shtml"}, {"id": "4924527", "title": "石药创新：猴痘mRNA疫苗获美国临床试验批准，编号33047", "content": "石药创新公告，公司控股子公司石药集团巨石生物制药有限公司与中国科学院微生物研究所合作开发的SYS6037注射液（猴痘mRNA疫苗）药品临床试验申请已获得美国FDA批准，可以在美国开展临床试验。SYS6037注射液为单条mRNA链编码的多抗原猴痘疫苗，用于猴痘的预防；临床前研究显示其相较于减毒活疫苗（天坛株）具有更优的免疫原性和保护效力，且对多种正痘病毒抗原表现出广谱交叉反应。", "ctime": 1786347989, "time_str": "15:46:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260810/c678824278.shtml"}, {"id": "4924521", "title": "现货黄金站上4360美元/盎司 纽约期金站上4420美元/盎司", "content": "现货黄金站上4360美元/盎司，日内涨0.47%。纽约期金站上4420美元/盎司，日内涨0.49%。", "ctime": 1786347928, "time_str": "15:45:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260810/c678824263.shtml"}, {"id": "4924511", "title": "华兰生物：控股子公司正在开展新型流感病毒mRNA疫苗的研发工作", "content": "华兰生物在互动平台表示，控股子公司华兰疫苗正在开展新型流感病毒mRNA疫苗的研发工作，疫苗研发存在不确定性，请投资者注意投资风险。（第一财经）", "ctime": 1786347434, "time_str": "15:37:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260810/c678823986.shtml"}, {"id": "4924503", "tit // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
