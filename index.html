提出，要加大金融资源投入力度，助力妇女就业发展。加强创业孵化基地等创业载体建设融资支持，为女性创业项目落地提供保障。鼓励各地结合实际优化创业担保贷款政策，对信用良好的女性创业者适当降低或取消反担保要求。拓宽妇女就业创业多元化融资渠道，支持符合条件的妇女创业企业注册发行债务融资工具、开展供应链票据业务。优化教育培训金融服务，提升妇女就业发展能力。用好国家助学贷款政策，规范开展研究生商业性助学贷款业务，支持女性接受高等教育。加强对职业院校等培训机构的融资支持，探索“培训+信贷”模式，支持妇女参加职业技能培训、提升金融知识素养。", "ctime": 1782209015, "time_str": "18:03:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260623/c677653538.shtml"}, {"id": "4576187", "title": "GSMA预计2030年移动技术对中国经济贡献达2万亿美元", "content": "MWC26上海（世界移动通信大会上海）将在6月24日开幕。大会开幕前夕，GSMA （全球移动通信系统协会）发布《2026 中国移动经济发展》报告。数据显示，中国5G连接数在全球比重已逾40%；2025年移动技术为中国创造了1.5万亿美元的经济价值，占GDP的7.2%，预计到2030年这一数字将攀升至2.1万亿美元。\nGSMA 大中华区总裁斯寒表示：“中国5G连接数在全球比重已超过40%；2025年移动技术为中国创造了1.5万亿美元的经济价值。这些数字折射出移动产业早已超越连接范畴，进化为无处不在的基础能力，成为赋能生产力提升、深化 AI 驱动服务、引领可持续经济增长的关键底座。”(澎湃新闻)", "ctime": 1782208903, "time_str": "18:01:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260623/c677653487.shtml"}, {"id": "4576181", "title": "伊朗称将继续追究参与侵略伊朗者的责任", "content": "据伊朗伊斯兰共和国通讯社23日报道，伊朗外交部发言人巴加埃当天表示，某些中东地区国家参与美国和以色列侵略伊朗的战事，伊朗将继续追究其责任。\n\n巴加埃说，伊朗有足够的证据证明某些地区国家参与袭击伊朗，伊朗“绝不会放弃这个问题”，将追究其法律责任，并提出相应要求。(新华社)", "ctime": 1782208884, "time_str": "18:01:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260623/c677653481.shtml"}, {"id": "4576167", "title": "字节新一代豆包手机供应链信息曝光 发布时间或延迟", "content": "记者从知情人士处获悉，由中兴通讯与字节共同推进的新一代豆包AI手机或较既定发布时间有所延长，究其原因与备案认证流程有关。据悉，与普通手机不同，这款产品需要同时闯过两道关口：一是网信部门负责的大模型备案；二是工信部主管的手机终端入网认证。记者获悉该手机相关供应链信息，其中屏幕供应商已由前一代的深天马，更换为京东方。相关人士并未知悉具体更换原因，仅表示，“现在屏幕厂商之间抢单情况严重”。电池方面，德赛电池成为新一代豆包手机的供应商，采用ATL电芯，而德赛电池是苹果、三星等品牌的电池管理系统核心供应商，ATL则是全球消费锂电池领域的领先企业。代工方面，新一代豆包手机由A股上市公司福日电子旗下中诺通讯承担。据了解，该公司长期为中兴提供ODM/OEM服务，是努比亚品牌的重要代工厂。 (蓝鲸新闻)", "ctime": 1782208848, "time_str": "18:00:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260623/c677653473.shtml"}, {"id": "4576165", "title": "阿里云上调.co域名注册价格", "content": "阿里云公告，因域名上游注册局成本上调，经慎重考虑，现决定于2026年7月1日零时，对.co域名进行价格调整。.co 注册价格调整为120元/首年，续费和转入价格调整为249元/年。", "ctime": 1782208836, "time_str": "18:00:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260623/c677653469.shtml"}, {"id": "4576147", "title": "商务部：1—5月全国网上商品零售额增长5.0%", "content": "2026年以来，商务部以“政策+活动”双轮驱动，推动电子商务平稳创新发展，持续发挥数据、技术、场景优势，更好赋能产业数字化转型，开拓对外开放新空间，推动做强做优做大实体经济。赋能制造业向好向新。培育产业电商，持续开展“电商+产业带”对接，发挥电子商务精准匹配优势，提升产业带商品供需适配性，助力企业数智化制造。据国家统计局数据，1—5月全国网上商品零售额增长5.0%，对社会消费品零售总额增长贡献率88.3%。据商务大数据监测，1—5月智能助行外骨骼和智能眼镜网上零售额分别增长560.5%和165.9%。（央视新闻）", "ctime": 1782208819, "time_str": "18:00:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260623/c677653467.shtml"}, {"id": "4576109", "title": "力量钻石：“金刚石散热材料”关注度较高，该应用场景尚未达到大规模市场化应用阶段", "content": "力量钻石股票交易异常波动公告，近期“金刚石散热材料”关注度较高。截止目前，该应用场景尚未达到大规模市场化应用阶段，市场化进度尚存在重大不确定性，未对公司主营业务及收入产生影响，请投资者注意投资风险。", "ctime": 1782208742, "time_str": "17:59:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260623/c677653421.shtml"}, {"id": "4576105", "title": "阿拉伯国家欢迎美伊签署谅解备忘录", "content": "第165届阿拉伯国家联盟（阿盟）外长理事会例会续会22日在约旦首都安曼召开，与会国家外长欢迎美国和伊朗签署谅解备忘录。 约旦副首相兼外交大臣萨法迪在会后召开的联合新闻发布会上说，有必要继续在瑞士进行谈判，以寻求全面解决危机的方案，消除近期地区紧张局势的根源。 巴林外交大臣扎耶尼表示，阿拉伯国家认为美伊谅解备忘录是一个积极信号，有助于缓和紧张局势，并为达成更全面的协议铺平道路。他强调，必须全面遵守谅解备忘录的各项条款，尊重本地区各国的主权，确保霍尔木兹海峡的航行自由。 扎耶尼说，阿拉伯国家之间亟需加强磋商与协调，这将有助于阿拉伯世界形成统一立场，维护阿拉伯国家安全，并回应人民对安全、稳定和发展的渴望。(新华社)", "ctime": 1782208662, "time_str": "17:57:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260623/c677653385.shtml"}, {"id": "4576103", "title": "片仔癀：肠激安胶囊Ⅲ期临床试验完成首例试验参与者入组", "content": "片仔癀公告，近日，公司研发的1.1类中药创新药肠激安胶囊顺利完成“肠激安胶囊治疗腹泻型肠易激综合征（肝气乘脾证）有效性和安全性的多中心、随机、双盲、安慰剂对照Ⅲ期临床试验”首例试验参与者入组工作，正式进入Ⅲ期临床试验。", "ctime": 1782208650, "time_str": "17:57:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260623/c677653380.shtml"}, {"id": "4576101", "title": "申通快递：拟以3.5亿元-4.5亿元回购公司股份", "content": "申通快递公告，拟使用自有资金和自筹资金通过集中竞价方式回购公司股份，回购资金总额不低于人民币3.5亿元且不超过人民币4.5亿元，回购价格不超过人民币22元/股。预计回购股份数量按上限测算不低于2045.45万股，约占公司目前总股本的1.34%；按下限测算不低于1590.9万股，约占公司目前总股本的1.04%。回购期限为自公司董事会审议通过回购股份方案之日起12个月内。", "ctime": 1782208634, "time_str": "17:57:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260623/c677653373.shtml"}, {"id": "4576085", "title": "晶升股份：股东卢语减持计划届满，合计减持2.33%股份", "content": "晶升股份公告，持股5%以上股东卢语此前计划自2026年2月28日披露起的3个月内减持不超过415.09万股（占总股本3%）。截至2026年6月22日，减持计划时间届满，卢语通过集中竞价及大宗交易方式合计减持公司股份322.34万股，占总股本2.33%，减持总金额约1.57亿元，减持价格区间33.09～82元/股。本次减持后，卢语持有公司股份578.63万股，占总股本4.18%，不再是公司持股5%以上股东。", "ctime": 1782208401, "time_str": "17:53:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260623/c677653219.shtml"}, {"id": "4576073", "title": "富淼科技：股东飞翔股份拟减持不超过2%股份", "content": "富淼科技公告，持股5%以上股东江苏飞翔化工股份有限公司（持有公司股份1384.59万股，占公司总股本9.67%）因自身资金需求，拟于2026年7月16日至2026年10月15日，通过大宗交易方式减持不超过286.49万股，占公司总股本比例不超过2.00%。若期间公司发生除权除息事项，减持数量将相应调整。该减持计划存在不确定性。", "ctime": 1782208350, "time_str": "17:52:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260623/c677653191.shtml"}, {"id": "4576059", "title": "中证协：券商经纪业务不仅要关注规模增长 更应注重服务质效提升", "content": "记者获悉，中证协日前召开经纪业务专业委员会主任委员（扩大）会议。会议强调，行业要准确把握证券经纪业务的功能定位，在业务发展过程中，不仅要关注业务规模的增长，更要注重服务质效的提升，以更高的标准、更严的要求，推动经纪业务高质量发展，提升专业服务能力。中证协称，将积极推动证券经纪业务与投资咨询、资产管理等业务协同发展，探索行业财富管理转型。（财联社）", "ctime": 1782208227, "time_str": "17:50:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260623/c677652603.shtml"}, {"id": "4575997", "title": "第四届链博会创新链国际合作年度报告发布", "content": "为进一步推广创新成果转化典型模式，6月23日，《第四届链博会创新链国际合作年度报告（2025-2026年）》在第四届中国国际供应链促进博览会上发布。报告以“六维联动促‘四链’融合”为主题，以第四届链博会创新链专区参展机构的具体实践与先进经验为核心，从公共服务支撑、创新源头供给、专业服务赋能、载体生态集聚、国际组织协同、产业需求牵引六大协同维度，介绍创新链、产业链、资金链、人才链深度融合的创新路径与发展逻辑，为推动科技成果高效转化、赋能实体经济高质量发展提供可落地、可复制、可推广的实践路径与示范样本。据了解，为更好促进科技创新与产业创新融合发展，从2025年第三届链博会开始，会展增设以科技成果转化为主线的创新链专区，以实景方式展示科技成果转化应用全链条全过程，取得了积极成效。此次发布的年度报告进一步深化链博会创新链理念，体系化梳理典型机构与科技企业在创新成果转化领域的先进经验与发展成效，推动提升科技成果转化效率，促进新质生产力发展。据悉，年度报告由中国贸促会法律事务部联合启迪创新研究院发布。（新华社）", "ctime": 1782207397, "time_str": "17:36:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260623/c677652597.shtml"}, {"id": "4575995", "title": "腾讯控股：当日回购119万股，耗资约5亿港元", "content": "腾讯控股公告，2026年6月23日，公司于香港联交所回购119万股普通股，每股回购价介于413.6港元至431.2港元，付出价格总额为5.01亿港元。上述回购股份拟注销。截至当日，公司已发行股份（不包括库存股份）总数为91.08亿股。此外，当日因行使2023年购股权计划下购股权，公司发行11512股新股，每股发行价为288.99港元。自购回授权决议通过日（2026年5月13日）起，公司累计已购回2627.81万股，占决议通过当日已发行股份（不包括库存股份）数目的0.2882%。", "ctime": 1782207385, "time_str": "17:36:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260623/c677652588.shtml"}, {"id": "4575969", "title": "海欣股份：不存在正在筹划涉及上市公司的重大资产重组等重大事项", "content": "海欣股份股票交易异常波动公告，截至公告披露日，公司、公司第一大股东湖南凝瑞投资合伙企业（有限合伙）及其一致行动人湖南财信经济投资有限公司确认，不存在正在筹划涉及上市公司的重大资产重组、股份发行、重大交易类事项、业务重组、股份回购、股权激励、破产重整、重大业务合作、引进战略投资者等重大事项。", "ctime": 1782207164, "time_str": "17:32:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260623/c677652445.shtml"}, {"id": "4575965", "title": "南向资金今日净买入103.71亿港元 盈富基金获净买入居前", "content": "南向资金今日净买入103.71亿港元。盈富基金、中芯国际分别获净买入约41.72亿港元、24.72亿港元；阿里巴巴-W、小米集团-W分别遭净卖出12.52亿港元、1.05亿港元。", "ctime": 1782207152, "time_str": "17:32:32", "st // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
