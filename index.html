1/c676150439.shtml"}, {"id": "4253787", "title": "中际旭创成交额达200亿元", "content": "中际旭创成交额达200亿元，现涨1.92%。", "ctime": 1776754134, "time_str": "14:48:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260421/c676150305.shtml"}, {"id": "4253779", "title": "巴基斯坦继续对印度飞机关闭领空至5月23日", "content": "当地时间4月21日，巴基斯坦机场管理局发布通告，将对印度飞机继续关闭领空。这一关闭措施将持续至5月23日。2025年4月，巴基斯坦与印度紧张局势加剧。巴方于当年4月下旬开始对印度关闭领空，此后多次发布飞行通告，持续延长领空关闭时间。（央视新闻）", "ctime": 1776754057, "time_str": "14:47:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260421/c676150277.shtml"}, {"id": "4253731", "title": "秘鲁对原产于中国的涤棉混纺织物启动反规避调查", "content": "2026年4月19日，秘鲁国家竞争和知识产权保护局倾销、补贴和消除非关税贸易壁垒委员会在官方日报《秘鲁人报》（El Peruano）发布第064-2026/CDB-INDECOPI号公告称，应秘鲁国内生产商Tecnología Textil S.A.申请，对原产于中国的涤棉混纺织物启动反规避调查，审查涉案产品是否经轻微改变（用粘胶纤维替代棉纤维）出口至秘鲁以规避反倾销税。本案调查期为2017年1月至2025年10月。涉案产品的秘鲁税号为5512.11.00.00、5512.19.00.00、5513.11.00.00和5513.21.00.00。公告自发布之日起生效。利益相关方应在公告发布之日起六个月内提交案件评述意见及证据材料，上述期限可延长三个月。（中国贸易救济信息网）", "ctime": 1776753512, "time_str": "14:38:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260421/c676150098.shtml"}, {"id": "4253721", "title": "伊朗军方：已准备好果断回应“敌方违背承诺的行为”", "content": "当地时间21日，伊朗武装部队哈塔姆·安比亚中央司令部指挥官阿卜杜拉希表示，伊朗已准备好对“敌方违背承诺的行为”作出果断回应。阿卜杜拉希表示，当前伊朗军队具备“权威性、战备水平以及全面战略能力”，伊朗伊斯兰革命卫队及其他防御力量在相关行动中展现出作战能力，使“以色列方面和美国方面陷入困境并感到疲惫”，并“被迫寻求停火”。阿卜杜拉希还强调，伊朗武装力量与政府及民众在最高领袖统一指挥下保持高度一致，将对任何威胁和行动作出“果断、坚决、及时”的回应。（央视新闻）", "ctime": 1776753485, "time_str": "14:38:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260421/c676150095.shtml"}, {"id": "4253693", "title": "日韩股市集体收涨", "content": "日经225指数收涨0.89%，报59349.17点。韩国综指收涨2.72%，报6388.47点。", "ctime": 1776753078, "time_str": "14:31:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260421/c676149969.shtml"}, {"id": "4253677", "title": "市场监管总局、教育部联合印发《关于公布专业与标准化教育融合试点名单的通知》", "content": "记者今天（4月21日）了解到，市场监管总局、教育部联合印发《关于公布专业与标准化教育融合试点名单的通知》，全国共281个试点项目入选。此次试点是两部门首次联合开展的全国性专业与标准化教育融合试点工作，标志着我国标准化人才培养迈入新阶段。首批试点经自主申报、初选推荐、专家评审、社会公示等程序产生，覆盖全国30个省（区、市）的253所高等院校。试点专业覆盖人工智能、智能制造、低空经济、食品质量安全、现代服务业等多个国家重点产业与民生领域，超八成试点引入企业、科研机构等标准化领域相关单位联合参与，联合承担单位达373家。通过试点，将推动全国各地区高等院校精准对接产业发展需求，预计培养兼具专业素养和标准化知识技能的复合型人才近4万名，有效缓解重点产业领域急需人才短缺的局面。（央视新闻）", "ctime": 1776753034, "time_str": "14:30:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260421/c676149957.shtml"}, {"id": "4253661", "title": "大众汽车CEO：或再削减100万辆汽车产能", "content": "4月21日，据报道，大众汽车首席执行官Oliver Blume在接受采访时表示，该公司正在进一步考虑削减汽车产能，最多可达一百万辆，以最大限度地减少产能过剩并实现其成本目标。（界面新闻）", "ctime": 1776752898, "time_str": "14:28:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260421/c676149934.shtml"}, {"id": "4253657", "title": "上海每万人口高价值发明专利拥有量增长至65件", "content": "记者从4月21日举行的上海市新闻发布会上获悉，2020年以来，上海每万人口高价值发明专利拥有量从29.6件增长至65件，PCT国际专利申请量从3558件增至7446件，有效注册商标量从173.74万件增至293万件，作品版权年登记量从31.89万件增至46万件；全市专利许可转让次数从3.2万次增长至6.5万次，专利商标质押融资年登记金额从38.4亿元增长至402亿元；知识产权人才总量达到6万人。在世界知识产权组织（WIPO）《全球创新指数报告》“全球百强创新集群”排名中，“上海—苏州”集群名列前茅。（人民财讯）", "ctime": 1776752850, "time_str": "14:27:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260421/c676149921.shtml"}, {"id": "4253651", "title": "耐普矿机：将持续加大锻造衬板在国内外的推广力度", "content": "耐普矿机4月20日在业绩说明会上表示，2025年，公司锻造复合衬板在多家大型矿山企业成功应用均取得较好应用效果。2025年，锻造衬板合同签订额1.05亿元，实现了从0到1的突破。2026年，公司将加快在海外市场的推广步伐，通过参加海外大型矿业展，邀请多家大型外资矿企来公司考察交流等。锻造复合衬板是公司未来发展的重心，公司将持续加大锻造衬板在国内外的推广力度。（人民财讯）", "ctime": 1776752782, "time_str": "14:26:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260421/c676149905.shtml"}, {"id": "4253643", "title": "李力耘出任众擎机器人CTO", "content": "众擎机器人4月21日宣布，李力耘博士正式加入众擎机器人，出任首席技术官（CTO）。李力耘将全面统筹公司具身智能技术的全生命周期管理。据公司介绍，李力耘本科毕业于清华大学电子工程系，博士毕业于纽约大学计算机系。他曾任小鹏汽车副总裁，主导了自动驾驶团队“产品+技术”的AI化转型与组织升级。在此之前，他先后任职于LinkedIn美国总部、百度美国Apollo团队及京东JDX智慧物流实验室，担任技术架构师及高级专家等核心职位。（人民财讯）", "ctime": 1776752722, "time_str": "14:25:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260421/c676149889.shtml"}, {"id": "4253635", "title": "全国政协召开2026年第一季度宏观经济形势分析座谈会", "content": "20日，全国政协在京召开2026年第一季度宏观经济形势分析座谈会，全国政协副主席王勇出席会议。会议深入分析研判当前宏观经济形势，围绕巩固经济向好向新势头建言资政、凝聚共识。委员们建议，要紧紧围绕“十五五”时期经济社会发展的战略目标和重点任务，更好统筹国内国际两个大局，进一步增强宏观政策前瞻性协同性，实施更加积极的财政政策。稳定社会投资预期，优化产业投资布局，积极扩大有效投资。推动科技创新和产业创新深度融合，助力培育壮大新兴产业和未来产业，加快发展新质生产力。筑牢底线思维，坚持多元发展，进一步推进能源安全建设，保障国家产业链供应链安全稳定。聚焦保障粮食安全，补齐现代农业弱项短板，切实提升农业质量效益。（全国政协官微）", "ctime": 1776752545, "time_str": "14:22:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260421/c676149843.shtml"}, {"id": "4253629", "title": "中创新航成立科技新公司 含新能源汽车业务", "content": "企查查APP显示，近日，中创凯博科技（自贡）有限公司成立，注册资本1亿元，经营范围包含：电池制造；电池销售；新材料技术推广服务；汽车零部件及配件制造；新能源汽车整车销售等。企查查股权穿透显示，该公司由中创新航全资持股。（人民财讯）", "ctime": 1776752375, "time_str": "14:19:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260421/c676149811.shtml"}, {"id": "4253623", "title": "油费贵 韩国驾车族改乘地铁和公交车", "content": "受中东战事导致的油价上涨、机动车尾号限行等因素影响，韩国越来越多驾车族改乘地铁和公交车，以节省出行成本。韩国方面20日援引地铁部门数据消息称，首都首尔地铁1至8号线的客流统计显示，3月初至4月14日期间的周均客流量约6710万人次，较1月至2月均值增加约660万人次，增幅10.9%。不只是首都圈，其他城市也有通勤族放弃自驾，转而乘坐地铁和公交车。釜山一名金姓市民表示，她近期极少开车，“油价涨了，开自己的车或搭朋友的车都感觉有负担。我们就约在地铁站附近碰面”。（央视新闻）", "ctime": 1776752326, "time_str": "14:18:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260421/c676149798.shtml"}, {"id": "4253605", "title": "伊朗司法总监：美在阿曼海域对伊商船的行为构成“战争罪”", "content": "当地时间21日，伊朗司法总监埃杰伊表示，美国在阿曼海域针对伊朗商船采取的行动构成“战争罪”，并称伊方“必将对这些行为作出回应”。埃杰伊指出，美方所谓对伊朗港口和海岸实施“海上封锁”的行为，以及在阿曼海域对伊朗商船的“侵略行径”，违反停火协议，是“战争罪的典型例证”。此外，他还表示，美以方面重新发动袭击的可能性“并不小”，伊朗方面必须保持100%的战备状态。当日早前，伊朗外交部也发表声明谴责美军19日的袭击，并要求美国立即释放被扣押船只及船上人员。（央视新闻）", "ctime": 1776752121, "time_str": "14:15:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260421/c676149740.shtml"}, {"id": "4253599", "title": "蔚来成立新能源科技公司，含AI及集成电路芯片业务", "content": "企查查APP显示，近日，界首蔚来新能源科技有限公司成立，经营范围包含：集成电路芯片及产品制造；集成电路芯片设计及服务；汽车零部件研发；人工智能应用软件开发等。企查查股权穿透显示，该公司由蔚来控股有限公司间接全资持股。（人民财讯）", "ctime": 1776752100, "time_str": "14:15:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260421/c676149736.shtml"}, {"id": "4253597", "title": "南向资金净买入超30亿港元", "content": "据同花顺iFinD数据，截至目前，南向资金净买入超30亿港元，其中港股通（沪）买入超31.94亿港元，港股通（深）卖出超1.57亿港元。", "ctime": 1776752077, "time_str": "14:14:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260421/c676149726.shtml"}, {"id": "4253595", "title": "上海：加快千帆星座建设 推动卫星互联网业务商用试点", "content": "上海市人民政府办公厅印发《国家数字经济创新发展试验区（上海）实施方案》。其中提到，加快立体感知物联设施建设。加快千帆星座建设，推动卫星互联网业务商用试点。开展卫星物联网业务商用试验。支持整合船舶航运公共数据和商业数据资源，赋能市场化船舶数据服务平台，推动船舶数据在更多场景应用。推动上海市低空智能网联系统等综合性基础设施建设及标准完善，构建民用无人驾驶航空器物联感知体系。", "ctime": 1776752028, "time_str": "14:13:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260421/c676149713.shtml"}, {"id": "4253593", "title": "上海国资、珠海华发集团等新设沪粤合创创投基金", "content": "企查查APP显示，近日，上海沪粤合创创业投资基金合伙企业（有限合伙）成立，出资额3.02亿元，经营范围包含：创业投资（限投资未上市企业）。企查查股权穿透显示，该企业由上海吉六零私募基金管理有限公司、珠海华发集团有限公司旗下珠海华发科技产业集团有限公司等共同出资。（人民财讯）", "ctime": 1776752023, "time_str": "14:13:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": function updateMarketStatus() {

  const now = new Date();

  const bjMin = now.getUTCMinutes();

  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;

    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
