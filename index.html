": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260831/c679451832.shtml"}, {"id": "5067637", "title": "北京：落实跨境服务贸易负面清单", "content": "北京市商务局关于印发《北京市“十五五”时期高水平开放型经济发展规划》的通知。其中指出，落实跨境服务贸易负面清单。积极扩大计算机信息服务、商业服务等优势生产性服务出口，鼓励服务外包企业向研发设计、整体解决方案等高端领域转型升级。扩大绿色节能技术和服务出口。促进医疗旅行服务出口，开展中医药服务消费和贸易融合发展试点。落实《鼓励进口服务目录》。鼓励节能降碳、环境保护、生态治理等方面技术和服务进口。高水平建设国家服务贸易创新发展示范区。深化国家特色服务出口基地建设。全面推进北京国际商事仲裁中心、北京国际法商融合示范区建设。扩大留学教育市场。用好服务贸易相关领域目标企业清单，培育壮大服务贸易企业。", "ctime": 1788168439, "time_str": "17:27:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260831/c679451596.shtml"}, {"id": "5067631", "title": "中公教育等成立科技公司 含AI及智能机器人业务", "content": "企查查APP显示，近日，深圳朗润致远科技有限公司成立，法定代表人为陈妹玲，经营范围包含：人工智能硬件销售；人工智能公共数据平台；人工智能通用应用系统；智能机器人销售；智能机器人的研发等。企查查股权穿透显示，该公司由深圳北深朗润科技发展有限公司、中公教育全资子公司北京中公致远科技有限公司共同持股。", "ctime": 1788168357, "time_str": "17:25:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260831/c679451540.shtml"}, {"id": "5067627", "title": "北京：着力建设以科技创新、服务业开放、数字经济为主要特征的自由贸易试验区，打造具有北京辨识度的“创新、数智、绿色、便利、协同”自贸品牌，构建京津冀协同发展的高水平开放平台", "content": "北京市商务局关于印发《北京市“十五五”时期高水平开放型经济发展规划》的通知。其中指出，深入实施自由贸易试验区提升行动。完善以贸易、投资、资金流动、交通运输、人员往来自由便利和数据安全有序流动为重点的自由贸易试验区政策体系，开展更大力度高水平开放试验，提升创新引领发展能级。着力建设以科技创新、服务业开放、数字经济为主要特征的自由贸易试验区，打造具有北京辨识度的“创新、数智、绿色、便利、协同”自贸品牌，构建京津冀协同发展的高水平开放平台，形成一批可复制、可推广的首创性成果。", "ctime": 1788168234, "time_str": "17:23:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260831/c679451440.shtml"}, {"id": "5067615", "title": "北京市商务局：构建以“两区”为核心的高能级开放平台", "content": "北京市商务局印发《北京市“十五五”时期高水平开放型经济发展规划》的通知，其中提到：稳步扩大高水平开放，促进国内国际规则、规制、管理、标准相通相容，逐步构建与国际高标准经贸规则相衔接的制度体系和监管模式。推动国家服务业扩大开放综合示范区建设方案迭代升级。主动对接我国加入《全面与进步跨太平洋伙伴关系协定》（CPTPP）、《数字经济伙伴关系协定》（DEPA）进程，持续推进重点领域改革。扎实开展世界贸易组织《电子商务协定》试行工作，做好规则落地经验积累。促进国际科技交流合作，支持构建开放协同的创新生态环境。对标国际先进水平提升临床试验效率，促进研发创新、生产制造和成果转化。", "ctime": 1788168177, "time_str": "17:22:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260831/c679451373.shtml"}, {"id": "5067601", "title": "北京：到2035年，北京在服务国家对外开放新格局中走在前列，参与国际经贸规则治理能力大幅提升，更高水平开放型经济新优势进一步增强", "content": "北京市商务局关于印发《北京市“十五五”时期高水平开放型经济发展规划》的通知。其中指出，到2030年，国家服务业扩大开放综合示范区、中国（北京）自由贸易试验区（以下简称“两区”）和中国国际服务贸易交易会、中关村论坛、金融街论坛、北京文化论坛（以下简称“四平台”）促开放作用进一步增强，重点领域开放和关键环节改革取得更大突破，加快建设更高水平开放型经济新体制，加速形成全球数字经济示范引领地、全球医药健康创新策源地、国际现代服务产业集聚地、双向互促的开放高地。到2035年，北京在服务国家对外开放新格局中走在前列，参与国际经贸规则治理能力大幅提升，更高水平开放型经济新优势进一步增强。", "ctime": 1788168144, "time_str": "17:22:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260831/c679451348.shtml"}, {"id": "5067577", "title": "“Token贷”接续落地，算力数据何以成为信用资产", "content": "作为人工智能（AI）大模型处理信息的基本单位，词元（Token）正加速走进金融服务场景，一些银行将其作为授信参考指标之一。近段时间，多家银行的“Token贷”产品接续落地，为缺乏传统抵押物的轻资产科创企业打开了融资新空间。Token消耗量纳入授信参考指标近期，温州金酷网络科技有限公司凭借历史词元结算数据、算力采购合同、下游业务订单及自主知识产权等，从农业银行拿到20万元贷款，资金定向用于算力采购，满足企业资金周转之需。在数字经济浪潮下，算力已成为AI企业的核心生产要素，Token消耗量也快速攀升。国家数据局的数据显示，我国日均Token调用量在3月突破140万亿，为2年前的1000多倍。旺盛的算力需求背后，AI企业的融资难题日益凸显。近两年，不少银行为AI企业量身打造了“Token贷”等融资产品，将Token消耗量、算力服务合约、业务订单等数据纳入授信指标，突破了传统信贷依赖厂房、设备等实物抵押的风控惯性。多家受访银行表示，不是“用了多少Token，就能贷多少钱”，还要结合算力合约、应收账款等数据多维交叉验证，并根据企业的经营、财务、征信等情况综合核定授信额度。（新华社）", "ctime": 1788168052, "time_str": "17:20:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260831/c679451297.shtml"}, {"id": "5067535", "title": "华为投资控股有限公司上半年营收4678亿元，净利润234.27亿元", "content": "华为投资控股有限公司上半年营收4678亿元，净利润234.27亿元。", "ctime": 1788167868, "time_str": "17:17:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260831/c679451093.shtml"}, {"id": "5067515", "title": "外交部：在尼灾区取得联系的中方人员已妥善转移安置", "content": "近日中国和尼泊尔边境吉隆－热索瓦口岸发生严重泥石流灾害。外交部发言人郭嘉昆31日在例行记者会上介绍救援涉外工作进展时表示，截至30日中午，在尼灾区取得联系的中方人员已全部得到妥善转移安置，处于安全状态。 郭嘉昆说，此次尼泊尔边境地区突发冰川崩塌引发严重泥石流灾害，造成中尼两国重大人员伤亡、失联。中方在紧急开展抢险自救的同时，第一时间向尼方伸出援手，支持尼方应急救灾。习近平主席向尼泊尔总统鲍德尔致慰问电。李强总理也已向尼方表达慰问。中共中央政治局会议指出，要对尼受灾地区提供紧急援助，开展国际救援合作。 郭嘉昆介绍，8月29日，王毅外长同尼泊尔外长希西尔通电话，表示中尼是山水相连、命运与共的共同体，面对灾情两国要坚定站在一起，携手应对，共克时艰，以实际行动诠释传统友谊。中国政府向尼方提供了紧急现汇援助和人道主义援助，首批50吨救灾物资已运抵加德满都。中方两批隧道救援专家组成的救援队已驰援尼灾区一线。 “我们同尼方分享灾区影像、卫星和水文数据等重要信息，包括上游堰塞湖预警信息，正积极协助滞留的尼公民尽快返尼。截至30日中午，在尼灾区取得联系的中方人员已全部得到妥善转移安置，处于安全状态。”郭嘉昆说。 他说，当前，中方正全力搜救国内外失联人员，并与外国驻华使馆保持密切沟通，共同做好外籍失联人员摸排和善后处置等工作。(新华社)", "ctime": 1788167693, "time_str": "17:14:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260831/c679450929.shtml"}, {"id": "5067481", "title": "中国人保总裁赵鹏：研究优化新准则下的分红政策 推动股息率长期保持在行业合理水平", "content": "在中国人保2026中期业绩发布会上，中国人保总裁赵鹏表示，暂未考虑使用营运利润等替代性指标作为分红的基础，在考虑分红问题上，一方面是怎样能保持公司业绩，特别是盈利的持续稳定增长，另一方面是怎样提供长期稳定增长的分红。赵鹏称，人保将在对标同业实践的基础上，坚持每股分红长期稳定增长核心策略。同时，也将积极研究优化新准则下的分红政策，推动公司股息率长期保持在行业合理水平。（财联社）", "ctime": 1788167516, "time_str": "17:11:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260831/c679450781.shtml"}, {"id": "5067469", "title": "比亚迪与帕西尼签署战略合作协议 共拓工业制造机器人新场景", "content": "据比亚迪消息，8月25日，比亚迪与触觉感知与人形机器人企业帕西尼感知科技（PaXini Tech）在比亚迪全球总部正式签署战略合作协议。双方将依托各自优势，在数据采集与机器人领域深度协同，推动机器人业务在工业制造场景实现实质性突破。", "ctime": 1788167319, "time_str": "17:08:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260831/c679450616.shtml"}, {"id": "5067433", "title": "花旗：腾讯控股Hy4 Preview模型早于预期发布 重申“买入”评级", "content": "花旗发布研报称，重申腾讯控股\"买入\"评级，目标价765港元。腾讯Hy4 Preview模型于上周五(28日)发布，略早于该行原先预期的9月。虽然其总参数量7,700亿及激活参数量490亿看似小于多个同业模型，但仍较Hy3模型的2,950亿及210亿增加一倍以上，并在编程及智能基准测试中录得明显排名提升。", "ctime": 1788167119, "time_str": "17:05:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260831/c679450482.shtml"}, {"id": "5067355", "title": "商务部等7部门：大力发展农村电商 加快补齐农产品冷链快递物流短板", "content": "商务部等7部门发布关于推动商品消费扩容升级的实施意见。意见提出，加强绿色优质农产品生产供应。鼓励食品生产企业应用食品数字标签，提升消费者阅读食品标签体验感。加强农产品产销对接，大力发展农村电商，加快补齐农产品冷链快递物流短板。建立农产品分等分级包装标识制度。加强粮油肉蛋奶果蔬等生活必需品市场监测，保障市场供应。", "ctime": 1788166790, "time_str": "16:59:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260831/c679449918.shtml"}, {"id": "5067335", "title": "淮河能源：淮沪煤电获丁集煤矿深部资源8.88亿吨", "content": "淮河能源公告，公司控股子公司淮沪煤电有限公司近期与安徽省自然资源厅签订《采矿权出让合同》，一次性缴清全部成交价款2869.95万元，已取得不动产权证书（采矿权）及采矿许可证，依法获得丁集煤矿深部资源开采权及相应权益。本次资源保有资源量为8.88亿吨。", "ctime": 1788166729, "time_str": "16:58:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260831/c679449864.shtml"}, {"id": "5067331", "title": "水利部：尼泊尔错坚河冲击坑周边冰川仍有崩落可能", "content": "记者从水利部了解到，根据8月31日5时14分SAR影像分析，尼泊尔错坚河冲击坑水体外边界面积约8.3万平方米，较30日19时减小1.4万平方米，蓄水量约65万立方米。其下游2.5公里范围内存在3处小面积积水区域，均与水流通道连通呈过流状态。尼泊尔错坚河冲击坑周边冰川仍有崩落可能，存在重大风险隐患。8月31日上午无人机视频显示，原普热普强藏布堰塞湖下游3公里范围内左右两岸有多处大小不一的滑坡体，目前呈河道过流状态，存在滑坡体垮塌形成新堰塞湖的风险。（央视新闻）", "ctime": 1788166704, "time_str": "16:58:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260831/c679449844.shtml"}, {"id": "5067325", "title": "伊朗总统：不寻求战争但也绝不任由敌人侵略", "content": "当地时间8月31日，伊朗总统佩泽希齐扬称，伊朗不寻求战争，但面对侵略也绝不会坐视不理，必将予以坚决回应。佩泽希齐扬指出，中东地区的不稳定将影响所有人，不符合任何国家的利益。当地时间8月30日晚，美军袭击伊朗南部拉腊克岛，据称造成伊朗伊斯兰革命卫队人员及平民死伤。当地时间8月31日，伊朗伊斯兰革命卫队向约旦的美军目标发动导弹和无人机打击。伊朗军队还称对阿联酋的美军目标发射了数十架无人机。（央视新闻）", "ctime": 1788166653, "time_str": "16:57:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260831/c679449794.shtml"}, {"id": "5067317", "title": "商务部： 健全城乡消费载体", "content": "商务部等7部门发布关于推动商品消费扩容升级的实施意见，意见指出：深化国际消费中心城市培育建设，深入推进国际化消费环境建设，有序推进全国示范步行街（商圈）创建。优化离境退税商店、免税店布局。分类施策支持流通基础设施建设更新、消费场景创新和流通企业技术革新，推动品 // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
