ode": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260706/c677970125.shtml"}, {"id": "4656293", "title": "华为Mate90系列有望搭载基于韬定律的新麒麟芯片", "content": "从知情人士处获悉，将于今年秋季发布的华为Mate90系列，计划搭载基于韬定律的新麒麟芯片。华为于今年5月发表了指导半导体产业发展的新原则——韬(τ)定律，其目标是以系统性降低时间常数τ为核心，通过逻辑折叠等技术，持续压缩芯片内部的信号传播时延，从而不断提升晶体管密度，实现半导体与电子系统的持续演进。而将于2026年秋季面世的麒麟芯片，率先采用了逻辑折叠技术，性能大幅提升。（科创板日报）", "ctime": 1783314785, "time_str": "13:13:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260706/c677970095.shtml"}, {"id": "4656291", "title": "白色家电板块局部震荡走高，星帅尔触及涨停", "content": "白色家电板块局部震荡走高，星帅尔触及涨停，长虹美菱、美的集团、康盛股份、惠而浦、格力电器跟涨。", "ctime": 1783314671, "time_str": "13:11:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260706/c677970073.shtml"}, {"id": "4656289", "title": "检验检测机构超5300家 一组数据看我国特种设备“硬实力”", "content": "记者今天了解到，市场监管总局指导，中国特种设备检测研究院编制的《特种设备检验检测行业发展蓝皮书（2021—2025）》近日发布。特种设备包括锅炉、压力容器（含气瓶）、压力管道、电梯、起重机械、客运索道、大型游乐设施和场（厂）内专用机动车辆等八大类设备。截至2025年年底，全国特种设备总量达2441.69万台，比2024年底上升6.43%，另有气瓶3.15亿只、压力管道129.46万公里（在册）。电梯以1231.59万台占据特种设备总量的50.4%，成为推动总量增长的首要因素。场（厂）内专用机动车辆达254.24万台。我国已成为特种设备世界第一生产大国和使用大国。数据显示，全国特种设备检验检测机构从2021年的4585家增长至2025年的5341家，年均增长率为4.8%。从业人员约20.45万人，其中检验人员持证12.73万张，从业人员数量趋于稳定。《特种设备检验检测行业发展蓝皮书（2021—2025）》研判，未来特种设备检验技术层面，正从人工经验转向智能装备与数据驱动，机器人、大数据、人工智能及新无损检测技术加速应用，推动行业范式重塑。（央视新闻）", "ctime": 1783314665, "time_str": "13:11:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260706/c677970069.shtml"}, {"id": "4656271", "title": "房地产板块局部拉升，京能置业涨停", "content": "房地产板块局部拉升，京能置业涨停，万通发展此前封板，首开股份、中洲控股、上海临港、中国国贸、阳光股份跟涨。相关ETF方面，房地产ETF华夏（515060）成交额2659.16万元。", "ctime": 1783314461, "time_str": "13:07:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260706/c677970047.shtml"}, {"id": "4656269", "title": "全球规模最大3D打印制造中心将落地深圳", "content": "深圳市光明区两宗产业用地集中成交。其中，位于玉塘街道的A609-0275宗地由深圳竹鹤科技有限公司以1.41亿元竞得。该宗地土地面积83590.87平方米，总建筑面积37.62万平方米，土地用途为普通工业用地，拟建“3D打印智造总部基地项目”。3月，光明区商务局发布《关于3D打印智造总部基地项目遴选方案的公示》，将深圳竹鹤科技列为意向用地单位。根据遴选方案，3D打印智造总部基地项目总用地面积约8.37万平方米（约合125亩），计容建筑面积约37.3万平方米，规划建设高标准生产厂房、配套办公及生活设施，其中生产厂房占比达75.3%，重点布局3D打印核心零部件研发生产、打印材料试产及整机制造，计划年产能超300万台3D打印机，有望成为全球规模最大的3D打印制造中心之一。（深圳发布）", "ctime": 1783314452, "time_str": "13:07:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260706/c677970044.shtml"}, {"id": "4656261", "title": "乌克兰称首都基辅遭袭已致9死", "content": "当地时间6日，乌克兰基辅市军政管理局负责人特卡琴科通报称，俄方袭击已造成9人死亡，46人受伤。此前，乌克兰首都基辅响起多次爆炸声。基辅市军事管理局局长特卡琴科在社交媒体发文称，俄军正在向基辅发射弹道导弹。（央视新闻）", "ctime": 1783314294, "time_str": "13:04:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260706/c677970020.shtml"}, {"id": "4656259", "title": "台风致广西多地供电受影响 正加紧抢修复电", "content": "受台风“美莎克”影响，广西近日出现强降雨，部分地区城市内涝。其中，防城港、钦州等地受灾严重，供电受到影响。记者从南方电网了解到，目前已启动防风防汛Ⅲ级应急响应。今早，随着局部地区雨势减缓，供电人员对具备条件的地区开展检修和抢修作业，为防城区人民医院、防城港市中医院等接入应急电源，在居民小区开展排涝工作。防城港供电局已累计投入抢修人员1123名，抢抓潮汐涨落间隙，启用龙吸水设备开展6个受淹小区排涝作业。（央视新闻）", "ctime": 1783314287, "time_str": "13:04:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260706/c677970019.shtml"}, {"id": "4656221", "title": "中国海军成功组织潜射战略导弹试射", "content": "7月6日12时01分，中国人民解放军海军1艘战略核潜艇向太平洋相关公海海域，成功发射1发携载训练模拟弹头的潜射战略导弹，准确落入预定海域。此次导弹试射是中方年度军事训练的例行性安排，已事先向有关国家作了通报，符合国际法和国际惯例，不针对任何特定国家和目标。（新华社）", "ctime": 1783314050, "time_str": "13:00:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260706/c677969992.shtml"}, {"id": "4656219", "title": "净利预增近10倍后跌停 杭电股份回应：股价波动系市场行为，公司生产经营正常", "content": "上周发布业绩利好的杭电股份快速跌停，截至午间收盘仍封死跌停板，报44.1元/股，总市值为305亿元。针对二级市场的表现，记者以投资者身份致电杭电股份，公司接线工作人员表示：“目前公司生产经营正常，客户合作稳定，你看到公司业绩也是蛮好的。（股价波动）这是市场行为，可能一些投资者觉得公司要做得更好或者其他原因。”（财联社）", "ctime": 1783314046, "time_str": "13:00:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260706/c677969991.shtml"}, {"id": "4656191", "title": "菲副总统弹劾审判启动前又一参议员遭逮捕", "content": "菲律宾副总统莎拉·杜特尔特参议院弹劾审判启动前，当地媒体报道菲参议员罗丹特·马科莱塔6日上午遭逮捕，被指控涉嫌贪污腐败。 菲反贪法院第三分庭6日签发相关逮捕令。菲调查官办公室3日向反贪法院提起诉讼，指控马科莱塔在2025年竞选参议员时未申报7500万比索(约合822万元人民币)政治捐款。 日前，大批菲民众聚集在首都大马尼拉地区声援马科莱塔。当地警方说，参与人数高峰时约1.5万人。 据菲律宾媒体报道，马科莱塔被视为莎拉的盟友。马科莱塔此前表示，相关指控旨在阻止他参加参议院对莎拉的弹劾审判。该审判将于6日下午正式启动。 据悉，菲参议院24名参议员中，还有一名参议员6月初被捕，另有一人遭国际刑事法院通缉，目前行踪不明。据菲律宾媒体报道，这两人也是莎拉的盟友。 莎拉是前总统杜特尔特的长女，今年2月宣布参加2028年菲律宾总统选举。根据菲律宾宪法，在参议院弹劾审判中，如果三分之二及以上参议员支持弹劾，莎拉将被定罪免职，并终身不得担任公职。(新华社)", "ctime": 1783313960, "time_str": "12:59:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260706/c677969980.shtml"}, {"id": "4656187", "title": "意大利埃特纳火山喷发影响航班", "content": "意大利西西里岛东岸的埃特纳火山5日喷出大量火山灰，导致飞往岛上卡塔尼亚机场的航班运行受到干扰。意大利国家地球物理学与火山学研究所监测显示，埃特纳火山从5日清晨开始喷发火山灰，后续火山活动加剧，火山灰云升腾至距山顶约1500米的空中并随风向南飘散，而卡塔尼亚机场正好位于这一方位。卡塔尼亚机场方面5日说，受火山灰影响，部分空域临时关闭，管控持续至当地时间5日19时（北京时间6日1时）。机场规定，5日21时前，该机场每小时仅允许5架航班降落。（新华社）", "ctime": 1783313867, "time_str": "12:57:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260706/c677969975.shtml"}, {"id": "4656177", "title": "俄军确认对乌多地军事目标实施大规模打击", "content": "俄罗斯国防部6日通报称，当天凌晨，俄军使用空基、陆基、海基远程高精度武器和攻击型无人机发动大规模打击，击中基辅市和基辅州的军工企业和燃料能源设施，以及第聂伯罗彼得罗夫斯克州、波尔塔瓦州、切尔卡瑟州、切尔尼戈夫州和基辅州的军用机场基础设施。俄国防部称，此举是对乌方袭击俄民用基础设施的回应。（央视新闻）", "ctime": 1783313486, "time_str": "12:51:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260706/c677969926.shtml"}, {"id": "4656165", "title": "研究人员借助AI技术发现两种新型超导体", "content": "芬兰阿尔托大学参与的一个国际研究团队利用人工智能（AI）发现两种新型超导体，为更高效筛选和研发超导材料提供了新的技术路径。阿尔托大学近日发布新闻公报说，由于在特定条件下出现的量子效应，超导体能够以零电阻传输电流，在量子计算、神经系统成像、核聚变装置和磁悬浮交通等领域具有重要应用价值。据介绍，可能具有超导性的元素组合数量几乎无限，但真正具备超导性质的材料很少，对材料是否可行进行理论预测的计算量巨大。与此同时，目前已发现的超导材料大多需要在极低温条件下才能表现出超导性，冷却成本高、应用限制多。如何更快、更有针对性地寻找可在室温下工作的新型超导材料，是超导研究面临的关键挑战。（新华社）", "ctime": 1783313060, "time_str": "12:44:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260706/c677969813.shtml"}, {"id": "4656137", "title": "受台风影响 途经南广铁路相关列车临时停运", "content": "记者从国铁南宁局了解到，受台风“美莎克”影响，广西境内今天持续强降雨并伴有强对流天气，为确保旅客列车安全，途经南广铁路相关列车临时停运，请有出行计划的旅客及时关注铁路12306网站（12306手机App）及车站公告，第一时间掌握列车开行信息，合理安排出行。已购买相关停运列车车票的旅客，12306网站将在原车票乘车日之后5日内自动办理车票退票手续，自列车停运信息公布时起至车票乘车日期后30日以内办理退票手续，不收退票费。（央视新闻）", "ctime": 1783312481, "time_str": "12:34:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260706/c677969689.shtml"}, {"id": "4656123", "title": "现货黄金失守4160美元/盎司", "content": "现货黄金失守4160美元/盎司，日内跌0.35%。", "ctime": 1783312317, "time_str": "12:31:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260706/c677969666.shtml"}, {"id": "4656121", "title": "水利部：对广西的洪水防御Ⅲ级应急响应提升至Ⅱ级", "content": "记者刚刚从水利部获悉，根据《水利部水旱灾害防御应急响应工作规程》和汛情形势，水利部于今天11时将针对广西壮族自治区的洪水防御Ⅲ级应急响应提升至Ⅱ级，强化落实与响应等级匹配的各项防御措施。（央视新闻）", "ctime": 1783312313, "time_str": "12:31:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260706/c677969665.shtml"}, {"id": "4656103", "title": "中金岭南：截至目前，公司未布局高端PCB微钻钨棒相关业务", "content": "中金岭南7月6日在互动平台表示，根据已披露的公告内容（2025年年度报告），截至2025年底，公司国内所属矿山——万侯矿保有金属资源量钨1.65万吨，目前以资源保有为主。公司持有深圳市金洲精工科技股份有限公司25%股权，为其参股股东，不参与其日常生产经营决策。截至目前，公司未布局高端PCB微钻钨棒相关业务，公司相关的业务信息请以信息披露公告内容为准。（人民财讯）", "ctime": 1783312054, "time_str": "12:27:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "u // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
