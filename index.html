": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260429/c676372669.shtml"}, {"id": "4295131", "title": "港股午评：恒生指数涨1.23%，恒生科技指数涨1.07%", "content": "港股午间收盘，恒生指数涨1.23%，恒生科技指数涨1.07%。恒指港股通ETF银华（159318）涨1.2%，港股通科技ETF鹏华（159751）涨0.76%。板块方面，多品类零售、建筑材料板块涨幅靠前；生物科技、建筑产品板块跌幅靠前。个股方面，商米科技-W涨277.31%，龙蟠科技涨17.84%，剑桥科技涨14.03%，中创新航涨12.55%，瑞浦兰钧涨11.77%；泰格医药跌7.73%，天数智芯跌7.5%，群核科技跌6.56%，万洲国际跌6.43%，宝济药业-B跌6.39%。", "ctime": 1777435291, "time_str": "12:01:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260429/c676372555.shtml"}, {"id": "4295129", "title": "税务总局首次发布丹麦、爱尔兰、阿联酋全球最低税国别实施指引", "content": "4月29日，税务总局在重庆举办《全球最低税规则国别实施指引》发布活动，首次对外发布丹麦、爱尔兰、阿联酋三国《国别实施指引》，“税路通”跨境税收知识产品体系实现再升级。据了解，《国别实施指引》立足“走出去”企业视角，从立法背景、立法概况、重要条款和征管要求等几个维度，对全球最低税税收制度规定进行系统归纳梳理，形成便于理解、便于应用的知识产品，帮助企业更准确理解规则要点、更稳妥做好合规管理。同时，指引还提供立法文本的原文链接和OECD已发布的文件链接，供企业参考学习。“这是一套权威、系统、操作性强的本土化税务解决方案前瞻指引，为跨国企业全面评估投资环境、科学设计运营架构、系统筑牢合规防线提供了非常重要的参考依据，能够帮助我们深度掌握投资东道国的税务环境，让企业‘走出去’的步伐迈得更加稳健、更加自信。”中国电力建设股份有限公司海外事业部党工委委员、财务总监王红霞表示。税务总局国际税务司有关负责人表示，《国别实施指引》的发布，是“税路通”跨境税收服务品牌深化“一国一策”精细化服务的又一重大举措，也是税务部门主动回应“走出去”企业涉税服务诉求，提升跨境税收服务针对性和有效性的实际行动。税务部门将持续跟踪国别税制变化，动态更新指引，为企业走稳海外发展之路提供更加坚实的税务支撑。(国家税务总局)", "ctime": 1777435269, "time_str": "12:01:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260429/c676372549.shtml"}, {"id": "4295127", "title": "伊朗官员：美国试图以封锁逼迫伊朗的做法是徒劳的", "content": "据伊朗伊斯兰共和国通讯社29日报道，伊朗驻埃及开罗利益代表处负责人穆杰塔巴·菲尔多西普尔表示，美国试图以海上封锁迫使伊朗接受其单方面要求是徒劳的，伊朗可以利用与周边国家的陆地边界绕过封锁。菲尔多西普尔重申，伊朗有权掌控霍尔木兹海峡的安全。(新华社)", "ctime": 1777435019, "time_str": "11:56:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260429/c676372375.shtml"}, {"id": "4295125", "title": "4月29日午间公告一览：冰轮环境荣获“全国五一劳动奖状”", "content": "冰轮环境公告，2026年4月28日，为表彰激励先进典型，凝聚起团结奋进的强大力量，中华全国总工会发布了《关于表彰2026年全国五一劳动奖的决定》，授予379个单位“全国五一劳动奖状”，冰轮环境技术股份有限公司荣获“全国五一劳动奖状”。", "ctime": 1777434909, "time_str": "11:55:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260429/c676372338.shtml"}, {"id": "4295123", "title": "阿根廷与美国举行海军联合军事演习", "content": "阿根廷国防部28日说，阿根廷海军与美国海军正在南大西洋举行联合军事演习。演习在阿根廷专属经济区内展开，多艘阿根廷海军舰艇与美国海军“尼米兹”号航空母舰和“格里德利”号驱逐舰进行了海上搜救、防御和攻击等课目演习。（新华社）", "ctime": 1777434632, "time_str": "11:50:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260429/c676372259.shtml"}, {"id": "4295121", "title": "澳大利亚将担任第四届链博会主宾国", "content": "今天上午，中国贸促会举办新闻发布会，对外公布了第四届中国国际供应链促进博览会筹备情况的最新进展。发言人介绍，近日，澳大利亚政府正式确认，将担任第四届链博会主宾国，这是澳大利亚首次以官方国家级身份正式参与链博会，将由澳大利亚贸易投资委员会牵头组织设立澳大利亚国家馆和组织相关活动。中国贸促会新闻发言人王冠男表示：目前，第四届链博会各项筹备工作进展顺利。截至目前，已在境内外举办61场路演推介活动，相关国际组织、外国政商界嘉宾和专业观众，以及广大中外企业参展参会情况超出预期。（央视新闻）", "ctime": 1777434614, "time_str": "11:50:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260429/c676372255.shtml"}, {"id": "4295119", "title": "中铁特货：董事长于永利因工作调整辞职", "content": "中铁特货公告，公司董事会于2026年4月29日收到于永利先生提交的书面辞呈。于永利先生因工作调整原因请求辞去公司董事、董事长、董事会战略委员会委员及主任（召集人）职务。辞去上述职务后，于永利先生不再担任公司及控股子公司任何职务。根据《中华人民共和国公司法》《中铁特货物流股份有限公司章程》的相关规定，于永利先生的辞呈自送达公司董事会时生效。按照公司章程规定，由副董事长顾光明先生代为履行董事长职务。公司将尽快完成新董事长补选工作。", "ctime": 1777434425, "time_str": "11:47:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260429/c676372208.shtml"}, {"id": "4295117", "title": "台积电清仓ARM股份", "content": "台积电表示，旗下子公司台积电合作伙伴有限公司已出售111万股ARM股票，交易总额2.31亿美元。本次股票出售交易时段为4月28日至29日。交易完成后，台积电不再持有任何ARM股份。", "ctime": 1777434407, "time_str": "11:46:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260429/c676372199.shtml"}, {"id": "4295109", "title": "2025年我国系统软件、人工智能产生的数据量首超物联感知数据量", "content": "国家数据局局长刘烈宏在4月29日于福建福州开幕的第九届数字中国建设峰会上表示，2025年我国系统软件、人工智能产生的数据量达26.92泽字节，首次超过传统占主体地位的物联感知数据量。（新华社）", "ctime": 1777434080, "time_str": "11:41:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260429/c676372104.shtml"}, {"id": "4295103", "title": "天津：到2030年文商旅体展及相关产业增加值占地区生产总值比重显著提升", "content": "天津市商务局发布关于公开征求《天津市文商旅体展融合发展“十五五”规划（征求意见稿）》意见的公告。目标到2030年，全市文商旅体展及相关产业增加值占地区生产总值比重显著提升，社会消费品零售总额达到5000亿元，服务零售额增速进入全国前列，住餐营业额总量提升至450亿元，体育服务业总规模达600亿元，年举办展会规模力争突破500万平方米，文化旅游规上企业营业收入力争突破400亿元，旅游花费实现稳步增长，产业综合竞争力与经济增长贡献率持续增强。（人民财讯）", "ctime": 1777434063, "time_str": "11:41:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260429/c676372101.shtml"}, {"id": "4295101", "title": "滴滴数据：“五一”假期打车需求预计较节前上涨23%，异地打车上涨56%", "content": "4月29日，滴滴出行预测，整个“五一”假期，打车需求预计较节前上涨23%，异地打滴滴需求预计较节前上涨56%，前往大型枢纽的打车需求预计较节前上涨63%。其中，需求量级靠前的城市为北京、上海、广州、成都、重庆等大型城市，太原、长沙、洛阳、南昌等地预计同比增幅靠前。（人民财讯）", "ctime": 1777434049, "time_str": "11:40:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260429/c676372100.shtml"}, {"id": "4295087", "title": "港股百度集团短线跳水跌超1%", "content": "港股百度集团短线跳水跌超1%，报121.8港元。", "ctime": 1777433727, "time_str": "11:35:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260429/c676371984.shtml"}, {"id": "4295077", "title": "ETF两市成交额2959.20亿元", "content": "截至目前，ETF两市成交额报2959.20亿元，分类型来看，股票型ETF成交额940.9亿元，债券型ETF成交额1420.30亿元，货币型ETF成交额204.07亿元，商品型ETF成交额49.66亿元，QDII型ETF成交额217.57亿元。其中，成交额最高的非货币型ETF分别是中证500ETF（510500）A500ETF（563360）中证A500ETF（159338）成交额分别为45.30亿元44.39亿元39.30亿元", "ctime": 1777433553, "time_str": "11:32:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260429/c676371814.shtml"}, {"id": "4295073", "title": "ETF午评：稀土ETF领涨5.19%，生物医药ETF领跌1.84%", "content": "ETF午间收盘涨跌不一，稀土ETF（159715）领涨5.19%，稀土ETF（516780）涨4.91%，稀土ETF（516150）涨4.80%，生物医药ETF（159508）领跌1.84%，生物医药ETF（159839）跌1.65%，生物医药ETF（159859）跌1.53%。", "ctime": 1777433514, "time_str": "11:31:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260429/c676371801.shtml"}, {"id": "4295071", "title": "2月份全球经贸摩擦措施涉及金额同比下降2.4%", "content": "今天上午，中国贸促会举办新闻发布会，发布最新一期全球经贸摩擦指数，数据显示，今年2月份，全球经贸摩擦指数同比略有下降。从综合指数看，2026年2月份全球经贸摩擦指数为103，处于高位。全球经贸摩擦措施涉及金额同比下降2.4%，环比上升8.2%。从国别指数看，在监测范围内的20个国家（地区）中，美国、印度和巴西的全球经贸摩擦指数位居前三。中国贸促会新闻发言人 王冠男：美国的全球经贸摩擦措施涉及金额最多，尤其是在美国最高法院判定美国政府依据《国际紧急经济权力法》对相关贸易伙伴加征“对等关税”、芬太尼关税等违法后，美国政府援引《1974年贸易法》第一百二十二条对大部分美国进口商品加征10%关税，美国新一轮关税措施对全球贸易带来更多不确定性。从行业指数看，在监测范围内13个主要行业中，经贸摩擦措施的冲突点聚焦于电子、化工和机械设备行业，其中电子行业经贸摩擦指数居首。（央视新闻）", "ctime": 1777433503, "time_str": "11:31:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260429/c676371800.shtml"}, {"id": "4295069", "title": "A股午评：创业板指半日涨2.27%，稀土永磁、电池储能板块集体爆发", "content": "A股三大指数早盘集体上涨，截至午盘，上证指数涨0.4%，深证成指涨1.58%，创业板指涨2.27%，北证50涨0.95%。全市场成交额16330亿元，较上日成交额缩量371亿元，全市场超4000只个股上涨。板块题材上，能源金属、稀土永磁、电池、光伏设备、猪肉、游戏、文化传媒、磷化工、食品加工制造板块涨幅居前；电子化学品、银行、减肥药、军工电子、半导体、证券板块表现相对落后。盘面上，稀土龙头一季报营利双增推动板块走高，中国稀土、北方稀土双双涨停。电池产业链盘中活跃，德方纳米20cm涨停，上游锂矿永兴材料同样封板，市场对储能方向保持乐观。食品股同样表现出色，西麦食品、黑芝麻多股收获涨停，驱动因素源于业绩支撑。此外，CPO、旅游及酒店、猪肉等多个板块异动。另一方面，近期强势的半导体板块稍作调整，华虹公司、海光信息、摩尔线程等股下挫。电子化学品、工业气体方向同样回调，华特气体、金宏气体有所下跌。", "ctime": 1777433444, "time_str": "11:30:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260429/c676371789.shtml"}, {"id": "4295067", "title": "国内多家金店金饰价格集体下跌，最高报1415元/克", "content": "据同花顺iFinD数据，今日国内黄金饰品价格对比显示，黄金珠宝品牌公布的境内足金首饰价格较昨日集体下跌，最高报1415元/克。", "ctime": 1777433430, "time_str": "11:30:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260429/c676371783.shtml"}, {"id": "4295065", "title": "腾讯ima发布知识Agent“copilot”", "content": "腾讯ima推出知识Agent——copilot，支持用户创建专属Agent。据了解，copilot内置记忆系统，通过copilot设定、用户档案、长期记忆、经验技巧四大模块，记住用户的背景、习惯与推进事项，实现跨场景连续调用，减少重复输入。此外，技能生态同步上线，copilot内置官方技能包，并支持按需加载扩展Skills。（科创板日报）", "ctime": 1777433363, "time_str": "11:29:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260429/c676371739.shtml"}, {"id": "4295063", "title": "宇树科技全国首家直营店开业", "content": "4月29日，宇树科技宣布，其位于王府井银泰的全国首家直营店开业。", "ctime": 1777433275, "time_str": "11:27:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260429/c676371696.shtml"}, {"id": "4295053", "title": "中国加入《数字经济伙伴关系协定》工作组举行第十次首席谈判代表会议", "content": "4月27—28日，中国加入《数字经济伙伴关系协定》（DEPA）工作组第十次首席谈判代表会议在韩国首尔举行。中方同智利、新西兰、新加坡、韩国等DEPA成员就中国加入谈判进程深入交换意见，并就相关议题进行详细讨论。（商务部）", "ctime": 1777433148, "time_str": "11:25:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260429/c676371662.shtml"}, {"id": "4295051", "title": "宜家北京首家小型商场将于4月30日在通州开业", "content": "宜家4月29日宣布，其位于北京的宜家北京通州商场将于4月30日正式开业。宜家称，近年来，宜家在北京与深圳相继推出设计订购中心及小型门店，以回应消费者对便利性、效率以及灵感获取方式的变化。宜家北京通州商场位于湾里·王府井商业区，面积约1500平方米。未来，宜家还计划在朝阳区开设全新小型商场。", "ctime": 1777433112, "time_str": "11:25:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260429/c676371641.shtml"}, {"id": "4295049", "title": "11部门联合印发意见，就推进互助性养老服务发展作安排部署", "content": "4月29日，民政部举行2026年第二季度例行新闻发布会，介绍民政部、国家发展改革委等11部门联合印发的《关于推进互助性养老服务发展的意见》有关情况。民政部养老服务司副司长张军会上表示，当前，我国60岁以上老年人口已达3.23亿。发展互助性养老服务，是实施积极应对人口老龄化国家战略的重要要求，是深化养老服务改革发展、构建适合我国国情养老服务体系的重要内容。张军介绍，《意见》提出，要深入贯彻党的二十大和二十届历次全会精神，弘扬守望相助、和衷共济中华民族优秀传统美德，倡导积极老龄观、健康老龄化理念，因地制宜、就近就便，大力推进互助性养老服务，融入城乡社区治理体系，探索机制化、可持续、形式多样的发展模式，逐步形成政府引导、基层群众性自治组织支持、老年人自愿互助、社会广泛参与的互助性养老服务发展格局，更好满足老年人多样化养老服务需求。（澎湃新闻）", "ctime": 1777433094, "time_str": "11:24:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260429/c676371637.shtml"}, {"id": "4295047", "title": "北极持续显著增暖 中国气象局发布2025年《极地气候变化年报》", "content": "今天上午，中国气象局举行5月新闻发布会，会上发布了2025年《极地气候变化年报》，这是连续第4年发布该年报。监测分析显示，2025年北极年平均海冰范围刷新1979年有卫星观测以来最低纪录，年度最大海冰范围创47年来新低，是本年度极地气候监测中最值得关注的信号之一。整体来看，2025年极地气候状况呈现出北极持续显著增暖、南北极海冰继续处于低位、南北极臭氧变化明显分化、极端天气气候事件异常性增强等特点。（央视新闻）", "ctime": 1777433022, "time_str": "11:23:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260429/c676371598.shtml"}, {"id": "4295045", "title": "中国多式联运发展联盟今日成立", "content": "4月29日上午，由国铁集团牵头，会同中国远洋海运集团有限公司、招商局集团有限公司、中国物流集团有限公司、中国数联物流信息有限公司等4家物流领域骨干央企共同发起的中国多式联运发展联盟在北京成立。联盟将合力共建铁水联运、铁公联运、技术创新3个协作平台和95306国家多式联运服务热线，推动多式联运高质量发展，联盟门户网站同步上线。（央视新闻）", "ctime": 1777432987, "time_str": "11:23:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260429/c676371580.shtml"}, {"id": "4295035", "title": "工业和信息化部批准《人工智能 深度合成图像系统技术规范》等690项行业标准", "content": "工业和信息化部批准《人工智能 深度合成图像系统技术规范》等690项行业标准。其中，化工行业56项、石化行业11项、黑色冶金行业81项、有色金属行业61项、黄金行业4项、建材行业61项、稀土行业9项、机械行业120项、汽车行业46项、轻工行业4项、纺织行业92项、兵工民品行业1项、电子行业35项、通信行业109项。批准《电信网和互联网网络安全防护定级备案实施指南》1项通信行业标准修改单。批准《粉末冶金用再生钴粉》等28项行业标准外文版。其中，有色金属行业2项、稀土行业1项、通信行业25项。行业标准修改单自发布之日起实施。", "ctime": 1777432788, "time_str": "11:19:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260429/c676371504.shtml"}, {"id": "4295031", "title": "美参议院否决旨在限制特朗普对古巴动武议案", "content": "美国国会参议院28日在程序性投票中否决民主党提出的一项限制总统战争权力的议案，该议案旨在阻止总统特朗普在未经国会授权的情况下对古巴发起军事行动。参议院当天以51票对47票的投票结果，通过由共和党籍参议员里克·斯科特提出的一项“程序性异议”，阻止了由3名民主党参议员共同提出的限制总统战争权力的议案。投票几乎完全按照党派划分，2名共和党议员投票支持民主党议案，1名民主党议员投票反对。（新华社）", "ctime": 1777432751, "time_str": "11:19:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260429/c676371499.shtml"}, {"id": "4295025", "title": "宝马领悦与火山引擎签署谅解备忘录", "content": "4月29日，华晨宝马旗下全资子公司领悦数字信息技术有限公司与北京火山引擎科技有限公司宣布签署谅解备忘录，进一步深化双方在中国的合作，尤其在人工智能（AI）领域的探索。此次签约基于双方此前的合作基础，旨在助力宝马集团推进AI技术在客户端的应用，优化以客户为中心的数字生态系统。（宝马集团）", "ctime": 1777432679, "time_str": "11:17:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260429/c676371443.shtml"}, {"id": "4295023", "title": "10部门：将3-氯丙炔等5种化学品纳入《危险化学品目录（2015版）》", "content": "应急管理部等10部门发布公告，依照《危险化学品安全管理条例》有关规定，应急管理部会同工业和信息化部、公安部、生态环境部、交通运输部、农业农村部、国家卫生健康委、市场监管总局、国家铁路局、中国民航局决定，将3-氯丙炔、2-碘酰基苯甲酸、2-重氮乙酰乙酸对硝基苄酯、甲磺酰基叠氮、2-硝基-3-甲基苯甲酸等5种化学品纳入《危险化学品目录（2015版）》。应急管理部将配套补充完善《危险化学品分类信息表》。本公告自公布之日起施行。", "ctime": 1777432669, "time_str": "11:17:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260429/c676371429.shtml"}, {"id": "4295021", "title": "中国航发燃机双项目同日点火成功", "content": "4月28日，番禺项目燃机发电机组与乐东项目燃机压缩机组分别于株洲、沈阳试验点火成功。双项目同日告捷，标志着中国航发燃机在海上平台动力装备领域取得重大突破。（中国航发）", "ctime": 1777432660, "time_str": "11:17:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260429/c676371424.shtml"}, {"id": "4295017", "title": "民调：特朗普支持率降至第二个总统任期以来最低", "content": "路透社和益普索集团28日公布的一项民意调查显示，美国总统特朗普的支持率从上月的36%降至34%，为其开启第二个总统任期以来的最低水平。（新华社）", "ctime": 1777432634, "time_str": "11:17:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260429/c676371410.shtml"}, {"id": "4295015", "title": "国台办回应赖清德窜访遭拒：民进党自作自受、自讨没趣", "content": "4月29日，国台办举行例行新闻发布会。有记者就赖清德窜访遭拒提问。发言人陈斌华表示，一个中国原则是人心所向、大势所趋、大义所在。妄图在国际社会挑战一中原则，只会四处碰壁。赖清德当局妄图通过外窜，搞所谓“外交突破”遭到相关国家拒绝后，不但不思悔改，还公然歪曲事实，编造所谓“受害者叙事”，欺骗岛内民众。民进党自作自受，自讨没趣。（澎湃新闻）", "ctime": 1777432610, "time_str": "11:16:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260429/c676371400.shtml"}, {"id": "4295011", "title": "特朗普肖像将印上美国护照 外媒：鲜有国家这么干", "content": "美国国务院28日宣布，为纪念美国建国250周年，国务院将推出一批限量版护照，护照内将印有美国总统特朗普的肖像。根据国务院提供给媒体的图片，新护照内页将印有特朗普的肖像，肖像被《独立宣言》的文本和美国国旗环绕，下方是金色字体的特朗普签名。护照另一页将印有展示美国开国元勋签署《独立宣言》的著名画作。据法新社报道，在世界范围内鲜有国家在护照上展示现任领导人肖像。（新华社）", "ctime": 1777432594, "time_str": "11:16:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260429/c676371386.shtml"}, {"id": "4295009", "title": "马斯克出席OpenAI相关案庭审", "content": "当地时间4月28日，美国企业家马斯克在美国加州奥克兰联邦法院出席庭审，为其起诉OpenAI案件作证。作为OpenAI的原始联合创始人，马斯克于2024年对OpenAI首席执行官山姆·奥尔特曼、联合创始人格雷格·布罗克曼提起诉讼，同时将OpenAI最大投资方微软列为共同被告。马斯克的核心指控为奥尔特曼与布罗克曼违背公司创立初心。要求撤销OpenAI的营利化转型，罢免奥尔特曼、布罗克曼的相关职务，并追回不当获利。针对马斯克的指控，OpenAI与微软均予以否认。OpenAI表示，马斯克的诉讼毫无依据，指责其意图是在打压OpenAI、为自身旗下的xAI项目铺路，目的是扰乱庭审、重塑自身舆论形象。本案庭审预计将持续三周，奥尔特曼、布罗克曼以及微软首席执行官萨提亚·纳德拉也将出庭作证。（CCTV国际时讯）", "ctime": 1777432561, "time_str": "11:16:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260429/c676371377.shtml"}, {"id": "4294999", "title": "民政部：我国各项普惠性、基础性、兜底性民生建设稳步发展", "content": "记者今天从民政部了解到，截至3月底，全国城市低保平均标准每人每月835元，农村低保平均标准每人每月623元；困难残疾人生活补贴和重度残疾人护理补贴两项补贴制度，已惠及1199.8万困难残疾人和1682.6万重度残疾人，累计受理“跨省通办”申请3941人，“全程网办”申请29.3万人；困境儿童生活保障方面，截至3月底，全国集中养育孤儿、社会散居孤儿、事实无人抚养儿童基本生活保障标准分别达到每人每月2093.4元、1627.2元和1614.6元。一季度，我国持续规范地名命名更名，落实地名备案公告制度，截至目前共备案地名18.66万条。国家地名信息库截至目前共收录地名1526万条，为社会各界提供标准地名信息查询等服务。深化“乡村著名行动”，方便群众出行导航、快递进村、山货进城。（央视新闻）", "ctime": 1777432335, "time_str": "11:12:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260429/c676371264.shtml"}, {"id": "4294995", "title": "沪深300股指期货(IF)主力合约日内涨超1%", "content": "沪深300股指期货(IF)主力合约日内涨超1%，现报4746.6点。", "ctime": 1777432247, "time_str": "11:10:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260429/c676371212.shtml"}, {"id": "4294993", "title": "强对流天气影响广东 多地暴雨雷雨大风预警生效", "content": "广东省气象台消息，截至10时06分，广东珠海发布暴雨红色预警，江门台山发布暴雨橙色预警，湛江徐闻、清远、河源和平等20个市县发布暴雨黄色预警，雷州、遂溪、吴川、茂名、电白、台山雷雨大风橙色预警生效，廉江、高要、东源等25个市县雷雨大风黄色预警生效中。气象部门预计29日，珠三角中南部、河源、梅州、粤东市县有大雨局部暴雨，其余市县多云有阵雨，局部大雨。提醒民众，需警惕降水造成的路面湿滑、积水、低能见度变化对公路交通的不利影响。（央视新闻）", "ctime": 1777432239, "time_str": "11:10:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260429/c676371206.shtml"}, {"id": "4294989", "title": "沪深京三市成交额超1.5万亿元，较上日此时缩量609亿元", "content": "据同花顺iFinD数据，沪深京三市成交额超1.5万亿元，较上日此时缩量609亿元，预计全天成交金额约2.4万亿元。截至目前，沪市成交额6498亿元，深市成交额8397亿元，北证50成交额111亿元。", "ctime": 1777432186, "time_str": "11:09:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260429/c676371158.shtml"}, {"id": "4294985", "title": "地区冲突影响外溢 也门经济持续承压", "content": "美国与以色列对伊朗的军事行动，正对地区多国产生外溢影响。也门作为高度依赖进口与外部援助的国家，经济在多个层面遭受冲击。分析人士认为，本轮地区冲突对也门国内的能源、交通与贸易领域的冲击尤为突出。也门亚丁大学政治经济学教授穆罕默德·贾迈勒·舒艾比：自冲突爆发以来，也门的燃料和食品价格上涨，运输成本也随之上升，同时，由于国际保险公司提高了海运保险费用，海上风险上升，航运和保险成本也有所增加，而整体来看，也门经济本身已经接近十分脆弱的状态。（央视新闻）", "ctime": 1777432102, "time_str": "11:08:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260429/c676371118.shtml"}, {"id": "4294983", "title": "中国产权协会：我国产权市场累计交易额达121.72万亿元", "content": "中国企业国有产权交易机构协会29日发布的报告显示，“十四五”期间，我国产权市场累计交易额达121.72万亿元。其中，2025年市场交易额达26.3万亿元，再创历史新高。（新华财经）", "ctime": 1777432084, "time_str": "11:08:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260429/c676371115.shtml"}, {"id": "4294981", "title": "国台办回应两岸球员同场参与“闽超”：体育促进两岸同胞心灵契合", "content": "4月29日，国台办举行例行新闻发布会。有记者问：“福建省城市足球联赛”（“闽超”）近期正在火热举行，两岸球员同场参赛受到关注。请问对此有何评论？大陆方面未来会否依托福建对台区位优势，支持更多此类民间体育赛事和交流活动，为两岸青年搭建赛场交流、融洽感情的平台？发言人陈斌华表示，“闽超”今年开赛，人气火爆，揭幕战就吸引5.1万余名观众，创下福建省单场体育赛事现场观众人数纪录。赛事规则明确欢迎在闽工作生活的台胞加入各地的城市代表队。据了解，平潭代表队、啦啦队均有台胞加盟，使“闽超”成为具有两岸融合特色的赛事。通过体育赛事搭建交流平台，让两岸同胞在同场竞技中增进了解、互融共进，是福建立足对台独特优势持续推行的一项创新举措，彰显了体育在促进两岸同胞心灵契合、推动两岸融合发展示范区建设中的独特作用。2024年，福建就以“闽台联合组队”形式组建福建海鲨棒球队，参加大陆棒球联赛、全运会等赛事。下一步，福建将继续开展近百场两岸民间体育赛事和交流活动，为两岸青年搭建交流切磋、深化友谊的平台，欢迎广大台湾青年积极参加。（央视新闻）", "ctime": 1777432067, "time_str": "11:07:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260429/c676371100.shtml"}, {"id": "4294977", "title": "建滔积层板港股涨超8%", "content": "建滔积层板港股涨8.37%，报38.56港元。", "ctime": 1777432045, "time_str": "11:07:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260429/c676371096.shtml"}, {"id": "4294975", "title": "特斯拉称计划将FSD V14 Lite扩展到国际市场的HW3车辆", "content": "特斯拉在发布消息称，计划将 FSD V14 Lite 扩展到国际市场的 HW3 车辆，但前提是在美国市场推广完成后才会进行，而且没有给出具体时间表。特斯拉的帖子称：“继未来在美国面向HW3车辆推出FSD V14 Lite版本后，我们计划将V14 Lite扩展到更多国际市场。此次更新确保HW3车辆车主能够继续享受持续的软件更新。由于国际推广受多种因素影响（例如技术验证的完成、区域适配以及相关监管部门的批准），我们目前无法提供确切的日期，但会持续发布更新信息。”（新浪财经）", "ctime": 1777431981, "time_str": "11:06:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260429/c676371073.shtml"}, {"id": "4294959", "title": "创业板指涨幅扩大至2%，全市场超3900只个股上涨", "content": "创业板指涨幅扩大至2%，深成指涨1.3%，沪指涨0.15%。电池、CPO、稀有金属板块涨幅居前，全市场超3900只个股上涨。", "ctime": 1777431757, "time_str": "11:02:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260429/c676370907.shtml"}, {"id": "4294957", "title": "广东多地落地“气候贷”，累计授信已超1.4亿元", "content": "记者获悉，中国人民银行广东省分行协同广东省气象局，组织全省金融系统联合各地气象部门，创新推出“气候贷”产品谱系，将气象监测、气候风险评估等专业数据全面融入信贷服务全流程。截至目前，河源、茂名、肇庆、珠海等地金融机构先行落地“气候贷”，累计授信超1.4亿元，发放贷款逾8400万元。（界面新闻）", "ctime": 1777431647, "time_str": "11:00:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260429/c676370871.shtml"}, {"id": "4294953", "title": "国台办：买多少武器都改变不了“台独”必然败亡的结局", "content": "4月29日，国务院台办举行例行新闻发布会。有记者问：台防务部门近日称已与美国签署多项军购合约。请问发言人对此有何评论？发言人陈斌华表示，我们坚决反对美国与中国台湾地区开展任何形式的军事联系。民进党当局为谋取“台独”政治私利，甘当美国的“提款机”，乞求外部势力并不可靠的保护，只会让台湾陷入更加危险的境地，给台湾同胞带来深重灾难。正告民进党当局，祖国统一势不可挡，不管买多少武器，都改变不了“台独”必然败亡的结局。（央视新闻）", "ctime": 1777431609, "time_str": "11:00:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260429/c676370847.shtml"}, {"id": "4294949", "title": "腾讯ima发布全新Agent模式“copilot”", "content": "4月29日，腾讯ima发布全新Agent模式“copilot”，支持用户创建专属Agent。据介绍，copilot内置记忆系统，通过copilot设定、用户档案、长期记忆、经验技巧四大模块，记住用户的背景、习惯与推进事项，实现跨场景连续调用，减少重复输入。（腾讯云）", "ctime": 1777431519, "time_str": "10:58:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260429/c676370815.shtml"}];

  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
