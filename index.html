与旧日本军队相同的“大佐”等军衔，通过国家情报会议设置法案。请问对此有何评论？张晓刚：日方近期在军事安全领域危险、冒进和试探、挑衅动作频频，早已戳穿了其“和平国家”和“专守防卫”的自我标榜。不仅如此，日方图谋启用旧日本军队军阶用语，计划组建的国家情报机构更让人想到臭名昭著的“特高课”，严重伤害亚洲国家人民感情。日方在“再军事化”道路上狂飙突进，难道又要成为东亚“祸源”？所有爱好和平的人们都要对此高度警惕，坚决遏阻日本的倒行逆施，绝不能让其破坏和平、为祸世界。(央视新闻)", "ctime": 1777537094, "time_str": "16:18:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260430/c676420331.shtml"}, {"id": "4306175", "title": "SK海力士考虑最早于7月在美国上市", "content": "据报道，SK海力士考虑最早于7月在美国上市，在美国上市或将筹集超过100亿美元。（财联社）", "ctime": 1777536874, "time_str": "16:14:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260430/c676420207.shtml"}, {"id": "4306165", "title": "芬兰近25年气温上升速度翻倍", "content": "芬兰气象研究所4月29日发布新闻公报说，观测数据显示，过去25年间，芬兰气温上升速度增加了一倍多，而近10年来，芬兰气候变暖速度也高于全球平均水平。（央视新闻）", "ctime": 1777536755, "time_str": "16:12:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260430/c676420156.shtml"}, {"id": "4306155", "title": "港股收评：恒生指数跌1.28%，恒生科技指数跌0.79%", "content": "港股收盘，恒生指数跌1.28%，恒生科技指数跌0.79%。恒指港股通ETF银华（159318）跌0.82%，港股通科技ETF鹏华（159751）跌0.11%。板块方面，居家用品、燃气板块涨幅靠前；工业集团企业、汽车板块跌幅靠前。个股方面，天数智芯涨21.3%，海西新药涨9.21%，九方智投控股涨8.84%，壁仞科技涨8.22%，卧安机器人涨8.05%；长飞光纤光缆跌13.78%，怡俊集团控股跌13.34%，中国旭阳集团跌11.08%，三一国际跌10.9%，中创智领跌10.21%。", "ctime": 1777536614, "time_str": "16:10:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260430/c676420044.shtml"}, {"id": "4306119", "title": "Meta盘前跌7.00%，现报622.25美元", "content": "Meta盘前跌7.00%，现报622.25美元。消息面上，Meta上调全年资本支出指引并首次出现家庭应用日活环比下滑，引发市场对AI投资回报与用户增长的担忧。", "ctime": 1777536091, "time_str": "16:01:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260430/c676418339.shtml"}, {"id": "4306113", "title": "谷歌C盘前涨6.49%，现报369.85 ", "ctime": 1777535801, "time_str": "15:56:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260430/c676417867.shtml"}, {"id": "4306061", "title": "S佳通：因涉嫌信息披露违法违规，公司被立案", "content": "S佳通公告，公司于2026年4月30日收到中国证券监督管理委员会下发的《立案告知书》，因公司涉嫌信息披露违法违规，决定对公司立案。", "ctime": 1777535745, "time_str": "15:55:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260430/c676417850.shtml"}, {"id": "4306059", "title": "*ST椰岛：收到海南监管局行政监管措施决定书", "content": "*ST椰岛公告，公司于2026年4月30日收到中国证券监督管理委员会海南监管局出具的《关于对海南椰岛（集团）股份有限公司采取出具警示函措施的决定》。经查，发现公司存在以下问题：一是2020年至2021年期间，公司对部分实际未发货的交易确认销售收入，2020年、2021年年度报告相关财务信息披露不准确；二是2024年至2025年期间，公司与海南椰岛雨帆食品有限公司发生关联交易，但未按规定履行信息披露义务。", "ctime": 1777535739, "time_str": "15:55:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260430/c676417848.shtml"}, {"id": "4306051", "title": "中国人民解放军南部战区位中国黄岩岛领海领空及周边区域组织战备警巡", "content": "4月30日，中国人民解放军南部战区组织海空兵力位中国黄岩岛领海领空及周边海空域开展战备警巡。黄岩岛是中国固有领土。4月份以来，战区部队持续加强黄岩岛领海周边海空域巡逻警戒，有力有效应对各类侵权挑衅行径，坚决捍卫国家主权安全，坚定维护南海地区和平稳定。(新华社)", "ctime": 1777535617, "time_str": "15:53:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260430/c676417750.shtml"}, {"id": "4306043", "title": "美防长听证会上破防了", "content": "当地时间4月29日，美国国防部长赫格塞思出席国会听证会，与多位民主党籍众议员围绕美国对伊朗开战的相关问题唇枪舌剑。面对民主党议员的不断质问，赫格塞思拒绝正面回答，而是反过来指责他们“博眼球”或是“仇恨特朗普总统”。民主党籍联邦众议员罗·卡纳问赫格塞思对伊朗的战争将为普通美国家庭增加多少生活成本，赫格塞思则情绪激动，反问“你愿意付多少钱来阻止伊朗用核弹攻击美国？”罗·卡纳说，每个普通美国家庭在一年内将会面临多达5000美元（约合3.4万元人民币）的生活成本上升。 (CCTV国际时讯)", "ctime": 1777535557, "time_str": "15:52:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260430/c676417717.shtml"}, {"id": "4306041", "title": "汇川技术：首次回购0.013%公司股份，成交总金额为人民币2228.21万元", "content": "汇川技术公告，2026年4月29日，公司首次通过股份回购专用证券账户以集中竞价交易方式回购公司股份34.2万股，占公司总股本的0.013%，最高成交价为65.5元/股，最低成交价为64.35元/股，成交总金额为人民币2228.21万元。", "ctime": 1777535530, "time_str": "15:52:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260430/c676417693.shtml"}, {"id": "4306037", "title": "中国将于5月1日起担任联合国安理会轮值主席", "content": "4月30日，外交部发言人林剑主持例行记者会。有记者问：中国将担任联合国安理会5月轮值主席，请问中方将如何行使职责并发挥作用？林剑表示，中国将于5月1日起担任联合国安理会轮值主席。当前，国际形势变乱交织，地缘冲突此起彼伏。安理会肩负维护国际和平与安全的首要责任，作用备受关注。中方高度重视担任轮值主席工作，将本着负责任、建设性态度，推动安理会加强团结合作，保持公正开放，立足务实行动，促推政治解决，切实履行好联合国宪章赋予的职责。我们也期待国际社会支持中方履职，配合安理会推进5月议程上的各项任务，共同践行真正的多边主义，为和平与发展事业作出更大贡献。（央视新闻）", "ctime": 1777535486, "time_str": "15:51:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260430/c676417661.shtml"}, {"id": "4306031", "title": "黎巴嫩超100万民众将面临严重粮食不安全状况", "content": "黎巴嫩农业部、联合国粮食及农业组织和世界粮食计划署29日联合发布的报告显示，今年4月至8月，黎巴嫩预计将有超过100万人面临严重粮食不安全状况。\n\n报告称，2026年4月至8月期间，黎巴嫩预计将有124万人面临“危机级”或更严重的粮食不安全问题，较2025年11月至2026年3月期间的87.4万人明显上升，形势进一步恶化。(新华社)", "ctime": 1777535434, "time_str": "15:50:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260430/c676417592.shtml"}, {"id": "4306027", "title": "我国首批获得种子认证的马铃薯种薯上市", "content": "记者今天（4月30日）了解到，来自内蒙古、河北、宁夏的5家马铃薯种薯生产企业近日获得了经市场监管总局批准的认证机构颁发的种子认证证书，我国首批通过认证的4个品种、465万公斤马铃薯种薯正式上市，即将应用于春耕生产。（央视新闻）", "ctime": 1777535420, "time_str": "15:50:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260430/c676417578.shtml"}, {"id": "4306025", "title": "清理违规视频11000余条 4月“AI魔改”视频治理成果公布", "content": "记者今天（4月30日）从国家广播电视总局获悉，按照工作部署，2026年1月开展的“AI魔改”视频专项治理工作取得实效。为进一步巩固治理成果，自2月1日起，“AI魔改”视频治理工作通过常态化、制度化长效机制持续开展。广电总局督导各主要网络视听平台进一步深化落实主体责任，加强日常排查，重点清理基于四大名著、历史题材、革命题材、英模人物等经典影视作品进行“AI魔改”的违规视频，并同步清理各类邪典动画，持续营造健康的网络视听生态环境。部分重点网络视听平台公布了4月的处置情况，共清理违规视频11000余条 const META     = {"update_time": "2026-04-30 16:39:52", "sentiment_score": 55.4054054054054, "agents": []};

// 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
