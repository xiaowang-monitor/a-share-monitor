se, "source": "", "url": "https://news.10jqka.com.cn/20260821/c679167165.shtml"}, {"id": "5000753", "title": "益客食品：向特定对象发行股票申请获深交所受理", "content": "益客食品公告，公司于近日收到深圳证券交易所出具的《关于受理江苏益客食品集团股份有限公司向特定对象发行股票申请文件的通知》，深交所对公司报送的向特定对象发行股票的申请文件进行了核对，认为申请文件齐备，决定予以受理。该事项尚需通过深交所审核，并获得中国证监会同意注册的批复后方可实施。", "ctime": 1787284169, "time_str": "11:49:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260821/c679167163.shtml"}, {"id": "5000743", "title": "耕地保护法草案拟三审：严禁截留挪用高标准农田建设资金", "content": "全国人大常委会法制工作委员会举行记者会，发言人黄海华介绍立法工作有关情况并回答记者提问。十四届全国人大常委会第二十四次会议8月25日至28日在北京举行，耕地保护和质量提升法草案将提请三次审议。黄海华介绍，关于耕地保护和质量提升法草案三次审议稿。2026年4月，常委会第二十二次会议对耕地保护和质量提升法草案进行了二次审议。根据各方面意见，三次审议稿拟作以下主要修改：一是鼓励高等学校、科研院所、农业技术推广机构、企业等协同开展人才培养；二是根据中央文件精神，增加规定，河湖管理范围内的土地，原则上不作为补充耕地来源；三是强化对高标准农田建设资金的监督管理，禁止任何单位和个人截留、挤占或者挪用高标准农田建设资金；四是增加对沙化、风蚀、水蚀耕地开展综合治理，以及预防和治理水土流失的规定；五是加大对黑土地的保护力度，增加规定保护黑土地的优良生产能力；六是明确国家健全粮食主产区利益补偿机制，完善对粮食主产区和产粮大县的财政转移支付制度，健全粮食产销区省际横向利益补偿机制。（财联社）", "ctime": 1787283927, "time_str": "11:45:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260821/c679167092.shtml"}, {"id": "5000731", "title": "兆龙互连：公司具备高速有源铜缆相关产品开发及供货能力", "content": "兆龙互连在互动平台表示，公司具备高速有源铜缆相关产品开发及供货能力。目前公司单通道112Gb/s高速线缆实现批量稳定供货，单通道224Gb/s高速线缆实现小批量交付，1.6Tb/s高速组件产品有序推进客户验证。", "ctime": 1787283717, "time_str": "11:41:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260821/c679167018.shtml"}, {"id": "5000701", "title": "银监法修订草案二审稿：拟强化消费者权益保护与监管职责", "content": "全国人大常委会法制工作委员会今天举行记者会，发言人黄海华介绍立法工作有关情况并回答记者提问。十四届全国人大常委会第二十四次会议8月25日至28日在北京举行，银行业监督管理法修订草案将提请二次审议。如何强化银行业消费者权益保护？黄海华表示，近年来发生了银行业金融机构从业人员挪用客户资金等违法行为，社会各界高度关注，希望进一步压实银行业监管机构保护银行业消费者的职责，完善消费者权益保护制度。银行业监督管理法修订草案二次审议稿，坚持问题导向，回应社会关切，主要从以下几个方面强化银行业消费者权益保护：一是增加规定国务院银行业监督管理机构负责统筹银行业消费者权益保护工作的要求；二是增加规定银行业金融机构及其从业人员不得实施侵害消费者合法权益的行为种类，包括不得通过挪用资金等方式侵害存款人和其他客户合法权益等；三是增加规定银行业金融机构从业人员违反本法规定，造成存款人和其他客户损害的，银行业金融机构应当依法承担民事责任。 （澎湃新闻）", "ctime": 1787283519, "time_str": "11:38:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260821/c679166955.shtml"}, {"id": "5000691", "title": "“十四五”时期上海自贸区临港新片区形成全国首创制度创新案例60个", "content": "8月21日上午，上海市政府举行新闻发布会，解读《中国（上海）自由贸易试验区临港新片区发展“十五五”规划》。临港新片区管委会专职副主任唐浩表示，“十四五”时期，临港新片区形成全国首创制度创新案例60个，进出口总值年均增长35.1%，累计实到外资超73亿美元，2025年离岸贸易规模达到327亿美元，建成国内首个的国际再保险登记交易中心并在去年交易保费突破百亿元。洋山港国际船舶液化天然气和甲醇加注规模跻身全球前三。（人民财讯）", "ctime": 1787283470, "time_str": "11:37:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260821/c679166912.shtml"}, {"id": "5000671", "title": "忆月启函存储芯片研发项目落地海口", "content": "近日，忆月启函（YiMoon科技）旗下的存储芯片研发主体——忆芯存（海南）科技有限公司正式落地海口综保区。据悉，该项目将依托海南自贸港政策优势，专注开展NAND/DRAM存储芯片定制化研发方案交付与相关运营业务。(人民财讯)", "ctime": 1787283250, "time_str": "11:34:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260821/c679166779.shtml"}, {"id": "5000661", "title": "ETF两市成交额报2544.02亿元，较昨日此时放量234.16亿元", "content": "截至目前，ETF两市成交额报2544.02亿元，较昨日此时放量234.16亿元，分类型来看，股票型ETF成交额872.51亿元，债券型ETF成交额998.76亿元，货币型ETF成交额150.74亿元，商品型ETF成交额74.4亿元，QDII型ETF成交额447.61亿元。", "ctime": 1787283118, "time_str": "11:31:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260821/c679166732.shtml"}, {"id": "5000653", "title": "ETF午评：黄金股ETF领涨3.27%，疫苗ETF领跌4.84%", "content": "ETF午间收盘涨跌不一，黄金股ETF（517400）领涨3.27%，黄金股ETF（159315）涨2.87%，油气ETF（561760）涨2.74%，疫苗ETF（159645）领跌4.84%，粮食ETF（159072）跌4.68%，生物医药ETF（159508）跌4.68%。", "ctime": 1787283068, "time_str": "11:31:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260821/c679166725.shtml"}, {"id": "5000651", "title": "A股午评：创业板指低开高走涨1.21%，能源金属、贵金属、油气开采及服务板块走强", "content": "A股三大指数早盘集体上涨，截至午盘，上证指数持平，深证成指涨0.63%，创业板指涨1.21%，北证50跌0.33%，科创50指数涨0.07%。全市场成交额12622亿元，较上日缩量1186亿元，全市场超3500只个股下跌。板块题材上，贵金属、能源金属、油气开采及服务、工业金属、小金属概念板块涨幅居前；转基因、种植业与林业、医疗服务、创新药、粮食概念板块跌幅居前。盘面上，贵金属板块高开高走，湖南白银涨停，赤峰黄金、晓程科技、兴业银锡、招金黄金涨幅居前。能源金属板块表现活跃，融捷股份涨停，盛新锂能、永杉锂业、赣锋锂业涨幅居前。油气开采及服务板块亦表现强势，中曼石油、新天然气、科力股份领涨。粮食概念板块大幅回调，京粮控股跌停，万向德农、康农种业、登海种业均逼近跌停，神农种业、秋乐种业跌超10%。创新药板块亦表现低迷，哈三联跌停，博腾股份、安科生物、西点药业跌超10%。", "ctime": 1787283062, "time_str": "11:31:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260821/c679166724.shtml"}, {"id": "5000647", "title": "财政部：推进存量税收优惠政策清理规范，抓好地方财政补贴负面清单管理机制落地见效", "content": "8月21日，国新办举行“开局起步‘十五五’”系列主题新闻发布会，财政部副部长廖岷在会上强调，下一步，财政部门将扎实推进存量税收优惠政策的清理规范，抓好地方财政补贴负面清单管理机制的落地见效，持续深化政府采购市场秩序的整治，为构建高效规范、公平竞争、充分开放的大市场贡献财政的力量。（澎湃新闻）", "ctime": 1787283055, "time_str": "11:30:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260821/c679166715.shtml"}, {"id": "5000645", "title": "谌贻琴在北京市调研时强调 加快建设足球青训体系 提升竞技体育后备人才培养水平", "content": "国务委员谌贻琴20日到北京市调研足球青训体系建设工作。她强调，要深入学习贯彻习近平总书记关于体育工作的重要论述，认真落实全国足球工作会议精神，加快建设足球青训体系，提升竞技体育后备人才培养水平。\n\n谌贻琴走进北京市足球青训中心，观摩北京市青少年足球“百队杯”比赛，了解北京市足球青训体系建设情况。她指出，要树立和践行正确政绩观，久久为功狠抓青训，夯实中国足球振兴发展根基。要坚持有为政府和有效市场相结合，立足我国实际，借鉴先进经验，加快推进各级青训中心建设。要围绕“学训赛”综合发力，加强教练员队伍建设，抓实校园足球，优化完善赛事体系，严抓赛风赛纪，加快培养优质足球人才。\n\n谌贻琴还调研了先农坛体校建设情况。她强调，体校是我国竞技体育后备人才培养的重要阵地，要以立德树人为根本任务，尊重青少年成长规律，完善体制机制，深化体教融合，推动文化学习和体育训练协调发展，培养更多德智体美劳全面发展的竞技体育后备人才。(新华社)", "ctime": 1787283047, "time_str": "11:30:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260821/c679166712.shtml"}, {"id": "5000643", "title": "股指期货早盘收盘 主力合约涨跌互现", "content": "股指期货早盘收盘，主力合约涨跌互现。沪深300股指期货(IF)主力合约涨0.69%，上证50股指期货(IH)主力合约涨0.36%，中证500股指期货(IC)主力合约跌0.06%，中证1000股指期货(IM)主力合约持平。", "ctime": 1787283041, "time_str": "11:30:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260821/c679166710.shtml"}, {"id": "5000611", "title": "富达国际回应“退出中国”传闻：在华战略和市场布局没有变化", "content": "近日有消息称，富达国际正考虑退出其全资控股的中国境内公募基金公司，相关安排仍处于讨论阶段，并需获得监管批准。对此，富达国际回应财联社记者称，富达国际仍将中国视为一个重要市场，并始终相信中国无论对其业务还是对投资者而言，都是颇具吸引力的长期机遇。在战略或市场布局方面，目前没有任何需要汇报的变化。富达国际表示，公司致力于将全球和本土最佳的投资能力带给中国投资者，包括近期在内地与香港基金互认机制下发行的跨境投资解决方案。公开资料显示，富达基金管理（中国）有限公司于2022年12月获批开展公募基金管理业务，由富达国际间接全资持股。今年7月底，富达基金还宣布旗下首只内地互认基金获批，并于8月10日正式开售。（财联社）", "ctime": 1787282902, "time_str": "11:28:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260821/c679166635.shtml"}, {"id": "5000593", "title": "财政部：截至7月底已发行新增专项债2.4万亿元，支持建设项目1.8万个", "content": "8月21日，财政部副部长廖岷在国新办新闻发布会上表示，截至7月底，全国已发行2026年新增专项债券2.4万亿元，支持建设项目1.8万个。（人民财讯）", "ctime": 1787282666, "time_str": "11:24:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260821/c679166567.shtml"}, {"id": "5000589", "title": "财政部：下半年还有2万多亿元地方政府专项债和超长期特别国债待发行使用", "content": "财政部副部长廖岷在国新办新闻发布会上表示，下半年还有2万多亿元的地方政府专项债券和超长期特别国债待发行使用，待发行规模就同期而言也是历年较大的，能够继续保持政策强度。", "ctime": 1787282659, "time_str": "11:24:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260821/c679166561.shtml"}, {"id": "5000559", "title": "中国印尼全面战略对话机制首次会议在雅加达举行", "content": "当地时间8月21日上午，中国印尼全面战略对话机制首次会议在雅加达举行。（央视新闻）", "ctime": 1787282277, "time_str": "11:17:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260821/c679166403.shtml"}, {"id": "5000549", "title": "财政部：下半年 更加积极的财政政策重点从三方面发力", "content": "今天（21日），国新办举行“开局起步‘十五五’”系列主题新闻发布会，财政部有关负责人介绍了今年积极财政政策的作用，并对下半年政策发力重点进行了介绍。财政部副部长廖岷介绍，今年以来，财政部坚定实施更加积极的财政政策：今年财政支出预算安排首次超过30万亿元。新增政府债券规模达到11.89万亿元，为历年来力度最大。中央对地方转移支付连续第四年超过10万亿元，达到10.42万亿元。下半年，财政政策将重点在三个方面继续发力显效：加快资金使用、加力扩大内需、加强财政改革管理。关于增量政策，下半年根据宏观经济运行情况，财政部将及时谋划出台务实管用的增量政策，为实现经济质的有效提升和量的合理增长提供有力支撑。（央视新闻）", "ctime": 1787282209, "time_str": "11:16:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260821/c679166344.shtml"}, {"id": "5000545", "title": "美媒：“林肯”号航母结束中东任务启程返美", "content": "美国《纽约时报》20日报道，“林肯”号航空母舰已启程离开中东海域，结束历时约9个月、主要支援美国对伊朗军事行动的海外部署，将返回美国加利福尼亚州圣迭戈母港。报道称，一名美国官员证实了“林肯”号离开中东的消息。以日本为母港的“华盛顿”号航母已接替“林肯”号在中东执行任务。按航程估算，“林肯”号返回圣迭戈需要约四周至五周时间。（新华社）", "ctime": 1787282200, "time_str": "11:16:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260821/c679166339.shtml"}, {"id": "5000537", "title": "下半年财政部将及时谋划出台务实管用的增量政策", "content": "财政部副部长廖岷8月21日在国新办举行的“开局起步‘十五五’”系列主题新闻发布会上介绍，下半年，财政政策将重点在加快资金使用、加力扩大内需、加强财政改革管理等方面继续发力显效。关于增量政策，下半年根据宏观经济运行情况，财政部将及时谋划出台务实管用的增量政策，为实现经济质的有效提升和量的合理增长提供有力支撑。（新华社）", "ctime": 1787282072, "time_str": "11:14:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260821/c679166306.shtml"}, {"id": "5000527", "title": "今年以来消费品以旧换新政策惠及1.78亿人次", "content": "财政部副部长廖岷8月21日在国新办举行的“开局起步‘十五五’”系列主题新闻发布会上介绍，今年以来，财政部多措并举继续支持鼓励消费。下达消费品以旧换新资金1875亿元，带动相关商品销售额约1.32万亿元，惠及1.78亿人次。创新推出财政金融协同促内需一揽子政策，定向支持居民消费和消费行业经营主体，从供需两端同时发力，此项政策已惠及居民1.13亿人次。在50个试点城市开展有奖发票活动，带动相关领域销售额超3700亿元。（新华社）", "ctime": 1787281979, "time_str": "11:12:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260821/c679166289.shtml"}, {"id": "5000525", "title": "财政部等三部门：将符合条件的中小微民营企业的新发放流动资金贷款纳入中小微企业贷款贴息政策支持范围", "content": "财政部官网消息，财政部、中国人民银行、金融监管总局发布关于进一步做好财政金融协同促内需政策有关工作的通知。其中提到，扩大贴息范围。将符合条件的中小微民营企业的新发放流动资金贷款纳入中小微企业贷款贴息政策支持范围，中央财政按照流动资金贷款本金给予年化1个百分点、期限不超过2年的贴息支持。将信用卡专项分期、消费分期、预借现金分期等新发生信用卡各类分期业务纳入个人消费贷款财政贴息政策支持范围，贴息比例为年化1个百分点。适当提高额度。单户在单家经办机构可享受中小微企业贷款贴息的贷款规模上限由每年5000万元提高至提高至7500万元。单户在单家经办机构可享受服务业经营主体贷款贴息的贷款规模上限由每年1000万元提高至2000万元。每名借款人在单家经办机构可享受的个人消费贷款和信用卡分期业务累计贴息上限由每年3000元提高至每年5000元。", "ctime": 1787281892, "time_str": "11:11:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260821/c679166263.shtml"}, {"id": "5000509", "title": "上海国投公司与灵睿智芯座谈交流", "content": "8月19日下午，上海灵睿智芯计算技术有限公司（简称“灵睿智芯”）创始人刘洋一行到访上海国投公司。上海国投公司党委书记、董事长袁国华接待并主持座谈。双方围绕RISC－V产业战略、前沿算力技术创新、后续融资安排及多维度生态协同等议题展开了深入探讨与交流。(人民财讯)", "ctime": 1787281634, "time_str": "11:07:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260821/c679166190.shtml"}, {"id": "5000501", "title": "全国早稻产量连续6年稳定在560亿斤以上", "content": "国家统计局21日发布数据显示，2026年全国早稻总产量565.8亿斤，连续6年稳定在560亿斤以上，总体保持稳定。早稻播种面积略有增加。2026年，全国早稻播种面积7116.4万亩，比上年增加2.2万亩。数据显示，2026年，全国早稻产量比上年减少4.4亿斤，下降0.8%；全国早稻单产397.6公斤/亩，比上年减少3.2公斤/亩，下降0.8%。（新华社）", "ctime": 1787281503, "time_str": "11:05:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260821/c679166106.shtml"}, {"id": "5000473", "title": "广西壮族自治区水利厅启动洪水防御四级应急响应", "content": "8月21日上午，南海低压已进入北部湾，根据广西气象水文部门监测预报，受其影响，未来几天桂西及桂南沿海部分地区将有一次持续性强降雨过程，部分江河可能出现超警洪水；山洪灾害、岩溶内涝致灾风险较高，影响水库安全度汛。根据广西壮族自治区水利厅洪水防御工作预案，经综合分析研判，决定自8月21日9时启动洪水防御四级应急响应。（央视新闻）", "ctime": 1787281204, "time_str": "11:00:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260821/c679166014.shtml"}, {"id": "5000463", "title": "爱奇艺CEO龚宇：将坚定All in AI战略", "content": "在爱奇艺创作者大会上，爱奇艺创始人、CEO龚宇表示，平台将坚定All in AI战略，深耕AI赋能实拍与AIGC影视长片创作，同时全力推进非中心化社交媒体转型，持续降低内容创作门槛。（新浪财经）", "ctime": 1787281159, "time_str": "10:59:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260821/c679165997.shtml"}, {"id": "5000457", "title": "华硕组建AI LAB 上调AI服务器收入增长目标至150%", "content": "华硕组建数十人的“AI LAB”团队，成为其验证和开发AI服务器的秘密基地。该公司决定将今年AI服务器收入增长目标从原定的100%提高到150%。（科创板日报）", "ctime": 1787281125, "time_str": "10:58:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260821/c679165990.shtml"}, {"id": "5000453", "title": "摩尔线程张建中：智算集群向十万卡规模演进已成必然趋势", "content": "8月21日，摩尔线程创始人张建中在2026世界机器人大会上表示，具身智能产业正迎来类似大模型的“ChatGPT 时刻”，算力底座是发展关键。语言模型已跨越万亿参数门槛，在缩放定律（Scaling Law）驱动下，具身智能模型也正从十亿、百亿级向千亿、万亿级参数进化，智算集群随之从千卡迈向万卡，向十万卡规模演进已成必然趋势。（人民财讯）", "ctime": 1787281058, "time_str": "10:57:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260821/c679165975.shtml"}, {"id": "5000451", "title": "财政部：今年将建立全国统一地方财政补贴负面清单管理机制", "content": "财政部副部长廖岷介绍说，今年，财政部已经会同国家发展改革委、工信部、商务部、海关总署、税务总局、市场监管总局等部门建立全国统一的地方财政补贴负面清单管理机制，清晰划定违规补贴的具体情形，坚决杜绝违规补贴增量，分类规范违规补贴存量。（新华财经）", "ctime": 1787281020, "time_str": "10:57:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260821/c679165959.shtml"}, {"id": "5000437", "title": "财政部：中长期将通过提升社会保障能力、收入分配制度改革等再分配调节 提升居民消费能力", "content": "财政部副部长廖岷8月21日在国新办新闻发布会上表示，下一步，财政部将按照《扩大消费“十五五”规划》聚焦就业、增收等方面的要求，系统谋划提升居民消费能力的战略举措。短期看，主要是充分发挥当前各项政策效能，推动各项政策措施更好更快落地见效。中长期看，主要是通过持续提升社会保障能力，深化收入分配制度改革，强化税收转移支付等再分配调节，来不断夯实居民能消费、敢消费和愿消费的基础。（证券时报）", "ctime": 1787280784, "time_str": "10:53:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260821/c679165895.shtml"}, {"id": "5000435", "title": "人民币国际使用推介会助力中肯经贸合作", "content": "“畅连东非 汇融全球——2026肯尼亚人民币国际使用暨跨境金融合作推介会”20日在肯尼亚首都内罗毕举行。活动围绕人民币跨境支付清算、投融资及中肯金融合作等开展交流。中国银行约翰内斯堡分行在活动现场向肯尼亚商业银行、肯尼亚公平银行等金融机构颁发“肯尼亚人民币业务合作伙伴”铭牌。肯尼亚银行业协会技术服务总监菲德利斯·穆伊亚说，肯中贸易投资往来日益密切，高效便捷的人民币金融服务有助于降低跨境交易成本、提高资金流转效率，为企业开展贸易和投资提供更多选择。（新华社）", "ctime": 1787280738, "time_str": "10:52:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260821/c679165861.shtml"}, {"id": "5000431", "title": "现货白银站上69美元/盎司", "content": "现货白银站上69美元/盎司，日内涨1.37%。", "ctime": 1787280637, "time_str": "10:50:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260821/c679165796.shtml"}, {"id": "5000427", "title": "威胜信息AI智能控制终端首次挂网运行", "content": "近日，威胜信息与国网湖南电科院共同攻关研制的AI智能控制终端在湖南邵阳首次挂网示范运行，该设备是国网湖南电科院牵头的湖南省十大技术攻关项目《电网主配微协同调控技术及装备研发》课题二的关键成果，成功破解传统台区多元资源调控粗放、新能源精细化管控不足的行业痛点，将配电网的运行控制从“主站集中决策、终端被动执行”的传统模式，推向“边缘自主决策，源网荷储协同调控”的智能化新阶段，为配电网及微电网规模化建设打造了落地样本。（人民财讯）", "ctime": 1787280560, "time_str": "10:49:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260821/c679165755.shtml"}, {"id": "5000415", "title": "“十五五”时期 我国财政支出将增强国内大循环内生动力", "content": "今天上午，国新办举行“开局起步‘十五五’”系列主题新闻发布会，财政部有关负责人介绍了发挥积极财政政策作用，推动经济社会高质量发展有关情况。财政部副部长廖岷表示，过去五年，财政宏观调控效能不断提升，有力支撑了经济社会高质量发展，并实现了财政可持续性，财政作为国家治理的基础和重要支柱作用进一步彰显。2021—2025年，全国一般公共预算收入共计106万亿元，支出合计135万亿元，较“十三五”时期均有较大幅度的增长。“十五五”时期，我们将努力构建一个更为强大、稳固、平衡、可持续的财政，为基本实现社会主义现代化取得决定性进展提供坚实财政保障。概括起来，就是要努力实现六个“进一步”：财政实力进一步增强；财政支出结构进一步优化，财政支出更多转向投资于人，支持国内消费，增强国内大循环内生动力；财政宏观调控效能要进一步提升；财税体制改革进一步深化；财政科学管理水平进一步提高；财政重点领域风险进一步化解。（央视新闻）", "ctime": 1787280381, "time_str": "10:46:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260821/c679165651.shtml"}, {"id": "5000409", "title": "现货白银涨超1%", "content": "现货白银涨超1%，现报68.89美元/盎司。", "ctime": 1787280311, "time_str": "10:45:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260821/c679165587.shtml"}, {"id": "5000405", "title": "中国通号低空公司联合中标太原市低空政务“一网统飞”作业平台项目", "content": "近日，中国通号低空公司以联合体形式，成功中标太原市低空飞行管控服务平台（一期）——太原市低空政务“一网统飞”作业平台项目。中国通号将为项目提供自研低空感知设备，感知数据可实时接 // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
