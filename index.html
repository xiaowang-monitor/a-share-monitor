481, "time_str": "13:11:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260519/c676794426.shtml"}, {"id": "4379237", "title": "新易盛：预计2026年硅光产品的占比将进一步提升", "content": "新易盛5月19日在互动平台表示，公司目前已推出400G和800G ZR/ZR+相干光模块产品；硅光产品已有批量出货，预计2026年硅光产品的占比将进一步提升，具体的放量进度取决于市场及客户的需求情况。", "ctime": 1779167413, "time_str": "13:10:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260519/c676794410.shtml"}, {"id": "4379227", "title": "美国国务院批准向韩国出售军用直升机和武装直升机升级项目，总金额超过40亿美元", "content": "美国国务院18日说，批准向韩国出售军用直升机和武装直升机升级两个项目，总金额超过40亿美元。韩国方面寻求购买24架MH-60R海军用直升机，以及配套的24套声呐和8挺机枪等，合同金额30亿美元。MH-60R直升机可执行多种任务，包括反潜、监视、作战和搜救。美国国务院称，这笔军售将加强韩方应对“现阶段和未来威胁”的能力。另外，美方批准为韩现役AH-64“阿帕奇”式武装直升机进行升级，包括提供8套火控雷达等，项目金额为12亿美元。这两个项目仍需美国国会审批。（新华社）", "ctime": 1779167311, "time_str": "13:08:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260519/c676794388.shtml"}, {"id": "4379225", "title": "蔚来-SW港股跌超5%", "content": "蔚来-SW港股跌5.01%，报45.16港元。", "ctime": 1779167296, "time_str": "13:08:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260519/c676794383.shtml"}, {"id": "4379185", "title": "北京上市公司总市值达33.4万亿元", "content": "18日举行的2026北京上市公司高质量发展大会暨投融资并购对接会披露，北京上市公司市场规模持续扩大，总数达481家，总市值实现了跨越式增长，达到33.4万亿元。中国证监会副主席李超表示，证监会将与北京市一起，继续全力稳定和增强资本市场信心，以更大力度支持科技创新和产业创新深度融合，支持上市公司通过并购重组“补链强链”、通过再融资“做优做强”，以更大力度推进北交所深化改革，更好发挥北交所服务中小企业创新发展的作用，以更大力度夯实上市公司高质量发展基础。（新华社）", "ctime": 1779166684, "time_str": "12:58:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260519/c676794225.shtml"}, {"id": "4379183", "title": "中国和欧洲联合研制的太阳风-磁层相互作用全景成像卫星（“微笑”卫星）成功发射升空", "content": "当地时间19日，中国和欧洲联合研制的太阳风-磁层相互作用全景成像卫星（“微笑”卫星）在法属圭亚那库鲁航天中心，由“织女星-C”火箭成功发射升空。（新华社）", "ctime": 1779166494, "time_str": "12:54:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260519/c676794175.shtml"}, {"id": "4379181", "title": "“微笑”卫星今天发射 为空间天气预报提供科学支撑", "content": "今天（19日）中欧联合研制的太阳风-磁层相互作用全景成像卫星（简称“微笑”卫星，SMILE）在法属圭亚那库鲁航天中心，由“织女星-C”火箭发射升空。卫星顺利进入预定轨道，状态正常，太阳翼展开到位，标志着发射任务取得圆满成功。“微笑”卫星任务是中国科学院（CAS）与欧洲空间局（ESA）首次开展任务级全方位深度合作的空间科学探测任务，也是中国科学院空间科学（二期）先导专项的收官之作。“微笑”卫星的核心使命就是要对我们地球的最外层磁层，进行软X射线的整体成像，来揭示太阳风跟我们地球空间相互作用的过程和物理的规律。太阳风是源自太阳的高速等离子体流。剧烈的太阳活动会引发磁暴、亚暴等空间天气事件，直接威胁到在轨卫星的安全、导航定位的精度、通信链路的稳定以及高纬度地区的电网运行。而地球磁层就像是抵御太阳风侵袭的天然“保护伞”，好比是地球最外层的一个保护壳。只有深入认识太阳风与磁层的耦合机理，才能减少太阳风带来的各种不利影响。（央视新闻）", "ctime": 1779166374, "time_str": "12:52:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260519/c676794150.shtml"}, {"id": "4379177", "title": "印尼股市基准指数扩大跌幅至3%报6403.80点", "content": "印尼股市基准指数扩大跌幅至3%报6403.80点。", "ctime": 1779166173, "time_str": "12:49:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260519/c676794119.shtml"}, {"id": "4379169", "title": "阿里千问大模型Qwen3.7 Max预览版即将发布", "content": "阿里千问大模型Qwen3.7 Max预览版和 Qwen3.7 Plus预览版即将发布。Arena（前大模型竞技场）的评测中，Qwen3.7-Max-Preview在文本领域排名第13，同时也是国产排名第一的模型。在视觉领域，Qwen3.7-Plus-Preview排名第16，同样是排行榜上国产排名第一的模型。（科创板日报）", "ctime": 1779166001, "time_str": "12:46:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260519/c676794099.shtml"}, {"id": "4379151", "title": "伊拉克4月原油出口环比下降近47%", "content": "伊拉克石油部18日发布声明说，该国4月原油出口量骤降至约988万桶，较3月的约1860万桶下降46.9%。声明援引伊拉克国家石油营销组织的统计数据说，伊拉克4月原油出口收入超过10.87亿美元。数据显示，伊拉克3月原油出口量约1860万桶，较2月的约9987万桶大幅下降超八成；3月原油出口收入约19亿美元，远低于2月的逾68亿美元。受美以伊战事影响，全球能源贸易关键通道霍尔木兹海峡通航几近停滞，导致近几个月来伊拉克原油出口量大幅减少。（新华社）", "ctime": 1779165547, "time_str": "12:39:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260519/c676793985.shtml"}, {"id": "4379149", "title": "美媒称美对古巴“动武”可能性在增加", "content": "美国《政治报》网站18日刊文称，由于美国对古巴采取的施压手段并未奏效，美国正比以往更认真地考虑军事选项。报道援引美方官员及相关知情人士的话称，美国总统特朗普正对美方向古巴的施压行动感到“沮丧”。“美方最初认为在委内瑞拉的行动以及对古巴的一系列制裁会吓住古巴，迫使他们达成协议。但现在伊朗局势已失控，古巴人比一开始想象的要强硬得多，军事行动选项因此被放上桌面。”（新华社）", "ctime": 1779165240, "time_str": "12:34:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260519/c676793907.shtml"}, {"id": "4379125", "title": "机构：QD-OLED面板供应助力 Q1全球OLED显示器出货年增78%", "content": "根据TrendForce集邦咨询最新调查，2026年第一季正值OLED显示器产业淡季，加上2025年第四季促销旺季已提前释放品牌动能，导致全球出货量季减11%。然而，从年增长角度观察，第一季出货量年增幅仍高达78%，主要因为QD-OLED面板供应资源日益充沛，助力新进品牌持续放量，有效填补市场空缺。（科创板日报）", "ctime": 1779164950, "time_str": "12:29:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260519/c676793850.shtml"}, {"id": "4379103", "title": "世界气象组织：拉美与加勒比地区极端天气影响愈发显著", "content": "世界气象组织5月18日在巴西首都巴西利亚发布《2025年拉丁美洲和加勒比地区气候状况》报告。报告指出，破纪录高温、持续干旱、极端降雨和热带气旋正持续冲击拉美和加勒比地区，对民众生活、经济发展和生态系统造成严重影响。（央视新闻）", "ctime": 1779164693, "time_str": "12:24:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260519/c676793795.shtml"}, {"id": "4379095", "title": "俄总统新闻秘书：俄中元首每次会晤都给双边关系注入动力", "content": "俄罗斯总统新闻秘书佩斯科夫18日表示，俄方对普京总统即将对中国进行的国事访问寄予很高期望，两国元首每次会晤都给俄中关系进一步发展注入动力。同一天，俄罗斯总统助理乌沙科夫在新闻发布会上表示，俄中两国为发展邻国间的关系树立了典范。（央视新闻）", "ctime": 1779164624, "time_str": "12:23:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260519/c676793776.shtml"}, {"id": "4379089", "title": "杭州1宗宅地溢价超15%成交", "content": "5月19日，杭州1宗临平新城宅地出让，土地出让面积37363㎡，规划建筑面积67253.4㎡，地块限高60m，容积率1.8，起始价6.05亿元，起始楼面价9000元/㎡。该地块经过20轮竞价，最终杭州西湖房地产集团有限公司以总价7亿元竞得该地块，成交楼面价10413元/㎡，溢价率15.69%。（人民财讯）", "ctime": 1779164525, "time_str": "12:22:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260519/c676793756.shtml"}, {"id": "4379085", "title": "5月19日午间公告一览：旺能环境旺能转债即将停止转股赎回", "content": "旺能环境公告，2026 年 5 月 19 日为“旺能转债”最后一个转股日，当日收市前，持有“旺能转债”的投资者仍可进行转股；2026 年 5 月 19 日收市后，仍未转股的“旺能转债”将停止转股，剩余可转债将按照 100.844 元/张（含息税）的价格强制赎回。若被强制赎回，投资者可能面临损失，敬请投资者注意投资风险。", "ctime": 1779164366, "time_str": "12:19:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260519/c676793719.shtml"}, {"id": "4379081", "title": "香港将修订法例推行建筑地盘全面禁烟", "content": "香港特区政府今日（19日）向立法会提交三项法例修订，包括《2026年吸烟（公众卫生）条例（修订附表2）令》（《修订令》）、《2026年定额罚款（吸烟罪行）（指明主管当局及公职人员）（修订）公告》（《修订公告》）及《2026年建筑地盘（安全）（修订）规例》（《地盘修例》）。上述法例修订将对建筑工程总承建商、分判商及任何人士施加明确法律责任，严格规定在所有建筑地盘内禁止吸烟，以减低火警风险，保障工人及公众安全。特区政府会全力配合立法会的审议工作，期望立法会支持并尽快通过三项法例修订，让特区政府尽早在所有建筑地盘内实施禁止吸烟。（大湾区之声）", "ctime": 1779164287, "time_str": "12:18:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260519/c676793656.shtml"}, {"id": "4379073", "title": "古巴国家主席：美国对古巴人民实施的集体惩罚是种族灭绝行为", "content": "古巴国家主席迪亚斯-卡内尔18日在社交媒体发文说，美国对古巴人民实施的集体惩罚是种族灭绝行为，应受国际组织谴责，并依法追究推动者的刑事责任。 当天早些时候，美国财政部外国资产控制办公室宣布制裁9名古巴官员及古巴情报机构。迪亚斯-卡内尔说，在古巴党、国家、政府及军事机构领导层中，没有任何人拥有受美国司法管辖保护的资产或财产。美国政府对此十分清楚，也拿不出任何证据。其充满仇恨的反古巴言论是为其不断升级的全面经济战争寻找借口。 迪亚斯-卡内尔说，美国相关行政令对有意向古巴出售燃料的第三方进行威胁，并将封锁措施域外化到前所未有的程度，惩罚那些想在古巴投资或仅仅向古巴提供基本物资的企业，这些做法“不道德、非法且具有犯罪性质”。 美国长期对古巴实施经济、金融封锁和贸易禁运。美国今年年初对委内瑞拉发动大规模军事打击后，进一步加大对古巴施压，包括实施新一轮石油限制措施。5月1日，美国总统特朗普签署行政令，以“威胁美国国家安全和对外政策”为由，加大对古巴的制裁。(新华社)", "ctime": 1779164166, "time_str": "12:16:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260519/c676793587.shtml"}, {"id": "4379071", "title": "龙湖提前兑付15.54亿元公司债 年内到期境内债券仅余10亿", "content": "记者从独立信源处获悉，龙湖集团在5月19日完成“21龙湖04”的本金兑付与付息，涉及总金额约15.54亿元，其中本金14.95亿元、利息约0.59亿元。公开资料显示，“21龙湖04”发行金额为15亿元，票面利率3.93%，债券付息日及回售部分兑付日为2026年5月21日。在本次兑付后，龙湖集团境内信用债仅余约18亿元，其中2026年到期仅剩余10亿元。（蓝鲸新闻）", "ctime": 1779164131, "time_str": "12:15:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260519/c676793579.shtml"}, {"id": "4379067", "title": "阿根廷卫生团队抵达乌斯怀亚调查汉坦病毒", "content": "阿根廷国家实验室与卫生研究所管理局卡洛斯·马尔夫兰研究所的专家18日抵达火地岛省首府乌斯怀亚调查汉坦病毒。调查团队将设置陷阱捕捉与汉坦病毒传播有关的长尾侏儒稻鼠等啮齿类动物。 阿根廷卫生部表示，调查团队将设立一个“野外实验室”隔离保存所有捕获样本，随后将其转移并暂时保存在当地符合生物安全标准的处理中心，最终运送至马尔夫兰研究所。捕获完成后，所有陷阱将被移除并按照规程进行消毒。 在乌斯怀亚的调查活动预计将持续一周。据阿根廷《号角报》报道，出于“生物安全方面的原因”，保存样本的具体地点将被严格保密。 由总部位于荷兰的“泛海探险”公司运营的“洪迪厄斯”号邮轮4月1日从阿根廷乌斯怀亚出发，前往非洲岛国佛得角，途中暴发汉坦病毒疫情，造成3人死亡。世界卫生组织官员曾表示，“洪迪厄斯”号首个感染病例可能不是在船上感染，而是发生在邮轮出发之前。(新华社)", "ctime": 1779163931, "time_str": "12:12:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260519/c676793548.shtml"}, {"id": "4379065", "title": "田轩：金融赋能创新需要更加\"包容\"的创投市场 更加稳定的宏观政策导向", "content": "今日在2026金融街·金城坊论坛上，北京大学光华管理学院院长田轩表示，金融赋能创新需要更加“包容”的创投市场、更加活跃的企业创业投资、更加稳定的宏观政策导向。学术研究显示，领投VC对失败的包容度越高，被投企业以后创新的数量和质量就会更好。政策方面，田轩认为，政策本身并不会影响科技创新，而政策的不确定性、不稳定性对科技创新的影响较大。（财联社）", "ctime": 1779163893, "time_str": "12:11:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260519/c676793534.shtml"}, {"id": "4379059", "title": "东山精密：已与外部硅光企业开展合作并布局自研硅光模块产品", "content": "东山精密5月19日在互动平台表示，公司200G EML已实现量产，1.6T产品客户端相关工作正按计划有序推进，3.2T产品将依托索尔思自有光芯片优势优先以400G EML为核心开展布局。公司具备硅光CW激光芯片研发能力，目前已与外部硅光企业开展合作并布局自研硅光模块产品，后续技术方案坚持EML与硅光并行，多元布局应对光互联技术迭代，持续夯实技术竞争力。", "ctime": 1779163581, "time_str": "12:06:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260519/c676793477.shtml"}, {"id": "4379053", "title": "融信中国：预计境内债重整方案6月推出，选项包括现金、长债以及资产信托份额等", "content": "融信中国境内债务重组方案仍未如约推出。近日，融信中国主要的境内发债主体融信(福建)投资集团有限公司发布公告，旗下“H20融信1”等八只债券拟于5月20日召开持有人会议，审议关于豁免通知时间、增加额外宽限期、现金提前偿付安排等方案。据悉，融信方面去年曾告知投资人，当年的10月会推出重整方案、此后改口为2025年底前。近日，融信方面再次告知投资人，此番延长宽限期以在给重整方案的制定争取更多时间，预计方案将于今年6月推出。重整方案给投资人的选项包括现金、长债以及资产信托份额等，信托资产有第三方评估报告。（澎湃新闻）", "ctime": 1779163444, "time_str": "12:04:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260519/c676793428.shtml"}, {"id": "4379051", "title": "港股午评：恒生指数涨0.39%，恒生科技指数跌0.11%", "content": "港股午间收盘，恒生指数涨0.39%，恒生科技指数跌0.11%。恒指港股通ETF银华（159318）涨0.45%，港股通科技ETF鹏华（159751）跌0.55%。板块方面，医疗保健设备、建筑产品板块涨幅靠前；半导体产品与设备、汽车板块跌幅靠前。个股方面，森松国际涨7.09%，明略科技-W涨6.85%，迈富时涨6.01%，金辉控股涨5.7%，今海医疗科技涨5.19%；剂泰科技-P跌13.36%，翼菲科技跌13.19%，智谱跌12.71%，思格新能跌9.94%，智云科技建设跌9.8%。", "ctime": 1779163428, "time_str": "12:03:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260519/c676793423.shtml"}, {"id": "4379043", "title": "尚界汽车法务部：已报案", "content": "尚界汽车法务部官方19日发文，称近期就编造及传播尚界Z7不实信息的网络账号向公安机关报案，相关实施违法行为的账号实际运营者已被依法行政处罚。", "ctime": 1779163251, "time_str": "12:00:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260519/c676793385.shtml"}, {"id": "4379023", "title": "夏威夷檀香山一港口发生石油泄漏事故", "content": "美国海岸警卫队18日说，夏威夷檀香山一港口发生石油泄漏事故，目前泄漏量和源头尚不清楚，尚无人员受伤和野生动物受影响的报告。（新华社）", "ctime": 1779162132, "time_str": "11:42:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260519/c676793116.shtml"}, {"id": "4379021", "title": "印尼等10国外长强烈谴责以色列再次袭击“全球坚韧船队”", "content": "印度尼西亚等10国外长18日发表联合声明，对以色列再次袭击“全球坚韧船队”的行为予以“最强烈谴责”。（新华社）", "ctime": 1779162013, "time_str": "11:40:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260519/c676793094.shtml"}, {"id": "4379013", "title": "美加强旅行限制等措施防埃博拉病例输入", "content": "美国疾病控制和预防中心18日表示，鉴于东非和中非地区埃博拉疫情持续蔓延，美国正采取强化旅客筛查、入境限制等公共卫生措施，以防止埃博拉病例输入。 美疾控中心当天发表声明说，该机构正与美国土安全部及其他联邦机构合作，落实相关公共卫生措施，以降低由本迪布焦型埃博拉病毒引发的疫情扩散至美国的风险。 这些措施包括：加强对来自受埃博拉疫情影响地区入境人员的公共卫生筛查和监测；对过去21天内曾前往刚果（金）、乌干达或南苏丹的非美国护照持有者实施入境限制；与航空公司、国际合作伙伴及入境口岸官员协调，识别和管理可能接触过埃博拉病毒的旅客；强化全美口岸卫生防护、密切接触者追踪、实验室检测能力及医院应对准备；继续向疫情地区派遣美疾控中心人员，支持当地防疫工作。上述措施有效期为30天。(新华社)", "ctime": 1779161788, "time_str": "11:36:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260519/c676792938.shtml"}, {"id": "4378997", "title": "ETF两市成交额2428.95亿元", "content": "截至目前，ETF两市成交额报2428.95亿元，分类型来看，股票型ETF成交额1030亿元，债券型ETF成交额787.90亿元，货币型ETF成交额92.23亿元，商品型ETF成交额32.50亿元，QDII型ETF成交额331.77亿元。其中，成交额最高的非货币型ETF分别是中韩半导体ETF（513310）、科创50ETF（588000）、A500ETF（563360），成交额分别为：71.53亿元、39.55亿元、37.74亿元。", "ctime": 1779161536, "time_str": "11:32:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260519/c676792760.shtml"}, {"id": "4378989", "title": "ETF午评：巴西ETF领涨3.24%，中韩半导体ETF领跌8.23%", "content": "ETF午间收盘涨跌不一，巴西ETF（520870）领涨3.24%，半导体设备ETF（562590）涨3.19%，电力ETF（562350）涨3.18%，中韩半导体ETF（513310）领跌8.23%，标普油气ETF（513350）跌5.08%，标普油气ETF（159518）跌4.2%。", "ctime": 1779161483, "time_str": "11:31:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260519/c676792749.shtml"}, {"id": "4378991", "title": "A股午评：科创50指数半日涨超1%，电力、云计算板块反复活跃", "content": "A股三大指数早盘涨跌不一，截至午盘，上证指数涨0.02%，深证成指跌0.78%，创业板指跌1.21%，北证50涨0.45%，科创50指数涨1.01%。全市场成交额18274亿元，较上日缩量1166亿元，全市场超2900只个股下跌。板块题材上，电力、华为昇腾、云计算、脑机接口、超级电容、电网设备板块涨幅居前；小金属、磷化工、油气开采及服务、盐湖提锂、军工装备、培育钻石板块跌幅居前。盘面上，机构称算力需求快速增长驱动用电量增长，电力板块再度爆发，上海电力、京能电力、华能蒙电等股涨停。机构指云计算行业进入需求放量、量价共振上行周期，相关板块震荡上扬，弘信电子连续两日20cm涨停，南威软件、吉视传媒等股封板。此外，电网设备、脑机接口、半导体设备等板块均有异动。另一方面，金属、化工板块多数走弱，国城矿业、粤桂股份、鲁西化工领跌板块。霍尔木兹海峡消息反复，油气股震荡回调，通源石油、蓝焰控股、新天然气等股下挫。", "ctime": 1779161481, "time_str": "11:31:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_s   if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
