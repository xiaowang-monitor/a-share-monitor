}
.card:hover { background: var(--bg-card-hover); border-color: #334155; }
.badge {

.badge-s { background: rgba(239,68,68,0.2); color: #ef4444; }

  height: 6px; border-radius: 3px; background: #1e293b; overflow: hidden;
}
.score-bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s; }
.up { color: var(--red); }
.down { color: var(--green); }
.pulse { animation: pulse 2s infinite; }
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}
.glow { box-shadow: 0 0 20px rgba(59,130,246,0.15); }
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg-primary); }

</style>

3/c677654468.shtml"}, {"id": "4576587", "title": "李强会见韩国总理金民锡", "content": "6月23日下午，国务院总理李强在大连会见来华出席夏季达沃斯论坛的韩国总理金民锡。 李强表示，习近平主席同李在明总统成功实现互访，达成一系列重要共识，为中韩关系发展进一步规划了蓝图。中方始终高度重视发展对韩关系，愿同韩方一道遵循两国元首战略引领，筑牢政治互信基础，尊重和照顾彼此核心利益和重大关切，坚持平等互利，不断拓展合作的广度深度，推动中韩战略合作伙伴关系长期健康稳定发展，共促两国和地区的繁荣。 李强指出，中韩贸易合作潜力巨大，中方愿同韩方用好两国经济部长会等机制，加快推进双边自贸协定第二阶段谈判，推动两国贸易扩面提质。中韩在创新领域各有所长，产业链价值链深度融合，可以进一步推动对接互嵌，充分发挥互补优势，巩固做优传统产业合作，拓展半导体、人工智能、新能源、生物医药等新兴产业合作，共同抢抓创新发展的新机遇。双方要深化旅游、教育、地方、青少年、媒体、智库等领域交流合作，持续增进两国国民感情。近些年，亚太经济保持较快发展，得益于各国总体坚持开放合作。中方愿同韩方加强协调配合，推动建设开放型亚太经济，维护自由贸易和多边主义，维护全球产供链安全稳定，为亚太乃至全球发展注入正能量。 (新华社)", "ctime": 1782211048, "time_str": "18:37:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260623/c677654463.shtml"}, {"id": "4576561", "title": "合格证信息实时共享 两部门优化机动车登记服务", "content": "工业和信息化部、公安部23日发布关于应用机动车出厂合格证信息办理机动车注册登记业务的通知，优化机动车登记服务，简化登记程序，建立实施机动车出厂合格证信息联网共享核查机制，进一步提升购车上牌效率。 通知提出，应用合格证信息办理机动车注册登记业务，优化合格证信息传送及数据共享，工业和信息化部通过全国一体化政务服务平台将相关信息共享交换至公安部，协助推进机动车注册登记业务高效办理。 通知要求，进一步加强合格证管理；在全国全面推行国产小客车预查验工作，对已完成预查验的车辆，机动车所有人在办理新车上牌时无需再提交车辆识别代号拓印膜、机动车标准照片等纸质材料；持续做好联网核查工作保障。(新华社)", "ctime": 1782210696, "time_str": "18:31:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260623/c677654344.shtml"}, {"id": "4576533", "title": "已收小麦超3000万吨 我国夏粮收购开局良好", "content": "记者23日从国家粮食和物资储备局获悉，随着夏粮陆续收获上市，旺季收购正逐步展开。目前，全国各类粮食经营主体累计收购小麦超3000万吨，总体进展顺利、开局良好。当前，全国小麦大规模机收基本完成，夏粮旺季收购正在由南向北有序展开，收购进度与上年基本持平。国家粮食和物资储备局粮食储备司司长罗守全表示，各级储备企业有序开展轮换收购，各类加工和贸易企业、饲料企业积极入市，市场购销较为活跃。目前，主产区小麦收购均价每斤1.21元左右，优质品种小麦售价比市场价高出0.1元左右，以质论价、优质优价特征明显。下一步，国家粮食和物资储备局将统筹抓好市场化收购和政策性收储，持续加强市场监测预警，健全极端天气应对预案，完善粮食烘干、清理等产后服务，确保农民售粮渠道畅通、市场平稳运行。（新华社）", "ctime": 1782210604, "time_str": "18:30:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260623/c677654276.shtml"}, {"id": "4576525", "title": "上交所向沪市公司发出“提质增效重回报”2.0专项行动公开倡议", "content": "上交所向全体沪市公司发出“提质增效重回报”2.0专项行动的公开倡议，标志着专项行动进入新阶段。行动倡议聚焦提升上市公司五方面质效：一是提升经营发展质效。本次倡议引导公司明确经营质量提升目标，比如选取净资产收益率、毛利率、产销量、研发成果等能体现盈利能力或经营质量的财务、非财务指标，或者公司认为更能体现自身特点的其他自选指标，并针对性提出提升举措。同时，也倡议公司积极使用并购重组、再融资等资本市场工具箱解决同业竞争等问题。二是提升公司治理质效。针对常见合规问题，引导公司持续完善各方归位尽责、有效制衡的内部治理机制，强化控股股东、实际控制人、董事、高级管理人员等“关键少数”合规意识与培训学习，持续提高决策科学性和审慎性，切实提升公司治理水平与规范运作能力。三是提升信息披露质效。引导公司规范非法定信息披露渠道的信息发布机制，谨防主动或被动卷入热点概念炒作，并建立信息披露差错内部追责机制。鼓励公司丰富信息披露形式，持续提升信息披露文件可读性与实用性。四是提升投资者回报质效。引导公司在“量力而行”的基础上合理提高分红率、增加现金分红频次，鼓励积极实施股份回购注销和大股东增持，丰富业绩说明会、走进上市公司等多种投资者交流形式。五是提升社会责任质效。鼓励各公司进一步提高ESG报告披露意愿和质量，依规识别并分析ESG相关议题，客观、真实反映公司在环境、社会和治理方面的实践和成效。", "ctime": 1782210580, "time_str": "18:29:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260623/c677654266.shtml"}, {"id": "4576523", "title": "迈威生物：注射用6MW5311临床试验申请获得国家药品监督管理局批准", "content": "迈威生物公告，近日，公司收到国家药品监督管理局核准签发的《药物临床试验批准通知书》，注射用6MW5311用于血液瘤（急性髓系白血病（AML）、慢性粒单核细胞白血病（CMML）以及多发性骨髓瘤（MM））适应症的临床试验申请获得批准。此前，6MW5311临床试验申请已获得FDA许可。6MW5311为全球首款获批开展临床试验的靶向 LILRB4/CD3 的 TCE 创新药。", "ctime": 1782210567, "time_str": "18:29:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260623/c677654263.shtml"}, {"id": "4576521", "title": "以军向黎巴嫩南部平民开火 致2人死亡", "content": "总台记者当地时间23日获悉，当天，以色列士兵在黎巴嫩南部奈拜提耶地区向平民开火，造成2人死亡。据悉，事发时，当地民众正在清理道路，以色列士兵开枪射击。（央视新闻）", "ctime": 1782210562, "time_str": "18:29:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260623/c677654260.shtml"}, {"id": "4576515", "title": "立讯精密：H股上市申请6月18日获联交所上市委员会审阅", "content": "立讯精密公告，公司此前申请发行境外上市外资股（H股）并在香港联交所主板挂牌上市。香港联交所上市委员会于2026年6月18日举行上市聆讯，审议公司本次境外发行上市申请。公司联席保荐人于2026年6月22日收到香港联交所信函，指出上市委员会已审阅公司上市申请，但该信函不构成正式上市批准，香港联交所仍有提出进一步意见的权力。公司本次发行上市尚需取得香港证监会和联交所等最终批准，存在不确定性。", "ctime": 1782210547, "time_str": "18:29:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260623/c677654254.shtml"}, {"id": "4576511", "title": "SpaceX跌破上市首日开盘价", "content": "23日美股盘前，太空探索技术公司（SpaceX）股价一度跌至每股147美元左右，跌破上市首日开盘价。此前，该公司股价已连续三个交易日下跌，市值蒸发超过6000亿美元。SpaceX本月12日在纳斯达克正式挂牌，发行价135美元，上市首日开盘价150美元。(央视财经)", "ctime": 1782210531, "time_str": "18:28:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260623/c677654249.shtml"}, {"id": "4576505", "title": "蒙草生态：公司联合体签署2.77亿元合同", "content": "蒙草生态公告，公司与蔚来林草、中铁三局、中科广盛组成联合体，与阿拉善高新技术产业开发区（乌斯太镇）乡村振兴办公室签署了《内蒙古自治区阿拉善盟阿拉善左旗“三北”六期蒙宁联防联治乌兰布和沙漠锁边项目工程总承包（EPC）合同》。合同金额2.77亿元，公司作为联合体成员对应合同金额8223.9万元。项目内容为治理沙化土地，包括工程固沙、人工种草及封沙育林。工期总日历天数为286天，管护期三年。", "ctime": 1782210463, "time_str": "18:27:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260623/c677654231.shtml"}, {"id": "4576499", "title": "博汇股份：终止向特定对象发行股票事项并撤回申请文件", "content": "博汇股份公告，公司于2026年6月23日召开第五届董事会第五次会议，审议通过了《关于终止向特定对象发行股票事项并撤回申请文件的议案》，决定终止向特定对象发行A股股票事项并撤回申请文件。此次决定综合考虑了宏观经济环境、资本市场环境变化及公司实际情况等因素。", "ctime": 1782210386, "time_str": "18:26:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260623/c677654215.shtml"}, {"id": "4576487", "title": "商务部国际贸易谈判代表兼副部长李成钢会见苹果公司首席运营官萨比赫·汗", "content": "据商务部官网，6月22日下午，李成钢国际贸易谈判代表兼副部长会见苹果公司首席运营官萨比赫·汗，双方就中美经贸关系、苹果公司在华发展等议题进行交流。", "ctime": 1782210312, "time_str": "18:25:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260623/c677654190.shtml"}, {"id": "4576473", "title": "中部战区空军某部开展军地联合防汛搜救演练", "content": "近日，中部战区空军某部联合地方应急、通信、医院等多单位，协调多型飞机、车辆，开展全要素军地联合防汛抢险搜救实战化演练。演练创新采用“直升机+运输机”组网协同，“直升机+无人机”立体侦搜模式，构设水面、村庄、山区、高楼等典型抗洪抢险搜救场景，围绕空中指挥、机降营救、水上吊救、物资投送、地面搜索营救、紧急转运等实战课目，检验空地一体联动处置能力。(新华社)", "ctime": 1782210148, "time_str": "18:22:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260623/c677654135.shtml"}, {"id": "4576469", "title": "东兴口岸出境人数破500万人次，同比增长21.04%", "content": "据广西边检总站东兴边检站统计，截至2026年6月22日晚闭关，东兴口岸出境人数已突破500万人次，同比增长21.04%，口岸通关客流稳步攀升，中越跨境人员交流往来呈现蓬勃态势。今年以来，随着中越人文交流、文旅合作持续深化，东兴口岸出入境热度持续飙升，跨境旅游、民间探亲、商贸往来愈发频繁，成为国门边境对外开放的热点亮点。此次东兴口岸出境人次突破500万，直观展现了中越民间交流的强劲活力，生动诠释了两国睦邻友好、民心相通的良好局面，为新时代中越边境高质量开放发展注入了源源不断的生机与活力。（央视新闻）", "ctime": 1782210118, "time_str": "18:21:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260623/c677654117.shtml"}, {"id": "4576461", "title": "“八五”普法期间全社会法治观念明显增强", "content": "国务院关于“八五”普法决议实施情况的报告6月23日提请全国人大常委会会议审议。报告显示，2021年至2025年，“八五”普法期间，全社会法治观念明显增强，全民法治素养明显提升，社会治理法治化水平明显提高，全面依法治国的社会基础进一步夯实。\n报告显示，“八五”普法期间，多层次多领域依法治理深入推进。组织开展示范创建，命名“全国守法普法示范市（县、区）”50个，“全国民主法治示范村（社区）”4825个。深入实施乡村（社区）“法律明白人”培养工程，全国440余万名“法律明白人”充分发挥社情民意信息员、法律政策宣传员、矛盾纠纷化解员、法治实践引导员作用。(新华社)", "ctime": 1782210023, "time_str": "18:20:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260623/c677654079.shtml"}, {"id": "4576449", "title": "ST星农：公司股东筹划股份转让事宜可能导致控制权变更 公司股票将于6月24日起停牌", "content": "ST星农公告，公司股东湖州新家园投资管理有限公司、钱菊花、湖州南浔众兴实业发展有限公司、李伟红正在筹划公司股份协议转让事宜，可能导致公司控制权发生变更。公司股票将于2026年6月24日开市起停牌，预计停牌时间不超过2个交易日。", "ctime": 1782209982, "time_str": "18:19:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260623/c677654052.shtml"}, {"id": "4576405", "title": "福州长乐国际机场成为福建省首座4F级机场", "content": "6月23日，福州长乐国际机场二跑道投运，正式迈入“双跑道时代”。中国民用航空华东地区管理局当日向机场颁发新版《运输机场使用许可证》，福州长乐国际机场飞行区等级由4E提升为4F，成为福建省首座4F级机场。4F级机场是民航机场飞行区等级的最高标准，能保障空客A380、波音747等超大型飞机全载起降。（新华社）", "ctime": 1782209842, "time_str": "18:17:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260623/c677654000.shtml"}, {"id": "4576391", "title": "白阿铁路乌阿扩能改造工程隧道开始掘进", "content": "记者从中铁十一局集团了解到，23日，白阿铁路乌兰浩特至阿尔山扩能改造工程新南兴安隧道开始掘进。新南兴安隧道是全线唯一一座新建隧道，标志着白阿铁路乌兰浩特至阿尔山扩能改造工程建设取得新进展。白阿铁路乌兰浩特至阿尔山扩能改造工程建成通车后，白阿铁路设计时速达到120公里，将填补蒙东地区电气化快速铁路空白，为区域经济社会发展注入强劲动力。（新华社）", "ctime": 1782209807, "time_str": "18:16:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260623/c677653990.shtml"}, {"id": "4576377", "title": "4单商业不动产REITs获批，投资人不再“闭眼抢筹”", "content": "6月22日，证监会批复了第二批4只商业不动产REITs上市，距首批4只上市仅过去两个交易日。市场扩容节奏紧凑，但二级市场投资热度低于去年。6月18日，首批4只商业不动产REITs上市首日，平均涨幅仅为3.39%。其中，底层资产为写字楼的汇添富上海地产商业REIT周盘微涨0.02%、盘中一度破发。较2025年公募REITs新项目动辄30%的首日涨幅相比，反差鲜明。（第一财经）", "ctime": 1782209764, "time_str": "18:16:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260623/c677653968.shtml"}, {"id": "4576345", "title": "上海凯宝：控股股东及部分董事高管增持完成，累计增持0.04%股份", "content": "上海凯宝公告，公司控股股东、实际控制人穆竟伟，董事王国明，董事、董事会秘书任立旺于2026年6月22日通过集中竞价方式累计增持公司股份37.82万股，占公司总股本比例0.04%，增持金额为160.36万元。其中穆竟伟增持25.9万股（109.61万元），王国明增持71000股（30.24万元），任立旺增持48200股（20.51万元）。本次增持计划已实施完成。", "ctime": 1782209673, "time_str": "18:14:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260623/c677653932.shtml"}, {"id": "4576337", "title": "内塔尼亚胡称与伊朗对抗“尚未结束”", "content": "以色列总理内塔尼亚胡23日说，以色列与伊朗及其“代理人”的对抗“尚未结束”，以方计划“摆脱依赖”并增强自身实力。 内塔尼亚胡当天在一场与以军预备役军官学员会面的活动上说，以色列“正与伊朗及其代理人对抗”，以方已经给伊朗造成“重创”，但一切“尚未结束”。 他还说，感谢美国对以色列的支持，但以色列需要“摆脱依赖”，建立独立的军备体系并自主生产武器。事态发展将“取决于以方的实力”。(新华社)", "ctime": 1782209648, "time_str": "18:14:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260623/c677653924.shtml"}, {"id": "4576335", "title": "恒瑞医药：撤回艾玛昔替尼软膏药品注册申请", "content": "恒瑞医药公告，近日，公司收到国家药监局签发的《药品注册申请终止通知书》，同意公司撤回艾玛昔替尼软膏的药品注册申请。2025年2月，公司向国家药监局药品审评中心提交了艾玛昔替尼软膏的上市许可申请并获受理。因该药品需进一步完善申报资料，经公司与国家药品审评中心沟通后，公司决定撤回注册申请。", "ctime": 1782209631, "time_str": "18:13:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260623/c677653921.shtml"}, {"id": "4576329", "title": "东方航空上海至斯德哥尔摩直飞航线复航", "content": "中国东方航空公司上海至斯德哥尔摩直飞航线22日正式复航，这是东航时隔6年重新开通两地直飞航线。 当地时间22日晚，一架由上海浦东国际机场飞来的空客A330宽体客机搭载乘客降落在瑞典斯德哥尔摩阿兰达机场，首班客机降落后，驾驶室两侧分别升起中瑞两国国旗，庆祝航线重启。当天，这架客机搭载250余名旅客飞往上海。 据介绍，该航线每周一、四、六执行往返航班。 东航相关负责人表示，上海至斯德哥尔摩直飞航线是连接中国与瑞典的重要空中桥梁。该航线的恢复，体现了中瑞之间日益增长的交流需求，将为双方合作创造新机遇，也让两国人民之间的联系更加紧密。 瑞典机场集团相关负责人表示，该航线复航将进一步便利瑞中及欧中之间的商务、旅游和人文往来，促进两地经贸协作、文化互鉴和旅游互通。(新华社)", "ctime": 1782209554, "time_str": "18:12:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260623/c677653880.shtml"}, {"id": "4576325", "title": "三部门调拨中央救灾物资支持湖南做好救灾救助工作", "content": "6月23日，针对湖南暴雨洪涝等灾害情况，根据灾区救灾工作需要，国家防灾减灾救灾委员会办公室、应急管理部会同国家粮食和物资储备局向湖南调拨帐篷、折叠床、毛巾被、场地照明设备、夏装、雨衣雨鞋等4万件中央救灾物资，支持地方做好受灾群众安置救助和基本生活保障。（央视新闻）", "ctime": 1782209534, "time_str": "18:12:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260623/c677653877.shtml"}, {"id": "4576305", "title": "中慧生物：mRNA猴痘疫苗获中国药审中心的IND许可", "content": "中慧生物公告，继公司获美国食品药品监督管理局批准其于美国提交的临床研究用新药申请后，国家药品监督管理局药品审评中心已于2026年6月21日批准公司自主研发的mRNA猴痘疫苗候选产品的IND申请。", "ctime": 1782209440, "time_str": "18:10:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260623/c677653799.shtml"}, {"id": "4576247", "title": "新和成：拟以3亿元-6亿元回购公司股份", "content": "新和成公告，拟以3亿元-6亿元回购公司股份，回购价格不超过人民币45.5元/股。", "ctime": 1782209127, "time_str": "18:05:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260623/c677653601.shtml"}, {"id": "4576237", "title": "以总理说要摆脱对美依赖自主造武器", "content": "今天（6月23日），以色列总理内塔尼亚胡与预备役作战军官会面时表示，以色列需要摆脱对外部的依赖，建立自身独立的武器生产网络。内塔尼亚胡表示，尽管美国多年来为以色列提供支持，但以色列现在需要建立独立的武器网络，自主制造武器。内塔尼亚胡称，以色列目前正对抗伊朗及其代理人，以色列未来的走向取决于自身的实力。(CCTV国际时讯)", "ctime": 1782209105, "time_str": "18:05:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260623/c677653592.shtml"}, {"id": "4576235", "title": "恒盛能源：CVD金刚石产品营业收入占公司2025年度营业收入的比重为0.15%", "content": "恒盛能源股票交易异常波动公告，公司关注到近期市场对于培育钻石相关概念的关注度较高，2025年度公司CVD金刚石产品营业收入为152.16万元，占公司2025年度营业收入的比重为0.15%，敬请广大投资者关注二级市场交易风险，理性决策，审慎投资。", "ctime": 1782209105, "time_str": "18:05:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260623/c677653590.shtml"}, {"id": "4576233", "title": "财政部副部长廖岷会见标普国际信用评级公司主权信用评级全球主管罗伯托·西丰—阿雷瓦罗", "content": "2026年6月16日，财政部副部长廖岷在北京会见标普国际信用评级公司主权信用评级全球主管罗伯托·西丰—阿雷瓦罗，双方就中国宏观经济韧性、中美双边关系、中东局势影响等议题进行了交流。(财政部)", "ctime": 1782209056, "time_str": "18:04:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260623/c677653561.shtml"}, {"id": "4576217", "title": "四川宜宾市珙县发生3.4级地震", "content": "中国地震台网正式测定：6月23日17时56分，在四川宜宾市珙县（北纬28.42度，东经104.82度）发生3.4级地震，震源深度10公里。（央视新闻）", "ctime": 1782209031, "time_str": "18:03:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260623/c677653547.shtml"}, {"id": "4576209", "title": "三部门：加大金融资源投入力度，助力妇女就业发展", "content": "中国人民银行、金融监管总局、全国妇联印发《关于进一步加强金融支持妇女就业发展的实施意见》（以下简称《实施意见》）。《实施意见》提出，要加大金融资源投入力度，助力妇女就业发展。加强创业孵化基地等创业载体建设融资支持，为女性创业项目落地提供保障。鼓励各地结合实际优化创业担保贷款政策，对信用良好的女性创业者适当降低或取消反担保要求。拓宽妇女就业创业多元化融资渠道，支持符合条件的妇女创业企业注册发行债务融资工具、开展供应链票据业务。优化教育培训金融服务，提升妇女就业发展能力。用好国家助学贷款政策，规范开展研究生商业性助学贷款业务，支持女性接受高等教育。加强对职业院校等培训机构的融资支持，探索“培训+信贷”模式，支持妇女参加职业技能培训、提升金融知识素养。", "ctime": 1782209015, "time_str": "18:03:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260623/c677653538.shtml"}, {"id": "4576187", "title": "GSMA预计2030年移动技术对中国经济贡献达2万亿美元", "content": "MWC26上海（世界移动通信大会上海）将在6月24日开幕。大会开幕前夕，GSMA （全球移动通信系统协会）发布《2026 中国移动经济发展》报告。数据显示，中国5G连接数在全球比重已逾40%；2025年移动技术为中国创造了1.5万亿美元的经济价值，占GDP的7.2%，预计到2030年这一数字将攀升至2.1万亿美元。\nGSMA 大中华区总裁斯寒表示：“中国5G连接数在全球比重已超过40%；2025年移动技术为中国创造了1.5万亿美元的经济价值。这些数字折射出移动产业早已超越连接范畴，进化为无处不在的基础能力，成为赋能生产力提升、深化 AI 驱动服务、引领可持续经济增长的关键底座。”(澎湃新闻)", "ctime": 1782208903, "time_str": "18:01:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260623/c677653487.shtml"}, {"id": "4576181", "title": "伊朗称将继续追究参与侵略伊朗者的责任", "content": "据伊朗伊斯兰共和国通讯社23日报道，伊朗外交部发言人巴加埃当天表示，某些中东地区国家参与美国和以色列侵略伊朗的战事，伊朗将继续追究其责任。\n\n巴加埃说，伊朗有足够的证据证明某些地区国家参与袭击伊朗，伊朗“绝不会放弃这个问题”，将追究其法律责任，并提出相应要求。(新华社)", "ctime": 1782208884, "time_str": "18:01:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260623/c677653481.shtml"}, {"id": "4576167", "title": "字节新一代豆包手机供应链信息曝光 发布时间或延迟", "content": "记者从知情人士处获悉，由中兴通讯与字节共同推进的新一代豆包AI手机或较既定发布时间有所延长，究其原因与备案认证流程有关。据悉，与普通手机不同，这款产品需要同时闯过两道关口：一是网信部门负责的大模型备案；二是工信部主管的手机终端入网认证。记者获悉该手机相关供应链信息，其中屏幕供应商已由前一代的深天马，更换为京东方。相关人士并未知悉具体更换原因，仅表示，“现在屏幕厂商之间抢单情况严重”。电池方面，德赛电池成为新一代豆包手机的供应商，采用ATL电芯，而德赛电池是苹果、三星等品牌的电池管理系统核心供应商，ATL则是全球消费锂电池领域的领先企业。代工方面，新一代豆包手机由A股上市公司福日电子旗下中诺通讯承担。据了解，该公司长期为中兴提供ODM/OEM服务，是努比亚品牌的重要代工厂。 (蓝鲸新闻)", "ctime": 1782208848, "time_str": "18:00:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260623/c677653473.shtml"}, {"id": "4576165", "title": "阿里云上调.co域名注册价格", "content": "阿里云公告，因域名上游注册局成本上调，经慎重考虑，现决定于2026年7月1日零时，对.co域名进行价格调整。.co 注册价格调整为120元/首年，续费和转入价格调整为249元/年。", "ctime": 1782208836, "time_str": "18:00:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260623/c677653469.shtml"}, {"id": "4576147", "title": "商务部：1—5月全国网上商品零售额增长5.0%", "content": "2026年以来，商务部以“政策+活动”双轮驱动，推动电子商务平稳创新发展，持续发挥数据、技术、场景优势，更好赋能产业数字化转型，开拓对外开放新空间，推动做强做优做大实体经济。赋能制造业向好向新。培育产业电商，持续开展“电商+产业带”对接，发挥电子商务精准匹配优势，提升产业带商品供需适配性，助力企业数智化制造。据国家统计局数据，1—5月全国网上商品零售额增长5.0%，对社会消费品零售总额增长贡献率88.3%。据商务大数据监测，1—5月智能助行外骨骼和智能眼镜网上零售额分别增长560.5%和165.9%。（央视新闻）", "ctime": 1782208819, "time_str": "18:00:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260623/c677653467.shtml"}, {"id": "4576109", "title": "力量钻石：“金刚石散热材料”关注度较高，该应用场景尚未达到大规模市场化应用阶段", "content": "力量钻石股票交易异常波动公告，近期“金刚石散热材料”关注度较高。截止目前，该应用场景尚未达到大规模市场化应用阶段，市场化进度尚存在重大不确定性，未对公司主营业务及收入产生影响，请投资者注意投资风险。", "ctime": 1782208742, "time_str": "17:59:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260623/c677653421.shtml"}, {"id": "4576105", "title": "阿拉伯国家欢迎美伊签署谅解备忘录", "content": "第165届阿拉伯国家联盟（阿盟）外长理事会例会续会22日在约旦首都安曼召开，与会国家外长欢迎美国和伊朗签署谅解备忘录。 约旦副首相兼外交大臣萨法迪在会后召开的联合新闻发布会上说，有必要继续在瑞士进行谈判，以寻求全面解决危机的方案，消除近期地区紧张局势的根源。 巴林外交大臣扎耶尼表示，阿拉伯国家认为美伊谅解备忘录是一个积极信号，有助于缓和紧张局势，并为达成更全面的协议铺平道路。他强调，必须全面遵守谅解备忘录的各项条款，尊重本地区各国的主权，确保霍尔木兹海峡的航行自由。 扎耶尼说，阿拉伯国家之间亟需加强磋商与协调，这将有助于阿拉伯世界形成统一立场，维护阿拉伯国家安全，并回应人民对安全、稳定和发展的渴望。(新华社)", "ctime": 1782208662, "time_str": "17:57:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260623/c677653385.shtml"}, {"id": "4576103", "title": "片仔癀：肠激安胶囊Ⅲ期临床试验完成首例试验参与者入组", "content": "片仔癀公告，近日，公司研发的1.1类中药创新药肠激安胶囊顺利完成“肠激安胶囊治疗腹泻型肠易激综合征（肝气乘脾证）有效性和安全性的多中心、随机、双盲、安慰剂对照Ⅲ期临床试验”首例试验参与者入组工作，正式进入Ⅲ期临床试验。", "ctime": 1782208650, "time_str": "17:57:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260623/c677653380.shtml"}, {"id": "4576101", "title": "申通快递：拟以3.5亿元-4.5亿元回购公司股份", "content": "申通快递公告，拟使用自有资金和自筹资金通过集中竞价方式回购公司股份，回购资金总额不低于人民币3.5亿元且不超过人民币4.5 // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
