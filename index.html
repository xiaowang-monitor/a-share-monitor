<style>
:root {

* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Noto Sans SC', sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  min-height: 100vh;
}
.mono { font-family: 'JetBrains Mono', monospace; }
.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 20px;
  transition: all 0.2s;
}
.card:hover { background: var(--bg-card-hover); border-color: #334155; }
.badge {
  display: inline-flex; align-items: center; padding: 2px 8px;
  border-radius: 6px; font-size: 12px; font-weight: 500;
}
.badge-s { background: rgba(239,68,68,0.2); color: #ef4444; }
.badge-a { background: rgba(245,158,11,0.2); color: #f59e0b; }
.badge-b { background: rgba(59,130,246,0.2); color: #3b82f6; }
.badge-c { background: rgba(100,116,139,0.2); color: #94a3b8; }
.score-bar {
  height: 6px; border-radius: 3px; background: #1e293b; overflow: hidden;
}
.score-bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s; }
.up { color: var(--red); }
.down { color: var(--green); }
.pulse { animation: pulse 2s infinite; }
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}
.glow { box-shadow: 0 0 20px rgba(59,130,246,0.15); }
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg-primary); }
::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
</style>

              <th class="text-right py-2 px-1">评分</th>
              <th class="py-2 px-1 text-center" style="min-width:160px">评分分布</th>
              <th class="text-right py-2 px-1">板块</th>
              <th class="text-right py-2 px-1">连涨</th>
            </tr>
          </thead>
          <tbody id="picks-table"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- 新闻流 + 交易代理 -->
<div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
  <div class="card">
    <h2 class="text-sm font-medium text-gray-400 mb-4">实时新闻流</h2>

</div>

2001, "time_str": "19:13:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261112/c681766046.shtml"}, {"id": "5644917", "title": "全国支持小微企业融资协调工作机制培训会在广西南宁举办", "content": "11月10日，国家发展改革委财政金融和信用建设司、金融监管总局普惠金融司在广西南宁召开全国支持小微企业融资协调工作机制培训会，总结交流工作机制成效，并就下一步推动小微企业金融服务实现稳投放、优结构、提质量、可持续作出安排部署。会议指出，工作机制运行两年来，推动完善跨部门“联合会诊”机制，持续加大对服务业等重点领域投入，小微企业融资难、融资贵等问题得到缓解。会议要求各地专班树立和践行正确政绩观，拓展融资对接渠道，深化信用信息共享，提升小微企业金融服务获得感和满意度。（界面新闻）", "ctime": 1794481935, "time_str": "19:12:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261112/c681766031.shtml"}, {"id": "5644901", "title": "星徽股份：一审判决驳回六名原告全部诉讼请求", "content": "星徽股份公告，公司此前披露六名原告就损害公司债权人利益责任纠纷起诉公司及三家子公司，要求对人民币8546.53万元赔偿款承担连带清偿责任。本次公司收到一审民事判决书，法院判决驳回六名原告的全部诉讼请求，公司及子公司无需承担连带清偿责任。该判决尚未生效，最终结果仍存在不确定性。", "ctime": 1794481869, "time_str": "19:11:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261112/c681765953.shtml"}, {"id": "5644873", "title": "天赐材料：拟以5000万元-1亿元回购公司股份", "content": "天赐材料公告，拟以自有资金和自筹资金（含商业银行回购专项贷款等），通过集中竞价方式回购公司A股股份，回购资金总额不低于5000万元且不超过1亿元，回购价格不超过45元/股。回购股份将全部用于注销并减少公司注册资本，实施期限为股东会审议通过方案之日起不超过12个月。本方案已获董事会审议通过，尚需股东会审议。", "ctime": 1794481782, "time_str": "19:09:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261112/c681765675.shtml"}, {"id": "5644831", "title": "黑龙江绿色有机食品认定面积突破1亿亩", "content": "黑龙江农业农村厅副厅长朱华生在“中国经济圆桌会”中表示，黑龙江绿色有机食品认定面积已突破1亿亩。黑龙江打造“黑土优品”省级优质农业公共品牌，已授权企业237家，746款产品获认证，年销售额突破百亿元；在全国率先整省推进定制农业，覆盖高端大米、有机果蔬等10余个优势品类227个具体品种，定制基地面积达180万亩。黑龙江省委、省政府已出台新一轮农产品精深加工业高质量发展三年行动计划及配套政策。（新华社）", "ctime": 1794481633, "time_str": "19:07:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261112/c681765477.shtml"}, {"id": "5644819", "title": "怡达股份：控股股东一致行动人沈桂秀所持12.28%股份由子女继承，刘准仍为实控人", "content": "怡达股份公告，公司控股股东、实际控制人刘准之母亲沈桂秀去世，其生前持有的公司股份2023.6万股（占总股本12.28%）由子女继承：刘准继承420万股，刘坚继承1253.6万股，刘冰继承100万股，刘芳继承250万股。本次权益变动后，刘准持股比例由20.80%增至23.35%，并通过与刘坚签署的《一致行动协议》控制公司8.75%表决权，合计控制32.10%表决权，仍为公司控股股东、实际控制人，不涉及控制权变更。截至公告披露日，过户手续尚未办理完成。", "ctime": 1794481550, "time_str": "19:05:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261112/c681765447.shtml"}, {"id": "5644815", "title": "天赐材料：子公司拟投资不超50亿元建设年产50万吨电解液及配套材料项目", "content": "天赐材料公告，公司于2026年11月12日召开第七届董事会第八次会议，审议通过了关于投资建设年产50万吨电解液及配套材料项目的议案，同意子公司池州天赐高新材料有限公司或其子公司使用自筹资金投资建设该项目。项目总投资不超过50亿元，其中建设投资不超过35亿元，项目建设周期为24个月，建设地点为安徽东至经济开发区香荷大道。项目主要产品规模包括电解液50万吨/年（其中锂离子电池电解液400000吨/年、钠离子电池电解液100000吨/年）、液体六氟磷酸锂30万吨/年、液体六氟磷酸钠10万吨/年、双氟磺酰亚胺锂/折固70000吨/年、双氟磺酰亚胺钠/折固30000吨/年及其他上游配套材料43.2万吨/年。该事项无需提交公司股东会审议。", "ctime": 1794481543, "time_str": "19:05:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261112/c681765446.shtml"}, {"id": "5644809", "title": "蓝盾光电：拟发行股份及支付现金收购岚创科技100%股权，交易作价13.5亿元", "content": "蓝盾光电公告，公司拟通过发行股份及支付现金方式购买郑燕飞等7名交易对方合计持有的苏州岚创科技有限公司100%股权，并向不超过35名特定投资者发行股份募集配套资金不超过7亿元。本次交易作价13.5亿元，其中现金对价6.08亿元、股份对价7.42亿元。标的公司主营高性能真空镀膜设备研发制造，2026年1-8月实现营业收入2.62亿元、净利润1.47亿元。本次交易构成关联交易及重大资产重组，不构成重组上市。", "ctime": 1794481527, "time_str": "19:05:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261112/c681765438.shtml"}, {"id": "5644787", "title": "俄国防部称继续打击乌克兰军工和能源设施", "content": "俄国防部12日发布通报称，俄军使用陆基高精度武器和远程攻击型无人机继续打击乌克兰境内军工和能源设施，包括基辅市和基辅州负责生产和组装无人机的工厂、基辅州一处生产战役战术导弹所用固体火箭燃料组件的工厂、一处生产无人机所用固体燃料助推器的工业设施，以及日托米尔市两处变电站，还打击了驶往敖德萨港、用于为乌军运输物资的干货船。过去一夜，俄防空部队在俄别尔哥罗德州、布良斯克州、库尔斯克州等地拦截并摧毁71架乌克兰固定翼无人机。（新华社）", "ctime": 1794481457, "time_str": "19:04:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", source": "", "url": "https://news.10jqka.com.cn/20261112/c681764987.shtml"}, {"id": "5644431", "title": "三季度iPad国内销量大跌45.2%", "content": "据洛图科技《中国智能平板零售市场月度追踪》报告，2026年第三季度中国消费级智能平板市场全渠道销量为636.1万台，同比下降20.1%；该机构预测全年销量为2582万台，同比下滑20.8%。其中苹果单季销量同比大幅下滑45.2%，市场份额同比下滑8.5个百分点至19.1%，仍居当季主流电商销售额首位。（财联社）", "ctime": 1794480316, "time_str": "18:45:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261112/c681764967.shtml"}, {"id": "5644337", "title": "返利科技：公司生产经营未发生重大变化", "content": "返利科技公告，公司股票于2026年11月10日至12日连续三个交易日内日收盘价格涨幅偏离值累计超过20%，属于股票交易异常波动。经自查及问询控股股东、实际控制人，除已披露的控制权变更相关事项外，公司及相关方不存在其他应披露而未披露的重大信息；公司生产经营未发生重大变化，未发现可能或已经对股价产生直接影响的媒体报道、市场传闻或热点概念事项。公司主营在线导购及广告业务，受行业整体下滑影响，2026年前三季度净利润为负，并提示电商格局、流量竞争、消费市场调整、渠道成本及投放平台政策等因素可能带来业绩波动风险。", "ctime": 1794479728, "time_str": "18:35:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261112/c681764765.shtml"}, {"id": "5644317", "title": "振邦智能：越南振邦签订7061.3万元施工合同", "content": "振邦智能公告，公司此前同意全资孙公司振邦科技（越南）有限公司在越南建设生产基地，投资金额不超过2050万美元。近日，越南振邦与FANCONS建筑总承包股份有限公司签订施工合同，合同金额为271.040.000.000越南盾（含税），折合人民币约7061.3万元，工期为420日历天，款项按工程进度分期支付。项目面临建设延期、投资超预算及海外经营等风险。", "ctime": 1794479635, "time_str": "18:33:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261112/c681764730.shtml"}, {"id": "5644309", "title": "花旗连续下调英伟达目标价", "content": "花旗将英伟达目标价从285美元下调至225美元。花旗此前于11月10日将英伟达目标价从315美元下调至285美元。", "ctime": 1794479548, "time_str": "18:32:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261112/c681764700.shtml"}, {"id": "5644287", "title": "嘉友国际：联合体拟与刚果（金）国家运输局签订合作备忘录，推进西部运输走廊多式联运项目", "content": "嘉友国际公告，公司与THIRTY FIVE LOGISTIQUE LLC组成的联合体拟与刚果（金）国家运输局（ONATRA SA）签订合作备忘录，共同推进刚果（金）西部运输走廊的多式联运项目。备忘录旨在确认合作意向、明确合作框架，为后续探索具备商业可行性的公私合作伙伴关系（PPP）奠定基础。双方拟优先推进港口设备现代化、全长366公里的马塔迪—金沙萨铁路修复及联合运营、旱港及陆路物流平台建设、内河港口建设及运营、河道交通运营等合作事项。本次合作处于意向及框架阶段，正式合作协议能否签署尚存在不确定性。", "ctime": 1794479484, "time_str": "18:31:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261112/c681764676.shtml"}, {"id": "5644253", "title": "*ST纳川：预重整方案表决期限延期至2026年11月20日", "content": "*ST纳川公告，公司此前于2026年10月8日启动预重整方案及相关议案表决，表决期限原定至2026年11月11日。因部分债权人无法在表决期限内完成内部决策程序，临时管理人决定将表决期限延期至2026年11月20日，债权人在2026年11月20日（含当日）之前进行表决的仍然有效，表决方式、表决规则等与原《表决通知》规定一致。", "ctime": 1794479400, "time_str": "18:30:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261112/c681764547.shtml"}, {"id": "5644251", "title": "理奇智能：选举陆浩东为董事长并聘任其为总经理，独立董事津贴调整为每人每年12万元", "content": "理奇智能公告，公司第二届董事会第一次会议于2026年11月12日召开，应出席董事8人，实际出席8人。会议选举陆浩东担任公司董事长，并聘任陆浩东为总经理，聘任王闻敬、戈文华为副总经理，聘任王德志为财务总监，聘任俞大奎为董事会秘书，聘任周英为证券事务代表，任期均至第二届董事会任期届满之日止。会议同意将第二届董事会独立董事津贴标准由税前每人每年8万元人民币调整为税前每人每年12万元人民币，自股东会审议通过之日起开始执行，关联董事文学舟、周勤、尤璞回避表决，该议案尚需提交公司股东会审议通过。会议还审议通过2027年度高级管理人员薪酬方案，关联董事陆浩东回避表决；2027年度董事薪酬方案因全体董事回避表决，将直接提交公司2026年第四次临时股东会审议。董事会拟定于2026年11月30日召开2026年第四次临时股东会。", "ctime": 1794479391, "time_str": "18:29:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261112/c681764545.shtml"}, {"id": "5644233", "title": "华虹宏力：拟以3亿元-5亿元回购公司股份", "content": "华虹宏力公告，拟以3亿元-5亿元回购公司股份，回购价格不超过255.55元/股。回购股份的用途为用于股份注销。回购资金来源为公司自有资金及/或自筹资金。按回购金额上限5亿元、回购价格上限255.55元/股测算，预计回购股份数量约195.66万股，约占总股本的0.1015%；按回购金额下限3亿元测算，预计回购股份数量约117.39万股，约占总股本的0.0609%。本次回购方案尚需公司注册地监管部门豁免同意并经股东会批准通过。", "ctime": 1794479319, "time_str": "18:28:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261112/c681764527.shtml"}, {"id": "5644231", "title": "中际旭创：全资子公司拟5000万元认购光合叁期基金3.28%出资份额", "content": "中际旭创公告，全资子公司中际旭创（上海）投资有限公司拟以自有资金5000万元认购杭州光合叁期创业投资合伙企业（有限合伙）的出资份额，并成为该合伙企业的有限合伙人，本次投资完成后将持有合伙企业3.28%的出资份额。该基金本次出资后认缴出资总额为15.26亿元。本次对外投资事项在公司总裁对外投资审批权限内，无需经董事会及股东会审议，不涉及关联交易，不构成重大资产重组。基金主要投资于人工智能、硬科技、新材料和绿色科技、医疗科技、绿色低碳及前沿科技等领域的早期及成长期项目，初始存续期限为8年，其中前4年为投资期。公司表示，本次投资将持续拓展公司在科技领域的投资布局，短期内对公司的经营业绩不会产生重大影响。", "ctime": 1794479311, "time_str": "18:28:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261112/c681764524.shtml"}, {"id": "5644219", "title": "通力科技：持股5%以上股东温州通途累计减持0.76%股份，权益变动触及1%整数倍", "content": "通力科技公告，持股5%以上股东温州通途企业管理咨询中心（有限合伙）此前披露减持计划，拟自公告之日起15个交易日后的3个月内减持不超过321.36万股，占公司总股本的2.11%。近日公司收到温州通途告知函，其于2026年10月8日至2026年11月12日期间通过集中竞价交易方式和大宗交易方式累计减持公司股份116.49万股，占公司总股本的0.76%，温州通途及其一致行动人合计持股比例由73.75%降至72.99%，权益变动触及1%的整数倍。本次减持与此前已披露的减持计划一致。", "ctime": 1794479289, "time_str": "18:28:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261112/c681764518.shtml"}, {"id": "5644185", "title": "金房能源：控股股东杨建勋等终止协议转让10.46%股份", "content": "金房能源公告，公司控股股东、实际控制人杨建勋及其一致行动人魏澄、付英、丁琦此前于2026年1月4日分别与富强资产、能敬资本签署《股份转让协议》，杨建勋拟向富强资产转让825.7万股（占公司总股本的5.27%），魏澄、付英、丁琦拟向能敬资本转让合计814.57万股（占公司总股本的5.19%）。截至公告披露日，上述拟协议转让的股份尚未办理过户登记手续，且深圳证券交易所出具的《上市公司股份协议转让确认书》已过有效期，故终止本次协议转让事项。", "ctime": 1794479151, "time_str": "18:25:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261112/c681764468.shtml"}, {"id": "5644167", "title": "天安新材：拟收购嘉万光62.5%股权交易存不确定性", "content": "天安新材公告，公司股票于2026年11月11日、11月12日连续两个交易日内收盘价格涨幅偏离值累计超过20%，属于股票交易异常波动情形。公司拟以增资及股权转让的方式收购深圳市嘉万光通信有限公司62.5%股权，本次交易完成后嘉万光将成为公司控股子公司，纳入公司合并报表范围；本次签署的股权收购意向协议仅为交易各方就本次收购事宜达成的初步意向，标的公司财务数据尚未经审计、评估，本次交易最终能否达成尚存在不确定性，且公司与标的公司主营业务分属不同行业，公司面临一定的收购整合风险，本次交易预计形成一定金额的商誉，可能面临商誉减值风险。2026年前三季度，公司实现营业收入19.94亿元，同比下降12.28%；归属于上市公司股东的净利润3690.52万元，同比下降62.16%；扣除非经常性损益的净利润2884.07万元，同比下降69.67%。经自查，公司目前生产经营活动正常，主营业务及商业模式未发生重大变化；除上述事项外，不存在其他应披露而未披露的重大信息。", "ctime": 1794479087, "time_str": "18:24:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261112/c681764442.shtml"}, {"id": "5644157", "title": "*ST卓然：公司及全资子公司被诉，涉供应链保理融资本金8011.79万元", "content": "*ST卓然公告，公司近日收到上海市黄浦区人民法院送达的传票、《民事起诉状》及相关材料，上海农村商业银行股份有限公司黄浦支行就供应链保理合同纠纷，将公司及两家全资子公司卓然（靖江）设备制造有限公司、上海卓然数智能源有限公司列为共同被告提起民事诉讼，法院已立案受理，尚未开庭审理。原告诉请判令公司支付供应链保理融资本金合计人民币8011.79万元，并以该本金为基数按约定融资利率上浮50%计算逾期利息至实际清偿之日止；支付本案律师费人民币15万元；卓然靖江、卓然数智对公司上述第1-2项全部债务承担连带清偿责任；本案全部诉讼费用由三被告共同承担。原告称2025年6-12月以无追索权保理方式受让部分供应商对三被告的应收账款，涉及本金合计8011.79万元，后部分保理业务到期，三被告未能按期兑付。公司表示，本案尚未开庭审理，判决结果存在不确定性，对公司本期利润或期后利润的影响尚无法准确判断。", "ctime": 1794479031, "time_str": "18:23:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261112/c681764424.shtml"}, {"id": "5644139", "title": "好利科技：厦门市财政局原则同意收购方案，控制权拟变更事项获批复", "content": "好利科技公告，公司控股股东旭升亚洲投资有限公司及实际控制人汤奇青于2026年7月2日与厦门产投科技创新投资合伙企业（有限合伙）签署《股份转让协议》，旭升投资拟通过协议转让方式向产投科创转让其持有的公司3293.46万股股份（占公司总股本的18.00%）。本次权益变动完成后，公司控股股东将由旭升投资变更为产投科创，实际控制人将由汤奇青变更为厦门市财政局。今日，公司收到产投科创通知，厦门市财政局出具《关于厦门金圆投资集团有限公司收购好利科技有关事项的通知》，原则同意本次收购好利科技的方案。本次权益变动尚需取得深圳证券交易所就本次权益变动出具的合规性确认意见、在中国证券登记结算有限责任公司深圳分公司办理协议转让股份过户相关手续，最终能否实施完成及完成时间尚存在不确定性。", "ctime": 1794478923, "time_str": "18:22:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261112/c681764396.shtml"}, {"id": "5644135", "title": "美格智能：参股公司宏芯宇11月12日在港交所主板上市，预计影响2026年净利润约8847万元", "content": "美格智能公告，公司全资子公司深圳市美格智投创业投资有限公司参股的深圳宏芯宇电子股份有限公司于2026年11月12日在香港联交所主板挂牌上市，股票代码02681.HK，上市股份类别为普通股（H股），本次全球发售1471.72万股H股，发行价格为72.83港元/股。美格智投于2020年对宏芯宇进行投资，目前持有宏芯宇300万股股份，禁售期为自宏芯宇上市后12个月。公司将该部分股份划分为“以公允价值计量且其变动计入当期损益的金融资产”，列报于“其他非流动金融资产”科目。以宏芯宇11月12日收盘价为基准初步估算，公司持有的该部分股份预计对公司2026年度归属于上市公司股东的净利润影响金额约为8847万元，约占2025年度公司经审计归属于上市公司股东的净利润的61.99%。受股票二级市场价格波动影响，所持股份公允价值也会相应变动，对公司经营业绩的影响存在不确定性，最终以公司定期报告为准。", "ctime": 1794478901, "time_str": "18:21:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261112/c681764390.shtml"}, {"id": "5644099", "title": "月之暗面金融行业与生态负责人徐天天：AI迭代速度将继续加快", "content": "11月12日晚间，在今日“以发展应变局”为主题的第十七届财新峰会上，月之暗面金融行业与生态负责人徐天天发表讲话。针对“AI迭代速度是否还会加快”的问题，她表示当前整个AI智能远远未达到上限，背后有三条增长曲线：预训练算力曲线、后训练与推理端曲线（AI已从快思考转变为慢思考，展现思考链路）、智能体设计曲线（智能体设计越来越复杂，将导致智能上限提高）。三条曲线都在增长，三者叠加导致AI迭代速度加快。（新浪科技）", "ctime": 1794478771, "time_str": "18:19:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261112/c681764339.shtml"}, {"id": "5644087", "title": "青岛出台科技成果转化概念验证奖补实施细则", "content": "近日，《青岛市科技成果转化概念验证奖补实施细则》出台，明确青岛市科技局每年在科技专项资金中安排经费，以最高200万元的力度，对建设成效优秀的概念验证服务单位进行奖补。（人民财讯）", "ctime": 1794478698, "time_str": "18:18:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261112/c681764310.shtml"}, {"id": "5644083", "title": "航天晨光：2026年第三季度业绩说明会召开，内部整合10月经董事会审议通过后加速推进", "content": "航天晨光公告，公司于2026年11月12日以网络文字互动形式召开2026年第三季度业绩说明会。关于下属公司内部整合，公司回复称内部整合从2026年第二季度开始论证，10月经八届四次董事会审议通过后加速推进，目前正在整合过渡阶段。关于业绩，公司称前三季度经营基本面逐步改善，力争实现年度经营目标。关于在手订单，公司称正按照合同约定正常生产交付。此外，公司在核工及核电站配套、固定式液氢储罐、航天技术应用等新兴产业已实现一批项目签约落地，将在2026年度形成收入。", "ctime": 1794478674, "time_str": "18:17:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261112/c681764297.shtml"}, {"id": "5644081", "title": "东方中科：业绩承诺补偿仲裁强制执行完成，4279.73万股已司法扣划过户", "content": "东方中科公告，公司此前披露就发行股份购买北京万里红科技有限公司78.33%股权事项中十四名交易对方业绩承诺补偿争议申请强制执行。近日公司收到中国证券登记结算有限责任公司出具的《证券过户登记确认书》，十四名被申请人根据仲裁结果应补偿的42797306股股份已司法扣划至公司回购股份专用证券账户，占公司总股本14.36%。上述司法保全冻结股份及剩余冻结股份已同时解除冻结。公司将尽快完成上述股份注销及剩余限售股份解除限售事宜。", "ctime": 1794478666, "time_str": "18:17:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261112/c681764292.shtml"}, {"id":   if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
