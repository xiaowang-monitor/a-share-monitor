1.41%。", "ctime": 1782711073, "time_str": "13:31:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260629/c677784838.shtml"}, {"id": "4612547", "title": "COMEX白银期货跌超2%", "content": "COMEX白银期货跌超2%，现报58.41美元/盎司。", "ctime": 1782711047, "time_str": "13:30:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260629/c677784817.shtml"}, {"id": "4612521", "title": "半导体设备板块再度拉升 创元科技等多股涨停", "content": "午后半导体设备板块再度拉升，创元科技涨停，华海清科涨超10%，均创历史新高，此前金海通、华亚智能、柏诚股份涨停，正帆科技、京仪装备、华峰测控、富创精密等快速冲高。消息面上，三星和SK海力士将在800万亿韩元项目中各自建设2座芯片工厂。", "ctime": 1782711015, "time_str": "13:30:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260629/c677784804.shtml"}, {"id": "4612511", "title": "摩根大通将2026年英国富时100指数的年末目标从10300点上调至11000点", "content": "摩根大通将2026年英国富时100指数的年末目标从10300点上调至11000点；将2026年末斯托克600指数目标上调至680点，此前为630点。(蓝鲸新闻)", "ctime": 1782710862, "time_str": "13:27:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260629/c677784745.shtml"}, {"id": "4612471", "title": "韩国政府：预计将投资约800万亿韩元在韩国西南部建设四座芯片工厂", "content": "韩国政府：预计将在西南部建设四座芯片厂，投资约800万亿韩元(约3.5万亿人民币)；三星电子将新建两座半导体工厂，SK海力士将新建两座工厂；预计未来15年在芯片领域的投资将至少达到30万亿韩元，包括下一代内存、边缘人工智能和国防等领域。", "ctime": 1782710566, "time_str": "13:22:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260629/c677784657.shtml"}, {"id": "4612455", "title": "韩国部长称，预计在五年内将DRAM生产能力翻倍", "content": "韩国部长称，预计在五年内将DRAM生产能力翻倍。（财联社）", "ctime": 1782710490, "time_str": "13:21:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260629/c677784635.shtml"}, {"id": "4612451", "title": "市场人士：央行隔夜逆回购“给量不给价”的做法，体现了央行有意在工具推出初期管理市场预期、防止政策信号被过度解读的意图", "content": "隔夜逆回购操作靴子落地，但市场最关注的价格并未如期揭晓。6月29日，央行在公开市场操作中正式启用隔夜逆回购操作品种。公告显示，央行当日以固定利率、数量招标方式开展了1575亿元7天期逆回购操作，操作利率为1.40%，同时开展了3000亿元隔夜逆回购操作。不过，公告未同步披露隔夜逆回购的操作利率。市场此前普遍预期，央行将在今日公告中同步披露该利率，多数机构预测区间在1.30%—1.35%，“给量不给价”的做法引发广泛关注。一位大行金融市场部人士对记者表示，央行增加隔夜逆回购工具的本意是平滑市场，而非制造新的预期扰动，或是央行有意在工具推出初期保持信号清晰度，防止政策意图被市场误读。从市场表现来看，上周五DR001已回落至政策利率1.4%下方，此时公布隔夜逆回购利率，无论定在1.4%还是低于1.4%，都可能对市场定价产生较大扰动。一位农商行金融市场部人士告诉记者，从近期公开表态来看，央行更希望把隔夜逆回购作为中性政策推出，“从根本上看，经济基本面和政策取向仍然支持维持宽松的货币政策环境，但央行不希望宽松预期以过快、过猛的方式在金融市场上集中释放和传导。”还有券商固收人士认为，央行选择当前不公布利率，实际上也是在向市场传递一个清晰信号：隔夜逆回购在当前阶段的定位更侧重于月末流动性管理工具，不宜将其解读为“类降息”或政策利率调整的信号。（21财经）", "ctime": 1782710443, "time_str": "13:20:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260629/c677784603.shtml"}, {"id": "4612431", "title": "韩国总统李在明：将指派官员进驻青瓦台，并亲自监督三大工程", "content": "韩国总统李在明：将指派官员进驻青瓦台，并亲自监督三大工程。（新浪财经）", "ctime": 1782710197, "time_str": "13:16:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260629/c677784514.shtml"}, {"id": "4612423", "title": "返利科技盘中上演“天地板”", "content": "返利科技盘中上演“天地板”，公司此前已连续3日涨停。", "ctime": 1782710117, "time_str": "13:15:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260629/c677784486.shtml"}, {"id": "4612411", "title": "消息称斯塔默有意竞逐下任北约秘书长", "content": "据英国《观察家报》28日报道，近来辞去英国工党党首职务的英首相斯塔默或有意于2028年竞逐北约秘书长一职。现任北约秘书长吕特将于2028年任期届满，届时须获得全体32个成员国一致同意才可连任，否则秘书长一职将出现空缺。新秘书长的遴选通过成员国之间的非正式外交磋商展开，人选敲定则须获得全体成员国一致同意。（央视新闻）", "ctime": 1782710055, "time_str": "13:14:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260629/c677784474.shtml"}, {"id": "4612409", "title": "欧洲“炙烤模式”持续中国空调成了抢手货", "content": "据央视新闻，近日，欧洲多地遭遇持续高温天气，多地打破高温纪录，发布高温预警。高温天气下，中国制造的移动空调、电扇等纳凉产品销量激增，甚至“一机难求”。根据德国气象局公布的初步数据，德国东部默肯-德雷维茨地区27日测得的气温达41.5摄氏度，刷新最高气温纪录。德国持续高温导致多地高速公路路面受损，不少路段实施封闭或限速，铁路部门当天呼吁民众减少长途旅行。持续的热浪侵袭让英国6月24日至26日高温纪录连续三天被刷新，在26日达到37.3摄氏度。26日，英格兰和威尔士超千所学校完全停课或部分停课。法国已连续数日遭遇热浪，法国西部气温已升至43摄氏度，创下法国6月有记录以来的最高气温。", "ctime": 1782709991, "time_str": "13:13:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260629/c677784460.shtml"}, {"id": "4612401", "title": "智谱港股跌超5%", "content": "智谱港股跌5.03%，报1943.00港元。", "ctime": 1782709940, "time_str": "13:12:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260629/c677784447.shtml"}, {"id": "4612397", "title": "李在明：韩国需要加快芯片生产基地建设以满足需求 西南地区将在新项目中投资5万亿至20万亿韩元", "content": "韩国总统李在明称，芯片和人工智能领域竞争非常激烈，韩国需要加快芯片生产基地建设以满足需求；将通过投资西南地区扩大芯片供应能力，西南地区将在新项目中投资5万亿至20万亿韩元，光州、全罗可能在项目中投资520万亿韩元。（财联社）", "ctime": 1782709905, "time_str": "13:11:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260629/c677784410.shtml"}, {"id": "4612259", "title": "轻舟试验飞船第二批在轨试验成果发布", "content": "今天（29日），由中国科学院微小卫星创新研究院抓总研制的轻舟试验飞船第二批在轨试验成果发布。轻舟试验飞船于2026年3月30日成功发射，并于4月15日发布了首批在轨试验成果。这批成果覆盖太空精密检测、航天降本增效、未来太空医院、太空生物培养等领域，将为我国空间新技术落地应用、空间站安全高效运行维护以及太空资源利用等提供技术支撑。（央视新闻）", "ctime": 1782709357, "time_str": "13:02:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260629/c677784278.shtml"}, {"id": "4612241", "title": "现货黄金跌超1%", "content": "现货黄金跌超1%，现报4046.76美元/盎司。", "ctime": 1782709301, "time_str": "13:01:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260629/c677784270.shtml"}, {"id": "4612193", "title": "三人行在广州成立众行未来数字科技公司", "content": "企查查APP显示，近日，广州众行未来数字科技有限公司成立，经营范围包含信息系统集成服务；软件开发；计算机系统服务；信息技术咨询服务；数字技术服务等。企查查股权穿透显示，该公司由三人行全资持股。", "ctime": 1782709072, "time_str": "12:57:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260629/c677784213.shtml"}, {"id": "4612191", "title": "沪硅产业、新傲科技一行到金华海纳考察交流", "content": "近日，沪硅产业董事、常务副总裁，新傲科技董事长李炜一行到众合科技控股子公司海纳股份旗下海纳半导体（金华）有限公司（简称“金华海纳”）开展实地考察交流。此次考察搭建起双方长效沟通渠道，为产业链上下游深度协同奠定坚实基础。未来，双方将整合技术、产能、市场、资本等互补资源，协同攻坚硅材料核心工艺，持续深化全链条务实合作，不断提升国产半导体材料在全球产业格局中的话语权与影响力。(人民财讯)", "ctime": 1782708852, "time_str": "12:54:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260629/c677784157.shtml"}, {"id": "4612189", "title": "世界先进：预期2026年8英寸晶圆代工市场将维持缺货状态", "content": "晶圆代工厂世界先进董事长方略表示，8英寸晶圆代工市场今年整体呈现供不应求的态势，目前看来客户需求将持续旺盛，订单能见度在3~5个月水平，预期2026年8英寸晶圆代工市场将维持缺货状态。此外，新加坡新厂6月初产出首批40nm试产芯片，良率突破99％，预计2027年第一季正式量产。(科创板日报)", "ctime": 1782708692, "time_str": "12:51:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260629/c677784123.shtml"}, {"id": "4612187", "title": "ASICLAND为SK海力士提供下一代eSSD主控设计服务 计划由台积电代工", "content": "韩国芯片设计服务企业ASICLAND宣布已同SK海力士签署下一代eSSD控制器（主控）开发合同，提供ASIC设计和流片支持。根据这份合同，ASICLAND将作为技术合作伙伴参与SK海力士下一代产品的开发，并计划基于台积电的先进工艺提供ASIC设计和验证能力。该合同价值约319亿韩元。（科创板日报）", "ctime": 1782708672, "time_str": "12:51:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260629/c677784121.shtml"}, {"id": "4612177", "title": "江西发布地质灾害气象风险预警，多地发生崩塌、滑坡等灾害的风险较高", "content": "今天（6月29日），江西省防灾减灾救灾委员会办公室、省自然资源厅、省气象局联合发布地质灾害气象风险预警，九江市西部和庐山、景德镇市北部、上饶市东北部等地质灾害高易发区发生崩塌、滑坡、泥石流灾害的风险较高。据气象预报，6月29日至7月1日，江西省有一次降水天气过程。6月29日，赣北有阵雨或雷阵雨转中到大雨、局部地区有暴雨，赣中有阵雨或雷阵雨、局部地区有大雨；6月30日—7月1日，赣北有大雨或雷雨，部分地区有暴雨，局部地区有大暴雨。累计雨量，赣北、赣中50~100毫米，赣北部分地区100毫米以上。（央视新闻）", "ctime": 1782708234, "time_str": "12:43:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260629/c677783982.shtml"}, {"id": "46 // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
