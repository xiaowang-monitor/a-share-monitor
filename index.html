"source": "", "url": "https://news.10jqka.com.cn/20260727/c678451015.shtml"}, {"id": "4810307", "title": "郑商所甲醇主力合约大跌5%", "content": "郑商所甲醇主力合约大跌5%，报2611元/吨。", "ctime": 1785132100, "time_str": "14:01:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260727/c678450949.shtml"}, {"id": "4810283", "title": "甘肃渭源山洪灾害致10人遇难，省级财政紧急预拨2000万元支持抢险救灾", "content": "7月26日14时许，甘肃省定西市渭源县会川镇双石门沟因上游短时强降雨引发山洪，导致附近露营自驾游游客被困。截至7月27日凌晨5时20分，搜救被困人员207人，其中有10人遇难、23人受伤、成功救援174人。今天，甘肃省财政厅紧急预拨定西市省级资金2000万元，支持做好搜救转移安置受灾人员、排危除险等应急处置、次生灾害隐患排查和应急整治等工作。（央视新闻）", "ctime": 1785132081, "time_str": "14:01:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260727/c678450944.shtml"}, {"id": "4810257", "title": "联合国官员：中国逆转土地退化成全球范例", "content": "《联合国防治荒漠化公约》秘书处执行秘书亚丝明·福阿德日前接受记者采访时说，近年来，中国荒漠化和沙化土地面积持续“双缩减”，“中国已成为土地退化得以逆转的最清晰大规模范例之一”。福阿德认为，中国经验有力证明，有了长远眼光、科技创新和有力制度的共同支撑，生态修复与经济发展可以相互促进。福阿德指出，中国生态修复的成功离不开三个关键因素。首先是政策连续性，以“三北”工程为例，这项始于1978年、规划至2050年的工程是世界上规模最大、持续最久的生态修复项目之一。其次，完备的法律体系发挥了重要作用，包括专项的防沙治沙法及更广泛的生态治理改革。同时，卫星观测、土地利用规划等科学及监测手段始终贯穿其中，为决策提供了坚实支撑。（新华社）", "ctime": 1785132056, "time_str": "14:00:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260727/c678450935.shtml"}, {"id": "4810247", "title": "光伏行业成本核算团体标准正式发布", "content": "日前，在国家市场监督管理总局、工业和信息化部指导下，由中国光伏行业协会牵头编制的团体标准《光伏行业成本核算模型通则》正式发布。本标准以企业会计准则为基础，通过统一“硅料—硅片—电池—组件”全产业链的成本计算范围、计算系数和计算模型，形成贯通产业链的成本核算框架，可破除行业内成本核算口径不一、各自表述的乱象。这是落实党中央、国务院关于规范市场竞争秩序、推动高质量发展部署的具体举措，也是光伏行业管理从自律倡议走向制度化、标准化的重要一步。本标准的关键价值在于，将成本核算的通用准则转化为光伏各环节可操作、可核验的统一方法，使监管从“看不透”走向“看得清”，从“管不住”走向“管得住”。能耗标准规范生产准入，安全标准保障产品质量，成本核算标准引导合理定价——三类标准相互配合，共同构成行业管理的完整体系。(人民财讯)", "ctime": 1785132040, "time_str": "14:00:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260727/c678450931.shtml"}, {"id": "4810191", "title": "甘肃省级财政紧急预拨2000万元 支持渭源应急抢险救灾", "content": "7月26日14时许，甘肃省定西市渭源县会川镇双石门沟因上游短时强降雨引发山洪，导致附近露营自驾游游客被困。截至7月27日凌晨5时20分，搜救被困人员207人，其中有10人遇难、23人受伤、成功救援174人。今天，甘肃省财政厅紧急预拨定西市省级资金2000万元，支持做好搜救转移安置受灾人员、排危除险等应急处置、次生灾害隐患排查和应急整治等工作。（央视新闻）", "ctime": 1785131983, "time_str": "13:59:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260727/c678450912.shtml"}, {"id": "4810175", "title": "首创期货：美伊停火推动油价暴跌逾5%，地缘溢价阶段性快速出清", "content": "推动油价暴跌的核心因素是周末美伊军事冲突停火。据媒体报道，美军在连续13晚对伊朗实施空袭后，于7月24日晚间暂停了空袭行动，25日和26日均未报告美军发动袭击，伊朗此前的每晚空袭报复也随之停止。一名伊朗高级官员表示，只要美国停止军事打击，伊朗也将停止军事行动。海湾国家正在加速重构原油出口网络以降低对霍尔木兹海峡的依赖。短期不再维持看多，建议观望为主，目前波动较大，谨慎操作。（首创期货）", "ctime": 1785131932, "time_str": "13:58:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260727/c678450899.shtml"}, {"id": "4810161", "title": "大商所纯苯主力合约大跌7%", "content": "大商所纯苯主力合约大跌7%，报7247元/吨。", "ctime": 1785131818, "time_str": "13:56:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260727/c678450864.shtml"}, {"id": "4810133", "title": "N长鑫成交额达1300亿元", "content": "N长鑫成交额达1300亿元，现涨499.08%。", "ctime": 1785131547, "time_str": "13:52:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260727/c678450808.shtml"}, {"id": "4810129", "title": "存储模组厂商宇瞻科技：DRAM、企业级SSD供需失衡至少持续到明年上半年", "content": "台湾存储模组厂商宇瞻科技执行长近日表示，随全球三大DRAM原厂新增产能几乎全面投入AI产品，一般市场供货持续减少，供需失衡短期仍难缓解。他直言，全球三大DRAM原厂新增产能几乎全面投入HBM、伺服器DDR5及LPDDR5X等AI产品，分配给一般DDR5、DDR4及工控市场的颗粒持续减少，模组厂目前面临最大的挑战已不是价格，而是供货不足。他表示，依原厂供货规画，未来可分配给模组厂的DRAM供应量仍将持续下降，不仅价格持续走高，各家模组厂也积极建立库存，避免未来面临无货可卖风险。他说，即使采购成本垫高，仍必须提前备货，因为买得贵还可以做生意，买不到货就没有生意可做。张家表示，目前较能确定的是，2027年上半年以前供应吃紧趋势仍相当明确；至于2027年下半年后，仍须观察各家原厂扩产及AI需求变化。(财联社)", "ctime": 1785131524, "time_str": "13:52:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260727/c678450803.shtml"}, {"id": "4810123", "title": "投行杰富瑞将美国航空目标价从18美元下调至15美元", "content": "投行杰富瑞将美国航空目标价从18美元下调至15美元。", "ctime": 1785131446, "time_str": "13:50:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260727/c678450781.shtml"}, {"id": "4810109", "title": "尹锡悦涉嫌选举期间公布虚假事实案一审被判有罪", "content": "当地时间27日14时，韩国前总统尹锡悦涉嫌在总统选举期间发布虚假事实、违反《公职选举法》一案进行一审宣判，尹锡悦被判有罪，判处有期徒刑1年6个月，缓期3年执行。(央视新闻)", "ctime": 1785131368, "time_str": "13:49:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260727/c678450772.shtml"}, {"id": "4810083", "title": "阿里AI Agent“千问办公”小范围测试", "content": "《科创板日报》获悉，阿里新款AI Agent产品“千问办公”开始小范围测试，目前上线的是本地桌面客户端，后续将陆续上线网页端和钉钉内置版。“千问办公”把阿里旗下多款Agent产品 QoderWork、悟空、MuleRun进行了深度整合，由钉钉新任CEO陈宇森负责。（科创板日报）", "ctime": 1785131189, "time_str": "13:46:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260727/c678450632.shtml"}, {"id": "4810045", "title": "维琪科技上市首日大涨超800%", "content": "维琪科技上市首日大涨800%，现报199.78元，该股发行价为22.16元。\n\n注：深圳市维琪科技股份有限公司的主营业务是化妆品原料和化妆品成品的研发、生产、销售以及相关服务。公司的主要产品是化妆品原料、ODM成品、OBM成品。维琪科技于2025年10月20日收到深圳市中小企业服务局发布的《关于深圳市第七批专精特新“小巨人”企业和2025年专精特新“小巨人”复核通过企业名单的公示》，公司通过了国家级2025年专精特新“小巨人”企业认定。2019年12月9日维琪科技取得深圳市科技创新委员会、深圳市财政局、国家税务总局深圳市税务局联合颁发的《高新技术企业证书》。", "ctime": 1785130808, "time_str": "13:40:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260727/c678450534.shtml"}, {"id": "4810043", "title": "黄金回收业务遇冷 水贝黄金以旧换新业务火爆", "content": "近期，国际金价出现震荡。金价剧烈波动的背景下，黄金消费市场又呈现出怎样的局面？进入暑期，深圳水贝黄金市场人气明显回暖。作为国内最大的黄金珠宝集散地，近期这里迎来不少外地游客，询价和试戴的客流络绎不绝。有商户表示：“7月份环比6月份，我们整体销量增长了10%左右。”记者发现，近期水贝的婚庆类黄金饰品销售尤为亮眼，多家婚庆主题的金店人气十足。消费偏好也出现变化，小克重、轻量化黄金饰品更受年轻消费者青睐。与黄金销售端的持续回暖相比，单纯的黄金回收业务则显得相对冷清。记者走访水贝多家回收门店了解到，受近期黄金回收价格回落的影响，直接卖金变现的客户明显减少。黄金回收业务遇冷，“以旧换新”成为水贝多家黄金门店主力业务。消费者携带旧金饰到店，按克重折算后补足少量工费，就能置换新款饰品。既能盘活家中闲置黄金，也减轻换新成本，深受消费者青睐。（央视财经）", "ctime": 1785130805, "time_str": "13:40:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260727/c678450532.shtml"}, {"id": "4810015", "title": "美国国防部调整在伊朗战事中美军伤亡统计方式", "content": "美国国防部26日调整在伊朗战事中美军伤亡的统计方式，把本月7日最新一轮美伊互袭以来的伤亡数据单独列出，不计入之前的统计。美国国防部几天前“悄悄”下调美军阵亡人数，把“18人”改为“14人”，但未给出合理解释。删去的4人出现在26日新增的表格中。一些批评人士指出，这一举动看似“自圆其说”，实则自欺欺人，是特朗普政府在国内舆论压力下为掩盖其战争损失的“障眼法”。（新华社）", "ctime": 1785130520, "time_str": "13:35:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260727/c678450446.shtml"}, {"id": "4809991", "title": "AMD将在韩国设立AI研究中心 打造开放式AI基础设施生态", "content": "据韩联社报道，AMD(AMD.O)将于韩国建设人工智能研究中心，并打造开放式AI基础设施生态系统。韩国科学技术信息通信部27日表示，已于23日在旧金山与AMD签署关于AI芯片生态系统合作的谅解备忘录。AMD计划在韩国设立AI卓越中心，为韩国企业、高校和科研机构之间的技术合作、AI芯片软件开发、计算技术验证以及联合研究提供支持，还将推动与韩国本土AI芯片企业开展合作。此次谅解备忘录包括建设异构AI计算基础设施，将AMD的CPU和GPU与韩国企业在推理领域具有优势的AI芯片（NPU）连接起来。双方还计划打造开放式AI计算生态系统，推动韩国企业共同参与，覆盖范围还包括存储器、网络、服务器和软件等领域。", "ctime": 1785130286, "time_str": "13:31:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260727/c678450398.shtml"}, {"id": "4809971", "title": "上期所燃油主力合约大跌7%", "content": "上期所燃油主力合约大跌7%，报3641元/吨。", "ctime": 1785130235, "time_str": "13:30:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260727/c678450377.shtml"}, {"id": "4809957", "title": "日本学者批评政府借“防卫”之名推进国家军事化", "content": "日本法学馆宪法研究所所长伊藤真26日在东京举行演讲会，对当前日本政府以“防卫”之名持续扩张军备、突破和平宪法限制的动向提出批评和质疑。伊藤在演讲中说，日本曾对中国和东南亚国家实施无差别轰炸和军事占领，造成重大人员伤亡。特别是在南京大屠杀中，数十万中国人惨遭杀害；日本还强征和奴役劳工，实施“慰安妇”制度等。如今，日本政府现行“安保三文件”的目标是“最大限度运用综合国力”实施战争、建立动员国家全部力量投入战争的体制。日本政府围绕该目标推动的一系列改革，正使日本由和平国家逐步转向军事国家 // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
