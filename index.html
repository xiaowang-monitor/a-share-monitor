13/c680633053.shtml"}, {"id": "5372827", "title": "马斯克披露Terafab芯片工厂规划：每年制造和测试10款芯片", "content": "马斯克透露了他对Terafab芯片工厂的规划图景，称特斯拉和SpaceX的目标是在Terafab位于美国得克萨斯州的Giga Texas研究工厂每年制造和测试约10种芯片设计，以加快开发过程。他补充称，团队可以快速测试芯片，制作新的光刻掩模，然后制造另一个版本，而无需中断迭代周期。他还强调，虽然不知道怎么制造芯片，但他们会找到办法，只是实现这些目标可能需要数年时间。", "ctime": 1791877642, "time_str": "15:47:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261013/c680633051.shtml"}, {"id": "5372821", "title": "润都股份：枸橼酸莫沙必利获批，编号2026YS00961", "content": "润都股份公告，公司于2025年1月递交枸橼酸莫沙必利境内生产化学原料药上市申请，2025年10月收到补充研究通知并于2026年2月完成补充研究、递交资料。公司近日获得国家药品监督管理局签发的《化学原料药上市申请批准通知书》，该品种获准注册。", "ctime": 1791877589, "time_str": "15:46:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261013/c680633041.shtml"}, {"id": "5372817", "title": "商务部就《民用航空领域相关两用物项出口凭证管理办法（征求意见稿）》公开征求意见", "content": "记者13日从商务部获悉，为规范民用航空领域相关两用物项出口许可管理，商务部近日研究起草了《民用航空领域相关两用物项出口凭证管理办法（征求意见稿）》，现向社会公开征求意见。商务部安全与管制局负责人介绍，民用航空领域使用的发动机、惯性导航仪等物项属于两用物项。2006年，商务部颁布实施《民用航空零部件出口分类管理办法》，便利航空企业出境维修发动机、惯性导航仪等部件，促进民航安全和产业发展。2024年12月，《中华人民共和国两用物项出口管制条例》生效，对出口管制的许可管理制度进行了调整，《民用航空零部件出口分类管理办法》需根据最新规定进行相应调整。办法征求意见稿共22条，主要规定适用主体、适用情形、登记和通关程序、管理要求、行政处罚等，明确民航企业出口有关物项用于维修、维护、租赁等合理用途，无需逐单申请许可证件，在登记填报相关信息后自动获得出口凭证，自行出口。商务部安全与管制局负责人表示，下一步将根据公开征求意见反馈情况完善办法，推动办法尽快出台，便利航空企业合规出口。（新华社）", "ctime": 1791877518, "time_str": "15:45:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261013/c680633005.shtml"}, {"id": "5372811", "title": "荣耀将推出WIN系列电竞全家桶产品", "content": "10月13日，荣耀官宣将推出WIN系列电竞全家桶产品矩阵，覆盖手机、笔记本、平板、游戏手柄、电竞耳机等。", "ctime": 1791877434, "time_str": "15:43:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261013/c680632986.shtml"}, {"id": "5372807", "title": "三部门：加快电动船舶在300公里以内、3000载重吨以下的客货运场景应用", "content": "交通运输部、工业和信息化部、国家能源局联合印发《内河新能源船舶推广应用行动方案（2026—2030年）》，其中提到，加快电动船舶在300公里以内、3000载重吨以下的客货运场景应用。在航线相对固定的内河或特定航线江海直达等中短途集装箱、干散货运输场景，推广应用电动货船；在滨江和湖库区观光、轮渡等场景，推广电动客船。鼓励公务船、港作船、游艇等应用电池动力。加大甲醇动力船舶在长运距、大吨级货运场景推广应用。聚焦江海直达、江海联运等长距离运输场景，推动集装箱、大宗散杂货和滚装运输等采用甲醇动力船舶。鼓励各地结合实际，探索氢能等其他能源应用。支持船舶应用生物柴油、绿色甲醇等可再生能源。", "ctime": 1791877363, "time_str": "15:42:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261013/c680632930.shtml"}, {"id": "5372797", "title": "14日起全面恢复考试，雅思主办方回应：受影响考生增设两天免费专场考试", "content": "中国之声近日持续关注了雅思考试场次在全国大范围取消的消息。多地考生10日反映，他们报名的当天雅思考试临时被取消，甚至有考生在进行听力考试过程中，也突然被通知停考。而在连续三天停考之后，原本应该在13日进行的雅思单科重考，也在前一天晚上被临时取消。主办方说明：因技术原因取消相关场次报名费全额退还分批次安排复考增设免费专场、发放考试券异地考生可报销交通费、住宿费（央视新闻）", "ctime": 1791877269, "time_str": "15:41:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261013/c680632905.shtml"}, {"id": "5372787", "title": "比特币升破84000美元，日内上涨1.55%", "content": "比特币升破84000美元，日内上涨1.55%。", "ctime": 1791877145, "time_str": "15:39:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261013/c680632840.shtml"}, {"id": "5372783", "title": "三部门：开发农村助老公益性岗位 按规定给予岗位补贴", "content": "民政部、人力资源社会保障部、农业农村部近日联合印发《关于加强农村助老员队伍建设的通知》。《通知》要求，充实农村助老员队伍。发挥农村助老志愿者作用，深入开展“银龄行动”，持续推动农村基层老年协会建设。开发农村助老公益性岗位，按规定通过相关渠道资金给予岗位补贴。鼓励养老服务机构提供助老服务，通过组建农村助老服务团队或开放机构设施资源、设立服务站点、提供专业指导等方式，支持农村助老员开展服务。（央视新闻）", "ctime": 1791877139, "time_str": "15:38:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261013/c680632838.shtml"}, {"id": "5372779", "title": "美国对进口自中国的钾磷酸盐作出第三次双反日落复审终裁", "content": "10月5日，美国商务部发布公告称，对进口自中国的钾磷酸盐作出第三次反倾销快速日落复审终裁：若取消现行反倾销措施，将会导致中国涉案产品以95.40%的倾销幅度继续或再度发生。同时，美国商务部对进口自中国的钾磷酸盐作出第三次反补贴快速日落复审终裁：若取消现行反补贴措施，将导致中国涉案产品的补贴以109.11%的税率继续或再度发生。", "ctime": 1791877030, "time_str": "15:37:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261013/c680632792.shtml"}, {"id": "5372759", "title": "谷歌韩国1540亿韩元法人税诉讼终审胜诉", "content": "谷歌韩国因不服被征收约1540亿韩元法人税而提起诉讼，税务当局最终败诉，相关征税处分予以撤销。韩国大法院采纳谷歌的主张：虽然谷歌通过韩国国内广告业务取得超1.5万亿韩元营收，但该收益归属谷歌亚太（新加坡）公司，而非谷歌韩国。", "ctime": 1791876843, "time_str": "15:34:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261013/c680632701.shtml"}, {"id": "5372755", "title": "四方新材：2026年第三季度沥青混凝土产量增长142.50%", "content": "四方新材公告，2026年第三季度，公司商品混凝土产量65.21万立方米，同比下降18.17%；湿拌砂浆产量1.65万立方米，同比下降17.81%；沥青混凝土产量5.43万吨，同比增长142.50%；装配式混凝土预制构件产量0.51万立方米，同比下降26.92%。前三季度上述产品产量分别为206.86万立方米、5.45万立方米、11.19万吨和1.78万立方米，分别同比下降18.01%、22.23%、增长48.37%和下降6.98%。", "ctime": 1791876825, "time_str": "15:33:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261013/c680632692.shtml"}, {"id": "5372743", "title": "市场监管总局就《关于优化环保电价监管有关事项的通知（征求意见稿）》公开征求意见", "content": "市场监管总局就《关于优化环保电价监管有关事项的通知（征求意见稿）》公开征求意见，为统筹推进燃煤发电污染减排和行业高质量发展，切实维护发电企业和电力用户合法权益，构建协同高效的环保电价监管机制，近日，市场监管总局组织起草了《关于优化环保电价监管有关事项的通知（征求意见稿）》（以下简称《征求意见稿》），自10月13日至10月20日向社会公开征求意见。(市场监管总局)", "ctime": 1791876716, "time_str": "15:31:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261013/c680632608.shtml"}, {"id": "5372729", "title": "多哥部长会议主席福雷向人民英雄纪念碑敬献花圈", "content": "10月13日下午，多哥部长会议主席福雷前往天安门广场，向人民英雄纪念碑敬献花圈。(新华社)", "ctime": 1791876494, "time_str": "15:28:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261013/c680632463.shtml"}, {"id": "5372723", "title": "菲检方撤回三项对副总统莎拉的弹劾指控", "content": "菲律宾媒体13日报道，菲检方已撤回副总统莎拉·杜特尔特弹劾案四项指控中的三项，仅指控莎拉2022年至2025年未如实申报来源不明资产。（新华社）", "ctime": 1791876421, "time_str": "15:27:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261013/c680632437.shtml"}, {"id": "5372713", "title": "中坚科技成立智能科技公司 含智能机器人业务", "content": "企查查APP显示，近日，上海元思未来智能科技有限公司成立，法定代表人为鲍嘉龙，经营范围包含：人工智能应用软件开发；人工智能行业应用系统集成服务；智能机器人的研发；智能机器人销售等。企查查股权穿透显示，该公司由中坚科技旗下上海桦之坚科技有限公司全资持股。", "ctime": 1791876140, "time_str": "15:22:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261013/c680632340.shtml"}, {"id": "5372701", "title": "多家银行集体公告，大额支付系统运行时间将延长", "content": "近日，农业发展银行、中国银行、招商银行、上海银行、北京农商行等多家银行集体发布公告，按照中国人民银行工作安排，大额支付系统将延长运行时间。此前，中国人民银行清算总中心于7月发布通知，决定自2026年10月17日起，将大额支付系统运行服务时间由现行“5×21+12小时”延长至“5×22.5+13.5小时”，以更好发挥金融服务实体经济作用，提高支付清算服务水平。多家银行表示，根据通知安排，自2026年10月19日（周一）起，大额支付系统法定工作日开始受理业务的时间，由前一日20:30提前至前一日19:00；日终时间保持当日17:30不变。在周末及法定节假日期间，系统继续执行特殊工作日相关安排。（21财经）", "ctime": 1791875941, "time_str": "15:19:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261013/c680632237.shtml"}, {"id": "5372673", "title": "顶固集创与VERSAFORM举行产品销售授权合作签约仪式", "content": "10月13日，澳洲合作伙伴VERSAFORM董事长黄伟一行到访顶固总部。随后，双方举行产品销售授权合作签约仪式，围绕顶固定制家居、五金产品在澳大利亚市场的销售合作达成授权安排，进一步深化双方合作。（顶固集创）", "ctime": 1791875664, "time_str": "15:14:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261013/c680632098.shtml"}, {"id": "5372671", "title": "今年1-8月我国服务进出口总额超5万亿元 知识密集型出口占比过半", "content": "2026年1-8月，我国服务进出口总额50701.6亿元（人民币，下同），同比增长7.9%。其中，出口19996.1亿元，增长14.8%；进口30705.5亿元，增长3.8%。服务贸易逆差10709.4亿元，同比缩小1451.2亿元。主要呈现以下特点：\n\n旅行和运输服务出口对整体服务出口增长的贡献率近50%。1-8月，旅行服务出口2751.7亿元，增长15.3%，运输服务出口4202.6亿元，增长28.2%。旅行和运输服务出口对整体服务出口增长的贡献率分别为14.1%和35.8%。\n\n知识密集型服务出口占比超过一半。1-8月，知识密集型服务进出口22314亿元，增长6.6%，占服务进出口总额的44%。知识密集型服务出口10744.7亿元，增长10.9%，占服务出口额的53.7%；其中，个人文化和娱乐服务、金融服务增长最快，增速分别为66%和21.6%。知识密集型服务进口11569.3亿元，增长2.8%，占服务进口额的37.7%。(央视新闻)", "ctime": 1791875654, "time_str": "15:14:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261013/c680632097.shtml"}, {"id": "5372663", "title": "华为披露麒麟9050系列已经成功量产", "content": "10月13日，在2026华为终端创新技术沟通会上，华为详细介绍了近期随华为三折叠手机Mate XT 2及直板旗舰Mate90 Pro Max面世的麒麟9050系列芯片。据华为半导体业务无线终端芯片产品管理部部长徐松余介绍，2023年以来，基于麒麟芯片的终端产品累计发货已经过亿。在中国电子产业的托举下，麒麟9050系列已经成功量产。麒麟9050系列的推出，是麒麟回归之后面向未来持续演进的重要一步，开启了麒麟芯片未来10年新征程。", "ctime": 1791875562, "time_str": "15:12:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261013/c680632065.shtml"}, {"id": "5372647", "title": "美国飞以色列客机接到炸弹威胁", "content": "据以色列媒体报道，今天（10月13日）上午，美国达美航空公司一架从美国纽约飞往以色列特拉维夫的客机，接到匿名炸弹威胁。客机降落在特拉维夫的本-古里安国际机场后，已被引导至偏远滑行道接受检查。乘客和机组人员已从机上撤离。据称，这有可能是一场虚惊。（CCTV国际时讯）", "ctime": 1791875300, "time_str": "15:08:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261013/c680631974.shtml"}, {"id": "5372629", "title": "三星计划扩充AI内存与存储战略", "content": "三星电子周二公布下一代内存与存储技术战略，旨在提升人工智能基础设施的性能。这家韩国芯片厂商在旧金山开幕的2026年开放计算项目全球峰会上发布相关方案。三星提出提升AI基础设施性能的三大核心技术方向：高性能内存、基于CXL的内存扩展技术，以及搭载新一代固态硬盘（SSD）的数据存储与管理解决方案。三星企业副总裁、应用工程团队负责人沈浩俊进行主题演讲。沈浩俊表示：随着AI模型体量持续增大，推理所需的数据与键值缓存规模不断膨胀。要提升AI系统性能，除内存带宽之外，内存扩容与数据存储技术的重要性正持续上升。他补充，三星正从研发早期阶段就加强与全球客户及合作伙伴的联合设计与技术验证，对整套AI系统做全栈优化。三星还计划在本次峰会与超威（AMD）联合展示基于CXL的内存扩展方案，提供解决现有系统内存容量瓶颈的技术路径。", "ctime": 1791875181, "time_str": "15:06:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261013/c680631944.shtml"}, {"id": "5372603", "title": "保加利亚总理称两艘船只在黑海沿岸遭无人机袭击", "content": "当地时间10月13日，保加利亚总理拉德夫表示，当天，两艘船只在保加利亚黑海沿岸遭到无人机袭击，其中一艘沉没。拉德夫表示，在保加利亚布亚拉以东18海里处，一艘商船被三架无人机击中，船上15名船员全部获救。此外，在保加利亚克拉佩茨附近海域，另有一条商船被无人机击中并沉没，船上一名船员获救。拉德夫表示，目前尚无明确证据显示袭击由何方实施。拉德夫表示将就此事与北约秘书长吕特通话，他还将就此事召见俄罗斯驻保大使。（央视新闻）", "ctime": 1791874992, "time_str": "15:03:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261013/c680631843.shtml"}, {"id": "5372601", "title": "特朗普称正考虑解除美国驻希腊大使职务", "content": "美国总统特朗普当天表示，他正在考虑解除美国驻希腊大使金伯莉·吉尔福伊尔的职务。特朗普在回答关于是否在考虑解雇吉尔福伊尔时表示，“我们正在考虑”“我们不高兴了”。此前有消息称，吉尔福伊尔在担任大使前及任职期间存在接受奢华礼品、试图利用其在美政府内部影响力换取金钱等不当行为。一位知情人士说，预计特朗普很快会作出决定。美国国务院监察长办公室正在就吉尔福伊尔的不当行为指控进行调查。（央视新闻）", "ctime": 1791874984, "time_str": "15:03:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261013/c680631836.shtml"}, {"id": "5372577", "title": "ETF两市成交额报6081.18亿元，较昨日此时放量785.94亿元", "content": "截至目前，ETF两市成交额报6081.18亿元，较昨日此时放量785.94亿元，分类型来看，股票型ETF成交额1489.18亿元，债券型ETF成交额3407.18亿元，货币型ETF成交额410.68亿元，商品型ETF成交额81.03亿元，QDII型ETF成交额693.11亿元。其中，成交额最高的非货币型ETF分别是中韩半导体ETF（513310）、创业板ETF（159915）、科创50ETF（588000），成交额分别为：128.80亿元、92.30亿元、81.14亿元。", "ctime": 1791874901, "time_str": "15:01:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261013/c680631822.shtml"}, {"id": "5372583", "title": "欧洲主要股指开盘多数上涨", "content": "欧洲主要股指开盘多数上涨，欧洲斯托克50指数持平，英国富时100指数涨0.64%，法国CAC40指数涨0.26%，德国DAX指数涨0.26%。", "ctime": 1791874898, "time_str": "15:01:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261013/c680631825.shtml"}, {"id": "5372579", "title": "期货收评：多空分化！甲醇重挫逾6%！低硫燃油大涨近6% 原油涨近2%！", "content": "期货收评：截至收盘，大宗商品以下跌为主，跌幅方面，甲醇跌超6%，纯碱、20号胶跌超3%。涨幅方面，低硫燃油涨近6%，纯苯涨超4%，原油涨近2%。", "ctime": 1791874897, "time_str": "15:01:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261013/c680631823.shtml"}, {"id": "5372555", "title": "A股收评：沪指探底回升微涨，元件、PCB概念股涨幅居前", "content": "A股三大指数今日涨跌不一，截至收盘，上证指数涨0.1%，深证成指跌0.25%，创业板指跌0.18%，北证50跌0.31%，科创50指数涨0.03%。全市场成交额16889亿元，较上日放量1382亿元，全市场超290 // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
