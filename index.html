。公司此前于2025年4月25日审议通过作为有限合伙人以自有资金出资人民币1.2亿元，与横琴粤澳深度合作区产业投资基金（有限合伙）及中金资本运营有限公司共同设立果麦文化产业基金（广东横琴）合伙企业（有限合伙），占基金认缴出资总额的59.70%。鉴于市场环境发生变化，公司拟终止本次共同投资，截至公告披露日尚未实缴出资，后续将配合执行事务合伙人完成清算、注销程序。", "ctime": 1785750755, "time_str": "17:52:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260803/c678630517.shtml"}, {"id": "4867385", "title": "立讯精密：截至2026年7月31日回购1766.54万股", "content": "立讯精密公告，公司于2025年12月31日审议通过回购方案，回购资金总额不低于10亿元且不超过20亿元，回购股份用于后期实施股权激励计划或员工持股计划。回购价格上限已调整为不超过86.66元/股。截至2026年7月31日，公司以集中竞价方式回购A股股份1766.54万股，成交总金额10亿元（不含交易费用）。", "ctime": 1785750453, "time_str": "17:47:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260803/c678630378.shtml"}, {"id": "4867363", "title": "贵州燃气：发行股份购买资产进展，调整定价基准日，配套募资不超35名特定投资者", "content": "贵州燃气公告，公司拟向贵州乌江能源投资有限公司、贵州省新动能产业发展基金合伙企业（有限合伙）、贵州省新型工业化发展股权投资基金合伙企业（有限合伙）发行股份购买其持有的贵州页岩气勘探开发有限责任公司100%股权，并向不超过35名符合条件的特定投资者发行股份募集配套资金。2026年8月3日，公司召开第四届董事会第十九次会议，审议通过调整本次发行股份购买资产暨关联交易的定价基准日及预案（修订稿）等议案。截至本公告披露日，本次交易涉及资产的审计、评估、尽职调查等工作正在有序推进中，除本次交易预案披露的风险因素外，公司尚未发现可能导致董事会或交易对方撤销、中止本次交易或对方案作出实质性变更的事项。", "ctime": 1785750343, "time_str": "17:45:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260803/c678630274.shtml"}, {"id": "4867353", "title": "上周无新增IPO受理企业", "content": "据“上交所企业上市服务”，本期（7月27日—8月2日）无新增受理企业。截至8月2日，今年新增243家受理企业。截至8月2日，各板块在审企业共435家。其中上交所95家（主板23家，科创板72家），深交所109家（主板22家，创业板87家），北交所231家。截至8月2日，2026年已公布终止审查（撤材料+否决/终止注册）企业48家，其中上交所13家（主板4家，科创板9家），深交所6家（主板2家，创业板4家），北交所29家。", "ctime": 1785750283, "time_str": "17:44:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260803/c678630210.shtml"}, {"id": "4867347", "title": "孙哲元编造、传播虚假信息被罚没48.5万元", "content": "四川证监局认定孙哲元控制使用百度百家账号“帝侃”编造多篇关于纯碱生产的虚假文章并公开发布，编造、传播上述虚假信息的行为对投资者具有明显误导性，扰乱了期货市场，对孙哲元没收违法所得85,028.85元，并处以400,000元罚款。", "ctime": 1785750215, "time_str": "17:43:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260803/c678630187.shtml"}, {"id": "4867341", "title": "九典制药：琥珀酸亚铁片等2款产品拟中选第12批国家药品集采", "content": "九典制药公告，公司于2026年7月31日参加第12批国家组织药品集中带量采购投标，产品琥珀酸亚铁片（9.68元/盒，约定采购量3,819.3301万片）、吲哚布芬片（27.56元/盒，约定采购量68.4346万片）拟中选，供应省份均为全国。", "ctime": 1785750147, "time_str": "17:42:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260803/c678630154.shtml"}, {"id": "4867331", "title": "哈药股份：两个产品拟中标第十二批全国药品集中采购", "content": "哈药股份公告，公司所属哈药总厂和哈药六厂参加第十二批全国药品集中采购，注射用头孢他啶阿维巴坦钠和富马酸伏诺拉生片拟中标，采购周期均至2029年12月31日。两个产品于2026年6月获药品注册证书，截至目前尚未销售。", "ctime": 1785750092, "time_str": "17:41:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260803/c678630134.shtml"}, {"id": "4867329", "title": "天合光能与Al-Raebi签署合作备忘录 共拓中东光伏市场", "content": "近日，天合光能与中东Al-Raebi贸易与太阳能系统公司（Al-Raebi for Trading and Solar Energy Systems Company）正式签署合作备忘录（MoU）。根据合作备忘录，双方将围绕2026年至2029年总规模约1.5GW的光伏项目开展合作，共同探索中东地区大型光伏项目的发展机遇，携手推动区域能源绿色低碳转型。(人民财讯)", "ctime": 1785750059, "time_str": "17:40:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260803/c678630124.shtml"}, {"id": "4867305", "title": "商务部：外国企业对特定二次圆柱形电池、电池组件及包含该组件的产品提起337调查申请", "content": "2026年7月21日，韩国LG Energy Solution Ltd.、美国LG Energy Solution Arizona, Inc.根据《美国1930年关税法》第337节规定，向美国国际贸易委员会提出申请，指控对美出口、在美进口或在美销售的特定二次圆柱形电池、电池组件及包含该组件的产品（Certain Secondary Cylindrical Batteries, Components Thereof, and Products Containing the Same）侵犯其专利权，请求发起337调查并发布有限排除令和禁止令。其中，中国三家企业涉案。（商务部）", "ctime": 1785749893, "time_str": "17:38:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260803/c678630032.shtml"}, {"id": "4867301", "title": "7月第5周生猪和猪肉价格有所下跌", "content": "据农业农村部对500个县集贸市场和采集点监测，上周（7月第5周，7月27日—8月2日，下同），全国活猪价格为11.22元/公斤，环比跌2.0%；猪肉集贸市场价格为20.90元/公斤，环比跌0.3%。据农业农村部对200个批发市场监测调度，上周全国猪肉批发市场均价为15.81元/公斤，环比跌0.8%，同比低22.7%。专家分析认为，上周生猪养殖主体、屠宰企业加快出栏、收购、屠宰节奏，市场供应充裕，全国多数地区出现高温天气，消费处于淡季，生猪和猪肉价格有所下跌。展望后市，预计本周生猪和猪肉价格以窄幅调整为主。(农业农村部)", "ctime": 1785749824, "time_str": "17:37:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260803/c678630009.shtml"}, {"id": "4867299", "title": "长飞光纤：子公司长飞资本拟出资1.7亿元参与设立私募基金", "content": "长飞光纤公告，公司全资子公司武汉市长飞资本管理有限责任公司拟作为有限合伙人参与设立长飞江城智能创业投资基金（武汉）合伙企业（有限合伙）。长飞智能基金规模为人民币5亿元，长飞资本拟以自有资金认缴出资人民币1.7亿元，占出资总额的34.00%。该基金聚焦人工智能、高端制造、半导体与集成电路等战略新兴产业和未来产业领域。本次投资不构成重大资产重组，亦不构成关联交易。", "ctime": 1785749823, "time_str": "17:37:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260803/c678630006.shtml"}, {"id": "4867295", "title": "呷哺呷哺：预计2026年上半年亏损2900-3900万元，2025年同期亏损约8100万元", "content": "呷哺呷哺公告，预计截至2026年6月30日止六个月收入约人民币15亿元，较截至2025年6月30日止六个月收入减少约23%；预期净亏损介乎约人民币2900万元至3900万元，而2025年同期净亏损约人民币8100万元，亏损降幅介乎约64%至51%。亏损大幅减少主要由于公司推行多维度提质增效举措，预计对关闭及持续亏损餐厅的资产减值损失计提金额较2025年同期减少约30%。", "ctime": 1785749786, "time_str": "17:36:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260803/c678629992.shtml"}, {"id": "4867293", "title": "日本央行数据：日本上周五干预金额约5.3万亿日元", "content": "日本央行数据显示，日本上周五（7月31日）可能实施了约5.3万亿日元（约338亿美元）的汇市干预行动。（财联社）", "ctime": 1785749749, "time_str": "17:35:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260803/c678629970.shtml"}, {"id": "4867291", "title": "东软集团、中国通号等成立新公司 含AI相关业务", "content": "企查查APP显示，近日，沈阳畅联智通技术工程有限公司成立，经营范围包含：人工智能行业应用系统集成服务；人工智能硬件销售；数字视频监控系统销售；智能无人飞行器销售等。企查查股权穿透显示，该公司由中国通号全资子公司中国铁路通信信号上海工程局集团有限公司、东软集团等共同持股。（人民财讯）", "ctime": 1785749704, "time_str": "17:35:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260803/c678629943.shtml"}, {"id": "4867279", "title": "伊朗处决两名为以色列提供情报的间谍", "content": "伊朗司法部门3日发布消息说，两名被控为以色列提供情报的间谍当天已被处决。伊朗司法部门说，这两人在2025年6月和2026年2月至4月伊朗同以色列发生冲突期间，通过向以色列情报和特勤局（摩萨德）官员及关联通信渠道发送伊朗军事与安全中心坐标、图像及相关情报，为以色列提供协助。（新华社）", "ctime": 1785749594, "time_str": "17:33:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260803/c678629911.shtml"}, {"id": "4867277", "title": "持续干旱致河流水位下降 荷兰多条渡轮航线停运", "content": "总台记者8月3日获悉，由于持续干旱导致河流水位过低，荷兰海尔德兰省多条渡轮航线已暂停运营。据了解，海尔德兰省及其与上艾瑟尔省交界地区渡轮停运，与莱茵河水位持续偏低，以及莱茵河瓦尔河支流和艾瑟尔河支流流量减少有关。莱茵河水位上周创历史新低。渡轮运营商理查德·范·奥伊恩表示，此次停运情况较为罕见。他说，以往渡轮停运多因水位过高，而此次因水位过低导致无法通航，在当地尚属首次。目前，停运将持续多久尚不明确。受持续低水位影响，荷兰其他地区也采取了禁止渡轮停靠、关闭船闸等临时措施。（央视新闻）", "ctime": 1785749588, "time_str": "17:33:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260803/c678629907.shtml"}, {"id": "4867265", "title": "韩国央行13年来首次采购国内精炼金条", "content": "韩国央行将在时隔13年后恢复实物黄金购买，寻求购买国内精炼的金条，地缘政治风险增强了韩国外汇储备多元化的理由。（财联社）", "ctime": 1785749558, "time_str": "17:32:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260803/c678629832.shtml"}, {"id": "4867271", "title": "南向资金今日净买入110.31亿港元 盈富基金获净买入居前", "content": "南向资金今日净买入110.31亿港元。盈富基金、阿里巴巴-W分别获净买入约47.50亿港元、41.69亿港元；中芯国际、华虹宏力分别遭净卖出10.64亿港元、4.02亿港元。", "ctime": 1785749483, "time_str": "17:31:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260803/c678629843.shtml"}, {"id": "4867267", "title": "中国平安今日大宗交易平价成交130.8万股，成交额7265.95万元", "content": "8月3日，中国平安大宗交易成交130.8万股，成交额7265.95万元，占当日总成交额的1.71%，成交价55.55元，较市场收盘价55.55元持平。（界面新闻）", "ctime": 1785749476, "time_str": "17:31:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260803/c678629839.shtml"}, {"id": "4867263", "title": "远东股份：2026年7月中标签约合计28.08亿元", "content": "远东股份公告，公司2026年7月收到子公司中标/签约千万元以上合同订单合计为人民币28.08亿元。其中国家和地方电网小计3.42亿元，其他战略客户合计24.66亿元。上述合同订单将对公司未来经营业绩产生积极影响，但不影响公司业务独立性。", "ctime": 1785749460, "time_str": "17:31:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260803/c678629831.shtml"}, {"id": "4867261", "title": "三星中国开始收缩手机布局：30万元月销售额不达标门店，将被逐步清退", "content": "继三星电子宣布退出中国家电市场后，三星手机同样开始收缩中国市场布局。知情人士表示，月销售额不到30万元的门店，将被逐步清退。 今年5月，三星电子宣布退出中国家电市场，官方表示：“为应对急剧变化的市场环境，经慎重研究，三星电子决定在中国大陆市场停止销售含电视、显示器在内的所有家电产品。”当时，三星电子方面称，半导体业务（存储）、移动终端（手机）以及医疗器械业务正常运营。 不过，三星手机在中国市场的局面也不容乐观。IDC日前发布的2026年第二季度数据显示，三星手机在中国市场的份额仅为0.1%，而去年同期为0.4%，出货量同比下滑60.8%；另外，三星电子日前刚刚发布的第二季度财报显示，其营收与营业利润连续三个季度刷新历史纪录，不过MX（移动体验）业务却出现了0.7万亿韩元营业亏损，这也是三星手机业务首度出现亏损。 在此背景下，三星手机在中国市场正在以关闭低效门店、清退店员等动作降本增效。据不完全统计，其近期关闭的门店涉及深圳、福州、郑州、西安、昆明、合肥等多个省市。一位三星手机门店店员透露，内部设定了每月30万元的销售额门槛，持续未达标的门店和店员将被清退。就当前三星手机在国内的市场份额而言，这个销售额门槛无疑难度较大。 针对收缩中国市场门店、以及后续的发展战略，新浪科技向三星方面发出问询，截至发稿前，官方暂无回应。（新浪科技）", "ctime": 1785749447, "time_str": "17:30:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260803/c678629825.shtml"}, {"id": "4867251", "title": "平治信息：全资子公司出资1000万元参与投资股权基金", "content": "平治信息公告，公司全资子公司平治智凯作为有限合伙人，与普通合伙人犇驰投资及其他有限合伙人共同签署《嘉兴犇启股权投资合伙企业（有限合伙）合伙协议》，以自有资金1000万元参与投资嘉兴犇启股权投资合伙企业（有限合伙），占基金首期工商登记认缴出资总额3200万元的31.25%。基金募集目标总规模上限为5350万元，投资范围包括上海图灵智算量子科技股份有限公司的股权、银行活期存款、货币市场基金。", "ctime": 1785749376, "time_str": "17:29:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260803/c678629777.shtml"}, {"id": "4867243", "title": "*ST利源：拟现金收购金利股份36.19%股权，审计评估等工作正推进", "content": "*ST利源公告，公司拟支付 // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;

  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
