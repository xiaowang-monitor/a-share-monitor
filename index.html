78417815.shtml"}, {"id": "4801151", "title": "海康威视：2026年上半年净利润78.96亿元，同比增长39.57%", "content": "海康威视公告，2026年上半年营业收入468.23亿元，同比增长11.97%。净利润78.96亿元，同比增长39.57%。公司董事会审议通过的中期利润分配方案为：向全体股东每10股派发现金红利5.5元（含税），不送红股，不以资本公积转增股本。", "ctime": 1784882011, "time_str": "16:33:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260724/c678417565.shtml"}, {"id": "4801143", "title": "百纳千成：股东华录资本已减持0.05%", "content": "百纳千成公告，持股5%以上股东华录资本减持计划期限已届满。2026年4月24日至7月23日，华录资本通过集中竞价交易减持50万股，减持均价7.09元/股，减持比例0.05%；大宗交易减持0股。减持后持有5678.73万股，占总股本6.029%。", "ctime": 1784881938, "time_str": "16:32:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260724/c678417494.shtml"}, {"id": "4801117", "title": "英国7月服务业PMI初值 51.8，预期49.4，前值48.8", "content": "英国7月服务业PMI初值 51.8，预期49.4，前值48.8。", "ctime": 1784881836, "time_str": "16:30:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260724/c678417428.shtml"}, {"id": "4801101", "title": "恩捷股份：下属子公司收到退还增值税留抵税额6342.62万元", "content": "恩捷股份公告，下属子公司玉溪恩捷新材料有限公司依据相关规定，收到退还增值税期末留抵税额人民币6342.62万元。该退税将对公司现金流产生积极影响，但对资产和损益不产生直接影响。", "ctime": 1784881586, "time_str": "16:26:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260724/c678417316.shtml"}, {"id": "4801097", "title": "托伦斯今日涨20.00% 国新证券北京分公司净买入9216.78万元", "content": "托伦斯今日涨20.00%，成交额21.96亿元，换手率43.83%，盘后龙虎榜数据显示，1家机构专用席位净买入114.14万元，有4家机构专用席位净卖出1.43亿元。国新证券北京分公司净买入9216.78万元。", "ctime": 1784881579, "time_str": "16:26:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260724/c678417315.shtml"}, {"id": "4801095", "title": "沙特绕开“双峡”出口原油 海运时间增加1个月", "content": "由于霍尔木兹海峡和曼德海峡的航运受到中东战事干扰，沙特阿拉伯不得不改道，经由埃及苏伊士运河绕行非洲出口石油。绕道将使运输时间增加约一个月，运输成本也随之翻倍。一艘油轮从沙特西部红海港口延布经曼德海峡驶往亚洲，通常仅需19天。经由苏伊士运河、地中海、直布罗陀海峡，再绕过非洲好望角至亚洲的航线则需要48天。路透社测算，绕行路线仅燃料成本就从126万美元增至约287万美元，另需缴纳约100万美元的苏伊士运河通行费。（新华社）", "ctime": 1784881577, "time_str": "16:26:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260724/c678417314.shtml"}, {"id": "4801087", "title": "*ST金灵：首次回购股份29.18万股", "content": "*ST金灵公告，2026年7月23日，公司通过回购专用证券账户以集中竞价方式首次回购公司股份29.18万股，占公司总股本的0.0103%，成交均价为2.39元/股，最高成交价为2.4元/股，最低成交价为2.38元/股，支付的总金额为69.67万元（不含交易费用）。", "ctime": 1784881435, "time_str": "16:23:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260724/c678417249.shtml"}, {"id": "4801083", "title": "海正药业：磷酸氟达拉滨注射液获美国FDA批准", "content": "海正药业公告，全资子公司海正药业（杭州）有限公司向美国FDA申报的磷酸氟达拉滨注射液的新药简略申请（ANDA，即美国仿制药申请）已获得批准。这意味着海正杭州公司可以在美国市场销售该产品。磷酸氟达拉滨注射液是一种核苷代谢抑制剂，适应症为：作为联合治疗方案的组成药物，用于治疗成人B细胞慢性淋巴细胞白血病(CLL)；用于对既往接受至少1种含烷化剂的治疗方案治疗无效，或在治疗过程中出现疾病进展的成人B细胞慢性淋巴细胞白血病患者。", "ctime": 1784881384, "time_str": "16:23:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260724/c678417236.shtml"}, {"id": "4801055", "title": "胜利证券有限公司因违反监管规定遭证监会谴责及罚款170万元并暂时吊销其负责人员的牌照", "content": "据香港证监会，胜利证券有限公司因违反监管规定遭证监会谴责及罚款170万元并暂时吊销其负责人员的牌照。", "ctime": 1784881068, "time_str": "16:17:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260724/c678417072.shtml"}, {"id": "4801047", "title": "杭州园林：与清微智能等共同投资设立合资公司", "content": "杭州园林公告，公司拟与北京清微智能科技股份有限公司、道客智算（上海）科技有限公司、芯计源信息科技（上海）有限公司共同投资设立杭微天算（上海）智能科技有限公司，注册资本2000万元。其中，杭州园林认缴出资1020万元，持股51%；清微智能认缴出资300万元，持股15%；道客智算认缴出资300万元，持股15%；芯计源信息认缴出资380万元，持股19%。合资公司处于筹备阶段，尚未正式开展业务。", "ctime": 1784880997, "time_str": "16:16:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260724/c678417017.shtml"}, {"id": "4801045", "title": "浩辰软件：首次回购0.33%公司股份，已支付资金总额为人民币852.51万元", "content": "浩辰软件公告，2026年7月24日，公司通过上海证券交易所交易系统以集中竞价交易方式首次回购公司股份31.66万股，占公司总股本9542.04万股的比例为0.33%，回购成交的最高价为27.14元/股，最低价为26.56元/股，支付的资金总额为人民币852.51万元（不含印花税、交易佣金等交易费用）。", "ctime": 1784880993, "time_str": "16:16:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260724/c678417015.shtml"}, {"id": "4801041", "title": "全聚德：预计上半年净利润同比增长3.39%-25.20%", "content": "全聚德公告，预计2026年上半年净利润为1280万元–1550万元，同比增长3.39%-25.20%。报告期内，公司营业收入同比小幅下降，但是公司持续推进降本增效，对原材料、人工、能源等成本进行精细管控，有效压降成本费用；同时通过主动优化门店布局，持续提升整体盈利水平。", "ctime": 1784880988, "time_str": "16:16:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260724/c678417010.shtml"}, {"id": "4801039", "title": "巴西反对美国连连加税 卢拉称“会找新买家”", "content": "巴西政府发表声明，反对美国以所谓“强迫劳动”为由对巴西征收12.5%的关税，认为该措施“缺乏法律依据”。巴西方面将立即启动相关程序以维护国家利益。巴西发展、工业与贸易部长马尔西奥·罗萨指出，叠加美国近期对部分巴西产品加征25%的关税，巴西鞋类、机械设备、零部件、服装及非医药化工等多个行业面临最高37.5%的税率，产业或受到严重冲击。他表示，巴西希望通过谈判推动美国取消相关关税，但不放弃采取对等措施的可能性。（新华社）", "ctime": 1784880911, "time_str": "16:15:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260724/c678416962.shtml"}, {"id": "4801029", "title": "两部门明确离岸信托个税事项", "content": "记者从财政部了解到，财政部、税务总局7月24日发布公告，明确离岸信托个人所得税有关事项。根据公告，居民将财产装入离岸信托以及离岸信托存续期间产生的收益，需按照规定申报缴纳个人所得税。此次发布的公告对离岸信托设立环节、存续环节和终止环节的个人所得税有关事项分别予以明确。例如，在设立环节，居民个人将财产装入离岸信托，以装入财产的市场价值扣除财产原值和合理费用后的余额为应税所得，按照“财产转让所得”征收个人所得税，适用20%税率。再如，在存续环节，对于居民个人装入财产的离岸信托存续期间产生的收益，根据收益性质分别按照“财产转让所得”和“利息、股息、红利所得”，按年计算缴纳个人所得税，适用20%税率。（新华社）", "ctime": 1784880884, "time_str": "16:14:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260724/c678416949.shtml"}, {"id": "4801021", "title": "两部门：由于离岸信托往往设立在信息透明度低、税负较低的国家和地区，部分个人利用其转移资产、隐匿财富及逃避税", "content": "近日，财政部、税务总局发布了《关于离岸信托征收个人所得税有关事项的公告》。财政部税政司、税务总局所得税司有关负责人就此回答了记者提问。近年来，一些个人通过设立离岸信托进行财富代际传承、跨境资产配置以及风险管理。由于离岸信托往往设立在信息透明度低、税负较低的国家和地区，部分个人利用其转移资产、隐匿财富及逃避税。按照我国个人所得税法对居民全球所得征税的基本原则，《公告》明确了离岸信托设立、存续、终止清算等环节的征税规定，有利于提高税收确定性和透明度，便于纳税人合规遵从；有利于促进社会公平，维护国家权益，稳定纳税人预期。", "ctime": 1784880792, "time_str": "16:13:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260724/c678416903.shtml"}, {"id": "4801013", "title": "外交部：中方愿同巴西进一步拓展健康稳定的经贸合作", "content": "7月24日，外交部发言人林剑主持例行记者会。有记者就巴西输华牛肉配额相关情况提问。林剑表示，中方有关主管部门、商会已对进口牛肉启动保障措施调查事表态。中国连续17年是巴西第一大贸易伙伴，今年上半年，中巴贸易额同比增长近30%，对华出口在巴西对外出口总额占比超过30%。中方愿同包括巴西在内的有关各方保持沟通，进一步拓展健康稳定的经贸合作。（央视新闻）", "ctime": 1784880720, "time_str": "16:12:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260724/c678416830.shtml"}, {"id": "4800991", "title": "港股收评：恒生指数跌0.98%，恒生科技指数跌1.47%", "content": "港股收盘，恒生指数跌0.98%，恒生科技指数跌1.47%。恒指港股通ETF银华（159318）跌1.45%，港股通科技ETF鹏华（159751）跌1.81%。板块方面，酒店和度假村REIT板块涨幅靠前；电气设备、能源设备与服务板块跌幅靠前。个股方面，沪上阿姨涨7.72%，威华达控股涨7.2%，中国再保险涨7.03%，大新金融涨6.67%，澜起科技涨6.67%；大金重工跌13.04%，迅策跌12.86%，旺山旺水-B跌12.36%，海致科技集团跌12.23%，国富量子跌10.59%。", "ctime": 1784880599, "time_str": "16:09:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260724/c678416717.shtml"}, {"id": "4800981", "title": "中国代表强调和平解决争端是联合国会员国宪章义务", "content": "中国常驻联合国代表团临时代办孙磊23日在安理会和平解决争端问题公开辩论会上表示，和平解决争端是联合国会员国应尽的《联合国宪章》义务，应当坚持通过对话协商解决分歧，反对未经安理会授权诉诸武力。孙磊说，当前，百年变局深刻演进，地缘矛盾日益激化，武装冲突多点爆发，热点问题延宕难解，国际形势变乱交织更加突出。国际社会应秉持联合国成立初心，坚定和平信念，守护和平希望。孙磊表示，海湾地区冲突再起，不符合任何一方利益。中方呼吁有关各方顺应国际和地区求和平谋稳定的强烈呼声，保持理性克制，立即停止一切对抗行动，为恢复落实伊美谅解备忘录创造条件。尽早恢复霍尔木兹海峡正常安全通行、尊重霍尔木兹海峡沿岸国合法权益，是国际社会共同愿望，相关各方应相向而行、妥善处理。（新华社）", "ctime": 1784880539, "time_str": "16:08:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260724/c678416476.shtml"}, {"id": "4800967", "title": "商务部新闻发言人就将14家欧盟实体列入出口管制管控名单答记者问", "content": "商务部新闻发言人就将14家欧盟实体列入出口管制管控名单答记者问。\n\n问：2026年7月24日，商务部对外发布管控名单，请问有何考虑？\n\n答：北京时间7月23日晚，欧方正式发布第21轮对俄制裁措施，将14家中国内地和香港企业列单制裁。为维护国家安全和利益，履行防扩散等国际义务，针对欧方上述恶劣行径，根据《中华人民共和国出口管制法》和《中华人民共和国两用物项出口管制条例》等法律法规有关规定，中方决定将拉法特集团等14家欧盟实体列入出口管制管控名单，禁止出口经营者向上述实体出口两用物项，禁止境外组织和个人将原产于中华人民共和国的两用物项转移或提供给上述实体。(央视新闻)", "ctime": 1784880456, "time_str": "16:07:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260724/c678416102.shtml"}, {"id": "4800965", "title": "富乐德：预计2026年上半年净利润同比增长58.62%～93.51%", "content": "富乐德公告，预计2026年上半年净利润为1.82亿元至2.22亿元，同比增长58.62%～93.51%。报告期内，国内晶圆制造企业持续推进产能建设，AI芯片需求等推动设备投资大幅增加，半导体扩产周期拉动洗净服务等需求同步增长；公司各生产基地产能逐步释放，在产能利用率维持高位的规模效应驱动下，公司盈利能力得到较大提升。同时，受益于人工智能技术发展及全球算力需求提升，数据中心建设进程加速，推动公司DPC等新产品市场需求快速增长。", "ctime": 1784880451, "time_str": "16:07:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260724/c678416079.shtml"}, {"id": "4800957", "title": "康恩贝：麝香通心滴丸新适应症获得临床试验批准", "content": "康恩贝公告，全资子公司内蒙古康恩贝收到国家药监局核准签发的有关麝香通心滴丸新适应症的《药物临床试验批准通知书》。麝香通心滴丸新适应症为射血分数保留的心力衰竭（气虚血瘀证），注册分类为中药2.3类（增加功能主治）。该药品为内蒙古康恩贝自主研发、生产的中成药，于2008年获批上市，功能主治为芳香益气通脉，活血化瘀止痛，用于冠心病稳定型劳累性心绞痛，中医辨证气虚血瘀证，症见胸痛胸闷，心悸气短，神倦乏力。", "ctime": 1784880403, "time_str": "16:06:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260724/c678415877.shtml"}, {"id": "4800955", "title": "泰禾智能：控股股东阳光新能源拟增持2%-3%股份", "content": "泰禾智能公告，控股股东阳光新能源截至目前持有公司4715.88万股股份，占公司股份总数的25.78%。阳光新能源计划以自有或自筹资金自本公告披露之日起至2026年12月31日内，通过二级市场集中竞价交易或其他合规合法途径增持公司股份，增持比例不低于公司股份总数的2%（含）且不超过公司股份总数的3%（含）。", "ctime": 1784880399, "time_str": "16:06:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260724/c678415860.shtml"}, {"id": "4800939", "title": "甲骨文股价盘前上涨1.4%", "content": "甲骨文股价盘前上涨1.4%，此前五角大楼授予该公司一份价值70亿美元的软件合同。", "ctime": 1784880323, "time_str": "16:05:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260724/c678415541.shtml"}, {"id": "4800931", "title": "杰克科技：全资子公司收购境外公司股权交割完成", "content": "杰克科技公告，为深入推进国际化发展战略，进一步优化产业链布局，公司拟通过全资子公司拓卡奔马机电科技有限公司以意大利全资子公司Bullmer Italia S.r.l.以现金方式收购Comelz S.p.A.100%股权。本次交易完成后，杰克科技取得Comelz 100%股权，Comelz纳入杰克科技并表范围。2026年7月23日（意大利时间），拓卡奔马全资子公司意大利奔马与交易各方按照约定的条款和条件完成了股权交割的工作，杰克科技通过意大利奔马间接持有Comelz 100%股权。", "ctime": 1784880172, "time_str": "16:02:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260724/c678415204.shtml"}, {"id": "4800927", "title": "住建部：全面推行工程款支付担保 推动实现“见索即付”", "content": "住房城乡建设部现就有关工作印发通知。通知提出，防范化解工程款拖欠风险，强化工程款支付行为约束，建设单位应当与施工单位明确工程预付款、进度款和结算款的支付方式、时间节点和违约责任，防范工程款拖欠风险。全面推行工程款支付担保，鼓励优先采用保证保险或银行保函，推动实现“见索即付”。严格落实过程结算制度，建设单位应当规范结算审核流程和期限，按照合同约定足额支付工程进度款并对无争议价款先行支付，完善工程价款争议解决机制，提高价款结算效率。", "ctime": 1784880159, "time_str": "16:02:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260724/c678415143.shtml"}, {"id": "4800901", "title": "证券公司分类评价结果出炉 14家券商获评AA级", "content": "记者从权威渠道获悉，证监会近日向证券公司发布了2026年分类评价结果，参评主体合计106家，其中44家子公司合并至母公司评价，最终，A类公司53家，B类公司42家，C类公司11家，A类公司中AA级公司14家。据接近监管层的相关人士介绍，下一步，证监会有关部门将重点做好2026年证券公司分类评价工作的解读，通过专题培训等方式，向证监局和行业机构通报分类评价工作的导向和评价标准，进一步增强评价工作的透明度，持续跟踪分类评价实施效果，根据市场发展适时优化评价指标与标准，更好发挥分类评价的“指挥棒”作用。", "ctime": 1784880094, "time_str": "16:01:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260724/c678414874.shtml"}, {"id": "4800899", "title": "创业黑马：拟发行股份及支付现金购买资产并募集配套资金事项将接受审核", "content": "创业黑马公告，公司拟通过发行股份及支付现金方式购买北京版信通技术有限公司100%股权，同时拟向不超过35名特定投资者发行股票募集配套资金。根据深圳证券交易所上市审核中心的有关工作安排，深圳证券交易所并购重组审核委员会拟于近期审核公司发行股份及支付现金购买资产并募集 // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}

  return '#64748b';

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
