10jqka.com.cn/20261105/c681518213.shtml"}, {"id": "5582739", "title": "百济神州：第三季度总收入19亿美元同比增长34%，上调2026年全年收入指引至69亿至70亿美元", "content": "百济神州公告，公司公布截至2026年9月30日止三个月及九个月未经审核业绩。2026年第三季度全球总收入达19亿美元，同比增长34%；百悦泽第三季度全球收入达14亿美元，同比增长34%。GAAP净利润3.85亿美元，上年同期1.25亿美元；经调整净利润5.39亿美元，上年同期3.04亿美元。公司上调2026年全年总收入指引为69亿美元至70亿美元，GAAP经营利润指引为12亿美元至13亿美元，非GAAP经营利润指引为19亿美元至20亿美元。", "ctime": 1793876985, "time_str": "19:09:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261105/c681518206.shtml"}, {"id": "5582595", "title": "新开普：杨维国提议以3000万元-6000万元回购公司股份", "content": "新开普公告，公司于2026年11月4日收到控股股东、实际控制人、董事长兼总经理杨维国先生《关于提议新开普电子股份有限公司回购公司股份的函》。杨维国提议公司以自有资金及/或自筹资金通过集中竞价交易方式回购公司已发行的部分人民币普通股（A股）股票，用于维护公司价值和股东权益所必需，本次拟回购的股份将在披露回购结果暨股份变动公告12个月后采用集中竞价交易方式出售。本次用于回购的资金总额不低于人民币3000万元（含）且不超过人民币6000万元（含），回购价格区间上限不高于董事会通过回购股份决议前三十个交易日公司股票交易均价的150%。杨维国承诺将推动公司尽快召开董事会审议回购股份事项，并对相关议案投赞成票。", "ctime": 1793876751, "time_str": "19:05:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261105/c681517978.shtml"}, {"id": "5582517", "title": "中材节能：全资子公司签约出售房产，成交价4000万元", "content": "中材节能公告，公司此前经审议同意由全资子公司武汉建材院公开挂牌转让位于武汉市东湖新技术开发区光谷大道77号金融港A12栋的办公楼。本次进展为标的房产已征集到受让方，武汉建材院已与湖北盛天网络技术股份有限公司正式签署《资产交易合同》，成交价格为人民币4000万元。受让方须在合同生效后三个工作日内一次性支付转让价款。本次交易不构成关联交易，亦不构成重大资产重组，不会对公司正常生产运营造成不利影响。", "ctime": 1793876659, "time_str": "19:04:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261105/c681517906.shtml"}, {"id": "5582487", "title": "佩斯科夫：俄方在乌克兰问题上的利益与美国内局势无关", "content": "当地时间11月5日，俄罗斯总统新闻秘书佩斯科夫表示，俄罗斯在乌克兰问题上的利益不取决于美国国内局势，在任何情况下都将得到保障。他表示，俄方优先通过和平方式实现目标，只要乌克兰方面有人展现出政治意愿，和平解决途径依然存在；但在和平途径受阻的情况下，俄方将继续开展特别军事行动。（央视新闻）", "ctime": 1793876618, "time_str": "19:03:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261105/c681517694.shtml"}, {"id": "5582231", "title": "我国将加快“AI+机械”复合型人才培养", "content": "记者从中国机械工业联合会获悉，我国将加快“AI+机械”复合型人才培养，将复合型人才培养摆在行业数智化转型的核心位置，全面启动全产业链产教协同人才培养项目。今年在湖北举办的全国人工智能应用技术技能大赛，29支省级代表队、627名选手参赛，设仪器仪表智能感知采集、工业视觉识别、具身智能机器人调试、低空飞行器AI应用等六个赛项，考题取自产业真实生产场景。中国机械工业联合会负责人称，装备制造业转型升级带动“AI+机械”复合型人才缺口持续扩大。（央视新闻）", "ctime": 1793876411, "time_str": "19:00:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261105/c681517040.shtml"}, {"id": "5582213", "title": "侨源股份：拟投资31.58亿元建设高纯度氟系列电子特气项目", "content": "侨源股份公告，公司拟与自贡市沿滩区人民政府签订《招商引资协议》，投资建设“侨源股份高纯度氟系列电子特气及配套材料一体化项目”，项目计划总投资额度预计为31.58亿元，其中固定资产投资预计约31.08亿元。项目分三期建设，一期计划投资额度预计约6.69亿元，建设六氟化钨装置600t/a、六氟丁二烯装置200t/a及配套空分装置等，自签订交地确认书之日起6个月内开工建设，开工之日起18个月内建成投产。截至公告披露日，《招商引资协议》尚未签署，本次事项尚需提交公司2026年第四次临时股东会审议。", "ctime": 1793876371, "time_str": "18:59:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261105/c681517029.shtml"}, {"id": "5582211", "title": "商务部：中国与阿曼将构建更具韧性的产供链合作伙伴关系", "content": "商务部新闻发言人黄玲在例行新闻发布会上表示，中国和阿曼将聚焦绿色发展、数字经济等重点领域，构建更具韧性的产供链合作伙伴关系。11月2日，中国商务部与阿曼主管部门分别签署了关于加强产供链经济合作、推动绿色发展领域投资合作两份谅解备忘录，双方将致力于构建更具韧性的产供链合作伙伴关系，助力中阿经贸合作向更高水平发展。（央视新闻）", "ctime": 1793876352, "time_str": "18:59:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261105/c681517019.shtml"}, {"id": "5582179", "title": "工业和信息化部：积极稳妥推进低空装备产业安全发展", "content": "工信部5日表示，在确保安全前提下，我国将积极稳妥推进低空装备产业安全健康有序发展，以安全为第一要素，加强无人机安全风险管控，加快构建法律法规、标准等管理体系；以无人化、电动化、网联化、智能化为主攻方向推动科技创新和产业创新深度融合；坚持先载货后载人、先隔离后融合、先远郊后城区原则，培育可复制可推广标杆场景。天域航通鸿雁大型无人机系统已获印尼全球首张无人机出口适航证，签订20架出口订单。我国将加快打造立足西部、面向全国、辐射中亚的低空装备产业集聚地。（央视新闻）", "ctime": 1793876237, "time_str": "18:57:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261105/c681516981.shtml"}, {"id": "5582161", "title": "康弘药业：伊布替尼胶囊获药品注册证书", "content": "康弘药业公告，公司于近日收到国家药品监督管理局签发的伊布替尼胶囊《药品注册证书》（证书编号：2026S04004）。该药品规格为140mg，注册分类为化学药品4类，批准文号为国药准字H20266472，适应症包括套细胞淋巴瘤、慢性淋巴细胞白血病/小淋巴细胞淋巴瘤及华氏巨球蛋白血症等。本次获批进一步拓展了公司在抗肿瘤药物领域的产品布局与管线。", "ctime": 1793876144, "time_str": "18:55:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261105/c681516950.shtml"}, {"id": "5582153", "title": "佩斯科夫称俄罗斯对美国柴油出口将按约落实", "content": "11月5日，俄罗斯总统新闻秘书佩斯科夫在例行新闻简报会上表示，根据俄美双方达成的协议，所有运往美国的俄罗斯柴油都将找到买家。他呼吁外界不要将油轮改变航向与美国中期选举结果相联系，并指出相关商业细节不便公开。此前有报道称，三艘运往美国的俄罗斯柴油油轮中有两艘，因美国民主党和当局对相关企业发出威胁而改变航向。（央视新闻）", "ctime": 1793876111, "time_str": "18:55:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261105/c681516938.shtml"}, {"id": "5582141", "title": "商务部：上海中心聚焦绿色发展、数字经济等领域", "content": "在商务部今天举行的新闻发布会上，商务部新闻发言人介绍，11月4日，中方与联合国开发计划署在上海签署关于设立上海中心的《东道国协定》和《运行协定》。商务部新闻发言人黄玲表示，上海中心聚焦绿色发展、数字经济、贸易促进可持续发展等三个重要领域，着力促进全球南方合作。协定签署后，中方将继续与联合国开发计划署共同合作，将上海中心打造成政策研究转化的“孵化器”，分享中国在绿色、数字、贸易等领域的发展经验，呼应全球南方国家实现绿色、数字转型发展的迫切需要，助力加快落实联合国2030年可持续发展议程。（央视新闻）", "ctime": 1793875984, "time_str": "18:53:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261105/c681516887.shtml"}, {"id": "5582123", "title": "中国海警三都舰起航赴马来西亚访问", "content": "中国海警三都舰5日从海南三亚起航，赴马来西亚槟城开展港口访问，旨在深化中马两国海警机构友好往来与务实合作，提升海上执法协作水平，共同维护南海地区和平稳定，期间将开展高级别会晤和多项海上执法务实科目交流。这是中马双方连续第二年正式开展海上执法机构交流互动。马来西亚海事执法局8305船曾于2025年6月到访海南三亚。（新华社）", "ctime": 1793875913, "time_str": "18:51:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261105/c681516874.shtml"}, {"id": "5582113", "title": "币安：作为预防措施，已移除与SignalPlus关联的API密钥", "content": "币安：作为预防措施，已移除与SignalPlus关联的API密钥。", "ctime": 1793875904, "time_str": "18:51:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261105/c681516873.shtml"}, {"id": "5582073", "title": "反对声浪之下 OpenAI将改变数据中心项目推进方式", "content": "OpenAI周四公布承诺，在洽谈数据中心项目时将避免使用保密协议，并确保当地居民无需为项目所需电力买单；在National Community Compact框架中承诺就噪音、用水和能源消耗等问题提供清晰数据，用电高峰期降低电力消耗、向电网回送电力，并在当地劳动力条件允许时设定本地招聘目标，还将公开报告落实进展。首席全球事务官Chris Lehane表示，该声明早在选举结果出炉前就已计划并筹备数月，包含此前在佐治亚州等地的已宣布措施及与佐治亚州、俄亥俄州、德克萨斯州等地居民和官员交流后制定的新举措。（新浪财经）", "ctime": 1793875785, "time_str": "18:49:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261105/c681516833.shtml"}, {"id": "5582071", "title": "水晶光电：拟以1亿元-2亿元回购公司股份", "content": "水晶光电公告，拟以不低于1亿元且不超过2亿元回购公司股份，回购价格不超过28元/股。回购股份的用途为出售，所回购股份将在披露回购结果暨股份变动公告12个月后采用集中竞价交易的方式择机全部出售；如公司未能在股份回购实施完成之后3年内实施上述用途，尚未使用的已回购股份将在履行相应程序后予以注销。回购股份的资金来源为公司自有资金及/或自筹资金（含回购专项贷），回购期限为自董事会审议通过本回购方案之日起3个月内。", "ctime": 1793875778, "time_str": "18:49:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261105/c681516831.shtml"}, {"id": "5581993", "title": "牧原股份：2026年10月商品猪销售收入72.53亿元，同比下降29.79%", "content": "牧原股份公告，2026年10月份，公司销售商品猪591.3万头，同比变动-16.43%；商品猪销售均价9.64元/公斤，同比变动-16.54%；商品猪销售收入72.53亿元，同比变动-29.79%。2026年1-10月累计销售商品猪6464.3万头，累计销售收入840.7亿元。2026年10月份，公司全资子公司牧原肉食品有限公司及其子公司屠宰生猪295.7万头。", "ctime": 1793875401, "time_str": "18:43:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261105/c681516727.shtml"}, {"id": "5581971", "title": "聚石化学：拟1.26亿元出售聚宝石化70%股权", "content": "聚石化学公告，公司与苏州文隽签署《股权转让协议》，拟以1.26亿元转让持有的聚宝石化70%股权，交易完成后仍持有30%股权，聚宝石化不再纳入合并报表范围。本次交易已经第七届董事会第十五次会议审议通过，无需提交股东会审议，不构成关联交易及重大资产重组，尚需履行工商变更等手续。截至协议签订日，聚宝石化尚有借款本金1.1亿元未归还公司，苏州文隽、聚宝石化承诺于协议生效后12个月内偿还；公司为聚宝石化提供的担保余额为1480.45万元，承诺于协议生效后6个月内解除。", "ctime": 1793875292, "time_str": "18:41:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261105/c681516689.shtml"}, {"id": "5581955", "title": "金刚光伏：子公司签署算力云服务合同含税总价不超15.36亿元", "content": "金刚光伏公告，公司控股子公司酒泉金刚于2026年11月5日与算力客户A签署《算力云服务合同》，向其提供算力云服务，分批次交付全部算力节点，各批次服务期限均为60个月。合同项下云服务费含税预估总价不超过15.36亿元，其中第一批及第二批合计含税3.84亿元，后续批次价格可按约定机制调整。合同金额占公司最近一个会计年度经审计主营业务收入比例超过100%，已经董事会审议通过，无需股东会审议。", "ctime": 1793875240, "time_str": "18:40:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261105/c681516670.shtml"}, {"id": "5581953", "title": "恒基达鑫：拟以5000万元-1亿元回购公司股份", "content": "恒基达鑫公告，拟以不低于人民币5000万元（含）且不超过人民币1亿元（含）回购公司股份，回购价格不超过人民币8.56元/股（含）。按回购价格上限测算，预计回购股份数量为584.11万股至1168.22万股，占公司目前总股本的比例为1.44%至2.88%。回购股份用途为维护公司价值及股东权益（出售），后续如拟将部分或全部回购股份变更用途用于员工持股计划或股权激励，公司将另行履行董事会审议程序及信息披露义务。回购实施期限为自董事会审议通过回购股份方案之日起不超过3个月，资金来源为公司自有资金及/或自筹资金。", "ctime": 1793875232, "time_str": "18:40:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261105/c681516668.shtml"}, {"id": "5581937", "title": "法国一银行遭网络攻击", "content": "法国互助信贷阿凯亚银行4日通报，遭黑客进入自身账户并向其他银行转账，被盗资金经专门平台兑换成加密货币，银行已拦截部分资金，正采取措施追回其余资金，客户资金未受损失。法方消息称被转走资金或超1亿欧元，银行未确认，称数额仍在评估中。巴黎检察官办公室已展开正式调查。（央视新闻）", "ctime": 1793875113, "time_str": "18:38:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261105/c681516643.shtml"}, {"id": "5581927", "title": "睿创微纳：实控人、董事长马宏提议公司回购股份，回购资金总额不低于5000万元且不高于1亿元", "content": "睿创微纳公告，公司董事会于2026年11月5日收到公司实际控制人、董事长马宏先生《关于提议烟台睿创微纳技术股份有限公司回购公司股份的函》。马宏基于对公司未来发展前景的信心和对公司长期价值的认可，提议公司使用自有资金及自筹资金以集中竞价交易方式回购公司部分人民币普通股（A股）股票，回购资金总额不低于人民币5000万元（含），不高于人民币1亿元（含），回购价格不高于公司董事会通过回购决议前30个交易日公司股票交易均价的150%，回购股份用于维护公司价值及股东权益，回购期限为自公司董事会审议通过本次回购方案之日起3个月内。马宏承诺将积极推动公司尽快推进回购股份事项，并在董事会上对回购股份议案投赞成票。", "ctime": 1793875054, "time_str": "18:37:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261105/c681516627.shtml"}, {"id": "5581923", "title": "富春股份：拟以1000万元-2000万元回购公司股份", "content": "富春股份公告，拟使用自有资金或自筹资金以集中竞价交易方式回购公司已发行的部分人民币普通股（A股），本次回购的股份将全部予以注销并相应减少公司注册资本。本次回购股份资金总额不低于人民币1000万元（含）且不超过人民币2000万元（含），回购价格不超过人民币8.87元/股（含本数）。按回购价格上限8.87元/股测算，预计回购股份数量为112.74万股至225.48万股，占公司当前总股本比例为0.16%至0.32%。回购实施期限为自股东会审议通过回购股份方案之日起12个月内。该方案尚需提交公司股东会审议。", "ctime": 1793875044, "time_str": "18:37:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261105/c681516623.shtml"}, {"id": "5581919", "title": "高测股份：拟以1.5亿元-3亿元回购公司股份", "content": "高测股份公告，拟以不低于人民币1.5亿元（含）、不超过人民币3亿元（含）回购公司股份，回购价格不超过人民币10.65元/股（含），回购股份用于员工持股计划或股权激励、维护公司价值及股东权益。其中，用于员工持股计划或股权激励的回购金额不低于人民币9000万元（含），不超过人民币1.8亿元（含）；用于维护公司价值及股东权益的回购金额不低于人民币6000万元（含），不超过人民币1.2亿元（含）。回购方式为集中竞价交易方式，资金来源为自有资金及自筹资金。", "ctime": 1793875038, "time_str": "18:37:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261105/c681516621.shtml"}, {"id": "5581917", "title": "星源材质：欧洲星源与大众电池子公司签定点协议，2027至2034年预计供货15.58亿平方米", "content": "星源材质公告，全资子公司欧洲星源与德国大众车厂旗下动力电池子公司签订《定点协议》，约定2027年至2034年期间由欧洲星源向客户供应约15.58亿平方米湿法涂覆锂离子电池隔膜材料。公司于2024年11月与该客户签署《定点协议》，2025-2032年期间预计累计供货约20.9亿平方米，综上如协议顺利履行公司预计将累计为该客户供货约36亿平方米。本协议为框架性约定，不构成业绩承诺。", "ctime": 1793875029, "time_str": "18:37:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261105/c681516618.shtml"}, {"id": "5581911", "title": "天赐材料：子公司与亿纬锂能签订45万吨电解液长期供货协议", "content": "天赐材料公告，公司全资子公司九江天赐与亿纬锂能签订《长期供货协议》，约定2027年至2029年向亿纬锂能供应预计需求数量为45万吨的电解液产品，双方同意按需求预测数量上下浮动20%执行订单，协议有效期至2029年12月31日。该协议为框架性协议，如充分履行预计将对公司2027年至2029年度经营业绩产生积极影响。", "ctime": 1793875022, "time_str": "18:37:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261105/c681516616.shtml"}, {"id": "5581905", "title": "中央气象台：本周六北京河北等地有中到大雪或雨夹雪", "content": "预计11月7日，山西北部、河北北部、北京北部、辽宁南部等地有中到大雪或雨夹雪、部分地区有暴雪或大暴雪，设施农业雪灾风险较高，其中河北东部、辽宁西南部设施农业雪灾风险高。建议提前检修加固设施大棚，雪后及时清除棚顶积雪，并注意调节棚内温度和湿度、适时增温补光。(央视新闻)", "ctime": 1793874970, "time_str": "18:36:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261105/c681516587.shtml"}, {"id": "5581885", "title": "南非地方选举开始计票　非国大暂时保持微弱优势", "content": "南非独立选举委员会5日公布部分计票数据：4日南非地方政府选举中，截至5日10时30分，已完成统计约25%有效选票，非国大得票率约32%，暂以微弱优势领先民主联盟的29%。非国大在九省中暂领先西北、北开普、东开普、姆普马兰加、林波波和自由州6省；民主联盟在豪滕和西开普2省领先，民族之矛党在夸祖卢－纳塔尔省领先。在被视为“重中之重”的8个大都会区，民主联盟除在开普敦领先外，还在约翰内斯堡（40%对17%）等四区领先非国大。（新华社）", "ctime": 1793874821, "time_str": "18:33:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261105/c681516527.shtml"}, {"id": "5581859", "title": "ST豆神：董事赵伯奇、朱雅特完成增持计划，合计增持629.25万股", "content": "ST豆神公告，公司董事兼首席执行官赵伯奇、董事兼副总裁朱雅特此前披露增持计划，拟分别增持不低于1200万元、800万元，实施期限为2026年5月6日至2026年11月6日。截至本公告披露日，赵伯奇通过集中竞价累计增持公司股份389.5万股，占公司总股本的0.1885%，增持金额约1202.07万元；朱雅特累计增持239.75万股，占公司总股本的0.1160%，增持金额约800.91万元。本次增持计划已完成，合计增持629.25万股，占公司总股本的0.3045%。", "ctime": 1793874725, "time_str": "18:32:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261105/c681516499.shtml"}, {"id": "5581857", "title": "一艘油轮在卡塔尔以北海域遭袭", "content": "英国海上贸易行动办公室5日通报，一艘油轮在卡塔尔以北海域遭两枚不明发射物击中，船员状况、船舶受损程度及环境影响尚未确认。事件发生于协调世界时4日23时20分（北京时间5日7时20分），地点位于卡塔尔北部城市沙迈勒以北50海里（约93公里）处。相关部门正在调查，过往船舶应谨慎航行并报告可疑活动。近期霍尔木兹海峡及周边海域袭船事件持续发生，袭击范围不断向波斯湾内部水域延伸，此次遇袭地点位于卡塔尔半岛以北、霍尔木兹海峡以西的波斯湾海域。（新华社）", "ctime": 1793874696, "time_str": "18:31:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261105/c681516491.shtml"}, {"id": "5581779", "title": "NYMEX取暖油主力合约涨超1%", "content": "NYMEX取暖油主力合约涨超1%，现报4.26美元/加仑。", "ctime": 1793874254, "time_str": "18:24:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261105/c681516359.shtml"}, {"id": "5581769", "title": "韩国拟扩大护航部队任务区域至霍尔木兹海峡附近海域", "content": "据韩联社5日报道，韩国国防部当天表示，计划向国会提交延长护航部队（即清海部队）派遣期限的修订同意案，内容包括将部队任务区域扩大至距离霍尔木兹海峡较近的阿曼南部海域，同时增派军事装备和兵力。 韩联社指出，此举可被视为韩国为稳定霍尔木兹海峡局势，在军事行动上实际迈出的第一步。清海部队是韩国自2009年起派驻亚丁湾海域的海外派遣部队，主要执行护航及反海盗行动。 根据修订同意案，清海部队派遣海域将扩大至阿曼杜库姆港南端。杜库姆港距离霍尔木兹海峡的直线距离约为350海里（约650公里）。与霍尔木兹海峡直接相连的阿曼湾则不在此次任务区域扩大范围内。 此前，清海部队的派遣海域规定为“亚丁湾海域一带，以及在紧急情况下开展韩国公民保护活动时指定的海域”。 韩国政府同时计划增派一架最新型P-8A“海神”海上巡逻机，以及无人潜航器、无人水面艇、遥控水下机器人等无人扫雷装备和爆炸物处理分队。（新华社）", "ctime": 1793874135, "time_str": "18:22:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261105/c681516323.shtml"}, {"id": "5581733", "title": "中国为全球海洋生物多样性治理贡献力量", "content": "2026年11月5日，《〈海洋生物多样性协定〉地位、作用、前景与中国角色》研究报告中英文版对外发布。报告由自然资源部海洋发展战略研究所组织编制，系统阐释《〈联合国海洋法公约〉下国家管辖范围以外区域海洋生物多样性的养护和可持续利用协定》（简称《海洋生物多样性协定》或《协定》）生效的重大意义和中国做出的积极贡献，展现中国在推动国际规则构建、助力《协定》落地实施中的责任担当。(新华社)", "ctime": 1793873959, "time_str": "18:19:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261105/c681516243.shtml"}, {"id": "5581693", "title": "杰普特：拟以5000万元-7000万元回购公司股份", "content": "杰普特公告，拟以自有资金或自筹资金通过集中竞价交易方式回购公司股份，回购资金总额不低于人民币5000万元（含）且不超过人民币7000万元（含），回购价格不超过550元/股（含）。本次回购的股份拟将全部予以注销并减少公司注册资本。按回购价格上限测算，预计回购股份数量为9.09万股~12.73万股，占总股本比例0.10%~0.13%。回购期限自公司股东会审议通过本次回购方案之日起12个月内。", "ctime": 1793873708, "time_str": "18:15:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261105/c681516099.shtml"}, {"id": "5581667", "title": "日本新版“安保三文件”未来5年将防卫开支翻倍，外交部回应", "content": "有报道称，日本政府拟于12月通过新版“安保三文件”。对此，11月5日，外交部发言人郭嘉昆回应称，日本“再军事化”狂飙突进，不断突破“专守防卫”，严重威胁地区和平稳定，挑战战后国际秩序，国际社会必须高度警惕、共同遏制。（澎湃新闻）", "ctime": 1793873563, "time_str": "18:12:43", "stock_code": "", "stock_name": "", "stock_market": " // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
