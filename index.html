.up { color: var(--red); }
.down { color: var(--green); }
.pulse { animation: pulse 2s infinite; }
@keyframes pulse {

  50% { opacity: 0.5; }

2026年北京香山论坛先导会在京开幕", "content": "2026年北京香山论坛先导会8日在北京开幕。 本次先导会由中国军事科学学会和中国国际战略学会共同主办，以“全球安全治理：挑战与出路”为主题，邀请了40余个国家和国际组织的120余名官方代表、专家学者参会。 会议期间，与会代表将围绕“国际秩序与国际法治”“亚太安全新挑战”“维护国际共同安全的责任”及“新兴技术军事应用的风险管控”等重要议题展开研讨。今年正值北京香山论坛创立20周年，本次先导会还将举办“国际论坛在全球安全治理中的作用——北京香山论坛20周年纪念特别专题交流”活动，邀请全球知名防务与安全智库代表，共同回顾北京香山论坛二十载历程，探讨国际安全论坛在平等对话、凝聚共识、化解分歧等方面的独特价值。(新华社)", "ctime": 1778214076, "time_str": "12:21:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260508/c676535613.shtml"}, {"id": "4338009", "title": "百联股份成立奥特莱斯商业管理公司", "content": "企查查APP显示，近日，上海百联奥特莱斯商业管理有限公司成立，法定代表人为曹海伦，注册资本为2000万元，经营范围包含：商业综合体管理服务；工程管理服务；停车场服务；咨询策划服务；企业管理咨询；市场营销策划等。企查查股权穿透显示，该公司由百联股份全资持股。（人民财讯）", "ctime": 1778213587, "time_str": "12:13:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260508/c676535432.shtml"}, {"id": "4338005", "title": "港股午评：恒生指数跌1.09%，恒生科技指数跌1.07%", "content": "港股午间收盘，恒生指数跌1.09%，恒生科技指数跌1.07%。恒指港股通ETF银华（159318）跌1.24%，港股通科技ETF鹏华（159751）跌1.65%。板块方面，医疗保健技术、通信设备板块涨幅靠前；半导体产品与设备、电气设备板块跌幅靠前。个股方面，海致科技集团涨18.66%，药捷安康-B涨18.55%，美图公司涨12.5%，FORTIOR涨10.79%，怡俊集团控股涨9.45%；华虹半导体跌9.76%，创新实业跌7.36%，龙蟠科技跌7.24%，MINIMAX-W跌7.13%，东方电气跌7.08%。", "ctime": 1778213561, "time_str": "12:12:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260508/c676535425.shtml"}, {"id": "4337999", "title": "湖南浏阳烟花厂爆炸事故已致37人死亡", "content": "5月4日下午，浏阳市华盛烟花制造燃放有限公司发生爆炸。截至5月8日，事故已致37人死亡。（央视新闻）", "ctime": 1778213472, "time_str": "12:11:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260508/c676535410.shtml"}, {"id": "4337997", "title": "古巴政府：美国新一轮制裁措施是“经济侵略”", "content": "古巴外交部7日发布公告说，美国对古巴新一轮制裁措施是“经济侵略”行为，企图制造所谓“人道主义危机”，以此为借口采取更危险的行动，包括对古巴发动军事侵略。 公告表示，美方7日公布的新一轮制裁措施旨在进一步扩大美国封锁政策的域外效力，并可能对外国企业、银行及其他实体实施“次级制裁”，进一步阻碍古巴经济运行。 公告说，美国一向以“世界宪兵”自居，公然违反国际法和自由贸易原则，企图通过胁迫和恐吓迫使国际社会服从并执行对古封锁。美国正试图将古巴进一步孤立于国际经济和金融体系之外。古巴将继续在所有国际场合谴责美国封锁政策，呼吁国际社会共同抵制这一打压行动。 美国财政部和国务院7日在官网上公布针对古巴的新一轮制裁措施。美国财政部外国资产控制办公室发布公告，把来自古巴的多名个人和实体列入“特别指定国民清单”。美国务院也发布公告，将古巴企业管理集团公司、莫阿镍厂以及相关企业高管列入制裁名单。(新华社)", "ctime": 1778213459, "time_str": "12:10:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260508/c676535408.shtml"}, {"id": "4337985", "title": "消息人士称预计伊官员今日正式回应美对14点提议的评估反馈", "content": "总台记者当地时间5月8日获悉，据巴基斯坦方面消息，伊朗正在审查美国对14点提议的回应。14点提议旨在正式结束敌对行动，并开启为期30天的谈判窗口，就伊朗核计划、解除制裁以及霍尔木兹海峡安全通行等问题进行详细讨论。巴基斯坦外交消息人士称，预计伊朗官员将于5月8日正式作出回应，美国方面正在等待伊朗在关键问题上的立场。伊朗日前通过斡旋方巴基斯坦向美方提交了一份包含14点提议的新方案，主要内容包括确保不再发生军事侵略、美军支付赔偿、建立霍尔木兹海峡新的管理机制等。特朗普5月2日表示，他将很快评估伊朗的新方案，但“无法想象”该方案“可以接受”。（央视新闻）", "ctime": 1778213192, "time_str": "12:06:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260508/c676535320.shtml"}, {"id": "4337979", "title": "伊朗外长赞赏巴基斯坦对伊外交和人道支持", "content": "巴基斯坦外交部7日发表声明说，巴基斯坦副总理兼外交部长达尔当天与伊朗外交部长阿拉格齐通电话，双方就近期地区动态以及旨在促进和平与稳定的持续外交努力交换意见。阿拉格齐向达尔简要通报近期伊方外交成果，感谢巴方促成美国释放被扣押船只上的伊朗公民，赞赏巴方持续给予的外交和人道主义支持。(新华社)", "ctime": 1778213061, "time_str": "12:04:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260508/c676535278.shtml"}, {"id": "4337933", "title": "建设两岸融合发展示范区部省际工作会议在京举行", "content": "中共中央台办、国家发展改革委、福建省会同48个中央和国家机关有关部门，8日在北京召开建设两岸融合发展示范区部省际工作会议。会议总结了《中共中央 国务院关于支持福建探索海峡两岸融合发展新路建设两岸融合发展示范区的意见》贯彻落实情况，研究下步重点工作，支持福建在探索海峡两岸融合发展新路上迈出更大步伐，高质量建设两岸融合发展示范区。（央视新闻）", "ctime": 1778212676, "time_str": "11:57:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260508/c676535105.shtml"}, {"id": "4337923", "title": "恺英网络旗下公司与中手游达成战略合作 推出智能体GamePartner.AI", "content": "2026年5月8日，恺英网络旗下杭州极逸人工智能科技有限公司（简称“极逸人工智能”）与中手游共同宣布，双方达成深度战略合作，推出面向全球游戏市场，由AI驱动的市场洞察、游戏开发到全球发行的一站式智能体——GamePartner.AI（简称“GPA”），助力并构建中国游戏开发者出海生态。该平台由极逸人工智能提供核心AI游戏开发技术支持，中手游负责全球推广与运营。（人民财讯）", "ctime": 1778212404, "time_str": "11:53:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260508/c676535035.shtml"}, {"id": "4337917", "title": "中证协启动2026年券商做好金融“五篇大文章”试评价，普惠与养老指标进一步细化", "content": "中国证券业协会日前正式启动2026年证券公司做好金融“五篇大文章”试评价工作。梳理发现，此次试评价“普惠金融”大类指标下增设“服务居民财富管理”指标，明确将券商服务居民财富管理及中长期资金入市的衍生品交易业务规模纳入统计。与此同时，“养老金融”大类指标下的“服务居民养老”指标统计口径也进一步细化。除了细化指标外，此次试评价还进一步优化了“科技领域股权融资”和“科技领域并购重组交易”两项关键指标的统计口径。（中证金牛座）", "ctime": 1778212211, "time_str": "11:50:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260508/c676534963.shtml"}, {"id": "4337893", "title": "奕行智能获得中国移动链长基金数亿元战略投资", "content": "5月8日，记者在2026移动云大会期间获悉，国内RISC-V AI算力芯片企业奕行智能获得中国移动链长基金数亿元的战略投资。奕行智能计划将募集资金重点用于Epoch系列产品量产交付与商业化加速、下一代产品研发、软硬协同生态建设及全球市场与产业合作拓展。（第一财经）", "ctime": 1778211948, "time_str": "11:45:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260508/c676534913.shtml"}, {"id": "4337891", "title": "30条中日航线4月取消全部航班", "content": "航班管家DAST最新统计显示，4月共有30条中日航线取消全部航班，比3月取消数量有所减少。不过，4月实际执行的赴日航班较3月整体减少182班。整个4月中国大陆赴日本共有1543个航班取消，取消率为37.7%。（第一财经）", "ctime": 1778211917, "time_str": "11:45:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260508/c676534898.shtml"}, {"id": "4337889", "title": "小鹏第二代VLA智驾里程占比突破50%", "content": "小鹏集团5月8日披露，第二代VLA推送一个月，智驾里程占比突破50%，这是行业首次跨越的历史性节点，意味着在真实驾驶场景中，已有超过一半的路程由“AI司机”主导。（人民财讯）", "ctime": 1778211894, "time_str": "11:44:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260508/c676534890.shtml"}, {"id": "4337887", "title": "亚洲航空订购150架空客A220飞机", "content": "马来西亚亚洲航空确认订购150架最新一代空客A220-300飞机。该笔采购协议是空客A220系列飞机迄今为止最大的单笔确认订单，使该项目的确认订单总数突破1000架。（界面新闻）", "ctime": 1778211727, "time_str": "11:42:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260508/c676534844.shtml"}, {"id": "4337885", "title": "5月8日午间公告一览：迦南智能公司中标1.21亿元国家电网项目", "content": "迦南智能公告，公司于2026年5月7日收到国家电网有限公司及国网物资有限公司发给公司的中标通知书，在“国家电网有限公司2026年营销项目第一次计量设备公开招标采购”项目中，公司为此项目A级单相智能电能表、B级三相智能电能表、C级三相智能电能表、智能融合终端、专变采集终端的中标人，共中7个标包，合计中标金额约为1.21亿元。", "ctime": 1778211665, "time_str": "11:41:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260508/c676534827.shtml"}, {"id": "4337881", "title": "ETF两市成交额2424.36亿元", "content": "截至目前，ETF两市成交额报2424.36亿元，分类型来看，股票型ETF成交额999.4亿元，债券型ETF成交额838.11亿元，货币型ETF成交额214.51亿元，商品型ETF成交额44.16亿元，QDII型ETF成交额214.36亿元。其中，成交额最高的非货币型ETF分别是中证500ETF（510500）、中证A500ETF（159338）、A500ETF（159352）成交额分别为：45.59亿元、40.83亿元、35.49亿元", "ctime": 1778211108, "time_str": "11:31:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260508/c676534515.shtml"}, {"id": "4337879", "title": "A股午评：创业板指半日跌近1%，人形机器人概念股集体爆发", "content": "A股三大指数早盘集体下跌，截至午盘，上证指数跌0.43%，深证成指跌0.94%，创业板指跌0.98%，北证50涨2.06%。全市场成交额19851亿元，较上日缩量140亿元，全市场超3000只个股上涨。板块题材上，港口航运、人形机器人、游戏、油气开采及服务、汽车零部件、房地产、工业母机板块涨幅居前；能源金属、半导体、风电设备、氟化工概念、电池、化肥、CRO概念股跌幅居前。盘面上，经历前期连续上涨后半导体板块多数调整，寒武纪、龙芯中科、海光信息等股跌超5%。电池板块冲高回落，天华新能、湖南裕能、恩捷股份纷纷下挫。另一方面，特斯拉宣布旗下Optimus人形机器人将于2026年第二季度启动量产，相关概念股早盘爆发，襄阳轴承、五洲新春、天奇股份等10余股涨停。霍尔木兹海峡变化反复，港口航运板块冲高，北部湾港封死涨停，国航远洋涨超15%。PCB概念股早盘冲高后稍有回落，胜宏科技、迅捷兴等股一度刷新历史新高。", "ctime": 1778211071, "time_str": "11:31:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260508/c676534512.shtml"}, {"id": "4337877", "title": "ETF午评：机器人ETF领涨2.79%，芯片ETF领跌3.76%", "content": "ETF午间收盘涨跌不一，机器人ETF（159530）领涨2.79%，机器人 _name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260508/c676533223.shtml"}, {"id": "4337713", "title": "零硬件改造、依托现有电表！电动车室内充电风险智能识别系统上线", "content": "记者今天了解到，在市场监管总局的指导下，云南电网依托国家计量数据建设应用中心（绿色电力），成功研发并落地应用“电动车室内充电风险智能识别系统”。该系统通过技术创新赋能监管模式转型，实现了对高层建筑内电动自行车违规入户充电行为的高效、精准识别与风险预警。该系统构建了一套大数据驱动、无硬件改造的远程“技术+管理”协同治理模式。在技术上，该系统运用人工智能分析算法，基于电网现有智能电表提供的15分钟负荷曲线趋势特征，即可远程精准识别电动自行车充电的“电化学指纹”，实现了低成本、可推广的普适性监测。在管理上，该系统支撑构建“智能识别—风险画像—闭环治理”的全链条机制，将预警信息推送至电网、物业、社区等多方责任主体，形成从发现、核查、整改到长效监控的线上管理闭环。目前，该系统已在50余个代表性居民区成功试运行，在无需加装设备、不增加投资的前提下，系统识别准确率达88%。（央视新闻）", "ctime": 1778207687, "time_str": "10:34:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260508/c676533185.shtml"}, {"id": "4337707", "title": "沪深京三市成交额超1.5万亿元，较上日此时缩量289亿元", "content": "据同花顺iFinD数据，沪深京三市成交额超1.5万亿元，较上日此时缩量289亿元，预计全天成交金额约3.1万亿元。截至目前，沪市成交额6371亿元，深市成交额8500亿元，北证50成交额136亿元。", "ctime": 1778207637, "time_str": "10:33:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260508/c676533174.shtml"}, {"id": "4337689", "title": "国际能源署署长说可能进一步释放战略石油储备", "content": "国际能源署署长法提赫·比罗尔7日说，全球能源市场已进入波动期，若供应中断持续，国际能源署将进一步释放战略石油储备。比罗尔当天在出席一场关于加拿大经济增长的会议时说：“市场的关键词是‘波动’。因此，石油安全仍将是一个核心议题。”比罗尔说，由于中东战事延宕导致每天数百万桶石油供应中断，能源市场正进入“深水区”。即便战事结束，供应恢复也可能缓慢。如果供应中断情况得不到缓解，国际能源署已准备好投放更多战略石油储备。(新华社)", "ctime": 1778207373, "time_str": "10:29:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260508/c676533071.shtml"}, {"id": "4337685", "title": "北证50指数涨幅扩大至2%", "content": "北证50指数涨幅扩大至2%，现报1433.24点。", "ctime": 1778207177, "time_str": "10:26:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260508/c676532997.shtml"}, {"id": "4337661", "title": "人形机器人概念股震荡走高，五洲新春、大业股份涨停", "content": "人 // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {

  return '#64748b';

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
