t": "按照已披露的半年报、业绩快报、预告净利润下限（若未披露下限则取公告数值）统计，今年上半年净利润同比增长30%以上（含扭亏为盈）的新型储能概念股有22只。恩捷股份、鹏辉能源、智光电气、钒钛股份净利润扭亏为盈。非扭亏股中，10股净利润将达到10亿元以上，包括宁德时代、电投能源、西部矿业、亿纬锂能、天赐材料等。上述22只业绩高增长的新型储能概念股中，截至8月3日收盘，11股滚动市盈率（PE）低于30倍。其中电投能源、西部矿业、海德股份、银龙股份、璞泰来滚动市盈率在20倍以下。电投能源滚动市盈率为14.24倍，排在最低位置。（人民财讯）", "ctime": 1785821312, "time_str": "13:28:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260804/c678653924.shtml"}, {"id": "4874707", "title": "CPO板块持续拉升，光迅科技触及涨停", "content": "CPO板块持续拉升，光迅科技触及涨停，此前剑桥科技、光库科技、世嘉科技、永鼎股份等多股涨停。", "ctime": 1785821309, "time_str": "13:28:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260804/c678653923.shtml"}, {"id": "4874705", "title": "贵州毕节：深山里的AI新岗位让普通人有了增收新渠道", "content": "在贵州毕节市织金县，一家数据标注企业的入驻为当地居民提供了新的就业机会。27岁的脑瘫患者杨程通过这份工作，每天可以完成约1000条数据标注任务，月收入约4000元。培训师汪敏从一名普通标注员成长为项目组长，再成为培训师，月收入稳定在5000多元。数据标注工作门槛不高，理解能力正常、肯学、有耐心的人一周左右就能上手最简单的任务。随着人工智能的快速发展，数据标注需求将持续旺盛，成为连接民生就业与前沿产业的桥梁。（央视新闻）", "ctime": 1785821302, "time_str": "13:28:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260804/c678653921.shtml"}, {"id": "4874691", "title": "多支创业板人工智能ETF涨超8%", "content": "创业板人工智能ETF华夏（159371）、 创业板人工智能ETF富国（159246）、创业板人工智能ETF国泰（159388）涨超8%；通信ETF国泰（515880）、通信ETF华夏（515050）涨超7%；午后创业板指数涨超5%，CPO板块走强，新易盛、中际旭创、天孚通信均涨超12%。", "ctime": 1785821086, "time_str": "13:24:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260804/c678653796.shtml"}, {"id": "4874653", "title": "日本熊本县发生4.4级地震", "content": "据日本气象厅消息，当地时间8月4日14时06分左右，日本熊本县天草、芦北地区发生4.4级地震，最大震感为震度3，震源深度极浅。（央视新闻）", "ctime": 1785820648, "time_str": "13:17:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260804/c678653622.shtml"}, {"id": "4874629", "title": "沪深京三市成交额超1.5万亿元，较上日此时放量400亿元", "content": "据同花顺iFinD数据，沪深京三市成交额超1.5万亿元，较上日此时放量400亿元，预计全天成交金额约2.0万亿元。截至目前，沪市成交额6696亿元，深市成交额8213亿元，北证50成交额97亿元。", "ctime": 1785820551, "time_str": "13:15:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260804/c678653585.shtml"}, {"id": "4874583", "title": "北京亦庄商业航天开放日举办 全国首个商业航天产品可靠性平台将上线", "content": "近日，北京经济技术开发区举办“亦企创未来”迎商主题活动——北京亦庄商业航天开放日，经济技术开发区近百家商业航天上下游产业链企业及金融机构参加。活动现场，北京经济技术开发区机器人和智能制造产业局、中国航天标准化与产品保证研究院、京东工业签署合作备忘录，共同建设运营全国首个商业航天产品可靠性平台——北京火箭大街商业航天产品可靠性平台。三方将以航天高可靠技术和京东国际领先的供应链能力，为航天企业提供更加安全、可靠、完备的产品供给。（人民财讯）", "ctime": 1785820323, "time_str": "13:12:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260804/c678653501.shtml"}, {"id": "4874565", "title": "季风暴雨成灾，印度阿萨姆邦已有87人遇难", "content": "连日季风暴雨引发的洪涝与地质灾害持续席卷印度多地。据阿萨姆邦灾害管理局通报，该邦已有7个县、超12.8万人受灾，本轮洪灾累计遇难人数已升至87人。除东北部外，印度南部与东部灾情同样严峻。喀拉拉邦强降雨引发多处山体滑坡，死亡人数已升至15人，数万民众被撤离至临时安置点；东部沿海的奥里萨邦因主要河流泛滥导致22个县受灾，受灾人口超86万，逾26万受困民众被紧急转移。印度气象部门警告，强降雨仍将持续，发生突发性洪水的风险极高。目前各级应急救援队伍正全面展开抢险救灾工作。（央视新闻）", "ctime": 1785820291, "time_str": "13:11:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260804/c678653486.shtml"}, {"id": "4874531", "title": "沙特阿美：以稳健的财务和运营势头进入下半年", "content": "贾富拉天然气厂保持商品气和凝析油产量稳定。沙特阿美及其子公司在沙特王国境内的部分设施遭到袭击，截至2026年6月30日，这些设施所受影响对沙特阿美的财务状况并不重大。贾富拉天然气厂二期项目继续推进采购和建设活动，预计将于2027年完工。（新浪财经）", "ctime": 1785820117, "time_str": "13:08:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260804/c678653398.shtml"}, {"id": "4874459", "title": "创业板指涨超5%，算力硬件股爆发", "content": "创业板指涨超5%，算力硬件股爆发，CPO、元件、半导体板块涨幅居前。", "ctime": 1785819941, "time_str": "13:05:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", 航天高可靠技术和京东国际领先的供应链能力，为航天企业提供更加安全、可靠、完备的产品供给。据介绍，北京火箭大街商业航天产品可靠性平台由北京经济技术开发区统筹部署，将于近期正式上线，致力于为商业航天企业提供从供应商选择推荐、质量风险筛查到正品保障、智能履约的全链路数智供应链服务。平台上线后，将依托京东工业的百万级SKU商品库和航天标准院的专业认证能力，在品类品质、履约交付、行业解决方案等维度为商业航天产业降本增效。（界面新闻）", "ctime": 1785819148, "time_str": "12:52:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260804/c678652972.shtml"}, {"id": "4874257", "title": "王思聪六年内已三度退出“万达系”决策层", "content": "王思聪正在从万达系逐步退出，近日又卸任一家万达系公司的董事。据天眼查工商信息显示，万达产业投资有限公司于7月27日完成高级管理人员备案变更，王思聪正式卸任公司董事，张春远同步退出董事席位，陈洪涛新晋出任董事。近六年内，王思聪已经三次从万达核心公司卸任董事，持续拉开了与万达集团运营层面的距离。（界面）", "ctime": 1785818679, "time_str": "12:44:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260804/c678652768.shtml"}, {"id": "4874249", "title": "市场监管总局：我国牵头制定的工业通信国际标准发布", "content": "8月4日，记者从国家市场监督管理总局获悉，近日，由我国牵头多国专家联合编制的《WiTSnet工业以太网通信协议》国际标准，通过国际电工委员会（IEC）发布，标志着我国自主工业网络技术方案得到全球行业广泛认可。该协议是全球首个采用动态组织网络架构、实现设备同步精度小于10纳秒、全网端到端高可靠传输的工业通信协议。（中证金牛座）", "ctime": 1785818090, "time_str": "12:34:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260804/c678652525.shtml"}, {"id": "4874231", "title": "现货白银涨超1%", "content": "现货白银涨超1%，现报58.85美元/盎司。", "ctime": 1785817606, "time_str": "12:26:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260804/c678652330.shtml"}, {"id": "4874223", "title": "上海浦东唐镇地块15.8亿元成交：溢价率28.5%，楼面价超4.8万元/平米", "content": "8月4日，上海今年集中出让的第七批次地块进入现场竞价环节。其中，位于上海浦东新区唐镇地区的浦东新区PDP0-0405单元C-02E-01地块吸引四位竞买人。经过47轮竞拍，最终中国旅游集团有限公司旗下的杭州旅投房地产开发有限公司和招商蛇口（001979.SZ）旗下的上海虹润置业有限公司组成的联合体以15.8亿元的总价竞得该地块，未触及17.22亿元的中止价。地块成交楼面价48114元/平方米，溢价率28.45%。（澎湃新闻）", "ctime": 1785817410, "time_str": "12:23:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260804/c678652256.shtml"}, {"id": "4874189", "title": "民调显示特朗普支持率跌至35%", "content": "路透社和益普索集团3日发布的民调结果显示，美国总统特朗普的支持率跌至35%。根据这份民调，特朗普的支持率从上月的37%降至35%，只比其任内支持率最低水平高出1个百分点。在参与此次民调的注册选民中，约37%的人认为民主党在经济治理方面更胜一筹，选择共和党的比例为36%。这是近10年来民主党在这一数据上首次反超共和党。此外，民调结果显示，如果现在举行国会选举，42%的注册选民会投票给民主党，37%的注册选民会投票给共和党。路透社解读称，本次民调结果表明，特朗普对伊朗战事导致能源价格上涨等问题的处理方式，可能影响共和党在11月美国中期选举中的前景。本次调查于7月29日至8月3日在全美以线上方式进行，收集了4505名美国成年人的反馈。 (新华社) ", "ctime": 1785816599, "time_str": "12:09:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260804/c678651853.shtml"}, {"id": "4874187", "title": "中企承建非洲首条沙漠重载铁路 “三电”工程启动", "content": "非洲首条沙漠重载铁路——阿尔及利亚西部铁路矿业线2日正式启动通信、信号及电力系统工程建设。该铁路矿业线全长950公里，中国铁建与当地国有企业承建其中的575公里。这是中企在阿承建的最大基建工程。项目自今年2月通车以来，完善了阿尔及利亚国家铁路网，助力阿西南部省份互联互通和经济发展。（新华社）", "ctime": 1785816574, "time_str": "12:09:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260804/c678651844.shtml"}, {"id": "4874181", "title": "瑞丰光电与上海延锋彼欧开展技术交流", "content": "据瑞丰光电消息，8月3日，瑞丰光电走进上海延锋彼欧，聚焦汽车照明技术的未来发展趋势，双方围绕车载交互显示与照明智能升级，并就车规可靠性、成本优化等实际落地问题开展深度交流。", "ctime": 1785816416, "time_str": "12:06:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260804/c678651792.shtml"}, {"id": "4874163", "title": "8月4日午间公告一览：汇丰控股2026年上半年除税前利润195亿美元 同比增23%", "content": "汇丰控股公告，2026年上半年列账基准除税前利润195.22亿美元，较2025年上半年的158.1亿美元增加37亿美元，增幅为23%。除税后利润153.21亿美元，同比增23%。收入377.42亿美元，同比增11%。净利息收益率为1.61%，较2025年上半年上升4个基点。董事会已通过派发第二次股息每股0.1美元，并有意启动最多10亿美元的股份回购。", "ctime": 1785816139, "time_str": "12:02:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260804/c678651667.shtml"}, {"id": "4874145", "title": "港股午评：恒生指数跌0.49%，恒生科技指数跌0.19%", "content": "港股午间收盘，恒生指数跌0.49%，恒生科技指数跌0.19%。恒指港股通ETF银华（159318）跌0.3%，港股通科技ETF鹏华（159751）涨0.67 // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>

      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
