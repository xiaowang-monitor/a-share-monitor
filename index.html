d": "5196701", "title": "国际研究机构：尼泊尔泥石流灾害与气候变化密切相关", "content": "国际研究机构“世界天气归因联盟”日前发布分析报告说，气候变化是8月底尼泊尔边境地区泥石流灾害的一个重要驱动因素。这份题为《喜马拉雅地区快速变暖加剧连锁地质灾害，超出适应极限》的报告说，这场泥石流灾害由尼泊尔境内的蓝塘里壤峰发生冰岩崩引发，水、冰、岩石与沉积物等形成泥石流，席卷河道沿岸，冲毁民居、道路、桥梁等，造成重大灾害。（新华社）", "ctime": 1789647259, "time_str": "20:14:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260917/c680026402.shtml"}, {"id": "5196699", "title": "立讯精密：立讯转债2026年10月29日停止交易", "content": "立讯精密公告，“立讯转债”最后交易日为2026年10月28日，2026年10月29日起停止交易，最后转股日为2026年11月2日；截至2026年11月2日收市后仍未转股的债券将被到期赎回，到期兑付价格为108元人民币/张，赎回完成后将在深圳证券交易所摘牌。", "ctime": 1789647212, "time_str": "20:13:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260917/c680026391.shtml"}, {"id": "5196697", "title": "现货白银涨超3%", "content": "现货白银涨超3%，现报65.15美元/盎司。", "ctime": 1789647198, "time_str": "20:13:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260917/c680026387.shtml"}, {"id": "5196691", "title": "河北证监局：上市公司应严格依规披露政府补助信息", "content": "9月17日，河北证监局披露了最新一期的《河北上市公司监管通讯》，在监管要求栏目中，要求上市公司应严格依规披露政府补助信息。近期，部分上市公司披露政府补助信息不合规，部分上市公司将不符合“无偿性”原则的政府款项错误归类为政府补助，引发一定关注。各上市公司应按照《企业会计准则第16 号--政府补助》规定确定政府补助范围，并严格按《公开发行证券的公司信息披露编报规则第15号--财务报告的一般规定》（证监会公告〔2026〕64号）、《公开发行证券的公司信息披露解释性公告第1号--非经常性损益》（证监会公告〔2026〕65号）要求在定期报告中披露政府补助信息，对于单笔重大的政府补助，按照交易所公告格式披露临时报告。符合信息披露豁免、暂缓条件的，依规实施信息披露豁免、暂缓。不得过度披露政府补助信息博取市场关注，不得虚假披露政府补助信息骗取市场信任。（人民财讯）", "ctime": 1789647170, "time_str": "20:12:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260917/c680026344.shtml"}, {"id": "5196687", "title": "WTI原油跌超3%", "content": "WTI原油跌超3%，现报99.33美元/桶。", "ctime": 1789647098, "time_str": "20:11:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com I学习圈发布《AI时代，工作机会正流向哪里？—— 2026AI人才市场报告》。其中数据显示，从2024年上半年到2026年上半年，AI相关招聘职位增长约119%，在全部招聘职位中的占比从0.72%升至2.01%，接近三年前的3倍。从岗位、行业到城市，AI招聘需求正在向更广泛的业务场景延伸。AI相关工作机会从“做AI”走向“用AI”。（人民财讯）", "ctime": 1789645357, "time_str": "19:42:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260917/c680025240.shtml"}, {"id": "5196233", "title": "纬景储能回应欠薪停工：正内部统筹处理", "content": "9月17日，针对业内流传的纬景储能长期拖欠员工薪酬、部分生产基地停产及人员解散等消息，纬景储能回应称，相关事项公司正在内部统筹处理，现阶段暂无可以对外披露的信息。（界面新闻）", "ctime": 1789645246, "time_str": "19:40:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260917/c680025012.shtml"}, {"id": "5196231", "title": "SpaceX美股盘前涨超2%", "content": "SpaceX美股盘前涨超2%，现报153.92美元。", "ctime": 1789645231, "time_str": "19:40:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260917/c680024887.shtml"}, {"id": "5196209", "title": "豪鹏科技：高能量密度方形钢壳电池已进入规模量产阶段", "content": "豪鹏科技9月17日在现场参观及路演活动中表示，AI眼镜正从“无屏音频型”向“带屏显示型”切换，处于规模化爆发前夜。公司作为国内首批实现钢壳叠片小电池量产的企业之一，高能量密度方形钢壳电池已通过国际与国内一线品牌客户认证，已进入规模量产阶段。针对AI眼镜带屏化带来的更高功耗与发热，钢壳叠片叠加固液态方案已在能量密度、散热与安全设计上完成针对性开发，目前已向为包括北美某品牌在内的国内外头部AI眼镜品牌批量供货。（人民财讯）", "ctime": 1789645017, "time_str": "19:36:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260917/c680024697.shtml"}, {"id": "5196197", "title": "郑商所：9月21日结算时起，对PTA、甲醇、PX期货合约交易保证金标准和涨跌停板幅度作出调整", "content": "郑商所公告，自2026年9月21日结算时起，PTA期货2610合约的涨跌停板幅度为9%，PTA期货2611合约的交易保证金标准为9%，涨跌停板幅度为8%；甲醇期货2610合约的涨跌停板幅度为9%，甲醇期货2611合约的交易保证金标准为9%，涨跌停板幅度为8%；对二甲苯期货2610合约的涨跌停板幅度为9%，对二甲苯期货2611合约的交易保证金标准为9%，涨跌停板幅度为8%。", "ctime": 1789644894, "time_str": "19:34:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260917/c680024631.shtml"}, {"id": "5196183", "title": "董军同出席北京香山论坛客人举行会谈", "content": "国防部长董军17日在京分别同出席第十三届北京香山论坛的朝鲜国防省副相金刚日、毛里塔尼亚国防部长西迪、加蓬国防部长翁卡诺瓦、索马里国防部长菲基举行会谈。 董军说，习近平主席提出人类命运共同体理念和四大全球倡议，为推动普惠均衡发展、实现可持续安全提供了战略指引。在各国相互依存的今天，合作越深入、世界越安全。我们应立足全人类安全福祉，相互尊重、交流互鉴，推动安全秩序朝着更加公正合理的方向发展。中国军队愿与各方深化战略互信，加强双多边交流，推动务实合作提质增效，携手应对安全挑战，共同维护国际公平正义和世界和平稳定。 金刚日祝贺本届北京香山论坛圆满成功，表示朝军愿按照两党两国最高领导人的擘画指引，同中国军队加强战略沟通，密切交流合作，为发展具有悠久历史传统的朝中特殊友谊贡献力量。 西迪说，毛方坚定支持习近平主席提出的一系列重大倡议，高度珍视同中国军队的友谊，愿同中方进一步巩固团结互信、挖掘合作潜力，推动双方关系不断向前发展。 翁卡诺瓦说，加方视中国为最重要的合作伙伴，将同中方携手落实两国元首重要共识，传承传统友谊，深化防务安全等领域务实合作，让加中全面战略合作伙伴关系取得更多丰硕成果。 菲基说，发展对华关系是索方坚定的战略选择，索方坚定恪守一个中国原则，愿同中方加强海上安全等领域合作，不断提升两国两军关系水平。(新华社)", "ctime": 1789644761, "time_str": "19:32:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260917/c680024563.shtml"}, {"id": "5196065", "title": "百利天恒：拟与关联人以现金500万美元投资Connexus", "content": "百利天恒公告，全资子公司盘古资本拟以现金500万美元认购Connexus Therapeutics3,88.1万股A轮优先股，增资完成后持有其7.91%股权。本次交易构成关联交易，已于2026年9月16日经董事会及独立董事专门会议审议通过，无需提交股东会审议。", "ctime": 1789644277, "time_str": "19:24:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260917/c680024342.shtml"}, {"id": "5196059", "title": "秋田微：近期经营情况及内外部经营环境未发生重大变化", "content": "秋田微公告，股票于2026年09月16日、2026年09月17日连续两个交易日收盘价格涨幅偏离值累计超过30%。公司称近期经营情况及内外部经营环境未发生重大变化，不存在应披露未披露的重大事项；截至2026年09月17日，公司最新滚动市盈率（TTM）为181.9倍，行业为46.28倍。", "ctime": 1789644227, "time_str": "19:23:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260917/c680024309.shtml"}, {"id": "5196051", "title": "Generac Holdings美股盘前涨超29%", "content": "Generac Holdings美股盘前涨超29%，现报227.54美元。", "ctime": 1789644152, "time_str": "19:22:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260917/c680024297.shtml"}, {"id": "5196049", "title": "国际人工智能机构负责人期待中国引领国际合作", "content": "第四届全球人工智能 // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
