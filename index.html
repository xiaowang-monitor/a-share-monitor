ck_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261001/c680430105.shtml"}, {"id": "5294225", "title": "波兰再次延长与德国和立陶宛边境管控", "content": "当地时间10月1日，波兰内政与行政部长马尔钦·凯尔温斯基宣布，将延长与德国和立陶宛边境的管控措施，适用期为2026年10月2日至2027年3月30日。波兰表示，边境管控是限制非法移民的有效工具，延长管控有助于持续应对移民压力、加强边境安全。该管控自2025年7月7日起实施，此后多次延长，超过450万人和近230万辆汽车接受了检查。（央视新闻）", "ctime": 1790847627, "time_str": "17:40:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261001/c680430080.shtml"}, {"id": "5294007", "title": "瑞士阿尔卑斯山冰量五年减少近20%", "content": "当地时间10月1日，瑞士科学院表示，2026年瑞士冰川再次经历大规模消融，预计总体积减小5.5%。此外，过去五年间，瑞士阿尔卑斯山的冰量已减少近20%。瑞士冰川监测网络主任马蒂亚斯·胡斯表示，2026年冰川的消融量仅次于2022年，为有记录以来第二高。部分地区冰层平均厚度减少2.5米至4米，罗纳冰川6月中旬至7月中旬厚度减少约4米。阿尔卑斯山最大的阿莱奇冰川冰舌最低监测点冰层厚度减少13米。专家指出，今年5月至9月的异常高温和热浪，加上冬季降雪偏少，使保护冰川的积雪层过薄。胡斯说，过去罕见的极端消融如今几乎每年发生，持续的冰量损失表明，气候变暖速度已超过冰川的适应能力。（央视新闻）", "ctime": 1790845809, "time_str": "17:10:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261001/c680430001.shtml"}, {"id": "5294005", "title": "伊朗代表团称离开纽约系既定行程 已提前告知美方", "content": "伊朗常驻联合国代表团9月30日发布消息表示，伊朗代表团于9月28日（周一）晚间离开纽约，这一行程安排已于9月17日提前告知美国国务院。由于一无所获，美国国务院转而散布毫无根据、毫无价值的消息。据美国方面9月30日消息，在9月28日的美伊谈判中，双方均不愿做出让步，谈判陷入僵局。随后，美国国务卿鲁比奥要求伊朗代表团立即离开美国。据美国方面评论称，此举是“一种非常不寻常的外交谴责，暴露了两国间根深蒂固的不信任”。另据中东地区消息人士称，目前，调解方卡塔尔仍在与美伊双方沟通，寻求“折中方案”。（央视新闻）", "ctime": 1790845706, "time_str": "17:08:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261001/c680430000.shtml"}, {"id": "5293859", "title": "巴基斯坦再袭阿富汗境内目标", "content": "巴基斯坦新闻与广播部今天（10月1日）发表声明说，巴基斯坦军方对阿富汗境内两处“恐怖分子营地”实施空袭。对此，阿富汗政府发言人说，巴方今天凌晨对阿富汗东部库纳尔省的空袭已造成9人死亡、11人受伤。阿富汗政府对此予以谴责。（CCTV国际时讯）", "ctime": 1790844781, "time_str": "16:53:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261001/c680429797.shtml"}, {"id": "5293735", "title": "恐慌指数VIX创下两周多以来新高，最新上涨0.5点至16.86", "content": "恐慌指数VIX上涨0.5点至16.86恐慌指数VIX创下两周多以来新高，最新上涨0.5点至16.86。", "ctime": 1790843443, "time_str": "16:30:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261001/c680429724.shtml"}, {"id": "5293669", "title": "美元指数涨至16个月高点", "content": "美元指数DXY一度升至101.81，创去年5月以来新高。", "ctime": 1790842871, "time_str": "16:21:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261001/c680429679.shtml"}, {"id": "5293595", "title": "美据报要求德法动用应急柴油储备", "content": "三位知情人士透露的消息报道，美国政府已告知德国和法国，要求其动用应急柴油储备以缓解全球燃料价格，否则将面临美国可能实施的柴油出口禁令。近几年来，美国在欧洲柴油供应中的占比越来越高。而近来随着美国柴油零售均价飙升、通胀压力威胁中期选举选情，美国总统特朗普与顾问展开紧急磋商，讨论是否实施柴油出口禁令。特朗普当地时间9月30日表示仍在评估包括出口禁令在内的平抑油价选项，同时也承认禁令虽然将降低柴油价格，但可能给汽油价格带来上涨压力。（CCTV国际时讯）", "ctime": 1790842329, "time_str": "16:12:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261001/c680429651.shtml"}, {"id": "5293575", "title": "国庆假期首日全国铁路预计发送旅客2480万人次", "content": "记者从中国国家铁路集团有限公司获悉，10月1日，全国铁路预计发送旅客2480万人次，客流保持高位运行，计划加开旅客列车2324列。9月30日，全国铁路发送旅客1954.2万人次，运输安全平稳有序。10月1日是国庆节，全国铁路迎来出行高峰，从火车票预售情况来看，热门出发城市主要有北京、广州、上海、成都、深圳、武汉、西安、杭州、郑州、重庆；热门到达城市主要有广州、北京、成都、上海、杭州、武汉、西安、长沙、深圳、郑州；深圳至香港、广州至南宁、北京至沈阳、北京至上海、西安至成都、成都至西安、北京至太原、上海至武汉、北京至大同、上海至北京等热门区间客流相对集中。（新华社）", "ctime": 1790842103, "time_str": "16:08:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261001/c680429643.shtml"}, {"id": "5293557", "title": "超威半导体美股盘前涨超2%", "content": "超威半导体美股盘前涨超2%，现报625.56美元。", "ctime": 1790842020, "time_str": "16:07:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261001/c680429637.shtml"}, {"id": "5293497", "title": "美国一架医疗救援直升机坠海 致2人死亡", "content": "美国加利福尼亚州洛杉矶县消防部门当地时间9月30日晚证实，一架医疗救援直升机在该州圣卡塔利娜岛附近坠海，造成2人死亡、2人受伤，另有1人失踪。根据洛杉矶县消防部门通报，消防部门当天20时左右接到直升机坠海报告，机上5名人员中，目前已找到4人，其中2人当场死亡，另外2人获救后被送往医院接受治疗。对失踪人员的搜救行动预计将持续整晚。根据通报，美国国家运输安全委员会将牵头开展事故调查。（央视新闻）", "ctime": 1790841749, "time_str": "16:02:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261001/c680429628.shtml"}, {"id": "5293495", "title": "美股大型科技股盘前涨跌互现，谷歌A涨超2%", "content": "美股大型科技股盘前涨跌互现，谷歌A涨超2%，SK海力士涨超1%，英伟达涨0.8%，美光科技涨0.6%，特斯拉涨0.4%，SpaceX涨0.2%；Meta、亚马逊持平；微软、苹果跌0.1%。", "ctime": 1790841744, "time_str": "16:02:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261001/c680429627.shtml"}, {"id": "5293491", "title": "美股中概股盘前涨跌互现，富途控股涨4%", "content": "美股中概股盘前涨跌互现，富途控股涨4%，阿里巴巴涨0.3%，百度涨0.2%，京东、百济神州、网易持平，拼多多跌0.1%，携程跌0.2%。", "ctime": 1790841734, "time_str": "16:02:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261001/c680429625.shtml"}, {"id": "5293339", "title": "9月30日，全社会跨区域人员流动量2.1936亿人次", "content": "2026年9月30日（国庆假期前1日），全社会跨区域人员流动量2.1936亿人次，环比增长29.3%，同比下降6.8%。其中：铁路客运量1954.2万人次，环比增长42.2%，同比增长5.8%；公路人员流动量（包括高速公路及普通国省道非营业性小客车人员出行量、公路营业性客运量）1.9654亿人次，环比增长28.5%，同比下降8.1%。其中，公路营业性客运量3658万人次，环比增长17.2%，同比下降0.2%；高速公路及普通国省道非营业性小客车人员出行量1.5996亿人次，环比增长31.4%，同比下降9.7%；水路客运量82.2万人次，环比增长7.6%，同比增长13.7%；民航客运量245.1万人次，环比增长12.3%，同比增长1.2%。（交通运输部）", "ctime": 1790840877, "time_str": "15:47:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261001/c680429581.shtml"}, {"id": "5293259", "title": "美股三大股指期货走低，纳指回吐多数涨幅", "content": "美股三大股指期货走低，纳指期货涨幅收窄至0.5%，此前一度涨近1.5%，标普500指数期货接近持平，道指期货下跌0.4%。", "ctime": 1790840177, "time_str": "15:36:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20 // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
