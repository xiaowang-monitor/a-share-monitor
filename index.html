<style>
:root {
  --bg-primary: #0a0e17;
  --bg-card: #111827;
  --bg-card-hover: #1a2332;
  --border: #1e293b;
  --text-primary: #e2e8f0;
  --text-secondary: #94a3b8;
  --text-muted: #64748b;
  --red: #ef4444;
  --red-bg: rgba(239,68,68,0.1);
  --green: #22c55e;
  --green-bg: rgba(34,197,94,0.1);
  --gold: #f59e0b;
  --blue: #3b82f6;
  --purple: #8b5cf6;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Noto Sans SC', sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  min-height: 100vh;
}
.mono { font-family: 'JetBrains Mono', monospace; }
.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 20px;
  transition: all 0.2s;
}
.card:hover { background: var(--bg-card-hover); border-color: #334155; }
.badge {
  display: inline-flex; align-items: center; padding: 2px 8px;
  border-radius: 6px; font-size: 12px; font-weight: 500;
}
.badge-s { background: rgba(239,68,68,0.2); color: #ef4444; }
.badge-a { background: rgba(245,158,11,0.2); color: #f59e0b; }
.badge-b { background: rgba(59,130,246,0.2); color: #3b82f6; }
.badge-c { background: rgba(100,116,139,0.2); color: #94a3b8; }
.score-bar {
  height: 6px; border-radius: 3px; background: #1e293b; overflow: hidden;
}
.score-bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s; }
.up { color: var(--red); }
.down { color: var(--green); }
.pulse { animation: pulse 2s infinite; }
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}
.glow { box-shadow: 0 0 20px rgba(59,130,246,0.15); }
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg-primary); }
::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
</style>

<!-- 顶部状态栏 -->
<div class="flex flex-wrap items-center justify-between mb-6 gap-4">
  <div class="flex items-center gap-3">

<div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6" id="kpi-cards"></div>

<!-- 主内容区 -->
<div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-6">
  <!-- 左列: Hot7 + 板块 -->
  <div class="space-y-6">
    <div class="card">

      <div id="hot7-list" class="space-y-3"></div>
    </div>
    <div class="card">

      <div id="sector-chart" style="height:260px"></div>
    </div>
  </div>

  <!-- 中列: 精选个股 -->
  <div class="lg:col-span-2">

      <div class="flex items-center justify-between mb-4">

      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-sm">
          <thead>
            <tr class="text-gray-500 text-xs border-b border-gray-800">
              <th class="text-left py-2 px-2">代码</th>
              <th class="text-left py-2 px-1">名称</th>
              <th class="text-right py-2 px-1">现价</th>
              <th class="text-right py-2 px-1">涨幅</th>
              <th class="text-right py-2 px-1">评分</th>
              <th class="py-2 px-1 text-center" style="min-width:160px">评分分布</th>
              <th class="text-right py-2 px-1">板块</th>
              <th class="text-right py-2 px-1">连涨</th>
            </tr>
          </thead>
          <tbody id="picks-table"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- 新闻流 + 交易代理 -->
<div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
  <div class="card">
    <h2 class="text-sm font-medium text-gray-400 mb-4">实时新闻流</h2>
    <div id="news-feed" class="space-y-2 max-h-96 overflow-y-auto pr-2"></div>

  <div class="card">
    <h2 class="text-sm font-medium text-gray-400 mb-4">交易代理状态</h2>
    <div id="agent-status" class="space-y-3"></div>
  </div>
</div>

e": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260909/c679735983.shtml"}, {"id": "5135063", "title": "福建：推动健身场地设施适老化、适儿化、无障碍建设和改造", "content": "《福建省全民健身实施计划（2026—2030年）（征求意见稿）》公开征求意见。其中提到，将全民健身场地设施布局建设纳入国土空间规划、城市更新计划、完整社区建设、乡村振兴等，推动群众身边的场地设施布局建设与常住人口总量、结构、流动趋势相衔接。鼓励土地复合利用，充分挖掘存量建设用地潜力。推动健身场地设施适老化、适儿化、无障碍建设和改造，不断满足全人群多元健身需求。其中，实施健身场地设施更新改造，有序开展失效老旧、存在安全隐患的体育器材维修更换、报废拆除工作，优先补齐老旧小区、行政村短板。鼓励健身设施智慧化升级，打通“建设—运营—服务”全链条供给。（人民财讯）", "ctime": 1788931143, "time_str": "13:19:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260909/c679735944.shtml"}, {"id": "5135055", "title": "港股恒生科技指数跌幅达1%", "content": "港股恒生科技指数跌幅扩大至1%，恒生指数现跌0.35%。理想汽车-W、美团-W、小米集团-W跌超3%。", "ctime": 1788930969, "time_str": "13:16:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260909/c679735908.shtml"}, {"id": "5135047", "title": "最新PISA测评结果公布 中国内地学生表现居前列", "content": "经济合作与发展组织8日发布的2025年国际学生评估项目（PISA）测评结果显示，在参与测评的91个国家和地区中，中国内地学生在科学、数学、阅读以及计算问题解决能力方面的表现均位居前列。经合组织从2000年起每三年组织一次PISA测评，旨在考察完成基础教育的15岁学生在科学、数学、阅读等方面的水平。2025年中国内地参加测评的学生来自北京、上海、江苏和浙江，他们在科学和数学两项测试中，分别以597分和612分位居第一；在阅读测试中获得527分，仅次于新加坡。（新华社）", "ctime": 1788930930, "time_str": "13:15:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260909/c679735895.shtml"}, {"id": "5135009", "title": "旅游及酒店板块短线走高，桂林旅游涨停", "content": "旅游及酒店板块短线走高，桂林旅游涨停，曲江文旅、天目湖、金陵饭店跟涨。", "ctime": 1788930453, "time_str": "13:07:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260909/c679735822.shtml"}, {"id": "5135007", "title": "四部门规范医疗机构麻醉和精神药品管理", "content": "记者9月9日获悉，国家卫生健康委、国家中医药局等四个部门近日联合印发《医疗机构麻醉药品和精神药品管理规定》。管理规定共11章73条，聚焦麻精药品采购、储存、开具、使用、回收、销毁等关键环节，细化完善了各项管理要求。药用类麻醉药品和精神药品是我国依法依规实行特殊管理的药品，具有临床诊疗必需和易产生依赖性成瘾性的双重属性，其安全合理使用事关人民群众生命健康和社会和谐稳定。管理规定有哪些特点？一是将适用范围由药用类麻醉药品、第一类精神药品扩大至全部药用类麻精药品（包括药用类麻醉药品、第一类精神药品和第二类精神药品）。二是细化了医疗机构内部管理体系和培训考核要求，完善了药房、麻醉科、手术室等重点科室管理，以及回收销毁、安全应急等工作机制。三是增加了知情同意相关规定。为未成年人开具麻精药品处方，需取得其监护人书面知情同意。四是积极发挥信息化在医疗机构麻精药品管理中的作用。促进依托数智技术加强医疗机构麻精药品全流程管理，提升管理效能。据悉，管理规定将于2026年10月1日起实施。（新华社）", "ctime": 1788930438, "time_str": "13:07:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260909/c679735817.shtml"}, {"id": "5134947", "title": "格科微：2亿像素产品与部分客户达成初步合作意向，临港工厂上半年维持满产运行", "content": "在今日举行的格科微2026年半年度业绩说明会上，该公司董事长赵立新表示，公司7月收到国际知名手机品牌客户订单，为其供应0.64微米规格5000万像素图像传感器产品，首批订单金额约合人民币5700万元；2亿像素产品开发顺利，并与部分客户达成初步合作意向。另据董秘兼财务总监郭修贇表示，临港工厂产能为2万片/月，已基本实现向5000万像素产品切换，上半年维持满产运行，工厂效益正进一步改善，2026年上半年临港工厂已实现盈利。（科创板日报）", "ctime": 1788929808, "time_str": "12:56:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260909/c679735703.shtml"}, {"id": "5134945", "title": "智元发布原生世界—动作模型GE-Act 2.0", "content": "9月9日，智元发布GE-Act 2.0原生世界—动作模型（World Action Model，WAM），首次系统验证了原生世界—动作模型的预训练与Scaling路径。（人民财讯）", "ctime": 1788929731, "time_str": "12:55:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260909/c679735696.shtml"}, {"id": "5134923", "title": "招商银行深圳分行换帅，东莞分行行长占京平接棒王兴海", "content": "9月8日，记者获悉，现任招商银行东莞分行行长占京平调任深圳分行行长，接棒刚刚辞任的王兴海，执掌这家资产规模超6000亿元的“特等分行”。多个独立信源向记者确认了上述消息。知情人士表示，占京平已于本周抵达深圳，目前正与王兴海进行工作交接。（21世纪经济报道）", "ctime": 1788929052, "time_str": "12:44:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260909/c679735595.shtml"}, {"id": "5134907", "title": "多家中企亮相伊拉克国际油气展 助力推动中伊能源合作", "content": "为期4天的第四届伊拉克国际石油天然气展8日在巴格达国际会展中心开幕，吸引伊拉克本土企业和包括中国企业在内的众多国际企业参展。伊拉克石油部长巴西姆·穆罕默德·胡达伊尔和电力部长阿里·萨阿迪·瓦希卜等出席开幕仪式。（新华社）", "ctime": 1788928578, "time_str": "12:36:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260909/c679735560.shtml"}, {"id": "5134849", "title": "非洲资源国推动本土精炼加工，锑钨出口管制趋严，南方基金司南投顾关注战略金属价值重估逻辑", "content": "据报道，津巴布韦9月8日起禁止锑与钨的出口，矿石与精矿的外运出口一并暂停，这是该国政府推动矿业企业在本土开展更多矿产精炼加工的举措之一。与几内亚、加纳、刚果（金）等其他非洲国家一样，津巴布韦正力求从本国自然资源中获取更高经济收益。锑和钨均被多国列入战略性关键矿产目录，广泛应用于军工、光伏玻璃、半导体、硬质合金等领域，全球供给集中度较高。近年来资源国出口管制与产业本土化政策频出，供给端扰动加剧小金属价格波动，也推动下游用户寻求供应链多元化布局。小金属供给端事件频发，但相关企业业务弹性差异大，价格向盈利的传导存在时滞，短期题材驱动的行情往往波动较大。南方基金司南投顾通过组合配置参与资源品机会，同时避免追高单一题材带来的回撤风险。（蓝鲸新闻）", "ctime": 1788927963, "time_str": "12:26:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260909/c679735452.shtml"}, {"id": "5134845", "title": "9月9日午间公告一览：*ST康佳A2026年第二次临时股东会变更现场地点", "content": "*ST康佳A公告，公司第十一届董事会第十三次会议以8票同意、0票弃权、0票反对审议通过议案，决定将2026年第二次临时股东会现场会议地点由深圳市宝安区新桥体育中心变更为深圳市南山区科技南十二路28号康佳研发大厦19楼，其他事项不变。", "ctime": 1788927784, "time_str": "12:23:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260909/c679735429.shtml"}, {"id": "5134833", "title": "马克·古尔曼：苹果首款折叠屏手机被命名为“iPhone Duo” 起售价2000美元", "content": "知名科技记者马克·古尔曼9月9日发文称，苹果公司将于当地时间周三的新品发布会上推出折叠屏手机iPhone Duo，起售价2000美元。入门级版本将配备256GB存储空间，苹果还将提供更高容量版本，最高售价可达约3000美元。iPhone Duo最早将于10月上市，配色包括白色和深蓝色。苹果还将在此次发布会上展示iPhone 18 Pro、新款Apple Watch和升级版AirPods。（蓝鲸新闻）", "ctime": 1788927377, "time_str": "12:16:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260909/c679735301.shtml"}, {"id": "5134831", "title": "蓝箭鸿擎在武汉投资成立空间科技公司", "content": "企查查APP显示，近日，蓝箭鸿擎（武汉）空间科技有限公司成立，法定代表人为万军，注册资本为5000万元，经营范围包含：卫星导航服务；卫星通信服务；工业互联网数据服务；卫星遥感数据处理；海洋工程装备研发等。企查查股权穿透显示，该公司由北京蓝箭鸿擎科技有限公司全资持股。（人民财讯）", "ctime": 1788927369, "time_str": "12:16:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260909/c679735300.shtml"}, {"id": "5134825", "title": "2026年上海旅游节大巡游本周六举行，相关道路将临时交通管制", "content": "2026年上海旅游节大巡游活动定于9月12日（星期六）在中山东一路（外滩）举行。9月9日，澎湃新闻记者从上海市公安局获悉，为确保活动安全顺利举办，根据《中华人民共和国道路交通安全法》等有关规定，上海市公安局决定于9月11日和9月12日对本市相关道路采取临时交通管制措施。（澎湃新闻）", "ctime": 1788927265, "time_str": "12:14:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260909/c679735280.shtml"}, {"id": "5134801", "title": "泰国拟拨款500亿泰铢补贴居民屋顶光伏项目", "content": "泰国财政部长埃克尼提 尼提坦帕帕斯（Ekniti Nitithanprapas）表示，泰国财政部正考虑推出一项规模500亿泰铢（合15.2亿美元）的计划，为100万户家庭的屋顶光伏安装提供补贴。埃克尼提在周三对记者称，每户家庭最高可获得5万泰铢补贴，剩余安装费用可通过国有银行提供的低息贷款解决。财政部计划于本周五或下周初与相关部门商讨该提案细节。", "ctime": 1788926988, "time_str": "12:09:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260909/c679735249.shtml"}, {"id": "5134797", "title": "我国进一步规范医疗机构麻醉药品和精神药品管理", "content": "国家卫生健康委联合多部门修订了《医疗机构麻醉药品和精神药品管理规定》，将于2026年10月1日实施。新规定共11章73条，扩大了适用范围至全部药用类麻精药品，细化了内部管理体系和培训考核要求，增加了知情同意相关规定，并强调信息化管理在全流程中的作用。（央视新闻）", "ctime": 1788926692, "time_str": "12:04:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260909/c679735155.shtml"}, {"id": "5134793", "title": "香港年金公司进一步拓展转介伙伴网络", "content": "香港按揭证券有限公司全资拥有的香港年金有限公司（香港年金公司）今日（9月9日）宣布与周大福人寿保险有限公司（周大福人寿）建立策略性合作伙伴关系。透过此合作安排，周大福人寿旗下的指定持牌保险中介人可向其客户介绍香港年金计划，并转介合资格客户予香港年金公司跟进。", "ctime": 1788926686, "time_str": "12:04:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260909/c679735154.shtml"}, {"id": "5134787", "title": "港股午评：恒生指数持平，恒生科技指数跌0.58%", "content": "港股午间收盘，恒生指数持平，恒生科技指数跌0.58%。恒指港股通ETF银华（159318）跌0.23%，港股通科技ETF鹏华（159751）跌0.46%。板块方面，服务器、电网设备Ⅲ板块涨幅靠前；计算机外围设备、休闲设施板块跌幅靠前。个股方面，优地机器人涨159.52%，曦智科技-P涨20.15%，今海医疗科技涨14.31%，飞速创新涨12.35%，海光芯正涨10.53%；海底捞跌9.49%，溜溜梅跌8.96%，旺山旺水-B跌8.05%，创想三维跌7.91%，李宁-R跌6.56%。", "ctime": 1788926607, "time_str": "12:03:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260909/c679735138.shtml"}, {"id": "5134739", "title": "4只挂钩中国境内ETF的TDR产品在泰上市", "content": "今日，易方达基金在泰国证券交易所（SET）同步挂牌上市4只挂钩易方达境内ETF的存托凭证（TDR），4只TDR分别挂钩沪深300、科创50、创业板及中证人工智能主题相关ETF，为东南亚投资者提供了便捷配置中国资产的新工具。据公开资料，本次是泰国市场首次同时推出4只挂钩中国境内ETF的TDR产品。TDR是泰交所为境外资产本土化交易而设立的证券工具，以泰铢计价并在泰交所二级市场直接挂牌，当地投资者无需另行开立中国境内证券账户，只凭现有泰国股票账户，即可以本币在泰国交易所直接购买以中国境内ETF作为基础资产的TDR。（财联社）", "ctime": 1788925844, "time_str": "11:50:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260909/c679734929.shtml"}, {"id": "5134731", "title": "全国水下机器人大赛将在大连举行", "content": "9月9日上午，大连市政府新闻办召开新闻发布会，会上介绍，经国家自然科学基金委员会指导，大连市人民政府、鹏城实验室联合主办，2026年第十届全国水下机器人大赛将于9月17日至20日在大连市举行。本届大赛以“筑梦海洋、智能引领”为主题，创新构建“1＋N”赛事体系。“1”是主体赛事，聚焦水下机器人核心技术竞技；“N”是若干项配套活动，包括水下机器人及海洋装备展、“辽创汇”海洋智能装备专场路演暨成果转化对接会、院士专家大连行、大连市青少年水中机器人协同竞技赛等活动。（大连发布）", "ctime": 1788925605, "time_str": "11:46:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260909/c679734858.shtml"}, {"id": "5134729", "title": "希音与中国外运签署合作备忘录，共建新能源物流车队数字化充电平台", "content": "近日，希音（SHEIN）与中国外运股份有限公司（以下简称“中国外运”）签署可持续发展合作备忘录，以进一步深化双方在仓库间物流领域的合作。双方将围绕新能源车辆、充电基础设施及数字化解决方案开展合作，提升仓间物流和车队运营效率。 根据本次合作备忘录的整体安排，双方还将探索新能源车辆换电服务在物流场景中的应用，以及新能源重型卡车在中长距离运输线路上的应用。（新浪财经）", "ctime": 1788925602, "time_str": "11:46:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260909/c679734857.shtml"}, {"id": "5134709", "title": "南向资金净买入超30亿港元", "content": "据同花顺iFinD数据，截至目前，南向资金净买入超30亿港元，其中港股通（沪）买入超16.55亿港元，港股通（深）买入超13.60亿港元。", "ctime": 1788924916, "time_str": "11:35:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260909/ // 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
