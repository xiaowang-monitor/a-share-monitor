的股权登记日的总股本为基数，向全体股东每10股派发现金红利人民币5.9元（含税），预计共分配股利9571.43万元（含税），剩余未分配利润结转以后年度分配。公司不进行资本公积金转增股本，不送红股。", "ctime": 1775039096, "time_str": "18:24:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260401/c675698723.shtml"}, {"id": "4174241", "title": "嘉友国际：与关联方共同投资坦赞铁路激活项目 投资总额12.43亿美元", "content": "嘉友国际公告，公司拟与关联方金盛（新加坡）矿业私人有限公司、非关联方中国土木工程集团有限公司、洛阳栾川钼业集团股份有限公司、中远海运（香港）有限公司，通过共同投资标的公司LinkFuture Investment Ltd.实现对坦赞铁路激活项目的合作投资。本次投资总额合计为12.43亿美元，其中嘉友国际投资额为6215万美元，占比5%。本次交易构成关联交易，未构成重大资产重组。", "ctime": 1775038998, "time_str": "18:23:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260401/c675698676.shtml"}, {"id": "4174239", "title": "喜临门：因涉嫌信息披露违法违规被立案", "content": "喜临门公告，公司于近日收到中国证券监督管理委员会出具的《立案告知书》，因公司涉嫌信息披露违法违规，中国证监会决定对公司立案。", "ctime": 1775038937, "time_str": "18:22:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260401/c675698661.shtml"}, {"id": "4174235", "title": "广东建工：文武茶光互补光伏发电项目和老耿寨光伏发电项目并网运行", "content": "广东建工公告，2026年3月31日，公司下属广东粤水电能源投资集团有限公司的全资子公司普洱粤水电能源有限公司投资建设的文武茶光互补光伏发电项目和老耿寨光伏发电项目并网运行，其中文武茶光互补光伏发电项目并网50MW，老耿寨光伏发电项目并网90MW。上述项目的并网运行对公司未来经营业绩有一定的提升作用。", "ctime": 1775038895, "time_str": "18:21:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260401/c675698649.shtml"}, {"id": "4174233", "title": "普京：全球油气供应面临挑战俄可提供“解决方案”", "content": "俄罗斯总统普京4月1日表示，伊朗局势对能源市场以及经霍尔木兹海峡的油气运输产生直接影响，俄可为世界提供解决方案。 据俄总统网站消息，普京向当天开幕的首届俄罗斯国际交通物流论坛发表视频致辞时说，全球交通物流领域正经历深刻变革，面临严峻的地缘政治挑战。伊朗局势已经对能源市场以及经霍尔木兹海峡的油气运输产生直接影响。 普京指出，越来越多国家和企业关注的不仅仅是运输速度和成本，更是运输路线和供应链的安全性和可持续性。他表示，俄方愿为构建全球物流和国际贸易新架构发挥重要作用，可以为世界提供解决方案。 首届俄罗斯国际交通物流论坛1日至3日在圣彼得堡举行。(新华社)", "ctime": 1775038859, "time_str": "18:20:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260401/c675698644.shtml"}, {"id": "4174221", "title": "澳总理：伊朗战事对澳经济的冲击将持续数月", "content": "澳大利亚总理阿尔巴尼斯1日罕见地发表全国电视讲话，警告伊朗战事对澳经济的冲击将持续很长时间，呼吁民众节约燃料，尽量使用公共交通出行。 阿尔巴尼斯表示，澳政府正努力增加燃料和化肥进口，平抑燃料价格，竭尽所能保护该国免受战事带来的冲击，但未来数月“可能不会轻松”。他表示，民众应保持正常生活秩序，不要恐慌性抢购燃料。他说：“未来几周，如果可以，请改乘火车、公交或电车通勤。这有助于增加储备，也能将燃料留给别无选择、必须驾车出行的人。” 这次讲话是2000年以来澳大利亚总理第四次发表全国电视讲话，也是6年来的首次。(新华社)", "ctime": 1775038792, "time_str": "18:19:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260401/c675698619.shtml"}, {"id": "4174219", "title": "方邦股份：高强、王作凯、汪友涛拟分别减持0.0084%、0.0101%、0.0091%", "content": "方邦股份公告，高强持股27687股占0.0336%，拟减持不超6921股占0.0084%；王作凯持股33130股占0.0402%，拟减持不超8282股占0.0101%；汪友涛持股30000股占0.0364%，拟减持不超7500股占0.0091%。减持方式均为集中竞价，期限2026年4月24日至2026年7月23日。", "ctime": 1775038768, "time_str": "18:19:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260401/c675698608.shtml"}, {"id": "4174215", "title": "中马传动：2025年净利润亏损580.34万元，同比转盈为亏", "content": "中马传动公告，2025年营业收入9.13亿元，同比增长0.55%。净利润亏损580.34万元，上年同期净利润3324.75万元。公司2025年年度利润分配预案为不分配不转增。", "ctime": 1775038720, "time_str": "18:18:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260401/c675698600.shtml"}, {"id": "4174213", "title": "三江购物：股东阿里巴巴泽泰拟减持不超2%", "content": "三江购物公告，第二大股东杭州阿里巴巴泽泰信息技术有限公司持股1.48亿股，占27.00%，拟因自身商业安排自2026年4月24日至2026年7月23日通过集中竞价和大宗交易合计减持不超过1095.36万股，占公司总股本的2%。其中，集中竞价不超过547.68万股，占1%，大宗交易不超过547.68万股，占1%，减持价格将按实施时市场价确定。", "ctime": 1775038683, "time_str": "18:18:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260401/c675698572.shtml"}, {"id": "4174207", "title": "比亚迪股份：3月新能源汽车销量30.02万辆，去年同期37.74万辆", "content": "比亚迪股份港交所公告，3月新能源汽车销量30.02万辆，去年同期37.74万辆。", "ctime": 1775038598, "time_str": "18:16:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260401/c675698544.shtml"}, {"id": "4174197", "title": "赛力斯：3月新能源汽车产量22802辆、销量22706辆", "content": "赛力斯公告，2026年3月新能源汽车产量22802辆，本月同比增长17.81%，销量22706辆，本月同比增长20.74%；其中赛力斯汽车产量20598辆，本月同比增长38.92%，销量20234辆，本月同比增长47.74%。", "ctime": 1775038450, "time_str": "18:14:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260401/c675698475.shtml"}, {"id": "4174189", "title": "内蒙古大兴安岭林区4月1日起进入防火期", "content": "4月1日起，内蒙古大兴安岭林区正式进入为期7个月的防火期。面对当前气温回升快、大风天气多、火险等级高的严峻形势，大兴安岭消防救援机动支队联合内蒙古森工集团提前部署，全面启动2026年“七联固防 平安北疆”防火专项行动，全力筑牢北疆生态安全屏障。当前，随着气温持续攀升，大兴安岭林区风干物燥，加之春耕生产与清明祭祀活动叠加，野外火源管控难度显著加大。据监测，林区内可燃物载量已远超安全标准阈值，一旦发生火情，极易形成高强度、快速蔓延的树冠火，扑救处置难度极大。（央视新闻）", "ctime": 1775038270, "time_str": "18:11:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260401/c675698413.shtml"}, {"id": "4174187", "title": "以军称黎巴嫩真主党南方阵线指挥官身亡", "content": "以色列国防军4月1日发表声明说，黎巴嫩真主党南方阵线指挥官哈吉·哈希姆在以色列海军的一次“精准打击”中身亡。(新华社)", "ctime": 1775038264, "time_str": "18:11:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260401/c675698412.shtml"}, {"id": "4174179", "title": "光华科技：董事蔡雯因涉嫌内幕交易被立案", "content": "光华科技公告，公司董事、高级管理人员蔡雯女士于2026年3月31日收到中国证监会出具的《立案告知书》，决定对其因涉嫌内幕交易予以立案。此次立案调查为对蔡雯女士的个人调查，与公司的日常经营管理和业务活动无关，且不涉及本公司股票交易。蔡雯女士目前在公司仍正常履职，并表示将积极配合中国证监会调查工作。公司将持续关注上述事项的进展情况，并及时履行信息披露义务。", "ctime": 1775038210, "time_str": "18:10:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260401/c675698387.shtml"}, {"id": "4174177", "title": "珠海中富：筹划向特定对象发行A股股票，股票停牌", "content": "珠海中富公告，公司正在筹划向特定对象发行A股股票，该事项可能会导致公司控制权发生变更。为维护广大投资者的利益，避免公司股价异常波动，公司股票自2026年4月2日开市起停牌，预计停牌时间不超过2个交易日。目前，各方主体正在就具体方案、协议等相关事项进行论证和磋商，具体情况以各方最终签署的相关协议为准。", "ctime": 1775038197, "time_str": "18:09:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260401/c675698364.shtml"}, {"id": "4174161", "title": "销售收入同比增14.6% 我国高技术产业升级持续深化", "content": "国家税务总局今天发布的发票数据显示，今年以来，截至3月25日，高技术产业销售收入同比增长14.6%。税收大数据显示，今年以来，我国高技术产业竞争力加强。1月1日—3月25日，高技术产业销售收入同比增长14.6%，反映以技术创新为核心驱动力的产业升级正持续深化。同时科研成果转化力度加大，科研技术服务业、科技含量较高的知识产权密集型产业销售收入同比增长21%和10.9%，显示科技成果正加快转化为生产力。（央视新闻）", "ctime": 1775038044, "time_str": "18:07:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260401/c675698308.shtml"}, {"id": "4174151", "title": "白云山：分公司获得药品补充申请批件", "content": "白云山公告，近日，分公司广州白云山医药集团股份有限公司白云山制药总厂收到国家药品监督管理局核准签发关于骨化三醇软胶囊的《药品补充申请批准通知书》。骨化三醇软胶囊原研厂家是罗氏制药有限公司，于 1992年 10月在中国首次获批上市。", "ctime": 1775037945, "time_str": "18:05:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260401/c675698268.shtml"}, {"id": "4174141", "title": "东威科技：董事危勇军拟减持不超过0.50%", "content": "东威科技公告，董事危勇军直接持有公司751.41万股，占总股本2.52%，其中390.55万股为IPO前股份，360.86万股系资本公积转增。因个人资金需求，其拟自本公告披露之日起15个交易日后的3个月内，以集中竞价或大宗交易减持不超150万股，占总股本0.50%，不超其持股的25%，减持期间为2026年4月28日～2026年7月27日。", "ctime": 1775037861, "time_str": "18:04:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260401/c675698223.shtml"}, {"id": "4174139", "title": "云南白药：INB301注射液获临床试验批准", "content": "云南白药公告，公司于近日收到国家药品监督管理局下发的《药物临床试验批准通知书》（通知书编号：2026LP01002），经审查，2026年2月24日受理的INB301注射液临床试验申请符合药品注册的有关要求，同意本品开展肿瘤恶病质的临床试验。", "ctime": 1775037835, "time_str": "18:03:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260401/c675698204.shtml"}, {"id": "4174129", "title": "蔚来：3月交付35486辆汽车，同比增长136.0%", "content": "蔚来公告，公司于2026年3月交付35486辆汽车，同比增长136.0%。第一季度交付83465辆汽车，同比增长98.3%。截至2026年3月31日，累计汽车交付量达108.11万辆。", "ctime": 1775037776, "time_str": "18:02:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260401/c675698180.shtml"}, {"id": "4174125", "title": "沪电股份：同意投资约68亿元建设印制电路板生产项目", "content": "沪电股份公告，同意投资约68亿元建设印制电路板生产项目及其配套设施。该项目计划以自有资金或自筹资金投资，旨在扩大公司产品产能，满足高性能、高信赖性印制电路板的中长期增量需求。项目实施后，将优化产品结构，增强核心竞争力，提高经济效益。", "ctime": 1775037741, "time_str": "18:02:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260401/c675698163.shtml"}, {"id": "4174117", "title": "韩国强化车辆限行措施 公共机关车辆单双号限行", "content": "随着中东冲突局势持续、能源供应紧张加剧，韩国政府4月1日宣布将进一步强化节能措施。韩国气候能源环境部当天宣布，自当地时间4月8日起，公共机关车辆限行将由原先的工作日“尾号限行”升级为更严格的“单双号限行”，民间车辆虽仍维持自愿限行，但在全国约3万个公共停车场将被强制实施尾号限行措施。根据韩国气候能源环境部发布的方案，韩国中央政府、地方政府、公共机构及国立、公立学校等约1.1万家单位、约130万辆公务及公务员通勤车辆将适用单双号制度，由公共机构运营的约3万个收费公共停车场（约100万个车位）将实行工作日尾号限行，周一至周五分别对应不同尾号车辆允许停放。民间车辆如不符合尾号限行规定，也将无法进入公共停车场。残疾人、孕妇、搭载学龄前儿童车辆，以及电动车、氢能源车和部分生计用车不受限行约束。（央视新闻）", "ctime": 1775037699, "time_str": "18:01:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260401/c675698155.shtml"}, {"id": "4174107", "title": "百利天恒：iza-bren的2个联合用药的II/III期临床试验获得批准", "content": "百利天恒公告，近日收到国家药品监督管理局(NMPA)正式批准签发的2个《药物临床试验批准通知书》，公司自主研发的创新生物药iza-bren（EGFR×HER3双抗ADC）的2个联合用药的II/III期临床试验获得批准。", "ctime": 1775037684, "time_str": "18:01:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260401/c675698150.shtml"}, {"id": "4174087", "title": "宁波港：2025年净利润51.68亿元，同比增长5.63%", "content": "宁波港公告，2025年营业收入310.2亿元，同比增长7.41%；净利润51.68亿元，同比增长5.63%。拟将2025年度可分配利润35.89亿元的65%向全体股东进行分配，包含2025年中期分红，公司2025年度向全体股东共计派发现金红利23.35亿元，即每10股派发现金红利1.2元（含税）。", "ctime": 1775037643, "time_str": "18:00:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260401/c675698141.shtml"}, {"id": "4174059", "title": "优思益被国务院食安办点名", "content": "记者今天了解到，针对总台报道的跨境电商进口“优思益”保健品涉嫌原产地造假、虚假宣传等问题，国务院食安办、市场监管总局、海关总署高度重视，立即组织涉事地市场监管部门和海关开展调查核实，严查违法违规行为，切实维护市场秩序，保护消费者合法权益。(央视新闻)", "ctime": 1775037607, "time_str": "18:00:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260401/c675698102.shtml"}, {"id": "4174057", "title": "十国外长强烈谴责针对联黎部队的袭击", "content": "英国外交部3月31日发表由英法等十国外长及欧盟高级代表发布的联合声明，强烈谴责近期针对联合国驻黎巴嫩临时部队（联黎部队）的袭击，敦促各方遵守国际法，保障联黎部队人员和驻地安全。 这份由比利时、克罗地亚、塞浦路斯、法国、希腊、意大利、马耳他、荷兰、葡萄牙、英国等十国外长及欧盟高级代表发布的联合声明说，坚定支持联黎部队在黎南部执行任务，呼吁保持冲突降级渠道畅通，并强烈谴责近期联黎部队遇袭事件。声明强调，这些袭击导致维和人员伤亡惨重，令人无法接受。 声明指出，应根据国际人道主义法，保护黎巴嫩平民、人道主义人员、维和人员以及包括机场、港口和桥梁在内的民用基础设施安全，同时必须尊重黎巴嫩的领土完整。声明还呼吁以色列避免进一步扩大冲突，避免在黎领土上开展地面军事行动。 近日，联黎部队安全多次受到交火影响，两起袭击事件造成3名维和人员死亡、多人受伤。(新华社)", "ctime": 1775037596, "time_str": "17:59:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260401/c675698100.shtml"}, {"id": "4174053", "title": "伊朗原子能组织发言人：袭击重水设施构成“战争罪”", "content": "据伊朗伊斯兰共和国通讯社4月1日报道，伊朗原子能组织发言人卡迈勒万迪当天表示，袭击伊朗受保障监督的核设施违反国际原则，针对伊朗重水设施的袭击构成“战争罪”，伊朗将在国内和国际层面诉诸法律途径。 国际原子能机构3月29日称，位于伊朗中央省的洪达卜重水工厂已严重损坏并停止运行。据伊朗报告，该设施在两天前遭到袭击。(新华社)", "ctime": 1775037567, "time_str": "17:59:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260401/c675698091.shtml"}, {"id": "4174037", "title": "据报道，美国官员在讨论油价达到每桶150美元的可能性", "content": "据报道，美国官员在讨论油价达到每桶150美元的可能性。（财联社）", "ctime": 1775037410, "time_str": "17:56:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260401/c675698043.shtml"}, {"id": "4174033", "title": "上汽集团：2025年净利润101.06亿元，同比增长506.45%", "content": "上汽集团公告，2025年实现营业总收入6461.52亿元，同比增长5.22%；净利润101.06亿元，同比增长506.45%。     el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
