const NEWS     = [{"id": "5737741", "title": "比利时布鲁塞尔机场大量航班取消", "content": "受全国性罢工影响，比利时布鲁塞尔机场23日大量进出港航班取消，公共交通等多个行业也受到不同程度影响。据比利时媒体报道，布鲁塞尔机场当天429个进出港航班中有404个被取消。当地媒体援引比利时空中交通管制机构Skeyes的消息报道说，由于部分空管人员未出工，该机构当天7时至21时无法提供正常空中交通管制服务，仅提供应急服务及其他涉及飞行安全的必要服务。当地媒体报道称，除航空运输外，当地公共交通也受到影响，学校、政府部门及垃圾收运等公共服务也受波及。（新华社）", "ctime": 1795440282, "time_str": "21:24:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261123/c682124192.shtml"}, {"id": "5737739", "title": "以正直党领导人称无需在组阁前对伊朗动武", "content": "据以色列方面当地时间23日消息，受命组建政府的以色列正直党领导人埃森科特当天下午发表讲话说，目前伊朗并未构成直接且迫在眉睫的威胁，以色列无需在组建新政府前对伊朗采取军事行动。当天下午，埃森科特在正直党议会党团会议开始时作出上述表态。埃森科特表示，当前伊朗构成的最严重威胁是尚未被销毁或转移的440公斤浓缩铀，以方应集中精力应对这一问题。（央视新闻）", "ctime": 1795440275, "time_str": "21:24:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261123/c682124191.shtml"}, {"id": "5737699", "title": "WTI原油跌超2%", "content": "WTI原油跌超2%，现报81.71美元/桶。", "ctime": 1795440118, "time_str": "21:21:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261123/c682124165.shtml"}, {"id": "5737615", "title": "康辰药业：KC1086Ⅰ期临床研究数据将于2026年12月9日展示，客观缓解率为9.1%", "content": "康辰药业公告，公司自主研发的KC1086片将于当地时间2026年12月9日在圣安东尼奥乳腺癌研讨会上以壁报形式展示Ⅰ期临床研究剂量递增阶段初步结果，相关数据摘要已于当地时间2026年11月23日发布。截至2026年10月12日，剂量递增阶段共入组12例晚期实体瘤患者，其中11例为ER+/HER2-乳腺癌；在这11例患者中，确认的客观缓解率为9.1%（1/11），疾病控制率为63.6%（7/11）。公司正在推进KC1086联合氟维司群治疗HR+/HER2-局部晚期或转移性乳腺癌的Ⅱ期临床研究。公司称该研发进展对近期业绩不会产生重大影响，临床试验进度及结果等存在不确定性。", "ctime": 1795439278, "time_str": "21:07:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261123/c682123832.shtml"}, {"id": "5737569", "title": "白云电器：拟以债转股及现金方式对浙变电气增资2亿元", "content": "白云电器公告，为满足全资子公司浙江白云浙变电气设备有限公司业务经营需要、优化其资产负债结构，公司拟以债转股方式对浙变电气增资1.5亿元及以现金方式增资5000万元，合计增资2亿元，其中1.2亿元计入注册资本，8000万元计入资本公积。本次增资完成后，浙变电气注册资本拟由5亿元增加至6.2亿元，仍为公司全资子公司。本次增资事项已经公司第八届董事会第九次会议审议通过，无需提交股东会审议。", "ctime": 1795439093, "time_str": "21:04:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261123/c682123766.shtml"}, {"id": "5737543", "title": "海格通信与广州移动共建具身智能联合应用中心", "content": "据海格通信消息，11月23日，海格通信与中国移动通信集团广东有限公司广州分公司（简称“广州移动”）在广州海格通信产业园正式签署全面合作协议，同时揭牌成立具身智能联合应用中心。双方将围绕具身智能、低空经济、6G通信与卫星互联网、北斗商业化应用、工程与基础设施建设等方向开展深度协同创新，以网络强基，以通导筑基，以算网赋能，以智能共创，构建“技术+网络+算力”融合体系，助力粤港澳大湾区空天数字产业高质量发展。", "ctime": 1795439013, "time_str": "21:03:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261123/c682123744.shtml"}, {"id": "5737539", "title": "期货夜盘开盘，国内期货主力合约跌多涨少", "content": "期货夜盘开盘，国内期货主力合约跌多涨少，合成橡胶跌超2%，丙烯跌近2%，PTA、玻璃、乙二醇（EG）、聚丙烯、对二甲苯、瓶片、沥青、苯乙烯跌超1%。涨幅方面，沪金、20号胶涨超1%，沪银涨近1%。", "ctime": 1795439010, "time_str": "21:03:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261123/c682123743.shtml"}, {"id": "5737507", "title": "摩根士丹利称美股回调带来绝佳的买入时机", "content": "摩根士丹利策略师表示，标普500指数和道琼斯工业平均指数双双跌入修正区域之后，美股为投资者带来了一个不容错过的买入机会。Michael Wilson带领的团队表示，企业盈利和估值均支持市场反弹，而近期市场的恐慌性抛售也为反弹提供了背景。策略师们在战术层面的看多程度达到4月初以来最高。“这正是我们一直耐心等待的绝佳机会，我们不会错过，”Wilson团队在周一的一份报告中写道。“市场往往在坏消息和去杠杆化中见底，而这两者我们都已经经历了很多。”标普500指数期货周一反弹。此前，该指数连续七个交易日下跌，为2020年2月以来最长连跌。自10月初创下最近一个纪录高点以来，这一指数已下跌12%，在科技股剧烈轮动出逃之际进入修正区间。", "ctime": 1795438947, "time_str": "21:02:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261123/c682123716.shtml"}, {"id": "5737435", "title": "捷强装备：公司及潘峰、潘淇靖因内控重大缺陷收警示函", "content": "捷强装备公告，公司及相关人员近日收到天津证监局警示函。经查，2026年2月法院判决公司犯单位行贿罪、实际控制人之一潘峰犯单位行贿罪，反映公司内部控制存在重大缺陷，2020年至2024年《内部控制自我评价报告》信息披露不准确；生物检验车项目中标后，公司购买存货6805.33万元未履行集体决策程序，项目未及时签订合同导致2024年计提存货减值4382.26万元，占2023年总资产的2.83%，2024年《内部控制自我评价报告》信息披露不准确。天津证监局决定对公司、潘峰、潘淇靖采取出具警示函的行政监管措施，公司应于收到决定书之日起30日内完成整改及内部问责工作并提交书面报告。", "ctime": 1795438851, "time_str": "21:00:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261123/c682123699.shtml"}, {"id": "5737423", "title": "*ST英飞：拟1元出售新普互联及英飞拓系统100%股权，草案已披露尚待股东会审议", "content": "*ST英飞公告，公司拟向佳讯远纾出售新普互联100%股权和英飞拓系统100%股权，交易通过淘宝网资产处置竞价网络平台公开拍卖实施，成交金额为1元，佳讯远纾以现金方式支付对价。本次交易已获公司第七届董事会第六次会议、第九次会议审议通过，佳讯远纾有权决策机构已批准；尚需深投控同意及上市公司股东会审议通过。交易完成后，两标的公司不再纳入合并报表范围。", "ctime": 1795438846, "time_str": "21:00:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261123/c682123697.shtml"}, {"id": "5737339", "title": "斯菱智驱：拟10.51亿元现金收购银球科技75.6573%股权", "content": "斯菱智驱公告，公司披露重大资产购买报告书（草案）摘要，拟以支付现金方式向李定华、银球控股等15名交易对方购买银球科技75.6573%股权，交易价格合计10.51亿元。以2026年5月31日为评估基准日，银球科技100%股权收益法评估值为15.5亿元，评估增值率60.23%。本次交易尚需上市公司股东会审议通过。交易完成后，上市公司2025年度备考营业收入18.43亿元，增长133.89%；归属于母公司所有者的净利润2.64亿元，增长52.89%。", "ctime": 1795438725, "time_str": "20:58:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261123/c682123671.shtml"}, {"id": "5737337", "title": "锐科激光：拟续接控股股东委托贷款2500万元，利率降至1.95%", "content": "锐科激光公告，公司此前经2022年年度股东大会审定，接受控股股东航天三江为公司高性能激光原创技术攻关及产业化项目提供第一笔专项资金支持2500万元，该笔委托贷款通过航天科工财务有限责任公司拨付，利率2.65%，期限3年。截至目前，公司暂无增资扩股计划，在归还前述委托贷款本金2500万元后，将继续接受航天三江以委托贷款方式拨付该笔专项资金2500万元，拟与航天三江、建设银行武汉硚口支行签署《委托贷款合同》，贷款利率为1.95%，期限3年，并以自有设备提供抵押担保。", "ctime": 1795438713, "time_str": "20:58:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261123/c682123665.shtml"}, {"id": "5737269", "title": "11月23日 周一《新闻联播》要闻14条", "content": "1、【新思想引领新征程】以人为本加快建设完整社区；\n2、【权威访谈】充分发挥党的组织优势；\n3、我国加强“一老一小”服务体系建设；\n4、各地积极拓宽住房公积金使用范围；\n5、神舟二十四号发射在即 空间站与任务各系统准备工作顺利推进；\n6、数据领域高技能人才集群培养计划启动实施；\n7、截至10月底我国电动汽车充电基础设施超2500万个；\n8、前10个月中国—中东欧国家经贸合作示范区进出口突破500亿元；\n9、我国海洋药物和功能制品业产业增加值达996亿元；\n10、联合国气候变化安塔利亚大会闭幕 未就政治决定达成一致；\n11、俄船只在利比亚海域遇袭 联合国机构“严重关切” 芬兰称遭袭俄货船离开芬兰水域；\n12、约旦河西岸多地遭以军和定居者袭击；\n13、日本高致病性禽流感疫情蔓延；\n14、美国达美航空系统故障影响大量航班。（央视新闻）", "ctime": 1795438218, "time_str": "20:50:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261123/c682123524.shtml"}, {"id": "5737247", "title": "美元指数突破104关口，创去年4月来新高", "content": "美元指数突破104关口，日内涨0.21%，创去年4月来新高。", "ctime": 1795438011, "time_str": "20:46:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261123/c682123474.shtml"}, {"id": "5737173", "title": "Anthropic股价回吐盘前涨幅，现跌0.5%", "content": "Anthropic股价回吐盘前涨幅，现跌0.5%。", "ctime": 1795437803, "time_str": "20:43:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261123/c682123432.shtml"}, {"id": "5737159", "title": "德国数百所学校收到炸弹威胁电子邮件", "content": "德国数百所学校23日上午收到炸弹威胁电子邮件，部分学校采取了疏散等预防性措施。警方表示没有发现具体危险。德国电视一台的《今日新闻》栏目网站报道说，多个联邦州报告出现相关威胁，涉及弗赖堡、汉堡等城市。德国《图片报》称全德至少450所学校收到了包含炸弹威胁内容的电子邮件。(新华社)", "ctime": 1795437726, "time_str": "20:42:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261123/c682123422.shtml"}, {"id": "5737147", "title": "佐力药业：多微系列前三季度销售收入1.33亿元，9月起销售逐渐回升", "content": "佐力药业在投资者关系活动记录表中表示，多微系列产品前三季度销售收入1.33亿元；经历第一季度业务和人员整合、5月份销售阶段性承压后，9月份开始销售逐渐回升。", "ctime": 1795437640, "time_str": "20:40:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261123/c682123190.shtml"}, {"id": "5737129", "title": "万联证券龙红亮：强化逆周期调节 积极维护资本市场平稳运行", "content": "近日，沪深北交易所发布《关于调整融资保证金比例等相关安排的通知》，对此，万联证券首席经济学家龙红亮表示，此次沪深北交易所将融资保证金比例下限由100%下调至80%，是监管部门强化逆周期调节、积极维护资本市场平稳运行的重要举措，体现了监管层呵护市场、提振信心的政策导向。他分析，首先，政策有助于释放市场流动性，提升资金使用效率。在同等保证金条件下，投资者融资买入能力有所提升，带来潜在增量资金空间，为资本市场注入新的活力。其次，此次调整体现了监管政策的精准性和灵活性。继年初适度提高融资保证金比例、防范杠杆风险后，监管部门根据当前市场运行情况及时调整政策，彰显了逆周期调节机制日趋成熟，有利于稳定市场预期、增强投资者信心。", "ctime": 1795437545, "time_str": "20:39:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261123/c682122899.shtml"}, {"id": "5737121", "title": "招商证券：市场企稳修复的有利条件正在积累，后续市场内在稳定性和运行韧性有望进一步增强", "content": "11月23日，招商证券策略团队发布研报表示，沪深北交易所、中国结算等接连推出系列稳市举措，涉及下调融资保证金比例、延续并扩大降费措施、推进创业板做市商制度，进一步彰显监管部门维护资本市场平稳运行的决心。11月以来，稳市政策信号持续释放，政策支持力度不断加大。整体来看，本次政策接续前期稳市部署，进一步形成稳市政策合力。招商证券认为，总体来看，应当对中国经济长期向好和资本市场平稳健康发展保持坚定信心。随着稳市政策协同发力、外部扰动逐步消化，A股市场企稳修复的有利条件正在积累，后续市场内在稳定性和运行韧性有望进一步增强。", "ctime": 1795437517, "time_str": "20:38:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261123/c682122794.shtml"}, {"id": "5737097", "title": "德意志银行预计2027年美国GDP增长率为2.3%", "content": "德意志银行预计2027年美国GDP增长率为2.3%。", "ctime": 1795437393, "time_str": "20:36:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261123/c682122394.shtml"}, {"id": "5736913", "title": "中际旭创：拟回购公司股份，资金总额不低于20亿元且不超过40亿元", "content": "中际旭创公告，公司第六届董事会第六次会议审议通过了《关于回购公司股份方案的议案》。公司拟使用自有资金或自筹资金以集中竞价交易方式回购公司股份，用于员工持股计划或股权激励计划，以及为维护公司价值及股东权益所必需。本次回购股份资金总额不低于20亿元（含）且不超过40亿元（含），回购股份价格不超过600元/股（含）。", "ctime": 1795437007, "time_str": "20:30:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261123/c682121235.shtml"}, {"id": "5736891", "title": "国仪公司：签订1.42亿元高端双束电子显微镜销售合同", "content": "国仪公司公告，公司根据与某客户签订的《采购框架协议》，于近日收到并接受该客户下达的多份采购订单，约定向该客户销售高端双束电子显微镜，订单总金额为1.42亿元（含税）。上述合同属于公司日常经营性销售合同，已履行签署合同的内部审批程序，无需提交董事会、股东会审议，不构成关联交易，亦不构成重大资产重组。公司将根据产品交付、验收的实际情况，按照企业会计准则及公司会计政策中的收入确认原则在相应会计期间确认收入。", "ctime": 1795436880, "time_str": "20:28:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261123/c682121222.shtml"}, {"id": "5736831", "title": "中国民航局：2027-2029年自主有序参加国际航空碳抵消和减排机制", "content": "中国民用航空局声明，中国民航是全球航空绿色低碳转型的行动派和重要贡献者。为推动国际航空碳抵消和减排机制公平有效实施，中国民航愿意主动作出贡献。中国坚持真正的多边主义，经全面评估，愿于2027-2029年自主有序参加抵消机制，并将根据抵消机制后续谈判是否切实遵循国际法基本准则以及全球气候治理基本原则，确定2030年后相关立场。2027-2029年期间，中国境内航空公司所用抵消产品须经中国政府认可，港澳台地区可参照实施。中国民航参加抵消机制不与中国履行《联合国气候变化框架公约》及其《巴黎协定》的政策、措施和行动挂钩。", "ctime": 1795436455, "time_str": "20:20:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261123/c682121112.shtml"}, {"id": "5736817", "title": "九州一轨：董事兼总裁曹卫东提议回购公司股份，资金总额不低于6000万元且不超过1.2亿元", "content": "九州一轨公告，公司于2026年11月23日收到公司董事、总裁曹卫东先生出具的《关于提议北京九州一轨环境科技股份有限公司回购公司股份的函》。曹卫东提议公司使用自有资金及/或自筹资金，通过上海证券交易所股票交易系统以集中竞价交易方式回购公司已发行的部分人民币普通股（A股）股份，回购资金总额不低于人民币6000万元（含），不超过人民币1.2亿元（含），回购股份拟全部用于维护公司价值及股东权益，并在公司披露回购结果暨股份变动公告12个月后采用集中竞价交易方式出售。本次提议系新的股份回购提议，拟回购方案尚需履行公司相应决策程序。", "ctime": 1795436299, "time_str": "20:18:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261123/c682121076.shtml"}, {"id": "5736815", "title": "九州一轨：参股公司金刚石芯片基板项目点火投产，总投资约8亿元", "content": "九州一轨公告，公司参股公司通创九州“金刚石芯片基板建设项目（一期）”于2026年11月23日在北京市房山区举行点火仪式，项目总投资约8亿元，达产后预计年产6000万颗单晶金刚石芯片基板。点火仪式现场，通创九州与可川光子、青禾晶元等五家企业分别签署《战略合作协议》，围绕半导体金刚石衬底、高导热金刚石热沉器件开展深度合作；并与呼和浩特金山高新技术产业开发区管理委员会签订《战略合作框架协议》，拟共同推进金刚石芯片基板项目在内蒙古自治区的产业落地合作。通创九州为公司参股公司，不纳入合并报表范围，本次项目点火及协议签订预计不会对公司2026年度经营业绩构成重大影响。", "ctime": 1795436292, "time_str": "20:18:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261123/c682121072.shtml"}, {"id": "5736813", "title": "摩根大通：持续盈余意味着布伦特原油2027年上半年将处于70美元高位", "content": "摩根大通表示，持续盈余意味着布伦特原油2027年上半年将处于70美元高位，下半年降至60美元高位，2028年降至60美元中位。", "ctime": 1795436229, "time_str": "20:17:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261123/c682121056.shtml"}, {"id": "5736801", "title": "南京银行：大股东江苏交控增持1063.66万股，持股比例增至15.09%", "content": "南京银行公告，公司大股东江苏交通控股有限公司基于对公司长期投资价值的高度认可和对未来持续稳定发展的信心，自2026年7月18日起至2026年11月20日期间，以自有资金通过上海证券交易所交易系统以集中竞价交易方式合计增持公司股份1063.66万股，占公司总股本的0.09%。本次增持后，江苏交控持股数量由18.55亿股增至18.65亿股，持股比例由15.00%增加至15.09%。本次权益变动为股份增持，不触及要约收购，不会导致公司控股股东及实际控制人发生变化，公司仍无控股股东及实际控制人。江苏交控承诺在法定期限内不减持所持有的公司股份。", "ctime": 1795436134, "time_str": "20:15:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261123/c682121035.shtml"}, {"id": "5736767", "title": "中原环保：拟投资约3亿元建设四环管线续建项目", "content": "中原环保公告，公司此前完成摘牌收购郑州市三环、四环再生水管线资产，截至2026年9月24日，四环管线全长134.93公里，其中129.27公里已完成资产交割，占总长度的95.81%，尚有约5.66公里未完成交割。为实现四环再生水管线工程通水投运，公司第九届董事会第二十八次会议审议通过投资建设郑州市再生水利用四环管线及配套工程续建项目，总投资额约3亿元，资金来源为自有资金及自筹资金。", "ctime": 1795435841, "time_str": "20:10:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261123/c682120972.shtml"}, {"id": "5736765", "title": "中原环保：安阳县生态走廊PPP项目总投资额调整为8.31亿元", "content": "中原环保公告，公司此前披露投资建设安阳县（示范区）生态走廊（一期）PPP项目，项目估算总投资额约10.34亿元。为进一步优化项目建设内容、严控总投资规模，安阳县政府明确对本项目实施专项调整，总投资额由10.34亿元调整为8.31亿元，同时取消甲骨文公园、兴邺大桥、部分钢坝闸、风洞体验馆等部分子项建设，同步优化部分道路、公园建设规模，并将部分外部绿化工程纳入项目建设范围，相关变更拟通过签署项目PPP合同补充协议予以落实。", "ctime": 1795435836, "time_str": "20:10:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261123/c682120971.shtml"}, {"id": "5736763", "title": "中原环保：子公司拟投资5.39亿元建设污泥综合处理工程", "content": "中原环保公告，公司全资子公司郑州市污水净化有限公司将投资建设郑州市污水处理厂污泥综合处理工程，项目估算总投资5.39亿元，将现有300吨/日污泥堆肥设施升级改造为1000吨/日污泥干化+热解气化处理设施，建设期预计2年，污泥处理服务单价648元/吨与原特许经营协议保持一致。该事项已经公司第九届董事会第二十八次会议审议通过，无需提交股东会审议。", "ctime": 1795435829, "time_str": "20:10:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261123/c682120969.shtml"}, {"id": "5736755", "title": "香港证监会向大粤金融发出限制通知书 客户款项短欠约2960万港元", "content": "香港证监会今日向大粤金融集团有限公司（下称“大粤”）发出限制通知书，原因是该公司出现约2960万港元的客户款项短欠，且没有足够资源填补。这是香港证监会依据发出的保全措施，目的是保存客户资产、保障客户及投资大众利益。香港证监会认为，大粤曾动用客户款项，用于应付若干其他客户的保证金要求，并弥补这些客户的期货交易亏损。", "ctime": 1795435789, "time_str": "20:09:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261123/c682120955.shtml"}, {"id": "5736707", "title": "ARM首席执行官雷内·哈斯重申对公司的长期承诺", "content": "ARM首席执行官雷内·哈斯重申对公司的长期承诺，他表示，对ARM的未来从未如此充满信心。", "ctime": 1795435502, "time_str": "20:05:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261123/c682120845.shtml"}, {"id": "5736681", "title": "中信建投：美国先进芯片出口管制新规生效 半导体国产化有望加速", "content": "中信建投证券研究报告指出，本周美国再出新规，限制中国获取AI芯片，根据商务部发布的文件，美国芯片出口至印度尼西亚、马来西亚、泰国、巴西和新加坡将需要额外许可，新规定既旨在防止规避针对中国企业实施的禁运，也旨在防止利用设在第三国的数据中心，借助美国技术向中国提供算力。同时，英伟达发布FY2027Q3业绩，公司单季营收1158.4亿美元，同比增长103%，净利润653亿美元，同比增长105%，超市场一致预期。我们认为在美新规下，国产先进算力芯片有望大幅提升对本土半导体供应链需求，半导体设备、材料、零部件未来三年的爆发力和持续性拥有更高的能见度，强烈看好半导体国产化的机会。", "ctime": 1795435407, "time_str": "20:03:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261123/c682120806.shtml"}, {"id": "5736627", "title": "今年前三季度市场监管总局完成经营者集中反垄断审查440件", "content": "记者今天（23日）了解到，今年前三季度，市场监管总局共审结经营者集中案件440件，其中无条件批准420件。前三季度，制造业，电力、热力、燃气及水生产和供应业，交通运输、仓储和邮政业，批发和零售业，金融业，房地产业等领域投资较为活跃。从行业分布看，涉及制造业的集中162件，约占38.6%，投资最为活跃。其他交易数量较多的行业包括电力、热力、燃气及水生产和供应业51件，交通运输、仓储和邮政业40件，批发和零售业28件，金融业27件，房地产业26件。（央视新闻）", "ctime": 1795435293, "time_str": "20:01:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261123/c682120713.shtml"}, {"id": "5736495", "title": "泉阳泉：拟4.13亿元收购饮品公司18.1023%股权，持股将升至98.1552%", "content": "泉阳泉公告，公司拟收购吉林省亚东国有资本投资有限公司及其一致行动人吉林长白山私募基金管理有限公司持有的控股子公司吉林森工集团泉阳泉饮品有限公司18.1023%少数股东股权，交易价格依据吉林省国资委评估备案结果确定为4.13亿元，资金来源为募集资 function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';

    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';

  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
