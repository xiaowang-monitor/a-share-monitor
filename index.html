const NEWS     = [{"id": "5407413", "title": "欧盟：“星链”对乌至关重要 欧洲暂无替代方案", "content": "欧盟外交与安全政策高级代表卡拉斯16日在布鲁塞尔表示，美国太空探索技术公司旗下的“星链”卫星通信系统对于乌克兰至关重要，而欧洲在短期内尚不具备替代这一能力的条件。在谈及美国对乌政策时，卡拉斯表示，欧盟正努力说服美国伙伴，如果希望结束俄乌冲突，就必须向俄罗斯方面施加压力。她坦言，目前欧盟与美国之间的协调“非常困难”。（新华社）", "ctime": 1792151085, "time_str": "19:44:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261016/c680791672.shtml"}, {"id": "5407403", "title": "错估震级9.9级　日本气象厅再开记者会解释", "content": "据日本广播协会报道，日本气象厅在16日下午第二次召开的记者会中解释，当天中午错误推测发生9.9级地震并发出相应警报，可能是震源位置推定错误所致。", "ctime": 1792150964, "time_str": "19:42:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261016/c680791651.shtml"}, {"id": "5407397", "title": "航天智造：预计2026年前三季度净利润同比下降67.00%～55.00%", "content": "航天智造公告，预计2026年前三季度归母净利润为2.15亿元～2.93亿元，2025年同期为6.51亿元，同比下降67.00%～55.00%；扣非净利润预计为1.97亿元～2.47亿元，2025年同期为6.17亿元，同比下降68.00%～60.00%。报告期内，受汽车产销量下降及行业竞争加剧影响，公司汽车零部件业务收入同比降低约20%；产品价格持续承压，业务盈利水平进一步降低，毛利率同比降低超过4个百分点。", "ctime": 1792150934, "time_str": "19:42:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261016/c680791633.shtml"}, {"id": "5407395", "title": "国家粮食和物资储备局：中国粮食安全根基持续夯实", "content": "国家粮食和物资储备局局长刘焕鑫在2026年世界粮食日和全国粮食安全宣传周主会场活动上介绍，全国粮食年产量连续两年超过1.4万亿斤，人均粮食占有量超过500公斤且高于世界平均水平，实现谷物基本自给、口粮绝对安全，中国粮食安全根基得到持续夯实。刘焕鑫表示，实施全谷物行动计划，要常态长效推进科普，普及全谷物知识，培育多种消费场景，进一步完善全谷物标准体系，为产业升级和消费选择提供支撑和服务。同时要在科技创新和产业提升上下功夫，培育科技创新平台，推进关键技术研发，创制符合我国谷物消费特点的全谷物食品，扎实推进粮食流通提质增效和粮油加工设备更新，积极培育全谷物龙头企业、产业集群，不断丰富全谷物产品供给。（新华社）", "ctime": 1792150890, "time_str": "19:41:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261016/c680791625.shtml"}, {"id": "5407353", "title": "圣诺生物：特利加压素注射液获注册证书，规格8.5ml:0.85mg", "content": "圣诺生物公告，全资子公司成都圣诺生物制药有限公司近日收到国家药监局签发的特利加压素注射液《药品注册证书》，规格为8.5ml:0.85mg。该药获批注册，用于治疗胃肠道和泌尿生殖系统的出血症状。", "ctime": 1792150429, "time_str": "19:33:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261016/c680791503.shtml"}, {"id": "5407351", "title": "ST佳缘：2026年收到证监会处罚决定并被罚600万元", "content": "ST佳缘公告，2026年10月16日，公司收到中国证监会《行政处罚决定书》。因信息披露违法违规，公司被责令改正、给予警告并处以600万元罚款；王进、朱伟华、柳絮、尹明君分别被罚300万元、200万元、200万元、150万元。处罚认定公司《招股说明书》中2019年、2020年财务数据及2021年和2022年年度报告内容存在虚假记载，公司判断相关行为触及股票交易被实施其他风险警示情形。", "ctime": 1792150421, "time_str": "19:33:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261016/c680791498.shtml"}, {"id": "5407337", "title": "四部门：组织30余家车企座谈 加强汽车产品研发测试验证管理", "content": "今天从工业和信息化部获悉，工业和信息化部、公安部、生态环境部、市场监管总局四部门组织30余家重点汽车生产企业开展座谈，加强汽车产品创新设计和研发测试验证管理。\n据了解，汽车生产企业应落实质量提升专项行动工作要求，坚决抵制非理性竞争，加强汽车产品创新设计和研发测试验证管理，守牢产品安全底线。重点包括：\n全面加强测试验证，增强研发测试验证能力，充分开展产品创新设计安全评估和研发测试验证，及时消除安全隐患。\n如实宣传产品创新设计的使用边界、限制条件和研发测试验证等情况，不得作虚假、夸大或引人误解的宣传，不得使用违反道路交通法规的场景来宣传产品功能，不得诱导驾驶人忽视安全驾驶责任等内容。\n工业和信息化部表示，下一步，将加快推进有关标准制修订，进一步提升安全基线要求，对重点汽车生产企业持续开展监督检查，依法依规严肃处理存在问题的生产企业，并向社会公开曝光，督促汽车生产企业加强汽车产品测试验证，坚决守牢产品安全底线，推动汽车产业高质量发展。（央视新闻）", "ctime": 1792150297, "time_str": "19:31:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261016/c680791409.shtml"}, {"id": "5407321", "title": "伊朗称新型武器装备投入使用", "content": "伊朗军队发言人阿克里米尼亚今天（10月16日）表示，伊朗已将新型武器装备投入使用，“伊朗的防御能力比美以伊战争时期更强大”。他指出，近几周，伊朗击落了数架美国无人机。在国防部的领导下，军队制定并实施了新的作战和装备计划，“大幅加强了全国的防御覆盖范围”。此外近一段时间以来，伊朗军队与伊朗伊斯兰革命卫队航空航天部队也进行了联合演习，以加强协调。(CCTV国际时讯)", "ctime": 1792150199, "time_str": "19:29:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261016/c680791373.shtml"}, {"id": "5407311", "title": "博硕科技：江苏摩锐投资有限公司、宿迁市鸿德轩投资合伙企业（有限合伙）减持计划实施完毕，分别减持1.83%、2.45%", "content": "博硕科技公告，公司于2026年6月25日披露减持股份预披露公告。近日，公司收到江苏摩锐投资有限公司、宿迁市鸿德轩投资合伙企业（有限合伙）的告知函，两方减持计划均已实施完毕。江苏摩锐合计减持309.93万股，占公司总股本的1.83%，实施期间为2026年8月6日至2026年10月15日；鸿德轩合计减持414.51万股，占公司总股本的2.45%，实施期间为2026年7月17日至2026年10月16日。", "ctime": 1792149871, "time_str": "19:24:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261016/c680791303.shtml"}, {"id": "5407309", "title": "ST佳缘：因虚减营业收入76.64万元被责令改正", "content": "ST佳缘公告，2026年10月16日，公司收到四川证监局行政监管措施决定书。因公司2024年度虚减营业收入76.64万元、虚减利润总额56.53万元，四川证监局对公司采取责令改正措施，并对王进、朱伟民、朱伟华、柳絮采取出具警示函措施。公司已与会计师事务所沟通，对相应年度财务会计报告进行了追溯更正。", "ctime": 1792149862, "time_str": "19:24:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261016/c680791301.shtml"}, {"id": "5407307", "title": "伊朗海军：一艘违规油轮在霍尔木兹海峡东部起火", "content": "当地时间16日，伊朗海军表示，数小时前，海军监视小组在持续监控霍尔木兹海峡东部海域时，发现并确认了一艘在禁航区内起火的违规油轮。该违规油轮关闭了导航追踪系统，试图穿越阿曼湾禁航区域。伊朗海军强调，在禁航区域无序航行将危及安全，并给其他船只带来诸多危险。（央视新闻）", "ctime": 1792149833, "time_str": "19:23:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261016/c680791290.shtml"}, {"id": "5407283", "title": "丁薛祥出席2026年世界职业技术教育发展大会开幕式并会见与会外国政要", "content": "2026年世界职业技术教育发展大会16日在天津开幕，中共中央政治局常委、国务院副总理丁薛祥出席并致辞。\n\n丁薛祥表示，职业教育是培养高素质技能人才的基础工程，在经济社会发展中具有举足轻重的地位和作用。习近平主席强调，要构建职普融通、产教融合的职业教育体系，大力培养大国工匠、能工巧匠、高技能人才。这些年，中国不断完善现代职业教育制度，拓宽青年成长成才路径，夯实产业发展人才支撑，深化国际交流合作，推动职业教育发展取得历史性成就、发生格局性变化。(外交部网站)", "ctime": 1792149354, "time_str": "19:15:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261016/c680791095.shtml"}, {"id": "5407277", "title": "截至2025年底 我国户外运动参与人数超5亿", "content": "国家体育总局今天发布《中国户外运动产业发展报告》(2025—2026年)，截至2025年底，我国户外运动参与人数超过5亿，户外运动相关产业总规模约3.17万亿元。户外运动场地设施基础加快巩固。截至2025年底，全国共有冰雪场地2626个，较“十三五”末增长39%，包括滑冰场地1723个、滑雪场地903个。全国健身步道18.2万个、总长度达43.03万公里，较“十三五”末分别增长104%和106%；全国拥有经营性攀岩场馆970家、自然岩壁攀岩场700多处、自然岩壁线路1.4万余条。“十四五”期间全国新增公共码头泊位2200个，水上运动场地设施呈现沿海集聚、内河湖区加快布局的扩增趋势。首批高质量户外运动目的地建设稳步推进，为提升户外运动品质提供了有力支撑，部分入选地区客流量、跨省到访量和驻留时长等增长特征明显。（央视新闻）", "ctime": 1792149341, "time_str": "19:15:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261016/c680791090.shtml"}, {"id": "5407261", "title": "国常会：对《中华人民共和国档案法实施条例》等14部行政法规的部分条款予以修改", "content": "据央视：李强主持召开国务院常务会议，会议决定，对《中华人民共和国档案法实施条例》等14部行政法规的部分条款予以修改，对《中华人民共和国港口间海上旅客运输赔偿责任限额规定》等4部行政法规予以废止。", "ctime": 1792149283, "time_str": "19:14:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261016/c680791068.shtml"}, {"id": "5407251", "title": "李强主持召开国务院常务会议，会议讨论并原则通过《中华人民共和国教师法（修订草案）》", "content": "据央视：李强主持召开国务院常务会议，会议讨论并原则通过《中华人民共和国教师法（修订草案）》。", "ctime": 1792149233, "time_str": "19:13:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261016/c680791050.shtml"}, {"id": "5407241", "title": "李强主持召开国务院常务会议，会议讨论并原则通过《中华人民共和国价格法（修正草案）", "content": "据央视：李强主持召开国务院常务会议，会议讨论并原则通过《中华人民共和国价格法（修正草案）》。", "ctime": 1792149206, "time_str": "19:13:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261016/c680791044.shtml"}, {"id": "5407239", "title": "李强主持召开国务院常务会议", "content": "李强主持召开国务院常务会议。会议指出，人工智能是影响未来发展的关键变量，要从我国产业体系完备、应用场景丰富、工程化能力强等实际出发，注重以落地应用牵引技术创新，不断深化拓展“人工智能+”行动。 （央视新闻）", "ctime": 1792149183, "time_str": "19:13:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261016/c680790999.shtml"}, {"id": "5407233", "title": "卫星化学：2026年第三季度净利润28.32亿元，同比增长180.03%", "content": "卫星化学公告，2026年第三季度营业收入157亿元，同比增长38.81%；归母净利润28.32亿元，同比增长180.03%；扣非净利润29.69亿元，同比增长121.28%。2026年前三季度营业收入464.14亿元，同比增长33.49%；归母净利润90.59亿元，同比增长141.24%；扣非净利润90.22亿元，同比增长112.89%。", "ctime": 1792149166, "time_str": "19:12 ock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261016/c680790499.shtml"}, {"id": "5407107", "title": "中国人民银行行长潘功胜会见欧盟委员会经济和生产力委员东布罗夫斯基斯、欧洲中央银行行长拉加德、欧元集团主席皮埃拉卡基斯及欧洲有关国家央行行长", "content": "2026年10月16日，中国人民银行行长潘功胜在出席国际货币基金组织/世界银行年会期间应约会见了欧盟委员会经济与生产力委员东布罗夫斯基斯、欧洲中央银行行长拉加德和欧元集团主席皮埃拉卡基斯，就中欧宏观经济金融政策、中欧货币金融合作等议题进行了交流。潘功胜表示，全球经济失衡与全球分工格局演进、国际货币体系固有矛盾、部分国家长期高财政赤字高消费等密切相关。全球失衡不能依靠汇率调节。汇率受经济增长、货币政策、金融市场、地缘政治、突发风险事件等多种因素影响，与经常账户不存在简单线性关系。逆差国与顺差国应共同努力，实现全球经济动态平衡。中国是负责任大国，近年来一直致力于扩大内需，积极推进经济增长方式转型。中国将坚定落实 “十五五”规划确定的战略方向和重点举措，将投资于物和投资于人紧密结合，大力促进服务业发展，继续推进结构性改革，从而推动宏观经济在更高水平上实现新的内外平衡。（央行网站）", "ctime": 1792148027, "time_str": "18:53:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261016/c680790471.shtml"}, {"id": "5407101", "title": "四部门将常态化开展综合治理加油机作弊监管执法", "content": "记者今天了解到，根据今年7月市场监管总局、公安部、商务部、税务总局联合印发的指导意见，相关部门将常态化开展综合治理加油机作弊监管执法。市场监管总局将强化生产源头监管，压实加油机生产企业、加油站经营者的主体责任，督促其严格落实计量器具型式批准和防作弊要求。配合相关部门探索建立加油机软硬件升级机制，推动防作弊技术标准的更新迭代。对明知故犯参与作弊设备改装、软件破解的黑灰产业链坚决予以斩断，从生产、销售到使用环节全链条设防，提高违法成本，降低作弊动机。同时将通过大数据、物联网等技术手段开展跨部门数据共享应用试点，深化与公安、税务、商务等部门的数据共享。另外，指导各地建立跨区域案件的线索通报、协查配合常态化机制，同时建章立制，破解基层执法“定性难”的问题。针对基层执法中面临的取证难、定性难等痛点，加快出台加油机作弊执法指引和电子数据取证规范，统一全国执法标准和裁量尺度，让基层在办理这类高科技执法案件时“有章可循、有规可依”。（央视新闻）", "ctime": 1792147869, "time_str": "18:51:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261016/c680790433.shtml"}, {"id": "5407097", "title": "太乙核能可控核聚变仿星器研发验证基地项目落地无锡高新区", "content": "10月16日，太乙核能科技（无锡）有限公司董事长、联合创始人、首席执行官曹诚志一行来访无锡高新区，与无锡高新区党工委书记、区委书记崔荣国交流会谈，并共同出席太乙核能可控核聚变仿星器研发验证基地项目签约活动。（科创板日报）", "ctime": 1792147858, "time_str": "18:50:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261016/c680790430.shtml"}, {"id": "5407093", "title": "科翔股份：2026年第三季度归母净利润3.11亿元，同比增长638.54%", "content": "科翔股份公告，2026年第三季度营业收入18.5亿元，同比增长100.90%；归母净利润3.11亿元，同比增长638.54%；扣非净利润3.09亿元，同比增长614.82%。2026年前三季度营业收入39.79亿元，同比增长45.92%；归母净利润2.44亿元，同比增长304.01%；扣非净利润2.34亿元，同比增长276.60%。", "ctime": 1792147787, "time_str": "18:49:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261016/c680790411.shtml"}, {"id": "5407083", "title": "江丰电子：姚力军提议以不低于人民币5000万元（含）、不超过人民币1亿元（含）回购股份", "content": "江丰电子公告，2026年10月16日，公司收到控股股东、实际控制人、首席技术官姚力军提议，拟以自有及自筹资金通过集中竞价方式回购A股，资金总额不低于人民币5000万元（含）且不超过人民币1亿元（含）；回购价格不高于董事会审议通过回购方案决议前30个交易日公司股票交易均价的150%，拟用于后续员工持股计划或股权激励计划。董事会将尽快研究并制定回购方案，具体以董事会审议通过为准。", "ctime": 1792147694, "time_str": "18:48:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261016/c680790389.shtml"}, {"id": "5407079", "title": "罗博特科：实控人提议公司以5000万元-1亿元回购股份", "content": "罗博特科公告，公司于2026年10月16日收到实际控制人、董事长兼CEO戴军提议回购公司股份的函。提议回购资金总额不低于人民币5000万元（含本数）且不超过人民币1亿元（含本数），回购价格不超过董事会通过回购决议前30个交易日公司股票交易均价的150%，回购股份拟全部注销并减少公司注册资本。董事会将研究制定回购方案并履行审议程序。", "ctime": 1792147684, "time_str": "18:48:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261016/c680790387.shtml"}, {"id": "5407077", "title": "世界气象组织科学官员：此次厄尔尼诺强度远超“非常强”标准，预计至少持续到2027年初", "content": "世界气象组织（WMO）科学官员Sebastian Grey表示，当前赤道中东太平洋海面温度异常已达约3摄氏度，远高于1.5摄氏度的“强”和2摄氏度的“非常强”标准，预计至少持续到2027年初。他指出南亚季风偏弱、印度降雨不足，非洲之角北部苏丹、南苏丹、埃塞俄比亚北部粮食安全状况不稳定。牲畜和渔业同样受冲击：干旱减少牧场，高温导致牲畜产奶减少，秘鲁已无限期关闭渔业。协调机制方面，他以“早期预警系统”全球倡议为例，指出WMO负责监测、预报和早期预警，但观测网络仍有缺口。人工智能和快速数据同化提供了机会，可汇集气象、农业、脆弱性和遥感数据，增强农业预测能力。（第一财经）", "ctime": 1792147678, "time_str": "18:47:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261016/c680790386.shtml"}, {"id": "5407063", "title": "豪威集团：拟以2.5亿元~5亿元回购公司股份", "content": "豪威集团公告，公司拟以集中竞价交易方式回购A股股份，金额不低于人民币2.5亿元（含）、不高于人民币5亿元（含），回购价格不超过人民币120元/股（含）。回购股份拟用于实施员工持股计划或股权激励，资金来源为自有资金及/或自筹资金，回购期限自董事会审议通过方案之日起不超过3个月。", "ctime": 1792147502, "time_str": "18:45:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261016/c680790323.shtml"}, {"id": "5407049", "title": "甘肃电投集团与中科院兰州化物所深化产学研合作", "content": "10月16日，甘肃电投集团党委书记、董事长卢继卿会见中国科学院院士刘维民一行。双方就深化开展科技创新合作进行了交流。座谈期间，双方一致同意建立集团层面常态化科技合作机制，明确对接部门、固定联络渠道，常态化梳理产业技术需求、精准匹配科研资源。围绕行业难点、设备本质安全、资源清洁化利用等重点方向开展合作研究。此次座谈，进一步畅通了科研创新与产业应用的融合通道。下一步，甘肃电投集团将持续深化与中科院兰州化物所产学研战略合作，聚焦能源保供、绿色转型、安全提质主线，加速关键核心技术攻关与成果转化落地，持续提升企业科技创新能力，为全省能源产业高质量发展提供有力支撑。（人民财讯）", "ctime": 1792147307, "time_str": "18:41:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261016/c680790276.shtml"}, {"id": "5407043", "title": "广汽集团：150亿元债务融资工具获注册", "content": "广汽集团公告，公司此前获授权在境内外债券市场发行本金不超过150亿人民币或等值外币的债务融资工具。近日，交易商协会同意接受公司债务融资工具注册，注册金额为150亿元，注册额度自通知书落款之日起2年内有效；公司将在注册额度及有效期内择机发行。", "ctime": 1792147273, "time_str": "18:41:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261016/c680790267.shtml"}, {"id": "5407041", "title": "深交所本周共对114起证券异常交易行为采取了自律监管措施", "content": "深交所本周共对114起证券异常交易行为采取了自律监管措施，涉及盘中拉抬打压、虚假申报等异常交易情形；共对6起上市公司重大事项进行核查，并上报证监会1起涉嫌违法违规案件线索。", "ctime": 1792147238, "time_str": "18:40:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261016/c680790257.shtml"}, {"id": "5407035", "title": "18国外长发表联合声明 反对哥伦比亚在耶路撒冷设立驻以使馆", "content": "当地时间16日，巴基斯坦外交部发布一份18国外长联合声明，强烈谴责并明确反对哥伦比亚在耶路撒冷设立驻以色列大使馆。声明称，哥方此举违反联合国安理会相关决议，破坏国际社会为实现以“两国方案”为基础的公正、持久的和平所作的努力。声明重申，任何旨在改变被占领耶路撒冷法律和历史地位或承认耶路撒冷为以色列首都的措施或决定，均属无效，不具有任何法律效力。声明呼吁哥伦比亚政府重新考虑并撤销这一决定，根据国际法履行其应承担的义务，避免采取损害巴勒斯坦人民合法权利的措施，包括其建立以1967年边界为基础、以东耶路撒冷为首都的独立的巴勒斯坦国的权利。（央视新闻）", "ctime": 1792147132, "time_str": "18:38:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261016/c680790220.shtml"}, {"id": "5406999", "title": "今年1.3万亿元超长期特别国债发行收官", "content": "记者从财政部获悉，10月16日，财政部第三次续发行2026年超长期特别国债（五期）200亿元。至此，今年超长期特别国债发行收官，发行规模达1.3万亿元。今年的政府工作报告提出，拟发行超长期特别国债1.3万亿元，持续支持“两重”建设、“两新”工作等。根据财政部此前发布的通知，今年的超长期特别国债发行工作于4月24日启动，10月16日结束。今年的超长期特别国债资金具体用在何处？据了解，这1.3万亿元资金中，8000亿元用于支持“两重”建设，2500亿元用于支持消费品以旧换新，2000亿元用于支持大规模设备更新，500亿元用于支持设立财政金融协同促内需专项资金。业内人士表示，超长期特别国债是当前我国财政政策“工具箱”里的重要组成部分。自2024年以来，我国已连续三年发行超长期特别国债，体现了更加积极的财政政策持续精准发力。（新华社）", "ctime": 1792146790, "time_str": "18:33:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261016/c680790072.shtml"}, {"id": "5406997", "title": "美诺华：美诺华天康获11mg枸橼酸托法替布缓释片注册证书", "content": "美诺华公告，全资子公司宁波美诺华天康药业有限公司此前提交枸橼酸托法替布缓释片国产药品注册申请并获受理，近日收到国家药监局核准签发的《药品注册证书》，获得该药品在国内生产、销售的资格。该药品规格为11mg，批准文号为国药准字H20266229。", "ctime": 1792146778, "time_str": "18:32:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261016/c680790066.shtml"}, {"id": "5406991", "title": "回馈式智能微电网在江苏启东应用", "content": "10月16日，在江苏启东中远海运海工码头，N1166海雅轮完成总装进入最后调试阶段。项目团队利用国内首套回馈式智能微电网系统，完成该船发电机组关键负载试验，在海洋船舶发电机试验领域取得新突破。启东是海工装备制造基地，集聚数十家重点企业，船舶海工产业去年规上产值达480亿元。据启东中远海运海洋工程有限公司相关负责人介绍，船舶发电机负载试验是船舶交付前的关键工序，需要模拟超载、突加突卸等工况下的发电机性能。“传统试验长期采用干电阻式负载箱，测试电能转化为热能散失，单次试验消耗数百吨柴油，能耗高、碳排放量大。”该负责人说，更关键的是，发电机试验中功率会剧烈波动，若直接回馈电网，既易冲击用电设备，又会因频率、电压不稳产生难以接入的问题，“这是长期制约该领域绿色转型的技术瓶颈。”（新华社）", "ctime": 1792146721, "time_str": "18:32:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261016/c680790053.shtml"}, {"id": "5406987", "title": "数据港：拟采购不超过10亿元算力服务", "content": "数据港公告，公司拟采购不超过10亿元算力服务，算力集群总算力不低于850P(fp16)，服务期限为5年（60个月）。该事项已获公司第四届董事会第十六次会议审议通过，尚需提交股东会审议，供应商尚未确定。", "ctime": 1792146691, "time_str": "18:31:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share":   return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
