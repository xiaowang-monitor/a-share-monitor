.badge {

.badge-s { background: rgba(239,68,68,0.2); color: #ef4444; }

.score-bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s; }
.up { color: var(--red); }
.down { color: var(--green); }
.pulse { animation: pulse 2s infinite; }
@keyframes pulse {

  50% { opacity: 0.5; }

一代AI训练、推理及智能体计算推出的全新平台。其中，NVL72系统集成72颗Rubin GPU和36颗Vera CPU，采用NVLink 6高速互连技术。相较上一代平台，该系统每兆瓦吞吐量最高可提升30倍，每百万Token推理成本最高可降至原来的1/45，同时使用四分之一数量的GPU，即可提供AI算力。目前，联想Vera Rubin NVL72已在全球出货。（科创板日报）", "ctime": 1792128379, "time_str": "13:26:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261016/c680770317.shtml"}, {"id": "5405705", "title": "香港首个“具身智能国际应用训练场”揭幕 智平方、宇树等成首批技术伙伴", "content": "近日，由香港生产力促进局辖下香港工业人工智能与机械人研发中心（FLAIR）成立的香港首个“具身智能国际应用训练场”（训练场）正式揭幕。智平方、宇树科技、智元创新等行业代表企业作为首批七家技术伙伴共同获授牌，智平方旗下通用智能机器人爱宝（AlphaBot 2）已入驻训练场，参与具身智能技术在真实应用场景中的训练、验证与优化。（人民财讯）", "ctime": 1792128321, "time_str": "13:25:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261016/c680770301.shtml"}, {"id": "5405693", "title": "中科海钠武汉江夏区10GWh钠离子电池生产线落地签约", "content": "10月14日，第四届全国钠电池研讨会期间举办签约仪式，中科海钠（武汉）科技有限责任公司与武汉市江夏区，签约建设10GWh钠离子电池生产线项目，其中一期规划建设3GWh钠离子电池电芯产线，为当前全球最大钠离子电芯产线。(界面)", "ctime": 1792128186, "time_str": "13:23:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261016/c680770235.shtml"}, {"id": "5405687", "title": "中国信通院人工智能所联合发布《具身智能发展报告（2026年）》", "content": "在2026年10月14—16日召开的人工智能产业发展联盟2026人工智能产业大会期间，中国信通院人工智能研究所联合清华大学电子工程系、具身智能测试实验室共同发布《具身智能发展报告（2026年）》（中文版本）。并在2026年10月16日国际电信联盟（ITU-T）具身智能标准焦点组（FG-EAI）第三次会议同期研讨会上发布《具身智能发展报告（2026年）》（英文版本）。报告立足具身智能从实验室验证向规模化应用跨越的关键窗口期，聚焦过去一年来产业发展的新变化与新挑战，从物理AI与具身智能的概念厘清、产业热潮之下的冷思考、明确具身智能四要素框架、剖析从“表演”到“应用”的路径演进与商业模式、评测体系与国际标准进展等维度展开系统分析。最后从技术架构重构、应用场景深化、评测体系完善和安全伦理构建四个方面对未来发展进行展望。(人民财讯)", "ctime": 1792127996, "time_str": "13:19:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261016/c680770174.shtml"}, {"id": "5405667", "title": "央行副行长陶玲：完善离岸人民币流动性供给，拓展常态化互换资金使用安排", "content": "10月16日，中国人民银行副行长陶玲在全球财富管理论坛·2026上海苏河湾大会上表示，将继续支持金融机构开展人民币境外贷款和跨境贸易融资，完善银行同业跨境人民币融资政策，鼓励更多境外机构参与熊猫债发行和交易，支持香港发展人民币点心债市场。陶玲表示，离岸市场拥有充足的人民币，是境外主体获得并使用人民币的前提。下一步，将丰富流动性管理和风险管理工具，在已推出离岸人民币债券回购和跨境回购业务的基础上，继续推动回购市场和衍生品市场产品创新、机制完善。同时，支持人民币清算行更好发挥离岸市场流动性供给作用，发挥货币互换机制作用，与更多有条件的国家和地区建立常态化互换资金使用安排。（澎湃新闻）", "ctime": 1792127760, "time_str": "13:16:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261016/c680770100.shtml"}, {"id": "5405633", "title": "辽苏科技合作大会暨辽宁省产业技术研究院成立大会在沈阳举行", "content": "10月16日，辽苏科技合作大会暨辽宁省产业技术研究院成立大会在沈阳举行。会上举行集中签约仪式，辽苏两省政研企相关方代表围绕辽苏“六互”科技创新等签署合作协议。现场发布辽苏合作成果、需求和应用场景清单，举行辽宁省产业技术研究院揭牌仪式并作相关推介。（辽宁日报）", "ctime": 1792127143, "time_str": "13:05:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261016/c680769857.shtml"}, {"id": "5405627", "title": "飞行汽车概念股午后继续拉升 英搏尔等近20股涨停", "content": "飞行汽车概念股午后继续拉升，英搏尔、广联航空、王子新材、瑞玛精密、均胜电子等近20股涨停。消息面上，当地时间10月15日晚，特斯拉在美国得州举行第二代超级跑车Roadster发布活动。发布会现场，Roadster跑车可以像冲上几乎垂直的墙面，并可以停留吸附在屋顶上。", "ctime": 1792127077, "time_str": "13:04:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261016/c680769827.shtml"}, {"id": "5405617", "title": "沪深京三市成交额超1万亿元，较上日此时缩量190亿元", "content": "据同花顺iFinD数据，沪深京三市成交额超1万亿元，较上日此时缩量190亿元，预计全天成交金额约1.6万亿元。截至目前，沪市成交额4594亿元，深市成交额5321亿元，北证50成交额86亿元。", "ctime": 1792126980, "time_str": "13:03:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261016/c680769777.shtml"}, {"id": "5405611", "title": "日经225指数涨幅扩大至2%", "content": "日经225指数涨幅扩大至2%，现报65704.93点。", "ctime": 1792126933, "time_str": "13:02:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261016/c680769758.shtml"}, {"id": "5405591", "title": "商务部：进博会筹备工作与“出口中国”品牌活动深度联动", "content": "国务院新闻办公室今天举行新闻发布会，商务部有关负责人表示，过去一年，商务部累计开展近百场“出口中国”活动，为各国优质产品进入中国市场提供更多渠道。一年来，进博会筹备工作与“出口中国”品牌活动进行了深度联动，合力提升国际影响力，共同释放进口政策红利。（央视新闻）", "ctime": 1792126526, "time_str": "12:55:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261016/c680769668.shtml"}, {"id": "5405589", "title": "美国空军重申 六代机F-47首飞目标仍锁定2028年", "content": "美国空军高层近日披露，第六代隐身战机F-47的完整生产线正加速成形，该机首飞目标仍锁定2028年。主承包商波音公司已投资近20亿美元扩建F-47生产厂房，并于日前拿下美国海军舰载六代机项目。日前，美国空军战斗机与先进飞机采购执行官蒂莫西·赫尔弗里希准将，在空军与太空军协会主办的线上座谈中表示，为第六代战斗机F-47建立完整生产线的工作正越来越近。主承包商波音公司自2023年起在圣路易斯扩建超过100万平方英尺设施，包括88万平方英尺的飞机总装建筑、机库、雷达截面测试设施等，整个项目计划2030年完工。目前，F-47项目仍在按照激进的时间表推进，首飞目标仍定在2028年，量产型战机则计划在2030年代初进入作战服役。（央视新闻）", "ctime": 1792126514, "time_str": "12:55:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261016/c680769657.shtml"}, {"id": "5405587", "title": "也门胡塞武装称击落沙特方面侦察无人机", "content": "当地时间10月16日，也门胡塞武装发言人叶海亚·萨雷亚表示，胡塞武装在马里卜省上空击落一架沙特方面的“翼龙-2”武装侦察无人机。该无人机当时正在马里卜省上空执行所谓“敌对行动”，胡塞武装使用适当武器将其击落。截至目前，沙特方面暂未对此做出回应。（央视新闻）", "ctime": 1792126509, "time_str": "12:55:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261016/c680769655.shtml"}, {"id": "5405581", "title": "腾讯WorkBuddy、CodeBuddy团队公布DeepSeek模型服务异常补偿方案", "content": "10月16日，腾讯云WorkBuddy及CodeBuddy团队发布《关于DeepSeek模型服务异常说明及补偿公告》。针对此前DeepSeek模型服务异常，将对受影响用户全额返还其10月8日至14日期间使用DeepSeek所消耗的积分；同时，面向WorkBuddy和CodeBuddy国内版全量用户额外赠送500积分。此前，DeepSeek就服务系统出现故障致歉，并公布补偿方案，受影响用户账号7日内（10.8-10.14）的消耗金额以赠金形式全额返还。（界面新闻）", "ctime": 1792126388, "time_str": "12:53:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261016/c680769615.shtml"}, {"id": "5405577", "title": "阅文发布首批AI精品动画与OPC平台", "content": "10月16日，阅文创作大会在杭州举行。阅文发布了首批AI精品动画项目，推出“IP委员会”模式，首个项目《保卫南山公园》与三体宇宙合作，并将DramaBuddy漫剧助手升级为OPC一站式平台。阅文集团CEO兼总裁侯晓楠披露，阅文已签约5000多个“个人及个人工作室”，前十大OPC创作者年收入均突破100万。（界面新闻）", "ctime": 1792126381, "time_str": "12:53:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261016/c680769611.shtml"}, {"id": "5405569", "title": "围城封锁威胁也门塔伊兹市粮食安全", "content": "10月16日是世界粮食日。因饱受战乱与政治不稳定等因素影响，也门的粮食安全问题一直十分严峻。就在近期，也门胡塞武装控制了塔伊兹省大部分地区，首府塔伊兹市目前正四面受困。受封锁影响，城中民众出现恐慌情绪，粮食价格上涨，粮食安全受到威胁。（央视新闻）", "ctime": 1792125837, "time_str": "12:43:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261016/c680769411.shtml"}, {"id": "5405567", "title": "日本冲绳县拟允许美军继续部署“鱼鹰”运输机", "content": "据日本共同社报道，日本冲绳县知事古谢玄太16日表示，拟允许美军“鱼鹰”运输机继续部署在位于冲绳县宜野湾市的普天间机场。共同社称，这意味着冲绳县政府长期以来反对部署该机型的立场发生转变。古谢玄太当天在冲绳县厅接受媒体采访时表示，“鱼鹰”运输机已在当地部署10多年，考虑到日本自卫队也在使用该机型，要求撤销部署或停止使用“已不现实”。美军自2012年开始在普天间机场部署“鱼鹰”运输机，冲绳县政府此前一直表示反对。此后，该机型多次发生事故。由于担忧飞行安全及噪音问题，冲绳当地民众也长期反对美军部署该机型。（新华社）", "ctime": 1792125821, "time_str": "12:43:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261016/c680769408.shtml"}, {"id": "5405501", "title": "长江通信：低轨卫星通信是公司重点开拓的新行业之一", "content": "长江通信在2026年半年度业绩说明会上表示，低轨卫星通信是公司重点开拓的新行业之一。未来，公司将持续关注市场动态和行业发展趋势，基于现有通信与指挥核心技术，继续围绕低轨卫星市场需求加大产品研发力度，不断丰富产品序列、提升服务能力，提高公司的核心竞争力。（人民财讯）", "ctime": 1792124316, "time_str": "12:18:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261016/c680768800.shtml"}, {"id": "5405497", "title": "10月16日午间公告一览：周生生2026年第三季度零售销售值增长3%", "content": "周生生公告，集团截至2026年9月30日止三个月零售销售值同比增长3%；中国大陆、香港及澳门、台湾同店销售均录得正增长，其中中国大陆同店销售增长4%，香港及澳门增长7%。", "ctime": 1792124232, "time_str": "12:17:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261016/c680768706.shtml"}, {"id": "5405477", "title": "韩国综指涨幅扩大至4%", "content": "韩国综指涨幅扩大至4%，现报5776.48点。个股方面，三星电子、SK海力士涨超4%。", "ctime": 1792123363, "time_str": "12:02:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261016/c680768340.shtml"}, {"id": "5405471", "title": "港股午评：恒生指数涨1.21%，恒生科技指数涨2.09%", "content": "港股午间收盘，龙湖集团涨9.05%，百济神州涨5.94%，蔚来-SW涨4.98%，华润置地涨4.92%，李宁涨4.85%，快手-W涨4.83%，新东方-S涨4.71%。", "ctime": 1792123348, "time_str": "12:02:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261016/c680768324.shtml"}, {"id": "5405449", "title": "俄罗斯堪察加半岛发生6.9级地震 震源深度150千米", "content": "中国地震台网正式测定：10月16日11时35分在俄罗斯堪察加半岛（北纬51.95度，东经157.40度）发生6.9级地震，震源深度150千米。(央视新闻)", "ctime": 1792123198, "time_str": "11:59:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261016/c680768245.shtml"}, {"id": "5405447", "title": "韩国交易所启动SIDECAR机制，暂停KOSDAQ程序化买入", "content": "韩国交易所启动SIDECAR机制，暂停KOSDAQ程序化买入。", "ctime": 1792123179, "time_str": "11:59:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261016/c680768242.shtml"}, {"id": "5405441", "title": "现货黄金站上4180美元/盎司", "content": "现货黄金站上4180美元/盎司，日内涨0.26%。", "ctime": 1792122599, "time_str": "11:49:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261016/c680768014.shtml"}, {"id": "5405437", "title": "俄堪察加半岛地区发生7.0级地震", "content": "据欧洲地中海地震中心报告，俄罗斯堪察加半岛地区今天（10月16日）发生7.0级地震。(CCTV国际时讯)", "ctime": 1792122529, "time_str": "11:48:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261016/c680767986.shtml"}, {"id": "5405425", "title": "图库巨头 Getty 拟破产重组，视觉中国回应：合作正常", "content": "当地时间10月12日，全球图片及视觉内容供应商Getty Images（盖蒂图片社）宣布达成全面重组协议，计划数周内启动美国破产法第11章预打包重整程序，年底前完成重组及私有化退市。在中国市场，Getty Images的内容只 // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }

function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {

  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>

}

  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
