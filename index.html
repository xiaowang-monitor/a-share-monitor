聚聚甲醛的生产设备、生产能力、供应商关系、客户基础、销售渠道等在业务转移和更名前后均未发生实质变化。由株式会社大赛璐继承宝理塑料株式会社在共聚聚甲醛反倾销措施中所适用的35.5%反倾销税税率及其他权利义务。由台湾大赛璐工程塑胶股份有限公司继承台湾宝理塑胶股份有限公司在共聚聚甲醛反倾销措施中所适用的3.8%反倾销税税率及其他权利义务。以宝理塑料株式会社名称向中国大陆出口的共聚聚甲醛，适用共聚聚甲醛反倾销措施中“其他日本公司”所适用的35.5%反倾销税税率。以台湾宝理塑胶股份有限公司名称向中国大陆出口的共聚聚甲醛，适用共聚聚甲醛反倾销措施中“其他台湾地区公司”所适用的32.6%反倾销税税率。（商务部）", "ctime": 1787191837, "time_str": "10:10:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260820/c679124413.shtml"}, {"id": "4990125", "title": "《网络数据安全风险评估办法》实施有关事项答记者问", "content": "《网络数据安全风险评估办法》于2026年8月20日起施行，公安部有关负责人就其实施有关事项回答了记者提问。公安机关将建立全流程监管机制，掌握辖区内网络数据处理者相关情况，建立并完善动态监管台账。对发现存在较大安全风险、发生数据安全事件等情形的，依法督促网络数据处理者委托通过认证的第三方评估机构开展风险评估。对未按规定开展风险评估的网络数据处理者，将依据《中华人民共和国数据安全法》《网络数据安全管理条例》等有关法律、行政法规予以处理；第三方评估机构违反《网络数据安全风险评估办法》开展风险评估的，公安机关将依法予以处理。（新华社）", "ctime": 1787191658, "time_str": "10:07:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260820/c679124243.shtml"}, {"id": "4990123", "title": "据报道，三星将公布规模达100万亿韩元的股东回报计划", "content": "据报道，三星将公布规模达100万亿韩元的股东回报计划。（财联社）", "ctime": 1787191607, "time_str": "10:06:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260820/c679124202.shtml"}, {"id": "4990121", "title": "宇树上市后，王兴兴首场公开演讲谈了具身智能ChatGPT时刻", "content": "8月20日，在2026世界机器人大会上，宇树科技创始人、董事长王兴兴进行“展品到产品：人形机器人产业的下一个十年”的主题演讲。王兴兴表示，这些年公司其实一直在推动机器人真正走进生活，比如在汽车工厂进行落地应用、在自家工厂部署机器人进行简单测试等，另外AI团队也在推进机器人去家庭干活。但他提到，由于目前整体效率、泛用性能力还是不够高，宇树并没有进行大规模推广。王兴兴希望，迈向具身智能的ChatGPT时刻，理想情况下需要2-3年，或者更长5-10年的时间。他认为，达到这一时刻，即要在80%的陌生场景中，通过语音或文字指令，机器人能够顺利完成大约80%的任务。目前，最核心的挑战是AI大模型的输入输出和真实机器人的对齐。（第一财经）", "ctime": 1787191536, "time_str": "10:05:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260820/c679124131.shtml"}, {"id": "4990119", "title": "上期所沪银主力合约大涨5%", "content": "上期所沪银主力合约大涨5%，报16405元/千克。", "ctime": 1787191534, "time_str": "10:05:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260820/c679124129.shtml"}, {"id": "4990117", "title": "当虹科技机器人多模态感知上装件在2026世界机器人大会上发布", "content": "记者从当虹科技获悉，公司在2026世界机器人大会上正式发布机器人多模态感知上装件，该设备可根据不同场景搭载双光云台，集成声光、通信、算力等模块，同时支持气体、温湿度等外接传感器。在工业巡检场景中，可识别仪表读数，检测温度异常、气体风险、设备异响以及液体跑冒滴漏等问题，将更多现场信息实时带回，为后续AI识别和任务决策提供数据基础。（人民财讯）", "ctime": 1787191511, "time_str": "10:05:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260820/c679124113.shtml"}, {"id": "4990113", "title": "贵金属板块持续走强，山东黄金触及涨停", "content": "贵金属板块持续走强，山东黄金触及涨停，兴业银锡、赤峰黄金此前涨停，晓程科技涨超10%，招金黄金、中金黄金、湖南白银、山金国际、四川黄金跟涨。", "ctime": 1787191474, "time_str": "10:04:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260820/c679124074.shtml"}, {"id": "4990105", "title": "工信部副部长辛国斌：推动机器人产业创新发展，聚焦农业、医疗、养老、应急等重点行业", "content": "工业和信息化部副部长辛国斌在2026世界机器人大会上表示，工业和信息化部推动机器人产业创新发展。一是强化创新合作，鼓励中外科研机构、企业开展联合攻关，打通产学研用创新链条，共同推动智能化升级。二是深化应用联动，聚焦农业、医疗、养老、应急等重点行业，分类组织开展产用结对攻关、实地应用验证和成熟场景推广，共同推动产业化进程。三是坚持以人为本，秉持向上向善理念，推动技术向善、科技为民，兼顾效率提升与就业保障，让机器人更好服务人的生产生活。（财联社）", "ctime": 1787191342, "time_str": "10:02:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260820/c679123937.shtml"}, {"id": "4990103", "title": "北京市市长殷勇：推进“机器人+”示范应用，打造全球机器人应用标杆城市", "content": "北京市市长殷勇在2026世界机器人大会上表示，北京市将统筹各类创新资源，全力营造开放包容、充满活力的机器人与具身智能发展环境。提供更加完善的要素保障，出台人形机器人产业高质量发展三年行动方案，完善中试平台、检验检测、投融资服务体系，打造快速响应、更具韧性的机器人产业链供应链。拓展更加广阔的应用空间，用好超大城市丰富场景优势，推进“机器人+”示范应用，打造全球机器人应用标杆城市。（财联社）", "ctime": 1787191331, "time_str": "10:02:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260820/c679123931.shtml"}, {"id": "4990099", "title": "合成生物板块掀涨停潮", "content": "合成生物板块掀涨停潮，卫光生物、近岸蛋白、智飞生物、华大智造、康希诺、沃森生物等十余股封涨停板。相关ETF方面，生物医药ETF天弘（159859）涨7.07%，成交额2.22亿元，生物医药ETF汇添富（159839）涨7.37%，成交额8281.01万元。", "ctime": 1787191270, "time_str": "10:01:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260820/c679123830.shtml"}, {"id": "4990097", "title": "中国240小时过境免签“朋友圈”扩展至57国", "content": "国家移民管理局8月20日发布公告，自2026年8月20日起，吉尔吉斯斯坦、越南公民可适用240小时过境免签政策和海南30天入境免签政策来华。至此，240小时过境免签政策适用国家增至57国，海南30天入境免签政策适用国家增至61国。 吉尔吉斯斯坦、越南公民持普通护照和确定日期及行程的联程客票，从中国过境前往第三国或地区，可从北京、上海等65个对外开放口岸免签入境，并在规定区域内免签停留不超过240小时。两国公民持普通护照可由海南省对外开放口岸入境，在海南省行政区域内免签停留不超过30天。适用上述2项免签政策停留期间可从事旅游、商贸、访问、探亲等短期活动，工作、学习、新闻采访等需事先批准的活动仍应在来华前办妥签证。 国家移民局相关负责人介绍，对吉尔吉斯斯坦、越南公民实施2项免签政策，是稳步推进高水平对外开放、推动构建周边命运共同体的务实举措，有利于进一步促进双方互信合作，推动旅游商贸、访问投资更加便利高效。下一步，国家移民局将统筹发展和安全，坚决维护规范有序的出入境管理秩序，更好促进中外人员往来和国际交流合作，服务国家高水平开放高质量发展。(新华社)", "ctime": 1787191256, "time_str": "10:00:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260820/c679123820.shtml"}, {"id": "4990093", "title": "光纤概念板块走高，长盈通涨超15%", "content": "光纤概念板块走高，长盈通涨超15%，太辰光、三旺通信涨超10%，通鼎互联、优利德、仕佳光子、腾景科技、万隆光电跟涨。", "ctime": 1787191246, "time_str": "10:00:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260820/c679123802.shtml"}, {"id": "4990091", "title": "9月1日起施行 最高法发布著作权民事纠纷司法解释修改决定", "content": "最高人民法院今天（20日）发布《关于修改<最高人民法院关于审理著作权民事纠纷案件适用法律若干问题的解释>的决定》，自2026年9月1日起施行。为正确适用2020年修正的《中华人民共和国著作权法》（以下简称著作权法），充分发挥人民法院知识产权审判职能作用，加强对著作权和与著作权有关的权益的保护，合理平衡权利保护与社会公共利益，最高人民法院在深入调研、广泛征求意见和反复论证基础上，对《最高人民法院关于审理著作权民事纠纷案件适用法律若干问题的解释》（法释〔2002〕31号，2020年修正，以下简称原司法解释）进行了修改。（央视新闻）", "ctime": 1787191243, "time_str": "10:00:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260820/c679123800.shtml"}, {"id": "4990089", "title": "受贿数额特别巨大 交通银行原副行长侯维栋被提起公诉", "content": "记者今天（20日）从最高人民检察院获悉，交通银行股份有限公司原党委委员、副行长侯维栋涉嫌受贿一案，由国家监察委员会调查终结，移送检察机关审查起诉。经最高人民检察院指定管辖，重庆市人民检察院依法以涉嫌受贿罪对侯维栋作出逮捕决定。近日，重庆市人民检察院第五分院已向重庆市第五中级人民法院提起公诉。检察机关在审查起诉阶段，依法告知了被告人侯维栋享有的诉讼权利，并讯问了被告人，听取了辩护人的意见。检察机关起诉指控：被告人侯维栋利用担任交通银行股份有限公司首席信息官、信息技术管理部总经理，首席信息官，党委委员、首席信息官，党委委员、副行长、首席信息官，党委委员、副行长兼交银康联人寿保险有限公司董事长，党委委员、副行长等职务上的便利，为他人谋取利益，非法收受他人财物，数额特别巨大，依法应当以受贿罪追究其刑事责任。（央视新闻）", "ctime": 1787191237, "time_str": "10:00:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260820/c679123794.shtml"}, {"id": "4990083", "title": "生物疫苗板块持续走高，石药创新涨停", "content": "生物疫苗板块持续走高，石药创新涨停，此前塞力医疗、海普瑞、智飞生物、金迪克、万泰生物等多股涨停，东富龙、康泰生物涨超15%。", "ctime": 1787191133, "time_str": "09:58:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260820/c679123646.shtml"}, {"id": "4990079", "title": "宇树科技王兴兴：目前人形机器人的效能相对较低 技术精进后会大规模推广", "content": "2026世界机器人大会（WRC 2026）期间，宇树科技创始人、董事长发布主题演讲。王兴兴现场解答为什么其产品没有进行在工厂，家庭等场景大规模推广，“其实最主要的原因就是目前整体的效率和它的能力还是不够，简单来说就是虽然目前我们机器人能做一些工作，但是它的效率其实跟人比起来还是低一些。”此外，他还表示，现在人形机器人当有一些新任务时，要重新进行训练，导致效率相对更低一点，“所以我们还是希望把技术做到更加泛化，能力更加精准，再在具体场景中进行大规模推进。”（财联社）", "ctime": 1787191049, "time_str": "09:57:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260820/c679123563.shtml"}, {"id": "4990067", "title": "北京亦庄：将加快实现10万台套级具身智能机器人规模量产", "content": "8月19日，2026世界机器人大会在北京亦庄开幕。在“开放合作”主论坛上，北京经开区工委委员、管委会副主任李全发布“北京机域”——人机共融具身智能新社会建设构想。北京亦庄将加快打造100款可实际落地的特色机器人产品，推动其在1000种细分领域实现应用；加快实现10万台套级具身智能机器人规模量产，形成100万套关键核心零部件生产能力。(人民财讯)", "ctime": 1787190850, "time_str": "09:54:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260820/c679123336.shtml"}, {"id": "4990061", "title": "药明康德盘中涨超5%", "content": "A股药明康德盘中涨5.0%，现报172.20元。", "ctime": 1787190738, "tim // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
