: "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260721/c678316516.shtml"}, {"id": "4765683", "title": "汽车最高补2万、家电补1500元 河南下半年促消费“大礼包”来了", "content": "7月21日，河南省人民政府新闻办公室举行新闻发布会，介绍河南省2026年上半年经济社会发展亮点和下半年重点举措，并回答记者提问。河南省商务厅党组成员、副厅长宋玉哲在答记者问中介绍，下半年，河南将持续实施消费品以旧换新。对汽车报废更新、置换更新的个人消费者，按比例分别最高给予2万元、1.5万元补贴；对购买补贴范围内的冰箱、洗衣机、电视、空调、电脑、热水器等6类家电，最高1500元补贴；手机、平板、智能手表手环、智能眼镜等4类数码智能产品，最高500元补贴，预计再惠及消费者超千万人次。(人民财讯)", "ctime": 1784612910, "time_str": "13:48:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260721/c678316486.shtml"}, {"id": "4765649", "title": "外媒称美国政府考虑与联合国难民署切断关系", "content": "据外媒报道，美国特朗普政府近几周正在考虑与联合国难民署切断关系，外交人员和联合国官员正努力说服美国政府改变这一想法。 路透社20日援引多名匿名消息人士的话报道说，美国与联合国难民署近期在该机构副高级专员的任命问题上产生分歧，随后开始考虑脱离该机构。今年6月，联合国难民署任命美国职业外交官特雷莎·芬纳蒂为副高级专员，而非特朗普政府支持的人选西蒙·汉金森。 数名消息人士认为，美方原定上周就是否切断关系做出决定，但至今仍未正式宣布，可能表明外交游说起了作用。 特朗普2025年重返白宫后，美国已宣布退出包括世界卫生组织在内的多个联合国机构。 难民署是联合国重要机构，经联合国大会一致同意于1950年12月14日成立，负责领导和协调国际行动，以保护全球难民及解决难民问题，总部设在日内瓦。由于人道主义援助资金大幅减少，该机构于2025年6月宣布将精简其总部及下属机构，裁减约3500个职位。(新华社)", "ctime": 1784612666, "time_str": "13:44:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260721/c678316352.shtml"}, {"id": "4765645", "title": "上证50股指期货(IH)主力合约日内涨超2%", "content": "上证50股指期货(IH)主力合约日内涨超2%，现报2915.2点。", "ctime": 1784612660, "time_str": "13:44:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260721/c678316349.shtml"}, {"id": "4765641", "title": "富时中国A50指数期货涨幅扩大至2%", "content": "富时中国A50指数期货涨幅扩大至2%。", "ctime": 1784612632, "time_str": "13:43:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260721/c678316346.shtml"}, {"id": "4765611", "title": "《山西省统筹煤炭行业发展和安全新规十七条》即将发布 拟彻底清理取缔隐蔽工作面", "content": "记者获悉，《山西省统筹煤炭行业发展和安全新规十七条》即将发布。其中，将彻底清理取缔隐蔽工作面。对查实隐藏采掘点、“阴阳图纸”等行为，责令煤矿停产整顿、撤出井下隐蔽采掘点人员设备，拒不整改的，依法采取关停、吊销证照、永久封井等措施；对相关煤矿企业法定代表人、实际控制人、实际负责人、最终受益人、幕后操控人及矿长、外包队负责人等关键人员构成犯罪的，依法移送司法机关追究刑事责任。同时，严格落实“三管三必须”实施细则和煤矿安全管理职责清单。加强煤矿安全全链条监管。强化省应急管理厅全省煤矿安全生产监督管理职责。省发展改革委负责煤矿矿区总体规划审查审批，省发展改革委、省能源局按权限负责煤炭开发项目核准。（人民财讯）", "ctime": 1784612426, "time_str": "13:40:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260721/c678316309.shtml"}, {"id": "4765545", "title": "现货黄金站上4060美元/盎司", "content": "现货黄金站上4060美元/盎司，日内涨1.3%。", "ctime": 1784612072, "time_str": "13:34:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260721/c678316192.shtml"}, {"id": "4765473", "title": "英力股份成立储能科技公司 含电池制造业务", "content": "企查查APP显示，近日，荆州飞米储能科技有限公司成立，法定代表人为李禹华，注册资本为1000万元，经营范围包含电池制造；智能仪器仪表制造；集成电路销售；集成电路芯片及产品销售；电力电子元器件制造等。企查查股权穿透显示，该公司由英力股份(300956)间接全资持股。（人民财讯）", "ctime": 1784611878, "time_str": "13:31:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260721/c678316177.shtml"}, {"id": "4765457", "title": "现货白银站上58美元/盎司", "content": "现货白银站上58美元/盎司，日内涨2.94%。", "ctime": 1784611844, "time_str": "13:30:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260721/c678316172.shtml"}, {"id": "4765391", "title": "康希诺生物：与巴基斯坦伙伴就13价肺炎结合疫苗达成相关合作意向", "content": "7月21日，据康希诺生物官微消息，公司于巴基斯坦-中国企业间投资峰会期间与巴基斯坦合作伙伴AGP Limited公司达成13价肺炎球菌多糖结合疫苗（PCV13i）相关合作意向（letter of intent, LOI），双方将围绕该产品在巴基斯坦的未来发展机会开展进一步探索。（每日经济新闻）", "ctime": 1784611726, "time_str": "13:28:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260721/c678316157.shtml"}, {"id": "4765371", "title": "伊朗称打击科威特境内三处美军基地", "content": "当地时间21日，伊朗陆军发布声明称，伊朗军队使用无人机打击了科威特境内的三处美军基地，打击目标包括阿里夫坚基地的行政大楼和导航天线、乌代里直升机基地的停机坪和艾哈迈德·贾比尔空军基地的美军大楼。（央视新闻）", "ctime": 1784611633, "time_str": "13:27:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260721/c678316133.shtml"}, {"id": "4765367", "title": "阿里巴巴集团旗下高德正式上线全新位置分享功能“位置口令”", "content": "近日，阿里巴巴集团旗下高德正式上线全新位置分享功能。用户在高德App打开该功能，选择中国大陆及港澳台地区的任意位置后，即可生成一组6位数字；接收方在高德“位置口令”页面输入这组数字后，便能直接获取对应位置并一键导航。其中高德位置口令的本质，是将专业经纬度转化为普通人也能直接使用和传播的数字编码。这让地图能力首次从“地点搜索”延伸到了“任意位置表达”。用户不再需要记住复杂经纬度，只需要6位数字，就能准确描述所在位置。位置口令如同空间世界里的“二维码”。正如二维码降低了信息获取和传播门槛，位置口令则降低了位置沟通的门槛，让位置第一次像电话号码一样，可以被口头传播。（科创板日报）", "ctime": 1784611608, "time_str": "13:26:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260721/c678316130.shtml"}, {"id": "4765341", "title": "兴业基金总经理李辉因个人原因离任", "content": "7月21日，兴业基金发布高级管理人员变更公告称，公司总经理李辉因个人原因离任，该职务由公司董事长刘宗治代任。同时，公司副总经理黄文锋到龄退休。", "ctime": 1784611361, "time_str": "13:22:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260721/c678316081.shtml"}, {"id": "4765283", "title": "美出台原铝关税优惠弥补产能不足", "content": "美国白宫20日宣布，美国总统特朗普当日签署公告，依据《1962年贸易扩展法》第232条款等为在美国投资原铝生产项目的企业提供原铝进口关税优惠。外媒分析认为，此举旨在弥补美国原铝产能不足。 公告说，美国商务部将建立机制，鼓励在美投资新建、扩建或翻新铝冶炼厂。符合条件的项目需要承诺在2029年1月20日前开工。美国商务部将允许项目所在企业每年进口与新项目预期年产量相同数量的原铝，并按照《1962年贸易扩展法》第232条款适用的关税减半缴纳进口关税。 去年6月，美国将进口自除英国外所有贸易伙伴的钢铝产品关税从25%上调至50%。今年4月和6月，美国先后出台政策，弱化钢铝关税力度。彭博社报道说，美国政府原本希望通过50%的钢铝关税提高美国国内产能，然而这一关税措施成效有限。美国原铝产能不足，严重依赖从加拿大和中东地区进口来满足国内需求。(新华社)", "ctime": 1784610864, "time_str": "13:14:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260721/c678316020.shtml"}, {"id": "4765281", "title": "COMEX黄金期货涨超1%", "content": "COMEX黄金期货涨超1%，现报4057.2美元/盎司。", "ctime": 1784610864, "time_str": "13:14:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260721/c678316019.shtml"}, {"id": "4765265", "title": "官方通报“河南维江生物科技有限公司生产菠萝啤存异物等问题”：全面调查", "content": "7月21日，河南伊川县市场监督管理局发布情况通报：近日，媒体报道伊川县河南维江生物科技有限公司生产的菠萝啤产品质量及企业生产经营方面问题。我局高度重视，第一时间成立调查组，正在对涉事企业依法依规全面调查。下一步，我局将根据调查结果进行严肃处理。同时，举一反三在全县范围内开展专项排查整治，严厉打击食品安全违法行为，坚决维护消费者合法权益。（界面新闻）", "ctime": 1784610774, "time_str": "13:12:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260721/c678316003.shtml"}, {"id": "4765243", "title": "大唐集团在青海刚察成立清洁能源公司", "content": "企查查APP显示，近日，大唐（刚察）清洁能源有限公司成立，法定代表人为李生卫，注册资本为1.26亿元，经营范围包含太阳能发电技术服务；风力发电技术服务；新兴能源技术研发；工程管理服务；储能技术服务等。企查查股权穿透显示，该公司由中国大唐集团有限公司间接全资持股。（人民财讯）", "ctime": 1784610620, "time_str": "13:10:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260721/c678315967.shtml"}, {"id": "4765193", "title": "北证50指数涨幅扩大至2%", "content": "北证50指数涨幅扩大至2%，现报1066.318点。", "ctime": 1784610420, "time_str": "13:07:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260721/c678315920.shtml"}, {"id": "4765189", "title": "中证500股指期货(IC)主力合约日内涨超6%", "content": "中证500股指期货(IC)主力合约日内涨超6%，现报7647.6点。", "ctime": 1784610405, "time_str": "13:06:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260721/c678315918.shtml"}, {"id": "4765173", "title": "创业板指午后持续拉升涨超6%", "content": "创业板指午后持续拉升涨超6%，上证指数涨幅扩大至1%，深证成指涨4.08%。全市场超3200家个股上涨。科技板块大幅走强。", "ctime": 1784610380, "time_str": "13:06:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260721/c678315886.shtml"}, {"id": "4765149", "title": "港股大模型概念股大幅走高 智谱涨近30%", "content": "港股大模型概念股大幅走高，智谱涨近30%，MINIMAX涨近13%。", "ctime": 1784610317, "time_str": "13:05:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260721/c678315878.shtml"}, {"id": "4765137", "title": "北京3300套专项保障房启动配租 条件放宽", "content": "7月20日，北京保障房中心启动2026年度新毕业大学生及青年人才专项配租，共推出房源3300套，分布在14个行政区、59个公租房项目和10个保租房项目。7月28日起分时段启动意向登记。此次配租进一步放宽保障年限，将申请范围扩大至近5年本科及以上学历毕业生，年龄35周岁及以下，即1990年7月20日（含）以后出生，在京就业创业且无自有住房的青年人才均可申请。覆盖应届毕业生与职场初期青年群体，适配不同阶段人才的过渡性安居需求，让更多留京青年享受到保障性住房政策红利。（北京发布）", "ctime": 1784610292, "time_str": "13:04:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260721/c678315873.shtml"}, {"id": "4765059", "title": "沪深300股指期货(IF)主力合约日内涨超3%", "content": "沪深300股指期货(IF)主力合约日内涨超3%，现报4644.4点。", "ctime": 1784610132, "time_str": "13:02:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260721/c678315670.shtml"}, {"id": "4765015", "title": "中际旭创盘中涨超10%", "content": "A股中际旭创盘中涨超10%，现报1106.00元。", "ctime": 1784610058, "time_str": "13:00:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260721/c678315647.shtml"}, {"id": "4764999", "title": "中证1000股指期货(IM)主力合约日内涨超5%", "content": "中证1000股指期货(IM)主力合约日内涨超5%，现报7121.8点。", "ctime": 1784610025, "time_str": "13:00:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260721/c678315643.shtml"}, {"id": "4764969", "title": "五大宽基ETF成交领跑，成交持续放量", "content": "7月21日，宽基ETF热度延续、成交持续放量，核心标杆产品再度领衔市场交投。上午盘中科创50ETF华夏表现最为抢眼，半日成交额突破120亿元；创业板ETF易方达、沪深300ETF华泰柏瑞同步跟进，半日成交分别站上95.73亿元、73.82亿元。与此同时，南方基金旗下中证500ETF、中证1000ETF交投同样活跃，半日成交额双双突破50亿元。值得关注的是，上述五只宽基ETF均为前一交易日成交规模居前的核心产品，当日合计成交接近790亿元，占到全市场股票型ETF总成交额的近三成，成为本轮资金布局的核心主力标的。（第一财经）", "ctime": 1784609936, "time_str": "12:58:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.co // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
