"https://news.10jqka.com.cn/20260728/c678483235.shtml"}, {"id": "4819111", "title": "集邦咨询：AI需求催出日韩MLCC厂单月出货新高 消费级订单外溢效应显现", "content": "根据TrendForce集邦咨询最新MLCC产业调查，得益于AI需求畅旺，2026年6月村田、三星电机、太阳诱电等三大日韩厂出货同步创下近五年单月新高；其消费级订单持续外溢，利好其他制造商和渠道报价皆有上涨。因日韩厂加速将消费级X5R产能转向AI用X6S/X7R高端规格，消费级中高容MLCC（1uF-22uF）产能受挤压，主流料号的库存水位普遍已低于30天。在此排挤效应下，渠道、代理商与Tier 2/3客户急单涌现，订单外溢效应持续扩大，其他制造商的接单能见度明显改善，报价同步走扬。此外，已提前备货的代理商把握机会调高产品价格，平均涨幅达20%-25%，现货市场更提高价格至原本的二到三倍，整体消费级MLCC市场呈现“终端需求偏弱、渠道价格偏强”的结构性格局。", "ctime": 1785218207, "time_str": "13:56:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260728/c678483209.shtml"}, {"id": "4819049", "title": "印度软件股有望创纪录跑赢全球芯片股", "content": "印度软件股有望创下对全球芯片股的最大月度跑赢纪录，表明投资者正在撤出AI交易，转向此前遭受重创的信息技术（IT）股票。由10家印度软件出口商组成的印度NIFTY IT指数本月上涨16%，而MSCI全球半导体及相关设备制造商指数则下跌13%。两者走势分化表明，投资者对芯片股驱动的AI上涨行情逐渐感到疲惫，同时在经历多年低迷后重新关注印度IT服务企业。此次资金转向之际，被视为全球半导体和AI投资风向标的韩国KOSPI指数已较6月中旬高点下跌超过30%。杰富瑞金融集团上周将印度IT行业评级上调至“中性”，并表示AI交易逆转可能推动该行业出现阶段性上涨。", "ctime": 1785217712, "time_str": "13:48:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260728/c678483132.shtml"}, {"id": "4818981", "title": "机构：美联储加息压力增大", "content": "天利投资高级经济学家Anthony Willis在一份报告中表示，由于美国通胀水平仍显著高于目标，同时经济和劳动力市场依然具有韧性，美联储决策者收紧政策的压力有所增加。Willis表示：“不过，在通胀影响变得更加明确之前，政策制定者可能愿意暂时忽略近期油价飙升带来的影响。”尽管如此，更广泛的走向是显而易见的：在沃什的领导下，美联储正在采取更加鹰派的立场。市场目前预计美联储周三加息的概率为38%，并且已经完全计价9月加息的可能性。", "ctime": 1785217286, "time_str": "13:41:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260728/c678483068.shtml"}, {"id": "4818971", "title": "约旦称击落一架侵入该国领空的无人机", "content": "当地时间28日，据约旦武装部队发言人发表的声明，当天凌晨对一架侵入约旦领空的无人机实施处置。发言人表示，按照既定交战规则，约旦皇家空军在约旦东部沙漠地区将该无人机击落。发言人强调，约旦武装部队将继续履行职责，坚决捍卫国家边境安全，维护国家安全和主权，对任何危害国家安全和公民生命安全的威胁绝不姑息。（央视新闻）", "ctime": 1785217163, "time_str": "13:39:23", "stock_code": "", "stock_name": "", "stock_market": "content": "今天，中央广播电视总台“智竞未来——首届智能机器人应用技能大展”发布活动举行。在活动现场，有一群“硬核的朋友”们。它们有的在智能产线当“巧匠”，有的在高危作业一线当“先锋”，都在各自的岗位上大展身手。它们练就了高端制造的“基本功”，生产链路、工业流程正在被数字化重新定义。在电网运维现场，“羚羊”机器人又稳又灵巧，全套操作一肩挑，可让工作人员远离高压电作业风险；还有“蛟龙”配网带电作业机器人，可在10米高空的高压线上工作，灵活的伸展手臂完成一连串复杂动作，为万家灯火持续续航。（央视新闻）", "ctime": 1785215361, "time_str": "13:09:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260728/c678482634.shtml"}, {"id": "4818479", "title": "通信线缆及配套板块重挫", "content": "通信线缆及配套板块重挫，长飞光纤跌超9%，长盈通、亨通光电、永鼎股份、中天科技等跟跌。", "ctime": 1785215062, "time_str": "13:04:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260728/c678482545.shtml"}, {"id": "4818405", "title": "商务部发布《关于所谓“产能过剩”问题的中方立场》", "content": "商务部7月28日发布《关于所谓“产能过剩”问题的中方立场》，澄清有关事实，阐明中方对所谓“产能过剩”相关问题的政策立场。文件除前言、结束语外共四章，分别是全面客观看待全球产能和所谓“过剩”、对“产能过剩”相关四对关系的看法立场、中国坚持在开放合作中建设现代化产业体系、共同推动构建开放包容的全球产供链合作格局。文件提出，中方始终认为，看待产能问题，要坚持全面、客观、公正的态度，既要历史地看、也要辩证地看，秉持开放合作、互利共赢，共同化解矛盾和分歧。搞保护主义，只会扰乱全球经贸秩序，不利于全球产供链安全稳定和产业合作健康有序发展，给世界经济增长带来长期风险。(新华社)", "ctime": 1785214904, "time_str": "13:01:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260728/c678482502.shtml"}, {"id": "4818373", "title": "现货黄金失守4040美元/盎司", "content": "现货黄金失守4040美元/盎司，日内跌0.9%。", "ctime": 1785214829, "time_str": "13:00:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260728/c678482486.shtml"}, {"id": "4818365", "title": "俄称莫斯科地区遭大规模无人机袭击", "content": "俄罗斯莫斯科州州长沃罗比约夫当地时间7月28日通报称，过去一夜，数十架乌方无人机在该州多莫杰多沃市等地上空被摧毁。契诃夫市一栋公寓楼被无人机击中，伤亡仍在核实。无人机坠落还造成两处起火及一栋房屋受损，无人受伤。莫斯科市市长索比亚宁同日通报称，27日20时30分至28日6时30分，超过390架乌方无人机飞向莫斯科地区，大部分在远端被压制，81架在接近该市时被摧毁。对此，乌克兰方面暂无回应。（央视新闻）", "ctime": 1785214720, "time_str": "12:58:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260728/c678482475.shtml"}, {"id": "4818361", "title": "《蜘蛛侠：崭新之日》点映及预售总票房突破1亿元", "content": "猫眼专业版数据显示，截至7月28日午间12:30，《蜘蛛侠：崭新之日》点映及预售总票房突破1亿元。根据档期安排，该影片将于7月29日上映。", "ctime": 1785214575, "time_str": "12:56:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260728/c678482445.shtml"}, {"id": "4818359", "title": "花旗：预计短期黄金目标价为4500美元", "content": "花旗表示，基准情形显示，尽管历史上第三季度为季节性备货旺季，印度黄金进口量在第三季度仍将维持低迷。原因在于废料供应充足、消费者情绪谨慎，以及本地价格折价，抑制了新鲜进口需求。不过，花旗仍将0至3个月短期黄金目标价设在4500美元。该行表示，此目标是假设霍尔木兹海峡紧张局势缓和，以及美联储转为较不鹰派；短期仍存在诸多风险可能导致金价再度下探，包括重大再升级、AI驱动的去风险操作，以及美联储持续鹰派立场。", "ctime": 1785214491, "time_str": "12:54:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260728/c678482433.shtml"}, {"id": "4818349", "title": "联合国艾滋病规划署：全球艾滋病防治资金削减23%，恐致疫情卷土重来", "content": "联合国艾滋病规划署发布报告指出，2025年全球新增艾滋病病毒感染者120万，死亡人数超57万，均为30多年来最低水平。但国际资金削减及预防和社区服务经费减少可能使疫情卷土重来。全球发展援助总额减少23%，艾滋病防治资金降至近20年最低，从2024年的88亿美元降至2025年的73亿美元。若不采取紧急行动，到2030年全球每年新增艾滋病病毒感染者可能超过300万。（新华社）", "ctime": 1785214297, "time_str": "12:51:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260728/c678482390.shtml"}, {"id": "4818309", "title": "国家发改委：我国将积极开辟中欧班列多式联运新线路", "content": "在今天（28日）举行的国家发展改革委专题新闻发布会上，国家发展改革委有关负责人表示，“十五五”时期，将推动中欧班列完善运输组织服务、拓展多元韧性通道，助力班列高质量发展。有关负责人表示，“十五五”时期，我国将持续优化中欧班列运输组织模式，提高通关便利化水平，增强全程时效稳定性。稳步扩大全程时刻表班列开行范围，强化多种运输方式高效衔接。高质量建设集结中心，推动“枢纽对枢纽”开行，加快完善集疏运体系。国家发改委开放司司长梁林冲介绍，将有效统筹铁路、公路、海运、航空等多种运输方式，积极开辟多式联运新线路，进一步完善通道网络。深化同沿线国家战略对接，共同推进基础设施互联互通，提升重点口岸综合作业能力，统筹优化沿线枢纽节点布局，推进规则、规制、标准对接互认。（央视新闻）", "ctime": 1785213647, "time_str": "12:40:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260728/c678482156.shtml"}, {"id": "4818295", "title": "宇瞳光学：公司MT插芯产品尚处于送样阶段", "content": "宇瞳光学在互动平台表示，目前康宁GlassBridge玻璃桥处于提供样品，进行工程验证和可靠性测试阶段，行业预测离大规模量产交付时间最快不低于一年，未对当前FAU方案市场造成影响。公司MT插芯产品尚处于送样阶段，验证周期较长。", "ctime": 1785213278, "time_str": "12:34:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260728/c678482016.shtml"}, {"id": "4818283", "title": "国家发改委：中欧班列为国际产业链供应链稳定提供重要支撑", "content": "在今天举行的国家发展改革委专题新闻发布会上，国家发展改革委有关负责人表示，面对复杂多变的国际环境，中欧班列充分发挥全天候、大运量、高时效、绿色低碳的独特优势，始终保持安全稳定运行，为畅通亚欧物流通道、保障国际产业链供应链稳定提供了重要支撑。国家发展改革委开放司司长梁林冲介绍，每当面临亚欧间海运航线运行受阻、国际供应链遭受冲击等突发情况，中欧班列就成为国内外企业应对通道危机的重要选择。此外，中欧班列成功开辟跨里海国际运输、经土耳其进入欧洲、经俄罗斯圣彼得堡港到达德国等新运输路径，为企业提供了多元化、韧性强的通道运输服务。此外，中欧班列推动形成“班列+产业”融合生态，显著提升了跨国企业全球资源配置能力，推动西安、成都、重庆、郑州等城市电子信息、装备制造、新能源、跨境电商等产业集群加快发展。（央视新闻）", "ctime": 1785213131, "time_str": "12:32:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260728/c678481960.shtml"}, {"id": "4818267", "title": "新和成新设功能材料公司，含民用航空材料销售业务", "content": "企查查APP显示，近日，新昌新和成功能材料有限公司成立，法定代表人为周贵阳，注册资本为3000万元，经营范围包含：新材料技术研发；生物基材料技术研发；电子专用材料研发；民用航空材料销售等。企查查股权穿透显示，该公司由新和成间接全资持股。（人民财讯）", "ctime": 1785212912, "time_str": "12:28:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260728/c678481882.shtml"}, {"id": "4818263", "title": "光弘科技：液冷服务器相关业务将于下半年逐步进入量产", "content": "光弘科技7月28日在互动平台表示，公司液冷服务器相关业务会于今年下半年逐步进入量产。公司正为此加紧量产场地、产线布设，并针对工艺难点与客户共同进行技术攻关。目前公司已涉及AI服务器中算力板卡、液冷组件、专用电源、等重要部件的生产、测试环节，未来也将进一步拓展服务器整机的组装业务。", "ctime": 1785212775, "time_str": "12:26:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260728/c678481836.shtml"}, {"id": "4818261", "title": "我国启动人工智能大模型IPv6能力提升专项行动", "content": "记者今天（7月28日）从雄安新区了解到，“人工智能大模型IPv6能力提升专项行动”由中央网信办联合北京、上海、浙江、深圳四地网信办，会同5家头部大模型企业在雄安新区共同启动，推动生成式大模型应用，全面支持IPv6，为智能时代筑牢网络根基。当前，基于人工智能大模型的各类应用蓬勃发展，Token流量呈现爆发式增长趋势，对网络承载能力提出了新要求。IPv6凭借海量地址空间、高效路由机制和内生安全能力成为支撑大模型应用的关键底座。这次专项行动为期一年，将着力增强大模型IPv6规模化应用能力，完善大模型IPv6管理规范，提高大模型基础设施IPv6支持水平，推动大模型应用IPv6放量引流，提升大模型API调用IPv6访问占比，推进大模型与IPv6融合创新，促进互联网向原生智能演进。今天还正式启动了雄安新区IPv6单栈部署行动。雄安新区将全面推进单栈IPv6部署，从夯基础、广赋能、强攻关、育生态四个维度协同发力，到2030年新建片区将全面实现IPv6单栈规模化运行。（央视新闻）", "ctime": 1785212759, "time_str": "12:25:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260728/c678481827.shtml"}, {"id": "4818259", "title": "生益科技松山湖第二工厂项目正式动工", "content": "7月28日，总投资约52亿元的生益科技松山湖第二工厂项目正式动工。项目聚焦AI服务器高频高速材料、智能汽车电子基材、高端封装基板材料等前沿领域，建成后将年产4800万平方米高性能覆铜板、1亿米商品粘结片。（东莞发布）", "ctime": 1785212704, "time_str": "12:25:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260728/c678481803.shtml"}, {"id": "4818257", "title": "六部门发布通告：禁止涉军队退役报废装备销售活动", "content": "中央军委后勤保障部、中央军委装备发展部、中央军委政法委员会、公安部、国家市场监督管理总局、国家国防科技工业局于7月23日发布《关于禁止涉军队退役报废装备销售活动的通告》。通告指出，严禁任何单位和个人销售军队退役报废装备，严禁生产、改装或利用退役报废装备拆解件等拼装、组装，且销售足以使公众视为军队装备的仿制品，严禁以任何形式进行军队退役报废装备和足以使公众视为军队装备的仿制品商业营销宣传。相关职能部门要密切配合，加强对涉军队退役报废装备市场销售和商业营销宣传活动的常态化监督检查。对危及社会公共安全、军事秘密安全等，以及违反有关法律规定的，依法依规严肃查处；构成犯罪的，依法追究刑事责任。（央视新闻）", "ctime": 1785212641, "time_str": "12:24:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260728/c678481783.shtml"}, {"id": "4818255", "title": "香港特区政府与国家工信部签署《关于推进部港共建制造业创新中心的合作协议》", "content": "香港特区政府与国家工业和信息化部今日在特区政府总部签署《关于推进部港共建制造业创新中心的合作协议》。《合作协议》旨在切实推进双方于2024年9月签署的《关于发展新质生产力推进新型工业化的合作协议》，深化内地和香港产业合作，促进香港更好融入和服务国家发展大局，共同支持在香港建设制造业创新中心。创新科技及工业局局长孙东表示，今年的财政预算案已建议预留资金，在港建设首个境外的国家制造业创新中心，目标是促进关键技术突破、推动成果产业化，以及汇聚国际人才。就此，香港特区政府支持由香港微电子研发院基于现有基础，承担牵头营运创新中心的重任。此举将配合国家的技术与产业规划重点，并在香港现有的半导体生态系统基础上发挥独特优势。（大湾区之声）", "ctime": 1785212594, "time_str": "12:23:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260728/c678481764.shtml"}, {"id": "4818245", "title": "上海国投公司与中国进出口银行上海分行签署战略合作备忘录", "content": "7月27日，上海国投公司与中国进出口银行上海分行签署战略合作备忘录，双方将深化国有资本与政策性金融战略联动，聚焦政策性金融产品支持重点战略项目等领域探索投贷协同新模式，合力培育新质生产力。", "ctime": 1785212274, "time_str": "12:17:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260728/c678481633.shtml"}, {"id": "4818241", "title": "2026年APEC林业部长级会议今天在深圳开幕", "content": "今天（7月28日）上午，2026年亚太经合组织（APEC）林业部长级会议在深圳正式开幕。这是亚太经合组织时隔15年再次在中国举办生态领域专业会议。会议期间，来自APEC21个经济体及有关国际组织的高级别代表、专家学者，分享森林资源保护、可持续利用、生态产品价值实现、科技赋能等方面的政策机制、实践经验，共同探讨加强区域林业合作的新路径、新举措。此次会议的主题是“增强亚太森林韧性 共享全民生态福祉”。数据显示，亚太地区森林面积占全球一半以上，贡献了全球约60%的林产品生产和约40%的林产品贸易。（央视新闻）", "ctime": 1785212020, "time_str": "12:13:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260728/c678481495.shtml"}, {"id": "4818223", "title": "零跑汽车成立精密制造公司，含智能机器人的研发业务", "content": "企查查APP显示，近日，湖州凌昇精密制造有限公司成立，法定代表人为巫存，注册资本为2.1亿元，经营范围包含：汽车零部件及配件制造；电子元器件制造；电动机制造；工业机器人制造；智能机器人的研发等。企查查股权穿透显示，该公司由零跑汽车旗下浙江凌昇动力科技有限公司全资持股。（人民财讯）", "ctime": 1785211654, "time_str": "12:07:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260728/c678481298.shtml"}, {"id": "4818215", "title": "英伟达参与得克萨斯州一处价值500亿美元的数据中心租赁项目", "content": "英伟达参与得克萨斯州一处价值500亿美元的数据中心租赁项目，该数据中心将采用英伟达芯片。", "ctime": 1785211392, "time_str": "12:03:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260728/c678481177.shtml"}, {"id": "4818209", "title": "康诺亚-B：CMG901全球III期临床获积极顶线结果，OS改善具统计学显著性", "content": "康诺亚-B公告，公司与AstraZeneca合作的CMG901（AZD0901）全球III期临床试验CLARITY-Gastric01取得积极顶线结果。与研究者选择的治疗方案相比，CMG901在二线及后线CLDN18.2阳性晚期胃癌患者中展现出具有统计学显著性且极具临床意义的总生存期（OS）改善。试验达到了三线及后线治疗OS双重主要终点及二线及后线治疗整体试验人群OS关键次要终点；PFS呈现改善趋势但未达统计学显著性。安全性特征与已知一致，未发现新安全信号。", "ctime": 1785211278, "time_str": "12:01:18", "stock_code": "", "stock_nam const META     = {"update_time": "2026-07-28 14:07:01", "sentiment_score": 56.2200956937799, "agents": []};

// 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
