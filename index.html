"12:25:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260708/c678031862.shtml"}, {"id": "4673977", "title": "海通国际张忆东：压力进一步释放后AI行情有望重回上行", "content": "海通国际首席经济学家张忆东7月8日表示，6月下旬美联储议息会议之后，加息预期升温，美元持续走强，上半年结束前围绕业绩基准的配置再平衡，这些因素叠加上META算力事件引发的AI需求担忧，最终导致7月初全球AI科技股大幅震荡调整。张忆东认为，AI行情调整的时间还不够充分，仍需要以时间换空间释放风险。当前全球主要股市尚未充分price in强势美元的影响以及高通胀黏性、美联储加息预期的影响，另外，微观流动性方面，AI行情交易过度拥挤的情况、AI相关股权和债权融资压力都需要时间缓解。从调整空间上看，短期大幅下跌后，美元、油价通胀和微观拥挤等三重扰动风险得到初步释放，仍未完全消化，后续AI行情有望从急跌转向震荡拉锯、分化缓跌，同时消费及红利资产等避险资产获得短期强势，但是，待压力进一步释放后，AI行情仍有望重回上行。（人民财讯）", "ctime": 1783484676, "time_str": "12:24:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260708/c678031845.shtml"}, {"id": "4673971", "title": "韩国综指跌幅扩大至4%", "content": "韩国综指跌幅扩大至4%，现报7349.87点。个股方面，三星电子跌超4%，SK海力士跌超1%。", "ctime": 1783484468, "time_str": "12:21:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260708/c678031820.shtml"}, {"id": "4673959", "title": "民政部：我国三级养老服务网络建设取得初步成效", "content": "民政部有关负责人介绍，截至2025年年底，我国养老机构和设施数量已达39.6万个，其中养老机构护理型床位占比达67.5%。县级公办养老机构基本实现全覆盖，约30%具备县级综合养老服务管理平台功能，60%以上的乡镇（街道）建有区域养老服务中心。城市嵌入式社区养老服务中心、农村邻里互助点和农村幸福院等设施不断增多，专业化、连锁化、品牌化养老服务经营主体逐步培育壮大，各地三级养老服务网络建设取得初步成效。（央视新闻）", "ctime": 1783483992, "time_str": "12:13:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260708/c678031690.shtml"}, {"id": "4673957", "title": "“巴威”趋向我国，交通运输部启动台风四级防御响应", "content": "今年第9号台风“巴威”（超强台风级）的中心今天早晨5时位于台湾基隆市东偏南方向约1650公里的洋面上，中心附近最大风力有17级（60米/秒），中心最低气压为920百帕，七级风圈半径为350至500公里，十级风圈半径280至300公里，十二级风圈半径100至150公里。预计，“巴威”将以每小时20至25公里的速度向偏西方向移动，今天夜间逐渐转向西北方向移动，强度变化不大，逐渐趋向台湾以东洋面。根据防御台风有关预案和工作程序要求，交通运输部决定于7月8日9时启动台风四级防御响应。（人民财讯）", "ctime": 1783483900, "time_str": "12:11:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260708/c678031683.shtml"}, {"id": "4673951", "title": "伊朗伊斯兰革命卫队称打击美军85处军事设施", "content": "当地时间8日，伊朗伊斯兰革命卫队发表声明称，美军当天凌晨对伊朗霍尔木兹甘省沿海地区和马赫沙赫尔的部分沿海基地及非军事设施发动空袭，违反停火协议，并违反《伊斯兰堡谅解备忘录》。声明称，作为对此次袭击的初步回应，伊朗伊斯兰革命卫队海军和航空航天部队实施联合导弹和无人机行动，对位于萨勒曼港、美海军第五舰队巴林总部以及科威特阿里·萨利姆空军基地的85处美军重要军事设施实施打击，并击落一架试图干预行动的MQ－9型无人机。（央视新闻）", "ctime": 1783483796, "time_str": "12:09:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260708/c678031670.shtml"}, {"id": "4673949", "title": "国台办：民进党当局无底线“媚美卖台”换来得寸进尺", "content": "7月8日，国务院台办举行例行新闻发布会，有记者就美国总统特朗普近期再度点名台湾半导体产业提问。发言人陈斌华表示，民进党当局无底线“媚美卖台”，换来的不过是美国得寸进尺、吃干榨净，台积电一旦变成“美积电”，将带动上下游人才、技术、资金整体外迁，成为台湾产业“压死骆驼的最后一根稻草”，受伤害的将是广大台湾民众。（央视新闻）", "ctime": 1783483783, "time_str": "12:09:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260708/c678031667.shtml"}, {"id": "4673941", "title": "美国撤销60天出口豁免 伊朗浮于海上的石油前途未卜", "content": "美国取消一项允许伊朗伊斯兰共和国出售原油的豁免，这导致数千万桶已装载在油轮上的伊朗石油陷入了进退两难。据媒体基于Vortexa数据计算得出的结论，目前约有6300万桶伊朗原油处于海上，有的在运输途中，有的则处于待命状态。这些原油分布在波斯湾及亚洲海域的船只上。其中大多数船只没有显示明确目的地，或者显示“待售”状态，这意味着尚未找到买家。美国的豁免是华盛顿和德黑兰之间临时和平协议的一部分，于6月下旬发布，给予伊朗60天时间出售石油而不受美国制裁。但为了报复伊朗在霍尔木兹海峡袭击油轮，美国撤销了豁免。（新浪财经）", "ctime": 1783483497, "time_str": "12:04:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260708/c678031541.shtml"}, {"id": "4673925", "title": "港股午评：恒生指数涨2.38%，恒生科技指数涨4.34%", "content": "港股午间收盘，恒生指数涨2.38%，恒生科技指数涨4.34%。恒指港股通ETF银华（159318）涨2.29%，港股通科技ETF鹏华（159751）涨3.55%。板块方面，能源设备与服务、半导体产品与设备板块涨幅靠前；生命科学工具板块跌幅靠前。个股方面，智谱涨17.95%，深演智能涨15.96%，芯碁微装涨14.29%，华勤技术涨13.8%，基本半导体涨13.22%；埃斯顿跌13.39%，领益智造跌9.17%，科伦博泰生物跌7.39%，溜溜梅跌7.02%，亮晴控股跌6.65%。", "ctime": 1783483271, "time_str": "12:01:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260708/c678031519.shtml"}, {"id": "4673913", "title": "南向资金净买入超100亿港元", "content": "据同花顺iFinD数据，截至目前，南向资金净买入超100亿港元，其中港股通（沪）买入超48.45亿港元，港股通（深）买入超51.85亿港元。", "ctime": 1783483131, "time_str": "11:58:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260708/c678031480.shtml"}, {"id": "4673903", "title": "南向资金净买入超90亿港元", "content": "据同花顺iFinD数据，截至目前，南向资金净买入超90亿港元，其中港股通（沪）买入超43.40亿港元，港股通（深）买入超46.96亿港元。", "ctime": 1783482592, "time_str": "11:49:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260708/c678031395.shtml"}, {"id": "4673895", "title": "强降雨持续 交通运输部部署广西抢险救灾工作", "content": "7月4日以来，广西中东部和南部持续出现暴雨到大暴雨，局地特大暴雨，累计降水量100～400毫米，局地达900毫米以上。中央气象台预计，7月8日14时至9日14时，广西上述地区还将有大到暴雨，南部局地大暴雨（100～220毫米）。7月8日，交通运输部视频调度广西、广东、辽宁省(区)交通运输厅，要求保持高度警惕，紧盯强降雨密集地区和连续降雨高风险区域，加强调度，完善工作机制，压实各方责任，督促“响应、巡查、管控”主动防御措施落实，坚决防范遏制重特大事故发生。调度强调，要切实做好广西受灾地区抢险救灾工作，重点做好交通运输领域防汛工作，优先保障广西防汛抢险人员、防汛救灾物资运输，做好灾害损毁路段的抢通保通。（人民财讯）", "ctime": 1783482238, "time_str": "11:43:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260708/c678031310.shtml"}, {"id": "4673893", "title": "聚焦政务平台适老化服务建设，首个国家标准发布", "content": "记者今天了解到，市场监管总局（国家标准委）近日批准发布《政务服务平台适老化服务建设指南》国家标准。该标准是我国政务服务领域首个聚焦平台适老化服务建设的标准，标志着政务服务平台适老化服务迈入标准化建设新阶段。该标准通过总结提炼地方政务服务适老化改造的典型经验与成熟做法，以“易用性、包容性、无障碍、安全性”为核心原则，构建了普惠包容、合规安全、触手可及的适老化服务建设指导框架。（央视新闻）", "ctime": 1783482234, "time_str": "11:43:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260708/c678031309.shtml"}, {"id": "4673885", "title": "多位“果链”企业人士：预计苹果折叠机可正常交付 “没听说”产品延期发售", "content": "近期有市场传闻称，苹果首款折叠机产品或因产品组装复杂、良率较低等原因延期发售。对此，财联社记者采访多位苹果链企业人士获悉，苹果折叠机产品方案早已确定，目前相关企业已进入生产旺季，相关产品正常量产中。多位人士还表示，9月交付应该“没问题”，对于产品延期传闻发售，则表示“没听说”。（财联社）", "ctime": 1783481812, "time_str": "11:36:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260708/c678031028.shtml"}, {"id": "4673879", "title": "A股午评：科创50指数“V形回升”半日大涨3% 算力租赁、AI服务器方向集体爆发", "content": "A股三大指数早盘集体上涨，截至午盘，上证指数涨0.52%，深证成指涨0.08%，创业板指涨0.95%，北证50跌0.71%，科创50指数涨3.13%。全市场成交额17155亿元，较上日放量736亿元，全市场超3400只个股下跌。板块题材上，油气开采及服务、贵金属、云计算、计算机设备、算力租赁、旅游及酒店、半导体、软件开发板块涨幅居前；能源金属、电池、电机、工程机械、猪肉、光伏设备、人形机器人概念股跌幅居前。盘面上，半导体板块盘初探底后快速回升，灿芯股份20cm涨停，华虹宏力、盛科通信等股创历史新高。算力租赁板块表现强势，网宿科技、深信服收获20cm涨停，浪潮信息公布业绩预告后一字涨停，数据港、云赛智联等股同样涨停。贵金属板块盘中拉升，招金黄金封板，晓程科技、赤峰黄金跟随上涨，此前中国央行连续20个月增持黄金。此外，油气开采、软件开发、旅游及酒店等板块均有表现。另一方面，新能源产业链早盘下跌，锂矿、能源金属方向领跌，融捷股份跌停，盛新锂能、天齐锂业、永杉锂业跌幅居前。人形机器人概念股表现不佳，日发精机、埃斯顿盘中跌停，绿的谐波大跌10%。", "ctime": 1783481530, "time_str": "11:32:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260708/c678030852.shtml"}, {"id": "4673873", "title": "ETF午评：云计算ETF领涨6.98%，机器人ETF领跌4.66%", "content": "ETF午间收盘涨跌不一，云计算ETF（159890）领涨6.98%，云计算50ETF（560660）涨6.65%，大数据ETF（515400）涨6.22%，机器人ETF（159278）领跌4.66%，机器人ETF（159530）跌4.28%，机器人ETF（159050）跌4.23%。", "ctime": 1783481456, "time_str": "11:30:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260708/c678030820.shtml"}, {"id": "4673871", "title": "超4.5亿元消费补贴 2026年全国暑期文化和旅游消费季启动", "content": "7月8日，文化和旅游部在青海举办2026年全国暑期文化和旅游消费季主场活动，正式启动2026年全国暑期文化和旅游消费季，组织各地围绕暑期推出特色文旅活动和惠民措施，提高应季文旅产品和服务供给质量，更好满足广大居民游客夏季出游及文旅消费需要。此次暑期文旅消费季时间从7月初持续至8月底，文化和旅游部协同有关部门、企业、平台在活动期间推出涵盖观光、避暑、出行、观赛等多方面的惠民措施。主场活动上：体育总局发布“跟着赛事去旅行”2026暑期全国青少年赛事活动目录；中国民航局发布民航暑运及文旅惠民举措；中国气象局发布暑期避暑地图及观星指南；中国银联推出景区门票立减，酒店民宿消费券等支付优惠活动。暑期文旅消费季期间，各地将围绕消夏避暑、滨海度假、夜间经济、游轮游艇、亲子游乐、研学旅行、非遗美食、博物馆游等热点需求，增加优质文旅产品供给，举办超3万场次文旅消费活动，发放超4.5亿元消费券等消费补贴，助力居民游客欢度暑期时光，畅享美好旅途。（央视新闻）", "ctime": 1783481429, "time_str": "11:30:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "htt     el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
