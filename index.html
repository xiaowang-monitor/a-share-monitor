const NEWS     = [{"id": "4633029", "title": "福建向金门供水累计突破5000万吨", "content": "7月1日，福建向金门供水累计突破5000万吨。2026年以来，工程日均供水约2.2万吨，保障了金门民生生活、产业生产、生态补水全方位用水需求，让“两岸一家亲、共饮一江水”的民生福祉落地见效、温暖人心。 工程运营单位、福建水投集团晋金供水有限公司总经理洪佳兴介绍，近8年持续安全稳定供水，福建优质水源已成为金门供水体系的核心支柱，终结了金门长期缺水、用水紧缺的历史难题。最新用水数据统计显示，当前金门县自来水厂总配水量中，福建引水占比达87%，工程供水水质合格率常年稳定保持100%。 据介绍，稳定可靠的供水极大缓解了金门地区地下水过度开采的压力。金门民生用水对地下水依赖度从历史最高值68%降至如今的0.3%，日均减少地下水抽取量达13385吨。全新的供水体系有效遏制地下水位持续下降、海水倒灌等突出生态隐患，助力当地水资源循环利用与生态环境良性发展，为金门农业生产、文旅产业发展补齐用水短板、注入发展动能，切实提升金门民众获得感、幸福感与安全感，让两岸融合发展成果实实在在惠及金门乡亲。 洪佳兴说，通水以来，福建向金门供水工程已累计接待台胞参观游学100余批次，接待总量超3000人次。广大台胞现场观摩交流，直观感受大陆惠台利民举措，深刻体悟两岸同根同源、同文同种。 福建向金门供水工程是两岸民生领域合作典范，工程2015年10月开工建设，2018年8月正式通水运行。(新华社)", "ctime": 1782892269, "time_str": "15:51:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260701/c677866165.shtml"}, {"id": "4633011", "title": "数百万辆特斯拉HW3迎来FSD V14，中国车型是否同步升级？官方客服：目前仅适配AI4硬件部分车型", "content": "6月30日，特斯拉向HW3车型推送FSDV14Lite，先给早期访问计划用户，未来几周扩大范围。向特斯拉中国官网客服咨询，搭载HW3硬件的车辆未来是否支持相关辅助驾驶功能升级时客服回复称，目前特斯拉辅助驾驶功能仅适配搭载AI4硬件（即HW4）的部分车型。“搭载AI4硬件的ModelS、ModelX、2020至2024款ModelY及部分现款Model3车型已开放适配，现款ModelY和ModelYL暂未开放适配。当前，特斯拉正根据国家近年来发布的相关法规要求，积极推进辅助驾驶软件的相关准备工作。”上述客服表示。这意味着，虽然海外HW3车型已开始获得FSDV14Lite更新，但中国市场HW3车型未来能否同步支持相关升级，目前官方尚未明确。（每经网）", "ctime": 1782892117, "time_str": "15:48:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260701/c677866034.shtml"}, {"id": "4633009", "title": "爱尔兰接任欧盟轮值主席国", "content": "当地时间7月1日，爱尔兰正式接任欧盟轮值主席国，为期六个月。爱尔兰政府公布的主席国计划显示，在未来六个月任期内，将围绕竞争力、价值观和安全三大支柱推进欧盟政策议程，重点推动提升欧盟竞争力、加强安全与韧性、推进下一份多年期财政框架谈判，并继续支持欧盟数字化转型和绿色转型等重点工作。欧盟轮值主席国，又称欧盟理事会主席国，负责欧盟理事会的日常运行，由欧盟成员国轮流担任，任期六个月。（央视新闻）", "ctime": 1782892084, "time_str": "15:48:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260701/c677865993.shtml"}, {"id": "4632993", "title": "先导基电成立启芯科技公司 含电子元器件业务", " 量化私募召开座谈会，就量化管理人的基本情况与经营现状、主要策略特征与迭代方向、合规展业情况、行业风险情况等方面内容进行交流。量化私募相关人士透露，此次座谈会不仅涉及头部量化私募当前规模及近一年变化，投研、交易人员规模与配置等基本情况，还关注了多项今年以来量化私募的最新变化。比如，各家量化私募主推策略容量上限判断、应对因子同质化的差异化措施等。在风险层面，座谈会还涉及了DMA或收益互换等杠杆工具使用情况及杠杆倍数、极端行情下各家私募的风控机制以及同质化交易引发的流动性风险等内容。（上证报）", "ctime": 1782891505, "time_str": "15:38:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260701/c677865602.shtml"}, {"id": "4632951", "title": "外交部：“台独”分裂逆流而动 不得人心注定失败", "content": "7月1日，外交部发言人郭嘉昆主持例行记者会。有记者问：据报道，针对洪都拉斯外交部近日称未同台讨论“复交”及中方回应，台湾外事部门发言人称，台对“重启”同洪关系持开放态度，不预设前提。请问中方对此有何评论？郭嘉昆表示，我们注意到洪都拉斯政府此前已就相关问题作出澄清，让赖清德当局的“谎言外交”暴露无遗。我要强调的是，“台独”分裂逆流而动，不得人心，注定失败。中方愿在一个中国原则基础上，推动中国与洪都拉斯的关系不断向前发展，更好惠及两国人民。（央视新闻）", "ctime": 1782891273, "time_str": "15:34:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260701/c677865476.shtml"}, {"id": "4632949", "title": "外交部：巴拉圭政府和领导人应早日站到历史正确的一边", "content": "7月1日，外交部发言人郭嘉昆主持例行记者会。法新社记者提问，巴拉圭外交部长昨日表示，只要不必中断与台湾地区的联系，巴拉圭对与中国开展贸易持开放态度。外交部对此有何评论？“中方已经多次就有关问题阐明立场。”郭嘉昆表示，巴拉圭政府和领导人应该顺应历史潮流和人民愿望，早日站到历史正确的一边，站到国际社会绝大多数国家的一边，做出符合本国根本和长远利益的正确的决断，不要再自陷孤立。（澎湃新闻）", "ctime": 1782891226, "time_str": "15:33:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260701/c677865445.shtml"}, {"id": "4632945", "title": "华天科技：公司有存储芯片封测业务，但不涉及基板业务", "content": "华天科技7月1日在互动平台回复称，公司有存储芯片封测业务，但不涉及基板业务。（人民财讯）", "ctime": 1782891131, "time_str": "15:32:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260701/c677865375.shtml"}, {"id": "4632911", "title": "外交部：中方一贯主张对伊单边制裁应早日解除", "content": "7月1日，外交部发言人郭嘉昆主持例行记者会。有记者问：中国如何看待美国解除对伊朗制裁？郭嘉昆表示，中方一贯主张对伊朗的单边制裁应该早日解除，希望美伊双方共同落实好已经签署的谅解备忘录，继续推进谈判，推动伊朗问题早日实现全面政治解决。（央视新闻）", "ctime": 1782890961, "time_str": "15:29:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260701/c677865178.shtml"}, {"id": "4632909", "title": "外交部：中日关系面临严重困难 责任完全在日方", "content": "7月1日，外交部发言人郭嘉昆主持例行记者会。有记者就近期中日经贸关系提问。郭嘉昆表示，中方多次指出，当前中日关系面临严重困难，根源在于日本执政当局在涉及中国台湾和军事安全领域的一系列错误言行，责任完全在日方。我们也想请你问问日本为政者，能否尊重中国核心利益，停止干涉中国内政？能否恪守中日四个政治文件精神，维护中日关系的政治基础和经贸合作的必要环境？能否反思纠错，以实际行动展现推动中日关系重回正轨的诚意？（央视新闻）", "ctime": 1782890828, "time_str": "15:27:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260701/c677865116.shtml"}, {"id": "4632905", "title": "今年上半年西部陆海新通道班列运输货物66万标箱", "content": "记者7月1日从国铁南宁局获悉，今年上半年，西部陆海新通道班列累计运输货物66万标箱，月均运量达11万标箱，运输市场需求维持高位，其中二季度较一季度环比增长3.6%，为促进我国与沿线国家经贸合作、维护全球供应链稳定提供强有力的运输保障。（央视新闻）", "ctime": 1782890803, "time_str": "15:26:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260701/c677865096.shtml"}, {"id": "4632883", "title": "抖音今年已处置超34万个直播间", "content": "抖音直播发布治理公告。2026年以来，平台因违规诱导消费累计处置超34万个直播间，10.4万个账号被采取梯度处罚。平台重点处置诱导未成年人打赏、恶俗PK刺激消费、虚假悲情人设骗赏三类行为，4.4万余个账号被回收直播权限，涉违法犯罪线索将移交主管部门。（21世纪经济报道）", "ctime": 1782890518, "time_str": "15:21:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260701/c677864976.shtml"}, {"id": "4632823", "title": "现货黄金失守3960美元/盎司", "content": "现货黄金失守3960美元/盎司，日内跌1.18%。", "ctime": 1782890119, "time_str": "15:15:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260701/c677864636.shtml"}, {"id": "4632813", "title": "李学军出任伟巴斯特中国区总裁", "content": "7月1日，据伟巴斯特集团官微消息，自2026年7月1日起，李学军正式出任伟巴斯特中国区总裁，负责伟巴斯特中国区车顶系统业务的管理、业务运营和发展。同时，原中国区总裁张丽华将出任伟巴斯特集团全球执行副总裁，负责车顶系统业务的全球销售与市场工作。加入伟巴斯特前，李学军曾担任道依茨中国（DEUTZ China）首席执行官及董事会董事。在此之前，他还曾在北汽集团、梅赛德斯-奔驰中国以及北京现代合资企业担任高级管理职务。（界面新闻）", "ctime": 1782890096, "time_str": "15:14:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260701/c677864618.shtml"}, {"id": "4632807", "title": "2026年1-5月服务贸易逆差6385.6亿元，比上年同期缩小1607.2亿元", "content": "2026年1-5月，我国服务进出口总额30994.8亿元，同比增长6%。其中，出口12304.6亿元，增长15.9%；进口18690.2亿元，增长0.4%。服务贸易逆差6385.6亿元，比上年同期缩小1607.2亿元。主要呈现以下特点：知识密集型服务出口增长较快。1-5月，知识密集型服务进出口13687.4亿元，增长5.4%，占服务进出口总额的44.2%。知识密集型服务出口6677.5亿元，增长12.2%，其中，知识产权使用费、个人文化和娱乐服务出口增长最快，增速分别为64.9%和50.1%。知识密集型服务进口7009.9亿元，下降0.3%。旅行服务出口和运输服务进口增长较快。1-5月，旅行服务出口1885亿元，增长31.3%，在前五大服务出口领域中增速最快；运输服务进口4025.2亿元，增长26.7%，在前五大服务进口领域中增速最快。（商务部）", "ctime": 1782889949, "time_str": "15:12:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260701/c677864566.shtml"}, {"id": "4632679", "title": "软银：对Open AI进行100亿美元后续投资", "content": "据报道，软银表示，对Open AI进行了100亿美元的后续投资。（第一财经）", "ctime": 1782889489, "time_str": "15:04:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260701/c677864077.shtml"}, {"id": "4632665", "title": "三峡枢纽2026年上半年通过量达7664.2万吨", "content": "记者1日上午从交通运输部长江航务管理局获悉，今年1月至6月，三峡枢纽通过量达7664.2万吨。其中，保障2204.67万吨民生物资、69.95万吨重点急运物资过坝。今年上半年，三峡船闸共运行4527闸次，通过船舶1.7万艘次，通过量达7432.5万吨；三峡升船机共运行2129厢次，通过船舶2156艘次，运送旅客32.8万人次，运送旅客人次同比上升13.6%。长江三峡通航管理局相关负责人表示，三峡水运新通道工程已于今年6月8日开工建设，三峡通航管理局将在落实常规管理措施的基础上，从联动控制、过闸调度、水上安全监管、航道维护、重点物资保障、待闸服务等方面采取系列措施，释放通航效能、保障物资流通安全。（新华社）", "ctime": 1782889430, "time_str": "15:03:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260701/c677864045.shtml"}, {"id": "4632643", "title": "A股收评：科创50冲高回落跌2.48% 大金融等传统行业全线走强", "content": "截至收盘，上证指数涨0.44%报4112.45点，深证成指跌0.53%报16119.17点，创业板指跌1.89%报4260.72点，北证50涨1.1%报1264.94点。三市成交额36828亿元，较上一日放量3890亿元。全市场超4300家个股上涨。\n板块题材上，养殖业、保险、证券板块涨幅居前；PCB概念、光纤概念板块跌幅居前。\n盘面上，养殖业板块暴力反弹，天邦食品、益生股份、绿康生化、新五丰、湘佳股份涨停，晓鸣股份涨超10%，立华股份、永顺生物、民和股份、温氏股份、天山生物跟涨。保险板块走高，中国人寿逼近涨停，中国人保、中国太保、中国平安跟涨。证券板块异动走高，国盛证券、华安证券、天风证券涨停，湘财股份、财通证券、财达证券、广发证券、首创证券跟涨。PCB概念冲高回落，快克智能触及跌停，欧克科技、长海股份、瑞华泰、芯碁微装、广合科技跟跌。光纤概念走弱，有研新材、浙江众成触及跌停，昀冢科技、长芯博创、通鼎互联、中天科技、锐科激光跟跌。", "ctime": 1782889367, "time_str": "15:02:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260701/c677864002.shtml"}, {"id": "4632625", "title": "欧洲主要股指开盘多数下跌", "content": "欧洲主要股指开盘多数下跌，欧洲斯托克50指数跌0.1%，英国富时100指数跌0.11%，法国CAC40指数跌0.15%，德国DAX指数涨0.19%。", "ctime": 1782889312, "time_str": "15:01:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260701/c677863976.shtml"}, {"id": "4632589", "title": "十多家酒企原酒被拍卖，价格拍出“可乐价”", "content": "白酒行业的深度调整正在从下游渠道端向上游生产端传导。记者注意到，阿里拍卖等平台上，白酒原酒、基酒司法拍卖案例不断增长，成交价格持续走低，甚至卖出“可乐价”，白酒行业的分化与淘汰仍未见底。记者注意到，在京东和阿里等拍卖平台上，近期原酒拍卖案例明显增多。据不完全统计，2026年以来，已有十多家酒企的原酒被拍卖，但大多多次流拍，拍卖成功的成交价普遍低于评估价。今年5月，京东拍卖平台上，安徽武子古酿酒业因破产拍卖旗下原酒，历经五次流拍后，最终两单原酒低价成交，单价折合500克分别为3.9元和3.7元，与超市可乐价格相仿。（第一财经）", "ctime": 1782889247, "time_str": "15:00:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260701/c677863959.shtml"}, {"id": "4632559", "title": "股指期货午盘收盘 主力合约涨跌互现", "content": "股指期货午盘收盘，主力合约涨跌互现。沪深300股指期货(IF)主力合约跌0.38%，上证50股指期货(IH)主力合约涨0.13%，中证500股指期货(IC)主力合约跌0.55%，中证1000股指期货(IM)主力合约涨0.38%。", "ctime": 1782889218, "time_str": "15:00:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260701/c677863947.shtml"}, {"id": "4632429", "title": "沪深京三市成交额超3.5万亿元，较上日此时放量4072亿元", "content": "据同花顺iFinD数据，沪深京三市成交额超3.5万亿元，较上日此时放量4072亿元，预计全天成交金额约3.7万亿元。截至目前，沪市成交额16157亿元，深市成交额18629亿元，北证50成交额215亿元。", "ctime": 1782888423, "time_str": "14:47:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260701/c677863713.shtml"}, {"id": "4632319", "title": "上期所欧线集运主力合约暴跌11%", "content": "上期所欧线集运主力合约暴跌11%，报2525.5点。", "ctime": 1782887745, "time_str": "14:35:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260701/c677863468.shtml"}, {"id": "4632275", "title": "工信部：1-5月份规模以上电子信息制造业增加值同比增长14.6%", "content": "工信部数据显示，1-5月份，规模以上电子信息制造业增加值同比增长14.6%，增速分别比同期工业、高技术制造业高9.2个和高1.5个百分点。5月份，规模以上电子信息制造业增加值同比增长17%。主要产品中，手机产量5.62亿台，同比下降1.3%，其中智能手机产量4.77亿台，同比增长3.3%；微型计算机设备产量1.19亿台，同比下降12.2%；集成电路产量2286亿块，同比增长25.4%。", "ctime": 1782887496, "time_str": "14:31:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260701/c677863392.shtml"}, {"id": "4632269", "title": "日韩股市收盘涨跌互现", "content": "日经225指数收涨0.59%，报70474.96点。韩国综指收跌2.04%，报8303.41点。", "ctime": 1782887487, "time_str": "14:31:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260701/c677863388.shtml"}, {"id": "4632225", "title": "阳光电源股价一度接近跌停 公司称生产经营未现异常", "content": "7月1日，阳光电源股价低开后继续大幅下跌，盘中一度接近跌停。消息面上，有外媒报道称，特朗普政府正在起草一项针对外国逆变器的进口禁令。原因是担心中国可能利用这些将太阳能项目和电池接入电网的设备来干扰电力供应。据报道，这项规定将适用于新型号的外国逆变器，最早可能于今年发布。财闻以投资者身份致电阳光电源，公司董事会办公室工作人员对此表示，公司内部生产经营一切正常，股价波动的外部诱因尚在核实了解中。对于市场担心的美国拟收紧逆变器进口政策，阳光电源海外业务或承压，上述工作人员对财闻表示，公司在包括美国在内的多个业务落地国家均设有当地子公司，负责属地化运营，但各区域子公司的业绩与人员规模并未对外披露，董办层面也未掌握相关明细数据。（财闻）", "ctime": 1782887317, "time_str": "14:28:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260701/c677863327.shtml"}, {"id": "4632193", "title": "泰国确认其大多数船只已安全驶离霍尔木兹海峡", "content": "据报道，泰国外交部表示，11艘由泰国运营商租用的泰籍船舶中，已有10艘从霍尔木兹海峡安全驶离。该部周二发表的声明称：“目前，仅有一艘名为‘Hatthaya Naree’号的船只仍停泊在霍尔木兹海峡，等待装货，预计将在不久后离开该区域。”（新浪财经）", "ctime": 1782887096, "time_str": "14:24:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260701/c677863274.shtml"}, {"id": "4632129", "title": "半导体设备板块短线走低", "content": "半导体设备板块短线走低，恒运昌跌超13%，芯源微、盛美上海、富创精密、晶升股份等跟跌。", "ctime": 1782886543, "time_str": "14:15:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260701/c677863159.shtml"}, {"id": "4632115", "title": "景林资产“内部信”曝光：核心配置聚焦半导体与AI基础设施", "content": "近日，记者从渠道处获悉，景林资产管理合伙人、CEO高云程在《2026年中给投资者的一封信》中，系统阐述了其对AI产业趋势、全球产业链重构以及当前组合配置方向的最新判断。\n\n高云程认为，过去半年全球资本市场最深层次的变化，并非指数涨跌，而是“智能第一次开始被机器规模化生产出来”。在他看来，AI并不只是一个新的软件工具，而是一场新的工业革命，能源、广义半导体系统、AI大模型、数据中心和应用层正共同构成新的“智能生产体系”。\n\n在这封信中，高云程重点分析了AI对商业模式和估值体系带来的重塑。他表示，过去二十年，全球最优秀的平台公司通常具有轻资产、高ROE、高自由现金流、网络效应强和边际成本极低等特征；但进入AI时代后，智能生成不再“免费”，每一次推理和调用背后都需要算力、存储、网络通信、能源和数据中心支撑，这意味着平台公司正在从“轻资产互联网平台”逐步演变为重资产的“智能工厂”。(上海证券报)", "ctime": 1782886436, "time_str": "14:13:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260701/c677863145.shtml"}, {"id": "4632069", "title": "高盛将阿迪达斯目标价从165欧元上调至185欧元", "content": "高盛将阿迪达斯目标价从165欧元上调至185欧元。", "ctime": 1782886240, "time_str": "14:10:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260701/c677863098.shtml"}, {"id": "4632045", "title": "现货黄金跌超1%", "content": "现货黄金跌超1%，现报3966.34美元/盎司。", "ctime": 1782886089, "time_str": "14:08:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260701/c677863003.shtml"}, {"id": "4632027", "title": "现货黄金跌超1% 纽约期金失守3980美元/盎司", "content": "现货黄金跌超1%，现报3966.34美元/盎司。纽约期金失守3980美元/盎司，日内跌1.51%。", "ctime": 1782886073, "time_str": "14:07:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260701/c677862997.shtml"}, {"id": "4632025", "title": "现货白银日内跌幅扩大至2%", "content": "现货白银日内跌幅扩大至2%，报57.37美元/盎司。", "ct const SECTORS  = [{"name": "金融", "hit_count": 33, "etfs": []}, {"name": "半导体", "hit_count": 27, "etfs": []}, {"name": "数据要素", "hit_count": 24, "etfs": []}, {"name": "人工智能", "hit_count": 23, "etfs": []}, {"name": "消费", "hit_count": 16, "etfs": []}, {"name": "新能源", "hit_count": 11, "etfs": []}, {"name": "军工", "hit_count": 7, "etfs": []}, {"name": "机器人", "hit_count": 6, "etfs": []}];
const META     = {"update_time": "2026-07-01 15:53:45", "sentiment_score": 55.02392344497608, "agents": []};

// 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
