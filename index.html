le": "我国创新药出海再提速 今年对外授权突破1200亿美元", "content": "今年以来，我国创新药出海步伐再提速，对外授权交易总额突破1200亿美元，同比增长36%。其中首付款规模超百亿美元，市场同时呈现单笔平均交易金额稳步增长、首付款金额与占比双双提升、大额交易频频落地的特点，彰显出本土创新药的含金量不断提高。这一数据由国家药监局在14日举行的2026年全国药品安全宣传周启动仪式上发布。国家药监局有关负责人介绍，近年来国家药监局持续深化监管改革，推动医药产业从“量的增长”向“质的飞跃”转型，全链条释放医药创新活力。（新华社）", "ctime": 1789390711, "time_str": "20:58:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260914/c679894706.shtml"}, {"id": "5169269", "title": "2026年上半年德企对华投资同比增长三分之一", "content": "德国经济研究所14日发布分析报告显示，德国企业对华投资继续保持较高水平，2026年上半年新增投资同比增长约三分之一。 报告基于德国央行数据分析说，今年上半年，德企对华新增投资额达到56亿欧元。该研究所此前分析显示，2025年全年，德企对华新增投资额约70亿欧元。 报告说，多数德国企业持续看重中国市场。报告援引中国德国商会的调查说，超过85%的在华德企计划维持或扩大目前业务规模，超半数计划进一步增加投资。 德国经济研究所专家于尔根·马特斯表示，德国企业继续选择在中国投资，一个重要原因是中国不仅是德企重要销售市场，也是其提升自身竞争力的“健身房”。德企在中国市场积累经验，有助于其在全球市场竞争中取得成功。(新华社)", "ctime": 1789390431, "time_str": "20:53:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260914/c679894628.shtml"}, {"id": "5169231", "title": "三星电机与高通据报合作开发有机桥技术", "content": "据报道，三星电机正与高通共同开发用于AI芯片先进封装的“有机桥”技术，双方已开展研发和验证工作超过一年。三星电机还在与其他客户同步开发基于有机桥的2.1D封装基板。据报道，三星电机计划将具有5至7层重新布线层（RDL）的有机桥嵌入FC-BGA基板，目标将线宽和线距缩小至1.5至2微米。该技术被视为英特尔EMIB硅桥封装技术的潜在替代方案。（界面新闻）", "ctime": 1789390289, "time_str": "20:51:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260914/c679894545.shtml"}, {"id": "5169223", "title": "小马智行第四代自动驾驶重卡亮相，将于年内规模量产", "content": "9月14日，小马智行与广汽领程联合打造的L4级自动驾驶重卡在汉诺威国际商用车展（IAA Transportation）首发。该车型基于广汽领程T9纯电重卡打造，为小马智行第四代自动驾驶重卡家族成员之一，计划于今年内实现规模化量产，并投放至干线物流、专线物流及港口运输等场景。新车搭载小马智行第四代L4级自动驾驶卡车系统及广汽领程全冗余线控底盘，配置9颗激光雷达、3颗毫米波雷达和13个摄像头，并采用与第七代Robotaxi相同的域控制器。（界面新闻）", "ctime": 1789390250, "time_str": "20:50:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260914/c679894529.shtml"}, {"id": "5169213", "title": "立航科技：刘随阳拟协议转让15.91%股份", "content": "立航科技公告，控股股东、实际控制人刘随阳于2026年9月14日签署《股份转让协议》，拟将1233.45万股股份协议转让给泓川源善渊和李奔，其中845.93万股占10.91%、387.53万股占5.00%，转让价格均为51.21元/股。本次权益变动尚需取得上交所合规性确认并办理股份过户登记，不涉及公司控制权变更。", "ctime": 1789390213, "time_str": "20:50:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260914/c679894512.shtml"}, {"id": "5169109", "title": "键凯科技：LNP下半年收入需要以实际交付订单情况为准", "content": "在半年度业绩会上，键凯科技介绍，盘锦工厂的产能利用率较去年同期有所提升，除了为天津键凯提供原材料和中间体以外，已经开始向部分新进客户稳定供应终产品。LNP业务方面，公司目前向国内外约200个LNP相关客户供应LNP产品或提供与LNP相关的技术服务，其中绝大多数为国内早期研发阶段的客户，因此下半年相关收入情况需要以实际交付的订单情况为准。目前mRNA领域的需求主要有mRNA疫苗、in vivo CAR、基因编辑等几个方向。除了销售产品，公司还为客户提供定制服务、质量研究、注册申报等配套技术服务。（人民财讯）", "ctime": 1789389683, "time_str": "20:41:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260914/c679894345.shtml"}, {"id": "5169101", "title": "LME三个月期铜跌破每吨14000美元，最新下跌1.8%", "content": "LME三个月期铜跌破每吨14000美元，最新下跌1.8%。", "ctime": 1789389664, "time_str": "20:41:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260914/c679894327.shtml"}, {"id": "5169093", "title": "麦克莫兰铜金美股盘前跌超5%", "content": "麦克莫兰铜金美股盘前跌超5%，现报67.5美元。", "ctime": 1789389623, "time_str": "20:40:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260914/c679894253.shtml"}, {"id": "5169077", "title": "戴尔科技美股盘前跌超5%", "content": "戴尔科技美股盘前跌超5%，现报538.46美元。", "ctime": 1789389553, "time_str": "20:39:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260914/c679893989.shtml"}, {"id": "5169049", "title": "美年健康：实控人一致行动人拟合计减持不超2066.6万股", "content": "美年健康公告，公司实际控制人俞熔的一致行动人通怡桃李3号、通怡桃李12号私募证券投资基金拟自减持预披露公告发布之日起15个交易日后的3个月内，通过集中竞价方式合计减持不超过2066.6万股，占公司总股本的0.53%。其中，通怡3号拟减持不超过 _a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260914/c679892073.shtml"}, {"id": "5168793", "title": "奥瑞德：拟定增募资不超过8.68亿元用于蓝宝石基地及服务器集群建设", "content": "奥瑞德公告，公司拟向不超过35名特定投资者发行A股，募资总额不超过8.68亿元（含本数），扣除发行费用后拟投入内蒙古蓝宝石生产基地建设项目2.82亿元、西部国产服务器集群建设项目3.46亿元，补充流动资金2.4亿元。发行股份数上限为8.25亿股。本次发行相关事项已获董事会审议通过，尚需股东会审议通过、上海证券交易所审核通过并经中国证监会同意注册。", "ctime": 1789388867, "time_str": "20:27:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260914/c679892039.shtml"}, {"id": "5168789", "title": "奥瑞德：子公司拟出售22台服务器，交易价5150万元", "content": "奥瑞德公告，公司全资子公司深圳智算力拟向海南京数出售22台服务器，交易价格为人民币5150万元（含税）。2026年9月14日，公司第十届董事会第三十七次会议审议通过相关议案，交易无需提交股东会审议，不构成关联交易及重大资产重组。", "ctime": 1789388848, "time_str": "20:27:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260914/c679892031.shtml"}, {"id": "5168765", "title": "金橙子：终止筹划购买资产，2026年9月15日复牌", "content": "金橙子公告，公司此前筹划以发行股份及支付现金的方式购买深圳市智博泰克科技股份有限公司控股权并募集配套资金。经交易各方友好协商，因未能就核心条款达成一致，公司决定终止本次交易，双方无需承担违约责任；公司股票将于2026年9月15日开市起复牌，并承诺公告披露之日起1个月内不再筹划重大资产重组。", "ctime": 1789388684, "time_str": "20:24:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260914/c679891992.shtml"}, {"id": "5168759", "title": "誉衡药业：部分董事及高管拟合计减持不超1157.09万股", "content": "誉衡药业公告，公司董事、总经理兼财务负责人国磊峰，副总经理李润宝、王小航，以及董事、副总经理兼董事会秘书刘月寅计划自公告披露之日起15个交易日后的3个月内，通过集中竞价方式合计减持不超过1157.09万股，占公司总股本的0.5189%。其中，国磊峰拟减持不超过1049.5万股，占公司总股本的0.4707%。本次减持原因为个人资金需求，减持期间为2026年10月15日至2027年1月14日。本次减持计划实施不会导致公司控制权发生变更。", "ctime": 1789388591, "time_str": "20:23:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260914/c679891946.shtml"}, {"id": "5168743", "title": "甲骨文美股盘前跌超5%", "content": "甲骨文美股盘前跌超5%，现报142.639美元。", "ctime": 1789388510, "time_str": "20:21:50", "stock_code": "", "stock_name": s_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260914/c679891840.shtml"}, {"id": "5168645", "title": "约旦发生氨气泄漏事件11人中毒", "content": "约旦亚喀巴经济特区管理局环境与公共安全事务专员尼达勒·乌兰14日证实，亚喀巴工业综合体内一日本企业发生氨气泄漏事件，造成11人中度或轻度中毒。目前，泄漏情况已得到控制。（新华社）", "ctime": 1789387903, "time_str": "20:11:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260914/c679891783.shtml"}, {"id": "5168589", "title": "美光科技美股盘前跌超6%", "content": "美光科技美股盘前跌超6%，现报916.52美元。", "ctime": 1789387499, "time_str": "20:04:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260914/c679891665.shtml"}, {"id": "5168587", "title": "雷赛智能：子公司拟900万元增资三思传动", "content": "雷赛智能公告称，为把握市场机遇，响应并满足公司战略布局及机器人零部件行业相关客户的需求，积极拓展与优化公司机器人全链条业务布局，公司全资子公司雷智赋能拟以增资扩股方式投资三思传动科技(常州)有限公司，投资金额900万元，增资完成后持有标的公司20%股权", "ctime": 1789387493, "time_str": "20:04:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260914/c679891663.shtml"}, {"id": "5168523", "title": "芬兰决定加入法国“前沿威慑”计划", "content": "法国总统府爱丽舍宫14日发表声明说，芬兰当天决定加入法国总统马克龙提出的“前沿威慑”计划。 声明说，芬兰决定加入法国“前沿威慑”计划，两国将在未来几个月内成立一个核事务指导小组，启动相关合作。 芬兰总统斯图布当天在社交媒体发文说，法国这项计划不会取代或与北约的核威慑重叠。他还说，芬兰无意在和平时期在其领土部署核武器。 3月2日，马克龙在法国西部长岛军事基地就法国的核威慑政策发表讲话，称未来法国不仅要增加核弹头数量，还要和欧洲其他国家执行“前沿威慑”计划。他宣布已有德国、英国、波兰、荷兰、比利时、希腊、瑞典和丹麦同意参与该计划。马克龙说，这一计划为伙伴国提供参与核威慑演习的机会，在某些情况下能让法国“在盟友国家中部署战略核力量”。(新华社)", "ctime": 1789387271, "time_str": "20:01:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260914/c679891389.shtml"}, {"id": "5168403", "title": "*ST东智：拟2748.87万元出售赛孚机械70%股权", "content": "*ST东智公告，为优化经营及聚焦主业发展，公司拟将持有的南通赛孚机械设备有限公司70%股权转让给江苏巍赛重工有限公司，交易对价为2748.87万元，全部以现金方式支付。交易完成后，公司将不再持有赛孚机械股权，赛孚机械不再纳入公司合并报表范围。本次交易无需提交公司股东会审议，不构成关联交易及重大资产重组。", "ctime": 1789387142, "time_str": "19:59:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260914/c679891286.shtml"}, {"id": "5168375", "title": "《人工智能安全治理框架3.0》发布", "content": "9月14日，在2026年国家网络安全宣传周开幕式上，全国网络安全标准化技术委员会发布《人工智能安全治理框架3.0》。为应对人工智能发展新趋势、回应安全治理新挑战，在国家互联网信息办公室的指导下，网安标委组织中国网络空间研究院、国家互联网信息办公室数据与技术保障中心等专业机构、科研院所、行业企业，研究编制了《框架3.0》。《框架3.0》秉持以人为本、向上向善理念，坚持和践行强化风险意识、确保安全可控的指导原则，延续“风险分类、技术应对、综合治理”的核心逻辑，与时俱进梳理更新了风险分类，优化调整了技术应对和综合治理措施，以促进提升人工智能安全治理共识和风险防范应对能力，确保人工智能技术造福于人类。（新华社）", "ctime": 1789386973, "time_str": "19:56:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260914/c679891249.shtml"}, {"id": "5168363", "title": "佩斯科夫：欢迎任何呼吁停止打击民用设施的倡议", "content": "当地时间9月14日，俄罗斯总统新闻秘书佩斯科夫在例行简报会上回应了美国总统特朗普关于要求乌方停止打击俄燃料设施以保障供应的表态。佩斯科夫称，俄方目前实施石油产品出口禁令，以稳定国内供应。在波斯湾局势升级背景下，此举对国际市场有显著影响。俄国内市场恢复后，相关出口禁令的取消才会被提上议程。当被问及特朗普这一要求是否是解决冲突的积极一步时，佩斯科夫称，任何呼吁基辅政权停止打击民用经济基础设施的倡议都应受到欢迎。当被问及如果乌克兰同意特朗普这一要求，俄方是否也准备避免打击乌克兰部分经济基础设施，佩斯科夫拒绝回答。（央视新闻）", "ctime": 1789386856, "time_str": "19:54:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260914/c679891171.shtml"}, {"id": "5168341", "title": "沙特王储兼首相会见美军中央司令部司令 讨论地区最新局势", "content": "当地时间14日，沙特王储兼首相穆罕默德在吉达会见了美军中央司令部司令布拉德·库珀及其随行代表团。双方回顾了双边关系，并就地区最新局势发展进行了讨论。（央视新闻）", "ctime": 1789386591, "time_str": "19:49:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260914/c679890880.shtml"}, {"id": "5168337", "title": "中老“和平列车-2026”人道主义医学救援联合演习圆满落幕", "content": "老挝当地时间9月14日10时许，中老“和平列车-2026”人道主义医学救援联合演习完成各项预定演练课目，在老挝万象圆满落下帷幕。此次联演以“超强台风灾害国际人道主义医学救援”为课题，突出指挥筹划深度融合、灾害救援全链贯通、多域力量协同联动，设置三级指挥和四级救援体系。中老双方参演分队依托卫生列车、无人智能战救器材等装备，连贯展开现场搜救、伤员转运、卫生防疫、心理救援等实战课目，全方位锤炼联合指挥、联合救援、联合保障能力。作为本次联演的最大亮点，首次在“和平列车”系列演习中成体系运用无人机、机器狗、无人车等无人智能设备，同步开展伤员搜寻、转运后送、应急物资投送等多维度保障任务，标志着两军在智能化、体系化应急卫勤救援力量建设上迈出关键一步。（央视新闻）", "ctime": 1789386582, "time_str": "19:49:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260914/c679890878.shtml"}, {"id": "5168329", "title": "闽东电力：公司未开展算电协同、绿电直连业务", "content": "闽东电力公告，公司股票自9月9日起连续4个交易日涨停，涨幅偏离值累计达48.89%，短期涨幅与经营情况明显背离。经公司自查，公司目前经营情况正常，主营业务及基本面未发生重大变化，内外部经营环境未发生重大变化，不存在影响公司股票异常波动的重大事项。公司目前未开展算电协同、绿电直连业务，也未与算力中心、数据中心存在合作；参股海上风电项目均处于未开工或未投产状态，预计2026年度不会产生收入和利润。", "ctime": 1789386402, "time_str": "19:46:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260914/c679890738.shtml"}, {"id": "5168311", "title": "券商及个人廉洁从业细则拟修订 禁止券商以“渠道费”进行利益输送", "content": "记者获悉，中证协正就《证券经营机构及其工作人员廉洁从业实施细则》向券商征求意见。修订稿要求，券商须在第三方服务协议中明确约定交付成果、验收标准、服务时限、费用标准及反商业贿赂、禁止不正当利益输送等条款，确保服务真实、对价公允、流程可溯、成果可验。同时，禁付费用清单新增“渠道费”，严禁虚增价格、变相馈赠、利益输送或规避监管，对存在廉洁违规行为的第三方机构应当终止合作。（财联社）", "ctime": 1789386324, "time_str": "19:45:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260914/c679890725.shtml"}, {"id": "5168259", "title": "联影医疗“微剂量”DR成像技术亮相", "content": "9月13日，在“微剂量”DR成像技术产学研医研讨会上，联影医疗展示了“微剂量”DR成像技术，将X射线成像系统的噪声模型与神经网络图像处理技术相结合，针对剂量进一步降低时噪声增加的问题进行优化，在保证诊断图像质量的同时进一步降低辐射剂量。同期，苏州大学放射医学与辐射防护国家重点实验室与联影医疗举行联合开放课题签约，并启动“微剂量”DR成像技术产学研医合作，推动相关技术研究与临床应用进一步深化。当日，“微剂量”DR儿童脊柱侧弯筛查公益项目同步启动。（人民财讯）", "ctime": 1789385921, "time_str": "19:38:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260914/c679890262.shtml"}, {"id": "5168253", "title": "奥浦迈：上海磐信拟减持公司不超过3.00%股份", "content": "奥浦迈公告，持股5%以下特定股东上海磐信持有公司股份606.28万股，占公司总股本4.26%，拟于2026年10月14日至2027年1月13日期间，通过大宗交易和集中竞价交易合计减持不超过426.58万股，占公司总股本不超过3.00%，减持原因为自身资金需求。", "ctime": 1789385825, "time_str": "19:37:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260914/c679890219.s // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
