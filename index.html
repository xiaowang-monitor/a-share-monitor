新闻）", "ctime": 1792066045, "time_str": "20:07:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261015/c680745562.shtml"}, {"id": "5400519", "title": "蓝佛安出席2026年二十国集团财长和央行行长第三次会议并举行多场双边会见", "content": "2026年10月15日，二十国集团（G20）主席国美国在泰国曼谷举行今年第三次G20财长和央行行长会议。会议主要就全球宏观经济形势、金融部门发展、G20财金渠道合作进展和工作展望等议题进行了讨论。财政部部长蓝佛安出席会议并发言，副部长廖岷陪同参会。 蓝佛安表示，当前，全球经济增长面临多重挑战，当务之急是要妥善处理好地缘政治冲突、保护主义抬头、碎片化加剧等问题，为全球增长营造良好环境。G20应以宏观政策协调增加确定性，以结构性改革培育新动能，以开放合作做大全球经贸蛋糕，为世界经济强劲、平衡、可持续和包容增长作出积极贡献，并在完善全球治理、应对全球挑战等方面继续发挥引领作用。G20关于全球重大国际经济金融议题的讨论应坚持全面、客观、平衡的原则。中方呼吁各方秉持协商一致精神，充分尊重和照顾彼此合理关切，共同支持主席国办好G20领导人峰会，推动取得平衡务实成果。 (财政部)", "ctime": 1792065717, "time_str": "20:01:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261015/c680745346.shtml"}, {"id": "5400455", "title": "光迅科技：预计2026年前三季度净利润同比增长65.37%～82.26%", "content": "光迅科技公告，预计2026年前三季度归母净利润为11.89亿元～13.1亿元，同比增长65.37%～82.26%；扣非净利润为11.76亿元～12.96亿元，同比增长73.38%～91.09%。2025年前三季度归母净利润为7.19亿元，扣非净利润为6.78亿元。业绩增长主要受全球AI算力资本开支带动数通光模块需求增长，以及国内云服务商持续加大数据中心建设投入影响。", "ctime": 1792065661, "time_str": "20:01:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261015/c680745331.shtml"}, {"id": "5400421", "title": "印度8月份经常账户赤字为52亿美元", "content": "印度8月份经常账户赤字为52亿美元。", "ctime": 1792065638, "time_str": "20:00:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261015/c680745326.shtml"}, {"id": "5400227", "title": "*ST春兴：公司签署重整投资协议，受让价1.23元/股", "content": "*ST春兴公告，公司此前启动庭外重组并公开招募重整投资人。近期，公司分别与产业投资人及财务投资人签署《重整投资协议》，产业投资人受让转增股票价格为1.23元/股，财务投资人为1.28元/股，协议需经股东会审议通过后生效。", "ctime": 1792064918, "time_str": "19:48:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261015/c680745119.shtml"}, {"id": "5400203", "title": "乌海军称袭击俄军用机场 致6架战机受损", "content": "乌克兰海军15日在社交媒体上发文称，乌海军当天凌晨使用“海王星”岸基导弹系统对俄沃罗涅日州鲍里索格列布斯克军用机场发动袭击，导致机场停放的6架俄军苏－34M战机受损。乌海军称，袭击还摧毁了俄军用于保障飞行任务的技术设备。俄国防部当天发布通报称，过去一夜，俄军继续打击乌克兰港口基础设施和船只。在对乌克兰敖德萨州的行动中，俄军打击一处用于装卸和储存乌军物资的港口，以及两艘运送军用物资的干货船。此外，过去一夜，俄防空部队在布良斯克州、别尔哥罗德州、库尔斯克州等多地拦截并击落166架乌克兰无人机。（新华社）", "ctime": 1792064747, "time_str": "19:45:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261015/c680745080.shtml"}, {"id": "5400159", "title": "中华人民共和国政府和多哥共和国政府关于构建新时代中多命运共同体的联合声明", "content": "应中华人民共和国国务院总理李强邀请，多哥共和国部长会议主席福雷·埃索齐姆纳·纳辛贝于2026年10月9日至16日对中国进行正式访问。\n\n访问期间，中华人民共和国主席习近平会见福雷主席，国务院总理李强、全国人民代表大会常务委员会委员长赵乐际分别同福雷主席会谈会见。\n\n双方认为无论国际形势如何变化，中国和多哥始终保持积极稳定的友好合作关系，两国始终团结协作、聚力发展、和衷共济、互利共赢，堪称中非友好和南南合作的卓越范例。(新华社)", "ctime": 1792064532, "time_str": "19:42:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261015/c680745041.shtml"}, {"id": "5400157", "title": "瓦轴B：股票终止上市，2026年10月16日摘牌", "content": "瓦轴B公告，公司于2026年10月9日收到深交所终止上市决定。瓦房店轴承集团有限责任公司全面要约实施完毕后，社会公众持有的公司股份低于公司股份总数的10%，公司股权分布不再具备上市条件。公司股票将于2026年10月16日摘牌，终止上市不适用退市整理期，摘牌后将转入退市板块挂牌转让。", "ctime": 1792064521, "time_str": "19:42:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261015/c680745036.shtml"}, {"id": "5400141", "title": "鹏鼎控股：董事长提议以不低于人民币3亿元且不高于人民币5亿元回购公司股份", "content": "鹏鼎控股公告，公司董事长提议通过集中竞价交易方式回购公司股份，用于股权激励或员工持股计划，回购价格不高于80元/股，资金总额不低于人民币3亿元且不高于人民币5亿元，资金来源为自有资金或自筹资金。公司将根据提议制定回购方案并履行审议程序。", "ctime": 1792064415, "time_str": "19:40:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261015/c680745021.shtml"}, {"id": "5400137", "title": "我国航运业加快智能化绿色化转型", "content": "记者从今天（15日）在上海举行的2026北外滩国际航运论坛新闻发布会上了解到，由上海市人民政府、交通运输部共同主办的论坛将于10月20日至21日举办。本届论坛以“共同的挑战，共同的使命——共促全球航运韧性发展”为主题，将集中发布一批重磅成果，来自全球50多个国家和地区的嘉宾将围绕海上交通安全、金融保险、数字智能、绿色低碳等内容进行讨论。交通运输部介绍，我国航运领域人工智能落地应用与绿色低碳转型持续提速。自动化码头规模和技术水平保持全球领先，绿色燃料加注、零碳码头建设不断取得新突破。（央视新闻）", "ctime": 1792064383, "time_str": "19:39:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261015/c680745016.shtml"}, {"id": "5400133", "title": "华峰化学：预计2026年前三季度净利润同比增长98.42%-118.95%", "content": "华峰化学公告，预计2026年前三季度归属于上市公司股东的净利润为29亿元～32亿元，上年同期为14.62亿元，同比增长98.42%～118.95%；扣除非经常性损益后的净利润为28.2亿元～31.2亿元，上年同期为13.43亿元，同比增长110.01%～132.35%。受产品价格上升、相关产品毛利率提升等因素影响，公司盈利能力增长。", "ctime": 1792064305, "time_str": "19:38:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261015/c680745000.shtml"}, {"id": "5400119", "title": "胡塞武装称15日未对沙特发动任何袭击", "content": "也门胡塞武装当地时间15日下午表示，当天胡塞武装未对沙特发动任何袭击。当日稍早前，沙特阿拉伯主导的多国联军发言人表示，在沙特麦地那地区拦截并摧毁一枚巡航导弹。（央视新闻）", "ctime": 1792064272, "time_str": "19:37:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261015/c680744992.shtml"}, {"id": "5400089", "title": "高盛上调Meta目标价至860美元，预计明年资本开支超2200亿美元", "content": "高盛10月14日将Meta目标价从725美元上调至860美元，维持“买入”评级。该行预计，Meta第三季度营收同比增长24.3%，2027年营收达3126.23亿美元。2027年资本开支预计达到2202.15亿美元，同比增长54.1%，较市场共识高13.1%。高盛认为，AI将继续推动Meta广告收入增长，但巨额投资也将带来成本压力。", "ctime": 1792064074, "time_str": "19:34:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261015/c680744921.shtml"}, {"id": "5399895", "title": "通信感知网开通运行，渤海海域5G网络覆盖率超80%", "content": "10月15日，我国自主研发建设的渤海海域通信感知网正式开通运行，综合信号覆盖率达95%，5G网络覆盖率超80%，将为各类涉海活动提供高速、稳定、可靠的宽带通信和实时感知服务，保障水上安全。（央视新闻）", "ctime": 1792063797, "time_str": "19:29:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261015/c680744503.shtml"}, {"id": "5399889", "title": "机构：存储器价格飙升挤压其它组件成本 智能手机面临屏幕降级", "content": "韩国显示研究机构UBI Research提到，在存储器价格飙升的背景下，智能手机为其它组件留出的成本空间已显著缩小，屏幕降级成为制造商的被迫选择。对于旗舰级设备来说，存储器与显示屏幕两方面的物料成本在2025年早期时接近；而到2026年下半年，存储器的成本已占到整机的40%左右，大致是屏幕的6倍。这是存储器涨价与OLED产线折旧带来的出货价格下行两方面共同作用的结果。（科创板日报）", "ctime": 1792063774, "time_str": "19:29:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261015/c680744499.shtml"}, {"id": "5399835", "title": "长川科技：拟以人民币5000万元-人民币1亿元回购公司股份", "content": "长川科技公告，公司实际控制人、董事长兼总经理赵轶提议公司以自有或自筹资金回购股份，资金总额不低于人民币5000万元（含）且不超过人民币1亿元（含），回购价格不高于董事会审议通过回购方案决议前30个交易日股票交易均价的150%，拟用于股权激励或员工持股计划。", "ctime": 1792063430, "time_str": "19:23:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261015/c680744175.shtml"}, {"id": "5399803", "title": "美年健康：预计2026年前三季度净利润同比增长75.47%–92.83%", "content": "美年健康公告，预计2026年前三季度营业收入65.1亿元–66.5亿元，同比下降3.98%–6.00%；归母净利润盈利9100万元–1亿元，较上年同期盈利5185.99万元增长75.47%–92.83%；扣非净利润盈利8000万元–8900万元，较上年同期盈利1222.89万元增长554.19%–627.78%。本次业绩预告相关财务数据未经注册会计师审计。", "ctime": 1792063203, "time_str": "19:20:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261015/c680743977.shtml"}, {"id": "5399763", "title": "俄罗斯一炼油厂遭乌大规模袭击起火", "content": "俄罗斯国防部15日说，乌克兰当天凌晨对俄梁赞州一家炼油厂发动大规模袭击，引发炼油厂火灾。俄罗斯国防部在社交媒体上发布通报说，袭击发生在当天凌晨4时至7时之间，俄防空导弹部队、歼击航空兵、陆军航空兵以及机动火力小组拦截并摧毁4枚“火烈鸟”远程巡航导弹和69架固定翼无人机。无人机残骸坠落引发炼油厂火灾。（新华社）", "ctime": 1792062945, "time_str": "19:15:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261015/c680743933.shtml"}, {"id": "5399761", "title": "深圳发布APEC交通保障措施倡导绿色出行灵活上班", "content": "深圳15日举行新闻发布会推出一揽子APEC交通保障措施：将分区域、分时段、分路段实施临时交通管控，倡导绿色出行、居家办公、带薪休假，同时加大公共交通运力供给和调配，努力实现高标准会议服务和生产生活“双保障”。会议期间，深圳将对部分区域、道路实施临时交通管控。交通管控政策将根据会议日程梯次性发布。届时，部分主干道、高架桥、隧道及交叉路口将视情况采取交通组织调整，如单向通行、临时封闭等。除承担保障任务单位的车辆外，其余公务车和国企公车按90%比例暂停使用。同时，倡导市民自愿申报并停驶机动车，为停驶私家车的市民发放有APEC纪念意义并带一定面值的深圳通纪念卡、APEC专属纪念车贴；倡导企业在11月16日至20日会议当周，实行居家办公、带薪休假、错峰上班等灵活安排，缓解通勤压力。（新华社）", "ctime": 1792062937, "time_str": "19:15:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261015/c680743927.shtml"}, {"id": "5399653", "title": "摩尔线程全栈算力支撑 无锡（惠山）国产智算中心一期满载运行", "content": "摩尔线程消息，由摩尔线程落地建设的无锡（惠山）国产智算中心，是无锡云边端协同生态的核心枢纽。今年6月，无锡（惠山）国产智算中心正式点亮运行，这座全新落地的本土化“AI工厂”迅速释放强大算力价值，市场需求迎来爆发式增长。仅两个月时间，中心一期部署的2000张摩尔线程MTT S5000高端GPU算力资源便实现满载运行，刷新了国内国产商用智算集群的落地提速纪录。", "ctime": 1792062427, "time_str": "19:07:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261015/c680743664.shtml"}, {"id": "5399647", "title": "存储芯片美股盘前走低 SK海力士跌近8%", "content": "美股存储芯片概念股盘前集体走低，其中SK海力士跌超7.8%，西部数据、希捷科技、闪迪及美光科技跌幅均超5%。", "ctime": 1792062412, "time_str": "19:06:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261015/c680743660.shtml"}, {"id": "5399641", "title": "亿纬锂能：预计2026年前三季度净利润50.68亿元-53.5亿元，同比增长80.00%-90.00%", "content": "亿纬锂能公告，预计2026年前三季度归属于上市公司股东的净利润为50.68亿元-53.5亿元，同比增长80.00%-90.00%；扣除非经常性损益后的净利润为38.75亿元-42.62亿元，同比增长100.00%-120.00%。预计营业收入同比增长约60%。本次业绩预告相关数据未经审计，业绩增长主要受产品迭代、服务升级、流程优化、新产能释放及新产品交付等因素推动。", "ctime": 1792062394, "time_str": "19:06:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261015/c680743654.shtml"}, {"id": "5399625", "title": "特斯拉上架儿童车 售价1399元", "content": "特斯拉中国官网商店上架了一款为2–6岁儿童设计的特斯拉儿童平衡车，售价为1399元。特斯拉客服人员告诉记者，目前，这款双轮平衡车已经开放预订，目前下单预计10月28日前发货。（界面新闻）", "ctime": 1792062348, "time_str": "19:05:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261015/c680743639.shtml"}, {"id": "5399617", "title": "海光信息：预计2026年前三季度净利润同比增长38.16%到51.93%" 险挑战。关于全球失衡，各方应有更全面的分析视角。不能只看经常账户，也要关注金融渠道，特别是随着全球金融一体化加深，应更加重视资本流动等金融因素对失衡的影响。全球失衡不能依靠汇率调节。汇率受经济增长、货币政策、金融市场、地缘政治、突发风险事件等多种因素影响，与经常账户不存在简单线性关系。逆差国与顺差国应共同努力，实现全球经济动态平衡。（中国人民银行）", "ctime": 1792062145, "time_str": "19:02:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261015/c680743341.shtml"}, {"id": "5399291", "title": "博通美股盘前跌超2%", "content": "博通美股盘前跌超2%，现报339.3美元。", "ctime": 1792061922, "time_str": "18:58:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261015/c680743218.shtml"}, {"id": "5399289", "title": "DeepSeek公布系统故障补偿方案", "content": "针对今日8:11至13:04期间由于服务系统出现故障，导致该时段内API服务无法正常使用的情况，DeepSeek官方在开放平台发布通知称，对于此次故障深表歉意，已第一时间启动针对服务稳定性的全面排查和彻底整改，全面梳理并剥离单点依赖，坚决杜绝同类问题再次发生。作为补偿，将按用户账号7日内(10.8-10.14)的消耗金额以赠金形式全额返还，赠金自动到账，API 计费扣款先从赠金账户扣除。（蓝鲸新闻）", "ctime": 1792061917, "time_str": "18:58:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261015/c680743217.shtml"}, {"id": "5399277", "title": "天马新材：与英格瓷签订经销协议，期限3年", "content": "天马新材公告，公司近期与英格瓷（郑州）新材料技术有限公司签订《经销协议》，英格瓷将在全球范围内（不包括中国）独家经销约定的氧化铝产品。公司承诺每年供应至少3500公吨煅烧氧化铝及1000公吨球形/类球形氧化铝。协议初始期限为3年。", "ctime": 1792061887, "time_str": "18:58:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261015/c680743209.shtml"}, {"id": "5399271", "title": "极核京东商城新国标电动自行车集体下架，20余张CCC证书被暂停或撤销", "content": "记者获悉，近日，春风动力旗下极核电动车因大批量新国标强制性产品认证暂停等情况，面临无法正常售卖或上牌的情况。 在京东商城线上渠道，目前所有极核新国标电动自行车已于近期下线停售。据多家极核线下门店负责人介绍，“由于极核电动自行车CCC证书‘过期’，近一个月所有电动自行车均已无法正常上牌，线上渠道也已于四天前下线（10月10日）。”（新浪科技）", "ctime": 1792061765, "time_str": "18:56:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261015/c680743180.shtml"}, {"id": "5399263", "title": "楼市新政，四大一线城市已全部落地", "   if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
