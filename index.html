划在中国落地，国际奥委会已经与国家体育总局体育科学研究所合作，计划在今年的奥林匹克日（6月23日），在中国各地的32个社区体育与健康中心举办开放活动，让所有年龄段的人们都能参与体育锻炼。(新华社)", "ctime": 1781848285, "time_str": "13:51:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260619/c677588577.shtml"}, {"id": "4561419", "title": "北欧联合银行将诺和诺德评级从持有上调至买入", "content": "北欧联合银行将诺和诺德评级从持有上调至买入。(财联社)", "ctime": 1781848083, "time_str": "13:48:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260619/c677588563.shtml"}, {"id": "4561415", "title": "特朗普称达成美伊谅解旨在避免全球经济衰退", "content": "美国总统特朗普18日称，他之所以进行谈判达成美国和伊朗谅解备忘录，是为避免战事演变成全球经济衰退。特朗普在接受美国阿克西奥斯新闻网站采访时说，美国“在军事上彻底击败了他们”。这场军事行动实际上展现了美国的军事实力。“还有谁能做到那样的封锁？我实施了海上封锁，没有一艘船能够突破。”\n特朗普对美国国内一些人质疑他对伊朗不够强硬感到恼火。他说，如果继续轰炸伊朗目标，霍尔木兹海峡将无法通行。“我们几个月都拿不到石油。只要你还在投弹，那条海峡就自动关闭了……这种事可能会引发全球经济衰退。”阿克西奥斯新闻网站援引知情人士的话报道说，特朗普私下曾表达过担忧，认为全球石油储备即将枯竭，如果霍尔木兹海峡继续关闭，可能会引发全球石油危机。(新华社)", "ctime": 1781847774, "time_str": "13:42:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260619/c677588554.shtml"}, {"id": "4561411", "title": "国家防总针对江苏启动防汛四级应急响应", "content": "6月19日，国家防总办公室、应急管理部组织自然资源部、住房和城乡建设部、交通运输部、水利部、中国气象局等多部门联合会商，研判近期降雨发展趋势，研究部署重点地区防汛工作。国家防总针对江苏启动防汛四级应急响应，维持针对浙江、安徽、江西、湖北、湖南、广东、广西、重庆、贵州、云南的防汛四级应急响应。国家防总办公室主任、应急管理部副部长兼水利部副部长陈敏主持会商。(新华社)", "ctime": 1781847577, "time_str": "13:39:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260619/c677588542.shtml"}, {"id": "4561401", "title": "西渝高铁康渝段龚家梁隧道顺利贯通", "content": "19日，历经三年建设，由中铁二十四局承建的西渝高铁安康至重庆段龚家梁隧道完成最后一环掘进作业，顺利实现贯通，为西渝高铁全线建成通车奠定坚实基础。据了解，设计时速350公里的西渝高铁是我国“八纵八横”高铁网中京昆通道和包（银）海通道的重要组成部分。线路建成通车后，将与已建成运营的成都至重庆高铁、郑州至重庆高铁和在建的重庆至昆明高铁、西安至延安高铁等多条线路连通，推动中西部地区路网结构进一步完善，极大便利沿线人民群众出行。(新华社)", "ctime": 1781846713, "time_str": "13:25:13", "stock_code": "", "stock_name": "", "stock_market" 社)", "ctime": 1781846215, "time_str": "13:16:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260619/c677588486.shtml"}, {"id": "4561359", "title": "黎巴嫩媒体：以色列空袭黎南部造成至少16人死亡", "content": "据黎巴嫩国家通讯社19日报道，以色列当天凌晨对黎巴嫩南部多地发动空袭，造成至少16人死亡。(新华社)", "ctime": 1781845960, "time_str": "13:12:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260619/c677588473.shtml"}, {"id": "4561357", "title": "教育部部长怀进鹏在内蒙古调研", "content": "6月15日至17日，教育部党组书记、部长怀进鹏赴内蒙古自治区调研，深入满洲里市第十二学校、满洲里市中等职业技术学校、满洲里市第二中学，了解落实立德树人根本任务、铸牢中华民族共同体意识教育、开展中俄教育交流等情况，并与内蒙古自治区党委和政府主要负责同志会商。怀进鹏强调，要加强边境地区学校建设，健全与人口变化相适应的教育资源统筹调配机制，推进国家智慧教育平台深化应用，持续实施“人工智能+教育”，优化师资配置，提升教育公共服务水平。进一步发挥教育对科技和人才的支撑作用，建好高等研究院，强化要素聚焦和机制创新，紧扣乳业、稀土、能源等特色优势产业优化学科专业设置，为内蒙古现代化产业发展提供科技和人才支撑。突出职业学校办学能力高水平、产教融合高质量导向，加快构建现代职业教育体系。以“中俄教育年”为契机，创新“语言+文化”人才培养模式，不断拓展中俄教育合作的广度深度，深化人文交流。(财联社)", "ctime": 1781845904, "time_str": "13:11:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260619/c677588468.shtml"}, {"id": "4561345", "title": "古巴通过经济社会改革方案应对美国极限施压", "content": "古巴全国人民政权代表大会18日召开特别会议，审议并批准经济和社会改革方案，涵盖23个领域的176项改革措施。根据古巴全国人民政权代表大会官网消息，古巴总理马雷罗在会上表示，改革旨在强化银行和金融体系，提高生产力，确保更公平的收入分配。这些措施将与税收、金融和企业体系的行政手续简化相配套。改革措施还包括企业制度的调整，重点在于推进生产结构现代化及管理方式多样化。马雷罗强调，面对美国持续封锁带来的巨大挑战，古巴要团结一致、坚定信念、勇敢无畏，并以创新方式应对挑战。此次改革与古巴自身发展逻辑相契合，根本目标是改善人民生活，让全体公民更好地为社会主义建设贡献力量。(新华社)", "ctime": 1781845478, "time_str": "13:04:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260619/c677588451.shtml"}, {"id": "4561337", "title": "日本40年期国债收益率上升5个基点至3.71%", "content": "日本40年期国债收益率上升5个基点至3.71%（财联社）", "ctime": 1781845352, "time_str": "13:02:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260619/c677588439.shtml"}, {"id": "4561325", "title": "WTI原油期货转涨", "content": "WTI原油期货转涨，最新报75.88美元/桶，此前一度跌超1%。（财联社）", "ctime": 1781845061, "time_str": "12:57:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260619/c677588422.shtml"}, {"id": "4561321", "title": "中国驻美大使谢锋：工商界朋友既是中美关系巨轮的“乘客”，也是“水手”", "content": "2026年6月17日，中国驻美国大使谢锋在美中贸易全国委员会2026年度庆典晚宴上发表演讲指出，在习近平主席和特朗普总统掌舵领航下，中美关系巨轮已经开启新征程。工商界朋友既是“乘客”，也是“水手”，应该同舟共济，心往一处想、劲往一处使，确保中美关系巨轮沿着建设性战略稳定的正确航向劈波斩浪，驶向合作共赢的彼岸。谢锋对美工商界提出五点希望：一要做关系新定位的践行者；二要做交往新进程的推动者；三要做合作新平台的共建者；四要做科创新赛道的领跑者；五要做民心新联通的架桥者。(中国驻美大使馆)", "ctime": 1781844947, "time_str": "12:55:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260619/c677588410.shtml"}, {"id": "4561315", "title": "中国驻美大使谢锋：人工智能不能野蛮生长、跑马圈地", "content": "2026年6月17日，中国驻美国大使谢锋在美中贸易全国委员会2026年度庆典晚宴上发表演讲，鼓励美国工商界做中美科创合作新赛道的领跑者。谢锋说，人工智能等新兴技术正在深刻改变经济形态、人类生活和社会治理，必须确保向善普惠、有序发展，不能放任自流、野蛮生长，不能“跑马圈地”、再设“铁幕”，更不能爆发“AI版星球大战”。中美作为全球领先的人工智能大国，完全可以优势互补、合作共赢。我们要用好人工智能政府间对话机制。工商界作为人工智能创新的“主力军”应发挥建设性作用，打通技术、市场、产业壁垒，释放双向合作赋能的创新动力，让人工智能成为中美合作的新疆域、人类创新发展的新阶梯。(中国驻美大使馆)", "ctime": 1781844815, "time_str": "12:53:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260619/c677588405.shtml"}, {"id": "4561313", "title": "中国驻美大使谢锋：中国企业合理关切应该尽快得到解决", "content": "2026年6月17日，中国驻美国大使谢锋在美中贸易全国委员会2026年度庆典晚宴上发表演讲，鼓励美国工商界做中美合作新平台的共建者。谢锋说，中美贸易理事会、投资理事会是新鲜事物，欢迎中美工商界建言献策，同两国政府形成合力，确保开好头、起好步，为中美经贸合作保驾护航、排忧解难。中美正商谈300亿美元对等降税安排。许多美国企业向我反映300亿美元的篮子不够大，希望将其产品都纳入，我对此深表赞同。从中美贸易的体量看，完全可以把豁免单子拉得更长、规模范围做得更大，300亿翻倍或者加个零都不为过。同时，中国企业合理关切应该尽快得到解决，出口管制、双向投资限制、反垄断调查、涉军企业清单等“黑名单”不应被用作打压工具。(中国驻美大使馆)", "ctime": 1781844776, "time_str": "12:52:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260619/c677588403.shtml"}, {"id": "4561311", "title": "中国驻美大使谢锋：台湾问题、民主人权、道路制度、发展权利是中方不容挑战的四条红线", "content": "2026年6月17日，中国驻美国大使谢锋在美中贸易全国委员会2026年度庆典晚宴上发表演讲，鼓励美国工商界做中美关系新定位的践行者。谢锋说，中美建设性战略稳定关系不是一句口号，不能光停留在文字上，而应变成两国各界相向而行的行动，不断拉长合作清单，持续压缩问题清单，坚决排除干扰和障碍。台湾问题、民主人权、道路制度、发展权利是中方四条红线，不容挑战，不能越界。当中国的拉布布不必戴上所谓“强迫劳动”的帽子，当美国企业能够自由选择中国合作伙伴而不必担心泛国家安全化，中美关系新定位就具象化了，两国人民就能从中收获看得见、摸得着的成果。(中国驻美大使馆)", "ctime": 1781844732, "time_str": "12:52:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260619/c677588400.shtml"}, {"id": "4561307", "title": "全国铁路预计今日发送1973万人次，加开旅客列车1028列", "content": "6月19日，记者从中国国家铁路集团有限公司获悉，今日是端午节假期第1天，全国铁路迎来客流高峰，预计发送旅客1973万人次，计划加开旅客列车1028列。6月18日，全国铁路发送旅客1674.2万人次，运输安全平稳有序。截至6月19日8时，铁路12306已累计发售端午假期运输火车票5159万张。从车票预售情况看，今日热门出发城市主要有北京、上海、广州、成都、深圳、杭州、郑州、武汉、西安、南京；热门到达城市主要有北京、广州、成都、杭州、上海、郑州、南京、武汉、西安、深圳；北京至济南、香港至深圳、北京至沈阳、北京至郑州、北京至大同、广州至南宁、北京至呼和浩特、北京至青岛、北京至太原等热门区间客流相对集中。从余票情况看，广州往返南宁，广州至衡阳，上海、沈阳、邯郸至北京，北京至包头、济南，西安至兰州，深圳至长沙余票充足。(澎湃新闻)", "ctime": 1781844684, "time_str": "12:51:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260619/c677588398.shtml"}, {"id": "4561303", "title": "NYMEX铂金主力合约跌超3%", "content": "NYMEX铂金主力合约跌超3%，现报1655.6美元/盎司。", "ctime": 1781844641, "time_str": "12:50:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260619/c677588395.shtml"}, {"id": "4561297", "title": "钱凯港商业运营周年庆在秘鲁举行", "content": "秘鲁钱凯港商业运营周年庆暨“媒体智库钱凯行”活动18日在该港口举行。中国驻秘鲁大使宋扬在致辞中说，钱凯港全部采用市场融资和企业投资，没有给秘鲁财政带来任何债务负担。钱凯港正式运营一年多来，已开通3条干线、4条支线航线，覆盖中国主要港口，辐射哥伦比亚、厄瓜多尔、智利、巴拿马等国，成为连接亚太与拉美的重要物流枢纽。钱凯市市长胡安·阿尔瓦雷斯在活动中说，钱凯港为秘鲁经济活动的拓展和多元化发展打开了大门。秘鲁国家港务局总经理豪尔赫·查韦斯表示，钱凯港已成为秘鲁经济与物流发展新前景的象征，进一步巩固了秘鲁作为南美洲与亚太市场之间天然桥梁的地位。(新华社)", "ctime": 1781844565, "time_str": "12:49:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260619/c677588390.shtml"}, {"id": "4561295", "title": "利比亚主要政治力量就选举路线图达成一致", "content": "利比亚总统委员会18日宣布，该国主要政治力量已就结束政治过渡阶段、推进选举路线图达成原则性文件，并拟定于2027年2月17日前同步举行总统和议会选举。\n总统委员会的声明说，根据利比亚国民代表大会、国家最高委员会和总统委员会16日达成的原则性文件，国民代表大会和国家最高委员会组建的“6+6”联合委员会负责确定选举法，之后交由国民代表大会批准，选举法生效后举行总统和议会选举。选举将由一个主权高级委员会监督，其成员包括利比亚中央银行行长、全国高级选举委员会主席、“5+5”联合军事委员会和来自利比亚主要政治力量的安全机构代表。\n文件重申利比亚国家石油公司对利比亚石油销售的专属权限，以及中央银行通过既定法律机制征收石油收入。\n此外，文件呼吁将利比亚国家石油公司和利比亚外国投资公司纳入《利比亚政治协议》覆盖的机构范围，并反对在选举前实施移民安置政策和释放被冻结的利比亚海外资产。(央视新闻)", "ctime": 1781844514, "time_str": "12:48:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260619/c677588387.shtml"}, {"id": "4561293", "title": "杰瑞股份：今年以来，公司燃气轮机发电机组销售价格已多次上涨", "content": "杰瑞股份6月19日在互动平台表示，公司燃气轮机发电机组的销售定价遵循市场化原则，综合考虑北美市场需求动态、成本、技术附加值及行业竞争格局等多重因素。今年以来，受益于行业供不应求的态势，公司燃气轮机发电机组销售价格已多次上涨。(证券时报)", "ctime": 1781844431, "time_str": "12:47:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260619/c677588380.shtml"}, {"id": "4561291", "title": "2026年端午档新片总票房破8000万元", "content": "6月19日，据灯塔专业版数据，2026年端午档新片总票房破8000万元，《我看见两朵一样的云》《玩具总动员5》《爱是愤怒》暂列前三位。(每日经济新闻)", "ctime": 1781844389, "time_str": "12:46:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260619/c677588379.shtml"}, {"id": "4561289", "title": "现货白银日内跌幅扩大至3%", "content": "现货白银日内跌幅扩大至3%，报63.75美元/盎司。（财联社）", "ctime": 1781844340, "time_str": "12:45:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260619/c677588371.shtml"}, {"id": "4561251", "title": "京东数字人直播商家数量暴增5倍 AI成618增长核心引擎", "content": "2026年京东618是首个全场景、全产业融入AI的618，AI技术全面贯穿直播经营、智能硬件、用户服务、全域营销等各大核心链路，实现规模化落地爆发。从数字人直播商家数量5倍增长、JoyInside接入设备量环比11.11增长3倍，到JoyAI APP个性化服务用户突破300万、JoyMarketing智能交互量超8亿次。(央视财经)", "ctime": 1781843544, "time_str": "12:32:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260619/c677588334.shtml"}, {"id": "4561241", "title": "王文涛部长会见加拿大工业部长乔利和工商界代表", "content": "商务部部长王文涛6月18日在北京会见加拿大工业部长乔利、加总理驻议会秘书布洛伊斯和工商界代表。双方就中加经贸关系、加资企业在华发展以及彼此重点经贸关注等进行深入交流。王文涛表示，习近平主席指出，中加要推进构建新型战略伙伴关系，做相互尊重、共同发展、彼此信任、相互协作的伙伴。两国领导人的重要共识为中加经贸关系指明了方向。中国正积极实施“十五五”规划，市场的规模性、成长性、稳定性优势明显，蕴藏巨大机遇。双方应充分发挥中加经贸联委会机制的经贸主渠道作用，巩固传统产业合作势头，大力拓展新兴和未来产业合作空间，拉紧共同利益纽带。中方始终重视外国投资者的意见，愿与加方共同努力，通过坦诚对话、务实合作，拉长合作清单，缩短问题清单，推动中加经贸关系健康、稳定、可持续发展。乔利表示，加方高度重视发展对华关系，将积极落实两国领导人重要共识，推动各领域务实合作。加方愿同中方拓展在电动汽车、电池、风能等新兴领域合作，深化在油气、农业、金融等传统领域合作，共同为两国企业创造互利共赢的合作氛围。与会加拿大工商界代表积极评价中国高质量发展成就，看好中国发展前景给加企业带来的巨大机遇，期待加强对话交流，拓展务实合作。(商务部)", "ctime": 1781843035, "time_str": "12:23:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260619/c677588310.shtml"}, {"id": "4561239", "title": "瑞士外交部证实美伊会谈取消", "content": "瑞士外交部19日证实美国和伊朗原定当日在瑞士举行的会谈取消。(新华社)", "ctime": 1781842895, "time_str": "12:21:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260619/c677588304.shtml"}, {"id": "4561237", "title": "银河通用机器人发布全球首个人形机器人通用小脑GPT基础模型", "content": "今日，银河通用机器人推出全球首个人形机器人通用小脑GPT基础模型AstraBrain-WBC 0.5。《科创板日报》记者获悉，该模型依托2万小时人类动作数据训练，建成业内最大规模人形机器人运动语料库；真机实测实现大量陌生动作零样本泛化执行，使人形机器人首次拥有类似GPT的陌生任务运动泛化能力。(科创板日报)", "ctime": 1781842722, "time_str": "12:18:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260619/c677588291.shtml"}, {"id": "4561225", "title": "白宫向美国会高层通报美伊谅解备忘录细节", "content": "据美国方面18日消息，白宫当天举行了电话会议，向参众两院的部分议员通报了美国和伊朗达成的谅解备忘录的具体内容。据悉，参与电话会议的包括国会两党领导层，以及参议院外交关系委员会和众议院外交事务委员会的高级议员。\n白宫高级官员在会上介绍了谅解备忘录的具体内容、回答议员提问，并介绍未来60天内推动达成永久停火协议的下一阶段谈判安排。消息还称，美国国会内部对美伊此次签署的谅解备忘录提出批评，部分共和党议员认为，在持续近四个月的战争后，政府并未迫使伊朗作出足够让步。(央视新闻)", "ctime": 1781842529, "time_str": "12:15:29", "stock_cod // 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
