1787036166, "time_str": "14:56:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260818/c679042913.shtml"}, {"id": "4974397", "title": "四川：1—7月规模以上工业增加值同比增长6.6%", "content": "四川省统计局发布2026年1—7月四川省国民经济主要指标数据，1—7月，全省规模以上工业增加值同比增长6.6%，规模以上工业企业产品销售率为95.3%。分行业看，41个大类行业中33个行业增加值同比实现增长，其中，电气机械和器材制造业同比增长11.8%，计算机、通信和其他电子设备制造业增长10.7%，电力、热力生产和供应业增长7.9%，化学原料和化学制品制造业增长7.5%，医药制造业增长6.8%。分产品看，天然气产量同比增长0.8%，发电量增长3.6%，锂离子电池增长72.3%，智能电视增长30.3%，集成电路增长18.6%，液晶显示屏增长8.3%，工业机器人增长6.9%。（人民财讯）", "ctime": 1787036144, "time_str": "14:55:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260818/c679042896.shtml"}, {"id": "4974391", "title": "万科已正式撤销集团办公事业部，事业部数量由8个缩减至7个", "content": "新任董事长徐恩利履职后的“第一把火”，烧向了万科的组织架构。记者近日获悉，万科已正式撤销集团办公事业部，事业部数量由8个缩减至7个，原办公事业部负责人卢冰同步转任中航万科负责人。该事业部设立于2024年10月，至本次调整撤销，存续仅22个月。就上述调整，记者向万科方面求证，截至发稿未获回应。不过，万科集团网站已悄然完成组织架构信息更新：目前仅保留物业、商业与酒店、长租公寓、海外、食品、物流及财顾7个事业部，办公事业部已从列表中剔除。这是继2025年9月万科大规模调整组织架构、确立“集团总部+地区公司+事业部”新格局后，又一次关键精简。此次调整，亦被业内普遍视作徐恩利上任后的首个重大动作。（中国房地产报）", "ctime": 1787036029, "time_str": "14:53:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260818/c679042850.shtml"}, {"id": "4974383", "title": "新疆新能源装机总规模截至7月底突破1.74亿千瓦", "content": "8月18日，新疆维吾尔自治区常务副主席张迎春在国家数据局新闻发布会上表示，新疆数字产业根基扎实，转型动能持续迸发。持续推动能源、特色农业等传统优势产业数字化、智能化、绿色化转型，不断培育数字经济新赛道、新增长点。聚焦绿色算力、跨境数字贸易、智慧能源、数字文旅、智慧农业等重点领域，持续推进数字产业化、产业数字化双向赋能、协同发展。特别是新疆风、光资源无限，且与中部、东部约两小时的自然时差形成了能源时空优势互补，新能源装机总规模截至7月底突破1.74亿千瓦，已建成6个千万千瓦级新能源基地，丰富的清洁能源资源优势将为与上合国家开展数字基建共建、数字产业协同、技术成果共享奠定坚实产业基础。（中证金牛座）", "ctime": 1787035917, "time_str": "14:51:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260818/c679042784.shtml"}, {"id": "4974345", "title": "美的集团在重庆成立数智楼宇设备公司", "content": "企查查APP显示，近日，重庆美的数智楼宇设备有限公司成立，法定代表人为李凯，经营范围包含：制冷、空调设备销售；家用电器销售；家用电器零配件销售；机械电气设备销售等。企查查股权穿透显示，该公司由美的集团旗下海南美的楼宇科技有限公司及佛山市美的空调工业投资有限公司共同持股。（人民财讯）", "ctime": 1787035592, "time_str": "14:46:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260818/c679042588.shtml"}, {"id": "4974323", "title": "通鼎互联等成立科技新公司 含光电子器件制造业务", "content": "企查查APP显示，近日，四川鼎睿精切科技有限公司成立，经营范围包含：电子元器件批发；电子产品销售；光电子器件制造；光学仪器制造；光纤销售；光纤制造等。企查查股权穿透显示，该公司由通鼎互联等共同持股。（人民财讯）", "ctime": 1787035343, "time_str": "14:42:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260818/c679042433.shtml"}, {"id": "4974309", "title": "神龙汽车、东风集团股份等合资新公司 注册资本近82亿元", "content": "企查查APP显示，近日，神龙汽车科技（武汉）有限公司成立，法定代表人为黄勇，注册资本约为82亿元，经营范围包含：汽车零部件研发；以自有资金从事投资活动；汽车零配件零售；汽车零配件批发；汽车销售等。企查查股权穿透显示，该公司由神龙汽车有限公司、东风汽车集团股份有限公司等共同持股。（人民财讯）", "ctime": 1787035227, "time_str": "14:40:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260818/c679042372.shtml"}, {"id": "4974301", "title": "报告：上半年近七成上海超甲级办公楼租金企稳或上涨", "content": "8月18日，仲量联行发布的上海办公楼市场白皮书显示，2026年，上海超甲级办公楼市场释放企稳回升信号，上半年，近七成项目实现租金企稳或上涨。截至二季度末，上海超甲级办公楼平均租金达8.5元/平方米/天。仲量联行预测，未来五年，上海超甲级办公楼租金年均复合增长率将达到6%左右，成为引领上海办公室市场修复的核心引擎。（人民财讯）", "ctime": 1787035200, "time_str": "14:40:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260818/c679042356.shtml"}, {"id": "4974291", "title": "最快8月见？特斯拉Cybercab被曝将加入Robotaxi车队，官方：暂无消息", "content": "8月18日，据媒体援引知情人士消息，特斯拉正筹备Cybercab（赛博无人驾驶电动车）对外正式投放，最早将于本月在美国得克萨斯州奥斯汀市启动落地部署。据了解，目前，特斯拉的Robotaxi项目主要依赖Model Y和Model 3车型。7月31日，特斯拉宣布将其自动驾驶出租车Robotaxi服务从得州奥斯汀扩展至加州湾区，覆盖范围从旧金山北部一直延伸至圣何塞，包括伯克利、奥克兰、弗里蒙特等城市。而Cybercab近期已进入实际测试和内部运营阶段。今年6月以来，特斯拉已在美国多地公开道路测试Cybercab，其中包括奥斯汀。今年7月，Cybercab进一步在特斯拉得州超级工厂开启员工乘车服务，但目前仍主要面向内部员工。（每日经济新闻）", "ctime": 1787035092, "time_str": "14:38:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260818/c679042263.shtml"}, {"id": "4974287", "title": "多只粮食ETF大涨超7%", "content": "国证粮食指数涨幅扩大至近7%，粮食ETF景顺（159072）、粮食ETF易方达（159038）、粮食ETF华夏（159030）、粮食ETF广发（159587）、粮食ETF南方（159063）、粮食ETF鹏华（159698）5只粮食ETF涨超7%", "ctime": 1787034992, "time_str": "14:36:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260818/c679042198.shtml"}, {"id": "4974265", "title": "南向资金净买入超100亿港元", "content": "据同花顺iFinD数据，截至目前，南向资金净买入超100亿港元，其中港股通（沪）买入超69.62亿港元，港股通（深）买入超30.66亿港元。", "ctime": 1787034874, "time_str": "14:34:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260818/c679042124.shtml"}, {"id": "4974249", "title": "日韩股市集体收跌", "content": "日经225指数收跌2.54%，报67460.73点。韩国综指收跌1.55%，报6869.80点。", "ctime": 1787034711, "time_str": "14:31:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260818/c679042036.shtml"}, {"id": "4974195", "title": "印尼北苏门答腊省附近海域发生6.1级地震", "content": "据印尼气象、气候和地球物理局发布的报告，当地时间8月18日13时02分，印尼北苏门答腊省南尼亚斯岛东南147公里处发生6.1级地震，震源深度29公里。无海啸风险。(央视新闻)", "ctime": 1787034388, "time_str": "14:26:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260818/c679041796.shtml"}, {"id": "4974191", "title": "阿里千问办公接入企业微信", "content": "记者了解到，阿里旗下Agent产品“千问办公”正式接入企业微信，此前，该产品已接入钉钉和飞书。（第一财经）", "ctime": 1787034307, "time_str": "14:25:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260818/c679041753.shtml"}, {"id": "4974177", "title": "工信部电池工作组启动钠电池针刺摸底测评 产业化进一步提速", "content": "近几年，我国钠离子电池产业化进程提速以来，行业发展迅速。随着电池安全标准持续迭代完善，针刺测试作为模拟机械滥用、验证电芯内部短路风险的核心试验，已成为动力电池安全评估的关键指标。当前钠离子电池技术快速产业化，产品正向高能量密度、高集成化持续升级。为此，工信部锂离子电池及类似产品标准工作组正式启动钠离子电池针刺专项摸底测评，覆盖不同能量密度产品开展系统性安全核验，助力企业提前排查安全隐患、优化产品设计，支撑行业标准体系统一落地。（人民财讯）", "ctime": 1787034061, "time_str": "14:21:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260818/c679041635.shtml"}, {"id": "4974173", "title": "印尼苏门答腊岛附近海域发生6.1级地震", "content": "据印尼气象、气候和地球物理局消息，印尼苏门答腊岛附近海域18日发生6.1级地震。(新华社)", "ctime": 1787034017, "time_str": "14:20:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260818/c679041617.shtml"}, {"id": "4974171", "title": "台湾地区功率半导体厂商酝酿第三波涨价", "content": "据台湾经济日报报道，台湾地区功率半导体厂商正酝酿第三波价格调整，最快10月起针对非合约产品，涨价10%至15%。业界看好台半、强茂、德微等厂商下半年营运量价齐升。（科创板日报）", "ctime": 1787033971, "time_str": "14:19:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260818/c679041600.shtml"}, {"id": "4974163", "title": "中老铁路货物运输突破9000万吨", "content": "记者8月18日从中国铁路昆明局集团有限公司获悉，截至8月18日上午，中老铁路开通以来货物运输累计突破9000万吨，其中跨境货物运输超2100万吨；全线累计开行货物列车超8万列，其中跨境货物列车超2.3万列。中老铁路自2021年12月3日开通运营以来，中国和老挝两国铁路部门加强货物运输组织，提升运输能力和效率，跨境货物运输量节节攀升，到2025年底累计运输近1700万吨。2026年以来，日均运输货物超6.7万吨。（新华社）", "ctime": 1787033866, "time_str": "14:17:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260818/c679041546.shtml"}, {"id": "4974151", "title": "扎波罗热核电站所在城市遭袭 已致1死15伤", "content": "当地时间8月18日，扎波罗热核电站所在的埃涅尔戈达尔市市长普霍夫通报称，乌军无人机对该市发动袭击，造成1人死亡、15人受伤。截至目前，乌克兰方面对此暂无回应。（央视新闻）", "ctime": 1787033705, "time_str": "14:15:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260818/c679041456.shtml"}, {"id": "4974119", "title": "吉尔吉斯斯坦库姆托尔公司到访中国瑞林", "content": "8月17日，中国瑞林党委书记、董事长、总经理吴润华在公司总部会见吉尔吉斯斯坦库姆托尔封闭式股份有限公司（简称“库姆托尔公司”）董事会主席托克托苏诺夫·卡尼梅特一行。双方围绕托戈洛克金矿EPC项目实施、NDI有色产业链全流程数智化整体解决方案落地应用，以及拓展深化后续合作等事宜 // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
