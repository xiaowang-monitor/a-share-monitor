": "5192153", "title": "转基因板块走高，万向德农涨停", "content": "转基因板块走高，万向德农涨停，敦煌种业此前封板，秋乐种业涨超10%，康农种业、京粮控股、登海种业、神农种业、农发种业等跟涨。", "ctime": 1789621585, "time_str": "13:06:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260917/c680007064.shtml"}, {"id": "5191887", "title": "习近平就发展先进制造业作出重要指示", "content": "中共中央总书记、国家主席、中央军委主席习近平近日就发展先进制造业作出重要指示指出，党的十八大以来，我国先进制造业不断发展壮大，创新力、竞争力、综合实力显著增强，制造强国建设迈出坚实步伐。（新华社）", "ctime": 1789618131, "time_str": "12:08:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260917/c680005237.shtml"}, {"id": "5191845", "title": "港股午评：恒生指数跌0.73%，恒生科技指数跌0.76%", "content": "港股午间收盘，恒生指数跌0.73%，恒生科技指数跌0.76%。恒指港股通ETF银华（159318）跌0.86%，港股通科技ETF鹏华（159751）跌0.72%。板块方面，摄影器材、添加剂板块涨幅靠前；油品石化贸易、焦炭加工Ⅲ板块跌幅靠前。个股方面，金斯瑞生物科技涨16.15%，剂泰科技-P涨15.67%，华宝国际涨12.52%，群核科技涨10.44%，英矽智能涨8.05%；德适-B跌9.7%，万国黄金集团跌8.99%，深演智能跌7.59%，山东黄金跌7.16%，招金矿业跌6.59%。", "ctime": 1789617675, "time_str": "12:01:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260917/c680004867.shtml"}, {"id": "5191843", "title": "万联证券：银行板块仍具有配置价值", "content": "万联证券发布研报称，8月融资需求仍然偏弱，社融存量同比增速继续放缓，政府债融资进度仍然偏慢。后续财政发力节奏是影响经济基本面以及货币政策的关键因素。银行板块2026年中报业绩整体符合预期，不过内部分化进一步加剧。营收端受净息差改善以及综合化经营的推动，保持韧性;风险分类政策进一步收紧叠加拨备计提力度的上行，使得利润改善弹性小于营收。综合考虑银行股当前的股息率以及估值水平，该行认为板块仍具有配置价值，首先，优选稳健性品种;其次，可关注优质区域行的预期差机会以及低估值股份行的投资机会。", "ctime": 1789617573, "time_str": "11:59:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260917/c680004807.shtml"}, {"id": "5191835", "title": "湖北水发集团、中国建筑等成立水利开发公司", "content": "企查查APP显示，近日，老河口汉丹水利开发有限公司成立，法定代表人为江浩，注册资本为2000万元，经营范围包含水力发电；天然水收集与分配；自来水生产与供应；水利情报收集服务；水资源管理；灌溉服务等。企查查股权穿透显示，该公司由湖北水利发展集团有限公司旗下湖北水发汉江控股有限公司、中国建筑全资子公司中国建筑一局（集团）有限公司等共同持股。（人民财讯）", "ctime": 1789617252, "time_str": "11:54:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260917/c680004612.shtml"}, {"id": "5191831", "title": "交易员称：印度央行可能正在抛售美元以遏制卢比贬值", "content": "交易员称：印度央行可能正在抛售美元以遏制卢比贬值。", "ctime": 1789617134, "time_str": "11:52:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260917/c680004546.shtml"}, {"id": "5191821", "title": "日本财务大臣片山皋月：预计日本央行将与政府紧密协调，实施适当的货币政策，以实现2%的价格目标", "content": "日本财务大臣片山皋月：预计日本央行将与政府紧密协调，实施适当的货币政策，以实现2%的价格目标。", "ctime": 1789616815, "time_str": "11:46:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260917/c680004349.shtml"}, {"id": "5191777", "title": "到2030年 我国粮食综合生产能力将达1.45万亿斤左右", "content": "近日，农业农村部印发《全国种植业发展“十五五”规划》。规划提出，要增强粮食等重要农产品供给保障能力，深入推进种植业绿色转型，发挥农业新质生产力引领作用，增强农业防灾减灾救灾能力。到2030年，我国粮食综合生产能力将达1.45万亿斤左右，粮食综合生产能力稳步提升，守牢谷物基本自给、口粮绝对安全底线。大豆、油料、棉花、糖料产能巩固提升，保持合理自给水平。蔬菜、水果、茶叶供应均衡、品类丰富、质量安全，多元化供给与消费需求更加适配。农业高效节水稳步发展，化肥农药科学精准施用，种植业绿色生产水平不断提升。农情灾情监测预警更加精准，农业防灾减灾救灾能力全面增强，种植业高质量发展取得显著成效。（央视新闻）", "ctime": 1789616163, "time_str": "11:36:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260917/c680003847.shtml"}, {"id": "5191775", "title": "算力跟着绿电走 闽宁两地实现算电协同全流程联动", "content": "9月16日，闽宁两地首次开展跨省算电协同联动全流程实操。当日，福州、厦门试点机柜的部分算力任务经统一调度，跨省转移至宁夏中卫数据中心运行。两地电力部门同步依托新型电力负荷管理系统，对算力负荷进行协同调节和动态监测。闽宁能源与算力供需天然互补，为算电协同奠定了资源基础：宁夏戈壁光伏资源充沛，午间出力高峰新能源消纳压力突出；福建数字经济发达，数据中心算力需求旺盛，高峰时段需加强供电保障。通过算力任务跨省调节，可探索电力资源与算力资源协同配置，实现“东部减负、西部消纳”双向效益。不同于以往“源随荷动”的传统电网互动模式，即通过调整发电侧来适应用电变化，本次实践中，算力作为需求侧调节资源主动参与电网调节，根据电力供需情况，将算力任务在两地间灵活调度。未来，两地将围绕“东数西算”和新能源消纳，探索算力与电力协同的技术机制，逐步扩大算力跨省调度范围，推动算电协同向常态化运行，形成可复制、可推广的算电协同“闽宁样板”。（央视新闻）", "ctime": 1789616111, "time_str": "11:35:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260917/c680003791.shtml"}, {"id": "5191761", "title": "ETF两市成交额报2535.17亿元，较昨日此时缩量345.15亿元", "content": "截至目前，ETF两市成交额报2535.17亿元，较昨日此时缩量345.15亿元，分类型来看，股票型ETF成交额790.33亿元，债券型ETF成交额1201.09亿元，货币型ETF成交额145.94亿元，商品型ETF成交额68.87亿元，QDII型ETF成交额328.95亿元。", "ctime": 1789615907, "time_str": "11:31:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260917/c680003664.shtml"}, {"id": "5191759", "title": "广电总局：“十五五”期间计划推出100部左右优秀电视剧、网络剧", "content": "国新办举行新闻发布会，介绍“十五五”时期加快推动广播电视和网络视听高质量发展有关情况。国家广播电视总局电视剧司司长冯胜勇会上介绍，电视剧作为老百姓喜闻乐见的文艺形态，是精品创作的“压舱石”、视听文艺的“承重墙”，是满足人民精神文化需求的“大餐正餐”。“十五五”期间，广电总局将按照“找准选题、讲好故事、拍出精品”的要求，计划推出100部左右优秀电视剧、网络剧。", "ctime": 1789615900, "time_str": "11:31:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260917/c680003662.shtml"}, {"id": "5191755", "title": "ETF午评：港股医疗ETF领涨2.97%，黄金股ETF领跌5.2%", "content": "ETF午间收盘涨跌不一，港股医疗ETF（159366）领涨2.97%，港股通医疗ETF（520850）涨2.62%，港股通医疗ETF（526010）涨2.48%，黄金股ETF（517520）领跌5.2%，黄金股ETF（159562）跌5.0%，黄金股ETF（159315）跌4.99%。", "ctime": 1789615887, "time_str": "11:31:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260917/c680003642.shtml"}, {"id": "5191753", "title": "A股午评：创业板指冲高回落跌0.12%，粮食概念、汽车整车、创新药板块涨幅居前", "content": "A股三大指数早盘集体下跌，截至午盘，上证指数跌0.36%，深证成指跌0.29%，创业板指跌0.12%，北证50跌1%，科创50指数跌0.39%。全市场成交额12538亿元，较上日放量800亿元，全市场超3100只个股下跌。板块题材上，转基因、汽车整车、教育、CRO概念、粮食概念涨幅居前；贵金属、油气开采及服务、电力、元件、风电设备板块跌幅居前。盘面上，汽车整车板块低开高走，众泰汽车、安凯汽车、海马汽车涨停，赛力斯、中通客车、曙光股份涨幅居前。粮食概念板块探底回升，敦煌种业、金健米业涨停，秋乐种业、万向德农、神农种业涨幅居前。CRO概念板块表现活跃，金石亚药、南华生物、百花医药涨停，近岸蛋白、万邦医药、义翘神州涨幅居前。贵金属板块低开低走，山东黄金、中金黄金、湖南白银领跌。油气开采及服务板块走势低迷，通源石油、中曼石油、科力股份跌幅居前。", "ctime": 1789615863, "time_str": "11:31:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260917/c680003627.shtml"}, {"id": "5191749", "title": "股指期货早盘收盘 主力合约全线下跌", "content": "股指期货早盘收盘，主力合约全线下跌。沪深300股指期货(IF)主力合约跌0.34%，上证50股指期货(IH)主力合约跌0.63%，中证500股指期货(IC)主力合约跌0.42%，中证1000股指期货(IM)主力合约跌0.51%。", "ctime": 1789615825, "time_str": "11:30:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260917/c680003590.shtml"}, {"id": "5191737", "title": "莱迪思发布AI驱动FPGA开发工具及Mach-N2安全FPGA系列", "content": "莱迪思半导体今日发布两款新品：AI驱动型FPGA开发工具Lattice Prompt，可将自然语言转化为验证响应，大幅加速开发；以及全新Lattice Mach -N2 FPGA系列，集成硬件可信根与后量子加密，面向下一代系统的安全控制需求。莱迪思半导体亚太区应用工程（AE）高级总监谢征帆表示，AI带来的业务增量主要来自AI服务器，无论是AI训练还是AI推理，FPGA都是其中不可或缺的器件，在其中承担平台级控制、底层安全防护，以及未来机架级AI基础设施的管理职能。（科创板日报）", "ctime": 1789615631, "time_str": "11:27:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260917/c680003427.shtml"}, {"id": "5191735", "title": "阿斯利康宣布投资近2亿元人民币升级无锡基地", "content": "9月17日，阿斯利康宣布投资近2亿元人民币全面升级无锡生产供应基地（以下简称“无锡基地”）新药开发及供应大楼，用于阿斯利康在研心血管创新药物的工艺开发和生产，并支持该药物商业化后的全球供应。", "ctime": 1789615591, "time_str": "11:26:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260917/c680003413.shtml"}, {"id": "5191731", "title": "我国成功发射天仪51、52星", "content": "9月17日10时40分，我国在酒泉卫星发射中心使用快舟十一号遥三运载火箭，成功将天仪51、52星发射升空，卫星顺利进入预定轨道，发射任务取得圆满成功。(新华社)", "ctime": 1789615337, "time_str": "11:22:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260917/c680003249.shtml"}, {"id": "5191729", "title": "阿里云“云市场”将更名为“AI应用市场”", "content": "阿里云宣布，自2026年9月20日起，“云市场”正式升级为“AI应用市场”。本次变更为平台名称调整，平台功能与服务不变。阿里云网站上原有“云市场”的相关文档、规则、协议等内容，均适用于“AI应用市场”。已签署协议继续有效，协议项下各项权利义务不受影响。", "ctime": 1789615328, "time_str": "11:22:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260917/c680003247.shtml"}, {"id": "5191721", "title": "印度对华铜缆作出反倾销终裁", "content": "据中国贸易救济信息网，2026年9月16日，印度商工部发布公告，对原产于或进口自中国的铜缆作出反倾销肯定性终裁，建议征收为期5年的反倾销税，具体如下：生产商上海电气集团腾恩驰科技(苏州)有限公司、金华冠洋电子科技有限公司、浙江超联电子有限公司、宁波卓新通信接插件有限公司均为0美元/吨，中国其他生产商为86美元/吨。涉案产品为所有结构化铜缆，包括超五类、六类、超六类、七类、超七类网线以及跳线。", "ctime": 1789615230, "time_str": "11:20:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260917/c680003187.shtml"}, {"id": "5191715", "title": "交易员淡化美联储鹰派加息信号，铜价企稳", "content": "在美联储如市场普遍预期加息后，交易员淡化美联储主席释放的鹰派信号，铜价企稳。尽管美元走强，伦敦金属交易所（LME）的铜期货价格变动不大。美联储官员预计今年晚些时候还将再次加息，这可能给铜等无收益资产带来压力。此前，受美国可能对精炼铜征收关税的预期推动，铜价曾大幅上涨并创下历史新高；目前，铜价正处于高位盘整阶段。当时的关税预期促使大量铜涌入美国库存，引发了人们对其他地区可能出现供应紧缺的担忧。迄今为止，美国尚未出台新的贸易措施，这令此前的涨势面临不确定性。不过，数据中心和可再生能源领域的需求预期，以及主要矿山的供应中断，仍在为铜价提供支撑。加拿大皇家银行资本市场分析师Sam Crittenden在一份报告中表示：“关于美国不会对铜征收关税的消息，令部分实物市场投机交易降温。尽管短期价格走弱，但基本面依然向好。”", "ctime": 1789614906, "time_str": "11:15:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260917/c680002896.shtml"}, {"id": "5191713", "title": "韩国外长访美前表态：尚未决定是否向霍尔木兹海峡派兵", "content": "综合路透社、韩国MBC电视台报道，韩国外交部长官赵显9月17日表示，韩国政府尚未决定是否向霍尔木兹海峡派兵。(环球网)", "ctime": 1789614893, "time_str": "11:14:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260917/c680002884.shtml"}, {"id": "5191679", "title": "南向资金净买入超30亿港元", "content": "据同花顺iFinD数据，截至目前，南向资金净买入超30亿港元，其中港股通（沪）买入超18.62亿港元，港股通（深）买入超11.47亿港元。", "ctime": 1789614327, "time_str": "11:05:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260917/c680002494.shtml"}, {"id": "5191665", "title": "TrendForce：DDR5 16Gb (2Gx8) 4800/5600现货均价较上日上涨0.31%", "content": "TrendForce数据显示，9月17日内存颗粒DDR5 16Gb (2Gx8) 4800/5600现货均价较上日上涨0.31%，DDR4 16Gb (2Gx8) 3200现货均价较上日下跌1.57%，DDR4 8Gb (1Gx8) 3200现货均价较上日上涨0.78%。", "ctime": 1789614010, "time_str": "11:00:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260917/c680002302.shtml"}, {"id": "5191663", "title": "汽车整车板块走高，海马汽车、众泰汽车涨停", "content": "汽车整车板块走高，海马汽车、众泰汽车涨停，安凯客车此前封板，金龙汽车、汉马科技、赛力斯、中通客车、东风股份等跟涨。", "ctime": 1789613995, "time_str": "10:59:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260917/c680002291.shtml"}, {"id": "5191657", "title": "严禁AI魔改 广电总局：使用AI的广电视听节目必须添加内容标识", "content": "国务院新闻办公室今天举行“开局起步‘十五五’”系列主题新闻发布会，国家广播电视总局（简称广电总局）有关负责人介绍“十五五”时期加快推动广播电视和网络视听高质量发展有关情况。会上介绍，广电视听是人工智能创新发展的重要领域，也是人工智能落地应用的实践沃土。当前，人工智能技术已经广泛应用于电视剧、网络剧、微短剧、综艺、动画片等不同类型节目的策划、制作、审核、传播、服务等各环节，行业人工智能应用非常广泛。“十五五”期间，我们将在继续深化人工智能在广电视听领域各环节创新应用的同时，统筹发展与安全，坚持技术服务于人、技术服务于创作，积极引导、规范人工智能在视听内容生产全流程的创新应用，做到鼓励创新有尺度、规范发展有边界。比如使用人工智能技术生成制作、播出的广电视听节目必须添加内容标识；广电视听节目制作关键环节及成片内容必须坚持人工审核把关；严禁AI魔改。人工智能技术还将持续迭代演进，广电总局将不断健全制度规范，科学研判、分类施策，该放开的鼓励创新，该守住的坚决守牢。(央视新闻)", "ctime": 1789613726, "time_str": "10:55:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260917/c680002126.shtml"}, {"id": "5191649", "title": "印度对原产于或进口自中国的铜缆作出反倾销终裁", "content": "据中国贸易救济信息网，9月16日，印度商工部发布公告，对原产于或进口自中国的铜缆（Copper Data Cables）作出反倾销肯定性终裁，建议征收为期5年的反倾销税。", "ctime": 1789613577, "time_str": "10:52:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260917/c680002005.shtml"}, {"id": "5191635", "title": "李成钢国际贸易谈判代表兼副部长会见国际工商界代表团", "content": "据商务部消息，9月16日上午，李成钢国际贸易谈判代表兼副部长会见国际工商界代表团，双方就中美经贸关系等议题进行交流。", "ctime": 1789613280, "time_str": "10:48:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260917/c680001786.shtml"}, {"id": "5191627", "title": "“十五五”期间我国物流供应链金融有望维持较高增速", "content": "记者今天从中国物流与采购联合会了解到，随着政策红利的不断释放与制度环境的不断优化，我国物流供应链金融市场规模稳步增长，“十五五”期间有望维持较高增速。据介绍，“十五五”期间，物流供应链金融年均复合增长率预计将维持在12%到20%的较高区间，呈现前高后稳的增长态势，尤其是跨境物流融资、绿色物流装备融资等细分场景将成为增长核心。(央视新闻)", "ctime": 1789613069, "time_str": "10:44:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260917/c680001620.shtml"}, {"id": "5191617", "title": "全国微短剧用户已超8亿", "content": "今天，国新办举行“开局起步‘十五五’”系列主题新闻发布会。发布会上介绍，全国微短剧用户已超8亿，2025年市场规模突破千亿元。AI剧发展很快、占比很高，坚持鼓励创新与守住底线并重，要求AI剧打上内容标注，推动平台严守肖像、声音授权底线，全流程把关。归根结底，AI是工具，人是创作的主体。AI剧发展越快，越要把好内容关。（央视新闻）", "ctime": 1789612931, "time_str": "10:42:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260917/c680001542.shtml"}, {"id": "5191613", "title": "兴业证券刘郁：美联储可能至少还会加息25个基点", "content": "美联储9月FOMC会议决定将联邦基金利率目标区间上调25个基点至3.75%—4.0%。对此，兴业证券首席经济学家刘郁表示，本轮加息周期启动后，出于抑制经济过热和通胀的目的，可能至少还会加息25个基点。美联储点阵图指向今年年底之前还有一次25个基点的加息，与市场预期差别不大。至于2027年是否继续加息，取决于美国后续的增长和通胀数据。如AI资本开支延续偏高增速，无论生产率是否增长，2027年加息的可能性都较大，加息周期的终点或介于4%—5%之间。受制于债务压力，本轮加息至5%以上的概率不高，除非确认生产率得到了大幅提升。(人民财讯)", "ctime": 1789612893, "time_str": "10:41:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260917/c680001506.shtml"}, {"id": "5191607", "title": "华为昇腾960超节点将采用NPO光引擎", "content": "在华为全联接大会2026上，华为轮值董事长汪涛表示，华为昇腾960超节点将是业界首个采用NPO的超节点，其中Atlas 960液冷超节点计划2027年Q3上市，Atlas 860风冷超节点将于2027年Q2上市。 (科创板日报)", "ctime": 1789612757, "time_str": "10:39:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260917/c680001369.shtml"}, {"id": "5191601", "title": "广电总局：前8个月上线微短剧中AI剧超九成", "content": "广电总局网络视听节目管理司司长王小亮17日在国新办举行的“开局起步‘十五五’”系列主题新闻发布会上介绍，今年前8个月，全国上线微短剧43万部，是去年全年的13倍，其中AI剧超九成。(新华社)", "ctime": 1789612672, "time_str": "10:37:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260917/c68000130 const SECTORS  = [{"name": "金融", "hit_count": 47, "etfs": []}, {"name": "数据要素", "hit_count": 25, "etfs": []}, {"name": "人工智能", "hit_count": 24, "etfs": []}, {"name": "半导体", "hit_count": 21, "etfs": []}, {"name": "新能源", "hit_count": 9, "etfs": []}, {"name": "消费", "hit_count": 7, "etfs": []}, {"name": "医药", "hit_count": 7, "etfs": []}, {"name": "军工", "hit_count": 3, "etfs": []}];
const META     = {"update_time": "2026-09-17 14:20:35", "sentiment_score": 59.523809523809526, "agents": []};

// 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';

  }
  container.innerHTML = HOT7.map((item, i) => `

        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>

  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
