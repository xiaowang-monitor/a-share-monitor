": "https://news.10jqka.com.cn/20260601/c677131232.shtml"}, {"id": "4436237", "title": "弘信电子：控股子公司出资5000万元投资通用机器人企业", "content": "弘信电子公告，公司控股子公司燧弘华创与关联方舟山云创智月共同投资通用机器人企业A公司。此次投资按标的公司投前估值200亿元进行，燧弘华创出资5千万元，云创智月出资2.8亿元认购新增注册资本。公告指出，此项投资旨在促进公司战略协同发展，完善产业生态，不会对公司当前及未来经营业绩产生重大影响。", "ctime": 1780316930, "time_str": "20:28:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260601/c677130732.shtml"}, {"id": "4436213", "title": "粤电力A：澄清克拉玛依项目算力收入占营收0.02%，与韶关算力集群无直接关联", "content": "粤电力A公告，公司股票于2026年5月29日、6月1日连续两个交易日收盘价格涨幅偏离值累计超20%，其间股价累计涨幅达40.05%。公司对网络传言进行澄清：新疆克拉玛依项目为30万千瓦光伏电站及500PFlops算力项目，2025年算力租赁收入911.5万元，占营收比例0.02%，利润7.22万元，占净利润比例0.01%，且目前无扩大算力规模规划；公司发电业务与广东韶关算力集群无直接关联；截至2026年3月末已投产新能源装机878.73万千瓦，2026-2027年预计投产约120万千瓦，网络传言500万千瓦为不实信息。此外，公司2026年第一季度归母净利润亏损1.52亿元，基本面未发生重大变化。", "ctime": 1780316722, "time_str": "20:25:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260601/c677130665.shtml"}, {"id": "4436205", "title": "ST洲际：控股股东广西正和未符合受理破产清算申请的法定条件", "content": "ST洲际公告，控股股东广西正和实业集团有限公司收到广西壮族自治区柳州市中级人民法院的《民事裁定书》，裁定不予受理张友进对广西正和的破产清算申请。法院认为，张友进的申请不能成立，广西正和尚未符合受理破产清算申请的法定条件。", "ctime": 1780316683, "time_str": "20:24:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260601/c677130645.shtml"}, {"id": "4436203", "title": "NYMEX天然气主力合约跌超1%", "content": "NYMEX天然气主力合约跌超1%，现报3.25美元/百万英热。", "ctime": 1780316668, "time_str": "20:24:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260601/c677130642.shtml"}, {"id": "4436181", "title": "抖音严打网络黑灰产：今年已配合相关部门抓获犯罪嫌疑人162名", "content": "6月1日，澎湃新闻记者获悉，抖音发布《抖音关于深入打击网络黑灰产的公告》称，今年以来，抖音已配合相关部门抓获黑灰产犯罪嫌疑人162名。公告显示，随着平台治理深入，黑灰产对抗呈现出跨境作案、高隐蔽性、组织化等复杂特征。一些不法团伙利用跨平台多级跳转、VPN等技术工具、隐晦暗语，不断变换违规方式，在站内站外实施色情赌博导流、账号买卖及代解封、虚假流量等违法违规行为。对此，抖音表示持续加强识别研判，严肃处置违规内容及账号，针对违法犯罪的行为，依法固定证据并上报主管部门。（澎湃新闻）", "ctime": 1780316523, "time_str": "20:22:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260601/c677130611.shtml"}, {"id": "4436175", "title": "ST朗源：公司股票将于6月3日起撤销其他风险警示 股票交易的日涨跌幅限制仍为20%", "content": "ST朗源公告，公司撤销其他风险警示的申请已获得深圳证券交易所审核同意。公司股票将于2026年6月2日停牌一天，2026年6月3日开市起复牌并撤销其他风险警示。自2026年6月3日开市起，公司证券简称由“ST朗源”变更为“朗源股份”，证券代码仍为“300175”，股票交易的日涨跌幅限制仍为20%。", "ctime": 1780316488, "time_str": "20:21:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260601/c677130601.shtml"}, {"id": "4436169", "title": "有研复材：拟投资1.5亿元建设先进金属基复合材料产业化项目一期", "content": "有研复材公告，公司拟实施2026年度投资计划，计划投资“有研金属复合材料（廊坊）有限公司先进金属基复合材料产业化项目”一期，投资金额为1.5亿元。该项目为续建项目，主要用于推进先进金属基复合材料产业化落地，满足公司发展战略规划和生产经营需要。项目已于2026年3月1日开始进行施工准备工作，目前工程按计划有序推进。本次投资旨在提升公司产业化能力和综合竞争力。", "ctime": 1780316372, "time_str": "20:19:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260601/c677130563.shtml"}, {"id": "4436079", "title": "铂科新材：拟发行H股股票并在香港联交所主板挂牌上市", "content": "铂科新材公告，公司于2026年6月1日召开第四届董事会第十七次会议，审议通过《关于公司发行H股股票并在香港联合交易所有限公司上市的议案》《关于公司发行H股股票并在香港联合交易所有限公司上市方案的议案》等议案。公司正在筹划发行境外上市外资股（H股）股票并在香港联合交易所有限公司主板挂牌上市，旨在满足业务发展需要，推进国际化战略，提升国际品牌形象及在全球市场的综合竞争实力，拓宽多元化融资渠道，助力公司提升整体竞争力并实现高质量发展。本次H股发行上市具体细节尚未确定，尚需提交公司股东会审议，并经中国证券监督管理委员会备案、取得香港联交所和香港证券及期货事务监察委员会核准。", "ctime": 1780315860, "time_str": "20:11:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260601/c677130419.shtml"}, {"id": "4435913", "title": "宏润建设：公司中标深蓝航天液体火箭试验基地工程建设项目 暂定中标金额5亿元", "content": "宏润建设公告，公司于近日收到中标通知书，深蓝航天液体火箭试验基地工程建设项目由公司中标承建，暂定工程中标总价人民币5亿元，其中一期工程合同暂定金额人民币2亿元，二期工程合同暂定金额人民币3亿元。项目业主方为江苏深蓝航天有限公司，项目承包方式为施工总承包模式，暂定工期900日历天。项目内容及规模为试验基地的土建工程、道路工程、水电综合管网等全部施工图纸内容。公司与业主方不存在任何关联关系。本工程的中标有利于进一步提升公司拓展和参与相关业务的市场竞争力和市场份额。该工程暂定中标金额占公司2025年度营业收入的8.70%，对公司2026年度及未来财务状况和经营成果无重大影响。", "ctime": 1780315294, "time_str": "20:01:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260601/c677130073.shtml"}, {"id": "4435811", "title": "亚威股份：拟投资Haco欧洲公司80%股份及美国公司49%股份", "content": "亚威股份公告，公司拟与比利时工业机械和机床制造商Haco NV开展股权和技术合作，双方已签署《投资意向书》。根据意向书，亚威将以收购部分股权及增资方式投资Haco欧洲公司，投资完成后持有其80%股份；以增资方式投资Haco美国公司，投资完成后持有其49%股份。同时，双方将签署技术转让协议，由Haco向亚威转让业务相关技术，技术转让与股权投资交割同步完成。本次交易尚处于初步意向阶段，具体交易方案、金额等将在尽职调查、审计评估后确定。", "ctime": 1780315158, "time_str": "19:59:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260601/c677130015.shtml"}, {"id": "4435771", "title": "*ST易录：预重整债权申报截止日为2026年6月28日", "content": "*ST易录公告，公司收到北京一中院决定书，指定北京市金杜律师事务所担任预重整期间临时管理人。债权人应于2026年6月28日（含当日）前，根据《债权申报指引》向临时管理人申报债权，采取“线上提交+线下邮寄”方式。预重整阶段的债权申报在后续重整程序中继续有效。公司后续是否进入重整程序尚存在不确定性，且公司因涉嫌信息披露违法违规被证监会立案，尚未收到结论性意见。", "ctime": 1780314858, "time_str": "19:54:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260601/c677129866.shtml"}, {"id": "4435761", "title": "广西柳州受地震影响的45所市属学校全部复课", "content": "记者1日从广西柳州市教育局了解到，目前受地震影响的柳州市45所市属学校已全部复课。据悉，在震情逐步平稳后，柳州市教育局立即研究启动复学复课的工作，根据不同校舍受损情况，采取原址复课、异地复课、安置点复课、就近插班、线上教学等方式复课。（新华社）", "ctime": 1780314740, "time_str": "19:52:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260601/c677129806.shtml"}, {"id": "4435711", "title": "华特气体：信息披露义务人持股比例从50.00%减少至44.83%", "content": "华特气体公告，信息披露义务人合计持有公司股份由6015.24万股减少至5608.55万股，合计持股比例从50.00%减少至44.83%，变动比例为5.17%。信息披露义务人厦门华弘多福投资合伙企业（有限合伙）、厦门华和多福投资合伙企业（有限合伙）、厦门华进多福投资合伙企业（有限合伙）因自身资金需求减持股份。", "ctime": 1780314406, "time_str": "19:46:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260601/c677129704.shtml"}, {"id": "4435673", "title": "和仁科技：终止筹划控制权变更 6月2日复牌", "content": "和仁科技公告，公司原计划与第三方进行股权转让事项可能导致控股股东、实际控制人变更，但因与交易对方就核心事项未达成共识，决定终止筹划。公司目前各项经营情况正常，终止筹划不会对经营业绩和财务状况产生重大不利影响。公司股票自2026年6月2日复牌。", "ctime": 1780314191, "time_str": "19:43:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260601/c677129648.shtml"}, {"id": "4435651", "title": "华兰股份：全资子公司拟2.05亿元增资自然常数获34.17%股权", "content": "华兰股份公告，公司全资子公司海南灵擎数智医药科技有限公司拟使用自有资金人民币2.05亿元向无锡自然常数科技有限公司进行增资入股，认购自然常数新增注册资本人民币102.5万元，取得本次交易完成后自然常数基于完全摊薄基础上34.17%的股权。本次投资已获公司董事会审议通过，不构成关联交易及重大资产重组。", "ctime": 1780314041, "time_str": "19:40:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260601/c677129557.shtml"}, {"id": "4435603", "title": "皖维高新：向控股股东转让巢湖国元小额贷款有限公司10%股权", "content": "皖维高新公告，拟将所持巢湖国元小额贷款有限公司10%股权转让给控股股东安徽皖维集团有限责任公司，转让价款确定为人民币1040.63万元。公司对国元小贷初始投资金额为1000万元人民币，持有其10%股权。截至2025年12月31日，公司已累计获取国元小贷分红款992万元。", "ctime": 1780313669, "time_str": "19:34:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260601/c677129393.shtml"}, {"id": "4435597", "title": "*ST中地：公司股票将于6月3日撤销退市风险警示 日涨跌幅限制变更为10%", "content": "*ST中地公告，公司股票将于2026年6月2日停牌一天，并于2026年6月3日开市起复牌。公司股票交易自2026年6月3日开市起撤销退市风险警示，股票简称由“*ST中地”变更为“中交地产”，股票代码仍为“000736”。撤销退市风险警示后，公司股票交易价格日涨跌幅限制由“5%”变更为“10%”。", "ctime": 1780313661, "time_str": "19:34:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260601/c677129390.shtml"}, {"id": "4435567", "title": "中方向非洲有关国家和非盟提供抗击埃博拉疫情援助", "content": "记者今天从国家国际发展合作署了解到，近期非洲部分地区埃博拉疫情持续蔓延，形势严峻，世界卫生组织已认定为“国际关注的突发公共事件”。根据疫情发展和非方需求，中国政府决定向刚果（金）提供紧急人道主义援助，并派遣医疗专家组赴刚提供医疗服务和帮助。同时，在双边援助基础上，中国政府也向非盟委员会提供援助并开展疫情防控合作，支持非洲疾控中心防控工作，共同提升非洲国家抗击疫情能力。（央视新闻）", "ctime": 1780313535, "time_str": "19:32:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260601/c677129332.shtml"}, {"id": "4435415", "title": "*ST天龙：涉及决议撤销诉讼法院已受理", "content": "*ST天龙公告，公司近日收到股东冯金生关于公司决议效力确认纠纷的诉讼通知。冯金生向常州市金坛区人民法院提起诉讼，要求确认公司第六届董事会第十五次会议决议无效，并由公司承担诉讼费用。金坛区法院已于2026年5月29日正式立案受理此案。目前，公司尚未收到法院的相关送达文件，案件尚未开庭审理，其对公司本期利润或期后利润的影响暂时无法准确估计。公司将积极应诉，维护合法权益，并根据案件进展履行信息披露义务。", "ctime": 1780312979, "time_str": "19:22:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260601/c677129007.shtml"}, {"id": "4435405", "title": "声迅股份：拟2.51亿元收购武汉中科锐择光电科技有限公司51%股权", "content": "声迅股份公告，公司拟以现金方式收购武汉中科锐择光电科技有限公司51%的股权，最终确定交易价格为人民币2.51亿元。本次交易完成后，中科锐择将成为公司控股子公司。本次交易不构成关联交易，也不构成《上市公司重大资产重组管理办法》规定的重大资产重组，不构成重组上市。", "ctime": 1780312943, "time_str": "19:22:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260601/c677128994.shtml"}, {"id": "4435373", "title": "北京市首个太空算力产业创新中心正式成立", "content": "6月1日，北京市卫星物联网行业发展大会在海淀成功举办。大会现场宣布，北京市首个太空算力产业创新中心正式成立，该中心由北京市经济和信息化局批复设立，由北京邮电大学在海淀区的支持下，联合行业龙头企业共同牵头组建。北京邮电大学计算机学院院长王尚广教授介绍，该中心采用“公司+联盟”模式，围绕太空算力全产业链系统布局六大攻关方向——高可靠强耐热的太空原生算力芯片、高性能超互联的太空算力载荷、太空算力卫星平台与标准体系、面向功耗与可靠性约束的太空大模型、天地一体通信测控组网与云化、太空算力服务化与Token化运营，贯通“芯片—硬件—平台—智能—网络—应用”全栈协同，系统打造太空算力原生产业体系。（人民财讯）", "ctime": 1780312734, "time_str": "19:18:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260601/c677128922.shtml"}, {"id": "4435371", "title": "江苏国信：未开展算电协同及蒙电入苏项目，一季度净利润同比降9.73%", "content": "江苏国信公告，公司股票于2026年5月28日、29日及6月1日连续三个交易日收盘价格涨幅偏离值累计超过20%，属于股票交易异常波动。经公司自查并致函控股股东核实，公司目前未开展算电协同业务，也未参与蒙电入苏项目；公司2026年第一季度归属于上市公司股东的净利润同比下降9.73%，扣非净利润同比下降9.39%，平均上网电价同比显著下降，且存在燃料成本上升风险；公司、控股股东及实际控制人不存在应披露而未披露的重大事项。", "ctime": 1780312733, "time_str": "19:18:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_shar // 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
