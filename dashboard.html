 "日经225指数收涨2.68%，报63339.07点。韩国综指收涨0.41%，报7847.71点。", "ctime": 1779431501, "time_str": "14:31:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260522/c676897071.shtml"}, {"id": "4395613", "title": "光伏专利战迎关键转折：西半球最大光伏制造商First Solar一核心电池专利在华被认定无效", "content": "据消息人士透露，光伏龙头企业晶科能源在中国对西半球最大光伏制造商First Solar的子公司Tetrasun提起的一项专利无效宣告请求，近日获国家知识产权局认定为“专利权全部无效”。\n国家知识产权局认定，专利权人泰特拉桑有限公司（Tetrasun）持有的，名为“高效率太阳能电池结构及制造方法”的201080027881.6号发明专利权全部无效，认定依据为不具备专利法规定的新颖性、创造性。\n“这个结果对国内光伏企业很有利，”消息人士表示，该专利是First Solar美国专利 US9130074B2的同族中国专利。这次认定专利无效的范围涉及到First Solar的1个核心电池专利以及其中的17项权利要求，“对First Solar会带来很大压力”。\n专利无效是指一项已被授权的专利因不符合专利法规定的条件而被宣告无效。专利无效程序是知识产权领域的重要法律手段，既可用于对抗侵权指控，也可用于清理专利壁垒。\n上述人士表示，目前光伏专利战的主战场还在美国。此次认定无效，对于晶科在美国所牵涉的专利诉讼具有参考价值。\n该人士认为，此次认定专利无效有两个意义，首先是这个结论可以支持晶科在美国的诉讼；其次，对中国光伏企业起到了很好的支持作用，对整个行业是有贡献的。（新浪科技）", "ctime": 1779431303, "time_str": "14:28:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260522/c676896939.shtml"}, {"id": "4395585", "title": "多国球迷使用AI创作世界杯应援歌曲", "content": "2026年美加墨世界杯三周后拉开战幕，世界多国球迷近来自发使用人工智能（AI）为自己支持的球队创作歌曲，以鼓舞球队士气，在社交媒体平台收获百万播放量。这股创作潮流始于一首献给法国队的歌曲。该歌曲由法国艺术家今年2月发布，开头采用一问一答的形式，列举了姆巴佩等法国国家队球员的名字。随后，巴西音乐人吉列尔梅·马亚为巴西队创作歌曲。在制作过程中，他借助AI叠加不同音乐元素，并同样采用了呼唤球员名字的形式。之后，葡萄牙、阿根廷、德国等球队的应援歌曲陆续出现，均沿袭了马亚的创作形式，在网络平台赢得球迷喜爱，部分歌曲的热度甚至超过由国际足联委托音乐人创作的官方主题曲。（新华社）", "ctime": 1779431112, "time_str": "14:25:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260522/c676896831.shtml"}, {"id": "4395583", "title": "兆易创新股价创历史新高", "content": "兆易创新盘中股价创历史新高，现涨8.02%，报466.42元，总市值为3278.71亿元。", "ctime": 1779431092, "time_str": "14:24:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260522/c676896822.shtml"}, {"id": "4395581", "title": "甘浙特高压受端配套工程首条送出线路贯通", "content": false, "source": "", "url": "https://news.10jqka.com.cn/20260522/c676895700.shtml"}, {"id": "4395277", "title": "其他小金属板块走高", "content": "其他小金属板块走高，贵研铂业、云南锗业、华锡有色、中矿资源、锡业股份等跟涨。", "ctime": 1779427931, "time_str": "13:32:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260522/c676895442.shtml"}, {"id": "4395275", "title": "“十五五”新型储能发展实施方案已编制完成等待发布", "content": "记者5月22日获悉，“十五五”新型储能发展实施方案已编制完成，正在内部征求意见，待意见征求完毕后发布。此前，新型储能已被列入“十五五”时期六大新兴支柱产业。国家能源局在今年1月举行的新闻发布会上表示，国家能源局将认真贯彻落实党的二十届四中全会精神，科学编制好“十五五”新型储能发展实施方案，健全完善新型储能政策管理体系，持续深化技术产业创新，大力推动新型储能高质量发展，有力支撑新型能源体系和新型电力系统建设。(中国证券报)", "ctime": 1779427910, "time_str": "13:31:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260522/c676895439.shtml"}, {"id": "4395241", "title": "中国机电商会：对欧委会近期公布的《工业加速器法案》立法提案表达严正关切", "content": "中国机电产品进出口商会（简称“中国机电商会”）发布声明称，中国机电商会作为中国机电外贸行业的全国性行业组织，代表相关会员企业，对欧委会近期公布的《工业加速器法案》立法提案表达严正关切。中国机电商会注意到，《工业加速器法案》中涉及公共采购和公共支持的原产地要求，可能严重影响中国相关产品进入欧盟市场的公平机会；外国投资审查条款所设定的股比上限、强制技术转让、本地员工比例及本地采购等条件，可能对已在欧或拟赴欧投资的中国企业构成重大限制，极大增加投资不确定性。上述条款不仅将严重损害中国企业的合法权益，还将破坏中欧相关产业链供应链稳定，损害欧盟企业与消费者利益，延缓欧盟自身绿色转型进程，难以实现提升欧盟产业竞争力的立法初衷。中国机电商会强烈呼吁欧方在后续立法进程中认真倾听产业界的理性声音，审慎评估相关条款的实际影响与合规风险，坚持公平竞争和开放合作的市场原则，通过双边对话与业界磋商化解分歧。中国机电商会将持续跟踪法案立法进程，支持会员企业积极应对相关挑战，助力维护中欧产业链供应链稳定与经贸合作大局。", "ctime": 1779427618, "time_str": "13:26:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260522/c676895342.shtml"}, {"id": "4395239", "title": "芯碁微装股价创历史新高", "content": "芯碁微装盘中股价创历史新高，现涨12.25%，报301.12元，总市值为398.85亿元。", "ctime": 1779427610, "time_str": "13:26:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260522/c676895341.shtml"}, {"id": "4395219", "title": "国家发展改革委：预计物价将继续运行在合理区间", "content": "记者从国家发展改革委今天举行的新闻发布会上了解到，随着一系列宏观政策深入实施，我国市场供需关系有望进一步改善，预计物价将继续运行在合理区间。4月份，我国居民消费价格指数（CPI）同比上涨1.2%，连续3个月保持在1%以上的温和上涨区间；工业生产者出厂价格指数（PPI）连续两个月保持上涨。这反映了相关领域的需求变化。CPI方面，在清明、“五一”、部分地区春假等假日效应带动下，居民出行需求增多，旅游、宾馆住宿、交通工具租赁等服务价格涨幅高于季节性水平。PPI方面，绿色转型步伐加快、人工智能迅速发展，带动相关行业需求增长。（央视新闻）", "ctime": 1779427299, "time_str": "13:21:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260522/c676895264.shtml"}, {"id": "4395217", "title": "伊朗民众音乐声中期盼和平稳定", "content": "当地时间5月21日晚，在伊朗首都德黑兰市中心的一座音乐厅，德黑兰交响乐团举行自2月28日美以大规模空袭伊朗以来的首次正式演出。一个半小时的演出中，乐团为现场800名观众演奏了贝多芬、柴可夫斯基等大师的经典作品。艺术帮助伊朗人渡过难关战争爆发以来，伊朗的许多文化娱乐活动都暂停举办。本场演出也是伊朗为刺激经济发展、恢复社会活力所实施的一系列举措之一。伊朗文化和伊斯兰指导部副部长告诉总台记者，艺术在伊朗一直占据着重要地位，更是增强韧性、希望和社会凝聚力的重要工具，不论局势如何变化，伊朗的艺术家们将继续与国家和人民站在一起。现场观众也表示，艺术帮助伊朗人渡过难关，期待有朝一日，伊朗能够实现持久的和平与稳定。(CCTV国际时讯)", "ctime": 1779427294, "time_str": "13:21:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260522/c676895263.shtml"}, {"id": "4395209", "title": "沪深京三市成交额超2万亿元，较上日此时缩量3027亿元", "content": "据同花顺iFinD数据，沪深京三市成交额超2万亿元，较上日此时缩量3027亿元，预计全天成交金额约3.0万亿元。截至目前，沪市成交额8812亿元，深市成交额11039亿元，北证50成交额150亿元。", "ctime": 1779427155, "time_str": "13:19:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260522/c676895221.shtml"}, {"id": "4395205", "title": "光学光电子板块午后走高", "content": "光学光电子板块午后走高，水晶光电涨停，民爆光电此前封板, 福光股份、美迪凯涨超10%，沃格光电、福晶科技、京东方A、激智科技、光莆股份等跟涨。", "ctime": 1779427040, "time_str": "13:17:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260522/c676895189.shtml"}, {"id": "4395191", "title": "今年来公募283亿元参与定增，电子个股浮盈显著", "content": "公募排排网最新数据，按增发上市日统计，截至5月21日，今年来22家公募已参与55只A股定增，覆盖A股年内定增总量（81只）的67.9%，合计获配282.62亿元。以当日收盘价核算，这22家公募中20家实现浮盈，整体浮盈66.96亿元，跑赢同期沪深300指数逾20%。前述55个定增标的中，40个已实现浮盈，其中9只个股浮盈已超50%，电子行业个股有4只。电子赛道备受公募青睐，年内已参与卓胜微、光弘科技等7只电子行业个股定增。（财联社）", "ctime": 1779426640, "time_str": "13:10:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260522/c676895068.shtml"}, {"id": "4395189", "title": "午后港股大模型概念股继续冲高，智谱涨超24%", "content": "午后港股大模型概念股继续冲高，智谱涨超24%，报1247.00港元。MINIMAX-W涨超14%。", "ctime": 1779426631, "time_str": "13:10:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260522/c676895064.shtml"}, {"id": "4395177", "title": "算力租赁午后震荡走高", "content": "算力租赁午后震荡走高，航锦科技涨停，莲花控股此前封板，利通电子、东阳光、行云科技跟涨。", "ctime": 1779426418, "time_str": "13:06:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260522/c676894997.shtml"}, {"id": "4395167", "title": "PCB概念股午后再度冲高，深南电路涨停，东材科技触及涨停", "content": "PCB概念股午后再度冲高，深南电路涨停，东材科技触及涨停，铜冠铜箔、金安国纪等跟涨。", "ctime": 1779426314, "time_str": "13:05:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260522/c676894950.shtml"}, {"id": "4395135", "title": "中科宇航创新研究院正式揭牌落地广州", "content": "5月22日，中科宇航创新研究院揭牌仪式在广州市黄埔区举行。创新研究院是中科宇航面向商业航天和太空经济设立的前沿创新平台，以太空制造为核心牵引，重点布局太空制造、可重复使用天地往返运输系统、新型动力产品三大方向，围绕太空生物医药、高端半导体、先进材料等未来产业需求，建设亚轨道微重力实验平台、轨道级太空制造平台和面向未来的天地往返运输能力，逐步构建“上得去、做得成、回得来、用得上”的太空制造全链条能力。（中科宇航）", "ctime": 1779426014, "time_str": "13:00:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260522/c676894864.shtml"}, {"id": "4395133", "title": "芬兰业界期待对华循环经济合作新契机", "content": "在日前举行的中国-芬兰循环经济企业合作交流会上，数十名中芬政企代表、科研机构学者围绕资源再生利用、全产业链协同、标准化建设等议题展开探讨。与会人士普遍认为，两国在循环经济领域的政策理念高度契合，产业优势深度互补，深化绿色合作正当其时。 芬兰经济与就业部高级顾问塔莎表示，中国有技术娴熟的人才、先进的技术、丰富的自然资源，芬兰将中国市场视为开展合作与芬兰企业寻求增长的最重要机遇之一。 在这场由中国循环经济协会、中国资源循环集团联合主办的交流会上，十多家芬兰企业和机构表达了对华合作的强烈意愿。 芬兰雷梅奥有限公司董事会主席科尔霍宁说，公司非常想接洽愿意参与废旧棉花回收利用的中国企业。 芬兰林德斯特伦集团可持续发展总监卢赫塔塞拉表示，中国在绿色能源及资源利用方面具有领先地位，公司与中国伙伴开展了良好合作，即将在华设立分支机构。 芬兰菲斯卡斯公司的业务涵盖塑料、钢铁、铝、纺织品及电池等材料回收。该公司可持续发展与公共事务副总裁伊哈迈基说，公司在中国设有生产基地，中国不仅有巨大的市场，也是重要的生产和供应链合作伙伴，希望未来在研发方面与中方伙伴有新的合作机会。 “中国不仅拥有丰富资源，还有巨大发展潜力。我们相信中国和芬兰两国在众多领域可以互相学习，彼此分享。”芬兰咨询公司英得弗集团高级咨询师先科说。(新华社)", "ctime": 1779425917, "time_str": "12:58:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260522/c676894841.shtml"}, {"id": "4395129", "title": "美众议院推迟表决限制特朗普对伊动武法案", "content": "美国众议院共和党领导层21日决定，推迟表决一项限制总统特朗普对伊朗动武权力的法案，引发民主党抗议。 美媒报道说，共和党领导层考虑到本党部分议员缺席，加之个别议员倒戈，可能难以否决民主党提出的这项法案，因此临时决定将原定当天的表决推迟到6月举行。 此举引发民主党不满。民主党众议员格雷戈里·米克斯说：“我们毫无疑问已经拿到了足够票数，他们也知道这一点，所以他们现在是在玩政治游戏。” 共和党方面则宣称，推迟投票是为了给当天缺席的议员保留投票机会。 美国国会参议院19日表决一项旨在限制特朗普动武权力的法案，要求特朗普结束对伊朗的军事行动，并在今后对伊朗采取任何军事行动前必须获得国会授权。当天的投票结果为50票赞成、47票反对。共和党参议员中有4人投了赞成票，另有3名共和党参议员缺席投票。此前，民主党人已7次在参议院提交旨在限制特朗普在伊朗问题上动武权力的法案。由于共和党占据参议院多数席位，法案均未获得通过。(新华社)", "ctime": 1779425708, "time_str": "12:55:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260522/c676894804.shtml"}, {"id": "4395081", "title": "“创客上海2026”暨第十一届“创客中国”上海中小企业创新创业大赛正式启动", "content": "5月21日上午，由上海市经济和信息化委员会主办的“创客上海2026”暨第十一届“创客中国”上海中小企业创新创业大赛启动仪式在漕河泾会议中心举行。本届“创客上海2026”赛事设置企业组与创业组两个类别，按八大赛道，从5月到9月分阶段开展预赛、复赛和决赛。优胜项目将推荐进入全国总决赛，并获得现金奖励、资金扶持、投融资对接、产业资源导入等全方位赋能服务。（科创板日报）", "ctime": 1779424415, "time_str": "12:33:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260522/c676894476.shtml"}, {"id": "4395079", "title": "洪都拉斯北部两起武装袭击事件已造成24人死亡", "content": "洪都拉斯北部21日发生两起武装袭击事件，已造成24人死亡。洪检察机关发言人尤里·莫拉接受媒体采访时说，科隆省特鲁希略市一座棕榈种植园当天发生武装袭击，已造成至少19人死亡。检方现场确认17具遗体，另有2具遗体可能已被家属带回家中。遇难者身份确认和尸检工作正在进行。另据洪都拉斯警方通报，同日，科尔特斯省奥莫阿市靠近危地马拉边境的地区发生另一起暴力事件，目前已造成5名警察死亡。据悉，洪北部部分地区长期受土地争端、毒品贩运和武装犯罪等问题影响，多年来谋杀、强制驱逐等事件频发。（央视新闻）", "ctime": 1779424156, "time_str": "12:29:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "u const META     = {"update_time": "2026-05-22 15:00:29", "sentiment_score": 57.78894472361809, "agents": []};

// 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
