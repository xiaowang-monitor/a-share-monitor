/20261111/c681700960.shtml"}, {"id": "5626393", "title": "西部证券曹柳龙：中长期来看对A股市场不必悲观", "content": "西部证券首席策略分析师曹柳龙展望后市认为，资本市场改革持续显效，大盘蓝筹股估值不高，中长期来看对A股市场不必悲观。他表示，证券基金保险互换便利为机构提供流动性支持的可靠渠道，回购增持专项再贷款为上市公司与主要股东带来真金白银的资金来源，两项工具在市场承压期间有效阻断负向螺旋、修复机构增持意愿；随着相关工具利率下调并转为长期性安排，市场的自我稳定能力有了制度依托。（人民财讯）", "ctime": 1794382225, "time_str": "15:30:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261111/c681700957.shtml"}, {"id": "5626345", "title": "印度一客机发现劫机威胁纸条　机上乘客已撤离", "content": "据印度媒体11日报道，印度航空公司一架客机在加尔各答一机场起飞前，机上洗手间内发现劫机威胁纸条，随后机上乘客被疏散。(新华社)", "ctime": 1794382051, "time_str": "15:27:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261111/c681700724.shtml"}, {"id": "5626337", "title": "世界最长海底高铁隧道舟山侧完成盾构掘进", "content": "11月11日，随着“定海号”超大直径盾构机完成6270米独头掘进，率先抵达海底设计对接点，由上海国铁建管公司建设，中铁十一局承建的世界最长、直径最大海底高铁隧道金塘海底隧道舟山侧盾构掘进圆满完成。(新华社)", "ctime": 1794382034, "time_str": "15:27:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261111/c681700707.shtml"}, {"id": "5626329", "title": "国安达等成立强脑智身科技公司 含多项机器人业务", "content": "据企查查APP显示，近日，北京市强脑智身科技有限公司成立，经营范围包含工业机器人制造、工业机器人销售、智能机器人的研发与销售、特殊作业机器人制造、服务消费机器人制造等。企查查股权穿透显示，该公司由国安达旗下强脑智身（厦门）机器人有限公司等共同持股。（人民财讯）", "ctime": 1794381955, "time_str": "15:25:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261111/c681700687.shtml"}, {"id": "5626305", "title": "外交部：一贯不干涉他国内政，从来也没兴趣干涉加拿大的内政", "content": "11月11日，外交部发言人郭嘉昆主持例行记者会。路透社记者提问，加拿大总理卡尼称将在APEC期间与中方领导人会晤，并将在会谈中强调中国和其他国家不干涉加拿大内政的重要性。中方对此有何评论？郭嘉昆表示，中方一贯坚持不干涉他国内政，从来也没有兴趣干涉加拿大的内政。（澎湃新闻）", "ctime": 1794381784, "time_str": "15:23:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261111/c681700595.shtml"}, {"id": "5626303", "title": "外交部：中方期待推动中泰命运共同体建设不断迈上新台阶", "content": "11月11日，外交部发言人郭嘉昆主持例行记者会。总台记者提问：中方刚刚发布了李强总理将对泰国进行正式访问的消息。中方如何评价当前中泰关系？对此访有何期待？郭嘉昆表示，中国和泰国是亲密友好邻邦和命运共同体，“中泰一家亲”深入民心。近年来，习近平主席同泰国国王哇集拉隆功实现历史性互访，共同引领两国关系持续向前发展，双方政治互信不断增强，务实合作成果丰硕，给两国人民带来实实在在的福祉。中方期待以此访为契机，同泰方进一步赓续传统友谊，加强战略沟通，深化互利合作，推动中泰命运共同体建设不断迈上新台阶，助力各自现代化进程，也为地区和平稳定与发展繁荣作出更多贡献。（央视新闻）", "ctime": 1794381757, "time_str": "15:22:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261111/c681700573.shtml"}, {"id": "5626287", "title": "王毅同古巴党和政府特使、古共中央政治局委员、外交部长罗德里格斯会谈", "content": "11月11日，中共中央政治局委员、外交部长王毅在北京同古巴党和政府特使、古共中央政治局委员、外交部长罗德里格斯举行会谈。(新华社)", "ctime": 1794381694, "time_str": "15:21:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261111/c681700547.shtml"}, {"id": "5626263", "title": "美官员呼吁收紧对中国获取先进AI芯片的限制，外交部回应", "content": "11月11日，外交部发言人郭嘉昆主持例行记者会。路透社记者提问，在涉及英伟达首席执行官黄仁勋的相关指控出现后，美国国会议员周二再次呼吁收紧对中国获取先进人工智能（AI）芯片的限制。郭嘉昆表示，中方在美国输华芯片问题上的立场是一贯的。（北京日报）", "ctime": 1794381638, "time_str": "15:20:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261111/c681700530.shtml"}, {"id": "5626247", "title": "中方领导人APEC期间是否会与日本首相举行会晤？外交部回应", "content": "11月11日，外交部发言人郭嘉昆主持例行记者会。法新社记者提问，请问发言人，中方领导人是否将在下周APEC会议期间与日本首相高市早苗举行会晤？如确有会晤，双方将讨论哪些议题？郭嘉昆表示，作为2026年APEC东道主，中方积极履行东道主义务，愿同各方一道共同推动APEC中国年取得圆满成功。“关于中日关系，中方已经多次阐明立场。”（澎湃新闻）", "ctime": 1794381615, "time_str": "15:20:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261111/c681700521.shtml"}, {"id": "5626215", "title": "现货白银涨超3%", "content": "现货白银涨超3%，现报53.11美元/盎司。", "ctime": 1794381448, "time_str": "15:17:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261111/c681700337.shtml"}, {"id": "5626207", "title": "外交部：中方期待推动《中国—东盟自贸区3.0版升级议定书》尽快生效", "content": "11月11日，外交部发言人郭嘉昆主持例行记者会。总台记者提问：中方刚刚发布了李强总理出席中国—东盟领导人会议的消息。中方对此次会议有何期待？郭嘉昆表示，今年是中国—东盟建立全面战略伙伴关系5周年。5年来，在双方领导人的共同引领下，中国东盟合作蓬勃发展、成果丰硕，始终走在地区前列，不仅惠及各自国家和人民，也为地区和平稳定繁荣作出重要贡献。当前，世界进入新的动荡变革期，求和平、谋发展、促繁荣是地区人民的最大期盼。中方期待通过此次与会，与东盟国家增进团结互信，凝聚合作共识，推动《中国—东盟自贸区3.0版升级议定书》尽快生效，深化人工智能、数字经济、能源安全、互联互通、减贫发展等领域合作，携手建设和平、安宁、繁荣、美丽、友好的共同家园，为地区的和平发展注入更多的稳定性和确定性。（央视新闻）", "ctime": 1794381374, "time_str": "15:16:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261111/c681700273.shtml"}, {"id": "5626175", "title": "日本公平交易委员会认定亚马逊日本反垄断整改计划，要求调整商品页面最低价展示机制", "content": "11月11日，日本公平交易委员会认定亚马逊日本提交的反垄断整改计划。此前，亚马逊通过算法限制售价高于其他主要电商平台同款商品最低价的卖家获得商品详情页“推荐报价”展示资格，涉嫌限制卖家自主定价并影响平台竞争。根据整改计划，当商品没有符合价格条件的推荐报价时，亚马逊须在商品详情页展示含运费价格最低的可购买报价及购买入口，并持续实施5年。（界面新闻）", "ctime": 1794381274, "time_str": "15:14:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261111/c681700200.shtml"}, {"id": "5626143", "title": "瑞银王宗豪：快钱对AI科技持仓已回落至2026年初水平", "content": "瑞银中国股票策略研究主管王宗豪表示，2026年三季度外资机构中国股票仓位总体保持不变，为低配-0.9%；国际投资者增持医疗保健、互联网和科技板块，减持保险、基础材料和汽车板块。北向资金上一季度净流入330亿美元创纪录，三季度转为净流出130亿美元，科技和工业板块流出居前，金融和医疗保健板块获买入；中国股票配置比例由7.6%小幅升至7.8%。南向资金净流入由二季度100亿美元增至三季度170亿美元，买入集中在IT、互联网和材料板块。快钱已大幅减持中国AI科技硬件，持仓回落至2026年初水平；内地公募基金仅小幅降低对科技板块的超配幅度。瑞银倾向于科技硬件与银行相结合的杠铃策略。（21世纪经济报道）", "ctime": 1794381113, "time_str": "15:11:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261111/c681700120.shtml"}, {"id": "5626111", "title": "金证股份中标某头部券商信创新一代核心柜台建设项目", "content": "据金证股份消息，近日，金证股份新一代核心交易平台FS2.5成功中标某头部券商信创新一代核心柜台建设项目。（人民财讯）", "ctime": 1794380995, "time_str": "15:09:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261111/c681700051.shtml"}, {"id": "5626081", "title": "截至“十四五”末全国执业注册会计师超10万人", "content": "财政部会计司司长林启云11月11日表示，截至“十四五”末，全国会计师事务所（含分所）数量超1万家，执业注册会计师超10万人，每年为420万家企事业单位提供专业服务；全国代理记账机构数量超16万家，专职从业人员超58万人，服务中小微企业超1600万家。(新华社)", "ctime": 1794380834, "time_str": "15:07:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261111/c681699958.shtml"}, {"id": "5626031", "title": "伊朗称一艘油轮在霍尔木兹海峡起火", "content": "当地时间11日，伊朗军队海军表示，当天清晨，一艘“违规油轮”在霍尔木兹海峡以东的一处不安全区域触碰水雷，随后起火。(央视新闻)", "ctime": 1794380713, "time_str": "15:05:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261111/c681699872.shtml"}, {"id": "5625987", "title": "中国互联网金融协会互联网贷款自律工作委员会筹备组第三次会议在京召开", "content": "11月6日，中国互联网金融协会互联网贷款自律工作委员会筹备组第三次会议在京召开，协会秘书处主持，度小满、蚂蚁科技、腾讯、京东科技、抖音等筹备组成员单位出席。会议审议通过筹备工作报告，同意按流程提请成立工作委员会。会议认为筹备组聚焦互联网助贷业务领域，报送多期热点前沿问题专报，开展信贷资金挪用风险专项审计；会议强调工作委员会是助贷平台自律管理的机制保障，成员单位应严把准入关，按更高标准、更严要求稳慎推进遴选，并通过信息报送、自律检查、专项审计、年度评估评价等方式加强自律管理。（人民财讯）", "ctime": 1794380628, "time_str": "15:03:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261111/c681699838.shtml"}, {"id": "5625959", "title": "李强将访问泰国并赴菲律宾出席中国—东盟领导人会议", "content": "外交部发言人宣布：应泰国总理阿努廷邀请，国务院总理李强将于11月13日至15日对泰国进行正式访问。应东盟轮值主席国菲律宾总统马科斯邀请，国务院总理李强将于11月15日至16日赴菲律宾马尼拉出席第29次中国—东盟领导人会议。（外交部）", "ctime": 1794380601, "time_str": "15:03:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261111/c681699821.shtml"}, {"id": "5625851", "title": "ETF两市成交额报4935.0亿元，较昨日此时缩量79.0亿元", "content": "截至目前，ETF两市成交额报4935.0亿元，较昨日此时缩量79.0亿元，分类型来看，股票型ETF成交额1744.58亿元，债券型ETF成交额2112.86亿元，货币型ETF成交额344.49亿元，商品型ETF成交额73.35亿元，QDII型ETF成交额659.72亿元。其中，成交额最高的非货币型ETF分别是中韩半导体ETF（513310）、创业板ETF（159915）、科创50ETF（588000），成交额分别为：189.32亿元、113.86亿元、92.76亿元。", "ctime": 1794380520, "time_str": "15:02:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261111/c681699769.shtml"}, {"id": "5625819", "title": "ETF收评：通信ETF领涨8.00%，酒ETF领跌2.91%", "content": "ETF收盘涨跌不一，通信ETF（515880）领涨8.00%，成长ETF（159259）涨7.96%，通信ETF（159583）涨7.30%，酒ETF（512690）领跌2.91%，食品饮料ETF（159843）跌2.3%，食品饮料ETF（159862）跌2.29%。", "ctime": 1794380496, "time_str": "15:01:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261111/c681699763.shtml"}, {"id": "5625769", "title": "均胜电子向宇树科技交付首台机器人高算力大脑背包", "content": "均胜电子官微消息，11月10日，均胜电子旗下宁波超平面机器人科技公司正式向宇树科技交付首台机器人高算力大脑背包，双方战略合作迈入产品交付阶段。同时，双方正加速推进机器人关键部件及工业场景应用共研，有望在年内取得更多积极进展。机器人核心部件方面，双方联合攻关机器人高算力自供电大脑背包、灵巧手、高性能固态电池能源管理系统等核心部件，形成可批量量产、适配多种形态机器人的标准化零部件产品方案，补齐机器人算力、续航和执行机构等行业短板。", "ctime": 1794380468, "time_str": "15:01:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261111/c681699755.shtml"}, {"id": "5625701", "title": "A股收评：创业板指低开高走涨超3%，算力硬件股午后爆发", "content": "A股三大指数今日集体上涨，截至收盘，上证指数涨0.46%，深证成指涨1.32%，创业板指涨3.11%，北证50涨2.3%，科创50指数涨2.8%。全市场成交额16887亿元，较上日放量1719亿元，全市场超3500只个股上涨。板块题材上，元件、CPO、光纤概念、PCB概念、游戏、半导体板块涨幅居前；白酒、机场航运、乳业、猪肉、免税店板块跌幅居前。盘面上，元件板块午后持续走高，东山精密、深南电路、沪电股份、景旺电子、奥士康触及涨停，南亚新材、胜宏科技、生益电子涨幅居前。CPO板块午后大幅拉升，源杰科技、长飞光纤、剑桥科技、华盛昌、光迅科技等十余股触及涨停，新易盛、中际旭创、天孚通信均涨超10%。半导体板块亦表现活跃，利扬芯片触及20cm涨停，炬光科技、燧原科技、寒武纪涨幅居前。白酒板块全天低迷，皇台酒业、今世缘、古井贡酒跌幅居前。", "ctime": 1794380438, "time_str": "15:00:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261111/c681699739.shtml"}, {"id": "5625693", "title": "股指期货午盘收盘 主力合约多数收涨", "content": "股指期货午盘收盘，主力合约多数收涨。沪深300股指期货(IF)主力合约涨0.35%，上证50股指期货(IH)主力合约跌0.45%，中证500股指期货(IC)主力合约涨1.04%，中证1000股指期货(IM)主力合约涨1.37%。", "ctime": 1794380436, "time_str": "15:00:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261111/c681699737.shtml"}, {"id": "5625563", "title": "瑞银王宗豪：外资中国股票仓位总体不变，仍看好中国AI科技硬件", "content": "瑞银中国股票策略研究主管王宗豪指出，对约800只外资主动型基金的跟踪显示，三季度外资机构投资者的中国股票仓位总体保持不变；国际投资者增持最多的是医疗保健、互联网和科技板块（可能来自IPO和配售），减持保险、基础材料和汽车板块。鉴于风险回报具有吸引力，瑞银仍看好中国AI科技硬件，但近期全球科技股大跌可能对中国国内相关个股产生进一步连锁影响。鉴于AI市场情绪仍较脆弱且公募基金AI科技硬件持仓仍处于高位，他建议采用科技硬件与银行相结合的杠铃策略。（人民财讯）", "ctime": 1794380180, "time_str": "14:56:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261111/c681699638.shtml"}, {"id": "5625527", "title": "中际旭创成交额达300亿元", "content": "中际旭创成交额达300亿元，现涨14.99%。", "ctime": 1794379892, "time_str": "14:51:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261111/c681699524.shtml"}, {"id": "5625477", "title": "美媒：情报显示伊朗仍有战前一半弹道导弹产能", "content": "据彭博社10日报道，西方情报评估显示伊朗每月可制造约50枚弹道导弹，约为战前产能的一半；若敌对行动再次发生，伊朗仍具备强大报复手段。美方自美以伊冲突爆发初期即称伊朗武器库及重建能力已被彻底削弱，美国国防部长赫格塞思本月10日重申伊朗80%工业基础已被摧毁，但一名西方官员援引军事情报称伊朗很可能仍保有至少1700枚弹道导弹。伊朗外交部尚未回应。另据伊朗塔斯尼姆通讯社报道，伊朗革命卫队10日公布新建地下“导弹城”，总参谋长阿卜杜拉希称“未来战争中的惊喜将会一个接一个地揭晓”。此前革命卫队发言人穆赫比称伊朗已将导弹和无人机生产线转移至地下。（新华社）", "ctime": 1794379686, "time_str": "14:48:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261111/c681699446.shtml"}, {"id": "5625453", "title": "受美国退伍军人节影响 美国EIA原油及天然气库存数据推迟公布", "content": "受美国退伍军人节（11月11日）影响，美国EIA原油库存数据将推迟至北京时间11月13日01:00公布，美国EIA天然气库存数据将推迟至北京时间11月13日23:30公布。", "ctime": 1794379565, "time_str": "14:46:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261111/c681699390.shtml"}, {"id": "5625359", "title": "任天堂新款塞尔达游戏全球销量突破520万份", "content": "任天堂新款塞尔达游戏全球销量突破520万份。（财联社）", "ctime": 1794379144, "time_str": "14:39:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261111/c681699193.shtml"}, {"id": "5625293", "title": "俄罗斯安全部门称在加里宁格勒州破获一个波兰情报网络", "content": "俄罗斯联邦安全局11月11日通报，2名波兰军事情报局和国内安全局特工涉嫌在加里宁格勒州从事间谍活动被逮捕，两人曾收集该州军事设施、军人信息及经济社会情况信息，相关部门已刑事立案。另有7名波兰公民和3名俄罗斯公民曾与波兰情报人员接触，被警告不得从事间谍行为和叛国行为；14名波兰公民的俄罗斯签证被取消，6名波兰公民被限制入境。（央视新闻）", "ctime": 1794378870, "time_str": "14:34:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261111/c681699080.shtml"}, {"id": "5625275", "title": "两项二氧化碳捕集、利用与封存国家标准正式发布", "content": "市场监管总局批准发布《油气区二氧化碳地质利用与封存潜力评价方法 第2部分：地质封存》和《油气区地质体二氧化碳埋存量评价实验方法》两项CCUS国家标准。前者明确资料收集、潜力区筛选、地质体适宜度评估、封存量计算等技术要求，填补油气区封存筛选与潜力评价标准空白；后者对实验装置、操作流程、数据处理作出系统规定，解决埋存量关键参数实验方法不统一、数据可比性不足等难题。两项标准将推动油气区二氧化碳地质封存从“有潜力”向“可规划、可实施、可监管”转变。（央视新闻）", "ctime": 1794378804, "time_str": "14:33:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261111/c681699020.shtml"}, {"id": "5625271", "title": "特斯拉中国回应网传特斯拉召回车辆并赔偿2800元：系诈骗 切勿点击相关链接", "content": "网传落款11月10日的文件称，特斯拉车辆因后减震器及后弹簧存在制造缺陷隐患实施召回，按每辆车2800元统一赔偿标准理赔，赔偿款由“中国银联中心”发放至车主银联账户、支付宝或银行账户。特斯拉中国官方客服回应称，该短信非官方发布，系诈骗，无需进店，切勿点击链接，输入手机号+验证码可能直接造成账户扣款；特斯拉近期未发送任何召回短信，提醒车主提高警惕，避免个人信息泄露及财产损失。（每经）", "ctime": 1794378799, "time_str": "14:33:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261111/c681699011.shtml"}, {"id": "5625255", "title": "日韩股市集体收涨", "content": "日经225指数收涨1.30%，报61248.59点。韩国综指收涨2.60%，报5375.36点。", "ctime": 1794378758, "time_str": "14:32:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261111/c681698983.shtml"}, {"id": "5625249", "title": "创业板ETF易方达成交额100亿 多只宽基ETF较昨日放量", "content": "截至发稿时间，整体宽基ETF（340只）成交额840亿超越昨日全天，其中创业板ETF易方达（159915）成交额达100亿，涨幅为3.35%；科创50ETF华夏（588000）成交额82亿元、中证A500ETF国泰（159338）成交额62亿、创业板ETF广发（159952）14亿、中证1000ETF易方达（159633）11.5亿均超越昨日全天成交。", "ctime": 1794378751, "time_str": "14:32:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261111/c681698981.shtml"}, {"id": "5625003", "title": "华利集团：拟入股光通信企业属财务投资 仍将专注于制鞋主业", "content": "针对拟最高斥资约5亿美元入股光通信企业的事项，11月11日，华利集团回应称，此次投资旨在增加财务收益、为股东创造更大价值，利用自有资金进行财务投资，并不谋求控股地位；标的公司技术具备一定先进性，与国际龙头企业接轨，公司看好其未来发展。截至目前，投资事项已完成董事会授权，具体投资金额、比例、标的公司估值等仍在进一步商讨。（中证金牛座）", "ctime": 1794378315, "time_str": "14:25:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261111/c681698828.shtml"}, {"id": "5624967", "title": "港珠澳大桥口岸经海关跨境电商平台出口破千亿元", "content": "据海关统计，今年前10个月，经港珠澳大桥珠海公路口岸通过海关跨境电商管理平台出口达1120亿元，同比增长33.1%，已超2025年全年。目前，经该口岸出口的包裹日均超300万个，覆盖全球200多个国家和地区。（央视新闻）", "ctime": 1794378223, "time_str": "14:23:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261111/c681698790.shtml"}, {"id": "5624963", "title": "日本大型移动通信运营商出现全国性服务故障", "content": "日本大型移动通信运营商都科摩通信公司11月11日表示，该公司当天出现全国性移动通信服务故障，故障原因正在调查中。（财联社）", "ctime": 1794378214, "time_str": "14:23:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261111/c681698782.shtml"}, {"id": "5624959", "title": "报告称委内瑞拉120亿美元出口收入进入美控制账户", "content": "据委内瑞拉方面10日消息，2026年前9个月，美国政府通过其监管的银行账户从委自然资源出口收入中获得超过120亿美元资金。毕马威机密报告显示，今年1月至9月委出口石油、矿产品和化肥获122.6亿美元收益进入美国监管账户，大部分资金在委央行请求并经美国务院及财政部官员核实后已陆续返还。今年1月3日美国对委发动大规模军事打击，控制委总统马杜罗及其妻子并带至美国；特朗普称美国将“管理”委直至“安全”过渡，美大型石油企业将进入委投资。能源部长赖特称委石油销售将由美国政府控制，包括库存及今后“无限期”销售，收入将存入美控制账户。委政府已与埃克森美孚签署谅解备忘录，涵盖现有油田及新项目，涉及储量高达“数十亿桶”，以实现石油增产。（央视新闻）", "ctime": 1794378189, "time_str": "14:23:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261111/c681698771.shtml"}, {"id": "5624931", "title": "里昂：维持网易“跑赢大市”评级，看好其具备将AI融入游戏的优势", "cont const SECTORS  = [{"name": "金融", "hit_count": 33, "etfs": []}, {"name": "人工智能", "hit_count": 30, "etfs": []}, {"name": "数据要素", "hit_count": 21, "etfs": []}, {"name": "消费", "hit_count": 16, "etfs": []}, {"name": "半导体", "hit_count": 14, "etfs": []}, {"name": "机器人", "hit_count": 11, "etfs": []}, {"name": "新能源", "hit_count": 8, "etfs": []}, {"name": "军工", "hit_count": 5, "etfs": []}];
const META     = {"update_time": "2026-11-11 15:55:14", "sentiment_score": 57.990867579908674, "agents": []};

// 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
