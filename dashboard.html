.score-bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s; }
.up { color: var(--red); }
.down { color: var(--green); }

网络侵权盗版“剑网2026”专项行动，这是四部门第22次聚焦重点作品领域及重点网络平台开展专项治理工作。 本次专项行动于6月至11月开展，聚焦4个重点领域：一是以影视剧版权保护为重点，着力整治网盘、浏览器、搜索引擎等网络服务平台主动提供盗版影视资源及相关服务，以直播、代找、引流等方式传播或者售卖盗版影视资源等违法行为。二是以文创版权保护为重点，着力整治文创领域同质化剽窃、跟风式抄袭、虚假版权登记、仿冒知名IP、虚假IP联名、伪造授权生产文创产品并通过线上线下渠道售卖等违法行为。三是以图书版权保护为重点，重点查处“按需盗印”、真假混卖、恶意串货、网络引流销售盗版图书及电子图书资源等违法行为。四是以人工智能领域版权整治为重点，推动解决大模型训练语料版权合规问题。 国家版权局有关负责人表示，本次专项行动将通过对重点领域专项治理，不断规范视听、文创、图书等重点领域版权秩序，服务文化产业创新发展，助力书香社会建设，完善新兴领域版权保护制度，进一步释放全社会创新创造活力。专项行动将突出查办案件，欢迎广大权利人和网民积极投诉举报，提供侵权盗版案件线索。(新华社)", "ctime": 1780387338, "time_str": "16:02:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260602/c677152541.shtml"}, {"id": "4443015", "title": "美股大型科技股盘前涨跌互现，谷歌A跌1%", "content": "美股大型科技股盘前涨跌互现，英伟达涨1%，Meta涨0.6%，苹果涨0.2%，特斯拉涨0.1%，亚马逊跌0.5%，微软、谷歌A跌1%。", "ctime": 1780387311, "time_str": "16:01:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260602/c677152430.shtml"}, {"id": "4443011", "title": "美股中概股盘前多数上涨，理想汽车涨7%", "content": "美股中概股盘前多数上涨，理想汽车涨7%，阿里巴巴涨6%，京东涨5%，哔哩哔哩涨4%，百度、蔚来涨3%，拼多多涨2%，亚玛芬体育跌2%。", "ctime": 1780387304, "time_str": "16:01:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260602/c677152401.shtml"}, {"id": "4443007", "title": "科大智能：与华西能源签署约1.3亿美元框架合同", "content": "科大智能公告，公司与华西能源签署了《伊拉克巴格达Al-Daura热电厂4×160MW燃油发电重建项目设备采购框架合同》，暂估总价约为1.3亿美元。该合同的签署有助于公司开拓海外市场，推进数字能源业务发展。合同自双方签字盖章之日起生效，具体实施时间尚未确定，对本年度及未来的财务影响尚不确定。", "ctime": 1780387286, "time_str": "16:01:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260602/c677152321.shtml"}, {"id": "4443001", "title": "三川智慧：同意将所持有的景川水务57.7634%的股权以369.37万元转让给鹰潭市龙虎山景区龙兴国有资产运营管理（集团）有限公司", "content": "三川智慧公告，同意公司将所持有的景川水务57.7634%的股权，以评估价人民币369.37万元转让给鹰潭市龙虎山景区龙兴国有资产运营管理（集团）有限公司。本次交易完成后，公司将不再持有景川水务的股权。", "ctime": 1780387267, "time_str": "16:01:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260602/c677152238.shtml"}, {"id": "4442953", "title": "中国石油顺利完成澳门首笔货币桥跨境交易", "content": "2026年6月1日，“中国——葡语国家央行数字货币发展与跨境创新应用高端研讨会”在澳门成功举办。中国石油与中国银行紧密协作，顺利完成澳门与香港间的首笔多边央行数字货币桥（mBridge，简称“货币桥”）跨境交易，有效提升粤港澳大湾区跨境资金效率；成功落地澳门通往阿联酋的首笔“货币桥”跨境交易，为人民币直接进入中东市场开辟新通道。(中国石油)", "ctime": 1780387168, "time_str": "15:59:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260602/c677151996.shtml"}, {"id": "4442923", "title": "欧洲议会投票通过欧美贸易协议", "content": "当地时间6月2日，欧洲议会国际贸易委员会投票通过欧美贸易协议。2025年7月，美国总统特朗普和欧盟委员会主席冯德莱恩在英国宣布美欧达成新贸易协议，但后来双方因美国索要丹麦自治领地格陵兰岛引发关系紧张，加之美国最高法院裁定美国政府大规模关税政策违法等原因，欧盟对协议的批准经历数月延迟。今年3月26日，欧洲议会投票支持有条件执行欧美贸易协议，但希望增加一些保障措施。今年5月，欧盟各成员国就议会的建议达成一致。（央视新闻）", "ctime": 1780386915, "time_str": "15:55:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260602/c677151841.shtml"}, {"id": "4442877", "title": "新诺威：SYS6043在533例患者中客观缓解率（ORR）为41.8%", "content": "新诺威公告，控股子公司巨石生物在2026年ASCO年会公布SYS6043的I期临床研究数据。SYS6043是一款新型B7-H3靶向ADC，载荷为拓扑异构酶I抑制剂，药物抗体比（DAR）约为6。研究是一项在中国开展的多中心、开放标签、单臂的I/II期临床试验，旨在评估SYS6043在晚期实体瘤患者中的安全性、耐受性、药代动力学特征和初步疗效。截至2026年3月31日，该研究共纳入627例患者，其中包括168例肺癌、147例妇科肿瘤、137例乳腺癌、66例鼻咽癌、50例头颈鳞癌、22例食管鳞癌、14例肝癌和23例其他瘤种。在533例疗效可评估的患者中，客观缓解率（ORR）为41.8%，疾病控制率（DCR）为81.4%，中位缓解持续时间（mDoR）为6.9个月。", "ctime": 1780386557, "time_str": "15:49:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260602/c677151483.shtml"}, {"id": "4442875", "title": "思泉新材：公司中标某液冷产品项目", "content": "思泉新材公告，公司近日收到某客户的中标通知，确认公司为某液冷产品项目的中标单位。根据本次交易涉及的保密条款要求，公司对客户信息及项目中标细节予以豁免披露。", "ctime": 1780386548, "time_str": "15:49:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260602/c677151479.shtml"}, {"id": "4442873", "title": "Stellantis集团高层到访岚图汽车，双方全球化合作进入加速推进阶段", "content": "6月2日，Stellantis集团执行副总裁、中国及亚太区负责人奥立维一行到访岚图汽车，实地参观岚图工厂和全功能用户中心，并就下一步战略合作进行深入交流。此次高层互动，是东风汽车与Stellantis集团签署深化战略合作谅解备忘录后，双方围绕岚图海外业务开展的重要对接，标志着双方合作正由战略共识加快向落地实施推进，岚图全球化布局进入新的提速阶段。（人民财讯）", "ctime": 1780386497, "time_str": "15:48:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260602/c677151453.shtml"}, {"id": "4442869", "title": "安森美与英伟达合作 布局新兴800V直流电源架构", "content": "安森美最新宣布，进一步拓展在英伟达MGX 生态系统中的角色，提供先进电源解决方案，为下一代AI数据中心及加速计算平台提供支持。目前，安森美相关技术已应用于现有MGX系统，在功率场效应晶体管（FET）、多相供电方案、SiC JFET及GaN技术等领域有望持续增长。双方合作还将拓展至新兴的800V直流（800 VDC）电源架构，以支持计算密度不断提升的AI应用环境。（人民财讯）", "ctime": 1780386447, "time_str": "15:47:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260602/c677151421.shtml"}, {"id": "4442857", "title": "美伊再起多次零星交火 伊朗称必要时将“动用一切能力”", "content": "伊朗外交部6月1日发表声明，谴责美国和以色列持续违反停火协议，强调任何战线上的停火遭到破坏，都意味着违背整体停火安排，并表示伊朗将在必要情况下“动用一切能力捍卫自身利益”。伊朗当地时间1日，美军中央司令部发表声明称，周末对伊朗戈鲁克地区和格什姆岛的雷达及无人机指挥控制设施实施了“自卫性打击”。随后，伊朗伊斯兰革命卫队公共关系部门发表声明称，美军“一小时前”对位于霍尔木兹甘省锡里克岛上的一座通信塔发动侵略后，“伊朗伊斯兰革命卫队航空航天部队对侵略源头的空军基地进行打击，并摧毁了预定目标。如果侵略再次发生，回应将截然不同，责任在于侵略者和美国政权”。（新华社）", "ctime": 1780386234, "time_str": "15:43:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260602/c677151350.shtml"}, {"id": "4442853", "title": "宇树科技：宇树单款人形机器人累计生产下线约11000台", "content": "据宇树科技消息，宇树单款人形机器人累计生产下线约11000台 。", "ctime": 1780386221, "time_str": "15:43:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260602/c677151344.shtml"}, {"id": "4442845", "title": "乌称俄袭击已致13人死亡上百人受伤", "content": "当地时间6月2日，乌克兰内务部长克利缅科通报，俄罗斯于当日凌晨对乌克兰发动联合袭击，造成乌境内13人死亡、百余人受伤，多座城市的民用基础设施遭到严重损毁。根据通报，本次袭击中，基辅、第聂伯罗、哈尔科夫三座城市受损最为严重。基辅全市共有29处区域遭袭击波及，目前大部分火情已被控制，仍有5个区的6处现场在持续开展处置工作。此次袭击造成基辅4人死亡、60余名居民受伤就医，伤者中包括一名遭弹片划伤的3岁儿童。当地受损设施包含居民楼、汽车销售中心、院校、加油站等民用建筑。乌克兰内务部一处服务中心也突发火情，该网点的相关业务已调整至基辅其他内务服务中心办理。（央视新闻）", "ctime": 1780386154, "time_str": "15:42:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260602/c677151309.shtml"}, {"id": "4442843", "title": "李家超：香港赴哈萨克斯坦访问已取得多项成果，将达成43份备忘录及合作协议", "content": "香港特区行政长官李家超今日（2日）在哈萨克斯坦会见传媒。李家超表示，这次是他首次率领代表团出访中亚，此次访问有三个目的：第一是进一步开拓新兴市场，为推动长远经贸发展奠定基础。第二是加强政府与政府之间的关系与往来，推进双方更紧密合作。第三是构建枢纽对枢纽的合作模式。李家超介绍，这次哈萨克斯坦的访问取得多项成果，商贸代表团将达成43份备忘录及合作协议，涵盖包括经贸、投资、金融服务、科技、航空、绿色金融等多个范畴。当中成果包括：首先，香港的航空公司将会在明年首季，开通飞往哈萨克斯坦阿拉木图的直航航班。第二，双方协议加强人工智能和数字发展的合作，推动数码基建发展，包括哈萨克斯坦会在香港举办路演，吸引投资者及专业服务机构参与。第三，香港三大创科园——即数码港、科技园、港深创科园，与阿斯塔纳枢纽协议加强创科合作。第四，香港交易及结算所与阿斯塔纳枢纽及阿斯塔纳国际金融中心协议加强合作，促进绿色金融生态系统的发展，跨境上市及大宗商品交易市场的合作机遇。第五，香港的资本公司与哈萨克斯坦主权财富基金共同投资1亿美元，在哈萨克斯坦建立区域血液净化产品制造中心。（大湾区之声）", "ctime": 1780386081, "time_str": "15:41:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260602/c677151230.shtml"}, {"id": "4442811", "title": "原华为盘古“90后少帅”离职创业，新公司已获1亿美元估值新融资", "content": "据悉，在今年3月末宣布离开华为后，原华为诺亚方舟实验室主任、华为盘古大模型负责人王云鹤，目前已投身AI Agent相关领域创业。多位知情人士对新浪科技透露，王云鹤新创立公司名为“基元律动”，目前该公司融资进展很顺利——已完成一轮1亿美元估值新融资，出资方包括一线风险投资机构及头部互联网企业。在团队分工上，王云鹤主要担任基元律动首席执行官（CEO），原华为诺亚方舟实验室首席研究员韩凯也已加入公司并担任首席技术官（CTO）。目前，基元律动也正在开启团队研发队伍扩充及产品相关人员引进。在BOSS直聘等招聘平台上，基元律动已发布多个AI Agent相关岗位，涉及AI Agent开发、算法及安全合规等方向，年薪在60万-100万之间。据前述知情人士对新浪科技透露，获得资本加持外，目前基元律动已有稳定的国资背景大厂客户，接下来几个月也将陆续有新产品推出。（新浪科技）", "ctime": 1780385812, "time_str": "15:36:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260602/c677150953.shtml"}, {"id": "4442791", "title": "墨西哥总统指责美国极右翼势力干涉墨西哥内政", "content": "6月1日，墨西哥总统克劳迪娅·辛鲍姆指责美国极右翼势力正与墨西哥国内部分团体勾结，试图攻击墨西哥政府，干涉墨西哥内政。此举进一步升级了她对美国极右翼势力的批评。辛鲍姆此番言论是在当天举行的一场集会后发表的，她说，“我认为是美国的极右翼势力出于意识形态分歧，想破坏美国与墨西哥的友好关系。”不过辛鲍姆同时表示，她不认为这些攻击是由美国总统特朗普直接策划的。（央视新闻）", "ctime": 1780385479, "time_str": "15:31:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260602/c677150710.shtml"}, {"id": "4442787", "title": "以军称在加沙地带打死五名武装人员", "content": "当地时间6月2日，以色列国防军表示，过去几天内，以军在加沙地带实施多次打击行动，打死五名被以方认定为对以军构成“直接威胁”的武装人员。以军称，相关人员为巴勒斯坦伊斯兰抵抗运动（哈马斯）和巴勒斯坦伊斯兰圣战组织（杰哈德）成员。目前，哈马斯方面对此暂无回应。（央视新闻）", "ctime": 1780385445, "time_str": "15:30:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260602/c677150696.shtml"}, {"id": "4442779", "title": "美防长称支持日本扩大军事合作，外交部：绥靖纵容终将养虎为患", "content": "6月2日，外交部发言人毛宁主持例行记者会。有记者提问，日前，日本首相高市早苗在社交平台上发文表示，“在战后最严峻的安保环境下，为了防卫而提升威慑力，防范纷争于未然，正是修改防卫装备转移三原则的本质。”近期，美国防长赫格塞思也公开表示，欢迎日本“修改防卫装备转移三原则”，称支持日本扩大军事合作。国际上有声音认为，日本强化防卫能力是为了遏制和制衡中国，请问发言人对此有何评论？毛宁表示，炒作外部威胁、为扩军备战找借口，是日本军国主义的惯用手法。《波茨坦公告》等国际文件明确规定，日本需完全解除武装，不得维持能使其重新武装的产业，这是日本的国际法义务。然而日本解禁杀伤性武器出口，强化军工产业，安保政策加速向进攻性转变。这一系列危险的动向同二战前军国主义筹备发动战争的过程何其相似。“历史上对军国主义的绥靖纵容教训惨痛。殷鉴不远，军国主义的魔盒一旦打开，没有任何人可以独善其身，终将养虎为患。”毛宁说。（澎湃新闻）", "ctime": 1780385434, "time_str": "15:30:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260602/c677150683.shtml"}, {"id": "4442757", "title": "市场监管总局等三部门：支持保健食品新功能产品创新，保障产品质量安全有效", "content": "市场监管总局、工业和信息化部、民政部印发《保健食品护老提升 专项行动工作方案》。其中提出，严格发酵、酶解、合成等特定工艺保健食品原料的安全性审查，支持保健食品新功能产品创新，保障产品质量安全有效，满足多元化健康需求。将条件比较成熟、安全风险相对较低、消费需求多、产业基础好的原料及时纳入保健食品原料目录，持续拓展保健食品原料目录。", "ctime": 1780385201, "time_str": "15:26:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260602/c677150509.shtml"}, {"id": "4442753", "title": "外交部：希望菲方别任由个别跳梁小丑，一再破坏双方稳定关系的努力", "content": "6月2日，外交部发言人毛宁主持例行记者会。有记者提问，菲律宾国防部长特奥多罗在香格里拉对话会上称，中方曾向菲律宾提供化肥和燃料等物资，但未展现长期诚意，是包装和欺骗，不管如何粉饰对菲律宾的帮助都无济于事，不会改变马尼拉对中国的看法。他还称菲律宾在领土和政治上均面临中方严重威胁，中方对此有何评论？毛宁表示，这位菲律宾防长多次发表涉华谬论，你刚才提到他的有关最新表态，再次表明此人完全不顾菲民生福祉，完全没有任何知恩感恩之心，只有个人私利，甚至不惜拿民生问题搞政治作秀，严重损害中菲关系和双方互信，也完全不符合菲国家和人民的利益。（澎湃新闻）", "ctime": 1780385181, "time_str": "15:26:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260602/c677150499.shtml"}, {"id": "4442749", "title": "伊朗称仍在评估谅解备忘录最终文本，尚未回应美方", "content": "伊朗迈赫尔通讯社2日援引消息人士的话报道说，伊朗仍在评估谅解备忘录的最终文本，尚未向美方作出回应。该消息人士说，美国历来不遵守协议，且双方长期以来互不信任，导致伊朗对此文本持格外审慎的态度。该消息人士还说，伊朗希望根据以往的经验，获得切实利益。(新华社)", "ctime": 1780385159, "time_str": "15:25:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260602/c677150497.shtml"}, {"id": "4442711", "title": "中国内地航线燃油附加费将下调", "content": "记者6月2日从中国国航等航空公司获悉，自6月5日0时起销售的中国内地航线客票，燃油附加费将下调。具体标准为：800公里（含）以下航线每航段80元，800公里以上航线每航段150元。婴儿旅客免收燃油附加费，儿童、革命伤残军人、因公致残人民警察客票燃油附加费减半收取。据介绍，对比现行燃油附加费标准，800公里（含）以下航线将下调10元，800公里以上航线将下调20元。（新华社）", "ctime": 1780384708, "time_str": "15:18:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260602/c677150240.shtml"}, {"id": "4442695", "title": "星海图发布自研双足人形机器人", "content": "6月2日，星海图正式发布自研双足人形机器人Kengo（行客）。（界面新闻）", "ctime": 1780384590, "time_str": "15:16:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260602/c677150174.shtml"}, {"id": "4442683", "title": "美媒：俄2024年底以来首次补给驻叙空军基地", "content": "据美国《华尔街日报》6月1日报道，一艘货轮今年3月自俄罗斯圣彼得堡出发，于5月抵达叙利亚塔尔图斯港，为俄罗斯赫迈米姆空军基地运送军事装备。报道称，这是2024年12月叙政权更迭后，俄方首次向赫迈米姆空军基地运送补给。（新华社）", "ctime": 1780384500, "time_str": "15:15:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260602/c677150123.shtml"}, {"id": "4442669", "title": "特朗普被曝拟放弃“反武器化”基金计划", "content": "据新华社，知情人士透露，在遭国会两党议员质疑并面临司法挑战后，美国总统特朗普计划放弃一项总额约18亿美元的“反武器化”基金计划。该基金原计划用于补偿前总统拜登时期美国政府被“武器化”的“受害者”。美国阿克西奥斯新闻网站6月1日报道，两名美国高级政府官员说，这项基金“目前已被搁置”。（新华社）", "ctime": 1780384435, "time_str": "15:13:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260602/c677150100.shtml"}, {"id": "4442647", "title": "美据报或在欧洲增加核部署", "content": "美国正在讨论是否在其他北约欧洲成员国部署核武器。美国已在六个欧洲国家部署了具备核打击能力的轰炸机，而美方官员最新释放出信号，表示对在现有六国之外进行额外部署“持开放态度”。此举将涉及让更多国家托管所谓的美国“双功能飞机”（DCA）——即可执行核打击任务的战机，但同时提醒，扩大美国核托管协议的达成尚不紧迫。包括波兰和一些波罗的海国家在内的北约“东翼”国家对此表现出兴趣，相关讨论正在北约渠道内进行。（CCTV国际时讯）", "ctime": 1780384289, "time_str": "15:11:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260602/c677150035.shtml"}, {"id": "4442643", "title": "现货黄金站上4540美元/盎司", "content": "现货黄金站上4540美元/盎司，日内涨1.24%。纽约期金站上4570美元/盎司，日内涨1.43%。", "ctime": 1780384287, "time_str": "15:11:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260602/c677150031.shtml"}, {"id": "4442587", "title": "襄阳轴承：巴西工厂落成开业 补齐南美产能板块", "content": "近日，襄轴巴西工厂举行开业庆典。此前，公司已建成中国、波兰两大生产基地。巴西工厂正式投用，成功补齐南美产能板块，形成波兰工厂辐射欧洲、巴西工厂覆盖美洲的全球化产能格局。（人民财讯）", "ctime": 1780384087, "time_str": "15:08:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260602/c677149845.shtml"}, {"id": "4442551", "title": "韩正将赴俄罗斯出席第二十九届圣彼得堡国际经济论坛并访问白俄罗斯", "content": "外交部发言人宣布：应俄罗斯联邦政府和白俄罗斯共和国政府邀请，国家副主席韩正将于6月4日至8日赴俄罗斯出席第二十九届圣彼得堡国际经济论坛，并对白俄罗斯进行访问。(外交部网站)", "ctime": 1780383940, "time_str": "15:05:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260602/c677149753.shtml"}, {"id": "4442521", "title": "王文涛部长会见巴西外交部长维埃拉", "content": "6月1日，商务部部长王文涛在京会见巴西外交部长维埃拉。双方就中巴经贸关系和多边框架下合作等议题进行交流。王文涛表示，中巴两国是东西半球最大的发展中国家和重要新兴市场，在元首外交战略引领下，两国经贸合作长期保持健康稳定发展。当前国际局势发生深刻复杂变化，中巴作为全球南方重要代表，应携手共同应对挑战。中方愿与巴方一道，不断加强战略对接和沟通协作，深化务实合作，共同反对单边主义、保护主义，维护多边贸易体制和公平开放的国际经贸秩序 const SECTORS  = [{"name": "人工智能", "hit_count": 40, "etfs": []}, {"name": "金融", "hit_count": 32, "etfs": []}, {"name": "半导体", "hit_count": 21, "etfs": []}, {"name": "军工", "hit_count": 20, "etfs": []}, {"name": "数据要素", "hit_count": 11, "etfs": []}, {"name": "消费", "hit_count": 10, "etfs": []}, {"name": "低空经济", "hit_count": 7, "etfs": []}, {"name": "新能源", "hit_count": 6, "etfs": []}];
const META     = {"update_time": "2026-06-02 16:11:54", "sentiment_score": 55.85585585585586, "agents": []};

// 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
