"", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261110/c681670351.shtml"}, {"id": "5616449", "title": "伊朗称两艘油轮在霍尔木兹海峡发生爆炸", "content": "当地时间10日，伊朗伊斯兰革命卫队宣布，两艘油轮在霍尔木兹海峡未经伊朗授权的航线航行时发生剧烈爆炸，被迫停航。革命卫队称，一艘超级油轮触碰水雷引发爆炸；另一艘油轮在美军的护航下，试图通过非法航线通行，其间也遭遇事故。革命卫队海军重申，未经伊朗授权的航线并不安全，任何与美军勾结并试图通过这些航线的船只，都将面临同样的下场。（央视新闻）", "ctime": 1794307924, "time_str": "18:52:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261110/c681670146.shtml"}, {"id": "5616443", "title": "文投控股：股价累计涨幅67.65%，存在大幅上涨后快速回落风险", "content": "文投控股公告，公司股票于2026年11月9日、10日连续2个交易日收盘价格涨幅偏离值累计超过20%，触及股票交易异常波动情形。公司股票于2026年10月27日至11月10日期间多日涨停，累计涨幅67.65%，同期东方财富传媒行业指数上涨8.69%，公司股票存在大幅上涨后快速回落风险。经自查及向控股股东、实际控制人首都文化科技集团有限公司核实，除已公开披露事项外，公司及相关方不存在正在筹划中的涉及上市公司的重大事项。受全国电影票房大幅下降、新游戏研发投入增加等因素影响，公司2026年前三季度营业收入1.8亿元，较去年同期下滑29.51%；归属于上市公司股东的净利润-3754.58万元，较去年同期下滑-1,120.90%，2026年经营业绩存在不确定性风险。", "ctime": 1794307849, "time_str": "18:50:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261110/c681670126.shtml"}, {"id": "5616439", "title": "成大生物：拟以2500万元-5000万元回购公司股份", "content": "成大生物公告，拟使用部分超募资金以集中竞价交易方式回购公司股份，回购资金总额不低于人民币2500万元（含），不超过人民币5000万元（含），回购价格不超过30元/股（含）。本次回购股份拟全部注销并相应减少公司注册资本。按回购价格上限测算，预计回购股份数量约为83.33万股至166.67万股，约占公司总股本的比例为0.20%至0.40%。回购期限为自股东会审议通过本次回购股份议案之日起12个月内。", "ctime": 1794307799, "time_str": "18:49:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261110/c681670111.shtml"}, {"id": "5616423", "title": "武汉天源：拟以5000万元-1亿元回购公司股份", "content": "武汉天源公告，拟使用自有资金及/或自筹资金以集中竞价交易方式回购公司股份，回购资金总额不低于人民币5000万元且不超过人民币1亿元（均含本数），回购价格不超过人民币22.07元/股（含本数）。回购股份将全部用于注销并减少注册资本。按回购资金总额上限及回购价格上限测算，预计回购股份数量为453.05万股，占公司总股本的0.67%；按下限测算，预计回购股份数量为226.53万股，占公司总股本的0.34%。回购实施期限自公司股东会审议通过本次回购股份方案之日起不超过六个月。该议案尚需提交公司股东会审议。", "ctime": 1794307652, "time_str": "18:47:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261110/c681670070.shtml"}, {"id": "5616395", "title": "中胤时尚：问道基金减持0.01%股份，持股比例降至4.99%", "content": "中胤时尚公告，问道私募基金管理（上海）有限公司－问道彩虹2号私募证券投资基金于2026年11月9日通过集中竞价交易减持公司股份24100股，占总股本0.01%；持股比例由5.01%降至4.99%，本次权益变动触及5%刻度。减持计划尚未实施完毕，本次减持与此前披露的计划一致，减持数量未超过计划数量。本次变动不触及要约收购，不会导致公司控制权发生变化。", "ctime": 1794307323, "time_str": "18:42:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261110/c681669987.shtml"}, {"id": "5616389", "title": "运机集团：拟1.82亿元收购深圳锐博40.9993%股权取得控制权", "content": "运机集团公告，公司拟支付现金1.82亿元收购深圳市锐博自动化设备有限公司40.9993%的股权。公司此前已通过增资方式取得深圳锐博10.0007%股权，本次收购完成后将持有其51%股权，深圳锐博将成为公司控股子公司并纳入合并报表范围。连同前期增资投入的4444.44万元，公司取得标的公司51%股权累计支付并购交易总价款2.27亿元，资金来源为自有资金及自筹资金。本次交易已经公司第五届董事会第四十五次会议审议通过，无需提交股东会审议，不构成关联交易及重大资产重组。", "ctime": 1794307298, "time_str": "18:41:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261110/c681669984.shtml"}, {"id": "5616383", "title": "博彦科技：基金完成新一轮募资，认缴出资规模变更为4084万元", "content": "博彦科技此前公告拟以自有资金出资2000万元，与专业投资机构等共同投资苏州睎睿智芯一号创业投资合伙企业（有限合伙），基金专项投资于北京泽石科技有限公司。公司近日收到基金管理人通知，基金已完成新一轮募资，认缴出资规模由3534万元变更为4084万元，并已完成工商变更登记及基金变更备案手续；变更后，博彦科技持有基金48.97%的出资份额。", "ctime": 1794307211, "time_str": "18:40:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261110/c681669966.shtml"}, {"id": "5616379", "title": "共同援乌是“前提” 默茨暗示或“卡”欧盟预算", "content": "德国总理默茨致信欧洲理事会主席科斯塔，将欧盟新一轮七年期预算与对乌资金援助挂钩，暗示“所有成员国无一例外”共同援乌是新预算的“必要前提”，并要求将援乌列为欧盟领导人13日峰会的“优先议题”。据英国《金融时报》等媒体报道，默茨称支持乌克兰关乎欧洲整体安全，呼吁达成“所有成员国都支持的方案”。匈牙利、斯洛伐克、保加利亚和捷克等国已宣布不再向乌克兰提供财政援助。欧盟今年4月批准向乌提供900亿欧元贷款，预计2027年底前耗尽。（新华社）", "ctime": 1794307076, "time_str": "18:37:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261110/c681669927.shtml"}, {"id": "5616373", "title": "周大福创建：拟约19.79亿元出售三家公司股权", "content": "周大福创建公告，于2026年11月10日，公司间接全资附属公司卖方A、卖方B、卖方C分别与买方A、买方B订立协议，出售万爵投资有限公司100%股权（代价5.42亿元）、京珠高速公路广珠段有限公司25%股权（代价约7.474亿元）及肇庆粤肇公路有限公司25%股权（代价6.9亿元），代价总额约19.79亿元。各出售协议交割并非以其他协议交割为前提，完成后集团将不再持有目标公司任何股权。", "ctime": 1794307022, "time_str": "18:37:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261110/c681669912.shtml"}, {"id": "5616367", "title": "显卡终于降价了 华强北RTX5080价格直降4000元", "content": "近两日，英伟达股价波动。与此同时，显卡市场也变动频繁。深圳华强北电脑零配件批发商金硕利电脑负责人说：“本轮高端显卡的价格变化较大，以RTX5080为例，10月23日的价格大约为1.8万元，今天的价格是1.4万元左右，差距有些大。出货量最大的主流型号RTX5060相对于上个月微调200元左右，整体而言，显卡都是微调。”她同时表示：“我们了解到显卡价格最近处于横盘（稳定）状态。”根据其掌握的消息，“显卡价格呈上升趋势，由于工厂出货较少，因此目前市场上的货物相对有限，一旦出货结束，价格必然会上涨。”（21财经）", "ctime": 1794307010, "time_str": "18:36:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261110/c681669906.shtml"}, {"id": "5616349", "title": "天亿马与华为签署合作协议", "content": "据天亿马消息，11月9日，天亿马与华为技术有限公司签署合作协议。根据协议，双方将建立常态化合作机制，深化战略对接，围绕智算中心算力底座建设、企业数智化转型与人才培养等重点领域开展全方位合作，携手建设架构领先的智算中心算力底座，打造“国产芯片+来数加工+Token出海”特色标杆，同步推进企业数智化转型与人才培养合作。（人民财讯）", "ctime": 1794306981, "time_str": "18:36:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261110/c681669895.shtml"}, {"id": "5616317", "title": "皖通科技：华通力盛业绩补偿义务履行完毕，剩余股权转让款7000万元已付清", "content": "皖通科技公告，公司此前披露以现金1.88亿元收购华通力盛70%股权，交易对方承诺华通力盛2022年度至2024年度累计规范净利润不低于9900万元。因华通力盛累计实现规范净利润9292.21万元，未完成业绩承诺，交易对方应现金补偿1156.03万元，公司拟在剩余股权转让款8473.5万元中扣减。2026年10月22日双方签订补充协议，交易对方同意对剩余股权转让款中的317.47万元予以有条件减免，公司支付剩余股权转让款7000万元。2026年10月27日及11月9日，公司分别支付3000万元、4000万元，截至目前7000万元已全部支付完毕，交易对方业绩承诺补偿义务已全部履行完毕。", "ctime": 1794306934, "time_str": "18:35:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261110/c681669874.shtml"}, {"id": "5616295", "title": "云深处科技与北京铁塔签署战略合作协议", "content": "近日，云深处科技与中国铁塔北京市分公司举行战略合作协议签约仪式。双方将融合共创技术产品，由云深处科技发挥具身智能硬件、算法与自主巡检技术能力，结合北京铁塔视频整合、系统集成、AI算法、边缘计算等优势，瞄准多场景巡检痛点，联合研发标准化无人巡护巡检方案，迭代打磨可复制推广的AI应用成果；协同开展市场拓展，共建智能巡检标杆项目、推动技术规模化落地；围绕通信协议、供电对接、适配规范等开展技术攻关，依托北京铁塔能源保障体系支撑机器人稳定运行，助力具身智能产业发展。（人民财讯）", "ctime": 1794306877, "time_str": "18:34:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261110/c681669844.shtml"}, {"id": "5616289", "title": "百润股份：发行股票数量上限调整为3.12亿股", "content": "百润股份此前披露2026年度向特定对象发行A股股票方案。因公司完成回购注销限制性股票82.6万股、总股本调整，董事会审议通过调整发行方案，发行数量上限不超过 312,239,310 股（含本数）。本次发行尚需获得深圳证券交易所审核通过并经中国证券监督管理委员会同意注册后方可实施。", "ctime": 1794306784, "time_str": "18:33:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261110/c681669800.shtml"}, {"id": "5616283", "title": "乐普医疗：子公司MWX205注射液获药物临床试验批准通知书", "content": "乐普医疗公告，公司控股子公司上海民为生物技术有限公司收到国家药品监督管理局核准签发的《药物临床试验批准通知书》，由上海民为生物申报的MWX205注射液临床试验申请获得批准，适应症为血脂异常。MWX205注射液是目前全球首个进入临床阶段的PCSK9和ANGPTL3双靶点siRNA药物，已于2026年6月向澳大利亚人类研究伦理委员会提交I期临床试验申请并获得批准。", "ctime": 1794306716, "time_str": "18:31:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261110/c681669783.shtml"}, {"id": "5616281", "title": "前三季度保险赔款与给付支出同比增长3.9%", "content": "中国保险行业协会数据显示，今年前三季度原保费收入5.26万亿元，同比增长0.9%；赔款与给付支出1.94万亿元，同比增长3.9%。人身险公司积累的寿险和长期健康险责任准备金已超过28万亿元，较年初增长12.7%，保险市场运行总体平稳。（央视新闻）", "ctime": 1794306701, "time_str": "18:31:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261110/c681669780.shtml"}, {"id": "5616275", "title": "寒潮南下多地气温创下半年来新低 回暖后将迎大范围雨雪", "content": "11月10日早晨，寒潮深入南方，江南、华南中东部及云南等地降温4至10℃，20个省会首府直辖市气温创下半年来新低。预计明天白天起气温自北向南快速回升，东北南部到华北多地最高气温将陆续回到15℃以上，长江中下游14日前后将回归20℃以上，华南将回升至25℃以上。12至14日华北、黄淮一带可能出现雾和霾混杂局面；明后两天降水仍集中在     el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
