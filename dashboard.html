月末，上证指数收于4162.9点，环比上涨1.1%；深证成指收于14495.1点，环比上涨2.0%。2026年2月，两市日均成交额22936.0亿元，环比减少24.0%。(中国人民银行)", "ctime": 1774952709, "time_str": "18:25:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260331/c675668910.shtml"}, {"id": "4168089", "title": "鸿泉技术：两轮车业务目前销售收入占公司营收比重较小", "content": "鸿泉技术股票交易异常波动的公告，公司主要为商用车和乘用车提供智能网联、智能座舱等车载终端产品和服务。公司两轮车业务主要为客户提供包括智能仪表、智能网联、控制器等终端，以及提供数据管理平台和手机APP等联网管理服务，但目前销售收入占公司营收比重较小，对公司的经营业绩不构成重大影响。当前两轮车行业竞争激烈，技术迭代速度快，同时主机厂对零部件的成本较为敏感，行业可能面临技术迭代、市场竞争加剧、产品年降、供需格局变化等潜在风险。", "ctime": 1774952684, "time_str": "18:24:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260331/c675668899.shtml"}, {"id": "4168083", "title": "复星医药：控股子公司药品获临床试验批准", "content": "复星医药公告，控股子公司上海复星医药产业发展有限公司收到国家药品监督管理局关于同意FXB0871用于局部晚期或转移性实体瘤开展临床试验的批准。FXB0871为本集团与Teva Pharmaceutical Industries Ltd.合作开发的PD-1靶向型IL-2融合蛋白，并由本集团享有中国及约定的东南亚国家和地区的独家开发、生产及商业化权利。", "ctime": 1774952641, "time_str": "18:24:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260331/c675668883.shtml"}, {"id": "4168081", "title": "工大科雅：中国系统拟协议转让10.54%公司股份", "content": "工大科雅公告，持股5%以上股东中国电子系统技术有限公司拟通过公开征集转让的方式协议转让其持有的公司1270.5万股股份，约占公司总股本的10.54%，占剔除公司回购专用账户中的股份数后总股本的11.03%。本次股份转让完成后，中国系统将不再持有公司股份。", "ctime": 1774952621, "time_str": "18:23:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260331/c675668875.shtml"}, {"id": "4168079", "title": "伊朗高官就美军可能发动地面战密集发声警告", "content": "伊朗高官近日密集发声，就美军可能发动地面战发出严厉警告。伊朗最高领袖外事顾问韦拉亚提3月31日在社交媒体上发文说，敌人对伊朗任何地区的地面入侵，都将遭遇“历史性”失败。(新华社)", "ctime": 1774952619, "time_str": "18:23:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260331/c675668874.shtml"}, {"id": "4168073", "title": "农业银行：非执行董事李蔚因任期届满离任", "content": "农业银行公告，非执行董事李蔚先生因任期届满不再担任本行非执行董事，同时不再担任董事会“三农”金融与普惠金融发展委员会、提名与薪酬委员会、审计委员会委员职务。", "ctime": 1774952554, "time_str": "18:22:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260331/c675668855.shtml"}, {"id": "4168071", "title": "共创草坪：股东创享投资、王强众拟分别减持0.50%", "content": "共创草坪公告，淮安创享创业投资中心（有限合伙）持有445.5万股，占1.11%；王强众持有949.91万股，占2.36%；二者为一致行动人，合计持有1395.41万股，占3.47%。创享投资、王强众拟于2026年4月24日～2026年7月23日，通过集中竞价或大宗交易各减持不超过200万股，分别不超过公司总股本0.50%，减持价格按实施时市场价格确定。", "ctime": 1774952534, "time_str": "18:22:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260331/c675668851.shtml"}, {"id": "4168067", "title": "宏昌科技：就报道称公司间接投资“张雪机车”的事项进行说明", "content": "宏昌科技股票交易异常波动的公告，公司注意到近期公共传媒报道了较多关于“张雪机车”在世界超级摩托车锦标赛（WSBK）葡萄牙站WorldSSP组别中夺冠的消息，市场关注度较高，并报道了公司间接投资“张雪机车”的事项。现就该事项进行说明，2025年8月，公司作为有限合伙人与其他合伙人共同投资金华浙创金义智控创业投资合伙企业（有限合伙）“以下简称“金义智创基金”，认缴出资总额为人民币5.03亿元，公司以自有资金认缴出资人民币1.5亿元，出资比例为29.82%。金义智创基金于2026年1月完成对重庆张雪机车工业有限公司投资，2026年3月完成工商变更，投资完成后该基金持有张雪机车5.5046%股权。公司本次投资为财务性投资，对公司影响较小。", "ctime": 1774952490, "time_str": "18:21:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260331/c675668843.shtml"}, {"id": "4168063", "title": "蓝箭航天IPO状态变更为中止，官方回应", "content": "3月31日，根据上交所官网信息显示，蓝箭航天空间科技股份有限公司（以下简称“蓝箭航天”）科创板IPO审核状态已变更为中止。蓝箭航天官方对此回应，上交所网站显示的“中止”，系因公司申报材料中引用的财务资料已过有效期，需要补充提交更新后的相关财务资料及申报文件，属于程序性审核状态调整。蓝箭表示，目前公司正按规定推进财务数据更新、审计及申报文件补充工作，上述“中止”不属于终止审核，后续公司将按规定及时提交更新材料。(腾讯科技)", "ctime": 1774952475, "time_str": "18:21:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260331/c675668839.shtml"}, {"id": "4168059", "title": "尔康制药：控股股东帅放文拟减持不超过2.04%", "content": "尔康制药公告，控股股东帅放文持有8.54亿股，占41.38%，拟自2026年4月23日至2026年7月22日，以集中竞价或大宗交易方式减持不超4200万股，占2.04%。任意连续九十日内，竞价减持不超1%，大宗交易减持不超2%，减持价不低于首次公开发行价，减持原因为自身资金需求。", "ctime": 1774952381, "time_str": "18:19:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260331/c675668801.shtml"}, {"id": "4168055", "title": "会稽山：2025年净利润2.45亿元，同比增长24.70%", "content": "会稽山公告，2025年营业收入18.22亿元，同比增长11.68%。净利润2.45亿元，同比增长24.70%。公司拟向全体股东每10股派发现金股利3元（含税），合计2025年度公司拟派发的现金红利为1.41亿元（含税）。", "ctime": 1774952328, "time_str": "18:18:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260331/c675668782.shtml"}, {"id": "4168053", "title": "健康元：2025年净利润13.36亿元，同比下降3.68%", "content": "健康元公告，2025年营业收入152.16亿元，同比下降2.58%。净利润13.36亿元，同比下降3.68%。公司拟向全体股东每10股派发现金红利人民币2.2元（含税）。", "ctime": 1774952322, "time_str": "18:18:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260331/c675668781.shtml"}, {"id": "4168051", "title": "美的集团：3月31日首次回购0.0172%公司股份，成交总金额为1亿元", "content": "美的集团公告，公司于2026年3月31日通过回购专用证券账户，首次以集中竞价方式回购公司A股股份，回购股份数量为130.51万股，占公司目前总股本的0.0172%，最高成交价为77.19元/股，最低成交价为76.2元/股，支付的总金额为1亿元（不含交易费用）。", "ctime": 1774952303, "time_str": "18:18:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260331/c675668774.shtml"}, {"id": "4168049", "title": "DeepSeek服务中断一小时后恢复", "content": "3月31日17时02分，DeepSeek服务状态页面显示，DeepSeek网页/API性能异常。18时05分，DeepSeek官方发布更新称，该问题已解决，服务已恢复。", "ctime": 1774952277, "time_str": "18:17:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260331/c675668760.shtml"}, {"id": "4168047", "title": "茅台官方上调出厂价 深圳有经销商暂停出货", "content": "3月30日，茅台官方调价，53度飞天茅台销售合同价每瓶上涨100元。经走访深圳多家线下门店发现，已有经销商暂缓出货，部分前一日向厂家下单的产品尚未到店。多位商家坦言，眼下茅台价格波动频繁，行情几乎一天一变，谁也不敢轻易压货。与此同时，在线下零售端，已有门店将相关产品售价上调近百元。（一财）", "ctime": 1774952238, "time_str": "18:17:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260331/c675668747.shtml"}, {"id": "4168037", "title": "券商数字化能力成熟度迎“大考”，中证协评估工作全面启动", "content": "从业内获悉，中国证券业协会近日在行业内下发通知，正式启动证券公司数字化能力成熟度评估工作。评估旨在引导行业机构系统“摸清家底”，通过“对标对表”发现自身在数字化转型中存在的问题和短板，从而明确未来数字化能力建设的优化方向与发力重点。评估结果也将为监管部门全面掌握行业整体数字化水平、制定相关决策提供重要参考依据。同步下发的《证券公司数字化能力成熟度评估方案（2026年）》详细阐述了券商数字化能力体系的构成、成熟度等级划分以及数字化能力评估工作的意义，还介绍了评估工作需遵循的基本要求、评估工作过程以及具体的评估要求。此外，方案还给出了评估结果的计算方法。(中证金牛座)", "ctime": 1774952064, "time_str": "18:14:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260331/c675668675.shtml"}, {"id": "4168035", "title": "杭华股份：股东T&K TOKA拟减持不超过3%", "content": "杭华股份公告，股东T&K TOKA持股1.12亿股，占26.36%；因资金需求，拟于2026年4月23日至2026年7月22日减持不超1272.51万股，占3.00%。其中集中竞价不超424.17万股，占1.00%，大宗交易不超848.34万股，占2.00%；上述股份源自IPO前取得及资本公积金转增。", "ctime": 1774952054, "time_str": "18:14:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260331/c675668670.shtml"}, {"id": "4168031", "title": "中利集团：2024年一季报、半年报、三季报营业收入披露不准确 被出具警示函", "content": "中利集团公告，公司及相关人员近日收到江苏证监局下发的《关于对江苏中利集团股份有限公司及相关人员采取出具警示函措施的决定》。经查，公司在2025年披露的2024年前三季度会计差错更正公告中，将光伏业务收入确认方式由总额法更正为净额法，导致2024年一季报、半年报、三季报营业收入分别调减2.81亿元、5.58亿元和6.58亿元，相关信息披露不准确。江苏证监局决定对公司及时任董事长王伟峰、时任财务总监徐军成采取出具警示函的监管措施，并记入证券期货市场诚信档案。", "ctime": 1774951908, "time_str": "18:11:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260331/c675668619.shtml"}, {"id": "4168019", "title": "小米集团：3月31日以2.49亿港元回购785万股", "content": "小米集团公告，公司于2026年3月31日完成股份回购，回购数量为785万股，每股回购价格介于31.54港元至31.78港元之间，付出的总价款为2.49亿港元。", "ctime": 1774951754, "time_str": "18:09:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260331/c675668522.shtml"}, {"id // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
