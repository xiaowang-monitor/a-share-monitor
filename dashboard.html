const NEWS     = [{"id": "5724961", "title": "11月20日 周五《新闻联播》要闻16条", "content": "1、习近平会见印度尼西亚总统；\n2、习近平会见澳大利亚总理；\n3、习近平会见新加坡总理；\n4、习近平会见泰国总理；\n5、习近平会见马来西亚总理；\n6、李强同澳大利亚总理举行第十一轮中澳总理年度会晤；\n7、赵乐际会见澳大利亚总理；\n8、丁薛祥将访问新加坡并主持中新双边合作机制会议；\n9、财政部成功在香港发行美元主权债券；\n10、中国147项可持续发展指标接近或实现2030年目标；\n11、我国发现距今39.5亿年亚洲最古老岩石；\n12、推动亚太合作迈出新步伐 开创新局面——国际社会高度评价习近平主席重要讲话；\n13、国际人士表示中俄美元首会晤为世界和平与稳定注入信心和动力；\n14、日本民众集会反对高市政府扩军修宪动向；\n15、也门胡塞武装称打击沙特境内多地目标；\n16、巴称加沙地带多地遭以军袭击致人员伤亡。（央视新闻）", "ctime": 1795175801, "time_str": "19:56:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261120/c682062679.shtml"}, {"id": "5724947", "title": "“丝路心相通”中埃民间友好交流活动在埃及举行", "content": "“丝路心相通”中埃民间友好交流活动日前在埃及海尔生态园举办。来自中埃两国政府、政党、议会、民间组织、高校、企业等近120名代表参加。参与嘉宾一致认为，民间交往是中埃友好牢不可破的社会根基，是中埃文明交流互鉴最鲜活的载体。希望中埃民间机构以此次活动为契机，进一步增进了解和信任，探索更多务实合作空间和机遇，以民间友好增进双边互信，为携手构建中埃命运共同体汇聚合力。活动期间，中埃民间机构代表分享了开展产业帮扶、履行社会责任、共促中埃民间友好的案例。在协议签署和成果展示环节，中国民间组织国际交流促进会同埃及谢拉夫可持续发展基金会共建“读懂中国”书架项目；阜外医院、中国华侨公益基金会与埃及卫生与人口部推进移动手术车项目合作；中国和平发展基金会、中华医学会等中方机构，围绕医疗合作、人文交往等，分别同埃方签署多项合作协议和备忘录。在务实对接环节，中埃民间机构开展深入洽谈，现场气氛热烈友好。活动前，中外嘉宾还考察了海尔生态园。此次活动由中国民间组织国际交流促进会、中国驻埃及大使馆、埃及谢拉夫可持续发展基金会联合主办。(新华社)", "ctime": 1795175648, "time_str": "19:54:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261120/c682062573.shtml"}, {"id": "5724931", "title": "深交所：本周共对80起证券异常交易行为采取了自律监管措施", "content": "深交所公告，2026年11月16日至11月20日，本所共对80起证券异常交易行为采取了自律监管措施，涉及盘中拉抬打压、虚假申报等异常交易情形。", "ctime": 1795175546, "time_str": "19:52:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261120/c682062538.shtml"}, {"id": "5724929", "title": "余承东：享界V8上市2小时大定达2216台", "content": "11月20日晚，华为常务董事、产品投资评审委员会主任、终端BG董事长余承东发文透露，享界V8上市2小时，大定达2216台。据了解，享界V8售价31.98万元起。配置方面，新车全系搭载华为干昆智驾ADS 5，标配800V高压纯电/增程双平台，纯电版标配120kWh电池包，CLTC纯电续航最高可达830km，增程版可选75.4kWh电池包，最大四驱CLTC综合续航1465km；标配4个零重力座椅，共30多种座椅组合模式。稍早前，余承东还发文回应了“开车睡觉”相关言论。“今天发布会上，有几句话讲的不准确，要纠正一下。享界V8现在给大家用的是L2辅助驾驶，L3的硬件能力已具备，但还没有开放。”他表示，“大家用辅助驾驶要专心开车、按要求握好方向盘。现在还是L2时代，大家一定要注意安全，开车不能睡觉。”（界面）", "ctime": 1795175519, "time_str": "19:51:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261120/c682062532.shtml"}, {"id": "5724919", "title": "默沙东第三期临床试验达到总生存期主要终点", "content": "默沙东宣布，评估在局部晚期不可切除或转移性胃食管腺癌三线及后线治疗中使用在研药物sacituzumabtirumotecan（sac-TMT）的III期TroFuse-015试验，达到总生存期（OS）主要终点。试验结果显示，与医生选择的治疗方案相比，sac-TMT显著改善患者总生存期。这是首个在该类患者中通过全球III期临床试验证实可改善总生存期的TROP2靶向抗体偶联药物（ADC）。不过，该药未达到次要终点——由盲态独立中心评审的无进展生存期（PFS）。该试验共纳入473名患者，相关数据将于后续医学会议公布，并提交监管机构。(21财经)", "ctime": 1795175481, "time_str": "19:51:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261120/c682062525.shtml"}, {"id": "5724885", "title": "首届虹桥国际科技周在沪开幕 搭建全球创新与中国市场双向通道", "content": "11月20日，首届虹桥国际科技周在上海国家会展中心开幕。本届科技周以“全球科技愿景，落地中国势能”为主题，聚焦人工智能、智能基础设施、未来出行及能源、智能工业、生命科技和健康、创业生态六大前沿领域，通过会议、展览、互动体验与商务对接的深度融合，搭建全球科技资源与中国市场双向对接的平台，服务上海国际科技创新中心、国际会展之都建设和长三角一体化发展。本届科技周展览面积5万平方米，汇聚380余家展商、10余个国内外展团，覆盖人工智能全产业链以及出行能源、智能制造、生命健康等应用赛道；现场设6大主题舞台，三天共安排200余场会议与专题论坛，邀请300余位演讲嘉宾，并推出多场定向商务配对和30余项互动体验活动。（央视新闻）", "ctime": 1795175382, "time_str": "19:49:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261120/c682062493.shtml"}, {"id": "5724883", "title": "*ST西旅：法院裁定受理公司重整并指定管理人，股票交易将被叠加实施退市风险警示", "content": "*ST西旅公告，2026年11月20日，公司收到西安中院送达的（2026）陕01破申440号之四《民事裁定书》及（2026）陕01破328号《决定书》，西安中院依法裁定受理申请人西安曲江金控资产运营管理有限公司对公司的重整申请，并指定西安旅游股份有限公司清算组担任公司破产管理人。鉴于公司2025年末经审计的归属于上市公司股东的净资产为负值，公司股票交易已被实施退市风险警示；因法院裁定受理公司重整，根据《深圳证券交易所股票上市规则》第9.4.1条第（九）项规定，公司股票交易将被叠加实施退市风险警示，本次叠加实施无需停牌，股票简称仍为“*ST西旅”，证券代码仍为“000610”，日涨跌幅限制仍为10%。公司仍存在因重整失败而被宣告破产的风险。", "ctime": 1795175380, "time_str": "19:49:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261120/c682062492.shtml"}, {"id": "5724875", "title": "三季度末普惠型小微企业贷款余额同比增长6.4%", "content": "国家金融监督管理总局11月20日发布的数据显示，三季度末，银行业金融机构普惠型小微企业贷款余额38.8万亿元，同比增长6.4%；普惠型涉农贷款余额15万亿元，同比增长6.2%。今年前三季度，保险公司原保险保费收入5.3万亿元，同比增长0.9%；赔款与给付支出1.9万亿元，同比增长3.9%；新增保单件数1010亿件，同比增长19.3%。银行业和保险业总资产保持增长。三季度末，我国银行业金融机构本外币资产总额503.1万亿元，同比增长6.1%；保险公司和保险资产管理公司总资产44.6万亿元，较年初增长8%。数据显示，商业银行信贷资产质量总体稳定，三季度末，商业银行不良贷款率1.54%；风险抵补能力整体充足，三季度末，商业银行拨备覆盖率为199.49%，商业银行（不含外国银行分行）资本充足率为15.40%。保险业偿付能力方面，三季度末，保险公司平均综合偿付能力充足率为177.8%，核心偿付能力充足率为131.5%，分别高于100%和50%的监管标准。(新华社)", "ctime": 1795175368, "time_str": "19:49:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261120/c682062488.shtml"}, {"id": "5724841", "title": "刘国中会见国际合作社联盟主席加尔科", "content": "中共中央政治局委员、国务院副总理刘国中11月20日在京会见国际合作社联盟主席阿里尔·加尔科。刘国中表示，习近平主席高度重视合作社发展，中国政府出台了一系列法律法规和相关政策，推动合作社事业取得长足发展。中方将同联盟及各国合作社一道，加强粮食安全、减贫、经贸等领域交流合作，助力加快落实联合国2030年可持续发展议程，让合作成果更多惠及各国人民。加尔科表示，愿同中方深化务实合作，推动全球合作社事业实现更大发展。（新华社）", "ctime": 1795175184, "time_str": "19:46:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261120/c682062380.shtml"}, {"id": "5724831", "title": "九安医疗：出售已回购股份694.52万股，成交金额4.59亿元", "content": "九安医疗公告，公司此前审议通过以集中竞价交易方式出售部分已回购股份，拟出售数量不超过929.5万股，实施期限为2026年5月28日至2026年11月20日，未出售部分将予以注销。截至2026年11月20日，公司通过集中竞价交易方式出售回购股份694.52万股，占公司总股本的1.49%，成交金额4.59亿元（未扣除交易费用），成交最高价74.34元/股，成交最低价50元/股，成交均价66.15元/股，本次出售计划实施期限已届满。未出售的234.98万股后续将按照相关法律法规的要求履行注销相关程序。", "ctime": 1795175155, "time_str": "19:45:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261120/c682062367.shtml"}, {"id": "5724773", "title": "赵乐际会见澳大利亚总理阿尔巴尼斯", "content": "2026年11月20日下午，全国人大常委会委员长赵乐际在北京会见澳大利亚总理阿尔巴尼斯。赵乐际表示，今天上午，习近平主席同总理先生进行战略沟通，为两国关系进一步发展指明了方向。中方愿同澳方以明年中澳建交55周年为契机，共同落实好两国领导人重要共识，增进战略互信、拓展务实合作、深化人文交流、加强多边协调，推动构建更加成熟稳定、更加富有成果的中澳全面战略伙伴关系。中国全国人大愿同澳联邦议会加强交流合作，分享立法、监督等工作经验，为两国务实合作提供法律保障。阿尔巴尼斯表示，祝贺中国成功举办亚太经合组织领导人非正式会议。我同习近平主席进行了富有成果的战略性沟通，达成重要共识。支持澳中立法机构继续保持良好交往，促进人民友谊。（外交部网站）", "ctime": 1795175039, "time_str": "19:43:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261120/c682062245.shtml"}, {"id": "5724771", "title": "赛维时代：全资子公司拟1.05亿元受让小虎鲸基金17.2881%合伙份额", "content": "赛维时代公告，公司全资子公司赛维网络近日与傲基股份签署协议，以自有资金1.05亿元受让其持有的海南小虎鲸私募股权投资基金合伙企业（有限合伙）17.2881%合伙份额（对应认缴出资额10200万元，已全额实缴）。本次交易完成后，赛维网络成为小虎鲸基金有限合伙人，公司及赛维网络合计持有该基金25.7627%合伙份额。本次交易不构成关联交易，亦不构成重大资产重组，在总经理审批权限范围内，无需提交董事会及股东会审议。", "ctime": 1795175019, "time_str": "19:43:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261120/c682062103.shtml"}, {"id": "5724747", "title": "法国上调禽流感风险级别至最高级", "content": "法国农业、农食和粮食主权部19日宣布，自20日起将法国本土范围内高致病性禽流感动物疫情风险级别由“中级”上调为最高的“高级”，以应对近期欧洲野生鸟类禽流感疫情。法国政府说，近期多个邻国的野生鸟类中高致病性禽流感病例增加，病毒可能沿候鸟迁徙通道传播。法国境内野生动物中已出现确诊病例，法国本土家庭式禽类饲养场也已出现疫情。鉴于上述情况，法国政府决定提升高致病性禽流感风险级别。高致病性禽流感是一种急性、病毒性传染病，鸟类感染后死亡率高。禽流感病毒在自然界中的宿主和传播者主要是野生鸟类，特别是水禽。家禽可通过接触受感染的野生鸟类及其分泌物、粪便等感染。法国高致病性禽流感风险分为“可忽略”“中级”和“高级”三个级别。法国政府于本月初将高致病性禽流感风险级别调至“中级”。法国农业、农食和粮食主权部此前公布数据显示，自今年8月以来，法国已报告6起高致病性禽流感疫情，其中3起发生在商业养殖场，另外3起涉及家庭式饲养场或圈养鸟类。2025年8月至2026年7月，法国累计报告156起疫情。(新华社)", "ctime": 1795174835, "time_str": "19:40:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261120/c682061713.shtml"}, {"id": "5724731", "title": "数万名日本民众签名反对日本拥有核潜艇", "content": "日本多个民间团体20日向防卫省递交由4.7万名日本民众联合签名的材料，反对日本拥有核动力潜艇，要求政府撤回相关计划。记者从民间团体方面获悉，此次联合签名活动由“日本原子力资料情报室”等民间机构和组织共同发起，在约一个月时间内就征集到4.7万人签名。此次联合签名活动的声明指出，日本作为唯一遭受过原子弹轰炸的国家，一直宣称有责任推动废除核武器，而拥有核动力潜艇无异于主动背弃这一承诺。在递交联署材料后的记者会上，民间团体代表表示，日本政府一方面探讨引进核动力潜艇，另一方面又试图为“无核三原则”中“不运进”一项设置例外情况，这一系列相互关联的政策变化，可能从根本上改变日本作为无核武器国家的定位。日本政界围绕核问题的讨论持续升温。日本防卫大臣小泉进次郎多次表示，在讨论引进核动力潜艇问题时“不排除任何选项”。今年10月，日本首相高市早苗在国会表示，将就自卫队引进核潜艇展开“具体且现实的讨论”。另据日本媒体近期报道，日本政府正考虑在年内修订“安保三文件”中的《国家安全保障战略》时，对“无核三原则”设置例外情况，允许在紧急情况下将核武器运进日本。相关动向引发广泛担忧与反对。(新华社)", "ctime": 1795174747, "time_str": "19:39:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261120/c682061680.shtml"}, {"id": "5724723", "title": "易天股份：收购艾晨数字能源37%股权事项尚处筹划阶段", "content": "易天股份公告，公司股票连续2个交易日（2026年11月19日、2026年11月20日）收盘价格涨幅偏离值累计超过30%，属于股票交易异常波动情形。公司拟以现金收购深圳市艾晨数字能源有限公司37%股权并拟与标的公司部分股东签署《一致行动协议》，预计交易完成后公司及一致行动主体合计持有标的公司股份比例约51.8490%。截至公告披露日，相关交易尚未完成前期尽调及审计评估工作，具体交易方案仍在论证协商中，《股权转让框架协议》仅为意向性约定，不构成具有强制约束力的最终交易承诺。", "ctime": 1795174699, "time_str": "19:38:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261120/c682061674.shtml"}, {"id": "5724717", "title": "科达制造：公司9月份以来负极产销量达90%以上 目前石墨化自有率超70%", "content": "11月20日，科达制造在2026年第三季度业绩说明会上表示，今年9月以来随着部分技改新增产能的释放，公司负极材料月度出货量已有较好提升，产能利用率维持高位，产销率达90%以上。公司持续对现有负极产线开展技术改造与产能扩建，目前福建基地与重庆基地已合计形成约22万吨/年人造石墨成品产能，石墨化自有率超过70%。（人民财讯）", "ctime": 1795174661, "time_str": "19:37:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261120/c682061668.shtml"}, {"id": "5724709", "title": "上交所：将东山精密调入沪港通下港股通标的，自下一港股通交易日起生效", "content": "上交所：将东山精密调入沪港通下港股通标的，自下一港股通交易日起生效。", "ctime": 1795174542, "time_str": "19:35:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261120/c682061624.shtml"}, {"id": "5724647", "title": "奕瑞科技：回购实施完毕，累计回购29.1万股支付1999.33万元", "content": "奕瑞科技公告，公司此前审议通过回购方案，拟以集中竞价交易方式回购公司股份，回购资金总额不低于1000万元且不超过2000万元，回购价格不超过120元/股，回购股份用于员工持股计划或股权激励。截至2026年11月20日，本次回购实施完毕，公司累计回购股份29.1万股，占总股本比例0.09%，回购最高价71.99元/股，最低价66.11元/股，回购均价68.7元/股，已回购总金额1999.33万元（不含印花税、交易佣金等交易费用）。", "ctime": 1795174255, "time_str": "19:30:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261120/c682061522.shtml"}, {"id": "5724589", "title": "李强同澳大利亚总理阿尔巴尼斯举行第十一轮中澳总理年度会晤", "content": "11月20日下午，国务院总理李强在北京钓鱼台国宾馆同澳大利亚总理阿尔巴尼斯举行第十一轮中澳总理年度会晤。李强表示，当前，中澳关系保持积极发展势头，各层级交往日益密切，各领域合作走深走实，给两国人民带来实实在在的利益。今天上午，习近平主席在深圳同总理先生举行会晤，就进一步深化中澳关系作出战略指引。明年是中澳建交55周年，中方愿同澳方一道以此为契机，秉持平等互利、开放务实态度，聚焦共同利益，妥善管控分歧，推动中澳全面战略伙伴关系取得更多积极成效，共促两国发展繁荣。李强指出，中澳在产业、市场、技术等方面各有优势、互补性强，两国深化合作有内生需求，能够相互赋能。中方愿同澳方推动双边贸易扩大规模、优化结构，打造绿色低碳、新能源汽车、人工智能等新兴领域合作亮点，进一步提升贸易投资自由化便利化水平，争取更多实际成果。双方要办好明年的“中澳旅游年”，深化文化、青年、地方、媒体、智库等交流合作，筑牢两国关系友好基础。当前，单边主义、保护主义还在大行其道。中澳同为多边主义的支持者、受益者，中方愿同澳方加强在联合国、亚太经合组织等框架下沟通协调，共同维护多边体系和自由贸易，捍卫国际公平正义。(新华社)", "ctime": 1795174062, "time_str": "19:27:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261120/c682061473.shtml"}, {"id": "5724555", "title": "法国前总理德维尔潘宣布参加2027年总统选举", "content": "当地时间11月20日，法国前总理多米尼克·德维尔潘正式宣布参加2027年法国总统选举。德维尔潘曾于2003年代表法国政府反对美国发动伊拉克战争。近年来，他因在国际事务上的一系列表态重新受到关注，尤其是在加沙战争问题上的立场。（央视新闻）", "ctime": 1795173820, "time_str": "19:23:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261120/c682061392.shtml"}, {"id": "5724543", "title": "燕东微：董事长张劲松提议回购公司股份，资金总额不低于5000万元且不超过8000万元", "content": "燕东微公告，公司董事会于2026年11月20日收到董事长张劲松先生《关于提议北京燕东微电子股份有限公司回购公司股份的函》。张劲松先生提议公司以自有资金通过上海证券交易所交易系统以集中竞价交易方式回购公司已发行的部分人民币普通股（A股）股票，回购股份将用于维护公司价值及股东权益。回购股份的资金总额不低于人民币5000万元（含），不超过人民币8000万元（含），具体以董事会审议通过的回购股份方案为准；回购股份价格不高于董事会通过回购股份决议前三十个交易日公司股票交易均价的150%；回购实施期限为自公司有权决策机构审议通过的回购股份方案之日起3个月内。上述回购事项需按规定履行相关审议程序后方可实施。", "ctime": 1795173775, "time_str": "19:22:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261120/c682061380.shtml"}, {"id": "5724535", "title": "迅捷兴：拟授予限制性股票510.52万股，占总股本3.73%", "content": "迅捷兴公告，公司第四届董事会第十五次会议审议《关于公司<2026年限制性股票激励计划（草案）>及其摘要的议案》，本激励计划拟向激励对象授予限制性股票510.52万股，约占本激励计划草案公告时公司总股本1.37亿股的3.73%。其中，首次授予430.52万股，预留授予80万股。因关联董事须回避表决，非关联董事人数不足三人，本议案直接提交公司股东会审议。公司定于2026年12月7日召开2026年第四次临时股东会。", "ctime": 1795173751, "time_str": "19:22:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261120/c682061377.shtml"}, {"id": "5724533", "title": "超威半导体美股盘前跌超6%", "content": "超威半导体美股盘前跌超6%，现报459.75美元。", "ctime": 1795173711, "time_str": "19:21:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261120/c682061370.shtml"}, {"id": "5724527", "title": "2026世界计算大会在长沙开幕 共探智能经济新形态", "content": "2026世界计算大会20日在长沙开幕。大会以“计算万物湘约未来——打造智能经济新形态”为主题，海内外计算领域专家、龙头企业代表等围绕计算产业前沿趋势、智能经济新形态等话题展开探讨。中国国家制造强国建设战略咨询委员会副主任、国家智能制造专家委员会主任苏波表示，先进计算是智能制造的基础底座，算力赋能制造业成效正在研发、生产、管理等环节显现。一大批标杆5G工厂实践显示，通过算力赋能，企业平均产能提升25%、产品良品率提升21%、运营成本下降19%。诺贝尔物理学奖得主康斯坦丁·诺沃肖洛夫分享了人工智能赋能材料科学的实践。他表示，AI不仅能预测理想材料能做什么，还可广泛调用人类知识空间，快速发现材料动态特性，寻找反应路径，为材料研制提供快速参考。（中国新闻网）", "ctime": 1795173706, "time_str": "19:21:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261120/c682061368.shtml"}, {"id": "5724487", "title": "株冶集团：选举彭曙光为董事长并聘任谈应飞为总经理", "content": "株冶集团公告，公司第九届董事会第一次会议审议通过多项议案，选举彭曙光担任公司董事长，任期至第九届董事会届满之日止；同意选举第九届董事会各专门委员会委员；同意聘任谈应飞为总经理，王浩宇、刘卫平为副总经理，熊敬为财务总监，方祥东为董事会秘书，翟周违为证券事务代表，任期均至第九届董事会届满之日止。上述议案均以9票同意、0票反对、0票弃权获得通过。", "ctime": 1795173477, "time_str": "19:17:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261120/c682061314.shtml"}, {"id": "5724457", "title": "广汽夸克电驱非晶-碳纤维电驱第10万套量产下线", "content": "据广汽集团消息，11月20日，广汽夸克电驱非晶-碳纤维电驱第10万套正式量产下线。据广汽方面介绍，夸克电驱2.0非晶-碳纤维电驱已批量搭载埃安N60、2027款埃安RT、2027款埃安i60等车型。在电池容量不变的情况下，搭载车型整车能耗下降4%，续航提升30至50公里。（界面）", "ctime": 1795173298, "time_str": "19:14:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261120/c682061261.shtml"}, {"id": "5724419", "title": "士兰微：董事会审议通过变更部分募集资金投资项目暨关联交易议案", "content": "士兰微公告，公司第九届董事会第十三次会议审议通过《关于变更部分募集资金投资项目暨关联交易的议案》，关联董事陈向东、范伟宏、李伟回避表决，表决结果为12票同意、0票反对、0票弃权，该议案须提交公司股东会审议。会议同时审议通过《关于召开2026年第二次临时股东会的议案》，表决结果为15票同意、0票反对、0票弃权。", "ctime": 1795173064, "time_str": "19:11:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261120/c682061166.shtml"}, {"id": "5724413", "title": "东方红睿丰LOF：旗下基金自2026年11月20日起对停牌股票艾为电子采用指数收益法估值", "content": "东方红睿丰LOF公告，根据相关规定及公司停牌股票估值政策程序，经与基金托管人协商一致，公司决定自2026年11月20日（含）起采用“指数收益法”对旗下部分基金（ETF除外）持有的停牌股票艾为电子（股票代码：688798.SH）予以估值。待该股票复牌且交易体现活跃市场交易特征后，将恢复采用当日收盘价格估值，届时不再另行公告。", "ctime": 1795173022, "time_str": "19:10:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261120/c682061133.shtml"}, {"id": "5724411", "title": "SpaceX美股盘前跌超4%", "content": "SpaceX美股盘前跌超4%，现报132.86美元。", "ctime": 1795173021, "time_str": "19:10:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261120/c682061132.shtml"}, {"id": "5724405", "title": "亚太科技：控股股东一致行动人周津伊增持635.19万股，权益变动触及1%整数倍", "content": "亚太科技公告，控股股东之一致行动人周津伊女士计划自2026年9月9日起6个月内增持公司股份，计划增持股份金额不低于5000万元（含），且不超过1亿元（含）。2026年9月9日至2026年11月19日期间，周津伊女士通过集中竞价交易方式累计增持公司股份635.19万股，占公司总股本的0.51%，增持金额合计3026.62万元（不含交易费用等）。本次权益变动后，公司控股股东及其一致行动人合计持有公司股份数量由6.31亿股增加至6.37亿股，占公司总股本的比例由50.54%增加至51.05%，权益变动触及1%的整数倍。本次增持计划尚未实施完毕，周津伊女士将继续实施本次增持计划。", "ctime": 1795172965, "time_str": "19:09:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261120/c682061116.shtml"}, {"id": "5724389", "title": "腾讯WorkBuddy上线电脑操控能力", "content": "11月20日，腾讯WorkBuddy宣布上线电脑操控（Computer Use）能力：能识别当前页面，看懂客户端界面，进行点击、输入、滚动等操作，不需要目标软件开放接口，就能在后台操作。电脑操控目前处于公测体验阶段，支持macOS和Windows，需更新客户端至5.11.0及以上版本，并开启功能、完成相关授 k_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261120/c682060575.shtml"}, {"id": "5724245", "title": "天阳科技：拟以1亿元至2亿元回购股份，价格上限22.51元/股", "content": "天阳科技公告，公司第四届董事会第十二次会议审议通过第三期回购公司股份方案，拟使用自有资金及/或自筹资金以集中竞价交易方式回购公司股份，回购资金总额不低于1亿元、不超过2亿元（均含本数），回购价格不超过22.51元/股（含）。按回购金额上限2亿元、价格上限22.51元/股测算，预计回购约888.49万股，约占公司总股本的1.82%；按下限1亿元测算，预计回购约444.25万股，约占0.91%。回购股份用于维护公司价值及股东权益所必需（出售），实施期限自董事会审议通过之日起不超过3个月。", "ctime": 1795172262, "time_str": "18:57:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261120/c682060574.shtml"}, {"id": "5724243", "title": "顺丰控股：董事会提名马毅为独立董事候选人", "content": "顺丰控股公告，公司第七届董事会第九次会议审议通过《关于补选独立董事候选人的议案》，同意提名马毅先生为公司第七届董事会独立董事候选人，任期自股东会审议通过之日起至第七届董事会届满之日止。马毅先生当选后将接替李嘉士先生担任董事会提名委员会主任委员、审计委员会委员、薪酬与考核委员会委员、风险管理委员会委员职务。该议案需提交至2026年第一次临时股东会审议。", "ctime": 1795172258, "time_str": "18:57:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261120/c682060571.shtml"}, {"id": "5724229", "title": "以色列被曝升级“大卫投石索”防空系统", "content": "据以色列方面11月20日消息，以色列已对其“大卫投石索”中程防空系统完成技术升级并扩大拦截范围，旨在增强对弹道导弹的防御能力。消息援引以色列空军防空调查负责人的话说，在今年早些时候以色列与伊朗的冲突中，伊朗大规模发射弹道导弹一度暴露出以色列防空反导体系的漏洞，但也为以军提供了大量实战数据，促使军方在短时间内对防空系统进行针对性改进。“大卫投石索”防空系统位于以色列多层防空网络的中间层级，最初并非专为拦截远程弹道导弹设计，但在2025年6月的冲突中首次被用于拦截从1500公里外发射的伊朗弹道导弹。在今年早些时候的冲突中，该系统虽成功击落大量来袭导弹，但仍出现部分拦截失败的情况。为此，以方对该系统实施重点改进，以提升在长期冲突中的持续防御作战能力。据称，以军近年来倾向于动用中程“大卫投石索”而非远程“箭-3”反导系统拦截伊朗导弹，主要目的是节省高成本远程拦截弹的库存。“大卫投石索”拦截弹单枚使用成本约为100万美元，而“箭-3”拦截弹单次发射成本超过250万美元。以军官员表示，此次技术升级使以色列空军在应对来袭导弹时拥有更多战术选择。(央视新闻)", "ctime": 1795172192, "time_str": "18:56:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261120/c682060549.shtml"}, {"id": "5724219", "title": "渤海化学：拟3.76亿元现金收购格瑞新材80%股份并签署购买资产协议", "content": "渤海化学公告，公司于2026年11月20日召开第十届董事会第三十一次会议，审议通过签署《支付现金购买资产协议》的议案，拟以支付现金方式收购广东格瑞新材料股份有限公司80%股份，交易作价3.76亿元。本次交易完 // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
