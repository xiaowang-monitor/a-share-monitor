朗使领馆再次提醒在伊中国公民加强安全防范和应急准备，及时向驻伊使领馆报备。同时，中国公民暂勿前往伊朗。提醒说，目前，伊首都德黑兰及西部地区空域处于关闭状态，在伊中国公民可重点关注伊马汉航空离伊航班恢复情况。同时，综合考虑口岸情况和当地及周边安全等因素，目前在伊中国公民可通过前往亚美尼亚、土耳其、土库曼斯坦的陆路通道离伊。（新华社）", "ctime": 1780917261, "time_str": "19:14:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260608/c677300367.shtml"}, {"id": "4483039", "title": "国际原油期货涨幅回落至3%以内", "content": "国际原油期货涨幅回落至3%以内，WTI原油期货价格涨2.89%，报93.161美元/桶；布伦特原油期货价格涨2.62%，报95.525美元/桶。", "ctime": 1780917141, "time_str": "19:12:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260608/c677300333.shtml"}, {"id": "4483023", "title": "美股纳斯达克100指数期货涨超1%", "content": "美股纳斯达克100指数期货涨超1%，标普500指数期货涨0.59%，道琼斯指数期货涨0.15%。", "ctime": 1780917070, "time_str": "19:11:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260608/c677300288.shtml"}, {"id": "4483009", "title": "锐新科技：拟收购德恒装备51%股权，交易价格5亿元", "content": "锐新科技公告，拟通过发行股份及支付现金的方式购买德恒装备51%股权，交易价格5亿元。以2025年12月31日为基准日，收益法评估德恒装备股东全部权益价值9.8亿元，增值率140.99%。本次发行股份购买资产的股票发行价格为18.08元/股，发行数量1505.23万股。同时，公司拟向包括控股股东开投领盾在内的不超过35名特定对象发行股份募集配套资金不超过2.48亿元，用于支付本次交易的现金对价及中介机构费用等。本次交易完成后，上市公司2025年度归属于母公司股东净利润备考数据将由3259.77万元增至7108.26万元，基本每股收益由0.20元提升至0.37元。本次交易尚需经黄山市国资委备案、国资监管机构批准、股东会审议、深交所审核及中国证监会注册等程序。", "ctime": 1780916999, "time_str": "19:09:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260608/c677300023.shtml"}, {"id": "4483003", "title": "*ST华闻：公司诉林广茂股权转让纠纷案一审判决", "content": "*ST华闻公告，公司诉林广茂股权转让纠纷案一审判决。海口中院判决林广茂返还股权转让款5000万元及资金使用费1204.38万元，支付逾期付款违约金（计算方法：以62,043,835.62元为基数，自2023年11月14日起至债务实际清偿之日止，按每日万分之二计算），支付律师服务费50000元及保函保险费23340元。华闻集团对林广茂质押的江苏随易信息科技有限公司6.42%股权的折价或者拍卖、变卖所得价款在林广茂欠付的上述债务范围内享有优先受偿权。驳回华闻集团的其他诉讼请求及林广茂的全部反诉请求。", "ctime": 1780916978, "time_str": "19:09:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260608/c677300003.shtml"}, {"id": "4482975", "title": "方大集团：首次回购0.26%公司股份，成交总金额为996.46万元", "content": "方大集团公告，2026年6月8日，公司首次通过股票回购专用证券账户以集中竞价交易方式回购公司股份281万股，占公司总股本的0.26%，最高成交价为3.59元/股，最低成交价为3.51元/股，成交总金额为996.46万元（不含交易费用）。", "ctime": 1780916800, "time_str": "19:06:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260608/c677299790.shtml"}, {"id": "4482959", "title": "弘信电子：调整2024年度向特定对象发行股票方案 募集资金金额调整为不低于2.18亿元", "content": "弘信电子公告，调整2024年度向特定对象发行股票方案。定价基准日调整为发行期首日，发行价格不低于定价基准日前20个交易日公司股票交易均价的80%。募集资金金额调整为不低于2.18亿元且不超过5.18亿元，扣除发行费用后将全部用于补充流动资金。除上述调整外，本次发行方案其他内容不变。", "ctime": 1780916735, "time_str": "19:05:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260608/c677299757.shtml"}, {"id": "4482929", "title": "北约战机在拉脱维亚领空击落外国无人机", "content": "拉脱维亚国家武装部队8日在社交媒体上说，执行北约波罗的海空域巡逻任务的法国战机当日在拉领空击落一架外国无人机。这是在拉脱维亚领空首次击落外国无人机。\n\n拉国家武装部队表示，这架无人机在该国东部拉特加尔上空被击落，并称无人机受俄罗斯电子战影响飞入该国领空。\n\n当天上午，拉国家武装部队曾在该国东部阿卢克斯内、卢扎、巴尔维和雷泽克内等地发布空中警报。但该警报随后解除。(新华社)", "ctime": 1780916597, "time_str": "19:03:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260608/c677299271.shtml"}, {"id": "4482921", "title": "北玻股份：主营业务不涉及半导体玻璃基板产品，钙钛矿镀膜设备未量产", "content": "北玻股份公告，公司股票于2026年6月4日、5日、8日连续三个交易日收盘价格涨幅偏离值累计超过20%。经核查，公司关注到市场涉及“玻璃基板封装”“建筑光伏一体化”“钙钛矿镀膜设备”等热点概念讨论，澄清如下：公司主营业务不涉及半导体玻璃基板产品；公司终端玻璃产品尚未包括建筑光伏一体化玻璃幕墙；子公司上海北玻真空镀膜技术有限公司曾联合开发钙钛矿镀膜设备，该项目于2024年完成研发结题，但截至目前未开展相关设备量产，未对公司经营业绩构成影响。此外，公司2025年度及2026年第一季度业绩同比均存在不同程度下滑。", "ctime": 1780916572, "time_str": "19:02:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260608/c677299221.shtml"}, {"id": "4482911", "title": "顺络电子：自年初调整部分产品售价，数据中心TLVR电感已量产出货", "content": "顺络电子公告，公司股票于2026年6月4日、6月5日、6月8日连续三个交易日内日收盘价格涨幅偏离值累计超过20%，属于股票交易异常波动。公司生产经营基本面未发生重大变化，不存在应披露而未披露的重大订单合同等情形。针对市场关注的公司部分产品涨价及数据中心布局情况，公司说明如下：公司自2026年年初以来已调整部分产品售价，主要为传导上游原材料成本压力，涨价工作正在开展中；公司数据中心TLVR电感产品已实现量产出货，截至2026年第一季度，数据中心业务营收占公司整体营收比重尚不足5%，收入占比较小。", "ctime": 1780916548, "time_str": "19:02:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260608/c677299209.shtml"}, {"id": "4482903", "title": "常铝股份：筹划控制权变更申请停牌", "content": "常铝股份公告，公司接到控股股东齐鲁财金投资集团有限公司的通知，齐鲁财金正在筹划其所持有公司股份的转让事宜，该事项可能会导致公司控制权发生变更。目前相关方正就具体交易方案等相关事项进行论证和磋商，尚未签署相关协议。公司股票自2026年6月9日开市起停牌，预计停牌时间不超过2个交易日。", "ctime": 1780916528, "time_str": "19:02:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260608/c677299205.shtml"}, {"id": "4482765", "title": "奥比中光：公司不直接从事物理AI的开发", "content": "奥比中光公告，公司股票交易价格连续3个交易日（2026年6月4日、2026年6月5日和2026年6月8日）收盘价格涨幅偏离值累计超过30%，根据相关规定，属于股票交易异常波动的情况。经公司自查并书面询证控股股东、实际控制人，截至公告披露日，公司、控股股东及实际控制人不存在应披露而未披露的重大事项。公司主营业务为3D视觉感知产品的设计、研发、生产和销售，主要产品包括消费级应用设备、3D视觉传感器和工业级应用设备，不直接从事物理AI的开发。", "ctime": 1780916330, "time_str": "18:58:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260608/c677298946.shtml"}, {"id": "4482763", "title": "达实智能：未开展液冷、智能机器人、半导体元器件的研发、生产及制造业务", "content": "达实智能发布股价异动公告，经核查，公司近期生产经营情况、内外部经营环境未发生且未预计将要发生重大变化。2025 年公司 AIoT 平台及 AI 应用签约金额7,847.14 万元，占当年营业收入比重较低，对公司整体经营业绩无重大影响。公司未开展液冷、智能机器人、半导体元器件的研发、生产及制造业务。半导体产业主要涵盖半导体材料、器件的研发、生产与销售，公司主营业务不涉及该范畴，仅为少量半导体企业提供门禁类智能终端产品及配套智能化服务，2025 年该部分收入占公司营业收入比重较低，对整体经营业绩无重大影响。敬请各位投资者理性研判、审慎决策，留意投资风险。", "ctime": 1780916299, "time_str": "18:58:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260608/c677298934.shtml"}, {"id": "4482757", "title": "金禾实业：实际控制人杨乐拟增持3000万至3500万元", "content": "金禾实业公告，公 // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
