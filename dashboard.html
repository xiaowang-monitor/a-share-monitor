const NEWS     = [{"id": "4586101", "title": "泰晶科技：董事长喻信东拟减持不超过2.8%", "content": "泰晶科技公告，公司控股股东、实际控制人、董事长喻信东拟减持不超过2.8%。", "ctime": 1782296786, "time_str": "18:26:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260624/c677685384.shtml"}, {"id": "4586089", "title": "中国银河证券许冬石：预计下半年出口高增长，政策托底，经济转型持续", "content": "6月24日，中国银河证券在上海举办年度中期策略报告会。中国银河证券宏观联席首席分析师许冬石发表下半年宏观展望。许冬石表示，预计2026年国内GDP增速4.7%，贴合年度目标；出口高增长，制造和基建投资托底经济；基准情形下，预计CPI同比增长1.3%、PPI同比增长3.1%。大类资产方面，许冬石认为，通胀将分化盈利，8月为全年配置分水岭。权益市场利润向中上游集中，涨价主线中AI好于非AI、外需好于内需、刚需好于可选。债券市场方面，预计10年期国债收益率在1.65%—1.9%区间震荡运行。（证券时报）", "ctime": 1782296647, "time_str": "18:24:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260624/c677685345.shtml"}, {"id": "4586085", "title": "剑桥科技：公司目前生产经营活动正常", "content": "剑桥科技股票交易异常波动公告，公司目前生产经营活动正常，不存在影响公司股票交易价格异常波动的重大事宜。公司主营业务涉及电信、数通、企业网络与家庭网络领域通信连接的终端设备（包括电信宽带、无线网络与边缘计算）以及高速光模块产品的研发、生产与销售，行业发展与全球通信技术迭代、下游客户资本开支计划密切相关。若未来行业政策调整、市场需求不及预期、核心原材料供应短缺或价格大幅上涨，可能对公司生产经营、产品成本及盈利能力产生不利影响。", "ctime": 1782296627, "time_str": "18:23:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260624/c677685335.shtml"}, {"id": "4586079", "title": "印度与美国就加强市场准入和数字贸易举行会谈", "content": "印度与美国就加强市场准入和数字贸易举行会谈，讨论降低非关税壁垒和供应链问题，双方重申了扩大双边贸易的共同目标。（财联社）", "ctime": 1782296572, "time_str": "18:22:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260624/c677685320.shtml"}, {"id": "4586015", "title": "银河证券杨超：下半年市场有望回归多主线并行行情", "content": "中国银河证券在上海举办年度中期策略报告会。中国银河证券策略首席分析师杨超发表下半年策略展望。杨超认为，下半年投资环境有所改善，原油价格下行，市场有望回归多主线并行行情。主题风格上，大小盘或趋于均衡，逐步向大中盘龙头倾斜；成长风格大概率相对占优，业绩支撑叠加政策持续落地，资源向科技、高端制造等成长赛道倾斜。结构布局上，一是AI“基建”，海外AI资本开支扩张与国内新型基建共振，算力、通信、电力等底层设施建设加速，产业链景气有望延续。二是周期与制造，输入型通胀抬升价格中枢，叠加新型基建和制造业出海需求修复，部分资源品与周期制造板块有望迎来修复。三是有业绩改善预期、分红稳定可持续的红利板块。", "ctime": 1782296305, "time_str": "18:18:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260624/c677685195.shtml"}, {"id": "4585961", "title": "LME锌主力合约跌超2%", "content": "LME锌主力合约跌超2%，现报3430.5美元/吨。", "ctime": 1782295762, "time_str": "18:09:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260624/c677684970.shtml"}, {"id": "4585959", "title": "COMEX铜期货跌超1%", "content": "COMEX铜期货跌超1%，现报6.08美元/磅。", "ctime": 1782295760, "time_str": "18:09:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260624/c677684969.shtml"}, {"id": "4585957", "title": "供销大集：控股股东一致行动人供销商贸拟增持不低于3000万元且不超过5000万元股份", "content": "供销大集公告，控股股东北京中合农信企业管理咨询有限公司的一致行动人中国供销商贸流通集团有限公司计划自公告发布之日起6个月内，以集中竞价交易方式增持公司股份，拟增持金额不低于人民币3000万元且不超过人民币5000万元。本次增持不设置固定价格，将结合资本市场行情择机开展。增持计划实施期间如公司股票停牌，将在复牌后顺延实施。本次增持不会导致公司股权分布不符合上市条件，不会导致控股股东及实际控制人发生变化。", "ctime": 1782295688, "time_str": "18:08:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260624/c677684915.shtml"}, {"id": "4585939", "title": "美国对伊军事行动花费高达1万亿美元", "content": "美国对伊朗的军事行动花费巨大，据哈佛大学肯尼迪学院公共财政专家琳达·比尔姆斯测算，美国对伊行动最终总成本“至少为1万亿美元”。在战事中，美国军工企业的牟利路径清晰展现：战场消耗，迅速转化为军火订单和资本回报；政府军费不断膨胀，反哺军工企业；在这一循环下，战争逐渐演变成一种“战火生意机制”。美国国防部近期曝出“龙虾门”丑闻。美国非政府组织“公开账目”揭露，五角大楼在2025年9月即上一财年收官之际，集中花掉934亿美元，不仅豪掷近900万美元采购阿拉斯加帝王蟹和龙虾尾，还购入单价1.2万美元的三层水果篮架、单价近10万美元的高端钢琴，创下自2008年以来美国联邦机构单月支出最高纪录。（新华社）", "ctime": 1782295606, "time_str": "18:06:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260624/c677684874.shtml"}, {"id": "4585903", "title": "“蜂影2026”全军首届小微无人机创新运用挑战赛开赛", "content": "“蜂影2026”全军首届小微无人机创新运用挑战赛，24日上午在河北石家庄拉开帷幕。为期3天的挑战赛，由中央军委装备发展部和训练管理部主办、陆军机关协办、陆军工程大学承办，共有来自全军部队的69支代表队同台竞技。据介绍，挑战赛着眼以赛促建、以赛促训、以赛强能，以实战场景下无人机组装调试、战场抢修、战术操控、协同运用为重点，打造装备技术运用试验区、战法训法创新孵化器、实战能力淬炼演练场，助推新质战斗力提升；以作战场景为牵引，课目设计上突出“飞”、比基础操控，突出“改”、比技术革新，突出“联”、比组网联用，突出“管”、比管理保障，旨在从“装备侧”破解作战运用面临的现实问题。记者在现场了解到，比赛课目内容各有侧重、难度渐次提升，有很强的针对性。如：“限时装调运投”课目侧重于知装管装，突出检验“管”和“改”的能力，重点考察对无人机性能特点的掌握运用水平。“低空越障突防”课目则侧重于精准操控，突出考察“飞”和“管”的能力，重点考察精准操控和快速维保技能。此外，比赛期间还开展了维修技能、创新成果观摩见学等活动，对小微无人机维修保障工作定位、基本理念、方法手段、实践应用等进行示范示教。（新华社）", "ctime": 1782295422, "time_str": "18:03:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260624/c677684765.shtml"}, {"id": "4585901", "title": "华东医药：全资子公司注射用HDM2005临床试验获批", "content": "华东医药公告，2026年6月23日，全资子公司杭州中美华东制药有限公司收到国家药品监督管理局核准签发的《药物临床试验批准通知书》，由中美华东申报的注射用HDM2005临床试验申请获得批准，适应症为本品联合PD-1单抗和AD（多柔比星和达卡巴嗪）用于治疗经典型霍奇金淋巴瘤。", "ctime": 1782295420, "time_str": "18:03:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260624/c677684763.shtml"}, {"id": "4585897", "title": "德国计划停建6艘万吨级护卫舰，改采8艘较小护卫舰", "content": "德国政府计划终止二战后最大战舰的建造计划，停建6艘万吨级护卫舰。英国方面24日消息称，两名知情人士透露，德国国防部长鲍里斯·皮斯托里乌斯和其他高级官员23日告诉舰船制造界人士及多名资深议员，计划放弃6艘F126型护卫舰的建造。作为替代，德国政府计划采购8艘较小的MEKO A-200型护卫舰。（央视新闻）", "ctime": 1782295416, "time_str": "18:03:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260624/c677684761.shtml"}, {"id": "4585889", "title": "东方明珠与泡泡玛特达成深度合作", "content": "24日，东方明珠宣布与潮玩品牌泡泡玛特达成深度合作，将于9月4日正式启幕“明珠潮玩季嘉年华”。东方明珠通过引入泡泡玛特旗下高人气IP形象，推出主题场景、限定周边和互动体验，把城市观光与潮玩消费结合起来，进一步吸引年轻客群和亲子游客。（第一财经）", "ctime": 1782295407, "time_str": "18:03:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260624/c677684758.shtml"}, {"id": "4585841", "title": "中国巨石：低介电等特种电子布产品未形成订单及收入", "content": "中国巨石股票交易异常波动的公告，公司近期关注到公司生产的电子布产品关注度较高，将公司列为“PCB概念”，公司生产的电子布产品主要是普通布、薄布系列。2025年，公司实现电子布销量10.62亿米，占营业收入的17.77%。低介电等特种电子布产品未形成订单及收入。", "ctime": 1782295302, "time_str": "18:01:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260624/c677684694.shtml"}, {"id": "4585797", "title": "平安电工：石英布尚处送样验证阶段，未实现产业化供应", "content": "平安电工公告，公司股票连续三个交易日（2026年6月22日、23日、24日）收盘价格涨幅偏离值累计超过20%，属于股票交易异常波动。针对近期市场高度关注的“石英布”概念，公司说明截至公告日，公司研发的石英布仍处于送样验证阶段，未实现产业化供应，较长时间内不会对公司经营业绩产生任何影响，且送样进展存在重大不确定性。此外，截至2026年6月24日，公司滚动市盈率为127.26倍，显著高于所处非金属矿物制品业行业滚动市盈率45.94倍，存在估值较高风险。公司主营业务为电热系统用云母耐温绝缘材料（2025年营收占比62.67%）、新能源热失控安全防护件（25.04%）和玻纤布（11.67%），未用于固态电池领域。", "ctime": 1782295226, "time_str": "18:00:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260624/c677684665.shtml"}, {"id": "4585759", "title": "商务部部长助理张力会见沙特国际电力和水务公司董事长阿布纳扬", "content": "6月23日，商务部部长助理张力在京会见沙特国际电力和水务公司董事长阿布纳扬。双方重点就加强承包工程、双向投资合作进行交流。张力表示，近年来两国全面战略伙伴关系深入发展，中沙经贸合作取得丰硕成果。中方欢迎沙特国际电力和水务公司等沙方企业充分利用中国“十五五”时期的广阔机遇，持续扩大对华投资。中方赞赏沙特国际电力和水务公司与中国企业间的良好伙伴关系，希望双方继续深化新能源、电力、海水淡化等领域合作。阿布纳扬赞赏中国经济取得的巨大成就和为全球发展作出的积极贡献，表示沙特国际电力和水务公司将持续加强与中国企业合作，共同实施更多工程、双向投资领域项目，促进双边经贸关系发展。（商务部）", "ctime": 1782295015, "time_str": "17:56:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260624/c677684514.shtml"}, {"id": "4585747", "title": "商务部：发挥举报对出口管制违法违规行为的监督作用是国际通行做法", "content": "有记者问：我们注意到商务部发布公告，进一步完善战略矿产两用物项出口管制违法违规行为举报处理工作，请问有什么考虑？ 答：《中华人民共和国出口管制法》第三十一条规定，对涉嫌违法违规行为，任何组织和个人有权向国家出口管制管理部门举报。进一步做好战略矿产两用物项举报处理工作，提升执法能力，是完善出口管制体系的基本要求，也是维护国家安全和利益的正常举措。同时，发挥举报对出口管制违法违规行为的监督作用是国际通行做法，世界许多国家都有相关规定，借鉴各国经验完善我国战略矿产两用物项出口管制举报制度，可以有效避免相关物项被用于非法用途，更好维护世界和平，展现中国作为负责任大国担当。此前，我们已就举报处理工作开展了相关实践，有必要进一步明确举报方式和内容等，更好进行线索处置。后续，相关部门将依法依规开展举报处理工作，保障合规贸易企业的合法权益。（商务部）", "ctime": 1782294811, "time_str": "17:53:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260624/c677684351.shtml"}, {"id": "4585741", "title": "法国西部高温致约6.8万户家庭停电", "content": "法国西部菲尼斯泰尔省政府24日说，受高温天气影响，23日晚该省南部一处变电设备发生事故，导致约6.8万户家庭停电。（新华社）", "ctime": 1782294744, "time_str": "17:52:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260624/c677684312.shtml"}, {"id": "4585739", "title": "全国首个一站式AI HR专家平台Mavens发布", "content": "2026年6月24日，AI HR科技公司北森宣布公司将从传统“HR软件”厂商，全面升级为HR领域的“AI应用”公司，并推出国内首个一站式AI HR专家平台Mavens。（科创板日报）", "ctime": 1782294708, "time_str": "17:51:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260624/c677684298.shtml"}, {"id": "4585729", "title": "内塔尼亚胡结束贪腐案本人作证 案件将进入下一阶段", "content": "当地时间24日，以色列总理内塔尼亚胡在特拉维夫地方法院结束了其涉嫌贪腐案庭审中的本人作证。该阶段历时约一年半，共计98次庭审。当地媒体称，这被认为创下以色列刑事审判史上被告作证时间最长纪录。在结束作证前的发言中，内塔尼亚胡指责检方误导其作证，并批评执法和司法系统，称这场历时多年的调查和审判是出于政治动机、意在阻止选民选择其领导人的“政治迫害”。内塔尼亚胡称，过去这些年是“10年地狱般的生活”，虽然无法追回这段时间，但“可以还原真相”。（央视新闻）", "ctime": 1782294661, "time_str": "17:51:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260624/c677684265.shtml"}, {"id": "4585721", "title": "海螺水泥：收购海螺设计院100%股权，收购代价为人民币5.62亿元", "content": "海螺水泥公告，公司与海螺集团签订股权转让协议，以人民币5.62亿元收购海螺集团持有的海螺设计院100%股权。此次交易完成后，海螺设计院将成为海螺水泥的全资附属公司。", "ctime": 1782294582, "time_str": "17:49:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260624/c677684222.shtml"}, {"id": "4585719", "title": "中国建筑：下属子公司中建地产（新加坡）有限公司与马来西亚双威集团合作开发新加坡里峇峇利埔C地段住宅地块房地产项目", "content": "中国建筑公告，下属子公司中建地产（新加坡）有限公司与马来西亚双威集团下属子公司Sunway MCL Limited合作开发新加坡里峇峇利埔C地段住宅地块房地产项目。项目位于新加坡核心中央区里峇峇利区域，为住宅用地，总占地面积约1.15万平方米，总计容建筑面积约4.03万平方米，项目预计总投资约66.14亿元人民币。中建地产（新加坡）将与Sunway MCL按照40%:60%的股权比例成立合资项目公司实施项目开发，双方联合操盘。", "ctime": 1782294564, "time_str": "17:49:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260624/c677684209.shtml"}, {"id": "4585717", "title": "五部门联合启动工业5G独立专网试点 加速“5G+工业互联网”赋能千行百业", "content": "工业和信息化部今天（24日）联合国务院国资委等五部门共同启动工业5G独立专网试点，通过机制创新支持5G深度赋能关键行业领域。工业5G独立专网是指由工业企业主导建设接入网、核心网等关键设施，可不依赖于公共网络独立运行的企业专属5G网络。试点工作将支持原材料、装备制造、消费品、电子信息、国防科技、能源交通等行业领域的大型特大型企业建设独立专网，鼓励“5G+工业互联网”融合应用城市试点率先开展独立专网建设工作。专家指出，目前，基础电信运营商主要通过在5G公共网络上划分专用传输通道、构建虚拟专网，或将部分公网设备下沉到生产现场、构建混合专网的“公网专用”方式推动工业企业网络化改造。工业5G独立专网在此基础上通过“专网专用”方式更好地满足装备制造、交通运输、能源电力等领域企业生产数据不出厂、网络资源专属专用等关键需求，加速“5G+工业互联网”赋能千行百业。（央视新闻）", "ctime": 1782294557, "time_str": "17:49:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260624/c677684205.shtml"}, {"id": "4585713", "title": "习近平在山东德州考察", "content": "中共中央总书记、国家主席、中央军委主席习近平24日在山东省德州市考察时强调，农业农村现代化关系中国式现代化全局和成色，要以扎实举措做好各项工作，着力提升农业综合生产能力和质量效益，确保粮食等重要农产品稳定供给，因地制宜推进宜居宜业和美乡村建设，引导广大农民群众用勤劳和智慧创造更加美好生活。（央视新闻）", "ctime": 1782294544, "time_str": "17:49:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260624/c677684190.shtml"}, {"id": "4585709", "title": "东阳光：控股子公司东莞云智算与秦阳公司签署预计不超过2亿元的IDC服务合同", "content": "东阳光公告，公司控股子公司东莞云智算与关联方庆阳秦阳信息科技有限公司签署《IDC服务合同》，预计12个月内采购相关IDC服务项目费用合计不超过2亿元。此次交易构成关联交易，但不构成重大资产重组。交易已获董事会审议通过，无需提交股东会审议。", "ctime": 1782294451, "time_str": "17:47:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260624/c677684141.shtml"}, {"id": "4585705", "title": "万泰生物：水痘减毒活疫苗上市许可申请获得受理", "content": "万泰生物公告，近日，全资子公司北京万泰生物药业有限公司收到国家药品监督管理局药品审评中心下发的水痘减毒活疫苗上市许可申请的《受理通知书》。药品名称为水痘减毒活疫苗，剂型为注射剂，规格为复溶后每瓶0.5ml。每1次人用剂量为0.5ml，含水痘-带状疱疹活病毒应不低于3.3lgPFU。水痘减毒活疫苗从上市许可申请获得受理到获批上市，还需经历比较长的周期，短期内不会对公司的财务状况、经营业绩产生重大影响。", "ctime": 1782294402, "time_str": "17:46:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260624/c677684126.shtml"}, {"id": "4585703", "title": "珠海免税中标满洲里公路口岸进境免税店经营权", "content": "近日，珠免集团旗下珠海市免税企业集团有限公司（简称“珠海免税”）成功中标满洲里公路口岸进境免税店经营权。此次中标，是继鄂尔多斯伊金霍洛国际机场出境免税店后，珠海免税在内蒙古自治区落地的首个陆路口岸免税项目。投入运营后，项目将进一步完善满洲里公路口岸商业配套功能，为跨境往来旅客提供更加便捷、多元的免税消费服务。（人民财讯）", "ctime": 1782294350, "time_str": "17:45:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260624/c677684097.shtml"}, {"id": "4585683", "title": "丰立智能：向特定对象发行股票申请获同意", "content": "丰立智能公告，公司收到中国证券监督管理委员会出具的《关于同意浙江丰立智能科技股份有限公司向特定对象发行股票注册的批复》（证监许可〔2026〕1492号），同意公司向特定对象发行股票的注册申请。本次发行应严格按照报送深圳证券交易所的申报文件和发行方案实施。批复自同意注册之日起12个月内有效。", "ctime": 1782294216, "time_str": "17:43:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260624/c677683978.shtml"}, {"id": "4585681", "title": "三星回应将回购价值近90万亿韩元的股票用于发放奖金：正在考虑，细节尚未确定", "content": "6月24日，三星电子在监管文件中表示，公司正考虑为支付奖金而进行股票回购，但尚未确定具体时间表和规模。三星电子称，该事项仍在讨论中，最迟一个月内另行公告。此前据报道，三星正准备回购价值近90万亿韩元的股票，以用于员工奖金发放，且可能很快公布细节。（新浪财经）", "ctime": 1782294210, "time_str": "17:43:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260624/c677683976.shtml"}, {"id": "4585679", "title": "中荣股份：首次回购0.12%公司股份，成交总金额为358.16万元", "content": "中荣股份公告，2026年6月24日，公司首次通过回购专用证券账户以集中竞价交易方式回购公司股份22.35万股，占公司总股本的0.12%，最高成交价格为16.1元/股，最低成交价格为15.99元/股，成交总金额为358.16万元（不含交易费用）。", "ctime": 1782294205, "time_str": "17:43:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260624/c677683972.shtml"}, {"id": "4585663", "title": "昀冢科技：控股子公司拟设立项目公司实施高性能多层片式陶瓷电容器生产项目，拟投资总额为15亿元", "content": "昀冢科技公告，控股子公司池州昀冢电子科技有限公司拟设立项目公司池州昀池电子有限公司为实施主体，投资高性能多层片式陶瓷电容器生产项目。本项目拟投资总额为15亿元，计划分两期进行，其中首期投资额7.5亿元，由池州昀冢及池州江南新兴产业基金合伙企业分别对项目公司增资4.5亿元、3亿元；第二期投资额预计为7.5亿元，将结合首期项目运营情况另行投资，由池州昀冢及地方国资或其指定主体分别对项目公司增资4.5亿元、3亿元。", "ctime": 1782293915, "time_str": "17:38 // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
