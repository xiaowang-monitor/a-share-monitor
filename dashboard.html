.score-bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s; }
.up { color: var(--red); }
.down { color: var(--green); }
.pulse { animation: pulse 2s infinite; }
@keyframes pulse {

  50% { opacity: 0.5; }
}
.glow { box-shadow: 0 0 20px rgba(59,130,246,0.15); }

const NEWS     = [{"id": "4623537", "title": "2026年全国铁路暑期运输7月1日启动", "content": "7月1日，为期62天的2026年全国铁路暑期运输将启动。7月1日至8月31日，全国铁路预计发送旅客10.1亿人次，日均发送旅客1629万人次。铁路部门坚持以人民为中心的发展思想，统筹客货运输和防洪安全，精心制定暑期旅客运输工作方案，加大运输能力投放，优化客货运输产品供给，提升站车服务品质，落实便民利民惠民举措，努力为旅客平安有序出行和经济平稳运行提供可靠保障。（新华社）", "ctime": 1782814002, "time_str": "18:06:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260630/c677839895.shtml"}, {"id": "4623519", "title": "晶科科技：海外电站股权交割未完成，对价不超1.75亿欧元", "content": "晶科科技公告，公司此前披露拟通过全资下属公司晶科西班牙向华电香港转让项目公司100%股权，交易对价不超过1.75亿欧元，涉及西班牙Antequera 175兆瓦光伏电站。截至2026年6月30日，因目标项目性能检测等交割前置事项尚未办结，本次交易暂未完成股权交割，目前交易双方仍在沟通磋商后续推进方案，各项配套工作有序推进。", "ctime": 1782813881, "time_str": "18:04:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260630/c677839834.shtml"}, {"id": "4623501", "title": "联合国：埃博拉疫情可能导致近百万人陷入贫困", "content": "当地时间6月30日，联合国开发计划署警告称，刚果（金）埃博拉疫情正在引发一场深远的社会经济危机，这可能导致98.5万人陷入贫困。其中，妇女在经济和卫生方面遭受的冲击尤为严重。联合国开发计划署表示，埃博拉疫情在刚果（金）及乌干达、卢旺达、南苏丹等国构成了贫困冲击，当地经济也因更广泛的旅行和贸易限制遭受重创。此外，危机还可能造成数万个工作岗位流失，若疫情冲击加剧，非洲经济损失或高达36亿美元。(央视新闻)", "ctime": 1782813810, "time_str": "18:03:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260630/c677839802.shtml"}, {"id": "4623439", "title": "中储股份：控股股东中储集团首次增持0.17%，拟再增持7500万至1.5亿元", "content": "中储股份公告，控股股东中国物资储运集团有限公司（简称中储集团）于2026年6月30日通过集中竞价方式首次增持公司股份370.17万股，占总股本0.17%，增持金额1535.21万元，持股比例由46.37%升至46.54%。同时，中储集团计划自2026年6月30日起6个月内，通过集中竞价方式继续增持，累计增持金额不低于7500万元、不超过1.5亿元，且增持比例不超过总股本2%。中储集团及其一致行动人合计持股比例由48.38%升至48.55%。", "ctime": 1782813643, "time_str": "18:00:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260630/c677839712.shtml"}, {"id": "4623423", "title": "国联民生：中海基金33.409%股权1.53亿元转让签约", "content": "国联民生公告，公司此前拟通过公开挂牌方式转让所持中海基金管理有限公司33.409%股权。2026年 "}, {"id": "4623271", "title": "八部门：深化人工智能与工业互联网融合应用", "content": "工业和信息化部等八部门印发《关于推动工业互联网高质量发展的实施意见》，意见提出，深化人工智能与工业互联网融合应用。支持企业、科研机构等充分发挥工业互联网泛在连接和数据汇聚关键作用，开展工业领域大模型和特定场景小模型的训练。开发模型互联接口，优化协同效率。开展创成式设计、人机交互、生产网络优化等创新应用，加快工业智能体推广，增强工业系统的智能感知与决策执行能力，提升设计、中试、生产、服务、运营等全环节智能化水平。", "ctime": 1782812967, "time_str": "17:49:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260630/c677839228.shtml"}, {"id": "4623269", "title": "汇金股份：董事长毛世权因工作调整辞职", "content": "汇金股份公告，公司董事长毛世权因工作调整原因申请辞去公司董事长、非独立董事等职务，辞职后不再担任公司任何职务。公司董事会同意补选王子杰为非独立董事候选人，任期自股东会通过之日起至第六届董事会届满之日止。", "ctime": 1782812966, "time_str": "17:49:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260630/c677839227.shtml"}, {"id": "4623251", "title": "八部门：推动工业互联网基础设施和智算设施、超算设施等算力基础设施一体规划、同步建设", "content": "工信部等八部门印发《关于推动工业互联网高质量发展的实施意见》。其中提到，推动工业互联网基础设施和智算设施、超算设施等算力基础设施一体规划、同步建设。探索构建工业算力网络体系，加强端边云多层级算力动态协同能力，满足各类主体业务发展算网存用需求。依托一体化算力网，强化算力互联互通，加强智能、边缘算力匹配供给，增强对海量异构数据高速处理和深度加工能力，深度赋能工业领域大模型训练、工业元宇宙实时交互等场景。", "ctime": 1782812843, "time_str": "17:47:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260630/c677839182.shtml"}, {"id": "4623233", "title": "八部门：到2030年，建设5万张工业5G专网", "content": "工信部等八部门印发《关于推动工业互联网高质量发展的实施意见》。其中提到，到2030年，建设5万张工业5G专网，标识解析服务企业范围不断拓展，打造5个左右具有国际影响力的综合型平台，初步构建较为完备的工业数据基础制度体系。融合应用实现207个工业中类全覆盖，培育一批分级分类、特色鲜明的5G工厂，重点行业规上工业企业安全分类分级普及率达到80%。工业互联网技术、标准、产品供给不断完善，企业实力和跨界合作水平显著提升，核心产业增加值突破2.5万亿元，成为新质生产力的重要组成。", "ctime": 1782812775, "time_str": "17:46:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260630/c677839140.shtml"}, {"id": "4623209", "title": "奥浦迈：发行289.58万股完成业绩对赌股份发行", "content": "奥浦迈公告，公司本次发行涉及的新增股份系向4名交易对方分期发行业绩承诺期第一个会计年度业绩对赌股份，新增股份合计289.58万股，已于2026年6月29日在中国证券登记结算有限责任公司上海分公司办理完成登记手续。本次发行的股票种类为人民币普通股（A股），发行价格为31.57元/股。本次交易标的资产的过户手续已办理完毕。", "ctime": 1782812660, "time_str": "17:44:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260630/c677839073.shtml"}, {"id": "4623159", "title": "泽连斯基称乌再次远程打击俄航天通信中心", "content": "当地时间6月30日，乌克兰总统泽连斯基证实，乌方在当天实施的远程打击行动中，再次击中俄罗斯莫斯科州杜布纳航天通信中心。泽连斯基表示，该设施主要用于卫星通信，是俄方开展战场侦察、协调前线军事行动的重要配套设施。此次打击目标距离乌克兰国境超500公里。截至目前，俄罗斯方面对此暂无回应。（央视新闻）", "ctime": 1782812400, "time_str": "17:40:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260630/c677838925.shtml"}, {"id": "4623125", "title": "西部矿业：控股子公司玉龙铜业对茶亭矿业增资38亿元", "content": "西部矿业公告，公司控股子公司西藏玉龙铜业股份有限公司以非公开协议方式现金对其全资子公司安徽西矿玉龙茶亭矿业有限公司增资38亿元。增资完成后，茶亭矿业注册资本由2亿元增加至40亿元，玉龙铜业仍持有茶亭矿业100%股权。增资完成后，玉龙铜业以非公开协议方式将安徽省宣州区茶亭铜多金属矿勘查探矿权转让至茶亭矿业，转让定价为86.89亿元（不含税）。", "ctime": 1782812211, "time_str": "17:36:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260630/c677838842.shtml"}, {"id": "4623107", "title": "央视网评寒武纪市值破万亿：里程碑前，更需一份清醒定力", "content": "央视网评论称，6月30日，寒武纪市值突破万亿元，成为科创板具有里程碑意义的硬科技企业。但越是市场关注的焦点，越要褪去市值光环，清醒看待当前挑战。其一，估值与业绩的匹配压力不容忽视。当前市场对AI赛道预期较高，估值中既包含企业自身的技术进步，也隐含了外部环境带来的国产替代红利。高估值是把双刃剑，既能为研发提供弹药，也意味着一旦后续产品落地或业绩释放不及预期，面临估值回调的压力。 其二，国产AI芯片从“能用”迈向“好用”，仍需攻克难关。客观来看，国产芯片在推理场景、算力领域已达到可用水平，但在高端大模型训练算力硬件、开发者生态建设等方面，与国际顶尖水平仍存在一定差距。 其三，需警惕市值热度催生的产业浮躁心态。万亿市值的示范效应下，赛道可能出现融资过热、同质化竞争加剧等问题，部分企业也可能受股价波动影响，分心短期市值管理，放松长期技术研发，这是硬科技产业长远发展的隐忧。", "ctime": 1782812171, "time_str": "17:36:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260630/c677838812.shtml"}, {"id": "4623079", "title": "众鑫股份：拟以3000万元-5000万元回购公司股份", "content": "众鑫股份公告，拟以3000万元-5000万元回购公司股份，回购价格不超过75.46元/股。", "ctime": 1782811999, "time_str": "17:33:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260630/c677838728.shtml"}, {"id": "4623067", "title": "数据显示29日24艘油轮及商船通过霍尔木兹海峡", "content": "航运分析机构克普勒公司发布数据显示，29日共有24艘油轮及商船通过霍尔木兹海峡。", "ctime": 1782811911, "time_str": "17:31:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260630/c677838691.shtml"}, {"id": "4623061", "title": "伊朗革命卫队称在西北边境打击一支“敌对”武装小组", "content": "当地时间6月30日，伊朗伊斯兰革命卫队地面部队发布通报称，一支“敌对”分离主义武装小组进入伊朗西北部边境地区，企图实施破坏和恐怖活动。通过情报监控与拦截行动，部队指挥部作战人员展开行动，该6人小组被“完全消灭”。通报再次对分离主义及恐怖主义势力发出警告，称任何试图危害伊朗西北边境安全的行为，都将遭到“果断且严厉的回应”。（央视新闻）", "ctime": 1782811896, "time_str": "17:31:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260630/c677838677.shtml"}, {"id": "4623057", "title": "南向资金今日净买入58.95亿港元 中芯国际获净买入居前", "content": "南向资金今日净买入58.95亿港元。中芯国际、建滔积层板分别获净买入约19.33亿港元、10.59亿港元；长飞光纤光缆、阿里巴巴-W分别遭净卖出3.32亿港元、3.06亿港元。", "ctime": 1782811885, "time_str": "17:31:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260630/c677838673.shtml"}, {"id": "4623031", "title": "野村中国首席经济学家陆挺：中国在AI领域具备综合发展优势", "content": "野村中国首席经济学家陆挺在媒体交流会上分享了最新研究观点。有别于近年流行的诸如区块链、元宇宙等概念，AI是一场真正划时代的技术革命，对经济和社会将会产生深远的影响，能为中国经济与金融市场提供有力的支撑。中国在AI领域具备综合发展优势。陆挺介绍，相关研究报告显示，目前中国AI专利数量全球领先，大模型数量也位居前列。据估算，2026年与AI相关的固定资产投资将为GDP增长贡献0.3个百分点。（财联社）", "ctime": 1782811732, "time_str": "17:28:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260630/c677838400.shtml"}, {"id": "4623001", "title": "优必选正式发布超仿生人形机器人，顶配版售价99万元", "content": "6月30日，深圳，优必选正式发布消费级人形机器人品牌“优世界”的超仿生人形机器人U1系列，分为Lite、Pro和Ultra三个版本。Lite版本售价11.98万元，Pro版售价16.98万元，Ultra售价99万元（男款）和88万元（女款）。据介绍，U1系列线上线下订单已超1.3万台，将于9月16日开始交付。(澎湃新闻)", "ctime": 1782811478, "time_str": "17:24:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260630/c677838258.shtml"}, {"id": "4622995", "title": "SK海力士拟订购半导体检测设备 总价最高可达4000亿韩元", "content": "SK海力士正在与半导体设备厂商讨清州P&T7工厂所需的半导体检测设备供应事宜。各设备公司正在口头协调明年可交付的设备数量。设备行业预计，该工厂将订购约200台设备，其中包括HBM4测试仪。按每台15亿至20亿韩元的价格计算，总价最高可达4000亿韩元。（财联社）", "ctime": 1782811385, "time_str": "17:23:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260630/c677838210.shtml"}, {"id": "4622969", "title": "长城汽车：长汽转债将于2026年7月6日至权益分派股权登记日期间停牌", "content": "长城汽车公告，公司将于2026年7月7日公布2025年度权益分派实施方案。根据方案，以股权登记日的总股本为基数，向全体股东每股派发人民币0.35元（含税）的现金股利。自2026年7月6日至权益分派股权登记日期间，“长汽转债”将停止转股。本次权益分派股权登记日后的第一个交易日起，“长汽转债”恢复转股，拟享受权益分派的可转债持有人可在2026年7月3日之前进行转股。", "ctime": 1782811210, "time_str": "17:20:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260630/c677838104.shtml"}, {"id": "4622967", "title": "可孚医疗：两款血糖监测产品获得欧盟CE认证", "content": "可孚医疗公告，近日公司两款血糖监测产品获得欧盟CE认证，可在欧盟国家及认可欧盟CE认证的国家销售。本次取得欧盟CE认证的血糖监测系统，公司其他产品亦已获得海外多地市场准入资质，进一步完善公司境内及海外市场产品矩阵，为全球化业务拓展夯实基础。", "ctime": 1782811206, "time_str": "17:20:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260630/c677838085.shtml"}, {"id": "4622961", "title": "中咨公司注资中诚华隆 布局国产算力芯片赛道", "content": "6月30日，记者从公司获悉，近日，中国国际工程咨询有限公司（简称“中咨公司”）依托旗下专业基金平台，完成对中诚华隆的注资。此次入股是中咨公司专业基金平台设立以来落地的首个芯片类投资项目，标志着中咨公司通过旗下专业基金平台正式布局国产算力芯片赛道。中诚华隆是国内少数具备“芯片（GPU/CPU/QPU/SoC）+整机+解决方案”全栈自主可控能力的科技创新型企业。（人民财讯）", "ctime": 1782811100, "time_str": "17:18:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260630/c677838024.shtml"}, {"id": "4622949", "title": "智洋创新：以3亿元认购灵明光子增资", "content": "智洋创新公告，公司以人民币3亿元认购灵明光子人民币33.44万元的新增注册资本，对应灵明光子本次增资完成后基于完全摊薄基础上共计9.1463%的股权。本次交易完成后，公司有权提名1名董事，并成为标的公司整体出售否决权股东。", "ctime": // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
