", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260617/c677541283.shtml"}, {"id": "4546699", "title": "通鼎互联：与英伟达不存在任何业务关系，康宁仅作为光棒供应商采购规模有限", "content": "通鼎互联公告，公司股票于2026年6月15日、16日、17日连续三个交易日收盘价格涨幅偏离值累计超过20%，属于股票交易异常波动。经公司核实，近期某微信公众号发表《搭上英伟达，A股光纤牛股年内涨超300%》文章，公司澄清：康宁仅作为公司光纤预制棒原材料供应商，采购规模有限，不存在独家供货情形，也无其他合作关系；公司与英伟达不存在任何业务关系。公司目前经营情况正常，内外部经营环境未发生重大变化。", "ctime": 1781694532, "time_str": "19:08:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260617/c677541260.shtml"}, {"id": "4546697", "title": "美伊谅解备忘录将在瑞士一度假村签署", "content": "瑞士外交部表示，美伊谅解备忘录的签署仪式将于当地时间6月19日在瑞士比尔根山度假村举行。据了解，美国副总统万斯和伊朗议会议长卡利巴夫预计将出席签字仪式。为何此次签署仪式选在瑞士比尔根山度假村举行？中国现代国际关系研究院中东研究所副所长秦天分析指出，瑞士比尔根山度假村曾举办过很多类似的重要活动，也曾是伊核谈判的地点。此外，比尔根山度假村背后有非常强大的卡塔尔资本，这也在一定程度上反映出卡塔尔居间斡旋对弥合美伊分歧起到了非常关键的作用。（CCTV国际时讯）", "ctime": 1781694529, "time_str": "19:08:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260617/c677541251.shtml"}, {"id": "4546695", "title": "特朗普：同伊朗的谅解备忘录不是最终协议", "content": "美国总统特朗普17日表示，同伊朗的谅解备忘录不是最终协议，“如果我不满意，我们将恢复向伊朗投掷炸弹”。（新华社）", "ctime": 1781694480, "time_str": "19:08:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260617/c677541107.shtml"}, {"id": "4546689", "title": "*ST星光：公司股票将于6月22日起撤销退市风险警示", "content": "*ST星光公告，公司股票交易将于2026年6月18日开市起停牌1天，并于2026年6月22日开市起复牌。自2026年6月22日开市起撤销退市风险警示，股票简称由“*ST星光”变更为“星光股份”，股票代码仍为“002076”，股票交易日涨跌幅限制由“5%”变更为“10%”。", "ctime": 1781694451, "time_str": "19:07:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260617/c677541022.shtml"}, {"id": "4546643", "title": "美迪凯：2025年玻璃基板销售收入占营收约2.00%，TGV工艺尚未形成量产收入", "content": "美迪凯公告，公司股票于2026年6月15日、16日、17日连续三个交易日收盘价格涨幅偏离值累计达到30%，属于股票交易异常波动。经公司自查，近期资本市场对“玻璃基板”概念关注度较高，公司向客户供应的半导体用玻璃基板为未打孔基板，2025年相关产品销售收入占公司总营收比重约为2.00%，占比较低；公司开发的玻璃通孔、孔内金属化等TGV工艺尚未形成量产收入。此外，公司通过收购进入三星供应链，2025年该业务销售收入占营收比重不足2.50%，产品为手机摄像模组用软膜滤光片；功率芯片的晶圆级封测业务尚未形成量产收入。公司目前生产经营正常，控股股东及实际控制人不存在应披露而未披露的重大事项。", "ctime": 1781694219, "time_str": "19:03:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260617/c677540923.shtml"}, {"id": "4546633", "title": "中材科技：全资子公司泰山玻纤特种纤维布产品占营收2.08%，经营未发生重大变化", "content": "中材科技公告，公司股票于2026年6月15日、16日、17日连续3个交易日收盘价格涨幅偏离值累计超20%。经核实，公司全资子公司泰山玻纤生产的特种纤维布产品是PCB基础材料之一，市场将公司列为“PCB概念”。2025年度泰山玻纤销售特种纤维布产品1917万米，实现销售收入6.28亿元，占泰山玻纤当年营业收入的6.94%，占公司2025年营业收入的2.08%，总体占比较小，且产品价格平稳，经营未发生重大变化。此外，公司2025年度向特定对象发行A股股票事项尚处于深交所审核阶段，“年产3,500万米特种玻纤布项目”等三个投资项目尚处于建设阶段。公司确认不存在应披露而未披露的重大事项。", "ctime": 1781694178, "time_str": "19:02:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260617/c677540900.shtml"}, {"id": "4546557", "title": "上海电气：子公司收购昂华自动化58.02%股份 交易价格为1.19亿元", "content": "上海电气公告，为进一步深化在锂电装备领域的布局，公司下属控股子公司深圳市赢合科技股份有限公司以非公开协议转让方式向上海电气控股集团有限公司收购其所持有的昂华（上海）自动化工程股份有限公司58.02%股份。交易价格以2025年12月31日为评估基准日昂华自动化的股东全部权益价值评估值为依据，交易金额为人民币1.19亿元（根据最终经国资备案的评估价格按股比确定）。本次交易构成关联交易，但不构成《上市公司重大资产重组管理办法》规定的重大资产重组，未达到股东会审议标准。", "ctime": 1781693914, "time_str": "18:58:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260617/c677540422.shtml"}, {"id": "4546525", "title": "江苏博迁新材料股份有限公司向港交所提交上市申请书", "content": "据港交所文件：江苏博迁新材料股份有限公司向港交所提交上市申请书。", "ctime": 1781693638, "time_str": "18:53:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260617/c677540120.shtml"}, {"id": "4546523", "title": "诚邦股份：拟定增募资不超过1亿元用于嵌入式存储芯片扩产及补流", "content": "诚邦股份公告，公司拟以简易程序向特定对象发行股票，募集资金总额不超过1亿元，扣除发行费用后用于嵌入式存储芯片扩产项目（拟使用募集资金7500万元）及补充流动资金（2500万元）。本次发行对象为不超过35名特定投资者，发行价格不低于定价基准日前20个交易日公司股票交易均价的80%，发行股票数量不超过发行前总股本的30%，限售期为6个月。本次发行方案已获公司董事会审议通过，尚需上交所审核及中国证监会同意注册。", "ctime": 1781693606, "time_str": "18:53:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260617/c677539909.shtml"}, {"id": "4546517", "title": "期货业并购再增一例，申银万国期货拟吸收合并宏源期货", "content": "期货业并购再增一例。申银万国期货最新公告称，拟吸收合并宏源期货。申银万国期货的股东已作出同意本次合并的股东决定。本次合并完成后，宏源期货将依法注销法人资格。自本次合并的交割日起，合并后的申银万国期货将承继及承接宏源期货的全部资产、负债、业务、人员、合同、资质及其他一切权利与义务。申银万国期货特此通知债权人，债权人自接到申万期货通知之日起30日内、未接到通知的自本公告披露之日起45日内，均有权凭有效债权文件及相关凭证要求申万期货清偿债务或提供相应担保。在此之前，今年中金财富期货已获批吸收合并中金期货，国泰君安期货合并海通期货也已披露重组计划。（财联社）", "ctime": 1781693554, "time_str": "18:52:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260617/c677539894.shtml"}, {"id": "4546505", "title": "美国总统特朗普称赞股市上涨，油价下跌", "content": "美国总统特朗普称赞股市上涨，油价下跌。", "ctime": 1781693356, "time_str": "18:49:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260617/c677539846.shtml"}, {"id": "4546501", "title": "江海股份：股价自4月以来涨幅264.23%，一季度超级电容AI服务器电源端应用约1200万元", "content": "江海股份公告，公司股票连续3个交易日（2026年6月15日、16日、17日）收盘价格涨幅偏离值累计超过20%，属于股票交易异常波动。公司生产经营基本面未发生重大变化，股票自4月以来涨幅达264.23%，期间多次异动。截至6月17日，收盘价104.93元/股，动态市盈率137.72倍，高于电子元件行业平均市盈率97.41倍，存在市场情绪过热及非理性炒作情形。2025年度铝电解电容器收入占比80.55%，薄膜电容器10.49%，超级电容器6.42%。2026年一季度超级电容收入1.06亿元，占营业收入7.66%，其中AI服务器电源端应用约1200万元；固态高分子叠层电容器（MLPC）收入约2200万元，占比1.59%，相关业务规模均较小。", "ctime": 1781693317, "time_str": "18:48:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260617/c677539836.shtml"}, {"id": "4546445", "title": "百润股份：拟向特定对象发行股票募集资金不超13.05亿元", "content": "百润股份公告，公司拟向特定对象发行股票募集资金不超过13.05亿元，募集资金扣除发行费用后将全部用于麦芽威士忌桶陈扩能项目和研发检测中心项目。本次发行股票数量不超过3.12亿股，发行价格不低于定价基准日前20个交易日公司股票交易均价的80%。本次发行对象为不超过35名特定投资者，最终发行对象将在通过深交所审核并经中国证监会同意注册后，按照相关规定确定。", "ctime": 1781692883, "time_str": "18:41:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260617/c677539667.shtml"}, {"id": "4546435", "title": "浙农股份：通过股份回购专用证券账户以集中竞价方式回购公司股份数量为579.69万股，占公司总股本比例1.12%", "content": "浙农股份公告，截至2026年6月16日，公司通过股份回购专用证券账户以集中竞价方式回购公司股份数量为579.69万股，占公司总股本比例1.12%，最高成交价为8.3元/股，最低成交价为7.77元/股，成交总金额4679.99万元（不含交易费用）。", "ctime": 1781692791, "time_str": "18:39:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260617/c677539632.shtml"}, {"id": "4546433", "title": "农产品：项目公司竞得项目部分用地 成交金额6527万元", "content": "农产品公告，2026年6月16日，珠海市珠西农产品供应链有限公司竞得项目部分用地，并于6月17日签订了《成交确认书》。地块位于珠海市斗门区白蕉镇江珠高速南侧、县道589东侧，宗地面积12.43万平方米，用地性质为物流用地，使用年限50年，成交金额6527万元。", "ctime": 1781692784, "time_str": "18:39:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260617/c677539630.shtml"}, {"id": "4546431", "title": "奕瑞科技：完成回购0.33%公司股份", "content": "奕瑞科技公告，截至2026年6月16日，公司通过集中竞价交易方式累计回购股份98.66万股，占公司总股本的比例为0.33%，回购的最高价为104.77元/股，最低价为98.14元/股，已支付的总金额为1亿元（不含印花税、交易佣金等交易费用）。本次回购股份将用于员工持股计划及/或股权激励。", "ctime": 1781692700, "time_str": "18:38:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260617/c677539595.shtml"}, {"id": "4546409", "title": "中老签署2026年澜湄合作专项基金老挝项目协议", "content": "中国驻老挝大使方虹与老挝外交部副部长迈通16日在万象签署2026年澜湄合作专项基金老挝项目合作协议。中国驻老挝大使馆和老挝有关部委代表出席签署仪式。（新华社）", "ctime": 1781692568, "time_str": "18:36:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260617/c677539546.shtml"}, {"id": "4546407", "title": "中兰环保股价大跌超14%，重要股东高位套现，公司回应", "content": "6月17日，中兰环保股价大跌，盘中跌幅超过14%。截至收盘，公司股价报26.2元/股，收盘跌幅为11.64%。消息面上，中兰环保重要股东高位套现。此外，公司应收账款较高，引发市场关注。中兰环保方面回应称：“目前，持股5%以上股东的减持尚未结束。对于应收账款，和工程类企业的性质有一定关系，公司成立了专门的清欠团队，清欠团队基本都在外面跑回款。公司在做新招标项目时，会考虑客户回款的问题，也会努力 // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
