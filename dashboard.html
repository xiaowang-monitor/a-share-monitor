rket": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260410/c675901522.shtml"}, {"id": "4211399", "title": "商务部：支持内蒙古自贸试验区面向更大范围提供快捷高效算力服务", "content": "4月10日下午，国务院新闻办公室举行介绍《中国（内蒙古）自由贸易试验区总体方案》有关情况的政策例行吹风会。商务部部长助理袁晓明回答了澎湃新闻记者关于如何将当地资源优势转化为现代化产业红利的提问。他说，内蒙古风电、太阳能、煤炭等能源资源优势突出，设立内蒙古自贸试验区，将进一步把资源禀赋、产业优势与制度创新结合起来，助力内蒙古锻长板、补短板，推动传统产业提档升级、新兴产业创新突破、未来产业夯基垒台，构建具有内蒙古特色优势的现代化产业体系。（澎湃）", "ctime": 1775810698, "time_str": "16:44:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260410/c675901446.shtml"}, {"id": "4211387", "title": "市场监管总局发布三项针灸国家标准", "content": "据央视新闻消息，市场监管总局批准发布《针灸技术操作规范 第4部分：三棱针》《针灸异常情况处理》和《穴位贴敷用药规范》三项针灸领域推荐性国家标准，10月1日起实施。这些标准由国家中医药管理局修订，包含三棱针疗法操作规范、针灸异常情况处理方法及穴位贴敷用药规范，旨在提高技术操作的统一性与安全性，为临床、教学及科研提供参考，推动针灸技术推广及国际化应用。", "ctime": 1775810407, "time_str": "16:40:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260410/c675901294.shtml"}, {"id": "4211385", "title": "杭氧股份：2025年净利润9.49亿元，同比增长2.87%", "content": "杭氧股份公告，2025年营业收入150.83亿元，同比增长9.96%。净利润9.49亿元，同比增长2.87%。公司董事会审议通过的利润分配预案为：以2025年度权益分派实施时确定的股权登记日的总股本为基数，向全体股东每10股派发现金红利3元（含税），送红股0股（含税），不以公积金转增股本。", "ctime": 1775810401, "time_str": "16:40:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260410/c675901289.shtml"}, {"id": "4211381", "title": "一品红：全资子公司获得卡络磺钠注射液注册证书", "content": "一品红公告，全资子公司广州一品红制药有限公司于近日收到国家药品监督管理局核准签发的关于卡络磺钠注射液的《药品注册证书》。卡络磺钠注射液适应症为：用于泌尿系统、上消化道、呼吸道和妇产科出血疾病。对泌尿系统疗效较显著，亦可用于手术出血的预防及治疗等。", "ctime": 1775810378, "time_str": "16:39:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260410/c675901266.shtml"}, {"id": "4211377", "title": "伊拉克与埃及外长讨论地区局势降温", "content": "伊拉克外交部长侯赛因9日晚在首都巴格达会见来访的埃及外交部长阿卜杜勒阿提，双方就地区局势降温及即将举行的美伊谈判等问题交换意见。据伊拉克外交部发布的声明，侯赛因赞赏埃及在推动地区局势降温以及同各方接触等方面发挥的作用，同时表示伊拉克支持国际社会为促成谈判所作努力，认为当前需广泛协调行动，以达成有助于巩固地区稳定的共识。另据埃及外交部声明，阿卜杜勒阿提在会见时表示，强烈谴责一切针对阿拉伯海湾国家、伊拉克及约旦的袭击。各方应以美伊共同宣布停火为契机，持续推动局势缓和，坚持外交对话与政治解决。此外，双方就黎巴嫩近期局势交换了意见，强调局势升级的严重性以及采取联合行动遏制局势升级的必要性。(新华社)", "ctime": 1775810323, "time_str": "16:38:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260410/c675901218.shtml"}, {"id": "4211361", "title": "焦作万方：预计2026年第一季度净利润为4.9亿元—5.2亿元，同比上升203.61% --222.20%", "content": "焦作万方公告，预计2026年第一季度净利润为4.9亿元—5.2亿元，同比上升203.61% --222.20%。报告期内业绩增长主要系电解铝业务销售价格上涨，同时主要原材料氧化铝等采购价格下降，公司进一步加强生产管理，生产成本得到有效控制同比下降。", "ctime": 1775809896, "time_str": "16:31:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260410/c675900967.shtml"}, {"id": "4211359", "title": "保时捷在华销量再降20%，较三年前缩水6成", "content": "4月10日，保时捷官方称，2026年一季度，保时捷全球交付新车6.1万辆，同比下滑15%，主要受燃油版718停产、纯电Macan去年同期上市高基数，以及美国新能源汽车税收优惠取消共同影响。其中，北美以1.8万辆保持最大单一市场地位，同比下滑11%；德国本土交付7778辆，同比微增4%；欧洲（不含德国）下滑18%；中国市场交付7519辆，同比下降21%。（第一财经）", "ctime": 1775809886, "time_str": "16:31:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260410/c675900963.shtml"}, {"id": "4211357", "title": "四方新材：2026年第一季度商品混凝土产量66.66万立方米", "content": "四方新材公告，公司2026年第一季度主要产品产量如下：商品混凝土66.66万立方米，同比下降14.61%；湿拌砂浆1.81万立方米，同比下降8.27%；沥青混凝土2.02万吨，同比增长57.09%；装配式混凝土预制构件0.49万立方米，同比下降17.17%。主要产品的产量数据为合并口径，含公司及控股子公司的生产量。", "ctime": 1775809863, "time_str": "16:31:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260410/c675900953.shtml"}, {"id": "4211347", "title": "广博股份：2025年净利润1.65亿元，同比增长8.13%", "content": "广博股份公告，2025年营业收入27.46亿元，同比下降1.17%。净利润1.65亿元，同比增长8.13%。公司计划不派发现金红利，不送红股，不以公积金转增股本。", "ctime": 1775809774, "time_str": "16:29:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260410/c675900900.shtml"}, {"id": "4211345", "title": "曝豆包语音记录期间插入广告", "content": "4月10日，一豆包用户吐槽，字节跳动旗下AI助手豆包在语音记录过程中，直接插入了关键词广告。截图显示，该用户在使用豆包记录会议时，当对话中出现“画册”相关关键词后，豆包直接中断了正常的会议记录，插入了一家视觉传媒公司的广告，并详细介绍了该公司的画册设计、印刷报价等信息。截至目前，字节跳动及豆包官方尚未就该事件作出回应。（新浪科技）", "ctime": 1775809770, "time_str": "16:29:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260410/c675900896.shtml"}, {"id": "4211343", "title": "复星医药：控股子公司药品获注册批准", "content": "复星医药公告，近日，控股子公司重庆药友制药有限责任公司就氟比洛芬酯注射液的药品注册申请获国家药品监督管理局批准，本次获批适应症为用于术后及癌症的镇痛。", "ctime": 1775809761, "time_str": "16:29:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260410/c675900890.shtml"}, {"id": "4211339", "title": "互联网平台价格新规今起实施 三部门纠治自动续费、免密支付等情况", "content": "2025年12月9日，国家发展改革委、市场监管总局、国家网信办印发《互联网平台价格行为规则》，2026年4月10日起实施。2025年12月至2026年3月，三部门组织主要平台企业对照《行为规则》要求，开展自查自纠。一是查价格竞争行为，纠治价格无序竞争、价格欺诈等各类不正当价格竞争，让经营者切实合规经营；二是查价格标示行为，纠治价格促销、动态定价等规则不清晰行为，推动落实明码标价要求，让消费者明明白白消费；三是查自主定价行为，纠治平台强制或变相强制商户降价、跟价等流量算法规则，让平台内商户自主定价；四是查消费者权益保护行为，纠治自动续费、免密支付等提示方式，让消费者自主选择。（央视新闻）", "ctime": 1775809724, "time_str": "16:28:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260410/c675900879.shtml"}, {"id": "4211337", "title": "越剑智能：2025年净利润8538.17万元，同比下降13.36%", "content": "越剑智能公告，2025年营业收入10.64亿元，同比下降17.83%。净利润8538.17万元，同比下降13.36%。公司拟不进行利润分配、亦不以公积金转增股本，剩余未分配利润结转至以后年度分配。", "ctime": 1775809691, "time_str": "16:28:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260410/c675900863.shtml"}, {"id": "4211329", "title": "川投能源：2026年一季度发电量8.89亿千瓦时，同比降7.40%", "content": "川投能源公告，公司2026年1-3月控股企业累计发电量8.89亿千瓦时，同比降低7.40%，上网电量8.71亿千瓦时，同比降低7.83%，平均上网电价0.344元／千瓦时，同比降低2.82%。其中水电发电量8.45亿千瓦时，同比降低6.73%，上网电价0.340元／千瓦时，同比降低2.58%；光伏发电量0.44亿千瓦时，同比降低18.52%，上网电价0.413元／千瓦时，同比降低6.98%。", "ctime": 1775809563, "time_str": "16:26:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260410/c675900808.shtml"}, {"id": "4211327", "title": "国药现代：预计2026年第一季度净利润同比下降65.03%到58.94%", "content": "国药现代公告，预计2026年第一季度归属于上市公司股东的净利润为1.26亿元到1.48亿元，同比下降65.03%到58.94%。本期业绩预减的主要原因是2025年下半年以来，全球原料药产业面临本土化回流加速、印度及美国贸易保护主义加剧、国内抗生素产能过剩、集采政策持续传导以及部分核心客户需求下降等因素叠加影响，抗生素类医药中间体及原料药行业整体承压。面对严峻形势，公司主动以价换量争取市场份额，因价格下行导致医药中间体及原料药板块毛利率大幅下降，从上年同期的32.65%降至15.35%，导致本期归属于上市公司股东的净利润较上年同期下降幅度超过50%。", "ctime": 1775809554, "time_str": "16:25:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260410/c675900805.shtml"}, {"id": "4211325", "title": "证监会启动上市公司治理专项行动", "content": "公司治理是上市公司高质量发展的基石。为推动落实最新修订的《上市公司治理准则》等制度规则，筑牢防范财务造假的第一道防线，证监会自4月起启动上市公司治理专项行动。目标是发挥资本市场对完善公司治理的推动作用，形成参与各方积极履职、相互制衡，助力企业科学决策的良好生态。一是突出实效。切实推动各项制度和规则落地，形成良好示范效应。二是聚焦关键。紧紧围绕重点领域，力争用典型案例“小切口”引导规范运作“大文章”。三是内外协同。坚持公司自治与监管约束并重，激发内生动力。证监会将组织推动一批典型案例，持续深化公司治理监管约束，营造有利于上市公司规范发展的良好环境，推动提高上市公司质量，促进资本市场持续稳定健康发展。(证监会)", "ctime": 1775809521, "time_str": "16:25:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260410/c675900792.shtml"}, {"id": "4211323", "title": "霍尔木兹海峡收费权或成美伊谈判争议焦点", "content": "伊朗与美国即将在巴基斯坦首都伊斯兰堡举行首轮会谈。有分析指出，伊朗对经过霍尔木兹海峡船舶的收费权，将成为本轮谈判的关键争议点之一。美国总统特朗普9日在社交媒体上“喊话”，要求伊朗不得对海峡收取通行费。一些分析人士认为，最可信的方案是伊朗和阿曼建立某种伙伴关系。主营航运分析的比利时克普勒公司分析师米歇尔·布鲁阿尔认为，“如果伊朗和阿曼能达成解决方案，构筑某种合法化的收费站，即一种允许船只通过海峡的机制”，伊朗可借此获得资金。 一名伊朗外交消息人士告诉媒体记者，伊朗已与阿曼共同建立了一个新的霍尔木兹海峡通行机制。(新华社)", "ctime": 1775809488, "time_str": "16:24:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260410/c675900776.shtml"}, {"id": "4211321", "title": "大为股份今日涨4.18%，3家机构专用席位净买入1.10亿元", "content": "大为股份今日涨4.18%，成交额22.85亿元，换手率32.76%，盘后龙虎榜数据显示，3家机构专用席位净买入1.10亿元，有1家机构专用席位净卖出2238.42万元。", "ctime": 1775809472, "time_str": "16:24:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260410/c675900769.shtml"}, {"id": "4211319", "title": "三瑞智能今日涨272.77%，3家机构专用席位净买入2.41亿元", "content": "三瑞智能今日涨272.77%，成交额23.11亿元，换手率81.83%，盘后龙虎榜数据显示，3家机构专用席位净买入2.41亿元，有1家机构专用席位净卖出901.97万元。", "ctime": 1775809442, "time_str": "16:24:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260410/c675900732.shtml"}, {"id": "4211315", "title": "东软载波：2025年净利润1047.63万元，同比下降84.32%", "content": "东软载波公告，2025年营业收入10.52亿元，同比增长2.05%。净利润1047.63万元，同比下降84.32%。公司经本次董事会审议通过的利润分配预案为：以4.63亿为基数，向全体股东每10股派发现金红利0.05元（含税），送红股0股（含税），以资本公积金向全体股东每10股转增0股。", "ctime": 1775809418, "time_str": "16:23:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260410/c675900727.shtml"}, {"id": "4211311", "title": "深圳燃气：一季度净利润2.67亿元，同比增长14.56%", "content": "深圳燃气发布业绩快报，第一季度营业总收入68.11亿元，同比减少9.35%。净利润2.67亿元，同比增长14.56%。主要是燃气资源业务利润和综合能源业务利润增加所致。", "ctime": 1775809306, "time_str": "16:21:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260410/c675900671.shtml"}, {"id": "4211309", "title": "16名注册会计师受警告 财政部对中兴财光华作出重罚", "content": "财政部4月10日发布对中兴财光华会计师事务所的行政处罚决定。从该行政处罚决定内容看，自2025年6月起，财政部组织检查组对中兴财光华开展了执业质量检查，并延伸检查了相关企业。经查，中兴财光华在多个审计项目中存在执业质量问题，其中包含涉及东旭集团有限公司、东旭光电科技股份有限公司、东旭蓝天新能源股份有限公司等三家“东旭系”企业的财务报表审计问题。上述三家企业曾因财务造假、欺诈发行等违法行为受到证券监督管理部门重罚。", "ctime": 1775809302, "time_str": "16:21:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260410/c675900660.shtml"}, {"id": "4211301", "title": "冰川网络：预计2026年第一季度净亏损950万元至1350万元", "content": "冰川网络公告，预计2026年第一季度归属于上市公司股东的净亏损为950万元至1350万元，上年同期净利润为1.89亿元。扣除非经常性损益后的净亏损为2900万元至3350万元，上年同期净利润为1.86亿元。报告期内，基于前期游戏产品测试数据，公司持续对SLG类新产品《X-Clash》开展大规模市场投放，销售费用同比显著增加。", "ctime": 1775808930, "time_str": "16:15:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260410/c675900524.shtml"}, {"id": "4211291", "title": "美股光通信股盘前走高 Lumentum涨近5%", "content": "美股光通信股盘前走高，Lumentum涨近5%，公司预计将在两个季度内售罄2028年的产能；AAOI、Coherent涨近3%，Ciena涨超2%。台积电盘前涨近2%，3月销售额同比增长45.2%。", "ctime": 1775808811, "time_str": "16:13:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260410/c675900473.shtml"}, {"id": "4211273", "title": "证监会：推出更多创业板相关ETF和期权 适时推出创业板股指期货", "content": "中国证监会新闻发言人就《关于深化创业板改革 更好服务新质生产力发展的意见》答记者问。问：这次在进一步深化投资端改革方面有哪些政策举措，主要考虑是什么？ 答：加快推进投资端改革，是健全投资和融资相协调的资本市场功能、支持服务实体经济的重要一环。这次改革主要推出了以下举措。一是优化交易制度。引入做市商制度，促进创业板参与主体和交易策略多元化，减少价格波动，增强市场韧性。将协议大宗交易调整为实时成交确认，提高投资者证券和资金使用效率，增强成交确定性和中长期资金参与意愿。引入创业板相关ETF盘后固定价格交易机制，更好满足投资者多元化的交易需求，有利于降低大额交易对二级市场的冲击。二是丰富产品服务体系。优化创业板相关指数编制，推出更多创业板相关ETF和期权，适时推出创业板股指期货，支持基金投顾配置创业板ETF，将创业板ETF纳入基金通平台转让，更好满足不同投资者资产配置和风险管理需求，提升投资便利度和吸引力。", "ctime": 1775808634, "time_str": "16:10:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260410/c675900356.shtml"}, {"id": "4211271", "title": "港股收评：恒生指数涨0.55%，恒生科技指数涨0.8%", "content": "港股收盘，恒生指数涨0.55%，恒生科技指数涨0.8%。恒指港股通ETF银华（159318）涨0.3%，港股通科技ETF鹏华（159751）涨0.43%。板块方面，资本市场、林业与纸制品板块涨幅靠前；水务、石油与天然气板块跌幅靠前。个股方面，滴普科技涨48.77%，国泰君安国际涨27.69%，傅里叶涨15.59%，迅销涨12.13%，兆易创新涨12.06%；宝济药业-B跌13.43%，果下科技跌11.08%，哈尔滨电气跌8.17%，长飞光纤光缆跌7.49%，希迪智驾跌7.08%。", "ctime": 1775808619, "time_str": "16:10:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260410/c675900348.shtml"}, {"id": "4211269", "title": "甘肃能源：拟投资建设甘肃庆阳东数西算产业园区绿电聚合试点项目二期工程100万千瓦新能源项目", "content": "甘肃能源公告，2026年4月10日，公司第九届董事会第六次会议审议通过了《关于投资建设甘肃庆阳东数西算产业园区绿电聚合试点项目二期工程100万千瓦新能源项目的议案》，拟由庆阳新能源公司投资建设甘肃庆阳东数西算产业园区绿电聚合试点项目二期工程100万千瓦新能源项目，该项目装机规模100万千瓦（其中风电项目75万千瓦，光伏项目25万千瓦），动态总投资为43.77亿元，资金来源中资本金占总投资的20%，其余为银行贷款等。", "ctime": 1775808599, "time_str": "16:09:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260410/c675900295.shtml"}, {"id": "4211265", "title": "仙坛股份：2026年3月实现鸡肉产品销售收入4.59亿元，销售数量5.36万吨", "content": "仙坛股份公告，公司2026年3月实现鸡肉产品销售收入4.59亿元，销售数量5.36万吨，同比变动幅度分别为1.16%、-2.87%，环比变动幅度分别为87.42%、120.91%。", "ctime": 1775808574, "time_str": "16:09:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260410/c675900290.shtml"}, {"id": "4211259", "title": "日本多个在野党呼吁强化武器出口审查", "content": "据日本方面9日消息，针对日本政府拟放宽武器出口限制的动向，“中道改革联合”、立宪民主党、公明党三个日本在野党计划近期向政府提交建议草案，呼吁政府重视宪法所规定的和平主义原则，建立更严格的审查机制。根据获悉的建议草案，三党指出，若仓促调整武器出口规则，可能导致日本国际信誉受损，对和平外交产生不利影响，有必要构建严格的制度框架。草案强调，出口规则调整不应仅由政府和执政党决定，而应通过国会讨论等，履行必要程序，争取公众理解。（央视新闻）", "ctime": 1775808481, "time_str": "16:08:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260410/c675899957.shtml"}, {"id": "4211253", "title": "证监会：试点地方政府推送拟发行上市企业信息，是这次创业板改革的一项重要探索", "content": "中国证监会新闻发言人就《关于深化创业板改革 更好服务新质生产力发展的意见》答记者问。证监会表示，试点地方政府推送拟发行上市企业信息，是这次创业板改革的一项重要探索，对于推动有效市场和有为政府更好结合，从源头上提高上市公司质量，具有重大意义。科技创新企业特别是未盈利企业，普遍具有研发投入高、经营业绩不确定性大、盈利周期长等特点，如何识别出创新能力突出、成长性强的优质创新企业，一直是监管部门审核注册工作的重点和难点。地方政府对辖区企业的经营、合规、口碑声誉等方面情况较为了解，由地方政府推送企业信息作为参考，有利于审核部门更加及时全面掌握拟上市企业情况，进一步提高审核注册质效；也有利于将有限的上市资源更加精准、高效地配置到优质创新企业，更好发挥资本市场服务新质生产力发展的功能。", "ctime": 1775808383, "time_str": "16:06:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260410/c675899716.shtml"}, {"id": "4211249", "title": "证监会：推动再融资储架发行制度在创业板落地实施，允许“一次注册、多次发行”", "content": "中国证监会新闻发言人就《关于深化创业板改革 更好服务新质生产力发展的意见》答记者问。证监会表示，再融资、并购重组、股权激励是资本市场支持上市公司高质量发展的重要工具。本次改革围绕这几个方面，优化了相关制度安排。再融资方面，适应成长型创新创业企业研发持续时间长、对募集资金灵活性时效性要求较高等需求，推动再融资储架发行制度在创业板落地实施，允许“一次注册、多次发行”。同时，完善简易程序再融资制度，简化公司决策程序，提升再融资效率。并购重组方面，充分发挥并购重组在促进产业整合和转型升级方面的积极作用，持续推动“并购六条”在创业板落实落地。支持创业板上市公司立足主业，吸收合并境内上市未满三年的公司，提升产业链整合质效。股权激励方面，围绕增强创业板上市公司对优质创新人才的吸引力凝聚力、激发人才创新创造活力，支持规范运作、创新能力突出的创业板上市公司实施股权激励时，灵活设置考核指标。", "ctime": 1775808340, "time_str": "16:05:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260410/c675899650.shtml"}, {"id": "4211241", "title": "陕建股份：3月公司下属子公司中标多个项目", "content": "陕建股份公告，2026年3月，公司下属子公司中标5亿元以上施工项目。其中，G3033奎屯-独山子-库车高速公路项目第二批土建KDK-TJSG-5标段中标金额49.14亿元，公司下属子公司份额约36.85亿元；景泰AI科技中心建设工程EPC总承包中标金额10.17亿元，公司下属子公司份额约10.12亿元；富硒食药用菌智能生产全产业链项目（一期）EPC总承包中标金额5.1亿元，公司下属子公司份额约5.02亿元。", "ctime": 1775808281, "time_str": "16:04:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260410/c675899389.shtml"}, {"id": "4211237", "title": "证监会：积极发挥地方政府作用，助力提高审核注册效率", "content": "中国证监会发布《关于深化创业板改革 更好服务新质生产力发展的意见》，其中指出，积极发挥地方政府作用，助力提高审核注册效率。充分发挥地方政府了解辖内企业实际情况的优势，试点开展由地级及以上城市人民政府、省级人民政府(以下统称地方政府)向中国证监会和深圳证券交易所推送拟在创业板发行上市企业信息，试点推送范围为已申请发行上市辅导备案、拟按照创业板第三套或第四套上市标准申报的企业。中国证监会和深圳证券交易所将地方政府推送的企业信息作为审核注册的参考，依照企业发行上市规定条件和程序严格履行审核注册职责。地方政府推送信息不作为企业在创业板发行上市的必备程序。", "ctime": 1775808265, "time_str": "16:04:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260410/c675899353.shtml"}, {"id": "4211229", "title": "中国证监会：支持创业板上市公司吸收合并境内上市未满三年的公司", "content": "中国证监会发布《关于深化创业板改革 更好服务新质生产力发展的意见》，其中指出，完善融资并购制度，提升股债融资灵活性便利性。引导上市公司合理融资、按需融资，推出再融资储架发行制度，允许上市公司临时股东会授权董事会实施简易程序再融资，提高简易程序额度上限。支持创业板上市公司吸收合并境内上市未满三年的公司，同时继续履行限售期相关监管要求。支持规范运作、创新能力突出的创业板上市公司实施股权激励时灵活设置考核指标。支持创业板上市公司发行科技创新债券、绿色债券、知识产权证券化等产品，支持优质公司适用公司债券简明信息披露安排。", "ctime": 1775808193, "time_str": "16:03:13", "stock_code": "", "stock_name": "", "s // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;

  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
