const NEWS     = [{"id": "5698817", "title": "美国总统特朗普抵达深圳", "content": "11月18日下午，美国总统特朗普乘专机抵达深圳，出席亚太经合组织第三十三次领导人非正式会议。（央视新闻）", "ctime": 1794991288, "time_str": "16:41:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261118/c681957811.shtml"}, {"id": "5698815", "title": "迅策：推动AI应用落地与Token出海", "content": "2026年亚太经合组织（APEC）工商领导人峰会上，迅策作为总部位于深圳的人工智能企业代表出席，围绕AI应用落地、数据安全、数据跨境流动等议题展开交流。人工智能是本次会议上的重要议题之一。迅策董秘陈婉婞在接受记者采访时表示，AI应用要真正落地，前提是高质量、合规、可调用的数据供给。迅策通过“算力+数据+Token+模型+应用”全链路产品与服务，为企业级客户提供AI一体化部署，形成从数据到应用的完整闭环。针对人工智能在安全和数据隐私方面的话题，陈婉婞指出，AI数据主权与合规安全是迅策长期投入的底层能力，并以“数据主权+安全流通”给出企业级解法，实现“数据留在本地、价值可以流动”，并且将网络安全、数据防泄露、模型访问控制和全流程审计嵌入专用Token交换与匹配过程，降低企业跨主体流通中的安全风险，使“可交换”建立在“可审计、可管控、可合规”的基础之上。陈婉婞表示，迅策在夯实中国市场的同时，正稳步推进Token出海，积极拓展海外业务。今年以来，公司已与欧洲数字化服务商达成合作，共同开发面向欧洲市场的场景Token工厂，并探索符合欧盟数据主权要求的AI转型方案。（证券时报）", "ctime": 1794991261, "time_str": "16:41:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261118/c681957751.shtml"}, {"id": "5698789", "title": "腾讯控股第三季度资本支出814.3亿元，录得负自由现金流人民币691亿元", "content": "腾讯控股第三季度资本支出814.3亿元，市场预估554亿元。集团录得负自由现金流人民币691亿元，乃由于经营活动所产生的现金净额人民币26亿元，被资本开支付款人民币651亿元、媒体内容付款人民币46亿元及租赁负债付款人民币20亿元超额抵销。经营现金流包括大额算力采购预付款，用于支持Hy系列模型升级、WorkBuddy推理需求，以及我们各项产品与服务的AI能力建设，同时满足外部客户对我们云服务的需求。若剔除算力采购的预付款，我们的自由现金流将转正至人民币169亿元。", "ctime": 1794991045, "time_str": "16:37:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261118/c681957283.shtml"}, {"id": "5698775", "title": "澳大利亚总理：中国发展成就有利整个地区", "content": "澳大利亚总理阿尔巴尼斯18日在2026年亚太经合组织（APEC）工商领导人峰会上说，中国成功实现经济增长，帮助民众摆脱贫困，提供发展机遇，提升生产力，不仅惠及中国自身，也有利整个地区。这份成就值得庆贺，不应被视作理所当然。2026年APEC工商领导人峰会17日至18日在深圳前海国际会议中心举行。（新华社）", "ctime": 1794990947, "time_str": "16:35:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261118/c681957110.shtml"}, {"id": "5698759", "title": "我武生物：终止皮炎诊断贴剂研发项目，减少2026年度利润总额791.97万元", "content": "我武生物公告，公司研发的皮炎诊断贴剂01贴完成II期临床试验、皮炎诊断贴剂02贴完成I期临床试验并取得临床试验总结报告。综合临床检测需求、价格标准、项目协同性及后续临床推进风险等因素，公司决定终止该研发项目，不再开展后续临床试验。公司对项目开发支出全额计提减值准备791.97万元，预计减少2026年度利润总额791.97万元、归属于上市公司股东的净利润554.55万元；上述数据未经审计，最终影响以2026年年度报告为准。", "ctime": 1794990852, "time_str": "16:34:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261118/c681956918.shtml"}, {"id": "5698723", "title": "腾讯控股：2026年第三季度收入同比增长8%", "content": "腾讯控股公告，截至2026年9月30日止三个月，公司收入2073.36亿元，同比增长8%；毛利1159.11亿元，同比增长7%；经营盈利591.47亿元，同比下降7%；期内盈利651.39亿元，同比增长0.3%；本公司权益持有人应占盈利636.12亿元，同比增长0.8%；每股基本盈利7.06元，同比增长2%。截至2026年9月30日止九个月，收入6085.79亿元，同比增长9%；本公司权益持有人应占盈利1777.27亿元，同比增长7%。", "ctime": 1794990738, "time_str": "16:32:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261118/c681956697.shtml"}, {"id": "5698721", "title": "及时澄清股市造谣“小作文” 合力守护市场清朗环境", "content": "资本市场苦虚假“小作文”久矣。一张来源不明的截图、几句捕风捉影的对话、一条真假难辨的链接，常常能在股市兴风作浪、左右涨跌。“监管要求基金公司上报全部产品AI敞口”这一资本市场“小作文”的特殊之处，是借监管之名造谣，无来源、无凭据，用“敞口”“上报”等基金行业专业用语，和市场热点AI沾边，影响市场波动。证监会及时回应造谣的“小作文”，在午间发声，赢在速度，在谣言传导链条上做了一次切断，澄清了“监管要收紧AI持仓”的传闻，也给基金管理人预期，不必因一条无从核实的消息改变既定投资决策。业内人士指出，证券监管部门坚持对股市虚假“小作文”露头就打，但要根治“小作文”乱象，还需深挖利益链、产业链，严惩造谣者、传谣者。只有对不法分子形成有效震慑，才能遏制虚假信息的恶意传播和炒作。（证券时报）", "ctime": 1794990731, "time_str": "16:32:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261118/c681956684.shtml"}, {"id": "5698643", "title": "国家主席习近平会见俄罗斯总统普京", "content": "11月18日，国家主席习近平在深圳会见来华出席亚太经合组织领导人非正式会议的俄罗斯总统普京。习近平指出，今年是中俄战略协作伙伴关系建立30周年，也是《中俄睦邻友好合作条约》签署25周年。中俄关系既“风雨不动安如山”，又“风物长宜放眼量”，为变乱交织的世界提供了更多稳定性和确定性，树立了平等相待、相互尊重、重信守义、合作共赢的新型大国关系典范。面向未来，双方要常葆开拓进取的活力，不断发掘新时代中俄关系的潜力和内涵；坚持脚踏实地，深化两国全方位合作；坚定扛起大国应有的责任和担当，引领和推动世界多极化和国际关系民主化。习近平强调，双方要发挥两国政府、立法机构、军队、党际交往机制作用，确保两国元首达成的共识得到有效落实。中俄务实合作兼具相互信任的政治优势、发展振兴的共同目标、互利共赢的底层逻辑，应做优做强现有合作，巩固存量，拓展增量。提供更加稳定、可预期的投资和营商环境，保护好两国企业合法权益。中俄的发展同亚太的发展紧密相连，亚太经合组织是加强合作的重要平台。中方愿同包括俄方在内的亚太大家庭一道，共谋亚太繁荣发展大计，携手构建亚太共同体。 （新华社）", "ctime": 1794990440, "time_str": "16:27:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261118/c681956001.shtml"}, {"id": "5698631", "title": "上海医药：盐酸异丙肾上腺素注射液通过仿制药一致性评价", "content": "上海医药公告，公司下属上海禾丰制药有限公司收到国家药品监督管理局颁发的《药品补充申请批准通知书》，盐酸异丙肾上腺素注射液通过仿制药质量和疗效一致性评价，同意批准增加1ml:0.2mg、5ml:1mg规格的补充申请并核发药品批准文号。截至公告日，公司针对该药品的一致性评价已投入研发费用约为444万元。IQVIA数据库显示，2025年中国大陆医院采购该药品金额为7343万元。", "ctime": 1794990204, "time_str": "16:23:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261118/c681955387.shtml"}, {"id": "5698629", "title": "上海医药：艾曲波帕片获美国FDA批准文号", "content": "上海医药公告，公司下属常州制药厂有限公司收到美国FDA通知，其艾曲波帕片（规格12.5mg、25mg、50mg、75mg）的简略新药申请（ANDA）已获得批准上市。该药品主要用于慢性免疫性（特发性）血小板减少症和重型再生障碍性贫血，2025年9月提出ANDA申请。截至公告日，公司针对该药品已投入研发费用约987.77万元。2025年该药品在美国的销售额约2.17亿美元。", "ctime": 1794990195, "time_str": "16:23:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261118/c681955360.shtml"}, {"id": "5698627", "title": "第三届澜沧江—湄公河创新走廊建设研讨会助力区域协同发展", "content": "11月18日，第三届澜沧江—湄公河创新走廊建设研讨会在昆明启幕。中、柬、老、缅、泰、越六国科创主管部门、科研院所及企业代表齐聚昆明，围绕“智联澜湄共兴未来”主题，深化跨境科创协同，为澜湄合作第二个十年注入创新动能。（央视新闻）", "ctime": 1794990191, "time_str": "16:23:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261118/c681955353.shtml"}, {"id": "5698623", "title": "深南电路今日涨10.00%，5家机构专用席位净买入2.00亿元", "content": "深南电路今日涨10.00%，成交额26.67亿元，换手率2.07%，盘后龙虎榜数据显示，深股通专用席位买入3.83亿元并卖出2.77亿元，5家机构专用席位净买入2.00亿元，有1家机构专用席位净卖出654.60万元。", "ctime": 1794990153, "time_str": "16:22:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261118/c681955266.shtml"}, {"id": "5698601", "title": "美国总统特朗普将抵达深圳", "content": "11月18日下午，美国总统特朗普乘专机将抵达深圳，出席亚太经合组织第三十三次领导人非正式会议。（央视新闻）", "ctime": 1794990022, "time_str": "16:20:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261118/c681954938.shtml"}, {"id": "5698579", "title": "伦锡日内暴跌6%失守4.3万，back结构瓦解", "content": "受12月加息定价升至95%、美元指数创2025年4月以来新高及英伟达财报难挽AI叙事影响，伦锡3M今日自44885美元/吨开盘、短暂上探45150后单边下杀，尾盘报42175美元/吨、日内跌6%，较昨收45060美元/吨下挫2885美元，连失4.5万、4.3万两道关口。\n今日back结构快速瓦解，LME0-3锡升水由11/16的687.01骤降至11/17的244.76美元/吨，单日缩水逾440美元，持仓21080手减369手，挤结构叙事终结。\n库存拐点确认，LME锡库存增25吨至3600吨，结束连续去库，现货紧张支撑松动。\n内外盘同向重挫，沪锡日盘跌4.14%至334600元/吨，外盘领跌、内外价差收敛。总之，紧缩预期与AI叙事松动共振，低库存与极端back的双支撑同步瓦解，外盘转入补跌阶段。关注4.2万美元支撑及明晨美联储会议纪要。（SMM）", "ctime": 1794989944, "time_str": "16:19:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261118/c681954757.shtml"}, {"id": "5698561", "title": "泰尔茂比司特在华首款本土化设备获批", "content": "记者11月18日获悉，泰尔茂比司特在中国本土生产的Trima Accel™血液成分分离机已获国家药监局颁发的医疗器械注册证。这是该公司2024年宣布本土化计划以来，首个在华实现本土化生产的医疗设备。（界面新闻）", "ctime": 1794989771, "time_str": "16:16:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261118/c681954352.shtml"}, {"id": "5698557", "title": "海亮股份：董事长冯橹铭提议回购公司股份，资金总额不低于3亿元且不超过5亿元", "content": "海亮股份公告，公司于2026年11月18日收到董事长冯橹铭提交的《关于提议浙江海亮股份有限公司回购公司股份的函》。冯橹铭提议公司使用自有资金或自筹资金以集中竞价交易方式回购公司部分人民币普通股（A股）股票，回购股份可用于员工持股计划或股权激励、维护公司价值及股东权益。本次回购股份的资金总额不低于3亿元（含）且不超过5亿元（含），回购价格上限不高于董事会审议通过回购股份方案决议前三十个交易日公司股票交易均价的150%。", "ctime": 1794989756, "time_str": "16:15:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261118/c681954323.shtml"}, {"id": "5698535", "title": "现货黄金失守3760美元/盎司", "content": "现货黄金失守3760美元/盎司，日内跌2.28%。同花顺黄金现货价格报807.18元/克，现跌2.3%。", "ctime": 1794989628, "time_str": "16:13:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261118/c681954050.shtml"}, {"id": "5698515", "title": "LME锡主力合约大跌7%", "content": "LME锡主力合约大跌7%，现报41850.0美元/吨。", "ctime": 1794989572, "time_str": "16:12:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261118/c681953925.shtml"}, {"id": "5698479", "title": "阿联酋方面称一船只在霍尔木兹海峡遇袭", "content": "阿联酋阿布扎比国家石油公司旗下的物流与服务公司18日发表声明说，该公司一艘船17日晚通过霍尔木兹海峡时遭到袭击，造成11名船员受伤、1人失踪。声明说，伤者正在接受必要的医疗救治。有关方面正协调开展搜救行动，寻找失踪船员。船上其他船员均已安全撤离。阿布扎比国家石油公司是阿联酋国有石油和天然气企业。今年以来，阿联酋方面多次声称该国船只在通过霍尔木兹海峡时遭袭。（新华社）", "ctime": 1794989430, "time_str": "16:10:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261118/c681953554.shtml"}, {"id": "5698477", "title": "港股收评：恒生指数跌0.91%，恒生科技指数跌0.58%", "content": "港股收盘，恒生指数跌0.91%，恒生科技指数跌0.58%。恒指港股通ETF银华（159318）跌1.07%，港股通科技ETF鹏华（159751）跌1.54%。板块方面，休闲设施、电子设备板块涨幅靠前；药店、油品石化贸易板块跌幅靠前。个股方面，商米科技-W涨14.02%，怡俊集团控股涨12.85%，景旺电子涨11.65%，智谱涨10.09%，曦智科技-P涨8.61%；京东健康-R跌15.3%，京东健康跌15.09%，领益智造跌10.11%，登临科技-P跌8.01%，昭衍新药跌8.0%。", "ctime": 1794989429, "time_str": "16:10:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261118/c681953547.shtml"}, {"id": "5698469", "title": "韩国娱乐公司计划推出机器人女团", "content": "韩国娱乐科技企业Galaxy Corporation计划在明年1月面向全球推出机器人女团，之后再分别推出虚拟AI女团和真人女团。不仅如此，今年12月，该公司还将在中国澳门举办一场小型机器人K-pop演唱会，后续还计划把相关演出带到迪拜、东京等地。据Galaxy创始人兼首席执行官崔龙湖介绍，其合作方主要包括宇树科技和巨星传奇等，目前正在探索中国公司出硬件，韩国方面出内容的发展模式。（科创板日报）", "ctime": 1794989406, "time_str": "16:10:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261118/c681953388.shtml"}, {"id": "5698427", "title": "大兴机场2026年旅客吞吐量突破5000万人次 较去年提前19天", "content": "11月17日，大兴机场2026年旅客吞吐量突破5000万人次大关，较去年提前19天。今年单日旅客量高峰为8月8日19.76万人次，创开航以来新高。（央视新闻）", "ctime": 1794989218, "time_str": "16:06:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261118/c681952368.shtml"}, {"id": "5698407", "title": "南方电网与宁德时代签署战略合作框架协议", "content": "据中国南方电网有限责任公司官微消息，11月16日，南方电网公司与宁德时代在广州签署战略合作框架协议。公司董事长、党组书记钱朝阳与宁德时代董事长兼CEO曾毓群一行举行工作会谈，并共同见证签约。钱朝阳表示，希望双方继续深化合作，加强优势互补，共同做强新型储能场景优势，共同做大电力鸿蒙开放生态，共同培育电碳协同产业增量，共同拓展国际业务发展空间。曾毓群表示，宁德时代与南方电网公司具有良好的合作基础，希望双方充分发挥各自优势，坚持面向市场需求，围绕科技创新、平台共建和海外业务拓展等领域加强合作，共同构建储能产业良好发展生态。(人民财讯)", "ctime": 1794989148, "time_str": "16:05:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261118/c681952132.shtml"}, {"id": "5698329", "title": "欧洲主要股指开盘涨跌互现", "content": "欧洲主要股指开盘涨跌互现，欧洲斯托克50指数涨0.35%，英国富时100指数跌0.22%，法国CAC40指数持平，德国DAX指数涨0.18%。", "ctime": 1794988914, "time_str": "16:01:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261118/c681950956.shtml"}, {"id": "5698327", "title": "博威合金：液冷板材料已供货Coolermaster", "content": "博威合金11月18日在互动平台表示，公司液冷板材料已供货Coolermaster；材料已通过奇宏产线验证，受产能排期影响暂未供货；公司是越南区域液冷板材料核心供应商。液冷板材料为无氧铜（氧含量≤5ppm），不属于特殊合金；与维兰德、JX金属无正面竞争。（人民财讯）", "ctime": 1794988903, "time_str": "16:01:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261118/c681950889.shtml"}, {"id": "5698303", "title": "大疆正式调价，部分云台相机售价上涨", "content": "大疆产品调价如期而至。11月18日，大疆商城显示，大疆云台相机Osmo Pocket 4、Osmo Pocket 4P及拇指相机Osmo Nano三款产品涨价。具体来看，Osmo Pocket 4于今年4月发布，标准套装原价为2999元，全能套装原价为3799元。当前，上述版本价格分别为3199元和4299元，分别涨价200元和500元。双摄云台相机Osmo Pocket 4P标准套装由3799元涨至4099元，上涨300元；Vlog套装由4299元调整至4859元，上涨560元。此外，拇指相机Osmo Nano标准套装，64GB版本售价维持1998元不变，128GB版本售价由2298元涨至2498元，上涨200元。11月13日，大疆发布公告称，受全球半导体、存储等关键零部件成本持续大幅上涨影响，公司将于11月18日起，对部分产品的建议零售价进行调整。（新京报）", "ctime": 1794988817, "time_str": "16:00:17", "stoc // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
