html"}, {"id": "5700481", "title": "德必集团：回购股份比例达1%，已回购164.4万股支付2176.28万元", "content": "德必集团公告，公司于2026年11月3日审议通过回购方案，拟使用不低于人民币5000万元（含）、不超过人民币1亿元（含）的自有及/或自筹资金以集中竞价交易方式回购部分社会公众股份，用于维护公司价值及股东权益，回购价格不超过人民币20元/股（含），回购期限不超过3个月。截至2026年11月17日，公司通过集中竞价交易方式回购公司股份164.4万股，占公司总股本的1.09%，最高成交价13.6元/股，最低成交价12.8元/股，成交总金额2176.28万元（不含交易费用）。", "ctime": 1794999700, "time_str": "19:01:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261118/c681966014.shtml"}, {"id": "5700477", "title": "泰嘉股份：拟以1亿元-2亿元回购公司股份", "content": "泰嘉股份公告，拟以不低于1亿元且不超过2亿元回购公司股份，回购价格不超过21元/股。回购股份的用途为股权激励计划或/及员工持股计划；公司如在股份回购完成之后36个月内未能实施上述用途，或所回购的股份未全部用于上述用途，公司将依法注销本次回购未使用的部分股份。按回购金额上限2亿元测算，预计回购股份数量952.38万股，约占当前公司总股本的3.72%；按回购金额下限1亿元测算，预计回购股份数量476.19万股，约占当前公司总股本的1.86%。回购期限为自董事会审议通过本次回购方案之日起12个月内，资金来源为自有资金或/及自筹资金。", "ctime": 1794999692, "time_str": "19:01:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261118/c681966009.shtml"}, {"id": "5700451", "title": "兴发集团：拟出资20.4亿元设控股子公司，持股51%", "content": "兴发集团公告，公司拟与铜陵万桥矿业有限公司共同出资设立远安兴华汇矿业有限公司（暂定名），注册资本40亿元，其中公司以货币认缴出资20.4亿元，出资占比51%；铜陵万桥以货币认缴出资19.6亿元，出资占比49%。标的公司主要开展磷矿矿权获取、开发及下游磷化工产品布局。本次投资已经公司第十一届董事会第二十三次会议审议通过，无需提交股东会审议，并已通过国家市场监督管理总局经营者集中反垄断审查。公司认缴出资金额占最近一期经审计归属于上市公司股东净资产的9.27%，出资期限至2031年10月31日前。", "ctime": 1794999659, "time_str": "19:00:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261118/c681965998.shtml"}, {"id": "5700349", "title": "胜宏科技：取得股票回购专项贷款承诺函，额度不超过2.7亿元", "content": "胜宏科技公告，公司于2026年11月16日审议通过回购方案，拟使用不低于人民币1.5亿元（含）且不超过3亿元（含）的自有资金或自筹资金以集中竞价方式回购公司股份，回购价格不超过240.49元/股，回购期限不超过12个月。公司于2026年11月17日取得中国工商银行股份有限公司惠州分行出具的《贷款承诺函》，承诺为公司本次回购提供专项贷款额度不超过人民币2.7亿元，且不超过回购金额上限的90%，贷款期限不超过三年，专项用于回购公司股票。", "ctime": 1794999469, "time_str": "18:57:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261118/c681965666.shtml"}, {"id": "5700343", "title": "江苏：推进5G-A网络部署、万兆光网建设和工业5G专网建设 前瞻布局第六代移动通信技术", "content": "江苏省人民政府办公厅发布《促进平台经济创新和规范健康发展若干措施》。其中提到，夯实数字基础设施。推进5G-A网络部署、万兆光网建设和工业5G专网建设，前瞻布局第六代移动通信技术（6G）。推进IPv6规模部署和应用。加快建设覆盖全省、高效畅通的城域“毫秒用算”网络体系。鼓励各设区市积极申报国家新型互联网交换中心。引导基础电信企业加大边界网关协议（BGP）带宽、静态带宽、传输线路、国际专线等资源投入。", "ctime": 1794999386, "time_str": "18:56:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261118/c681965645.shtml"}, {"id": "5700303", "title": "苏林：中国发展成就证明改革开放正确性", "content": "越共中央总书记、国家主席苏林18日在2026年亚太经合组织（APEC）工商领导人峰会上说，过去几十年来，不论是深圳自身、还是整个中国所取得的跨越式的发展成就，清晰地证明了坚持改革开放和创新发展的正确性，同时表明各经济体携手合作对共促繁荣的重要意义。2026年APEC工商领导人峰会17日至18日在深圳前海国际会议中心举行。(新华社)", "ctime": 1794998763, "time_str": "18:46:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261118/c681965450.shtml"}, {"id": "5700279", "title": "麦格米特：控股股东、实控人及部分董监高拟增持公司股份", "content": "麦格米特公告，公司控股股东、实际控制人、董事长兼总经理童永胜，董事兼副总经理张志，首席财务官王涛拟自2026年11月19日（含本日）起6个月内，以自有资金或自筹资金通过集中竞价、大宗交易等方式增持公司股份。其中，童永胜计划增持金额为3000万元-6000万元；张志计划增持金额为1000万元-2000万元；王涛计划增持金额为1000万元-2000万元。本次增持不设固定价格区间，将根据公司股票价格波动情况及二级市场整体趋势择机实施。", "ctime": 1794998667, "time_str": "18:44:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261118/c681965416.shtml"}, {"id": "5700277", "title": "麦格米特：拟以2亿元-4亿元回购公司股份", "content": "麦格米特公告，拟以集中竞价交易方式回购公司已发行的人民币普通股（A股）股份，回购资金总额不低于人民币2亿元，不超过人民币4亿元，回购价格不超过人民币128元/股。回购股份的用途为股权激励或员工持股计划。按回购资金总额及回购价格上限测算，回购数量约为156.25万股-312.5万股，约占公司截至2026年11月17日总股本的0.27%-0.53%。回购资金来源为自有资金及股票回购专项贷款资金，公司已取得中国银行前海蛇口分行出具的《贷款承诺函》，额度最高不超过3.6亿元人民币且不超过回购总金额上限的90%。回购实施期限为自董事会审议通过方案之日起12个月内。", "ctime": 1794998659, "time_str": "18:44:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261118/c681965414.shtml"}, {"id": "5700269", "title": "江海股份：拟以2000万元-4000万元回购公司股份", "content": "江海股份公告，拟以不低于2000万元且不超过4000万元回购公司股份，回购价格不超过40元/股。回购股份的用途为股权激励或员工持股计划；若公司未能在股份回购实施结果暨股份变动公告日后3年内转让完毕，尚未转让的已回购股份将予以注销。按回购金额上限4000万元测算，预计回购股份数量100万股，约占当前公司总股本的0.118%；按回购金额下限2000万元测算，预计回购股份数量50万股，约占当前公司总股本的0.059%。回购资金来源为公司自有资金，回购期限为自董事会审议通过本次回购股份方案之日起12个月内。", "ctime": 1794998535, "time_str": "18:42:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261118/c681965378.shtml"}, {"id": "5700255", "title": "天孚通信：累计回购公司股份88万股", "content": "天孚通信公告，截至2026年11月18日，公司通过股份回购专用证券账户以集中竞价交易方式累计回购公司股份88万股，占公司目前总股本的0.0807%，最高成交价为150元/股，最低成交价为103.17元/股，成交总金额为1.08亿元（不含交易费用）。", "ctime": 1794998373, "time_str": "18:39:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261118/c681965331.shtml"}, {"id": "5700229", "title": "2026年APEC工商领导人峰会发布深圳倡议", "content": "《2026年亚太经合组织工商领导人峰会深圳倡议》18日对外发布，呼吁深化开放型区域经济、以技术创新驱动包容增长、畅通区域一体化动脉、携手实现共同繁荣。这是APEC工商领导人峰会创办30年来首次以倡议形式发布成果文件。倡议指出，在开放包容、创新增长、互联互通、合作共赢四大优先领域引领下，亚太工商界愿与所有经济体一道，全面落实《2040年亚太经合组织布特拉加亚愿景》，共建开放、活力、强韧、和平的亚太共同体，并将今年APEC“建设亚太共同体，促进共同繁荣”的主题转化为实际行动，使亚太继续成为世界最具活力的增长引擎和共同繁荣的共同体。(新华社)", "ctime": 1794998275, "time_str": "18:37:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261118/c681965301.shtml"}, {"id": "5700225", "title": "高鑫零售：2026年中期收入274.87亿元同比下降9.9%", "content": "高鑫零售公告，公司截至2026年9月30日止六个月收入274.87亿元，同比下降9.9%；毛利69.12亿元，同比下降10.5%；经营亏损2.77亿元，上年同期经营溢利2.71亿元；期内亏损5.17亿元，上年同期亏损1.27亿元；本公司权益股东应占亏损5.14亿元，上年同期亏损1.23亿元；每股基本及摊薄亏损0.05元，上年同期亏损0.01元。", "ctime": 1794998218, "time_str": "18:36:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261118/c681965285.shtml"}, {"id": "5700211", "title": "广电运通：中标农业银行超级柜台项目预计金额约3亿元", "content": "广电运通公告，公司近日收到中招国际招标有限公司出具的《中标通知书》，确定公司为中国农业银行股份有限公司超级柜台入围项目（包件：非现金超柜、打印边柜）及（包件：现金超柜）的中标人。按照项目招标文件要求，本中标项目采购有效期为3年，结合中标单价与预估采购量测算，两个包件预计合计中标金额约3亿元（含税）。公司尚未与采购单位签订正式项目合同。", "ctime": 1794998038, "time_str": "18:33:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261118/c681965217.shtml"}, {"id": "5700205", "title": "永兴材料：实控人、董事长提议回购公司股份，资金总额1亿元-2亿元", "content": "永兴材料公告，公司董事会于2026年11月18日收到实际控制人、董事长高兴江先生出具的提议回购公司股份的函。高兴江提议公司使用自有资金或自筹资金以集中竞价交易方式回购公司已发行的部分人民币普通股（A股）股票，回购股份的资金总额不低于人民币1亿元（含）、不超过人民币2亿元（含），回购股份的用途为实施股权激励及/或员工持股计划，回购价格上限不高于公司董事会审议通过回购股份方案决议前30个交易日公司股票交易均价的150%。高兴江承诺将积极推动公司尽快召开董事会或股东会审议回购股份事项，并对回购股份议案投赞成票。", "ctime": 1794998021, "time_str": "18:33:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261118/c681965210.shtml"}, {"id": "5700187", "title": "江苏国泰：首次回购公司股份20万股，支付153.52万元", "content": "江苏国泰公告，公司此前审议通过回购公司股份方案，拟使用自有资金或自筹资金以集中竞价方式回购部分公司A股股份，用于可转债转股，回购价格不超过人民币11元/股（含），回购资金总额不低于人民币2500万元且不超过人民币3500万元。2026年11月18日，公司首次通过股份回购专用证券账户以集中竞价交易方式回购公司股份20万股，占公司当前总股本的0.01%，最高成交价为7.7元/股，最低成交价为7.67元/股，成交总金额为153.52万元（不含交易费用）。", "ctime": 1794997952, "time_str": "18:32:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261118/c681965185.shtml"}, {"id": "5700139", "title": "利欧股份：控股股东、实际控制人王相荣提议回购公司股份，资金总额不低于5000万元且不超过1亿元", "content": "利欧股份公告，公司于2026年11月18日收到控股股东、实际控制人、董事长兼总经理王相荣出具的提议回购公司股份的函。王相荣基于对公司未来发展的信心和对公司内在价值的认可，提议公司使用自有资金或自筹资金以集中竞价方式回购公司部分股份，回购的股份用于注销并减少公司注册资本。提议回购资金总额不低于人民币5000万元（含）且不超过人民币1亿元（含），回购价格区间上限不高于董事会审议通过回购股份方案决议前三十个交易日公司股票交易均价的150%，实施期限自公司股东会审议通过最终回购股份方案之日起12个月内。王相荣及一致行动人王壮利承诺积极推动公司尽快召开董事会及股东会审议回购股份事项，并对回购议案投赞成票。", "ctime": 1794997836, "time_str": "18:30:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261118/c681965136.shtml"}, {"id": "5700137", "title": "ST汇洲：申请撤销股票交易其他风险警示，尚需深交所核准", "content": "ST汇洲公告，公司于2026年11月18日召开第九届董事会第五次临时会议，审议通过《关于申请撤销公司股票交易其他风险警示的议案》，已向深圳证券交易所提交撤销其他风险警示的申请。公司股票此前因2019年、2020年年报存在虚假记载，自2025年10月31日起被实施其他风险警示。公司已就行政处罚决定所涉事项对相应年度财务会计报告进行追溯重述，并收到业绩补偿款共计4143.59万元，已整改完毕；自中国证监会作出行政处罚决定书之日起已满十二个月，且不存在其他被实施风险警示的情形。上述申请最终能否获得深交所核准尚具有不确定性。", "ctime": 1794997829, "time_str": "18:30:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261118/c681965131.shtml"}, {"id": "5700121", "title": "美国民主党筹备数据中心电力改革方案 运营商10年内或需多付350亿美元", "content": "美国民主党赢得国会两院之后，正在着手准备一项新的联邦许可规则改革，其可能加快对各类能源项目的联邦环境审查，从而使数据中心运营商更容易获得电力。民主党同时希望数据中心在接入电网时支付额外的费用。这可能将颠覆美国数十年以来的电力规则。民主党参议员Sheldon Whitehouse表示，一旦该法案获得通过，数据中心在电力系统中搭便车的日子就到头了。今后，数据中心在接入电网时，必须自行承担由此产生的额外成本，不能将这些额外开支转嫁给公用事业公司，从而让其他缴费用户来买单。咨询公司Grid Strategies发布的一份报告显示，仅联邦层面的电网规则改革，就可能迫使数据中心在未来10年内额外支付350亿美元。此外，如果各州能充分利用该法案中的其他条款，总共可额外收取136亿美元。（财联社）", "ctime": 1794997801, "time_str": "18:30:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261118/c681965097.shtml"}, {"id": "5700081", "title": "新易盛：已回购421.63万股，成交总金额8亿元", "content": "新易盛公告，公司2026年10月23日公布回购方案，回购资金不低于8亿元、不超过10亿元。截至2026年11月18日，公司已通过股份回购专用证券账户以集中竞价交易方式回购公司股份421.63万股，占公司总股本的0.3023%，最高成交价为213.27元/股，最低成交价为172.05元/股，成交总金额为8亿元（不含交易费用）。公司2025年度分红方案为每10股派10元，分红金额9.96亿元。", "ctime": 1794997588, "time_str": "18:26:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261118/c681965038.shtml"}, {"id": "5700075", "title": "蓝箭航天：朱雀三号遥二运载火箭回收的一子级9台液氧甲烷发动机已全部完成地面验收和试车", "content": "在APEC财经之夜现场，蓝箭航天空间科技股份有限公司副总裁张静茹披露朱雀三号回收发动机试车新进展：朱雀三号遥二运载火箭回收的一子级9台液氧甲烷发动机，经过分解、检查、维修和重新装配，已全部完成地面验收和试车。张静茹说，火箭回收的意义在于运力价格。价格便宜一分，太空经济的边界就拓宽一步，卫星可以铺得更密，遥感数据更新得更快。当前天上已有计算卫星在轨工作，每一次扩容都要靠火箭送上去。面向亚太，卫星通信、遥感和空间基础设施合作正在打开。（央视财经）", "ctime": 1794997514, "time_str": "18:25:14", "stock_code": "", "stock_name // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
