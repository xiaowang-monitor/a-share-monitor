_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260706/c677973941.shtml"}, {"id": "4657575", "title": "SK海力士计划通过发行美国存托凭证上市筹资43万亿韩元", "content": "SK海力士计划通过发行美国存托凭证上市筹资43万亿韩元。（财联社）", "ctime": 1783323920, "time_str": "15:45:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260706/c677973821.shtml"}, {"id": "4657573", "title": "德科立：股东询价转让初步定价160.28元/股", "content": "德科立公告，根据2026年7月6日询价申购情况，初步确定的本次询价转让价格为160.28元/股。本次询价转让收到有效报价单共17份，有效认购倍数为1.73倍，初步确定受让方为11家机构投资者，拟受让股份总数为159.24万股。", "ctime": 1783323907, "time_str": "15:45:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260706/c677973818.shtml"}, {"id": "4657571", "title": "广弘控股：董事、总经理缪安民因到退休年龄辞职", "content": "广弘控股公告，公司董事、总经理缪安民因已达到法定退休年龄，提出辞职。缪安民辞职后将不再担任公司任何职务，其辞职不会影响公司正常生产经营。公司将尽快完成相关补选工作。", "ctime": 1783323851, "time_str": "15:44:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260706/c677973798.shtml"}, {"id": "4657565", "title": "南向资金净买入超190亿港元", "content": "据同花顺iFinD数据，截至目前，南向资金净买入超190亿港元，其中港股通（沪）买入超121.08亿港元，港股通（深）买入超69.74亿港元。", "ctime": 1783323785, "time_str": "15:43:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260706/c677973723.shtml"}, {"id": "4657559", "title": "宝地矿业：预计2026年上半年净利润同比增长189.00%到210.11%", "content": "宝地矿业公告，预计2026年半年度实现归属于母公司所有者的净利润为1.78亿元到1.91亿元，与上年同期相比，将增加1.16亿元到1.29亿元，同比增加189.00%到210.11%；预计2026年半年度实现归属于母公司所有者的扣除非经常性损益后的净利润为1.73亿元到1.86亿元，与上年同期相比，将增加1.19亿元到1.32亿元，同比增加220.05%到244.10%。", "ctime": 1783323622, "time_str": "15:40:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260706/c677973642.shtml"}, {"id": "4657527", "title": "纵横股份在安庆成立无人机科技新公司", "content": "企查查APP显示，近日，安庆纵横无人机科技有限公司成立，注册资本1000万元，经营范围包含：智能无人飞行器制造；智能无人飞行器销售；软件销售；软件开发；人工智能应用软件开发；人工智能理论与算法软件开发等。企查查股权穿透显示，该公司由纵横股份全资持股。（人民财讯）", "ctime": 1783323372, "time_str": "15:36:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260706/c677973333.shtml"}, {"id": "4657525", "title": "有研粉材：股东询价转让定价101.06元/股", "content": "有研粉材公告，根据2026年7月6日询价申购情况，初步确定的本次询价转让价格为101.06元/股。本次询价转让收到有效报价单共29份，涵盖基金管理公司、合格境外投资者、证券公司、私募基金管理人等专业机构投资者。参与本次询价转让报价的机构投资者合计有效认购股份数量为586万股，对应的有效认购倍数为1.13倍。本次询价转让拟转让股份已获全额认购，初步确定受让方为23名机构投资者，拟受让股份总数为517.33万股。", "ctime": 1783323354, "time_str": "15:35:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260706/c677973323.shtml"}, {"id": "4657521", "title": "申华控股：2026年上半年预亏1500万-2000万元，同比减亏66%-75%", "content": "申华控股公告，预计2026年半年度归属于上市公司股东的净利润为-2000万元至-1500万元，与上年同期亏损5931.35万元相比减亏66%-75%；扣除非经常性损益后净利润为-2800万元至-2300万元，同比减亏54%-63%。业绩减亏主要因宝马经销板块扭亏为盈及楼宇租赁业务稳定，但汽车城等存量业务成本费用仍拖累整体盈利。分季度看，2026年第二季度单季度归母净利润实现盈利。", "ctime": 1783323331, "time_str": "15:35:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260706/c677973312.shtml"}, {"id": "4657517", "title": "陕西煤业：6月自产煤销量1307万吨，同比下降9.49%", "content": "陕西煤业公告，2026年6月煤炭产量1446万吨，同比增长0.70%；自产煤销量1307万吨，同比下降9.49%。2026年1-6月，煤炭累计产量9117万吨，同比增长4.30%；自产煤累计销量8366万吨，同比增长3.45%。发电业务方面，6月总发电量33.52亿千瓦时，同比下降11.86%；总售电量31.36亿千瓦时，同比下降12.40%。1-6月累计总发电量190.82亿千瓦时，同比增长7.39%；累计总售电量179.46亿千瓦时，同比增长7.98%。", "ctime": 1783323303, "time_str": "15:35:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260706/c677973292.shtml"}, {"id": "4657507", "title": "星河动力等成立天算基石科技公司", "content": "企查查APP显示，近日，北京星河天算基石科技有限公司成立，注册资本1亿元，经营范围包含：人工智能理论与算法软件开发；人工智能应用软件开发；人工智能基础软件开发；互联网销售（除销售需要许可的商品）等。企查查股权穿透显示，该公司由北京星河动力航天科技股份有限公司等共同持股。（人民财讯）", "ctime": 1783323182, "time_str": "15:33:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260706/c677973190.shtml"}, {"id": "4657499", "title": "南向资金净买入超180亿港元", "content": "据同花顺iFinD数据，截至目前，南向资金净买入超180亿港元，其中港股通（沪）买入超116.13亿港元，港股通（深）买入超64.33亿港元。", "ctime": 1783323112, "time_str": "15:31:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260706/c677973152.shtml"}, {"id": "4657491", "title": "北京推出全国首套双语登记申请文书 外资企业登记更便利", "content": "北京市市场监督管理局推出全国首套中英文对照版登记申请文书，并同步更新全类别外商投资主体中英文双语办事指南，覆盖设立、变更、注销、备案等全流程登记业务，全面优化国际语言服务环境，持续提升外资企业登记便利度。此套双语文书的适用范围覆盖公司、合伙企业等全部外资主体类型，适配设立、变更、注销、备案等全场景登记业务。术语翻译采用国际通用商务标准译法，兼顾商事登记法律严谨性与海外阅读习惯，同时严格遵循国家语言文字法律法规，以中文作为法定填报和释义文本，英文作辅助说明。（央视新闻）", "ctime": 1783323018, "time_str": "15:30:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260706/c677973106.shtml"}, {"id": "4657483", "title": "中国在境内培训俄军士兵？外交部：纯属污蔑抹黑", "content": "7月6日，外交部发言人毛宁主持例行记者会。德新社记者提问，德国外交部上周四紧急召见中国驻德国大使。德国外交部表示，会谈涉及有关中国在境内培训俄罗斯士兵的报道。请问外交部对此有何评论？另外这次召见对中德关系有何影响？毛宁表示，中国驻德国大使近日应约会见了德国外交部官员，就中德关系和共同关心的议题交换了意见。而关于你提到德方关注的所谓报道，我们此前已经明确表示，有关报道没有事实根据，纯属污蔑抹黑。在乌克兰危机问题上，中方始终秉持客观公正立场，致力于危机的政治解决，坚持以自己的方式劝和促谈，德方应当客观理性看待中方的立场和作用。（澎湃新闻）", "ctime": 1783322952, "time_str": "15:29:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260706/c677973065.shtml"}, {"id": "4657481", "title": "外交部：中方一贯反对没有国际法依据的非法单边制裁 坚定支持古巴维护国家主权", "content": "7月6日，外交部发言人毛宁主持例行记者会。有记者问：近日，古巴国家主席警告称，美国对古巴封锁影响已至“临界水平”，构成种族灭绝威胁，要求联合国大会于7月7日就此召开特别会议。中方对此有何评论？毛宁表示，美国对古巴实施60多年全面封锁和非法制裁，给古巴人民带来深重灾难。近期，美方又升级有关封锁和制裁措施，严重冲击古巴基本民生，引起国际社会高度关注。中方一贯反对没有国际法依据的非法单边制裁，敦促美方立即停止对古巴的封锁和胁迫施压，停止侵犯古巴人民的生存权、发展权。中方坚定支持古巴维护国家主权，反对外来干涉，愿同国际社会一道捍卫国际公平正义。（央视新闻）", "ctime": 1783322938, "time_str": "15:28:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260706/c677973057.shtml"}, {"id": "4657467", "title": "南向资金净买入超170亿港元", "content": "据同花顺iFinD数据，截至目前，南向资金净买入超170亿港元，其中港股通（沪）买入超110.56亿港元，港股通（深）买入超59.76亿港元。", "ctime": 1783322741, "time_str": "15:25:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260706/c677972936.shtml"}, {"id": "4657453", "title": "曾被中方制裁的荷兰大臣即将访华，外交部：中荷互为重要合作伙伴", "content": "7月6日，外交部发言人毛宁主持例行记者会。有记者提问，荷兰外贸与发展合作大臣舍尔茨玛将于周二访华并与中国商务部长王文涛会面。舍尔茨玛在2021年曾遭到中方制裁，此访是否表明中方已经解除了对他的制裁？中方对此访有何期待？毛宁表示，访问的具体情况建议你向主管部门了解，我可以告诉你的是，中国和荷兰互为重要的合作伙伴，秉持开放务实的精神，推进对话合作，符合两国的共同利益。我们欢迎两国商务部门在相互尊重的基础上，加强对话交流，深化两国关系。（澎湃新闻）", "ctime": 1783322610, "time_str": "15:23:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260706/c677972849.shtml"}, {"id": "4657451", "title": "日媒记者提问中国试射潜射战略导弹，外交部：不针对任何特定国家和目标", "content": "7月6日，外交部发言人毛宁主持例行记者会。日本放送协会记者就中国试射潜射战略导弹一事提问。毛宁表示，关于你提到的这个问题，中方已经发布了消息，具体的情况建议你向主管部门了解。我可以告诉你的是，这是中方年度军事训练的例行性安排，符合国际法和国际惯例，不针对任何特定国家和目标。法新社记者也就有关情况进行追问。毛宁表示，具体问题你可以向主管部门进一步了解，我可以告诉你的是，这是一次例行性的军事训练活动，不针对任何特定的国家和目标，事先已经向有关国家作了通报，符合国际法和国际惯例。有关的发射活动始终保持安全规范和专业操作，希望有关国家不要过度解读。（澎湃新闻）", "ctime": 1783322597, "time_str": "15:23:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260706/c677972846.shtml"}, {"id": "4657429", "title": "外交部回应中国防暑降温产品受到欧洲民众追捧", "content": "就有报道说中国生产的空调、风扇、多功能防晒伞等防暑降温产品受到欧洲民众追捧，外交部发言人毛宁6日在例行记者会上答问时表示，契合需求、物美价优的商品自然会受到欢迎。中欧贸易结构是市场需求驱动、基于优势互补的自然结果。事实证明，在中欧贸易中，消费者得到了实惠、供应商获取了利润，不可能强买强卖，而是双向选择、共同受益。（新华社）", "ctime": 1783322404, "time_str": "15:20:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260706/c677972716.shtml"}, {"id": "4657425", "title": "南向资金净买入超160亿港元", "content": "据同花顺iFinD数据，截至目前，南向资金净买入超160亿港元，其中港股通（沪）买入超104.67亿港元，港股通（深）买入超56.05亿港元。", "ctime": 1783322318, "time_str": "15:18:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260706/c677972695.shtml"}, {"id": "4657423", "title": "外交部发言人就美国独立250周年答记者问", "content": "外交部发言人毛宁7月6日在例行记者会上答记者问时表示，今年是美国独立250周年，习近平主席已经代表中国政府和中国人民向美国总统特朗普致电表达祝贺。(新华社）", "ctime": 1783322306, "time_str": "15:18:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260706/c677972679.shtml"}, {"id": "4657417", "title": "外交部：中国海军组织潜射战略导弹试射 不针对任何特定国家和目标", "content": "7月6日，外交部发言人毛宁主持例行记者会。在回答有关中国海军成功组织潜射战略导弹试射的问题时，毛宁表示，关于你提到的这个问题，中方已经发布了消息，具体情况建议你向主管部门了解。我可以告诉你的是，这是中方年度军事训练的例行性安排，符合国际法和国际惯例，不针对任何特定国家和目标。（央视新闻）", "ctime": 1783322251, "time_str": "15:17:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260706/c677972644.shtml"}, {"id": "4657415", "title": "三星公布上半年绩效奖金 半导体部门最高拿100%基本工资", "content": "韩国三星电子负责半导体业务的设备解决方案（DS）部门将在今年上半年获得最高达基本工资100%的绩效奖金。负责成品业务的设备体验（DX）部门则将获得最高达基本工资75%的绩效奖金。三星电子于6日公布了上述目标达成奖励（TAI）的发放比例。奖金将于8日支付。DS部门存储器事业部继去年下半年之后，再次被评定为TAI 100%。分析认为，这得益于人工智能（AI）基础设施投资扩大带来的存储器价格上涨，以及高带宽存储器（HBM）供应扩大等因素，使得业绩大幅增长。（新浪财经）", "ctime": 1783322242, "time_str": "15:17:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260706/c677972628.shtml"}, {"id": "4657405", "title": "永清环保中标醴陵钨矿废渣整治项目", "content": "永清环保成功中标醴陵市明月镇新台村历史遗留钨矿废渣综合整治项目，这是株洲市防范化解重大生态环境风险隐患“利剑”行动的重点工程。(人民财讯)", "ctime": 1783322134, "time_str": "15:15:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260706/c677972594.shtml"}, {"id": "4657375", "title": "济滨高铁主体工程完工，即将开通运营", "content": "国家重大交通工程济滨高铁主体工程已全部完工，6日全线开启静态验收，今年下半年将开通运营。济滨高铁项目起自济南东站，止于德大铁路滨州站。设计速度350公里/小时，工程投资374.2亿元。作为山东省快速铁路网鲁北通道的主要组成部分，济滨高铁建成后将带动沿线重要城镇间的城际客流快速出行，对于推动区域经济协调发展和改善区域交通条件具有重要意义。（央视新闻）", "ctime": 1783321948, "time_str": "15:12:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260706/c677972522.shtml"}, {"id": "4657347", "title": "南向资金净买入超150亿港元", "content": "据同花顺iFinD数据，截至目前，南向资金净买入超150亿港元，其中港股通（沪）买入超97.43亿港元，港股通（深）买入超53.15亿港元。", "ctime": 1783321673, "time_str": "15:07:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260706/c677972380.shtml"}, {"id": "4657343", "title": "两部门开展网络平台涉志愿服务违规信息专项整治", "content": "为进一步加强志愿服务监督管理，深入排查清理网上涉志愿服务违规信息，中央网信办、中央社会工作部决定自2026年6月下旬至8月下旬，集中开展为期2个月的网络平台涉志愿服务违规信息专项整治。通过专项整治，督促电商平台、社交平台等各类网络平台落实主体责任，集中清理涉志愿服务违规信息和账号，进一步加强志愿服务信息平台监管，维护志愿服务的公益性和社会公信力，为志愿服务事业持续健康发展营造良好网络环境。（网信中国）", "ctime": 1783321610, "time_str": "15:06:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260706/c677972355.shtml"}, {"id": "4657323", "title": "ETF两市成交额报5569.1亿元，较上一交易日此时放量308.73亿元", "content": "截至目前，ETF两市成交额报5569.1亿元，较上一交易日此时放量308.73亿元，分类型来看，股票型ETF成交额1928.7亿元，债券型ETF成交额2126.28亿元，货币型ETF成交额309.01亿元，商品型ETF成交额65.88亿元，QDII型ETF成交额1139.23亿元。", "ctime": 1783321575, "time_str": "15:06:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260706/c677972324.shtml"}, {"id": "4657291", "title": "期货收评：地缘冲突缓和 欧线暴跌超4%！鸡蛋期现共振 大涨超4%", "content": "期货收评：截止收盘，国内期货主力合约涨多跌少，鸡蛋涨超4%，沪锡涨超3%，合成橡胶涨超2%，豆粕、20号胶涨近2%，豆二、纯苯、菜粕涨超1%。跌幅方面，集运欧线跌超4%，红枣、碳酸锂跌超2%，钯、铂、胶版纸、玉米、纸浆跌超1%。", "ctime": 1783321338, "time_str": "15:02:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260706/c677972227.shtml"}, {"id": "4657283", "title": "欧洲主要股指开盘多数下跌", "content": "欧洲主要股指开盘多数下跌，欧洲斯托克 const SECTORS  = [{"name": "金融", "hit_count": 30, "etfs": []}, {"name": "人工智能", "hit_count": 26, "etfs": []}, {"name": "数据要素", "hit_count": 25, "etfs": []}, {"name": "半导体", "hit_count": 22, "etfs": []}, {"name": "军工", "hit_count": 15, "etfs": []}, {"name": "机器人", "hit_count": 15, "etfs": []}, {"name": "消费", "hit_count": 14, "etfs": []}, {"name": "新能源", "hit_count": 11, "etfs": []}];
const META     = {"update_time": "2026-07-06 16:00:10", "sentiment_score": 52.608695652173914, "agents": []};

// 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态

      </div>

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

renderSectorChart();

setInterval(updateCountdown, 1000);
