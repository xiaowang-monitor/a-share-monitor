板块持续走高，古井贡酒涨停，金种子酒此前封板，顺鑫农业、舍得酒业、迎驾贡酒、水井坊、金徽酒等跟涨。相关ETF方面，消费ETF广发（560680）涨4.03%，成交额1782.45万元，食品饮料ETF华夏（515170）涨3.85%，成交额1.2亿元。", "ctime": 1784091789, "time_str": "13:03:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260715/c678190272.shtml"}, {"id": "4725039", "title": "游戏板块走高，巨人网络涨停", "content": "游戏板块走高，恺英网络、巨人网络涨停，吉比特、完美世界、冰川网络、星辉娱乐跟涨。相关ETF方面，游戏ETF华泰柏瑞（516770）涨5.7%，成交额4182.53万元，游戏ETF华夏（159869）涨5.87%，成交额6.67亿元。", "ctime": 1784091770, "time_str": "13:02:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260715/c678190267.shtml"}, {"id": "4724887", "title": "伊朗称打击美军在中东多地军事设施", "content": "伊朗伊斯兰革命卫队当地时间15日早晨在社交媒体发表多份声明说，伊朗打击了美军在巴林、约旦、科威特等地的军事设施，其中包括位于巴林的美军第五舰队设施。声明表示，在新一波攻势中，伊朗打击并摧毁了位于巴林的美军第五舰队的指挥控制中心、燃料储存设备和军备仓库等设施。声明还说，伊朗摧毁了位于约旦阿兹拉克的美军空军基地中存放F-15、F-16和F-35战斗机的机库以及数架美国MQ-9无人机。（新华社）", "ctime": 1784091338, "time_str": "12:55:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260715/c678190223.shtml"}, {"id": "4724879", "title": "中泰将合作共建泰国首台离子阱量子计算机", "content": "泰国朱拉隆功大学14日宣布，将与中方合作共建泰国首台离子阱量子计算机，推动中泰量子科技领域合作进一步深化。朱拉隆功大学当天启动一项量子研究计划，宣布该校将与中国科学技术大学、合肥幺正量子科技有限公司开展合作，共建离子阱量子计算机系统。（新华社）", "ctime": 1784091236, "time_str": "12:53:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260715/c678190216.shtml"}, {"id": "4724875", "title": "理工光科：目前暂未涉及户外作业机器人相关业务", "content": "理工光科7月15日在互动平台表示，公司目前暂未涉及户外作业机器人相关业务。公司光纤传感系统主要用于油气、管网、电力、隧道、桥梁等场景。", "ctime": 1784091225, "time_str": "12:53:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260715/c678190215.shtml"}, {"id": "4724873", "title": "盈新发展与青岛胶州签约 共建高端存储产业基地", "content": "盈新发展与青岛胶州签约 共建高端存储产业基地，双方拟组建合资公司，重点聚焦高端存储芯片产业的协同发展。盈新发展将统筹上市公司及旗下科技板块资源，在胶州布局建设集研发、封装、测试、模组制造于一体的智能化存储产业基地，重点布局NAND FLASH颗粒、LPDDR颗粒、DDR5颗粒先进封测产品及高性能存储模组制造，持续完善存储产业链配套。（人民财讯）", "ctime": 1784091202, "time_str": "12:53:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260715/c678190211.shtml"}, {"id": "4724869", "title": "杰富瑞将高盛目标股价从1202美元上调至1299美元", "content": "杰富瑞将高盛目标股价从1202美元上调至1299美元。", "ctime": 1784091132, "time_str": "12:52:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260715/c678190205.shtml"}, {"id": "4724799", "title": "乌克兰议会批准总理斯维里坚科辞职", "content": "乌克兰国家通讯社7月14日报道，乌最高拉达（议会）当天审议批准了乌总理斯维里坚科递交的辞呈。按照乌法律规定，现任内阁将随之自动解散。乌最高拉达去年7月17日投票批准斯维里坚科出任总理。乌克兰总统泽连斯基今年7月12日在社交媒体发文说，为保障落实新的政治战略，他决定重组内阁，与斯维里坚科讨论了内阁调整细节。7月13日，斯维里坚科向乌最高拉达递交了辞呈。（CCTV国际时讯）", "ctime": 1784089863, "time_str": "12:31:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260715/c678189971.shtml"}, {"id": "4724757", "title": "世界杯决赛用球等纪念品将拍卖", "content": "佳士得拍卖行将于7月22日至29日举行线上拍卖活动，拍卖品包括世界杯决赛用球、主题曲演唱者夏奇拉穿过的演出服等。拍卖所得将捐赠给国际足联“全球公民教育基金”，旨在为全球儿童筹集1亿美元，提供接受优质教育和参与足球运动的机会。（新华社）", "ctime": 1784089642, "time_str": "12:27:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260715/c678189950.shtml"}, {"id": "4724743", "title": "美团等入股通用操作解决方案提供商舞肌科技", "content": "企查查APP显示，近日，上海舞肌科技有限公司发生工商变更，新增蚂蚁集团关联公司上海云玚企业管理咨询有限公司、美团旗下福建省龙珠文旅数创股权投资基金合伙企业（有限合伙）等为股东，同时注册资本增至262.25万元。企查查信息显示，该公司成立于2019年，经营范围包含：从事电子科技、医疗科技、机械设备科技、机器人科技领域内的技术开发等。据其官网，舞肌科技是一家通用操作解决方案提供商，致力于让机器人拥有人类般的灵巧，加速通用物理智能。（人民财讯）", "ctime": 1784089329, "time_str": "12:22:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260715/c678189914.shtml"}, {"id": "4724741", "title": "美众议院通过全年采用夏令时法案", "content": "美国国会众议院14日投票通过一项法案，将目前实行的夏令时时间固定为全年采用的时间，不再每年两次转换时间。不过，该法案同时允许各州申请不实行全年夏令时。该法案名为《阳光保护法案》，众议院投票结果为308票赞成、117票反对。该法案将提交参议院审议，如获通过，将提交总统特朗普签署。特朗普一直强烈支持这项法案。今年5月21日，美国国会众议院能源和商业委员会以48比1的投票结果通过《阳光保护法案》。特朗普随即发帖说：“是时候让人们停止关注‘时钟’了，更别提每年两次这种荒谬的表演所耗费的大量人力物力了。”（新华社）", "ctime": 1784089317, "time_str": "12:21:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260715/c678189913.shtml"}, {"id": "4724723", "title": "全国79条河流维持超警 最大超警幅度4.71米", "content": "今天上午，水利部举行会商，分析研判全国的雨情水情，安排部署暴雨洪水防御工作。截至7月15日9时，吉林、辽宁、黑龙江、内蒙古、天津、河北、四川、甘肃、安徽、云南、广东、广西等地79条河流维持超警，最大超警幅度4.71米。未来3天（7月15日至7月17日）：松辽流域松花江吉林段上游、牡丹江、辽河中下游干流及浑河太子河、绥芬河等主要河流将维持超警；松花江支流拉林河将发生编号洪水。7月15日8时至7月16日8时，山东南部、广西东部和北部、青海东部、甘肃西南部等地部分地区发生山洪灾害可能性大。水利部7月15日维持洪水黄色预警，发布橙色山洪灾害气象预警，提醒辽宁、吉林、黑龙江、安徽等省份有关地区社会公众注意防范。（央视新闻）", "ctime": 1784089050, "time_str": "12:17:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260715/c678189828.shtml"}, {"id": "4724681", "title": "特朗普回应霍尔木兹海峡通行收费为何“反转”", "content": "美国总统特朗普14日就叫停霍尔木兹海峡通行收费一事称，在他提出对霍尔木兹海峡运输货物收取20%的费用后，中东多国致电表示愿在美国大规模投资，他对此“非常满意”，因此就“不需要征收通行费”了。（新华社）", "ctime": 1784088727, "time_str": "12:12:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260715/c678189799.shtml"}, {"id": "4724635", "title": "按病种付费3.0版分组方案发布在即 国家医保局再次召开座谈会听取意见建议", "content": "为进一步做好发布前沟通解读工作，近日，在按病种付费3.0版分组方案发布前夕，国家医保局再次组织召开征求意见座谈，与国家卫生健康委医院管理研究所，国家DRG、DIP技术指导组成员，北京协和医院、北京大学人民医院、浙江大学医学院附属第二医院、四川大学华西医院等7家医院相关工作负责同志、医护人员代表，以及医保专家和自媒体代表进行深入交流，深入听取意见建议，凝聚改革共识。（国家医疗保障局）", "ctime": 1784088180, "time_str": "12:03:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260715/c678189656.shtml"}, {"id": "4724629", "title": "多个市民团体反对日本拥有核潜艇", "content": "针对日本政府试图发展核动力潜艇的动向，多个日本市民团体7月14日发表联合声明指出，日本长期宣扬废除核武器，且日本《原子能基本法》规定，核能的利用仅限和平目的。拥有核潜艇将意味着日本自我否定这一立场。参与发表联合声明的“和平舟”组织在其网站上说，日本执政党和政府专家小组提出拥有核潜艇的相关建议，是非常危险的动向。核潜艇是进行远距离潜航和攻击的装备，拥有核潜艇将严重背离日本奉行的“专守防卫”原则。（CCTV国际时讯）", "ctime": 1784088137, "time_str": "12:02:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260715/c678189623.shtml"}, {"id": "4724623", "title": "汇通达网络等成立科技新公司，含AI相关业务", "content": "企查查APP显示，近日，江苏汇廪科技有限公司成立，经营范围包含人工智能硬件销售、数据处理和存储支持服务、光通信设备制造和光通信设备销售等。企查查股权穿透显示，该公司由汇通达网络等共同持股。（人民财讯）", "ctime": 1784088098, "time_str": "12:01:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260715/c678189611.shtml"}, {"id": "4724619", "title": "港股午评：恒生指数涨1.46%，恒生科技指数涨1.39%", "content": "港股午间收盘，恒生指数涨1.46%，恒生科技指数涨1.39%。恒指港股通ETF银华（159318）涨0.95%，港股通科技ETF鹏华（159751）涨1.82%。板块方面，生命科学工具、生物科技板块涨幅靠前；客运航空公司板块跌幅靠前。个股方面，昭衍新药涨21.53%，维立志博-B涨15.6%，MINIMAX-W涨14.96%，英矽智能涨12.91%，劲方医药-B涨12.81%；海光芯正跌11.47%，亮晴控股跌10.81%，中国建材跌10.47%，鼎泰高科跌5.24%，领益智造跌4.47%。", "ctime": 1784088075, "time_str": "12:01:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260715/c678189603.shtml"}, {"id": "4724589", "title": "7月15日午间公告一览：科伦药业TROP2 ADC联合疗法肺癌3期临床达主要终点", "content": "科伦药业公告，控股子公司科伦博泰核心产品TROP2 ADC芦康沙妥珠单抗联合帕博利珠单抗一线治疗PD-L1阴性局部晚期或转移性非鳞状非小细胞肺癌的3期临床研究（OptiTROP-Lung06），在预设期中分析中经独立数据监查委员会确认达到无进展生存期（PFS）主要终点，相比化疗联合帕博利珠单抗显示出统计学和临床意义显著改善，总生存期（OS）有获益趋势，安全性良好。科伦博泰计划就该研究结果与国家药监局药品审评中心进行沟通。", "ctime": 1784087920, "time_str": "11:58:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260715/c678189566.shtml"}, {"id": "4724585", "title": "蔚来战略投资长鑫科技：双方将构建稳定、互信的战略供应关系", "content": "记者最新获悉，蔚来成为长鑫科技战略投资方，承诺认购金额为1.58亿元，锁定期限为18个月。双方将就现有车规级LPDDR4X、LPDDR5X产品开展战略合作，致力于构建稳定、互信的战略供应关系。近年来，蔚来持续布局芯片、智能驾驶、能源等底层核心技术，并不断深化与产业链关键伙伴的战略合作。 （证券时报）", "ctime": 1784087757, "time_str": "11:55:57", "sto const SECTORS  = [{"name": "金融", "hit_count": 26, "etfs": []}, {"name": "数据要素", "hit_count": 26, "etfs": []}, {"name": "消费", "hit_count": 19, "etfs": []}, {"name": "半导体", "hit_count": 18, "etfs": []}, {"name": "人工智能", "hit_count": 15, "etfs": []}, {"name": "军工", "hit_count": 10, "etfs": []}, {"name": "医药", "hit_count": 9, "etfs": []}, {"name": "机器人", "hit_count": 7, "etfs": []}];
const META     = {"update_time": "2026-07-15 13:51:03", "sentiment_score": 56.79611650485437, "agents": []};

// 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',

  container.innerHTML = agents.map(a => `

        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>

        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
