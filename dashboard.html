const NEWS     = [{"id": "5452617", "title": "消息称大模型公司DeepSeek拟在最新一轮融资中筹得约1000亿元人民币", "content": "10月22日，有市场消息称，国内大模型公司DeepSeek（深度求索）拟在最新一轮融资中筹得约1000亿元人民币（约150亿美元），腾讯和宁德时代为本轮出资最多的投资方，交易预计在未来数日内正式完成。截至目前，DeepSeek及腾讯等相关投资方均未公开回应。记者从接近公司和投资方的多个信源交叉求证，确认上述消息属实。消息人士透露，本轮募资目标最初设定为500亿元，此后经多轮上调至约1000亿元，目前尚未官宣，最终金额仍未完全确定。这笔资金将继续用于模型训练、算力建设和人才招募，以支撑DeepSeek参与全球竞争。也有部分消息人士判断，本轮融资将为公司筹备中的科创板IPO铺平道路。（上海证券报）", "ctime": 1792671233, "time_str": "20:13:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261022/c680992495.shtml"}, {"id": "5452473", "title": "璞泰来：2026年10月23日完成注销975.14万股回购股份", "content": "璞泰来公告，公司此前回购股份的资金总额不低于人民币2亿元（含）且不超过人民币3亿元（含），原用途为员工持股计划；实际回购最高价格34元/股，使用资金总额3亿元。公司后将975.14万股用途变更为注销并减少注册资本，并于2026年10月23日完成注销，占截至2026年9月30日公司股份总数的0.45%。注销后，总股本由21.44亿股减少为21.35亿股，注册资本由21.44亿元减少为21.35亿元。", "ctime": 1792670605, "time_str": "20:03:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261022/c680992271.shtml"}, {"id": "5452465", "title": "全球约1177万个会员账号邮箱等个人信息泄露，日本游戏厂商卡普空致歉", "content": "据日本广播协会10月22日报道，日本游戏厂商卡普空（CAPCOM）当天发表声明称，该公司线上会员服务系统19日遭第三方入侵，全球范围约1177万个会员账号的电子邮箱等个人信息泄露。据报道，卡普空称，其中至少196个会员账号的密码被不当修改，至少40个会员账号用户的生日、性别等详细信息被泄露。被泄露的信息不涉及信用卡等支付手段。卡普空呼吁用户对可能会收到的可疑电子邮件提高警惕，并称就此事对用户和其他相关人士深表歉意。（环球网）", "ctime": 1792670575, "time_str": "20:02:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261022/c680992259.shtml"}, {"id": "5452397", "title": "沙特主导的联军称拦截并摧毁多架无人机", "content": "当地时间10月22日，沙特阿拉伯主导的多国联军发表声明称，在沙特利雅得和麦地那地区拦截并摧毁了4架无人机。当天稍早前，联军称在利雅得地区拦截并摧毁一架无人机。（央视新闻）", "ctime": 1792670444, "time_str": "20:00:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261022/c680992237.shtml"}, {"id": "5452289", "title": "10月22日 周四《新闻联播》要闻15条", "content": "1、纪念中国工农红军长征胜利90 轮流动性危机及科技股走势，并直言“全是我的责任”“对不住大家”“这是很难被原谅的”。不过，全龙并未因此转向看空科技股，他坚信，目前整个行业景气度依旧很好，现有持仓明年的业绩预期仍然较好，当前没有必要在低位离场，应等待流动性和市场信心恢复。", "ctime": 1792669847, "time_str": "19:50:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261022/c680992014.shtml"}, {"id": "5452233", "title": "叙利亚安全部队与“伊斯兰国”交火", "content": "叙利亚国家通讯社22日援引叙安全部队消息说，安全部队当天在大马士革农村省西部针对恐怖组织“伊斯兰国”一分支小组开展安全行动期间，双方发生交火，造成2名安全人员死亡、5人受伤。总部设在英国的“叙利亚人权观察组织”说，此次交火发生在22日凌晨，已有1人被拘捕。安全部门正在当地开展搜查和追捕行动，当地居民被要求留在家中。该组织说，事发地位于卡拉蒙地区，靠近叙利亚与黎巴嫩边境。（新华社）", "ctime": 1792669806, "time_str": "19:50:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261022/c680991999.shtml"}, {"id": "5452229", "title": "普京批准俄副总理等人事任命", "content": "俄罗斯总统普京22日签署一系列总统令，批准了包括副总理、政府部长和总统助理在内的多个岗位人事任命。根据俄法律文书网站上发布的相关总统令内容，普京任命安东·西卢安诺夫为副总理兼财政部长，任命伊琳娜·奥克拉德尼科娃为副总理兼政府办公厅主任，任命奥列格·科热米亚科为副总理兼俄总统驻远东联邦区全权代表，任命安德烈·尼基京为副总理。文件显示，普京还任命尤里·特鲁特涅夫为总统助理，任命德米特里·亚德罗夫为交通部长。（新华社）", "ctime": 1792669743, "time_str": "19:49:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261022/c680991987.shtml"}, {"id": "5452219", "title": "赵乐际主持召开十四届全国人大常委会第七十四次委员长会议", "content": "十四届全国人大常委会第七十四次委员长会议22日下午在北京人民大会堂举行。赵乐际委员长主持会议。会议决定，十四届全国人大常委会第二十五次会议11月2日至6日在北京举行。委员长会议建议，十四届全国人大常委会第二十五次会议审议检察公益诉讼法草案、南极活动与环境保护法草案、水法修订草案、反跨境腐败法草案、国有资产法草案、金融法草案；审议全国人大常委会委员长会议关于提请审议刑事诉讼法修正草案的议案；审议全国人大环境与资源保护委员会关于提请审议可再生能源法修订草案的议案；审议国务院关于提请审议税收征收管理法修订草案的议案、关于提请审议突发事件应对法等15部法律的修正案草案的议案；审议国务院关于提请审议批准《关于成立世界人工智能合作组织的协定》的议案。（新华社）", "ctime": 1792669631, "time_str": "19:47:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261022/c680991957.shtml"}, {"id": "5452191", "title": "建筑机器人市场规模有望破800亿元", "content": "具身智能，正从实验室走向应用场景。在广东，会自己找位绑钢筋的机器人、贴着高楼外墙行走的清洗机器人，已悄然“上岗”。机器人进了工地，订单就跟着来了。广州某建筑机器人企业产线负责人告诉记者，目前量产的六款机器人里，几乎款款都有订单在手，排期排到12月份，依然满足不了客户需求。国内订单在涨，海外也在放量。深圳另一家建筑机器人企业负责人告诉记者，今年他们的产线同样满负荷运转，企业正在计划扩产，国内业绩收入增超50%，国外增超100%。数据显示，2023年国内建筑机器人市场不足80亿元，2025年快速攀升至186亿元，两年复合增速超52%；预计2026年突破280亿元，同比增长50%以上；到2030年，市场规模有望突破800亿元。（央视财经）", "ctime": 1792669521, "time_str": "19:45:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261022/c680991933.shtml"}, {"id": "5452163", "title": "天马科技：2026年9月鳗鱼出池约103.84吨", "content": "天马科技公告，2026年9月鳗鱼出池约103.84吨，其中外销约45.87吨、自用约57.98吨，销售价格区间为3.27万元/吨~6.42万元/吨；2026年1~9月累计出池约10506.16吨。上述数据未经审计。", "ctime": 1792669455, "time_str": "19:44:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261022/c680991920.shtml"}, {"id": "5452145", "title": "上交所：将茶百道调出沪港通下港股通标的", "content": "上交所发布通知，将茶百道调出沪港通下港股通标的，自下一港股通交易日起生效。", "ctime": 1792669367, "time_str": "19:42:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261022/c680991898.shtml"}, {"id": "5452143", "title": "中伟新材：董事会通过收购HML53.3%股权等交易", "content": "中伟新材公告，2026年10月22日，公司董事会审议通过收购股权及对外投资议案：全资子公司中伟香港正兴拟以约1.08亿美元收购HML53.3%股权；全资子公司EEP拟认购ANHI配股新增股份，ANHI拟以3.24亿美元收购DDL100%股权。交易尚需ANHI临时股东大会审议通过及相关境外审批程序。", "ctime": 1792669344, "time_str": "19:42:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261022/c680991894.shtml"}, {"id": "5452121", "title": "Meta未来支出承诺激增至8250亿美元", "content": "Meta未来支出承诺激增至8250亿美元。", "ctime": 1792669182, "time_str": "19:39:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261022/c680991853.shtml"}, {"id": "5452095", "title": "中水渔业：和美渔业拟出资120万澳元设立合资公司", "content": "中水渔业公告，全资子公司和美渔业拟与基里巴斯政府、海富公司在基里巴斯塔拉瓦共同设立合资公司，注册资本200万澳元，其中和美渔业出资120万澳元、持股60%。本次投资已获公司董事会审议通过，尚需履行境内外相关审批、登记及备案程序。", "cti // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}
