万平方米。据初步信息，1名员工被爆炸冲击波震伤，出现脑震荡。本轮袭击中，该州上空共有16架无人机被击落。佩尔维绍夫在通报中指出，7月18日凌晨，该物流中心曾遭无人机袭击，造成7名员工遇难，25人受伤。乌克兰方面对此暂无回应。（央视新闻）", "ctime": 1787714646, "time_str": "11:24:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260826/c679298472.shtml"}, {"id": "5029319", "title": "半导体设备板块走高", "content": "半导体设备板块走高，超纯应材涨超10%，托伦斯、金海通、矽电股份、中科仪、先锋精科等跟涨。", "ctime": 1787714535, "time_str": "11:22:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260826/c679298457.shtml"}, {"id": "5029317", "title": "长三角铁路部门启动防台防汛应急响应 调整列车开行方案", "content": "为确保铁路运输和旅客出行安全，铁路部门密切关注台风“沙德尔”路径变化和后续影响，及时启动防台防汛应急响应，采取超前预警、主动避险等措施，调整列车开行方案，计划对8月27日至28日杭温高铁、杭台高铁、金温铁路、金台铁路、甬金铁路，8月27日至29日杭深铁路等线路部分区段部分时段途经列车，采取临时停运措施。下一步，铁路部门将密切关注台风路径变化，根据风速、雨量和灾害影响程度等实际，动态调整列车开行方案，保障旅客安全出行需要。具体列车开行信息，请关注车站公告或致电铁路12306客服热线查询，以便妥善安排行程。（央视新闻）", "ctime": 1787714479, "time_str": "11:21:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260826/c679298442.shtml"}, {"id": "5029315", "title": "京津冀将加速脑机接口技术与神经科学、人工智能等前沿学科的交叉创新", "content": "《京津冀脑机接口跨区域质量强链工作方案》发布。其中提到，面向医疗康复、智能交互、教育娱乐等关键领域，加速脑机接口技术与神经科学、人工智能等前沿学科的交叉创新。发挥脑机接口人体功能量化评估的客观优势，重点发展医疗领域基于脑机接口的神经疾病诊疗、运动功能重建、康复训练和情绪精神类疾病分级诊疗；在工业领域，推动作业人员体征监测、脑控机器人、高精度人机协同、模拟训练等场景落地；探索脑机接口在教育领域、智能家居、辅助驾驶等方面的创新应用。建设脑机接口技术试验平台，为科研机构及企业在脑电库建设、脑机接口临床研究和科研转化等提供应用场景。通过示范项目验证技术安全性、有效性、稳定性与兼容性，培育脑机接口新业态，打造技术研发—模拟验证—场景验证—产业推广的完整生态链。", "ctime": 1787714474, "time_str": "11:21:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260826/c679298441.shtml"}, {"id": "5029307", "title": "国家医保局：为患者病理检查生成全国通用的专属“身份证”", "content": "国家医保局日前印发《“医保病理云索引”编码规范》，针对病理数据标准不统一、流通不顺畅等行业痛点，编制全国统一的病理数据索引，为患者每一次病理检查生成全国通用、唯一的专属“身份证”，推动各医疗机构病理数据真正“活起来”“跑起来”“用起来”，破除跨区域、跨机构数据共享壁垒。（央视新闻）", "ctime": 1787714280, "time_str": "11:18:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260826/c679298320.shtml"}, {"id": "5029287", "title": "《京津冀脑机接口跨区域质量强链工作方案》印发", "content": "《京津冀脑机接口跨区域质量强链工作方案》印发。其中提到，加强质量共性技术攻关。支持链主企业、高校、科研院所、医疗机构等开展质量攻关活动，鼓励联合开展质量技术攻关。找准共性质量痛点，推进脑机接口质量强链标志性项目建设。围绕脑机接口涉及的神经信号采集、解码、控制和反馈等关键环节，聚焦脑电信号感知与采集、人机交互技术、脑机接口典型应用场景等方面，推动新型干电极、柔性电极、脑机接口信号采集芯片、计算解码芯片、集成整机采集系统、高性能实时解码算法等质量共性技术突破和转化落地。", "ctime": 1787713994, "time_str": "11:13:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260826/c679298197.shtml"}, {"id": "5029281", "title": "受台风“沙德尔”影响 长三角铁路部分列车临时停运", "content": "记者从国铁上海局了解到，为应对台风“沙德尔”路径变化和后续影响，确保列车运行安全。长三角铁路及时启动防台风防汛应急响应，计划对8月27日至28日杭温高铁、杭台高铁、金温铁路、金台铁路、甬金铁路，8月27日至29日杭深铁路等线路部分区段部分时段途经列车，采取临时停运措施。已购相关停运列车车票的旅客，可自列车停运信息公布时起至车票乘车日期后30日以内在12306网站（含手机App）或车站窗口办理全额退票手续。（央视新闻）", "ctime": 1787713947, "time_str": "11:12:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260826/c679298181.shtml"}, {"id": "5029261", "title": "以色列称将继续追击参与2023年袭击的巴武装人员", "content": "以色列军方25日表示将继续追击参与2023年10月7日袭击以色列的巴勒斯坦武装人员。以军总参谋长扎米尔当天称，任何参与当年袭击的武装人员都将被追击，“直至被消灭”。“这是首要任务，以军南方司令部和整个以色列国防军都在全力以赴实施。”近几个月来，以军加大对参与2023年袭击的巴武装人员的打击行动，常以“构成迫在眉睫的威胁”为由对加沙地带实施空袭，对相关人员实施“定点清除”。（新华社）", "ctime": 1787713483, "time_str": "11:04:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260826/c679298047.shtml"}, {"id": "5029253", "title": "光大期货：宏观情绪转暖，隔夜黄金窄幅震荡", "content": "隔夜伦敦现货贵金属窄幅震荡，盘中触及4696.83美元，创5月中旬以来新高，收涨0.21%。\n美伊停火谈判传出重大进展，油价大跌。短线黄金偏强震荡，今晚将公布美国 7 月 PCE 通胀数据以及二季度 GDP 修正值，恰逢杰克逊霍尔年会前夕，数据结果将扰动美元与利率预期。\n宏观方面，美国8月谘商会消费者信心指数降至89.4，为今年1月以来最低水平，降至七个月低点位置。与此同时，美国密歇根大学8月消费者情绪指数三个月来首次下滑，消费者对商业环境恶化及通胀上升的担忧进一步加剧。波士顿联储主席柯林斯表示，若通胀改善未能持续，近期收紧政策将是合适之举，通胀面临供给冲击与经济活动强于预期的上行风险，AI基建似乎正在推高核心商品通胀。地缘政治方面，美伊谈判再传重大进展，有媒体称，美伊已就停火协议条款达成共识，其中包括霍尔木兹海峡自由通航。宏观情绪转暖，黄金维系偏强走势。但仍需注意短期节奏，28日美联储主席沃什在杰克逊霍尔年会上的首次主旨演讲——若其释放明确的抗通胀信号，则可能引发市场对9月加息预期的重新定价。（光大期货）", "ctime": 1787713326, "time_str": "11:02:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260826/c679298001.shtml"}, {"id": "5029235", "title": "民进党当局称无开放澎湖“小三通”规划 国台办回应", "content": "8月26日上午，国台办举行例行新闻发布会。记者：为改善澎湖旅游市场衰退，澎湖县观光协会近日拜会陆委会盼重启澎湖“小三通”，民进党当局回应称，考虑安全问题，大陆军机舰持续扰台，目前无开放澎湖“小三通”规划。请问对此有何评论？国台办发言人张晗：“小三通”航线是两岸特别是闽台民众交流往来最重要、最便捷的通道之一，是连接两岸民众的民生通道、亲情航线，为深化两岸融合发展和增进民众利益福祉发挥了重要作用。我们积极推动恢复上海、福建居民赴金门、马祖旅游，受到台湾民众的热烈欢迎。2024年8月以来，上海、福建居民通过“小三通”航线，赴金门、马祖旅游累计约35万人次。大陆方面始终秉持“两岸一家亲”理念，为推动两岸人员往来持续努力。民进党当局罔顾民意、政治操弄、不得人心。（央视新闻）", "ctime": 1787712972, "time_str": "10:56:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260826/c679297913.shtml"}, {"id": "5029231", "title": "华为与惠普签署专利交叉许可", "content": "8月26日，华为与惠普公司（HP Inc.）宣布签署一项多年期全球专利交叉许可协议，其中包括华为向惠普公司许可部分WiFi专利。签署协议后，惠普公司将向华为支付专利费用。目前，华为已经与美国、欧洲、日韩等主要ICT厂家签署了260余份专利许可协议。2025年新增34份专利许可协议。（第一财经）", "ctime": 1787712885, "time_str": "10:54:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260826/c679297867.shtml"}, {"id": "5029227", "title": "工信部：将研究起草动力电池退役相关行政法规，实施动力电池数字身份证管理制度", "content": "8月26日，国务院新闻办公室举行“开局起步‘十五五’”系列主题新闻发布会，介绍全力抓好“十五五”规划实施，加快推进新型工业化有关情况。工业和信息化部副部长辛国斌表示，针对大家普遍关心的新能源汽车动力电池退役问题，“十五五”时期我们将研究起草相关行政法规，开展部门联合执法专项行动，进一步规范回收利用秩序，实施动力电池数字身份证管理制度，做到来源可溯，去向可查。到2030年，废旧动力电池综合利用量力争达到百万吨级以上。（人民财讯）", "ctime": 1787712758, "time_str": "10:52:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260826/c679297790.shtml"}, {"id": "5029221", "title": "工信部：近期将发布促进中小企业发展“十五五”规划", "content": "8月26日，国务院新闻办公室举行“开局起步‘十五五’”系列主题新闻发布会，介绍全力抓好“十五五”规划实施，加快推进新型工业化有关情况。工业和信息化部副部长辛国斌表示，中小企业量大面广，既关乎技术创新和产业链韧性，又关乎就业和民生。“十五五”时期中小企业发展面临一些新的形势、新的机遇、新的挑战，工信部会同多部门共同编制促进中小企业发展的“十五五”规划，将于近期正式发布。（人民财讯）", "ctime": 1787712668, "time_str": "10:51:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260826/c679297748.shtml"}, {"id": "5029215", "title": "韩国综指涨幅扩大至2%", "content": "韩国综指涨幅扩大至2%，现报6878.94点。个股方面，SK海力士涨超3%，三星电子涨超2%。", "ctime": 1787712430, "time_str": "10:47:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260826/c679297569.shtml"}, {"id": "5029211", "title": "双箭股份与浙江海港阳光采购达成合作协议", "content": "近日，双箭股份与浙江海港阳光采购有限公司举行合作协议签约仪式，双方代表现场签署集中采购框架协议，标志着双箭股份从“单个港区零散供货”正式升级为浙江省海港集团总部级框架供应商。立足此次签约，双方未来将在港区运维、环保技改、新建码头配套三大方向深化协同，共建联合工况研究、寄售备件仓、绿色港口方案及长距离输送廊道。（人民财讯）", "ctime": 1787712421, "time_str": "10:47:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260826/c679297566.shtml"}, {"id": "5029207", "title": "港股金融板块持续拉升 申万宏源香港、港股中金公司涨超8%", "content": "港股金融板块持续拉升，申万宏源香港、港股中金公司涨超8%，南华期货股份、港股招商证券涨超6%。", "ctime": 1787712388, "time_str": "10:46:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260826/c679297541.shtml"}, {"id": "5029199", "title": "沪深京三市成交额超1万亿元，较上日此时放量301亿元", "content": "据同花顺iFinD数据，沪深京三市成交额超1万亿元，较上日此时放量301亿元，预计全天成交金额约1.9万亿元。截至目前，沪市成交额4680亿元，深市成交额5259亿元，北证50成交额76亿元。", "ctime": 1787712231, "time_str": "10:43:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260826/c679297431.shtml"}, {"id": "5029193", "title": "宁德时代江西锂矿环评拟受理公示被撤销", "content": "8月26日早间，江西省宜春市生态环境局官网发布说明，将宁德时代旗下枧下窝锂矿采矿项目环境影响报告书的拟受理公示予以撤销。据说明，宜春时代新能源矿业有限公司江西省宜丰县圳口里一奉新县视下窝锂矿采矿项目环境影响报告书在拟受理公示期间，群众对建设单位前期公示的网站存在质疑。现将该拟受理公示撤销，待后续核准符合要求后，再另行公示。(上海证券报)", "ctime": 1787712068, "time_str": "10:41:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260826/c679297283.shtml"}, {"id": "5029189", "title": "科创50指数涨幅扩大至2%", "content": "科创50指数涨幅扩大至2%，现报1637.45点。", "ctime": 1787712043, "time_str": "10:40:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260826/c679297259.shtml"}, {"id": "5029183", "title": "工信部：“十五五”时期我国将培育建设500家零碳工厂", "content": "8月26日，国新办举行 “开局起步‘十五五’”系列主题新闻发布会，工业和信息化部相关负责人介绍全力抓好“十五五”规划实施、加快推进新型工业化有关情况。发布会上介绍，“十五五”期间将培育建设500家零碳工厂，打造一批可复制、可推广的建设模式。（央视新闻）", "ctime": 1787711880, "time_str": "10:38:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260826/c679297161.shtml"}, {"id": "5029179", "title": "工信部：要促进制造业向微笑曲线两端延伸，提高全要素生产率", "content": "8月26日，国务院新闻办公室举行“开局起步‘十五五’”系列主题新闻发布会，介绍全力抓好“十五五”规划实施，加快推进新型工业化有关情况。工业和信息化部副部长辛国斌表示，“十五五”时期，我们将加快发展先进制造业，保持制造业合理比重，进一步提升发展的质量和效益。要在拓展价值空间上下功夫，坚持以优争先，以智取胜，推进工艺技术攀升和产品质量跃升，加强优质品牌建设，要推动生产要素创新性配置，促进制造业向微笑曲线两端延伸，提高全要素生产率。（人民财讯）", "ctime": 1787711854, "time_str": "10:37:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260826/c679297137.shtml"}, {"id": "5029177", "title": "创业板指涨1% 贵金属、证券板块领涨市场", "content": "创业板指涨幅扩大至1%，上证指数涨0.73%，深证成指涨1.01%。全市场超3100家个股上涨。贵金属、证券板块领涨市场。", "ctime": 1787711808, "time_str": "10:36:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260826/c679297110.shtml"}, {"id": "5029173", "title": "科创50指数涨幅扩大至1%", "content": "科创50指数涨幅扩大至1%，现报1620.75点。", "ctime": 1787711758, "time_str": "10:35:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260826/c679297067.shtml"}, {"id": "5029171", "title": "工信部：将有序推动电信领域扩 // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
