G8.6高世代AMOLED量产在即，AMOLED产能过剩将导致部分应用量价双降，显示面板行业整体大盘面临下滑压力。CINNO Research预测，2026年全球面板总销售额约降至1167亿美元，同比下滑3.4%左右。", "ctime": 1780906520, "time_str": "16:15:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260608/c677293090.shtml"}, {"id": "4481111", "title": "湘佳股份：2026年5月份销售活禽收入7475.75万元，环比减少11.75%", "content": "湘佳股份公告，公司2026年5月份销售活禽366.35万只，销售收入7475.75万元，销售均价9.52元/公斤，环比变动分别为-9.18%、-11.75%、-1.06%，同比变动分别为-11.41%、2.60%、5.07%。", "ctime": 1780906329, "time_str": "16:12:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260608/c677293021.shtml"}, {"id": "4481089", "title": "WTI原油大涨5% 布伦特原油站上98美元/桶", "content": "WTI原油大涨5%，现报95.22美元/桶。布伦特原油站上98美元/桶，日内涨5.36%。", "ctime": 1780906245, "time_str": "16:10:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260608/c677292984.shtml"}, {"id": "4481079", "title": "港股收评：恒生指数跌1.22%，恒生科技指数跌2.71%", "content": "港股收盘，恒生指数跌1.22%，恒生科技指数跌2.71%。恒指港股通ETF银华（159318）跌1.63%，港股通科技ETF鹏华（159751）跌3.51%。板块方面，工业集团企业板块涨幅靠前；客运航空公司、金属与采矿板块跌幅靠前。个股方面，建滔集团涨15.08%，五一视界涨13.74%，天数智芯涨12.68%，埃斯顿涨12.33%，建滔积层板涨12.08%；精锋医疗-B跌16.61%，明略科技-W跌13.13%，群核科技跌12.21%，云知声跌10.84%，凯乐士科技跌10.24%。", "ctime": 1780906210, "time_str": "16:10:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260608/c677292970.shtml"}, {"id": "4481071", "title": "乘联分会：5月车市回暖仅为结构性修复，电动化迭代与海外出口已成为行业长期增长的核心支撑", "content": "乘联分会数据显示，5月1-31日，全国乘用车市场零售151万辆，同比下降22.1%，环比增长9.2%；今年以来累计零售709.9万辆，同比下降19.5%。当前车市存量竞争特征凸显，行业内部分化持续加剧。新能源市场告别全域增长，呈现“高端电动车爆发、低端经济型车型承压”的两极分化态势，县乡市场、入门级车型下滑过大。同时“新车效应”短期化，对市场拉动效力大幅减弱。渠道端压力持续凸显，行业被动去库存节奏加快，经销商普遍亏损、经营风险攀升。整体而言，5月车市回暖仅为结构性修复，电动化迭代与海外出口已成为行业长期增长的核心支撑。", "ctime": 1780906133, "time_str": "16:08:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260608/c677292702.shtml"}, {"id": "4481065", "title": "台积电美股盘前涨超2%", "content": "台积电美股盘前涨超2%，现报423.8美元。", "ctime": 1780906118, "time_str": "16:08:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260608/c677292644.shtml"}, {"id": "4481059", "title": "安凯客车：5月产量643辆，销量865辆", "content": "安凯客车公告，2026年5月产量643辆，销量865辆；本年累计产量3718辆，累计同比增13.53%；本年累计销量3406辆，累计同比增22.61%。分车型：大型客车5月产量273辆、销量302辆，中型客车产量288辆、销量499辆，轻型客车产量82辆、销量64辆。", "ctime": 1780906096, "time_str": "16:08:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260608/c677292550.shtml"}, {"id": "4481055", "title": "大秦铁路：5月货物运输量3885万吨，同比增长17.87%", "content": "大秦铁路公告，2026年5月大秦线完成货物运输量3885万吨，同比增长17.87%；日均运量125.32万吨，日均开行重车88.4列，其中日均开行2万吨列车63.5列；2026年1-5月累计完成货物运输量1.67亿吨，同比增长6.76%。", "ctime": 1780906053, "time_str": "16:07:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260608/c677292373.shtml"}, {"id": "4481045", "title": "迈威尔科技盘前涨6.96%，现报281.81美元", "content": "迈威尔科技盘前涨6.96%，现报281.81美元。消息面上，迈威尔科技将被纳入标普500指数（6月22日开盘前生效）。", "ctime": 1780905977, "time_str": "16:06:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260608/c677292055.shtml"}, {"id": "4481037", "title": "美光科技美股盘前涨超4%", "content": "美光科技美股盘前涨超4%，现报898.9美元。", "ctime": 1780905910, "time_str": "16:05:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260608/c677291787.shtml"}, {"id": "4481031", "title": "市场监管总局约谈美宜佳总部", "content": "针对一段时期以来监管发现和媒体曝光的美宜佳多个门店销售过期食品等食品安全问题，近日，市场监管总局依法对美宜佳控股有限公司（即美宜佳总部）负责人进行了责任约谈，要求其严格遵守《中华人民共和国食品安全法》以及《食品销售连锁企业落实食品安全主体责任监督管理规定》等法律法规，建立健全覆盖总部、分支机构、门店等经营管理各层级、经营活动全链条的风险管控制度机制和食品安全追溯体系，全面落实食品安全主体责任，切实保障公众饮食安全，保护消费者合法权益。(新华社)", "ctime": 1780905892, "time_str": "16:04:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260608/c677291761.shtml"}, {"id": "4480997", "title": "伊朗革命卫队：已对以色列袭击伊石化企业行为作出回应", "content": "当地时间8日，伊朗伊斯兰革命卫队公共关系部宣布，针对敌人对伊朗某石化企业的侵略，革命卫队稍早前对以色列海法的类似企业发动了导弹袭击。卫队警告称，以色列通过袭击民用目标和石油工业目标，开启了一场“危险的行动”，伊朗打击范围将涵盖该地区所有能源目标，而其对全球经济造成的后果，应由美国承担。当地时间8日上午，伊朗胡齐斯坦省安全官员表示，该省的卡伦·马赫沙赫尔石化公司遭到以军袭击，部分设施受损。（央视新闻）", "ctime": 1780905783, "time_str": "16:03:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260608/c677291510.shtml"}, {"id": "4480975", "title": "全球70%PPE树脂供应中断 印刷电路板价格大涨", "content": "中东冲突带来的影响，正从能源市场进一步蔓延到电子产品供应链。记者了解到，沙特的朱拜勒工业区此前供应了全球大约70%的PPE树脂。但是，早在今年3月底，由于霍尔木兹海峡航运受阻，相关工厂就已经停产。树脂是制造印刷电路板的重要材料，其中，PPE树脂主要用于高端产品。要知道，印刷电路板相当于电子设备的“神经系统”。从智能手机、笔记本电脑，到路由器、人工智能服务器，几乎所有现代电子产品都离不开它。专家表示，如果树脂供应中断持续到今年秋天，消费者将切实感受到涨价的压力。近期，高盛的一份报告显示，仅在4月份，印刷电路板的价格较3月份最高上涨了40%。美国印刷电路板制造商迅达科技的股价在过去一年上涨超过400%。 (央视财经)", "ctime": 1780905722, "time_str": "16:02:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260608/c677291274.shtml"}, {"id": "4480971", "title": "美股中概股盘前涨跌互现，盛美涨21%", "content": "美股中概股盘前涨跌互现，盛美涨21%，哔哩哔哩涨4%，理想汽车涨3%，蔚来涨2%，网易涨0.6%，拼多多、贝壳跌1%，百度跌2%。", "ctime": 1780905682, "time_str": "16:01:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260608/c677291092.shtml"}, {"id": "4480969", "title": "美股大型科技股盘前多数上涨，英伟达涨1%", "content": "美股大型科技股盘前多数上涨，英伟达涨1%，特斯拉涨0.8%，亚马逊涨0.7%，苹果涨0.4%，Meta涨0.3%，微软跌0.1%，谷歌A跌0.6%。", "ctime": 1780905675, "time_str": "16:01:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260608/c677291066.shtml"}, {"id": "4480967", " 当前中印边境的局势总体稳定，双方沟通的渠道畅通。中印都应坚持两国是合作伙伴，而不是竞争对手；互为发展机遇，而不是威胁这一正确的战略认知。从战略高度和长远角度看待和处理中印关系，增进互信，拓展合作，妥善处理分歧，推动中印关系沿着健康稳定的轨道向前发展。\n\n“对于印巴关系，中方已多次阐明了立场，我们支持双方通过对话协商妥善处理分歧，共同致力于地区的和平与稳定。”林剑说。(环球网)", "ctime": 1780905057, "time_str": "15:50:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260608/c677290559.shtml"}, {"id": "4480879", "title": "一站通办，第四届链博会首票进境展品顺利通关", "content": "今天（6月8日），第四届中国国际供应链促进博览会完成展会备案，首票进境展品已顺利通关。第四届链博会首票展品是来自法国空客公司的两架1:20的飞机模型和公司宣传资料，通过“一体化通关”和“ATA单证册”（暂准进口货物免税通关证）两种方式同步办理了通关手续，海关一窗受理，一站通办，货物实现“快速通关、即刻放行”。（央视新闻）", "ctime": 1780904995, "time_str": "15:49:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260608/c677290529.shtml"}, {"id": "4480877", "title": "LG公司与英伟达将合作开发下一代机器人基础模型GR00T", "content": "LG公司与英伟达将合作开发下一代机器人基础模型GR00T。（财联社）", "ctime": 1780904989, "time_str": "15:49:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260608/c677290525.shtml"}, {"id": "4480853", "title": "张雪发声：支持凯越维护自身权益", "content": "近日，有网传消息称“凯越撑不住了多次求张雪救命”、“凯越最大的败笔，不是没留住张雪，而是连他36%的股份都吞完”。6月8日，张雪发布视频就相关传言进行澄清，“凯越没有找过我，据我所知凯越目前的经营状态没有问题”。凯越机车6月6日曾发布声明称，近期有别有用心者编造并传播“凯越机车资金链断裂即将破产”、“凯越撑不住了多次求张雪救命”、“凯越销量跌三成，严凯急了找张雪”、“凯越最大的败笔，不是没留住张雪，而是连他36%的股份都吞完”等虚假信息。相关传言均为无中生有、蓄意捏造，纯属恶意抹黑。（界面新闻）", "ctime": 1780904701, "time_str": "15:45:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260608/c677290341.shtml"}, {"id": "4480851", "title": "小米机器人亮相小米17T系列发布会，可操作手机拍照", "content": "6月8日下午消息，在今日的小米17T系列新品发布会上，小米17T和小米17T Pro正式发布，售价分别2999元起和3999元起。据悉，小米T系列此前主攻海外市场，历经七代产品积累超1500万用户，此次17T系列首次回归国内，定位“双尺寸全能影像旗舰”。值得注意的是，在发布会上，小米机器人作为彩蛋环节简短亮相，演示了操作手机拍照的场景。日前，雷军在微博上也透露了小米机器人的最新动态。他表示，小米机器人团队在最近两大国际赛事中拿下双料冠军，而且，大幅领先第二名。他透露，小米机器人的努力方向，就是让机器人真正走进物理世界，干实际的活。（新浪科技）", "ctime": 17809 // 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
