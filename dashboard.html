<style>
:root {

* { margin:0; padding:0; box-sizing:border-box; }
body {

  background: var(--bg-primary);
  color: var(--text-primary);

.mono { font-family: 'JetBrains Mono', monospace; }
.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 20px;
  transition: all 0.2s;
}
.card:hover { background: var(--bg-card-hover); border-color: #334155; }
.badge {
  display: inline-flex; align-items: center; padding: 2px 8px;
  border-radius: 6px; font-size: 12px; font-weight: 500;
}
.badge-s { background: rgba(239,68,68,0.2); color: #ef4444; }
.badge-a { background: rgba(245,158,11,0.2); color: #f59e0b; }
.badge-b { background: rgba(59,130,246,0.2); color: #3b82f6; }
.badge-c { background: rgba(100,116,139,0.2); color: #94a3b8; }
.score-bar {
  height: 6px; border-radius: 3px; background: #1e293b; overflow: hidden;
}
.score-bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s; }
.up { color: var(--red); }
.down { color: var(--green); }
.pulse { animation: pulse 2s infinite; }
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}
.glow { box-shadow: 0 0 20px rgba(59,130,246,0.15); }

</style>

"卓创资讯：黄金4月以来行情下跌，长线上方仍有空间", "content": "4月以来黄金振幅收窄，重心窄幅下移，近期有所回升。截至5月7日，国内现货99.99%黄金报1034.8元/克，相较4月初下跌0.82%。主要逻辑为美伊事件的边际影响，霍尔木兹海峡持续关闭，市场担忧油价高企引发的通胀风险，进而压制了对于后市推进降息的预期。此外沃什在参议院银行委员会的上任听证会上，对前期的降息承诺态度表现相对模糊，也形成了一定利空。但近期美伊释放和谈信号，驱动了市场情绪的修复。后市来看，中东事件是否彻底解决仍然是左右黄金走势的重要因子，关注美伊谈判进展以及今晚公布的美国4月份非农就业报告，长期来看，由于黄金作为天然货币具备抗通胀属性，以及美元类资产的信用性下滑，黄金仍有抬升空间。（卓创资讯）", "ctime": 1778217909, "time_str": "13:25:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260508/c676536368.shtml"}, {"id": "4338285", "title": "英海事分析公司：霍尔木兹海峡“暗航”船只激增", "content": "总部位于英国的海事分析公司温沃德7日发布报告说，霍尔木兹海峡附近水域安全形势持续紧张，大量商业船只因担忧军事冲突、电子干扰及遭锁定风险，选择关闭船舶自动识别系统，转入“暗航”状态。\n\n报告说，4月19日至5月3日期间，霍尔木兹海峡及周边水域“暗船”活动激增近600%。5月5日，卫星识别到海峡区域有167艘商业规模船舶，其中146艘关闭了船舶自动识别系统。(新华社)", "ctime": 1778217840, "time_str": "13:24:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260508/c676536359.shtml"}, {"id": "4338247", "title": "半导体材料板块短线拉升，立昂微涨停", "content": "半导体材料板块短线拉升，立昂微涨停，西安奕材涨超10%，有研硅、上海合晶、凯德石英、创达新材、至正股份等跟涨。", "ctime": 1778217306, "time_str": "13:15:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260508/c676536262.shtml"}, {"id": "4338233", "title": "江苏设立100亿元增资扩产战新产业基金", "content": "江苏省增资扩产战新产业基金在苏州工业园区正式揭牌成立。该基金规模100亿元，由省战新母基金与13个设区市共同出资设立，江苏高科技投资集团与苏创投、元禾控股共同作为普通合伙人，高投管理担任基金管理人及执行事务合伙人，重点围绕战略性新兴产业、未来产业和重点产业链关键环节开展投资。（21世纪经济报道）", "ctime": 1778217031, "time_str": "13:10:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260508/c676536240.shtml"}, {"id": "4338231", "title": "光纤概念股午后再度拉升，昀冢科技20cm涨停", "content": "光纤概念股午后再度拉升，昀冢科技20cm涨停，通鼎互联此前封板，长光华芯涨超10%，烽火通信、杭电股份涨幅居前。", "ctime": 1778217018, "time_str": "13:10:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": are": false, "source": "", "url": "https://news.10jqka.com.cn/20260508/c676535898.shtml"}, {"id": "4338067", "title": "德财长说美发动的“不负责任战争”冲击德经济", "content": "德国财政部长拉尔斯·克林拜尔7日说，美国政府对伊朗发动的“不负责任的战争”导致能源价格飙升，令德国经济和公共财政遭受重大打击。 克林拜尔当天接受多家媒体采访时说，中东战事导致德国税收收入预期下调，进而拖累经济增长。他援引一项数据说，由于当前中东紧张局势加剧能源价格上涨，今后经济放缓的可能性上升，导致德国未来五年税收预期下调约875亿欧元。 克林拜尔说，数据体现了德国目前面临的“严重不确定性”，凸显持续加强危机管理的重要性。他表示，德国需聚焦投资与改革以增强经济韧性，减轻外部风险可能带来的冲击。 德国总理默茨此前表示，美国在没有制定任何战略的情况下对伊朗发起军事行动，导致进退两难，正遭遇伊朗方面的“羞辱”。美国总统特朗普对默茨的言论表达不满。特朗普称，默茨“根本不知道自己在说什么”，德国现在“无论是在经济还是其他方面都表现得如此糟糕”。(新华社)", "ctime": 1778215457, "time_str": "12:44:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260508/c676535890.shtml"}, {"id": "4338055", "title": "伊朗发生4.5级地震", "content": "伊朗国家地震中心发布消息称，当地时间5月8日7时17分许，伊朗东阿塞拜疆省和西阿塞拜疆省交界处发生4.5级地震，目前尚未有人员财产伤亡或受损的相关报告。（央视新闻）", "ctime": 1778215184, "time_str": "12:39:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260508/c676535856.shtml"}, {"id": "4338053", "title": "美法院裁决特朗普政府全球进口关税缺乏法律依据", "content": "美国国际贸易法院7日公布裁决，认定特朗普政府征收10%全球进口关税的法律依据不成立，白宫此前发布的公告无效。 美国24个州政府和两家美国企业先后在3月5日和9日就特朗普政府加征的全球进口关税提起诉讼，美国国际贸易法院对这两起相关案件进行合并审理，并于4月10日进行口头辩论。美国国际贸易法院法官7日以多数通过的裁决结果永久禁止美国联邦政府依据《1974年贸易法》第122条对两家美国进口企业和华盛顿州政府加征10%的进口关税。由于原告中美国其他20多个州政府没有提交有力证据证明全球进口关税对其带来伤害，法院认定这些州没有诉讼资格，相关诉讼请求不予考虑。 目前，尚不清楚联邦政府是否会就这一裁决提起上诉。 2月20日，美国总统特朗普宣布，依据《1974年贸易法》第122条，“对所有国家征收10%的全球关税”，为期150天，以取代被美国最高法院认定违法的关税。同一天，美国最高法院公布裁决，认定美国《国际紧急经济权力法》没有授权总统征收大规模关税。 公开信息显示，美国海关从2月24日开始征收全球关税，预计持续到7月24日。(新华社)", "ctime": 1778215179, "time_str": "12:39:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260508/c676535855.shtml"}, {"id": "4338049", "title": "月壤研究有了新发现 碳质小行星撞击地月系统时间晚于预期", "content": "从中国科学院地质与地球物理研究所获悉，该所林杨挺研究员团队通过分析嫦娥六号带回的月壤样品，揭示了太阳系中小行星撞击地月系统的历史变化，尤其是碳质小行星的撞击规律。研究显示，碳质小行星撞击地月系统时间晚于预期。 (央视新闻)", "ctime": 1778215061, "time_str": "12:37:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260508/c676535835.shtml"}, {"id": "4338043", "title": "首创Token集约化运营模式，中国移动发布移动模型服务平台MoMA", "content": "5月8日，在2026移动云大会主论坛上，中国移动发布移动模型服务平台MoMA。平台接入超300款业界主流AI模型，模型丰富度行业领先，首创Token集约化运营模式，推动AI像水和电一样“随时可得、随处可用”。据悉，中国移动将不断提升移动模型服务平台MoMA服务质效，携手产业伙伴，共同释放算力新动能、拓展智能新空间，推动人工智能更加广泛、高效、安全地服务经济社会发展。（人民邮电报）", "ctime": 1778214867, "time_str": "12:34:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260508/c676535769.shtml"}, {"id": "4338039", "title": "以军提升警戒状态应对黎巴嫩真主党报复性攻击", "content": "有消息人士透露，以色列国防军在黎巴嫩境内以及黎以临时边界的部队已进入最高级别警戒状态。消息人士表示，此举是针对黎巴嫩真主党在其精锐部队拉德万部队指挥官被打死后的报复性攻击做准备。（央视新闻）", "ctime": 1778214716, "time_str": "12:31:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260508/c676535727.shtml"}, {"id": "4338033", "title": "新紫光前沿技术研究院发布“紫弦”三维近存架构", "content": "2026新紫光集团创新峰会上，新紫光前沿技术研究院发布“紫弦”三维化近存计算架构，以3D DRAM为核心，首创3.5D异质异构集成方案，存储带宽可达30TB/s，基于国内领先供应链可规模化量产。PNM近存计算模式下访存延迟最大降低18倍，模拟仿真显示同等算力下token吞吐率较英伟达B200系列高出1.5至2倍以上。（科创板日报）", "ctime": 1778214659, "time_str": "12:30:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260508/c676535719.shtml"}, {"id": "4338027", "title": "2025年我国自行车全行业总产量超1.1亿辆", "content": "2025年，我国自行车全行业总产量为1.11亿辆，同比增长11.3%，全年生产实现平稳增长。 这是记者8日从2026中国国际自行车展览会上了解到的消息。本届展览会在上海举办，紧扣全球自行车产业绿色、智能、高端发展趋势，集中展现我国自行车新产品和产业发展新趋势。 中国自行车协会副理事长兼秘书长郭文玉介绍，2025年，我国自行车全行业规模以上企业实现营业收入同比增长9%，利润实现大幅提升。 出口方面，2025年，我国自行车出口4893.9万辆，同比增长2.4%，行业出口保持平稳增长；自行车零部件出口额36.32亿美元，同比增长10.6%，零部件出口表现突出。 “自行车场景消费拓展新边界，多元场景激活细分需求。”郭文玉说，2025年，我国举办自行车赛事101场，较2024年增长23%，参与竞赛人数突破百万人；我国业余骑行俱乐部数量突破8万家，骑行装备市场快速扩容。全国共享单车日均骑行量达1.2亿次，作为城市交通的补充，更好满足城市通勤、短途出行等需求。折叠自行车、亲子骑行车等品类精准对接家庭出行与休闲健身需求，满足了消费者日益多元化的生活方式。 2025年，电动自行车以旧换新政策与新国标落地实施。(新华社)", "ctime": 1778214548, "time_str": "12:29:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260508/c676535699.shtml"}, {"id": "4338025", "title": "一季度成都航空口岸进出口总值超1800亿元 创历史同期新高", "content": "5月8日，记者从成都海关了解到，今年一季度，成都航空口岸进出口总值达1847.9亿元，同比增长9.6%，规模创历史同期新高。（成都商报）", "ctime": 1778214455, "time_str": "12:27:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260508/c676535683.shtml"}, {"id": "4338023", "title": "印尼杜科诺火山喷发 已致2人死亡1人失踪", "content": "据印尼警方消息，5月8日北马鲁古省杜科诺火山喷发已致2人死亡，1人失踪。该火山喷发后，灰柱高度约10公里。此前，救援部门称有5名登山者受伤，相关机构建议公众不要在火山口半径4公里范围内活动。（央视新闻）", "ctime": 1778214309, "time_str": "12:25:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260508/c676535660.shtml"}, {"id": "4338021", "title": "伊朗公布向美驱逐舰发射导弹视频", "content": "伊朗伊斯兰革命卫队今天（5月8日）发布视频，据称为伊朗向试图通过霍尔木兹海峡的美军驱逐舰发射导弹。当地时间5月7日晚至今天凌晨，伊朗南部波斯湾沿岸多地传出爆炸声。伊朗武装部队哈塔姆·安比亚中央司令部发言人表示，由于美国违反停火协议，袭击伊朗油轮和另一艘进入霍尔木兹海峡的船只，伊朗武装力量打击了霍尔木兹海峡以东的美国军舰。美军中央司令部证实美驱逐舰遭袭，并称进行了回击，但美方无意寻求局势升级。(CCTV国际时讯)", "ctime": 1778214255, "time_str": "12:24:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260508/c676535650.shtml"}, {"id": "4338019", "title": "2026年北京香山论坛先导会在京开幕", "content": "2026年北京香山论坛先导会8日在北京开幕。 本次先导会由中国军事科学学会和中国国际战略学会共同主办，以“全球安全治理：挑战与出路”为主题，邀请了40余个国家和国际组织的120余名官方代表、专家学者参会。 会议期间，与会代表将围绕“国际秩序与国际法治”“亚太安全新挑战”“维护国际共同安全的责任”及“新兴技术军事应用的风险管控”等重要议题展开研讨。今年正值北京香山论坛创立20周年，本次先导会还将举办“国际论坛在全球安全治理中的作用——北京香山论坛20周年纪念特别专题交流”活动，邀请全球知名防务与安全智库代表，共同回顾北京香山论坛二十载历程，探讨国际安全论坛在平等对话、凝聚共识、化解分歧等方面的独特价值。(新华社)", "ctime": 1778214076, "time_str": "12:21:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260508/c676535613.shtml"}, {"id": "4338009", "title": "百联股份成立奥特莱斯商业管理公司", "content": "企查查APP显示，近日，上海百联奥特莱斯商业管理有限公司成立，法定代表人为曹海伦，注册资本为2000万元，经营范围包含：商业综合体管理服务；工程管理服务；停车场服务；咨询策划服务；企业管理咨询；市场营销策划等。企查查股权穿透显示，该公司由百联股份全资持股。（人民财讯）", "ctime": 1778213587, "time_str": "12:13:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260508/c676535432.shtml"}, {"id": "4338005", "title": "港股午评：恒生指数跌1.09%，恒生科技指数跌1.07%", "content": "港股午间收盘，恒生指数跌1.09%，恒生科技指数跌1.07%。恒指港股通ETF银华（159318）跌1.24%，港股通科技ETF鹏华（159751）跌1.65%。板块方面，医疗保健技术、通信设备板块涨幅靠前；半导体产品与设备、电气设备板块跌幅靠前。个股方面，海致科技集团涨18.66%，药捷安康-B涨18.55%，美图公司涨12.5%，FORTIOR涨10.79%，怡俊集团控股涨9.45%；华虹半导体跌9.76%，创新实业跌7.36%，龙蟠科技跌7.24%，MINIMAX-W跌7.13%，东方电气跌7.08%。", "ctime": 1778213561, "time_str": "12:12:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260508/c676535425.shtml"}, {"id": "4337999", "title": "湖南浏阳烟花厂爆炸事故已致37人死亡", "content": "5月4日下午，浏阳市华盛烟花制造燃放有限公司发生爆炸。截至5月8日，事故已致37人死亡。（央视新闻）", "ctime": 1778213472, "time_str": "12:11:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260508/c676535410.shtml"}, {"id": "4337997", "title": "古巴政府：美国新一轮制裁措施是“经济侵略”", "content": "古巴外交部7日发布公告说，美国对古巴新一轮制裁措施是“经济侵略”行为，企图制造所谓“人道主义危机”，以此为借口采取更危险的行动，包括对古巴发动军事侵略。 公告表示，美方7日公布的新一轮制裁措施旨在进一步扩大美国封锁政策的域外效力，并可能对外国企业、银行及其他实体实施“次级制裁”，进一步阻碍古巴经济运行。 公告说，美国一向以“世界宪兵”自居，公然违反国际法和自由贸易原则，企图通过胁迫和恐吓迫使国际社会服从并执行对古封锁。美国正试图将古巴进一步孤立于国际经济和金融体系之外。古巴将继续在所有国际场合谴责美国封锁政策，呼吁国际社会共同抵制这一打压行动。 美国财政部和国务院7日在官网上公布针对古巴的新一轮制裁措施。美国财政部外国资产控制办公室发布公告，把来自古巴的多名个人和实体列入“特别指定国民清单”。美国务院也发布公告，将古巴企业管理集团公司、莫阿镍厂以及相关企业高管列入制裁名单。(新华社)", "ctime": 1778213459, "time_str": "12:10:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260508/c676535408.shtml"}, {"id": "4337985", "title": "消息人士称预计伊官员今日正式回应美对14点提议的评估反馈", "content": "总台记者当地时间5月8日获悉，据巴基斯坦方面消息，伊朗正在审查美国对14点提议的回应。14点提议旨在正式结束敌对行动，并开启为期30天的谈判窗口，就伊朗核计划、解除制裁以及霍尔木兹海峡安全通行等问题进行详细讨论。巴基斯坦外交消息人士称，预计伊朗官员将于5月8日正式作出回应，美国方面正在等待伊朗在关键问题上的立场。伊朗日前通过斡旋方巴基斯坦向美方提交了一份包含14点提议的新方案，主要内容包括确保不再发生军事侵略、美军支付赔偿、建立霍尔木兹海峡新的管理机制等。特朗普5月2日表示，他将很快评估伊朗的新方案，但“无法想象”该方案“可以接受”。（央视新闻）", "ctime": 1778213192, "time_str": "12:06:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260508/c676535320.shtml"}, {"id": "4337979", "title": "伊朗外长赞赏巴基斯坦对伊外交和人道支持", "content": "巴基斯坦外交部7日发表声明说，巴基斯坦副总理兼外交部长达尔当天与伊朗外交部长阿拉格齐通电话，双方就近期地区动态以及旨在促进和平与稳定的持续外交努力交换意见。阿拉格齐向达尔简要通报近期伊方外交成果，感谢巴方促成美国释放被扣押船只上的伊朗公民，赞赏巴方持续给予的外交和人道主义支持。(新华社)", "ctime": 1778213061, "time_str": "12:04:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260508/c676535278.shtml"}, {"id": "4337933", "title": "建设两岸融合发展示范区部省际工作会议在京举行", "content": "中共中央台办、国家发展改革委、福建省会同48个中央和国家机关有关部门，8日在北京召开建设两岸融合发展示范区部省际工作会议。会议总结了《中共中央 国务院关于支持福建探索海峡两岸融合发展新路建设两岸融合发展示范区的意见》贯彻落实情况，研究下步重点工作，支持福建在探索海峡两岸融合发展新路上迈出更大步伐，高质量建设两岸融合发展示范区。（央视新闻）", "ctime": 1778212676, "time_str": "11:57:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260508/c676535105.shtml"}, {"id": "4337923", "title": "恺英网络旗下公司与中手游达成战略合作 推出智能体GamePartner.AI", "content": "2026年5月8日，恺英网络旗下杭州极逸人工智能科技有限公司（简称“极逸人工智能”）与中手游共同宣布，双方达成深度战略合作，推出面向全球游戏市场，由AI驱动的市场洞察、游戏开发到全球发行的一站式智能体——GamePartner.AI（简称“GPA”），助力并构建中国游戏开发者出海生态。该平台由极逸人工智能提供核心AI游戏开发技术支持，中手游负责全球推广与运营。（人民财讯）", "ctime": 1778212404, "time_str": "11:53:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260508/c676535035.shtml"}, {"id": "4337917", "title": "中证协启动2026年券商做好金融“五篇大文章”试评价，普惠与养老指标进一步细化", "content": "中国证券业协会日前正式启动2026年证券公司做好金融“五篇大文章”试评价工作。梳理发现，此次试评价“普惠金融”大类指标下增设“服务居民财富管理”指标，明确将券商服务居民财富管理及中长期资金入市的衍生品交易业务规模纳入统计。与此同时，“养老金融”大类指标下的“服务居民养老”指标统计口径也进一步细化。除了细化指标外，此次试 // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
