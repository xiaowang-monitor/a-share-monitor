.badge {

}
.score-bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s; }
.up { color: var(--red); }
.down { color: var(--green); }
.pulse { animation: pulse 2s infinite; }
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}
.glow { box-shadow: 0 0 20px rgba(59,130,246,0.15); }

str": "19:00:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260611/c677396012.shtml"}, {"id": "4512489", "title": "浙农股份：首次回购0.36%公司股份", "content": "浙农股份公告，2026年6月11日，公司通过股份回购专用证券账户以集中竞价交易方式首次回购公司股份186.5万股，约占公司总股本的0.36%。此次回购股份最高成交价为7.96元/股，最低成交价为7.77元/股，成交总金额为1469.77万元（不含交易费用）。", "ctime": 1781175454, "time_str": "18:57:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260611/c677395940.shtml"}, {"id": "4512483", "title": "欧福蛋业：控股股东、股东刘文、高管叶林、韩太鑫拟分别减持0.50%、1.31%、0.11%、0.07%", "content": "欧福蛋业公告，控股股东CHINA EGG PRODUCTS ApS拟于公告15日后3个月内以集中竞价或大宗交易减持不高于102.72万股，占0.50%；持股5%以上股东刘文拟公告30日后3个月内减持不高于268.97万股，占1.31%；高管叶林、韩太鑫拟公告15日后3个月内分别减持不高于21.79万股、14.53万股，占0.11%、0.07%。相关股份均为上市前取得，减持原因为资金需求。", "ctime": 1781175294, "time_str": "18:54:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260611/c677395889.shtml"}, {"id": "4512481", "title": "百利天恒：获交易商协会同意注册发行60亿元科技创新债券", "content": "百利天恒公告，近日收到中国银行间市场交易商协会出具的《接受注册通知书》，同意公司注册发行总额为60亿元的中期票据，注册额度自《接受注册通知书》落款之日起2年内有效。公司将根据要求以及市场情况适时安排中期票据的发行，并履行信息披露义务。", "ctime": 1781175286, "time_str": "18:54:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260611/c677395887.shtml"}, {"id": "4512459", "title": "安路科技：国家集成电路产业投资基金股份有限公司已减持1.84%股份", "content": "安路科技公告，公司股东国家集成电路产业投资基金股份有限公司通过集中竞价交易方式减持公司股份400.85万股，通过大宗交易方式减持338.21万股，合计减持739.06万股，占公司总股本的1.84%。本次减持计划时间区间已届满。", "ctime": 1781175114, "time_str": "18:51:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260611/c677395839.shtml"}, {"id": "4512457", "title": "宏利基金督察长离任 总经理代任督察长", "content": "宏利基金今日发布高管变更公告，督察长徐娇因个人原因离职，离任日期为6月10日，总经理DING WEN CONG（丁闻聪）代任督察长。DING WEN CONG（丁闻聪）于2010年加入宏利金融，曾任集团战略企划部总监、宏利大中华区业务发展助理副总裁、宏利亚洲养老金业务战略及业务开发董事总经理等职位，2024年 8月起加入宏利基金担任公司总经理（法定代表人）、财务负责人。（财联社）", "ctime": 1781175111, "time_str": "18:51:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260611/c677395837.shtml"}, {"id": "4512455", "title": "俄称扎波罗热卫星城再遭袭 已致2死7伤", "content": "俄罗斯方面任命的扎波罗热地区行政长官巴利茨基6月11日通报，过去一天，乌军对该地区的袭击造成2人死亡、7人受伤，其中一名伤者为青少年。据他介绍，扎波罗热核电站附近的埃涅尔戈达尔市是乌军重点袭击目标，当地一所中学所在区域被击中，但未造成人员伤亡。乌克兰方面对此暂无回应。（央视新闻）", "ctime": 1781175102, "time_str": "18:51:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260611/c677395835.shtml"}, {"id": "4512413", "title": "泄露超3000万用户数据 韩国电商酷澎被罚4亿美元", "content": "韩国个人信息保护委员会11日通报，因电商巨头酷澎公司大规模泄露用户数据、违规采集用户网络活动记录等，决定对其处以合计约6247亿韩元（约合4.08亿美元）罚款。这是该机构就数据泄露事件对单一企业开出的最高罚单。（新华社）", "ctime": 1781174809, "time_str": "18:46:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260611/c677395740.shtml"}, {"id": "4512393", "title": "京东方Ａ：被美国国防部列入“中国军事企业清单”并无正当理由", "content": "京东方Ａ公告，公司关注到美国国防部于当地时间 2026 年 6 月 8 日发布“中国军事企业清单”，其中包括京东方。京东方持续致力于产品和技术创新，目前产品和技术广泛应用于手机、平板、笔记本、显示器、电视等消费电子领域。京东方既不是中国军事企业，也不是中国国防工业的军民融合企业，将公司列入该名单并无正当理由。根据美国相关法律规则，“中国军事企业清单”的限制措施与美国国防采购事宜相关，并不禁止其他任何人与本公司进行业务往来。目前公司生产经营情况正常，各项业务稳步推进。公司将持续跟进上述事项的进展情况，积极与相关方沟通，坚决维护公司、全体股东及所有合作伙伴的合法权益，并根据有关规定及时履行信息披露义务。", "ctime": 1781174695, "time_str": "18:44:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260611/c677395715.shtml"}, {"id": "4512383", "title": "巴林称有36架无人机袭击了其领土", "content": "俄罗斯方面11日消息，俄外长拉夫罗夫与巴林外交大臣扎耶尼会晤，双方讨论霍尔木兹海峡局势以及双边合作等议题。据悉，扎耶尼在会晤中透露，当天早晨有36架无人机袭击了巴林领土。巴林外交部随后证实了此消息。伊朗军队当地时间11日凌晨3时40分发表声明称，在美军袭击伊朗南部后，伊朗军队对美军位于巴林的第五舰队发动了无人机袭击。（央视新闻）", "ctime": 1781174551, "time_str": "18:42:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260611/c677395657.shtml"}, {"id": "4512381", "title": "沪深交易所公布2026年端午节休市安排", "content": "6月11日，上海证券交易所、深圳证券交易所公布端午节休市安排：6月19日（星期五）至6月21日（星期日）休市，6月22日（星期一）起照常开市。节假日期间清算交收事宜，按照中国证券登记结算有限责任公司的有关安排进行。", "ctime": 1781174547, "time_str": "18:42:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260611/c677395650.shtml"}, {"id": "4512379", "title": "苏州市委书记范波会见欧莱雅集团高管", "content": "据“苏州发布”，今年是欧莱雅集团落户苏州30年。6月11日，苏州市委书记范波会见了欧莱雅集团首席运营官安拓伟、欧莱雅集团北亚总裁及中国首席执行官博万尚一行，共同出席欧莱雅苏州工厂成立30周年纪念活动，并考察欧莱雅苏州工厂。范波说，希望欧莱雅持续投资苏州，导入更多优质项目，深化产业创新协同，践行绿色发展理念，共同谱写下一个30年精彩合作篇章。", "ctime": 1781174520, "time_str": "18:42:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260611/c677395630.shtml"}, {"id": "4512367", "title": "存储巨头长鑫科技出手做LP，半导体产业资本加速布局", "content": "日前，长智瀚海（上海）私募投资基金合伙企业（有限合伙）成立，出资额39.1亿元，经营范围包含以私募基金从事股权投资、投资管理、资产管理等活动。值得关注的是，在这只基金的LP名单中，出现了国产DRAM存储芯片龙头——长鑫科技的身影。该公司目前正处于冲刺科创板IPO的关键阶段，有望缔造今年A股最大IPO。该基金的出资阵容可谓豪华。天眼查显示，长鑫芯聚股权投资（安徽）有限公司以11.73亿元的出资额位列第一大出资方。长鑫芯聚成立于2022年，由长鑫科技100%全资控股，定位为半导体产业链投资平台，重点聚焦存储芯片、集成电路等领域。目前，长鑫科技正处于科创板IPO过会后的冲刺阶段，此次以LP身份深度参与新基金，显示出其从产业龙头向产业资本延伸的战略路径。（每经网）", "ctime": 1781174405, "time_str": "18:40:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260611/c677395566.shtml"}, {"id": "4512339", "title": "三星办公室因涉嫌内幕交易遭到突击搜查", "content": "三星办公室因涉嫌内幕交易遭到突击搜查。(财联社)", "ctime": 1781174204, "time_str": "18:36:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260611/c677395467.shtml"}, {"id": "4512337", "title": "*ST华闻：以现有总股本19.97亿股为基数，按每10股转增12股比例转增股本", "content": "*ST华闻公告，根据海南省海口市中级人民法院裁定批准的《华闻传媒投资集团股份有限公司重整计划》，公司以现有总股本19.97亿股为基数，按每10股转增12股比例实施资本公积金转增股本，共计转增23.97亿股，转增后总股本增至43.94亿股。股权登记日为2026年6月18日，转增股本上市日为2026年6月22日。因业务办理需要，公司拟向深圳证券交易所申请于2026年6月18日公司股票停牌1个交易日，并于2026年6月22日复牌。", "ctime": 1781174196, "time_str": "18:36:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260611/c677395465.shtml"}, {"id": "4512285", "title": "富春染织：2025年度现金分红总额调整为2456.15万元", "content": "富春染织公告，公司2025年度利润分配方案调整，拟每10股派发现金红利1.04元（含税），现金分红总额由1996.91万元调整为2456.15万元。调整原因为“富春转债”转股导致公司实际参与利润分配的股份总数变动。", "ctime": 1781173952, "time_str": "18:32:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260611/c677395375.shtml"}, {"id": "4512281", "title": "昀冢科技：MLCC业务尚处于亏损状态", "content": "昀冢科技公告，公司股票价格于2026年4月12日至2026年6月11日期间累计上涨幅度为254.83%，公司股价显著偏离大盘指数，短期波动幅度较大，已明显偏离市场走势，存在较高的炒作风险。截至2026年6月11日收盘，公司所处的“C39计算机、通信和其他电子设备制造业”最新滚动市盈率为62.23倍。公司2025年度归属于上市公司股东的净利润为负，因此无市盈率倍数，公司存在估值较高的风险，存在市场情绪过热及非理性炒作情形，可能存在较大回调风险。公司经营业绩受宏观经济、下游市场发展态势、公司产品竞争力、客户认可程度等多种因素影响，具有一定的不确定性。公司MLCC业务具有前期资金投入大、投资周期长等特点，尚处于亏损状态。如果未来行业竞争加剧、行业技术发展趋势发生难以预见的变化、下游行业需求发生重大变化，存在项目效益不及预期的风险。目前公司MLCC产品，主要应用于消费电子领域，暂未应用于AI算力服务器。", "ctime": 1781173940, "time_str": "18:32:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260611/c677395367.shtml"}, {"id": "4512203", "title": "呼伦贝尔端午机票预订量大涨100%", "content": "据央视财经，端午假期临近，机票预订量持续增长，龙舟赛、龙舟宴等民俗活动，吸引大量旅客前去打卡。航旅纵横大数据显示，截至6月10日，端午假期国内航线机票预订量超183万张；出入境航线机票预订量超58万张，同比增长约8%。北京、上海、广州、成都等地依旧是出行的热门目的地。其中广州、深圳在节日期间举办龙舟赛、龙舟宴等传统民俗活动，浓厚的端午氛围吸引大量旅客专程打卡，机票预订量同比增长均超10%。此外，这个端午假期，“草原游”也热度空前。大数据显示，呼伦贝尔成为今年端午假期机票预订量增速最快的旅游目的地之一，同比增长约100%；与此同时，锡林浩特、呼和浩特等多个内蒙古城市的机票预订量增速也位居全国前列，草原骑马、星空露营成为游客避暑新玩法。", "ctime": 1781173724, "time_str": "18:28:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260611/c677395236.shtml"}, {"id": "4512195", "title": "深圳新星：全资子公司松岩新能源涉及诉讼，公司已胜诉", "content": "深圳新星公告，全资子公司松岩新能源涉及一起诉讼案件，涉案金额为货款本金1210.21万元及逾期付款损失。案件已进入终审判决阶段，公司胜诉。根据终审判决，新亚中宁新材料科技（衢州）有限公司对东莞市杉杉电池材料有限公司所负债务承担连带清偿责任。公司已在2024年度就本次诉讼事项全额计提坏账准备1210.21万元。若后续足额收回该笔应收账款，预计将增加期后利润1210.21万元。", "ctime": 1781173657, "time_str": "18:27:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260611/c677395220.shtml"}, {"id": "4512177", "title": "大中矿业：全资子公司新增周油坊铁矿采矿权及周边探矿许可证", "content": "大中矿业公告，全资子公司金日晟矿业新增周油坊铁矿采矿权及周边勘查探矿许可证，面积4.611平方公里，有效期至2031年3月22日。该矿新增资源量16,130.25万吨，总矿石量达28,235.79万吨，有助于提升铁矿石资源储备，巩固主业可持续发展。", "ctime": 1781173392, "time_str": "18:23:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260611/c677394904.shtml"}, {"id": "4512161", "title": "伊朗外交部强烈谴责美国发动新一轮军事打击", "content": "伊朗外交部11日发表声明，强烈谴责美国对伊朗发动新一轮军事打击，并指责美方严重违反4月8日达成的停火安排。声明称，美国在过去数小时内针对伊朗实施的军事行动违反《联合国宪章》，并使停火失去意义。伊方认为，由此引发的一切后果应由美国政府承担。声明同时表示，美国继续利用部分地区国家的领土、设施和资源筹划并实施针对伊朗的军事行动，使相关国家成为冲突的一部分。伊方敦促地区国家履行相关义务，防止其领土被用于针对伊朗的军事行动。同时，伊朗重申其拥有合法自卫权，保留打击相关袭击源头的权利。（新华社）", "ctime": 1781173281, "time_str": "18:21:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260611/c677394790.shtml"}, {"id": "4512153", "title": "大千生态：向特定对象发行股票申请获上交所审核通过", "content": "大千生态公告，公司于2026年6月11日收到上海证券交易所出具的《关于大千生态环境集团股份有限公司向特定对象发行股票的交易所审核意见》，认为公司向特定对象发行股票申请符合发行条件、上市条件和信息披露要求，并将在收到公司申请文件后提交中国证监会注册。", "ctime": 1781173247, "time_str": "18:20:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260611/c677394583.shtml"}, {"id": "4512149", "title": "隆华新材：股东新余隆振拟减持不超2.03%公司股份", "content": "隆华新材公告，股东新余隆振投资合伙企业（有限合伙）拟减持不超2.03%公司股份。", "ctime": 1781173242, "time_str": "18:20:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260611/c677394539.shtml"}, {"id": "451213 // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
