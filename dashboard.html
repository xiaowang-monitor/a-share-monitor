* { margin:0; padding:0; box-sizing:border-box; }

  background: var(--bg-primary);
  color: var(--text-primary);
  min-height: 100vh;
}
.mono { font-family: 'JetBrains Mono', monospace; }
.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 20px;
  transition: all 0.2s;
}
.card:hover { background: var(--bg-card-hover); border-color: #334155; }
.badge {
  display: inline-flex; align-items: center; padding: 2px 8px;

}
.badge-s { background: rgba(239,68,68,0.2); color: #ef4444; }

.badge-b { background: rgba(59,130,246,0.2); color: #3b82f6; }
.badge-c { background: rgba(100,116,139,0.2); color: #94a3b8; }
.score-bar {
  height: 6px; border-radius: 3px; background: #1e293b; overflow: hidden;
}
.score-bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s; }
.up { color: var(--red); }
.down { color: var(--green); }
.pulse { animation: pulse 2s infinite; }
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}
.glow { box-shadow: 0 0 20px rgba(59,130,246,0.15); }
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg-primary); }
::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
</style>

          <tbody id="picks-table"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260505/c676454603.shtml"}, {"id": "4318029", "title": "红板科技：子公司成功竞拍江西志浩100%股权，利于快速扩充公司PCB产能", "content": "红板科技公告，公司子公司吉安市辉阳电子有限公司通过京东资产交易平台成功竞得江西志浩电子科技有限公司100%股权，成交价格为4.19亿元。本次竞拍成功符合公司战略发展规划，有利于快速扩充公司PCB产能，完善产业布局；有利于整合江西志浩现有产能、客户与技术资源，提升公司市场竞争力；有利于落实公司在中高端印制电路板领域的产能扩张计划，增强持续盈利能力。", "ctime": 1777971329, "time_str": "16:55:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260505/c676454602.shtml"}, {"id": "4318019", "title": "NYMEX汽油主力合约跌超2%", "content": "NYMEX汽油主力合约跌超2%，现报3.66美元/加仑。", "ctime": 1777971100, "time_str": "16:51:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260505/c676454587.shtml"}, {"id": "4318017", "title": "WTI原油跌超3%", "content": "WTI原油跌超3%，现报103.21美元/桶。", "ctime": 1777971098, "time_str": "16:51:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260505/c676454586.shtml"}, {"id": "4318001", "title": "伊军方消息人士否认袭击富查伊拉称美方应对此负责", "content": "据伊朗媒体4日报道，一名不愿公开姓名的伊朗军方消息人士当天否认阿联酋富查伊拉石油工业区火灾与伊朗有关，并就有关阿联酋威胁打击伊朗的报道作回应，警告阿联酋不得采取不当行动。据伊朗伊斯兰共和国广播电视台报道，这名伊朗军方消息人士说，伊朗没有预先策划任何针对富查伊拉石油工业区的袭击计划。相关事件是美国“军事冒险行为”的结果，美方应对此负责。他指责美方试图为“非法通过霍尔木兹海峡受限水域”的船只制造通道。伊朗塔斯尼姆通讯社报道，这名军方消息人士说，目前关于阿联酋威胁打击伊朗的说法多为媒体援引消息源报道，尚无来自阿联酋方面的正式威胁。但是，如果阿联酋“成为以色列的工具并采取不当行动”，伊朗将作出严厉回应，阿联酋“所有利益都可能成为打击目标”，阿境内设施“将不再安全”。这名消息人士表示，阿联酋“对自身安全形势心知肚明”，若作出“错误选择”，伊方将不再保持克制，并将阿联酋“视同以色列的一部分加以应对”。富查伊拉媒体办公室4日发布声明称，富查伊拉石油工业区当天遭一架来自伊朗方向的无人机袭击而起火，造成3名印度籍人员受伤。阿联酋国防部当晚宣布，该国防空系统当天成功拦截来自伊朗方向的12枚弹道导弹、3枚巡航导弹以及4架无人机。(新华社)", "ctime": 1777970494, "time_str": "16:41:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260505/c676454552.shtml"}, {"id": "4317993", "title": "长安汽车：4月产量18.09万辆、销量17.93万辆，同比下降", "content": "证券简称公告，2026年4月，长安汽车产量18.09万辆，销量17.93万辆，其中海外销量77659辆；产量同比变动-6.87%，销量同比变动-5.95%。本年累计产量66.69万辆，同比变动-15.13%，累计销量73.68万辆，同比变动-17.75%。", "ctime": 1777970315, "time_str": "16:38:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260505/c676454540.shtml"}, {"id": "4317991", "title": "比亚迪：4月新能源汽车产量32.23万辆、销量32.11万辆", "content": "比亚迪公告，2026年4月新能源汽车产量32.23万辆，销量32.11万辆；本年累计产量103.03万辆，同比下降28.56%，去年累计144.21万辆；累计销量102.16万辆，同比下降26.02%，去年累计138.09万辆。4月出口新能源汽车13.51万辆；4月新能源汽车动力电池及储能电池装机总量约20.98 GWh，2026年累计装机总量约81.19 GWh。", "ctime": 1777970311, "time_str": "16:38:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260505/c676454539.shtml"}, {"id": "4317985", "title": "本轮巴以冲突已致加沙地带72615人死亡", "content": "当地时间5月5日，加沙地带卫生部门发表声明称，自2023年10月7日巴以新一轮大规模冲突爆发以来，以军在加沙地带的军事行动已造成72615名巴勒斯坦人死亡，另有17.25万人受伤。（央视新闻）", "ctime": 1777970217, "time_str": "16:36:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260505/c676454536.shtml"}, {"id": "4317973", "title": "香港第一季度GDP环比增长2.9%，同比增长5.9%", "content": "香港第一季度GDP环比增长2.9%，同比增长5.9%。", "ctime": 1777969955, "time_str": "16:32:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260505/c676454514.shtml"}, {"id": "4317949", "title": "泰国内阁批准废除与柬埔寨的海域备忘录", "content": "当地时间5月5日，泰国内阁批准废除与柬埔寨的一份海域备忘录。泰国总理阿努廷当天表示，此举不会影响泰国边境稳定。该备忘录于2001年签署，其重点是泰柬两国就海上边界进行谈判，包括石油资源的共同利用。泰国总理阿努廷4月23日表示，将废除前总理他信当政时期与柬埔寨签署的一份关于重叠海域问题的备忘录。泰国海军参谋长他达武·他比达恭表示，废除该备忘录的原因是其已沿用多年但没有取得进展。目前柬埔寨已加入《联合国海洋法公约》，泰柬可以在公约框架内协商。（央视新闻）", "ctime": 1777969346, "time_str": "16:22:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260505/c676454473.shtml"}, {"id": "4317947", "title": "厄瓜多尔将哥伦比亚输厄商品税率下调至75%", "content": "厄瓜多尔政府4日宣布，将对进口自哥伦比亚的商品征收的“安全税”税率从100%下调至75%。该措施自6月1日起生效。厄瓜多尔政府在一份声明中说，这一决定重申了厄政府在安全领域推动双边合作机制的开放立场，旨在加强两国协调配合，促进边境地区发展。本次声明发布时，厄方100%“安全税”税率才执行了4天。今年年初以来，厄瓜多尔和哥伦比亚围绕边境安全等问题矛盾持续升级。1月21日，厄瓜多尔宣布将对进口自哥伦比亚的商品征收30%的“安全税”。此后，厄“安全税”税率逐步上调至100%。作为回应，哥伦比亚政府此前也宣布将对进口自厄瓜多尔的商品关税税率提高至100%。(新华社)", "ctime": 1777969337, "time_str": "16:22:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260505/c676454471.shtml"}, {"id": "4317919", "title": "港股收评：恒生指数跌0.76%，恒生科技指数跌0.94%", "content": "港股收盘，恒生指数跌0.76%，恒生科技指数跌0.94%。板块方面，半导体产品与设备、机械制造板块涨幅靠前；通信设备、汽车板块跌幅靠前。个股方面，天星医疗涨118.27%，粤港湾控股涨30.29%，派格生物医药-B涨13.07%，华勤技术涨7.76%，经纬天地涨7.1%；泽景股份跌9.51%，群核科技跌8.59%，轻松健康跌7.53%，恒大物业跌7.23%，赛力斯跌6.97%。", "ctime": 1777968707, "time_str": "16:11:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260505/c676454431.shtml"}, {"id": "4317901", "title": "假期最后一天铁路迎返京高峰，受大风影响部分列车晚点", "content": "“五一”假期进入尾声，返程客流持续攀升。记者从国铁北京局了解到，今天国铁北京局预计发送旅客171万人次。其中，北京地区预计发送75.3万人次、到达93万人次。 另外，受东北地区大风天气影响，为确保旅客列车运行安全，铁路部门对京哈、沈佳、沈大、盘营、长珲等高铁线路采取限速运行措施。受此影响，途经限速区段的旅客列车不同程度晚点运行；京哈高铁、津秦高铁北京铁路管内部分终到、折返旅客列车晚点运行。（央视新闻）", "ctime": 1777968578, "time_str": "16:09:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260505/c676454420.shtml"}, {"id": "4317887", "title": "对伊朗战争支持率低迷 特朗普：假的", "content": "当地时间5月4日，美国总统特朗普在白宫一场活动上抱怨说，有民调显示仅32%的美国人支持对伊朗战争，他批评这份民调数据“虚假”。（新华社）", "ctime": 1777968410, "time_str": "16:06:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260505/c676454402.shtml"}, {"id": "4317877", "title": "Pinterest美股盘前涨超15%", "content": "Pinterest美股盘前涨超15%，现报24.103美元。", "ctime": 1777968335, "time_str": "16:05:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https:// // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
