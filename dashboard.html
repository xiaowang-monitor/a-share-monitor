, "time_str": "15:45:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261002/c680433349.shtml"}, {"id": "5302289", "title": "新疆G217线独库公路10月8日20时起实施冬季封闭", "content": "从新疆维吾尔自治区交通运输厅了解到，经交通运输、公安、文旅、气象等部门联合研判，预计10月上旬G217线独库公路全线进入冬季。沿线山区路段将出现降雪天气，路面积雪结冰，通行存在较大安全隐患。为确保广大游客出行安全，G217线独库公路2026年国庆节假日期间正常通行，2026年10月8日20时起实施冬季封闭，禁止社会车辆通行（伊阿铁路、G3033奎独库高速公路、G217天山神秘大峡谷等重点项目物资运输及相关施工车辆除外）。具体开通时间另行通知，请广大游客合理安排出行时间和路线。（央视新闻）", "ctime": 1790925981, "time_str": "15:26:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261002/c680433325.shtml"}, {"id": "5302259", "title": "普京称西方直接卷入对俄战争", "content": "当地时间10月1日，俄罗斯总统普京在俄智库“瓦尔代国际辩论俱乐部”第23届年会全会活动上表示，如果没有西方的军事支持、输送武器，乌克兰对俄罗斯领土的纵深打击不会如此顺利，而这等同于这些国家“卷入了针对俄罗斯的战争”。普京表示，西方国家一直宣称要让俄方遭遇“战略失败”，可能使冲突进入“最残酷阶段”。他说，“虽然并不是打算明天就对向乌克兰提供武器国家的领土或设施发动打击，但这是我们必须清醒认识、评估并牢记在心的威胁。”（CCTV国际时讯）", "ctime": 1790925403, "time_str": "15:16:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261002/c680433309.shtml"}, {"id": "5302171", "title": "沃尔沃汽车股价下跌4.2%，此前公司撤销了2026年销量和现金流展望", "content": "沃尔沃汽车股价下跌4.2%，此前公司撤销了2026年销量和现金流展望。（财联社）", "ctime": 1790924657, "time_str": "15:04:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261002/c680433279.shtml"}, {"id": "5302141", "title": "欧洲主要股指开盘集体上涨", "content": "欧洲主要股指开盘集体上涨，欧洲斯托克50指数涨0.33%，英国富时100指数涨0.19%，法国CAC40指数涨0.13%，德国DAX指数涨0.25%。", "ctime": 1790924553, "time_str": "15:02:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261002/c680433268.shtml"}, {"id": "5302083", "title": "加拿大拟建石油运输管道降低对美依赖", "content": "加拿大政府1日将一条拟修建的西海岸石油管道改名为“太平洋联线管道”，并将其列为“国家利益”项目，预计该项目将大幅降低加石油通过管道运输的对美依赖。据加拿大枢密院指令说明文件，结合跨山输油管道系统的优化，该项目带来的出口能力提升有望将加拿大对美国石油管道外输的依赖度从2025年约82%-83%降至65%-70%，还有望使加拿大重质原油与西得克萨斯轻质原油之间的每桶价差缩小3至5美元。文件显示，加拿大对美国主导的石油出口基础设施具有结构性依赖。文件还显示，“太平洋联线管道”全长约1250公里，起点为艾伯塔省的布鲁德海姆，终点为不列颠哥伦比亚省德尔塔附近的深水港，建成后每天可增加100万桶原油出口能力，特别是加大对亚太市场的出口。项目预计耗资352亿至437亿加元（约合247亿至307亿美元）。(新华社)", "ctime": 1790924239, "time_str": "14:57:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261002/c680433250.shtml"}, {"id": "5302073", "title": "机构：AI芯片需求带动晶圆代工2.0市场增长", "content": "人工智能芯片需求激增，也让三星电子的晶圆代工业务受益。目前AI芯片产能高度集中于台积电，越来越多客户寻求分散订单，助力三星电子稳住全球晶圆代工市场第二名的位置。市场研究机构Counterpoint于30日发布数据，今年二季度三星电子占据全球晶圆代工市场约4%份额，仅次于台积电。公司4纳米与5纳米工艺（SF4、SF5制程）需求旺盛，叠加晶圆价格上涨，支撑了该业绩。不过三星与台积电之间差距依旧巨大。台积电二季度营收402亿美元（约合54万亿韩元），同比增长34%，约占整个代工2.0市场的42%。Counterpoint表示，三星电子与英特尔正在承接客户寻找备选供应商带来的订单，但在先进制程产能、良率以及先进封装能力方面，二者仍难以替代台积电。行业竞争重心预计将从晶圆制造拓展至先进封装领域。Counterpoint预测，代工2.0市场下半年将维持两位数增长，封装、基板与测试产能将成为扩大AI芯片供给的关键变量。（新浪财经）", "ctime": 1790924024, "time_str": "14:53:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261002/c680433247.shtml"}, {"id": "5302053", "title": "达拉斯联储行长称需再升息至少50个基点，美债收益率上扬或助经济降温", "content": "达拉斯联邦储备银行行长Lorie Logan表示，美联储必须继续提高利率才能彻底抑制通胀，并暗示美国国债收益率上升，也可能有助于为经济降温。Logan周四在为达拉斯联邦储备银行一场活动预备的讲稿中表示，“我目前估计，目标利率区间需要再上调50个基点或更多，才能适当平衡双重使命目标的前景与风险”。在加入达拉斯联邦储备银行之前，Logan曾在纽约联储银行市场部门任职逾20年。她也提到，过去几周美国国债收益率大幅攀升。她表示，市场人士告诉她，这波涨势起初源于市场预期经济增长强劲，以及美联储的中性利率可能更高；但目前模型显示，期限溢价也正在上升。所谓期限溢价，是指投资人持有较长天期而非较短天期债券所要求的额外报酬。（新浪财经）", "ctime": 1790923581, "time_str": "14:46:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261002/c680433226.shtml"}, {"id": "5302033", "title": "沃尔沃汽车美洲地区第三季度销量下滑14%", "content": "沃尔沃汽车美洲地区第三季度销量下滑14%，至30777辆。（新浪财经）", "ctime": 1790923273, "time_str": "14:41:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261002/c680433216.shtml"}, {"id": "5302029", "title": "市场监管总局开展特种设备检验质量提升行动", "content": "记者从国家市场监督管理总局了解到，市场监管总局近日印发《特种设备检验质量提升行动工作方案》，决定在全国范围组织开展特种设备检验质量提升行动，覆盖所有特种设备检验机构及电梯检测机构。方案明确四项主要任务：一是压实检验机构主体责任，开展质量体系有效性自查自纠，严查制度文件与实际操作“两张皮”问题；二是强化过程管控，规范检验方案管理，重点加强危化品及饱和水蒸气相关压力容器和压力管道、公众聚集场所电梯等检验方案的审核把关；三是创新监督检查方式，鼓励采用“交叉互检”，协调开展跨省交叉检查试点；四是夯实质量技术基础，加强检验人员实操能力培训，推进检验全过程信息化建设。（新华社）", "ctime": 1790923262, "time_str": "14:41:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261002/c680433215.shtml"}, {"id": "5302027", "title": "WTI原油跌超1%", "content": "WTI原油跌超1%，现报91.9美元/桶。", "ctime": 1790923254, "time_str": "14:40:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261002/c680433214.shtml"}, {"id": "5301995", "title": "沃尔沃汽车：将不再兑现此前公布的2026财年销量与现金流全年业绩展望", "content": "沃尔沃汽车：将不再兑现此前公布的2026财年销量与现金流全年业绩展望。（新浪财经）", "ctime": 1790923079, "time_str": "14:37:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261002/c680433208.shtml"}, {"id": "5301987", "title": "高盛将宁德时代和正力新能列为中国电池行业重点标的", "content": "高盛将宁德时代和正力新能列为中国电池行业重点标的，并认为随着电动车和储能需求持续增长，行业份额将进一步向具备规模、技术和成本优势的企业集中。其中，宁德时代继续被列为行业首选。高盛认为，公司动力电池业务盈利基础稳固，未来更重要的增量将来自储能及综合能源解决方案；随着业务从单纯销售电芯向系统集成和服务延伸，单项目价值量和利润率有望提升。该行给予宁德时代H股12个月目标价947港元、A股目标价565元。对于正力新能，高盛看好其通过客户扩张、产能利用率提升和储能业务发展继续获取市场份额，并预计其未来EBITDA增速可能位居所覆盖电池企业前列。高盛维持其“买入”评级和9港元目标价。高盛认为，这两家公司分别代表行业龙头继续扩大优势，以及二线厂商加速抢占份额两种增长逻辑。(新浪财经)", "ctime": 1790923015, "time_str": "14:36:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261002/c680433195.shtml"}, {"id": "5301939", "title": "泰国扩大家庭太阳能补贴计划规模", "content": "泰国计划将拟议的家庭太阳能补贴计划规模从最初的500亿泰铢扩大至最高750亿泰铢，并放宽资格范围，不再局限于屋顶安装。据内政部副部长Polapee Suwunchwee介绍，该计划目标覆盖多达150万户家庭：第一阶段覆盖100万户，补贴500亿泰铢；随后再覆盖50万户，补贴250亿泰铢。政府计划为每户提供5万泰铢的安装补贴。登记预计于11月1日开始。(新浪财经)", "ctime": 1790922778, "time_str": "14:32:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261002/c680433186.shtml"}, {"id": "5301921", "title": "日韩股市收盘涨跌互现", "content": "日经225指数收跌0.94%，报68309.46点。韩国综指收涨0.46%，报7003.74点。", "ctime": 1790922702, "time_str": "14:31:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261002/c680433185.shtml"}, {"id": "5301859", "title": "非盟呼吁埃塞、厄特和埃及保持克制", "content": "非洲联盟委员会1日呼吁埃塞俄比亚、厄立特里亚和埃及保持最大限度克制，避免采取可能加剧紧张局势或损害地区和平稳定的行动和言论。非盟委员会当天发表声明，敦促三国通过现有外交渠道与和平对话方式解决分歧，并表示“非盟已准备好与相关国家协商，支持推动局势降温、对话以及和平解决分歧的努力”。近期，“提格雷人民解放阵线”武装与埃塞政府军在该国北部地区发生冲突。埃塞方面指责厄立特里亚支持在埃塞北部与政府军作战的武装团体。1日，埃塞外交部发布声明，宣布关闭其在厄首都阿斯马拉的大使馆，并将10名厄驻埃塞外交官列为“不受欢迎的人”，要求其在48小时内离境。厄外交部随后也发布声明，宣布断绝与埃塞所有外交关系。(新华社)", "ctime": 1790922414, "time_str": "14:26:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261002/c680433179.shtml"}, {"id": "5301851", "title": "Evercore ISI上调埃森哲目标价至250美元，看好AI业务增长及订单表现", "content": "Evercore ISI维持埃森哲“跑赢大盘”评级，并将目标价上调至250美元，主要基于盈利预期改善和AI业务增长。埃森哲8月季度营收187亿美元，按固定汇率同比增长7%，高于公司指引上限；调整后每股收益3.29美元，同比增长9%。季度新签订单222亿美元，同比增长5%，其中托管服务订单达到创纪录的128亿美元。Evercore特别看好公司AI业务进展，埃森哲2026财年来自新兴AI和数据合作伙伴的订单额增长逾两倍，相关收入增长逾一倍，超过400家客户首次启动高级AI项目。公司预计2027财年按固定汇率计算营收增长3%至6%，每股收益14.39至14.81美元，营业利润率扩大10至30个基点。(新浪财经)", "ctime": 1790922265, "time_str": "14:24:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261002/c680433172.shtml"}, {"id": "5301843", "title": "年内A股定增募资超4600亿元 机构踊跃入场", "content": "2026年A股市场定向增发延续活跃态势。数据显示，按定增股份上市日计，截至9月29日，年内A股157家公司共实施定增175笔，同比增长48.31％；实际募集资金4654.89亿元，募资规模同比下降39.79％。值得注意的是，年内定增市场募资规模同比下降并非市场降温，而是去年同期基数较高所致。去年仅中国银行、邮储银行、交通银行、建设银行四笔补充资本定增的合计募资金额就高达5200亿元，占当期募资的七成。整体来看，今年以来，定增市场活跃，机构投资者踊跃入场。从定增目的看，定增用于重大资产重组配套融资规模较高。数据显示，年内定增重组有34笔，实际募资2574.75亿元，占定增实际募资额的55.31％。(经济日报)", "ctime": 1790922186, "time_str": "14:23:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261002/c680433164.shtml"}, {"id": "5301825", "title": "阿联酋撤回以航班降落授权 大量以色列旅客继续滞留迪拜", "content": "以色列航空10月2日发表声明称，由于阿联酋突然撤回了航班降落授权，原定于当天飞往迪拜接回滞留以色列旅客的航班已被迫取消。声明称，下周的航班目前仍在计划行程内，但所有机票均已售罄。有消息称，以色列高级官员与阿联酋官员之间为此进行了长时间磋商，但未能就以航的飞机在该国降落达成最终协议。由于迪拜航空FZ1073航班遇袭事件，迪拜航空暂停了所有往返以色列的航班，导致大量以色列乘客滞留当地。(央视新闻)", "ctime": 1790921843, "time_str": "14:17:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261002/c680433153.shtml"}, {"id": "5301819", "title": "统一耗材“身份证” 7类医用耗材医保通用名发布", "content": "国家医保局日前发布《神经介入与神经外科植入材料等7类医用耗材分类与代码及医保通用名》，对神经介入与神经外科、结构性心脏病与心脏外科、修补、口腔、眼科、血管栓塞、缝合及凝固材料7大类植入耗材统一医保通用名。目前市场上同一种功能的耗材，不同厂家有不同的注册名称和商品名。医用耗材医保通用名拆掉了注册名称和商品名的“包装外壳”，聚焦产品本身使用部位、功能用途、效价等关键要素，采用“三级分类名称+必要材质与特征参数”的标准化结构命名。经过多轮专家论证、公开征求意见、企业沟通，此次形成136个医保通用名，同时对分类、材质特征进行系统性精简优化，补齐创新耗材编码与医保通用名空白。（新华社）", "ctime": 1790921781, "time_str": "14:16:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261002/c680433151.shtml"}, {"id": "5301815", "title": "今年前9个月苏丹武装冲突已造成超400名儿童伤亡", "content": "当地时间10月1日晚，联合国儿童基金会就苏丹局势发布声明称，自2026年1月至9月，苏丹武装冲突造成超过400名苏丹儿童死亡或受伤。声明表示，近期，无人机袭击在苏丹武装冲突中愈发频繁，相当一部分儿童伤亡由无人机袭击造成。此外，无人机袭击还导致民宅以及学校、卫生设施、供水系统等民用基础设施受损，进一步加剧当地人道主义危机。联合国儿童基金会呼吁冲突各方履行国际人道主义法规定的义务，保护包括儿童在内的平民及民用基础设施。2023年4月15日，苏丹军方与快速支援部队在首都喀土穆爆发武装冲突，战火随后蔓延至其他地区。持续三年多的武装冲突已造成至少5.9万人死亡。(央视新闻)", "ctime": 1790921759, "time_str": "14:15:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261002/c680433150.shtml"}, {"id": "5301801", "title": "全国秋粮收获过三成", "content": "记者2日从农业农村部了解到，截至10月1日，全国秋粮收获过三成。据了解，近日北方大部以晴好天气为主，利于秋粮收获。据农业农村部最新农情调度显示，西南收获近七成，长江中下游收获四成半，黄淮海过三成，西北过三成，东北过一成。(新华社)", "ctime": 1790921597, "time_str": "14:13:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261002/c680433146.shtml"}, {"id": "5301739", "title": "超1200亿元！公募“红包”派发进行时", "content": "公募基金年内分红超1200亿元，债券型基金贡献逾六成，多只宽基ETF分红金额居前。与此同时，权益基金分红次数同比增加近八成，31家公募机构旗下产品分红金额超过10亿元。业内人士表示，在市场波动背景下，基金分红可以兑现部分收益，既有助于提升产品吸引力，也能在一定程度上帮助投资者锁定收益、缓解持仓压力。（上海证券报）", "ctime": 1790921136, "time_str": "14:05:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261002/c680433128.shtml"}, {"id": "5301735", "title": "普京：西方继续援乌或使冲突进入“最残酷阶段”", "content": "俄罗斯总统普京10月1日出席俄智库瓦尔代国际辩论俱乐部第23届年会全体会议。普京表示，西方国家一直宣称要让俄方遭遇“战略失败”，可能使冲突进入“最残酷阶段”。普京说，多年来，西方企图把乌克兰变成对抗俄罗斯的工具，这种做法把俄罗斯推向不得不用武力捍卫自身的境地，但“让俄罗斯遭受战略失败”无助于实现和平。普京警告说，军事行动和制裁从来不是单方面的，一方的挑衅会引发另一方的回应，由此形成不断收紧的“破坏螺旋”。当前主要大国拥有足以“毁灭一切生命的武器”，此时对对手的威胁，只会加大冲突进入“最残酷阶段”的风险。普京认为，俄乌冲突各方迟早需要重建某种“稳定的平衡”，这要求相互妥协、相向而行，而西方国家必须清醒评估局势。他说，西方国家还需要适应多极世界现实，学会在尊重国际社会多数国家核心利益的基础上开展合作。(央视新闻)", "ctime": 1790921067, "time_str": "14:04:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261002/c680433120.shtml"}, {"id": "5301517", "title": "电影《神探之痕迹》总票房破亿", "content": "据灯塔专业版实时数据，截至10月2日，影片《神探之痕迹》票房突破1亿。(界面)", "ctime": 1790920705, "time_str": "13:58:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261002/c680433090.shtml"}, {"id": "5301515", "title": "国庆假期海南进出岛客流预计同比增长6.9%", "content": "记者2日从海南省交通运输厅获悉，今年国庆假期海南全省进出岛客流将保持稳步增长态势，累计进出岛客流预计达162.5万人次，同比增长6.9%。据预计，国庆假期，海南出行呈现“两头高、中间缓”特点。其中，进岛高峰集中在10月1日至2日，琼州海峡单日预计发送旅客约12万人次、车辆约3.2万台次；出岛返程高峰集中在10月6日至7日，疏运保障压力集中。同时，岛内自驾游热度持续攀升，环岛旅游公路、重点国省干线、景区周边车流大幅增长，局部路段拥堵风险偏高。(中国新闻网)", "ctime": 1790920665, "time_str": "13:57:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261002/c680433088.shtml"}, {"id": "5301477", "title": "3项强制标准实施！涉重大隐患判定准则", "content": "9月30日起《化工和危险化学品生产经营企业重大生产安全事故隐患判定准则》（AQ 3067—2026）、《危险化学品重大危险源安全包保责任管理要求》（AQ 3072—2026）、《化工企业设备检修作业安全规范》（AQ 3026—2026）3项强制性行业标准正式实施，将进一步完善化工和危险化学品生产安全标准体系，为安全生产管理提供重要技术支撑。其中《化工和危险化学品生产经营企业重大生产安全事故隐患判定准则》从重点人员、设计规划工艺技术、设备设施、生产运行作业安全、安全管理等重点环节系统梳理明确了53项重大隐患判定情形。(央视新闻)", "ctime": 1790920345, "time_str": "13:52:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261002/c680433074.shtml"}, {"id": "5301453", "title": "瑞士过去5年冰川总冰量缩减近五分之一", "content": "瑞士科学院1日援引瑞士冰川监测网最新数据发布的公报说，过去5年间，瑞士冰川的总冰量减少了近五分之一。公报说，2026年瑞士冰川冰量减少5.5%，损失量在有记录以来排名第二，仅次于2022年。单座冰川的平均厚度减少了2.5至4米，今年夏季部分冰川舌区域的冰层厚度甚至减少了10米。一个完整的冰川年一般从秋季开始，到次年夏末结束。公报说，2026年5月至9月的强烈热浪，叠加冬季降雪稀少，使今年再次成为瑞士冰川遭受严重损失的一年。从平均积雪深度来看，2025年11月至2026年4月的冬季是有测量记录以来降雪量最少的十个冬季之一。而5月至9月期间，零度层高度有76天超过4000米，达平均值两倍以上，创历史纪录。公报警告说：“在这样的条件下，阿尔卑斯冰川从长期来看没有存续的可能。”许多小型冰川已经消失，阿莱奇和罗讷等冰川2026年的消融量也均创有记录以来最高水平。公报还指出，7月至9月期间，冰川融化总计流失了约2.2万亿升水，相当于瑞士所有家庭年饮用水量的4倍以上。(新华社)", "ctime": 1790919856, "time_str": "13:44:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261002/c680433054.shtml"}, {"id": "5301437", "title": "台交所加权股价指数收高0.3%", "content": "台交所加权股价指数收高0.3%，报48475.74点。（财联社）", "ctime": 1790919540, "time_str": "13:39:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261002/c680433046.shtml"}, {"id": "5301435", "title": "摩根士丹利将耐克目标价从31美元下调至27美元", "content": "摩根士丹利将耐克目标价从31美元下调至27美元。（财联社）", "ctime": 1790919532, "time_str": "13:38:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261002/c680433045.shtml"}, {"id": "5301431", "title": "今年以来159只翻倍股，扎堆两大行业", "content": "截至9月30日，今年以来，剔除期间上市新股的首日涨幅后，159只股票涨幅超过100%，来自电子、机械设备行业的股票数居前 2日从中国国家铁路集团有限公司获悉，10月1日全国铁路发送旅客2520.4万人次，创单日旅客发送量历史新高，运输安全平稳有序。10月2日，全国铁路预计发送旅客2039万人次，加开列车1462列。10月2日，铁路客流继续保持高位运行，从车票预售情况来看，2日热门出发城市主要有北京、广州、上海、成都、深圳、杭州、武汉、西安、郑州、南京；热门到达城市主要有北京、广州、成都、杭州、上海、武汉、西安、郑州、南京、长沙；广州至南宁，西安至成都往返，北京至沈阳、郑州、青岛，广州至武汉、北京至济南等热门区间客流相对集中。(新华社)", "ctime": 1790917680, "time_str": "13:08:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261002/c680432915.shtml"}, {"id": "5301219", "title": "TD Cowen将CrowdStrike目标价从250美元上调至280美元", "content": "TD Cowen将CrowdStrike目标价从250美元上调至280美元。（蓝鲸新闻）", "ctime": 1790916955, "time_str": "12:55:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261002/c680432890.shtml"}, {"id": "5301199", "title": "国庆假期首日高速公路充电量同比增长60.4%", "content": "国庆假期，新能源汽车出行热度持续攀升。通过对纳入国家充电设施监测服务平台的6.27万个高速公路充电设施（枪）进行统计分析，“十一”国庆假期首日，全国高速公路充电量达到2804.69万千瓦时，较去年“十一”国庆假期首日增长60.40%，创历史节假日单日新高。假期充电需求进一步集中释放，高速公路服务区充电设施运行总体平稳，切实为新能源汽车长途出行提供了补能支撑。下一步，国家能源局将会同有关方面继续加强高速公路充电设施的监测调度，持续保障好“十一”假期新能源汽车出行的充电需求。(国家能源局)", "ctime": 1790916603, "time_str": "12:50:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261002/c680432882.shtml"}, {"id": "5301179", "title": "长安汽车9月交付22.89万辆", "content": "10月2日，长安汽车公布9月销量数据，2026年9月交付22.89万辆，其中，海外交付96200辆，同比增长73.8%；新能源交付113200辆，同比增长13.9%。9月，长安启源累计销量突破100万辆，深蓝汽车也迎来第100万辆整车下线。(新京报)", "ctime": 1790916282, "time_str": "12:44:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261002/c680432874.shtml"}, {"id": "5301173", "title": "默茨称德国将继续支持乌克兰", "content": "德国总理默茨10月1日称，德国将继续支持乌克兰，同时也将继续寻求通过外交途径解决俄乌冲突。默茨当天在德国北威州明斯特与到访的荷兰首相耶滕、北约秘书长吕特共同视察第一德荷军团。默茨在新闻发布会上说，俄乌战事直接关系到欧洲安全，德国为此将继续加强军事实力和经济韧性。默茨还说，第一德荷军团由德国和荷兰共同领导，另有14个国家参与。2026年7月以来，该军团在爱沙尼亚和拉脱维亚承担北约东翼防务任务。耶滕称，北约框架下的欧洲军事威慑对维护欧洲和平至关重要。在当前安全压力不断上升背景下，欧洲必须加强军事威慑合作，并展现捍卫自身安全的能力。吕特表示，目前尚未看到针对北约迫在眉睫的军事攻击，但北约将继续加强防务并支持乌克兰。(新华社)", "ctime": 1790916159, "time_str": "12:42:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261002/c680432872.shtml"}, {"id": "5301139", "title": "韩国检察厅正式退出历史舞台", "content": "据韩联社报道，韩国公诉厅和重大犯罪调查厅2日正式成立，取代1日结束最后一个工作日的韩国检察厅，1948年成立的韩国检察厅正式退出历史舞台。\n根据修订后的《刑事诉讼法》《公诉厅法》和《重大犯罪调查厅法》，公诉厅隶属于法务部，负责提起公诉和维持公诉职能；重大犯罪调查厅隶属于行政安全部，负责七类重大犯罪的调查。\n据报道，韩国大多数刑事案件侦查由警方负责，被列为重大犯罪的虐待儿童、性犯罪等则由重大犯罪调查厅负责侦查。尽管“检察厅”这一机构被撤销，但“检察总长”和“检察官”称谓予以保留。根据《公诉厅法》，公诉厅负责人仍为检察总长，检察官继续在公诉厅工作。\n韩联社指出，此次刑事司法体系的重大调整，源于韩国社会长期以来对检察机关权力过度集中，以及由此引发的过度侦查及起诉等问题的批评。长期以来，每逢韩国政权更迭，检察机关就被指存在“针对性侦查”和“政治检察”等问题。不过有观点认为，新体系下各机构间能否顺畅合作仍存疑。韩国政府表示，为消除担忧，将尽快完成人事安排，并全力推动两家机构尽早实现组织稳定运行。(新华社)", "ctime": 1790915526, "time_str": "12:32:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261002/c680432844.shtml"}];

    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
