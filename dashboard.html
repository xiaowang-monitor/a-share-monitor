系，共同朝着构建人类命运共同体的目标前进。（央视新闻）", "ctime": 1779866753, "time_str": "15:25:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260527/c677009233.shtml"}, {"id": "4412973", "title": "美国前司法部长加入白宫AI委员会", "content": "美国总统特朗普已任命前司法部长帕姆·邦迪为白宫人工智能政策顾问委员会成员。该委员会名为“总统科学技术顾问委员会”(PCAST)，由白宫前人工智能事务主管戴维·萨克斯和白宫科技政策办公室主任迈克尔·克拉齐奥斯共同担任主席，委员会成员包括英伟达创始人兼首席执行官黄仁勋、“元”公司首席执行官马克·扎克伯格、甲骨文公司联合创始人拉里·埃里森等十多名科技企业高管，主要围绕人工智能发展与监管、网络安全等议题开展工作。专家认为，该机构将在美国政府人工智能政策的制定与行业监管中发挥重要作用。据介绍，邦迪将负责协调政府与科技企业，并出任新设立的国家基础设施顾问职务。（新华社）", "ctime": 1779866697, "time_str": "15:24:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260527/c677009213.shtml"}, {"id": "4412971", "title": "南向资金净卖出超20亿港元", "content": "据同花顺iFinD数据，截至目前，南向资金净卖出超20亿港元，其中港股通（沪）买入超23.23亿港元，港股通（深）卖出超43.59亿港元。", "ctime": 1779866690, "time_str": "15:24:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260527/c677009210.shtml"}, {"id": "4412969", "title": "外交部：中方坚定支持古巴维护主权、安全、发展利益", "content": "就古巴外长谴责美国军事威胁，外交部发言人毛宁27日在例行记者会上答问时表示，中方一贯主张尊重各国主权、领土完整，反对在国际关系中使用或威胁使用武力，反对以任何借口侵犯他国主权、干涉他国内政，各国都应当遵守国际法以及联合国宪章的宗旨和原则。中方坚定支持古巴维护主权、安全、发展利益。（新华社）", "ctime": 1779866687, "time_str": "15:24:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260527/c677009207.shtml"}, {"id": "4412963", "title": "外交部：渲染紧张挑动对抗不得人心", "content": "5月27日，外交部发言人毛宁主持例行记者会。有记者就当前东海和南海局势相关问题提问。对此，毛宁表示，当前东海和南海的局势保持总体稳定，各国依法享有的航行和飞越自由不存在任何问题。有关国家应当停止介入中国周边的涉海问题，切实尊重地区国家维护和平稳定的努力，拼凑“小圈子”、渲染紧张、挑动对抗是不得人心。（央视新闻）", "ctime": 1779866524, "time_str": "15:22:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260527/c677009095.shtml"}, {"id": "4412955", "title": "古巴外长呼吁全球声援古巴，外交部：坚定支持古巴维护主权、安全、发展利益", "content": "5月27日，外交部发言人毛宁主持例行记者会。拉通社记者提问，古巴外长布鲁诺·罗德里格斯在联合国安理会会议上谴责美国对古巴的政策，呼吁全球声援古巴，维护联合国宪章。这些言论是在由中国主持的会议上发表的，中方在这一问题上的立场是什么？毛宁表示，中方一贯主张尊重各国主权、领土完整，反对在国际关系中使用或威胁使用武力，反对以任何借口侵犯他国主权、干涉他国内政。“各国都应当遵守国际法以及联合国宪章的宗旨和原则。中方坚定支持古巴维护主权、安全、发展利益。”毛宁说。（澎湃新闻）", "ctime": 1779866469, "time_str": "15:21:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260527/c677009070.shtml"}, {"id": "4412945", "title": "高考期间AI工具被禁用或功能被限制？豆包客服：暂未接到相关通知", "content": "5月27日，“高考期间AI工具被禁用或功能被限制”的消息在网络流传。记者联系了豆包人工客服，工作人员称，目前客服热线还没有接收到相关通知，后续以官网页面显示为准，相关更新动作可以关注官网查看。(澎湃新闻)", "ctime": 1779866354, "time_str": "15:19:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260527/c677008988.shtml"}, {"id": "4412935", "title": "王毅会见巴拿马外长探讨了哪些领域的合作？外交部回应", "content": "外交部发言人毛宁主持例行记者会。当地时间5月26日，中共中央政治局委员、外交部长王毅在纽约主持联合国安理会高级别会议期间会见巴拿马外长马丁内斯-阿查。有外媒记者在会上就此事提问，发言人能否就此次会见的成果，以及双方具体探讨了哪些领域的合作提供更多信息？对此，毛宁表示：“在纽约期间，王毅外长会见了巴拿马外长。会见的情况我们已经发布了消息，我没有更多信息可以补充。”（澎湃新闻）", "ctime": 1779866309, "time_str": "15:18:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260527/c677008959.shtml"}, {"id": "4412931", "title": "外交部：“天宫”迎来首位中国香港航天员是“一国两制”实践结出的硕果", "content": "外交部发言人毛宁27日在例行记者会上答问时表示，神舟二十三号载人飞船成功发射，“天宫”迎来了首位中国香港航天员，这不仅是中国载人航天事业的又一里程碑，也是全体香港同胞的共同荣耀，是“一国两制”实践结出的硕果，显示了“一国两制”的强大生命力和显著优越性。（新华社）", "ctime": 1779866257, "time_str": "15:17:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260527/c677008918.shtml"}, {"id": "4412907", "title": "深圳佳兆业金沙湾大酒店再次被拍卖：56折 已有1人报名", "content": "位于深圳市龙岗区大鹏新区大鹏街道的佳兆业金沙湾大酒店01不动产，今日再次被拍卖。不动产登记信息查询结果显示，被拍标的物宗地面积34449平方米，建筑面积41081平方米，土地用途为旅馆业用地，房屋用途为酒店，权利人为深圳市金沙湾大酒店有限公司。查询历史数据可以发现，前述标的物于2025年11月6日曾被拍卖，当时的起拍价为6.92亿元，因无人出价而流拍。该标的物本次起拍价5.53亿元，较9.88亿元的评估价，相当于打了56折。另据企查查股权结构图，佳兆业集团通过全资子公司佳兆业（深圳）有限公司持有深圳佳兆业酒店管理有限公司100%股权，而深圳市金沙湾大酒店有限公司为深圳佳兆业酒店管理有限公司全资子公司。至记者截稿，本次拍卖已有1人报名，暂无出价记录。（财联社）", "ctime": 1779865993, "time_str": "15:13:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260527/c677008729.shtml"}, {"id": "4412899", "title": "教育部留学服务中心：跨境远程文凭证书不在认证范围内", "content": "教育部留学服务中心日前发出提醒，通过跨境远程学习方式获得的国（境）外学历学位证书和高等教育文凭一直不在其认证范围内。公安机关通报及教育部留学服务中心实际认证工作显示，仍有不良中介机构及境外院校在网络平台虚假宣传，谎称不需出境学习可通过认证，虚构学习经历，伪造申请材料，情节严重者甚至构成诈骗。据悉，该中心采取的疫情期间特殊认证规则仅针对受疫情影响被迫由面授课程转为线上学习的情况，从未将跨境远程纳入认证范围。部分不良中介机构将疫情期间的特殊情况与跨境远程学习方式一概而论、混淆视听。教育部留学服务中心提醒广大留学人员谨慎甄别，不要盲目听信各类平台上的“解读”及“攻略”。选择出国留学项目时多方参考教育主管部门和学校官方网站提供的信息。如遇可疑情况或已遭遇诈骗，立即保留相关证据并及时向公安机关和市场监管部门寻求帮助。（新华社）", "ctime": 1779865911, "time_str": "15:11:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260527/c677008693.shtml"}, {"id": "4412851", "title": "期货收评：市场情绪降温！碳酸锂、多晶硅持续下挫", "content": "期货收评：截止收盘，国内期货主力合约涨跌不一，鸡蛋涨超4%，集运欧线涨超2%，纤维板、红枣、玻璃、豆一涨超1%，氧化铝、短纤涨近1%。跌幅方面，沪银、碳酸锂跌超3%，液化石油气、多晶硅跌近3%，铂跌超2%。", "ctime": 1779865821, "time_str": "15:10:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260527/c677008081.shtml"}, {"id": "4412887", "title": "腾讯会议推出“声链”功能", "content": "5月27日，据腾讯云消息，腾讯会议正式推出“声链”功能。据介绍，开启“声链”后，同一间会议室里的几个人同时开麦发言，不会再有啸叫，并且能自动识别发言人。用户可升级到腾讯会议最新版本体验“声链”功能。（腾讯云）", "ctime": 1779865740, "time_str": "15:09:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260527/c677008462.shtml"}, {"id": "4412885", "title": "立讯精密收购闻泰科技部分业务被罚90万元", "content": "市场监管总局发布立讯精密工业股份有限公司收购闻泰科技股份有限公司部分业务违法实施经营者集中案行政处罚决定书，立讯精密工业股份有限公司因在收购闻泰科技部分电子产品代工业务时，未依法事先申报并擅自变更股权，构成违法实施经营者集中；鉴于该交易不具有排除、限制竞争效果，且立讯精密具有主动报告、积极整改等从轻处罚情形，市场监管总局依法对其处以90万元罚款的行政处罚。", "ctime": 1779865730, "time_str": "15:08:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260527/c677008458.shtml"}, {"id": "4412861", "title": "我国自主可控臭氧气体测量原级标准参考仪研制取得突破", "content": "记者今天了解到，市场监管总局近期组织国内优势科技力量，开展了臭氧标准气体准确、稳定发生关键技术攻关，突破了臭氧稳定发生限值，打破了臭氧气体量值只能溯源至美国标准技术研究院（NIST）的技术垄断。该研究首次在国内实现了臭氧气体发生浓度范围（100—1000）×10-9 mol/mol，标准不确定度优于1%，稳定性优于1.0%/7d。同时，研究团队成功研制出臭氧原级标准参考仪装置、零气源发生模块等多项技术成果，相关产品可应用于臭氧气体计量检测和臭氧监测全过程。（央视新闻）", "ctime": 1779865404, "time_str": "15:03:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260527/c677008125.shtml"}, {"id": "4412859", "title": "中共中央政治局委员、中央政法委书记陈文清将赴俄罗斯出席第十四届安全事务高级代表国际会议并访问俄罗斯、哈萨克斯坦", "content": "中共中央政治局委员、中央政法委书记陈文清将于5月27日至6月1日应邀赴俄罗斯出席第十四届安全事务高级代表国际会议，并访问俄罗斯、哈萨克斯坦。(外交部网站)", "ctime": 1779865396, "time_str": "15:03:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260527/c677008115.shtml"}, {"id": "4412849", "title": "欧洲主要股指开盘多数上涨", "content": "欧洲主要股指开盘多数上涨，欧洲斯托克50指数涨0.48%，英国富时100指数跌0.07%，法国CAC40指数涨0.33%，德国DAX指数涨0.42%。", "ctime": 1779865316, "time_str": "15:01:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260527/c677008078.shtml"}, {"id": "4412847", "title": "《机动车驾驶人疲劳驾驶认定规则》6月1日实施", "content": "记者5月27日从公安部交通管理局获悉，公共安全行业推荐性标准《机动车驾驶人疲劳驾驶认定规则》6月1日实施。标准起草负责人介绍，制定这个标准是用于交通事故调查的，即适用于道路交通事故调查处理环节对机动车驾驶人疲劳驾驶行为的认定。经向交通运输部确认，标准中关于客运机动车驾驶人认定疲劳驾驶的两种情形，适用于道路旅客运输企业，以及从事道路旅客运输（即班车客运、包车客运、旅游客运）经营活动的驾驶员和车辆等，不涉及出租汽车（含网约车）等经营活动。同时，标准对于货车驾驶人连续驾驶时间没有特别规定，适用机动车的一般规定，即机动车驾驶人连续驾驶机动车超过4小时未停车休息或停车休息时间少于20分钟。（新华社）", "ctime": 1779865312, "time_str": "15:01:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260527/c677008075.shtml"}, {"id": "4412837", "title": "ETF收评：中韩半导体ETF领涨5.69%，信创ETF领跌5.65%", "content": "ETF收盘涨跌不一，中韩半导体ETF（513 究，取得一系列创新成果，使我国在该领域的研究实现了重要突破。该研究创新性地在冷原子干涉系统中采用原子滤波和激光相位调制技术，获得高相位相关性、高光谱纯度拉曼激光，显著提升了原子干涉重力仪长期稳定性和可靠性。同时，研究团队细致研究原子滤波前后拉曼激光对重力仪干涉条纹的影响，相关研究成果发表于国际光学期刊《Optics Letters》，引起国际同行的关注。该研究成果将推动我国冷原子干涉重力仪快速发展，提升我国在重力测量领域的国际竞争力，为冷原子干涉重力仪长期稳定运行提供有力保障，有望在地质勘探、资源开发、地球科学研究等复杂环境中发挥重要作用。（央视新闻）", "ctime": 1779865248, "time_str": "15:00:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260527/c677008051.shtml"}, {"id": "4412797", "title": "沪深京三市成交额超3.2万亿元，较上日此时缩量75亿元", "content": "据同花顺iFinD数据，沪深京三市成交额超3.2万亿元，较上日此时缩量75亿元，预计全天成交金额约3.2万亿元。截至目前，沪市成交额14485亿元，深市成交额17329亿元，北证50成交额212亿元。", "ctime": 1779864941, "time_str": "14:55:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260527/c677007958.shtml"}, {"id": "4412793", "title": "小米集团-W港股跌近4%", "content": "小米集团-W港股跌近4%，报28.60港元。", "ctime": 1779864879, "time_str": "14:54:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260527/c677007942.shtml"}, {"id": "4412787", "title": "SpaceX上市消息引燃太空相关股票，特斯拉与SpaceX合并讨论升温", "content": "美国太空探索技术公司SpaceX上周向美国证券交易委员会提交文件计划上市交易，点燃了市场对整个行业的热情。5月26日，美国股市太空相关股票大涨，其中，美国商业航天公司Momentus涨超109%，太空基础设施公司Redwire盘中一度大涨31%。美国银行编制的一篮子美国太空产业相关股票今年以来已累计上涨61%。有分析师表示，SpaceX的IPO正吸引更多投资者关注太空行业中已处于有利地位的公司。另据美国媒体26日报道，在SpaceX上市前夕，关于马斯克的目标——将特斯拉与SpaceX合并的讨论也在升温。有法律专家表示，两家公司的合并可能不会引发反垄断问题，但会引起各自股东的担忧，哪家公司将成为母公司、如何进行股票置换等问题都是会面临的挑战。（央视财经）", "ctime": 1779864778, "time_str": "14:52:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260527/c677007911.shtml"}, {"id": "4412783", "title": "新股长进光子尾盘继续拉升涨超1570%", "content": "新股长进光子尾盘继续拉升涨超1570%。长进光子的上市公告书显示，2012年，公司诞生于“中国光谷”，长期专注于特种光纤的研发、生产和销售，已成长为国内领先的特种光纤厂商，具备高性能、多品类特种光纤的研发及产业化能力。", "ctime": 1779864683, "time_str": "14:51:23", "stock_code": "", "stock_name": "", // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

  const tbody = document.getElementById('picks-table');

  tbody.innerHTML = PICKS.map(p => {

    const miniBar = dims.map(d => {

      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
