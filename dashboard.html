const NEWS     = [{"id": "5776623", "title": "NYMEX天然气主力合约跌超4%", "content": "NYMEX天然气主力合约跌超4%，现报3.51美元/百万英热。", "ctime": 1795783737, "time_str": "20:48:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261127/c682319216.shtml"}, {"id": "5776613", "title": "中共上海市委召开2026年专项民主监督专题协商座谈会", "content": "据“上海发布”，中共上海市委今天（11月27日）召开2026年专项民主监督专题协商座谈会，围绕“巩固壮大实体经济根基、加快构建现代化产业体系”议题，听取各民主党派市委、市工商联负责人和无党派人士代表的意见和建议。市委副书记、市长朱忠明出席并座谈交流。朱忠明说，要把创新作为根本动力，集聚创新资源，畅通创新链条，注重技术创新周期长短相宜、攻坚突破领域大小协同、成果转化方面研用并举，推动科技创新和产业创新深度融合。要把智能化、绿色化、融合化作为战略方向，推动制造业深度转型升级，加快迈向产业链价值链高端。要把培育集群作为重要抓手，市区协同选育，优化产业空间布局，分类施策培育企业，聚焦短板完善服务，努力培育一批世界领先的制造业集群。希望大家继续发挥界别特色和人才优势，更好地发挥政治协商、民主监督、参政议政的作用，帮助我们有力有效推动工作落实，圆满实现“十五五”良好开局。(人民财讯)", "ctime": 1795783579, "time_str": "20:46:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261127/c682319185.shtml"}, {"id": "5776577", "title": "当前全国小麦冬前田管有序开展", "content": "记者27日从农业农村部获悉，当前全国麦播进入扫尾阶段，小麦冬前田管有序开展。农业农村部近日在江苏省淮安市召开全国小麦冬前田管现场推进会，分析当前苗情长势，研判今冬明春气象条件，推进落实小麦冬春田管、病虫防控等重点工作。（新华社）", "ctime": 1795783145, "time_str": "20:39:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261127/c682318516.shtml"}, {"id": "5776555", "title": "迅游科技：拟变更控股股东和实际控制人", "content": "迅游科技公告，公司此前不存在控股股东和实际控制人，现拟变更为重庆智龙网联新能源汽车科技有限公司为控股股东、童毅为实际控制人。海运天及其一致行动人合计持有公司股份2244.5万股，占公司股份总数的11.05%；其可支配表决权足以对股东会决议产生重大影响，并已取得董事会多数席位。海朔天近日以1.44亿元竞得袁旭持有的604.88万股公司股票，占总股本2.98%；若司法拍卖最终完成交割，智龙网联控制的相关主体将合计持有公司2849.37万股，占总股本14.02%。该股份尚未完成过户，仍需缴纳竞拍余款、取得法院拍卖成交裁定并办理过户登记，存在不确定性。", "ctime": 1795782721, "time_str": "20:32:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261127/c682317057.shtml"}, {"id": "5776533", "title": "中国机器狗在雀巢泰国工厂“上岗”", "content": "近日，云深处科技绝影X30四足机器人在泰国罗勇府雀巢工厂“上岗”，实现灌装3区200个关键点位日常巡检的全自动化。据了解，此次落地是云深处科技在海外工业巡检场景的又一次实践，为工业运维的数字化升级提供了实践参考。泰国罗勇府雀巢工厂是雀巢在东南亚市场的重要产能基地，厂内产线连续运转、设备密集，巡检路线长、点位多，日常巡检对巡检效率、检测精度及记录合规留痕提出了较高要求。云深处科技智慧巡检方案投入应用后，机器人承担长时间、高重复的点位巡查，巡检人员则通过数字管理平台接收异常信息、研判并组织处置，推动巡检模式由“人走、眼看、手记”转向“机器巡检、平台管理、数据留痕”，以数智运维赋能食品工厂安全生产。（上观新闻）", "ctime": 1795782483, "time_str": "20:28:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261127/c682316707.shtml"}, {"id": "5776529", "title": "广西海岛低空物流支线完成首飞", "content": "11月27日，广西海岛低空物流支线完成首飞，这标志着“北海合浦—涠洲岛”低空航线正式启航，填补了广西海岛物流运输低空场景的空白。(新华社)", "ctime": 1795782370, "time_str": "20:26:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261127/c682316679.shtml"}, {"id": "5776525", "title": "千觉机器人发布Luma高精度形貌测量仪", "content": "11月27日，在第28届高交会上，千觉机器人（Xense Robotics）发布Luma高精度形貌测量仪。据介绍，Luma可随身携带，不受现场环境光限制，可快速重建表面三维起伏并读出缺陷的长宽与深浅，平面精度最高达10μm、深度精度最高达15μm。该方案无需配合全尺寸通用人形机器人大规模上岗，可让视触觉感知以轻量化独立终端的形态直接进入工业一线。（界面）", "ctime": 1795782265, "time_str": "20:24:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261127/c682316654.shtml"}, {"id": "5776515", "title": "中国科技伦理学会揭牌成立", "content": "11月27日，中国科技伦理学会在复旦大学正式揭牌成立。这一全国性学术组织的业务主管单位为中国科协，秘书处设在复旦大学。未来，学会将坚持面向科技界、服务科技工作者，以科技伦理学术研究为基础，以跨学科交流协作为纽带，推动科技伦理理论研究与科技创新实践相结合，致力于促进科技伦理学科发展、加强科技伦理规范建设、服务国家科技伦理治理体系建设。(新华社)", "ctime": 1795782123, "time_str": "20:22:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261127/c682316629.shtml"}, {"id": "5776487", "title": "陈文清访问奥地利", "content": "中共中央政治局委员、中央政法委书记陈文清11月25日至27日访问奥地利。访问期间，陈文清分别与奥地利国民议会议长罗森克兰茨、总理府国家安全顾问沃尔霍费尔、内政部公共安全总局局长鲁夫及奥中友协主席、前总统菲舍尔等举行会见。陈文清表示，在习近平主席和奥地利领导人战略引领下，中奥双方高层交往密切，各领域合作稳步推进，双边关系呈现良好发展势头。中方愿与奥方一道，落实好两国领导人达成的重要共识，坚持相互尊重、平等相待、互利共赢，进一步密切各层级交往，深化执法安全等各领域合作，不断充实中奥友好战略伙伴关系内涵，更好维护两国安全利益和人民福祉。奥方高度评价两国关系发展取得成果，对中方在解决国际安全问题上发挥的重要作用表示赞赏，愿同中方进一步加强执法安全等务实合作，共同推动双边关系向新向优发展。(新华社)", "ctime": 1795781744, "time_str": "20:15:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261127/c682316530.shtml"}, {"id": "5776469", "title": "央行：证监会将适时推广新模式浮动管理费率基金", "content": "中国人民银行发布《中国金融稳定报告》。报告指出，中国证监会将持续深化公募基金改革。一是完善公募基金产品谱系，推出更多中低波动、稳健收益类产品，有效对接保险资金、养老金、银行理财等投资需求，落实好权益类基金快速注册机制，推动指数化投资高质量发展，适时推广新模式浮动管理费率基金，提高权益类基金占比和公募基金持股市值占比。二是稳步落地业绩比较基准新规，组织行业机构分批次有序调整存量公募产品业绩比较基准。三是健全投资者利益绑定机制，做好《基金管理公司绩效考核管理指引》落地实施工作，建立基金销售机构分类评价机制。", "ctime": 1795781659, "time_str": "20:14:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261127/c682316505.shtml"}, {"id": "5776445", "title": "央行：切实增强资本市场内在稳定性", "content": "中国人民银行发布了《中国金融稳定报告（2026）》。其中展望提到，切实增强资本市场内在稳定性。全方位加强资本市场监测预警，强化交易和信息披露监管，维护交易公平性，严肃查处过度炒作乃至操纵市场等违法违规行为。持续丰富中长期资金来源渠道和方式，推出各类适配长期投资的产品和风险管理工具，全力营造“长钱长投”的市场生态。推动科创板、创业板深化改革举措落实落地，促进北交所、新三板一体化高质量发展，提升多层次股权市场的包容性适应性。促进上市公司价值成长和治理提升，加强对控股股东、实际控制人的约束，完善分红回购、股权激励和员工持股等制度安排。研究建立在特定情景下向非银机构提供流动性的机制性安排，发挥好两项支持资本市场的货币政策工具作用。推动资本市场双向开放迈向更深层次、更高水平，推动合格境外投资者优化方案落地，提升跨境投融资便利性，完善境外上市法规制度，增强开放环境下监管和风险防范能力，积极参与国际金融治理。", "ctime": 1795781570, "time_str": "20:12:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261127/c682316456.shtml"}, {"id": "5776421", "title": "SABESP美股盘前涨超11%", "content": "SABESP美股盘前涨超11%，现报5.4美元。", "ctime": 1795781384, "time_str": "20:09:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261127/c682316387.shtml"}, {"id": "5776409", "title": "央行：保持流动性充裕，保持社会融资条件相对宽松", "content": "近日，中国人民银行发布了《中国金融稳定报告（2026）》。展望未来，“十五五”时期我国发展环境面临深刻复杂变化，战略机遇和风险挑战并存、不确定难预料因素增多。我国经济基础稳、优势多、韧性强、潜能大，长期向好的支撑条件和基本趋势没有变，推动高质量发展的要素条件不断集聚增多。下一步，金融系统将坚持防风险、强监管、促高质量发展工作主线，持续防范化解重点领域风险，巩固和强化金融监管，全力以赴推动高质量发展，加强对重点领域的金融支持，稳步有序推进金融改革开放，确保“十五五”金融工作良好开局。灵活高效运用多种货币政策工具，保持流动性充裕，保持社会融资条件相对宽松。坚持市场在汇率形成中的决定性作用，保持汇率弹性，加强预期引导，保持人民币汇率在合理均衡水平上的基本稳定。统筹做好金融“五篇大文章”，聚焦支持扩大内需、科技创新和中小微企业等重点领域，完善政策框架，提升金融服务实体经济高质量发展质效。健全覆盖全面的宏观审慎管理体系，加强系统性金融风险的监测评估，完善宏观审慎和金融稳定管理工具箱。推动金融服务业和金融市场的高水平开放，增强开放格局下的金融风险防控能力，维护国家金融安全。继续着力做好防范化解重点领域风险工作，严控增量、妥处存量、严防“爆雷”，牢牢守住不发生系统性金融风险的底线。（央行）", "ctime": 1795781330, "time_str": "20:08:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261127/c682316377.shtml"}, {"id": "5776381", "title": "淡水河谷美股盘前涨超10%", "content": "淡水河谷美股盘前涨超10%，现报10.841美元。", "ctime": 1795781199, "time_str": "20:06:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261127/c682316325.shtml"}, {"id": "5776375", "title": "中国人民银行发布《中国金融稳定报告（2026）》", "content": "近日，中国人民银行发布了《中国金融稳定报告（2026）》。报告认为，2025年，面对复杂严峻的国内外形势，我国完整准确全面贯彻新发展理念，加快构建新发展格局，着力推动高质量发展，坚持稳中求进工作总基调，统筹国内国际两个大局，统筹发展和安全，经济顶压前行、向新向优发展，圆满实现经济社会发展主要目标任务，“十四五”胜利收官。2025年，我国国内生产总值(GDP)达到140.19万亿元，同比增长5%。就业总体稳定，国际收支基本平衡，对外贸易较快增长，外汇储备规模超过3.3万亿美元，重点领域风险化解取得积极进展，社会大局保持稳定。(央行)", "ctime": 1795781153, "time_str": "20:05:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261127/c682316308.shtml"}, {"id": "5776355", "title": "中国经济社会理事会六届四次全体会议召开", "content": "中国经济社会理事会六届四次全体会议27日在京召开。全国政协副主席兼秘书长、中国经济社会理事会主席王东峰出席并讲话。王东峰强调，经社理事会要深入学习贯彻习近平总书记重要讲话精神和党的二十届五中全会精神，全面学习贯彻习近平党建思想，深刻领悟“两个确立”的决定性意义，坚决做到“两个维护”，以更高标准、更实举措持之以恒推进全面从严治党。要聚焦党和国家中心任务，精心谋划实施2027年工作，持续强化党的创新理论武装，加强高端智库建设，深化对外友好交流，不断提高履职水平。要强化责任担当，发挥广大理事主体作用，创新履职方式和手段，坚持从严治会，以实际行动迎接党的二十一大召开。会议审议通过经社理事会常务理事会工作报告。(新华社)", "ctime": 1795781065, "time_str": "20:04:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261127/c682316279.shtml"}, {"id": "5776349", "title": "日本流感扩散 近九成地区报告病例数显著增加", "content": "日本厚生劳动省27日发布的数据显示，截至本月22日的一周内，日本全国定点医疗机构报告新增流感病例逾5万例，连续5周增加，全国47个都道府县中有42个流感疫情呈扩散趋势。最新数据显示，11月16日至22日，日本全国数千家定点医疗机构总计报告流感病例5.04万例，数量为当前流感季开始以来的新高，平均每家报告13.51例。根据日本的标准，平均每家定点医疗机构一周报告流感病例数超过1，就标志着进入流感季；如果数值超过10，就达到“注意”级别；超过30，即为“警报”级别。目前，北海道流感疫情指标已处于“警报”级别，宫城县、福岛县等地指标接近“警报”级别。（新华社）", "ctime": 1795781050, "time_str": "20:04:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261127/c682316276.shtml"}, {"id": "5776321", "title": "北京市市长殷勇会见德国拜耳集团处方药事业部全球总裁", "content": "据北京日报，11月26日下午，北京市市长殷勇会见德国拜耳集团处方药事业部全球总裁斯特凡·厄尔里希。殷勇说，希望拜耳集团用好北京医药健康产业发展优势，依托北京临床科研资源和成果转化平台，进一步扩大在京研发创新和产业布局，促进更多研发成果在京落地转化。北京市将不断完善“服务包”“服务管家”制度，支持企业在京实现更好发展。厄尔里希表示愿深耕中国市场、扎根北京发展，加大在京创新药研发和产业投资布局，深化与创新企业、医疗机构等的合作，推出更多创新药物造福广大患者，满足公众日益增长的医药健康需求，更好融入北京医药健康产业生态圈。（人民财讯）", "ctime": 1795780847, "time_str": "20:00:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261127/c682316141.shtml"}, {"id": "5776287", "title": "11月27日 周五《新闻联播》要闻19条", "content": "1、【新思想引领新征程】河湖安澜 碧水长流；\n2、《习近平的文化情缘》在斯里兰卡主流媒体播出；\n3、李强主持召开国务院常务会议；\n4、李强将与全球主要国际经济组织负责人举行“1+10”对话会；\n5、1—10月份规模以上工业企业利润同比增长16.0%；\n6、我国工程机械行业持续稳中向好；\n7、“三北”工程攻坚战将推行分区差异化治理；\n8、我国自然资源确权登记加快立体发展；\n9、五部门部署推进技工教育高质量特色发展；\n10、三峡水运新通道工程已完成投资超110亿元；\n11、《生态质量评价标准（试行）》发布；\n12、京津冀医疗信息互通 检查检验跨省跨院调阅；\n13、贵州乌当至长顺高速公路今天建成通车；\n14、俄外交部批评日本政府以谎言为借口加快军事建设；\n15、科威特称伊朗袭击其重要设施 伊朗否认；\n16、贸发会议预计今年全球海运贸易量零增长；\n17、荷兰反对美立法加强半导体设备出口管制；\n18、西班牙央行前行长被提名为欧洲央行行长；\n19、强风暴袭击美国东海岸 近百万户停电。（央视新闻）", "ctime": 1795780789, "time_str": "19:59:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261127/c682316122.shtml"}, {"id": "5776281", "title": "建发股份与越南GMD集团签署合作意向书", "content": "据建发股份消息，11月26日，建发股份与Gemadept Corporation集团（下称“GMD集团”）签署合作意向书。GMD集团是越南大型港口物流运营商，双方此前已签署战略合作协议，并围绕海防南定武码头项目开展合作，共同运营一处码头配套散货堆场。此次合作意向书的签署，标志着双方合作从战略层面进一步向业务实践延伸。双方将围绕码头装卸、货物转运、堆场仓储等环节深化业务协同，推动港口作业与物流服务有效衔接，逐步形成可复制、可推广的综合物流服务解决方案。（人民财讯）", "ctime": 1795780744, "time_str": "19:59:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261127/c682316113.shtml"}, {"id": "5776229", "title": "布拉德斯科银行美股盘前涨超10%", "content": "布拉德斯科银行美股盘前涨超10%，现报2.45美元。", "ctime": 1795780455, "time_str": "19:54:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261127/c682316021.shtml"}, {"id": "5776219", "title": "NYMEX天然气主力合约跌超3%", "content": "NYMEX天然气主力合约跌超3%，现报3.55美元/百万英热。", "ctime": 1795780371, "time_str": "19:52:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261127/c682315984.shtml"}, {"id": "5776193", "title": "中国航发与中国东航签署战略合作协议", "content": "据中国航发消息，11月26日，中国航发与中国东航签署战略合作协议。根据战略合作协议，双方将在发动机研制及运营合作、技术创新攻关、人才培养交流等领域开展深度合作，共同探索具有中国特色的国产发动机应用路径与产业发展模式。（人民财讯）", "ctime": 1795780229, "time_str": "19:50:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261127/c682315921.shtml"}, {"id": "5776189", "title": "中越海警2026年第2次北部湾联合巡逻圆满结束", "content": "为持续深化拓展中越海警海上合作领域、增强执法合作实效，共同维护北部湾海域安全稳定及渔业生产秩序，推动中越两国海警友好交流合作，11月24日至26日，中国海警4305舰艇编队与越南海警8004舰艇编队开展了2026年第2次北部湾海域联合巡逻。此次巡逻中，中越海警舰艇编队按照既定方案和航线，沿中越北部湾海上分界线从北往南展开，累计巡逻25小时、275.5海里，海上生产作业秩序总体良好，双方均未发现有越界作业渔船。巡逻期间，双方组织了联巡20周年纪念活动，开展了海上联合搜救演练。记者了解到，此次巡逻既是2006年以来中越海上执法部门开展的第31次联合巡逻，也是中越海警纪念海上执法合作20周年、回顾历程与展望未来的重要实践。20年里，中越海警合作实现了从单一向多元、从基础向深度的跨越。据悉，中越海警北部湾海域联合巡逻是落实中越两党两国关于深化两国海警海上执法合作重要共识的具体举措，已成为南海海上执法合作样板，为养护北部湾渔业资源、维护渔业生产秩序，维护地区安全稳定发挥了积极作用。(新华社)", "ctime": 1795780202, "time_str": "19:50:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261127/c682315918.shtml"}, {"id": "5776155", "title": "超威半导体美股盘前涨超3%", "content": "超威半导体美股盘前涨超3%，现报422.074美元。", "ctime": 1795779951, "time_str": "19:45:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261127/c682315792.shtml"}, {"id": "5776137", "title": "润和软件：全资子公司以6995.29万元竞得房产并签署转让合同", "content": "润和软件公告，公司此前同意全资子公司无锡润和使用不超过7000万元自有资金参与竞拍房产。近日，无锡润和以6995.29万元（含税）竞得标的房产，并于2026年11月27日与无锡软件产业发展有限公司签署转让交易合同。合同约定，乙方应在合同生效之日起五个工作日内支付剩余产权交易价款4897.29万元；甲方应在收到全部转让价款后5个工作日内解除标的房产抵押，双方在解除抵押后五个工作日内办理权证变更手续。", "ctime": 1795779854, "time_str": "19:44:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261127/c682315702.shtml"}, {"id": "5776113", "title": "中文在线：被诉合同纠纷涉案金额1.3亿元", "content": "中文在线公告，久其数字传播（香港）有限公司就合同纠纷向北京市第四中级人民法院提起诉讼，公司及子公司被列为被告，法院已受理，尚未开庭审理。原告请求FLAREFLOW PTE. LTD.、广东横琴焱坤科技有限公司支付合同欠款及迟延履行违约金等，并请求中文在线就相关债务承担连带保证责任，涉案金额合计人民币1.3亿元。公司称已积极应诉；因案件尚未开庭审理、判决结果尚不确定，目前无法预计对公司本期及期后损益的影响，最终实际影响以法院生效判决为准。", "ctime": 1795779733, "time_str": "19:42:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261127/c682315372.shtml"}, {"id": "5776107", "title": "海默科技：拟6510.81万元转让海默水下25.7854%股权", "content": "海默科技公告，公司拟将持有的海默水下生产技术（深圳）有限公司剩余25.7854%股权分别转让给杭州星璨光远创业投资合伙企业（有限合伙）和上海澜成业信息咨询有限公司，其中向受让方一转让13.9042%股权，转让价款3510.81万元；向受让方二转让11.8812%股权，转让价款3000万元，合计6510.81万元。本次交易已经公司第九届董事会第十七次会议审议通过，尚需公司股东会审议，截至公告披露日尚未签署正式协议。股权转让完成后，公司不再持有海默水下股权。", "ctime": 1795779656, "time_str": "19:40:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261127/c682315203.shtml"}, {"id": "5776089", "title": "研究报告：AI成为保险信息新入口", "content": "中国社会科学院保险与经济发展研究中心、水滴保等日前发布的《带病体保险创新研究报告（2026）》显示，AI正成为保险信息新入口，75.8%的受访带病群体用过AI保险服务，包括AI客服、AI产品推荐或智能匹配、AI健康管理等。(新华社)", "ctime": 1795779505, "time_str": "19:38:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261127/c682315029.shtml"}, {"id": "5776085", "title": "东易日盛：股价异动主要系控股股东无偿捐赠股权资产事项披露，股权捐赠尚未完成交割", "content": "东易日盛公告，公司股票交易价格于2026年11月25日、2026年11月26日、2026年11月27日连续三个交易日内日收盘价格涨幅偏离值累计超过20%，属于股票交易异常波动情形。经核查，公司于2026年11月26日披露控股股东华著集团无偿捐赠华著智算85%股权及现金资产事项，本次捐赠系履行重整承诺，截至公告披露日股权捐赠尚未完成股权交割及工商变更登记手续，现金捐赠需待工商变更登记完成后10个工作日内支付。公司生产经营活动正常，内外部经营环境未发生重大变化。2026年11月27日公司股票收盘价为8.36元/股，最新滚动市盈率161.7倍，市净率7.09倍，均偏离行业平均估值水平。", "ctime": 1795779457, "time_str": "19:37:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261127/c682315018.shtml"}, {"id": "5776079", "title": "纳尔股份：完成回购注销46.91万股限制性股票", "content": "纳尔股份公告，公司已在中国结算深圳分公司完成回购注销46.91万股限制性股票，占回购注销前总股本的0.14%。其中，因2名原激励对象离职注销9.95万股，因首次授予部分第一个解锁期未达到解锁条件注销36.96万股；回购价格为4.55元/股，回购资金总额为213.44万元，来源为自有资金。完成后，公司总股本由3.42亿股变更为3.41亿股。", "ctime": 1795779401, "time_str": "19:36:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261127/c682315004.shtml"}, {"id": "5776063", "title": "海格通信：与广州移动签署全面合作协议，共同揭牌具身智能联合应用中心", "content": "海格通信在投资者关系活动记录表中表示，公司与广州移动签署全面合作协议，并共同揭牌具身智能联合应用中心。", "ctime": 1795779233, "time_str": "19:33:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261127/c682314963.shtml"}, {"id": "5775991", "title": "蓝佛安会见国际农业发展基金总裁拉里奥", "content": "2026年11月26日，财政部部长蓝佛安在部内会见了国际农业发展基金总裁拉里奥，双方就中国与国际农业发展基金合作等问题交换了意见。财政部副部长廖岷陪同会见。（财政部）", "ctime": 1795778958, "time_str": "19:29:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261127/c682314705.shtml"}, {"id": "5775963", "title": "中国海警依法驱离日非法进入我钓鱼岛领海船只", "content": "中国海警局新闻发言人姜略表示，11月26日，日本“第三奖弥丸”号渔船非法进入中国钓鱼岛领海，中国海警舰艇依法对其采取必要管控措施并警告驱离。钓鱼岛及其附属岛屿是中国固有领土，我们敦促日方立即停止在该海域的一切侵权挑衅行径。中国海警将持续在钓鱼岛及其附属岛屿领海内开展维权执法，维护国家领土主权和海洋权益。（央视新闻）", "ctime": 1795778763, "time_str": "19:26:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261127/c682314652.shtml"}, {"id": "5775955", "title": "我国工程机械行业持续稳中向好", "content": "记者从中国工程机械工业协会了解到，今年以来，工程机械行业保持增长，行业整体延续稳中向好运行态势。最新数据显示，今年1至10月份，工程机械行业的代表产品挖掘机累计销售234499台，同比增长22%。此外，装载机累计销售约12.9万台，同比增长23.5%。工程机械产品国内外市场同步发力，其中海外市场正成为行业增长的重要引擎。今年前10个月，不少工程机械企业出口额已经占到全部销售额的50%以上。（央视新闻）", "ctime": 1795778628, "time_str": "19:23:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261127/c682314605.shtml"}, {"id": "5775943", "title": "粤海饲料：拟质押资产申请开具不超过人民币6亿元银行承兑汇票", "content": "粤海饲料公告，公司及下属子公司拟以结构性存款、定期存单等资产进行质押，向银行申请开具不超过人民币6亿元的银行承兑汇票，用于对外支付货款，期限为自股东会审议通过之日起12个月。该事项已获董事会审议通过，尚需提交股东会审议批准。", "ctime": 1795778432, "time_str": "19:20:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261127/c682314534.shtml"}, {"id": "5775929", "title": "富创精密：拟以1亿元-2亿元回购公司股份", "content": "富创精密公告，拟以集中竞价交易方式回购公司股份，回购资金总额不低于人民币1亿元（含），不超过人民币2亿元（含），回购价格不高于人民币182.53元/股（含）。回购股份用途为用于员工持股计划及/或股权激励，并将在公司披露股份回购实施结果暨股份变动公告后三年内使用完毕；若未能在规定期限内使用完毕，尚未使用的已回购股份将被注销。回购期限自公司董事会审议通过本次回购股份方案之日起不超过十二个月。", "ctime": 1795778138, "time_str": "19:15:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261127/c682314434.shtml"}, {"id": "5775915", "title": "*ST英飞：公司因2019年虚增营收4.92亿元等被罚550万元", "content": "*ST英飞公告，公司及相关当事人收到深圳证监局《行政处罚决定书》。经查明，公司全资子公司英飞拓系统和新普互联2019年至2020年通过虚构项目、提前确认收入等方式，导致公司2019年、2020年分别虚增营业收入4.92亿元、3.78亿元，分别占当期报告记载金额的10.36%、7.21%；虚增利润总额8436.43万元、4813.29万元，分别占当期报告记载金额的108.04%、44.72%。深圳证监局决定对公司给予警告并处以550万元罚款，对刘肇怀、刘新宇、饶轩志分别处以220万元罚款，对叶剑处以150万元罚款，对张衍锋、李德富分别处以110万元罚款，对刘兢处以60万元罚款，对华元柳、韩磊分别处以50万元罚款。", "ctime": 1795778027, "time_str": "19:13:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261127/c682314407.shtml"}, {"id": "5775905", "title": "以军宣称黎真主党利用民用渔船搜集情报", "content": "当地时间27日，以色列国防军发表声明说，根据对近期在黎以交界海域活动人员的审讯结果，黎巴嫩真主党正利用民用渔船作为掩护，派遣人员靠近以军在黎巴嫩南部近海单方面划设的所谓“海上安全区”，对以色列海军部队进行拍摄并搜集情报。以军在声明中指责黎巴嫩真主党利用海上区域从事军事活动，以军同时向黎巴嫩沿海居民和作业渔民发出警告，要求其切勿进入以军活动区域，并与在该海域执勤的以军舰艇保持安全距离。以军表示，目前正密切监控相关海域动态，并将继续采取行动消除安全威胁。（央视新闻）", "ctime": 1795777975, "time_str": "19:12:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261127/c682314347.shtml"}, {"id": "5775883", "title": "ST葫芦娃：获沙库巴曲缬沙坦钠片药品注册证书", "content": "ST葫芦娃公告，公司近日收到国家药监局核准签发的沙库巴曲缬沙坦钠片《药品注册证书》，药品批准文号为国药准字H20266654、国药准字H20266655，规格为100mg、200mg，注册分类为化学药品4类，批准后视同通过仿制药质量和疗效一致性评价。截至公告披露日，除公司外国内已批准上市该药品的生产企业共46家。公司对该产品已累计投入研发费用1491.95万元（未经审计）。", "ctime": 1795777929, "time_str": "19:12:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261127/c682314331.shtml"}, {"id": "5775877", "title": "中国证监会：会同有关方面抓紧研究出台相关增量政策", "content": "11月27日，中国证监会党委书记、主席吴清主持召开党委（扩大）会议，传达学习上午国务院常务会议精神，研究部署贯彻落实举措。会议强调，要坚持目标导向、问题导向，落实落细各项存量政策，会同有关方面抓紧研究出台相关增量政策。一要持续完善资本市场稳市机制。国常会强调，加力发挥“国家队”稳市作用，进一步优化中央汇金公司的类“平准基金”功能，提供充足流动性保障。证监会要主动、全力做好相关工作，更好发挥各方稳市合力。鼓励引导上市公司加大分红回购力度，用好用足两项结构性货币政策工具。二要进一步壮大中长期投资力量。持续实施好中长期资金入市指导意见及实施方案，推动完善保险、企业年金、社保基金等中长期资金入市支持引导政策，进一步拓宽资金来源、渠道和入市方式，推动全面落实长周期考核等要求，增强股市内在稳定性。三要加强输入性风险防范应对。密切关注国际经济金融形势变化，强化跨境跨市场跨行业风险监测应对，动态完善政策工具箱。进一步稳定市场预期。四要持续深化资本市场改革。坚持以改革促稳定、促发展，加快多层次资本市场发展，研究构建适配科技创新规律的直接融资制度体系。进一步提高上市公司质量和投资价值。五要依法强化全链条监管。严把入口关，强化持续监管和稽查执法，坚决查处财务造假、违规减持等行为，有效保护投资者合法权益。（证监会）", "ctime": 1795777893, "time_str": "19:11:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261127/c682314320.shtml"}, {"id": "5775865", "title": "国投资本：拟将2673.27万股回购股份用途变更为注销并减少注册资本", "content": "国投资本公告，公司拟将回购专用证券账户中的2673.27万股股份的回购用途进行变更，由“用于转换公司可转债”变更为“用于注销并相应减 // 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
