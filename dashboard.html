7729907, "time_str": "15:38:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260826/c679303129.shtml"}, {"id": "5031335", "title": "国电南瑞：2026年上半年净利润30.73亿元，同比增长4.08%", "content": "国电南瑞公告，2026年上半年营业收入277.67亿元，同比增长14.54%；归属于上市公司股东的净利润30.73亿元，2025年上半年为29.52亿元，同比增长4.08%；归属于上市公司股东的扣除非经常性损益的净利润29.25亿元，同比增长4.31%。公司拟每股派发现金红利0.153元（含税），拟派发现金红利12.22亿元（含税）。", "ctime": 1787729903, "time_str": "15:38:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260826/c679303128.shtml"}, {"id": "5031307", "title": "伊朗问题是否在此次上合峰会讨论范畴中？外交部：会适时发布消息", "content": "8月26日，外交部发言人林剑主持例行记者会。彭博社记者提问，关于习近平主席参加上合组织峰会和访问埃及有关情况，您刚才提到地区与国际安全将是此访的重点议题，请问伊朗问题是否会在讨论的范畴中？关于如何解决地区冲突，外交部能否提供更多细节？林剑表示，关于访问的具体信息，我们会适时发布消息，请你保持关注。（澎湃）", "ctime": 1787729699, "time_str": "15:34:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260826/c679303047.shtml"}, {"id": "5031255", "title": "外交部回应加拿大宣布对美国商品加征反制关税", "content": "就加拿大和美国的贸易谈判未能达成协议、加拿大宣布对美国商品加征反制关税，外交部发言人林剑26日在例行记者会上答问时表示，中方一贯主张各方通过平等对话协商来解决各自经贸关切。（新华社）", "ctime": 1787729411, "time_str": "15:30:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260826/c679302806.shtml"}, {"id": "5031247", "title": "阿里“千问办公”国际版开启公测", "content": "8月26日，阿里巴巴旗下千问办公国际版（QwenWork）开启公测。即日起，海外的个人用户和企业用户都可以通过国际官网qwenwork.ai体验，目前网页版和PC客户端已经开放。（第一财经）", "ctime": 1787729314, "time_str": "15:28:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260826/c679302774.shtml"}, {"id": "5031231", "title": "韩国今年6月、第二季度及上半年出生人口规模均创下近7年同期最高纪录", "content": "韩国今年6月、第二季度及上半年出生人口规模均创下近7年同期最高纪录。", "ctime": 1787729171, "time_str": "15:26:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260826/c679302697.shtml"}, {"id": "5031215", "title": "摩根士丹利：英伟达表外融资隐含2000亿美元风险敞口", "content": "摩根士丹利企业信贷团队近日发布研报，将英伟达的信用评级定为“中性”，并指出该公司通过大规模融资安排支持人工智能基础设施建设，已形成了约2000亿美元的潜在信用敞口。分析团队将这一现象称为“资产负债表即服务”。摩根士丹利信贷分析师林赛·泰勒和尼尚特·萨蒂亚姆估算，到2028年底，英伟达整体信用敞口约为2000亿美元，其中约1700亿美元涉及客户兜底相关的调整项和或有负债。不过，即便计入这些敞口，英伟达资产负债表仍具韧性：总债务杠杆率仅0.4倍，假设2028年增长趋于平稳后也仅升至0.7倍，峰值债务水平至少需再翻倍才可能触发标普评级下调。分析师以“中性”评级起步，建议投资者保持耐心，因目前缺乏有效方式评估尾部风险，且生态系统中超过1万亿美元的供应商循环不透明融资正通过“创造性结构”持续运作。", "ctime": 1787729036, "time_str": "15:23:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260826/c679302649.shtml"}, {"id": "5031205", "title": "智元灵巧手子公司临界点获得机器人运动会7枚金牌", "content": "8月22日—26日，第二届世界人形机器人运动会在北京举行。在近两天的灵巧手专项比赛决赛中，智元旗下灵巧手子公司临界点进入全部八个项目决赛，临界点灵巧手OmniHand以量产版本参与灵巧手所有赛项，获得了“积木搭建”“粉末称重”“镊子夹豆”等7个项目的金牌。（人民财讯）", "ctime": 1787728946, "time_str": "15:22:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260826/c679302588.shtml"}, {"id": "5031199", "title": "金风科技与Dunarea Power签约罗马尼亚Topalu储能项目", "content": "据金风科技消息，近日，金风科技与Dunarea Power签署合作协议，共同推进罗马尼亚Topalu储能项目建设。项目采用交钥匙建设模式，配置7台金风GWH170-7.2MW风机及10.8MW/23.4MWh金风电池储能系统。储能系统交付范围涵盖28台储能设备、中压变压器系统及全场能量管理系统（EMS），项目预计于年内并网投运，标志着金风科技在欧洲市场再落一子。", "ctime": 1787728859, "time_str": "15:20:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260826/c679302524.shtml"}, {"id": "5031197", "title": "光大期货：地缘溢价一朝回吐，燃料油一度暴跌逾8%", "content": "从基本面看，燃料油市场的供应紧张格局并未根本改变。新加坡企业发展局数据显示，截至8月19日当周，新加坡燃料油库存为1826.9万桶，周环比减少195万桶。低硫方面，由于东西套利窗口关闭，未来几周来自西方市场的到货量减少，短期内合规低硫船燃供应有限。但在地缘情绪面前，基本面的支撑在燃料油高价的背景下显得苍白无力。后市而言，短期燃料油走势或将取决于霍尔木兹海峡局势的下一步演变。若停火协议正式签署、海峡逐步恢复通航，地缘风险溢价大概率继续回吐，燃料油仍有下行空间；但若谈判再度反复、局势重回僵持，前期累积的跌幅也可能快速修复。在消息面极度不稳定的阶段，燃料油的高波动属性或将进一步放大。（光大期货）", "ctime": 1787728858, "time_str": "15:20:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260826/c679302522.shtml"}, {"id": "5031183", "title": "财政部：7月份全国共销售彩票875.71亿元 同比增长68.6%", "content": "财政部数据显示，7月份，全国共销售彩票875.71亿元，同比增加356.22亿元，增长68.6%，主要是足球世界杯期间竞猜型彩票销量增长较快。其中，福利彩票机构销售156.31亿元，同比减少22.96亿元，下降12.8%；体育彩票机构销售719.40亿元，同比增加379.18亿元，增长111.5%。1-7月累计，全国共销售彩票4144.45亿元，同比增加446.42亿元，增长12.1%。其中，福利彩票机构销售1157.20亿元，同比减少93.17亿元，下降7.5%；体育彩票机构销售2987.25亿元，同比增加539.60亿元，增长22.0%。", "ctime": 1787728705, "time_str": "15:18:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260826/c679302410.shtml"}, {"id": "5031177", "title": "川恒股份：目前未收到主管部门对公司主要出口产品限制出口的文件", "content": "川恒股份8月26日在互动平台表示，目前未收到主管政府部门对公司主要出口产品限制出口的相关文件。", "ctime": 1787728680, "time_str": "15:18:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260826/c679302385.shtml"}, {"id": "5031165", "title": "高盛当前预计澳大利亚央行将在11月加息", "content": "高盛经济学家Andrew Boak等人周三在研报中称，鉴于通胀数据强于预期，预计澳大利亚央行将在11月将现金利率上调至4.6%。此前预测会按兵不动。", "ctime": 1787728479, "time_str": "15:14:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260826/c679302267.shtml"}, {"id": "5031161", "title": "希腊数小时新增39场野火 海军基地暂无风险", "content": "希腊消防部门25日通报，该国各地数小时内新增39场野火，持续干旱带来的野火风险仍处于高位。据希腊广播和电视组织、德新社等媒体报道，此次灾情最严重的一场野火肆虐于萨拉米斯岛。该岛位于希腊首都雅典以西约20公里的萨罗尼克湾，岛上设有希腊最大的海军基地。参与灭火的消防员说，海军基地暂无火情风险。大火在萨拉米斯岛的一处峡谷地带蔓延。希腊当局派遣多架消防飞机与直升机，出动大批消防员以及志愿者赶赴现场灭火。（新华社）", "ctime": 1787728417, "time_str": "15:13:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260826/c679302247.shtml"}, {"id": "5031159", "title": "国家知识产权局关于做好《专利优先审查管理办法》有关实施工作的通知", "content": "新修订的《专利优先审查管理办法》将于2026年9月1日起正式实施，2017年发布的《专利优先审查管理办法》同时废止。为保障新旧规章平稳过渡、优先审查业务有序衔接，现将有关事项通知如下：2026  false, "source": "", "url": "https://news.10jqka.com.cn/20260826/c679302061.shtml"}, {"id": "5031093", "title": "算力用电爆发式增长 江苏常熟算力耗电超过空调", "content": "江苏常熟一家智算中心8月最大用电负荷较去年同期增长超70%，算力产业最高用电负荷已达20万千瓦，占全市用电负荷比重约4.1%。国网常熟市供电公司表示：“算力产业贡献全市近半数用电负荷增量，占比约49%，反映出算力负荷逐步取代季节性空调负荷，成为今夏用电增长的核心主力。”7月，江苏106家算力中心企业用电量突破13亿千瓦时，同比增长31%，其中超算和智算中心用电量占比超8成。根据预测，到2030年，我国数据中心用电量预计将激增至8000亿度。与此同时，我国光伏和风电装机也将增长到28亿千瓦以上。面对海量算力与绿电消纳的双重挑战，多地正通过算电协同，让算力跟着绿电走，实现降成本与促消纳的双赢。在内蒙古乌兰察布，全球单体最大的智算中心正在探索绿电直供的新模式，通过自建风电场和AI电力系统给智算中心供电，解决智算和绿电的波动性难题。 (央视财经)", "ctime": 1787727878, "time_str": "15:04:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260826/c679302006.shtml"}, {"id": "5031075", "title": "欧洲主要股指开盘多数上涨", "content": "欧洲主要股指开盘多数上涨，欧洲斯托克50指数涨0.21%，英国富时100指数涨0.18%，法国CAC40指数涨0.35%，德国DAX指数跌0.05%。", "ctime": 1787727830, "time_str": "15:03:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260826/c679301986.shtml"}, {"id": "5031069", "title": "习近平将出席2026年上海合作组织峰会并对吉尔吉斯斯坦、埃及进行国事访问", "content": "外交部发言人8月26日宣布：8月30日至9月3日，国家主席习近平将出席在比什凯克举行的2026年上海合作组织峰会，并应吉尔吉斯斯坦总统扎帕罗夫、埃及总统塞西邀请对两国进行国事访问。(新华社)", "ctime": 1787727815, "time_str": "15:03:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260826/c679301978.shtml"}, {"id": "5031059", "title": "ETF两市成交额报4256.08亿元，较昨日此时缩量232.51亿元", "content": "截至目前，ETF两市成交额报4256.08亿元，较昨日此时缩量232.51亿元，分类型来看，股票型ETF成交额1365.91亿元，债券型ETF成交额1882.47亿元，货币型ETF成交额229.92亿元，商品型ETF成交额115.45亿元，QDII型ETF成交额662.34亿元。", "ctime": 1787727797, "time_str": "15:03:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260826/c679301973.shtml"}, {"id": "5031035", "title": "A股收评：创业板指冲高回落涨0.51% 大金融方向表现强势", "content": "截至收盘，上证指数涨0.59%报3912.52点，深证成指涨0.69%报13841.33点，创业板指涨0.51%报3414.88点，北证50 // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';

  return '#64748b';

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
