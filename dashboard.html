html"}, {"id": "4350273", "title": "恺英网络设立AI内容公司时光川行", "content": "5月12日，据恺英网络消息，恺英网络于近日设立AI内容公司时光川行（Moment Stream），专注于AI微短剧与AI漫剧的一体化制作。公司以自研垂类视频生成模型为核心技术底座，构建从IP、剧本到多镜头视频内容的工业化生产体系，为AI内容产业的规范化、规模化发展提供完整解决方案。（界面新闻）", "ctime": 1778558881, "time_str": "12:08:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260512/c676620199.shtml"}, {"id": "4350271", "title": "瑞声科技高功率液冷CDU规模化量产", "content": "瑞声科技旗下远地科技ATAHORAN系列2.2MW/2.6MW集中式液冷CDU近日实现规模化量产，并同步开启全球批量交付。月交付产能达400台。（财联社）", "ctime": 1778558867, "time_str": "12:07:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260512/c676620191.shtml"}, {"id": "4350257", "title": "港股午评：恒生指数涨0.3%，恒生科技指数跌0.39%", "content": "港股午间收盘，恒生指数涨0.3%，恒生科技指数跌0.39%。恒指港股通ETF银华（159318）涨0.15%，港股通科技ETF鹏华（159751）跌0.83%。板块方面，化学制品、林业与纸制品板块涨幅靠前；半导体产品与设备、生物科技板块跌幅靠前。个股方面，经纬天地（旧）涨16.18%，经纬天地涨15.59%，滴普科技涨12.14%，博泰车联涨6.66%，希迪智驾涨6.56%；乐动机器人跌15.58%，汇聚科技跌11.52%，中国星集团跌11.41%，优然牧业跌8.31%，先导智能跌8.04%。", "ctime": 1778558520, "time_str": "12:02:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260512/c676620100.shtml"}, {"id": "4350233", "title": "5月12日午间公告一览：恒瑞医药称与百时美施贵宝公司达成全球战略合作及许可协议", "content": "恒瑞医药公告，公司与百时美施贵宝公司达成全球战略合作及许可协议，共同推进13款涵盖肿瘤学、血液学及免疫学的早期项目。根据协议，BMS将向恒瑞支付可达9.5亿美元的相关付款，包括6亿美元首付款、第一笔周年付款1.75亿美元，以及第二笔有条件的2028年周年付款1.75亿美元。协议的潜在总交易额可达约152亿美元，包括共同研发项目选择权的行使，以及所有项目达成相应的开发、注册及商业化里程碑。", "ctime": 1778558378, "time_str": "11:59:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260512/c676620002.shtml"}, {"id": "4350223", "title": "去哪儿旅行：本周机票均价跌超40% 热门航线重回300元档", "content": "去哪儿旅行数据显示，国内航线机票均价自5月5日触顶后开始下行，与“五一”假期相比，本周机票均价下跌41%；民航市场步入传统出行淡季，机票价格有望继续下探。多条热门航线票价同步大幅跳水，当前至6月初淡季，北京—南京直飞裸票机票价格低至300元，北京至哈尔滨、西安、宁波等地均有300元低价裸票在售。（人民财讯）", "ctime": 1778558073, "time_str": "11:54:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260512/c676619931.shtml"}, {"id": "4350209", "title": "泡泡玛特开始卖茶饮！首店落户阿那亚，或将推出自营产品", "content": "5月12日上午消息，有消息人士透露，泡泡玛特旗下甜品品牌POP BAKERY首家直营门店即将落地于秦皇岛阿那亚。与以往不同的是，该门店首次增设了茶饮产品。未来，泡泡玛特或将进一步推出自营茶饮与咖啡产品。（新浪科技）", "ctime": 1778557793, "time_str": "11:49:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260512/c676619833.shtml"}, {"id": "4350205", "title": "西十高铁全线拉通试验正式启动", "content": "5月12日，随着DJ（动检）602次综合检测列车从西安东站平稳驶出，沿西十高铁正线穿越秦岭直达十堰东站，标志着西十高铁首次全线拉通试验正式启动，西十高铁联调联试工作取得重要阶段性进展，为后续试运行和开通运营奠定了坚实基础。全线拉通试验是高铁开通运营前的综合大考与实战彩排，将此前单项测试成果整合，对轨道、供电、接触网、信号、通信等全系统开展综合验证，确保各项指标全面达标、系统匹配稳定，满足高速行车安全标准。此次全线拉通试验，西安铁路局采用“综合检测列车+确认列车”双车协同模式，分线路、分速度等级开展系统性测试。确认列车以最高120公里/小时前置巡检轨道、接触网状态，为高速检测安全开路；CRH380AJ型综合检测列车按计划完成逐级提速、区间折返、非接触复测等测试，正线按设计时速350公里运行，精准采集轨道几何、接触网参数、信号响应等关键数据，为线路精调优化提供科学依据。西十高铁开通后，西安至十堰将实现1小时左右到达，西安至襄阳预计2小时到达，西安至武汉3小时可达，将进一步完善全国高速铁路网。（央视新闻）", "ctime": 1778557757, "time_str": "11:49:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260512/c676619825.shtml"}, {"id": "4350157", "title": "A股午评：三大指数高开低走上证指数跌0.4% 全市场超4200家个股下跌", "content": "截至午盘，上证指数跌0.4%，深证成指跌0.89%，创业板指跌0.37%，北证50跌0.62%。\n板块题材上，电网设备、证券、光纤概念板块涨幅居前；能源金属、猪肉板块跌幅居前。\n盘面上，电网设备持续走高，大连电瓷、通达股份、汉缆股份、太阳电缆等数只个股涨停。证券板块震荡走高，长城证券逼近涨停，东方证券涨超3%。光纤概念高开高走，唯科科技、通光线缆20CM涨停，杭电股份、远东股份涨停，板块内多只个股创历史新高。能源金属板块震荡走弱，寒锐钴业跌超7%，永杉锂业、天齐锂业跌近4%。猪肉板块持续走弱，华统股份逼近跌停，天康生物、金新农、ST龙大跌超5%。", "ctime": 1778556708, "time_str": "11:31:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260512/c676619398.shtml"}, {"id": "4350153", "title": "ETF两市成交额3008.23亿元", "content": "截至目前，ETF两市成交额报3008.23亿元，分类型来看，股票型ETF成交额1146亿元，债券型ETF成交额1156.04亿元，货币型ETF成交额155.23亿元，商品型ETF成交额53.00亿元，QDII型ETF成交额322.03亿元。其中，成交额最高的非货币型ETF分别是中韩半导体ETF（513310）、香港证券ETF（513090）、A500ETF（159352）成交额分别为：104.82亿元、52.23亿元、44.57亿元", "ctime": 1778556685, "time_str": "11:31:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260512/c676619392.shtml"}, {"id": "4350151", "title": "ETF午评：科创半导体设备ETF领涨2.26%，稀土ETF领跌3.44%", "content": "ETF午间收盘涨跌不一，科创半导体设备ETF（588710）领涨2.26%，科创半导体ETF（588170）涨2.20%，科创半导体设备ETF（589020）涨2.09%，稀土ETF（159713）领跌3.44%，稀土ETF（516150）跌3.38%，疫苗ETF（159643）跌3.29%。", "ctime": 1778556656, "time_str": "11:30:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260512/c676619381.shtml"}, {"id": "4350149", "title": "部分指标达国际先进 我国微机电系统关键射频参数计量技术取得突破", "content": "记者今天了解到，市场监管总局针对我国微机电系统（MEMS）射频参数计量标准缺失、信号完整性测试及可靠性研究能力不足的问题，近期组织国内相关科研机构，开展了MEMS关键射频参数计量测试技术攻关，显著提升了我国MEMS介电常数、脉冲波形、光子链路定位、电磁辐射等参数的计量测试能力，解决了MEMS关键射频参数的计量测试与应用问题。该研究成功研制基材介电常数计量装置、太赫兹波形计量装置、光子链路定位参数计量装置、微互连电磁泄漏总辐射功率测试装置、微机电系统电接触和互连电参数测试装置等多项技术成果，部分指标达到国际先进水平。研究团队牵头起草《皮秒级快沿/脉冲发生器校准规范》等3项国家计量技术规范，健全了我国在微机电系统测量及相关仪器仪表领域的质量保证体系。目前，相关研究成果已在5G高频器件、光电集成器件及机载光网络领域开展示范应用，助力我国滤波器等5G高频器件创新研发、保障故障诊断定位的准确可靠，有力支撑了我国新一代信息技术、航空航天等战略性新兴产业的高质量发展。（央视新闻）", "ctime": 1778556630, "time_str": "11:30:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260512/c676619376.shtml"}, {"id": "4350147", "title": "股指期货早盘收盘 主力合约全线下跌", "content": "股指期货早盘收盘，主力合约全线下跌。沪深300股指期货(IF)主力合约跌0.31%，上证50股指期货(IH)主力合约跌0.03%，中证500股指期货(IC)主力合约跌0.84%，中证1000股指期货(IM)主力合约跌0.89%。", "ctime": 1778556618, "time_str": "11:30:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260512/c676619374.shtml"}, {"id": "4350141", "title": "研究称南极可能正从全球变暖“缓冲器”变为“放大器”", "content": "澳大利亚新南威尔士大学11日发布公报说，该校科研人员参与的一个国际研究团队发现，数十年来，南极海冰似乎对全球变暖具有一定的抵御能力，帮助减缓气候变化速度，但一系列海洋和大气变化使南极海冰在2015年后突然急剧减少，这种系统性转变可能会加速全球变暖。论文第一作者、英国南安普敦大学研究员、澳大利亚新南威尔士大学访问研究员阿迪蒂亚·纳拉亚南说，南极如今可能正从全球变暖“缓冲器”转变为“放大器”。研究论文已发表在美国《科学进展》杂志上。（新华社）", "ctime": 1778556565, "time_str": "11:29:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260512/c676619350.shtml"}, {"id": "4350127", "title": "远景能源、包头国资等成立碳足迹科技公司", "content": "企查查APP显示，近日，包头正信瑞骐远景碳足迹科技有限公司成立，法定代表人为崔江峰，注册资本为1000万元，经营范围包含：信息技术咨询服务；环保咨询服务；节能管理服务；软件开发；认证服务；电子认证服务等。企查查股权穿透显示，该公司由包头正信投资集团有限公司、远景能源有限公司全资子公司内蒙古新远景集团有限公司等共同持股。（人民财讯）", "ctime": 1778556388, "time_str": "11:26:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260512/c676619253.shtml"}, {"id": "4350115", "title": "沪深两市成交额连续第22个交易日突破2万亿 较上一日此时缩量超1700亿", "content": "沪深两市成交额连续第22个交易日突破2万亿 较上一日此时缩量超1700亿，预计全天成交金额超3.2万亿。", "ctime": 1778555930, "time_str": "11:18:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260512/c676619117.shtml"}, {"id": "4350111", "title": "全国春灌已全面铺开 累计灌溉面积3.6亿亩", "content": "记者从水利部了解到，当前，全国湖库蓄水较常年同期偏多，灌溉水源相对充足，大部分地区耕地土壤墒情适宜，春季农业生产用水有保障。截至目前，全国春灌已全面铺开，累计灌溉面积3.6亿亩。其中，5000余处大中型灌区开灌，累计灌溉面积2.6亿亩。（央视新闻）", "ctime": 1778555896, "time_str": "11:18:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260512/c676619107.shtml"}, {"id": "4350109", "title": "湖北率先给人形机器人办理“数字身份证”", "content": "5月12日，据湖北人形机器人创新中心官方微信公众号消息，近日，湖北人形机器人创新中心在全国率先启动人形机器人“数字身份证”登记，实现一机一码、全程可溯、权责可究。", "ctime": 1778555828, "time_str": "11:17:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260512/c676619054.shtml"}, {"id": "4350103", "title": "前4个月云南磨憨口岸进口鲜榴莲超12万吨", "content": "随着榴莲进入集中上市期，位于中老边境的云南磨憨口岸迎来进口高峰期，一箱箱产自老挝、泰国等东盟国家的新鲜榴莲经此快速通关，奔赴国内千家万户。据昆明海关统计，今年前4个月，磨憨公路口岸、铁路口岸累计进口鲜榴莲12.1万吨，同比增长1.7倍，进口量占全国鲜榴莲进口总量的三分之一，其中仅4月进口榴莲达8.2万吨。（新华社）", "ctime": 1778555616, "time_str": "11:13:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260512/c676618990.shtml"}, {"id": "4350101", "title": "柬埔寨国会通过《兵役法》草案", "content": "总台记者获悉，当地时间5月12日，柬埔寨国会通过《兵役法》草案，随后将提交柬埔寨参议院进行审议。草案规定，凡年龄介于18岁至25岁之间的柬埔寨男性公民，均须依法履行兵役义务，服役期为24个月，特殊情况下可延长6个月，逃避兵役者将面临罚款及监禁处罚。（央视新闻）", "ctime": 1778555429, "time_str": "11:10:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260512/c676618945.shtml"}, {"id": "4350097", "title": "印尼一天内两火山喷发", "content": "据印尼火山监测机构消息，今天（5月12日）上午，位于印度尼西亚北马鲁古省杜科诺火山发生喷发，火山灰柱高度达到约2000米，喷发持续时间为241秒。当天上午，位于印度尼西亚东爪哇省的塞梅鲁火山也发生喷发，火山灰柱高约800多米，持续时间为182秒。（CCTV国际时讯）", "ctime": 1778555257, "time_str": "11:07:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260512/c676618891.shtml"}, {"id": "4350089", "title": "“微信状态可看访客记录”话题刷屏，腾讯回应", "content": "近日，“微信状态可看访客记录”相关话题广受关注。有消息称，微信状态新增访客查看相关功能，目前该功能或处于内测阶段，其中浏览人数大概率对应 “查看过你状态的人数”，而非点击次数。点击浏览人数后显示的头像，既包括浏览过你状态的用户，也包括同期发布状态的用户。针对上述传闻，5月12日，腾讯方面回应记者称，微信状态已停止测试状态浏览者人数展示功能。后续将对相关功能进行小范围测试，并根据用户反馈做优化。微信状态并未提供或测试查看访客记录的能力。（中证金牛座）", "ctime": 1778555205, "time_str": "11:06:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260512/c676618871.shtml"}, {"id": "4350083", "title": "我国国产高端数控机床智能组线可靠性与质量一体化技术取得突破", "content": "记者今天了解到，“十四五”期间，针对我国汽车动力总成大批量制造质量不稳定、智能组线设计及制造标准依赖进口等瓶颈问题，市场监管总局组织国内优势科技力量，开展了国产高端数控机床智能组线可靠性与质量一体化技术攻关。研究团队突破了复杂工况下机床精度与质量参数的自适应动态映射、多工序制造误差流建模等关键技术，揭示了组线可靠性退化与产品精度保持性的耦合机理。建立了“端—边—云”协同的装备故障诊断技术与虚实融合的数字孪生系统，研制出支持质量控制、可靠性评估与智能维护的动态生产运作协同优化平台，实现了智能组线实时检测与维护决策的自主可控。目前，研究成果已在相关企业的新能源车动力总成和燃油汽车动力总成的生产线规模化应用，实测平均无故障工作时间（MTBF）超过2500小时，设备综合效率（OEE）超过85%，有效支撑了国产高端数控机床及智能组线的技术迭代与质量提升。（央视新闻）", "ctime": 1778554951, "time_str": "11:02:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260512/c676618788.shtml"}, {"id": "4350059", "title": "红果短剧乐力：抖音集团会持续加大对真人短剧投入", "content": "5月12日，抖音集团短剧版权中心举办首届短剧产业大会。红果短剧总编辑乐力表示，抖音集团会持续投入支持真人短剧的发展。短剧版权中心近期已推出多项真人短剧扶持计划，包括针对真人剧核心品类调高内容分成比例；设立单部最高150万元头部剧激励政策；推出最高20%的续作激励；设立2亿元专项资金，扶持现实主义、悬疑、都市群像等内容。相关负责人表示，2026年真人短剧保底扶持预算超15亿元，部均保底金额较去年提升约60%。", "ctime": 1778554730, "time_str": "10:58:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260512/c676618719.shtml"}, {"id": "4350053", "title": "花旗：日本或将动用高达30万亿日元进行外汇干预", "content": "花旗集团策略师认为，日本当局最终可能花费总计30万亿日元用于货币干预，而此前他们可能已经为此花费了 10万亿日元。日本的外汇储备超过1.3万亿美元。花旗策略师表示，如果日本财务省“接受此次外汇储备下降幅度与2022年至2024年期间大致相同的事实”，那么它可能需要花费约30万亿日元用于干预。 不过，考虑到与美国的关系，日本财务省“将尽一切努力避免对美国债券市场造成直接影响”。如果干预措施迫使美元兑日元汇率跌破155，则可能会“扼杀日本进口商（包括中小企业）购买美元的潜在需求”。鉴于供需动态改善以及当前的干预措施，美元兑日元上涨势头减弱，难以突破158-160区间。", "ctime": 1778554500, "time_str": "10:55:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260512/c676618649.shtml"}, {"id": "4350043", "title": "智元机器人发布“香港具身智能产业共创计划”", "content": "5月12日，在首届香港具身智能产业峰会暨智元APC2026（香港）现场，智元机器人联合香港政府、产业、学术、科研及金融界代表，正式发布“香港具身智能产业共创计划”。该计划围绕应用场景、创新创业、产学研合作、人才培养及国际合作五大方向，推动香港具身智能产业未来五年实现“个、十、百、千、万”目标：成立数个产研联合实验室、培育数十家具身智能创新企业、发展数百家产业伙伴，带动产业链、应用场景和创新力量协同发展，加速具身智能与真实商业需求结合，推动中国具身智能产业走向全球。（人民财讯）", "ctime": 1778554433, "time_str": "10:53:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260512/c676618630.shtml"}, {"id": "4350031", "title": "英国首相斯塔默被多名内阁成员要求设定辞职时间表", "content": "据英国多家媒体11日报道，多名英国内阁成员要求首相斯塔默设定辞职时间表，其中包括外交大臣库珀、内政大臣马哈茂德。 据英国独立电视台报道，库珀、马哈茂德等4名内阁大臣共同前往伦敦唐宁街10号首相府，要求斯塔默考虑为辞职设定时间表。英国《卫报》报道称，副首相兼司法大臣戴维·拉米和国防大臣约翰·希利据信与首相讨论了如何“负责任、有尊严、有序地”对未来作出安排。 报道同时说，此前已有4名政府助理宣布辞职，他们与超70位工党下院议员一道呼吁斯塔默辞职或设定辞职时间表。 据报道，斯塔默将于当地时间12日早间举行内阁会议，目前正在“权衡他的选择”。 今年以来，因任命与已故美国富商爱泼斯坦交往密切的曼德尔森为驻美大使，斯塔默已两度面临辞职压力。在日前举行的英国地方选举中，斯塔默领导的执政党工党遭遇重挫，在英格兰地区仅获本次选举约5000个席位中的1000余个，此次选举惨败令要求斯塔默下台的呼声再度高涨。 斯塔默11日发表讲话说，地方选举结果“严峻”、令人痛心，他愿承担责任，但不会“一走了之，让国家陷入混乱”。(新华社)", "ctime": 1778554376, "time_str": "10:52:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260512/c676618611.shtml"}, {"id": "4350007", "title": "上海微系统所：新型柔性单晶硅电池随天舟十号开展太空实验 为太空光伏奠定基础", "content": "中国科学院上海微系统所今日官微消息，5月11日，天舟十号货运飞船在文昌成功发射，搭载41项在轨科学实验载荷奔赴中国空间站。其中，由上海微系统所科研团队自主研发的柔性封装单晶硅太阳电池，将开展空间环境在轨实验，为我国商业航天、太空算力及太空光伏产业奠定基础。后续，该太阳电池将安置于空间站材料实验平台，开展粒子辐照、紫外辐照、原子氧等空间环境实验。试验样品返回后，科研团队将深度解析电池样品的性能和结构变化，对比地面与在轨数据，验证环境匹配度，研究性能衰减机理，攻克空间转换效率低、辐照衰减大等难题，研发高效可靠的低成本太阳翼能源技术。", "ctime": 1778554043, "time_str": "10:47:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260512/c676618466.shtml"}, {"id": "4350005", "title": "半导体板块持续拉升", "content": "半导体板块持续拉升，芯源微、沪硅产业、华海清科涨超10%，中晶科技、龙芯中科、东微半导、海光信息、甬矽电子等跟涨。相关ETF方面，芯片ETF广发（159801）涨1.48%，成交额1.44亿元，芯片ETF富国（516640）涨1.1%，成交额1.06亿元。", "ctime": 1778554000, "time_str": "10:46:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260512/c676618462.shtml"}, {"id": "4349999", "title": "OpenAI推出网络安全模型Daybreak", "content": "OpenAI正式推出网络安全模型Daybreak，其整合了GPT-5.5模型、Codex代码执行能力及26家头部安全厂商生态，旨在将AI防御能力嵌入软件开发全流程。奥尔特曼表示，Daybreak的推出是加速网络防御并持续保障软件安全的努力。AI在网络安全方面已经很出色，并且即将变得更加强大。(科创板日报)", "ctime": 1778553836, "time_str": "10:43:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260512/c676618370.shtml"}, {"id": "4349997", "title": "科创50指数涨幅扩大至1% 创历史新高", "content": "科创50指数涨幅扩大至1%，现报1734.23点，创历史新高。", "ctime": 1778553828, "time_str": "10:43:48", "stock_code": "", "stock_name": "", "stock_market tent": "在首届香港具身智能产业峰会上，智元创始人、董事长兼CEO邓泰华发布香港具身智能产业共创计划，宣布未来5年实现“个十百千万”目标。具体而言，将成立智元香港国际研发总部、成立数个产研联合实验室，培育数十家创新创业企业，发展数百家产业伙伴，创造数千亿营收产值，形成港交所具身智能数万亿总市值。", "ctime": 1778552379, "time_str": "10:19:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260512/c676617828.shtml"}, {"id": "4349917", "title": "外交部：不同意台湾地区参加今年WHA", "content": "第79届世界卫生大会（WHA）将于5月18日开幕，台当局迄今未收到与会邀请。“在中国台湾地区参与国际组织，包括世界卫生组织活动问题上，中方立场是一贯的、明确的，即必须按照一个中国原则来处理，这也是联合国大会第2758号决议和世界卫生大会25.1号决议确认的根本原则。”中国外交部发言人郭嘉昆11日表示，中国台湾地区在未经中央政府同意的前提下，没有任何根据、理由和权利参加世卫大会。台民进党当局顽固坚持“台独”分裂立场，导致台湾地区参加世卫大会的政治基础不复存在。郭嘉昆表示，为了维护一个中国原则，捍卫联合国大会及世卫大会相关决议的严肃性和权威性，中方决定不同意台湾地区参加今年世卫大会。任何违背一个中国原则、打“台湾牌”搞政治操弄的图谋都注定以失败告终。(环球时报)", "ctime": 1778552112, "time_str": "10:15:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260512/c676617668.shtml"}];

  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
