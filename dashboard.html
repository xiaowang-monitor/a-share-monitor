，经营范围包含风力发电技术服务；新能源原动设备制造；站用加氢及储氢设施销售；新材料技术研发；电池制造等。企查查股权穿透显示，该公司由明阳智能间接全资持股。（人民财讯）", "ctime": 1788501481, "time_str": "13:58:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260904/c679601870.shtml"}, {"id": "5108735", "title": "广州天河区1宗宅地溢价15.88%成交", "content": "9月4日，广州天河区1宗宅地出让，土地出让面积34718.7平方米（合52.08亩），规划建筑面积67805平方米，容积率1.95，起始价21.41亿元，起始楼面价31575元/平方米。该地块吸引了4家房企参拍，经过18轮竞价，最终越秀以总价24.81亿元竞得该地块，成交楼面价36589元/平方米，溢价率15.88%。（人民财讯）", "ctime": 1788501337, "time_str": "13:55:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260904/c679601791.shtml"}, {"id": "5108733", "title": "零售板块短线拉升，百大集团涨停", "content": "零售板块短线拉升，百大集团涨停，宁波中百此前封板，茂业商业、国芳集团、东百集团、珠免集团、中百集团等跟涨。", "ctime": 1788501312, "time_str": "13:55:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260904/c679601786.shtml"}, {"id": "5108731", "title": "特斯拉推出无人驾驶“赛博出租车”", "content": "美国电动汽车制造商特斯拉公司3日在得克萨斯州奥斯汀举行发布活动，推出无人驾驶出租车“赛博出租车”（Cybercab），并开始在当地限定区域提供乘车服务。 特斯拉首席执行官埃隆·马斯克在当天发布的宣传视频中称，“赛博出租车”是“首款专门为无人监督完全自动驾驶打造的汽车”。 特斯拉当天更新的官方网站页面显示，“赛博出租车”已成为其“自动驾驶出租车”（Robotaxi）车队的最新车型，在奥斯汀限定区域提供用车服务。乘客通过相关应用程序叫车后，系统根据车辆供应情况和乘客人数分配车辆。 特斯拉官网介绍，“赛博出租车”是一款双座车型，配备蝶翼式车门和大型交互触摸屏。车辆不配备方向盘、加速踏板和制动踏板，利用摄像头视觉系统和传感器实现全自动驾驶。车内设有停止按钮，乘客按下按钮后，车辆将在安全情况下尽快靠边停车，并接通特斯拉“自动驾驶出租车”支持人员。 特斯拉表示，有意购买“赛博出租车”用于商业用途的客户可以提交申请，但尚未公布“赛博出租车”正式售价、面向商业客户的交付时间以及扩大其载客区域的具体时间表。 特斯拉未公布实际投入运营的“赛博出租车”确切数量。据媒体援引得克萨斯州车辆登记数据报道，特斯拉在该州登记的自动驾驶汽车中包括45辆“赛博出租车”。(新华社)", "ctime": 1788501304, "time_str": "13:55:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260904/c679601784.shtml"}, {"id": "5108725", "title": "明新旭腾：电子皮肤等产品尚处前期研发及与客户联合开发阶段", "content": "明新旭腾在9月4日召开的2026年半年度业绩说明会上表示，公司电子皮肤、功能皮革等产品目前尚处于前期研发及与客户联合开发阶段。由于行业技术路线尚未形成统一标准，相关技术开发存在较大不确定性，暂未产生实际订单及收入。现有固定资产主要用于支持实验开发及中试、小试环节。未来，随着行业标准的逐步明确及客户产品定型，公司可适时推进产能的规模化扩展与批量交付。（人民财讯）", "ctime": 1788501109, "time_str": "13:51:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260904/c679601737.shtml"}, {"id": "5108719", "title": "银河通用人形机器人“银河星仔”全网预售，首日订单突破200台", "content": "9月4日，从银河通用处获悉，其首个原生智能体人形机器人“银河星仔”（Galbot ET1）上线预订24小时内订单量破200台。3日，“银河星仔”正式开启全网预订，该机器人搭载其全自研具身大模型，依托十万小时人类动作数据训练，具备自主感知决策与实时动作学习能力，无需人工预设动作脚本即可实现动态交互。目前产品主要面向文旅导览、演艺及商业展示等场景。（界面新闻）", "ctime": 1788501026, "time_str": "13:50:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260904/c679601706.shtml"}, {"id": "5108695", "title": "1-7月全国国有及国有控股企业（国有企业）营业总收入同比下降2.4%，利润总额同比增长0.6%", "content": "1-7月，国有企业营业总收入464466.4亿元，同比下降2.4%。1-7月，国有企业利润总额25089.9亿元，同比增长0.6%。(国资委)", "ctime": 1788500897, "time_str": "13:48:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260904/c679601632.shtml"}, {"id": "5108659", "title": "北部湾港集团与安通控股达成合作共识", "content": "9月3日，北部湾港集团赴福建省泉州市拜访安通控股。双方围绕服务西部陆海新通道、北部湾国际门户港和向海经济等国家和区域战略，就深化港航贸协同、拓展集装箱航线网络布局、推进货源市场共同开发等事宜开展座谈交流并达成合作共识。平陆运河通航在即，双方表示将抢抓机遇在加密航线与运力投入、加强外贸内支线合作、联合开展腹地货源营销等方面深化务实合作。（人民财讯）", "ctime": 1788500554, "time_str": "13:42:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260904/c679601484.shtml"}, {"id": "5108655", "title": "沪深京三市成交额超1.5万亿元，较上日此时放量1626亿元", "content": "据同花顺iFinD数据，沪深京三市成交额超1.5万亿元，较上日此时放量1626亿元，预计全天成交金额约2.0万亿元。截至目前，沪市成交额6792亿元，深市成交额8060亿元，北证50成交额153亿元。", "ctime": 1788500529, "time_str": "13:42:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260904/c679601476.shtml"}, {"id": "5108653", "title": "梅洛尼破二战后意大利连续执政时间纪录", "content": "9月4日是意大利总理梅洛尼连续执政第1413天，她由此成为第二次世界大战结束以来意大利连续执政时间最长的总理。二战后意大利连续执政时间最长的纪录此前由已故前总理贝卢斯科尼保持，为1412天。虽然贝卢斯科尼连续执政时长被梅洛尼超越，他依然是二战后意大利任职时间最长的总理。据统计，1994年至2011年，贝卢斯科尼四次执政，累计时长约9年。梅洛尼2022年10月就职。意大利党派林立，政府更迭频繁。据统计，二战结束后，意大利经历了近70次政府更迭。但过去几年，对比数度重新组阁的法国、数次更换首相的英国，意大利政局相对稳定。不过，近期民意调查结果显示，2027年议会选举后，意大利可能将出现更趋分裂且不稳定的政治格局。（央视新闻）", "ctime": 1788500474, "time_str": "13:41:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260904/c679601456.shtml"}, {"id": "5108633", "title": "科创50指数跌幅扩大至1%", "content": "科创50指数跌幅扩大至1%，现报1594.88点。", "ctime": 1788500187, "time_str": "13:36:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260904/c679601355.shtml"}, {"id": "5108613", "title": "大商所聚氯乙烯（PVC）主力合约大涨5%", "content": "大商所聚氯乙烯（PVC）主力合约大涨5%，报5135元/吨。", "ctime": 1788499962, "time_str": "13:32:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260904/c679601296.shtml"}, {"id": "5108579", "title": "半导体设备板块持续走低", "content": "半导体设备板块持续走低，强一股份跌超7%，华亚智能、金海通、微导纳米、矽电股份等跟跌。", "ctime": 1788499678, "time_str": "13:27:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260904/c679601181.shtml"}, {"id": "5108575", "title": "多只畜牧养殖ETF涨超5%", "content": "午后养殖业、猪肉、鸡肉板块持续拉升。多只畜牧养殖ETF、农牧渔ETF、农业ETF涨超5%，领涨ETF市场。", "ctime": 1788499651, "time_str": "13:27:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260904/c679601175.shtml"}, {"id": "5108571", "title": "西班牙首相否认摩洛哥策划休达偷渡潮", "content": "西班牙首相桑切斯3日说，没有“确凿证据”表明摩洛哥策划了涌入西班牙飞地休达的偷渡潮。此前西班牙警方报告指出，摩洛哥安全部队在此事件中存在失职行为。桑切斯3日在西班牙议会发言时说，没有任何执法、司法或国际机构“向西班牙政府提交确凿证据，证明摩洛哥策划或执行了这次（偷渡）事件”。西班牙政府会继续调查大批移民涌入的相关情况。法新社2日援引一份西班牙警方报告报道，摩洛哥警方“完全纵容”偷渡事件，助长了此次移民危机。报告称，摩洛哥边境口岸附近的警力“明显少于平时”，且警员“未采取实质行动”来阻止偷渡。不过，据法新社报道，此次移民危机发生几天后，一名摩洛哥消息人士否认该国边境口岸有任何警力“松懈”情况。（新华社）", "ctime": 1788499622, "time_str": "13:27:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260904/c679601168.shtml"}, {"id": "5108565", "title": "上官剑已任上海奉贤区委副书记", "content": "2026年9月3日，奉贤区召开党建引领物业治理专项工作机制2026年三季度工作会议。区委副书记上官剑参加会议并讲话。此前，上官剑担任上海团市委书记。上官剑，1980年8月出生，曾历任上海市委、市政府信访办副主任，上海团市委副书记、市青联主席等职务，2021年起任上海团市委书记。（上海奉贤）", "ctime": 1788499559, "time_str": "13:25:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260904/c679601157.shtml"}, {"id": "5108551", "title": "沙特AI公司Humain拟设立25亿美元数据中心基金", "content": "据报道，知情人士透露，沙特人工智能公司Humain计划面向海内外投资者募集首期25亿美元基金，用于投资沙特境内数据中心项目。该基金将为Humain与穆阿迈尔信息系统公司合作建设的250兆瓦数据中心项目提供资金支持，相关项目远期规模最高有望扩充至1吉瓦。（界面新闻）", "ctime": 1788499453, "time_str": "13:24:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260904/c679601147.shtml"}, {"id": "5108541", "title": "韩元兑美元触及自2025年7月1日以来最高水平", "content": "韩元兑美元触及自2025年7月1日以来最高水平。", "ctime": 1788499170, "time_str": "13:19:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260904/c679601093.shtml"}, {"id": "5108533", "title": "红旗连锁与广安发展集团签战略协议 携手打造“零售+城市运营”新模式", "content": "9月4日，红旗连锁与广安发展集团正式签署《战略合作协议》《品牌支持合作协议》，双方将整合优势资源，创新合作模式，在织密城乡便民服务网络、完善现代化供应链与物流体系、推进商贸数字化升级、深化农超对接等方面深入合作，建立全方位、深层次、多领域的战略合作伙伴关系。据悉，双方将打造“零售+城市运营”新模式，广安发展集团将在城市存量社区物业、新建片区商业配套及公共设施服务空间等方面提供全方位支持，为“红旗·发展惠”品牌的快速落地与场景拓展提供基础。（人民财讯）", "ctime": 1788499076, "time_str": "13:17:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260904/c679601084.shtml"}, {"id": "5108529", "title": "海尔成为欧洲冠军联赛全球官方合作伙伴", "content": "9月3日，在2026年柏林国际消费电子展（IFA）开幕前夕，海尔与UC3在德国柏林宣布达成合作。海尔将自2027/2028赛季起至2030/2031赛季，成为欧洲冠军联赛、欧洲超级杯、欧洲青年联赛决赛及欧洲五人制足球冠军联赛决赛的全球官方合作伙伴。(界面)", "ctime": 1788499042, "time_str": "13:17:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260904/c679601075.shtml"}, {"id": "5108511", "title": "SK海力士股价上涨5.0%，至1,676,000韩元", "content": "SK海力士股价上涨5.0%，至1,676,000韩元。", "ctime": 1788498862, "time_str": "13:14:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260904/c679601047.shtml"}, {"id": "5108509", "title": "深圳再向全国英才抛出橄榄枝，首场招聘会将释放超9000岗位", "content": "“百万英才汇南粤”2026年N城联动秋季招聘即将启动，深圳将赴北京、湖北、安徽三地的11所高校开展专场招聘。9月16日，深圳将在武汉大学承办全省启动式及首场招聘。随后，各区将分头行动，11场专场招聘精准对接全国重点高校的优势学科。截至目前，11所高校专场的已报名单位超700家，提供岗位超6万个，覆盖世界500强、央企、独角兽企业、上市公司及专精特新“小巨人”企业。备受关注的首场招聘会，将有超150家用人单位齐聚武汉大学，提供岗位超9000个。华为、腾讯、比亚迪、华润集团、中国平安等世界500强企业，中山大学、国家超级计算深圳中心（深圳云计算中心）、深圳湾实验室等高校院所，广发银行、中信证券、工商银行等金融机构，新凯来、影石创新等高新技术企业将悉数到场，岗位覆盖智慧医疗、金融科技、芯片半导体、算力与大模型等前沿领域。（21世纪经济报道）", "ctime": 1788498842, "time_str": "13:14:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260904/c679601044.shtml"}, {"id": "5108503", "title": "四川：拟实施新一轮粮食产能提升行动 整建制推进大面积单产提升", "content": "《四川省加快农业农村现代化“十五五”规划》印发。其中提到，全面落实耕地保护和粮食安全责任制，确保粮食播种面积稳定在9600万亩以上。实施新一轮粮食产能提升行动，深化“天府粮仓 百县千片”建设，开展“吨粮田”建设，推动“四良”（良田、良种、良机、良法）集成增效，整建制推进大面积单产提升。优化粮食种植结构和区域布局，持续提高水稻、玉米产能，稳定小麦生产，巩固大豆油料扩种成果，因地制宜发展秋冬马铃薯和再生稻。实行省级财政种粮大户补贴和粮食生产激励政策，落实稻谷最低收购价政策。全面推广三大粮食作物完全成本保险、大豆完全成本和种植收入保险。健全农资保供稳价应对机制，发挥供销合作社农资流通主渠道作用。（人民财讯）", "ctime": 1788498779, "time_str": "13:12:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260904/c679601033.shtml"}, {"id": "5108483", "title": "朱忠明任上海市副市长、代理市长", "content": "朱忠明任上海市副市长、代理市长。（澎湃新闻）", "ctime": 1788498567, "time_str": "13:09:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260904/c679600994.shtml"}, {"id": "5108473", "title": "首都机场临空经济区“十五五”规划正式发布", "content": "近日，《“十五五”时期首都机场临空经济区发展建设规划》已正式印发。根据规划，首都机场临空经济区未来五年将推动以航空服务为核心，以医药健康、临空智造、物流贸易、商务消费为支撑的“1+4”产业体系高质量发展，打造临空经济先行区，建设一流国际临空都市港。《规划》围绕枢纽、规模、产业、创新和质量五大维度，设置21项核心指标，明确到2030年，园区营收达到6200亿元，区级一般公共预算收入达40亿元，天竺综保区年进出口额达到2000亿元。“1+4”产业体系年均增速10%左右，天竺综保区绩效评估保持A类前列，高技术产业收入年均增速超10%，对顺义平原新城高质量发展的引领带动作用更加凸显。（北京顺义公众号）", "ctime": 1788498443, "time_str": "13:07:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260904/c679600978.shtml"}, {"id": "5108465", "title": "瑞迈特高管：国产家用呼吸机增长态势强劲 增速显著高于外资品牌", "content": "9月3日，瑞迈特召开新品发布会，推出E6AI旗舰睡眠呼吸机。会上，公司首席营销官陈潇对记者表示，近年来国内家用呼吸机赛道格局发生明显变化，国产家用呼吸机增长态势强劲，增速显著高于外资品牌。国产品牌在算法、产品体验以及本地化服务上持续迭代，国内市场份额持续抬升。（人民财讯）", "ctime": 1788498373, "time_str": "13:06:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260904/c679600971.shtml"}, {"id": "5108439", "title": "养殖业板块持续走高，新五丰涨停", "content": "养殖业板块持续走高，新五丰涨停，罗牛山、中水渔业、天邦食品此前封板，巨星农牧、温氏股份、益生股份、东瑞股份、牧原股份等跟涨。相关ETF方面，养殖ETF汇添富（159172）涨3.9%，成交额1313.14万元，农牧渔ETF华宝（159275）涨4.21%，成交额906.0万元。", "ctime": 1788498142, "time_str": "13:02:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260904/c679600938.shtml"}, {"id": "5108387", "title": "海外三大AI模型接连宕机近4小时：OpenAI忙预热GPT6，智谱称“我们还在线”", "content": "9月3日晚间，美国所有头部AI服务集体出现故障，ChatGPT、Claude、Grok宣布服务出现异常，谷歌Gemini、微软Copilot也收到大量中断报告。此次大规模“宕机”事件持续约3小时40分。OpenAI发言人表示，故障源于太平洋时间早7点43分出现的路由错误，导致部分用户无法访问ChatGPT和Codex，公司已部署修复方案并持续监控恢复情况。Anthropic技术部门员工则在社交媒体上表示，事件由“基础设施问题”引发，公司正在全力排查但暂无法给出预计恢复时间。智谱称“我们还在线”。（澎湃新闻）", "ctime": 1788497142, "time_str": "12:45:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260904/c679600834.shtml"}, {"id": "5108371", "title": "中央储备粮淮南直属库有限公司总经理王怀斌接受审查调查", "content": "中央储备粮淮南直属库有限公司党支部书记、总经理王怀斌涉嫌严重违纪违法，目前正接受中储粮集团安徽分公司纪委纪律审查和宿州市萧县监委监察调查。（安徽纪检监察网）", "ctime": 1788496416, "time_str": "12:33:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260904/c679600706.shtml"}, {"id": "5108369", "title": "OpenAI发布新款模型GPT-6 Astra", "content": "美国开放人工智能研究中心（OpenAI）3日发布新款人工智能模型GPT-6 Astra，称其为该公司迄今能力最强的模型。目前该模型尚未全面开放。据OpenAI官网介绍，GPT-6 Astra当天开始向其“可信访问项目”的企业客户推出，未来几天将通过应用程序编程接口（API）扩大访问并将向ChatGPT Plus、Pro、Business和Enterprise等项目的订阅用户开放。（新华社）", "ctime": 1788496407, "time_str": "12:33:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260904/c679600703.shtml"}, {"id": "5108367", "title": "韩国综指涨幅扩大至2%", "content": "韩国综指涨幅扩大至2%，现报6711.02点。个股方面，SK海力士涨超4%，三星电子涨超2%。", "ctime": 1788496391, "time_str": "12:33:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260904/c679600700.shtml"}, {"id": "5108361", "title": "挪威主权财富基金提议将政府债券指数配置比例从70%下调至50%", "content": "挪威主权财富基金提议将政府债券指数配置比例从70%下调至50%。（财联社）", "ctime": 1788496134, "time_str": "12:28:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260904/c679600673.shtml"}, {"id": "5108357", "title": "岚图卢放：岚图梦想家9预售不做线下发布会，呼吁同行跳出营销内卷", "content": "9月4日，岚图汽车科技股份有限公司董事长卢放发文称，明天岚图梦想家9预售发布，按照行业惯例，重磅产品预售会采用发布会的形式，但公司团队慎重讨论后，决定不做线下发布会。“我们叫停的不是发布会，是冗余的营销造势。”卢放呼吁行业同仁：跳出营销内卷，回归造车本心，把更多精力放在打磨产品、精进体验、深耕创新上，用真实产品力回馈用户。", "ctime": 1788495995, "time_str": "12:26:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260904/c679600588.shtml"}, {"id": "5108355", "title": "“新政”后广州首拍，越秀地产以24.81亿元总价竞得天河低密宅地", "content": "继上海、北京后，广州也迎来了“8·28新政”后首宗涉宅地块的出让。9月4日，备受瞩目的天河区大观路以东AT1003083、AT1003084地块，也即原广东电视台地块迎来出让。该地块容积率仅2.1，总建面约67805平方米，起价21.4亿元，楼面起价31575元/平方米，共吸引了保利发展、越秀、珠实、天河高新4家房企参与。在经过了18轮竞拍后，越秀地产以24.81亿元的总价竞得，成交楼面价约36589元/平方米，溢价率为15.9%。（第一财经）", "ctime": 1788495968, "time_str": "12:26:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260904/c679600584.shtml"}, {"id": "5108331", "title": "江西启动防汛四级应急响应", "content": "鉴于当前防汛形势，根据《江西省防汛抗旱应急预案》规定，经研究，江西省防汛抗旱指挥部决定自9月4日11时起启动防汛四级应急响应。各地各部门要按照职责分工和预案规定，全力做好防汛工作。(央视新闻)", "ctime": 1788495027, "time_str": "12:10:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260904/c679600360.shtml"}, {"id": "5108329", "title": "国家医保局：“十四五”期间跨省异地直接结算7.27亿人次", "content": "今天上午，国务院新闻办公室举行“开局起步‘十五五’”系列主题新闻发布会，介绍推进医保高质量发展，更好服务中国式现代化建设有关情况。据介绍，“十四五”期间医保经办服务持续优化，群众医保报销329.1亿人次，涉及医保基金支出超13.67万亿元，跨省异地直接结算7.27亿人次。“十五五”时期，医保部门将推进医保服务强基工作，依托基层便民服务中心、乡镇卫生院、社区卫生服务中心、村卫生室建设基层医保服务站点，支持配备医保办事终端，让群众在家门口享受医保服务。针对老年人、未成年人、残疾人等群体需求，提供上门帮办代办等更多贴心便利服务。（央视新闻）", "ctime": 1788495015, "time_str": "12:10:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260904/c679600356.shtml"}, {"id": "5108327", "title": "个人养老金基金产品品类或再扩容", "content": "时隔一年多时间，个人养老金品类有望再次迎来扩容。据了解，近日，多家基金公司接到《关于做好含权二级债基、偏债混合基金纳入个人养老金基金产品名录工作的通知》，每家公司可以筛选1只符合标准的含权二级债基或偏债混合基金申请纳入。多位业内人士表示，未来若是含权二级债基、偏债混合基金纳入个人养老金产品名录，有望进一步丰富个人养老金基金产品谱系，更好地满足不同投资者的养老需求，助力养老第三支柱发展。（中国基金报）", "ctime": 1788495011, "time_str": "12:10:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260904/c679600355.shtml"}, {"id": "5108317", "title": "9月4日午间公告一览：明阳电气控股股东所持部分股份解除质押", "content": "明阳电气公告，控股股东所持部分股份解除质押；宇邦新材公告，中诚信国际关注苏州宇邦新型材料股份有限公司筹划控制权变更事项。", "ctime": 1788494685, "time_str": "12:04:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260904/c679600295.shtml"}, {"id": "5108315", "title": "市场监管总局集中纠治妨碍企业公平准入自主经营卡点堵点问题", "content": "为贯彻落实党中央、国务院关于纵深推进全国统一大市场建设有关部署，市场监管总局于今年5月起组织开展破除妨碍统一市场和公平竞争卡点堵点专项行动，重点纠治妨碍企业公平准入自主经营等4类典型问题。9月4日，市场监管总局公布第二批共7起专项行动案件，聚焦纠治妨碍企业公平准入卡点堵点，涉及医药卫生、能源、殡葬、垃圾清运、互联网上网服务等多个领域。主要表现为以下三种类型：一是违规设定歧视性准入条件，构筑区域壁垒。二是限定交易对象或者与经营者签订排他性合作协议，导致特定经营者独家经营。三是不予落实政策调整要求，拖延审批阻碍市场进入。(市说新语)", "ctime": 1788494668, "time_str": "12:04:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260904/c679600292.shtml"}, {"id": "5108291", "title": "港股午评：恒生指数涨2.15%，恒生科技指数涨2.85%", "content": "港股午间收盘，恒生指数涨2.15%，恒生科技指数涨2.85%。恒指港股通ETF银华（159318）涨1.83%，港股通科技ETF鹏华（159751）涨1.49%。板块方面，广告营销、养殖业板块涨幅靠前；焦炭加工Ⅲ、焦炭加工Ⅳ板块跌幅靠前。个股方面，范式智能涨12.95%，阅文集团涨12.54%，融创中国涨12.5%，深演智能涨11.33%，迈富时涨10.16%；金斯瑞生物科技跌12.4%，亮晴控股跌10.97%，华虹宏力跌7.85%，中远海控跌5.52%，耐世特跌5.12%。", "ctime": 1788494468, "time_str": "12:01:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260904/c679600253.shtml"}, {"id": "5108285", "title": "全国卫星导航定位基准站“一张网”扩至7569座", "content": "由自然资源部会同国家数据局联合主办的全国卫星导航定位基准站网服务数据授权运营工作推进会在北京召开。记者从会上获悉，当前，全国“一张网”站点规模已扩展至7569座，其中国家站420座，省级站3293座，协同站3856座，为国土规划、生态保护、林草监测、灾害预警、能源通信、工程建设、城市管理等各行各业提供高精度时空服务支撑，有力推动北斗规模化应用。（财联社）", "ctime": 1788494362, "time_str": "11:59:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260904/c679600186.shtml"}, {"id": "5108283", "title": "应急管理部协调中国石油油品应急保供力量驰援西藏吉隆抢险救援", "content": "西藏日喀则市吉隆县泥石流灾害发生后，应急管理部协调中国石油应急保供力量驰援西藏吉隆抢险救援。西藏销售公司迅速调派油品应急保供车辆，为抢险救援队伍开展应急供油支援。截至9月4日，累计调运油品451吨，其中汽油163吨，柴油288吨；应急保供车为相关抢险救援车辆配送28台次，油品50余吨，服务抢险救援车辆约400余台。当前，灾区及周边沿线各加油站油品库存充足、供应稳定。（央视新闻）", "ctime": 1788494333, "time_str": "11:58:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260904/c679600179.shtml"}, {"id": "5108267", "title": "动力电池回收利用产业标准体系建设指南有望今年发布", "content": "动力电池回收利用产业标准体系建设指南正在研究编制，有望今年出台。据悉，动力电池回收利用产业标准体系建设指南主要涉及绿色低碳、收集分类、材料再生等方面。其中绿色低碳方面，包含节能减碳、核查核算、绿色设计。随着新能源汽车产业高速发展，动力电池报废量将大幅增长。工信部数据显示，2025年，我国新能源汽车废旧动力电池综合利用量超过40万吨，同比增长32.9%。业内专家表示，随着早期推广的新能源汽车逐步进入报废阶段，动力电池退役量快速攀升。这些废旧动力电池若未经妥善处置，不仅会威胁公共安全，造成难以逆转的环境污染，还将浪费宝贵的有价金属资源。据推测，2030年当年电池退役量将达到106万吨。(中国证券报)", "ctime": 1788493618, "time_str": "11:46:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260904/c679600079.shtml"}, {"id": "5108261", "title": "美光计划年内大幅扩产HBM 产能有望翻倍", "content": "美光计划在年底前进行大规模设备投资，以提升最新一代HBM——HBM4 12层产品的供应能力。此举旨在弥补其相较于三星电子和SK海力士在HBM产能方面的不足，从而提高市场份额。美光计划在今年年底前新增最多6万片/月的HBM产能（按晶圆计）。去年美光的HBM产量约为4万至5万片/月，以此计算，美光HBM产能将是去年的两倍有余。一位熟悉相关情况的业内人士表示：“美光正在进行大规模设备投资，以快速提升HBM4的生产能力。预计到今年年底，美光将拥有约10万片/月规模的HBM产能。”(科创板日报)", "ctime": 1788493374, "time_str": "11:42:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260904/c679600034.shtml"}, {"id": "5108249", "title": "日经225指数涨幅扩大至1%", "content": "日经225指数涨幅扩大至1%，现报64869.55点。", "ctime": 1788493160, "time_str": "11:39:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260904/c679600009.shtml"}, {"id": "5108241", "title": "郴电国际等成立低空经济发展公司", "content": "企查查APP显示，近日，郴州市低空经济发展有限公司成立，法定代表人为李燕怡，注册资本为1亿元，经营范围包含通用航空服务；民用航空器维修；民用机场运营；民用航空器驾驶员培训；民用航空维修人员培训等。企查查股权穿透显示，该公司由郴电国际、郴州市国资控股集团有限公司等共同持股。（人民财讯）", "ctime": 1788493110, "time_str": "11:38:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260904/c679599926.shtml"}];
const SECTORS  = [{"name": "金融", "hit_count": 45, "etfs": []}, {"name": "人工智能", "hit_count": 31, "etfs": []}, {"name": "数据要素", "hit_count": 27, "etfs": []}, {"name": "消费", "hit_count": 24, "etfs": []}, {"name": "半导体", "hit_count": 17, "etfs": []}, {"name": "医药", "hit_count": 11, "etfs": []}, {"name": "机器人", "hit_count": 9, "etfs": []}, {"name": "新能源", "hit_count": 9, "etfs": []}];
const META     = {"update_time": "2026-09-04 14:09:14", "sentiment_score": 60.21739130434783, "agents": []};

// 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
