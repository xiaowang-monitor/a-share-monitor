"", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261030/c681314448.shtml"}, {"id": "5536143", "title": "英特尔盘初大跌27%", "content": "英特尔盘初大跌27%，英特尔周四发布财报，预计四季度营收为150亿至160亿美元，而分析师平均预期为170亿美元，部分预测更超过180亿美元。英特尔四季度调整后每股收益预期仅为25美分，远低于华尔街普遍预期的43至45美分。三季度业绩方面，英特尔营收同比增长21%至165亿美元，基本符合预期；调整后每股收益52美分，超出分析师预期的41美分。", "ctime": 1793367220, "time_str": "21:33:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261030/c681314432.shtml"}, {"id": "5536083", "title": "赵乐际会见德国总统施泰因迈尔", "content": "2026年10月30日上午，全国人大常委会委员长赵乐际在北京会见德国总统施泰因迈尔。赵乐际表示，中德始终坚持互尊互信、求同存异、互利合作，双边关系成熟而富有韧性。中方愿同德方一道，落实好两国元首重要共识，共享发展机遇，共促开放合作，共守和平安宁，不断丰富中德全方位战略伙伴关系内涵。中国全国人大愿同德国议会加强交流交往，为务实合作提供法律保障。欢迎德国议会和欧洲议会的议员多来中国参访，了解真实立体、发展进步的中国。施泰因迈尔表示，德中关系充满活力，合作领域广泛丰富。面对新的形势，双方应加强对话，深化合作，妥处分歧，实现共赢。希望两国立法机构进一步加强交流交往。张庆伟参加会见。(外交部网站)", "ctime": 1793367134, "time_str": "21:32:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261030/c681314406.shtml"}, {"id": "5536069", "title": "亚马逊美股开盘后跌近5%", "content": "亚马逊美股开盘后跌近5%。公司第三季度营收2019亿美元，同比增长12%；AWS营收460亿美元，同比增长39%。不过，公司预计2026年全年资本开支约2200亿美元，市场关注AI基础设施巨额投入的回报及自由现金流表现。", "ctime": 1793367112, "time_str": "21:31:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261030/c681314323.shtml"}, {"id": "5536059", "title": "闪迪美股开盘后跌超8.8%", "content": "闪迪美股开盘后跌超8.8%。公司第一财季营收110.31亿美元，同比增长378%；非GAAP每股收益49.51美元，毛利率达到85%。公司预计第二财季营收122亿至126亿美元，但强劲业绩仍未能阻止股价下跌，市场对高估值及存储芯片价格持续性的担忧升温。", "ctime": 1793367074, "time_str": "21:31:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261030/c681314303.shtml"}, {"id": "5536039", "title": "美股开盘：美股三大指数集体低开", "content": "美股三大指数集体低开，标普500指数跌1.17%，道指跌0.28%，纳指跌2.24%。大型科技股方面，Meta跌1.06%，微 77.11亿元，同比增长11.00%；净利润7653.48万元，同比增长43.65%；扣非净利润679.29万元。", "ctime": 1793366128, "time_str": "21:15:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261030/c681313988.shtml"}, {"id": "5535863", "title": "维维股份：子公司拟投3.21亿元建植物基生物智造工厂", "content": "维维股份公告，公司全资子公司徐州维维食品生物科技有限公司拟投资建设植物基生物智造工厂项目，项目分两期建设，本次一期投资约3.21亿元，规划用地面积46626.90m2，一期建设总建筑面积约26127.00m2，建设期2年，预计投资收益率10.50%。该事项已获公司第九届董事会第十六次会议审议通过，尚需提交股东会审议，项目尚未开始建设。", "ctime": 1793366037, "time_str": "21:13:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261030/c681313963.shtml"}, {"id": "5535861", "title": "维维股份：2026年前三季度固体饮料收入增长8.17%", "content": "维维股份公告，公司2026年前三季度固体饮料类产品销售收入13.6亿元，较2025年1-9月增长8.17%；动植物蛋白饮料类产品销售收入2.71亿元，较2025年1-9月增长2.60%；精制茶类产品销售收入4152.91万元，较2025年1-9月增长4.92%。报告期末固体饮料经销商总数2128个，较2025年同期末增加282个。", "ctime": 1793366032, "time_str": "21:13:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261030/c681313958.shtml"}, {"id": "5535777", "title": "现货金银持续下跌，现货黄金失守3940美元/盎司", "content": "现货黄金失守3940美元/盎司，日内跌2.01%。同花顺黄金现货价格报845.08元/克，现跌2.12%。COMEX白银期货大跌5%，现报49.74美元/盎司。现货白银跌超4%，现报49.84美元/盎司。", "ctime": 1793365640, "time_str": "21:07:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261030/c681313791.shtml"}, {"id": "5535727", "title": "协和电子：控股股东等拟转让29.99% 2026年11月复牌", "content": "协和电子公告，公司此前披露控股股东张南国等四人筹划控制权变更，股票自2026年10月26日起连续停牌。2026年10月30日，上述控股股东及持股5%以上大股东王桥彬、股东曹良良与施惠庆及其一致行动人南京协恒达科技合伙企业（有限合伙）、南京协盛达科技合伙企业（有限合伙）签署股份转让协议，合计转让26391200股，约占总股份29.99%。公司股票将于2026年11月2日开市起复牌。", "ctime": 1793365458, "time_str": "21:04:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261030/c681313708.shtml"}, {"id": "5535723", "title": "香港证监会主席敦促机构高管承担人工智能的问责责任", "content": "10月30日，香港证监会主席黄天祐出席香港证券业协会47周年金融创新论坛，并发表主题演说，指出金融业真正需要的，不只是“人工智能”Artificial Intelligence，而是Accountable Intelligence，也就是“问责智能”。黄天祐认为，人工智能是香港证券市场一股强大的发展动力，但金融市场从来不只是建基于科技，更建基于牢固的信任。他提出，要真正做到“问责智能”，有三个重点：“看得见”：董事会和高级管理层要知道机构使用AI的环节、作出的判断，以及潜在风险。“管得到”：AI的能力越强，人类监督和责任反而更为重要。“问得到”：当责任清晰、风险可控，科技投资亦才有机会真正地转化为企业的（价值）。(界面新闻)", "ctime": 1793365449, "time_str": "21:04:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261030/c681313703.shtml"}, {"id": "5535669", "title": "中指研究院：前10月100家房企拿地总额6465亿元", "content": "中指研究院最新发布《2026年1—10月中国房企投资拿地榜》显示，前10月100家房企拿地总额6465亿元，同比下降17.5%，降幅较1—9月缩窄3个百分点。", "ctime": 1793365336, "time_str": "21:02:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261030/c681313583.shtml"}, {"id": "5535663", "title": "现货黄金失守3950美元/盎司", "content": "现货黄金失守3950美元/盎司，日内跌1.77%。同花顺黄金现货价格报847.29元/克，现跌1.86%。", "ctime": 1793365307, "time_str": "21:01:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261030/c681313572.shtml"}, {"id": "5535633", "title": "期市夜盘开盘，国内期货主力合约多数上涨", "content": "期市夜盘开盘，国内期货主力合约多数上涨。涨幅方面，原油涨超3%，纯苯、对二甲苯、苯乙烯、沥青、合成橡胶涨超2%，瓶片、乙二醇、PTA、低硫燃油涨超1%。跌幅方面，沪银跌超3%，沪锡跌超2%，烧碱、纯碱、沪金跌超1%。", "ctime": 1793365205, "time_str": "21:00:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261030/c681313543.shtml"}, {"id": "5535623", "title": "2026年中越边境地区地面无线电业务频率协调会谈在昆明举行", "content": "2026年10月27日至29日，中越边境地区地面无线电业务频率协调会谈在云南省昆明市举行。会谈期间，双方本着友好协商、互利共赢的原则，就中越边境地区4G/5G公众移动通信系统相关频段的频率协调达成了一系列共识，并就无线电频率管理政策和2027年世界无线电通信大会（WRC-27）议题观点进行了深入交流，为维护中越双方边境地区电波秩序、保障各类无线电业务正常运行奠定基础。本次会谈，中方代表团由工业和信息化部无线电管理局、广西壮族自治区工业和信息化厅、云南省工业和信息化厅、国家无线电监测中心、四家基础电信运营企业等单位组成。越南代表团由越南科学技术部无线电频率管理局、越南相关电信运营企业组成。(工信部)", "ctime": 1793365112, // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
