ime_str": "14:56:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260928/c680311421.shtml"}, {"id": "5256741", "title": "余承东首度公开表态：鸿蒙智行将分出更多资源投入“四界” 问界用户权益不受影响", "content": "华为常务董事、产品投资评审委员会主任、终端BG董事长余承东今日表示，问界品牌是鸿蒙智行第一个打造的品牌，凝聚了双方团队及产业伙伴的共同努力，也是跨界融合和产业升级的重要成果。随着品牌的日益成熟，后续问界将以新的合作模式发展，由赛力斯主导、华为终端参与赋能，所有问界用户的既有权益和后续服务不受影响。余承东同时表示，鸿蒙智行将分出更多的资源与精力进一步强化尊界、享界、智界和尚界的投入，为消费者打造更多的高品质的产品，为中国汽车产业发展打造更多成功范式。 (科创板日报)", "ctime": 1790578465, "time_str": "14:54:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260928/c680311365.shtml"}, {"id": "5256729", "title": "短融ETF海富通今日再度放量成交", "content": "短融ETF海富通（511360）今日再度放量成交，截止发稿时间最新成交额突破740亿历史排名第三，此前2026年9月22日1372亿成交额创历史天量，资料显示，短融ETF主要是机构流动性管理工具，核心玩家是银行理财/资管、公募/私募、保险、券商自营、企业现金及部分高频交易资金。短期持有时，有望获得比账户闲置资金略高的票息收益；卖出后，资金可较快投入股票或其他场内产品。截至9月23日，全市场53只债券型ETF合计规模达10022.31亿元，首次站上万亿元关口；对比年初的8290.24亿元，年内增加1732.07亿元，增幅20.9%。", "ctime": 1790578352, "time_str": "14:52:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260928/c680311327.shtml"}, {"id": "5256707", "title": "工信部：截至8月末5G基站总数达519.5万个", "content": "工信部发布2026年前8个月通信业经济运行情况，截至8月末，5G基站总数达519.5万个，比上年末净增35.7万个，占移动基站总数的39.7%，占比较前7个月提高0.3个百分点。", "ctime": 1790578135, "time_str": "14:48:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260928/c680311246.shtml"}, {"id": "5256687", "title": "客服回应iPhone 18 Pro自动重启BUG：系统原因导致，将推送更新修复", "content": "近日有消费者反馈，iPhone 18 Pro系列疑似出现系统BUG，当用户在面部识别失败的情况下，手机可能卡死、自动重启等问题。 针对此事，苹果客服表示，苹果工程团队确实发现存在一些面容识别的问题，是系统原因导致。工程团队已经在开始解决，最近在陆续给用户推送一个新的系统版本。", "ctime": 1790578059, "time_str": "14:47:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260928/c680311215.shtml"}, {"id": "5256575", "title": "全国农产品批发市场猪肉平均价格为16.44元/公斤，比节前上升0.6%", "content": "据农业农村部监测，9月28日“农产品批发价格200指数”为115.80，比节前（9月24日，下同）下降0.17个点，“菜篮子”产品批发价格指数为116.11，比节前下降0.44个点。截至今日14:00时，全国农产品批发市场猪肉平均价格为16.44元/公斤，比节前上升0.6%；牛肉72.02元/公斤，比节前下降0.5%；羊肉66.99元/公斤，比节前下降0.4%；鸡蛋10.67元/公斤，比节前下降3.1%；白条鸡17.28元/公斤，比节前下降0.5%。", "ctime": 1790577969, "time_str": "14:46:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260928/c680310890.shtml"}, {"id": "5256661", "title": "机构：建议投资者轻仓黄金过节", "content": "南华期货认为，金银若受到10月加息预期升温影响而进一步回调，反可视为逢低布局窗口。南华期货预计，考虑到国内马上迎来国庆长假，而节中仍有多项重要数据和美联储官员讲话，以及原油价格扰动，建议投资者轻仓过节。（中新经纬）", "ctime": 1790577771, "time_str": "14:42:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260928/c680311088.shtml"}, {"id": "5256621", "title": "七部门：推动人工智能、数字孪生、大数据分析等新一代信息技术赋能新型电池全产业链", "content": "工信部等七部门联合印发《新型电池产业发展“十五五”规划》。其中提到，推动人工智能、数字孪生、大数据分析等新一代信息技术赋能新型电池全产业链，加快发展新一代智能制造。场景化、图谱化推动新型电池产业数智化转型，支持上下游关键环节数据共享互通，建设跨电池体系的行业专用大模型和人工智能研发平台。推广智能化材料设计模式，优化电池智能化开发流程。深化智能工厂梯度培育，提高设备智能感知、故障预测、安全管控水平，推动生产制造、物流仓储可视化管理与智能化调控。提升电池安全预警和寿命评估能力。", "ctime": 1790577411, "time_str": "14:36:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260928/c680310965.shtml"}, {"id": "5256619", "title": "七部门：加快新型电池材料迭代升级", "content": "工信部等七部门联合印发《新型电池产业发展“十五五”规划》。其中提到，加快新型电池材料迭代升级，发展基于储量充裕、供给稳定矿产资源的关键材料和高容量、高稳定、智能响应、自修复新型电极（堆）材料，提升高电导率、高性能固态电解质材料量产能力。发展高速化、柔性化、智能化高端成套设备，实现工艺联动和精度跃升，提高生产效率和产品一致性。研发制片、组装、化成等重点工序专用设备，补齐专用工业软件短板。", "ctime": 1790577368, "time_str": "14:36:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260928/c680310953.shtml"}, {"id": "5256605", "title": "七部门：加快突破全固态电池产业化技术", "content": "工信部等七部门联合印发《新型电池产业发展“十五五”规划》。其中提到，深化新型电池基础性、前瞻性科学问题研究，强化原始创新和颠覆性技术攻关。加强电池材料、结构设计、制造技术、系统集成等多维度工艺协同创新，提升本质安全、能量和功率密度、结构强度及轻量化水平。聚焦离子电导率和循环稳定性提升、成本优化等重点方向，加快突破全固态电池产业化技术。前瞻布局新型碱金属离子电池、多价离子电池、金属－空气/硫电池、多功能复合材料结构电池、核电池等新一代电池体系。", "ctime": 1790577316, "time_str": "14:35:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260928/c680310931.shtml"}, {"id": "5256597", "title": "七部门：到2030年，我国新型电池产业规模实现稳步增长", "content": "工信部等七部门联合印发《新型电池产业发展“十五五”规划》。到2030年，我国新型电池产业规模实现稳步增长。全链条创新能力持续增强，先进电极材料、新型电解质、高端辅材等取得新突破，新体系电池研发取得重大进展，全固态电池初步实现规模化应用，长寿命锂电池循环寿命达到15000次，头部企业产品缺陷率达到PPB级。全场景应用生态加速构建，新型电池技术与清洁能源、用能终端加快融合创新发展，高效赋能智能终端产品迭代升级和汽车、船舶、航空、智能机器人、工程机械、农机装备等领域电动化，满足新型电力系统建设需要，在电源侧、电网侧，以及工业园区、数据中心等储能应用场景进一步拓展。国际贸易投资一体化深入推进，服务全球经济社会绿色低碳发展。", "ctime": 1790577250, "time_str": "14:34:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260928/c680310914.shtml"}, {"id": "5256583", "title": "工信部等七部门联合印发《新型电池产业发展“十五五”规划》", "content": "工信部等七部门联合印发《新型电池产业发展“十五五”规划》。《规划》提出统筹发展与安全，以推动高质量发展为主题，加快构建创新引领、安全高效、韧性强健，智能绿色的新型电池产业体系，推动技术创新水平、产品附加值、企业竞争能力、产业链现代化水平的全面跃升，为发展新质生产力、推进新型工业化提供有力支撑。到2030年，我国新型电池产业规模实现稳步增长；全链条创新能力持续增强，先进材料取得新突破，新体系电池研发取得重大进展，头部企业产品缺陷率达到PPB级别；全场景应用生态加速构建，电池技术与清洁能源、用能终端加快融合创新发展；国际贸易投资一体化深入推进，服务全球绿色低碳发展。", "ctime": 1790577194, "time_str": "14:33:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260928/c680310900.shtml"}, {"id": "5256551", "title": "日韩股市集体收跌", "content": "日经225指数收跌0.73%，报65877.62点。韩国综指收跌2.70%，报6889.75点。", "ctime": 1790577105, "time_str": "14:31:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260928/c680310860.shtml"}, {"id": "5256517", "title": "中秋节假期670.9万人次出入境", "content": "据国家移民管理局通报，今年中秋节假期全国边检机关共保障670.9万人次中外人员出入境，日均223.6万人次，较去年中秋节期间增长16.8%；单日出入境通关最高峰出现在9月26日，达234.2万人次。其中，内地居民出入境320.6万人次，较去年同期增长5.3%；港澳台居民出入境277.5万人次，较去年同期增长27.7%；外国人出入境72.8万人次，较去年同期增长37.7%；入境外国人中，适用免签政策入境24.7万人次，较去年同期增长32.7%。共计查验出入境交通运输工具30.9万架（艘、列、辆）次，较去年同期增长8.6%。", "ctime": 1790577022, "time_str": "14:30:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260928/c680310847.shtml"}, {"id": "5256501", "title": "现货黄金失守4170美元/盎司", "content": "现货黄金失守4170美元/盎司，日内跌2.69%。", "ctime": 1790576889, "time_str": "14:28:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260928/c680310816.shtml"}, {"id": "5256497", "title": "道达尔能源计划2027年至2032年每年净投资140亿至170亿美元", "content": "道达尔能源计划2027年至2032年每年净投资140亿至170亿美元。", "ctime": 1790576845, "time_str": "14:27:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260928/c680310788.shtml"}, {"id": "5256479", "title": "大商所生猪主力合约跌超4%", "content": "大商所生猪主力合约跌超4%，报10290元/吨。", "ctime": 1790576751, "time_str": "14:25:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260928/c680310733.shtml"}, {"id": "5256455", "title": "安徽人工智能产投公司等成立科创公司，注册资本1亿元", "content": "天眼查App显示，近日，安徽灵境造物科创有限公司成立，法定代表人为靳顺茹，注册资本1亿元，注册地址位于安徽省合肥市高新区中国（合肥）国际智能语音产业园，经营范围含创业空间服务、以自有资金从事投资活动、创业投资、技术服务等。股东信息显示，该公司由科学智能物质创制中心、淮河能源控股集团有限责任公司、合肥高新创业投资有限公司、安徽省科创投资有限公司、安徽省人工智能产业投资发展有限公司共同持股。", "ctime": 1790576668, "time_str": "14:24:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260928/c680310708.shtml"}, {"id": "5256437", "title": "台积电关联公司计划修建第二座新加坡芯片工厂", "content": "为满足不断增长的需求，台积电关联公司世界先进与荷兰公司恩智浦半导体的合资企业VisionPower Semiconductor Manufacturing Co.(简称VSMC)正在考虑修建第二座新加坡芯片厂。世界先进兼VSMC董事长方略在接受采访时表示，新工厂可以生产比新加坡首厂更先进的芯片。（蓝鲸新闻）", "ctime": 1790576429, "time_str": "14:20:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260928/c680310586.shtml"}, {"id": "5256421", "title": "风电设备板块短线拉升，洛轴股份涨超10%", "content": "风电设备板块短线拉升，洛轴股份涨超10%，天能重工、大金重工、吉鑫科技、运达股份、金雷股份等跟涨。", "ctime": 1790576275, "time_str": "14:17:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260928/c680310541.shtml"}, {"id": "5256393", "title": "欧盟对涉华纤维素醚发起反倾销调查", "content": "据中国贸易救济信息网消息，2026年9月24日，欧盟委员会发布公告称，应Ashland Industries Nederland BV、Ashland Specialties Belgium BV及SE TyloseGmbH & Co. KG于2026年8月10日提出的申请，对原产于中国和韩国的纤维素醚（Cellulose Ethers）发起反倾销调查。", "ctime": 1790576119, "time_str": "14:15:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260928/c680310510.shtml"}, {"id": "5256389", "title": "米哈游创始人刘伟：希望在2-3年内进入国产大模型第一梯队", "content": "9月28日，记者获悉，近期米哈游创始人、总裁刘伟在2027校园招聘宣讲会上海交通大学专场上发表演讲，希望米哈游在2-3年内进入国产大模型第一梯队。“我有很强的信心，未来2到3年内，米哈游都会是国产大模型团队里举足轻重的一员。”刘伟表示。（澎湃新闻）", "ctime": 1790576062, "time_str": "14:14:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260928/c680310498.shtml"}, {"id": "5256383", "title": "油价上涨拖累印度股市跌至近六个月低点", "content": "因中东紧张局势升级推动油价上涨，印度股市下跌，基准指数Nifty 50和Sensex均下跌1.4%，跌至近六个月低点。", "ctime": 1790576041, "time_str": "14:14:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260928/c680310489.shtml"}, {"id": "5256367", "title": "李想：“去XX化”是零和博弈的思维，理想汽车从来不会用这种思维来定义我们的自研战略", "content": "理想汽车CEO李想发文称，最近有一种说法，认为自研就是要“去XX化”，就是要跟供应商搞对立。我认为事实恰恰相反。苹果的A系列芯片、英伟达和高通的旗舰芯片，大都是厂商自研+台积电代工。特斯拉的自研电池，同时和宁德时代、LG和欣旺达合作生产。这种模式不仅没有让台积电、宁德时代和欣旺达变弱，反而让他们越做越强。 汽车产业也是同样的逻辑。整车企业更深入的定义产品体验、系统架构和质量标准，合作伙伴则发挥工程化、制造工艺和规模交付的专业能力。好的整零关系，不是谁替代谁，而是在更深的协同中把产品做得更好。整车企业和零部件企业，从来不是零和博弈。自研也不是要做孤岛，而是要把最好的伙伴拉得更近，一起把用户体验做得更好。“去XX化”是零和博弈的思维，理想汽车从来不会用这种思维来定义我们的自研战略，我相信优秀的中国智能电动车企业，都不会用这样狭隘的思路来定义自己的战略。", "ctime": 1790575957, "time_str": "14:12:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260928/c680310470.shtml"}, {"id": "5256363", "title": "房地产服务板块短线拉升，深物业A涨停", "content": "房地产服务板块短线拉升，深物业A涨停，我爱我家、世联行、特发服务、招商积余、南都物业等跟涨。", "ctime": 1790575936, "time_str": "14:12:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260928/c680310467.shtml"}, {"id": "5256335", "title": "机构：2030年全球200美元以下智能手机出货量预计较2025年减少2.3亿部", "content": "根据Counterpoint Research最新发布的按价格段划分的智能手机出货量预测，2025年至2030年间，全球200美元以下智能手机出货量预计将减少超过2.3亿部。尽管整体智能手机市场出货量有望在2030年底恢复至2025年的水平，但该价格段智能手机出货量预计将比2025年减少约40%。", "ctime": 1790575813, "time_str": "14:10:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260928/c680310438.shtml"}, {"id": "5256327", "title": "欧洲股指期货上涨，欧洲斯托克50指数期货上涨0.22%", "content": "欧洲股指期货上涨，欧洲斯托克50指数期货上涨0.22%，德国DAX指数期货上涨0.19%，英国富时100指数期货上涨0.27%。", "ctime": 1790575803, "time_str": "14:10:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260928/c680310433.shtml"}, {"id": "5256169", "title": "ETF两市成交额超4000亿元", "content": "截至目前，ETF两市成交额超4000亿元。其中，成交额最高的非货币型ETF分别是创业板ETF（159915）、科创50ETF（588000）、中韩半导体ETF（513310），成交额分别为66.05亿元、64.19亿元、48.27亿元。", "ctime": 1790575436, "time_str": "14:03:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260928/c680310295.shtml"}, {"id": "5255989", "title": "纽约期金失守4210美元/盎司", "content": "纽约期金失守4210美元/盎司，日内跌2.58%。", "ctime": 1790575267, "time_str": "14:01:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260928/c680310245.shtml"}, {"id": "5255815", "title const SECTORS  = [{"name": "金融", "hit_count": 60, "etfs": []}, {"name": "人工智能", "hit_count": 38, "etfs": []}, {"name": "数据要素", "hit_count": 26, "etfs": []}, {"name": "半导体", "hit_count": 24, "etfs": []}, {"name": "消费", "hit_count": 19, "etfs": []}, {"name": "新能源", "hit_count": 10, "etfs": []}, {"name": "机器人", "hit_count": 9, "etfs": []}, {"name": "军工", "hit_count": 6, "etfs": []}];
const META     = {"update_time": "2026-09-28 15:10:04", "sentiment_score": 57.2, "agents": []};

// 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
