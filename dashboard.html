nt": "节能国祯公告，公司此前实施乌拉特后旗恢复湿地中水循环利用工程PPP项目，2026年10月12日董事会审议通过提前终止议案，并要求签订项目终止协议。根据协议，合同提前终止本金及补偿金为1.81亿元，项目资产及资料将在协议生效之日起一个月内完成交接。", "ctime": 1791803160, "time_str": "19:06:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261012/c680602207.shtml"}, {"id": "5365821", "title": "东百集团：股票异动，10月8日至12日累计涨幅19.96%，收购正式协议尚未签署", "content": "东百集团公告，公司股票2026年10月8日、9日及12日连续3个交易日日收盘价涨幅偏离值累计超过20%，属于股票交易异常波动。公司于10月12日披露拟收购杭州快灵光电科技有限公司部分股权，东百创智拟收购标的公司52.6667%股权，截至公告披露日尚未签署正式交易协议，交易能否实施存在重大不确定性。标的公司2025年度及2026年1-8月营业收入分别为3976.13万元、3486.93万元，净利润分别为-1507.22万元、-251.7万元。2026年10月8日至12日公司股票累计涨幅19.96%，截至2026年10月12日静态市盈率212.51、滚动市盈率198.71，明显高于截至2026年10月9日零售业的22.53、21.75。公司自查并向控股股东及实际控制人发函核实，除已披露事项外，不存在应披露而未披露的重大事项。", "ctime": 1791803028, "time_str": "19:03:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261012/c680602140.shtml"}, {"id": "5365809", "title": "龙湖集团：2026年前九月合同销售金额231.4亿元，9月新增1块土地储备", "content": "龙湖集团公告，截至2026年9月30日止九个月，累计合同销售金额人民币231.4亿元，合同销售面积250.6万平方米；9月单月合同销售金额人民币23亿元，归属本公司股东权益的合同销售金额人民币14.2亿元。九个月运营及服务业务不含税收入约人民币204.4亿元。2026年9月新增1块土地储备，位于沈阳轩兴四路北地块，权益比50%，权益建筑面积4.57万平方米，权益地价人民币2.12亿元。", "ctime": 1791802987, "time_str": "19:03:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261012/c680601983.shtml"}, {"id": "5365803", "title": "比较实验超30款“减压玩具” 北京市消协发布消费提示", "content": "色彩缤纷、质地柔软、可塑性强的“减压玩具”，其柔软手感和趣味玩法受到不少消费者喜爱。近期，北京市消费者协会对市场上38款常见减压玩具开展了比较试验。据了解，本次比较试验样品由工作人员通过线上电商平台及线下商超、文具店等渠道随机购买，覆盖水晶泥类、捏捏乐类、按压等其他类三大品类，依据强制性国家标准《玩具安全》（GB 6675.1~4—2014）进行检测。结果显示，38款样品总体表现良好，但仍有部分产品存在小零件脱落和增塑剂超标问题，需引起消费者关注。（央视新闻）", "ctime": 1791802967, "time_str": "19:02:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261012/c680601974.shtml"}, {"id": "5365801", "title": "中方向约旦移交医疗援助物资 用于救治加沙伤病人员", "content": "当地时间10月12日，中国用于救治加沙伤病员的医疗设备及物资援助项目交接仪式在约旦举行，中国驻约旦使馆临时代办龚安民和约旦皇家医疗服务局代理局长哈特姆·阿巴迪出席并签署交接证书。此次援助涵盖多种医疗设备和必需医疗物资，包括注射器、针头、纱布绷带等大量医疗耗材。据介绍，相关设备及物资已分配至约旦多家医疗服务机构，包括侯赛因国王医疗中心、皇家康复中心以及阿莉娅王后心脏病与外科研究所等。这批援助将主要用于救治加沙来约伤病员，也有助于改善约旦当地医疗机构的诊疗条件，提高医疗服务能力，更好地满足患者的就医需求。（央视新闻）", "ctime": 1791802961, "time_str": "19:02:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261012/c680601971.shtml"}, {"id": "5365791", "title": "赛力斯：截至2026年10月12日，已回购1.01%公司股份", "content": "赛力斯公告，公司此前披露以自有资金集中竞价回购股份方案，回购资金总额不低于10亿元（含）、不超过20亿元（含），用于注销并减少注册资本，该方案已经2026年4月22日召开的2025年年度股东会审议通过。截至2026年10月12日，公司已通过集中竞价交易累计回购股份1753.57万股，占公司总股本的比例约为1.01%，与上次披露数相比增加约0.11%，回购最高价为91元/股、最低价为43.99元/股，支付的总金额为9.83亿元（不含交易费用）。", "ctime": 1791802923, "time_str": "19:02:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261012/c680601963.shtml"}, {"id": "5365781", "title": "綠竹生物-B：2026年重组RSV疫苗获中国临床试验批准", "content": "綠竹生物-B公告，公司自主研发的重组呼吸道合胞病毒（RSV）疫苗已获中国国家药品监督管理局批准，可在中国开展临床试验。该产品为采用RSV融合前F（Pre-F）蛋白抗原的重组蛋白疫苗候选产品。", "ctime": 1791802893, "time_str": "19:01:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261012/c680601960.shtml"}, {"id": "5365695", "title": "翰宇药业：预计2026年前三季度净利润同比增长502.65%-530.68%", "content": "翰宇药业公告，预计2026年前三季度营业收入12.3亿元–12.5亿元，同比增长80.06%-82.98%；归属于上市公司股东的净利润4.3亿元–4.5亿元，同比增长502.65%-530.68%；扣非净利润4.2亿元–4.4亿元，同比增长726.29%-765.64%。业绩增长主要由于原料药业务持续放量；相关财务数据未经会计师事务所审计。", "ctime": 1791802718, "time_str": "18:58:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261012/c680601895.shtml"}, {"id": "5365691", "title": "歌尔股份：终止分拆所属子公司歌尔微电子至香港联交所主板上市", "content": "歌尔股份公告，公司此前披露拟分拆歌尔微至香港联交所主板上市，歌尔微于2025年1月递交申请，2025年3月备案申请材料获中国证监会接收。2026年10月12日，公司董事会审议通过终止本次分拆上市的议案。", "ctime": 1791802696, "time_str": "18:58:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261012/c680601887.shtml"}, {"id": "5365671", "title": "百时美施贵宝美股盘前涨超5%", "content": "百时美施贵宝美股盘前涨超5%，现报62.31美元。", "ctime": 1791802614, "time_str": "18:56:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261012/c680601872.shtml"}, {"id": "5365661", "title": "何立峰会见苹果公司执行董事长蒂姆·库克", "content": "中共中央政治局委员、国务院副总理何立峰12日下午在人民大会堂会见美国苹果公司执行董事长蒂姆·库克。何立峰表示，落实好两国元首共识，构建“基于尊重、公平、对等的中美建设性战略稳定关系”，有利于两国乃至全球经济的稳定和发展，将为跨国企业提供稳定预期和良好经营环境。欢迎包括苹果公司在内的各国科技企业持续深化对华互利共赢合作，共享中国式现代化发展机遇。库克表示，苹果公司对在华长期发展充满信心，将发挥工商界沟通桥梁作用，为推动美中经贸关系稳定健康发展贡献更多力量。（新华社）", "ctime": 1791802596, "time_str": "18:56:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261012/c680601867.shtml"}, {"id": "5365625", "title": "齐鲁银行：胡金良副董事长、行长任职资格获核准", "content": "齐鲁银行公告，公司于2026年10月12日收到山东金融监管局批复，国家金融监督管理总局山东监管局已核准胡金良先生公司副董事长、行长任职资格。", "ctime": 1791802506, "time_str": "18:55:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261012/c680601842.shtml"}, {"id": "5365617", "title": "德才股份：奇想无限目前尚处于业务发展阶段，营收规模较小且仍处于亏损状态", "content": "德才股份股票交易异常波动公告，公司关注到近期资本市场漫剧制作相关概念热度较高，相关板块二级市场表现较为活跃，部分媒体报道公司控股孙公司福建奇想无限网络有限公司（简称“奇想无限”）涉及相关概念。奇想无限成立于2025年12月5日，2026年上半年，奇想无限实现营业收入2457.09万元，净利润-562.17万元，目前尚处于业务发展阶段，营收规模较小且仍处于亏损状态，未对公司经营业绩产生重大影响。", "ctime": 1791802416, "time_str": "18:53:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261012/c680601813.shtml"}, {"id": "5365587", "title": "Stellantis与塔塔汽车签署车辆技术协议", "content": "10月12日，据报道，一份证券交易所文件显示，Stellantis印度公司、塔塔汽车乘用车公司及其子公司塔塔乘用电动汽车公司签署了一项协议，将双方的合作范围扩展至先进技术和产品协作领域。", "ctime": 1791802307, "time_str": "18:51:47", 次交易已于2026年9月7日获中国证券监督管理委员会批复。2026年10月12日，上交所决定终止东兴证券、信达证券股票上市，相关股票将于2026年10月19日终止上市，且不进入退市整理期交易。", "ctime": 1791800817, "time_str": "18:26:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261012/c680601283.shtml"}, {"id": "5365265", "title": "信达证券：A股股票将于2026年10月19日终止上市", "content": "信达证券公告，公司此前因中金公司换股吸收合并拟终止上市；2026年10月12日，公司收到上交所终止上市决定，A股股票将于2026年10月19日终止上市，不进入退市整理期交易。终止上市后，信达证券A股股票按1:0.5210比例转换为中金公司A股股票。", "ctime": 1791800742, "time_str": "18:25:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261012/c680601265.shtml"}, {"id": "5365261", "title": "弘信电子：全资子公司签署21.31亿元、8.52亿元算力芯片采购合同", "content": "弘信电子公告，全资子公司北京安联通科技有限公司与A公司签署《产品购销合同》，向其采购高性能服务器算力芯片，分批次独立验收计费，合同含税总金额为21.31亿元人民币；与B公司签署《销售合同》，向其购买高性能服务器算力芯片，合同结算总价款为8.52亿元人民币。上述合同签署均在公司董事长审议权限范围内，无需提交董事会审议，不构成关联交易或重大资产重组。", "ctime": 1791800721, "time_str": "18:25:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261012/c680601258.shtml"}, {"id": "5365243", "title": "《铁路科技创新“十五五”规划》：开展人工智能技术在列车、基础设施和运营维护等系统的应用研究", "content": "国家铁路局印发《铁路科技创新“十五五”规划》。其中提到，深化“人工智能+铁路”应用基础研究。以人工智能、物联网、大数据与云计算等技术为基础，利用铁路运营、维护海量数据，建立能够精准预测与智能决策的铁路专用人工智能模型。开展人工智能技术在列车、基础设施和运营维护等系统的应用研究，探索人工智能技术在列车、基础设施和智能运维等方面的数智化升级应用，实现列车运行的安全在线评估和个性化服务定制。加强全场景系统安全保障技术研究，持续开展铁路装备的本构安全、主动安全和信息安全研究，加快构建全生命周期服务的系统解决方案。建设铁路行业监管数字化平台，构建“人工智能+铁路”国家级安全评测与风险评估体系。（人民财讯）", "ctime": 1791800655, "time_str": "18:24:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261012/c680601241.shtml"}, {"id": "5365233", "title": "艾隆科技：张银花拟减持公司不超过2.59%股份", "content": "艾隆科技公告，控股股东、实际控制人张银花持有公司股份2205.5万股，占总股本28.57%，拟于2026年11月4日～2027年2月2日通过集中竞价或大宗交易减持不超过200万股，占总股本2.59%，减持原因为自身资金需求。", "ctime": 1791800593, "time_str": "18:23:13", "stock_code": "", "stock_name": " // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>

}

        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
