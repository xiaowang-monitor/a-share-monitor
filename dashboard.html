const NEWS     = [{"id": "4812647", "title": "中国支付清算协会注销6家单位会员资格", "content": "7月27日，中国支付清算协会官网公告：按照《中国支付清算协会章程》《中国支付清算协会会员管理办法》等相关规定，经审议，中国支付清算协会决定注销申能集团财务有限公司、深圳国家金融科技测评中心有限公司、开联通支付服务有限公司、上海商联信电子支付服务有限公司、圣亚云鼎支付有限公司、深圳前海移联科技有限公司等6家单位会员资格，即日起生效。", "ctime": 1785147960, "time_str": "18:26:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260727/c678460779.shtml"}, {"id": "4812639", "title": "联合国难民署任命南苏丹奥运选手加布里埃尔为亲善大使", "content": "联合国难民署27日宣布，南苏丹奥运选手、篮球运动员温延·加布里埃尔成为其亲善大使之一。加布里埃尔出生于喀土穆，自幼随父母躲避苏丹南部的内战而逃离家园，两岁时被安置到美国，长大后成为篮球运动员，曾效力于美职篮（NBA）洛杉矶湖人队和波特兰开拓者队。2024年，他代表南苏丹参加了巴黎奥运会。加布里埃尔表示：“作为联合国难民署亲善大使，我可以为那些被迫逃离家园的人们发声，并提醒世人，没有人愿意成为难民。”（央视新闻）", "ctime": 1785147925, "time_str": "18:25:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260727/c678460768.shtml"}, {"id": "4812641", "title": "中国电建：上半年新签合同金额6198.93亿元，同比下降9.73%", "content": "中国电建公告，2026年1月至6月，公司新签项目数量4190个，新签合同金额6198.93亿元，同比下降9.73%。其中能源电力3862.65亿元，同比下降10.46%；水资源与环境563.21亿元，同比下降27.16%；城市建设与基础设施1564.09亿元，同比增长9.17%；境内合同金额4225.69亿元，同比下降22.47%，境外1973.24亿元，同比增长39.29%。", "ctime": 1785147925, "time_str": "18:25:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260727/c678460769.shtml"}, {"id": "4812637", "title": "北自科技：发行股份购买资产并配套募资实施完成，新增股份上市", "content": "北自科技公告，公司此前披露拟通过发行股份及支付现金方式收购苏州穗柯智能科技有限公司100%股权，并募集配套资金。目前本次交易已实施完成，标的资产穗柯智能100%股权已于2026年6月2日过户至公司名下。本次发行股份购买资产的新增股份（345.15万股）于2026年6月12日完成登记；募集配套资金的新增股份（89.41万股）于2026年7月24日完成登记，发行价格为35.79元/股，募集资金总额3200万元，募集资金净额2961.1万元。新增股份均为限售流通股。", "ctime": 1785147915, "time_str": "18:25:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260727/c678460764.shtml"}, {"id": "4812635", "title": "北自科技：未生产人形机器人本体及零部件，股价连续3日涨幅偏离值超20%", "content": "北自科技公告，公司股票连续3个交易日内（2026年7月23日、24日、27日）日收盘价格涨幅偏离值累计超过20%。经公司自查及向控股股东、间接控股股东发函查证，截至本公告日，除已披露事项外，不存在应披露而未披露的重大信息。公司关注到市场对人形机器人概念关注度较高，但公司聚焦产业化落地，未生产人形机器人本体及零部件。公司董事、高管及控股股东在异动期间不存在买卖公司股票情况。", "ctime": 1785147895, "time_str": "18:24:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260727/c678460758.shtml"}, {"id": "4812623", "title": "携程CEO孙洁发布全员信：针对处罚指出的问题，已形成完整的整改措施并将对外公示", "content": "7月25日当天，市场监管总局依法对携程集团有限公司（以下简称携程）滥用市场支配地位实施垄断行为作出行政处罚，罚没款合计51.79亿元。处罚消息公布当天，携程CEO孙洁向全体员工发布内部全员邮件，同步公司对事件的核心判断、整改方向，以及全员统一的对外行动准则。孙洁在内部信表示，目前公司整体业务运转平稳有序。用户预订、出行服务正常保障，国内外酒旅合作伙伴合作链路稳定，各业务线日常经营不受本次处罚影响。并表示，本次监管处罚，是公司梳理经营模式、校准产业定位的重要契机。针对处罚指出的问题，携程已形成完整的整改措施并将对外公示。此外，内部信中也划定了全员三点行动准则：面对亲友问询统一传递诚恳整改态度，不推诿不辩解；面对商家与消费者以实际服务和整改行动替代口头解释；面对舆论质疑无需焦虑争辩，以落地的公平合作机制、产业扶持政策、长效合规体系回应争议。（新浪财经）", "ctime": 1785147774, "time_str": "18:22:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260727/c678460707.shtml"}, {"id": "4812617", "title": "汇丰控股将在新加坡设全球人工智能卓越中心，并招聘超100名AI专家", "content": "汇丰控股7月27日宣布，将于今年下半年在新加坡设立全球人工智能卓越中心（CoE），旨在开发可扩展至集团全球网络的AI能力，并计划招聘100多名AI专家。声明称，该卓越中心初期将专注于提升客户财富管理体验、引入智能化的财资解决方案以及开发AI赋能的数字支付。（界面新闻）", "ctime": 1785147760, "time_str": "18:22:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260727/c678460693.shtml"}, {"id": "4812603", "title": "蚂蚁正式发布LLaDA2.2", "content": "7月27日，蚂蚁正式发布LLaDA2.2。据介绍，通过引入Levenshtein编辑与环境反馈强化学习，LLaDA2.2首次让扩散语言模型在真实Agent场景中具备“边行动边纠错”的能力。（界面）", "ctime": 1785147588, "time_str": "18:19:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260727/c678460641.shtml"}, {"id": "4812591", "title": "佩斯科夫：当前没有任何俄乌冲突调解新方案或新提议", "content": "7月27日，俄罗斯总统新闻秘书佩斯科夫在例行新闻简报会上表示，目前有关乌克兰总统泽连斯基与美国总统特朗普可能讨论“空中停火”方案的消息纯属媒体臆测，并无事实依据。他强调，当前不存在任何关于乌克兰问题调解的新方案或新提议的具体内容。关于俄罗斯商船保护问题，佩斯科夫表示，国际法禁止武装商船，为商船加装防御设备一事无从谈起，但俄海军可以采取措施确保其安全。（央视新闻）", "ctime": 1785147490, "time_str": "18:18:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260727/c678460610.shtml"}, {"id": "4812589", "title": "外交部重申中国外长在马尼拉没有与日方交流", "content": "就日方称中国外长在菲律宾马尼拉期间同日本官员进行了交流，外交部发言人林剑7月27日在例行记者会上回答有关提问时说：“我此前回答过这个问题，我可以在这里再一次非常清楚地告诉你，此次在马尼拉期间，王毅外长没有与日方会见的日程安排，现场也没有什么简短交流。”（新华社）", "ctime": 1785147478, "time_str": "18:17:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260727/c678460606.shtml"}, {"id": "4812581", "title": "广生堂：向特定对象发行股票申请获同意", "content": "广生堂公告，公司近日收到中国证监会出具的《关于同意福建广生堂药业股份有限公司向特定对象发行股票注册的批复》（证监许可〔2026〕1759 号）。同意公司向特定对象发行股票的注册申请。本次发行应严格按照报送深圳证券交易所的申报文件和发行方案实施。批复自同意注册之日起12个月内有效。公司董事会将按要求办理本次发行相关事宜，并及时履行信息披露义务。", "ctime": 1785147437, "time_str": "18:17:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260727/c678460596.shtml"}, {"id": "4812577", "title": "迈普医学：控股股东袁玉宇与徐弢一致行动协议到期终止，控制权不变", "content": "迈普医学公告，公司控股股东、实际控制人袁玉宇先生与其一致行动人徐弢先生签署的《一致行动协议》及其补充协议于2026年7月26日到期终止，2026年7月27日起一致行动关系解除。本次权益变动前，袁玉宇持股16.53%，徐弢持股16.29%，合计持股32.82%。权益变动后，双方持股数量和比例保持不变，但不再合并计算。公司控股股东、实际控制人仍为袁玉宇先生。徐弢先生及其他持股5%以上股东已出具不谋求上市公司控制权的书面承诺。", "ctime": 1785147410, "time_str": "18:16:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260727/c678460588.shtml"}, {"id": "4812569", "title": "中力股份：拟以5000万元-1亿元回购公司股份", "content": "中力股份公告，拟以5000万元-1亿元回购公司股份，回购价格不超过50元/股。", "ctime": 1785147335, "time_str": "18:15:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260727/c678460573.shtml"}, {"id": "4812567", "title": "中国能建：年度累计新签合同额5131.88亿元，同比下降33.81%", "content": "中国能建公告，2026年4-6月合计新签项目数量11563个，新签合同额2369.92亿元；年度累计新签项目数量22198个，新签合同额5131.88亿元，同比下降33.81%。按地区分布统计，境内新签合同额3576.91亿元，同比下降37.89%；境外1554.97亿元，同比下降22.05%。", "ctime": 1785147331, "time_str": "18:15:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260727/c678460572.shtml"}, {"id": "4812565", "title": "东方精工：2026年上半年净利润38.46亿元，同比增长867.75%", "content": "东方精工公告，2026年上半年营业收入16.91亿元，同比下降21.68%。净利润38.46亿元，同比增长867.75%。公司经本次董事会审议通过的利润分配预案为：以分红方案未来实施时股权登记日的股本总额为基数，向全体股东每10股派发现金红利2元（含税），送红股0股（含税），不以公积金转增股本。", "ctime": 1785147325, "time_str": "18:15:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260727/c678460568.shtml"}, {"id": "4812563", "title": "三星电子确认HBM5将采用2纳米GAA工艺，速度较HBM4E提升50%以上", "content": "三星电子7月27日发布对公司半导体事业部技术开发室长具子铉的采访。具子铉表示，预计下一代HBM5内存的运行速度将比HBM4E快50%以上，“HBM5基础芯片将采用GAA结构的2纳米工艺，并实现更高集成度的硅通孔（TSV）”。具子铉称，三星电子将基于在4纳米HBM4基础芯片上获得的经验和技术竞争力，提前在HBM5中引入2纳米工艺，并拓展与移动、HBM、AI、HPC、汽车电子、机器人等领域的客户合作，引领半导体生态系统进一步发展壮大。（界面新闻）", "ctime": 1785147301, "time_str": "18:15:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260727/c678460563.shtml"}, {"id": "4812559", "title": "穿越者启动载人火箭发射服务合作伙伴公开遴选，锁定未来30次发射订单", "content": "今日，国内商业载人航天服务商穿越者宣布启动载人火箭发射服务合作伙伴公开遴选，以公开遴选加竞争性谈判方式确定合作主体，锁定未来30次发射订单；入围主合作单位将签订正式采购合同并获预付定金，需配合地面联合试验及无人飞船匹配飞行验证。此外，公司上半年太空飞行体验报名人数较去年全年翻倍，已完成载人飞船总体方案论证、全尺寸试验舱研制等关键节点，下一步将开展逃逸飞行试验和无人飞行验证。（科创板日报）", "ctime": 1785147242, "time_str": "18:14:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260727/c678460546.shtml"}, {"id": "4812557", "title": "加快补短板，推进全面高质量发展——国新办发布会展望“十五五”时期残疾人事业新局面", "content": "9项主要指标、7方面32项重点任务、45项重点服务项目和专项行动……《残疾人保障和发展“十五五”规划》的制定施行，将引领广大残疾人和残疾人事业迈向怎样的新五年？7月27日，在国新办举行的“开局起步‘十五五’”系列主题新闻发布会上，中国残联主席程凯表示，“十五五”时期是残疾人事业加快补上短板，推进全面发展、高质量发展的重要时期。（新华社）", "ctime": 1785147236, // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
