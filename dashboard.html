time": 1778737681, "time_str": "13:48:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260514/c676686813.shtml"}, {"id": "4363077", "title": "古巴官员称该国柴油和燃料油储备已耗尽", "content": "当地时间13日，古巴能源和矿业部长比森特·德拉奥召开新闻发布会，表示古巴的柴油和燃料油储备已完全耗尽，全国电网处于“危急状态”。德拉奥称，当前电力系统仅依靠本国原油、天然气和可再生能源维持运行。德拉奥表示，古巴仍在继续寻求进口燃料，但当前国际油价和运输成本上涨使相关工作更加困难。（央视新闻）", "ctime": 1778737461, "time_str": "13:44:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260514/c676686714.shtml"}, {"id": "4363057", "title": "习近平同美国总统特朗普会谈（全文）", "content": "5月14日上午，国家主席习近平在北京人民大会堂同来华进行国事访问的美国总统特朗普举行会谈。习近平指出，当前百年变局加速演进，国际形势变乱交织，中美两国能不能跨越“修昔底德陷阱”，开创大国关系新范式？能不能携手应对全球性挑战，为世界注入更多稳定性？能不能着眼两国人民福祉和人类前途命运，共同开创两国关系美好未来？这些是历史之问、世界之问、人民之问，也是大国领导人需要共同书写的时代答卷。我愿同特朗普总统共同为中美关系这艘大船领好航、掌好舵，让2026年成为中美关系继往开来的历史性、标志性年份。习近平强调，中方致力于中美关系稳定、健康、可持续发展。我同特朗普总统赞同将构建“中美建设性战略稳定关系”作为中美关系新定位，将为未来3年乃至更长时间的中美关系提供战略指引，相信会受到两国人民和国际社会的欢迎。“建设性战略稳定”应该是合作为主的积极稳定，应该是竞争有度的良性稳定，应该是分歧可控的常态稳定，应该是和平可期的持久稳定。“中美建设性战略稳定关系”不是一句口号，而应该是相向而行的行动。（新华社）", "ctime": 1778737358, "time_str": "13:42:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260514/c676686702.shtml"}, {"id": "4363051", "title": "阿里云日均Token收入较4月初已增长五倍", "content": "记者多方获悉，截至5月13日，阿里云日均Token收入相比4月初已经增长超过五倍。月收入目前已经达到数亿元级别。2026年之后，阿里云将Token（词元）收入作为核心经营指标。阿里云今年4月初设定了一个短期Token收入增长目标。具体要求是，到5月15日前，日均Token收入较4月初要增长5倍。也就是说，阿里云要在两个月内完成目标。目前，这个目标已经达成。记者向阿里云方面发出了置评请求，不过阿里云方面未回应上述消息。(财经杂志)", "ctime": 1778737253, "time_str": "13:40:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260514/c676686664.shtml"}, {"id": "4363037", "title": "中美建设性战略稳定关系", "content": "5月14日上午，国家主席习近平在北京人民大会堂同来华进行国事访问的美国总统特朗普举行会谈。习近平：我同特朗普总统赞同将构建“中美建设性战略稳定关系”作为中美关系新定位。（央视新闻）", "ctime": 1778737053, "time_str": "13:37:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260514/c676686604.shtml"}, {"id": "4362987", "title": "金博股份推出钠电KBHC系列超高纯硬碳负极新品", "content": "5月14日，金博股份正式推出钠电KBHC系列超高纯硬碳负极新品——KBHC300与KBHC330，其杂质含量均控制在0.1%以下，在循环寿命、首效及倍率性能方面表现优异。（人民财讯）", "ctime": 1778736586, "time_str": "13:29:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260514/c676686467.shtml"}, {"id": "4362985", "title": "白酒板块直线拉升，皇台酒业涨停", "content": "白酒板块直线拉升，皇台酒业涨停，古井贡酒、老白干酒、迎驾贡酒、舍得酒业、顺鑫农业等纷纷走高。相关ETF方面，消费50ETF富国（515650）涨0.55%，成交额2552.13万元，消费ETF汇添富（159928）涨0.83%，成交额2.28亿元。", "ctime": 1778736585, "time_str": "13:29:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260514/c676686465.shtml"}, {"id": "4362979", "title": "报告：Anthropic企业采用率首超OpenAI", "content": "Ramp AI Index日前发布报告称，Anthropic的企业采用率于4月上升3.8%，达到34.4%；OpenAI采用率下降2.9%，至32.3%。过去一年中，Anthropic的企业采用率增长4倍，而OpenAI的企业采用率仅增长了0.3%。报告来自企业信用卡与财务自动化平台Ramp，该平台追踪了超过5万家美国企业的支出模式。但该报告也指出，Anthropic的优势可能并不像表面看起来那样稳固：不断上升的成本、算力限制，以及推动公司营收高速增长的“基于Token计费”模式本身，都可能对其构成威胁。（科创板日报）", "ctime": 1778736562, "time_str": "13:29:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260514/c676686457.shtml"}, {"id": "4362975", "title": "本田首席执行官：已撤回到2040年纯电动与燃料电池车型占全球汽车销量100%的目标", "content": "本田首席执行官：已撤回到2040年纯电动与燃料电池车型占全球汽车销量100%的目标。（新浪财经）", "ctime": 1778736419, "time_str": "13:26:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260514/c676686420.shtml"}, {"id": "4362973", "title": "零售板块短线拉升，友阿股份涨停", "content": "零售板块短线拉升，友阿股份涨停，百联股份、合百集团、小商品城、宁波中百、万辰集团跟涨。", "ctime": 1778736355, "time_str": "13:25:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260514/c676686409.shtml"}, {"id": "4362953", "title": "沪深京三市成交额超2.5万亿元，较上日此时放量2081亿元", "content": "据同花顺iFinD数据，沪深京三市成交额超2.5万亿元，较上日此时放量2081亿元，预计全天成交金额约3.5万亿元。截至目前，沪市成交额11061亿元，深市成交额13755亿元，北证50成交额193亿元。", "ctime": 1778736201, "time_str": "13:23:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260514/c676686377.shtml"}, {"id": "4362943", "title": "市场监管总局开展“动力电池质量强链”专项行动", "content": "市场监管总局自2024年起开展为期两年的“动力电池质量强链”专项行动，旨在通过构建全生命周期标准体系，提升新能源汽车电池安全与质量。专项行动中，市场监管总局编制了《动力电池安全与质量提升标准体系》，涵盖基础通用、材料部件、制造检测等6大板块，实现了从“实验室”到“公路”的全程覆盖。此外，市场监管总局还编制出台了首个《动力电池缺陷调查与召回实施技术规范》，并成功完成了动力电池超快速在线CT、电芯性能自动化测试装备的检测评定，多项指标达到国际先进水平。（央视新闻）", "ctime": 1778736037, "time_str": "13:20:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260514/c676686335.shtml"}, {"id": "4362937", "title": "第三代半导体、碳化硅方向午后再度拉升，露笑科技涨停", "content": "第三代半导体、碳化硅方向午后再度拉升，露笑科技涨停，天岳先进、正帆科技涨近20%，美迪凯、燕东微跟涨。消息面上，Citrini发布AI供应链报告，明确将SiC列为AI领域被严重忽略的核心主线。到2030年AI电源将占SiC电源市场的50%，衬底和设备需求有望增长近10倍。SiC在CoWoS先进封装中的应用规模将超过电源市场。当前百亿级市场，未来有望突破2000-3000亿。", "ctime": 1778735948, "time_str": "13:19:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260514/c676686326.shtml"}, {"id": "4362931", "title": "习近平同美国总统特朗普参观天坛", "content": "5月14日，国家主席习近平同来华进行国事访问的美国总统特朗普参观天坛。\n\n习近平在祈年殿迎接特朗普到访。两国元首在祈年殿广场合影，并共同参观祈年殿。(央视新闻)", "ctime": 1778735758, "time_str": "13:15:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260514/c676686280.shtml"}, {"id": "4362901", "title": "马斯克说会谈很顺利，黄仁勋点赞、库克比耶", "content": "美国《纽约邮报》记者艾米丽·古迪恩（EmilyGoodin）刚刚在社交媒体上发文说，白宫记者团在人民大会堂外见到了特斯拉公司首席执行官马斯克、英伟达创始人兼首席执行官黄仁勋、苹果首席执行官库克等人。被问及会谈情况如何。马斯克说，会谈“非常顺利”，并称“很多好事正在发生”。库克先对镜头比了个“耶”，随后又竖起大拇指。黄仁勋说，“会谈进行得很顺利”，并称两国元首都“棒极了”。（国是直通车）", "ctime": 1778735251, "time_str": "13:07:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260514/c676686156.shtml"}, {"id": "4362885", "title": "一季度我国数字产业同比增长12.9%", "content": "记者从工业和信息化部了解到，一季度，我国数字产业实现良好开局，行业利润大幅改善，人工智能加快融合应用，新赛道新动能加速释放。数据显示：一季度，数字产业实现收入9.5万亿元，同比增长12.9%。在电子信息制造业利润强劲增长拉动下，数字产业实现利润总额7378亿元，同比增长23.6%，增速较上年同期提升16.6个百分点。一季度，互联网业务呈现较快增长势头。规模以上互联网和相关服务企业完成业务收入5027亿元，同比增长10.6%，增速较上年同期加快9.2个百分点。算力基础设施加快布局，截至3月底，我国在用算力中心标准机架达1445万架，围绕算力枢纽已建成超70条算力大通道。数字产业集聚态势显著。一季度，广东、江苏、北京、上海、浙江等数字产业收入前10大省份对全国数字产业收入增长贡献率达89.1%。（央视新闻）", "ctime": 1778735058, "time_str": "13:04:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260514/c676686112.shtml"}, {"id": "4362873", "title": "美国总统特朗普乘车抵达天坛", "content": "5月14日，美国总统特朗普乘车抵达天坛。(央视新闻)", "ctime": 1778734990, "time_str": "13:03:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260514/c676686086.shtml"}, {"id": "4362833", "title": "摩尔线程（无锡）工业具身智能创新中心启动", "content": "据摩尔线程公众号，5月13日，摩尔线程与首批16家联合共建单位签署合作备忘录，正式启动摩尔线程（无锡）工业具身智能创新中心。创新中心首批16家联合共建单位包括：清华AIR创新中心、上海交通大学无锡光子芯片研究院、华中科技大学无锡研究院、无锡先进技术研究院、无锡学院、极佳科技、光轮智能、光线云、天奇自动化工程股份有限公司、无锡优奇智能科技有限公司、凯龙高科技股份有限公司、无锡雪浪数制科技有限公司、华沿机器人(江苏)有限公司、无锡中车时代智能装备研究院有限公司、无锡沐创集成电路设计有限公司、谋先飞公司。各方将就创新中心的共建、运营和生态拓展进行密切合作。", "ctime": 1778734805, "time_str": "13:00:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260514/c676686054.shtml"}, {"id": "4362827", "title": "建发股份与宁德时代签署战略合作备忘录", "content": "5月14日，厦门建发股份有限公司（简称“建发股份”）与宁德时代签署战略合作备忘录。双方将以海外投资为纽带，围绕新能源产业上下游开展深层次合作。（人民财讯）", "ctime": 1778734626, "time_str": "12:57:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260514/c676685990.shtml"}, {"id" const META     = {"update_time": "2026-05-14 14:35:56", "sentiment_score": 60.33653846153846, "agents": []};

// 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
