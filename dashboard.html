，第二次例会是中欧深化合作的新起点，责成工作团队持续推进后续工作，推动相关成果共识尽早落地，为中欧贸易投资磋商机制第三次例会做好准备。", "ctime": 1791552519, "time_str": "21:28:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261009/c680541752.shtml"}, {"id": "5355757", "title": "何立峰会见欧盟委员会贸易和经济安全委员谢夫乔维奇", "content": "中共中央政治局委员、国务院副总理何立峰9日下午在京会见欧盟委员会贸易和经济安全委员谢夫乔维奇，双方就中欧经贸关系交换了意见。何立峰表示，中方始终高度重视发展同欧盟经贸关系，愿与欧方共同落实好双方领导人达成的重要共识。双方应充分发挥中欧贸易投资磋商机制作用，坚持稳定、平衡的中欧关键贸易伙伴关系新定位，持续对话，妥处分歧，推动双边经贸关系健康稳定发展。谢夫乔维奇表示，中国是欧盟重要经贸合作伙伴，愿持续推进贸易投资磋商，加强沟通、共促合作。（新华社）", "ctime": 1791551964, "time_str": "21:19:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261009/c680541680.shtml"}, {"id": "5355741", "title": "OpenAI收入或比市场预期低30%，GPT-6发布评价分化", "content": "10月8日，OpenAI近期给予投资者的财报速览显示，该公司9月的年化经常性收入（ARR）为500亿美元。这一ARR水平比北美资本市场此前共识的700亿美元低约30%。同时这也意味着，若想要按照2万亿美元的参考估值进行IPO，OpenAI ARR估值倍数需要被提高到40倍以上。对于“收入低于预期”的传言，10月9日，媒体援引接近OpenAI的消息人士观点称，公司9月500亿美元ARR或属实，700亿美元ARR为OpenAI公司至今年底的目标。（21世纪经济报道）", "ctime": 1791551791, "time_str": "21:16:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261009/c680541656.shtml"}, {"id": "5355703", "title": "吉利汽车宣布进军加拿大市场", "content": "10月9日，吉利汽车正式宣布进军加拿大市场。随着加拿大团队的成立，吉利汽车正在建立当地业务，将在2027年向加拿大消费者推出首批汽车之前发展零售和服务网络。（界面新闻）", "ctime": 1791551391, "time_str": "21:09:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261009/c680541592.shtml"}, {"id": "5355695", "title": "独联体成员国领导人称将促进成员国间战略伙伴关系", "content": "独立国家联合体（独联体）成员国领导人当地时间9日在土库曼斯坦土库曼巴希签署文件，通过有关独联体成立35周年的声明。声明说，独联体致力于促进成员国间的战略伙伴关系。文件在当天举行的独联体国家元首理事会会议期间签署。声明说，当今国际关系正经历深刻变革，独联体致力于促进成员国间的战略伙伴关系，并作为一个独特的对话平台，在平等与相互尊重的基础上开展合作。（央视新闻）", "ctime": 1791551270, "time_str": "21:07:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261009/c680541533.shtml"}, {"id": "5355687", "title": "捷克地方选举和参议院选举投票启动", "content": "当地时间10月9日，捷克全国地方选举和参议院选举投票正式启动，选民将选举各市镇和地方议会成员，同时在27个选区进行参议院换届选举，选出参议院三分之一席位。此次投票于当地时间9日14时开始，并将持续至10日14时。这是捷克自1993年独立以来举行的第九次地方选举，地方选举与参议院选举首轮投票同期举行。在参议院选举中，共有27个选区进行投票。如果首轮没有候选人获得规定的多数票，得票最高的两名候选人将进入第二轮投票，第二轮预计于10月16日至17日举行。此次选举也被视为观察捷克地方政治格局以及主要政党和政治力量支持度的重要窗口。最终投票结果将于投票结束后陆续公布。（央视新闻）", "ctime": 1791551163, "time_str": "21:06:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261009/c680541486.shtml"}, {"id": "5355643", "title": "瓦轴B：收到终止上市决定，五个交易日内摘牌", "content": "瓦轴B公告，公司此前因要约收购后社会公众持有股份比例低于10%，股权分布不再具备上市条件并申请主动终止上市。2026年10月9日，公司收到深交所终止上市决定，股票将于公告终止上市决定之日起五个交易日内摘牌，不设退市整理期。", "ctime": 1791550877, "time_str": "21:01:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261009/c680541324.shtml"}, {"id": "5355639", "title": "瓦轴B：终止上市后瓦轴集团拟2.86港元/股收购余股", "content": "瓦轴B公告，公司此前披露瓦轴集团要约收购公司股份，因社会公众持股比例低于10%，公司已收到深交所终止上市决定。瓦轴集团拟于2026年10月12日、10月13日以2.86港元/股收购余股，拟收购余股最大数量为1.04亿股，最高资金总额为2.98亿港元。", "ctime": 1791550858, "time_str": "21:00:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261009/c680541320.shtml"}, {"id": "5355561", "title": "期市夜盘开盘，国内期货主力合约多数上涨，20号胶涨超2%", "content": "期市夜盘开盘，国内期货主力合约多数上涨。涨幅方面，20号胶涨超2%，橡胶、合成橡胶、焦煤、聚丙烯、沪锡等涨超1%。跌幅方面，玻璃、双胶纸、沥青跌超1%。", "ctime": 1791550798, "time_str": "20:59:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261009/c680541307.shtml"}, {"id": "5355555", "title": "六九一二：胡杨减持计划期限届满，实际减持0.372%", "content": "六九一二公告，股东胡杨原计划于2026年7月10日至2026年10月9日以集中竞价方式减持不超过50万股，占公司总股本比例0.71%。截至期限届满，胡杨实际减持26.04万股，占公司总股本比例0.372%，减持均价112.49元/股；减持后持股209.8万股，占比2.997%。", "ctime": 1791550771, "time_str": "20:59:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261009/c680541303.shtml"}, {"id": "5355545", "title": "康龙化成：Pharmaron Holdings Limited拟询价转让1.00%股份", "content": "康龙化成公告，股东Pharmaron Holdings Limited拟通过询价转让方式转让1837.3万股，占公司总股本的1.00%，转让原因为自身资金需求。本次转让不通过集中竞价交易或大宗交易方式进行，不属于通过二级市场减持；受让方为具备相应定价能力和风险承受能力的机构投资者，受让股份后6个月内不得转让。", "ctime": 1791550745, "time_str": "20:59:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261009/c680541295.shtml"}, {"id": "5355535", "title": "景嘉微：CH37系列正推进客户导入及小批量量产", "content": "景嘉微在互动平台表示，CH37系列面向具身智能、边缘计算等通用市场，具备充沛AI算力、灵活计算精度及多模态感知融合等核心优势，适配机器人、工业无人机、具身智能等多模态感知与低延迟需求较高的场景。目前CH37系列产品正持续推进客户导入工作、小批量量产工作、完善配套软件开发与优化，以及销售推广活动。", "ctime": 1791550567, "time_str": "20:56:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261009/c680541273.shtml"}, {"id": "5355487", "title": "伊朗总统提议建立“独联体+1”机制", "content": "伊朗总统佩泽希齐扬9日在土库曼斯坦土库曼巴希举行的独联体国家元首理事会会议上提议建立“独联体+1”机制，以加强伊朗与该组织之间的合作。据独联体执行委员会官网9日发布的消息，佩泽希齐扬首次受邀出席独联体国家元首理事会会议。他提议建立一个灵活且高效的对话与合作机制，即“独联体国家+伊朗”或称“独联体+1”机制，这将有助于双方在过境运输、能源、科技、环境保护、旅游及文化交流等领域开展合作。（新华社）", "ctime": 1791550056, "time_str": "20:47:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261009/c680541178.shtml"}, {"id": "5355479", "title": "汇金科技：公司转让壹证通81.1686%股权完成交割", "content": "汇金科技公告，公司此前拟向马圣东先生转让壹证通81.1686%股权；2026年9月30日，壹证通已完成本次股权转让交割，公司不再持有壹证通股权，壹证通不再纳入公司合并报表范围。", "ctime": 1791549998, "time_str": "20:46:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261009/c680541171.shtml"}, {"id": "5355453", "title": "三柏硕：股票异动核查无重大未披露事项，员工持股计划正常实施", "content": "三柏硕公告，公司股票于2026年10月08日、2026年10月09日连续两个交易日收盘价格涨幅偏离值累计超过20%。经核查，公司目前经营情况正常，2026年员工持股计划处于正常实施过程中；2026年半年度营业收入2.56亿元，同比增长4%，归属于上市公司股东的净利润亏损2057.95万元。公司称未直接涉及体育赛事业务，人工智能子公司业务尚处早期。", "ctime": 1791549792, "time_str": "20:43:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261009/c680541147.shtml"}, {"id": "5355433", "title": "天孚通信：公司为CPO产品配套的FAU、ELS等产品已实现稳定量产交付", "content": "天孚通信在投资者关系活动中表示，依托在光学耦合、精密制造及规模化批量交付方面的长期积累，公司为CPO产品配套的FAU、ELS等产品在性能、良率及交付保障等方面已具备较好的基础，目前相关产品已实现稳定量产交付。随着下游需求持续增长，公司有信心进一步把握CPO领域的发展机遇，持续提升相关产品的业务贡献。", "ctime": 1791549676, "time_str": "20:41:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261009/c680541131.shtml"}, {"id": "5355413", "title": "特斯拉弃用“自动驾驶”命名 以争取欧洲监管批准", "content": "特斯拉正在淡化Full Self-Driving（全自动辅助驾驶）这一命名，以争取其驾驶辅助系统在欧洲获得批准，并与这个长期被批评具有误导性的名称拉开距离。最近几天，特斯拉已开始在欧洲网站上使用“Tesla Assisted Driving（特斯拉辅助驾驶）”这一名称。与此同时，其美国网站仍将这项技术称为\"Full Self-Driving (Supervised)”,即“全自动辅助驾驶（受驾驶监督）”.（财联社）", "ctime": 1791549486, "time_str": "20:38:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261009/c680540433.shtml"}, {"id": "5355389", "title": "广东：着重抓好场景培育和开放以及算力网等新型基础设施建设", "content": "广东省先进制造业大会10月9日在广州召开，省委书记黄坤明出席会议并讲话。黄坤明指出，要强化需求导向、应用牵引、场景促进，着重抓好场景培育和开放以及算力网等新型基础设施建设，打造成为新技术加快从点上突破到面上应用的“首选承载地”。要贯通基础研究、技术攻关、成果转化，坚持向高端攀登、向自主发力、向实用聚焦，加强对战略必争、先进前沿领域的研发布局，强化关键核心技术攻关，加大对基础技术、先进工艺技术、共性技术的推广应用，以强大的创新链支撑先进制造产业链。", "ctime": 1791549305, "time_str": "20:35:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261009/c680539816.shtml"}, {"id": "5355363", "title": "加拿大9月份就业人数减少6.83万人，预估为增加1万人", "content": "加拿大9月份就业人数减少6.83万人，预估为增加1万人。", "ctime": 1791549144, "time_str": "20:32:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261009/c680539319.shtml"}, {"id": "5355355", "title": "近期海外进出口传闻的政策限制对公司是否有影响？天孚通信回应", "content": "10月9日，天孚通信在线上通讯会上回应称，首先公司主营业务为各类无源光器件和有源光器件的研发、生产与销售，目前发布的相关政策未对光器件产品进行约束，不涉及对公司业务产生影响。其次，公司对美国市场的销售收入占比较低，2025年公司对北美地区销售收入占营业收入比例约为1.28%。从当前经营情况看，公司在手订单及客户需求整体保持旺盛，公司会根据市场需求及客户项目推进节奏，有序推进全球扩产。公司长期看好光互连行业的发展前景，尤其对CPO、NPO等方向的持续成长机会保持乐观预期。（人民财讯）", "ctime": 1791549098, "time_str": "20:31:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261009/c680539121.shtml"}, {"id": "5355325", "title": "10月9日 周五《新闻联播》要闻18条", "content": "1、应习近平邀请 博茨瓦纳总统将访华；\n2、【新思想引领新征程】因地制宜 推动县域经济高质量发展；\n3、中共中央 国务院印发《关于发展新质生产力的意见》；\n4、财政部安排使用5500亿元地方政府债务结存限额；\n5、国庆假期旅游市场红火 国内出游达8.26亿人次；\n6、我国年人均快递量超140件；\n7、【新闻特写】“六张网”带来的新机遇；\n8、我国将开展农业品牌保护专项行动；\n9、前8个月我国软件业务收入超过10万亿元；\n10、2026—2027年度全国受灾群众冬春救助工作启动；\n11、新建铁路义乌站站房今天正式启用；\n12、国管住房公积金窗口正式落地雄安新区；\n13、G3033奎独库高速关键控制性隧道主体施工启动；\n14、中方就加强和振兴联大提出三点主张；\n15、中国代表：日本已成为威胁地区和平稳定的突出因素；\n16、沙特称利雅得机场遭袭造成人员死伤 媒体称也门胡塞武装控制区遭沙特空袭；\n17、伊朗称伊美继续进行间接谈判；\n18、世贸组织上调今年全球货物贸易增长预期。（央视新闻）", "ctime": 1791549036, "time_str": "20:30:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261009/c680538929.shtml"}, {"id": "5355269", "title": "重眸科技完成近亿元股权融资", "content": "近日，智能遥感相机研发商重眸科技完成近亿元股权融资，本轮投资方为民银国际、亦庄种子基金、远翼投资。重眸科技成立于2024年，是国内商业航天领域专注0.5米及优于0.5米分辨率光学遥感相机的高新技术企业，可提供星载一体化设计、高品质遥感相机研发和制造等解决方案。根据财联社创投通—执中数据，以2026年10月为预测基准时间，后续2年的融资预测概率为50.09%。（科创板日报）", "ctime": 1791549000, "time_str": "20:30:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261009/c680538887.shtml"}, {"id": "5355253", "title": "华为手机无法播放懂车帝App尊界视频？知情人士：懂车帝鸿蒙版App尚未接通抖音来源视频的播放功能", "content": "近日有网友发布视频称，使用华为手机打开懂车帝App，无法播放尊界V800相关测试视频，页面显示“功能陆续开放中，敬请期待”。有网友怀疑，是华为手机限制了对相关视频的播放。对此，知情人士表示，懂车帝鸿蒙版App尚未接通抖音来源视频的播放功能，因此部分带有抖音标识的视频暂时无法播放。该问题与视频内容无关，并非鸿蒙系统屏蔽相关视频。（澎湃）", "ctime": 1791548931, "time_str": "20:28:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261009/c680538872.shtml"}, {"id": "5355217", "title": "2026年新疆阿勒泰地区“雪假”时间确定", "content": "9日，记者从新疆阿勒泰地区教育局获悉，阿勒泰地区义务教育阶段学校2026年“雪假”时间为12月16日（周三）至18日（周五），共3天，与周末（12月19日、20日）相连，形成5天小长假。阿勒泰地区各县（市）各学校将结合气候条件、本地资源和课程目标，立足2025年试行“雪假”经验，聚焦冰雪运动普及和冰雪文化启蒙，开展多样化冰雪实践活动。（新华社）", "ctime": 1791548549, "time_str": "20:22:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261009/c680538756.shtml"}, {"id": "5355213", "title": "正和生态：汇恒投资完成工商变更，金河科技持股43.7982%", "content": "正和生态公告，公司此前披露，控股股东汇恒投资与金河科技签署《增资协议》，金河科技持有汇恒投资43.7982%的股权。近日，汇恒投资已完成工商变更登记并取得换发的《营业执照》，注册资本变更为2.14亿元。", "ctime": 1791548530, "time_str": "20:22:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261009/c680538755.shtml"}, {"id": "5355203", "title": "我国牵头制定的船舶压载水管理系统调试测试国际标准发布", "content": "国际标准化组织（ISO）近日发布《船舶与海洋技术 压载水管理系统（BWMS）电解法压载水管理系统的调试和测试程序》国际标准。该标准由中国牵头，美国、德国、加拿大、瑞士、挪威、丹麦等国专家参与制定。船舶压载水携带的外来生物是海洋生物入侵的重要途径之一，严重威胁海洋生态安全。压载水管理系统是杀灭这些入侵生物的关键设备，其杀灭效果取决于产品本身设计性能及安装后现场调试水平。该标准规范了电解法压载水管理系统调试测试技术要求，规定系统运行时长不少于60分钟、排放采样体积不少于1立方米，并对大于等于50微米‌和10微米至50微米‌两类生物进行达标验证，确保满足国际公约排放标准，为全球船东、船厂、设备制造商和行业主管部门提供统一的、科学的压载水管理系统调试测试程序和验收依据。截至目前，我国牵头制定3项压载水管理系统相关国际标准，覆盖系统设计、调试等关键环节，为遏制有害水生物通过压载水跨海域传播发挥重要作用，助力全球海洋生态环境保护。（央视新闻）", "ctime": 1791548418, "time_str": "20:20:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261009/c680538730.shtml"}, {"id": "5355191", "title": "弘业期货：一致行动人苏豪弘业拟减持公司不超过0.4366%股份", "content": "弘业期货公告，控股股东苏豪控股之一致行动人苏豪弘业持有公司股份1.44亿股，占总股本14.33%，拟于2026年11月2日至2027年1月30日以集中竞价方式减持不超过440万股，占总股本比例0.4366%。本次减持需经其股东会批准，不会导致公司控制权变更。", "ctime": 1791548335, "time_str": "20:18:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261009/c680538713.shtml"}, {"id": "5355187", "title": "天康生物：2026年9月生猪销量36.12万头，同比下降0.03%", "content": "天康生物公告，2026年9月销售生猪36.12万头，环比下降12.14%，同比下降0.03%；销售收入4.07亿元，环比下降2.40%，同比下降19.88%；商品猪销售均价9.79元/公斤，环比增长1.87%。2026年1—9月累计销售生猪301.67万头，累计销售收入32.69亿元。", "ctime": 1791548307, "time_str": "20:18:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261009/c680538706.shtml"}, {"id": "5355183", "title": "海南多地发布暴雨红色预警", "content": "海南省气象台今天17时继续发布暴雨四级预警，受偏东急流影响，过去24小时，琼中、琼海、屯昌和万宁4市县大部分乡镇已出现150毫米以上的强降水，预计9日17时到10日8时，琼中、琼海和万宁3市县部分乡镇仍将出现50至100毫米降水。截至目前，陵水、琼海、琼中、万宁暴雨红色预警信号仍在生效中，三亚、保亭、屯昌发布暴雨橙色预警信号，陵水黎族自治县光坡镇过去24小时降雨量已达249.8毫米。万宁市沉香湾水库9日19时开闸泄洪，下泄流量为每秒30至300立方米，后续将根据入库水量和雨情变化动态调整。泄洪期间，下游河道水位将明显上涨。相关部门提醒市民游客远离河道、泄洪通道及可能受淹区域，严禁在河道内捕鱼、垂钓、涉水通行或开展施工作业。海南省气象台建议相关部门继续做好中小型水库安全巡查，以及城乡积涝、农田渍涝、中小河流洪水、山洪和地质灾害的风险防御工作。（新华社）", "ctime": 1791548302, "time_str": "20:18:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261009/c680538705.shtml"}, {"id": "5355179", "title": "报告显示今年已发生超百起美伊冲突相关船舶安全事件", "content": "当地时间10月9日，英国海上贸易行动办公室（UKMTO）的最新报告显示，今年以来，其监测范围内已记录122起与美伊冲突相关的船舶安全事件。此外，红海地区发生6起针对航运船舶的袭击事件，另共记录41起与海盗活动相关的事件。报告指出，霍尔木兹海峡及周边海域的安全形势持续严峻。截至目前，该机构今年已发布133份海上安全警告和18份安全通告。（央视新闻）", "ctime": 1791548238, "time_str": "20:17:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261009/c680538700.shtml"}, {"id": "5355165", "title": "大东方：完成回购1245.81万股，价格3.8元/股~4.3元/股，支付5002.52万元", "content": "大东方公告，公司此前拟以5000万元~1亿元回购股份，回购价格上限为5.17元/股，回购股份用于维护公司价值及股东权益（出售）。2026年10月9日，公司完成回购，实际回购1245.81万股，占总股本1.41%，使用资金总额5002.52万元，回购方案实施完毕。", "ctime": 1791548036, "time_str": "20:13:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261009/c680538655.shtml"}, {"id": "5355161", "title": "富特科技：长江蔚来产业基金拟减持公司不超过2.8940%股份", "content": "富特科技公告，持有公司1724.22万股、占总股本7.3644%的股东湖北长江蔚来新能源投资管理有限公司－湖北长江蔚来新能源产业发展基金合伙企业（有限合伙）拟于2026年11月2日至2027年2月1日，通过集中竞价交易或大宗交易减持不超过677.57万股，占总股本比例2.8940%。", "ctime": 1791548019, "time_str": "20:13:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261009/c680538651.shtml"}, {"id": "5355095", "title": "欧盟航空安全局扩大针对沙特空域安全警告范围", "content": "欧盟航空安全局9日表示，鉴于也门胡塞武装近期对利雅得机场等沙特阿拉伯目标的袭击，该机构当天更新针对沙特阿拉伯空域的安全警告，扩大了建议航空运营商避免飞行的空域范围。欧盟航空安全局在9日更新的公告中指出，近期发生的袭击表明，胡塞武装有能力且有意袭击沙特境内更深处的目标，包括首都利雅得等地。（央视新闻）", "ctime": 1791547582, "time_str": "20:06:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261009/c680538569.shtml"}, {"id": "5355087", "title": "格芯推出面向物理AI的FDX Fusion FD-SOI平台 计划2028年在德国德累斯顿投产", "content": "格芯（GlobalFoundries）推出面向物理AI的FDX Fusion FD-SOI平台，计划于2028年在德国德累斯顿启动该平台的生产。（蓝鲸新闻）", "ctime": 1791547522, "time_str": "20:05:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261009/c680538555.shtml"}, {"id": "5355073", "title": "北京成立为老实验室求解养老难题", "content": "记者9日从在国家会议中心举办的2026北京养老服务行业发展四季青论坛上获悉，北京搭建的养老领域“政产学研用”一体化创新服务平台“北京为老实验室”正式揭牌成立。该平台将整合全市涉老科研、教学、产业、服务等各领域优质资源，求解养老服务专业支撑不足、科技融合不深、供需对接不畅等现实难题，打通养老领域“基础研究、技术攻关、成果转化、产业应用”全链条。北京市民政局副局长杨志伟介绍，目前北京为老实验室已集聚全国和省部级重点实验室、高校、科研院所、行业协会、医疗机构、金融机构、科技企业等40余家共建单位。实验室重点开展涉老综合理论研究、智慧养老场景建设、养老标准化建设、养老服务人才建设等四大板块创新工作，使共建单位共享数据、优势互补、聚力协同，做长服务链、产业链，让更多研究成果、研发产品更快更精准更持续落地应用，让更多老年人切实感受和受益于这些进步。（新华社）", "ctime": 1791547446, "time_str": "20:04:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261009/c680538536.shtml"}, {"id": "5355051", "title": "江苏官宣推出词元（Token）券，最高补贴500万元", "content": "江苏五部门近日联合印发支持人工智能创新发展有关实施方案的通知，集中出台一批政策支持抢跑智能经济新赛道，其中就包括《江苏省词元（Token）券实施方案》。该方案由江苏省发改委、省财政厅、省数据局联合出     el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
