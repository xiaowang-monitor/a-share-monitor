  height: 6px; border-radius: 3px; background: #1e293b; overflow: hidden;
}
.score-bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s; }
.up { color: var(--red); }
.down { color: var(--green); }
.pulse { animation: pulse 2s infinite; }
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}
.glow { box-shadow: 0 0 20px rgba(59,130,246,0.15); }

le": "上海亚虹：宁生集团等拟转让29.99%股份，9月17日复牌", "content": "上海亚虹公告，公司此前披露控股股东海南宁生旅游集团有限公司筹划控制权变更事项。2026年9月16日，海南宁生旅游集团有限公司、谢亚明、谢悦与上海飞科投资有限公司签署股份转让协议，合计拟转让公司29.99%股份，转让价格为21.43元/股；公司股票将于2026年9月17日开市起复牌。", "ctime": 1789557266, "time_str": "19:14:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260916/c679978011.shtml"}, {"id": "5186207", "title": "上海亚虹：飞科投资拟受让29.99%股份，控制权拟变更", "content": "上海亚虹公告，2026年9月16日，控股股东海南宁生旅游集团有限公司、谢亚明及谢悦与上海飞科投资签署《股份转让协议》《预受要约协议》，拟合计转让公司29.99%股份，转让价格为21.43元/股、总价为9亿元。股份转让完成后，飞科投资拟以21.43元/股部分要约收购10.21%股份，公司控股股东及实际控制人拟分别变更为上海飞科投资有限公司、李丐腾。", "ctime": 1789557259, "time_str": "19:14:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260916/c679978010.shtml"}, {"id": "5186205", "title": "开尔新材：邢翰学等3人拟向泸州金开转让10.30%股份", "content": "开尔新材公告，控股股东及一致行动人邢翰学、吴剑鸣、邢翰科于2026年9月15日与泸州金开签署《股份转让协议》，拟以8.03元/股转让合计5182.66万股，占总股本10.30%，总价4.16亿元。股份尚未过户，尚需取得深圳证券交易所合规性确认意见并办理过户。", "ctime": 1789557251, "time_str": "19:14:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260916/c679978008.shtml"}, {"id": "5186193", "title": "OpenAI据悉考虑新一轮融资 估值或超1.2万亿美元", "content": "据报道，OpenAI正与投资者就新一轮融资展开初步磋商，这轮融资可能令OpenAI在IPO前的估值超过1.2万亿美元。(第一财经)", "ctime": 1789557123, "time_str": "19:12:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260916/c679977968.shtml"}, {"id": "5186185", "title": "俄副外长：美方所提俄乌“能源停火”没有实际支撑", "content": "俄罗斯副外长里亚布科夫9月16日回答了总台报道员关于俄方是否将就美方提出的俄乌“能源停火”议题启动谈判的提问。里亚布科夫称，俄方认真对待美方一切声明，但这些声明往往缺乏具体举措、实际行动和乌方态度转变的支撑。里亚布科夫同时强调，俄方不会回避接触，与美国的接触正在继续，并将继续下去。他还称，所谓“主战派”正在破坏任何相关安排。（央视新闻）", "ctime": 1789557088, "time_str": "19:11:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260916/c .4%。", "ctime": 1789556430, "time_str": "19:00:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260916/c679977553.shtml"}, {"id": "5185863", "title": "恒玄科技：首次回购5万股，支付人民币466.98万元", "content": "恒玄科技公告，公司此前拟以5000万元~1亿元回购股份，回购价格不超过人民币150元/股，回购股份将用于员工持股计划或股权激励计划。2026年9月16日，公司首次回购5万股，占总股本0.0211%，成交价格区间为92.21元/股~94.94元/股，支付资金总额为人民币466.98万元。", "ctime": 1789556178, "time_str": "18:56:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260916/c679977437.shtml"}, {"id": "5185821", "title": "张升民会见越南副总理兼国防部长", "content": "中央军委副主席张升民16日在京会见出席第十三届北京香山论坛的越南副总理兼国防部长潘文江。张升民说，中越两军要围绕落实两党两国最高领导人重要共识，坚持从战略高度、用发展眼光，规划和推进两军务实合作，分享军队建设发展经验，及时就重要安全问题协调立场、协作配合，携手应对全球性挑战，推动双方合作不断迈上新台阶。潘文江说，越方愿按照两党两国最高领导人战略指引，同中方开展更加务实、更富成效的防务安全合作。（新华社）", "ctime": 1789555811, "time_str": "18:50:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260916/c679977303.shtml"}, {"id": "5185805", "title": "前8个月中哈（连云港）物流合作基地开行中欧（亚）班列666列", "content": "据南京海关统计，今年前8个月，中哈（连云港）物流合作基地累计开行中欧（亚）班列666列，发运集装箱5.46万标箱，同比增长9.18%。作为共建“一带一路”倡议首个实体落地项目，基地自正式运营以来，已累计开行中欧（亚）班列超8200列，发运集装箱超70万标箱。目前已成功构建中亚五国、中吉乌、中俄、跨里海等6条国际班列线路，覆盖阿拉山口、霍尔果斯等5个出境口岸，辐射亚欧两大洲多个国际站点，运输货物种类包含汽车及零配件、化工产品、家用电器、纺织服装、电子设备等。（央视新闻）", "ctime": 1789555532, "time_str": "18:45:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260916/c679977147.shtml"}, {"id": "5185801", "title": "康惠股份：北京康惠智创签署17.2亿元算力服务合同", "content": "康惠股份公告，公司全资子公司北京康惠智创近日与A公司签署《算力服务合同》，合同总金额约为17.2亿元（含税），期限为5年；同时与G公司签署算力服务器《购销合同》，合同总金额约为11.41亿元（含税）。算力交付自2026年三季度末起至2027年一季度末分批实施，预计为公司2026年度新增收入约3000万元。", "ctime": 1789555429, "time_str": "18:43:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260916/c679977112.shtml"}, {"id": "5185799", "title": "力源科技：签订6815.6万元供货合同", "content": "力源科技公告，公司近日与中国电力工程顾问集团东北电力设计院有限公司签署威海热电2×66万千瓦热电联产项目化学水处理系统设备买卖合同，合同金额为人民币6815.6万元（含税）。公司已履行签署该合同的内部审批程序。", "ctime": 1789555339, "time_str": "18:42:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260916/c679977081.shtml"}, {"id": "5185793", "title": "隆华新材：新余隆振减持计划届满，实际减持占总股本0.2556%", "content": "隆华新材公告，股东新余隆振于2026年6月17日至2026年9月16日减持公司股份，其中权益分派实施前减持23.03万股，实施后减持112.91万股，合计占公司总股本0.2556%。截至2026年9月16日，新余隆振持有993.08万股，占总股本1.7765%，本次减持计划已实施完毕，实际减持数量未超过计划数量。", "ctime": 1789555258, "time_str": "18:40:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260916/c679977062.shtml"}, {"id": "5185789", "title": "吉尔吉斯斯坦副总理：对华合作是吉外交政策优先事项", "content": "吉尔吉斯斯坦副总理阿昆别科夫15日说，中国是吉尔吉斯斯坦的好邻居、亲密朋友和主要贸易投资伙伴，发展对华合作是吉外交政策的重要优先事项。(新华社)", "ctime": 1789555247, "time_str": "18:40:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260916/c679977056.shtml"}, {"id": "5185781", "title": "2026年底前推出首个债券指数？港交所：正在筹备", "content": "今日有消息称，港交所据悉将于2026年底前推出首个债券指数。对此，港交所有关负责人回应记者称，港交所正在筹备推出首个债券指数，以支持人民币国际化进程和香港多元资产生态系统的持续发展，期待在未来适当时候分享更多详情。 (中证金牛座)", "ctime": 1789555180, "time_str": "18:39:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260916/c679977042.shtml"}, {"id": "5185739", "title": "美国一共和党众议员提出弹劾赫格塞思", "content": "美国肯塔基州共和党籍联邦众议员托马斯·梅西15日在国会众议院提出对国防部长赫格塞思的弹劾动议，指控赫格塞思“非法”对伊朗采取敌对军事行动和“绑架外国领导人”。梅西在声明中说，赫格塞思在未获美国国会授权情况下，对伊朗开展超过90天的敌对军事行动，涉嫌违法，必须追责。梅西还指认赫格塞思在没有法律授权的情况下指挥行动，“绑架主权国家领导人”。美国当地时间1月3日凌晨对委内瑞拉发动大规模军事打击，强行控制委总统马杜罗夫妇并将他们带到美国。美国司法部长托德·布兰奇力挺赫格塞思，辩称其依法履职，工作“成效卓著”。路透社报道，梅西发起的动议具有优先权，可强制表决，众议院需在两个立法日内审议，但在共和党人掌控的众议院通过的可能性极低。梅西是共和党人，但多次与美国总统特朗普等共和党高层唱反调，公开批评伊朗战事和美国对以色列的援助。(新华社)", "ctime": 1789554829, "time_str": "18:33:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260916/c679976909.shtml"}, {"id": "5185733", "title": "杜特尔特首次公开出庭", "content": "位于荷兰海牙的国际刑事法院16日举行菲律宾前总统杜特尔特案审判前预备会，杜特尔特首次公开出庭。法庭直播画面显示，杜特尔特面容清瘦，身穿黑色外套和白色衬衣。检方、杜特尔特辩护律师及相关方法律代表陈述了案件进展。4月23日，国际刑事法院声称，将以3项所谓“反人类罪”罪名对杜特尔特进行审判。5月27日，该法院宣布从11月30日起正式开庭审理此案。（新华社）", "ctime": 1789554808, "time_str": "18:33:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260916/c679976901.shtml"}, {"id": "5185723", "title": "加沙城一战损建筑倒塌致至少20人死亡", "content": "据巴勒斯坦通讯社16日报道，加沙城一栋在战争中受损的居民楼当天倒塌，已造成至少20人死亡、25人受伤，另有100人下落不明。当地消息人士告诉新华社记者，位于加沙城西南部的一栋大楼16日凌晨2时15分许倒塌。该建筑虽在战火中已成为危楼，但仍有6户家庭居住。大楼附近还有数个难民帐篷受损，建筑倒塌时大多数人在熟睡。巴勒斯坦加沙地带民防部门发表声明称，救援人员正在搜寻被困人员，据信有约100人失踪或被困在废墟之下。声明指出，由于缺乏清理废墟和解救被困人员所需的重型设备，救援行动面临困难。（新华社）", "ctime": 1789554671, "time_str": "18:31:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260916/c679976860.shtml"}, {"id": "5185715", "title": "奥克股份：辽阳中院裁定拍卖嘉业石化12.25%股权", "content": "奥克股份公告，公司此前就金石达、嘉业石化未向公司持股87.75%的控股子公司四川奥克支付溶剂油装置减值补偿款提起诉讼，一审判决给付人民币4091.83万元。近日，公司收到辽阳中院《拍卖通知书》和《执行裁定书》，裁定拍卖嘉业石化持有的四川奥克12.25%股权，奥克股份为优先购买权人。", "ctime": 1789554627, "time_str": "18:30:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260916/c679976833.shtml"}, {"id": "5185709", "title": "威星智能：范慧群减持58万股，持股降至0.75%", "content": "威星智能公告，范慧群截至2026年9月16日通过集中竞价累计减持58万股，占公司总股本0.26%。本次权益变动后，范慧群持股由222.51万股降至164.51万股，持股比例由1.01%降至0.75%，权益变动触及1%整数倍。本次减持与2026年9月5日披露的减持计划一致，计划于2026年9月10日至2026年12月9日减持不超过220.63万股，占总股本1.00%，减持计划尚未实施完毕。", "ctime": 1789554619, "time_str": "18:30:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260916/c679976829.shtml"} 保政策从“纸面”落到“地面”，方能让政策红利真正转化为市场活力。(新华社)", "ctime": 1789554069, "time_str": "18:21:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260916/c679976568.shtml"}, {"id": "5185605", "title": "WTI原油跌超2%", "content": "WTI原油跌超2%，现报103.67美元/桶。", "ctime": 1789553754, "time_str": "18:15:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260916/c679976441.shtml"}, {"id": "5185565", "title": "港迪技术：签署约1亿元（含税）日常经营重要合同", "content": "港迪技术公告，公司近日与某客户新增签署多个销售合同，向客户提供储能修井机自动化控制系统、钻机自动化控制系统，合同总金额约1亿元（含税），合同自盖章之日起生效。", "ctime": 1789553455, "time_str": "18:10:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260916/c679976309.shtml"}, {"id": "5185563", "title": "纽约期金站上4390美元/盎司", "content": "纽约期金站上4390美元/盎司，日内涨1.32%。", "ctime": 1789553454, "time_str": "18:10:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260916/c679976308.shtml"}, {"id": "5185513", "title": "三博脑科：控股股东、实际控制人拟无偿捐赠1亿元股份", "content": "三博脑科公告，控股股东、实际控制人张阳、于春江、石祥恩及栾国明于2026年9月16日与首都医科大学教育基金会签署《捐赠协议》，拟分三批次无偿捐赠其持有的公司无限售流通股，总计价值1亿元人民币市值。本次捐赠不会导致公司控股股东、实际控制人发生变化。", "ctime": 1789553260, "time_str": "18:07:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260916/c679976207.shtml"}, {"id": "5185501", "title": "中国超额完成《基加利修正案》阶段履约目标", "content": "9月16日是国际保护臭氧层日。自加入《关于消耗臭氧层物质的蒙特利尔议定书》以来，中国累计淘汰约72万吨消耗臭氧层物质，占发展中国家淘汰量一半以上。16日，纪念《〈关于消耗臭氧层物质的蒙特利尔议定书〉基加利修正案》通过十周年暨2026年国际保护臭氧层日纪念大会在京召开，生态环境部副部长徐必久在会上介绍了上述情况。据介绍，十年前，国际社会在蒙特利尔议定书框架下通过《基加利修正案》，将非二氧化碳温室气体氢氟碳化物纳入议定书管控范围，开启了协同应对臭氧层损耗和气候变化的历史新篇章。全面实施议定书《基加利修正案》预计到本世纪末将避免0.5摄氏度的全球升温，与制冷设备能效提升协同后，这一贡献最高可翻倍至1摄氏度。中国一贯高度重视保护臭氧层和应对气候变化。徐必久介绍，自2021年接受议定书《基加利修正案》后，中国严控氢氟碳化物生产和使用总量规模，累计比国家履约目标分别减少11.85亿吨和7.59亿吨二氧化碳当量以上，超额完成阶段履约目标。(新华社)", "ctime": 1789553180, "time_str": "18:06:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260916/c679976158.shtml"}, {"id": "5185343", "title": "永臻股份：拟投资5.97亿元建6万吨电池铝箔项目", "content": "永臻股份公告，公司拟由全资子公司永臻科技（芜湖）有限公司投资建设年产6万吨成品电池铝箔项目，预计总投资5.97亿元。公司于2026年9月16日审议通过该事项，目前正在进行项目前期准备工作，并已与安徽省芜湖市繁昌经济开发区管理委员会签订《投资合同》；项目建设周期预计为2年。", "ctime": 1789552637, "time_str": "17:57:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260916/c679975886.shtml"}, {"id": "5185311", "title": "宁德时代将于近日回应相关车企选择其他供应商传闻", "content": "对于造成股价连续下跌的“相关车企选择其他动力电池供应商”的传闻，记者获悉，宁德时代将于近日进行回应。(中国证券报)", "ctime": 1789552251, "time_str": "17:50:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260916/c679975616.shtml"}];

    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
