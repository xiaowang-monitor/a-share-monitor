026年7月15日至2026年8月13日通过集中竞价减持60.15万股，持股比例由23.76%降至23.32%；陈松扬于2026年7月15日至2026年7月20日通过集中竞价及大宗交易减持69634股，持股比例由0.21%降至0.15%。一致行动组合计持股由3453.25万股（25.50%）减少至3386.14万股（25.00%），同时触及1%和5%整数倍。", "ctime": 1786606685, "time_str": "15:38:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260813/c678926961.shtml"}, {"id": "4952555", "title": "韩国股市重回技术性牛市", "content": "受全球人工智能（AI）交易回暖带动，韩股在上月历史性暴跌后，近期迎来强劲反弹。韩国KOSPI指数韩国股市周四（8月13日）大涨，自7月30日低点算起，累计反弹幅度接近23%，意味着该股指重新迈入技术性牛市。权重股、存储芯片巨头三星电子与SK海力士依旧领涨，分别上涨超过5%和7%。(第一财经)", "ctime": 1786606405, "time_str": "15:33:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260813/c678926835.shtml"}, {"id": "4952549", "title": "三峡枢纽2026年通过量已达1亿吨", "content": "记者13日从交通运输部长江三峡通航管理局获悉，截至8月13日0时40分，三峡枢纽2026年通过量达1亿吨。其中，三峡船闸运行5863闸次，通过船舶21562艘次，通过量9727.6万吨；三峡升船机运行2557厢次，通过船舶2590艘次、旅客44.6万人次。自2011年首次突破1亿吨大关以来，三峡枢纽年通过量已连续15年保持高位运行，持续为长江经济带产业链供应链稳定、沿江地区民生物资保供及长江流域经济社会高质量发展提供了坚实支撑。长江三峡通航管理局相关负责人表示，近期受台风影响，极端天气多发，管理局通过加强与气象、水文等单位协同联动，健全短临致灾天气预警“叫应”机制，对客渡船、港作船等重点船舶开展预警信息“点对点”精准推送，尽可能将灾害风险降到最低。（新华社）", "ctime": 1786606377, "time_str": "15:32:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260813/c678926820.shtml"}, {"id": "4952531", "title": "2026年上半年荣耀为全球增速最快的安卓中国厂商", "content": "荣耀最新分享阶段经营成果，据IDC数据，今年上半年，荣耀是全球唯一实现出货正增长的安卓中国厂商，并以9%的增速成为全球出货增速最快的安卓中国厂商。（人民财讯）", "ctime": 1786606066, "time_str": "15:27:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260813/c678926650.shtml"}, {"id": "4952501", "title": "极端高温或令欧盟国家损失约1800亿欧元", "content": "特里奥多斯银行评估，今夏欧洲遭遇的极端高温将让欧盟国家承受约1800亿欧元经济损失，大致相当于2025年欧盟国内生产总值（GDP）的1%。不过，数据没有涵盖人员伤亡的关联损失。据欧洲新闻电视台12日报道，特里奥多斯银行从农作物和乳制品产量下降及其导致的食品价格上涨、发电量、货运量以及劳动生产率等方面追踪经济损失情况，得出上述数字。其中前三项以欧盟平均水平为基准量化。影响最大且最难准确估算的是劳动生产率，特里奥多斯银行参照德国安联集团的跨国研究数据进行评估。依照特里奥多斯银行说法，鉴于欧盟经济今年预计增长约1.1%，1800亿欧元的损失将令欧盟经济几乎陷入停滞。（新华社）", "ctime": 1786605635, "time_str": "15:20:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260813/c678926514.shtml"}, {"id": "4952489", "title": "伊朗民兵武装：霍尔木兹海峡在伊朗控制下", "content": "伊朗法尔斯通讯社13日报道，伊朗民兵武装组织负责人侯赛因·塔伊布称，霍尔木兹海峡“在伊朗的控制和管理之下”。（新华社）", "ctime": 1786605518, "time_str": "15:18:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260813/c678926469.shtml"}, {"id": "4952487", "title": "《安全应急装备产业发展“十五五”规划》：加快发展集研发制造、集成创新、工程实施和运营服务为一体的综合型企业集团", "content": "工业和信息化部、应急管理部印发《安全应急装备产业发展“十五五”规划》，规划提出，梯度培育优质企业。强化企业创新主体地位，引导企业面向国家重大安全应急需求，扩大安全应急技术和装备供给。推动龙头企业整合产业链资源，加快发展集研发制造、集成创新、工程实施和运营服务为一体的综合型企业集团。构建梯度培育体系，培育一批安全应急特色明显、创新能力强的专精特新“小巨人”企业和制造业单项冠军企业。打造安全应急装备领域的专精特新企业赋能中心，加速市场主体提质扩量。推进产业链上下游协同、大中小企业融通发展。（人民财讯）", "ctime": 1786605408, "time_str": "15:16:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260813/c678926417.shtml"}, {"id": "4952465", "title": "现货白银跌超1%", "content": "现货白银跌超1%，现报64.63美元/盎司。", "ctime": 1786605301, "time_str": "15:15:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260813/c678926384.shtml"}, {"id": "4952405", "title": "商务部：对原产于印度的进口单模光纤继续征收反倾销税", "content": "商务部公告，自2026年8月14日起，对原产于印度的进口单模光纤继续征收反倾销税，实施期限为5年。此举是基于对原产于印度的进口单模光纤倾销可能性及对中国产业损害可能性的调查结果。（商务部）", "ctime": 1786604855, "time_str": "15:07:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260813/c678926231.shtml"}, {"id": "4952359", "title": "ETF两市成交额报4551.53亿元，较昨日此时放量554.68亿元", "content": "截至目前，ETF两市成交额报4551.53亿元，较昨日此时放量554.68亿元，分类型来看，股票型ETF成交额1645.12亿元，债券型ETF成交额1905.15亿元，货币型ETF成交额201.11亿元，商品型ETF成交额103.62亿元，Q source": "", "url": "https://news.10jqka.com.cn/20260813/c678926080.shtml"}, {"id": "4952225", "title": "农业农村部组派专业力量指导台风灾后恢复生产", "content": "近日，为深入贯彻落实党中央、国务院决策部署，农业农村部组织专业力量，派出6个工作组和11个科技小分队赴浙江等受台风影响较重地区，指导灾后恢复生产工作。种植业方面，调配排涝救灾机具，指导相关省份疏浚560万亩农田沟渠，及时抢排田间积水，修复受损设施，减轻渍涝影响；推动落实秋粮抗逆防灾喷施作业，促进作物恢复生长。畜牧业方面，印发洪涝灾区动物防疫技术指南，指导地方开展死亡畜禽无害化处理和消毒灭源，防范次生疫情。渔业方面，统筹协调东海区上海、江苏、浙江、福建4省（市）调整捕捞渔船出海时间，避开风雨影响；组织近4万名船东船长在线接受渔船安全课程培训，提升安全生产技能、压实安全生产责任。(农业农村部)", "ctime": 1786604339, "time_str": "14:58:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260813/c678926057.shtml"}, {"id": "4952185", "title": "驻日美军一架F-22战机因发生故障紧急降落", "content": "11日10时20分左右，驻日美军一架F-22战斗机紧急降落在位于冲绳的嘉手纳基地。消防和维修人员进行了约20分钟的检查，随后将飞机牵引至停机坪。据称，该机发生了故障。（央视新闻）", "ctime": 1786604027, "time_str": "14:53:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260813/c678925990.shtml"}, {"id": "4952183", "title": "科创50指数跌幅扩大至1%", "content": "科创50指数跌幅扩大至1%，现报1719.3点。", "ctime": 1786604013, "time_str": "14:53:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260813/c678925984.shtml"}, {"id": "4952167", "title": "海锅股份在张家港成立储能新公司", "content": "企查查APP显示，近日，张家港海锅储能有限公司成立，经营范围包含储能技术服务；光伏设备及元器件销售；太阳能发电技术服务等。企查查股权穿透显示，该公司由海锅股份全资持股。（人民财讯）", "ctime": 1786603824, "time_str": "14:50:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260813/c678925935.shtml"}, {"id": "4952159", "title": "吉林两大科研所联手研制可编程光伏窗", "content": "近日，中国科学院长春光学精密机械与物理研究所郭晓阳、刘星元研究团队与中国科学院长春应用化学研究所合作，研制出色彩可调的高效隔热可编程光伏窗，实现可见光颜色、透射光谱与红外反射的协同调控。该成果集广色域显色、高色彩还原度与卓越热管理能力于一体，为低碳建筑外立面提供兼具审美价值与节能效益的多功能光伏方案。（吉林发布）", "ctime": 1786603771, "time_str": "14:49:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260813/c678925926.shtml"}, {"id": "4952087", "title": "因多瑙河水位持续下降 罗马尼亚唯一核电站停运", "content": "当地时间8月13日，罗马尼亚核电公司发布公告称，鉴于多瑙河水位持续显著下降，该国已正式启动切尔纳沃德核电站2号机组的受控停机程序。当地核电站专家将根据未来多瑙河水位的预测走势，择机决定重新并网的时间。受罕见低水位影响，该核电站1号机组已于7月下旬实施受控停机。切尔纳沃德核电站位于罗马尼亚东南部康斯坦察县的多瑙河畔，是该国目前唯一运行的核电站。该电站始建于20世纪80年代，现运行的1号和2号机组分别于1996年和2007年投入商业运营，正常情况下两台机组可提供罗马尼亚全国约20%的总发电量。（央视新闻）", "ctime": 1786603141, "time_str": "14:39:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260813/c678925746.shtml"}, {"id": "4952075", "title": "日本企业物价指数连续两个月维持7%以上高位", "content": "日本央行13日公布的初步统计结果显示，7月日本企业物价指数同比上涨7.2%至135.8，涨幅时隔5个月出现轻微回落，但连续两个月维持7%以上的高位。 数据显示，在纳入统计范围的23类商品中，价格全部同比上涨。其中，受中东局势推高能源成本影响，石油和煤炭制品价格同比上涨17.5%，有色金属、信息通信设备价格分别同比上涨40.6%和17.3%。 日元贬值进一步推高进口成本。7月以日元计价的进口物价指数同比上涨29.1%，出口物价指数同比上涨18.9%。 6月国内企业物价指数由速报的7.1%上调修正至7.3%，创下2023年3月以来最高值。 企业物价指数反映的是企业间交易的商品价格水平，是日本衡量本国通货膨胀水平的重要指标。(新华社)", "ctime": 1786603069, "time_str": "14:37:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260813/c678925674.shtml"}, {"id": "4952073", "title": "湖北宜化楚星生态科技有限公司增资至17亿，增幅约120%", "content": "天眼查App显示，8月11日，湖北宜化楚星生态科技有限公司发生工商变更，注册资本由7.73亿人民币增至17亿人民币，增幅约120%。该公司成立于2023年11月，法定代表人为林剑，经营范围包括化工产品生产、化肥销售、新材料技术研发等，由湖北宜化化工股份有限公司全资持股。（界面新闻）", "ctime": 1786602974, "time_str": "14:36:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260813/c678925662.shtml"}, {"id": "4952071", "title": "航新科技等成立新公司 含民用航空材料业务", "content": "企查查APP显示，近日，衢州航川电子科技有限公司成立，经营范围包含集成电路设计；电子专用材料研发；电子元器件零售；民用航空材料销售；航空运输设备销售等。企查查股权穿透显示，该公司由航新科技等共同持股。（人民财讯）", "ctime": 1786602963, "time_str": "14:36:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260813/c678925650.shtml"}, {"id": "4952065", "title": "张雪机车获红杉中国投资，投后估值60亿元", "content": "8月13日，证券时报记者从红杉中国方面获悉，张雪机车近日获得了红杉中国的投资。此外，记者从张雪机车的早期投资人高信资本方面获悉，其也参与了张雪机车的本轮融资，但具体交易条款未予披露。不过，高信资本创始合伙人兼董事长曹斌近日在接受访谈时透露，红杉中国这笔投资金额规模为1.5亿元，张雪机车投后估值达到60亿元。据介绍，此次张雪机车与红杉中国的合作将围绕企业治理、人才建设、产业资源和全球化发展等方面。张雪机车将继续聚焦发动机、整车、产品研发和赛事验证，而红杉将结合自身在企业治理、人才网络、产业生态和全球资源方面的经验，为公司的长期发展提供支持。（人民财讯）", "ctime": 1786602939, "time_str": "14:35:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260813/c678925618.shtml"}, {"id": "4952039", "title": "教育板块持续走低，传智教育触及跌停", "content": "教育板块持续走低，传智教育触及跌停，学大教育、昂立教育、华图山鼎、凯文教育、中公教育跟跌。", "ctime": 1786602772, "time_str": "14:32:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260813/c678925578.shtml"}, {"id": "4952025", "title": "日韩股市集体收涨", "content": "日经225指数收涨1.16%，报68308.59点。韩国综指收涨3.21%，报6790.01点。", "ctime": 1786602701, "time_str": "14:31:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260813/c678925563.shtml"}, {"id": "4952001", "title": "英特尔CEO陈立武自掏1200万美元购买公司股票", "content": "英特尔CEO陈立武将自掏1200万美元，参与该公司扩大后规模达200亿美元的股票增发。根据英特尔周三向美国证券交易委员会（SEC）提交的补充文件，陈立武及其一名家庭成员同意购买总计1200万美元的英特尔股票，作为此次发行的一部分。英特尔周二宣布将以每股95美元的价格发行2.11亿股股票，使本次发行总额从前一天宣布的150亿美元增至200亿美元，并授予承销商一项30天超额配售权，可额外认购3157.89万股股票。（新浪财经）", "ctime": 1786602676, "time_str": "14:31:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260813/c678925556.shtml"}, {"id": "4951947", "title": "5年期存款利率逆势上升", "content": "2026年7月银行存款利率报告显示：2026年7月，银行整存整取存款3个月期平均利率为0.949%，6个月期平均利率为1.152%，1年期平均利率为1.263%，2年期平均利率为1.358%，3年期平均利率为1.683%，5年期平均利率为1.560%。和上个月相比，3个月期下降0.2BP，6个月期下降0.1BP，1年期下降0.2BP，2年期下降0.4BP，3年期下降0.1BP，而5年期则上涨了0.7BP。大额存单利率显示了同样的趋势。根据监测的数据，2026年7月，发行的大额存单3个月期平均利率为0.977%，6个月期平均利率为1.161%，1年期平均利率为1.357%，2年期平均利率为1.371%，3年期平均利率为1.716%，5年期平均利率为1.620%。和上个月相比，大额存单各期限平均利率除5年期外均下降，3个月 const META     = {"update_time": "2026-08-13 16:01:02", "sentiment_score": 62.39316239316239, "agents": []};

// 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
