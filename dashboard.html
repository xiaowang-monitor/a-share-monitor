const NEWS     = [{"id": "4179333", "title": "大疆回应新品盲订", "content": "4月2日，多位大疆授权体验店的销售人员在社交媒体发布消息，称即将推出重磅新品，目前已开启“盲订”。相关销售人员表示，目前具体产品信息还不清楚，若消费者感兴趣可以留下个人信息，并支付99元的定金登记预约，若发布后不是预期的产品，定金可以原路返回。 外界传言称，大疆或将于4月推出新一代人气产品口袋云台相机Osmo Pocket 4。就这一消息咨询大疆商城客服，对方表示线上与线下是不同渠道，相关活动可能是具体门店提供的，建议咨询相关门店。有大疆门店的工作人员证实了相关活动，但表示新品目前没有具体的相关信息，“是按顺序预定的，从今天（4月2日）早上开始，订单数量非常吓人，不能保证拿到第一批货。”（新浪财经）", "ctime": 1775116090, "time_str": "15:48:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260402/c675722156.shtml"}, {"id": "4179327", "title": "骑手举报 行业自查 北京市场监管首次全链路共治餐饮违规", "content": "今天（2日），北京市市场监管局牵头多家网络食品交易第三方平台、餐饮相关行业协会，正式签订餐饮服务食品安全外卖骑手“随手拍”共治备忘录，首次构建“监管引导、平台支撑、协会联动、骑手参与”的全链路餐饮共治机制，进一步筑牢“舌尖上的安全”。此次签署的共治备忘录，以“共建、共治、共享”为核心，市场监管部门发挥引导统筹作用，平台提供技术支撑，行业协会做好自律联动，外卖骑手则以“移动监督员”身份参与一线监督，搭建从线索发现到核查处置的标准化、闭环式食品安全监督体系。（央视新闻）", "ctime": 1775116038, "time_str": "15:47:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260402/c675722120.shtml"}, {"id": "4179325", "title": "莎普爱思：与温州医科大学附属眼视光医院等签署技术转让合同", "content": "莎普爱思公告，公司与温州医科大学附属眼视光医院、周翔天教授签署了《技术转让（专利权）合同》，温医大眼视光医院将其名（包括海外申请对应的中译名）为“一种采用SPAS-26021治疗近视的方法”的10项合作产品核心专利、合作产品专有技术及相关权益全部转让给公司，转让价格为7100万元以及合作产品上市后的销售提成。", "ctime": 1775116010, "time_str": "15:46:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260402/c675722108.shtml"}, {"id": "4179321", "title": "外交部：中国将坚定不移推进高水平科技自立自强 以技术普惠推动全球共同发展", "content": "4月2日，外交部发言人毛宁主持例行记者会。有记者问：近日，2026中关村论坛年会发布《国家创新指数报告2025》，显示中国国家创新指数综合排名上升至世界第9位，是近十余年来进步最快的国家。发言人对此有何评论？毛宁表示，中国政府始终将科技创新置于国家发展全局的核心位置。“十四五”期间，中国在新能源汽车、人工智能大模型、量子、生物学等领域取得一系列标志性原创成果，有力推动高质量发展，成为世界创新重要一极。中国的科技创新坚持开放合作。上周中国宣布向各国开放天眼、“奋斗者”号载人潜水器等十大重大科研基础设施，将自主研发的国之重器转化为普惠全球的公共产品，以实际行动证明，科技创新的真正价值不在于垄断优势，而在于让更多人享受到技术进步带来的便利。展望“十五五”，中国将坚定不移推进高水平科技自立自强，以科技创新引领新质生产力发展，加强原始创新，加速产业转化，积极开放合作，以技术普惠推动全球共同发展。（央视新闻）", "ctime": 1775115959, "time_str": "15:45:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260402/c675722077.shtml"}, {"id": "4179319", "title": "460家沪市公司已披露年报分红方案 总额超8000亿元", "content": "记者从上海证券交易所获悉，截至2026年4月1日，沪市共有577家公司披露年报，其中460家披露了年报分红方案，占比近八成。上述公司期末分红预案对应的分红总额超过8000亿元。(新华社)", "ctime": 1775115941, "time_str": "15:45:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260402/c675722074.shtml"}, {"id": "4179315", "title": "伊朗外长与越南外长通电话 就地区局势及双边关系交换意见", "content": "伊朗外交部长阿拉格齐2日同越南外交部长黎怀忠通电话，就地区局势及双边关系交换意见。阿拉格齐表示，美国和以色列对伊朗发动军事袭击并造成严重人员伤亡，相关行为违反国际人道主义法。伊方强调其采取的军事行动属于正当防卫。他指出，波斯湾及霍尔木兹海峡面临的主要不安全因素是美国和以色列对伊朗的军事侵略，并称依据国际法原则，该航道已对参与对伊军事行动的国家船只关闭，但其他国家船只在与伊朗相关机构协调下仍可通行。越方表示，应尊重各国主权和领土完整，遵守国际法，反对使用武力，并呼吁尽快恢复地区和平与稳定。此外，越方对伊朗时任最高领袖哈梅内伊及有关人员遇难表示哀悼。（央视新闻）", "ctime": 1775115898, "time_str": "15:44:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260402/c675721852.shtml"}, {"id": "4179309", "title": "中方是否正与相关国家讨论燃油援助？外交部回应", "content": "4月2日，外交部发言人毛宁主持例行记者会。有记者提问，据报道，中国已将燃油出口禁令延长至4月，但正在考虑为提出援助请求的少数国家提供豁免，包括斯里兰卡、孟加拉国和越南等。请问外交部，中国是否正在与这些国家就燃油援助进行讨论？毛宁表示，具体问题建议你向主管部门了解。当前全球能源市场面临短缺的根源在于中东局势紧张，当务之急是立即停止军事行动，防止对全球经济造成更大的影响。（北京日报）", "ctime": 1775115867, "time_str": "15:44:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260402/c675721839.shtml"}, {"id": "4179307", "title": "南向资金净买入超150亿港元", "content": "据同花顺iFinD数据，截至目前，南向资金净买入超150亿港元，其中港股通（沪）买入超88.36亿港元，港股通（深）买入超63.61亿港元。", "ctime": 1775115838, "time_str": "15:43:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260402/c675721813.shtml"}, {"id": "4179299", "title": "华恒生物：拟发行不超过3195.93万股境外上市普通股", "content": "华恒生物公告，公司于近日收到中国证监会出具的《关于安徽华恒生物科技股份有限公司境外发行上市备案通知书》。公司拟发行不超过3195.93万股境外上市普通股并在香港联合交易所主板上市。", "ctime": 1775115568, "time_str": "15:39:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260402/c675721669.shtml"}, {"id": "4179289", "title": "常军红任财政部部长助理，雷小武任国家统计局副局长", "content": "国务院任免国家工作人员。任命常军红（女）为财政部部长助理；任命雷小武为国家统计局副局长；任命汪剑波为国家能源局副局长；任命姚来英为国家烟草专卖局局长。免去赵增连的海关总署副署长职务；免去姚来英的国家税务总局副局长职务；免去盛来运的国家统计局副局长职务；免去张建民的国家烟草专卖局局长职务。（人社部）", "ctime": 1775115514, "time_str": "15:38:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260402/c675721634.shtml"}, {"id": "4179285", "title": "外媒称伊朗已向中国寻求安全保障，外交部回应", "content": "4月2日，外交部发言人毛宁主持例行记者会。有外媒记者提问，有报道称，伊朗已向中国寻求安全保障，如果这些保障能够提供，美以伊或能达成停火协议。请问伊朗是否已向中国提出过此类请求？中国是否已作出回应？“伊朗战事爆发以来，中方一直积极致力于促和止战，中巴两国外长会见的情况，我们已经发布了消息，你可以查阅。”毛宁说，我可以告诉你的是，中方支持一切有利于和平的努力，我们也愿意同各方加强沟通和协调，为恢复中东地区的和平继续发挥作用。（北京日报）", "ctime": 1775115441, "time_str": "15:37:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260402/c675721612.shtml"}, {"id": "4179275", "title": "零克云正上线“云端龙虾”OpenClaw服务", "content": "零克云正式上线“云端龙虾”OpenClaw服务，云端一键部署，内置多模型组合，用户无需配置任何API Key或环境参数。针对AI模型调用，零克云基于智能调度与多模型路由技术，可根据任务复杂度自动匹配最优模型。“云端龙虾”无需复杂配置，可快速无障碍接入海外Codex、Claude等模型。同时，支持一键接入飞书、钉钉、企业微信等。(36氪)", "ctime": 1775115284, "time_str": "15:34:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260402/c675721459.shtml"}, {"id": "4179271", "title": "上汽集团：3月整车产量同比降9.06%，销量降2.56%", "content": "上汽集团公告，3月整车产量35.53万辆，同比下降9.06%，销量37.59万辆，同比下降2.56%；本年累计产量94.19万辆，同比下降3.83%，累计销量97.27万辆，同比增长2.95%。其中3月新能源汽车产量10.43万辆，同比下降16.18%，销量11.31万辆，同比下降10.03%；出口及海外基地本月销量12.13万辆，月度同比增长47.37%。", "ctime": 1775115252, "time_str": "15:34:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260402/c675721438.shtml"}, {"id": "4179253", "title": "“十四五”期间，我国发布物流领域国家标准210项", "content": "记者今天（2日）从市场监管总局物流标准化专题新闻发布会获悉，物流联接生产和消费、内贸和外贸，是支撑国民经济发展的基础性、战略性、先导性产业。“十四五”期间，我国累计发布物流领域国家标准210项，并在多个方面实现突破。首先，物流托盘、周转箱标准集中更新升级。发布平托盘、滑板托盘、果蔬周转箱等13项标准，确保国家标准与国际标准一致、细分产品标准与通用方法标准协同。其次，多式联运国家标准加快补齐。先后研制和发布多式联运货物分类代码、运量计算、联运车辆与运单等16项国家标准，提升多式联运一体化衔接水平。此外，物流强制性标准研制力度不断加大。推动制定快递绿色包装、商用车辆燃料消耗量限值、危险货物运输等20项强制性国家标准，有力促进技术创新，增强物流安全应急水平。（央视新闻）", "ctime": 1775115032, "time_str": "15:30:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260402/c675721357.shtml"}, {"id": "4179245", "title": "外交部再回应霍尔木兹海峡通航问题，当前的关键是尽快停止军事行动", "content": "4月2日，外交部发言人毛宁主持例行记者会。有记者问：中国是否正在考虑或者是否会考虑开展任何国际合作，以保障石油安全通过霍尔木兹海峡？毛宁表示，确实各方都很关注霍尔木兹海峡能否尽快恢复和平稳定，实现通航。因为海峡及其附近水域是一个非常重要的国际货物和能源贸易通道。当前的关键是能够尽快停止军事行动，只有这样才能够恢复中东地区、海湾地区的和平稳定，这是国际社会都希望出现的局面，各方都应该为此作出努力，中方也愿意继续为此发挥作用。（央视新闻）", "ctime": 1775114929, "time_str": "15:28:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260402/c675721284.shtml"}, {"id": "4179243", "title": "外交部：中方反对袭击平民和民用设施", "content": "4月2日，外交部发言人毛宁主持例行记者会。在回答有关伊朗多所大学成为袭击目标的问题时，毛宁表示，中方反对袭击平民和民用设施，袭击学校更是严重违反国际人道法。我们再次呼吁立即停止军事行动，尽快重启对话谈判，避免出现更大的人道灾难。（央视新闻）", "ctime": 1775114909, "time_str": "15:28:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260402/c675721282.shtml"}, {"id": "4179239", "title": "外交部：中方始终支持阿巴双方通过对话谈判妥善解决矛盾分歧", "content": "4月2日，外交部发言人毛宁主持例行记者会。在回答有关阿巴关系的问题时，毛宁表示，阿富汗和巴基斯坦都是中国的邻居，中方始终支持阿巴双方通过对话谈判妥善解决矛盾分歧。中方将继续为缓和局势、为两国改善关系发挥建设性的作用。（央视新闻）", "ctime": 1775114891, "time_str": "15:28:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260402/c675721278.shtml"}, {"id": "4179237", "title": "外交部：中国和库克群岛的关系不针对第三方，也不应当受到第三方的干扰和制约", "content": "据路透社报道，新西兰和库克群岛周四（4月2日）签署了一项新的防务和安全协议，旨在重启两国关系。此前，由于库克群岛与中国签署的协议，新西兰和库克群岛的关系持续数月紧张。对于上述消息，在4月2日举行的中国外交部例行记者会上，外交部发言人毛宁在回应外媒记者“中方对此有何评论”的提问时表示，库克群岛是中国在南太平洋地区的重要合作伙伴，两国建交以来始终相互尊重、平等相待、共同发展，我们愿意同库克群岛深化务实合作，不断增进两国人民的福祉。毛宁表示，中国和库克群岛的关系不针对第三方，也不应当受到第三方的干扰和制约。各国发展同太平洋岛国的关系，都应当切实尊重岛国的独立自主，坚持发展优先、开放包容。(环球网)", "ctime": 1775114878, "time_str": "15:27:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260402/c675721269.shtml"}, {"id": "4179229", "title": "商务部介绍中国-东盟自贸区3.0版最新进展", "content": "4月2日下午，商务部举行例行新闻发布会。有媒体提问称，在当前背景下，商务部在推动中国-东盟自贸区3.0版谈判方面有哪些新的进展，以及在数字经济和绿色经济领域，中国如何与东盟国家进一步深化产业链方面的合作？对此，商务部新闻发言人何亚东表示，中国-东盟自贸区3.0版升级议定书，已经于去年的10月28号正式签署。升级的3.0版顺应了国际经贸发展的新趋势，首次将数字经济、绿色经济、产供链、互联互通等新兴领域纳入框架。根据议定书的规定，协定生效需要中国和至少5个东盟成员国批准。目前我们正在与东盟各成员国同步加快推进议定书国内核准的程序，争取议定书尽早的生效实施。何亚东进一步介绍说，“关于你提到的中国与东盟国家深化产业链合作，我们将充分的释放运输效能，支持中国数字和新能源企业深耕东盟市场，持续的深化双方在云基础设施、人工智能、金融科技、绿色设备、绿色电源等前沿领域的合作，推动产供链的深度融合。”(环球网)", "ctime": 1775114778, "time_str": "15:26:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260402/c675721223.shtml"}, {"id": "4179227", "title": "外交部谈特朗普涉伊朗言论：再次敦促当事方立即停止军事行动", "content": "4月2日，外交部发言人毛宁主持例行记者会。有记者问：特朗普表示，美国将对伊朗持续发动猛烈的打击，为期2至3周，并再次威胁称，如果伊朗不与他达成谈判解决方案，将打击伊朗的能源基础设施。中方对此有何评论？毛宁表示，军事手段无法从根本上解决问题，冲突升级也不符合任何一方的利益。我们再次敦促当事方立即停止军事行动，尽快启动和谈进程，通过对话谈判解决问题，避免对世界经济和全球能源安全造成更严重的冲击。（央视新闻）", "ctime": 1775114751, "time_str": "15:25:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260402/c675721215.shtml"}, {"id": "4179217", "title": "中信证券接手蔚能旗下武汉电池科技公司", "content": "天眼查App显示，近日，蔚能（武汉）电池科技有限公司发生工商变更，原股东武汉蔚能电池资产有限公司退出，新增中信证券为全资股东，同时，赖晓明卸任法定代表人、董事、经理，刘勇接任法定代表人、董事，王洲接任经理。该公司成立于2025年10月，经营范围包括蓄电池租赁、新能源汽车废旧动力蓄电池回收及梯次利用、电动汽车充电基础设施运营等。（南方财经）", "ctime": 1775114642, "time_str": "15:24:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260402/c675721130.shtml"}, {"id": "4179169", "title": "万马股份：目前不涉及光纤、光纤预制棒业务", "content": "万马股份4月2日在互动平台回复投资者称，公司生产的光缆、数据通信电缆等产品可应用于数据中心基础设施建设领域，公司目前不涉及光纤、光纤预制棒业务。（人民财讯）", "ctime": 1775114270, "time_str": "15:17:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260402/c675720961.shtml"}, {"id": "4179155", "title": "商务部：进一步发挥中美经贸磋商机制作用加强对话沟通", "content": "在2日举行的例行新闻发布会上，商务部新闻发言人何亚东在回答关于中美经贸关系的提问时表示，去年以来，在两国元首重要共识战略引领下，中美经过六轮经贸磋商，在经贸领域达成一系列磋商成果，为双边经贸关系和世界经济注入了更多稳定性和确定性。事实充分证明，坚持相互尊重、平等对话协商，是弥合分歧、解决问题的最好方式。中美双方应落实好两国元首重要共识以及前期经贸磋商成果，进一步发挥中美经贸磋商机制作用，加强对话沟通，妥善管控分歧，拓展务实合作，促进中美经贸关系健康、稳定、可持续发展。(新华社)", "ctime": 1775114137, "time_str": "15:15:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260402/c675720893.shtml"}, {"id": "4179143", "title": "商务部回应Meta收购Manus及企业跨国经营问题", "content": "商务部2日举行例行新闻发布会，有记者提出中方对Meta收购Manus会采取哪些措施以及企业跨国经营的相关问题，商务部新闻发言人何亚东对此回应说，中国政府支持企业根据需要开展跨国经营与技术合作，相关行为需遵守中国法律法规，履行法定程序。(新华社)", "ctime": 1775113987, "time_str": "15:13:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260402/c675720502.shtml"}, {"id": "4179123", "title": "伊朗最高领袖顾问：霍尔木兹海峡对伊朗人民的敌人将永远关闭", "content": "当地时间4月2日，伊朗最高领袖外事顾问、前外长韦拉亚提在其个人社交媒体平台账号上表示，霍尔木兹海峡对世界开放，但对伊朗人民的敌人及其在该地区的据点将永远关闭。韦拉亚提表示，冲突的结束取决于伊朗的决策和力量，而不是侵略者的妄想和傲慢。（央视新闻）", "ctime": 1775113703, "time_str": "15:08:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260402/c675720372.shtml"}, {"id": "4179111", "title": "中兴通讯、摩尔线程等成立产业创新中心公司", "content": "企查查APP显示，近日，北京量电融合产业创新中心有限公司成立，注册资本5500万元，经营范围包含：量子计算技术服务；人工智能应用软件开发；网络与信息安全软件开发等。企查查股权穿透显示，该公司由中国电信全资子公司中电信量子信息科技集团有限公司、中兴通讯、摩尔线程全资子公司北京摩笔生成科技有限公司等共同持股。（人民财讯）", "ctime": 1775113632, "time_str": "15:07:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260402/c675720329.shtml"}, {"id": "4179105", "title": "“832平台乡村振兴公益行”2026年首发活动在广西启动", "content": "近日，由中国供销电子商务有限公司（“832平台”）主办的“832平台乡村振兴公益行”2026年首发活动在广西壮族自治区成功举行。本次活动以“培训提能+资源对接+标杆引领+精准帮扶”为核心模式，通过分层分类的精准赋能，全面助力广西脱贫地区农副产品提档升级、拓宽销路，为2026年度全国乡村振兴公益行系列活动树立了标杆示范，来自线上线下近200家供应商参加了此次活动。(新华社)", "ctime": 1775113615, "time_str": "15:06:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260402/c675720319.shtml"}, {"id": "4179077", "title": "欧洲主要股指集体低开", "content": "欧洲主要股指集体低开。欧洲斯托克50指数跌1.93%，英国富时100指数跌0.82%，法国CAC40指数跌1.32%，德国DAX30指数跌1.51%。", "ctime": 1775113399, "time_str": "15:03:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260402/c675720200.shtml"}, {"id": "4179075", "title": "南向资金净买入超100亿港元", "content": "据同花顺iFinD数据，截至目前，南向资金净买入超100亿港元，其中港股通（沪）买入超66.52亿港元，港股通（深）买入超34.25亿港元。", "ctime": 1775113391, "time_str": "15:03:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260402/c675720187.shtml"}, {"id": "4179073", "title": "A股收评：沪指跌0.74%险守3900点 全市场超4300家个股下跌", "content": "截至收盘，上证指数跌0.74%报3919.29点，深证成指跌1.6%报13486.94点，创业板指跌2.31%报3172.65点，北证50涨0.3%报1281.91点。全市场成交额18577亿元，较上日成交额缩量1670亿元。\n板块题材上，油气、猪肉板块涨幅居前；算力、影视院线板块跌幅居前。\n盘面上，油气板块高开高走，中油工程、蓝焰控股、贝肯能源涨停封板。消息面上，特朗普发表伊朗战争讲话后，WTI原油突破103美元/桶，日内涨4.07%。布伦特原油日内大涨4美元，现报102.86美元/桶，涨幅4.06%。猪肉板块走强，巨星农牧涨停，大禹生物涨超7%。消息面上，商务部等部门开展中央储备冻猪肉收储。算力板块走弱，金开新能、群兴玩具、优刻得跌超8%，影视院线板块持续下挫，金逸影视跌停封板，华谊兄弟、百纳千成跌超4%。", "ctime": 1775113373, "time_str": "15:02:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260402/c675720175.shtml"}, {"id": "4179045", "title": "ETF收评：标普油气ETF领涨6.51%，中韩半导体ETF领跌4.86%", // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
