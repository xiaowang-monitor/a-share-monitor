 "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260528/c677040255.shtml"}, {"id": "4418435", "title": "晋拓股份等成立航空科技公司", "content": "企查查APP显示，近日，上海泰维航航空科技有限公司成立，经营范围包含：通用零部件制造；机械零件、零部件加工；机械零件、零部件销售；民用航空材料销售等。企查查股权穿透显示，该公司由晋拓股份等共同持股。（人民财讯）", "ctime": 1779950973, "time_str": "14:49:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260528/c677040250.shtml"}, {"id": "4418431", "title": "长江证券刘元瑞：金融业的本质是长期主义 “没有哪家伟大机构靠追逐热点成就”", "content": "5月28日，在长江证券2026年中期策略会上，长江证券党委副书记、总裁刘元瑞分享了他对金融行业本质的深度思考：“金融和所有行业一样，本质上都是长期主义。”刘元瑞从三个维度阐释了这一判断：银行经营的是信用，信用的建立需要十年如一日的稳健；资管经营的是信任，信任的积累来自长期穿越周期的表现；投研经营的是判断，声誉的铸就来自一个又一个扎实研究的沉淀。他直言，“没有哪家伟大的金融机构，是靠追逐热点成就的。”“真正有价值的东西，值得用时间去浇灌。”刘元瑞引用巴菲特的话“想想你希望自己的讣告写什么，然后去过配得上它的生活”，指出长期主义不只是投资方法，更是一种人生选择。（人民财讯）", "ctime": 1779950926, "time_str": "14:48:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260528/c677040239.shtml"}, {"id": "4418423", "title": "至少202名外国移民在希腊南部海域获救", "content": "据希腊方面消息，当地时间5月28日，希腊海岸警卫队、欧洲边境及海岸警卫队在希腊南部克里特岛周边海域开展了4次搜救行动，共救出至少202名外国移民。希腊海岸警卫队称，所有救援行动均已安全完成，相关部门正在对获救人员进行必要的登记和身份识别程序。（央视新闻）", "ctime": 1779950867, "time_str": "14:47:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260528/c677040207.shtml"}, {"id": "4418419", "title": "佳云科技成立灵犀文化科技公司，含多项AI业务", "content": "企查查APP显示，近日，深圳市佳云灵犀文化科技有限公司成立，经营范围包含：人工智能应用软件开发；人工智能理论与算法软件开发；软件开发；人工智能通用应用系统；人工智能行业应用系统集成服务等。企查查股权穿透显示，该公司由佳云科技间接全资持股。（人民财讯）", "ctime": 1779950845, "time_str": "14:47:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260528/c677040195.shtml"}, {"id": "4418415", "title": "阿里达摩院首次发布GPU版本求解器 突破亿级变量“不可解”难题", "content": "达摩院今日官微消息，阿里巴巴达摩院“敏迭”求解器（MindOpt）正式发布GPU版本，充分利用GPU并行加速特性，引入新算法突破“长尾效应”难题。针对约2000个通用算例的测试显示，敏迭可将99%以上的问题类型稳定求解至高精度，更能支持传统上“不可解”的亿级变量线性规划问题。据悉，求解器被誉为“工业软件之芯”，负责电力调度、航班编排、高端制造、金融管理等关键领域的复杂计算。传统线性规划求解器基于CPU设计，依赖复杂的矩阵分解计算，随着问题规模膨胀，内存需求会爆炸式增长，加上传统求解算法的并行度有限，导致数小时都无法收敛问题，甚至直接崩溃。", "ctime": 1779950750, "time_str": "14:45:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260528/c677040158.shtml"}, {"id": "4418403", "title": "深港金融合作委员会第四次会议成功召开", "content": "5月27日，深圳市人民政府副市长罗晃浩和香港特别行政区政府财经事务及库务局局长许正宇在深圳共同主持召开深港金融合作委员会第四次会议。委员会讨论了深港两地金融市场发展和金融合作措施的最新情况，并探讨进一步加强两地金融联动的建议。(人民财讯)", "ctime": 1779950643, "time_str": "14:44:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260528/c677040100.shtml"}, {"id": "4418401", "title": "欧洲六国联合发声 反对欧盟碳排放标准", "content": "保加利亚、捷克、希腊、波兰、罗马尼亚和斯洛伐克六国联合发出警告，称欧盟委员会计划大幅削减免费二氧化碳排放配额，这可能导致水泥厂、钢铁厂和化工厂破产。六国提议：立即冻结免费排放配额削减措施，维持在2021年至2025年的水平；修改欧盟计算方法，使其更符合现实生产能力以及各国实际能源结构。（央视新闻）", "ctime": 1779950622, "time_str": "14:43:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260528/c677040093.shtml"}, {"id": "4418395", "title": "中国机械联与中信装备制造集团座谈交流", "content": "5月20日，中国机械工业联合会（简称“中国机械联”）党委书记、会长徐念沙在京会见了中信装备制造集团有限公司（简称“中信装备”）董事长、中信重工党委书记、董事长武汉琦一行。双方围绕工业实时操作系统国产化推进、生态体系建设及行业协同创新等议题举行专题座谈。双方表示，将以此次座谈为契机，深化在智能制造、机器人、新能源装备等领域的协同创新，共同筑牢制造强国“数字底座”。（人民财讯）", "ctime": 1779950336, "time_str": "14:38:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260528/c677039983.shtml"}, {"id": "4418391", "title": "小米集团-W持续拉升涨超1%，此前一度跌超3%", "content": "小米集团-W持续拉升涨超1%，此前一度跌超3%。公司一季度实现营业收入991.42亿元，同比下降10.9%；归母净利润47.23亿元，同比骤降约57%。", "ctime": 1779950320, "time_str": "14:38:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260528/c677039970.shtml"}, {"id": "4418347", "title": "哥伦比亚总统称美移民与海关执法局拘留中心是“集中营”", "content": "哥伦比亚总统佩特罗27日通过社交媒体说，美国移民与海关执法局的拘留中心是“集中营”。哥外交部将就一名哥伦比亚公民在美拘留中心死亡事件向美国政府递交抗议照会。佩特罗警告说：“美国政府应当反思，其移民政策是如何夺走美国人和拉丁美洲人生命的。”（新华社）", "ctime": 1779949896, "time_str": "14:31:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260528/c677039819.shtml"}, {"id": "4418345", "title": "日韩股市集体收跌", "content": "日经225指数收跌0.47%，报64693.12点。韩国综指收跌0.53%，报8185.25点。", "ctime": 1779949875, "time_str": "14:31:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260528/c677039811.shtml"}, {"id": "4418341", "title": "前四月重庆市级重点项目完成投资超1500亿元", "content": "今年1—4月，重庆市级重点项目完成投资1593.5亿元，完成年度计划投资的31.8%。其中，巴南中天寰宇智能制造低空产业飞行总部基地等155个项目实现开工，重庆交通大学科技创新与工程实训基地等32个项目完工投用。(人民财讯)", "ctime": 1779949870, "time_str": "14:31:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260528/c677039810.shtml"}, {"id": "4418311", "title": "MiniMax年化收入翻番，企业开发者客户破百万", "content": "5月28日，MiniMax 披露最新业务数据：截至目前，公司服务的全球企业和开发者客户数已超百万，较半年前增长5倍；全球用户规模约3亿。过去两个月，公司年化经常性收入（ARR）实现超过100%的增长。据此前3月业绩会公开信息，公司2026年2月ARR已超1.5亿美元；同期M2系列模型日均token消耗量两个月内增长6倍，开放平台新注册用户增长4倍以上。这次数据披露意味着MiniMax ARR翻番周期已压缩至60天。（第一财经）", "ctime": 1779949530, "time_str": "14:25:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260528/c677039675.shtml"}, {"id": "4418307", "title": "ETF两市成交额超4000亿元", "content": "截至目前，ETF两市成交额超4000亿元，报4017.03亿元，分类型来看，股票型ETF成交额1468亿元，债券型ETF成交额1578.79亿元，货币型ETF成交额187.40亿元，商品型ETF成交额87.40亿元，QDII型ETF成交额425.53亿元。其中，成交额最高的非货币型ETF分别是科创50ETF（588000）、中韩半导体ETF（513310）、科创芯片ETF（588200），成交额分别为67.08亿元、63.99亿元、55.61亿元。", "ctime": 1779949463, "time_str": "14:24:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260528/c677039649.shtml"}, {"id": "4418293", "title": "电影《给阿嬷的情书》总票房破12亿元", "content": "据猫眼专业版数据，电影《给阿嬷的情书》上映29天，总票房破12亿元。（人民财讯）", "ctime": 1779949221, "time_str": "14:20:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260528/c677039537.shtml"}, {"id": "4418289", "title": "创业板指涨2%", "content": "创业板指涨幅扩大至2%，上证指数涨0.19%，深证成指涨0.86%。", "ctime": 1779949193, "time_str": "14:19:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260528/c677039530.shtml"}, {"id": "4418285", "title": "北约加速强化波罗的海防线", "content": "在俄乌冲突持续、波罗的海安全压力上升背景下，北约正加速强化东翼防御体系。波兰媒体近日披露，北约计划调整指挥结构，以便在危机情况下更快速向波罗的海国家部署重兵。而与此同时，美国近期不断释放减少欧洲驻军、削减对北约军事支持的信号，引发欧洲盟友不安。(CCTV国际时讯)", "ctime": 1779949130, "time_str": "14:18:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260528/c677039507.shtml"}, {"id": "4418277", "title": "中国驻韩国大使馆发言人就驻韩美军司令不当言论答记者问", "content": "中国驻韩国大使馆发言人就驻韩美军司令不当言论答记者问。问：驻韩美军司令布伦森日前表示，“韩国就像一把指向中国的匕首”。去年，布伦森还曾表示，“韩国是中日之间的固定航母”。韩媒评论认为，布伦森有关言论反映出美国希将韩国作为遏华前哨。请问发言人对此有何评论？答：不久前，美国总统特朗普对中国进行国事访问，中美元首就构建“中美建设性战略稳定关系”达成重要共识，符合包括韩国在内的国际社会普遍期待。去年底今年初，中韩元首成功互访，引领两国关系开辟新局面，得到两国各界的积极支持。也许有少数人并不希望看到中美关系稳定发展，不希望看到中韩关系向好发展。我们不禁要问驻韩美军司令，你的对华言论充满敌意和攻击性，是得到了华盛顿的授权，还是想挑战中美元首北京会晤的共识？你把驻在国称为“航母”或是“匕首”等作战武器，是体现了你的好战，还是想把别的国家当枪使？驻韩美军的职责是清楚的，中方对驻韩美军的立场是明确的。我们注意到有韩国媒体发表评论警示布伦森先生“你越线了”。我们也想正告驻韩美军司令，“你的言论确实越线了”。希望驻韩美军司令尊重地区国家，多做有利于地区和平稳定的事情。(环球网)", "ctime": 1779948974, "time_str": "14:16:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260528/c677039398.shtml"}, {"id": "4418257", "title": "沪深京三市成交额超2.5万亿元，较上日此时缩量2798亿元", "content": "据同花顺iFinD数据，沪深京三市成交额超2.5万亿元，较上日此时缩量2798亿元，预计全天成交金额约2.9万亿元。截至目前，沪市成交额11444亿元，深市成交额13403亿元，北证50成交额160亿元。", "ctime": 1779948780, "time_str": "14:13:00", "stock_code": "", "stock // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {

  return '#64748b';

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
