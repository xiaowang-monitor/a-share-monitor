tock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260610/c677354142.shtml"}, {"id": "4500959", "title": "兴发集团：高纯D4正与光纤头部企业开展多轮测试", "content": "兴发集团在互动平台表示，公司有机硅系列新产品开发进展如下：一是高纯D4，用于光纤生产制造，目前正与光纤头部企业开展多轮测试，进展顺利；二是低粘度单相浸没式硅油冷却液，用于算力中心、超快充及电池模组等场景的散热，已完成小试验证，正积极开展扩试及市场推广工作；三是电力硅橡胶，用于变压器绝缘子生产制造，已完成相关认证并对外销售；四是仿生硅胶和特种灌封胶，分别适用于仿生皮肤和PCB板封装等场景，目前已完成配方，公司正在积极开展市场导入工作。", "ctime": 1781077380, "time_str": "15:43:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260610/c677354125.shtml"}, {"id": "4500949", "title": "凯盛新能：光伏玻璃行业供需失衡，行业中部分产线将逐步停产", "content": "针对媒体有关“光伏玻璃企业在snec展期间达成了联合减产的意向，减产1万吨/天”的报道，凯盛新能6月10日在互动平台表示，展会期间，光伏玻璃行业公司确有交流，但上述信息无法确认。从光伏玻璃行业供需来看，目前仍然失衡，价格持续走低，受到这一影响，行业中部分产线将基于经济效益方面的考虑，逐步停产。", "ctime": 1781077296, "time_str": "15:41:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260610/c677354082.shtml"}, {"id": "4500945", "title": "一品红：全资子公司创新药APH03571片获得临床试验批准通知书", "content": "一品红公告，全资子公司广州一品红制药有限公司自主研发的创新药物APH03571片的药物临床试验申请已获得国家药品监督管理局批准，并收到《药物临床试验批准通知书》，将于近期开展临床试验。", "ctime": 1781077282, "time_str": "15:41:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260610/c677354076.shtml"}, {"id": "4500919", "title": "太极集团：控股子公司西南药业盐酸托莫西汀胶囊获得药品注册证书", "content": "太极集团公告，控股子公司西南药业股份有限公司近日收到国家药品监督管理局颁发的盐酸托莫西汀胶囊的《药品注册证书》。该药品适用于治疗儿童和青少年的注意缺陷/多动障碍（ADHD），为《国家基本医疗保险、工伤保险和生育保险目录（2025 年）》乙类药品。经《Menet》数据库统计，2025年盐酸托莫西汀胶囊在中国城市公立、县级公立、城市药店、网上药店、城市社区及乡镇卫生院销售总额 3.23亿元。截至目前，西南药业对该产品累计投入研发费用 617.6万元（未经审计）。", "ctime": 1781077167, "time_str": "15:39:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260610/c677354001.shtml"}, {"id": "4500917", "title": "太极集团：盐酸肾上腺素注射液通过仿制药一致性评价", "content": "太极集团公告，控股子公司西南药业盐酸肾上腺素注射液通过仿制药质量和疗效一致性评价。该药品主要适用于因支气管痉挛所致严重呼吸困难，可迅速缓解药物等引起的过敏性休克，亦可用于延长浸润麻醉用药的作用时间。各种原因引起的心脏骤停进行心肺复苏的主要抢救用药。", "ctime": 1781077164, "time_str": "15:39:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260610/c677354000.shtml"}, {"id": "4500915", "title": "中国汽车工程学会张进华：燃料电池汽车发展不追求简单数量 更要重视场景质量、运营强度与商业闭环", "content": "中国汽车工程学会理事长、国际氢能燃料电池协会副理事长张进华在今日举办的国际氢能与燃料电池汽车大会上表示，氢能与燃料电池产业进入更加理性务实的发展新阶段，面向这一新阶段，应共同关注四个方向：一、商用车是燃料电池率先应用的领域，燃料电池汽车需要在成本寿命和可靠性上打造清晰的产品优势，围绕关键材料、核心部件和整车控制技术等持续攻关；二、以场景找准燃料电池汽车规模化突破口，燃料电池汽车发展不追求简单的数量，更要重视场景质量、运营强度与商业闭环，围绕重大冷链港口、矿山城际干线等高频、高载、高强度场景，推动车辆推广与货运组织线路规划、站网布局、氢源保障同步设计；三、以氢源降本与多元应用，构建区域氢能生态，坚持因地制宜，资源匹配与场景迁移，实现制、储、输、配、加、用全链条协同优化；四，坚持开放合作，深化关键技术研发、标准法规协调、示范场景共建、产业链协同等多领域的国际合作。（蓝鲸新闻）", "ctime": 1781077154, "time_str": "15:39:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260610/c677353995.shtml"}, {"id": "4500913", "title": "茅台股东大会伴手礼“减配”：小酒及冰淇淋仍缺席，笔记本只剩“本”", "content": "6月10日，贵州茅台2025年度股东会定于明日召开，会址选定茅台会议中心大礼堂。股东们于今日下午2点至8点，在茅台国际大酒店大堂签到处进行报到。据记者与现场股东交流得知，今年的股东伴手礼仍然没有茅台小酒礼盒，去年包装相对精美的笔记本礼盒套装也被取消，仅剩笔记本和笔。此外，像参会资料和餐券等仍被保留。（酒业内参）", "ctime": 1781077142, "time_str": "15:39:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260610/c677353982.shtml"}, {"id": "4500909", "title": "王志斌出任华兴证券董事长", "content": "华兴证券今日公告，经公司董事会审议通过，选举王志斌为公司新任董事长。原董事长王力行因工作重心调整，辞任华兴证券董事长职务，继续担任公司董事。履历显示，王志斌拥有近20年持牌金融机构管理经验，加入华兴证券之前，曾任华兴资本集团董事长助理；在担任招商期货有限公司总经理近十年间，主导公司从筹备到行业头部的发展。（财联社）", "ctime": 1781077062, "time_str": "15:37:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260610/c677353937.shtml"}, {"id": "4500897", "title": "航行警告 渤海实弹射击", "content": "大连海事局发布航行警告，6月10日16时至11日18时，渤海部分海域进行实弹射击，禁止驶入。（中国海事局网站）", "ctime": 1781076981, "time_str": "15:36:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260610/c677353906.shtml"}, {"id": "4500887", "title": "万林物流：实控人樊继波解除质押2.10%", "content": "万林物流公告，公司实际控制人樊继波于2026年6月9日解除质押1261万股，占其持股16.25%、占总股本2.10%。解除后其持股7760.66万股，占12.95%，尚质押1930万股，占其持股24.87%、占总股本3.22%。樊继波及一致行动人合计持股1.94亿股，占32.42%，累计质押3500万股，占合计持股18.02%、占总股本5.84%。", "ctime": 1781076958, "time_str": "15:35:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260610/c677353872.shtml"}, {"id": "4500873", "title": "我国“一次评价、多国通行”的互认机制已覆盖全球经济总量超95%区域", "content": "记者今天（10日）从市场监管总局召开的新闻发布会上了解到，我国通过加强质量认证领域的国际合作，不断深化国际互认，在促进国际贸易降低成本、提升效率等方面取得了积极成效。在多边合作方面，市场监管总局已签署15份多边互认协议，并推荐84家认证和检验检测机构加入国际电工委员会（IEC）合格评定体系，每年发放电子元器件、电工、防爆电器、可再生能源类产品认证证书、报告一万余张，“一次评价、多国通行”的互认机制可覆盖全球经济总量超95%的区域，有力服务我国外贸企业走向国际市场。（央视新闻）", "ctime": 1781076820, "time_str": "15:33:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260610/c677353772.shtml"}, {"id": "4500869", "title": "合富中国：2026年1-5月营收2.65亿元，同比下降13.91%", "content": "合富中国公告，2026年1-5月累计合并营业收入为人民币2.65亿元，较去年同期减少13.91%，降幅较去年同期有所收窄。", "ctime": 1781076801, "time_str": "15:33:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260610/c677353704.shtml"}, {"id": "4500865", "title": "瑞斯康达：董事长李月杰因个人原因辞职，选举韩猛为新任董事长", "content": "瑞斯康达公告，董事长李月杰因个人原因辞职，自2026年6月9日起生效。公司第六届董事会第十二次会议选举韩猛为新任董事长，任期至第六届董事会届满。韩猛自2025年7月起代行董事长及法定代表人职责，公司法定代表人变更为韩猛，相关工商变更登记手续正在办理中。韩猛持有公司股份45000股，占总股本的0.01%。", "ctime": 1781076787, "time_str": "15:33:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260610/c677353697.shtml"}, {"id": "4500863", "title": "风语筑：新增累计诉讼、仲裁涉案金额2.96亿元", "content": "风语筑公告，截至本公告披露日，公司及子公司连续十二个月新增累计诉讼、仲裁涉案金额合计2.96亿元，已超过公司最近一期经审计净资产的10%。", "ctime": 1781076780, "time_str": "15:33:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260610/c677353691.shtml"}, {"id": "4500857", "title": "外交部：中方坚决反对非法单边制裁 敦促欧方纠正错误做法", "content": "6月10日，外交部发言人林剑主持例行记者会。针对欧洲计划对中国、土耳其、印度及其他国家的企业采取制裁措施作出回应。发言人林剑表示，我们多次说过，中方一贯坚决反对缺乏国际法依据、没有联合国安理会授权的非法单边制裁，已多次向欧方提出严正交涉，敦促欧方纠正错误的做法，撤回非法单边制裁。中方将密切关注有关的动向，并将采取必要的措施，坚决维护自身的正当权益。（央视新闻）", "ctime": 1781076756, "time_str": "15:32:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260610/c677353683.shtml"}, {"id": "4500845", "title": "市场监管总局：聚焦当地外贸龙头企业等主体，及时收集涉及质量认证国际合作障碍", "content": "记者今天了解到，市场监管总局发布了《地方市场监管部门质量认证国际合作工作指引》，为各地市场监管部门加强和改进相关工作、更好地服务当地企业和经济发展提供指导。《工作指引》指导各地市场监管部门聚焦当地外贸龙头企业、中小微出口企业、重点产业链上下游企业、检验检测认证机构等主体，及时收集涉及质量认证国际合作障碍，以及外贸企业出口面临的市场准入认证诉求，发现质量认证领域涉外难点、堵点问题及潜在风险后及时向市场监管总局提报，为国家层面质量认证对外交流合作、国际谈判提供素材案例，并及时跟踪有关诉求办理进展及意见，形成调查、上报、落实、反馈的闭环工作机制，确保企业诉求得到有效回应，切实发挥质量认证服务地方产业的积极作用。（央视新闻）", "ctime": 1781076648, "time_str": "15:30:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260610/c677353652.shtml"}, {"id": "4500843", "title": "丁向群会见香港金管局总裁余伟文和香港银行公会代表团", "content": "国家金融监督管理总局党委书记、局长丁向群6月9日会见由香港金管局总裁余伟文率领的香港银行公会代表团。双方就内地与香港经济金融发展、深化两地银行业合作、巩固提升香港国际金融中心地位等议题进行交流。", "ctime": 1781076615, "time_str": "15:30:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260610/c677353634.shtml"}, {"id": "4500837", "title": "外交部：日本刻意渲染周边紧张局势 意在欺骗日本民众和国际社会", "content": "6月10日，外交部发言人林剑主持例行记者会。有记者提问，据报道9日日本自民党召开总务大会，通过了对修订“安保三文件”的建议草案，请问中方对此有何评论？林剑表示，有关草案再次暴露日本一些势力搞“再军事化”的企图与妄动，包括中国在内的国际社会对此高度关切和警惕。日方草案无端指责抹黑中国正常军事活动，刻意渲染周边紧张局势，目的无非是欺骗日本民众和国际社会，为自身加速推进“再军事化”制造借口。（央视新闻）", "ctime": 1781076577, "time_str": "15:29:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260610/c677353614.shtml"}, {"id": "4500825", "title": "韩国曝出AI眼镜作弊案 考虑高考禁用同类用品", "content": "韩国考试机构10日说，两名考生近日在托业(TOEIC)英语能力考试中利用AI智能眼镜作弊，受到严肃处理。这一新型作弊方式引起重视，韩国教育部门考虑高考禁用这类用品。韩联社10日以考试机构为消息源报道，这两名考生分别在5月10日、5月31日的考试中被监考人员发现形迹可疑，经查两人佩戴AI眼镜进行作弊。依据考试相关规定，两人本次考试成绩作废，且今后4年内不得再次参加托业考试。这类智能眼镜集成了摄像头、麦克风与生成式人工智能，可对拍摄画面进行解析，通过镜片或内置扬声器向使用者传递答案等信息。近期推出的部分款式外观与普通眼镜几乎无异，肉眼很难分辨。韩国一些考试机构已着手展开专项培训，提升监考人员识别AI眼镜的能力。此外，韩国教育部门正考虑出台规定，禁止考生在一年一度的大学修学能力考试（即高考）期间将此类用品带入考场。（新华社）", "ctime": 1781076485, "time_str": "15:28:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260610/c677353577.shtml"}, {"id": "4500819", "title": "美国对伊朗浓缩铀要求有变：“外运”变“稀释”？", "content": "美国媒体9日援引美国官员和多名外交官的话报道，美国与伊朗通过巴基斯坦斡旋展开的谈判出现“重大进展”，其中在伊朗浓缩铀处置问题上，美国立场有变：不再要求伊朗将其高丰度浓缩铀库外运至别国，而是与国际原子能机构合作进行稀释。(新华社)", "ctime": 1781076411, "time_str": "15:26:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260610/c677353532.shtml"}, {"id": "4500789", "title": "中国海警舰艇编队6月10日在我钓鱼岛及其附属岛屿领海维权巡航", "content": "中国海警台州舰编队在我钓鱼岛及其附属岛屿领海维权巡航。这是中国海警依法开展的维权巡航活动。（央视新闻）", "ctime": 1781076182, "time_str": "15:23:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260610/c677353422.shtml"}, {"id": "4500785", "title": "安森美发布氮化镓功率产品组合", "content": "安森美宣布推出全新GaNEXUS 氮化镓（GaN）功率产品组合。该系列专为在人工智能（AI）数据中心、工业自动化、机器人及能源基础设施等应用中实现更高能效、更高功率密度及更优热性能而设计。(蓝鲸新闻)", "ctime": 1781076082, "time_str": "15:21:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260610/c677353371.shtml"}, {"id": "4500765", "title": "外交部回应美伊局势：相关各方应尽早实现全面持久停火", "content": "6月10日外交部发言人林剑主持例行记者会，有记者问，北京时间6月10日上午，美国对伊朗发起了三轮袭击，随后伊朗作出回应，对约旦、科威特、巴林的美军基地发起了回击，请问中方对中东局势再次升级有 M容量砍半，此一调整并非英伟达下修存储器总需求量，而是应对供应端2027年初步规划配给英伟达的产能不足的事实。在此背景下，英伟达选择调降单颗容量、扩大模组出货数量，以强化其市占，同时凸显LPDDR5X供给缺口难以被填补与中长期需求上扬的趋势。该机构强调，此次规格调整属于供应端主导的架构妥协，对整体DRAM供需并无实质负面影响，亦不代表英伟达下修总体存储器需求。（界面新闻）", "ctime": 1781075271, "time_str": "15:07:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260610/c677352530.shtml"}, {"id": "4500643", "title": "期货收评：贵金属、原油系集体下挫！沪银跌近5% 燃油跌超3%", "content": "期货收评：截止收盘，国内期货主力合约跌多涨少，沪银跌近5%，铂跌超4%，燃料油、沪金、低硫燃料油跌超3%，液化石油气跌近3%，原油、瓶片跌超2%。涨幅方面，多晶硅涨近5%，工业硅、氧化铝涨超3%，集运欧线涨超2%，烧碱、铁矿石、鸡蛋、碳酸锂涨超1%。", "ctime": 1781075144, "time_str": "15:05:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260610/c677352301.shtml"}, {"id": "4500675", "title": "水利部：今年汛期多款堤防安全技术装备将投入使用", "content": "今年汛期多款堤防安全技术装备将投入使用。日前，针对堤坝常见隐蔽隐患与坡面险情自主研发的一批防汛新技术、新装备已在河南中牟黄河大堤完成测试。这次测试的装备体系涵盖堤防隐患探测与智能巡堤查险两大领域，包括探地雷达、瞬变电磁仪等高精度探测设备，以及新型无人机、机器狗等智能化巡检装备。（央视新闻）", "ctime": 1781075115, "time_str": "15:05:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260610/c677352442.shtml"}, {"id": "4500653", "title": "欧洲主要股指开盘集体上涨", "content": "欧洲主要股指开盘集体上涨，欧洲斯托克50指数涨0.31%，英国富时100指数涨0.24%，法国CAC40指数涨0.19%，德国DAX指数涨0.35%。", "ctime": 1781074964, "time_str": "15:02:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260610/c677352307.shtml"}, {"id": "4500615", "title": "ETF两市成交额报3820.27亿元，较昨日此时缩量123.02亿元", "content": "截至目前，ETF两市成交额报3820.27亿元，较昨日此时缩量123.02亿元，分类型来看，股票型ETF成交额1387.39亿元，债券型ETF成交额1205.83亿元，货币型ETF成交额233.79亿元，商品型ETF成交额115.05亿元，QDII型ETF成交额878.22亿元。", "ctime": 1781074893, "time_str": "15:01:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260610/c677352296.shtml"}, {"id": "4500601", "title": "A股收评：科创50指数冲高回 // 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
