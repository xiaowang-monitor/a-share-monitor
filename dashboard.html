完成自由贸易协定第二阶段谈判，以实际行动促进地区经济一体化，推动普惠包容的经济全球化。（新华社）", "ctime": 1787211936, "time_str": "15:45:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260820/c679131891.shtml"}, {"id": "4992541", "title": "日科化学：2026年上半年净利润3027.27万元，同比增长2518.58%", "content": "日科化学公告，2026年上半年营业收入19.06亿元，同比下降2.63%。归属于上市公司股东的净利润3027.27万元，同比增长2,518.58%；扣非净利润2525.65万元，上年同期为-12.36万元。公司计划不派发现金红利，不送红股，不以公积金转增股本。", "ctime": 1787211936, "time_str": "15:45:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260820/c679131893.shtml"}, {"id": "4992533", "title": "力聚热能：2026年半年度净利润3279.14万元，同比下降37.60%", "content": "力聚热能公告，2026年半年度营业收入3.4亿元，同比下降15.84%；归属于上市公司股东的净利润3279.14万元，同比下降37.60%；归属于上市公司股东的扣除非经常性损益的净利润2129.46万元，同比下降46.13%。本报告期利润分配预案不适用。", "ctime": 1787211898, "time_str": "15:44:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260820/c679131871.shtml"}, {"id": "4992531", "title": "通化金马：2026年上半年净利润710.46万元，同比下降57.72%", "content": "通化金马公告，2026年上半年营业收入5.57亿元，同比下降14.28%；归属于上市公司股东的净利润710.46万元，同比下降57.72%；归属于上市公司股东的扣除非经常性损益的净利润611.71万元，同比下降57.54%。公司计划不派发现金红利，不送红股，不以公积金转增股本。", "ctime": 1787211893, "time_str": "15:44:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260820/c679131869.shtml"}, {"id": "4992519", "title": "上海：到2030年底 力争基本完成不成套职工住宅改造", "content": "上海市人民政府办公厅印发《上海市城市更新和住房发展“十五五”规划》。其中指出，城中村和旧住房成套改造提速攻坚。加快城中村改造，用足用好城中村改造专项借款、地方政府专项债等，加大财政资金投入。加快动迁腾地，积极推进实施房票等多元化安置。到2026年底，全面启动城中村整体改造项目，全面完成整治提升。到2027年底，全面完成整体改造项目的前期改造。同步推进实施规划拔点。\n加快旧住房成套改造，通过拆除重建、旧城区改建、功能置换等方式实施不成套职工住宅改造，积极完善公房承租权归集、腾退更新路径。到2026年底，力争全面完成剩余约2万平方米小梁薄板房屋改造。到2030年底，力争基本完成不成套职工住宅改造，不成套里弄、公寓、花园住宅更新取得积极成效，推动实施一批兼具民生改善、保护发展的城市更新项目。", "ctime": 1787211661, "time_str": "15:41:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260820/c679131776.shtml"}, {"id": "4992487", "title": "百度文心助手升级任务引擎2.0 日活用户同比增长83%", "content": "8月20日，百度在AI Day开放日上宣布，百度APP文心助手升级至任务引擎2.0，可针对用户目标自主规划与执行任务，覆盖金融、教育、办公等场景。数据显示，今年6月文心助手日活跃用户同比增长83%，日均对话轮次增长超过两倍。据介绍，升级后的任务引擎可完成信息收集、加工处理、创作表达及成品交付等环节。同日，百度APP推出搜索结果“GUI通识卡片”功能，将知识卡片、步骤图解及交互动画整合为结构化页面，目前覆盖数理化高频考点。", "ctime": 1787211388, "time_str": "15:36:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260820/c679131643.shtml"}, {"id": "4992463", "title": "伊朗与阿曼就霍尔木兹海峡船舶通行机制谈判接近尾声", "content": "当地时间20日，伊朗与阿曼就建立霍尔木兹海峡船舶通行共同机制的谈判已接近最后阶段。眼下，伊朗和阿曼正在商讨关于霍尔木兹海峡的谅解协议，制定通航新机制。有消息称，这令特朗普感到沮丧。他17日威胁称，如果阿曼“阻碍”美国重新开放霍尔木兹海峡，美国就会轰炸这一海湾盟友。消息称，船只持续遇袭以及远低于战前水平的石油流量表明，美国和伊朗都未能如其所称“完全控制”霍尔木兹海峡。（央视新闻）", "ctime": 1787211234, "time_str": "15:33:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260820/c679131598.shtml"}, {"id": "4992455", "title": "《上海市城市更新和住房发展“十五五”规划》：增加主城区优质住宅用地供给 建立新城住宅用地供应与人口导入相适应的土地供应机制", "content": "上海市人民政府办公厅印发《上海市城市更新和住房发展“十五五”规划》。其中提到，房地产市场平稳健康发展。加快构建房地产发展新模式，稳妥有序推进房地产开发、融资、销售等相关基础性制度建设，严格落实商品住房预售资金监管制度和项目开发公司制，强化房地产项目开发全过程管理。规范市场秩序，提升房地产服务业能级水平。加大专业化、规模化住房租赁企业培育力度，健全房屋租赁分类监管体系。加快完善住房供应体系，综合考虑人口结构、家庭规模及变动趋势，科学合理确定各区住房供应规模、空间布局和产品结构。适应多子女家庭等多样化住房需求，增加房型更优、品质更高、配套更好的改善性住房供应。深化完善房地联动，增加主城区优质住宅用地供给，建立新城住宅用地供应与人口导入相适应的土地供应机制，优化住宅用地容积率、建筑高度、配建保障性租赁住房等指标。", "ctime": 1787211203, "time_str": "15:33:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260820/c679131577.shtml"}, {"id": "4992453", "title": "圆通速递：首次回购股份113.98万股，支付总金额1999.53万元", "content": "圆通速递公告，公司此前审议通过回购方案，拟以不低于3000万元且不超过5000万元回购公司股份，回购价格不超过25元/股，用于员工持股计划或股权激励。2026年8月20日，公司首次通过集中竞价交易方式回购股份113.98万股，占总股本0.03%，成交最高价17.63元/股，最低价17.45元/股，支付总金额1999.53万元（不含交易费用）。", "ctime": 1787211180, "time_str": "15:33:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260820/c679131566.shtml"}, {"id": "4992451", "title": "中国代表：团结合作是安理会最核心工作方法", "content": "中国常驻联合国代表傅聪19日在安理会工作方法问题公开辩论会上发言，强调团结合作应始终作为安理会最核心的工作方法。傅聪说，作为全球集体安全机制的核心，安理会能否有效履职关乎联合国权威和信誉，关乎国际和平与安全的前景。安理会工作方法从来不是简单的技术问题，需要从维护国际和平与安全的大局出发，不断改进和完善。团结合作是多边机制的活力之源，应始终作为安理会最核心的工作方法。无论是实质性问题还是程序性事项，安理会成员都应相互尊重、充分协商，妥善管控分歧，全力寻求共识。（新华社）", "ctime": 1787211174, "time_str": "15:32:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260820/c679131564.shtml"}, {"id": "4992399", "title": "商务部：今年上半年中厄贸易额达98.3亿美元，同比增速超20%", "content": "8月20日，商务部召开例行新闻发布会。有记者提问，本周厄瓜多尔总统正在中国访问。请介绍下中国和厄瓜多尔经贸合作情况，对本次访问经贸领域成果有何期待？商务部新闻发言人何亚东表示，近年来，在两国元首战略引领下，中国与厄瓜多尔政治互信日益巩固，务实合作成果丰硕。中厄自贸协定生效两年多来，双边贸易额快速增长，今年上半年达98.3亿美元，同比增速超过20%，中国已成为厄瓜多尔第二大贸易伙伴。双方还在基础设施、能矿领域开展了卓有成效的合作。中方愿与厄方一道，共同落实好两国元首重要共识，用好经贸混委会等机制，推动中厄经贸合作提质升级，推动中厄全面战略伙伴关系不断走深走实。", "ctime": 1787210928, "time_str": "15:28:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260820/c679131451.shtml"}, {"id": "4992397", "title": "外交部：中国愿为各国提供更多市场红利、创新红利、发展红利", "content": "8月20日，外交部发言人林剑主持例行记者会。有记者提问，我们注意到，近期美国哈佛大学肯尼迪学院教授达尼·罗德里克、美国企业研究所经济政策研究主任迈克尔·斯特雷恩等经济学家撰文批驳所谓“中国冲击”“中国挤压”论调，认为中国的贸易政策并非“以邻为壑”，而是“惠邻利邻”；中国不光卖成品，还大量出口生产设备、零部件、中间品，帮不少国家降低工业化成本；要求中国主动牺牲本国产业给别国让路，这种论调没有经济学道理。发言人对此有何评论？林剑表示，我们注意到，国际上越来越多有识之士发表了类似见解。事实证明，中国发展带给世界的不是“冲击”而是机遇，不是“挤压”而是赋能。物美价优的中国制造，降低了发展中国家的工业化门槛；开源普惠的中国创新，让更多国家用得上、用得起前沿技术；稳定可靠的中国供应，提升了全球产供链的韧性，助推全球南方国家更快走上现代化道路。面对当前世界经济不确定、不稳定性因素增多，中国愿继续以自身高质量发展，为各国提供更多市场红利、创新红利、发展红利。（央视新闻）", "ctime": 1787210854, "time_str": "15:27:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260820/c679131428.shtml"}, {"id": "4992381", "title": "伊朗伊斯兰革命卫队：若爆发新战争将使用破坏力更强武器", "content": "当地时间20日，伊朗伊斯兰革命卫队发言人穆赫比表示，伊朗伊斯兰革命卫队导弹所使用弹头的破坏力，远高于此前战争中使用的型号。穆赫比称，如果爆发新的战争，伊方所使用的武器装备将在各方面与过去明显不同。（央视新闻）", "ctime": 1787210708, "time_str": "15:25:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260820/c679131379.shtml"}, {"id": "4992371", "title": "特朗普称将于11月同金正恩会晤，外交部回应", "content": "8月20日，外交部发言人林剑主持例行记者会。\n\n法新社记者提问，美国总统特朗普19日表示，他将于今年晚些时候同朝鲜领导人金正恩会晤。据《华尔街日报》报道，特朗普正考虑借11月在深圳举办的亚太经合组织（APEC）峰会举行此次会面。请问发言人，作为与有关各方关系密切的国家，中方对美方相关表态有何评论？\n\n对此，林剑表示：“关于你提到的朝美接触的事宜，我不掌握具体信息，对此不做评论。”", "ctime": 1787210547, "time_str": "15:22:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260820/c679131313.shtml"}, {"id": "4992363", "title": "中韩领导人是否将在11月APEC峰会期间会晤？外交部回应", "content": "8月20日，外交部发言人林剑主持例行记者会。彭博社记者提问，关于王毅外长和韩国外长在韩国举行会谈，韩方消息称，王毅表示中方正积极考虑推动中韩领导人在11月APEC峰会期间会晤。中方能否证实，能否提供更多详细信息？林剑表示，中方愿以今年主办亚太经合组织领导人非正式会议为契机，同包括韩国在内的各方携手构建亚太共同体，为亚太乃至世界的和平与发展注入新动力。“关于你提到的具体问题，我们会适时发布消息。”（澎湃新闻）", "ctime": 1787210345, "time_str": "15:19:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260820/c679131194.shtml"}, {"id": "4992351", "title": "外交部回应美国宣布对伊朗实施“毁灭性经济行动”", "content": "据报道，美国总统特朗普19日宣布对伊朗实施“毁灭性经济行动”。外交部发言人林剑20日在例行记者会上答问时表示，制裁、施压无助于问题的解决。中方呼吁相关各方采取负责任举措，通过政治外交途径解决问题。（新华社）", "ctime": 1787210163, "time_str": "15:16:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260820/c679131111.shtml"}, {"id": "4992335", "title": "商务部：反对欧方滥用单边工具打压中国企业", "content": "商务部新闻发言人何亚东在20日举行的例行新闻发布会上说，中方一贯反对欧方滥用《外国补贴条例》（FSR）等单边工具打压中国企业。希望欧方与中方相向而行，迅速纠正在FSR调查中的错误做法，通过政府间对话加强沟通。中方将密切关注欧方动向，并将采取必要措施坚决维护国家安全和企业合法权益。（央视新闻）", "ctime": 1787210050, "time_str": "15:14:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260820/c679131086.shtml"}, {"id": "4992313", "title": "太初元碁发布预制化集装箱算力单元", "content": "记者获悉，国产AI芯片企业太初（杭州）集成电路有限公司（“太初元碁”）正式对外发布分布式算力解决方案，包含风冷智算集装箱、液冷超节点集装箱、超节点集装箱集群三类产品，该系列产品工厂预制率超90%，现场接入水电即可24小时内投运，可快速满足产业集群算力建设、企业应急扩容等。（21世纪经济报道）", "ctime": 1787209873, "time_str": "15:11:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260820/c679131049.shtml"}, {"id": "4992283", "title": "商务部回应美征收无人机关税问题", "content": "商务部新闻发言人何亚东在20日举行的例行新闻发布会上回应有关美征收无人机关税的提问时说，我们注意到美方对无人机及零部件征收232关税的决定。中方一贯认为，美方232措施是以“国家安全”为名实施单边主义、保护主义。事实上，中国对美出口无人机主要应用于农业、设备巡检、影视娱乐等民用场景。何亚东表示，美方232措施泛化国家安全概念，对贸易伙伴实施差异化关税税率，歧视性对待中国相关产品，严重损害中国企业利益，扰乱全球无人机产供链合作秩序，进一步破坏公平竞争的市场环境，中方对此坚决反对。我们敦促美方立即撤销232相关关税措施。（新华社）", "ctime": 1787209656, "time_str": "15:07:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260820/c679130933.shtml"}, {"id": "4992219", "title": "ETF两市成交额报4276.16亿元，较昨日此时缩量691.57亿元", "content": "截至目前，ETF两市成交额报4276.16亿元，较昨日此时缩量691.57亿元，分类型来看，股票型ETF成交额1539.3亿元，债券型ETF成交额1617.75亿元，货币型ETF成交额236.69亿元，商品型ETF成交额103.25亿元，QDII型ETF成交额779.17亿元。", "ctime": 1787209300, "time_str": "15:01:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260820/c679130836.shtml"}, {"id": "4992181", "title": "ETF收评：疫苗ETF领涨10.02%，中证2000ETF跌3.31%", "content": "ETF收盘涨跌不一，疫苗ETF（561920）领涨10.02%，疫苗ETF（562860）涨9.97%，疫苗ETF（159645）涨8.95%，杭州湾区ETF（512870）领跌9.98%，中证2000ETF（159536）跌3.31%，卫星ETF（159218）跌2.37%。", "ctime": 1787209270, "time_str": "15:01:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260820/c679130819.shtml"}, {"id": "4992173", "title": "A股收评：科创50指数震荡走低跌0.87%，创新药、贵金属板块涨幅居前", "content": "A股三大指数今日集体上涨，截至收盘，上证指数涨0.24%，深证成指涨0.59%，创业板指涨0.64%，北证50跌0.06%，科创50指数跌0.87%。全市场成交额20939亿元，较上日缩量4361亿元，全市 // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
