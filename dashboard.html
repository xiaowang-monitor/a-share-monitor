.score-bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s; }
.up { color: var(--red); }
.down { color: var(--green); }

ka.com.cn/20260914/c679873925.shtml"}, {"id": "5165047", "title": "外交部提醒中国公民暂勿前往塔吉克斯坦和阿富汗边境地区", "content": "据“领事直通车”公众号消息，当前，塔吉克斯坦和阿富汗边境地区安全形势复杂严峻，近期发生流弹落入塔吉克斯坦境内及阿富汗人员非法越境事件，造成人员伤亡和财产损失。外交部和中国驻塔吉克斯坦使馆提醒中国公民近期暂勿前往塔吉克斯坦和阿富汗边境地区（自哈特隆州沙姆西丁·绍欣区至戈尔诺-巴达赫尚自治州首府霍罗格）。", "ctime": 1789367132, "time_str": "14:25:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260914/c679873797.shtml"}, {"id": "5165043", "title": "法国就15岁以下未成年人社媒禁令向欧盟提交新版法案", "content": "当地时间9月14日，法国总统马克龙在社交媒体发文宣布，法国政府当天已向欧盟委员会通报禁止15岁以下未成年人使用社交媒体的新版本法案。此前，法国宪法委员会以相关规定对青少年言论和通信自由构成“过度侵犯”为由，于8月否决了原法案。新方案不再直接列出禁止使用的社交媒体平台，而是拟对约10项具有危害性或成瘾性的功能进行限制，包括视频自动播放、夜间推送通知、与陌生账号交流等。同时，该方案允许13岁至15岁未成年人在法定监护人同意的情况下获得豁免。马克龙表示，希望欧盟层面制定统一规则，加强对未成年人网络活动的保护。欧盟委员会主席冯德莱恩也表示，正在考虑提出禁止15岁以下未成年人使用社交媒体的措施。（央视新闻）", "ctime": 1789367018, "time_str": "14:23:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260914/c679873758.shtml"}, {"id": "5165007", "title": "机构预计美股明年将暴跌21%：“AI主导股市繁荣或将破灭”", "content": "据美国《财富》杂志官网当地时间13日报道，分析师称，美国股市正处于泡沫后期，明年势将暴跌21%，而美国国债收益率突破5%将标志着货币紧缩新时代。投资者应趁还能享受的时候享受2026年最后几个月，因为由AI主导的股市繁荣即将破灭。据上述报道，英国知名经济研究机构凯投宏观（Capital Economics）高级市场经济学家詹姆斯·赖利（James Reilly）重申了此前的预测：标普500指数今年底将收于8250点，较9月11日收盘上涨7.7%，随后到2027年底将暴跌21%至6500点。（中新经纬）", "ctime": 1789366514, "time_str": "14:15:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260914/c679873615.shtml"}, {"id": "5164943", "title": "上海：加大科技信贷产品供给，支持科技企业并购整合", "content": "上海金融监管局发布关于推进上海银行业保险业科技金融提质增效的意见。其中提到，加大科技信贷产品供给。加大对科技研发、科技成果转化的信贷支持力度，在产品额度、贷款期限、定价机制、担保方式等方面给予差异化支持。对科技型企业营运资金需求测算的具体方法，银行可根据经营管理实际自行统筹确定。支持卡脖子技术研发突破，助力重要产业链供应链实现自主可控。支持企业通过融资租赁方式推进技术改造和设备升级。支持科技企业并购整合，重点服务科技创新能力强、技术改造需求大、市场化前景广阔的“链主”企业进行产业整合，畅通资本循环。", "ctime": 1789366147, "time_str": "14:09:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": f 0914/c679872904.shtml"}, {"id": "5164409", "title": "阿曼呼吁开辟能绕过霍尔木兹海峡的替代LNG运输路线", "content": "阿曼能源部长在一个重要的天然气生产商和贸易商会议上表示，鉴于波斯湾持续数月的冲突继续扰乱天然气运输，亟需开辟替代路线，以便让液化天然气(LNG)运输能绕过霍尔木兹海峡。“我们来寻找其他出口路径吧，”阿曼能源和矿产部长Salim Al-Aufi周一在曼谷举行的Gastech大会上表示。“无论是向北出口，还是经由阿曼或也门出口，都要多样化出口路径，将资源运出本地区。”", "ctime": 1789363690, "time_str": "13:28:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260914/c679872890.shtml"}, {"id": "5164391", "title": "君实生物：新药JS203、JS207预计2026年内启动III期临床", "content": "君实生物在9月14日举行的2026年半年度业绩说明会上表示，公司新药JS203（CD20/CD3双抗）的III期临床研究预计将于2026年内启动；JS207（PD-1/VEGF双抗）已处于II期临床研究阶段，正在多个瘤种中开展与化疗、单抗、ADC等不同药物的联合探索，计划于2026年内启动III期临床研究。（人民财讯）", "ctime": 1789363064, "time_str": "13:17:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260914/c679872775.shtml"}, {"id": "5164387", "title": "花旗据悉2026年为沙特业务筹备超400亿美元资金", "content": "花旗据悉2026年为沙特业务筹备超400亿美元资金，加码服务沙特客户。", "ctime": 1789362859, "time_str": "13:14:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260914/c679872749.shtml"}, {"id": "5164291", "title": "特朗普称将考虑公布更多“9·11”关联文件", "content": "美国总统特朗普13日说，他将考虑“9·11”恐怖袭击受害者家庭就公布更多有关这场袭击的文件的请求。部分受害者家庭长期主张，袭击者获得了沙特阿拉伯境内极端人员的帮助。他们多年来就此起诉沙特政府，呼吁解密并公开更多相关文件。纽约市不少民主、共和两党议员也呼吁联邦政府公布相关电话记录。对此，特朗普13日在访问爱尔兰期间告诉记者：“我回国后会查看下这件事。”（新华社）", "ctime": 1789361753, "time_str": "12:55:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260914/c679872592.shtml"}, {"id": "5164283", "title": "三星显示与iQOO联合发布新屏幕技术", "content": "9月14日，三星显示与iQOO在韩国三星显示总部举办的屏幕技术沟通会上，首次官宣“三星显示×iQOO未来显示探索计划”，这项计划阶段性成果将首次在iQOO16上搭载，包括2K 165Hz、三星M16发光材料、 2K LEAD 2.0显示技术。（界面新闻）", "ctime": 1789361679, "time_str": "12:54:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260914/c679872587.shtml"}, {"id": "5164255", "title": "COMEX黄金期货跌超1%", "content": "COMEX黄金期货跌超1%，现报4360.5美元/盎司。", "ctime": 1789360946, "time_str": "12:42:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260914/c679872398.shtml"}, {"id": "5164239", "title": "日本福冈机场发生拖车与客机相撞事故", "content": "当地时间14日10时05分左右，日本福冈机场停机坪发生一起拖车与客机相撞事故。据日本全日空航空公司方面消息，该航司一趟飞往新千岁机场的ANA1279次航班在完成旅客登机后，在停机坪做起飞准备时，一辆拖车撞上了该机机身尾部，机上乘客与机组人员共187人，无人受伤。受事故影响，该航班以及原定使用同一架飞机执飞返程的ANA1278次航班被取消。（央视新闻）", "ctime": 1789360840, "time_str": "12:40:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260914/c679872381.shtml"}, {"id": "5164237", "title": "零跑汽车拟2027年在海外推插混车型", "content": "据知情人士向财联社记者透露，零跑汽车正在加大对插电式混合动力汽车（PHEV）技术路线的研发投入，从而向更广泛新能源车型拓展，并吸引新的潜在客户。“PHEV车型计划最早于明年上半年在海外市场推出，此举利于该公司进一步扩大市场份额。”上述知情人士表示。（财联社）", "ctime": 1789360823, "time_str": "12:40:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260914/c679872378.shtml"}, {"id": "5164231", "title": "华大智造携手AI4S龙头百图生科 共建虚拟细胞数据基础设施", "content": "9月11日，华大智造（688114）与生命科学基础大模型全球领跑者百图生科签约，双方将联合构建专属细胞大模型，面向虚拟细胞、虚拟扰动建专属高质量数据产出基础设施，提升细胞状态建模与扰动响应预测能力。百图生科提供xTrimo大模型，华大智造以跨组学仪器与规模化数据生产接入“模型—设备—实验—数据”协同进化闭环，推动实验从一次性验证升级为持续产出AI-Ready数据、驱动模型进化的能力中心，落地“设备+模型+智能体”一体化，加速AI4S进程。（科创板日报）", "ctime": 1789360645, "time_str": "12:37:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260914/c679872354.shtml"}, {"id": "5164229", "title": "40万+ 马来西亚游客成为雅万高铁最大外籍客源", "content": "雅万高铁方面的数据显示，今年1月至8月，超过10.5万名马来西亚籍旅客乘坐雅万高铁，占同期外籍旅客约40%。自雅万高铁开通运营以来，截至2026年8月，马来西亚籍旅客累计乘坐雅万高铁40.3626万人次，在各国外籍旅客中位居首位，占外籍旅客总量94.4087万人次的42.8%。（央视新闻）", "ctime": 1789360580, "time_str": "12:36:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260914/c679872344.shtml"}, {"id": "5164225", "title": "华为大阔折叠Pura X Max销量暴涨76.5%", "content": "据知情人士向透露，在苹果正式发布首款折叠屏iPhone Duo后，华为阔折叠华为Pura X Max 9月10日至9月13日四天销量环比上周同期增长76.5%。（科创板日报）", "ctime": 1789360480, "time_str": "12:34:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260914/c679872300.shtml"}, {"id": "5164217", "title": "中船防务：订单结构持续优化 手持订单交付周期已排至2030年", "content": "中船防务在9月14日召开的2026年半年度业绩说明会上表示，2026年上半年共承接8型55艘新造船订单，以集装箱船为主，订单结构持续优化，为综合毛利率改善奠定基础。随着当前手持订单的逐步建造交付，集装箱船收入占比将相应提升，对公司后续盈利水平形成正向拉动。公司手持订单交付周期已排至2030年，当前手持订单产生的效益将在后续年度逐步体现。", "ctime": 1789360366, "time_str": "12:32:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260914/c679872290.shtml"}, {"id": "5164209", "title": "李镇赴香港出席第十一届“一带一路”高峰论坛等活动", "content": "9月7日至9日，国务院国资委副主任李镇赴香港出席第十一届“一带一路”高峰论坛等活动。李镇在第十一届“一带一路”高峰论坛开幕式致辞中表示，习近平主席提出的“一带一路”倡议已成为全球范围最广、规模最大的国际合作平台，中央企业参建的能源、交通、数字等重大基础设施遍布五大洲，同时实施了一大批“小而美”项目，直接带动东道国超百万人就业。国资央企愿携手香港各界与共建国家一道，统筹设施联通、产业贯通、要素畅通，与各国政府、企业、主权基金等结成长期伙伴，用好香港国际资本市场、专业服务、科技创新、人文交流等独特优势，共同谱写高质量共建“一带一路”崭新篇章。活动前，李镇会同43家中央企业负责同志与香港特区行政长官李家超进行座谈，双方就深化国资央企与香港各界合作、支持香港保持长期繁荣稳定等交换了意见。在港期间，李镇还出席了第三届GTI数智香江国际论坛，并赴中央企业有关在港项目调研。国务院国资委有关厅局负责同志参加上述活动。（国资委）", "ctime": 1789360218, "time_str": "12:30:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260914/c679872266.shtml"}, {"id": "5164199", "title": "德意志银行预计美联储将在2027年3月加息25个基点", "content": "德意志银行预计，美联储将在2027年3月加息25个基点，在其原本预测的2026年9月、12月两次加息的基础上再增添一次加息。", "ctime": 1789360000, "time_str": "12:26:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260914/c679872231.shtml"}, {"id": "5164195", "title": "施罗德考虑通过收购壮大财富管理业务", "content": "施罗德财富管理首席执行官奥利弗・格雷格森在接 14/c679871878.shtml"}, {"id": "5164143", "title": "9月19日北京五环外将试鸣防空警报", "content": "今年9月19日是全民国防教育日。当天上午，北京市将组织防空警报试鸣，并按惯例开展相应的训练演练。试鸣范围在北京五环路以外行政区域。北京市国防动员办公室提醒市民和临时来京人员，在听到警报后请保持正常的工作和生活秩序。 根据通告，本次试鸣防空警报按照“预先警报”“空袭警报”“解除警报”的顺序依次鸣响，每种警报信号间隔7分钟。10时00分至10时03分，试鸣预先警报，鸣36秒、停24秒，反复3遍，时间3分钟。10时10分至10时13分，试鸣空袭警报，鸣6秒、停6秒，反复15遍，时间3分钟。10时20分至10时23分，试鸣解除警报，长鸣3分钟。（北京市人民政府）", "ctime": 1789358549, "time_str": "12:02:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260914/c679871875.shtml"}, {"id": "5164123", "title": "飞凯材料：紫外固化配套材料系列产品建设项目预计年底开工", "content": "飞凯材料9月14日在互动平台表示，公司紫外固化材料的现有产能可以满足下游客户的订单需求，公司将持续跟踪光纤行业的扩产情况以及下游客户的需求变化，并结合实际情况布局相关产能扩充方案。由公司安庆分公司负责实施的紫外固化配套材料系列产品建设项目，预计2026年年底开工建设。若项目顺利建成达产，将有助于扩充公司紫外固化涂料产能，更好地适配下游客户需求。", "ctime": 1789358032, "time_str": "11:53:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260914/c679871746.shtml"}, {"id": "5164111", "title": "中国地震台网中心：正加快推进地震预警信息接入iOS系统", "content": "近日，中国地震局官网“公众留言”板块显示，针对关于加快推进地震预警信息接入苹果iOS系统的建议，中国地震局监测预报司回复称，中国地震台网中心正在与苹果公司沟通，力争加快推进地震预警信息接入iOS系统。另外，苹果手机用户目前可通过微信小程序获取该局统一发布的地震预警信息。（央视新闻）", "ctime": 1789357724, "time_str": "11:48:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260914/c679871704.shtml"}, {"id": "5164103", "title": "DeepSeek-V4.1-Flash上线千问AI平台", "content": "9月14日，阿里云宣布，DeepSeek-V4.1-Flash正式上线千问AI平台，相关API服务与Token Plan同步开放。", "ctime": 1789357388, "time_str": "11:43:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260914/c679871645.shtml"}, {"id": "5164095", "title": "上海职工医保个账9月15日起可支付非免疫规划疫苗费用", "content": "近日，上海市医保局、市卫生健康委、市疾控局联合印发《关于本市职工医保个人账户历年结余资金支付非免疫规划疫苗费用有关事项的通知》。《通知》明确，自2026年9月15日起，本市参保人员可按规定使用职工医保个人账户历年结余资金，支付在定点医疗机构接种目录内非免疫规划疫苗产生的疫苗费用及注射服务费；同时支持医保家庭共济，进一步减轻市民接种负 // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
