贸易馆，聚焦人工智能、数字贸易等，集中展示服务贸易重点业态和创新成果。绿色能源馆推广中国跨境电力交易规则、绿证认证体系。制造业馆特设低空经济展示专区，呈现“低空+农业/物流”等多种场景等。（央视新闻）", "ctime": 1780031064, "time_str": "13:04:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260529/c677071887.shtml"}, {"id": "4424041", "title": "中国人民银行行长潘功胜到北京市分行调研督导树立和践行正确政绩观学习教育开展情况", "content": "5月29日，中国人民银行党委书记、行长潘功胜到北京市分行调研督导树立和践行正确政绩观学习教育开展情况。潘功胜强调，在全党开展树立和践行正确政绩观学习教育，是贯彻落实党的二十届四中全会战略部署、确保基本实现社会主义现代化取得决定性进展的必然要求，是践行党的根本宗旨、夯实党的执政根基的重要举措，是巩固拓展党内集中学习教育成果、持之以恒推进全面从严治党的有效途径。人民银行系统各级党组织要深入学习贯彻习近平总书记重要讲话和重要指示批示精神，认真落实中央树立和践行正确政绩观学习教育各项部署要求。潘功胜指出，北京市分行肩负着服务北京、服务总行的双重责任。近年来，北京市分行立足首都城市战略定位，推动各项金融政策落地见效，为首都现代化建设和金融高质量发展作出了积极贡献。同时，北京市分行作为人民银行营业管理部，在支撑保障总行履职方面发挥了重要作用。北京市分行党委要认真贯彻落实中央关于金融工作的决策部署和总行党委的工作安排，把握工作重点，紧盯工作落实。聚焦科技金融创新，用好科技创新和技术改造再贷款等政策工具，推动科创金融工作走在前列。进一步提高金融风险的监测、评估和预警能力，维护首都金融稳定。支持北京金融高水平开放，稳步推进跨境贸易投融资便利化改革，不断提升外汇管理服务实体经济质效。扎实开展树立和践行正确政绩观学习教育，一体推进学习研讨、查摆问题、整改整治等各项任务，抓好干部队伍建设。(央行）", "ctime": 1780030971, "time_str": "13:02:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260529/c677071851.shtml"}, {"id": "4423999", "title": "NASA称将评估“新格伦”火箭爆炸事故对近期任务的影响", "content": "当地时间5月28日晚，美国航天企业蓝色起源公司的“新格伦”火箭在静态点火测试期间发生巨大爆炸。美国国家航空航天局（NASA）局长艾萨克曼随后在社交媒体平台发文表示，NASA已获悉此次事故。艾萨克曼在帖文中强调，航天飞行“容错率极低”，而研发新重型运载火箭技术更是难上加难——NASA将与蓝色起源公司协作，全力支持对此次异常情况进行彻查，评估对近期任务的影响，并尽快恢复火箭发射。艾萨克曼还补充道，针对此次事件是否会对NASA主导的“阿耳忒弥斯”登月计划及“月球基地”项目造成影响，NASA将适时发布相关信息。（央视新闻）", "ctime": 1780030638, "time_str": "12:57:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260529/c677071771.shtml"}, {"id": "4423943", "title": "伊朗官员称无意将浓缩铀运出伊朗", "content": "伊朗伊斯兰议会国家安全和外交政策委员会主席易卜拉欣·阿齐兹表示，伊方没有将浓缩铀运出伊朗的计划。阿齐兹对俄新社表示，伊朗无意将浓缩铀转移到第三国、中间方或任何其他地方。俄罗斯外交部发言人扎哈罗娃28日在例行记者会上表示，只有伊朗才有权处置其拥有的浓缩铀，包括决定是否将浓缩铀运到其他国家，俄方从未向伊朗强加关于将浓缩铀运到俄境内的要求。美东时间25日下午，美国总统特朗普在社交媒体发文，称伊朗持有的浓缩铀要么由美方运到美国销毁，要么在国际监督下在伊朗销毁。（新华社）", "ctime": 1780029786, "time_str": "12:43:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260529/c677071536.shtml"}, {"id": "4423877", "title": "据港交所文件：广州市易鸿智能装备股份有限公司向港交所提交上市申请书", "content": "据港交所文件：广州市易鸿智能装备股份有限公司向港交所提交上市申请书。", "ctime": 1780029181, "time_str": "12:33:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260529/c677071379.shtml"}, {"id": "4423821", "title": "蔚来李斌：落后的品牌会加快出清", "content": "5月29日，在2026未来汽车先行者大会上，蔚来汽车董事长李斌表示，接下来一两年竞争会非常残酷，一些落后的品牌和技术都会加快出清。他认为，虽然价格战在远去，但是没有价格战的市场一样是非常残酷。随着技术的收敛，产品的同质化越来越严重，用户以前可能是选参数，现在开始越来越选品牌。汽车产业是非常长的产业链，行业的竞争从一招鲜的单点竞争开始进入到体系竞争的阶段。（第一财经）", "ctime": 1780027938, "time_str": "12:12:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260529/c677071088.shtml"}, {"id": "4423797", "title": "香港地区部分银行正收紧投资账户开户，暂对储蓄账户无影响", "content": "近日，有消息称，香港地区银行正在收紧开户。从知情人士处了解到，根据香港金管局的要求，有香港地区银行从5月26日开始收紧投资账户开户，包括需要签署纸质声明等，但对储蓄账户暂无影响。（界面）", "ctime": 1780027617, "time_str": "12:06:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260529/c677070933.shtml"}, {"id": "4423779", "title": "港股午评：恒生指数涨1.11%，恒生科技指数涨1.66%", "content": "港股午间收盘，恒生指数涨1.11%，恒生科技指数涨1.66%。恒指港股通ETF银华（159318）涨0.78%，港股通科技ETF鹏华（159751）涨0.88%。板块方面，酒店和度假村REIT、客运航空公司板块涨幅靠前；半导体产品与设备、独立电力生产商板块跌幅靠前。个股方面，创想三维涨36.28%，深演智能涨29.14%，联想集团涨23.98%，联想集团-R涨23.62%，华曦达涨22.71%；五一视界跌15.09%，博泰车联跌13.03%，滴普科技跌11.28%，英矽智能跌10.06%，澜起科技跌9.24%。", "ctime": 1780027395, "time_str": "12:03:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260529/c677070861.shtml"}, {"id": "4423777", "title": "韩国综指涨幅扩大至3%", "content": "韩国综指涨幅扩大至3%，现报8430.95点。", "ctime": 1780027390, "time_str": "12:03:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260529/c677070858.shtml"}, {"id": "4423765", "title": "5月29日午间公告一览：奥美医疗将于2026年6月4日举办2025年度业绩说明会", "content": "奥美医疗公告，公司将于2026年6月4日（星期四）15:00-17:00在“价值在线”举办2025年度业绩说明会，与投资者进行沟通和交流。投资者可于2026年6月4日前访问指定网址或使用微信扫描小程序码进行会前提问。参加人员包括董事长、总裁崔金海，独立董事蔡曼莉，董事会秘书郑晓程，副总裁兼财务总监黄铁柱。", "ctime": 1780027320, "time_str": "12:02:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260529/c677070845.shtml"}, {"id": "4423755", "title": "印度一在建桥梁坍塌 致6人死亡多人被困", "content": "当地时间28日深夜，印度北方邦一座在建桥梁在遭遇暴风雨后坍塌，已造成6人死亡，另有多人被困。当地警方表示，伤亡人数有可能进一步上升。（央视新闻）", "ctime": 1780027227, "time_str": "12:00:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260529/c677070824.shtml"}, {"id": "4423751", "title": "鸿海董事长刘扬伟：公司对AI带动的增长动能“充满信心”", "content": "全球最大电子代工制造商鸿海董事长刘扬伟周五表示，由于人工智能(AI)需求激增，公司对增长动能“充满信心”。刘扬伟在新北市举行的年度股东大会上表示，科技供应商在以往年中会出现的季节性低迷已不复存在，并补充说他对下半年非常乐观。“除非发生极其严重的‘黑天鹅’事件——但我尚未看到，目前也没有任何迹象——根据我们目前的观察，下半年前景非常乐观。”他指出，主要云服务提供商在AI领域的巨额投资今年已超过7000亿美元。“他们的资本支出就是我们的市场。这一数字已达7000亿美元，预计明年可能达到1万亿美元。这让我们对未来的成长动能充满信心，”他表示。（新浪财经）", "ctime": 1780026860, "time_str": "11:54:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260529/c677070724.shtml"}, {"id": "4423743", "title": "日本自卫队派人赴北约从俄乌冲突中“学习经验”", "content": "日本防卫省当地时间5月29日宣布，将向北约设在德国、负责为乌克兰军队提供训练和装备支援的司令部派遣4名日本自卫队成员，并从下个月起负责计划制定与协调等工作。日本防卫大臣小泉进次郎在内阁会议后的记者会上称，“通过派遣自卫官，日本将学习俄乌战场上出现的新型作战方式等经验，助力强化日本防卫体制。”（央视新闻）", "ctime": 1780026734, "time_str": "11:52:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260529/c677070700.shtml"}, {"id": "4423735", "title": "玉渊谭天：若欧盟执意推动“产能过剩工具”，中方必将反制", "content": "29日，欧委会即将召开会议，探讨对华经贸政策调整。就在会议开始前几天，几个欧盟成员国提交了一份提案，试图推动“韧性工具”，也就是所谓的“产能过剩工具”。虽然欧盟未曾明言，但这项新工具的设计对中国有着极强的针对性。据消息人士披露，中方可以对欧方有关做法发起反歧视调查、产供链安全调查。商务部已明确表态，一旦中国国家利益和企业权益受到损害，中方将坚决反制。如果欧盟执意推动所谓的“产能过剩工具”，中方必将第一时间采取行动，采取综合性反制措施。中方对贸易摩擦既不陌生也不害怕，奉陪到底。（玉渊谭天）", "ctime": 1780026569, "time_str": "11:49:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260529/c677070658.shtml"}, {"id": "4423731", "title": "生态环境部：部署五大攻坚行动 解决水体保护治理难问题", "content": "生态环境部今天（29日）举行例行新闻发布会。据介绍，生态环境部将加快出台《群众身边水体保护治理行动方案》和《农村小微水体治理行动计划》。将联合相关部门部署实施五大攻坚行动，推动工业园区水污染整治、县乡黑臭水体治理、畜禽粪污综合治理、乡村河湖库管护、小微水体排查整治等，解决群众身边水体保护治理的关键领域和薄弱环节。生态环境部还将继续指导地方扎实推进非法倾倒处置固体废物专项整治行动，深入推进溶洞垃圾等固体废物污染问题专项调查整治，构建末端整治与源头预防并重的长效工作机制，真正破解非法倾倒固体废物污染这个顽疾。（央视新闻）", "ctime": 1780026347, "time_str": "11:45:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260529/c677070601.shtml"}, {"id": "4423729", "title": "云南省商务厅厅长李朝伟：本届南博会AI智能机器人展区集中亮相多款服务机器人", "content": "云南省商务厅厅长李朝伟表示，第10届中国—南亚博览会首次设立服务贸易馆，以“数字赋能服务·开放链接两亚”为主题，聚焦人工智能、数字贸易和数字大通道，采用“虚拟展台+现场体验”模式双线办展，全方位展示数字服务、跨境服务、绿色服务协同发展的提质升级成果。其中，AI智能机器人展区集中亮相多款服务机器人，覆盖民生服务、跨境商务、智慧文旅等全场景，展示“AI+行业”解决方案和前沿成果。（人民财讯）", "ctime": 1780026280, "time_str": "11:44:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260529/c677070592.shtml"}, {"id": "4423725", "title": "风华高科：将根据自身规划并结合市场需求合理规划产能", "content": "风华高科在互动平台表示，公司MLCC产品扩产项目“祥和工业园高端电容基地项目”已于2025年底全面建设完成，并于2026年4月完成结项，公司后续将根据自身规划并结合市场需求合理规划产能。", "ctime": 1780026193, "time_str": "11:43:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260529/c677070570.shtml"}, {"id": "4423723", "title": "国际足联发售新一批世界杯门票", "content": "国际足联28日宣布，当天开始发售新一批美加墨世界杯门票。 国际足联在其官方社交平台账号“国际足联世界杯”上发帖称：“距离世界杯开幕还有14天！更多门票现已开售。门票数量有限，先到先得，售完即止。”该批门票从美国东部时间28日下午5点开始在其官网销售。 国际足联4月初宣布，已完成的三轮售票数据显示，世界各地已成功购票的球迷数量创下同阶段历史新高，本届赛事有望打破1994年美国世界杯创下的累计350万观众人数纪录。不过，本届世界杯票务流程和价格引发广泛争议，国际足联被指责以过高的价格出售门票。 2026美加墨世界杯将于6月11日至7月19日在美国、加拿大、墨西哥举行，这是首次有48支球队参赛的世界杯，比赛场次也大幅增加到104场。(新华社)", "ctime": 1780026182, "time_str": "11:43:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260529/c677070569.shtml"}, {"id": "4423717", "title": "港股恒生指数涨幅达1%", "content": "港股恒生指数涨幅扩大至1%，恒生科技指数现涨1.37%。", "ctime": 1780026045, "time_str": "11:40:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260529/c677070530.shtml"}, {"id": "4423693", "title": "生态环境部：国家级自然保护区重点问题基本完成整改", "content": "生态环境部今天（29日）举行例行新闻发布会，有关负责人介绍，我国持续开展“绿盾”行动，国家级自然保护区重点生态环境问题已基本完成整改。生态环境部建立重要生态空间人为活动监管体系，健全工作机制，实现问题线索发现交办、实地核实、会商诊断、整改销号、台账管理及调度督导全链条闭环管理。“绿盾”行动开展十年来，在国家级自然保护区发现的4664个重点问题中，已有4662个完成整改，新增重点问题的数量和面积双下降，基本实现了动态清零。“绿盾”是针对自然保护地等重要生态空间的常态化监管行动。从2017年以来，生态环境部等多部门联合行动，重点查处违法违规的矿产资源开发、工业企业、能源设施、旅游活动等人为活动，对发现的问题建立台账，“拉条挂账、整改销号”，有效降低了自然保护地内人为活动干扰，遏制了重大生态破坏事件的发生，改善了区域生物多样性，确保了生态质量总体保持稳定。（央视新闻）", "ctime": 1780025698, "time_str": "11:34:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260529/c677070347.shtml"}, {"id": "4423691", "title": "日本一航班因轮胎故障请求紧急返航", "content": "据日本国土交通省东京机场事务所消息，当地时间29日上午11时许，日本航空从羽田飞往鹿儿岛的JAL645航班请求紧急返回羽田机场着陆，原因是轮胎出现故障。（央视新闻）", "ctime": 1780025684, "time_str": "11:34:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260529/c677070343.shtml"}, {"id": "4423689", "title": "今年春夏季厄尔尼诺处于快速发展期", "content": "记者29日从国家气候中心了解到，5月赤道中东太平洋海温进入厄尔尼诺状态，夏秋季发展成为一次中等及以上强度的厄尔尼诺事件，于秋冬季达到峰值，发生强厄尔尼诺事件的概率正在增大，预计明年春季衰减。今年春夏季厄尔尼诺处于快速发展期，大气对海温演变有显著的响应，有利于西北太平洋副热带高压明显增强，引导更多的水汽输送到我国陆地区域，尤其有利于长江以南地区降水增强，而全国大部气温较常年偏高。（央视新闻）", "ctime": 1780025625, "time_str": "11:33:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260529/c677070329.shtml"}, {"id": "4423681", "title": "ETF午评：地产ETF领涨5.11%，卫星ETF领跌6.49%", "content": "ETF午间收盘涨跌不一，地产ETF（159707）领涨5.11%，房地产ETF（159768）涨5.04%，东南亚科技ETF（513730）涨4.57%，卫星ETF（159206）领跌6.49%，卫星ETF（563230）跌5.12%，卫星ETF（512630）跌5.05%。", "ctime": 1780025484, "time_str": "11:31:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260529/c677070259.shtml"}, {"id": "4423679", "title": "美蓝色起源公司重型运载火箭测试时爆炸", "content": "据美国媒体28日报道，美国蓝色起源公司“新格伦”重型运载火箭当天在佛罗里达州进行发动机点火测试时发生爆炸，未造成人员伤亡。蓝色起源公司随后证实，当天火箭测试期间出现“异常状况”。 据报道，爆炸发生于美国东部时间28日21时（北京时间29日9时）左右，地点位于佛罗里达州卡纳维拉尔角太空军基地。“新格伦”火箭原计划于6月4日执行发射任务，为亚马逊公司低地轨道卫星计划发射48颗卫星。爆炸发生时，这些卫星并不在火箭上。 蓝色起源公司当天在社交媒体平台X上表示，火箭在点火测试期间出现“异常状况”，所有现场人员均已确认安全。该公司创始人贝索斯表示，目前判断事故根本原因还为时过早，但公司已开始展开调查。“今天是非常艰难的一天，但我们会重建所有需要重建的部分，并恢复飞行。”他说。 “新格伦”重型运载火箭此前已执行3次发射任务。最近一次发射于今年4月实施，当时搭载美国AST太空移动公司“蓝鸟”7号卫星的火箭第二级出现故障，未能完成卫星入轨任务。(新华社)", "ctime": 1780025469, "time_str": "11:31:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260529/c677070255.shtml"}, {"id": "4423677", "title": "ETF两市成交额2788.30亿元", "content": "截至目前，ETF两市成交额报2788.30亿元，分类型来看，股票型ETF成交额1116亿元，债券型ETF成交额929.34亿元，货币型ETF成交额149.12亿元，商品型ETF成交额40.80亿元，QDII型ETF成交额314.65亿元。其中，成交额最高的非货币型ETF分别是中韩半导体ETF（513310）、香港证券ETF（513090）、科创50ETF（588000），成交额分别为：56.74亿元、56.56亿元、46.55亿元。", "ctime": 1780025466, "time_str": "11:31:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260529/c677070252.shtml"}, {"id": "4423675", "title": "A股午评：科创50指数高开低走跌3.63%，房地产、大消费板块集体走高", "content": "A股三大指数早盘集体下跌，截至午盘，上证指数跌0.37%，深证成指跌1%，创业板指跌1.14%，北证50跌2.46%，科创50指数跌3.63%。全市场成交额21323亿元，较上日放量3370亿元，全市场超3400只个股下跌。板块题材上，电力、零售、白酒、房地产、煤炭开采加工板块涨幅居前；MicroLED概念、半导体、光学光电子、金属新材料、BC电池板块跌幅居前。盘面上，电力板块延续强势表现，早盘低开高走，晋控电力、粤电力A、深南电A等多股涨停，珈伟 news.10jqka.com.cn/20260529/c677069977.shtml"}, {"id": "4423627", "title": "商务部：今年前4个月中国同南亚贸易额同比增长15.8%", "content": "5月29日上午，国新办举行新闻发布会，介绍中国与南亚经贸合作及第10届中国—南亚博览会有关情况。商务部副部长鄢东在会上介绍了中国和南亚国家的经贸特点。一是贸易规模实现新的跨越。2025年，中国和南亚国家贸易额突破2000亿美元大关，同比增长10.7%。今年前4个月，中国同南亚贸易继续保持良好增长势头，贸易额同比增长15.8%。中国目前是巴基斯坦、孟加拉国、斯里兰卡和马尔代夫的最大贸易伙伴。二是投资动能不断积聚。越来越多的中资企业开始重视南亚的投资价值，因地制宜同南亚各国开展港口、园区、电力等领域合作，在自身发展的同时，积极为当地税收、就业、出口增长做出了积极贡献。三是务实合作增进民生福祉。中国在南亚开展一系列民生援助和务实合作，不仅满足当地急需，更立足长远，帮助各国提升经济造血能力。（澎湃新闻）", "ctime": 1780024905, "time_str": "11:21:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260529/c677069968.shtml"}, {"id": "4423625", "title": "港股新消费股走强，泡泡玛特涨超10%", "content": "港股新消费股走强，泡泡玛特涨超10%，蜜雪集团涨超6%，布鲁可涨超5%，名创优品涨超4%。", "ctime": 1780024892, "time_str": "11:21:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260529/c677069964.shtml"}, {"id": "4423619", "title": "抖音：今年以来已配合相关部门抓获黑灰产犯罪嫌疑人162名", "content": "抖音发布关于深入打击网络黑灰产的公告称，随着平台治理深入，黑灰产对抗呈现出跨境作案、高隐蔽性、组织化等复杂特征。一些不法团伙利用跨平台多级跳转、VPN等技术工具、隐晦暗语，不断变换违规方式，在站内站外实施色情赌博导流、账号买卖及代解封、虚假流量等违法违规行为。对此，抖音加强识别研判，严肃处置违规内容及账号，针对违法犯罪的行为，依法固定证据并上报主管部门。今年以来，平台已配合相关部门抓获黑灰产犯罪嫌疑人162名。（人民财讯）", "ctime": 1780024777, "time_str": "11:19:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260529/c677069917.shtml"}, {"id": "4423613", "title": "A股中国中免涨停", "content": "A股中国中免涨停，现报60.24元。", "ctime": 1780024713, "time_str": "11:18:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260529/c677069894.shtml"}, {"id": "4423609", "title": "段永平再捐1万股茅台", "content": "5月26日，“安福县段永平教育专项基金”捐赠仪式在南昌举行。段永平向安福县慈善会无偿捐赠所持贵州茅台酒股份有限公司股票1万股，专项支持安福教育事业发展。此次捐赠的1万股茅台股票，将作为“安福县段永平教育专项基金”长期保留基金，以股票年度分红、股息等派生权益作为专项基金可使用资金，持续、稳定、长期助力安福教育提质、励教奖学、助学育才。事实上，这已经是段永平第二次捐出茅台股票，去年11月，段永平向江西水利电力大学 function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';

    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {

    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
