7", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260417/c676072082.shtml"}, {"id": "4241881", "title": "A股收评：创业板指高开高收涨1.43%站稳近11年高位，CPO、PCB等算力硬件股表现强劲", "content": "A股三大指数今日涨跌不一，截至收盘，上证指数跌0.1%，深证成指涨0.6%，创业板指涨1.43%，北证50涨4.77%。全市场成交额24529亿元，较上日成交额放量979亿元，全市场超2300只个股上涨。板块题材上，CPO、PET铜箔、PCB、光刻机、光纤、电池、风电设备、半导体板块涨幅居前；旅游及酒店、创新药、油气开采及服务、煤炭开采加工、猪肉、白酒、游戏板块跌幅居前。盘面上，光模块巨头中际旭创一季度业绩强劲推动CPO、PCB等算力硬件股走强，剑桥科技、广合科技、世嘉科技等10余股涨停，中际旭创再创新高。固态电池概念股午后走高，明冠新材20cm涨停，传艺科技、可川科技等多股封板，近期锂电池产业链上市公司的年报与业绩会，“固态电池”成为高频词之一。北交所个股午后大幅拉升，北证50指数一度涨超5%。另一方面，CRO、创新药板块多数调整回吐部分前期涨幅，药明康德盘中跌超6%。白酒股多数走低，贵州茅台盘中跌超4%，其公布的年报营收、净利润首次同比下降。", "ctime": 1776409275, "time_str": "15:01:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260417/c676072056.shtml"}, {"id": "4241875", "title": "IMF：中东冲突给中东和北非等地区带来多方面严重冲击", "content": "国际货币基金组织（IMF）中东和中亚部主任吉哈德·阿祖尔16日表示，自2月28日美国和以色列对伊朗发动军事打击以来，中东与北非这一全球重要经济走廊遭受了多方面的严重冲击。在该地区受冲突影响的8个石油出口国中，5个预计将在2026年出现经济萎缩。 IMF和世界银行春季会议本周在美国首都华盛顿举行。阿祖尔16日在一场新闻发布会上对媒体表示，中东战事扰乱了能源市场、贸易路线以及商业信心。全球约五分之一的石油运输以及大量液化天然气运输需要经过霍尔木兹海峡，该海峡的通航目前几乎陷入停滞，袭击和预防性停产使石油和天然气产量减少。 阿祖尔说，除了油气以外，全球约三分之一的海运化肥贸易经由该贸易通道运输，海湾合作委员会国家占全球硫磺出口的40%以上、氨和氮肥出口的20%左右。这些商品价格上涨直接转化为食品成本上升，影响到中东和北非、南亚以及非洲一些最脆弱的人群。 此外，战事也对服务业造成冲击，导致航空运输骤降、海运保险费用飙升、航运路线延长、物流链条变得更加脆弱。(新华社)", "ctime": 1776409271, "time_str": "15:01:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260417/c676072055.shtml"}, {"id": "4241859", "title": "股指期货午盘收盘 主力合约涨跌互现", "content": "股指期货午盘收盘，主力合约涨跌互现。沪深300股指期货(IF)主力合约跌0.23%，上证50股指期货(IH)主力合约跌1.15%，中证500股指期货(IC)主力合约涨0.43%，中证1000股指期货(IM)主力合约涨0.97%。", "ctime": 1776409228, "time_str": "15:00:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260417/c676072049.shtml"}, {"id": "4241825", "title": "奥迪与上汽联合开发下一代车型，首批规划四款车型", "content": "4月17日，奥迪与上汽集团签署战略合作协议，进一步深化合作。 协议聚焦AUDI品牌未来车型的全价值链布局，核心覆盖整车研发领域，并将在上海设立奥迪创新技术中心。据悉，双方将基于下一代智能数字平台联合开发AUDI品牌未来车型，首批规划四款车型。AUDI品牌于2024年发布，第一代量产车型中，首款车E5 Sportback已于2025年上市，首款SUV奥迪E7X将在车展首秀，第三款车计划于2027年推出。（第一财经）", "ctime": 1776408878, "time_str": "14:54:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260417/c676071924.shtml"}, {"id": "4241801", "title": "南向资金净买入超80亿港元", "content": "据同花顺iFinD数据，截至目前，南向资金净买入超80亿港元，其中港股通（沪）买入超85.35亿港元，港股通（深）卖出超4.87亿港元。", "ctime": 1776408461, "time_str": "14:47:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260417/c676071694.shtml"}, {"id": "4241795", "title": "神二十三发射、重复使用火箭飞行验证 今年中国航天重点任务发布", "content": "在今天（17日）国家航天局举办的2026年“中国航天日”新闻发布会上，国家航天局相关负责人回顾了2025年航天重大进展，并发布2026年重要任务等信息。2025年，共执行92次航天发射任务，发射次数比2024年提升35%。天问二号探测器成功发射，进入小行星2016HO3转移轨道，开启中国首次小行星探测与采样返回之旅。天问一号任务持续开展火星全球与区域性探测，3.5TB科学数据已面向全球科学家公开发布。载人航天圆满完成4次发射任务和2次返回任务，并成功完成了首次应急发射，载人登月工程任务有序推进。积极推进重点行业领域和大众消费领域北斗规模应用。资源三号04星成功发射，进一步提升中国立体对地观测能力。中国卫星互联网系统建设全面加速，规模化星座生产线建设加速推进。长征二号丁火箭实现百发百胜，成为中国第二型突破百发的运载火箭。朱雀三号、长征十二号甲两型重复使用运载火箭进行首飞测试。2026年，中国航天任务继续密集实施：天问二号将接近目标小行星，开展近距离探测；载人航天工程将实施神舟二十三号等载人飞船任务；多型重复使用火箭将开展飞行验证；商业航天将以高水平安全保障高质量发展。国际合作方面，中国与欧洲合作的太阳风磁层相互作用全景成像卫星将发射，旨在揭示太阳风与磁层相互作用过程和变化规律；中巴地球资源卫星合作将继续实施，延续中国与巴西近40年合作友谊。（央视新闻）", "ctime": 1776408376, "time_str": "14:46:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260417/c676071664.shtml"}, {"id": "4241785", "title": "欧洲报告警告：过度依赖美国云服务威胁欧洲安全", "content": "欧洲一家机构日前发布报告警告道，超过四分之三的欧洲国家在重要的国家安全工作中使用美国企业提供的云服务，这种依赖性可能使欧洲国家安全受到威胁。(新华社)", "ctime": 1776408258, "time_str": "14:44:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260417/c676071636.shtml"}, {"id": "4241783", "title": "我国科研人员研制出超强高导耐热铜箔", "content": "记者17日从中国科学院金属研究所沈阳材料科学国家研究中心了解到，该中心卢磊研究员团队成功研发出一种兼具超高强度、高导电性与优异热稳定性的“超级铜箔”，有效破解了铜箔在强度与塑性、导电性、热稳定性之间长期存在的“此消彼长”困境。相关研究结果于北京时间4月17日在国际学术期刊《科学》上在线发表。(新华社)", "ctime": 1776408223, "time_str": "14:43:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260417/c676071630.shtml"}, {"id": "4241769", "title": "追觅科技雷鸣出席国家商务部中意企委会圆桌会 作为中方企业代表发言", "content": "4月16日，由国家商务部主办的“中意企业家委员会圆桌会”在北京圆满举行。追觅科技受邀参会，并作为五家中方企业代表之一发言。在意大利市场，追觅凭借敏捷的本地化策略，多次登顶亚马逊类目销量第一。目前，追觅在意大利米兰开设两家旗舰店，并实现多个品类市占率第一。目前，追觅产品已进入全球120多个国家和地区，服务超4200万家庭。（科创板日报）", "ctime": 1776407991, "time_str": "14:39:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260417/c676071575.shtml"}, {"id": "4241757", "title": "沪深京三市成交额超2.2万亿元，较上日此时放量1106亿元", "content": "据同花顺iFinD数据，沪深京三市成交额超2.2万亿元，较上日此时放量1106亿元，预计全天成交金额约2.5万亿元。截至目前，沪市成交额9095亿元，深市成交额12673亿元，北证50成交额234亿元。", "ctime": 1776407649, "time_str": "14:34:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260417/c676071514.shtml"}, {"id": "4241737", "title": "日韩股市集体收跌", "content": "日经225指数收跌1.75%，报58475.90点。韩国综指收跌0.55%，报6191.92点。", "ctime": 1776407467, "time_str": "14:31:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260417/c676071476.shtml"}, {"id": "4241723", "title": "缅甸前总统温敏被特赦", "content": "4月17日，为纪念缅甸传统新年，总统敏昂莱签署特赦令。前总统温敏获得特赦，其将被释放回家。前总统温敏曾因多项贪污罪被判处九年零六个月监禁。（央视新闻）", "ctime": 1776407392, "time_str": "14:29:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260417/c676071450.shtml"}, {"id": "4241711", "title": "盘中一度跌超7%，海量数据最新回应", "content": "4月17日早盘，海量数据股价一度跌超7%。对于2026年一季度亏损扩大、现金流恶化的原因，海量数据方面回应记者称，一季度是淡季周期，且由于公司对人员进行了大规模优化，支付较多赔偿金。此外，优化后又招聘了 function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
