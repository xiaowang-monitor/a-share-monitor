ka.com.cn/20260702/c677893829.shtml"}, {"id": "4641109", "title": "阿布扎比迎接中国旅游业高管访问团，中国内地往返阿布扎比每周航班总数将达到35班", "content": "阿布扎比文化与旅游部携手阿提哈德航空及旅游业重要合作伙伴，接待了中国旅游业高管访问代表团。近期，阿提哈德航空与中国东方航空宣布成立合资合作项目，未来将为阿布扎比与中国之间新增每周28班往返航班。数据显示，2025年，阿布扎比共接待来自中国的酒店住客24.8万人次，游客平均停留时间增加至2.3天；此外，阿布扎比2025年全年酒店平均入住率达81%。（澎湃新闻）", "ctime": 1782967677, "time_str": "12:47:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260702/c677893700.shtml"}, {"id": "4641107", "title": "极端天气影响到AI了 全球AI数据中心面临极端高温威胁", "content": "热浪席卷多国，全球的大型科技公司也面临着一场严峻的挑战，那就是如何确保人工智能数据中心内的高性能芯片能够持续稳定地运行。报道援引一家气候风险分析机构近日公布的研究数据称，目前全球数据中心高达79%的算力容量面临着各种突发气候灾害的威胁，包括洪水、极端大风及山火等，这些灾害可能导致运营中断、停机时间增加，并推高保险和维修成本。目前，各大科技企业也正意识到气候因素给人工智能数据中心运行带来的挑战，并探索解决方案。微软公司表示，正在通过选址、完善冗余系统和实时监控等手段，来管理极端高温和恶劣天气带来的风险。英伟达公司上周表示，其新型的人工智能服务器可以在最高45摄氏度的冷却液环境下运行。英伟达称，冷却液温度提高1摄氏度，就可以使冷却系统能耗降低约4%。（央视财经）", "ctime": 1782967622, "time_str": "12:47:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260702/c677893694.shtml"}, {"id": "4641095", "title": "珠海发布全国首个城市级“海上新基建”建设行动方案", "content": "广东珠海发布了全国首个城市级“海上新基建”建设行动方案及首批投资机会清单。根据《珠海市“海上新基建”建设行动方案（2026-2028年）》，到2028年底，珠海将全面建成物理、数字、生态空间深度融合的现代化海上新基建体系。33个投资机会清单涵盖智慧航运、深远海绿能、海底算力、海洋牧场、海岛开发等领域，包括万山海域海底数据中心、海上综合能源岛、具身智能海洋特色模拟训练区等。（证券时报）", "ctime": 1782967244, "time_str": "12:40:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260702/c677893628.shtml"}, {"id": "4641091", "title": "日本股市遭遇外资大规模抛售，投资者纷纷清仓科技股", "content": "截至6月27日当周，海外投资者以约三个月来最快的速度抛售日本股票，以便趁上季度股价大幅上涨后估值走高之际从科技股中获利。人们对通过债务资助的人工智能支出也日益感到担忧。日本财政部周四公布的数据显示，非本国投资者在当周从日本股市净撤出1.82万亿日元（约合112亿美元），这是自3月28日以来最大的单周净卖出额。 日经 225指数上季度累计大涨 37.21%，受此影响，投资者上周纷纷在涨幅过高的科技股上落袋为安。 与此同时，日本长期国债外资连续第四周净流出，流出规模合计 4937亿日元；境外投资者还抛售了 2.43万亿日元短期国库券。", "ctime": 1782967072, "time_str": "12:37:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260702/c677893619.shtml"}, {"id": "4641061", "title": "25条中日航线6月取消全部航班", "content": "航班管家DAST最新统计显示，6月共有25条中日航线取消全部航班。整个6月中国大陆赴日本共有1488个航班取消，取消率为37.5%。今年上半年TOP20通航国家中，韩泰日航班量位列前三，其中赴韩航班量超2019年水平，赴泰国、日本恢复率仅64.7%、53.5%。(第一财经)", "ctime": 1782966633, "time_str": "12:30:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260702/c677893576.shtml"}, {"id": "4641059", "title": "巴基斯坦预计美伊下轮会谈将在哈梅内伊葬礼后举行", "content": "巴基斯坦外交部7月2日发表声明称，声明表示，各方就美伊谅解备忘录涉及的若干具体问题进行了深入讨论，并在相关议题上取得“积极进展”。声明指出，各方已同意在未来一段时间内继续保持谈判，并尽快确定下一轮会谈时间。巴外交部同时表示，下一轮会谈预计将在伊朗前最高领袖哈梅内伊葬礼仪式结束后尽快举行。(央视新闻)", "ctime": 1782966504, "time_str": "12:28:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260702/c677893550.shtml"}, {"id": "4641053", "title": "英伟达推出AI基础设施新合作模式 通过收入分成机制与AI云厂商推动算力建设", "content": "英伟达当地时间7月1日宣布推出全新的AI基础设施合作模式，将通过收入分成和信用支持机制，与AI云服务商共同建设大规模、多租户AI工厂，帮助初创企业、模型开发者、企业及科研机构更快获得AI算力，同时为英伟达创造与算力使用量挂钩的持续性收入。根据方案，AI云厂商将部署基于英伟达DSX AI Factory架构的AI工厂，对外提供云计算服务。", "ctime": 1782966214, "time_str": "12:23:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260702/c677893507.shtml"}, {"id": "4641047", "title": "7月2日午间公告一览：恒富控股获由巨运国际发展有限公司提出的原始停止通知书", "content": "恒富控股公告，于2026年6月30日，公司接获由巨运国际发展有限公司提出的原始停止通知书，旨在限制MARS Worldwide Holdings Limited名下的公司411,289,396股股份之转让。\n零跑汽车在港交所公告，近期公司董事长朱江明及股东傅利泉合共购入481.42万股本公司H股，每股均价35.86港元。近半年来，公司董事长朱江明及公司股东傅利泉合计增持金额约9亿港元。", "ctime": 1782965886, "time_str": "12:18:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260702/c677893370.shtml"}, {"id": "4641009", "title": "OpenAI提议让美国政府持有公司5%股份", "content": "据报道，OpenAI提议让美国政府持有公司5%股份。(蓝鲸新闻)", "ctime": 1782965128, "time_str": "12:05:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260702/c677893136.shtml"}, {"id": "4640983", "title": "港股午评：恒生指数涨1.19%，恒生科技指数涨0.62%", "content": "港股午间收盘，恒生指数涨1.19%，恒生科技指数涨0.62%。恒指港股通ETF银华（159318）涨1.52%，港股通科技ETF鹏华（159751）涨0.6%。板块方面，医疗保健技术、资本市场板块涨幅靠前；半导体产品与设备、工业集团企业板块跌幅靠前。个股方面，金力永磁涨14.67%，中国黄金国际涨14.37%，新意网集团涨12.64%，映恩生物-B涨12.58%，森松国际涨12.39%；驭势科技跌26.72%，今海医疗科技跌23.2%，剑桥科技跌19.02%，广合科技跌18.71%，白鸽在线跌17.87%。", "ctime": 1782964871, "time_str": "12:01:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260702/c677893079.shtml"}, {"id": "4640973", "title": "韩国交易所启动KOSDAQ临时停牌机制，暂停程序化卖出交易", "content": "韩国交易所启动KOSDAQ临时停牌机制，暂停程序化卖出交易。（财联社）", "ctime": 1782964681, "time_str": "11:58:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260702/c677893018.shtml"}, {"id": "4640965", "title": "马斯克：Optimus机器人量产初期进展将十分缓慢，因所有技术均为全新开发", "content": "当地时间7月1日，特斯拉CEO埃隆·马斯克在社交平台发布了一张自己在美国加州弗里蒙特工厂Optimus人形机器人生产线上的合影，引发外界对Optimus量产进展的讨论。有用户表示，特斯拉近期减少Optimus公开演示，可能是因为量产进度已超出市场预期。对此，马斯克回应称：“不，Optimus的生产一开始会极其缓慢，因为一切都是全新的。这不像制造汽车。”（界面）", "ctime": 1782964484, "time_str": "11:54:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260702/c677892984.shtml"}, {"id": "4640959", "title": "现货黄金涨超1%", "content": "现货黄金涨超1%，现报4071.62美元/盎司。", "ctime": 1782964380, "time_str": "11:53:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260702/c677892960.shtml"}, {"id": "4640957", "title": "机构：2026年全年出货量预计将达到约2750万片 较2025年增长约24%", "content": "根据Counterpoint Research最新发布季度折叠屏显示面板出货量与技术报告，2026年全年折叠屏智能手机面板出货量预计将达到约2750万片，较2025年增长约24%。营收预计将达到约44亿美元，同比增长约48%。在经历2025年的温和调整后，折叠屏智能手机面板出货量将于2026年重回扩张周期。增长动力不仅来自出货量复苏，还将来自苹果和三星高端项目推动的平均售价（ASP）提升与产品结构优化。(财联社)", "ctime": 1782964173, "time_str": "11:49:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260702/c677892898.shtml"}, {"id": "4640955", "title": "马斯克发布大合照：特斯拉弗里蒙特工厂Optimus产线或已就绪", "content": "马斯克周三发布了一张大合照，并配文称，在弗里蒙特工厂参观Optimus机器人生产线。这一言论可能代表着特斯拉的人形机器人Optimus正进入关键的量产阶段。特斯拉弗里蒙特工厂一直是该公司在美国的先锋制造中心，曾经用于生产特斯拉旗舰车型Model S轿车和Model X SUV，如今已成为该公司人形机器人生产线的所在地。（财联社）", "ctime": 1782964032, "time_str": "11:47:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260702/c677892853.shtml"}, {"id": "4640953", "title": "“出口中国”英国专场活动在伦敦举行", "content": "由中国商务部和英国商业贸易部主办的“出口中国”英国专场活动1日在伦敦举行，中英两国政商界人士、40余家中方企业和100余家英国企业代表参加。中国商务部部长王文涛在致辞中表示，英国是中国在欧洲第三大贸易伙伴，中国是英国在亚洲最大的贸易伙伴，中英经贸领域合作不断深化，实现优势产业互补、市场要素互通。中方愿与英方一道，共同推动把中英合作“大有可为”的潜力转化为“大有作为”的实绩。他说，希望英方企业积极参加“出口中国”系列活动和第九届中国国际进口博览会，与中国企业深入对接、洽谈，持续拓展中英贸易合作领域，实现互利共赢，共创中英经贸合作新篇章。（新华社）", "ctime": 1782963993, "time_str": "11:46:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260702/c677892841.shtml"}, {"id": "4640947", "title": "AI版支付宝开放公测 上线72项办事技能", "content": "AI版支付宝“阿宝”今日完成新一轮产品迭代并正式开放公测，iOS、安卓用户可在应用商店或支付宝App搜索“阿宝”“蚂蚁阿宝”更新体验，无需邀请码。本次升级围绕生活服务垂域模型、服务生态、陪伴体系进行优化，并从海量民生服务里筛选72项高频办事技能作为公测入门清单。公测版强化了模糊口语、复合需求的识别精度，同时新增家政、购物、文旅等服务。（科创板日报）", "ctime": 1782963695, "time_str": "11:41:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260702/c677892710.shtml"}, {"id": "4640945", "title": "现货白银涨超2%", "content": "现货白银涨超2%，现报60.26美元/盎司。", "ctime": 1782963687, "time_str": "11:41:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260702/c677892708.shtml"}, {"id": "4640943", "title": "比亚迪股份高开高走涨超8%", "content": "比亚迪股份高开高走涨超8%，盘中一度涨近10%，A股比亚迪涨近5%。消息面上，比亚迪公布6月销量数据，单月整体销量突破40万大关，维持同比增长，主要由于海外销量创新高，达17.53万辆，同比增长94.73%，环比增长9.15%。", "ctime": 1782963531, "time_str": "11:38:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260702/c677892663.shtml"}, {"id": "4640915", "title": "A股午评：创业板指低开低走跌3.47% 贵金属、化工等传统行业逆市走强", "content": "截至午盘，上证指数跌0.9%，深证成指跌2.09%，创业板指跌3.47%，北证50涨2.79%。三市成交额22575亿元，较上一日缩量1778亿元。三市超3200家个股上涨。\n盘面上，板块题材上，贵金属、海南、稀土永磁板块涨幅居前；存储芯片、元件概念板块跌幅居前。\n贵金属板块走高，招金黄金、山金国际、赤峰黄金涨停，西部黄金、中金黄金、晓程科技、山东黄金、紫金矿业跟涨。海南自贸区概念逆势走高，海南海药4连板，海马汽车、欣龙控股、海南瑞泽涨停，新大洲A、海南矿业、中稀有色、双成药业、康芝药业跟涨。稀土永磁板块震荡走强，争光股份、东方锆业盘中创新高，赤峰黄金涨停，大地熊涨超10%，瑞晨环保、宁波韵升、奔朗新材、金力永磁、杭华股份跟涨。存储芯片板块持续走弱，北方华创触及跌停，中科飞测、微导纳米、珂玛科技、华海清科、神工股份跌超10%，深科技、赛腾股份、精测电子、江丰电子、利和兴跟跌。元件板块低开低走，东山精密触及跌停，三环集团、风华高科、四会富仕、法拉电子、一博科技跟跌。", "ctime": 1782963190, "time_str": "11:33:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260702/c677892352.shtml"}, {"id": "4640911", "title": "期货午评：贵金属领涨 铂涨超5% 能化系跌幅居前", "content": "期货午评：大宗商品涨跌不一，涨幅方面，铂涨超5%，钯、沪银涨超2%；跌幅方面，原油跌近6%，LPG、对二甲苯跌超4%。", "ctime": 1782963170, "time_str": "11:32:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260702/c677892336.shtml"}, {"id": "4640905", "title": "ETF两市成交额报3568.56亿元，较昨日此时放量710.96亿元", "content": "截至目前，ETF两市成交额报3568.56亿元，较昨日此时放量710.96亿元，分类型来看，股票型ETF成交额1375.24亿元，债券型ETF成交额1421.23亿元，货币型ETF成交额111.72亿元，商品型ETF成交额49.24亿元，QDII型ETF成交额611.13亿元。", "ctime": 1782963130, "time_str": "11:32:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260702/c677892300.shtml"}, {"id": "4640901", "title": "ETF午评：黄金股ETF领涨6.03%，半导体设备ETF领跌6.79%", "content": "ETF午间收盘涨跌不一，黄金股ETF（517400）领涨6.03%，黄金股ETF（517520）涨5.50%，黄金股ETF（159562）涨5.47%，半导体设备ETF（159327）领跌6.79%，科创半导体设备ETF（589020）跌6.76%，半导体设备ETF（562590）跌6.71%。", "ctime": 1782963110, "time_str": "11:31:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260702/c677892286.shtml"}, {"id": "4640899", "title": "股指期货早盘收盘 主力合约全线下跌", "content": "股指期货早盘收盘，主力合约全线下跌。沪深300股指期货(IF)主力合约跌1.29%，上证50股指期货(IH)主力合约跌1.46%，中证500股指期货(IC)主力合约跌1.05%，中证1000股指期货(IM)主力合约跌0.16%。", "ctime": 1782963071, "time_str": "11:31:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260702/c677892284.shtml"}, {"id": "4640895", "title": "厦门钨业子公司停产，洛阳钼业回应暂停供应尾矿", "content": "7月1日晚间，厦门钨业子公司洛阳豫鹭矿业因上游合作方洛阳钼业暂停供应尾矿，目前已基本停产。洛阳钼业回应称，鉴于国家对钨矿的合规管理要求，洛阳豫鹭股东方尚未就处理方案达成一致，为确保生产运营合规，公司采取了暂停供应尾矿的措施。业内人士分析称，钨属于国家战略金属，历来采用配额制管理，叠加此前的出口管制，尾矿资源属性正被重新认定。洛阳钼业把含钨尾矿供给洛阳豫鹭，有可能触碰钨矿配额指标、资源流向或矿权合规问题。（第一财经）", "ctime": 1782963029, "time_str": "11:30:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260702/c677892278.shtml"}, {"id": "4640889", "title": "中国供应链助力欧洲应对热浪，空调需求激增", "content": "近日，德国、法国等欧洲国家遭遇高温热浪，空调需求骤增。中国家电品牌在欧洲市场大受欢迎，京东旗下Joybuy平台空调销量激增40倍。小米旗舰店客流量和销售额显著增长，电风扇需求急剧上升。中国企业通过完善服务体系，解决欧洲消费者安装空调的难题。美的PortaSplit空调因无需复杂安装在欧洲市场热销。中欧班列和Joybuy的本地仓储网络为欧洲市场提供稳定供应。（新华社）", "ctime": 1782962836, "time_str": "11:27:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260702/c677892149.shtml"}, {"id": "4640849", "title": "京东方A午前探底回升涨超4% 早盘一度触及跌停", "content": "京东方A午前探底回升涨超4%，早盘一度触及跌停。", "ctime": 1782962443, "time_str": "11:20:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260702/c677892022.shtml"}, {"id": "4640843", "title": "乌称基辅遭袭已致3死25伤", "content": "当地时间2日，乌克兰基辅军政管理局负责人特卡琴科称，当天凌晨对基辅的袭击已造成3人死亡，25人受伤。2日凌晨，乌克兰首都基辅市响起密集强烈爆炸声。基辅市市长克利奇科表示，俄军对基辅市发动导弹袭击。俄方对此暂无回应。（央视新闻）", "ctime": 1782962325, "time_str": "11:18:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260702/c677891997.shtml"}, {"id": "4640835", "title": "中国气象局：7月有2～3个台风登陆或影响我国沿海地区", "content": "中国气象局今天举行新闻发布会，对我国7月气候趋势进行预测分析。从降水方面来看，内蒙古东部、东北地区、华北大部、华中中南部、华东中部、华南、西南地区南部、新疆西南部、西藏西北部和东南部等地降水较常年同期偏多，全国其余地区降水接近常年同期到偏少。气温方面，内蒙古东部、东北地区西北部、华南西南部、西南地区南部气温较常年同期偏低，全国其余大部地区气温偏高，其中内蒙古西部、西北地区北部、新疆东北部偏高1～2℃。台风方面，西北太平洋和南海海域有4～6个台风生成，较常年同期（3.8个）偏多；有2～3个登陆或影响我国沿海地区，较常年同期（1.8个）偏多；强度总体偏强，存在较强台风北上影响我国北方地区的风险。（央视新闻）", "ctime": 1782962176, "time_str": "11:16:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260702/c677891925.shtml"}, {"id": "4640805", "title": "大量濒危鸟类种群稳中有升 我国鸟类保护取得显著成效", "content": "国家林草局今天发布的最新数据显示，目前我国已明确1140处候鸟迁飞通道重要栖息地，不断完善鸟类保护监测网络，大量濒危鸟类种群稳中有升，19种国家重点保护鸟类种群呈稳定或增长态势。各地集群鸟类种类、数量明显增加，鸟类保护措施取得显著成效。（央视新闻）", "ctime": 1782961676, "time_str": "11:07:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260702/c677891788.shtml"}, {"id": "4640797", "title": "5月末国开行农业基础设施贷款发放同比增长57%", "content": "记者今天（2日）从国家开发银行了解到，今年以来，国开行积极探索推广金融支农创新模式，截至5月末，全行农业基础设施贷款发放同比增长57%，助力农业生产良好开局。国开行表示，下一步，将紧扣《加快农业农村现代化“十五五”规划》要求，立足职能定位，优化资源配置，持续加大对现代设施农业、农田建设、种业振兴、农垦发展等重点领域中长期融资支持，因地制宜服务重要农产品稳产保供，助力提升农业综合生产能力和质量效益，为服务乡村全面振兴、建设农业强国作出新的更大贡献。（央视新闻）", "ctime": 1782961600, "time_str": "11:06:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260702/c677891766.shtml"}, {"id": "4640795", "title": "赖清德称“中国将农产品武器化” 国台办回应", "content": "7月2日，国务院台办举行例行新闻发布会。有记者问，赖清德近日称，“中国将农产品武器化，企图以农逼政，包括借题禁止输入、提高关税，台湾农产品外销中国占比已从2015年的20.5%降到2025年的11.5%；美国和日本已成为台湾农产品的前两大出口市场”。请问对此有何评论？发言人朱凤莲答问表示，大陆一直是台湾农产品的重要出口地，我们秉持“两岸一家亲”理念，尽最大努力为台湾同胞办实事、做好事、解难事，采取一系列措施帮助台湾的农渔民朋友拓展大陆市场，为台湾农渔产品找出路、拓销路、增收益，让越来越多的台湾农民享受到中国式现代化发展红利，过上更美好的生活。她表示，民进党当局不仅长期单方面限制大陆农产品输入台湾，包括超过千余项农产品，阻挠两岸正常的经贸往来和交流合作，扬言惩处积极推动台湾农渔产品输入大陆的县市长和相关的农渔协会，还跪美输诚，出卖台湾核心产业，对美国4885项工业产品以及1482项的农产品实施“零关税”，严重损害台湾相关产业利益和民众福祉。她表示，谁真心实意为民众谋利，谁专横跋扈挡民众获利，台湾农渔民心中有明明白白的一笔账。台湾基层业者忧心忡忡，对民进党当局不仅不帮助农渔民解决实际问题，还极力阻挠两岸交流合作、妄想靠“献祭”岛内产业和民众生计来讨外人欢心，有极大的愤慨。奉劝民进党当局停止政治操弄，多做有利于台湾民众利益福祉的事情。(央视新闻)", "ctime": 1782961563, "time_str": "11:06:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260702/c677891749.shtml"}, {"id": "4640785", "title": "半导体设备持续走弱 北方华创逼近跌停", "content": "半导体设备持续走弱，富创精密、中科飞测跌超10%，北方华创逼近跌停，华海清科、微导纳米、华峰测控、京仪装备跟跌。", "ctime": 1782961474, "time_str": "11:04:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260702/c677891719.shtml"}, {"id": "4640783", "title": "今年第9号台风“巴威”已生成", "content": "中央气象台预报显示，今年第9号台风“巴威”目前位于关岛塞班东偏南方向约1620公里的洋面上，中心附近最大风力达8级，其将以每小时20公里左右的速度向西偏北方向移动，强度逐渐增强。（央视新闻）", "ctime": 1782961448, "time_str": "11:04:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260702/c677891712.shtml"}, {"id": "4640781", "title": "四川甘孜州康定市发生2.8级地震震源深度7千米", "content": "中国地震台网正式测定：7月2日10时38分在四川甘孜州康定市（北纬29.91度，东经101.95度）发生2.8级地震，震源深度7千米。(央视新闻)", "ctime": 1782961330, "time_str": "11:02:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260702/c677891671.shtml"}, {"id": "4640779", "title": "记者直击基辅遭空袭：爆炸声持续 至少5人受伤", "content": "乌克兰基辅市市长克利奇科7月2日凌晨在社交媒体发文称，俄军对基辅市发动导弹和无人机袭击，初步信息显示，空袭已造成至少5人受伤。克利奇科称，基辅舍甫琴科夫斯基区一处宾馆和戈洛谢耶夫斯基区的一栋居民楼遭到袭击并起火。截至凌晨2时35分，新华社记者在基辅市仍能听到爆炸声和防空系统开火声。（新华社）", "ctime": 1782961315, "time_str": "11:01:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260702/c677891666.shtml"}, {"id": "4640761", "title": "沪深京三市成交额超2万亿元，较上日此时缩量1341亿元", "content": "据同花顺iFinD数据，沪深京三市成交额超2万亿元，较上日此时缩量1341亿元，预计全天成交金额约3.4万亿元。截至目前，沪市成交额9030亿元，深市成交额10847亿元，北证50成交额134亿元。", "ctime": 1782961020, "time_str": "10:57:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260702/c677891566.shtml"}, {"id": "4640757", "title": "南向资金净买入超30亿港元", "content": "据同花顺iFinD数据，截至目前，南向资金净买入超30亿港元，其中港股通（沪）买入超22.69亿港元，港股通（深）买入超7.87亿港元。", "ctime": 1782960996, "time_str": "10:56:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260702/c677891557.shtml"}, {"id": "4640755", "title": "广期所铂主力合约大涨5%", "content": "广期所铂主力合约大涨5%，报401.2元/克。", "ctime": 1782960987, "time_str": "10:56:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260702/c677891555.shtml"}, {"id": "4640737", "title": "海军舰艇编队抵达香港", "content": "7月2日清晨，中国海军南宁舰、衡阳舰抵达香港水域。这是舰艇编队在香港特区政府船队、驻香港部队舰艇伴航下驶入维多利亚港。在香港回归祖国29周年之际，由中国人民解放军海军导弹驱逐舰南宁舰、导弹护卫舰衡阳舰组成的海军舰艇编队，携舰载直升机、陆战队员，于7月2日上午抵达香港特别行政区，开启为期5天的系列开放参观和文化交流活动。香港特别行政区政府在昂船洲军营为舰艇编队举行欢迎仪式。（新华社）", "ctime": 1782960733, "time_str": "10:52:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260702/c677891441.shtml"}, {"id": "4640735", "title": "国台办：赖清德当局背离民意 不得人心", "content": "7月2日，国务院台办举行例行新闻发布会，有记者问：台湾媒体日前公布最新民调，47.6%的民众不满意赖清德施政，较5月增加2.7个百分点。岛内有舆论也批评赖清德当局上台以来毫无具体政绩，反而不断制造内耗、对立与社会撕裂。请问对此有何评论？发言人朱凤莲表示，相关民调及岛内的舆论表明，赖清德当局只顾政治私利，漠视民生福祉，背离民意，不得人心。（央视新闻）", "ctime": 1782960729, "time_str": "10:52:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260702/c677891440.shtml"}, {"id": "4640721", "title": "国台办：民进党只有废弃“台独党纲” 才能真正改善两岸关系", "content": "7月2日，国务院台办举行例行新闻发布会，有记者问：近日，岛内舆论指出，在美中双方都在努力建立沟通、降低风险的背景下，民进党当局必须正视，台海和平需要政治互信，其“台独党纲”问题不再只是民进党的党内议题，更是影响两岸政治互信、和平交流及台海稳定的重要因素。请问对此有何评论?\n\n发言人朱凤 const META     = {"update_time": "2026-07-02 13:13:15", "sentiment_score": 55.472636815920396, "agents": []};

// 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
