.score-bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s; }

const NEWS     = [{"id": "4419783", "title": "国务院印发《城市更新“十五五”规划》", "content": "国务院日前印发《城市更新“十五五”规划》（以下简称《规划》），明确了“十五五”时期城市更新工作的目标指标、重点任务、重大工程和政策举措。(新华社)", "ctime": 1779966060, "time_str": "19:01:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260528/c677051928.shtml"}, {"id": "4419773", "title": "欧盟能源总司：若未来几周情况未好转 供应将更加紧张", "content": "当地时间28日，欧盟能源总司发布声明称，霍尔木兹海峡的关闭对原油和所有主要石油产品都造成了影响，所有欧盟国家都受到了影响。如果未来几周情况没有好转，预计市场供应将变得越来越紧张，尤其是航空燃油市场。声明称，此前，欧盟委员会天然气协调小组与欧盟国家于5月26日举行了会谈，石油协调小组也于5月25日举行了会议，讨论鉴于中东持续紧张局势，欧盟天然气和石油供应的安全问题。天然气协调小组表示，到夏季结束时，欧盟天然气储存水平可能达到80%，这将确保2026到2027年冬季的天然气供应。该组织重申，需要根据实际情况定期评估天然气储存设施的填充情况。声明还指出，欧盟成员国迄今为止尚未计划采取任何额外的市场干预措施。石油协调小组表示，霍尔木兹海峡的关闭对原油和所有主要石油产品都造成了影响，所有欧盟国家都受到了影响。声明强调：“到目前为止，欧盟已经感受到价格波动的影响，但消费者层面的实际供应尚未出现中断。然而，如果未来几周情况没有好转，预计市场供应将变得越来越紧张，尤其是航空燃油市场”。（央视新闻）", "ctime": 1779966025, "time_str": "19:00:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260528/c677051906.shtml"}, {"id": "4419743", "title": "哈马斯：以色列加大军事行动令停火协议“面临崩溃”", "content": "巴勒斯坦伊斯兰抵抗运动（哈马斯）28日发表声明说，由于以方不断加大在加沙地带的军事行动，加沙地带第一阶段停火协议正“面临崩溃”。 声明说，以色列27日晚对加沙市中心一栋居民楼发动猛烈空袭，造成包括两名儿童和两名妇女在内的10人死亡，另有数十人受伤。由于以方不断升级对加沙地带的袭击，仅过去48小时就造成20多人死亡。 声明表示，这表明以方意图恢复对加沙的种族灭绝战争，对其承诺以及对协议担保国付出的努力视若无睹。 声明呼吁美国和协议担保国履行其职责、谴责以方违约行为，并采取切实有效的措施，迫使以方遵守协议条款。 连日来，以军加大对加沙地带的空袭行动，并在袭击中打死哈马斯军事领导人。加沙地带卫生部门最新报告显示，自2025年10月10日停火协议生效以来，已有900多名巴勒斯坦人在以方军事行动中死亡、2000多人受伤。(新华社)", "ctime": 1779965999, "time_str": "18:59:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260528/c677051843.shtml"}, {"id": "4419741", "title": "禾盛新材：拟募集资金不超过1.9亿元，拟全部用于国产智能算力中心建设项目等", "content": "禾盛新材公告，公司拟向特定对象发行股票募集资金不超过1.9亿元，扣除发行费用后拟全部用于国产智能算力中心建设项目及补充流动资金。本次发行股票数量按照募集资金总额除以发行价确定，不超过本次发行前公司总股本的30%。", "ctime": 1779965978, "time_str": "18:59:38", "stock_code": "", "stock_name": "", "stock_market": "", "i 量标准，实现AI技术性能“可测量、可比较、可追溯”。（央视新闻）", "ctime": 1779964247, "time_str": "18:30:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260528/c677051058.shtml"}, {"id": "4419555", "title": "创识科技：控股股东张更生被解除留置变更为责令候查", "content": "创识科技公告，公司控股股东、实际控制人张更生先生被解除留置措施，变更为责令候查措施。此前，张更生先生因涉嫌违法被采取留置措施。公司于2025年12月22日披露了相关公告。", "ctime": 1779964246, "time_str": "18:30:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260528/c677051057.shtml"}, {"id": "4419539", "title": "河南：“十五五”时期将在融入服务全国统一大市场进程中发挥更大作用", "content": "记者从河南省政府新闻办举行的“开局起步‘十五五’专题新闻发布会”上获悉，“十五五”时期，河南将破卡点、建枢纽、成支点，在纵深推进融入服务全国统一大市场进程中发挥更大作用。河南省委、省政府连续两年召开“新春第一会”进行部署安排，在融入服务全国统一大市场建设上取得积极效果。（新华社）", "ctime": 1779964123, "time_str": "18:28:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260528/c677050913.shtml"}, {"id": "4419533", "title": "瑞晨环保：股东虎鼎致新拟减持不超过3%", "content": "瑞晨环保公告，持股6.56%股东宁波虎鼎致新创业投资合伙企业（有限合伙）拟自公告披露起15个交易日后3个月内，以集中竞价或大宗交易方式减持不超214.9万股，占公司总股本3%；90个自然日内集中竞价减持不超公司股份总数1%，大宗交易减持不超2%，减持价格将按届时二级市场价格确定。", "ctime": 1779964074, "time_str": "18:27:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260528/c677050896.shtml"}, {"id": "4419531", "title": "广东省副省长李运：全力支持深交所建设世界一流交易所", "content": "在今天召开的深交所2026全球投资者大会上，广东省副省长李运提到，截至目前，广东境内外上市企业达1242家，境内上市公司895家，其中深交所汇聚广东A股上市公司683家，占全省境内上市总量的76%。2025年，广东在深交所实现新增上市公司、IPO申报企业、上市辅导企业、并购重组交易金额、再融资规模、债券融资规模六个全国第一。他表示，立足新起点，广东将牢牢把握资本市场改革机遇，全力支持深交所建设世界一流交易所，持续推动湾区资本市场开放合作走深走实。（蓝鲸新闻）", "ctime": 1779964008, "time_str": "18:26:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260528/c677050863.shtml"}, {"id": "4419529", "title": "晨光股份：拟以5亿元-10亿元回购公司股份", "content": "晨光股份公告，拟以5亿元-10亿元回购公司股份，回购价格不超过35元/股。", "ctime": 1779963998, "time_str": "18:26:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260528/c677050861.shtml"}, {"id": "4419521", "title": "立昂微：三名高管拟分别减持0.08%、0.02%、0.02%", "content": "立昂微公告，自本减持计划公告之日起15个交易日后的3个月内，副董事长陈平人控制的上海碧晶投资咨询有限公司、董事副总经理兼财务总监及董事会秘书吴能云、副总经理咸春雷拟通过集中竞价方式分别减持不超过60.77万股、16.79万股、15.21万股，分别占公司总股本的0.08%、0.02%、0.02%，均未超过其所持股份总数的25%。", "ctime": 1779963900, "time_str": "18:25:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260528/c677050837.shtml"}, {"id": "4419519", "title": "中国是全球保险品牌价值增长“核心驱动力”", "content": "总部位于英国伦敦的品牌估值机构品牌金融集团28日发布的《2026全球保险品牌价值100强》报告显示，13家中国保险品牌入围全球百强，中国是全球保险品牌价值增长的“核心驱动力”。 报告显示，中国平安连续十年蝉联全球最具价值保险品牌榜首，中国人寿、中国人保入围全球十强。依托市场规模、消费者需求、长期政策红利，中国成为全球保险品牌价值增长的重要来源。 报告还特别关注中外合资保险品牌，认为工银安盛人寿等品牌将国内大型银行集团的规模及渠道优势与国际保险行业能力相结合，在中国不断变革的保险市场中发挥更大作用。\n 报告指出，从全球来看，2026年全球保险行业品牌价值实现五年最大增长，同比上涨14%，百强品牌总价值超过6070亿美元。 \n品牌金融集团调研发现，全球消费者对保险产品最核心的诉求包括值得信赖、性价比高、客户服务优质、便捷易合作、产品选择丰富等。 品牌金融集团中国区总裁陈忆登告诉记者：“中国保险市场巨大的内需潜力与企业出海战略的双重驱动，是品牌价值持续攀升的核心动力。随着中国持续推进金融高水平对外开放，中国保险品牌有望在全球市场中进一步拓展影响力，在服务中国企业出海、护航共建‘一带一路’合作等方面发挥更大作用。”(新华社)", "ctime": 1779963842, "time_str": "18:24:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260528/c677050820.shtml"}, {"id": "4419489", "title": "国家体育总局办公厅 工业和信息化部办公厅关于征集2026年度智能体育典型案例的通知", "content": "为深入贯彻落实党中央、国务院关于大力提振消费的决策部署，加快推进体育产业高质量发展，提升体育产品和服务数字化、智能化水平。现组织开展2026年度智能体育典型案例征集工作，并对其中具有代表性的案例进行展示和宣传。(工信部)", "ctime": 1779963497, "time_str": "18:18:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260528/c677050618.shtml"}, {"id": "4419487", "title": "海和药物科创板IPO审核获受理", "content": "上海海和药物研究开发股份有限公司科创板IPO审核状态变更为“已受理”，公司拟融资金额29 亿元。", "ctime": 1779963460, "time_str": "18:17:40", "stock // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
