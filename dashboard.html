ka.com.cn/20261124/c682167028.shtml"}, {"id": "5747411", "title": "我国牵头推动全球首个生成式人工智能治理国际标准提案", "content": "记者11月24日从市场监管总局举行的新闻发布会上获悉，针对生成式人工智能深度伪造、模型“投毒”等全球共性风险，我国已联合多国共同编制《信息技术 人工智能 生成式人工智能系统风险应对指南》国际标准，这是全球首个针对生成式人工智能治理的国际标准提案，可为推动形成全球风险管理共识提供重要支撑。(新华社)", "ctime": 1795518754, "time_str": "19:12:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261124/c682167019.shtml"}, {"id": "5747393", "title": "Anthropic盘前价格跌破发行价", "content": "Anthropic周二盘前价格跌破发行价，报82.7美元/股，盘前跌幅5.6%。Anthropic于上周四在纳斯达克上市，当天一度冲高至115美元，收报97.17美元，较83美元的发行价上涨17.1%；上周五和本周一则分别收跌8.5%和1.43%。", "ctime": 1795518670, "time_str": "19:11:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261124/c682166990.shtml"}, {"id": "5747357", "title": "中欧班列“东通道”绥芬河口岸通行量突破5000列", "content": "记者从中国铁路哈尔滨局集团有限公司获悉，截至11月24日，经黑龙江省绥芬河口岸站通行的中欧班列已累计突破5000列。（新华社）", "ctime": 1795518552, "time_str": "19:09:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261124/c682166910.shtml"}, {"id": "5747355", "title": "智元灵心平台一年孵化超3万个机器人智能体", "content": "11月24日，智元发布旗下灵心（LinkSoul）机器人智能体开发应用平台成果，上线一年来，智元灵心平台（LinkSoul）持续完善机器人智能体开发与应用能力，累计吸引超2万用户，孵化超3万机器人智能体。据了解，灵心平台主要为开发者、企业及行业用户，提供智能体创建、知识与技能配置、任务编排、调试和应用连接等能力。(券中社)", "ctime": 1795518529, "time_str": "19:08:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261124/c682166872.shtml"}, {"id": "5747351", "title": "铁路12306App新增候补兑现等信息提醒", "content": "记者24日从中国铁路12306技术中心了解到，铁路部门日前在铁路12306App系统通知中新增候补兑现情况、列车运行调整等信息提醒。旅客可在App内查看候补兑现结果，以及列车停运、折返、恢复开行、席位调整等信息。(新华社)", "ctime": 1795518508, "time_str": "19:08:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261124/c682166785.shtml"}, {"id": "5747295", "title": "西部数据美股盘前跌超5%", "content": "西部数据美股盘前跌超5%，现报282.12美元。", "ctime": 1795518302, "time_str": "19:05:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261124/c682166605.shtml"}, {"id": "5747275", "title": "科安达：拟以6000万元-1亿元回购公司股份", "content": "科安达公告，公司董事会审议通过回购方案，拟以自有资金及/或自筹资金（含回购专项贷款），通过集中竞价方式回购公司A股，资金总额不低于6000万元且不超过1亿元，回购价格不超过18.49元/股，实施期限为董事会审议通过之日起3个月。回购股份用于维护公司价值及股东权益，将在披露回购结果暨股份变动公告12个月后择机出售，并在公告后三年内完成出售；未能按期出售的股份将履行相关程序予以注销。回购方案存在无法实施或只能部分实施等风险。", "ctime": 1795518256, "time_str": "19:04:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261124/c682166592.shtml"}, {"id": "5747227", "title": "10月全国查处违反中央八项规定精神问题28934起", "content": "11月24日，中央纪委国家监委公布了2026年10月全国查处违反中央八项规定精神问题汇总情况。当月，全国共查处违反中央八项规定精神问题28934起，批评教育和处理35193人，其中党纪政务处分23996人，这是连续第158个月公布月报数据。（央视新闻）", "ctime": 1795518146, "time_str": "19:02:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261124/c682166496.shtml"}, {"id": "5747201", "title": "兄弟科技：拟300万元出售博迈科100%股权并豁免3161.85万元债务", "content": "兄弟科技公告，公司二级全资子公司博润医药与瑞峰医药签署《股权转让协议》，以300万元出售三级全资子公司博迈科100%股权，交易完成后博迈科不再纳入合并报表范围。同时，公司同意豁免博迈科对兄弟药业借款本金及利息合计3161.85万元，债务豁免与股权转让为一揽子交易。截至2026年10月31日，博迈科净资产为-2727.45万元，考虑债务豁免后模拟测算净资产为434.4万元。本次交易不构成关联交易及重大资产重组，无需提交股东会审议。", "ctime": 1795518094, "time_str": "19:01:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261124/c682166458.shtml"}, {"id": "5747195", "title": "伊朗军队总司令：将进一步收紧霍尔木兹海峡封锁", "content": "据伊朗伊斯兰共和国广播电视台24日报道，伊朗伊斯兰共和国军队总司令哈塔米当天表示，在伊朗提出的七项条件得到落实之前，伊方不仅不会开放霍尔木兹海峡，还将进一步收紧对海峡的封锁。哈塔米当天在伊朗伊斯兰共和国军队指挥和参谋大学发表讲话时说，霍尔木兹海峡对伊朗具有地缘政治意义，也是伊朗国家力量体系的重要一环。他向伊朗海军司令沙赫拉姆·伊拉尼下达指令，要求“逐日收紧对霍尔木兹海峡的封锁”，加强对海峡的管控，“使敌方面临更加艰难的处境”。哈塔米说，“伊朗不会独自承受战争之苦，任何帮助敌方、与敌方站在一起的人都必须承受战争之苦”，伊方将采取行动。另据伊朗海军同日发表的声明，两艘油轮24日凌晨关闭导航系统后进入霍尔木兹海峡东部禁行区域，触雷起火并停止航行。海军声明强调，在伊朗的目标和诉求实现之前，霍尔木兹海峡绝不会开放。油轮所有者必须与伊朗武装部队协调，以确保在海峡安全通行。(新华社)", "ctime": 1795518087, "time_str": "19:01:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261124/c682166454.shtml"}, {"id": "5747117", "title": "小米集团卢伟冰：未来具身机器人产业规模可能会大于汽车", "content": "11月24日晚间，小米集团发布了2026年第三季度业绩报告。同日晚间的电话财报会上，小米集团总裁卢伟冰称，在小米看来，具身智能，尤其是具身机器人，未来的产业规模可能会大于汽车产业。小米在这方面会坚持投入，主要聚焦于三点：本体、数据、模型。（每日经济新闻）", "ctime": 1795517986, "time_str": "18:59:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261124/c682166421.shtml"}, {"id": "5747109", "title": "华立股份：拟以5000万元-1亿元回购公司股份", "content": "华立股份公告，拟以5000万元-1亿元回购公司股份，回购价格不超过19.43元/股。回购股份的用途为用于员工股权激励。回购股份方式为集中竞价交易方式，回购期限为自公司董事会审议通过回购股份方案之日起12个月内。按回购价格上限19.43元/股测算，预计回购股份数量约为257.33万股至514.65万股，约占公司总股本的比例为0.96%至1.92%。回购资金来源为公司自有资金及/或自筹资金。", "ctime": 1795517981, "time_str": "18:59:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261124/c682166419.shtml"}, {"id": "5747083", "title": "*ST英飞：公司及子公司涉诉被索赔1.75亿元", "content": "*ST英飞公告，公司及全资子公司思望通讯于2026年11月23日收到广东省珠海市中级人民法院送达的《应诉通知书》《民事起诉状》，珠海安联锐视科技股份有限公司以侵权责任纠纷为由对公司、思望通讯等提起诉讼，法院于2026年9月24日立案，案件尚未开庭审理。原告诉请判令思望通讯偿还货款2077.58万美元（按汇率1：7.17折算为148962790.30元）及资金占用利息暂计2652.45万元，以上金额共计1.75亿元，并判令其他被告及公司承担连带责任。", "ctime": 1795517781, "time_str": "18:56:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261124/c682166362.shtml"}, {"id": "5747079", "title": "大北农：44000股限制性股票回购注销完成，总股本变更为42.8亿股", "content": "大北农公告，公司本次回购注销限制性股票44000股，占本次回购注销前总股本的0.001%，回购价格为 3.3173元/股，涉及激励对象2人，应支付回购款14.6万元，资金来源为自有资金。经中国证券登记结算有限责任公司深圳分公司审核确认，本次回购注销事项已于2026年11月24日办理完成。上述股份注销完成后，公司总股本由42.8亿股变更为42.8亿股。", "ctime": 1795517777, "time_str": "18:56:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261124/c682166361.shtml"}, {"id": "5747077", "title": "真爱美家：拟以5000万元-1亿元回购公司股份", "content": "真爱美家公告，拟以不低于人民币5000万元且不超过人民币1亿元回购公司股份，回购价格不超过49元/股。回购股份用于维护公司价值及股东权益，可在披露回购结果暨股份变动公告十二个月后采用集中竞价交易方式出售，并在披露回购结果暨股份变动公告后三年内完成出售，未实施出售部分将履行相关程序予以注销。按回购金额上、下限及价格上限49元/股测算，预计回购股份约102.04万股—204.08万股，占目前公司总股本的0.71%—1.42%。回购期限自董事会审议通过之日起不超过三个月，资金来源为自有资金或自筹资金。", "ctime": 1795517773, "time_str": "18:56:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261124/c682166359.shtml"}, {"id": "5747075", "title": "中鼎股份：实控人、董事长、总经理夏迎松提议回购公司股份，资金总额1亿元-2亿元", "content": "中鼎股份公告，公司董事会近日收到实际控制人、董事长、总经理夏迎松出具的提议回购公司股份的函。夏迎松提议公司使用自有资金或自筹资金以集中竞价交易方式回购公司已发行的部分人民币普通股（A股）股票，回购资金总额不低于人民币1亿元（含）且不超过人民币2亿元（含），回购股份用途为实施股权激励或员工持股计划，回购价格上限不高于公司董事会审议通过回购股份方案决议前30个交易日公司股票交易均价的150%。夏迎松承诺将积极推动公司尽快召开董事会或股东会审议回购股份事项，并对回购股份议案投赞成票。", "ctime": 1795517767, "time_str": "18:56:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261124/c682166356.shtml"}, {"id": "5747059", "title": "小米卢伟冰：小米汽车“双线布局”没有形成内部客户抢夺，明年要出海欧洲", "content": "在11月24日晚间的业绩会上，小米集团合伙人、集团总裁卢伟冰表示，第三季度国内汽车市场大盘承压，对于小米来说，完成了纯电和增程双线布局，且增程新品上市后反而带来了纯电产品销量的增长，没有形成内部客户抢夺。小米汽车会用创新满足用户需求。他同时透露，明年小米汽车将出海欧洲，或首先在德国落地。（人民财讯）", "ctime": 1795517645, "time_str": "18:54:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261124/c682166165.shtml"}, {"id": "5747049", "title": "英伟达美股盘前跌超6%", "content": "英伟达美股盘前跌超6%，现报155.12美元。", "ctime": 1795517558, "time_str": "18:52:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261124/c682165894.shtml"}, {"id": "5747045", "title": "同星科技：公司目前经营情况正常", "content": "同星科技公告，公司股票于2026年11月23日、2026年11月24日连续两个交易日收盘价格涨幅偏离值累计超过30%，根据《深圳证券交易所交易规则》的有关规定，属于股票异常波动情形。经公司董事会核实，公司前期所披露的信息不存在需要更正、补充之处；未发现近期公共传媒报道了可能或已经对公司股票交易价格产生较大影响的未公开重大信息；公司目前经营情况正常，内外部经营环境未发生重大变化；公司、控股股东及实际控制人不存在应披露而未披露的重大事项或处于筹划阶段的重大事项；控股股东及实际控制人在股票异常波动期间不存在买卖公司股票的情形。", "ctime": 1795517509, "time_str": "18:51:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261124/c682165882.shtml"}, {"id": "5747041", "title": "SK海力士美股盘前跌超6%", "content": "SK海力士美股盘前跌超6%，现报116.82美元。", "ctime": 1795517457, "time_str": "18:50:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261124/c682165715.shtml"}, {"id": "5747039", "title": "永和股份：控股股东、实际控制人兼董事长童建国增持72.38万股", "content": "永和股份公告，控股股东、实际控制人兼董事长童建国基于对公司未来发展前景的信心和对公司长期投资价值的认可，于2026年11月23日至2026年11月24日以自有资金通过集中竞价交易方式合计增持公司股份72.38万股，占公司总股本的0.14%，增持金额为1867.06万元（不含交易费用）。本次增持前，童建国持股1.86亿股，占总股本36.50%；增持完成后，其与一致行动人合计持股2.17亿股，占总股本42.53%。本次增持不触及权益变动，未导致股东身份及公司控股股东、实际控制人发生变化。", "ctime": 1795517409, "time_str": "18:50:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261124/c682165536.shtml"}, {"id": "5747035", "title": "英诺特：拟以5000万元-1亿元回购公司股份", "content": "英诺特公告，拟以不低于人民币5000万元（含）、不超过人民币1亿元（含）回购公司股份，回购价格不超过人民币72元/股（含），回购股份方式为集中竞价交易方式，回购期限为自董事会审议通过本次回购方案之日起12个月内。回购股份拟在未来适宜时机用于公司股权激励及/或员工持股计划，并在股份回购实施结果暨股份变动公告日后3年内予以转让；若未能在3年内转让完毕，尚未转让的回购股份将予以注销。按回购价格上限测算，预计回购股份数量约为69.44万股至138.89万股，约占公司目前总股本的比例为0.5033%至1.0067%。", "ctime": 1795517403, "time_str": "18:50:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261124/c682165534.shtml"}, {"id": "5747033", "title": "安乃达：宁波思辉拟以21.56元/股向盛晓兰协议转让5.1542%股份", "content": "安乃达公告，公司股东宁波思辉创业投资合伙企业（有限合伙）拟将其持有的600万股公司股份（占公司总股本的5.1542%）协议转让给公司董事、副总经理盛晓兰女士，转让价格为21.56元/股，协议转让对价1.29亿元。盛晓兰女士为宁波思辉的执行事业合伙人，转让双方为一致行动关系，本次协议转让不涉及对外股份减持。本次权益变动后，宁波思辉持股比例降至3.4361%，盛晓兰持股比例升至5.1671%。受让方 }, {"id": "5746941", "title": "德石股份：部分董事及高管首次增持公司股份88000股，增持金额90.62万元", "content": "德石股份公告，公司董事长程贵华、董事兼总经理孙宝生等7名董事及高级管理人员计划自2026年11月24日起6个月内，以集中竞价方式增持公司股票，增持金额合计不低于200万元且不超过300万元。2026年11月24日，上述增持主体首次实施增持计划，合计增持公司股票88000股，成交金额合计90.62万元（不含交易费用）。本次增持后，增持主体合计持股由325.42万股增至334.22万股，持股比例由1.6687%增至1.7138%。", "ctime": 1795516890, "time_str": "18:41:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261124/c682165347.shtml"}, {"id": "5746921", "title": "小米集团卢伟冰：小米出海车型将去往瑞典、德国、西班牙、意大利四国", "content": "小米集团总裁卢伟冰在三季度财报电话会上表示，小米汽车计划2027年进军欧洲，目前已在德国设立研发设计中心，签约德国8家头部经销商。出海车型将去往瑞典、德国、西班牙、意大利四国，并在七大测试场完成高速与功能验证。（财联社）", "ctime": 1795516819, "time_str": "18:40:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261124/c682165327.shtml"}, {"id": "5746905", "title": "百利天恒：伦康依隆妥单抗小细胞肺癌III期临床期中分析达到主要终点", "content": "百利天恒公告，公司自主研发的EGFR×HER3双抗ADC“伦康依隆妥单抗”（iza-bren）用于既往含铂化疗及抗PD-1/PD-L1单抗治疗失败的复发性小细胞肺癌的III期临床试验（BL-B01D1-304），经独立数据监查委员会判断，在预设期中分析中同时达到总生存期主要终点和基于盲态独立中心评估的无进展生存期关键次要终点。这是该药第6个达到主要终点的III期临床研究，也是全球首个在小细胞肺癌治疗中达到主要终点的双抗ADC药物III期临床研究。", "ctime": 1795516673, "time_str": "18:37:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261124/c682165243.shtml"}, {"id": "5746899", "title": "奇安信与重庆高新区管委会签署战略合作协议", "content": "据奇安信集团消息，11月20日下午，以“芯屏器合·才聚未来”为主题的新一代电子信息制造业产业人才发展大会在重庆高新区举行。会上，奇安信科技集团股份有限公司（简称“奇安信”）与重庆高新技术产业开发区管理委员会正式签署合作协议。双方将在重庆高新区布局一体化安全运营中心（西南总部），构建“一个中心、一个平台、一支队伍”的网络安全服务体系。", "ctime": 1795516610, "time_str": "18:36:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261124/c682165226.shtml"}, {"id": "5746891", "title": "海洋王：AI+智慧照明相关业务收入规模有限", "content": "海洋王公告，公司股票于2026年11月20日、11月23日、11月24日连续3个交易日收盘价格涨幅偏离值累计超过20%，属于股票交易异常波动。公司称近期经营情况正常，内外部经营环境未发生重大变化，公司、控股股东及实际控 装置", "content": "印度尼西亚万丹省警方24日证实，该省一家糖果厂21日发生的火灾已造成26人死亡，另有8人失踪。另据当地媒体援引官员消息称，起火点可能是涉事建筑二楼的一台冷却装置。万丹省警察局官员24日对媒体表示，联合搜救队已找到26具遇难者遗体，目前仍在搜寻其余8名失踪工人。由于企业仍在核对事发当晚的实际到岗名单，相关人数仍在进一步核实中。目前，600多名救援人员正在被烧毁的三层建筑内持续开展搜救。据此前通报，火灾发生时厂内共有约300人。除大部分工人自行逃生外，救援人员共救出29人，其中5人正在住院治疗。万丹省搜救局表示，搜救队重点排查了工厂后部，但现场的瓦砾、浓烟以及时有复燃的火情增加了搜寻难度。搜救人员说，许多遇难者是在二楼通往安全楼梯的通道附近被发现的，由于楼梯距离起火点较近，随着火势蔓延，逃生变得异常艰难。印尼警方已对这起火灾展开刑事调查。(新华社)", "ctime": 1795516272, "time_str": "18:31:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261124/c682165070.shtml"}, {"id": "5746819", "title": "美光科技美股盘前跌超6%", "content": "美光科技美股盘前跌超6%，现报665.17美元。", "ctime": 1795516243, "time_str": "18:30:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261124/c682165064.shtml"}, {"id": "5746807", "title": "中国广核：持股5%以上股东恒健控股持股比例降至5.97%，被动跨越1%整数倍", "content": "中国广核公告，持股5%以上股东广东恒健投资控股有限公司因“24恒健EB”债券持有人累计换股3.84亿股及“广核转债”累计转股4.73亿股，持股比例由6.79%下降至5.97%，权益变动比例被动跨越1%的整数倍。本次权益变动时间为2024年10月28日至2026年11月23日，恒健控股持股数量由34.29亿股降至30.45亿股。", "ctime": 1795516223, "time_str": "18:30:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261124/c682165048.shtml"}, {"id": "5746801", "title": "第171次中老缅泰湄公河联合巡逻执法行动启动", "content": "11月23日，随着中方3艘执法艇从云南省西双版纳傣族自治州景哈警务码头鸣笛启航，第171次中老缅泰湄公河联合巡逻执法行动正式启动。中老缅泰四方指挥长一同登上中方53108艇随编队出发；参与行动的老挝、缅甸执法艇分别从老挝孟莫、缅甸万崩码头起航，各方先行开展分段巡航后将在预定水域集结会合，组成联合巡逻执法编队共同开展联合执法行动。本次行动在中方53108艇设编队指挥所，由中老缅泰四方指挥长率代表团共同指挥行动。此次行动采取全线联合巡逻执法、分段巡航、水陆联动模式，对湄公河重点航道、沿岸码头及支流渡口开展联合巡查管控，严厉打击毒品贩运、非法偷渡、跨境走私等各类违法犯罪，同步排查整治各类安全隐患，防范化解流域安全风险，全力保障沿岸各国群众、过往船舶及船员生命财产安全。（央视新闻）", "ctime": 1795516215, "time_str": "18:30:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261124/c682165047.shtml"}, {"id": "5746785", "title": "恒锋信息：拟设卡塔尔合资公司，香港子公司持股55%", "content // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `

        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
