.score-bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s; }
.up { color: var(--red); }

, "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260512/c676621241.shtml"}, {"id": "4350733", "title": "汇丰全球研究将SK海力士目标价从180万韩元上调至290万韩元", "content": "汇丰全球研究将SK海力士目标价从180万韩元上调至290万韩元。", "ctime": 1778563679, "time_str": "13:27:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260512/c676621232.shtml"}, {"id": "4350725", "title": "进度条刷新，引江济淮工程阶段验收工作全面完成", "content": "近日，淮委会同安徽省水利厅主持召开引江济淮工程（安徽段）凤凰颈泵站改造工程机组启动验收会议。凤凰颈泵站改造工程顺利通过机组启动验收，标志着引江济淮工程阶段验收工作全面收官。引江济淮工程是跨流域、跨省的重大战略性水资源配置和综合利用工程，为国家172项节水供水重大水利工程的标志性项目，供水范围涉及河南、安徽两省15市55县（市、区），总面积7.06万平方公里，输水线路总长723公里。工程2022年试通水通航、2025年实现“双线引江”，缓解皖北、豫东地区水资源短缺矛盾，改善流域水生态环境提供坚实保障。（央视新闻）", "ctime": 1778563543, "time_str": "13:25:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260512/c676621206.shtml"}, {"id": "4350709", "title": "北京“两区”数据出境负面清单发布 国内首批拓展至全市域", "content": "日前，北京市互联网信息办公室、北京市商务局、北京市政务和数据局联合发布《中国（北京）自由贸易试验区、国家服务业扩大综合示范区数据出境管理清单（负面清单）（2025版）》及配套管理办法，在全国范围内首批将数据出境负面清单管理机制由自贸区拓展至省级行政区全域，标志着北京数据跨境流动便利化改革实现了从“试点探索”到“全域治理”的系统性跃升。（央视新闻）", "ctime": 1778563335, "time_str": "13:22:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260512/c676621185.shtml"}, {"id": "4350649", "title": "破800万人次，北京口岸今年出入境人员总量再攀新高", "content": "随着一系列移民管理便利化政策的落地实施，北京口岸出入境客流增长势头强劲。记者从北京边检总站了解到，截至5月12日11时30分，北京口岸本年度出入境人员总量突破800万人次，同比增长12%，较去年提前半个月迈上800万量级。进入5月，伴随着移民管理便利化政策红利持续释放、度假旅游需求旺盛等因素影响，北京口岸出入境人员量持续高位运行，入境外国人数量增长明显。截至5月11日，北京口岸入出境外国人已超255万人次，占出入境人员总量的32%，同比增长33.6%，其中享受免签和临时入境许可政策入境的外国人达95.7万人次，占入境外国人总数的70.8%。入境需求以观光旅游、商务交流、探亲访友为主。中国持续扩大的免签“朋友圈”，正让“说走就走”成为越来越多外国旅客的真实体验。当前，我国已对50个国家实施单方面免签，同29个国家全面互免签证，240小时过境免签政策适用国家扩展至55个，外国人来华更加便利高效。从内地居民出入境情况看，选择经北京口岸出入境的内地居民达492万余人次，占出入境人员总量的61.7%。韩国、泰国、新加坡等国家是热门目的地。面对持续攀升的客流，北京边检总站多措并举提升通关效率、营造良好通关环境。对申请240小时过境免签的外国人，推行临时入境许可签发查验“一站式”办理，提升旅客通关效率；全天候开启快捷通道并提供现场采集备案服务，让符合条件的旅客实现“丝滑通关”。（央视新闻）", "ctime": 1778562664, "time_str": "13:11:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260512/c676621095.shtml"}, {"id": "4350635", "title": "现货黄金失守4710美元/盎司", "content": "现货黄金失守4710美元/盎司，日内跌0.55%。", "ctime": 1778562579, "time_str": "13:09:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260512/c676621077.shtml"}, {"id": "4350631", "title": "首创期货：秘鲁发布能源危机紧急法令，白银大涨6%", "content": "沪银大涨6%。全球前三白银生产国秘鲁（占全球产量10%+）因天然气管道爆炸出台能源紧急法令，国内电力供应紧张、工业天然气配额受限，秘鲁优先保民生用电、限制矿山工业用电，矿山开工率下滑，供给收缩预期引爆市场。白银的上涨主要是短期因素影响，持续性存疑，上方或有压力。因金银缺乏明确主线逻辑，操作上，仍建议观望为主。（首创期货）", "ctime": 1778562546, "time_str": "13:09:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260512/c676621061.shtml"}, {"id": "4350623", "title": "美国考虑恢复对伊朗军事行动，伊朗武装部队已做好准备", "content": "11日，美国政府内部人士透露，由于美伊谈判迟迟没有进展，美方如今比过去几周“更认真地考虑”恢复对伊朗的军事行动。对于伊朗问题，目前美国政府内部存在不同声音。部分官员主张采取强硬措施，包括进行更多定点打击，以削弱伊朗并迫使其在谈判桌上让步；另一部分人则希望给予外交谈判更多时间。伊朗伊斯兰议会议长卡利巴夫在社交媒体发文说，美国必须接受伊朗“14点”方案中提出的伊朗人民各项权利，这是唯一现实路径，任何偏离这一框架的做法都难以取得实际成果，只会一再失败。11日，卡利巴夫还曾发文说，伊朗武装部队已经做好准备，以应对任何侵略。（央视新闻）", "ctime": 1778562489, "time_str": "13:08:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260512/c676621050.shtml"}, {"id": "4350575", "title": "恒瑞医药午后直线拉升", "content": "恒瑞医药午后直线拉升，A股一度涨超7%，港股一度涨超16%。消息面上，恒瑞医药公告，公司与百时美施贵宝公司达成全球战略合作及许可协议，共同推进13款涵盖肿瘤学、血液学及免疫学的早期项目。根据协议，BMS将向恒瑞支付可达9.5亿美元的相关付款，包括6亿美元首付款、第一笔周年付款1.75亿美元，以及第二笔有条件的2028年周年付款1.75亿美元。协议的潜在总交易额可达约152亿美元，包括共同研发项目选择权的行使，以及所有项目达成相应的开发、注册及商业化里程碑。", "ctime": 1778562226, "time_str": "13:03:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260512/c676620979.shtml"}, {"id": "4350569", "title": "京九铁路聊城北站上行线改建工程正式开通", "content": "5月11日21时40分，随着最后一次大要点拨接施工圆满结束，京九铁路聊城北站上行线改建工程正式开通运营。作为国家铁路网优化升级的重点项目，该工程的投用将有效打通区域铁路运输堵点，为京九干线提质增效、完善华北地区铁路网布局提供坚实保障。本次施工作业窗口期短、组织难度高。项目团队在100分钟内高效完成3处线路拨接，累计拨移线路500米，最大拨移量达6.3米，同步拆除1组道岔、完成145米铺轨连通，并在180分钟内实现全线大机捣固整形。为确保天窗施工安全高效推进，项目部统筹调配施工机械40余台套，参与施工人员1200余人，配置3组大机捣固机组同步作业，科学优化流程、细化分工卡点，高标准完成各项施工任务。（央视新闻）", "ctime": 1778562188, "time_str": "13:03:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260512/c676620967.shtml"}, {"id": "4350525", "title": "深证成指跌1%", "content": "深证成指跌幅扩大至1%，上证指数跌0.4%，创业板指跌0.58%。全市场超4300家个股下跌。", "ctime": 1778562056, "time_str": "13:00:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260512/c676620929.shtml"}, {"id": "4350421", "title": "“洪迪厄斯”号邮轮最后一批转运人员抵达荷兰", "content": "当地时间12日凌晨，暴发汉坦病毒疫情的“洪迪厄斯”号邮轮最后一批共28名转运人员乘坐两架飞机抵达荷兰埃因霍温空军基地，他们将在荷兰接受隔离或回国。 荷兰外交部11日晚发布消息说，第一架飞机上载有6名原计划从西班牙特内里费岛直接返回澳大利亚的邮轮乘客；第二架飞机上载有22名撤离人员，主要是邮轮工作人员。 据外媒报道，搭乘第一架飞机的6名乘客将在荷兰接受短暂隔离后前往澳大利亚。 “洪迪厄斯”号邮轮由总部位于荷兰的“泛海探险”公司运营。该公司11日发布声明说，“洪迪厄斯”号邮轮正驶往荷兰鹿特丹港，预计17日抵达。 世界卫生组织11日表示，当前共接到9例与“洪迪厄斯”号邮轮相关的病例报告，其中7人确诊感染汉坦病毒家族中的安第斯病毒，已有3人死亡。(新华社)", "ctime": 1778561361, "time_str": "12:49:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260512/c676620785.shtml"}, {"id": "4350359", "title": "腾讯回应微信状态访客功能：是浏览者人数展示，已停止测试", "content": "5月12日，针对“微信状态访客功能”一事，腾讯回复称，微信状态已停止测试状态浏览者人数展示功能。“我们会对功能做小范围测试，并根据用户反馈做优化。微信状态并未提供或测试查看访客记录的能力。”当天，对于微信已读功能和访客功能，微博账号认证为腾讯公司公关总监的“腾讯张军”发文强调，此二项功能已焊死，不会开发、提供。“至于此次小范围测试的微信状态浏览人数展示功能，也已停止。”（新京报）", "ctime": 1778560351, "time_str": "12:32:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260512/c676620530.shtml"}, {"id": "4350325", "title": "宇树发布GD01载人变形机甲 定价390万元起", "content": "据宇树科技官微12日消息，宇树发布GD01载人变形机甲，定价390万元起。据介绍，GD01为全球首款量产版载人机甲，还可以变形，民用交通工具，体重约500kg（载人后）。", "ctime": 1778560095, "time_str": "12:28:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260512/c676620473.shtml"}, {"id": "4350313", "title": "王腾AI睡眠公司获新一轮融资，多方资本加持", "content": "企查查APP显示，近日，王腾创办的睡眠健康公司今日宜休已完成新一轮融资，本轮引入CMC资本、云九资本、君礼资本、弘晖基金、高瓴创投。今年1月，该公司已完成总规模为数千万元的种子轮融资，投资方包括智元机器人、高瓴创投等。（人民财讯）", "ctime": 1778559880, "time_str": "12:24:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260512/c676620442.shtml"}, {"id": "4350291", "title": "联发科将采用CoWoS和EMIB双重先进封装策略", "content": "IC设计联发科正在采用双重先进封装策略，公司正在深化与台积电在CoWoS和SoIC方面的合作，同时还将英特尔EMIB技术应用于面向特定客户的ASIC芯片。(科创板日报)", "ctime": 1778559249, "time_str": "12:14:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260512/c676620273.shtml"}, {"id": "4350289", "title": "璞泰来在宁波成立新能源技术公司", "content": "企查查APP显示，近日，宁波璞勤新能源技术有限公司成立，经营范围包含：新兴能源技术研发；新材料技术研发；新材料技术推广服务等。企查查股权穿透显示，该公司由璞泰来全资持股。（人民财讯）", "ctime": 1778559205, "time_str": "12:13:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260512/c676620266.shtml"}, {"id": "4350287", "title": "声通科技等成立数智科技公司，含AI及物联网业务", "content": "企查查APP显示，近日，声通华迪（武汉）数智科技有限公司成立，注册资本1000万元，经营范围包含：人工智能行业应用系统集成服务；智能控制系统集成；信息技术咨询服务；人工智能公共数据平台；物联网技术服务等。企查查股权穿透显示，该公司由声通科技等共同持股。（人民财讯）", "ctime": 1778559088, "time_str": "12:11:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260512/c676620240.shtml"}, {"id": "4350283", "title": "快手：董事会正在评估拟议重组可灵AI之相关资产及业务的方案 尚未就此签署任何最终协议", "content": "快手公告，本公司注意到，于2026年5月11日，有媒体报道本公司有意就本集团可灵AI之相关资产及业务获取外部融资及拟议独立上市。本公司谨此向股东及投资者作出更新，为了进一步利用外部财务资源，本公司董事会正在评估拟议重组可灵AI之相关资产及业务的方案，其中或涉及引入外部融资。于本公告日期，上述拟议方案仍处于初步阶段，本公司尚未就此签署任何最终协议。概不保证该等拟议方案将会进行。", "ctime": 1778559072, "time_str": "12:11:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260512/c676620233.shtml"}, {"id": "4350275", "title": "赛力斯电池包碰撞场景脱离专利获授权 可在碰撞时使电池包与车体分离", "content": "天眼查知识产权信息显示，近日，赛力斯汽车有限公司申请的“一种在碰撞场景下脱离电动车的电池包装置和电动汽车”专利获授权。摘要显示，本申请涉及电动汽车配件技术领域，包括电池包下壳，电池包下壳的前侧面上安装有两个第一凸柱，电池包下壳的后侧面上安装有两个第二凸柱，电池包下壳的后端部设置有后侧支撑组件，后侧支撑组件包括端板，端板的两端部均安装有支撑套，第二凸柱与支撑套之间插接配合，端板的前侧面上安装有第一电动推杆，电池包下壳的前侧设置有前侧支撑组件，前侧支撑组件包括前侧板，前侧板的前侧面上安装有支撑盒，支撑盒上安装有第二电动推杆，第二电动推杆的伸缩轴上设置有导向板，导向板上安装有两个矩形杆，矩形杆插入至第一凸柱内。本申请能够在碰撞时使电池包与车体分离开，提高安全性能。", "ctime": 1778558977, "time_str": "12:09:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260512/c676620221.shtml"}, {"id": "4350273", "title": "恺英网络设立AI内容公司时光川行", "content": "5月12日，据恺英网络消息，恺英网络于近日设立AI内容公司时光川行（Moment Stream），专注于AI微短剧与AI漫剧的一体化制作。公司以自研垂类视频生成模型为核心技术底座，构建从IP、剧本到多镜头视频内容的工业化生产体系，为AI内容产业的规范化、规模化发展提供完整解决方案。（界面新闻）", "ctime": 1778558881, "time_str": "12:08:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260512/c676620199.shtml"}, {"id": "4350271", "title": "瑞声科技高功率液冷CDU规模化量产", "content": "瑞声科技旗下远地科技ATAHORAN系列2.2MW/2.6MW集中式液冷CDU近日实现规模化量产，并同步开启全球批量交付。月交付产能达400台。（财联社）", "ctime": 1778558867, "time_str": "12:07:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260512/c676620191.shtml"}, {"id": "4350257", "title": "港股午评：恒生指数涨0.3%，恒生科技指数跌0.39%", "content": "港股午间收盘，恒生指数涨0.3%，恒生科技指数跌0.39%。恒指港股通ETF银华（159318）涨0.15%，港股通科技ETF鹏华（159751）跌0.83%。板块方面，化学制品、林业与纸制品板块涨幅靠前；半导体产品与设备、生物科技板块跌幅靠前。个股方面，经纬天地（旧）涨16.18%，经纬天地涨15.59%，滴普科技涨12.14%，博泰车联涨6.66%，希迪智驾涨6.56%；乐动机器人跌15.58%，汇聚科技跌11.52%，中国星集团跌11.41%，优然牧业跌8.31%，先导智能跌8.04%。", "ctime": 1778558520, "time_str": "12:02:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260512/c676620100.shtml"}, {"id": "4350233", "title": "5月12日午间公告一览：恒瑞医药称与百时美施贵宝公司达成全球战略合作及许可协议", "content": "恒瑞医药公告，公司与百时美施贵宝公司达成全球战略合作及许可协议，共同推进13款涵盖肿瘤学、血液学及免疫学的早期项目。根据协议，BMS将向恒瑞支付可达9.5亿美元的相关付款，包括6亿美元首付款、第一笔周年付款1.75亿美元，以及第二笔有条件的2028年周年付款1.75亿美元。协议的潜在总交易额可达约152亿美元，包括共同研发项目选择权的行使，以及所有项目达成相应的开发、注册及商业化里程碑。", "ctime": 1778558378, "time_str": "11:59:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260512/c676620002.shtml"}, {"id": "4350223", "title": "去哪儿旅行：本周机票均价跌超40% 热门航线重回300元档", "content": "去哪儿旅行数据显示，国内航线机票均价自5月5日触顶后开始下行，与“五一”假期相比，本周机票均价下跌41%；民航市场步入传统出行淡季，机票价格有望继续下探。多条热门航线票价同步大幅跳水，当前至6月初淡季，北京—南京直飞裸票机票价格低至300元，北京至哈尔滨、西安、宁波等地均有300元低价裸票在售。（人民财讯）", "ctime": 1778558073, "time_str": "11:54:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260512/c676619931.shtml"}, {"id": "4350209", "title": "泡泡玛特开始卖茶饮！首店落户阿那亚，或将推出自营产品", "content": "5月12日上午消息，有消息人士透露，泡泡玛特旗下甜品品牌POP BAKERY首家直营门店即将落地于秦皇岛阿那亚。与以往不同的是，该门店首次增设了茶饮产品。未来，泡泡玛特或将进一步推出自营茶饮与咖啡产品。（新浪科技）", "ctime": 1778557793, "time_str": "11:49:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260512/c676619833.shtml"}, {"id": "4350205", "title": "西十高铁全线拉通试验正式启动", "content": "5月12日，随着DJ（动检）602次综合检测列车从西安东站平稳驶出，沿西十高铁正线穿越秦岭直达十堰东站，标志着西十高铁首次全线拉通试验正式启动，西十高铁联调联试工作取得重要阶段性进展，为后续试运行和开通运营奠定了坚实基础。全线拉通试验是高铁开通运营前的综合大考与实战彩排，将此前单项测试成果整合，对轨道、供电、接触网、信号、通信等全系统开展综合验证，确保各项指标全面达标、系统匹配稳定，满足高速行车安全标准。此次全线拉通试验，西安铁路局采用“综合检测列车+确认列车”双车协同模式，分线路、分速度等级开展系统性测试。确认列车以最高120公里/小时前置巡检轨道、接触网状态，为高速检测安全开路；CRH380AJ型综合检测列车按计划完成逐级提速、区间折返、非接触复测等测试，正线按设计时速350公里运行，精准采集轨道几何、接触网参数、信号响应等关键数据，为线路精调优化提供科学依据。西十高铁开通后，西安至十堰将实现1小时左右到达，西安至襄阳预计2小时到达，西安至武汉3小时可达，将进一步完善全国高速铁路网。（央视新闻）", "ctime": 1778557757, "time_str": // 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
