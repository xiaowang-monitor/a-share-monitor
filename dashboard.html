西部牧业公告，2026年8月自产生鲜乳生产量为3106.01吨，本月比上月增减比率为7.76%，本月比上年同期增减比率为22.27%。", "ctime": 1788508172, "time_str": "15:49:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260904/c679604741.shtml"}, {"id": "5109451", "title": "美邦股份：拟向诺正生物增资8000万元并设香港子公司", "content": "美邦股份公告，公司拟使用自有资金向全资子公司陕西诺正生物科技有限公司增资8000万元人民币，注册资本由1亿元人民币增至1.8亿元人民币；拟以自有资金100万美元在香港设立全资子公司，注册资本为50万港币。相关议案已于2026年9月4日经董事会审议通过，无需提交股东会审议。", "ctime": 1788508145, "time_str": "15:49:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260904/c679604721.shtml"}, {"id": "5109449", "title": "今年全球铜矿产量或迎2017年来首次年度下滑", "content": "国际铜业研究组织最新数据显示，今年上半年全球铜矿产量年减1.1%。智利Codelco与自由港麦克莫兰等主要生产商均出现两位数降幅。摩根士丹利最初曾预测今年铜供应将有所增加，但目前已将预期下调为“基本持平或微降”，这表明全球铜矿产量可能会出现自2017年以来的首次年度下滑。（财联社）", "ctime": 1788508143, "time_str": "15:49:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260904/c679604720.shtml"}, {"id": "5109445", "title": "现货黄金站上4490美元/盎司", "content": "现货黄金站上4490美元/盎司，日内涨0.39%。", "ctime": 1788508099, "time_str": "15:48:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260904/c679604705.shtml"}, {"id": "5109429", "title": "航行近8年 欧日探测器向水星轨道出发", "content": "历经近8年飞行后，水星探测器“比皮科伦坡”3日脱离推进模块，向着水星轨道前进，预计于11月抵达目的地。欧洲航天局于北京时间3日21时53分收到“比皮科伦坡”成功完成上述操作的确认信息。在信息传回的两小时延迟内，位于德国黑森州达姆施塔特的控制中心气氛紧张。最终收到确认信息后，现场响起热烈掌声和欢呼声。（新华社）", "ctime": 1788507943, "time_str": "15:45:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260904/c679604597.shtml"}, {"id": "5109383", "title": "理工导航：股东减持计划届满，未减持0股", "content": "理工导航公告，持股5%以上股东北京理工资产经营有限公司及一致行动人北京理工技术转移有限公司原计划于2026年6月5日至2026年9月4日减持合计不超过264万股、不超过公司总股份的3.00%；截至2026年9月4日收盘，减持计划时间区间届满，实际减持0股。因公司股权激励实施导致总股本增加，二者合计持股比例由7.36%被动稀释至7.27%。", "ctime": 1788507608, "time_str": "15:40:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260904/c679604438.shtml"}, {"id": "5109381", "title": "中国人民银行召开树立和践行正确政绩观学习教育总结会议", "content": "9月4日，中国人民银行召开党委扩大会议暨党建工作领导小组会议，传达学习习近平总书记关于树立和践行正确政绩观学习教育的重要指示精神和中央党的建设工作领导小组会议精神，总结中国人民银行系统学习教育，研究部署巩固拓展学习教育成果、建立树立和践行正确政绩观长效机制工作。中国人民银行党委书记、行长潘功胜主持会议，各党委成员出席会议。\n\n会议指出，中国人民银行党委认真落实习近平总书记关于树立和践行正确政绩观的重要指示精神，把开展学习教育作为重要政治任务抓实抓细，紧扣“立党为公、为民造福、科学决策、真抓实干”总要求和“三个认认真真、扎扎实实”重要要求，高标准推进学查改各项任务。全系统通过开展学习教育，深化了对正确政绩观的认识和理解，旗帜鲜明讲政治的党性自觉更加坚定；提升了以正确政绩观干事创业的思想观念和能力本领，金融服务实体经济和惠企利民的实效更加凸显；锤炼了担当务实的工作作风，工作的前瞻性、全局性进一步增强，学习教育成果持续转化为金融服务高质量发展的实际成效。\n绩。(央行)", "ctime": 1788507583, "time_str": "15:39:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260904/c679604433.shtml"}, {"id": "5109379", "title": "阿斯麦将扩大在日本的员工规模", "content": "当地时间周四，阿斯麦日本业务总裁ShojiroFujiwara在新闻发布会上表示，公司计划到2030年将日本员工人数从目前的500人扩大至700人，以协助芯片制造商Rapidus和台积电。（新浪财经）", "ctime": 1788507542, "time_str": "15:39:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260904/c679604398.shtml"}, {"id": "5109367", "title": "沙特资本市场论坛首次在沪举办 中沙资本市场合作探索稳步前行", "content": "在9月3日举办的沙特资本市场论坛——上海精选专场上，上海证券交易所副理事长霍瑞戎表示，上交所将持续深化与沙特交易所集团的交流合作，携手搭建更多高效务实的双向对接平台，为两国上市公司、券商、基金等市场主体创造更多交流机会。霍瑞戎指出，中国与沙特互为重要合作伙伴，共建“一带一路”倡议同沙特“2030愿景”深度对接。两国经贸联系紧密，贸易投资规模稳步增长，能源、基建、高新技术等领域合作成果丰硕，为资本市场联动发展筑牢坚实的实体经济根基。2023年9月，上交所与沙特交易所集团签署合作备忘录，建立常态化交流合作机制。本次论坛是沙特交易所集团首次在中国内地主办的资本市场专题活动，汇聚了400余位来自沙特、中国及国际资本市场的参与者。（财联社）", "ctime": 1788507473, "time_str": "15:37:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260904/c679604366.shtml"}, {"id": "5109361", "title": "高通推出AI GPU技术改善手游体验", "content": "高通推出一项基于人工智能的GPU技术，旨在改善移动端游戏体验。 高通于9月2日发布Adreno Neural Fusion。这项移动GPU技术在实现更高画面画质的同时，降低渲染开销与功耗。 全新Adreno GPU采用三切片架构。GPU不再是单一整块单元，而是切分为3个切片；每个切片运行1.45GHz时钟频率，可独立完成计算。该架构还新增片上内存技术，支撑高速AI运算。Adreno Neural Fusion将搭载于高通下一代骁龙旗舰平台。更多细节将于9月22 24日举办的骁龙峰会正式公布。", "ctime": 1788507439, "time_str": "15:37:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260904/c679604353.shtml"}, {"id": "5109349", "title": "泰国暂停49个数据中心项目建设，拟加强行业监管", "content": "9月4日，据报道，泰国政府已暂停49个数据中心项目建设，以制定新的行业监管规定，相关规定预计将在一个月内公布。泰国政府表示，此举旨在建立统一、明确的监管标准，确保数据中心行业可持续发展。数据显示，2026年上半年泰国已批准88个与AI和数据中心相关的项目，总投资额达8860亿泰铢（约270亿美元），超过2025年全年6230亿泰铢的投资规模。泰国政府正考虑提高大型数据中心运营商的电价，并加强对人口密集地区相关项目的审查。（界面新闻）", "ctime": 1788507318, "time_str": "15:35:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260904/c679604313.shtml"}, {"id": "5109341", "title": "智谱天猫首店：搜索暴涨50倍，带动token产品成交大涨160%", "content": "近日，智谱率先入驻天猫开设官方旗舰店引发外界热议。数据显示，智谱开店48小时，品牌搜索环比暴涨50倍，带动淘宝天猫AI token等订阅类产品成交环比涨超160%。(科创板日报)", "ctime": 1788507212, "time_str": "15:33:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260904/c679604255.shtml"}, {"id": "5109337", "title": "巍华新材：首次回购23.5万股，价格14.41元/股~14.45元/股，支付339.08万元", "content": "巍华新材公告，公司拟以集中竞价交易方式回购股份，预计回购金额8000万元~1.2亿元，回购价格不超过18元/股，用于员工持股计划或股权激励。2026年9月3日，公司首次回购23.5万股，占总股本的0.07%，回购价格14.41元/股~14.45元/股，使用资金总额339.08万元（不含交易费用）。", "ctime": 1788507166, "time_str": "15:32:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260904/c679604189.shtml"}, {"id": "5109327", "title": "外交部再次回应太平洋岛国不满中方试射导弹问题：中方已多次就此阐明立场", "content": "9月4日，外交部发言人郭嘉昆主持例行记者会。彭博社记者提问，太平洋岛国领导人对中方日前试射导弹问题表达了不满，请问中方对此有何回应？郭嘉昆表示，关于试射活动，中方已经多次阐明立场。中国坚持走和平发展道路，坚定奉行防御性国防政策，从不搞军事扩张。中方愿同南太国家一道，为维护南太地区和平稳定和发展繁荣贡献力量。此后法新社记者再次提问，在太平洋岛国论坛发表的联合声明中，呼吁未来再有类似试射活动应提前24小时通知各国。中方是否愿意响应有关要求？郭嘉昆表示，刚才我已经回答过了相关的问题，关于试射的活动，中方已经多次阐明我们的立场。（澎湃新闻）", "ctime": 1788506999, "time_str": "15:29:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260904/c679604089.shtml"}, {"id": "5109317", "title": "习近平向第八届中俄能源商务论坛致贺信", "content": "9月4日，第八届中俄能源商务论坛在俄罗斯符拉迪沃斯托克举办。国家主席习近平向论坛致贺信。\n\n习近平指出，今年是中俄战略协作伙伴关系建立30周年和《中俄睦邻友好合作条约》签署25周年。在国际形势复杂变化中，中俄新时代全面战略协作伙伴关系高水平发展，中俄能源合作成果丰硕，有力促进两国共同发展，成为双方互利合作的典范。\n\n习近平强调，当前国际能源格局深刻调整，机遇与挑战相互交织。中方愿同俄方一道，不断深化能源合作，共同维护能源产业链供应链稳定畅通。\n\n同日，俄罗斯联邦总统普京也向第八届中俄能源商务论坛致贺信。(新华社)", "ctime": 1788506834, "time_str": "15:27:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260904/c679603863.shtml"}, {"id": "5109309", "title": "中方派员出席2026年度亚太国防军司令会议", "content": "9月4日下午，国防部新闻发言人蒋斌大校就近期涉军问题发布消息。记者：据报道，中国军队近日派员出席由加拿大和美国联合举办的亚太国防军司令会议。请予以证实并介绍相关情况。蒋斌：近日，中国人民解放军东部战区司令员杨志斌上将率团赴加拿大维多利亚出席由加国防军和美军太平洋总部联合举办的2026年度亚太国防军司令会议。其间，中方进行大会发言，介绍中国军队维护地区和平稳定的立场和成果，提议地区国家加强防务交流合作，携手应对共同挑战，并与美国、法国、新加坡等国参会代表举行双边会议。(央视新闻)", "ctime": 1788506505, "time_str": "15:21:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260904/c679603702.shtml"}, {"id": "5109307", "title": "外交部：中国坚持走和平发展道路 从不搞军事扩张", "content": "外交部发言人郭嘉昆主持例行记者会。彭博社记者提问，一些太平洋岛国的领导人批评了中方最近进行的导弹试射活动，称中方没有事先进行充分通知。中方对此有何评论？郭嘉昆表示，关于试射活动，中方已经多次阐明立场。中国坚持走和平发展道路，坚定奉行防御性国防政策，从不搞军事扩张。中方愿同南太国家一道，为维护南太地区和平稳定和发展繁荣贡献力量。 (北京日报)", "ctime": 1788506285, "time_str": "15:18:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260904/c679603580.shtml"}, {"id": "5109305", "title": "中美或将就农业及相关非关税壁垒发布声明？外交部：无信息提供", "content": "9月4日，外交部发言人郭嘉昆主持例行记者会。有记者提问，美国贸易代表格里尔周四表示，中美或将就农业及相关非关税壁垒发布有关声明。外交部对此有何评论？中方对于两国元首下次互动有何期待？\n\n郭嘉昆表示，关于你提到的具体问题，我没有可以提供的信息。中美双方应当共同落实好两国元首达成的重要共识，维护中美经贸关系稳定发展态势。(澎湃新闻)", "ctime": 1788506267, "time_str": "15:17:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260904/c679603571.shtml"}, {"id": "5109297", "title": "国家发展改革委追加安排1亿元支持福建进一步做好台风灾害灾后应急恢复", "content": "记者4日从国家发展改革委获悉，国家发展改革委在前期工作基础上，追加安排1亿元中央预算内投资，支持福建省进一步做好灾区灾后应急恢复，推动尽快恢复正常生产生活秩序。（新华社）", "ctime": 1788506117, "time_str": "15:15:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260904/c679603499.shtml"}, {"id": "5109295", "title": "外交部回应52名新加坡人涉嫌在华传销", "content": "今天，针对有关52名新加坡人涉嫌传销活动在广西被捕的提问，外交部发言人郭嘉昆表示：中方依法查处在华外国公民违法犯罪案件，并充分保障当事人合法权利。进一步的消息建议向中方主管部门询问。 (央视新闻)", "ctime": 1788506003, "time_str": "15:13:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260904/c679603456.shtml"}, {"id": "5109293", "title": "美总统：英国“处于灾难的边缘” 移民和能源问题亟待解决", "content": "美国总统特朗普3日表示，英国“处于灾难的边缘”，其能源和移民等问题令人担忧。另外，他回避就马尔维纳斯群岛（简称马岛，英国称福克兰群岛）主权争端中的立场明确表态，再度批评英国在伊朗战事上“不给力”。（央视新闻）", "ctime": 1788505891, "time_str": "15:11:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260904/c679603398.shtml"}, {"id": "5109291", "title": "国防部：任何“以武谋独”的企图都注定失败", "content": "国防部新闻发言人蒋斌大校就近期涉军问题发布消息。记者：日前，台防务部门向民意机构提交“2026年大陆军力报告书”和台军“五年兵力整建及施政计划报告书”，渲染“大陆威胁”，指出解放军常态化派遣舰机位台岛周边执行战备警巡与“侵扰”行动等，强调要提升“不对称”战力与防卫韧性。请问发言人有何评论？蒋斌：有关报告混淆是非、颠倒黑白，不过是民进党当局贩卖战争焦虑、“以武谋独”所找的借口。台湾是中国领土不可分割的一部分，解放军位台岛周边常态组织战备警巡，开展反分裂反干涉行动，维护国家主权和领土完整，是使命所系、职责所在。祖国统一势不可挡，任何“以武谋独”的企图都注定失败。", "ctime": 1788505861, "time_str": "15:11:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260904/c679603380.shtml"}, {"id": "5109289", "title": "我国北斗基准站服务数据首次向社会共享开放", "content": "记者今天（9月4日）从自然资源部了解到，我国卫星导航定位基准站网服务数据正式启动授权运营，这也意味着全国北斗基准站一张网服务数据首次向社会共享开放。\n\n自然资源部表示，这次授权运营，按照安全可控、优质高效的原则，面向重点行业和市场主体开放，让基准站公共数据合规流通起来，充分释放时空数据要素的经济社会价值。\n\n自然资源部国土测绘司基础测绘处处长 陈明：以前很多行业自己建站，要投入很大成本，后期运维也需要持续投入。通过此次共享开放，有效拓宽了北斗高精度数据服务场景，比如，在自动驾驶，低空经济，城市更新与精细化治理等方面。(央视新闻)", "ctime": 1788505757, "time_str": "15:09:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260904/c679603325.shtml"}, {"id": "5109283", "title": "上合组织持续拓展深化防务安全合作", "content": "9月4日下午，国防部新闻发言人蒋斌大校就近期涉军问题发布消息。记者：近日，国家主席习近平出席在吉尔吉斯斯坦举行的2026年上海合作组织峰会。今年恰逢上合组织成立25周年，请问上合组织成员国将如何进一步加强防务安全领域合作？蒋斌：习主席近日出席上海合作组织成员国元首理事会第二十六次会议并发表重要讲话指出，中方愿同各方践行共同、综合、合作、可持续的安全观，将上海合作组织打造成践行全球安全倡议的重要平台。安全是发展的基石，和平是繁荣的源泉。上合组织成员国高度重视防务安全合作，多次组织国防部长会议、军队总参谋长会议，举行“和平使命”反恐联演、“和平号角”军乐节，开展军事医学、军事交通、军事翻译等领域专业交流，举办高级军官研修班、中青年军官交流、“上合组织+”青年智库沙龙等活动。在国际形势变乱交织之际，上合组织发挥稳定之锚作用，在维护地区安全稳定、应对各类威胁挑战方面取得重要成就。(新华社)", "ctime": 1788505497, "time_str": "15:04:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260904/c679603232.shtml"}, {"id": "5109277", "title": "ETF两市成交额报4962.95亿元，较昨日此时放量759.36亿元", "content": "截至目前，ETF两市成交额报4962.95亿元，较昨日此时放量759.36亿元，分类型来看，股票型ETF成交额1447.79亿元，债券型ETF成交额2349.44亿元，货币型ETF成交额437.7亿元，商品型ETF成交额102.75亿元，QDII型ETF成交额625.27亿元。", "ctime": 1788505326, "time_str": "15:02:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260904/c679603163.shtml"}, {"id": "5109275", "title": "期货收评：碳酸锂暴跌超7%！硅铁、PVC强势拉涨！", "content": "期货收评：截止收盘，国内期货主力合约涨多跌少，硅铁触及涨停，聚氯乙烯（PVC）涨近5%，液化石油气（LPG）、钯涨超3%，纯碱涨近3%，烧碱涨超2%，氧化铝、沪银涨近2%。跌幅方面，碳酸锂跌超7%，低硫燃料油（LU）跌超2%，对二甲苯、PTA跌超1%，SC原油跌近1%。", "ctime": 1788505319, "time_str": "15:01:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260904/c679603162.shtml"}, {"id": "5109273", "title": "欧洲主要股指开盘集体下跌", "content": "欧洲主要股指开盘集体下跌，欧洲斯托克50指数跌0.19%，英国富时100指数跌0.15%，法国CAC40指数跌0.24%，德国DAX指数跌0.01%。", "ctime": 1788505311, "time_s // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
