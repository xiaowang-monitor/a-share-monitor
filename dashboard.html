化、江西铜业涨停，湖南白银、云南铜业、西部矿业、盛达资源、高能环境跟涨。相关ETF方面，黄金股ETF国泰（517400）涨2.51%，成交额6388.61万元。", "ctime": 1787711120, "time_str": "10:25:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260826/c679296627.shtml"}, {"id": "5029109", "title": "“十五五”时期我国将促进6G产业成熟和生态构建", "content": "工业和信息化部信息通信发展司司长刘郁林8月26日在国新办举行的“开局起步‘十五五’”系列主题新闻发布会上说，“十五五”时期将加快6G核心技术攻关，持续开展6G技术试验、标准研制，促进6G产业成熟和生态构建，为6G商用做好准备。(新华社)", "ctime": 1787710936, "time_str": "10:22:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260826/c679296519.shtml"}, {"id": "5029105", "title": "富时中国A50指数期货涨1%", "content": "富时中国A50指数期货涨幅扩大至1%。", "ctime": 1787710891, "time_str": "10:21:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260826/c679296496.shtml"}, {"id": "5029103", "title": "我国将创建国家新兴产业发展示范基地", "content": "8月26日，国新办举行“开局起步‘十五五’”系列主题新闻发布会，工业和信息化部相关负责人介绍全力抓好“十五五”规划实施、加快推进新型工业化有关情况。发布会上介绍，“十五五”时期，我国将创建国家新兴产业发展示范基地，聚焦新一代信息技术、新能源、新材料、智能网联新能源汽车、机器人、生物医药、高端装备、航空航天等新兴产业重点领域，打造一批引领新兴产业发展的标杆。到2035年，培育100家左右在产业集群发展、协同创新、生态优化、治理提升等方面具有辐射带动作用的示范园区，1000家左右在产品开发、技术创新、业态创新、管理效能等方面处于领先水平的示范企业。（央视）", "ctime": 1787710885, "time_str": "10:21:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260826/c679296492.shtml"}, {"id": "5029097", "title": "工信部：将分行业凝练人工智能应用高价值场景，实施应用服务商培育专项行动", "content": "8月26日，国务院新闻办公室举行“开局起步‘十五五’”系列主题新闻发布会，介绍全力抓好“十五五”规划实施，加快推进新型工业化有关情况。工业和信息化部副部长辛国斌表示，近年来我国人工智能产业活力迸发，亮点纷呈，正在为经济增长注入强劲的智能动力。从基础上看，我国算力底座持续夯实，截至6月底，我国智能算力规模达到2185EFLOPS。围绕算力枢纽，建成了70余条算力大通道，国产开源模型创新突破，性价比高，成为更多全球用户优先选择；从应用上看，人工智能已基本贯穿研发、设计、生产制造、质检、运维等全链条，加速产业质变升级。应用方面，重在挖掘落地场景，工信部将分行业凝练高价值场景，实施应用服务商培育专项行动，将制造业多年积淀的老经验挖掘好、梳理好，并在此基础上推出一批轻量化、低成本、易部署的行业解决方案，让企业真正用得上、用得起、用得好。（人民财讯）", "ctime": 1787710748, "time_str": "10:19:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260826/c679296349.shtml"}, {"id": "5029087", "title": "证券板块持续上扬 锦龙股份涨停", "content": "证券板块持续上扬，锦龙股份涨停，湘财股份、国元证券、招商证券、西部证券、华创云信跟涨。相关ETF方面，证券ETF广发（159016）涨1.71%，成交额1976.18万元，证券ETF天弘（159841）涨1.65%，成交额1.51亿元。", "ctime": 1787710609, "time_str": "10:16:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260826/c679296183.shtml"}, {"id": "5029083", "title": "CPO概念震荡下挫 杰普特跌超10%", "content": "CPO概念盘中震荡下挫，杰普特跌超10%，阿莱德、蘅东光，联特科技、太辰光、天孚通信、长光华芯等跟跌。", "ctime": 1787710415, "time_str": "10:13:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260826/c679296004.shtml"}, {"id": "5029079", "title": "我国已成功研制近200项人工智能关键标准", "content": "工业和信息化部副部长辛国斌8月26日在国新办举行的“开局起步‘十五五’”系列主题新闻发布会上说，从应用上看，我国人工智能已经基本贯穿研发设计、生产制造、质检运维等全链条。已有近200项人工智能关键标准成功研制，正在组织多个城市开展人工智能伦理审查与服务实践。(新华社)", "ctime": 1787710375, "time_str": "10:12:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260826/c679295984.shtml"}, {"id": "5029075", "title": "工信部：打造更多专精特新“小巨人”企业、制造业单项冠军企业", "content": "8月26日，国新办举行“开局起步‘十五五’”系列主题新闻发布会，工业和信息化部相关负责人介绍全力抓好“十五五”规划实施、加快推进新型工业化有关情况。发布会上介绍，我们将着力培育优质企业，完善优质企业梯度培育体系，培育壮大专精特新中小企业，打造更多专精特新“小巨人”企业、制造业单项冠军企业。深化大中小企业融通发展，促进产业链上下游协同创新。建好用好全国中小企业服务“一张网”，实施减轻企业负担专项行动，推出更多创新服务，增强企业获得感。(央视新闻)", "ctime": 1787710355, "time_str": "10:12:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260826/c679295961.shtml"}, {"id": "5029073", "title": "上海国际广告节开幕：2028年全市广告产业规模预计突破4800亿元", "content": "《上海市推进广告业扩能提质三年行动计划（2026-2028年）》提出到2028年，全市广告产业规模预计突破4800亿元。上海今年首次发布的《上海广告业发展指数报告（2026）》显示，2025年上海广告业发展指数达135.1点，同比增长14.1%，广告业总体呈现创新驱动、数智转型、量质齐升的良好态势。产业实力方面，去年上海市规上广告企业营收达4204.8亿元，占全国的20.5%；产业创新方面，上海创意密集型广告业务占全国的40%，“创意浓度”全国领先；数字广告业态蓬勃发展，AI赋能作用强劲，全市规上互联网广告企业达591家，营收占比提升至85.4%。经济效益方面，2025年，全市广告企业纳税额为185.2亿元，税收贡献达历史高位。（上观新闻）", "ctime": 1787710318, "time_str": "10:11:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260826/c679295929.shtml"}, {"id": "5029071", "title": "国台办：希望两岸年轻人同心同行 为推动两岸关系和平发展汇聚青春力量", "content": "8月26日，国务院台办举行例行新闻发布会。有记者请发言人介绍同心同行-两岸青年交流季上海站活动情况。发言人张晗表示，活动是建立国共两党双向交流机制化平台的具体举措，两岸各界人士和青年代表约1000人参加。两岸青年在论坛上围绕新兴科技、中华文化、两岸青年交流等主题进行深入交流研讨，还将赴上海、浙江等地参访研习，充分展现两岸青年积极向上，携手奋进的精神风貌。活动将持续至8月28日。接下来通过国共两党双向交流机制化平台，我们将邀请更多团组来大陆交流参访，内容精彩纷呈。我们也将诚挚邀请广大台湾青年朋友来大陆走一走、看一看，希望两岸年轻人同心同行，为推动两岸关系和平发展、融合发展，不断汇聚青春力量。（央视新闻）", "ctime": 1787710286, "time_str": "10:11:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260826/c679295913.shtml"}, {"id": "5029067", "title": "工信部：加快新一代通信网、算力网规划建设，加强6G技术研发", "content": "8月26日，国新办举行“开局起步‘十五五’”系列主题新闻发布会，工业和信息化部相关负责人介绍全力抓好“十五五”规划实施、加快推进新型工业化有关情况。发布会上介绍，我们将着力推动信息通信业高质量发展，加快新一代通信网、算力网规划建设，推动5G、工业互联网在重点行业规模化普及应用，加强6G技术研发，增强网络和数据安全保障能力，巩固提升信息通信业竞争优势和领先地位。（央视新闻）", "ctime": 1787710156, "time_str": "10:09:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260826/c679295813.shtml"}, {"id": "5029065", "title": "黑河—大庆天然气管道开工 年输气提升能力100亿立方米", "content": "记者8月26日从国家管网集团获悉，国家石油天然气发展“十五五”规划项目，黑河—大庆天然气管道工程在黑龙江开工，建成后形成“北气南下”双通道格局， “北气南下”系统年输气能力提升100亿立方米。（央视新闻）", "ctime": 1787710148, "time_str": "10:09:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260826/c679295811.shtml"}, {"id": "5029063", "title": "郑商所瓶片主力合约大跌5%", "content": "郑商所瓶片主力合约大跌5%，报7110元/吨。", "ctime": 1787710087, "time_str": "10:08:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260826/c679295774.shtml"}, {"id": "5029061", "title": "大商所纯苯主力合约触及跌停", "content": "大商所纯苯主力合约触及跌停，报7320元/吨，现跌幅为6.0%。", "ctime": 1787710083, "time_str": "10:08:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260826/c679295772.shtml"}, {"id": "5029057", "title": "国家海洋预报台发布海浪橙色、风暴潮蓝色警报", "content": "记者从自然资源部获悉，国家海洋预报台今日（26日）发布海浪橙色警报和风暴潮蓝色警报。海浪橙色警报受今年第18号台风“沙德尔”（强台风级）的影响，预计8月26日上午到27日上午：东海将出现7到11米的狂浪到狂涛区，近海海域海浪预警级别为橙色；浙江近岸海域将出现3到4.5米的大浪到巨浪，该近岸海域海浪预警级别为橙色；上海近岸海域将出现2.5到3.5米的大浪，该近岸海域海浪预警级别为黄色；福建北部近岸海域将出现2到3米的中浪到大浪，该近岸海域海浪预警级别为蓝色。请在上述海域作业的船只注意安全，沿海各有关单位提前采取防浪避浪措施。风暴潮蓝色警报受“沙德尔”影响，预计8月26日上午至27日上午，上海到浙江宁波沿海将出现40到90厘米的风暴增水，浙江台州到温州沿海将出现60到100厘米的风暴增水，福建北部沿海将出现50到80厘米的风暴增水。浙江省宁波市的风暴潮预警级别为蓝色。请沿海政府及相关部门按照职责做好防御风暴潮的应急准备工作，各涉海相关生产单位要采取积极有效的措施，组织渔船、养殖渔排、养殖场等做好防御工作，加固沿海渔业养殖水产设施和渔港设施，做好防潮准备。（央视新闻）", "ctime": 1787709990, "time_str": "10:06:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260826/c679295691.shtml"}, {"id": "5029053", "title": "工信部：未来五年加快打造航空航天、智能机器人等新兴支柱产业", "content": "8月26日，国新办举行 “开局起步‘十五五’”系列主题新闻发布会，工业和信息化部相关负责人介绍全力抓好“十五五”规划实施、加快推进新型工业化有关情况。发布会上介绍，我们将着力优化产业结构，统筹推进传统产业改造升级、新兴产业培育壮大、未来产业前瞻布局，保持和发展好完整产业体系。加快打造集成电路、航空航天、生物医药、低空经济、新型储能、智能机器人等新兴支柱产业，推动量子科技、生物制造、氢能和核聚变能、脑机接口、具身智能、第六代移动通信（6G）等未来产业成为新的经济增长点。（央视新闻）", "ctime": 1787709970, "time_str": "10:06:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260826/c679295674.shtml"}, {"id": "5029043", "title": "创业板、科创50指数双双翻绿", "content": "创业板、科创50指数双双翻绿，全市场超3000家个股下跌。油气、CPO、PCB概念板块跌幅居前。", "ctime": 1787709900, "time_str": "10:05:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260826/c679295605.shtml"}, {"id": "5029041", "title": "工信部：我国产业“向新、向优、向智、向绿”升级步伐明显加快", "content": "8月26日，国新办举行 “开局起步‘十五五’”系列主题新闻发布会，工业和信息化部相关负责人介绍全力抓好“十五五”规划实施、加快推进新型工业化有关情况。发布会上介绍，“十四五”时期，我国新型工业化持续走深走实，产业“向新、向优、向智、向绿”升级步伐明显加快，圆满完成了“十四五”规划的各项目标任务。（央视新闻）", "ctime": 1787709871, "time_str": "10:04:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260826/c679295572.shtml"}, {"id": "5029031", "title": "郑商所对二甲苯主力合约触及跌停", "content": "郑商所对二甲苯主力合约触及跌停，报7868元/吨，现跌幅为6.02%。", "ctime": 1787709837, "time_str": "10:03:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260826/c679295548.shtml"}, {"id": "5029017", "title": "也门政府军称打死至少14名胡塞武装人员", "content": "也门政府下属的“民族抵抗力量”组织25日称，当天在也门红海港口城市荷台达，至少14名胡塞武装人员在炮击和无人机袭击中被打死。根据“民族抵抗力量”组织发表的声明，该组织25日对荷台达市以南的胡塞武装相关目标实施了一系列炮击和无人机袭击，打击了包括指挥和控制中心在内的重要阵地。袭击击中预定目标，至少14名胡塞武装人员被打死，至少19人受伤。截至目前，胡塞武装尚未对此次袭击及人员伤亡情况作出回应。（新华社）", "ctime": 1787709701, "time_str": "10:01:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260826/c679295415.shtml"}, {"id": "5028997", "title": "电池板块短线走高 宏工科技、力王股份涨超10%", "content": "电池板块短线走高，宏工科技、力王股份涨超10%，领湃科技、德新科技、利元亨、先惠技术、纳科诺尔等跟涨。相关ETF方面，电池ETF景顺（159757）涨1.02%，成交额371.74万元，电池ETF万家（159156）涨1.02%，成交额52.98万元。", "ctime": 1787709446, "time_str": "09:57:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260826/c679295148.shtml"}, {"id": "5028993", "title": "应对厄尔尼诺威胁，巴拿马宣布全国进入紧急状态", "content": "当地时间8月25日，巴拿马内阁会议宣布全国进入紧急状态，以应对厄尔尼诺现象引发的极端天气及其带来的社会经济和环境影响。巴拿马政府部长迪诺斯卡·蒙塔尔沃表示，宣布紧急状态是为了提前应对厄尔尼诺可能在全国造成的不同影响，包括在降雨高于平均水平地区可能出现的洪水和山体滑坡，以及在降雨不足地区可能发生的干旱。巴拿马气象与水文研究所数据显示，自5月以来，太平洋一侧部分地区降雨量较正常水平减少最多60%，约11个流域面临水资源压力，影响水力发电和饮用水供应；加勒比海一侧部分地区降雨则有所增加。巴拿马气象与水文研究所表示，目前厄尔尼诺处于“非常强”级别。据美国国家海洋和大气管理局（NOAA）预测，这一现象可能持续至明年5月。（央视新闻）", "ctime": 1787709355, "time_str": "09:55:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": const SECTORS  = [{"name": "金融", "hit_count": 42, "etfs": []}, {"name": "数据要素", "hit_count": 27, "etfs": []}, {"name": "人工智能", "hit_count": 25, "etfs": []}, {"name": "消费", "hit_count": 14, "etfs": []}, {"name": "半导体", "hit_count": 13, "etfs": []}, {"name": "医药", "hit_count": 11, "etfs": []}, {"name": "军工", "hit_count": 11, "etfs": []}, {"name": "机器人", "hit_count": 8, "etfs": []}];
const META     = {"update_time": "2026-08-26 10:42:42", "sentiment_score": 54.44444444444444, "agents": []};

// 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
