ame": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260416/c676037347.shtml"}, {"id": "4236287", "title": "芯原股份戴伟民：关于友商抢单的市场传言不实", "content": "芯原股份董事长戴伟民向记者表示，市场关于友商抢单的传言不实。尽管尚未公布一季度业绩，截至2025年末公司在手订单金额达到50.75亿元，连续九个季度保持历史高位。2025年第二、第三、第四季度新签订单金额分别为11.82亿元、15.93亿元、27.11亿元，单季度新签订单金额连续三个季度突破历史新高。2025年末在手订单中，预计一年内转化为收入的比例超80%。充足的订单储备为公司未来业绩兑现筑牢根基，整体经营基本面延续稳健态势。（科创板日报）", "ctime": 1776321188, "time_str": "14:33:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260416/c676037233.shtml"}, {"id": "4236275", "title": "深证成指涨2%", "content": "深证成指涨幅扩大至2%，上证指数涨0.69%，创业板指涨3.1%。", "ctime": 1776321102, "time_str": "14:31:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260416/c676037210.shtml"}, {"id": "4236271", "title": "中证500股指期货(IC)主力合约日内涨超2%", "content": "中证500股指期货(IC)主力合约日内涨超2%，现报8075.0点。", "ctime": 1776321093, "time_str": "14:31:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260416/c676037201.shtml"}, {"id": "4236267", "title": "日韩股市集体收涨", "content": "日经225指数收涨2.38%，报59518.34点。韩国综指收涨2.21%，报6226.05点。", "ctime": 1776321067, "time_str": "14:31:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260416/c676037197.shtml"}, {"id": "4236245", "title": "电石法聚氯乙烯行业座谈会在乌鲁木齐召开", "content": "为推动电石法聚氯乙烯行业绿色发展，2026年4月13日，由中国氯碱工业协会组织的电石法聚氯乙烯生产无汞化转型工作座谈会在乌鲁木齐召开，节能与综合利用司、新疆工业和信息化主管部门、电石法聚氯乙烯重点生产企业及催化剂生产企业代表参加。会上，节能与综合利用司有关负责同志介绍了《关于汞的水俣公约》履约情况及推动电石法聚氯乙烯行业无汞化转型的总体考虑，听取了有关意见建议。中国氯碱工业协会主要负责同志介绍了我国电石法聚氯乙烯行业总体情况及无汞化催化剂研发应用情况。企业代表结合自身情况介绍了减汞工作进展及成效、无汞催化剂应用测评情况、无汞化转型在技术和经济方面面临的挑战。会议指出，无汞化转型是推动电石法聚氯乙烯行业绿色发展的重要举措，对于落实党中央、国务院关于加强重金属污染防治的决策部署、履行国际环境公约及保障聚氯乙烯产业链供应链安全稳定都具有重要意义，行业企业要高度重视，及早谋划，有序推进电石法聚氯乙烯无汞化转型。(工信部)", "ctime": 1776320996, "time_str": "14:29:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260416/c676037169.shtml"}, {"id": "4236241", "title": "天祥集团收购三井化学在印度的太阳能实验室资产", "content": "4月16日，天祥集团发表声明称，已从三井化学印度公司收购了位于古吉拉特邦艾哈迈达巴德的一座太阳能光伏实验室的资产。该新实验室将提供通过ISO 17025认证的测试服务，并具备BIS（印度标准局）和IECEE（国际电工委员会电工产品合格测试与认证组织）认证。（界面新闻）", "ctime": 1776320858, "time_str": "14:27:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260416/c676037129.shtml"}, {"id": "4236225", "title": "星际荣耀旗下航天智能制造公司再增资", "content": "企查查APP显示，近日，四川星际荣耀航天智能制造有限责任公司发生工商变更，注册资本由5亿元增加至6亿元，此前，该公司已多次增资。企查查显示，该公司成立于2018年12月，法定代表人为刘国昌，经营范围包含：火箭发动机研发与制造；民用航天发射技术服务；火箭控制系统研发等，由星际荣耀航天科技集团股份有限公司全资持股。（人民财讯）", "ctime": 1776320478, "time_str": "14:21:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260416/c676036986.shtml"}, {"id": "4236223", "title": "沪深京三市成交额超2万亿元，较上日此时缩量966亿元", "content": "据同花顺iFinD数据，沪深京三市成交额超2万亿元，较上日此时缩量966亿元，预计全天成交金额约2.3万亿元。截至目前，沪市成交额8290亿元，深市成交额11608亿元，北证50成交额110亿元。", "ctime": 1776320442, "time_str": "14:20:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260416/c676036969.shtml"}, {"id": "4236215", "title": "台积电：N2制程已进入大规模生产", "content": "台积电：N2制程已进入大规模生产。", "ctime": 1776320325, "time_str": "14:18:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260416/c676036903.shtml"}, {"id": "4236205", "title": "台积电：人工智能需求极其强劲，2026年资本支出将迈向520亿-560亿美元区间的顶端", "content": "台积电：人工智能需求极其强劲，2026年资本支出将迈向520亿-560亿美元区间的顶端。客户及客户的客户向我们发出了非常强烈的信号。芯片需求将继续非常重要，预计2026年销售额以美元计算增长30%以上。", "ctime": 1776320167, "time_str": "14:16:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260416/c676036873.shtml"}, {"id": "4236193", "title": "创业板指涨幅扩大至3%继续刷新近11年新高", "content": "创业板指涨幅扩大至3%继续刷新近11年新高，深成指涨近2%，沪指涨超0.6%。算力租赁、能源金属、小金属板块涨幅居前，全市场超4200只个股上涨。", "ctime": 1776320101, "time_str": "14:15:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260416/c676036846.shtml"}, {"id": "4236173", "title": "阿里巴巴开放式世界模型产品Happy Oyster开放体验", "content": "阿里巴巴ATH事业群打造的HappyOyster开放式世界模型产品，今日开启抢先体验入口。据了解，HappyOyster是一款可实时构建和交互的开放式世界模型产品，基于原生多模态架构，其背后是支持多模态输入与音视频联合生成的流式生成世界模型。区别于传统\"写prompt→等渲染→收到成片\"的一次性流程，HappyOyster在生成过程中持续接收用户指令，画面实时响应、持续演绎，交互性更强。", "ctime": 1776319906, "time_str": "14:11:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260416/c676036755.shtml"}, {"id": "4236155", "title": "PPIO上线PPHermes：云端沙箱一键部署Hermes Agent", "content": "4月16日，PPIO发布PPHermes，这是首个专为国内用户设计的Hermes Agent云端沙箱部署方案。用户无需编程基础，最快十分钟即可完成部署。Hermes Agent由AI研究机构Nous Research开发。相比海外沙箱方案，PPHermes专为Hermes设计CLI工具链，支持一条命令完成启动、暂停与恢复；内置飞书集成；零配置接入Claude Code、Cursor等AI编程工具；按需计费，有效降低长期使用成本。（科创板日报）", "ctime": 1776319683, "time_str": "14:08:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260416/c676036643.shtml"}, {"id": "4236151", "title": "台积电预计第二季度销售额390亿美元至402亿美元，市场预估381.1亿美元", "content": "台积电预计第二季度销售额390亿美元至402亿美元，市场预估381.1亿美元。预计第二季度毛利率65.5％至67.5％，市场预估64.1％。预计第二季度营业利润率为 56.5%至58.5%，市场预期为55.3%。", "ctime": 1776319661, "time_str": "14:07:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260416/c676036632.shtml"}, {"id": "4236015", "title": "美媒：监管机构正调查伊朗战事期间可疑石油期货交易", "content": "多家美国媒体15日报道，美国商品期货交易委员会正在调查一系列“精准踩点”的疑似石油期货内幕交易，这些交易发生在美国总统特朗普发布与伊朗战事相关的重大政策转向之前。 彭博社援引匿名消息人士的话报道说，商品期货交易委员会的调查重点聚焦在芝加哥商品交易所和伦敦洲际交易所交易平台上的石油期货合约交易。目前，调查人员正在审查至少两笔分别发生于3月23日和4月7日的石油期货交易，要求两家交易所提供交易账号身份等信息。 据报道，特朗普在3月23日宣布推迟袭击伊朗能源基础设施以及4月7日宣布停火两周之前，石油期货交易均突然放大，导致油价大幅波动。 美国国会参议院银行委员会民主党籍议员伊丽莎白·沃伦在一份声明中说，这些可疑的石油期货交易看起来是内部人士操纵市场的案例，监管机构应在调查特朗普政府官员内幕交易方面做得更多。 路透社报道，商品期货交易委员会主席迈克尔·塞利格表示，任何在市场上从事欺诈、操纵或内幕交易的人，都将面临法律的惩罚。(新华社)", "ctime": 1776319054, "time_str": "13:57:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260416/c676036359.shtml"}, {"id": "4236013", "title": "港股芯片股继续上涨，壁仞科技涨超25%", "content": "港股芯片股继续上涨，壁仞科技涨超25%，天数智芯涨超15%，爱芯元智涨超10%，兆易创新、澜起科技、纳芯微跟涨。", "ctime": 1776319025, "time_str": "13:57:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260416/c676036336.shtml"}, {"id": "4236011", "title": "IMF总裁：各国应节约能源以应对冲击", "content": "国际货币基金组织（IMF）总裁格奥尔基耶娃15日在一场发布会上表示，IMF对中东战事导致石油和天然气供应中断深感担忧，未来几周内供应中断的影响可能加剧。她呼吁各国采取节约能源的措施，以缓解供需失衡局面。 IMF和世界银行春季会议本周在美国首都华盛顿举行。格奥尔基耶娃在发布会上说，石油和天然气、石化中间品石脑油和氦气当前已经出现了供应短缺，并已对经济运行造成干扰。这一情况正在促使各国重新思考如何降低能源需求。 她敦促各国立即采取措施降低能源用量，并表示一些国家已经采取相关措施，例如让民众免费搭乘公共交通，或倡导居家办公等。 格奥尔基耶娃说，这场冲突对全球经济的影响相当显著。即便冲突持续时间较短，基础设施的破坏和供应链的中断也在推高价格水平，2026年全球经济增长预计将放缓至3.1%。 IMF于14日发布的最新一期《世界经济展望报告》显示，在“不利情景”和“严重下行情景”的假设中，全球经济增长可能分别降至2.5%和2%。 格奥尔基耶娃表示，这场冲突对经济增长和通胀的影响程度，将取决于供应中断持续的时间，以及海湾地区能源基础设施受损的程度。新的能源来源、新的运输路线建设需要时间。在此期间，各国应采取措施以减少供需失衡的影响。(新华社)", "ctime": 1776319023, "time_str": "13:57:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260416/c676036335.shtml"}, {"id": "4236003", "title": "中岩大地等成立科技公司，含半导体器件相关业务", "content": "企查查APP显示，近日，成都高新束研大地科技有限公司成立，注册资本1500万元，经营范围包含：电工机械专用设备制造；电子专用设备制造；半导体器件专用设备制造；半导体器件专用设备销售等。企查查股权穿透显示，该公司由中岩大地全资子公司北京中岩大地星核科技有限公司等共同持股。（人民财讯）", "ctime": 1776318821, "time_str": "13:53:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260416/c676036271.shtml"}, {"id": "4235985", "title": "俄黑海港口城市遭 // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
