url": "https://news.10jqka.com.cn/20260721/c678314444.shtml"}, {"id": "4764789", "title": "A股午评：创业板指触底反弹涨5.2% AI产业链方向领涨市场", "content": "截至午盘，上证指数涨0.62%，深证成指涨3.41%，创业板指涨5.2%，北证50涨1.14%。三市成交额20120亿元，较上日放量3300亿元。全市场超2600家个股上涨。\n板块题材上，半导体、CPO、元件板块涨幅居前；油气、医药板块跌幅居前。\n盘面上， 半导体板块触底反弹走强，大为股份、北方华创、新洁能、格科微、金海通、臻宝科技、托伦斯涨停，长川科技、东芯股份、东微半导、联动科技、中科飞测、华虹宏力、屹唐股份、强一股份涨超15%。CPO板块走高，国瓷材料20CM涨停，共进股份、联创电子等数十只个股涨停。元件板块大幅反弹，顺络电子涨停，金禄电子涨超15%，三环集团、中富电路、达利凯普涨超10%。油气板块跌幅居前，科力股份跌超10%，通源石油跌超8%。医药板块今日调整，灵康药业、亚泰集团触及跌停，万邦医药跌超10%。", "ctime": 1784604868, "time_str": "11:34:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260721/c678314346.shtml"}, {"id": "4764783", "title": "交通运输部：交通基础设施更新改造投资占比到2030年达到50%左右", "content": "交通运输部副部长徐成光21日在国新办举行的“开局起步‘十五五’”系列主题新闻发布会上表示，在推进跨区域跨流域大通道建设的过程中，交通运输部将重点推进交通基础设施更新和数智化改造。实施8万公里左右交通基础设施更新和数智化改造，使更新改造的投资占交通固定资产投资的比重到2030年达到50%左右，力争以较少的资金、土地等要素的投入，促进现有设施功能完善、效率提升、韧性增强、绿色低碳，达到“一次更新、全方位提升”的目的。(上海证券报)", "ctime": 1784604800, "time_str": "11:33:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260721/c678314304.shtml"}, {"id": "4764781", "title": "ETF两市成交额报4392.17亿元，较昨日此时放量761.86亿元", "content": "截至目前，ETF两市成交额报4392.17亿元，较昨日此时放量761.86亿元，分类型来看，股票型ETF成交额1868.57亿元，债券型ETF成交额1534.93亿元，货币型ETF成交额180.92亿元，商品型ETF成交额29.01亿元，QDII型ETF成交额778.52亿元。", "ctime": 1784604741, "time_str": "11:32:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260721/c678314279.shtml"}, {"id": "4764779", "title": "印尼股市基准指数上涨1%", "content": "印尼股市基准指数上涨1%至6292.92点。", "ctime": 1784604735, "time_str": "11:32:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260721/c678314276.shtml"}, {"id": "4764769", "title": "ETF午评：科创半导体ETF领涨10.79%，能源ETF领跌3.9%", "content": "ETF午间收盘涨跌不一，科创半导体ETF（58817 cn/20260721/c678314055.shtml"}, {"id": "4764743", "title": "港股恒生科技指数涨幅达1%", "content": "港股恒生科技指数涨幅扩大至1%，恒生指数现跌0.27%。", "ctime": 1784604316, "time_str": "11:25:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260721/c678314035.shtml"}, {"id": "4764735", "title": "创历史新高 洋山深水港上半年箱量突破1500万标箱", "content": "据“上海临港”公众号消息，今年上半年，洋山深水港累计完成集装箱吞吐量1519.39万标准箱，同比增长8.11%，半年度箱量刷新历史纪录。", "ctime": 1784604167, "time_str": "11:22:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260721/c678313987.shtml"}, {"id": "4764733", "title": "国家铁路局：坚持适度超前、不过度超前，全力推进一批重大工程建设", "content": "7月21日上午，国务院新闻办公室举办介绍加快建设交通强国、完善现代化综合交通运输体系有关情况的新闻发布会。国家铁路局新闻发言人、副局长王启铭介绍了“十五五”期间如何进一步推动铁路网络建设提质增效的举措。“十五五”时期，我国铁路将以基本实现现代化为总目标，坚持适度超前、不过度超前，突出安全化提升、协调化布局、数智化升级、绿色化转型、融合化发展、系统化治理，全力推进一批重大工程的建设。加快补齐路网短板、打通瓶颈制约、畅通网络循环，加快建设覆盖广泛、结构合理、功能完备、集成高效的现代化铁路网，从“基本适应”迈向“提质增效”新阶段。服务国家区域协调发展战略、区域重大战略、新型城镇化战略和乡村振兴战略，为中国式现代化建设注入强劲的动力，提供关键的支撑。(澎湃新闻)", "ctime": 1784604143, "time_str": "11:22:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260721/c678313972.shtml"}, {"id": "4764731", "title": "美军称对伊朗实施5小时打击", "content": "美军中央司令部20日在社交媒体上发表声明称，美军已于美国东部时间20日21时（北京时间21日9时）完成对伊朗的新一轮打击行动。此轮打击持续时间约为5小时。声明说，美军此轮军事行动打击了伊朗军事指挥中心、海上作战能力、导弹和无人机发射阵地及防空系统，以“削弱伊朗持续袭击霍尔木兹海峡商船的能力”。(新华社)", "ctime": 1784604069, "time_str": "11:21:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260721/c678313944.shtml"}, {"id": "4764725", "title": "韩国综指涨幅扩大至4%", "content": "韩国综指涨幅扩大至4%，现报6777.32点。个股方面，三星电子涨超6%，SK海力士涨超4%。", "ctime": 1784603874, "time_str": "11:17:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260721/c678313861.shtml"}, {"id": "4764723", "title": "瑞银：Kimi K3性能已接近领先闭源前沿模型 中国AI模型有望逐步获得全球市场份额", "content": "瑞银发表报告指出，作为全球最大的开源LLM，Kimi K3性能已接近领先的闭源前沿模型。阿里巴巴宣布Qwen 3.8-Max预览版，据报目标性能接近Fable 5，而DeepSeek V4 GA(正式版)潜在发布则可能进一步强化中国模型在成本效率方面的优势。瑞银相信中国的开源生态将加速技术扩散并产生研发协同效应，帮助更多中国AI实验室缩小与全球同业的能力差距。重申成本效率仍是中国AI模型的核心优势，并相信在产业转向Token优化的趋势下，它们有望逐步获得全球市场份额。", "ctime": 1784603809, "time_str": "11:16:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260721/c678313809.shtml"}, {"id": "4764695", "title": "中证500股指期货(IC)主力合约日内涨超5%", "content": "中证500股指期货(IC)主力合约日内涨超5%，现报7572.4点。", "ctime": 1784603330, "time_str": "11:08:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260721/c678313561.shtml"}, {"id": "4764691", "title": "交通运输部：“十五五”时期我国将基本建成现代化综合交通运输体系", "content": "国务院新闻办公室举行“开局起步‘十五五’”系列主题新闻发布会，交通运输部副部长徐成光表示，“十五五”时期，我国交通运输发展进入新的发展阶段，总体目标是基本建成现代化综合交通运输体系，关键词是“一网四化”。一网，是建设现代化高质量国家综合立体交通网，做优增量、提质存量，厚植设施网络优势，补齐网络发展短板。四化，是紧扣交通运输现代化发展要求，加强一体化融合，强化安全化提升，突出数智化升级，注重绿色化转型。（央视新闻）", "ctime": 1784603272, "time_str": "11:07:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260721/c678313531.shtml"}, {"id": "4764687", "title": "多只半导体设备ETF触及涨停", "content": "多只半导体设备ETF触及涨停。持仓股中，中微公司、长川科技、拓荆科技等数只个股涨超10%。", "ctime": 1784603240, "time_str": "11:07:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260721/c678313502.shtml"}, {"id": "4764685", "title": "国家铁路局：我国铁路网建设将围绕三方面发力", "content": "国家铁路局新闻发言人、副局长王启铭在国新办新闻发布会上表示，今年上半年，铁路固定资产投资继续保持在高位，累计完成投资3632亿元，同比增长了2.1%，为扩内需、稳增长发挥了重要作用。下一步，我国铁路网建设将围绕三个方面发力。一是畅通道，加强战略骨干通道建设。强化沿江沿海沿边通道布局，推进跨区域战略通道建设，加强跨江跨海跨湾通道建设，健全多元韧性的跨境铁路通道体系，不断提升铁路战略支撑保障能力。二是优结构，提升铁路网络结构功能。加快贯通“八纵八横”高铁主通道，有序推进重点区域高铁连接线建设，加强重点城市群都市圈通勤能力提升。补齐西部路网“留白”，强化能源粮食运输通道建设，加快打通繁忙干线运输瓶颈，推动货运网络能力提升。三是强节点，完善铁路枢纽体系。加快推进北京等重点铁路 const SECTORS  = [{"name": "金融", "hit_count": 41, "etfs": []}, {"name": "人工智能", "hit_count": 20, "etfs": []}, {"name": "半导体", "hit_count": 19, "etfs": []}, {"name": "数据要素", "hit_count": 15, "etfs": []}, {"name": "消费", "hit_count": 9, "etfs": []}, {"name": "军工", "hit_count": 8, "etfs": []}, {"name": "新能源", "hit_count": 5, "etfs": []}, {"name": "低空经济", "hit_count": 3, "etfs": []}];
const META     = {"update_time": "2026-07-21 12:41:31", "sentiment_score": 59.79381443298969, "agents": []};

// 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
