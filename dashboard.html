 "16:48:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260417/c676077544.shtml"}, {"id": "4242351", "title": "亚翔集成：南亚科技DRAM晶圆厂项目由母公司进行接洽与推进", "content": "亚翔集成在互动平台上回答投资者提问时表示，南亚科技新建12英寸DRAM晶圆厂的项目由母公司台湾亚翔工程负责接洽与推进，而亚翔集成目前并未直接参与该项目的规划或竞标。（人民财讯）", "ctime": 1776415569, "time_str": "16:46:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260417/c676077456.shtml"}, {"id": "4242339", "title": "厦门证监局联合多部门举办辖区企业上市培育专题培训活动", "content": "为加强资本市场改革政策精神宣导，传导监管要求，扎实做好科技创新企业上市资源培育工作，近期，厦门证监局联合厦门市委金融办、市工信局、沪深北交易所举办拟上市企业专题培训会议，厦门证监局负责人出席会议并致辞，辖区80余家专精特新、制造业单项冠军企业代表共计150余人参会。会上，厦门证监局负责人宣讲了“十五五”规划纲要、2026年政府工作报告关于深化资本市场投融资综合改革重要部署，以及中国证监会深化“双创板”改革、推进北交所和新三板一体化高质量发展政策精神，通报了辖区企业发行上市情况，就做好辖区优质科技创新企业上市资源培育工作提出了有关意见。厦门市委金融办和市工信局负责人分别介绍了厦门市扶持专精特新企业、培育上市资源的有关政策举措。沪深北交易所专家结合各市场板块定位，系统讲解了最新上市规则、审核要点及培育服务体系，结合典型案例深入剖析了不同市场板块的定位差异、财务指标、行业偏好及核心审核关注点等。参会企业代表纷纷表示，本次培训内容务实、重点突出、干货十足，有助于企业全面系统地理解最新发行上市政策，进一步厘清对上市工作的认知误区，增强企业对接资本市场、谋求高质量发展的信心。(证监会)", "ctime": 1776415324, "time_str": "16:42:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260417/c676077322.shtml"}, {"id": "4242331", "title": "惠博普修正2025年度业绩预告 预计净利润为亏损3.5亿元至3.7亿元", "content": "惠博普发布2025年度业绩预告修正公告，预计净利润为亏损3.5亿元至3.7亿元。公司原预计净利润为亏损1.5亿元至2亿元。", "ctime": 1776415266, "time_str": "16:41:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260417/c676077290.shtml"}, {"id": "4242323", "title": "法兰泰克：2025年净利润2.35亿元，同比增长40.53%", "content": "法兰泰克公告，2025年营业收入24.28亿元，同比增长14.02%。净利润2.35亿元，同比增长40.53%。公司拟向全体股东每股派发现金红利0.28元（含税）。", "ctime": 1776415191, "time_str": "16:39:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260417/c676077222.shtml"}, {"id": "4242307", "title": "特朗普怒批白宫宴会厅改造“禁令”，称宴会厅“对国家安全至关重要”", "content": "美国哥伦比亚特区联邦地区法院法官理查德·莱昂16日延长了白宫宴会厅改造项目的暂停令，只允许建设掩体等地下安全设施。美国总统特朗普对该裁决猛烈抨击，称“决不接受”。特朗普当天在社交媒体上发文称，“这座宴会厅对国家安全至关重要，绝不容许任何法官阻挠这一具有历史意义且在军事上具有绝对必要性的重大项目”。莱昂3月底曾下令特朗普政府暂停白宫宴会厅改造项目，直至获得国会授权。(新华社)", "ctime": 1776415032, "time_str": "16:37:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260417/c676077171.shtml"}, {"id": "4242301", "title": "美军确认一MQ-4C无人机坠毁", "content": "美军确认一MQ-4C无人机坠毁美国海军方面当地时间4月15日证实，4月9日，美军一架MQ-4C“人鱼海神”无人机坠毁，“地点保密，无人受伤”。美国海军未提供更多信息，没有公布记录，没有给出坐标，没有确认原因。对于这架在绝大多数防空系统射程之上飞行的、价值约2.4亿美元的无人机是如何坠落的，只字未提。这架无人机2.4亿美元的价值超过了两架F-35战机。这是美国在美以伊战争中确认的“单项最昂贵空中损失”。据美国媒体报道，4月9日，这架美军最贵无人侦察机在波斯湾上空执行任务。飞行追踪网站捕捉到这架无人机发出“7700”代码（紧急信号），之后无人机急剧转向伊朗领空，并开始快速、失控下坠，紧接着便从所有监控屏幕上一闪而逝。据称，MQ-4C“人鱼海神”能飞越5万英尺（合15240米）高空，连续滞空24小时，在不加油的情况下覆盖7400海里（合13704.8公里），其360度传感器阵列能追踪数百万平方公里海域内的威胁，并实时向战舰、巡逻机和指挥中心同步传输情报。(CCTV国际时讯)", "ctime": 1776414802, "time_str": "16:33:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260417/c676077053.shtml"}, {"id": "4242295", "title": "宝地矿业：2025年净利润1.4亿元，同比增长1.47%", "content": "宝地矿业公告，2025年营业收入16.12亿元，同比增长34.78%。净利润1.4亿元，同比增长1.47%。公司本次利润分配拟以实施权益分派股权登记日登记的总股本为基数，向全体股东每10股派发现金红利0.7170元人民币（含税）。", "ctime": 1776414753, "time_str": "16:32:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260417/c676077025.shtml"}, {"id": "4242291", "title": "鹏鹞环保：实控人王洪春犯内幕交易罪 有期徒刑二年六个月", "content": "鹏鹞环保公告，公司实际控制人之一王洪春因涉嫌内幕交易罪被无锡市公安局刑事拘留。2026年4月17日，王洪春收到江苏省无锡市中级人民法院出具的《刑事判决书》，被判处有期徒刑二年六个月，缓刑二年六个月，并处罚金人民币一千零六十万元。侦查机关扣押案款中的人民币526.4万元系王洪春的犯罪违法所得，依法予以没收，上缴国库。王洪春未担任公司董事或高级管理人员职务，判决不影响其股东权利行使及公司管理层的依法规范运作，不会对公司的生产经营产生重大不利影响。", "ctime": 1776414725, "time_str": "16:32:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260417/c676077013.shtml"}, {"id": "4242287", "title": "赛力斯入股宝马奔驰在华超充合资公司", "content": "4月17日，宝马与奔驰在华成立的超充合资公司“逸安启”宣布，赛力斯正式加入成为新股东。至此，赛力斯、宝马、奔驰三方各持股33.3%。通过此次股权投资，赛力斯旗下品牌问界将支持逸安启豪华超充基础设施建设。逸安启充电网络面向所有电动汽车用户开放，同时宝马、问界及奔驰车主还可享受预约充电、功率优先分配等专属权益。（第一财经）", "ctime": 1776414674, "time_str": "16:31:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260417/c676076985.shtml"}, {"id": "4242283", "title": "天风证券：首席风险官陈潇华不再兼任合规总监", "content": "天风证券公告，公司第四届董事会第六十一次会议通过聘任靳天鹏先生为合规总监的议案，待监管认可后正式履职。首席风险官陈潇华先生不再兼任合规总监。陈潇华先生的合规总监职务离任时间为靳天鹏先生获得监管认可后正式履职之时。公司第四届董事会任期届满，因换届选举工作尚未完成，董事会成员及高级管理人员继续履行职责。本次合规总监调整不会对公司日常生产经营活动产生重大不利影响。", "ctime": 1776414458, "time_str": "16:27:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260417/c676076835.shtml"}, {"id": "4242277", "title": "世嘉科技今日涨停，3家机构专用席位净买入1.04亿元", "content": "世嘉科技今日涨停，成交额16.29亿元，换手率13.87%，盘后龙虎榜数据显示，3家机构专用席位净买入1.04亿元。", "ctime": 1776414363, "time_str": "16:26:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260417/c676076800.shtml"}, {"id": "4242275", "title": "光迅科技今日涨停，2家机构专用席位净买入1.07亿元", "content": "光迅科技今日涨停，成交额71.17亿元，换手率8.00%，盘后龙虎榜数据显示，深股通专用席位买入8.25亿元并卖出2.44亿元，2家机构专用席位净买入1.07亿元，有1家机构专用席位净卖出4454.56万元。", "ctime": 1776414341, "time_str": "16:25:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260417/c676076784.shtml"}, {"id": "4242273", "title": "华昌化工：2025年净亏损2.04亿元", "content": "华昌化工公告，2025年营业收入65.06亿元，同比下降17.96%。归属于上市公司股东的净亏损2.04亿元，上年同期净利润5.21亿元。公司董事会审议通过的利润分配预案为：以9.52亿为基数，向全体股东每10股派发现金红利1元（含税），送红股0股（含税），不以公积金转增股本。", "ctime": 1776414312, "time_str": "16:25:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/ const META     = {"update_time": "2026-04-17 17:04:06", "sentiment_score": 54.824561403508774, "agents": []};

// 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
