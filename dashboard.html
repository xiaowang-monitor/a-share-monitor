a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260916/c679968360.shtml"}, {"id": "5184595", "title": "海螺水泥：吴铁军辞任副总经理，聘任3名高级管理人员", "content": "海螺水泥公告，2026年9月16日，公司董事会收到执行董事、副总经理吴铁军书面辞职报告，因个人工作变动辞去副总经理职务，仍担任执行董事、ESG管理委员会委员及部分附属公司董事。同日，董事会一致同意聘任李鑫、刘庆新为副总经理，程小兵为总经理助理；李鑫、刘庆新不再担任总经理助理。", "ctime": 1789546852, "time_str": "16:20:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260916/c679967948.shtml"}, {"id": "5184587", "title": "王毅同伊朗外长阿拉格齐会谈", "content": "2026年9月16日，中共中央政治局委员、外交部长王毅在北京同伊朗外长阿拉格齐举行会谈。王毅表示，当前中东形势持续动荡，严重影响国际和平与发展。中国作为安理会常任理事国，愿意为解决国际争端发挥建设性作用。中伊两国是全面战略伙伴，中国也愿同伊朗加强对话合作，维护好伊朗的正当权益。美伊战事继续延宕不符合当事方和国际社会共同利益。我们鼓励伊朗和美国保持理性和克制，尽快回归伊斯兰堡谅解备忘录，根据迄今达成的共识，重构谈判机制，就各自关切的问题进行实质性磋商。我们支持伊朗同海湾国家开展对话，尊重彼此领土主权和国家安全，以建设性方式维护地区共同利益。我们敦促各方采取有效措施，早日开放霍尔木兹海峡，维护国际航道畅通安全，维护国际能源运输和产供链稳定。我们不希望地区紧张向也门和红海方向进一步外溢。呼吁各方停止使局势进一步复杂化，通过对话谈判解决问题。(外交部网站)", "ctime": 1789546838, "time_str": "16:20:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260916/c679967926.shtml"}, {"id": "5184583", "title": "龙迅股份：支持PCIe3.0的SATA主控芯片进入量产推广阶段 基于PCIe的USB主控芯片进入流片", "content": "龙迅股份董事长、总经理FENG CHEN在今日召开的2026年半年度业绩说明会上表示，公司聚焦数据中心、AI&HPC等场景下高速数据传输，重点开发PCIe/CXL核心技术，针对性解决算力场景信号衰减、信号完整性难题，打造高性能计算互连方案，完善AI全域产品布局。其中，支持PCIe3.0的SATA主控芯片将于近期进入量产推广阶段，HDMI转PCIe4.0的桥接芯片在流片阶段，PCIe5.0 Retimer（兼容CXL2.0）测试芯片已于今年6月进入流片阶段；基于PCIe的USB主控芯片也将于近期进入流片阶段；面向数据中心与AI集群，用于多设备扩展、算力池化、GPU互连的PCIe5.0/CXL2.0 Switch目前在进行IP预研等工作。（科创板日报）", "ctime": 1789546699, "time_str": "16:18:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260916/c679967731.shtml"}, {"id": "5184575", "title": "珠海港：电力集团拟认购公募REITs不超过7%，待申报", "content": "珠海港公告，公司全资子公司电力集团参股企业拟以珠海金湾（300MW）海上风电项目为底层资产申报发行公募REITs，电力集团拟认购不超过7%份额，认购金额预计不超过人民币3.5亿元。相关方案已于2026年9月16日经公司第十一届董事局第三十一次会议审议通过，目前处于待申报阶段，尚需国家发改委、深圳证券交易所、中国证券监督管理委员会等有权机构审核同意。", "ctime": 1789546651, "time_str": "16:17:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260916/c679967659.shtml"}, {"id": "5184547", "title": "基元律动与无问芯穹达成战略合作，将围绕高质量Token的供给、调度与应用展开合作", "content": "9月15日，AI基础设施公司基元律动（TokenRhythm）与无问芯穹（Infinigence AI）签署战略合作协议。双方将围绕高质量Token的供给、调度与应用展开合作，共同开拓市场。（人民财讯）", "ctime": 1789546491, "time_str": "16:14:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260916/c679967459.shtml"}, {"id": "5184545", "title": "今年前8月全国铁路完成固定资产投资5118亿元", "content": "记者16日从中国国家铁路集团有限公司获悉，今年以来，铁路建设稳步推进，1至8月全国铁路完成固定资产投资5118亿元，同比增长1.5%，现代化铁路基础设施体系加快构建，有效带动相关产业发展和增收就业，为扩内需、稳增长注入新动能。(新华社)", "ctime": 1789546462, "time_str": "16:14:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260916/c679967421.shtml"}, {"id": "5184529", "title": "康鹏科技：拟出售安徽觅拓16.16%股权", "content": "康鹏科技公告，公司拟以1.13亿元向瑞丰高材转让所持安徽觅拓16.16%股权，并放弃其他股东转让股权的优先受让权及新增注册资本的优先认购权。2026年9月16日，公司第三届董事会第十三次会议审议通过相关议案，本次交易尚需提交公司股东会审议。", "ctime": 1789546327, "time_str": "16:12:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260916/c679967248.shtml"}, {"id": "5184507", "title": "港股收评：恒生指数涨0.19%，恒生科技指数涨0.79%", "content": "港股收盘，恒生指数涨0.19%，恒生科技指数涨0.79%。恒指港股通ETF银华（159318）跌0.16%，港股通科技ETF鹏华（159751）持平。板块方面，油品石化贸易、广告营销板块涨幅靠前；广播、安全和报警服务板块跌幅靠前。个股方面，海清智元涨36.09%，白鸽在线涨20.2%，海光芯正涨16.65%，深演智能涨14.47%，天域半导体涨13.87%；真健康医疗-B跌8.17%，德适-B跌6.76%，凯乐士科技跌6.53%，思格新能跌6.02%，溜溜梅跌5.93%。", "ctime": 1789546206, "time_str": "16:10:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260916/c679967075.shtml"}, {"id": "5184501", "title": "古鳌科技：新增重大诉讼，单案涉案2212.09万元", "content": "古鳌科技公告，公司收到上海金融法院相关法律文书，新增两起操纵证券交易市场责任纠纷，法院已受理，尚未正式开庭。公司与持股5%以上股东陈崇军为共同被告，案件一诉请赔偿2212.09万元，案件二诉请赔偿2012万元，另包括交易费用、资金占用利息及案件受理费等。", "ctime": 1789546192, "time_str": "16:09:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260916/c679967011.shtml"}, {"id": "5184489", "title": "崇达技术：普诺威竞得两宗地块，价款2132.65万元", "content": "崇达技术公告，公司此前披露拟由控股子公司普诺威投资建设端侧功能性IC封装载板项目，总投资为人民币10亿元。近日，普诺威竞得昆山市千灯镇两宗地块并签署国有建设用地使用权出让合同，两宗地块出让价款合计人民币2132.65万元，标志着项目土地取得工作取得实质性进展。", "ctime": 1789546091, "time_str": "16:08:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260916/c679966639.shtml"}, {"id": "5184413", "title": "全国累计收购小麦1亿吨", "content": "记者16日从国家粮食和物资储备局获悉，目前，夏粮旺季收购接近尾声，秋粮收购各项准备工作已基本就绪。全国累计收购小麦1亿吨、早籼稻1200万吨，进度略快于上年。（新华社）", "ctime": 1789545704, "time_str": "16:01:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260916/c679965296.shtml"}, {"id": "5184403", "title": "美股大型科技股盘前涨跌互现，SK海力士涨超3%", "content": "美股大型科技股盘前涨跌互现，SK海力士涨超3%，美光科技涨超1%，英伟达涨0.6%，特斯拉涨0.3%，Meta、SpaceX涨0.2%；亚马逊、苹果、谷歌A持平；微软跌0.2%。", "ctime": 1789545671, "time_str": "16:01:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260916/c679965147.shtml"}, {"id": "5184399", "title": "美股中概股盘前涨跌互现，携程涨4%", "content": "美股中概股盘前涨跌互现，携程涨4%，理想汽车、蔚来涨1%，拼多多涨0.3%，贝壳跌0.5%，阿里巴巴跌0.7%，百济神州跌0.9%，哔哩哔哩跌1%。", "ctime": 1789545667, "time_str": "16:01:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260916/c679965129.shtml"}, {"id": "5184341", "title": "金智科技：中标项目合计1.62亿元", "content": "金智科技公告，公司中标国家电网有限公司及其下属子公司、中国南方电网有限责任公司相关项目，中标金额1.15亿元；全资子公司中标上海华力集成电路制造有限公司项目，中标金额4697.09万元，合计1.62亿元，占公司2025年度营业总收入的10.39%。目前中标通知书已收到，合同陆续签署中。", "ctime": 1789545508, "time_str": "15:58:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260916/c679964923.shtml"}, {"id": "5184297", "title": "福州长乐国际机场T2航站楼投运", "content": "9月16日，福州长乐国际机场T2航站楼投入运营。随着首班MF8487航班从T2航站楼顺利出港，福州长乐国际机场正式迈入“双航站楼双跑道”时代。据了解，作为展示城市形象的窗口，T2航站楼以“千秋福韵、丝路帆远”为核心理念，将福州古厝、茉莉花等闽都文化符号融入建筑肌理。此外，T2航站楼在值机、安检及口岸通关等各环节部署智能化系统，让旅客通行更高效。（新华社）", "ctime": 1789545291, "time_str": "15:54:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260916/c679964819.shtml"}, {"id": "5184293", "title": "雷军：小米汽车累计路测超4000万公里", "content": "9月16日，第24届亚洲质量网组织大会上，小米创办人、董事长兼CEO雷军发表主题演讲，首次系统披露小米质量管理体系。雷军介绍，截至8月31日，小米累计投入2696辆测试车，路测里程超4000万公里，覆盖高寒、高温、高原等极端环境，上市后仍持续泛化测试。（人民财讯）", "ctime": 1789545279, "time_str": "15:54:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260916/c679964815.shtml"}, {"id": "5184283", "title": "天益医疗：子公司多个新产品获药品注册证书含4.25%规格", "content": "天益医疗公告，子公司宁波天益药业科技有限公司近日收到国家药品监督管理局颁发的多个《药品注册证书》，涉及低钙腹膜透析液和腹膜透析液，均为化学药品4类，涵盖1.5%、2.5%、4.25%葡萄糖浓度及2000ml/袋、5000ml/袋规格。", "ctime": 1789545227, "time_str": "15:53:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260916/c679964798.shtml"}, {"id": "5184255", "title": "夏粮收购接近尾声 收购总量超1亿吨", "content": "国家粮食和物资储备局今天（16日）发布消息，全国夏粮旺季收购已接近尾声，市场整体平稳有序。夏粮旺季收购开展以来，坚持“市场主导、政策托底”，各地因地制宜组织产销协作与农企对接。目前全国累计收购小麦超1亿吨，早籼稻1200万吨，进度略快于上年。今年各地准备夏粮仓容1.1亿吨，农发行先期投放专项信贷1500亿元，中储粮、中粮、供销粮油等龙头企业带头入市，做到“钱等粮、仓等粮”，保障农户售粮顺畅。国家有关部门及时在河南、安徽启动小麦最低收购价执行预案，在江西、湖南启动早籼稻最低收购价执行预案，目前已收购最低收购价小麦120万吨、早籼稻90万吨，较好地发挥了稳市场、稳预期作用。（央视新闻）", "ctime": 1789545056, "time_str": "15:50:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260916/c679964714.shtml"}, {"id": "5184253", "title": "骏成科技：拟现金收购江苏新通达50%股份，审计评估推进中", "content": "骏成科技公告，公司拟以现金方式收购江苏新通达电子科技股份有限公司50%股份，交易构成关联交易，预计构成重大资产重组，交易完成后江苏新通达将成为公司控股子公司。目前，公司正组织中介机构开展尽职调查、审计、评估等工作，并与相关方持续沟通，尚未签署正式交易文件。", "ctime": 1789545051, "time_str": "15:50:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260916/c679964712.shtml"}, {"id": "5184251", "title": "山科智能：收到人民币2314.84万元项目中标通知书", "content": "山科智能公告，公司近日收到巴林左旗福泽自来水有限责任公司的《中标通知书》，确认公司为“2025年赤峰市巴林左旗林东城区水表计量装置、校表平台及水质检测设备更新改造项目水表、阀门、管材（配套管件）及水质检测设备采购项目”的中标人，中标价为人民币2314.84万元。公司称，项目顺利实施将对经营业绩产生积极影响。", "ctime": 1789545040, "time_str": "15:50:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260916/c679964710.shtml"}, {"id": "5184229", "title": "新材料领域国际标准建设再突破 两项中国牵头标准相继发布", "content": "记者今天了解到，我国牵头制定的《纳米制造 产品规格 第3-6部分：石墨烯相关产品 空白详细规范：氧化石墨烯粉体及分散液》是全球氧化石墨烯领域首个由中国主导的国际标准，另一项《纳米制造 关键控制特性 第6-24部分：石墨烯相关产品 石墨烯层数：光学对比度法》是全球首个化学气相沉积（CVD）石墨烯薄膜层数分布的光学对比度检测国际标准。（央视新闻）", "ctime": 1789544958, "time_str": "15:49:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260916/c679964644.shtml"}, {"id": "5184213", "title": "广安爱众等成立数字能源科技公司", "content": "企查查APP显示，近日，深圳市爱众同燊数字能源科技有限公司成立，法定代表人为张军辉，注册资本为1000万元，经营范围包含合同能源管理；节能管理服务；高效节能技术装备制造；高效节能技术装备销售；互联网数据服务等。企查查股权穿透显示，该公司由广安爱众全资子公司成都爱众云算科技有限公司、深圳熠辉投资发展有限公司共同持股。（人民财讯）", "ctime": 1789544844, "time_str": "15:47:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260916/c679964559.shtml"}, {"id": "5184203", "title": "前8个月中老铁路进出口货值同比增长31.5%", "content": "据昆明海关统计，今年前8个月，经中老铁路进出口货物382.2万吨，货值233.8亿元，同比分别增长1.6%、31.5%；出口112.4亿元、进口121.4亿元，同比均增长31.5%，“黄金线路”效应持续释放。进口品类日益丰富。经中老铁路进口鲜榴莲、鲜山竹等热带水果52.6亿元、同比增长12.3%，占中老铁路进口总值的43.4%；进口金属矿砂等大宗商品24.9亿元，同比增长28.7%。出口结构持续向“新”。经中老铁路出口机电产品74.2亿元，同比增长58.4%，占中老铁路出口总值的66%。其中外贸“新三样”表现亮眼，出口光伏产品20.4亿元、新能源汽车6.9亿元，同比分别增长245.3%、326.1%，“中国智造”加速出海。（央视新闻）", "ctime": 1789544692, "time_str": "15:44:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260916/c679964512.shtml"}, {"id": "5184179", "title": "北京中关村：到2030年基本建成世界领先科技园区", "content": "记者16日了解到，中共北京市委教育科技人才工作领导小组近日印发《“十五五”时期中关村世界领先科技园区建设规划》，提出到2030年基本建成世界领先科技园区。“十五五”时期是中关村建设世界领先科技园区的关键阶段，规划立足中关村作为北京（京津冀）国际科技创新中心主阵地定位，提出到2030年，企业研究与试验发展经费支出占增加值比重达9.0%左右，世界一流科技企业数量达110家，独角兽企业数量达105家，园区营业收入达13.5万亿元，战略性新兴产业营业收入达8.1万亿元。（新华社）", "ctime": 1789544464, "time_str": "15:41:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260916/c679964426.shtml"}, {"id": "5184085", "title": "外交部：敦促菲律宾以实际行动恪守一个中国原则", "content": "9月16日，外交部发言人郭嘉昆主持例行记者会。有记者提问：据报道，台湾当局外事主管部门负责人林佳龙近日接受媒体采访，证实台当局正筹划在菲律宾中部宿务省设立所谓“办事处”，并称期望借此打造“台菲经济走廊”。中方对此有何评论？对此，郭嘉昆表示，我想再次强调，民进党当局无论怎么勾连外部势力、以何种形式搞所谓“外交突破”、服务“台独”目的，都是枉费心机、注定失败。我们也敦促菲方以实际行动恪守一个中国原则，不得做任何伤害中菲关系的事情。（央视新闻）", "ctime": 1789543936, "time_str": "15:32:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260916/c679964105.shtml"}, {"id": "5184077", "title": "外交部：推动构建更为紧密的中国—东盟命运共同体", "content": "9月16日，外交部发言人郭嘉昆主持例行记者会。有记者问，请问中方对第23届中国—东盟博览会、中国一东盟商务与投资峰会有何期待？郭嘉昆表示，国务院新闻办已于9月1日举行新闻发布会，详细介绍了第23届中国—东盟博览会、中国—东盟商务与投资峰会的有关情况。今年是中国、东盟建立全面战略伙伴关系5周年，在双方领导人战略引领下，中国、东盟各领域务实合作成果丰硕，经贸联系日趋紧密。中方愿同东盟各国一道，充分发挥中国—东盟博览会、中国—东盟商务与投资峰会的平台作用，进一步释放各领域合作潜力，实现更高水平的互利共赢，推动构建更为紧密的中国—东盟命运共同体。（央视新闻）", "ctime": 1789543887, "time_str": "15:31:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260916/c679964095.shtml"}, {"id": "5184029", "title": "外交部：保护主义影响各国企业赴欧投资信心", "content": "据报道，欧洲电信游说组织发布公开信称，欧委会出台的《网络安全法》修订案将迫使欧洲电信企业增加400亿欧元用于设备替代。外交部发言人郭嘉昆16日在例行记者会上答问时表示，中方注意到有关报道。此前也有其他的相关机构评估，该法案在未来5年可能给欧盟带来高达3600多亿欧元的损失。此次欧洲电信企业发布公开信再次证明，欧盟有关做法损人不利己。保护主义换不来竞争力，只会错失数字转型发展机遇，损害欧洲经济社会发展和市场开放形象，影响各国企业赴欧投资信心。希望欧盟倾听欧洲各界理性声音，避免采取歧视性限制措施。（新华社）", "ctime": 1789543555, "time_str": "15:25:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260916/c679963839.shtml"}, {"id": "5184001", "title": "前8个月西部陆海新通道沿线进出口达6922.7亿元", "content": "据重庆海关统计，今年前8个月，西部陆海新通道沿线省（区、市）经通道进出口达6922.7亿元，同比增长10.8%，延续两位数增长态势，产自我国中西部地区的特色农产品、汽摩产品、笔记本电脑等经新通道运往世界各地，泰国榴莲、老挝香蕉等全球好物也快速进入中国市场，为中西部地区深度融入共建“一带一路”注入强劲动力。（央视新闻）", "ctime": 1789543430, "time_str": "15:23:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260916/c679963807.shtml"}, {"id": "5183941", "title": "波兰称应对俄军袭击乌克兰，出动军机采取预防性措施", "content": "当地时间9月16日，波兰武装部队作战司令部表示，由于俄军使用喷气式无人机袭击乌克兰，波兰方面启动相关防空措施，出动军机在波兰领空执行行动，并提高地面防空和雷达侦察系统的战备状态。波兰武装部队作战司令部表示，相关行动是预防性措施，目的是确保波兰领空安全。当天早些时候，波兰方面未发现波兰领空遭到侵犯。（央视新闻）", "ctime": 1789542766, "time_str": "15:12:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260916/c679963494.shtml"}, {"id": "5183925", "title": "丁薛祥将出席第23届中国—东盟博览会暨中国—东盟商务与投资峰会开幕式", "content": "外交部发言人宣布：中共中央政治局常委、国务院副总理丁薛祥将于9月17日出席在广西南宁举行的第23届中国—东盟博览会暨中国—东盟商务与投资峰会开幕式并致辞。缅甸副总统纽梭，越共中央政治局委员、政府常务副总理范家肃，老挝党中央政治局委员、政府常务副总理沙伦赛等外国领导人和高级官员以及东盟秘书长高金洪等将出席开幕式。(外交部网站)", "ctime": 1789542564, "time_str": "15:09:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260916/c679963424.shtml"}, {"id": "5183895", "title": "韩国法院宣判民间无人机“侵入朝鲜”案", "content": "首尔中央地方法院16日针对民间无人机“侵入朝鲜”一案作出一审判决，三名嫌疑人涉一般利敌罪不成立，但因违反“航空安全法”被判处有期徒刑6个月至8个月不等，缓刑两年。据报道，嫌疑人吴某因违反“航空安全法”被判有期徒刑8个月，缓刑两年；无人机制造者张某等两人均被判处有期徒刑6个月，缓刑两年。法院认为，被告放飞无人机的区域对韩国航空安全构成严重威胁，因此判定其违反“航空安全法”的罪名成立。法院同时认为，由于无法证明涉案无人机装有用于存储飞行信息的储存卡，难以认定相关行为侵害了韩国军事安全，因此针对一般利敌罪的指控不成立，宣判其无罪。（新华社）", "ctime": 1789542358, "time_str": "15:05:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260916/c679963328.shtml"}, {"id": "5183885", "title": "今年互联网数据服务业用电量已超600亿千瓦时，同比增长超四成", "content": "记者今天（16日）从中国电力企业联合会获悉，今年以来，以互联网数据、充换电服务业为代表的数字能源新型负荷迎来爆发式增长，全国互联网数据服务业用电量超过600亿千瓦时，比去年同比增长超过四成。数字能源，就是数字技术与能源产业深度融合，覆盖能源发—输—储—用全链条的更高效、安全、低碳的现代能源体系。记者从2026能源绿色发展大会上了解到，今年以来，全国互联网数据服务业用电量超过600亿千瓦时，比去年同比增长超过四成，远超2024年全年水平。随着新质生产力加快壮大，人工智能等新兴产业成为支撑全社会用电量稳健增长最确定的力量。（央视新闻）", "ctime": 1789542276, "time_str": "15:04:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260916/c679963298.shtml"}, {"id": "5183849", "title": "欧洲主要股指开盘集体上涨", "content": "欧洲主要股指开盘集体上涨，欧洲斯托克50指数涨0.51%，英国富时100指数涨0.34%，法国CAC40指数涨0.29%，德国DAX指数涨0.36%。", "ctime": 1789542189, "time_str": "15:03:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260916/c679963259.shtml"}, {"id": "5183845", "title": "智谱：Coding用户中报后两周增长超100万，Coding Plan复售销量增15倍", "content": "智谱9月16日在面向分析师和投资人的电话交流会中表示，中报后至今仅两周，公司Coding用户增长超过100万。7月公司开放停售半年的Coding Plan后，实现超过15倍销量增长，再次说明算力短缺曾严重限制业务发展。（科创板日报）", "ctime": 1789542171, "time_str": "15:02:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260916/c679963254.shtml"}, {"id": "5183837", "title": "智谱：Co-work商业化快于预期 行业订单已超10亿元", "content": "智谱9月16日在电话交流会中表示，目前公司商业化拓展在Co-work领域开始上量。GLM-5.3发布后1个月内，Co-work行业订单金额已超10亿元人民币。Co-work从验证阶段进入生产级部署阶段。网络安全防御是率先落地的垂直场景，已有100家安全企业将GLM模型接入安全产品和业务流程，覆盖国内主要安全厂商、互联网大厂、研究机构和金融机构。智谱认为Co-work是未来大模型重要方向，在金融、法律、工业、制造、生命科学、数学等领域具有广泛应用前景。（科创板日报）", "ctime": 1789542132, "time_str": "15:02:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260916/c679963241.shtml"}, {"id": "5183779", "title": "A股收评：科创50指数高开高走涨4.14%，算力硬件股爆发", "content": "A股三大指数今日集体上涨，截至收盘，上证指数涨0.71%，深证成指涨1.26%，创业板 // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
