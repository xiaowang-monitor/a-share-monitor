"", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260505/c676453514.shtml"}, {"id": "4316973", "title": "韩国通报该国霍尔木兹海峡起火船只最新情况", "content": "当地时间5月5日上午，据韩国外交部消息，此前一日在霍尔木兹海峡附近爆炸起火的韩国船只，经确认所有24名船员无人员伤亡，船只已经完成灭火，但相关船只能否继续正常航行仍不清楚，将在停靠临近港口后进行检查以及修理。韩国外交部表示，事故具体原因预计在停靠后检查船只过程中查清。据了解，这艘船只由韩国海运企业HMM（原现代商船）运营。HMM方面表示，爆炸声传出后，机舱左舷起火，船员随即释放二氧化碳展开灭火作业，持续约4小时。HMM方面表示，尚无法确认是遭受外部袭击，还是船舶内部问题引发爆炸。HMM计划调派拖船，将受损船舶转移至附近的迪拜港，相关作业预计需耗时数日。（央视新闻）", "ctime": 1777952865, "time_str": "11:47:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260505/c676453508.shtml"}, {"id": "4316967", "title": "比特币升破81000美元，日内涨1.46%", "content": "比特币升破81000美元，日内涨1.46%。", "ctime": 1777952394, "time_str": "11:39:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260505/c676453488.shtml"}, {"id": "4316963", "title": "ST华谊0.06%股权司法拍卖竞拍持续 出价已较二级市场溢价超5%", "content": "记者记者从京东资产平台获悉，在今日王忠磊持有的ST华谊180万股（约占公司总股本的0.06%）无限售流通股的司法拍卖中，目前竞拍最高出价345.06万元，折合每股价格约1.92元，较二级市场现价（4月30日收盘价 1.82元/股）溢价超过5%，目前竞拍仍在进行中。（财联社）", "ctime": 1777952207, "time_str": "11:36:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260505/c676453480.shtml"}, {"id": "4316945", "title": "印度尼西亚央行表示，将优化外汇市场干预措施", "content": "印度尼西亚央行表示，将优化外汇市场干预措施。", "ctime": 1777951839, "time_str": "11:30:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260505/c676453443.shtml"}, {"id": "4316917", "title": "业内人士：没有了精神航空，美国普通家庭可能更难买得起机票", "content": "业内观察人士预计，美国机票票价上涨已成定局。Spirit Airlines精神航空虽然宣布倒闭，但其增长及盈利能力，一度促使大型航司开发自己的基础经济舱产品，并加快了降价步伐。美国交通部监察长办公室（Office of Inspector General）在2024年的一份研究报告中发现，当包括Spirit、Frontier Airlines和Allegiant在内的廉价航司开始执飞新航线时，大型航空公司会相应下调最低档票价。 航空咨询公司Atmosphere Research Group创始人Henry Harteveldt表示，Spirit的策略让更多原本无力负担机票的普通大众也能乘飞机出行。他指出，没有了Spirit，时薪劳动者和普通家庭可能更难买得起机票。（新浪财经）", "ctime": 1777951288, "time_str": "11:21:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260505/c676453416.shtml"}, {"id": "4316915", "title": "高通前高管将加入英特尔，领导客户端计算与物理AI事业部", "content": "5月5日，英特尔宣布，英特尔公司宣布两项重要领导层任命。Alex Katouzian将于5月加入英特尔，担任执行副总裁兼客户端计算与物理AI事业部总经理。Katouzian此前任职于高通技术公司，担任执行副总裁兼手机、计算和XR事业群总经理。英特尔同时宣布，正式任命此前担任代理首席技术官的Pushkar Ranade出任首席技术官。", "ctime": 1777951158, "time_str": "11:19:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260505/c676453411.shtml"}, {"id": "4316913", "title": "巴西小飞机撞居民楼 3人死亡", "content": "巴西米纳斯吉拉斯州医院基金会4日晚证实，当天中午在该州首府贝洛奥里藏特市发生的小飞机撞楼事故中的一名伤者最终不治身亡，致使该事故死亡人数上升至3人。（新华社）", "ctime": 1777950560, "time_str": "11:09:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260505/c676453383.shtml"}, {"id": "4316909", "title": "苹果据悉正评估在美国用英特尔和三星来生产其主要设备芯片", "content": "苹果据悉正评估在美国用英特尔和三星来生产其主要设备芯片。(财联社)", "ctime": 1777949977, "time_str": "10:59:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260505/c676453330.shtml"}, {"id": "4316907", "title": "连续45年下降　日本15岁以下儿童人数创新低", "content": "日本总务省4日公布的数据显示，截至4月1日，日本未满15周岁的儿童人数为1329万，较去年减少35万，连续45年下降；当前日本15岁以下儿童占总人口比例为10.8%，较去年下降0.3个百分点；相关儿童人数及其所占人口比例均创1950年有相关统计数据以来新低。据日本共同社报道，日本15岁以下儿童人数在1954年达到2989万峰值后开始减少，迄今已缩减过半。1947年至1949年第一次婴儿潮时期过后的1950年，15岁以下儿童数量占总人口比例一度高达35.4%，随后占比整体呈下降趋势。(新华社)", "ctime": 1777949887, "time_str": "10:58:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260505/c676453314.shtml"}, {"id": "4316905", "title": "伊朗战事致迪拜机场3月客运量锐减66%", "content": "阿联酋迪拜媒体办公室4日发表声明说，受伊朗战事影响，迪拜国际机场3月客运量同比大幅下滑66%。同日，迪拜机场公司说，在2日阿联酋空域解除临时限飞措施后，机场运营和航班已逐步恢复。(新华社)", "ctime": 1777949599, "time_str": "10:53:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260505/c676453295.shtml"}, {"id": "4316903", "title": "中国移动将推出AI-eSIM产品", "content": "中国移动5月5日发布消息称，5月7日-9日，2026移动云大会将在苏州金鸡湖国际会议中心举办，届时将推出AI-eSIM产品。据介绍，该产品可以实时调度云端模型，让设备能自主思考、即时响应，可应用于AI玩具、智慧穿戴等终端。把人工智能能力植入手机SIM卡的技术，未来可能让手机自动优化网络、增强安全防护，不用换卡就能升级体验。大会主题\"移动云 智能新空间\"，主要演示云计算与AI如何融合创造更便捷的数字生活。", "ctime": 1777949425, "time_str": "10:50:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260505/c676453289.shtml"}, {"id": "4316875", "title": "港股半导体股延续昨日强势表现", "content": "港股半导体股延续昨日强势表现，澜起科技涨超6%，晶门半导体涨，芯智控涨超3%。", "ctime": 1777947350, "time_str": "10:15:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260505/c676453123.shtml"}, {"id": "4316861", "title": "俄外交部：日本须放弃“反俄路线”", "content": "俄罗斯外交部网站4日发布通报说，俄外交部副部长鲁坚科4日会见日本参议院议员铃木宗男。俄方表示，为了恢复两国间接触，日本当局须放弃“不符合日本及日本民众利益的敌对反俄路线”，并付诸实际行动。\n\n通报说，俄日关系已倒退数十年。俄方提请日方议员注意日本领导层推进国家军事化以及扩大向乌克兰提供军事技术援助的相关举动。(新华社)", "ctime": 1777946307, "time_str": "09:58:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260505/c676453024.shtml"}, {"id": "4316855", "title": "港股恒生科技指数跌幅达2%", "content": "港股恒生科技指数跌幅扩大至2%，恒生指数现跌1.37%。", "ctime": 1777945346, "time_str": "09:42:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260505/c676452951.shtml"}, {"id": "4316853", "title": "长三角铁路今日迎来返程客流最高峰 预计发送旅客428万人次", "content": "记者从中国铁路上海局集团有限公司（以下简称“上铁集团”）获悉，5月5日是“五一”假期最后一天，长三角铁路迎来返程客流最高峰，当日预计发送旅客428万人次。铁路部门在启用高峰线运行图的基础上，计划增开旅客列车469列，对289列动车组列车组织重联运行，加挂普速客车车厢89辆，全力满足旅客返程出行需要。此前的5月4日，上铁集团发送旅客412.4万人次，较去年同期增长3.2%。自4月29日铁路“五一”假期运输启动以来，上铁集团累计发送旅客约2410万人次，日均发送约401.6万人次，客流持续处于高位运行；其中5月1日安全发送旅客473.8万人次，创下单日客发量历史新高。（央视新闻）", "ctime": 1777945284, "time_str": "09:41:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260505/c676452947.shtml"}, {"id": "4316849", "title": "港股恒生科技指数跌幅达1%", "content": "港股恒生科技指数跌幅扩大至1%，恒生指数现跌0.88%。", "ctime": 1777945083, "time_str": "09:38:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260505/c676452918.shtml"}, {"id": "4316839", "title": "恒生指数、恒生科技指数低开低走，现跌超1%", "content": "恒生指数、恒生科技指数低开低走，现跌超1%，药明生物跌超4%，舜宇光学科技，紫金矿业、老铺黄金、地平线机器人、零跑汽车跌超3%。", "ctime": 1777944937, "time_str": "09:35:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260505/c676452899.shtml"}, {"id": "4316825", "title": "港股新股天星医疗涨超190% 公开发售获超7800倍认购", "content": "截至发稿，利弗莫尔证券显示，天星医疗涨192.93%。该公司专注于运动医学临床解决方案。根据招股结果，公开发售获7823.13倍认购，国际发售获10.41倍认购。", "ctime": 1777944469, "time_str": "09:27:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260505/c676452835.shtml"}, {"id": "4316823", "title": "港股开盘：恒生指数跌0.58%，恒生科技指数跌0.55%", "content": "港股开盘，恒生指数跌0.58%，恒生科技指数跌0.55%。个股方面，东鹏饮料涨8.05%；潍柴动力跌4.25%，万物云跌3.77%，曦智科技-P跌3.73%，绿城服务跌3.49%，网易云音乐跌3.04%。", "ctime": 1777944142, "time_str": "09:22:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260505/c676452808.shtml"}, {"id": "4316813", "title": "欧洲政治共同体领导人会议举行 寻求战略自主与安全独立", "content": "第八届欧洲政治共同体领导人会议当地时间4日在亚美尼亚首都埃里温举行，主要讨论欧洲经济和能源安全、美欧关系等。欧洲多国领导人强调，欧洲必须走“防务自主”之路、减少对美国的安全依赖。（央视新闻）", "ctime": 1777943966, "time_str": "09:19:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260505/c676452796.shtml"}, {"id": "4316811", "title": "假期返程客流高峰，全国铁路预计发送旅客2300万人次", "content": "假期接近尾声，铁路迎来返程客流高峰，客流持续保持高位运行。记者从国铁集团了解到，今天，全国铁路预计发送旅客2300万人次，计划加开旅客列车2225列。昨天，全国铁路发送旅客2038.3万人次，运输安全平稳有序。（央视新闻）", "ctime": 1777943907, "time_str": "09:18:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260505/c676452794.shtml"}, {"id": "4316807", "title": "伊朗媒体：美军袭击民用船只致5人死亡", "content": "伊朗媒体5日援引伊朗军方消息人士的话报道说，美军袭击的不是伊朗伊斯兰革命卫队的作战舰艇，而是“两艘载有乘客的小船”，袭击造成船上5名平民乘客死亡。(新华社)", "ctime": 1777943817, "time_str": "09:16:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260505/c676452790.shtml"}, {"id": "4316789", "title": "俄罗斯与埃及外长通话讨论中东局势", "content": "俄罗斯外交部网站4日发布通报说，俄外长拉夫罗夫当天同埃及外长阿卜杜勒阿提通电话，详细讨论了中东局势。\n\n通报说，双方强调有必要恢复谈判进程，以尽快就长期、可持续解决地区危机达成协议，同时顾及地区所有国家的合法利益。双方还讨论了俄罗斯与埃及在联合国框架下加强协作以及进一步发展俄埃双边合作等议题。(新华社)", "ctime": 1777943226, "time_str": "09:07:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260505/c676452743.shtml"}, {"id": "4316787", "title": "中国物流与采购联合会公布4月份中国大宗商品价格指数", "content": "中国物流与采购联合会今天（5日）公布4月份中国大宗商品价格指数。从指数运行情况看，受国内部分行业供需改善和外部输入性因素影响，4月份指数继续上扬，但涨幅较上月有所收窄，表明大宗商品市场运行总体保持稳定，延续向好发展态势。（央视新闻）", "ctime": 1777942873, "time_str": "09:01:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260505/c676452689.shtml"}, {"id": "4316785", "title": "富时中国A50指数期货盘初跌0.40%", "content": "富时中国A50指数期货在上一交易日夜盘收跌0.38%的基础上低开，盘初跌0.40%。", "ctime": 1777942860, "time_str": "09:01:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260505/c676452688.shtml"}, {"id": "4316783", "title": "现货黄金站上4530美元/盎司", "content": "现货黄金站上4530美元/盎司，日内涨0.2%。", "ctime": 1777942732, "time_str": "08:58:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260505/c676452670.shtml"}, {"id": "4316781", "title": "美国最高法院裁定路易斯安那州选区重划立即生效", "content": "美国最高法院批准路易斯安那州共和党提出的请求，允许此前一项有关选区重划的重要裁决立即生效，而无需等待通常约32天的正式程序。该决定意味着路易斯安那州可以暂停正在进行的初选流程，加快重新绘制国会选区地图，以适用于今年的中期选举。新的裁决实际上允许各州在一定条件下取消为遵守《1965年投票权法》而设立的“黑人占多数选区”。据悉，目前该州共有6个国会席位，其中2个由民主党控制的席位为黑人占多数选区，其余4个席位由共和党掌握。此次重划选区可能对选举格局产生重要影响。（央视新闻）", "ctime": 1777942386, "time_str": "08:53:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260505/c676452659.shtml"}, {"id": "4316779", "title": "苏丹决定召回本国驻埃塞俄比亚大使，并已做好与埃塞俄比亚公开对抗的准备", "content": "苏丹外交部5日凌晨发表声明说，苏丹决定召回本国驻埃塞俄比亚大使，并已做好与埃塞俄比亚公开对抗的准备。（新华社）", "ctime": 1777942183, "time_str": "08:49:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260505/c676452649.shtml"}, {"id": "4316777", "title": "美非法关税退款推迟一天 最早5月12日起发放", "content": "美国海关与边境保护局（CBP）表示，针对被美国最高法院认定为非法的关税措施，首批电子退款预计最早将于5月12日开始发放。美国海关与边境保护局向货运企业发布通知称，相关退款将通过自动清算系统支付，企业可通过该系统查询退款处理进度。此前美国国际贸易法院预计退款将于5月11日启动，但目前已推迟一天，原因未说明。（央视新闻）", "ctime": 1777942055, "time_str": "08:47:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260505/c676452643.shtml"}, {"id": "4316775", "title": "卡塔尔谴责阿联酋油轮在霍尔木兹海峡遇袭", "content": "卡塔尔外交部4日发表声明，强烈谴责一艘由阿联酋阿布扎比国家石油公司运营的油轮在通过霍尔木兹海峡时遭无人机袭击，称此举严重违反国际法和航行自由原则。\n\n声明说，卡塔尔坚决反对将霍尔木兹海峡作为施压工具，呼吁无条件重新开放该海峡，并强调这一重要水道的航行自由是既定原则，不容妥协。声明指出，持续关闭海峡将危及本地区国家的重大利益。\n\n卡塔尔外交部重申支持阿联酋为保护自身资产所采取的一切措施。(新华社)", "ctime": 1777942013, "time_str": "08:46:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260505/c676452642.shtml"}, {"id": "4316773", "title": "苏丹谴责埃塞俄比亚和阿联酋参与袭击首都机场", "content": "当地时间5月4日，苏丹外交与国际合作部长穆希丁·萨利姆发表声明，谴责埃塞俄比亚和阿联酋参与针对首都喀土穆国际机场的无人机袭击事件。萨利姆表示，喀土穆国际机场 // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

function renderSectorChart() {

      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
