, "title": "五角大楼官员证实美韩联合军演将提前结束", "content": "美国国防部一名官员证实，美韩“乙支自由之盾”联合军演将于21日结束，比原定计划提前近一周。这名国防部官员说，根据美国总统特朗普和国防部长赫格塞思的指示，此次联合演习的规模已“大幅缩减”，“相关实兵演练活动有所减少，部分项目被取消或改为模拟演练”。韩国联合参谋本部当地时间19日发表声明说，原定于17日至27日举行的韩美“乙支自由之盾”联合军演将提前6天于21日结束，日程缩短过半。声明说，根据美方提议，韩美双方决定对演习的时间和规模等部分内容进行调整。双方决定缩减部分联合野外机动训练，具体调整内容目前仍在协商。特朗普16日在社交媒体发文说，他已要求美国防部大幅缩减美韩联合军演规模。他称，这些军演“耗资巨大”，其中很大一部分由美国负担，同时对朝鲜释放出“完全不恰当和敌对的信号”。（新华社）", "ctime": 1787110789, "time_str": "11:39:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260819/c679079588.shtml"}, {"id": "4981869", "title": "国台办：民进党当局媚日恋殖 背叛历史 背叛民族", "content": "8月19日，国务院台办举行例行新闻发布会。有记者问：今年815日本战败纪念日，面对日本防卫大臣小泉进次郎等阁员参拜靖国神社之举，台湾方面声称“尊重”，对此国台办有何回应？ 发言人朱凤莲表示，对于日本政要参拜战犯神社，有关部门已经表明严正立场，日本作为在台湾问题上有历史罪责的国家，应深刻反省历史，切实反思纠错，恪守一个中国原则和中日四个政治文件精神，在台湾问题上谨言慎行。民进党当局媚日恋殖，让世人再度看清其背叛历史、背叛民族的丑恶嘴脸。（央视新闻）", "ctime": 1787110660, "time_str": "11:37:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260819/c679079492.shtml"}, {"id": "4981855", "title": "ETF两市成交额报2783.22亿元，较昨日此时缩量29.14亿元", "content": "截至目前，ETF两市成交额报2783.22亿元，较昨日此时缩量29.14亿元，分类型来看，股票型ETF成交额1200.73亿元，债券型ETF成交额1028.48亿元，货币型ETF成交额120.42亿元，商品型ETF成交额42.97亿元，QDII型ETF成交额390.61亿元。", "ctime": 1787110354, "time_str": "11:32:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260819/c679079358.shtml"}, {"id": "4981853", "title": "上港能源、达飞集团、上海电气携手刷新单次生物质甲醇加注量世界纪录", "content": "上港能源、达飞集团与上海电气三方通力协作，在上海港为“达飞欧斯米姆”轮成功加注8016吨国产生物质甲醇。此次作业刷新了单次船舶生物质甲醇加注量的世界纪录，超越了2026年3月上港能源为达飞集团全球首船生物质甲醇3643吨的加注纪录。（上海临港）", "ctime": 1787110346, "time_str": "11:32:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260819/c679079357.shtml"}, {"id": "4981851", "title": "期货午评：美伊暂停谈判！燃油暴涨近6% 沪银崩跌超4%", "content": "期货午评：早盘收盘，国内期货主力合约涨多跌少，燃 29:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260819/c679079311.shtml"}, {"id": "4981817", "title": "河南省超硬材料产业链产融对接活动在许昌市举办", "content": "近日，河南省超硬材料产业链产融对接活动在黄河旋风股份有限公司举办。座谈交流环节，黄河旋风股份有限公司、河南风优创材料技术有限公司、卓工新材料有限公司、凯利达金刚石工具有限公司、鸿泰钻石科技有限公司等企业分别介绍其核心产品、经营现状及融资需求。中原银行、中国银行、工商银行、交通银行、中鼎开源基金等机构现场推介科创贷、制造业专项贷等惠企政策，并围绕企业项目前景一对一答疑洽谈，多家银行现场表达了进一步合作意向。(人民财讯)", "ctime": 1787109889, "time_str": "11:24:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260819/c679079217.shtml"}, {"id": "4981815", "title": "港口航运板块异动走高，南京港涨停", "content": "港口航运板块异动走高，南京港涨停，中谷物流、招商轮船、连云港、中远海能、国航远洋跟涨。", "ctime": 1787109819, "time_str": "11:23:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260819/c679079197.shtml"}, {"id": "4981813", "title": "科创50指数跌幅扩大至6%", "content": "科创50指数跌幅扩大至6%，现报1683.36点。", "ctime": 1787109777, "time_str": "11:22:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260819/c679079184.shtml"}, {"id": "4981809", "title": "美驻以大使：哈马斯“完全解除武装”前以军无需撤出", "content": "美国驻以色列大使迈克·赫卡比18日称，在巴勒斯坦伊斯兰抵抗运动（哈马斯）“完全解除武装”前，以色列军队无需撤出加沙地带。在接受以色列第12频道电视台采访时，赫卡比否认有关以色列总理内塔尼亚胡与美国总统特朗普的女婿库什纳17日就“加沙和平计划”下一阶段内容发生冲突的报道，称在哈马斯仍持有武器的情况下，以色列就不会从加沙地带撤军，美方“并不期望以色列撤军”。他还称，美以达成了一项“很好的”协议。特朗普已明确表示，哈马斯必须解除武装，且不得参与未来加沙治理。（新华社）", "ctime": 1787109695, "time_str": "11:21:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260819/c679079171.shtml"}, {"id": "4981803", "title": "全球最新一代脉冲电场消融核心设备在华创纪录获批", "content": "8月19日，波士顿科学宣布，上海临港工厂生产的新一代FARASTAR 心脏脉冲电场消融系统正式获得国家药监局批准。从注册申请获得受理到正式获批，创下公司在华本土生产设备项目最快获批纪录，较公司以往同类项目的平均审批周期缩短约1.5个月。产品采用面向未来临床需求开发的全球最新一代设备平台，意味着该核心设备在中国的本土化从更高起点展开；临港基地的生产范围也由高端介入耗材拓展至复杂设备平台。（第一财经）", "ctime": 1787109607, "time_str": "11:20:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260819/c679079149.shtml"}, {"id": "4981787", "title": "嫦娥七号器箭组合体完成垂直转运", "content": "据中国载人航天工程办公室消息，北京时间2026年8月19日，嫦娥七号探测器和长征五号遥十四运载火箭在中国文昌航天发射场完成技术区相关工作，器箭组合体已垂直转运至发射区。嫦娥七号探测器、长征五号遥十四运载火箭分别于4月、7月运抵发射场，先后完成了总装、测试等准备工作。目前，发射场设施设备状态良好，后续将按计划开展发射前各项功能检查、联合测试、推进剂加注等工作，计划近日择机实施发射。（央视新闻）", "ctime": 1787109397, "time_str": "11:16:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260819/c679079054.shtml"}, {"id": "4981783", "title": "鸿鹄03星成功入轨 探索“批量产”卫星", "content": "2026年8月19日，由鸿擎科技自主研制的技术验证卫星鸿鹄03星搭乘朱雀三号遥二运载火箭成功发射升空。卫星成功入轨后，卫星太阳翼顺利展开，各项遥测参数正常，发射任务取得圆满成功。随着可回收火箭技术日益成熟，全球低轨星座规模化建设加速。卫星“批量化”生产有助于更好满足高密度发射和快速组网需求。鸿擎科技董事长万军表示，鸿鹄03星的研发瞄准这一产业趋势，从核心单机到整星系统，这颗卫星在设计阶段便积极探索适合批量复制的技术路径。（新华社）", "ctime": 1787109279, "time_str": "11:14:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260819/c679079030.shtml"}, {"id": "4981769", "title": "国台办：严厉谴责民进党当局背叛民族、背叛历史", "content": "8月19日，国务院台办举行例行新闻发布会。有记者问：今年8月15日是日本宣布无条件投降81周年，岛内多家民间团体近日举办多场活动，纪念抗战胜利、台湾重回祖国怀抱，抗议民进党当局淡化抗战历史、割裂两岸共同历史记忆，并呼吁两岸同胞应警惕日本新型军国主义危害台海安全。请问对此有何评论？发言人朱凤莲表示，台湾统派团体通过举办研讨会和论坛、开展集会等多种方式纪念抗战胜利和台湾光复，反对民进党当局淡化抗战历史、美化日本殖民统治，抗议日本再次介入台湾问题，呼吁台湾民众反对和制止“台独”势力勾连日本阻挠祖国统一、破坏台海和平。我们对于这些正义行动表示高度赞赏，并严厉谴责民进党当局背叛民族、背叛历史的丑恶行径。（央视新闻）", "ctime": 1787108841, "time_str": "11:07:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260819/c679078898.shtml"}, {"id": "4981767", "title": "美国宣布制裁日本籍国际刑事法院院长", "content": "美国国务卿鲁比奥18日发表声明称，美国当天对国际刑事法院院长、日本籍的赤根智子等两名国际刑事法院官员实施制裁。根据声明，另一名遭制裁的是国际刑事法院高级出庭律师、塞内加尔籍的阿卜杜拉耶·塞耶。声明称，这两人“直接参与了国际刑事法院针对那些未同意接受其管辖的国家的官员所进行的调查、逮捕、拘留或起诉行动”。（新华社）", "ctime": 1787108832, "time_str": "11:07:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260819/c679078897.shtml"}, {"id": "4981765", "title": "厦门发布促进对台交流合作12项措施 国台办介绍有关情况", "content": "8月19日，国务院台办举行例行新闻发布会。有记者问：为落实十项促进两岸交流合作的政策措施，福建厦门近日推出促进对台交流合作十二条措施，得到台胞好评。请介绍有关情况。发言人朱凤莲表示，福建省厦门市于8月18日发布《厦门市促进对台交流合作十二条措施》，聚焦对台经贸合作、文化交流、青年工作、平台建设、服务保障等多个方面，包括打造台湾农渔产品集散中心，拓展台湾农渔产品销售渠道；优化提升“首来台胞厦门服务包”，丰富权益内涵，拓展服务场景；举办两岸非物质文化遗产保护传承交流活动；搭建两岸视听产业交流合作服务平台，引导台湾青年参与数字内容创作人才实训，推动台湾业者参与大陆微短剧创作等。这些措施覆盖面广、针对性强、落地见效快，有利于为厦台两地经贸合作、青年和文化交流等注入新动能。（央视新闻）", "ctime": 1787108828, "time_str": "11:07:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260819/c679078895.shtml"}, {"id": "4981755", "title": "国台办：民进党当局阻挠两岸高校交流 令人不齿", "content": "8月19日，国务院台办举行例行新闻发布会。有记者问：民进党当局持续限缩两岸教育交流，台教育主管部门要求校方提供大陆研修生在台的每日行程、课程主题、参访地点等，并计划收紧审核大陆研究生和教师赴台申请，不少大陆研究生赴台项目被迫中断或彻底取消，请问发言人对此有何评论？发言人朱凤莲表示，这是民进党当局阻挠禁限两岸正常交流交往的又一恶行。两岸高校互派研修生行之有年，是两岸教育交流的重要组成部分，有利于推动两岸学术成果互学互鉴，促进两岸教育共同发展。民进党当局滥权妄为，无视岛内高校参与两岸交流的强烈愿望与现实需求，频繁将黑手伸向两岸教育交流，强行限缩大陆学生赴台研修，对台湾教育界威逼利诱，严重损害两岸教育交流和学生的正当权益，令人不齿。（央视新闻）", "ctime": 1787108590, "time_str": "11:03:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260819/c679078765.shtml"}, {"id": "4981751", "title": "国台办回应台“汉光”演习：“台独”分裂是台海和平稳定的最大威胁", "content": "8月19日，国务院台办举行例行新闻发布会。有记者问：近期民进党当局举行所谓“汉光42号演习”，首度纳入移动电话网络降速演练。岛内社会质疑这种“断网”演练导致民众不能叫外卖，也无法使用支付卡消费，正常生活受到影响。请问发言人对此有何评论？发言人朱凤莲表示，民进党当局顽固坚持“台独”分裂立场，大肆推动“倚武谋独”滥权妄为，已经严重破坏台湾的社会安宁，影响台湾民众的日常生活和利益福祉。所谓“演练”只会让台湾民众进一步看清楚，“台独”分裂是台海和平稳定的最大威胁，是台湾民众福祉的最大祸害。只有坚持“九二共识”，反对“台独”，才能维护和平安宁，实现安居乐业。（央视新闻）", "ctime": 1787108515, "time_str": "11:01:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260819/c679078726.shtml"}, {"id": "4981749", "title": "以人为本、厘清权责 国家发布城市公共设施管理标准", "content": "记者今天了解到，市场监管总局（国家标准委）批准发布国家标准《城市公共设施管理通用要求》，将自2027年2月1日起实施。该标准将为全国城市公共设施全生命周期治理建立统一通用规范，助力我国城市公共设施标准化、智慧化、精细化管理。本次标准修订结合城市运行现实需求，补齐数字化运维、多元共治、应急保障等领域短板，主要内容包括以下四个方面。一是突出价值导向与人文关怀。确立以人为本、功能适配、文化赋能、可持续发展四大管理导向，兼顾民生关怀、城市应急韧性、文脉传承与绿色低碳运营，为设施全流程管理明确价值准则。二是重构三维分类体系。打破旧版二元划分模式，将城市公共设施划分为市政设施、公共服务设施、数字公共基础设施三大类，新增低空基础设施、社区服务设施相关内容，首次系统规范城市信息模型（CIM）、算力中心、城市感知终端等数字底座管理要求，让分类更具前瞻性和包容性。三是厘清多元权责闭环。明确产权单位、运维单位、行业主管部门管理责任，搭建社会组织、志愿者、市民共同参与监督的多元治理闭环，细化规划建设、日常运维、检修养护、应急处置全流程实操细则。四是完善数字化与数据治理规则。新增全生命周期数字化运维、统一数字底座建设要求，同步配套信息安全、电子档案管理规范，建立数据分级管控、安全检测、备份恢复机制，平衡智慧运维效能与公共数据安全防护。（央视新闻）", "ctime": 1787108474, "time_str": "11:01:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260819/c679078693.shtml"}, {"id": "4981737", "title": "TrendForce：DDR5 16Gb (2Gx8) 4800/5600现货均价较上日上涨0.82%", "content": "TrendForce数据显示，8月19日内存颗粒DDR5 16Gb (2Gx8) 4800/5600现货均价较上日上涨0.82%，DDR4 16Gb (2Gx8) 3200现货均价较上日上涨0.75%，DDR4 8Gb (1Gx8) 3200现货均价较上日持平。", "ctime": 1787108406, "time_str": "11:00:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260819/c679078658.shtml"}, {"id": "4981727", "title": "海大集团等成立水产养殖公司，注册资本1.2亿元", "content": "企查查APP显示，台山海晟源水产养殖有限公司成立，法定代表人为王豪杰，注册资本为1.2亿元，经营范围包含：水产养殖；水产苗种生产；水产苗种进出口；食用农产品批发；水产品收购；生物饲料研发等。企查查股权穿透显示，该公司由海大集团旗下广东海智慧水产养殖技术有限公司等共同持股。（人民财讯）", "ctime": 1787108170, "time_str": "10:56:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260819/c679078542.shtml"}, {"id": "4981723", "title": "国台办：民进党当局应尽快取消对两岸航空运输的不合理限制", "content": "8月19日，国务院台办举行例行新闻发布会。有记者问：据台媒报道，台湾有关方面呼吁争取恢复两岸更多直航点，请问发言人是否了解相关进展？发言人朱凤莲表示，台湾有关方面和热心人士，为争取恢复两岸更多的直航点四处奔走呼吁，充分反映了两岸同胞热切期盼全面恢复空中客运直航正常化的共同心愿。但是据了解，台民航主管部门以不在节日包机范围为由，拒绝了包机申请。民进党当局应当正视两岸空中客运直航的现实需求，顺应民心，尽快取消对两岸航空运输的不合理限制。（央视新闻）", "ctime": 1787108116, "time_str": "10:55:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260819/c679078507.shtml"}, {"id": "4981719", "title": "龙旗科技与南昌高新区签约 具身智能机器人研发制造基地正式落地", "content": "近日，龙旗科技与南昌高新区签约，具身智能机器人研发制造基地正式落地。未来，龙旗具身智能机器人研发制造基地项目将以此次签约为契机，构建一体化业务格局，形成从产品定义到工程交付的端到端服务能力，为行业客户提供专业化、规模化的具身智能产品ODM解决方案。（龙旗科技）", "ctime": 1787108097, "time_str": "10:54:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260819/c679078502.shtml"}, {"id": "4981713", "title": "豫园股份、徐州国资成立商业经营管理公司", "content": "企查查APP显示，近日，徐州彭城复锦商业经营管理有限公司成立，法定代表人为黄哲，注册资本为1000万元，经营范围包含：商业综合体管理服务；旅游开发项目策划咨询；市场营销策划；物业管理；市政设施管理等。企查查股权穿透显示，该公司由豫园股份全资子公司上海豫复荟置业有限公司、徐州彭城七里城市更新有限公司共同持股。（人民财讯）", "ctime": 1787107971, "time_str": "10:52:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260819/c679078435.shtml"}, {"id": "4981707", "title": "福州发布支持建设“海峡青年发展型城市”第三批10条措施", "content": "8月19日，国务院台办举行例行新闻发布会。有记者问：近日，第十四届海峡青年连心汇在福州召开，福州市发布支持建设“海峡青年发展型城市”第三批10条措施，受到岛内青年关注和点赞。可否详细介绍相关情况？发言人朱凤莲表示，“海峡青年发展型城市”是由福州市于2025年发起并联动北京、重庆、广州等17个城市共同建设的青年发展合作机制，旨在为两岸青年营造“进得来、留得住、融得深、有作为”的发展生态。福州市近日发布的“海峡青年发展型城市”第三批措施，聚焦就业创业、创新合作、交流交往，推出了一系列含金量十足的政策礼包，覆盖面更广，精准度更高，台胞的获得感更强。（央视新闻）", "ctime": 1787107916, "time_str": "10:51:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260819/c679078407.shtml"}, {"id": "4981697", "title": "光大期货：重回利率定价，短线黄金走弱", "content": "隔夜伦敦现货贵金属震荡走弱。欧美长债收益率高企，抬升黄金持有成本。美元指数结束三连跌迎来反弹，压制金价表现。原油再度走高，加剧通胀粘性预期，降息预期进一步降温。多重利空共振，短线黄金承压走弱。\n地缘政治方面，据新华社，特朗普当地时间18日在社交媒体上称，目前和未来不会与伊朗进行任何会谈或对话，此前他曾在社交媒体上发布地图，将霍尔木兹海峡标注为“美国新领土”。随着美伊对峙持续升级，特朗普再次打压美伊谈判前景，霍尔木兹海峡安全风险骤然上升，油价和美元表现偏强，市场短暂切回至利率定价，黄金受抑回落，不过仍要关注紧张局势是否最终“TACO”。短线来看，黄金上方阻力较大，市场再次面临方向性选择，但美伊谈判或仍是主流方向，美联储9月加息仍在摇摆，黄金或维系震荡。（光大期货）", "ctime": 1787107582, "time_str": "10:46:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260819/c679078252.shtml"}, {"id": "4981693", "title": "中创新航联合中外运完成纯电卡车首发落地", "content": "8月18日，中创新航联合中外运，在中创新航合肥基地完成纯电卡车首发落地。新一代纯电货运运力正式投入生产物流场景。本次投用的纯电重卡，搭载中创新航自主研发的“至远”商用动力电池产品，以零排放、低能耗的纯电运力，全面替代传统燃油车辆用于公司产品的厂际转运与物流配送。(人民财讯)", "ctime": 1787107534, "time_str": "10:45:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260819/c679078205.shtml"}, {"id": "4981681", "title": "Momenta、XHEART与QNX达成合作，打造全球安全标准自动驾驶平台", "content": "记者19日获悉，Momenta与新芯航途（XHEART）、BlackBerry有限公司旗下QNX业务部门合作，将共同打造面向量产的全球安全标准自动驾驶平台。三家分别提供全栈自动驾驶算法能力、车规级SoC（系统级芯片）X7，和基于QNX  SDP 8.0的安全操作系统。量产解决方案旨在助力全球车企加速智能驾驶技术落地，满足全球功能安全标准要求。（人民财讯）", "ctime": 1787107432, "time_str": "10:43:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260819/c679078140.shtml"}, {"id": "4981669", "title": "橡胶开盘直冲万八元大关，国内上游的刚性支撑究竟有多强？", "content": "8月19日橡胶主力合约开盘突破万八，上游目前支撑存在，现货价格短期内相对坚挺。当前橡胶震荡上行很大原因仍然是上游原料支撑，国内西双版纳、海南以及国外老挝等产胶区收胶困难，另外就是厄尔尼诺现象仍然对市场情绪产生作用。根据NOAA气候预测中心2026年7月发布的最新报告：本轮厄尔尼诺有97%的概率持续到2027年北半球早春，今年10月至12月出现强厄尔尼诺事件的概率高达81%，强度可能跻身1950年以来最强厄尔尼诺事件之列。厄尔尼诺现象造成橡胶减产的预期仍然普遍存在。减产预期将强化资金在橡胶上的资金配置，从目前的“强预期，弱现实”逐步向“强预期，强现实”的产业链局面转变。下旬需关注下游复工节奏与天气扰动，预计天然橡胶价格呈震荡格局，另外国际消息面近期变化较多，对于商品期货市场的短期骤变也存在一定影响。（天然橡胶网）", "ctime": 1787107382, "time_str": "10:43:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260819/c679078109.shtml"}, {"id": "4981659", "title": "存储芯片板块持续走低，香农芯创盘中跌超10%", "content": "存储芯片板块持续走低，托伦斯、精智达、麦捷科技、京仪装备、盛美上海、迈为股份、西测测试、香农芯创、华虹宏力、国科微、神工股份跌超10%，晶升股份、德福科技、万通发展、深科达、雅克科技跟跌。", "ctime": 1787107141, "time_str": "10:39:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260819/c679077932.shtml"}, {"id": "4981655", "title": "特朗普宣布推迟三天对加拿大加征50%关税", "content": "当地时间18日，美国总统特朗普在社交 // 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
