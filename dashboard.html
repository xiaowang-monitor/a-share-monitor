万人次不同程度受灾", "content": "近日，国家防灾减灾救灾委员会办公室、应急管理部会同有关成员单位，对2026年前三季度全国自然灾害情况进行了会商分析。前三季度，我国自然灾害以地质灾害、台风灾害、洪涝灾害、风雹灾害为主，干旱灾害、地震灾害、低温雨雪冰冻和雪灾、生物灾害、森林草原火灾等也有不同程度发生。据初步统计，各种自然灾害共造成全国5646万人次不同程度受灾，死亡失踪1162人，紧急转移安置和需紧急生活救助504.9万人次；倒塌房屋1.3万户5.2万间，损坏房屋17万户43万间；农作物受灾面积473.97万公顷；直接经济损失1993.6亿元。（央视新闻）", "ctime": 1792646847, "time_str": "13:27:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261022/c680969753.shtml"}, {"id": "5445019", "title": "南向资金净卖出超40亿港元", "content": "据同花顺iFinD数据，截至目前，南向资金净卖出超40亿港元，其中港股通（沪）卖出超7.33亿港元，港股通（深）卖出超32.93亿港元。", "ctime": 1792646708, "time_str": "13:25:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261022/c680969721.shtml"}, {"id": "5445007", "title": "优必选在广州成立科技新公司，含多项AI业务", "content": "企查查APP显示，近日，广州增优科技有限公司成立，经营范围包含：智能机器人的研发；人工智能理论与算法软件开发；人工智能基础资源与技术平台；智能机器人销售等。企查查股权穿透显示，该公司由优必选全资持股。（人民财讯）", "ctime": 1792646664, "time_str": "13:24:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261022/c680969696.shtml"}, {"id": "5444915", "title": "港股恒生科技指数跌幅达5%", "content": "港股恒生科技指数跌幅扩大至5%，恒生指数现跌3.04%。联想集团跌超10%，天数智芯、智谱跌超9%。", "ctime": 1792646219, "time_str": "13:16:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261022/c680969556.shtml"}, {"id": "5444895", "title": "北汽集团成立元启物理智能科技公司", "content": "10月22日，北汽集团在2026世界智能网联汽车大会上宣布，成立北京元启物理智能科技公司，搭建算力基座、大模型、硬件终端的全栈自研体系。北汽下一代搭载全新“Personal Agent（个人智能体）”座舱产品将于明年正式上市。(界面)", "ctime": 1792646132, "time_str": "13:15:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261022/c680969520.shtml"}, {"id": "5444865", "title": "国大药房与津药达仁堂集团召开2027年度合作对接洽谈会", "content": "近日，国大药房与津药达仁堂集团召开2027年度合作对接洽谈会，双方围绕2027年战略合作开展深入磋商，其  "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261022/c680969229.shtml"}, {"id": "5444493", "title": "中国驻沙特大使馆：建议中国公民暂勿乘飞机在沙特旅行", "content": "据中国驻沙特大使馆消息，10月22日凌晨，沙特民航总局发布公告称：达曼法赫德国王国际机场于10月21日（星期三）晚间遭袭，目前已造成1死8伤，物质损失尚在评估中。另有官方消息称，一架亚丁航空客机在本次袭击中受损，机上1人受伤。连日来，沙特利雅得、达曼等地机场和重要设施持续遭导弹和无人机袭击。利雅得哈立德国王国际机场和一些南部城市机场目前仍无恢复运营确切信息，其他城市机场航班经常出现大面积异常。中国驻沙特使领馆再次提醒在沙中资机构和中国公民务必提高安全防范意识，减少非必要外出，远离机场、石油设施、军事基地等敏感地区，勿拍摄军事行动和敏感设施。建议近期勿乘飞机在沙特旅行，已购票旅客请与有关航司保持密切联系，关注航班变化和有关机场情况。（中国驻沙特大使馆）", "ctime": 1792645401, "time_str": "13:03:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261022/c680969216.shtml"}, {"id": "5444065", "title": "批评特朗普？泽连斯基遭美总统特使“斥责”", "content": "知情人士说，在挪威首都奥斯陆20日举行的乌克兰问题会谈上，乌克兰总统泽连斯基因批评美国总统特朗普的言论遭美总统特使威特科夫斥责。据美国《纽约时报》21日援引当时在场一名消息人士的描述报道，威特科夫告诉泽连斯基，正是后者近期对特朗普尖锐批评的激烈反击，激怒了美国总统。双方交谈时，泽连斯基有时会反驳，并一度坚称：“我从没说过那种话。”不过，泽连斯基随后“显然领会了这个信息”。他会后面对媒体记者时，“神情收敛，竭力给出正面评价”，同时回避了他近期对特朗普的批评。（新华社）", "ctime": 1792645056, "time_str": "12:57:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261022/c680969116.shtml"}, {"id": "5444041", "title": "港珠澳大桥开通8周年，出入境旅客已超1.25亿人次", "content": "伶仃洋上，港珠澳大桥车流不息，人车两旺。港珠澳大桥正式开通8年来，各项通行政策与时俱进、不断放宽，这座“一桥连三地”的“超级工程”不仅成为内地与港澳居民跨境出行的“黄金通道”，更成为见证粤港澳大湾区融合发展的“活力窗口”。据珠海边检总站港珠澳大桥边检站数据，自开通以来，截至今年10月22日零时，经港珠澳大桥珠海公路口岸往来粤港澳三地的旅客数量已超过1.25亿人次，车辆已超过2645万辆次。（澎湃新闻）", "ctime": 1792644924, "time_str": "12:55:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261022/c680969070.shtml"}, {"id": "5444035", "title": "杭州警方：盘石创始人田宁等人被采取刑事强制措施，公司涉诈骗被立案", "content": "浙江杭州市公安局拱墅区分局发布警情通报，盘石创始人田宁等人因涉嫌诈骗被采取刑事强制措施，公司相关案件已被立案。此前，田宁自今年7月中旬起失联，引发业界关注。盘石集团杭州总部亦被贴上整改封条，其数字产业园运营模式因资产难以变现及外部资金收紧等因素陷入困境。（澎湃新闻）", "ctime": 1792644878, "time_str": "12:54:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261022/c680969048.shtml"}, {"id": "5444033", "title": "长实集团再发澄清公告：网传照片不实，李嘉诚健康情况良好", "content": "长实集团表示，近日有多个自媒体、网络社交账号，以历史图片或虚假图片，散播“李泽钜及李泽楷到慈山寺上香祈福，李嘉诚没有到场”的内容。其中，有些文章中的照片并非李泽钜及李泽楷，亦有采用二人于2019年3月27日出席慈山寺开光典礼暨博物馆启用仪式时的照片，讹称为近日拍摄，事实上，当日李嘉诚、李泽钜及李泽楷三父子同场。长实集团要求，捏造虚假故事及散播谣言者，立即删除有关内容，同时将保留法律追究权利。目前李嘉诚健康情况良好。", "ctime": 1792644869, "time_str": "12:54:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261022/c680969047.shtml"}, {"id": "5444029", "title": "俄莫斯科地区遭大规模无人机袭击", "content": "俄罗斯首都莫斯科市市长索比亚宁22日在社交媒体上说，21日晚至22日凌晨，630架无人机袭击莫斯科地区，其中绝大多数在远距离被防空系统摧毁，另有163架无人机在靠近莫斯科市时被拦截。索比亚宁说，袭击发生在21日晚8时30分至22日凌晨4时，已造成莫斯科市新莫斯科地区2人受伤，伤者目前正接受医疗救治。应急救援小组正在无人机残骸坠落现场开展工作。（新华社）", "ctime": 1792644836, "time_str": "12:53:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261022/c680969025.shtml"}, {"id": "5443877", "title": "《广播电视和网络视听“十五五”规划》：加快行业算力网络统一布局", "content": "国家广播电视总局印发《广播电视和网络视听“十五五”规划》。《规划》提出，建强基础设施网。统筹有线、无线、卫星、5G等网络基础资源，加强多渠道协同和云网边端建设，推动算网一体、固移融合，构建统一、智能、安全、高效的基础设施“一张网”。深化广电网络光纤化、IP 化、智能化、超高清化改造，加快行业算力网络统一布局，强化全国广电网络一体化运营能力。建强用好国家文化专网。", "ctime": 1792643682, "time_str": "12:34:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261022/c680968556.shtml"}, {"id": "5443805", "title": "水利部针对4省市启动洪水防御Ⅳ级应急响应", "content": "受台风“蔷琵”影响，预计10月23日—25日，江南东部、江淮东部等地将有一次较强降雨过程，以中到大雨为主；其中上海大部、浙江东部等地部分地区将有暴雨到大暴雨。受降雨影响，福建沿海交溪，浙江沿海飞云江、瓯江、椒江、姚江、钱塘江支流曹娥江，江苏里下河，太湖及周边河网等将出现涨水过程，其中浙江沿海暴雨区内部分中小河流可能发生超警洪水。山丘区山洪灾害风险较高。依据《水利部水旱灾害防御应急响应工作规程》，水利部于10月22日12时针对上海、江苏、浙江、福建启动洪水防御Ⅳ级应急响应。指导督促地方水利部门和相关流域管理机构密切监视台风雨水情变化，强化应急值守和会商研判，加强监测预报预警，科学调度水工程，做好水库和在建水利工程安全度汛、中小河流洪水和山洪灾害防御等工作，确保人民群众生命财产安全。（央视新闻）", "ctime": 1792643437, "time_str": "12:30:37", "stock_code": "", "stock_name": " // 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
