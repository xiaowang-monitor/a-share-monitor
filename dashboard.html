const NEWS     = [{"id": "5749689", "title": "NYMEX天然气主力合约涨超3%", "content": "NYMEX天然气主力合约涨超3%，现报3.63美元/百万英热。", "ctime": 1795528871, "time_str": "22:01:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261124/c682171676.shtml"}, {"id": "5749683", "title": "世卫：美国报告3例感染禽流感病例 1人死亡", "content": "世界卫生组织24日说，美国向该组织通报了3例人感染甲型H5禽流感病毒病例，其中1人死亡。目前世卫组织评估该病毒对一般公众的风险较低。根据世卫组织官网的消息，这3人均为成年人，在美国华盛顿州亚基马县一家奶牛场工作，该地区近期已在奶牛中检测到高致病性H5N1型禽流感病毒。迄今尚无证据表明存在人际传播。世卫组织将继续密切监测。另据美国疾病控制和预防中心网站介绍，这3例病例均于10月15日之后报告，其中一例患有基础疾病，在10月底出现呼吸道症状，随后收治入院，于11月1日去世。其他两例确诊病例均已康复。美疾控中心网站还说，H5型禽流感在全球野生鸟类中广泛传播，并已在家禽和奶牛中引发疫情。尽管当前出现了人感染该类病毒的案例，但该机构认为目前其风险仍属于较低水平。(新华社)", "ctime": 1795528839, "time_str": "22:00:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261124/c682171667.shtml"}, {"id": "5749669", "title": "美媒：美国防部寻求部分企业协助生产军用无人机", "content": "据美国《华尔街日报》24日援引知情人士消息报道，为缓解无人作战装备短缺问题，美国防部正与通用汽车公司、福特汽车公司等制造商洽谈，寻求其协助大规模生产军用无人机。报道指出，美军方希望利用汽车行业庞大的装配线以提升关键弹药和装备的产量。美国防部领导层意识到，许多美国无人机公司规模小且缺乏经验和产能，无法满足国防部未来几年数百万架无人机的采购需求。国防部近几个月一直在争取利用汽车制造商成熟的供应链，提升从导弹到战术卡车等各类武器的产量。报道还称，美国防部长赫格塞思已于今年秋季成立一个作战司令部来统筹无人机制造工作，整合各军种的无人机生产和研发工作。报道援引知情人士消息说，美国防部官员已与福特汽车公司、加拿大汽车零部件企业麦格纳国际公司等企业负责人会面，但目前尚未达成任何协议。参与谈判的相关人士表示，汽车公司高管对该提议的反应不一。报道说，对于美国汽车制造业巨头及其供应商而言，加入美国军工供应链“前景充满风险”。汽车公司面临利润率低、与武器生产挂钩损害自身名誉等问题。自中期选举以来，美国民主党对国防部官员及其与企业达成协议的审查日益严格，与政府签订协议的潜在政治风险也随之增加。(新华社)", "ctime": 1795528817, "time_str": "22:00:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261124/c682171661.shtml"}, {"id": "5749609", "title": "海南省省长刘小明会见明阳集团客人", "content": "据海南日报消息，11月24日，海南省省长刘小明在海口会见明阳集团董事长张传卫一行。双方围绕发挥海南自由贸易港政策优势和明阳集团海上风电装备领域领军优势，优化明阳东方国际进出口产业母港项目布局、加大风氢一体化技术创新和漂浮式海上风电场景创新、加快三亚深海能源科创中心投运，共同推动海南清洁能源岛建设和先进制造业发展等方面进行交流探讨。(证券时报)", "ctime": 1795528025, "time_str": "21:47:05", "stock_code": "", "stock_name": "", "stock_ 0.82%，导致公司披露的2024年年度报告存在虚假记载。根据《股票上市规则》第9.8.1条第八项规定，公司股票交易将被实施其他风险警示，但不触及重大违法强制退市情形。公司股票自2026年11月25日开市起停牌一天，于2026年11月26日开市起复牌并被实施其他风险警示，股票简称由“神雾节能”变更为“ST节能”，证券代码仍为“000820”，日涨跌幅限制仍为10%。公司已于2026年4月对相关会计差错进行更正及追溯调整，将积极采取措施争取撤销其他风险警示。", "ctime": 1795526830, "time_str": "21:27:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261124/c682171278.shtml"}, {"id": "5749323", "title": "TPG美股盘前涨超10%", "content": "TPG美股盘前涨超10%，现报51.0美元。", "ctime": 1795526735, "time_str": "21:25:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261124/c682171264.shtml"}, {"id": "5749321", "title": "中天火箭：程皓当选第五届董事会董事长，聘任许宏涛等为高管", "content": "中天火箭公告，公司第五届董事会第一次会议选举程皓为第五届董事会董事长，任期至第五届董事会任期届满；聘任许宏涛为总经理、宁星华为董事会秘书兼副总经理（不分管经营业务）、张晓东为财务总监。会议还审议通过调整2026年度日常关联交易预计事项的议案，该议案尚需提交股东会审议。", "ctime": 1795526714, "time_str": "21:25:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261124/c682171260.shtml"}, {"id": "5749317", "title": "天齐锂业：董事会同意全资子公司收购两家公司股权及上都布探矿权", "content": "天齐锂业公告，董事会审议通过全资子公司购买资产暨关联交易议案，同意由全资子公司成都天齐锂业有限公司及其全资子公司Tianqi Lithium HK Co.， Limited以现金收购润丰矿业和天齐兴宇股权，并由天齐（雅江）矿业有限责任公司以现金收购上都布探矿权。交易完成后，相关子公司将合计持有润丰矿业和天齐兴宇100%股权，润丰矿业及天齐兴宇将纳入公司合并报表范围。该议案尚需提交公司股东会审议，股东会时间及相关安排将另行确定。", "ctime": 1795526665, "time_str": "21:24:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261124/c682171251.shtml"}, {"id": "5749313", "title": "神雾节能：收到行政处罚事先告知书，公司及5名责任人合计拟被罚1570万元", "content": "神雾节能公告，公司及相关当事人于2026年11月24日收到江西证监局下发的《行政处罚事先告知书》。经查明，公司子公司联合立本通过虚增光伏电站建设项目施工合同金额、工程量等方式，虚增2024年营业收入6945.83万元、营业成本5648.94万元、利润总额1296.89万元，导致公司披露的2024年年度报告存在虚假记载。江西证监局拟对公司给予警告并处以560万元罚款，对吕建中、陈苏、吴凯、肖敏、吴亚伦分别处以280万元、280万元、230万元、200万元、20万元罚款。公司判断本次未触及重大违法强制退市情形，但将被实施其他风险警示。", "ctime": 1795526619, "time_str": "21:2 生的归属于公司的收入在公司整体营业收入中占比较小，不会对公司经营业绩产生重大影响，敬请投资者注意投资风险。（人民财讯）", "ctime": 1795525309, "time_str": "21:01:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261124/c682170890.shtml"}, {"id": "5748867", "title": "期市夜盘开盘，国内期货主力合约多数上涨，国际铜跌超3%", "content": "期市夜盘开盘，国内期货主力合约多数上涨。涨幅方面，乙二醇涨超2%，烧碱、甲醇、对二甲苯、纸浆、PTA等涨超1%。跌幅方面，国际铜跌超3%，沪铜跌超2%，铝合金、沪银、沪铝、沪锡跌超1%。", "ctime": 1795525188, "time_str": "20:59:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261124/c682170858.shtml"}, {"id": "5748861", "title": "国家数据局组织实施数字经济发展“十五五”行动计划", "content": "为贯彻落实党中央、国务院关于深入推进数字中国建设的战略部署，落实“十五五”规划《纲要》任务要求，国家数据局组织实施数字经济发展“十五五”行动计划，加快推进数字经济高质量发展。统筹发展和安全，以数智化助力中国式现代化为发展方向，协同推进数据基础制度构建和数字基础设施建设，充分发挥数据、场景、产业综合优势，推动科技创新和产业创新深度融合，提升数字经济核心竞争力，促进实体经济和数字经济深度融合，加快新旧动能转换，培育新质生产力，赋能高质量发展。到2030年，数字经济核心产业增加值占GDP比重达到12.5%，数字经济成为高质量发展的重要经济形态。（新华社）", "ctime": 1795525175, "time_str": "20:59:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261124/c682170855.shtml"}, {"id": "5748843", "title": "云汉芯城：拟以3000万元-5000万元回购公司股份", "content": "云汉芯城公告，拟以不低于人民币3000万元（含）、不超过人民币5000万元（含）回购公司股份，回购价格不超过人民币152.62元/股（含），回购股份拟用于股权激励计划或员工持股计划。按回购资金总额上限5000万元、回购价格上限152.62元/股测算，回购股份约为32.76万股，约占公司总股本的0.3870%；按下限3000万元测算，回购股份约为19.66万股，约占公司总股本的0.2322%。回购期限为自董事会审议通过本次回购股份方案之日起12个月内，资金来源为公司自有资金和自筹资金。", "ctime": 1795525115, "time_str": "20:58:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261124/c682170835.shtml"}, {"id": "5748827", "title": "刚果（金）一反政府武装宣布停止攻势", "content": "刚果（金）反政府武装“人民革命公约”24日发表声明，宣布停止向该国东部伊图里省首府布尼亚推进。此前，该武装与刚果（金）政府军已连续数日在该省发生激烈交火。声明说，该武装遵守此前在乌干达斡旋下向刚果（金）政府作出的承诺，已停止向布尼亚推进。据刚果（金）媒体报道，自21日以来，政府军与该武装组织在伊图里省朱古地区发生交火，导致大批民众逃往布尼亚。（新华社）", "ctime": 1795524970, "time_str": "20:56:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261124/c682170799.shtml"}, {"id": "5748815", "title": "胜宏科技：首次回购公司股份9000股，支付103.44万元", "content": "胜宏科技公告，公司此前审议通过回购公司股份方案，计划使用不低于人民币1.5亿元（含）且不超过3亿元（含）的自有资金或自筹资金以集中竞价交易方式回购公司股份，回购价格不超过240.49元/股，回购期限为自董事会审议通过方案之日起不超过12个月。2026年11月23日，公司通过股份回购专用证券账户以集中竞价交易方式实施了首次回购，回购股份数量9000股，约占公司总股本的0.001%，最高成交价为115.02元/股，最低成交价为114.88元/股，成交总金额为103.44万元（不含交易费用）。", "ctime": 1795524774, "time_str": "20:52:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261124/c682170735.shtml"}, {"id": "5748771", "title": "2027年度上海城乡居民医保集中参保启动", "content": "记者从市医保局了解到，上海2027年度城乡居民医保参保登记缴费即日起开始，至2027年1月31日结束。在城乡居民医保集中参保期内缴纳基本医疗保险费且连续参保的人员，可享受2027年度（1月1日至12月31日）城乡居民医保待遇。除新生儿等特殊群体外，在非集中参保期内参保或者未连续参保的人员参保，在待遇等待期满后，方可享受城乡居民医保待遇。（上观新闻）", "ctime": 1795524370, "time_str": "20:46:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261124/c682170613.shtml"}, {"id": "5748749", "title": "艾迪药业：2026年度向特定对象发行A股股票申请获上交所受理", "content": "艾迪药业公告，公司于2026年11月24日收到上交所出具的《关于受理江苏艾迪药业集团股份有限公司科创板上市公司发行证券申请的通知》，上交所对公司报送的科创板上市公司发行证券的募集说明书及相关申请文件进行了核对，认为该项申请文件齐备，符合法定形式，决定予以受理并依法进行审核。公司本次2026年度向特定对象发行A股股票事项尚需通过上交所审核，并获得中国证监会作出同意注册的决定后方可实施。", "ctime": 1795524205, "time_str": "20:43:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261124/c682170592.shtml"}, {"id": "5748685", "title": "胡玉亭主持召开绿色甲醇应用工作专题会议", "content": "据“吉林发布”，11月24日，吉林省委副书记、省长胡玉亭主持召开绿色甲醇应用工作专题会议。胡玉亭强调，要加快布局关键场景，发挥示范带动作用。依托吉林省研发制造优势，深化行业企业合作，聚焦局域景区运营车辆、出租车、公务车、工程用车等领域，创新商业模式，加快甲醇发动机、整车等产品研发进度，确保实现2027年绿醇燃料汽车达到千辆、2028年达到万辆级别目标。要加快轨道交通领域绿醇应用，强化有组织聚力攻坚，明确绿醇燃料应用技术路线，做好概念验证，尽快实现产品落地。要推动绿醇在航运、航空、化工领域规模化应用，加快可持续航空燃料项目建设投产。要找准绿色化、智能化、轻量化、特色化智慧农机定位，精准对接需求，订单式推动研发，推出一批绿醇动力农机产品。要拓展绿醇燃料灶具、分布式采暖、醇动力两轮车等民用应用场景，抢占发展新赛道。(人民财讯)", "ctime": 1795523782, "time_str": "20:36:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261124/c682169483.shtml"}, {"id": "5748639", "title": "猎奇智能：发行价97.53元/股，发行股份占发行后总股本25.00%", "content": "猎奇智能：发行价97.53元/股，发行股份占发行后总股本25.00%猎奇智能公告，公司首次公开发行股票并在创业板上市，发行价格确定为97.53元/股，发行1375万股，占发行后公司股份总数的25.00%，全部为公开发行新股，股东不进行公开发售股份。按发行价计算，预计募集资金总额13.41亿元，扣除预计发行费用1.23亿元（不含增值税）后，预计募集资金净额12.18亿元。发行价对应的2025年扣除非经常性损益前后孰低的归属于母公司股东净利润摊薄后市盈率为31.3倍，仍存在股价下跌给投资者带来损失的风险。网上、网下申购日为2026年11月26日。", "ctime": 1795523551, "time_str": "20:32:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261124/c682168801.shtml"}, {"id": "5748617", "title": "覆盖45个材料领域前沿热点 这场大会将在海南举办", "content": "第四届世界材料大会将于2027年1月24日至27日在海南举办，开展覆盖45个前沿热点方向的高端学术对话，全球顶尖科学家与产业创新力量将充分交流材料科学基础前沿、颠覆性技术的最新进展，共商材料科技未来发展。据介绍，本届大会以构建人类命运共同体理念为引领，以全球材料发展问题为核心主线，45个论坛分属能源材料、先进信息材料、先进结构材料、先进功能材料、生物材料、计算材料、特别专题、青年科学家大会8个类别。（新华社）(人民财讯)", "ctime": 1795523509, "time_str": "20:31:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261124/c682168647.shtml"}, {"id": "5748533", "title": "谷歌计划收购伦敦国王十字区办公楼，进一步扩大英国AI研发中心", "content": "11月24日，谷歌宣布，公司计划收购位于伦敦国王十字区的6 Pancras Square大楼，以扩大其在伦敦的办公园区。谷歌表示，此次投资将与公司在伦敦的Central Saint Giles办公楼及即将启用的Platform 37项目共同构成重要的AI研发中心，预计相关办公场所将容纳数千名员工，参与Gemini、搜索和YouTube等产品的开发。（界面新闻）", "ctime": 1795523341, "time_str": "20:29:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261124/c682168361.shtml"}, {"id": "5748505", "title": "天邦食品：控股股东张邦辉拟以1.9元/股非交易过户8000万股偿还质押融资本息", "content": "天邦食品公告，公司控股股东、实际控制人张邦辉于2026年11月23日与江苏双鱼投资有限公司及其全资子公司江苏双鱼食品有限公司签署《质押股票处置过户协议》，拟以非交易过户方式将其持有的30000000股（占总股本1.35%）转让给双鱼投资、50000000股（占总股本2.25%）转让给双鱼食品，合计80000000股（占总股本3.60%），过户价格1.9元/股，所得全部用于偿还股票质押融资本金和利息。本次过户后张邦辉持股比例由14.94%降至11.34%，仍为第一 // 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
