写道：“允许莫斯科在全球市场上自由销售俄罗斯柴油，不仅损害了美国的安全利益，也背叛了乌克兰人民……这项协议是对我们对手的馈赠，也是对我们盟友的背叛，应当将其撤销。” 这些参议员还要求特朗普利用9月签署成法的《2026年格雷厄姆制裁俄罗斯和伊朗法案》，加大对俄罗斯等国的经济施压。 媒体报道指出，签署这封公开信的包括前参议院共和党领袖米奇·麦康奈尔及其他多名资深参议员。这说明特朗普所在的共和党内的资深成员在11月3日中期选举前与特朗普产生了分歧。 美国财政部外国资产控制办公室9日发布公告说，在未来几个月放松针对俄罗斯柴油贸易的制裁，以缓解美国内柴油供应紧张、平抑油价。同日，特朗普宣布，美俄领导人就俄向美国及全球市场提供柴油达成一致。(新华社)", "ctime": 1791957933, "time_str": "14:05:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261014/c680677713.shtml"}, {"id": "5383705", "title": "A股指数延续下挫，创业板指跌幅扩大至3%", "content": "A股指数延续下挫，创业板指跌幅扩大至3%，沪指跌近1%，深成指跌近2%，科创50指数跌近3%，全市场超4500只个股下跌。算力硬件股午后普遍走低。", "ctime": 1791957929, "time_str": "14:05:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261014/c680677712.shtml"}, {"id": "5383523", "title": "韩国综指跌幅扩大至1%", "content": "韩国综指跌幅扩大至1%，现报5976.71点。个股方面，SK海力士跌超2%。", "ctime": 1791957694, "time_str": "14:01:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261014/c680677567.shtml"}, {"id": "5383489", "title": "上证50股指期货(IH)主力合约日内跌超1%", "content": "上证50股指期货(IH)主力合约日内跌超1%，现报2732.4点。", "ctime": 1791957681, "time_str": "14:01:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261014/c680677562.shtml"}, {"id": "5383385", "title": "2026年1月至9月我国牵头制定国际标准220项", "content": "记者今天（14日）了解到，2026年1月至9月，我国在国际标准化组织和国际电工委员会共牵头制定智慧城市数据利用顶层框架、钢铁行业智能制造指南等国际标准220项，新提出固态电池、人形机器人数据集等国际标准提案318项。截至目前，我国牵头和发布的国际标准共计2368个，提出的国际提案共计4079项，标准化国际影响力持续提升。（央视新闻）", "ctime": 1791957632, "time_str": "14:00:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261014/c680677542.shtml"}, {"id": "5383357", "title": "我国风电装机规模连续16年稳居世界第一", "content": "记者从中国可再生能源学会风能专业委员会了解到，今年前八个月，我国风电新增并网容量 r": "13:32:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261014/c680676503.shtml"}, {"id": "5383077", "title": "零售板块局部反弹，三江购物直线涨停", "content": "零售板块局部反弹，三江购物直线涨停，家家悦、天音控股、吉峰科技、新华百货、豫园股份跟涨。", "ctime": 1791955957, "time_str": "13:32:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261014/c680676502.shtml"}, {"id": "5383069", "title": "ASML：预计至少到2028年，行业仍将处于供不应求的状态", "content": "在2026年第三季度财报视频访谈中，ASML首席执行官傅恪礼表示，短期市场需求将继续增长，且需求周期正在进一步延长，预计至少到2028年，行业仍将处于供不应求的状态。ASML计划于2027年推出NXE:3800F，可将生产效率从目前的每小时230片晶圆提升至每小时260片晶圆。虽然初期出货量有限，但预计2028年起将显著帮助客户提升产能。在浸润式DUV方面，ASML计划使2027年交付的浸润式设备生产效率达到每小时330片晶圆。（科创板日报）", "ctime": 1791955927, "time_str": "13:32:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261014/c680676480.shtml"}, {"id": "5383061", "title": "郑商所苹果主力合约大跌6%", "content": "郑商所苹果主力合约大跌6%，报6305元/吨。", "ctime": 1791955887, "time_str": "13:31:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261014/c680676468.shtml"}, {"id": "5383045", "title": "豆包工作新增数据导入与同步功能：支持从ChatGPT、Claude Code等导入记忆及会话等", "content": "今日，豆包工作宣布上线数据导入与同步功能，支持一键导入任务偏好指令、技能、连接器、工作记忆、项目及历史会话，支持从ChatGPT、Claude Code、Trae Work等产品迁移。导入内容将自动归档至对应入口或列表，历史会话保留原有上下文，用户可直接在豆包工作内继续对话，无需重复配置或重新交代背景。（科创板日报）", "ctime": 1791955726, "time_str": "13:28:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261014/c680676397.shtml"}, {"id": "5382989", "title": "恒生科技指数午后涨超2%", "content": "恒生科技指数午后涨超2%，小米集团-W、美团-W涨超5%，阿里巴巴-W涨超4%。", "ctime": 1791955422, "time_str": "13:23:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261014/c680676248.shtml"}, {"id": "5382979", "title": "广州成立市算力公司，探索超大城市算电融合“广州模式”", "content": "近日，广州市算力产业发展有限公司正式成立。公司由南方电网数字电网集团控股，广东亿迅科技（中国电信全资子公司）、广州数科集团、广州恒运集团共同出资组建，是全国首个以算电协同为核心使命的央地合资平台，标志着广州在构建城市级算力供给体系上迈出关键一步。下一步，广州将以市算力公司为抓手，加快构建覆盖全域、互联互通、协同调度的算力网络，统筹规划推动算电建设时序衔接，持续扩大优质算力供给，打造粤港澳大湾区实时推理算力高地。（人民财讯）", "ctime": 1791955356, "time_str": "13:22:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261014/c680676225.shtml"}, {"id": "5382953", "title": "服装板块短线拉升，七匹狼涨停", "content": "服装板块短线拉升，七匹狼涨停，九牧王、嘉欣丝绸、泰慕士、森马服饰、红豆股份等纷纷走高。", "ctime": 1791955165, "time_str": "13:19:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261014/c680676165.shtml"}, {"id": "5382895", "title": "“汇源”商标侵权与不正当竞争纠纷案一审宣判", "content": "福建省福州市中级人民法院对“汇源”商标侵权与不正当竞争纠纷案作出一审判决。法院认定北京汇源集团开封有限公司、北京汇源生物科技有限公司构成商标侵权与不正当竞争，判令两公司立即停止侵权行为、消除不利影响、停止使用“汇源”字号，并共同赔偿经济损失及维权合理开支合计9700余万元；河北汇源食品饮料有限公司就相关债务承担连带责任。（新华社）", "ctime": 1791954801, "time_str": "13:13:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261014/c680676025.shtml"}, {"id": "5382863", "title": "CPO概念股午后震荡下挫，电科思仪跌超10%", "content": "CPO概念股午后震荡下挫，电科思仪跌超10%，天孚通信跌超5%，新易盛、中际旭创、仕佳光子纷纷下挫。", "ctime": 1791954604, "time_str": "13:10:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261014/c680675955.shtml"}, {"id": "5382813", "title": "新一轮冷空气即将影响我国，北方多地气温将创新低", "content": "明天（10月15日）开始，新一轮冷空气将影响我国，北方多地气温将创新低。降温过后，北方大部最高气温将不足20℃，西北、华北北部、东北等地不足10℃，早晨更是寒意显现，多地入冬进程将被加快。同时，冷空气还将带来大范围雨雪天气。（央视新闻）", "ctime": 1791954276, "time_str": "13:04:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261014/c680675790.shtml"}, {"id": "5382793", "title": "乌称基辅遭俄军袭击致3死多伤", "content": "当地时间14日，乌克兰国家紧急情况局通报称，俄军当天凌晨对基辅的袭击导致3人死亡，20余人受伤。基辅市市长克利奇科通报称，基辅和基辅州的能源设施遭到俄方密集攻击，基辅市已实施紧急停电措施。（央视新闻）", "ctime": 1791954184, "time_str": "13:03:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261014/c680675736.shtml"}, {"id": "5382733", "title": "阿斯麦第三季度净销售额为116.6亿欧元，预估为117亿欧元", "content": "阿斯麦第三季度净销售额为116.6亿欧元，预估为117亿欧元；净利润49.60亿欧元，上年同期为21.25亿欧元，预估为41.65亿欧元。阿斯麦预计第四季度营收为142亿至152亿欧元，此前市场预估为141.89亿欧元。", "ctime": 1791954099, "time_str": "13:01:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261014/c680675718.shtml"}, {"id": "5382651", "title": "新凯来亮相2026湾芯展：本次参展无新产品发布 光学检测相关设备售价为亿元级", "content": "2026湾区半导体产业生态博览会（简称“湾芯展”）今日在深圳举行。《科创板日报》记者在新凯来展台看到，其主要展示了该公司工艺装备与量检测装备。该公司现场工作人员表示，本次参展公司没有发布新产品与新技术。另据其展台相关人士称，新凯来物理与X射线量测相关产品单台售价为千万元级别，光学检测和光学量测相关单台产品售价为亿元级别。（科创板日报）", "ctime": 1791952813, "time_str": "12:40:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261014/c680675252.shtml"}, {"id": "5382639", "title": "乌方称遇袭前未获预警 美方回应未断供情报", "content": "乌克兰13日称，俄军12日和13日连续使用弹道导弹袭击乌首都基辅，乌方在这两次袭击前均未收到西方伙伴的预警。然而，美国总统特朗普当天回应称，美方仍在与乌方共享情报。据乌方消息，基辅一座热电厂和一栋9层居民楼13日遭袭，造成至少2人死亡、21人受伤。乌总统泽连斯基随后在社交媒体发文说，俄军袭击的主要目标是能源基础设施，但乌方未收到西方伙伴的预警。（新华社）", "ctime": 1791952584, "time_str": "12:36:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261014/c680675156.shtml"}, {"id": "5382635", "title": "何立峰会见法国总统外事顾问博纳", "content": "中共中央政治局委员、国务院副总理何立峰13日下午在人民大会堂会见法国总统外事顾问博纳，就中法经贸务实合作和中欧经贸关系交换意见。 何立峰表示，中法经贸合作具有广阔提升空间，中方愿继续同法方一道落实好两国元首共识，加强经济各领域务实合作、实现互利共赢。中欧互为重要经贸伙伴，中方愿同欧方在经贸领域持续开展对话，为中欧经贸关系的发展注入更多稳定性和正能量。 博纳表示，法方高度重视对华经济合作，愿同中方一道推动欧中贸易投资磋商不断取得积极成果，保持欧中经贸关系稳定发展。(新华社)", "ctime": 1791952577, "time_str": "12:36:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "so // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
