<style>
:root {
  --bg-primary: #0a0e17;
  --bg-card: #111827;
  --bg-card-hover: #1a2332;
  --border: #1e293b;
  --text-primary: #e2e8f0;
  --text-secondary: #94a3b8;
  --text-muted: #64748b;
  --red: #ef4444;
  --red-bg: rgba(239,68,68,0.1);
  --green: #22c55e;
  --green-bg: rgba(34,197,94,0.1);
  --gold: #f59e0b;
  --blue: #3b82f6;
  --purple: #8b5cf6;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Noto Sans SC', sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  min-height: 100vh;
}
.mono { font-family: 'JetBrains Mono', monospace; }
.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 20px;
  transition: all 0.2s;
}
.card:hover { background: var(--bg-card-hover); border-color: #334155; }
.badge {
  display: inline-flex; align-items: center; padding: 2px 8px;
  border-radius: 6px; font-size: 12px; font-weight: 500;
}
.badge-s { background: rgba(239,68,68,0.2); color: #ef4444; }
.badge-a { background: rgba(245,158,11,0.2); color: #f59e0b; }
.badge-b { background: rgba(59,130,246,0.2); color: #3b82f6; }
.badge-c { background: rgba(100,116,139,0.2); color: #94a3b8; }
.score-bar {
  height: 6px; border-radius: 3px; background: #1e293b; overflow: hidden;
}
.score-bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s; }
.up { color: var(--red); }
.down { color: var(--green); }
.pulse { animation: pulse 2s infinite; }
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}
.glow { box-shadow: 0 0 20px rgba(59,130,246,0.15); }
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg-primary); }
::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
</style>

<!-- 主内容区 -->
<div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-6">
  <!-- 左列: Hot7 + 板块 -->
  <div class="space-y-6">
    <div class="card">

      <div id="hot7-list" class="space-y-3"></div>

      <div id="sector-chart" style="height:260px"></div>
    </div>
  </div>

  <!-- 中列: 精选个股 -->
  <div class="lg:col-span-2">
    <div class="card">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-sm font-medium text-gray-400">精选个股 (一致性评分)</h2>
        <span class="text-xs text-gray-600 mono">满分100 = 情绪25+板块20+龙头20+资金15+量价10+封单10</span>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-sm">
          <thead>
            <tr class="text-gray-500 text-xs border-b border-gray-800">
              <th class="text-left py-2 px-2">代码</th>
              <th class="text-left py-2 px-1">名称</th>
              <th class="text-right py-2 px-1">现价</th>
              <th class="text-right py-2 px-1">涨幅</th>
              <th class="text-right py-2 px-1">评分</th>
              <th class="py-2 px-1 text-center" style="min-width:160px">评分分布</th>
              <th class="text-right py-2 px-1">板块</th>
              <th class="text-right py-2 px-1">连涨</th>
            </tr>
          </thead>
          <tbody id="picks-table"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- 新闻流 + 交易代理 -->
<div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
  <div class="card">
    <h2 class="text-sm font-medium text-gray-400 mb-4">实时新闻流</h2>
    <div id="news-feed" class="space-y-2 max-h-96 overflow-y-auto pr-2"></div>
  </div>
  <div class="card">
    <h2 class="text-sm font-medium text-gray-400 mb-4">交易代理状态</h2>
    <div id="agent-status" class="space-y-3"></div>
  </div>
</div>

const NEWS     = [{"id": "4396671", "title": "哈森股份：拟发行股份购买苏州郎克斯45%股权", "content": "哈森股份公告，公司拟通过发行股份方式购买周泽臣、王永富、黄永强3名股东持有的苏州郎克斯45%股权；同时，拟向不超过35名符合条件的特定对象发行股票募集配套资金，募集配套资金总额不超过发行股份购买资产交易价格的100%。本次交易中，上市公司将新增发行2292.45万股用于向交易对方支付股份对价，占发行后上市公司总股本的比例为9.46%（不考虑募集配套资金）。", "ctime": 1779443773, "time_str": "17:56:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260522/c676906770.shtml"}, {"id": "4396639", "title": "伊朗革命卫队称过去24小时有35艘船通过霍尔木兹海峡", "content": "当地时间22日，伊朗伊斯兰革命卫队发表声明称，在过去24小时内，有包括油轮、集装箱船以及其他商船在内的35艘船只，在获得许可并在革命卫队海军的协调与安全保障下，顺利通过了霍尔木兹海峡。（央视新闻）", "ctime": 1779443583, "time_str": "17:53:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260522/c676906585.shtml"}, {"id": "4396635", "title": "央行将开展6000亿元MLF操作", "content": "央行：为保持银行体系流动性充裕，2026年5月25日，中国人民银行将以固定数量、利率招标、多重价位中标方式开展6000亿元MLF操作，期限为1年期。", "ctime": 1779443515, "time_str": "17:51:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260522/c676906564.shtml"}, {"id": "4396631", "title": "美湖股份：收到行政监管措施决定书", "content": "美湖股份公告，公司于2026年5月22日收到中国证券监督管理委员会湖南监管局出具的《关于对湖南美湖智造股份有限公司采取监管谈话措施的决定》。经查，公司存在违规事项：2026年5月11日，公司在微信公众号发布文章，标题为“美湖股份签署具身智能订单合同”，但合同标的物实际为机器狗相关部件，未准确披露；文章描述的“合同金额人民币9.43亿元”实际为框架合同测算的最高订单额，系估算而来，且未提示相关风险，文章内容存在不准确、不完整、风险提示不充分的情形。违反了《上市公司信息披露管理办法》相关规定，监管局决定对公司采取监管谈话措施。", "ctime": 1779443377, "time_str": "17:49:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260522/c676906460.shtml"}, {"id": "4396629", "title": "欧盟扩大对伊朗制裁 将“威胁中东航行自由”行为纳入制裁范围", "content": "欧盟理事会当地时间22日决定扩大针对伊朗制裁的法律框架，将伊朗“威胁中东地区航行自由”的相关行为纳入制裁范围。根据修订后的法律框架，欧盟可对相关个人和实体采取旅行禁令、资产冻结等限制性措施，并禁止欧盟公民和企业向其提供资金、金融资产或经济资源。（央视新闻）", "ctime": 1779443340, "time_str": "17:49:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260522/c676906451.shtml"}, {"id": "4396627", "title": "将被严厉处罚！富途控股美股盘前大跌逾40%，公司回应", "content": "5月22日，富途控股美股盘前一度跌超40%。消息面上，中国证监会宣布，Tiger Brokers（NZ）Limited、富途证券国际（香港）有限公司、长桥证券（香港）有限公司的非法跨境展业行为，违反了我国证券基金期货法律法规，破坏了市场秩序，必须坚决予以打击。依据相关规定，证监会拟决定没收老虎、富途、长桥境内外相关主体全部违法所得，并依法严厉处罚。对此，21快讯记者以客户身份致电富途控股，公司接线工作人员表示，公司已经关注到相关监管动态，正在仔细研究相关内容，待信息完整后公司将统一作出回应。目前公司业务运营一切正常，客户的账户资产及各项服务不受影响。（21世纪经济报道）", "ctime": 1779443333, "time_str": "17:48:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260522/c676906448.shtml"}, {"id": "4396621", "title": "九华旅游：副总经理何龙被立案审查调查并留置", "content": "九华旅游公告，公司党委委员、副总经理何龙被纪律检查委员会、监察委员会立案审查调查并实施留置。目前公司已对相关工作进行妥善安排，董事及其他高级管理人员均正常履职，生产经营情况正常，公告事项不会对公司产生重大影响。", "ctime": 1779443288, "time_str": "17:48:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260522/c676906433.shtml"}, {"id": "4396617", "title": "美媒：美国协助以色列防御消耗导弹数量远超以军", "content": "美国《华盛顿邮报》21日报道说，美国国防部给该报提供的一份评估报告显示，在打击伊朗的军事行动中，为协助以色列防御伊朗的导弹袭击，美军消耗的尖端弹药数量远超以军，美军先进拦截导弹的库存大幅减少。多名匿名的美国官员向该报透露说，在美军代号“史诗怒火”的军事行动期间，美国为保护以色列发射了超过200枚“萨德”反导系统拦截弹，约占美国国防部总库存的一半，还从地中海部署的军舰上发射了100多枚“标准-3”和“标准-6”拦截弹。而以色列只发射了不到100枚“箭”式拦截弹和约90枚“大卫投石索”拦截弹。（新华社）", "ctime": 1779443185, "time_str": "17:46:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260522/c676906377.shtml"}, {"id": "4396615", "title": "阿斯顿马丁拉共达（中国）汽车销售有限公司召回部分进口DBX系列汽车", "content": "日前，阿斯顿马丁拉共达（中国）汽车销售有限公司根据《缺陷汽车产品召回管理条例》和《缺陷汽车产品召回管理条例实施办法》的要求，向国家市场监督管理总局备案了召回计划。召回编号S2026M0054V：自即日起，召回2020年7月1日至2024年3月28日期间生产的DBX汽车，共计1162辆；2021年9月7日至2023年10月26日期间生产的DBXI6汽车，共计713辆；2022年3月22日至2025年6月16日期间生产的DBX707汽车，共计158辆。本次召回范围内的车辆，由于后桥下摆臂扭接杆的紧固螺栓螺杆直径选型偏小，可能导致扭接杆的安装销松动滑出。极端情况下，可能造成后桥下摆臂等悬挂部件及后制动器损坏，增加车辆发生碰撞的风险，存在安全隐患。阿斯顿马丁拉共达（中国）汽车销售有限公司将通过授权经销商，免费为召回范围内的车辆更换紧固螺栓并检查后桥下摆臂，如果损坏，则予以更换，以消除安全隐患。(市场监管总局)", "ctime": 1779443165, "time_str": "17:46:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260522/c676906371.shtml"}, {"id": "4396611", "title": "中国向美国出口小家电回暖，部分订单从东南亚回流", "content": "随着贸易环境的变化，近期电风扇、制冰机等部分小家电出口美国的订单从东南亚回流中国。记者从产业人士了解到，有企业正在重新对东南亚工厂与中国工厂的产能进行规划和分配。向美国出口电风扇的中山乐途电器的总经理黎明阳告诉记者，近期有美国客户将多款小风扇模具从越南调回，把百万台级别的批量订单重新交给中国工厂来生产。美国采购商对中国供应链稳定性的信心显著回升，他们现在把简单、低附加值的订单还留在东南亚生产，但大批量、高品质、交期紧、长周期的订单放回中国。据海关总署数据，2026年1月4日，中国向美国出口小家电的金额为38.47亿美元，同比减少21.1%；其中，4月份，中国向美国出口小家电的金额为10.9亿美元，同比增长3.9%。（第一财经）", "ctime": 1779443082, "time_str": "17:44:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260522/c676906274.shtml"}, {"id": "4396613", "title": "美力科技：拟使用不超过7000万元回购公司股份", "content": "美力科技公告，拟使用自有资金及自筹资金以集中竞价交易方式回购公司股份用于实施员工持股计划或股权激励。本次回购股份资金总额不低于人民币4000万元（含）且不超过人民币7000万元（含），回购价格不超过35元/股（含），回购股份的实施期限为自董事会审议通过本次回购股份方案之日起12个月内。在回购股份价格不超过35元/股（含）的条件下，本次预计回购股份总数为114.29万股至200万股，占公司总股本的比例为0.54%至0.95%。", "ctime": 1779443082, "time_str": "17:44:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260522/c676906275.shtml"}, {"id": "4396599", "title": "品茗科技：拟以6000万元-8000万元回购公司股份", "content": "品茗科技公告，拟以6000万元-8000万元回购公司股份，回购价格不超过153元/股。", "ctime": 1779442782, "time_str": "17:39:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260522/c676906089.shtml"}, {"id": "4396579", "title": "俄称乌克兰无人机袭击学校致4名学生死亡", "content": "俄罗斯人权事务专员兰特拉托娃22日在社交媒体发文称，当天凌晨乌军使用无人机袭击了卢甘斯克地区一所学校的教学楼和学生宿舍，已导致4名学生遇难，另有35名学生受伤。兰特拉托娃说，袭击发生时，建筑内共有86名年龄在14至18岁之间的青少年。救援人员仍在清理坍塌处，目前仍有多人被困。乌克兰方面暂未作出回应。（新华社）", "ctime": 1779442677, "time_str": "17:37:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260522/c676906028.shtml"}, {"id": "4396577", "title": "华盛雷达科创板IPO暂缓审议", "content": "上海证券交易所上市审核委员会2026年第24次审议会议于2026年5月22日召开，审议结果为“暂缓审议”。在上市委会议现场，上市委要求发行人进一步说明报告期各期12月确认收入所涉项目，是否存在跨期确认收入的情况；结合最新招投标情况、在手订单及履约周期等，说明公司是否具有较强成长性，业绩是否具有可持续性。招股说明书显示，浙江华盛雷达股份有限公司深耕气象精细化探测及短临预警预报业务，是国内先进的相控阵气象雷达和短时临近预警预报平台提供商。", "ctime": 1779442653, "time_str": "17:37:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260522/c676906018.shtml"}, {"id": "4396569", "title": "美光科技美股盘前跌超2%", "content": "美光科技美股盘前跌超2%，现报746.6美元。", "ctime": 1779442388, "time_str": "17:33:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260522/c676905837.shtml"}, {"id": "4396565", "title": "南向资金今日净卖出64.94亿港元 中芯国际获净买入居前", "content": "南向资金今日净卖出64.94亿港元。中芯国际、华虹半导体分别获净买入约32.31亿港元、7.74亿港元；阿里巴巴-W、腾讯控股分别遭净卖出20.62亿港元、17.26亿港元。", "ctime": 1779442282, "time_str": "17:31:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260522/c676905766.shtml"}, {"id": "4396563", "title": "华北制药：公司获得药品注册证书", "content": "华北制药公告，近日，公司收到国家药品监督管理局核准签发的罗沙司他胶囊（20mg、50mg）《药品注册证书》。", "ctime": 1779442257, "time_str": "17:30:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260522/c676905756.shtml"}, {"id": "4396551", "title": "恒大海上威尼斯酒店二次拍卖，起拍价降至6949万元", "content": "5月22日，位于江苏省启东市寅阳镇的恒大海上威尼斯1606号不动产（含固定装修、地下室）进行第二次拍卖，起拍价为6949万元，市场价约1.24亿元，此次的起拍价较市场评估价打了约5.6折。截至发稿时已有1人报名，还未有出价记录，竞价周期为1天。（澎湃新闻）", "ctime": 1779442152, "time_str": "17:29:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260522/c676905657.shtml"}, {"id": "4396547", "title": "苑东生物：维生素K1注射液获批上市", "content": "苑东生物公告，近日收到国家药品监督管理局核准签发的《药品注册证书》。药品名称为维生素K1注射液，剂型为注射剂，规格为1ml:10mg，注册分类为化学药品3类，药品有效期为18个月。本品活性成份为维生素K1，用于治疗维生素K缺乏性出血和预防无法通过营养补充的维生素K缺乏症。2025年度，维生素K1注射液实现销售金额约5609万元。", "ctime": 1779442126, "time_str": "17:28:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260522/c676905634.shtml"}, {"id": "4396523", "title": "中国电研：秦汉军因工作调整辞去董事长等职务", "content": "中国电研公告，公司董事会于2026年5月22日收到秦汉军先生的书面辞职报告。因工作调整，秦汉军先生辞去公司董事、董事长、法定代表人及董事会战略委员会主任委员职务。截至本公告披露日，秦汉军先生通过公司员工持股平台广州凯天投资管理中心（有限合伙）间接持有公司股份172.49万股，占公司股份总数的0.43%。公司于2026年5月22日召开第二届董事会第二十一次会议，审议通过了《关于选举公司董事长的议案》，董事会同意选举公司董事、总经理孙君光先生为公司董事长，任期自本次董事会审议通过之日起至第二届董事会任期届满之日止。", "ctime": 1779441788, "time_str": "17:23:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260522/c676905408.shtml"}, {"id": "4396521", "title": "峰飞航空V5000天际龙正式进入适航取证阶段", "content": "峰飞V5000天际龙正式进入适航取证阶段，基于V5000平台优化设计的货运混动构型V5000CGH已按计划推进适航工作。同日，由1架V5000天际龙与2架V2000系列机型组成的“混合三机编队”完成演示飞行。此前，峰飞航空2吨级eVTOL凯瑞鸥已取得中国民航局颁发的TC、PC及AC“适航三证”，6座载人机型V2000EM盛世龙也在推进适航工作，已进入符合性验证阶段。（峰飞航空）", "ctime": 1779441711, "time_str": "17:21:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260522/c676905373.shtml"}, {"id": "4396515", "title": "腾讯不再与相关版权方达成版权独家授权合同 腾讯音乐宣布解除在线音频独家版权", "content": "5月22日，腾讯音乐娱乐集团发布《关于解除在线音频内容独家授权合同的公告》。公告表示，国家市场监督管理总局于2026年5月11日发布《关于附加限制性条件批准腾讯控股有限公司收购喜马拉雅公司股权案反垄断审查决定的公告》（以下简称“《决定》”）。根据《决定》所附《附加限制性条件承诺方案》（以下简称“《承诺方案》”）要求，我司承诺不再与《承诺方案》中定义的版权方（以下简称“相关版权方”）达成或变相达成版权独家授权合同，并将于《承诺方案》规定期限内解除现有各种形式的独家授权合同。我司通过本公告，特此声明并告知各合作伙伴：一、我司将放弃与相关版权方对于在线音频内容版权独家合同中有关独家授权的权利，相关版权方可自行向其他经营者进行授权，并不予追究相关版权方因授权其他经营者而产生的相关责任。二、我司将严格按照《决定》及《承诺方案》要求，与各相关版权方解除现有各种形式的独家授权合同，还请相关版权方积极配合。后续，我司将积极寻求以非独家方式与各合作伙伴继续保持合作。（鹅厂黑板报）", "ctime": 1779441500, "time_str": "17:18:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260522/c676905241.shtml"}, {"id": "4396511", "title": "广西水利厅终止洪水防御四级应急响应", "content": "记者从广西水利厅获悉，鉴于本轮影响广西的降雨系统已经减弱，全区各江河水位均在警戒水位以下，水情形势明朗，按照广西水利厅洪水防御工作预案，决定于5月22日15时终止洪水防御四级应急响应。（央视新闻）", "ctime": 1779441261, "time_str": "17:14:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260522/c676905093.shtml"}, {"id": "4396507", "title": "神舟二十三号发射在即 各系统准备就绪", "content": "今天（5月22日），神舟二十三号载人飞船发射任务组织全区合练。目前，发射任务各系统已完成相关功能检查，并做好发射前各项准备工作。早上8时30分许，在北京航天飞行控制中心的统一调度下，酒泉卫星发射中心、西安卫星测控中心以及任务各测控站点实施联调联控，全面模拟发射准备、发射以及飞行过程中的各种技术状态和工作过程。通过合练，验证了火箭、飞船、发射场、测控通信等系统设施设备的可靠性，各系统在任务中的衔接水平得到检验。同时，对神舟二十三号船箭组合体的功能和技术状态也进行了验证。（央视新闻）", "ctime": 1779441215, "time_str": "17:13:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260522/c676905072.shtml"}, {"id": "4396505", "title": "富时中国A50指数期货跌幅扩大至0.5%", "content": "富时中国A50指数期货跌幅扩大至0.5%。", "ctime": 1779441187, "time_str": "17:13:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260522/c676905061.shtml"}, {"id": "4396503", "title": "香港证监会：增强措施以应对伪造文件及洗钱风险并提高开户标准", "content": "香港证监会今天发出通函，列明在开立帐户及维持客户关系时应实施的监控措施。该通函是在证监会对12家证券经纪行的开户作业手法进行检视后发出的。有关检视识别出多项重大缺失，包括开户文件的尽职审查不足，在开户过程中接受可疑或伪造文件，及在管理与海外中介人的跨境代理关系方面的弱点。证监会对客户帐户有可能遭不当使用来进行可疑或不法交易，及因而加剧的洗钱及恐怖分子资金筹集风险，深表关注。证监会要求所有持牌法团在切实可行的情况下尽快进行内部核查，以侦测是否有任何可疑或伪造文件曾被接受用来开立帐户。香港证监会中介机构部执行董事叶志衡博士表示：“持牌法团在拓展其业务时，不应以牺牲“认识你的客户”标准为代价。证监会对在开户过程中的严重监控失误及使用伪造文件的情况采取零容忍态度，并将对相关持牌法团及其高级管理层采取坚决的监管及执法行动，以维持市场的廉洁稳健及公平的竞争环境。”（财联社）", "ctime": 1779441172, "time_str": "17:12:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260522/c676905050.shtml"}, {"id": "4396501", "title": "长桥证券回应：尚未收到正式监管通知，用户资产受到完整保障", "content": "5月22日，长桥证券官方号在长桥证券APP社区内回应称：“我们已关注到相关的新闻动态，公司尚未接收到正式的监管通知。如果有进一步信息，随时和大家沟通。大家的账户与资产受到完整保障，服务持续正常运作。”当日，中国证监会发布消息。近日，证监会依法对TigerBrokers(NZ)Limited（以下简称老虎）、富途证券国际（香港）有限公司（以下简称富途）、长桥证券（香港）有限公司（以下简称长桥）境内外相关主体在境内非法经营证券业务等行为立案调查并作出行政处罚事先告知。老虎、富途、长桥境内外相关主体未经我会核准，未取得经营证券经纪业务许可、经营证券融资融券业务许可，在境内开展证券交易营销推广、处理交易指令等相关证券业务服务并获取相关收益，上述非法跨境展业行为，违反了我国证券基金期货法律法规，破坏了市场秩序，必须坚决予以打击。证监会拟决定没收老虎、富途、长桥境内外相关主体全部违法所得，并依法严厉处罚。拟对当事人实施的行政处罚，当事人享有陈述、申辩及要求听证的权利，我会将充分听取当事人意见后，依法作出行政处罚决定。（财闻）", "ctime": 1779441136, "time_str": "17:12:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260522/c676905034.shtml"}, {"id": "4396497", "title": "金诚信：拟增加Alacran铜金银矿项目建设投资1.79亿美元", "content": "金诚信公告，公司拟根据股权比例变化相应增加Alacran铜金银矿项目建设投资1.79亿美元，累计出资金额约4.1亿美元。", "ctime": 1779441099, "time_str": "17:11:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260522/c676904994.shtml"}, {"id": "4396489", "title": "摩根士丹利对药明康德的多头持仓比例增至7.21%", "content": "据香港交易所披露，摩根士丹利对无锡药明康德新药开发股份有限公司 - H股的多头持仓比例于2026年5月18日从6.66%增至7.21%。", "ctime": 1779441078, "time_str": "17:11:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260522/c676904974.shtml"}, {"id": "4396487", "title": "贝莱德（BlackRock）对舜宇光学科技的多头持仓比例降至6.99%", "content": "据香港交易所披露，贝莱德（BlackRock）对舜宇光学科技(集团)有限公司的多头持仓比例于2026年5月18日从7.11%降至6.99%。", "ctime": 1779441068, "time_str": "17:11:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260522/c676904967.shtml"}, {"id": "4396483", "title": "土耳其最大反对党称法院裁决“不合法”", "content": "土耳其一家上诉法院21日裁定，最大反对党共和人民党2023年党内选举结果无效，现任党主席厄兹居尔·厄泽尔不能继续任职。该党指认这一裁决带有政治动机，如同“政变”。共和人民党21日拒绝承认上诉法院裁决，称其“不合法”。厄泽尔举行新闻发布会，宣布该党已上诉至土耳其最高上诉法院，并打算向土耳其最高选举机构申诉。厄泽尔称，这一裁决结果是“针对（土耳其）人民的战争”和“政变”，是土耳其“民主的黑暗日”。（新华社）", "ctime": 1779441056, "time_str": "17:10:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260522/c676904964.shtml"}, {"id": "4396475", "title": "欧盟决定暂停对部分关键氮肥征收关税一年", "content": "当地时间22日，欧盟决定暂停对部分用于农业生产的关键氮肥征收关税，措施为期一年，涉及尿素、氨等化肥原料。欧盟理事会当天发表声明称，此举旨在降低欧盟农民和化肥行业成本，推动相关供应链和贸易渠道多元化。根据欧盟委员会的估算，该措施将为欧盟农民及化肥行业节省约6000万欧元进口关税成本。声明同时表示，上述措施不适用于从俄罗斯和白俄罗斯进口的相关产品。根据安排，该措施将在《欧盟官方公报》发布次日正式生效，有效期一年。欧盟委员会将持续监测化肥市场运行情况，并视情况提出延长或调整相关措施的建议。(央视新闻)", "ctime": 1779440932, "time_str": "17:08:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260522/c676904817.shtml"}, {"id": "4396459", "title": "证监会同意武汉吉和昌新材料股份有限公司向不特定合格投资者公开发行股票注册", "content": "证监会同意武汉吉和昌新材料股份有限公司向不特定合格投资者公开发行股票注册。", "ctime": 1779440752, "time_str": "17:05:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260522/c676904696.shtml"}, {"id": "4396455", "title": "绿田机械：拟以8000万元-1亿元回购公司股份", "content": "绿田机械公告，拟以8000万元-1亿元回购公司股份，回购价格不超过28元/股。", "ctime": 1779440718, "time_str": "17:05:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260522/c676904656.shtml"}, {"id": "4396447", "title": "韩国首尔经济TV电视台就涉华假新闻道歉", "content": "韩国首尔经济TV电视台21日晚就其发布的“中国人大量购入首尔江南区公寓”节目内容以全体员工名义发表道歉声明。此前，韩国总统李在明批评该节目内容，称其为“故意捏造的虚假新闻”，“煽动厌华情绪”。据悉，该电视台已删除相关假新闻报道，并重新制作发布了由韩国国土交通部编制的关于外国人购买韩国房地产统计数据的节目内容。（新华社）", "ctime": 1779440594, "time_str": "17:03:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260522/c676904563.shtml"}, {"id": "4396437", "title": "国务院印发《关于推行常住地提供基本公共服务的实施意见》", "content": "为推行常住地提供基本公共服务，促进基本公共服务均等化水平明显提升，有力支撑深入实施以人为本的新型城镇化战略，国务院日前印发《关于推行常住地提供基本公共服务的实施意见》（以下简称《意见》）。《意见》强调，由常住地提供基本公共服务，促进未落户常住人口与户籍人口同等享有基本公共服务，有利于满足人民日益增长的美好生活需要，对提升城镇化质量、释放国内需求潜力、构建新发展格局具有重要意义。《意见》提出，要加强随迁子女教育保障，巩固提升义务教育阶段随迁子女就读公办学位比例，推动将随迁子女纳入常住地学前教育、高中阶段教育公共服务范围。推动更多城市将稳定就业居住的未落户常住人口家庭纳入公租房保障范围，稳步推进灵活就业人员参加住房公积 // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
