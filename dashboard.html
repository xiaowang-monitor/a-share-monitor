5", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260512/c676630216.shtml"}, {"id": "4352275", "title": "ST金顶：一审判决中辉天津胜诉 涉案金额1898.05万元", "content": "ST金顶公告，全资子公司中辉天津因买卖合同纠纷向天津滨海新区法院提起的诉讼案件，近日收到法院送达的《保全结果反馈告知书》。一审判决中辉天津胜诉，涉案金额1898.05万元（不含违约金、利息、诉讼费、法院保全费、保函费用等）。公司将持续跟进案件进展，依据《会计准则》的要求和届时的实际情况及时进行相应的会计处理，具体以公司经审计的财务报告为准。", "ctime": 1778578364, "time_str": "17:32:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260512/c676630213.shtml"}, {"id": "4352273", "title": "市场监管总局附条件批准腾讯收购喜马拉雅股权案", "content": "5月12日，市场监管总局发布公告，附加限制性条件批准腾讯收购喜马拉雅股权案。该案对维护中国境内在线音频播放平台市场、网络音乐播放平台市场公平竞争秩序，防范平台领域“内卷式”竞争，推动平台经济创新和健康发展具有重要意义。经审查，市场监管总局认为该案对中国境内在线音频播放平台市场、网络音乐播放平台市场竞争可能具有排除、限制竞争效果。为有效减少此项经营者集中可能产生的不利影响，市场监管总局经过全面审查、科学论证，依法对该案作出附条件批准决定，要求腾讯、喜马拉雅和集中后实体作出五项限制性承诺：不得提高在线音频播放平台服务价格、降低服务水平或者附加不合理交易条件；不得降低在线音频播放平台免费内容及免费热门内容比例；不得与在线音频播放平台版权方达成独家授权，并在规定期限内解除现有独家授权约定；不得向汽车厂商搭售在线音频播放平台、网络音乐播放平台，或者阻碍、限制其采购竞争对手产品；不得限制主播在多个在线音频播放平台入驻或分发其享有著作权的作品。经评估，市场监管总局认为该承诺方案可有效减少本集中导致的竞争问题，能够保障消费者、版权方、主播及汽车厂商等多方主体合法权益，维护相关市场公平竞争秩序，依法于5月11日附加限制性条件批准本案。（新华社）", "ctime": 1778578355, "time_str": "17:32:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260512/c676630212.shtml"}, {"id": "4352255", "title": "南向资金今日净买入7.90亿港元 华虹半导体遭净卖出居前", "content": "南向资金今日净买入7.90亿港元。华虹半导体、腾讯控股分别遭净卖出6.60亿港元、5.09亿港元；澜起科技、滴普科技分别获净买入约1.90亿港元、0.68亿港元。", "ctime": 1778578282, "time_str": "17:31:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260512/c676630194.shtml"}, {"id": "4352249", "title": "花王股份：股票连续3个交易日内日收盘价格涨幅偏离值累计超过20%", "content": "花王股份公告，公司股票于2026年5月8日、2026年5月11日、2026年5月12日连续3个交易日内日收盘价格涨幅偏离值累计超过20%，根据《上海证券交易所交易规则》的有关规定，属于股票交易异常波动的情况。经公司自查，并向公司控股股东苏州辰顺浩景企业管理合伙企业（有限合伙）书面核实，截至本公告披露日，除公司已披露的事项外，不存在影响公司股票交易异常波动的其他重大事项，不存在应披露而未披露的重大信息。公司证券简称将自2026年5月15日起由“花王股份”变更为“顺景科技”，公司证券代码“603007”保持不变。", "ctime": 1778578247, "time_str": "17:30:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260512/c676630185.shtml"}, {"id": "4352243", "title": "花王股份：公司作为申请执行人，涉及金额合计8531.39万元的执行案件", "content": "花王股份公告，公司作为申请执行人，涉及金额合计8531.39万元的执行案件已进入执行阶段。该案件涉及公司与中南设计院的建设工程施工合同纠纷。此前，湖北省高级人民法院终审判决中南设计院向公司支付工程款7590.93万元及利息。公司暂时无法判断该案件对公司当期及期后利润实际产生的影响。", "ctime": 1778578210, "time_str": "17:30:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260512/c676630159.shtml"}, {"id": "4352239", "title": "恩威医药：与专业投资机构共同投资设立基金", "content": "恩威医药公告，近日，公司与上海比邻星商务服务合伙企业（有限合伙）（以下简称“比邻星商务”）、上海未来启点私募投资基金合伙企业（有限合伙）、上海静投股权投资基金管理有限公司、上海市北高新股份有限公司、杭州临空股权投资有限公司、纳新控股有限公司、赵剑仑、孙建生、徐永才、上海昕源通信息科技有限公司、杭州旭晟成投资合伙企业（有限合伙）、蔡驰共同签署了《上海比邻星四期创业投资合伙企业（有限合伙）之有限合伙协议》（以下简称“《合伙协议》”），根据《合伙协议》约定，公司作为有限合伙人以自有资金人民币 2,000 万元出资认购投资基金份额，认缴出资比例占6.45%。", "ctime": 1778578176, "time_str": "17:29:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260512/c676630140.shtml"}, {"id": "4352237", "title": "习近平将同塔吉克斯坦总统拉赫蒙出席签字仪式", "content": "5月12日下午，国家主席习近平将在北京人民大会堂同塔吉克斯坦总统拉赫蒙出席签字仪式。(央视新闻)", "ctime": 1778578154, "time_str": "17:29:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260512/c676630138.shtml"}, {"id": "4352227", "title": "宇树科技发布载人机甲，投资人回应", "content": "5月12日，宇树发布GD01载人变形机甲GD01，定价390万元起。宇树创始人王兴兴亲自登上机甲驾驶舱，并演示了一段真人操作。根据官方介绍，该产品为全球首款量产版载人机甲，可以变形，民用交通工具，体重约500kg（载人后）。宇树早期投资人赵楠表示：宇树一直在围绕它的科技树路线图做探索。机甲机器人的核心是通过一个容易破圈的场景向全世界表达了宇树在传感器、控制器和工程能力这些机器人核心技术上的优越性。与其它公司不同，宇树的产品本身的破圈性就是营销的引擎。（第一财经）", "ctime": 1778577958, "time_str": "17:25:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260512/c676630059.shtml"}, {"id": "4352225", "title": "江南、华南等地将有较强降雨过程两部门部署防汛减灾工作", "content": "5月12日，国家防总办公室、应急管理部组织气象、水利、自然资源等部门会商研判近期强降雨发展趋势，部署重点地区防汛减灾工作。会商指出，预计5月12日至14日，江南、华南及贵州东部等地部分地区将有大雨或暴雨，局地大暴雨，局地伴有雷暴大风、冰雹等强对流天气，要注意防范山洪和地质灾害、中小河流洪水和城市内涝。会商强调，各地各有关部门要高度重视本轮降雨过程，树牢底线思维，防范化解风险，全力以赴做好防汛减灾各项工作。(央视新闻)", "ctime": 1778577940, "time_str": "17:25:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260512/c676630050.shtml"}, {"id": "4352223", "title": "习近平同塔吉克斯坦总统拉赫蒙会谈", "content": "5月12日下午，国家主席习近平在北京人民大会堂同来华进行国事访问的塔吉克斯坦总统拉赫蒙举行会谈。(央视新闻)", "ctime": 1778577911, "time_str": "17:25:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260512/c676630040.shtml"}, {"id": "4352221", "title": "*ST动力：公司股票可能被终止上市", "content": "*ST动力公告，公司股票于2026年4月30日开市起被实施退市风险警示。若公司2026年度出现连续两个会计年度财务报告内部控制被出具无法表示意见或者否定意见的审计报告，或者未按照规定披露财务报告内部控制审计报告情形的，深圳证券交易所将终止公司股票上市交易。", "ctime": 1778577887, "time_str": "17:24:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260512/c676630032.shtml"}, {"id": "4352215", "title": "百亿私募数量增至136家 总数再创新高", "content": "私募排排网数据显示，截至2026年4月30日，百亿私募数量增至136家，较上月增加4家，数量再创历史新高。这四张“新面孔”中，阳光恒益（青岛）私募基金管理有限公司实控人为阳光资产管理股份有限公司，这也意味着险资背景的百亿私募已扩容至5家。", "ctime": 1778577868, "time_str": "17:24:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260512/c676630023.shtml"}, {"id": "4352213", "title": "中微半导：发布自研32M bit SPI NOR Flash芯片", "content": "中微半导公告，公司正式发布自研32MbitSPINORFlash芯片，型号为CMS25Q32A，是继今年1月首款NORFlash后存储产品系列化的最新成果，丰富了公司存储产品阵列。该产品尚未实现销售，存在市场推广与客户开拓不及预期的风险。", "ctime": 1778577822, "time_str": "17:23:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260512/c676629996.shtml"}, {"id": "4352211", "title": "华东重机：子公司诉讼一审判决 捷佳伟创等向其赔偿约4.11亿元", "content": "华东重机公告，公司原下属二级子公司徐州光能诉讼一审判决，法院判令被告捷佳伟创等返还已支付货款4.11亿元及保函费59.34万元，并解除相关合同。该判决尚未生效，且徐州光能处于破产重整程序，公司所持债权最终受偿情况存在不确定性。", "ctime": 1778577798, "time_str": "17:23:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260512/c676629979.shtml"}, {"id": "4352207", "title": "腾讯音乐：第一季度营收79亿元，同比增长7.3%", "content": "腾讯音乐公告，2026年第一季度总收入79亿元，同比增长7.3%。其中，音乐相关服务收入65.1亿元，同比增长12.2%。公司权益持有人应占净利润20.9亿元，2025年同期为42.9亿元。非国际财务报告准则公司权益持有人应占净利润22.7亿元，同比增长7.0%。", "ctime": 1778577763, "time_str": "17:22:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260512/c676629971.shtml"}, {"id": "4352205", "title": "瑞幸咖啡将推出酒饮特调？ 店员：下周上线两款", "content": "继酱香拿铁之后，瑞幸咖啡再次加码“咖啡+酒”赛道。近日，有多位网友在社交平台发帖表示，瑞幸咖啡拟推出“绯色月光”等多款含酒精特调饮品。5月12日，记者向北京多家瑞幸咖啡门店店员确认，5月18日将上线两款含酒精特调。对于产品具体情况，瑞幸咖啡方面表示暂未有更多内容。（新浪财经）", "ctime": 1778577752, "time_str": "17:22:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260512/c676629968.shtml"}, {"id": "4352203", "title": "振东制药：员工持股计划买入923.8万股", "content": "振东制药公告，截至本公告披露日，公司第五期员工持股计划通过二级市场以集中竞价交易方式累计买入公司股票923.8万股，占公司总股本的0.93%，成交总金额为5499.39万元（不含交易费用），成交均价约为5.95元/股。本持股计划实际认购份额未超过公司股东会审议通过的拟认购份额上限。", "ctime": 1778577749, "time_str": "17:22:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260512/c676629966.shtml"}, {"id": "4352201", "title": "黄河旋风：公司股票连续三个交易日内收盘价格涨幅偏离值累计超过20%", "content": "黄河旋风公告，公司股票于2026年5月8日、5月11日、5月12日连续三个交易日内收盘价格涨幅偏离值累计超过20%，属于股票交易异常波动。经公司自查，并向公司控股股东及实际控制人核实，不存在应披露而未披露的重大事项或重要信息。公司生产经营正常，日常经营情况未发生重大变化。", "ctime": 1778577743, "time_str": "17:22:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https: const SECTORS  = [{"name": "金融", "hit_count": 31, "etfs": []}, {"name": "数据要素", "hit_count": 17, "etfs": []}, {"name": "半导体", "hit_count": 15, "etfs": []}, {"name": "消费", "hit_count": 10, "etfs": []}, {"name": "人工智能", "hit_count": 10, "etfs": []}, {"name": "军工", "hit_count": 7, "etfs": []}, {"name": "新能源", "hit_count": 6, "etfs": []}, {"name": "医药", "hit_count": 6, "etfs": []}];
const META     = {"update_time": "2026-05-12 17:47:44", "sentiment_score": 52.85087719298246, "agents": []};

// 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
