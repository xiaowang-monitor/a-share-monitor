 "5月20日，北京建筑大学与上海司南导航技术股份有限公司合作办学签约仪式暨“北斗导航与时空智能”微专业2026首届开班仪式在北京建筑大学大兴校区举行。活动现场，校企双方围绕“北斗导航与时空智能”微专业建设正式签约。该微专业面向北斗时空产业发展需求，课程内容涵盖北斗系统与GNSS原理、北斗终端与集成系统、北斗高精度定位与增强技术、时空智能与大数据分析等方向，并设置“北斗+城市”“北斗+建筑”等应用课程，旨在帮助学生建立从基础理论到行业应用的完整认知。（司南导航）", "ctime": 1779340093, "time_str": "13:08:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260521/c676861843.shtml"}, {"id": "4388995", "title": "创新药板块短线拉升", "content": "创新药板块短线拉升，迪哲医药涨超10%，昭衍新药、昂利康此前涨停，诺诚健华、热景生物、康辰药业、凯莱英、百济神州跟涨。相关ETF方面，创新药ETF富国（159748）涨2.24%，成交额2131.82万元，创新药ETF广发（515120）涨2.55%，成交额3.24亿元。", "ctime": 1779339954, "time_str": "13:05:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260521/c676861799.shtml"}, {"id": "4388981", "title": "港口航运板块午后短线拉升", "content": "港口航运板块午后短线拉升，招商南油此前涨停，宁波远洋、国航远洋、中远海能、南京港、宁波海运等跟涨。相关ETF方面，物流ETF富国（516910）涨1.33%，成交额1922.44万元，交通运输ETF华夏（159666）涨1.18%，成交额1068.89万元。", "ctime": 1779339810, "time_str": "13:03:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260521/c676861770.shtml"}, {"id": "4388975", "title": "行云科技等成立投资合伙企业", "content": "企查查APP显示，近日，深圳市行云投资合伙企业（有限合伙）成立，经营范围包含信息系统集成服务；大数据服务；人工智能行业应用系统集成服务等。企查查股权穿透显示，该企业由行云科技等共同出资。（人民财讯）", "ctime": 1779339786, "time_str": "13:03:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260521/c676861769.shtml"}, {"id": "4388951", "title": "无锡国发资本：拟获无偿转入苏南国际机场集团33.33%股权，构成重大资产重组", "content": "无锡市国发资本运营有限公司公告，根据相关文件决定，将无锡市国联发展(集团)有限公司、无锡市建设发展投资有限公司分别持有的无锡苏南国际机场集团有限公司33.33%的股权以无偿转让的方式转让给公司。该事项构成发行人重大资产重组。根据募集说明书，本次重大资产重组若达到持有人会议召开情形的，召集人将召开持有人会议。", "ctime": 1779339614, "time_str": "13:00:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260521/c676861719.shtml"}, {"id": "4388935", "title": "长三角发布2026年度一体化发展实事项目清单", "content": "第八届长三角一体化发展高层论坛21日在上海举行，会上发布2026年度长三角一体化发展实事项目清单，从十方面提升区域民众幸福感、获得感。 十项清单涉及跨省办事、食品安全、文旅消费、卫生健康等多领域，每项清单均提出内容和目标，并落实了牵头实施单位。 在打造跨省通办“高效办成一件事”最佳体验地方面，长三角将聚焦企业跨区域经营和个人异地办事需求，围绕市场迁移登记、医保跨省共济、公积金异地提取等方面，推出10个长三角地区跨省通办“高效办成一件事”标杆场景，按需开设远程虚拟窗口超650个，新增100项高频事项，新增10类高频电子证照跨省共享互认。 在共推长三角地区医疗机构检查检验结果互认方面，提出进一步健全完善互认工作机制，协同强化检查检验质量控制，推动长三角地区医疗机构检查检验互认项目至少达到400项，进一步提升长三角医疗资源利用率、提高医疗服务效率、改善患者就医体验。 围绕联合培育长三角专业技术人才，三省一市将共同举办专业技术人才和项目对接大会暨上海（长三角）中青年工程师创新创业大赛等活动，共同发布高层次专业技术人才岗位需求3000个，联合培育示范性数字技术创新创业团队100支、尖端数字技术工程师400名、高水平数字技术工程师5000名。(新华社)", "ctime": 1779339585, "time_str": "12:59:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260521/c676861717.shtml"}, {"id": "4388915", "title": "整改见成效，中央生态环保督察发布2地典型案例", "content": "21日，中央生态环境保护督察公开通报2个地方督察整改见成效的典型案例。 通报指出，2021年12月，第二轮中央生态环境保护督察指出广东恩平地热国家地质公园生态破坏的突出问题。江门市坚决扛起整改责任，以“一矿一策”的治理思路，系统推进地质公园矿山生态修复治理。为建立长效管护机制，当地从机构、制度、技术等方面入手，为地质公园装上长效守护的“安全阀”。如今，49.3万株绿植在矿山扎根，昔日破损山体重披绿装，地质公园正重拾绿水青山本貌。 通报指出，2021年，广西凤山世界地质公园因违规建设问题被第二轮中央生态环境保护督察作为典型案例曝光。广西壮族自治区党委、政府将凤山世界地质公园问题整改作为重大政治任务，坚决整改、系统修复、绿色转型。当地依法依规关停取缔良利、坡雄堡采石场，并针对喀斯特地貌脆弱、易受损的特点，开展生态修复。世界级地质遗迹三门海天窗群洞口两侧，原本散落的民宅按照就近原则搬迁安置，并开展生态修复，被遮挡的天窗美景重见天日。 记者了解到，中共中央、国务院印发的《生态环境保护督察工作条例》规定，对整改成效突出的，及时形成正面案例并进行宣传，发挥激励先进、交流工作、引领带动作用。(新华社)", "ctime": 1779339315, "time_str": "12:55:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260521/c676861653.shtml"}, {"id": "4388913", "title": "集运市场欧美、中东、红海等多条航线出现爆舱", "content": "记者今日从多家海运货代公司负责人处获悉，集装箱运输市场多条航线出现爆舱，涉及欧洲、北美、中东、红海等航线；同时，运价也不断攀升。有货代人士告诉财联社记者，红海航线运价环比上月同期上涨四至五成。（财联社）", "ctime": 1779339299, "time_str": "12:54:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260521/c676861652.shtml"}, {"id": "4388911", "title": "第二十二届文博会正式开幕", "content": "5月21日，记者现场获悉，第二十二届中国（深圳）国际文化产业博览交易会（以下简称“文博会”）正式开幕。据悉，本届文博会共组织6312家政府组团、文化机构和企业线上线下参展，将展出文化产品超过12万件，全球65个国家和地区、310家海外展商线上线下参展，其中42个国家和地区的148家企业线下参展，展会于5月21日至25日在深圳国际会展中心举行。（证券时报）", "ctime": 1779339239, "time_str": "12:53:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260521/c676861644.shtml"}, {"id": "4388895", "title": "蔚来：全新ES8交付超10万台", "content": "5月21日，蔚来宣布，全新ES8交付已超10万台。", "ctime": 1779338868, "time_str": "12:47:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260521/c676861568.shtml"}, {"id": "4388893", "title": "南疆铁路新增8座会让站开通运营 运输能力提升", "content": "记者从国铁乌鲁木齐局了解到，5月20日，南疆铁路阿克苏至巴楚段扩能改造工程新增的8座会让站全部开通运营，标志着该段铁路扩能改造取得阶段性重大成果。此次南疆铁路扩能改造新增的8座会让站为阿克苏西站、月亮湖站、一间房东站、渡鸭山站、金银川东站、启浪站、柯坪东站、齐兰驿站。会让站如同“公路超车道”，可以让列车临时停靠避让，大幅减少单线铁路列车等待时间，进一步提升铁路通过能力。（央视新闻）", "ctime": 1779338841, "time_str": "12:47:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260521/c676861561.shtml"}, {"id": "4388883", "title": "韩国综指涨幅扩大至8%", "content": "韩国综指涨幅扩大至8%，现报7787.14点。三星电子现涨7.4%、SK海力士现涨11.2%、现代汽车涨12.5%。", "ctime": 1779338653, "time_str": "12:44:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260521/c676861464.shtml"}, {"id": "4388881", "title": "美联储或因通胀高企收紧货币政策", "content": "美国联邦储备委员会5月20日公布的4月货币政策会议纪要表明，如果美国通胀持续高于目标水平，美联储可能采取一些收紧货币政策的措施。与会美联储官员认为，由于通胀持续高企，加上中东战事持续时长及其经济影响存在不确定性，美联储有必要把当前货币政策维持比预期更长时间。大多数与会官员强调，如果通胀持续高于2%，采取一些货币收紧政策可能是合适的。几乎所有与会官员都认为，中东战事可能长时间持续，即便冲突结束，石油等大宗商品价格仍可能在更长时间内处于高位。（央视新闻）", "ctime": 1779338643, "time_str": "12:44:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260521/c676861458.shtml"}, {"id": "4388871", "title": "美国纽约一机场路面塌陷致跑道关闭", "content": "当地时间5月20日，美国纽约拉瓜迪亚机场的工作人员在进行例行检查时，发现一条跑道旁的滑行道路面出现塌陷。机场方面紧急关闭该跑道进行抢修，导致约400架次进出港航班取消或延误。该跑道将关闭至当地时间21日上午。据了解，调查人员正在排查路面塌陷的可能原因，其中包括一项燃油管线工程。（央视新闻）", "ctime": 1779338434, "time_str": "12:40:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260521/c676861427.shtml"}, {"id": "4388829", "title": "南亚科：2-3年后产能将比目前增加80%至100%", "content": "存储器厂南亚科董事长邹明仁表示，公司今年将完成16Gb规格DDR5产品的验证工作，推进LPDDR5产品试产进度，同时加快1C、1D、1E自研制程工艺的研发。预计2026年资本支出超过520亿新台币。总经理李培瑛表示，新厂预计明年开始装机，明年底至后年将贡献产出，预期会增加3万多片，预期2-3年后南亚科产能将比目前增加80%至100%。（科创板日报）", "ctime": 1779337967, "time_str": "12:32:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260521/c676861293.shtml"}, {"id": "4388827", "title": "李家超：香港能为全球投资者提供一流平台大展鸿图", "content": "据大湾区之声，香港特区行政长官李家超今日（21日）在第九届世界金融论坛年会暨洲际对话2026年度大会致辞表示，香港在“一国两制”下内联外通，普通法制度与全球金融中心对接，能为全球投资者提供一流平台，大展鸿图。香港是全球第三、亚洲第一的国际金融中心。根据国际货币基金组织最新的评估，香港银行维持资本充足、流动性稳健、盈利状况良好，联系汇率制度具公信力。李家超强调，在当前复杂多变的国际环境下，我们定当主动作为。香港将继续发挥背靠祖国、联通世界的独特优势，为世界搭建对话桥梁，拓展多边合作空间，与全球共享稳定与增长的丰硕成果。", "ctime": 1779337959, "time_str": "12:32:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260521/c676861292.shtml"}, {"id": "4388823", "title": "西双版纳：金版纳·尚城开发商5年未补缴8000万土地出让金，自然资源部门已申请恢复执行", "content": "景洪工业和信息化产业集聚区嘎洒片区管理委员会5月21日通报，西双版纳自然资源部门起诉开发商金版纳·尚城公司，要求补缴8000万土地出让金。因该公司未按合同约定补缴，自然资源部门已提起诉讼，法院依法查封房产并启动拍卖程序。目前，主管部门已申请恢复执行，法院正依法启动司法拍卖流程。", "ctime": 1779337919, "time_str": "12:31:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260521/c676861276.shtml"}, {"id": "4388821", "title": "广东34个镇街出现特大暴雨 江西吉安发布红色预警", "content": "5月20日白天到21日早晨，广东阳江、江门、中山、深圳、惠州、汕尾和揭阳普遍出现了暴雨到大暴雨局部特大暴雨，茂名、湛江东部、汕头、潮州、广州、东莞、韶关、清远和河源普遍出现了大雨到暴雨局部大暴雨，其余市县出现了中到大雨局部暴雨。据气象水文监测，20日08时到21日08时，广东全省平均雨量48.5毫米，562个镇街大雨占全省总镇街数的75.4%，34个镇街特大暴雨，188个镇街大暴雨，4 // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
