地方及时转移受威胁人员，确保人民群众生命财产安全。（央视新闻）", "ctime": 1786348766, "time_str": "15:59:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260810/c678824712.shtml"}, {"id": "4924571", "title": "倍杰特：全资子公司收购金鑫冶金55%股权已完成工商变更登记", "content": "倍杰特公告，公司全资子公司倍杰特新材料以5434万元通过股权转让及增资扩股方式取得金鑫冶金55%股权，近日已完成相关工商变更登记手续，金鑫冶金纳入公司合并报表范围。", "ctime": 1786348530, "time_str": "15:55:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260810/c678824614.shtml"}, {"id": "4924569", "title": "普洛药业：子公司获己酮可可碱缓释片药品注册证书，规格0.4g", "content": "普洛药业公告，公司控股子公司浙江普洛康裕制药有限公司收到国家药品监督管理局签发的己酮可可碱缓释片《药品注册证书》。该药品规格0.4g，注册分类为化学药品3类，上市许可持有人及生产企业均为浙江普洛康裕制药有限公司。己酮可可碱缓释片为周围血管扩张药，根据相关数据显示，该产品2025年度国内市场规模约为5227万片，销售金额约为2.62亿元。公司该产品以化学药品3类获批，视同通过仿制药一致性评价。", "ctime": 1786348510, "time_str": "15:55:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260810/c678824611.shtml"}, {"id": "4924567", "title": "*ST广糖：2026年上半年净利润亏损1602.86万元", "content": "*ST广糖公告，2026年上半年营业收入15.82亿元，同比增长17.39%。净利润亏损1602.86万元，上年同期净利润912.35万元。", "ctime": 1786348487, "time_str": "15:54:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260810/c678824591.shtml"}, {"id": "4924557", "title": "苏州市发布京杭运河苏州段洪水红色预警", "content": "苏州市水务局8月10日15时发布京杭运河苏州段洪水红色预警。提醒影响区域各级政府及有关部门密切关注水雨情变化，加强应急值守和分析研判，组织巡堤查险，做好应急抢险准备。（央视新闻）", "ctime": 1786348386, "time_str": "15:53:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260810/c678824558.shtml"}, {"id": "4924545", "title": "宁夏7月外送电量、外送新能源电量双创新高", "content": "记者8月10日从宁夏电力交易中心有限公司获悉，宁夏7月外送电量112.59亿千瓦时，同比增长5.3%；外送新能源电量32.72亿千瓦时，同比增长12.7%，单月外送电量、新能源外送电量均创新高。与此同时，8月10日，宁夏首次成交8月外送蒙东地区电量0.02亿千瓦时，今年宁夏至此已实现向福建、广东等4省区首次送电，外送范围由19个省份扩展至23个省份。据介绍，为完成年度外送目标，宁夏电力交易中心有限公司全力增加外送方向及规模，多部门协同配合滚动开展电网平衡测算，释放晚峰送电能力，跟踪购电省购电意向，拓展新增外送方向，抢抓各直流通道送电空间。（新华社）", "ctime": 1786348116, "time_str": "15:48:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260810/c678824402.shtml"}, {"id": "4924527", "title": "石药创新：猴痘mRNA疫苗获美国临床试验批准，编号33047", "content": "石药创新公告，公司控股子公司石药集团巨石生物制药有限公司与中国科学院微生物研究所合作开发的SYS6037注射液（猴痘mRNA疫苗）药品临床试验申请已获得美国FDA批准，可以在美国开展临床试验。SYS6037注射液为单条mRNA链编码的多抗原猴痘疫苗，用于猴痘的预防；临床前研究显示其相较于减毒活疫苗（天坛株）具有更优的免疫原性和保护效力，且对多种正痘病毒抗原表现出广谱交叉反应。", "ctime": 1786347989, "time_str": "15:46:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260810/c678824278.shtml"}, {"id": "4924521", "title": "现货黄金站上4360美元/盎司 纽约期金站上4420美元/盎司", "content": "现货黄金站上4360美元/盎司，日内涨0.47%。纽约期金站上4420美元/盎司，日内涨0.49%。", "ctime": 1786347928, "time_str": "15:45:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260810/c678824263.shtml"}, {"id": "4924511", "title": "华兰生物：控股子公司正在开展新型流感病毒mRNA疫苗的研发工作", "content": "华兰生物在互动平台表示，控股子公司华兰疫苗正在开展新型流感病毒mRNA疫苗的研发工作，疫苗研发存在不确定性，请投资者注意投资风险。（第一财经）", "ctime": 1786347434, "time_str": "15:37:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260810/c678823986.shtml"}, {"id": "4924503", "title": "中国中铁在海南成立生态环境投资发展公司", "content": "企查查APP显示，近日，海南铁工生态环境投资发展有限公司成立，法定代表人为张荣耀，注册资本为1亿元，经营范围包含：水利相关咨询服务；水污染治理；海水养殖和海洋生物资源利用装备销售；海洋工程装备销售；海洋服务等。企查查股权穿透显示，该公司由中国中铁间接全资持股。（人民财讯）", "ctime": 1786347342, "time_str": "15:35:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260810/c678823968.shtml"}, {"id": "4924501", "title": "河南郑州启动防汛三级应急响应", "content": "8月10日14时30分，郑州市防汛抗旱指挥部启动防汛三级应急响应。受台风“白海豚”影响，郑州市11日至13日将出现暴雨、大暴雨天气，降水极端性显著增强。主要降水时段在11日8时至13日8时，过程累计降水量250到400毫米，局地500毫米以上。最大小时降水量60到90毫米，局地100到120毫米。10日夜里至13日，郑州市有4级左右东北风，阵风7到8级，局地9级以上。（央视新闻）", "ctime": 1786347303, "time_str": "15:35:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260810/c678823953.shtml"}, {"id": "4924493", "title": "玲珑轮胎：控股股东股权结构变更完成工商登记", "content": "玲珑轮胎公告，公司于近日收到控股股东玲珑集团通知，其股权结构变更已依法完成工商变更登记手续。2026年7月31日，玲珑集团原股东王锋先生将持有的全部股权转让给戴云霞女士。本次变更未导致玲珑集团持有的公司股份数量发生变化，公司控股股东仍为玲珑集团，实际控制人仍为王氏家族。", "ctime": 1786347196, "time_str": "15:33:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260810/c678823910.shtml"}, {"id": "4924491", "title": "陕西煤业：7月煤炭产量1429万吨，同比增1.28%", "content": "陕西煤业公告，2026年7月煤炭产量1429万吨，同比增1.28%，自产煤销量1336万吨，同比增2.85%；本年累计煤炭产量1.05亿吨，同比增3.88%，自产煤销量9702万吨，同比增3.37%。发电业务方面，7月总发电量44.95亿千瓦时，同比-8.10%，总售电量42.14亿千瓦时，同比-8.83%。", "ctime": 1786347191, "time_str": "15:33:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260810/c678823908.shtml"}, {"id": "4924489", "title": "南侨食品：2026年7月合并营收1.88亿元，同比减少5.19%", "content": "南侨食品公告，2026年7月合并营业收入为人民币1.88亿元，同比减少5.19%。", "ctime": 1786347186, "time_str": "15:33:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260810/c678823906.shtml"}, {"id": "4924487", "title": "合富中国：2026年1-7月累计营收3.9亿元，同比减少8.27%", "content": "合富中国公告，2026年1-7月累计合并营业收入为人民币3.9亿元，较去年同期的4.25亿元减少8.27%，相较去年对比前年的同期降幅22.66%，有显著改善。", "ctime": 1786347180, "time_str": "15:33:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260810/c678823901.shtml"}, {"id": "4924481", "title": "东芝对铠侠持股比例由15.10%降至14.06%", "content": "8月10日，东芝向日本财务省提交文件披露，对铠侠的持股比例由15.10%降至14.06%。（界面新闻）", "ctime": 1786347099, "time_str": "15:31:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260810/c678823842.shtml"}, {"id": "4924471", "title": "先导基电在武汉成立半导体公司", "content": "企查查APP显示，近日，凯世通半导体（武汉）有限公司成立，法定代表人为余舒婷，注册资本为1000万元，经营范围包含半导体器件专用设备制造；半导体器件专用设备销售；机械零件、零部件加工；机械设备研发等。企查查股权穿透显示，该公司由先导基电旗下上海凯世通半导体股份有限公司全资持股。（人民财讯）", "ctime": 1786346974, "time_str": "15:29:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260810/c678823763.shtml"}, {"id": "4924421", "title": "西班牙对意“报复”实施 首日入境检查约200人", "content": "由于意大利拒绝取消因休达“偷渡潮”而对西班牙实施的边境管控，西班牙上周末正式恢复对意大利航班和船舶的入境检查，首日抽查约200名旅客。西班牙内政部8日晚发布消息说，当天对从意大利飞往西班牙马德里、巴塞罗那等6个城市的12个航班的199人进行了入境检查。按照内政部此前在一份声明中的说法，入境检查“随机”进行，重点是“第三国公民”，以核实他们是否符合《申根边境法》要求，但抽查对象也包括意大利公民。这一临时入境检查措施将持续至9月7日。（央视新闻）", "ctime": 1786346484, "time_str": "15:21:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260810/c678823579.shtml"}, {"id": "4924405", "title": "7月IPO注册批文，创年内单月新高", "content": "7月IPO市场迎来年内供给高峰，根据记者统计，在注册端，共有21家IPO企业披露注册批文，创下年内单月新高。其中北交所贡献占比过半；科创板保持年内相对较高的注册节奏，当月共有4家获批。在发行端，7月共有20家IPO企业启动招股工作，在年内处于高位水平，合计募资规模刷新年内纪录。其中长鑫科技以579.19亿元的实际募资额，成为注册制以来A股最大IPO。（证券时报）", "ctime": 1786346207, "time_str": "15:16:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260810/c678823392.shtml"}, {"id": "4924399", "title": "美国前空军部长被指泄露“空军一号”机密", "content": "美国民主党籍前总统拜登执政时的空军部长弗兰克·肯德尔近日被指向媒体泄露有关总统专机“空军一号”的机密信息，其安全许可被政府撤销。据美国方面消息，肯德尔近期接受媒体采访时，谈及卡塔尔赠送给现任共和党籍总统特朗普的波音747型“空军一号”存在安全缺陷。肯德尔称，对这架专机用于美国本土以外地区感到“意外”。他认为专机改装速度过快，质疑是否已“最大化”安防特性。（央视新闻）", "ctime": 1786346176, "time_str": "15:16:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260810/c678823382.shtml"}, {"id": "4924395", "title": "伊朗批准霍尔木兹海峡安全纲要 关键岗位“换将”", "content": "伊朗议会国家安全与外交政策委员会发言人哈桑·卡什卡维9日表示，《确保霍尔木兹海峡安全与发展的战略行动计划》总体框架已获委员会通过。伊朗伊斯兰共和国通讯社报道说，卡什卡维表示，相关机构和部门的口头及书面意见在议会国家安全与外交政策委员会的会议上被讨论和审议，相关机构代表参加了会议。最终，该计划总体框架在委员会以全票通过。据伊朗伊斯兰共和国通讯社9日报道，该计划旨在保障霍尔木兹海峡及海湾地区的安全与可持续发展。伊朗当天还公布了高层人事调整。伊朗总统府负责新闻与通信事务的副主任迈赫迪·塔巴塔巴伊9日宣布，穆赫辛·雷扎伊出任伊朗最高国家安全委员会秘书。雷扎伊还被伊朗最高领袖穆杰塔巴任命为其在伊朗最高国家安全委员会的代表。雷扎伊生于1954年，1981年至1997年担任伊朗伊斯兰革命卫队总司令，后曾任伊朗确定国家利益委员会秘书长，还曾在伊朗前总统莱希治下担任分管经济事务的副总统。（新华社）", "ctime": 1786346093, "time_str": "15:14:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260810/c678823349.shtml"}, {"id": "4924387", "title": "飞凯材料：目前公司业务暂不涉及ALD钼前驱体", "content": "飞凯材料8月10日在互动平台回复称，目前公司业务暂不涉及ALD钼前驱体。（人民财讯）", "ctime": 1786346051, "time_str": "15:14:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260810/c678823330.shtml"}, {"id": "4924381", "title": "京北方中标某金融资产登记交易机构新一代核心业务系统项目", "content": "京北方中标某金融资产登记交易机构新一代核心业务系统项目。该项目将围绕金融资管产品全生命周期（登记、交易、存续管理、信息披露）打造一体化平台，重点实现三大目标：全面重构核心业务能力；筑牢信创合规底座；重塑用户体验与管理效能。（人民财讯）", "ctime": 1786345913, "time_str": "15:11:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260810/c678823291.shtml"}, {"id": "4924379", "title": "马云现身西北，探访沙漠农业和水资源利用", "content": "近日，接连有网友称在甘肃、新疆偶遇阿里巴巴创始人马云。照片显示，马云一身休闲穿搭，戴着草帽和墨镜，晒得挺黑，看起和周围人也聊得很热烈。据了解，马云这次途经甘肃、新疆，主要是探访西北沙漠农业发展与水资源利用。（新浪科技）", "ctime": 1786345852, "time_str": "15:10:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260810/c678823272.shtml"}, {"id": "4924377", "title": "华瓷股份：纳米氧化锆、氧化锆研磨珠产品已在新能源等领域批量供货", "content": "华瓷股份8月10日在互动平台回复称，目前公司纳米氧化锆、氧化锆研磨珠产品已在新能源、电子元器件、医用齿科领域实现规模化批量供货。（人民财讯）", "ctime": 1786345758, "time_str": "15:09:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260810/c678823225.shtml"}, {"id": "4924375", "title": "经销商人士证实：雪佛兰已暂停在华新车销售", "content": "近日，雪佛兰退出中国市场话题在业内引发热议。通用中国今日回应称，在中国，凯迪拉克与别克在各自的细分市场中具备良好的竞争优势，能够支持业务的可持续增长；而合资企业旗下的雪佛兰产品线则最契合出口市场需求。通用中国方面强调，雪佛兰产品将继续在中国生产，并积极探索在美国以外的海外市场机遇。对于现有的中国雪佛兰车主，公司将提供完善的售后服务保障。多位雪佛兰授权经销商内部人士证实，雪佛兰已经暂停在华新车销售，但各方提及的停售时点存在差异：有经销商称，停售大致从去年年底启动，也有经销商表示，销售停滞已持续一年有余。（第一财经）", "ctime": 1786345726, "time_str": "15:08:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260810/c678823205.shtml"}, {"id": "4924373", "title": "百花奖首次设立AIGC单元", "content": "第38届大众电影百花奖AIGC推优单元荣誉盛典日前在北京举办。这是百花奖创办64年来首次为AIGC影像开设专门征集通道。活动在一个多月内收到2038件投稿，最终30部作品进入终审，24部获入围荣誉，6部获推优荣誉。终审评委俞白眉把AI比作“牛奶倒进了水”，是分子结合而非简单替代，“目前所有创意灵感都来自于人类，方向盘还在人的手里”。（21世纪经济报道）", "ctime": 1786345704, "time_str": "15:08:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260810/c678823195.shtml"}, {"id": "4924367", "title": "2026年服贸会进入倒计时一个月 180余项创新成果将集中发布", "content": "今天（10日），距离2026年中国国际服务贸易交易会（以下简称“服贸会”）开幕还有一个月。在服贸会永久会址首钢园区，一系列组展办会和服务保障细节正式发布。本届服贸会上，80余家企业和机构计划发布180余项创新成果，并首次设置“出海服务企业展区”，展会国际化、专业化、市场化水平进一步提升。（央视新闻）", "ctime": 1786345626, "time_str": "15:07:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260810/c678823167.shtml"}, {"id": "4924355", "title": "京东物流与迅销集团达成战略合作", "content": "近日，京东物流与迅销集团达成战略合作，双方将携手共建全球物流供应链网络，全面提升供应链自动化、数字化与可持续发展水平。京东物流将为迅销集团旗下品牌打造海外配送服务体系，助力其电商物流进一步实现降本增效。（京东物流黑板报）", "ctime": 1786345468, "time_str": "15:04:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260810/c678823034.shtml"}, {"id": "4924349", "title": "ETF两市成交额报4879.61亿元，较上一交易日此时缩量511.13亿元", "content": "截至目前，ETF两市成交额报4879.61亿元，较上一交易日此时缩量511.13亿元，分类型来看，股票型ETF成交额1643.38亿元，债券型ETF成交额2044.9亿元，货币型ETF成交额314.52亿元，商品型ETF成交额111.98亿元，QDII型ETF成交额764.82亿元。", "ctime": 1786345   if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
