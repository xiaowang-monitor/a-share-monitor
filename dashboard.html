并处以29万元罚款，暂停新开证券账户3个月", "content": "国盛证券此前因涉嫌违反账户实名制等规定被中国证监会立案，后收到行政处罚事先告知书。公司及相关当事人于2026年11月11日收到江西证监局《行政处罚决定书》及《行政监管措施决定书》：国盛证券被警告并处以29万元罚款，并被责令改正、暂停新开证券账户3个月；暂停期间不得新增经纪业务客户。公司未触及重大违法强制退市情形，亦不触及其他风险警示情形；暂停新开证券账户不影响存量客户交易，预计对本期合并收入和利润影响较小，但对未来经营业绩的影响存在不确定性。", "ctime": 1794405838, "time_str": "22:03:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261111/c681723301.shtml"}, {"id": "5631491", "title": "爱尔眼科：国内大规模网点布局已基本落地，未来大额资本开支将明显缩减", "content": "爱尔眼科在投资者关系活动记录表中表示，国内大规模网点布局已基本落地，投入高峰已过，未来重点转向做深现有业务、提升单店收入，大额资本开支将明显缩减。", "ctime": 1794405813, "time_str": "22:03:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261111/c681723299.shtml"}, {"id": "5631487", "title": "湘财股份：子公司湘财证券被罚款29万元，暂停新开证券账户3个月", "content": "湘财股份公告，子公司湘财证券此前因涉嫌违反账户实名制等规定被立案，2026年11月11日收到湖南证监局《行政处罚决定书》和《行政监管措施决定书》。湖南证监局对湘财证券给予警告并处以29万元罚款；责令其限期改正，并自收到决定书之日起暂停新开证券账户3个月，期间不得新增经纪业务客户。公司表示，相关事项不触及其他风险警示、重大违法类强制退市情形，预计对本期合并收入和利润的影响较小，暂停新开账户不影响存量客户服务。", "ctime": 1794405786, "time_str": "22:03:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261111/c681723293.shtml"}, {"id": "5631373", "title": "北京力争建成具身智能机器人产业创新高地", "content": "北京市经济和信息化局11日发布的《北京市具身智能机器人产业高质量发展行动方案（2026—2028年）》明确，北京力争到2028年，培育不少于5家国际一流、10家国内领先的人形机器人整机企业，具身智能模型、机器人本体和关键技术均达到国际一流水平；将北京建设成为国际一流的具身智能机器人技术策源地和产业创新高地。(新华社)", "ctime": 1794405313, "time_str": "21:55:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261111/c681723258.shtml"}, {"id": "5631289", "title": "泽连斯基：阿布扎比会谈就筹备新一轮战俘交换达成共识", "content": "乌克兰总统泽连斯基11日在丹麦表示，已听取乌克兰代表团关于乌克兰、美国和俄罗斯代表在阿联酋举行会谈的成果及乌方与欧洲伙伴协调情况的汇报。会谈各方就筹备新一轮人道主义战俘交换达成共识，讨论了安全保障问题，认为结束冲突应是落实安全保障的第一步，并就扩大后续工作机制、纳入欧洲国家参与进行了协调。乌方强调，欧洲应参与外交进程的所有阶段。（央视新闻）", "ctime": 1794404794, "time_str": "21:46:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261111/c681723185.shtml"}, {"id": "5631259", "title": "字节AI芯片负责人离职，自研芯片布局进一步整合", "content": "字节跳动 AI 芯片与 DPU 团队负责人施云峰已提交离职申请，目前正处于离职交接期。施云峰毕业于北京大学信息科学技术学院，曾任职于联发科、美满电子及华芯通， 2018 年加入字节跳动，向字节跳动副总裁、火山引擎业务负责人杨震原汇报。 从成立之初，字节 AI 芯片团队就选择对标谷歌 TPU 的专用芯片路线，采用纯 ASIC 架构。2026 年，相关芯片已完成流片，但实际性能未达预期，团队目前正推进下一代芯片的研发。（ 晚点 LatePost ）", "ctime": 1794404423, "time_str": "21:40:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261111/c681723069.shtml"}, {"id": "5630935", "title": "欧佩克维持今明两年全球石油需求增长预测不变", "content": "欧佩克月报：维持2026年和2027年全球石油需求增长预测不变。2026年全球石油需求增长预测为每日18万桶，2027年全球石油需求增长预测为255万桶/日。", "ctime": 1794403990, "time_str": "21:33:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261111/c681722476.shtml"}, {"id": "5631113", "title": "沐曦和优必选联姻造具身芯片 合资公司最新融资5亿元", "content": "曦选创智科技（无锡）有限公司近期完成5亿元人民币天使轮融资，由纪源资本、经纬创投联合领投。该公司成立于2026年5月，由国产GPU“四小龙”之一沐曦股份与“人形机器人第一股”优必选共同发起成立，致力于建设自主可控的具身智能计算平台，以国产GPGPU架构为技术路线，将NVIDIA Thor作为芯片与平台建设的对标目标。本轮资金计划主要用于核心芯片与计算平台研发、软件工具链建设、研发团队扩充，以及与机器人厂商和行业客户开展联合验证，完成量产交付。（21财经）", "ctime": 1794403482, "time_str": "21:24:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261111/c681722779.shtml"}, {"id": "5631089", "title": "Anthropic巨型IPO据称获数倍超额认购", "content": "知情人士称，Anthropic的IPO认购需求火热，订单已达发售股份的数倍，有望成为史上规模最大的新股发行，需求主要来自基石投资者的意向认购。该公司及其联合创始人计划通过IPO+私募配售合计募资最高904亿美元，两项融资加总将超过SpaceX的IPO，有望成为有史以来最大一笔上市融资。本次IPO条款仍存在变动可能，Anthropic代表暂未回应置评请求。公司正举办多场推介活动提振认购热度，本周五将有线上直播，CEO达里奥·阿莫迪将与摩根大通CEO戴蒙同台。（新浪财经）", "ctime": 1794403208, "time_str": "21:20:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261111/c681722702.shtml"}, {"id": "5631075", "title": "Coherent美股盘前涨超10%", "content": "Coherent美股盘前涨超10%，现报236.15美元。", "ctime": 1794403021, "time_str": "21:17:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261111/c681722663.shtml"}, {"id": "5631073", "title": "中国宝武与斯凯孚签署合作谅解备忘录", "content": "据中国宝武消息，11月11日上午，中国宝武与斯凯孚签署合作谅解备忘录。斯凯孚是全球轴承行业的领军企业。双方将以此次签约为新起点，在轴承钢联合研发、设备全生命周期管理、绿色低碳产品开发等方面深化协同。（人民财讯）", "ctime": 1794403007, "time_str": "21:16:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261111/c681722658.shtml"}, {"id": "5631065", "title": "俄计划于2027年选定月球核电站方案", "content": "俄罗斯国家原子能公司首席执行官利哈乔夫10日表示，该公司计划于2027年选定月球核电站方案。(新华社)", "ctime": 1794402950, "time_str": "21:15:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261111/c681722628.shtml"}, {"id": "5631013", "title": "欧盟2027年预算案初步敲定", "content": "欧盟理事会11日发布公报称，欧盟理事会与欧洲议会已就2027年欧盟年度预算达成协议，拟支付拨款总额2115亿欧元，将保障既定政策和项目实施，并增强应对乌克兰和中东局势等持续性危机及突发挑战的能力。欧洲议会和欧盟理事会还需在14天内正式批准该协议。2027年是欧盟2021年至2027年多年期财政框架的最后一年，欧盟正就2028年至2034年新一轮多年期财政框架展开谈判，提出总额近2万亿欧元的长期预算方案，重点支持安全、防务和竞争力等领域，但成员国在预算总规模和资金分配等问题上仍存在分歧。（新华社）", "ctime": 1794402729, "time_str": "21:12:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261111/c681722566.shtml"}, {"id": "5630997", "title": "伊朗波斯湾海峡管理局：船只承认违规可从宽处理", "content": "伊朗波斯湾海峡管理局11日表示，此前已违规通行霍尔木兹海峡的船只如向该局承认违规行为，“可获从宽处理的机会”。该局称，部分违规船只可通过承认违规行为并履行相关承诺，避免被列入违规船舶名单。近日有两艘持伪造文件驶往波斯湾南部港口的散货船受到法律处置，在接受管理局规定的相关承诺措施后，未被列入违规船舶名单。（新华社）", "ctime": 1794402647, "time_str": "21:10:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261111/c681722558.shtml"}, {"id": "5630969", "title": "百亿私募连续两周逆势加仓", "content": "市场震荡之际，百亿私募仍在逆势加仓。私募排排网数据显示，截至2026年10月30日，百亿私募仓位指数达83.1%，较前一周上升1.47个百分点，已连续两周逆势加仓。仓位结构上，64.53%百亿私募满仓，25.14%中等仓位，低仓和空仓占比分别为9.78%和0.55%；与前一周相比，满仓和低仓占比均有所提升，头部私募内部存在一定分化，整体仓位结构呈上移趋势。（人民财讯）", "ctime": 1794402531, "time_str": "21:08:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261111/c681722521.shtml"}, {"id": "5630947", "title": "飞亚达：机器人业务收入占比不足5%", "content": "飞亚达公告，公司A股股票于2026年11月9日至11日连续三个交易日收盘价格涨幅偏离值累计超过20%。公司自查并向控股股东、实际控制人核实后称，生产经营情况正常，不存在应披露而未披露的重大事项。公司机器人领域业务主要产品为精密减速器及精密结构件，仍处于培育发展期，前三季度相关业务收入占整体营业收入比例不足5%，预计短期内不会对经营业绩产生重大影响。2026年前三季度，公司营业收入30.14亿元，同比增长0.5%；归属于上市公司股东的净利润1.49亿元，同比下降0.97%。", "ctime": 1794402433, "time_str": "21:07:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261111/c681722501.shtml"}, {"id": "5630945", "title": "成都天府往返伊斯坦布尔定期客运航线开通", "content": "11月11日15时50分许，搭载200余名旅客的TK226航班平稳落地成都天府国际机场，标志着土耳其航空执飞的成都天府往返伊斯坦布尔定期客运航线正式开通，成都天府国际机场也是土耳其航空在中国大陆的第4个航点。该航线每周三班往返直飞，采用波音787-9宽体客机执飞，每周一、周四及周六从成都天府国际机场出港。航线开通后，四川成都至伊斯坦布尔往返航班将达到每周7班，进一步加强中国中西部地区与土耳其之间的互联互通。（新华社）", "ctime": 1794402410, "time_str": "21:06:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261111/c681722496.shtml"}, {"id": "5630919", "title": "Sportradar Group美股盘前跌超10%", "content": "Sportradar Group美股盘前跌超10%，现报12.0美元。", "ctime": 1794402331, "time_str": "21:05:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261111/c681722458.shtml"}, {"id": "5630691", "title": "期市夜盘开盘，国内期货主力合约多数上涨", "content": "期市夜盘开盘，国内期货主力合约多数上涨。涨幅方面，燃油涨超3%，低硫燃油、丙烯、原油、乙二醇、LPG、合成橡胶、聚丙烯涨超2%，纯苯、甲醇涨超1%。跌幅方面，纸浆、沪铅小幅下跌。", "ctime": 1794402008, "time_str": "21:00:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261111/c681722316.shtml"}, {"id": "5630651", "title": "优必选首次披露超仿生人形机器人大额订单 永达汽车采购400台", "content": "11月11日，优必选方面宣布称，该公司与永达汽车签署战略合作协议。根据协议，永达汽车将采购400台优必选超仿生人形机器人U1 Pro，计划于今年内交付。记者从优必选处独家获悉，该订单是公司披露的首个超仿生人形机器人大额订单。目前U1 Pro在京东平台的售价为16.98万元/台。按照这一价格来算，该笔订单合计金额超过6500万元。据了解，永达首批采购的400台超仿生人形机器人U1 Pro将用于产品体验、销售推广和客户服务合作等。此外，双方还计划在上海共建优必选全系列机器人体验展示中心。（每日经济新闻）", "ctime": 1794401789, "time_str": "20:56:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261111/c681722249.shtml"}, {"id": "5630635", "title": "显卡价格跳水？多位主营显卡产品的商家否认了“高端显卡价格大幅波动”的说法", "content": "日前，有消息称，近期高端显卡价格剧烈波动，部分型号价格从一个月前的1.8万元/张下跌至目前的1.4万元/张。对此，11月11日下午，记者实地探访被称为“全国电子第一街”的深圳华强北，走访相关电子市场。多位主营显卡产品的商家向记者否认了“高端显卡价格大幅波动”的说法，表示大幅波动并不属实，只是近段时间以来的持续调整。记者现场了解到，11月11日，市场主流用于AI或游戏的高端显卡RTX 5080价格约为1.43万元/张，RTX 5090价格则为4.85万元/张，主流用于电脑的RTX 5060价格则为3000多一张。“最近变化不是很大，只是之前涨幅太大了，9月份之前，RTX 5080才8000多一张，RTX 5090才2万多一张；普通显卡价格也涨了，9月份之前只要2000多一张。现在的价格，只是从11月份至今的微幅调整，价格波动没有特别大。”深圳赛格电子市场新君为电脑负责人刘文基告诉记者。“最近显卡价格没有大幅调整，但是价格每天都不一样。”深圳赛格电子市场景丰专业显卡主理人对记者表示。（证券时报网）", "ctime": 1794401639, "time_str": "20:53:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261111/c681722196.shtml"}, {"id": "5630613", "title": "河南省直住房公积金政策调整 自住住房装修提取最高额度不超15万元", "content": "11月11日，河南省省直机关住房资金管理中心发布通知，支持自住住房装修提取住房公积金。提取条件包括缴存人及配偶在郑州市域内拥有自住住房满6个月（含）以上，且未办理过自住住房装修提取；有效住房证明材料载明的时间在5年（含）以内或15年（含）以上等。提取标准统一按1500元/平方米核定，按房屋登记建筑面积（购房合同、不动产权证或房屋所有权证载明面积）×提取标准计算，最高额度不超过15万元。（人民财讯）", "ctime": 1794401480, "time_str": "20:51:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261111/c681722155.shtml"}, {"id": "5630597", "title": "卫星化学：拟投资约207亿元建设丙烯及下游高端新材料项目", "content": "卫星化学公告，公司于2026年11月11日与徐圩新区管委会签订《徐圩新区投资项目合作协议书》，拟在徐圩新区投资新建丙烯及下游高端新材料项目，项目总投资约207亿元，其中一期计划投资120亿元。项目分两期建设，整体建成后形成200万吨/年丙烷脱氢（PDH）装置、60万吨/年丙烯酸装置、30万吨/年丙烯酸丁酯装置、160万吨/年多碳醇装置等生产能力，一期建设期预计不超过3年。该议案已获公司第五届董事会第十九次会议审议通过，尚需提交股东会审议。", "ctime": 1794401366, "time_str": "20:49:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261111/c681722125.shtml"}, {"id": "5630503", "title": "Lumentum控股美股盘前涨超10%", "content": "Lumentum控股美股盘前涨超10%，现报644.4美元。", "ctime": 1794400944, "time_str": "20:42:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261111/c681722011.shtml"}, {"id": "5630409", "title": "存储厂商酝酿新一轮涨价？多方反馈：原厂第四季度官方价格确实呈现微微上涨态势", "content": "11月11日午后，A股存储芯片板块普涨。截至收盘，普冉股份涨9.73%，佰维存储涨6.95%，德明利涨6.61%，香农芯创涨5.54%。触发资金情绪的或来自一则市场传闻：部分头部存储企业已向渠道商口头告知企业级颗粒的涨价意向，正式提价函尚未下发，但渠道端的价格已经先动了起来。记者就此联系了国内多家存储厂商，综合多方反馈获悉，原厂第四季度官方价格确实呈现微微上涨态势，但涉及型号依旧以企业级存储为主，消费级产品并未出现同步调涨的明确信号。(上海证券报)", "ctime": 1794400601, "time_str": "20:36:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261111/c681721093.shtml"}, {"id": "5630377", "title": "中远海能：全资子公司签约光租租入16艘VLCC，尚需股东会批准", "content": "中远海能公告，全资子公司寰宇公司此前拟开展16艘VLCC新造船长期租赁产融合作项目，2026年11月11日，寰宇公司与中远海发全资子公司东方富利签署光租合同，以经营性光租方式租入16艘VLCC，租期自交付日起计算为240个月±90天，平均固定日租金为人民币11.65万元/艘（不含税）。其中8艘采用“保底+分成”租金模式，年分成租金合计不超过人民币3.2亿元。本次交易构成关联交易，已经董事会审议通过，尚需股东会批准后方可生效。", "ctime": 1794400412, "time_str": "20:33:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261111/c681720438.shtml"}, {"id": "5630367", "title": "冰山冷热：液冷相关业务主要处于研发试制、初步推广阶段", "content": "冰山冷热公告，公司股票连续三个交易日（2026年11月9日至11月11日）日收盘价格涨幅偏离值累计超过20%，属于股票交易异常波动。公司最新市盈率为153.31倍，高于同行业41.05倍；2026年截至目前冰雪场馆业务尚未确认收入，对2026年度营业收入、利润影响较小。液冷相关业务主要处于研发试制、初步推广阶段，2026年仅有零星收入，部分产品可投入商用时间尚不确定。公司称近期经营情况及内外部经营环境未发生重大变化，不存在应披露而未披露的重大事项。", "ctime": 1794400357, "time_str": "20:32:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261111/c681720257.shtml"}, {"id": "5630359", "title": "富唯智能完成数千万元Pre-A轮融资", "content": "具身智能工业机器人研发商广州富唯智能科技有限公司近日完成数千万元Pre-A轮融资，本轮由优山资本领投，澄凯基金、启章投资、和而泰跟投。富唯智能成立于2022年，专注于具身智能工业机器人研发，致力于提升制造业柔性自动化水平。根据财联社创投通—执中数据，以2026年11月为预测基准时间，后续2年的融资预测概率为74.34%。（科创板日报）", "ctime": 1794400342, "time_str": "20:32:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261111/c681720200.shtml"}, {"id": "5630353", "title": "同有科技：向特定对象发行股票申请获深交所审核通过", "content": "同有科技公告，公司于2026年11月11日收到深交所上市审核中心出具的《关于北京同有飞骥科技股份有限公司申请向特定对象发行股票的审核中心意见告知函》，深交所发行上市审核机构对公司向特定对象发行股票的申请文件进行了审核，认为公司符合发行条件、上市条件和信息披露要求，后续深交所将按规定报中国证监会履行相关注册程序。本次向特定对象发行股票事项尚需获得中国证监会同意注册后方可实施。", "ctime": 1794400308, "time_str": "20:31:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261111/c681720084.shtml"}, {"id": "5630347", "title": "拓山重工：公司目前经营情况正常", "content": "拓山重工公告，公司股票连续3个交易日（2026年11月9日、2026年11月10日、2026年11月11日）收盘价格涨幅偏离值累计达到20%，属于股票交易异常波动情况。经公司自查并向控股股东、实际控制人书面核实，公司前期所披露的信息不存在需要更正、补充之处；未发现近期公共媒体报道了可能或已经对公司股票交易价格产生较大影响的未公开重大信息；公司目前经营情况正常，内外部经营环境未发生重大变化；公司、控股股东和实际控制人不存在应披露而未披露的重大事项或处于筹划阶段的重大事项；控股股东、实际控制人在股票交易异常波动期间不存在买卖公司股票的情形。根据中证指数有限公司官方网站发布的截至2026年11月11日数据，公司所属行业分类“C33金属制品业”最新市盈率为33.75倍，公司最新市盈率为134.17倍，显著高于同行业水平。", "ctime": 1794400302, "time_str": "20:31:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261111/c681720065.shtml"}, {"id": "5630345", "title": "国家粮食产业科技创新联盟第一届理事会第二次会议暨科企供需对接研讨会召开", "content": "11月9日至10日，国家粮食产业科技创新联盟第一届理事会第二次会议暨科企供需对接研讨会在江苏扬州召开。会议强调，“十五五”时期是加快粮食产业高质量发展的关键期，要集中力量破解关键共性技术难题，畅通科技创新成果转化通道，完善联盟运行机制，建强人才创新梯队，为全方位夯实粮食安全根基、保障国家粮食安全贡献更大力量。（人民财讯）", "ctime": 1794400299, "time_str": "20:31:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261111/c681720058.shtml"}, {"id": "5630227", "title": "俄总统新闻秘书：俄美将继续保持沟通", "content": "当地时间11月11日，俄罗斯总统新闻秘书佩斯科夫表示，目前欧洲国家的声明并未展现出其为推动乌克兰和平作出贡献的意愿；就俄欧之间可能出现的对话形式，现阶段俄方并没有明确设想，但在未来某个阶段将不可避免地讨论该问题；俄美之间的沟通将继续保持。（央视新闻）", "ctime": 1794399610, "time_str": "20:20:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261111/c681719692.shtml"}, {"id": "5630225", "title": "强力新材：强力转债将于2026年11月19日摘牌，到期兑付价格113元/张", "content": "强力新材公告，公司“强力转债”到期日为2026年11月18日，兑付登记日为2026年11月18日，到期兑付价格为113元/张（含税及最后一期利息），兑付资金发放日为2026年11月19日。最后交易日为2026年11月13日，自2026年11月16日起停止交易，最后转股日为2026年11月18日，摘牌日为2026年11月19日。截至2026年11月18日收市后仍未转股的“强力转债”将被强制赎回，目前转股价格为10.6元/股。", "ctime": 1794399605, "time_str": "20:20:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261111/c681719690.shtml"}, {"id": "5630193", "title": "俄方称俄乌将进行战俘交换", "content": "当地时间11日，俄罗斯武装力量总参谋部表示，俄乌双方将进行战俘交换，双方各有超过1000人被纳入交换名单。（央视新闻）", "ctime": 1794399414, "time_str": "20:16:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261111/c681719636.shtml"}, {"id": "5630157", "title": "丽人丽妆：收到1090万元政府补助", "content": "丽人丽妆公告，公司收到政府补助1090万元，补助类型为与收益相关。该补助将计入当期损益，具体会计处理和最终对公司损益的影响以会计师年度审计确认后的结果为准。", "ctime": 1794399286, "time_str": "20:14:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261111/c681719610.shtml"}, {"id": "5630119", "title": "Anthropic 新增约100亿美元微软、谷歌云算力采购承诺，Lambda 算力协议存在取消风险", "content": "Anthropic周二提交文件称，过去一个月与微软、谷歌达成新采购承诺，从现在至2033年云服务器租赁支出将较此前披露值增加约100亿美元。同时，与规模较小云服务商Lambda签署的349亿美元服务器租赁协议存在被取消的可能，原因是Lambda未能在双方约定期限内建成数据中心。Anthropic表示，虽合同赋予其取消该协议的权利，但目前无意这么做。（新浪财经）", "ctime": 1794399125, "time_str": "20:12:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261111/c681719570.shtml"}, {"id // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
