  background: var(--bg-primary);
  color: var(--text-primary);

.card {

  border-radius: 12px;
  padding: 20px;
  transition: all 0.2s;
}
.card:hover { background: var(--bg-card-hover); border-color: #334155; }
.badge {

.badge-c { background: rgba(100,116,139,0.2); color: #94a3b8; }
.score-bar {
  height: 6px; border-radius: 3px; background: #1e293b; overflow: hidden;
}
.score-bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s; }
.up { color: var(--red); }
.down { color: var(--green); }
.pulse { animation: pulse 2s infinite; }
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}
.glow { box-shadow: 0 0 20px rgba(59,130,246,0.15); }

://news.10jqka.com.cn/20261127/c682320951.shtml"}, {"id": "5777433", "title": "意大利外长：乌在利比亚军事行动未事先通报盟友", "content": "意大利副总理兼外长塔亚尼在维罗纳参加活动时表示，乌克兰在利比亚实施针对俄罗斯的军事行动前，并未向意大利及其他盟友通报，也未就行动进行协调。针对乌总统泽连斯基有关行动与伙伴协调的说法，塔亚尼表示并不属实。他强调，意大利不希望战事扩大至其他地区，也不希望地中海进一步卷入冲突。（央视新闻）", "ctime": 1795792107, "time_str": "23:08:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261127/c682320886.shtml"}, {"id": "5777403", "title": "期市夜盘收盘，国内期货主力合约多数上涨，烧碱涨超3%", "content": "期市夜盘收盘，国内期货主力合约多数上涨。涨幅方面，烧碱涨超3%，纯碱、铁矿石、燃油、豆二、菜粕等涨超1%。跌幅方面，对二甲苯、沥青、LPG、低硫燃油、纯苯跌超1%。", "ctime": 1795791628, "time_str": "23:00:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261127/c682320844.shtml"}, {"id": "5777395", "title": "多平台已下架纸质短剧", "content": "最近，正在中小学生群体中悄然风靡的“纸质短剧”引发热议。记者注意到，目前多个电商平台上已搜不到纸质短剧商品链接，以“纸质短剧”为关键词搜索，显示为其他无关商品。虽然一些平台上还能够看到极少数此前纸质短剧广告推荐视频，但相关的购物链接也已失效。纸质短剧一般成盒售卖，一盒中有好几本纸质短剧，每盒售价在十元左右，价格低廉。纸质短剧在形式上无限接近于小人书，但是与小人书又完全不同，因为纸质短剧是没有ISBN编号的。（界面）", "ctime": 1795791437, "time_str": "22:57:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261127/c682320822.shtml"}, {"id": "5777365", "title": "智利监管机构指控苹果滥用市场支配地位，要求处以逾8000万美元罚款", "content": "11月27日，智利国家经济检察官办公室（FNE）向竞争保护法庭提起诉讼，指控苹果公司自2019年以来在iOS应用分发及应用内付费数字商品分发市场滥用市场支配地位，并要求对其处以超过8000万美元罚款。FNE称，苹果在上述两个市场均占据100%的市场份额，涉嫌通过禁止用户侧载应用及第三方应用商店、强制开发者使用苹果应用内购买系统（IAP），以及限制开发者引导用户使用外部支付渠道等方式排除竞争。苹果IAP服务费率为15%至30%。FNE要求竞争保护法庭责令苹果开放iOS设备侧载及第三方应用商店，允许开发者使用替代支付系统，并取消限制应用内引导用户使用外部支付渠道的反引导规则。此外，FNE要求按调查期间涉案产品及服务相关销售额的30%处以罚款，金额为92378个年度税收单位，相当于超过8000万美元。（界面新闻）", "ctime": 1795790931, "time_str": "22:48:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261127/c682320754.shtml"}, {"id": "5777351", "title": "大商所液化石油气（LPG）主力合约跌超2%", "content": "大商所液化石油气（LPG）主力合约跌超2%，报5312元/吨。", "ctime": 1795790823, "time_str": "22:47:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261127/c682320723.shtml"}, {"id": "5777263", "title": "以军称在加沙地带打死4名哈马斯成员", "content": "以色列国防军27日发表声明说，以军上周在加沙地带打死4名巴勒斯坦伊斯兰抵抗运动（哈马斯）成员，并摧毁4个武器库。以军称，其中一人是哈马斯“努赫巴”部队副指挥官优素福·阿伊迪。哈马斯方面尚未对上述说法作出回应。以色列近期对哈马斯成员实施一系列“定点清除行动”。以总理内塔尼亚胡26日在社交媒体上发文称，以军打死了哈马斯经济和教育部门负责人哈立德·阿布·纳达。哈马斯同日发表声明说，以军25日夜间袭击了加沙地带中部一处居民楼，纳达及其妻子遇袭身亡。哈马斯表示，以军的系统性暗杀和袭击居民设施的行为是对巴以停火协议的“公然违反”。（新华社）", "ctime": 1795790490, "time_str": "22:41:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261127/c682320682.shtml"}, {"id": "5777227", "title": "美股开盘：美股三大指数集体高开", "content": "美股三大指数集体高开，标普500指数涨1.11%，道指涨0.95%，纳指涨1.49%。大型科技股方面，特斯拉涨3.31%，Meta涨2.61%，超威半导体涨2.49%，SpaceX涨2.26%，亚马逊涨1.99%，微软涨1.87%，谷歌A涨1.63%。中概股方面，哔哩哔哩涨7.26%，蔚来涨5.39%，阿里巴巴涨4.49%，拼多多涨4.29%，理想汽车涨4.25%，京东涨3.66%，小鹏集团涨3.56%，网易涨3.46%。", "ctime": 1795789856, "time_str": "22:30:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261127/c682320601.shtml"}, {"id": "5777205", "title": "Applovin美股盘前涨超5%", "content": "Applovin美股盘前涨超5%，现报398.03美元。", "ctime": 1795789687, "time_str": "22:28:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261127/c682320569.shtml"}, {"id": "5777159", "title": "研究发现创纪录高温期间全球地表水量骤减", "content": "斯德哥尔摩消息：瑞典、中国、美国等国研究人员合作开展的一项研究发现，2023年至2024年的创纪录高温期间，全球径流量和地表蓄水量同步骤减，降幅为1991年以来最大。数据显示，2024年和2023年分别为有观测记录以来最热和第二热的年份。参与研究的瑞典斯德哥尔摩大学和中国科学院地理科学与资源研究所日前发布公报介绍，为了解地表水资源在极端高温下的变化，研究团队利用全球150个主要流域的实测径流数据以及120多万个湖泊和水库的卫星遥感数据，重建了1991年至2025年全球径流量和地表蓄水量的变化过程。分析显示，2023年至2024年，全球径流量和地表活跃水体蓄水量的降幅超出了1991年以来其他任意两年组合的变化范围。相较于1991年至2020年的平均水平，全球径流量年均降幅为5.72%，地表活跃水体蓄水量降幅为9.50%。南美洲的径流减少量占全球减少量的约七成，亚马孙河流域出现近40年来最低流量。研究人员解释，部分陆地区域地表水量急剧减少是由海洋-大气复合作用驱动的。2023年至2024年，厄尔尼诺事件与热带北大西洋海温异常偏高同步发生，在部分陆地区域引发了大范围下沉气流和水汽通量辐散，加剧了区域干旱。这项研究凸显了全球水文系统和水资源安全的脆弱性。(新华社)", "ctime": 1795789181, "time_str": "22:19:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261127/c682320516.shtml"}, {"id": "5777101", "title": "上期所燃油主力合约涨超2%", "content": "上期所燃油主力合约涨超2%，报4016元/吨。", "ctime": 1795788930, "time_str": "22:15:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261127/c682320480.shtml"}, {"id": "5777091", "title": "润泽科技：终止发行可转换公司债券购买资产并撤回申请文件", "content": "润泽科技公告，公司此前拟发行可转换公司债券购买广东润惠科技发展有限公司42.56%股权并募集配套资金。公司于2026年11月27日召开董事会，审议通过终止本次交易并撤回申请文件的议案；经与相关各方审慎研究，决定因市场环境较筹划初期发生较大变化而终止，后续将结合市场环境等因素继续优化方案并择机再次启动。公司承诺自终止本次重组事项公告之日起至少1个月内不再筹划重大资产重组事项。", "ctime": 1795788675, "time_str": "22:11:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261127/c682320438.shtml"}, {"id": "5777087", "title": "大智慧：董事会同意撤回湘财股份换股吸收合并申请", "content": "大智慧公告，公司此前拟由湘财股份通过发行A股股票换股吸收合并大智慧并募集配套资金，该交易申请于2025年10月23日获上交所受理。2026年11月27日，公司董事会审议通过撤回交易申请并与湘财股份签署解除协议，决定向上交所撤回申请。公司称，撤回系交易双方鉴于外部环境变化和公司发展需要，经审慎研究、协商一致作出；相关事项无需另行提交股东会审议。公司承诺自公告披露之日起至少1个月内不再筹划重大资产重组。", "ctime": 1795788566, "time_str": "22:09:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261127/c682320401.shtml"}, {"id": "5777085", "title": "长春市委书记连茂君、市长顾刚会见中国旅游集团董事长石岱一行", "content": "据“长春发布”，11月27日，长春市委书记连茂君、市长顾刚会见中国旅游集团有限公司党委书记、董事长石岱。连茂君说，希望中国旅游集团发挥自身优势，在景区运营、机场商业、旅行服务等领域与长春深入合作，积极对接长春航空、冰雪文旅资源，与我们携手培育更多文旅新增长点，实现互利共赢发展。石岱表示，将坚定在长发展信心，在酒店运营、赛事文创及旅游零售等方面加快推进合作项目落地，为长春经济社会高质量发展贡献中旅力量。(人民财讯)", "ctime": 1795788545, "time_str": "22:09:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261127/c682320398.shtml"}, {"id": "5777075", "title": "塞议会选举获胜团体公布总统选举候选人", "content": "在近期塞尔维亚议会选举中获胜的选举团体“学生名单-学生获胜”27日在贝尔格莱德举行的记者会上宣布，推举贝尔格莱德大学化学教授拉多米尔·萨伊契奇参加定于12月27日举行的总统选举。萨伊契奇现年65岁，是塞尔维亚科学与艺术院院士，在10月25日举行的塞议会选举中当选议员。“学生名单-学生获胜”在此次选举中赢得国民议会250个席位中的140席。塞尔维亚国民议会议长阿莱克桑达尔·丘皮奇11月26日签署决定，定于12月27日提前举行总统选举。9月27日，塞尔维亚时任总统武契奇辞职。(新华社)", "ctime": 1795788176, "time_str": "22:02:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261127/c682320299.shtml"}, {"id": "5777073", "title": "中铝国际：正式签署几内亚氧化铝项目EPC合同，金额65.56亿元", "content": "中铝国际公告，公司此前披露拟与中铝几内亚就几内亚120万吨氧化铝项目建设签订EPC总承包合同，合同价格预计约65.56亿元，该事项尚待股东会审议批准。2026年11月27日，公司与中铝几内亚正式签订附带生效条款的《中国铝业几内亚氧化铝项目EPC总承包合同》，合同总价款为65.56亿元（包含暂估进口物资税费总额12953万元），工期为2028年9月15日前投产，2029年3月15日前通过性能考核。合同经双方签字盖章后，自双方完成全部内部审批程序之日起生效。", "ctime": 1795788116, "time_str": "22:01:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261127/c682320282.shtml"}, {"id": "5777069", "title": "国家能源局主要负责人会见南非电力和能源部部长", "content": "11月25日，中国国家能源局局长王宏志在青岛会见南非电力和能源部部长洛西恩佐·拉莫豪帕，双方就能源规划、清洁能源等领域合作交换意见。王宏志表示，欢迎南方出席第四届“一带一路”能源部长会议，中方愿与南方分享清洁能源、电网现代化等方面的技术和经验，支持中方企业参与南非相关项目合作。中方诚邀南方加入“一带一路”能源合作伙伴关系，以更好推动两国能源合作取得新成效。拉莫豪帕表示，很高兴出席第四届“一带一路”能源部长会议，南方期待与中方加强能源规划、清洁能源、电网互联等领域合作，推动两国能源伙伴关系迈向更高水平。(人民财讯)", "ctime": 1795788047, "time_str": "22:00:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261127/c682320271.shtml"}, {"id": "5776991", "title": "湖北能源与宜昌市政府座谈", "content": "据湖北能源消息，11月26日下午，湖北能源董事长、党委书记张龙与宜昌市委副书记、代理市长陈忠座谈，双方围绕进一步深化企地合作深入交流。（人民财讯）", "ctime": 1795787709, "time_str": "21:55:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261127/c682320203.shtml"}, {"id": "5776933", "title": "阿根廷YPF美股盘前涨超10%", "content": "阿根廷YPF美股盘前涨超10%，现报34.66美元。", "ctime": 1795786625, "time_str": "21:37:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261127/c682319953.shtml"}, {"id": "5776915", "title": "美团：Keemart已在沙特覆盖20座城市", "content": "美团高管在今日的财报业绩上透露，美团旗下小象超市的海外自营即时零售品牌Keemart截至三季度末已在沙特覆盖20座城市，建设超过80个仓。“我们认为，食杂零售业务在中东会有非常大的发展机会。”（科创板日报）", "ctime": 1795786382, "time_str": "21:33:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261127/c682319925.shtml"}, {"id": "5776903", "title": "宇树发布全身实时遥操“身外化身V3.0 守护”", "content": "宇树发布全身实时遥操功能“身外化身V3.0守护”最高同步率99.8%，最低端到端延时80ms，可用于实现远程复杂作业或数据采集等。（科创板日报）", "ctime": 1795786317, "time_str": "21:31:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261127/c682319910.shtml"}, {"id": "5776847", "title": "支付宝发布车载助手3.0 AI原生智能体", "content": "支付宝今日发布AI原生车载智能体“车载助手3.0”。支持加油充电、高速通行、停车缴费、智能点单等高频车生活场景语音全流程闭环办理，全程无需操作手机。该产品搭载APASS可信授权、声纹支付等核心安全能力。目前产品已完成80余个汽车品牌定点，比亚迪、理想等将陆续量产搭载。支付宝同期发起A.I. Car生态联盟，上线座舱开放平台。（科创板日报）", "ctime": 1795786147, "time_str": "21:29:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261127/c682319879.shtml"}, {"id": "5776837", "title": "美团：Keeta短期不会在巴西全国快速铺开", "content": "美团高管在今日财报业绩会上表示，Keeta短期不会在巴西全国快速铺开。现阶段核心重心还是圣保罗，打磨一套可复制的运营模型，打造差异化优势。“近期新进入的都是小规模城市，采用轻量化代理模式，今年、明年对财务的影响有限。我们持续观察模型跑通情况。巴西外卖市场长期空间大、回报潜力可观，但现阶段我们花钱会保持灵活、审慎，不会激进投入。巴西运营效率过去几个季度稳步改善，单位经济模型有清晰改善路径。”（科创板日报）", "ctime": 1795786069, "time_str": "21:27:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261127/c682319870.shtml"}, {"id": "5776831", "title": "美团：与微信AI助手小微试点按计划推进", "content": "美团高管在今日的财报业绩会透露，美团和微信AI助手小微的试点项目正按计划推进。现阶段首要目标是，让端到端的本地服务链路在微信内顺畅跑通。“随着技术迭代、用户使用规模提升，我们相信这项合作能够在微信AI生态里挖掘出新的本地服务需求，为美团带来增长机会。”（科创板日报）", "ctime": 1795786024, "time_str": "21:27:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261127/c682319854.shtml"}, {"id": "5776829", "title": "我国成功发射遥感五十号04星", "content": "北京时间2026年11月27日21时05分，我国在太原卫星发射中心使用长征六号改运载火箭，成功将遥感五十号04星发射升空，卫星顺利进入预定轨道，发射任务取得圆满成功。该卫星主要用于国土普查、农作物估产和防灾减灾等领域。此次任务是长征系列运载火箭的第682次飞行。（央视新闻）", "ctime": 1795786008, "time_str": "21:26:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261127/c682319853.shtml"}, {"id": "5776827", "title": "美团：2027年将加大线下零售布局", "content": "美团高管在今日的财报业绩会上表示，2027年，美团会加大线下零售布局、持续迭代模型，但扩张节奏会保持克制。“我们希望业务实现有纪律、可持续的增长。因为过去我们在零售业务踩过大坑，所以新业务扩张会更加审慎，持续强化选品、供应链能力，打造差异化优势。”（科创板日报）", "ctime": 1795786000, "time_str": "21:26:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261127/c682319852.shtml"}, {"id": "5776819", "title": "NYMEX天然气主力合约大跌5%", "content": "NYMEX天然气主力合约大跌5%，现报3.47美元/百万英热。", "ctime": 1795785890, "time_str": "21:24:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261127/c682319837.shtml"}, {"id": "5776795", "title": "粤港澳大湾区大数据中心启动港深莞三地产业生态创新共建", "content": "11月27日，第二十八届中国国际高新技术成果交易会（简称“高交会”）期间，粤港澳大湾区大数据中心负责人与深圳、香港、东莞有关方面代表共同启动共建，推动三地创新资源协同联动。大数据中心将作为重要平台节点，承接更多跨城协同的创新需求，推动香港、深圳、东莞三地的产业、技术、数据与场景资源在同一套生态框架下更顺畅对接流转。粤港澳大湾区大数据中心是中央赋予深圳“双区建设”的重要任务，定位为服务“数字湾区”建设的公共数据基础设施。同日，粤港澳大湾区数据应用创新大赛主题赛·AI OPC创意挑战赛正式启动，设立总额1000亿token的激励资源池，主赛道开放“Skill编程应用”“开放创意应用”两个方向，特色赛道聚焦具体应用场景。（界面）", "ctime": 1795785408, "time_str": "21:16:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261127/c682319734.shtml"}, {"id": "5776771", "title": "中国国新总经理侯晓会见中国建设银行党委委员、副行长韩静", "content": "据中国国新消息，11月20日，中国国新党委副书记、总经理侯晓在公司总部会见中国建设银行党委委员、副行长韩静。侯晓表示，中国国新与中国建设银行在信贷融资、基金投资、债券承销等方面合作基础深厚。希望双方充分发挥自身优势，进一步深化重点业务领域沟通交流，创新合作模式，拓展合作空间，在互利共赢中携手实现高质量发展。韩静表示，中国建设银行将进一步加大对中国国新的支持力度，优化金融服务方案。希望双方在投贷联动、票据保函、股权并购、债券投资等方面加强合作，共同服务国家战略落实落地。(人民财讯)", "ctime": 1795785196, "time_str": "21:13:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261127/c682319666.shtml"}, {"id": "5776763", "title": "摩根大通美股盘前涨超2%", "content": "摩根大通美股盘前涨超2%，现报323.29美元。", "ctime": 1795785098, "time_str": "21:11:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261127/c682319649.shtml"}, {"id": "5776723", "title": "天津出台文商旅融合发展促进条例", "content": "27日，天津市十八届人大常委会第二十九次会议表决通过《天津市文商旅融合发展促进条例》。“制定条例是落实天津城市功能定位、巩固发展成果的迫切需要，为以法治方式促进文商旅融合发展提供了重要支撑。”天津市人大教科文卫委副主任委员李旭炎介绍。近年来，天津持续建设特色鲜明的文化旅游目的地、国际消费中心城市，文旅品牌影响力不断提升、消费场景日益丰富、特色资源活化利用成效明显。2025年，天津接待游客2.72亿人次，旅游花费3200亿元，文旅增加值占GDP比重升至3.5%。“文商旅融合发展链条长、涉及部门多、利益主体多元，仅靠政策引导难以持续，需要发挥法治固根本、稳预期、利长远的保障作用。”李旭炎说。天津市人大法制委主任委员王泽庆介绍，条例共五章五十条，围绕规划引领、场景创新、品牌塑造和服务保障等方面作出规定。（新华社）", "ctime": 1795784779, "time_str": "21:06:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261127/c682319578.shtml"}, {"id": "5776703", "title": "Nu Holdings美股盘前涨超10%", "content": "Nu Holdings美股盘前涨超10%，现报13.6美元。", "ctime": 1795784625, "time_str": "21:03:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261127/c682319535.shtml"}, {"id": "5776689", "title": "Ambev美股盘前涨超10%", "content": "Ambev美股盘前涨超10%，现报2.96美元。", "ctime": 1795784591, "time_str": "21:03:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261127/c682319497.shtml"}, {"id": "5776687", "title": "夜盘期货开盘，国内期货主力合约涨多跌少", "content": "夜盘期货开盘，国内期货主力合约涨多跌少，沪银、沪锡涨超4%，烧碱涨超2%，纯碱涨近2%，玻璃、沪金、铸造铝涨超1%，氧化铝涨近1%。跌幅方面，低硫燃料油（LU）跌近2%，甲醇跌超1% const SECTORS  = [{"name": "金融", "hit_count": 58, "etfs": []}, {"name": "半导体", "hit_count": 24, "etfs": []}, {"name": "人工智能", "hit_count": 16, "etfs": []}, {"name": "数据要素", "hit_count": 13, "etfs": []}, {"name": "消费", "hit_count": 10, "etfs": []}, {"name": "军工", "hit_count": 6, "etfs": []}, {"name": "新能源", "hit_count": 5, "etfs": []}, {"name": "机器人", "hit_count": 4, "etfs": []}];
const META     = {"update_time": "2026-11-28 01:24:30", "sentiment_score": 62.121212121212125, "agents": []};

// 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'

  container.innerHTML = agents.map(a => `

        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
