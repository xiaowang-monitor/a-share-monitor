<style>
:root {
  --bg-primary: #0a0e17;
  --bg-card: #111827;

* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Noto Sans SC', sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  min-height: 100vh;
}
.mono { font-family: 'JetBrains Mono', monospace; }
.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 20px;
  transition: all 0.2s;
}
.card:hover { background: var(--bg-card-hover); border-color: #334155; }
.badge {
  display: inline-flex; align-items: center; padding: 2px 8px;
  border-radius: 6px; font-size: 12px; font-weight: 500;
}
.badge-s { background: rgba(239,68,68,0.2); color: #ef4444; }
.badge-a { background: rgba(245,158,11,0.2); color: #f59e0b; }
.badge-b { background: rgba(59,130,246,0.2); color: #3b82f6; }
.badge-c { background: rgba(100,116,139,0.2); color: #94a3b8; }
.score-bar {
  height: 6px; border-radius: 3px; background: #1e293b; overflow: hidden;
}
.score-bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s; }
.up { color: var(--red); }
.down { color: var(--green); }
.pulse { animation: pulse 2s infinite; }
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}
.glow { box-shadow: 0 0 20px rgba(59,130,246,0.15); }
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg-primary); }
::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
</style>

<!-- 顶部状态栏 -->

            <tr class="text-gray-500 text-xs border-b border-gray-800">

              <th class="text-left py-2 px-1">名称</th>
              <th class="text-right py-2 px-1">现价</th>
              <th class="text-right py-2 px-1">涨幅</th>
              <th class="text-right py-2 px-1">评分</th>
              <th class="py-2 px-1 text-center" style="min-width:160px">评分分布</th>
              <th class="text-right py-2 px-1">板块</th>
              <th class="text-right py-2 px-1">连涨</th>
            </tr>
          </thead>
          <tbody id="picks-table"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- 新闻流 + 交易代理 -->
<div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
  <div class="card">
    <h2 class="text-sm font-medium text-gray-400 mb-4">实时新闻流</h2>
    <div id="news-feed" class="space-y-2 max-h-96 overflow-y-auto pr-2"></div>

  <div class="card">
    <h2 class="text-sm font-medium text-gray-400 mb-4">交易代理状态</h2>
    <div id="agent-status" class="space-y-3"></div>
  </div>
</div>

", "url": "https://news.10jqka.com.cn/20260504/c676448958.shtml"}, {"id": "4314267", "title": "港股科网股集体走高，小米集团涨超10%", "content": "港股科网股集体走高，小米集团涨超10%，贝壳涨近8%，阿里巴巴涨超6%，百度、快手涨超5%。", "ctime": 1777864275, "time_str": "11:11:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260504/c676448954.shtml"}, {"id": "4314259", "title": "广州楼市“穗八条”落地 二手房已连续两个月网签破万套", "content": "借力“穗八条”新政红利，今年五一假期广州房地产市场开局走高。据广州中原地产不完全统计，5月1日-2日广州新房累计盘均来访同比增长12%，累计盘均认购同比增长37%，成交转化率较去年同期稳步提升。二手房市场也延续活跃走势，同期累计看房量超七千人次，成交量超280套，较节前两天分别增加37%、11%。五一假期首日，个别新盘还出现排队进场场景。值得一提的是，新政落地前，广州二手房市场已率先企稳回暖，连续两个月网签量保持在万套以上。广州市房地产中介协会数据显示，4月广州二手住宅网签套数和面积分别为10426套、104.06万平方米，同比分别增长4.84%和1.47%。", "ctime": 1777863567, "time_str": "10:59:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260504/c676448903.shtml"}, {"id": "4314249", "title": "SK海力士股价一度涨近10% 市值逼近7000亿美元", "content": "SK海力士股价一度上涨9.8%，创盘中新高，报141.2万韩元。 市值首次突破1000万亿韩元（约合6800亿美元）", "ctime": 1777862472, "time_str": "10:41:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260504/c676448839.shtml"}, {"id": "4314223", "title": "恒生科技指数涨近3% 苹果概念股震荡走高", "content": "港股恒生科技指数涨近3%，突破5000点关口。苹果概念股震荡走高，丘钛科技涨超8%，高伟电子涨超6%，舜宇光学科技涨超4%，瑞声科技、蓝思科技涨超3%，比亚迪电子涨超2%。", "ctime": 1777859878, "time_str": "09:57:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260504/c676448619.shtml"}, {"id": "4314203", "title": "港股高开  恒指开涨1.4%", "content": "港股开盘，恒指开涨1.4%，恒生科技指数开涨1.58%。科技股多数走强，百度、网易涨超3%。", "ctime": 1777857767, "time_str": "09:22:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260504/c676448440.shtml"}, {"id": "4314195", "title": "高盛上调MiniMax评级至买入 称收入稳健且股价回调带来良好风险回报", "content": "高盛将MiniMax股票评级从中性上调至买入，目标价定为1000港元，主要是基于今年以来稳健的年度经常性(ARR)收入趋势。高盛分析师Ronald Keung在报告中表示，预期本月即将发布的M3模型和海螺3是下一个决定性时刻，有望将MiniMax的市场关注度从M2广受欢迎的智能体应用，扩展到M3/海螺3在全模态应用中的高价值代码编写领域。基于一季度稳健的ARR趋势，将2026与2027年预期收入分别上调25%和11%；自3月高点以来40%的股价回调创造了有利的风险回报；过去一个月的股价回调归因于对模型竞争的担忧、在多模态SeeDance 2.0影响下对视频生成潜力的质疑，以及7月初IPO前/基石投资者六个月股份禁售期届满带来的技术性抛压。", "ctime": 1777857244, "time_str": "09:14:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260504/c676448408.shtml"}, {"id": "4314193", "title": "现货黄金跌破4600美元/盎司", "content": "现货黄金跌破4600美元/盎司，日内下跌0.35%。", "ctime": 1777857117, "time_str": "09:11:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260504/c676448388.shtml"}, {"id": "4314171", "title": "韩国股市高开，三星开盘涨3%", "content": "韩国KOSPI指数开盘涨2.7%。三星电子股价上涨3%。", "ctime": 1777853110, "time_str": "08:05:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260504/c676447937.shtml"}, {"id": "4314167", "title": "美军方称将参与恢复霍尔木兹海峡商业通航的行动", "content": "记者获悉，当地时间5月3日，美国中央司令部发布声明表示，美国中央司令部部队将于5月4日开始支援“自由计划”，旨在恢复商业航运穿越霍尔木兹海峡的航行自由。声明称，这项由美国总统特朗普亲自指示的任务，将为寻求自由穿越这一重要国际贸易走廊的商船提供支援。美国中央司令部司令布拉德·库珀表示：“在我们维持海上封锁的同时，我们对这项防御性任务的支援对于区域安全和全球经济至关重要。” (央视新闻)", "ctime": 1777852495, "time_str": "07:54:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260504/c676447871.shtml"}, {"id": "4314165", "title": "伊朗议会要员：美干涉霍尔木兹海峡“新管理制度”将被视为违反停火", "content": "伊朗伊斯兰议会国家安全和外交政策委员会主席易卜拉欣·阿齐兹4日凌晨在社交媒体上发文说，美国对霍尔木兹海峡“新的海事管理制度”的任何干涉都将被视为违反停火协议。 (央视新闻)", "ctime": 1777850764, "time_str": "07:26:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260504/c676447807.shtml"}, {"id": "4314161", "title": "伊朗：正“审议”美方对14点提议回应　目前谈判不涉核", "content": "据伊朗伊斯兰共和国广播电视台3日报道，伊朗外交部发言人巴加埃说，美国已通过斡旋方巴基斯坦对伊方提出的14点提议作出回应，伊方对此“正在进行审议”，现阶段谈判不涉及核问题。（新华社）", "ctime": 1777850241, "time_str": "07:17:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260504/c676447782.shtml"}, {"id": "4314159", "title": "特朗普：美国将开展霍尔木兹海峡被困船只疏导行动", "content": "美国总统特朗普3日在社交媒体发文称，美国将于中东地区4日上午开始一项疏导行动，“引导”被困在霍尔木兹海峡的船只驶离该海峡。(新华社)", "ctime": 1777850179, "time_str": "07:16:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260504/c676447776.shtml"}, {"id": "4314155", "title": "国际原子能机构证实扎波罗热核电站实验室遭无人机袭击", "content": "国际原子能机构3日证实，收到扎波罗热核电站通报称当天有无人机袭击了该核电站的外部辐射监测实验室。国际原子能机构通过社交媒体表示，目前未收到人员伤亡报告，也尚不清楚此次袭击是否对实验室造成损坏。该实验室位于扎波罗热核电站的围墙之外。国际原子能机构驻现场小组已要求进入实验室查看。国际原子能机构总干事格罗西重申，任何发生在核设施附近的袭击都可能构成核安全风险。（财联社）", "ctime": 1777820265, "time_str": "22:57:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260503/c676447489.shtml"}, {"id": "4314153", "title": "媒体披露伊朗最新谈判方案细节 最新谈判方案包含三个阶段", "content": "根据半岛电视台当地时间今天（5月3日）下午报道，伊朗方面提出的最新谈判方案包含三个阶段。其中第一阶段包含“在30天时间内将停火转化为全面停战”、“确定能保证战事不再重开的国际机制的构建原则”、“在全部地区实现停火并且双方承诺不再破坏停火，该停火包含伊朗所有的地区盟友及以色列”、“以同逐步开放霍尔木兹海峡相适的方式逐步解除对伊朗港口的封锁”、“伊朗方面负责清理水雷”、“重新调整伊朗方面此前提出的关于赔偿等内容”、“美方从伊朗周边水域撤出并停止新的部队集结”等内容。而第二阶段则包括“最长在15年的期限内就全面停止铀浓缩进行讨论”、“在规定期限到期后，伊朗方面按照 零库存 原则恢复铀浓缩活动”等内容。同时该方案反对拆除或者破坏伊朗的核设施，而针对已有高浓缩铀库存，该提议则提出了转移至境外或稀释铀浓缩比例等方案。此外，该方案还涉及了逐步解除对伊朗的经济制裁等问题。而在第三阶段，伊朗将会同地区国家一起进行战略会谈，以对如何构建覆盖全区的安全体系进行讨论。 (CCTV国际时讯)", "ctime": 1777820159, "time_str": "22:55:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260503/c676447487.shtml"}, {"id": "4314149", "title": "美联储卡什卡利：需要对利率政策的未来保持开放的心态 美联储可能需要提高利率政策", "content": "美联储卡什卡利表示，需要对利率政策的未来保持开放的心态；战争持续时间越长，通胀压力越大。在某些情况下，美联储可能需要提高利率。并表示，即使战争现在完全结束，供应链恢复也需要数月时间。对战争带来的下行风险非常担忧。（财联社）", "ctime": 1777819637, "time_str": "22:47:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260503/c676447475.shtml"}, {"id": "4314147", "title": "美国财长贝森特：应当警惕人工智能可能对银行发起黑客攻击的风险", "content": "美国财长贝森特表示，应当警惕人工智能可能对银行发起黑客攻击的风险。贝森特还表示，美国目前的能源出口达到了创纪录水平；限制美国能源出口的唯一因素是基础设施。美国在能源市场中是“大赢家”。（财联社）", "ctime": 1777818399, "time_str": "22:26:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260503/c676447446.shtml"}, {"id": "4314143", "title": "美国财长贝森特对沃什领导的美联储持乐观态度", "content": "美国财长贝森特表示，对沃什领导的美联储持非常乐观态度。鲍威尔留任美联储理事的决定违反了常规，对鲍威尔最终会在短期内脱离美联储乐见其成。（财联社）", "ctime": 1777818216, "time_str": "22:23:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260503/c676447440.shtml"}, {"id": "4314139", "title": "西班牙要求以色列立即释放其扣押的本国公民", "content": "西班牙外交大臣阿尔瓦雷斯2日说，以色列方面扣押西班牙公民赛义夫·阿布·凯谢克的行为“非法”，应立即将他释放。本周早些时候，以军在希腊克里特岛附近国际水域拦截了驶往加沙地带的援助船队“全球坚韧船队”，船队两名主要活动人士被抓捕至以色列接受问询，其中包括阿布·凯谢克。阿布·凯谢克也是“全球坚韧船队”指导委员会成员。以色列外交部称，阿布·凯谢克为巴勒斯坦裔西班牙公民，是“海外巴勒斯坦人活动组织”重要成员，该组织被美国认定与巴勒斯坦伊斯兰抵抗运动（哈马斯）有关联。（新华社）", "ctime": 1777818018, "time_str": "22:20:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260503/c676447431.shtml"}, {"id": "4314137", "title": "张雪回应车手退赛：初步排查因发动机机油压力下降", "content": "在2026世界超级摩托车锦标赛（WSBK）匈牙利站WorldSSP组别第二回合正赛中，中国摩托车制造商张雪机车的法国车手瓦伦丁·德比斯退赛。当日晚，张雪在社媒平台发布视频回应：“很遗憾，我们在比赛的第一圈就退赛了。刚刚和前方沟通，是因为我们遇到了机械故障。初步排查，是因为发动机的机油压力下降。更深的原因还需要解析以后才能知道。”他表示：“比赛就是这样，车子一直处于极限工况。每个品牌都有可能遇到这种问题。”（央视新闻）", "ctime": 1777816010, "time_str": "21:46:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260503/c676447388.shtml"}, {"id": "4314135", "title": "官方：“全国电动自行车淘汰赛”系谣言 已买车辆不强制淘汰", "content": "近期，一则“4月15日电动车淘汰赛”的传言在社交平台传播，称“4月15日起，全国开展电动自行车淘汰赛，严查超标车、无牌车、改装车等”。这则消息引发广大电动自行车车主的担忧，到底是怎么回事？日前，上海网信部门辟谣平台认定，这是谣言，是一则拼接的假消息。“4·15淘汰赛”的说法是部分自媒体在2019年4月15日电动自行车国家标准GB 17761-2018实施节点时提出的。但该标准已于2025年9月1日被新修订的国标GB 17761-2024《电动自行车安全技术规范》所替代。工业和信息化部在解释新国标时明确，消费者已经购买的不符合新标准的车辆不会被强制淘汰，可由各地政府根据当地实际情况，借助以旧换新等政策加速更新换代。至于使用超标、无牌、改装非机动车，本身就属于违法行为，是会被公安交警部门依法查处的。（财联社）", "ctime": 1777815834, "time_str": "21:43:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260503/c676447382.shtml"}, {"id": "4314133", "title": "韩国十年来近900名“熟练”空军飞行员转投民航", "content": "韩国空军3日公布的一份报告显示，过去十年间有近900名“熟练”空军飞行员离开军队转投民航，主要是为了寻求更好薪资待遇。这份韩国空军递交给韩国国民力量党议员、国会国防委员会委员姜大植的报告说，2017年至2026年3月期间，韩国空军共有896名“熟练”飞行员选择自愿退伍，其中战斗机飞行员730名、货机飞行员148名、旋翼机飞行员18名。在这些自愿退伍的空军飞行员中，有871人选择到民航公司工作，其中622人进入大韩航空公司，146人进入韩亚航空公司，韩亚航空现已并入大韩航空；另有103人进入廉价航空公司。（财联社）", "ctime": 1777815780, "time_str": "21:43:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260503/c676447381.shtml"}, {"id": "4314131", "title": "伊朗伊斯兰革命卫队：美国决策空间已受限", "content": "伊朗伊斯兰革命卫队情报部门表示，美国总统特朗普致函美国国会和针对伊朗提出的新方案的言论表明，其必须在“不可实现的军事行动”和“同伊朗达成糟糕的协议”之间作出选择，美国决策空间已经受到限制。据伊朗塔斯尼姆通讯社报道，伊朗通过斡旋方巴基斯坦向美方提交了一份包含14点提议的新方案，主要内容包括确保不再发生军事侵略、支付赔偿、建立霍尔木兹海峡新的管理机制等。特朗普2日表示，他将很快评估伊朗的新方案，但“无法想象”该方案“可以接受”。（新华社）", "ctime": 1777814474, "time_str": "21:21:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260503/c676447342.shtml"}, {"id": "4314129", "title": "淡水河谷印尼公司首席执行官、韩国ECOPRO社长一行到访格林美", "content": "2026年4月27日—28日，淡水河谷印尼公司（PTVI）首席执行官Bernardus Irmanto先生一行、韩国ECOPRO社长宋豪睃先生一行到格林美荆门循环经济产业园参观交流。三方围绕循环经济、镍资源挑战等议题，共商强强合作大计。未来，格林美、PTVI、ECOPRO三方将携手同行，高标准推进印尼合作项目的建设。（财联社）", "ctime": 1777813133, "time_str": "20:58:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260503/c676447267.shtml"}, {"id": "4314127", "title": "世界超级摩托车锦标赛匈牙利站：张雪机车车手德比斯第二回合退赛", "content": "在2026世界超级摩托车锦标赛（WSBK）匈牙利站WorldSSP组别第二回合正赛中，中国摩托车制造商张雪机车的法国车手瓦伦丁·德比斯退赛。（财联社）", "ctime": 1777811818, "time_str": "20:36:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260503/c676447216.shtml"}, {"id": "4314125", "title": "伦敦凌晨飞车枪击致4人受伤 嫌疑人在逃", "content": "英国首都伦敦街头2日凌晨发生一起飞车枪击事件。有人从一辆行驶中的汽车中向外开枪射击，造成4人受伤，其中一人伤情危重。案发一天之后嫌疑人仍在逃。据英国媒体报道，事发地点在伦敦南部布里克斯顿一条街道，有证人说事发时那一带正在举行烧烤晚会，人员密集。警方当地时间2日凌晨1时14分接到报警后迅速赶到现场，协助伦敦急救中心向伤员施救。中枪的4人分别为21岁、25岁、47岁和70岁，其中那名25岁男子伤情“危及性命”。按牵头调查此案的当地警方人员说法，这是一起“无差别暴力犯罪”。 (新华社)", "ctime": 1777811506, "time_str": "20:31:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260503/c676447203.shtml"}, {"id": "4314123", "title": "一移民船在英吉利海峡遇险致2人死亡", "content": "据法国媒体3日报道，一艘移民船当天在英吉利海峡遇险，目前已造成2人死亡。法国《费加罗报》报道说，3日凌晨，约80人搭乘一艘简易船从法国北部加来海峡省出发，试图穿越英吉利海峡，但因发动机故障被迫在海上漂流。该船最后在海滩搁浅，17人落水后被法方救起，其余乘客中已有2名女性遇难。近年来，非洲和中东国家的大批民众为躲避战乱逃至欧洲，从法国经英吉利海峡偷渡至英国的非法移民人数激增。（新华社）", "ctime": 1777810606, "time_str": "20:16:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260503/c676447160.shtml"}, {"id": "4314121", "title": "中国儒意：与腾讯代表公司签订二零二六年游戏合作框架协议", "content": "中国儒意公告，公司于2026年4月7日与腾讯代表公司（代表腾讯控股有限公司及其相关实体，包括腾讯视频等）签订《二零二六年游戏合作框架协议》。协议有效期自先决条件达成之日起至2028年12月31日止。合作内容涵盖发行合作、共同运营合作、营销服务及独家代理四类模式，具体包括：公司作为合作游戏产品的独家代理发行方或指定平台发行方；双方在各自平台共同运营游戏并按渠道收益结算；公司为腾讯代表公司提供基于影游联动的定制化营销服务；腾讯代表公司在其平台及第三方平台发行、运营及推广合作游戏。协议项下拟筹备12款合作产品，预计于2026至2027年陆续推出。", "ctime": 1777810543, "time_str": "20:15:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260503/c676447157.shtml"}, {"id": "4314119", "title": "两名参加“非洲狮2026”演习的美国军人在摩洛哥失踪", "content": "美军非洲司令部3日在社交媒体上发文称，两名参加“非洲狮2026”演习的美国军人在摩洛哥坦坦市附近的训练区失踪。（新华社）", "ctime": 1777810079, "time_str": "20:07:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260503/c676447145.shtml"}, {"id": "4314117", "title": "国务院安委办、应急管理部视频调度重点地区和部分旅游景点安全防范工作", "content": "5月3日，国务院安委办、应急管理部视频调度山西、辽宁、福建、河南、云南、新疆等重点地区和部分旅游景点安全防范工作，进一步做好“五一”假期安全防范工作，督促明查暗访工作情况。会议要求，要高度关注道路交通安全风险。加大对重点路段巡查频次，严厉打击无资质运营、“三超一疲劳”、货车农用车载人等违法行为。要高度关注旅游景区安全风险。督促景区严格落实安全主体责任，深入排查景区车船、缆车索道、吊桥、玻璃栈道、飞天魔毯、大型游乐设施等高风险项目安全隐患，严防设施设备“带病运行”。加强客流监测引导和安全提示，及时采取引流、限流、疏散等避险措施。要高度关注人员密集场所安全风险。切实加强大型综合体、餐饮住宿、文博娱乐、养老院、足浴店、KTV等人员密集场所的安全检查，对发现的重大隐患及时公布，加强跟踪督办。会议强调，节日期间国务院安委会有关成员单位和各地已派出明查暗访组到基层一线检查。各地要持续抓好明查暗访工作，及时调度掌握情况，对发现的重大事故隐患迅速整改，全力抓好各项责任措施落实，确保人民群众平安过节。（央视新闻）", "ctime": 1777810027, "time_str": "20:07:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260503/c676447139.shtml"}, {"id": "4314113", "title": "以总理：为本土化弹药生产 未来十年以国防预算将追加3500亿新谢克尔", "content": "3日，以色列总理内塔尼亚胡称，针对黎巴嫩南部地区以军部队遭遇真主党无人机袭击增多的情况，以方已启动一项反无人机专项计划。在国防采购方面，内塔尼亚胡表示，以色列将重点提升军事能力和增强自主性，包括采购两支先进战机中队，包括F-35和F-15IA战斗机。内塔尼亚胡还表示，以军具备在必要时对伊朗空域实施行动的能力。与此同时，他已指示加大对国内弹药生产能力的投入。他透露，未来十年以色列将为国防预算追加约3500亿新谢克尔，用于实现弹药本土化生产。此外，以色列还将研发“具有突破性的本土制造飞行器”，但未说明具体是无人机还是有人驾驶飞机。（央视新闻）", "ctime": 1777809120, "time_str": "19:52:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260503/c676447043.shtml"}, {"id": "4314111", "title": "英国布里斯托尔发生爆炸致2人死亡 当局宣布“重大事件”", "content": "当地时间5月3日，英国布里斯托尔发生一起房屋爆炸事件，造成两人死亡，当局已宣布进入“重大事件”状态。雅芳和萨默塞特郡警察局表示，警方于当天6时30分左右接报，赶赴位于法兰奇斯特恩科特路的一处住宅。随后，警方对事发区域实施封锁，并将附近居民疏散至临时安置点。警方表示，尽管英国近期威胁等级有所上调，但目前不将该事件视为恐怖袭击，并呼吁公众不要对事件原因进行猜测，同时远离事发区域，以便紧急服务部门开展工作。一名当地居民表示，他在事发时听到“巨大的爆炸声”，随即从床上跳起查看情况。几分钟内，大批警力赶到现场，包括武装警察。大约15至20分钟后，警方开始组织周边居民撤离。警方称，此次设立警戒区是“出于保障公众安全的预防性措施”。目前暂无迹象表明其他房屋遭受严重损毁。同时，警方还在斯皮德韦尔地区一处与该事件相关的房产展开调查。（央视新闻）", "ctime": 1777808745, "time_str": "19:45:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260503/c676447033.shtml"}, {"id": "4314107", "title": "泽连斯基称乌打击俄罗斯多处海上目标及港口设施", "content": "当地时间3日，乌克兰总统泽连斯基通过社交媒体宣布，乌军成功击沉一艘俄罗斯舰艇，并打击了普里莫尔斯克港口设施。泽连斯基称，此次行动由乌多部门联合展开，俄军一艘巡逻艇及一艘“影子舰队”油轮也被击中，俄港口石油装卸设施遭严重破坏。泽连斯基说，他已批准乌国家安全局采取额外反击措施，并表示俄可随时结束军事行动，拖延将导致乌防御行动扩大。目前，俄罗斯方面对此暂无回应。（央视新闻）", "ctime": 1777808403, "time_str": "19:40:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260503/c676447021.shtml"}, {"id": "4314101", "title": "以军称当天早前以北部遭火箭弹袭击为误判", "content": "以色列国防军方面3日通报称，当天早些时候其关于黎巴嫩真主党向边境城镇阿维维姆发射火箭弹的消息不属实。以军在初步调查中发现，驻扎在黎巴嫩南部的以军部队实施的射击行动被误判为来袭威胁，随后启动拦截系统并发射拦截导弹，从而触发了阿维维姆地区的防空警报。（央视新闻）", "ctime": 1777807150, "time_str": "19:19:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260503/c676446973.shtml"}, {"id": "4314097", "title": "“五一”假期澳门单日入境旅客量创新高", "content": "今年“五一”假期，澳门的旅游市场客流畅旺，单日入境旅客量创下历史新高。根据澳门治安警察局5月3日公布数据显示，2日，澳门各口岸入境旅客达24.77万人次，创下澳门单日入境旅客量新高。（财联社）", "ctime": 1777806391, "time_str": "19:06:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260503/c676446939.shtml"}, {"id": "4314093", "title": "白钰鸣获跳水世界杯总决赛男子10米台冠军 中国队包揽9金收官", "content": "世界泳联跳水世界杯总决赛男子10米跳台决赛，中国选手白钰鸣获得金牌。至此，中国队在跳水世界杯总决赛各项比赛中包揽9金。（央视新闻）", "ctime": 1777805665, "time_str": "18:54:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260503/c676446900.shtml"}, {"id": "4314091", "title": "五一档总票房突破5亿", "content": "据网络平台数据，截至5月3日18时42分，2026年五一档（5月1日-5月5日）档期总票房（含预售）突破5亿，影片《消失的人》《寒战1994》《穿普拉达的女王2》暂列档期票房前三。（财联社）", "ctime": 1777805619, "time_str": "18:53:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260503/c676446894.shtml"}, {"id": "4314089", "title": "欧洲智库称伊朗战事冲击能源安全 或加剧欧盟内部对俄分歧", "content": "欧洲智库欧洲政策研究中心近日指出，伊朗战事正对欧洲能源安全造成冲击，其中液化天然气供应链动荡尤为严峻。在本轮中东冲突中，位于卡塔尔的全球最大液化天然气生产基地拉斯拉凡遭袭，约17%的产能受损，导致全球供应明显趋紧，并推动天然气价格上涨。在此背景下，欧盟原本摆脱对俄罗斯天然气依赖的计划正在被打乱，欧盟内部围绕是否放松对俄能源制裁的分歧也很可能进一步加剧。（央视新闻）", "ctime": 1777805582, "time_str": "18:53:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260503/c676446891.shtml"}, {"id": "4314087", "title": "佩斯科夫：若乌不愿达成协议 俄将通过特别军事行动迫使其接受", "content": "俄罗斯总统新闻秘书佩斯科夫表示，如果乌克兰方面不愿意达成协议，俄罗斯将通过持续且加强的军事行动直至达成“胜利”的方式使其接受。佩斯科夫强调，通过和平协议实现目标，即以谈判手段解决乌克兰问题，对俄方来说仍是优先选项。佩斯科夫表示，尽管面临“严重的能源危机”，俄罗斯的利益仍将得到保障。他指出，乌克兰方面对俄石油基础设施的打击将引发更大的石油短缺，而由于燃料价格上涨，俄罗斯公司和国库收入反而将增加。佩斯科夫还透露，俄罗斯总统普京与美国总统特朗普在通话中对乌方的行为作出了相似的评估。佩斯科夫警告称，乌克兰对俄石油基础设施的打击可能导致油价进一步上涨。（央视新闻）", "ctime": 1777805561, "time_str": "18:52:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260503/c676446889.shtml"}, {"id": "4314085", "title": "蜜雪集团：公司拟实施H股全流通计划", "content": "蜜雪集团在港交所公告，公司已于2026年4月30日向中国证监会提交申请，以将公司22823988股非上市股份（占公司于本公告日期已发行股份总数约6.01%），转换为公司H股，以实行H股全流通。于取得所有相关批准及╱或备案（包括中国证监会的备案通知及联交所的批准）及遵守所有适用法律、法规及规则后，该等非上市股份将转换为H股，以及公司将申请该等H股于联交所主板上市及买卖。", "ctime": 1777805131, "time_str": "18:45:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260503/c676446865.shtml"}, {"id": "4314083", "title": "伊朗伊斯兰革命卫队：给予五角大楼最后期限解除封锁", "content": "当地时间3日下午，伊朗伊斯兰革命卫队对外表示，给予美国五角大楼最后期限解除对伊朗的封锁。（央视新闻）", "ctime": 1777804864, "time_str": "18:41:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260503/c676446854.shtml"}, {"id": "4314081", "title": "群核科技：与金涌投资有限公司订立战略合作框架协议", "content": "群核科技港交所公告，公司近日与金涌投资有限公司订立战略合作框架协议，据此，双方已就全球业务拓展、设立风险投资基金及资本市场合作达成战略合作。根据框架协议，金涌将利用弘毅投资涵盖全球家具供应链及消费行业的生态系统资源，协助本公司进行全球业务拓展，并提升订约方的国际竞争力及海外客户获取能力。订约方进一步拟探讨共同设立专注于空间智能及AI相关技术的风险投资基金 const META     = {"update_time": "2026-05-04 12:54:34", "sentiment_score": 55.48245614035088, "agents": []};

// 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">

        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
