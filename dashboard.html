直起降航空器（eVTOL）领域的合作潜力。", "ctime": 1780645191, "time_str": "15:39:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260605/c677247845.shtml"}, {"id": "4470131", "title": "外交部：中国将继续走生态优先、绿色发展之路", "content": "6月5日，外交部发言人毛宁主持例行记者会，有记者问，我们注意到今天是第55个世界环境日，在全球农产品贸易当中，中国进口商越来越倾向采购绿色认证产品，中国消费者不再只追求“便宜就好”，更愿意为不以砍伐森林为代价的绿色产品买单。有评论认为，中国兴起绿色消费有利于形成更加包容的全球绿色供应链，发言人对此有何评论？发言人毛宁表示，越来越多的中国消费者选择绿色产品，反映出低碳、环保的生活方式已经融入中国人的衣食住行。14亿多中国人民秉持环保理念，践行绿色行动，这本身就是对世界环境保护最直接的支持。中国将继续走生态优先、绿色发展之路，以实际行动推动全球可持续发展，与各国携手共建更加清洁美丽的世界。（央视新闻）", "ctime": 1780645180, "time_str": "15:39:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260605/c677247839.shtml"}, {"id": "4470125", "title": "我国科学家运用人工智能与地震仪识别布氏鲸“低语”", "content": "我国科学家在一项最新研究中利用海岛地震仪连续记录的振动数据，结合深度学习算法，成功实现对北部湾布氏鲸声学信号的自动识别与全年连续监测，揭示这一鲸类在北部湾的声学活动规律。该项研究融合了人工智能、地球物理学与海洋生物学，由广西民族大学、广西科学院、广西壮族自治区地震局、中国科学院南海海洋研究所组成的联合研究团队共同完成，相关成果于6月4日在国际学术期刊《地球物理研究通讯》上发表。（新华社）", "ctime": 1780645061, "time_str": "15:37:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260605/c677247779.shtml"}, {"id": "4470123", "title": "科华控股：财务总监朱海东提前终止本次减持计划 已减持0.05%", "content": "科华控股公告，公司财务负责人兼董事会秘书朱海东原持股44.7万股，占0.23%，曾计划2026年5月28日至8月27日减持不超10.1万股、不超0.05%。2026年6月1日至6月4日其通过集中竞价减持10.08万股，占0.05%，价格区间13.95～15.09元/股，成交额144.92万元；目前持股34.62万股，占0.18%。朱海东决定提前终止本次减持计划。", "ctime": 1780645048, "time_str": "15:37:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260605/c677247769.shtml"}, {"id": "4470105", "title": "华脉科技：控股股东胥爱民解除质押0.93%股份", "content": "华脉科技公告，控股股东、实际控制人胥爱民于2026年6月4日解除质押150万股，占其所持股份4.06%，占公司总股本0.93%。截至公告日，其持有公司股份3690.5万股，占22.98%；本次解除质押后，累计质押股份1430万股，占其持股38.75%，占公司总股本8.90%。", "ctime": 1780644872, "time_str": "15:34:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260605/c677247652.shtml"}, {"id": "4470103", "title": "山外山：子公司取得血液透析干粉变更注册，有效期至2030年", "content": "山外山公告，其全资子公司重庆天外天生物技术有限公司于近日收到国家药品监督管理局颁发的《中华人民共和国医疗器械变更注册（备案）文件》，产品名称为血液透析干粉，主要变更内容为变更产品技术要求，注册证编号为国械注准20203101004，管理类别为Ⅲ类，注册证有效期为2025年12月25日至2030年12月24日。本次变更为响应国家医疗器械标准更新及《中华人民共和国药典》修订要求的常规合规性技术升级，不涉及核心配方、适用范围、临床用途及生产场地调整。", "ctime": 1780644864, "time_str": "15:34:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260605/c677247648.shtml"}, {"id": "4470097", "title": "同仁堂：时疫清瘟丸获加拿大上市批准，累计研发投入约213万元", "content": "同仁堂公告，公司下属北京同仁堂股份有限公司同仁堂制药厂取得加拿大卫生部境外生产场地认证，产品养阴清肺丸、时疫清瘟丸获准可在加拿大上市销售。其中，养阴清肺丸累计研发投入约100万元，时疫清瘟丸累计研发投入约213万元。本次生产场地认证及产品上市获批暂不会对公司生产经营和业绩产生重大影响。", "ctime": 1780644848, "time_str": "15:34:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260605/c677247642.shtml"}, {"id": "4470075", "title": "WTI原油跌超1%", "content": "WTI原油跌超1%，现报92.07美元/桶。", "ctime": 1780644624, "time_str": "15:30:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260605/c677247430.shtml"}, {"id": "4470071", "title": "外交部：中国在黄岩岛开展活动是主权国家正当权利", "content": "外交部发言人毛宁6月5日在例行记者会上答问时说，黄岩岛是中国的固有领土，中国对黄岩岛及其附近海域拥有无可争辩的主权。中国在黄岩岛开展包括科考在内的任何活动，都是主权国家的正当权利。（新华社）", "ctime": 1780644528, "time_str": "15:28:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260605/c677247373.shtml"}, {"id": "4470067", "title": "嘉美包装跌停，俞浩手机关机", "content": "6月5日，嘉美包装收报16.79元/股，下跌9.97%。该公司股票在披露控股权变更完成的公告后复牌，开盘大涨7%，收盘跌停。前一日晚间，该公司发布公告，苏州逐越鸿智科技发展合伙企业（有限合伙）发起的部分要约收购已完成全部股份清算过户手续，持股比例升至45.01%，正式成为公司控股股东，逐越鸿智于2025年9月注册设立，实际控制人为追觅科技创始人俞浩。今日，俞浩微博显示被禁言。市场消息称，某市辖区正在要求统计辖区内企业与追觅科技已开展合作的情况，包括但不限于：合作项目、总体规模、资金投入、财政及国资投入情况、目前经营情况等。该地方人士回应媒体称，系市里统一部署，其所在区域初排下来没有相关的情况。记者电话联系俞浩，提示已关机；追觅公关人士对相关问题未予回复；常州市发改委工业处回复第一财经称对于网传排查消息“不了解情况”。（第一财经）", "ctime": 1780644518, "time_str": "15:28:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260605/c677247372.shtml"}, {"id": "4470037", "title": "外交部介绍习近平总书记访问朝鲜有关安排", "content": "应朝鲜劳动党总书记、朝鲜民主主义人民共和国国务委员长金正恩邀请，中共中央总书记、中华人民共和国主席习近平将于6月8日至9日对朝鲜民主主义人民共和国进行国事访问。\n\n外交部发言人毛宁5日在例行记者会上答问时表示，此次访问是习近平总书记时隔7年再次对朝鲜进行国事访问。访问期间，两党两国最高领导人将就双边关系及共同关心的问题交换意见。近年来，在习近平总书记和金正恩总书记的战略引领下，中朝传统友好合作关系持续健康稳定发展，为两国和两国人民带来实实在在的利益。今年是《中朝友好合作互助条约》签订65周年，双方将以此访为契机，推动中朝关系与时俱进取得更大发展，增进两国人民福祉，为地区乃至世界的和平稳定和发展繁荣作出更大的贡献。(央视新闻)", "ctime": 1780644139, "time_str": "15:22:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260605/c677247185.shtml"}, {"id": "4470035", "title": "外交部：人工智能不是大国专利 更不应滑向竞争对抗", "content": "外交部发言人毛宁6月5日在例行记者会上答问时说，人工智能正在深刻改变生产生活方式，是人类需要共同面对的新课题。人工智能不是大国的专利，更不应滑向竞争对抗。今年7月，中国将在上海举办2026世界人工智能大会暨人工智能全球治理高级别会议，期待以本次大会为契机，同各方深入交流对话，加强人工智能全球治理，推动人工智能服务全人类福祉。(新华社)", "ctime": 1780644067, "time_str": "15:21:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260605/c677247169.shtml"}, {"id": "4470027", "title": "外交部回应西媒称AI中美争霸", "content": "6月5日，外交部发言人毛宁主持例行记者会。 有记者提问，我们注意到，近期西方媒体有观点认为，全球AI竞赛进入了“中美争霸”，或将加剧科技领域的阵营对抗。同时，中美科技企业在通用大模型机器人等领域最近也落地了多个合作项目，不少业界人士呼吁两国在AI方面开展合作。请问中方如何看待上述动向？ 毛宁表示，人工智能正在深刻改变生产生活方式，是人类需要共同面对的新课题。人工智能不是大国的专利，更不应滑向竞争对抗。中方始终坚持人工智能以人为本、开放包容。我们提出全球人工智能治理倡议，连续8年举行世界人工智能大会，倡议成立世界人工智能合作组织，核心就是通过对话凝聚共识、深化合作，打造开放、平等、公平、非歧视的人工智能发展环境。 今年7月，中国将在上海举办2026世界人工智能大会暨人工智能全球治理高级别会议，期待以本次大会为契机，同各方深入交流对话，加强人工智能全球治理，推动人工智能服务全人类。（北青报）", "ctime": 1780644028, "time_str": "15:20:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260605/c677247148.shtml"}, {"id": "4470013", "title": "以军袭击黎南部城市提尔 致7人死亡", "content": "黎巴嫩民防部门当地时间5日上午宣布，4日晚至5日凌晨以色列国防军空袭黎巴嫩南部城市提尔，造成7人死亡。（央视新闻）", "ctime": 1780643861, "time_str": "15:17:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260605/c677247018.shtml"}, {"id": "4469999", "title": "姚顺雨入职半年，腾讯高管：他对于元宝和混元带来了巨大价值", "content": "6月5日下午消息，今日2026年腾讯云AI产业应用大会在京举办。沟通会上，腾讯集团高级执行副总裁、云与智慧产业事业群CEO汤道生现场回应了腾讯为什么会选择姚顺雨，以及姚顺雨入职半年来对腾讯AI带来了哪些改变？汤道生表示，“他在这个领域是很有影响力的专家，在他来之前我们沟通也充分感受到了他的专业，确实是对于AI的认知跟我们过去很多不一样，他的到来对于元宝和混元带来了巨大的价值。”汤道生透露，“其实我们之前训练的很多数据是不够高质量的，所以他到来之后早期做了很多工作，就是把数据质量提质，包括砍掉很多貌似可以堆量的，但实际对模型没有太大帮助的（数据），很多的决策就会做得更加到位，他做了很多化繁为简的事情，元宝和混元过去半年的进展比过去更长的时间进步了更多，毫无疑问他（姚顺雨）有非常大的功劳。”（新浪科技）", "ctime": 1780643730, "time_str": "15:15:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260605/c677246921.shtml"}, {"id": "4469993", "title": "因安全带紧急锁止可能失效，起亚在美召回逾6000辆2027款Telluride车型", "content": "6月5日，美国国家公路交通安全管理局（NHTSA）公告显示，起亚北美公司正在申请召回部分2027款Telluride和Telluride混动版汽车，潜在受影响的车辆总数为6264辆。本次召回的核心原因在于，受影响车辆的驾驶员安全带“紧急锁止收卷器”可能会发生非预期锁死，导致安全带织带无法正常拉出。在车辆不幸发生碰撞时，无法正常拉伸延伸的安全带将无法有效约束车内人员，从而显著增加乘员的受伤风险。（界面新闻）", "ctime": 1780643670, "time_str": "15:14:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260605/c677246895.shtml"}, {"id": "4469977", "title": "闻泰科技起诉安世荷兰", "content": "据安世中国消息，安世闻泰科技针对安世荷兰的不当干预，正式在中国启动法律程序，案件已被司法机关受理。据安世中国介绍，闻泰科技已向广东省东莞市中级人民法院起诉安世荷兰，法院已立案。", "ctime": 1780643542, "time_str": "15:12:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260605/c677246843.shtml"}, {"id": "4469973", "title": "富时中国A50指数期货走低，跌超2%", "content": "富时中国A50指数期货走低，跌超2%。", "ctime": 1780643400, "time_str": "15:10:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
