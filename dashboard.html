罪滋生蔓延的土壤。国际社会应秉持共同、综合、合作、可持续的安全观，坚持和平解决争端，加强预防外交和斡旋调解，推动停火止战，履行国际人道法义务，实现热点问题缓和降温。（新华社）", "ctime": 1783573353, "time_str": "13:02:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260709/c678061701.shtml"}, {"id": "4684187", "title": "沐曦股份：近期媒体报道的公司订单情况不属实", "content": "沐曦股份发布澄清公告，近期媒体报道公司部分产品订单已经排到明年甚至之后情况不属实。公司首席产品官、高级副总裁孙国梁先生在“活力中国调研行”上海站活动中的发言，未对公司订单情况发表观点。公司目前生产经营正常，不存在应披露而未披露的重大信息。", "ctime": 1783573128, "time_str": "12:58:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260709/c678061688.shtml"}, {"id": "4684139", "title": "美军称打击了约90个伊朗军事目标", "content": "美军中央司令部8日在社交媒体发文称，已对伊朗完成又一轮打击，打击范围涉及约90个伊朗军事目标，包括防空系统、海岸监视设施、导弹和无人机储存设施，以及伊朗沿海地区军事后勤基础设施等。帖文称，美军始终保持警惕，并随时准备继续执行行动指令。帖文同时还附上一段美军打击伊朗军事目标的视频。（新华社）", "ctime": 1783573044, "time_str": "12:57:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260709/c678061682.shtml"}, {"id": "4684089", "title": "广西南宁强降雨已致26人死亡 7人失联", "content": "7月9日，广西南宁市召开第三场防汛救灾新闻发布会。会上介绍，截至今天上午11时，南宁六蓝水库溃口洪灾已造成26人死亡（其中5人身份待确定）、失联7人。（央视新闻）", "ctime": 1783572012, "time_str": "12:40:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260709/c678061493.shtml"}, {"id": "4684075", "title": "集邦咨询：预估第三季Server DRAM合约价将季增13%—18%", "content": "根据TrendForce集邦咨询最新存储器价格调查，由于部分原厂提早于2026年第二季的报价反映涨幅，加上数家美系云端服务供应商（CSP）已签署多年期长约（LTA），限制原厂对该类客户的涨价空间，TrendForce集邦咨询预估第三季Server DRAM合约价将季增13%—18%。然而，随着供不应求格局延续，后续仍可能出现各家原厂竞相上修报价的情况。（人民财讯）", "ctime": 1783571023, "time_str": "12:23:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260709/c678061383.shtml"}, {"id": "4684071", "title": "大连发布暴雨红色预警 启动防汛应急响应", "content": "大连市气象台9日11时15分发布暴雨红色预警信号：过去1小时，大连高新区龙王塘街道降水量已达50到60毫米；预计未来2小时，此地区还将出现30到40毫米的降水，最大1小时雨强达50毫米，发生山洪的风险较大。大连市防汛抗旱指挥部决定，自9日11时起，发布防汛蓝色预警，启动全市防汛四级应急响应。大连市防汛抗旱指挥部要求，各地区要做好重点部位的巡查值守和预警发布工作，及时果断组织群众转移避险，确保人民群众生命安全。（新华社）", "ctime": 1783570869, "time_str": "12:21:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260709/c678061354.shtml"}, {"id": "4684061", "title": "山东省机器人和智能装备产业对接活动在济南举办", "content": "7月9日，山东省机器人和智能装备产业对接活动在济南举办。活动中，中国电子信息产业发展研究院和山东省工业和信息化厅共同发布了山东省机器人和智能装备产业品牌矩阵图。同时发布山东省首批26家重点建设的具身智能机器人训练场名单，并进行了山东省机器人和智能装备产业联盟及山东省机器人标准化委员会的揭牌仪式。此外，还组织了智能机器人传动系统检测中心等公共服务类项目签约，优宝特、光轮智能、智元机器人等一批头部企业区域落地项目进行战略合作签约。同时成立济南市中区、起步区两大省级机器人专项产业基金。（人民财讯）", "ctime": 1783570624, "time_str": "12:17:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260709/c678061277.shtml"}, {"id": "4684055", "title": "蚂蚁灵波开源全球首个具身视频基模", "content": "蚂蚁灵波开源LingBot-Video，这是全球首个基于Mixture-of-Experts（MoE）架构、面向具身智能的开源视频生成基础模型。据悉，LingBot-Video构建了数据画像引擎，在海量互联网视频的基础上进一步引入VLA、VLN、Ego等机器人相关数据，覆盖灵巧操作、机器人移动和第一视角交互等场景，总规模达7万小时的具身数据。(科创板日报快讯)", "ctime": 1783570056, "time_str": "12:07:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260709/c678061160.shtml"}, {"id": "4684053", "title": "7月9日午间公告一览：完美医疗销售合约价值同比增加12.1%", "content": "完美医疗公告，截至二零二六年六月三十日止三个月，销售合约价值同比增加12.1%，主要由于整体经济复苏势头稳健。", "ctime": 1783570031, "time_str": "12:07:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260709/c678061150.shtml"}, {"id": "4684051", "title": "港股午评：恒生指数跌0.78%，恒生科技指数跌0.06%", "content": "港股午间收盘，恒生指数跌0.78%，恒生科技指数跌0.06%。恒指港股通ETF银华（159318）跌0.95%，港股通科技ETF鹏华（159751）涨0.34%。板块方面，半导体产品与设备、能源设备与服务板块涨幅靠前；客运航空公司、居家用品板块跌幅靠前。个股方面，兆易创新涨13.85%，深演智能涨12.87%，英矽智能涨10.86%，珞石机器人涨9.37%，智谱涨8.99%；怡俊集团控股跌14.86%，MINIMAX-W跌13.79%，云迹跌12.16%，亮晴控股跌9.13%，灵宝黄金跌8.08%。", "ctime": 1783569935, "time_str": "12:05:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260709/c678061133.shtml"}, {"id": "4684027", "title": "小鹏Robotaxi开启内测，何小鹏称Robotaxi是小鹏迈向“机器人汽车”的重要一步", "content": "记者9日获悉，小鹏集团召开Robotaxi业务首次全员会，并宣布正式启动员工内测。何小鹏表示，未来十年，所有具身智能载体本质都会成为机器人，Robotaxi是小鹏从新能源汽车迈向“机器人汽车”的重要一步，是成为小鹏物理AI版图的关键一子。基于AI时代软硬件融合的发展趋势，小鹏未来将聚焦整车平台、自动驾驶软件及AI能力，打造服务全球合作伙伴的Robotaxi软硬件服务商，通过输出整套解决方案，推动Robotaxi全球化落地。（人民财讯）", "ctime": 1783569214, "time_str": "11:53:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260709/c678061004.shtml"}, {"id": "4684009", "title": "天津鲁电新能源投资合伙企业成立，出资额约14亿元", "content": "企查查APP显示，近日，天津鲁电新能源投资合伙企业（有限合伙）成立，出资额约14亿元，经营范围为以自有资金从事投资活动。企查查股权穿透显示，该合伙企业由中国康富国际租赁股份有限公司、国家电投集团北京电力有限公司旗下国电投（山东）新能源开发有限公司、山东中景能投新能源开发有限公司共同出资。（人民财讯）", "ctime": 1783568774, "time_str": "11:46:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260709/c678060930.shtml"}, {"id": "4684007", "title": "晨丰科技等在河北成立能源公司，含储能技术服务业务", "content": "企查查APP显示，近日，北网新能（河北）能源有限公司成立，法定代表人为刘余，注册资本为1000万元，经营范围包含：储能技术服务；太阳能发电技术服务；发电技术服务；风力发电技术服务等。企查查股权穿透显示，该公司由晨丰科技全资子公司北网新能（内蒙古）能源有限公司、海口紫御湾投资有限公司共同持股。（人民财讯）", "ctime": 1783568494, "time_str": "11:41:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260709/c678060868.shtml"}, {"id": "4683993", "title": "国家防总组织多部门联合会商 研究部署超强台风“巴威”防御工作", "content": "7月8日，国家防总在中央气象台组织应急管理部、中国气象局、自然资源部、住房城乡建设部、交通运输部、水利部、农业农村部等部门和上海、浙江、福建等重点省份进行联合会商，研判超强台风“巴威”发展趋势及影响，研究部署防汛防台风工作。会商强调，要进一步压实防灾减灾责任，树牢底线思维、极限思维，以超常规举措狠抓隐患排查、预警、“叫应”、转移、救援、救助安置等各环节责任措施落实。要进一步强化监测预警，密切监测雨情汛情风情发展趋势，及时发布暴雨、山洪、江河洪水、地质灾害预警，严格落实直达基层一线临灾预警“叫应”机制，果断转移受威胁群众。要进一步落实重点领域防范措施，加密江河湖库巡查防守，强化城市内涝和山洪地质灾害防范，落实重要基础设施和在建工程防汛措施。要进一步做好救援救灾和应急保障准备，组织救援力量预置布防，备好抢险救援物资装备，发生险情灾情迅速组织抢险救援，同时保障好受灾群众基本生活。针对可能发生的“三断”极端复杂情况，提前预置应急通信前突力量、央企工程救援力量、电力应急保障力量。（人民财讯）", "ctime": 1783568262, "time_str": "11:37:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260709/c678060753.shtml"}, {"id": "4683973", "title": "期货午评：能源化工持续大涨！有色、贵金属集体下挫，碳酸锂大跌超5%", "content": "期货午评：截至收盘，商品跌多涨少，集运欧线跌超7%，碳酸锂跌近6%，沪银跌近5%，钯跌超3%，多晶硅跌近3%，铂、棉花、不锈钢跌超2%。涨幅方面，低硫燃料油涨超6%，SC原油涨近6%，燃料油涨超5%。", "ctime": 1783567950, "time_str": "11:32:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260709/c678060583.shtml"}, {"id": "4683969", "title": "ETF两市成交额报3088.97亿元，较昨日此时缩量64.59亿元", "content": "截至目前，ETF两市成交额报3088.97亿元，较昨日此时缩量64.59亿元，分类型来看，股票型ETF成交额1159.22亿元，债券型ETF成交额1013.93亿元，货币型ETF成交额114.33亿元，商品型ETF成交额26.86亿元，QDII型ETF成交额774.63亿元。", "ctime": 1783567904, "time_str": "11:31:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260709/c678060579.shtml"}, {"id": "4683967", "title": "ETF午评：标普油气ETF领涨4.67%，稀有金属ETF领跌5.79%", "content": "ETF午间收盘涨跌不一，标普油气ETF（513350）领涨4.67%，港股通信息技术ETF（526050）涨4.10%，科创信息ETF（588260）涨4.02%，稀有金属ETF（159671）领跌5.79%，稀有金属ETF（159055）跌5.48%，稀有金属ETF（561800）跌5.44%。", "ctime": 1783567893, "time_str": "11:31:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260709/c678060577.shtml"}, {"id": "4683963", "title": "A股午评：科创50指数半日涨超3%，半导体、国产算力方向集体走强", "content": "A股三大指数早盘涨跌不一，截至午盘，上证指数跌0.46%，深证成指跌0.35%，创业板指涨0.13%，北证50跌1.79%，科创50指数涨3.19%。全市场成交额17085亿元，较上日缩量70亿元，全市场超4600只个股下跌。板块题材上，油气开采及服务、半导体、影视院线板块涨幅居前；能源金属、小金属、贵金属、电池、电网设备、磷化工、培育钻石、钢铁、旅游及酒店、工程机械板块跌幅居前。盘面上，中东战事再度升级推动国际油价8日显著上涨，油气股多数走高，通源石油20cm涨停，潜能恒信、ST洲际跟随上涨。长鑫科技7月16日将启动申购，国产算力、半导体方向集体上扬，上海合晶、华天科技收获涨停，沐曦股份、有研硅、摩尔线程涨幅居前。另一方面，锂矿，电池等新能源产业链继续下跌，盛新锂能、融捷股份、天赐材料、德新科技、龙蟠科技盘中纷纷跌停。各类金属股同样表现不佳，北方稀土、中矿资源、中稀有色领跌。此外，电网设备、人形机器人、培育钻石等多个板块震荡下挫。", "ctime": 1783567870, "time_str": "11:31:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260709/c678060575.shtml"}, {"id": "4683961", "title": "股指期货早盘收盘 主力合约涨跌互现", "content": "股指期货早盘收盘，主力合约涨跌互现。沪深300股指期货(IF)主力合约涨0.04%，上证50股指期货(IH)主力合约涨0.43%，中证500股指期货(IC)主力合约跌0.56%，中证1000股指期货(IM)主力合约跌1.15%。", "ctime": 1783567817, "time_str": "11:30:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260709/c678060558.shtml"}, {"id": "4683957", "title": "沪深京三市成交额超1.7万亿元", "content": "据同花顺iFinD数据，沪深京三市成交额超1.7万亿元，预计全天成交金额约2.6万亿元。截至目前，沪市成交额7868亿元，深市成交额9016亿元，北证50成交额114亿元。", "ctime": 1783567733, "time_str": "11:28:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260709/c678060534.shtml"}, {"id": "4683927", "title": "浙江调整防台风应急响应为Ⅳ级", "content": "浙江省防指决定于7月9日9时将海上防台风应急响应调整为防台风Ⅳ级应急响应，要求各地各部门密切关注台风发展变化，以预报预警为令，强化预警响应联动，严格按预案方案落实落细各项防台风准备工作。目前，浙江海事部门已通过短信、微信、高频播报等多渠道发布台风相关安全提醒，实施船舶精准叫应。截至7月8日18时，浙江所有沿海涉水工程已全部停工，施工船舶已全部撤往安全避风水域，14820艘国内海洋渔船全部在港避风，557艘休闲渔船停止营运。（新华社）", "ctime": 1783567120, "time_str": "11:18:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260709/c678060362.shtml"}, {"id": "4683923", "title": "2026年APEC林业部长级会议将于7月27日到28日召开", "content": "记者从今天的国家林业和草原局新闻发布会上了解到，作为APEC中国年系列活动之一，在自然资源部指导下，国家林草局、广东省人民政府、深圳市人民政府将于7月27日—28日在深圳召开APEC林业部长级会议，会议主题为“共建绿色亚太，共享生态福祉”。亚太地区森林面积占全球一半以上，贡献了约全球60%的林产品生产和40%的林产品贸易，是全球陆地、海岸生态系统最富集的区域，并拥有全球近半的红树林资源。森林是亚太地区生态安全的坚实屏障和民生福祉的深厚支撑，在应对气候变化、保护生物多样性及改善居民生计中发挥着不可替代的作用。区域内各经济体资源禀赋、发展阶段差异明显，尤其是随着城市化的不断加速，各经济体面临着全球气候变化、森林退化、生物多样性丧失的共同挑战，亟须通过技术创新、森林管理和区域合作来推进发展建设。在此背景下，本届林业部长级会议搭建高层对话平台将凝聚共识、携手行动，具有三重积极意义：第一、立足全球生态治理大局，贡献亚太智慧与方案；第二、立足区域可持续发展全局，凝聚共建清洁美丽亚太的统一行动；第三、打造长效多边合作实体平台，推动务实行动落地见效。（央视新闻）", "ctime": 1783567054, "time_str": "11:17:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260709/c678060304.shtml"}, {"id": "4683917", "title": "伊朗称打击科威特和巴林的美军基地", "content": "伊朗伊斯兰革命卫队9日发表声明说，伊朗打击美军在科威特和巴林的多处军事基地以回应美方违背其承诺，并警告称如果美国侵略行径重演，将扩大回击范围至中东地区其他美军基地。声明说，此次打击行动是回应的第一阶段，伊朗伊斯兰革命卫队海军和空军部队联合发动导弹和无人机打击，目标针对美军在科威特的阿里夫坚基地、阿里·萨利姆空军基地，在巴林的朱费尔基地、谢赫伊萨空军基地。声明还说，美国“背信弃义，再次违背其所有承诺”，袭击伊朗南部沿海省份的多个地区，炸毁伊朗东部省份通往马什哈德的两座桥梁。（新华社）", "ctime": 1783567027, "time_str": "11:17:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260709/c678060294.shtml"}, {"id": "4683913", "title": "美联储官员对通胀预期和货币政策分歧明显", "content": "美国联邦储备委员会8日公布的6月货币政策会议纪要显示，美联储官员对美国通胀预期和未来货币政策走向分歧明显。 会议纪要显示，与会美联储官员普遍注意到通胀进一步升高，且仍远高于2%的长期目标，但对通胀走势的判断分歧明显。多名官员表示，物价上涨的压力已变得更为广泛，很多商品和服务的价格在经历显著上涨。另一些官员认为，住房相关服务价格涨势放缓很可能推动通胀压力逐步缓解。 部分与会官员表示，大宗商品价格高企以及供应冲击持续时间可能比现在预期的更长，此外，对人工智能的持续强劲需求可能使科技产品和电力价格持续上涨。但其他一些官员认为，人工智能应用带来的生产力提高最终将降低产品成本并增加总供给，进而导致通胀下行。 会议纪要还显示，虽然在此次会议上与会官员均同意维持利率不变，但他们对未来货币政策走向的判断存在分歧。大部分与会官员认为，在当前美国就业市场稳定、通胀继续处于高位的情况下，美联储需要适度收紧货币政策，以实现通胀目标。 一些官员认为，到今年年底时让利率高于当前水平是合适的；也有官员认为，到今年年底时应让利率保持在当前或略低的水平。 美联储于6月17日结束为期两天的货币政策会议，宣布将联邦基金利率目标区间继续维持在3.5%至3.75%之间不变。美联储将于7月28日至29日召开下一次货币政策会议。(新华社)", "ctime": 1783567013, "time_str": "11:16:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260709/c678060291.shtml"}, {"id": "4683903", "title": "深证成指跌1%", "content": "深证成指跌幅扩大至1%，上证指数跌0.71%，创业板指跌0.78%。", "ctime": 1783566877, "time_str": "11:14:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260709/c678060237.shtml"}, {"id": "4683901", "title": "韩国对泰国无缝铜管作出反倾销终裁", "content": "韩国贸易委员会发布第2026-12号公告，对原产于泰国的无缝铜管作出反倾销肯定性终裁，建议韩国企划财政部对涉案产品征收为期五年的反倾销税。具体税率分为三类：香港海亮铜贸易有限公司及其关联企业税率为4.93%，Fine Metal Technologies Public Company Ltd.及其关联企业税率为8.41%，其他生产商/出口商税率为4.93%。涉案产品为外直径 // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

function renderKPI() {

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>

    </div>

}

      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
