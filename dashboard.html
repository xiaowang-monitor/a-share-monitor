期。 IATA理事长威利·沃尔什表示，中东战事造成的混乱以及燃油成本上涨加剧了航司困境。 巴西蓝色航空公司首席执行官约翰·罗杰森说，由于燃油价格高企，该公司今年已削减了在巴西5%的运营，如果油价继续高企，公司将考虑进一步削减运营。 拉塔姆航空公司首席执行官罗伯托·阿尔沃认为，即使中东战事结束，未来几个月机票价格预计仍将居高不下。但阿尔沃指出，面对当前形势，航空公司已开始调整盈利能力较弱市场的运力，以应对成本压力。 IATA8日公布的报告说，当前替代燃料供应非常有限，呼吁有关各方增加可再生燃料的生产，并制定政策鼓励投资节能系统。 在为期三天的会议中，约1500名航空企业高管、机场代表和业界代表等齐聚一堂，探讨地缘政治局势对航空业的影响，讨论主题包括运营成本上升、能源价格上涨，以及在当前国际环境下维持互联互通所面临的挑战等。(新华社)", "ctime": 1780987907, "time_str": "14:51:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260609/c677320319.shtml"}, {"id": "4490333", "title": "ETF两市成交额报3739.59亿元，较昨日此时缩量440.7亿元", "content": "截至目前，ETF两市成交额报3739.59亿元，较昨日此时缩量440.7亿元，分类型来看，股票型ETF成交额1374.5亿元，债券型ETF成交额1270.15亿元，货币型ETF成交额217.72亿元，商品型ETF成交额60.21亿元，QDII型ETF成交额817.02亿元。", "ctime": 1780987807, "time_str": "14:50:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260609/c677320276.shtml"}, {"id": "4490311", "title": "沪深京三市成交额超2.5万亿元，较上日此时缩量1803亿元", "content": "据同花顺iFinD数据，沪深京三市成交额超2.5万亿元，较上日此时缩量1803亿元，预计全天成交金额约2.6万亿元。截至目前，沪市成交额11041亿元，深市成交额13723亿元，北证50成交额247亿元。", "ctime": 1780987634, "time_str": "14:47:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260609/c677320204.shtml"}, {"id": "4490291", "title": "5月高频数据折射消费活力迸发、产业向新向智", "content": "记者9日从国家发展改革委国家信息中心了解到，5月份，线下消费支付金额同比增长2.4%，增速较上月提高0.7个百分点，消费市场活力迸发；人工智能、人形机器人等前沿领域资本投资金额同比增长约5倍，产业发展向新向智，新兴产业拔节生长。线下消费大数据显示，5月份，线下消费支付金额同比增长2.4%。其中，商品消费、服务消费同比分别增长3.3%、1.2%，较4月分别提高0.6、0.8个百分点。分品类看，电子商品、餐饮服务、交通服务类消费增速较快，分别为9.7%、5.4%、4.8%。反映中小型商户活力的“收钱吧”实体商业活力指数为80.7，较4月增长1.9%，连续3个月回暖，其中商户经营健康指数、消费者活力指数较4月分别增长2.1%、1.6%。“得益于以旧换新补贴、促进服务消费等系列政策，叠加‘五一’假日消费带动，内需扩容势能稳步积蓄，商品、服务消费继续协同回暖，电子、餐饮、出行等重点消费板块表现亮眼，国内消费市场保持向好态势。”国家发展改革委国家信息中心大数据发展部副研究员邢玉冠说。5月份，人工智能、人形机器人等前沿领域的资本投资金额同比增长约5倍，算力、数据、网络等领域的基础设施项目中标金额同比增长106.9%。从产业看，5月份，半导体企业经营热度同比增长8.7%，增速较4月提高7.6个百分点；战略性新兴产业相关专利授权量同比增长19.7%，增速较4月提高2.2个百分点。(新华社)", "ctime": 1780987490, "time_str": "14:44:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260609/c677320141.shtml"}, {"id": "4490283", "title": "氢能关注度再升温，国内氢能相关专利已超8600件，去年申请超1300件", "content": "氢能作为国家明确的未来产业，2026年热度持续攀升，政策与产业落地同步提速。截至2026年3月底，全国建成在建可再生能源制氢产能规模超过100万吨/年，其中，建成投运超25万吨/年，较2024年底增长超1倍。政策端，3月三部门启动氢能综合应用试点，目标2030年终端用氢价降至25元/千克以下。FCVC2026氢能大会（6月10日—12日）将至，行业关注度再升温。绿氢规模化、重卡等多场景渗透加速，氢能正从示范走向规模化发展关键期。企查查数据显示，我国现有超8600件氢能相关专利，2025年全年，我国累计申请1314件氢能相关专利，创近五年氢能相关专利申请量新高。截至6月9日，2026年我国已申请204件氢能相关专利。企业存量方面，截至2026年6月9日，我国现存3986家氢能相关企业。区域分布上，华东地区最多，占比34.0%，其次是华北地区，占比20.5%。（人民财讯）", "ctime": 1780987404, "time_str": "14:43:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260609/c677320111.shtml"}, {"id": "4490279", "title": "特朗普称中东5国要求施压以色列", "content": "据美国“阿克西奥斯新闻网（Axios）”当地时间6月8日报道，美国总统特朗普在接受其采访时称，他曾警告以色列总理内塔尼亚胡：“如果与伊朗再开战，以色列可能陷入孤立无援的境地。”特朗普在采访中称，中东有5个国家曾致电请他施压内塔尼亚胡停止军事行动。报道援引美国官员的话称，当地时间6月7日晚、也就是伊朗向以色列发射导弹后，特朗普与内塔尼亚胡通话，要求他“不要采取报复行动”。(CCTV国际时讯)", "ctime": 1780987383, "time_str": "14:43:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260609/c677320100.shtml"}, {"id": "4490275", "title": "中韩半导体ETF(513310)触及涨停，韩国综合指数涨幅达8.18%", "content": "中韩半导体ETF(513310)触及涨停，韩国综合指数涨幅达8.18%，溢价率为19.35%，成交额101.03亿元，近1月份额增加5400.00万份，该基金支持T+0交易。", "ctime": 1780987345, "time_str": "14:42:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260609/c677320064.shtml"}, {"id": "4490265", "title": "科恒股份成立稀土新材料公司", "content": "企查查APP显示，近日，广东科恒稀土新材料有限公司成立，经营范围包含：稀土功能材料销售；新材料技术研发；半导体器件专用设备销售；半导体器件专用设备制造等。企查查股权穿透显示，该公司由科恒股份全资持股。（人民财讯）", "ctime": 1780987059, "time_str": "14:37:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260609/c677319956.shtml"}, {"id": "4490257", "title": "商务部：支持中亚各国扩大对华出口非资源商品和农产品", "content": "6月9日，第九届中国—亚欧博览会新闻发布会在北京举办。商务部欧亚司副司长张栋介绍了接下来商务部将整体推进中国—中亚经贸合作的措施。一是加强发展战略对接。我们将推动共建“一带一路”倡议同中亚各国发展战略对接，落实好与中亚各国签署的政府间经贸合作规划，探讨建立贸易投资自由化便利化制度性安排，推动构建更紧密的经济伙伴关系。二是推动贸易提质增效。我们将继续巩固能源、矿产等大宗商品贸易，支持中亚各国积极参加“共享大市场 出口中国”系列活动，扩大对华出口非资源商品和农产品。拓展服务贸易、数字贸易、跨境电商等新业态，加快中国—中亚贸易畅通合作平台建设，打造中国—中亚贸易新的增长点。三是持续深化产供链合作。我们将加强绿色矿产合作，推进“探产供储销”全产业链协同。深化新能源、数字经济、人工智能、装备制造、现代农业等领域合作，促进贸易投资一体化发展。我们将用好中国—中亚股权投资合作基金等投融资工具，助力中亚国家产业升级，共同打造可持续、有韧性、更畅通的区域产供链体系。(澎湃新闻)", "ctime": 1780986944, "time_str": "14:35:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260609/c677319895.shtml"}, {"id": "4490255", "title": "华海清科获得国内首台全自动板级CMP量产装备订单", "content": "华海清科自主研发的国内首台510*515mm尺寸全自动板级CMP量产装备Master-P510APEX成功获得先进封装领域重要客户订单，将按计划进入客户端产线投入量产应用。公司表示，该装备将成为国内首台进入产线的国产全自动板级CMP装备，为我国先进封装乃至半导体产业自主可控补齐关键一环。此次突破也是华海清科CMP装备技术从晶圆级向板级延伸的重要里程碑。(人民财讯)", "ctime": 1780986922, "time_str": "14:35:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260609/c677319888.shtml"}, {"id": "4490243", "title": "英伟达Blackwell“一芯难求”？ 机构：从来未见如此供应紧张局面", "content": "韦德布什证券（Wedbush Securities）最新报告称，英伟达的Grace Blackwell系统（包括GB300和B300）的需求还在持续高涨，因为一些客户表示这些产品越来越难采购。“自Ampere/Hopper以来，我们不记得英伟达加速器周期后期出现过如此严重的供应紧张状况，这一结果表明需求增长速度比之前预期的要快。”他们写道。韦德布什还补充称，尽管供应限制，尤其是内存方面的供应限制，仍然是造成供货问题的主要原因，但就目前的供应链定位而言，英伟达“在整个技术生态系统中处于最佳地位”。(蓝鲸新闻)", "ctime": 1780986879, "time_str": "14:34:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260609/c677319876.shtml"}, {"id": "4490229", "title": "安联锐视等成立科技新公司 含AI软件开发业务", "content": "企查查APP显示，近日，上海安数致行科技有限公司成立，经营范围包含：人工智能基础软件开发；云计算装备技术服务；数字技术服务；大数据服务等。企查查股权穿透显示，该公司由安联锐视等共同持股。（人民财讯）", "ctime": 1780986832, "time_str": "14:33:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260609/c677319860.shtml"}, {"id": "4490219", "title": "首创期货：保供政策出台，焦煤期价盘中跌停", "content": "供应方面，陕西省发改委发布关于做好迎峰度夏能源保供工作的通知，督促煤炭企业在安全前提下依法合规释放先进产能。该消息引发多头获利了结，焦煤主力09合约两个交易日累计减仓超11万手。近日煤矿复产进度有所加快，截至6月8日，复产煤矿共计70座，产能8515万吨，仍在停产煤矿共计65座，产能共计6975万吨。进口方面蒙煤通关车辆维持高位。保供政策叠加市场情绪扰动下，预计短期焦煤期价震荡调整为主，关注国内煤矿开工及铁水产量变动情况。（首创期货）", "ctime": 1780986793, "time_str": "14:33:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260609/c677319829.shtml"}, {"id": "4490201", "title": "日韩股市集体收涨 韩国综指涨超8%", "content": "日经225指数收涨2.17%，报65416.63点。韩国综指收涨8.18%，报8096.92点。", "ctime": 1780986689, "time_str": "14:31:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260609/c677319801.shtml"}, {"id": "4490177", "title": "乐奇Rokid成为中央广播电视总台2026年美加墨世界杯转播AI眼镜独家合作伙伴", "content": "乐奇Rokid成为中央广播电视总台2026年美加墨世界杯转播AI眼镜独家合作伙伴。世界杯期间，球迷佩戴乐奇AI眼镜，即可获得赛程查询、技术统计、队伍阵容、球员信息、比分预测、看球辅助等丰富内容和服务。（人民财讯）", "ctime": 1780986573, "time_str": "14:29:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260609/c677319718.shtml"}, {"id": "4490175", "title": "锂矿概念震荡反弹 盛新锂能涨停", "content": "午后锂矿概念震荡反弹，盛新锂能涨停，天华新能、国城矿业、永杉锂业、融捷股份、赣锋锂业、永兴材料跟涨。", "ctime": 1780986523, "time_str": "14:28:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260609/c677319699.shtml"}, {"id": "4490173", "title": "中期协：5月全国期货市场成交量和成交额同比分别增长4.54%和29.01%", "content": "中国期货业协会最新统计资料表明，以单边计算，5月全国期货交易市场成交量为7.09亿手，成交额为706079.13亿元，同比分别增长4.54%和29.01%。1—5月全国期货市场累计成交量为41.66亿手，累计成交额为4020766.67亿元，同比分别增长24.84%和40.13%。", "ctime": 1780986473, "time_str": "14:27:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260609/c677319672.shtml"}, {"id": "4490169", "title": "巴西国家电信局副局长弗雷勒到访中国信通院", "content": "2026年6月8日，巴西国家电信局（Anatel）副局长亚历山大·弗雷勒（Alexandre Freire），巴西驻华使馆科学、技术与创新领域负责人安兰秋（Andressa Rangel Rodrigues）一行到访中国信息通信研究院（简称“中国信通院”）。中国信通院总工程师魏然出席并主持交流活动。活动期间，魏然陪同弗雷勒一行参观5G国际认证射频测试实验室以及个人信息保护实验室，听取中国—金砖国家人工智能发展与合作中心建设以及泰尔实验室国际检测认证业务发展进展，并就下一步合作进行了深入探讨。（人民财讯）", "ctime": 1780986396, "time_str": "14:26:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260609/c677319621.shtml"}, {"id": "4490155", "title": "南山控股股价跌停，公司回应", "content": "6月9日早盘，南山控股股价跌停。数据显示，截至6月9日午间收盘，公司股价报2.39元/股，跌幅为10.15%。南山控股方面独家回应中国证券报·中证金牛座记者称：“股价受多重因素影响。公司经营上没有发生什么变化，主要还是资金炒作。”“最近一段时间，包括公司在内的很多地产公司，特别是中小地产公司都有这个特点。第一天如果是涨停，或者接近涨停，第二天可能就会跌停，资金进出非常快。”南山控股方面告诉记者。(中证金牛座)", "ctime": 1780986332, "time_str": "14:25:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260609/c677319605.shtml"}, {"id": "4490151", "title": "辛巴旗下四大徒弟全数离开直播行业", "content": "6月9日，原头部主播辛巴徒弟赵梦澈发文宣布已离开辛选并退出直播行业，未来除辛选平台外，不再以主播身份出现在任何平台。赵梦澈称自己近六七年直播场次不足百场，按照GMV综合来算收入不超1.85%，收入分成远低于行业平均水平。另在昨日，辛巴另一徒弟时大漂亮宣布七年合约到期，已离开辛选。目前，辛巴旗下四大徒弟蛋蛋、赵梦澈、猫妹妹、时大漂亮已全部离开。去年8月，辛巴宣布由于身体原因，正式离开直播行业。（第一财经）", "ctime": 1780986302, "time_str": "14:25:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260609/c677319600.shtml"}, {"id": "4490123", "title": "谌贻琴访问保加利亚", "content": "应保加利亚政府邀请，6月6日至8日，国务委员谌贻琴率团访保，同保总统约托娃、总理拉德夫分别会见，同副总理多内夫举行会谈。 谌贻琴介绍了中国经济社会发展成就和“十五五”规划民生领域重点工作，表示中方高度重视中保关系发展，愿同保方密切政治、经济、民生、人文等各领域交流合作，加强多边对话协调，推动中保战略伙伴关系实现更大发展。保方领导人高度评价保中关系，表示两国各领域合作潜力很大，愿同中方携手持续丰富两国战略伙伴关系内涵，推动两国互利合作结出更多硕果。 访保期间，谌贻琴同多内夫副总理共同见证中国人力资源和社会保障部与保加利亚劳动和社会政策部签署部门间合作意向书，并调研保加利亚职业技能培训情况。(新华社)", "ctime": 1780986170, "time_str": "14:22:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260609/c677319546.shtml"}, {"id": "4490119", "title": "云南省科协党组成员、副主席彭山接受审查调查", "content": "云南省纪委监委6月9日通报，云南省科学技术协会党组成员、副主席彭山涉嫌严重违纪违法，目前正接受云南省纪委监委纪律审查和监察调查。(新华社)", "ctime": 1780986115, "time_str": "14:21:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260609/c677319539.shtml"}, {"id": "4490109", "title": "长鑫科技联合上海国投先导、中微半导体等设立私募股权基金", "content": "天眼查App显示，近日，长智瀚海（上海）私募投资基金合伙企业（有限合伙）在上海完成注册。该基金注册资本39.1亿元，出资方包括长鑫芯聚、东莞信托、上海国投先导、中微半导体等。其中，长鑫科技全资控股的投资平台-长鑫芯聚为第一大出资人，认缴出资11.73亿元。（科创板日报）", "ctime": 1780986019, "time_str": "14:20:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260609/c677319500.shtml"}, {"id": "4490105", "title": "百亿私募年内平均收益率超10%", "content": "私募排排网数据显示，有业绩展示的97家百亿私募，今年以来平均收益率达10.60%，其中92家实现正收益，占比高达94.85%。（人民财讯）", "ctime": 1780985993, "time_str": "14:19:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260609/c677319491.shtml"}, {"id": "4490067", "title": "特朗普称美伊谈判一两天内或有眉目", "content": "当地时间今天（6月9日）凌晨，美国总统特朗普在纽约肯尼迪国际机场准备搭乘专机返回华盛顿前，对媒体表示，美国与伊朗的谈判正在进行中，并暗示“一两天内”可能会看到明确的进展。同时，他坚称美国对伊朗的海上封锁依然有效。(CCTV国际时讯)", "ctime": 1780985682, "time_str": "14:14:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260609/c677319355.shtml"}, {"id": "4490055", "title": "阿里云：DMS安全协同包年包月付费包阶梯价格调整", "content": "阿里云公告，DMS安全协同包年包月付费包采用阶梯价格调整。安全协同阶梯价格调整明细，1-10个实例安全协同价格不变，稳定变更、敏感数据保护价格不变。本次阶梯定价采用“全额区间计价”模式，即：根据购买的总实例数量所落入的价格区间，所有实例均按该区间的统一单价进行计费，不采用分段累加方式。（阿里云）", "ctime": 1780985567, "time_str": "14:12:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260609/c677319318.shtml"}, {"id": "4490039", "title": "上海迪士尼度假区将延时营业至晚上10点半", "content": "6月8日，记者从上海迪士尼度假区获悉，度假区将于6月17日至8月31日推出“10岁生日庆典”夏季限定系列活动。为庆祝度假区开幕十周年，今年夏天将首次推出“加时升级日”，精选十个夜晚将乐园运营时间延长至晚间10时30分，并开放夜间主题派对与热门游乐项目。（第一财经）", "ctime": 1780985427, "time_str": "14:10:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260609/c677319263.shtml"}, {"id": "4490037", "title": "A股三大指数震荡走高，沪指涨超1%", "content": "A股三大指数震荡走高，沪指涨超1%，深证成指涨2.49%，创业板指涨3.59%。", "ctime": 1780985424, "time_str": "14:10:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260609/c677319261.shtml"}, {"id": "4489989", "title": "科创50指数涨超4%，沪硅产业20cm涨停", "content": "科创50指数涨超4%，算力硬件股领涨，沪硅产业20cm涨停，天岳先进涨超12%，中控技术、生益电子、中微公司涨幅居前。", "ctime": 1780985213, "time_str": "14:06:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260609/c677319102.shtml"}, {"id": "4489985", "title": "鸿海：与布鲁克菲尔德合作在越南开展能源项目", "content": "鸿海：与布鲁克菲尔德合作在越南开展能源项目。（新浪财经）", "ctime": 1780985135, "time_str": "14:05:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260609/c677319057.shtml"}, {"id": "4489935", "title": "半导体板块掀涨停潮", "content": "半导体板块掀涨停潮，大唐电信、晶丰明源、沪硅产业、立昂微、中晶科技、华亚智能等十余股封涨停板。相关ETF方面，科创芯片ETF汇添富（588750）涨5.22%，成交额1.99亿元，芯片ETF广发（159801）涨4.66%，成交额1.73亿元。", "ctime": 1780984998, "time_str": "14:03:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260609/c677319015.shtml"}, {"id": "4489909", "title": "日本国债收益率加速下滑，日本10年期国债收益率下降5个基点", "content": "日本国债收益率加速下滑，日本10年期国债收益率下降5个基点，至2.665%。日本20年期国债收益率下降7个基点，至3.565%。日本30年期国债收益率下降6.5个基点，报3.870%。", "ctime": 1780984972, "time_str": "14:02:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260609/c6 const SECTORS  = [{"name": "金融", "hit_count": 37, "etfs": []}, {"name": "半导体", "hit_count": 34, "etfs": []}, {"name": "人工智能", "hit_count": 27, "etfs": []}, {"name": "数据要素", "hit_count": 27, "etfs": []}, {"name": "消费", "hit_count": 14, "etfs": []}, {"name": "军工", "hit_count": 11, "etfs": []}, {"name": "地产", "hit_count": 6, "etfs": []}, {"name": "机器人", "hit_count": 5, "etfs": []}];
const META     = {"update_time": "2026-06-09 15:01:33", "sentiment_score": 57.14285714285714, "agents": []};

// 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
