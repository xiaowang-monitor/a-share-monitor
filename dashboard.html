: "美媒称以色列情报机构负责人访美提供镐山情报", "content": "美国媒体22日援引知情人士消息称，以色列情报和特勤局（摩萨德）的新任局长罗曼·戈夫曼于两周前访问美国华盛顿，就伊朗地区局势和伊朗核计划相关议题同美方举行会谈。美国有线电视新闻网报道说，戈夫曼在此次访问期间向美方提供了关于伊朗镐山、铀原料和伊朗经济状况等方面的情报。(新华社)", "ctime": 1784782852, "time_str": "13:00:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260723/c678379092.shtml"}, {"id": "4786331", "title": "Seed Edge团队发布科学家计划", "content": "7月23日，Seed Edge团队正式发布Seed STEM 科学家计划。该计划拟邀请100位前沿科学领域学者，与Seed 团队一起，围绕真实科研问题展开合作。该计划希望学者在STEM相关学科领域已获得或正在攻读博士学位。首期STEM科学家计划约持续6个月，在此期间，参与学者需来到Seed办公区，与团队一起开展工作。该计划将为参与学者提供充足的算力资源、先进的模型体验和专业的AI研究团队支持。为充分认可参与学者的科研价值和贡献，Seed团队将为其提供业界具有竞争力的薪酬回报。（界面新闻）", "ctime": 1784782303, "time_str": "12:51:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260723/c678379016.shtml"}, {"id": "4786205", "title": "农业农村部组织开展我国台湾岛以东管辖海域渔业资源调查", "content": "为全面了解我国管辖海域渔业资源状况，支撑海洋渔业资源养护与可持续发展，7月17日至23日，农业农村部中国水产科学研究院东海水产研究所“蓝海201”科学调查船在我国台湾岛以东海域开展了渔业资源调查。该海域渔业资源种类丰富，是金枪鱼类等主要经济种类的重要产卵场。此次调查采用多学科调查手段，采集了鱼类、头足类、甲壳类等渔业生物样本与环境DNA样本，获取了渔业声学和水文气象等基础数据，为我国系统掌握该海域渔业资源状况奠定了基础，也为在该海域开展渔业资源养护管理、促进海洋渔业可持续发展提供了科学依据。(界面)", "ctime": 1784780754, "time_str": "12:25:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260723/c678378804.shtml"}, {"id": "4786189", "title": "巴西宣布将拓展贸易伙伴应对美关税冲击", "content": "巴西总统卢拉22日宣布，巴西将拓展贸易伙伴以应对美国关税影响，并凭借自身信誉和国际市场地位为本国经济找到新出路。 卢拉表示，巴西政府将推出总额185亿雷亚尔（约合37亿美元）的信贷支持计划，以减轻美国对巴西产品加征关税和中东局势对巴西出口带来的冲击。 据介绍，此次信贷支持计划主要扶持受美国加征关税影响的钢铁、铝、汽车、木材、机械等行业，以及化肥、制药等战略性工业领域和受中东局势影响的出口商。 同日，卢拉签署法案，为一项此前设立的信贷支持计划追加150亿雷亚尔（约合30亿美元）信贷额度。该计划旨在应对去年美国首轮加征关税对巴西经济造成的冲击。 美国贸易代表办公室15日发布声明，宣布依据《1974年贸易法》第301条款，对部分巴西产品加征25%的关税。加征关税措施从7月22日开始生效，涉及数千种巴西产品。(新华社)", "ctime": 1784780272, "time_str": "12:17:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260723/c678378757.shtml"}, {"id": "4786145", "title": "港股午评：恒生指数涨1.34%，恒生科技指数涨0.79%", "content": "港股午间收盘，恒生指数涨1.34%，恒生科技指数涨0.79%。恒指港股通ETF银华（159318）涨1.71%，港股通科技ETF鹏华（159751）涨0.68%。板块方面，工业集团企业、电力板块涨幅靠前；酒店和度假村REIT、航空货运与物流板块跌幅靠前。个股方面，真健康医疗-B涨14.23%，智云科技建设涨14.03%，旺山旺水-B涨13.17%，中伟新材涨12.71%，迅策涨11.4%；天数智芯跌8.46%，怡俊集团控股跌7.05%，华虹宏力跌6.44%，鸣鸣很忙跌5.41%，应星控股跌5.07%。", "ctime": 1784779336, "time_str": "12:02:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260723/c678378503.shtml"}, {"id": "4786131", "title": "卡莱特与天津具身智能创新中心展开战略合作", "content": "据卡莱特消息，近日，卡莱特与天津具身智能创新中心正式签署战略合作框架协议，双方将围绕具身智能领域建立长期合作机制，共同推动技术融合与产业生态建设。(人民财讯)", "ctime": 1784779157, "time_str": "11:59:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260723/c678378417.shtml"}, {"id": "4786121", "title": "领益智造：公司AMD系列显卡散热模组已实现批量出货", "content": "领益智造7月22日接受机构调研时表示，作为AMD核心供应商，公司在不同系列产品项目上与客户展开合作，为散热设计优化、量产效率提升等关键环节提供解决方案，公司生产的AMD系列显卡散热模组已实现批量出货。(人民财讯)", "ctime": 1784778876, "time_str": "11:54:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260723/c678378382.shtml"}, {"id": "4786117", "title": "趋境科技力争五年内建成万卡级AI Token工厂", "content": "近日，趋境科技华东区域总部项目正式落地杭州萧山区钱江世纪城。据悉，趋境科技将在钱江世纪城重点建设高效能人工智能Token生产服务平台（ATaaS）华东区域交付与服务中心，力争在五年内建成万卡级集群规模的高品质AI Token工厂。(人民财讯)", "ctime": 1784778752, "time_str": "11:52:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260723/c678378366.shtml"}, {"id": "4786115", "title": "7月23日午间公告一览：海思科创新药琥珀酸思普可泮片获批上市", "content": "海思科公告，国家药监局批准公司申报的1类创新药琥珀酸思普可泮片上市。琥珀酸思普可泮片（研发代号：HSK39297片）是公司自主研发的一种高效、高选择性口服补体B因子（CFB）小分子抑制剂，通过抑制CFB活性从而阻断旁路途径（AP）的激活与补体扩增循环，进而抑制整个补体通路的活性，旨在治疗由补体异常活化所介导的多种疾病。本次获批上市的适应症为治疗既往未接受过补体抑制剂治疗的阵发性睡眠性血红蛋白尿症（PNH）成人患者。", "ctime": 1784778729, "time_str": "11:52:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260723/c678378361.shtml"}, {"id": "4786107", "title": "英国外交部说从伊朗暂时撤出工作人员", "content": "英国外交部22日说，鉴于地区局势紧张，英国工作人员已暂时从伊朗撤出，使馆以远程方式办公。（新华社）", "ctime": 1784778538, "time_str": "11:48:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260723/c678378314.shtml"}, {"id": "4786105", "title": "中国海警局新闻发言人就菲公务船侵闯中国黄岩岛管辖海域发表谈话", "content": "中国海警局新闻发言人姜略表示，7月23日，菲律宾3012、3018两艘公务船不顾中方一再劝阻和警告，执意侵闯中国黄岩岛管辖海域。中国海警依法对菲船采取跟监外逼、拦阻管制等必要措施予以驱离，现场操作专业规范、正当合法。黄岩岛是中国固有领土。我们敦促菲方立即停止侵权挑衅行径。中国海警将依法持续在黄岩岛海域开展维权执法活动，坚决维护国家领土主权和海洋权益。（新华社）", "ctime": 1784778523, "time_str": "11:48:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260723/c678378311.shtml"}, {"id": "4786101", "title": "上海：鼓励公募基金、银行理财等资产管理机构设立更多科创主题ETF基金、科创理财产品等", "content": "中共上海市委金融委员会办公室、上海市发展和改革委员会等部门印发《上海市充分发挥直接融资功能 进一步加强科技金融服务的若干措施》，其中提出，优化一二级市场投资接力。做好科创板重点硬科技企业规范培育工作、境外上市沟通协调工作和创业板地方政府推送企业信息工作，市区联动做好企业合规辅导，支持上海市重点科技企业对接境内外资本市场。优化面向科技企业的上市辅导体系，整合中介机构资源，提供精准的资本市场培训与对接服务。支持设立基石投资基金，并为其跨境投资提供审核备案汇兑等便利。鼓励公募基金、银行理财等资产管理机构设立更多科创主题ETF基金、科创理财产品等，培育二级市场科技投资力量。（人民财讯）", "ctime": 1784778486, "time_str": "11:48:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260723/c678378295.shtml"}, {"id": "4786099", "title": "上海：鼓励上海市国资基金与AIC合作设立股权投资基金", "content": "中共上海市委金融委员会办公室、上海市发展和改革委员会等部门印发《上海市充分发挥直接融资功能 进一步加强科技金融服务的若干措施》，其中提出，拓展金融资本来源。探索经相关决策程序后，对优秀基金管理人设定差异化国资出资比例、门槛收益率等条件，积极吸引社保基金、保险资金等在上海市出资设立股权投资基金。引导保险、养老金等长期资本扩大以“优先股+可转债”方式参与早期科技企业融资的规模。借鉴巨灾债券的风险分层设计，探索发行结构化科技金融产品。鼓励上海市国资基金与AIC合作设立股权投资基金。（人民财讯）", "ctime": 1784778448, "time_str": "11:47:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260723/c678378280.shtml"}, {"id": "4786095", "title": "上海：探索引入境外离岸人民币资金支持境内科技创新", "content": "上海市发展和改革委员会等部门印发《上海市充分发挥直接融资功能 进一步加强科技金融服务的若干措施》，其中提出，深化合格境外有限合伙人（QFLP）试点，发挥国资基金管理人的本土资源优势，推广“外资内管”模式，吸引境外优质资金。探索引入境外离岸人民币资金支持境内科技创新。对运作成熟、信誉良好的外资管理机构，推动优化设立审批流程，完善外汇资金汇兑便利，加强税务合规操作辅导。", "ctime": 1784778378, "time_str": "11:46:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260723/c678378268.shtml"}, {"id": "4786093", "title": "上海：建设直接融资试验区", "content": "中共上海市委金融委员会办公室、上海市发展和改革委员会等部门印发《上海市充分发挥直接融资功能 进一步加强科技金融服务的若干措施》，其中提出，建设直接融资试验区。依托上海市股权投资集聚区及张江科学城、大零号湾等高能级科创集聚区，规划建设直接融资试验区。建立政策评估与反馈机制，定期梳理政策落地堵点，推动及时解决落实，总结形成可复制推广的经验做法。推动在试验区内形成资本、人才、技术、信息的高度集聚，构建覆盖从“0到1”概念验证，到“1到10”孵化加速，再到“10到100”产业放大的全链条融资服务体系。", "ctime": 1784778364, "time_str": "11:46:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260723/c678378263.shtml"}, {"id": "4786089", "title": "上海：持续强化上市公司并购科技企业审核标准公开 支持交易双方以多元化的评估方法为基础协商确定交易作价", "content": "中共上海市委金融委员会办公室、上海市发展和改革委员会等部门印发《上海市充分发挥直接融资功能 进一步加强科技金融服务的若干措施》，其中提出，健全科技并购生态体系。持续强化上市公司并购科技企业审核标准公开，支持交易双方以多元化的评估方法为基础协商确定交易作价。发挥第三方市场化服务平台功能，建设科技企业并购案例库和估值数据库。推动科技企业适用简易审核程序典型案例落地，鼓励开展第三方并购。做好国家级并购基金对接服务，发挥上海市国资并购基金矩阵作用，吸引集聚市场化并购基金，围绕科技企业产业链开展并购交易。鼓励国内保险公司与海外机构开展技术合作，开发并推出本土化并购保险产品。", "ctime": 1784778205, "time_str": "11:43:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260723/c678378186.shtml"}, {"id": "4786085", "title": "上海：推动科创板持续深化改革 持续扩大科创板第五套上市标准的适用范围", "content": "中共上海市委金融委员会办公室、上海市发展和改革委员会等部门印发《上海市充分发挥直接融资功能 进一步加强科技金融服务的若干措施》，其中提出，推动科创板持续深化改革。推动出台科创板人工智能、低空经济等企业适用第五套标准上市审核指引，推动可控核聚变、具身智能、大模型、量子计算、脑机接口等新兴产业和未来产业领域企业在科创板上市，持续扩大科创板第五套上市标准的适用范围，增强资本市场对前沿科技领域未盈利企业的制度包容性与适应性。用好优质科技企业试点IPO预先审阅机制，推动进一步完善上海证券交易所与优质投资机构及专业投资者的沟通交流机制。", "ctime": 1784778074, "time_str": "11:41:14", "stock_code": "", "stock_name": "", "st // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

function renderPicks() {

    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
