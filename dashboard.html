<style>
:root {
  --bg-primary: #0a0e17;
  --bg-card: #111827;

  --text-primary: #e2e8f0;

  --green-bg: rgba(34,197,94,0.1);
  --gold: #f59e0b;
  --blue: #3b82f6;
  --purple: #8b5cf6;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Noto Sans SC', sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  min-height: 100vh;
}
.mono { font-family: 'JetBrains Mono', monospace; }
.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 20px;
  transition: all 0.2s;
}
.card:hover { background: var(--bg-card-hover); border-color: #334155; }
.badge {
  display: inline-flex; align-items: center; padding: 2px 8px;
  border-radius: 6px; font-size: 12px; font-weight: 500;
}
.badge-s { background: rgba(239,68,68,0.2); color: #ef4444; }
.badge-a { background: rgba(245,158,11,0.2); color: #f59e0b; }
.badge-b { background: rgba(59,130,246,0.2); color: #3b82f6; }
.badge-c { background: rgba(100,116,139,0.2); color: #94a3b8; }
.score-bar {
  height: 6px; border-radius: 3px; background: #1e293b; overflow: hidden;
}
.score-bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s; }
.up { color: var(--red); }
.down { color: var(--green); }
.pulse { animation: pulse 2s infinite; }
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}
.glow { box-shadow: 0 0 20px rgba(59,130,246,0.15); }
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg-primary); }
::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
</style>

              <th class="text-left py-2 px-1">名称</th>
              <th class="text-right py-2 px-1">现价</th>
              <th class="text-right py-2 px-1">涨幅</th>
              <th class="text-right py-2 px-1">评分</th>
              <th class="py-2 px-1 text-center" style="min-width:160px">评分分布</th>
              <th class="text-right py-2 px-1">板块</th>
              <th class="text-right py-2 px-1">连涨</th>
            </tr>
          </thead>
          <tbody id="picks-table"></tbody>
        </table>

    </div>
  </div>
</div>

<!-- 新闻流 + 交易代理 -->
<div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
  <div class="card">

  </div>
</div>

: false, "source": "", "url": "https://news.10jqka.com.cn/20260908/c679693269.shtml"}, {"id": "5124421", "title": "李干杰会见蒙古民主党代表团", "content": "中共中央政治局委员、中央统战部部长李干杰8日在京会见由党主席朝格特格日勒率领的蒙古民主党代表团。 李干杰表示，日前，习近平主席同呼日勒苏赫总统成功会晤，为中蒙关系擘画新蓝图。中方愿同蒙方共同落实好两国元首重要共识，在涉及彼此核心利益问题上坚定相互支持，深化发展战略对接与合作，扩大友好往来，推动构建中蒙命运共同体。 朝格特格日勒表示，民主党坚持一个中国原则，期待同中方加强党际交往，推动蒙中关系健康稳定发展。(新华社)", "ctime": 1788843570, "time_str": "12:59:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260908/c679693175.shtml"}, {"id": "5124349", "title": "燕东微：上半年8英寸SiN产线产能达3000片/月", "content": "燕东微在9月8日召开的2026年半年度业绩说明会上表示，公司积极卡位硅光产业创新生态，围绕光芯片与特色工艺两大方向纵深布局，成功导入多家新客户，产业化协同效应持续释放。已建成国内领先的8英寸SiN平台量产生产线，良率大幅提升。在技术突破方面，SiN波导和Si波导性能均达到业内先进水平；12英寸的超透镜项目攻克技术难关，已达到业内领先水平。量产能力方面，国内领先的8英寸SiN平台量产生产线良率大幅提升，报告期内该产线产能达3000片/月。（人民财讯）", "ctime": 1788842341, "time_str": "12:39:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260908/c679692967.shtml"}, {"id": "5124327", "title": "TrendForce集邦咨询：2026年9月电视、显示器、笔电面板价格预估持稳", "content": "TrendForce集邦咨询公布了9月面板价格趋势预测：2026年9月，电视、显示器、笔电面板价格预估持稳。（科创板日报）", "ctime": 1788842024, "time_str": "12:33:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260908/c679692911.shtml"}, {"id": "5124321", "title": "9月8日午间公告一览：海康威视高级副总经理兼董事会秘书奉玮增持10000股", "content": "海康威视公告，公司高级副总经理兼董事会秘书奉玮于2026年9月8日以自有资金通过深交所交易系统集中竞价增持公司股份10000股，增持均价32.48元/股，增持金额32.48万元。增持后持有公司股份47.95万股，占总股本的0.0052%。", "ctime": 1788841943, "time_str": "12:32:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260908/c679692894.shtml"}, {"id": "5124289", "title": "伊议长：若打击伊朗油气 美在海湾能源资产将遭报复", "content": "伊朗议会议长卡利巴夫7日警告说，如果美国打击伊朗石油和天然气资产，美国在海湾地区的能源资产将会遭到伊朗报复性打击。 卡利巴夫在社交媒体上发文称，海湾地区油气生产链“庞大、容易接近且暴露于风险之中”，美国在该地区的石油和天然气公司也面临同样风险。他警告说：“打击我们的资产，你们（美国）也会遭到打击。” 美国国防部长赫格塞思5日在社交媒体上发文称，伊朗的油轮船队“毫无防御能力”，如果伊朗袭击美国军舰，美方将摧毁伊朗油轮。(新华社)", "ctime": 1788841328, "time_str": "12:22:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260908/c679692834.shtml"}, {"id": "5124287", "title": "玻利维亚军营爆炸事故死亡人数升至9人", "content": "拉巴斯消息：玻利维亚国防部7日在社交媒体发文说，玻陆军当天在该国西部比亚查市军营爆炸事故废墟中发现第9具遗体，事故死亡人数升至9人。帖文说，救援工作仍在进行中，有关部门正在调查爆炸原因。据当地媒体报道，事故目前还造成84人受伤、5人失踪。玻利维亚警方4日晚说，比亚查市一处军营当天发生爆炸。（新华社）", "ctime": 1788841157, "time_str": "12:19:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260908/c679692800.shtml"}, {"id": "5124279", "title": "古巴称美贸易禁运造成古“创纪录”经济损失", "content": "古巴外交部长罗德里格斯7日称，美国对古巴实施的贸易禁运已造成“创纪录”的经济损失。 罗德里格斯当天主持新闻发布会，发布关于2025年3月1日至2026年2月28日美国对古巴实施贸易禁运的报告。报告显示，这期间美对古巴贸易禁运造成的经济损失达80.83亿美元，创历史新高。 罗德里格斯表示，美国对古巴实施贸易禁运加剧了古巴贫困家庭实际收入的下降和生活成本的上升。此外，能源供应的限制和对航运公司的威胁也破坏了水电供应及其他公共服务。 罗德里格斯说，古巴与美方已进行过会谈，但由于美国政府“缺乏意愿”，这些接触并未达成任何进展或成果。他同时表示，古巴愿意在国际法、主权平等和相互尊重的基础上继续对话。 美国长期对古巴实施经济、金融封锁和贸易禁运。8月25日，美国政府《联邦政府纪事》公布了美国总统特朗普于8月20日签署的总统令，把对古巴实施的《对敌贸易法》期限再次延长一年，至2027年9月14日。《对敌贸易法》是美国在1917年颁布的法律，目的是限制其与“敌国”进行贸易。古巴是目前唯一受该法制约的国家。(新华社)", "ctime": 1788840847, "time_str": "12:14:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260908/c679692678.shtml"}, {"id": "5124273", "title": "深空矩阵完成亿元级天使轮融资，鼎晖VGC、麟阁创投联合领投", "content": "9月8日，北京深空矩阵科技有限公司宣布完成亿元级天使轮融资，本轮融资由鼎晖VGC、麟阁创投联合领投，多家一线投资机构跟投。据了解，本轮融资所获资金将主要用于太空AI算力核心技术研发、“星环计划”系统工程验证及太空AI产业链生态建设。（新浪财经）", "ctime": 1788840706, "time_str": "12:11:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260908/c679692665.shtml"}, {"id": "5124257", "title": "面壁智能开源端侧语言基础模型MiniCPM5-2B", "content": "人工智能基座大模型公司面壁智能9月8日联合OpenBMB开源社区开源MiniCPM5-2B高密度端侧语言基础模型。此次开源的不止模型权重，还包括完整训练配方、强化学习框架与配套数据集。(人民财讯)", "ctime": 1788840270, "time_str": "12:04:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260908/c679692487.shtml"}, {"id": "5124251", "title": "沙特主导多国联军：也门胡塞武装袭击已造成73人受伤", "content": "当地时间8日，沙特阿拉伯主导的多国联军发言人图尔基·马利基在社交媒体上发表声明说，也门胡塞武装对沙特艾卜哈、贾赞、奈季兰等城市的民用和经济设施发动袭击，已造成包括妇女儿童在内的73名平民受伤。(央视新闻)", "ctime": 1788840218, "time_str": "12:03:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260908/c679692476.shtml"}, {"id": "5124241", "title": "港股午评：恒生指数跌0.27%，恒生科技指数跌1.1%", "content": "港股午间收盘，恒生指数跌0.27%，恒生科技指数跌1.1%。恒指港股通ETF银华（159318）跌0.61%，港股通科技ETF鹏华（159751）跌1.14%。板块方面，休闲设施、专业工程板块涨幅靠前；计算机外围设备、建筑产品Ⅲ板块跌幅靠前。个股方面，溜溜梅涨19.52%，怡俊集团控股涨12.1%，剂泰科技-P涨11.16%，今海医疗科技涨10.02%，金斯瑞生物科技涨9.03%；博泰车联跌18.51%，应星控股跌14.92%，德适-B跌10.08%，智谱跌9.97%，亮晴控股跌8.75%。", "ctime": 1788840079, "time_str": "12:01:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260908/c679692450.shtml"}, {"id": "5124225", "title": "广东省住建厅于9月8日召集房企座谈 了解新政对房企各类项目的影响", "content": "据知情人士透露，广东省住房和城乡建设厅于9月8日召集房企座谈，会议内容便是了解新政对房企各类项目的影响，及企业希望获得的政策支持、对各地实施细则的意见建议等。据了解，广东省住房和城乡建设厅召开的座谈会，将摸查各家房企已拿地尚未取得建设工程规划许可证、已取得建设工程规划许可证但尚未取得预售许可证、已取得预售许可证仍然在售的项目数量、面积、套数、分布等情况。以及，房地产发展新模式系列政策对企业以上三类项目的影响研判，包括但不限于对开发、销售、交付、资金和债务的影响，房企落实房地产发展新模式系列政策的计划和举措，希望获得的政策支持及对各地实施细则的意见建议等。（中国房地产报）", "ctime": 1788839633, "time_str": "11:53:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260908/c679692384.shtml"}, {"id": "5124221", "title": "腾达科技：核电相关业务正稳步有序推进", "content": "腾达科技9月8日在互动平台表示，公司已取得中广核集团集成供应商、中核集团合格供应商以及核能行业合格供应商等资质，核电相关业务正稳步有序推进。", "ctime": 1788839489, "time_str": "11:51:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260908/c679692343.shtml"}, {"id": "5124217", " // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
