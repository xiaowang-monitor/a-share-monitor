0265859", "content": "一品红公告，全资子公司广州一品红制药有限公司近日收到国家药品监督管理局核准签发的盐酸舍曲林口服溶液《药品注册证书》，药品批准文号为国药准字H20265859，视同通过一致性评价。", "ctime": 1788421910, "time_str": "15:51:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260903/c679564798.shtml"}, {"id": "5099711", "title": "工业和信息化部：我国建成全球领先的动力电池产业体系", "content": "工业和信息化部相关负责人今天（3日）表示，动力电池是推动产业绿色低碳转型、实现“双碳”目标的关键支撑，我国已建成全球领先的动力电池产业体系。在2026世界动力电池大会上，工业和信息化部相关负责人表示：在产业规模上，2025年我国动力电池装车量较2020年增长了十余倍，今年1至7月动力电池装车量达410.2吉瓦时，规模引领优势进一步巩固。在创新水平上，液态锂电池、钠离子电池、混合固液电池等多技术路线发展，电池安全标准升级推动电池安全质量稳步提升。在产业链上，我国已构建涵盖基础材料、电芯制造、系统集成、成套装备、回收利用等环节的全产业链体系。（央视新闻）", "ctime": 1788421908, "time_str": "15:51:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260903/c679564796.shtml"}, {"id": "5099709", "title": "贝达药业：恩沙替尼术后辅助适应症获药品注册证书，第三项适应症", "content": "贝达药业公告，公司收到NMPA签发的盐酸恩沙替尼胶囊用于间变性淋巴瘤激酶（ALK）阳性的IB期至IIIB期非小细胞肺癌患者术后辅助治疗的《药品注册证书》，审批结论批准增加该适应症，这是恩沙替尼获批的第三项适应症。", "ctime": 1788421907, "time_str": "15:51:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260903/c679564795.shtml"}, {"id": "5099701", "title": "据悉日本央行倾向于本月加息25个基点 未来步伐仍保持灵活", "content": "据报道，知情人士透露，日本央行倾向于在本月将基准利率上调0.25个百分点，以应对价格上涨的风险，并将在未来加息步伐上保持灵活性。(第一财经)", "ctime": 1788421847, "time_str": "15:50:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260903/c679564770.shtml"}, {"id": "5099681", "title": "马斯克为美国中期选举关键竞选投入首批资金", "content": "埃隆 马斯克的超级政治行动委员会在当地时间周三晚间公布的申报文件中，披露了其针对 2026 年中期选举的首批独立支出，这笔约 80 万美元的资金将投入多场关键的参众两院竞选。马斯克旗下的 “美国政治行动委员会” 把目标对准多场关键参议院席位角逐，涉及得克萨斯州、缅因州、俄亥俄州、新罕布什尔州、艾奥瓦州、密歇根州以及阿拉斯加州。资金投入规模最大的是得克萨斯州，金额超过 24.7 万美元。马斯克的政治行动委员会还向八场众议院竞选投入了近 9 万美元。据报道，马斯克已考虑通过其政治行动委员会至少投入 1 亿美元，助力共和党角逐今年的中期选举，但完整的资金投放规模目前尚不明确。", "ctime": 1788421674, "time_str": "15:47:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260903/c679564606.shtml"}, {"id": "5099665", "title": "外交部：敦促日本当政者倾听重视国内理性声音", "content": "9月3日，外交部发言人郭嘉昆主持例行记者会。有记者问：中日友好议员联盟正考虑本月派遣由年轻议员组成的代表团访华。请问中方对此持何种态度？\n\n郭嘉昆表示，日本国内一些有识之士对当前中日关系深感忧虑，希望为改善双边关系作出努力。只要能够恪守中日四个政治文件、奉行对华友好、珍视中日关系，我们都愿同他们沟通交流，增进相互理解与信任。我们敦促日本当政者倾听重视国内理性声音，以实际行动为中日正常交流创造必要条件。(央视新闻)", "ctime": 1788421559, "time_str": "15:45:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260903/c679564408.shtml"}, {"id": "5099655", "title": "乘联分会：初步统计8月全国乘用车市场零售162.6万辆 同比去年8月同期下降19%", "content": "乘联分会消息，初步统计，8月1-31日，全国乘用车市场零售162.6万辆，同比去年8月同期下降19%，较上月同期增长11%，今年以来乘用车累计零售1,179.9万辆，同比下降20%；8月1-31日,全国乘用车厂商批发236.9万辆，同比去年8月同期下降5%，较上月同期增长5%，今年以来乘用车累计批发1,717.9万辆，同比下降5%。", "ctime": 1788421492, "time_str": "15:44:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260903/c679564383.shtml"}, {"id": "5099649", "title": "外交部：中委合作与第三方无关 更不应受第三方干扰", "content": "9月3日，外交部发言人郭嘉昆主持例行记者会。有记者就中国与委内瑞拉合作提问。郭嘉昆表示，中国和委内瑞拉的合作受到国际法和两国法律保护，与第三方无关，更不应该受到第三方干扰。中国在委内瑞拉的合法权益必须得到保护。（央视新闻）", "ctime": 1788421406, "time_str": "15:43:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260903/c679564306.shtml"}, {"id": "5099641", "title": "外交部正告日本右翼势力：坚持和平发展才是正道", "content": "针对日本防卫省2027财年预算概算要求总额再创历史新高，外交部发言人郭嘉昆9月3日在例行记者会上答问时表示，长期以来，日本右翼势力妄图为侵略历史翻案，挣脱战后国际安排与国际义务。“我们正告日本右翼势力，日本恪守国际义务、彻底清算军国主义遗毒、坚持和平发展才是正道。”(新华社)", "ctime": 1788421315, "time_str": "15:41:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260903/c679564265.shtml"}, {"id": "5099639", "title": "外交部：西沙群岛是中国固有领土，不存在任何争议", "content": "外交部发言人郭嘉昆主持9月3日例行记者会。有记者提问称，据报道，越南外交部发言人近日发表声明称，越南对西沙群岛拥有主权，未经越方允许，外国在包括羚羊礁和鸭公岛在内西沙群岛的一切活动完全非法无效，已就此提出严正交涉，要求立即停止相关活动，确保不再发生。中方对此有何评论？\n\n郭嘉昆表示：西沙群岛是中国固有领土，不存在任何争议。中国在自己的领土上开展必要建设是主权范围内的事，越方无权说三道四。(环球网)", "ctime": 1788421301, "time_str": "15:41:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260903/c679564260.shtml"}, {"id": "5099599", "title": "日中友好议员联盟考虑派遣由日本朝野年轻议员组成的代表团访华，外交部回应", "content": "外交部发言人郭嘉昆主持9月3日例行记者会。有记者提问称，日中友好议员联盟正考虑于本月派遣一个由日本朝野年轻议员组成的代表团访华。请问中方如何看待这一动作？对此次访问有何期待？\n\n郭嘉昆表示：日本国内一些有识之士对当前中日关系深感忧虑，希望为改善双边关系做出努力。只要能够恪守中日四个政治文件，奉行对华友好，珍视中日关系，我们都愿同他们沟通交流，增进相互理解与信任。我们敦促日本当政者倾听重视国内理性声音，以实际行动为中日正常交流创造必要条件。(环球网)", "ctime": 1788421167, "time_str": "15:39:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260903/c679564191.shtml"}, {"id": "5099587", "title": "澜起科技：CXL3.2芯片导入三星SK海力士 PCIeSwitch年内流片", "content": "澜起科技发布投资者关系活动记录表公告，公司7月在业界率先试产CXL3.2MXC芯片并成功导入三星、SK海力士下一代CXL产品，预计2027年进入CXL规模商用元年。PCIeSwitch芯片预计年内完成工程样片流片，PCIe6.x/CXL3.xRetimer芯片已完成量产版本流片并列入PCI-SIG供应商名录，计划今年完成PCIe7.0Retimer及以太网PHYRetimer芯片工程样片流片。DDR5第六子代RCD芯片已送样，支持速率达9200MT/s，第五子代开始规模出货，第三四子代合计出货占比突破50%。第二子代MRCD/MDB芯片处于规模试用阶段，大规模上量需等待新一代CPU明年量产。时钟芯片已收到量产订单，高精度RTC芯片预计下半年完成工程样片流片。AI服务器CPU配置比例提升将带动内存模组及互连芯片需求增长。", "ctime": 1788421093, "time_str": "15:38:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260903/c679564162.shtml"}, {"id": "5099573", "title": "商务部：中欧各层级磋商不能单方面提要价 谈条件", "content": "商务部3日举行例行新闻发布会，新闻发言人黄玲在回应欧盟委员会贸易与经济安全委员谢夫乔维奇涉中欧贸易言论时强调，中欧各层级磋商应坚持稳定、平衡的中欧关键贸易伙伴关系定位，坚持平等解决彼此关切，不能单方面提要价、谈条件，甚至动辄以关闭市场做要挟。黄玲强调，中方已多次重申，欧方应正视自身面临的经贸问题，中国不是这些问题的根源，而是可以成为帮助欧方解决问题的伙伴。保护主义没有出路，合作共赢才是正道。中方愿与欧方一道在经贸领域加强常态化、机制化沟通，管控分歧，促进务实合作，推动中欧贸易向上平衡、向前发展，希望欧方坚持自由贸易，共同维护以世贸组织为核心，以规则为基础的多边贸易体制，切勿滑向保护主义的深渊。（央视新闻）", "ctime": 1788420925, "time_str": "15:35:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260903/c679564069.shtml"}, {"id": "5099561", "title": "波兰称讨论参与北约“核共享”计划 否认将在境内部署核弹头", "content": "当地时间9月3日，波兰国防部副部长帕维尔·扎莱夫斯基表示，波兰希望扩大参与北约核威慑体系，目前参与北约“核共享”框架下相关任务的议题正在讨论之中。他说，波兰希望参与和核武器运载有关的任务，这也是北约“核共享”机制的一部分。通过参与相关计划，波兰希望进一步加强在北约核威慑体系中的作用。扎莱夫斯基表示，这是波兰首次推动北约成员国考虑让波兰参与相关核武器运载任务。但他同时强调，目前并没有在北约现有部署地点之外部署核弹头的议题。北约“核共享”机制是北约核威慑体系的重要组成部分，部分欧洲北约成员国参与相关安排。（央视新闻）", "ctime": 1788420842, "time_str": "15:34:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260903/c679564016.shtml"}, {"id": "5099553", "title": "联合国呼吁限制全球升温超1.5摄氏度的幅度和时间", "content": "联合国环境规划署2日发布报告说，全球升温幅度在未来数年超过1.5摄氏度阈值恐难避免。报告呼吁采取措施，限制升温超出该阈值的幅度和持续时间，推动其尽快回落至1.5摄氏度以内。\n\n报告警告说，升温幅度超过1.5摄氏度，可能导致极端天气加剧、生态系统受损，威胁人类健康与社会经济发展。目前最乐观的预测显示，全球升温幅度达到峰值时，气温较工业化前水平高出1.8摄氏度。(新华社)", "ctime": 1788420677, "time_str": "15:31:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260903/c679563939.shtml"}, {"id": "5099499", "title": "上海首批算力生态合作伙伴公布", "content": "记者获悉，上海市数据局、上海市通信管理局近日公布2026年第一批算力生态合作伙伴名单。经专家评审，共有38家单位入选，其中算力供给方12家、算力应用方18家、平台共建方8家，覆盖通信、云计算、芯片、数据中心、人工智能、医疗、交通、物流、文化传媒等领域，优刻得、天数智芯、节约星辰、连尚集团等企业入围。（南方财经）", "ctime": 1788420358, "time_str": "15:25:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260903/c679563734.shtml"}, {"id": "5099447", "title": "商务部回应美利用G20炒作所谓“经济失衡”论调", "content": "在商务部3日举行的例行新闻发布会上，商务部新闻发言人黄玲在回应美国财政部长贝森特近日涉华言论的有关提问时说，中方认为，利用G20等多边机制场合炒作所谓“经济失衡”和“产能过剩”等论调，其实质是推行保护主义，为对华施压限制找借口，中方对此坚决反对。这只会扰乱全球经贸秩序，损害全球经济健康发展。各国应坚持多边主义，加强政策沟通协调，扩大开放合作，共同维护稳定畅通的全球产供链，推动实现互利共赢。（新华社）", "ctime": 1788420135, "time_str": "15:22:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260903/c679563621.shtml"}, {"id": "5099427", "title": "商务部：敦促法方立即停止反超快时尚法实施", "content": "商务部新闻发言人黄玲在3日举行的例行新闻发布会上回应关于法国反超快时尚法生效实施的提问时说，此前中方已阐明立场，该法假借制定所谓“环保”和“可持续”标准之名，采取双重标准的做法，涉嫌违反世贸组织非歧视原则。黄玲表示，中方敦促法方立即停止反超快时尚法的实施，通过平等对话的方式，妥善解决双方在可持续纺织贸易领域的分歧，为中资企业营造公平、非歧视的市场环境。如法方一意孤行，中方将采取必要措施，维护中资企业正当权益，由此产生的一切后果由法方承担。（央视新闻）", "ctime": 1788419832, "time_str": "15:17:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260903/c679563413.shtml"}, {"id": "5099385", "title": "墨西哥外长贝拉斯科将访华", "content": "外交部发言人宣布：应中共中央政治局委员、外交部长王毅邀请，墨西哥外长贝拉斯科将于9月6日至7日对中国进行访问。(央视新闻)", "ctime": 1788419635, "time_str": "15:13:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260903/c679563338.shtml"}, {"id": "5099365", "title": "国家疾控局：流感等学校常见传染病疫情风险有所上升", "content": "国家疾控局今天举行新闻发布会，主题是“科学防病开学季 健康护航新学期”。国家疾控局新闻发言人席晶晶通报了近期重点传染病疫情形势分析和健康风险提示。暑热收，秋意浓，季节交替，传染病流行态势随之变化。南方省份媒介伊蚊持续活跃，登革热、基孔肯雅热等蚊媒传染病仍处于流行季节。全国新冠疫情已连续3周下降，流感疫情在较低流行水平波动，肠道传染病疫情总体呈较低水平。同时，现在已进入金秋开学季，莘莘学子重返校园，受人员集中、环境转换、作息调整等因素影响，流感、诺如病毒感染、手足口病等学校常见传染病疫情风险有所上升。（央视新闻）", "ctime": 1788419531, "time_str": "15:12:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260903/c679563302.shtml"}, {"id": "5099351", "title": "科技巨头G20聚焦AI发展：AI带动就业 数据中心是核心", "content": "Anthropic联合创始人汤姆·布朗称：“我们正在见证人类历史上前所未有的大规模产业建设浪潮，其规模甚至超过19世纪的铁路建设。” 英伟达首席执行官黄仁勋同样呼吁各国投资AI基础设施。 AI对就业的影响同样是本次会议重点议题。一项盖洛普民调显示，79%的美国民众认为未来十年人工智能将造成岗位缩减，仅有6%认为AI会增加就业机会。 但参会科技企业高管提出，AI已经在多个行业带动招聘，尤其集中在基础设施建设相关领域。 在与卢特尼克的对话环节中，黄仁勋表示，AI投资正在为各行各业创造大量就业岗位。 “如今AI正在几乎所有行业催生新岗位，从芯片晶圆厂、计算机工厂再到AI算力工厂。我们创造的岗位数量达数十万。仅今年，我们计划在美国基础设施领域投入接近1万亿美元，这将带来巨大的经济增长，当然也会创造海量就业。” 奥特曼补充道：“我认为这将迎来全球创业与小微企业发展史上最大的繁荣周期。”", "ctime": 1788419443, "time_str": "15:10:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260903/c679563265.shtml"}, {"id": "5099273", "title": "工信部熊继军：支持各方聚力突破全固态电池、钠离子电池 // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
