const NEWS     = [{"id": "4585759", "title": "商务部部长助理张力会见沙特国际电力和水务公司董事长阿布纳扬", "content": "6月23日，商务部部长助理张力在京会见沙特国际电力和水务公司董事长阿布纳扬。双方重点就加强承包工程、双向投资合作进行交流。张力表示，近年来两国全面战略伙伴关系深入发展，中沙经贸合作取得丰硕成果。中方欢迎沙特国际电力和水务公司等沙方企业充分利用中国“十五五”时期的广阔机遇，持续扩大对华投资。中方赞赏沙特国际电力和水务公司与中国企业间的良好伙伴关系，希望双方继续深化新能源、电力、海水淡化等领域合作。阿布纳扬赞赏中国经济取得的巨大成就和为全球发展作出的积极贡献，表示沙特国际电力和水务公司将持续加强与中国企业合作，共同实施更多工程、双向投资领域项目，促进双边经贸关系发展。（商务部）", "ctime": 1782295015, "time_str": "17:56:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260624/c677684514.shtml"}, {"id": "4585747", "title": "商务部：发挥举报对出口管制违法违规行为的监督作用是国际通行做法", "content": "有记者问：我们注意到商务部发布公告，进一步完善战略矿产两用物项出口管制违法违规行为举报处理工作，请问有什么考虑？ 答：《中华人民共和国出口管制法》第三十一条规定，对涉嫌违法违规行为，任何组织和个人有权向国家出口管制管理部门举报。进一步做好战略矿产两用物项举报处理工作，提升执法能力，是完善出口管制体系的基本要求，也是维护国家安全和利益的正常举措。同时，发挥举报对出口管制违法违规行为的监督作用是国际通行做法，世界许多国家都有相关规定，借鉴各国经验完善我国战略矿产两用物项出口管制举报制度，可以有效避免相关物项被用于非法用途，更好维护世界和平，展现中国作为负责任大国担当。此前，我们已就举报处理工作开展了相关实践，有必要进一步明确举报方式和内容等，更好进行线索处置。后续，相关部门将依法依规开展举报处理工作，保障合规贸易企业的合法权益。（商务部）", "ctime": 1782294811, "time_str": "17:53:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260624/c677684351.shtml"}, {"id": "4585741", "title": "法国西部高温致约6.8万户家庭停电", "content": "法国西部菲尼斯泰尔省政府24日说，受高温天气影响，23日晚该省南部一处变电设备发生事故，导致约6.8万户家庭停电。（新华社）", "ctime": 1782294744, "time_str": "17:52:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260624/c677684312.shtml"}, {"id": "4585739", "title": "全国首个一站式AI HR专家平台Mavens发布", "content": "2026年6月24日，AI HR科技公司北森宣布公司将从传统“HR软件”厂商，全面升级为HR领域的“AI应用”公司，并推出国内首个一站式AI HR专家平台Mavens。（科创板日报）", "ctime": 1782294708, "time_str": "17:51:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260624/c677684298.shtml"}, {"id": "4585729", "title": "内塔尼亚胡结束贪腐案本人作证 案件将进入下一阶段", "content": "当地时间24日，以色列总理内塔尼亚胡在特拉维夫地方法院结束了其涉嫌贪腐案庭审中的本人作证。该阶段历时约一年半，共计98次庭审。当地媒体称，这被认为创下以色列刑事审判史上被告作证时间最长纪录。在结束作证前的发言中，内塔尼亚胡指责检方误导其作证，并批评执法和司法系统，称这场历时多年的调查和审判是出于政治动机、意在阻止选民选择其领导人的“政治迫害”。内塔尼亚胡称，过去这些年是“10年地狱般的生活”，虽然无法追回这段时间，但“可以还原真相”。（央视新闻）", "ctime": 1782294661, "time_str": "17:51:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260624/c677684265.shtml"}, {"id": "4585721", "title": "海螺水泥：收购海螺设计院100%股权，收购代价为人民币5.62亿元", "content": "海螺水泥公告，公司与海螺集团签订股权转让协议，以人民币5.62亿元收购海螺集团持有的海螺设计院100%股权。此次交易完成后，海螺设计院将成为海螺水泥的全资附属公司。", "ctime": 1782294582, "time_str": "17:49:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260624/c677684222.shtml"}, {"id": "4585719", "title": "中国建筑：下属子公司中建地产（新加坡）有限公司与马来西亚双威集团合作开发新加坡里峇峇利埔C地段住宅地块房地产项目", "content": "中国建筑公告，下属子公司中建地产（新加坡）有限公司与马来西亚双威集团下属子公司Sunway MCL Limited合作开发新加坡里峇峇利埔C地段住宅地块房地产项目。项目位于新加坡核心中央区里峇峇利区域，为住宅用地，总占地面积约1.15万平方米，总计容建筑面积约4.03万平方米，项目预计总投资约66.14亿元人民币。中建地产（新加坡）将与Sunway MCL按照40%:60%的股权比例成立合资项目公司实施项目开发，双方联合操盘。", "ctime": 1782294564, "time_str": "17:49:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260624/c677684209.shtml"}, {"id": "4585717", "title": "五部门联合启动工业5G独立专网试点 加速“5G+工业互联网”赋能千行百业", "content": "工业和信息化部今天（24日）联合国务院国资委等五部门共同启动工业5G独立专网试点，通过机制创新支持5G深度赋能关键行业领域。工业5G独立专网是指由工业企业主导建设接入网、核心网等关键设施，可不依赖于公共网络独立运行的企业专属5G网络。试点工作将支持原材料、装备制造、消费品、电子信息、国防科技、能源交通等行业领域的大型特大型企业建设独立专网，鼓励“5G+工业互联网”融合应用城市试点率先开展独立专网建设工作。专家指出，目前，基础电信运营商主要通过在5G公共网络上划分专用传输通道、构建虚拟专网，或将部分公网设备下沉到生产现场、构建混合专网的“公网专用”方式推动工业企业网络化改造。工业5G独立专网在此基础上通过“专网专用”方式更好地满足装备制造、交通运输、能源电力等领域企业生产数据不出厂、网络资源专属专用等关键需求，加速“5G+工业互联网”赋能千行百业。（央视新闻）", "ctime": 1782294557, "time_str": "17:49:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260624/c677684205.shtml"}, {"id": "4585713", "title": "习近平在山东德州考察", "content": "中共中央总书记、国家主席、中央军委主席习近平24日在山东省德州市考察时强调，农业农村现代化关系中国式现代化全局和成色，要以扎实举措做好各项工作，着力提升农业综合生产能力和质量效益，确保粮食等重要农产品稳定供给，因地制宜推进宜居宜业和美乡村建设，引导广大农民群众用勤劳和智慧创造更加美好生活。（央视新闻）", "ctime": 1782294544, "time_str": "17:49:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260624/c677684190.shtml"}, {"id": "4585709", "title": "东阳光：控股子公司东莞云智算与秦阳公司签署预计不超过2亿元的IDC服务合同", "content": "东阳光公告，公司控股子公司东莞云智算与关联方庆阳秦阳信息科技有限公司签署《IDC服务合同》，预计12个月内采购相关IDC服务项目费用合计不超过2亿元。此次交易构成关联交易，但不构成重大资产重组。交易已获董事会审议通过，无需提交股东会审议。", "ctime": 1782294451, "time_str": "17:47:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260624/c677684141.shtml"}, {"id": "4585705", "title": "万泰生物：水痘减毒活疫苗上市许可申请获得受理", "content": "万泰生物公告，近日，全资子公司北京万泰生物药业有限公司收到国家药品监督管理局药品审评中心下发的水痘减毒活疫苗上市许可申请的《受理通知书》。药品名称为水痘减毒活疫苗，剂型为注射剂，规格为复溶后每瓶0.5ml。每1次人用剂量为0.5ml，含水痘-带状疱疹活病毒应不低于3.3lgPFU。水痘减毒活疫苗从上市许可申请获得受理到获批上市，还需经历比较长的周期，短期内不会对公司的财务状况、经营业绩产生重大影响。", "ctime": 1782294402, "time_str": "17:46:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260624/c677684126.shtml"}, {"id": "4585703", "title": "珠海免税中标满洲里公路口岸进境免税店经营权", "content": "近日，珠免集团旗下珠海市免税企业集团有限公司（简称“珠海免税”）成功中标满洲里公路口岸进境免税店经营权。此次中标，是继鄂尔多斯伊金霍洛国际机场出境免税店后，珠海免税在内蒙古自治区落地的首个陆路口岸免税项目。投入运营后，项目将进一步完善满洲里公路口岸商业配套功能，为跨境往来旅客提供更加便捷、多元的免税消费服务。（人民财讯）", "ctime": 1782294350, "time_str": "17:45:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260624/c677684097.shtml"}, {"id": "4585683", "title": "丰立智能：向特定对象发行股票申请获同意", "content": "丰立智能公告，公司收到中国证券监督管理委员会出具的《关于同意浙江丰立智能科技股份有限公司向特定对象发行股票注册的批复》（证监许可〔2026〕1492号），同意公司向特定对象发行股票的注册申请。本次发行应严格按照报送深圳证券交易所的申报文件和发行方案实施。批复自同意注册之日起12个月内有效。", "ctime": 1782294216, "time_str": "17:43:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260624/c677683978.shtml"}, {"id": "4585681", "title": "三星回应将回购价值近90万亿韩元的股票用于发放奖金：正在考虑，细节尚未确定", "content": "6月24日，三星电子在监管文件中表示，公司正考虑为支付奖金而进行股票回购，但尚未确定具体时间表和规模。三星电子称，该事项仍在讨论中，最迟一个月内另行公告。此前据报道，三星正准备回购价值近90万亿韩元的股票，以用于员工奖金发放，且可能很快公布细节。（新浪财经）", "ctime": 1782294210, "time_str": "17:43:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260624/c677683976.shtml"}, {"id": "4585679", "title": "中荣股份：首次回购0.12%公司股份，成交总金额为358.16万元", "content": "中荣股份公告，2026年6月24日，公司首次通过回购专用证券账户以集中竞价交易方式回购公司股份22.35万股，占公司总股本的0.12%，最高成交价格为16.1元/股，最低成交价格为15.99元/股，成交总金额为358.16万元（不含交易费用）。", "ctime": 1782294205, "time_str": "17:43:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260624/c677683972.shtml"}, {"id": "4585663", "title": "昀冢科技：控股子公司拟设立项目公司实施高性能多层片式陶瓷电容器生产项目，拟投资总额为15亿元", "content": "昀冢科技公告，控股子公司池州昀冢电子科技有限公司拟设立项目公司池州昀池电子有限公司为实施主体，投资高性能多层片式陶瓷电容器生产项目。本项目拟投资总额为15亿元，计划分两期进行，其中首期投资额7.5亿元，由池州昀冢及池州江南新兴产业基金合伙企业分别对项目公司增资4.5亿元、3亿元；第二期投资额预计为7.5亿元，将结合首期项目运营情况另行投资，由池州昀冢及地方国资或其指定主体分别对项目公司增资4.5亿元、3亿元。", "ctime": 1782293915, "time_str": "17:38:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260624/c677683815.shtml"}, {"id": "4585655", "title": "孟加拉国总理塔里克抵达北京", "content": "孟加拉国总理塔里克·拉赫曼于6月24日乘高铁抵达北京，开始对中国的正式访问，访华将持续至6月26日。抵京前，塔里克曾出席在大连举行的第十七届夏季达沃斯论坛。（新华社）", "ctime": 1782293755, "time_str": "17:35:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260624/c677683728.shtml"}, {"id": "4585653", "title": "法国发现输入性埃博拉病例", "content": "法国商业调频电视台24日报道，法国发现一例埃博拉病毒感染病例，患者是一名从刚果（金）返回的医生。法国总理府称，正密切关注这一情况。（新华社）", "ctime": 1782293747, "time_str": "17:35:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "ht // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
