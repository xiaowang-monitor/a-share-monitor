 "url": "https://news.10jqka.com.cn/20260812/c678893810.shtml"}, {"id": "4944015", "title": "TCL Solar签约印尼合作伙伴，将竞标开发当地大型新能源项目", "content": "8月12日，据TCL中环消息，TCL Solar已与印尼本土能源龙头PT Ares Perkasa Indonesia签署战略合作谅解备忘录（MOU）。双方将联动印尼国家级主权投资机构Danantara Indonesia组建三方联合体，共同竞标开发当地大型新能源项目。（界面新闻）", "ctime": 1786520938, "time_str": "15:48:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260812/c678893793.shtml"}, {"id": "4944009", "title": "*ST联翔：控股股东协议转让终止，因受让方未足额付款", "content": "*ST联翔公告，公司此前披露控股股东卜晓华拟以20.36元/股向金美含协议转让518.14万股股份，占公司总股本5%。本次公告显示，因受让方未能按协议约定时限足额支付股份转让价款，经双方协商，于2026年8月11日签署《股份转让终止协议》，原股份转让事项终止。", "ctime": 1786520846, "time_str": "15:47:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260812/c678893751.shtml"}, {"id": "4944005", "title": "三星、SK海力士最快本月底公布股东回报 总额或超200万亿韩元", "content": "三星电子与SK海力士或将于本月底公布历史最大规模的股东回报方案。随着人工智能（AI）驱动的存储芯片超级周期推动两家公司的现金创造能力大幅提升，市场甚至开始讨论，两家公司包括特别分红、回购并注销股票等在内的股东回报规模合计可能超过200万亿韩元。据12日消息，三星电子（005930）和SK海力士（000660）正在内部讨论上述大规模股东回报方案。如果相关程序推进顺利，最快可能于本月底公布具体方案。金融投资业界甚至有分析认为，三星电子今年的股东回报规模可能超过100万亿韩元。（新浪财经）", "ctime": 1786520793, "time_str": "15:46:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260812/c678893677.shtml"}, {"id": "4943997", "title": "苹果商店现山寨版政务APP，官方回应：相关部门正协调处理", "content": "近日，福建政务服务APP统一平台（简称“闽政通APP”）在苹果应用商店被“假冒”一事在网上引发关注。经查询发现，该假冒的APP名为“闽证通”，其在下载页依旧标注自己是“政务便民服务应用”。目前仅在苹果应用商店搜索到该APP，部分安卓平台的手机品牌应用商店均未搜索到此应用。对此，闽政通APP官方回应称，目前公司已把相关情况上报，相关部门正在协调处理，同时市民也可以直接在苹果应用商店对APP进行举报。（新黄河）", "ctime": 1786520554, "time_str": "15:42:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260812/c678893564.shtml"}, {"id": "4943995", "title": "海思科：获创新药HSK60002片临床试验批准通知书", "content": "海思科公告，公司近日收到国家药品监督管理局下发的《药物临床试验批准通知书》，2026年7月受理的HSK60002片符合药品注册有关要求，同意开展临床试验。该药为公司自主研发的口服小分子制剂，化学药品1类，拟用于炎症性疾病治疗。", "ctime": 1786520508, "time_str": "15:41:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260812/c678893535.shtml"}, {"id": "4943991", "title": "瑞安航空与谷歌云宣布达成为期五年的数据与人工智能合作", "content": "8月12日，瑞安航空公司与谷歌云宣布建立新的五年合作伙伴关系。根据协议，瑞安航空将向其网络内的35,000名员工部署谷歌云的数据和AI平台，包括GeminiEnterprise和GoogleWorkspace，以支持该航空公司到2034年实现年客运量3亿人次的目标。(界面)", "ctime": 1786520480, "time_str": "15:41:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260812/c678893493.shtml"}, {"id": "4943989", "title": "中鼎股份等成立新能源科技公司 含电子专用材料研发业务", "content": "企查查APP显示，近日，安徽中鼎碳芯新能源科技有限公司成立，法定代表人为蒋伟坚，注册资本为3000万元，经营范围包含：新材料技术推广服务；新材料技术研发；电子专用材料研发；电子专用材料制造；电池制造等。企查查股权穿透显示，该公司由中鼎股份、合肥国科碳芯科技有限公司共同持股。（人民财讯）", "ctime": 1786520435, "time_str": "15:40:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260812/c678893471.shtml"}, {"id": "4943987", "title": "春风动力：子公司累计收到美国关税及利息退回3860.79万美元", "content": "春风动力公告，公司全资子公司CFP累计收到美国关税及利息退回合计3860.79万美元，按2026年8月12日汇率中间价6.79折算为人民币2.62亿元，考虑美国子公司所得税费用后预计影响公司2026年度净利润约1.83亿元，利润影响主要在2026年下半年。", "ctime": 1786520328, "time_str": "15:38:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260812/c678893425.shtml"}, {"id": "4943985", "title": "东风股份：2026年7月汽车销量7509辆，新能源销量3397辆", "content": "东风股份公告，2026年7月汽车合计产量8799辆，本年累计77704辆，累计同比增长10.18%；销量7509辆，本年累计76694辆，累计同比减少1.15%。其中新能源汽车本月产量4771辆，销量3397辆，本年累计销量21999辆，累计同比增长97.69%。东风康明斯发动机本月销量20355台。", "ctime": 1786520324, "time_str": "15:38:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260812/c678893414.shtml"}, {"id": "4943983", "title": "灵康药业：子公司产品注射用石杉碱甲中选省际联盟采购，采购周期2年", "content": "灵康药业公告，公司全资子公司灵康制药产品注射用石杉碱甲（商品名：瑞立速）中选由河南省牵头的34种药品省际联盟集中带量采购，采购周期为2年，参与省份覆盖全国多个省区市。本次中选有利于拓宽联盟内公立医院渠道，提升产品覆盖率和销售规模。", "ctime": 1786520275, "time_str": "15:37:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260812/c678893399.shtml"}, {"id": "4943979", "title": "美国撤销联邦政府设备使用TikTok禁令", "content": "据美国彭博社11日报道，美国政府已撤销一项禁止在联邦政府设备上使用短视频社交平台TikTok的指令，原因是TikTok美国业务重组后已不再构成国家安全威胁。 报道说，白宫管理和预算办公室10日在一份备忘录中撤销了这项2023年发布的指令，该指令禁止在美国联邦政府设备上使用TikTok。此前，美国司法部已出具一份书面意见，结论是TikTok不再属于相关法律中所定义的受管制应用。 2022年年底以来，美国联邦政府及多个州以所谓“数据安全”为由，禁止在政府电子设备上使用TikTok。(新华社)", "ctime": 1786520199, "time_str": "15:36:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260812/c678893368.shtml"}, {"id": "4943977", "title": "亨通光电等成立海洋科技公司", "content": "企查查APP显示，近日，江苏亨通盘达海洋科技有限公司成立，法定代表人为钱志康，注册资本为2000万元，经营范围包含：海洋工程装备制造；深海石油钻探设备制造；电线、电缆经营；海上风电相关装备销售等。企查查股权穿透显示，该公司由亨通光电旗下江苏亨通高压海缆有限公司等共同持股。（人民财讯）", "ctime": 1786520191, "time_str": "15:36:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260812/c678893364.shtml"}, {"id": "4943975", "title": "第一三共优赫得联合帕妥珠单抗新适应症在中国获批", "content": "8月12日，第一三共宣布，优赫得®（注射用德曲妥珠单抗）新适应症在中国获批，批准的适应症为：本品联合帕妥珠单抗，适用于一线治疗不可切除或转移性HER2阳性成人乳腺癌患者。德曲妥珠单抗是一款采用第一三共自主研发的技术设计的靶向HER2的抗体偶联药物（ADC），由第一三共设计，并由第一三共和阿斯利康共同开发和商业化。（界面新闻）", "ctime": 1786520174, "time_str": "15:36:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260812/c678893342.shtml"}, {"id": "4943973", "title": "吉尔吉斯斯坦发生5.2级地震 震源深度10公里", "content": "中国地震台网正式测定：8月12日15时14分，在吉尔吉斯斯坦（北纬42.02度，东经75.45度）发生5.2级地震，震源深度10公里。(央视新闻)", "ctime": 1786520130, "time_str": "15:35:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260812/c678893319.shtml"}, {"id": "4943953", "title": "北京发布2026年第十轮拟供商品住宅用地清单", "content": "8月12日，北京市规划和自然资源委员会网站发布了2026年第十轮拟供应商品住宅用地清单，涉及丰台区岳各庄地块，土地面积约6.61公顷，建筑规模14.15万平方米，拟于近期供应。本轮清单项目信息如下：丰台区岳各庄村A区棚户区改造土地开发项目DC-L02地块，位于丰台区六里桥街道，三环至四环之间，邻近地铁9号线、10号线换乘站六里桥站。周边有千禧购物中心、银座和谐广场、解放军总医院第五医学中心（北院区）、万丰公园、岳各庄城市休闲森林公园等生活配套设施。（界面新闻）", "ctime": 1786519776, "time_str": "15:29:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260812/c678893104.shtml"}, {"id": "4943949", "title": "7月深圳新房销售同比涨超30% 限购放松后外地客翻倍增长 业内：看好金九银十市场行情", "content": "7月深圳楼市淡季不淡。数据显示，7月全市新建商品住宅成交2664套，同比上涨32.5%。记者实地走访深圳多个在售新盘，楼盘工作人员向记者表示，自4·29核心区限购放开后，异地客群大量涌入，外地购房客户占比从往年不足10%，攀升至20%以上且持续增长，同时，公寓楼盘也接近售罄状态。还有项目开盘就卖了四成，三个半月销售近120套住宅。业内人士表示，市场普遍看好即将到来的金九银十传统销售旺季。（第一财经）", "ctime": 1786519557, "time_str": "15:25:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260812/c678893044.shtml"}, {"id": "4943947", "title": "阿联酋环球铝业拟投入约4亿美元修复冶炼厂", "content": "8月12日，阿联酋环球铝业公司（EGA）发表声明称，公司正在继续执行阿尔塔维拉冶炼厂的修复计划。该工厂曾在今年3月遭伊朗袭击，导致所有设施紧急关停。阿联酋环球铝业公司表示，目前厂区内基础公用设施已恢复。为恢复阿尔塔维拉冶炼厂的液态铝生产，该公司将逐步修复全部电解槽，截至8月11日，已有227个电解槽成功重启，占总数的18%。该公司表示，液态铝生产预计将随着电解槽的逐步修复而逐渐提升，并预计在2027年第一季度达到事故前水平。阿联酋环球铝业公司称，阿尔塔维拉恢复生产所需的资本支出预计约为15亿迪拉姆（4亿美元），大部分支出预计在2026年内发生，部分在2027年。（界面新闻）", "ctime": 1786519457, "time_str": "15:24:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260812/c678893009.shtml"}, {"id": "4943945", "title": "百诚医药旗下百伦检测中标昆药集团采购项目", "content": "近日，百诚医药旗下全资子公司杭州百伦检测技术有限公司（简称“百伦检测”）中标华润医药集团有限公司旗下昆药集团股份有限公司（简称“昆药集团”）的“基因毒性杂质评估单价框架采购项目”。本次合作聚焦于药品基因毒性杂质的评估服务。定量结构—活性关系作为国际通用的计算毒理学技术，能够依托化合物分子结构快速预判其潜在致突变性与毒性风险。在此次合作中，百伦检测将严格对标ICHM7、NMPA、FDA及EMA等国内外主流药监指导原则，为昆药集团提供涵盖工艺杂质、降解杂质与工艺残留的前置化致突变风险智能预测与分级判定，协助企业科学制定杂质控制限度。（人民财讯）", "ctime": 1786519424, "time_str": "15:23:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260812/c678892993.shtml"}, {"id": "4943943", "title": "乌克兰首都基辅市响起爆炸声", "content": "当地时间12日，乌克兰首都基辅市响起爆炸声，此前基辅拉响了防空警报。(央视新闻)", "ctime": 1786519390, "time_str": "15:23:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260812/c678892977.shtml"}, {"id": "4943931", "title": "现货白银、COMEX白银期货双双涨超2%", "content": "现货白银涨超2%，现报66.06美元/盎司。COMEX白银期货涨超2%，现报66.25美元/盎司。", "ctime": 1786518988, "time_str": "15:16:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260812/c678892833.shtml"}, {"id": "4943929", "title": "C919首条国际航线开通", "content": "8月12日15时许，由国产大飞机C919执飞的国航CA723航班从北京首都国际机场起飞，前往蒙古国首都乌兰巴托，标志着C919首条国际航线正式开通。目前，国航已运营12架C919客机，开通北京至上海、广州、香港、哈尔滨、重庆等航线，执飞超1.2万班次，安全运送旅客超162万人次。（新华社）", "ctime": 1786518967, "time_str": "15:16:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260812/c678892820.shtml"}, {"id": "4943921", "title": "阿联酋投入4亿美元维修 力争明年一季度将铝产量恢复至战前水平", "content": "阿联酋公司Emirates Global Aluminium计划在伊朗3月袭击致其主要冶炼厂停产后，于明年初恢复生产，或有助于缓解因供应短缺而价格飙升的铝市场压力。EGA表示，公司正投入4亿美元用于维修，力争在明年第一季度将产量恢复至战前水平，同时正努力加快这一进度。这将提振该地区的铝供应前景——冲突前该地区约占全球产量的10%。这家中东最大铝生产商周三在声明中称，即便产量恢复，后续发货仍将取决于霍尔木兹海峡的重新开放。自2月底美国和以色列袭击伊朗以来，这个位于波斯湾入口的关键咽喉要道基本上一直处于关闭状态。（财联社）", "ctime": 1786518816, "time_str": "15:13:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260812/c678892771.shtml"}, {"id": "4943913", "title": "沙颍河发生2026年第1号洪水", "content": "记者从水利部了解到，受降雨影响，今天12时24分，淮河中游支流沙颍河周口水文站水位涨至警戒水位，依据主要江河洪水编号规定，此次洪水编号为“沙颍河2026年第1号洪水”。（央视新闻）", "ctime": 1786518639, "time_str": "15:10:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260812/c678892726.shtml"}, {"id": "4943909", "title": "中国同辐等成立新公司 含AI及物联网业务", "content": "企查查APP显示，近日，中核辐智（北京）科技有限公司成立，经营范围包含人工智能行业应用系统集成服务；人工智能公共数据平台；人工智能应用软件开发；物联网技术服务等。企查查股权穿透显示，该公司由中国同辐、中核（浙江）科创有限公司共同持股。（人民财讯）", "ctime": 1786518535, "time_str": "15:08:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260812/c678892702.shtml"}, {"id": "4943897", "title": "中国品牌车型成尼泊尔车展亮点", "content": "“尼泊尔汽车进口商与制造商协会（NAIMA）2026年尼泊尔出行博览会”11日在尼泊尔首都加德满都开幕，汇聚全球数十个汽车品牌，面向公众展示最新车型与出行科技。中国车企展台吸引众多观众驻足。 本届展会为期6天。NAIMA主席维迪雅在开幕式上表示，本届博览会旨在为车企、技术提供商、消费者及利益相关方搭建交流平台，共同探讨出行领域发展趋势。“这不仅仅是一场车展，更是整个出行生态系统汇聚一堂的平台。” NAIMA首席执行官杜拉尔透露，有20多个参展品牌来自中国，奇瑞、五菱、东风和红旗等品牌的新车型均在现场亮相。 中国摩托车品牌张雪机车也参加了此次展会。尼泊尔汽车博主奥利在张雪机车展台向粉丝介绍与该品牌冠军赛车同系列的旗舰车型820RR。他表示，这款摩托车外观酷炫，十分吸睛。 观众塔帕对新华社记者说：“我比较了多个品牌，发现中国品牌无论在设计还是价格方面都更具吸引力。” 除车型展示外，展会期间还将举办多场学习交流活动，围绕汽车技术、出行趋势及相关行业议题展开讨论。(新华社)", "ctime": 1786518358, "time_str": "15:05:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260812/c678892540.shtml"}, {"id": "4943891", "title": "美国东部强烈风暴致2人死亡", "content": "据美国方面11日消息，美国东部地区当天遭遇强烈风暴，导致至少2人死亡，超过80万户用户断电。地方官员说，在印第安纳州，一棵大树被狂风刮倒后砸中一处民宅，造成一名4岁儿童死亡；在俄亥俄州，风暴引发的洪水导致一人死亡。另据全美停电信息网数据显示，截至美国东部时间11日午夜，伊利诺伊州、印第安纳州、俄亥俄州和肯塔基州共有超过80万户用户断电。(央视新闻)", "ctime": 1786518275, "time_str": "15:04:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260812/c678892513.shtml"}, {"id": "4943881", "title": "现货白银站上66美元/盎司", "content": "现货白银站上66美元/盎司，日内涨2.09%。", "ctime": 1786518199, "time_str": "15:03:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260812/c678892502.shtml"}, {"id": "4943871", "title": "欧洲主要股指开盘涨跌互现", "content": "欧洲主要股指开盘涨跌互现，欧洲斯托克50指数涨0.24%，英国富时100指数持平，法国CAC40指数持平，德国DAX指数涨0.18%。", "ctime": 1786518116, "time_str": "15:01:56", "stock_code": "", "stock_na   const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
