  color: var(--text-primary);

  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 20px;
  transition: all 0.2s;
}
.card:hover { background: var(--bg-card-hover); border-color: #334155; }
.badge {
  display: inline-flex; align-items: center; padding: 2px 8px;
  border-radius: 6px; font-size: 12px; font-weight: 500;

.badge-c { background: rgba(100,116,139,0.2); color: #94a3b8; }
.score-bar {
  height: 6px; border-radius: 3px; background: #1e293b; overflow: hidden;
}
.score-bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s; }
.up { color: var(--red); }
.down { color: var(--green); }
.pulse { animation: pulse 2s infinite; }
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}
.glow { box-shadow: 0 0 20px rgba(59,130,246,0.15); }
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg-primary); }

    </div>
  </div>

const NEWS     = [{"id": "4877049", "title": "燕麦科技：拟以1000万元-2000万元回购公司股份", "content": "燕麦科技公告，拟以不低于人民币1000万元（含）、不超过人民币2000万元（含）回购公司股份，回购价格不超过70元/股。回购股份将在未来适宜时机全部用于员工持股计划或股权激励，若未能在规定期限内使用完毕，尚未使用的已回购股份将予以注销。回购期限为自董事会审议通过之日起12个月内。", "ctime": 1785836565, "time_str": "17:42:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260804/c678662838.shtml"}, {"id": "4877037", "title": "丰田预计本财年净利润同比下降15.5%", "content": "日本丰田汽车公司4日上调本财年（2026年4月至2027年3月）净利润预期。不过，上调后的预期仍低于上一财年，净利润预计将连续第3年下降。丰田当天发布财报说，预计本财年净利润为3.25万亿日元，同比下降15.5%；营业利润为3.4万亿日元，同比下降9.7%。（新华社）", "ctime": 1785836356, "time_str": "17:39:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260804/c678662697.shtml"}, {"id": "4877035", "title": "国家发改委紧急安排5000万元中央预算内投资支持黑龙江洪涝灾害灾后应急恢复", "content": "近期，受强降雨影响，黑龙江多地发生洪涝灾害。8月4日，国家防灾减灾救灾委员会启动国家四级救灾应急响应。根据《国家自然灾害救助应急预案》和黑龙江省灾害损失情况，国家发展改革委紧急安排中央预算内投资5000万元，支持黑龙江省做好洪涝灾害灾后应急恢复，重点用于灾区受损道路、水利等基础设施和学校、医院等公共服务设施灾后应急恢复建设，推动尽快恢复正常生产生活秩序。（国家发改委）", "ctime": 1785836265, "time_str": "17:37:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260804/c678662664.shtml"}, {"id": "4877033", "title": "腾讯云：WorkBuddy5.0及以上版本上线「安全中心」", "content": "腾讯云宣布WorkBuddy5.0及以上版本正式上线「安全中心」。该版本中，越权操作实时拦截、删除文件自动进入回收站、修改文件可版本还原等核心管控能力默认开启。据介绍，此次上线的安全能力统一集中在「设置→安全中心」入口。用户打开WorkBuddy客户端，点击左下角头像进入“设置”页面，再点击“安全中心”，即可看见全部安全功能，并且默认开启。（界面新闻）", "ctime": 1785836220, "time_str": "17:37:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260804/c678662651.shtml"}, {"id": "4877025", "title": "阿里云：Qwen-Image-3.0正式上线千问AI平台，权威榜单国内第一", "content": "今日，阿里巴巴千问图像生成模型Qwen-Image-3.0正式上线千问AI平台，面向所有用户全部开放。旗舰版Qwen-Image-3.0-Pro与标准版Qwen-Image-3.0-Standard同时开放API，文生图0.18元/张起。API已在千问AI平台上线，海外用户可通过QwenCloud接入。在国际评测平台Arena.ai最新文生图榜单中，Qwen-Image-3.0位列国内第一。（阿里云）", "ctime": 1785836172, "time_str": "17:36:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260804/c678662627.shtml"}, {"id": "4877003", "title": "世卫组织：刚果（金）埃博拉疫情蔓延速度已超应对能力", "content": "当地时间8月4日，世界卫生组织表示，刚果（金）埃博拉疫情蔓延速度已超出应对能力，目前已成为该国历史上规模最大的疫情。截至8月1日，累计确诊病例3748例，其中1657人死亡、708人治愈。世卫组织表示，目前疫情已波及刚果（金）5个省49个卫生区，约有17000名密切接触者正在接受监测，其中超过80%能够实现每日随访。目前尚无针对本迪布焦型埃博拉病毒经证实安全有效的治疗方法、预防措施或疫苗，但及早获得治疗和支持性护理能够挽救生命。世卫组织呼吁国际社会提供更多资金和资源支持，扩大治疗能力、现场调查、安全安葬和社区防控等应对措施，并重点关注病毒当前传播区域及未来传播方向。（央视新闻）", "ctime": 1785836039, "time_str": "17:33:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260804/c678662557.shtml"}, {"id": "4877001", "title": "宁波东力：回购实施完毕，累计回购603.78万股耗资8000.06万元", "content": "宁波东力公告，公司回购方案已实施完毕，累计通过回购专用证券账户以集中竞价方式回购股份603.78万股，占公司总股本的比例为1.13%，最高成交价15.25元/股，最低成交价11.84元/股，支付资金总额为人民币8000.06万元（含交易费用）。本次回购股份将用于后期实施员工持股计划或股权激励，若未能在回购完成之后36个月内实施完毕，未使用部分将依法予以注销。", "ctime": 1785836012, "time_str": "17:33:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260804/c678662542.shtml"}, {"id": "4876999", "title": "受持续降雨影响 重庆临时停运列车12趟", "content": "记者从中国铁路成都局集团有限公司重庆车站获悉，根据气象部门预测，8月4日重庆东部、贵州东部和南部等地部分地区有持续性强降雨，为确保安全，重庆火车站临时停运列车12趟，其中重庆北站停运5趟，重庆西站停运5趟，重庆东站停运2趟。（新华社）", "ctime": 1785836001, "time_str": "17:33:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260804/c678662537.shtml"}, {"id": "4876981", "title": "南向资金今日净买入25.71亿港元 阿里巴巴-W获净买入居前", "content": "南向资金今日净买入25.71亿港元。阿里巴巴-W、华虹宏力分别获净买入约15.49亿港元、11.83亿港元；美团-W、腾讯控股分别遭净卖出12.27亿港元、7.23亿港元。", "ctime": 1785835882, "time_str": "17:31:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260804/c678662403.shtml"}, {"id": "4876971", "title": "市场监管总局深入推进双随机监管 持续规范涉企行政检查", "content": "今年上半年，市场监管部门双随机抽查企业约54万户，部门联合抽查占比27%，加快推行“扫码入企”，强化数字技术赋能，累计减少上门次数超过24万次，减少上门比例约62%，极大提高监管质效，实现无事不扰，进一步减轻企业负担。推进部门联合双随机监管与信用风险分类管理深度融合，问题发现率36%，监管的精准性、有效性显著增强。抽查结果依法及时通过国家企业信用信息公示系统公示，2026年上半年，约20万户企业因抽查发现问题被列入经营异常名录，持续筑牢市场诚信底线，经营主体合规意识显著增强。（央视新闻）", "ctime": 1785835827, "time_str": "17:30:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260804/c678662372.shtml"}, {"id": "4876959", "title": "航亚科技：预计2026年半年度净利润5000万元到5500万元，同比减少10.15%到18.32%", "content": "航亚科技公告，预计2026年半年度实现营业收入3.7亿元到3.8亿元，同比增长0.17%到2.88%；归属于上市公司股东的净利润为5000万元到5500万元，同比减少10.15%到18.32%；扣除非经常性损益的净利润4850万元到5350万元，同比减少10.02%到0.74%。上年同期净利润为6121.27万元。业绩变动主要因美元贬值带来汇兑损失增加及信用减值损失计提增加。", "ctime": 1785835791, "time_str": "17:29:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260804/c678662341.shtml"}, {"id": "4876957", "title": "伊朗总统否认辞职传闻", "content": "据伊朗伊斯兰共和国通讯社4日报道，伊朗总统佩泽希齐扬否认辞职传闻，称“我会继续任职”。 佩泽希齐扬在一场访谈节目中说：“如果我要辞职，我会正式宣布。我不会辞职，我会继续任职。”他表示，有人称伊朗政府与最高领袖立场不一致，他们的目的是以此来制造分歧。政府与军方力量“完全协调一致，我们不会把职位交给无能之人”。(新华社)", "ctime": 1785835765, "time_str": "17:29:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260804/c678662327.shtml"}, {"id": "4876945", "title": "美军被曝征集“创造性”打击伊朗方案", "content": "美国有线电视新闻网3日发表独家报道称，美军近期正在内部广泛征集“创造性且非常规”的打击伊朗方案，原因是空袭等传统打击手段效果有限，难以实现美方对伊朗军事行动的全部目标。报道援引一名知情人士的话称，美军中央司令部情报部门一名官员上周向大批军方分析师发送电子邮件，内容是“我们正寻求创造性且非常规的新方式施压和惩罚伊朗”。(新华社)", "ctime": 1785835687, "time_str": "17:28:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260804/c678662292.shtml"}, {"id": "4876937", "title": "7月广州二手住宅网签量环比小幅下降", "content": "8月4日，广州市房地产中介协会发布的数据显示，因极端天气增加消费者看房难度，7月广州市二手住宅网签套数和面积环比小幅下降0.94%和3.42%，分别为8658套、85.85万平方米，同比则分别下降7.10%和7.23%。1—7月，广州市二手住宅共网签62016套和620.72万平方米。", "ctime": 1785835601, "time_str": "17:26:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260804/c678662253.shtml"}, {"id": "4876931", "title": "高澜股份：出售东莞硅翔股权进展，签署补充协议（二）调整业绩承诺为两年累计3.9亿元", "content": "高澜股份公告，公司2026年8月3日召开第五届董事会第十五次会议，审议通过《关于出售参股公司股权暨签署〈发行股份及支付现金购买资产协议之补充协议（二）〉的议案》。本次交易为公司此前披露的拟将所持东莞硅翔16.9759%股权转让给爱克股份事项的进展。补充协议（二）将业绩承诺期由2025-2027年三年累计净利润不低于5.6亿元，修改为2026-2027年两年累计净利润不低于3.9亿元，并增加自交割日起业绩承诺及补偿义务不因不可抗力而变更、解除或终止等约定。该事项尚需提交公司股东会审议。", "ctime": 1785835555, "time_str": "17:25:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260804/c678662232.shtml"}, {"id": "4876927", "title": "一希腊货轮在霍尔木兹海峡遭袭", "content": "当地时间8月4日，希腊货轮“米诺阿先锋”号在霍尔木兹尔斯海峡阿曼一侧遭到导弹袭击，船上轮机舱被击中起火，一名船员失踪，船长发出了求救信号。（央视新闻）", "ctime": 1785835526, "time_str": "17:25:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260804/c678662219.shtml"}, {"id": "4876915", "title": "工信部：加强对道路机动车辆产品“激进式”创新设计风险隐患甄别和测试验证 加强组合驾驶辅助和自动驾驶功能安全评估", "content": "工业和信息化部装备工业一司8月4日组织道路机动车辆检验检测机构开展座谈，分析当前产品安全和检验检测工作形势，部署规范道路机动车辆检验检测行业竞争秩序、提升检验检测工作质量相关工作。会议要求，道路机动车辆检验检测机构要深入贯彻落实党中央、国务院决策部署，坚决抵制非理性竞争，严把产品检测关。一是深入开展自查，系统查找自身在道路机动车辆产品检验检测等方面存在的问题，认真做好整改工作。二是加强行业自律，聚焦主责主业，强化责任担当，加强诚信自律建设，共同维护全行业的公信力。三是守牢产品安全底线，落实样车管理、人员管理、流程管理等工作质量管控措施，加强对产品“激进式”创新设计风险隐患甄别和测试验证，加强组合驾驶辅助和自动驾驶功能安全评估。四是提升能力水平，积极参与标准法规制修订，加快构建面向智能网联汽车的测试与评价体系，加强道路机动车辆检验检测能力建设，为行业提供客观公正的信息和专业的意见。下一步，工业和信息化部将会同相关部门深入开展道路机动车辆产品生产一致性和质量提升行动，加大工作检查力度，督促指导检验检测机构落实产品安全“守门人”责任，提升检验检测工作质量，对存在问题的道路机动车辆检验检测机构实施联合惩戒，坚决守牢产品安全底线。", "ctime": 1785835441, "time_str": "17:24:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260804/c678662186.shtml"}, {"id": "4876907", "title": "中国铜箔生产商龙电华鑫IPO定价20-22美元/股 拟募资7500万美元", "content": "中国电解铜箔制造商龙电华鑫周一宣布其首次公开募股(IPO)条款。公司计划以每股20至22美元的价格发行360万股美国存托股份(ADS)，募资规模约7500万美元。现有投资者Harvest Global Capital Investments、Hithium Global及其他投资者已分别表示有意认购价值5000万美元、700万美元及3000万美元的ADS。按拟议发行价区间中点计算，该公司市值将达到约16亿美元。", "ctime": 1785835354, "time_str": "17:22:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260804/c678662140.shtml"}, {"id": "4876903", "title": "中国维和部队高标准通过联合国军事能力评估", "content": "近日，中国第24批赴黎巴嫩维和多功能工兵分队、建筑工兵分队、医疗分队先后接受联合国驻黎巴嫩临时部队（联黎部队）司令部军事能力评估，高标准通过部队部署到任务区后的首次综合能力考评。由联黎司令部7个业务部门骨干组成的专项评估组，先后深入各分队全面开展检查评估工作，通过听取工作简报、查阅软件资料、随机问询、实地查看等方式，对部队遂行任务能力进行全方位检验。经过严苛细致的核查，考评组评定三支分队各项考核指标全部达标，具备遂行联合国赋予各项任务的能力，并对我方建设成果给予高度肯定。（新华社）", "ctime": 1785835290, "time_str": "17:21:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260804/c678662116.shtml"}, {"id": "4876883", "title": "井松智能：拟以1500万元-2000万元回购公司股份", "content": "井松智能公告，拟以不低于人民币1500万元（含）且不超过人民币2000万元（含）回购公司股份，回购价格不超过33元/股（含），回购股份将全部用于员工持股计划或股权激励。回购资金来源为自有资金和股票回购专项贷款，公司已取得兴业银行股份有限公司合肥分行出具的《贷款承诺函》。", "ctime": 1785835166, "time_str": "17:19:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260804/c678662050.shtml"}, {"id": "4876879", "title": "江苏银行：2026年上半年净利润218.76亿元，同比增长8.09%", "content": "江苏银行公告，2026年上半年实现营业收入489.52亿元，同比增长9.11%；归属于上市公司股东的净利润218.76亿元，同比增长8.09%；归属于上市公司股东的扣除非经常性损益的净利润218.04亿元，同比增长8.10%。基本每股收益1.13元，加权平均净资产收益率（年化）15.72%。截至上半年末，总资产56111.02亿元，较上年末增长13.79%；不良贷款率0.81%，较上年末下降0.03个百分点；拨备覆盖率304.83%。", "ctime": 1785835162, "time_str": "17:19:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260804/c678662043.shtml"}, {"id": "4876877", "title": "金卡智能：子公司签订8.9亿元智能燃气表销售合同", "content": "金卡智能公告，公司子公司金卡哈萨克与BTS Digital签署销售智能燃气表合同，合同总金额为620.75亿坚戈（含税，折合人民币约8.90亿元），全部货物交付完成不晚于2029年6月29日。", "ctime": 1785835150, "time_str": "17:19:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260804/c678662037.shtml"}, {"id": "4876855", "title": "北京市地下空间专项规划（2025年—2035年）发布", "content": "北京市规划和自然资源委员会近日正式印发《北京市地下空间专项规划（2025年—2035年）》。作为北京市编制的首个市域层面地下空间专项规划，该规划旨在统筹地上地下空间，推动首都高质量发展，并计划到2035年将北京建成多维、安全、高效、便捷、可持续发展的立体式宜居城市。（人民财讯）", "ctime": 1785834889, "time_str": "17:14:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260804/c678661890.shtml"}, {"id": "4876851", "title": "重药控股：新增累计诉讼涉案金额12.89亿元", "content": "重药控股公告，截至本公告披露日，公司及控股子公司连续十二个月内新增尚未披露的诉讼、仲裁事项涉案金额共计12.89亿元，占公司最近一期经审计归属于母公司净资产的11.17%；其中作为原告的相关案件金额共计11.93亿元。公司及控股子公司不存在单项涉案金额超过1000万元且占最近一期经审计净资产绝对值10%以上的重大诉讼、仲裁事项。鉴于部分案件尚未开庭审理或尚未结案，其对公司本期利润或期后利润的影响存在不确定性。", "ctime": 1785834852, "time_str": "17:14:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260804/c678661879.shtml"}, {"id": "4876849", "title": "金诚信：子公司签署约1.15亿美元采矿合同", "content": "金诚信公告，公司子公司金诚信矿业建设赞比亚有限公司近日取得经合同双方签字盖章的中色非洲矿业有限公司谦比希铜矿主西矿2026年-2027年度采矿合同，工程名称为谦比希铜矿主西矿体采矿工程，工程地点位于赞比亚谦比希铜矿。合同期为2026年1月1日至2027年12月31日，总日历天数730天。本合同为单价合同，根据预计工作量暂估合同金额约1.15亿美元，最终以实际验收完成工作量及结算款为准。合同双方不存在关联关系。", "ctime": 1785834843, "time_str": "17:14:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260804/c678661872.shtml"}, {"id": "4876845", "title": "旺能环境：法院裁定受理子公司浙江立鑫破产重整申请", "content": "旺能环境公告，公司于2026年8月3日收到德清法院送达的《民事裁定书》（2025）浙0521破申36号，裁定受理对浙江立鑫新材料科技有限公司的破产重整申请。此前公司于2025年11月获法院裁定受理对浙江立鑫的预重整申请，本次裁定系预重整程序后的进一步进展。", "ctime": 1785834825, "time_str": "17:13:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260804/c678661861.shtml"}, {"id": "4876833", "title": "朝中社：美日韩“三位一体”式威胁或成亚太新危机", "content": "朝鲜军事评论员3日发表文章说，美日韩借军演强化联合作战能力，正形成“三位一体”式威胁，或成为亚太地区新的安保危机。文章说，美日韩无视域内国家安全关切，不断强化联合战争执行能力，以期占据军事优势，这种“三位一体”式威胁日益凸显。在近期举行的“环太平洋”军演中，韩国和日本承担了指挥任务，这凸显了美国通过让日韩承担更大责任，以实现在亚太地区掌握绝对军事霸权的战略企图。(新华社)", "ctime": 1785834570, "time_str": "17:09:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260804/c678661718.shtml"}, {"id": "4876831", "title": "贝莱德对金蝶国际的多头持仓比例增至8.42%", "content": "据香港交易所披露，贝莱德（BlackRock）对金蝶国际软件集团有限公司的多头持仓比例于2026年7月30日从6.77%增至8.42%。", "ctime": 1785834543, "time_str": "17:09:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260804/c678661711.shtml"}, {"id": "4876829", "title": "摩根大通对中兴通讯的多头持仓比例增至6.63%", "content": "据香港交易所披露，摩根大通（JPMorgan）对中兴通讯股份有限公司 - H股的多头持仓比例于2026年7月29日从5.84%增至6.63%。", "ctime": 1785834507, "time_str": "17:08:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260804/c678661657.shtml"}, {"id": "4876825", "title": "贝莱德对中联重科的多头持仓比例增至6.69%", "content": "据香港交易所披露，贝莱德（BlackRock）对中联重科股份有限公司 - H股的多头持仓比例于2026年7月30日从5.63%增至6.69%。", "ctime": 1785834494, "time_str": "17:08:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260804/c678661648.shtml"}, {"id": "4876821", "title": "摩根大通对地平线机器人-W的多头持仓比例增至5.11%", "content": "据香港交易所披露，摩根大通（JPMorgan）对Horizon Robotics - W的多头持仓比例于2026年7月29日从4.53%增至5.11%。", "ctime": 1785834475, "time_str": "17:07:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260804/c678661642.shtml"}, {"id": "4876785", "title": "南京证券：获准公开发行不超200亿元公司债券", "content": "南京证券公告，公司近日收到中国证监会批复，同意公司向专业投资者公开发行面值总额不超过200亿元公司债券的注册申请，该批复自同意注册之日起24个月内有效，公司在注册有效期内可以分期发行公司债券。", "ctime": 1785834209, "time_str": "17:03:29", "stock_c     el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
