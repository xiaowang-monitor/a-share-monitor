铀”的要求导致谈判破裂，他呼吁坚持美国的诉求而非以色列的立场，在仅剩的9天停火窗口期内挽回局面。肯特说，美国政府的红线始终不是“零浓缩铀”，而是“伊朗不得拥有核武器”，伊朗也同意这一点。自2003年以来伊朗从未寻求研发或获取核武器，但伊朗需要保留铀浓缩能力，这使得美伊之间的谈判具有可行性。肯特表示，当前的要务是约束以色列、达成协议、开放霍尔木兹海峡。(CCTV国际时讯)", "ctime": 1776062823, "time_str": "14:47:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260413/c675937926.shtml"}, {"id": "4217431", "title": "沪深京三市成交额超2万亿元，较上日此时缩量1514亿元", "content": "据同花顺iFinD数据，沪深京三市成交额超2万亿元，较上日此时缩量1514亿元，预计全天成交金额约2.1万亿元。截至目前，沪市成交额8526亿元，深市成交额11361亿元，北证50成交额118亿元。", "ctime": 1776062617, "time_str": "14:43:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260413/c675937838.shtml"}, {"id": "4217395", "title": "日韩股市集体收跌", "content": "日经225指数收跌0.74%，报56502.77点。韩国综指收跌0.86%，报5808.30点。", "ctime": 1776061954, "time_str": "14:32:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260413/c675937584.shtml"}, {"id": "4217367", "title": "广州海关出台11条便利措施 服务保障第139届广交会", "content": "第139届中国进出口商品交易会（以下简称“广交会”）将于4月15日至5月5日，分三期在广州举办。为服务保障第139届广交会顺利举办，做好通关监管和服务保障工作，4月13日，广州海关发布11条《支持第139届中国进出口商品交易会便利措施》（以下简称《便利措施》）。此次发布的《便利措施》分两个方面：一是巩固优化往届成熟有效的便利措施，包括支持线上办理、支持展品高效通关、便利参展人员通关、提供驻场监管服务保障、提供政策咨询服务、便利货物物品入境参展、支持进境展品享受税收优惠、支持国货出海等；二是适应新形势、新需求，将海关最新改革成果引入到服务举措中。具体包括落实出口批次检验检疫改革试点措施、优化出口化妆品监管流程、推动离境退税“一包一码”试点。（央视新闻）", "ctime": 1776061597, "time_str": "14:26:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260413/c675937439.shtml"}, {"id": "4217339", "title": "全国流感阳性率连续3周上升 流行毒株有变化", "content": "根据中国疾控中心近期发布的全国急性呼吸道传染病哨点监测情况，全国流感病毒检测阳性率连续3周上升。最新一期监测情况显示：2026年3月30日—4月5日，全国哨点医院门急诊流感样病例呼吸道样本检测阳性率前三位病原体为流感病毒（16.3%）、鼻病毒（10.0%）、副流感病毒（6.5%）。其中全国流感病毒检测阳性率有所上升，主要由于B型流感流行导致，北方省份流感病毒检测阳性率高于南方省份，5～14岁病例组高于其他年龄组。北京佑安医院感染综合科主任医师李侗曾表示，流感是冬春季高发传染病，流行季通常从每年11月持续到次年2至3月。流感病毒可以分为甲（A）、乙（B）、丙（C）、丁（D）四个型别。今年3月底4月初，流感活动再次出现上升趋势，主要流行毒株已从此前的甲型流感转变为乙型流感。（央视新闻）", "ctime": 1776061217, "time_str": "14:20:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260413/c675937276.shtml"}, {"id": "4217277", "title": "中国16家科技社团联合倡议共促全球人工智能治理", "content": "为推动全球共同促进人工智能治理，中国科协所属中国自动化学会、中国电子学会、中国计算机学会、中国人工智能学会等16家科技社团4月13日共同发布《全球人工智能治理科技社团倡议》，倡导以人为本、智能向善，推动建立开放、公正、包容、有效的全球人工智能治理体系。(新华社)", "ctime": 1776060634, "time_str": "14:10:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260413/c675937121.shtml"}, {"id": "4217257", "title": "2025年未分配利润为负值、毛利率下滑……保变电气最新回应", "content": "保变电气在2025年年报中提到，经中兴华会计师事务所（特殊普通合伙）审计，保变电气母公司2025年年初未分配利润约-54.5亿元，2025年度实现净利润1057.4万元，盈余公积弥补亏损转入3.26亿元，资本公积弥补亏损转入约39.75亿元，2025年未分配利润约为-11.39亿元。公司目前不具备分红条件。对此，保变电气相关人士独家回应中国证券报·中证金牛座记者称，未分配利润为负数，主要与公司早些年投资新能源业务亏损较大有关。目前，公司已经不再涉足与风电、多晶硅相关的新能源业务。(中证金牛座)", "ctime": 1776060338, "time_str": "14:05:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260413/c675937028.shtml"}, {"id": "4217251", "title": "ETF两市成交额超3500亿元", "content": "截至目前，ETF两市成交额报3502.38亿元，分类型来看，股票型ETF成交额993亿元，债券型ETF成交额1817.29亿元，货币型ETF成交额133.06亿元，商品型ETF成交额88.26亿元，QDII型ETF成交额285.21亿元。其中，成交额最高的非货币型ETF分别是A500ETF（563360）A500ETF（159352）香港证券ETF（513090）成交额分别为62.36亿元54.75亿元50.52亿元", "ctime": 1776060302, "time_str": "14:05:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260413/c675937010.shtml"}, {"id": "4217249", "title": "长期干旱　美国得州能源港城遭遇水荒", "content": "由于长期干旱，美国得克萨斯州一座能源港口城市当前正遭遇水荒。该市与油气产业深度绑定，缺水不仅影响居民生活，还可能重创当地炼油厂与石化工厂。(新华社)", "ctime": 1776060287, "time_str": "14:04:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260413/c675937008.shtml"}, {"id": "4217223", "title": "不得向8岁以下儿童开放 网信办发布11条网络直播打赏规定", "content": "中央网信办发布关于加强网络直播打赏规范管理的通知。其中提出，网站平台向用户提供充值打赏服务，设置榜单排名，设计互动玩法，应制定明确规则，并以直接、简洁方式公开，不得采取多次跳转、冗长条款等方式影响用户知晓。网络直播账号申请开通打赏营利权限，如有违规记录，应在处置期满3个月后，再予以开通。网络直播账号被禁言的，应同步暂停其打赏营利权限，时长为禁言期限的2至3倍。未经用户同意，网站平台不得公开展示用户充值打赏、购买礼物等消费统计数据。不得以打赏额度为唯一依据对网络主播排名、引流、推荐，或对用户进行排名。（网信办）", "ctime": 1776060222, "time_str": "14:03:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260413/c675936991.shtml"}, {"id": "4217193", "title": "中东地区官员：新一轮美伊会谈有望数日内举行", "content": "据美国方面12日消息，新一轮美国与伊朗的会谈可能在数日内举行。有中东地区官员表示，地区多国正与美国方面进行磋商，以确保延长此前宣布的为期两周的临时停火。（央视新闻）", "ctime": 1776060102, "time_str": "14:01:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260413/c675936965.shtml"}, {"id": "4217183", "title": "第六届消博会4月13日至18日在海南举办", "content": "4月13日至18日，第六届中国国际消费品博览会（以下简称“消博会”）在海南举办。本届消博会以“开放引领全球消费，创新驱动美好生活”为主题，吸引来自60多个国家和地区的超过3400个品牌参展。（人民财讯）", "ctime": 1776060091, "time_str": "14:01:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260413/c675936960.shtml"}, {"id": "4217089", "title": "京东官宣推出深蓝L06增程版", "content": "4月13日，京东宣布与深蓝汽车达成深度合作，将推出深蓝L06增程版，京东将提供新车的独家销售以及数字化购车服务。京东汽车负责人表示，国民好车2.0提供开放门店试驾和部分地区上门深度试驾的两种选择，交付也提供深蓝4S店和京东国民好车交付中心两种方式。（第一财经）", "ctime": 1776059210, "time_str": "13:46:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260413/c675936768.shtml"}, {"id": "4217085", "title": "沪深京三市成交额超1.7万亿元，较上日此时缩量1217亿元", "content": "据同花顺iFinD数据，沪深京三市成交额超1.7万亿元，较上日此时缩量1217亿元，预计全天成交金额约2.2万亿元。截至目前，沪市成交额7233亿元，深市成交额9667亿元，北证50成交额101亿元。", "ctime": 1776059114, "time_str": "13:45:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260413/c675936742.shtml"}, {"id": "4217083", "title": "CPO概念股午后持续走高，铭普光磁触及涨停", "content": "CPO概念股午后持续走高，铭普光磁触及涨停，生益电子、仕佳光子涨超10%，瑞斯康达、泰晶科技、科瑞技术、华盛昌此前封板。消息面，上周末，美股光通信龙头Lumentum首席执行官迈克尔·赫尔斯顿表示：“美国几家超大规模云厂商的资本开支规模极其庞大，而且看起来完全没有放缓的迹象。我们的产能正越来越跟不上需求。如果按目前趋势发展，再过两个季度，我们到2028年全年的产能就会彻底售罄。”赫尔斯顿认为，目前来看，这一轮行业周期至少还能维持5年左右的景气持续性。", "ctime": 1776059109, "time_str": "13:45:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260413/c675936739.shtml"}, {"id": "4217081", "title": "知情人士回应“某公募15:30下班”：仅适用于投研团队", "content": "4月13日，“某公募基金公司15:30下班”的消息引发市场关注。中国证券报 中证金牛座记者获悉，相关制度目前仅适用于其投研团队，主要是弹性管理打卡时间，15:30后打卡不再算作早退，以便于基金经理安排外出调研、路演等工作。对于这一改革的原因，有业内人士分析称，投研人员的工作以结果导向为主，且存在较多外出调研需求。调整打卡时间，将可以为投研人员营造更加灵活便利的工作氛围。(中证金牛座)", "ctime": 1776059080, "time_str": "13:44:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260413/c675936733.shtml"}, {"id": "4217063", "title": "超5万美军登陆伊朗为谣言", "content": "近日，一段军用飞机降落的视频在海外社交平台热传，视频配文称：“突发消息：超5万美军士兵及40%的美国海军力量登陆伊朗附近。这不久将变成世界大战。”视频于4月9日前后开始流传，正值美伊宣布停火、巴基斯坦筹备主持双方谈判之际。经多家媒体核查，视频实为2023年美军在加州举行飞行表演时的画面，与美伊停火毫无关联，也并非美军增兵的现场记录。(央视军事)", "ctime": 1776058665, "time_str": "13:37:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260413/c675936641.shtml"}, {"id": "4217057", "title": "硅能源板块短线拉升，京运通直线涨停", "content": "硅能源板块短线拉升，京运通直线涨停，通威股份、大全能源、合盛硅业、东岳硅材、硅宝科技等纷纷走高。消息面上，多晶硅主力合约涨停。", "ctime": 1776058539, "time_str": "13:35:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260413/c675936607.shtml"}, {"id": "4217049", "title": "A股三大指数午后全线翻红", "content": "A股三大指数午后全线翻红，全市场超2000只个股上涨。", "ctime": 1776058468, "time_str": "13:34:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260413/c675936577.shtml"}, {"id": "4217039", "title": "伊朗驻巴基斯坦大使：美伊谈判是一个过程 非单一事件", "content": "当地时间12日晚，伊朗驻巴基斯坦大使穆加达姆在社交媒体发文指出，美国和伊朗在伊斯兰堡进行的谈判是一个过程，不是单一事件，它启动了一个长期的外交进程。这一进程的目标仍然是保障伊朗人民的权利，在互信和决心的支持下，持续的接触可以带来持久的外交成果。穆加达姆指出，伊朗和美国之间的会谈是在和平、组织良好和有尊严的环境下进行的，各方都获得了同等的后勤支持，确保了对话的安全和有利氛围。美伊在伊斯兰堡的谈判于4月12日结束，双方未能达成协议。伊朗方面披露美方提出的三项“无理要求”，美方称谈判未能就“核问题”达成一致。（央视新闻）", "ctime": 1776058380, "time_str": "13:33:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260413/c675936554.shtml"}, {"id": "4217027", "title": "广期所碳酸锂主力合约大涨5%", "content": "广期所碳酸锂主力合约大涨5%，报162460元/吨。", "ctime": 1776058274, "time_str": "13:31:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260413/c675936533.shtml"}, {"id": "4217025", "title": "广期所多晶硅主力合约触及涨停", "content": "广期所多晶硅主力合约触及涨停，报34770元/吨，现涨幅为9.0%。", "ctime": 1776058252, "time_str": "13:30:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260413/c675936528.shtml"}, {"id": "4217023", "title": "媒体人说美总统听命于以色列60多年", "content": "在当地时间4月12日播出的节目中，美国媒体人塔克·卡尔森指出，美国对伊朗的战争是“应以色列的要求发动的”，目的是推翻伊朗政权、使伊朗崩溃。卡尔森称，美国总统特朗普“上了以色列的当”，发动战争后“便意识到了错误”，但又很难脱身——而这场战争的最终结果是“伊朗政权继续存在，并控制霍尔木兹海峡”，这反而让伊朗“比遭美以袭击前更强”。卡尔森表示，自1963年以来，所有美国总统基本上都按照以色列的要求行事，这伤害了美国。(CCTV国际时讯)", "ctime": 1776058238, "time_str": "13:30:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260413/c675936526.shtml"}, {"id": "4217013", "title": "多家游戏公司：宫斗等不受理系旧规，近期无监管变动", "content": "近日，关于“游戏版号审批新规：宫斗类、官斗类、棋牌类一律不受理”的相关内容在部分网络平台被传播，引起市场和行业的广泛关注。受多重因素影响，今日开盘后游戏板块持续下跌，午盘申万二级游戏Ⅱ指数下挫4.23%。记者向多家游戏公司了解到，“控制版号产品数量，宫斗类、官斗类、棋牌类一律不受理”的监管要求本是2019年的旧规定，其来源是2019年4月10日国家新闻出版署组织各地方出版主管部门召开全国游戏管理工作专题会议，通报游戏管理情况，讲解网络游戏管理工作有关规则和要求，安排部署近期网络游戏的管理工作。（21世纪经济报道）", "ctime": 1776058057, "time_str": "13:27:37", "stock_code": // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
