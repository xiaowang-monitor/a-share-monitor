60616/c677495908.shtml"}, {"id": "4534257", "title": "首创期货：美伊协议引发周一油价暴跌，周二延续跌势", "content": "从消息面来看，周一油价暴跌的核心驱动因素是美伊达成谅解备忘录的历史性突破，周二原油延续跌势。美国总统特朗普宣布美方已就结束美以对伊战争达成谅解备忘录，市场预期霍尔木兹海峡将重新开放，此前计入油价的大量地缘风险溢价迅速出清，该海峡为关键航运通道，平日处理约全球五分之一的原油供应，冲突期间令约1400万桶/日的产能被迫停产。虽然初步协议已经达成，但全面恢复石油供应仍需时日，且存在不确定性。操作上，建议空单持有。（首创期货）", "ctime": 1781590717, "time_str": "14:18:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260616/c677495752.shtml"}, {"id": "4534245", "title": "世界黄金协会：未来12个月全球央行黄金持有量将继续增加", "content": "世界黄金协会16日发布的年度央行黄金储备调查显示，89%的储备经理预计，未来12个月，全球央行的黄金持有量将继续增加。由于黄金最近已超越美国政府债券成为首要储备资产，这一结果反映出央行对黄金的需求仍将持续增长。这种信心也体现在各国央行自身的储备计划中：在接受调查的储备管理者中，有高达45%的人表示，他们预计在未来12个月内将增加自己机构的黄金持有量。此外，83%的受访者认为，五年后黄金在总储备中的占比将更高，而去年这一比例为76%。", "ctime": 1781590601, "time_str": "14:16:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260616/c677495691.shtml"}, {"id": "4534217", "title": "百货零售板块短线拉升，供销大集涨停", "content": "百货零售板块短线拉升，供销大集涨停，大连友谊此前封板，永辉超市、三江购物、百大集团、赫美集团、国芳集团等跟涨。", "ctime": 1781590475, "time_str": "14:14:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260616/c677495640.shtml"}, {"id": "4534183", "title": "巨星科技成立国际贸易公司 含可穿戴智能设备业务", "content": "企查查APP显示，近日，杭州瀚际国际贸易有限公司成立，经营范围包含：充电桩销售；新能源原动设备销售；数字文化创意技术装备销售；可穿戴智能设备销售等。企查查股权穿透显示，该公司由巨星科技全资持股。（人民财讯）", "ctime": 1781590223, "time_str": "14:10:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260616/c677495552.shtml"}, {"id": "4534069", "title": "阿里QoderWork上线“意识”功能", "content": "6月16日，阿里桌面AI助理QoderWork上线“意识”功能，集成记忆、反思、技能进化三个模块。该功能在保存对话的基础上，可主动整理和淘汰冗余信息，并将高频任务沉淀为可复用的技能。（阿里云）", "ctime": 1781589908, "time_str": "14:05:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260616/c677495376.shtml"}, {"id": "4534013", "title": "国家统计局：持续加强监测国际能源价格输入性影响", "content": "在国务院新闻办公室今天举行的新闻发布会上，国家统计局新闻发言人表示，在国际国内因素的共同作用下，今年工业品价格延续了去年下半年以来逐步回升的态势。下阶段，PPI上涨趋势是否持续？国家统计局新闻发言人对此做了分析与回应。国家统计局新闻发言人表示，从国际上看，原油价格有所回调但是仍处于高位，今年5月和上年5月相比，油气开采、石油加工、化工等行业出厂价格上涨仍然较为明显。对于国际能源价格波动对国内价格的输入性影响，我们会持续加强跟踪监测。展望下阶段，国际环境仍在复杂演变，地缘政治不确定性较多，但我国能源供给保障能力较强，进口渠道日趋多元，能源清洁化转型持续深化，应对外部市场波动具有较好基础和条件。（央视新闻）", "ctime": 1781589740, "time_str": "14:02:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260616/c677495304.shtml"}, {"id": "4533783", "title": "沪深京三市成交额超2.5万亿元，较上日此时缩量168亿元", "content": "据同花顺iFinD数据，沪深京三市成交额超2.5万亿元，较上日此时缩量168亿元，预计全天成交金额约3.0万亿元。截至目前，沪市成交额11087亿元，深市成交额13741亿元，北证50成交额174亿元。", "ctime": 1781589438, "time_str": "13:57:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260616/c677495211.shtml"}, {"id": "4533779", "title": "沪电股份股价创历史新高", "content": "沪电股份盘中股价创历史新高，现涨7.06%，报143.21元，总市值为2740.49亿元。", "ctime": 1781589433, "time_str": "13:57:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260616/c677495206.shtml"}, {"id": "4533737", "title": "金证股份：金证A8中标浙商银行国产化债券交易系统项目", "content": "近日，金证A8新一代投资交易系统中标浙商银行国产化债券交易系统项目，现一期已平稳上线。浙商银行与金证股份的本次合作主要聚焦于场内债券交易场景，助力浙商银行实现现有交易所债券交易系统与管理平台功能全量迁移，同时满足国产信创化要求。(人民财讯)", "ctime": 1781589070, "time_str": "13:51:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260616/c677495128.shtml"}, {"id": "4533731", "title": "山东新动能基金等新设创投基金 出资额20亿元", "content": "企查查APP显示，近日，山东省鲁航动能创业投资基金合伙企业（有限合伙）成立，出资额20亿元，经营范围包含：创业投资（限投资未上市企业）。企查查股权穿透显示，该企业由山东省新动能私募基金管理有限公司等共同出资。（人民财讯）", "ctime": 1781589039, "time_str": "13:50:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260616/c677495116.shtml"}, {"id": "4533729", "title": "数字人民币国际运营中心与26家直接参与者签约", "content": "在6月16日开幕的2026中国国际金融展上，数字人民币国际运营中心与包括工银亚洲在内的首批26家金融机构在沪签署直接参与者服务协议，CBETS参与者可依托CBETS的系统能力为客户提供低成本、多元化和安全高效的跨境数字支付服务，助力跨境贸易和投融资便利化与金融高水平对外开放。（上海证券报）", "ctime": 1781589029, "time_str": "13:50:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260616/c677495115.shtml"}, {"id": "4533725", "title": "lululemon致歉：已下架长城瑜伽主题活动所有相关宣传内容", "content": "6月16日，lululemon发布声明，称本次举办的长城瑜伽主题活动始终秉持致敬中华文化的初衷。lululemon高度重视社会各界的反馈。由于在相关专业认知上的局限，未能在前期充分识别潜在争议，也已充分认识到在鼓乐表演的前期策划与审核过程中，应更加审慎和周到。在此，lululemon向公众及朱一龙先生致以诚挚的歉意，并已下架所有相关宣传内容。(界面新闻)", "ctime": 1781588973, "time_str": "13:49:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260616/c677495092.shtml"}, {"id": "4533715", "title": "1—5月我国共授权发明专利37.2万件，同比增长12.1%", "content": "在国务院新闻办公室今天举行的新闻发布会上，国家统计局新闻发言人表示，新旧动能加快转换是当前经济运行的鲜明特征。今年我国在产业提质、数字赋能、绿色转型等方面取得新成效，新质生产力培育壮大，有效提升了发展的质量、韧性和可持续性。国家统计局新闻发言人表示，今年以来，我国创新成果加速涌现，各地更加注重打通科技成果转化堵点，让创新成果真正从“实验室”走向“生产线”。1—5月份我国共授权发明专利37.2万件，同比增长12.1%，一批高价值专利在智能化绿色化产业场景中加速落地。（央视新闻）", "ctime": 1781588939, "time_str": "13:48:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260616/c677495087.shtml"}, {"id": "4533697", "title": "2026中美地方合作对话会在河南郑州举行", "content": "6月16日，由中国人民对外友好协会、河南省人民政府主办的2026中美地方合作对话会在河南郑州成功举行。来自伊利诺伊、艾奥瓦、明尼苏达等美国20余个州，美国腹地中国协会、中美商会、美国大豆协会、美国大豆出口协会、美国稻业联盟、美国谷物与生物产品协会等行业协会，嘉吉、科迪华、沃尔玛等美国知名企业，哈佛、耶鲁等15所美国院校和研究机构，以及河南、辽宁、安徽、湖南、陕西五省代表共200余人出席。与会各方一致表示，将积极落实中美两国元首会晤共识，持续深化务实合作，为构建中美建设性战略稳定关系作出积极贡献。（新华社）", "ctime": 1781588809, "time_str": "13:46:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260616/c677494992.shtml"}, {"id": "4533613", "title": "5月上海浦东机场口岸跨境电商创历史新高", "content": "上海海关信息显示，今年前5个月，上海浦东机场口岸进出口跨境电商整体申报量达3.45亿票、364.15亿元，同比分别增长44.8%、10.6%。其中，5月单月进出口跨境电商申报量达8137万票、85.92亿元，同比分别增长68.4%、37.4%，均创历史新高。跨境电商出口方面，传统的塑料制品、仿真饰品、服饰鞋包和家居用品仍是主力品种，机械键盘、天文望远镜和假发等客单价较高的商品逐渐占据一定比例。进口方面，直购渠道相较保税模式客单价较高，产品以个护彩妆、时尚服饰和轻奢商品为主。游戏机、户外露营装备、运动器械等休闲娱乐商品的进口量有所提升。（第一财经）", "ctime": 1781588251, "time_str": "13:37:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260616/c677494806.shtml"}, {"id": "4533533", "title": "郑商所丙烯主力合约大跌7%", "content": "郑商所丙烯主力合约大跌7%，报7355元/吨。", "ctime": 1781587859, "time_str": "13:30:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260616/c677494680.shtml"}, {"id": "4533511", "title": "有机硅板块午后再度走高，合盛硅业涨停", "content": "有机硅板块午后再度走高，合盛硅业涨停。东岳硅材、锦华新材、宏柏新材、润禾材料跟涨。", "ctime": 1781587601, "time_str": "13:26:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260616/c677494616.shtml"}, {"id": "4533507", "title": "2026中国国际金融展在沪开幕", "content": "6月16日上午，2026中国国际金融展在上海世博展览馆开幕。中国人民银行党委委员、副行长邹澜和上海市委常委、常务副市长吴伟出席开幕式并致辞。本届金融展由中国金融电子化集团有限公司主办，以“金融强国筑根基 数智创新向未来”为主题，精心规划八大展区，形式内容特色鲜明。开幕式后，还举办了成果发布和数字人民币国际运营中心CBETS首批直接参与者签约仪式。中国金电“央行金融综合服务终端”、工商银行“数字人民币跨境电商解决方案”、交通银行“数字人民币外包内用解决方案”以及部分科技企业新品相继发布。（人民财讯）", "ctime": 1781587549, "time_str": "13:25:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260616/c677494602.shtml"}, {"id": "4533481", "title": "大湾区重点工程狮子洋通道主桥完成首套主索鞍吊装", "content": "6月14日晚，大湾区重点工程狮子洋通道的项目控制性工程、世界首座超2000米双层悬索桥——狮子洋大桥，完成主塔首套主索鞍吊装，标志着大桥施工进入工序转换关键阶段，为项目后续先导索过江、猫道架设等上部结构施工奠定基础。（央视新闻）", "ctime": 1781587222, "time_str": "13:20:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260616/c677494502.shtml"}, {"i 2:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260616/c677494114.shtml"}, {"id": "4533379", "title": "加拿大获得首份“欧洲安全行动”合同", "content": "加拿大总理马克·卡尼15日宣布，该国已获得“欧洲安全行动”框架下的首份国防合同。 根据新闻公报，总部位于蒙特利尔的国防科技企业马可尼技术获得了这份价值1000万加元（约合715万美元）的合同，将向波兰网络司令部供应加拿大制造的“猎户座”战术电台。 该项目将与波兰科技公司合作开展，涉及近100家加拿大企业，交付工作预计将从今年晚些时候开始，持续至2030年。 新闻公报称，加入“欧洲安全行动”意味着加拿大国防企业可以参与对欧洲合同的竞争，从而在本土创造就业机会。 欧盟理事会去年5月正式批准设立“欧洲安全行动”工具，为成员国采购安全与防务武器装备提供总额达1500亿欧元的金融支持。“欧洲安全行动”以利率优惠的长期贷款形式向有需求的欧盟成员国提供资金支持，35%的贷款可用于采购欧洲以外地区生产的武器零部件。 今年年初，加拿大成为首个加入“欧洲安全行动”的非欧洲国家。(新华社)", "ctime": 1781585981, "time_str": "12:59:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260616/c677494074.shtml"}, {"id": "4533365", "title": "壹连科技：斯洛伐克工厂暂无配套海外云厂商、英伟达供应链的扩产规划", "content": "壹连科技6月16日在互动平台表示，公司新增产能将服务于实际订单需求，斯洛伐克工厂暂无配套海外云厂商、英伟达供应链的扩产规划。（人民财讯）", "ctime": 1781585592, "time_str": "12:53:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260616/c677493962.shtml"}, {"id": "4533313", "title": "阿里发布首个具身大模型Qwen-Robot系列", "content": "阿里巴巴发布千问具身智能大模型Qwen-Robot系列，包含VLA操作模型Qwen-RobotManip、VLN移动模型Qwen-RobotNav和世界模型Qwen-RobotWorld三大模型。据了解，这是千问大模型家族首个完整的具身智能模型系列。（财联社）", "ctime": 1781584662, "time_str": "12:37:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260616/c677493751.shtml"}, {"id": "4533311", "title": "菲律宾南部强震已致138万人受灾", "content": "菲律宾国家减灾委发布的报告显示，8日发生的南部强震已经导致138万人受灾，有6.8万处房屋受损。基础设施方面的损失超过10亿比索，约合人民币1.1亿元。农业方面的损失超过2900万比索，约合人民币320万元。（央视新闻）", "ctime": 1781584610, "time_str": "12:36:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260616/c677493743.shtml"}, {"id": "4533263", "title": "东土科技：公司在物理AI和具身智能领域已进行系统性布局", "content": const META     = {"update_time": "2026-06-16 14:54:15", "sentiment_score": 57.47663551401869, "agents": []};

// 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
