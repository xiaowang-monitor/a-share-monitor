  padding: 20px;

}
.card:hover { background: var(--bg-card-hover); border-color: #334155; }
.badge {
  display: inline-flex; align-items: center; padding: 2px 8px;
  border-radius: 6px; font-size: 12px; font-weight: 500;
}
.badge-s { background: rgba(239,68,68,0.2); color: #ef4444; }
.badge-a { background: rgba(245,158,11,0.2); color: #f59e0b; }
.badge-b { background: rgba(59,130,246,0.2); color: #3b82f6; }
.badge-c { background: rgba(100,116,139,0.2); color: #94a3b8; }
.score-bar {
  height: 6px; border-radius: 3px; background: #1e293b; overflow: hidden;
}
.score-bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s; }
.up { color: var(--red); }
.down { color: var(--green); }
.pulse { animation: pulse 2s infinite; }
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}
.glow { box-shadow: 0 0 20px rgba(59,130,246,0.15); }

              <th class="text-left py-2 px-1">名称</th>
              <th class="text-right py-2 px-1">现价</th>

              <th class="text-right py-2 px-1">连涨</th>
            </tr>
          </thead>
          <tbody id="picks-table"></tbody>
        </table>

    </div>
  </div>
</div>

<!-- 新闻流 + 交易代理 -->
<div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
  <div class="card">

  <div class="card">

</div>

r": "12:30:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260507/c676502124.shtml"}, {"id": "4330305", "title": "抖音电商报告：国货消费延续增长态势", "content": "5月7日，抖音电商发布《2026抖音电商国货消费数据报告》显示，过去一年，抖音电商新增活跃国货商家数量同比增长47%，直播间成交额占比达到63%，年成交额过百万元的国货品牌数超1万个，年成交额过亿元的国货品牌超2000个，国货消费延续增长态势。（人民财讯）", "ctime": 1778128146, "time_str": "12:29:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260507/c676502058.shtml"}, {"id": "4330295", "title": "世界杯转播权仍未谈拢，国际足联高管计划访华", "content": "国际足联有“秘书长级别的高管”计划近期访华，世界杯版权谈判或迎转机。距离2026年美加墨世界杯开幕只剩不到40天，而中国大陆的转播权至今悬而未决。据路透社报道，FIFA正面临着一场“转播危机(broadcast crisis)”，因为除了中国大陆地区之外，全球人口第一大国印度也尚未确认任何官方转播商。据多家媒体披露，此次国际足联为中国大陆市场开出的2026年世界杯转播权报价，最初高达2.5亿至3亿美元，折合人民币约18亿至21亿元。而央视的预算可能仅在6000万至8000万美元左右，即便后来国际足联已经将报价降至约1.2至1.5亿美元，但双方的心理预期依然存在巨大差距。在这种情况下，双方至今尚未就电视转播权达成协议。（每经）", "ctime": 1778127922, "time_str": "12:25:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260507/c676502007.shtml"}, {"id": "4330293", "title": "浙江启动文旅市场治理升级三年行动", "content": "近日，浙江省文化广电和旅游厅制定《浙江文旅市场善治工程实施方案（2026-2028年）》，明确实施暖心服务焕能行动、匠心执法护航行动和安心固本强基行动。优化审批效能，全面推行“一网通办”“不见面审批”，打造审批最快、体验最优、满意度最高的政务生态；全面实施文明旅游“君子兰”行动，让文明旅游蔚然成风；聚焦旅行社违法违规、未经许可经营、在线旅游经营乱象等重点领域，严厉打击“不合理低价游”“强制购物”等旅游领域违法违规行为；以“安全生产治本攻坚年”为主线，建立健全“95431”工作机制，提升文旅行业本质安全水平等。（新浪财经）", "ctime": 1778127768, "time_str": "12:22:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260507/c676501973.shtml"}, {"id": "4330289", "title": "泰国央行行长：预计泰国今年国内生产总值增长2.1%", "content": "泰国央行行长表示，预计泰国今年国内生产总值增长2.1%，明年将达到2.6%。", "ctime": 1778127668, "time_str": "12:21:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260507/c676501950.shtml"}, {"id": "4330287", "title": "曼恩斯特成立能源公司，含储能技术服务业务", "content": "企查查APP显示，近日，深圳市卓成创新能源有限公司成立，法定代表人为彭建林，注册资本为1000万元，经营范围包含：储能技术服务；风力发电技术服务；光伏设备及元器件销售；发电机及发电机组销售；电池销售等。企查查股权穿透显示，该公司由曼恩斯特间接全资持股。（人民财讯）", "ctime": 1778127628, "time_str": "12:20:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260507/c676501946.shtml"}, {"id": "4330281", "title": "花样年控股：拟延长境外债务重组最后截止日期至6月30日", "content": "5月7日午间，花样年控股在港交所公告境外债务重组最新进展：公司预期无法及时取得所有必要的监管批准，以令重组能于现行最后截止日期（2026年5月31日）或之前完成。因此，审慎起见，公司拟根据各计划的条款，寻求计划债权人的批准，将最后截止日期由2026年5月31日延长至2026年6月30日。（界面新闻）", "ctime": 1778127159, "time_str": "12:12:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260507/c676501696.shtml"}, {"id": "4330279", "title": "30年前捐赠书画部分去向不明？天津美院回应", "content": "5月7日，天津美院再次回应康先生反映爷爷30年前捐赠的部分书画去向不明一事。天津美院工作人员称，近日学校已联系当事人康先生，其所述内容有部分不实，天津美院将针对此事发布公告。5月6日康先生提供捐赠证书显示，1996年其爷爷康建章因年事已高，无力保管，将书画捐赠。天津美院称决定将所赠列入永久性收藏。康先生称他联系美院询问去向未果。5月6日，天津美院曾对此事回应称，正在处理。（新京报）", "ctime": 1778126944, "time_str": "12:09:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260507/c676501548.shtml"}, {"id": "4330277", "title": "一季度智能消费设备制造增速亮眼 一季度我国智能手机产量近3亿台", "content": "今年一季度，在消费品以旧换新政策加力扩围、AI技术与消费产品深度融合的双重拉动下，我国智能消费设备制造发展态势向好，生产增速亮眼，成为工业经济增长的重要支撑。数据显示，一季度，我国智能手机产量2.98亿台，同比增长6.9%，服务机器人产量超440万套，同比增长2.6%。整机销售也带动了上游电子元器件产量增长。集成电路作为核心配套元器件，产量1272亿块，同比增长24.3%，为智能消费产品生产提供坚实支撑。（央视财经）", "ctime": 1778126809, "time_str": "12:06:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260507/c676501509.shtml"}, {"id": "4330271", "title": "伊朗人说美若重启战争将是愚蠢之举", "content": "5月6日，伊朗民众在德黑兰市中心集会，表达对伊朗政府的支持。有德黑兰市民表示，伊朗赢得了战争，美国对伊朗的第一次袭击是愚蠢之举，如果他们再次发动袭击，那将是又一次愚蠢之举。还有人表示，美国在战争中都未能实现的目标，更别指望能在谈判中实现。(CCTV国际时讯)", "ctime": 1778126553, "time_str": "12:02:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260507/c676501433.shtml"}, {"id": "4330269", "title": "海尔海外电器产业公司增资至10亿元", "content": "企查查APP显示，近日，海尔海外电器产业有限公司发生工商变更，注册资本增加至10亿元，经营范围变更为：家用电器制造；家用电器销售；家用电器零配件销售；日用家电零售；非电力家用器具制造等，同时，公司主要人员亦发生变更。企查查显示，该公司成立于2015年3月，法定代表人为冯海兵，由海尔智家全资持股。（人民财讯）", "ctime": 1778126518, "time_str": "12:01:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260507/c676501427.shtml"}, {"id": "4330251", "title": "阿根廷将在涉疫邮轮出发地开展啮齿动物捕捉与检测工作", "content": "阿根廷将在涉疫邮轮出发地开展啮齿动物捕捉与检测工作。阿根廷卫生部6日发布声明表示，将在汉坦病毒疫情暴发的“洪迪厄斯”号邮轮出发地、该国最南部城市乌斯怀亚开展啮齿动物捕捉与检测工作。同时，相关人员正在回溯数名荷兰公民在阿根廷和智利的行程路线。这些人员曾乘坐涉事邮轮，随后出现汉坦病毒症状。（央视新闻）", "ctime": 1778126214, "time_str": "11:56:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260507/c676501224.shtml"}, {"id": "4330249", "title": "星环聚能完成5亿元A+轮融资，累计融资超20亿元", "content": "近日，核聚变企业星环聚能完成5亿元人民币A+轮融资。至此，公司累计融资总额已超过20亿元人民币。星环聚能目前同步推进三代装置的“运行—建设—研发”体系：SUNIST-2在运行（与清华大学合作）、NTST在建设、CTRFR-1在研发。自A轮融资落地以来，公司相关核心工程事项按计划持续推进。（人民财讯）", "ctime": 1778126156, "time_str": "11:55:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260507/c676501202.shtml"}, {"id": "4330241", "title": "5月7日午间公告一览：兴蓉环境成都万兴环保发电厂三期项目3号机组完成“72+24”小时满负荷试运行", "content": "兴蓉环境公告，近日，公司全资子公司成都市兴蓉再生能源有限公司投资建设的成都万兴环保发电厂三期项目3号机组已顺利完成“72+24”小时满负荷试运行。至此，万兴三期项目的1、2、3号机组均已完成“72+24”小时满负荷试运行，实现稳定并网发电。下一步，公司将尽快完成本项目建设收尾，推动项目有序转入商业运行。", "ctime": 1778126004, "time_str": "11:53:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260507/c676501164.shtml"}, {"id": "4330233", "title": "韩国产业部长：将在对美投资法施行后公布首个投资项目", "content": "正在美国访问的韩国产业通商部长官金正官6日表示，根据韩美贸易协议推进的首个对美投资项目将于6月之后公布。金正官将在华盛顿同美国商务部部长霍华德·卢特尼克等特朗普政府高官进行韩美战略投资预备磋商，并同国会人士就对美投资、经贸事宜进行沟通。（财联社）", "ctime": 1778125634, "time_str": "11:47:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260507/c676501072.shtml"}, {"id": "4330227", "title": "马里军方披露针对政府高层袭击细节", "content": "巴马科消息：马里军方6日表示，袭击者上月使用自杀式汽车炸弹对马里过渡总统戈伊塔及已故防长的住所等目标发动袭击。 马里武装部队新闻与公共关系局官员吉布里拉·马伊加当天在首都巴马科举行的新闻发布会上说，袭击者意在对马里高层发动袭击，准备了多辆装有炸弹的汽车，其中一辆针对戈伊塔的官邸，另一辆针对已故国防和退伍军人事务部长萨迪奥·卡马拉的住所。 马伊加说，军方在事发当天迅速作出反应，控制现场局势，拆除了针对戈伊塔官邸的汽车炸弹。 4月25日，马里多地发生针对军营、机场和其他军事目标的协同袭击。一个关联“基地”组织的马里极端组织称，与分离主义武装组织“阿扎瓦德解放阵线”协同发动了此次袭击。卡马拉遭袭遇害。 马里自2012年以来安全局势持续动荡，恐怖袭击、武装冲突和族群暴力频发。近年，马里军方多次表示将持续打击境内恐怖主义和武装团伙。(新华社)", "ctime": 1778125307, "time_str": "11:41:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260507/c676501003.shtml"}, {"id": "4330223", "title": "部分银行继续收紧零售信贷风控 包括上收个贷审批权限、调整模型参数等方式", "content": "近日，记者从多家银行了解到，尽管政策层面对于鼓励消费信号不断，但出于控制风险的考量，实操中零售信贷的把控仍在趋于审慎。有银行将部分核心省会级城市支行的个贷审批权限全面上收至分行，也有银行对个贷风控模型部分参数做了调整。(财联社)", "ctime": 1778125097, "time_str": "11:38:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260507/c676500954.shtml"}, {"id": "4330207", "title": "内塔尼亚胡：几乎每天和特朗普通话 伊朗：美国需与以色列划清界限", "content": "以色列总理府6日晚间发表声明说，以总理内塔尼亚胡当天召集安全内阁开会时说，以色列正与美国保持沟通，双方共同目标包括移除伊朗所有浓缩铀材料、消除伊朗铀浓缩能力。内塔尼亚胡称他“几乎每天都与美国总统特朗普通电话”，双方团队保持密切沟通，当晚他还会与特朗普通话。他称，以美之间“协调一致”，双方有共同目标，其中最重要的是移除伊朗所有浓缩铀材料，并消除伊朗铀浓缩能力。内塔尼亚胡说，特朗普相信“无论如何都能实现目标”。同时，他已下令以色列国防军和安全机构“为任何情况做好准备”。据伊朗媒体7日报道，伊朗国防部发言人礼萨·塔拉埃-尼克说，以色列必须承认伊朗人民的权利，这将为结束战事铺平道路。美国若不承认伊朗人民的权利、不与以色列划清界限、不正视现实，就无法摆脱其深陷的泥潭。(新华社)", "ctime": 1778124717, "time_str": "11:31:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260507/c676500786.shtml"}, {"id": "4330199", "title": "ETF午评：中韩半导体ETF领涨5.19%，标普油气ETF领跌5.09%", "content": "ETF午间收盘涨跌不一，中韩半导体ETF（513310）领涨5.19%，港股通信息技术ETF（526000）涨3.57%，日经225ETF（513000）涨3.56%，标普油气ETF（159518）领跌5.09%，标普油气ETF（513350）跌4.85%，煤炭ETF（515220）跌4.54%。", "ctime": 1778124694, "time_str": "11:31:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260507/c676500765.shtml"}, {"id": "4330203", "title": "ETF两市成交额2599.95亿元", "content": "截至目前，ETF两市成交额报2599.95亿元，分类型来看，股票型ETF成交额1002亿元，债券型ETF成交额894.00亿元，货币型ETF成交额126.88亿元，商品型ETF成交额47.06亿元，QDII型ETF成交额370.19亿元。其中，成交额最高的非货币型ETF分别是中韩半导体ETF（513310）中证500ETF（510500）沪深300ETF（510300）成交额分别为：86.05亿元46.26亿元42.88亿元", "ctime": 1778124689, "time_str": "11:31:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260507/c676500773.shtml"}, {"id": "4330201", "title": "A股午评：创业板指半日涨近1%，光纤、PCB等算力硬件股持续爆发", "content": "A股三大指数早盘集体上涨，截至午盘，上证指数涨0.25%，深证成指涨0.71%，创业板指涨0.98%，北证50涨2.94%。全市场成交额19991亿元，较上日缩量940亿元，全市场超3400只个股上涨。板块题材上，光纤概念、CPO、工业母机、PCB概念、光伏设备、金属新材料、先进封装、存储芯片板块涨幅居前；煤炭开采加工、油气开采及服务、能源金属、煤化工概念、化肥、磷化工、化学纤维、大豆板块跌幅居前。盘面上，光纤巨头康宁与英伟达联合宣布达成多年商业与技术合作推动板块爆发，杭电股份、炬光科技、石英股份等10余股涨停。存储芯片板块再度走高，德明利、朗科科技多股盘中创历史新高。多晶硅主连日内涨超5%，光伏设备板块同样表现积极，安彩高科封死涨停。此外，PCB、工业母机、CPO等板块均有异动。另一方面，昨日国际原油市场遭遇剧烈抛售，油气开采、能源化工板块集体走低，潜能恒信、中曼石油、昊华能源、卫星化学跌幅居前。", "ctime": 1778124662, "time_str": "11:31:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260507/c676500766.shtml"}, {"id": "4330177", "title": "长生人寿两项偿付能力充足率不达标", "content": "长生人寿近日发布2026年第一季度偿付能力报告显示，该公司一季度净亏损约3362万元；核心偿付能力充足率约45.4%、综合偿付能力充足率约55.5%，均低于监管部门要求的不低于50%及不低于100%的水平。根据监管要求，保险公司同时符合三项监管要求的，为偿付能力达标公司：一是核心偿付能力充足率不低于50%；二是综合偿付能力充足率不低于100%；三是风险综合评级在B类及以上。不符合上述任意一项要求的，为偿付能力不达标公司。报告显示，截至2026年一季度末，长生人寿净资产为负，约-4.13亿元。（上海证券报）", "ctime": 1778124471, "time_str": "11:27:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260507/c676500679.shtml"}, {"id": "4330175", "title": "港股恒生科技指数涨幅达3%", "content": "港股恒生科技指数涨幅扩大至3%，恒生指数现涨1.55%。", "ctime": 1778124430, "time_str": "11:27:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260507/c676500661.shtml"}, {"id": "4330169", "title": "港股芯片股继续拉升，壁仞科技涨超10%", "content": "港股芯片股继续拉升，壁仞科技涨超10%，华虹半导体涨超6%，纳芯微、天数智芯、爱芯元智跟涨。", "ctime": 1778124260, "time_str": "11:24:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260507/c676500606.shtml"}, {"id": "4330159", "title": "中国天眼”换了国产“眼部肌肉”", "content": "记者7日从FAST运行和发展中心获悉，被誉为“中国天眼”的500米口径球面射电望远镜（FAST）近日迎来重要时刻：6根总长近4000米、单根重达6吨多的国产巨型钢丝绳，正在“上岗”。(新华社)", "ctime": 1778124199, "time_str": "11:23:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260507/c676500594.shtml"}, {"id": "4330151", "title": "第三轮第六批中央生态环境保护督察启动", "content": "记者7日从生态环境部获悉，经党中央、国务院批准，第三轮第六批中央生态环境保护督察全面启动。 本次督察共组建7个中央生态环境保护督察组，分别对辽宁、吉林、黑龙江、广东、广西、西藏、新疆7省（区）和新疆生产建设兵团开展督察，进驻时间1个月。 督察组将坚持稳中求进工作总基调，树立和践行正确政绩观，坚持以人民为中心，坚持服务大局，坚持系统观念，坚持问题导向和严的基调，坚持精准科学依法，突出重点、较真碰硬，有序有效推进督察工作。督察组将深入贯彻落实中央八项规定及其实施细则精神，坚决落实党中央整治形式主义为基层减负有关要求。进驻期间，各督察组分别设立联系电话和邮政信箱，受理被督察对象生态环境保护方面的来信来电举报。(新华社)", "ctime": 1778124085, "time_str": "11:21:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260507/c676500557.shtml"}, {"id": "4330143", "title": "盈新发展等成立科技文化公司，含多项AI业务", "content": "企查查APP显示，近日，盈新视艺科技文化（深圳）有限责任公司成立，法定代表人为叶鹏，经营范围包含：人工智能基础软件开发；人工智能应用软件开发；智能机器人的研发；智能机器人销售；智能无人飞行器销售等。企查查股权穿透显示，该公司由盈新发展全资子公司深圳盈新数科具身智能有限公司、江西视艺科技有限责任公司共同持股。", "ctime": 1778123954, "time_str": "11:19:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260507/c676500524.shtml"}, {"id": "4330141", "title": "2026年清理整顿人力资源市场秩序专项行动部署开展", "content": "记者5月7日从人力资源社会保障部获悉，国务院就业促进和劳动保护工作领导小组办公室近日印发通知，自2026年4月至7月，在全国范围部署开展2026年清理整顿人力资源市场秩序专项行动。 本次专项行动围绕落实就业促进、劳动保障等领域相关法律法规，集中纠治侵害劳动者公平就业权益、扰乱就业市场秩序的各类突出违法行为，严格规范网络招聘秩序，强化网络招聘服务许可制度管理，规范网络招聘类信息发布；集中整治“招转培（贷）”欺诈，重点打击以招聘为名诱骗求职者参与付费培训乱象；着力整治虚假招聘，清理“央国企内推”“保录直签”等虚假招聘信息；规范劳务派遣用工，重点查处未经许可擅自经营劳务派遣、“假外包、真派遣”问题；依法纠治各类就业歧视行为。 各地区和相关部门将全面摸排本地区、本领域招聘市场风险，主动公开举报投诉渠道，面向社会征集问题线索，对查证属实的违法违规行为，坚决从严从实处置，切实维护好劳动者公平就业权益。(新华社)", "ctime": 1778123887, "time_str": "11:18:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260507/c676500500.shtml"}, {"id": "4330131", "title": "台湾四大主板制造商大幅下调出货目标", "content": "受英伟达GPU更新放缓，CPU、内存双双缺货涨价影响，台湾地区四大主板制造商华硕、技嘉、微星、华擎近日将2025年底所设下的2026全年出货目标全线大幅下调。其中，华硕将首度面临主板千万片保卫战，微星、技嘉确定跌破千万片大关，减少约25%，华擎跌幅预计将超过3成。（科创板日报）", "ctime": 1778123687, "time_str": "11:14:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260507/c676500430.shtml"}, {"id": "4330129", "title": "部分银行继续收紧零售信贷风控，包括上收个贷审批权限、调整模型参数等方式", "content": "在零售信贷不良未有逆转信号之前，商业银行的个贷业务风险偏好将变得更加保守。近日，财联社记者从多家银行了解到，尽管政策层面对于鼓励消费信号不断，但出于控制风险的考量，实操中零售信贷的把控仍在趋于审慎。有银行将部分核心省会级城市支行的个贷审批权限全面上收至分行，也有银行对个贷风控模型部分参数做了调整。一家上市银行相关管理人士日前向财联社记者表示，当前零售业务的压力依然巨大，尽管一季度末的个贷规模仍是正增长，但该行在业务管理上进行了强化和协同，即便是一线城市也是如此。“目前，我行已经将一个重点省会级城市的个贷业务全部审批权限上收。”（财联社）", "ctime": 1778123606, "time_str": "11:13:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260507/c676500408.shtml"}, {"id": "4330121", "title": "中天科技在酒泉成立储能科技公司", "content": "企查查APP显示，近日，酒泉中蓄储能科技有限公司成立，法定代表人为杜珩，注册资本为2000万元，经营范围包含：电力设施器材制造；电力电子元器件制造；光伏设备及元器件制造；储能技术服务；人工智能应用软件开发等。企查查股权穿透显示，该公司由中天科技间接全资持股。（人民财讯）", "ctime": 1778123447, "time_str": "11:10:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260507/c676500357.shtml"}, {"id": "4330115", "title": "涉疫邮轮曾前往南极 专家呼吁旅游热潮下加强南极生态保护", "content": "世卫组织证实，大西洋“洪迪厄斯”号邮轮出现汉坦病毒感染。该邮轮4月初从阿根廷南端出发前往南极地区，引发全球关注。与此同时，南极旅游热潮带来的疫病和污染风险也引发担忧。南极旅游市场规模过去30年增长10倍，2024年超8万人踏上南极洲土地，预计未来10年将达40多万人次。目前，约束南极游客行为的法律法规尚待完善。南极和南大洋联盟执行主任呼吁加强对企鹅、鲸鱼等生物的保护。（央视新闻）", "ctime": 1778123130, "time_str": "11:05:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260507/c676500272.shtml"}, {"id": "4330113", "title": "新希望在海南成立工贸发展公司", "content": "企查查APP显示，近日，新希望（海南）工贸发展有限公司成立，法定代表人为杨金彪，注册资本为1亿元，经营范围包含：食品销售；农副产品销售；食用农产品批发；饲料原料销售；石墨烯材料销售；人工智能硬件销售等。企查查股权穿透显示，该公司由新希望集团有限公司、南方希望实业有限公司共同持股。", "ctime": 1778123122, "time_str": "11:05:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260507/c676500264.shtml"}, {"id": "4330109", "title": "月之暗面申请注册“KimiClaw”商标", "content": "天眼查知识产权信息显示，近日，北京月之暗面科技有限公司申请注册多枚“KimiClaw”商标，国际分类包括科学仪器、网站服务、通讯服务等，当前商标状态均为等待实质审查。北京月之暗面科技有限公司成立于2023年4月，法定代表人为杨植麟，注册资本100万人民币，经营范围含软件开发、软件销售、人工智能基础软件开发、人工智能应用软件开发等，由杨植麟、周昕宇、吴育昕等共同持股。公开信息显示，KimiClaw是月之暗面公司于今年2月推出的云端化OpenClaw产品，支持在Kimi内直接部署。（界面新闻）", "ctime": 1778123070, "time_str": "11:04:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260507/c676500251.shtml"}, {"id": "4330107", "title": "美国市场疲软 本田叫停在加拿大建厂计划", "content": "日本媒体6日援引消息人士的话报道，鉴于目前美国市场需求疲软，日本本田汽车公司决定无限期冻结在加拿大建电动汽车工厂的计划。这一电车工厂项目原定于2028年开工，但本田去年宣布将开工日期延后两年。除电车工厂外，本田原本还计划在加建成一家电池工厂，两者总计投资150亿加元（约合110亿美元）。", "ctime": 1778123024, "time_str": "11:03:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260507/c676500239.shtml"}, {"id": "4330105", "title": "印尼考虑对16岁以下人群实施“网购禁令”", "content": "印度尼西亚政府官员6日说，正在考虑对16岁以下人群实施“网购禁令”，以避免未成年人在网购平台遭遇诈骗。(新华社)", "ctime": 1778123000, "time_str": "11:03:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260507/c676500228.shtml"}, {"id": "4330093", "title": "北京正负电子对撞机峰值亮度达到升级工程设计指标", "content": "记者今天（5月7日）从中国科学院高能物理研究所获悉，近日国家重大科技基础设施——北京正负电子对撞机（BEPCII）运行取得重要进展。通过近一年持续的束流参数优化与流强稳步提升，该大科学装置在2.35 GeV束流能量下峰值对撞亮度达到其对撞能量和取数效率升级工程的设计指标，峰值亮度和积分亮度均较升级前提升3倍以上，成功完成核心性能跨越式升级。此次在高束流能区的性能突破，为北京谱仪Ⅲ（BESIII）开辟了全新实验窗口，提供了更高精度的数据支撑。（央视新闻）", "ctime": 1778122789, "time_str": "10:59:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260507/c676500157.shtml"}, {"id": "4330091", "title": "腾讯控股港股涨超3%", "content": "腾讯控股港股涨3.02%，报476.80港元。", "ctime": 1778122777, "time_str": "10:59:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260507/c676500156.shtml"}, {"id": "4330071", "title": "美航空运营商3月航油支出环比大涨", "content": "美国交通部下辖的运输统计局6日发布的数据显示，美国航空运营商3月航空燃油总支出达50.6亿美元，环比上涨56.4%，同比上涨30.4%。 数据显示，美国3月航油总支出相比今年2月的32.3亿美元、去年3月的38.8亿美元均有大幅增长。从航油价格来看，美国3月航油价格相比2月上涨30.9%，较去年同期上涨29.9%。 有分析人士指出，中东战事引发能源价格大涨给美国航空运营商带来巨大压力。各大航空公司纷纷下调甚至完全取消2026年的业绩预期。一些航空公司还压缩了扩张计划，以降低成本。由于近期油价大幅上涨以及与联邦政府的纾困谈判失败，近年来陷于破产困境的美国廉价航空斯皮里特航空公司近日宣布，立即开始有序停止业务运营。(新华社)", "ctime": 1778122546, "time_str": "10:55:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260507/c676500093.shtml"}, {"id": "4330051", "title": "120多名外国代表齐聚2026北京香山论坛先导会举办", "content": "5月7日至9日，2026北京香山论坛先导会在北京举办，43个国家和国际组织的120多名防务官员、专家学者参会。今晚将举行欢迎晚宴。本届先导会以“全球安全治理：挑战与出路”为主题，下设4个分议题：国际秩序与国际法治、亚太安全新挑战、维护全球共同安全的责任、新兴技术军事应用风险管控。此外，本届先导会还安排了北京香山论坛20周年纪念特别专题交流活动：国际论坛在全球安全治理中的作用。(央视新闻)", "ctime": 1778122480, "time_str": "10:54:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260507/c676500069.shtml"}, {"id": "4330045", "title": "沪深京三市成交额超1.7万亿元，较上日此时缩量1010亿元", "content": "据同花顺iFinD数据，沪深京三市成交额超1.7万亿元，较上日此时缩量1010亿元，预计全天成交金额约3.0万亿元。截至目前，沪市成交额7367亿元，深市成交额9487亿元，北证50成交额149亿元。", "ctime": 1778122280, "time_str": "10:51:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260507/c676500021.shtml"}, {"id": "4330037", "title": "中证1000股指期货(IM)主力合约日内涨超1%", "content": "中证1000股指期货(IM)主力合约日内涨超1%，现报8565.8点。", "ctime": 1778122176, "time_str": "10:49:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260507/c676499981.shtml"}, {"id": "4330031", "title": "智元声明：未经授权违规销售智元产品的主体尽快自查整改", "content": "5月7日，智元创新（上海）科技股份有限公司发布关于未经授权违规销售智元产品的声明，强调对于非官方授权渠道购买的产品，后续产生的产品真伪、质量或售后纠纷，智元可能无法提供售后支持。对于尚未获得线上平台销售授权的主体，智元提醒其尽快自查整改。目前，智元在国内仅授权两家线上店铺作为官方销售渠道，分别是智元机器人京东自营旗舰店和智元机器人天猫旗舰店。", "ctime": 1778122084, "time_str": "10:48:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260507/c676499950.shtml"}, {"id": "4330027", "title": "广期所多晶硅主力合约大涨5%", "content": "广期所多晶硅主力合约大涨5%，报41155元/吨。", "ctime": 1778122004, "time_str": "10:46:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260507/c676499918.shtml"}, {"id": "4330025", "title": "英国计划接回涉疫邮轮上的本国公民", "content": "当地时间6日，英国卫生安全局发布声明表示，两名曾搭乘“洪迪厄斯”邮轮的英国乘客已返回英国，目前正进行自我隔离，均未出现相关症状。有关方面正在制定计划，待“洪迪厄斯”抵达加那利群岛后，将船上其余英国公民接返回国。不过，英国卫生安全局表示，这只有在这些人员“未出现症状的情况下”才能进行。该卫生机构在最新声明中补充道，船上英国公民目前均未报告任何症状，但他们正受到密切监测。（央视新闻）", "ctime": 1778121963, "time_str": "10:46:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260507/c676499904.shtml"}, {"id": "4330015", "title": "马克龙说已向伊朗提议法英牵头霍尔木兹海峡护航行动", "content": "法国总统马克龙6日与伊朗总统佩泽希齐扬通话后在社交媒体发文，表示向对方提议考虑由法国和英国牵头的霍尔木兹海峡多国护航行动，他同时呼吁各方“立即、无条件”解除对该海峡的封锁。\n\n马克龙在帖文中说，这一护航行动“性质中立，独立于交战各方之外”，有助于重塑船东与保险业界的信心。“我已邀请伊朗总统把握此次契机，同时计划就该议题与（美国）总统特朗普展开磋商。”\n\n马克龙在通话中就当前局势升级表示“严重关切”，谴责针对阿联酋民用基础设施及多艘船只的“无端袭击”。他表示欧洲将在霍尔木兹海峡通航及伊朗核问题等地区热点问题上发挥应有作用。\n\n另据伊朗媒体6日报道，佩泽希齐扬在与马克龙通话时表示，伊朗对美国缺乏信任，这种不信任源于美方的敌对行为。美方最近两次在谈判期间攻击伊朗，这实际上是“背后捅刀”。以色列完全没有遵守停火承诺。佩泽希齐扬说，任何关于全面重开霍尔木兹海峡的谈判，都必须涉及解除美国海军实施的封锁，这一点必须予以解决。谈判能否取得成效，取决于战争能否结束，以及能否提供充分的保障以防止敌对行动重演。(新华社)", "ctime": 1778121695, "time_str": "10:41:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260507/c676499794.shtml"}, {"id": "4330005", "title": "沪深京三市成交额超1.6万亿元，较上日此时缩量1012亿元", "content": "据同花顺iFinD数据，沪深京三市成交额超1.6万亿元，较上日此时缩量1012亿元，预计全天成交金额约3.0万亿元。截至目前，沪市成交额6920亿元，深市成交额8948亿元，北证50成交额141亿元。", "ctime": 1778121634, "time_str": "10:40:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260507/c676499782.shtml"}];

  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
