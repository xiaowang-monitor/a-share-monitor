6年上半年净利润为1.2亿元至1.56亿元，同比增长112.89%至176.75%。报告期内，在原料价格大幅上涨的前提下，通过精细化管理及经营策略的调整，使成本费用均有较大幅度下降的同时，销售单价和收入同比增长带来了利润的倍增，但是氯碱由于行情太差，拖累整体业绩。", "ctime": 1784103960, "time_str": "16:26:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260715/c678196161.shtml"}, {"id": "4727225", "title": "国家发展改革委安排3000万元支持吉林台风暴雨洪涝灾害灾后应急恢复", "content": "记者15日从国家发展改革委获悉，国家发展改革委紧急安排中央预算内投资3000万元，支持吉林省做好台风暴雨洪涝灾害灾后应急恢复，重点用于灾区受损道路、水利等基础设施和学校、医院等公共服务设施灾后应急恢复建设，推动尽快恢复正常生产生活秩序。 7月15日，国家防灾减灾救灾委员会针对第9号台风“巴威”及强降雨对吉林省造成的严重影响，启动国家四级救灾应急响应。(新华社)", "ctime": 1784103946, "time_str": "16:25:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260715/c678196156.shtml"}, {"id": "4727223", "title": "交通运输部规划研究院：第二批零碳运输廊道补贴工作已处于调研论证阶段", "content": "交通运输部规划研究院环境资源所总工程师毛宁在今日举办的第二届车能融合与智慧生态发展论坛上表示，推动新能源重卡规模化应用，应加大政策保障力度，持续推动落实老旧营运货车报废更新政策；用足用好中央预算内节能降碳专项资金对零碳运输通道的支持政策。目前交通运输部已开展首批资金补贴，正统筹谋划第二批零碳运输廊道补贴相关工作。针对第二批建设里程、参与省份、补贴适用范围及补贴比例等核心内容，均处于前期调研论证阶段。（财联社）", "ctime": 1784103936, "time_str": "16:25:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260715/c678196152.shtml"}, {"id": "4727221", "title": "激励效果明显 超2万户科技型中小企首次拿到贷款", "content": "7月15日，国务院新闻办公室举行新闻发布会，介绍2026年上半年货币政策执行和金融统计数据情况，并答记者问。会上，有关负责人介绍，目前，科技创新和技术改造再贷款总额度1.2万亿元，主要作用是激励金融机构加强对中小型科技企业和大规模设备更新的金融服务，取得了不错效果。截至今年4月末，银行发放的科技创新和技术改造贷款已达到了1.5万亿元。其中，科技创新贷款是2188亿元，有2.1万户之前没有贷款的科技型中小企业实现了首次贷款，这些企业往往是处于初创期、成长期，有了首次的贷款记录以后，后续融资就会容易很多。技术改造和设备更新贷款目前余额发放了1.3万亿元，累计为8250个重点领域设备更新项目提供了资金支持。贷款的加权平均利率约为2.7%，有效激发了投融资需求。这项工具在金融侧和产业侧都有比较好的反映，今年科技型中小企业贷款保持了20%左右的较高增长速度。据统计，前5个月，设备工器具购置投资同比增长9.3%，增速比上年同期提高了2.2个百分点。（央视新闻）", "ctime": 1784103902, "time_str": "16:25:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260715/c678196125.shtml"}, {"id": "4727219", "title": "孩子王：预计2026年上半年净利润同比增长10.00%～30.00%", "content": "孩子王公告，预计2026年1月1日至2026年6月30日净利润为正值且属于同向上升情形。预计归属于上市公司股东的净利润为1.57亿元至1.86亿元，比上年同期增长10.00%～30.00%。预计扣除非经常性损益后的净利润为1.21亿元至1.44亿元，比上年同期增长5.00%～25.00%。本报告期业绩同比增长，主要得益于公司中长期“三扩”战略的持续落地，并充分发挥丝域生物并购协同效应。", "ctime": 1784103833, "time_str": "16:23:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260715/c678196091.shtml"}, {"id": "4727211", "title": "伊朗称美军再次袭击布什尔省", "content": "据伊朗方面15日消息，美军当天对伊朗南部布什尔省发动新一轮袭击。\n\n消息援引布什尔市长穆罕默德·莫扎法里的话称，美军当天袭击了该省港口城市布什尔3处地点。袭击造成的损失和人员伤亡情况尚未公布。\n\n伊朗境内唯一运转的核电站位于布什尔城外。(央视新闻)", "ctime": 1784103706, "time_str": "16:21:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260715/c678196016.shtml"}, {"id": "4727205", "title": "阿斯麦美股盘前涨超3%", "content": "阿斯麦美股盘前涨超3%，现报1846.52美元。", "ctime": 1784103599, "time_str": "16:19:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260715/c678195955.shtml"}, {"id": "4727171", "title": "百隆东方：财务总监董奇涵已减持0.005%", "content": "百隆东方公告，公司财务总监董奇涵通过集中竞价方式已减持75000股，占公司总股本比例0.005%，减持价格区间7.58～7.79元/股，减持总金额58.03万元，减持计划实施完毕；当前持股数量22.5万股，当前持股比例0.015%。", "ctime": 1784103355, "time_str": "16:15:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260715/c678195864.shtml"}, {"id": "4727169", "title": "港股收评：恒生指数涨1.4%，恒生科技指数涨1.3%", "content": "港股收盘，恒生指数涨1.4%，恒生科技指数涨1.3%。恒指港股通ETF银华（159318）涨1.18%，港股通科技ETF鹏华（159751）涨2.05%。板块方面，生命科学工具、生物科技板块涨幅靠前；客运航空公司、能源设备与服务板块跌幅靠前。个股方面，昭衍新药涨23.78%，维立志博-B涨17.84%，博泰车联涨13.33%，MINIMAX-W涨13.3%，滴普科技涨12.82%；海光芯正跌13.81%，亮晴控股跌12.66%，中国建材跌11.86%，领益智造跌6.97%，鼎泰高科跌5.96%。", "ctime": 1784103345, "time_str": "16:15:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260715/c678195861.shtml"}, {"id": "4727167", "title": "黄仁勋：Vera Rubin 项目进展顺利，已经投入生产", "content": "黄仁勋：Vera Rubin 项目进展顺利，已经投入生产。(新浪财经)", "ctime": 1784103338, "time_str": "16:15:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260715/c678195858.shtml"}, {"id": "4727163", "title": "长鑫科技：AI发展对DRAM市场需求存在不确定性 投资者需关注行业波动风险", "content": "针对2026年全年业绩的审慎预期，长鑫科技副总裁、董事会秘书袁园表示，2025年下半年以来的业绩增长，确实受益于AI驱动的DRAM需求爆发及行业供需紧张，但DRAM行业具有强周期性，价格波动较大，且AI发展对DRAM市场需求存在不确定性。公司将持续通过技术迭代、产能优化和成本管控提升抗周期能力，但提醒投资者仍需关注行业波动风险。（上证报）", "ctime": 1784103281, "time_str": "16:14:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260715/c678195831.shtml"}, {"id": "4727141", "title": "成本上扬令渠道DDR5内存条价格续涨 渠道品牌抬高零售价持续传导下DDR4内存条迎来反弹", "content": "上游资源端自上月中下旬起缺货、涨价延续，支撑渠道DDR5内存条价格继续维持涨势。同时，在零售端部分渠道品牌主动抬高报价的带动下，存储厂商普遍跟涨，历经一季度下跌行情的DDR4内存条开始迎来反弹。行业内存条因同容量的海外与国产颗粒之间存在一定的价差，所对应的成品方案亦会在定价上有所差距，尤其是海外原厂D5次级颗粒长期供应紧缺且价格居高不下，部分PC客户如若指定海外原厂颗粒，则需支付更高的价格采购相应的成品方案；未来在上游资源被提前锁定加剧供货紧张，推动国产D5次级颗粒价格持续上涨，不同原厂颗粒生产的行业DDR5内存条价差也将逐渐缩小。(科创板日报)", "ctime": 1784103233, "time_str": "16:13:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260715/c678195811.shtml"}, {"id": "4727135", "title": "沪市主板超300家公司中报业绩预喜，超七成最高增幅超100%", "content": "截至2026年7月15日，沪市主板756家上市公司发布2026年半年度业绩预告，306家上市公司交出业绩增长或扭亏的“预喜”成绩单。统计显示，306家公司的预告中，215家预告最高增幅超100%，集中在基础化工、有色金属、电子，电力设备、非银金融等行业。尤其是基础化工、有色金属、电子三大板块，预喜公司数量领跑全市场，基础化工以35家预喜企业数位居首位，有色金属、电子分别为33家、25家紧随其后，三大行业合计预喜数量93家，占整体预喜数量的30%。（第一财经）", "ctime": 1784103104, "time_str": "16:11:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260715/c678195734.shtml"}, {"id": "4727129", "title": "建发致新：预计上半年净利润同比增长2.16%—16.76%", "content": "建发致新公告，预计2026年上半年净利润为1.4亿元—1.6亿元，同比增长2.16%—16.76%。报告期内，公司积极应对市场变化，持续推进业务结构优化和市场拓展，分销业务及医用耗材集约化运营(SPD)业务保持较快发展，带动公司整体毛利水平同比增加。受资产质量变化及存货减值因素影响，公司资产减值损失较上年同期减少，进一步改善了公司盈利水平。", "ctime": 1784102997, "time_str": "16:09:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260715/c678195592.shtml"}, {"id": "4727121", "title": "福龙马：张桂潮已减持0.1072%", "content": "福龙马公告，前任董事及高级管理人员、控股股东、实际控制人的一致行动人张桂潮通过集中竞价方式减持公司股票44.52万股，占公司总股本0.1072%，减持期间为2026年4月21日～2026年7月14日，减持价格区间12.27～19.06元/股，减持总金额576.88万元。本次减持计划实施完毕，当前持股数量0股。", "ctime": 1784102891, "time_str": "16:08:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260715/c678195155.shtml"}, {"id": "4727117", "title": "苹果盘前小幅走高，现涨0.1%", "content": "苹果盘前小幅走高，现涨0.1%。消息面上，网信办发布7款提供手机端侧生成式人工智能服务已备案信息，包括“Apple智能”。", "ctime": 1784102844, "time_str": "16:07:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260715/c678194968.shtml"}, {"id": "4727113", "title": "美国近期军事打击已造成伊朗约300人伤亡", "content": "伊朗政府发言人穆哈杰拉尼15日在社交媒体发文说，超过30名平民在近期美国对伊朗南部的袭击中死亡。另据伊朗卫生部公共关系主管侯赛因·克尔曼普尔15日在社交媒体发文说，本月7日以来美国对伊朗的空袭已造成伊朗超过260人受伤。他说，222名伤者已接受治疗并出院。伊朗陆军同日发表声明说，美国当天凌晨对伊朗东南部锡斯坦-俾路支斯坦省班普尔地区一处陆军营地发动导弹袭击，造成7名伊朗军人死亡和多人受伤。（新华社）", "ctime": 1784102760, "time_str": "16:06:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260715/c678194735.shtml"}, {"id": "4727111", "title": "外交部：维护全球产供链安全稳定畅通是各国共同责任", "content": "外交部发言人林剑15日表示，维护全球产供链安全稳定畅通是各国共同责任。中国将继续坚定不移扩大高水平对外开放，持续稳定向世界提供优质产品与合作机遇，也愿同各国携手，摒弃阵营对抗逻辑，推动全球产供链真正成为“共赢链”。当日例行记者会上，有记者问：我们注意到，日前《金融时报》等外媒援引最新研究数据称，如果美欧希望到2050年基本摆脱对中国关键产供链的依赖，未来25年需要额外投入23.6万亿美元，想短期内重建完整替代体系几乎是不可能的。发言人如何看待上述观点？“你提到的有关观点恰恰说明，当前全球产供链深度互嵌、优势互补，早已形成一荣俱荣、一损俱损的利益共同体。”林剑说，人为搞“脱钩断链”，构筑保护主义壁垒，强行重构产供链，不仅将付出高昂经济成本，也违背市场规律和企业选择，最终只会让各方付出更多代价、得到更少收益。“真正的安全感来自合作而非孤立，维护全球产供链安全稳定畅通是各国共同责任。”林剑说，“中国将继续坚定不移扩大高水平对外开放，充分发挥超大规模市场、完整产业体系等优势，持续稳定向世界提供优质产品与合作机遇。我们也愿同各国携手，摒弃阵营对抗逻辑，推动全球产供链真正成为‘共赢链’，为全球共同发展注入稳定动能。”（新华社）", "ctime": 1784102752, "time_str": "16:05:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260715/c678194720.shtml"}, {"id": "4727105", "title": "SK海力士美股盘前跌超6%", "content": "SK海力士美股盘前跌超6%，现报182.2美元。", "ctime": 1784102700, "time_str": "16:05:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260715/c678194657.shtml"}, {"id": "4727101", "title": "美国以防疫为由禁止本国公民从刚果（金）直返", "content": "美国白宫一名官员透露，美国政府以防控埃博拉疫情为由，禁止美国公民从刚果（金）搭乘商业航班直接回国，而必须在第三国停留至少三周。路透社14日援引这名官员的话报道，美国政府根据相关规定，把现阶段仍在刚果（金）或近期离开该国的美国公民列入“禁止登机”名单，要求他们返美前在第三国停留至少21天。相关措施已从13日开始执行。（新华社）", "ctime": 1784102624, "time_str": "16:03:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260715/c678194316.shtml"}, {"id": "4727095", "title": "网信办发布7款提供手机端侧生成式人工智能服务已备案信息，包括“Apple智能”", "content": "据网信中国，促进生成式人工智能服务创新发展和规范应用，网信部门会同有关部门按照《生成式人工智能服务管理暂行办法》要求，有序开展生成式人工智能服务备案工作，现将新增的“Apple智能”等7款提供手机端侧生成式人工智能服务备案信息予以公告。", "ctime": 1784102560, "time_str": "16:02:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260715/c678194088.shtml"}, {"id": "4727087", "title": "美股大型科技股盘前涨跌互现，SK海力士跌4%", "content": "美股大型科技股盘前涨跌互现，SpaceX涨1%，美光科技涨0.8%，特斯拉涨0.2%，亚马逊涨0.1%，微软、英伟达、苹果、谷歌A持平，Meta跌0.2%，SK海力士跌4%。", "ctime": 1784102492, "time_str": "16:01:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260715/c678193826.shtml"}, {"id": "4727041", "title": "央行：根据流动性需要适当选择存款准备金、逆回购、MLF等工具", "content": "中国人民银行副行长邹澜在发布会上表示，数量方面，人民银行的工具箱非常丰富，包括存款准备金、逆回购、中期借贷便利、国债买卖等。降准主要侧重于投放长期流动性，逆回购、中期借贷便利侧重于投放短中期流动性。央行会根据流动性管理需要，适当选择并合理搭配这些工具。", "ctime": 1784102338, "time_s // 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
