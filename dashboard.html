(新华社)", "ctime": 1793258002, "time_str": "15:13:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261029/c681234418.shtml"}, {"id": "5513291", "title": "商务部公布2027年货物出口配额总量", "content": "商务部公布2027年货物出口配额总量，2027年，甘草及甘草制品、药料用人工种植麻黄草、活猪（对港澳）、活牛（对港澳）、活鸡（对香港）、锯材、蔺草及蔺草制品出口配额分别为520万千克、108.04万千克、160.54万头、2.2万头、300万只、15万立方米、1400万千克。", "ctime": 1793257948, "time_str": "15:12:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261029/c681234401.shtml"}, {"id": "5513189", "title": "商务部：今年以来以旧换新带动数码产品销量同比增长44.8%", "content": "商务部数据显示，截至10月28日，2026年以旧换新累计带动相关商品销售超2万亿元，惠及超2.57亿人次。享受补贴的手机、平板等数码产品销量同比增长44.8%，带动前三季度通讯器材类零售额同比增长18.1%；享受以旧换新的新能源汽车占比达60.5%，带动新能源乘用车零售市场渗透率连续6个月突破60%；参与政策的线下门店超73.6万家，同比增长37.1%。（央视新闻）", "ctime": 1793257758, "time_str": "15:09:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261029/c681234295.shtml"}, {"id": "5513093", "title": "道达尔集团第三季度调整后净利润91.0亿美元", "content": "道达尔集团第三季度调整后净利润91.0亿美元，市场预估89亿美元。", "ctime": 1793257585, "time_str": "15:06:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261029/c681234156.shtml"}, {"id": "5512995", "title": "商务部：坚决反对美将中国企业列入所谓涉疆法案实体清单", "content": "针对美国国土安全部宣布将3家中国实体增列至“维吾尔强迫劳动预防法”实体清单，商务部新闻发言人29日表示，中国不存在强迫劳动，新疆各族群众劳动就业自由平等，劳动权益依法得到有效保障。美方相关措施毫无事实依据，美方持续操弄“人权”议题，打着“人权”的幌子行单边保护主义和霸凌主义之实。中方对此强烈谴责，坚决反对。(新华社)", "ctime": 1793257478, "time_str": "15:04:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261029/c681234092.shtml"}, {"id": "5512837", "title": "开源证券：美联储将保持谨慎 2026年或再加息一次", "content": "美联储于北京时间10月29日凌晨发布10月FOMC会议声明，宣布保持利率水平不变。对此，开源证券表示，美联储将保持谨慎，2026年或再加息一次。开源证券认为，9月加息后，美联储面临的压力略有缓和，连续加息的紧迫性下降。且10月FOMC临近中期选举，此时加息可能会将美联储置于政治纠纷之中。美联储或对后续政策保持谨慎，以避免出现通胀的超预期抬升及民众通胀预期的失控。基准情形下，美联储或在2026年12月再加息一次，2027年加息情况则高度取决于美伊局势的变化，以及油价对美国通胀的传导效应。(人民财讯)", "ctime": 1793257351, "time_str": "15:02:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261029/c681234028.shtml"}, {"id": "5512829", "title": "ETF两市成交额报5700.6亿元，较昨日此时缩量283.73亿元", "content": "截至目前，ETF两市成交额报5700.6亿元，较昨日此时缩量283.73亿元，分类型来看，股票型ETF成交额1681.04亿元，债券型ETF成交额2832.75亿元，货币型ETF成交额469.67亿元，商品型ETF成交额69.4亿元，QDII型ETF成交额647.75亿元。其中，成交额最高的非货币型ETF分别是中韩半导体ETF（513310）、创业板ETF（159915）、科创50ETF（588000），成交额分别为：154.38亿元、127.52亿元、115.24亿元。", "ctime": 1793257349, "time_str": "15:02:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261029/c681234025.shtml"}, {"id": "5512799", "title": "期货收评：碳酸锂暴跌超8%！沥青逆势大涨超3%", "content": "期货收评：截止收盘，国内期货主力合约跌多涨少，碳酸锂跌超8%，钯、生猪、沪银、纯苯跌超3%，红枣、苯乙烯（EB）、棕榈油跌超2%。涨幅方面，沥青涨超3%，铁矿石、鸡蛋、燃料油涨超2%，乙二醇（EG）、聚氯乙烯（PVC）、塑料、瓶片涨超1%。", "ctime": 1793257319, "time_str": "15:01:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261029/c681234019.shtml"}, {"id": "5512675", "title": "A股收评：双创指数低开低走均跌超4%，算力硬件股大幅下挫", "content": "A股三大指数今日集体下跌，截至收盘，上证指数跌0.82%，深证成指跌2.92%，创业板指跌4.45%，北证50跌3.88%，科创50指数跌4.27%。全市场成交额15707亿元，较上日缩量714亿元，全市场超4700只个股下跌。板块题材上，风电设备、银行、保险、煤炭开采加工、影视院线板块涨幅居前；元件、CPO、通信设备、半导体、电机板块跌幅居前。盘面上，风电设备板块低开高走，天顺风能涨停，海力风电、泰胜风能、大金重工涨幅居前。银行板块逆市上涨，青岛银行盘中张超8%，成都银行、瑞丰银行、齐鲁银行涨幅居前。商业航天板块表现活跃，中国卫星、上海沪工、西部材料等多股涨停，飞沃科技、电科蓝天、西侧测试涨幅居前。元件板块全天下挫，沪电股份、东山精密、奥士康、景旺电子等股跌停，生益电子、胜宏科技、澳弘电子跌幅居前。CPO板块亦表现低迷，天孚通信触及跌停，联特科技、光库科技、仕佳光子跌幅居前。半导体板块低开低走，先导基电跌停，盛美上海、富满微、摩尔线程等多股跌超10%。", "ctime": 1793257261, "time_str": "15:01:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261029/c681234011.shtml"}, {"id": "5512643", "title": "ETF收评：纳指生物科技ETF领涨2.97%，创业板人工智能ETF领跌9.53%", "content": "ETF收盘涨跌不一，纳指生物科技ETF（513290）领涨2.97%，标普生物科技ETF（159502）涨2.46%，银行ETF（561530）涨2.30%，创业板人工智能ETF（159382）领跌9.53%，创业板人工智能ETF（159242）跌8.12%，创业板人工智能ETF（159246）跌8.05%。", "ctime": 1793257259, "time_str": "15:00:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261029/c681234010.shtml"}, {"id": "5512535", "title": "股指期货午盘收盘 主力合约多数收跌", "content": "股指期货午盘收盘，主力合约多数收跌。沪深300股指期货(IF)主力合约跌1.11%，上证50股指期货(IH)主力合约涨0.02%，中证500股指期货(IC)主力合约跌2.78%，中证1000股指期货(IM)主力合约跌2.96%。", "ctime": 1793257217, "time_str": "15:00:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261029/c681233989.shtml"}, {"id": "5512491", "title": "前三季度我国跨区域人员流动量超512亿人次", "content": "据交通运输部消息，前三季度我国交通运输经济运行总体平稳，主要指标规模较去年同期有所增长。跨区域人员流动量512.2亿人次，同比增长1.2%；营业性货运量430.4亿吨，同比增长2.3%；全国港口货物吞吐量136.4亿吨，同比增长0.7%。城市客运量792.8亿人次，同比增长2.5%，其中城市轨道交通、出租汽车客运量分别为254.6亿人次、272.5亿人次，同比分别增长3.4%、7%。交通固定资产投资2.4万亿元，其中公路、水运分别完成投资1.6万亿元和1571亿元。（新华社）", "ctime": 1793257165, "time_str": "14:59:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261029/c681233976.shtml"}, {"id": "5512489", "title": "2026年10月29日国家再次实施调控，成品油价格适当调整", "content": "10月15日国内成品油价格调整以来，中东地缘紧张局势升级，国际市场原油价格大幅上涨。为减缓对国内的冲击，国家再次对成品油价格采取调控措施。根据现行价格机制计算，自10月29日24时起，国内汽、柴油（标准品）价格每吨分别应上调440元、420元，统筹兼顾减轻下游用户负担和保障成品油安全稳定供应，调控后实际上调345元、335元。(发改委)", "ctime": 1793257150, "time_str": "14:59:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261029/c681233969.shtml"}, {"id": "5512469", "title": "生态环境部：今年前三季度全国地表水水质持续向好", "content": "生态环境部发布前三季度全国地表水环境质量监测结果：1－9月全国地表水Ⅰ－Ⅲ类优良水质比例为86.1%，较去年同期上升1.7个百分点；劣Ⅴ类水质比例为0.8%，同比下降0.4个百分点，主要超标指标为化学需氧量、高锰酸盐指数和总磷。145个监测重点湖（库）中Ⅰ－Ⅲ类水质湖库占比71.7%，同比上升2.0个百分点，劣Ⅴ类占比3.4%，同比下降0.7个百分点。（央视新闻）", "ctime": 1793256983, "time_str": "14:56:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261029/c681233920.shtml"}, {"id": "5512457", "title": "蔚来能源与中广核新能源达成战略合作", "content": "据蔚来消息，10月28日，蔚来能源与中国广核新能源控股有限公司（简称“中广核新能源”）签署战略合作协议。双方将围绕零碳管理、绿色电力与能源服务三大方向开展深度合作，共同助力新能源汽车与新型电力系统的绿色融合发展。（人民财讯）", "ctime": 1793256885, "time_str": "14:54:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261029/c681233903.shtml"}, {"id": "5512443", "title": "天孚通信尾盘触及20cm跌停", "content": "天孚通信尾盘触及20cm跌停，新易盛跌超10%，中际旭创跌超8%。", "ctime": 1793256809, "time_str": "14:53:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261029/c681233879.shtml"}, {"id": "5512439", "title": "城建设计等成立智控科技公司 含AI相关业务", "content": "据企查查APP显示，近日，沈阳卓汇智控科技有限公司成立，经营范围包含计算机软硬件及辅助设备批发、机械设备研发、人工智能理论与算法软件开发等。企查查股权穿透显示，该公司由城建设计等共同持股。（人民财讯）", "ctime": 1793256797, "time_str": "14:53:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261029/c681233870.shtml"}, {"id": "5512423", "title": "优必选入主后 锋龙股份子公司新锋龙多款产品已实现量产", "content": "10月29日，优必选微信公众号消息，随着优必选完成对锋龙股份的收购，双方产业协同持续深化。锋龙股份于6月成立全资子公司新锋龙，持续推进具身智能核心硬件自研与规模化制造业务，目前已实现二指夹爪和仿生人面部舵机的研发和量产。新锋龙还将逐步整合优必选旗下的优世界、优医疗等具身智能机器人业务。（人民财讯）", "ctime": 1793256710, "time_str": "14:51:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261029/c681233840.shtml"}, {"id": "5512403", "title": "中欧班列“东通道”口岸段最长桥梁铺轨完成", "content": "10月29日，由中铁五院设计、中铁二十三局承建的同江特大桥铺轨任务全部完成，标志着佳同铁路扩能改造工程正线施工主体工作基本完成，全线即将进入验收阶段。该桥全长10435.14米，是目前我国中欧班列西、中、东三大通道口岸段最长的新建桥梁，同江至同江北改建段桥梁占比高达84%。佳同铁路全长258.25公里，以货运为主、兼顾客运，全线建成投用后，将进一步提升中欧班列“东通道”同江口岸后方通道能力，列车通过能力将提升3倍以上。（新华社）", "ctime": 1793256626, "time_str": "14:50:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_ // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
