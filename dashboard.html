限完成天使++轮融资，卡位企业级AI Agent基础设施赛道", "content": "记者从北京词元无限科技有限公司获悉，该公司完成天使++轮融资。本轮融资由临芯投资领投，华控基金跟投，这也是词元无限在一个月内完成的第二笔融资，累计融资额已达数亿元人民币。资金将主要用于加速打造中国首个全自主、高安全、自进化的企业级AI Agent基础设施平台，深化与清华大学、北京航空航天大学等高校的联合研究，并持续构建面向Agent应用范式的下一代基础设施。（财联社）", "ctime": 1785126494, "time_str": "12:28:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260727/c678449349.shtml"}, {"id": "4809645", "title": "因自驾违规停车 Waymo在奥斯汀被罚近万美元", "content": "在美国得克萨斯州奥斯汀市，Waymo的无人驾驶出租车始终难以遵守停车规范。文件显示，自2024年进驻这座城市以来，该公司车辆累计收到停车罚单，罚款总额高达9325美元。 奥斯汀是美国无人驾驶出租车规模增长最快的核心新兴市场之一。Waymo在此投入运营超300辆无人车，占其得州车队总量近半数，领跑当地赛道。奥斯汀2025财年停车罚款总收入为630万美元，Waymo这笔罚金相较之下只是九牛一毛。但随着Waymo及其他无人出租车企业在美国各地扩张业务，这类违规停车问题已然成为各方矛盾凸显的导火索。 在奥斯汀，除Waymo外，特斯拉无人驾驶出租车、亚马逊Zoox等品牌自动驾驶车辆，在应对突发状况时都给执法部门带来了难题：比如事故救援现场、施工路段、道路临时封闭等复杂场景，车辆难以稳妥通行处置。（新浪财经）", "ctime": 1785125488, "time_str": "12:11:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260727/c678448933.shtml"}, {"id": "4809643", "title": "OpenAI：出现影响ChatGPT的较高错误率，已实施缓解措施", "content": "OpenAI：出现影响ChatGPT的较高错误率，已实施缓解措施，并在监控ChatGPT的恢复情况。", "ctime": 1785125479, "time_str": "12:11:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260727/c678448930.shtml"}, {"id": "4809641", "title": "智能烹饪机器人企业智谷天厨完成新一轮近亿元战略融资", "content": "近日，智能烹饪机器人企业智谷天厨宣布完成新一轮近亿元战略融资。本轮融资由招商局创投领投，跃迁资本跟投，云启资本、啟赋资本等老股东超额追投。（界面新闻）", "ctime": 1785125470, "time_str": "12:11:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260727/c678448926.shtml"}, {"id": "4809637", "title": "7月27日午间公告一览：维通利部分募投项目延期及新增实施地点", "content": "维通利公告，公司于 2026 年 7 月 27 日召开了第一届董事会第二十二次会议，审议通过了《关于部分募投项目延期及新增实施地点的议案》，同意新增电连接株洲基地（一期）建设项目实施地点（湖南省株洲市天元区创业大道128 号天易科技城自主创业园 E-13、E-14 厂房；湖南省株洲市天元区隆兴路 1900 号3 号生产厂房），并将该项目的实施期限延长至 2027 年 12 月；将无锡维通利生产基地智能化建设项目的实施期限延长至 2027 年 12 月；将无锡新能源生产基地智能化建设项目的实施期限延长至2027年12月；新增北京生产基地智能化升级改造项目实施地点（北京市通州区聚祥三街 7 号院 1 号楼），并将该项目的实施期限延长至2027 年12月。", "ctime": 1785125171, "time_str": "12:06:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260727/c678448813.shtml"}, {"id": "4809631", "title": "三星李在镕与OpenAI阿尔特曼会面 有望扩大AI基础设施合作", "content": "据韩联社，当地时间25日，三星电子董事长李在镕在美国旧金山OpenAI总部与OpenAI CEO萨姆·阿尔特曼会面，探讨了人工智能和半导体领域的合作计划。尽管会谈的具体细节并未披露，但分析人士认为，双方极有可能讨论了如何扩大在人工智能基础设施领域的合作，例如高带宽内存、DRAM和先进晶圆代工等。两家公司于去年10月签署了战略合作协议，并一直在寻求合作，以扩大先进存储半导体的生产规模，并构建下一代人工智能基础设施。(科创板日报)", "ctime": 1785124954, "time_str": "12:02:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260727/c678448720.shtml"}, {"id": "4809627", "title": "港股午评：恒生指数涨0.81%，恒生科技指数涨1.69%", "content": "港股午间收盘，恒生指数涨0.81%，恒生科技指数涨1.69%。恒指港股通ETF银华（159318）涨1.48%，港股通科技ETF鹏华（159751）涨1.96%。板块方面，其他计算机设备、手机板块涨幅靠前；数据处理和外包服务、可选消费经销Ⅳ板块跌幅靠前。个股方面，真健康医疗-B涨12.23%，旺山旺水-B涨12.18%，珞石机器人涨10.52%，嘉耀控股涨9.98%，大金重工涨9.63%；维立志博-B跌9.77%，力勤资源跌9.53%，云迹跌9.06%，白鸽在线跌8.71%，万国黄金集团跌7.64%。", "ctime": 1785124867, "time_str": "12:01:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260727/c678448682.shtml"}, {"id": "4809621", "title": "崔东树：2026年1-6月汽车行业利润率3.8%", "content": "乘联分会秘书长崔东树发文称，2026年1-6月汽车生产1510万台，同比降4%。2026年1-6月的汽车行业收入51893亿元，同比增1.8%；成本46100亿元，增2.8%；利润1954亿元，同比降20%；汽车行业利润率3.8%，相对于下游工业企业利润率6.5%的平均水平，汽车行业仍偏低。（人民财讯）", "ctime": 1785124852, "time_str": "12:00:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260727/c678448678.shtml"}, {"id": "4809617", "title": "上海港刷新国内港口单航次商品车装船量新纪录", "content": "7月26日，巴拿马籍“格罗唯视·领航”轮、马耳他籍“格罗唯视·诺瓦”轮两艘中国制造的万车级汽车滚装船同步靠泊上海南港码头，将载运国产商品汽车扬帆驶向海外。其中新交付的“格罗唯视·诺瓦”轮完成7738辆新能源汽车装载作业，创下国内港口单航次商品车装船量新纪录。（央视新闻）", "ctime": 1785124835, "time_str": "12:00:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260727/c678448671.shtml"}, {"id": "4809605", "title": "上半年全国规模以上工业企业利润增长18.7%", "content": "国家统计局27日发布数据显示，1至6月份，全国规模以上工业企业实现利润总额39479.9亿元，同比增长18.7%，较一季度加快3.2个百分点。从三大门类看，采矿业、制造业利润同比分别增长33.5%、20.1%，较一季度分别加快17.3个、1.0个百分点；电力、热力、燃气及水生产和供应业下降4.2%。6月份，全国规模以上工业企业利润同比增长15.1%。（新华社）", "ctime": 1785124217, "time_str": "11:50:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260727/c678448483.shtml"}, {"id": "4809601", "title": "美国对加征“山火关税”背后：资源与利益分配的全球较量", "content": "7月24日，美国为期150天的全球10%临时进口附加关税正式到期。特朗普政府以所谓“强迫劳动”为名，对60个国家和地区征收10%至12.5%的关税。7月20日，特朗普政府宣布，对加拿大的数百种商品追加高达50%的关税。重点针对汽车及零部件、钢铝制品、农产品等领域，同时波及酒类、乳制品、建材和消费品等多个行业。7月23日，美国贸易代表办公室宣布，依据《1974年贸易法》第301条，对60个国家和地区征收10%至12.5%的关税。（央视新闻）", "ctime": 1785124108, "time_str": "11:48:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260727/c678448451.shtml"}, {"id": "4809597", "title": "雷军：7月30日晚7点将举办小米澎程系列的技术发布会", "content": "7月27日，雷军在个人微博发文称：“大家久等了。7月30日晚7点，我们将举办小米澎程系列的技术发布会，朋友们期待已久的智能可变大空间SUV，终于要跟大家见面了。这是小米汽车第二次技术发布会，邀请大家一起见证小米造车技术的全新进展。同时，小米澎程N90、N70两款SUV正式登场。”", "ctime": 1785123839, "time_str": "11:43:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260727/c678448368.shtml"}, {"id": "4809593", "title": "也门军方人士称巡逻艇在红海遭胡塞武装袭击3人失踪", "content": "一名也门政府海军官员26日说，一艘海军巡逻艇当天在也门西部的红海海域遭胡塞武装袭击，艇上3人失踪。\n\n这名不愿透露姓名的官员表示，巡逻艇完成军事任务返程时，在祖盖尔岛附近遭到数艘小型船只上的武装人员袭击，巡逻艇被摧毁，艇上3人失踪。这名官员说是胡塞武装实施了此次袭击，但未提供任何证据。\n\n目前，胡塞武装尚未就此事发表任何声明或表态。\n\n也门政府军此前表示，挫败了胡塞武装多艘武装船只接近祖盖尔岛的企图。\n\n祖盖尔岛距也门红海港口城市荷台达约52海里（约合96公里），战略位置重要。(央视新闻)", "ctime": 1785123702, "time_str": "11:41:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260727/c678448344.shtml"}, {"id": "4809589", "title": "葡专家警告：极端森林火灾或日益频发", "content": "葡萄牙知名火灾专家多明戈斯·维埃加斯26日警告说，随着气候变化加剧，被称为“第六代火灾”的极端森林火灾未来可能会越来越频繁，目前正在西班牙和法国肆虐的山火就呈现出这类火灾的特征。（新华社）", "ctime": 1785123526, "time_str": "11:38:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260727/c678448261.shtml"}, {"id": "4809583", "title": "网信部门严管“自媒体”未规范标注信息来源行为", "content": "网信部门持续督导网站平台推进信息来源标注工作，近期，巡查发现一些“自媒体”在发布涉国内外时事相关内容时，未规范标注信息来源，混淆视听，严重误导公众认知。网信部门加大巡查处置力度，督促网站平台依法依约处置违规账号3704个，纠正错标漏标短视频4.8万余次。信息来源标注，是保障网络信息内容真实准确、可信可溯的基本前提。网信部门提醒广大“自媒体”创作者要始终坚守内容真实底线，恪守合规运营准则，自觉主动、规范准确标注信息来源，对发布的信息内容负责。网站平台要持续优化信息来源标注功能，建立规范标注长效制度机制，实现信息来源标注应标尽标，共同构建风清气正、健康向上的网络舆论生态。（新华社）", "ctime": 1785123316, "time_str": "11:35:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260727/c678447976.shtml"}, {"id": "4809577", "title": "A股午评：创业板指震荡走高涨1.55% 长鑫科技上市首日暴涨530%创下多项记录", "content": "截至午盘，上证指数涨0.4%，深证成指涨1.41%，创业板指涨1.55%，北证50涨1.88%。全市场超4800家个股上涨。三市成交额13570亿元，较上日放量1229亿元。\n板块题材上，脑机接口、电池、小家电板块涨幅居前；油气概念板块跌幅居前。\n盘面上，脑机接口板块高开高走，塞力医疗、创新医疗、海南海药、盈趣科技、南京熊猫、爱朋医疗涨停，倍益康涨超15%，倍轻松、三博脑科涨超10%，美好医疗、伟思医疗、翔宇医疗、泰和科技、狄耐克跟涨。电池板块持续走高，圣阳股份、万里股份、龙蟠科技、紫建电子涨停，领湃科技、龙鑫智能涨超10%，天宏锂电、纳科诺尔、博力威、欣旺达、天力锂能跟涨。小家电板块低开高走，九阳股份涨停，倍益康涨超15%，倍轻松涨超10%，荣泰健康、彩虹集团、石头科技、开能健康、欧伦电气跟涨。油气板块低开低走，中曼石油触及跌停，通源石油、潜能恒信、科力股份跌超10%，蓝焰控股、新潮能源、中国海油、博迈科、新天然气跟跌。", "ctime": 1785123189, "time_str": "11:33:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260727/c678447923.shtml"}, {"id": "4809565", "title": "股指期货早盘收盘 主力合约多数上涨", "content": "股指期货早盘收盘，主力合约多数上涨。沪深300股指期货(IF)主力合约涨0.50%，上证50股指期货(IH)主力合约跌0.45%，中证500股指期货(IC)主力合约涨1.45%，中证1000股指期货(IM)主力合约涨2.37%。", "ctime": 1785123017, "time_str": "11:30:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "h _name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260727/c678446737.shtml"}, {"id": "4809453", "title": "郑商所瓶片主力合约大跌5%", "content": "郑商所瓶片主力合约大跌5%，报7096元/吨。", "ctime": 1785120841, "time_str": "10:54:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260727/c678446722.shtml"}, {"id": "4809427", "title": "今年虹桥论坛新增《出口中国能力发展报告》", "content": "7月27日，第九届进博会（中国国际进口博览会）迎来倒计时100天。虹桥国际经济论坛（下称“虹桥论坛”）与进博会同期举办。第九届虹桥论坛以“稳定合作 共建开放型世界经济”为主题，举办主论坛（进博会暨虹桥论坛开幕式）和“1+4”板块下若干场分论坛及闭门会等活动：“1”即“报告发布暨国际研讨会”板块，举办《世界开放报告2026》发布暨国际研讨会（发布最新世界开放指数），新增发布《出口中国能力发展报告》，打造双旗舰报告；发布《2026年世界贸易报告》中文版。“4”即“开放合作”“开放创新”“开放发展”“开放共享”四个板块，分别聚焦“坚守多边主义”“科技新动能”“绿色和可持续的全球化”“可信赖的中国”等方向。（第一财经）", "ctime": 1785120207, "time_str": "10:43:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260727/c678446416.shtml"}, {"id": "4809423", "title": "腾讯云：7月27日起TDSQL-C MySQL版产品架构2.0正式商业化计费", "content": "腾讯云公告，TDSQL-C MySQL版产品架构2.0即将结束公测，自北京时间2026年7月27日00:00:00起，正式商业化计费。产品架构 2.0 的计费项分为计算资源和存储资源，其中，计算资源（CPU、内存）的价格和产品架构1.0相同；存储资源的价格与产品架构不同（低于产品架构1.0），详细计费价格请参见产品价格。", "ctime": 1785120091, "time_str": "10:41:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260727/c678446371.shtml"}, {"id": "4809417", "title": "2026年度票房破215亿元", "content": "据网络平台数据，截至目前，2026年度电影总票房（含预售）突破215亿元。", "ctime": 1785120046, "time_str": "10:40:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260727/c678446352.shtml"}, {"id": "4809407", "title": "宁德时代成交额达100亿元", "content": "宁德时代成交额达100亿元，现涨4.52%。", "ctime": 1785119878, "time_str": "10:37:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260727/c67844626 // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
