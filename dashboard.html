 "上交所数据显示，2026年3月基金新开户39.4万户，环比增长64.37%，同比2025年3月的41.93万户下降6.03%。2026年累计新开118万户，同比增长27.71%。", "ctime": 1775122104, "time_str": "17:28:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260402/c675727644.shtml"}, {"id": "4179719", "title": "黔源电力：2025年净利润6亿元，同比增长175.02%", "content": "黔源电力公告，2025年营业收入32.85亿元，同比增长69.98%。净利润6亿元，同比增长175.02%。公司董事会审议通过的利润分配预案为：以4.28亿股为基数，向全体股东每10股派发现金红利3.9元（含税），送红股0股（含税），不以公积金转增股本。", "ctime": 1775122091, "time_str": "17:28:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260402/c675727629.shtml"}, {"id": "4179717", "title": "NYMEX取暖油主力合约暴涨9%", "content": "NYMEX取暖油主力合约暴涨9%，现报4.43美元/加仑。", "ctime": 1775122071, "time_str": "17:27:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260402/c675727615.shtml"}, {"id": "4179715", "title": "伊朗称特朗普宣布虚假胜利", "content": "在美国总统特朗普宣布美国正在以“前所未有的巨大优势获得胜利”后，伊朗方面今天（4月2日）回应称，特朗普是在宣布虚假的胜利。据总台驻伊朗记者李健南了解，伊朗塔斯尼姆通讯社今天发表评论称，此前美国设定的战争目标是改变伊朗政治体制，建立一个向美国投降的政府，摧毁伊朗的国防能力和核能力并掌握霍尔木兹海峡，但在战争爆发超过一个月后，美国当初所设立的目标并没有实现。伊朗称战争将持续至敌人投降伊朗武装部队发言人今天还表示，战争将持续至敌人投降，美以不要妄想已经摧毁了伊朗的战略导弹生产中心、无人机和电子战等系统和装备，这种想法只会让美以更加深陷泥潭。(CCTV国际时讯)", "ctime": 1775121977, "time_str": "17:26:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260402/c675727559.shtml"}, {"id": "4179713", "title": "美国加州发生4.9级地震", "content": "据美国地质调查局地震信息网2日消息，美国加利福尼亚州博尔德克里克当天发生4.9级地震，震源深度10.9公里。(央视新闻)", "ctime": 1775121903, "time_str": "17:25:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260402/c675727531.shtml"}, {"id": "4179711", "title": "辰欣药业：2025年净利润4.21亿元，同比下降17.22%", "content": "辰欣药业公告，2025年营业收入34.45亿元，同比下降13.48%。净利润4.21亿元，同比下降17.22%。公司拟向全体股东每股派发现金红利0.348元（含税），其中，2025年半年度已完成每股派发现金红利0.188元（含税），已派发8511.78万元（含税）；本次每股派发现金红利0.16元（含税），拟派发金额为7244.07万元（含税）。", "ctime": 1775121807, "time_str": "17:23:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260402/c675727473.shtml"}, {"id": "4179709", "title": "龙净环保：龙岩国投拟增持5000万元至1亿元", "content": "龙净环保公告，公司持股5%以上股东龙岩市国有资产投资经营有限公司及一致行动人龙岩市华盛企业投资有限公司合计持有公司1.13亿股，占总股本8.92%。龙岩国投拟自公告披露之日起12个月内通过上海证券交易所集中竞价增持公司A股，增持金额5000万元至1亿元，资金来源为专项贷款及自有资金，中信银行同意提供最高不超过9000万元、期限不超过3年的专项贷款。本次增持不触及要约收购，不导致控股股东及实际控制人变动。", "ctime": 1775121796, "time_str": "17:23:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260402/c675727466.shtml"}, {"id": "4179703", "title": "百奥泰：研药品BAT3306注射液联合注射用BAT8008用于治疗晚期实体瘤患者的临床试验申请获得批准", "content": "百奥泰公告，公司于近日收到国家药品监督管理局核准签发的《药物临床试验批准通知书》，公司在研药品BAT3306注射液联合注射用BAT8008用于治疗晚期实体瘤患者的临床试验申请获得批准。", "ctime": 1775121770, "time_str": "17:22:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260402/c675727450.shtml"}, {"id": "4179701", "title": "工信部：鼓励高校、科研院所与龙头企业联合开放算力资源、数据接口和工具链 降低中小企业技术研发与试验成本", "content": "工业和信息化部办公厅关于开展普惠算力赋能中小企业发展专项行动。其中提到，深化技术成果转化。鼓励有条件的地方建设面向中小企业的算力技术验证平台等，支持中小企业提升技术验证、原型开发、成果转化、市场落地等全链条能力。鼓励高校、科研院所与龙头企业联合开放算力资源、数据接口和工具链，降低中小企业技术研发与试验成本。通过算力强基揭榜等方式，加速算力技术在中小企业中的转化与应用。（工信部）", "ctime": 1775121625, "time_str": "17:20:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260402/c675727373.shtml"}, {"id": "4179699", "title": "工信部：积极培育人工智能应用服务商 完善人工智能应用服务体系", "content": "工业和信息化部办公厅关于开展普惠算力赋能中小企业发展专项行动。其中提到，提升算力服务易用性。围绕中小企业数字化转型城市试点、中小企业特色产业集群、创新型产业集群、先进制造业集群、算力互联互通节点等区域，因地制宜建设一批普惠算力赋能中心，组织开展“算力进园区、进企业”对接活动，提供面对面技术咨询与资源供给服务。依托中小企业平台专区等，按区域、类型、企业主体等维度分类展示算力资源信息，并提供智能匹配、使用指导及咨询服务等功能。鼓励开展面向中小企业需求的普惠算力服务能力评测，助力中小企业筛选适配自身业务场景的算力服务企业。积极培育人工智能应用服务商，打造人工智能应用服务链，完善人工智能应用服务体系，促进人工智能应用落地。（工信部）", "ctime": 1775121608, "time_str": "17:20:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260402/c675727352.shtml"}, {"id": "4179697", "title": "我国科研团队在新一代集成显示技术领域取得突破", "content": "记者2日从福州大学获悉，此校联合闽都创新实验室在超高清集成显示技术领域取得突破，由福州大学物理与信息工程学院李福山教授团队牵头，成功研发出一种面向增强现实（AR）、虚拟现实（VR）的超高分辨率量子点显示技术。相关研究论文于北京时间4月2日发表在国际顶级学术期刊《自然》。(新华社)", "ctime": 1775121573, "time_str": "17:19:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260402/c675727330.shtml"}, {"id": "4179695", "title": "新朋股份：拟使用不超过1.2亿元回购公司股份", "content": "新朋股份公告，拟使用不超过1.2亿元回购公司股份，回购价格不超过10元/股。", "ctime": 1775121560, "time_str": "17:19:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260402/c675727321.shtml"}, {"id": "4179693", "title": "工信部：探索“算力银行”“算力超市”等创新业务 支持中小企业存入闲置算力资源", "content": "工业和信息化部办公厅关于开展普惠算力赋能中小企业发展专项行动。其中提到，创新算力服务普惠模式。完善中国算力平台中小企业专区、中国中小企业服务网算力资源对接专区、国家算力互联网服务节点专区（以下统称中小企业平台专区），推动中小企业需求与算力资源供给精准对接，推行按“卡时”“核时”及Token计费等灵活付费模式。探索“算力银行”“算力超市”等创新业务，支持中小企业存入闲置算力资源，通过跨区域、跨周期调度实现灵活取用。实施人工智能中小企业创业支持计划，鼓励地方有关部门通过中小企业平台专区向符合产业导向的中小企业补贴“算力券”“存力券”“运力券”，简化获取和使用流程。（工信部）", "ctime": 1775121533, "time_str": "17:18:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260402/c675727304.shtml"}, {"id": "4179691", "title": "工信部：引导基础电信企业、算力服务企业等各类主体建设面向中小企业的先进存力中心", "content": "工业和信息化部办公厅发布关于开展普惠算力赋能中小企业发展专项行动的通知。其中指出，提升数据存储响应能力。引导基础电信企业、算力服务企业等各类主体建设面向中小企业的先进存力中心，提供就近接入的海量数据供给资源池，面向中小企业提供高性能存储、跨域流动的人工智能数据平台等服务，强化存力供给能力。通过统一调度存力资源，实现数据“就地计算、按需流动”，提升数据处理效率。（工信部）", "ctime": 1775121515, "time_str": "17:18:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260402/c675727300.shtml"}, {"id": "4179689", "title": "三鑫医疗：拟使用自有资金1787.24万元分别收购陈贵文、刘韶林持有的成都威力生部分股权", "content": "三鑫医疗公告，全资子公司四川威力生拟使用自有资金1787.24万元分别收购陈贵文、刘韶林持有的成都威力生部分股权，其中：陈贵文拟将其持有的成都威力生12.6250%股权（对应202.00万元注册资本出资额）作价991.82万元转让给四川威力生，刘韶林拟将其持有的成都威力生10.1250%股权（对应162.00万元注册资本出资额）作价795.42万元转让给四川威力生。转让价格由交易各方参考成都威力生2025年末净资产情况综合协商确定。", "ctime": 1775121494, "time_str": "17:18:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260402/c675727293.shtml"}, {"id": "4179687", "title": "工信部：2028年底显著降低中小企业获取、使用算力门槛 为推动中小企业专精特新发展提供坚实算力支撑", "content": "工业和信息化部办公厅关于开展普惠算力赋能中小企业发展专项行动。其中提到，到2028年底，基本建成覆盖广、成本低、服务优、生态活、人才强的普惠算力服务体系，在中小企业划分标准适用的15类行业中覆盖门类不少于10类，进一步加强对中小企业算力应用的公共服务力度，显著降低中小企业获取、使用算力门槛，为推动中小企业专精特新发展提供坚实算力支撑。(工信部)", "ctime": 1775121452, "time_str": "17:17:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260402/c675727276.shtml"}, {"id": "4179665", "title": "哈森股份修正2025年年度业绩预告 预计净利润为亏损3600万元到5400万元", "content": "哈森股份发布2025年年度业绩预告更正公告，预计净利润为亏损3600万元到5400万元。公司原预计净亏损2400万元到3600万元。", "ctime": 1775121299, "time_str": "17:14:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260402/c675727194.shtml"}, {"id": "4179657", "title": "中央网信办等三部门开展2026年个人信息保护系列专项行动", "content": "2026年，中央网信办、工业和信息化部、公安部将会同相关部门，进一步深入治理App、SDK等服务产品以及互联网广告、教育、交通、卫生健康、金融等重点领域违法违规收集使用个人信息典型问题，着力提升人民群众满意度、获得感。相关部门将围绕以下重点问题开展系列专项行动：1.App、SDK违法违规收集使用个人信息专项治理。2.互联网广告领域违法违规收集使用个人信息专项治理。3.教育领域违法违规收集使用个人信息专项治理。4.交通领域违法违规收集使用个人信息专项治理。5.卫生健康领域违法违规收集使用个人信息专项治理。6.金融领域违法违规收集使用个人信息专项治理。7.个人信息相关违法犯罪案件专项打击治理。(人民财讯)", "ctime": 1775121138, "time_str": "17:12:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260402/c675727085.shtml"}, {"id": "4179655", "title": "外交部：中国的科技创新坚持开放合作", "content": "近日，2026中关村论坛年会发布《国家创新指数报告2025》，显示中国国家创新指数综合排名上升至世界第9位，是近十余年来进步最快的国家。外交部发言人毛宁2日在例行记者会上答问时表示，中国的科技创新坚持开放合作。中国将坚定不移推进高水平科技自立自强，以技术普惠推动全球共同发展。 毛宁说，中国政府始终将科技创新置于国家发展全局的核心位置。“十四五”期间，中国在新能源汽车、人工智能大模型、量子、生物学等领域取得一系列标志性原创成果，有力推动高质量发展，成为世界创新重要一极。 她表示，中国的科技创新坚持开放合作。上周中国宣布向各国开放“中国天眼”、“奋斗者”号载人潜水器等十大重大科研基础设施，将自主研发的国之重器转化为普惠全球的公共产品，以实际行动证明，科技创新的真正价值不在于垄断优势，而在于让更多人享受到技术进步带来的便利。 毛宁表示，展望“十五五”，中国将坚定不移推进高水平科技自立自强，以科技创新引领新质生产力发展，加强原始创新，加速产业转化，积极开放合作，以技术普惠推动全球共同发展。(新华社)", "ctime": 1775120994, "time_str": "17:09:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260402/c675726933.shtml"}, {"id": "4179651", "title": "王文涛主持召开第139届广交会筹备工作会", "content": "4月1日，商务部部长王文涛在广州主持召开第139届广交会筹备工作会。会议听取了第139届广交会筹备工作情况汇报，强调要将党中央决策部署抓实抓细、抓出成效，确保第139届广交会圆满成功，以实际行动践行“两个维护”。广东省委常委、副省长张国智、商务部部长助理张力参加会议。（商务部）", "ctime": 1775120967, "time_str": "17:09:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260402/c675726905.shtml"}, {"id": "4179649", "title": "民调：超六成美国人反对对伊朗的军事行动", "content": "美国相关媒体和一家民调公司于3月26日到30日联合开展的一项最新民意调查显示，与2月28日到3月1日的民调结果相比，美国人强烈反对对伊朗采取军事行动的比例显著上升，不满情绪越来越强烈。民调显示，目前反对针对伊朗军事行动的美国人比例已上升至66%，其中有43%的美国人表示强烈反对，较之前上升了12个百分点。67%的美国人称美国政府对处理伊朗一事没有清晰的计划。（央视新闻）", "ctime": 1775120924, "time_str": "17:08:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260402/c675726791.shtml"}, {"id": "4179641", "title": "乌方否认俄军完全占领卢甘斯克地区 称仍控制部分战略要地", "content": "当地时间4月2日，总台记者获悉，乌克兰联合部队通信部门负责人维克托·特列古博夫驳斥了俄罗斯关于已完全占领卢甘斯克地区的说法，并表示乌军目前仍控制着该地区的一部分，且前线局势保持稳定。特列古博夫表示，尽管俄罗斯国防部4月1日宣称其西部集群已夺取整个卢甘斯克地区，但这一说法并不属实。他指出，俄军虽然控制着该地区的大部分土地，但乌克兰军队依然坚守着一片具有战略意义的区域，且近期未发生重大变化。（央视新闻）", "ctime": 1775120845, "time_str": "17:07:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260402/c675726765.shtml"}, {"id": "4179639", "title": "伊朗军队总司令谈可能的地面战：“不允许敌方一人生还”", "content": "据伊朗伊斯兰共和国广播电视台2日报道，伊朗军队总司令阿米尔·哈塔米当天给作战指挥部下达命令说，必须保持极度警惕，严密监视美国和以色列动向，并在适当时机反制敌人。“一旦敌人发动地面战，绝不允许敌方一人生还。”(新华社)", "ctime": 1775120795, "time_str": "17:06:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260402/c675726738.shtml"}, {"id": "4179637", "title": "易方达原油证券投资基金：将于2026年4月3日开市起至当日10:30停牌", "content": "易方达原油证券投资基金（QDII）公告，近期基金二级市场交易价格明显高于基金份额净值。2026年3月31日，基金份额净值为1.71元，截至2026年4月2日，二级市场的收盘价为2.12元。为保护投资者利益，本基金将于2026年4月3日开市起至当日10:30停牌，自2026年4月3日10:30复牌。停牌期间，本基金赎回业务照常办理。", "ctime": 1775120700, "time_str": "17:05:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260402/c675726679.shtml"}, {"id": "4179635", "title": "华钰矿业：控股股东正在筹划公司股份协议转让事宜，股票将于4月3日开市起停牌", "content": "华钰矿业公告，因公司控股股东西藏道衡投资有限公司正在筹划公司股份协议转让事宜，该事项可能导致公司控制权发生变更，公司股票将于2026年4月3日开市起停牌，预计停牌时间不超过5个交易日。", "ctime": 1775120647, "time_str": "17:04:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260402/c675726655.shtml"}, {"id": "4179631", "title": "WTI原油大涨7%", "content": "WTI原油大涨7%，现报107.13美元/桶。NYMEX汽油主力合约大涨7%，现报3.31美元/加仑。", "ctime": 1775120470, "time_str": "17:01:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260402/c675726579.shtml"}, {"id": "4179625", "title": "软控股份：2025年净利润4.03亿元，同比下降20.36%", "content": "软控股份公告，2025年营业收入83.23亿元，同比增长15.95%。净利润4.03亿元，同比下降20.36%。公司董事会审议通过的利润分配预案为：以2025年12月31日的总股本10.24亿股为基数，向全体股东每10股派发现金红利0.2元（含税），送红股0股（含税），不以公积金转增股本。", "ctime": 1775120442, "time_str": "17:00:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260402/c675726569.shtml"}, {"id": "4179619", "title": "凤凰传媒：拟公开挂牌转让凤凰传奇61.03%股权及债权 挂牌价8261.64万元", "content": "凤凰传媒公告，拟通过江苏省文化产权交易所有限公司公开挂牌转让持有的凤凰传奇影业有限公司61.03%股 const SECTORS  = [{"name": "金融", "hit_count": 39, "etfs": []}, {"name": "数据要素", "hit_count": 21, "etfs": []}, {"name": "人工智能", "hit_count": 20, "etfs": []}, {"name": "军工", "hit_count": 13, "etfs": []}, {"name": "消费", "hit_count": 11, "etfs": []}, {"name": "医药", "hit_count": 9, "etfs": []}, {"name": "低空经济", "hit_count": 7, "etfs": []}, {"name": "半导体", "hit_count": 6, "etfs": []}];
const META     = {"update_time": "2026-04-02 17:46:35", "sentiment_score": 55.62770562770563, "agents": []};

// 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
