.score-bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s; }
.up { color: var(--red); }
.down { color: var(--green); }
.pulse { animation: pulse 2s infinite; }
@keyframes pulse {

  50% { opacity: 0.5; }

54:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260330/c675635134.shtml"}, {"id": "4161417", "title": "中马数据与算法训练中心项目正式启动", "content": "今天（3月30日），临港新片区管委会领导赴马来西亚赛城就深化两地数字经济合作开展调研，与当地政府及重点企业代表座谈交流，并见证中马数据与算法训练中心项目合作备忘录签约。作为临港新片区与赛城开展数据领域国际合作的重要试点，中马数据与算法训练中心项目由上研智联与Skyvast联合发起，双方将围绕数据便捷流动、智算设施共享、算法模型训练、法规政策互认等4个方面开展合作探索，重点聚焦智能驾驶、具身智能等领域，全力赋能来数加工、数据出海等新兴业务发展。临港新片区党工委副书记吴晓华、马来西亚首相署特别事务官BryanLew、CyberviewFuturise首席执行官ShafinasSalim以及临港新片区管委会有关部门、上研智联、Cyberview、Skyvast相关代表出席活动。(上海临港)", "ctime": 1774860767, "time_str": "16:52:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260330/c675635066.shtml"}, {"id": "4161413", "title": "赛升药业：2025年度拟向全体股东每10股派发现金股利人民币0.3元（含税）", "content": "赛升药业公告，公司2025年度拟向全体股东每10股派发现金股利人民币0.3元（含税），共计分配股利1445万元。2025年度合并报表中实现归属于上市公司股东的净利润为1457.1万元，母公司2025年度净利润为4820.13万元。", "ctime": 1774860711, "time_str": "16:51:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260330/c675635039.shtml"}, {"id": "4161411", "title": "赛升药业：2025年净利润1457.1万元，同比扭亏", "content": "赛升药业公告，2025年营业收入4.05亿元，同比下降2.82%。净利润1457.1万元，上年同期为净亏损6885.31万元。拟向全体股东每10股派发现金红利0.3元（含税）。", "ctime": 1774860707, "time_str": "16:51:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260330/c675635037.shtml"}, {"id": "4161409", "title": "猪价跌破10元关口、猪企深度亏损，“底部反转”信号来了？", "content": "近期国内生猪价格加速探底，价格跌破10元/公斤关口，报9.33元/公斤。截至3月30日，猪价年内跌幅扩大至约24%，当前水平已跌至2009、2014、2018年多轮猪周期的历史底部区间。生猪期货各合约接连刷新上市以来历史最低点，亦反映市场对二季度猪价的悲观情绪。过去两年市场已多次出现 “底部已至”的讨论，最终都被持续下跌的猪价证伪。而今年一季度猪价持续深跌，全行业养殖亏损不断加剧，叠加高盛、摩根士丹利、瑞银等外资机构对生猪产业的关注度大幅提升，再次让本轮猪周期能否迎来真正的底部反转，成为生猪产业链上下游、资本市场共同聚焦的核心议题。（第一财经）", "ctime": 1774860684, "time_str": "16:51:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false url": "https://news.10jqka.com.cn/20260330/c675633948.shtml"}, {"id": "4161281", "title": "大摩：霍尔木兹冲击消耗石油缓冲库存 维持高油价预期", "content": "摩根士丹利分析师Martijn Rats的团队发表报告称，石油市场“在冲击来临前有过的充足缓冲库存，但如今正被持续消耗”。该机构估计，目前约有1,020万桶/日的原油产量、120万桶/日的天然气凝液产量以及200万桶/日的中东炼油产能处于停摆状态。该机构预计，霍尔木兹海峡将一直处于事实上的关闭状态，直至4月底。摩根士丹利维持对布伦特原油价格的预测不变，预计第二季度均价为110美元/桶，第三季度为100美元/桶。（财联社）", "ctime": 1774859459, "time_str": "16:30:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260330/c675633943.shtml"}, {"id": "4161277", "title": "三菱扶桑因软件问题召回超3.4万辆大型卡车", "content": "当地时间3月30日，三菱扶桑卡客车公司向日本国土交通省提交召回申请，涉及2021年4月至2026年2月期间生产的大型卡车共计34092台。该公司表示，由于控制尾气净化装置的软件存在问题，即使装置发生故障，车载监测系统也可能无法显示警告信息。日本国土交通省称，目前尚未收到相关故障或事故报告。对此，该公司将通过修复软件进行应对。（央视新闻）", "ctime": 1774859421, "time_str": "16:30:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260330/c675633936.shtml"}, {"id": "4161253", "title": "时隔近十年再“破冰”：央企功能界定管理办法即将出台", "content": "一场关乎几十万亿元国有资产“身份”与“使命”的重塑，正在悄然进入最后的关键节点。从多名接近国资监管部门的核心人士处独家获悉，一份旨在填补国资监管体制机制空白的《中央企业功能界定管理办法》（下称“办法”）有望在近期正式出台。这距离上一轮中央企业功能界定与分类工作的完成，已经过去了近十年。与此前那份以“划分赛道”为主要目的的分类方案不同，即将出台的办法，核心在于解决一个更深层的问题：当央企被要求兼顾安全与效益，我们究竟该如何科学、准确地衡量一家央企的价值？它创造的那些无法直接用利润表体现的战略价值，又该如何在监管体系中获得应有的“名分”？一名参与办法讨论的国资人士向经济观察报坦言，现行的考核体系在面对公益类企业时，长期存在制度性冲突。这种“制度性冲突”，既要求央企做赚钱的事业，又要求央企做不赚钱的事业。新办法的出台，将首次从部门规章的层面，打破这一僵局，并在后期细化“国有企业增加值核算方法”。这或将对中央企业的投资决策、考核导向乃至账本呈现方式，产生深远影响。(经济观察网)", "ctime": 1774859255, "time_str": "16:27:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260330/c675633878.shtml"}, {"id": "4161249", "title": "百花医药：公司股份协议转让可能导致控制权变更 公司股票将于2026年3月31日开市起停牌", "content": "百花医药公告，公司控股股东、实际控制人正在筹划公司股份协议转让事宜，该事项可能导致公司控制权发生变更。公司股票将于2026年3月31日开市起停牌，预计停牌时间不超过2个交易日。", "ctime": 1774859229, "time_str": "16:27:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260330/c675633869.shtml"}, {"id": "4161245", "title": "大有能源：公司银行账户资金被冻结1.04亿元", "content": "大有能源公告，公司因涉及两起诉讼案件，银行账户资金被冻结1.04亿元。案件一涉及上饶市上投贸易有限公司，涉案金额为8887.84万元；案件二涉及江西铜源国际供应链有限公司，涉案金额为5931.95万元。公司表示，本次涉诉案件尚未开庭审理，诉讼结果尚存在不确定性，暂无法判断对公司利润的影响。", "ctime": 1774859151, "time_str": "16:25:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260330/c675633840.shtml"}, {"id": "4161243", "title": "*ST星农：收到浙江证监局下发的《行政处罚决定书》", "content": "*ST星农公告，公司及相关人员收到浙江证监局下发的《行政处罚决定书》。经查明，2023年，*ST星农全资子公司虚增营业收入6072.74万元，占当期披露营业收入的19.69%；虚增利润总额528.95万元，占当期披露利润总额绝对值的9.77%，导致2023年年度报告存在虚假记载。因此，对*ST星农给予警告，并处以250万元罚款；对何德军、郑斌、刘涛给予警告，并分别处以120万元罚款；对吴海娟给予警告，并处以80万元罚款。", "ctime": 1774859146, "time_str": "16:25:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260330/c675633839.shtml"}, {"id": "4161241", "title": "伊朗称将继续惩罚侵略者 确保战争不会重演", "content": "伊朗代理国防部长对土耳其国防部长表示，伊朗将继续“惩罚侵略者、建立威慑，并确保战争不会重演”。（央视新闻）", "ctime": 1774859110, "time_str": "16:25:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260330/c675633826.shtml"}, {"id": "4161239", "title": "华锐精密：预计2026年第一季度净利润同比增加413.28%到550.15%", "content": "华锐精密公告，预计2026年第一季度实现归属于母公司所有者的净利润为1.5亿元到1.9亿元，与上年同期相比，将增加1.21亿元到1.61亿元，同比增加413.28%到550.15%。预计2026年第一季度实现归属于母公司所有者的扣除非经常性损益的净利润为1.4亿元到1.8亿元，与上年同期相比，将增加1.12亿元到1.52亿元，同比增加395.92%到537.61%。报告期内，在主要原材料碳化钨价格持续上涨的背景下，公司依托资金与规模双重优势，产品整体实现量价齐升；同时，伴随营业收入增长带来的规模效应，公司期间费率有所下降。", "ctime": 1774859033, "time_str": "16:23:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260330/c675633801.shtml"}, {"id": "4161235", "title": "市场监管总局：着力防治平台经济、光伏等重点行业和领域“内卷式”竞争", "content": "国家市场监督管理总局30日发布《关于进一步贯彻实施〈中华人民共和国反不正当竞争法〉的通知》，对准确把握贯彻实施反不正当竞争法的工作重点、积极推动反不正当竞争法有效实施等内容提出要求。 通知强调，综合整治“内卷式”竞争。着力防治平台经济、光伏、锂电池、新能源汽车等重点行业和领域“内卷式”竞争。精准辨识和依法查处平台企业无正当理由，利用搜索排名、经营评价等手段，强制或者变相强制平台内经营者以低于成本的价格销售商品。压实平台经营者处置不正当竞争行为的责任义务，督促平台明确平台内公平竞争规则。防止平台经营者借审核管理不当干预平台内经营者的自主经营权。 通知明确，强化网络不正当竞争行为监管。统筹好活力和秩序的关系，完善网络竞争规则，着力提升对网络不正当竞争行为的常态化监管水平。及时应对各类新型网络不正当竞争行为，有效规制利用数据和算法、技术、平台规则等实施不正当竞争行为。及时总结监管实践经验，推动研究制定《禁止网络不正当竞争条例》。 此外，通知还明确了防治大型企业等经营者拖欠中小企业账款、加强商业秘密保护、探索反不正当竞争域外执法等工作重点。(新华社)", "ctime": 1774858967, "time_str": "16:22:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260330/c675633785.shtml"}, {"id": "4161233", "title": "油价上涨引发乘数效应 中东战火烧向纺织品饮料", "content": "近期，也门胡塞武装向以色列南部发射多枚弹道导弹。随着胡塞武装入场，红海关键航道曼德海峡的风险也明显升温。分析人士警告，这场冲突对油市的冲击正在不断放大，一旦再持续数周，即便后续局势缓和，供应恢复也难以及时跟上，全球原油库存可能会被大幅消耗。油价的冲击不会只停留在能源端，而是会通过石脑油等基础原料，向下游石化产业链传导，最终进入塑料等产品，渗透到几乎所有消费品当中。能源咨询公司KSG的创始人指出，由于全球大量商品都依赖塑料进行包装和运输，受影响的日常商品范围将十分广泛，石化产品的短缺和价格上涨，将逐步传导至纺织品、洗涤剂、食品、饮料等多个领域。 供应链分析公司Altana的联合创始人施瓦茨表示，石化市场的冲击是有“乘数效应”的，也就是说，一次成本上升，会在产业链中被层层放大。Altana的数据显示，海湾地区运输了总规模大约7330亿美元的石化原料、中间品和成品，这些会进一步影响到大约3.8万亿美元的下游商品，从牙膏到毛巾，几乎覆盖各类日常消费。 (央视财经)", "ctime": 1774858955, "time_str": "16:22:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260330/c675633780.shtml"}, {"id": "4161229", "title": "伊朗军方称袭击了阿联酋境内美军阵地及雷达站", "content": "据伊朗《德黑兰时报》30日报道，伊朗军方发布声明称其无人机于29日夜间至30日凌晨，袭击了阿联酋境内美军阵地及雷达站。(新华社)", "ctime": 1774858918, "time_str": "16:21:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260330/c675633765.shtml"}, {"id": "4161223", "title": "潞安环能：目前未涉及煤制油相关项目", "content": "潞安环能3月30日在互动平台表述，公司主业为煤炭开采，目前未涉及煤制油相关项目。（人民财讯）", "ctime": 1774858848, "time_str": "16:20:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260330/c675633696.shtml"}, {"id": "4161215", "title": "财政部：2026年积极配合推进消费税法等立法工作", "content": "2026年，财政部将加快推进财政法律法规立改废，落实全国人大常委会立法工作计划、国务院立法工作计划，积极配合推进注册会计师法（修改）、消费税法、政府采购法（修改）、税收征收管理法（修改）、社会救助法、国有资产法等立法工作。财政部3月30日发布财政部2025年法治政府建设年度报告，明确了上述安排。(新华社)", "ctime": 1774858610, "time_str": "16:16:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260330/c675633645.shtml"}, {"id": "4161213", "title": "杰瑞股份：公司签署3.41亿美元燃气轮机发电机组销售合同", "content": "杰瑞股份公告，近日全资子公司GenSystems Power Solutions LLC（简称“GPS”）与美国某客户签署了燃气轮机发电机组销售合同，合同金额为3.41亿美元（约合23.59亿元人民币），约占公司2024年度经审计营业收入的17.66%，预计将对公司未来经营业绩产生积极影响。合同是自2025年11月以来，公司与美国客户签署的第五份燃气轮机发电机组销售合同，交易对手方为公司近期在美合作的第四家客户。", "ctime": 1774858515, "time_str": "16:15:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260330/c675633620.shtml"}, {"id": "4161209", "title": "中证协摸底证券行业电子认证服务投入情况，聚焦系统改造的计划投入预算等", "content": "从业内独家获悉，为进一步摸清行业电子认证服务投入情况，中国证券业协会近日启动了证券经营机构电子认证服务投入情况调研工作。调研重点聚焦于证券经营机构电子认证服务投入总体情况、外部采购数字证书情况以及未来3年内针对CA（数字证书认证）系统改造的计划投入预算情况。(中证金牛座)", "ctime": 1774858376, "time_str": "16:12:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260330/c675633586.shtml"}];

  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
