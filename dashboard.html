.score-bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s; }
.up { color: var(--red); }
.down { color: var(--green); }
.pulse { animation: pulse 2s infinite; }
@keyframes pulse {

  50% { opacity: 0.5; }

%已回购股份", "content": "康希通信公告，公司拟于2026年11月4日至2027年2月3日，通过集中竞价交易方式出售不超过380.72万股已回购股份，占公司目前总股本的0.8969%；所得资金将用于补充公司流动资金。该计划已获2026年10月12日召开的第二届董事会第二十次会议审议通过。", "ctime": 1791887863, "time_str": "18:37:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261013/c680648275.shtml"}, {"id": "5374985", "title": "信宇人：公司及实际控制人杨志明2026年10月13日被立案", "content": "信宇人公告，公司及实际控制人杨志明于2026年10月13日收到中国证监会立案告知书，因涉嫌信息披露违法违规，中国证监会决定对公司及杨志明立案。立案调查期间，公司各项经营活动和业务均正常开展，并将积极配合中国证监会相关工作。", "ctime": 1791887856, "time_str": "18:37:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261013/c680648272.shtml"}, {"id": "5374983", "title": "金桥信息：拟设两家杭州子公司，投资3000万元", "content": "金桥信息公告，公司拟在杭州设立两家下属子公司，投资金额合计3000万元：公司以自有资金2000万元设立全资子公司金筑云桥，金桥亦法与金桥科技分别出资900万元、100万元设立金启桥。公司董事会已于2026年10月13日审议通过相关议案；截至公告披露日，两家子公司尚未设立，尚需当地市场监督管理部门审批、核准及备案。", "ctime": 1791887851, "time_str": "18:37:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261013/c680648270.shtml"}, {"id": "5374981", "title": "聚焦人工智能伦理 《具身智能伦理治理研究报告》发布", "content": "国家人工智能标准化总体组今天（10月13日）发布《具身智能伦理治理研究报告》。报告聚焦具身智能伦理治理，系统总结，从全生命周期治理、技术防护和标准引领等方面提出治理方案。据了解，具身智能伦理属于人工智能伦理的分支。报告梳理了六类伦理风险，包括人的自主性、社会关系与发展权益受损，人身伤害与公共安全，隐私侵害与个人信息滥用，偏见歧视与服务排斥，身份误认与能力高估，责任不明与事件还原困难等，按照损害后果的严重程度划分了R1至R5的五级风险级别，围绕风险类别提出了以人为本、安全可控、隐私保护、公平包容、透明可解释、责任可追溯六项基本治理准则。中国电子技术标准化研究院信息技术研究中心副主任张士宗：将伦理要求融入立项设计、研发集成、部署启用、运行服务和停服退役，明确各环节的保护要求和主体责任。技术防护方面，通过动作约束保障身体安全，通过采集控制保护感知数据，通过身份提示和退出功能保障自主选择。张士宗表示，将围绕基础共性、治理技术、治理管理和场景应用制定标准体系。我国将加快推进《人工智能 具身智能伦理治理指南》等国家标准研制，系统开展风险分类分级、保护功能要求、验证测试方法和责任追溯机制等标准研究，推动伦理治理要求融入具身智能产品立项设计、研发集成、部署运行全生命周期。（央视新闻）", "ctime": 1791887850, "time_str": "18:37:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261013/c680648269.shtml"}, {"id": "5374939", "ti tps://news.10jqka.com.cn/20261013/c680648086.shtml"}, {"id": "5374635", "title": "我国首例绿氨船对船加注在浙江舟山完成", "content": "记者今天（10月13日）从中国能建获悉，我国首例绿氨船对船加注作业在浙江舟山完成。这标志着绿氨从生产、储运到海上加注、船舶应用实现全链条贯通，我国绿色船用燃料规模化供应和商业化实践迈出关键一步。（央视新闻）", "ctime": 1791886907, "time_str": "18:21:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261013/c680647981.shtml"}, {"id": "5374633", "title": "今天国际：董事长邵健锋增持计划时间过半，累计增持10万股", "content": "今天国际公告，公司此前披露董事长邵健锋计划在增持计划公告披露之日起6个月内增持公司股份，计划增持金额为人民币1000万元（含本数）-1500万元（含本数）。截至公告披露日，计划实施期限已过半，邵健锋已累计增持10万股，占公司总股本的0.02%，累计增持金额为人民币72万元；增持计划尚未实施完毕。", "ctime": 1791886864, "time_str": "18:21:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261013/c680647964.shtml"}, {"id": "5374617", "title": "字节赛豆合作品牌第二款车型预计为SUV，考虑采用换电方案", "content": "从知情人士处获悉，赛豆科技AIVA品牌的第二款车型预计为SUV，将考虑采用换电方案。至于是否与宁德时代巧克力换电合作，该知情人士称，最终换电合作方案暂未确定，“还没定义清楚。”据了解，“巧克力换电”整体解决方案由宁德时代全资子公司时代电服科技有限公司推出。官方信息显示，截至今年9月29日，“巧克力换电”全国累计建成换电站超2520座，站点落地覆盖31省200城，近2万块宁德全新电池完成入仓部署。而赛豆科技则由国资、赛力斯、宁德时代及多方产业资本共同参与，其前身为重庆蓝电科技有限公司，于今年5月底正式更名。（蓝鲸财经）", "ctime": 1791886793, "time_str": "18:19:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261013/c680647934.shtml"}, {"id": "5374613", "title": "韩国公布政府核心部门大规模搬迁计划", "content": "韩国行政安全部13日宣布，韩国外交部、统一部、国防部等政府核心部门将不晚于2031年从首都首尔迁往世宗特别自治市。这一政府机构搬迁计划将影响近万名公务员。世宗市位于首尔以南大约110公里处，2012年7月启用。搬迁工作于2012年首次开始，国务总理室、文化体育观光部等40多个政府部门和公共机构已完成搬迁。根据13日公布的政府核心机构搬迁计划，2027年到2031年，总计44个政府部门和公共机构将分阶段搬迁，具体取决于特定部门的需求和办公空间可用性。(央视新闻)", "ctime": 1791886748, "time_str": "18:19:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261013/c680647920.shtml"}, {"id": "5374609", "title": "泽连斯基称俄发动大规模空袭 乌方19个地区遭打击", "content": "当地时间12日，乌克兰总统泽连斯基在社交媒体上表示，俄罗斯动用超百件各类攻击性武器对乌克兰全境发起大规模空袭，乌19个地区遭打击。\n\n泽连斯基称，本轮袭击造成平民伤亡。哈尔科夫一栋居民楼被摧毁，已确认4人死亡、41人受伤。\n\n泽连斯基还表示，基辅民用基础设施遭5枚弹道导弹袭击。此次袭击未收到任何合作伙伴预警，缺失情报预警导致防空避险工作被动，凸显弹道导弹预警对保护平民安全、降低伤亡的关键作用。(央视新闻)", "ctime": 1791886697, "time_str": "18:18:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261013/c680647899.shtml"}, {"id": "5374599", "title": "道恩股份：预计2026年前三季度净利润同比增长117.38%-194.10%", "content": "道恩股份公告，预计2026年前三季度归属于上市公司股东的净利润为2.84亿元—3.84亿元，上年同期为1.31亿元，同比增长117.38%-194.10%；扣非净利润预计为2.35亿元—3.35亿元，上年同期为1.22亿元，同比增长93.25%-175.60%。公司称，业绩增长与推进新领域、新产品开发、整合子公司业务，以及自2026年2月起合并宁波爱思开合成橡胶有限公司报表有关。", "ctime": 1791886597, "time_str": "18:16:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261013/c680647839.shtml"}, {"id": "5374597", "title": "此芯科技推桌面级AI超算AGX Station 对标英伟达DGX Spark", "content": "在2026中国工博会国芯展上，此芯科技发布桌面级AI超算中心AGX Station，对标英伟达DGX Spark。该产品搭载其自研6nm智能体SoC此芯P1（Armv9.2架构，集成12核CPU与30至45 TOPS NPU），原生支持7B至35B模型推理，开放式扩展算力可达350 TOPS，已全面适配122B模型，峰值算力可支撑150B模型部署与运行，整机体积仅150×150×60mm，配套的Agentic OS 2.0覆盖本地推理到Token计费全链路。(科创板日报)", "ctime": 1791886583, "time_str": "18:16:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261013/c680647823.shtml"}, {"id": "5374595", "title": "川投能源：2026年第三季度净利润20.76亿元，同比增长17.91%", "content": "川投能源公告，2026年第三季度营业收入4.44亿元，同比增长3.71%；归母净利润20.76亿元，同比增长17.91%；扣非净利润20.76亿元，同比增长18.40%。2026年前三季度营业收入11.24亿元，同比下降1.43%；归母净利润44.05亿元，同比增长4.36%；扣非净利润43.99亿元，同比增长4.51%。", "ctime": 1791886525, "time_str": "18:15:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261013/c680647772.shtml"}, {"id": "5374587", "title": "安奈儿：首次回购公司股份96.06万股，支付1227.06万元", "content": "安奈儿公告，公司此前审议通过回购方案，拟使用自有资金回购公司股份，资金总额不低于人民币4000万元（含）且不超过人民币8000万元（含），回购价格不超过人民币19.08元/股（含），回购股份用于注销并减少注册资本及实施股权激励计划或员工持股计划。2026年10月12日， name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261013/c680647610.shtml"}, {"id": "5374507", "title": "IMF呼吁采取行动防范三大金融稳定风险", "content": "国际货币基金组织（IMF）13日发布《全球金融稳定报告》说，针对全球金融市场脆弱性持续加剧，政策制定者应采取行动，包括遏制杠杆、增强债务可持续性以及加强网络防御能力等。报告认为，在经济稳健增长和企业盈利强劲的背景下，全球金融市场保持韧性，金融条件相对宽松，但金融稳定风险有所上升。报告着重指出三项突出风险。首先，人工智能（AI）投资和盈利能力减弱或持续下降，可能引发AI相关资产价格回调，同时杠杆上升、风险敞口集中等会加剧这一回调。其次，通胀再度抬头或对财政状况的担忧，可能促使主权债券收益率急剧上升，引发更广泛的市场动荡。最后，随着金融服务数字化和互联互通，网络威胁正构成日益严重的系统性风险。（新华社）", "ctime": 1791885936, "time_str": "18:05:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261013/c680647555.shtml"}, {"id": "5374325", "title": "重庆市委原副书记、市政府原市长黄奇帆被查", "content": "重庆市委原副书记、市政府原市长黄奇帆涉嫌严重违纪违法，目前正接受中央纪委国家监委纪律审查和监察调查。（央视新闻）", "ctime": 1791885629, "time_str": "18:00:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261013/c680647350.shtml"}, {"id": "5374245", "title": "联合健康美股盘前涨超4%", "content": "联合健康美股盘前涨超4%，公司预计全年调整后每股收益至少20.50美元，此前预期为19.50至20美元。", "ctime": 1791885499, "time_str": "17:58:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261013/c680647255.shtml"}, {"id": "5374229", "title": "香江控股：全资子公司与关联方签1.58亿元算力技术服务合同", "content": "香江控股公告，2026年10月13日，全资子公司香江云瀚与关联方诚雅泰公司签订《算力技术服务合同》，诚雅泰拟委托香江云瀚为其部署在目标机房的IT设备提供全周期配套高阶技术服务。预计合同总金额为1.58亿元，合同服务期限为5年，诚雅泰按月向香江云瀚支付配套技术服务费。本事项已经第十一届董事会第九次会议审议通过，无需提交股东会审议，不构成重大资产重组。", "ctime": 1791885361, "time_str": "17:56:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261013/c680647162.shtml"}, {"id": "5374189", "title": "中国人保：谭炯董事长任职资格获核准，2026年10月12日生效", "content": "中国人保公告，公司于2026年8月28日召开2026年第一次临时股东会，选举谭炯先生为第五届董事会执行董事；近日收到国家金融监督管理总局批复，已核准谭炯担任公司董事、董事长的任职资格，上述任职自2026年10月12日起生效。", "ctime": 1791885218, "time_str" // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {

    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';

  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },

    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
