}
.score-bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s; }
.up { color: var(--red); }
.down { color: var(--green); }
.pulse { animation: pulse 2s infinite; }
@keyframes pulse {

  50% { opacity: 0.5; }

03:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261103/c681418096.shtml"}, {"id": "5553803", "title": "明阳电路：近期生产经营情况及内外部经营环境未发生重大变化", "content": "明阳电路公告，公司股票于2026年10月30日、11月2日、11月3日连续三个交易日收盘价格涨幅偏离值累计超过30%，属于股票交易异常波动。公司称近期生产经营情况及内外部经营环境未发生重大变化，生产经营正常；公司、控股股东和实际控制人不存在关于公司的应披露而未披露的重大事项，也不存在处于筹划阶段的重大事项。控股股东、实际控制人在异常波动期间不存在买卖公司股票的情形。公司此前披露，控股股东、实际控制人、董事长兼代总经理张佩珂及其一致行动人计划减持公司股份。", "ctime": 1793703760, "time_str": "19:02:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261103/c681418086.shtml"}, {"id": "5553775", "title": "美国东部多州开启中期选举投票", "content": "美东时间11月3日，美国中期选举迎来正式投票日，康涅狄格州、新泽西州、弗吉尼亚州等东部多州已陆续开启投票，佛蒙特州部分投票站稍早开放。今年共和党与民主党将角逐国会众议院全部435个席位和参议院100个席位中的35个，选民还将选出36个州州长及部分州州议会议员等地方公职人员。截至当地时间10月31日，已有创纪录的5000万人提前投票。此次选举被视为对美国民众对特朗普政府近两年执政表现的一次评分，也将影响两党未来两年在国会的力量对比及各州影响力。（央视新闻）", "ctime": 1793703697, "time_str": "19:01:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261103/c681418072.shtml"}, {"id": "5553769", "title": "均胜电子：拟以1.5亿元-3亿元回购公司股份", "content": "均胜电子公告，拟以集中竞价交易方式回购公司股份，回购资金总额不低于人民币1.5亿元（含），不超过人民币3亿元（含），回购价格不超过人民币30元/股。本次回购的股份将全部予以注销并减少公司注册资本。回购期限为自公司股东会审议通过本次回购方案之日起12个月内，资金来源为公司自有资金及自筹资金。方案尚需提交公司股东会审议。", "ctime": 1793703675, "time_str": "19:01:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261103/c681418024.shtml"}, {"id": "5553637", "title": "卡塔尔外交部发言人：与美伊双方的会谈取得进展", "content": "据路透社3日报道，卡塔尔外交部发言人3日表示，与美伊双方的会谈取得进展，地区及海湾地区已达成共识，避免局势升级。美国和伊朗目前正在审议卡方作为调解方提供的提议，美伊双方均致力于调解进程。卡方“抱有希望”，认为仍有机会达成一项为未来谈判营造环境的协议。（新华社）", "ctime": 1793703296, "time_str": "18:54:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261103/c681417369.shtml"}, {"id": "5553619", "title": "福建首个跨域异构调度全服务词元工厂上线运行", "content": "福建省首个跨域异构调度全服务词元工厂——“闽都睿词”人工智能产业服务平台11月3日在福州市闽清县正式上线运行。平台聚合DeepSeek、Kimi等14款主流大模型，兼容多种国产芯片，可为企业、科研机构等用户提供算力调度、模型供给、应用落地、词元结算、金融支持等服务。", "ctime": 1793703019, "time_str": "18:50:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261103/c681417269.shtml"}, {"id": "5553611", "title": "俄确认俄美乌三方会谈时间地点", "content": "俄罗斯总统新闻秘书佩斯科夫3日在吹风会上对媒体表示，俄罗斯、美国、乌克兰围绕乌克兰问题的三方会谈将于11月10日至11日在阿联酋首都阿布扎比举行。\n\n佩斯科夫介绍说，此次会谈的俄方代表团仍将由俄总统助理梅金斯基率领。(新华社)", "ctime": 1793702852, "time_str": "18:47:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261103/c681417216.shtml"}, {"id": "5553609", "title": "京津冀三地推进交通运输科技创新协同", "content": "首届京津冀交通运输科技创新协同发展大会3日在河北雄安新区召开，京津冀三地交通运输主管部门共同签署《京津冀交通运输科技创新合作框架协议》，标志着京津冀交通运输科技创新协同迈入制度化、机制化合作新阶段。\n\n近年来，京津冀三地坚持“一张图规划、一盘棋建设、一体化发展”，交通运输行业面貌发生深刻变革：综合立体交通网络持续织密，交通“一卡通”实现互联互通，大数据、互联网、人工智能等新技术与交通行业加快融合。(新华社)", "ctime": 1793702811, "time_str": "18:46:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261103/c681417201.shtml"}, {"id": "5553603", "title": "涪陵电力：国家电网批准无偿划转6.4亿股，尚待交易所确认", "content": "涪陵电力公告，国网综合能源服务集团有限公司此前拟将重庆川东电力集团有限责任公司持有的公司6.4亿股股份（占上市公司总股本的41.65%）无偿划转至国网综能集团。本次进展为，国家电网有限公司已完成审核批准，国网综能集团与川东电力于2026年11月2日签署《股权无偿划转协议》；划转尚需上海证券交易所进行合规性确认，并在中国证券登记结算有限责任公司上海分公司完成过户登记。划转完成后，公司直接控股股东将由川东电力变更为国网综能集团，实际控制人仍为国务院国资委。", "ctime": 1793702705, "time_str": "18:45:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261103/c681417157.shtml"}, {"id": "5553595", "title": "华福证券中标央行第三批互换便利操作12亿元", "content": "记者获悉，华福证券再度中标央行第三批互换便利（SFISF）操作，中标费率10bp，规模12亿元。华福证券2024年12月获批开展SFISF业务，成为第二批获准参与该工具操作的券商之一，并于2024年12月31日完成首笔投标落地，目前已持续、稳健运用首笔工具开展业务。华福证券表示，将加快本次中标额度使用和业务落地，持续提升资金使用效率和服务资本市场能力，同时坚守金融机构主体责任，助力宏观政策落地实施。（财联社）", "ctime": 1793702581, "time_str": "18:43:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261103/c681417115.shtml"}, {"id": "5553593", "title": "外交部回应“英伟达要求其合作伙伴必须将至少51％的服务提供给非中国企业”有关报道", "content": "11月3日，外交部发言人毛宁主持例行记者会。有记者提问，据《金融时报》报道，英伟达要求一些数据中心合作伙伴必须将至少51％的服务提供给非中国企业，此举或限制中国企业获取人工智能关键技术。毛宁表示，具体情况她不了解，中方一贯认为各方应当按照公平、透明、非歧视的原则开展合作。（央视新闻）", "ctime": 1793702574, "time_str": "18:42:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261103/c681417110.shtml"}, {"id": "5553567", "title": "卧龙电驱：李凤仙增持4万股，占总股本0.0026%", "content": "卧龙电驱公告，控股股东卧龙控股的一致行动人李凤仙于2026年11月2日通过集中竞价交易方式增持公司股份4万股，占总股本0.0026%，增持金额为90.6万元（不含交易费用）。增持完成后，李凤仙及其一致行动人持股6.08亿股，占总股本38.9116%。本次增持不触及权益变动，不会导致公司控股股东及实际控制人发生变化；卧龙控股及其一致行动人后续暂无增持计划。", "ctime": 1793702266, "time_str": "18:37:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261103/c681417006.shtml"}, {"id": "5553565", "title": "中国银河证券中标互换便利操作，拟继续开展权益资产配置", "content": "记者获悉，中国银河证券已申报参与第三次互换便利操作并中标。公司表示，将继续强化多部门协同，合力提供质押券，统筹做好申报所需资产准备，顺利完成申报投标工作，为后续互换操作及融资投资落地奠定基础。本次申报资金拟延续前期投资方向，支持公司持续开展权益市场的长期资产配置。（人民财讯）", "ctime": 1793702234, "time_str": "18:37:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261103/c681416994.shtml"}, {"id": "5553559", "title": "伊朗军方：任何侵略都将招致“更加广泛、有力”回应", "content": "伊朗军方发言人阿克拉米尼亚3日警告称，任何针对伊朗的侵略都将招致“更加广泛、有力”的回应。阿克拉米尼亚称，美国若采取进一步侵略行动，将立即遭到“毁灭性”回击，其规模远超以往。若爆发新一轮战争，冲突范围恐将不限于西亚地区。他还表示，伊朗武装部队正根据最高领袖的指示更新“目标库”，包括“敌方”各类资产。（新华社）", "ctime": 1793702085, "time_str": "18:34:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261103/c681416930.shtml"}, {"id": "5553557", "title": "华海清科：拟以5000万元-1亿元回购公司股份", "content": "华海清科公告，拟使用自有资金以集中竞价交易方式回购股份，金额不低于人民币5000万元（含）、不超过人民币1亿元（含），回购价格不超过人民币335元/股。回购股份拟用于股权激励计划，若未能在股份回购实施结果暨股份变动公告日后3年内使用完毕，未使用股份将予以注销。回购方案尚需提交股东会审议，实施期限为股东会审议通过之日起不超过12个月。", "ctime": 1793702043, "time_str": "18:34:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261103/c681416895.shtml"}, {"id": "5553553", "title": "卡塔尔外交部：美伊正在研究卡方的斡旋建议 相关磋商取得进展", "content": "卡塔尔外交部发言人11月3日表示，卡塔尔为弥合美伊分歧开展的斡旋努力仍在继续，美伊双方正在研究卡塔尔斡旋方提出的建议，以推动双方达成协议；卡塔尔与美伊双方的磋商取得一定进展。11月2日夜间前往伊朗首都德黑兰的卡塔尔调解代表团已返回多哈，相关磋商仍在继续。发言人还强调，地区国家和海湾国家在避免局势进一步升级方面立场一致，各国领导人正保持高度协调，努力寻求危机解决方案，避免局势升级带来严重后果。（央视新闻）", "ctime": 1793701947, "time_str": "18:32:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261103/c681416860.shtml"}, {"id": "5553533", "title": "伊朗称三艘油轮在霍尔木兹海峡起火", "content": "当地时间3日，伊朗伊斯兰革命卫队海军表示，自当天凌晨开始，有三艘油轮在霍尔木兹海峡非法航道上航行时发生爆炸。这些油轮因关闭导航和识别系统，并擅自驶入霍尔木兹海峡的非法航道触雷爆炸，目前搁浅在霍尔木兹海峡南岸。\n\n伊朗伊斯兰革命卫队海军宣布，伊朗已通过电台和海军广播多次向所有船只告知霍尔木兹海峡的航行规则，并警告任何船只，如果违反或无视这些规则将导致此类事件的发生。(央视新闻)", "ctime": 1793701820, "time_str": "18:30:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261103/c681416802.shtml"}, {"id": "5553525", "title": "趣睡科技：累计回购12.72万股，最高40元/股、最低38.02元/股，已使用总金额499.67万元", "content": "趣睡科技公告，公司此前审议通过回购方案，拟使用不低于人民币500万元（含）且不超过人民币1000万元（含）自有或自筹资金回购股份，回购价格不超过64元/股，用于股权激励或员工持股计划。截至2026年10月30日，公司累计回购12.72万股，占目前总股本0.2450%，最高成交价40元/股，最低成交价38.02元/股，已使用总金额人民币499.67万元（不含交易费用）。", "ctime": 1793701743, "time_str": "18:29:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261103/c681416770.shtml"}, {"id": "5553521", "title": "中欧班列中通道年内通行量突破4000列", "content": "11月3日，随着一列满载汽车配件和日用百货的中欧班列从二连浩特铁路口岸驶向欧洲，中欧班列中通道今年以来通行量突破4000列。二连浩特口岸是中欧班列中通道唯一进出境口岸，目前运行线路达76条，通达德国、波兰等10余个国家的70多个枢纽站点。进口货物以板材、牛皮纸及铝锭为主，出口货物包括新能源汽车、家用电器和日用百货等，高附加值、高科技产品占比稳步提升。截至11月2日，口岸年内通行中欧班列运输货物390.2万吨，同比增长24.6%。（新华社）", "ctime": 1793701708, "time_str": "18:28:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261103/c681416758.shtml"}, {"id": "5553519", "title": "中国人民银行行长潘功胜会见阿曼中央银行行长艾哈迈德·穆萨米", "content": "2026年11月2日，中国人民银行行长潘功胜会见了阿曼中央银行行长艾哈迈德·穆萨米。双方就双边经济金融合作等议题交换了意见。同日，在两国元首见证下，潘功胜行长和艾哈迈德行长签订了《人民币/阿曼里亚尔双边本币互换协议》和《加强数字支付和法定数字货币合作的谅解备忘录》。其中，《人民币/阿曼里亚尔双边本币互换协议》的互换规模为300亿元人民币/15亿阿曼里亚尔，协议有效期5年。上述协议的签署有助于深化两国货币金融合作，提升跨境数字支付便利化水平，维护金融市场稳定。", "ctime": 1793701703, "time_str": "18:28:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261103/c681416752.shtml"}, {"id": "5553499", "title": "全球首个智能体信用体系研究报告发布", "content": "11月3日，香港大学在2026年香港金融科技周发布全球首个KYA（Know Your Agent）领域报告《KYA：智能体信用体系研究报告》。报告将智能体演进概括为能力智能体、执行智能体、交易智能体和经济智能体四个阶段，行业整体仍处于从能力智能体向执行智能体加速演进阶段，但“信任真空”正成为商业化核心约束：76%受访者过去一年遇到智能体信任、安全、问责或合规顾虑；53%将“客户或伙伴信任度低”列为推进商业应用首要障碍，88%认为行业需要统一的可信评估或认证标准。产业竞争将从模型能力延伸至可信治理与信任资本积累。（科创板日报）", "ctime": 1793701440, "time_str": "18:24:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261103/c681416641.shtml"}, {"id": "5553495", "title": "奥飞数据：拟以5000万元-1亿元回购公司股份", "content": "奥飞数据公告，拟以自有资金或自筹资金通过集中竞价方式回购公司股份，资金总额不低于5000万元且不超过1亿元，价格不超过27.4元/股。回购股份拟用于注销并减少注册资本、可转换公司债券转股或股权激励、员工持股计划；用于注销的股份不高于实际回购总量的50%，其他用途不低于50%。回购期限自股东会审议通过之日起不超过12个月。方案已获董事会审议通过，尚需提交股东会审议。", "ctime": 1793701414, "time_str": "18:23:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261103/c681416629.shtml"}, {"id": "5553481", "title": "睿智医药：全资子公司拟出资1000万元参与投资基金", "content": "睿智医药公告，公司全资子公司北海睿智创业投资有限公司与上海佰诺私募基金管理有限公司及其他有限合伙人签署合伙协议，拟以自有资金1000万元认缴武汉市佰诺嘉泰创业投资合伙企业（有限合伙）出资，占合伙企业认缴出资总额的29.24%。该基金规模为3420万元，尚处于募集阶段，尚未取得中国证券投资基金业协会备案，后续需办理工商变更登记及基金备案。基金拟以认购广州科恩泰生物医药科技有限公司新增注册资本的形式进行投资，该企业专注于激酶抑制剂原始创新。", "ctime": 1793701232, "time_str": "18:20:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261103/c681416575.shtml"}, {"id": "5553477", "title": "奥联电子：瑞盈资产与两受让方签署补充协议，股份转让数量不变", "content": "奥联电子公告，此前控股股东广西瑞盈资产管理有限公司拟将公司2772万股股份（占上市公司总股本的16.20%）协议转让给骏图天泽（无锡）投资合伙企业（有限合伙），将855.56万股股份（占上市公司总股本的5%）协议转让给衢州市信安广合产业并购股权基金合伙企业（有限合伙）。2026年11月3日，瑞盈资产分别与两家受让方签署股份转让协议之补充协议，对原协议部分条款予以调整完善，本次调整不涉及股份转让数量、每股转让价格的变更。本次股权转让尚需深圳证券交易所进行合规性审核，并在中国证券登记结算有限公司深圳分公司办理股份过户登记手续，相关工作正在进一步推进中。", "ctime": 1793701177, "time_str": "18:19:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261103/c681416544.shtml"}, {"id": "5553473", "title": "国联民生证券中标互换便利业务", "content": "中国证监会近日公布稳市场、稳预期多项举措组合拳，组织实施第三批证券、基金、保险公司互换便利（SFISF）业务。据记者获悉，国联民生证券成功中标。国联民生表示，下一步将用好用足互换便利工具，将融入资金重点投向股票和股票ETF的投资与做市。（人民财讯）", "ctime": 1793701166, "time_str": "18:19:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261103/c681416541.shtml"}, {"id": "5553403", "title": "SK海力士美股盘前涨超2%", "content": "SK海力士美股盘前涨超2%，现报150.7美元。", "ctime": 1793700797, "time_str": "18:13:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261103/c681416336.shtml"}, {"id": "5553369", "title": "德必集团：拟以5000万元-1亿元回购公司股份", "content": "德必集团公告，拟以不低于5000万元且不超过1亿元回购公司股份，回购价格不超过20元/股，采用集中竞价方式，回购期限不超过3个月。回购股份用于维护公司价值及股东权益，资金来源为公司自有资金及/或自筹资金；回购股份拟在发布回购结果暨股份变动公告12个月后出售，未能在回购实施完成后3年内使用的部分将履行相关程序予以注销。", "ctime": 1793700520, "time_str": "18:08:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261103/c681416222.shtml"}, {"id": "5553315", "title": "招商证券中标央行第三批互换便利操作", "content": "记者获悉，招商证券积极参与并中标第三批“证券、基金、保险公司互换便利”（SFISF）操作，下一步将尽快推进融资与投资相关工作。招商证券表示，在前期用好用足互换便利工具的基础上，将继续积极使用该政策工具，提高市场交易活跃度，提振投资者信心，维护资本市场稳定。 (财联社)", "ctime": 1793700331, "time_str": "18:05:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261103/c681416121.shtml"}, {"id": "5553203", "title": "浙江建投：子公司牵头联合体中标15.03亿元储能电站项目", "content": "浙江建投公告，公司子公司浙江省三建建设集团有限公司（浙江三建）作为联合体牵头人，与其他两家公司组成联合体，近日收到中标通知书，成功中标宁夏灵武新丰500MW/2000MWh储能电站项目PC总承包，中标价15.03亿元，施工总工期365日历天。", "ctime": 1793700141, "time_str": "18:02:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261103/c681416004.shtml"}, {"id": "5553195", "title": "天岳先进：宗艳民提议5000万元至8000万元回购公司股份", "content": "天岳先进公告，控股股东、实际控制人、董事长兼总经理宗艳民于2026年11月3日提议公司以首次公开发行人民币普通股取得的超募资金或自有资金，通过集中竞价交易方式回购A股，资金总额不低于5000万元、不超过8000万元。回购股份拟用于股权激励、员工持股计划或减少公司注册资本；回购价格不超过董事会通过回购决议前30个交易日公司股票交易均价的150%，期限为董事会审议通过回购方案之日起12个月内。宗艳民承诺积极推动公司尽快召开董事会审议回购事项，并投赞成票。", "ctime": 1793700119, "time_str": "18:01:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261103/c681415988.shtml"}, {"id": "5553189", "title": "碧桂园区域架构调整：10个区域合并为6个，广清区域整体撤销", "content": "碧桂园正启动新一轮组织架构调整，原有10个区域合并为6个。据碧桂园知情人士透露，此次调整旨在贯彻长期发展战略，适配业务转型新阶段发展要求，保障长期稳健经营。具体来看，碧桂园原有的10个区域合并为6个，西北与西南合并为西部区域，华中与东南合并为中部区域，北方与豫晋合并为北方区域，广州与江中合并为粤桂区域，韶关清远与原粤海合并为粤海区域。此外，沪苏鲁区域不变，广清区域整体撤销，惠州和深圳的直管资产合并成惠深直管资产单元。自2021年底，碧桂园将峰值期的106个区域公司合并为65个，开启收缩之路，到2025年12月，在债务重组取得进展的节点，将13个房产区域精简至10个。(新京报)", "ctime": 1793700109, "time_str": "18:01:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261103/c681415984.shtml"}, {"id": "5553185", "title": "广电总局：一体化电视要方便用户安装开通", "content": "记者3日从国家广播电视总局获悉，日前在京召开的一体化电视全国推广部署推进会，要求统筹家庭用户与酒店、养老机构等公共场所，精准制定推广策略，把握消费节点，广泛宣传一体化电视便民惠民优势，打通报装渠道，方便用户安装开通。(新华社)", "ctime": 1793700096, "time_str": "18:01:36", "stock_code": "", "stock_name": "", "stock_mark // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
