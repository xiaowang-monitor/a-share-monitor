展，构建数据合作联合体等新型合作模式，培育协同创新的工业数据产业生态。要分类引导大中小企业开展数据开发利用，分业推进行业数智化转型，推动产业集群等载体数据共享和价值共创。（工信微报）", "ctime": 1778653642, "time_str": "14:27:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260513/c676653525.shtml"}, {"id": "4357165", "title": "首创期货：秘鲁能源危机紧急法令余温仍在，白银一度上涨2%", "content": "全球前三白银生产国秘鲁（占全球产量10%+）因天然气管道爆炸出台能源紧急法令，国内电力供应紧张、工业天然气配额受限，秘鲁优先保民生用电、限制矿山工业用电，矿山开工率下滑，供给收缩预期引爆市场。昨日白银行情已经发酵，今日仍有余温，黄金则始终反映平淡，未受其影响。供应端扰动通常为突发短期因素，不适宜参与交易。（首创期货）", "ctime": 1778653551, "time_str": "14:25:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260513/c676653501.shtml"}, {"id": "4357137", "title": "国台办：将按一中原则和APEC有关规定及惯例处理台湾地区参会事宜", "content": "国务院台湾事务办公室今天（5月13日）上午举行例行新闻发布会，国台办发言人张晗主持本次新闻发布会。\n\n台湾TVBS电视台记者：2026年APEC由大陆主办，台湾“行政院政务委员”杨珍妮称将赴苏州参加贸易部长会议。请问大陆方面会否确保台湾代表团依照APEC惯例，享有平等参与权利？会否提供必要入境、维安与会务协助？\n\n张晗：有关部门近日已就即将在苏州举办的APEC贸易部长会发布了相关信息。作为今年亚太经合组织（APEC）活动的东道主，我们将按照一个中国原则和APEC有关谅解备忘录的规定及惯例处理台湾地区参会事宜。(界面)", "ctime": 1778653318, "time_str": "14:21:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260513/c676653421.shtml"}, {"id": "4357127", "title": "追觅手机Q4发布，高奢版或超十万元", "content": "记者从知情人士处获悉，追觅AURORA手机将于2026年第四季度正式发布，产品线分为旗舰版、模块化摄影旗舰版与高奢定制版三条，售价覆盖万元至十万元区间。\n\n其中，高奢定制版已确定上市，旗舰版与模块化摄影旗舰版仍在最终确认中。\n\n销售方面，追觅将采取全球同步上市策略，主打海外市场，国内市场同步跟进，首销目标定为10万台以上。高定版主要承担拉升品牌形象的作用，实际销量占比较小，走量任务仍落在旗舰版和模块化摄影旗舰版上。（蓝鲸新闻）\n\n供应链方面，上述知情人士透露，追觅AURORA手机将搭载高通骁龙系列芯片。在稍早的2026年AWE展会上，该机型信息已提前曝光：产品由中兴通讯旗下努比亚代工生产，搭载努比亚MyOS系统，型号为NX741J，界面显示“追觅×努比亚联名”字样。", "ctime": 1778653146, "time_str": "14:19:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260513/c676653355.shtml"}, {"id": "4357091", "title": "宇通集团与宁德时代签署全面战略合作备忘录", "content": "5月12日，宇通集团与宁德时代在福建宁德签署全面战略合作备忘录。此次合作将聚焦联合出海、商用车全场景电动化、重卡换电业务、品牌共建四大核心方向。（宁德时代）", "ctime": 1778652811, "time_str": "14:13:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260513/c676653262.shtml"}, {"id": "4357073", "title": "润六尺科技：赴华为进行业务交流 探索算力服务国产化现实路径", "content": "润六尺科技今日官微消息，5月12日，润六尺团队一行应邀赴华为深圳坂田基地进行参观学习与业务交流。双方围绕基于昇腾处理器的国产智算集群建设、算力运营服务标准化、模型迁移适配及生态协同等核心议题展开了深入探讨，为后续推进全面合作奠定了坚实基础。双方一致认为，在大模型规模化推理、行业AI Agent落地、区域智算中心建设等多个维度，存在广阔的合作想象空间。后续双方将就技术适配、商务模式及合作节奏等具体事项展开进一步沟通。", "ctime": 1778652614, "time_str": "14:10:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260513/c676653209.shtml"}, {"id": "4357047", "title": "国家药监局：2025年我国药品申报和审结数量双创新高", "content": "国家药监局今天发布《2025年度药品审评报告》，报告显示，2025年我国药品注册申报和审结数量，双双创历史新高。2025年国家药监局药品审评中心全年受理各类药品注册申请20149件，同比增加3%，创历史新高；据介绍，药品注册申请，包括新药临床试验申请、新药上市申请、仿制药上市申请和补充申请等。国家药监局药品审评中心业务管理处副处长袁利佳介绍，2025年新药上市申请数量同比增加超过20%，新药临床试验申请数量同比增加超过13%。从中可以看出我国医药产业创新活力后劲十足，未来将有更多在研创新药从科研成果走向临床应用。与此同时，2025年我国审结各类药品注册申请19375件，同比增长6.11%，也创历史新高。", "ctime": 1778652228, "time_str": "14:03:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260513/c676653107.shtml"}, {"id": "4357007", "title": "以称黎真主党发射火箭弹袭击黎南部以军", "content": "当地时间13日，以色列国防军称，黎巴嫩真主党当天早上向驻扎在黎巴嫩南部的以色列部队发射了多枚火箭弹。此外，一架疑似来自黎真主党的无人机被拦截。袭击未造成人员伤亡。目前，黎巴嫩方面对此暂无回应。（央视新闻）", "ctime": 1778652112, "time_str": "14:01:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260513/c676653051.shtml"}, {"id": "4356969", "title": "两项港口散杂货电子单证国家标准发布 8月1日起正式实施", "content": "记者今天了解到，市场监管总局批准发布《港口散杂货电子提货单》和《港口散杂货进口电子舱单》两项推荐性国家标准，将于8月1日正式实施。（央视新闻）", "ctime": 1778652045, "time_str": "14:00:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260513/c676653038.shtml"}, {"id": "4 钻针棒材已通过国内知名AI服务器板厂商批量测试验证，性能对标进口标准；0.25mm以下超细规格同步开发测试。公司相关负责人表示，新锐股份现已为拟并购的子公司慧联电子稳定供应钻针棒材原料，支持客户打样与定制化开发。产能规划方面，预计2026年底月产能达2000万支，2028年可达1亿支/月。（财联社）", "ctime": 1778650423, "time_str": "13:33:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260513/c676652565.shtml"}, {"id": "4356675", "title": "沪深京三市成交额超2.3万亿元，较上日此时缩量1681亿元", "content": "据同花顺iFinD数据，沪深京三市成交额超2.3万亿元，较上日此时缩量1681亿元，预计全天成交金额约3.0万亿元。截至目前，沪市成交额10268亿元，深市成交额12567亿元，北证50成交额167亿元。", "ctime": 1778649902, "time_str": "13:25:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260513/c676652442.shtml"}, {"id": "4356671", "title": "国债期货拉升 30年期主力合约涨超0.2%", "content": "国债期货拉升，30年期主力合约盘中涨0.20%，现报113.180元。10年期涨0.08%，现报108.825元。5年期涨0.08%，现报106.34元。2年期涨0.03%，现报102.586元。", "ctime": 1778649797, "time_str": "13:23:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260513/c676652429.shtml"}, {"id": "4356653", "title": "黄仁勋2026财年总薪酬约3630万美元 较2025财年下降27%", "content": "根据周二公布的一份监管文件，英伟达首席执行官黄仁勋2026财年总薪酬约为3630万美元，较2025财年下降了1360万美元，降幅为27%，这主要是因为股票奖励出现了大缩水。股权奖励是黄仁勋薪酬包中占比最大的部分。在截至1月25日的2026财年中，这部分收入减少了36%，降至2480万美元。而在2025财年，他获得了价值3880万美元的股票奖励，当年的总薪酬高达4990万美元。\n黄仁勋股票奖励大缩水，反映出英伟达股价涨势降温的现实。目前英伟达仍是全球市值最高的公司，但股价涨势已明显放缓。2025年，英伟达股价上涨了39%，远不及2023年的上涨两倍以及2024年的上涨逾一倍。", "ctime": 1778649484, "time_str": "13:18:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260513/c676652370.shtml"}, {"id": "4356647", "title": "联发科发布天玑AI智能体化引擎 2.0", "content": "在天玑开发者大会上，联发科（MediaTek）发布天玑AI智能体化引擎2.0 ，基于天玑SensingClaw技术，可提供低功耗的全时感知能力，帮助设备制造商打造具备主动感知和跨应用驱动能力的Agent OS。会上，MediaTek还公布了与OPPO 、小米和传音合作的系统原生Claw。此外，MediaTek还推出天玑AI开发套件3.0，并展示了将阶跃星辰ACE-Step音乐模型通过端侧可视化部署到天玑9500平台上。（科创板日报）", "ctime": 1778649417, "time_str": "13:16:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260513/c676652354.shtml"}, {"id": "4356641", "title": "算力租赁板块震荡走强", "content": "算力租赁板块震荡走强，众合科技2连板，东方材料、利通电子、三人行、华升股份、鸿博股份、中嘉博创、工业富联、数据港、城地香江、奥瑞德涨停，平治信息、日科化学、润泽科技、东方国信、宏景科技、网宿科技涨超10%，扬电科技、电光科技、凯添燃气、华策影视、奥飞数据跟涨。相关ETF方面，云计算ETF广发（159527）涨3.1%，成交额960.73万元，云计算ETF汇添富（159273）涨2.57%，成交额5315.32万元。", "ctime": 1778649309, "time_str": "13:15:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260513/c676652329.shtml"}, {"id": "4356635", "title": "工业富联午后涨停", "content": "工业富联午后涨停，成交额261.21亿元。", "ctime": 1778649045, "time_str": "13:10:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260513/c676652255.shtml"}, {"id": "4356629", "title": "瑙鲁议会批准国名变更宪法修正案", "content": "瑙鲁政府12日说，该国议会当天通过一项宪法修正案，拟将国名由“Nauru（瑙鲁）”更改为“Naoero（音译为瑙埃罗）”。该修正案还需经全民公投通过。 瑙鲁政府12日在社交媒体平台发布了相关消息，并表示，下一步将举行全民公投。若更名获公投通过，新国名将用于国家官方记录和标志，以及区域和国际官方身份标识中，包括在联合国的官方称谓。 该更名提案最初由总统阿迪昂于1月提出。瑙鲁政府此前表示，“瑙埃罗”这一名称更能体现瑙鲁的民族遗产、语言和身份认同。政府解释说，现行国名“瑙鲁”源于外国语言难以准确发音“瑙埃罗”。 瑙鲁位于中太平洋，由一个独立的珊瑚礁岛及周边海域构成。瑙鲁统计局网站数据显示，该国人口在2021年约为1.17万。(新华社)", "ctime": 1778649016, "time_str": "13:10:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260513/c676652244.shtml"}, {"id": "4356625", "title": "第79届法国戛纳国际电影节12日晚在法国南部海滨城市戛纳拉开帷幕", "content": "第79届法国戛纳国际电影节12日晚在法国南部海滨城市戛纳拉开帷幕。今年，有不少来自欧洲和东亚国家的导演携作品闯入主竞赛单元，共同角逐最高奖项“金棕榈奖”。本届电影节主竞赛单元评委会主席由朴赞郁担任，他成为首个担任这一角色的韩国导演。在22部入围作品中，西班牙导演佩德罗·阿尔莫多瓦尔、罗马尼亚电影人克里斯蒂安·蒙久等来自欧洲的戛纳“熟面孔”携作品回归。此外，韩国导演罗泓轸的作品《希望》、日本导演深田晃司的作品《奈义日记》等日韩电影也出现在入围作品中。（央视新闻）", "ctime": 1778648960, "time_str": "13:09:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260513/c676652235.shtml"}, {"id": "4356623", "titl const SECTORS  = [{"name": "金融", "hit_count": 29, "etfs": []}, {"name": "人工智能", "hit_count": 26, "etfs": []}, {"name": "数据要素", "hit_count": 19, "etfs": []}, {"name": "半导体", "hit_count": 19, "etfs": []}, {"name": "消费", "hit_count": 12, "etfs": []}, {"name": "医药", "hit_count": 9, "etfs": []}, {"name": "军工", "hit_count": 8, "etfs": []}, {"name": "低空经济", "hit_count": 4, "etfs": []}];
const META     = {"update_time": "2026-05-13 14:37:15", "sentiment_score": 52.12264150943396, "agents": []};

// 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
