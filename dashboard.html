}

.score-bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s; }
.up { color: var(--red); }
.down { color: var(--green); }
.pulse { animation: pulse 2s infinite; }
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }

.glow { box-shadow: 0 0 20px rgba(59,130,246,0.15); }

合约涨超4%", "content": "NYMEX取暖油主力合约涨超4%，现报4.42美元/加仑。", "ctime": 1788183422, "time_str": "21:37:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260831/c679460749.shtml"}, {"id": "5071083", "title": "美股开盘：美股三大指数集体低开", "content": "美股三大指数集体低开，标普500指数跌0.23%，道指跌0.39%，纳指跌0.18%。大型科技股方面，亚马逊跌1.14%，谷歌A跌1.16%。中概股方面，携程涨1.39%，拼多多跌1.55%，阿里巴巴跌2.09%。", "ctime": 1788183045, "time_str": "21:30:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260831/c679460674.shtml"}, {"id": "5071049", "title": "美联储主席沃什：当前时期是全球投资激增的阶段", "content": "美联储主席沃什：当前时期是全球投资激增的阶段。", "ctime": 1788182992, "time_str": "21:29:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260831/c679460662.shtml"}, {"id": "5071001", "title": "机器人六维力传感器实现国产主导切换 头部厂商市占率突破80%", "content": "8月31日，赛迪发布《2026年中国人形机器人六维力传感器市场调研报告》。报告显示，2025年中国人形机器人六维力传感器市场呈现极高寡占型格局，行业前三厂商合计占据92.8%的市场份额，其中蓝点触控以超过80%的市场份额位居首位，坤维科技、宇立仪器分别占据9.2%和3.3%的市场份额，整体市场形成“一超主导、长尾跟随”的产业结构。国内市场竞争格局已完成结构性切换，彻底告别此前外资品牌主导的发展阶段。多家机构一致预测2026—2027年行业将维持数倍级同比增长。报告预计。2030年国内六维力传感器出货量约120万颗，对应市场规模约60亿元，复合年均增长率超过100%。（科创板日报）", "ctime": 1788182834, "time_str": "21:27:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260831/c679460636.shtml"}, {"id": "5070999", "title": "沃什：我此前与贝森特的合作已证明富有成效", "content": "沃什：我此前与贝森特的合作已证明富有成效。", "ctime": 1788182826, "time_str": "21:27:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260831/c679460635.shtml"}, {"id": "5070843", "title": "贝森特：摆脱债务的唯一途径是通过经济增长走出债务困境", "content": "贝森特：摆脱债务的唯一途径是通过经济增长走出债务困境。", "ctime": 1788181939, "time_str": "21:12:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260831/c679460442.shtml"}, {"id": "5070839", "title": "中国巨石据悉已正式上调9月份电子布价格", "content": "记者自中国巨石获悉，公司已正式上调9月份电子布价格，其中厚布涨价15%、薄布上涨20%。2026年上半年，中国巨石电子布销量为5.44亿米，同比增长超12%。在产品研发方面，公司介绍，低介电系列玻纤及电子布产品的研发、客户认证及送样工作正有序推进，将根据客户验证进度与市场需求，稳步推进产品落地与产能释放。在具体扩产进展上，中国巨石称，巨石集团淮安有限公司年产10万吨电子级玻璃纤维零碳智能生产线于3月和6月分期点火投产，目前已达到满产状态。巨石集团淮安有限公司年产5万吨电子纱暨3.2亿米电子布生产线建设项目建设周期为1.5年，目前正在建设中。产能释放后，电子布总体供给是否会过剩？对此，中国巨石回应称，玻纤行业项目建设周期较长，扩产还受资金、窑炉建设、高端设备交付等多重条件约束。新增有效供给释放有限，行业供需格局整体有望维持相对平稳。在资本开支方面，公司后续计划聚焦主业、稳健投入，重点用于高端玻纤及电子布产品产能建设、现有产线技改升级、工艺优化及智能化、绿色化改造等领域，持续优化产品结构。(上海证券报)", "ctime": 1788181930, "time_str": "21:12:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260831/c679460437.shtml"}, {"id": "5070823", "title": "欧林生物：陈爱民拟减持公司不超过0.0338%股份", "content": "欧林生物公告，董事、副总经理陈爱民持有公司股份54.81万股，占公司总股本的0.14%，因个人资金需求，拟通过集中竞价或大宗交易方式减持不超过13.7万股，占公司总股本的比例不超过0.0338%，减持期间为2026年9月22日至2026年12月21日。", "ctime": 1788181889, "time_str": "21:11:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260831/c679460431.shtml"}, {"id": "5070815", "title": "美国称霍尔木兹海峡没有船只触碰到水雷", "content": "美国称霍尔木兹海峡没有船只触碰到水雷。（财联社）", "ctime": 1788181872, "time_str": "21:11:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260831/c679460430.shtml"}, {"id": "5070747", "title": "巴基斯坦总理与伊朗总统举行会晤 讨论双边合作", "content": "8月31日，巴基斯坦总理夏巴兹·谢里夫与伊朗总统马苏德·佩泽希齐扬在吉尔吉斯斯坦举行的上海合作组织峰会期间举行会谈。双方就巴伊双边关系与合作的最新进展，以及进一步加强两国互动与合作的途径交换意见。谢里夫与佩泽希齐扬强调，应充分利用现有合作潜力和资源，推动两国在各领域进一步发展和深化双边关系。（央视新闻）", "ctime": 1788181674, "time_str": "21:07:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260831/c679460363.shtml"}, {"id": "5070717", "title": "OpenAI：ChatGPT广告的年化收入已达到10亿美元", "content": "OpenAI称，自上线不到200天，ChatGPT广告的年化收入已达到10亿美元。", "ctime": 1788181605, "time_str": "21:06:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260831/c679460329.shtml"}, {"id": "5070701", "title": "特朗普称将“狠狠打击”伊朗", "content": "美国总统特朗普8月31日说，将对伊朗袭击美国驻约旦基地进行回击。特朗普当天在接受美国福克斯新闻频道采访时表示，对伊朗的袭击“一定会有回应”，“我们将狠狠打击他们（伊朗）”。特朗普称，美军防空系统在应对伊朗袭击时“放过了一枚导弹，因为它不会击中任何目标”，其他导弹均被拦截。伊朗外交部和军方8月31日说，作为对美军袭击伊朗拉腊克岛的回应，伊朗武装力量对约旦和阿联酋境内美军目标实施打击，并击落一架美军MQ-9无人机。（新华社）", "ctime": 1788181581, "time_str": "21:06:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260831/c679460323.shtml"}, {"id": "5070457", "title": "期市夜盘开盘，国内期货主力合约多数上涨，乙二醇涨超4%", "content": "期市夜盘开盘，国内期货主力合约多数上涨。涨幅方面，乙二醇涨超4%，瓶片、原油、甲醇、燃油、丙烯涨超3%，纯苯、苯乙烯、沥青、PVC涨超2%。跌幅方面，沪银跌超2%，纸浆、沪金跌超1%。", "ctime": 1788181199, "time_str": "20:59:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260831/c679460228.shtml"}, {"id": "5070431", "title": "赵乐际同奥地利国民议会议长罗森克兰茨会谈", "content": "全国人大常委会委员长赵乐际31日在北京人民大会堂同奥地利国民议会议长罗森克兰茨举行会谈。 赵乐际表示，2018年，习近平主席同范德贝伦总统共同确立中奥友好战略伙伴关系，开启双边关系发展新阶段，两国各领域务实合作取得丰硕成果。今年是中奥建交55周年，中方愿同奥方一道，落实两国领导人重要共识，巩固传统友好，深化互利合作，不断丰富中奥友好战略伙伴关系内涵。 赵乐际指出，双方要巩固政治互信，保持高层交往良好势头，加强政策沟通，照顾彼此核心利益和重大关切。拓展经贸合作，加强人工智能、数字经济、绿色发展等新兴领域合作，推动两国产业向新、向绿、向好发展。加强人文交流，出台更多务实举措，便利两国民众常来常往，夯实双边关系民意基础。深化多边协作，加强在国际事务中的协调配合，共同维护联合国权威和地位，维护自由贸易和多边贸易体制，推动构建更加公正合理的全球治理体系。中方愿同欧盟通过对话协商方式妥善解决经贸合作中的矛盾分歧，在发展中实现动态平衡。 (新华社)", "ctime": 1788181097, "time_str": "20:58:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260831/c679460211.shtml"}, {"id": "5070383", "title": "尹弘主持召开专题会议研究大健康产业培育发展工作", "content": "8月31日，江西省委书记尹弘主持召开专题会议，研究大健康产业培育发展工作。他强调，要深入贯彻习近平总书记关于健康中国重要论述，立足资源禀赋与产业基础，聚焦更好满足人民群众对美好生活的向往，发挥独特优势，精准发力突破，积极培育新技术新产品新模式新业态，加快推动大健康产业高质量发展。尹弘认真听取省发展改革委、省工业和信息化厅、省卫生健康委、省文化和旅游厅等关于大健康产业培育发展有关工作情况汇报，就产业发展具体问题与大家深入交流。他指出，推动大健康产业发展，不仅有利于增进人民群众健康福祉，也有利于我省优化产业结构、培育新的经济增长点。要从贯彻落实健康中国战略、提高群众健康水平的高度，加快培育发展大健康产业，坚持政府引导、需求牵引，加大投资于人的力度，持续增加有效供给，积极推进“治已病”到“治未病”转变，全力推动大健康产业规模化、融合化发展。（江西发布）", "ctime": 1788180765, "time_str": "20:52:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260831/c679460140.shtml"}, {"id": "5070359", "title": "星邑空间完成数亿元A轮融资 加速全球测控站网建设", "content": "航天器测运控解决方案服务商星邑空间正式完成A轮增资扩股暨战略投资人引入。此次A轮股权融资募集资金达数亿元人民币，引入了苏创投、力合清瞳、七匹狼控股、智宸投资、兰溪资本、海锶创投等多家知名投资机构。本轮融资落地后，将加速全球测控站网建设，进一步夯实大型星座测控管理、精密轨道确定与控制等关键技术能力。（财联社）", "ctime": 1788180619, "time_str": "20:50:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260831/c679460081.shtml"}, {"id": "5070345", "title": "晓程科技：周劲松、王含静拟减持公司不超过0.079%股份", "content": "晓程科技公告，董事周劲松拟减持不超过93750股，占公司总股本0.035%；高级管理人员王含静拟减持不超过12.25万股，占公司总股本0.045%，合计不超过21.62万股，占公司总股本0.079%。减持期间为2026年9月22日—2026年12月21日，方式为集中竞价交易。", "ctime": 1788180534, "time_str": "20:48:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260831/c679460046.shtml"}, {"id": "5070337", "title": "5连板捷荣技术：涉及AI液冷相关的精密结构件业务收入占公司营业收入比重极低", "content": "捷荣技术公告，针对市场关注公司为“AI液冷概念股”的情况，公司主营业务为生产、设计、研发及销售精密结构件，公司所销售的精密结构件产品中，涉及AI液冷相关的精密结构件业务收入占公司营业收入比重极低，经粗略统计，该部分业务收入不超过公司2026年上半年营业收入的1%，该业务对公司经营业绩不构成重大影响。针对市场关注公司为“折叠屏概念股”的情况，公司主营业务为生产、设计、研发及销售精密结构件，公司所销售的精密结构件产品中，涉及折叠屏相关的精密结构件业务收入占公司营业收入比重极低，经粗略统计，该部分业务收入不超过公司2026年上半年营业收入的1%，该业务对公司经营业绩不构成重大影响。", "ctime": 1788180513, "time_str": "20:48:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260831/c679460033.shtml"}, {"id": "5070331", "title": "伊朗副外长强硬回应拉腊克岛遭袭", "content": "伊朗塔斯尼姆通讯社8月31日报道，伊朗副外长加里巴巴迪就周日（30日）晚美军袭击伊朗拉腊克岛一事表示，美方的“侵略”行径将得到应有回应。此前，据多家美国媒体30日报道，美军当天打击了位于霍尔木兹海峡附近伊朗拉腊克岛上的两个火箭发射装置。此次行动是美军一个月来首次对伊朗目标实施军事打击。针对美方此次行动，加里巴巴迪表示，“我们将此次‘侵略’视为对我国发动的军事攻击”，并补充说，正如伊朗武装部队所展现的那样，“任何对我国领土完整的侵略，无论程度如何，都将得到坚决回应。”（环球网）", "ctime": 1788180486, "time_str": "20:48:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260831/c679460029.shtml"}, {"id": "5070325", "title": "2连板竞业达：股东江源东8月31日卖出竞业达股票231.38万股 本次减持执行完毕", "content": "竞业达公告，股票于2026年8月28日、2026年8月31日连续两个交易日收盘价格涨幅偏离值累计达到20.84%。公司目前主要在教育、考试业务的平台软件中嵌入智能体模块，独立销售的智能体相关业务收入占公司营业收入比重极低，经粗略统计，该部分业务收入不超过公司2026年上半年营业收入的1%，该业务对公司经营业绩不构成重大影响。股东江源东于2026年8月31日卖出231.38万股，本次减持执行完毕。", "ctime": 1788180471, "time_str": "20:47:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260831/c679460025.shtml"}, {"id": "5070313", "title": "美国10年期国债收益率升至4.75%，为2025年1月以来最高水平", "content": "美国10年期国债收益率升至4.75%，为2025年1月以来最高水平。", "ctime": 1788180416, "time_str": "20:46:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260831/c679460015.shtml"}, {"id": "5070305", "title": "英力特：控股股东拟公开征集转让39.41%股份 股票复牌", "content": "英力特公告，控股股东英力特集团拟通过公开征集受让方的方式协议转让公司1.55亿股股份，占公司总股本的39.41%，转让完成后持股6.93%；公司股票将于2026年9月1日上午开市起复牌。", "ctime": 1788180377, "time_str": "20:46:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260831/c679460007.shtml"}, {"id": "5070297", "title": "顺丰控股：顺丰海外认缴1000万美元参与基金", "content": "顺丰控股公告，2026年8月31日，公司境外全资子公司顺丰海外签署认购协议及合伙协议，参与投资Linear Capital VI L.P.股权投资基金。基金目标规模计划为2.5亿美元，顺丰海外作为有限合伙人认缴出资额为1000万美元，基金聚焦泛科技领域非上市企业，主要投资前沿科技方向早期企业股权。", "ctime": 1788180332, "time_str": "20:45:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260831/c679459993.shtml"}, {"id": "5070211", "title": "日本政府考虑在东京附近设立核废料填埋场", "content": "日本经济产业省8月31日表示，有意在首都东京附近一座城市设立核废料填埋场，用于处理核电站产生的高放射性核废料。日本经济产业省官员当天前往茨城县常陆大宫市，就启动核废料填埋场选址调查征求当地政府意见。常陆大宫市位于茨城县西北部，人口约3.5万人，距东京市中心约110公里。经济产业省方面表示，常陆大宫市有大量未被利用的土地，有较大可能适合作为高放射性核废料填埋场。常陆大宫市市长铃木定幸回应称，将在市议会讨论后决定是否接受调查。（新华社）", "ctime": 1788179633, "time_str": "20:33:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260831/c679458590.shtml"}, {"id": "5070209", "title": "美国总统特朗普称，美国将对伊朗袭击美军事件作出回应", "content": "美国总统特朗普称，美国将对伊朗袭击美军事件作出回应。", "ctime": 1788179628, "time_str": "20:33:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260831/c679458577.shtml"}, {"id": "5070203", "title": "民调：韩国总统李在明支持率首次跌破40%", "content": "韩国媒体8月31日发布的一项最新民意调查结果显示，总统李在明支持率降至38.9%，首次跌破40%，为其去年6月上任以来新低。受韩国《能源经济新闻》委托，民调机构“真实计量器”8月24日至28日就李在明施政表现，对2509名18岁及以上的受访者进行调查。结果显示，李在明支持率为38.9%，较一周前下降1.3个百分点，连续7周呈下滑趋势；不支持率为58.7%，较一周前上升1.8个百分点。据“真实计量器”分析，李在明支持率下降受多重因素影响，包括政府推行房地产新规、大法院法官任命引发争议以及警方对治安事件处理不当等。（新华社）", "ctime": 1788179620, "time_str": "20:33:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260831/c679458549.shtml"}, {"id": "5070165", "title": "中国建筑：中国海外发展竞得普陀区土地使用权约150.19亿元", "content": "中国建筑公告，公司董事会审议同意下属子公司中国海外发展投资上海市普陀区房地产开发项目，近日中国海外发展竞得本项目土地使用权，土地获取价款约150.19亿元。项目总占地面积约11.92万平方米，总计容建筑面积约39.7万平方米，规划用途包括商品住宅、商业、办公等。", "ctime": 1788179501, "time_str": "20:31:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260831/c679458059.shtml"}, {"id": "5070141", "title": "英伟达与联发科深化长期合作关系，共同构建人工智能边缘到云计算平台", "content": "英伟达与联发科深化长期合作关系，共同构建人工智能边缘到云计算平台；英伟达投资35亿美元购买联发科发行的可转换债券。（财联社）", "ctime": 1788179477, "time_str": "20:31:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260831/c679457985.shtml"}, {"id": "5070069", "title": "紫光股份：今年是超节点商用元年，各行业需求释放明显", "content": "紫 // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
