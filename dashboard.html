.score-bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s; }

.down { color: var(--green); }

力度、更实举措加强基础研究，提升我国原始创新能力，进一步打牢科技强国建设根基。(新华社)", "ctime": 1777528565, "time_str": "13:56:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260430/c676413084.shtml"}, {"id": "4305045", "title": "宇树发布只有上半身的人形机器人，高管否认熊猫机器人抄袭魔法原子", "content": "4月30日，宇树科技发布仅有上半身设计的双臂人形机器人，定价2.69万元起，大幅拉低行业门槛。这款双臂机器人一改全尺寸整机思路，采用固定底座与移动底盘两种快速部署方案，可按科研、轻工业、服务场景进行切换。其单臂提供5自由度与7自由度两种配置，整机总自由度覆盖15至31，腰关节支持±150°旋转，头部可实现±115°水平转动与±36°俯仰。此外，末端夹爪重复定位精度为±0.1mm，可适配二指、三指、五指灵巧手快速更换，单臂最大负载约2kg，可满足精密操作与常规搬运需求。值得一提的是，宇树科技CMO王其鑫在开业现场接受媒体采访时表示，“其实宇树的熊猫机器人更早推出，我们在去年11月、12月就发布了相关视频，当时机器狗已经做成了熊猫外观，而魔法原子的熊猫机器人是在今年2月春晚才首次亮相的，网上有很多视频可以作证。”(界面新闻)", "ctime": 1777528452, "time_str": "13:54:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260430/c676413047.shtml"}, {"id": "4305035", "title": "江苏新能等成立光伏发电新公司", "content": "企查查APP显示，近日，江苏新能王竹光伏发电有限公司成立，经营范围包含太阳能发电技术服务；风力发电技术服务；储能技术服务；新兴能源技术研发等。企查查股权穿透显示，该公司由江苏新能等共同持股。（人民财讯）", "ctime": 1777528328, "time_str": "13:52:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260430/c676413000.shtml"}, {"id": "4305033", "title": "沪深京三市成交额超2.2万亿元，较上日此时放量1680亿元", "content": "据同花顺iFinD数据，沪深京三市成交额超2.2万亿元，较上日此时放量1680亿元，预计全天成交金额约2.8万亿元。截至目前，沪市成交额10244亿元，深市成交额11611亿元，北证50成交额148亿元。", "ctime": 1777528225, "time_str": "13:50:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260430/c676412959.shtml"}, {"id": "4305017", "title": "电影《10间敢死队》预售总票房破1000万", "content": "据猫眼专业版数据，电影《10间敢死队》映前1天，点映及预售总票房破1000万​​​​。", "ctime": 1777527966, "time_str": "13:46:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260430/c676412828.shtml"}, {"id": "4305011", "title": "寒武纪午后触及20cm涨停，股价逼近1700元", "content" 34:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260430/c676412616.shtml"}, {"id": "4304927", "title": "C联讯涨超8%，成为史上第九只千元股", "content": "C联讯涨超8%，上市5个交易日股价突破1000元，成为A股史上第九只千元股。目前该股股价仅次于寒武纪、源杰科技、贵州茅台，为全市场第四高价股。", "ctime": 1777527272, "time_str": "13:34:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260430/c676412611.shtml"}, {"id": "4304861", "title": "上期所低硫燃油主力合约大涨6% 燃油主力合约大涨5%", "content": "上期所低硫燃油主力合约大涨6%，报5172元/吨。燃油主力合约大涨5%，报4530元/吨。", "ctime": 1777527028, "time_str": "13:30:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260430/c676412545.shtml"}, {"id": "4304839", "title": "南向资金净买入超80亿港元", "content": "据同花顺iFinD数据，截至目前，南向资金净买入超80亿港元，其中港股通（沪）买入超66.25亿港元，港股通（深）买入超14.02亿港元。", "ctime": 1777526915, "time_str": "13:28:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260430/c676412517.shtml"}, {"id": "4304811", "title": "沪深京三市成交额超2万亿元，较上日此时放量1821亿元", "content": "据同花顺iFinD数据，沪深京三市成交额超2万亿元，较上日此时放量1821亿元，预计全天成交金额约2.8万亿元。截至目前，沪市成交额9327亿元，深市成交额10543亿元，北证50成交额136亿元。", "ctime": 1777526457, "time_str": "13:20:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260430/c676412391.shtml"}, {"id": "4304809", "title": "铜箔板块震荡走高，铜冠铜箔涨超10%再创新高", "content": "铜箔板块震荡走高，铜冠铜箔涨超10%再创新高，中一科技、德福科技、捷佳纬创跟涨。", "ctime": 1777526440, "time_str": "13:20:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260430/c676412385.shtml"}, {"id": "4304807", "title": "重庆：到2030年 成渝算力枢纽节点智能算力规模达10万P", "content": "重庆市人民政府印发《重庆市推动成渝地区双城经济圈发展能级提升行动方案（2026-2030年）》。其中指出，推动人工智能和“数字成渝”双向赋能，探索川渝算力、数据、应用场景、政策生态等关键要素协同联动，支撑成渝地区人工智能技术研发、应用和产业化。到2030年，成渝算力枢纽节点智能算力规模达10万P，全市建成10个以上人工智能行业应用中试基地，培育具有全国影响力的20个垂类大模型、5个重大项目，日均词元调用量西部领先。（界面新闻）", "ctime": 1777526415, "time_str": "13:20:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260430/c676412375.shtml"}, {"id": "4304805", "title": "2025年“数字中国发展指数”同比增长12.99%", "content": "4月30日上午，数字中国发展指数在第九届数字中国建设峰会上发布。2025年数字中国发展指数为170.1，同比增长12.99%，增幅较上年扩大2.34个百分点，数字中国建设呈现加速前进的发展态势。（国家数据局）", "ctime": 1777526361, "time_str": "13:19:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260430/c676412358.shtml"}, {"id": "4304781", "title": "谷歌入驻广州天河CBD，预计今年三季度正式投入运营", "content": "4月28日，全球科技巨头谷歌（Google）正式签订合同，入驻位于天河CBD珠江新城的城市地标广州国际金融中心（西塔），将率先落地跨境数智赋能服务创新项目，预计今年第三季度正式投入运营。谷歌方面将联合各方优势资源，推出多项国内首创科技服务。（21财经）", "ctime": 1777526156, "time_str": "13:15:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260430/c676412292.shtml"}, {"id": "4304779", "title": "港股汽车股多数下挫，比亚迪股份跌超5%", "content": "港股汽车股多数下挫，比亚迪股份、蔚来-SW、奇瑞汽车跌超5%，广汽集团跌超4%，赛力斯、理想汽车-W跟跌。", "ctime": 1777526104, "time_str": "13:15:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260430/c676412277.shtml"}, {"id": "4304771", "title": "重庆：拟推动数据设施绿电直供，新建算力设施绿色算力资源占比达80%", "content": "近日，重庆市政府印发《重庆市推动成渝地区双城经济圈发展能级提升行动方案（2026—2030年）》。其中提到，到2030年，成渝算力枢纽节点智能算力规模达10万P，全市建成10个以上人工智能行业应用中试基地，培育具有全国影响力的20个垂类大模型、5个重大项目，日均词元调用量西部领先。建强全国一体化算力网络成渝国家枢纽节点。打造“东数西算”核心承载区，以重庆数据中心集群为重点，推动本地高性能智能算力基础设施建设。提质扩容重庆（新疆）算力基地，迭代国家（西部）算力调度平台，实现多元异构算力灵活调度和统一服务。强化“疆电入渝”“疆算入渝”联动，推动数据设施绿电直供，新建算力设施绿色算力资源占比达80%，加快应用绿色节能和源网荷储等技术。（人民财讯）", "ctime": 1777526051, "time_str": "13:14:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260430/c676412260.shtml"}, {"id": "4304767", "title": "重庆：到2030年，重庆规上工业增加值年均增长6%左右", "content": "重庆市人民政府印发《重庆市推动成渝地区双城经济圈发展能级提升行动方案（2026—2030年）》。其中提出，加快构建以先进制造业为骨干、以生产性服务业为支撑的现代化产业体系，以“产业大脑+未来工厂”新模式牵引“四侧”协同、促进“四链”融合，迭代“33618”现代制造业集群体系，成渝地区形成高度集聚、高效分工、高度开放的区域产业生态。到2030年，重庆规上工业增加值年均增长6%左右，生产性服务业增加值占服务业增加值比重达60%左右。（第一财经）", "ctime": 1777526042, "time_str": "13:14:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260430/c676412256.shtml"}, {"id": "4304753", "title": "《重庆市推动成渝地区双城经济圈发展能级提升行动方案》正式发布", "content": "近日，《重庆市推动成渝地区双城经济圈发展能级提升行动方案（2026—2030年）》正式发布：将实施现代基础设施网络巩固提升行动。构建系统完备、高效实用、智能绿色、安全可靠的现代基础设施网络，推动传统基础设施更新和数智化改造。到2030年，重庆高速公路通车里程达5700公里、高等级航道里程超1300公里，外电入渝能力达2600万千瓦，新增规模以上水利工程年供水能力14亿立方米，川渝铁路网里程达1.3万公里。其中，建设强赋能、深融合、高智能的新型基础设施。加快双千兆网络向双万兆网络演进升级，推广视联网等新型网络技术，适时启动6G网络商用。用好工业互联网标识解析国家顶级节点（重庆），工业互联网二级节点（西部）累计超60个。建设区块链数字基础设施，打造国家区块链网络西南枢纽。加强北斗导航增强系统建设，加大信关站、卫星互联网测运控中心等地面设施建设力度，推动商业卫星组网。推进一体化低空智能网联系统、低空经济智算中心建设。（人民财讯）", "ctime": 1777525815, "time_str": "13:10:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260430/c676412208.shtml"}, {"id": "4304745", "title": "山东出台三年行动方案 构建“快进慢游”旅游交通体系", "content": "山东省政府近日印发《山东省加快旅游交通网建设行动方案（2026—2028年）》，旨在通过未来三年的集中建设，全面提升旅游交通服务品质，构建便捷高效的旅游交通网络。方案明确了四大重点任务：一是构建便捷高效的“快进”网络，计划到2028年，全省高速公路通车里程突破1万公里，实现“县县双高速”；同时完善机场、高铁站等客运枢纽至主要景区的交通衔接。二是建设特色鲜明的“慢游”体系，将打造一批旅游风景道、自驾车旅居车营地，并优化提升内河水上旅游航线。三是提升旅游交通服务品质，推动交通枢纽、服务区等设施的旅游化改造，完善旅游交通标识系统。四是推进交通与旅游产业融合发展，支持“交通+旅游”综合开发，培育交通旅游新业态。（人民财讯）", "ctime": 1777525641, "time_str": "13:07:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260430/c676412160.shtml"}, {"id": "4304737", "title": "油气股午后拉升，杰瑞股份冲击涨停", "content": "油气股午后拉升，杰瑞股份冲击涨停，纽威股份涨超6%，山东墨龙、通源石油、石化油服跟涨。", "ctime": 1777525599, "time_str": "13:06:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260430/c676412155.shtml"}, {"id": "4304725", "title": "米哈游国际化总裁金雯怡将于5月底离职", "content": "4月30日，有媒体报道称，米哈游国际化总裁金雯怡发布内部信，表示自己将于5月底离开米哈游/HoYoverse，Seven（王宇阳）将接替她继续带领国际化。对此，米哈游方面回应表示：雯怡因个人职业规划原因，已向公司提出离职。公司感谢其在产品全球化发展中的付出与贡献，也祝雯怡未来发展一切顺利。据公开信息，金雯怡曾在游戏公司FunPlus任职，入职米哈游后负责海外业务。Seven（王宇阳）为大鹅文化创始人，曾担任B站副总裁。2024年，王宇阳加入米哈游联合创始人蔡浩宇成立的AI公司。（界面新闻）", "ctime": 1777525528, "time_str": "13:05:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260430/c676412129.shtml"}, {"id": "4304661", "title": "产业链人士：未见DDR5内存条“断崖式下跌”  渠道商获利出货致现货市场小幅波动", "content": "日前，有消息称DDR5内存条售价出现“断崖式下跌”，财联社记者多方采访了解到，DDR5内存条近期确实存在价格再度下行的情形，但整体未见“断崖式下跌”趋势。业内人士表示，近期现货价格与合约价格差距收窄，系在合约价格涨幅收敛后，渠道商出现获利出货所致。（财联社）", "ctime": 1777525323, "time_str": "13:02:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260430/c676412085.shtml"}, {"id": "4304629", "title": "巴斯夫第一季度销售额160.2亿欧元", "content": "巴斯夫第一季度销售额160.2亿欧元，预估160.3亿欧元；调整后每股收益1.32欧元，预估1.03欧元。", "ctime": 1777525251, "time_str": "13:00:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260430/c676412071.shtml"}, {"id": "4304585", "title": "全国人大常委会举行宪法宣誓仪式", "content": "十四届全国人大常委会30日上午在北京人民大会堂举行宪法宣誓仪式。全国人大常委会副委员长李鸿忠主持并监誓。刚刚闭幕的十四届全国人大常委会第二十二次会议决定任命张成中为应急管理部部长。根据宪法和全国人大常委会关于实行宪法宣誓制度的决定，依法进行宪法宣誓。全国人大机关、应急管理部有关负责同志参加了宣誓活动。(新华社)", "ctime": 1777525047, "time_str": "12:57:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260430/c676412011.shtml"}, {"id": "4304577", "title": "赵乐际主持十四届全国人大常委会第二十二次会议闭幕会并作讲话强调高质量做好人大各项工作服务保障“十五五”良好开局", "content": "全国人大常委会委员长赵乐际30日上午主持十四届全国人大常委会第二十二次会议闭幕会。在会议完成有关表决事项后，赵乐际作了讲话。(新华社)", "ctime": 1777525010, "time_str": "12:56:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260430/c676412001.shtml"}, {"id": "4304527", "title": "极越汽车合并重整获受理", "content": "4月30日，据知情人士了解，极越汽车部分关联企业已于近日获得重整申请的裁定，获准对上述多家关联企业进行实质合并重整。此前，极越汽车已发布公告宣布启动预重整程序，旨在通过预重整引入新的投资人，保障用户售后权益与资产价值，盘活企业现有资产和资源。本次裁定意味着极越汽车从预重整阶段正式转入司法重整程序，将通过法治化方式实现资源整合与合并重组。（第一财经）", "ctime": 1777524692, "time_str": "12:51:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260430/c676411923.shtml"}, {"id": "4304501", "title": "白宫与美联储博弈不断", "content": "美国联邦储备委员会宣布维持联邦基金利率不变，连续第三次未调整利率。自特朗普上任以来，他与美联储的矛盾升级，公开呼吁降息并批评鲍威尔等官员，甚至威胁干预人事任免。特朗普多次抨击美联储高利率政策，要求立即降息，称其扼杀经济增长。尽管美联储在2025年9月首次降息25个基点，但未能满足特朗普的激进诉求。特朗普的施压可能出于多重经济与政治诉求，包括降低政府借贷成本和刺激经济。然而，这种博弈可能动摇市场对美联储政策的信心，影响货币政策效果和美元稳定性。（央视新闻）", "ctime": 1777524474, "time_str": "12:47:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260430/c676411871.shtml"}, {"id": "4304489", "title": "美国10年期国债收益率上升1.4个基点至4.429%", "content": "美国10年期国债收益率上升1.4个基点至4.429%，美国30年期国债收益率上升1.7个基点至5.003%。", "ctime": 1777524190, "time_str": "12:43:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260430/c676411785.shtml"}, {"id": "4304463", "title": "美国太空探索技术公司成功发射通信卫星", "content": "美国太空探索技术公司使用“猎鹰重型”运载火箭成功将卫讯公司的“ViaSat-3 F3”大型通信卫星送入地球同步转移轨道。卫星将逐步进入地球静止轨道，主要面向亚太地区提供通信服务。“猎鹰重型”火箭是全球推力最强的运载火箭之一，其上一次执行任务是将“欧罗巴快帆船”探测器送上太空。（央视新闻）", "ctime": 1777523877, "time_str": "12:37:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260430/c676411696.shtml"}, {"id": "4304451", "title": "特朗普将听取对伊朗军事行动新方案汇报", "content": "美国阿克西奥斯新闻网站4月29日援引消息人士的话报道称，美国总统特朗普将于30日听取美军中央司令部司令布拉德·库珀关于在伊朗可能采取军事行动新方案的汇报。报道称，这表明特朗普考虑重启对伊朗大规模军事行动，“要么试图打破谈判僵局，要么在结束战事前进行决定性一击”。美军中央司令部已制定一项计划，拟对伊朗发动一轮“短促而猛烈”的打击，目标可能包括伊朗的基础设施， const META     = {"update_time": "2026-04-30 14:15:33", "sentiment_score": 54.27927927927928, "agents": []};

// 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';

  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">

        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
