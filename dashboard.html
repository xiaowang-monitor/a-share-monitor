: "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260518/c676760599.shtml"}, {"id": "4374453", "title": "沪深京三市成交额超2.2万亿元，较上日此时缩量3105亿元", "content": "据同花顺iFinD数据，沪深京三市成交额超2.2万亿元，较上日此时缩量3105亿元，预计全天成交金额约2.9万亿元。截至目前，沪市成交额9895亿元，深市成交额11935亿元，北证50成交额177亿元。", "ctime": 1779082258, "time_str": "13:30:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260518/c676760597.shtml"}, {"id": "4374443", "title": "我国具有北斗功能的终端产品总保有量超22亿台/套", "content": "中国卫星导航定位协会18日发布《2026中国北斗时空产业发展白皮书》显示，2025年国内北斗终端产品总销量超过4.1亿台/套。截至2025年底，国内北斗兼容型芯片及模块累计出货量接近26亿片（含智能手机），具有北斗功能的各类型终端产品社会总保有量超过22亿台/套（含智能手机）。其中，具有北斗定位功能的智能手机出货量近2.8亿部，车载导航仪市场终端销量超过2400万台，包括手持、物联网、穿戴式、车载（含两轮车）、高精度、船载等在内的各类监控及定位终端设备销量超过1.2亿台/套。（科创板日报）", "ctime": 1779082097, "time_str": "13:28:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260518/c676760569.shtml"}, {"id": "4374439", "title": "腾讯设计智能体Ardot公测 设计一键转代码", "content": "今天，腾讯自研AI设计智能体平台Ardot正式公测。用户可以用自然语言描述界面需求，Ardot实时流式生成可编辑的设计初稿，并一键转代码。（财联社）", "ctime": 1779082025, "time_str": "13:27:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260518/c676760554.shtml"}, {"id": "4374431", "title": "中国联通：当好Token的生产者、运营者、服务者", "content": "5月14日至15日，中国联通在雄安召开助力国家区域协调发展研讨会。会议强调，坚决贯彻落实党中央“六张网”建设部署要求，加强空天地一体、通感算一体等6G关键技术攻关，打造新一代通信网和算力网。坚持勇立潮头，加快创新转型。紧跟AI发展趋势，依托“连接”和“算力”核心能力，当好Token的生产者、运营者、服务者，彰显中国联通的先进性、安全性。（人民财讯）", "ctime": 1779081709, "time_str": "13:21:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260518/c676760487.shtml"}, {"id": "4374421", "title": "人形机器人概念股午后拉升，美格智能涨停", "content": "人形机器人概念股午后拉升，美格智能、北自科技涨停，江海股份、雷赛智能、瑞可达跟涨。", "ctime": 1779081584, "time_str": "13:19:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260518/c676760462.shtml"}, {"id": "4374405", "title": "融通基金杨泠枫： 算力进入稀缺时代 供需缺口催生三大投资主线", "content": "近期，以光模块、国产算力为代表的科技赛道再度成为资金焦点。融通科技臻选基金经理杨泠枫认为，人工智能（AI）大模型应用场景的持续拓宽正带动Token消耗量大幅攀升，行业算力供给已进入偏紧格局。AI产业链的高景气具备坚实的产业基础，其成长逻辑清晰可见。在他看来，AI产业包含算力、模型（算法）与应用三个紧密关联的环节。从产业端观察，AI目前仍处于投入期，算力需求旺盛，而应用的落地与业绩兑现节奏已是历史最快。杨泠枫分析道，模型厂商早期在训练算力上的投入较高，后续投入增长相对稳健。随着AI渗透率快速提升，推理算力呈现指数级增长。根据英伟达测算，2024年推理算力需求占总算力需求的比例已达40%，预计2025年推理算力将正式超过训练算力。（新浪财经）", "ctime": 1779081228, "time_str": "13:13:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260518/c676760361.shtml"}, {"id": "4374399", "title": "胖东来“网红”洗洁精、洗衣液宣布涨价，单瓶涨幅超1元，店方：因成本上涨调价", "content": "5月17日，胖东来超市3款洗洁精和2款洗衣液同时涨价，单瓶涨价超过1元。18日，胖东来多家超市工作人员表示，相关商品因成本上涨原因调价。记者了解到，在抖音胖东来官方旗舰店，两类产品的价格也同步进行了调整，5瓶果蔬餐具净售价50元，4瓶酵素香氛洗衣液售价86元。（极目新闻）", "ctime": 1779081000, "time_str": "13:10:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260518/c676760306.shtml"}, {"id": "4374395", "title": "PCB概念股午后拉升，广信材料20cm涨停", "content": "PCB概念股午后拉升，广信材料20cm涨停，温州宏丰涨超10%，生益科技、赛意信息、奕东电子、兴森科技跟涨。", "ctime": 1779080894, "time_str": "13:08:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260518/c676760276.shtml"}, {"id": "4374383", "title": "北京朝阳发布《朝阳区推动IP潮玩产业高质量发展三年行动计划（2026—2028年）》", "content": "5月18日，北京朝阳发布《朝阳区推动IP潮玩产业高质量发展三年行动计划（2026—2028年）》及配套政策，提出到2028年，朝阳区IP潮玩产业营收将突破500亿元，年均增速将不低于20%，孵化爆款潮玩IP将不少于10个，全力打造“龙头企业集聚地、爆款潮玩孵化地、沉浸式体验目的地、品牌出海传播地”的具体目标。行动计划围绕原创IP培育、IP交易转化、消费活力释放、品牌传播推广、产业生态服务五大方向系统发力。同时，同步出台的配套支持政策，聚焦原创开发、企业引育、技术创新、首发经济、人才保障等关键领域精准发力。", "ctime": 1779080774, "time_str": "13:06:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260518/c676760243.shtml"}, {"id": "4374381", "title": "沪深京三市成交额超2万亿元，较上日此时缩量2737亿元", "content": "据同花顺iFinD数据，沪深京三市成交额超2万亿元，较上日此时缩量2737亿元，预计全天成交金额约2.9万亿元。截至目前，沪市成交额8993亿元，深市成交额10846亿元，北证50成交额162亿元。", "ctime": 1779080729, "time_str": "13:05:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260518/c676760238.shtml"}, {"id": "4374379", "title": "港股阿里巴巴-W午后短线拉升转涨", "content": "港股阿里巴巴-W午后短线拉升转涨，早盘跌超2%。", "ctime": 1779080721, "time_str": "13:05:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260518/c676760236.shtml"}, {"id": "4374377", "title": "南通住建局回应“通报一度撤下”：接申诉后暂时撤下复核，已恢复", "content": "近日，江苏省南通市住房和城乡建设局官网发布的一则通报出现一度撤下的情况，引发舆论关注。就此，南通市住建局回应称，2026年5月11日，该局官网发布《2026年第一季度南通市主城区房建工程安全文明及劳动用工监管情况通报》。5月14日上午，部分被通报项目对通报内容提出申诉。为进一步核实相关信息，5月14日下午，该局对网站相关内容暂时撤下并开展复核校验。经复核，通报问题属实，相关内容已于5月15日下午恢复发布。该局将持续督促被通报项目做好问题闭环整改。南通市住建局还表示，后续，该局将进一步规范网站信息发布管理，切实提升政务公开服务质效。感谢和欢迎社会各界的监督。（澎湃新闻）", "ctime": 1779080705, "time_str": "13:05:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260518/c676760224.shtml"}, {"id": "4374373", "title": "今日上市新股N嘉晨午后扩大涨幅至530%，触发临停", "content": "今日上市新股N嘉晨午后扩大涨幅至530%，触发临停，成交超9亿元。", "ctime": 1779080657, "time_str": "13:04:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260518/c676760210.shtml"}, {"id": "4374369", "title": "电力板块午后再度拉升，江苏新能直线涨停", "content": "电力板块午后再度拉升，江苏新能直线涨停，京能电力、立新能源此前封板，浙江新能、绿发电力跟涨。", "ctime": 1779080546, "time_str": "13:02:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260518/c676760180.shtml"}, {"id": "4374339", "title": "上交所：5月18日盘中即时起至收市暂停中韩半导体ETF华泰柏瑞 (513310)_交易业务", "content": "根据华泰柏瑞基金管理有限公司申请，上交所于2026年5月18日盘中即时起至收市暂停华泰柏瑞中证韩交所中韩半导体交易型开放式指数证券投资基金（QDII）（证券代码：513310）交易业务。", "ctime": 1779080338, "time_str": "12:58:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260518/c676760134.shtml"}, {"id": "4374337", "title": "*ST海源盘中跌停，公司回应：公司核心光伏项目还在推进中", "content": "5月18日，*ST海源股价盘中跌停。有消息称，作为*ST海源核心光伏项目的2.7GW光伏电池项目推进不及预期，产能扩张落空，在市场竞争中处于不利地位。此外，公司业绩连续亏损，经营层面问题较大。\n对此，*ST海源方面回应记者称，股吧里的一些消息不是公司层面发布的。公司核心光伏项目还在推进中。公司目前确实面临较大亏损，公司寄希望于定增项目落地后，针对营收扩大拿出解决方案。 （中国证券报）", "ctime": 1779080321, "time_str": "12:58:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260518/c676760129.shtml"}, {"id": "4374335", "title": "国务院国资委组织开展中央企业生态环境保护工作专题学习", "content": "国务院国资委5月15日举办中央企业生态环境保护工作专题学习会，本次专题学习邀请生态环境部部长黄润秋作专题授课。国务院国资委主任张玉卓主持学习并讲话。张玉卓表示，要更加突出问题导向，高质量抓好中央生态环境保护督察发现问题的整改整治，扛牢整改主体责任，确保问题整改到位，严肃开展追责问责；系统强化专业能力，高标准提升生态环境保护工作质效，持续完善生态环境保护体制机制，建强生态环境保护干部队伍，强化生态环境保护要素保障；坚决转变发展方式，高水平培育绿色发展动能，认真落实污染防治攻坚部署，积极稳妥推进碳达峰碳中和，加快培育发展绿色生产力，擦亮中央企业高质量发展的绿色底色。(国资委)", "ctime": 1779080276, "time_str": "12:57:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260518/c676760113.shtml"}, {"id": "4374327", "title": "美参议员称要打击伊朗能源设施", "content": "当地时间5月17日，美国联邦参议员、共和党人格雷厄姆在美国全国广播公司《与媒体见面》节目中称，美国应重启军事行动，进一步削弱伊朗，特别是要打击伊朗的“软肋”——能源设施。格雷厄姆称：“给他们（伊朗）制造更多痛苦，也许他们就会达成协议，前提是痛得够狠。”(CCTV国际时讯)", "ctime": 1779080234, "time_str": "12:57:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260518/c676760094.shtml"}, {"id": "4374291", "title": "内塔尼亚胡称接近完成加沙行动一大目标", "content": "当地时间5月17日，以色列总理内塔尼亚胡在内阁例会上表示，以方已接近达成其在加沙地带军事行动的关键目标之一，即清除所有策划2023年10月7日突袭以色列的巴勒斯坦伊斯兰抵抗运动（哈马斯）高层。“我们已经非常接近完成这项任务。”内塔尼亚胡表示。内塔尼亚胡发表上述讲话前两天，以军宣布打死哈马斯下属军事派别卡桑旅指挥官伊兹丁·哈达德。按照以军说法，哈达德是加沙地带最后一名存活的哈马斯元老。据悉，在哈马斯原领导人叶海亚·辛瓦尔、原军事部门首领穆罕默德·戴夫等哈马斯高层接连遭以军“定点清除”后，哈达德成为哈马斯最高级别“话事人”之一，也是以色列与哈马斯去年10月达成停火协议以来以军袭击的哈马斯最高级别成员。（央视新闻）", "ctime": 1779079256, "time_str": "12:40:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260518/c676759886.shtml"}, {"id": "4374289", "title": "第79届世界卫生大会中国代表团：中国深化卫生领域创新合作　贡献中国经验助力全球卫生治理", "content": "出席第79届世界卫生大会的中国代表团17日在瑞士日内瓦举办媒体吹风会。中国国家卫生健康委主任雷海潮、中国常驻联合国日内瓦办事处和瑞士其他国际组织代表贾桂德、中国国家疾病预防控制局局长沈洪兵出席吹风会并答记者问。\n作为中国代表团团长，雷海潮在吹风会上介绍了健康中国建设工作的进展。他表示，过去十年，中国卫生健康事业的发展和建设主要呈现出以下几个方面的积极变化，包括贯彻预防为主的理念，公共卫生体系持续提升，能力水平大幅改善；医疗服务体系的能力不断增强，在服务可及性、城乡公平性、均等化与覆盖面，以及居民就医便利性等方面均有显著提升；传统医药的传承与发展也取得了新的进步。同时，在健康中国建设过程中，全社会和全民的广泛参与得到了高度重视。\n雷海潮同时表示，中国愿将卫生治理的经验与技术同世界各国分享，积极推动“一带一路”卫生合作，并持续向广大发展中国家派遣常驻医疗队。目前仍有60多支中国医疗队在海外服务，在非洲、拉美等国家发挥重要作用——不仅提供医疗服务，还传授中国医务人员掌握的先进技术与管理经验，为当地培养大量适宜人才。这是中国在解决自身健康问题的同时，为国际社会作出的重要贡献。(新华社)", "ctime": 1779079096, "time_str": "12:38:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260518/c676759852.shtml"}, {"id": "4374283", "title": "广西柳州凌晨5.2级地震 当地多家上市公司回应", "content": "5月18日0时21分，广西柳州市柳南区发生5.2级地震，震源深度8千米。当天上午10时左右消息显示，地震已致2人死亡，1人失联。对此，记者以投资者身份致电柳州当地多家上市公司，了解地震对生产经营情况影响。两面针接线工作人员表示：“目前还是正常上班的，公司工厂在城中区，对生产经营没有影响。”柳药集团接线工作人员表示：“公司今天正常上班，暂时没有听说生产的设备或者厂房有损失，预计地震影响较小。”柳工接线工作人员回应称：“公司员工今天正常上班，没有什么突发意外情况，我们的生产经营完全没受影响。柳州地震比较少见，会看舆情情况再发澄清公告。”当天，记者亦多次致电*ST柳化、柳钢股份，截至发稿，均无人接听。（21财经）", "ctime": 1779078827, "time_str": "12:33:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260518/c676759772.shtml"}, {"id": "4374279", "title": "胡塞据报又击落美军MQ9无人机", "content": "据伊朗等国媒体今天（5月18日）报道，也门胡塞武装当地时间5月17日晚在也门西部马里卜省击落一架美军MQ-9“死神”无人机。相关报道还附有被击落无人机残骸的图片以及无人机坠毁燃烧的视频。有消息称，这架“死神”无人机被击落时，还携带有AGM-114R9X“地狱火”导弹。美方目前尚未证实有无人机在也门被击落。(CCTV国际时讯)", "ctime": 1779078697, "time_str": "12:31:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260518/c676759735.shtml"}, {"id": "4374275", "title": "英杰电气：截至目前公司AI电源产品尚未获得北美市场相关厂商认证", "content": "英杰电气5月18日在互动平台表示，截至目前公司相关产品尚未获得北美市场相关厂商的认证；针对国内合作厂商相关事宜，因受既定保密协议条款约束，相关合作细节暂不便对外披露。", "ctime": 1779078516, "time_str": "12:28:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260518/c676759712.shtml"}, {"id": "4374273", "title": "Anthropic据悉将向金融稳定委员会简报AI模型Mythos发现的网络防御漏洞", "content": "5月18日消息，据报道，Anthropic已同意向金融稳定委员会（FSB）成员简报其AI模型Mythos的相关情况。Anthropic将重点简报Mythos所识别出的、全球金融体系网络防御方面存在的脆弱性。FSB目前正着手起草一份关于金融体系中应用AI的稳健实践报告，并计划于下月发布该报告以征求意见。（界面新闻）", "ctime": 1779078236, "time_str": "12:23:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260518/c676759663.shtml"}, {"id": "4374271", "title": "上海：到“十五五”末 力争推动10万台人形机器人进工厂", "content": "“开局起步‘十五五’”上海专场新闻发布会5月18日召开。上海市经济信息化委主任汤文侃表示，聚焦集成电路、高端装备、汽车等重点产业，以10家样板企业为牵引，一体化布局具身智能、工业智能体、工业语料和智算云平台，培育智能原生工厂。力争到“十五五”末，推动10万台人形机器人进工厂，规上工业企业智能体应用普及率超过80%。（人民财讯）", "ctime": 1779078221, "time_str": "12:23:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260518/c676759660.shtml"}, {"id": "4374267", "title": "未受邀请，美国特使“强行”访问格陵兰岛", "content": "丹麦自治领地格陵兰岛消息人士说，美国总统特朗普任命的“格陵兰岛特使”、路易斯安那州州长杰夫·兰德里在未受邀请的情况下，17日抵达这一世界第一大岛，计划参加当地商界主办的一场活动。格陵兰岛自治政府领导人暂未证实会否接见兰德里。据格陵兰岛媒体《塞尔米特夏克报》报道，兰德里17日抵达该岛首府努克，定于19日和20日出席当地商界协会主办的“未来的格陵兰岛”经济论坛。兰德里一行由大约10人组成。美国驻丹麦大使馆上周发表声明说，大使肯尼思·豪韦里将和兰德里一起参加格陵兰岛的经济论坛。声明将这次访问描述成“倾听当地民意、增进双方理解”的契机。不过，活动主办方表示，虽然活动对所有人开放，但并未邀请兰德里与会。格陵兰岛自治政府方面也未作回应。（新华社）", "ctime": 1779078205, "time_str": "12:23:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260518/c676759653.shtml"}, {"id": "4374263", "title": "一艘装载中东产液化天然气的运输船抵达日本", "content": "总台记者当地时间18日获悉，一艘装载中东产液化天然气（LNG）的运输船近日抵达日本东京湾。这被认为是美伊冲突以来，在霍尔木兹海峡遭事实性封锁后，首艘成功穿越海峡并抵达日本的液化天然气运输船。\n据悉，本次抵达东京湾的是一艘利比里亚籍液化天然气运输船，由阿联酋一家企业所有。\n根据提供船舶位置与航线信息数据的网站显示，该运输船于今年4月从阿联酋出发，随后经由霍尔木兹海峡航行至日本。(央视新闻)", "ctime": 1779078177, "time_str": "12:22:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260518/c676759643.shtml"}, {"id": "4374259", "title": "淘宝闪购年度活跃骑士超千万，升级骑士职业保障与成长发展体系", "content": "淘宝闪购5月17日举办首届城市骑士节，宣布启动“橙意计划”2.0，进一步加大投入，全新升级骑士职业保障与成长发展体系。数据显示，淘宝闪购年度活跃骑士已超千万。数据显示，2026年1-3月，阿里巴巴即时零售收入同比增长57%，淘宝闪购订单规模和市场份额显著提升，整体订单规模是上年同期的2.7倍，其中，非餐零售部分是上年的3倍。在即时物流方面，淘宝闪购年度活跃骑士超1000万，新增就业机会超百万。(新京报)", "ctime": 1779078036, "time_str": "12:20:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260518/c676759623.shtml"}, {"id": "4374243", "title": "“极壳科技”获5000万美元B+轮融资", "content": "近日，外骨骼品牌“极壳科技”宣布完成5000万美元B+轮融资。此轮融资由蚂蚁集团和美团龙珠领投，Sofina、Granite Asia跟投，高鹄资本担任独家财务顾问。此轮融资将加速极壳在技术研发、全球市场拓展及消费场景应用方面的布局。(36氪)", "ctime": 1779077787, "time_str": "12:16:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260518/c676759451.shtml"}, {"id": "4374205", "title": "茅台起诉茅渊酒厂商标侵权索赔300万", "content": "企查查APP显示，近日，法院就侵害商标权纠纷一案，向贵州省仁怀市茅台镇茅渊酒厂有限公司、吴某公告送达应诉通知书、开庭传票、起诉状等材料，原告为贵州茅台（600519.SH）。\n详情显示，贵州茅台要求被告停止在全国地域范围内生产、销售案涉“原茅台特制酒厂”酒；停止在产品包装等方面及销售话术中使用“原茅台特制酒厂”“茅台集团原总工程师”“年份茅台口感”等假宣传行为，并要求被告赔偿经济损失共计300万元。信息显示，该案将于6月29日上午9时30分开庭审理。\n据企查查信息显示，被告贵州省仁怀市茅台镇茅渊酒厂有限公司多个商标被驳回或无效，其中“茅渊”、“酒都茅渊 MAO YUAN 1985”图形商标均在初审时被驳回。(财闻)", "ctime": 1779077382, "time_str": "12:09:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260518/c676759362.shtml"}, {"id": "4374203", "title": "张雪机车第五冠车手感谢中国车迷", "content": "5月17日，在2026世界超级摩托车锦标赛捷克站WorldSSP组别第二回合正赛中，中国摩托车制造商“张雪机车”旗下的法国车手瓦伦丁·德比斯继前一日首回合取胜后再度夺冠。在包揽本站两回合冠军的同时，德比斯也为自己和车队拿下赛季第五冠。赛后，德比斯再次感谢了中国车迷的支持，他希望能有更多的人关注、参与并享受这项运动。(CCTV国际时讯)", "ctime": 1779077359, "time_str": "12:09:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260518/c676759360.shtml"}, {"id": "4374191", "title": "水利部启动水利抗震救灾调度指挥机制", "content": "记者从水利部了解到，针对广西柳州市柳南区发生5.2级地震，水利部迅即启动水利抗震救灾调度指挥机制，经初步排查，震区江河水情平稳，暂未收到水利工程震损情况报告；震区个别农村供水水源一度出现浑浊，经应急处置，现已恢复正常供水。此外，受降雨影响，昨日到今日，重庆、湖北、广西、陕西等地12条中小河流发生超警以上洪水。最大超警幅度1.88米，目前大部已退至警戒以下。（央视新闻）", "ctime": 1779076932, "time_str": "12:02:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260518/c676759270.shtml"}, {"id": "4374189", "title": "上海：未来五年新增高技能人才30万人次以上", "content": "在“开局起步‘十五五’”上海专场新闻发布会上，上海市政府副秘书长、上海市发展改革委主任刘健提出，面向“十五五”，在人才资源方面，深化高水平人才高地建设，加快引育国内外优秀的各类创新人才，未来五年新增高技能人才30万人次以上。（科创板日报）", "ctime": 1779076918, "time_str": "12:01:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260518/c676759264.shtml"}, {"id": "4374183", "title": "港股午评：恒生指数跌1.35%，恒生科技指数跌2.08%", "content": "港股午间收盘，恒生指数跌1.35%，恒生科技指数跌2.08%。恒指港股通ETF银华（159318）跌1.42%，港股通科技ETF鹏华（159751）跌2.05%。板块方面，通信设备板块涨幅靠前；汽车、客运航空公司板块跌幅靠前。个股方面，翼菲科技涨81.15%，金辉控股涨53.23%，五一视界涨29.6%，上海电气涨11.36%，智谱涨9.42%；理想汽车-W跌14.42%，零跑汽车跌10.88%，天岳先进跌10.76%，百奥赛图-B跌9.24%，今海医疗科技跌9.19%。", "ctime": 1779076885, "time_str": "12:01:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260518/c676759257.shtml"}, {"id": "4374179", "title": "5月18日午间公告一览：晨化股份阻燃剂车间恢复试生产", "content": "晨化股份公告，公司于2024 年11 月1日披露了《关于发生火灾事故的公告》（公告编号：2024-066），公司阻燃剂车间临时停产。事故发生后，公司立即启动应急预案，及时完成了事故的善后处置工作，并按照相关规定配合有关部门进行事故调查及隐患排查。随后，公司按照规范要求对阻燃剂车间进行重新设计并优化了相关生产工艺。近日，该车间已完成升级改造，正式恢复试生产。", "ctime": 1779076846, "time_str": "12:00:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260518/c676759248.shtml"}, {"id": "4374177", "title":   const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
