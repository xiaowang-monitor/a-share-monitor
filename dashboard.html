* { margin:0; padding:0; box-sizing:border-box; }
body {

  background: var(--bg-primary);
  color: var(--text-primary);
  min-height: 100vh;
}
.mono { font-family: 'JetBrains Mono', monospace; }
.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 20px;
  transition: all 0.2s;
}
.card:hover { background: var(--bg-card-hover); border-color: #334155; }
.badge {
  display: inline-flex; align-items: center; padding: 2px 8px;
  border-radius: 6px; font-size: 12px; font-weight: 500;
}
.badge-s { background: rgba(239,68,68,0.2); color: #ef4444; }

.badge-c { background: rgba(100,116,139,0.2); color: #94a3b8; }
.score-bar {
  height: 6px; border-radius: 3px; background: #1e293b; overflow: hidden;
}
.score-bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s; }
.up { color: var(--red); }
.down { color: var(--green); }
.pulse { animation: pulse 2s infinite; }
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}
.glow { box-shadow: 0 0 20px rgba(59,130,246,0.15); }
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg-primary); }

</style>

 "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261009/c680520359.shtml"}, {"id": "5352293", "title": "中美官员讨论互访核设施？外交部：与事实不符", "content": "外交部发言人毛宁主持例行记者会。当地时间10月6日，美国有线电视新闻网报道称，中美官员近几个月来一直在讨论相互访问核相关设施的可能性，包括美国能源部国家实验室以及中国相应设施。会上，法新社记者就此提问。对此，毛宁表示：“有关报道与事实不符。” (澎湃新闻)", "ctime": 1791530719, "time_str": "15:25:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261009/c680519988.shtml"}, {"id": "5352291", "title": "美国AI热潮致旧金山现租房危机", "content": "旧金山是OpenAI等头部企业的总部所在地，当地约三分之二居民租房居住。眼下市内一居室月租金均价高达4400美元，比去年大涨超过25%，几乎是全美均价的三倍。虽然旧金山市对房租实施管控，但指望借AI热潮发财的房东利用各种漏洞尝试赶走老房客，进而涨房租或变卖房产。有统计显示，与去年相比，今年全市房东“逐客令”飙涨44%。现阶段，两居室房租均价达6000美元，市中心四居室房租已超过1万美元。（新华社）", "ctime": 1791530709, "time_str": "15:25:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261009/c680519986.shtml"}, {"id": "5352287", "title": "外交部：中国海警依法依规采取处置措施 正当合理", "content": "10月9日，外交部发言人毛宁主持例行记者会。有记者问：据报道，菲律宾海岸警卫队发言人称，8日上午，菲海警在遭到中国海警水炮及危险机动干扰的情况下，完成对仁爱礁“坐滩”军舰上一名伤员的医疗后送任务。中方对此有何评论?毛宁表示，中国海警局的新闻发言人已经发表谈话，介绍了有关事态的真实情况。8日早晨，菲律宾一艘海警船在未经中方允许的情况下，侵入中国南沙群岛仁爱礁附近海域，中国海警依法依规采取处置措施，正当合理。后经双方沟通，中方出于人道主义考虑，第一时间允许菲方采取小艇过驳的方式转运伤员，并提供了必要便利。菲方个别人士非但不领情，还罔顾事实、断章取义，对中方倒打一耙，再次暴露其挑事生非、哗众取宠的真实目的，令人不齿。中方将坚决回应任何恶意挑衅，坚定捍卫自身领土主权和海洋权益。", "ctime": 1791530664, "time_str": "15:24:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261009/c680519954.shtml"}, {"id": "5352285", "title": "日本右翼向AI大模型“投毒”篡改历史，外交部：用心险恶的暗箱操作", "content": "10月9日，外交部发言人毛宁主持例行记者会。凤凰卫视记者提问，据披露，日本右翼势力持续向国际主流大模型提供经过篡改的二战历史语料，一些大模型在对话中输出带有明显错误史观的回答，例如将七七事变称为“日中军事冲突”，将南京大屠杀淡化为“南京陷落”，将日本侵略东南亚美化为“对南方资源的关心”等。发言人对此有何评论？毛宁表示，日本军国主义侵略罪行铁证如山，不容否认。借助新型技术搞数据投毒是日本右翼势力歪曲、美化侵略历史的新伎俩，目的仍然是扭曲全球公众对二战的历史认知，为日本摆脱战后体制约束，加速“再军事化”扫除舆论障碍。毛宁强调，人工智能应当向上、向善，而不是被用于篡改历史真相，洗白侵略罪责。日本右翼势力用心险恶的暗箱操作，是对被侵略国人民感情的严重伤害和对人类良知的公然践踏。国际社会必须提高警惕，共同抵制。", "ctime": 1791530602, "time_str": "15:23:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261009/c680519908.shtml"}, {"id": "5352283", "title": "外交部回应美方涉所谓中国黑客言论：维护网络安全是中美的共同关切", "content": "10月9日，外交部发言人毛宁主持例行记者会。路透社记者提问，美国司法部官员表示查封了七个与中国黑客有关联的互联网域名，这些黑客试图入侵美国及外国的关键基础设施系统。请问中方有何评论？“中方一贯坚决反对并依法打击黑客活动，同时坚决反对出于政治目的散布虚假信息，制造各种杂音。”毛宁指出，维护网络安全是中美的共同关切。中方敦促美方摒弃双重标准和政治操弄，与中方通过平等对话协商，共同应对网络安全风险，构建和平稳定、相互尊重的中美网络关系。(澎湃新闻)", "ctime": 1791530579, "time_str": "15:22:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261009/c680519903.shtml"}, {"id": "5352263", "title": "山姆拟限制亲友卡绑定", "content": "10月9日，山姆会员商店宣布拟更新《山姆会员商店会员章程》，现公开征求意见。《山姆会员商店会员章程》拟新增：自首次激活亲友卡之日起每365天，该亲友卡关联的实名身份信息仅能用于激活两名个人主卡会员的亲友卡，且每次仅能激活一名个人主卡会员的亲友卡。", "ctime": 1791530319, "time_str": "15:18:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261009/c680519710.shtml"}, {"id": "5352243", "title": "印度反驳美国劳工政策：限制人才流动损害双方利益", "content": "印度外交部就美国劳工部针对部分企业永久劳工认证（PERM）项目采取的措施发表声明称，PERM与H-1B签证项目不同，暂停PERM申请不会影响现有H-1B签证持有者及其家属身份，但可能影响相关员工申请美国永久居留（绿卡）的流程。印度表示，人才流动能够为美印两国创造共同利益，印度专业人士不仅获得发展机会，也为美国企业创新、研发、生产率提升和就业创造作出贡献。美国副总统此前相关言论缺乏依据，在美印度专业人士受过高等教育、具备高技能，是美国经济和创新体系的重要组成部分，并强调带有历史和殖民含义的相关措辞“极具冒犯性”。印度表示将继续关注事态发展。", "ctime": 1791530163, "time_str": "15:16:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261009/c680519617.shtml"}, {"id": "5352237", "title": "富兰克林邓普顿：大型科技公司发行短债为AI域提供了投资机会", "content": "富兰克林邓普顿首席执行官珍妮·约翰逊表示，大型科技公司发行的短期债务为人工智能领域提供了投资机会，原因在于这些企业拥有强劲的现金流和资产负债表。相比之下，持有长期债券则会让投资者面临技术进步带来的不确定性风险。", "ctime": 1791530132, "time_str": "15:15:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261009/c680519607.shtml"}, {"id": "5352211", "title": "龙蟠科技投资成立智联科技公司", "content": "企查查APP显示，近日，江苏一卡智联科技有限公司成立，经营范围包含国内贸易代理；货物进出口；汽车零配件零售；汽车零配件批发；汽车装饰用品销售等。企查查股权穿透显示，该公司由龙蟠科技间接全资持股。（人民财讯）", "ctime": 1791529991, "time_str": "15:13:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261009/c680519562.shtml"}, {"id": "5352203", "title": "让科研成果更快惠及老年人 北京为老实验室正式成立", "content": "记者从今天（9日）举办的2026北京养老服务行业发展四季青论坛获悉，北京为老实验室正式揭牌成立，旨在整合北京市涉老科研、教学、产业、服务等各领域优质资源，破解养老服务专业支撑不足、科技融合不深、供需对接不畅等现实难题，打通养老领域“基础研究—技术攻关—成果转化—产业应用”全链条。（央视新闻）", "ctime": 1791529901, "time_str": "15:11:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261009/c680519532.shtml"}, {"id": "5352177", "title": "博茨瓦纳总统博科将访华", "content": "外交部发言人宣布：应国家主席习近平邀请，博茨瓦纳共和国总统杜马·希代翁·博科将于10月12日至17日对中国进行国事访问。(央视新闻)", "ctime": 1791529744, "time_str": "15:09:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261009/c680519453.shtml"}, {"id": "5352149", "title": "百度、银河通用机器人等入股简智机器人", "content": "天眼查App显示，近日，简智机器人关联公司简智新创（北京）机器人科技有限公司发生工商变更，新增北京百度网讯科技有限公司、银河通用机器人旗下苏州盖博特科技有限公司等为股东，同时，注册资本由约19.3万元人民币增至约1052.4万元人民币。该公司成立于2025年5月，法定代表人为陈建兴，经营范围包括服务消费机器人制造、服务消费机器人销售、软件开发等，现由陈建兴、北京简智新创一号智能科技合伙企业（有限合伙）及上述新增股东等共同持股。", "ctime": 1791529539, "time_str": "15:05:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261009/c680519373.shtml"}, {"id": "5352125", "title": "艾力斯回应海外三期临床研究失败：不影响伏美替尼销售", "content": "10月9日，艾力斯回应核心产品伏美替尼海外临床失败称，该FURVENT研究数据有待深入分析，确定后续开发及监管沟通方案。公司认为本次FURVENT研究结果不会影响伏美替尼第三季度及未来的销售，该药目前的销售主要来自EGFR敏感突变一线治疗适应证。艾力斯称，在之后召开的FURVENT研究全球研究者会议上，专家认为伏美替尼对EGFR 20外显子插入突变达到了此前的疗效预期。化疗组经盲态独立中心审评评估的无进展生存期与研究者评估结果存在较大差异，除这一差异外，伏美替尼的其他各项数据表现良好。", "ctime": 1791529469, "time_str": "15:04:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261009/c680519358.shtml"}, {"id": "5352077", "title": "欧洲主要股指开盘集体上涨", "content": "欧洲主要股指开盘集体上涨，欧洲斯托克50指数涨0.58%，英国富时100指数涨0.8%，法国CAC40指数涨0.35%，德国DAX指数涨0.67%。", "ctime": 1791529304, "time_str": "15:01:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261009/c680519308.shtml"}, {"id": "5352075", "title": "ETF两市成交额报5033.13亿元，较昨日此时放量726.73亿元", "content": "截至目前，ETF两市成交额报5033.13亿元，较昨日此时放量726.73亿元，分类型来看，股票型ETF成交额1669.61亿元，债券型ETF成交额2073.2亿元，货币型ETF成交额403.32亿元，商品型ETF成交额113.3亿元，QDII型ETF成交额773.71亿元。", "ctime": 1791529301, "time_str": "15:01:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261009/c680519306.shtml"}, {"id": "5352073", "title": "A股收评：创业板指探底回升涨0.22%，AI视频、影视院线板块午后大幅拉升", "content": "A股三大指数今日集体上涨，截至收盘，上证指数涨0.05%，深证成指涨0.17%，创业板指涨0.22%，北证50涨2.49%，科创50指数涨0.07%。全市场成交额19167亿元，较上日放量2224亿元，全市场超3200只个股上涨。板块题材上，AI视频、贵金属、软件开发、粮食种植、零售、乳业、证券、电池板块涨幅居前；风电设备、MLCC、PCB、CPO、先进封装、存储芯片板块跌幅居前。盘面上，国内首部AI超写实院线电影定档10月23日登陆全国院线，影视院线、AI视频概念股午后暴力拉升，中文在线、芒果超媒、吉视传媒等10余股涨停。国际金价反弹，贵金属板块午后走高，西部黄金封板。金融IT、软件板块午后同步走高，绿盟科技、麒麟信安收获20cm涨停。此外，粮食种植、乳业、电池等板块盘中均有表现。另一方面，MLCC、PCB等算力硬件股延续弱势，风华高科早盘一度跌停，金安国纪封死跌停，国瓷材料、深南电路等多股下跌。风电设备板块同样表现不佳，大金重工盘中跳水跌停，海力风电、天顺风能跌幅居前。", "ctime": 1791529292, "time_str": "15:01:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261009/c680519305.shtml"}, {"id": "5352051", "title": "期货收评：霍尔木兹海峡扰动！甲醇涨超7% 焦煤涨超4% 沪锡跌超4%", "content": "期货收评：截至收盘，大宗商品以上涨为主，涨幅方面，甲醇涨超7%，焦煤涨超4%，LPG涨近4%；跌幅方面，沪锡、欧线集运、乙二醇跌超4%，双胶纸、沥青、碳酸锂跌超2%。", "ctime": 1791529273, "time_str": "15:01:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261009/c680519298.shtml"}, {"id": "5352043", "title": "2026年国庆节假期国内出游8.26亿人次", "content": "2026年国庆节假期，全国文化和旅游市场平稳有序。经文化和旅游部数据中心测算，国庆节假期7天，全国国内出游8.26亿人次，国内出游总花费7383.75亿元，按可比口径（日均）同比2025年分别增长6.3%、4.3%。产品供给丰富多元。红色旅游备受青睐，40%的游客参观革命场馆、观看升旗仪式和爱国主义演出等活动。乡村旅游热度攀升，赏秋观景、非遗体验、农耕采摘、乡村夜游、篝火市集、稻田音乐会等广受欢迎。演出市场火热，全国举办大型演出180场次，其中演唱会125场次、音乐节55场次。（央视新闻）", "ctime": 1791529268, "time_str": "15:01:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261009/c680519297.shtml"}, {"id": "5352029", "title": "ETF收评：影视ETF领涨7.73%，科创综指增强ETF领跌3.55%", "content": "ETF收盘涨跌不一，影视ETF（516620）领涨7.73%，影视ETF（159855）涨7.53%，巴西ETF（159100）涨6.66%，科创综指增强ETF（588550）领跌3.55%，科创新材料ETF（589510）跌3.42%，科创100ETF（589270）跌2.64%。", "ctime": 1791529243, "time_str": "15:00:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261009/c680519291.shtml"}, {"id": "5351999", "title": "股指期货午盘收盘 主力合约全线收涨", "content": "股指期货午盘收盘，主力合约全线收涨。沪深300股指期货(IF)主力合约涨0.21%，上证50股指期货(IH)主力合约涨0.23%，中证500股指期货(IC)主力合约涨0.23%，中证1000股指期货(IM)主力合约涨0.36%。", "ctime": 1791529218, "time_str": "15:00:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261009/c680519282.shtml"}, {"id": "5351983", "title": "大商股份等成立医药商业管理公司", "content": "企查查APP显示，近日，大商医药商业管理（辽宁）有限公司成立，经营范围包含企业管理；企业管理咨询；信息咨询服务（不含许可类信息咨询服务）等。企查查股权穿透显示，该公司由大商股份等共同持股。（人民财讯）", "ctime": 1791529103, "time_str": "14:58:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261009/c680519248.shtml"}, {"id": "5351967", "title": "美国光通信龙头Lumentum产能告急 2029年初产能已售罄", "content": "据报道，美国光通信龙头公司Lumentum首席执行官Hurlston当地时间周五表示，随着科技企业竞相建设速度更快的AI数据中心，该公司直至2029年初的光器件产能已“全部售罄”。Hurlston表示，部分产品到明年仍有约70%的需求无法满足，另有部分产品到2028年仍有30%的需求无法满足。(第一财经)", "ctime": 1791528990, "time_str": "14:56:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261009/c680519228.shtml"}, {"id": "5351955", "title": "上期所欧线集运主力合约大跌5%", "content": "上期所欧线集运主力合约大跌5%，报2701点。", "ctime": 1791528938, "time_str": "14:55:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261009/c680519216.shtml"}, {"id": "5351957", "title": "日租金从万元跌至不足千元：国庆假期机器人告别\"表演经济\" 真实场景试炼开启商业化闯关", "content": "这个国庆假期，景区里除了“人人人人”，还多了一批机器人“员工”。它们不再只是在舞台上翻跟头、跳舞的“表演嘉宾”，而是开始排班上岗、卖货收款、巡检安防、夜间演出。据不完全统计，已有近30家具身智能及机器人企业进入文旅、零售和消费服务场景，国庆期间在岗规模达到数千台。与此同时，机器人租赁的“抢租潮”也已经消失，日租金从2025年初的万元级跌至不足千元。告别靠新鲜感吸睛的表演模式之后，文旅场景成为具身智能的现实试炼场，机器人“能上岗”已经实现，但走向可持续盈利，行业仍要翻越多重结构性关卡。（科创板日报）", "ctime": 1791528937, "time_str": "14:55:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261009/c680519217.shtml"}, {"id": "5351951", "title": "上期所合成橡胶主力合约涨超3%", "content": "上期所合成橡胶主力合约涨超3%，报16965元/吨。", "ctime": 1791528900, "time_str": "14:55:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261009/c680519201.shtml"}, {"id": "5351891", "title": "巴基斯坦安全部队打死7名武装分子", "content": "巴基斯坦总理办公室9日消息，巴安全部队在北瓦济里斯坦地区开展的一场行动中，打死7名武装分子并缴获了大量武器和弹药。（央视新闻）", "ctime": 1791528369, "time_str": "14:46:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261009/c680519069.shtml"}, {"id": "5351875", "title": "沪深京三市成交额超1.8万亿元，较上日此时放量2114亿元", "content": "据同花顺iFinD数据，沪深京三市成交额超1.8万亿元，较上日此时放量2114亿元，预计全天成交金额约1.9万亿元。截至目前，沪市成交额8353亿元，深市成交额9495亿元，北证50成交额151亿元。", "ctime": 1791528306, "time_str": "14:45:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261009/c680519040.shtml"}, {"id": "5351867", "title": "全国铁路中秋国庆假期运输发送旅客3.02亿人次，同比增长24.6%", "content": "10月9日，从国铁集团获悉，9月23日至10月8日，为期16天的铁路中秋国庆假期运输圆满收官，运输安全平稳有 // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
