time_str": "19:31:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260413/c675951721.shtml"}, {"id": "4219037", "title": "英首相称不支持封锁霍尔木兹海峡", "content": "英国首相斯塔默今天（4月13日）在接受采访时表示，英国不支持封锁霍尔木兹海峡。据英国《卫报》报道，在被问及“英国是否会支持美国的封锁行动”时，斯塔默说，“我们不支持封锁”。采访中，斯塔默再次强调，无论面对多大压力，英国都不会卷入这场冲突。(CCTV国际时讯)", "ctime": 1776079823, "time_str": "19:30:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260413/c675951491.shtml"}, {"id": "4219031", "title": "泰和新材：2025年净利润4146.49万元，同比下降52.81%", "content": "泰和新材公告，2025年营业收入35.95亿元，同比下降8.51%。净利润4146.49万元，同比下降52.81%。拟向全体股东每10股派发现金红利0.20元（含税）。", "ctime": 1776079694, "time_str": "19:28:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260413/c675951435.shtml"}, {"id": "4219011", "title": "高盛第一季度净营收172.3亿美元，每股收益17.55美元", "content": "高盛第一季度净营收172.3亿美元，每股收益17.55美元。", "ctime": 1776079597, "time_str": "19:26:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260413/c675951401.shtml"}, {"id": "4218969", "title": "以色列多次空袭黎巴嫩南部至少7人死亡", "content": "据黎巴嫩政府部门和当地媒体13日报道，以色列12日晚至13日凌晨对黎南部多地发动数次空袭，造成至少7人死亡、19人受伤。 据黎巴嫩国家通讯社报道，截至当地时间13日5时，以军对黎南部巴祖里耶镇进行了9次空袭，造成1人死亡、18人受伤。空袭还对该镇居民楼及一所公立学校造成严重破坏。此外，以军还对黎南部锡尔盖尔比耶等城镇发动多轮空袭，造成5人死亡。 另据黎巴嫩卫生部13日通报，以色列12日晚间对宾特朱拜勒地区的空袭击中了一支黎巴嫩红十字会救护车队，造成1名医护人员死亡、1人受伤。黎卫生部谴责该事件“公然违反国际准则和国际人道主义法”，并表示将依据国际法追责。 黎巴嫩真主党当天发表声明说，其对以军在黎南部的多个集结点及军事目标发动了袭击。真主党使用大批攻击型无人机及火箭弹，打击了以军在宾特朱拜勒周边的集结点及泰拜等地的军事目标。此外，真主党还袭击了以色列北部一个军营的雷达系统，并使用无人机打击了迈斯杰贝勒附近的一辆以军“梅卡瓦”坦克。 黎巴嫩卫生部12日表示，自3月2日黎以战火重燃以来，以色列对黎巴嫩发动的袭击已造成2055人死亡、6588人受伤。(新华社)", "ctime": 1776079440, "time_str": "19:24:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260413/c675951275.shtml"}, {"id": "4218967", "title": "西班牙国防大臣说美国威胁封锁伊朗港口“毫无道理”", "content": "西班牙国防大臣罗夫莱斯13日说，美国总统特朗普威胁将对伊朗港口实施封锁“毫无道理”。 罗夫莱斯当天在接受西班牙国家电视台采访时说，自战争爆发以来，“一切都可以说是荒谬的”，没有人知道开战的真正理由。她强调，这场战争已造成大量人员伤亡和严重经济损失，实施封锁不过是“这一系列失控局势中的又一步”。 罗夫莱斯说，西班牙政府立场明确：反对一切非法战争，反对侵犯人权，支持通过外交途径解决冲突，呼吁各方推动局势缓和。美国和以色列都不能将自己的规则强加于国际社会，必须尊重国际法和国际准则。 美国总统特朗普13日凌晨在社交媒体发文称，美国将从美国东部时间13日上午10时（北京时间13日22时）起封锁进出伊朗港口的船只。(新华社)", "ctime": 1776079379, "time_str": "19:22:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260413/c675950970.shtml"}, {"id": "4218965", "title": "东方精工：完成出售Fosber集团等三家子公司股权", "content": "东方精工公告，公司及子公司东方精工（荷兰）已向Foresight US及Foresight Italy出售所持Fosber集团、Fosber亚洲及Tiruña亚洲100%股权。本次交易对价为8.17亿欧元，已于2026年4月9日完成交割。其中，Fosber集团基础价格为6.37亿欧元，Fosber亚洲为1.25亿欧元，Tiruña亚洲为1203.6万欧元。交易对方已支付全部交易对价，标的公司债权债务已转移。此次交易不构成关联交易，也不构成重组上市。", "ctime": 1776079369, "time_str": "19:22:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260413/c675950966.shtml"}, {"id": "4218963", "title": "汉嘉数智：收到财政部行政处罚决定书", "content": "汉嘉数智公告，公司收到财政部行政处罚决定书，认定2024年对6个EPC联合体项目采用总额法按履约进度确认收入不符合规定，应按净额法确认收入，导致多计收入2.93亿元、多计成本2.93亿元。财政部决定对公司警告、通报批评并罚款80万元，对原单位负责人、原主管会计工作负责人和原会计机构负责人分别罚款20万元、10万元、10万元。公司对该事项高度重视，将认真加以整改。", "ctime": 1776079356, "time_str": "19:22:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260413/c675950963.shtml"}, {"id": "4218933", "title": "阿联酋阿提哈德航空扩展中国航线强化互联互通", "content": "阿联酋国家航空公司阿提哈德航空公司13日宣布，将新增5条中国航线、涉及每周28个航班班次，进一步强化阿联酋与中国之间的互联互通。 新增航线将连接阿布扎比与中国上海、广州、成都、杭州和深圳。这些航线将于今年10月起陆续运营。 阿提哈德航空表示，此举将进一步促进双边贸易、旅游和投资往来，同时提升关键供应链通道的货运能力，并强化阿布扎比作为连接中国与中东、非洲、欧洲及北美市场重要门户的枢纽地位。 公司董事会主席穆罕默德·阿里·舒拉法表示，此次扩展航线体现了阿中合作关系持续深化，将助推共同经济发展。 阿提哈德航空于2003年成立，航线网络覆盖中东、欧洲、亚洲、非洲、北美等地区。(新华社)", "ctime": 1776079118, "time_str": "19:18:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260413/c675950868.shtml"}, {"id": "4218911", "title": "德企今年一季度破产数量创新高", "content": "今年一季度，德国企业破产数量升至20多年来的最高值。据莱布尼茨经济研究所通报，一季度，德国共有4573家合伙公司和股份公司登记破产。联邦统计局的数据显示，上次破产数量超过这一规模是在2005年第三季度，当时有4771家合伙公司和股份公司破产。莱布尼茨经济研究所通报称，这一破产数量超过了2009年金融危机期间的水平。通报称，3月份，企业破产案例意外大幅增加，比2016年至2019年的3月平均值高71%。据通报，上个月，建筑和零售等行业的企业破产数量创下历史新高；从地区角度看，巴伐利亚州、巴登—符腾堡州和北莱茵—威斯特法伦州的破产数量最多。（参考消息）", "ctime": 1776078892, "time_str": "19:14:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260413/c675950803.shtml"}, {"id": "4218895", "title": "商务部副部长鄢东赴优刻得调研数字贸易工作", "content": "4月13日下午，商务部党组成员、副部长鄢东一行赴优刻得调研企业数字贸易发展情况。商务部服贸司司长孔德军、上海市商务委副主任周岚、杨浦区副区长刘晋元等陪同调研。优刻得董事长兼CEO季昕华向调研组详细汇报了公司全球化战略布局以及赋能数字贸易方面的实践成果。鄢东对优刻得在海外市场取得的成绩给予肯定，鼓励优刻得继续深耕海外市场，提升核心竞争力，为更多中国企业“走出去”提供坚实支撑，在参与国际数字服务合作中发挥更大作用。(人民财讯)", "ctime": 1776078755, "time_str": "19:12:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260413/c675950734.shtml"}, {"id": "4218877", "title": "日本在野党议要求严格武器出口审批", "content": "据日本广播协会今天（4月13日）报道，日本 “中道改革联合”、立宪民主党和公明党今天向日本政府提交建议，通过内阁会议决定等方式严格审批高杀伤性武器出口程序。建议中要求，对于取消对武器装备出口5种类型的限制，应在国会进行慎重且彻底的讨论。日本政府拟放宽武器出口限制据日媒此前报道，日本自民党安全保障调查会6日召开会议，讨论放宽武器出口限制的方案，并计划在4月份内修改“防卫装备转移三原则”及其运用指南，为武器出口“松绑”。(CCTV国际时讯)", "ctime": 1776078533, "time_str": "19:08:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260413/c675950259.shtml"}, {"id": "4218871", "title": "消息称三星电子2nm当前良率在55%上下", "content": "消息称三星电子的2nm工艺制程良率当前达到了55%上下，但该水平不仅落后于台积电约一成，另一方面也没有达到竞争重要Fabless企业代工订单所需的水平。业界人士指出，如果再考虑性能分级和后端封测流程的损失，以最终成品计三星电子的2nm良率将只剩下40%。这意味着该节点当前仍未成熟，无法稳定交付，且实际价格竞争力也相对不足。（科创板日报）", "ctime": 1776078493, "time_str": "19:08:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260413/c675950242.shtml"}, {" // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
