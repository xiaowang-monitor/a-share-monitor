1", "title": "盛视科技：NAONAO（闹闹）已于2026年11月11日正式发售", "content": "盛视科技在投资者关系活动记录表中表示，NAO机器人家族首款AI潮玩产品NAONAO（闹闹）已于2026年11月11日正式发售，目前正处于市场推广阶段，公司称销量正在持续提升，并将继续加大推广力度。", "ctime": 1795695762, "time_str": "20:22:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261126/c682263396.shtml"}, {"id": "5769409", "title": "奇安信与恒舟驭远达成战略合作", "content": "据奇安信集团消息，11月26日，奇安信集团与北京恒舟驭远航天科技有限公司（以下简称“恒舟驭远”）签署战略合作协议，围绕运载火箭研制全流程的信息安全建设展开长期合作。恒舟驭远专注于大运力可复用运载火箭自主研发，业务覆盖火箭研发、总装测试与地面测发控。按照协议，奇安信将组建专项服务团队，结合恒舟一号等型号的研制节奏，把工控安全、数据安全、零信任架构、安全攻防与应急处置等能力导入研制场景，提供从安全架构设计到常态化运营的全周期支撑。（人民财讯）", "ctime": 1795695500, "time_str": "20:18:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261126/c682263353.shtml"}, {"id": "5769395", "title": "瑜欣电子：拟1.6亿元现金收购华腾光电93.02%股权", "content": "瑜欣电子公告，公司拟以现金方式收购三明华腾光电科技有限公司剩余93.02%股权，交易价格为1.6亿元。公司此前于2026年7月通过认缴增资和老股转让方式以1200万元持有目标公司6.98%股权，本次交易完成后目标公司将成为公司全资子公司并纳入合并报表范围。本次交易已经公司第四届董事会第十五次会议审议通过，无需提交股东会审议。业绩承诺方承诺目标公司2027年、2028年、2029年扣非净利润累计不低于4500万元。", "ctime": 1795695355, "time_str": "20:15:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261126/c682263333.shtml"}, {"id": "5769391", "title": "裕太微：向特定对象发行A股股票申请获上交所审核通过", "content": "裕太微公告，公司于2026年11月26日收到上海证券交易所出具的《关于裕太微电子股份有限公司向特定对象发行股票的交易所审核意见》，上交所审核意见为：公司向特定对象发行股票申请符合发行条件、上市条件和信息披露要求，本所将在收到公司申请文件后提交中国证监会注册。本次向特定对象发行A股股票事项尚需获得中国证监会作出同意注册的决定后方可实施。", "ctime": 1795695307, "time_str": "20:15:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261126/c682263328.shtml"}, {"id": "5769387", "title": "*ST明德：拟以5000万元认缴创业投资基金", "content": "*ST明德公告，公司近日与上海鼎萧企业管理咨询中心（有限合伙）、爱尔医疗投资集团有限公司等共同签署合伙协议，拟以自有资金认缴扬州鼎庚创业投资合伙企业（有限合伙）5000万元，占基金认缴出资比例11.8765%。基金规模为4.21亿元，以最终实际认缴出资额为准；截至公告披露日，基金尚未完成募集。公司仅作为有限合伙人参与投资，不参与基金投资项目决策。本次投资存在基金不能成功设立、合伙人未能按约定出资、未能找到合适标的项目及投资收益不达预期等风险。", "ctime": 1795695296, "time_str": "20:14:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261126/c682263323.shtml"}, {"id": "5769375", "title": "德林海：控股股东等调整协议转让方案，转让价格降至18.87元/股", "content": "德林海公告，公司控股股东、实际控制人胡明明、5%以上股东顾伟、股东陈虹此前披露拟以25元/股向祝铭明协议转让1692万股。因公司实施2025年年度权益分派（每股转增0.4股），各方签署补充协议（二），转让股份数量调整为2368.8万股，占公司总股本的15.12%，转让价格调整为18.87元/股，转让价款合计4.47亿元。本次转让尚需向上交所申请合规性确认及办理过户登记手续。", "ctime": 1795695024, "time_str": "20:10:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261126/c682263236.shtml"}, {"id": "5769337", "title": "中俄两军举行战略磋商", "content": "11月26日，中俄两军以视频会议方式举行战略磋商。双方围绕落实两国元首共识、推动两军关系持续深化拓展进行交流，就国际和地区形势深入交换意见，表示两军将进一步加强沟通协作，共同维护国际和地区安全稳定。（央视新闻）", "ctime": 1795694746, "time_str": "20:05:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261126/c682263138.shtml"}, {"id": "5769331", "title": "北京对重点群体给予社保补贴 个人缴费享25%补贴", "content": "11月26日，据“北京人社”公众号发布消息，北京市对符合条件的重点行业招用的重点群体，给予个人扩大社会保险范围补贴。政策申请期限截至2026年12月31日。收到短信的重点群体人员，注意及时申请。补贴对象：在本市制造业、生活服务业、现代服务业的中小微企业就业的重点群体，包括：2026届高校毕业生；离校两年内未就业高校毕业生；登记失业半年以上人员；防止返贫致贫对象。补贴标准：按照重点群体缴纳基本养老保险费、基本医疗保险费、失业保险费个人缴费额的25%给予补贴。补贴期限从企业为重点群体实际缴纳社会保险费当月起计算，发放时间截至2027年底。补贴期限不超过12个月。（央视新闻）", "ctime": 1795694706, "time_str": "20:05:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261126/c682263104.shtml"}, {"id": "5769305", "title": "襄阳轴承：存在市场情绪过热、非理性炒作及短期快速回落风险", "content": "襄阳轴承公告，公司股票连续3个交易日（11月24日至11月26日）收盘价格涨幅偏离值累计达到21.42%，属于股票交易异常波动。公司最新市净率为11.8，汽车制造业最新市净率为1.58；公司提示股价涨幅较大，存在市场情绪过热、非理性炒作及短期快速回落风险。公司2023年至2025年及2026年前三季度归属于上市公司股东的净利润均为负。部分精密轴承产品可应用于谐波减速器、RV减速器等领域，累计营业收入20.52万元，约占2026年前三季度营业收入的0.018%，尚未实现盈利，相关业务短期内不会对公司业绩产生重大影响。公司称经营情况正常，未发现应披露而未披露的重大事项。", "ctime": 1795694563, "time_str": "20:02:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261126/c682262777.shtml"}, {"id": "5769281", "title": "市场监管总局开展网络交易平台信用共治活动", "content": "记者今天（26日）了解到，市场监管总局开展网络交易平台信用共治活动。推动平台企业守信践诺、规范经营，积极营造规范有序、诚信放心的网络消费环境。发布《网络交易平台信用共治倡议书》，向网络交易平台企业发出共同参与平台企业信用共治、将信用管理融入平台治理各环节的倡议。市场监管总局将以此次活动为契机，持续深化平台经济领域信用体系建设，以信用赋能平台经济健康发展。（央视新闻）", "ctime": 1795694423, "time_str": "20:00:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261126/c682262733.shtml"}, {"id": "5769251", "title": "引望正式发布辅助驾驶新品牌“星驰”", "content": "11月26日，华为公司高级副总裁、引望公司CEO靳玉志在华为乾崑生态大会上发布辅助驾驶新品牌——“星驰”，预计明年有超过10款搭载星驰辅助驾驶的新车上市。星驰辅助驾驶与乾崑智驾技术同源、资源共享：将采用技术同源的WEWA（世界引擎+世界行为模型）架构，共享乾崑智驾的云端算力和数据资源，此外还将遵从同一套研发流程与车规级质量管理体系。二者在具体功能和体验方面会有所差异，但安全算法、稳定性和可靠性不变。第一财经了解到，未来，乾崑智驾ADS将逐步向自动驾驶演进，星驰辅助驾驶将专注于辅助驾驶，两个品牌都将用高质量的解决方案满足不同消费者的需求。（第一财经）", "ctime": 1795694328, "time_str": "19:58:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261126/c682262712.shtml"}, {"id": "5769245", "title": "线上线下：拟7381.75万元转让五家全资子公司100%股权", "content": "线上线下公告，公司拟将全资子公司无锡凌恒、江苏易飞、无锡尚禹、北京智成、无锡永旭100%的股权，以7381.75万元的价格转让给关联方无锡峻茂投资有限公司，本次交易构成关联交易，尚需提交公司股东会审议。交易完成后，标的公司不再纳入公司合并报表范围。截至2026年11月26日，无锡凌恒对公司及下属其他子公司的应付账款、其他应付款合计9560.87万元，占公司最近一期经审计净资产的8.63%，本次交易将导致公司被动形成关联财务资助余额，协议约定由标的公司在营业执照变更完成后30个工作日内偿还，无锡峻茂和汪坤承担连带支付责任。", "ctime": 1795694318, "time_str": "19:58:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261126/c682262710.shtml"}, {"id": "5769233", "title": "*ST发展：连续两个交易日收盘涨幅偏离值累计超20%，股价存在低于面值退市风险", "content": "*ST发展公告，公司股票于2026年11月25日、26日连续两个交易日收盘价格涨幅偏离值累计超过20%，属于股票交易异常波动。公司核查称近期经营情况及内外部经营环境未发生重大变化，前期披露信息不存在需要更正、补充之处；公司与投资人签署的重整投资协议履约保证金已于2026年10月26日前全部支付。公司签署的战略合作框架协议为意向性约定，具体实施内容和进度尚不确定，且受预重整及重整进程影响，协议可能被终止、解除、撤销、认定无效或不能履行。若公司股价连续二十个交易日收盘价均低于1元，股票存在被终止上市风险；近期股票换手率较高，存在非理性炒作风险。", "ctime": 1795694203, "time_str": "19:56:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261126/c682262687.shtml"}, {"id": "5769229", "title": "北摩高科：回购股份比例达1.08%，已回购358.3万股支付9448.33万元", "content": "北摩高科公告，公司此前审议通过回购公司股份方案，回购金额不低于1.2亿元且不超过1.8亿元，回购股份用于实施股权激励或员工持股计划。截至2026年11月26日，公司通过股份回购专用证券账户以集中竞价交易方式回购公司股份358.3万股，占公司目前总股本的1.08%，最高成交价为29.24元/股，最低成交价为22.53元/股，成交总金额为9448.33万元（不含交易费用）。本次回购符合相关法律法规的要求，符合既定的回购股份方案。", "ctime": 1795694170, "time_str": "19:56:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261126/c682262677.shtml"}, {"id": "5769203", "title": "国光电器：拟以自有资金认缴出资3000万元参与共同投资", "content": "国光电器公告，公司董事会审议通过《关于与专业机构共同投资暨关联交易的议案》。公司拟作为有限合伙人，与北京经韬私募基金管理有限公司、智度科技股份有限公司共同投资嘉兴经韬炳鑫创业投资合伙企业（有限合伙），合伙企业目标认缴出资总额为10亿元，公司拟以自有资金认缴出资3000万元，占比约3%。智度股份为公司控股股东及其一致行动人之一，本次交易构成关联共同投资，无需提交公司股东会审议。", "ctime": 1795694014, "time_str": "19:53:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261126/c682262650.shtml"}, {"id": "5769197", "title": "盟科药业：1类新药注射用乙磷康替唑胺钠获批上市", "content": "盟科药业公告，公司近日收到国家药品监督管理局通知，批准公司自主研发的1类新药注射用乙磷康替唑胺钠（商品名：优喜泰）上市，剂型为注射剂，适应症为复杂性皮肤和软组织感染。该药为公司已上市产品康替唑胺基础上开发的水溶性前药。本次获批基于一项以利奈唑胺为对照的中国III期临床试验，结果显示该药非劣效于利奈唑胺，且未引起骨髓抑制相关血液学参数显著变化。该事项预计不会对公司本年度经营业绩产生重大影响。", "ctime": 1795693979, "time_str": "19:52:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261126/c682262630.shtml"}, {"id": "5769191", "title": "11月26日 周四《新闻联播》要闻17条", "content": "1、【新思想引领新征程】开放合作推动航天事业造福全人类；\n2、李强会见亚洲开发银行行长；\n3、我国将加快培育服务贸易发展新动能；\n4、我国发布《新一代通信网建设实施方案》；\n5、我国加速推进“人工智能+制造”专项行动；\n6、东风着陆场准备就绪 迎接神舟二十三号飞船返回；\n7、我国首次开展省间省内绿电联合交易；\n8、全国统一医保信息平台上线“连续用药管理”功能；\n9、雄安卫星总装、集成与测试中心正式投入运行；\n10、海太长江隧道首 is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261126/c682262480.shtml"}, {"id": "5769129", "title": "罗博特科：首次回购公司股份87200股，支付1980.21万元", "content": "罗博特科公告，公司此前审议通过回购公司A股股份方案，回购资金总额不低于人民币5000万元且不超过人民币1亿元，回购价格不超过人民币803.46元/股，回购股份将全部予以注销并减少公司注册资本。2026年11月26日，公司首次通过股份回购专用证券账户以集中竞价交易方式回购公司A股股份87200股，占公司目前总股本的0.0484%，最高成交价为人民币228.5元/股，最低成交价为人民币226.04元/股，成交总金额为人民币1980.21万元（不含交易费用）。", "ctime": 1795693300, "time_str": "19:41:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261126/c682262479.shtml"}, {"id": "5769121", "title": "可川科技：股东屠施恩及一致行动人合计持股比例降至4.99997%", "content": "可川科技公告，持股5%以上股东屠施恩及其一致行动人屠文斌、施玉庆合计持有公司股份比例由5.00492%降至4.99997%，权益变动触及1%、5%刻度且持股比例低于5%。2026年11月26日，屠施恩通过集中竞价方式减持9300股，占公司总股本的0.00495%。本次变动后，屠施恩及其一致行动人合计持有公司股份939.48万股，占总股本比例4.99997%。本次权益变动不会导致公司控股股东、实际控制人发生变化。", "ctime": 1795693206, "time_str": "19:40:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261126/c682262459.shtml"}, {"id": "5769117", "title": "*ST闻泰：闻泰转债转股价格向下修正为18元/股", "content": "*ST闻泰公告，公司此前披露因股票收盘价触发“闻泰转债”转股价格向下修正条款，董事会提议并获2026年第三次临时股东会审议通过向下修正转股价格。本次董事会确定将“闻泰转债”转股价格由18.36元/股向下修正为18元/股，自2026年11月30日起生效；“闻泰转债”于2026年11月27日停止转股，2026年11月30日起恢复转股。", "ctime": 1795693093, "time_str": "19:38:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261126/c682262409.shtml"}, {"id": "5769115", "title": "英维克：上半年发出商品约占存货40%，三季度末发出商品预计四季度或更晚确认收入", "content": "英维克在投资者关系活动记录表中表示，从2026年上半年看，发出商品约占存货40%，主要是需要安装验收的机房温控项目型业务；预计2026年第三季度末存货中的发出商品将在2026年第四季度或更晚些时候确认收入。", "ctime": 1795693039, "time_str": "19:37:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261126/c682262396.shtml"}, {"id": "5769111", "title": "银禧科技：拟以2000万元-4000万元回购公司股份", "content": "银禧科技公告，拟以不低于人民币200 中方将继续支持亚行相关工作，不断提高双方合作水平，共促地区发展繁荣。李强指出，今年以来，面对外部环境复杂变化，中国经济顶住压力稳健前行，为亚洲和世界经济注入了宝贵的稳定性确定性。中方将继续推动高质量发展，加快释放自身超大规模市场需求，促进科技创新和产业创新深度融合，推动经济持续向新向优向好，为区域发展贡献力量。中方愿同亚行一道落实新一期国别伙伴战略，在区域一体化、互联互通、新兴产业等领域加强合作，推动双方合作提质增效，更好实现互利共赢。神田真人表示，面对全球经济形势不确定性，中国经济展现韧性保持增长，新动能成效显著，亚行对此表示祝贺。今年是亚行与中国合作40周年。40年来，双方在基础设施建设、减贫、环境、气候行动等广泛领域合作实现长足进步，搭建起南南合作平台。亚行愿同中方落实好新一期国别伙伴战略，支持中国式现代化建设和“十五五”规划实施，推动亚行同中国的合作伙伴关系迈向更高水平。(新华社)", "ctime": 1795692246, "time_str": "19:24:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261126/c682262134.shtml"}, {"id": "5769009", "title": "澄天伟业：半导体封装材料业务前三季度收入同比增长95.62%", "content": "澄天伟业在投资者关系活动记录表中表示，公司半导体封装材料业务前三季度收入同比增长95.62%，较上半年同比增长77.02%的增速进一步提升，主要系下游需求持续旺盛。", "ctime": 1795692166, "time_str": "19:22:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261126/c682262101.shtml"}, {"id": "5769003", "title": "*ST英飞：刘肇怀7000万股被司法再冻结，占总股本5.84%", "content": "*ST英飞公告，公司持股5%以上股东刘肇怀所持7000万股于2026年11月25日被广东省深圳市中级人民法院司法再冻结，占其所持股份的35.84%、占公司总股本的5.84%，冻结期限至2029年11月24日。截至公告披露日，刘肇怀累计被冻结7000万股。上述股份已于2025年12月29日质押给公司全资子公司新普互联（北京）科技有限公司；新普互联就相关债权及刘肇怀提供部分担保事宜提起的诉讼已一审调解结案，目前正在申请执行。刘肇怀不属于公司控股股东或控股股东的一致行动人，本次司法再冻结不会导致公司控制权发生变更，亦不会影响公司日常生产经营情况。", "ctime": 1795692139, "time_str": "19:22:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261126/c682262068.shtml"}, {"id": "5768985", "title": "宏英智能：拟以5000万元-6000万元回购公司股份", "content": "宏英智能公告，公司拟以自有资金及/或自筹资金（含股票回购专项贷款资金等），通过集中竞价方式回购公司人民币普通股，回购金额不低于5000万元且不超过6000万元，价格不超过54.39元/股，期限为董事会审议通过回购方案之日起12个月内。回购股份拟用于股权激励或员工持股计划；如未能在回购完成后三年内实施前述用途，未使用部分将履行相关程序予以注销并减少注册资本。本次方案已获董事会审议通过，无需提交股东会审议。", "ctime": 1795692024, "time_str": "19:20:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261126/c682262045.shtml"}, {"id": "576897 // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {

  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
