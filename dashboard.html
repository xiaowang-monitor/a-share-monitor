}
.card:hover { background: var(--bg-card-hover); border-color: #334155; }
.badge {

  height: 6px; border-radius: 3px; background: #1e293b; overflow: hidden;
}
.score-bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s; }
.up { color: var(--red); }
.down { color: var(--green); }
.pulse { animation: pulse 2s infinite; }
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}
.glow { box-shadow: 0 0 20px rgba(59,130,246,0.15); }

</style>

/c677317422.shtml"}, {"id": "4488969", "title": "百度：获悉美国国防部将本公司列入国防部的中国军工企业名单 公司认为将其列入该名单并无正当理由", "content": "百度港交所公告，本公司获悉，美国国防部已发布《关于指定中国军工企业的通知》，根据该通知，国防部副部长已将本公司列入国防部的中国军工企业名单。由于本公司既不是中国军工企业，也不是中国国防工业的军民融合企业，本公司认为将其列入该名单并无正当理由。中国军工企业名单并非制裁名单。与该名单相关的美国政府采购限制不会影响本公司的业务，且中国军工企业名单并未限制进行本公司证券交易。", "ctime": 1780978655, "time_str": "12:17:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260609/c677317361.shtml"}, {"id": "4488953", "title": "习近平和彭丽媛参谒中朝友谊塔", "content": "当地时间6月9日上午，正在朝鲜进行国事访问的中共中央总书记、国家主席习近平和夫人彭丽媛参谒中朝友谊塔。朝鲜劳动党总书记、国务委员长金正恩和夫人李雪主陪同。 10时40分许，习近平和彭丽媛乘车抵达坐落于牡丹峰麓的中朝友谊塔，金正恩和李雪主迎接。朝鲜军乐队奏响中朝两国国歌。礼兵缓缓将花篮抬上平台。花篮缎带上写着“中国人民志愿军烈士永垂不朽”。习近平缓步走上平台，整理花篮缎带。全体人员向中国人民志愿军烈士默哀。默哀毕，习近平和金正恩观看仪仗队分列式。 习近平夫妇在金正恩夫妇陪同下步入友谊塔纪念厅。金正恩向习近平介绍了友谊塔内展现中国人民志愿军同朝鲜人民并肩浴血战斗、共同重建家园的史料、照片和油画作品。习近平驻足良久，仔细观看。习近平认真翻阅志愿军烈士名册，向金正恩介绍牺牲的志愿军将士有关情况。 习近平和金正恩一致认为，上世纪50年代中朝共同战斗的岁月是双方永恒的历史记忆，双方要共同维护好志愿军烈士纪念设施，开展富有特色的革命传统教育、青少年思想道德教育，让伟大的抗美援朝精神发扬光大，让伟大的中朝传统友谊世代传承。 蔡奇、王毅等参加。(新华社)", "ctime": 1780978454, "time_str": "12:14:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260609/c677317297.shtml"}, {"id": "4488939", "title": "菲律宾南部8日地震已致37死479伤", "content": "当地时间9日，菲律宾减灾委确认，菲律宾南部8日发生的地震已造成37人死亡，479人受伤。（央视新闻）", "ctime": 1780978209, "time_str": "12:10:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260609/c677317230.shtml"}, {"id": "4488937", "title": "韩国综指涨幅扩大至6%", "content": "韩国综指涨幅扩大至6%，现报7933.42点。", "ctime": 1780978205, "time_str": "12:10:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260609/c677317229.shtml"}, {"id": "4488931", "title": "方正证券：AI引领封装升级 关注TGV和电镀填孔核心工艺", "content": "方正证券发布研报称，AI芯片迈向万亿晶体管时代，传统有机基板在高频传输、热稳定性及大尺寸扩展性上的瓶颈日益凸显。玻璃光波导凭借优异的透光性和低光损耗，有望在2027年前后落地，成为CPO技术从\"光电分封\"走向\"光电一体\"的关键材料支撑。", "ctime": 1780977917, "time_str": "12:05:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260609/c677317106.shtml"}, {"id": "4488929", "title": "新西兰首都遭遇强风巨浪，数百居民疏散", "content": "新西兰首都惠灵顿9日遭遇强风和巨浪袭击，目前已有数百名居民疏散，渡轮服务和部分航班取消。据新西兰电台报道，强风当天在惠灵顿南部海岸掀起11米巨浪。另据惠灵顿地区应急管理办公室和当地媒体消息，巨浪漫过沿海公路。惠灵顿机场风速接近每小时100公里，部分进出港航班取消，一架小型飞机被吹翻。局部地区风速甚至达到每小时137公里。新西兰政府8日晚发布强制疏散令，要求惠灵顿南部海岸居民撤离。惠灵顿南部和东部地区当晚也宣布进入紧急状态。据新西兰电台报道，截至9日已有数百名居民撤离。此外，往返南北岛的库克海峡渡轮服务暂停。（新华社）", "ctime": 1780977902, "time_str": "12:05:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260609/c677317101.shtml"}, {"id": "4488921", "title": "港股午评：恒生指数跌0.15%，恒生科技指数涨0.62%", "content": "港股午间收盘，恒生指数跌0.15%，恒生科技指数涨0.62%。恒指港股通ETF银华（159318）涨0.16%，港股通科技ETF鹏华（159751）涨0.68%。板块方面，工业集团企业、半导体产品与设备板块涨幅靠前；能源设备与服务、生物科技板块跌幅靠前。个股方面，建滔集团涨21.95%，赤子城科技涨16.76%，建滔积层板涨14.39%，广合科技涨13.53%，天辰生物-B涨12.26%；耀才证券金融跌11.53%，精锋医疗-B跌9.63%，智谱跌8.22%，高鑫零售跌7.26%，首钢朗泽跌7.25%。", "ctime": 1780977691, "time_str": "12:01:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260609/c677317041.shtml"}, {"id": "4488917", "title": "一架美军直升机在霍尔木兹海峡附近坠毁", "content": "据美国媒体报道，一架美国陆军“阿帕奇”武装直升机8日在霍尔木兹海峡附近坠毁，两名机组人员安全获救。（新华社）", "ctime": 1780977472, "time_str": "11:57:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260609/c677316991.shtml"}, {"id": "4488911", "title": "万斯：美将推动同伊朗达成核协议 不管以色列是否愿意", "content": "美国副总统万斯8日表示，不管以色列是否愿意，美国将继续推动同伊朗达成协议。万斯当天接受美国福克斯新闻频道采访时说，以色列和美国之间确实存在许多共同利益，“但我们也存在利益不一致的情况……以色列显然有自己的目标，但美国对伊朗的首要目标是确保伊朗不拥有核武器”。他说，美国总统特朗普相信“能够就伊朗核问题达成一项长期解决方案”，“以色列可能会喜欢这个方案，也可能不喜欢，但从根本上讲，我们认为这最符合美国的利益”，“华盛顿将继续追求这一目标”。（新华社）", "ctime": 1780977373, "time_str": "11:56:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260609/c677316969.shtml"}, {"id": "4488905", "title": "IDC：第一季度全球家用清洁机器人市场出货893.6万台 同比增长36.7%", "content": "国际数据公司（IDC）最新追踪报告数据显示，2026年第一季度，全球家用清洁机器人市场出货893.6万台，同比增长36.7%。其中扫地机器人市场出货656.3万台，同比增长29.4%，头部厂商在欧洲市场布局力度持续加大。（人民财讯）", "ctime": 1780977187, "time_str": "11:53:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260609/c677316931.shtml"}, {"id": "4488901", "title": "南向资金净买入超40亿港元", "content": "据同花顺iFinD数据，截至目前，南向资金净买入超40亿港元，其中港股通（沪）买入超32.53亿港元，港股通（深）买入超7.49亿港元。", "ctime": 1780977119, "time_str": "11:51:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260609/c677316915.shtml"}, {"id": "4488887", "title": "伊朗官员：伊朗不排斥推进谈判 但美必须拿出诚意", "content": "据美国方面8日消息，伊朗伊斯兰议会国家安全和外交政策委员会主席易卜拉欣·阿齐兹在接受采访时说，原则上，伊朗并不排斥与美国推进和谈，但美国必须改变目前的行事方式，拿出自己的诚意。阿齐兹说，伊美双方在伊朗核计划、铀浓缩等主要问题上仍存在分歧，双方之间仍缺乏信任。此外，美国最初承诺即刻解冻伊朗的被冻结资产，但时至今日，伊朗仍未看到美方有兑现承诺的动向。当被问及伊美两国最终是否有可能达成和平协议时，阿齐兹说，答案取决于美方后续的实际行动。（央视新闻）", "ctime": 1780976949, "time_str": "11:49:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260609/c677316873.shtml"}, {"id": "4488885", "title": "晓鸣股份：5月鸡产品销售收入8784.62万元，环比减少16.76%", "content": "晓鸣股份公告,公司2026年5月销售鸡产品2351.04万羽，销售收入8784.62万元，环比变动分别为-12.64%、-16.76%，同比变动分别为1.13%、-12.90%。", "ctime": 1780976874, "time_str": "11:47:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260609/c677316846.shtml"}, {"id": "4488883", "title": "智元推出行业首个开放且完整的具身智能生态技术体系——智元AIMA", "content": "6月9日，智元发布《致全体开发者伙伴的一封信》中指出，智元推出行业首个开放且完整的具身智能生态技术体系——智元AIMA（AI Machine Architecture），为产业规模化、生态化发展筑牢底层根基。未来五年，智元将投入20亿元专项资金，用于科研创新、人才培养、伙伴发展及社区运营。今年，率先投入超1亿元赋能生态发展，赋能每一位AIMA开发者。（人民财讯）", "ctime": 1780976868, "time_str": "11:47:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260609/c677316845.shtml"}, {"id": "4488869", "title": "俄宣布击落95架无人机 摧毁乌多处军事基础设施", "content": "俄罗斯国防部8日发布战报说，俄防空兵当天在多地击落95架乌克兰无人机，俄军还摧毁乌方多处军事基础设施。根据俄国防部通过社交媒体发布的这份战报，莫斯科时间8日14时至20时，俄防空兵在俄西部别尔哥罗德州、布良斯克州、卡卢加州、库尔斯克州等多地及黑海上空拦截并摧毁95架乌方固定翼无人机。俄国防部还说，俄军摧毁了乌克兰武装力量使用的多处弹药库、燃料库、运输及电力设施，以及乌军部队和外国雇佣兵的139个临时部署点。此外，俄南部集团军部队当天采取行动，占据顿涅茨克地区一处城镇。（新华社）", "ctime": 1780976618, "time_str": "11:43:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260609/c677316778.shtml"}, {"id": "4488853", "title": "韩国综指涨幅扩大至5%", "content": "韩国综指涨幅扩大至5%，现报7859.3点。", "ctime": 1780976246, "time_str": "11:37:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260609/c677316581.shtml"}, {"id": "4488849", "title": "中国发布落实《新城市议程》国家报告", "content": "记者从住房城乡建设部获悉，《以高质量城市发展助力落实联合国2030年可持续发展议程——中国落实〈新城市议程〉国家报告》近日在京发布，集中呈现了城市可持续发展的中国智慧和中国方案。这份《报告》由住房城乡建设部会同40多个部门共同编写形成，从社会、经济和环境三个可持续发展维度，围绕城镇化、住房保障、绿色低碳转型、安全韧性建设等多个方面，展现了中国推动城市可持续发展的行动、举措与成效。据了解，《新城市议程》于2016年10月经联合国第三次住房和城市可持续发展大会通过，是2030年可持续发展议程在城市领域的实施纲领和政治承诺，倡导建设包容、安全、韧性和可持续的城市和社区。10年来，中国采取系列务实行动推进落实，城市发展取得历史性成就。据介绍，这份国家报告不仅总结了中国的经验，也为广大发展中国家推进可持续城市发展提供了有益借鉴，在另一个维度，报告还提出了人民城市、公园城市等先进理念，给其他国家的城市发展带来不一样的指导和借鉴。（央视新闻）", "ctime": 1780976203, "time_str": "11:36:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260609/c677316563.shtml"}, {"id": "4488835", "title": "伊朗伊玛目霍梅尼国际机场恢复航班运营", "content": "伊朗方面9日消息，位于伊朗首都德黑兰的伊玛目霍梅尼国际机场已恢复航班运营。当地时间7日晚至8日，伊朗与以色列爆发大规模交火，伊玛目霍梅尼国际机场一度暂停航班运行。（央视新闻）", "ctime": 1780976085, "time_str": "11:34:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260609/c677316496.shtml"}, {"id": "4488833", "title": "水利部：广西、广东、福 function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
