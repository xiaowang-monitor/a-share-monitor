出口航空货运量203.51万吨，日均超1万吨，创历史新高，比去年同期增长15.76%。今年以来，上海海关一系列便利化改革举措全面落地、协同发力。上半年，上海浦东国际机场新增7条全货机洲际航线、加密3条全货机航线，全货机架次数量同比增长20%，境外全货机通航点增至66个，为上海口岸进出口货物分流、中转提供了坚实运力支撑。（新华社）", "ctime": 1786088394, "time_str": "15:39:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260807/c678759490.shtml"}, {"id": "4915419", "title": "东方电气：王军未减持，李建华减持15500股", "content": "东方电气公告，公司于2026年4月10日披露高级管理人员减持股份计划公告，高级副总裁王军先生拟减持不超过800股，高级副总裁李建华先生拟减持不超过15500股。本次减持计划已实施完毕：王军先生未减持公司股份；李建华先生通过集中竞价交易方式合计减持15500股，占公司总股本的0.000448%，减持价格区间为40.48元/股，减持总金额为62.75万元。", "ctime": 1786088326, "time_str": "15:38:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260807/c678759456.shtml"}, {"id": "4915417", "title": "联环药业：乳果糖口服溶液获批，2025年销售额5.63亿元", "content": "联环药业公告，公司于近日收到国家药监局核准签发的乳果糖口服溶液(200ml:133.4g/15ml:10g)《药品注册证书》，注册分类为化学药品4类，视同通过仿制药质量和疗效一致性评价。该药品适用于慢性或习惯性便秘，调节结肠的生理节律；肝性脑病，用于治疗和预防肝昏迷或昏迷前状态。2025年全国二级以上医院该药品销售额达5.63亿元（数据来源于摩熵·医药数据库）。公司针对该药品的研发投入约为529.70万元（未经审计）。截至本公告披露日，公司及子公司2026年共获得12个生产批件。", "ctime": 1786088299, "time_str": "15:38:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260807/c678759441.shtml"}, {"id": "4915411", "title": "宇树科技王兴兴：人形机器人毛利率回落系多重原因所致", "content": "王兴兴今日在宇树科技科创板IPO网上路演中表示，公司在2023年销售了5台初代版本H1产品，因当时商业化人形机器人较为稀缺，该批产品的销售单价和毛利率均较高，与后续年度不具有可比性。2025年，人形机器人的毛利率有所回落，主要原因是：一方面，公司于2024年5月自研发布了G1款中型人形机器人，并快速成为人形机器人的主力销售机型，由于G1作为中型人形机器人的单位价格、单位成本、毛利率均低于全尺寸机器人H1，带动了公司人形机器人整体毛利率的下降。另一方面，公司持续通过生产降本和采购降本以优化产品单位成本，在此基础上，公司在2025年适当下调了产品的销售价格。数据显示，2023年至2025年，宇树科技人形机器人的毛利率分别为87.67%、69.26%和63.18%，呈现逐年下滑趋势。（科创板日报）", "ctime": 1786088239, "time_str": "15:37:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260807/c678759417.shtml"}, {"id": "4915399", "title": "“科学”号完成西太平洋共享航次科考凯旋归港", "content": "8月7日，“科学”号综合考察船在完成2026年度西太平洋科学考察共享航次后回到青岛。本航次紧扣西太平洋主流系‑暖池变异的气候环境效应、西太平洋复杂地质地貌演化的资源环境效应两大核心科学问题，统筹开展海‑气相互作用、物理海洋、海洋生态与生物、海洋化学、海洋地质等多学科联合综合观测。航次期间，科考队高效完成了全水深温盐深多参数剖面作业、箱式采泥、柱状取样等大面调查，并成功布放与回收“琅琊”系列大型潜浮标、漂流浮标及水下滑翔机，为破解关键科学难题筑牢了坚实的数据与样品基础。（央视新闻）", "ctime": 1786088050, "time_str": "15:34:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260807/c678759342.shtml"}, {"id": "4915395", "title": "巨星农牧：7月商品肥猪销售量33.98万头，同比增6.46%", "content": "巨星农牧公告，2026年7月商品肥猪销售量33.98万头，同比增6.46%；当月销售收入4.38亿元，当月销售均价9.96元/公斤。本年累计销售量258.78万头，累计销售收入34.74亿元。", "ctime": 1786087990, "time_str": "15:33:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260807/c678759300.shtml"}, {"id": "4915391", "title": "环旭电子：7月营收55.49亿元，同比增12.98%", "content": "环旭电子公告，2026年7月合并营业收入为人民币55.49亿元，较去年同期增加12.98%，较2026年6月环比增加15.52%；2026年1月至7月合并营业收入为人民币328.85亿元，较去年同期增加2.37%。", "ctime": 1786087954, "time_str": "15:32:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260807/c678759283.shtml"}, {"id": "4915389", "title": "傲农生物：7月生猪销售量14.2万头，同比-0.44%", "content": "傲农生物公告，2026年7月公司生猪销售量14.2万头，同比减少0.44%，较2026年6月减少27.57%；生猪存栏96.09万头，同比增长69.12%，较2026年6月增加16.68%，较2025年12月末增加29.27%。", "ctime": 1786087949, "time_str": "15:32:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260807/c678759278.shtml"}, {"id": "4915335", "title": "汇川技术：8月30日起数字能源部分产品涨价5%-15%", "content": "汇川技术发布产品调价函：经公司管理层慎重评估，为确保产品品质稳定及供应链持续可靠，决定对数字能源部分产品，包含储能变流器、变流升压一体机、储能集成系统系列产品进行价格调整，整体涨幅5%-15%，不同产品品类差异化调整。鉴于工程项目规格确认需要一定周期，自2026年8月30日零时起，所有新增订单执行调整后价格。（界面新闻）", "ctime": 1786087772, "time_str": "15:29:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260807/c678759193.shtml"}, {"id": "4915315", "title": "皮克斯经典《机器人总动员》内地首度公映，定档8月19日", "content": "由迪士尼影业出品、皮克斯动画工作室制作的经典动画电影《机器人总动员》（WALL·E）将在这个暑期档登陆大银幕，定档8月19日七夕佳节当日正式公映，并于8月15日开启超前点映。这也是这部诞生于2008年的奥斯卡最佳动画长片得主，首度在中国内地上映。(澎湃新闻)", "ctime": 1786087587, "time_str": "15:26:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260807/c678759112.shtml"}, {"id": "4915311", "title": "深圳新星在浙江成立新材料科技公司", "content": "企查查APP显示，近日，浙江新星凌川新材料科技有限公司成立，经营范围包含新兴能源技术研发；电子专用材料制造；电子专用材料研发；电子专用材料销售等。企查查股权穿透显示，该公司由深圳新星全资持股。（人民财讯）", "ctime": 1786087523, "time_str": "15:25:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260807/c678759092.shtml"}, {"id": "4915299", "title": "品茗科技与中铁一局集团智能科技分公司签署战略合作协议", "content": "8月5日，品茗科技与中铁一局集团有限公司智能科技分公司在西安正式签署战略合作协议。双方将聚焦智能建造软硬件深度应用，在联合研发、场景落地、成果转化及市场推广等方面开展全方位合作，围绕铁路、水利、市政、房建等工程建设领域共同打造行业标杆数字化项目与智能建造示范场景。同时，双方将联合构建科技创新合作平台，实现技术、市场与品牌的多维赋能。（人民财讯）", "ctime": 1786087478, "time_str": "15:24:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260807/c678759086.shtml"}, {"id": "4915291", "title": "陕西西咸文化旅游产业集团被执行超2亿", "content": "天眼查App显示，陕西西咸文化旅游产业集团有限公司成立于2012年9月，法定代表人为贺小龙，注册资本35亿人民币。司法案件风险信息显示，该公司目前有2条被执行人信息，合计被执行标的超2.6亿元，此外还涉及建设工程施工合同纠纷、服务合同纠纷等案件。（南方财经）", "ctime": 1786087376, "time_str": "15:22:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260807/c678759011.shtml"}, {"id": "4915285", "title": "SK海力士：将投资384亿美元在韩国本土扩张芯片业务", "content": "SK海力士表示，将投资384亿美元在韩国本土扩张芯片业务。计划在清州的M17芯片厂投资19.1万亿韩元（134.7亿美元），投资将在2031年前完成。计划在龙仁投资35.2万亿韩元（约249 亿美元）用于第二阶段芯片厂建设。（财联社）", "ctime": 1786087365, "time_str": "15:22:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260807/c678759009.shtml"}, {"id": "4915269", "title": "东方电热：公司智能尾门厨房产品目前主要应用于享界G9", "content": "东方电热8月7日在互动平台表示，公司自主研发的智能尾门厨房产品刚刚上市，目前主要应用于享界G9，其他客户正在开发中。上述业务有望助力公司将单车价值量提升至千元级别，但当前产生的营业收入很少，对公司没有重大影响。（人民财讯）", "ctime": 1786087244, "time_str": "15:20:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260807/c678758971.shtml"}, {"id": "4915255", "title": "内地居民的香港保险收益要缴税？香港保监局回应", "content": "一则关于香港保险收益涉及境外收入征税的消息引发市场关注。8月7日，多只香港保险股继续低开。而在前一日，友邦保险、保诚、富卫集团等股价大跌。此前有报道称，部分购买香港保险的内地投保人收到境外收入缴税通知，涉及地区包括浙江杭州、北京等。相关消息称，香港保险收益被纳入境外所得征收范围，适用税率为20%。对此，香港保险业监管局（保监局）回复称，政府和保监局正密切注意内地有关金融产品税务安排的最新发展，同时会与业界保持紧密沟通。内地居民就境外投资收益必须依法申报及缴税的要求一直存在，市场不用过度解读或作出揣测。（澎湃新闻）", "ctime": 1786087116, "time_str": "15:18:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260807/c678758703.shtml"}, {"id": "4915243", "title": "影石创新产品将上线AI语音助手，接入千问、Gemini模型", "content": "记者从影石创新处获悉，Insta360将于8月7日为GO Ultra拇指相机上线AI语音助手。该功能按区域采用不同大模型方案：中国大陆地区接入阿里千问大模型，中国港澳台及海外地区使用Google Gemini。据了解，该AI语音助手以影石自研为核心，融合阿里千问大模型的多模态能力及千问App的拍照问答能力。端侧完成声纹识别、意图判断，云端则承担问答、模式切换、翻译等复杂任务。（21世纪经济报道）", "ctime": 1786086925, "time_str": "15:15:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260807/c678758620.shtml"}, {"id": "4915231", "title": "国防部：向为国铸盾的国防科技工作者致敬", "content": "8月7日下午，国防部新闻发言人陈曦大校就近期涉军问题发布消息。陈曦表示，王戟研究员是我国高可信软件领域主要开拓者，扎根军事教学科研一线三十余年，始终秉持立德树人、为战育人初心，忠实履行以战领研、科研为战使命。面对高位截肢、肾衰竭等重大疾病打击，他仍以坚韧意志和乐观精神坚守战位、忘我奋斗，坚定不移攻坚国防科技自主创新高地，为大国重器关键软件安全可靠作出重要贡献。众多网友被这位“挺好的”教授所感动、所鼓励，称赞他“身如长戟，为国而立；胸怀赤诚，志在强军”。生命向前，冲锋不止。王戟的微笑与坚守是所有国防科技工作者默默奉献、为国铸盾的缩影，我们向这些以身许党许国的楷模致以崇高敬意和诚挚祝福。广大官兵将以他们为榜样，牢记初心使命，勠力奋斗强军，以崭新政治面貌迎接建军一百周年。（央视新闻）", "ctime": 1786086785, "time_str": "15:13:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260807/c678758563.shtml"}, {"id": "4915227", "title": "国防部：中国军队坚决反制任何闹海挑衅图谋", "content": "8月7日下午，国防部新闻发言人陈曦大校就近期涉军问题发布消息。记者：据报道，菲律宾向联合国交存所谓“黄岩岛及其周边海域的官方海图”后，中国人民解放军南部战区位黄岩岛领海、领空和周边海空域组织海空联合演训，中国海警也位黄岩岛附近海域组织维权执法管控演练。菲国家海事委员会发言人称中方在该区域进行的任何演习均被菲方视为“非法行为”。请问对此有何评论？陈曦：黄岩岛是中国固有领土，中方持续、和平、有效地对黄岩岛行使主权和管辖权，是唯一有权依据国际法宣布黄岩岛领海基线的国家。菲方有关行径严重侵犯中国领土主权，严重违反国际法与国际关系基本准则，是非法无效的。中方组织演训演练活动，是对菲方侵权挑衅行径的严正警告，是捍卫黄岩岛主权和权益的必要举措，完全正当合法。需要指出的是，自1946年独立至今，菲律宾多次打着国际法旗号，通过国内立法，扩张领土和管辖海域声索，已经引发南海周边国家的普遍警惕、反感与坚决反对。我们敦促菲方立即停止侵犯中国领土主权和海洋权益的非法行径，停止海上挑衅滋事和煽宣炒作。对任何闹海挑衅、制造事端的图谋，中国军队都将予以坚决有力反制。（央视新闻）", "ctime": 1786086714, "time_str": "15:11:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260807/c678758539.shtml"}, {"id": "4915213", "title": "《民用航空发展“十五五”规划》印发", "content": "中国民航局、国家发展改革委、交通运输部近日联合印发《民用航空发展“十五五”规划》。规划提出，全力建设系统协同的基础设施体系。坚持适度超前、不过度超前，坚持智能化、绿色化、融合化方向，坚持提质存量、做优增量并重，推进基础设施更新和数智化改造，提升安全运营可持续性，率先建成一流设施。全力构建自主可控的创新支撑体系。坚持需求牵引、问题导向，推动低空民用航空安全发展，加快民航数智化转型和科技自立自强，一体推进教育科技人才发展，培育民航新质生产力。（中国民航局）", "ctime": 1786086623, "time_str": "15:10:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260807/c678758514.shtml"}, {"id": "4915211", "title": "港交所：前7月首次公开招股集资金额3282亿港元，同比上升154%", "content": "香港交易所数据显示：2026年首七个月有104家新上市公司，同比上升96%。2026年首七个月的首次公开招股集资金额为3282亿港元，同比上升154%。2026年首七个月的总集资金额为5280亿港元，同比上升57%。（界面新闻）", "ctime": 1786086589, "time_str": "15:09:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260807/c678758494.shtml"}, {"id": "4915195", "title": "欧洲主要股指集体高开", "content": "欧洲主要股指集体高开，欧洲斯托克50指数涨0.19%，英国富时100指数涨0.3%，法国CAC40指数涨0.15%，德国DAX指数涨0.23%。", "ctime": 1786086434, "time_str": "15:07:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260807/c678758437.shtml"}, {"id": "4915103", "title" 0日，损害调查期为2022年7月1日至2026年6月30日。 案件利害相关方可登录英国贸易救济署网站注册（https://www.trade-remedies.service.gov.uk），以获得案件相关信息并参与相关调查程序，注册需在2026年8月21日前完成。（英国贸易救济服务官网）", "ctime": 1786085717, "time_str": "14:55:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260807/c678758228.shtml"}, {"id": "4914897", "title": "COMEX白银期货涨超4%", "content": "COMEX白银期货涨超4%，现报64.17美元/盎司。", "ctime": 1786085338, "time_str": "14:48:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260807/c678758163.shtml"}, {"id": "4914893", "title": "王兴兴：机器人激光雷达全自研核心技术等多项核心技术已应用于公司产品", "content": "宇树科技董事长、总经理兼首席技术官王兴兴在网上路演时表示，经过多年研发创新和技术积累，公司逐步形成了包括一体化关节集成技术、高紧凑度机器人身体集成技术、机器人激光雷达全自研核心技术等多项已商业化应用的核心技术并已应用于公司的高性能通用人形机器人、四足机器人等产品。在此基础上，公司在机器人外界感知能力、环境交互能力，提升机器人关节自由度、环境适应性和应用场景的通用性等细分技术领域进行研究布局，形成了一定的技术储备并持续进行技术更新迭代。", "ctime": 1786085318, "time_str": "14:48:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260807/c678758159.shtml"}, {"id": "4914887", "title": "电力板块短线拉升，华银电力涨停", "content": "电力板块短线拉升，华银电力涨停，华电辽能、晋控电力、大唐发电、京能电力、豫能控股等纷纷走高。", "ctime": 1786085308, "time_str": "14:48:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260807/c678758153.shtml"}, {"id": "4914807", "title": "北京利尔：洛阳利尔5800kVA脱硅锆电熔炉产出首批成品", "content": "8月5日，洛阳利尔功能材料有限公司电熔锆新车间5800kVA脱硅锆电熔炉顺利点火，配套的吹球室、循环水系统、除尘器、自动配料线、筛分除铁线及干燥线等全产线设备联动试运行，设备整体工况平稳可控。熔炉点火后，生产线按既定工艺完成全流程冶炼加工，顺利产出首批合格脱硅锆成品。新产线投产后，将有效缓解公司高端脱硅锆产品供应缺口。（人民财讯）", "ctime": 1786085013, "time_str": "14:43:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260807/c678758059.shtml"}, {"id": "4914793", "title": "孟加拉国发生客车相撞事故 致8死25伤", "content": "孟加拉国警方证实，当地时间7日7时30分左右，该国达卡-锡尔赫特公路上发生一起严重车祸，两辆客车迎头相撞，造成至少8人 e": "", "url": "https://news.10jqka.com.cn/20260807/c678757962.shtml"}, {"id": "4914673", "title": "日韩股市集体收跌", "content": "日经225指数收跌0.12%，报65606.71点。韩国综指收跌0.60%，报6258.71点。", "ctime": 1786084299, "time_str": "14:31:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260807/c678757825.shtml"}, {"id": "4914669", "title": "王兴兴：宇树科技将积极探索人形机器人、机甲等更多产品形态", "content": "宇树科技董事长、总经理兼首席技术官王兴兴8月7日在网上路演时表示，本次登陆资本市场，是宇树科技全新的起点。“未来我们将恪守初心，踏实打磨关键技术，持续深耕通用具身智能机器人核心技术研发与产业落地，让智能机器人更早、更好地为全社会服务。”王兴兴表示，宇树科技将持续攻坚具身大模型、场景数据采集与分析、强化学习、具身本体模型、核心零部件自研与高性能执行机构等软、硬件关键技术，并将积极探索人形机器人、四足机器人、机甲等更多的产品形态和型号，推动机器人承接高强度、高风险体力劳动，释放人类的创造力，推进机器人技术造福社会。（财联社）", "ctime": 1786084287, "time_str": "14:31:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260807/c678757823.shtml"}, {"id": "4914645", "title": "“AI教父”拉响警报：人类可能无法战胜下一代AI模型", "content": "在业内有“人工智能教父”之称的计算机科学家杰弗里·辛顿（Geoffrey Hinton）周三表示，随着人工智能（AI）技术在代际之间不断发展，人类可能无法继续保持对大型语言模型的统治地位。辛顿在拉斯维加斯举行的Ai4峰会上发表讲话后告诉媒体：“现在的情况是，这些东西变得越来越智能。我认为随着它们变得越来越智能，我们将看到它们拥有越来越复杂的意图，以及越来越强的逃脱控制的能力。我不认为我们能像过去那样，仅仅通过简单设法让他们无法逃脱来控制他们。”他后来补充道。此前，这位诺贝尔奖得主、前谷歌高管、深度学习奠基人已多次发出类似的警告：人类在面对下一代超级智能模型时，可能无法通过传统手段“战胜”或“关闭”它们。（新浪财经）", "ctime": 1786084042, "time_str": "14:27:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260807/c678757760.shtml"}, {"id": "4914635", "title": "应对台风“白海豚” 浙江提升防台风应急响应至Ⅲ级", "content": "为应对今年第13号台风“白海豚”可能带来的风雨影响，经研判会商，浙江省防指决定于8月7日12时将防台风应急响应提升至Ⅲ级，要求各地各部门密切关注台风发展变化，进一步做好监测预警预报、风险研判和管控、人员避险转移、社会面宣传引导等各项工作，切实保障人民群众生命财产安全。据浙江省气象台消息，台风“白海豚”8月7日8时位于浙江温岭偏东方向约763公里的洋面上，中心附近最大风力14级（强台风级）。预计“白海豚”将以每小时15至20公里左右的速度向偏西方向移动，强度变化不大或略有增强。浙江省气象台预计，此次台风影响或总体呈现风力大、持续时间长的特点，8月7日至8日，东海海域风力将达到10至13级。8日下午起，浙江沿海地区将有大雨暴雨，局部大暴雨，降雨影响时间长，累计雨量大，单点极端性强。（新华社）", "ctime": 1786083945, "time_str": "14:25:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260807/c678757746.shtml"}, {"id": "4914607", "title": "中国代表安理会发声 强调应维护南苏丹国家稳定", "content": "中国常驻联合国代表团临时代办孙磊6日在安理会审议南苏丹问题时发言，强调应维护该国国家稳定。孙磊说，南苏丹将于今年底举行大选，该国过渡进程进入关键阶段。维护国家稳定是根本前提。中方呼吁各方保持冷静克制，避免诉诸武力，防止局势升级。中方支持南苏丹政府和联合国南苏丹特派团继续推动族群间对话，实施更多建立信任措施，促进民众和睦相处、团结互助。中方呼吁南苏丹各党派从国家整体利益和民众根本福祉出发，切实维护并落实重振协议，通过包容性对话妥善处理矛盾、凝聚共识。国际社会应在尊重南苏丹主权、统一和领土完整基础上，为促进和平稳定，帮助南苏丹人民，发挥更多建设性作用。要及时调整或解除对南苏丹有关制裁，避免不当干涉施压。（新华社）", "ctime": 1786083669, "time_str": "14:21:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260807/c678757681.shtml"}];

    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
