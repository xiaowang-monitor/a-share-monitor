 "6月15日晚间消息，今日有消息称，“腾讯在林俊旸创立的新人工智能实验室的第一轮融资中投资了2000万美元。目前，该人工智能实验室已筹集了数亿美元，投后估值约为20亿美元。”\n\n　　公开信息显示，1993年3月19日出生，曾任阿里巴巴通义千问大模型负责人。林俊旸研究领域涵盖自然语言处理与多模态表示学习，曾是阿里巴巴最年轻的P10级技术负责人，也是通义千问体系的重要推动者之一，其多篇论文发表于自然语言处理顶级会议，并在学术界获得广泛引用。\n\n　　3月4日凌晨，林俊旸发文宣布离开阿里千问；3月5日，阿里巴巴CEO吴泳铭在内部邮件中回应公司已决定批准林俊旸的辞职。今年5月，有消息称林俊旸创立新 AI 实验室，寻求 20 亿美元估值。(新浪科技)", "ctime": 1781526867, "time_str": "20:34:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260615/c677479088.shtml"}, {"id": "4530485", "title": "外交部：欢迎美伊就第一阶段谅解备忘录内容达成一致", "content": "外交部发言人林剑15日表示，中方对美国和伊朗就第一阶段谅解备忘录内容达成一致表示欢迎，希望霍尔木兹海峡尽早恢复安全、自由通行。中方愿为早日恢复中东海湾地区和平安宁继续发挥积极作用。当日例行记者会上，有记者问：巴基斯坦总理夏巴兹15日早些时候宣布，美伊谈判达成协议，双方将在包括黎巴嫩在内各个战线立即永久停止军事行动。美伊随后也予以证实。中方对此有何评论？“中方对美国和伊朗就第一阶段谅解备忘录内容达成一致表示欢迎，对巴基斯坦所作斡旋努力表示赞赏。”林剑说，中方希望美伊如期签署第一阶段谅解备忘录，希望相关各方坚持和平选择，通过对话谈判解决问题。中方愿同国际社会一道，为早日恢复中东海湾地区和平安宁继续发挥积极作用。（新华社）", "ctime": 1781526828, "time_str": "20:33:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260615/c677479078.shtml"}, {"id": "4530457", "title": "美国副总统万斯：（关于伊朗）以色列在新的中东局势中肯定会有一席之地", "content": "美国副总统万斯：（关于伊朗）以色列在新的中东局势中肯定会有一席之地。", "ctime": 1781526601, "time_str": "20:30:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260615/c677477953.shtml"}, {"id": "4530439", "title": "伊朗：将对霍尔木兹海峡相关航运服务收费", "content": "据伊朗媒体15日报道，伊朗外交部发言人巴加埃当天表示，伊朗将在“特定时期内”负责霍尔木兹海峡安全通行管理，并将对相关航运服务收取费用。(新华社)", "ctime": 1781526544, "time_str": "20:29:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260615/c677477943.shtml"}, {"id": "4530379", "title": "阿达尼企业和捷普将建设人工智能数据中心", "content": "据报道，阿达尼企业（Adani Enterprises）和捷普（Jabil）宣布将建立战略联盟，在印度建设一个人工智能和数据中心基础设施制造平台。（第一财经）", "ctime": 1781526111, "time_str": "20:21:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260615/c677477825.shtml"}, {"id": "4530369", "title": "爱迪特：股东君联欣康及HAL拟减持不超过3%股份", "content": "爱迪特公告，持股5%以上股东苏州君联欣康创业投资合伙企业（有限合伙）及其一致行动人HEALTH ADVANCE LIMITED（合计持有公司1044.28万股，占总股本6.9996%）计划自公告披露之日起15个交易日后的3个月内，通过集中竞价或大宗交易方式减持公司股份合计不超过447.57万股（占总股本3.0000%）。其中集中竞价减持不超过149.19万股（占总股本1.0000%），大宗交易减持不超过298.38万股（占总股本2.0000%）。减持原因为股东自身资金需求。", "ctime": 1781526039, "time_str": "20:20:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260615/c677477799.shtml"}, {"id": "4530339", "title": "斩断“黑飞”黑灰产业链 上海警方连破3起涉无人机严重违法案件", "content": "近日，上海警方深挖无人机领域违法线索，先后侦破3起涉无人机严重违法案件，精准打击无人机“黑飞”使用者、非法破解服务商、破解软件制售从业者，斩断覆盖“研发售卖、非法破解、违规飞行”的黑灰利益链条。2026年3月，上海奉贤警方成功抓获打掉一处无人机破解软件研发售卖源头窝点。2026年4月，上海宝山警方根据线索，成功破获一起提供侵入、非法控制计算机信息系统程序、工具的刑事案件，抓获某航空科技服务有限公司法定代表人刘某。（央视新闻）", "ctime": 1781525707, "time_str": "20:15:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260615/c677477715.shtml"}, {"id": "4530317", "title": "伊朗外交部：伊美协议细节将很快公布", "content": "伊朗外交部发言人当天说，伊美停战谅解备忘录的细节将很快公布。（新华社）", "ctime": 1781525563, "time_str": "20:12:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260615/c677477683.shtml"}, {"id": "4530315", "title": "中富通：控股子公司英博达拟出资9180万元设立控股子公司笋壳科技", "content": "中富通公告，公司子公司深圳英博达科技有限公司计划与浙江梦工场孵化器有限公司、福州闽侯旭杭共创产业投资合伙企业共同投资设立杭州笋壳科技有限公司。笋壳科技注册资本1.8亿元，英博达认缴9180万元，持股51%；梦工场认缴6120万元，持股34%；旭杭产投认缴2700万元，持股15%。该投资已由公司董事会审议通过，尚需提交股东会审议。本次投资不构成重大资产重组，不会对公司财务及经营状况产生不利影响。", "ctime": 1781525559, "time_str": "20:12:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260615/c677477681.shtml"}, {"id": "4530313", "title": "中富通：控股子公司英博达拟出资510万元设立石砾科技", "content": "中富通公告，基于公司发展战略，子公司英博达计划与希姆半导体、索莹嘉业、旭杭产投共同投资设立石砾科技。石砾科技注册资本1000万元，英博达持股51%，旭杭产投持股21%，希姆半导体持股15%，索莹嘉业持股13%。该事项已通过董事会审议，尚需提交股东会审议。", "ctime": 1781525555, "time_str": "20:12:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260615/c677477677.shtml"}, {"id": "4530303", "title": "HVLP算力铜箔成关键基材 某厂商“在手订单已排至2027年下半年”", "content": "国内一家铜箔厂商市场负责人表示，目前该企业旗下专为AI服务器、高速光模块配套的HVLP4代算力铜箔，在手订单已排至2027年下半年。铜箔厂商需从RTF起步，逐步升级至HVLP1-2、HVLP3-4代，每代6一12个月验证周期，全程1一3年系统级认证。英伟达、AMD、Intel等海外厂商及华为昇腾等国产厂商对铜箔代际要求严格，仅认证全球少数龙头。（中证金牛座）", "ctime": 1781525476, "time_str": "20:11:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260615/c677477655.shtml"}, {"id": "4530291", "title": "东百集团：拟转让全资子公司东百红星100%股权 暂定股权转让价格为人民币182.78万元", "content": "东百集团公告，为持续推进公司商业零售业务轻资产转型，进一步优化公司资源配置和整体资产结构，以降低经营风险，盘活存量资产，实现业务稳健发展，公司全资子公司福建东方百货管理有限公司拟将持有的东百红星100%股权转让给福建德呈华业商业管理有限公司，暂定转让对价为人民币182.78万元。本次股权转让完成后，东百红星不再纳入公司合并报表范围，公司旗下相关全资子公司将为出表后的目标公司提供运营管理服务，收取相关管理费用，服务期限暂至2026年12月31日。", "ctime": 1781525373, "time_str": "20:09:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260615/c677477636.shtml"}, {"id": "4530257", "title": "罗文会见蒙古国副总理诺木泰巴亚尔", "content": "6月12日，国家市场监督管理总局局长罗文会见来访的蒙古国副总理诺木泰巴亚尔。双方就计量、标准化和合格评定领域合作进行交流，一致同意推进法制计量合作，加强重点贸易商品标准协调，分阶段建立健全合格评定互认机制，组织检验检测能力验证计划及人员培训等，以促进双边贸易便利化，为两国经贸关系发展作出更多贡献。会后，双方签署计量合作行动计划。总局相关司局负责同志参加会见。（国家市场监督管理局）", "ctime": 1781525097, "time_str": "20:04:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260615/c677477528.shtml"}, {"id": "4530253", "title": "儒意电影：拟以8000万元-1.5亿元回购公司股份", "content": "儒意电影公告，拟以8000万元-1.5亿元回购公司股份，回购价格不超过13.8元/股。", "ctime": 1781525092, "time_str": "20:04:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260615/c677477525.shtml"}, {"id": "4530223", "title": "崔东树：近期新能源经销商的厂家和渠道库存面临市场零售低于预期", "content": "乘联分会秘书长崔东树6月15日发文表示，2026年5月月末全国乘用车行业库存348万辆，较上月下降6万辆，较2025年5月增3万辆，形成库存持续走平的趋势。其中厂家库存占比30.3%，相对偏高。2026年5月乐观度27%，6月初的5月月后满意度为26%，预期低但满意度更差，主要是高油价的冲击太大。团队对6月市场的乐观度降到31%，这是近期市场乐观度判断的历史偏低预测指数。我们根据未来N+3的月度零售预测测算库存支撑未来天数，因此不是固定的当月数据，库存天数也会随预测调整而变化。根据2026年5月底的库存与未来3个月国内零售量综合预估的现有库存支撑未来销售天数在66天，相对于2023年5月的55天、2024年5月的62天，2025年5月的57天，今年5月的总体库存压力相对稍大。(蓝鲸新闻)", "ctime": 1781524946, "time_str": "20:02:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260615/c677477440.shtml"}, {"id": "4530211", "title": "香港首个五年规划展开公众咨询", "content": "香港特别行政区政府15日就香港特别行政区经济和社会发展第一个五年规划（2026—2030）展开公众咨询。特区政府发言人表示，香港首个五年规划是历史性的一步，具有重大意义，将为香港未来五年发展提供前瞻性、策略性和可操作性的指导文件，带领香港主动对接国家“十五五”规划，助力香港高质量发展的同时，推动香港更好融入和服务国家发展大局。发言人说，香港五年规划将会清晰阐述香港在未来五年的发展愿景及策略方向，涵盖经济、产业、空间规划、基建、绿色转型，以及医疗、教育、房屋、福利、安老等民生福祉范畴；“我们邀请社会各界和市民积极参与公众咨询，就香港五年规划发表意见”。（央视新闻）", "ctime": 1781524899, "time_str": "20:01:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260615/c677477384.shtml"}, {"id": "4530187", "title": "日内原油及聚酯原料暴跌 PET市场单日大跌320", "content": "美伊达成协议，地缘溢价迅速出清，日内原油及聚酯原料暴跌，PET现货均价今日大跌320元。PET成本支撑崩塌的同时，其供应存增加预期，需求跟进也有限，综合之下，今日PET市场跌幅大于原料端。综合来看，成本支撑不足，同时PET自身基本面表现欠佳，短期内PET市场或弱势运行。实际走势还需关注后续外围消息变化、装置变动以及实际需求情况。", "ctime": 1781524796, "time_str": "19:59:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260615/c677477349.shtml"}, {"id": "4530177", "title": "摩根大通：油价下跌或重启全球股市轮动行情", "content": "摩根大通资产管理欧洲、中东和非洲地区首席市场策略师凯伦·沃德表示，油价大幅下跌可能成为推动股市上涨的强劲动力，因为这将重新点燃此前因伊朗冲突爆发而突然中断的市场轮动行情。她表示，随着美伊协议逐步成形，未来几周油价可能跌至每桶70美元。潜在供应增长不仅来自伊朗。随着欧佩克内部凝聚力减弱，以及海湾国家可能希望趁当前价格水平加快储备变现，全球供应还可能进一步增加。这将为股票市场带来“巨大的顺风”，并可能促使各国央行降息。“去年我们看到的行业和地区轮动行情，在2月27日被中断了。认为市场已经忽视伊朗冲突的说法是错误的。事实上，市场叙事已经完全改变。现在这种影响正在消退，你开始重新看到资金轮动和市场广度扩张。”", "ctime": 1781524674, "time_str": "19:57:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260615/c677477325.shtml"}, {"id": "4530153", "title": "上海：着力稳市场、强保障、优服务，努力实现商品住房供需平衡、价格总体稳定", "content": "上海市委副书记、市长龚正今天（6月15日）主持召开市政府常务会议，要求按照市委部署，持续推动上海国际贸易中心提质升级；推进乡村全面振兴取得实质性新成效；高质量推进城市更新和住房发展；把“一江一河”沿岸地区打造成世界级滨水区。会议原则同意《上海市城市更新和住房发展“十五五”规划》并指出，要高质量开展城市更新行动，加快构建房地产发展新模式，着力建设创新、宜居、美丽、韧性、文明、智慧的现代化人民城市。要坚持规划引领，突出民生优先、提质增效、文脉传承，以城市更新塑造人民城市新空间。要坚持租购并举，以住房发展绘就宜居上海新画卷。着力稳市场、强保障、优服务，努力实现商品住房供需平衡、价格总体稳定，推动保障性租赁住房扩容提质，推动业委会应建尽建，破解小区物业服务难题。", "ctime": 1781524511, "time_str": "19:55:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260615/c677477220.shtml"}, {"id": "4530137", "title": "科兴制药：GB19注射液I期临床试验完成首例参与者入组", "content": "科兴制药公告，全资子公司深圳科兴药业自主研发的靶向BDCA2的创新药物“GB19注射液”I期临床研究近日成功完成首例参与者入组给药。GB19注射液通过与BDCA2特异性结合，可抑制pDC细胞产生I型干扰素，从而干预先天性免疫与适应性免疫间的异常活化环路。临床前研究显示其具有良好的体外活性、免疫原性，生物利用度高，对靶点抑制时间维持超90天，安全性优异。若研发成功，将为皮肤型红斑狼疮（CLE）、系统性红斑狼疮（SLE）等患者提供新的治疗选择。", "ctime": 1781524360, "time_str": "19:52:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260615/c677477162.shtml"}, {"id": "4530117", "title": "英伟达向美国证券交易委员会提交七批次票据发行申请", "content": "英伟达已向美国证券交易委员会提交一项七批次票据发行申请，发行规模尚未披露。", "ctime": 1781524047, "time_str": "19:47:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260615/c677477072.shtml"}, {"id": "4530113", "title": "李强主持国务院第二十次专题学习", "content": "6月15日，国务院以“强化主体功能区战略实施，促进区域协调发展”为主题，进行第二十次专题学习。国务院总理李强在主持学习时强调，要深入学习贯彻习近平总书记关于实施主体功能区战略的重要指示精神和党中央有关决策部署，立足各地资源禀赋和比较优势，统筹优化农业、生态、城镇等各类空间布局，进一步健全主体功能区制度，分区分类施策，促进形成主体功能明显、优势互补、高质量发展的国土空间开发保护新格局，为推动区域协调发展、优化重大生产力布局提供有力支撑。（新华社）", "ctime": 1781524023, "time_str": "19:47:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_ l": "https://news.10jqka.com.cn/20260615/c677476839.shtml"}, {"id": "4530077", "title": "国家防总提升防汛应急响应至三级，增派工作组前往广西一线协助指导", "content": "6月15日，国家防总办公室、应急管理部等多部门联合会商，研判近期降雨发展趋势，研究部署重点地区防汛工作。国家防总办公室主任、应急管理部副部长兼水利部副部长陈敏主持会商。会商指出，6月13日以来，广东、广西部分地区出现暴雨到大暴雨，局地降雨量达600毫米以上，预报17日前广东、广西、福建、云南等地部分地区仍有持续性强降雨，暴雨致灾风险高，需高度警惕持续降雨可能引发的山洪和地质灾害、中小河流洪水、城市内涝等风险。此外，东北、华北等地多雷阵雨。会商决定，将国家防总针对广东、广西的防汛四级应急响应提升至三级，维持针对福建、浙江、江西、湖南的防汛四级应急响应，前期派出的工作组继续在广东、福建开展工作，增派国家防办工作组赴广西一线协助指导防汛救灾工作。", "ctime": 1781523302, "time_str": "19:35:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260615/c677476795.shtml"}, {"id": "4530075", "title": "强化养老机构、景区民宿等风险排查 多部门联合会商研究部署防汛工作", "content": "6月15日，国家防总办公室、应急管理部继续组织自然资源部、住房城乡建设部、交通运输部、水利部、中国气象局等多部门联合会商，研判近期降雨发展趋势，研究部署重点地区防汛工作。会商指出，6月13日以来，广东、广西部分地区出现暴雨到大暴雨，局地降雨量达600毫米以上，预报17日前广东、广西、福建、云南等地部分地区仍有持续性强降雨，暴雨致灾风险高，需高度警惕持续降雨可能引发的山洪和地质灾害、中小河流洪水、城市内涝等风险。此外，东北、华北等地多雷阵雨。（央视新闻）", "ctime": 1781523285, "time_str": "19:34:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260615/c677476788.shtml"}, {"id": "4530063", "title": "纽约期银向上触及71美元/盎司，日内涨4.45%", "content": "纽约期银向上触及71美元/盎司，日内涨4.45%。", "ctime": 1781523109, "time_str": "19:31:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260615/c677476702.shtml"}, {"id": "4530061", "title": "中集集团：完成回购0.2634%公司股份", "content": "中集集团公告，2026年5月26日至2026年6月15日，通过集中竞价交易方式回购H股股份1420.43万股，占公司于H股回购一般性授权获通过之日的已发行的H股总股本（不包括H股库存股）的比例为0.4719%，占公司总股本的比例为0.2634%，已使用资金总额为港币1.27亿元（不含交易费用）。截至本公告日，公司H股回购方案（第一批）及H股回购方案（第二批）均已实施完成，通过集中竞价交易方式回购公司H股股份合计为7998.14万股。", "ctime": 1781523108, "time_str": "19:31:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260615/c677476701.shtml"}, {"id": "4530049", "title": "法国总统马克龙表示，海上联盟准备在数日内部署至霍尔 function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';

  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
