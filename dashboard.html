BC）采访时表示，将实施谨慎且具有针对性的半导体关税措施，把对美国半导体投资和关税挂钩。若在美国境内生产（半导体），将获关税豁免，否则就得为付出代价（关税）做好准备。（财联社）", "ctime": 1788415144, "time_str": "13:59:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260903/c679561972.shtml"}, {"id": "5098133", "title": "液冷服务器板块午后再度走高 集泰股份4连板", "content": "液冷服务器板块午后再度走高，飞龙股份盘中创新高，集泰股份4连板，金帝股份2连板，新朋股份、鸣志电器、华源控股、金富科技、宏盛股份涨停，同飞股份、鸿富瀚涨超10%，捷邦科技、荣亿精密、远东股份、奕东电子、爱克股份跟涨。", "ctime": 1788414725, "time_str": "13:52:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260903/c679561858.shtml"}, {"id": "5098121", "title": "中国—上海合作组织口岸经济合作中心在天津揭牌成立", "content": "9月3日，中国—上海合作组织口岸经济合作中心在天津揭牌成立，将推动上合组织国家口岸资源共享、优势互补、共同发展，助力高质量共建“一带一路”和京津冀高水平对外开放。 天津市副市长王秀峰表示，天津是中国与上合组织国家合作的重要前沿阵地，天津口岸是中国北方对外开放的门户。创设上合口岸经济合作中心，是天津发挥好通道型、平台型、海洋型、制度型、都市型开放新优势，推动上合组织国家间畅通物流通道、便利经贸合作的重要举措。 在天津国际贸易与航运服务中心揭牌成立的上合口岸经济合作中心，将在功能定位与核心任务上重点聚焦三大领域。 一是推动口岸通关模式创新升级，建设海关总署“智慧海关建设与合作示范点”，积极探索技术性贸易措施协调对接与标准互通，不断提升跨境通关智能化、便利化水平。 二是深化海事领域对外开放与便利化合作，创新开展离岸船舶登记特色业务，全面提升涉外海事政务服务质效，从严筑牢危险货物海上运输安全屏障，保障国际航运通道安全畅通。 三是推动港航产业要素集聚提质，提升滨海新区港航产业聚集区发展能级，推动港航基础设施建设、先进运营管理技术对外输出，持续织密对上合组织国家及共建“一带一路”国家口岸合作服务网络。 (新华社)", "ctime": 1788414479, "time_str": "13:47:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260903/c679561784.shtml"}, {"id": "5098071", "title": "上期所燃油主力合约大跌5%", "content": "上期所燃油主力合约大跌5%，报3770元/吨。", "ctime": 1788413833, "time_str": "13:37:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260903/c679561652.shtml"}, {"id": "5098043", "title": "上海集成电路设计产业园2.0正在建设，将助力浦东打造集成电路发展高地", "content": "记者从张江高科、芯谋研究联合主办的第十二届张江高科·芯谋研究集成电路产业领袖大会上获悉，位于张江的上海集成电路设计产业园，产业规模已从2018年建园初期的400亿元提升至去年底的1371亿元。目前，张江高科正全力推进上海集成电路设计产业园2.0建设，并建立“投招孵服研”一体化产业服务体系。“十五五”期间，浦东将聚焦“设计引领、全链布局”，打造集成电路发展“芯”高地。（上观新闻）", "ctime": 1788413573, "time_str": "13:32:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260903/c679561617.shtml"}, {"id": "5098017", "title": "工信部熊继军：将进一步规范动力电池行业竞争秩序，加强运行监测和产能动态预警", "content": "工业和信息化部副部长熊继军在今日举行的“2026世界动力电池大会”上表示，当前全球汽车产业变革仍在加速演进，我国的动力电池产业正处于提质增效、扩大优势的关键时期。下一步，工信部将会同有关部门开展多项工作，包括进一步规范竞争秩序，加强行业运行监测和产能动态预警，开展质量提升行动，加强产品一致性和质量性监管，守牢产品质量安全底线，扼住低价竞争、盲目扩张等行为，推动形成健康有序的市场环境。（财联社）", "ctime": 1788413489, "time_str": "13:31:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260903/c679561609.shtml"}, {"id": "5098007", "title": "维尔利在贵州成立煤层气开发公司", "content": "企查查APP显示，近日，贵州维尔利煤层气开发有限公司成立，法定代表人为陆建华，注册资本为2000万元，经营范围包含陆地石油和天然气开采；矿产资源勘查；燃气经营；发电业务、输电业务、供（配）电业务等。企查查股权穿透显示，该公司由维尔利间接全资持股。（人民财讯）", "ctime": 1788413454, "time_str": "13:30:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260903/c679561607.shtml"}, {"id": "5097993", "title": "平陆运河举行船舶通航全要素综合演练", "content": "记者从平陆运河集团了解到，9月3日，平陆运河举行船舶通航全要素综合演练，为即将正式通航作准备。本次演练集结14家单位、20余艘船舶，对船舶通航组织及各项运行保障工作开展实景模拟。本次演练采用全流程实景模拟、联动实操等方式进行，参演船舶涵盖5000吨级内河船、集装箱船、海船和客船等多种船型。演练水域覆盖六景港区河港码头、运河主航道、配套服务区、枢纽船闸、锚地至钦州港域全域通航线路，共设置三大场景、九大科目，覆盖船舶调度、航道航行、服务区保障、船舶过闸等关键环节。此次演练全面检验了智慧运河感知系统、江河海一体化调度平台运行状态，同时测试船舶全线通航操纵能力以及各环节协同联动水平。综合演练明天还将持续。（央视新闻）", "ctime": 1788413435, "time_str": "13:30:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260903/c679561605.shtml"}, {"id": "5097979", "title": "奇瑞控股董事长尹同跃：出海不是去“收割”而是去“深耕” 要成为当地经济的参与者、贡献者", "content": "9月3日，2026世界动力电池大会在四川宜宾举行，奇瑞控股集团董事长尹同跃表示，“融合共生”既要产业链上下同心，更要全球合作共赢，实现电驱万物，绝非主机厂、电池厂单打独斗能够完成。企业应该是社会责任的载体，是追求量价利均衡增长，找到各自的生存空间和价值曲线。今年中国汽车出口有望超1000万辆，其中新能源车会超过一半，出海不是去“收割”，而是要去“深耕”，应该学会与全球同行分享，帮助传统车企升级转型。在海外，奇瑞要成为当地经济的参与者、贡献者，要成为当地的企业公民，成为全球各地的企业公民。（人民财讯）", "ctime": 1788413297, ）抹去了1.8%的涨幅", "content": "韩国综合股价指数（KOSPI）抹去了1.8%的涨幅，三星和SK海力士股价逆转下跌。", "ctime": 1788412622, "time_str": "13:17:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260903/c679561403.shtml"}, {"id": "5097909", "title": "国家药监局批准芮特韦拜单抗注射液上市", "content": "近日，国家药品监督管理局通过优先审评审批程序批准珠海泰诺麦博制药股份有限公司申报的芮特韦拜单抗注射液（商品名：新多妥）上市，用于即将进入或出生在第一个呼吸道合胞病毒（RSV）流行季的新生儿和婴儿预防RSV所致的下呼吸道感染。该品种的上市为相关人群提供了新的选择。（人民财讯）", "ctime": 1788412552, "time_str": "13:15:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260903/c679561385.shtml"}, {"id": "5097901", "title": "国家药监局批准艾曲帕米鼻喷雾剂上市", "content": "近日，国家药品监督管理局批准Milestone Pharmaceuticals Inc.申报的1类创新药艾曲帕米鼻喷雾剂（商品名称：星必妥）上市，该药用于治疗成人阵发性室上性心动过速（PSVT）急性症状发作，转复为窦性心律。该药品上市为患者提供了新的治疗选择。（人民财讯）", "ctime": 1788412479, "time_str": "13:14:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260903/c679561352.shtml"}, {"id": "5097899", "title": "伯克希尔CEO与日本五大商社高层会谈，伊藤忠称欢迎增持", "content": "9月3日，据报道，伯克希尔哈撒韦CEO格雷格·阿贝尔在东京与公司持股的日本五大商社及东京海上控股高层相继会谈，就经营战略和合作等交换意见。阿贝尔表示，伯克希尔将长期持有日本商社股份，并考虑进一步增持。伊藤忠商事董事长冈藤正广表示，阿贝尔称伯克希尔仍在考虑增持商社股份，伊藤忠对此表示欢迎；双方还讨论了根据具体项目推进联合投资的可能性。（界面新闻）", "ctime": 1788412473, "time_str": "13:14:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260903/c679561351.shtml"}, {"id": "5097787", "title": "现货黄金站上4440美元/盎司", "content": "现货黄金站上4440美元/盎司，日内涨1.21%。", "ctime": 1788411666, "time_str": "13:01:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260903/c679561204.shtml"}, {"id": "5097785", "title": "美司法部施压各州扩大上报非法移民信息", "content": "美国司法部2日公布一份法律意见，要求接受两项联邦福利项目资金的各州扩大上报非法移民信息给国土安全部，否则可能面临资金削减等严重后果。据路透社报道，这一做法意在施压各州配合联邦政府移民执法行动。此前，只有负责运营相关福利项目的州政府机构有上报义务。按司法部最新解释，机动车管理部门、州立大学等其他掌握相关人员信息的州政府机构也将被纳入上报范围。目前，至少19个州和华盛顿特区允许没有合法居留身份的移民申领驾照，不少州立大学也招收这类学生。（新华社）", "ctime": 1788411664, "time_str": "13:01:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260903/c679561203.shtml"}, {"id": "5097759", "title": "2026世界动力电池大会在四川宜宾开幕", "content": "9月3日，2026世界动力电池大会在四川宜宾开幕。本届大会以“电驱万物 融合共生”为主题，会期两天。除开幕式外，大会设置1场全体大会、8场专题会议和多项活动，内容涵盖政策、固态电池、供应链、应用、储能、回收利用等动力电池全产业链核心领域。同期举办的2026动力电池应用生态展览会将持续至9月6日，展会面积超过5万平方米，设置“十五五”产业发展规划、动力电池和材料产业链、低空经济、新能源汽车、回收利用及装备智造等八大展区，共有205家企业参展，集中展示动力电池、储能和新能源汽车等领域前沿科技和创新产品。（央视新闻）", "ctime": 1788411502, "time_str": "12:58:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260903/c679561197.shtml"}, {"id": "5097737", "title": "COMEX白银期货涨超2%", "content": "COMEX白银期货涨超2%，现报66.77美元/盎司。", "ctime": 1788410789, "time_str": "12:46:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260903/c679561141.shtml"}, {"id": "5097705", "title": "新疆沙雅县4.0级地震震中位于沙漠无人区 暂无人员伤亡", "content": "据中国地震台网正式测定，9月3日10时45分在新疆阿克苏地区沙雅县发生4.0级地震，震源深度25公里，震中位于北纬40.02度，东经83.68度。记者从新疆消防救援总队了解到，距离震中最近的乡镇为沙雅县盖孜库木乡，距离约120公里，距离沙雅县约150公里，震中位于塔里木盆地沙漠无人区，沙雅县无震感。经与辖区速报员、当地公安、应急等部门核实，目前无人员伤亡或房屋倒塌，未接到相关警情。阿克苏消防救援支队沙雅县大队2支地震救援先遣队4车20人已赶赴震中，库车市、新和县、拜城县4支地震救援先遣队8车40人已在营区集结，做好救援准备。（央视新闻）", "ctime": 1788410268, "time_str": "12:37:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260903/c679561063.shtml"}, {"id": "5097601", "title": "凌激副部长兼国际贸易谈判副代表与欧委会贸易和经济安全总司雷东内副总司长开展经贸磋商", "content": "8月31日—9月2日，商务部副部长兼国际贸易谈判副代表凌激带领中方团队，与欧委会贸易和经济安全总司副总司长雷东内带领的欧方团队在京开展了经贸磋商，为中欧贸易投资磋商机制第二次会议作准备。(商务部)", "ctime": 1788408536, "time_str": "12:08:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260903/c679560736.shtml"}, {"id": "5097599", "title": "9月3日午间公告一览：和黄医药与葛兰素史克达成KRAS-EGFR许可协议", "content": "和黄医药公告，公司与葛兰素史克就KRAS-EGFR抗体偶联癌症药物达成许可协议。", "ctime": 1788408488, "time_str": "12:08:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260903/c679560662.shtml"}, {"id": "5097569", "title": "港股午评：恒生指数涨0.02%，恒生科技指数跌0.56%", "content": "港股午间收盘，恒生指数涨0.02%，恒生科技指数跌0.56%。恒指港股通ETF银华（159318）涨0.31%，港股通科技ETF鹏华（159751）涨0.46%。板块方面，电脑与电子产品零售、休闲设施板块涨幅靠前；广播、服装零售板块跌幅靠前。个股方面，曦智科技-P涨13.81%，亮晴控股涨12.49%，群核科技涨11.9%，卓越睿新涨8.97%，潼关黄金涨8.74%；瀚天天成跌10.08%，梅卡曼德机器人跌8.96%，德适-B跌8.01%，智云科技建设跌5.79%，琻捷电子科技跌5.73%。", "ctime": 1788408113, "time_str": "12:01:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260903/c679560600.shtml"}, {"id": "5097547", "title": "斯坦福《2026人工智能指数报告》：AI竞争从模型比拼转向全体系博弈", "content": "斯坦福大学以人为本人工智能研究院（HAI）《2026年人工智能指数报告》官方中文版今日正式发布。报告指出，人工智能已脱离单纯的模型能力竞赛，正在向基础设施、组织流程与制度层面的系统性变革深化。当前，全世界领先模型在软件工程基准SWE-bench上表现已接近人类100%水平；智能体在真实计算机环境的任务成功率从12%跃升至66%，AI正从“生成信息”向“执行任务”演进。中美顶尖模型差距收窄至2.7%，双方头部模型已多次互换领先位置。另外，物理基础设施成AI发展核心约束。全球AI数据中心电力容量已达29.6吉瓦，芯片、能源、水资源正成为AI发展的关键战略瓶颈。（科创板日报）", "ctime": 1788407955, "time_str": "11:59:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260903/c679560408.shtml"}, {"id": "5097543", "title": "湖南征集“六张网”建设应用场景", "content": "9月2日，湖南省发展改革委发布通知，公开征集“六张网”领域应用场景，系统挖掘一批场景协同案例，储备一批示范性、引领性场景项目。征集主要方向覆盖“六张网”。水网方面，重点征集“一江一湖四水”流域智能防洪、水网智能调度等场景。新型电网方面，聚焦构网型技术、电网防灾抗灾、“电网+人工智能”等场景。算力网方面，征集智算中心、算力普惠应用等场景。新一代通信网方面，征集5G-A/万兆光网行业应用、低空经济通信保障等应用场景。城市地下管网方面，征集地下管网智能监测、城市生命线风险预警及应急调度等场景。物流网方面，聚焦数智物流云平台、多式联运智能调度等应用场景。在单网建设的基础上，此次征集尤其注重“多网融合”，鼓励跨领域协同，推动一张网的算力优化另一张网的调度，一张网的感知赋能另一张网的运行。涉及两张网及以上相互赋能、深度协同的场景可重点申报。征集内容包括场景机会清单、场景能力清单、场景建设项目。（湖南日报）", "ctime": 1788407652, "time_str": "11:54:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260903/c679560349.shtml"}, {"id": "5097533", "title": "长盈精密具身智能零部件（西南）制造基地在宜宾投运", "content": "9月2日，长盈精密具身智能零部件（西南）制造基地在宜宾正式投入运营。据介绍，此次投运的西南基地具备从模具开发到核心零部件量产的全链条制造能力。产品涵盖灵巧手结构件、关节模组结构件、精密传动件、躯干及肢体结构件等人形机器人核心精密零部件。（宜宾发布）", "ctime": 1788407356, "time_str": "11:49:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260903/c679560298.shtml"}, {"id": "5097531", "title": "南向资金净买入超40亿港元", "content": "据同花顺iFinD数据，截至目前，南向资金净买入超40亿港元，其中港股通（沪）买入超9.26亿港元，港股通（深）买入超30.91亿港元。", "ctime": 1788407148, "time_str": "11:45:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260903/c679560260.shtml"}, {"id": "5097529", "title": "上海浦东：积极创建国家数字贸易示范区", "content": "上海市浦东新区副区长徐欣在9月3日举行的上海市政府新闻发布会上表示，加快服务贸易扩大开放，积极创建国家数字贸易示范区。深化服务业扩大开放综合试点，推进金融、医疗健康、文化教育、专业服务等重点领域扩大开放。（人民财讯）", "ctime": 1788407074, "time_str": "11:44:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260903/c679560245.shtml"}, {"id": "5097527", "title": "Meta调整AI绩效考核标准 取消Token使用量指标", "content": "据The Information，Meta公司高管Maher Saba和Santosh Janardhan周二发布了一份内部备忘录，其中更新了公司对工程师的期望，并明确表示“不会使用AI采用率仪表盘或Token使用量来评估员工影响力”。备忘录指出，目前93%的代码修改都由人工智能代理辅助完成，但同时补充说，采用人工智能“本身并不是最终目标”。（财联社）", "ctime": 1788406893, "time_str": "11:41:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260903/c679560191.shtml"}, {"id": "5097525", "title": "人民银行上海总部：加紧推进跨境再保险分入业务收入境外投资便利化试点工作", "content": "中国人民银行上海总部副主任苏赟在9月3日举行的上海市政府新闻发布会上表示，跨境再保险分入业务收入境外投资便利化试点工作也在加紧推进当中。（人民财讯）", "ctime": 1788406694, "time_str": "11:38:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260903/c679560104.shtml"}, {"id": "5097521", "title": "上海：“十五五”时期将推动增值电信、生物技术、独资医院等开放项目落地", "content": "上海市商务委副主任周岚在9月3日举行的上海市政府新闻发布会上表示，“十五五”时期，将深入实施国家服务业扩大开放综合试点，推动增值电信、生物技术、独资医院等开放项目落地。落实新版鼓励外商投资产业目录，发挥标志性外资项目示范效应，引导外资更多投向先进制造、现代服务、高新技术等领域，支持参与产业链上下游配套协作，让外资企业投资空间“更广”。（人民财讯）", "ctime": 1788406684, "time_str": "11:38:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260903/c679560101.shtml"}, {"id": "5097519", "title": "中东战火叠加强厄尔尼诺 巴拿马运河再次面临通行之困", "content": "受中东局势持续升级与强厄尔尼诺现象叠加影响，巴拿马运河正面临新一轮“过境危机”。由于霍尔木兹海峡遭封锁，从美国墨西哥湾至亚洲市场的能源运输需求急剧攀升，巴拿马运河单次通行配额拍卖价日前已飙升至创纪录的530万美元。然而，运河流域每2至7年便遭遇一次与厄尔尼诺相关的干旱，这迫使巴拿马政府自9月起连续下调日均通航艘次及船舶吃水线。面对短期内难以突破的通行能力上限，巴拿马政府已启动因迪奥河水库等中长期应急项目，力图在治本层面寻求突破。（央视新闻）", "ctime": 1788406670, "time_str": "11:37:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260903/c679560098.shtml"}, {"id": "5097515", "title": "微信回应“何时推出单删提示”", "content": "9月3日，“微信 单删提示”登上热搜引发热议。腾讯客服回应称，关于通讯录好友数量满的情况，当您继续添加好友时，系统会弹窗提醒并展示部分通讯录好友信息，帮助您判断是否需要删除某些联系人。“但需要注意的是，微信目前暂不支持批量查看已被对方删除的联系人信息，您只能根据弹窗中的列表手动选择删除。”那么，微信何时能推出可以查看单删的功能？腾讯客服回应称，目前微信暂未推出相关功能。“系统在检测到通讯录好友数量上限时会展示部分联系人供您参考删除，我们会将您的需求反馈给产品团队。”（中新经纬）", "ctime": 1788406589, "time_str": "11:36:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260903/c679560039.shtml"}, {"id": "5097509", "title": "奥迪创新技术中心于上海正式成立", "content": "记者获悉，奥迪创新技术中心（AUDI Innovation & Technology Center, AITC）今日于上海正式成立。作为奥迪股份公司与上汽集团共同组建的新合资公司，AITC是专为AUDI品牌打造、具备整车开发与端到端能力的研发实体。奥迪与上汽将基于专为未来智能网联汽车打造的专属架构——奥迪ADP 2.0智能数字平台（Advanced Digitized Platform），联合开发四款全新AUDI车型，首款车型计划于2028年问世。（财联社）", "ctime": 1788406527, "time_str": "11:35:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260903/c679560006.shtml"}, {"id": "5097495", "title": "现货黄金日内涨幅达1%，报4431.7美元/盎司", "content": "现货黄金日内涨幅达1%，报4431.7美元/盎司。", "ctime": 1788406487, "time_str": "11:34:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260903/c679559993.shtml"}, {"id": "5097487", "title": "京九铁路累计发送货物10.53亿吨", "content": "记者从国铁集团了解到，京九铁路自开通运营以来，区域路网布局持续完善，货运技术装备不断升级，已累计发送货物10.53亿吨。京九铁路北起北京西站，经京、冀、鲁、豫、皖、鄂、赣、粤八省市，到达深圳站，通过广九线连通香港，沿途穿越大别山、井冈山和赣南等革命老区。沿线各地依托这条钢铁大通道、不断创新物流服务。今年，江西首列跨境电商中欧班列从赣州国际陆港直达俄罗斯，越来越多“江西制造”正沿京九大通道走向全球。（央视新闻）", "ctime": 1788406365, "time_str": "11:32:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260903/c679559933.shtml"}, {"id": "5097485", "title": "A股午评：上证指数缩量震荡涨0.43% 培育钻石板块涨幅居前", "content": "截至午盘，上证指数涨0.43%，深证成指涨0.39%，创业板指涨0.43%，北证50跌1.13%。三市成交额11136亿元，较上日缩量1168亿元。全市场超3100家个股下跌。\n板块题材上，培育钻石、保险、港口航运板块涨幅居前；粮食概念、乳业板块跌幅居前。\n盘面上，培育钻石板块表现强势，黄河旋风、恒盛能源涨停，惠丰钻石涨超10%，四方达、力量钻石、沃尔德、夜光明、国机精工跟涨。保险板块震荡走高，中国太保涨超4%，中国人寿、新华保险、中国平安、中国人保跟涨。港口航运板块震荡拉升，海通发展盘中创新高，凤凰航运、中远海能涨停，国航远洋涨超10%，招商轮船、招商南油、中远海特、锦江航运、南京港跟涨。粮食概念再度下挫，天禾股份、新赛股份触及跌停，万向德农、敦煌种业、秋乐种业、京粮控股、康农种业跟跌。乳业板块今日调整，一鸣食品触及跌停，天山生物、骑士乳业、金健米业、皇氏集团、西部牧业跟跌。", "ctime": 1788406346, "time_str": "11:32:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260903/c679559926.shtml"}, {"id": "5097483", "title": "ETF两市成交额报2799.94亿元，较昨日此时缩量502.95亿元", "content": "截至目前，ETF两市成交额报2799.94亿元，较昨日此时缩量502.95亿元，分类型来看，股票型ETF成交额644.35亿元，债券型ETF成交额1687.3亿元，货币型ETF成交额79.26亿元，商品型ETF成交额63.84亿元，QDII型ETF成交额325.2亿元。", "ctime": 1788406329, "time_str": "11:32:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260903/c679559915.shtml"}, {"id": "5097475", "title": "ETF午评：巴西ETF领涨4.23%，粮食ETF领跌6.84%", "content": "ETF午间收盘涨跌不一，巴西ETF（520870）领涨4.23%，巴西ETF（159100）涨4.22%，地产ETF（159707）涨2.97%，粮食ETF（159060）领跌6.84%，农牧渔ETF（159275）跌1.69%，养殖ETF（159867）跌1.43%。   const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
