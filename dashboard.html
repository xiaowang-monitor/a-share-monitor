}
.card:hover { background: var(--bg-card-hover); border-color: #334155; }
.badge {

.badge-s { background: rgba(239,68,68,0.2); color: #ef4444; }

.badge-c { background: rgba(100,116,139,0.2); color: #94a3b8; }
.score-bar {
  height: 6px; border-radius: 3px; background: #1e293b; overflow: hidden;
}
.score-bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s; }
.up { color: var(--red); }
.down { color: var(--green); }
.pulse { animation: pulse 2s infinite; }
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}
.glow { box-shadow: 0 0 20px rgba(59,130,246,0.15); }
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg-primary); }

</style>

额14649亿元，北证50成交额156亿元。", "ctime": 1777013802, "time_str": "14:56:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260424/c676253440.shtml"}, {"id": "4273869", "title": "乌称敖德萨市遭袭 已致多人死伤", "content": "当地时间24日，乌克兰国家紧急服务局报告称，当天凌晨，俄罗斯方面对敖德萨州首府敖德萨市发动袭击，已造成2人死亡，14人受伤。俄方对此暂无回应。（央视新闻）", "ctime": 1777013658, "time_str": "14:54:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260424/c676253410.shtml"}, {"id": "4273867", "title": "泰国对原产于中国的橡胶手套启动反倾销调查", "content": "2026年4月21日，泰国商业部外贸厅发布公告称，应泰国国内企业提交的申请，对原产于中国的橡胶手套（泰语：                                              ，参考英语：Rubber Gloves made from natural rubber or synthetic rubber)启动反倾销调查。涉案产品由天然橡胶或合成橡胶制成，涉及泰国海关编码4015.12.10、4015.12.90、4015.19.10和4015.19.90项下的产品。利益相关方应于公告发布之日起30日内以书面形式提交案件评述意见及证据材料。（中国贸易救济信息网）", "ctime": 1777013631, "time_str": "14:53:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260424/c676253399.shtml"}, {"id": "4273863", "title": "现货白银失守74美元/盎司", "content": "现货白银失守74美元/盎司，日内跌1.9%。", "ctime": 1777013492, "time_str": "14:51:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260424/c676253366.shtml"}, {"id": "4273859", "title": "普京称北极航道重要性愈发凸显", "content": "俄罗斯总统普京4月23日通过视频连线方式与政府成员召开会议，讨论北极地区发展问题。普京指出，当前受诸多冲突影响，包括中东地区在内，全球运输链受到干扰，北极航道正变得越来越重要，地缘政治竞争和围绕北极地区的争夺也正在加剧。普京表示，俄罗斯愿与所有感兴趣的国家在北极地区开展合作，但同时也将捍卫自身在该地区的国家利益。(CCTV国际时讯)", "ctime": 1777013467, "time_str": "14:51:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260424/c676253355.shtml"}, {"id": "4273853", "title": "中国信通院泰尔实验室：启动“800V HVDC算电协同验证平台”建设", "content": "中国信息通信研究院泰尔终端实验室今日官微消息，为响应国家“双碳”战略与算力基础设施高质量发展需求，破解AI智算中心高能耗、低效率的产业痛点，泰尔终端实验室正式启动 “800V HVDC算电协同验证平台”建设，并面向全行业公开征集参与企业，携手开展关键技术攻关、产品验证与标准共建。此次启动的验证平台将聚焦三大核心目标：开展800V HVDC供电系统等核心技术与产品的兼容性、可靠性、能效比验证；研究算力负载与电力供给的实时协同调度机制；共同制定800V HVDC算电协同相关技术标准与测试规范。此次800V HVDC算电协同验证平台的启动，是泰尔终端实验室继UFCS标准后，在绿色能源与数字基础设施融合领域的又一重要布局。（人民财讯）", "ctime": 1777013377, "time_str": "14:49:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260424/c676253336.shtml"}, {"id": "4273845", "title": "中指研究院：物业服务行业市场规模稳步增长", "content": "4月24日，中指研究院发布的《2026中国物业服务百强企业研究报告》显示，物业服务行业的市场规模持续稳步增长。截至2025年末，全国物业服务行业管理面积达327.36亿平方米，预计到2030年将达到近400亿平方米。2025年，全国物业服务企业总营业收入约1.83万亿元，同比增长4.06%。从增量维度审视，2025年，全国“好房子”建设持续推进，我国新建商品房销售面积为8.81亿平方米，这一销售规模将逐步转化为行业的新增管理面积。从存量市场看，城市更新战略的深入推进正加速释放物业管理行业的新动能。（中指研究院）", "ctime": 1777013303, "time_str": "14:48:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260424/c676253320.shtml"}, {"id": "4273811", "title": "深蓝汽车邓承浩：今年国内车市可能会出现微量下降", "content": "4月24日，2026北京国际汽车展览会上，深蓝汽车董事长邓承浩表示，今年全年目标销售48万辆，其中国内目标34万辆，海外目标14万辆。海外增幅较去年明显提升。邓承浩同时预判，今年国内的车市不太可能会增长，可能会出现微量下降。深蓝要接受这个现实，也要做好服务的同时，在全球化方面寻找更多的机会。（第一财经）", "ctime": 1777012829, "time_str": "14:40:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260424/c676253149.shtml"}, {"id": "4273801", "title": "俄联邦安全局挫败一起恐怖袭击图谋", "content": "当地时间4月24日，俄罗斯联邦安全局通报称，该部门于本月18日挫败了一起针对俄联邦通讯监督局高层的恐怖袭击图谋。俄联邦安全局称，参与策划此次犯罪的共有7人，均由乌克兰情报部门通过网络招募。该团伙头目是一名2004年出生的莫斯科居民。在抓捕过程中此人进行了武装抵抗，已被执法人员击毙。俄联邦安全局表示，在搜查过程中，执法人员从恐怖分子处缴获了重达1公斤的自制爆炸装置、一枚F-1手榴弹以及手枪、对讲机、乌克兰准军事组织的标志物等。目前，相关部门已提起刑事诉讼。乌克兰方面对此暂无回应。(央视新闻)", "ctime": 1777012748, "time_str": "14:39:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260424/c676253109.shtml"}, {"id": "4273795", "title": "华能国际等成立新公司 含站用加氢及储氢业务", "content": "企查查APP显示，近日，华能登峰工投（宁都）新能源有限责任公司成立，经营范围包含：充电桩销售，电动汽车充电基 机接口等领域 我国布局建设82家国家级知识产权保护中心", "content": "面对人工智能、集成电路、生物医药等战略性新兴产业和未来产业的蓬勃发展，国家知识产权局正在持续健全高效的知识产权综合管理体制，不断提升管理效能，切实加强新兴领域知识产权保护。新修改的《专利审查指南》设立专门章节规范人工智能、大数据相关审查标准，特别强调要加强人工智能伦理审查，明确人工智能相关数据采集、规则设置等要求，引导人工智能发展“智能向善”。《集成电路布图设计保护条例》修改正在积极推进，对促进我国大规模集成电路发展，助力关键核心技术突破将发挥重要作用。另外，进一步优化专利审查政策，通过业务指导与培训增强新兴技术领域审查能力，提供优先审查、快速审查等多种审查渠道，动态更新商品、服务项目，累计公开的涉及大数据、人工智能等新产业新业态的商品、服务项目共890项，解决新兴领域商标注册无对应项目、保护边界不清晰等现实问题。在全国布局建设82家国家级知识产权保护中心，覆盖人工智能、集成电路、量子技术、脑机接口等前沿方向和重点领域，有效满足创新主体“快保护”需求。优化海外知识产权纠纷应对指导体系，累计布局建设海外纠纷应对指导工作平台116家，强化预警监测和风险排查，帮助新兴领域企业稳住海外市场、守好海外权益。国家知识产权局2025年组织认定的首批产业知识产权运营中心中，有48家涉及集成电路、生物医药、航空航天、6G等新兴支柱产业和未来产业，占比超过70%。（央视新闻）", "ctime": 1777010701, "time_str": "14:05:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260424/c676252309.shtml"}, {"id": "4273621", "title": "伊朗最高领袖顾问：伊朗的团结是特朗普的“噩梦”", "content": "当地时间24日，伊朗最高领袖顾问穆赫贝尔在社交媒体上说，伊朗官员团结一致，伊朗人民充满自豪和爱国情怀，伊朗武装部队的战士为国捐躯，这是“失败者的噩梦”。穆赫贝尔写道：“面对9000万伊朗革命者，特朗普别无选择，只能煽动分裂。”美国总统特朗普23日早些时候在社交媒体发文，称伊朗“强硬派”同“温和派”正在“内斗”。（央视新闻）", "ctime": 1777010638, "time_str": "14:03:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260424/c676252302.shtml"}, {"id": "4273605", "title": "日经225指数涨幅扩大至1%", "content": "日经225指数涨幅扩大至1%，现报59720.6点。", "ctime": 1777010501, "time_str": "14:01:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260424/c676252244.shtml"}, {"id": "4273559", "title": "DeepSeek V4正式发布，昇腾超节点系列产品全面支持", "content": "2026年4月24日，DeepSeekV4-Pro和DeepSeekV4-Flash正式发布并开源，模型上下文处理长度由原有的128K显著扩展至1M，实现近10倍的容量提升，首次增加了KVCache滑窗和压缩算法，大幅减少Attention计算和访存开销，并通过模型架构创新更好地支持了Agent和Coding场景。昇腾一直同步支持DeepSeek系列模型，本次通过双方芯模技术紧密协同，实现昇腾超节点全系列产品支持DeepSeekV4系列模型。昇腾950通过融合kernel和多流并行技术降低Attention计算和访存开销，大幅提升推理性能，结合多种量化算法，实现了高吞吐、低时延的DeepSeekV4模型推理部署。昇腾A3超节点系列产品也全面适配，同时为便于用户快速微调，提供了基于昇腾A3超节点的训练参考实现。（华为中国）", "ctime": 17   if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
