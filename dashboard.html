6891.shtml"}, {"id": "5267637", "title": "以色列称在空袭行动中打死一名哈马斯指挥官", "content": "当地时间29日，以色列总理内塔尼亚胡与国防部长卡茨发表联合声明称，以军在28日夜间至29日凌晨期间的一次空袭行动中，“定点清除”了巴勒斯坦伊斯兰抵抗运动（哈马斯）加沙北部旅指挥官伊兹·丁·比克。声明指控其策划针对以色列安全部队的袭击，并负责招募新的武装人员。哈马斯方面对此暂无回应。（央视新闻）", "ctime": 1790662576, "time_str": "14:16:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260929/c680356870.shtml"}, {"id": "5267609", "title": "特朗普证实美伊举行间接谈判 称已与伊“交换信息”", "content": "美国总统特朗普28日在白宫对媒体说，美国和伊朗的谈判代表已通过调解方交换了信息。被问及美伊谈判进展时，特朗普没有透露谈判具体细节，只是称“我们会赢”，“事态很快就会有分晓”。(新华社)", "ctime": 1790662503, "time_str": "14:15:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260929/c680356827.shtml"}, {"id": "5267593", "title": "现货白银站上61美元/盎司", "content": "现货白银站上61美元/盎司，日内涨0.63%。", "ctime": 1790662471, "time_str": "14:14:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260929/c680356825.shtml"}, {"id": "5267545", "title": "中钢协：8月我国出口钢材1015.5万吨，环比增长0.3%，同比增长6.8%", "content": "中钢协数据显示，2026年8月，我国出口钢材1015.5万吨，环比增长0.3%，同比增长6.8%；出口均价722.2美元/吨，环比上涨0.9%，同比上涨3.5%。1-8月，我国累计出口钢材7514.9万吨，同比下降3.0%；出口均价705.9美元/吨，同比上涨1.0%。8月，我国进口钢材43.4万吨，环比下降2.5%，同比下降13.1%；进口均价2002.8美元/吨，环比上涨2.6%，同比上涨21.2%。1-8月，我国累计进口钢材357.4万吨，同比下降10.5%；进口均价1841.1美元/吨，同比上涨7.5%。", "ctime": 1790662290, "time_str": "14:11:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260929/c680356764.shtml"}, {"id": "5267535", "title": "贵金属板块冲高", "content": "贵金属板块冲高，中金黄金、湖南白银、湖南黄金涨幅居前。", "ctime": 1790662269, "time_str": "14:11:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260929/c680356750.shtml"}, {"id": "5267369", "title": "机构：上修2027年HBM价格展望，预估ASP年增达121%", "content": "根据TrendForce集邦咨询最新研究显示，AI服务器需求持续扩张，HBM与Conventional DRAM仍竞逐有限的先进制程及晶圆产能，加上新一代产品的良率与产出提升仍需时间，预估2027年存储器供应将持续吃紧。在整体存储器价格维持上行趋势的情况下，供应商对2027年HBM涨价态度亦更为明确，为反映整体供应持续紧张，以及高价HBM4占比提升、HBM4e于2027年下半年逐步放量所带来的影响，TrendForce集邦咨询上修明年HBM价格展望，预估Blended ASP年增幅度将达121%。", "ctime": 1790661841, "time_str": "14:04:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260929/c680356580.shtml"}, {"id": "5267171", "title": "截至2026年6月，我国智能算力规模达2185EFLOPS，同比增长177%", "content": "据央视新闻，《生成式人工智能应用发展报告（2026）》发布，《报告》显示，截至2026年6月，我国智能算力规模达2185EFLOPS（百亿亿次浮点运算/秒），同比增长177%；首个全国产10万卡人工智能超集群正式投用，在芯片、计算、存储、网络、散热等核心软硬件均采用国产自主可控技术，实现了从底层硬件到上层服务的全栈国产化，标志着我国算力基础设施建设迈入十万卡级部署新阶段。", "ctime": 1790661667, "time_str": "14:01:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260929/c680356492.shtml"}, {"id": "5267097", "title": "我国生成式人工智能用户规模突破7亿人", "content": "9月29日，中国互联网络信息中心政策与国际合作所在“2026（第七届）中国互联网基础资源大会”上发布《生成式人工智能应用发展报告（2026）》，通过最新调查数据，对生成式人工智能的用户使用情况、产业应用情况、政策制定情况进行研究分析。《报告》显示，截至2026年上半年，我国生成式人工智能用户规模突破7亿人，普及率超50.0%。(央视新闻)", "ctime": 1790661559, "time_str": "13:59:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260929/c680356458.shtml"}, {"id": "5267093", "title": "中国贸促会：2026年APEC工商领导人峰会筹备工作进展顺利", "content": "中国贸促会于9月29日上午组织召开9月例行新闻发布会。会上，中国贸促会新闻发言人王文帅介绍了APEC工商领导人峰会的筹办情况。王文帅称，本届工商峰会受到各方广泛关注，中外企业报名踊跃，特别是外方企业参会热情持续攀升。其中，美国企业报名尤为积极，是目前报名企业数量最多的经济体。亚马逊、沃尔玛、苹果、谷歌、埃克森美孚、微软等众多美国世界500强及知名企业均已提交参会申请，涵盖半导体、人工智能、生物制药、能源、金融、交通物流、化工、航空航天、制造、消费零售等多个产业领域，汇聚全球科技巨头、实体产业龙头及头部金融与专业服务机构，充分体现了美国工商界对参与亚太工商合作的高度重视，也反映了当前中美产业链供应链紧密的合作关系。(中国新闻网)", "ctime": 1790661535, "time_str": "13:58:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260929/c680356445.shtml"}, {"id": "5267087", "title": "10月1日起，经港珠澳大桥供港鲜活食品延长至24小时通关", "content": "拱北海关今日对外发布消息，自2026年10月1日起，经港珠澳大桥供港鲜活食品通关时间将由16小时延长至全天24小时，意味着经大桥供港鲜活食品可实现“随采、随装、随发”，不断充实香港“菜篮子”。据海关统计，自2023年7月1日大桥口岸开放全品类内地鲜活食品供港以来，截至2026年8月31日，经大桥口岸供港鲜活食品32万吨，货值114.5亿元。", "ctime": 1790661456, "time_str": "13:57:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260929/c680356413.shtml"}, {"id": "5267061", "title": "减速器板块短线拉升，巨轮智能一度涨超9%", "content": "减速器板块短线拉升，巨轮智能一度涨超9%，襄阳轴承此前封板，中马传动、奕帆传动、山子高科跟涨。", "ctime": 1790661144, "time_str": "13:52:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260929/c680356283.shtml"}, {"id": "5267023", "title": "澳大利亚联储主席：中东冲突构成重大冲击，令所有人实际收入受损", "content": "澳大利亚联储主席布洛克表示，中东冲突构成重大冲击，令所有人实际收入受损。战争持续越久，企业就越有可能将上涨的成本转嫁给消费者。", "ctime": 1790660818, "time_str": "13:46:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260929/c680356096.shtml"}, {"id": "5267017", "title": "东京连续34天降雨创纪录", "content": "日本东京29日继续降雨。据日本气象厅统计，东京都中心地区已连续降雨34天，创下该地区自1886年有记录以来的最长连续降雨纪录。", "ctime": 1790660764, "time_str": "13:46:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260929/c680356083.shtml"}, {"id": "5267013", "title": "豆包将推个人助理产品：4月已内测，新产品将由Spell项目与豆包对话团队共同负责", "content": "知情人士透露，从今年4月起，字节跳动豆包内部已经开始内测个人助理方向的探索产品。据了解，该探索项目当时代号为“Spell”，主要由豆包手机助手团队主导，但由于豆包手机发布等原因，一直未正式对外。最近，Muse、Instinct 等个人助理类产品在海外获得关注与大量下载后，豆包也在加速personal agent能力的对外发布，计划将此前的Spell项目与豆包产品更深度结合。新产品将由Spell项目与豆包对话团队共同负责，预期较快会对外推出。Spell以及新的豆包助理产品，可视为豆包将手机端积累的personal agent能力向独立应用形态的延伸。（蓝鲸新闻）", "ctime": 1790660742, "time_str": "13:45:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260929/c680356081.shtml"}, {"id": "5266943", "title": "恒生科技指数跌1.81%，现报4217.81点，创年内新低", "content": "恒生科技指数跌1.81%，现报4217.81 const SECTORS  = [{"name": "金融", "hit_count": 61, "etfs": []}, {"name": "人工智能", "hit_count": 44, "etfs": []}, {"name": "半导体", "hit_count": 26, "etfs": []}, {"name": "数据要素", "hit_count": 25, "etfs": []}, {"name": "消费", "hit_count": 25, "etfs": []}, {"name": "新能源", "hit_count": 13, "etfs": []}, {"name": "地产", "hit_count": 12, "etfs": []}, {"name": "机器人", "hit_count": 8, "etfs": []}];

// 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

  const container = document.getElementById('news-feed');

    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';

  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}
