 "ctime": 1786939278, "time_str": "12:01:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260817/c679005278.shtml"}, {"id": "4966623", "title": "“三北”工程攻坚战年均完成建设任务8000万亩以上", "content": "记者从国家林草局了解到，“三北”工程攻坚战启动三年来，年均完成建设任务8000万亩以上。“三北”工程攻坚战启动以来，国家林草局会同各地各部门，坚持系统观念、科学施治，累计安排中央投资889亿元，实施重点项目544个，年均完成建设任务8000万亩以上，成为工程建设史上推进力度最大、建设成效最好的时期。（央视新闻）", "ctime": 1786939158, "time_str": "11:59:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260817/c679005253.shtml"}, {"id": "4966619", "title": "钉钉全球商业总裁杨猛将离任，下一站蚂蚁集团", "content": "在阿里加速AI商业化的背景下，集团对企业服务业务的收入增长和商业转化提出了更高预期。钉钉新管理层完成组织调整不到两个月，负责商业化多年的核心高管杨猛即将离任。记者从接近钉钉的知情人士处获悉，钉钉全球商业总裁、客户发展部负责人杨猛已完成离职相关内部流程，计划加入蚂蚁集团。阿里钉钉悟空副总裁任卿（花名“易统”）将接手杨猛负责的商业化工作。（21世纪经济报道）", "ctime": 1786938913, "time_str": "11:55:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260817/c679005216.shtml"}, {"id": "4966617", "title": "神州半导体落子光谷 开展半导体射频电源、匹配器等产品研发", "content": "近日，神州半导体科技股份有限公司（简称“神州半导体”）落户光谷存算双创园，建设华中总部及研发中心，开展半导体射频电源、匹配器等产品研发。目前，神州半导体正在光谷注册全资子公司，项目预计明年一季度正式投入运营。(人民财讯)", "ctime": 1786938884, "time_str": "11:54:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260817/c679005211.shtml"}, {"id": "4966607", "title": "水利部：全国45条河流仍维持超警", "content": "今天上午，水利部举行会商，分析研判全国的防汛形势。截至今天9时，黑龙江、内蒙古、河南、浙江等地45条河流仍维持超警，最大超警幅度3.51米，其中11条河流维持超保。据预报，8月17日至18日，受降雨及上游来水影响，太湖将发生流域性大洪水，黑龙江上游干流开库康到三道卡河段将发生超警洪水，长江上游支流岷江、沱江、大渡河，西江上游支流南盘江、北盘江等主要河流将出现明显涨水过程，暴雨区内部分中小河流可能发生超警洪水。今天8时至明天8时，四川中南部、云南东北部发生山洪灾害的可能性大，发布山洪橙色预警。水利部维持洪水黄色预警，提醒暴雨洪水影响地区社会公众注意防范。（央视新闻）", "ctime": 1786938647, "time_str": "11:50:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260817/c679005174.shtml"}, {"id": "4966599", "title": "公募调研热情升温 上周调研次数超540次", "content": "随着上市公司中报业绩陆续披露，公募机构调研热情逐渐升温。公募排排网数据显示，上周（8月10日—8月16日）共有130家公募机构参与到A股调研活动中，覆盖到17个申万一级行业中的46只个股，合计调研达546次，环比增幅42.19%。（人民财讯）", "ctime": 1786938454, "time_str": "11:47:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260817/c679005115.shtml"}, {"id": "4966597", "title": "多方面优化升级 帐篷用织物新国标明年实施", "content": "记者今天从市场监管总局了解到，《野营帐篷和遮阳篷用织物》国家标准，将于2027年8月1日起实施。该标准规定了各类野营帐篷用外帐织物和遮阳篷用织物的质量技术要求，旨在引导企业提高户外纺织品功能性指标，提升消费者户外露营的使用体验。随着露营经济快速发展，野营帐篷、遮阳篷产品品类丰富，登山探险、长期旅居等多元场景对织物使用性能提出更高要求。本次标准修订从产品分类、质量指标、检测方法等方面进行优化升级。一是细化产品分类。标准按照适用场景，将产品划分为晴天短期使用、阴雨天气使用、全气候通用三类，更加匹配各类户外实际使用需求。二是升级质量要求。标准提高断裂强力、撕破强力、防水性能等关键指标，并按产品类别差异化设置防水性能、防寒性能、耐气候性等指标，持续提升产品的使用性能和质量。三是统一检测规范。标准不仅对原有试验方法进行更新升级，还同步新增耐湿摩擦色牢度、幅宽偏差专项检测方法，丰富检测技术手段，提高检测技术能力。（央视新闻）", "ctime": 1786938375, "time_str": "11:46:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260817/c679005094.shtml"}, {"id": "4966595", "title": "IDC发布AI视频云报告：市场规模近10亿，行业迈入“AI重塑多媒体创作与交互”新纪元", "content": "国际数据公司（IDC）今年首次发布《中国AI视频云市场份额，2025》报告，揭示了AI技术如何从根本上重塑内容供给体系。报告显示，2025年中国AI视频云市场已形成“音视频AI实时互动”与“智能媒体生产与处理”两大核心赛道，市场规模合计近10亿元，其中后者同比增速高达427.0%，一场由AI驱动的“内容工业革命”已全面爆发。（新浪财经）", "ctime": 1786938332, "time_str": "11:45:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260817/c679005087.shtml"}, {"id": "4966577", "title": "ETF午评：科创成长ETF领涨5.02%，酒ETF领跌2.95%", "content": "ETF截至中午收盘涨跌不一，科创成长ETF（588110）领涨5.02%，科创成长ETF（589700）涨4.89%，科创成长ETF（588070）涨4.67%，酒ETF（512690）领跌2.95%，游戏ETF（516010）跌2.72%，游戏ETF（159869）跌2.62%。", "ctime": 1786937628, "time_str": "11:33:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260817/c679004830.shtml"}, {"id": "4966573", "title": "ETF两市成交额报2722.54亿元，较上一交易日此时缩量324.05亿元", "content": "截至目前，ETF两市成交额报2722.54亿元，较上一交易日此时缩量324.05亿元，分类型来看，股票型ETF成交额911.53亿元，债券型ETF成交额1273.96亿元，货币型ETF成交额109.52亿元，商品型ETF成交额45.38亿元，QDII型ETF成交额380.66亿元。", "ctime": 1786937517, "time_str": "11:31:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260817/c679004798.shtml"}, {"id": "4966567", "title": "期货午评：霍尔木兹海峡战云密布！欧线集运、乙二醇双双暴涨超5%！", "content": "期货午评：早盘收盘，国内期货主力合约涨多跌少，集运欧线涨近9%，乙二醇涨超5%，合成橡胶、纯苯涨超4%，PTA、对二甲苯、低硫燃料油涨近4%。跌幅方面，玉米、淀粉、碳酸锂跌超1%。", "ctime": 1786937492, "time_str": "11:31:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260817/c679004793.shtml"}, {"id": "4966565", "title": "A股午评：科创50指数高开高走涨3.04%，粮食概念、半导体、存储芯片板块涨幅居前", "content": "A股三大指数早盘集体上涨，截至午盘，上证指数涨0.84%，深证成指涨1.26%，创业板指涨1.33%，北证50涨1.41%，科创50指数涨3.04%。全市场成交额15069亿元，较上日放量1106亿元，全市场超3800只个股上涨。板块题材上，粮食概念、培育钻石、电子化学品、半导体、存储芯片板块涨幅居前；白酒、游戏、影视院线、网络游戏、云游戏板块跌幅居前。盘面上，粮食概念板块高开高走，金健米业、农发种业、京粮控股涨停，秋乐种业一度涨超21%，神农种业、康农种业、登海种业涨幅居前。培育钻石板块表现活跃，黄河旋风、亚振家居涨停，惠丰钻石、力量钻石、国机精工涨幅居前。半导体板块表现强势，有研新材涨停，中微半导、普冉股份、中科飞测、芯朋微、盛合晶微涨幅居前。白酒板块震荡走低，古井贡酒、迎驾贡酒、贵州茅台领跌。影视院线板块表现低迷，北京文化一字跌停，儒意电影跌超8%，华智数媒、中国电影、上海电影跟跌。", "ctime": 1786937451, "time_str": "11:30:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260817/c679004786.shtml"}, {"id": "4966561", "title": "股指期货早盘收盘 主力合约全线上涨", "content": "股指期货早盘收盘，主力合约全线上涨。沪深300股指期货(IF)主力合约涨0.83%，上证50股指期货(IH)主力合约涨0.51%，中证500股指期货(IC)主力合约涨1.80%，中证1000股指期货(IM)主力合约涨1.62%。", "ctime": 1786937430, "time_str": "11:30:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260817/c679004784.shtml"}, {"id": "4966555", "title": "明起珠海多个口岸将实施通关便利措施", "content": "8月17日，记者从珠海边检总站了解到，经中华人民共和国出入境管理局批准，珠海边检总站与澳门治安警察局协商，定于2026年8月18日零时起，在港珠澳大桥、横琴、青茂三个合作查验口岸正式实施优化“合作查验，一次放行”查验模式的三项便利措施。此次措施涵盖港澳居民证件交验方式优化、合作快捷通道及“联合一站式”车道通行人员范围扩大等内容，旨在进一步提升旅客通关体验，促进粤港澳大湾区人员便利往来。（央视新闻）", "ctime": 1786937188, "time_str": "11:26:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260817/c679004707.shtml"}, {"id": "4966553", "title": "刘洪建与正大集团、中国移动、中信集团等企业有关负责人一行座谈", "content": "云南省委副书记、昆明市委书记刘洪建与正大集团资深副董事长兼中国区CEO杨小平、中国移动算力办公室主任兼云公司董事长张平宗、中信国际电讯执行董事兼行政总裁吴军一行座谈。刘洪建对各位企业负责人表示欢迎。他说，昆明综合优势明显、发展潜力巨大，希望大家共同抢抓发展机遇，进一步深化务实合作，持续加大在昆投资布局，加快推动项目落地。昆明将全力做好服务保障，为企业发展提供良好环境。各企业负责人表示，非常看好昆明的发展前景，将充分发挥企业优势，为昆明高质量发展作出贡献。（昆明发布）", "ctime": 1786937125, "time_str": "11:25:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260817/c679004680.shtml"}, {"id": "4966551", "title": "海军83舰编队完成远海综合实习访问任务 计划今天返程", "content": "由戚继光舰、昆仑山舰组成的海军83舰编队，即将完成远海综合实习访问任务，计划于今天（17日）上午10时返程回国。海军83舰编队自6月15日起航，已先后赴俄罗斯、越南、文莱、印度尼西亚4国开展友好访问，与到访国海军开展舰艇互访、体育友谊赛等活动。编队在完成教学安排的同时，还组织学员开展了岗位见习，在远海大洋锤炼综合素养。（央视新闻）", "ctime": 1786937109, "time_str": "11:25:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260817/c679004676.shtml"}, {"id": "4966549", "title": "我国成功发射SEO卫星", "content": "北京时间2026年8月17日11时02分，我国在太原卫星发射中心使用长征二号丙运载火箭，成功将SEO卫星发射升空，卫星顺利进入预定轨道，发射任务取得圆满成功。此次任务是长征系列运载火箭的第664次飞行。(央视新闻)", "ctime": 1786937045, "time_str": "11:24:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260817/c679004658.shtml"}, {"id": "4966547", "title": "APEC第三次高官会今起在辽宁大连举行", "content": "今天（8月17日）起到8月28日，2026年亚太经合组织（APEC）第三次高官会及相关会议将在辽宁大连举行。此次会议是出席人员规模最大、活动场次最多的一次高官会，将推动APEC框架下各领域、各机制达成更多合作成果，为11月领导人会议做好准备。预计将有来自APEC各成员经济体、秘书处等2300多名代表与会。（央视新闻）", "ctime": 1786936775, "time_str": "11:19:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260817/c679004593.shtml"}, {"id": "4966545", "title": "第二季度Anthropic营收暴增约14倍 史上规模最大IPO或将易主", "content": "Anthropic公司最新的一份文件显示，其第二季度营收超过115亿美元，较2025年同期的7.87亿美元实现约14倍的强劲增长。据路透社报道，两位熟悉Anthropic公司财务情况的人士称，预计到2028年，Anthropic公司年营收将达到1900亿至2000亿美元。据悉，Anthropic已于6月向美国证券交易委员会秘密提交IPO相关文件，进入静默期。受此约束，公司不得对外发布涉及自身财务表现的公开信息。此前，英国《金融时报》报道称，多位Anthropic的投资者透露，该公司预计将在10月以2万亿美元甚至更高的估值上市。若该预测成真，Anthropic将超越SpaceX，成为史上规模最大的首次公开募股。(人民财讯)", "ctime": 1786936768, "time_str": "11:19:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260817/c679004592.shtml"}, {"id": "4966543", "title": "东阳光成立云智算数据服务公司 注册资本1亿元", "content": "企查查APP显示，近日，东阳市东阳光云智算数据服务有限公司成立，法定代表人为周林，注册资本为1亿元，经营范围包含：大数据服务；通信设备销售；安防设备销售；第一类增值电信业务；第二类增值电信业务等。企查查股权穿透显示，该公司由东阳光旗下东莞东阳光云智算科技有限公司全资持股。（人民财讯）", "ctime": 1786936711, "time_str": "11:18:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260817/c679004561.shtml"}, {"id": "4966523", "title": "乌军袭击俄大型物流枢纽 俄打击乌军工企业和炼油厂", "content": "乌克兰国防部16日在社交媒体发文称，当天凌晨，乌军对俄大型电商平台野莓公司位于莫斯科州的物流枢纽发动了大规模无人机袭击。另据俄国防部16日发布的消息，俄军当天打击了乌克兰的军工企业和炼油厂等设施。（新华社）", "ctime": 1786936487, "time_str": "11:14:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260817/c679004471.shtml"}, {"id": "4966521", "title": "光大期货：通胀数据温和，加息降温支撑黄金", "content": "美国多项通胀数据降温、消费走弱，市场下调 9 月加息预期，上周金价整体呈现冲高后遇阻回落。短期黄金上方阻力明显，但滞胀、地缘风险与央行购金形成支撑，大幅回调空间有限。\n美联储方面，美联储内部仍显分歧，里士满联储主席巴尔金支持维持利率不变，而克利夫兰联储主席哈马克则重申加息立场，市场也在关注沃什的表态，8月末的全球央行年会上沃什讲话将显得异常重要，或给予9月议息一定指引。地缘层面，霍尔木兹海峡博弈与谈判仍在进行。\n美国7月非农意外走弱后，CPI与PPI双双温和进一步确认了通胀压力边际缓解，市场对9月加息的极端定价从前期高点显著回落，这也推动了金价的显著反弹，但随着数据落地，加息概率回落，市场也对后市再次“迷茫”，获利了结推动金价有所回落。另外，据报道，日本政府支持日本央行近期加息，下一步加息时间窗口很可能落在9月或10月，市场出现了短暂的流动性恐慌情绪。短期来看，金价在上方区域阻力较大，需要时间消化和消息面的进一步催化。不过，可以预料的是，随着美国滞胀深化、地缘风险不散以及国内央行连续增持，均为黄金提供结构性支撑，大幅回调概率仍然偏低。（光大期货）", "ctime": 1786936428, "time_str": "11:13:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260817/c679004460.shtml"}, {"id": "4966519", "title": "太阳能在海南成立科技公司 含储能技术服务业务", "content": "企查查APP显示，近日，中节能太阳能科技（海南）有限公司成立，法定代表人为银路，经营范围包含：太阳能发电技术服务；储能技术服务；合同能源管理；以自有资金从事投资活动；节能管理服务等。企查查股权穿透显示，该公司由太阳能全资持股。（人民财讯）", "ctime": 1786936389, "time_str": "11:13:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260817/c679004453.shtml"}, {"id": "4966495", "title": "药明康德A股股价刷新历史新高纪录，现涨5.06%", "content": "药明康德A股股价刷新历史新高纪录，现涨5.06%，最新市值超5000亿，较年内股价低点反弹逾80%。（注：药明康德A股此前最高股价记录为2021年7月16日的166.83元）", "ctime": 1786936157, "time_str": "11:09:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260817/c679004398.shtml"}, {"id": "4966479", "title": "广西建成西部地区首个“千万级”医保影像云平台", "content": "8月15日，记者从自治区医保局获悉，广西医保影像云平台归集的医学影像数据已正式突破1000万例，成为我国西部地区首个迈入“千万级”规模的省级医保影像云平台。据了解，平台启动仅3个月，即实现全区三级医院覆盖率超过90%。目前，接入机构已达463家，覆盖三级医院及基层卫生院，县域及乡村群众在家门口即可享受优质数字影像服务，有效推动优质医疗资源下沉。（广西日报）", "ctime": 1786935824, "time_str": "11:03:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260817/c679004307.shtml"}, {"id": "4966473", "title": "我国在稀土检测关键技术领域取得重要进展", "content": "今天了解到，近日，我国在稀土检测关键技术领域取得重要进展。长期以来，高纯稀土中稀土杂质含量准确测定面临基体干扰的难题，并严重制约稀土产品质量的精准把控。为突破这一技术瓶颈，依托江西理工大学建立的国家市场监督管理总局重点实验室（稀土产品检测与溯源）开展专项技术攻关，经过研究团队的不懈努力，检测技术取得突破，整体技术能力迈上新台阶。研究团队成功研发出多项稀土检测关键技术，其中电感耦合等离子体串联质谱法直接测定高纯稀土中的稀土杂质含量技术尤为突出。该技术成功突破了传统检测方法需要提前对基体进行分离、存在检出限高等瓶颈，具备高灵敏度、高准确性和快速检测等显著优势，能够直接精准测定高纯稀土中的痕量稀土杂质，为稀土产品质量控制提供了坚实有力的技术支撑。（央视新闻）", "ctime": 1786935758, "time_str": "11:02:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260817/c679004263.shtml"}, {"id": "4966469", "title": "集成电路封测板块走高，通富微电涨停", "content": "集成电路封测板块走高，通富微电涨停，盛合晶微、长电科技、华天科技跟涨。", "ctime": 1786935683, "time_str": "11:01:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260817/c679004234.shtml"}, {"id": "4966461", "title": "多支科创半导体ETF涨超4%", "content": "半导体板块走强，科创半导体ETF鹏华(589020)、科创半导体ETF广发(560780)、科创半导体ETF华泰柏瑞(588710)等多支科创半导体ETF涨超4%。", "ctime": 1786935360, "time_str": "10:56:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260817/c679004135.shtml"}, {"id": "4966459", "title": "宁德时代曾毓群：未来不零碳的电池将被时代淘汰", "content": "在今日举行的2026宁德时代核心运营碳中和发布会上，宁德时代董事长兼CEO曾毓群表示，“零碳经济已成为新的增长方式，正打开广阔的产业和发展机会。我相信，在未来不零碳的电池将被时代所淘汰”。他还说，从先进材料到零碳制造，从换电网络到回收循环，宁德时代已实现从研发到回收的零碳闭环。（科创板日报）", "ctime": 1786935343, "time_str": "10:55:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260817/c679004133.shtml"}, {"id": "4966433", "title": "多家黄金珠宝品牌足金饰品价格上调至1330元/克附近", "content": "8月17日上午，多家黄金珠宝品牌公布的足金饰品价格调整至1330元/克左右。具体而言，当日，周生生足金饰品境内价格为1333元/克，周大福足金（饰品、工艺品类）境内价格为1332元/克，六福珠宝足金境内价格为1330元/克，老庙黄金上海区域价格为1328元/克，潮宏基足金（首饰、精品摆件）、中国黄金足金饰品境内价格为1325元/克。上述品牌普遍较前一日挂牌价格有所调整。以周大福为例，其8月17日单克足金饰品挂牌价较前一日上调7元。(上海证券报)", "ctime": 1786934847, "time_str": "10:47:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260817/c679003807.shtml"}, {"id": "4966431", "title": "港股恒生科技指数涨幅达2%", "content": "港股恒生科技指数涨幅扩大至2%，恒生指数现涨1.58%。商汤-W涨超8%，华虹宏力涨近8%，中芯国际涨超7%。", "ctime": 1786934778, "time_str": "10:46:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260817/c679003775.shtml"}, {"id": "4966417", "title": "上海网信办集中约谈重点平台，要求切实履行未成年人网络保护责任", "content": "根据中央网信办部署要求，上海市网信办扎实推进“清朗守护·为你而来”2026年未成年人网络环境整治专项行动。近期组织对属地网络音视频、网络文学、网络游戏、网络社交、电商以及AI平台等一批重点平台开展巡查抽检，依法集中约谈了问题较为突出的6家平台。市网信办相关负责人指出，网站平台要充分认识未成年人网络保护工作的重要性，针对问题全面落实整改措施，持续细化涉可能影响未成年人身心健康不良信息处置标准，紧盯重点环节和重要功能整改效果，切实维护良好网络生态。相关平台负责人表示，将落实约谈要求深入开展整改工作，定期发布治理公告，接受社会监督。（澎湃新闻）", "ctime": 1786934584, "time_str": "10:43:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260817/c679003637.shtml"}, {"id": "4966413", "title": "雅江集团成立新公司 含智能机器人的研发业务", "content": "企查查APP显示，近日，雅下国创中心（林芝）有限公司成立，法定代表人为戴垲昊，注册资本为2亿元，经营范围包含：新材料技术研发；机械设备研发；机械设备销售；工业机器人制造；智能机器人的研发；水利相关咨询服务等。企查查股权穿透显示，该公司由中国雅江集团有限公司旗下雅下国家水电技术创新中心有限公司全资持股。（人民财讯）", "ctime": 1786934528, "time_str": "10:42:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260817/c679003582.shtml"}, {"id": "4966405", "title": "湖南：编制智能机器人产业链全景图谱 开展补链强链行动", "content": "湖南省人民政府办公厅发布《关于加快智能机器人产业发展的实施意见》，意见提出，产业链闭环工程。围绕打造关键材料、核心零部件、整机研发、中试验证、智能制造、场景应用、数据反馈的智能机器人全产业链条，编制智能机器人产业链全景图谱，开展补链强链行动。支持开展关键基础材料和关键工艺攻关，实现轻量合金、PEEK特种工程塑料、高能量密度储能材料等核心基材自主供给，突破微米级超精密加工、复杂曲面成形、表面完整性控制等关键工艺。聚焦RV/谐波减速器、一体化伺服关节、控制与传感部件、操作系统、算法与数据库、轻量化柔性执行器、高性能编码器及机器人专用芯片等领域，培育一批专精特新企业。在工业制造、医疗服务、智慧物流、应急救援、智能建造等领域，打造一批具有市场竞争力的整机品牌。（人民财讯）", "ctime": 1786934255, "time_str": "10:37:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260817/c679003387.shtml"}, {"id": "4966397", "title": "湖南：完善对各类智能机器人企业的上市服务机制，支持企业加快对接资本市场", "content": "湖南省人民政府办公厅发布《关于加快智能机器人产业发展的实施意见》，意见提出，围绕智能机器人产业链上中下游，培育一批链主企业，建立省市联动的常态化扶持机制，支持企业跨行业整合资源，推动其向技术输出型、生态运营型企业转型。完善对各类智能机器人企业的上市服务机制，支持企业加快对接资本市场。鼓励链主企业牵头组建创新应用联合体，承接国家级和省级重大科技攻关任务。（人民财讯）", "ctime": 1786934068, "time_str": "10:34:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260817/c679003259.shtml"}, {"id": "4966387", "title": "星动纪元、自变量机器人等成立数据运营合伙企业", "content": "企查查APP显示，近日，宁波自普星原数据运营合伙企业（有限合伙）成立，经营范围包含：物联网技术服务；大数据服务；数据处理服务；数据处理和存储支持服务；人工智能硬件销售等。企查查股权穿透显示，该公司由自变量机器人科技（深圳）有限 function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
