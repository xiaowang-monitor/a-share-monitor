20260717/c678255554.shtml"}, {"id": "4749961", "title": "重庆燃气：重庆燃气关于持股5%以上股东权益变动触及1%刻度的提示性公告", "content": "重庆燃气：中国农业银行股份有限公司重庆市分行累计减持103.87万股，持股比例降至6.99%。公司公告，2026年7月14日至2026年7月16日期间，中国农业银行股份有限公司重庆市分行通过集中竞价交易方式合计减持公司股票103.87万股，持股比例由7.05%减少至6.99%。", "ctime": 1784279313, "time_str": "17:08:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260717/c678255444.shtml"}, {"id": "4749955", "title": "海力士ADR盘前交易下跌3.5%", "content": "海力士ADR盘前交易下跌3.5%，报147美元，低于其149美元的发行价。", "ctime": 1784279264, "time_str": "17:07:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260717/c678255423.shtml"}, {"id": "4749953", "title": "森霸传感：完成回购注销314.18万股", "content": "森霸传感公告，完成回购注销314.18万股，占公司总股本的1.11%。本次回购注销完成后，公司总股本由2.83亿股减少到2.8亿股。", "ctime": 1784279257, "time_str": "17:07:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260717/c678255406.shtml"}, {"id": "4749947", "title": "开开实业：授权子公司雷西公司拟收购其控股子公司雷西精益60%股权", "content": "开开实业公告，全资子公司上海雷允上药业西区有限公司（雷西公司）拟以自有资金，通过非公开协议收购方式，收购其控股子公司上海雷西精益供应链管理有限公司（雷西精益）少数股东上海中野医疗器械有限公司、上海万序健康科技有限公司合计持有的雷西精益60%股权。本次交易最终价格将以国资备案完成后的正式评估价格为依据，三方股东协商确定最终价格，且不超过国资备案后正式评估对应价值。以2025年12月31日为评估基准日，根据预评估价格对应60%股权初步测算价格约为4739万元。本次交易完成后，雷西公司持有雷西精益的股权比例将由40%提升至100%，公司合并报表范围不发生变化。", "ctime": 1784279208, "time_str": "17:06:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260717/c678255373.shtml"}, {"id": "4749939", "title": "中国互联网信息办公室提出《智能体互信互联互操作全球合作倡议》", "content": "中国互联网信息办公室于2026世界人工智能大会暨人工智能全球治理高级别会议主论坛，提出了《智能体互信互联互操作全球合作倡议》。该倡议旨在加强智能体互信、互联、互操作，促进全球智能体生态的繁荣发展。倡议包括强化技术研发、促进标准互认、共建基础设施、共推应用落地、共促产业协同、共筑安全底线、促进数据流动、加强资源共享、营造包容文化和提升数字素养等十个方面。（央视新闻）", "ctime": 1784279156, "time_str": "17:05:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260717/c678255344.shtml"}, {"id": "4749917", "title": "科大讯飞在WAIC2026发布智能交互服务Agent GuideX", "content": "WAIC2026期间，科大讯飞发布智能交互服务Agent——GuideX。GuideX融合全模态感知、自治理Agent、SkillHub等能力，可执行感知、理解、执行、记忆、共情等服务。在东南亚、中东、拉美等多个国家和地区，GuideX已稳定落地应用，支持3000+行业服务技能，覆盖机场、酒店、展馆、政务、运营商等公共服务场景。", "ctime": 1784279041, "time_str": "17:04:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260717/c678255296.shtml"}, {"id": "4749897", "title": "马来西亚外国游客使用Alipay+扫码支付交易额大幅增长", "content": "马来西亚总理安瓦尔17日在国会表示，外国游客通过Alipay+生态系统在该国进行扫码支付的交易持续快速增长，交易额由2024年的4.35亿林吉特（约合人民币7.42亿元），大幅增长89.6%至2025年的8.24亿林吉特（约合人民币14.05亿元）。安瓦尔援引相关数据显示，外国游客通过Alipay+生态系统在马来西亚完成的扫码支付交易笔数，也由2024年的660万笔，增长60.4%至2025年的1050万笔。（央视新闻）", "ctime": 1784278892, "time_str": "17:01:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260717/c678255198.shtml"}, {"id": "4749871", "title": "严管“拼豆”产品 市场监管总局发布公告", "content": "市场监管总局7月17日发布“拼豆”产品质量安全有关事项公告，依据相关法律法规亮出多项硬约束举措，更好保护儿童安全。其中，提出面向14岁以下儿童使用属于CCC认证范围内的“拼豆”产品，不得以“搭售”“赠品”等方式，在玩具产品出厂时违规搭配家用电器。面向14岁以下儿童使用但不属于CCC认证范围内的“拼豆”产品，加热部件的电压不应超过24V。面向14岁以上人群使用的“拼豆”产品，不得将按照《家用和类似用途电器的安全 第2部分：电熨斗的特殊要求》国家标准设计生产、用于熨烫织物的电熨斗，作为“拼豆”产品的加热部件。(新华社)", "ctime": 1784278847, "time_str": "17:00:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260717/c678255126.shtml"}, {"id": "4749833", "title": "《全球人工智能创新指数报告2026》发布", "content": "7月17日，在上海举行的2026世界人工智能大会暨人工智能全球治理高级别会议上，《全球人工智能创新指数报告2026》发布。此次发布的报告聚焦基础支撑、资源与环境、科技研发、产业与应用、国际合作交流5个维度，对46个国家的人工智能创新发展情况进行量化评价，反映全球人工智能发展整体格局及变化趋势。（新华社）", "ctime": 1784278785, "time_str": "16:59:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260717/c678255097.shtml"}, {"id": "4749827", "title": "中船特气：2026年上半年净利润3.48亿元，同比增长95.63%", "content": "中船特气公告，2026年上半年营业收入19.04亿元，同比增长83.13%。净利润3.48亿元，同比增长95.63%。", "ctime": 1784278765, "time_str": "16:59:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260717/c678255076.shtml"}, {"id": "4749817", "title": "新天科技：拟出售不超过1842.67万股已回购股份 占公司总股本的1.60%", "content": "新天科技公告，公司于2026年07月16日召开的第六届董事会第四次会议审议通过了《关于出售公司已回购股份的议案》。根据公司于2024年2月7日披露的《回购报告书》之约定用途，同意公司以集中竞价方式出售已回购股份不超过1842.67万股，占公司总股本的1.60%，实施期限为自本公告披露之日起15个交易日后的6个月内（即2026年08月10日至2027年02月09日）。", "ctime": 1784278664, "time_str": "16:57:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260717/c678254985.shtml"}, {"id": "4749815", "title": "领益智造：拟将回购资金总额调整为4亿元-8亿元", "content": "领益智造公告，公司拟增加回购股份资金总额，由“不低于人民币2亿元（含），不超过人民币4亿元（含）”调整为“不低于人民币4亿元（含），不超过人民币8亿元（含）”。回购价格上限仍为21.08元/股，回购股份的用途为在未来适宜时机用于实施股权激励计划或员工持股计划。", "ctime": 1784278659, "time_str": "16:57:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260717/c678254983.shtml"}, {"id": "4749813", "title": "托卡耶夫：本次大会是中国在人工智能领域所取得卓越成就的有力见证", "content": "7月17日上午，国家主席习近平在上海世界会客厅出席2026世界人工智能大会暨人工智能全球治理高级别会议开幕式并发表主旨讲话。哈萨克斯坦总统托卡耶夫、柬埔寨首相洪玛奈、泰国总理阿努廷、联合国秘书长古特雷斯分别致辞。哈萨克斯坦总统托卡耶夫说：“我非常荣幸能够出席本次重要会议。多年来，该平台已牢固确立其在全球人工智能议程中的引领地位。本次大会也是中国在人工智能领域所取得卓越成就的有力见证。当前，全球一半以上的人工智能科研工作者来自中国。中国的人工智能专利数量位居全球首位。中国充满活力的创新生态，持续驱动各类前沿技术领域的突破性进展。中国在开源创新、开放平台建设及国际科技合作方面所发挥的引领作用，为世界各国创造了全新的发展机遇。”（央视新闻）", "ctime": 1784278590, "time_str": "16:56:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260717/c678254956.shtml"}, {"id": "4749807", "title": "越疆科技回应举报：文章指控不属实，上市各项准备工作正按计划有序推进", "content": "针对近期网络上出现的‘实名举报’及相关文章，7月17日，越疆科技回应：文章指控不属实且存在严重误导性。目前，公司生产经营一切正常，创业板上市各项准备工作正按计划有序推进。我们将继续严格履行信息披露义务，后续进展请以公司官方披露信息为准。据报道，7月17日凌晨，一封实名举报信将正在推进“H回A”进程的越疆科技推上风口浪尖。举报人宋涛自称是越疆科技联合创始人、原常务副总裁兼COO，他举报越疆科技及创始人刘培超在A股招股说明书存在重大股权瑕疵及隐瞒，称其本应持有的越疆科技69.7373%财产份额，在招股书中登记为22.455%，宋涛称：“招股书通篇虚假陈述、刻意掩盖上亿级股权权属争议。”越疆科技现在正处在“H回A”的关键进程中，已确定将于7月22日上会。(新京报)", "ctime": 1784278480, "time_str": "16:54:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260717/c678254903.shtml"}, {"id": "4749801", "title": "恒通股份：控股股东一致行动人拟增持不超5000万元", "content": "恒通股份公告，控股股东一致行动人SONG JIANBO首次增持公司A股371.54万股，金额4165.53万元，占总股本0.53%；增持后持股3529.1万股，占比5.00%。其计划2026年7月17日～2027年1月16日以集中竞价方式继续增持，合计增持金额不超过5000万元（含本次已增持金额）。", "ctime": 1784278453, "time_str": "16:54:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260717/c678254895.shtml"}, {"id": "4749799", "title": "宏润建设：公司中标4.58亿元项目", "content": "宏润建设公告，公司于近日成功中标福海大道快速路一期工程（环城南路东延-韩天线）施工II标段项目，与项目业主方正式签署相关施工合同。项目业主方为宁波市城市基础设施建设发展中心，项目承包方式为施工总承包模式，工程工期为960日历天。项目范围及规模为施工II标段的道路工程、桥梁工程、管线工程（含电力、自来水）、治安监控及附属工程等的施工总承包（不含交通设施），II标段长度约1.84公里。签约合同价为4.58亿元，占公司2025年度经审计营业收入的7.97%。", "ctime": 1784278448, "time_str": "16:54:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260717/c678254891.shtml"}, {"id": "4749789", "title": "迈入AGI科学元认知时刻，上海发布“书生·端砚”，解锁全栈科研新能力", "content": "今天（17日），在2026世界人工智能大会科学（WAIC 2026）前沿论坛上，上海人工智能实验室发布“书生·端砚”科学发现平台。“书生·端砚”面向真实科研全流程，连接了科学大模型、专业智能体、实验数据与具身自动化设备，覆盖从“假设提出”到“实验验证”的完整科研流程。“书生·端砚”已在生命科学、关键材料、半导体、核聚变、量子、地球气象六大核心科研领域落地。其中在蛋白质、材料等前沿研究中，“书生·端砚”完成了干湿实验闭环，实现了科学发现全流程端到端验证。（上观）", "ctime": 1784278410, "time_str": "16:53:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260717/c678254846.shtml"}, {"id": "4749777", "title": "中国科学院发布“敖仓·科技语料库”", "content": "7月17日，由中国科学院文献情报中心牵头建设的“敖仓·科技语料库”在2026世界人工智能大会暨人工智能全球治理高级别会议期间正式发布。“敖仓·科技语料库”是通过精炼大量科学数据、科技论文、发明专利和科技图书，形成的让人工智能“读懂”的海量数据集合。目前，“敖仓·科技语料库”构建了“1+7+N”总分库模式，即1个全学科数据知识融合的国家级总库、7个专业化深度提炼的领域分库与N个场景化关联的应用子库，形成了覆盖数学物理、化学化工、天文空间等学科的科技语料供给体系。（新华社）", "ctime": 1784278314, "time_str": "16:51:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260717/c678254800.shtml"}, {"id": "4749769", "title": "雅本化学：拟以2500万元-5000万元回购公司股份", "content": "雅本化学公告，拟使用自有资金及自筹资金以集中竞价交易方式回购部分公司A股股票，回购资金总额不低于2500万元（含）且不超过5000万元（含），预计回购股份数量约为362.84万股至725.69万股，占公司目前总股本的0.38%至0.75%。", "ctime": 1784278292, "time_str": "16:51:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260717/c678254793.shtml"}, {"id": "4749749", "title": "水井坊：副总经理兼财务总监蒋磊峰辞职", "content": "水井坊公告，公司董事会收到蒋磊峰先生的书面辞职报告，因个人原因，蒋磊峰先生自2026年7月17日起辞去公司董事、战略委员会委员、副总经理、财务总监职务。蒋磊峰先生辞职不会影响公司正常运行，且不会导致董事会成员低于法定最低人数。截至公告披露日，蒋磊峰先生未持有公司股份，将按公司规定做好交接工作。", "ctime": 1784278124, "time_str": "16:48:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260717/c678254700.shtml"}, {"id": "4749739", "title": "龙旗科技：首次回购公司股份约2000万元，已回购49.77万股", "content": "龙旗科技公告，公司于2026年4月28日审议通过回购方案，拟以2.5亿元至5亿元回购股份，用于员工持股计划或股权激励，回购价格上限调整为不超过57.22元/股。2026年7月17日，公司通过集中竞价交易方式首次回购股份49.77万股，占公司总股本的0.10%，成交最高价40.8元/股，最低价39.5元/股，已支付总金额1999.82万元（不含交易费用）。", "ctime": 1784278056, "time_str": "16:47:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260717/c678254559.shtml"}, {"id": "4749717", "title": "亿能电力：股东黄彩霞、亿能信息、倪成标已分别减持0.9886%、0.7291%和0.0761%", "content": "亿能电力公告，股东黄彩霞、无锡亿能信息科技合伙企业(有限合伙)、倪成标减持计划实施完毕，分别通过集中竞价减持100万股、73.75万股、77000股，占总股本比例0.9886%、0.7291%、0.0761%；当前持股数量分别为4573.53万股、589.4万股、23.1万股。", "ctime": 1784277925, "time_str": "16:45:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260717/c678254458.shtml"}, {" }
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
