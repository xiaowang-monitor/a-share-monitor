ock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260507/c676513734.shtml"}, {"id": "4332357", "title": "吉林：“十五五”将全力打造国家绿色能源产业高地", "content": "记者从7日举行的“开局起步‘十五五’吉林省专题新闻发布会”上获悉，“十五五”期间，吉林将推进“绿电”“绿氢”等绿色能源产业跨越式发展，全力打造国家绿色能源产业高地。吉林风光资源富集，可开发容量达4亿千瓦，拥有充足的风光电厂建设场地、丰富的地表水资源、优质的生物质绿碳，交通便利，产业链完整，应用场景广阔，开发条件具有独特优势。吉林省委副书记、省长胡玉亭介绍，“绿氢+”产业是振兴发展的最大增长极、未来产业的重要突破口。具体来讲，吉林将从三方面推动产业发展：一是大力推动“绿电”跨越发展，一体推进“源网荷储”建设，拓展多元化场景应用，强化绿电直连、绿电交易、绿色认证、要素保障等政策支持，每年新增绿电装机1000万千瓦左右；二是大力推动“绿氢+”产业跃升，协同发展绿氢“制储输用”全产业链，探索统购统销模式，降低制氢用氢成本，布局固态储氢加氢站，拓展氢能汽车、调峰电站、氢能冶金等应用场景，建设氢能综合应用试点；三是高标准建设“零碳园区”，建成松原、辽源、四平3个国家级零碳园区和白城等一批省级零碳园区。根据规划，到2030年，吉林绿电装机将达到7000万千瓦规模，绿氢产能有望达到100万吨，绿氨绿醇产能达到600万吨，打造全球最大的“绿色液体燃料供应基地”。(新华社)", "ctime": 1778146016, "time_str": "17:26:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260507/c676513640.shtml"}, {"id": "4332347", "title": "卫星图像显示至少228个美军资产在伊朗战事中受损", "content": "美国方面6日消息称，对卫星图像所作分析显示，自美以伊冲突2月底爆发以来，美国在中东地区的军事站点共有至少228个“结构”或设备部件受损，包括机库、营房、燃料库、军机，以及关键雷达、通信和防空设备。这一受损程度远比美国政府先前公开承认的情况严重。（央视新闻）", "ctime": 1778145984, "time_str": "17:26:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260507/c676513629.shtml"}, {"id": "4332341", "title": "财政部：开展公共数据资源治理成本归集试点工作", "content": "为探索公共数据资源会计处理方法，推动公共数据资源科学化管理，决定在北京市、河北省、辽宁省、上海市、浙江省、安徽省、福建省、青岛市、重庆市、四川省等地区组织开展行政事业单位公共数据资源治理成本归集试点工作。(财政部)", "ctime": 1778145865, "time_str": "17:24:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260507/c676513581.shtml"}, {"id": "4332333", "title": "欧盟考虑限制美国云平台使用部分政府数据", "content": "5月7日消息，据报道，欧盟正在考虑制定规则，限制其成员国政府使用美国云服务提供商处理敏感数据。欧盟委员会预计将于5月27日公布其“技术主权方案”，该方案将包括一系列旨在加强欧盟在关键数字领域战略自主性的措施。作为该方案准备工作的一部分，欧盟委员会内部正在讨论限制将敏感的公共部门数据暴露给欧盟以外公司提供的云平台。(界面)", "ctime": 1778145707, "time_str": "17:21:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260507/c676513495.shtml"}, {"id": "4332329", "title": "央行公布4月中央银行各项工具流动性投放情况", "content": "中国人民银行公布2026年4月中央银行各项工具流动性投放情况。数据显示，4月，中期借贷便利（MLF）净投放-2000亿元，常备借贷便利（SLF）净投放-7亿元，其他结构性货币政策工具净投放3667亿元。公开市场业务方面，4月，公开市场国债买卖净投放400亿元，7天期逆回购净投放-3316亿元。（证券时报）", "ctime": 1778145671, "time_str": "17:21:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260507/c676513473.shtml"}, {"id": "4332313", "title": "王毅会见美国国会参议员代表团", "content": "5月7日，中共中央政治局委员、外交部长王毅在北京会见来华访问的美国国会参议员代表团戴安斯一行。王毅说，此访是特朗普总统就任以来首个访华的美国国会两党参议员代表团，具有重要象征意义。希望你们通过此访感受中国发展新气象，搭建沟通新桥梁，探讨合作新领域，为中美关系稳定健康可持续发展增添新动力。(新华社)", "ctime": 1778145404, "time_str": "17:16:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260507/c676513341.shtml"}, {"id": "4332305", "title": "以色列不满美伊停战谅解备忘录", "content": "针对美伊正在协商的停战谅解备忘录，以色列方面反应微妙。公开层面，以方始终强调与美方协调一致；私下里，以色列方面对备忘录表示不满，认为这将导致以色列的战争目标半途而废，“对以色列来说是一场灾难”。以色列媒体分析认为，当前以色列的总体态度是静观其变，正采取“两手准备”，官方不公开反对美伊谈判，但军事上保持高度战备，随时准备重返战争。（央视新闻）", "ctime": 1778145280, "time_str": "17:14:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260507/c676513289.shtml"}, {"id": "4332301", "title": "光华科技：董事、财务总监蔡雯因个人原因辞职", "content": "光华科技公告，公司董事、财务总监蔡雯因个人原因辞去公司董事、财务总监及董事会提名委员会委员职务。辞职后，蔡雯在公司总裁办担任专员职务。", "ctime": 1778145246, "time_str": "17:14:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260507/c676513276.shtml"}, {"id": "4332299", "title": "成都先导：股东华博器械拟减持1%，深圳钧天拟减持2.51%", "content": "成都先导公告，股东拉萨经开区华博医疗器械持股4177.06万股，占10.42%；深圳市钧天投资持股1006.78万股，占2.51%。华博器械拟于2026年5月29日至2026年8月28日集中竞价减持不超400万股，比例不超1%，且任意连续90日减持不超1%。深圳钧天拟于2026年5月13日至2026年8月12日以集中竞价和大宗交易方式减持1006.78万股，占2.51%。", "ctime": 1778145239, "time_str": "17:13:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260507/c676513268.shtml"}, {"id": "4332287", "title": "腾讯公布Hy3 preview语言模型进展 上线两周Token调用增10倍", "content": "5月7日，腾讯混元公布最新数据，自上线以来，Hy3 preview的Token（词元）调用量持续增加，目前总量已经超过上一代版本模型Hy2的10倍，尤其是代码和智能体类场景的Token调用量增加明显，在腾讯的WorkBuddy/Codebuddy以及Qclaw类应用中，增长幅度超过16.5倍。4月23日，腾讯混元Hy3 preview语言模型发布并开源。Hy3 preview是腾讯混元进行技术重构后推出的首个模型，采用快慢思考融合的混合专家（MoE）架构，总参数量达2950亿，激活参数量为210亿，并支持256K的长上下文窗口。Hy3 preview已全面接入腾讯多个产品，包括腾讯元宝、QQ浏览器、微信读书等多个业务场景。（中证金牛座）", "ctime": 1778145083, "time_str": "17:11:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260507/c676513158.shtml"}, {"id": "4332285", "title": "江苏发布全国首个《万兆数智园区建设导则》", "content": "近日，由江苏省通信管理局牵头主编的地方标准《万兆数智园区建设导则》（DB32/T 5381-2026，以下简称《导则》），经江苏省市场监督管理局批准于2026年4月3日发布，2026年5月3日起正式实施。《导则》围绕园区规划、建设、管理、安全四个方面提出系统要求，形成“一体化数智园区建设体系”，秉持万兆、数智、融合、人本、安全、绿色六大理念，实现信息基础设施同步规划、同步设计、同步建设，推动园区管理由经验管理向数据治理转变。一是升级网络能力，推动园区网络从“千兆”迈向“双万兆+AI”协同发展时代。二是规范数字底座建设，构建感知、网络、平台、应用一体化数智基础设施体系。三是升级园区治理模式，提升园区运营管理数字化、智能化水平。四是提升安全保障能力，建立网络安全与数据安全双重保障体系。《导则》兼顾技术先进性与实施可行性，在园区50G-PON端口覆盖、5G-A基站占比、园区数据中心绿色发展、云边协同算力服务等方面明确了一系列核心技术指标和建设要求，高效支撑工业视觉检测、数字孪生工厂、AI质量检测等多种数智化应用场景建设。《导则》是全国首个关于万兆数智园区建设的地方标准，将为江苏省园区双万兆网络建设和数智化升级提供系统化、规范化的技术指引，助力更多万兆园区标杆工程落地，加快“智改数转网联”行动步伐，推动产业园区向数字化、网络化、智能化全面升级，为新型工业化注入强劲动能。(工信部)", "ctime": 1778145038, "time_str": "17:10:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260507/c676513121.shtml"}, {"id": "4332283", "title": "卡倍亿：拟发行可转换公司债券募集资金总额不超过5.1亿元", "content": "卡倍亿公告，公司拟发行可转换公司债券募集资金总额不超过5.1亿元。公司于2026年5月7日召开第四届董事会第十次会议，审议通过《关于调整向不特定对象发行可转换公司债券方案的议案》。根据《上市公司证券发行注册管理办法》《证券期货法律适用意见第18号》等相关规定，公司关于本次发行的董事会决议前六个月至本次发行前新投入和拟投入的财务性投资金额共计9000万元，该部分财务性投资需要从本次募集资金总额中扣除。出于谨慎性考虑，公司对向不特定对象发行可转换公司债券发行规模及募集资金用途进行了调整，发行规模调减金额为9000万元。", "ctime": 1778144990, "time_str": "17:09:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260507/c676513073.shtml"}, {"id": "4332279", "title": "瑞银集团（UBS）对宁德时代的多头持仓比例降至5.88%", "content": "据香港交易所披露，瑞银集团（UBS）对宁德时代新能源科技股份有限公司 - H股的多头持仓比例于2026年4月30日从7.97%降至5.88%。", "ctime": 1778144868, "time_str": "17:07:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260507/c676513029.shtml"}, {"id": "4332277", "title": "摩根大通（JPMorgan）对比亚迪股份的多头持仓比例降至5.38%", "content": "据香港交易所披露，摩根大通（JPMorgan）对比亚迪股份有限公司 - H股的多头持仓比例于2026年5月4日从5.72%降至5.38%。", "ctime": 1778144855, "time_str": "17:07:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260507/c676512998.shtml"}, {"id": "4332275", "title": "广联航空：董事总经理杨怀忠已减持0.051%", "content": "广联航空公告，公司董事、总经理杨怀忠于2026年4月16日至2026年4月30日通过集中竞价减持股份17.67万股，减持均价43.87元/股，占总股本0.051%；减持前持有70.7万股，占0.22%，减持后持有53.03万股，占0.16%，其中无限售条件股份50股。本次减持计划已实施完毕，与此前披露计划不超过17.68万股一致。", "ctime": 1778144844, "time_str": "17:07:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260507/c676512990.shtml"}, {"id": "4332271", "title": "摩根大通（JPMorgan）对药明康德的多头持仓比例降至8.43%", "content": "据香港交易所披露，摩根大通（JPMorgan）对无锡药明康德新药开发股份有限公司 - H股的多头持仓比例于2026年5月1日从9.6%降至8.43%。", "ctime": 1778144837, "time_str": "17:07:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260507/c676512986.shtml"}, {"id": "4332267", "title": "普昂医疗：胡超宇增持0.03%，金额70.04万元", "content": "普昂医疗公告，公司实际控制人、董事长、总经理胡超宇于2026年4月30日通过北京证券交易所集中竞价增持17794股，占公司当前总股本0.03%，增持金额70.04万元（不含交易费用）。增持后胡超宇直接持股59873股，占0.11%；直接及间接合计持股340.18万股，占6.43%。胡超宇、毛柳莺及一致行动人合计控制2520.1万股，表决权比例47.63%。", "ctime": 1778144795, "time_str": "17:06:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260507/c676512970.shtml"}, {"id": "4332265", "title": "佰仁医疗：核心技术人员郑雪琴离职", "content": "佰仁医疗公告，核心技术人员、数据工程师郑雪琴因个人原因申请辞去所任职务，并于近日办理完毕离职手续。郑雪琴1982年1月出生，本科学历，中医学专业。截至本公告日，郑雪琴未参与公司专利研究及申报。公司与郑雪琴签署了《保密协议》，其离职不会对公司技术研发及生产经营带来实质性影响。", "ctime": 1778144769, "time_str": "17:06:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260507/c676512955.shtml"}, {"id": "4332263", "title": "中办、国办印发《美丽中国建设成效考核办法》", "content": "中共中央办公厅、国务院办公厅印发《美丽中国建设成效考核办法》。(新华社)", "ctime": 1778144614, "time_str": "17:03:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260507/c676512883.shtml"}, {"id": "4332255", "title": "美公布一份“爱泼斯坦遗书”", "content": "美国一名联邦地区法院法官6日公开一张纸条，据称是臭名昭著的已故美国富商爱泼斯坦所写遗书。其中一句话写道：“他们调查了我一个月——什么也没发现！！！”美国媒体注意到，这张纸条没有署名和日期。法官称，爱泼斯坦的前狱友发现这张纸条，并提交给法庭。爱泼斯坦2008年因教唆未成年人卖淫被定罪，2019年7月再次因涉嫌性犯罪被捕，同年8月死在狱中，被判定为“自杀”，但死因受到质疑。因牵扯欧美政商界等众多名流，爱泼斯坦案引发广泛负面舆论。(新华社)", "ctime": 1778144511, "time_str": "17:01:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260507/c676512836.shtml"}, {"id": "4332233", "title": "酒鬼酒：副总经理胡晓熹因工作调整辞职", "content": "酒鬼酒公告，公司董事会收到胡晓熹先生的书面辞职报告，因工作调整原因，胡晓熹先生申请辞去公司副总经理职务，原定任期至2027年2月22日。辞职后，胡晓熹先生将不在公司担任任何职务。根据相关规定，胡晓熹先生的辞职报告自送达公司董事会时生效。", "ctime": 1778144404, "time_str": "17:00:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260507/c676512470.shtml"}, {"id": "4332227", "title": "中证协通报一季度券商投诉处理情况：佣金税费投诉量居首，七方面建议直指服务痛点", "content": "中国证券业协会近日在行业内通报了2026年第一季度证券公司投诉处理工作情况。通报数据显示，一季度111家证券公司共接收客户投诉7860件，办结7261件，办结率达92.4%，其中4800件通过协商达成和解，和解金额合计271万元。在一季度投诉总量中，佣金调整及税费问题占比最高，达19.2%，成为投资者反映最集中的领域。针对一季度投诉反映出的服务痛点，中证协从七个方面向行业提出了具体的工作建议，旨在督促机构全面提升服务质效与投 // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
