故原因尚不清楚。（CCTV国际时讯）", "ctime": 1775558051, "time_str": "18:34:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260407/c675804391.shtml"}, {"id": "4193107", "title": "万得凯：拟发行股份及支付现金购买资产并募集配套资金", "content": "万得凯公告，公司拟通过发行股份及支付现金的方式购买苏州奥兰多等4名交易对方持有的曾瑞智控100%股权，并向不超过35名特定对象募集配套资金。本次交易中，发行股份及支付现金购买资产与募集配套资金互为前提，同时生效。标的资产的最终交易价格将以符合《证券法》规定的资产评估机构出具的资产评估报告的评估结果为基础，经交易各方充分协商确定。募集配套资金总额亦不超过本次发行股份购买资产交易价格的100%。", "ctime": 1775558044, "time_str": "18:34:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260407/c675804390.shtml"}, {"id": "4193105", "title": "世界田联宣布2030年起单独举办马拉松锦标赛", "content": "当地时间4月7日，世界田联宣布，将从2030年起设立世界田联马拉松锦标赛，马拉松项目将从世界田径锦标赛赛程中独立出来。根据规划，马拉松仍将作为比赛项目出现在2027年和2029年世界田径锦标赛中。但从2030年起，马拉松将改为单独设立锦标赛；自2031年起，世界田径锦标赛将不再设置马拉松或其他路跑项目。世界田联表示，新设立的马拉松锦标赛将每年举办一次，男女项目轮流进行。同时，现有的世界田联路跑锦标赛仍将作为独立赛事继续举办。此外，世界田联表示已与希腊方面展开初步磋商，雅典有望成为2030年首届世界田联马拉松锦标赛的举办城市。（央视新闻）", "ctime": 1775558034, "time_str": "18:33:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260407/c675804385.shtml"}, {"id": "4193093", "title": "外交部部长助理蔡伟会见联合国管理事务副秘书长波拉德", "content": "2026年4月7日，外交部部长助理蔡伟会见来华访问的联合国管理事务副秘书长波拉德。蔡伟表示，作为联合国第二大会费国和维和摊款国，中方一贯认真履行联合国财政义务，以实际行动支持联合国和多边主义事业。当前国际形势动荡加剧，单边主义、保护主义抬头，中方愿进一步深化同联合国在管理事务等领域合作，坚定维护联合国地位和作用。波拉德高度赞赏中国对多边主义和联合国的大力支持，表示愿同中方加强沟通协调，推动联合国通过改革提质增效，以更好履行使命、应对挑战，并努力提升发展中国家人员在联合国的代表性。（外交部网站）", "ctime": 1775557976, "time_str": "18:32:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260407/c675804357.shtml"}, {"id": "4193085", "title": "伊朗发动“真实承诺-4”第99轮行动 打击美以多个目标", "content": "伊朗伊斯兰革命卫队在“真实承诺-4”行动第99轮中，对波斯湾及霍尔木兹海峡地区的美国基地、巴勒斯坦被占领土内的军事力量及沙特的美国企业拥有的石化综合体实施了打击。同时，一艘被指与以色列有关的集装箱船和美国“亚伯拉罕·林肯”号航母编队也遭到导弹打击。伊朗表示将对针对民用设施的袭击进行报复，并称已不再对打击目标设限。（央视新闻）", "ctime": 1775557859, "time_str": "18:30:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260407/c675804315.shtml"}, {"id": "4193083", "title": "2026年清明节假期国内出游1.35亿人次", "content": "2026年清明节假期，全国文化和旅游市场安全平稳有序。经文化和旅游部数据中心测算，清明节假期3天，全国国内出游1.35亿人次，同比增长6.8%；国内出游总花费613.67亿元，同比增长6.6%。（央视新闻）", "ctime": 1775557843, "time_str": "18:30:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260407/c675804305.shtml"}, {"id": "4193079", "title": "美股三大股指期货短线走低", "content": "美股三大股指期货短线走低，并转跌。有消息称伊朗哈尔克岛传出爆炸声。", "ctime": 1775557787, "time_str": "18:29:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260407/c675804212.shtml"}, {"id": "4193077", "title": "启智机器人与大昌科技达成战略合作", "content": "近日，启智（芜湖）智能机器人有限公司与安徽大昌科技股份有限公司于芜湖正式签署战略合作协议。本次合作将围绕技术协同、场景落地与生态共建三大方向展开，双方将重点探索机器人关键零部件的自主化技术路径，并携手推进具身智能技术在工业制造场景中的验证与规模化应用实践。（人民财讯）", "ctime": 1775557736, "time_str": "18:28:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260407/c675804197.shtml"}, {"id": "4193075", "title": "湖北能源：2026年3月公司完成发电量35.57亿千瓦时，同比减少2.89%", "content": "湖北能源公告，2026年3月公司完成发电量35.57亿千瓦时，同比减少2.89%。其中水电发电量同比增加37.07%，火电发电量同比减少16.47%，新能源发电量同比减少14.06%。公司本年累计完成发电量111.74亿千瓦时，同比增加12.03%。其中水电发电量同比增加85.63%，火电发电量同比减少2.64%，新能源发电量同比减少12.36%。", "ctime": 1775557694, "time_str": "18:28:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260407/c675804179.shtml"}, {"id": "4193059", "title": "以色列被曝已制定下一步对伊朗计划", "content": "美国和伊朗就停火问题的博弈持续，美国总统所谓的“最后期限”临近。在这样的背景下，以色列正在加大对伊朗基础设施的空袭力度。另有以色列官员透露，以方已就下一阶段行动制定了计划。以军今天（4月7日）警告伊朗民众从现在起至伊朗当地时间今天21点（北京时间4月8日凌晨1:30），不要乘坐伊朗境内的任何火车，在火车上或者铁路附近都将危及生命安全。而就在前一天，以色列针对德黑兰的三个民用和军用机场发动了大规模空袭。以色列媒体分析认为，上述行动都是美以升级对伊朗攻击行动的一部分，目的是破坏伊朗的后勤协调和军事反应能力。而威胁对铁路系统发起打击，同时也是一种升级的心理战。（CCTV国际时讯）", "ctime": 1775557568, "time_str": "18:26:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260407/c675804140.shtml"}, {"id": "4193051", "title": "中无人机：董事长张晓军增持0.0011%", "content": "中无人机公告，董事长张晓军于2026年4月3日通过上海证券交易所竞价交易增持公司股份7700股，成交金额36.99万元，占公司总股本0.0011%；增持前未持股，增持完成后直接持有7700股。", "ctime": 1775557511, "time_str": "18:25:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260407/c675804111.shtml"}, {"id": "4193047", "title": "神火股份：预计2026年第一季度净利润22.5亿元，同比增长217.68%", "content": "神火股份公告，预计2026年第一季度净利润为22.5亿元，同比增长217.68%。报告期内，受电解铝产品售价同比上涨、主要原材料氧化铝价格同比下降等因素影响，公司电解铝板块盈利能力大幅增强。", "ctime": 1775557443, "time_str": "18:24:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260407/c675804074.shtml"}, {"id": "4193045", "title": "东山精密：预计2026年第一季度净利润为10亿元-11.5亿元 同比增长119.36%-152.27%", "content": "东山精密公告，预计2026年第一季度净利润为10亿元-11.5亿元，同比增长119.36%-152.27%。2026年一季度公司传统业务保持稳定增长，消费电子、汽车及通讯等行业的印刷线路板、精密组件及光电模组出货保持稳定；AI算力需求强劲驱动了AI基础设施的加速投资，索尔思的光模块产品不断导入新的大客户，成为了公司新的核心利润增长点；报告期内公司积极赋能索尔思和GMD，特别是在索尔思的扩产方面，充分发挥了集团在资金、人才、技术和客户等资源的协同效应，助力索尔思营收和利润大幅提升。", "ctime": 1775557415, "time_str": "18:23:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260407/c675804057.shtml"}, {"id": "4193043", "title": "东山精密：2025年净利润13.29亿元，同比增长22.43%", "content": "东山精密发布业绩快报，2025年度营业总收入401.25亿元，同比增长9.12%；净利润13.29亿元，同比增长22.43%。2025年公司继续稳固传统业务的基本盘，保持了在PCB（含FPC）、精密结构件和光电模组等业务的稳定增长。年内完成了法国GMD公司的收购，进一步拓展了海外布局并夯实了在汽车业务的客户基础。此外，公司战略性地进军光模块（含光芯片）赛道，为公司2026年在AI数据中心相关业务中奠定了坚实的基础。", "ctime": 1775557294, "time_str": "18:21:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260407/c675804017.shtml"}, {"id": "4193039", "title": "香农芯创：预计2026年第一季度净利润11.4亿元-14.8亿元 同比增长6714.72%-8747.18%", "content": "香农芯创公告，预计2026年第一季度归属于上市公司股东的净利润为11.4亿元-14.8亿元，比上年同期的1672.85万元增长6714.72%-8747.18%。扣除非经常性损益后的净利润为11.18亿元-14.58亿元，比上年同期的1485.75万元增长7424.82%-9713.23%。业绩变动主要由于生成式人工智能(AGI)应用需求增长，行业景气度上行，企业级存储产品价格上涨，公司盈利能力提升。公司非经常性损益约2200万元。业绩预告数据未经会计师事务所审计，具体数据将在第一季度报告中详细披露。", "ctime": 1775557258, "time_str": "18:20:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260407/c675804004.shtml"}, {"id": "4193025", "title": "香农芯创：2025年净利润5.44亿元，同比增长106.06%", "content": "香农芯创公告，2025年度实现营业总收入352.51亿元，同比增长45.24%；净利润5.44亿元，同比增长106.06%。报告期内，得益于生成式人工智能（AGI）的蓬勃发展，互联网数据中心（IDC）建设对企业级存储的需求增长，公司电子元器件分销业务及自主品牌“海普存储”的营业收入都有不同程度的增长。“海普存储”已陆续推出包括企业级SSD以及企业级DRAM两大产品线的多款产品，产品已完成部分国内主要的服务器平台的认证和适配工作，正式进入量产阶段，该板块在本报告期首次实现年度盈利。", "ctime": 1775557186, "time_str": "18:19:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260407/c675803980.shtml"}, {"id": "4193019", "title": "中科曙光：第一季度净利润2.25亿元，同比增长20.88%", "content": "中科曙光发布业绩快报，第一季度营业总收入30.72亿元，同比增长18.80%。净利润2.25亿元，同比增长20.88%。主要为公司通过持续优化产品结构、为客户提供多样化、高质量的解决方案，不断提升运营效率，保持经营业绩增长及公司参股子公司的利润增长。", "ctime": 1775557144, "time_str": "18:19:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260407/c675803972.shtml"}, {"id": "4193013", "title": "捷佳伟创：信息披露义务人合计持股比例下降至21.74%", "content": "捷佳伟创公告，信息披露义务人左国军、余仲、梁美珍、蒋泽宇、弘兴远业、恒创汇业、鼎佳汇业及蒋婉同合计持有公司股份7572.96万股，占公司当前总股本3.48亿股的21.74%，占剔除回购专用账户股份后的总股本3.47亿股的21.80%。本次权益变动前，信息披露义务人合计持有公司股份1.13亿股，占当时公司总股本3.48亿股的32.47%。信息披露义务人通过集中竞价、大宗交易和询价转让方式减持公司股份，导致持股比例下降。", "ctime": 1775557070, "time_str": "18:17:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260407/c675803935.shtml"}, {"id": "4193009", "title": "高争民爆：2025年净利润1.98亿元，同比增长33.64% 拟10派1.4元", "content": "高争民爆公告，2025年营业收入18.27亿元，同比增长7.99%。净利润1.98亿元，同比增长33.64%。公司经本次董事会审议通过的利润分配预案为：以2.77亿股为基数，向全体股东每10股派发现金红利1.4元（含税），送红股0股（含税），不以公积金转增股本。", "ctime": 1775557060, "time_str": "18:17:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260407/c675803928.shtml"}, {"id": "4192999", "title": "伊朗称已有218个卫生单位遭袭 24名医护人员死亡", "content": "当地时间7日，伊朗政府发言人穆哈杰拉尼表示，截至目前伊朗已有218个卫生单位遭到袭击，24名医护人员死亡。（央视新闻）", "ctime": 1775556948, "time_str": "18:15:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260407/c675803876.shtml"}, {"id": "4192983", "title": "习近平致电祝贺苏林当选越南国家主席", "content": "习近平致电祝贺苏林当选越南国家主席。（央视新闻）", "ctime": 1775556845, "time_str": "18:14:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260407/c675803823.shtml"}, {"id": "4192981", "title": "新大洲A：大股东子公司质押40.20%股权担保超3亿元债务", "content": "新大洲A公告，大股东大连和升控股子公司沈阳和怡将其持有南京兰埔成新材料有限公司40.20%股权质押给公司，为公司拖欠中国长城资产管理股份有限公司大连市分公司2.23亿元及全资子公司新大洲（浙江）商贸有限公司欠华夏银行宁波分行8013.08万元提供担保，质押期限自《股权质押协议》生效起至债务解决完毕日止。该关联交易已获董事会通过，尚需股东大会批准，关联董事回避表决。", "ctime": 1775556839, "time_str": "18:13:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260407/c675803820.shtml"}, {"id": "4192975", "title": "泽宇智能：拟收购智联新能51%股权 交易作价不高于4.9亿元", "content": "泽宇智能公告，公司与智联新能股东签署了《收购意向协议书》，拟以支付现金方式收购智联新能51%股权。标的公司100%股权整体估值暂定不高于9.6亿元，对应51%股权交易作价暂定不高于4.9亿元。本次交易预计不构成重大资产重组，且不构成关联交易。交易对方承诺，将所获现金价款的一部分用于购买泽宇智能股票，金额不低于交易对价的40%。业绩承诺期为2026年至2028年，累计承诺净利润不低于2.7亿元。", "ctime": 1775556728, "time_str": "18:12:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260407/c675803775.shtml"}, {"id": "4192971", "title": "安路科技：核心技术人员边立剑离职", "content": "安路科技公告，核心技术人员边立剑因个人原因申请辞去所任公司职务，并于近日办理完成离职手续。边立剑与公司签有保密及竞业限制协议，与公司不存在涉及职务发明专利权属纠纷或潜在纠纷的情形，也不影响公司专利权属的完整性。截至本公告披露日，边立剑所负责的工作已完成交接，其离职不会对公司整体研发创新能力、持续经营能力和核心竞争力产生实质性影响。", "ctime": 1775556720, "time_str": "18:12:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260407/c675803770.shtml"}, {"id": "4192969", "title": "信维通信：向特定对象发行股票申请获深交所受理", "content": "信维通信公告，公司于近日收到深圳证券交易所出具的《关于受理深圳市信维通信股份有限公司向特定对象发行股票申请文件的通知》。深交所对公司报送的向特定对象发行股票的申请文件进行了核对，认为申请文件齐备，决定予以受理。公司本次向特定对象发行股票的事宜尚需通过深交所审核，并获得中国证监会同意注册后方可实施，最终能否通过深交所审核并获得中国证监会同意注册的决定及时间仍存在不确定性。", "ctime": 1775556715, "time_str": "18:11:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260407/c675803769.shtml"}, {"id": "4192967", "title": "林泰新材：2025年净利润1.41亿元，同比增长74.22%", "content": "林泰新材公告，2025年营业收入4.2亿元，同比增长34.44%。净利润1.41亿元，同比增长74.22%。公司董事会提出2025年度权益分派预案，每10股派现6元（含税），不送股、不转增。", "ctime": 1775556694, "time_str": "18:11:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260407/c675803755.shtml"}, {"id": "4192965", "title": "云汉芯城：预计2026年第一季度净利润同比增长139.40%–164.60%", "content": "云汉芯城公告，预计2026年第一季度归属于上市公司股东的净利润为4904.41万元–5420.66万元，比上年同期的2048.62万元增长139.40%–164.60%；归属于上市公司股东的扣除非经常性损益后的净利润为4526.91万元–5003.42万元，比上年同期的1691.14万元增长167.68%–195.86%。2026年第一季度，人工智能算力、新能源汽车等领域需求旺盛，带动相关电子元器件需求持续增长，为公司业务发展提供了有利的行业环境。同时，公司持续推进产业互联网平台建设，优化供应链服务能力，提升运营效率与客户体验，线上平台业务、“芯晶采”数智化内采平台业务、互联网+授权代理业务、国产器件销售、海外业务等主要业务领域均呈快速增长态势，共同推动电子元器件销售收入较上年同期实现较大幅度增长。", "ctime": 1775556689, "time_str": "18:11:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260407/c675803753.shtml"}, {"id": "4192961", "title": "英国海事贸易组织：一艘集装箱船在伊朗附近海域被击中", "content": "英国海事贸易组织7日说，一艘集装箱船报告称在伊朗附近海域被一枚不明发射物击中，导致船只受损，船员均安全。该组织说尚未收到任何环境影响报告。（新华社）", "ctime": 1775556666, "time_ // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
