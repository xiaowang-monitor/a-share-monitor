ck_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261006/c680443998.shtml"}, {"id": "5320723", "title": "法国10年期国债收益率下跌7个基点", "content": "法国10年期国债收益率下跌7个基点，报4.793%。法国10年期国债与同期限德国国债的收益率差收窄至135个基点。", "ctime": 1791271186, "time_str": "15:19:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261006/c680443992.shtml"}, {"id": "5320721", "title": "冯德莱恩：将成立工作组以整合能源需求 并委托市场运营商进行联合采购", "content": "欧盟委员会主席冯德莱恩表示，将成立工作组以整合能源需求，并委托市场运营商进行联合采购。（财联社）", "ctime": 1791271154, "time_str": "15:19:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261006/c680443988.shtml"}, {"id": "5320711", "title": "国家发改委：六张网不只是国家的工程 更是民营企业的舞台", "content": "“六张网”建设既是扩内需、稳增长的有力抓手，更为民间投资打开一片新空间。如何把“新空间”变成“真收益”？国家发展改革委民营经济发展局局长李慧：要把新空间变成真收益，还需要从三个方面持续发力。敞开大门，让民营企业“进得去”。我们正在完善民营企业参与重大项目建设长效机制，推进基础设施竞争性领域向经营主体公平开放。不同体量、专长的企业，都能在这张网上找到自己的位置。分类施策，让民营企业“留得住”。“六张网”中，民营企业可参与性并不完全一致，我们将聚焦民营企业对回报机制、竞争秩序等方面主要关切，推出一批经营收益稳定、适合民间资本参与的项目，完善投融资机制，强化要素保障，破除市场准入、标准衔接、信息共享等方面的堵点卡点。解决问题，让民营企业“做得好”。9月10日、29日，我们分两批集中向民间资本公开推介88个项目，随着“六张网”建设铺开，我们将持续开展项目推介工作，建立问题解决机制，加强项目清单化管理，以点带面协调解决民营企业参与项目建设中的具体困难问题。“六张网”编织的，不只是基础设施的骨架，更是中国经济向新而行的底气，也是民营企业转型升级、行稳致远的赛道。我们将强化制度设计、强化服务保障、强化问题解决，推动民营企业在“六张网”建设中大展身手，实现更好发展。（央视新闻）", "ctime": 1791271058, "time_str": "15:17:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261006/c680443986.shtml"}, {"id": "5320617", "title": "法国财政部长表示，欧元兑美元汇率在1.1水平似乎并未被低估", "content": "法国财政部长表示，欧元兑美元汇率在1.1水平似乎并未被低估；欧元走软为出口商提供了喘息空间。（财联社）", "ctime": 1791270643, "time_str": "15:10:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261006/c680443977.shtml"}, {"id": "5320603", "title": "高通回应华为专利协议：否认“韬芯片授权”说法", "content": "华为与高通达成专利许可协议后，市场对协议具体内容的猜测正在增加。10月 lse, "source": "", "url": "https://news.10jqka.com.cn/20261006/c680443760.shtml"}, {"id": "5319099", "title": "就驻日美军涉嫌杀人案 日本那霸市议会全票通过抗议决议", "content": "围绕冲绳当地驻日美军涉嫌杀人一事，日本冲绳县那霸市议会6日全票通过抗议决议和意见书，要求采取切实有效的措施，防止类似事件再次发生。那霸市议员粟国彰表示，发生夺走市民宝贵生命的恶性事件，不仅给遇难者家属带来难以估量的悲痛和遗憾，也让当地民众的愤怒达到了顶点。抗议决议和意见书要求日美两国政府承担责任，向遇难者家属诚恳道歉，提供充分赔偿，并严肃整顿纪律，同时采取切实有效措施，从根本上防止类似事件再次发生。（央视新闻）", "ctime": 1791260026, "time_str": "12:13:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261006/c680443655.shtml"}, {"id": "5319045", "title": "港股午评：恒生指数涨0.78%，恒生科技指数涨0.87%", "content": "港股午间收盘，恒生指数涨0.78%，恒生科技指数涨0.87%。板块方面，数据处理和外包服务、金属包装板块涨幅靠前；可选消费经销Ⅲ、可选消费经销Ⅳ板块跌幅靠前。个股方面，白鸽在线涨14.11%，百奥赛图-B涨9.79%，再鼎医药涨8.34%，亚盛医药涨8.06%，智谱涨8.05%；怡俊集团控股跌15.5%，金川国际跌6.94%，中环新能源跌6.68%，思格新能跌4.93%，景旺电子跌4.49%。", "ctime": 1791259272, "time_str": "12:01:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261006/c680443550.shtml"}, {"id": "5318953", "title": "美港口负责人：期待加强对华合作", "content": "位于美国加利福尼亚州南部的洛杉矶港和长滩港分别是美国第一和第二大集装箱贸易港口。两个港口的负责人日前接受记者采访时表示，美国和中国这两个世界上最大的经济体进一步发展贸易关系至关重要，期待进一步挖掘潜力，加强对华合作。（新华社）", "ctime": 1791257772, "time_str": "11:36:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261006/c680443511.shtml"}, {"id": "5318867", "title": "美军一架“海鹰”直升机在红海上空发出紧急代码", "content": "据飞行数据追踪网站Flightradar24的信息显示，当地时间10月6日凌晨，美国海军一架MH-60R“海鹰”直升机在沙特阿拉伯附近红海上空飞行时宣布紧急状态，并发出7700通用紧急代码。随后这架直升机从公开的飞行追踪系统中消失。目前尚未确认引发紧急状态的原因。追踪数据显示，直升机在宣布紧急状态时，高度约为475英尺（约145米）。随后其显示高度降至零，追踪信号中断。美国海军尚未确认该直升机的状态。据悉，飞行器也可能因为信号覆盖有限或机组人员关闭了应答机而从飞行追踪网站上消失。（央视新闻）", "ctime": 1791256415, "time_str": "11:13:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261006/c680443438.shtml"}, {"id": "5318859", "title": "因降雪、大雾影响 新疆独库公路部分路段实施临时管制", "content": "记者从新疆维吾尔自治区交通运输厅应急指挥与联网收费中心了解到，2026年10月6日8时10分，G217线671公里至772公里（哈希勒根隧道至那拉提公安检查站）路段，因大雾天气，道路不具备安全通行条件；G217线587公里至671公里（巴音沟至哈希勒根隧道出口）路段，因降雪路面结冰，道路不具备安全通行条件。以上路段实行双向交通管制，具体恢复时间待定。（央视新闻）", "ctime": 1791256244, "time_str": "11:10:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261006/c680443431.shtml"}, {"id": "5318847", "title": "韩国综指跌幅扩大至1%", "content": "韩国综指跌幅扩大至1%，现报6933.32点。个股方面，SK海力士跌超2%，三星电子跌超1%。", "ctime": 1791256146, "time_str": "11:09:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261006/c680443425.shtml"}, {"id": "5318843", "title": "中企参与承建的黑山布德瓦绕城公路项目开工", "content": "由中企参与承建的黑山布德瓦绕城公路项目开工仪式5日在黑山沿海城市布德瓦举行。黑山总理斯帕伊奇、中国驻黑山大使陈绪峰等出席仪式。根据合同，项目由来自黑山、中国和波黑的5家企业组成的国际联合体共同实施，中国企业山东高速集团为联合体成员之一。项目包括道路、桥梁、隧道等工程，合同金额约2.37亿欧元，预计建设工期4年。（央视新闻）", "ctime": 1791256079, "time_str": "11:07:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261006/c680443422.shtml"}, {"id": "5318831", "title": "迎返程小高峰 国铁广州局今日计划加开列车702列 涉京广等线路", "content": "记者从国铁广州局获悉，进入国庆中秋假期第六天，国铁广州局迎来客流返程小高峰，当天预计发送旅客283.5万人次，较2025年同期增加61.7万人次，增幅27.8%。据国铁广州局介绍，当前客流以返程流为主，管内客流呈现出由周边中小城市、旅游城市向广州、深圳、长沙等主要城市流动的特点。10月6日，国铁广州局计划开行列车3835列，其中加开列车702列，包括普速旅客列车107列，动车组列车595列，加开的线路主要是京广、杭深、深湛、广深港等，开行方向主要为广州、深圳、长沙、武汉等地。10月7日凌晨计划加开夜间高铁401列，主要开往长沙、潮汕、湛江等方向。（央视新闻）", "ctime": 1791255909, "time_str": "11:05:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261006/c680443408.shtml"}, {"id": "5318803", "title": "金饰克价微跌 周生生克价1247元", "content": "国内黄金饰品价格对比显示，多家黄金珠宝品牌公布的境内足金首饰价格较昨日有所调整，老庙黄金报价1251元/克，较前一日跌4元；周生生报价1247元/克，较前一日跌5元；老凤祥报价1251元/克，较前一日持平。", "ctime": 1791255711, "time_str": "11:01:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261006/c680443389.shtml"}, {"id": "5318773", "title": "现货黄金失守4110美元/盎司", "content": "现货黄金失守4110美元/盎司，日内跌0.76%。", "ctime": 1791254143, "time_str": "10:35:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261006/c680443339.shtml"}, {"id": "5318677", "title": "印尼塞梅鲁火山喷发", "content": "据印尼火山地质减灾中心消息，当地时间6日5时29分，位于东爪哇省的塞梅鲁火山发生喷发，喷发柱高度约900米。此次喷发持续135秒，火山灰呈灰色、浓密，向东北方向扩散。今年以来，塞梅鲁火山活动频繁。印尼火山监测系统数据显示，截至10月6日，塞梅鲁今年已记录1922次喷发，是印尼今年喷发次数最多的火山。同期，印尼全国共记录4946次火山喷发。目前，塞梅鲁火山维持三级警戒级别。有关部门提醒民众不要在火山口及峰顶周边5公里范围内活动。（央视新闻）", "ctime": 1791251923, "time_str": "09:58:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261006/c680443201.shtml"}, {"id": "5318663", "title": "长三角铁路迎来节中返程客流高峰 6日预计发送旅客390万人次", "content": "记者从中国铁路上海局集团有限公司（以下简称“上铁集团”）获悉，10月6日是国庆假期第六天，长三角铁路迎来节中返程客流高峰，当天预计发送旅客390万人次。午后起，上海、南京、杭州、合肥、宁波、南通、盐城、扬州多地火车站将迎节中返程集中客流。10月5日，上铁集团发送旅客384.1万人次。自9月23日中秋国庆假期运输启动以来，截至10月5日，长三角铁路累计发送旅客4483万人次，日均发送约344.8万人次。（央视新闻）", "ctime": 1791251603, "time_str": "09:53:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261006/c680443184.shtml"}, {"id": "5318641", "title": "智谱港股涨超8%", "content": "智谱港股涨8.27%，报719.00港元。消息面上，据《科创板日报》报道，GLM-5.3上架Amazon，智谱打开海外收入分成通道。", "ctime": 1791251394, "time_str": "09:49:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261006/c680443178.shtml"}, {"id": "5318635", "title": "尼加拉瓜宣布退出中美洲议会", "content": "尼加拉瓜联合总统罗萨里奥·穆里略5日表示，尼方决定退出中美洲议会。穆里略当天在首都马那瓜的电视讲话中说，尼方已于3日正式向中美洲议会领导机构发出相关通知。她表示，尼方认为该组织“未能履行其既定目标和职能，也未能为整个地区各国家庭带来应有福祉”。中美洲议会4日曾发表声明，回应尼方可能退出该组织的消息。声明说，该机构正评估尼方有关通报可能产生的影响，并将开展相应的法律、政治和外交评估。（新华社）", "ctime": 1791251184, "time_str": "09:46:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261006/c680443168.shtml"}, {"id": "5318619", "title": "GLM-5.3上架Amazon 智谱打开海外收入分成通道", "content": "今日，亚马逊云科技（AWS）旗下大模型服务平台Amazon Bedrock官宣接入智谱GLM-5.3，AWS基于模型调用量与智谱进行收入分成。据了解，除了AWS外，智谱近期与多家海外云厂商落地收入分成模式。此前智谱透露计划通过海外云平台收入分成增加一条具有规模潜力的商业路径。国内方面，智谱也已与阿里云百炼平台等头部云厂商签署类似分成协议，华为云已上架GLM-5.3，并就类似合作达成意向，形成贯通国内外的分成体系。 （科创板日报）", "ctime": 1791250307, "time_str": "09:31:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261006/c680443129.shtml"}, {"id": "5318583", "title": "港股开盘：恒生指数涨1.0%，恒生科技指数涨1.02%", "content": "港股开盘，恒生指数涨1.0%，恒生科技指数涨1.02%。个股方面，齐云山食品涨9.94%，亚盛医药涨6.85%，巨子生物涨6.66%，嘉耀控股涨4.98%，小菜园涨4.73%。", "ctime": 1791249686, "time_str": "09:21:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261006/c680443109.shtml"}, {"id": "5318511", "title": "车市进入全年销售关键期，今年能否再现“金九银十”？", "content": "为抓住“金九银十”市场窗口期，车企集中加速新车上市步伐。据不完全统计，9月份以来，全新、换代、改款的上市新车超过50款，从6万元的代步小车到50万元的旗舰车型全线覆盖。一些汽车经销商向记者表示，本轮密集上新有效拉动线下门店到店客流，为旺季成交打下客流基础。（央视新闻）", "ctime": 1791248536, "time_str": "09:02:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261006/c680443050.shtml"}, {"id": "5318481", "title": "富时中国A50指数期货盘初涨0.38%", "content": "富时中国A50指数期货在上一交易日夜盘收涨0.42%的基础上低开，盘初涨0.38%。", "ctime": 1791248451, "time_str": "09:00:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261006/c680443044.shtml"}, {"id": "5318449", "title": "最新筹码大幅变动股名单出炉", "content": "约有650只个股公布了9月20日股东户数，与上期（9月10日）相比，股东户数下降的有346股，其中股东户数降幅超10%的有13股；股东户数增长超10%的也有13股。相比之前各期，有近60只个股股东户数连续减少3期以上，股东户数最多已连降19期。也就是说筹码呈持续集中趋势。从机构动向看，股东户数连降股中，近一个月获机构调研的有9只，机构调研次数较为频繁的有中航西飞、欧普康视等，其间分别获机构调研4次、3次；从机构调研家数看，机构较为扎堆的是崇达技术、中航西飞，均有不低于30家机构参与调研。（人民财讯）", "ctime": 1791248287, "time_str": "08:58:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261006/c680443041.shtml"}, {"id": "5318439", "title": "中方驳斥部分西方国家：无权对中国人权说三道四", "content": "当地时间10月5日，中国常驻联合国副代表孙磊在联大三委一般性辩论中针对西方国家进行答辩发言，奉劝少数国家停止编造散布涉华谎言，停止借人权问题搞政治操弄。孙磊表示，英国、澳大利亚、日本、爱尔兰、捷克、立陶宛代表在发言中无端指责、恶意诋毁中国人权状况，中方表示强烈不满和坚决反对。（央视新闻）", "ctime": 1791248114, "time_str": "08:55:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261006/c680443037.shtml"}, {"id": "5318421", "title": "欧元兑美元跌至17个月低点", "content": "受法国财政压力与政治不确定性带来的市场担忧拖累，欧元5日明显走弱，一度下探至1欧元兑1.1161美元，创下2025年5月以来的最低水平。此前，欧元已经连续4周收跌。近期法国国债市场明显承压。数据显示，上周法国10年期国债收益率与同期德国国债收益率的利差一度突破150个基点，为2011年底以来首次。市场担心，法国债务水平以及明年法国总统选举前可能出现的政治僵局可能加大欧元区财政风险。美国方面5日消息称，法国债务总量不断攀升，偿债成本抬升，且财政基本面疲弱，目前已经成为欧洲债市困境的“典型样本”。与此同时，避险资金流向、叠加美债收益率维持高位，共同对美元形成支撑。5日，衡量美元对六种主要货币汇率的美元指数一度上涨0.47%，触及102.37。不过疲弱的美国就业数据拉低了市场对美联储近期加息的预期，在一定程度上限制了美元涨势。（央视新闻）", "ctime": 1791247761, "time_str": "08:49:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261006/c680443022.shtml"}, {"id": "5318359", "title": "我国海水淡化日处理能力突破300万吨", "content": "记者从自然资源部了解到，截至目前，我国海水淡化总规模已达到每日307.7万吨。目前，全国已建海水淡化工程总规模为307.7万吨/日，据不完全统计，拟建和在建总规模超过100万吨/日。今年7月，国家发展改革委、自然资源部、水利部联合发布《海水淡化产业发展行动方案》，促进海水淡化规模化利用，力争到2030年，全国海水淡化工程总规模将达到450万吨/日，新增海水淡化工程规模150万吨/日以上。（央视新闻）", "ctime": 1791245967, "time_str": "08:19:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261006/c680442894.shtml"}, {"id": "5318309", "title": "日韩股市集体高开", "content": "日经225指数高开0.01%，报69954.61点。韩国综指高开0.58%，报7044.67点。", "ctime": 1791245051, "time_str": "08:04:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261006/c680442773.shtml"}, {"id": "5318303", "title": "英国海上贸易行动办公室：连日来多艘船只在霍尔木兹海峡遭袭", "content": "根据英国海上贸易行动办公室5日发布的多份通报，连日来，有4艘船只在霍尔木兹海峡遭袭，另有1艘油轮被伊朗伊斯兰革命卫队劝返。（央视新闻）", "ctime": 1791244923, "time_str": "08:02:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261006/c680442756.shtml"}, {"id": "5318291", "title": "联合国呼吁也门冲突各方保持克制", "content": "当地时间5日，联合国秘书长副发言人法尔汉·哈克表示，联合国秘书长古特雷斯对也门局势急剧升级深感关切，敦促冲突各方保持最大限度克制，并强调各方必须遵守国际人道法，保护平民和民用基础设施。古特雷斯同时呼吁有关各方继续同联合国也门问题特使开展建设性接触，通过谈判寻求包容性的政治解决方案。（央视新闻）", "ctime": 1791244751, "time_str": "07:59:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261006/c680442692.shtml"}, {"id": "5318279", "title": "加拿大将调查医疗飞机失事 机上6人恐全部遇难", "content": "加拿大交通安全委员会5日宣布将主持调查3日在美国马萨诸塞州楠塔基特岛海岸附近发生的医疗救护飞机失事事件。机上6人或已全部遇难。该委员会当天发布声明称，失事飞机为湾流G100型飞机，隶属于一家名为“纬度医疗航空”的公司。此前，这家总部位于加拿大安大略省的公司宣布，机上6人，包括4名加拿大籍机组人员、1名患者及1名随行陪护人员，在坠机后均被推定已遇难。声明称，失事飞机从百慕大起飞，在接近美国波士顿地区时，机组人员报告遇到电力故障。随后，飞机快速下降并在楠塔基特以南与空中交通管制失联。根据国际协议，调查应由飞机登记国（即加拿大）主持，美国相关机构将提供协助。（新华社）", "ctime": 1791244573, "time_str": "07:56:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261006/c680442686.shtml"}, {"id": "5318259", "title": "Lucid继续执行库存削减计划 第三季度交付3806辆汽车", "content": "美国电动汽车制造商Lucid Group, Inc.（NASDAQ: LCID）公布截至2026年9月30日第三季度的产量和交付数据。该公司第三季度生产2954辆汽车，交付3806辆汽车。交付量超过产量，公司继续执行计划中的库存削减，将现有车辆库存转化为客户交付，这是此前宣布的2026年1.4亿美元现金流改善运营重置计划的一部分。（财联社）", "ctime": 1791244099, "time_str": "07:48:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261006/c680442671.shtml"}, {"id": "5318217", "title": "古特雷斯呼吁加沙地带永久停火", "content": "新一轮巴以冲突爆发三周年之际，联合国秘书长古特雷斯5日发表致辞，呼吁加沙地带永久停火。 古特雷斯在致辞中说，2023年10月7日巴勒斯坦伊斯兰抵抗运动（哈马斯）和其他巴勒斯坦武装团体袭击以色列，以色列随即发动加沙战争，给加沙地带的巴勒斯坦人带来难以形容的苦难。去年加沙停火协议对局势稍有缓解，但仍未带来安全、充足的人道援助以及通往重建与和平的可靠路径。 古特雷斯敦促各方落实停火承诺并向下一阶段停火迈进。他说，必须建立实现整个地区持久和平的政治路径。(新华社)", "ctime": 1791242886, "ti const SECTORS  = [{"name": "金融", "hit_count": 57, "etfs": []}, {"name": "人工智能", "hit_count": 38, "etfs": []}, {"name": "消费", "hit_count": 25, "etfs": []}, {"name": "半导体", "hit_count": 25, "etfs": []}, {"name": "数据要素", "hit_count": 25, "etfs": []}, {"name": "地产", "hit_count": 12, "etfs": []}, {"name": "医药", "hit_count": 11, "etfs": []}, {"name": "军工", "hit_count": 10, "etfs": []}];
const META     = {"update_time": "2026-10-06 15:44:33", "sentiment_score": 60.256410256410255, "agents": []};

// 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
