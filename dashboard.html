ttps://news.10jqka.com.cn/20260612/c677420547.shtml"}, {"id": "4520543", "title": "韩国混凝土配送停运 三星与SK海力士芯片厂建设受影响", "content": "韩国全国预拌混凝土运输工人联合会从周一开始暂停首尔都市圈的混凝土运输。该联合会称，此次罢工将涉及约8000名成员，他们要求提高运输费率并做出其他调整。参与罢工的工会成员周四还封锁了平泽两家混凝土厂的混凝土供应，导致三星电子芯片工厂的混凝土浇筑工程暂停。据业内人士消息称，由于混凝土供应被取消，SK海力士龙仁芯片工厂的混凝土浇筑工程也已暂停。SK海力士在一份声明中表示，由于公司已调整施工顺序，预计短期影响有限。三星拒绝置评。(蓝鲸新闻)", "ctime": 1781250571, "time_str": "15:49:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260612/c677420486.shtml"}, {"id": "4520535", "title": "尼泊尔外长希西尔将访华 外交部介绍情况", "content": "6月12日，外交部发言人林剑主持例行记者会。有记者就尼泊尔外长希西尔访华提问。林剑表示，中方高度重视中尼关系，愿以此访为契机，同尼泊尔新政府一道努力，增进政治互信，深化务实合作，高质量共建“一带一路”，推动中尼战略合作伙伴关系进一步向前发展。（央视新闻）", "ctime": 1781250482, "time_str": "15:48:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260612/c677420442.shtml"}, {"id": "4520531", "title": "潞安环能：5月商品煤销量416万吨，同比增2.46%", "content": "潞安环能公告，2026年5月原煤产量458万吨，累计2389万吨；商品煤销量416万吨，累计2120万吨。同比2025年5月，原煤产量下降0.65%，累计增长3.29%；商品煤销量增长2.46%，累计增长3.72%。", "ctime": 1781250388, "time_str": "15:46:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260612/c677420379.shtml"}, {"id": "4520527", "title": "恒力石化：拟以4.15亿元购买关联方房产", "content": "恒力石化公告，拟以自有资金购买上海恒力智慧建设有限公司持有的位于上海市闵行区申昆路568弄恒力（上海）新港国际中心8幢15号（临）的房产，交易价格为4.15亿元（含增值税）。本次交易构成关联交易，但不构成重大资产重组。交易已经公司董事会审议通过，关联董事已回避表决。交易尚需办理产权登记手续，存在不确定性。", "ctime": 1781250339, "time_str": "15:45:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260612/c677420353.shtml"}, {"id": "4520525", "title": "兴业银锡：全资子公司终止股份转让协议", "content": "兴业银锡公告，公司全资子公司山南锑金终止与领亿新材、温萍的《股份转让协议》。该协议旨在山南锑金收购威领股份2023.38万股，占总股本7.7646%。终止原因是威领股份2025年度财务报表被出具保留意见审计报告，并被深圳证券交易所实施退市风险警示和其他风险警示，导致股份交割条件未满足。", "ctime": 1781250331, "time_str": "15:45:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260612/c677420336.shtml"}, {"id": "4520505", "title": "莱美药业：控股子公司获两项医疗器械注册证", "content": "莱美药业公告，公司控股子公司海南莱美医疗器械有限公司近日收到海南省药品监督管理局颁发的两项《医疗器械注册证》，分别为麻醉视频喉镜（注册证编号：琼械注准20262080059，有效期至2031年6月2日）和一次性使用喉镜片（注册证编号：琼械注准20262080060，有效期至2031年6月2日）。上述产品可配合用于气道插管，将丰富公司医疗器械产品种类，提升综合竞争力。", "ctime": 1781250143, "time_str": "15:42:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260612/c677420210.shtml"}, {"id": "4520493", "title": "AI需求旺盛 机械硬盘价格续五个季度上涨", "content": "据报道，AI需求旺盛，机械硬盘（HDD）厂商优先保障数据中心订单，导致消费级HDD供货紧张，价格连续五个季度上涨，且涨幅明显扩大。目前HDD厂商与客户按季度进行价格谈判。最新敲定的2026年第二季度（4-6月）标杆产品合约价，较一季度（1-3月）上涨10%。此前HDD季度涨幅仅1%-4%，本季增幅显著扩大。报道还称，AI热潮下，厂商增产数据中心专用的大容量“近线硬盘（Nearline HDD）”，二季度该类产品合约价也环比上涨约10%。据厂商透露，近线硬盘约60%销量由谷歌、亚马逊等美国云巨头包揽，占比逐年提升，即便如此，“美国大厂仍无法拿到足额货源”。 (科创板日报)", "ctime": 1781249932, "time_str": "15:38:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260612/c677420068.shtml"}, {"id": "4520487", "title": "上海证监局副局长：科创板ETF规模约2400亿元，“耐心资本”力量不断增强", "content": "上海市政府举行市政府新闻发布会，介绍2026陆家嘴论坛有关情况。中国证监会上海证监局副局长赵国富在发布会上表示，进一步深化科创板改革的“1+6”政策措施，即在科创板设置科创成长层、重启未盈利企业适用科创板第五套标准上市等政策，是增强资本市场制度包容性适应性、更好服务科技创新和新质生产力发展的重要改革举措。赵国富表示：“一年来，科创板ETF新增上市37只，累计达120多只、总规模约2400亿元，其中各类中长期资金持有规模近一半，‘耐心资本’力量不断增强。”（澎湃新闻）", "ctime": 1781249874, "time_str": "15:37:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260612/c677420036.shtml"}, {"id": "4520467", "title": "伊朗媒体：伊朗或将马斯克旗下企业纳入军事目标清单", "content": "据伊朗法尔斯通讯社11日报道，伊朗方面正在评估将与美国企业家马斯克旗下企业相关的部分资产和基础设施纳入潜在军事目标清单，理由是美国和以色列军方曾使用由马斯克相关企业运营的通信基础设施。报道称，位于以色列、卡塔尔、约旦、阿联酋和阿曼等地区国家的部分“星链”地面设施，以及与太空探索技术公司投资方相关的部分基础设施，被伊朗方面列为正在评估的目标。 (央视财经)", "ctime": 1781249734, "time_str": "15:35:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260612/c677419872.shtml"}, {"id": "4520461", "title": "字节跳动成立科技公司，注册资本16亿元", "content": "企查查APP显示，近日，北京云瑞长石科技有限公司成立，法定代表人为蔡强，注册资本为16亿元，经营范围包含：信息技术咨询服务；非居住房地产租赁；物业管理等。企查查股权穿透显示，该公司由字节跳动关联公司北京字跳网络技术有限公司全资持股。", "ctime": 1781249650, "time_str": "15:34:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260612/c677419793.shtml"}, {"id": "4520451", "title": "现货黄金失守4170美元/盎司", "content": "现货黄金失守4170美元/盎司，日内跌1.01%。", "ctime": 1781249608, "time_str": "15:33:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260612/c677419692.shtml"}, {"id": "4520447", "title": "中国西电：中标国家电网特高压项目，金额18.99亿元", "content": "中国西电公告，2026年6月12日，国家电网有限公司电子商务平台发布特高压项目第二次设备公开招标采购中标公告，公司下属6家子公司为相关中标人，中标变压器、组合电器、断路器、电容器、互感器、避雷器等产品，总中标金额为18.99亿元。", "ctime": 1781249596, "time_str": "15:33:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260612/c677419676.shtml"}, {"id": "4520443", "title": "宝丰能源：拟收购宁夏天普芯科技有限公司蒸汽综合管线项目所涉及的资产组，交易金额4.5亿元（含税）", "content": "宝丰能源公告，公司拟收购宁夏天普芯科技有限公司（曾用名：宁夏宝丰昱能科技有限公司）蒸汽综合管线项目所涉及的资产组，交易金额4.5亿元（含税）。本次交易构成关联交易，但不构成重大资产重组。截至本公告披露日，过去12个月与同一实际控制人及其控制的企业和其他组织发生的关联交易，除关联捐赠6.8亿元外，其他均为日常关联交易。", "ctime": 1781249578, "time_str": "15:32:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260612/c677419670.shtml"}, {"id": "4520409", "title": "国家金融监督管理总局答记者提问：将持续研究优化支持政策 助力上海国际金融中心进一步增强竞争力和影响力", "content": "上海就2026年陆家嘴论坛有关情况召开新闻发布会。国家金融监督管理总局办公厅副主任鄢姣在答记者提问时表示，去年发布的《关于支持上海国际金融中心建设行动方案》各项措施正稳步推进，工作成效正逐步显现。做优做强金融服务功能方面，着力优化金融生态筑巢引凤，支持外资金融机构在上海国际金融中心建设中发挥更大作用，批准友邦保险资管、荷全保险资管在沪开业。上海国际再保险登记交易中心建设提速，集聚再保险运营中心等各类机构26家，首批6家境外机构交易席位顺利入驻。鄢姣表示，下一步，金融监管总局将立足职能定位，持续研究优化支持政策，助力上海国际金融中心进一步增强竞争力和影响力。（证券时报）", "ctime": 1781249401, "time_str": "15:30:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260612/c677419555.shtml"}, {"id": "4520405", "title": "现货白银失守66美元/盎司", "content": "现货白银失守66美元/盎司，日内跌1.96%。", "ctime": 1781249328, "time_str": "15:28:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260612/c677419524.shtml"}, {"id": "4520395", "title": "“词元（Token）云服务提质赋能评估计划” 正式启动", "content": "中国信息通信研究院以“可信词元（Token）云服务”为主题，于2026年6月10日组织开展了研讨会。中国工程院院士郑纬民、中国信通院总工程师何宝宏、中国信通院云计算与数字化研究所副所长（主持工作）栗蔚出席并发言。会上，中国信通院联合天翼云、阿里云、华为云、京东云、联想、阶跃星辰、金山办公、清程极智等十余家企业，发起了“词元（Token）云服务提质赋能评估计划”并发布多项成果。（中国信通院）", "ctime": 1781249291, "time_str": "15:28:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260612/c677419493.shtml"}, {"id": "4520383", "title": "钉钉换帅下一步，要打通MuleRun", "content": "曾高调回归钉钉的陈航，在时隔437天后，又离场了。而他的继任者，是一位1992年出生的技术极客-陈宇森。6月11日，在两篇离职长文掀起舆论风暴之后，阿里巴巴一纸内部公告，给这件事做出了最终定论，陈航正式卸任CEO，陈宇森接棒，他也成为了阿里体系内最年轻的事业部负责人。两个不同的人，代表了两个不同的时代风格。一个是奉行移动互联网时代“高压出奇迹”的管理哲学，一个则是AI时代的Agent驱动的思想代表。陈宇森接棒陈航，其实还是阿里AI棋局的一次关键变革。（21世纪经济报道）", "ctime": 1781249126, "time_str": "15:25:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260612/c677419398.shtml"}, {"id": "4520381", "title": "赵国富：证监会将全面推进实施新一轮资本市场改革开放 进一步发挥科创板改革“试验田”作用", "content": "中国证监会上海监管局副局长赵国富在6月12日举行的上海市新闻发布会上表示，今年是“十五五”开局之年。证监会将会同各方深入贯彻落实国家“十五五”规划纲要的部署要求，以深化资本市场投融资综合改革为牵引，全面推进实施新一轮资本市场改革开放，进一步发挥科创板改革“试验田”作用，持续增强我国资本市场制度的包容性、适应性和吸引力、竞争力，优化对科技型企业的全链条全生命周期金融服务，更好助力金融强国和中国式现代化建设。", "ctime": 1781249091, "time_str": "15:24:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260612/c677419390.shtml"}, {"id": "4520375", "title": "外交部：坚决反对美非法单边制裁，将维护中企和公民权益", "content": "6月12日，外交部发言人林剑主持例行记者会。有外媒记者提问，本周早些时候，美国财政部宣布制裁9家中国和中国香港的个人及实体，理由是协助伊朗购买军事用品。请问外交部对此有何回应？对此，林剑表示：“我们多次说过，中方坚决反对没有国际法依据、未经联合国安理会授权的非法单边制裁。我们将采取一切必要措施，坚定维护本国企业和公民的正当权益。”（澎湃新闻）", "ctime": 1781249030, "time_str": "15:23:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260612/c677419340.shtml"}, {"id": "4520371", "title": "外交部：特奥多罗作秀表演最终损害菲律宾整个国家和人民利益", "content": "6月12日，外交部发言人林剑主持例行记者会。有记者问，菲律宾国防部长特奥多罗今天早上发布了一份声明，表示他将继续履行自己的职责。对此特定声明，外交部是否作出回应？\n\n发言人林剑表示，我们注意到了特奥多罗仍在颠倒黑白、攻击抹黑，他的这些言行不是他所标榜的所谓维护本国尊严，而是捞取政治私利的作秀表演，正是他这样一小撮人不负责任的肆意妄为，才会导致中菲的争议激化、两国关系恶化，并最终损害菲律宾整个国家和人民的利益。(央视新闻)", "ctime": 1781248906, "time_str": "15:21:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260612/c677419288.shtml"}, {"id": "4520357", "title": "周小全：重点推进跨境金融提质增效与离岸金融创新突破", "content": "6月12日，上海市政府举行市政府新闻发布会，邀请上海市委金融办、中国人民银行上海总部、国家金融监督管理总局办公厅、中国证监会上海证监局等相关负责同志出席，介绍2026陆家嘴论坛有关情况。上海市委金融办常务副主任周小全表示，下一步，将持续强化上海金融开放枢纽门户功能，重点推进跨境金融提质增效与离岸金融创新突破，更好服务企业“走出去”和共建“一带一路”。（澎湃新闻）", "ctime": 1781248836, "time_str": "15:20:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260612/c677419243.shtml"}, {"id": "4520345", "title": "现货白银跌超2%", "content": "现货白银跌超2%，现报66.13美元/盎司。", "ctime": 1781248775, "time_str": "15:19:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260612/c677419139.shtml"}, {"id": "4520333", "title": "科创板改革“1+6”政策措施发布以来 科创板IPO新增受理59家", "content": "中国证监会上海监管局副局长赵国富在6月12日举行的上海市新闻发布会上表示，一年来，中国证监会会同各方深入落实科创板改革“1+6”政策措施，推动相关创新制度和示范性案例渐次落地，改革效应逐步显现。政策发布一年来，科创板IPO新增受理59家，同比大幅增长，其中未盈利企业24家，数量占比超4成。稳步重启未盈利企业适用第五套标准上市，目前已新增受理9家。发布商业火箭企业适用指引，扩大第五套标准覆盖面。", "ctime": 1781248685, "time_str": "15:18:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260612/c677419094.shtml"}, {"id": "4520319", "title": "2025年我国经济增长新增用电首次全部由绿电支撑", "content": "今天（12日）发布的《中国可再生能源发展报告》显示，2025年我国可再生能源新增装机再创历史新高，在全球新增装机占比超过60%。预计2026年我国风电、光伏新增装机约3亿千瓦左右，可再生能源将继续成为我国能源绿色低碳转型的主力。数据显示，2025年全国可再生能源发电装机容量突破23.37亿千瓦，新增可再生能源发电装机占全国新增电力装机的82.7%，分布式光伏新增装机连续两年过亿千瓦，新能源就近就地消纳利用水平进一步提升。2025年，全年可再生能源发电量约4万亿千瓦时，风电光伏发电量均迈上“万亿千瓦时”量级，在全国总发电量中的占比双双突破10%。（央视新闻）", "ctime": 1781248586, "time_str": "15:16:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260612/c677419060.shtml"}, {"id": "4520307", "title": "塞尔维亚总统武契奇表示计划辞职", "content": "塞尔维亚总统武契奇日前接受采访时说，他计划辞去总统一职，总统选举将在未来3至4个月进行。武契奇说，“我正在计划辞职。我会通知大家，不会让任何人感到意外”。他同时透露，他已经开始整理并打包存放在总统府里的图书。武契奇还说，当下正在考虑新的总统候选人。武契奇2017年4月当选总统，2022年5月连任。根据塞尔维亚宪法，总统任期5年，可连任一次。（央视新闻）", "ctime": 1781248511, "time_str": "15:15:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260612/c677418993.shtml"}, {"id": "4520305", "title": "尼泊尔外交部长希西尔将访华", "content": "外交部发言人宣布：应中共中央政治局委员、外交部长王毅邀请，尼泊尔外交部长希西尔将于6月14日至17日访问中国。（新华社）", "ctime": 1781248460, "time_str": "15:14:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260612/c677418939.shtml"}, {"id": "4520295", "title": "央行上海总部：进一步扩大自由贸易账户功能试点企业覆盖面", "content": "6月12日，上海市政府举行市政府新闻发布会，邀请上海市委金融办、中国人民银行上海总部、国家金融监督管理总局办公厅、中国证监会上海证监局等相关负责同志出席，介绍2026陆家嘴论坛有关情况。中国人民银行上海总部副主任陈继明表示，下一步，人民银行上海总部将继续按照总行统一部署，持续推进自贸区金改，提升跨境贸易投资便利化水平：一是进一步扩大自由贸易账户功能试点企业覆盖面，让更多优质企业享受政策红利；二是推进临港新片区离岸贸易金融服务综合改革试点业务扩围，覆盖更多元的离岸贸易场景；三是配合推进离岸金融制度框架探索，为上海稳步发展离岸金融积累经验、探路先行。（澎湃新闻）", "ctime": 1781248329, "time_str": "15:12:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260612/c677418878.shtml"}, {"id": "4520291", "title": "机构：第一季全球前十大晶圆代工营收季增3.7%至479.5亿美元", "content": "根据TrendForce集邦咨询最新晶圆代工产业研究，除了AI HPC与相关周边订单仍如火如荼出货外，第一季基于TV、PC/NB等供应链提前生产出货、并提高周边IC库存水位措施，晶圆代工厂商陆续接获客户提前生产或加单订单。尽管仍受智能手机生产淡季影响，但淡季因素基本与供应链提前拉货所相抵，整体营运表现淡季不淡，第一季全球前十大晶圆代工产值季增3.7%至479.5亿美元，再创新高。\n展望第二季，TV、PC/NB ODM与品牌等提前备货红利将再延续约一季，加上智能手机陆续进入新机备货周期，晶圆代工厂商基于产能利用率回升，陆续向客户表达下半年晶圆代工价格将调涨的意愿，将带动部分制程晶圆代工价格触底反弹，也进一步刺激客户提前备货动机。同时，AI相关先进制程与Power产品需求成长动能优于预期，也带动产业订单外溢与产能排挤效应。TrendForce集邦咨询预估，全球前十大晶圆代工第二季产值将再创高峰，且季增幅较前季明显加速。", "ctime": 1781248271, "time_str": "15:11:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260612/c677418855.shtml"}, {"id": "4520247", "title": "AI辅助一次能筛查70多种疾病", "content": "看病排队难、误诊、手术靠经验——这些难题，正在被人工智能辅助系统逐一破解。记者在走访时发现，从心内科智能问诊，到放射科一扫多查，再到手术室AI导航，AI辅助系统已经在上海多家医院推广应用。同一家医院的放射科，一张CT不再只看一个问题。借助AI系统，医生点击一次，就能同步筛查70多种疾病，自动生成报告，还能与历史影像逐层比对。手术刀差一毫米，可能就是两种结果。上海交通大学医学院附属瑞金医院肝外科引入AI导航后，血管走向、肿瘤位置三维呈现，原本靠经验临场判断的关键步骤，如今在开刀前就已规划完成。（央视财经）", "ctime": 1781248000, "time_str": "15:06:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260612/c677418709.shtml"}, {"id": "4520201", "title": "ETF两市成交额报4583.26亿元，较昨日此时放量915.92亿元", "content": "截至目前，ETF两市成交额报4583.26亿元，较昨日此时放量915.92亿元，分类型来看，股票型ETF成交额1568.74亿元，债券型ETF成交额1683.7亿元，货币型ETF成交额338.25亿元，商品型ETF成交额89.73亿元，QDII型ETF成交额902.84亿元。", "ctime": 1781247852, "time_str": "15:04:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260612/c677418605.shtml"}, {"id": "4520191", "title": "欧洲主要股指开盘集体上涨", "content": "欧洲主要股指开盘集体上涨，欧洲斯托克50指数涨1.49%，英国富时100指数涨0.69%，法国CAC40指数涨1.35%，德国DAX指数涨1.45%。", "ctime": 1781247799, "time_str": "15:03:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260612/c677418504.shtml"}, {"id": "4520187", "title": "期货收评：第七轮提涨来袭 焦炭大涨近4%！碳酸锂突破17.5万元关口", "content": "期货收评：截止收盘，国内期货主力合 // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
