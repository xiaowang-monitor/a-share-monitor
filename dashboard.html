_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260612/c677417246.shtml"}, {"id": "4519447", "title": "上期所原油主力合约大跌6% 低硫燃油主力合约大跌5%", "content": "上期所原油主力合约大跌6%，报550.7元/桶；低硫燃油主力合约大跌5%，报4488元/吨。", "ctime": 1781242911, "time_str": "13:41:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260612/c677417105.shtml"}, {"id": "4519441", "title": "中外科学家破解两类主流系外行星演化之谜", "content": "近日，中外科学家基于国家重大科技基础设施郭守敬望远镜（LAMOST）观测的大样本数据，并结合国外其他卫星和望远镜观测数据，发现“超级地球”与“迷你海王星”在轨道偏心率与周期关系上遵循不同的规律，并从动力学上揭示了这两类相近的行星族群经历了不同的演化路径。这项成果加深了科学界对行星系统多样性的认识，也为人类完整认知系外行星的形成与演化拼出了更清晰的全景。相关成果6月12日在国际学术期刊《科学》发表。（央视新闻）", "ctime": 1781242818, "time_str": "13:40:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260612/c677417093.shtml"}, {"id": "4519405", "title": "共封装光学(CPO)板块短线走低", "content": "共封装光学(CPO)板块短线走低，风华高科跌停，利和兴、国瓷材料、联特科技、三安光电、华盛昌等跟跌。", "ctime": 1781242582, "time_str": "13:36:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260612/c677417030.shtml"}, {"id": "4519391", "title": "鑫宏业成立能源光电新公司", "content": "企查查APP显示，近日，江苏鑫宏业能源光电有限公司成立，经营范围包含：太阳能发电技术服务；光伏设备及元器件制造；光伏设备及元器件销售等。企查查股权穿透显示，该公司由鑫宏业全资持股。（人民财讯）", "ctime": 1781242408, "time_str": "13:33:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260612/c677416991.shtml"}, {"id": "4519361", "title": "影子市场交易预示SpaceX股票或涨超35%", "content": "影子市场预示SpaceX股票上市表现强劲，股价或将至少上涨35%。该公司是埃隆·马斯克的火箭、卫星和人工智能业务。在线经纪商IG国际提供的衍生品周五上午指向市值2.4万亿美元，这意味着较首次公开招股(IPO)时每股135美元的价格和1.77万亿美元的估值高出35%以上。SpaceX相关的永续期货合约，在加密货币交易平台Hyperliquid上交易价格约为174美元，这意味着其市值超过2.2万亿美元。过去24小时内，这种产品的交易额超过1.43亿美元，目前未平仓合约超过2.08亿美元。（新浪财经）", "ctime": 1781242018, "time_str": "13:26:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260612/c677416898.shtml"}, {"id": "4519319", "title": "研究显示全球变暖主因是人类活动", "content": "一个国际团队的最新研究数据显示，2025年全球平均气温较工业化前水平高出1.39摄氏度，而其中1.37摄氏度是由人类活动导致的。 法国国家科学研究中心等机构的研究人员11日在《地球系统科学数据》杂志上发表论文介绍，2025年是有记录以来第三热的年份，全球平均气温较1850年至1900年的平均值高出1.39摄氏度，其中人类活动导致的全球变暖幅度为1.37摄氏度，气候系统的自然波动对全球变暖的影响有限。 研究还显示，人类活动导致的全球变暖速度仍处于历史最高水平，约为每10年0.27摄氏度。这主要由大气中温室气体排放达到创纪录水平所致。按照目前的二氧化碳排放水平，人类活动导致的全球变暖幅度预计将在2030年前后突破1.5摄氏度。 研究人员表示，这些气候指标表明，人类活动导致的气候变化正以创纪录的速度持续进行，当前急需加强脱碳努力，以减少气候变化对健康、粮食安全、社会经济和生物多样性等的影响。 在分析全球温度数据时，不同机构会使用不同的方法和模型，但均显示出相同的持续变暖趋势。世界气象组织此前对多个数据集的综合分析结果显示，2025年全球平均气温较工业化前水平高出1.44摄氏度。(新华社)", "ctime": 1781241662, "time_str": "13:21:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260612/c677416821.shtml"}, {"id": "4519315", "title": "零售板块拉升，中百集团直线涨停", "content": "零售板块拉升，中百集团直线涨停，爱施德、国光连锁、宁波中百、浙江东日、步步高跟涨。相关ETF方面，旅游ETF富国（159766）涨3.15%，成交额1.54亿元，旅游ETF华夏（562510）涨3.27%，成交额4437.53万元。", "ctime": 1781241653, "time_str": "13:20:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260612/c677416818.shtml"}, {"id": "4519269", "title": "现代汽车工会宣布薪资谈判破裂", "content": "据报道，现代汽车工会宣布薪资谈判没有达成协议，将于6月25日投票决定是否罢工。（第一财经）", "ctime": 1781241250, "time_str": "13:14:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260612/c677416739.shtml"}, {"id": "4519265", "title": "半导体材料板块持续走低，欧莱新材跌超11%", "content": "半导体材料板块持续走低，欧莱新材跌超11%，有研硅、沪硅产业、华海诚科、艾森股份等跟跌。", "ctime": 1781241225, "time_str": "13:13:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260612/c677416734.shtml"}, {"id": "4519111", "title": "美国计划撤走三分之一用于北约欧洲防务的战斗机", "content": "美国计划撤走为北约欧洲防务提供的部分战斗机，这一数量占美为北约欧洲防务提供战机总数的约三分之一。目前这一消息还未得到进一步证实。（央视新闻）", "ctime": 1781240350, "time_str": "12:59:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260612/c677416436.shtml"}, {"id": "4519109", "title": "美政府就法院裁定肯尼迪中心移除特朗普名字提出上诉", "content": "美国政府和肯尼迪表演艺术中心董事会11日分别就联邦地区法官要求将美国总统特朗普的名字从肯尼迪表演艺术中心移除的裁决提出上诉。据报道，特朗普政府当天向哥伦比亚特区巡回上诉法院提出上诉，旨在推翻联邦地区法院此前作出的裁决。肯尼迪中心董事会当天也投票决定就联邦地区法院的裁决提起上诉，申请暂缓执行该裁决。（新华社）", "ctime": 1781240344, "time_str": "12:59:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260612/c677416433.shtml"}, {"id": "4519103", "title": "日本手足口病今年已确诊逾万例，多地发警报", "content": "日本卫生机构最新数据显示，今年手足口病患者持续增加，已确诊超1万人。鹿儿岛县、宫崎县、福冈县等6县发出疫情警报，较往年提前。5月25日至31日，全国47个都道府县中，6县定点医疗机构收治患者超警戒值。福冈县患者最多，达1295人，宫崎县、鹿儿岛县均超千人。该病由肠道病毒引起，5岁以下儿童高发，主要经粪口途径及飞沫传播。无特效药，预防方式包括接种疫苗、勤洗手、吃熟食、喝净水等。（新华社）", "ctime": 1781240128, "time_str": "12:55:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260612/c677416393.shtml"}, {"id": "4519099", "title": "韩国选举机构因选票短缺事件遭搜查", "content": "韩国警方11日搜查韩国中央选举管理委员会总部及其分支机构，以调查本月3日地方选举中出现的选票短缺事件。据韩联社报道，警方当天出动百余人，对中央选举管理委员会位于京畿道果川市的总部及首尔地区分支等7处地点展开搜查。警方怀疑，这些机构在地方选举的选票印制和分发过程中存在重大疏忽，涉嫌违反《公职选举法》及渎职。警方已在搜查令中将引咎辞职的中央选举管理委员会委员长卢泰岳列为嫌疑人。（新华社）", "ctime": 1781239990, "time_str": "12:53:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260612/c677416371.shtml"}, {"id": "4519095", "title": "意大利总理与议员在议会互怼", "content": "当地时间6月11日，意大利总理梅洛尼在议会与反对党五星运动议员互怼。五星运动议员萨尔韦斯特里指责梅洛尼政府“并未改变对美国和以色列‘卑躬屈膝的姿态’”，指责意大利政府根本没有“挺直脊梁”，而只是“戴上了护膝以便跪得容易”。梅洛尼则反驳称，萨尔韦斯特里不尊重女性，断言自己“戴了护膝”，并指出或许真正让这名议员恼火的是，自己“从未戴过护膝，没有走过捷径，全凭一己之力走到今天”。(CCTV国际时讯)", "ctime": 1781239982, "time_str": "12:53:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260612/c677416364.shtml"}, {"id": "4519087", "title": "智源研究院发布全球首个通用世界基座模型“悟界·Physis-v0.1”", "content": "6月12日，在2026智源大会现场，智源研究院院长王仲远发布全球首个通用世界基座模型——悟界·Physis-v0.1，据介绍，悟界·Physis-v0.1具备四大核心特性：物理正确、动作因果可溯、长程一致与通用泛化。模型可适配机器人、视频生成、游戏、工业等全垂类真实物理应用场景，为具身智能、严肃工业等领域提供底层支撑。（科创板日报）", "ctime": 1781239746, "time_str": "12:49:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260612/c677416331.shtml"}, {"id": "4519067", "title": "美股市场两倍做多中际旭创的基金已经在募集当中", "content": "中际旭创早盘一度高开近5%。同时，海外也传来一则利好。近日，美国市场开发了一只两倍做多中际旭创的产品。该产品由ProShares基金运作。该款产品目前仍处于募集阶段，预计两个月后上市。当地时间6月10日下午四点向美国证券交易委员会提交的资料显示，两倍做多中际旭创的基金已经在募集当中。该基金名为，ProShares Ultra ZhongjiInnolight(以下简称“该基金“)，旨在实现每日投资回报率，扣除费用和开支前，该回报率须达到Zhongji Innolight公司(中际旭创）股票证券每日表现的2倍(2x)。 (券商中国)", "ctime": 1781238936, "time_str": "12:35:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260612/c677416146.shtml"}, {"id": "4519031", "title": "SK海力士回应厂区火灾：已初步控制 生产设备运行正常", "content": "6月12日，消息显示韩国SK海力士清州第四园区爆发火情。对于最新情况和影响，SK海力士方面表示，已完成初步控制，正调查具体情况。目前生产设备运行正常。（证券时报）", "ctime": 1781238414, "time_str": "12:26:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260612/c677415997.shtml"}, {"id": "4519021", "title": "古巴外长：古巴电力问题源于美国封锁制裁", "content": "古巴外长罗德里格斯11日表示，一些美国官员将古巴电力问题归咎于古巴政府的说法是在撒谎，旨在掩盖美国对古巴人民犯下的罪行。罗德里格斯说，美国总统特朗普今年1月29日签署行政令，威胁对向古巴提供石油的国家输美商品加征从价关税。在此之前，向古巴运送燃料的油轮已经面临罚款、资产冻结、被排除在国际金融体系之外，甚至在公海受到拦截、没收货物等威胁。此外，还有多家外国银行拒绝与古巴开展业务，导致多笔银行转账受阻。（新华社）", "ctime": 1781238371, "time_str": "12:26:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260612/c677415987.shtml"}, {"id": "4519009", "title": "追觅科技据悉考虑最快明年在香港IPO", "content": "知情人士称透露，中国智能生活家电生产商追觅科技正在考虑最快明年在香港IPO。因相关消息尚未公开而不愿具名的知情人士称，追觅科技正在与顾问合作，潜在股票发行规模可能达到数亿美元。知情人士称，相关讨论仍在进行中，发行规模和时间等细节可能会有变化。（新浪财经）", "ctime": 1781237921, "time_str": "12:18:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260612/c677415874.shtml"}, {"id": "4518997", "title": "荣耀CEO李健官宣正式签约张雪机车车队两位车手", "content": "6月12日，荣耀CEO李健官宣荣耀签约张雪机车车队两位车手，其中53号车手瓦伦丁·德比斯任“荣耀骑士先锋”；64号车手费德里科·卡里卡苏洛任“荣耀骑士新锐”。同时，在此前官宣推出的张雪机车联名款冠军手表也将于近期发售。（人民财讯）", "ctime": 1781237473, "time_str": "12:11:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260612/c677415701.shtml"}, {"id": "4518943", "title": "港股午评：恒生指数涨2.02%，恒生科技指数涨1.72%", "content": "港股午间收盘，恒生指数涨2.02%，恒生科技指数涨1.72%。恒指港股通ETF银华（159318）涨2.24%，港股通科技ETF鹏华（159751）涨1.62%。板块方面，客运航空公司、金属与采矿板块涨幅靠前。个股方面，明略科技-W涨19.98%，周大福涨17.36%，洛阳钼业涨12.23%，龙蟠科技涨11.0%，九方智投控股涨10.56%；劲方医药-B跌5.93%，海致科技集团跌5.86%，迅策跌5.46%，应星控股跌5.44%，MINIMAX-W跌5.2%。", "ctime": 1781236878, "time_str": "12:01:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260612/c677415507.shtml"}, {"id": "4518913", "title": "日本发射一枚H3火箭", "content": "日本宇宙航空研究开发机构12日上午在鹿儿岛县种子岛宇宙中心发射一枚H3火箭。H3火箭是日本新一代主力运载火箭，这是该型火箭第八次发射。此次发射的H3火箭6号是一款新型试验火箭，只有3台液体燃料主发动机。火箭搭载6颗超小型卫星，包括静冈大学用于捕捉太空垃圾试验的“白丝”号卫星以及东京科学大学的“海燕”号卫星。（新华社）", "ctime": 1781236573, "time_str": "11:56:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260612/c677415405.shtml"}, {"id": "4518909", "title": "6月12日午间公告一览：宸展光电向特定对象发行股票申请获深交所受理", "content": "宸展光电公告，公司于2026年6月11日收到深圳证券交易所出具的《关于受理宸展光电（厦门）股份有限公司向特定对象发行股票申请文件的通知》（深证上审〔2026〕140号）。深交所对公司报送的向特定对象发行股票的申请文件进行了核对，认为申请文件齐备，决定予以受理。本次向特定对象发行股票事项尚需通过深交所审核，并获得中国证监会同意注册的批复后方可实施。", "ctime": 1781236431, "time_str": "11:53:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260612/c677415377.shtml"}, {"id": "4518905", "title": "“密码+人工智能融合创新发展产业联盟”成立", // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');

    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
