nt": "鹭燕医药公告，2026年上半年营业收入105.83亿元，同比增长1.75%。归属于上市公司股东的净利润1.43亿元，同比下降7.46%。扣非净利润1.38亿元，同比下降9.88%。公司计划不派发现金红利，不送红股，不以公积金转增股本。", "ctime": 1786952859, "time_str": "15:47:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260817/c679009371.shtml"}, {"id": "4968027", "title": "蓝帆医疗：转让武汉必凯尔100%股权，已收到全部1.9亿元转让款", "content": "蓝帆医疗公告，公司此前披露拟以1.9亿元转让武汉必凯尔救助用品有限公司100%股权给明德生物。截至公告日，明德生物已足额支付全部1.9亿元股权转让款，武汉必凯尔已办理完成工商变更登记手续，公司不再持有武汉必凯尔股权，其不再纳入合并报表范围。公司副总裁张永臣因本次股权转让交割完成，申请辞去副总裁职务。", "ctime": 1786952722, "time_str": "15:45:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260817/c679009278.shtml"}, {"id": "4968025", "title": "旺能环境：印尼垃圾焚烧发电项目获浙江省发改委备案", "content": "旺能环境公告，公司此前拟以不超过1.8亿美元总投资在印尼勿加泗市新建日处理量1500吨垃圾焚烧发电厂。2026年8月14日，该项目已获得浙江省发改委出具的境外投资项目备案通知书，备案有效期2年。", "ctime": 1786952674, "time_str": "15:44:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260817/c679009262.shtml"}, {"id": "4968021", "title": "青松建化：2026年上半年净利润1.24亿元，同比增长13.19%", "content": "青松建化公告，2026年上半年营业收入15.74亿元，同比下降11.05%；归母净利润1.24亿元，上年同期净利润1.1亿元，同比增长13.19%；扣非净利润1.2亿元，同比增长18.68%。本半年度报告未经审计。", "ctime": 1786952605, "time_str": "15:43:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260817/c679009211.shtml"}, {"id": "4968017", "title": "中晟高科：子公司完成工商登记，注册资本2000万元", "content": "中晟高科公告，公司此前拟以实物及现金出资2000万元设立全资子公司福建晟灏新材料有限公司，并投资建设高分子新材料项目。近日，该子公司已完成工商登记手续并取得营业执照，注册资本为贰仟万圆整，成立日期为2026年8月14日。", "ctime": 1786952570, "time_str": "15:42:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260817/c679009196.shtml"}, {"id": "4968005", "title": "东方日升签署百兆瓦级光储战略合作协议", "content": "据东方日升消息，8月14日，东方日升与乌克兰新能源企业Ascania Energy在宁海举行战略合作签约仪式。双方围绕光伏与储能两大方向达成战略合作，共签署100MW和200MWh协议。双方将充分发挥各自在产品技术、智能制造、项目开发、系统集成、全球交付与本地化服务等方面的优势，共同推动高效、可靠的光储解决方案在乌克兰市场应用。", "ctime": 1786952376, "time_str": "15:39:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260817/c679009083.shtml"}, {"id": "4967977", "title": "外交部：期待推动中智关系再上新台阶", "content": "8月17日，外交部发言人林剑主持例行记者会。有记者问：中方发布了智利外长佩雷斯访华的消息，请问中方如何评价当前中智关系，对此访有何期待？林剑表示，智利是拉美和亚太地区的重要国家，也是首个同新中国建交的南美国家。建交半个多世纪以来，中智关系走在中国同拉美和加勒比国家关系前列。近年来，在两国元首战略引领下，中智关系不断取得新进展，政治互信日益牢固，各层级交往更加频繁，各领域合作不断深化。今年是中智建立全面战略伙伴关系10周年。中方期待通过此访，同智方就双边关系以及共同关心的国际和地区问题深入交换意见，赓续友谊、扩大共识、深化合作，推动中智关系再上新台阶。（央视新闻）", "ctime": 1786952182, "time_str": "15:36:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260817/c679009004.shtml"}, {"id": "4967965", "title": "大摩最新沙盘推演：AI服务走向商品化 云巨头与算力租户“难两全”", "content": "高性价比开源模型推动AI服务走向“大宗商品化”，token价格持续下滑。摩根士丹利近日针对AI行业开展沙盘推演，揭示出算力租金需要同时满足云厂商回本与算力租户生存的“两难”困境。若token价格持续下跌，或将出现算力租户倒闭、云厂商利润被侵蚀等情况。", "ctime": 1786952086, "time_str": "15:34:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260817/c679008969.shtml"}, {"id": "4967963", "title": "津药药业：子公司获缅甸药品注册证书，规格20ml：1.348g", "content": "津药药业公告，公司子公司津药和平（天津）制药有限公司近日收到缅甸卫生部颁发的小儿复方氨基酸注射液（18AA-I）药品注册证书，规格为20ml：1.348g（总氨基酸），标志着该产品可生产并在缅甸市场销售。该药品为肠外营养类处方药，适用于小儿消化系统疾病无法进食、低蛋白血症等。", "ctime": 1786952070, "time_str": "15:34:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260817/c679008962.shtml"}, {"id": "4967961", "title": "白云机场：7月旅客吞吐量782.12万人次同比增9.80%", "content": "白云机场公告，2026年7月生产经营数据快报显示，起降架次50091架次，同比增长3.47%；旅客吞吐量782.12万人次，同比增长9.80%；货邮吞吐量20.13万吨，同比减少3.04%。其中，国内航线旅客吞吐量611.28万人次，同比增长8.62%；国际航线旅客吞吐量163.45万人次，同比增长13.82%。", "ctime": 1786952064, "time_str": "15:34:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260817/c679008958.shtml"}, {"id": "4967957", "title": "医保基金即时结算覆盖超九成定点机构 提前达成年度目标", "content": "记者从国家医保局获悉，截至2026年7月底，全国医保部门共拨付医药机构即时结算资金9457.31亿元，占本地月结算资金规模的95.51%；覆盖定点医药机构75.22万家，占统筹地区定点医药机构数量的90.17%。即时结算年度目标任务提前完成，改革速度超预期、改革成效已彰显。（央视新闻）", "ctime": 1786951990, "time_str": "15:33:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260817/c679008915.shtml"}, {"id": "4967895", "title": "外交部：维护朝鲜半岛和平稳定符合各方共同利益", "content": "据报道，美国总统特朗普日前在社交媒体发文，表示已要求国防部大幅缩减美国与韩国的联合军演规模，称这些军演“耗资巨大”，并表示他与朝鲜领导人金正恩有着“非常良好的关系”。外交部发言人林剑17日在例行记者会上就此答问时表示，中方注意到了有关报道。维护朝鲜半岛和平稳定、推动半岛问题政治解决，符合各方共同利益。（新华社）", "ctime": 1786951606, "time_str": "15:26:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260817/c679008707.shtml"}, {"id": "4967893", "title": "印尼发生7.7级地震 外交部：中方愿提供积极协助", "content": "8月17日，外交部发言人林剑主持例行记者会。有记者问：据报道，印尼15日发生7.7级地震，至少数十人遇难，中方对此有何评论？是否将对印尼提供援助？林剑表示，中方关注印尼的地震灾情，我们对遇难者表示深切哀悼，向遇难者的家属和受伤人员表示诚挚慰问。中方愿根据印尼方面的需要提供积极协助。（央视新闻）", "ctime": 1786951503, "time_str": "15:25:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260817/c679008670.shtml"}, {"id": "4967891", "title": "WTI原油跌超1%", "content": "WTI原油跌超1%，现报81.55美元/桶。", "ctime": 1786951429, "time_str": "15:23:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260817/c679008636.shtml"}, {"id": "4967877", "title": "阿联酋金融人士：阿中金融合作前景广阔", "content": "总部位于阿联酋北部拉斯海玛酋长国的拉斯海玛银行首席执行官拉希尔·艾哈迈德日前接受记者采访时表示，随着阿联酋与中国经贸合作不断深化，两国金融合作前景广阔，人民币计价金融产品和资本市场合作将迎来更多发展机遇。近年来，中阿经贸合作持续深化，其中金融互联互通正成为促进双边贸易和投资的重要纽带。艾哈迈德表示，随着越来越多中国企业在阿联酋投资兴业，数字支付、跨境金融服务和人民币结算将发挥更加重要的作用。“未来五年，跨境贸易融资、资本市场互联互通、数字金融等将成为阿中金融合作重要方向。”（新华社）", "ctime": 1786951070, "time_str": "15:17:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260817/c679008467.shtml"}, {"id": "4967871", "title": "蚂蚁集团CEO韩歆毅：智能体商业将在6至12个月内爆发", "content": "8月17日，支付宝AI生态大会在杭州召开，这是支付宝首个AI生态大会。据悉，这也是国内首个聚焦智能体商业落地的产业大会，与会方包括商家、机构、交易平台，手机、车机、AI 眼镜、智能手表等硬件终端厂商，车企以及大模型厂商，核心主题是智能体商业时代的产业协作。蚂蚁集团首席执行官韩歆毅致辞时表示，智能体商业将在未来6至12个月内迎来爆发。他将这一时点的到来归因于三个条件同时成熟——AI能力提升、用户需求的跃迁和价值闭环的形成，并呼吁行业加强共建。（人民财讯）", "ctime": 1786950966, "time_str": "15:16:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260817/c679008399.shtml"}, {"id": "4967869", "title": "国家统计局：深入实施“人工智能+”行动，着力打造新兴支柱产业", "content": "国家统计局工业司首席统计师孙晓解读2026年7月份工业生产数据。总体看，7月份，工业经济克服阶段性高温、汛期降雨等短期因素影响，保持总体平稳、向新向优发展态势。同时也要看到，外部环境复杂多变，工业经济新旧动能转换过程中仍面临诸多困难挑战，有效需求不足、产销衔接不畅、部分行业企业资金周转压力较大等问题依然突出。下阶段，要继续完整准确全面贯彻新发展理念，加快构建新发展格局，深入实施“人工智能+”行动，着力打造新兴支柱产业，持续推动传统产业改造升级，扎实推进工业经济高质量发展。（第一财经）", "ctime": 1786950935, "time_str": "15:15:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260817/c679008388.shtml"}, {"id": "4967865", "title": "南向资金净买入超30亿港元", "content": "据同花顺iFinD数据，截至目前，南向资金净买入超30亿港元，其中港股通（沪）买入超9.18亿港元，港股通（深）买入超20.86亿港元。", "ctime": 1786950818, "time_str": "15:13:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260817/c679008352.shtml"}, {"id": "4967861", "title": "捷佳伟创二代全自动填孔VCP电镀线成功出货", "content": "近日，捷佳伟创自主研发的二代全自动填孔VCP电镀设备正式完成出货交付。此次推出的二代全自动填孔VCP电镀设备，在一代机型的成熟应用基础上完成了数十项关键性能升级。（人民财讯）", "ctime": 1786950753, "time_str": "15:12:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260817/c679008333.shtml"}, {"id": "4967857", "title": "国家统计局：7月规模以上数字产品制造业增加值同比增长17.3% 增速较上月加快3.5个百分点", "content": "国家统计局发布数据，7月份，规模以上数字产品制造业增加值同比增长17.3%，增速较上月加快3.5个百分点。从行业看，电子元器件及设备制造、智能设备制造、计算机制造等行业增加值分别增长24.7%、15.1%、10.9%。从产品看，智能手环、显示器、硬盘存储器等电子类产品产量分别增长100.0%、21.3%、12.1%；3D打印设备、工业自动调节仪表与控制系统、工业控制计算机及系统等智能生产设备产品产量分别增长65.7%、41.2%、30.3%。", "ctime": 1786950464, "time_str": "15:07:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260817/c679008235.shtml"}, {"id": "4967855", "title": "中国人民银行新增8家数字人民币业务运营机构", "content": "为贯彻落实“十五五”规划纲要关于“稳步发展数字人民币”的决策部署，进一步提升数字人民币服务的普惠性，持续响应人民群众对安全、便捷、高效的数字人民币服务需求，中国人民银行新增平安银行、恒丰银行、渤海银行、上海银行、杭州银行、徽商银行、长沙银行、广西北部湾银行成为银行类数字人民币业务运营机构，并接入央行端数字人民币系统。新增机构将在完成业务、技术准备后开展数字人民币业务。目前，数字人民币业务运营机构已扩容至30家。下一步，中国人民银行将按照市场化、法治化原则有序推进运营机构扩容，进一步激发市场主体的积极性和创造性，建设开放包容、公平竞争的数字人民币发展环境。", "ctime": 1786950445, "time_str": "15:07:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260817/c679008223.shtml"}, {"id": "4967853", "title": "国家统计局：深入实施“人工智能+”行动 着力打造新兴支柱产业", "content": "国家统计局表示，总体看，7月份，工业经济克服阶段性高温、汛期降雨等短期因素影响，保持总体平稳、向新向优发展态势。同时也要看到，外部环境复杂多变，工业经济新旧动能转换过程中仍面临诸多困难挑战，有效需求不足、产销衔接不畅、部分行业企业资金周转压力较大等问题依然突出。下阶段，要继续完整准确全面贯彻新发展理念，加快构建新发展格局，深入实施“人工智能+”行动，着力打造新兴支柱产业，持续推动传统产业改造升级，扎实推进工业经济高质量发展。", "ctime": 1786950434, "time_str": "15:07:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260817/c679008220.shtml"}, {"id": "4967841", "title": "国家统计局：7月一线城市商品住宅销售价格环比总体上涨，二三线城市环比下降", "content": "国家统计局数据显示，7月份，一线城市新建商品住宅销售价格同比下降1.1%，降幅比上月收窄0.2个百分点。其中，北京、广州和深圳分别下降2.3%、2.2%和2.9%，上海上涨3.0%。二线城市新建商品住宅销售价格同比下降2.8%，降幅收窄0.3个百分点。三线城市新建商品住宅销售价格同比下降4.2%，降幅与上月相同。7月份，一线城市二手住宅销售价格同比下降3.7%，降幅比上月收窄1.2个百分点。其中，北京、上海、广州和深圳分别下降4.5%、2.0%、4.7%和3.6%。二、三线城市二手住宅销售价格同比分别下降5.1%和5.8%，降幅分别收窄0.3个和0.2个百分点。", "ctime": 1786950302, "time_str": "15:05:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260817/c679008161.shtml"}, {"id": "4967831", "title": "前7个月我国工业机器人产量同比增长28.5%", "content": "国家统计局新闻发言人付凌晖在17日举行的国新办新闻发布会上说，今年1至7月份，我国装备制造业和高技术制造业增势良好，工业机器人产量同比增长28.5%，3D打印设备、锂离子电池产量同比分别增长52.3%、40.2%。(新华社)", "ctime": 1786950250, "time_str": "15:04:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260817/c679008150.shtml"}, {"id": "4967829", "title": "国家统计局：1—7月份，全国房地产开发投资43009亿元", "content": "据国家统计局，1—7月份，全国房地产开发投资43009亿元，同比下降19.2%；其中，住宅投资33172亿元，下降19.1%。 1—7月份，房地产开发企业房屋施工面积55.76亿平方米，同比下降12.7%。其中，住宅施工面积38.71亿平方米，下降13.0%。房屋新开工面积2.67亿平方米，下降24.0%。其中，住宅新开工面积1.95亿平方米，下降24.6%。房屋竣工面积1.92亿平方米，下降23.2%。其中，住宅竣工面积1.34亿平方米，下降25.5%。", "ctime": 1786950195, "time_str": "15:03:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260817/c679008120.shtml"}, {"id": "4967825", "title": "国家统计局：1—7月份国民经济保持总体平稳、向新向优发展态势", "content": "国家统计局表示，总的来看，1—7月份国民经济运行总体平稳，保持向新向优向好发展态势。但也要看到，外部环境复杂多变，国内供强需弱矛盾突出，部分企业经营困难，经济稳中向好的基础还需巩固。下阶段，要坚持以习近平新时代中国特色社会主义思想为指导，坚持稳中求进工作总基调，完整准确全面贯彻新发展理念，加快构建新发展格局，坚持深化改革开放，加快推动新旧动能转换，加大逆周期调节力度，加力扩大内需、优化供给，切实保障和改善民生，增强发展动力、激发社会活力，推动经济持续向新向优向好发展。（国家统计局）", "ctime": 1786950186, "time_str": "15:03:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260817/c679008114.shtml"}, {"id": "4967823", "title": "国家统计局：1—7月份，全国固定资产投资260328亿元，同比下降6.7%", "content": "据国家统计局，1—7月份，全国固定资产投资260328亿元，同比下降6.7%。分产业看，第一产业投资5329亿元，同比下降0.5%；第二产业投资97709亿元，下降2.1%；第三产业投资157290亿元，下降9.5%。", "ctime": 1786950144, "time_str": "15:02:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260817/c679008089.shtml"}, {"id": "4967819", "title": "国家统计局：2026年7月份规模以上工业增加值增长4.5%", "content": "据国家统计局， 7月份，规模以上工业增加值同比实际增长4.5%（增加值增速均为扣除价格因素的实际增长率）。从环比看，7月份，规模以上工业增加值比上月增长0.11%。1—7月份，规模以上工业增加值同比增长5.3%。分三大门类看，7月份，采矿业增加值同比下降4.2%，制造业增长5.5%，电力、热力、燃气及水生产和供应业增长5.0%。 分经济类型看，7月份，国有控股企业增加值同比增长1.6%；股份制企业增长5.0%，外商及港澳台投资企业增长2.8%；私营企业增长3.7%。", "ctime": 1786950133, "time_str": "15:02:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260817/c679008083.shtml"}, {"id": "4967815", "title": "ETF两市成交额报4354.5亿元，较上一交易日此时缩量206.51亿元", "content": "截至目前，ETF两市成交额报4354.5亿元，较上一交易日此时缩量206.51亿元，分类型来看，股票型ETF成交额1535.05亿元，债券型ETF成交额1862.94亿元，货币型ETF成交额250.62亿元，商品型ETF成交额84.3亿元，QDII型ETF成交额621.59亿元。", "ctime": 1786950117, "time_str": "15:01:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260817/c679008071.shtml"}, {"id": "4967801", "title": "国家统计局：2026年1—7月份社会消费品零售总额增长1.2%", "content": "据国家统计局数据，1—7月份，社会消费品零售总额287744亿元，同比增长1.2%。其中，除汽车以外的消费品零售额265142亿元，增长2.7%。7月份，社会消费品零售总额39022亿元，同比增长0.6%。其中，除汽车以外的消费品零售额35892亿元，增长2.5%。", "ctime": 1786950085, "time_str": "15:01:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260817/c679008056.shtml"}, {"id": "4967791", "title": "ETF收评：科创成长ETF领涨6.52%，酒ETF领跌2.49%", "content": "ETF收盘涨跌不一，科创成长ETF（589700）领涨6.52%，科创成长ETF（588110）涨6.43%，科创成长ETF（588070）涨6.33%，酒ETF（512690）领跌2.49%，游戏ETF（516010）跌2.02%，游戏ETF（159869）跌2.01%。", "ctime": 1786950082, "time_str": "15:01:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260817/c679008045.shtml"}, {"id": "4967769", "title": "A股收评：创业板指午后拉升涨超3% 算力硬件股表现强势", "content": "A股三大指数今日集体上涨，截至收盘，上证指数涨1.41%，深证成指涨2.44%，创业板指涨3.14%，北证50涨1.91%，科创50指数涨4.14%。全市场成交额24025亿元，较上日放量2459亿元，全市场超4300只个股上涨。板块题材上，电子化学品、培育钻石、半导体、粮食概念、CPO板块涨幅居前；白酒、影视院线、游戏、医药商业、煤炭开采加工板块跌幅居前。盘面上，电子化学品板块持续走强，中石科技、宏昌电子、天通股份涨停，奥来德、德邦科技、天通股份、上海新阳涨幅居前。半导体板块表现强势，通富微电、有研新材涨停，中微半导、芯朋微、中科飞测、普冉股份涨幅居前。CPO板块午后涨幅扩大，太辰光、中瓷电子、沃格光电等多股涨停，仕佳光子、长芯博创、鼎通科技涨幅居前。影视院线板块全天低迷，北京文化跌停，儒意电影、中国电影、上海电影跟跌。白酒板块表现疲软，贵州茅台、迎驾贡酒、古井贡酒领跌板块。", "ctime 5", "title": "科创50指数涨幅扩大至4%", "content": "科创50指数涨幅扩大至4%，现报1786.6点。", "ctime": 1786949472, "time_str": "14:51:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260817/c679007846.shtml"}, {"id": "4967663", "title": "上海出租车“限制名单”运行三个月 拒载率下降近五成", "content": "上海浦东国际机场、虹桥枢纽作为上海重要城市门户，出租车营运服务直接关乎城市窗口形象。记者从上海市交通部门获悉，为整治枢纽场站出租车各类违规乱象，由出租汽车行业协会、场站管理单位及各出租车企业联合推出的枢纽限制名单自律管理机制，自今年5月10日正式落地实施以来，三个月内上海全市重要枢纽场站累计录入出租车各类违规记录359起，所有涉事驾驶员、涉事车辆均按规则执行场站禁入处置，从源头约束不规范营运行为，主要分为四大整治成效。场站拒载乱象得到有效遏制，现场运营秩序显著好转。此前高发的驾驶员拒不服从现场调度事件数量降幅接近五成。虹桥机场拒载问题改善尤为突出，场站拒载发生率较去年同期大幅下降84.29%；浦东机场拒载发生率较去年同期显著下降54%，旅客乘车体验明显提升。（央视新闻）", "ctime": 1786949396, "time_str": "14:49:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260817/c679007826.shtml"}, {"id": "4967659", "title": "创业板指涨3%", "content": "创业板指涨幅扩大至3%，上证指数涨1.32%，深证成指涨2.32%。", "ctime": 1786949367, "time_str": "14:49:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260817/c679007824.shtml"}, {"id": "4967645", "title": "上证50股指期货(IH)主力合约日内涨超1%", "content": "上证50股指期货(IH)主力合约日内涨超1%，现报2919.4点。", "ctime": 1786949257, "time_str": "14:47:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260817/c679007792.shtml"}, {"id": "4967641", "title": "日本自卫队指挥体系或引入美国AI", "content": "日本共同社今天（8月17日）报道称，据相关人士透露，日本防卫省已开始研究将美国企业研发的人工智能（AI）技术引入日本自卫队的指挥控制体系——据称其目的在于“通过AI辅助指挥官分析战况、选择目标，甚至向部队下达命令，从而加快决策进程”。报道称，为避免过度依赖特定国家或企业，日本防卫省计划“将不同国家或企业的AI系统综合加以利用，包括日本国产AI”。据称美国帕兰蒂尔技术公司的MSS（Maven Smart System）系统也在候选之列。该系统能够整合并分析从卫星、侦察机等渠道收集的大量数据，并用于制定作战方案等。据称，美军在对伊朗的军事行动中已经使用了该系统。（CCTV国际时讯）", "ctime": 1786949221, "time_str": "14:47:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260817 const SECTORS  = [{"name": "数据要素", "hit_count": 32, "etfs": []}, {"name": "金融", "hit_count": 30, "etfs": []}, {"name": "人工智能", "hit_count": 23, "etfs": []}, {"name": "消费", "hit_count": 22, "etfs": []}, {"name": "半导体", "hit_count": 17, "etfs": []}, {"name": "新能源", "hit_count": 8, "etfs": []}, {"name": "军工", "hit_count": 8, "etfs": []}, {"name": "医药", "hit_count": 7, "etfs": []}];
const META     = {"update_time": "2026-08-17 15:57:59", "sentiment_score": 56.76855895196507, "agents": []};

// 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
