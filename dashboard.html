e": 1777523562, "time_str": "12:32:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260430/c676411588.shtml"}, {"id": "4304419", "title": "涉嫌违法违规收集使用个人信息 67款移动应用被通报", "content": "根据中央网信办、工业和信息化部、公安部联合发布的《关于开展2026年个人信息保护系列专项行动的公告》，依据《网络安全法》《个人信息保护法》《网络数据安全管理条例》《App违法违规收集使用个人信息行为认定方法》等法律法规和有关规定，经国家计算机病毒应急处理中心检测，67款移动应用存在一项或者多项违法违规收集使用个人信息情况，现通报如下：1在App首次运行时未通过弹窗等明显方式提示用户阅读隐私政策等收集使用规则；以默认选择同意隐私政策等非明示方式征求用户同意；隐私政策难以访问；个人信息处理者在处理个人信息前，未以显著方式、清晰易懂的语言真实、准确、完整地向个人告知个人信息处理者的名称或者姓名、联系方式、个人信息的保存期限等。涉及13款移动应用。2隐私政策未逐一列出App（包括委托的第三方或嵌入的第三方代码、插件）收集使用个人信息的目的、方式、范围等。涉及32款移动应用。3个人信息处理者向其他个人信息处理者提供其处理的个人信息的，未向个人告知接收方的名称或者姓名、联系方式、处理目的、处理方式和个人信息的种类，并取得个人的单独同意；App客户端向第三方提供个人信息，未经用户同意，未做匿名化处理。涉及15款移动应用。（央视新闻）", "ctime": 1777523340, "time_str": "12:29:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260430/c676411514.shtml"}, {"id": "4304417", "title": "杭州1宗宅地溢价57.26%成交", "content": "4月30日，杭州1宗萧山区市北单元宅地出让，土地出让面积32789㎡，规划建筑面积72135.8㎡，容积率2.2，起始价16.59亿元，起始楼面价23000元/㎡。最终经过43轮竞价，绿城和滨江集团联合体以总价26.09亿元竞得，成交楼面价36170元/㎡，溢价率57.26%。", "ctime": 1777523308, "time_str": "12:28:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260430/c676411510.shtml"}, {"id": "4304397", "title": "6月交货的布伦特原油期货报每桶126.09美元，创2022年3月以来新高", "content": "6月交货的布伦特原油期货上涨超8美元，现报每桶126.09美元，创2022年3月以来新高。（财联社）", "ctime": 1777523071, "time_str": "12:24:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260430/c676411464.shtml"}, {"id": "4304387", "title": "2026年一季度国内居民出游超19亿人次 同比增长6.0%", "content": "根据国内居民出游抽样调查统计结果，2026年一季度，国内居民出游人次19.01亿，比上年同期增加1.07亿，同比增长6.0%。其中，城镇居民国内出游人次14.03亿，同比增长6.5%；农村居民国内出游人次4.98亿，同比增长4.6%。国内居民出游总花费1.86万亿元，比上年同期增加0.05万亿元，同比增长2.9%。其中，城镇居民出游花费1.53万亿元，同比增长3.5%；农村居民出游花费0.32万亿元，同比增长0.4%。（央视新闻）", "ctime": 1777522761, "time_str": "12:19:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260430/c676411400.shtml"}, {"id": "4304381", "title": "WTI原油涨超3%", "content": "WTI原油涨超3%，现报110.11美元/桶。", "ctime": 1777522634, "time_str": "12:17:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260430/c676411311.shtml"}, {"id": "4304379", "title": "三部门启动“亮剑2026”海洋伏季休渔执法行动", "content": "5月1日12时，我国四大海域将进入伏季休渔期。今天（30日），农业农村部、公安部、中国海警局在辽宁大连联合启动“亮剑2026”海洋伏季休渔执法行动。开展伏季休渔的海域包括渤海、黄海、东海和北纬12度以北（含北部湾在内）的南海，持续时间为三个半月至四个半月不等，其间全国近12万艘海洋捕捞渔船和捕捞辅助船将回港休渔。海洋伏季休渔是我国核心渔业资源养护制度，在修复种群、保护生态、促进渔民增收等方面作用突出。今年伏季休渔期，农业农村部、公安部、中国海警局将依法严查擅自离港、违规出海、不回船籍港休渔等行为。同时紧盯跨海区作业、破坏北斗设备、“三无”船舶非法捕捞等恶性违法行为，以最严格执法守护休渔秩序。（央视新闻）", "ctime": 1777522627, "time_str": "12:17:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260430/c676411310.shtml"}, {"id": "4304377", "title": "布伦特原油站上114美元/桶", "content": "布伦特原油站上114美元/桶，日内涨3.22%。", "ctime": 1777522577, "time_str": "12:16:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260430/c676411300.shtml"}, {"id": "4304373", "title": "美军拟以高超音速导弹打击伊朗系首次实战部署", "content": "据报道，美国中央司令部已提出申请，计划将“暗鹰”高超音速导弹部署至中东地区。若申请获批，这将是美国首次在实战中部署高超音速导弹，或将用于打击伊朗腹地的弹道导弹发射装置。报道援引知情人士的话称，美军此次计划部署，是因为伊朗已将导弹发射装置转移至美军现有精确打击导弹的射程范围之外。目前，美国的高超音速导弹研发进度严重滞后，至今尚未宣布全面投入实战。知情人士透露，该申请尚未获批。美国中央司令部拒绝对此事发表评论。彭博社分析称，尽管美伊自4月9日起处于临时停火状态，但美方此次动作表明，其仍在为后续可能的军事打击行动做准备。目前美伊双方均利用停火期重整军备，未来冲突可能更加激烈。(新华社)", "ctime": 1777522569, "time_str": "12:16:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260430/c676411294.shtml"}, {"id": "4304369", "title": "停产在即 宜春锂矿换证风波再起", "content": "市场普遍预期的停产节点临近之际，江西宜春锂矿换证又出现新变化。江西省自然资源厅官网显示，宜春四家瓷土矿采矿权出让收益评估报告等材料于4月7日公示后，宜丰县花桥乡大港瓷土矿、宜丰县同安乡同安瓷矿在公示期内先后提出异议，其余两家的评估报告则已予以公开生效。截至目前，评估机构已两次出具复函，对两家企业的异议主张均予以驳回，并维持原评估结果，相关异议核实复函的公示期将持续至5月12日。此前市场普遍预计，四家矿山将在报告生效后完成采矿权出让收益补缴，并于今年5月进入临时停产换证阶段。这是否会因两家矿企提出异议而发生改变？“此次异议大概率不会改变5月停产的预期，但肯定会影响到后续复产时间。”一位宜春当地行业人士对记者表示，换证流程需等待最终裁定、评估报告生效后方可继续推进，若企业仍不认可，继续提起复议或诉讼，停产周期可能被进一步拉长。（上证报）", "ctime": 1777522499, "time_str": "12:14:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260430/c676411280.shtml"}, {"id": "4304359", "title": "4月30日午间公告一览：渣打集团第一季度经营收入59亿元，同比增长9%", "content": "渣打集团公告，2026年第一季度经营收入59亿元，同比增长9%。其中，净利息收入29亿元，同比增长1%；非利息收入30亿元，同比增长16%。财富方案业务收入创季度新高，投资产品及银行保险业务表现强劲。环球银行业务收入上升19%，受放贷量增加，以及资本市场活动增多所带动。除税前溢利25亿元，同比增长17%。", "ctime": 1777522262, "time_str": "12:11:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260430/c676411226.shtml"}, {"id": "4304357", "title": "港股午评：恒生指数跌1.23%，恒生科技指数跌0.97%", "content": "港股午间收盘，恒生指数跌1.23%，恒生科技指数跌0.97%。恒指港股通ETF银华（159318）跌0.97%，港股通科技ETF鹏华（159751）跌0.75%。板块方面，居家用品、个人护理用品板块涨幅靠前；客运航空公司、金属与采矿板块跌幅靠前。个股方面，天数智芯涨19.74%，壁仞科技涨9.66%，经纬天地涨8.93%，国富量子涨7.01%，智谱涨6.86%；宝济药业-B跌33.11%，长飞光纤光缆跌11.87%，中创智领跌11.09%，中国旭阳集团跌9.91%，东鹏饮料跌9.2%。", "ctime": 1777522173, "time_str": "12:09:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260430/c676411186.shtml"}, {"id": "4304285", "title": "孟加拉国麻疹疫情加剧 逾220名儿童死亡", "content": "孟加拉国政府4月29日发布的数据显示，自3月中旬以来，该国暴发严重麻疹疫情，已有227名儿童死亡，近3.5万疑似感染者当中多数是6个月至5岁的儿童。本轮疫情是孟加拉国数十年来最严重的麻疹疫情之一。英国方面援引世界卫生组织数据报道，仅3月15日至4月14日，孟加拉国就报告了超过1.9万例疑似病例，其中近3000例经实验室检测予以确诊。世卫组织认为，近年来疫苗接种覆盖率下降是疫情迅速扩散的一大原因。（央视新闻）", "ctime": 1777521514, "time_str": "11:58:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260430/c676410912.shtml"}, {"id": "4304283", "title": "国家计算机病毒应急处理中心检测发现67款违法违规收集使用个人信息的移动应用", "content": "根据中央网信办、工业和信息化部、公安部联合发布的《关于开展2026年个人信息保护系列专项行动的公告》，依据《网络安全法》《个人信息保护法》《网络数据安全管理条例》《App违法违规收集使用个人信息行为认定方法》等法律法规和有关规定，经国家计算机病毒应急处理中心检测，67款移动应用存在一项或者多项违法违规收集使用个人信息情况。（人民财讯）", "ctime": 1777521451, "time_str": "11:57:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260430/c676410887.shtml"}, {"id": "4304267", "title": "从铝代铜到整车互联：中航光电2026北京车展亮出硬核底牌", "content": "2026北京国际车展期间，中航光电科技股份有限公司以“智见新境 连动未来”为主题，携车载动力系统、智能网联系统、Busbar、充换电系统等全系列汽车连接器产品亮相。据悉，公司已完成兆瓦级超充系统布局，1000A~1600A大电流铝排与接触件性能优异。在核心产品层面，公司对传统Fakra进行全新设计，采用补偿屏蔽环与双层屏蔽结构。在此基础上，Mini Fakra系列沿用了完全相同的家族式设计方案，目前全系列同轴产品均已完成升级迭代。（第一财经）", "ctime": 1777520855, "time_str": "11:47:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260430/c676410725.shtml"}, {"id": "4304265", "title": "小红书发内部信：成立AI一级部门Dots和企业智能部 柯南出任总裁", "content": "记者获悉，小红书发全员内部信，宣布新一轮组织升级，成立AI一级部门Dots和企业智能部，从产品技术、组织两方面加大对AI的投入。此外，任命柯南出任总裁，全面整合社区、电商、商业化三大核心业务及公司技术体系，向CEO星矢汇报。木兰继续担任董事会主席。（科创板日报）", "ctime": 1777520850, "time_str": "11:47:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260430/c676410724.shtml"}, {"id": "4304245", "title": "一名重大跨境网络赌博案件主要犯罪嫌疑人从泰国引渡回国", "content": "天津市公安局30日发布消息，29日，按照公安部部署，在泰国有关部门大力支持下，天津公安机关成功将一名重大跨境网络赌博案件主要犯罪嫌疑人黄某铠从泰国引渡回国。 经查，2022年9月至2023年6月，黄某铠伙同他人在柬埔寨组建犯罪团伙，通过互联网设立“万合足球”赌博平台，以高额利润为诱饵，网罗招募人员从事网络赌博犯罪活动，采用代理形式发展下线、赌客会员，在国内招揽各层级代理及赌客，涉案资金5亿余元。2026年2月，泰国有关部门裁定向中方引渡黄某铠。 下一步，天津公安机关将全力开展案件侦办工作。(新华社)", "ctime": 1777520482, "time_str": "11:41:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260430/c676410598.shtml"}, {"id": "4304243", "title": "史丹利：二季度复合肥销量有望延续稳健增长态势", "content": "史丹利4月29日在业绩说明会上表示，二季度4—5月期间仍属于春耕旺季，公司渠道与产品优势突出，叠加原料成本传导相对顺畅、行业集中度持续提升，二季度复合肥销量有望延续稳健增长态势。（人民财讯）", "ctime": 1777520365, "time_str": "11:39:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260430/c676410567.shtml"}, {"id": "4304223", "title": "Figure：生产效率大幅提升 可每小时生产1台机器人", "content": "Figure创始人布雷特·阿德科克(Brett Adcock)在社交平台X发文称，过去120天里，Figure的生产效率扩大了24倍——从每天1台机器人提升到每小时1台机器人。Figure将在本周生产55台人形机器人。公司在新闻稿中表示：“我们的机器人数量越多，我们为人形人工智能模型Helix生成的数据就越多。这种增长也使我们能够将更多机器人部署到现实世界中，从而利用来自实际运行环境的直接反馈来强化我们的系统和能力。 ”（科创板日报）", "ctime": 1777520066, "time_str": "11:34:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260430/c676410359.shtml"}, {"id": "4304211", "title": "ETF午评：科创人工智能ETF领涨5.93%，巴西ETF领跌2.63%", "content": "ETF午间收盘涨跌不一，科创人工智能ETF（589010）领涨5.93%，科创人工智能ETF（588730）涨5.79%，科创人工智能ETF（589110）涨5.76%，巴西ETF（159100）领跌2.63%，黄金股ETF（517520）跌2.47%，巴西ETF（520870）跌2.25%。", "ctime": 1777519902, "time_str": "11:31:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260430/c676410224.shtml"}, {"id": "4304207", "title": "ETF两市成交额2870.37亿元", "content": "截至目前，ETF两市成交额报2870.37亿元，分类型来看，股票型ETF成交额1056亿元，债券型ETF成交额1119.76亿元，货币型ETF成交额219.83亿元，商品型ETF成交额42.84亿元，QDII型ETF成交额263.18亿元。其中，成交额最高的非货币型ETF分别是中韩半导体ETF（513310）科创50ETF（588000）香港证券ETF（513090）成交额分别为61.24亿元51.31亿元46.16亿元", "ctime": 1777519879, "time_str": "11:31:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260430/c676410220.shtml"}, {"id": "4304209", "title": "卓创资讯与科大讯飞签署战略合作协议", "content": "4月29日，山东卓创资讯股份有限公司与科大讯飞股份有限公司正式签署战略合作协议。双方将围绕AI与产业数据融合创新开展深度合作，共同推动行业数字化、智能化发展。(人民财讯)", "ctime": 1777519875, "time_str": "11:31:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260430/c676410221.shtml"}, {"id": "4304203", "title": "A股午评：科创50指数半日大涨4.71%，国产算力芯片产业链集体爆发", "content": "A股三大指数今日涨跌不一，截至收盘，上证指数涨0.09%，深证成指跌0.06%，创业板指跌0.13%，北证50涨0.21%，科创50指数涨4.71%。全市场成交额18183亿元，较上日成交额放量1854亿元，全市场超2900只个股上涨。板块题材上，能源金属、半导体、足球概念、房地产、教育、海南、卫星导航、军工装备、白色家电板块涨幅居前；石墨电极、电力、电池、旅游及酒店、游戏、钢铁、煤炭板块跌幅居前。盘面上，多家半导体公司一季报强劲推动国产算力芯片产业链爆发，寒武纪时隔8个月再创历史新高，总市值超7000亿元，芯原股份20cm涨停。近日广期所碳酸锂期货价格站上18万元，锂矿板块延续强势，永杉锂业3连板，融捷股份2连板。房地产板块同样表现活跃，金融街2连板，衢州发展、万通发展、津投城开涨停，昨日深圳进一步放宽楼市政策。另一方面，电力板块多数调整，金开新能、豫能控股双双跌停。电池板块局部走弱，华盛锂电大跌10%，公司一季报净利润环比下滑，毛利率亦现回落，引发“利好兑现”抛压。", "ctime": 1777519849, "time_str": "11:30:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260430/c676410206.shtml"}, {"id": "4304199", "title": "股指期货早盘收盘 主力合约涨跌互现", "content": "股指期货早盘收盘，主力合约涨跌互现。沪深300股指期货(IF)主力合约跌0.23%，上证50股指期货(IH)主力合约涨0.28%，中证500股指期货(IC)主力合约跌0.29%，中证1000股指期货(IM)主力合约涨0.19%。", "ctime": 1777519837, "time_str": "11:30:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260430/c676410200.shtml"}, {"id": "4304193", "title": "俄新增艾滋病病毒感染人数达到历史最低点", "content": "据俄罗斯卫生部29日公布的数据，俄罗斯2025年新增艾滋病病毒感染病例4.3万例，较上年减少11%，与2016年相比减少50%，为历史最低点。 俄卫生部说，俄罗斯自2016年开始实施抗击艾滋病病毒的国家战略，10年来有效控制了艾滋病病毒在俄境内传播。截至2025年底，抗逆转录病毒疗法在俄全国的覆盖率已达到91.8%。2025年，40%的俄罗斯公民接受了艾滋病病毒检测。 据俄罗斯《生意人报》报道，2025年俄罗斯抗逆转录病毒药物采购总金额达到创纪录的429.8亿卢布（约合39.2亿元人民币），较上年增加17%。(新华社)", "ctime": 1777519658, "time_str": "11:27:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260430/c676410098.shtml"}, {"id": "4304187", "title": "国家数据局：推动可信数据空间从试点探索迈向规模化发展", "content": "4月29日，第九届数字中国建设峰会可信数据空间分论坛在福州举办。国家发展改革委党组成员，国家数据局党组书记、局长刘烈宏强调，下一步，要更好发挥有为政府和有效市场的作用，以高价值场景为牵引，加快构建数据“资源供给—产品共创—价值实现—利益共享”的价值闭环。以应用为牵引深入打造高价值场景，以价值为导向持续扩大数据供给，以产品为载体推动创新发展，以机制为重点构建多方共赢生态，推动可信数据空间从试点探索迈向规模化发展。同时，论坛举行了首批可信数据空间创新发展试点集中上线发布仪式，上海、宁波、温州、厦门、广州、济南、雄安等城市可信数据空间，以及南方电网、中国汽研、新材道、杭州高新科创集团、广州金域医学、陕西云创等单位承担的行业和企业可信数据空间宣告上线服务。论坛还发布了《城市可信数据空间实施路径报告》《可信数据空间 跨域互信能力 评价规范》等研究成果。（人民财讯）", "ctime": 1777519475, "time_str": "11:24:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260430/c676410020.shtml"}, {"id": "4304181", "title": "印度对涉华低灰冶金焦炭作出反倾销肯定性终裁", "content": "4月28日，印度商工部发布公告，对原产于或进口自中国、澳大利亚、哥伦比亚、印度尼西亚、日本和俄罗斯的低灰冶金焦炭作出反倾销肯定性终裁，建议对上述国家的涉案产品征收为期5年的反倾销税，具体如下：中国为128.83美元/吨，澳大利亚为71.16美元/吨，哥伦比亚为118.55美元/吨，印度尼西亚为67.5美元/吨，日本为42.95美元/吨，俄罗斯为84.16美元/吨。涉案产品为灰分含量低于18%的冶金焦炭，不包括磷含量不超过0.030%，粒度不超过30毫米，允许5%的粒度公差，用于生产铁合金的超低磷冶金焦；半焦炭或软焦炭；粒度为20-40毫米，用于不超过130平方米生铁制造的LAM焦炭。（中国贸易救济信息网）", "ctime": 1777519374, "time_str": "11:22:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260430/c676409957.shtml"}, {"id": "4304171", "title": "海通期货：Q1财报披露后锂矿股大面积涨停，LC收盘价创年内新高", "content": "我们认为当前碳酸锂的主线逻辑是：当前整个锂电产业链业绩实打实的好，增长前景良好，降波后的LC波动在商品中依然不算低，受资金青睐，在下游排产数据反馈向好可保证兑现基础上，四月底/五月逐步显现的阶段性供需结构性缺口叠加低库存，以及新能源的叙事在油价高企背景下市场愿意相信和资金情绪共同推动的主升浪。依照当前局势发展，津巴布韦出口限制会在5月份左右开始影响国内现货供给，后续架势大概率为现货带着期货走。情绪上LC依然存有分歧，当然如今偏多占绝对主流，30min级别以上均偏多头，多方聚焦津巴供给侧收缩和成本抬升的长线利多逻辑；空方指向近期持续累库，认为供需过剩格局短期未改，市场正在“供给端未来减少”与“当前仍在累库”之间博弈。当前6789逐月升水，近月多头显然不怕接仓单，盘面来看大跌有难度。\n对于碳酸锂，中短线一直不看空，对于供需，只是一个大概，很多数据无法体现，更多关注还是影响锂价因素都有哪些，然后就是当下锂价持续多长时间，然后就是股票市场怎么去定价，什么价格下，市场就不在跟，锂矿和碳酸锂并不是金银这类具有成长属性，周期性的东西，真的冲破20万，市场便会逐渐寻求替代。(海通期货)", "ctime": 1777519194, "time_str": "11:19:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260430/c676409872.shtml"}, {"id": "4304167", "title": "港股芯片股持续拉升，天数智芯涨超16%", "content": "港股芯片股持续拉升，天数智芯涨超16%，壁仞科技涨超10%，中芯国际涨超6%，华虹半导体涨超3%。", "ctime": 1777519119, "time_str": "11:18:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260430/c676409850.shtml"}, {"id": "4304163", "title": "寒武纪成交额达200亿元", "content": "寒武纪成交额达200亿元，现涨17.74%。", "ctime": 1777519040, "time_str": "11 // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

  }
  tbody.innerHTML = PICKS.map(p => {

      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },

    const miniBar = dims.map(d => {

        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
