健米业触及跌停", "content": "粮食概念板块震荡走低，金健米业触及跌停，秋乐种业、万向德农、敦煌种业、亚盛集团、新农开发跟跌。", "ctime": 1792386561, "time_str": "13:09:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261019/c680825393.shtml"}, {"id": "5412467", "title": "冰雪产业板块跌幅扩大，大连圣亚跌停", "content": "冰雪产业板块跌幅扩大，大连圣亚跌停，长白山、晶雪节能、雪人集团跟跌。", "ctime": 1792386349, "time_str": "13:05:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261019/c680825308.shtml"}, {"id": "5412455", "title": "沪深京三市成交额超1万亿元，较上日此时缩量79亿元", "content": "据同花顺iFinD数据，沪深京三市成交额超1万亿元，较上日此时缩量79亿元，预计全天成交金额约1.5万亿元。截至目前，沪市成交额4731亿元，深市成交额5190亿元，北证50成交额81亿元。", "ctime": 1792386273, "time_str": "13:04:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261019/c680825285.shtml"}, {"id": "5412405", "title": "特朗普：泽连斯基可能从未想结束俄乌战事", "content": "美国总统特朗普18日在社交媒体发文批评乌克兰袭击俄罗斯柴油炼油厂，称乌总统泽连斯基可能从未想过结束俄乌战事。 特朗普在帖文中写道：“泽连斯基将俄罗斯的柴油炼油厂作为目标，明知道这些袭击正在严重损害世界柴油市场，包括美国柴油市场。农民、牧场主和各种企业都因此遭受了巨大损失，但俄罗斯仍然以低价向世界输送了数百万桶柴油。” 特朗普称，泽连斯基对此毫不在乎，“坦率地说，欧洲给了他那么多钱，（拜登政府）过去也给了他钱，他不想结束这场战事，而且可能从来都不想结束。” 特朗普还表示，泽连斯基两年前本可以达成比现在更好的协议，“如今他的国家满目疮痍，大片国土沦陷，海疆尽失，男性人口锐减，大量人员负伤或死亡”。 特朗普称，他正推动俄乌和平谈判并且“谈判正在取得重大进展”。 特朗普近来多次抨击泽连斯基。特朗普15日称，泽连斯基“不想解决”乌克兰危机，不值得美国与之打交道。(新华社)", "ctime": 1792386004, "time_str": "13:00:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261019/c680825193.shtml"}, {"id": "5412397", "title": "光伏新规还未实施 部分组件已退出大单竞争", "content": "国内光伏买家的相关业务门槛，将从2027年1月1日起“换新”。届时，光伏组件能效新国标将正式实施，组件进入国内市场须满足新的能效要求。距离实施日期还有不到三个月时间，记者采访获悉，部分光伏买家已提前调整采购要求，一些组件厂商也开始更换参与投标的产品。一家头部组件厂商已将老款PERC（钝化发射极和背面接触，一种光伏电池技术）组件撤出国内央企投标。该厂商价格负责人表示，团队正在重新安排投标方案。该厂效率达标的产品主攻国内大单。他说，新门槛先把不达标产品挡在了投标门外——达不到效率线，价格再低也无从谈起。（经济观察报）", "ctime": 1792385923, "time_str": "12:58:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261019/c680825168.shtml"}, {"id": "5412393", "title": "AI辅助筛查有助于糖尿病患者及时接受眼科诊疗", "content": "英国伦敦卫生与热带医学院近日发布公报说，该校参与的一项随机对照试验发现，在糖尿病视网膜病变筛查中引入人工智能（AI）技术，有助缩短从筛查到专科就诊的时间，可帮助更多需要进一步接受眼科诊疗的患者及时就医。（新华社）", "ctime": 1792385489, "time_str": "12:51:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261019/c680825052.shtml"}, {"id": "5412389", "title": "速卖通将投资AI硬件品牌", "content": "记者获悉，速卖通与天猫今日联合发布“中国品牌全球增长计划”。据悉，速卖通还将对AI硬件品牌进行天使轮投资，提供Brand+及天猫经营支持，目标孵化100+AI硬件品牌。（科创板日报）", "ctime": 1792385414, "time_str": "12:50:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261019/c680825025.shtml"}, {"id": "5412355", "title": "日本教授：高市历史知识肤浅不应当日本首相", "content": "对于日本部分右翼政客参拜靖国神社，日本山口大学名誉教授纈缬厚表示，参拜靖国神社是一种极其危险、极为错误的行为，日本社会应当树立正确的历史观。对于日本首相高市早苗在担任国会议员时期作出“对过去的战争不负责”的相关言论，纐缬厚表示，高市历史认识如此肤浅，不应该成为日本首相。（CCTV国际时讯）", "ctime": 1792384941, "time_str": "12:42:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261019/c680824865.shtml"}, {"id": "5412343", "title": "伍戈：今年来AI及其相关产品对中国出口形成重要拉动", "content": "国家统计局19日公布中国三季度经济“成绩单”。中新社国是直通车当天举行“2026年三季度经济形势分析会”。长江证券首席经济学家伍戈在会上指出，前三季度中国GDP同比增长4.6%，拉动GDP增长的“三驾马车”中，出口的贡献最为突出。展望未来一至两年，他指出，全球宏观环境虽存在地缘政治不确定性，但整体仍有利于中国制造业出口，尤其是人工智能（AI）相关产品出口。今年以来，AI及AI相关产品对中国出口形成重要拉动，从更长的周期看，全球制造业大周期尚未结束。一方面，AI带动算力与基础设施投资增长；另一方面，各国仍在重构产业链，相关领域支出上升，都有望继续支撑外需。总体看，有利于中国制造业出口的外部环境未发生变化。（国是直通车）", "ctime": 1792384675, "time_str": "12:37:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261019/c680824732.shtml"}, {"id": "5412285", "title": "阿里达摩院孟建熠：玄铁芯片目前已经稳定出货超60亿颗", "content": "2026 RISC-V中国峰会上，阿里达摩院首席科学家孟建熠表示：迄今，玄铁芯片目前已经稳定出货超60亿颗，根据Omida预测，至2030年，全球RISC-V处理器年度出货量每年增长近30%，2030年在全球处理器出货份额将达到约25%的市场占有率。阿里达摩院还在会上发布首个车规增强E908A芯片。（科创板日报）", "ctime": 1792383885, "time_str": "12:24:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261019/c680824361.shtml"}, {"id": "5412271", "title": "奥地利航空一航班因炸弹威胁紧急降落在保加利亚", "content": "奥地利航空公司一架从以色列特拉维夫飞往奥地利维也纳的航班18日因炸弹威胁，改道后紧急降落在保加利亚索非亚。机组人员在飞临罗马尼亚上空时接到炸弹威胁，随后决定在索非亚紧急降落。飞机注册号为OE-LZE，载有51名乘客和6名机组人员，安全降落并接受检查。保加利亚交通部已成立危机应对小组，相关部门展开调查。（新华社）", "ctime": 1792383500, "time_str": "12:18:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261019/c680824148.shtml"}, {"id": "5412263", "title": "国产卫星互联网首次实现地球三极联网通信", "content": "记者10月19日从正在执行中国第16次北冰洋考察任务的“极地”号获悉，该船已完成国产卫星互联网北极航线准业务化应用测试，本航次首次成功开展北极、南极、青藏高原联网通信验证。据介绍，在“极地”号、南极秦岭站、西藏自治区拉萨河试验站、自然资源部北海局视频连线中，语音画面清晰流畅，实现了国产卫星互联网全球低时延高带宽通信，验证了国产卫星互联网通信系统在极端低温、高海拔、强风沙、冰雾等多元恶劣环境下运行的稳定性，打通了全球通信“最后的盲区”。(新华社)", "ctime": 1792383083, "time_str": "12:11:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261019/c680823922.shtml"}, {"id": "5412261", "title": "内蒙古国资成立投资平台，出资额120亿元", "content": "企查查APP显示，近日，内蒙古自治区金信易企业服务合伙企业（有限合伙）成立，出资额约120亿元，经营范围包含：以自有资金从事投资活动。企查查股权穿透显示，该合伙企业由内蒙古股权交易中心股份有限公司、内蒙古金融资产管理有限公司等共同持股。", "ctime": 1792383031, "time_str": "12:10:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261019/c680823912.shtml"}, {"id": "5412257", "title": "日本政府正式批准台积电熊本二厂生产3nm芯片", "content": "日本经济产业省16日宣布，核准台积电的熊本二厂生产计划变更申请，熊本二厂将改为生产3nm制程逻辑芯片。台积电熊本二厂预计在2028年12月开始生产，月产能为6000片（以12吋晶圆换算、以下同）。台积电熊本二厂原先计划生产6-12nm芯片，月产能为4.8万片，且也计划生产40nm芯片。（科创板日报）", "ctime": 1792382998, "time_str": "12:09:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261019/c680823889.shtml"}, {"id": "5412247", "title": "伊朗：一艘“违规”油轮在霍尔木兹海峡触雷爆炸", "content": "伊朗伊斯兰革命卫队海军19日表示，一艘“违规”油轮在霍尔木兹海峡南部触及一枚水雷，随后发生爆炸并起火。在伊朗伊斯兰革命卫队旗下媒体赛帕新闻网发表的一份声明中，伊斯兰革命卫队海军称，这艘油轮关闭了全球定位系统（GPS）及导航系统，并无视相关规定，试图通过一条“未经授权”的航线离开霍尔木兹海峡。声明说，伊斯兰革命卫队海军强调，将对任何在霍尔木兹海峡或波斯湾航行期间关闭导航及识别系统的船只予以“严厉且果断的处置”。（新华社）", "ctime": 1792382806, "time_str": "12:06:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261019/c680823777.shtml"}, {"id": "5412239", "title": "预告：国家发改委定于10月20日召开10月份新闻发布会", "content": "国家发展改革委定于2026年10月20日（星期二）上午10:00召开国家发展改革委10月份新闻发布会。", "ctime": 1792382667, "time_str": "12:04:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261019/c680823719.shtml"}, {"id": "5412237", "title": "国家发改委向社会公开征求《电力现货市场基本规则（公开征求意见稿）》意见", "content": "为加快推进全国统一电力市场建设，强化电力市场基础制度规则统一，规范电力现货市场运营和管理，国家发展改革委组织对《电力现货市场基本规则（试行）》（发改能源规〔2023〕1217号）进行了修订，形成了《电力现货市场基本规则（公开征求意见稿）》，现向社会公开征求意见。此次公开征求意见的时间为2026年10月19日至2026年11月18日。", "ctime": 1792382589, "time_str": "12:03:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261019/c680823700.shtml"}, {"id": "5412219", "title": "韩国首尔综指涨幅扩大至1%", "content": "韩国首尔综指涨幅扩大至1%。", "ctime": 1792382217, "time_str": "11:56:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261019/c680823517.shtml"}, {"id": "5412217", "title": "豆包刘星：字节总算力中只有约10%用于视频生成模型的训练和推理", "content": "近日，“国内超一半算力在造爽剧”的话题，引发广泛关注。10月19日，豆包公关负责人刘星在社交平台发文回应，称该算力数据“有些不靠谱”。他表示，就字节而言，公司总算力中只有约10%用于视频生成模型的训练和推理。（第一财经）", "ctime": 1792382103, "time_str": "11:55:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261019/c680823461.shtml"}, {"id": "5412209", "title": "10月19日午间公告一览：方大集团签约沙特体育场幕墙合同20.5亿元", "content": "方大集团公告，2026年10月18日，公司与沙特IKK集团公司组成的合资公司IK // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
