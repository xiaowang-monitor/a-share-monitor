得质押和出借。本次回购的股份将用于实施员工持股计划或股权激励。", "ctime": 1782469206, "time_str": "18:20:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260626/c677750773.shtml"}, {"id": "4605547", "title": "五粮液：选举邓敏为董事长，曾从钦未持股离任", "content": "五粮液公告，因曾从钦无法正常履职，公司于2026年6月26日召开2025年度股东会，免去曾从钦董事职务，其董事长等职务一并自动解除，离任后不在公司及控股子公司任职，截至公告日未持有公司股份。同日，公司第七届董事会2026年第7次会议选举邓敏为第七届董事会董事长，任期自董事会审议通过之日起至第七届董事会任期届满之日止，邓敏同时担任公司法定代表人。", "ctime": 1782469195, "time_str": "18:19:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260626/c677750769.shtml"}, {"id": "4605541", "title": "康缘药业：获得一贯煎颗粒药品注册证书", "content": "康缘药业公告，公司近日收到国家药品监督管理局签发的一贯煎颗粒《药品注册证书》。药品通用名称为一贯煎颗粒，主要成分为地黄、当归、枸杞子、北沙参等，剂型为颗粒剂，规格为每袋相当于饮片15.55g，注册分类为中药3.1类。功能主治为滋阴疏肝，用于肝阴不足，血燥气郁证等。药品有效期为18个月，为处方药。药品注册标准编号为YBZ00392026，批准文号为国药准字C20260014。", "ctime": 1782469132, "time_str": "18:18:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260626/c677750745.shtml"}, {"id": "4605537", "title": "多只权益基金提高权益指数在基准中权重 释放坚定看好资本市场信号", "content": "今日盘后，第二批公募产品基准调整开启，本次调整覆盖产品数量多、管理人范围广、产品类型丰富，涉及权益类、债券类、FOF类、QDII类等多种类型的产品。主动权益类基金方面，部分产品业绩基准告别单一的沪深300，转向中证800、中证A500等覆盖面更广的指数，也有不少产品调整为成长风格或价值风格的指数。值得注意的是，本次有多只权益类基金提升基准中的权益基准权重，体现基金实际的高仓位运作水平，也体现出对资本市场的坚定看好。此外，部分债券基金在基准中增加股票指数、可转债指数，更加贴合产品实际持仓；部分FOF基金的基准则增加了黄金合约收益率，以体现多资产配置特征。（财联社）", "ctime": 1782469118, "time_str": "18:18:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260626/c677750740.shtml"}, {"id": "4605527", "title": "旗滨集团：拟定增募资不超14.27亿元用于超薄柔性玻璃等项目", "content": "旗滨集团公告，公司第六届董事会第十三次会议审议通过2026年度向特定对象发行A股股票预案。公司拟向不超过35名特定投资者发行股票，募集资金总额不超过14.27亿元（含本数），扣除发行费用后用于超薄柔性玻璃（UTG）制造平台及玻璃基板项目（6.36亿元）、高透在线CVD-FTO导电玻璃技改项目（2.42亿元）、高性能新能源汽车玻璃基板降碳减排技改项目（7689万元）、旗滨数字化升级建设项目（1.73亿元）及补充流动资金（3亿元）。本次发行数量不超过发行前总股本的30%，即不超过8.88亿股，发行对象认购股份自发行结束之日起6个月内不得转让。该方案尚需股东会审议通过、上交所审核及中国证监会同意注册。", "ctime": 1782469089, "time_str": "18:18:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260626/c677750732.shtml"}, {"id": "4605517", "title": "基准调整不是基金经理“调仓令” 不会对市场造成冲击", "content": "第二批公募产品基准调整开启，近百家公募集体发布有关基金产品调整业绩比较基准的公告，涉及上千只基金产品。值得注意的是，业绩比较基准调整，调的是“评价标尺”，不是“交易指令”，校准的是“产品坐标”，不是要求基金经理限期买卖资产。此前，首批业绩比较基准调整发布后，部分声音将其误解为调仓指令，并且将部分板块的波动与基准调整直接挂钩，这类理解偏离了业绩比较基准调整的本意，也不符合基金投资运作的实际逻辑。（财联社）", "ctime": 1782469004, "time_str": "18:16:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260626/c677750688.shtml"}, {"id": "4605515", "title": "第二批公募基金基准调整全面开启", "content": "近百家公募集体发布公告，旗下多只基金调整业绩比较基准并修订基金合同等法律文件，合计涉及上千只基金产品。此前《公开募集证券投资基金业绩比较基准指引》于今年3月1日正式施行，首批12家基金管理人旗下195只公募基金已于4月30日发布业绩比较基准调整公告。在首批调整取得积极成效的基础上，第二批存量产品业绩比较基准调整进一步扩围推进，这意味着业绩比较基准规范化建设正从局部试点走向全面深化，从单点突破走向系统推进。（财联社）", "ctime": 1782468988, "time_str": "18:16:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260626/c677750684.shtml"}, {"id": "4605493", "title": "中信银行：受让昆明产业开发投资有限责任公司持有的9.15亿股股份，持股比例为14.52%，获监管批准", "content": "中信银行公告，2026年6月26日，收到云南红塔银行通知，其已收到国家金融监督管理总局云南监管局作出的《云南金融监管局关于云南红塔银行变更股权的批复》，同意本行受让昆明产业开发投资有限责任公司持有的9.15亿股股份，受让后，本行持有云南红塔银行9.15亿股股份，持股比例为14.52%。目前，本行已完成股权转让工作，正式成为云南红塔银行股东。本次交易有助于深化各方战略合作，进一步深耕产业链金融，开拓业务发展新空间。", "ctime": 1782468930, "time_str": "18:15:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260626/c677750657.shtml"}, {"id": "4605495", "title": "联电美股盘前跌超10%", "content": "联电美股盘前跌超10%，现报24.949美元。", "ctime": 1782468930, "time_str": "18:15:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260626/c677750658.shtml"}, {"id": " 国益与太原豪峰污水处理有限公司签署了建设工程施工合同，签约合同价1.97亿元，工期总日历天数210天。", "ctime": 1782467982, "time_str": "17:59:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260626/c677750155.shtml"}, {"id": "4605287", "title": "宏和科技：股东UNICORN ACE调减拟减持比例至不超1.5%", "content": "宏和科技公告，公司股东UNICORN ACE原计划通过大宗交易减持不超过1809.17万股（占总股本2%），现调整为减持不超过1356.88万股（占总股本1.5%），减持期间仍为2026年7月2日至2026年10月1日，减持原因为资金需求。另一股东SHARP TONE原减持计划（通过集中竞价减持不超过1%）保持不变。", "ctime": 1782467972, "time_str": "17:59:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260626/c677750151.shtml"}, {"id": "4605285", "title": "撤下“摇一摇” App开屏广告乱象整治持续推进", "content": "记者注意到，早在2023年，工业和信息化部印发通知，强调不得频繁弹窗干扰用户正常使用，或利用“全屏热力图”、高灵敏度“摇一摇”等易造成误触发的方式诱导用户操作。此后，多部门又多次发文要求App规范信息窗口呈现方式，严禁诱导点击，打击违规“摇一摇”。今年6月9日，工业和信息化部信息通信管理局召开专题会议，针对部分App信息窗口违规跳转行为，指导督促相关互联网平台和智能终端企业，强化App信息窗口呈现方式的规范管理，要求相关企业建立完善在线巡查机制，坚持严守合规边界，完善内部审核和合规管理机制，规范服务行为，优化用户体验。治理开屏广告乱象，重在久久为功。工业和信息化部信息通信管理局有关负责人表示，后续将持续开展常态化检测监测，对发现的违规行为，依法予以约谈、通报、下架App等处置。（新华社）", "ctime": 1782467972, "time_str": "17:59:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260626/c677750150.shtml"}, {"id": "4605277", "title": "5月我国外汇市场总计成交23.14万亿元人民币", "content": "国家外汇管理局今天（6月26日）发布的数据显示，2026年5月，中国外汇市场（不含外币对市场，下同）总计成交23.14万亿元人民币（等值3.38万亿美元）。2026年1—5月，中国外汇市场累计成交124.22万亿元人民币（等值17.97万亿美元）。（央视新闻）", "ctime": 1782467870, "time_str": "17:57:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260626/c677750108.shtml"}, {"id": "4605271", "title": "甬矽电子：拟投资103亿元建设微电子高端集成电路IC封装测试三期项目", "content": "甬矽电子公告，公司拟投资建设微电子高端集成电路IC封装测试三期项目，计划总投资金额103亿元，并已与中意宁波生态园管理委员会及中意宁波生态园控股集团有限公司签署投资协议书。本项目尚需提交公司股东会审议，项目用地需通过法定招拍挂程序取得，存在不确定性。", "ctime": 1782467807, "time_str": "17:56:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260626/c677750069.shtml"}, {"id": "4605267", "title": "大渡河双江口水电站首台机组并网发电", "content": "6月26日，国家能源集团大渡河双江口水电站首台机组顺利实现并网发电，标志着这一国家清洁能源重大工程进入发电运行阶段，为西南地区清洁能源供应体系建设和“双碳”目标实现再添重要支撑。双江口水电站位于四川省阿坝藏族羌族自治州马尔康市、金川县境内，是大渡河上游控制性水库和“龙头”电站，工程以发电为主，兼顾防洪，总装机容量200万千瓦，设计年均发电量约77亿千瓦时。项目历经11年持续建设，目前已完成二期蓄水，整体工程形象满足机组投运条件，首台机组并网后运行工况平稳、安全、可控。（新华社）", "ctime": 1782467777, "time_str": "17:56:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260626/c677750054.shtml"}, {"id": "4605253", "title": "搭载胜科纳米半导体大模型的iWUDI生态系统发布", "content": "在今日举行的第四届半导体第三方分析检测生态圈战略大会上，胜科纳米发布iWUDI智能闭环系统。记者获悉，该系统搭载了全球首套半导体垂类物理大模型ChipMind和数字化生产管理系统WTUI，内置自动化工具调度引擎NanoHub和行业专属数据湖WTLake，可实现FA报告自动生成、智能问答等功能。（科创板日报）", "ctime": 1782467647, "time_str": "17:54:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260626/c677749962.shtml"}, {"id": "4605235", "title": "伊副外长：通过霍尔木兹海峡必须与伊朗协调", "content": "当地时间26日，伊朗外交部副部长加里巴巴迪在社交媒体发文称，安排不明确、平行航线或未考量伊朗作为沿岸国立场的情况下做出决策，都无法保障霍尔木兹海峡的安全通航。加里巴巴迪说，任何可信的框架都必须建立在与伊朗协调并遵循伊美谅解备忘录第五条规定的基础上，否则既定的平行航线将被暂停使用。（央视新闻）", "ctime": 1782467631, "time_str": "17:53:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260626/c677749948.shtml"}, {"id": "4605233", "title": "民德电子：控股子公司增资引入投资者，公司持股比例下降至42.3380%", "content": "民德电子公告，公司控股子公司浙江广芯微电子有限公司拟通过增资扩股方式引入投资者华西银峰投资有限责任公司和昌科知衡数智（北京）创业投资基金中心（有限合伙），其中华西资本以人民币3500万元认购新增注册资本215.66万元，占增资后注册资本3.2864%；昌发展资本以人民币1000万元认购新增注册资本61.62万元，占增资后注册资本0.9390%。公司及广芯微电子其他股东均放弃本次增资优先认购权。增资后广芯微电子注册资本由6284.85万元增加至6562.12万元，公司持有广芯微电子股权比例由44.2059%下降至42.3380%，公司仍为第一大股东且能实施控制，广芯微电子继续纳入合并报表范围。", "ctime": 1782467626, "time_str": "17:53:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com. // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
