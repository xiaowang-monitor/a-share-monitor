 "多氟多公告，预计2026年上半年净利润为4.5亿元–5.6亿元，同比增长776.68%-990.98%。2026年半年度，公司经营业绩同比有较大幅度提升，主要原因：1新能源行业景气度持续向好，储能市场、新能源汽车等下游客户需求稳步增长。公司核心产品六氟磷酸锂受益于行业供需格局优化，量价同比显著回升；公司凭借与优质客户建立的长期稳定合作体系，保障、巩固了市场份额，依托上游原材料一体化布局，为整体盈利提供坚实支撑。2新能源电池业务深度绑定各细分赛道头部企业，上半年产销量实现大幅增长，依托全产业链精细化成本管控，产品毛利水平显著提升。多重因素协同共振，推动公司上半年经营业绩同比大幅增长。", "ctime": 1783678802, "time_str": "18:20:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260710/c678102684.shtml"}, {"id": "4696731", "title": "众泰汽车：公司因涉嫌信息披露违法违规被中国证监会立案", "content": "众泰汽车公告，公司于2026年7月10日收到中国证监会下发的《立案告知书》（编号：证监立案字01120260029号），因涉嫌信息披露违法违规，中国证监会决定对公司立案。目前，公司各项生产经营活动正常有序开展，并将积极配合调查工作。", "ctime": 1783678778, "time_str": "18:19:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260710/c678102672.shtml"}, {"id": "4696729", "title": "消息人士：巴基斯坦与卡塔尔再次斡旋美伊重返谈判", "content": "巴基斯坦方面10日援引巴政府消息人士的话称，巴基斯坦和卡塔尔近日再次与美国和伊朗展开接触，推动双方停止进一步军事打击，并依据美伊上月签署的谅解备忘录重返谈判。消息称，一名接近斡旋进程的巴政府消息人士表示：“巴基斯坦正与卡塔尔一道，同华盛顿和德黑兰保持沟通，劝说双方停止敌对行动，并根据双方达成的协议恢复谈判。”（央视新闻）", "ctime": 1783678770, "time_str": "18:19:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260710/c678102666.shtml"}, {"id": "4696727", "title": "白云山：子公司广州医药增资扩股预挂牌，发行不超9.2亿股", "content": "白云山公告，公司控股子公司广州医药股份有限公司拟在产权交易机构预挂牌，通过增资扩股方式引入战略投资者。本次预挂牌仅为信息预披露，发行股票不超过9.2亿股，预计募集资金总额在10亿元至30亿元之间，交易对象尚不明确，尚未签署交易合同，无履约安排。后续正式挂牌及增资事项尚需履行相关批准程序，存在不确定性。", "ctime": 1783678758, "time_str": "18:19:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260710/c678102656.shtml"}, {"id": "4696721", "title": "上交所：本周对恒尚节能、有研硅、中船特气等异常波动股票以及财通福鑫LOF等溢价较高的基金进行重点监控", "content": "上交所：2026年7月6日至2026年7月10日，上交所对277起拉抬打压、虚假申报等证券异常交易行为采取了自律监管措施，对恒尚节能、有研硅、中船特气等异常波动股票以及财通福鑫LOF等溢价较高的基金进行重点监控，对23起上市公司重大事项等进行专项核查，向证监会上报涉嫌违法违规案件线索1起。", "ctime": 1783678737, "time_str": "18:18:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260710/c678102647.shtml"}, {"id": "4696711", "title": "威邦运动主板IPO审核状态变更为'已问询'", "content": "威邦运动科技集团股份公司主板IPO审核状态变更为'已问询'，保荐机构为国泰海通。", "ctime": 1783678702, "time_str": "18:18:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260710/c678102637.shtml"}, {"id": "4696699", "title": "白云山：多产品新进入国家基药目录，相关营收占比0.64%", "content": "白云山公告，近日国家卫生健康委员会等发布《国家基本药物目录（2026年版）》，公司分公司白云山制药总厂、何济公药厂及子公司光华药业、天心制药、王老吉药业涉及产品新进入或退出该目录。其中小柴胡颗粒、舍曲林、头孢克肟颗粒等23个新品规新进入，同时氯喹、磺胺嘧啶、己烯雌酚、参苓白术散、盐酸克林霉素注射液等产品退出。2025年小柴胡颗粒（光华药业及王老吉药业）营业收入合计占公司2025年度营业收入比例为0.64%，其他新进入及退出产品营收占比较小。本次进入有利于相关产品市场拓展，但短期预计不会对公司经营业绩产生重大影响。", "ctime": 1783678577, "time_str": "18:16:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260710/c678102571.shtml"}, {"id": "4696695", "title": "博敏电子：预计2026年上半年净亏损4200万元-5600万元", "content": "博敏电子公告，预计2026年半年度实现归属于上市公司股东的净利润为-5600万元至-4200万元，与上年同期（法定披露数据）相比，将出现亏损。预计2026年半年度实现归属于上市公司股东的扣除非经常性损益的净利润为-7000万元至-5700万元。", "ctime": 1783678562, "time_str": "18:16:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260710/c678102568.shtml"}, {"id": "4696687", "title": "鸿富诚创业板IPO审核状态变更为'注册生效'", "content": "深圳市鸿富诚新材料股份有限公司创业板IPO审核状态变更为'注册生效'，保荐机构为华源证券。", "ctime": 1783678479, "time_str": "18:14:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260710/c678102536.shtml"}, {"id": "4696685", "title": "科润新材创业板IPO审核状态变更为'已问询'", "content": "苏州科润新材料股份有限公司创业板IPO审核状态变更为'已问询'，保荐机构为国联民生承销保荐。", "ctime": 1783678467, "time_str": "18:14:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260710/c678102529.shtml"}, {"id": "4696679", "title": "元祖股份：预计2026年上半年由盈转亏，净利润亏损5950万元-7140万元", "content": "元祖股份公告，预计2026年半年度归属于母公司所有者的净利润为-7140万元至-5950万元，而上年同期净利润为123.45万元，由盈转亏；预计扣非净利润为-8090万元至-6900万元。业绩预亏主要因消费市场需求放缓、行业竞争加剧导致营收下滑，同时存量门店薪资调整、增量市场新店人力配置及推广引流成本上升，以及投资的基金公允价值变动收益较同期减少约2525万元。", "ctime": 1783678419, "time_str": "18:13:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260710/c678102521.shtml"}, {"id": "4696675", "title": "曲江文旅：收到陕西监管局行政监管措施决定书", "content": "曲江文旅公告，公司于2026年7月10日收到中国证券监督管理委员会陕西监管局下发的《关于对西安曲江文化旅游股份有限公司采取责令改正并对相关责任人采取出具警示函行政监管措施的决定》。经查，公司存在重大事件未按规定披露、内部控制存在缺陷等问题。陕西监管局决定对公司采取责令改正并对相关人员采取出具警示函的行政监管措施。", "ctime": 1783678391, "time_str": "18:13:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260710/c678102513.shtml"}, {"id": "4696657", "title": "鹿山新材：预计2026年上半年净利润同比增加151.00%到276.50%", "content": "鹿山新材公告，预计2026年半年度实现归属于母公司所有者的净利润4000万元到6000万元，与上年同期相比，将增加2406.39万元到4406.39万元，同比增加151.00%到276.50%；预计实现归属于母公司所有者的扣除非经常性损益的净利润2800万元到4200万元，与上年同期相比，将增加2619.58万元到4019.58万元，同比增加1,451.96%到2,227.94%。报告期内，功能性聚烯烃热熔胶胶粒和太阳能电池封装胶膜两类主要产品销售单价提升，产品毛利率明显提高，综合毛利规模同比增长，有效提高公司整体盈利水平。", "ctime": 1783678158, "time_str": "18:09:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260710/c678102416.shtml"}, {"id": "4696647", "title": "齐翔腾达：预计上半年净利润同比增长374.64%-423.88%", "content": "齐翔腾达公告，预计2026年上半年净利润为1.1亿元至1.21亿元，同比增长374.64%至423.88%。2026年，化工行业周期触底后缓慢修复。同时，国际能源价格大幅波动，带动公司主要产品价格显著上涨，盈利能力明显提升，从而推动净利润同比大幅增长。此外，国外化工产能出清进程加速，供应链矛盾凸显，导致市场供需错配。公司积极抢抓海外市场机遇，加大境外市场开拓力度，海外贸易业务收入同比增长超过50%，呈现强劲增长态势。", "ctime": 1783678129, "time_str": "18:08:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260710/c678102403.shtml"}, {"id": "4696641", "title": "北京两机场启动运管委协同运行响应机制应对强降雨", "content": "记者从北京首都机场和大兴机场分别了解到，受强降雨影响，首都机场当前已启动运管委协同运行一级响应机制，会同空管部门、航空公司等联席会商，对航班进行统一协调放行。今日，首都机场计划起降航班1364架次，预计进出港旅客19.66万人次，截至17时，已执行826架次。与此同时，大兴机场也及时启动运管委协同运行机制，紧密联动空管、航司提前研判天气状况和航班运行态势，科学调整航班运行策略，并发布汛情蓝色预警和大面积航班延误预警，携手各驻场单位全力做好航班运行和旅客服务保障工作。截至15时50分，大兴机场已执行航班573架次。（央视新闻）", "ctime": 1783678106, "time_str": "18:08:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260710/c678102390.shtml"}, {"id": "4696639", "title": "山东黄金：选举王成龙为董事长，获8票同意", "content": "山东黄金公告，公司第七届董事会第十四次会议于2026年7月10日召开，审议通过选举王成龙先生为公司第七届董事会董事长，任期至本届董事会任期届满；确认王成龙先生为公司执行董事，并选举其担任法定代表人；同时补选王成龙先生为董事会战略委员会、可持续发展委员会委员，并担任战略委员会主任委员及可持续发展委员会主任委员。上述议案均获8票同意、0票反对、0票弃权通过。", "ctime": 1783678094, "time_str": "18:08:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260710/c678102388.shtml"}, {"id": "4696633", "title": "新城发展：6月合约销售金额约人民币9.57亿元", "content": "新城发展公告，2026年6月，公司实现合约销售金额约人民币9.57亿元，合约销售面积约15.34万平方米。2026年1月至6月累计合同销售金额约人民币63.57亿元，累计销售面积约102.48万平方米。2026年6月，公司房地产出租物业共182个，总建筑面积约1678.64万平方米；租金收入约人民币11.08亿元，商业运营收入约人民币11.87亿元。2026年1月至6月累计租金收入约人民币66.36亿元，累计商业运营收入约人民币71.12亿元。", "ctime": 1783678045, "time_str": "18:07:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260710/c678102367.shtml"}, {"id": "4696627", "title": "石大胜华：预计2026年半年度净利润4.1亿元到4.7亿元", "content": "石大胜华公告，预计2026年半年度实现归属于上市公司股东的净利润4.1亿元到4.7亿元，与上年同期相比，将实现扭亏为盈。上年同期归属于上市公司股东的净利润为-5633.78万元。", "ctime": 1783678009, "time_str": "18:06:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260710/c678102356.shtml"}, {"id": "4696621", "title": "浙江温州发布台风红色预警", "content": "浙江省温州市气象台2026年7月10日17时31分将温州市区台风橙色预警信号升级为台风红色预警信号：受今年第9号台风“巴威”影响，预计温州沿海海面风力今天夜里10—12级，明天13—15级。沿海平原今天夜里9—10级，市区内陆明天9—12级，高山和沿海局部12—14级。 // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `

  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
