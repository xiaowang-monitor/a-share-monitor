32:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260630/c677830161.shtml"}, {"id": "4621331", "title": "大湾区重点工程狮子洋通道主桥先导索顺利过江", "content": "6月30日下午，粤港澳大湾区重点工程狮子洋通道项目控制性工程——狮子洋大桥顺利完成先导索过江，成为大桥跨江段上部结构施工的起点，为后续项目猫道、主缆架设等提供条件。此次先导索过江全程采用工业级重载无人机牵引的方式，在珠江口尚属首次。相比传统船舶拖拽，全程用时从原先的数小时压缩至7分钟左右，最大程度降低对珠江口黄金水道的通航影响，连接起主跨达2180米的狮子洋大桥东、西两座主塔。最终，东西双塔成功实现“云端牵手”。（央视新闻）", "ctime": 1782801116, "time_str": "14:31:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260630/c677830134.shtml"}, {"id": "4621327", "title": "日韩股市集体收涨", "content": "日经225指数收涨0.86%，报70062.32点。韩国综指收涨0.97%，报8476.47点。", "ctime": 1782801110, "time_str": "14:31:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260630/c677830131.shtml"}, {"id": "4621323", "title": "现货白银站上59美元/盎司", "content": "现货白银站上59美元/盎司，日内涨1.3%。", "ctime": 1782801108, "time_str": "14:31:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260630/c677830130.shtml"}, {"id": "4621263", "title": "COMEX白银期货涨超1% LME锡主力合约涨超1%", "content": "COMEX白银期货涨超1%，现报59.27美元/盎司。LME锡主力合约涨超1%，现报50870.0美元/吨。", "ctime": 1782800938, "time_str": "14:28:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260630/c677830055.shtml"}, {"id": "4621251", "title": "江波龙：建设完成mSSD月产能百万交付能力", "content": "2026年6月30日，江波龙mSSD高速存储介质产能迎来重要里程碑，公司宣布已建设完成mSSD月产能百万级交付能力，具备稳定且规模化量产交付条件，可充分匹配市场增量需求，后续产能仍具备持续扩容、翻倍释放的空间。（江波龙微信公众号）", "ctime": 1782800766, "time_str": "14:26:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260630/c677829989.shtml"}, {"id": "4621225", "title": "水晶光电：公司基本面未因大客户调价事项受到明显影响 订单及价格层面均未出现重大变化", "content": "水晶光电6月29日举办路演活动，有投资者提问：“北美大客户近期产品价格调整，是否会影响公司今年的订单与业绩？”水晶光电表示，截至目前，公司基本面未因大客户调价事项受到明显影响，订单及价格层面均未出现重大变化。公司深度参与大客户的光学创新升级，增长核心驱动为新品的放量。2026年，公司北美涂布滤光片业务将继续推进份额提升，同时为大客户两款高端机型的主摄摄像头模组光学创新升级独家供应全新的光学元件，预计将为公司2026、2027年业绩增长提供有力支撑。", "ctime": 1782800635, "time_str": "14:23:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260630/c677829924.shtml"}, {"id": "4621165", "title": "韩国年轻人重新看报纸 电视收视率上升", "content": "韩国年轻人对社交媒体算法推荐模式产生厌倦，开始寻求高质量娱乐内容，回归电影院观影。此外，年轻人重新读起了报纸，电视收视率也有所上升。专家提醒，这一趋势并不必然意味着传统媒体的持久回归，传统媒体必须在数字环境中保持自身公信力。（新华社）", "ctime": 1782800337, "time_str": "14:18:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260630/c677829822.shtml"}, {"id": "4621151", "title": "优必选超仿生人形机器人“优世界U1”全渠道订单破万", "content": "6月30日，在优必选2026年度全球发布会上，董事会主席兼CEO周剑表示，超仿生人形机器人“优世界U1”系列全渠道订单已突破1万台，力争今年交付。据介绍，这也是全球唯一具备规模化量产能力的全尺寸超仿生人形机器人，人形机器人开始从工业场景迈向消费场景。(蓝鲸新闻)", "ctime": 1782800277, "time_str": "14:17:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260630/c677829799.shtml"}, {"id": "4621137", "title": "英伟达机器人团队围绕四大核心方向开放招聘", "content": "英伟达宣布公司机器人团队围绕具身智能、仿真、部署及解决方案架构四大核心方向开放招聘，北京、上海、深圳三地均设有岗位。（人民财讯）", "ctime": 1782800159, "time_str": "14:15:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260630/c677829765.shtml"}, {"id": "4621113", "title": "跨维智能官宣完成B轮10亿元融资", "content": "近日，物理AI与具身智能企业跨维智能官宣完成B轮融资，融资金额10亿元人民币，投后估值超百亿元，即将IPO。本次融资投资方中，深创投、贵阳数字经济基金连续两轮投资；前海母基金、蓝思科技、工银资本、恒健资产、诸瑞资本等入局；南山战新投、成都科创投、四川院士基金等原有股东持续追加跟投。本轮融资将重点用于底层世界模型算法迭代、物理引擎升级、数据基础设施建设、人形机器人能力完善与真实场景落地，持续加速技术、产品与商业闭环进化。（人民财讯）", "ctime": 1782799818, "time_str": "14:10:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260630/c677829677.shtml"}, {"id": "4621077", "title": "三星电机获价值4540亿韩元AI服务器MLCC合同", "content": "三星电机公司周二宣布，已与一家美国客户签署了一份价值4539.95亿韩元（约合2.93亿美元）的合同，为其人工智能（AI）服务器供应多层陶瓷电容器（MLCC），合同金额约占该公司2025年合并营收11.3145万亿韩元的4%。合同期限为一年，自2027年1月1日至2027年12月31日。该公司以保密协议为由，未透露客户身份。不过，业内人士认为，该客户是美国一家大型云服务提供商（CSP）。(科创板日报)", "ctime": 1782799628, "time_str": "14:07:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260630/c677829636.shtml"}, {"id": "4621055", "title": "恒生科技指数涨超2%", "content": "恒生科技指数涨超2%，成分股中，H股中芯国际涨超6%，腾讯控股涨超3%。", "ctime": 1782799575, "time_str": "14:06:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260630/c677829613.shtml"}, {"id": "4620983", "title": "美国最高法院发布多项裁决，美联储理事库克留任", "content": "美国最高法院6月29日发布多项裁决，认定美国总统特朗普有权解除联邦贸易委员会委员丽贝卡·斯洛特的职务，同时驳回联邦政府请求，令美国联邦储备委员会理事莉萨·库克得以留任。（新华社）", "ctime": 1782799435, "time_str": "14:03:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260630/c677829585.shtml"}, {"id": "4620765", "title": "西门子能源首次与德国船厂合作建设2GW海上换流平台", "content": "西门子能源6月30日宣布，与Neptun Smulders Offshore Renewables（NSORe）近日获得德国输电系统运营商50Hertz授予的合同，将在欧洲北海为North Sea Connector 2海上风电并网项目提供电网接入系统，项目投运后可将最高2GW的海上风电输送至陆上。North Sea Connector 2换流平台由NSORe建造。NSORe是德国Meyer Werft集团旗下Neptun Werft与比利时建筑公司Smulders共同成立的合资企业。西门子能源将为该海上换流平台提供输电技术和相关设备。约95%的设备将由西门子能源在德国的工厂制造。(蓝鲸新闻)", "ctime": 1782799167, "time_str": "13:59:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260630/c677829488.shtml"}, {"id": "4620713", "title": "渣打：下半年建议超配科技与通信服务 低配必需消费品", "content": "渣打银行发布2026年下半年全球市场展望。在中国，鉴于整体市场具估值重估潜力，渣打银行转向更偏好风险的立场，配置建议上，科技与通信服务板块维持超配，主要受益于国产芯片自给率提升及人工智能商业化的持续推进；健康护理板块因盈利可见度有限，下调至中性；必需消费品板块因类似原因，下调至低配；公用事业板块则受益于电力需求改善及政策支持，上调至中性。全球来看，2026年下半年，投资者将要应对能源价格、股票供应、投资者仓位和央行政策等多变格局。渣打银行预计，在宏观经济软着陆的环境下，风险资产将继续获得支持。", "ctime": 1782798736, "time_str": "13:52:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260630/c677829382.shtml"}, {"id": "4620711", "title": "存储芯片午后持续走高", "content": "存储芯片午后持续走高，天山电子、深科达此前20CM涨停，正帆科技、中科飞测、聚和材料、伟测科技涨超10%，深科技、恒烁股份、康强电子跟涨。", "ctime": 1782798735, "time_str": "13:52:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260630/c677829380.shtml"}, {"id": "4620595", "title": "沪深京三市成交额超2.5万亿元，较上日此时缩量2927亿元", "content": "据同花顺iFinD数据，沪深京三市成交额超2.5万亿元，较上日此时缩量2927亿元，预计全天成交金额约3.1万亿元。截至目前，沪市成交额11607亿元，深市成交额13247亿元，北证50成交额146亿元。", "ctime": 1782797776, "time_str": "13:36:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260630/c677829128.shtml"}, {"id": "4620583", "title": "科创50指数涨幅扩大至4%", "content": "科创50指数涨幅扩大至4%，现报2211.08点。", "ctime": 1782797600, "time_str": "13:33:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260630/c677829081.shtml"}, {"id": "4620479", "title": "隆基绿能与沙特水务局签署战略备忘录", "content": "据隆基绿能消息，6月28日，隆基绿能在2026年沙特水务周期间与沙特水务局（SWA）签署了一项战略备忘录。 该合作旨在根据沙特2030愿景，推进沙特阿拉伯水务生产、处理和分配基础设施中的可再生能源整合与数字化转型。", "ctime": 1782797231, "time_str": "13:27:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260630/c677828979.shtml"}, {"id": "4620477", "title": "摩根士丹利：美国实际利率走高反映经济增长及美联储政策辩论", "content": "摩根士丹利财富管理在一份报告中表示，实际利率走高似乎反映了经济增长驱动因素以及美联储围绕政策变化的辩论。该机构表示：“虽然评论集中在通胀风险和美联储关于其2%目标的优先事项上，但在中性利率或实际利率可能更高的情况下，货币政策可能如何应对的估计却较少被讨论。“摩根士丹利财富管理表示，这对“更长时间维持高利率“的概念有影响，可能意味着对美联储干预市场看跌期权的定价预期降低，以及央行将更多地受数据驱动而非指引驱动。该机构表示，债券投资者似乎在同时反映石油带来的通胀风险降低以及加息概率上升的预期。", "ctime": 1782797137, "time_str": "13:25:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260630/c677828967.shtml"}, {"id": "4620467", "title": "世界杯带火足球场 订场率暴涨50%", "content": "2026年美加墨世界杯激战正酣，连北京的草坪都跟着“忙”了起来。记者在北京市朝阳区的一个足球场地看到，20多人正在踢球，还有一些足球爱好者自发组织了比赛活动，参与者表示，世界杯开赛后，他们踢球热情更加高涨。目前，这个足球场地周一到周五晚上，周六日和节假日几乎都是饱和状态。相关负责人称：“世界杯赛事热潮，使得整个场地的订场率和以前相比有了大幅度提升，同比提高了40%到50%。” (央视财经)", "ctime": 1782796987, "time_str": "13:23:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260630/c677828920.shtml"}, {"id": "4620447", "title": "阿根廷：出发地采集的汉坦病毒变种与邮轮疫情无关", "content": "阿根廷卫生部29日说，在该国南部省份火地岛省首府乌斯怀亚捕获的啮齿类动物体内发现汉坦病毒，但基因分析表明此次发现的病毒变种与“洪迪厄斯”号邮轮上暴发的汉坦病毒疫情无关。卫生部表示，该结果排除了此次采样的啮齿动物是邮轮疫情传染源的可能性。（新华社）", "ctime": 1782796551, "time_str": "13:15:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260630/c677828812.shtml"}, {"id": "4620433", "title": "上海市新增13款已完成登记的生成式人工智能服务", "content": "据网信上海，截至6月30日，上海市新增13款已完成登记的生成式人工智能服务，累计已完成196款生成式人工智能服务登记。（网信上海）", "ctime": 1782796395, "time_str": "13:13:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260630/c677828771.shtml"}, {"id": "4620425", "title": "港股机器人概念午后走强 优必选涨近10%", "content": "港股机器人概念午后走强，优必选涨近10%，消息面上，优必选旗下品牌研发的全球首款全尺寸超仿生人形机器人于今日即将亮相。", "ctime": 1782796202, "time_str": "13:10:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260630/c677828728.shtml"}, {"id": "4620395", "title": "Kimi估值升至315亿美元 ARR突破3亿美元 收入曲线现Anthropic早期特征", "content": "记者获悉，月之暗面Kimi上一轮200亿美元估值融资于近日完成交割，新一轮融资已经启动，投前估值涨至315亿美元。据接近Kimi的机构人士介绍，Kimi在本轮融资沟通中披露了其最新收入数据：6月中旬，ARR（年度经常性收入）突破3亿美元。Kimi此轮收入增长主要来自模型迭代带动的开发者使用和API收入提升。目前，API收入已占Kimi整体收入7成以上并持续走高。Kimi的收入曲线初现Anthropic早期商业化阶段的特征：开发者调用放量、API占比提升、海外付费用户增长，并由模型能力迭代带动价格体系上移。 (财联社)", "ctime": 1782795945, "time_str": "13:05:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260630/c677828672.shtml"}, {"id": "4620295", "title": "英国拟投入50亿英镑优先发展无人机等无人作战装备", "content": "英国定于6月30日发布新版国防投资计划，拟投入50亿英镑优先发展无人机等无人作战装备。英国首相斯塔默29日在一份声明中说，国防投资计划的重点是攻击型无人机、无人驾驶船只和无人驾驶潜艇等无人作战系统。斯塔默表示，大量使用无人系统是俄乌冲突体现的现代作战特点，英国在这一“颠覆性”领域的投资将使英国防务得到加强。新任英国防务大臣丹·贾维斯也表示，无人作战系统定义了现代战争模式，国防投资计划将使英军更迅速地获得所需装备。（新华社）", "ctime": 1782795525, "time_str": "12:58:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260630/c677828549.shtml"}, {"id": "4620293", "title": "国家能源局：电网企业线上服务平台注册用户数达5.7亿户", "content": "国家能源局今天发布《中国供电发展报告2026》，《报告》显示，我国已建成全球规模最大的电力供应体系，形成覆盖城乡、全域贯通的世界级巨型供电服务网络。《报告》显示，2025年，我国全社会用电量迈上新的里程碑，突破10万亿千瓦时大关，电力用户也接近8亿户，用户体量领跑全球，全国各地还设有供电服务网点9.9万个，从业者超56万人，推动我国供电能力和服务水平跻身国际第一方阵。（央视新闻）", "ctime": 1782795410, "time_str": "12:56:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260630/c677828524.shtml"}, {"id": "4620275", "title": "新疆局地气温或超50℃ 黄淮高温增多华南闷热感强", "content": "随着大陆高压的发展和南方雨带的北抬，本周南北方多地热意增强，不少地区将迎高温天气。6月30日至7月3日，新疆、甘肃西部等地将迎同期少见的酷热，华北、黄淮多地气温会刷新今年来新高，华南则会变得极为闷热，需加强防暑措施，谨防中暑。本周，新疆、甘肃西部、内蒙古西部和宁夏一带热意最强。在持续发展加强的大陆高压控制下，未来4天左右上述地区晴热控场，高温天气发展增多，酷热程度加剧。尤其是在新疆和甘肃西部，不少地方最高气温可超40℃，酷热程度同期少见，甚至可能打破纪录。其中，吐鲁番盆地局部地区气温最高可能达到50℃至52℃，甚至有可能挑战我国实测最高气温纪录52.2℃。（央视新闻）", "ctime": 1782795109, "time_str": "12:51:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260630/c677828464.shtml"}, {"id": "4620263", "title": "五家房企激战168轮 上海静安宅地72.89亿元成交", "content": "上海今日迎来第五批次宅地出让，5宗涉宅用地总起始价104.22亿元。其中，静安区N070402单元081a-08地块吸引保利发展、中海、建发、招商蛇口、华润置地&越秀地产等5家房企参与竞拍。经过168轮竞价，最终该地块由建发以72.89亿元竞得，成交楼面价81665元/平方米，溢价率29.63%。（财联社）", "ctime": 1782794986, "time_str": "12:49:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260630/c677828440.shtml"}, {"id": "4620239", "title": "陕北—安徽±800千伏特高压直流输电工程投运 来自陕北的绿电将点亮大别山区的灯", "content": "国家电网6月30日宣布，陕北—安徽±800千伏特高压直流输电工程当日投运，这是我国“十五五”时期首个投运的特高压直流输电工程，也是国家西电东送的又一标志性工程，来自陕北的绿电将点亮大别山区的灯。工程起于陕西延安宝塔山换流站，途经陕西、河南、安徽三省，止于安徽合肥合州换流站，直流线路全长1000多公里。工程额定电压±800千伏，额定容量800万千瓦。投运后，每年可向安徽输送电量超过360亿千瓦时，其中新能源电量占比超过50%，除了有力支撑安徽及华东地区可靠用电外，每年还替代燃煤消耗550万吨，减少二氧化碳排放1400多万吨，具有显著的节能效益。（新华社）", "ctime": 1782794311, "time_str": "12:38:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260630/c677828260.shtml"}, {"id": "4620225", "title": "美国种植面积报告和季度库存报告公布前交易商调整仓位，CBOT大豆期货收盘下跌", "content": "美国种植面积报告和季度库存报告公布前交易商调整仓位，CBOT大豆期货收盘下跌，基准期约收低1.6%。美国中西部高温天气有望缓解，美豆生长状态整体较好，市场对今晚面积报告和库存报告均有利空预期，美豆下行压力显著升高。巴西大豆创纪录产量压力持续释放，国内正值进口大豆到港高峰期，供应逐渐增加后压榨量保持高位，豆粕产量较大，饲料养殖企业拿货谨慎，豆粕累库速度加快，库存压力持续攀升，即使进口成本上涨增强工厂挺价意愿，但供应继续增加限制了豆粕价格的反弹幅度。（饲料行业信息网）", "ctime": 1782794004, "time_str": "12:33:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260630/c677828129.shtml"}];

    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
