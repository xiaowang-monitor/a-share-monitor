2025年特例单议申请病例243.5万例，审核通过207.1万例，通过率为85.1%。 据悉，通过特例单议审核的医保基金支出约612.6亿元，病例次均医保基金支出2.96万元。 特例单议机制是按病种付费的重要配套机制，主要是针对住院时间长、医疗费用高、新药耗新技术使用等不适合按病种标准支付的病例，经过专家评审通过后可据实或追加支付，其目的是支持医疗机构创新发展、减轻医疗机构收治危重患者顾虑。 国家医保局表示，下一步将持续完善特例单议机制，鼓励医疗机构根据实际自主申报，指导地方医保部门定期公开特例单议结果，支持新药耗新技术临床应用。(新华社)", "ctime": 1779358695, "time_str": "18:18:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260521/c676874026.shtml"}, {"id": "4390839", "title": "甲骨文美股盘前涨超2%", "content": "甲骨文美股盘前涨超2%，现报191.99美元。", "ctime": 1779358662, "time_str": "18:17:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260521/c676874016.shtml"}, {"id": "4390827", "title": "滑坡泥石流风险较高，甘肃发布地质灾害黄色预警", "content": "甘肃省自然资源厅、甘肃省气象局21日16时30分联合发布地质灾害气象风险预警：5月21日17时至5月22日17时，甘肃省甘南藏族自治州（临潭县、卓尼县、舟曲县、迭部县），庆阳市（西峰区、正宁县、宁县），陇南市（武都区、成县、文县、宕昌县、康县、徽县、两当县），定西市（安定区、通渭县、陇西县、渭源县、漳县、岷县），天水市（麦积区、清水县、甘谷县、武山县、张家川回族自治县），白银市（会宁县），平凉市（泾川县、灵台县、崇信县、华亭市）发生崩塌、滑坡、泥石流等地质灾害的风险较高（黄色预警），请注意防范。（央视新闻）", "ctime": 1779358524, "time_str": "18:15:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260521/c676873933.shtml"}, {"id": "4390815", "title": "石药集团：集团开发的布地奈德肠溶胶囊已获得国家药品监督管理局颁发的药品注册批件", "content": "石药集团公告，集团开发的布地奈德肠溶胶囊已获得国家药品监督管理局颁发的药品注册批件。布地奈德是一种皮质类固醇，具有强效的糖皮质激素活性和较弱的盐皮质激素活性，首过代谢程度极高。布地奈德可抑制位于回肠派尔集合淋巴结中的黏膜B细胞的增生和其向浆细胞的分化，从而抑制半乳糖缺陷的IgA1抗体（Gd-IgA1）的产生。其通过减少体循环中的Gd-IgA1抗体和免疫复合物的形成，减少导致肾小球肾炎和肾功能下降的肾小球系膜区免疫复合物的沉积。", "ctime": 1779358399, "time_str": "18:13:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260521/c676873886.shtml"}, {"id": "4390807", "title": "IBM美股盘前涨超5%", "content": "IBM美股盘前涨超5%，现报236.833美元。", "ctime": 1779358339, "time_str": "18:12:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260521/c676873857.shtml"}, {"id": "4390787", "title": "和黄医药：呋喹替尼和信迪利单抗的联合疗法获批", "content": "和黄医药公告，爱优特  (呋喹替尼) 和达伯舒  (信迪利单抗注射液) 的联合疗法获中国国家药监局批准用于治疗晚期或转移性肾细胞癌患者。在FRUSICA-2注册研究中，疾病进展或死亡风险降低63%，中位无进展生存期为22.2个月。", "ctime": 1779357966, "time_str": "18:06:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260521/c676873680.shtml"}, {"id": "4390785", "title": "蔚来美股盘前涨超5%", "content": "蔚来美股盘前涨超5%，一季度总营收255.3亿元，同比增长112.2%。", "ctime": 1779357961, "time_str": "18:06:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260521/c676873677.shtml"}, {"id": "4390783", "title": "蔚来：一季度总营收255.3亿元，同比增长112.2%", "content": "蔚来发布2026年一季度财报。一季度实现经营利润6,680万元。一季度总营收255.3亿元，同比增长112.2%。毛利总额48.6亿元，同比增长428.4%。", "ctime": 1779357871, "time_str": "18:04:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260521/c676873632.shtml"}, {"id": "4390755", "title": "沪市ETF网上发行下周一起正式优化 降低市场运行成本", "content": "记者获悉，沪市ETF网上发行优化业务将于2026年5月25日正式启用，近期将组织通关测试，旨在支持指数化投资高质量发展、降低市场运行成本。根据2025年发布的方案内容，优化主要有三个方面：一是资金划付模式调整，认购期间不再向发行协调人滚动划付认购资金，改由中国结算上海分公司归集，募集结束后清算交收至ETF产品对应结算参与人资金账户；二是新增支持认购资金利息折算基金份额服务；三是优化了最小申赎单位的报送方式。（财联社）", "ctime": 1779357719, "time_str": "18:01:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260521/c676873562.shtml"}, {"id": "4390743", "title": "监管要求券商严防非法销售风险 “一人公司”新三板开户须临柜核实资金来源", "content": "记者了解到，全国股转公司最新下发通知，要求券商切实履行投资者适当性管理职责，严防新三板股票非法销售风险。通知要求，投资者适当性环节，券商面对法人及合伙企业开通权限需核查90日内验资报告或最近一期审计报告；重点核查“一人公司”、自然人出资人众多的合伙企业等群体，“一人公司”开户须临柜核实资金来源与真实意愿，投资者开通权限后60日内大额买入新三板股票需事后风险揭示。券商发现非法中介可疑迹象应及时报告，未勤勉尽责将被采取监管措施。（财联社）", "ctime": 1779357643, "time_str": "18:00:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260521/c676873536.shtml"}, {"id": "4390713", "title": "国家药监局批准尼卡利单抗注射液上市", "content": "近日，国家药品监督管理局通过优先审评审批程序批准Janssen-Cilag International NV申报的尼卡利单抗注射液（商品名：安力威）上市，该品种与常规治疗药物联合用于治疗抗乙酰胆碱受体(AChR)抗体或抗肌肉特异性酪氨酸激酶 (MuSK) 抗体阳性的成人和12岁及以上青少年全身型重症肌无力(gMG)患者。该品种的上市为相关患者提供了新的治疗选择。(国家药品监督管理局)", "ctime": 1779357596, "time_str": "17:59:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260521/c676873503.shtml"}, {"id": "4390695", "title": "中国棉花协会发布关于网传有关储备棉轮出不实信息的辟谣声明", "content": "近日，网络上出现题为《2026年度中央储备棉轮出投放内部实施工作计划》的虚假信息，引发行业关注。据中国棉花协会核实，国家有关部门和协会从未制定过相关文件，所传文件内容纯属捏造。对于故意捏造和传播有关不实信息的任何单位或个人，有关部门将严肃追查，并依法追究其法律责任。后续，国家有关部门将根据市场情况，及时做好中央储备棉轮出工作，具体事项将通过正式渠道对外公布。（中国棉花协会）", "ctime": 1779357471, "time_str": "17:57:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260521/c676873455.shtml"}, {"id": "4390693", "title": "宁波华翔：拟与布雷博股份公司及南京布雷博设立两家合资公司", "content": "宁波华翔公告，公司与布雷博股份公司及南京布雷博于2026年5月21日签署了《股东协议》，拟在中国设立两家合资公司。合资公司一注册资本为1亿元人民币，南京布雷博出资5100万元，占比51%，公司出资4900万元，占比49%。合资公司二注册资本为5000万元人民币，公司出资2550万元，占比51%，南京布雷博出资2450万元，占比49%。两家合资公司将致力于智能底盘相关产品在中国的本地化产业落地与规模化应用。", "ctime": 1779357441, "time_str": "17:57:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260521/c676873444.shtml"}, {"id": "4390683", "title": "中国平安：完成购股，共购得公司H股股票7384.9万股", "content": "中国平安公告，截至本公告披露日，公司2026年度长期服务计划已通过二级市场完成购股，共购得公司H股股票7384.9万股，占公司总股本的比例为0.408%，成交金额合计人民币40.32亿元（含费用），成交均价约为人民币54.54元/股。自愿参与公司2026年度长期服务计划的员工共71374人。", "ctime": 1779357391, "time_str": "17:56:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260521/c676873417.shtml"}, {"id": "4390679", "title": "藏格矿业：完成回购0.32%公司股份", "content": "藏格矿业公告，截至2026年5月20日，公司通过股份回购专用证券账户以集中竞价交易方式累计回购公司股份502.56万股，占公司目前总股本的0.32%。其中，最高成交价为83.87元/股，最低成交价为73.63元/股，成交总金额为4亿元（不含交易费用）。本次回购股份资金来源为公司自有资金，已达到回购股份方案中的回购资金总额下限，且不超过回购资金总额上限。", "ctime": 1779357251, "time_str": "17:54:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260521/c676873251.shtml"}, {"id": "4390677", "title": "热景生物：回购股份出售计划提前终止", "content": "热景生物公告，公司计划自披露出售已回购股份计划之日起15个交易日后的六个月内，通过集中竞价交易方式出售已回购股份不超过185.42万股。截至本公告披露日，公司通过集中竞价方式出售已回购股份数量为77.69万股，约占公司总股本的0.8380%，成交总额为1.01亿元（未扣除交易费用、税金），成交最高价为140.28元/股，最低价为123.8元/股，均价为130.61元/股。公司本次回购股份出售计划提前终止。", "ctime": 1779357246, "time_str": "17:54:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260521/c676873246.shtml"}, {"id": "4390671", "title": "纳微科技：二审判决驳回上诉，维持原判", "content": "纳微科技公告，江苏省高级人民法院对韩寒与苏州纳百管理咨询有限公司的诉讼案作出二审判决，驳回上诉，维持原判。一审判决苏州纳百需赔偿韩寒损失1899.45万元，并驳回韩寒的其他诉讼请求。公司作为第三人未被要求承担责任，本次诉讼不会对公司生产经营及经营性利润产生影响。", "ctime": 1779357131, "time_str": "17:52:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260521/c676873181.shtml"}, {"id": "4390657", "title": "三星芯片员工据估算料将平均获得34万美元奖金", "content": "三星电子最后一刻与工会达成协议避免了罢工，该公司今年可能会向芯片员工发放约40万亿韩元（266亿美元）的奖金。三星半导体部门共有7.8万名员工。不同部门的员工将获得不同数额的奖金，但根据基于计划条款和2026年营业利润估算，员工平均将获得5.13亿韩元，约合34万美元。据3月提交的文件，三星员工2025年平均获得1.58亿韩元。包括韩联社在内的其他估算，在表现强劲的存储芯片部门，个别员工有望获得约6亿韩元奖金。三星未披露各个半导体部门的具体员工人数。此举效仿了竞争对手SK海力士去年的做法，当时这家公司同意发放一笔奖金。三星的实际奖金额将很大程度上取决于公司的盈利和芯片需求。三星拒绝置评。（新浪财经）", "ctime": 1779357055, "time_str": "17:50:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260521/c676873151.shtml"}, {"id": "4390655", "title": "华大基因：子公司涉及1000万英镑诉讼", "content": "华大基因公告，子公司武汉华大医学检验所有限公司作为被告之一，涉及一项尚未量化金额的金钱索赔诉讼，原告诉称索赔额为1000万英镑或以上。案件已立案但尚未开庭审理，对公司本期利润或期后利润的具体影响暂无法判断。公司及子公司将根据案件进展情况依法履行信息披露义务。", "ctime": 1779357018, "time_str": "17:50:18", "s // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流

    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';

  }

    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';

      <div class="flex items-start gap-2">

        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
