公众号消息，为持续深化上海市网约车行业合规治理，整治行业突出问题，切实保障群众出行安全，维护驾驶员与乘客合法权益，6月29日下午，上海市网约车协同监管工作专班牵头，统筹交通、公安、市场监管、人社、数据、通信管理多部门，召开全市网约车平台企业合规治理集中约谈会。全市24家网约车平台及聚合平台企业主要负责人到场参会。针对排查发现的各类问题，会议明确五项硬性合规治理要求：一是各平台从严规范运力准入管理，全面排查清退不合规车辆和从业人员，严禁违规派单；二是健全营运数据常态化自查机制，确保运营数据完整、及时、规范报送监管部门；三是落实安全生产全链条管控，强化人车资质动态核查，筑牢安全运营防线；四是全面规范收费公示机制，明码标价、透明收费，保障司乘双方合法权益；五是同步强化网络安全运维管理，按期完成网络安全等级保护测评，及时排查消除系统安全隐患。", "ctime": 1782733887, "time_str": "19:51:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260629/c677809319.shtml"}, {"id": "4616149", "title": "蓝佛安部长会见巴西财政部部长杜里甘", "content": "2026年6月26日，财政部部长蓝佛安在京会见巴西财政部部长杜里甘。双方主要就当前宏观经济形势、中巴在多双边财金合作机制下的交流与合作等中巴财金合作重点问题交换意见。财政部部长助理常军红、中国进出口银行副行长陈斌、中国银行副行长刘承钢，巴西驻华大使高望，巴西财政部副部长阿伦卡斯特罗、莱亚尔和雷斯等参加会见。 (财政部)", "ctime": 1782733712, "time_str": "19:48:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260629/c677809267.shtml"}, {"id": "4616145", "title": "风华高科：公司为“国内唯一通过英伟达全系列MLCC认证的企业”的信息不属实", "content": "风华高科股票交易严重异常波动的公告，公司关注到近期有媒体提及公司“针对代理商0402、0603芯片电阻、MLCC全线暂停接单”，经核查，以上信息不属实，为做好部分数字系统升级及产品结构调整，公司执行部分产品暂缓接单，随后已恢复接单。公司关注到近期有媒体提及公司为“国内唯一通过英伟达全系列MLCC认证的企业”，经核查，以上信息不属实，截至公告日，英伟达未对公司开展任何产品认证。", "ctime": 1782733690, "time_str": "19:48:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260629/c677809265.shtml"}, {"id": "4616131", "title": "成都高新区企业实现芯片级分子时钟关键突破", "content": "在2026 IEEE超大规模集成电路技术与电路研讨会（VLSI会议）上，成都高新区企业——成都中微达信科技有限公司（简称“中微达信”）发布了新一代 CSMC 芯片级分子时钟工程样机，并通过专题报告与实物样机展示最新研发成果。这一成果在长周期稳定性与短周期精度两项核心指标上实现协同突破，标志着国产高端片上时频技术迈出关键一步，也为成都高新区量子科技发展注入新的技术支撑。(21世纪经济报道)", "ctime": 1782733605, "time_str": "19:46:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260629/c677809231.shtml"}, {"id": "4616117", "title": "欣锐科技：董事何兴泰拟减持公司不超过0.0044%股份", "content": 0jqka.com.cn/20260629/c677809119.shtml"}, {"id": "4616051", "title": "华发股份：拟公开挂牌转让珠海华桐房地产开发有限公司60%股权", "content": "华发股份公告，全资子公司珠海华欣投资发展有限公司拟通过公开挂牌方式转让其持有的珠海华桐房地产开发有限公司60%股权。根据资产评估报告，挂牌底价为6.97亿元。本次转让最终价格及交易对手以公开挂牌交易结果为准。", "ctime": 1782733208, "time_str": "19:40:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260629/c677809034.shtml"}, {"id": "4616047", "title": "甬矽电子：公司2.5D封装产品线目前正在与客户送样验证中，尚未实现量产", "content": "甬矽电子股票交易风险提示公告，公司经营业绩受宏观经济、下游市场发展态势、公司产品竞争力等多种因素影响，具有一定的不确定性。公司关注到近期市场及媒体对先进封装关注度较高。公司2.5D封装产品线（HCOS产品系列）目前正在与客户送样验证中，尚未实现量产，2025年度公司2.5D封装产品线实现收入为194.97万元，为公司向客户收取的工程开发费在当年确认的收入金额，占公司全年营业收入的比例极低，目前对公司业绩不具有重大影响。", "ctime": 1782733199, "time_str": "19:39:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260629/c677809032.shtml"}, {"id": "4616043", "title": "Rocket Lab美股盘前涨超10%", "content": "Rocket Lab美股盘前涨超10%，现报93.1美元。", "ctime": 1782733196, "time_str": "19:39:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260629/c677809030.shtml"}, {"id": "4616039", "title": "神工股份：公司处于半导体产业上游，下游需求的波动会影响公司业务", "content": "神工股份股票交易异常波动暨风险提示公告，公司处于半导体产业上游，产品销往中、日、韩等市场，下游产业链条较长，存在因库存逐级消耗所带来的滞后效应和放大效应；此外，中国国产化芯片制造供应链仍在发展成熟之中，技术工艺仍存在较大的改善空间，客户需求呈现多元化、多变的特点。因此，下游需求的波动会影响公司业务。", "ctime": 1782733148, "time_str": "19:39:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260629/c677809022.shtml"}, {"id": "4616035", "title": "特朗普坚称美伊会谈“将于明日在多哈举行”", "content": "美国总统特朗普29日在社交媒体发文称，伊朗已提出会谈请求，“会谈将于明日在（卡塔尔）多哈举行”。（新华社）", "ctime": 1782733131, "time_str": "19:38:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260629/c677809013.shtml"}, {"id": "4616019", "title": "有研硅：公司所处的半导体行业具有较强的周期性", "content": "有研硅股票交易异常波动暨风险提示公告，近期半导体硅片行业相关新闻及市场传闻较多。公司所处的半导体行业具有较强的周期性，受宏观经济形势、下游消费电子需求及行业供需关系等多重因素影响，行业波动会对公司业务造成一定影响。", "ctime": 1782733081, "time_str": "19:38:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260629/c677809002.shtml"}, {"id": "4616007", "title": "伊朗军方仅允许船只经拉腊克岛以南航道通过霍尔木兹海峡", "content": "当地时间29日下午，伊朗军方通告称，所有通过霍尔木兹海峡的船只仅被允许从拉腊克岛以南航道通行。此前，伊朗方面曾在28日发布消息称，船只通过霍尔木兹海峡仍需与革命卫队协调，进入波斯湾的船只最安全的航线位于霍尔木兹岛以南，而驶离波斯湾的船只则应选择拉腊克岛以南航道通行。（央视新闻）", "ctime": 1782732941, "time_str": "19:35:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260629/c677808944.shtml"}, {"id": "4616003", "title": "兴福电子：在研产品电子级红磷近期被市场高度关注，可能存在过于炒作情形", "content": "兴福电子股票交易风险提示公告，公司在研产品电子级红磷近期被市场高度关注，可能存在过于炒作情形。截至目前，公司电子级红磷尚处于实验室小试阶段，实验室样品纯度、制备规模等指标尚不能达到产业化的条件，目前尚未形成收入，未来能否产业化，以及何时产业化均具有不确定性。", "ctime": 1782732928, "time_str": "19:35:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260629/c677808940.shtml"}, {"id": "4615991", "title": "*ST大晟：公司股票将于7月1日撤销退市风险警示", "content": "*ST大晟公告，公司股票将于2026年7月1日撤销退市风险警示，证券简称由“*ST大晟”变更为“大晟文化”，日涨跌幅限制由5%变为10%。股票将于2026年6月30日停牌一天，自2026年7月1日起复牌交易。", "ctime": 1782732722, "time_str": "19:32:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260629/c677808862.shtml"}, {"id": "4615975", "title": "今年上半年全国特种设备安全形势总体平稳", "content": "今天（29日）是全国特种设备安全日，记者从上海举办的2026年“全国特种设备安全日”主会场活动上了解到，今年上半年，全国特种设备未发生重特大事故，安全形势总体平稳。市场监管总局有关负责人介绍，全国市场监管系统持续推进安全生产治本攻坚三年行动，深入开展化工企业特种设备排查整治，检查化工企业4.47万家次，督促整改隐患4.68万项，开展电梯安全筑底三年行动，累计排查整改隐患电梯13.2万台。下一步，市场监管总局将加快制定《客运索道安全技术规程》、修订《大型游乐设施安全要求》强制性国家标准，提高涉旅特种设备基本安全要求。同时全面提升特种设备数字化监管、非现场监管水平。加强特种设备追溯体系建设，实施全生命周期质量追溯和源头治理。（央视新闻）", "ctime": 1782732683, "time_str": "19:31:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260629/c677808841.shtml"}, {"id": "4615939", "title": "东方钽业：原材料价格及产品销售价格变化直接影响公司的利润水平", "content": "东方钽业股票交易异常波动公告，公司主要从事稀有金属钽、铌及合金等的研发、生产、销售和进出口业务。公司主要产品原材料为钽铌矿石，钽铌矿石原料90%以上依赖进口，海外进口原材料会受国际政治、宏观经济等多种因素的影响，会导致一定时期内原材料供应不足或价格波动较大的风险。公司钽铌及其合金产品的原材料占其主营业务成本比例最高，为公司成本的主要构成部分，原材料价格及产品销售价格变化直接影响公司的利润水平。请投资者充分关注原材料、产品价格涨跌趋势及未来供需关系变化均存在较大不确定性。", "ctime": 1782732604, "time_str": "19:30:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260629/c677808809.shtml"}, {"id": "4615933", "title": "*ST艾艾：公司股票将于7月1日撤销退市风险警示", "content": "*ST艾艾公告，公司股票将于2026年6月30日停牌一天，2026年7月1日起复牌并撤销退市风险警示，证券简称变更为“艾艾精工”，日涨跌幅限制由5%变为10%。2025年年度实现利润总额4945.2万元，归属于母公司所有者的净利润为4383.99万元，营业收入为3.3亿元，归属于上市公司股东的净资产为4.52亿元。", "ctime": 1782732465, "time_str": "19:27:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260629/c677808764.shtml"}, {"id": "4615931", "title": "快意电梯：控股股东快意股权拟协议转让2525.16万股，占总股本7.5%", "content": "快意电梯公告，公司控股股东东莞市快意股权投资有限公司拟通过协议转让方式向实际控制人罗爱文女士转让其持有的无限售流通股2525.16万股，占公司总股本的7.5%。转让价格为12.35元/股，转让价款合计为3.12亿元。转让完成后，公司控股股东仍为东莞市快意股权投资有限公司，实际控制人仍为罗爱文女士。本次权益变动尚需经深圳证券交易所合规性确认，并在中国证券登记结算有限责任公司深圳分公司办理股份转让过户登记手续。", "ctime": 1782732452, "time_str": "19:27:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260629/c677808759.shtml"}, {"id": "4615923", "title": "委内瑞拉首都加拉加斯又有明显震感", "content": "委内瑞拉当地时间29日清晨，首都加拉加斯又有明显震感。（央视新闻）", "ctime": 1782732355, "time_str": "19:25:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260629/c677808741.shtml"}, {"id": "4615913", "title": "迈信林：公司拟向A公司采购算力服务器相关设备，合同总金额约为8.9亿元", "content": "迈信林公告，公司与A公司签署《设备采购合同》，约定公司向A公司采购算力服务器相关设备，合同总金额约为8.9亿元（含税）。合同的履行需要公司前期投入大量资金用于采购算力服务器相关设备， , "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260629/c677808574.shtml"}, {"id": "4615851", "title": "李强主持召开国务院常务会议，研究当前外贸形势和贸易强国建设有关工作", "content": "李强主持召开国务院常务会议，研究当前外贸形势和贸易强国建设有关工作。(央视)", "ctime": 1782731682, "time_str": "19:14:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260629/c677808546.shtml"}, {"id": "4615835", "title": "李强主持召开国务院常务会议，听取人工智能发展情况汇报", "content": "据央视新闻，李强主持召开国务院常务会议，听取人工智能发展情况汇报。会议指出，要深刻把握人工智能演进趋势，完善支持政策和治理体系，牢牢掌握发展主动权。要加力推进人工智能创新突破，加快关键技术攻关和超大规模智算集群建设，强化高质量数据供给，加强人才、资金等要素保障，支持企业开展基础研究和前沿探索。要深入实施“人工智能+”行动，发挥我国产业体系完备、应用场景丰富等优势，促进智能产品和服务加快规模化商业应用。要守牢人工智能安全底线完善科技伦理、测试认证等制度规则，构建动态适应、分级分类的安全监管体系，加强国际人工智能治理合作。", "ctime": 1782731607, "time_str": "19:13:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260629/c677808516.shtml"}, {"id": "4615823", "title": "合肥城建：公司与长鑫科技无任何业务往来", "content": "合肥城建股价异动的公告，公司目前主营业务为地产开发与销售，不涉及半导体、芯片及存储等相关领域，短期内也无转型计划。截至本公告披露日，公司与长鑫科技无任何业务往来。", "ctime": 1782731560, "time_str": "19:12:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260629/c677808509.shtml"}, {"id": "4615801", "title": "王沪宁出席建设强大国内市场调研协商座谈会", "content": "建设强大国内市场调研协商座谈会6月29日在京召开，就有关民主党派中央、无党派人士开展的重点考察调研成果进行协商。中共中央政治局常委、全国政协主席王沪宁出席并讲话。 王沪宁对有关民主党派中央、无党派人士围绕建设强大国内市场深入调查研究、积极建言献策给予充分肯定。他表示，建设强大国内市场是构建新发展格局、推动高质量发展的战略支撑，是进一步全面深化改革、构建高水平社会主义市场经济体制的重要任务。要锚定“十五五”时期建设强大国内市场的任务部署，围绕“五统一、一开放”的基本要求和重点难点问题，研究提出更具深入度、更有建设性的对策建议，为党和政府科学决策、有效施策提供参考。要提高中国特色社会主义参政党和参政力量履职质效，抓好思想政治引领、议政建言、自身建设等工作，以多党合作所长为党和国家事业发展广泛凝心聚力。 民革中央主席郑建邦、民盟中央主席丁仲礼、民进中央主席蔡达峰、台盟中央主席苏辉、无党派人士代表郭雷在座谈会上介绍调研成果，并就加快建设全国统一的能源市场，深化城乡土地制度改革，扩大文化消费，深入实施提振消费专项行动、积极拓展有效投资空间，完善有利于全国统一大市场建设的体制机制等，提出务实中肯的政策建议。 (新华社)", "ctime": 1782731469, "time_str": "19:11:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260629/c677808477.shtml"}, {"id": "4615783", "title": "ST龙韵：段佩璋受让方小琴5.15%公司股份", "content": "ST龙韵公告，实际控制人方小琴与段佩璋签署《股份转让协议》，方小琴拟以10.23元/股的价格转让其持有的474.6万股公司无限售流通股份给段佩璋，占公司总股本的5.15%。本次权益变动后，段佩璋将持有公司股份2784.03万股，占公司股份总数的30.21%。", "ctime": 1782731368, "time_str": "19:09:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260629/c677808418.shtml"}, {"id": "4615705", "title": "圆通速递：股东杭州灏月减持公司股份，合计持股比例降至15.00%", "content": "圆通速递公告，股东杭州灏月企业管理有限公司及其一致行动人杭州阿里创业投资有限公司和浙江菜鸟供应链管理有限公司合计持股比例从15.87%减少至15.00%。杭州灏月在2026年6月23日至6月29日期间，通过大宗交易方式转让公司股份2982.43万股。此次变动不违反承诺，不触发强制要约收购义务，也不会导致公司控股股东和实际控制人变化。", "ctime": 1782731104, "time_str": "19:05:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260629/c677808227.shtml"}, {"id": "4615691", "title": "沃顿科技：涉及半导体及液冷领域的业务收入占公司营业收入比例不超过1%", "content": "沃顿科技股票交易异常波动的公告，公司关注到近期市场对半导体及液冷行业关注度较高，公司的主营业务为反渗透膜、纳滤膜等膜产品生产制造、膜分离工程业务以及棕纤维床垫业务。2026年初至本公告披露日，涉及半导体及液冷领域的业务收入占公司营业收入比例不超过1%。", "ctime": 1782731051, "time_str": "19:04:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260629/c677808217.shtml"}, {"id": "4615539", "title": "兰石重装：拟终止盘锦浩业EPC募投项目并将剩余募集资金永久补充流动资金", "content": "兰石重装公告，公司拟终止盘锦浩业EPC募投项目并将剩余募集资金永久补充流动资金。盘锦浩业EPC项目总体建设进度已达95%，因业主自身原因收尾工程一直处于停缓建状态。现业主方盘锦浩业化工有限公司进入破产清算，项目无法复工，对募集资金使用效率产生影响，公司拟在履行相应程序后终止该募投项目并将剩余募集资金永久补充流动资金。剩余募集资金金额为815万元（实际金额以资金转出当日专户余额为准）。", "ctime": 1782730795, "time_str": "18:59:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260629/c677808123.shtml"}, {"id": "4615535", "title": "川能动力：控股股东权益变动进展，股份过户及工商变更尚未完成", "content": "川能动力公告，公司此前披露控股股东能投集团与四川省投资集团实施新设合并设立四川能源发展集团，合并完成后公司控股股东由能投集团变更为四川能源发展集团，实际控制人仍为四川省国资委。截至本公告披露日，因原合并主体注销所需时间较长 function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
