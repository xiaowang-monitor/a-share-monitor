.score-bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s; }
.up { color: var(--red); }
.down { color: var(--green); }
.pulse { animation: pulse 2s infinite; }
@keyframes pulse {

  50% { opacity: 0.5; }

45", "title": "江苏省水利厅发布苏南运河洪水橙色预警", "content": "江苏省水利厅2026年8月11日15时变更发布苏南运河洪水橙色预警。相关流域、区域各级政府及有关部门要密切关注雨水情，加强应急值守和分析研判，组织巡堤查险，做好应急抢险准备。（界面新闻）", "ctime": 1786433267, "time_str": "15:27:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260811/c678856813.shtml"}, {"id": "4934435", "title": "扎克伯格呼吁美国政府重新审视AI模型蒸馏政策", "content": "美国“元”公司首席执行官马克·扎克伯格10日在公司官网上发文强调开源人工智能（AI）的重要性，并呼吁美国政府“重新审视模型蒸馏和训练数据使用等方面的政策”，保护让模型在研发过程中能够向其他模型学习的原则。 扎克伯格在题为《未来属于每个人》的文章中说，模型能够向其他模型学习是开源生态系统运行的重要原则。所有人工智能模型都源于人类知识。一些人试图将蒸馏描述为有害行为，但他认为，应当保护“可以从任何能够观察到的事物中学习”这一原则。 模型蒸馏是人工智能模型研发领域的一项基础技术，通常指将较大型的人工智能模型所包含的知识高效迁移至轻量级模型。随着生成式人工智能研发竞争加剧，模型蒸馏也成为行业关注和争议的话题。 扎克伯格表示，美国实验室在训练数据方面受到更多限制。美国如果希望本国开源模型长期保持领先，就应减少这些额外的障碍。限制外国开源模型并非有效解决办法。 他认为，限制个人和企业使用领先的开源模型，无论这些模型来自哪里，都会降低用户能够获得的人工智能的质量，并使人工智能进一步集中化，而非赋予人们更多权利。 扎克伯格还说，“元”公司将继续坚定支持开源，包括开源人工智能模型。随着公司的超级智能实验室投入运行，公司将恢复发布开源模型。(新华社)", "ctime": 1786433015, "time_str": "15:23:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260811/c678856730.shtml"}, {"id": "4934431", "title": "找矿成果+1！四川一新矿物获国际认证", "content": "由长安大学与中国科学院广州地球化学研究所、中国科学院地球化学研究所等单位联合发现、命名并申报的新矿物——乌斯河锗矿，近日正式获得国际矿物学协会新矿物命名及分类委员会批准。这是我国发现的首个独立锗酸盐矿物。(央视新闻)", "ctime": 1786432998, "time_str": "15:23:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260811/c678856726.shtml"}, {"id": "4934405", "title": "乌克兰称俄军大规模袭击造成至少9人死亡", "content": "据乌克兰地方官员和乌国家紧急情况局11日发布的消息，10日以来，扎波罗热、第聂伯罗彼得罗夫斯克、基辅等乌克兰多地遭俄军大规模袭击。截至11日上午，袭击已造成至少9人死亡，另有数十人受伤。 乌克兰扎波罗热地区军事行政长官费奥多罗夫11日上午在社交媒体发文称，过去一天，俄军使用导弹、无人机、多管火箭炮和火炮对扎波罗热地区发动大规模袭击，造成6人死亡，52人受伤，部分基础设施遭到破坏。 乌国家紧急情况局11日上午在社交媒体发文称，俄军当天凌晨对基辅市发动导弹袭击，该市一处仓库被击中并起火，过火面积达1200平米，袭击造成1人受伤。目前火势已得到控制。 乌国家紧急情况局说，俄军空袭和炮击还导致第聂伯罗彼得罗夫斯克州3人死亡，5人受伤，当地物流设施遭到破坏。(新华社)", "ctime": 1786432778, "time_str": "15:19:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260811/c678856616.shtml"}, {"id": "4934389", "title": "澳央行维持利率不变 警告通胀风险犹存", "content": "澳大利亚储备银行（央行）11日宣布将基准利率维持在4.35%不变，符合市场预期。这是澳央行再次维持利率不变，但同时也警告通胀风险犹存。 澳大利亚央行当天发表声明说，货币政策委员会一致作出上述决定。声明指出，尽管中东冲突对通胀的影响迄今为止低于预期，但澳大利亚总体通胀率仍然过高，经济活动和通胀前景都存在不确定性。 澳大利亚统计局数据显示，该国消费者价格指数同比涨幅从今年5月的4.0%回落至6月的3.8%，仍高于澳央行设定的2%至3%的目标区间。 澳央行今年以来已召开5次货币政策会议，2月、3月和5月分别将基准利率上调25个基点，6月维持利率不变。澳央行货币政策委员会下一次会议将于9月举行。(新华社)", "ctime": 1786432736, "time_str": "15:18:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260811/c678856608.shtml"}, {"id": "4934387", "title": "一艘沙特船只在曼德海峡遭袭", "content": "据伊朗学生通讯社11日报道，一艘沙特阿拉伯船只在曼德海峡遭到袭击，至少3人死亡。(新华社)", "ctime": 1786432690, "time_str": "15:18:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260811/c678856602.shtml"}, {"id": "4934377", "title": "哥伦比亚对原产于中国的柠檬酸启动反倾销调查", "content": "8月3日，哥伦比亚贸工旅游部在官方公报发布2026年第548号公告，应哥伦比亚生产商SUCROAL S.A.申请，对原产于中国的柠檬酸启动反倾销调查。本案倾销调查期为2025年3月19日至2026年3月18日。涉案产品的哥伦比亚税号为2918.14.00.00。公告自发布之日起生效。（中国贸易救济信息网）", "ctime": 1786432489, "time_str": "15:14:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260811/c678856554.shtml"}, {"id": "4934371", "title": "台风“白海豚”过境后 宁波舟山港生产作业有序恢复", "content": "8月10日20时，随着台风“白海豚”过境后首艘大型集装箱船——“诚达”轮平稳驶入港区，缓缓靠泊北仑第二集装箱码头2号泊位，宁波舟山港外贸海运作业有序恢复。“诚达”轮船舶总长255米，本次靠泊期间，预计该轮将在宁波舟山港完成装卸2232标准箱作业。为保障台风后首艘大型船舶安全进港作业，宁波海事执法人员及时向船舶播报港区通航信息、发布安全提醒，动态关注周边通航环境及水流变化，为船舶全程护航。（新华社）", "ctime": 1786432430, "time_str": "15:13:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260811/c678856545.shtml"}, {"id": "4934361", "title": "特斯拉在美召回超2万辆Model 3和Model Y，因近光灯亮度超标", "content": "美国国家公路交通安全管理局（NHTSA）公布召回信息显示，特斯拉因部分车辆近光灯亮度可能超过法规要求，召回20349辆Model 3和Model Y车型。此次召回涉及2017年至2023年款Model 3以及2020年至2023年款Model Y。NHTSA表示，相关车辆近光灯输出亮度可能过高，可能降低迎面车辆驾驶员的可视性，增加碰撞风险。（界面新闻）", "ctime": 1786432264, "time_str": "15:11:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260811/c678856494.shtml"}, {"id": "4934359", "title": "波音777宽体客机改装货机生产线落地青岛，计划9月投产", "content": "近日，美国猛犸货机公司与山东太古飞机工程有限公司达成战略合作，将在青岛胶东国际机场建设中国首条波音777宽体客机改装货机生产线。根据规划，猛犸在全球共布局9条客改货生产线，其中美国沃斯堡5条、英国曼彻斯特2条、中国青岛2条（首条计划2026年9月正式投产，第二条预计2027年建成投用）。(新浪财经)", "ctime": 1786432251, "time_str": "15:10:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260811/c678856491.shtml"}, {"id": "4934341", "title": "美不断收紧移民政策，今年以来吊销17.5万份签证", "content": "美国国务院10日发表声明说，自特朗普2025年1月开始其第二个总统任期以来，美国政府已吊销逾17.5万份非移民签证。声明说，大部分外籍人员签证被吊销的原因包括袭击、酒后驾驶、盗窃和毒品犯罪，另有相当一部分签证因鲁莽驾驶、性犯罪、虐待儿童、欺诈和挪用公款等被吊销。声明说，美国务院针对各类危害美国公民、宣扬暴力伤害美国人、组织非法生育旅游、实施诈骗的犯罪分子吊销签证，并将动用“一切可用手段”打击滥用美国签证的人。（新华社）", "ctime": 1786432080, "time_str": "15:08:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260811/c678856417.shtml"}, {"id": "4934331", "title": "芬兰研究机构：欧盟仍是俄天然气最大买家", "content": "芬兰能源与清洁空气研究中心10日发布的报告显示，尽管欧盟持续减少对俄罗斯能源的依赖，但仍是俄罗斯液化天然气和管道天然气的最大买家。报告说，以7月为例，俄液化天然气出口总量的49%流向欧盟。在管道天然气方面，欧盟进口占比为32%。数据显示，欧盟7月支付俄罗斯约15亿欧元（1欧元约合7.78元人民币），是俄化石燃料第四大买家。在俄能源出口收入中，管道天然气和液化天然气分别贡献5.61亿欧元和5.26亿欧元。（央视新闻）", "ctime": 1786432043, "time_str": "15:07:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260811/c678856402.shtml"}, {"id": "4934275", "title": "期货收评：地缘风暴引爆原油系！低硫燃油暴涨超6% 欧线集运重挫超4%！", "content": "期货收评：截止收盘，国内期货主力合约有涨有跌。低硫燃料油、燃料油涨超6%，原油涨近6%，焦煤涨超5%，甲醇、丙烯涨超4%，液化石油气、纯碱涨近4%。跌幅方面，集运欧线跌超4%，鸡蛋、纸浆跌超2%，尿素、沪锡、胶版纸跌超1%，铂跌近1%。", "ctime": 1786431767, "time_str": "15:02:47", "stock_code": "", "stock_name": "", "stock_market": "", ": "股指期货午盘收盘，主力合约涨跌互现。沪深300股指期货(IF)主力合约跌0.32%，上证50股指期货(IH)主力合约跌0.87%，中证500股指期货(IC)主力合约涨0.01%，中证1000股指期货(IM)主力合约涨0.11%。", "ctime": 1786431623, "time_str": "15:00:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260811/c678856263.shtml"}, {"id": "4934165", "title": "五粮液集团等成立新材料科技公司", "content": "企查查APP显示，近日，宜宾普华新材料科技有限责任公司成立，经营范围包含：新材料技术研发、电子专用材料制造、电池制造等。企查查股权穿透显示，该公司由四川省宜宾五粮液集团有限公司全资子公司四川省宜宾普什集团有限公司等共同持股。", "ctime": 1786431460, "time_str": "14:57:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260811/c678856215.shtml"}, {"id": "4934153", "title": "中国纺织品进出口商会：1—6月我国纱线面料出口426.8亿美元 同比增长2.8%", "content": "中国纺织品进出口商会数据显示，从纱线面料整体出口情况看，2026年1—6月，我国纱线面料出口426.8亿美元，同比增长2.8%。分产品来看，纱线出口80.7亿美元，同比增长8.1%；面料出口346.1亿美元，同比增长1.7%。", "ctime": 1786431410, "time_str": "14:56:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260811/c678856183.shtml"}, {"id": "4934151", "title": "花旗：投资者转向看多股市，空头头寸面临风险", "content": "花旗策略师表示，过去一周欧美市场持仓情况出现修复，空头承压，标普500指数空头尤为明显。相关团队称，上周两地市场均有投资者投入新增资金，并非单纯平掉看空仓位。美国市场方面，本轮上涨令空头亏损不断累积；标普500庞大的空头头寸，若市场持续缓步走高，或将遭遇被迫回补。", "ctime": 1786431393, "time_str": "14:56:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260811/c678856176.shtml"}, {"id": "4934139", "title": "持续遭无人机袭击 利比亚或关闭一炼油厂", "content": "利比亚国家石油公司11日说，如果针对西部城市扎维亚石油设施的无人机袭击持续，该公司可能宣布遭遇“不可抗力”并全面停止扎维亚炼油厂运营。当地石油设施近日连续遭遇无人机袭击。利比亚国家石油公司说，最新一次无人机袭击针对扎维亚炼油公司运营的一座油调和及灌装厂，无人机坠落在一个主要储油罐和一片输油管网附近。目前暂无人员伤亡或财产损失报告。(央视新闻)", "ctime": 1786431198, "time_str": "14:53:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260811/c678856119.shtml"}, {"id": "4934073", "title": "甘咨询上演“地天板”", "content": "甘咨询盘中涨停，上演“地天板”，现报 // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');

    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>

      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
