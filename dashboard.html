.score-bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s; }
.up { color: var(--red); }
.down { color: var(--green); }
.pulse { animation: pulse 2s infinite; }
@keyframes pulse {

  50% { opacity: 0.5; }

ime": 1784624606, "time_str": "17:03:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260721/c678324285.shtml"}, {"id": "4767653", "title": "紫光股份：调整控股子公司股权转让暨关联交易方案", "content": "紫光股份公告，公司全资子公司苏州紫光数码转让其持有的紫光科贷65%股权的交易对方由紫光长青变更为紫光长青的控股子公司紫光云数，转让价格仍为2.76亿元。紫光云数是紫光长青的控股子公司，本次交易构成关联交易。", "ctime": 1784624602, "time_str": "17:03:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260721/c678324282.shtml"}, {"id": "4767649", "title": "长龄液压：夏继发拟协议转让公司5%股份给女婿范春晓", "content": "长龄液压公告，股东夏继发拟协议转让公司5%股份给女婿范春晓，转让价格为63.55元/股，转让总价为人民币5.95亿元。", "ctime": 1784624574, "time_str": "17:02:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260721/c678324267.shtml"}, {"id": "4767645", "title": "刘海星会见厄瓜多尔多党议员考察团", "content": "7月21日，中共中央对外联络部部长刘海星在北京会见由厄瓜多尔国会厄中议员友好小组主席萨拉萨尔率领的多党议员考察团，就共同落实两国元首共识、密切党际交流合作、推动中厄关系发展等交换意见。（新华社）", "ctime": 1784624554, "time_str": "17:02:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260721/c678324250.shtml"}, {"id": "4767633", "title": "约旦称拦截5架来自伊朗方向的无人机，伊朗伊斯兰革命卫队称已摧毁美军导弹防御雷达系统", "content": "当地时间7月21日，约旦武装部队总司令部发布消息表示，当地时间20日晚及21日凌晨，约旦防空系统拦截了5架自伊朗方向进入约旦领空的无人机。消息称，此次拦截行动未造成人员伤亡和财产损失。伊朗伊斯兰革命卫队21日发布声明，称动用导弹打击了美军位于约旦的一处基地，摧毁了一套导弹防御雷达系统，并击毁掩体内的一架F-15战斗机。革命卫队还打击了另一处美军驻约旦基地，造成多名美军士兵死亡。（央视新闻）", "ctime": 1784624495, "time_str": "17:01:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260721/c678324183.shtml"}, {"id": "4767593", "title": "嘉实基金王贵重：AI产业链仍然存在持续的投资机会", "content": "7月21日，嘉实基金发布旗下基金2026年二季报。基金经理王贵重管理的嘉实科技创新混合二季报显示，截至2026年二季度末，该基金股票仓位为92.11%，较一季度末上升1.69个百分点。报告显示，2026年二季度末，嘉实科技创新混合前十大重仓股分别为：中科飞测、兆易创新、中微公司、北方华创、北京君正、立讯精密、拓荆科技、纳芯微、华海清科、中芯国际。王贵重表示，将以拥抱长期产业趋势和业绩兑现来对抗短期扰动。由于“模型吞噬软件”的叙事未见反转，对互联网、软件、端侧等线索仍保持谨慎。对于国产芯片仍在保持密切关注，期待下半年能看到更积极的供给突破。（中证金牛座）", "ctime": 1784624397, "time_str": "16:59:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260721/c678324063.shtml"}, {"id": "4767589", "title": "三孚新科：董事长上官文龙提议以2000万元-3000万元回购公司股份", "content": "三孚新科公告，公司董事长上官文龙基于对公司未来发展前景的信心和对公司长期投资价值的认可，提议公司以集中竞价交易方式回购公司部分股份，并在未来适宜时机将前述回购股份用于员工股权激励或员工持股计划。回购价格上限不高于公司董事会审议通过回购股份决议前30个交易日公司股票交易均价的 150%，回购股份的资金总额不低于人民币 2000万元（含），不超过人民币 3000万元（含）。", "ctime": 1784624351, "time_str": "16:59:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260721/c678324035.shtml"}, {"id": "4767567", "title": "高科桥：完成收购豪民投资控股有限公司全部股权权益的重大及关联交易", "content": "高科桥公告，公司于2026年7月21日完成收购豪民投资控股有限公司全部股权权益的重大及关联交易。收购协议的全部先决条件已获达成，目标公司豪民投资控股有限公司成为高科桥的全资附属公司，卖方不再拥有目标公司任何直接权益。至此，高科桥间接持有富通光电技术（杭州）有限公司51%的股权。", "ctime": 1784624281, "time_str": "16:58:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260721/c678324012.shtml"}, {"id": "4767555", "title": "乐山电力：2026年上半年净利润688.39万元，同比下降12.90%", "content": "乐山电力发布业绩快报，2026年上半年营业总收入15.33亿元，同比下降5.55%。净利润688.39万元，同比下降12.90%。报告期内，执行居民低谷电价政策减少售电收入，执行新购天然气合同、调整购气结构计价结算规则增加购气成本，使得报告期内营业利润、利润总额、归属于上市公司股东的净利润、归属于上市公司股东的扣除非经常性损益的净利润均同比下降。", "ctime": 1784624222, "time_str": "16:57:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260721/c678323985.shtml"}, {"id": "4767553", "title": "悦康药业：子公司YKYY033注射液新增适应症获临床试验批准", "content": "悦康药业公告，子公司北京悦康科创医药科技股份有限公司、杭州天龙药业有限公司近日获得国家药品监督管理局核准签发的YKYY033注射液临床试验批准通知书。该药品用于治疗成人深静脉血栓形成（DVT），降低急性DVT后DVT复发和肺栓塞（PE）的风险；用于非瓣膜性心房颤动（NVAF）患者，以降低卒中和全身性栓塞的风险；用于慢性冠状动脉疾病（CAD）和/或外周动脉疾病（PAD）患者，以降低主要心血管事件风险；预防终末期肾病（ESRD）患者的主要血栓性血管事件；用于肿瘤相关静脉血栓栓塞症（VTE）的治疗和二级预防。公司将开展本品I期临床试验。", "ctime": 1784624171, "time_str": "16:56:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260721/c678323966.shtml"}, {"id": "4767551", "title": "国家重大科技基础设施强流重离子加速器装置试运行", "content": "据“惠州发布”公众号消息，7月21日，坐落于惠州市稔平半岛的国家重大科技基础设施——强流重离子加速器装置（HIAF）通过专家组工艺验收，标志着世界上第一台由超导直线加速器、同步加速器和储存环组合的先进重离子研究装置全面建成试运行，并投入科学研究。至此，我国拥有了新的自主可控、国际一流的重离子研究平台，填补了粤港澳大湾区及国内核科学领域基础研究的关键短板。", "ctime": 1784624134, "time_str": "16:55:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260721/c678323938.shtml"}, {"id": "4767547", "title": "云从科技：预计2026年上半年净亏损6932.15万元至8665.19万元同比减亏62.30%至69.84%", "content": "云从科技公告，预计2026年上半年净亏损6932.15万元至8665.19万元，同比减亏62.30%至69.84%。报告期内，公司围绕“AI基础设施+AI智能体”战略，持续聚焦核心业务和重点发展方向，稳步推进核心AI解决方案的技术研发、产品迭代与场景落地，进一步夯实业务发展基础。与此同时，公司积极推进AI Native组织转型，强化精细化经营和资源统筹配置，通过优化组织运营、加强成本费用管控、提升研发及经营资源配置效率等举措，推动销售、管理及研发等主要期间费用同比下降，经营提效成果逐步显现，带动公司整体盈利状况显著改善，归属于母公司所有者的净亏损及扣除非经常性损益后的净亏损同比大幅收窄。", "ctime": 1784624066, "time_str": "16:54:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260721/c678323901.shtml"}, {"id": "4767545", "title": "科强股份：股东人和共聚拟减持不超过0.0557%", "content": "科强股份公告，股东无锡人和共聚投资合伙企业(有限合伙)持有公司532.93万股，持股比例4.0998%，拟自本公告披露之日起15个交易日后的3个月内通过集中竞价减持不超过72410股，占总股本比例0.0557%，减持原因为员工个人资金需求。", "ctime": 1784624043, "time_str": "16:54:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260721/c678323886.shtml"}, {"id": "4767543", "title": "伊朗军方称打击巴林美空军基地", "content": "伊朗军方21日称，伊朗军队当天使用无人机打击了美军位于巴林的谢赫伊萨空军基地。伊朗军方称，自21日上午起使用无人机分阶段打击谢赫伊萨空军基地，并强调打击将持续进行，直至阻止敌人继续“武力入侵伊朗”。（新华社）", "ctime": 1784624038, "time_str": "16:53:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260721/c678323882.shtml"}, {"id": "4767535", "title": "海天味业：首次回购0.0141%公司股份，成交总金额为2999.1万元", "content": "海天味业公告，2026年7月21日，公司通过集中竞价交易方式首次实施公司A股股份回购，回购股份数为82.41万股，已回购股份占公司总股本的比例为0.0141%，回购成交的最高价为人民币37.37元/股，最低价为人民币36.15元/股，成交总金额为人民币2999.1万元（不含交易费用）。", "ctime": 1784623936, "time_str": "16:52:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260721/c678323834.shtml"}, {"id": "4767523", "title": "*ST高科：控股子公司英腾教育涉及一起公司决议纠纷案", "content": "*ST高科公告，公司控股子公司广西英腾教育科技股份有限公司收到柳州市鱼峰区人民法院送达的《应诉通知书》及配套法律文书，法院已立案受理兰涛诉英腾教育公司决议纠纷一案。原告兰涛请求法院确认英腾教育2026年7月1日作出的《第三届董事会第二十次会议决议》不成立，并申请行为保全。法院已作出裁定，禁止英腾教育执行相关决议。英腾教育已组织律师团队准备复议申请书，将申请撤销保全裁定。", "ctime": 1784623636, "time_str": "16:47:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260721/c678323593.shtml"}, {"id": "4767521", "title": "源杰科技：预计2026上半年净利润6亿元至6.5亿元 同比增加1,196.91%至1,304.98%", "content": "源杰科技公告，预计2026年1月1日至2026年6月30日业绩预计实现营业收入9亿元至9.5亿元，同比增加339.13%至363.53%；预计实现归属于母公司所有者的净利润6亿元至6.5亿元，同比增加1,196.91%至1,304.98%；预计实现归属于母公司所有者的扣除非经常性损益后的净利润5亿元至5.5亿元，同比增加1,001.87%至1,112.06%。", "ctime": 1784623631, "time_str": "16:47:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260721/c678323590.shtml"}, {"id": "4767517", "title": "康缘药业：收到芪黄正气颗粒临床试验批准通知书", "content": "康缘药业公告，近日收到国家药品监督管理局签发的芪黄正气颗粒《药物临床试验批准通知书》。芪黄正气颗粒为中医理论指导下形成的临床经验方，具有益气养血，扶正补虚的功效，用于治疗癌因性疲乏气血亏虚证。", "ctime": 1784623495, "time_str": "16:44:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260721/c678323484.shtml"}, {"id": "4767515", "title": "我国国家综合立体交通网主骨架建成率将提升到95%", "content": "“我们的目标是到2030年，国家综合立体交通网主骨架建成率由现在的91%提升到95%。”交通运输部副部长徐成光说。徐成光是在21日国新办举行的新闻发布会上作此表述的。他说，不同于过去简单“铺摊子”“上项目”，“十五五”时期，我国在继续推进跨区域跨流域大通道建设上将优化空间布局、打通经济循环大动脉，推动区域均衡发展。为实现2030年目标，徐成光表示，要抓好四类通道建设：在沿边沿海沿江大通道建设上，建成沿海高速铁路，推进沿边国道贯通和提质改造，全面贯通沿边G219、G331陆路战略骨干通道和沿海G228骨干通道，加快构建长江综合立体交通走廊，全面建成高标准沿江高速铁路，实施三峡水运新通道等一批重大工程。（新华社）", "ctime": 1784623460, "time_str": "16:44:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260721/c678323465.shtml"}, {"id": "4767513", "title": "惠丰钻石：与国机金刚石签署战略合作协议", "content": "惠丰钻石公告，为实现双方产业资源优势互补，拓宽合作领域、实现合作共赢，增强双方在产业链上下游的竞争优势，公司近日与国机金刚石（河南）有限公司签署了《战略合作协议》。在高端装备采购、产业链协同及其他方面达成战略合作，旨在整合各自在技术、装备及产业链资源上的优势，共同推进超硬材料产业的高端化升级与高质量发展。", "ctime": 1784623459, "time_str": "16:44:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260721/c678323464.shtml"}, {"id": "4767511", "title": "润都股份：获得碳酸镧化学原料药上市申请批准通知书", "content": "润都股份公告，近日收到国家药品监督管理局签发的关于碳酸镧化学原料药上市申请批准通知书。公司于2024年12月向国家药品监督管理局药品审评中心（CDE）递交碳酸镧境内生产化学原料药上市申请注册申报资料并获受理，2025年10月收到CDE发出的补充研究通知，2026年02月完成补充研究工作并递交资料，2026年07月获得《化学原料药上市申请批准通知书》。", "ctime": 1784623454, "time_str": "16:44:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260721/c678323462.shtml"}, {"id": "4767509", "title": "润都股份：苯磺酸氨氯地平化学原料药获上市批准", "content": "润都股份公告，近日收到国家药品监督管理局签发的关于苯磺酸氨氯地平化学原料药上市申请批准通知书。公司于2024年12月递交上市申请注册申报资料并获受理，2025年9月收到补充研究通知，2025年12月完成补充研究工作并递交资料，2026年7月获得批准通知书。苯磺酸氨氯地平适应症为高血压以及慢性稳定性心绞痛及变异型心绞痛的治疗。本次获批准有助于完善公司在心脑血管治疗领域的产品布局，推动形成从原料药到制剂的纵向一体化产业链。", "ctime": 1784623452, "time_str": "16:44:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260721/c678323461.shtml"}, {"id": "4767507", "title": "秘鲁对华热轧碳钢管作出反倾销终裁", "content": "2026年7月16日，秘鲁国家竞争和知识产权保护局倾销、补贴和消除非关税贸易壁垒委员会在官方日报《秘鲁人报》发布第156-2026/CDB-INDECOPI号公告，对原产于中国的热轧碳钢管作出反倾销终裁，决定征收49.2美元/吨至193.6美元/吨的反倾销税，措施有效期五年。（商务部）", "ctime": 1784623450, "time_str": "16:44:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260721/c678323458.shtml"}, {"id": "4767497", "title": "国家医保局：正在谋划开展专项行动推进灵活就业人员医疗保障参保扩面提质", "content": "国家医保局医药服务管理司副司长温思瑶在“促进家政服务业高质量发展专题新闻发布会”上介绍，为了鼓励灵活就业人员、新就业形态人员参加基本医保，解除大家的疾病医疗后顾之忧，国家医保局正在谋划开展专项行动，扎实推进医疗保障参保扩面提质工作。一方面，国家医保局将完善政策措施，持续推动超大城市取消灵活就业人员在就医地、常住地参保的户籍限制，支持家政服务平台企业按照“个人自愿+平台补贴”的缴费方式，为灵活就业的家政服务人员参加职工医保。同时，国家医保局也鼓励各地将灵活就业人员纳入生育保险的覆盖范围，在参加职工医保的同时，同步缴费参加生育保险，按规定享受生育保险待遇。另一方面是加强宣传动员，鼓励各地因地制宜，探索设立医保服务站点，为家政服务等灵活就业人员提供参保咨询、缴费指导等服务，联合群团组织、行业协会、平台企业等不定期开展宣传活动，通过视频、海报、案例解读等形式，帮助大家更好地了解医保政策，切实提升相关服务人员的医保获得感。", "ctime": 1784623313, "time_str": "16:41:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260721/c678323398.shtml"}, {"id": "4767495", "title": "广东明珠：董事长黄丙娣提议以1亿元-1.5亿元回购公司股份", "content": "广东明珠公告，公司董事长黄丙娣于2026年7月21日提议通过上海证券交易所交易系统以集中竞价交易方式进行股份回购，回购股份将用于员工持股计划或股权激励。回购价格不超过11元/股，资金总额不低于1亿元（含）且不超过1.5亿元（含），资金来源为公司自有资金或自筹资金，回购期限为自董事会审议通过之日起12个月内。", "ctime": 1784623306, "time_str": "16:41:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260721/c678323391.shtml"}, {"id": "4767493", "title": "美国情报机构评估报告：美伊将陷入长期对峙", "content": "美国情报机构评估报告认为，美国对伊朗新一轮军事打击不太可能对伊朗政府造成重大冲击，也难以迫使伊朗在谈判中软化立场，美伊将陷入长期对峙。中情局今年5月的一份分析报告认为，即使美国对伊朗实施海上封锁，伊朗至少能“扛住”3到4个月，才会面临较为严重的经济困难。（新华社）", "ctime": 1784623303, "time_str": "16:41:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260721/c678323390.shtml"}, {"id": "4767491", "title": "恒力石化：首次回购0.16%公司股份，已支付的总金额为1.71亿元", "content": "恒力石化公告，2026年7月21日，公司通过集中竞价交易方式首次回购股份数量1104.41万股，已回购股份占公司总股本的0.16%，成交的最低价格15.29元/股，成交的最高价格15.84元/股，已支付的总金额为1.71亿元（不含佣金、过户费等交易费用）", "ctime": 1784623300, "time_str": "16:41:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260721/c678323389.shtml"}, {"id": "4767489", "title": "百日千万招聘专项行动推出人工智能等招聘专场", "con // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
