": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260602/c677160234.shtml"}, {"id": "4444499", "title": "“扬子江”轮在沪交付 高效绿色改装助力全球船舶低碳升级", "content": "6月2日，全球最大独立集装箱船东Seaspan 10K系列甲醇双燃料改装项目首制船“SEASPAN YANGTZE”（“扬子江”轮），在上海中远海运重工提前完成全部改造工程，顺利交付运营。这是企业交付的全球最大独立集装箱船东首个甲醇双燃料EPC（设计、采购、建造）总包项目，标志着我国船舶工业在绿色船舶改装领域从服务国内客户迈向接轨国际高端船东的跨越。（央视新闻）", "ctime": 1780397259, "time_str": "18:47:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260602/c677160227.shtml"}, {"id": "4444487", "title": "金龙汽车：控股股东拟首次增持0.8亿元至1.5亿元", "content": "金龙汽车公告，截至2026年6月2日，控股股东福汽集团首次通过集中竞价增持31万股，金额422.19万元，占公司总股本0.0432%。根据已披露计划，福汽集团拟于2026年5月22日～2026年11月21日继续增持，金额0.8亿元（含）～1.5亿元（含），增持比例不超过公司总股本的2%。目前累计增持数量31万股，金额422.19万元，占0.0432%。", "ctime": 1780397165, "time_str": "18:46:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260602/c677160191.shtml"}, {"id": "4444475", "title": "阿富汗帕尔万省一客车翻车 致8死16伤", "content": "当地时间6月2日，阿富汗帕尔万省警方发言人表示，该省一辆客车当天上午在行驶过程中偏离道路、发生翻车事故，导致包括4名儿童在内8人死亡，另有16人受伤。（央视新闻）", "ctime": 1780397135, "time_str": "18:45:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260602/c677160187.shtml"}, {"id": "4444471", "title": "上海制定生活垃圾分类提质增效三年行动计划", "content": "记者从2日举行的上海市人民政府新闻发布会上获悉，上海制定了《上海市生活垃圾分类提质增效三年行动计划（2026—2028年）》。据介绍，此次制定的三年行动计划主要目标是：到2028年，生活垃圾回收利用率超48%，低价值可回收物占可回收物总量25%以上，湿垃圾分出量占比超35%、分出纯净度达95%左右。上海市人民政府副秘书长张玉鑫介绍，上海计划用三年时间集中实施一系列政策举措，进一步巩固生活垃圾分类工作成果，推动绿色低碳转型发展。为此，围绕推动源头减量、提升分类实效、健全回收体系、强化共建共治、完善管理机制等方面制定18项重点任务。（新华社）", "ctime": 1780397129, "time_str": "18:45:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260602/c677160179.shtml"}, {"id": "4444457", "title": "银宝山新：股东布拉德已减持0.61%股份", "content": "银宝山新公告，持股5%以上股东淮安布拉德投资发展有限公司于2026/5/14-2026/6/2通过大宗交易减持300万股，减持均价7.37元/股，占总股本0.61%，减持计划已实施完毕；减持后持股4564.76万股，占总股本9.21%；此前预披计划期限为2026年4月30日至2026年7月29日，拟减持股份数量及比例均未突破原计划上限。", "ctime": 1780397112, "time_str": "18:45:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260602/c677160165.shtml"}, {"id": "4444431", "title": "*ST清越：公司可能被实施重大违法强制退市，于2026年5月12日起被实施退市风险警示", "content": "*ST清越公告，公司股票交易连续2个交易日内（2026年6月1日、2026年6月2日）收盘价格涨幅偏离值累计达到30%，属于股票交易异常波动。公司于2026年5月8日收到中国证监会《行政处罚事先告知书》，可能被实施重大违法强制退市。公司A股股票于2026年5月12日起被实施退市风险警示。", "ctime": 1780396890, "time_str": "18:41:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260602/c677160093.shtml"}, {"id": "4444407", "title": "全线通水 平陆运河迈入通航冲刺阶段", "content": "平陆运河工程全线通水，标志着这一重大水利工程进入通航的关键阶段。工程的推进对于区域经济发展、交通运输以及水资源管理具有重要意义。相关部门正加快施工进度，确保项目按计划顺利实施，为后续通航和运营奠定坚实基础。（新华社）", "ctime": 1780396726, "time_str": "18:38:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260602/c677160042.shtml"}, {"id": "4444405", "title": "财政部将发行2026年记账式贴现（三十三期）国债", "content": "财政部发布通知，拟发行2026年记账式贴现（三十三期）国债。本期国债为期限28天的贴现债，发行数量为200亿元，通过竞争性招标确定发行价格。招标时间为2026年6月3日上午10:35至11:35，采用修正的多重价格招标方式，标的为价格。中标承销团成员需于2026年6月4日前将发行款缴入财政部指定账户。本期国债将于6月8日起上市交易。（财政部）", "ctime": 1780396720, "time_str": "18:38:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260602/c677160040.shtml"}, {"id": "4444389", "title": "昊海生科：控股子公司三焦点人工晶状体产品获得医疗器械注册证", "content": "昊海生科公告，控股子公司河南赛美视生物科技有限公司于近日收到国家药品监督管理局颁发的三焦点人工晶状体产品的《中华人民共和国医疗器械注册证》。该产品适用于成人白内障患者无晶体眼的视力矫正，注册证有效期为2026年6月1日至2031年5月31日。本产品采用独家专利技术，定制化每一级衍射环的高度与光能分布，并采用精准滤波技术，进一步提升视觉质量和光能利用率。", "ctime": 1780396545, "time_str": "18:35:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260602/c677159984.shtml"}, {"id": "4444373", "title": "日本防卫省：以冲绳为前沿强化“战时医疗”体制", "content": "日本防卫省相关负责人表示，防卫省正以冲绳为前沿，强化“战时医疗”体制建设，推进多家自卫队医院扩充病床、强化医疗功能、构建医疗后送体制等。防卫省将宫古岛、石垣岛、与那国岛等设想为前沿地区，正构建从前线救护、野战医院、那霸医院向九州和本州地区转运的医疗后送体制。（央视新闻）", "ctime": 1780396454, "time_str": "18:34:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260602/c677159933.shtml"}, {"id": "4444367", "title": "山东黄金：拟确认公允价值变动损失7.05亿元", "content": "山东黄金公告，全资子公司山金金控拟参与东吴证券收购东海证券股权交易，并对其持有的东海证券股权确认公允价值变动损失。山金金控共持有东海证券18.71%的股份，本次拟向东吴证券出售其持有的14.13%的股份，转让价格为19.45亿元。根据初步测算，山金金控将对持有的东海证券18.71%股份确认公允价值变动损失共约7.05亿元，预计减少公司2026年度利润总额7.05亿元。", "ctime": 1780396402, "time_str": "18:33:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260602/c677159913.shtml"}, {"id": "4444349", "title": "2026年5月基金新开户21.83万户", "content": "上交所数据显示，2026年5月基金新开户21.83万户，环比增长9.37%，同比2025年5月的17.17万户增长27.14%。\n2026年累计新开159.79万户，同比增长22.53%。", "ctime": 1780396364, "time_str": "18:32:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260602/c677159897.shtml"}, {"id": "4444347", "title": "云鼎科技：董事徐加利增持0.0015%股份", "content": "云鼎科技公告，于2026年6月2日，公司董事徐加利通过集中竞价增持公司股份10000股，增持均价9.67元/股，占公司总股本0.0015%，增持前持股0股，占比0.00%，增持后持股10000股，占比0.0015%，资金来源为个人自有资金，目前暂无后续增持计划。", "ctime": 1780396357, "time_str": "18:32:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260602/c677159894.shtml"}, {"id": "4444339", "title": "东吴证券：拟发行股份及支付现金收购东海证券83.68%股权，交易总价115.19亿元", "content": "东吴证券公告，公司拟以发行股份及支付现金方式收购常州投资集团有限公司等60名交易对方持有的东海证券股份有限公司83.68%股份，交易总价115.19亿元。其中，股份对价107.86亿元，现金对价7.32亿元。本次交易构成关联交易，不构成重组上市。标的资产以2025年12月31日为基准日，100%股权评估值为137.65亿元，增值率40.76%。本次交易方案已获公司董事会审议通过，尚需提交股东会审议、上交所审核及证监会注册。", "ctime": 1780396305,  "title": "飞沃科技：因资本公积金转增股本，回购价格上限由43.44元调整为31.06元/股", "content": "飞沃科技公告，此前公司拟以2500万元至5000万元回购股份，回购价格上限为43.44元/股，用于实施股权激励计划。现因2025年度资本公积金转增股本（每10股转增4股）实施，除权除息日为2026年5月19日，回购价格上限相应调整为不超过31.06元/股。除上述调整外，回购方案其他事项不变。", "ctime": 1780395598, "time_str": "18:19:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260602/c677158937.shtml"}, {"id": "4444221", "title": "易成新能：股东开封发投解质押并再质押6.70%", "content": "易成新能公告，持股5%以上股东开封市发展投资集团有限公司解除1.26亿股质押，占其持股50.00%、占公司总股本6.70%；并于2026年5月28日将同等数量股份再次质押给通汇嘉泰融资租赁（天津）有限公司，质押期限至办理解除登记手续日。截至公告披露日，开封发投持股2.51亿股，占13.40%，其中1.26亿股已质押，占其持股50.00%、占总股本6.70%。", "ctime": 1780395392, "time_str": "18:16:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260602/c677158779.shtml"}, {"id": "4444217", "title": "方直科技：持股5%以上股东黄晓峰与张智章签署《股份转让协议之补充协议》", "content": "方直科技公告，持股5%以上股东黄晓峰拟通过协议转让方式向张智章转让其持有的方直科技股份1495.38万股，占公司总股本的5.94%。本次协议转让尚需经深圳证券交易所进行合规性审核后方能在中国结算深圳分公司办理股份协议转让过户手续。黄晓峰与张智章已于2026年6月2日签署《股份转让协议之补充协议》，补充协议对原协议的付款期限和违约责任进行了约定。", "ctime": 1780395387, "time_str": "18:16:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260602/c677158777.shtml"}, {"id": "4444215", "title": "达威股份：拟将金狮科技60%股权划转至全资子公司并增资4080万元", "content": "达威股份公告，公司拟将持有的控股子公司上海金狮化工科技有限公司60%股权划转给全资子公司上海达威芯新材料有限公司，划转完成后金狮科技成为公司控股孙公司。同时，公司拟通过达威芯新材料以4080万元自有资金和实物对金狮科技进行增资，成都朗叙新材料科技有限公司拟以1720万元无形资产对金狮科技进行增资。增资完成后，金狮科技注册资本将由200万元增加至6000万元，达威芯新材料持股70%，朗叙新材持股30%。本次交易不需提交股东会审议，不构成重大资产重组，亦不构成关联交易。", "ctime": 1780395378, "time_str": "18:16:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260602/c677158773.shtml"}, {"id": "4444211", "title": "中百集团成立智能科技公司", "content": "企查查APP显示，近日，武汉抱抱智能科技有限公司成立，法定代表人为何飞，注册资本为2000万元，经营范围包含：互联网数据服务；人工智能应用软件开发；人工智能硬件销售；大数据服务；商业综合体管理服务等。企查查股权穿透显示，该公司 function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
