": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261117/c681919277.shtml"}, {"id": "5687919", "title": "同宇新材：拟投资3亿元建设高性能树脂材料项目", "content": "同宇新材公告，公司计划投资建设“高性能树脂材料项目”，项目计划总投资额约为3亿元，新建甲类车间、丙类车间、树脂生产装置及公辅配套设施等，项目建设期为36个月。公司第二届董事会第十二次会议已审议通过相关议案，本次事项无需提交股东会审议。本项目产品主要为碳氢树脂等更高阶的高性能电子树脂和高性能电力树脂，与“年产20万吨电子树脂项目（二期）”产品形成品类互补。", "ctime": 1794914876, "time_str": "19:27:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261117/c681919228.shtml"}, {"id": "5687915", "title": "同宇新材：子公司拟投资5.24亿元建设年产20万吨电子树脂项目（二期）", "content": "同宇新材公告，公司全资子公司江西同宇新材料有限公司拟投资建设“年产20万吨电子树脂项目（二期）”，项目计划总投资额约为5.24亿元，拟利用江西同宇乐平市工业园区现有土地，新建甲类车间、电子树脂生产装置及公辅配套设施等，项目建设期为18个月。该议案已获公司第二届董事会第十二次会议审议通过，无需提交股东会审议。项目尚需完成项目备案、环境影响评价、安全评价、节能审查等法定审批程序。", "ctime": 1794914853, "time_str": "19:27:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261117/c681919215.shtml"}, {"id": "5687913", "title": "飞凯材料：拟以5000万元-1亿元回购公司股份", "content": "飞凯材料公告，拟以不低于人民币5000万元（含）且不超过人民币1亿元（含）回购公司股份，回购价格不超过人民币38元/股（含）。回购股份将全部用于注销并减少注册资本。按回购金额上限测算，预计回购股份数量为263.16万股，约占公司当前总股本的0.46%；按下限测算，预计回购股份数量为131.58万股，约占公司当前总股本的0.23%。回购资金来源为公司自有资金及自筹资金（包括股票回购专项贷款），实施期限为自股东会审议通过回购方案之日起3个月内。", "ctime": 1794914841, "time_str": "19:27:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261117/c681919188.shtml"}, {"id": "5687907", "title": "九州一轨：第三期股份回购实施完成，累计回购21.16万股支付1499.55万元", "content": "九州一轨公告，公司此前审议通过第三期回购方案，拟以不低于800万元、不超过1500万元回购公司股份，回购价格不超过150元/股，用于员工持股计划或股权激励。截至2026年11月16日，公司完成回购，累计回购公司股份21.16万股，占公司总股本的比例为0.1408%，回购成交最高价78.5元/股，最低价64.68元/股，回购均价70.88元/股，已支付总金额1499.55万元（不含印花税、交易佣金等交易费用）。本次实际回购情况与原披露方案不存在差异。", "ctime": 1794914807, "time_str": "19:26:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261117/c681919180.shtml"}, {"id": "5687905", "title": "泰格医药：参与方达控股私有化及出售资产事项披露最新审计数据", "content": "泰格医药公告，公司此前披露拟参与子公司方达控股私有化及出售资产，拟出售方达控股控制权并剥离其海外实验室业务。本次公告披露方达控股经审计的2026年1-6月营业收入1.48亿美元、净利润678.8万美元；截至2026年6月30日，资产总额5.8亿美元、负债总额2.24亿美元、净资产3.56亿美元。", "ctime": 1794914802, "time_str": "19:26:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261117/c681919179.shtml"}, {"id": "5687903", "title": "商务部新闻发言人就中加经贸磋商成果答记者问", "content": "商务部新闻发言人就中加经贸磋商成果答记者问。问：据了解，近期中国和加拿大开展了多轮经贸磋商，取得积极成果。能否介绍相关情况？答：在中加两国领导人重要共识的引领下，双方本着相互尊重、合作共赢的精神，在初步联合安排基础上开展多轮经贸磋商，就双方关注的经贸问题形成补充联合安排。双方同意将初步联合安排的相关豁免措施延长2年。加方还将进一步扩大对中国钢铝产品的豁免范围。相应地，中方将根据有关法律法规，进一步调整对加方部分农水产品采取的反歧视措施。此外，双方就电子商务合作、中资银行在加设立分支机构、优化营商环境等经贸问题形成积极共识。相信这些安排将有利于双方深化经贸合作，并为两国民众带来更大福祉。双方将加紧履行各自国内程序，推动有关成果尽早落地见效，并将持续探讨进一步深化经贸合作的相关安排。同时，双方将充分用好中加经贸联委会机制，继续拓展合作、解决问题、管控分歧，推动中加经贸关系健康、稳定、可持续发展。(商务部)", "ctime": 1794914796, "time_str": "19:26:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261117/c681919177.shtml"}, {"id": "5687893", "title": "弘亚数控：2026年上半年境外收入同比增长31.35%", "content": "弘亚数控在投资者关系活动记录表中表示，2026年上半年境外收入5.59亿元，同比增长31.35%；分区域看，非洲业务增幅较为显著，亚洲为核心增长区域之一。", "ctime": 1794914723, "time_str": "19:25:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261117/c681919162.shtml"}, {"id": "5687885", "title": "第49届东盟峰会闭幕 新加坡接任2027年轮值主席国", "content": "当地时间11月17日，第49届东盟峰会及系列会议在菲律宾首都马尼拉闭幕。菲律宾总统马科斯在闭幕式上将轮值主席国木槌移交给新加坡总理黄循财。新加坡将于2027年1月1日起正式担任东盟轮值主席国，任期一年。东盟成立于1967年，现成员国包括印度尼西亚、泰国、新加坡、菲律宾、文莱、马来西亚、越南、老挝、柬埔寨、缅甸和东帝汶11国。（央视新闻）", "ctime": 1794914672, "time_str": "19:24:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261117/c681919149.shtml"}, {"id": "5687845", "title": "华联控股：回购股份注销完成，总股本减少至13.87亿股", "content": "华联控股公告，公司本次注销回购股份数量为1710万股，占注销前公司总股本的1.22%，涉及回购注销金额5276.4万元。经中国证券登记结算有限责任公司深圳分公司审核确认，本次回购股份注销事宜已于2026年11月16日办理完成。本次注销完成后，公司总股本由14.04亿股减少至13.87亿股。公司2024年度回购股份将全部处理完毕。控股股东华联发展集团有限公司持股比例由29.82%被动增加至30.19%，属于可以免于发出要约的情形。", "ctime": 1794914490, "time_str": "19:21:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261117/c681919094.shtml"}, {"id": "5687615", "title": "盈趣科技：控股股东万利达工业增持触及1%整数倍，增持计划尚未实施完毕", "content": "盈趣科技公告，控股股东深圳万利达电子工业有限公司此前披露增持计划，拟自2026年10月24日起6个月内通过集中竞价方式增持公司股份，增持总金额不低于人民币1亿元。2026年11月10日至2026年11月17日，万利达工业以集中竞价方式累计增持公司股份403.49万股，占公司总股本的0.52%，增持金额合计人民币7537.35万元（不含交易费用）。本次权益变动后，万利达工业及其一致行动人合计持有公司股份4.33亿股，占公司总股本的比例由55.57%变动为56.10%，持股比例变动触及1%刻度线。本次增持计划尚未实施完毕。", "ctime": 1794913649, "time_str": "19:07:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261117/c681918761.shtml"}, {"id": "5687519", "title": "迈普医学：发行股份购买资产新增股份739.7万股将于2026年11月19日上市", "content": "迈普医学公告，公司此前披露拟通过发行股份及支付现金方式向泽新医疗等10名交易对方购买易介医疗100%股权，交易对价3.35亿元，其中股份对价3.01亿元、现金对价3379.06万元。本次发行股份购买资产的新增股份数量为739.7万股，发行价格40.7元/股，占发行后总股本的9.86%，上市日期为2026年11月19日。标的资产易介医疗100%股权已完成工商变更过户，公司已持有其100%股权。本次发行后公司股本总数增至75028039股。", "ctime": 1794913458, "time_str": "19:04:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261117/c681918694.shtml"}, {"id": "5687517", "title": "国企改革ETF富国：基金份额持有人大会计票日11月19日起停牌", "content": "国企改革ETF富国公告，本基金于2026年10月20日起至2026年11月18日以通讯方式召开基金份额持有人大会，审议《关于终止富国中证国有企业改革交易型开放式指数证券投资基金基金合同并终止上市有关事项的议案》。为保护基金份额持有人利益，本基金将在计票日（即2026年11月19日）当日开市起停牌。如大会表决通过《议案》，本基金将不再复牌并进入清算程序；如大会未能成功召集或《议案》未获通过，本基金将自披露大会情况公告之日10:30起复牌。", "ctime": 1794913452, "time_str": "19:04:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261117/c681918691.shtml"}, {"id": "5687511", "title": "电投绿能：拟合作 43", "title": "东方材料：公司目前日常生产经营活动正常", "content": "东方材料公告，公司股票于2026年11月13日、11月16日、11月17日连续三个交易日内收盘价格跌幅偏离值累计超过20%，属于股票交易异常波动情形。经自查，公司目前日常生产经营活动正常，行业政策未发生重大调整。经向持股5%以上股东发函查证，股东江苏特丽亮新材料科技有限公司近期拟办理股权质押融资，该事项尚未完成办理，存在不确定性。除此之外，公司及公司其他持股5%以上股东不存在应披露而未披露的重大信息。", "ctime": 1794913032, "time_str": "18:57:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261117/c681918432.shtml"}, {"id": "5687331", "title": "悍高集团：董事会聘任总经理、副总经理等4名高管", "content": "悍高集团公告，第三届董事会第一次会议选举欧锦锋为董事长，并聘任其为总经理，聘任欧锦丽为副总经理、夏祺为副总经理兼董事会秘书、周秀舟为财务总监，任期均至第三届董事会届满之日止。会议还选举产生第三届董事会专门委员会委员。", "ctime": 1794912968, "time_str": "18:56:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261117/c681918412.shtml"}, {"id": "5687251", "title": "百利天恒：全资子公司收到BMS第二笔2.5亿美元里程碑付款", "content": "百利天恒公告，公司此前披露全资子公司SystImmune与百时美施贵宝就“伦康依隆妥单抗”（iza-bren）项目达成全球战略合作协议。近日，SystImmune收到由BMS支付的第二笔2.5亿美元里程碑付款（实际到账金额须扣除银行手续费）。截至目前，公司已收到合作协议项下共计13亿美元付款，后续还有资格在达到特定开发、注册和销售里程碑后获得最高可达71亿美元的额外付款。", "ctime": 1794912703, "time_str": "18:51:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261117/c681918338.shtml"}, {"id": "5687183", "title": "方大特钢：重大资产购买暨关联交易正在推进中", "content": "方大特钢公告，公司此前披露拟退出南昌沪旭并以实物分配等形式取得钢铁企投控制权，本次交易构成重大资产重组及关联交易。公司已于2026年10月15日召开第九届董事会第二十次会议，审议通过重大资产购买暨关联交易报告书（草案）及其摘要。截至本公告披露日，公司及相关各方正在积极推进本次交易的各项工作，本次交易尚需公司股东会审议批准及其他必需的审批、备案或授权。", "ctime": 1794912318, "time_str": "18:45:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261117/c681918190.shtml"}, {"id": "5687159", "title": "西渝高铁康渝段超大断面隧道贯通", "content": "记者17日从中国铁建股份有限公司了解到，由西成客专陕西公司建设、中铁十四局承建的西渝高铁康渝段陕西境内最大断面隧道——岚皋三号隧道顺利贯通，为全线按期建成通车奠定坚实基础。(新华社)", "ctime": 1794912252, "time_str": "18:44:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
