m.cn/20260908/c679698997.shtml"}, {"id": "5126229", "title": "新突破！我国首制88000立方米超大型液化气体运输船完工", "content": "9月8日上午，我国首制88000立方米超大型液化气体运输船（88K VLGC）“长平源”轮正式完成建造并命名，标志着我国在超大型液化气运输船自主设计建造领域取得全新突破。该船总长约230米，建造过程中应用了国内自主研发的先进低温焊接工艺，核心建造环节实现技术自主可控。其搭载的LPG双燃料主机与轴带发电机，与燃油模式相比，可减少约20%的二氧化碳排放、约90%的硫氧化物和颗粒物排放，环保指标达到国际领先水平，是目前同时适航巴拿马运河新旧船闸、舱容最大的VLGC。同时，该船具备多品类运输能力，可运输LPG、液氨等9种液化气体货种，精准匹配未来全球液氨航运市场的增量需求，市场适配性与发展前瞻性突出。“长平源”轮作为我国高端船舶制造领域的又一标志性成果，打破了长期以来海外在同级别超大型气体运输船设计建造领域的技术垄断，也为我国后续大型清洁能源运输船队自主化建造打下了坚实的技术基础。（央视新闻）", "ctime": 1788854538, "time_str": "16:02:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260908/c679697504.shtml"}, {"id": "5126221", "title": "美股中概股盘前涨跌互现，百度跌7%", "content": "美股中概股盘前涨跌互现，哔哩哔哩涨3%，理想汽车涨1%，网易涨0.8%，京东、百济神州、蔚来、阿里巴巴跌1%，百度跌7%。", "ctime": 1788854479, "time_str": "16:01:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260908/c679697235.shtml"}, {"id": "5126215", "title": "美股大型科技股盘前涨跌互现，SK海力士涨超1%", "content": "美股大型科技股盘前涨跌互现，SK海力士涨超1%，美光科技涨0.8%，SpaceX涨0.4%，英伟达涨0.3%；特斯拉持平；Meta跌0.9%，微软跌0.6%，亚马逊跌0.5%，谷歌A跌0.3%，苹果跌0.2%。", "ctime": 1788854472, "time_str": "16:01:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260908/c679697198.shtml"}, {"id": "5126147", "title": "现货黄金失守4390美元/盎司", "content": "现货黄金失守4390美元/盎司，日内跌0.36%。", "ctime": 1788854260, "time_str": "15:57:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260908/c679696967.shtml"}, {"id": "5126145", "title": "三友科技：梁建明拟减持公司不超过0.0980%股份", "content": "三友科技公告，董事、高级管理人员梁建明持有公司股份39.76万股，占公司总股本0.3934%，拟通过集中竞价方式减持不高于99000股，占公司总股本0.0980%，减持期间为自本公告披露之日起15个交易日后的3个月内，减持原因为个人资金需求。", "ctime": 1788854247, "time_str": "15:57:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": fal urce": "", "url": "https://news.10jqka.com.cn/20260908/c679696828.shtml"}, {"id": "5126105", "title": "京基智农：2026年8月商品肥猪销量14.11万头", "content": "京基智农公告，2026年8月销售商品肥猪14.11万头，实现销售收入2.06亿元，销售均价11.5元/kg；2026年1-8月累计销售商品肥猪139.97万头，实现销售收入19.07亿元。", "ctime": 1788853855, "time_str": "15:50:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260908/c679696825.shtml"}, {"id": "5126087", "title": "Gucci客服回应降价传闻：根据市场综合因素不定期调整", "content": "9月8日，有媒体消息称，奢侈品牌古驰Gucci已于近日完成新一轮降价，且降价范围包括包袋、成衣等品类。对此消息，Gucci古驰官方客服回应表示，“品牌会根据市场综合因素不定期对产品价格进行调整，可以通过我们的官方渠道确认产品目前在售价格。”（新浪财经）", "ctime": 1788853581, "time_str": "15:46:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260908/c679696675.shtml"}, {"id": "5126057", "title": "三部门发文加快提供优质高效眼健康服务", "content": "记者9月8日从国家卫生健康委获悉，国家卫生健康委、国家中医药局、国家疾控局近日联合印发《加快提供优质高效眼健康服务工作方案（2026-2030年）》。方案要求，聚焦重点人群和重点眼病，完善防筛诊治康全链条服务，健全覆盖全生命周期的眼健康服务体系，为人民群众提供公平可及、系统连续、优质高效的眼健康服务。方案明确，到2030年，0至6岁儿童、中小学生屈光筛查率稳步提高，全国百万人口白内障手术率超过4000，95%以上的县域可独立开展常见眼病的诊疗，各县域均能够提供白内障手术服务。（新华社）", "ctime": 1788853257, "time_str": "15:40:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260908/c679696550.shtml"}, {"id": "5126015", "title": "沙特主导联军称也门胡塞武装袭击致73人受伤", "content": "沙特阿拉伯主导的多国联军发言人图尔基·马利基8日说，也门胡塞武装对沙特艾卜哈、贾赞、奈季兰等城市的民用和经济设施发动袭击，造成包括妇女和儿童在内的73名平民受伤。 马利基在社交媒体上发表声明说，袭击公然侵犯沙特主权，并对沙特民众安全构成直接威胁。多国联军将采取一切必要措施，对也门胡塞武装形成威慑并坚决予以回击。 沙特能源部8日发表声明说，该国南部地区多处能源设施当天上午遭袭，袭击导致多个地点发生火灾，部分设施暂时中断运营。伤者正在接受治疗，评估和后续处置工作仍在进行中。 沙特外交部同日发表声明谴责也门胡塞武装的袭击。声明说，沙特绝不容忍任何针对其领土和资源的袭击，将依据国际法采取行动。(新华社)", "ctime": 1788853011, "time_str": "15:36:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260908/c679696384.shtml"}, {"id": "5125983", "title": "平高电气：2026年中标约9.36亿元", "content": "平高电气公告，公司及子公司、合营公司中标国家电网有限公司2026年输变电项目第四次变电设备（含电缆）公开招标采购及直接采购项目，中标金额合计约9.36亿元，占2025年营业收入的7.48%。其中，公开招标采购中标金额合计约8.5亿元，直接采购中标金额合计约0.86亿元。", "ctime": 1788852857, "time_str": "15:34:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260908/c679696294.shtml"}, {"id": "5125977", "title": "环旭电子：2026年8月合并营业收入65.09亿元，同比增长17.12%", "content": "环旭电子公告，2026年8月合并营业收入为人民币65.09亿元，较2025年同期增长17.12%，较2026年7月环比增长17.30%；2026年1月至8月合并营业收入为人民币393.94亿元，较2025年同期增长4.54%。上述数据未经审计。", "ctime": 1788852774, "time_str": "15:32:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260908/c679696259.shtml"}, {"id": "5125971", "title": "上交所张斌：长期资金正加速配置中国硬科技", "content": "9月8日，上交所国际合作部总监张斌在“HKEX中国机遇论坛”上表示，中国市场已经成为国际资金配置的必选项，而不再是可选项。张斌认为，近年来，A股市场在高科技行业赛道呈现爆发式发展，在人形机器人、算力产业链、半导体设备等领域涌现了很多优秀企业，获得了很多外资机构的增持，不仅看中A股资产的估值优势，更看中中国产业转型的发展前景。在此背景下，上交所持续提供更多灵活性、针对性、差异性的举措鼓励长线资金入市，推动健全更加有利于中长期资金入市的政策环境，增进与境外主权基金、长线资本的推介沟通力度。诸多举措之中，互联互通机制的持续优化正是最具代表性的抓手之一。据介绍，在过去十多年时间里，沪港通互联互通机制在投资便利性、产品多样性和市场流动性等方面不断优化创新，自开通以来已推行了二十余项制度优化举措，包括扩大投资额度、拓宽标的范围和标的类型、优化交易日历等方面。（证券时报）", "ctime": 1788852713, "time_str": "15:31:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260908/c679696202.shtml"}, {"id": "5125963", "title": "市场监管总局发布《中国反不正当竞争执法年度报告（2025）》", "content": "市场监管总局在2026年全国公平竞争大会“强化反不正当竞争提升反内卷治理效能”专题大会上发布《中国反不正当竞争执法年度报告（2025）》（中英文版）。2025年，全国共查处各类不正当竞争案件14679件、罚没款6.15亿元，其中查处网络不正当竞争案件1932件。据了解，市场监管总局完成《中华人民共和国反不正当竞争法》修订，发布《医药企业防范商业贿赂风险合规指引》。部署开展整治网络不正当竞争行为专项行动，深入推进老年人药品、保健品虚假宣传专项整治，有效遏制私域直播“坑老骗老”乱象。（央视新闻）", "ctime": 1788852637, "time_str": "15:30:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260908/c679696164.shtml"}, {"id": "5125943", "title": "李书磊会见越共中央理论委员会主席阮春胜", "content": "9月8日，中共中央政治局委员、中宣部部长李书磊在京会见越共中央理论委员会主席阮春胜。 李书磊表示，今年4月，习近平总书记同来华访问的苏林总书记达成一系列新的重要共识。双方要共同落实好两党最高领导人共识，深入开展治党治国理论和经验交流互鉴，推动构建更高水平具有战略意义的中越命运共同体。 阮春胜表示，越方愿研究借鉴中国共产党领导中国人民百年进程的历史经验和习近平党建思想，共同促进两国社会主义事业不断发展。(新华社)", "ctime": 1788852545, "time_str": "15:29:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260908/c679696080.shtml"}, {"id": "5125937", "title": "外交部：中方愿同各方共同努力 让人工智能产生持续价值", "content": "9月8日，外交部发言人毛宁主持例行记者会。有记者问，我们注意到，中方主办的新一期人工智能能力建设研讨班在北京开班，发言人能否进一步介绍有关情况，中方如何看待人工智能能力建设问题？毛宁表示，9月7日至12日，中方在北京大学举办新一期人工智能能力建设研讨班。中国持续推动落实《人工智能能力建设普惠计划》，通过成立世界人工智能合作组织等举措，提升技术和服务的可及性，帮助全球南方国家找到一条适配本国需要的人工智能发展之路。我们愿同各方共同努力，让人工智能产生持续价值，成为增进全人类福祉的重要推动力量。（央视新闻）", "ctime": 1788852462, "time_str": "15:27:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260908/c679696034.shtml"}, {"id": "5125899", "title": "琼州海峡轮渡中秋船票9月10日开售", "content": "记者从琼州海峡港航企业（海峡股份）了解到，9月10日9时起，广大旅客可预约订购9月11日至9月25日（中秋节）琼州海峡轮渡过海船票；9月16日9时起，正式启动国庆假期票务预售，开放9月17日至10月1日（国庆节）的过海船票预订服务。琼州海峡过海船票实行15天预售机制，每日上午9时统一开放新批次船票预售。有出行需求的旅客可通过“琼州海峡轮渡管家”“新海港”微信服务号、“轮渡管家”App等预约购票。提醒有出行计划的旅客及驾乘人员，务必精准把握船票预售时间节点，提前统筹规划往返行程。同时，旅客需严格按照预约航班时段有序进港，切勿盲目前往港区等候，杜绝非正规票务交易，谨防诈骗风险。（央视新闻）", "ctime": 1788852242, "time_str": "15:24:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260908/c679695927.shtml"}, {"id": "5125897", "title": "卡塔尔首相兼外交大臣访华 外交部介绍有关情况", "content": "9月8日，外交部发言人毛宁主持例行记者会。卡塔尔首相兼外交大臣穆罕默德于9月7日至8日应邀访问中国。在回答相关提问时，毛宁表示，中国和卡塔尔是战略伙伴，中国高度重视发展两国关系。中方期待以此访为契机，推动两国关系取得新的发展。(央视新闻)", "ctime": 1788852237, "time_str": "15:23:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260908/c679695920.shtml"}, {"id": "5125891", "title": "外交部：“敌国条款”作为针对二战战败国的特殊制度安排，至今仍有效", "content": "9月8日，外交部发言人毛宁主持例行记者会。今日俄罗斯（RT）记者提问，近日，日本政府一方面要求俄罗斯拆除纪念战胜日本军国主义的纪念碑，称相关设计伤害日本国民感情；另一方面又再次表示，《联合国宪章》中的“敌国条款”已经过时、形同虚设。请问中方如何看待日本政府近期围绕二战历史和战后国际秩序作出的一系列表态？毛宁表示，正确认识和对待历史是检验日本能否恪守发展承诺的标志。日本当年是在承认军国主义罪行、接受《联合国宪章》全部内容的前提下加入联合国的。《联合国宪章》中的“敌国条款”，作为针对二战战败国的特殊制度安排，至今仍然有效。毛宁重申，今年是东京审判开庭80周年，日本应当以史为鉴，同军国主义彻底切割，以实际行动取信亚洲邻国。（澎湃新闻）", "ctime": 1788852163, "time_str": "15:22:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260908/c679695882.shtml"}, {"id": "5125841", "title": "外交部：日本应当同军国主义彻底切割 以实际行动取信亚洲邻国和国际社会", "content": "9月8日，外交部发言人毛宁主持例行记者会。有记者问，近日，日本政府一方面要求俄罗斯拆除纪念战胜日本军国主义的纪念碑，称相关设计伤害日本国民感情。另一方面，又再次表示《联合国宪章》中的“敌国条款”已经过时、形同虚设。请问中方如何看待日本政府近期围绕二战历史和战后国际秩序做出的这一系列表态？毛宁表示，正确认识和对待历史是检验日本能否恪守和平发展承诺的标志。日本当年是在承认军国主义罪行、接受《联合国宪章》全部内容的前提下加入联合国的。《联合国宪章》中的“敌国条款”作为针对二战战败国的特殊制度安排，至今仍然有效。今年是“东京审判”开庭80周年，日本应当以史为鉴，同军国主义彻底切割，以实际行动取信亚洲邻国和国际社会。（央视新闻）", "ctime": 1788851906, "time_str": "15:18:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260908/c679695733.shtml"}, {"id": "5125809", "title": "朝中社：日本新军国主义企图必将招致灾祸", "content": "朝中社8日刊登国际安全问题评论家的文章说，日本新军国主义者正在掀起制造战争国家、复辟侵略国家的狂澜，东北亚地区的和平安全环境正滑向越来越危险的局面。 文章说，7日至11日，在朝鲜半岛地区，美国、日本和韩国正进行“自由之刃”联合军演。8日至24日，在以北海道为中心的地区，日本自卫队将伙同美国、澳大利亚军队一起进行规模超过往届的“东方之盾”联合演习。据悉，此次“东方之盾”联合演习将运用在日本部署的美军“堤丰”中程导弹系统。 文章指出，近年来，日本挥霍巨额军费疯狂推进远程打击手段实战部署，现在又勾结美国等国家执意推进双边及多边联合军演，完全出自妄图提升实战能力来对付朝鲜等周边国家的阴险居心。 文章说，日本战败80多年来一直叫嚷所谓“不沉航母”，把从北海道到九州的列岛全域统统交给美国充当对朝侵略的核前哨基地、兵站基地。文章警告，日本新军国主义者要使列岛全域变成“不沉航母”的企图，必将招致严重灾祸。(新华社)", "ctime": 1788851737, "time_str": "15:15:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260908/c679695577.shtml"}, {"id": "5125805", "title": "古驰悄悄降价", "content": "奢侈品牌古驰Gucci已于近日完成新一轮调价。不过，这次不是涨价，而是降价。且降价范围不仅包括包袋，也涵盖成衣。具体来看，古驰于2026春夏季上市的新款包袋Mercato小号托特包售价从25500元降至20000元，降幅约为27%。Ophidia系列迷你水桶包直降3600元至8700元，降幅超过40%。而此前售价突破万元的GGMarmont系列小水桶包目前售价8100元。成衣部分，帆布连衣裙、连体泳衣、羊毛开衫等的降价幅度也普遍在30%上下。(界面新闻)", "ctime": 1788851713, " 涨跌互现。沪深300股指期货(IF)主力合约跌0.33%，上证50股指期货(IH)主力合约跌0.17%，中证500股指期货(IC)主力合约涨0.25%，中证1000股指期货(IM)主力合约涨0.31%。", "ctime": 1788850830, "time_str": "15:00:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260908/c679695201.shtml"}, {"id": "5125609", "title": "茅台年内第六次调价：自营店飞天涨至1766元，工作人员称“门店产品充足”", "content": "传统销售旺季来临之前，茅台自营店再次上调飞天价格。9月8日，记者从多地的茅台自营店获悉，飞天53%vol 500ml贵州茅台酒（下称“飞天茅台”）的零售价已由1753元/瓶上调至1766元/瓶，距离上一次调价，仅过去一个月时间。这也是贵州茅台年内第六次调价。记者还了解到，除了飞天茅台外，飞天53%vol 1L贵州茅台酒（下称“公斤茅台”）已由3269元/瓶调整为3291元/瓶。此外，此轮涨价还涉及五星53%vol 500ml贵州茅台酒、53%vol 200ml贵州茅台酒、53%vol 500ml×2贵州茅台酒（丙午马年）。值得一提的是，此次还有两款产品价格略微下调，分别为53%vol 50ml×5贵州茅台酒（金色）、飞天43%vol 500ml贵州茅台酒。目前，i茅台APP上，飞天茅台、公斤茅台的零售价并未进行调整，分别为1639元/瓶、3269元/瓶。此次调价之后，茅台自营店的飞天零售价较i茅台高出127元。有茅台自营店工作人员对记者表示，“此次依然是按照‘随行就市’原则进行调价，目前全国自营门店已统一执行新价格。”（澎湃新闻）", "ctime": 1788850814, "time_str": "15:00:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260908/c679695199.shtml"}, {"id": "5125597", "title": "云南昭通市巧家县发生3.3级地震 震源深度8公里", "content": "中国地震台网正式测定：9月8日14时48分，在云南昭通市巧家县（北纬27.00度，东经103.40度）发生3.3级地震，震源深度8公里。", "ctime": 1788850711, "time_str": "14:58:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260908/c679695158.shtml"}, {"id": "5125589", "title": "工信部：制定实施化纤、造纸、乳制品、食糖、食盐等产业政策 组织开展“人工智能＋三品”专项行动", "content": "2026年全国消费品工业座谈会9月8日在河北省石家庄市召开。工业和信息化部副部长谢远生出席会议并讲话。会议强调，要全力保障消费品工业平稳增长。落实好轻纺产业、生物制造、医药工业发展“十五五”规划，制定实施化纤、造纸、乳制品、食糖、食盐等产业政策，强化行业运行调度，推动消费品工业智能化、绿色化、融合化发展。要加快构建现代化消费品产业体系。组织开展“人工智能＋三品”专项行动，建设纺织工业集聚区和地方特色食品产区，推进智能家居跨品牌跨品类互联互通，培育壮大生物医药新兴支柱产业和生物制造未来产业。要有效推动消费市场提质升级。贯彻落实《关于增强消费品供需适配性进一步促进消费的实施方案》，加快实施历史经典产业高质量发展意见，持续发布中国消费名品，组织开展中国消费名品“四个一百”传播推广行动，加快培育一批世界一流消费品牌。要扎实做好重要医疗物资和民生产品供应保障。全面加强国家医药储备管理，持续开展重点医疗物资监测调度，做好短缺药、食盐、新标准电动自行车等产品保供，切实保障民生基本需求。要持续提升行业治理能力。根据实际情况开展重点产品供需适配分析和产能监测预警，完善行业协会管理工作机制，强化行业自律，加快营造有序竞争、风清气正的行业发展环境。", "ctime": 1788850608, "time_str": "14:56:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260908/c679695128.shtml"}, {"id": "5125581", "title": "胡塞武装高层警告：沙特“没有安全之地”", "content": "胡塞武装高层警告称，沙特“没有安全之地”，产油区、工业场地及各类关键设施均不再安全。（财联社）", "ctime": 1788850556, "time_str": "14:55:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260908/c679695114.shtml"}, {"id": "5125535", "title": "上期所燃油主力合约大涨5%", "content": "上期所燃油主力合约大涨5%，报3989元/吨。", "ctime": 1788850373, "time_str": "14:52:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260908/c679695079.shtml"}, {"id": "5125517", "title": "浦发银行：将停办代理上海黄金交易所个人贵金属业务", "content": "浦发银行9月8日在官网发布关于代理上海黄金交易所个人贵金属业务调整的公告称，根据贵金属风险管理和业务需要，该行拟对代理上海黄金交易所个人贵金属业务进行调整，将自2026年9月25日后择时停办代理上海黄金交易所个人贵金属业务，并关闭手机银行、网上银行、网点柜面等渠道的代理上海黄金交易所个人贵金属业务交易权限。关闭后，持仓客户的平仓、卖出和提货等操作权限将受到限制。\n浦发银行提示，为保障客户权益，建议存量持仓客户于2026年9月25日前，通过手机银行、网上银行、网点柜面等渠道，对所持有的各类合约进行卖出、平仓或提货操作，以免业务停办带来不便。", "ctime": 1788850264, "time_str": "14:51:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260908/c679695055.shtml"}, {"id": "5125491", "title": "郑商所PTA主力合约大涨5% 瓶片主力合约涨超4%", "content": "郑商所PTA主力合约大涨5%，报6222元/吨；瓶片主力合约涨超4%，报8060元/吨。", "ctime": 1788850085, "time_str": "14:48:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260908/c679694994.shtml"}, {"id": "5125473", "title": "长沙1宗宅地1.34亿元底价成交", "content": "9月8日，长沙1宗雨花区宅地出让，土地出让面积18999.02平方米（合28.50亩），规划建筑面积56997.06平方米，容积率3，起始价1.34亿元，起始楼面价2350元/平方米。最终长沙市雨花城市建设投资集团有限公司以底价1.34亿元竞得该地块。（人民财讯）", "ctime": 1788849998, "time_str": "14:46:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "h const META     = {"update_time": "2026-09-08 16:14:41", "sentiment_score": 57.02127659574468, "agents": []};

// 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
