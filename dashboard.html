.badge-b { background: rgba(59,130,246,0.2); color: #3b82f6; }

.score-bar {
  height: 6px; border-radius: 3px; background: #1e293b; overflow: hidden;
}
.score-bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s; }
.up { color: var(--red); }
.down { color: var(--green); }
.pulse { animation: pulse 2s infinite; }
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}
.glow { box-shadow: 0 0 20px rgba(59,130,246,0.15); }
::-webkit-scrollbar { width: 6px; }

代类人触觉电子皮肤平台。（人民财讯）", "ctime": 1792562082, "time_str": "13:54:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261021/c680923109.shtml"}, {"id": "5429933", "title": "第十五届中国国际专利技术与产品交易会11月6日至8日在无锡举办", "content": "记者今天（10月21日）从国家知识产权局了解到，第十五届中国国际专利技术与产品交易会将于11月6日至8日在江苏无锡太湖国际博览中心举办，由国家知识产权局主办，主题是“专利链通创新 转化释放价值”，这是我国知识产权领域规格最高、专业性最强、影响力最大的展会活动。本届中国国际专利技术与产品交易会在往届基础上做了不少调整。在组织形式、展示内容、活动策划等方面有不少创新突破，将发布中国知识产权运营年度报告、知识产权金融生态试点典型案例等权威成果。同时，进一步突出交易属性。本届专交会现场搭建专利技术路演平台和交易洽谈区，匹配10余场专题活动，深度链接产业链上中下游资源，为创新主体搭建多层次、多渠道的成果转化桥梁，推动专交会从“看成果、看展览”向“谈合作、做交易、促落地”转变。另外，将举办中美欧日韩五局外观设计国际会议等一系列国际活动，同步对标国际展会通行做法，设立知识产权服务工作站，加强现场知识产权保护与综合服务，提升展会国际化服务能力。（央视新闻）", "ctime": 1792562060, "time_str": "13:54:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261021/c680923092.shtml"}, {"id": "5429879", "title": "美总统特使今日抵俄", "content": "据俄罗斯塔斯社今天（10月21日）报道，美国总统特使威特科夫抵达俄罗斯圣彼得堡。此前一天，威特科夫和乌克兰总统泽连斯基在挪威奥斯陆举行会晤，参会者还包括一些欧洲国家领导人。此次会谈旨在制定一项能够提交俄罗斯方面讨论的和平方案。根据挪威首相斯特勒公布的信息，威特科夫希望在抵达俄罗斯后，与俄罗斯总统普京会面，并向俄方介绍奥斯陆会谈的内容。(CCTV国际时讯)", "ctime": 1792561452, "time_str": "13:44:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261021/c680922781.shtml"}, {"id": "5429867", "title": "宁德时代、雅砻江水电在四川甘孜成立水电开发公司", "content": "企查查APP显示，近日，雅砻江牙根（甘孜州）水电开发有限公司成立，注册资本5亿元，经营范围包含：新兴能源技术研发；太阳能发电技术服务；风力发电技术服务；储能技术服务等。企查查股权穿透显示，该公司由雅砻江流域水电开发有限公司、宁德时代共同持股。（人民财讯）", "ctime": 1792561285, "time_str": "13:41:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261021/c680922714.shtml"}, {"id": "5429811", "title": "新石器在无锡成立智驾科技公司", "content": "企查查APP显示，近日，新石器智驾科技（无锡）有限公司成立，法定代表人为李子夷，经营范围包含：汽车零配件批发；汽车零配件零售；电子产品销售；人工智能应用软件开发；人工智能基础软件开发等。企查查股权穿透显示，该公司由新石器慧通科技股份有限公司间接全资持股。（人民财讯）", "ctime": 1792561068, "time_str": "13:37:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261021/c680922613.shtml"}, {"id": "5429809", "title": "厦门6宗地块108.7亿元底价成交", "content": "10月21日，厦门出让6宗地块，最终均底价成交，总成交金额108.7亿元。其中，思明区1宗涉宅用地和1宗商办用地由华润置地分别以48.79亿元和12.85亿元竞得，成交楼面价分别为40692元/㎡和9179元/㎡；湖里区宅地由招商蛇口和象屿联合体以25.86亿元竞得，成交楼面价37940元/㎡；同安区3宗宅地由厦门轨道分别以10.52亿元、3.22亿元、7.46亿元竞得，成交楼面价分别为10702元/㎡、8183元/㎡、7897元/㎡。（人民财讯）", "ctime": 1792561061, "time_str": "13:37:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261021/c680922602.shtml"}, {"id": "5429761", "title": "光大期货：加息预期反复，黄金窄幅震荡", "content": "10月21日（周三），伦敦现货黄金隔夜冲高回落。影响黄金波动的核心因素在于加息预期的变化，本周进入10月29日议息会议前的静默期，美联储官员公开表态有限；沃什上周已明确美联储不再提前预告政策决定，政策悬念保留至会议最后一刻。短线黄金维持低位震荡。\n宏观方面，面对法国债市动荡，贝森特称预计法国的事不会外溢，但承认观察到避险资金正流入美国国债。据报道，油价传导超预期，日本央行预计将在10月30日结束的政策会议上按兵不动，最早可能于12月再次加息。地缘政治方面，卡塔尔媒体10月20日报道，卡塔尔与巴基斯坦向美国和伊朗提交中间妥协提案并获双方初步认可。受伊朗与美国谈判的妥协方案传闻影响，油价大幅跳水，市场避险情绪有所消退，股债金同步走高，但随后伊朗方面否认协议临近，涨幅最终回吐。由此看近期黄金市场仍受加息预期反复的影响，无论从通胀还是经济韧性的角度均都指向需要进一步紧缩，但美联储10月继续加息的概率并不高，市场正在交易的并非“10月加息”，而是定价“12月大概率再次加息”。金价则被困在“通胀支持继续加息”，但“连续加息可能引起经济和金融市场动荡从而限制加息”的窄幅波动区间内运行。（光大期货）", "ctime": 1792560763, "time_str": "13:32:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261021/c680922452.shtml"}, {"id": "5429757", "title": "鲁比奥称美特使与乌总统会晤是“积极的”", "content": "当地时间10月21日，美国国务卿鲁比奥表示，美国总统特使威特科夫正前往圣彼得堡。此外，威特科夫20日与乌克兰总统泽连斯基的会晤是“积极的”，其间“没有发生任何意料之外”或“令人惊讶”的情况。鲁比奥表示，威特科夫可以带着这些想法前往圣彼得堡，与俄方进行交流。（央视新闻）", "ctime": 1792560756, "time_str": "13:32:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261021/c680922450.shtml"}, {"id": "5429691", "title": "美国“罗斯福”号航母将派往中东 美在中东将增兵约万人", "content": "美国“罗斯福”号航母的社交媒体20日发布的内容显示，该航母近日已抵达日本并进行了物资补给。据美国方面20日的消息，“罗斯福”号航母正被派遣往中东地区。两名美国官员20日称，美国正向中东派遣“罗斯福”号航母打击群和第13海军陆战队远征队。“罗斯福”号航母将于11月底抵达中东，这些新的部署将为美军在中东地区增加约1万名士兵。（央视新闻）", "ctime": 1792560545, "time_str": "13:29:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261021/c680922351.shtml"}, {"id": "5429685", "title": "半导体板块短线拉升，敏芯股份涨停", "content": "半导体板块短线拉升，敏芯股份涨停，灿瑞科技、德明利、澜起科技、艾为电子、恒玄科技跟涨。", "ctime": 1792560384, "time_str": "13:26:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261021/c680922264.shtml"}, {"id": "5429683", "title": "沙特称拦截摧毁5架无人机", "content": "沙特领导的多国联军发言人图尔基·马利基今天（10月21日）发表两份声明称，联军当天先后拦截并摧毁5架飞往沙特境内的无人机。其中一份声明称4架无人机在麦地那地区和东部省被拦截并摧毁，另有一份声明提到，1架无人机在飞往沙特东部地区时被拦截并摧毁。(CCTV国际时讯)", "ctime": 1792560291, "time_str": "13:24:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261021/c680922213.shtml"}, {"id": "5429681", "title": "阿迪达斯2026年第三季度营收同比增长7%，上调全年业绩指引", "content": "10月21日，阿迪达斯全球公布了2026年第三季度初步业绩：全球营收达72.52亿欧元，在货币中性下（下同），同比增长7%；营业利润达10.08亿欧元；毛利率提升2.5个百分点至54.3%。第三季度，阿迪达斯全球收到了美国关税的大部分退款，并据此确认了约2亿欧元的退税，这部分退税对毛利率的改善做出了贡献。基于第三季度超预期的表现，阿迪达斯全球上调了2026年全年业绩指引，公司预计将实现9%-10%的营收增长，营业利润预计将提升至25亿欧元（此前预计为23亿欧元）（界面新闻）", "ctime": 1792560262, "time_str": "13:24:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261021/c680922206.shtml"}, {"id": "5429663", "title": "固态电池板块持续走低，上海洗霸触及跌停", "content": "固态电池板块持续走低，上海洗霸触及跌停，宁德时代跌超11%，紫竹高科、科达利、蔚蓝锂芯跟跌。", "ctime": 1792559879, "time_str": "13:17:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261021/c680922036.shtml"}, {"id": "5429641", "title": "环境部：“十五五”已将“非二氧化碳温室气体减排”列为重大工程", "content": "10月21日上午，国务院新闻办公室举行新闻发布会，生态环境部副部长李高介绍中国积极应对气候变化、参与引领全球气候治理有关情况，并答记者问。针对如何进一步加强非二氧化碳温室气体管控，李高介绍，“十五五”规划纲要已将“非二氧化碳温室气体减排”列为重大工程，将以推动形成3000万吨二氧化碳当量减排能力为目标，通过工程实施取得切实管控成效。（澎湃新闻）", "ctime": 1792559566, "time_str": "13:12:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261021/c680921930.shtml"}, {"id": "5429637", "title": "如何看待特朗普频频公开提及台积电？国台办回应", "content": "10月21日上午，国台办举行例行新闻发布会，发言人张晗就近期两岸热点问题回答记者提问。记者提问称，美国总统特朗普日前再度提到台积电是全球第一的芯片企业，并透露近期与台积电董事长魏哲家通话。请问如何看待特朗普频频公开提及台积电？是否认为美方正进一步强化对台湾半导体掌控？张晗表示，台湾相关产业的竞争优势凝聚着一代又一代台湾业界、企业家和科研人员的心血，得益于广大台湾民众的支持，是台湾同胞的共同资产。民进党当局真是“崽卖爷田不心疼”，致使几代人的心血和奋斗成果不断被消耗，最终损害的是台湾产业界和广大民众的切身利益。（环球网）", "ctime": 1792559400, "time_str": "13:10:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261021/c680921863.shtml"}, {"id": "5429463", "title": "COMEX白银期货跌超1%", "content": "COMEX白银期货跌超1%，现报57.41美元/盎司。", "ctime": 1792558383, "time_str": "12:53:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261021/c680921481.shtml"}, {"id": "5429405", "title": "阿里巴巴成为篮网队官方AI与云合作伙伴", "content": "10月21日，据布鲁克林篮网消息，阿里巴巴正式成为布鲁克林篮网队官方AI与云合作伙伴。", "ctime": 1792557739, "time_str": "12:42:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261021/c680921189.shtml"}, {"id": "5429403", "title": "华润置地、厦门轨道、招商蛇口&象屿分食厦门6宗地 成交总金额108.7亿元", "content": "厦门今日出让6宗地块，总规划建筑面积56.018万平方米，起始总价108.7亿元。最终，这6宗地均完成出让，成交总金额108.7亿元。其中，华润置地以48.79亿元的价格，竞得思明区一宗建筑面积约11.99万平方米的综合用地（含住宅），成交楼面价40692元/平方米，溢价率0.00%；其还以12.85亿元的价格拍下湖里区东渡片区一宗建筑面积约14万平方米的商办用地，成交楼面价9179元/平方米，溢价率0.00%。此外，厦门轨道分别以10.52亿元、3.22亿元、7.46亿元的价格，拍得同安区美林片区3宗地。另一宗位于湖里区东渡片区的宅地，被招商蛇口、象屿联合体以25.86亿元的价格竞得，成交楼面价37940元/平方米。（财联社）", "ctime": 1792557706, "time_str": "12:41:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261021/c680921175.shtml"}, {"id": "5429339", "title": "美大使承认在中东搞23次政变都失败", "content": "美国驻土耳其大使兼任美国叙利亚问题特使汤姆·巴拉克当地时间10月20日在一次论坛上承认，美国在中东及周边地区发动了23次政权更迭，但都失败了，美国试图进行干预，更换当权者或改变政权的行动是错误的。巴拉克表示，美国试图控制利比亚、阿富汗、叙利亚、伊拉克等地，但都没有奏效，他呼吁美国政府转变在中东的策略，要照管，但不会离开。(CCTV国际时讯)", "ctime": 1792556691, "time_str": "12:24:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261021/c680920679.shtml"}, {"id": "5429337", "title": "中国船级社发布船载碳捕集系统白皮书", "content": "2026北外滩国际航运论坛·绿色与低碳论坛10月21日举行。中国船级社在论坛期间发布船载碳捕集系统（OCCS）白皮书，阐释化学吸收、矿化法等7大技术路线，明确工程化适用场景，提出全链条监管框架方向，为全球航运业的OCCS规模化应用、商业化落地提供“中国方案”。（人民财讯）", "ctime": 1792556650, "time_str": "12:24:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261021/c680920661.shtml"}, {"id": "5429325", "title": "超强台风“蔷琵”逼近 浙江启动海上防台风应急响应", "content": "超强台风“蔷琵”正趋向台湾东部沿海，后期将带来明显风雨。中央气象台预计，台风“蔷琵”可能于24日前后在台湾东部沿海登陆（42～50米/秒，强台风级），穿过台湾后在福建二次登陆（28～33米/秒，强热带风暴级或台风级）；也可能在台湾东北部海面转向东北方向移动，强度逐渐减弱。虽然“蔷琵”的路径仍不确定，但两种路径情景下，我国东南部海域及浙江沿海、福建沿海、台湾沿海、上海沿海都将有强风雨天气。（央视新闻）", "ctime": 1792556421, "time_str": "12:20:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261021/c680920545.shtml"}, {"id": "5429309", "title": "2026年亚太经合组织财长会在香港举行", "content": "2026年10月20日至21日，第33届亚太经合组织（APEC）财长会在中国香港特别行政区举行。财政部部长蓝佛安作为会议主席主持会议并致辞，副部长廖岷代表中方发言。\n会议聚焦APEC中国年“建设亚太共同体、促进共同繁荣”主题，围绕全球和区域宏观经济金融形势、支持民生发展的财政政策、数字基础设施融资、因地制宜促进普惠金融发展和促进APEC青年财经人才交流合作等议题进行了讨论。会议审议通过《2026年APEC财长联合声明》和《亚太地区数字基础设施融资政策声明》，为亚太经济体深化财金合作指明了方向。会议还形成《支持民生发展与投资于人——推动亚太地区可持续增长的财政政策报告》《亚太地区普惠金融创新实践案例集》等成果文件，并同意继续推进亚太地区青年财经人才交流与合作。 \n蓝佛安指出，当前国际形势变乱交织，地缘冲突影响外溢，世界经济增长面临多重挑战。APEC作为亚太地区主要经济合作平台，积极促进成员开放合作，加强宏观政策协调，推动区域经济一体化、助力亚太地区共同发展繁荣。各方应坚定落实APEC领导人非正式会议共识，坚持多边主义，深化财金领域务实合作，为区域经济金融稳定和长期可持续增长作出贡献。(财政部)", "ctime": 1792556311, "time_str": "12:18:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261021/c680920492.shtml"}, {"id": "5429305", "title": "个人养老金配置“上新”，融通深证100指数增设Y份额", "content": "融通基金公告，融通深证100指数基金于10月19日增设Y份额，作为个人养老金专属份额，投资者可通过个人养老金账户申购。融通深证100指数基金成立于2003年9月，跟踪的是深证100R，该指数甄选深交所上市、市值规模大、流动性优良的100只个股，成份股覆盖深市主板与创业板，在行业结构上横跨传统与新兴，既有家电、食品饮料等消费龙头，也有新能源、电子、生物医药等成长赛道。iFinD数据显示，截至2026年9月30日，指数成份股分布在22个中信一级行业中，前五大权重行业为电子（22.23%）、通信（17.66%）、电力设备及新能源（13.07%）、家电（7.28%）、汽车（4.58%）。相较于单一风格指数，该指数的行业分布更均衡。（证券时报）", "ctime": 1792556262, "time_str": "12:17:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261021/c680920441.shtml"}, {"id": "5429299", "title": "特朗普：现在讨论是否支持万斯2028年参选总统“为时尚早”", "content": "美国总统特朗普10月20日在白宫椭圆形办公室回答记者提问时表示，现在讨论是否支持副总统万斯2028年参选总统“为时尚早”，并称两人此前未就此事进行过讨论。特朗普称，万斯“很有才干”，但“现在讨论此事还为时尚早，我们必须先度过中期选举”。据报道，万斯在接受采访时称，如果自己2028年参选美国总统，他认为特朗普会为其背书。不过，万斯同时承认，自己尚未与特朗普谈过此事。（财联社）", "ctime": 1792556243, "time_str": "12:17:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261021/c680920392.shtml"}, {"id": "5429295", "title": "特朗普称美援乌数千亿却一无所获：是时候达成俄乌协议了", "content": "美国总统特朗普10月20日在白宫接受媒体采访时表示，现在是时候达成俄乌协议了。特朗普称，美国已向乌克兰提供大量军事装备和物资，已投入数千亿美元，但除了悲痛、死亡、高价柴油和巨大的经济损失，“一无所获”。他强调乌克兰“必须愿意”达成协议，泽连斯基“必须愿意”结束战争，否则“后果将非常严重”。特朗普还称，欧洲已经厌倦了这一切，美国纳税人也已经“受够了”。（央视新闻）", "ctime": 1792556232, "time_str": "12:17:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261021/c680920390.shtml"}, {"id": "5429249", "title": "五羊星座首发星发射 未来将具备30分钟级灾害应急响应能力", "content": "今天（21日）上午，我国自主研制的五羊星座首发星，即：先导A星（广大一号），搭乘谷神星一号海射型运载火箭，在山东日照黄海海上发射平台发射。这标志着全球首个低纬度高频遥感观测网络正式进入组网建设阶段。未来，五羊星座将在应急减灾、精准农业、海洋监测、港口航运等领域提供即感、即传、即用的遥感数据服务，为我国高质量发展提供空天信息支撑。（央视新闻）", "ctime": 1792556021, "time_str": "12:13:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261021/c680920294.shtml"}, {"id": "5429243", "title": "最高法发布典型案例 明确司法责任追究边界", "content": "最高人民法院今天发布《人民法院司法责任追究条例》。为便于准确理解、适用《条例》，最高法发布了6个典型案例。其中，4个是追究司法责任的典型案例，2个是保护依法履职的典型案例。（央视新闻）", "ctime": 1792555961, "time_str": "12:12:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261021/c680920265.shtml"}, {"id": "5429233", "title": "上海航空枢纽建设迈向“两地三场”，2035年客流目标2亿人次", "content": "10月20日，在2026北外滩国际航运论坛开幕式上，《新时代新征程上海国际航空枢纽战略规划》（以下简称《规划》）正式发布。这是中国民航局、国家发展改革委、交通运输部联合印发《国际航空枢纽建设实施方案》之后，全国首个地方系统性落地规划。《规划》提出，上海将分三个阶段建设具有世界影响力的全方位门户复合型国际航空枢纽：到2030年基本建成亚太领先航空枢纽，完成浦东机场四期扩建工程；到2035年进入世界一流航空枢纽前列，建成南通新机场，形成“两地三场”一体化运营的国际航空枢纽体系；到本世纪中叶，全面建成具有世界影响力的全方位门户复合型国际航空枢纽。这意味着，上海国际航空枢纽将从目前的浦东、虹桥“两场”，向浦东、虹桥、南通“两地三场”演进。（第一财经）", "ctime": 1792555870, "time_str": "12:11:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261021/c680920240.shtml"}, {"id": "5429217", "title": "工行行长刘珺：融合数字维度的人民币国际化 需建立与时俱进的全球监管协调机制和监管科技", "content": "中国工商银行行长刘珺10月21日在2026数字人民币年会上表示，未来的国际货币体系，不只是主权货币的相互组合，更是与法定数字货币相互共生、相互交织的新格局，人民币国际化也必将注入数字维度。与之相应，融合数字维度的人民币国际化，需要多目标迭代推进，引入多元市场参与者，建立与时俱进的全球监管协调机制和监管科技。(上海证券报)", "ctime": 1792555817, "time_str": "12:10:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261021/c680920222.shtml"}, {"id": "5429213", "title": "和誉－Ｂ：核心产品用于治疗软骨发育不全获欧洲药品管理局孤儿药资格", "content": "和誉－Ｂ发布自愿公告，2026年10月21日，公司附属公司和誉医药宣布，其自主研发的口服选择性小分子成纤维细胞生长因子受体2及3抑制剂用于治疗软骨发育不全，已获得欧洲药品管理局授予的孤儿药资格。此前，该药物治疗软骨发育不全适应症已获得美国食品药品监督管理局授予的孤儿药资格及罕见儿科疾病资格，其新药临床试验申请已获批准。目前，公司正积极推进该药物治疗3至12岁软骨发育不全儿童的二期临床研究。", "ctime": 1792555678, "time_str": "12:07:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261021/c680920121.shtml"}, {"id": "5429205", "title": "谷神星一号海射型遥八运载火箭发射成功", "content": "今天，我国太原卫星发射中心在山东附近海域成功发射谷神星一号海射型遥八运载火箭，搭载发射的西光肆号01星顺利进入预定轨道，飞行试验任务取得圆满成功。(央视军事)", "ctime": 1792555480, "time_str": "12:04:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261021/c680920026.shtml"}, {"id": "5429203", "title": "美副总统拒称乌克兰为“盟友”", "content": "美国副总统万斯日前在一段视频访谈中表示，美国与乌克兰没有正式结盟。乌克兰不是北约成员，也不应加入北约，但美乌两国的合作仍将继续。 在一档名为“2WAY Tonight”的视频节目中，当被问及乌克兰是否为美国的盟友时，万斯回答，“他们在某些方面当然算是伙伴，但我们时不时会有一些利益分歧”。当被追问“伙伴是否等同于盟友，还是说二者属于相对不那么密切的关系”时，万斯说，“据我所知，我们同乌克兰没有正式盟友关系”。 万斯表示，乌克兰不是北约成员，也不应加入北约。“我们会在一些事务上合作，但在一些事情上我们也会意见相左。” 万斯还称，乌克兰轰炸俄罗斯柴油设施抬高了美国人的能源成本，他们应停止袭击俄能源设施。 10月上旬，特朗普政府宣布放松对俄柴油贸易制裁，并称已与俄方达成由俄向美及全球市场提供柴油的协议。乌克兰方面表示反对，此后美乌关系进一步恶化。(新华社)", "ctime": 1792555445, "time_str": "12:04:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261021/c680920013.shtml"}, {"id": "5429201", "title": "我国沿海已有9个港口完成绿色甲醇加注作业", "content": "2026北外滩国际航运论坛·绿色与低碳论坛10月21日举行。针对当前全球港口业关注的绿色燃料加注新趋势，中国港口协会会长顾金山表示，目前我国沿海已有9个港口陆续完成绿色甲醇的加注作业。下一步，要持续拓展清洁能源加注服务能力，完善绿色燃料从生产端、加注端、使用端、交易端的全链条支持政策，推动港口从用能者向供能者转变，实现港口与航运的跨区域协同脱碳。（人民财讯）", "ctime": 1792555426, "time_str": "12:03:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261021/c680920001.shtml"}, {"id": "5429197", "title": "10月21日午间公告一览：国光股份签署共建合作协议", "content": "国光股份公告，与华中农业大学、湖北洪山实验室签署了《“园艺产品绿色保鲜投入品研究院”共建合作协议》；豫能控股公告，汝州新能源公司完成工商注册登记。", "ctime": 1792555370, "time_str": "12:02:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261021/c680919976.shtml"}, {"id": "5429183", "title": "港股午评：恒生指数跌0.35%，恒生科技指数跌0.75%", "content": "港股午间收盘，恒生指数跌0.35%，恒生科技指数跌0.75%。恒指港股通ETF银华（159318）跌0.24%，港股通科技ETF鹏华（159751）跌0.38%。板块方面，可选消费经销Ⅲ、可选消费经销Ⅳ板块涨幅靠前；储能设备、电源设备板块跌幅靠前。个股方面，亮晴控股涨10.65%，澜起科技涨7.88%，海致科技集团涨7.59%，白鸽在线涨7.11%，东莞农商银行涨6.55%；嘉耀控股跌17.96%，宁德时代跌10.1%，力勤资源跌8.81%，传音控股跌8.49%，福耀玻璃跌7.68%。", "ctime": 1792555267, "time_str": "12:01:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261021/c680919950.shtml"}, {"id": "5429171", "title": "星巴克明日起在全国开始实施消费入座", "content": "星巴克中国今日宣传2027新财年将新增投入超3亿元，聚焦门店服务体验焕新。同时，星巴克中国就门店空间共享与氛围维护，发布《第三空间倡议》。记者获悉，10月22日起，星巴克将在全国开始施行消费入座，门店会摆放相关提示牌。（科创板日报）", "ctime": 1792555042, "time_str": "11:57:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261021/c680919835.shtml"}, {"id": "5429143", "title": "深圳人才房政策放宽：社保满1年，无房记录降至3年", "content": "深圳人才住房配售门槛进一步放宽。10月21日，深圳市住房保障署发布配售公告，对比此前批次配售条件发现，本批次申购条件出现明显放宽：90平以下房源由四个队列增至五个；社保最低累计1年即可申购，房产交易记录核查由5年缩短至3年。这意味着，更多社保刚满1年的新市民家庭将获得人才房申购资格，曾有过房产交易、但目前无房且满3年的改善型家庭也重新获得申购机会。（南方+）", "ctime": 1792554433, "time_str": "11:47:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261021/c680919595.shtml"}, {"id": "5429141", "title": "上海港—汉堡港绿色航运走廊发展目标和路线图发布", "content": "2026北外滩国际航运论坛·绿色与低碳论坛10月21日举行。论坛期间，上海港—汉堡港绿色航运走廊发展目标和路线图正式发布。各参与方将积极行动，在2028年至2035年期间于走廊稳步提升双燃料集装箱船舶的部署能力和减碳水平，持续提升电力和清洁能源在港口用能中的占比，加快形成多元稳定的低碳燃料供应格局。（人民财讯）", "ctime": 1792554113, "time_str": "11:41:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261021/c680919485.shtml"}, {"id": "5429131", "title": "支持万斯参选下届总统？特朗普：现在讨论“为时尚早”", "content": "美国总统特朗普20日说，现在讨论是否支持副总统万斯2028年参选总统“为时尚早”，并称两人此前未就此事进行过讨论。特朗普当天在白宫椭圆形办公室回答记者提问时说，万斯“很有才干”，但“现在讨论此事还为时尚早，我们必须先度过中期选举”。（新华社）", "ctime": 1792554004, "time_str": "11:40:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261021/c680919442.shtml"}, {"id": "5429125", "title": "现货黄金站上4130美元/盎司", "content": "现货黄金站上4130美元/盎司，日内涨0.17%。国内金价报887.0元/克，现跌0.11%。", "ctime": 1792553770, "time_str": "11:36:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261021/c680919237.shtml"}, {"id": "5429123", "title": "天津出台公积金新规新增提取情形", "content": "天津市住房公积金管理中心21日对外发布相关通知，新增自住住房物业费、新购自住住房装修费和自住住房装修翻新费提取情形，将住房公积金使用范围进一步拓展至住房持有期间的相关支出。根据新政策，在天津市行政区域内持有住房的，职工及其配偶每年12月31日（含当日）前可提取一次住房公积金支付物业费，每年提取金额合计不超过3000元。对于新购自住住房，在天津市行政区域内购买住房，符合本市购房提取住房公积金条件的，职工及其配偶可在新建住房购房合同确定的交付之日起两年内、二手住房取得住房产权之日起两年内就该套住房提取一次住房公积金支付住房装修费用，提取金额合计不超过每平方米1500元乘以所购住房建筑面积，且不超过15万元。此外，对于装修翻新需求，在天津市行政区域内持有同一套住房满10年且近一年内未提取住房公积金用于购房款、首付款或偿还住房贷款本息的，职工及其配偶可就该套住房提取一次住房公积金用于厨卫、门窗、墙面等局部修缮改造，改善居住条件，提取金额合计不超过3万元。为保障职工权益，通知还明确了相关提取业务的办理期限调整安排。其中，规定新购住房装修费提取截止日期在2026年9月20日至2026年12月31日期间的，提取截止日期顺延6个月；2026年物业费未在2026年12月31日前提取的，提取截止日期顺延至2027年6月30日。（新华社）", "ctime": 1792553619, "time_str": "11:33:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261021/c680919135.shtml"}, {"id": "5429121", "title": "ETF两市成交额报3048.76亿元，较昨日此时缩量217.94亿元", "content": "截至目前，ETF两市成交额报3048.76亿元，较昨日此时缩量217.94亿元，分类型来看，股票型ETF成交额733.01亿元，债券型ETF成交额1773.72亿元，货币型ETF成交额173.34亿元，商品型ETF成交额35.98亿元，QDII型ETF成交额332.7亿元。其中，成交额最高的非货币型ETF分别是中韩半导体ETF（513310）、创业板ETF（159915）、科创50ETF（588000），成交额分别为：58.99亿元、58.06亿元、43.87亿元。", "ctime": 1792553521, "time_str": "11:32:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261021/c680919088.shtml"}, {"id": "5429117", "title": "ETF午评：标普生物科技ETF领涨3.54%，电池ETF领跌3.47%", "content": "ETF午间收盘涨跌不一，标普生物科技ETF（159502）领涨3.54%，创业板算力ETF（158059）涨2.97%，创业板算力ETF（158049）涨2.84%，电池ETF（159796）领跌3.47%，新能源ETF（516270）跌3.4%，电池ETF（560910）跌3.39%。", "ctime": 1792553459, "time_str": "11:30:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261021/c680919057.shtml"}, {"id": "5429119", "title": "A股午评：创业板指高开低走跌1.07%，IT服务、养殖业、文化传媒板块涨幅居前", "content": "A股三大指数早盘集体下跌，截至午盘，上证指数跌0.31%，深证成指跌0.31%，创业板指跌1.07%，北证50跌0.55%，科   if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
