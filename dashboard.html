.97%；净亏损449.48万元，上年同期净亏损255.34万元。", "ctime": 1775644193, "time_str": "18:29:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260408/c675839459.shtml"}, {"id": "4199777", "title": "中国海军“丝路方舟”号医院船抵达巴布亚新几内亚", "content": "中国海军“丝路方舟”号医院船8日抵达巴布亚新几内亚莫尔兹比港，开始为期7天的友好访问并开展医疗服务。“丝路方舟”号医院船正在执行“和谐使命-2025”任务，这是其中一站。此前，中国海军医院船曾分别于2014年、2018年到访巴新。访问期间，医院船将举办甲板招待会，任务指挥员将拜会巴新军政要员，任务官兵将与巴新国防军开展篮球友谊赛，赴中国-巴新友谊学校·布图卡学园参观，走访巴斯里斯克海军基地并前往巴新大学医学院开展医学学术交流。(新华社)", "ctime": 1775644151, "time_str": "18:29:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260408/c675839446.shtml"}, {"id": "4199773", "title": "土耳其主要BIST-100指数延续涨势，上涨4.8%", "content": "土耳其主要BIST-100指数延续涨势，上涨4.8%；土耳其主要银行业指数.XBANK延续涨势，上涨9.1%。", "ctime": 1775644122, "time_str": "18:28:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260408/c675839417.shtml"}, {"id": "4199761", "title": "智谱GLM-5.1“Day0”上线华为云", "content": "据华为消息，4月8日，智谱正式发布新一代旗舰模型GLM-5.1，发布当天已上线华为云，并成功对接华为云多款产品。该模型整体能力全面提升，是目前全球最强的开源模型，Coding能力刷新全球最佳成绩，在长程任务（Long Horizon Task）处理能力上实现突破，能够在单次任务中持续、自主地工作长达8小时，交付完整的工程级成果。", "ctime": 1775643953, "time_str": "18:25:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260408/c675839369.shtml"}, {"id": "4199753", "title": "以军要求黎巴嫩多地民众撤离 称将继续在黎开展军事行动", "content": "以色列国防军阿拉伯语发言人8日午间通过社交媒体发表声明说，以军要求黎巴嫩首都贝鲁特南部7个社区以及扎赫拉尼河以南的居民“立即撤离”，以军将继续对当地发动打击。以军说，以军持续在贝鲁特南部各地对黎巴嫩真主党的军事基础设施展开行动和袭击。此外，以军在另一份声明中说，当前停火协议“并不包括黎巴嫩”，以军将继续开展地面军事行动。以军要求居住在扎赫拉尼河以南的黎巴嫩居民立即撤向该河以北地区，称继续留在扎赫拉尼河以南地区“将危及生命安全”。(新华社)", "ctime": 1775643894, "time_str": "18:24:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260408/c675839354.shtml"}, {"id": "4199751", "title": "以军空袭黎巴嫩南部及东部多地 致至少19人死亡", "content": "据黎巴嫩医护人员统计，8日以色列国防军空袭黎巴嫩南部提尔地区附近的斯里法村，造成至少10人死亡。该村村长表示，救援队尚未完成废墟搜寻工作。当日，以色列空袭黎南部城市西顿，造成9人死亡；当日早晨，以色列还空袭了黎巴嫩东部贝卡谷地的约莫尔村。（央视新闻）", "ctime": 1775643761, "time_str": "18:22:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260408/c675839312.shtml"}, {"id": "4199749", "title": "伊朗革命卫队将发布“真实承诺-4”第100轮行动战略声明", "content": "总台记者当地时间8日获悉，伊朗伊斯兰革命卫队即将发布“真实承诺-4”第100轮行动的战略声明。（央视新闻）", "ctime": 1775643754, "time_str": "18:22:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260408/c675839310.shtml"}, {"id": "4199747", "title": "美副总统万斯：美伊停火为“脆弱休战” 特朗普“急于看到进展”", "content": "当地时间4月8日，美国副总统万斯在匈牙利出席活动时表示，美国与伊朗达成的停火是一项“脆弱的休战”。他未透露更多细节，仅表示协议内容包括停火、推进谈判以及重开霍尔木兹海峡。万斯表示，美总统特朗普已要求负责与伊朗谈判的美国代表“本着诚意”展开磋商，但同时称特朗普“急于看到进展”。他还表示，美国已准备好动用“非同寻常的经济杠杆”，但特朗普已指示美方“暂不使用这些手段”。万斯称，如果伊朗“本着诚意”谈判，美方有可能达成协议，但“最终如何谈判取决于伊朗人”。（央视新闻）", "ctime": 1775643741, "time_str": "18:22:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260408/c675839305.shtml"}, {"id": "4199743", "title": "国家金融监督管理总局：合理确定普惠型涉农贷款内部倾斜政策，坚决防止并纠正“内卷式”竞争行为", "content": "国家金融监督管理总局发布《关于做好2026年金融支持乡村全面振兴工作的通知》。《通知》明确，2026年农业发展银行、大中型商业银行要继续单列涉农信贷计划，努力实现同口径涉农贷款余额较年初持续增长目标。引导大中型银行积极发展农业产业链金融，拓展首贷户，以改革促农村中小银行支农支小能力提升，合理确定普惠型涉农贷款内部倾斜政策，坚决防止并纠正“内卷式”竞争行为。优化涉农信贷产品和服务，结合“三农”特点提供更为适配的信贷产品，依法合规加大对涉农企业和农户贷款展期、续贷支持力度。强化稻谷、小麦、玉米、大豆保险保障，因地制宜发展地方优势特色农产品保险。发挥农业保险在防灾减灾中的作用。", "ctime": 1775643577, "time_str": "18:19:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260408/c675839259.shtml"}, {"id": "4199737", "title": "仙鹤股份：实控人王明龙因涉嫌短线交易被立案", "content": "仙鹤股份公告，公司实际控制人之一王明龙因涉嫌短线交易，于2026年4月3日收到中国证券监督管理委员会出具的《立案告知书》。同时，因未将借用他人证券账户持有仙鹤股份股票事项及时告知公司，导致公司控股股东及一致行动人合计持有公司股份比例达到80%时未及时披露，王明龙被采取责令改正的监督管理措施，并记入证券期货市场诚信档案。上海证券交易所也对王明龙予以监管警示。本次立案系针对王明龙个人，与公司日常经营管理和业务活动无关，不会对公司生产经营活动产生影响。", "ctime": 1775643493, "time_str": "18:18:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260408/c675839232.shtml"}, {"id": "4199717", "title": "清明假期广深港高铁累计运输旅客超60万人次", "content": "记者从深圳铁路部门获悉，为期5天的清明假期铁路运输于4月7日落幕。4月3日至7日，广深港高铁累计运送跨境旅客达64.2万人次，同比增幅22.5%。（人民财讯）", "ctime": 1775643298, "time_str": "18:14:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260408/c675839151.shtml"}, {"id": "4199711", "title": "泽璟制药：注射用ZG006联合疗法临床试验获批准", "content": "泽璟制药公告，公司于近日收到国家药品监督管理局核准签发的《药物临床试验批准通知书》，注射用ZG006联合注射用HS-20093联合或不联合阿得贝利单抗注射液治疗广泛期小细胞肺癌的临床试验获得批准。", "ctime": 1775643258, "time_str": "18:14:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260408/c675839141.shtml"}, {"id": "4199707", "title": "里海发生5.5级地震 震源深度10公里", "content": "中国地震台网正式测定：4月8日17时05分，在里海（北纬38.70度，东经49.60度）发生5.5级地震，震源深度10公里。（央视新闻）", "ctime": 1775643146, "time_str": "18:12:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260408/c675838822.shtml"}, {"id": "4199695", "title": "美前国土安全部长“人走专机留”", "content": "据美国方面7日消息，3月初遭美国总统特朗普解职的国土安全部长克丽丝蒂·诺姆曾租赁一架造价7000万美元的豪华专机，这架专机已由国土安全部出资买下，转供政府内阁官员使用。此举被指违反“专款专用”原则。书面文件显示，这架专机的用途是内阁级官员旅行和“重要人物的遣返”，但实际上主要供诺姆及其高级助理科里·莱万多夫斯基使用。该机规格优于一般政府专机，虽然奢华程度不及总统专机“空军一号”，但设施好于副总统万斯的专机。知情人士称，该机内设一张加大双人床、四台大型平板电视，并自带淋浴间、厨房和吧台。（央视新闻）", "ctime": 1775642924, "time_str": "18:08:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260408/c675838451.shtml"}, {"id": "4199691", "title": "美伊同意停火后 首批船只通过霍尔木兹海峡", "content": "当地时间4月8日，船舶追踪网站MarineTraffic记录到美伊同意停火后首批通过霍尔木兹海峡的船舶活动。据了解，希腊籍散货船“NJ Earth”号于格林尼治时间8时44分通过海峡，悬挂利比里亚国旗的“Daytona Beach”号于格林尼治时间6时59分通过，此前该船于格林尼治时间5时28分离开阿巴斯港。根据MarineTraffic的数据，该地区仍有数百艘船舶，其中包括426艘油轮、34艘液化石油气运输船和19艘液化天然气运输船。（央视新闻）", "ctime": 1775642889, "time_str": "18:08:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260408/c675838446.shtml"}, {"id": "4199685", "title": "安凯微：首次回购0.02%公司股份，已支付资金总额为人民币84.9万元", "content": "安凯微公告，公司于2026年4月8日通过上海证券交易所交易系统以集中竞价交易方式首次回购公司股份78810股，占公司总股本的0.02%，回购成交的最高价为10.8元/股，最低价为10.76元/股，支付的资金总额为人民币84.9万元（不含印花税、交易佣金等交易费用）。", "ctime": 1775642723, "time_str": "18:05:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260408/c675838363.shtml"}, {"id": "4199639", "title": "云南能投：昌宁公司投资建设中寨风电场项目", "content": "云南能投公告，昌宁云能新能源有限公司投资建设中寨风电场项目，项目装机容量37.5MW，项目总投资2.21亿元（含流动资金112.50万元）。本项目资本金按总投资的20%计，其余资金采用银行贷款等债务融资方式筹措。", "ctime": 1775642315, "time_str": "17:58:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260408/c675838248.shtml"}, {"id": "4199637", "title": "云南能投：昌宁云能新能源有限公司投资建设长田风电场项目", "content": "云南能投公告，为紧紧把握战略发展机遇，促进公司新能源业务的做强做优做大，同意昌宁云能新能源有限公司投资建设长田风电场项目，项目装机容量43.75MW，项目总投资2.59亿元（含流动资金131.25万元）。本项目资本金按总投资的20%计，其余资金采用银行贷款等债务融资方式筹措。", "ctime": 1775642308, "time_str": "17:58:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260408/c675838247.shtml"}, {"id": "4199635", "title": "中国铝业：中铝集团增持1.13%耗资约人民币10.15亿元", "content": "中国铝业公告，中铝集团及一致行动人已于2025年4月9日至2026年4月8日通过上交所、香港联交所集中竞价增持A股9734.96万股、H股9568万股，合计1.93亿股，占公司总股本1.13%，累计耗资约人民币10.15亿元，达到原定人民币10亿元下限；增持后合计持股57.56亿股，占33.55%。", "ctime": 1775642301, "time_str": "17:58:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260408/c675838246.shtml"}, {"id": "4199633", "title": "中国铝业：预计2026年第一季度净利润为53.02亿元至55.85亿元，同比增加50%至58%", "content": "中国铝业公告，预计2026年第一季度实现净利润为53.02亿元至55.85亿元，同比增加50%至58%。预计归属于上市公司股东的扣除非经常性损益的净利润为人民币51.37亿元至人民币54.2亿元，同比增加49%至58%。公司面对市场波动、机遇及挑战，狠抓极致经营管理，深挖全面降本增效，在资源端自采矿比率进一步提高，在产成品端全部产能满产稳产优产，各项生产经营指标持续优化，市场变现能力和综合竞争力不断提升，全产业链优势得到充分发挥，实现经营业绩大幅提升，创历史同期最好水平。", "ctime": 1775642295, "time_str": "17:58:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260408/c675838243.shtml"}, {"id": "4199631", "title": "英利汽车：控股股东开曼英利拟减持不超过3%", "content": "英利汽车公告，控股股东开曼英利持有12.51亿股，占78.90%；拟因资金需求自公告披露日起15个交易日后的3个月内（2026年5月6日～2026年8月5日），通过集中竞价和大宗交易合计减持不超4757.36万股，即不超3%。其中集中竞价任意连续90日内不超1585.79万股（1%），大宗交易不超3171.57万股（2%）。", "ctime": 1775642289, "time_str": "17:58:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260408/c675838241.shtml"}, {"id": "4199627", "title": "Fabrinet美股盘前涨超10%", "content": "Fabrinet美股盘前涨超10%，现报618.99美元。", "ctime": 1775642265, "time_str": "17:57:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260408/c675838234.shtml"}, {"id": "4199621", "title": "特朗普称能轻易恢复对伊朗动武", "content": "美国总统特朗普8日表示，如果美国同伊朗谈判不顺，美方将能轻易恢复对伊朗的军事行动。特朗普当天接受英国天空新闻网采访时说，美伊两周停火“非常好”，在伊朗的所有军事目标都已经达成，“我们在军事上已经完成一切想做的事，美国在军事上取得了完全胜利”。（新华社）", "ctime": 1775642188, "time_str": "17:56:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260408/c675838211.shtml"}, {"id": "4199619", "title": "山金国际：黄金集团增持耗资5.1亿元，占0.2938%", "content": "山金国际公告，控股股东山东黄金矿业股份有限公司上层股东黄金集团完成增持计划，2025年7月31日至2026年4月8日通过集中竞价增持1354.51万股，耗资5.1亿元，占山东黄金总股本0.2938%；增持后黄金集团及一致行动人合计持有19.81亿股，占42.9760%。", "ctime": 1775642157, "time_str": "17:55:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260408/c675838202.shtml"}, {"i // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
