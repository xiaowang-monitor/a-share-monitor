: "", "url": "https://news.10jqka.com.cn/20260723/c678387089.shtml"}, {"id": "4789737", "title": "约旦称过去24小时已拦截3枚导弹6架无人机", "content": "当地时间23日，约旦武装部队总司令部表示，过去24小时内，约旦皇家空军共应对4枚射向约旦境内的伊朗导弹和6架伊朗无人机。约旦军方表示，当天上午，约旦防空系统成功拦截并击落3枚导弹，第4枚导弹落入一处无人居住的偏远地区。22日晚，约旦防空系统还拦截并击落6架无人机。上述事件未造成人员伤亡和财产损失。（央视新闻）", "ctime": 1784798048, "time_str": "17:14:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260723/c678387038.shtml"}, {"id": "4789735", "title": "瑞立科密：程毅所持标的公司16.00%股权已过户登记至公司名下", "content": "瑞立科密公告，程毅先生持有的武汉瑞立科德斯汽车电子有限责任公司16%股权已完成过户登记至公司名下，标的公司已办理完毕变更登记手续。本次交易尚需公司向交易对方发行股份以支付交易对价，并办理新增股份相关登记和上市手续，以及注册资本、《公司章程》等变更事宜的登记或备案手续。此外，相关各方还需确定过渡期内标的资产产生的损益，并执行过渡期损益归属的约定。", "ctime": 1784798016, "time_str": "17:13:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260723/c678387028.shtml"}, {"id": "4789733", "title": "兴欣新材：拟以5000万元-1亿元回购公司股份", "content": "兴欣新材公告，拟以5000万元-1亿元回购公司股份，回购价格不超过32元/股。", "ctime": 1784798008, "time_str": "17:13:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260723/c678387022.shtml"}, {"id": "4789729", "title": "九安医疗：参与投资的砺思星雀基金已募集完成，总额9.28亿元", "content": "九安医疗公告，公司此前披露以自有资金向砺思星雀基金出资1亿元。近日该基金已募集完成，收到全体合伙人实缴出资，募集资金总额为9.28亿元，公司作为有限合伙人认缴出资1亿元，认缴出资比例10.7759%。", "ctime": 1784797915, "time_str": "17:11:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260723/c678386967.shtml"}, {"id": "4789727", "title": "凯淳股份：股东益松壹号减持期满未减持", "content": "凯淳股份公告，持股5%以上股东益松壹号减持计划期满，在减持计划期间内（2026年4月23日至2026年7月22日）未减持公司股票。本次变动前后，益松壹号合计持有股份均为720万股，占总股本比例9%，占剔除回购后总股本的比例9.04%。", "ctime": 1784797881, "time_str": "17:11:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260723/c678386957.shtml"}, {"id": "4789725", "title": "最高气温超40℃ 重庆发布高温中暑二级预警", "content": "7月21日—22日，重庆出现大范围高温天气，渝中、沙坪坝、江津、潼南等13个区县连续两天日最高气温超过40℃。预计7月23日—25日，重庆仍将持续晴热高温天气，大部地区日最高气温37℃以上，其中渝中、大渡口、沙坪坝、九龙坡、南岸、北碚、江津、合川、永川、璧山、铜梁、潼南、涪陵、綦江、荣昌、云阳、高新区17个区县日最高气温可达40℃～42℃，巴南、长寿、南川、大足、开州、梁平、武隆、丰都、忠县、奉节、巫溪、石柱、彭水、两江新区、万盛15个区县日最高气温可达37℃～39℃，极易发生高温中暑。重庆市卫生健康委员会、重庆市气象局于7月23日15时联合发布“高温中暑二级预警”，提醒有关地区和单位按照高温中暑二级应急响应要求，加强对中暑病例的监测报告以及对中暑病人的救治工作，利用多种形式宣传防暑降温知识，并开展高温环境下作业人群的防暑降温咨询和预防性给药工作。（央视新闻）", "ctime": 1784797855, "time_str": "17:10:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260723/c678386948.shtml"}, {"id": "4789721", "title": "我国首套“三元混合气”盾构装备完成海底换刀作业", "content": "7月23日，在世界最长海底高铁隧道——甬舟铁路金塘海底隧道舟山侧施工现场，我国首套“三元混合气”盾构带压作业装备完成超高压环境带压开舱换刀作业，创造盾构工程领域超高压环境下换刀频次最多、连续作业周期最长等多项纪录。此次换刀作业历时75天，建设团队先后在6处海平面下64米的海底开展施工，累计完成313次带压开舱作业，实现936人次安全进出舱，顺利更换各类刀具67把。（新华社）", "ctime": 1784797837, "time_str": "17:10:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260723/c678386935.shtml"}, {"id": "4789717", "title": "贝莱德对金蝶国际的多头持仓比例增至7.22%", "content": "据香港交易所披露，贝莱德（BlackRock）对金蝶国际软件集团有限公司的多头持仓比例于2026年7月17日从6.36%增至7.22%。", "ctime": 1784797830, "time_str": "17:10:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260723/c678386921.shtml"}, {"id": "4789713", "title": "摩根大通对药明康德的多头持仓比例增至11.39%", "content": "据香港交易所披露，摩根大通（JPMorgan）对无锡药明康德新药开发股份有限公司 - H股的多头持仓比例于2026年7月20日从10.98%增至11.39%。", "ctime": 1784797805, "time_str": "17:10:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260723/c678386912.shtml"}, {"id": "4789711", "title": "摩根大通对潍柴动力的多头持仓比例增至9.3%", "content": "据香港交易所披露，摩根大通（JPMorgan）对潍柴动力股份有限公司 - H股的多头持仓比例于2026年7月20日从8.47%增至9.3%。", "ctime": 1784797793, "time_str": "17:09:53", "stock_code": "" stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260723/c678386626.shtml"}, {"id": "4789691", "title": "中共中央、国务院印发《关于加强新时代社会工作的意见》", "content": "近日，中共中央、国务院印发《关于加强新时代社会工作的意见》，对加强新时代社会工作作出部署。《意见》指出，社会工作是党和国家工作的重要组成部分，事关党长期执政和国家长治久安，事关社会和谐稳定和人民幸福安康。加强新时代社会工作，要坚持以习近平新时代中国特色社会主义思想为指导，深入贯彻党的二十大和二十届历次全会精神，认真落实四中全会部署，全面贯彻习近平总书记关于社会工作的重要论述，深刻领悟“两个确立”的决定性意义，增强“四个意识”、坚定“四个自信”、做到“两个维护”，坚持和加强党对社会工作的全面领导，坚持以人民为中心，走好新时代党的群众路线，坚持和发展新时代“枫桥经验”，完善共建共治共享的社会治理制度，突出抓好新经济组织、新社会组织、新就业群体党的建设，不断增强党在新兴领域的号召力凝聚力影响力，抓好党建引领基层治理和基层政权建设，抓好凝聚服务群众工作，坚定不移走中国特色社会主义社会治理之路，推动新时代社会工作高质量发展，以高效能治理促进高质量发展和高水平安全良性互动，更好服务保障党和国家工作大局。(央视新闻)", "ctime": 1784797483, "time_str": "17:04:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260723/c678386613.shtml"}, {"id": "4789685", "title": "中国海军舰艇编队将访问文莱", "content": "7月底，应文莱海军邀请，中国人民解放军海军戚继光舰、昆仑山舰组成的舰艇编队将赴文莱访问。今年是中文建交35周年，中国军队愿同文方一道，落实两国元首共识，巩固传统友好，深化务实合作。（新华社）", "ctime": 1784797419, "time_str": "17:03:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260723/c678386583.shtml"}, {"id": "4789683", "title": "泰国一检查站遭袭 袭击者开枪投弹随后逃逸", "content": "据泰国媒体23日报道，一伙不明身份人员22日在泰国南部那拉提瓦府一检查站开枪并投掷管状炸弹，造成5名士兵死亡、6名平民受伤。报道说，袭击发生在当地时间18时45分许，6名袭击者驾驶皮卡车到达那拉提瓦府拉昂县一检查站门口，开枪并投掷炸弹，随后驾车逃逸。目前，泰国安全部门正全力追捕袭击者，同时下令在该地区采取最高级别安保措施，指示所有检查站保持高度警惕。泰国总理阿努廷22日晚针对这一袭击事件敦促相关部门采取有效应对措施。他还表示，南部边境省份的和平谈判进程将继续进行。（新华社）", "ctime": 1784797413, "time_str": "17:03:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260723/c678386580.shtml"}, {"id": "4789677", "title": "亚华电子：首次回购0.24%公司股份，成交金额为534.07万元", "content": "亚华电子公告，2026年7月22日，公司首次通过回购专用证券账户以集中竞价交易方式回购公司股份，本次回购股份数量为24.73万股，占公司目前总股本的0.24%，最高成交价为21.86元/股，最低成交价为21.37元/股，成交金额为534.07万元（不含印花税、交易佣金等交易费用）。", "ctime": 1784797402, "time_str": "17:0 // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

  const container = document.getElementById('hot7-list');

    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';

      <div class="flex-1 min-w-0">

        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
