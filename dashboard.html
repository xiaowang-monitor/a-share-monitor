const NEWS     = [{"id": "4614305", "title": "西安至十堰高铁6月30日开通运营", "content": "记者今天（29日）从国铁集团获悉，西安至十堰高速铁路将于6月30日正式开通运营，西安东站同步建成投用，西安至武汉高速铁路通道全线贯通，武汉、西安两地间最快2小时41分钟可达。西十高铁起自西安东站，途经陕西省西安市、商洛市及湖北省十堰市，接入已建成投用的武汉至十堰高铁十堰东站，线路全长257公里，设计时速350公里。西安东站站房面积10万平方米，外形设计寓意“秦山渭水、丝路长安”。开通运营初期，铁路部门每日开行动车组列车29对，西安东至商洛西、十堰东站最快24分钟、1小时10分钟可达，分别较目前西安经由宁西线至商洛，西安经由西康、襄渝线至十堰最短旅行时间压缩1小时22分钟、5小时19分钟。西安东至汉口最快2小时41分钟可达，较目前西安北经由徐兰、京广高铁最短旅行时间压缩1小时1分钟。西十高铁衔接“八纵八横”高铁网主要干线通道，是西部高铁网的重要组成部分，北接西延高铁，南连汉十高铁，经联络线接入西安北站，东西衔接徐兰、西成、银西、大西高铁。开通运营后，蓝田、山阳、郧西等县迈入高铁时代，将进一步优化区域路网布局。（央视新闻）", "ctime": 1782721825, "time_str": "16:30:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260629/c677801551.shtml"}, {"id": "4614283", "title": "东望时代：控股股东拟公开征集转让6.00%公司股份", "content": "东望时代公告，控股股东东科数字拟通过公开征集转让方式转让公司5065.17万股无限售流通股，占公司总股本的6.00%，转让价格为不低于4.7元/股。", "ctime": 1782721703, "time_str": "16:28:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260629/c677801491.shtml"}, {"id": "4614281", "title": "我国科学家首次在中心致密天体中探测到射电脉冲", "content": "中国科学院国家天文台与清华大学组成的联合研究团队首次在长期“射电静默”的年轻中子星——“中心致密天体”中探测到射电脉冲。该成果近日在国际学术期刊《自然·天文》在线发表。（央视新闻）", "ctime": 1782721671, "time_str": "16:27:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260629/c677801471.shtml"}, {"id": "4614275", "title": "第四届中国—中东欧国家新闻发言人对话会在京举行", "content": "第四届中国—中东欧国家新闻发言人对话会6月29日在北京举行。来自我国和中东欧国家共20余位新闻发言人齐聚一堂，围绕“新闻发布与现代化进程”主题展开深入交流。 与会嘉宾表示，中国和中东欧国家的友好关系源远流长、历久弥新，双方合作领域宽、质量高，促进了共同发展，增进了人民福祉。中国和中东欧国家都高度重视新闻发布工作，特别是在当前国际形势复杂多变、人工智能迭代升级、媒体生态快速演变的背景下，通过新闻发布释放权威信息的重要性愈加凸显，加强经验分享和对话交流，对于增进理解、共同进步具有积极意义。 与会嘉宾认为，新闻发言人应发挥桥梁纽带作用，生动讲述各国现代化发展故事，展现中国—中东欧国家合作成果，传递和平、发展、合作、共赢理念，为地区和平稳定与繁荣发展注入正能量。 与会嘉宾倡导，完善突发公共事件信息发布机制，提升危机沟通专业化水平，以主动、及时、准确、权威的信息发布有效回应各方关切。与会嘉宾支持探索人工智能在信息发布、传播等领域的合理应用，并重申坚守新闻伦理和专业标准，维护新闻发布权威性和公信力。与会嘉宾提出推动中国—中东欧国家新闻发言人对话会机制化常态化，推动务实交流，促进人员往来，加强互学互鉴，不断提升专业能力与合作水平。 本次对话会由国务院新闻办公室主办。中东欧国家新闻发言人还将在北京、浙江、上海等地参观访问。(新华社)", "ctime": 1782721565, "time_str": "16:26:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260629/c677801418.shtml"}, {"id": "4614249", "title": "凯立新材：放弃对稀有院增资扩股的优先认购权", "content": "凯立新材公告，公司参股的西安稀有金属材料研究院有限公司（稀有院）拟进行增资扩股，增资总额为2.04亿元，其中2亿元计入注册资本，448.2万元计入资本公积。公司出于整体发展战略考虑，拟放弃对稀有院本次增资扩股的优先认购权。本次增资扩股完成后，稀有院注册资本将由1.9亿元增加至3.9亿元，公司持有其股权比例将由2.632%下降至1.282%。", "ctime": 1782721251, "time_str": "16:20:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260629/c677801191.shtml"}, {"id": "4614247", "title": "日联科技：发行股份、可转换公司债券及支付现金购买资产并募集配套资金申请文件获上交所受理", "content": "日联科技公告，2026年6月26日，公司收到上海证券交易所出具的《关于受理日联科技集团股份有限公司发行股份购买资产并募集配套资金申请的通知》（上证科审（并购重组）〔2026〕30号）。上海证券交易所依据相关规定对公司报送的申请文件进行了核对，认为该项申请文件齐备，符合法定形式，决定予以受理并依法进行审核。本次交易尚需经上海证券交易所审核通过，并获得中国证券监督管理委员会同意注册后方可实施。", "ctime": 1782721228, "time_str": "16:20:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260629/c677801173.shtml"}, {"id": "4614239", "title": "OceanBase发布AI数据库", "content": "6月29日，OceanBase发布面向AI时代的湖库一体AI数据库，提出以湖库一体为核心架构，将数据湖的开放与海量存储能力、数据库的事务处理与分析能力，以及多模态数据处理能力统一到一套强一致的数据底座上，帮助Agent获取完整业务上下文。（新浪财经）", "ctime": 1782721131, "time_str": "16:18:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260629/c677801109.shtml"}, {"id": "4614235", "title": "九号公司：首次回购0.05%公司股份，已支付的总金额为人民币1499.34万元", "content": "九号公司公告，2026年6月29日，公司通过上海证券交易所交易系统以集中竞价交易方式首次回购公司存托凭证39.74万份，占公司存托凭证总数的比例为0.05%，成交的最高价为38.52元/份，最低价为36.47元/份，已支付的总金额为人民币1499.34万元（不含印花税、交易佣金等交易费用）。", "ctime": 1782721111, "time_str": "16:18:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260629/c677801099.shtml"}, {"id": "4614233", "title": "谷歌算力告急 限制Meta对其人工智能大模型Gemini的使用", "content": "谷歌已开始限制脸书母公司Meta对其人工智能大模型Gemini的使用，因为Meta的算力需求超出了谷歌现有的承载能力。供给受限直接打乱了Meta内部多个人工智能项目的推进节奏，相关研发工作被迫推迟。报道称，谷歌这一举措直观暴露出算力供给仍是人工智能产业发展的核心瓶颈。即便谷歌持续加码AI基础设施投入，但依旧无法确保有足够的算力应对市场激增的需求。（财联社）", "ctime": 1782721104, "time_str": "16:18:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260629/c677801092.shtml"}, {"id": "4614221", "title": "华立股份：收到广东证监局警示函", "content": "华立股份公告，公司收到中国证券监督管理委员会广东监管局行政监管措施决定书[2026]69号——《关于对东莞市华立实业股份有限公司、董建刚、孙嫒嫒采取出具警示函措施的决定》。公司在市政水务项目收入核算过程中，未严格按照《企业会计准则第14号—收入》规定审慎判断收入确认方法，导致当期财务信息披露不准确。公司已印发专项整改工作方案，组建专项整改工作组并启动自查整改工作。", "ctime": 1782720948, "time_str": "16:15:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260629/c677800998.shtml"}, {"id": "4614207", "title": "捷昌驱动：拟以8000万元-1.6亿元回购公司股份", "content": "捷昌驱动公告，拟以8000万元-1.6亿元回购公司股份，回购价格不超过38元/股。", "ctime": 1782720834, "time_str": "16:13:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260629/c677800912.shtml"}, {"id": "4614203", "title": "交大思诺：公司为雅万高铁提供TCR产品", "content": "交大思诺6月29日在互动平台表示，公司为雅万高铁提供TCR产品。（人民财讯）", "ctime": 1782720758, "time_str": "16:12:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260629/c677800864.shtml"}, {"id": "4614197", "title": "新铝时代：同意增加全资子公司新铝特材为“重庆綦江新铝时代铝合金循环利用项目”的投资主体及实施主体", "content": "新铝时代公告，同意增加全资子公司新铝特材为“重庆綦江新铝时代铝合金循环利用项目”的投资主体及实施主体。公司于2025年8月19日召开2025年第三次临时股东会，审议通过了《关于设立全资子公司暨建设重庆綦江新铝时代铝合金循环利用项目的议案》，同意通过设立全资子公司在重庆市綦江高新区北渡组团原汇程二期地块建设重庆綦江新铝时代铝合金循环利用项目。公司拟建设8万吨高端铝棒及4万吨挤压型材的产能，有利于进一步提升公司在上游高端铝金属材料的供应和配套能力。", "ctime": 1782720724, "time_str": "16:12:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260629/c677800848.shtml"}, {"id": "4614195", "title": "豆包回应“内测社交功能”传闻：没有该计划", "content": "近期，有传言称，字节跳动旗下豆包大模型正在内测社交功能。6月29日，豆包相关负责人回复，在企业办公场景，豆包是和飞书有一些协同的尝试，未来也会合作更紧密。但豆包没有传闻所说的社交功能计划。此前6月24日，豆包正式宣布推出豆包专业版，并官宣“收费”信息。豆包方面介绍，该服务基于最新的豆包2.1系列大模型，面向复杂办公和生产力场景，提供更高的复杂工作场景使用额度，并上线全新的办公任务模式。（澎湃新闻）", "ctime": 1782720722, "time_str": "16:12:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260629/c677800840.shtml"}, {"id": "4614193", "title": "维业股份：全资子公司联合体中标7.1亿元项目", "content": "维业股份公告，全资子公司建泰建设有限公司与上海天华建筑设计有限公司组成的联合体中标武汉华川新建居住、商业、小学、公园绿地项目（A-2、B-2地块）（二期）工程总承包（EPC），中标金额约为7.1亿元人民币。", "ctime": 1782720721, "time_str": "16:12:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260629/c677800839.shtml"}, {"id": "4614191", "title": "国航与新加坡航空签署联营合作谅解备忘录", "content": "6月29日，中国国际航空股份有限公司与新加坡航空公司在京签署联营合作谅解备忘录，旨在进一步深化战略协同。根据谅解备忘录，在获得相关监管部门批准后，国航与新航将协同优化航班计划，扩大现有代码共享合作，并积极推进联合营销。（人民财讯）", "ctime": 1782720677, "time_str": "16:11:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260629/c677800800.shtml"}, {"id": "4614187", "title": "蔚蓝锂芯：证券事务代表吴向阳先生逝世", "content": "蔚蓝锂芯公告，公司证券事务代表吴向阳先生因病逝世。吴向阳先生在担任公司证券事务代表期间，恪尽职守，为公司的发展做出了重要贡献。公司董事会对吴向阳先生在任期间为公司所做的工作和业绩给予充分肯定。截至本公告披露日，吴向阳先生不持有公司股票，不存在相关股票继承、权益变动等后续事宜。公司将尽快聘任符合任职资格的人员担任证券事务代表，协助董事会秘书工作。本次证券事务代表人员变动，不会对公司生产经营、治理运作及资本市场合规运营造成不利影响。", "ctime": 1782720664, "time_str": "16:11:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260629/c677800787.shtml"}, {"id": "4614179", "title": "港股收评：恒生指数涨1.56%，恒生科技指数涨3.23%", "content": "港股收盘，恒生指数涨1.56%，恒生科技指数涨3.23%。恒指港股通ETF银华（159318）涨1.61%，港股通科技ETF鹏华（159751）涨3.47%。板块方面，生物科技、制药板块涨幅靠前；客运航空公司、建筑材料板块跌幅靠前。个股方面，白鸽在线涨367.95%，礼邦医药-B涨103.54%，海光芯正涨44.74%，智云科技建设涨18.94%，映恩生物-B涨16.09%；怡俊集团控股跌20.2%，中科闻歌跌17.59%，德昌电机控股跌12.01%，中远海能跌9.39%，联想集团-R跌9.23%。", "ctime": 1782720614, "time_str": "16:10:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260629/c677800723.shtml"}, {"id": "4614171", "title": "南溟海洋大模型及海洋数字孪生引擎DTO Engine 2.0发布", "content": "2026海上新基建融合发展大会今日在珠海召开，中国科学院院士、南方海洋实验室创始主任陈大可现场发布海上新基建重磅产品——南溟海洋大模型及海洋数字孪生引擎DTO Engine 2.0。南溟海洋大模型主要是针对南海的海洋智能预报模型，目的是为海上新基建提供数据底座和服务平台，具备数据完全自主可控、算法新颖高效、预报快速准确等特点，未来将服务支撑海洋生态保护、油气开发、海洋牧场、海上风电、海上工程等多个场景的应用。（科创板日报）", "ctime": 1782720576, "time_str": "16:09:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260629/c677800534.shtml"}, {"id": "4614169", "title": "国家能源局：1-5月全国电力市场交易电量同比增长24.8%", "content": "2026年5月，全国完成电力市场交易电量6268亿千瓦时，同比增长23.6%。从交易范围看，省内交易电量4906亿千瓦时，同比增长26.9%；跨省跨区交易电量1362亿千瓦时，同比增长12.9%。2026年1-5月，全国累计完成电力市场交易电量30573亿千瓦时，同比增长24.8%。从交易范围看，省内交易电量24361亿千瓦时，同比增长28.5%；跨省跨区交易电量6212亿千瓦时，同比增长12.2%。（国家能源局）", "ctime": 1782720565, "time_str": "16:09:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260629/c677800490.shtml"}, {"id": "4614163", "title": "商务部等5部门：对中华老字号进行复核", "content": "商务部、文化和旅游部、市场监管总局、国家知识产权局、国家文物局决定对中华老字号进行复核。现有前三批中华老字号企业须参加复核，各省级商务主管部门将组织企业填写申报表并上传佐证材料。复核结果分为“通过”“附条件通过”“不通过”三类。企业需核实更新基本信息，如出现亏损、经营异常等情况将被出具“附条件通过”或“不通过”建议。复核工作需在2026年9月30日前完成，并进行社会公示。（商务部）", "ctime": 1782720461, "time_str": "16:07:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260629/c677800126.shtml"}, {"id": "4614157", "title": "振华股份：向不特定对象发行可转债申请获同意", "content": "振华股份公告，近日收到中国证监会出具的《关于同意湖北振华化学股份有限公司向不特定对象发行可转换公司债券注册的批复》（证监许可〔2026〕1508号），同意公司向不特定对象发行可转换公司债券的注册申请。本次发行应严格按照报送上海证券交易所的申报文件和发行方案实施。本批复自同意注册之日起12个月内有效。", "ctime": 1782720434, "time_str": "16:07:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260629/c677800076.shtml"}, {"id": "4614139", "title": "昆仑芯将在港股上市，目标估值500亿美元超过百度", "content": "据媒体报道，百度旗下的AI（人工智能）芯片子公司昆仑芯计划在香港上市，目标估值500亿美元（约合3398 亿元），并要求投资者承诺购买其芯片。百度集团最新市值约为355亿美元。6月29日，受昆仑芯港股上市消息影响，百度港股股价截至发稿涨超6%。此前，一位知情人士告诉《财经》，投资人若想拿到股份份额，得先购买昆仑芯的货，“想要拿到1000万元的股份份额，需要购买7000万元芯片”。关于投资人认购问题，截至发稿，昆仑芯未有回应。该人士补充，如今昆仑芯无论在芯片采购还是股份份额认购，都很火爆，腾讯也是昆仑芯的客户。 昆仑芯原是百度内部负责AI芯片研发的部门，于2021年4月独立分拆，首轮估值130亿元。2025年7月D轮融资后，估值涨到了210亿元。截至目前，昆仑芯完成六轮融资，投资方包括CPE源峰、IDG资本、君联资本、比亚迪、中国互联网投资基金等。百度是其控股股东，持股比例约58%。（财经杂志）", "ctime": 1782720338, "time_str": "16:05:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260629/c677799846.shtml"}, {"id": "4614131", "title": "今日全国碳市场收盘价较前一日上涨0.04%", "content": "今日全国碳市场综合价格行情为：开盘价83元/吨，最高价83.3元/吨，最低价83元/吨，收盘价83.14元/吨，收盘价较前一日上涨0.04%。今日挂牌协议交易成交量81431吨，成交额676.99万元；大宗协议交易成交量40万吨，成交额2850万元；今日无单向竞价。今日全国碳排放配额总成交量48.14万吨，总成交额3526.99万元。2026年1月1日至6月29日，全国碳市场碳排放配额成交量52789073吨，成交额40.75亿元。截至2026年6月29日，全国碳市场碳排放配额累计成交量9.18亿吨，累计成交额617.38亿元。（全国碳交易）", "ctime": 1782720274, "time_str": "16:04:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260629/c677799620.shtml"}, {"id": "4614121", "title": "纳斯达克100指数期货涨幅扩大至1%", "content": "美三大股指期货延续涨势，道琼斯指数期货涨0.41%，标普500指数期货涨0.71%，纳斯达克100指数期货涨1.08%。", "ctime": 1782720238, "time_str": "16:03:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260629/c677799471.shtml"}, {"id": "4614113", "title": "先河环保：公司实控人与其一致行动人解除一致行动关系", "content": "先河环保公告，公司实际控制人姚国瑞与李玉国的一致行动关系已于2026年6月28日到期，双方一致行动关系自到期之日起自动解除。本次解除一致行动关系，不会导致公司控股股东、实际控制人发生变更，不会对公司的治理结构、持续经营产生不利影响。", "ctime": 1782720184, "time_str": "16:03:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260629/c677799245.shtml"}, {"id": "4614109", "title": "消息称快手社科线两位技术高管转岗可灵事业部 或为上市做准备", "content": "有市场消息称，快手社区科学线人事调整，两位核心技术高管李晗、洪立印已完成岗位划转，正式加入可灵AI事业部，该事业部负责人为快手高级副总裁盖坤。两位技术负责人同步转岗，直接增强可灵在底层大模型、视频生成、商业算法等板块的技术实力。业内分析认为，两位推荐与电商算法领域的核心大将同时调入，是为可灵冲刺资本市场进行的关键技术底盘补强。对此消息，快手官方暂无回应。（新浪科技）", "ctime": 1782720096, "time_str": "16:01:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260629/c677798887.shtml"}, {"id": "4614105", "title": "美股中概股盘前多数上涨，盛美涨5%", "content": "美股中概股盘前多数上涨，盛美涨5%，百度、网易涨2%，哔哩哔哩、拼多多、携程、贝壳涨1%，理想汽车跌2%。", "ctime": 1782720073, "time_str": "16:01:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260629/c677798790.shtml"}, {"id": "4614099", "title": "美股大型科技股盘前涨跌互现，微软涨1%", "content": "美股大型科技股盘前涨跌互现，Meta、SpaceX、微软、英伟达涨1%，亚马逊涨0.9%，谷歌A涨0.8%，特斯拉涨0.6%，苹果涨0.2%。", "ctime": 1782720067, "time_str": "16:01:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260629/c677798766.shtml"}, {"id": "4614065", "title": "天津市进一步优化住房公积金政策", "content": "天津市近日推出购买预售商品房提取住房公积金支付购房首付款便民新举措。根据新举措，符合条件的缴存人、配偶及双方父母可一次性申请提取住房公积金金额支付首付款。据了解，购房人同时符合以下条件的可申请提取本人及配偶住房公积金账户金额用于支付购房首付款。一是在天津市行政区域内通过住房公积金（组合）贷款、商业按揭贷款购买预售商品住房；二是购买的预售商品住房已在天津市住房公积金管理中心开通提取住房公积金支付首付款业务；三是如购房人及配偶名下无房且没有住房贷款记录的，可同时提取双方父母的住房公积金。（新华社）", "ctime": 1782719947, "time_str": "15:59:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260629/c677798607.shtml"}, {"id": "4614027", "title": "长裕集团：公司锆类产品在6月中旬发布了涨价函", "content": "长裕集团在互动平台表示，公司锆类产品在6月中旬发布了涨价函。有关氧化锆产品目前正在验证中。（第一财经）", "ctime": 1782719549, "time_str": "15:52:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260629/c677798347.shtml"}, {"id": "4614021", "title": "九阳股份：员工持股计划已购买1071.02万股", "content": "九阳股份公告，截至本公告披露日，公司2026年员工持股计划已通过二级市场以集中竞价交易方式累计买入公司股票共计1071.02万股，占公司总股本的1.40%，成交总金额为9001.48万元（含交易费用）。至此，公司已完成2026年员工持股计划标的股票的购买，实际认购份额未超过股东会审议通过的拟认购份额上限。2026年员工持股计划购买的公司股票将按照规定予以锁定，锁定期为12个月、24个月和36个月，每期解锁比例为30%、30%、40%。", "ctime": 1782719475, "time_str": "15:51:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260629/c677798324.shtml"}, {"id": "4614019", "title": "湘佳股份：湘佳转债预计触发转股价格向下修正条件", "content": "湘佳股份公告，自2026年6月13日至2026年6月29日，公司股票已有十个交易日的收盘价低于当期转股价格21.03元/股的80%，预计后续将有可能触发“湘佳转债”转股价格向下修正条款。", "ctime": 1782719472, "time_str": "15:51:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260629/c677798321.shtml"}, {"id": "4614015", "title": "英国国防部将采购至少六艘“通用作战舰”以布局无人作战", "content": "英国国防部宣布，将放弃原有更换老旧驱逐舰的方案，转而采购至少六艘“通用作战舰”，作为无人作战系统的指挥中枢。这六艘45型驱逐舰计划于2038年年底前退役，政府原本打算采购新一代83型驱逐舰进行替换。不过，根据新版国防投资计划，替换舰艇改为混合动力通用作战舰，预计本世纪30年代初开始交付。分析人士认为，此举反映了英军向无人作战、前沿作战能力转型的整体战略调整。（央视新闻）", "ctime": 1782719460, "time_str": "15:51:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260629/c677798308.shtml"}, {"id": "4614007", "title": "南向资金净卖出超60亿港元", "content": "据同花顺iFinD数据，截至目前，南向资金净卖出超60亿港元，其中港股通（沪）卖出超33.73亿港元，港股通（深）卖出超27.09亿港元。", "ctime": 1782719405, "time_str": "15:50:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260629/c677798289.shtml"}, {"id": "4613989", "title": "中科软：副总经理谢中阳完成增持，累计增持116.91万元", "content": "中科软公告，公司于2026年4月30日披露高级管理人员增持计划，8位高管合计拟增持金额不低于1000万元、不高于1100万元。本次副总经理谢中阳已实施完毕，其于2026年5月1日至6月26日通过集中竞价方式增持公司股份9万股，占公司总股本0.0108%，累计增持金额116.91万元，增持后持股比例由0.4736%升至0.4844%。", "ctime": 1782719318, "time_str": "15:48:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
