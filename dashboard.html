* { margin:0; padding:0; box-sizing:border-box; }
body {

  background: var(--bg-primary);
  color: var(--text-primary);
  min-height: 100vh;
}
.mono { font-family: 'JetBrains Mono', monospace; }
.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 20px;
  transition: all 0.2s;
}
.card:hover { background: var(--bg-card-hover); border-color: #334155; }
.badge {
  display: inline-flex; align-items: center; padding: 2px 8px;
  border-radius: 6px; font-size: 12px; font-weight: 500;
}
.badge-s { background: rgba(239,68,68,0.2); color: #ef4444; }

.badge-b { background: rgba(59,130,246,0.2); color: #3b82f6; }
.badge-c { background: rgba(100,116,139,0.2); color: #94a3b8; }
.score-bar {
  height: 6px; border-radius: 3px; background: #1e293b; overflow: hidden;
}
.score-bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s; }
.up { color: var(--red); }
.down { color: var(--green); }
.pulse { animation: pulse 2s infinite; }
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}
.glow { box-shadow: 0 0 20px rgba(59,130,246,0.15); }
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg-primary); }

</style>

              <th class="text-right py-2 px-1">板块</th>
              <th class="text-right py-2 px-1">连涨</th>

          <tbody id="picks-table"></tbody>
        </table>

    </div>
  </div>

<!-- 新闻流 + 交易代理 -->
<div class="grid grid-cols-1 lg:grid-cols-2 gap-6">

</div>

const NEWS     = [{"id": "4775273", "title": "水利部：珠江、长江、淮河流域部分河流将出现涨水过程", "content": "水利部滚动会商分析研判全国的防汛形势，安排部署暴雨洪水防御工作。截至7月22日9时，吉林、辽宁、黑龙江、内蒙古、天津、河北、江苏、广西等地19条河流仍维持超警，最大超警幅度2.26米。据预报，7月22日至7月24日：受上游来水影响，松花江流域松花江干流肇源江段、辽河流域辽河下游干流盘山以下河段及浑河下游干流邢家窝棚以下河段、海河流域蓟运河等主要河流及江苏里下河地区部分河流将维持超警；受降雨影响，珠江流域桂南沿海、长江流域鄂东四水、淮河流域淠河等河流将出现涨水过程，暴雨区内部分中小河流可能发生超警洪水。7月22日8时至7月23日8时，湖北东部、安徽西部部分地区发生山洪灾害可能性大（橙色预警）。水利部7月22日发布橙色山洪灾害气象预警，提醒暴雨洪水影响地区社会公众注意防范。（央视新闻）", "ctime": 1784695048, "time_str": "12:37:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260722/c678347381.shtml"}, {"id": "4775269", "title": "伊朗多地遭美军袭击 首都德黑兰启动防空系统", "content": "据伊朗媒体22日报道，当天凌晨，包括首都德黑兰在内的伊朗多地遭到美军袭击。目前尚无人员伤亡报告。当地时间22日3时（北京时间7时30分）许，记者看到，德黑兰防空系统启动，在夜空中密集拦截不明飞行物，远处可听到爆炸声。德黑兰防空系统当天多次启动应对敌方袭击。（新华社）", "ctime": 1784695007, "time_str": "12:36:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260722/c678347374.shtml"}, {"id": "4775241", "title": "机构：预计2026年全球折叠屏市场同比增长21%，三星保持领先地位", "content": "根据Counterpoint Research最新发布的全球折叠屏智能手机市场预测，2026年全球折叠屏智能手机出货量预计将同比增长21%。得益于消费者对高端阔折叠设备的持续需求、头部智能手机厂商之间日益激烈的产品竞争，以及苹果预计正式入局折叠屏市场，折叠屏市场预计将在2025年的基础上持续扩张。预计三星将在2026年继续保持全球折叠屏智能手机市场领先地位，市场份额预计为32%。不过，随着苹果正式入局，加之华为（尤其是在中国市场）保持强劲势头，2026年的市场格局将与2025年大不相同。预计苹果将在2026年占据25%的市场份额，华为预计占24%，摩托罗拉和荣耀紧随其后，分别占据8%和3%。", "ctime": 1784694411, "time_str": "12:26:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260722/c678347244.shtml"}, {"id": "4775239", "title": "2026年世界互联网大会数字丝路发展论坛开幕", "content": "由世界互联网大会主办，陕西省人民政府承办的2026年世界互联网大会数字丝路发展论坛今天上午在西安开幕。来自全球52个国家和地区以及7个国际组织约800名嘉宾共同出席论坛。这是世界互联网大会连续第三年举办数字丝路发展论坛。本次论坛以“智汇丝路 数启新程——携手构建网络空间命运共同体”为主题，汇聚全球政产学研各界嘉宾，围绕“丝路电商”合作与发展、智能体协同创新发展、数智时代的文化遗产保护与传承、数智健康等议题举办专题论坛。共谋数智技术创新发展之策，共商数字基础设施互联互通之道，共筑数字文明交流互鉴之路，推动共建“一带一路”国家凝聚共识、携手合作，共同把握数智化发展新机遇。（央视新闻）", "ctime": 1784694320, "time_str": "12:25:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260722/c678347230.shtml"}, {"id": "4775237", "title": "辽宁省海洋经济发展大会召开", "content": "7月22日，全省海洋经济发展大会在沈阳召开。辽宁省委书记许昆林出席会议并讲话。许昆林强调，要坚持产业强海，加快建设现代海洋产业体系。深耕海洋渔业，高标准建设现代化海洋牧场，发展深水网箱、养殖工船等新型生产模式，促进海洋产品精深加工和流通，加强品牌建设，提升特色海产品知名度和市场竞争力。做强海洋制造业，加快推进“智改数转”，绘制好“强链补链延链”图谱，加强链主企业和配套企业招引；聚焦关键领域持续攻坚，加快打造高技术船舶与高端海工装备制造基地；积极培育海洋药物与生物制品、海洋新能源、海洋新材料等新产业，发展“海洋+低空经济”等新业态。升级海洋服务业，大力发展航运物流、金融保险、海事法律等现代海洋服务业；统筹推进岸线、湾区、海岛、海域等资源开发利用，推动文旅体商融合发展；前瞻谋划布局游艇产业，有力承接产业规模化扩张，赢得发展主动。（辽宁日报）", "ctime": 1784694102, "time_str": "12:21:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260722/c678347200.shtml"}, {"id": "4775235", "title": "越南VN指数下跌2%", "content": "越南VN指数下跌2%至1695.78点。", "ctime": 1784693995, "time_str": "12:19:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260722/c678347180.shtml"}, {"id": "4775233", "title": "马杜罗和美国检方共同提议明年6月审理其所涉指控", "content": "据美国媒体21日报道，遭美国强行控制的委内瑞拉总统马杜罗与美国司法部检方当天共同提议，将马杜罗所涉指控的审理开始日期定在2027年6月。 报道说，该联合提案是在马杜罗所涉指控听证会前提交的一份法庭文件，该听证会定于22日中午12时在纽约南区联邦地区法院举行。 据报道，控辩双方在文件中表示，他们可能寻求更改审理日程。美国联邦地区法官阿尔文·赫勒斯坦将最终确定日程。 美国1月3日对委内瑞拉发动军事打击，强行控制马杜罗夫妇并将他们带到美国，美国司法部门指控他们犯有毒品走私罪行。1月5日，马杜罗夫妇在纽约南区联邦地区法院首次出庭，拒绝美方所谓“犯罪”指控。目前，马杜罗被关押在纽约布鲁克林区的大都会拘留中心。国际社会广泛谴责美国严重侵犯委内瑞拉主权，威胁拉美地区和平稳定。(新华社)", "ctime": 1784693836, "time_str": "12:17:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260722/c678347049.shtml"}, {"id": "4775225", "title": "晨曦基金宣布不低于5000万元自购旗下私募基金产品", "content": "7月22日，晨曦基金公告，基于对中国资本市场长期稳健发展以及公司主动管理能力的坚定信心，为践行长期投资理念，公司及主要核心人员将于近期使用自有资金不低于人民币5000万元参与申购公司旗下私募证券基金产品。", "ctime": 1784693365, "time_str": "12:09:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260722/c678346998.shtml"}, {"id": "4775223", "title": "特朗普称愿与黎巴嫩真主党对话", "content": "当地时间7月21日，美国总统特朗普在白宫会见黎巴嫩总统奥恩。特朗普表示，美方愿为黎巴嫩提供帮助，包括审查黎武装部队在以军撤离后接管“试点地区”村镇的相关进展，以及解决黎真主党的问题。如果奥恩希望，他愿意与真主党对话。另外，在会谈结束后，特朗普在社交媒体上表示，他计划让所有美国航空公司恢复直飞黎巴嫩的航班。若该计划实现，这将是这条直飞航线暂停40多年后首次恢复。(CCTV国际时讯)", "ctime": 1784693305, "time_str": "12:08:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260722/c678346987.shtml"}, {"id": "4775221", "title": "花旗：中际旭创有望在光模块市场保持领先地位", "content": "花旗分析师在一份研究报告中表示，在AI时代，中际旭创有望在光模块市场保持领先地位。花旗分析师表示，中际旭创全面的产品组合、可扩展的产能以及与全球AI客户的牢固关系，应能巩固其领先地位。他们表示：“数据传输带宽、速度和密度的不断提高，正推动光互连产品迭代周期的加速。“花旗估计，中际旭创在2026年和2027年的光模块出货量可能分别达到3010万只和6020万只。花旗预计，在产能提升和产品组合向高速产品改善的推动下，2025年至2028年中际旭创的收入将以129%的复合年增长率增长。", "ctime": 1784693273, "time_str": "12:07:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260722/c678346982.shtml"}, {"id": "4775219", "title": "三星或向Mistral投资高达10亿欧元", "content": "三星或向Mistral投资高达10亿欧元，寻求成为美国科技巨头的主要替代选择。", "ctime": 1784693136, "time_str": "12:05:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260722/c678346952.shtml"}, {"id": "4775217", "title": "美媒称特朗普批准美国与沙特民用核项目协议", "content": "美国《华尔街日报》21日援引美官员的消息报道说，美国总统特朗普日前正式批准美国与沙特阿拉伯达成一项为沙特提供民用核项目的协议。报道说，这“或为沙特开展铀浓缩活动打开大门”。据报道，协议中一项关键条款规定，如果美国和沙特联合研究认定有必要，美国企业将在沙特建造一座铀浓缩设施。美方官员称，此举有助于美国对沙特核项目施加影响，并防止其“被用于军事目的”。（新华社）", "ctime": 1784693118, "time_str": "12:05:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260722/c678346948.shtml"}, {"id": "4775215", "title": "7月22日午间公告一览：山东墨龙拟配售2567.84万股新H股", "content": "山东墨龙公告，公司于2026年7月21日召开董事会，审议通过了《关于公司根据一般性授权发行H股的议案》。公司与配售代理签订《配售协议》，拟配售2567.84万股新H股，配售价格为每股4.58港元。配售事项所得款项总额预计约为1.18亿元，净额总额预计约为1.16亿元。公司拟将所得款项用于偿还未偿还借款及营运资金。", "ctime": 1784693093, "time_str": "12:04:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260722/c678346945.shtml"}, {"id": "4775213", "title": "日本今年上半年贸易逆差超1万亿日元", "content": "日本财务省22日公布的初步统计结果显示，2026年上半年日本贸易逆差达1.01万亿日元（1美元约合157.75日元），连续第10个半年度出现贸易逆差。 数据显示，今年上半年，日本货物出口额同比增长13.7%，至60.66万亿日元；进口额同比增长10.7%，至61.68万亿日元。半导体等电子部件进出口均大幅增长，是进出口增长的主要动力。此外，出口增长还受汽车等商品出口增加带动；进口增长还受有色金属等商品进口增加影响。 从地区来看，日本减少了从中东的石油进口，但日本自美国进口的原油和石油制品进口额则分别同比大增355.4%和210.0%。 同日公布的数据显示，由于日本原油进口成本持续处于高位，6月日本贸易逆差为4069亿日元。", "ctime": 1784692946, "time_str": "12:02:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260722/c678346876.shtml"}, {"id": "4775211", "title": "港股午评：恒生指数跌0.83%，恒生科技指数跌2.11%", "content": "港股午间收盘，恒生指数跌0.83%，恒生科技指数跌2.11%。恒指港股通ETF银华（159318）跌0.54%，港股通科技ETF鹏华（159751）跌1.11%。板块方面，金属与采矿、容器与包装板块涨幅靠前；汽车、休闲设备与用品板块跌幅靠前。个股方面，灵宝黄金涨16.03%，华勤技术涨14.52%，赤峰黄金涨14.48%，澜起科技涨12.95%，旺山旺水-B涨12.84%；MINIMAX-W跌8.0%，迅销跌7.36%，圣邦股份跌6.39%，网易跌6.24%，腾讯控股-R跌5.85%。", "ctime": 1784692891, "time_str": "12:01:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260722/c678346871.shtml"}, {"id": "4775209", "title": "云南普洱市墨江县发生3.1级地震，震源深度10千米", "content": "中国地震台网正式测定：07月22日11时45分在云南普洱市墨江县（北纬23.20度，东经101.45度）发生3.1级地震，震源深度10千米。", "ctime": 1784692705, "time_str": "11:58:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260722/c678346831.shtml"}, {"id": "4775207", "title": "国家级零碳工厂、零碳算力设施建设工作启动", "content": "记者22日获悉，工业和信息化部日前印发通知，组织开展国家级零碳工厂（含零碳算力设施）建设工作。 零碳工厂建设是指通过技术创新、结构调整和管理优化等减排措施，实现边界内二氧化碳排放的持续降低、逐步趋向于近零的过程。通知提出，选择具备一定建设基础、建设目标明确、实施路径清晰，并承诺在规定期限内完成建设目标的制造型企业、算力设施，择优纳入国家级零碳工厂建设名单。 通知明确建设过程，零碳工厂建设工作“重技术、重建设、重实效”，而非一次性评价认定。工业和信息化部将不定期对建设单位开展抽查核验，并按照“成熟一批，验收一批”的原则组织验收，通过验收评估的，正式成为国家级零碳工厂。 通知还通过附件形式印发《国家级零碳工厂建设评估指标体系及指标说明（试行）》，明确了核心指标、引导指标两部分。其中，核心指标是对零碳工厂建设具有基础性、决定性和约束性的关键因素；设置过程脱碳、协同降碳、智能控碳、碳抵销和信息披露4类8项引导指标，系统引导企业在节能降碳改造、节能装备应用、数字化能碳管理等方面持续提升。 中国电子技术标准化研究院副院长陈大纪说，通知聚焦国家级零碳工厂“建成什么样、应该怎么建、如何确保建设成效”等关键问题，将引导建设单位从科学算碳、源头减碳、过程脱碳、协同降碳、智能控碳、碳抵销和信息披露等方面，系统推进零碳工厂建设。(新华社)", "ctime": 1784692663, "time_str": "11:57:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260722/c678346823.shtml"}, {"id": "4775205", "title": "美请求在保加利亚部署加油机以支持中东战事，伊朗回应", "content": "保加利亚总理拉德夫20日称，保加利亚政府已收到美国在保加利亚贝兹梅尔空军基地部署至多8架加油机的请求，将提请议会批准。据伊朗伊斯兰共和国通讯社21日报道，伊朗外交部发言人巴加埃对此作出回应，警告保加利亚不要参与美国针对伊朗的侵略行动。(环球网)", "ctime": 1784692460, "time_str": "11:54:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260722/c678346798.shtml"}, {"id": "4775199", "title": "明治3亿卖掉在华牛奶业务", "content": "7月21日，明治控股株式会社发布公告称，将把其在中国的乳制品（饮用奶及酸奶）及B2B业务（目标业务）转让给澳雅食品。转让价格为3.2亿元。需要注意的是，澳雅食品为奶牛养殖巨头澳亚集团全资附属公司。同日，澳亚集团确认了这一交易，并透露前述交易代价包括基本购买价3.2亿元及调整金额（如有），购买价上限为3.5亿元。（21世纪经济报道）", "ctime": 1784691888, "time_str": "11:44:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260722/c678346723.shtml"}, {"id": "4775183", "title": "三星拟在韩国投资2000亿韩元建设HVAC工厂", "content": "业内人士透露，三星电子计划在其位于韩国光州的园区内新建一座HVAC（暖通空调）制造工厂，旨在加速拓展企业对企业中央空调业务。报道称，三星近期已向当地政府提交了光州园区新设施的建设许可申请。该项目预计投资约2000亿韩元，旨在加强HVAC系统产能，包括面向AI数据中心的冷却设备。（财联社）", "ctime": 1784691419, "time_str": "11:36:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260722/c678346510.shtml"}, {"id": "4775181", "title": "零跑汽车朱江明：大电量插混汽车仍有很大发展空间", "content": "7月22日，零跑汽车董事长、CEO朱江明在2026中国汽车论坛上表示，以增程为代表的插电混动技术不会终结。这种技术方案适合东北、东南亚等纯电车型使用场景不佳、或充电基础设施不完备的地区。他认为纯电汽车之外，未来5到10年内大电量的插电混动汽车会是海外很强劲的产品类型。（界面新闻）", "ctime": 1784691410, "time_str": "11:36:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260722/c678346506.shtml"}, {"id": "4775179", "title": "教育部：我国基础教育总体达到高收入国家平均水平", "content": "全国基础教育工作会议今天（22日）在北京召开。记者从教育部获悉，目前，我国共有43万所中小学幼儿园、2.2亿在校生、1577万专任教师，已建成世界上规模最大且有质量的基础教育体系，总体达到世界高收入国家平均水平。数据显示，学生德智体美劳全面发展情况持续向好。由教育部教育督导局组织开展的“2023—2025年国家义务教育质量监测”统计数据显示，我国素质教育取得丰硕成果。80%左右学生数学、语文、英语、科学等基本素养达到课程标准要求；55%左右达到优良水平，进入世界教育强国领先行列。学生的国家认同感、国家安全意识、中华优秀传统文化认同感、行为习惯规范程度较高的占比持续提升。此外，学生身高、肺活量、体能等生长发育指标向好，肥胖率和视力不良检出率上升趋势明显遏制。（央视新闻）", "ctime": 1784691391, "time_str": "11:36:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260722/c678346493.shtml"}, {"id": "4775153", "title": "期货午评： 贵金属板块强势反弹！沪银涨超4% 逼近1.5万元关口", "content": "期货午评： 早盘收盘，国内期货主力合约涨多跌少，钯涨超5%，沪银涨近5%，铂、原油、燃料油涨超4%，低硫燃料油涨超3%，沪金涨近3%。跌幅方面，烧碱、豆油、铁矿石跌超1%，苯乙烯、沪铅、菜油、纯苯跌近1%。", "ctime": 1784691214, "time_str": "11:33:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260722/c678346322.shtml"}, {"id": "4775161", "title": "A股午评：上证指数震荡走高涨0.5% 贵金属、油气板块持续走高", "content": "截至午盘，上证指数涨0.5%，深证成指涨0.61%，创业板指跌0.13%，北证50涨0.75%。三市成交额17895亿元，较上日缩量2225亿元。全市场超3400家个股下跌。\n板块题材上，贵金属、油气、半导体板块涨幅居前；游戏、影视院线板块跌幅居前。\n盘面上，贵金属板块高开高走，兴业银锡、赤峰黄金2连板，招金黄金、山金国际涨停，晓程科技涨超10%，中金黄金、四川黄金、紫金矿业、山东黄金、西部黄金跟涨。油气板块震荡走强，中曼石油涨停，科力股份、首华燃气、通源石油、潜能恒信、石化油服跟涨。半导体板块临近午盘收盘前走高，通富微电、大为股份、托伦斯2连板，雅克科技、瑞芯微涨停，裕太微、安凯微涨超15%，全志科技、富满微、芯朋微、纳芯微、中科蓝讯、杰华特、臻宝科技涨超10%。游戏板块震荡走弱，冰川网络、姚记科技跌超4%，宝通科技、世纪华通、恺英网络跟跌。影视院线低开低走，欢瑞世纪跌近7%，幸福蓝海、光线传媒、华策影视、儒意电影跟跌。", "ctime": 1784691205, "time_str": "11:33:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260722/c678346371.shtml"}, {"id": "4775155", "title": "ETF两市成交额报3675.61亿元，较昨日此时缩量716.56亿元", "content": "截至目前，ETF两市成交额报3675.61亿元，较昨日此时缩量716.56亿元，分类型来看，股票型ETF成交额1535.39亿元，债券型ETF成交额1283.28亿元，货币型ETF成交额108.99亿元，商品型ETF成交额57.71亿元，QDI arket": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260722/c678345967.shtml"}, {"id": "4775125", "title": "浙江公布经济“半年报”：GDP同比增长5.7%", "content": "2026年7月22日，浙江省统计局、国家统计局浙江调查总队发布该省上半年经济运行情况。根据统一核算结果，上半年，浙江实现地区生产总值（GDP）47937亿元，按不变价格计算，同比增长5.7%，“总的来看，上半年浙江经济运行延续稳中有进的良好态势”。其中，工业生产较快增长，新质生产力发展向好。上半年，浙江规模以上工业增加值同比增长8.0%。37个工业行业大类中，30个行业增加值增长，增长面为81.1%。高技术制造业、数字经济核心产业制造业和装备制造业增加值分别增长16.2%、15.5%和13.1%。民营企业增加值增长8.7%，对规模以上工业增加值增长的贡献率达78.1%。（澎湃新闻）", "ctime": 1784690411, "time_str": "11:20:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260722/c678345895.shtml"}, {"id": "4775121", "title": "一箭九星！引力一号遥四运载火箭发射成功", "content": "北京时间2026年7月22日10时54分，我国太原卫星发射中心在上海东部海域使用引力一号遥四运载火箭，将搭载的东坡13~14星、东坡17~20星、西光贰号01星、天仪49星、紫丁香三号卫星共9颗卫星顺利送入预定轨道，飞行试验任务取得圆满成功。此次任务是引力一号运载火箭的第3次飞行。（央视新闻）", "ctime": 1784690343, "time_str": "11:19:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260722/c678345856.shtml"}, {"id": "4775113", "title": "两部门发布第二批贯彻实施民营经济促进法典型案例", "content": "国家发展改革委7月22日消息，国家发展改革委、最高人民检察院联合发布贯彻实施《民营经济促进法》典型案例（第二批）。本次发布的10件典型案例，主要呈现四个方面特点：一是积极履职，“四大检察”全方位保障民营企业合法权益。检察机关全面履行刑事、民事、行政、公益诉讼检察职能，严格落实民营经济促进法立法精神，依法平等保护各类经营主体合法权益，助力营造法治化营商环境。刑事犯罪检察方面，本次发布的王某某职务侵占、挪用资金、非国家工作人员受贿，白某某职务侵占，刘某某掩饰、隐瞒犯罪所得案中，检察机关依托专业化审查、技术性辅助等措施，全面审查资金、通信证据，深挖漏罪漏犯并追加起诉，依法惩治民营企业内部腐败犯罪。民事检察方面，某实业公司及其经营者被超范围冻结财产、错误适用失信惩戒措施监督案中，检察机关发现民事执行措施明显超出抵押担保责任范围，依法进行监督纠正。行政检察方面，某建材公司被不当行政处罚检察监督案中，检察机关运用听证等方式全面调查核实案件事实，对行政处罚背离“过罚相当”原则的问题，通过检察建议等方式监督相关部门依法纠正。公益诉讼检察方面，在推动某地汽修行业危废规范化处置公益诉讼案中，检察机关对发现的废机油处置不规范等问题，依法督促主管部门全面履行职责、纠正违规问题，同时推动行业规范治理，引导民营企业走绿色发展之路。(中证金牛座)", "ctime": 1784690045, "time_str": "11:14:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260722/c678345694.shtml"}, {"id": "4775107", "title": "现货黄金站上4140美元/盎司", "content": "现货黄金站上4140美元/盎司，日内涨1 // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
