亿元。截至2026年6月16日，全国碳市场碳排放配额累计成交量9.11亿吨，累计成交额611.8亿元。（全国碳交易）", "ctime": 1781599905, "time_str": "16:51:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260616/c677502920.shtml"}, {"id": "4535801", "title": "八部门：力争到2030年我国多式联运1小时换装率超90%", "content": "日前，交通运输部等八部门联合发布《实施多式联运攻坚 打通堵点卡点行动方案（2026—2030年）》（以下简称《行动方案》），加快构建现代化多式联运网络。\n\n《行动方案》提出，力争用5年左右时间，推动1000个左右主要货运节点提升多式联运功能，多式联运1小时换装率超过90%，沿海港口多式联运港区铁路进港率达到80%、长江干线主要港口实现铁路进港率100%。同时，集装箱铁水联运安检优化、“一单制”等标准规则将取得新突破。\n\n交通运输部表示，我国多式联运发展进入数智化赋能、网络化运行、系统化提升的攻坚期，但还存在跨方式换装效率较低、信息互联互通不畅、联运标准规则不统一、全链条一体化服务水平低等堵点卡点。《行动方案》聚焦主要港口、重点内陆港、大型物流园区、规模化产业园区以及中欧（亚）班列集结中心这五大载体。加快更新改造和建设一批符合国家重大战略要求、需求规模大、联运功能突出、资金有保障的主要货运节点。(央视新闻)", "ctime": 1781599904, "time_str": "16:51:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260616/c677502921.shtml"}, {"id": "4535787", "title": "希捷科技美股盘前涨超5%", "content": "希捷科技美股盘前涨超5%，现报1069.823美元。", "ctime": 1781599790, "time_str": "16:49:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260616/c677502832.shtml"}, {"id": "4535767", "title": "胜利股份：收到深交所审核问询函", "content": "胜利股份公告，公司于2026年6月15日收到深圳证券交易所出具的《关于山东胜利股份有限公司发行股份及支付现金购买资产并募集配套资金申请的审核问询函》。公司将根据要求会同相关中介机构逐项落实并提交回复。本次发行股份及支付现金购买资产并募集配套资金事项尚需经深交所审核通过并获得中国证券监督管理委员会同意注册后方可实施，存在不确定性。", "ctime": 1781599645, "time_str": "16:47:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260616/c677502743.shtml"}, {"id": "4535757", "title": "多晶硅尾盘直线大跳，分析师：是对前期高估值的修正", "content": "今日午后，多晶硅期货主力合约加速下跌，尾盘一度跌近8%，最终收跌7.25%。中信建投期货分析师刘佳奇表示，今日多晶硅期货价格大幅下跌，是对前期高估值的修正。此前市场预期多晶硅行业将迎来产能调控，推动价格走强。但是，目前行业开工率较低，在产产能多为近年投产的先进产能，落后产能存量有限，难以对供应产生实质影响。（期货日报）", "ctime": 1781599610, "time_str": "16:46:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260616/c677502720.shtml"}, {"id": "4535703", "title": "四方股份：公司已于2026年6月16日向香港联合交易所有限公司递交了境外发行股份（H股）并在香港联交所主板挂牌上市的申请", "content": "四方股份公告，公司已于2026年6月16日向香港联合交易所有限公司递交了境外发行股份（H股）并在香港联交所主板挂牌上市的申请，并于同日在香港联交所网站刊登了本次发行的申请材料。", "ctime": 1781599142, "time_str": "16:39:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260616/c677502378.shtml"}, {"id": "4535693", "title": "报道称OpenAI去年支出超340亿美元", "content": "据报道，OpenAI在2025年投入超340亿美元用于研究、营销及其他费用，净亏损激增八倍。其中，OpenAI在研发方面花费超190亿美元，在销售和营销方面花费近60亿美元。（第一财经）", "ctime": 1781599017, "time_str": "16:36:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260616/c677502297.shtml"}, {"id": "4535687", "title": "整治弹窗 规范AI 互联网广告生态治理方案划重点", "content": "记者今天从市场监管总局了解到，当前，我国互联网广告产业快速发展，已形成数据驱动、技术赋能的复杂生态，但互联网广告轻创意、重炒作等旧问题仍然存在，滥用人工智能、过度追求流量等新问题不断凸显，亟须从深化互联网广告生态治理的高度系统施治、全面治理。为此，市场监管总局印发《关于深化互联网广告生态治理工作的通知》，首次提出“互联网广告生态治理”这一创新理念，系统部署“健全监管制度体系、压实平台主体责任、强化重点领域监管、提升监测技术和执法能力、加强价值导向引领”等五方面治理任务，为推进互联网广告生态治理工作明确了方向。互联网广告生态治理是一项系统性工程。市场监管总局按照“管长远”和“立当下”相结合的工作思路，将加强互联网广告市场秩序整治作为突破口，依法从严打击群众反映强烈的互联网广告违法行为，切实维护互联网广告市场秩序，为推进互联网广告生态治理其他方面的工作打牢基础，营造良好氛围。市场监管总局制定的《互联网广告市场秩序整治重点任务》，围绕“强化广告导向监管、加强直播电商广告监管、规范人工智能生成式广告、整治弹窗广告顽疾、规范‘矩阵式’广告投放、压实平台主体责任”等六个方面，细化工作任务，聚焦突出问题精准发力，全力维护良好互联网广告市场秩序。（央视新闻）", "ctime": 1781598933, "time_str": "16:35:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260616/c677502252.shtml"}, {"id": "4535683", "title": "算力网加快生长 开启万亿级投资周期", "content": "今天，一张无形的算力网正从无到有，加快生长，开启一个万亿级的投资周期。包括信息设备和土木建筑工程等在内，算力网直接投资将达到万亿量级。算力网投资具有乘数效应，还将带动人工智能、自动驾驶、低空经济、合成生物等产业加快成长。在“东数西算”内蒙古和林格尔数据中心集群，记者发现，服务于气象监测、科研成果转化、智能制造、数据交易等的各类平台，不断在这里生长起来。全国规模最大的合成生物学专用算力平台，也“落户”到这里，吸引了一支来自深圳的研究团队。对于普通人而言，从算力基础设施运维人员到人工智能训练师，新的职业机遇将接连涌现，带来百万量级的就业岗位。（央视新闻）", "ctime": 1781598911, "time_str": "16:35:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260616/c677502234.shtml"}, {"id": "4535669", "title": "欧洲斯托克600指数涨幅扩大至0.6%，创盘中新高", "content": "欧洲斯托克600指数涨幅扩大至0.6%，创盘中新高。", "ctime": 1781598849, "time_str": "16:34:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260616/c677502183.shtml"}, {"id": "4535635", "title": "冠石科技：向特定对象发行股票申请符合发行条件、上市条件和信息披露要求", "content": "冠石科技公告，公司于2026年6月15日收到上海证券交易所出具的《关于南京冠石科技股份有限公司向特定对象发行股票的交易所审核意见》，具体意见如下：“南京冠石科技股份有限公司向特定对象发行股票申请符合发行条件、上市条件和信息披露要求。本所将在收到你公司申请文件后提交中国证监会注册。”公司本次向特定对象发行A股股票事项尚需中国证券监督管理委员会作出同意注册决定后方可实施，最终能否获得中国证监会同意注册的决定及其时间尚存在不确定性。", "ctime": 1781598691, "time_str": "16:31:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260616/c677502020.shtml"}, {"id": "4535631", "title": "福元医药：克立硼罗软膏获得药品注册证书", "content": "福元医药公告，近日，公司收到了国家药品监督管理局颁发的克立硼罗软膏《药品注册证书》（证书编号：2026S01924），批准该药品生产。克立硼罗软膏由辉瑞公司研制，最早于2016年12月获美国批准上市，2020年07月，经国家药品监督管理局批准，克立硼罗软膏在国内上市，该药品适用于3月龄及以上轻度至中度特应性皮炎患者的局部外用治疗。", "ctime": 1781598672, "time_str": "16:31:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260616/c677502007.shtml"}, {"id": "4535629", "title": "福元医药：苯溴马隆片获得药品注册证书", "content": "福元医药公告，近日，公司收到了国家药品监督管理局颁发的苯溴马隆片（规格：50mg）《药品注册证书》（证书编号：2026S02064），批准该药品生产。", "ctime": 1781598667, "time_str": "16:31:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260616/c677502002.shtml"}, {"id": "4535583", "title": "荷兰国际：如果日本央行推迟进一步加息，日元可能保持疲软", "content": "荷兰国际集团的Chris Turner在一份报告中表示，如果日本央行在周二将利率上调25个基点至1.00%之后，直到12月才再次加息，日元应该会保持疲软。他说，这将使日本经通胀调整后的实际利率保持在舒适的负值区间。他表示，如果今年夏天波动性进一步下降，并且套利交易重新引起人们的兴趣，日元将继续作为融资货币；在套利交易中，投资者借入低收益货币以投资高收益货币。他说，美元兑日元可能升破160.7日元，并有升至161-162区域的风险，在该区域日本央行更有可能进行干预。美元兑日元持平于160.28日元。", "ctime": 1781598412, "time_str": "16:26:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260616/c677501800.shtml"}, {"id": "4535575", "title": "机构：HBM爆发式增长，存储价格区间预计持续向上", "content": "6月16日，太平洋发布了一篇电子行业的研究报告，报告指出，全球科技巨头AI资本开支加速，2026年迈入近万亿美元投资新纪元。六大科技巨头2025年资本开支合计超3500亿美元，2026年预期突破8000亿美元，且未来随着大模型及相关应用持续渗透，资本开支仍将持续提升。HBM爆发式增长，存储价格区间预计持续向上。2026年HBM市场预计持续维持高两位数增长，目前三大厂产能全部售罄，而DRAM/NAND价格大幅上涨，据Gartner统计，2026年DRAM价格上涨125%，NAND价格上涨234%，供不应求情况有望持续较长时间。从HBM格局来看，SK海力士HBM份额~60%领先，存储从周期商品变为战略资源，AI半导体占总收入30%。", "ctime": 1781598349, "time_str": "16:25:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260616/c677501772.shtml"}, {"id": "4535567", "title": "金新农：副董事长张国南因个人原因辞职", "content": "金新农公告，公司于2026年6月16日收到副董事长张国南的辞职报告，张国南因个人原因辞去公司第六届董事会副董事长、董事及董事会专门委员会相关职务。辞职后，张国南仍担任公司子公司新疆金新农农牧科技有限公司董事长、董事职务。根据相关规定，张国南的辞职不会影响公司董事会的正常运作，辞职报告自送达公司之日起生效。公司将尽快完成副董事长及相关董事会专门委员会职务的补选工作。", "ctime": 1781598310, "time_str": "16:25:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260616/c677501750.shtml"}, {"id": "4535565", "title": "德马科技：股东朱光葵减持期满，累计减持10000股占0.0038%", "content": "德马科技公告，股东朱光葵此前披露的减持计划时间区间于2026年6月15日届满。截至2026年6月15日，朱光葵通过集中竞价方式累计减持公司股份10000股，占总股本（2.64亿股）的0.0038%，减持价格区间为19.92元/股，减持总金额19.92万元。原计划减持不超过791.24万股（占总股本3%），实际未完成减持计划。本次减持后，朱光葵当前持股1317.73万股，持股比例降至4.9962%。", "ctime": 1781598305, "time_str": "16:25:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260616/c677501748.shtml"}, {"id": "4535563", "title": "天沃科技：董事长易晓荣退休离任", "content": "天沃科技6月16日公告，公司董事长易晓荣因达到法定退休年龄，申请辞去公司董事、董事长、战略委员会主任委员及提名委员会委员的职务。在选举产生新任董事长前，易晓荣将继续履行公司董事长、法定代表人及相关专门委员会职责。董事会同意提名姚丹花为公司董事候选人，并将相关事项提交公司股东会审议。如股东会审议通过前述事项，董事会拟另行召开 // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');

    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
