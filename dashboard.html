949", "title": "中远海能成立两家液化天然气公司", "content": "企查查APP显示，近日，上海金裕兰液化天然气有限公司、上海申明珠液化天然气有限公司成立，法定代表人均为叶青培，注册资本均为12.74亿元，经营范围均包含石油天然气技术服务；企业管理；租赁服务（不含许可类租赁服务）；企业管理咨询；信息咨询服务等。企查查股权穿透显示，两公司均由中远海能间接全资持股。（人民财讯）", "ctime": 1793081770, "time_str": "14:16:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261027/c681128721.shtml"}, {"id": "5484921", "title": "东阳光药：胰岛素已锁定超1800万支海外订单", "content": "记者从东阳光药获悉，公司于今年4月获美国FDA批准上市的甘精胰岛素注射液，在7月已实现美国商业化发货，首批115.2万支，目前已锁定超1800万支海外订单。该产品也是中国首个登陆美国市场的胰岛素产品。（人民财讯）", "ctime": 1793081419, "time_str": "14:10:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261027/c681128525.shtml"}, {"id": "5484919", "title": "小米披露灵巧手最新进展: 设计了全新21自由度仿生灵巧手", "content": "10月27日，小米披露仿生灵巧手技术探索成果。小米方面表示，小米机器人团队基于汽车工厂1827个标准作业程序（SOP）进行完整数据采集与分析验证，基于真实作业数据的仿真消融分析显示，在17~21自由度区间，仿生灵巧手平均稳定抓握成功率较6~15自由度提升15%~38%，其中21自由度在工厂操作覆盖度和抓握成功率上提升最大。在该场景下，继续提升自由度至23及以上时，抓握能力提升明显放缓，堆自由度的边际收益下降。基于上述结论，小米设计了全新21自由度仿生灵巧手，该灵巧手采用混合驱动与腱绳张力控制方案，实现精准抓握力控，提升可靠性与可维护性，同时对散热体系和全掌触觉进行了系统性优化。（每日经济新闻）", "ctime": 1793081397, "time_str": "14:09:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261027/c681128507.shtml"}, {"id": "5484781", "title": "阿里巴巴、交银人寿等入股创奕晟华", "content": "天眼查App显示，近日，杭州创奕晟华股权投资合伙企业（有限合伙）发生工商变更，出资额由1000万元增至7.35亿元，同时新增中宏人寿保险有限公司、广州富星投资咨询有限公司、交银人寿保险有限公司及阿里关联公司杭州灏月企业管理有限公司等合伙人。合伙人信息显示，中宏人寿、广州富星、交银人寿、杭州灏月及执行事务合伙人杭州创昇分别认缴4亿元、1.5亿元、1亿元、8000万元和500万元，对应份额为54.42%、20.40%、13.60%、10.88%和0.68%。杭州灏月由淘宝（中国）软件有限公司、浙江天猫技术有限公司、阿里巴巴网络中国有限公司共同持股。对外投资信息显示，创奕晟华认缴7.35亿元，持有杭州经韬企业管理合伙企业（有限合伙）17.67%份额。（南方财经）", "ctime": 1793080603, "time_str": "13:56:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261027/c681128039.shtml"}, {"id": "5484737", "title": "三六零等入股元环智能，后者为AI元模型研发企业", " time_str": "13:43:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261027/c681127678.shtml"}, {"id": "5484715", "title": "“AI消费者”助力韩企预测消费行为", "content": "韩国零售商引入基于人工智能（AI）的虚拟消费者来预测购买决定、微调价格并发现购物体验中的潜在缺陷。这些被称为“合成消费者”的AI购物者基于大型语言模型和消费者数据构建而成，旨在模拟真人消费行为。乐天集团正将这一概念推向更个性化的模式。该公司于7月开始与当地人工智能企业合作开发“AI双生消费者”，将乐天会员约4500万累积用户的购买数据与社交媒体数据相结合，不仅分析顾客的消费行为，还深入挖掘其消费背后的原因和情境。（新华社）", "ctime": 1793079666, "time_str": "13:41:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261027/c681127577.shtml"}, {"id": "5484687", "title": "上期所欧线集运主力合约大跌7%", "content": "上期所欧线集运主力合约大跌7%，报2252点。", "ctime": 1793079324, "time_str": "13:35:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261027/c681127364.shtml"}, {"id": "5484669", "title": "COMEX白银期货跌超2% NYMEX钯金主力合约跌超2%", "content": "COMEX白银期货跌超2%，现报52.78美元/盎司。NYMEX钯金主力合约跌超2%，现报1030.0美元/盎司。", "ctime": 1793079079, "time_str": "13:31:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261027/c681127238.shtml"}, {"id": "5484667", "title": "上期所欧线集运主力合约大跌6%", "content": "上期所欧线集运主力合约大跌6%，报2272点。", "ctime": 1793079065, "time_str": "13:31:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261027/c681127232.shtml"}, {"id": "5484665", "title": "半导体板块持续走低，星宸科技跌超10%", "content": "半导体板块持续走低，星宸科技跌超10%，紫光国微、翱捷科技、北斗星通、强一股份、晶升股份跟跌。", "ctime": 1793079062, "time_str": "13:31:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261027/c681127231.shtml"}, {"id": "5484663", "title": "现货黄金失守4000美元/盎司", "content": "现货黄金失守4000美元/盎司，日内跌0.43%。同花顺黄金现货价格报859.7元/克，现跌0.43%。", "ctime": 1793079058, "time_str": "13:30:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261027/c681127228.shtml"}, {"id": "5484659", "title": "现货白银失守53美元/盎司", "content": "现货白银失守53美元/盎司，日内跌2.19%。", "ctime": 1793079042, "time_str": "13:30:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261027/c681127227.shtml"}, {"id": "5484657", "title": "需求旺盛、产能吃紧！台积电据传拟将先进封装价格最高上调20%", "content": "据报道，受AI需求爆发、半导体供应链产能全面紧张影响，台积电计划上调先进芯片封装服务价格，最高涨幅可达20%。报道称，台积电等晶圆代工及封测（OSAT）从业者正酝酿新一轮提价，准备将CoWoS封装的报价上调10%至20%，该封装技术广泛应用于高端AI处理器。当前，CoWoS的需求已经从图形处理器（GPU），延伸至服务器中央处理器（CPU）以及定制专用集成电路。与此同时，AI芯片测试周期更长，进一步加剧了封测产能的供给压力。芯片设备交期也随之拉长，从此前的3至6个月延长至6至8个月。一方面，芯片厂商争抢交付排期，另一方面，设备供应商难以快速扩产。据业内人士透露，台积电下游客户已无暇砍价，“只要能承诺交期便下单”。（财联社）", "ctime": 1793079037, "time_str": "13:30:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261027/c681127225.shtml"}, {"id": "5484651", "title": "江特电机：具身智能康复合作项目试点落地", "content": "近日，江特电机、正大国健医疗健康产业集团与维他动力（北京）科技有限公司在智慧康复领域达成合作，三方首个具身智能康复试点正式落地肇庆正大国健康复医院。该试点是江特电机“3A+3J”战略中A1（AI智能化升级）的真实场景检验，未来，江特电机将依托自身在电机、关节模组等核心零部件领域的自研制造能力，与Vbot维他动力、正大国健深化三方产业协同。（人民财讯）", "ctime": 1793078992, "time_str": "13:29:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261027/c681127140.shtml"}, {"id": "5484631", "title": "麦德龙中国：明年将改造20家门店，加大投资用于优化商品价格等", "content": "10月26日，麦德龙中国副总裁兼首席运营官周扬在媒体日上表示，今年是麦德龙进入中国的第30周年。在未来的一年里，麦德龙将持续加大投资，用于优化商品价格，提升基础设施和履约能力。具体来看，周扬指出，麦德龙中国将在2027年内完成20家门店的改造，升级生鲜、熟食和烘焙等区域，并打造出更为统一和标准化的门店模型。在供应链和物流方面，麦德龙投资打造的太仓智能物流中心也将于2028年全面投入使用，提升供应链效率。（澎湃新闻）", "ctime": 1793078652, "time_str": "13:24:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261027/c681126963.shtml"}, {"id": "5484623", "title": "最快35分钟！“进博直通车”助展品从保税仓直达“四叶草”", "content": "第九届中国国际进口博览会将于11月5日正式拉开帷幕。本届进博会共有162个国家、地区和国际组织参与，4142家境外企业参展，企业展面积首次突破37万平方米。目前，本届进博会首批展品已正式进馆，布展搭建工作全面启动。据了解，首批进馆展品覆盖技术装备、医疗器械、消费品、农食产品等多个展区。其中部分展品为全球首发。10月26日，一批进博会的高价值展品在上海静安张园保税仓内布展，其中包括约150件意大利珠宝饰品。这批展品将通过“进博直通车”直达第九届进博会举办地——国家会展中心（上海），在本届进博会上首秀。（央视新闻）", "ctime": 1793078387, "time_str": "13:19:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261027/c681126838.shtml"}, {"id": "5484621", "title": "奥比中光：数采业务处于客户导入与生态建设关键期", "content": "奥比中光在2026年第三季度业绩说明会上表示，现阶段，公司数采业务处于客户导入与生态建设的关键期。公司当前主要面向具体客户场景进行适配、技术支持与样机验证，投入强度和周期相对可控，具有较强的前置性和阶段性。（人民财讯）", "ctime": 1793078379, "time_str": "13:19:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261027/c681126834.shtml"}, {"id": "5484619", "title": "昆山：前三季度全市实现地区生产总值4217.12亿元，同比增长5.8%", "content": "据“昆山发布”，根据上级地区生产总值统一核算结果，前三季度昆山全市实现地区生产总值4217.12亿元，按不变价格计算同比增长5.8%。分产业看，第一产业增加值10.89亿元，增长1.7%；第二产业增加值2123.95亿元，增长7.8%；第三产业增加值2082.28亿元，增长3.8%。", "ctime": 1793078170, "time_str": "13:16:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261027/c681126734.shtml"}, {"id": "5484607", "title": "现货白银跌超1%", "content": "现货白银跌超1%，现报53.31美元/盎司。", "ctime": 1793077841, "time_str": "13:10:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261027/c681126587.shtml"}, {"id": "5484601", "title": "外盘暴跌，今日国内白糖期货、现货糖价双双下跌", "content": "隔夜外盘原糖期货大幅暴跌至19美分一线，今日（10月27日）早盘国内白糖期货跟随大幅下跌，上午主力2701合约下跌71点，跌幅1.33%，成交价5279元/吨，最高5297元，最低5236元。\n今日上午截至发稿广西制糖企业、流通商报价下调至5120-5170元/吨之间不等（崇左、南宁、贵港、柳州、河池、来宾、防城港等地仓库或糖厂库提货价），与昨天的报价每吨下调20元左右。\n今日上午云南制糖企业、流通商在昆明市场报价5020-5050元/吨（昆明仓库价），较昨天的报价每吨下调40元左右；大理、祥云地区一级白砂糖仓库提货价下调至4965-5000元/吨一线。（云南糖网）", "ctime": 1793077705, "time_str": "13:08:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261027/c681126469.shtml"}, {"id": "5484595", "title": "创业板指跌幅扩大至1%，此前涨超1%", "content": "创业板指跌幅扩大至1%，上证指数跌0.26%，深证成指跌0.69%。", "ctime": 1793077640, "time_str": "13:07:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261027/c681126441.shtml"}, {"id": "5484591", "title": "国际可再生能源署：中国为全球能源转型作出重要贡献", "content": "国际可再生能源署总干事弗朗切斯科·拉卡梅拉日前在位于阿联酋首都阿布扎比的总部表示，中国通过推动技术进步和降低清洁能源设备成本等，为全球能源转型和减少碳排放作出重要贡献。“中国对能源转型的第一大贡献，是向世界提供低成本的可再生能源技术。”拉卡梅拉说，中国推动太阳能、风能和电池等技术不断进步，促使相关产品成本显著下降。他表示，中国的贡献在国际和国内两个层面都显而易见。在国际上，中国向世界提供具有竞争力的可再生能源技术和设备，使其更加可负担、更易获取；在中国国内，中国持续加大可再生能源投资，不断扩大清洁电力装机规模。（央视新闻）", "ctime": 1793077589, "time_str": "13:06:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261027/c681126426.shtml"}, {"id": "5484587", "title": "塞尔维亚公布议会选举初步结果", "content": "塞尔维亚选举委员会当地时间26日晚公布议会选举初步结果。学生团体推动的“学生名单－学生获胜”以52.71%的得票率领先，预计获得140个席位，取得绝对多数，并具备独立组建政府的条件。（新华社）", "ctime": 1793077565, "time_str": "13:06:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261027/c681126404.shtml"}, {"id": "5484569", "title": "2026年1-9月汽车行业利润率3.3%、收入增2.6%、成本增3.8%、利润降23%", "content": "崔东树发文表示，1—9月份，规模以上工业企业实现营业收入106.21万亿元，同比增长6.6%；发生营业成本90.30万亿元，增长6.1%；营业收入利润率为5.68%，同比提高0.44个百分点。2026年1-9月，以人工智能为推动的电子行业利润1倍增长，上游原材料行业利润高增长，对行业总体利润改善促进巨大，汽车行业面临成本上涨和需求不强的双重压力，盈利表现较差。2026年1-9月汽车生产2337万台，同比降4%，收入80435亿元增2.6%，成本71627亿元增3.8%，利润2675亿元降23%，销售利润率3.3%；其中9月的汽车生产306万台，销售收入10374亿元增0.6%，成本9257亿元增2.5%，利润142亿元降68%，销售利润率1.4%，处于近4年的低位。", "ctime": 1793077387, "time_str": "13:03:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261027/c681126344.shtml"}, {"id": "5484525", "title": "上汽集团：前三季度海外销售突破百万辆 已超去年全年水平", "content": "今年前三季度，上汽集团累计销售314.7万辆，继续位居中国汽车行业首位，整体销量领跑中国车市的同时，海外销售也节节攀升，1—9月销售116.6万辆，同比增长52.4%，已超过2025年全年海外销量。(人民财讯)", "ctime": 1793076835, "time_str": "12:53:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261027/c681126146.shtml"}, {"id": "5484449", "title": "XREAL 1 Pro+正式发布 普通视频也能直接看3D", "content": "消费级AR（增强现实）眼镜与空间计算企业XREAL今日正式发布XREAL 1 Pro+，并于14点在中国市场全面开售。官方定价4299元，首发到手价3499元。产品基于X1空间计算芯片，在眼镜端将普通2D内容，实时转换为具有空间纵深感的3D画面，转换帧率最高60fps，实现普通视频也能直接看3D。（人民财讯）", "ctime": 1793075906, "time_str": "12:38:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261027/c681125785.shtml"}, {"id": "5484411", "title": "蒙古国总理将东部保护区大火定性为严重生态事件", "content": "蒙古国政府26日发布公报说，在当天举行的政府工作会议上，蒙古国总理乌其尔勒将本月发生在该国东部努姆鲁格自然保护区的大规模草原火灾定性为严重生态事件。 蒙古国官方调查初步确认，此次火灾由蒙古国日资背景电信企业莫比康公司车队活动引发，蒙方将依法彻查追责、追偿生态损失并推进生态系统修复。 “努姆鲁格自然保护区约80%的区域受到火灾影响。这不仅仅是土地被烧毁的问题。”乌其尔勒说，这是蒙古国原始自然环境、珍稀野生动植物物种以及自然遗产的严重损失。 他指出，调查必须查明谁授权进入保护区、目的为何、谁负责确保消防安全，以及火灾发生后采取了哪些措施。与莫比康公司相关的问题都必须依法调查。他还要求司法和内务部确保依法追究未能正确履责官员的责任。 乌其尔勒要求蒙古国自然环境与气候变化部组织相关专家，对受影响土地、被毁植被、受损野生动物栖息地和整体环境损失进行评估，并制订恢复计划。 蒙古国东方省努姆鲁格自然保护区本月8日发生大规模草原火灾，明火已于16日被扑灭。蒙古国自然环境与气候变化部公布的数据显示，此次火灾过火面积约53万公顷，其中保护区内约47万公顷，占保护区总面积的79.8%。日本电信运营商凯迪迪爱公司20日承认，火灾与其子公司莫比康公司的日本籍高管活动有关。(新华社)", "ctime": 1793075356, "time_str": "12:29:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261027/c681125554.shtml"}, {"id": "5484409", "title": "乐普生物：控股股东蒲忠杰增持105万股H股", "content": "乐普生物发布自愿公告，公司控股股东、董事长兼执行董事蒲忠杰于2026年10月27日以其自有资金通过沪港通在公开市场增持105万股H股，增持平均价格约为人民币3.04元（约3.55港元），相当于本公告日期公司已发行股份总数约0.06%。紧随增持后，蒲忠杰直接持有105万股H股，并间接持有4.33亿股及2.25亿股H股，相当于已发行股份总数约36.6%。", "ctime": 1793075336, "time_str": "12:28:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261027/c681125537     el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
