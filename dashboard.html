内亚有限公司签订几内亚120万吨氧化铝项目EPC总承包合同，负责年产120万吨氧化铝生产线及配套设施的设计、采购、施工，合同总金额预计约为人民币65.56亿元，除合同条款约定进行的调整外，合同价格不作调整。截至公告披露日，双方尚未正式签订合同；该关联交易已经公司董事会审议通过，尚需提交公司股东会审议批准。", "ctime": 1793973341, "time_str": "21:55:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261106/c681571367.shtml"}, {"id": "5599979", "title": "比尔·阿克曼：投机交易愈演愈烈 这对美国不是好事", "content": "潘兴广场CEO比尔·阿克曼周二表示，体系内杠杆规模高企，投机交易愈演愈烈，股价大幅震荡，他担心股市已经失灵，称每隔几天就感觉市场乱套，很多股票成交价毫无逻辑。他称市场重回赌场式行情，杠杆水平一度高达95%，这种环境不利于经济和社会，催生股价巨幅波动。他同时表示，恰恰是这类市场定价错配给基金带来捡漏机会。", "ctime": 1793973230, "time_str": "21:53:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261106/c681571341.shtml"}, {"id": "5599967", "title": "Everpure美股盘前涨超10%", "content": "Everpure美股盘前涨超10%，现报103.01美元。", "ctime": 1793973070, "time_str": "21:51:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261106/c681571315.shtml"}, {"id": "5599921", "title": "又一荷兰客机遭炸弹威胁 未发现爆炸物", "content": "当地时间11月6日，荷兰皇家航空KL1324航班从捷克布拉格飞往阿姆斯特丹，收到炸弹威胁后安全降落在史基浦机场。荷兰皇家宪兵对飞机进行检查，未发现爆炸物，乘客和机组人员在宪兵陪同下离开。这是荷航航班连续两天遭炸弹威胁：11月5日，一架从阿姆斯特丹飞往特拉维夫、经停布加勒斯特的荷航航班也曾收到炸弹威胁，检查同样未发现爆炸物。目前尚无公开信息证实两起事件存在关联，威胁来源仍有待调查。（央视新闻）", "ctime": 1793972417, "time_str": "21:40:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261106/c681571216.shtml"}, {"id": "5599793", "title": "美元指数DXY短线走高10余点，现报102.17", "content": "美元指数DXY短线走高10余点，现报102.17。非美货币普跌，美元兑日元USD/JPY报158.51，欧元兑美元EUR/USD报1.1148，英镑兑美元GBP/USD报1.3375。", "ctime": 1793971970, "time_str": "21:32:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261106/c681571086.shtml"}, {"id": "5599789", "title": "美国2年期国债收益率进一步上升，上涨5.9个基点至4.537%", "content": "美国2年期国债收益率进一步上升，上涨5.9个基点至4.537%。" 1860, "time_str": "21:31:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261106/c681571055.shtml"}, {"id": "5599683", "title": "美国10月非农就业人数增加16.5万人，远高于预期", "content": "美国10月非农就业人数增加16.5万人，预估为增加6.5万人，前值为增加2.9万人。平均时薪环比上涨0.4%，同比上涨3.1%，市场预期分别为0.3%和2.9%。前值方面，8月非农新增就业人数由13.3万人上修至18.6万人，9月由2.9万人上修至6万人，两个月合计上修8.4万人。", "ctime": 1793971824, "time_str": "21:30:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261106/c681571041.shtml"}, {"id": "5599595", "title": "刹车踏板风波一个月后，尊界V800重启宣传", "content": "11月6日，距离刹车踏板支架断裂引发的质量舆情风波过去一个月后，鸿蒙智行尊界汽车官方微博重新发布了与V800车型相关的宣传内容。这是该账号自10月15日停更以来第二次恢复更新。", "ctime": 1793971734, "time_str": "21:28:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261106/c681571025.shtml"}, {"id": "5599577", "title": "现货白银涨超1%", "content": "现货白银涨超1%，现报52.25美元/盎司。", "ctime": 1793971237, "time_str": "21:20:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261106/c681570922.shtml"}, {"id": "5599529", "title": "美伊谈判接近取得突破 核问题重新纳入谈判", "content": "据一位了解谈判情况的外交官称，美国和伊朗结束战争的努力正接近取得突破，德黑兰愿意讨论此前不在谈判范围内的核计划相关问题。这位因涉及敏感信息而不愿具名的外交官表示，伊朗正在研究主要斡旋方卡塔尔提出的核活动相关方案。在这一问题上作出任何让步，都可能推动谈判取得重大进展。自6月达成的一项临时和平协议破裂以来，谈判一直陷于停滞。美国总统特朗普最近与卡塔尔埃米尔塔米姆·本·哈马德·阿勒萨尼通电话，讨论缓和紧张局势的努力，显示他希望结束这场战争。(财联社)", "ctime": 1793970961, "time_str": "21:16:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261106/c681570867.shtml"}, {"id": "5599417", "title": "世龙实业：拟投资3.65亿元新建年产15万吨氯化亚砜项目", "content": "世龙实业公告，公司拟在现有年产5万吨氯化亚砜生产装置基础上，投资新建年产15万吨氯化亚砜生产装置及配套设施，项目计划投资总额为3.65亿元，分二期建设，一期为年产氯化亚砜8万吨、二氧化硫2万吨，建设周期10个月；二期为年产氯化亚砜7万吨、二氧化硫2.5万吨，建设周期8个月。项目建成后公司氯化亚砜生产规模将提高至20万吨/年。该议案已获董事会审议通过，无需提交股东会审议，项目尚需国家有关部门批准或备案。", "ctime": 1793970522, "time_str": "21:08:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261106/c681570795.shtml"}, {"id": "5599319", "title": "雀巢即饮咖啡西区撤编：不涉及云、贵两省", "content": "多方信息显示，雀巢即饮咖啡西区已正式撤编。近日，位于成都、重庆、西安等多地的雀巢经销商均向记者确认，自11月1日起，雀巢即饮咖啡（RTD）西区正式拆分，分别并入西南区与西北区，原有的独立西区编制不复存在。另有市场消息称，被拆分的即饮咖啡西区业务全面划归西南区销售总监万东林和西北区销售总监张惠林统管。万东林与张惠林均为雀巢“干货”（冲调及全渠道流通）团队的资深干将。（21财经）", "ctime": 1793970176, "time_str": "21:02:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261106/c681570690.shtml"}, {"id": "5599277", "title": "比利时国王拒绝接受首相辞呈要求立即恢复预算谈判", "content": "比利时王宫6日发布公报称，比利时国王菲利普决定拒绝接受首相德韦弗的辞呈，并要求他立即恢复预算谈判。国王当天在王宫接见了德韦弗。国王确认，在与执政联盟5个政党的主席分别举行会谈后，各方均希望尽快恢复预算谈判，并表示愿尽最大努力，就未来3年稳健的预算规划达成协议。国王还获得了5个政党主席的正式承诺，即各自政党愿意作出让步，以促成执政联盟内部达成协议。国王强调，必须在维护社会凝聚力与促进经济增长之间保持良好平衡。各党主席均明确承诺，将以妥协精神和责任意识为重，努力实现这一目标。德韦弗2日因联邦政府预算谈判失败向国王递交辞呈。国王当时暂缓决定是否接受辞呈，并于本周与执政联盟各政党领导人举行磋商，寻求打破预算僵局的办法。德韦弗领导的联合政府由5个政党组成。执政联盟数月来一直就2027年联邦预算及到2029年实现约100亿欧元的财政调整目标进行谈判，但各党在削减公共支出和增加税收等问题上分歧明显，始终未能达成协议。德韦弗将于11月16日再次向国王汇报有关进展。德韦弗5日在议会表示，希望达成一项能够确保未来几年财政稳定的预算协议。(新华社)", "ctime": 1793970111, "time_str": "21:01:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261106/c681570584.shtml"}, {"id": "5599187", "title": "期市夜盘开盘，国内期货主力合约多数下跌", "content": "期市夜盘开盘，国内期货主力合约多数下跌。跌幅方面，苯乙烯、铁矿石、燃油、纯碱、纯苯跌超1%。涨幅方面，低硫燃油涨超1%。", "ctime": 1793970003, "time_str": "21:00:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261106/c681570562.shtml"}, {"id": "5599145", "title": "也门胡塞武装称塔伊兹省一市场遭空袭致30余人死伤", "content": "据也门胡塞武装控制的马西拉电视台6日报道，也门西南部塔伊兹省一处人员密集的市场当天遭到沙特阿拉伯战机3次空袭，造成30余人死伤。(新华社)", "ctime": 1793969472, "time_str": "20:51:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261106/c681570445.shtml"}, {"id": "5599143", "title": "日本富士电视台计划在剧集制作中引入生成式AI", "content": "11月5日，日本富士电视台公布计划，从今年秋季档起，每个播出季至少选一部电视剧重点试用生成式AI，到2027年10月左右，让所有自制剧组都能根据场景需要使用这项技术。同一天，AI影视工作室Fable宣布，世界首富马斯克的前伴侣、加拿大歌手格莱姆斯（Grimes）客串的科幻长片《诸神从不赐礼》定于12月4日在美国影院上映，片方称其为首部登陆院线、全片画面由AI生成的长片。（新浪财经）", "ctime": 1793969453, "time_str": "20:50:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261106/c681570443.shtml"}, {"id": "5599089", "title": "摩根大通：美国数据中心建设或放缓 风险料从2028年起显现", "content": "美国中期选举带来的政治格局变化，可能对人工智能（AI）数据中心建设及电力行业产生深远影响。但摩根大通认为，相关政策风险短期内不会显著改变AI资本开支计划，真正的影响可能从2028年开始显现。摩根大通11月4日发布研报指出，民主党不仅赢得国会参众两院控制权，还在得克萨斯州、佐治亚州、新墨西哥州和内华达州等重要数据中心市场赢得州长选举。随着多名州长当选人提出限制数据中心开发的政策，未来相关项目可能面临更严格的审批、更长的建设周期、更高的开发成本及更大的融资难度。该行预计，2027年数据中心资本开支计划不会出现重大变化，因为相关项目大多已经开工，而且多数已获得融资。相比之下，尚未获批或完成融资的2028年及以后项目将面临更大不确定性。", "ctime": 1793969154, "time_str": "20:45:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261106/c681570410.shtml"}, {"id": "5599047", "title": "卓翼科技：2026年上半年境外线上销售业务营收同比增长约160%", "content": "卓翼科技在投资者关系活动记录表中表示，公司将境外线上销售业务列为业绩增长方向，2026年上半年该业务营收同比增长约160%。公司在核心客户的Wi-Fi 7相关项目持续落地，多个项目实现量产。", "ctime": 1793968993, "time_str": "20:43:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261106/c681570379.shtml"}, {"id": "5599015", "title": "科德教育：香港全资孙公司完成注册登记，注册资本港币100万", "content": "科德教育公告，公司此前拟在香港设立全资子公司华芯远景控股有限公司，并由其出资设立全资孙公司华芯远景投资有限公司。本次公告披露，华芯远景控股有限公司已取得苏州市发展和改革委员会出具的《境外投资项目备案通知书》，并通过银行办理完成国家外汇管理局外汇业务登记；全资孙公司华芯远景投资有限公司已于2026年11月5日在香港完成注册登记，注册资本为港币100万。全资孙公司涉及商务局、发改委的审批手续尚在办理中。", "ctime": 1793968789, "time_str": "20:39:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261106/c681570013.shtml"}, {"id": "5599011", "title": "俄称一周12次对乌打击 乌称多处能源设施受损", "content": "俄国防部6日通报称，10月31日至11月6日一周内，俄军对乌发动12次大规模和集群打击，目标包括乌军工企业、物流中心、能源和交通基础设施、巡航导弹、地面机器人系统及无人机生产车间和储存点、弹药库等，并打击14艘为乌军运送物资的货船及多个港口军用物资接收储存分发设施。俄防空部队过去一周击落4枚“火烈鸟”巡航导弹、6枚“海王星”远程导弹、5315架固定翼无人机、1枚制导航空炸弹和2枚“海马斯”火箭弹。乌空军称5日晚至6日凌晨俄军发射227架攻击型无人机，乌防空击落压制196架，22处地点遭袭；基辅州和基洛沃格勒州称其居民楼和能源基础设施遭袭，基辅州3人受伤。（新华社）", "ctime": 1793968777, "time_str": "20:39:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261106/c681569977.shtml"}, {"id": "5598997", "title": "依米康：预制化产品已实现海外批量发货，施工周期目标缩短50%以上", "content": "依米康在投资者关系活动记录表中表示，公司预制化产品已实现海外批量发货，预制化业务正逐步形成业绩增长驱动之一。公司称，预制化交付目标是较传统现场工程缩短施工周期50%以上；公司持续推进预制化工厂建设工作，规划建设标准化预制化生产线及测试验证平台。", "ctime": 1793968716, "time_str": "20:38:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261106/c681569752.shtml"}, {"id": "5598969", "title": "11月6日 周五《新闻联播》要闻24条", "content": "1、习近平在参加北京市区人大代表换届选举投票时强调 践行全过程人民民主 确保选出人民满意的代表；\n2、习近平举行仪式欢迎加蓬总统访华；\n3、习近平同加蓬总统会谈；\n4、习近平会见奥地利总理；\n5、习近平签署国家主席令；\n6、李强主持召开国务院常务会议；\n7、李强会见加蓬总统；\n8、李强举行仪式欢迎奥地利总理访华；\n9、李强同奥地利总理会谈；\n10、十四届全国人大常委会第二十五次会议在京闭幕；\n11、赵乐际分别会见加蓬总统、奥地利总理；\n12、蔡奇会见朝鲜劳动党代表团；\n13、【学习贯彻党的二十届五中全会精神】中央宣讲团在各地各部门宣讲党的二十届五中全会精神；\n14、治理黄河80年取得举世瞩目伟大成就；\n15、10月我国电商物流需求平稳 物流供给保障有力；\n16、第九届进博会虹桥国际经济论坛继续举行多场分论坛；\n17、前三季度我国氢能产业投资同比增长108%；\n18、中央网信办从严查处利用AI技术假冒仿冒公众人物；\n19、国产大型邮轮“爱达·花城号”正式交付；\n20、4000米级浮空风电系统完成城市首飞；\n21、俄临时接管日本一公司在俄资产；\n22、美称很快决定对伊方案 普京会见雷扎伊；\n23、土耳其议会批准《麦加共同防务协议》；\n24、英国央行3年多来首次加息。（央视新闻）", "ctime": 1793968622, "time_str": "20:37:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261106/c681569400.shtml"}, {"id": "5598925", "title": "爱尔兰多家媒体遭炸弹威胁", "content": "11月6日，爱尔兰多家媒体机构收到炸弹威胁，部分办公场所紧急疏散，爱尔兰国家广播电视台总部受影响，部分节目一度中断，警方已介入调查。该台一名记者在直播中宣读了威胁邮件节选，称发件方是本周欧洲一连串航班遭炸弹威胁事件的幕后组织，但未点明组织名称。11月3日起4天内，欧洲三四十架次航班遭遇“诈弹”威胁，虽事后均被证实为虚惊一场，但不少乘客担忧欧洲航空安全，航班改降等也使航空公司遭受损失。（CCTV国际时讯）", "ctime": 1793968435, "time_str": "20:33:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261106/c681568779.shtml"}, {"id": "5598847", "title": "一艘油轮在霍尔木兹海峡附近发生爆炸", "content": "当地时间11月6日，英国海上贸易行动办公室发布安全警报称，一艘油轮在驶离霍尔木兹海峡期间发生爆炸，事件发生于协调世界时11月5日22时。船长报告称，船舶左舷水线位置发生爆炸，所有船员均安全且情况已确认，油轮仍具自主航行能力，正在继续航程。该办公室已将事件列为袭击事件，提醒附近航行船舶保持警惕、谨慎通行，发现可疑活动立即报告。有关部门正对事件展开调查，爆炸原因尚未公布。（央视新闻）", "ctime": 1793968289, "time_str": "20:31:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261106/c681568222.shtml"}, {"id": "5598715", "title": "东山精密：完成收购江苏华存73.4393%股权，总代价最高5.81亿元", "content": "东山精密公告，公司于往绩记录期间结束后及上市前完成一项收购及四项少数股权投资。其中，公司通过股权转让及增资合共收购江苏华存经扩大后73.4393%的股权，总代价最高为5.81亿元，包括基本代价4.36亿元及或然代价最高1.45亿元；截至公告日已支付3.76亿元。江苏华存已于2026年10月16日完成登记，成为公司非全资附属公司，财务业绩自2026年11月起并入综合财务报表。四项少数股权投资总金额约2.05亿元。", "ctime": 1793968107, "time_str": "20:28:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261106/c681568029.shtml"}, {"id": "5598713", "title": "俄罗斯：被拘留日本记者命运取决于调查结果", "content": "俄外交部5日就日本记者涉嫌间谍活动被拘留一事表示，其命运取决于相关调查结果。俄联邦安全局10月13日通报，日本《北海道新闻》驻南萨哈林斯克记者因涉嫌间谍活动被萨哈林州逮捕，拘留期限将于12月12日到期。据日本媒体说法，日本外相茂木敏充上周与俄外长拉夫罗夫会面要求立即释放该记者，扎哈罗娃拒绝回答拉夫罗夫如何回应。扎哈罗娃称日本加入西方对俄制裁等举动导致俄日关系严重恶化，俄方对与日方接触仍持开放态度，但“只有在日本当局放弃反俄路线后，才有可能充分恢复俄日对话”。据俄媒体5日报道，普京当天签署总统令临时接管日本烟草公司在俄资产，日本外务省欧洲局局长中村仁威6日向俄驻日本大使诺兹德廖夫提出抗议，要求俄方撤销该决定。（新华社）", "ctime": 1793968098, "time_str": "20:28:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261106/c681568025.shtml"}, {"id": "5598695", "title": "英力特：股份转让评审仍在推进", "content": "英力特公告，公司股票于2026年11月5日、11月6日连续两个交易日收盘价格涨幅偏离值累计超过20%，属于股票交易异常波动。公司此前披露，控股股东国能英力特能源化工集团股份有限公司拟通过公开征集受让方的方式，一次性整体协议转让所持公司1.55亿股无限售流通股份，占公司总股本的39.41%。本次公开征集期已结束，相关评审决策工作仍在推进，英力特集团将推进评审决策和磋商；意向受让方须通过评审并签署附条件生效的股份转让协议，协议还须取得国有资产监督管理机构及其他有权政府部门批准后方可实施。能否征集到符合条件的最终受让方并签署协议存在不确定性，若转让获批并实施，可能导致公司控制权发生变更。", "ctime": 1793967935, "time_str": "20:25:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261106/c681567978.shtml"}, {"id": "5598657", "title": "建科智能：更正2026年第三季度报告营业利润数据", "content": "建科智能公告，公司于2026年10月28日披露了《2026年第三季度报告》，经事后自查发现，由于填写疏忽，现对相应内容予以更正。更正前，合并利润表项目（1-9月）营业利润本期金额为874.14万元，上年同期金额为469.33万元，变动幅度97.39%；更正后，营业利润本期金额为4874.14万元，上年同期金额为2469.33万元，变动幅度97.39%。除上述更正内容外，公司2026年第三季度报告的其他内容不变，不涉及公司合并利润表及其他财务报表项目调整，不会对公司财务状况和经营成果产生影响。", "ctime": 1793967774, "time_str": "20:22:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261106/c681567913.shtml"}, {"id": "5598639", "title": "中国汽车消费服务业白皮书发布：预计2030年市场规模将突破10万亿元，数字化平台与AI成为全链路升级关键变量", "content": "懂车帝、中国汽车流通协会、中汽信科联合发布《2026中国汽车消费服务业白皮书》。白皮书测算，2025年中国汽车消费服务业市场规模约7.2万亿元，预计2030年将突破10万亿元；认为汽车消费服务高质量发展需实现规模化、标准化、品牌化、智慧化，头部平台企业具有塑造产业生态的核心作用，AI时代更离不开其数据和研发能力。懂车帝相关负责人介绍，其业务已覆盖汽车“选买卖用玩”全环节，推出“AI小懂”买车助手、经销商AI经营助手、AIGC创作工具等，服务消费者买车、经销商经营、创作者内容生产，实现全面提效。（新浪科技）", "ctime": 1793967642, "time_str": "20:20:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261106/c681567876.shtml"}, {"id": "5598581", "title": "韵达股份：拟以5000万元-1亿元回购公司股份", "content": "韵达股份公告，拟通过深圳证券交易所股票交易系统以集中竞价交易方式回购公司已发行的人民币普通股（A股）股票，回购的股份将用于股权激励计划或员工持股计划。回购资金总额为人民币5000万元（含）-1亿元（含），回购价格不超过人民币9.94元/股。在回购股份价格不超过人民币9.94元/股的条件下，按回购金额上限测算，预计回购股份数量约为1006.04万股；按回购金额下限测算，预计回购股份数量约为503.02万股。本次回购资金来源为公司自有或自筹资金，期限自公司董事会审议通过回购方案之日起不超过6个月。", "ctime": 1793967366, "time_str": "20:16:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261106/c681567785.shtml"}, {"id": "5598557", "title": "蔡奇会见朝鲜劳动党代表团", "content": "中共中央政治局常委、中央书记处书记蔡奇6日在京会见由朝鲜劳动党中央政治局委员、中央书记、国际部部长金成男率领的朝鲜劳动党代表团。蔡奇表示，习近平总书记今年6月成功访朝，同金正恩总书记达成一系列重要共识，引领中朝关系发展迈入新的历史阶段。中方愿同朝方共同落实好两党两国最高领导人重要共识，加强高层引领，弘扬传统友谊，深化管党治党经验互鉴，扩大各领域交流合作，密切战略沟通和协调配合，助力两国社会主义事业行稳致远，促进地区和平稳定与发展繁荣。金成男表示，两党两国最高领导人的深厚友谊和战略引领是朝中关系不断发展的坚实基础和不竭动力。祝贺中共二十届五中全会成功举行。朝方希同中方进一步加强党际交流合作。(新华社)", "ctime": 1793967140, "time_str": "20:12:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261106/c681567737.shtml"}, {"id": "5598517", "title": "中华人民共和国和加蓬共和国关于构建新时代中加命运共同体的联合声明", "content": "双方重申不断深化矿业领域合作的意愿，赞赏两国就地质和矿产领域合作签署谅解备忘录。中方充分尊重加蓬对本国自然资源享有的主权权利，愿秉持真实亲诚理念和正确义利观，助力加方将资源优势转化为发展动能，实现自主可持续发展。双方愿坚持互利共赢、友好协商、开拓进取原则，发挥各自优势，积极推进地质勘探、开采开发、本地加工、配套基础设施建设、能力建设等全产业链合作，打造中非矿产资源综合开发、协调发展的合作典范。（新华社）", "ctime": 1793967036, "time_str": "20:10:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261106/c681567714.shtml"}, {"id": "5598487", "title": "日德兰银行：AI股暴跌或更多源于仓位调整，投资者勿恐慌抛售", "content": "丹麦日德兰银行表示，近期人工智能和科技股跌势惨重，芯片股遭受重创，但此次市场波动似乎并非完全由基本面恶化所致，对冲基金等机构的仓位调整、保证金追缴及被迫抛售加剧了跌势，抛售不一定代表AI投资逻辑已崩塌。不过，美国中期选举后数据中心监管政策仍存在不确定性，市场可能继续面临较大波动，未来几天将成为关键时期。", "ctime": 1793966976, "time_str": "20:09:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261106/c681567690.shtml"}, {"id": "5598483", "title": "李强会见加蓬总统恩圭马", "content": "11月6日上午，国务院总理李强在北京人民大会堂会见来华进行国事访问的加蓬总统恩圭马。\n\n李强表示，中加建交以来，始终风雨同舟、守望相助，双边关系不断迈上新台阶，互利合作持续收获新成果，传统友谊历久弥坚。习近平主席将同总统先生举行会谈，共同擘画两国关系发展新蓝图。中方愿同加方一道，进一步筑牢政治互信，深化务实合作，不断丰富中加全面战略合作伙伴关系内涵，更好造福两国人民。(新华社)", "ctime": 1793966965, "time_str": "20:09:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261106/c681567682.shtml"}, {"id": "5598451", "title": "新亚制程：公司生产经营基本面未发生重大变化", "content": "新亚制程公告，公司股票于2026年11月5日、11月6日连续两个交易日收盘价格涨幅偏离值累计超过20%，属于股票交易异常波动。公司生产经营基本面未发生重大变化，提示存在市场情绪过热及非理性炒作情形，可能存在回调风险。公司此前披露拟通过发行股份及支付现金购买上海启元气体发展有限公司15.86%股权并募集配套资金，同时拟现金收购其51.27%股权，两项收购相互独立、不互为前提；截至公告日，标的资产审计、评估尚未完成，交易尚需履行决策及审批程序，能否实施存在不确定性。公司目前还在筹划出售化工材料—胶粘剂业务板块，拟将主要电子胶粘剂等相关业务、资产和人员整合至下属公司深圳市新亚新材料有限公司，并拟出售其控股权；该事项仍处筹划阶段，交易方案尚未确定，尚未与交易对方签署意向协议或正式协议，能否达成存在重大不确定性。公司2023年至2025年经审计归属于上市公司股东的净利润连续三年为负，2026年前三季度该项净利润为-2649.47万元。", "ctime": 1793966865, "time_str": "20:07:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261106/c681567618.shtml"}];

const META     = {"update_time": "2026-11-06 22:30:12", "sentiment_score": 53.930131004366814, "agents": []};

// 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
