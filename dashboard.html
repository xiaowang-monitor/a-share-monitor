片。", "ctime": 1789537577, "time_str": "13:46:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260916/c679961848.shtml"}, {"id": "5182835", "title": "也门胡塞武装称击落沙特F-15战机", "content": "也门胡塞武装16日称在也门东北部马里卜省上空击落一架沙特F-15战斗机。(新华社)", "ctime": 1789537376, "time_str": "13:42:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260916/c679961799.shtml"}, {"id": "5182831", "title": "英特尔、SK海力士美股夜盘涨超2%", "content": "英特尔、SK海力士美股夜盘涨超2%，有报道称SK海力士正与英特尔洽谈合作协议，有望首次在美国本土生产存储芯片。", "ctime": 1789537328, "time_str": "13:42:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260916/c679961790.shtml"}, {"id": "5182821", "title": "SK海力士正与英特尔洽谈合作协议，有望首次在美国本土生产存储芯片", "content": "消息人士称SK海力士正与英特尔洽谈合作协议，有望首次在美国本土生产存储芯片。另一种备选方案是SK海力士与英特尔以及大型云厂商成立合资企业。（蓝鲸新闻）", "ctime": 1789536945, "time_str": "13:35:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260916/c679961702.shtml"}, {"id": "5182795", "title": "香港推出组合拳鼓励生育", "content": "香港特区行政长官李家超今日（9月16日）公布《香港特别行政区经济和社会发展第一个五年规划（2026—2030年）》，随即发表《行政长官2026年施政报告》。李家超在《施政报告》中宣布，香港将推出组合拳措施鼓励生育。（大湾区之声）", "ctime": 1789536615, "time_str": "13:30:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260916/c679961633.shtml"}, {"id": "5182781", "title": "欧媒：冯德莱恩拟呼吁设立欧洲安全理事会", "content": "欧洲联盟委员会主席冯德莱恩定于当地时间16日在欧洲议会发表年度“盟情咨文”。据欧洲动态网站报道，冯德莱恩将提议对欧洲安全架构进行彻底改革，呼吁设立欧洲安全理事会。根据欧洲动态网站所获冯德莱恩讲话稿，欧洲安全理事会将由欧方领导人以及乌克兰、英国、挪威、加拿大等非欧盟国家领导人组成。(新华社)", "ctime": 1789536264, "time_str": "13:24:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260916/c679961531.shtml"}, {"id": "5182775", "title": "日本20年期国债收益率下降3个基点至3.855%", "content": "日本20年期国债收益率下降3个基点至3.855%。", "ctime": 1789536113, "time_str": "13:21:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260916/c679961515.shtml"}, {"id": "5182751", "title": "伊朗战事以来首次 美召以色列等八国军方高官密会", "content": "据财联社，美国阿克西奥斯新闻网站15日援引两名以色列官员的话报道，美国军方上周秘密召集以色列和沙特阿拉伯、阿拉伯联合酋长国、巴林、科威特、卡塔尔、约旦、埃及的军方高级官员在德国开会，讨论伊朗战事和中东地区紧张局势。报道说，尽管先前举行过这类会议，但上周的会议是2月底伊朗战事爆发以来首次。这场会议由美军中央司令部司令布拉德·库珀组织，在德国一处僻静的度假地举行。库珀在会上告诉与会代表，尽管伊朗持续打击中东美军基地，但美国不会从中东撤军。库珀还简要介绍了美国扩大霍尔木兹海峡通航量的方案。", "ctime": 1789535587, "time_str": "13:13:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260916/c679961442.shtml"}, {"id": "5182747", "title": "共封装光学(CPO)板块持续走高", "content": "共封装光学(CPO)板块持续走高，华源控股、立昂微涨停，光迅科技、可川科技、中瓷电子此前封板,，长芯博创、东田微、长光华芯涨超10%，九联科技、星网锐捷、兴森科技、崇达技术、方正科技等跟涨。", "ctime": 1789535505, "time_str": "13:11:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260916/c679961408.shtml"}, {"id": "5182743", "title": "南向资金净买入超30亿港元", "content": "据同花顺iFinD数据，截至目前，南向资金净买入超30亿港元，其中港股通（沪）买入超18.09亿港元，港股通（深）买入超13.06亿港元。", "ctime": 1789535398, "time_str": "13:09:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260916/c679961388.shtml"}, {"id": "5182733", "title": "预告：国新办将举行新闻发布会 介绍“十五五”时期推进住房城乡建设事业高质量发展有关情况", "content": "据中国网，国务院新闻办公室将于2026年9月18日（星期五）上午10时举行“开局起步‘十五五’”系列主题新闻发布会，请住房和城乡建设部新闻发言人、副部长陈绍旺介绍“十五五”时期推进住房城乡建设事业高质量发展有关情况，并答记者问。", "ctime": 1789535207, "time_str": "13:06:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260916/c679961352.shtml"}, {"id": "5182709", "title": "世界气象组织：全球臭氧层恢复持续见效", "content": "9月16日是国际保护臭氧层日。世界气象组织当天发布《臭氧公报》说，2025年南极臭氧空洞为数十年来最小之一，这证明保护地球臭氧层的国际行动持续取得成效。 公报说，2025年南极臭氧空洞排名为自1992年观察到严重消耗模式以来的第四至第五小，这是南极臭氧空洞的深度和范围连续第二年显著低于1990至2010年的平均水平。(新华社)", "ctime": 1789534727, "time_str": "12:58:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260916/c679961287.shtml"}, {"id": "5182681", "title": "中国移动：向全球开源Open-RAIL", "content": "9月16日，中国移动宣布正式向全球开源Open-RAIL，行业内首个连接VLA/WAM模型与机器人本体的通用工程底座。", "ctime": 1789534315, "time_str": "12:51:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260916/c679961078.shtml"}, {"id": "5182679", "title": "四川2026年1—8月锂离子电池产量增长80.5%", "content": "9月16日，四川省统计局官微发布2026年1—8月四川省国民经济主要指标数据，全省规模以上工业增加值同比增长6.7%，规模以上工业企业产品销售率为95.5%。分产品看，天然气产量同比增长0.4%，发电量增长3.0%，锂离子电池产量增长80.5%，集成电路增长20.1%，智能电视增长12.3%，工业机器人增长5.3%，发电机组增长3.9%。", "ctime": 1789534296, "time_str": "12:51:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260916/c679961065.shtml"}, {"id": "5182653", "title": "国家电投集团发电总装机突破3亿千瓦", "content": "据国家电投集团消息，随着一批项目并网，国家电投集团发电总装机容量突破3亿千瓦，到2026年8月底已刷新至超3.13亿千瓦。", "ctime": 1789533690, "time_str": "12:41:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260916/c679960706.shtml"}, {"id": "5182649", "title": "腾远钴业拟与湖南硫锂合作共建硫化锂中试线", "content": "记者从腾远钴业方面获悉，公司近日与湖南硫锂探索科技有限公司达成战略合作，双方将联合建设硫化锂中试线，开展固态电池硫化物电解质上游关键原料的工程化验证。根据合作安排，腾远钴业结合湿法冶金、高纯材料提纯等能力推进中试项目落地；湖南硫锂提供硫化锂材料配方与固态电解质研发技术。（财联社）", "ctime": 1789533614, "time_str": "12:40:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260916/c679960666.shtml"}, {"id": "5182645", "title": "香港首个五年规划：巩固提升“深圳—香港—广州”全球创新集群领先地位", "content": "9月16日，香港特区行政长官李家超公布《香港特别行政区经济和社会发展第一个五年规划（2026—2030年）》（简称《规划》）和《行政长官2026年施政报告》。《规划》提到，打造粤港澳大湾区创科生态产业链，促进科研成果转化，积极参与粤港澳大湾区科技创新和产业创新，包括鼓励香港科研机构参与粤港澳联合实验室的建设，以及加快优化创科生态圈整体布局，为科研机构及内地企业提供完善发展环境。香港会以河套深港科技创新合作区香港园区为重心，进一步强化与粤港澳大湾区其他城市的战略对接，尤其是深圳的战略性新兴产业集群，并促进创科要素跨境流动，推动科研成果在粤港澳大湾区其他城市转化，以及规模化、产业化应用。与深圳实现“合作研发、协同转化、共享发展”，以构建新兴与未来产业的产业链协同机制和模式，巩固提升“深圳—香港—广州”全球创新集群领先地位。", "ctime": 1789533595, "time_str": "12:39:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260916/c679960651.shtml"}, {"id": "5182611", "title": "我国首个“熔盐储能+二氧化碳”发电项目开工", "content": "中国华能16日宣布，我国首个将熔盐储能与二氧化碳发电结合的示范项目“睿碳号”，当日在华能山东八角电厂开工。这是目前国内规模最大的同类工程，首期建设1台50兆瓦超临界二氧化碳发电机组，配套100兆瓦/400兆瓦时熔盐储能系统。这个项目是国家科技重大专项“二氧化碳‘热力电池’关键技术开发与工程示范”的载体工程，开工标志着我国在二氧化碳发电与新型储能融合领域，进入实体工程建设阶段。(新华社)", "ctime": 1789533287, "time_str": "12:34:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260916/c679960444.shtml"}, {"id": "5182589", "title": "香港首个五年规划：扩大数字技术、数字产品和数字服务进出口", "content": "9月16日，香港特区行政长官李家超公布《香港特别行政区经济和社会发展第一个五年规划（2026—2030年）》（简称《规划》）和《行政长官2026年施政报告》。《规划》提到，积极发展数字贸易，加快贸易文件电子化进程。扩大数字技术、数字产品和数字服务（包括词元Token）进出口，完善数据服务产业链，探索粤港澳大湾区数据跨境流动便利化安排，积极参与数字贸易国际治理。有序落实香港“贸易单一窗口”第三阶段服务。同步推进与内地及其他经济体的“单一窗口”互联互通，促进区域数字贸易合作。推动“贸易单一窗口”接驳香港金融管理局商业数据通，便利银行获取相关商业数据作贸易融资参考，协助企业降低融资成本及改善现金流。", "ctime": 1789533067, "time_str": "12:31:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260916/c679960304.shtml"}, {"id": "5182587", "title": "香港首个五年规划：加大招商引资力度，大力引导产业发展", "content": "9月16日，香港特区行政长官李家超公布《香港特别行政区经济和社会发展第一个五年规划（2026—2030年）》（简称《规划》）和《行政长官2026年施政报告》。《规划》提到，要加大招商引资力度，大力引导产业发展。采取促进产业和投资的优惠政策引导产业发展。加快引进行业龙头和不同企业在香港设立管理离岸贸易及供应链的区域或国际总部和财资中心。面向中东、东盟、欧美长线资金，进一步壮大香港的总部经济及推广香港家族办公室。聚焦人工智能、数字经济、生命健康、新型工业化、绿色发展等创科领域重点产业，制订目标企业清单与年度招商行动计划。完善跨部门协调与项目落地机制，为企业提供个案服务，强化重点招商项目在土地、规划、通关、人才、监管等方面的一站式协调服务。", "ctime": 1789532991, "time_str": "12:29:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260916/c679960265.shtml"}, {"id": "5182585", "title": "香港首个五年规划：推动耐心资本和风投创投投入科技创新和产业创新", "content": "9月16日，香港特区行政长官李家超公布《香港特别行政区经济和社会发展第一个五年规划（2026—2030年）》（简称《规划》）和《行政长官2026年施政报告》。《规划》提到，推动耐心资本和风投创投投入科技创新和产业创新。优化科技企业上市制度，扩阔融资渠道。推动科技金融加速成长，支持创新科技企业融资做大做强。推进数字金融，全面提升金融机构服务效率与风险防控能力，探索数字金融基础建设的深层应用。秉持“相同业务、相同风险、相同规则”原则，构建全球领先的数字资产发牌及监管制度，推动数字资产流动性及市场创新发展。以市场化方式吸引各类金融资源投入到科技创新领域，强化高等教育前沿科技研究、科技成果转化及产业化、新兴产业发展，全生命周期支持科研成果向市场转化。", "ctime": 1789532778, "time_str": "12:26:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260916/c679960158.shtml"}, {"id": "5182577", "title": "住房城乡建设部：各地要加大治理“挂证”、挂靠等市场乱象力度 持续强化建筑市场监管", "content": "住房城乡建设部近日发布《关于2025年度建筑工程施工转包违法分包等违法违规行为查处情况的通报》。通报显示，2025年，全国住建系统加大了对建筑工程施工转包违法分包等违法违规行为的查处力度，全年共排查项目260270项次。目前，各地住房城乡建设主管部门对存在违法违规行为的企业和人员，分别采取罚款、没收违法所得、停业整顿、吊销资质、限制投标资格、责令停止执业等行政处罚或行政管理措施。住房城乡建设部要求，各地下一步要加大治理“挂证”、挂靠等市场乱象力度，持续强化建筑市场监管，不断优化建筑市场环境。", "ctime": 1789532508, "time_str": "12:21:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260916/c679960019.shtml"}, {"id": "5182571", "title": "打造新赛道策源地 《“十五五”时期中关村世界领先科技园区建设规划》发布", "content": "记者从北京市科委、中关村管委会了解到，近日，《“十五五”时期中关村世界领先科技园区建设规划》（以下简称《规划》）正式对外发布。《规划》立足中关村作为北京（京津冀）国际科技创新中心主阵地定位，聚焦持续擦亮中关村“金字招牌”，明确“十五五”时期中关村建设世界领先科技园区的总体要求、发展目标和九项重点任务，系统谋划了新时期中关村建设发展蓝图。《规划》全面对接国家有关高新区高质量发展要求，强调三个“更加突出”。一是更加突出技术策源。充分发挥北京创新资源优势，强化基础研究和关键核心技术攻关，加强原创性引领性技术创新，代表我国参与全球科技竞争，产出更多标志性成果，让更多新技术新领域新赛道从中关村走向世界。二是更加突出产业集聚。加快推动科技创新和产业创新深度融合，做强做优世界一流企业方阵，加快打造具有技术主导权的世界级产业集群，进一步增强对首都高质量发展的核心支撑与关键贡献。三是更加突出改革攻坚。持续发扬中关村敢为人先的改革精神，围绕率先一体推进教育科技人才发展、新领域新赛道制度供给、园区体制机制优化等方面深化改革，持续优化创新创业生态，为全国科技体制改革作示范。(央视新闻)", "ctime": 1789532302, "time_str": "12:18:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260916/c679959887.shtml"}, {"id": "5182557", "title": "香港：以黄金为切入点，构建大宗商 // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');

    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';

  }
  tbody.innerHTML = PICKS.map(p => {

      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
