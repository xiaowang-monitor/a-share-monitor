, "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260807/c678756342.shtml"}, {"id": "4913443", "title": "日本熊本县强震后 大量家庭仍处于断水状态", "content": "日本方面7日援引熊本县方面的消息称，近期发生的强震一度导致当地超10万户家庭供水中断。截至6日，八代市、宇城市等地仍有约36880户家庭断水。消息称，预计熊本县全县的断水问题要到本月底才能解决。（央视新闻）", "ctime": 1786077614, "time_str": "12:40:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260807/c678756334.shtml"}, {"id": "4913423", "title": "宜春官方：宁德时代锂矿处于停产检修状态", "content": "针对市场高度关注的宁德时代宜春枧下窝锂矿复产传闻，宜春市宜丰县生态环境局今日正式回应称：现场检查时，该企业处于停产检修状态，现场未进行矿石装运及破碎等生产作业，已要求企业尽快办理环评审批手续。 (上海证券报)", "ctime": 1786077060, "time_str": "12:31:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260807/c678756246.shtml"}, {"id": "4913409", "title": "北京亦庄发布全市首个词元经济政策 每年发放1亿元模型、词元券", "content": "《北京经济技术开发区关于支持词元驱动智能经济高质量发展的若干措施（试行）》明确，将加大推理专用芯片研发扶持力度，探索集成电路系统级架构创新。加速推理效能跃升，推动通用模型与行业专用模型协同研发，提升端侧推理效率。持续深化监管沙盒机制创新，鼓励具身智能、自动驾驶、医疗健康等重点领域的数据交易流通，探索以词元交易为基础的数据定价模式。通过打造全要素保障体系，为词元工厂建设提供全方位支撑。政策提出，对推动批量词元生产的企业，给予一定资金支持。每年还将继续发放算力券、数据券各1亿元，对开展推理效能跃升的企业，按照算力租赁费用的30%，给予最高2000万元的资金支持；按照年度数据交易金额的10%，给予采购主体最高100万元资金支持。不断降低基础设施建设和企业运营成本，全面提升单位能效下的词元产出效率与系统稳定性。目前，北京市首个词元工厂北京壹号词元工厂、北京市首家国资词元工厂京算词元工厂先后在北京亦庄正式点亮。未来，北京亦庄还将优化土地、能耗等要素保障，高标准推动万卡级词元工厂建设，支持各类主体推动批量词元生产。", "ctime": 1786076767, "time_str": "12:26:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260807/c678756206.shtml"}, {"id": "4913407", "title": "阿里视频大模型Wan3.0开启公测", "content": "记者获悉，8月6日，阿里巴巴视频生成大模型Wan3.0开启公测，在生成时长、万能创作、全能参考以及真实世界还原等维度全面升级：单次可生成30秒视频，完整表达创作意图；在文本、图片、音频、视频四种基础模态之外，首次支持doc、xls、ppt、pdf、md等文档格式输入等。据了解，Wan3.0还有智能时长功能，可根据提示词自动推荐合适时长。（人民财讯）", "ctime": 1786076615, "time_str": "12:23:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260807/c678756188.shtml"}, {"id": "4913405", "title": "山西发布山洪和地质灾害双预警", "content": "8月7日上午，山西省自然资源厅和山西省气象局联合发布地质灾害气象风险预警，预计8月7日8时至8日8时，阳泉市城区、矿区、郊区、平定县、盂县、长治市平顺县、晋城市陵川县、临汾市襄汾县部分区域地质灾害气象风险预警级别为三级（黄色预警），发生地质灾害的风险较高。上述地区政府、部门和群众应根据预警等级采取相应的防范措施，加强雨前排查、雨中巡查、雨后核查。此外，山西省水利厅和山西省气象局联合发布山洪灾害气象风险预警，8月7日8时至8日8时，受强降雨影响：阳泉市南部1个县发生山洪的可能性很大（红色预警）；阳泉市北部和中部、晋中市东北部2个市5个县发生山洪的可能性大（橙色预警）；忻州市东南部、晋中市东部2个市2个县发生山洪的可能性较大（黄色预警）；大同市东南部、忻州市东北部、晋中市东南部、长治市东部、晋城市东部5个市7个县可能发生山洪（蓝色预警）。其他地区也可能因局地短历时强降水引发山洪灾害，各地注意做好实时监测、防汛预警和转移避险等防范工作。（央视新闻）", "ctime": 1786076475, "time_str": "12:21:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260807/c678756177.shtml"}, {"id": "4913397", "title": "日本实际家庭消费连续7个月同比下滑", "content": "日本总务省7日公布的调查结果显示，日本家庭消费持续疲软，6月实际家庭消费支出连续第7个月同比下滑。数据显示，6月日本两人及以上家庭月平均消费支出同比下降3.3%，环比下降6.4%。在消费支出的10个大类中，有6个类别支出同比下降。具体来看，服装和鞋类、家具家居、水电燃气、交通通信等支出明显下滑。食品支出在5月同比增长后，6月再次转为同比下降，降幅为2.5%。有分析指出，受台风、降雨量增加等天气因素影响，多类商品和服务支出减少。（新华社）", "ctime": 1786076139, "time_str": "12:15:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260807/c678756083.shtml"}, {"id": "4913389", "title": "机构：2026年AI服务器出货量增幅上调至近31%", "content": "根据TrendForce集邦咨询最新AI服务器产业研究，在AI基础建设需求高涨的背景下，2026年全球九大云端服务供应商（CSP）总资本支出预估将同比增长约90%。近期超大型CSP、Tier-2数据中心业者对NVIDIA（英伟达）GB/VR等整柜式AI服务器方案的采购意愿明显提高，而且Google（谷歌）、AWS（亚马逊云科技）新一代ASIC平台于2026年下半年陆续放量，加上中系业者扩大采用本土AI方案以满足云端大语言模型（LLM）AI需求，促使TrendForce集邦咨询上调2026年AI服务器出货年成长幅度，从原先的28%更新为近31%。（新浪财经）", "ctime": 1786075917, "time_str": "12:11:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260807/c678756036.shtml"}, {"id": "4913387", "title": "浙江省防指将防台风应急响应提升至Ⅲ级", "content": "今年第13号台风“白海豚”8月7日8时位于浙江温岭偏东方向约763公里的洋面上，中心附近最大风力14级（强台风级）。预计“白海豚”将以每小时15—20公里左右的速度向偏西方向移动，强度变化不大或略有增强。受“白海豚”影响，今天到明天东海海域风力10—13级部分13—16级。沿海海面今天阵风7—9级，夜里9—11级，明天继续增强到9—12级，局部12—14级。明天下午起沿海地区有大雨暴雨局部大暴雨。根据《浙江省防汛防台抗旱应急预案》和第13号台风“白海豚”防御工作方案，经研判会商，浙江省防指决定于8月7日12时将防台风应急响应提升至Ⅲ级。请各地各部门密切关注台风发展变化，高效运行“1833”联合指挥体系，进一步做好监测预警预报、风险研判和管控、人员避险转移、社会面宣传引导等各项工作，切实保障人民群众生命财产安全。（央视新闻）", "ctime": 1786075841, "time_str": "12:10:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260807/c678756027.shtml"}, {"id": "4913381", "title": "8月7日午间公告一览：金河生物向特定对象发行股票获证监会同意注册批复", "content": "金河生物公告，公司于近日收到中国证监会出具的《关于同意金河生物科技股份有限公司向特定对象发行股票注册的批复》，同意公司向特定对象发行股票的注册申请，公司应在批复作出十个工作日内完成发行缴款。\n东方锆业公告，公司于近日收到深圳证券交易所出具的《关于受理广东东方锆业科技股份有限公司向特定对象发行股票申请文件的通知》，深交所对公司报送的申请文件进行了核对，认为申请文件齐备，决定予以受理。本次发行尚需通过深交所审核及获得中国证监会同意注册的批复后方可实施，最终能否通过及时间尚存在不确定性。", "ctime": 1786075765, "time_str": "12:09:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260807/c678756006.shtml"}, {"id": "4913357", "title": "中科奥格完成超2亿元A3轮融资", "content": "中国异种移植领域的企业成都中科奥格生物科技有限公司于2026年8月宣布完成超2亿元A3轮融资。本轮融资由中科创星领投，联想创投、牧原集团、威高血净、华立集团、华方资本、成都科创投跟投，老股东贝达基金、光合创投持续加注。凯乘资本担任独家财务顾问。本轮资金将主要用于异种移植产品的临床试验申报与推进、DPF级医用供体猪产能扩建、产业基地建设及新一代多基因编辑供体猪开发。(第一财经)", "ctime": 1786075466, "time_str": "12:04:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260807/c678755895.shtml"}, {"id": "4913341", "title": "港股午评：恒生指数涨0.15%，恒生科技指数涨0.34%", "content": "港股午间收盘，恒生指数涨0.15%，恒生科技指数涨0.34%。恒指港股通ETF银华（159318）涨0.23%，港股通科技ETF鹏华（159751）涨0.67%。板块方面，IT咨询与其他服务、林业板块涨幅靠前；铅锌、金属包装板块跌幅靠前。个股方面，拿森科技涨74.66%，MINIMAX-W涨17.7%，智谱涨17.57%，再鼎医药涨15.28%，太平洋航运涨15.12%；优然牧业跌5.94%，美高梅中国跌5.69%，现代牧业跌5.68%，晋景新能跌5.67%，商汤-W跌4.61%。", "ctime": 1786075269, "time_str": "12:01:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260807/c678755857.shtml"}, {"id": "4913331", "title": "金河生物：向特定对象发行股票获证监会同意注册批复", "content": "金河生物公告，公司于近日收到中国证监会出具的《关于同意金河生物科技股份有限公司向特定对象发行股票注册的批复》，同意公司 求处理与投资者教育开启专项自查，陆续有地方证监局向券商下发了通知，属于常态化工作内容之一。根据相关工作安排，券商应以投教工作相关指引为依据，重点核查制度建设、投诉渠道响应、投教经费投入、业务全链条风险提示等事项。检查项目较细，例如包括包括是否加强对新开户中小投资者的教育工作、是否为了自身利益对投资者进行诱导性宣传、年度投诉自查总结与问题改进情况、投诉处理不力的责任追究情况等等。中证协此前披露，今年上半年证券行业投诉处理工作整体运行平稳，但受市场交易活跃度提升影响，投诉总量增长较快，同时传统服务痛点与交易系统、产品适配性等新增问题交织。（财联社）", "ctime": 1786072906, "time_str": "11:21:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260807/c678755272.shtml"}, {"id": "4913245", "title": "上期所原油主力合约大涨5% 燃油主力合约涨超4%", "content": "上期所原油主力合约大涨5%，报535.3元/桶；燃油主力合约涨超4%，报3506元/吨。", "ctime": 1786072814, "time_str": "11:20:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260807/c678755240.shtml"}, {"id": "4913243", "title": "中疾控：新冠阳性率上升趋缓 总体处于中流行水平 南方显著高于北方", "content": "中国疾控中心发布7月27日至8月2日全国急性呼吸道传染病哨点监测情况。新型冠状病毒检测阳性率上升趋缓，总体上处于中流行水平。监测结果显示，全国哨点医院报告的流感样病例数占门急诊就诊总数的比例（流感样病例百分比）为4.5%，南方省份（5.7%）高于北方省份（2.9%）。哨点医院门急诊流感样病例呼吸道样本检测阳性率前三位病原体为新型冠状病毒（22.3%）、流感病毒（13.3%）、肠道病毒（4.1%）；住院严重急性呼吸道感染病例呼吸道样本检测阳性率前三位病原体为新型冠状病毒（8.2%）、流感病毒（5.8%）、人偏肺病毒（5.5%）。", "ctime": 1786072758, "time_str": "11:19:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260807/c678755226.shtml"}, {"id": "4913231", "title": "国债期货拉升 30年期主力合约涨0.2%", "content": "国债期货拉升，30年期主力合约盘中涨0.20%，现报115.630元。10年期涨0.03%，现报109.415元。5年期涨0.01%，现报106.51元。2年期跌0.01%，现报102.618元。", "ctime": 1786072406, "time_str": "11:13:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260807/c678755076.shtml"}, {"id": "4913227", "title": "刚果（金）埃博拉确诊病例超4000例", "content": "刚果（金）卫生部6日公布的数据显示，该国本轮埃博拉疫情累计确诊病例已达4053例。非洲疾病预防控制中心主任卡塞亚当天表示，实际感染人数可能高于已报告病例数。\n\n刚果（金）卫生部公布的数据显示，截至5日，该国累计报告埃博拉确诊病例4053例，其中死亡1850例，累计治愈793例。\n\n卡塞亚6日在线上记者会上说，实际感染人数或高于现有统计。本轮疫情严重程度前所未有，有关方面将开展研究，弄清病毒是否发生变异，以便有针对性地调整应对措施。(新华社)", "ctime": 1     el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
