5日在中国国际展览中心（顺义馆）和首都国际会展中心举办。（贝壳财经）", "ctime": 1790225832, "time_str": "12:57:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260924/c680251080.shtml"}, {"id": "5239567", "title": "中方强调AI发展不应政治化", "content": "当地时间9月23日，联合国安理会举行“人工智能与国际安全”公开会。中国常驻联合国代表傅聪大使表示，国际社会应加强团结合作，坚持人工智能发展与安全并重，推动人工智能朝着向上向善、造福人类的方向发展。傅聪大使强调，在科技领域拼凑排他性“小圈子”，强迫各国选边站队的做法，实质是将科技问题政治化、工具化。服务于个别大国垄断技术优势，谋求数字霸权的企图，不仅拖累全球科技进步，损害各国、特别是中小国家的发展权益，也将加剧技术标准割裂，系统互不兼容的风险，给全球安全埋下重大隐患。人工智能是全人类的共同财富，不应沦为“富国和富人的游戏”。 傅聪大使还指出，对人工智能在军事领域的研发应用，各国应采取谨慎负责的态度，避免战略误判和军备竞赛，反对利用相关武器实施无差别攻击或蓄意袭击平民及民用设施，确保人类始终掌握最终决策权。（CCTV国际时讯）", "ctime": 1790225561, "time_str": "12:52:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260924/c680250970.shtml"}, {"id": "5239535", "title": "大成基金百亿权益名将韩创“清仓式”卸任", "content": "大成基金最新公告称，因个人原因，韩创已于9月23日卸任全部在管的7只产品。这7只产品原先均由韩创独管，半年内先后增聘基金经理，截至9月17日，韩创全部在管产品已转入共管模式。韩创与徐彦、刘旭并称大成基金“权益三剑客”，截至今年年中，韩创在管总规模为109.17亿元，较一季度末缩水近百亿元。据财联社此前了解，韩创或将离职后转战私募。（财联社）", "ctime": 1790225122, "time_str": "12:45:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260924/c680250763.shtml"}, {"id": "5239511", "title": "厦门诞生新单价地王：建发35.6亿元拿地 楼面价5.8万元/平", "content": "厦门今日迎来“8.28新政”后首场土拍，本次共出让2宗涉宅用地，总土地出让面积8万平方米，起始总价41.95亿元。最终，这两宗地均以底价成交。其中，湖里区2026P13地块起始楼面价已刷新厦门涉宅用地楼面价TOP1位置，该地块由厦门兆宥盛房地产开发有限公司（建发）以35.61亿元底价竞得，成交综合楼面价58148元/平方米，成为厦门新晋单价地王。该地块土地出让面积5.1万平方米，规划建筑面积6.12万平方米，并明确要求现房销售。（财联社）", "ctime": 1790224772, "time_str": "12:39:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260924/c680250629.shtml"}, {"id": "5239509", "title": "一艘载有20名印度海员的商船在阿曼海岸附近遭袭，印度发声", "content": "对于一艘载有印度海员的商船在阿曼海岸附近遭袭，印度外交部当地时间23日发声谴责。据印媒报道，印度外交部23日发布声明称，一艘商船当天早些时候在阿曼东海岸附近遭袭，印方对此予以谴责。船上载有20名印度海员，其中19人获救，1人死亡。印度驻阿曼大使馆正在密切关注事态发展，并积极与阿曼政府协调，确保这些印度海员尽快回国。“仍有商船在该地区遭袭，令人深感担忧。我们重申，呼吁有关各方通过对话和外交途径缓和紧张局势，尽快恢复地区和平。”声明补充称，在该地区袭击商船、海员和民用基础设施的行为必须停止。（环球网）", "ctime": 1790224768, "time_str": "12:39:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260924/c680250628.shtml"}, {"id": "5239463", "title": "量子模拟器再现高能物理“弦断裂”过程", "content": "美国杜克大学研究团队利用13个囚禁离子组成的量子模拟器，再现了高能物理中的“弦断裂”过程，观测到与粒子—反粒子形成有关的动力学。这是量子物理领域的一项重要进展，也为理解弦断裂动力学开辟了新途径。相关研究23日发表于《自然·物理学》杂志。（科技日报）", "ctime": 1790223985, "time_str": "12:26:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260924/c680250326.shtml"}, {"id": "5239453", "title": "9月24日午间公告一览诺诚健华：子公司与礼来公司签署协议，最高1亿美元", "content": "诺诚健华公告，公司全资子公司北京诺诚健华医药科技有限公司与礼来公司签署研发合作及授权许可协议，双方将在创新药物研发领域开展战略合作，发现并开发至多5项创新性靶点项目。协议自2026年9月24日起生效，礼来公司将支付最高1亿美元的首付款和近期里程碑付款，潜在的研发及商业化里程碑付款总额合计约32.5亿美元，公司另有权收取个位数百分比的分级特许权使用费。", "ctime": 1790223879, "time_str": "12:24:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260924/c680250284.shtml"}, {"id": "5239449", "title": "总规模100亿元 湖南省金芙蓉达晨未来产业基金发布", "content": "在2026岳麓大会开幕式上，湖南省金芙蓉达晨未来产业基金正式发布并落地湖南湘江新区。据介绍，该基金首期规模30亿元、总规模100亿元，采用双GP联合管理模式，由达晨财智与湖南省财信产业基金管理有限公司共同管理，落户湘江基金小镇。基金聚集人工智能、生命工程、量子科技、前沿材料四大方向，重点投向初创期、成长期创新型企业。 (科创板日报)", "ctime": 1790223846, "time_str": "12:24:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260924/c680250266.shtml"}, {"id": "5239445", "title": "日本5年期国债收益率升至2.365%", "content": "日本5年期国债收益率上升9.0个基点，创下2.365%的历史新高。", "ctime": 1790223762, "time_str": "12:22:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260924/c680250223.shtml"}, {"id": "5239421", "title": "真实性与现代党在摩洛哥议会选举中赢得最多席位", "content": "摩洛哥内政部公布的初步计票结果显示，真实性与现代党在摩洛哥议会选举中 发表声明说，巴基斯坦行使自卫权，对阿富汗境内用于发射和存放无人机的10个地点进行精确空中打击。声明说，巴方以最强烈的措辞谴责23日从阿富汗领土起飞的无人机蓄意非法入侵巴基斯坦的行为。这一行为公然侵犯巴基斯坦主权和领土完整，是严重且不可接受的侵略行径。巴基斯坦防空系统探测、追踪并摧毁了所有入侵无人机，使其未能抵达任何预定目标。声明强调，打击行动严格限定于与针对巴基斯坦的袭击企图直接相关的军事目标。巴方呼吁阿方立即停止一切针对巴基斯坦的敌对活动，并履行其国际义务，对在阿富汗境内活动的恐怖组织采取有效行动。阿富汗政府发言人穆贾希德24日对阿富汗黎明新闻网表示，巴基斯坦军队在当天3时左右袭击阿南部坎大哈地区。袭击地点位于坎大哈第九区的一处荒漠地带，暂未收到人员伤亡和财产损失报告。（新华社）", "ctime": 1790221980, "time_str": "11:53:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260924/c680249335.shtml"}, {"id": "5239359", "title": "腾讯回应QClaw停止运营", "content": "9月24日，腾讯QClaw团队发布公告称，因业务发展调整，QClaw将于2026年12月24日00:00停止运营，自公告之日起停止新用户注册，停止订阅服务购买与续费。腾讯相关人士向第一财经记者回应称，因公司业务发展调整，为进一步整合资源为用户提供更好的Agent（智能体）服务，QClaw将停止服务，“我们也提供了WorkBuddy迁移工具，方便将QClaw中的数据快速迁移至WorkBuddy，将为完成迁移用户提供1000积分补贴。”（第一财经）", "ctime": 1790221783, "time_str": "11:49:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260924/c680249261.shtml"}, {"id": "5239339", "title": "港股恒生科技指数跌幅达1%", "content": "港股恒生科技指数跌幅扩大至1%，恒生指数现跌0.50%。", "ctime": 1790221314, "time_str": "11:41:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260924/c680249067.shtml"}, {"id": "5239331", "title": "国开新型政策性金融工具9月以来已投放超600亿元", "content": "记者9月24日从国家开发银行获悉，9月以来，国开新型政策性金融工具已投放资金608.5亿元，支持项目153个，涉及项目总投资1.4万亿元。所投放的资金全部用于补充民间投资项目和民间资本参与项目资本金，为扩大有效投资、激发民间投资活力、推动经济社会高质量发展提供支撑。（新华社）", "ctime": 1790221070, "time_str": "11:37:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260924/c680248880.shtml"}, {"id": "5239329", "title": "腾讯正式发布首个面向境外用户来华支付工具“TenPay Go”", "content": "在今日上午举行的“智付前海·喜迎APCE”——前海国际化支付服务发布活动上，腾讯宣布正式发布首个面向境外用户来华支付APP“TenPay Go”。据了解，该支付工具将支持来华人士使用熟悉的支付方式（外卡、Apple pay等），在境内微信支付商家网络进行消费。目前，TenPay Go 已与银联、VISA等7大国际卡组合作，可绑定近60个境外钱包。此外，TenPay Go还将携手深圳通打造交通卡包服 // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');

    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
