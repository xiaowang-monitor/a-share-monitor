l"}, {"id": "4821245", "title": "452处国家级保护区完成生态环境保护成效评估", "content": "生态环境部新闻发言人裴晓菲介绍，“十四五”时期，生态环境部完成了全国452处国家级自然保护区生态环境保护成效评估，以及首轮全国生态保护红线保护成效五年评估。评估结果显示，“十四五”时期，我国国家级自然保护区保护成效显著，452处保护区中，236处为“优”、211处为“良”、5处为“中”，优良率达98.9%。总体成效可以概括为“四个持续”：主要保护对象持续恢复、生态系统质量持续改善、生态系统服务功能持续增强、生态安全屏障持续巩固。“十四五”期间，全国生态保护红线内生态环境“轻度好转”，面积维持稳定，生态功能稳中向好，环境质量持续改善，监管制度逐步完善。（新华社）", "ctime": 1785231053, "time_str": "17:30:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260728/c678490807.shtml"}, {"id": "4821209", "title": "云中马：云中马合伙减持完成，累计减持1.931%股份", "content": "云中马公告，持股5%以上股东丽水云中马投资管理合伙企业（有限合伙）（简称“云中马合伙”）于2026年6月25日至2026年7月28日通过大宗交易方式累计减持公司股份265.6万股，占公司总股本的1.931%，减持价格区间为33.2元/股至38.88元/股，减持总金额9930.64万元。本次减持计划已全部实施完毕。减持完成后，云中马合伙持有公司股份由702.85万股降至437.25万股，持股比例由5.111%变动至3.180%；其与一致行动人刘雪梅女士合计持股比例由5.123%变动至3.192%，不再是公司合计持股5%以上股东。", "ctime": 1785230988, "time_str": "17:29:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260728/c678490730.shtml"}, {"id": "4821207", "title": "摩根士丹利维持人工智能板块看多观点", "content": "摩根士丹利表示，本轮回调过后，人工智能产业链依旧具备可观的风险收益比，此轮下跌主要为技术性调整，由获利了结盘主导。该行预计未来数年人工智能算力需求将持续供不应求，持续看好人工智能技术迭代、行业落地普及，以及人工智能相关资本开支的长期增长前景。（新浪财经）", "ctime": 1785230986, "time_str": "17:29:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260728/c678490728.shtml"}, {"id": "4821205", "title": "阿拉丁：终止投资4亿元药用科研试剂创新研发与生产基地项目", "content": "阿拉丁公告，公司于2026年7月28日召开董事会审议通过终止投资建设阿拉丁药用科研试剂创新研发与生产基地项目。该项目原计划投资金额为人民币4亿元，公司于2022年8月与上海杭州湾经济技术开发有限公司签署《投资意向协议》并支付订金1000万元。因市场环境变化及公司发展规划调整，经审慎评估，双方同意解除原协议，上海杭州湾经济技术开发有限公司将在30个工作日内退还订金1000万元。截至公告日，项目尚未实际实施建设，终止项目不会对公司生产经营及财务状况产生重大影响。", "ctime": 1785230976, "time_str": "17:29:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260728/c678490723.shtml"}, {"id": "4821203", "title": "招商蛇口旗下北京公司增资至235亿 增幅约194%", "content": "天眼查App显示，近日，招商局地产（北京）有限公司发生工商变更，注册资本由80亿人民币增至235亿人民币，增幅约194%。该公司成立于2004年10月，法定代表人为吕传来，经营范围含房地产开发、销售自行开发后的商品房、出租商业用房等，由招商局蛇口工业区控股股份有限公司全资持股。", "ctime": 1785230915, "time_str": "17:28:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260728/c678490685.shtml"}, {"id": "4821195", "title": "财政部：6月份全国共销售彩票759.78亿元 同比增长39.5%", "content": "财政部发布数据，6月份，全国共销售彩票759.78亿元，同比增加214.96亿元，增长39.5%，主要是今年足球世界杯体育赛事拉动竞猜型彩票销量上升。其中，福利彩票机构销售167.57亿元，同比减少13.73亿元，下降7.6%；体育彩票机构销售592.21亿元，同比增加228.69亿元，增长62.9%。1-6月累计，全国共销售彩票3268.74亿元，同比增加90.20亿元，增长2.8%。其中，福利彩票机构销售1000.89亿元，同比减少70.21亿元，下降6.6%；体育彩票机构销售2267.85亿元，同比增加160.41亿元，增长7.6%。", "ctime": 1785230859, "time_str": "17:27:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260728/c678490614.shtml"}, {"id": "4821185", "title": "步长制药：拟出资3350万元设立控股子公司，持股67%", "content": "步长制药公告，公司拟对外投资设立控股子公司山东步长盛世制药有限公司，注册资本5000万元，其中公司拟出资3350万元，持股比例为67%，合作方济南福聚长源企业管理中心（有限合伙）出资1650万元，持股33%。本次投资已获公司第五届董事会第五十三次会议审议通过，无需提交股东会审议，资金来源为自有资金。", "ctime": 1785230766, "time_str": "17:26:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260728/c678490546.shtml"}, {"id": "4821173", "title": "我驻福冈总领事馆提醒领区中国公民注意防范余震灾害", "content": "7月28日，中国驻福冈总领事馆发文提醒领区中国公民注意防范余震灾害。据日本气象厅发布，日本时间7月28日16时27分左右，熊本县熊本地方发生里氏7.1级地震，震源深度为10千米，九州各地均有不同程度震感，目前熊本县已发生多次余震。中国驻福冈总领馆提醒领区内特别是熊本县中国公民切实提高自我保护意识，如有必要可前往居住地的指定避难场所。密切关注日本官方发布的地震提示和海啸预警，谨防余震。如遇紧急情况，及时报警并与中国驻福冈总领事馆联系寻求协助。（央视新闻）", "ctime": 1785230631, "time_str": "17:23:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260728/c678490460.shtml"}, {"id": "4821169", "title": "金浦钛业：全资子公司因环保整改停产，复产时间待定", "content": "金浦钛业公告，公司全资子公司徐州钛白因外排水氟化物超标，自2026年7月15日起全面停产，原预计停产周期15-20天，现因整改进度不及预期，复产时间待定。", "ctime": 1785230620, "time_str": "17:23:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260728/c678490458.shtml"}, {"id": "4821167", "title": "上半年减税降费及退税近2万亿元支持科创和制造业", "content": "国家税务总局总审计师王世宇7月28日在国新办新闻发布会上介绍，今年上半年，现行支持科技创新主要政策和制造业发展政策减税降费以及退税1.91万亿元。其中，研发费用加计扣除等支持企业创新投入和技术转让的政策减税降费6596亿元；高新技术企业减按15%税率征收企业所得税等支持培育发展高新技术企业和新兴产业的政策减税约2520亿元；先进制造业企业增值税加计抵减等推进破解“卡脖子”和支持高端化发展的政策减税降费近1万亿元。（新华社）", "ctime": 1785230619, "time_str": "17:23:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260728/c678490457.shtml"}, {"id": "4821165", "title": "闽灿坤B：拟以750万-1500万港元回购公司股份", "content": "闽灿坤B公告，公司于2026年7月28日收到董事长蔡渊松先生提议，拟以公司自有资金，通过集中竞价交易方式回购公司B股股份，回购资金总额不低于港币750万元（含），不超过港币1500万元（含）。回购价格上限不高于董事会通过回购决议前30个交易日B股股票交易均价的150%。回购股份将用于员工持股计划或股权激励，或维护公司价值及股东权益。", "ctime": 1785230614, "time_str": "17:23:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260728/c678490453.shtml"}, {"id": "4821161", "title": "雷军回应小米《财富》500强排名：加油小米", "content": "雷军转发有关《财富》世界500强榜单消息，“小米位列232位，相比去年提升65位”，并表示：加油，小米！", "ctime": 1785230607, "time_str": "17:23:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260728/c678490438.shtml"}, {"id": "4821157", "title": "新西兰南岛一载有中国游客大巴侧翻", "content": "一辆载有中国游客的大巴28日在新西兰南岛皇后镇至格莱诺基公路发生侧翻事故，造成部分乘客受轻伤。中国驻克赖斯特彻奇总领馆再次提醒近期赴南岛中国公民注意冬季道路安全，防范路面湿滑和“黑冰”风险。(新华社)", "ctime": 1785230564, "time_str": "17:22:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260728/c678490412.shtml"}, {"id": "4821155", "title": "中国建筑：签约科威特污水处理厂项目，合同金额224亿元", "content": "中国建筑公告，近日公司与科威特公共工程部签署科威特北卡巴德污水处理厂及配套项目合同，合同金额10亿科威特第纳尔（折合人民币约224亿元），约占公司2025年度经审计营业收入的1.1%。项目采用EPC+OM模式，实施周期含设计、施工和安装调试5年、维保和运营5年。", "ctime": 1785230560, "time_str": "17:22:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260728/c678490410.shtml"}, {"id": "4821151", "title": "广东明珠：首次回购59.89万股，耗资369.77万元", "content": "广东明珠公告，公司于2026年7月27日董事会审议通过回购方案，拟以1亿元至1.5亿元回购股份，用于员工持股计划或股权激励，回购价格不超过10元/股。2026年7月28日，公司实施首次回购，通过集中竞价交易方式回购股份59.89万股，占总股本0.09%，成交价格区间为6.08元/股至6.22元/股，支付总金额369.77万元（不含交易费用）。本次回购进展符合既定方案。", "ctime": 1785230523, "time_str": "17:22:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260728/c678490394.shtml"}, {"id": "4821149", "title": "日本气象厅解除海啸注意信息", "content": "当地时间28日18时10分，日本气象厅解除所有海啸注意信息。当天稍早时，日本熊本县附近发生7.1级地震，最大震感为震度7，震源深度10公里。日本气象厅发布海啸预警信息，提示附近可能发生海啸，预计最大海啸高度为1米。(央视新闻)", "ctime": 1785230503, "time_str": "17:21:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260728/c678490386.shtml"}, {"id": "4821119", "title": "铁建重工：2026年上半年新签合同77.53亿元，同比增0.34%", "content": "铁建重工公告，公司发布2026年半年度重大合同签约中标公告。2026年1-6月新签合同合计77.53亿元，同比增长0.34%。按业务类型，隧道掘进机业务39.61亿元，同比下降5.66%；特种专业装备业务22.64亿元，同比增长92.90%；轨道交通设备业务15.29亿元，同比下降35.09%。按地区，境内56.69亿元，同比下降3.72%；境外20.85亿元，同比增长13.33%。此外，2026年4-6月重大合同金额合计21.97亿元，约占公司2025年营业收入的21.87%。", "ctime": 1785230338, "time_str": "17:18:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260728/c678490317.shtml"}, {"id": "4821113", "title": "纳斯达克100ETF大成：提示二级市场交易价格溢价风险", "content": "纳斯达克100ETF大成公告称，近期本基金二级市场交易价格明显高于基金份额参考净值，出现较大幅度溢价。2026年7月28日，收盘价为1.679元，收盘时基金份额参考净值为1.5872元。若7月29日溢价幅度未有效回落，基金有权申请临时停牌等措施。目前基金运作正常，无应披露而未披露的重大信息。提醒投资者关注溢价风险，审慎投资。", "ctime": 1785230251, "time_str": "17:17:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260728/c678490237.shtml"}, {"id": "4821111", "title": "塔牌集团：2026年上半年净利润2.19亿元，同比下降49.60%", "content": "塔牌集团公告，2026年上半年实现营业收入17.42亿元，同比下降15.30%；归属于上市公司股东的净利润2.19亿元，同比下降49.60%；扣除非经常性损益后的净利润1.5亿元，同比下降37.97%。报告期内，受行业需求下滑、房地产深度调整及二季度华南地区强降雨影响，区域水泥需求持续走弱，\"水泥+熟料\"销量同比下降11.84%，水泥价格同比下降5.72%；公司持续推进降本增效，水泥平均销售成本同比下降4.92%，但成本改善不足以对冲售价下跌影响，水泥主业毛利率收窄；上年同期非经常性损益基数较高，报告期非经常性损益同比减少约1.24亿元，多重因素导致净利润同比下降较多。", "ctime": 1785230242, "time_str": "17:17:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260728/c678490235.shtml"}, {"id": "4821107", "title": "三未信安：预计2026年上半年亏损1256.16万元，同比减亏57.25%", "content": "三未信安公告，预计2026年半年度实现营业收入2.09亿元，同比增长7.38%；归属于母公司所有者的净利润为-1256.16万元，与上年同期相比亏损减少1682.42万元，亏损同比减少57.25%；扣非净利润为-1889.7万元，亏损同比减少43.35%。上年同期归母净利润为-2938.58万元。业绩变化主要因海外市场和密码芯片业务规模增加、抗量子密码项目落地，以及持续推进提质增效，研发和管理费用同比下降。", "ctime": 1785230192, "time_str": "17:16:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260728/c678490218.shtml"}, {"id": "4821087", "title": "纳指ETF嘉实：提示二级市场交易价格溢价风险", "content": "纳指ETF嘉实公告称，近期该基金二级市场交易价格明显高于基金份额参考净值，出现较大幅度溢价。7月28日，收盘价为1.95元，收盘时基金份额参考净值为1.78元。若7月29日溢价幅度未有效回落，基金有权申请停牌等措施。投资者可在二级市场交易或申赎，交易价格受多种因素影响。目前基金运作正常，无应披露未披露信息。", "ctime": 1785230083, "time_str": "17:14:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260728/c678490144.shtml"}, {"id": "4821083", "title": "两部门调整部分能源资源行业企业城镇土地使用税政策", "content": "财政部、税务总局7月28日对外发布公告，明确将调整部分能源资源行业企业城镇土地使用税政策。 根据此次发布的公告，此前出台的煤炭、矿山、油气、建材、电力等行业企业的部分主要生产经营用地免征城镇土地使用税优惠政策将取消。同时，上述企业中具有公益性、安全保障性质以及重大基础设施用地的免税政策将予以保留。 据了解，部分能源资源行业企业城镇土地使用税优惠政策已实施近40年。近年来，优惠政策长期实施带来的土地利用效率偏低、影响税收公平等负面效应日益突出。 “当初给予优惠政策时，能源资源行业的产品还在实行计划定价，属于需要支持的行业。经过近40年的发展，我国能源资源行业已今非昔比，这方面的优惠政策确实需要调整。”中国财科院公共收入研究中心主任梁季说。 她表示，上述行业土地使用面积大，继续对其主要生产经营用地实施城镇土地使用税优惠政策，不利于企业节约集约使用土地。取消该优惠，可引导企业盘活存量土地，提高土地利用效率。 根据公告，政策调整设置了过渡期，分两步到位。对恢复征税的土地，自2026年 // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
