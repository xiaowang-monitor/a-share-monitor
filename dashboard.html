平稳运行，守住不发生系统性金融风险底线", "content": "十四届全国人大常委会第二十五次会议3日上午在北京人民大会堂举行第二次全体会议。会议听取了中国人民银行行长潘功胜受国务院委托作的关于金融工作情况的报告。报告介绍了2025年10月以来金融工作主要进展及成效、当前经济金融形势和问题挑战，提出下一步工作考虑：继续实施好适度宽松的货币政策，为经济持续向新向优向好发展营造适宜的货币金融环境；进一步加强和完善金融监管，不断增强监管质效；提升金融服务实体经济适配性，加快建设多层次现代金融市场体系，服务经济结构转型升级和高质量发展；稳步深化金融改革和高水平对外开放，维护国家金融安全；实施好支持资本市场的货币政策工具，巩固完善资本市场稳市机制。维护股票、债券、外汇等金融市场平稳运行，守住不发生系统性金融风险底线。（新华社）", "ctime": 1793715596, "time_str": "22:19:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261103/c681424828.shtml"}, {"id": "5557147", "title": "Meta拟发行150亿美元美元债", "content": "Meta计划通过美元债发行募资约150亿美元，此次发行是其跨境债券融资的一部分。此前消息称，Meta计划通过美元及欧元债券发行合计募资至少200亿美元，融资规模可能根据投资者需求进一步扩大。", "ctime": 1793715216, "time_str": "22:13:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261103/c681424758.shtml"}, {"id": "5557111", "title": "卡塔尔说美伊正研究调解方案　双方分歧仍待弥合", "content": "卡塔尔外交部发言人马吉德·安萨里3日表示，美国和伊朗正在研究调解方提出的旨在结束冲突的方案，但双方分歧仍有待弥合，相关外交努力还在继续。\n\n安萨里当天在外交部例行记者会上说，美伊双方均在研究调解方提出的方案，双方仍愿意继续谈判。\n\n安萨里还表示，卡塔尔正与巴基斯坦、海湾阿拉伯国家合作委员会成员国及其他地区和国际伙伴密切协调，继续在美伊之间传递方案，“弥合分歧的工作仍在进行”。(新华社)", "ctime": 1793714767, "time_str": "22:06:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261103/c681424705.shtml"}, {"id": "5557043", "title": "王毅同菲律宾外长拉扎罗通电话", "content": "中共中央政治局委员、外交部长王毅3日应约同菲律宾外长拉扎罗通电话。王毅表示，中菲关系面临恶意干扰，菲少数政客攻击抹黑中国、踩踏中方红线，菲方应约束有关人员、在对华政策上发出理性统一声音，应将一个中国政策落到实处、涉海问题谨言慎行。拉扎罗表示，菲方坚持一个中国政策立场不会改变，愿通过对话协商妥善处理涉海问题。双方就改善发展中菲关系达成基本共识：保持外交对话，排除内外干扰，反对恶意挑衅，负责任管控分歧、稳定局势、扩大共同利益。双方还就即将在菲召开的东亚合作领导人会议及之后在深圳召开的亚太经合组织领导人非正式会议交换意见。（新华社）", "ctime": 1793714158, "time_str": "21:55:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261103/c681424642.shtml"}, {"id": "5557035", "title": "德国默茨：在乌克兰缺席的情况下，由第三方国家讨论乌克兰问题是不可接受的", "content": "德国默茨表示，在乌克兰缺席的情况下，由第三方国家讨论乌克兰问题是不可接受的。", "ctime": 1793714109, "time_str": "21:55:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261103/c681424639.shtml"}, {"id": "5556985", "title": "北约证实将与法德英美代表在布鲁塞尔讨论乌克兰问题", "content": "北约发言人艾莉森·哈特证实，北约代表将于本周晚些时候在布鲁塞尔与法德英美代表会面，讨论如何推动“公正、持久地”结束乌克兰战事，会谈将延续此前在迈阿密和奥斯陆的讨论，北约未透露具体日期、与会人员及议程。欧盟委员会发言人皮尼奥确认会谈将于4日召开，由欧盟委员会主持，重点讨论乌克兰战后重建与繁荣。美国总统特使威特科夫2日表示，美国谈判代表本周将在布鲁塞尔与法德英、欧盟及北约代表会晤，讨论对乌克兰的安全保障、欧洲战后安全架构及如何支持乌克兰战后重建。（新华社）", "ctime": 1793713673, "time_str": "21:47:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261103/c681424607.shtml"}, {"id": "5556973", "title": "现货黄金站上3970美元/盎司", "content": "现货黄金站上3970美元/盎司，日内涨0.64%。同花顺黄金现货价格报853.34元/克，现涨0.9%。", "ctime": 1793713586, "time_str": "21:46:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261103/c681424590.shtml"}, {"id": "5556967", "title": "上期所原油主力合约大跌5%", "content": "上期所原油主力合约大跌5%，报660元/桶。", "ctime": 1793713580, "time_str": "21:46:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261103/c681424587.shtml"}, {"id": "5556957", "title": "布伦特原油失守101美元/桶", "content": "布伦特原油失守101美元/桶，日内跌3.71%。", "ctime": 1793713566, "time_str": "21:46:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261103/c681424584.shtml"}, {"id": "5556943", "title": "广西：充分释放资源禀赋优势 重点引进精深加工、创新型、高附加值等优质项目", "content": "广西日报消息，11月3日，广西壮族自治区招商引资暨抓项目促投资工作推进会在南宁召开，自治区主席韦韬出席会议并讲话。韦韬强调，要以制造业十大现代化支柱产业、向海经济“叶脉式”产业布局、人工智能、现代特色农业和现代服务业为招商引资主攻方向，充分释放资源禀赋优势，重点引进精深加工、创新型、高附加值等优质项目，加快推动传统产业转型升级，不断延链补链强链。要探索创新更多招商引资实操打法，突出“‘一把手’招商”，党政主要负责同志要亲自带头谋划、洽谈、服务项目，把资源力量向招商倾斜；坚持“长板招商”，因地制宜梳理比较优势，建立长板清单，精准匹配企业；抓活“多元招商”，强化招引业务培训，统筹推进场景招商、跨区域跨境产业链供应链招商、大数据招商；拓展“以商招商”，常态化实施“桂商兴桂”工程，发挥好现有关键企业、链主企业引领整合和生态主导作用，依托金融机构、商协会、专业机构、科研院所等力量，积极扩大广西招商“朋友圈”。", "ctime": 1793713487, "time_str": "21:44:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261103/c681424565.shtml"}, {"id": "5556927", "title": "胡塞武装称袭击沙特联军多处集结点 造成人员伤亡", "content": "当地时间3日下午，也门胡塞武装发表声明称，使用多枚弹道导弹袭击了位于也门拉赫季省的两处沙特主导联军人员集结点，导弹准确命中目标，造成数十人死伤，其中包括多名指挥官；还称袭击了位于也门焦夫省东部的沙特主导联军人员集结点，导弹直接命中目标，造成大量人员死伤，并摧毁、焚毁多辆军用车辆。沙特主导的联军暂未回应。（央视新闻）", "ctime": 1793713406, "time_str": "21:43:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261103/c681424555.shtml"}, {"id": "5556923", "title": "上期所燃油主力合约大跌6%", "content": "上期所燃油主力合约大跌6%，报4712元/吨。", "ctime": 1793713386, "time_str": "21:43:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261103/c681424550.shtml"}, {"id": "5556907", "title": "国际油价走低 布伦特原油期货跌幅扩大至3%", "content": "国际油价走低，布伦特原油期货跌幅扩大至3%，报101.57美元/桶。", "ctime": 1793713321, "time_str": "21:42:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261103/c681424539.shtml"}, {"id": "5556901", "title": "上期所低硫燃油主力合约大跌6%", "content": "上期所低硫燃油主力合约大跌6%，报5415元/吨。", "ctime": 1793713279, "time_str": "21:41:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261103/c681424534.shtml"}, {"id": "5556891", "title": "特朗普称将停止向以色列提供每年总额约40亿美元的军援", "content": "当地时间11月3日，美国总统特朗普向媒体表示，他已与以色列总理内塔尼亚胡达成协议，将停止向以色列提供每年总额约40亿美元的军事援助。特朗普说：“我们在几个月前达成了这项协议，他们对此并无异议，因为以色列是一个‘非常成功的国家’。他们不需要这些援助，到今年年底，我们将不再提供援助。”与此同时，特朗普指出：“如果以色列有需要，我们仍会提供帮助。他们是非常好的盟友。”（央视新闻）", "ctime": 1793713227, "time_str": "21:40:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "h // 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
