  padding: 20px;
  transition: all 0.2s;
}
.card:hover { background: var(--bg-card-hover); border-color: #334155; }
.badge {

.badge-s { background: rgba(239,68,68,0.2); color: #ef4444; }

.badge-c { background: rgba(100,116,139,0.2); color: #94a3b8; }
.score-bar {
  height: 6px; border-radius: 3px; background: #1e293b; overflow: hidden;
}
.score-bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s; }
.up { color: var(--red); }
.down { color: var(--green); }
.pulse { animation: pulse 2s infinite; }
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}
.glow { box-shadow: 0 0 20px rgba(59,130,246,0.15); }

</style>

", "title": "游族网络：拟以2亿元-4亿元回购公司股份", "content": "游族网络公告，拟以2亿元-4亿元回购公司股份，回购价格不超过16.63元/股。回购股份的用途为用于员工持股计划或股权激励。按回购金额上限4亿元和回购价格上限16.63元/股测算，预计回购股份数量2405.29万股，约占总股本的2.45%；按回购金额下限2亿元和回购价格上限16.63元/股测算，预计回购股份数量1202.65万股，约占总股本的1.23%。回购期限自董事会审议通过回购方案之日起不超过12个月，资金来源为自有资金或自筹资金。", "ctime": 1795684791, "time_str": "17:19:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261126/c682257477.shtml"}, {"id": "5767403", "title": "共进股份：拟以1.5亿元-2亿元回购公司股份", "content": "共进股份公告，拟以不低于1.5亿元人民币（含）、不高于2亿元人民币（含）回购公司股份，回购价格不超过20元/股，回购股份方式为集中竞价，回购股份用途为用于员工持股计划及/或股权激励，回购期限为自公司董事会审议通过本次回购方案之日起12个月内。按回购金额下限测算，预计回购数量约750万股，约占总股本0.95%；按上限测算约1000万股，约占总股本1.27%。", "ctime": 1795684281, "time_str": "17:11:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261126/c682256780.shtml"}, {"id": "5767383", "title": "山东电网分布式光伏涉网能力改造规模突破1000万千瓦", "content": "记者从国网山东省电力公司获悉，11月26日，山东电网分布式光伏涉网能力改造规模突破30万台、1000万千瓦。(新华社)", "ctime": 1795684137, "time_str": "17:08:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261126/c682256585.shtml"}, {"id": "5767363", "title": "咸亨国际：拟以5000万元-8000万元回购公司股份", "content": "咸亨国际公告，拟以不低于人民币5000万元（含）且不超过人民币8000万元（含）回购公司股份，回购价格不超过人民币15元/股（含本数），该价格不高于公司董事会通过回购决议前30个交易日公司股票交易均价的150%。回购股份将全部用于实施公司员工持股计划或股权激励计划。回购方式为以集中竞价交易方式回购股份，回购期限自股东会审议通过本次回购股份方案之日起不超过六个月。按回购价格上限15元/股测算，预计回购股份数量333.33万股-533.33万股，占公司总股本比例0.81%-1.30%。本次回购方案尚需提交股东会审议。", "ctime": 1795684088, "time_str": "17:08:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261126/c682256498.shtml"}, {"id": "5767361", "title": "“华龙一号”漳州核电4号机组内穹顶吊装就位", "content": "11月26日，位于福建漳州的漳州核电4号机组内穹顶吊装就位，标志着其已从土建施工全面转入设备安装阶段，为后续安装调试及并网发电奠定了坚实基础。(新华社)", "ctime": 1795684082, "time_str": "17:08:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261126/c682256487.shtml"}, {"id": "5767329", "title": "商务部：将进一步扩大二手商品流通", "content": "商务部新闻发言人何亚东在例行新闻发布会上表示，下一步将会同相关部门，继续推广二手商品流通试点经验，进一步用好全国行政事业单位、国有资产调剂共享平台，扩大调剂共享覆盖面，推动二手商品流通行业高质量发展。近年来，商务部会同有关部门启动二手商品流通试点工作，依托该平台建立跨部门、跨级次、跨地区调剂共享机制，推动闲置设备快速筛选核验、调拨运输、落地交接；“互联网+二手商品”模式日益普及，带动二手行业从“一收一卖”向收购、分销、服务全链条经营转型，租赁、竞拍等新型业态快速发展。（央视新闻）", "ctime": 1795683949, "time_str": "17:05:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261126/c682256277.shtml"}, {"id": "5767299", "title": "世界最长高速公路水下盾构隧道首线成功穿越长江", "content": "26日，我国自主研制、最大开挖直径达16.64米的“江海号”盾构机顺利越过长江南岸大堤，完成长江水域段7.46公里的掘进任务，成功“上岸”抵达江苏太仓，标志着世界最长的高速公路水下盾构隧道——海太长江隧道右线率先穿越长江，进入贯通冲刺阶段。(新华社)", "ctime": 1795683890, "time_str": "17:04:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261126/c682256192.shtml"}, {"id": "5767271", "title": "商务部：到中国创新、去中国研发已成投资中国新趋势", "content": "商务部新闻发言人何亚东在例行新闻发布会上表示，今年以来我国高技术产业吸收外资持续增长、占比稳步提升，体现外国投资者更看重中国创新生态产业链优势和长期发展机遇。今年前10个月，航空航天器及设备制造业、科技成果转化服务、计算机及办公设备制造业实际使用外资分别增长128.8%、73.3%和48.8%。何亚东称，随着中国新质生产力不断发展，到中国创新、去中国研发已成为外资企业投资中国的新趋势，将不断完善外资研发中心支持政策，推动外资企业提高产供链本地化水平。（央视新闻）", "ctime": 1795683803, "time_str": "17:03:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261126/c682256084.shtml"}, {"id": "5767245", "title": "宏川智慧：与燧原签署经销商合作合同，获S级经销商资格，考核周期内采购不低于300台一体机", "content": "宏川智慧公告，公司近日与上海燧原科技股份有限公司签署《经销商合作合同》，成为燧原指定S级经销商，可在中国大陆范围内非独家推广和销售燧原产品，合同有效期一年。合同约定考核周期内经销商采购目标为不低于300台一体机产品，如前六个月内未完成采购目标的10%，燧原有权单方提前终止合同。2026年1-9月公司及下属公司与燧原及下属公司签订产品采购合同金额2800万元（含税）。本次合同未约定固定交易总金额，具体采购需另行签署《采购订单》，对公司本年度及协议有效期内财务状况、经营业绩的具体影响尚不确定。", "ctime": 1795683704, "time_str": "17:01:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261126/c682255951.shtml"}, {"id": "5767199", "title": "宁波海运：浙能集团拟无偿划转12.82%股份至浙能燃料", "content": "宁波海运公告，公司股东浙能集团拟将其持有的公司1.55亿股无限售流通股（占总股本12.82%）无偿划转至浙能燃料，划转价款为0元。本次划转后，浙能集团持股比例由12.82%降至0，浙能燃料持股比例由1.88%增至14.71%。浙能燃料为浙能集团全资子公司，本次划转为一致行动人之间内部划转，不涉及向市场减持，控股股东及其一致行动人合计持有的公司权益未发生变化，不会导致公司控股股东、间接控股股东和实际控制人发生变化。本次划转尚需取得上海证券交易所合规性审查确认意见，并办理股份过户登记手续。", "ctime": 1795683612, "time_str": "17:00:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261126/c682255803.shtml"}, {"id": "5767147", "title": "华康洁净：中标越南电子洁净项目，中标金额11170500美元", "content": "华康洁净公告，公司近日参与越南某电子洁净相关项目投标，2026年11月25日收到《中标通知书》，确认公司为该项目中标供应商。中标价格1117.05万美元（按2026年11月25日汇率折算约7494.07万元人民币），约占公司2025年度经审计营业收入的3.28%。截至公告披露日，中标项目尚未签署正式合同，合同签订及条款尚存在不确定性。", "ctime": 1795683466, "time_str": "16:57:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261126/c682255584.shtml"}, {"id": "5767143", "title": "商务部：将不断完善外资研发中心支持政策，推动外资企业提高产供链本地化水平", "content": "11月26日，商务部新闻发言人何亚东在例行新闻发布会上表示，高技术产业吸收外资持续增长、占比稳步提升，今年前10个月航空航天器及设备制造业、科技成果转化服务、计算机及办公设备制造业实际使用外资分别增长128.8%、73.3%、48.8%。他表示，到中国创新、去中国研发已成为外资企业投资中国的新趋势，将不断完善外资研发中心支持政策，推动外资企业提高产供链本地化水平，为外资企业深耕中国市场创造条件。（澎湃新闻）", "ctime": 1795683398, "time_str": "16:56:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261126/c682255502.shtml"}, {"id": "5767131", "title": "恒通股份：回购实施结果，累计回购1084.26万股并拟注销", "content": "恒通股份公告，公司此前审议通过回购方案，拟以不低于8000万元且不超过1亿元回购股份，回购价格上限14.5元/股，用于减少注册资本。2026年11月25日公司完成回购，累计回购股份1084.26万股，占总股本比例1.54%，回购最高价13.8元/股，最低价7.44元/股，回购均价9.22元/股，回购总金额9999.38万元（不含交易费用）。公司将于2026年11月27日注销本次所回购的1084.26万股。", "ctime": 1795683209, "time_str": "16:53:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261126/c682255186.shtml"}, {"id": "5767127", "title": "联合国维和人员助埃博拉防疫人员撤离刚果（金）战火", "content": "在联合国维和人员协助下，10名被战火困在刚果（金）东部一家医院的埃博拉防疫人员近日成功撤离。联合国刚果（金）稳定特派团（联刚稳定团）25日在一份声明中说，于24日帮助撤离10名被困的医护人员。为应对伊图里省朱古地区武装冲突，该团22日在当地部署移动基地，以加强平民保护。（新华社）", "ctime": 1795683163, "time_str": "16:52:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261126/c682255122.shtml"}, {"id": "5767109", "title": "曼恩斯特：控股股东、持股5%以上股东及其一致行动人拟增持公司股份，增持金额合计不低于1600万元", "content": "曼恩斯特公告，控股股东深圳市信维投资发展有限公司计划自本公告披露之日起6个月内增持公司股份，增持金额不低于人民币1000万元；持股5%以上股东长兴文刀网络科技合伙企业（有限合伙）计划增持金额不低于人民币300万元；持股5%以上股东长兴承礼网络科技合伙企业（有限合伙）之一致行动人王精华先生计划增持金额不低于人民币300万元。上述增持计划不设定价格区间，增持主体将根据公司股票价格波动情况及资本市场整体趋势择机实施。", "ctime": 1795682628, "time_str": "16:43:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261126/c682253837.shtml"}, {"id": "5767107", "title": "重大突破！我国首次开展省间省内绿电联合交易", "content": "我国首次开展省间省内绿电联合交易，全国统一电力市场建设迎来重大突破。江苏一家面向海外市场的制造业企业仅一次申报，就同时购得来自新疆等省区和江苏省内新能源发电企业的绿电，交易范围涵盖西北、华东10个省区市，总成交电量62亿千瓦时。过去绿电交易需在省间、省内两级市场分头参与、分开报价，新能源跨省流通受制约；如今发电企业和电力用户只需提交一次交易申请，交易平台即可跨区域统筹绿电资源。北京电力交易中心新能源交易部主任刘硕表示，本次联合交易打通了省间、省内两级绿电交易市场，跨省跨区富余通道空间得到进一步充分利用，绿电交易更加便捷高效，实现新能源大范围消纳。（央视新闻）", "ctime": 1795682613, "time_str": "16:43:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261126/c682253796.shtml"}, {"id": "5767103", "title": "商务部：望美中推动对等降税安排尽快落地实施", "content": "商务部新闻发言人何亚东在例行新闻发布会上表示，推动吉隆坡经贸磋商联合安排继续延期，将为中美双方企业合作提供相对稳定可预期的政策环境，符合中美双方利益，经贸团队一直在密切沟通。中方认为尽快落实300亿美元对等降税安排有利于扩大双方贸易，注意到美方发布的“产能过剩”301拟议措施中对该清单产品进行了豁免，希望美方加快内部程序，与中方一道共同推动安排尽快落地实施。（央视新闻）", "ctime": 1795682582, "time_str": "16:43:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261126/c682253724.shtml"}, {"id": "5767083", "title": "复星医药：控股子公司注射用那库巴坦药品注册申请获受理", "content": "复星医药公告，公司控股子公司复红康合医药（重庆）有限公司就注射用那库巴坦（项目代号：OP0595）的药品注册申请获国家药品监督管理局受理。该药品为静脉滴注新型β-内酰胺酶抑制剂，本次获受理适应症为与注射用盐酸头孢吡肟或注射用氨曲南联用，用于治疗18岁及以上成人患者中由对本品敏感的革兰阴性菌引起的复杂性尿路感染（cUTI）包括急性肾盂肾炎（AP）。截至2026年10月，本集团针对该药品的累计研发投入约为2.14亿元（包含许可费用；未经审计）。", "ctime": 1795682320, "time_str": "16:38:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261126/c682253067.shtml"}, {"id": "5767079", "title": "商务部：中国和墨西哥将成立工作组 围绕降低关税问题开展对话", "content": "商务部11月26日召开例行新闻发布会，新闻发言人何亚东表示，为落实好两国元首达成的重要共识、深化各领域务实合作，11月23日，王文涛部长与墨西哥经济部长埃布拉德共同主持召开中墨高层工作组第十一次会议。中方在会上明确提出，我们一贯主张通过对话协商解决经贸分歧，反对各种形式的单边加税措施。希望墨方审慎使用贸易救济措施，免受第三方干扰。希望墨方理性、客观、全面看待贸易平衡问题，与中方共同努力，促进双边贸易提质升级。双方同意成立相关工作组，围绕降低关税问题开展对话，进一步推动双边经贸关系健康、稳定、可持续发展。(人民财讯)", "ctime": 1795682296, "time_str": "16:38:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261126/c682253005.shtml"}, {"id": "5767077", "title": "复星医药：控股子公司HLX109注射液获临床试验批准", "content": "复星医药公告，公司控股子公司复宏汉霖收到国家药品监督管理局关于同意HLX109注射液（靶向IL1RAP的单克隆抗体）用于泛发性脓疱型银屑病治疗开展I期临床试验的批准。截至2026年11月26日，该适应症亦已获准于澳大利亚开展I期临床试验。截至2026年10月，本集团针对HLX109的累计研发投入约为0.52亿元（未经审计）。全球范围内尚无靶向IL1RAP的单克隆抗体产品获批上市。", "ctime": 1795682291, "time_str": "16:38:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261126/c682252994.shtml"}, {"id": "5767073", "title": "恒林股份：拟以5000万元-1亿元回购公司股份", "content": "恒林股份公告，拟以人民币5000万元（含）-1亿元（含）回购公司股份，回购价格不超过39.78元/股（含），回购股份用途为用于员工持股计划或股权激励。回购方式为集中竞价交易方式，回购期限为自公司董事会审议通过本次回购股份方案之日起12个月。按回购价格上限测算，预计回购股份数量125.69万股-251.38万股，占公司总股本比例0.90%-1.81%。回购资金来源为自有资金及/或自筹资金。", "ctime": 1795682264, "time_str": "16:37:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261126/c682252921.shtml"}, {"id": "5767055", "title": "国防部回应美军海外基地部署F-15EX战机", "content": "11月26日下午，国防部举行例行记者会，发言人陈曦大校就美军首次在海外基地部署F-15EX战机、日本持续推进防务政策调整对地区安全稳定带来风险等问题答记者问。陈曦表示，此举完全背弃和平发展承诺，对地区和平稳定构成现实威胁，美方应对此保持高度警惕，与国际社会一道捍卫来之不易的二战胜利成果，维护战后国际秩序。（央视新闻）", "ctime": 1795682217, "time_str": "16:36:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261126/c682252823.shtml"}, {"id": "5767033", "title": "中国互联网金融协会召开互联网助贷业务规范健康发展座谈会", "content": "为进一步推动互联网助贷业务规范健康发展，中国互联网金融协会近期先后在北京、深圳召开座谈会。协会党委书记、秘书长马超同志出席会议并讲话，金融管理部门有关负责同志出席指导，商业银行、消费金融公司等24家金融机构，以及承担审计工作的相关会计师事务所参加会议。马超在总结讲话中强调，个别助贷平台出现的风险事件暴露出行业自身的问题，防范化解风险需要助贷平台与金融机构共同推进。助贷平台要严格自律，强化自我约束，不断提升合规意识和水平。工作委员会将稳妥有序吸纳合规意愿强、合规水平高的助贷平台加入，推动发挥合规表率作用。协会将与金融机构共同研究建立风险预警、信息共享等机制，强化协同治理和常态化沟通。(人民财讯)", "ctime": 1795682068, "time_str": "16:34:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261126/c682252471.shtml"}, {"id": "5766965", "title": "天士力：子公司司美格鲁肽注射液获临床试验批准，累计研发投入3394.57万元", "content": "天士力公告，全资子公司天津天士力之骄药业有限公司收到国家药监局核准签发的司美格鲁肽注射液《药物临床试验批准通知书》，同意本品开展体重管理适应症的临床试验。该药物注册分类为化学药品3类，受理号CYHL2600098、CYHL2600099、CYHL2600100。截至公告日，天士力之骄对该药物的累计研发投入为3394.57万元。", "ctime": 1795681824, "time_str": "16:30:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261126/c682251981.shtml"}, {"id": "5766941", "title": "马云今日现身阿里旗下芯片公司平头哥", "content": "记者获悉，马云今日现身阿里旗下的芯片公司平头哥。（科创板日报）", "ctime": 1795681651, "time_str": "16:27:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261126/c682251567.shtml"}, {"id": "5766939", "title": "以色列正直党宣布恢复与民主党组阁谈判", "content": "当地时间26日，以色列正直党宣布恢复与以色列民主党组阁谈判，并在声明中表示，两党将于26日当天举行“旨在达成组阁协议的马拉松式磋商”。截至目前，以色列民主党尚未就此正式发表评论。11月24日，以色列左翼政党民主党领导人戈兰宣布冻结与正直党的谈判，以抗议正直党继续与以色列看守政府总理内塔尼亚胡领导的利库德集团就组建政府进行接触。（央视新闻）", "ctime": 1795681633, "time_str": "16:27:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.c // 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
