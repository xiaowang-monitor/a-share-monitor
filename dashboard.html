23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260331/c675658921.shtml"}, {"id": "4166579", "title": "以军称在黎巴嫩南部抓获一名真主党成员", "content": "当地时间3月31日，以色列国防军表示，其部队在黎巴嫩南部行动中抓获一名真主党成员。以军还表示，过去一天内其部队在行动中打死多名试图伏击的真主党武装人员，并发现大量武器。（央视新闻）", "ctime": 1774936260, "time_str": "13:51:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260331/c675658904.shtml"}, {"id": "4166561", "title": "支付宝发布支付集成Skill", "content": "支付宝发布国内首个“支付集成Skill”，将基础支付能力深度封装为标准化组件。此外，支付宝还升级了“沙箱环境”，开发者可在无真实资金、未正式开通支付产品的前提下，完成全链路支付测试。（第一财经）", "ctime": 1774936113, "time_str": "13:48:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260331/c675658868.shtml"}, {"id": "4166559", "title": "多部门推动物联网创新发展 2028年核心产业规模突破3.5万亿元", "content": "工业和信息化部等九部门近日联合印发《推动物联网产业创新发展行动方案（2026—2028年）》。《行动方案》提出，三年内，物联网核心产业规模突破3.5万亿元。《行动方案》提出，到2028年，物联网产业创新能力持续增强，感知、网络与通信、数据处理、安全等关键技术取得突破，终端和平台智能化水平显著提升，制修订50项以上先进适用标准，培育打造10个亿级连接和15个千万级连接的应用领域，物联网终端连接数力争达到百亿级规模，物联网核心产业规模突破3.5万亿元。《行动方案》提出，加速推进人工智能、5G、人机交互、边缘计算等技术与物联网应用终端深度融合，提升应用终端的精准分析、智能决策和便捷交互能力。增强网络设备连接能力，满足物联网大连接、低时延、抗干扰、低功耗的通信需求。激发消费领域物联网应用需求。加快智能感知、多模态数据融合等技术发展，打造一批具备自主感知、控制与执行能力的先进智能体。催生物联网与人工智能融合应用新产品、新场景、新模式。（央视新闻）", "ctime": 1774936062, "time_str": "13:47:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260331/c675658860.shtml"}, {"id": "4166539", "title": "萝博派对完成2000万美元天使轮融资", "content": "记者今日获悉，上海萝博派对科技有限公司（萝博派对）完成2000万美元天使轮融资，由商汤国香资本、经纬创投超额加注并联合领投，浦东创投、上海未来产业基金等多家机构跟投。企查查显示，该公司2025年2月成立，近半年已完成3轮融资。在不久前的全球开发者先锋大会上，萝博派对带来了全开源双足人形机器人“萝博头”原型机。", "ctime": 1774935766, "time_str": "13:42:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260331/c675658814.shtml"}, {"id": "4166519", "title": "伊朗回应美方所谓停火“15点计划”：要求过分 不切实际 不合常理", "content": "据伊朗媒体30日报道，伊朗外交部发言人巴加埃表示，伊朗迄今未与美国进行任何直接谈判，而美方提出的停火计划“过分且不合理”。巴加埃说，伊朗方面通过部分中间方收到有关美国表达谈判意愿的信息。他表示，外界提及的所谓美方停火“15点计划”，其要求“过分且不合理”。巴加埃表示，与美方不断改变立场、发表相互矛盾言论不同，伊朗方面始终立场明确。谈及日前在巴基斯坦举行的地区会议时，巴加埃说，该会议属于巴方设定的框架，伊朗并未参与。但如果地区国家关注地区和平与安全，这是值得肯定的。他同时强调，国际社会应关注战争的始作俑者，而不应单方面要求一方保持克制。巴加埃重申，伊朗并非战争的发起方，而是在外交谈判进程中遭到袭击的一方。他说，一旦伊朗方面在相关问题上形成结论，将适时对外公布。(新华社)", "ctime": 1774935187, "time_str": "13:33:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260331/c675658670.shtml"}, {"id": "4166503", "title": "沪深京三市成交额超1.5万亿元，较上日此时放量62亿元", "content": "据同花顺iFinD数据，沪深京三市成交额超1.5万亿元，较上日此时放量62亿元，预计全天成交金额约1.9万亿元。截至目前，沪市成交额6640亿元，深市成交额8265亿元，北证50成交额99亿元。", "ctime": 1774935077, "time_str": "13:31:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260331/c675658648.shtml"}, {"id": "4166485", "title": "瑞银：中国市场调整或已过度 优质AI股票迎来布局窗口", "content": "3月31日，瑞银财富管理投资总监办公室（CIO）发表机构观点，认为当前中国市场的调整可能已过度，投资者有机会以较低估值增持优质中国AI股票。中国互联网行业目前12个月远期市盈率约为13倍，已接近DeepSeek发布前的水平，当前估值尚未充分反映过去一年AI投资及变现带来的收益。瑞银财富管理预计，MSCI中国指数今年EPS增速约为13%，科技板块盈利增速有望达到20%至25%。并且政策仍然积极支持AI发展和科技创新，随着市场情绪及基本面改善，盈利、估值和仓位有望逐步回升。(上海证券报)", "ctime": 1774934773, "time_str": "13:26:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260331/c675658588.shtml"}, {"id": "4166481", "title": "楚能新能源总裁黄锋：2026-2027年储能电芯将处于供需紧张状态", "content": "第十四届储能国际峰会暨展览会上，楚能新能源股份有限公司总裁黄锋就未来两年储能电芯市场形势作出预判。他指出，2026年至2027年，储能电芯将处于相对紧张的状态，供需关系是决定因素。黄锋分析称，中国电芯产销占全球90%以上，2025年中国产销量约600吉瓦时，下半年已出现“一芯难求”局面，实际产能约500多吉瓦时。若按行业平均35%的增长率计算，今年需求将达800-850吉瓦时，整个市场仍有压力。（界面新闻）", "ctime": 1774934694, "time_str": "13:24:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260331/c675658581.shtml"}, {"id": "4166477", "title": "以总理称美以对伊朗的行动“已过半程”", "content": "当地时间3月30日，以色列总理内塔尼亚胡称，美国与以色列对伊朗的行动“已过半程”，当前重点在于伊朗的浓缩铀储备。据悉，内塔尼亚胡在接受采访时说，从完成任务的角度来说，“我们已过半程”。美以军队打击了“伊朗战争能力的关键要素”，包括导弹系统、武器工厂及核项目相关人员。内塔尼亚胡称，当前聚焦的“重点是他们（伊朗）的浓缩铀储备”，美国总统特朗普已要求将这些物质移出伊朗。这些物质可能被移交给国际机构监管。不过，内塔尼亚胡在采访中拒绝给出结束对伊行动的具体时间表。（央视新闻）", "ctime": 1774934638, "time_str": "13:23:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260331/c675658575.shtml"}, {"id": "4166473", "title": "两轮车方向午后持续走强", "content": "两轮车方向午后持续走强，宏昌科技走出2连板，华洋赛车涨超15%，征和工业涨停，中远通、久祺股份、新日股份、移远通信、钱江摩托跟涨。", "ctime": 1774934556, "time_str": "13:22:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260331/c675658561.shtml"}, {"id": "4166467", "title": "泰国政府：微软计划在泰投资10亿美元发展人工智能和云计算", "content": "3月31日，泰国政府发表声明称，微软公司计划在未来两年内向泰国投资10亿美元，以扩展其云计算和人工智能基础设施。（界面新闻）", "ctime": 1774934403, "time_str": "13:20:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260331/c675658540.shtml"}, {"id": "4166457", "title": "古巴外长驳斥美方对古“无惩罚性措施”说法", "content": "古巴外长罗德里格斯30日在社交媒体上发文严厉驳斥美国政府有关“没有对古巴采取任何惩罚性措施”的说法。罗德里格斯质问，如果经济封锁都不是惩罚性措施，那是什么？如果威胁向古巴出口燃料的国家不是惩罚性措施，那是什么？限制古巴在任何国家的金融交易、限制曾停靠古巴港口的商船，以及禁止美国人前往古巴，这些又算什么？罗德里格斯还发问，诸如“支持恐怖主义国家”名单等带有选择性和随意性的清单究竟有何用途？美国施压拉美和加勒比多国政府迫使其放弃同古巴医疗合作项目，借此剥夺古巴合法收入，这难道不是实实在在的惩罚性措施？根据美国国务院官网的消息，美国国务卿鲁比奥30日在接受媒体采访时称，美国“没有对古巴采取任何惩罚性措施”。1959年古巴革命胜利后，美国政府对古巴采取敌视政策。1962年，美国对古巴实施经济、金融封锁和贸易禁运。2021年1月，美国将古巴列入“支持恐怖主义国家”名单。美国今年年初对委内瑞拉发动大规模军事打击后，进一步加大对古巴的压力，包括实施新一轮石油限制措施。(新华社)", "ctime": 1774934134, "time_str": "13:15:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260331/c675658477.shtml"}, {"id": "4166453", "title": "北京消费品以旧换新政策持续落地 带动销售额约50亿元", "content": "北京市2026年消费品以旧换新补贴持续释放消费活力。今年已累计销售补贴产品超130万件，带动销售额约50亿元。市民通过“京通”小程序即可领取补贴资格，购买家电、手机、平板等产品可享受最高15%补贴。如今，北京全市已有近7000家门店、1300余家商户参与，让实惠更便捷地走进市民生活。（央视）", "ctime": 1774934107, "time_str": "13:15:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260331/c675658459.shtml"}, {"id": "4166445", "title": "高盛：到2026年底黄金价格可能达到每盎司5400美元", "content": "高盛分析师在一份研究报告中指出，到2026年底黄金价格可能达到每盎司5400美元。分析师表示，目前黄金价格似乎处于超卖状态，因为投机性仓位较低，且市场对鹰派政策冲击的预期远高于历史经验所显示的水平。高盛经济学家继续预期美联储将在2026年降息两次，该行估计这将推动金价每盎司上涨约120美元。与此同时，央行需求仍然是中期需求的关键支撑，高盛预测央行购金规模可能再次加速，平均每月购入约60吨黄金。", "ctime": 1774934027, "time_str": "13:13:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260331/c675658443.shtml"}, {"id": "4166429", "title": "敏昂莱当选缅甸副总统", "content": "缅甸联邦议会人民院民选议员团3月31日召开会议，经投票表决，选举敏昂莱为副总统。(新华社)", "ctime": 1774933689, "time_str": "13:08:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260331/c675658369.shtml"}, {"id": "4166389", "title": "中际旭创成交额达100亿元", "content": "中际旭创成交额达100亿元，现跌5.23%。", "ctime": 1774933295, "time_str": "13:01:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260331/c675658279.shtml"}, {"id": "4166377", "title": "港股恒生科技指数跌幅达1%", "content": "港股恒生科技指数跌幅扩大至1%，恒生指数现跌0.52%。", "ctime": 1774933265, "time_str": "13:01:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260331/c675658276.shtml"}, {"id": "4166363", "title": "缅甸民族院推选南尼尼埃参加总统选举", "content": "当地时间3月31日，缅甸联邦议会人民院（下议院）和民族院（上议院）分别召开团体会议。在民族团体会议上，议员对已提名的两名副总统候选人进行匿名投票选举，民族院共有157名议员，实际出席150人。最终，联邦巩固与发展党议员南尼尼埃获得117票，当选副总统。按照选举程序，缅甸两院民选议员团各自选举一名副总统，两院军人议员团另外选举出一名副总统。此后，由联邦议会议员组成的总统选举团将从3名副总统中投票选出一位总统。（央视新闻）", "ctime": 1774932926, "time_str": "12:55:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260331/c675658213.shtml"}, {"id": "4166359", "title": "吉尔吉斯斯坦驻伊朗使馆宣布暂停工作", "content": "当地时间3月31日，吉尔吉斯斯坦外交部发布公告称，该国驻伊朗使馆已暂时停止工作。公告呼吁停留在伊朗的吉尔吉斯斯坦公民保持高度警惕，不要在人群聚集场所及潜在的危险区域停留，严格遵守当地政府的要求。公告再次建议吉尔吉斯斯坦公民暂缓前往伊朗。（央视新闻）", "ctime": 1774932708, "time_str": "12:51:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260331/c675658177.shtml"}, {"id": "4166343", "title": "全球最大吨位增程式旋挖钻机在湖南长沙下线首发", "content": "全球最大吨位增程式旋挖钻机在湖南长沙下线首发，这款钻机的作业重量达到200吨、扭矩62万牛·米（KN·m）、孔径3500毫米，同时在多电机同步、瞬变大负载缓冲控制、主卷扬势能回收等方面实现关键核心技术突破，获得相关授权专利十余项，实现了多电机转速与转矩双闭环高精度同步。钻杆钻具寿命延长20%，冲击震动降低15%，能量回收率达70%以上，单次下放最高可回收5度电，在低温环境下用于驾驶室供暖和电池辅热，综合节能5%～10%。此次同步发布的系列钻机既保留了纯电驱动的节能环保优势，又解决了传统纯电设备“续航焦虑”的痛点，能耗成本大大降低，同时具备电机扭矩大、响应快、噪音低的优势，支持纯电、增程、插电模式切换，为超大规模桥梁与高速铁路桩基工程，绿色施工要求严格的城区与敏感区域，高原、山区等电网覆盖不足的野外基建等运用场景提供了强有力支撑。（央视新闻）", "ctime": 1774932378, "time_str": "12:46:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260331/c675658122.shtml"}, {"id": "4166329", "title": "中国海外发展：2025年公司股东应占溢利为126.9亿元", "content": "中国海外发展在港交所公告，2025年集团收入为人民币1680.9亿元。公司股东应占溢利为人民币126.9亿元。每股基本盈利为人民币1.16元。", "ctime": 1774931861, "time_str": "12:37:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260331/c675657985.shtml"}, {"id": "4166299", "title": "在岸人民币兑美元升破6.92", "content": "在岸人民币兑美元升破6.92，日内涨0.0362%。", "ctime": 1774931483, "time_str": "12:31:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260331/c675657888.shtml"}, {"id": "4166291", "title": "巴基斯坦副总理兼外长达尔来华", "content": "外交部发言人宣布：应中共中央政治局委员、外交部长王毅邀请，巴基斯坦副总理兼外长达尔将于3月31日来华，同王毅外长就当前国际和地区冲突问题和双边关系举行会谈。（央视新闻）", "ctime": 1774931451, "time_str": "12:30:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260331/c675657878.shtml"}, {"id": "4166285", "title": "联想控股：2025年净利润97.99亿元 同比增长28%", "content": "联想控股港交所公告，截至2025年12月31日止年度，公司总收入为人民币6,059.45亿元，同比增长18%；年内归属于本公司权益持有人净利润为人民币97.99亿元，同比增长28%；每股基本盈利为0.45元。", "ctime": 1774931225, "time_str": "12:27:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260331/c675657848.shtml"}, {"id": "4166277", "title": "日本两年期国债收益率下跌1.0个基点，至1.345%", "content": "日本两年期国债收益率下跌1.0个基点，至1.345%。", "ctime": 1774931108, "time_str": "12:25:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260331/c675657833.shtml"}, {"id": "4166273", "title": "以色列前顾问：以色列的目标是将伊朗变成一个失败国家", "content": "近日，以色列总理办公室前高级顾问丹尼尔·利维在接受总台《高端访谈》采访时表示，以色列的战略目标是在地区建立军事主导，如今他们自认为这个目标已触手可及。利维认为，以色列这一战略极其鲁莽、既不可行也不现实。利维说，以色列的目标是将伊朗变成一个失败国家、一个崩溃的政权。以色列寻求的是实现政权瓦解、国家崩溃，开启伊朗国家分裂和解体的进程。（央视新闻）", "ctime": 1774930948, "time_str": "12:22:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260331/c675657810.shtml"}, {"id": "4166265", "title": "三部门印发《标准引领纺织工业优化升级行动方案（2026—2028年）》", "content": "工业和信息化部、生态环境部、市场监管总局印发《标准引领纺织工业优化升级行动方案（2026—2028年）》。其中提出，到2028年，制修订多元适配、数字转型、绿色低碳、健康安全等标准300项以上，纺织标准供给能力全面提高；加快开展行业科技成果先进性、适用性和扩散性评估，推动先进适用的科技成果标准转化，加强标准制修订与技术创新联动；开展重点标准实施情况监测分析，标准供给质量稳步提高，标准执行实施更加有力；制修订国际标准10项以上，国际标准转化率持续保持在85%以上，国内国际一致性稳步提升。", "ctime": 1774930784, "time_str": "12:19:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260331/c675657775.shtml"}, {"id": "4166257", "title": "国内首条承插式管片高铁隧道盾构机下线", "content": "今天（31日）由我国自主研制的超大直径盾构机“奋楫号”在江苏南通顺利下线，将被用于盐宜高铁长江隧道工程。该工程是国内首条采用承插式管片的高铁盾构隧道，隧道的建设将推动我国超大直径水下盾构隧道向全智能建造时代迈进。（央视新闻）", "ctime": 1774930486, "time_str": "12:14:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260331/c675657728.shtml"}, {"id": "4166255", "title": "日本在建“顶级神冈探测器”坑道内发生管道破裂事故", "content": "当地时间3月31日10时15分左右，日本岐阜县飞騨市正在建设中的中微子探测器“顶级神冈探测器”的坑道内发生管道破裂事故。正在进行检查作业的5名工作人员被紧急送医。中微子是构成物质的基本粒子之一，广泛存在于宇宙中。它个头小，基本不与任何物质发生作用，因而难以捕捉和探测，被称为宇宙“隐身人”。要探测中微子，目前较好的办法是在地下深处建造水槽式的探测器，捕捉穿透地层的中微子和水分子碰撞发出的微弱光。（央视新闻）", "ctime": 1774930382, "time_str": "12:13:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260331/c675657722.shtml"}, {"id": "4166253", "title": "工信部等九部门：到2028年，物联网核心产业规模突破3.5万亿元", "content": "工业和信息化部等九部门近日联合印发《推动物联网产业创新发展行动方案（2026—2028年）》，明确将通过推动物联网设备创新升级、提升物联网平台服务效能、培育物联网应用场景、夯实物联网网络底座、营造物联网产业发展生态等五大举措，推动物联网产业创新发展，进一步加速物联网技术全面融入生产、消费和社会治理各领域，促进数字经济和实体经济深度融合，助力发展新质生产力。《行动方案》提出，到2028年，物联网新技术、新产品、新模式不断涌现，产业创新能力持续增强，感知、网络与通信、数据处理、安全等关键技术取得突破，终端和平台智能化水平显著提升，制修订50项以上先进适用标准，培育打造10个亿级连接和15个千万级连接的应用领域，物联网终端连接数力争达到百亿级规模，物联网核心产业规模突破3.5万亿元。", "ctime": 1774930371, "time_str": "12:12:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260331/c675657719.shtml"}, {"id": "4166251", "title": "4名以色列军人在黎巴嫩南部身亡", "content": "以色列国防军31日发表声明说，4名以色列军人在黎巴嫩南部的冲突中身亡。声明说，4人均来自以军纳哈尔侦察营，其中包括一名22岁的上尉，为侦察营小队指挥官。声明说，还有一名以军士兵在冲突中受重伤，一名预备役军人受伤。(新华社)", "ctime": 1774930346, "time_str": "12:12:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260331/c675657712.shtml"}, {"id": "4166243", "title": "以色列总理称美以对伊朗的行动“已过半程”", "content": "以色列总理内塔尼亚胡30日称，美国与以色列对伊朗的行动“已过半程”，当前重点在于伊朗的浓缩铀储备。内塔尼亚胡在接受美国大全新闻网采访时说，从完成任务的角度来说，“我们已过半程”。美以军队打击了“伊朗战争能力的关键要素”，包括导弹系统、武器工厂及核项目相关人员。内塔尼亚胡称，当前聚焦的“重点是他们（伊朗）的浓缩铀储备”，美国总统特朗普已要求将这些物质移出伊朗。这些物质可能被移交给国际机构监管。大全新闻网报道说，内塔尼亚胡在采访中拒绝给出结束对伊行动的具体时间表。(新华社)", "ctime": 1774930084, "time_str": "12:08:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": ": "4166187", "title": "高盛：DRAM市场基本面稳健，但投资者情绪转弱", "content": "高盛最新报告指出，3月DRAM市场出现微妙分叉，供需基本面未恶化，但投资者信心明显退步。报告称，韩国和中国台湾DRAM厂商的强劲出口和营收增长显示供需层面的韧性，但DDR5现货价格回调、中国智能手机出货量下滑及TurboQuant引发的内存需求优化担忧构成短期压力。尽管如此，AI应用扩张带来的总需求增长逻辑尚未被打破。", "ctime": 1774929110, "time_str": "11:51:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260331/c675657446.shtml"}, {"id": "4166177", "title": "字节AI编程产品TRAE SOLO独立端上线", "content": "字节跳动旗下AI编程产品TRAE推出“SOLO独立端”，包含桌面端和网页端两种形态，均提供 Code 和 MTC(More Than Coding) 两种功能模式，目前处于内测阶段，持有邀请码的用户可限时免费使用。（科创板日报）", "ctime": 1774928779, "time_str": "11:46:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260331/c675657394.shtml"}, {"id": "4166175", "title": "两艘中国巨轮顺利通过霍尔木兹海峡", "content": "已在波斯湾滞留一个多月的中国香港籍集装箱船“中海北冰洋”号与“中海印度洋”号，北京时间3月31日上午已顺利通过霍尔木兹海峡。这是自2月底以来，我国大型船只首次通过霍尔木兹海峡，让紧张的全球供应链恢复了信心。记者查询船舶追踪数据系统得知，北京时间3月30日傍晚，“中海北冰洋”号与“中海印度洋”号从迪拜附近海域起锚，沿着伊朗最大岛屿格什姆岛与腊克岛之间的航线，以10.4节左右的航速，通过霍尔木兹海峡狭窄的出口，随后驶入阿曼湾水域。船舶追踪数据系统显示，这两艘船只预计4月6日抵达马来西亚的巴生港。 (深圳新闻网)", "ctime": 1774928595, "time_str": "11:43:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260331/c675657367.shtml"}, {"id": "4166173", "title": "伊朗首都德黑兰东部已恢复电力供应", "content": "据伊朗方面当地时间3月31日早间消息，伊朗首都德黑兰东部的电力供应已恢复。当天早些时候，因一处变电设施被弹片击中，德黑兰东部部分地区停电。（央视新闻）", "ctime": 1774928533, "time_str": "11:42:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260331/c675657361.shtml"}, {"id": "4166171", "title": "中东三国领导人讨论地区军事冲突升级影响", "content": "当地时间3月30日，沙特阿拉伯王储兼首相穆罕默德同到访的约旦国王阿卜杜拉二世和卡塔尔埃米尔塔米姆在沙特西部城市吉达举行会谈。会谈重点讨论地区局势的最新发展，以及地区军事冲突升级带来的影响，包括“对国际航行自由和能源供应安全的威胁以及对全球经济的影响”。此外，他们还就如何协调各方以促进地区安全与稳定交换了意见。（央视新闻）", "ctime": 1774928518, "time_str": "11:41:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

      <span class="text-xs text-gray-400">${item.mentions}次提及</span>

  `).join('');

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
