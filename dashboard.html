.score-bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s; }
.up { color: var(--red); }

le": "美商会会长：美中关系新定位利好双边经贸发展", "content": "6月2日，上海美国商会会长郑艺在上海接受记者采访，从美国商界视角解读美中构建建设性战略稳定关系为双边经贸发展带来的积极作用。郑艺表示，美中两国确立将构建建设性战略稳定关系，可以说是为两国关系未来发展定下了基调，跳出过度聚焦战略竞争的惯性思路，实现双边相处基调的重要转向。在企业看来，这是一项十分积极的成果。倘若美中两国在可预见的未来坚守这一框架，意义重大。该框架明确了双边关系的基本定位，是美中开展合作的关键所在。（新华社）", "ctime": 1780569158, "time_str": "18:32:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260604/c677224936.shtml"}, {"id": "4462947", "title": "万润股份：向全体股东每10股派1.25元", "content": "万润股份公告，公司2025年度利润分配方案为：以公司现有总股本9.16亿股为基数，向全体股东每10股派1.25元人民币现金（含税）。预计派发现金1.14亿元，不低于当年实现的可供分配利润的20%。股权登记日为2026年6月10日，除权除息日为2026年6月11日。", "ctime": 1780568983, "time_str": "18:29:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260604/c677224825.shtml"}, {"id": "4462945", "title": "致尚科技：公司持续收到美国某光纤连接解决方案提供商的采购订单，累积订单金额约6640.04万美元", "content": "致尚科技公告，2026年1月1日至本公告披露日，公司持续收到美国某光纤连接解决方案提供商的采购订单，累积订单金额约6640.04万美元，折合人民币约4.6亿元（不含税）。公司主要向该客户销售光纤连接器（MPO光纤跳线等光通信产品）。截至本公告披露日，公司已向该客户累积交货金额约4480.07万美元，折合人民币约3.1亿元（不含税）。", "ctime": 1780568977, "time_str": "18:29:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260604/c677224823.shtml"}, {"id": "4462937", "title": "以军空袭加沙城致9人死亡", "content": "巴勒斯坦加沙地带民防部门4日发表声明说，以色列军队当天空袭加沙城多处居民楼，造成包括妇女和儿童在内的至少9人死亡。现场目击者告诉新华社记者，空袭对建筑造成了严重破坏，部分建筑起火，升起滚滚浓烟。民防与医护人员正开展搜救行动，但由于遇袭建筑受损严重以及物资短缺，搜救行动面临巨大挑战。以军尚未对此作出回应。加沙地带卫生部门4日发布的数据显示，自2025年10月加沙停火第一阶段协议生效以来，以军在加沙地带的行动已造成947人死亡、2935人受伤。（新华社）", "ctime": 1780568787, "time_str": "18:26:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260604/c677224748.shtml"}, {"id": "4462933", "title": "共达电声：拟向浙江镝嘉增资不超过2亿元取得51%控制权", "content": "共达电声公告，公司于2026年6月4日召开董事会，审议通过了《关于签署<股权投资框架协议>的议案》。公司拟以自筹资金对浙江镝嘉精密科技有限公司投资并委派过半数董事等方式，取得标的公司合计不低于51%的实际控制权。具体投资方案为：公司向浙江镝嘉增资不超过2亿元 .com.cn/20260604/c677223597.shtml"}, {"id": "4462781", "title": "久融控股：集团于公开市场出售合共5897万股宋都服务集团有限公司股份", "content": "久融控股公告，集团于公开市场出售合共5897万股宋都服务集团有限公司股份。根据本公司的财务记录，由于进行出售事项，本集团确认未经审核亏损约0.2百万港元。", "ctime": 1780567524, "time_str": "18:05:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260604/c677223545.shtml"}, {"id": "4462779", "title": "吉祥航空：2025年度现金分红总额调整为4.24亿元", "content": "吉祥航空公告，公司2025年度利润分配拟每股派发现金红利0.2元（含税）不变，现金分红总额由人民币4.3亿元（含税）调整为4.24亿元（含税）。调整原因为公司实施以集中竞价交易方式回购公司股份，导致实际参与利润分配的股份总数变动，维持每股分配金额不变，相应调整分配总额。", "ctime": 1780567519, "time_str": "18:05:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260604/c677223543.shtml"}, {"id": "4462777", "title": "欧盟向黎巴嫩军队提供1亿欧元援助", "content": "欧盟理事会4日宣布，根据欧洲和平基金框架，通过了一项价值1亿欧元的援助措施，以支持黎巴嫩武装部队提升防务能力和维护地区稳定。欧盟理事会在声明中表示，这是欧洲和平基金向黎巴嫩提供的第四项双边援助措施。该援助将帮助黎巴嫩武装部队提升后勤保障、行动部署以及维护国家安全与稳定的能力。声明指出，此次援助获批后，欧洲和平基金迄今向黎巴嫩提供的援助总额已达到1.82亿欧元。（央视新闻）", "ctime": 1780567518, "time_str": "18:05:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260604/c677223540.shtml"}, {"id": "4462775", "title": "外交部：美应立即全面终止对古巴封锁制裁、胁迫施压", "content": "外交部发言人毛宁4日表示，炮制借口、造谣抹黑不能成为美方对古巴野蛮封锁、非法制裁的理由，美方应立即全面终止对古巴的封锁制裁和胁迫施压。\n\n当日例行记者会上，有记者问：据报道，6月2日，美国国务卿鲁比奥接受美参议院外交委员会质询，有参议员表示拜登政府时期美情报部门未发现古巴“支恐”行为。鲁比奥回应称，古巴曾支持西半球几乎所有左翼激进暴力恐怖组织，不需要什么证据。鲁比奥还表示，古巴需要新的领导层，以严肃改革实现转型，才能让古巴不再是对华盛顿的威胁。同日媒体报道称，因美国对古巴实施石油禁运政策，古巴国内运输困难，导致联合国拟为古巴提供的2万吨食品无法顺利分发。中方对此有何评论？\n\n“炮制借口、造谣抹黑不能成为美方对古巴野蛮封锁、非法制裁的理由。”毛宁说，美方长期对古巴实施单边制裁封锁，严重冲击古巴经济民生，给古巴人民造成巨大灾难，国际社会普遍反对。\n\n毛宁表示，中方坚定支持古巴维护国家主权和安全，反对外来干涉。“美方应当倾听国际社会呼声，立即全面终止对古巴的封锁制裁和胁迫施压。”(新华社)", "ctime": 1780567514, "time_str": "18:05:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260604/c677223536.shtml"}, {"id": "4462737", "title": 司控股股东中国核电工程有限公司于2026年6月4日通过深交所集中竞价增持公司股份100.51万股，占总股本约0.26%，持股增至36758919股，占9.59%。增持前持股35753819股，占9.33%。中核工程计划自2026年6月4日起6个月内继续增持公司股份，金额不低于人民币2000万元且不高于人民币4000万元，增持比例合计不超过公司总股本的1%。", "ctime": 1780566309, "time_str": "17:45:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260604/c677222789.shtml"}, {"id": "4462485", "title": "天洋新材：涉及半导体业务的光模块透镜固定用胶目前月营收占集团不足1%", "content": "天洋新材公告，公司股票于2026年6月3日、6月4日连续两个交易日内收盘价格涨幅偏离值累计超过20%，构成异常波动。经公司自查并征询控股股东，确认不存在应披露而未披露的重大事项。2026年第一季度实现营业收入1.57亿元，同比下滑28.53%。此外，涉及半导体业务的光模块透镜固定用胶为新开发产品，目前月营收占集团月营收不足1%，不会对公司业绩造成重大影响。", "ctime": 1780566192, "time_str": "17:43:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260604/c677222736.shtml"}, {"id": "4462459", "title": "RCAP亚太机器人世界杯北京中心落户朝阳", "content": "6月2日，RCAP亚太机器人世界杯北京中心在朝阳区中关村（朝阳）AI Space产业园正式揭牌。作为RCAP全球首个区域中心，它将深度整合亚太机器人世界杯的国际赛事体系与技术网络，致力于打造立足北京、连接世界的机器人产业国际化公共服务平台。未来，这里将是中国机器人产业链接全球的“第一站”。（北京发布）", "ctime": 1780566064, "time_str": "17:41:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260604/c677222685.shtml"}, {"id": "4462451", "title": "爱旭ABC组件新签3.75GW订单", "content": "6月3日至5日，第十九届（2026）国际太阳能光伏与智慧能源（上海）大会暨展览会期间，爱旭ABC组件与多家渠道商和海内外合作伙伴新签总计3.75GW订单，其中海外市场贡献3.1GW，国内市场签下650MW。（人民财讯）", "ctime": 1780566021, "time_str": "17:40:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260604/c677222632.shtml"}, {"id": "4462449", "title": "长安汽车：5月销量18.01万辆，同比下降19.71%", "content": "长安汽车公告，5月产量19.51万辆，去年同期19.04万辆，同比增长2.46%；销量18.01万辆，去年同期22.43万辆，同比下降19.71%，其中海外销量73404辆。累计产量86.21万辆，去年同期97.63万辆，同比下降11.70%；累计销量91.69万辆，去年同期112.02万辆，同比下降18.14%。", "ctime": 1780566007, "time_str": "17:40:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "ur // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
