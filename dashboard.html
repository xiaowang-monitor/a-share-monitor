ce": "", "url": "https://news.10jqka.com.cn/20260407/c675797777.shtml"}, {"id": "4192395", "title": "俄外交部警告波罗的海国家：不听劝将被报复", "content": "俄方就波罗的海国家决定对袭击俄罗斯的乌克兰无人机开放领空一事，专门向这些国家发出警告。俄罗斯外交部发言人扎哈罗娃表示：“我们已发出警告。如果他们不听劝告，就会遭到报复。”今年3月底，乌克兰的无人机多次飞入爱沙尼亚领空，但塔林否认允许其飞越该国领空。（参考消息）", "ctime": 1775548627, "time_str": "15:57:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260407/c675797772.shtml"}, {"id": "4192389", "title": "NYMEX取暖油主力合约大涨5%", "content": "NYMEX取暖油主力合约大涨5%，现报4.55美元/加仑。", "ctime": 1775548506, "time_str": "15:55:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260407/c675797728.shtml"}, {"id": "4192385", "title": "伊朗首都响起密集爆炸声", "content": "当地时间7日11时许，新华社记者在伊朗首都德黑兰听到密集爆炸声。伊朗防空系统启动了拦截。(新华社)", "ctime": 1775548485, "time_str": "15:54:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260407/c675797714.shtml"}, {"id": "4192381", "title": "以军称已摧毁伊朗方面130多套防空系统", "content": "当地时间4月7日，以色列国防军称，经过“精准的空袭”，目前已摧毁伊朗方面130多套防空系统。对此，伊朗方面暂无回应。（央视新闻）", "ctime": 1775548470, "time_str": "15:54:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260407/c675797709.shtml"}, {"id": "4192379", "title": "“期限”将至 五角大楼被曝欲打击伊朗军民两用能源设施", "content": "随着美国总统特朗普威胁伊朗的所谓“最后通牒”即将到期，五角大楼6日被曝将伊朗军民两用的能源设施列入打击目标清单。消息称，特朗普如派遣地面部队进入伊朗，恐导致这场本就不受美国民众欢迎的战事进一步持续。特朗普如果选择攻击伊朗民用基础设施，则明显违反国际法，恐招致战争罪指控。为规避这一结果，美国有意效仿以色列，对伊朗军民两用设施下手。要求匿名的两名美国国防部官员称，同时为平民和军队提供燃料和电力的伊朗能源设施可以列为“合法”打击目标。另一名匿名美国官员称，五角大楼内部围绕如何区分军用和民用打击目标争论颇多，比如能否将军民两用的海水淡化厂列为打击目标。 (央视新闻)", "ctime": 1775548461, "time_str": "15:54:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260407/c675797701.shtml"}, {"id": "4192377", "title": "油企负责人：若航道畅通伊拉克原油出口“一周内”可恢复战前水平", "content": "伊拉克国营企业巴士拉石油公司近日表示，如果伊朗战事结束、霍尔木兹海峡航道畅通，伊拉克原油出口“一周内”便可基本恢复至战事爆发前水平。路透社6日援引巴士拉石油公司负责人巴塞姆·阿卜杜勒·卡里姆的话报道，目前，伊拉克南部油田的产量约为日均90万桶，其中巴士拉省的鲁迈拉油田日均产量从战前的约135万桶跌至约40万桶，同省祖拜尔油田从64万桶跌至30万桶；北部基尔库克油田的产量约为日均38万桶。伊拉克财政收入约九成来自原油出口，主要产油区在南部。美国和以色列2月28日对伊朗发动军事打击前，伊拉克油田日产原油约430万桶；日均出口原油约350万桶，主要通过霍尔木兹海峡运出。（新华社）", "ctime": 1775548436, "time_str": "15:53:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260407/c675797684.shtml"}, {"id": "4192375", "title": "伊朗洛雷斯坦省一机场遭空袭", "content": "当地时间7日，伊朗洛雷斯坦省副省长表示，该省霍拉马巴德机场遭到美以空袭。（央视新闻）", "ctime": 1775548416, "time_str": "15:53:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260407/c675797672.shtml"}, {"id": "4192371", "title": "瑞银将6月底黄金价格预测下调至每盎司5200美元", "content": "瑞银将6月底黄金价格预测下调至每盎司5200美元，原因是高波动环境下投资者需求走软。（财联社）", "ctime": 1775548351, "time_str": "15:52:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260407/c675797623.shtml"}, {"id": "4192369", "title": "特斯拉前员工出任小米汽车欧洲交付与物流负责人", "content": "根据原特斯拉中欧地区交付运营高级经理迪特·洛伦茨（Dieter Lorenz）在社交媒体发布的声明，在特斯拉工作六年之后，他已于本月初担任小米汽车欧洲交付与物流负责人。(财联社)", "ctime": 1775548344, "time_str": "15:52:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260407/c675797618.shtml"}, {"id": "4192367", "title": "2025年证券业总资产14.83万亿元 同比增长14.66%", "content": "2025年券商经营业绩分析出炉。根据中证协发布的报告，截至2025年末，全国券商总资产、净资产、净资本分别为14.83万亿元、3.34万亿元、2.44万亿元，同比分别增长14.66%、6.53%、5.27%。2025年，全行业实现营业收入、净利润分别为5411.71亿元、2194.39亿元，同比分别增长19.95%、31.20%，经营质效稳步提升。整体来看，行业资本实力持续增强，整体风控指标优于监管及预警标准。（蓝鲸新闻）", "ctime": 1775548332, "time_str": "15:52:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260407/c675797607.shtml"}, {"id": "4192355", "title": "法国3月服务业PMI终值 48.8，预期 48.3，初值 48.3", "content": "法国3月服务业PMI终值 48.8，预期 48.3，初值 48.3。", "ctime": 1775548230, "time_str": "15:50:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260407/c675797502.shtml"}, {"id": "4192337", "title": "法国外长：反对打击伊朗民用基础设施", "content": "当地时间4月7日，法国外长巴罗表示，法国反对任何针对伊朗民用基础设施的打击。此前，美国总统特朗普曾威胁称，如果伊朗方面不重新开放霍尔木兹海峡，将打击其民用及能源基础设施。巴罗指出，对民用基础设施发动攻击将导致冲突升级，并可能使本已严峻的局势进一步恶化。他警告称，风险在于局势可能演变为无法控制的地区性冲突。他还呼吁尽快恢复霍尔木兹海峡通航，指出该海峡的封锁已对全球经济造成严重影响。（央视新闻）", "ctime": 1775548038, "time_str": "15:47:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260407/c675797441.shtml"}, {"id": "4192323", "title": "伊拉克库区遭无人机袭击致2名平民身亡", "content": "伊拉克库尔德自治区（库区）反恐总局7日发表声明说，一架来自伊朗方向的无人机当天袭击了库区埃尔比勒省的一处民宅，造成2名平民死亡。 声明说，当地时间7日零时15分许，一架装载炸药的无人机击中了埃尔比勒省达拉沙克兰地区的一栋民宅，导致一对夫妇不幸遇难。声明强烈谴责此次袭击，称其违反国际法。 美国和以色列2月28日对伊朗发起大规模军事行动，伊朗对以色列以及美国在中东地区的军事基地等目标发起还击，战事持续至今。(新华社)", "ctime": 1775547768, "time_str": "15:42:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260407/c675797072.shtml"}, {"id": "4192321", "title": "全国服务业大会召开在即 推动服务业扩能提质举措将推出", "content": "国家发展改革委主任郑栅洁此前表示，两会后将召开全国服务业大会，国家发展改革委将会同商务部、工业和信息化部等部门，出台一系列扩能提质举措，充分挖掘服务业高质量发展潜力。“十五五”时期，预计服务业规模将突破100万亿元。近期，促进服务业优质高效发展的信号持续释放。3月16日召开的国务院第十一次全体会议提出，积极谋划推动服务业扩能提质；3月27日召开的国务院常务会议提出，要充分挖掘服务业发展潜力。 (中证金牛座)", "ctime": 1775547757, "time_str": "15:42:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260407/c675797066.shtml"}, {"id": "4192315", "title": "外交部：中方对日方拟修改“防卫装备转移三原则”严重关切", "content": "据报道，日本政府计划于近期修改“防卫装备转移三原则”及其运用指南，为日本向海外出口武器“松绑”。外交部发言人毛宁4月7日在例行记者会上就此答问时表示，中方对此严重关切。毛宁说，种种迹象表明，日本右翼势力正在推动安保政策朝着进攻性、扩张性的方向转变。日本加速“再军事化”是事实和现实，有实际的路线和行动，正在威胁地区的和平稳定，国际社会必须高度警惕，坚决抵制日本“新型军国主义”妄动。“我们敦促日方深刻反省军国主义侵略历史，在军事安全领域恪守承诺、慎重行事，不要在错误的道路上越走越远。”(新京报)", "ctime": 1775547625, "time_str": "15:40:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260407/c675797024.shtml"}, {"id": "4192303", "title": "外交部：尽快停火止战，重启对话是国际社会的共同愿望", "content": "4月7日，外交部发言人毛宁主持例行记者会。有记者就当前中东局势提问，毛宁表示，尽快停火止战，重启对话是国际社会的共同愿望，中方欢迎一切有利于和平的努力，支持巴基斯坦积极开展斡旋，希望有关方面抓住和平的机会，通过对话弥合分歧，尽快平息战争，中方也愿意为此发挥建设性的作用。（央视新闻）", "ctime": 1775547461, "time_str": "15:37:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260407/c675796832.shtml"}, {"id": "4192301", "title": "以军称对伊朗一处石化综合设施实施打击", "content": "以色列国防军当地时间4月7日发表声明称，于6日对伊朗的一处石化综合设施实施了打击，这是伊朗目前少数仍能用于制造炸药和弹道导弹所需材料的设施之一。以军称，6日对伊朗多个地区发动大规模空袭，目标是伊朗关键基础设施。作为此次行动的一部分，以军袭击了位于伊朗设拉子的一家石化综合设施，该设施被伊朗武装部队用于生产硝酸。以军称，通过此次打击增强了对伊朗军事能力的打击程度。此外，以军还打击了伊朗西北部的一处大型弹道导弹发射场，并打死多名武装人员。 (央视新闻)", "ctime": 1775547450, "time_str": "15:37:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260407/c675796828.shtml"}, {"id": "4192295", "title": "沙特与巴林间的法赫德国王大桥恢复通行", "content": "法赫德国王大桥管理局7日在社交媒体上说，法赫德国王大桥上的车辆通行已恢复。 当天早些时候，该机构宣布，因预警平台发布针对沙特阿拉伯东部省的袭击警报，已暂停法赫德国王大桥上的车辆通行。 法赫德国王大桥是连接沙特与巴林的关键通道。(新华社)", "ctime": 1775547363, "time_str": "15:36:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260407/c675796785.shtml"}, {"id": "4192279", "title": "法兰泰克：预计2026年第一季度净利润同比增长54%至74%", "content": "法兰泰克公告，预计2026年第一季度实现净利润为5300万元至6000万元，同比增加1861万元至2561万元，增长54%至74%。公司预计2026年第一季度实现扣除非经常性损益的净利润为5000万元至5800万元，同比增加2087万元至2887万元，增长72%至99%。本期业绩预增，主要得益于公司主营业务物料搬运设备所处行业景气度持续提升。", "ctime": 1775547185, "time_str": "15:33:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260407/c675796725.shtml"}, {"id": "4192277", "title": "鑫科材料：预计2026年第一季度净利润同比增长67.93%至101.52%", "content": "鑫科材料公告，预计2026年第一季度实现归属于母公司股东的净利润为1500万元到1800万元，将增加606.79万元到906.79万元，与上年同期相比增长67.93%至101.52%。预计2026年第一季度实现归属于母公司股东扣除非经常性损益的净利润为1200万元到1500万元，将增加528.98万元到828.98万元，与上年同期相比增长78.83%至123.54%。", "ctime": 1775547181, "time_str": "15:33:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260407/c675796724.shtml"}, {"id": "4192275", "title": "外交部回应中东局势：各方都应当拿出诚意，尽早结束这场本不该发生的战争", "content": "4月7日，外交部发言人毛宁主持例行记者会。会上有记者提问称，目前伊朗战事延宕，双方袭打不断，霍尔木兹海峡封锁引发各方担忧，推动停火、保障航道安全的呼声高涨。过去几天，美伊相互示强，也有消息称双方可能达成停火协议。中方对当前局势怎么看？ 毛宁表示， 当前中东局势仍在恶化，战事还在升级，冲击世界经济和能源安全，国际社会深感担忧。战事爆发以来，中国始终秉持客观、公正、平衡立场，推动停火止战。王毅外长先后同伊朗、以色列、俄罗斯、海湾国家等各方26次通话，中国政府中东问题特使赴地区穿梭斡旋。前不久，中国同巴基斯坦共同提出五点倡议，体现了国际社会促和止战的普遍共识，武力换不来和平，政治解决才是出路。 毛宁表示，伊朗战事的根源在于美国和以色列违反国际法对伊朗发动武力袭击，当务之急是立即停火止战，回到对话谈判的轨道上来，从根本上解决问题，恢复海湾地区的和平稳定。各方都应当拿出诚意，尽早结束这场本不该发生的战争。(环球网)", "ctime": 1775547161, "time_str": "15:32:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260407/c675796716.shtml"}, {"id": "4192267", "title": "清明假期全国口岸日均出入境人员226万人次", "content": "记者4月7日从国家移民管理局获悉，今年清明假期全国边检机关共保障677.9万人次中外人员出入境，日均226万人次，较去年同期增长9.1%；单日出入境通关最高峰出现在4月6日，达233.4万人次。 国家移民局介绍，清明假期期间，港澳台居民出入境329.1万人次，较去年同期增长19.5%；外国人出入境84.3万人次，较去年同期增长20.9%。入境外国人中，适用免签政策入境31.9万人次，较去年同期增长30.7%。此外，共计查验出入境交通运输工具30.7万架（艘、列、辆）次，较去年同期增长13.3%。 据了解，全国边检机关按照国家移民局统一部署，科学预测、及时发布本口岸出入境客流情况，提示广大出入境人员合理安排行程；科学组织勤务，配足执勤警力，针对港澳台居民、海外华人华侨返乡祭祖人数多、老年人多等实际情况，设置专门查验通道，为需要特殊照顾旅客提供帮助；密切部门协作联动，及时疏导客流高峰，确保口岸通关高效顺畅。清明假期，全国口岸出入境安全便捷、井然有序。(新华社)", "ctime": 1775547017, "time_str": "15:30:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260407/c675796650.shtml"}, {"id": "4192265", "title": "伊朗常驻联合国代表：美国承认曾武装伊朗反对派团体", "content": "伊朗常驻联合国代表伊拉瓦尼在致联合国秘书长及安理会的信中，就美国总统特朗普近日承认武装敌对团体反对伊朗一事强调：“这一明确承认，有力证明了伊朗伊斯兰共和国的一贯立场，即美国一直企图将伊朗境内的和平抗议演变为暴力、内乱和流血冲突。”伊拉瓦尼表示，特朗普在4月5日接受采访时公开承认：“在今年1月伊朗发生抗议活动期间，华盛顿武装了伊朗库尔德反对派团体。”伊拉瓦尼称，此类行为符合美国长期以来在中东及其他地区创建、资助和武装恐怖组织的政策，构成了对《联合国宪章》以及国际法基本原则和规则的公然挑衅。（央视新闻）", "ctime": 1775546951, "time_str": "15:29:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260407/c675796619.shtml"}, {"id": "4192259", "title": "外交部：坚决抵制日本新型军国主义的妄动", "content": "4月7日，外交部发言人毛宁主持例行记者会。有记者问，据报道，日本政府本月拟正式修改“防卫装备转移三原则”，请问中方对此有何评论？毛宁表示，很多国际学者和日本有识之士对相关动向深感担忧，认为这标志着战后日本武器出口政策根本转向，严重违背《开罗宣言》《波茨坦公告》《日本投降书》等具有国际法效力文件的规定，严重违背日本宪法和国内既有规范，破坏战后防范日本军国主义死灰复燃的制度性保障。国际社会必须高度警惕，坚决抵制日本“新型军国主义”的妄动。我们敦促日方深刻反省军国主义侵略历史，在军事安全领域恪守承诺、慎重行事，不要在错误的道路上越走越远。(央视新闻)", "ctime": 1775546775, "time_str": "15:26:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260407/c675796547.shtml"}, {"id": "4192253", "title": "外交部：伊朗战事延宕 中方深感关切和担忧", "content": "4月7日，外交部发言人毛宁主持例行记者会。有记者问，特朗普威胁伊朗达成停火协议最后期限是7日20时，请问中方有何评论？毛宁表示，伊朗战事延宕，造成重大人员伤亡和损失，冲击地区国家的安全稳定，影响世界经济和能源安全，中方对此深感关切和担忧。(央视新闻)", "ctime": 1775546569, "time_str": "15:22:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260407/c675796467.shtml"}, {"id": "4192247", "title": "日本拟正式修改武器出口相关限制原则，外交部：中方严重关切", "content": "4月7日，外交部发言人毛宁主持例行记者会。有记者提问，据报道日本政府本月拟正式修改“防卫装备转移三原则”，内容包括：不再仅限出口非战斗用途防卫装备，原则允许出口杀伤性武器；就向冲突中国家出口武器设立例外规定，保留出口空间；不再需要提前向国会报告，仅事后通知。中方对此有何评论? 毛宁表示，中方对此严重关切，很多国际学者和日本有识之士对相关动向深感担忧，认为这标志着战后日本武器出口政策的根本转向，严重违背《开罗宣言》、《波茨坦公告》、《日本投降书》等具有国际法效力文件的规定，严重违背日本宪法和国内既有规范，破坏战后防范日本军国主义死灰复燃的制度性保障。（澎湃新闻）", "ctime": 1775546531, "time_str": "15:22:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260407/c675796447.shtml"}, {"id": "4192229", "title": "特朗普称不担心轰炸民用设施构成战争罪", "content": "当地时间4月6日下午，北京时间今天（4月7日）凌晨，在白宫新闻发布会上，现场记者就美军蓄意袭击民用基础设施是否违反国际法向美国总统特朗普提问，并问特朗普是否担心威胁轰炸发电厂和桥梁会构成战争罪？特朗普不断打断记者的问题，斥责提问记者所在的 析解读了券商2025年度经营情况。中证协称，证券公司积极开展互换便利操作，加大逆周期布局，以实际行动稳市兴市，提振投资者信心，助力资本市场长期健康发展。截至2025年末，互换便利操作金额累计1050亿元，为A股带来增量资金，增强了资本市场内在稳定性。(人民财讯)", "ctime": 1775545836, "time_str": "15:10:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260407/c675795849.shtml"}, {"id": "4192171", "title": "首创期货：海外装置遭遇不可抗力，乙二醇期价强势封涨停", "content": "现货市场，华东乙二醇价格在5710附近商谈，创年内新高，现货基差保持强势。\n供应方面，沙特朱拜勒工业区遭遇袭击影响，乙二醇开工或进一步下降。该地区拥有乙二醇产能580万吨，占沙特总产能的70%以上。此前，沙特一套55万吨和一套70万吨乙二醇装置因原料问题已停车，国内陕西一套60万吨乙二醇装置计划4月15日起停车检修20天。上周华东主港地区MEG库存总量93.5万吨，环比下降1.8万吨。\n需求方面，终端负反馈显现，织造开工下降，聚酯产品库存攀升。聚酯负荷稳中略降，减产时间目前延长至4月底。\n综合看，沙特大型化工园区遇袭，或导致乙二醇开工进一步下调，进口量预期下滑，港口继续去库。预计短期乙二醇期价维持强势，关注地缘局势进展、国内外装置开工变动及成本变动情况。（首创期货）", "ctime": 1775545781, "time_str": "15:09:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260407/c675795811.shtml"}, {"id": "4192165", "title": "福特汽车公司召回422,613辆美国境内车辆", "content": "据美国国家公路交通安全管理局，福特汽车公司召回422,613辆美国境内车辆。(财联社)", "ctime": 1775545737, "time_str": "15:08:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260407/c675795783.shtml"}, {"id": "4192155", "title": "为企业节约54.7亿元 质量基础设施“一站式”服务成效显著", "content": "记者今天了解到，市场监管总局发布统计数据显示：“十四五”期间，市场监管总局大力推动开展质量基础设施“一站式”服务，有机融合计量、标准、认证认可、检验检测等要素资源，全国已建成各类质量基础设施“一站式”服务平台2984个，累计服务企业超520万家次，解决技术难题约38万个，为企业节约费用约54.7亿元，在服务园区经济、区域发展和产业链供应链质量联动提升方面取得积极成效，形成了一系列可复制可推广的服务模式和经验做法。（央视新闻）", "ctime": 1775545709, "time_str": "15:08:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260407/c675795761.shtml"}, {"id": "4192141", "title": "新加坡称不能排除因中东战争发生国内能源供应中断的可能性", "content": "新加坡内政部长K. Shanmugam表示，鉴于中东战乱，如果更多供应商无法提供燃料或天然气，不能排除新加坡发生能源供应中断的可能性。Shanmugam在国会表示，新加坡近期将继续发展太阳能，并寻求电力进口。他周二表示，政府也在评估其他能源，例如核能，以实现能源结构的多元化。（新浪财经）", "ctime": 1775545606, "time_str": "15: // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
