https://news.10jqka.com.cn/20260710/c678092695.shtml"}, {"id": "4694351", "title": "创业板指跌超3%", "content": "创业板指跌超3%，上证指数跌0.36%，深证成指跌1.26%。权重股宁德时代、中际旭创均跌超6%。", "ctime": 1783663733, "time_str": "14:08:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260710/c678092558.shtml"}, {"id": "4694333", "title": "日本逾七成住宿设施劳动力短缺", "content": "日本政府10日就旅游业发布的年度白皮书说，日本逾七成住宿设施面临劳动力短缺问题。据日本共同社报道，日本政府去年12月至今年1月期间对522家住宿设施发起调查，其中72.2%的调查对象报告人手不足。由于老龄化严重且生育率下降，日本各行业普遍存在劳动力短缺问题，其中服务业因薪酬较低而尤为突出。日本政府呼吁住宿业经营者加大技术投资，引进自助入住系统、送餐机器人等以缓解人手不足的压力。（新华社）", "ctime": 1783663595, "time_str": "14:06:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260710/c678092483.shtml"}, {"id": "4694197", "title": "深证成指跌1%", "content": "深证成指跌幅扩大至1%，上证指数跌0.24%，创业板指跌2.66%。", "ctime": 1783663303, "time_str": "14:01:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260710/c678092372.shtml"}, {"id": "4694191", "title": "Kimi首张AI原生信用卡敲定美国运通、农业银行，未来将探索智能体支付", "content": "7月10日，《每日经济新闻》记者独家获悉，全球首张AI（人工智能）原生信用卡“Kimi信用卡”合作方已经敲定美国运通、农业银行，并将于当日正式对外发行。（每日经济新闻）", "ctime": 1783663285, "time_str": "14:01:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260710/c678092370.shtml"}, {"id": "4694127", "title": "富时中国A50指数期货跌1%", "content": "富时中国A50指数期货跌幅扩大至1%。", "ctime": 1783663244, "time_str": "14:00:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260710/c678092364.shtml"}, {"id": "4694093", "title": "美联储推进货币政策改革机制", "content": "美国联邦储备委员会9日发布公告，公布了最近所设5个独立工作组的负责人名单和工作目标，以改进货币政策执行情况。 公告说，这5个工作组将审视美联储在政策制定关键领域的做法，工作组负责人包括知名学者、前央行官员和企业高管。5个工作组将分别围绕货币政策沟通、资产负债表政策、经济数据、生产力与就业、通胀框架展开评估。 美联储主席凯文·沃什当天说，每个工作组将仔细考虑政策制定者的手段和方法、分析工具以及政策路径是否可以改进，目标是让美联储能够尽可能地实现维持物价稳定和最大程度就业的目标。 沃什在6月17日货币政策会议后的记者会上宣布，美联储将设立5个独立工作组以推进其改革议程。按照此前计划，各工作组将于今年年底提交相关领域的研究报告。 分析人士表示，沃什此次广泛引入非美联储背景人士加入相关工作组，显示出美联储此轮调整不仅着眼于货币政策制定机制，还关注人工智能、生产力提升、数据质量等议题，此举或将对美联储产生重要影响。由于美国货币政策对全球经济具有外溢效应，美联储下一步的改革方向受到全球资本市场密切关注。(新华社)", "ctime": 1783663228, "time_str": "14:00:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260710/c678092361.shtml"}, {"id": "4694021", "title": "比利时首相称美对伊打击非北约议题", "content": "当地时间7月8日，比利时首相巴尔特·德韦弗在土耳其安卡拉出席北约峰会时表示，北约无法与美国就对伊朗的军事打击达成一致，该议题实际上并不是北约的议题，也无助于北约团结。德韦弗指出，《北大西洋公约》中集体防御条款规定成员国遭攻击时共同防御，但并未规定当一方单方面决定攻击别国时，其他所有成员国都必须参与其中。德韦弗称，这不符合北约的精神，且期待北约盟友参与此类行动“不合理”。(CCTV国际时讯)", "ctime": 1783662945, "time_str": "13:55:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260710/c678092275.shtml"}, {"id": "4693995", "title": "沪深京三市成交额超2.7万亿元，较上日此时放量4935亿元", "content": "据同花顺iFinD数据，沪深京三市成交额超2.7万亿元，较上日此时放量4935亿元，预计全天成交金额约3.6万亿元。截至目前，沪市成交额12417亿元，深市成交额14416亿元，北证50成交额178亿元。", "ctime": 1783662656, "time_str": "13:50:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260710/c678092207.shtml"}, {"id": "4693989", "title": "中印尼举行第十轮外交政策磋商", "content": "2026年7月9日，外交部政策规划司司长陈松同印度尼西亚外交部外交政策战略局局长穆罕默德举行第十轮中印尼外交政策磋商。双方重点就国际形势、亚太地区形势、各自外交政策及其他共同关心的问题深入交换了意见。(外交部)", "ctime": 1783662593, "time_str": "13:49:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260710/c678092164.shtml"}, {"id": "4693961", "title": "创业板指午后跌超2%，早盘一度涨超1%", "content": "创业板指午后跌超2%，早盘一度涨超1%，上证指数跌0.03%，深证成指跌0.56%。电子化学品、半导体、培育钻石、证券板块跌幅居前。", "ctime": 1783662435, "time_str": "13:47:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260710/c678092021.shtml"}, {"id": " 24.shtml"}, {"id": "4693761", "title": "航天装备板块持续走强，多支卫星ETF逼近涨停", "content": "航天装备板块持续走强，中国卫星、中国卫通等涨停。卫星ETF广发（512630）、卫星ETF易方达（563530）、卫星ETF鹏华（563790）等多支ETF逼近涨停。消息面上，据新华社报道，长征十号乙运载火箭在海南商业航天发射场发射升空，将卫星顺利送入预定轨道。火箭一二级分离后，一子级垂直返回，在海上回收平台通过网系捕获方式回收，发射及一子级回收任务取得圆满成功。此次任务是我国首次成功实施运载火箭一子级可控回收，标志着我国重复使用火箭技术取得重大突破。", "ctime": 1783660808, "time_str": "13:20:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260710/c678091514.shtml"}, {"id": "4693727", "title": "长征十号乙首飞成功 我国运载火箭首次实现可控回收", "content": "2026年7月10日，长征十号乙运载火箭在海南商业航天发射场发射升空，将卫星顺利送入预定轨道。火箭一二级分离后，一子级垂直返回，在海上回收平台通过网系捕获方式回收，发射及一子级回收任务取得圆满成功。此次任务是我国首次成功实施运载火箭一子级可控回收，标志着我国重复使用火箭技术取得重大突破。（新华社）", "ctime": 1783660517, "time_str": "13:15:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260710/c678091458.shtml"}, {"id": "4693673", "title": "沪深京三市成交额超2.3万亿元，较上日此时放量5117亿元", "content": "据同花顺iFinD数据，沪深京三市成交额超2.3万亿元，较上日此时放量5117亿元，预计全天成交金额约3.7万亿元。截至目前，沪市成交额10622亿元，深市成交额12245亿元，北证50成交额145亿元。", "ctime": 1783660019, "time_str": "13:06:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260710/c678091332.shtml"}, {"id": "4693639", "title": "科创50指数跌幅扩大至1%，早盘一度涨超2%", "content": "科创50指数跌幅扩大至1%，早盘一度涨超2%，现报2163.75点。", "ctime": 1783659881, "time_str": "13:04:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260710/c678091291.shtml"}, {"id": "4693627", "title": "创业板指午后跌超1%，早盘一度涨超1%", "content": "创业板指午后跌超1%，早盘一度涨超1%。", "ctime": 1783659820, "time_str": "13:03:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260710/c678091282.shtml"}, {"id": "4693609", "title": "商业航天板块午后拉升，海兰信20cm涨停", "content": "商业航天板块午后拉升，海兰信20cm涨停，佳缘科技、信科移动、电科蓝天、星图测控多股直线拉升 南部、福建东北部等地有大到暴雨，局地大暴雨至特大暴雨。经应急管理部与自然资源部联合会商研判，浙江东南部、福建东北部发生地质灾害的风险高。应急管理部要求，受台风“巴威”影响的相关地区要切实做好地质灾害防范应对工作，压实地方防范应对主体责任，加强部门协同联动工作机制，密切监视雨情汛情和地质灾害灾情险情，加强会商研判和预警响应联动，预置前置救援力量、物资、装备，强化巡查排查和监测预警，坚决果断组织转移避险，确保应转尽转、应转早转，最大限度避免人员伤亡。（新华社）", "ctime": 1783658746, "time_str": "12:45:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260710/c678091119.shtml"}, {"id": "4693553", "title": "OpenAI推出GPT-5.6系列模型", "content": "美国开放人工智能研究中心（OpenAI）9日宣布，正式推出GPT-5.6系列模型，从即日起在ChatGPT、Codex和OpenAI API中逐步开放使用。该公司在官网发布的声明中说，GPT-5.6系列包括三个模型版本：旗舰模型Sol、适配日常办公的均衡型模型Terra，以及速度最快、成本最低的模型Luna。根据声明，GPT-5.6新增“max”和“ultra”等能力设置。前者可让模型投入更多时间进行推理，探索替代方案，检查并修正方法；后者则默认协调四个智能体并行处理复杂任务，以更高的词元使用量换取更强结果并缩短高难度任务的完成时间。（新华社）", "ctime": 1783658732, "time_str": "12:45:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260710/c678091090.shtml"}, {"id": "4693549", "title": "美机构说厄尔尼诺现象将持续增强并可能延续至明年", "content": "美国国家海洋和大气管理局下属的国家气象局气候预测中心9日发布分析报告说，厄尔尼诺现象将持续增强至今年年底并有极大概率持续至2027年初春。报告说，过去一个月，赤道太平洋中部和东部海表温度持续升高，海洋和大气耦合特征表明厄尔尼诺现象正在增强。最新的每周尼诺3.4区海表温度指数为正1.2摄氏度，表明该区域海表温度较常年同期偏高1.2摄氏度。报告说，厄尔尼诺现象预计将在今年下半年继续增强，并有97%的概率持续至2027年初春。今年10月至12月出现强厄尔尼诺事件的概率为81%，其强度可能跻身1950年以来最强厄尔尼诺事件之列。（央视新闻）", "ctime": 1783658603, "time_str": "12:43:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260710/c678091066.shtml"}, {"id": "4693541", "title": "马来西亚棕榈油局MPOB：马来西亚6月棕榈油出口为1204013吨 环比增长6.19%", "content": "据马来西亚棕榈油局MPOB，马来西亚6月棕榈油出口为1204013吨，环比增长6.19%；6月棕榈油进口为103113吨，环比增长135.33%；6月棕榈油产量为1638777吨，环比增长8.08%；6月棕榈油库存量为2544066吨，环比增长4.78%。", "ctime": 1783658163, "time_str": "12:36:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260710/c678091014.shtml"}, {"id": "4693513", "title": "“全球南方人工智能能力建设”边会关注弥合智能鸿沟", "content": "在日内瓦举 const META     = {"update_time": "2026-07-10 14:59:30", "sentiment_score": 60.14492753623188, "agents": []};

// 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');

    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';

  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
