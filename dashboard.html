.down { color: var(--green); }
.pulse { animation: pulse 2s infinite; }
@keyframes pulse {

  50% { opacity: 0.5; }

 1787209261, "time_str": "15:01:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260820/c679130817.shtml"}, {"id": "4992165", "title": "期货收评：美财政部回购国债救市引爆贵金属！沪银涨超4%", "content": "期货收评：大宗商品以上涨为主，沪银、铂涨超4%，沪金、沥青、菜油、钯涨超2%；跌幅方面，低硫燃油、铁矿跌超1%。", "ctime": 1787209253, "time_str": "15:00:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260820/c679130816.shtml"}, {"id": "4992149", "title": "欧股开盘涨跌不一", "content": "德国DAX指数跌0.14%，英国富时100指数涨0.14%，法国CAC40指数跌0.09%，欧洲斯托克50指数跌0.37%，意大利富时MIB指数跌0.75%。", "ctime": 1787209236, "time_str": "15:00:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260820/c679130814.shtml"}, {"id": "4992125", "title": "股指期货午盘收盘 主力合约全线收涨", "content": "股指期货午盘收盘，主力合约全线收涨。沪深300股指期货(IF)主力合约涨0.24%，上证50股指期货(IH)主力合约涨0.15%，中证500股指期货(IC)主力合约涨0.73%，中证1000股指期货(IM)主力合约涨0.76%。", "ctime": 1787209222, "time_str": "15:00:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260820/c679130810.shtml"}, {"id": "4992117", "title": "上海市调整商业性个人住房贷款最低首付比例政策", "content": "中国人民银行上海市分行联合国家金融监督管理总局上海监管局印发《关于调整上海市商业性个人住房贷款最低首付比例政策的通知》，对上海市商业性个人住房贷款政策作出以下调整：优化个人住房信贷政策，调整二套房贷款首付比例下限。对购买外环外（包括原实施差异化政策区域）住房的，二套住房商业性个人住房贷款最低首付比例调整为15%，其他区域为25%。银行业金融机构应根据本通知规定的下限要求，结合本机构经营状况、客户风险状况等因素，合理确定每笔贷款的具体首付比例水平。在具体实施中，各家银行需充分考虑在途交易等因素，切实便民利民。本通知自2026年8月21日起施行。(中国人民银行上海总部)", "ctime": 1787209183, "time_str": "14:59:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260820/c679130801.shtml"}, {"id": "4992097", "title": "中国保险行业协会养老保险专业委员会召开二季度交流座谈会", "content": "近日，中国保险行业协会养老保险专业委员会在京召开二季度交流座谈会。会议邀请了相关研究机构、理财公司专家及部分专委会委员代表，聚焦第三支柱个人养老金和商业养老金业务的发展实践及评价体系等作主题发言，分享前沿研究成果与实务经验。与会委员单位代表围绕“商业养老保险产品与服务创新”主题展开了深入研讨和广泛交流。（人民财讯）", "ctime": 1787209015, "time_str": "14:56:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260820/c679130755.shtml"}, {"id": "4992073", "title": "沪深京三市成交额超2万亿元，较上日此时缩量4327亿元", "content": "据同花顺iFinD数据，沪深京三市成交额超2万亿元，较上日此时缩量4327亿元，预计全天成交金额约2.1万亿元。截至目前，沪市成交额9748亿元，深市成交额10116亿元，北证50成交额138亿元。", "ctime": 1787208680, "time_str": "14:51:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260820/c679130686.shtml"}, {"id": "4992031", "title": "英矽智能与元码智药达成研发合作 布局下一代mRNA肿瘤疫苗", "content": "英矽智能8月20日宣布，与专注于下一代RNA创新药研发的元码智药（Byterna Therapeutics）正式达成研发合作。双方将围绕AI新抗原预测与序列设计、环状mRNA、靶向递送、自动化实验及智能制造，共建下一代mRNA AI原生研发引擎，探索个体化肿瘤疫苗及相关创新疗法。（人民财讯）", "ctime": 1787208309, "time_str": "14:45:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260820/c679130553.shtml"}, {"id": "4992023", "title": "消息称三星电子计划扩大平泽在建晶圆厂项目", "content": "三星电子已向有关部门正式提交规划修正案，计划将其平泽园区的两座新晶圆厂项目从此前的2层4洁净室扩大至3层6洁净室。三星电子平泽新晶圆厂通常被称为P5一号与二号，有时也会被称为P5与P6。与此前的平泽P4类似，这两座晶圆厂也将成为多功能半导体生产设施，根据市场需求将洁净室灵活用于存储或逻辑芯片制造。(科创板日报)", "ctime": 1787208088, "time_str": "14:41:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260820/c679130499.shtml"}, {"id": "4992021", "title": "余承东：鸿蒙智行累计交付150万台", "content": "8月20日，华为常务董事、终端BG董事长余承东在鸿蒙智行全场景发布会上表示，截至目前，鸿蒙智行累计交付150万台车。（人民财讯）", "ctime": 1787208027, "time_str": "14:40:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260820/c679130491.shtml"}, {"id": "4991985", "title": "韩国二季度外国投资者金融持仓创历史最大增幅", "content": "韩国央行周四公布数据显示，受本土股市上涨推动，二季度外国投资者在韩国的金融持仓规模创下有史以来最大增幅，达到历史新高。韩国央行初步数据显示，截至6月末，外国投资存量规模达3.02万亿美元，较三个月前增加8912亿美元。这是该数值首次突破3万亿美元关口，也是韩国央行自1994年开始统计该项数据以来最大的季度环比增幅。非居民证券投资增加8593亿美元，达到2.33万亿美元；直接投资增加4亿美元，至3211亿美元。(21财经)", "ctime": 1787207721, "time_str": "14:35:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260820/c679130410.shtml"}, {"id": "4991919", "title": "日韩股市集体收涨", "content": "日经225指数收涨1.36%，报66216.79点。韩国综指收涨5.89%，报6852.58点。", "ctime": 1787207516, "time_str": "14:31:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260820/c679130374.shtml"}, {"id": "4991877", "title": "南网能源数字服务公司与正泰新能源签署战略合作协议", "content": "据南网能源公司消息，8月18日，南网能源旗下南网综能数字服务（广州）有限公司（简称“南网能源数字服务公司”）与浙江正泰新能源开发有限公司(简称“正泰新能源”)签署战略合作协议，双方正式建立长期、稳定、共赢的战略合作伙伴关系。双方将围绕新能源运营效率提升、技术创新等方面开展全面务实合作，建立深化合作机制，联合拓展新能源运营服务市场。(人民财讯)", "ctime": 1787207428, "time_str": "14:30:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260820/c679130348.shtml"}, {"id": "4991847", "title": "山东：鼓励医药企业通过兼并重组实现规模化发展", "content": "《山东省医药工业“十五五”发展行动方案（征求意见稿）》公开征求意见。其中提到，着力培育10家以上省级现代医药标志性产业链链主企业，构建“创新药龙头引领、细分赛道优势互补”的产业生态。鼓励链主企业做大做强，鼓励企业通过兼并重组、战略合作实现规模化、集约化发展，提升生态主导力与核心竞争力。发挥链主企业在技术、资本、品牌、市场等方面的优势，牵头组建创新联合体，梳理产业链关键共性技术目录，引领上下游企业协同攻关。推动链主企业开放供应链、创新链资源，带动中小企业融通发展，形成龙头引领、链条协同、集群共进的发展格局，巩固医药产业规模领先优势。（人民财讯）", "ctime": 1787207059, "time_str": "14:24:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260820/c679130263.shtml"}, {"id": "4991839", "title": "山东：重点发展针对治疗恶性肿瘤、血液病等的抗体药物", "content": "山东省公开征求意见的《医药工业“十五五”发展行动方案》提出，聚焦重大传染病、呼吸道感染、恶性肿瘤、耐药感染、自身免疫、代谢系统、中枢神经系统等疾病，加快发展单克隆抗体药物、双特异性抗体、三特异性抗体、抗体偶联药物、重组蛋白、细胞与基因治疗药物、创新疫苗以及海洋生物药等重点领域，推动核心技术攻关，加速产业化进程。其中，重点发展针对治疗恶性肿瘤、血液病、自身免疫疾病、代谢性疾病、眼科疾病、神经系统用药、心血管疾病和抗感染性疾病等的抗体药物。（人民财讯）", "ctime": 1787206979, "time_str": "14:22:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260820/c679130242.shtml"}, {"id": "4991815", "title": "基辅拉响防空警报 乌称袭击已致12人死亡", "content": "当地时间20日，乌克兰首都基辅市拉响防空警报。基辅市长克利奇科20日通报，截至目前基辅市遭袭已造成12人死亡，遭袭现场救援工作仍在继续。他同时宣布，8月21日为哀悼日，以悼念俄罗斯对基辅市发动大规模袭击的遇难者。基辅市所有市属建筑将降半旗，当天基辅市将禁止举行任何娱乐活动。（央视新闻）", "ctime": 1787206820, "time_str": "14:20:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260820/c679130201.shtml"}, {"id": "4991807", "title": "《牛来》票房破3000万", "content": "据灯塔专业版实时数据，截至8月20日14时6分，影片《牛来》票房破3000万。", "ctime": 1787206677, "time_str": "14:17:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260820/c679130128.shtml"}, {"id": "4991787", "title": "伊朗外长：美为转移自身财政问题而对伊进行新一轮经济威胁", "content": "当地时间20日，伊朗外交部长阿拉格齐在社交媒体就美国针对伊朗的新一轮经济威胁作出回应。阿拉格齐表示，有关对伊朗“启动经济行动”的威胁，意在转移美国国内对财政问题的关注，包括高额债务和利息支出上升等。他称，继续坚持此前针对伊朗的相关政策，只会带来更多失败，并加剧伊朗民众对美方的不满。当地时间8月19日，美国总统特朗普在其社交媒体平台“真实社交”发文称，伊朗未能抓住达成协议的机会，因此他宣布对伊朗采取“针对任何国家实施过的最严厉经济行动”，称这将是一场规模空前的“经济战和经济孤立”。（央视新闻）", "ctime": 1787206548, "time_str": "14:15:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260820/c679130099.shtml"}, {"id": "4991785", "title": "俄太平洋舰队进行导弹射击演习", "content": "8月20日，俄罗斯国防部发布消息称，俄太平洋舰队在计划内演习中对南千岛群岛（日本称“北方四岛”）沿岸附近的靶标实施了导弹打击。演习中，靶标模拟了距离超过300公里的假想敌舰艇。近卫巡洋舰“瓦良格”号发射了两枚“火山”反舰导弹，核动力潜艇“鄂木斯克”号发射了“花岗岩”巡航导弹。与此同时，来自千岛群岛的“堡垒”岸防系统用“缟玛瑙”导弹进行了打击。(央视新闻)", "ctime": 1787206542, "time_str": "14:15:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260820/c679130097.shtml"}, {"id": "4991783", "title": "海力士发布下一代CPO路线图：CPO将延伸至内存接口", "content": "8月20日，SK海力士与弗吉尼亚大学等机构的研究人员在顶级科学期刊《自然·电子学》（Nature Electronics）联合发表论文，系统阐述了共封装光学（CPO）技术在高性能计算与AI领域的发展路线图。这是SK海力士首次在该级别期刊公开其AI互联架构的技术蓝图。（新浪财经）", "ctime": 1787206489, "time_str": "14:14:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260820/c679130085.shtml"}, {"id": "4991767", "title": "特朗普：预计年内会见金正恩，时间可能选在11月", "content": "美国总统特朗普19日在白宫对媒体表示，他预计今年晚些时候将会见朝鲜领导人金正恩。特朗普当天视察了正在白宫南草坪新建的直升机停机坪工地。被问及今秋是否会与金正恩会晤时，特朗普作出肯定回答，并称“非常了解金正恩”，“同他相处得很好”。（新华社）", "ctime": 1787206309, "time_str": "14:11:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260820/c679130057.shtml"}, {"id": "4991567", "title": "阿根廷举行第四届拉美中国研究大会", "content": "第四届拉美中国研究大会19日在阿根廷拉普拉塔国立大学举行。本次会议主题为“构建人类命运共同体：中国与拉丁美洲对当代全球治理挑战的破解之道”，来自17个国家的近250名专家学者围绕人工智能、能源转型、可持续发展、全球治理变革等议题进行研讨。（新华社）", "ctime": 1787205726, "time_str": "14:02:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260820/c679129897.shtml"}, {"id": "4991335", "title": "粮食概念板块冲高，京粮控股涨超7%", "content": "粮食概念板块冲高，京粮控股涨超7%，此前一度跌停，秋乐种业、康农种业纷纷上扬。", "ctime": 1787205547, "time_str": "13:59:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260820/c679129847.shtml"}, {"id": "4991331", "title": "京东曹鹏：具身智能需要解决高质量具身数据不足的问题", "content": "在2026世界机器人大会主论坛，京东集团技术委员会主席、京东云总裁曹鹏表示，全球具身智能正在进入规模化落地的元年。但在规模化部署背后，行业仍然面临数据这一核心瓶颈。当前可用的高质量具身数据，大多还停留在数十万小时级别；而要支撑通用具身模型走向成熟，行业所需的数据量级将超过1000万小时。真实场景交互数据获取难、成本高；数据多样性不足，限制模型泛化能力；不同机器人本体之间还存在数据孤岛。所以，具身智能的竞争，表面上是模型能力的竞争，本质上是数据规模、数据质量和数据体系化能力的竞争。（科创板日报）", "ctime": 1787205517, "time_str": "13:58:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260820/c679129843.shtml"}, {"id": "4991323", "title": "游戏科学发布《黑神话：钟馗》15分钟实机演示视频", "content": "《黑神话：悟空》开发商游戏科学发布新作《黑神话：钟馗》15分钟实机演示视频，从视频内容来看，本作依然为角色扮演类动作游戏，战斗方式为单手剑及火法、雷法、召唤等类型攻击。同日，游戏科学创始人、CEO 冯骥在微博发文称，借《黑神话：钟馗》的实机操作视频公开契机，整理了游戏科学内部的一些工作原则，包括“首先打动自己”“再找外部交集”“发现亮点，先于消灭缺陷”等十条内容。目前，该作尚未公布正式发售日期。（南方财经）", "ctime": 1787205440, "time_str": "13:57:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260820/c679129828.shtml"}, {"id": "4991319", "title": "上海市体育发展“十五五”规划：发展体育赛事经济", "content": "上海市体育局印发《上海市体育发展“十五五”规划》，其中提出，发展体育赛事经济。提升文商旅体展融合发展质效，打造带动百万人群参与的现象级赛事活动。优化商业运作模式，建立以市场为导向的资源配置机制，用好“赛前1小时、赛后2小时”黄金消费时段，围绕“Z世代”人群、银发人群、入境人群等推出一批个性化赛事产品与消费场景，构建全人群友好的赛事经济生态。鼓励职业体育俱乐部培育基于地域认同的球队文化，形成高黏性职业赛事消费模式。拓展赛事商业开发，推动赛事文创产品和数字藏品开发，激活赛事衍生品消费。（人民财讯）", "ctime": 1787205361, "time_str": "13:56:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260820/c679129812.shtml"}, {"id": "4991297", "title": "华创云信等在北京新设股权投资基金", "content": "企查查APP显示，近日，北京华创新智股权投资基金合伙企业（有限合伙）成立，经营范围包含：私募股权投资基金管理、创业投资基金管理服务。企查查股权穿透显示，该企业由华创云信等共同出资。（人民财讯）", "ctime": 1787205189, "time_str": "13:53:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260820/c679129775.shtml"}, {"id": "4991287", "title": "神龙汽车科技（武汉）有限公司正式成立", "content": "8月20日，神龙汽车科技（武汉）有限公司（简称“神龙科技”）成立大会在武汉经开区举行。东风汽车、Stellantis集团、长江产业集团、武汉金控集团、武汉经开产投集团、神龙汽车六方共同出资超80亿元设立的神龙科技正式成立。新公司的业务布局覆盖整车研发、工业化投资、新能源汽车整车销售等多元领域，首期规划4款全新新能源车型，自2027年起陆续投放，涵盖纯电与插混技术路线，满足硬派越野、城市通勤、家庭出行等多元场景。(人民财讯)", "ctime": 1787205055, "time_str": "13:50:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260820/c679129745.shtml"}, {"id": "4991273", "title": "中白“神鹰-2026”空降兵联训转入综合演练阶段", "content": "近日，中国与白俄罗斯“神鹰-2026”空降兵联合训练在中国空军某训练中心有序推进。目前，两军参训官兵已完成基础强训、协同精训阶段任务，自昨天起转入综合演练阶段。前期训练中，两军官兵采取混合编组、互学互鉴模式，围绕既定课目开展专攻精练，规范协同流程、磨合战术打法，稳步夯实联合反恐作战能力基础。在综合演练阶段，双方将紧扣实战背景，开展全要素综合演练，重点锤炼两军联合指挥、协同行动的实战本领，持续深化两军务实合作，共同提升遂行联合反恐任务能力。（央视新闻）", "ctime": 1787204877, "time_str": "13:47:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260820/c679129673.shtml"}, {"id": "4991269", "title": "俄国防部称俄军对基辅目标实施大规模打击", "content": "当地时间8月20日，俄罗斯国防部通报称，当日凌晨，俄联邦武装力量使用陆基、空基、海基高精度武器以及远程无人机，对乌克兰基辅市及基辅州的军事工业企业、交通物流中心和仓库实施了大规模打击。（央视新闻）", "ctime": 1787204835, "time_str": "13:47:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260820/c679129618.shtml"}, {"id": "4991203", "title": "美军更新伊朗战事伤亡数据 18死757伤", "content": "美国国防部当天更新的美军伤亡统计显示，自2月28日美国对伊朗采取军事行动以来，美军已有18人死亡、757人受伤。报道说，美“国防伤亡分析系统”中曾有4名死亡人员和数十名受伤人员从统计中消失后又恢复，引发媒体和议员质疑。美国国防部在社交媒体回应称，这是由于“临时数据中断”。此外，就五角大楼在整个伊朗战事期间披露伤员信息迟缓一事，官方解释称这是“安全需要”。美国总统特朗普19日在白宫对媒体表示，可能在“某个时候”恢复与伊朗的谈判。（新华社）", "ctime": 1787204390, "time_str": "13:39:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260820/c679129460.shtml"}, {"id": "4991199", "title": "半导体材料板块持续走低，沪硅产业跌超8%", "content": "半导体材料板块持续走低，沪硅产业跌超8%，西安奕材、有研硅、有研新材、凯德石英等跟跌。", "ctime": 1787204388, "time_str": "13:39:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260820/c679129458.shtml"}, {"id": "4991183", "title": "现货黄金失守4480美元/盎司", "content": "现货黄金失守4480美元/盎司，日内跌0.94%。", "ctime": 1787204100, "time_str": "13:35:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260820/c679129344.shtml"}, {"id": "4991181", "title": "2026世界动力电池大会将于9月3日至4日在四川宜宾举办", "content": "8月20日，省政府新闻办在四川新闻发布厅举行新闻发布会。会上，省政府副秘书长田成川介绍，世界动力电池大会是经国家批准，由四川省人民政府主办的全国唯一、具有世界影响力的动力电池产业国际性会议。经国务院批准，2026世界动力电池大会将于9月3日至4日在四川省宜宾市举办。大会围绕行业政策、前沿技术、创新应用、新型储能、电池回收等设置8个专题会议，聚焦关键技术、产业转型开展深度对话，将发布《动力电池产业发展指数（2026）》《动力电池技术路线图》、2026年动力电池领域创新技术等成果。（四川发布）", "ctime": 1787204087, "time_str": "13:34:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260820/c679129342.shtml"}, {"id": "4991175", "title": "以防长称埃尔多安正将土耳其“拖入叙利亚的危险冒险中”", "content": "当地时间20日，以色列国防部长卡茨发表声明，指责土耳其总统埃尔多安正将土耳其“拖入叙利亚的危险冒险中”。卡茨表示，“对埃尔多安来说，最好是继续在土耳其议会发表针对以色列的空洞、妄想的演讲，而不是来试探以色列自卫的决心。”卡茨称，以色列绝不允许任何国家和组织威胁其安全。土耳其方面对此暂未回应。（央视新闻）", "ctime": 1787204007, "time_str": "13:33:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260820/c679129326.shtml"}, {"id": "4991049", "title": "伊朗大使：欢迎俄罗斯帮助伊朗与海湾国家改善关系", "content": "伊朗驻俄罗斯大使卡齐姆·贾拉利在20日的采访中表示，伊朗赞赏俄罗斯提出协助伊朗与海湾国家开展对话的想法，并准备就此与俄方合作。贾拉利在采访中说：“我们高度评价俄罗斯为改善伊朗与邻国关系所起的作用和所作的努力，并积极看待此事……我们欢迎俄罗斯朋友为改善伊朗与邻国关系发挥任何作用，我们已准备好就此开展合作。”贾拉利说，伊朗认为俄罗斯是在困难时期真正的朋友，伊朗毫不怀疑俄方的善意。此前，俄外交部副部长亚历山大·阿利莫夫接受采访时说，俄罗斯愿意为伊朗与阿拉伯国家化解分歧提供助力，乐于为双方开展对话搭建平台。（央视新闻）", "ctime": 1787203762, "time_str": "13:29:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260820/c679129262.shtml"}, {"id": "4991009", "title": "险资投资信托存量规模跌破万亿元 已连续5年下降", "content": "近日，记者从业内获悉的调研数据显示，截至2025年末，保险资金配置的信托计划存量规模降至8000亿元左右，同比减少超两成。险资配置信托计划存量规模，2021年首次出现负增长，到2025年已连续5年收缩。最新规模降至万亿元以下，也是2017年以来的首次。（人民财讯）", "ctime": 1787203498, "time_str": "13:24:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260820/c679129186.shtml"}, {"id": "4990989", "title": "沪深京三市成交额超1.5万亿元，较上日此时缩量3034亿元", "content": "据同花顺iFinD数据，沪深京三市成交额超1.5万亿元，较上日此时缩量3034亿元，预计全天成交金额约2.1万亿元。截至目前，沪市成交额7339亿元，深市成交额7567亿元，北证50成交额102亿元。", "ctime": 1787203194, "time_str": "13:19:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260820/c679129127.shtml"}, {"id": "4990965", "title": "SK海力士与工会就薪酬和奖金达成初步协议", "content": "SK海力士与工会就薪酬和奖金达成初步协议。消息人士称， SK海力士员工奖金将以现金形式发放40%，剩余60%将配发公司股票。（财联社）", "ctime": 1787202985, "time_str": "13:16:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news. const SECTORS  = [{"name": "金融", "hit_count": 32, "etfs": []}, {"name": "数据要素", "hit_count": 24, "etfs": []}, {"name": "医药", "hit_count": 23, "etfs": []}, {"name": "人工智能", "hit_count": 21, "etfs": []}, {"name": "机器人", "hit_count": 14, "etfs": []}, {"name": "半导体", "hit_count": 13, "etfs": []}, {"name": "军工", "hit_count": 12, "etfs": []}, {"name": "消费", "hit_count": 12, "etfs": []}];
const META     = {"update_time": "2026-08-20 15:23:06", "sentiment_score": 56.053811659192824, "agents": []};

// 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
