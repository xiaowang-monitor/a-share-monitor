ock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260529/c677074027.shtml"}, {"id": "4424727", "title": "阿里云开源百炼CLI，Agent可调用全套模型和应用能力", "content": "阿里云百炼核心能力已CLI化，一行命令可让Agent自动接入阿里云百炼的150多款模型、十多款应用，以及知识库、记忆、联网搜索等能力。百炼CLI专为Agent设计，原生支持Claude Code、Qoder、OpenClaw、Hermes Agent等主流AI Agent框架，目前已在Github开源（modelstudioai/cli）。（科创板日报）", "ctime": 1780037735, "time_str": "14:55:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260529/c677074002.shtml"}, {"id": "4424723", "title": "港股智谱快速跳水，涨幅收窄至5%", "content": "港股智谱快速跳水，涨幅收窄至5%，此前一度涨超23%。", "ctime": 1780037691, "time_str": "14:54:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260529/c677073988.shtml"}, {"id": "4424717", "title": "神舟二十二号载人飞船顺利撤离空间站组合体", "content": "北京时间2026年5月29日14时44分，神舟二十二号载人飞船与空间站组合体成功分离。分离前，神舟二十一号航天员乘组在地面人员的配合下，完成了空间站组合体状态设置、实验数据整理下传、留轨物资清理转运等撤离前各项工作，与神舟二十三号乘组完成了工作交接和在轨工作经验交流。后续，神舟二十二号载人飞船返回舱将在地面指令控制下择机再入返回，在中国空间站出差的航天员张陆、武飞、张洪章即将踏上回家之旅。（央视新闻）", "ctime": 1780037605, "time_str": "14:53:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260529/c677073871.shtml"}, {"id": "4424701", "title": "商务部召开树立和践行正确政绩观学习教育推进会", "content": "5月28日，商务部召开树立和践行正确政绩观学习教育推进会，深入学习贯彻习近平总书记重要讲话和重要指示精神，贯彻落实党中央部署要求，盘点工作进展、交流经验做法、查找差距不足，推动学习教育走深走实。部党组书记、部长王文涛出席会议并讲话。党组成员出席会议。会议指出，学习教育开展以来，商务部各级党组织认真贯彻落实习近平总书记关于“三个认认真真、扎扎实实”的重要要求和学习教育总要求，一体推进学查改，注重开门教育、建章立制，做到聚焦主题、简约务实，各项工作进展顺利，学习教育扎实开展。会议强调，要在“深学”上再加力，及时跟进学习习近平总书记最新重要讲话精神，融汇贯通悟、对标对表做，把正确政绩观落实到商务工作的全过程各方面，确保学有质量。要在“真查”上再聚焦，正视问题、刀刃向内，持续真找问题、找真问题，做到见人见事见思想，确保查有力度。要在“实改”上再用劲，动真碰硬、一抓到底，畅通群众参与渠道，确保改有实效。要把学习教育和商务中心工作紧密结合起来，以学习教育成效推动商务高质量发展，为“十五五”开好局、起好步多作贡献。会议要求，要在“责任”上再加压，形成一级抓一级，层层抓落实的工作格局。领导干部特别是“一把手”，要以身作则，带头深学细悟、带头真查实改。要坚持实事求是，防范形式主义，注重为基层减负。部学习教育工作专班要加强统筹、严督实导。(商务部)", "ctime": 1780037371, "time_str": "14:49:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260529/c677073765.shtml"}, {"id": "4424669", "title": "科创50指数跌幅扩大至6%", "content": "科创50指数跌幅扩大至6%，成分股中上涨个股数不足十支，芯联集成、沪硅产业、天岳先进领跌。", "ctime": 1780037104, "time_str": "14:45:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260529/c677073662.shtml"}, {"id": "4424665", "title": "启境品牌首款车型启境GT7正式开启预售", "content": "5月29日，启境品牌首款车型启境GT7正式开启预售，该车为华为乾崑与广汽全栈技术深度融合的产品，搭载华为新一代双光路图像级激光雷达、华为乾崑智驾ADS 5、鸿蒙座舱体系、华为乾崑赤兔平台等。（人民财讯）", "ctime": 1780037072, "time_str": "14:44:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260529/c677073649.shtml"}, {"id": "4424661", "title": "智利等五国计划合作打击跨国有组织犯罪", "content": "智利、阿根廷、秘鲁、玻利维亚和厄瓜多尔五国政府代表28日在智利首都圣地亚哥出席由智外交部主办的高级别安全会议，并共同签署一份文件，约定加强地区协同，合作打击跨国有组织犯罪。当天签署的文件名为《圣地亚哥打击跨国有组织犯罪区域承诺书》。根据智外交部发布的承诺书文本，各方决定成立由相关主管机构组成的工作组，制定联合行动计划，重点推进安全、金融与税务情报、移民与边境管控等领域合作。承诺书指出，跨国有组织犯罪已成为威胁美洲地区社会稳定与发展的主要因素之一，犯罪分子正越来越多地使用新技术工具、虚拟平台、金融系统和物流网络。各国之间的密切协调对于应对该问题至关重要。各方将依据《联合国打击跨国有组织犯罪公约》及其各项议定书等机制，在充分尊重国家主权、遵守各国国内法和国际条约的前提下开展合作。（新华社）", "ctime": 1780036979, "time_str": "14:42:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260529/c677073628.shtml"}, {"id": "4424653", "title": "秘鲁南部附近海域发生5.1级地震", "content": "据美国地质调查局报告，当地时间5月29日0时32分，秘鲁南部附近海域发生5.1级地震，震中位于南纬18.42度、西经71.46度，距莫克瓜大区伊洛省以南约86公里，震源深度10公里。目前暂无人员伤亡和财产损失报告。（央视新闻）", "ctime": 1780036767, "time_str": "14:39:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260529/c677073585.shtml"}, {"id": "4424649", "title": "国际航协：今年4月航空客运需求下降3.4%", "content": "国际航协今日发布2026年4月全球航空客运需求定期数据，航空客运总需求（按照RPK收入客公里计算）同比下降3.4%。剔除中东地区后，需求增长1.2%。总运力（按照ASK可用座公里计算）同比下降2.9%。4月载客率83.1%，同比2025年4月下降0.4个百分点。国际航协理事长威利·沃尔什（Willie Walsh）表示：“受地区战事冲击，中东航空公司需求暴跌46.6%，并拖累整体需求下降3.4%。航空运输形势仍在剧烈波动中。4月航空燃油价格翻了一倍以上，推动机票价格上涨。远期排班数据显示未来数月运力供给将缩减，表明航空公司正在平衡高燃油成本与疲软需求之间的关系。”（人民财讯）", "ctime": 1780036743, "time_str": "14:39:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260529/c677073577.shtml"}, {"id": "4424647", "title": "全国农产品批发市场猪肉平均价格为14.86元/公斤，比昨天下降0.1%", "content": "据农业农村部监测，5月29日“农产品批发价格200指数”为113.20，比昨天下降0.02个点，“菜篮子”产品批发价格指数为113.25，比昨天下降0.03个点。截至今日14:00时，全国农产品批发市场猪肉平均价格为14.86元/公斤，比昨天下降0.1%；牛肉66.60元/公斤，与昨天持平；羊肉64.05元/公斤，比昨天下降0.1%；鸡蛋9.84元/公斤，比昨天上升0.7%；白条鸡16.89元/公斤，比昨天下降0.9%。", "ctime": 1780036727, "time_str": "14:38:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260529/c677073569.shtml"}, {"id": "4424631", "title": "沪深京三市成交额超3万亿元，较上日此时放量2887亿元", "content": "据同花顺iFinD数据，沪深京三市成交额超3万亿元，较上日此时放量2887亿元，预计全天成交金额约3.3万亿元。截至目前，沪市成交额13720亿元，深市成交额16088亿元，北证50成交额203亿元。", "ctime": 1780036545, "time_str": "14:35:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260529/c677073524.shtml"}, {"id": "4424599", "title": "日韩股市集体收涨 日经225指数创历史新高", "content": "日经225指数收涨2.53%，报66329.50点，创历史新高。韩国综指收涨3.54%，报8474.93点。", "ctime": 1780036269, "time_str": "14:31:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260529/c677073457.shtml"}, {"id": "4424595", "title": "罗马尼亚称俄无人机在该国坠毁致两人受伤", "content": "罗马尼亚国防部29日发布新闻公报称，一架俄罗斯无人机在罗马尼亚一栋公寓楼坠毁并引发火灾，致两人受伤。罗国防部称，28日晚至29日凌晨，俄罗斯对乌克兰发动了无人机袭击，事发地点靠近罗马尼亚边境。一架无人机侵入了罗马尼亚领空，被雷达系统一直追踪至加拉茨市南部区域。随后，该无人机坠毁在一栋公寓楼的屋顶上并引发火灾。目前由罗马尼亚多部门组成的团队正在现场开展救援与处置工作。两名伤者已被送往医院接受治疗。另据罗马尼亚媒体报道，数十名居民已被疏散。（新华社）", "ctime": 1780036259, "time_str": "14:30:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260529/c677073451.shtml"}, {"id": "4424593", "title": "英飞凌将于7月再度提价", "content": "近日，全球功率半导体厂商英飞凌向客户与合作伙伴表示，将自7月1日起调整部分产品价格。这是继2026年4月首轮提价之后，该公司年内的第二次价格上调。对于本次调价的理由，英飞凌解释主要有两点：一方面源自地缘政治紧张局势所带来的影响。这正导致整体价值链中的各项成本不断上升，涵盖能源、原材料、运输及服务等领域。另一方面，公司产品组合的需求正快速攀升，且增长幅度远超数月前的预期水平。（证券时报）", "ctime": 1780036247, "time_str": "14:30:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260529/c677073446.shtml"}, {"id": "4424591", "title": "我国牵头修订的金融业通用报文方案国际标准正式发布", "content": "记者今天（5月29日）了解到，我国牵头修订的国际标准《金融服务 金融业通用报文方案 第5部分：概念互操作性和反向工程》（ISO 20022-5:2026）和《金融服务 金融业通用报文方案 第7部分：注册》（ISO 20022-7:2026）经国际标准化组织（ISO）批准发布。其中，ISO 20022-5通过建立转换接口，在不同报文标准之间搭建起高效互联互通的“桥梁”，有效改善了跨境支付等金融服务效率。ISO 20022-7强化版本追溯机制，明确注册服务责任主体，优化技术支持渠道，避免因版本不一致导致的数据断层，助力更多银行、支付机构能够快速、顺畅地接入ISO 20022标准体系。该两项标准的发布，凝聚了17个国家及6个国际金融机构共50余名金融领域专家的智慧与共识，将进一步提升金融服务效率与全球跨境交易的便利化水平，为构建开放融通的国际金融体系提供技术支撑。（央视新闻）", "ctime": 1780036233, "time_str": "14:30:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260529/c677073441.shtml"}, {"id": "4424581", "title": "中际旭创成交额达300亿元", "content": "中际旭创成交额达300亿元，现跌3.38%。", "ctime": 1780036201, "time_str": "14:30:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260529/c677073434.shtml"}, {"id": "4424573", "title": "港股智谱继续拉升涨超20%，总市值逼近9000亿港元", "content": "港股智谱继续拉升涨超20%，最高报1988港元，总市值逼近9000亿港元。", "ctime": 1780036122, "time_str": "14:28:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260529/c677073414.shtml"}, {"id": "4424533", "title": "欧亚经济联盟第五届欧亚经济论坛聚焦人工智能", "content": "为期两天的欧亚经济联盟第五届欧亚经济论坛28日在哈萨克斯坦首都阿斯塔纳开幕。论坛重点关注人工智能和数字技术在促进经济可持续发展中的作用。除全会外，本届论坛计划举办超过30场专题会议，吸引40多个国家和地区的3000多名政商界、国际组织和媒体代表参加。本届论坛主题为“欧亚经济联盟在全球数字竞争中的地位：优先发展人工智能”。人工智能在海关监管、运输物流、工业生产和产品质量控制中的应用成为与会各方代表关注的重点。在28日举行的论坛全会上，俄罗斯总统普京、哈萨克斯坦总统托卡耶夫、白俄罗斯总统卢卡申科、吉尔吉斯斯坦总统扎帕罗夫出席并致辞。（央视新闻）", "ctime": 1780035653, "time_str": "14:20:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260529/c677073256.shtml"}, {"id": "4424517", "title": "A股三大指数持续下挫，沪指跌幅扩大至1%", "content": "A股三大指数持续下挫，沪指跌幅扩大至1%，半导体、光学光电子、光刻胶板块跌幅居前。", "ctime": 1780035467, "time_str": "14:17:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260529/c677073201.shtml"}, {"id": "4424515", "title": "北证50指数跌幅扩大至3%", "content": "北证50指数跌幅扩大至3%，现报1247.1点。", "ctime": 1780035431, "time_str": "14:17:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260529/c677073183.shtml"}, {"id": "4424509", "title": "沪深京三市成交额超2.8万亿元，较上日此时放量2596亿元", "content": "据同花顺iFinD数据，沪深京三市成交额超2.8万亿元，较上日此时放量2596亿元，预计全天成交金额约3.3万亿元。截至目前，沪市成交额12790亿元，深市成交额15028亿元，北证50成交额192亿元。", "ctime": 1780035336, "time_str": "14:15:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260529/c677073162.shtml"}, {"id": "4424473", "title": "光学光电子板块持续下挫，京东方A触及跌停", "content": "光学光电子板块持续下挫，京东方A、彩虹股份、亚世光电触及跌停，恒太照明跌超25%，福光股份跌超15%，雷曼光电、长阳科技、八亿时空、龙腾光电、天禄科技、波长光电、戈碧迦跌超10%，光莆股份、芯瑞达、长信科技、冠石科技跟跌。", "ctime": 1780034916, "time_str": "14:08:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260529/c677072978.shtml"}, {"id": "4424465", "title": "A股三大指数持续下挫，创业板指跌超2%", "content": "A股三大指数持续下挫，创业板指跌超2%，半导体、光学光电子、光刻胶板块跌幅居前。", "ctime": 1780034865, "time_str": "14:07:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260529/c677072939.shtml"}, {"id": "4424459", "title": "俄罗斯和哈萨克斯坦签署共建核电站协议", "content": "俄罗斯政府和哈萨克斯坦政府28日在俄总统普京和哈总统托卡耶夫见证下，在阿斯塔纳签署共建巴尔喀什核电站相关协议。 据哈总统府消息，正在哈萨克斯坦进行国事访问的普京28日同托卡耶夫举行联合新闻发布会。普京说，俄哈已签署关于巴尔喀什核电站建设参数及由俄国家出口信贷为项目融资的相关协议。巴尔喀什核电站作为哈首座核电站，将采用俄罗斯最先进的技术。 托卡耶夫表示，两国关于共建巴尔喀什核电站的协议具有重要意义。项目将成为两国科研、教育和技术合作的重要引擎，助力哈能源、工业及新兴产业发展。 据哈通社消息，哈原子能机构主席萨特卡利耶夫28日表示，巴尔喀什核电站项目已进入实施阶段，工程勘察正有序推进，项目主体将于2027年启动建设。核电站机组建设预计耗资144亿美元，另需20亿美元用于安全保障和配套基础设施建设。 应托卡耶夫邀请，普京于27日至29日对哈萨克斯坦进行国事访问，并出席欧亚经济委员会最高理事会会议和欧亚经济联盟第五届欧亚经济论坛。(新华社)", "ctime": 1780034831, "time_str": "14:07:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260529/c677072898.shtml"}, {"id": "4424455", "title": "李家超率团访问哈萨克斯坦和乌兹别克斯坦", "content": "香港特区行政长官李家超将于5月31日率领商贸代表团，前往哈萨克斯坦和乌兹别克斯坦访问，加强香港与中亚地区在金融、贸易、基建、创新科技、绿色发展等多个领域的交流合作，建立新的商贸通道，开拓新兴市场机遇。李家超说，今次外访代表团是本届政府规模最大、人数最多、涵盖企业范围最广，会进一步深化国际交往合作。代表团成员来自40多位香港商贸与专业代表和约30位内地企业代表，涵盖工商、金融、法律、建筑工程、物流、创科、高端制造、汽车产业等多个领域。（大湾区之声）", "ctime": 1780034764, "time_str": "14:06:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260529/c677072855.shtml"}, {"id": "4424319", "title": "科创50指数跌幅扩大至5%", "content": "科创50指数跌幅扩大至5%，现报1751.79点。芯片产业链概念股大幅回调，芯联集成-U跌超10%，天岳先进、沪硅产业、中芯国际、拓荆科技跌幅居前。", "ctime": 1780034218, "time_str": "13:56:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260529/c677072683.shtml"}, {"id": "4424301", "title": "寒武纪盘中跌超5%", "content": "A股寒武纪盘中跌5.14%，现报1323.30元。", "ctime": 1780033992, "time_str": "13:53:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260529/c677072619.shtml"}, {"id": "4424297", "title": "联合国发言人：秘书长的大门始终向以色列代表敞开", "content": "就以色列代表称以色列与联合国秘书长办公厅“不再联系”，联合国秘书长发言人迪雅里克28日表示，秘书长的大门始终向以色列代表敞开。 在当天的例行记者会上，迪雅里克在回答有关提问时说，联合国方面已注意到以色列常驻联合国代表的声明。秘书长的立场是，正如对待其他192个联合国会员国及两个观察员国一样，秘书长的大门始终向以色列代表敞开 const SECTORS  = [{"name": "金融", "hit_count": 29, "etfs": []}, {"name": "半导体", "hit_count": 27, "etfs": []}, {"name": "人工智能", "hit_count": 27, "etfs": []}, {"name": "数据要素", "hit_count": 20, "etfs": []}, {"name": "军工", "hit_count": 19, "etfs": []}, {"name": "消费", "hit_count": 17, "etfs": []}, {"name": "医药", "hit_count": 6, "etfs": []}, {"name": "地产", "hit_count": 5, "etfs": []}];
const META     = {"update_time": "2026-05-29 15:07:25", "sentiment_score": 53.25581395348837, "agents": []};

// 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}
