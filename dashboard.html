const NEWS     = [{"id": "4545379", "title": "Jefferies：沃什关于通胀压力的信号备受关注", "content": "Jefferies的Mohit Kumar在一份报告中表示，如果美联储主席凯文·沃什谈到战争之外潜在的通胀放缓压力，这可能是一个信号，表明降息是可能的。这位全球经济学家表示，除了战争之外，AI和技术是对该系统最大的供给侧冲击。他说，AI应该会导致就业下降、通胀降低，但会带来更好的生产率和更好的增长。Kumar说：“如果系统受到冲击，导致就业下降和增长放缓，美联储应该通过降息来应对。”沃什将在周三的会议上首次以主席身份亮相，预计美联储将在该会议上将联邦基金目标利率区间维持在3.50%-3.75%不变。", "ctime": 1781685436, "time_str": "16:37:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260617/c677534158.shtml"}, {"id": "4545369", "title": "乘联分会：6月1-14日，全国乘用车新能源市场零售34.1万辆，同比下降8%", "content": "乘联分会数据显示，6月1-14日，全国乘用车市场零售53.4万辆，同比去年6月同期下降18%，较上月同期下降5%，今年以来累计零售763.3万辆，同比下降19%；6月1-14日，全国乘用车厂商批发55.6万辆，同比去年6月同期下降15%，较上月同期增长8%，今年以来累计批发1,074.2万辆，同比下降6%。6月1-14日，全国乘用车新能源市场零售34.1万辆，同比去年6月同期下降8%，较上月同期增长5%，今年以来累计零售403.9万辆，同比下降15%；6月1-14日，全国乘用车厂商新能源批发37.8万辆，同比去年6月同期增长10%，较上月同期增长22%，今年以来累计批发568.4万辆，同比增长2%。", "ctime": 1781685225, "time_str": "16:33:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260617/c677534070.shtml"}, {"id": "4545367", "title": "土耳其对涉华聚酰胺和涤纶高强力纱制帘子布（轮胎用）启动反倾销调查", "content": "据中国贸易救济信息网，6月16日，土耳其贸易部发布第2026/9号公告称，应土耳其生产商申请，对原产于中国和越南的聚酰胺和涤纶高强力纱制帘子布（轮胎用）启动反倾销调查。本案倾销调查期为2024年10月1日至2025年9月30日，损害调查期为2022年1月1日至2025年9月30日。涉案产品包括原产于中国的以尼龙或其他聚酰胺制成的高强力纱线织造、经橡胶浸胶处理，用于各类运输工具内外轮胎的织物（帘子布），以及原产于中国和越南的以聚酯制成的高强力纱线织造、经橡胶浸胶处理，用于各类运输工具内外轮胎的织物（帘子布）。公告自发布之日起生效。", "ctime": 1781685205, "time_str": "16:33:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260617/c677534044.shtml"}, {"id": "4545361", "title": "巨子生物：子公司获交联重组胶原蛋白植入剂注册证，含1068个氨基酸", "content": "巨子生物公告，公司全资附属公司陕西巨子生物技术有限公司于今日收到国家药品监督管理局颁发的关于交联重组胶原蛋白植入剂的《中华人民共和国医疗器械注册证》。该产品采用人III型成熟胶原蛋白全长序列，共1068个氨基酸，完整保留胶原蛋白的天然功能域，采用无化学交联剂残留风险的物理交联工艺，用于颈部皮内真皮层注射填充，以纠正颈部中重度横纹。该产品于2024年12月获纳入国家药监局医疗器械优先审批，此次获批后成为全球首款用于颈纹填充的交联重组III型胶原蛋白填充剂。", "ctime": 1781685173, "time_str": "16:32:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260617/c677534025.shtml"}, {"id": "4545339", "title": "新坐标：副总经理兼董事会秘书郑晓玲减持20000股，其余董高未减持", "content": "新坐标公告，公司于2026年2月14日披露董事、高级管理人员减持计划，董事兼副总经理杨志军、董事任海军、副总经理兼董事会秘书郑晓玲、财务总监瞿薇计划以集中竞价交易减持不超过10.85万股（占总股本0.0795%）。截至2026年6月16日减持时间区间届满，郑晓玲通过集中竞价方式减持公司股份20000股（减持比例0.0147%），减持价格区间91.1～92.5元/股，减持总金额183.59万元；杨志军、任海军、瞿薇均未实施减持。", "ctime": 1781685105, "time_str": "16:31:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260617/c677534012.shtml"}, {"id": "4545333", "title": "“协作机器人第一股”进军家庭市场，越疆将推出陪伴人形机器人", "content": "“协作机器人第一股”越疆宣布将发布下一代陪伴交互AI人形机器人。据悉，该新品以越疆全栈自研的“空弈DobotWAM”具身大模型为智能大脑，具备理解人、适配人、服务人的全维度智能能力，专为家庭场景打造，是公司从工商业场景向真实家庭场景拓展的里程碑式跨越。（新浪科技）", "ctime": 1781685077, "time_str": "16:31:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260617/c677534009.shtml"}, {"id": "4545325", "title": "海正生材：中石化资本累计减持0.32%股份，持股降至5%", "content": "海正生材公告，持股5%以上股东中国石化集团资本有限公司（中石化资本）此前计划于2026年2月13日披露起的三个月内，通过集中竞价交易减持不超过202.67万股（占公司总股本1%）。截至2026年6月16日减持时间区间届满，中石化资本实际累计减持65.43万股，占公司总股本0.32%，减持总金额945.81万元，减持价格区间14.06～14.91元/股。本次减持计划未完成（剩余计划减持137.24万股）。减持后中石化资本持有公司股份1013.39万股，占公司总股本5.00%。", "ctime": 1781685005, "time_str": "16:30:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260617/c677533965.shtml"}, {"id": "4545321", "title": "上交所邱勇：更大力度支持科技创新，落实好人工智能领域配套规则", "content": "6月17日，在2026陆家嘴论坛上，上海证券交易所理事长邱勇表示，将发挥资本市场融资功能，更大力度支持科技创新，落实好新发布的人工智能领域配套规则，推动更多创新示范案例落地。就在17日下午，上交所正式发布了《上海证券交易所发行上市审核规则适用指引第10号——人工智能大模型企业适用科创板第五套上市标准》。（第一财经）", "ctime": 1781684930, "time_str": "16:28:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260617/c677533948.shtml"}, {"id": "4545319", "title": "三星海力士员工爆买豪车豪宅", "content": "由于三星电子和海力士的员工获得了数亿韩元的绩效奖金，购房需求激增，一些公寓价格已经上涨1亿至2亿韩元。有地产经纪人表示，“仅与一个月前相比，主要公寓的挂牌价上涨了近2亿韩元（约合89.40万元人民币）。据报道，高端进口车经销店也挤满了半导体公司员工。城南市盆唐区的某百货公司为三星电子员工提供进入精品店的快速通道等，百货公司员工李女士表示：“最近，20至30多岁的男性年龄段的顾客销售额显著增长，尤其是在手表区域。”据报道，上个月，韩国新世界百货某分店的销售额同比增长16.2%，其中珠宝和手表类商品的销售额分别增长了120%和60%。同期，现代百货板桥店的销售额增长了44.7%，乐天百货东滩店的销售额也增长了30%。（中新经纬）", "ctime": 1781684919, "time_str": "16:28:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260617/c677533946.shtml"}, {"id": "4545315", "title": "渤海化学：16万吨/年丙烯酸装置投产", "content": "渤海化学公告，公司此前将部分募投项目变更为“丙烯酸酯和高吸水性树脂新材料项目”，由子公司渤海石化负责实施。本次公告显示，该募投项目中的16万吨/年丙烯酸装置已于2026年6月16日正式投料运行，并一次性产出合格优等品，装置运行平稳、指标全面达标。", "ctime": 1781684757, "time_str": "16:25:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260617/c677533922.shtml"}, {"id": "4545313", "title": "Stellantis、Wayve与Uber三方合作，推进全球L4级无人驾驶出租车规模化落地", "content": "Stellantis、Wayve及Uber 6月17日宣布签署合作备忘录，三方将联合探索第四级（L4）全自动驾驶无人出租车的全球开发与部署。Stellantis负责基于L4就绪平台设计、工程开发及量产车辆，平台内置传感器套件并满足高强度无人驾驶运营所需的安全冗余要求；Wayve提供端到端AI驾驶软件，无需逐城市高精地图即可适配不同地区及驾驶场景；Uber则通过其全球出行平台部署无人驾驶车辆，连接乘客与自动驾驶出行服务。三方计划就车辆集成、测试验证及商业部署展开合作，目标覆盖欧洲、北美及更广泛市场。（财联社）", "ctime": 1781684680, "time_str": "16:24:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260617/c677533889.shtml"}, {"id": "4545301", "title": "赛轮轮胎：拟投资11.41亿美元建设埃及轮胎产能提升项目", "content": "赛轮轮胎公告，拟投资建设埃及轮胎产能提升项目，总投资金额为11.41亿美元，其中建设投资10.9亿美元、铺底流动资金4210万美元、建设期利息919万美元。项目建成后，预计可新增公司年均营业收入11.61亿美元、年均净利润1.7亿美元。公司对赛轮香港增资不超过6.91亿美元，赛轮香港对赛轮新加坡增资不超过6.91亿美元，赛轮新加坡对赛轮欧洲增资不超过6.84亿美元，赛轮欧洲及赛轮新加坡分别对Shams El Sherouk增资不超过1.41亿美元、143万美元，分别对Senro Tyre投资不超过5.43亿美元、549万美元。", "ctime": 1781684508, "time_str": "16:21:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260617/c677533851.shtml"}, {"id": "4545297", "title": "中国核电：控股子公司三门核电拟将其持有的三门核电5、6号机组项目分公司相关资产及负债以7.02亿元的价格转让给三门第二核电有限公司", "content": "中国核电公告，控股子公司三门核电有限公司拟将其持有的三门核电5、6号机组项目分公司相关资产及负债通过非公开协议方式，按照7.02亿元的价格转让给三门第二核电有限公司。本次交易所涉及的转让协议将于三门核电股东会审议通过后完成签署。", "ctime": 1781684490, "time_str": "16:21:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260617/c677533804.shtml"}, {"id": "4545285", "title": "欧盟新一轮对俄制裁方案新增制裁4家中企，中方回应", "content": "欧盟新一轮对俄制裁方案新增制裁4家中企，中方回应。问：6月15日，欧盟公布新一轮对俄罗斯制裁方案，新增制裁4家中方企业。中方对此有何评论？答：欧方不顾中方坚决反对和多次严正交涉，在对俄罗斯制裁中新增制裁中方企业，中方对此强烈不满、坚决反对，并再次向欧方提出了严正交涉。中国在乌克兰危机问题上一贯秉持客观公正立场，致力于劝和促谈，为推动政治解决乌克兰危机发挥建设性作用。中方坚决反对欧方在乌克兰危机问题上对中方甩锅推责、污蔑抹黑，坚决反对没有联合国安理会授权、缺乏国际法依据的非法单边制裁，将采取一切必要措施，坚定维护中方企业正当权益。（澎湃新闻）", "ctime": 1781684434, "time_str": "16:20:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260617/c677533792.shtml"}, {"id": "4545251", "title": "深交所：主动ETF指引设定专业准入 5年以上主动权益管理经验、近3年平均规模不低于100亿", "content": "深交所最新发布的《证券投资基金业务指引第5号——主动管理交易型开放式基金》对发行主动ETF的管理人提出要求。即5年以上主动权益公募管理经验，近3年平均规模不低于100亿元、无重大违法违规记录，且首次开发须通过交易所专项检查。这意味着，能够发行主动ETF的机构，都是在主动投资领域经过长期市场检验、具备投研能力和风控体系的机构。对基金经理也要求中长期业绩良好、投资风格稳定、以投资者利益为优先。这一条款为投资者最关心的问题提供了底线保护——基金经理靠不靠谱？通过要求基金经理具备稳定的投资风格和可追溯的良好业绩，投资者可以更好地评估其管理能力。(蓝鲸新闻)", "ctime": 1781684141, "time_str": "16:15:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260617/c677533687.shtml"}, {"id": "4545247", "title": "唯赛勃：董事兼董事会秘书王兴韬增持公司股份0.14%", "content": "唯赛勃公告，公司董事兼董事会秘书王兴韬于2026年6月16日至6月17日通过集中竞价方式累计增持公司股份24.49万股，占公司总股本比例0.14%，增持金额为400.86万元。本次增持前王兴韬未持有公司股份，增持后持有24.49万股，持股比例0.14%。", "ctime": 1781684108, "time_str": "16:15:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260617/c677533678.shtml"}, {"id": "4545241", "title": "深交所：主动ETF名称应强制标注“主动”", "content": "深交所最新发布的主动ETF业务指引规定，主动ETF名称应包含“主动管理交易型开放式证券投资基金”字样，场内简称应包含“主动”字样。这一看似简单的命名规则，实则是对投资者识别权的重要保护。当前市场上ETF种类繁多，普通投资者很难一眼分辨主动与被动产品。强制标注“主动”，有助于投资者根据自身风险偏好做出清晰的选择。（财联社）", "ctime": 1781684098, "time_str": "16:14:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260617/c677533671.shtml"}, {"id": "4545235", "title": "上交所发布《上海证券交易所主动管理交易型开放式证券投资基金业务指引》 就主动ETF的投资运作做出要求", "content": "上交所发布《上海证券交易所主动管理交易型开放式证券投资基金业务指引》。主要内容为：一是明确主动ETF定义和命名规则。一方面，主动ETF是指基金管理人自主选择投资策略、不以跟踪特定指数为投资目标并在交易所上市交易的开放式基金；另一方面，基金名称应当包含“主动管理交易型开放式证券投资基金”字样，场内简称应当包含“主动”字样。二是明确基金管理人资质要求。基金管理人应当符合公司治理健全、稳定，公司运作合规稳健，主动管理经验较为丰富等条件。公司应当具备健全有效的投资运作与风险管理制度、充足的投研人员、稳定的ETF运作团队与技术系统。基金管理人首次开发主动ETF的，应当通过交易所组织的专项检查验收。三是明确基金经理资质要求。基金经理应当具备丰富的投资研究经验，中长期业绩良好，投资风格稳定。四是明确产品投资管理要求。基金投资组合应当分布广泛且流动性良好，投资策略市场容量充足；应当合理控制基金组合换手率，设置合适的业绩比较基准并保持投资风格稳定。五是明确信息披露相关要求。一方面，基金管理人应当基于真实投资组合制作PCF清单每日披露，并自行或委托相关机构进行IOPV的计算与发布；另一方面，基金管理人应当在基金信息披露文件中做好风险揭示。六是明确风险监测处置相关要求。基金管理人应当建立风险监控系统，并对主动ETF潜在风险进行防范，交易所可对产品运作风险管理情况、合规情况进行检查。", "ctime": 1781684090, "time_str": "16:14:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260617/c677533667.shtml"}, {"id": "4545229", "title": "港股收评：恒生指数跌0.74%，恒生科技指数涨0.22%", "content": "港股收盘，恒生指数跌0.74%，恒生科技指数涨0.22%。恒指港股通ETF银华（159318）跌0.48%，港股通科技ETF鹏华（159751）跌0.12%。板块方面，建筑产品、半导体产品与设备板块涨幅靠前；能源设备与服务、汽车板块跌幅靠前。个股方面，琻捷电子科技涨127.12%，希迪智驾涨35.54%，中国建材涨24.95%，建滔集团涨17.68%，怡俊集团控股涨14.88%；博泰车联跌15.64%，优然牧业跌9.77%，拓璞数控跌9.24%，明略科技-W跌8.63%，群核科技跌7.09%。", "ctime": 1781684051, "time_str": "16:14:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260617/c677533654.shtml"}, {"id": "4545225", "title": "航天软件：公司收到政府补助款159万元", "content": "航天软件公告，公司于近期收到政府补助款159万元，为与收益相关的补助，占公司2025年度归母净利润绝对值的比例为14.05%。预计该补助对公司2026年度的利润产生积极影响。补助款未经审计，具体会计处理及对损益影响以年度审计确认后结果为准。", "ctime": 1781684031, "time_str": "16:13:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260617/c677533639.shtml"}, {"id": "4545223", "title": "上交所：人工智能大模型企业适用科创板第五套上市标准", "content": "上交所公告，为了落实《中国证监会关于在科创板设置科创成长层增强制度包容性适应性的意见》，进一步规范科技型企业适用科创板第五套上市标准，支持尚未形成一定收入规模的优质人工智能大模型企业在科创板发行上市，上海证券交易所制定了《上海证券交易所发行上市审核规则适用指引第10号——人工智能大模型企业适用科创板第五套上市标准》，现予以发布，并自发布之日起施行。", "ctime": 1781684025, "time_str": "16:13:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260617/c677533633.shtml"}, {"id": "4545203", "title": "上交所：战略性新兴产业领域二级行业拟新增“量子”、“机器人”、“氢能”、“脑机接口、生物药品、基因工程药物和疫苗、生物医学工程”等", "content": "为落实国家“十五五”规划纲要，服务国家培育壮大新兴产业和未来产业战略部署，根据《关于在上海证券交易所设立科创板并试点注册制的实施意见》等有关规定，上海证券交易所修订形成了《上海证券交易所科创板企业发行上市申报及推荐暂行规定（征求意见稿）》。现向社会公开征求意见，意见反馈截止时间为2026年7月2日。一是新增未来产业领域相关行业。根据“十五五”规划纲要和国家战略性新兴产业分类要求，对《暂行规定》第五条规定的战略性新兴产业领域二级行业进行调整更新。其中，新一代信息技术领域，新增“量子”；高端装备领域，新增“机器人”，并调整“海洋工程装备”为“海洋装备”；新能源领域，新增“氢能”；生物医药领域，新增“脑机接口、生物药品、基因工程药物和疫苗、生物医学工程”等。\n\n二是压实发行人和中介机构责任。明确涉及未来产业领域相关行业的发行人，应当在招股说明书等信息披露文件中全面、客观、准确披露当前发展阶段、取得的阶段性成果及可能面临的各项风险。同时，督促中介机构对发行人技术与产品的先进性、商业模式、市场空间等情况进行全面核查，明确其是否符合科创板定位要求。", "ctime": 1781683887, "time_str": "16:11:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260617/c677533590.shtml"}, {"id": "4545189", "title": "南华仪器：控股股东杨耀光减持0.80%，权益变动触及1%刻度", "content": "南华仪器公告，公司控股股东、实际控制人杨耀光于2026年6月16日以大宗交易方式减持公司股份107.7万股，占公司总股本0.80%，直接持股比例由12.35%降至11.55%。本次减持后，杨耀光及其一致行动人叶淑娟、杨伟光合计持股由2931.07万股减少至2823.37万股，合计持股比例由21.78%降至20.98%，权益变动触及1%刻度。本次减持与此前披露的减持计划一致，计划尚未实施完毕。", "ctime": 1781683785, "time_str": "16:09:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260617/c677533526.shtml"}, {"id": "4545185", "title": "顺络电子：TLVR电感产品已批量供应AI服务器 钽电容小批量出货", "content": "顺络电子发布投资者关系活动记录表公告，公司TLVR拓扑结构产品主要用于AI服务器xPU芯片，已实现批量化供应。公司高频通信磁珠、大电流磁珠、功率电感、热敏电阻、陶瓷管壳、陶瓷基板等产品可用于光模块。汽车电子业务方面，公司看好智能化应用场景普及对雷达、摄像头、域控制器等模块的需求带动，将支撑车规业务第二增长极。钽电容产品采用无引线框结构、PCB封装，可应用于高端消费电子、企业级eSSD、AI数据中心、汽车电子等领域，目前已在小批量出货。原材料成本方面，贵重物料采购价格逐步降低，但仍远高于2025年初水平，价格传导已取得初步成效。公司通过控股子公司信柏陶瓷与臻泰能源合作成立柏泰公司，进入固体氧化物电池领域，商业合作伙伴整机系统示范工程已开始运行。", "ctime": 1781683748, "time_str": "16:09:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260617/c677533452.shtml"}, {"id": "4545183", "title": "国台办：只有祖国统一，台湾才能永保太平", "content": "国务院台办发言人陈斌华17日在例行新闻发布会上答问表示，台湾的前途、台湾同胞的安全保障和利益福祉，始终系于两岸关系和平发展和祖国统一。只有反对“台独”分裂，台海才能和平安宁。只有实现祖国完全统一，台湾才能永保太平。陈斌华表示，大陆正加快高质量发展，在芯片、人工智能等领域不断取得新突破，国产大模型引领全球开源生态，脑机接口实现从“实验室理论探索”到“临床初步应用”的关键跨越，新质生产力迅猛发展，产业智能化、绿色化、融合化发展日新月异，为两岸在相关领域优势互补、合作共赢不断开拓更为广阔空间。我们欢迎广大台湾企业来大陆拥抱发展的确定性，把握发展的主动权，在稳定、开放、创新的环境中实现自身更大更好发展。（新华社）", "ctime": 1781683739, "time_str": "16:08:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260617/c677533414.shtml"}, {"id": "4545181", "title": "联诚精密：精密液压零部件项目再次延期至2027年12月31日", "content": "联诚精密公告，公司此前非公开发行募投项目“精密液压零部件智能制造项目”原计划2026年6月30日达到预定可使用状态，因全球宏观经济增速放缓、下游需求不足等因素，经第四届董事会第五次会议审议通过，将该项目达到预定可使用状态时间再次调整至2027年12月31日，并对项目重新论证后认为继续实施具备必要性和可行性。截至2026年5月31日，该项目累计投入募集资金1.49亿元，投入进度43.55%。", "ctime": 1781683707, "time_str": "16:08:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260617/c677533292.shtml"}, {"id": "4545171", "title": "润丰股份：实际控制人王文才已增持73600股，拟继续增持不低于500万元", "content": "润丰股份公告，公司实际控制人、董事长王文才于2026年6月16日通过集中竞价方式增持公司股份73600股，占公司总股本0.02%，增持金额合计368.29万元。本次增持后，王文才直接持股58.55万股，占公司总股本0.16%。同时，王文才计划自公告披露之日起6个月内，以自有资金通过集中竞价、大宗交易等方式继续增持公司股份，增持金额不低于500万元（含）且不超过1000万元（含），不设定价格区间。本次增持不会导致公司控制权变化。", "ctime": 1781683656, "time_str": "16:07:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260617/c677533101.shtml"}, {"id": "4545167", "title": "思泉新材：向特定对象发行股票申请获同意", "content": "思泉新材公告，公司近日收到中国证监会出具的《关于同意广东思泉新材料股份有限公司向特定对象发行股票注册的批复》（证监许可〔2026〕1418号）。根据批复，同意公司向特定对象发行股票的注册申请。本次发行应严格按照报送深圳证券交易所的申报文件和发行方案实施。批复自同意注册之日起12个月内有效。公司董事会将根据相关要求及股东会授权，在规定期限内办理本次发行相关事项，并及时履行信息披露义务。", "ctime": 1781683643, "time_str": "16:07:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260617/c677533054.shtml"}, {"id": "4545159", "title": "英特尔美股盘前涨超4%", "content": "英特尔美股盘前涨超4%，现报121.83美元。", "ctime": 1781683606, "time_str": "16:06:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260617/c677532949.shtml"}, {"id": "4545101", "title": "佰仁医疗：首次回购0.0109%公司股份，支付的资金总额为人民币128万元", "content": "佰仁医疗公告，2026年6月17日，公司通过上海证券交易所交易系统以集中竞价交易方式首次回购股份15000股，占公司总股本1.38亿股的比例为0.0109%，回购成交的最高价为85.45元/股，最低价为84.96元/股，支付的资金总额为人民币128万元（不含印花税、交易佣金等交易费用）。", "ctime": 1781683317, "time_str": "16:01:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260617/c677532050.shtml"}, {"id": "4545095", "title": "美股中概股盘前涨跌互现，盛美涨8%", "content": "美股中概股盘前涨跌互现，盛美涨8%，哔哩哔哩涨2%，百度、网易涨1%，京东跌0.2%，理想汽车、阿里巴巴跌1%，亚玛芬体育跌3%。", "ctime": 1781683273, "time_str": "16:01:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260617/c677531885.shtml"}, {"id": "4545093", "title": "美股大型科技股盘前涨跌互现，SpaceX涨2%", "content": "美股大型科技股盘前涨跌互现，SpaceX涨2%，英伟达涨0.5%，亚马逊涨0.3%，Meta、微软、特斯拉、苹果、谷歌A持平。", "ctime": 1781683268, "time_str": "16:01:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260617/c677531868.shtml"}, {"id": "4545029", "title": "智谱科创板IPO辅导状态变更为“辅导验收”", "content": "6月17日消息，据证监会网站披露，北京智谱华章科技股份有 // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {

  return '#64748b';

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
