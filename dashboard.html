的批量化研制开展相关新技术在轨验证。(人民财讯)", "ctime": 1786329517, "time_str": "10:38:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260810/c678818966.shtml"}, {"id": "4922781", "title": "千问开放平台上线：覆盖APP、PC、眼镜三端", "content": "千问开放平台今日上线，面向生态伙伴和开发者开放手机、PC和AI眼镜三类终端的服务接入。首批伙伴覆盖物流运输、房产居住、本地生活、理财、汽车等十多个领域，包括顺丰速运、天鹅到家鹅宝、联想乐享、自如租房、哈啰租车、彩云天气、闪送、飞常准、美的美居、嘟嘟巴士等。（科创板日报）", "ctime": 1786329317, "time_str": "10:35:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260810/c678818850.shtml"}, {"id": "4922773", "title": "中国AI大模型调用量连续十五周领跑：环比增长570% DeepSeek-V4-Flash正式版登顶", "content": "根据OpenRouter最新数据测算，上周（8月3日至8月9日）全球AI大模型总调用量为69万亿Token，环比增长21.48%。其中，上榜的AI大模型中，中国AI大模型周调用量达34.25万亿Token，环比增长21.76%；同期美国AI大模型周调用量为9.17万亿Token，环比增长109.36%。中国大模型周调用量连续十五周超过美国，稳居全球首位。记者注意到，上周，全球调用量排名前四均为中国AI大模型。其中，DeepSeek-V4-Flash-0731（即DeepSeek-V4-Flash正式版）位居第一，周调用量达8.83万亿Token，环比增长570%；腾讯Hy3位居第二，周调用量达8.05万亿Token，环比增长67%；DeepSeek-V4-Flash-0423（即DeepSeek-V4-Flash预览版）排名第三，周调用量达5.88万亿Token，环比下滑19%。（每日经济新闻）", "ctime": 1786329138, "time_str": "10:32:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260810/c678818763.shtml"}, {"id": "4922753", "title": "2026国际基础科学大会专场沙龙今起密集举行", "content": "2026国际基础科学大会正在北京举行，今天起，“数学之夜”“物理之夜”“工程之夜”“基础科学与人工智能论坛”等多场专场沙龙将密集举行，汇聚多位菲尔兹奖、图灵奖等国际大奖得主，共话学科前沿趋势。今年大会主题为“聚焦基础科学，引领人类未来”，共有千余名中外科学家、科研工作者和青年学子参会，大会将持续到8月21日。（央视新闻）", "ctime": 1786328779, "time_str": "10:26:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260810/c678818517.shtml"}, {"id": "4922749", "title": "旅游及酒店板块走高，华天酒店涨停", "content": "旅游及酒店板块走高，华天酒店涨停，锦江酒店、金陵饭店、君亭酒店、首旅酒店跟涨。", "ctime": 1786328625, "time_str": "10:23:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260810/c678818455.shtml"}, {"id": "4922733", "title": "日本民间组织批评政府推动修改“无核三原则”及宪法", "content": "日本原子弹氢弹爆炸受害者团体协议会10日发表声明，批评日本现政府正试图在没有充分讨论的情况下推动修改“无核三原则”和宪法，并要求维护和平宪法。声明还要求日本政府向原子弹爆炸受害者等作出赔偿、签署并批准《禁止核武器条约》，并呼吁称这是作为遭受原子弹轰炸国家所肩负的历史责任，也是迈向和平世界的第一步。“无核三原则”指“不拥有、不制造、不运进核武器”。据日本媒体此前披露，高市政府企图在今年年底修订“安保三文件”时对“无核三原则”中“不运进核武器”的原则进行修改。7月，日本防卫大臣小泉进次郎在一档节目中公然提出，日本应毫无禁忌地讨论与核武器相关的政策。这一系列涉核动向引发日本各界持续担忧。（央视新闻）", "ctime": 1786328052, "time_str": "10:14:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260810/c678808242.shtml"}, {"id": "4922725", "title": "造纸板短线拉升，宜宾纸业触及涨停", "content": "造纸板短线拉升，宜宾纸业触及涨停，齐峰新材、恒丰纸业、森林包装、民丰特纸、恒达新材跟涨。", "ctime": 1786327934, "time_str": "10:12:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260810/c678818088.shtml"}, {"id": "4922719", "title": "多支医药医疗ETF涨超4%", "content": "　　港股通医疗ETF易方达(520850)、港股创新药ETF广发(513120)、港股通医疗ETF汇添富(526010)等多只ETF涨超4%。医疗服务、CRO概念持续走强，百花医药5连板，哈药股份2连扳，药明康德港股股价创历史新高。", "ctime": 1786327835, "time_str": "10:10:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260810/c678808095.shtml"}, {"id": "4922717", "title": "乳业板块持续走高，一鸣食品涨停", "content": "乳业板块持续走高，益生股份、一鸣食品涨停，品渥食品、立高食品、骑士乳业、欢乐家、天润乳业跟涨。", "ctime": 1786327787, "time_str": "10:09:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260810/c678808056.shtml"}, {"id": "4922715", "title": "国家防减救灾委、应急管理部对浙江启动国家四级救灾应急响应", "content": "国家防减救灾委、应急管理部启动国家四级救灾应急响应，指导浙江做好“白海豚”台风灾害救灾救助工作。8月10日，国家防减救灾委、应急管理部针对第13号台风“白海豚”对浙江省造成的严重影响，启动国家四级救灾应急响应，派出救灾工作组赴灾区实地查看灾情，指导协助地方做好灾情统计核查、群众安置救助、基本生活保障等救灾救助工作。（新华社）", "ctime": 1786327770, "time_str": "10:09:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260810/c678808049.shtml"}, {"id": "4922713", "title": "两部门联合启动2026年度计量支撑产业新质生产力发展项目征集工作", "content": "记者今天（10日）了解到，市场监管总局、工业和信息化部近日联合印发通知，公开征集2026年度计量支撑产业新质生产力发展项目。此举旨在深入贯彻落实《计量支撑产业新质生产力发展行动方案（2025—2030年）》部署要求，围绕战略性新兴产业和未来产业新质生产力发展迫切需求，持续发挥计量在科技创新、产业升级中的基础性、战略性作用，加快破解产业发展关键计量技术瓶颈，推动产业高质量发展。本次项目征集围绕新一代信息技术、人工智能、航空航天、新能源、新材料、高端装备、生物医药、量子科技、集成电路、仪器仪表十大重点领域，聚焦产业链关键共性计量装备研制、计量技术攻关与产业化应用，重点支持能够破解“卡脖子”难题、实现国产替代、填补国内外空白的重大创新项目。市场监管总局、工业和信息化部将对征集到的项目开展评审，并从中遴选10个左右的项目作为2026年度重点项目。针对重点项目，两部门将加强指导协调与支持，同时强化项目过程管理与监督检查，共同保障重点项目的顺利实施。（央视新闻）", "ctime": 1786327753, "time_str": "10:09:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260810/c678807980.shtml"}, {"id": "4922709", "title": "光学元件板块短线走低，戈碧迦跌超6%", "content": "光学元件板块短线走低，戈碧迦跌超6%，美迪凯、光智科技、腾景科技、蓝特光学等跟跌。", "ctime": 1786327714, "time_str": "10:08:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260810/c678807939.shtml"}, {"id": "4922695", "title": "我国法院成功化解发生在霍尔木兹海峡的外轮碰撞纠纷", "content": "记者8月10日从最高人民法院获悉，广州海事法院近日成功审理并调解一起发生在霍尔木兹海峡的外籍船舶碰撞纠纷案，充分展示了中国海事审判的公正专业和高效便捷。据了解，“阿达琳”轮和“前线老鹰”轮于2025年6月在霍尔木兹海峡附近海域碰撞后，外籍当事人一致同意适用我国法律，由广州海事法院解决双方实体争议。广州海事法院在扣押船舶、庭前会议、设立基金、开庭审理、技术事实核查、开展司法调解等多个环节，展现了中国海事法院驾驭复杂疑难海事案件的司法能力和高效务实的司法作风，赢得外方当事人的充分信任，最终促成双方达成和解协议，圆满化解该起标的额高达1.8亿元的外轮碰撞事故责任纠纷。（新华社）", "ctime": 1786327540, "time_str": "10:05:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260810/c678807772.shtml"}, {"id": "4922661", "title": "南向资金净买入超20亿港元", "content": "据同花顺iFinD数据，截至目前，南向资金净买入超20亿港元，其中港股通（沪）买入超10.66亿港元，港股通（深）买入超10.08亿港元。", "ctime": 1786326725, "time_str": "09:52:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260810/c678807060.shtml"}, {"id": "4922657", "title": "半导体设备板块再度拉升，盛美上海涨 const SECTORS  = [{"name": "金融", "hit_count": 32, "etfs": []}, {"name": "数据要素", "hit_count": 21, "etfs": []}, {"name": "人工智能", "hit_count": 18, "etfs": []}, {"name": "医药", "hit_count": 15, "etfs": []}, {"name": "军工", "hit_count": 13, "etfs": []}, {"name": "消费", "hit_count": 9, "etfs": []}, {"name": "半导体", "hit_count": 9, "etfs": []}, {"name": "低空经济", "hit_count": 7, "etfs": []}];
const META     = {"update_time": "2026-08-10 11:22:01", "sentiment_score": 56.19047619047619, "agents": []};

// 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
