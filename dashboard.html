260514/c676694701.shtml"}, {"id": "4364137", "title": "央行：4月末，本外币贷款余额284.29万亿元，同比增长5.5%", "content": "央行：4月末，本外币贷款余额284.29万亿元，同比增长5.5%。月末人民币贷款余额280.5万亿元，同比增长5.6%。前四个月人民币贷款增加8.59万亿元。", "ctime": 1778749440, "time_str": "17:04:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260514/c676694698.shtml"}, {"id": "4364131", "title": "翰宇药业：卡贝缩宫素注射液获得印度尼西亚药品上市许可批准", "content": "翰宇药业公告，2026年5月13日，公司收到印度尼西亚国家药品食品监督管理局颁发的卡贝缩宫素注射液上市许可批准。", "ctime": 1778749372, "time_str": "17:02:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260514/c676694667.shtml"}, {"id": "4364129", "title": "央行：初步统计，2026年4月末社会融资规模存量为456.89万亿元，同比增长7.8%", "content": "央行：初步统计，2026年4月末社会融资规模存量为456.89万亿元，同比增长7.8%。其中，对实体经济发放的人民币贷款余额276.9万亿元，同比增长5.6%；对实体经济发放的外币贷款折合人民币余额1.13万亿元，同比下降3.8%；委托贷款余额11.23万亿元，同比下降0.1%；信托贷款余额4.67万亿元，同比增长7.4%；未贴现的银行承兑汇票余额2.2万亿元，同比下降7.9%；企业债券余额35.52万亿元，同比增长8.3%；政府债券余额99.37万亿元，同比增长15.6%；非金融企业境内股票余额12.4万亿元，同比增长4.6%。", "ctime": 1778749364, "time_str": "17:02:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260514/c676694657.shtml"}, {"id": "4364127", "title": "央行：将开展3000亿元买断式逆回购操作", "content": "央行：2026年5月15日，中国人民银行将以固定数量、利率招标、多重价位中标方式开展3000亿元买断式逆回购操作，期限为6个月（184天），到期日为2026年11月15日（遇节假日顺延）。", "ctime": 1778749334, "time_str": "17:02:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260514/c676694647.shtml"}, {"id": "4364125", "title": "央行：4月末，广义货币（M2）余额353.04万亿元,同比增长8.6%", "content": "央行：4月末，广义货币（M2）余额353.04万亿元,同比增长8.6%。狭义货币（M1）余额114.58万亿元,同比增长5%。流通中货币（M0）余额14.75万亿元,同比增长12.2%。前四个月净投放现金6530亿元。", "ctime": 1778749293, "time_str": "17:01:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260514/c676694634.shtml"}, {"id": "4364117", "title": "以军称开始打击黎巴嫩南部多地真主党目标", "content": "以色列国防军14日午间发布声明称，以军已开始打击黎巴嫩南部多个地区的真主党基础设施目标。以军12日称，以军近期越过黎南部的利塔尼河，抵达北岸并与黎真主党武装人员爆发战斗。（新华社）", "ctime": 1778749201, "time_str": "17:00:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260514/c676694485.shtml"}, {"id": "4364115", "title": "菲副总统莎拉批评政府行动，其弹劾案将在参议院开庭", "content": "菲律宾副总统莎拉·杜特尔特办公室发布的视频中，莎拉批评行政部门对参议院的不尊重行为，认为政府的行动正在加深政治分歧。根据当地媒体报道，菲律宾参议院将于5月18日开庭审理对莎拉的弹劾案。此前，菲众议院已于11日通过对莎拉的弹劾案，她被指控涉嫌腐败、策划暗杀、煽动叛乱、滥用职权等。如果后续超过三分之二的参议员支持弹劾，她将被定罪免职，并终身不得担任公职。（新华社）", "ctime": 1778749151, "time_str": "16:59:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260514/c676694460.shtml"}, {"id": "4364107", "title": "国家主席习近平同美国总统特朗普参观天坛", "content": "5月14日，国家主席习近平同来华进行国事访问的美国总统特朗普参观天坛。初夏的天坛，古柏含章，清风送爽。习近平在祈年殿迎接特朗普到访。习近平同特朗普在轩朗开阔的祈年殿广场合影。祈年殿气势恢宏，重檐琉光。两国元首拾阶而上，步入祈年殿，共同欣赏榫卯斗拱精准契合、天文历法与殿宇结构完美融合的建筑特点，感受其中和谐万物、顺天应时的理念。习近平指出，2017年我们沿着北京中轴线参观了故宫。今天参观的天坛和故宫同龄，寓意“天圆地方”，展现出中国人的宇宙观和处世哲学。中国古代执政者在天坛举行祭祀大典，祈求国泰民安、风调雨顺，体现出民为邦本、本固邦宁的中国传统思想。中国共产党传承发展中华文明的民本思想，始终坚持全心全意为人民服务的根本宗旨，得到人民的坚定支持和衷心拥护。特朗普表示，当年的故宫之行至今记忆犹新。天坛历经600多年，仍然巍峨屹立，展现出中国精美的古典建筑艺术和博大精深的传统文化，令人赞叹。美中两国都是伟大的国家，两国人民都是伟大的人民，富有智慧。两国应该深化相互理解，增进人民友好。蔡奇、王毅、尹力等参加上述活动。(新华社)", "ctime": 1778749035, "time_str": "16:57:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260514/c676694397.shtml"}, {"id": "4364095", "title": "正帆科技今日涨19.99%，1家机构专用席位净买入1.17亿元", "content": "正帆科技今日涨19.99%，成交额19.98亿元，换手率15.73%，盘后龙虎榜数据显示，沪股通专用席位买入1.57亿元并卖出1.01亿元，1家机构专用席位净买入1.17亿元。", "ctime": 1778748966, "time_str": "16:56:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260514/c676694337.shtml"}, {"id": "4364093", "title": "长盈通今日涨19.94%，1家机构专用席位净买入2.81亿元", "content": "长盈通今日涨19.94%，成交额20.06亿元，换手率18.54%，盘后龙虎榜数据显示，沪股通专用席位买入1.39亿元并卖出7841.48万元，1家机构专用席位净买入2.81亿元，有1家机构专用席位净卖出1.71亿元。", "ctime": 1778748938, "time_str": "16:55:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260514/c676694325.shtml"}, {"id": "4364083", "title": "减肥药销售政策收紧？明天起 沪上零售药店要求提供医院纸质处方", "content": "记者从上海多家零售药房了解到，自5月15日起，司美格鲁肽、替尔泊肽等GLP-1药物均需要凭有效期内的医院纸质处方单才能购买。有药店工作人员称，今天他们还有权限从互联网医院开处方，但从5月15号开始就不行了。也有药店工作人员称，他们在5月13号就收到通知，今天（5月14号）就必须凭处方单购药了。上述工作人员均强调，处方需要在三天有效期内，超出有效期也无法开药，购药的药品名称、剂量、规格等也必须与处方单一致，如果医生处方单开的是司美格鲁肽，就无法买替尔泊肽。（澎湃新闻）", "ctime": 1778748662, "time_str": "16:51:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260514/c676694172.shtml"}, {"id": "4364073", "title": "商务部：到2035年共打造约35个服务贸易创新发展示范区", "content": "在今天召开的商务部例行新闻发布会上，新闻发言人何咏前介绍，近日，商务部印发了《国家服务贸易创新发展示范区建设总体方案》。商务部新闻发言人介绍，在服务贸易创新发展试点基础上，将培育一批具有国际竞争力的服务出口企业和重点服务产业集群。率先在北京、天津、上海、重庆、大连、厦门等17个地区开展示范区建设，到2035年共打造约35个示范区。具体将围绕探索产业链供应链集成创新、培育经营主体竞争优势、促进生产要素高效供给、推进高水平对外开放、构建境内外促进体系等方面，开展差异化探索。（央视新闻）", "ctime": 1778748466, "time_str": "16:47:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260514/c676694092.shtml"}, {"id": "4364071", "title": "有研粉材：应用于昇腾芯片的新型散热铜粉出货量目前较为稳定", "content": "针对投资者提问“请问昇腾芯片出货量大增，为什么公司散热铜粉销量没有同比上涨，目前出货量如何？”，有研粉材5月14日在互动平台表示，公司产品销量取决于下游市场需求，应用于昇腾芯片的新型散热铜粉出货量目前较为稳定。（人民财讯）", "ctime": 1778748444, "time_str": "16:47:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260514/c676694086.shtml"}, {"id": "4364059", "title": "元琛科技：设立注册资本2000万元全资子公司", "content": "元琛科技公告，基于战略规划及业务发展需要，在安徽淮南设立全资子公司安徽安碳量芯科技有限公司。注册资本为人民币2000万元。公司已于近日完成相关注册登记工作。根据《上海证券交易所科创板股票上市规则》《公司章程》的相关规定，本次对外投资事项在公司总经理审批权限内，无需提交公司董事会、股东会审议。本次对外投资不涉及关联交易，亦不构成《上市公司重大资产重组管理办法》规定的重大资产重组。", "ctime": 1778748288, "time_str": "16:44:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260514/c676693971.shtml"}, {"id": "4364057", "title": "华虹公司：第一季度净利润1.4亿元，同比增长513.10%", "content": "华虹公司公告，第一季度营收为46.25亿元，同比增长18.22%；净利润为1.4亿元，同比增长513.10%。净利润增长主要由于平均销售价格及付运晶圆数量上升使得毛利上升，及本期为汇兑收益而上年同期为汇兑损失。第二季度预计销售收入约在6.9亿美元至7亿美元之间。预计毛利率约在14%至16%之间。", "ctime": 1778748281, "time_str": "16:44:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260514/c676693968.shtml"}, {"id": "4364053", "title": "天马科技：2026年4月，公司鳗鱼出池约1284.92吨", "content": "天马科技公告，2026年4月，公司鳗鱼出池约1284.92吨，其中外销约625.19吨，自用约659.73吨，本月鳗鱼出池规格主要在1P~5P之间，销售价格区间为4.05万元/吨~9.9万元/吨。2026年1~4月，公司鳗鱼累计出池约4636.98吨，其中外销约1103.44吨，自用约3533.54吨，本期鳗鱼出池规格主要在1P~5P之间，销售价格区间为4.03万元/吨~11.2万元/吨。", "ctime": 1778748158, "time_str": "16:42:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260514/c676693932.shtml"}, {"id": "4364045", "title": "恒盛能源：拟以3311万元收购辽河华大70%股权", "content": "恒盛能源公告，拟以现金3311万元收购四平辽河农垦管理区华大发电有限公司70%股权，其中以2488.45万元的价格受让现有股东张清海持有的52.6087%股权，以822.55万元的价格受让现有股东李惠颖持有的17.3913%股权。本次交易已经公司第三届董事会第二十四次会议审议通过，无需提交公司股东会审议。辽河华大最近一年一期均出现亏损，未来经营情况存在不确定性。", "ctime": 1778747927, "time_str": "16:38:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260514/c676693814.shtml"}, {"id": "4364035", "title": "中国跨境电商发展交流会走进万国宫 聚焦南南合作新机遇", "content": "“中国跨境电商发展与南南合作新机遇”主题交流会13日在瑞士日内瓦万国宫举办。中国商务部外贸司司长王志华在主旨发言中说，跨境电商已成为中国外贸发展新动能，发展成效显著。中国发展跨境电商既服务了南方国家消费者，提高生活品质，也进口了大量南方国家商品。中国政府还通过技术援助、人员培训等方式，帮助相关国家提升开展跨境电商的能力。下一步，中国将持续深化跨境电商领域南南合作，共同谱写数字经济时代南南合作的新篇章。（新华社）", "ctime": 1778747704, "time_str": "16:35:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260514/c676693620.shtml"}, {"id": "4364033", "title": "SK海力士市值逼近万亿美元", "content": "5月14日，韩国存储芯片巨头SK海力士的市值达到约9420亿美元，有望成为三星电子之后下一家迈入万亿美元俱乐部的亚洲芯片公司。今年以来，受人工智能热潮推动，高带宽存储（HBM）芯片需求激增，SK海力士股价已累计上涨超过200%。（第一财经）", "ctime": 1778747643, "time_str": "16:34:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260514/c676693591.shtml"}, {"id": "4364029", "title": "中煤能源：4月商品煤产量1002万吨，同比下降9.3%", "content": "中煤能源公告，2026年4月商品煤产量1002万吨，同比下降9.3%；销量2042万吨，同比下降3.2%。", "ctime": 1778747573, "time_str": "16:32:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260514/c676693560.shtml"}, {"id": "4363993", "title": "美光科技美股盘前跌超2%", "content": "美光科技美股盘前跌超2%，现报787.5美元。", "ctime": 1778747044, "time_str": "16:24:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260514/c676693354.shtml"}, {"id": "4363991", "title": "佛塑科技今日跌10.01%，有5家机构专用席位净卖出2.91亿元", "content": "佛塑科技今日跌10.01%，成交额18.42亿元，换手率10.44%，盘后龙虎榜数据显示，深股通专用席位买入3761.32万元并卖出2722.29万元，1家机构专用席位净买入1290.36万元，有5家机构专用席位净卖出2.91亿元。", "ctime": 1778747028, "time_str": "16:23:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260514/c676693345.shtml"}, {"id": "4363987", "title": "日本版“星链”军事侦察网启用", "content": "日本防卫政务官若林洋平14日在日本国会参议院内阁委员会上称，为确保作为“反击能力”手段的远程导弹具备实效性，由大量小型卫星组成的低轨军事侦察网络“卫星星座”已于今年4月启用。近年来，日本自卫队一方面积极整合美国的“星链”商业卫星通信服务，另一方面大力推进自主低轨“卫星星座”建设，加紧强化天基作战能力。而“卫星星座”项目又被视为日本版的“星链”，主要包括合成孔径雷达卫星和光学成像卫星——前者具备全天候、全天时对地观测能力，能够穿透云层识别和监视地面及海面目标，后者提供高分辨率的地面图像情报。分析人士指出，日本版“星链”建成将使日本在天基作战能力上实现突破。通过构建具备“天基打击链”的卫星网络，进一步模糊日本“专守防卫”原则的边界，加快日本军事松绑的步伐。而日本加快推进天基作战能力建设又或将引发新一轮以太空和导弹技术为核心的军备竞赛，对地区乃至全球的战略稳定构成严重挑战，需引起国际社会高度警惕。（央视新闻）", "ctime": 1778746848, "time_str": "16:20:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https:/ /news.10jqka.com.cn/20260514/c676691883.shtml"}, {"id": "4363957", "title": "三年一周期 我国启动全国生育友好城市、生育友好单位创建", "content": "国家卫生健康委今天发布《全国生育友好城市、生育友好单位创建管理办法》，启动全国生育友好城市、生育友好单位创建工作，发挥典型示范作用，鼓励引导各地对标先进，完善生育支持政策体系和激励机制，加快建设生育友好型社会，不断满足人民群众对美好生活的向往。《管理办法》共5章：第一章为总则，包括全国生育友好城市、生育友好单位创建的核心要义、总体要求、责任分工等；第二章为创建程序，包括创建周期与数量、创建对象、评审程序、表扬奖励、宣传推广等；第三章为复审复核，包括复审时间、复审方式等；第四章为监督管理，包括撤销称号并摘牌的情形、监督形式、专家管理等；第五章为附则。全国生育友好城市是指以城市为单元，通过完善经济、时间、服务、文化等方面的支持措施，有效降低家庭生育、养育、教育负担，努力实现群众满意、家庭幸福、社会和谐，促进人口高质量发展。全国生育友好单位是指以用人单位为单元，通过落实生育支持政策，为职工生育、养育、教育子女创造良好条件，支持职工平衡工作和家庭的关系，努力形成尊重生育、支持生育的社会氛围。（央视新闻）", "ctime": 1778746235, "time_str": "16:10:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260514/c676691320.shtml"}, {"id": "4363955", "title": "港股收评：恒生指数持平，恒生科技指数跌0.35%", "content": "港股收盘，恒生指数持平，恒生科技指数跌0.35%。恒指港股通ETF银华（159318）涨0.22%，港股通科技ETF鹏华（159751）跌0.63%。板块方面，林业与纸制品、商业服务与用品板块涨幅靠前；客运航空公司、电气设备板块跌幅靠前。个股方面，天岳先进涨18.29%，图达通涨17.92%，瀚天天成涨12.73%，纳芯微涨10.07%，速腾聚创涨8.83%；大唐发电跌13.96%，大族数控跌12.27%，金风科技跌10.81%，佳鑫国际资源跌10.68%，招金矿业跌10.41%。", "ctime": 1778746219, "time_str": "16:10:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260514/c676691309.shtml"}, {"id": "4363949", "title": "英特尔将与F1迈凯伦车队达成多年期合作协议", "content": "据报道，英特尔将于当地时间5月14日宣布与世界一级方程式赛车锦标赛（F1）迈凯伦车队达成多年期合作协议，成为后者的官方计算合作伙伴。据悉，预计双方不会披露协议具体金额。（界面新闻）", "ctime": 1778746086, "time_str": "16:08:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260514/c676691204.shtml"}, {"id": "4363939", "title": "拉脱维亚总理宣布决定辞职", "content": "拉脱维亚总理埃维卡·希莉娜14日召开发布会宣布决定辞职，其内阁将作为看守政府继续履职。（新华社）", "ctime": 1778745939, "time_str": "16:05:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260514/c676691125.shtml"}, {"id": "4363935", "title": "商务部：前4个月我国货物贸易进出口总值同 771, "time_str": "16:02:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260514/c676690991.shtml"}];
const SECTORS  = [{"name": "金融", "hit_count": 32, "etfs": []}, {"name": "数据要素", "hit_count": 27, "etfs": []}, {"name": "人工智能", "hit_count": 25, "etfs": []}, {"name": "半导体", "hit_count": 17, "etfs": []}, {"name": "消费", "hit_count": 15, "etfs": []}, {"name": "军工", "hit_count": 12, "etfs": []}, {"name": "医药", "hit_count": 6, "etfs": []}, {"name": "新能源", "hit_count": 6, "etfs": []}];
const META     = {"update_time": "2026-05-14 17:15:43", "sentiment_score": 58.1140350877193, "agents": []};

// 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {

      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
