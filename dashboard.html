际公平正义。(新华社)", "ctime": 1779877690, "time_str": "18:28:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260527/c677018450.shtml"}, {"id": "4413811", "title": "迪哲医药：舒沃哲新药上市申请获国家药监局受理并纳入优先审评", "content": "迪哲医药公告，公司自主研发的舒沃哲 （舒沃替尼片）新增适应症新药上市申请（NDA）获国家药品监督管理局药品审评中心正式受理，并纳入优先审评程序，用于表皮生长因子受体（EGFR）20号外显子插入突变的局部晚期或转移性非小细胞肺癌（NSCLC）成人患者。该申请成为目前全球首个且唯一在EGFR exon20ins NSCLC一线治疗领域获NDA受理并纳入优先审评的口服靶向药。本次申请基于开放标签、随机对照、国际多中心III期确证性研究“悟空28”（WU-KONG28）的积极结果，与含铂双药化疗相比，舒沃哲 在无进展生存期（PFS）上展现出具有统计学意义和临床意义的显著改善，详细数据将于2026年美国临床肿瘤学会（ASCO）年会以最新突破摘要口头报告形式公布。", "ctime": 1779877612, "time_str": "18:26:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260527/c677018419.shtml"}, {"id": "4413809", "title": "日月光推310mm面板级封装自动化 目标明年上半年量产", "content": "日月光投控旗下日月光半导体表示，已研发出业内首条 310mm×310mm 面板级封装（Panel-Level Packaging）自动化产线。该产线实现了晶圆级封装到面板级封装的无缝衔接，同时兼容 FOCoS（基板扇出型封装）与 FOCoS-Bridge 两大封装平台的设计规范，有助于提升规模效应。这条全新面板级封装产线，预计将于 2027 年上半年正式投产。(科创板日报)", "ctime": 1779877611, "time_str": "18:26:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260527/c677018418.shtml"}, {"id": "4413807", "title": "恒银科技：子公司司法拍卖流拍，标的评估值2.39亿元", "content": "恒银科技公告，公司控股子公司智筑空间（天津）科技有限公司作为申请执行人参与天津市第一中级人民法院组织的第二次公开司法拍卖，交易标的为天津市红桥区瑞玺大厦112套不动产，评估值2.39亿元，起拍价1.8亿元。因本次拍卖无其他竞买人参与竞价，智筑空间亦未出价，司法拍卖最终流拍。智筑空间已交纳的3000万元竞买保证金将按法院要求原路退回。", "ctime": 1779877595, "time_str": "18:26:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260527/c677018415.shtml"}, {"id": "4413805", "title": "英媒：9国退出供乌弹药采购联盟", "content": "英国《金融时报》26日报道，去年12月以来，已有9个国家退出由捷克发起的供乌克兰弹药采购倡议，参与这个采购倡议的国家比高峰期少了一半。捷克总统、北约军事委员会前主席彼得·帕维尔希望在7月北约峰会上讨论该采购机制的存续问题。自2024年以来，所谓“捷克倡议”的参与国家已向乌克兰提供超过400万枚大口径炮弹，约占供乌大口径弹药总量的50%。参与国家去年一度达18个，如今降至9个，引发对其内部责任分摊及其前景的疑虑。帕维尔告诉《金融时报》，定于7月在土耳其首都安卡拉举行的北约峰会理应将该倡议存续问题纳入议程。（新华社）", "ctime": 1779877562, "time_str": "18:26:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260527/c677018400.shtml"}, {"id": "4413803", "title": "大豪科技：股东郑建军拟减持不超过1%股份", "content": "大豪科技公告，公司执行董事、股东郑建军持有公司股份1.45亿股，占公司总股本13.00%，其因个人资产配置需要，拟自2026年6月18日至2026年9月17日通过集中竞价交易方式减持不超过1116.65万股，即不超过公司总股本的1.00%。减持价格按市场价格确定，若期间公司有送股、转增等股份变动事项，减持数量将相应调整。", "ctime": 1779877552, "time_str": "18:25:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260527/c677018398.shtml"}, {"id": "4413795", "title": "华塑控股：5月21日至5月26日期间 信通万华合计减持1073.12万股公司股份", "content": "华塑控股公告，公司大股东成都信通万华企业管理有限公司此前披露拟在三个月内减持不超过3219.38万股（占总股本3%）。2026年5月21日至5月26日期间，信通万华通过集中竞价方式合计减持公司股份1073.12万股，减持比例达1.00%，减持前持股比例为11.47%，减持后持股比例为10.47%。其余减持方式暂未实施。", "ctime": 1779877288, "time_str": "18:21:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260527/c677018282.shtml"}, {"id": "4413785", "title": "恩捷股份：拟收购江苏爱思开100%股权 基础购买价款为4亿元", "content": "恩捷股份公告，公司下属子公司江苏恩捷拟收购SKIET持有的爱思开电池材料科技（江苏）有限公司100%股权，基础购买价款为人民币4亿元。标的公司共8条基膜产线，设计年产能约9.4亿平方米。本次交易已获公司董事会审议通过，尚需提交股东会审议及国家市场监督管理总局经营者集中反垄断审查。", "ctime": 1779877202, "time_str": "18:20:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260527/c677018197.shtml"}, {"id": "4413771", "title": "蜀道装备：中标年产55亿立方米煤制天然气空分装置项目", "content": "蜀道装备公告，公司近日收到新疆庆华丰能源有限公司发来的《中标通知书》，确认公司为新疆庆华年产55亿立方米煤制天然气示范项目二期工程4*78870Nm3/h空分装置建设、运营、移交项目中标单位。公司尚未与招标人签署正式合同，最终合同条款仍需双方进一步协商确定，合同的最终签订存在一定的不确定性。", "ctime": 1779877066, "time_str": "18:17:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260527/c677018152.shtml"}, {"id": "4413767", "title": "美光科技美股盘前涨超6%", "content": "美光科技美股盘前涨超6%，现报950.0美元。", "ctime": 1779877037, "time_str": "18:17:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260527/c677018126.shtml"}, {"id": "4413765", "title": "必易微：股东询价转让初步定价56.56元/股", "content": "必易微公告，根据2026年5月27日询价申购情况，公司股东新余市凯维思企业管理中心（有限合伙）、新余市卡维斯特企业管理中心（有限合伙）、新余市卡纬特企业管理中心（有限合伙）本次询价转让初步确定的转让价格为56.56元/股。参与报价的机构投资者共20家，涵盖基金管理公司、证券公司、合格境外机构投资者、私募基金管理人等。本次转让已获全额认购，初步确定受让方为17家机构投资者，拟受让股份总数为278.65万股。最终结果以中国结算上海分公司办理结果为准，不涉及公司控制权变更。", "ctime": 1779877032, "time_str": "18:17:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260527/c677018124.shtml"}, {"id": "4413763", "title": "分析人士：日本强化情报机构 与二战前如出一辙", "content": "近来，日本当局在情报领域动作频频，推动多层面整合升级情报力量，强化首相对情报工作的集权式控制。分析人士指出，这一系列动向，与二战前日本军国主义强化情报机构的种种做法如出一辙，日本首相高市早苗正在打造“新战前情报体系”。有日本媒体指出，重组后的政府情报体系相当于“直属”于首相，存在被政治化滥用风险，可能沦为高市政府操纵国内舆论、压制不同声音的工具，侵犯民众隐私权及言论自由。不少网友评论称，这很容易让人联想起二战前的日本情报机构——“特高课”。（央视新闻）", "ctime": 1779876959, "time_str": "18:15:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260527/c677018085.shtml"}, {"id": "4413757", "title": "顺丰控股：控股子公司参投基金完成私募备案，目标规模7亿元", "content": "顺丰控股公告，公司此前披露下属上市子公司顺丰同城全资子公司深圳同城作为有限合伙人参与投资苏州小雨成溪创业投资合伙企业（有限合伙），基金目标规模7亿元，首次认缴出资总额4.36亿元，深圳同城认缴2.13亿元。近日，基金已完成私募投资基金备案手续并取得备案证明，备案日期为2026年5月26日，托管人为中信银行股份有限公司。", "ctime": 1779876867, "time_str": "18:14:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260527/c677018017.shtml"}, {"id": "4413755", "title": "河化股份：证券简称5月28日起变更为中哲精化", "content": "河化股份公告，公司此前披露拟变更公司名称及证券简称。近日，公司完成工商变更登记，公司名称由“广西河池化工股份有限公司”变更为“广西中哲精化科技股份有限公司”，证券简称由“河化股份”变更为“中哲精化”，启用日期为2026年5月28日，证券代码“000953”保持不变。", "ctime": 1779876846, "time_str": "18:14:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260527/c677017922.shtml"}, {"id": "4413753", "title": "昂利康：拟出资1000万元与专业投资机构共同投资医疗健康领域基金", "content": "昂利康公告，公司拟使用自有资金参与投资专项基金——江苏源津瑞泓创业投资合伙企业（有限合伙）1000万元，该基金主要对医疗健康行业领域非上市企业进行直接或间接的股权投资，基金管理人为上海源津禾润私募基金管理有限公司。本次投资事项在经营管理层权限范围内，无需提交董事会、股东会审议，不构成关联交易及重大资产重组。", "ctime": 1779876807, "time_str": "18:13:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260527/c677017645.shtml"}, {"id": "4413751", "title": "滔搏：2026财年净利润12.67亿元，同比下降1.49%", "content": "滔搏公告，截至2026年2月28日止年度，公司收入257.4亿元，同比下降4.71%；毛利97.85亿元，同比下降5.77%；本公司权益持有人应占利润12.67亿元，同比下降1.49%。董事会建议派发末期股息每股3分，特别股息每股12分。", "ctime": 1779876790, "time_str": "18:13:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260527/c677017642.shtml"}, {"id": "4413743", "title": "国家能源局主要负责同志赴深圳市调研能源强国建设工作", "content": "国家能源局党组书记、局长王宏志带队赴广东省深圳市开展能源强国建设工作调研。王宏志一行实地调研中国海油大鹏液化天然气接收站、中国广核大亚湾核电基地和华润集团，详细了解液化天然气接收设施、核电运行、能源转型等情况。王宏志强调，要提升能源产业链供应链安全水平，加快建设新型能源体系，为现代化建设提供坚强能源保障。当前受中东局势影响国际能源价格高位波动，要密切关注国际市场和国内需求变化，加强液化天然气等基础设施建设运行，做好安全生产，保障迎峰度夏能源安全稳定供应。安全是核电的生命线，是核电发展的前提和基础，要常抓不懈、确保万无一失。要深入推进节能降碳，积极发展绿色燃料、算电协同等新业态。", "ctime": 1779876767, "time_str": "18:12:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260527/c677017635.shtml"}, {"id": "4413741", "title": "3天2板华电辽能：绿氢市场仍处于培育阶段 下游需求和产品价格存在不确定性", "content": "华电辽能公告，公司股票于2026年5月25日、5月26日、5月27日连续三个交易日内日收盘价格涨幅偏离值累计超过20%，属于股票交易异常波动。经公司核实，公司主营火力发电，日常经营情况未发生重大变化，不涉及算电协同项目。公司控股子公司辽宁铁岭华电氢能源科技发展有限公司25MW风电离网制氢一体化项目规模较小，2026年第一季度氢能营业收入为126.48万元，对公司财务数据无重大影响。绿氢市场仍处于培育阶段，下游需求和产品价格存在不确定性。", "ctime": 1779876726, "time_str": "18:12:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260527/c677017618.shtml"}, {"id": "4413735", "title": "伊朗说尚未就霍尔木兹海峡问题与美国达成一致", "content": "伊朗最高国家安全委员会副秘书阿里·巴盖里表示，伊朗与美国尚未就霍尔木兹海峡相关问题达成一致。巴盖里表示，伊朗与阿曼目前正就船只通过霍尔木兹海峡的新机制进行磋商，伊美之间的间接接触也仍在继续。他同时表示，伊朗浓缩铀问题当前不在伊美谈判议程之中。（新华社）", "ctime": 1779876685, "time_str": "18:11:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260527/c677017604.shtml"}, {"id": "4413725", "title": "大北农：拟以5000万元-8000万元回购公司股份", "content": "大北农公告，拟以5000万元-8000万元回购公司股份，回购价格不超过5.7元/股（含）。预计回购股份数量约为877.19万股-1403.51万股，约占公司目前总股本的0.20%-0.33%。", "ctime": 1779876612, "time_str": "18:10:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260527/c677017290.shtml"}, {"id": "4413717", "title": "天健集团：董事长郑晓生因工作调动辞职", "content": "天健集团公告，公司董事会于2026年5月27日收到董事长郑晓生先生提交的辞职报告，其因工作调动原因辞去公司董事、董事长及公司其他所有职务，辞职后将不再担任公司任何职务。辞职报告自送达董事会之日起生效，未导致董事会成员低于法定最低人数。截至公告披露日，郑晓生先生未持有公司股票。公司将尽快完成董事补选及董事长选举等工作。", "ctime": 1779876530, "time_str": "18:08:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260527/c677017253.shtml"}, {"id": "4413715", "title": "涛涛车业：重新向香港联交所递交H股发行上市申请", "content": "涛涛车业公告，公司于2026年5月26日向香港联交所重新递交了本次发行上市的申请，并于同日在香港联交所网站刊登了更新后的本次发行上市的申请资料。", "ctime": 1779876503, "time_str": "18:08:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260527/c677017210.shtml"}, {"id": "4413711", "title": "微信支付正式支持PayPal用户来华扫码支付，首期向美国用户开放", "content": "5月27日，在第20届深圳国际金融博览会开幕式上，腾讯金融科技副总裁洪丹毅宣布，腾讯旗下跨境支付平台TenPay Global与PayPal World已实现互联互通，PayPal用户来华可在中国数千万微信支付商户顺畅消费，首期将面向美国用户开放。（界面）", "ctime": 1779876479, "time_str": "18:07:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260527/c677017197.shtml"}, {"id": "4413709", "title": "兴源环境：子公司拟转让债权，转让价款1857.42万元", "content": "兴源环境公告，公司控股子公司敖汉兴敖环境发展有限公司拟与赤峰兴惠交通发展有限责任公司签订《债权转让协议》，转让敖汉旗城市综合体提升改造及生态保护建设项目PPP项目剩余全部债权。截至交割日债权金额为2063.8万元，转让价款为1857.42万元。本次交易不构成关联交易及重大资产重组，已获公司董事会审议通过。经初步计算，本次债权转让预计将增加公司收益94.67万元。", "ctime": 1779876465, "time_str": "18:07:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260527/c677017194.shtml"}, {"id": "4413697", "title": "刘强东称不会开除被机器人取代员工刘强东称要保住蓝领工人的工作", "content": "一份刘强东最新的内部讲话视频。视频中，刘强东指出，“京东将建成最大物理世界运营商，20年之后，京东依然是中国拥有员工数最多的企业。”他介绍，京东内部启动了“涅槃项目”，本质就是要保住无数个蓝领工人的工作。在新技术浪潮下，京东在全国建立了80多个robobase（项目），培训蓝领工人机器人维修保养等新技能，帮助蓝领工人白领化，使其成为收入更高、更受社会需要的高级技术工人。刘强东称，“现在我们兄弟们很不容易，在大街上走，风里来雨里去，很苦很累，虽然我们给他们的收入待遇、各种保障是业内最好的，但对于我来讲，他们还是痛苦的，不是会让人享受的一种活”。他强调，对于被机器取代的一线员工，京东一个都不会开除，京东要把新技术对蓝领工人及其家庭的冲击降到最低。（新浪科技）", "ctime": 1779876304, "time_str": "18:05:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260527/c677017056.shtml"}, {"id": "4413691", "title": "汇成股份：拟以6000万元-1.2亿元回购公司股份", "content": "汇成股份公告，拟以6000万元-1.2亿元回购公司股份，回购价格不超过27.71元/股。", "ctime": 1779876113, "time_str": "18:01:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260527/c677016982.shtml"}, {"id": "4413687", "title": "江西省委常委、统战部部长李伟被查", "content": "江西省委常委、统战部部长李伟涉嫌严重违纪违法，目前正接受中央纪委国家监委纪律审查和监察调查。（央视新闻）", "ctime": 1779876038, "time_str": "18:00:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260527/c677016969.shtml"}, {"id": "4413667", "title": "长信科技：子公司拟采购服务器不超过30亿元", "content": "长信科技公告，公司子公司长信智算拟向多家供应商采购服务器，总金额预计不超过30亿元，主要用于为客户提供算力服务。本次交易不构成重大资产重组或关联交易，已获董事会审议通过，无需提交股东会审议。公司提示，算力业务尚处拓展初期，存在市场、技术、资金等风险，短期内可能增加财务费用并影响业绩。", "ctime": 1779875803, "time_str": "17:56:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260527/c677016817.shtml"}, {"id": "4413663", // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
