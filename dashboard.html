61127/c682267974.shtml"}, {"id": "5770309", "title": "英国富时100指数上涨2%，至10635.45点", "content": "英国富时100指数上涨2%，至10635.45点。", "ctime": 1795709432, "time_str": "00:10:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261127/c682267930.shtml"}, {"id": "5770297", "title": "特朗普指政府蓄意低报经济增长 要求展开调查", "content": "美国总统唐纳德·特朗普指责自己的政府“蓄意”低报美国经济增长，他抓住一次例行数据修正，以此作为其提出选举干预指控的依据，但并未提供任何证据。特朗普周四在社交媒体发帖指出，GDP数据显示美国经济第三季度按年率计算增长4.3%，高于此前公布的3.4%估计值，并称这是一个“重大差异”。他在没有提供证据的情况下表示，“刚刚披露的情况显示，选举前公布的所谓经济真实数据其实是假的。”特朗普还表示，“我要求立即对此展开调查。这不是一个小错误，而是一个巨大且蓄意造成的错误。”这则帖子是在美国感恩节当天上午从他位于西棕榈滩的高尔夫球场发出的。（新浪财经）", "ctime": 1795708638, "time_str": "23:57:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261126/c682267834.shtml"}, {"id": "5770279", "title": "阿联酋迪拜航空将恢复迪拜至以色列特拉维夫航班", "content": "总台记者当地时间11月26日自以色列方面获悉，阿联酋迪拜航空公司将于12月3日起恢复迪拜国际机场至以色列特拉维夫本-古里安国际机场的直飞航班，相关航班已开放预订。有消息人士证实，以色列看守政府交通部长雷格夫本周早些时候决定，在通过以色列国家安全总局（辛贝特）、以色列情报和特勤局（摩萨德）及国家安全委员会安全审查的前提下，允许迪拜航空复航。目前，相关批准已在“新的安保安排下”正式生效，但以色列本国航空公司仍暂未恢复飞往迪拜的航班。今年9月30日，载有以色列乘客的迪拜航空FZ1073航班从阿联酋迪拜飞往以色列特拉维夫途中发生安全事件。迪拜航空自当天起暂停飞往以色列的航班。（央视新闻）", "ctime": 1795708306, "time_str": "23:51:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261126/c682267825.shtml"}, {"id": "5770267", "title": "瑞银承诺维持全球业务布局 回应瑞士议会委员会支持加码资本监管", "content": "瑞银集团最高管理层本周致信员工，试图向他们保证，瑞士收紧监管的努力不会夺走该行历经数十年打造的成果——一项真正意义上的全球化业务。一份11月24日员工备忘录显示，董事长Colm Kelleher和首席执行官Sergio Ermotti表示，该行仍“完全致力于我们的战略、增长目标和全球布局”。这份备忘录是对议会一个关键委员会周二投票结果的回应。该委员会支持将资本金要求提高160亿美元，这对瑞银而言是又一次挫折。（新浪财经）", "ctime": 1795708013, "time_str": "23:46:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261126/c682267814.shtml"}, {"id": "5770233", "title": "乌克兰称其在夜间袭击了俄罗斯的斯拉维扬斯克炼油厂", "content": "乌克兰称其在夜间袭击了俄罗斯的斯拉维扬斯克炼油厂。（财联社）", "ctime": 1795706552, "time_str": "23:22:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261126/c682267768.shtml"}, {"id": "5770205", "title": "以色列正直党与民主党就双边组阁协议达成一致", "content": "以色列正直党和以色列民主党发表联合声明，称两党已经就双边组阁协议达成共识。以色列民主党由此成为继“以色列是我们的家园”党之后，第二个与正直党敲定组阁协议的反对派阵营政党。根据两党发布的联合声明，若新政府顺利组建，以色列民主党将获得国家安全部以及劳工和福利部、通信部、文化与体育部四个政府部长职位。此外，两党承诺废除内塔尼亚胡政府此前推行的司法改革，并维护司法系统独立性。据悉，正直党领导人埃森科特正加紧推进反对派阵营内部的整合，并计划在28日晚前与团结党领导人贝内特就组阁协议达成一致，从而锁定阵营内全部犹太裔政党所持有的48个议会席位。（央视新闻）", "ctime": 1795705906, "time_str": "23:11:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261126/c682267705.shtml"}, {"id": "5770181", "title": "期市夜盘收盘，国内期货主力合约多数上涨，乙二醇涨超2%", "content": "期市夜盘收盘，国内期货主力合约多数上涨。涨幅方面，乙二醇、菜粕涨超2%，短纤、菜油涨超1%。跌幅方面，铁矿石跌超2%，苯乙烯、纯碱、合成橡胶跌超1%。", "ctime": 1795705227, "time_str": "23:00:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261126/c682267623.shtml"}, {"id": "5770169", "title": "特朗普表示，希望看到俄罗斯总统普京撤回其在欧洲各地的一切军事行动", "content": "特朗普表示，希望看到俄罗斯总统普京撤回其在欧洲各地的一切军事行动。", "ctime": 1795705100, "time_str": "22:58:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261126/c682267609.shtml"}, {"id": "5770167", "title": "沙特称西南部一炼油厂遭胡塞武装袭击", "content": "沙特阿拉伯主导的多国联军发言人26日在社交媒体平台表示，沙特西南部吉赞炼油厂遭胡塞武装袭击。(新华社)", "ctime": 1795705065, "time_str": "22:57:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261126/c682267605.shtml"}, {"id": "5770165", "title": "110支队伍参加2026机器人技能大赛", "content": "2026机器人技能大赛26日在深圳市龙岗区落下帷幕。本届大赛以“技赋新质智启新境”为主题，设置了“城域智治”民生服务、“产线争锋”工业灵巧机器人、开源鸿蒙竞技三大赛道，把民生服务、工业精密制造的岗位需求嵌入竞赛场景。当日，来自全国各地的政企学研专家、业内人士、参赛队伍，围绕具身智能产业化这一命题展开对话，共同探寻机器人从实验室走向真实工位、形成新质生产力的可行路径。新华社副社长刘健表示，新华社作为中国国家通讯社、世界性通讯社和中国特色新型智库，始终关注中国机器人产业发展，期待与会各方以此次大赛为契机，进一步推动创新链、产业链、资金链、人才链有效贯通，加快构建开放协同、人机共融的产业生态。深圳市龙岗区副区长徐红丽表示，龙岗区集聚了超800家人工智能企业、1.3万家机器人整机及上下游企业，致力于当好创新主体的试验场、供应链和合伙人，做产业创业者的“长期陪跑者”。在110支参加2026机器人技能大赛的队伍中，来自清森科技、华南农业大学、香港城市大学（东莞）等机构的39支队伍分获不同赛道的各层级奖项。(新华社)", "ctime": 1795705041, "time_str": "22:57:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261126/c682267604.shtml"}, {"id": "5770143", "title": "哈马斯谴责以方持续违反停火协议 正与巴各派别磋商应对措施", "content": "当地时间26日，巴勒斯坦伊斯兰抵抗运动（哈马斯）政治局领导人哈亚发表声明，谴责以色列方面持续违反加沙停火协议并针对巴勒斯坦民众发动军事袭击。哈亚在声明中表示，在现有加沙停火协议框架下，巴方绝不接受“杀戮与封锁”并存的局面。他同时批评美国支持设立的所谓加沙“和平委员会”及相关协议担保方对以方行为保持沉默，称这种态度“不可接受”。哈亚说，哈马斯目前正与巴勒斯坦各政治派别及武装组织进行磋商，共同研究应对以方违反协议及持续袭击巴勒斯坦民众的机制与举措。（央视新闻）", "ctime": 1795704687, "time_str": "22:51:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261126/c682267576.shtml"}, {"id": "5770101", "title": "中蒙俄国际旅客列车顺利抵达乌兰巴托", "content": "26日14时35分，首趟V3/4次中蒙俄国际旅客列车顺利抵达位于蒙古国首都乌兰巴托的乌兰巴托站。中国驻蒙古国大使馆临时代办曹利在接受新华社记者采访时表示，此次开行的中蒙俄国际旅客列车将为乘客带来全新体验，也为中蒙俄经济走廊建设和三国人文交流、经贸往来注入新动能。（新华社）", "ctime": 1795704236, "time_str": "22:43:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261126/c682267519.shtml"}, {"id": "5770077", "title": "刘海星分别会见尼泊尔、巴基斯坦客人", "content": "11月26日，中共中央对外联络部部长刘海星在北京分别会见尼泊尔民族独立党总书记比平和巴基斯坦穆斯林联盟（谢里夫派）秘书长、政府计划发展部长伊克巴尔，就落实双方领导人共识、加强党际交流合作、推动国家关系发展等交换意见。(新华社)", "ctime": 1795703628, "time_str": "22:33:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261126/c682267437.shtml"}, {"id": "5770073", "title": "厄尔尼诺相关降雨灾害已致厄瓜多尔28人死亡", "content": "当地时间11月25日凌晨，受持续强降雨影响，厄瓜多尔洛斯里奥斯省莫卡切地区发生山体滑坡。据悉，此次灾害已造成2人死亡、1人受伤，另有1名未成年人失踪。当地政府宣布进入紧急状态，并要求部分位于高风险区域的居民撤离。厄瓜多尔国家风险管理秘书处25日发布报告显示，自今年8月29日以来，与厄尔尼诺现象相关的降雨灾害已波及该国24个省，累计造成28人死亡、15人受伤，超12万人受到影响。（央视新闻）", "ctime": 1795703543, "time_str": "22:32:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261126/c682267428.shtml"}, {"id": "5770065", "title": "交易提示：美股周四休市一天", "content": "11月26日(周四)，美股休市一天。11月27日(周五)正常开盘，但提前收盘，常规交易时段为美东时间9:30至13:00，对应北京时间11月27日22:30至11月28日2:00。", "ctime": 1795703347, "time_str": "22:29:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261126/c682267390.shtml"}, {"id": "5770051", "title": "*ST香雪：确定广药资本为重整投资人，拟3.56元/股受让29.99%股份", "content": "*ST香雪公告，公司管理人此前披露招募遴选重整投资人事项，根据2026年6月30日评审结果确定广州广药资本有限公司为中选投资人。2026年11月25日，公司管理人与广药资本签署《重整投资协议》，广药资本以3.56元/股支付16.88亿元，获得公司4.74亿股转增股票，占转增后总股本约29.99%，公司控股股东可能变更为广药资本。", "ctime": 1795702929, "time_str": "22:22:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261126/c682267341.shtml"}, {"id": "5769965", "title": "以防长：若哈马斯不解除武装将驱离100万加沙居民", "content": "以色列国防部长卡茨26日在社交媒体发表声明称，如果哈马斯不解除武装，以色列国防军将继续发动军事行动，并驱离100万加沙地带居民。卡茨称，加沙地带70%的区域“已被摧毁”并由以军控制。对于哈马斯控制的剩余30%地区，要么哈马斯“自愿解除武装”，加沙地带实现非军事化；要么以军将继续军事行动，彻底瓦解哈马斯，包括“再次将100万加沙地带居民向南驱离”并“清理”该地区。卡茨还称，以方将对任何希望有序离开加沙地带的人作出“必要安排”。他还表示要“结束哈马斯在加沙地带的控制”。(新华社)", "ctime": 1795701790, "time_str": "22:03:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261126/c682267181.shtml"}, {"id": "5769959", "title": "上海：聚焦重点领域，把握关键抓手，加力形成上海经济高质量发展的有效支撑", "content": "据“上海发布”消息，上海市委副书记、市长朱忠明今天（11月26日）主持召开经济领域工作思路座谈会，深入谋划明年全市经济发展举措。朱忠明指出，要聚焦重点领域，把握关键抓手，加力形成上海经济高质量发展的有效支撑。着力扩大消费，推动商品消费扩容升级，拓展服务消费增长新空间，促进文商旅体展深度融合，打造更多服务消费新场景，吸引更多入境消费。着力提振投资，进一步挖掘工业投资潜力，谋划一批投资大、带动强、成长好的重大项目，强化基础设施投资支撑作用。着力稳住外贸，主动培育更多出口赛道，增强外贸韧性，推动外贸结构转型，不断提升贸易主体竞争力。着力培育壮大新产业，巩固提升三大先导产业竞争优势，不断壮大新兴支柱产业集群，加快建设未来产业应用场景，集聚更多行业龙头、链主企业和“独角兽”企业。着力推进新一轮改革开放举措，聚焦“五个中心”建设和重大战略载体，进一步提高对战略新兴领域国际规则的引领和建构能力。同时，要尽早做好今明两年目标衔接、项目衔接、政策衔接，为明年经济高质量发展奠定坚实工作基础。(人民财讯)", "ctime": 1795701646, "time_str": "22:00:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261126/c682267152.shtml"}, {"id": "5769941", "title": "挪威一廉航停运面临破产风险", "content": "挪威廉价航空运营商北欧大西洋航空公司26日宣布因财务困境暂停航班运营，并表示如果无法获得紧急融资，公司董事会有意申请破产。北欧大西洋航空公司25日发表声明说，其财务状况“危急”，亟须融资以满足短期流动和运营需求。受此消息影响，公司股价大幅下挫。在26日的最新声明中，该公司表示正在考虑各种短期融资方案，并与投资者讨论收购可能性，但无法保证能够找到可行的解决方案。（央视新闻）", "ctime": 1795701418, "time_str": "21:56:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261126/c682267109.shtml"}, {"id": "5769929", "title": "中国与亚行将推动合作伙伴关系提质升级", "content": "记者11月26日获悉，中国与亚洲开发银行将继续深化合作，推动合作伙伴关系提质升级。当日，中国与亚洲开发银行合作40周年庆暨高层论坛在京举行。活动以“携手四十年，展望新前景”为主题，回顾中国与亚行40周年合作历程，就进一步深化中国与亚行合作等议题进行讨论。（新华社）", "ctime": 1795701096, "time_str": "21:51:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261126/c682267024.shtml"}, {"id": "5769907", "title": "上期所沪镍主力合约站上12万元/吨", "content": "上期所沪镍主力合约站上12万元/吨，日内涨3.77%。", "ctime": 1795700809, "time_str": "21:46:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261126/c682266961.shtml"}, {"id": "5769861", "title": "大商所铁矿石主力合约跌超2%", "content": "大商所铁矿石主力合约跌超2%，报648元/吨。", "ctime": 1795700629, "time_str": "21:43:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261126/c682266904.shtml"}, {"id": "5769799", "title": "阿里加码北美招聘 Qwen团队今年已吸纳数百名AI人才", "content": "阿里正在北美加大招聘力度，主要面向全球顶级AI研究员。目前，Qwen 北美团队已开放多个岗位，涉及模型研究、训练与推理、多模态、智能体（Agent）和数据等方向。有消息人士称，今年全球已有数百人加入阿里Qwen大模型团队。 （科创板日报）", "ctime": 1795699546, "time_str": "21:25:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261126/c682266460.shtml"}, {"id": "5769797", "title": "协创数据：控股子公司光为科技高速光模块已对外供货", "content": "协创数据在投资者关系活动记录表中表示，控股子公司光为科技的高速光模块已对外供货，部分产品已作为满足国家级超算中心要求的供应商实现交付；光为科技生产正有序进行，并持续推进国内智算中心、超算中心及其他外部客户的产品验证和市场拓展。", "ctime": 1795699520, "time_str": "21:25:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261126/c682266455.shtml"}, {"id": "5769661", "title": "期货夜盘开盘，国内期货主力合约涨多跌少", "content": "期货夜盘开盘，国内期货主力合约涨多跌少，沪银涨近4%，乙二醇（EG）涨近3%，沪锌、沪镍、沪锡涨超2%，燃料油、短纤、焦煤涨近2%。跌幅方面，液化石油气（LPG）、氧化铝小幅下跌。", "ctime": 1795698152, "time_str": "21:02:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261126/c682266000.shtml"}, {"id": "5769659", "title": "水利部部长李国英主持召开水利部部务会议", "content": "11月26日，水利部党组书记、部长李国英主持召开部务会议，审议《用水定额管理办法》，研究青藏高原冰湖监测预警及风险防范有关工作。会议强调，要严格落实生态环境法典、水法等法律要求，加快构建覆盖农业、工业、城镇生活等主要用水领域的用水定额管理体系，建立定额实施定期评估和动态更新机制，强化定额刚性约束作用，以用水定额管理制度落实促进用水方式改进优化，提升水资源集约安全利用水平。(人民财讯)", "ctime": 1795698144, "time_str": "21:02:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261126/c682265999.shtml"}, {"id": "5769657", "title": "英国皇家海军总部遭疑似炸弹威胁", "content": "今天（11月26日），位于英国南部港口城市朴次茅斯的英国皇家海军总部遭遇疑似炸弹威胁，警方紧急赶赴现场。英国皇家海军发言人证实，警方及英国国防部人员正在处理一起安全事件，并呼吁公众暂时避开事发区域。目前安全警报据信已经解除，初步消息显示，现场未发现危险物品，相关调查仍在进行。事发军事基地设有英国皇家海军司令部及多个军事训练设施。（CCTV国际时讯）", "ctime": 1795698135, "time_str": "21:02:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261126/c682265993.shtml"}, {"id": "5769643", "title": "TCL中环：回购公司股份实施完毕，累计回购5509.09万股", "content": "TCL中环公告，公司此前审议通过回购公司股份方案，回购总金额不低于人民币4亿元（含）且不超过人民币5亿元（含），回购股份将用于员工持股计划和/或股权激励。截至本公告披露日，本次回购股份方案已实施完毕，公司通过股份回购专用证券账户以集中竞价交易方式累计回购公司股份数量共计5509.09万股，占公司当前总股本的1.36%，最高成交价为9.69元/股，最低成交价为7.64元/股，成交金额约为人民币5亿元（不含交易费用）。", "ctime": 1795698049, "time_str": "21:00:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261126/c682265964.shtml"}, {"id": "5769637", "title": "我国发布全球首个高效灵活燃煤发电技术", "content": "今天，我国自主研发的全球首个新型高效灵活燃煤发电技术成功发布，多项核心指标达到国际领先水平。项目是我国重大技术装备示范项目。应用这一新技术后，相较传统机组，新机组最低可降至额定负荷15%稳定运行，全程无需烧油助燃；可精准跟随电网峰谷波动，适配大规模新能源并网消纳需求。中国工程院院士、怀柔国家实验室科研团队负责人刘吉臻：新一代灵活燃煤发电技术体系，为新能源大规模消纳和电力系统安全稳定运行提供了重要支撑，标志着我国灵活燃煤发电技术达到了国际领先水平。（央视新闻）", "ctime": 1795698014, "time_str": "21:00:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261126/c682265956.shtml"}, {"id": "5769613", "title": "沃尔核材：单通道224G高速线已实现稳定量产", "content": "沃尔核材在投资者关系活动记录表中表示，公司单通道224G高速线已实现稳定量产，在高速通信线业务中占比较高；目前产能满足订单需求，整体订单情况良好。", "ctime": 1795697934, "time_str": "20:58:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261126/c682265914.shtml"}, {"id": "5769583", "title": "深南电路：FC-BGA封装基板26层及以下产品已具备批量生产能力", "content": "深南电路在投资者关系活动记录表中表示，公司FC-BGA类封装基板已具备26层及以下产品批量生产能力，30层及以上产品的技术研发及打样工作按期推进中。", "ctime": 1795697701, "time_str": "20:55:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261126/c682265867.shtml"}, {"id": "5769535", "title": "威海市人民政府与山东黄金集团签署战略合作协议", "content": "据“威海发布”消息，11月26日，威海市人民政府与山东黄金集团签署战略合作协议。威海市委书记张海波说，山东黄金集团是威海重要的合作伙伴，本次签约涉及经贸合作、矿产开发、资源整合、绿色智能采选、装备配套等领域，必将有效发挥双方优势，推动威海黄金产业实现更大突破。希望双方尽快完善工作机制，加快推动合作尽快落地见效，在资源开发、对外贸易、本地企业配套等方面持续深化合作，努力取得更多成果。(人民财讯)", "ctime": 1795697052, "time_str": "20:44:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261126/c682265665.shtml"}, {"id": "5769525", "title": "艾艾精工：提名5名第六届董事会董事候选人，换届尚待股东会审议", "content": "艾艾精工公告，公司第五届董事会任期原定至2027年10月届满，鉴于控制权已发生变更，公司拟提前进行董事会换届。公司董事会已审议通过第六届董事会非独立董事及独立董事候选人提名议案，提名袁源、涂国圣、卢群为非独立董事候选人，岳远斌、陈希为独立董事候选人； // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

    </div>

  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
