 "content": "28日四川省内江市隆昌市发生5.1级地震，21时40分许，四川省隆昌市应对地震防灾救灾工作领导小组办公室通报地震情况，地震发生后隆昌市第一时间启动应急响应，经全域全面摸排隐患，截至目前暂未发现人员伤亡、房屋倒塌等情况。隆昌市电力、通信、燃气、供水和交通等秩序正常。记者28日18时许在震中的胡家镇元嘴村走访看到，房屋整体未见明显损伤，部分旧房的外墙和内部可见轻微裂纹，屋檐下散落着少量被震落的瓦片。村民彭文琴和邻居说，地震发生时大家迅速跑到院坝避险，摇晃了大概十秒。当地干部介绍，将做好群众心理疏导工作，并坚持“有备无患”原则，同步备足应急物资，预设临时安置点位。（新华社）", "ctime": 1787926995, "time_str": "22:23:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260828/c679408206.shtml"}, {"id": "5060973", "title": "乌克兰基辅多次响起爆炸声", "content": "当地时间28日，据总台记者消息，乌克兰基辅多次响起爆炸声，此前曾拉响防空警报。(央视新闻)", "ctime": 1787926610, "time_str": "22:16:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260828/c679408134.shtml"}, {"id": "5060937", "title": "日媒：丰田将在中国生产下一代电动汽车", "content": "日本丰田汽车公司计划于明年秋季在中国生产下一代电动汽车，新车型为丰田旗下品牌雷克萨斯的运动型多用途车（SUV）。新车型计划在丰田上海新工厂生产，首年产量约为每月1000辆，2028年起年产量将提升至数万辆。业内人士认为，丰田此举不仅着眼于中国市场，也意在借助中国的技术和产业优势提升全球竞争力。随着中国新能源汽车市场快速发展，丰田加大在华研发投入，将部分电动汽车研发业务转向中国，加快产品开发进程。（新华社）", "ctime": 1787926393, "time_str": "22:13:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260828/c679408081.shtml"}, {"id": "5060881", "title": "现货黄金一度跌破4550美元/盎司，为8月21日以来新低", "content": "现货黄金一度跌破4550美元/盎司，为8月21日以来新低。", "ctime": 1787926101, "time_str": "22:08:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260828/c679408024.shtml"}, {"id": "5060861", "title": "美联储主席沃什：通胀仍高于2%目标，当前首要任务是控制物价", "content": "8月28日，美联储主席沃什表示，美国经济整体表现强劲，劳动力市场稳定，但通胀仍明显高于美联储2%的目标，当前货币政策应重点关注物价稳定。他表示，过去12个月个人消费支出（PCE）价格指数上涨3.7%，过去6个月年化涨幅为4.1%，表明通胀仍处于较高水平。沃什同时表示，商业资本支出快速增长，今年超过一半的资本支出增长可能与人工智能建设有关；实际消费者支出过去四个季度增长超过2%，失业率为4.1%，整体就业市场与充分就业相符。他强调，美联储应减少对“前瞻指引”的依赖，根据最新、准确的数据作出利率决策，并表示“2%的价格稳定目标是坚定且固定的目标”。（界面新闻）", "ctime": 1787925963, "time_str": "22:06:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260828/c679407994.shtml"}, {"id": "5060591", "title": "现货白银站上71美元/盎司", "content": "现货白银站上71美元/盎司，日内涨2.53%。", "ctime": 1787925387, "time_str": "21:56:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260828/c679407839.shtml"}, {"id": "5060583", "title": "尼泊尔山洪遇难人数升至579人 1924人失联", "content": "据尼泊尔国家减少灾害风险管理局28日公布的数据，尼泊尔北部地区山洪造成的死亡人数升至579人，失联人数升至1924人。（央视新闻）", "ctime": 1787925229, "time_str": "21:53:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260828/c679407813.shtml"}, {"id": "5060553", "title": "美国8月芝加哥PMI 47.1，预期 57.9，前值 57.6", "content": "美国8月芝加哥PMI 47.1，预期 57.9，前值 57.6。", "ctime": 1787924834, "time_str": "21:47:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260828/c679407713.shtml"}, {"id": "5060527", "title": "四川九洲：2026年上半年净利润8119.84万元，同比增长43.79%", "content": "四川九洲公告，2026年上半年营业收入25.96亿元，同比增长19.81%；归属于上市公司股东的净利润8119.84万元，2025年同期为5646.82万元，同比增长43.79%；归属于上市公司股东的扣除非经常性损益的净利润4861.06万元，同比增长26.18%。", "ctime": 1787924645, "time_str": "21:44:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260828/c679407632.shtml"}, {"id": "5060447", "title": "公募上半年净利润榜单出炉 3家超20亿元", "content": "随着上市公司半年报密集披露，头部公募经营业绩浮出水面。3家公募上半年净利润超20亿元，广发基金以24.59亿元的净利润位列行业第一，同比增加108.38%；易方达基金净利润为23.33亿元，同比增加24.3%；工银瑞信基金今年上半年实现净利润22.18亿元，同比增长27.11%。此外，目前还有5家公募管理人净利润超10亿元，分别为泰康资管（18.31亿元）、南方基金（15.03亿元）、华夏基金（14.13亿元）、富国基金（11.43亿元）、兴证全球基金（10.12亿元）。（财联社）", "ctime": 1787924187, "time_str": "21:36:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260828/c679407492.shtml"}, {"id": "5060437", "title": "水利部：普热普强藏布堰塞湖面积较27日减少", "content": "水利部信息中心根据8月28日11时43分最新遥感监测分析，普热普强藏布堰塞湖水面面积约10.4万平方米，较27日13时减小约1.6万平方米，这意味着堰塞体已缓慢过流，水量逐渐减少。受8月26日尼泊尔一侧发生泥石流灾害影响，尼泊尔错坚河汇入我国境内普热普强藏布的交汇处附近形成堰塞湖。面对险情，水利部举行专题会商，滚动分析研判普热普强藏布堰塞湖发展态势及可能影响，进一步强化细化落实各项应急处置措施，严防发生次生灾害，全力以赴做好抢险救援水利支持工作。（新华社）", "ctime": 1787924088, "time_str": "21:34:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260828/c679407465.shtml"}, {"id": "5060407", "title": "陈绍旺会见联合国人居署区域项目司司长帕特里克", "content": "8月25日，住房城乡建设部副部长陈绍旺会见联合国人居署区域项目司司长帕特里克。双方围绕全球可持续发展城市奖（上海奖）、建设联合国人居署中国办公室、更好分享中国经验和方案等领域合作展开深入交流。陈绍旺表示，中国与联合国人居署历来保持着友好合作关系，近年来，双方在世界城市日、全球可持续发展城市奖（上海奖）、《新城市议程》落实等方面取得丰硕成果。未来，期待双方探索通过培训、项目合作、知识分享等为其他国家提供中国经验，以建设联合国人居署中国办公室为契机，推动双方合作迈上新台阶。帕特里克表示，联合国人居署十分重视与中方合作，双方在住房建设、人工智能应用等方面合作前景广阔，希望继续拓展合作路径，共同为实现“人人享有适当住房”目标和全球城市可持续发展贡献力量。住房城乡建设部有关司局负责同志参加会见。（中国建设报）", "ctime": 1787923918, "time_str": "21:31:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260828/c679407446.shtml"}, {"id": "5060389", "title": "国瑞科技：2026年上半年净利润亏损2133.57万元", "content": "国瑞科技公告，2026年上半年营业收入7805.94万元，同比下降25.45%；归属于上市公司股东的净利润亏损2133.57万元，2025年同期亏损2493.3万元；归属于上市公司股东的扣除非经常性损益的净利润亏损2307.05万元，2025年同期亏损2820.5万元。", "ctime": 1787923895, "time_str": "21:31:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260828/c679407420.shtml"}, {"id": "5060331", "title": "美股开盘：美股三大指数涨跌不一", "content": "美股三大指数涨跌不一，标普500指数涨0.07%，道指涨0.22%，纳指跌0.1%。大型科技股方面，超威半导体跌1.41%。中概股方面，哔哩哔哩涨2.17%，小鹏集团涨1.68%，理想汽车涨1.15%。", "ctime": 1787923835, "time_str": "21:30:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260828/c679407412.shtml"}, {"id": "5060315", "title": "宁波华翔：2026年上半年净利润7.23亿元，同比扭亏为盈", "content": "宁波华翔公告，2026年上半年营业收入102.49亿元，同比下降20.42%；归属于上市公司股东的净利润7.23亿元，上年同期亏损3.74亿元，同比扭亏为盈；归属于上市公司股东的扣除非经常性损益的净利润5.49亿元，同比下降8.41%。营业收入下降主要因上年剥离的海外业务本期不再纳入合并报表范围；扣非净利润下降受新兴业务培育期持续投入、下游市场需求下降、原材料成本上升及美元升值产生汇兑损失等因素影响。", "ctime": 1787923808, "time_str": "21:30:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260828/c679407399.shtml"}, {"id": "5060283", "title": "扎波罗热核电站接连发生3起无人机袭击事件", "content": "国际原子能机构28日表示，本周早些时候，乌克兰扎波罗热核电站发生3起无人机事件，凸显武装冲突期间核安全持续面临风险。\n\n据国际原子能机构通报，8月25日，一架无人机在核电站冷却池附近发动袭击，造成两名工作人员受伤。26日，另一架无人机在核电站乏燃料干式储存设施所在地爆炸，第三架无人机据报撞击核电站动力机组系统的喷淋装置。\n\n国际原子能机构表示，核电站现场辐射水平目前仍处于正常范围。\n\n国际原子能机构总干事格罗西表示，任何针对核电站的袭击都是不可接受的，并再次呼吁最大限度保持军事克制，以避免核事故风险。(央视新闻)", "ctime": 1787923533, "time_str": "21:25:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260828/c679407337.shtml"}, {"id": "5060255", "title": "中创新航：2026年上半年净利润15.23亿元，同比增长102.2%", "content": "中创新航公告，2026年上半年收入270.84亿元，同比增长65.0%；期内利润15.23亿元，同比增长102.2%；归属于本公司拥有人利润9.35亿元，2025年同期为4.66亿元；基本每股收益0.5276元，同比增长100.7%。", "ctime": 1787923327, "time_str": "21:22:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260828/c679407300.shtml"}, {"id": "5060253", "title": "IFBH：2026年上半年净利润下降69.4%", "content": "IFBH公告，公司公布截至2026年6月30日止六个月未经审核简明综合业绩，收益5039.5万美元，期内溢利458.2万美元；净利润为460万美元，较2025年同期下降69.4%。台湾地区收入增长31.3%，美国增长133.2%，菲律宾增长496.6%，老挝增长454.4%。", "ctime": 1787923322, "time_str": "21:22:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260828/c679407299.shtml"}, {"id": "5060237", "title": "睿尔曼智能回应人形机器人数据训练中心关停：数据采集模式升级", "content": "8月28日，有媒体报道，北京首个人形机器人数据训练中心已于近日正式停止运营。据悉，睿尔曼智能为该数据训练中心的核心设备与技术提供方。睿尔曼智能相关负责人表示，北京中心的调整是公司数据采集模式从1.0到2.0的主动战略升级。北京中心采用集中式部署，完成的是“实验室场景”数据采集的验证。而具身智能要真正“真干活”，数据必须来自真实场景。因此，公司已将重心转移至常州具身智能数据实验平台（数采中心2.0版）——部署150台RealBOT机器人、覆盖超1000种真实作业任务，依托GLN远程作业网络将机器人规模化部署到工厂、仓库等真实场景中，在“真干活”中采集数据。（中证金牛座）", "ctime": 1787923290, "time_str": "21:21:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260828/c679407292.shtml"}, {"id": "5060191", "title": "天府文旅：董事会审议通过购买34.30%股权议案", "content": "天府文旅公告，公司此前披露拟使用自筹资金购买毕棚沟公司34.30%股权。中介机构已完成尽职调查、审计及评估并出具相关报告；2026年8月27日，公司董事会审议通过购买西部旅游持有的毕棚沟公司34.30%股权议案，购买价格为人民币1.74亿元，尚需提请股东会审批。", "ctime": 1787922966, "time_str": "21:16:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260828/c679407223.shtml"}, {"id": "5060189", "title": "第168次中老缅泰湄公河联合巡逻执法行动圆满结束", "content": "8月28日，中方53109艇顺利返航靠泊西双版纳景哈警务码头，标志着第168次中老缅泰湄公河联合巡逻执法行动圆满结束。截至目前，参加本次行动的中老缅泰四国所有执法船艇及人员全部安全返回。本次行动旨在落实中老缅泰四国执法部门共识，以“共建平安澜湄”为主题，在湄公河高危航道、沿岸码头、急流险滩、支流渡口等重点区域，先后开展四国全线联合巡逻执法、分段巡航、水陆联合查缉以及中老缅三国联合驻训等系列联合执法行动，共走访、检查过往船舶40余艘次，查验各类货物3000余吨，有效排查航道安全风险，有力保障湄公河航运安全，守护流域沿岸群众生命财产安全，为澜湄流域长治久安和合作发展筑牢安全屏障。（央视新闻）", "ctime": 1787922956, "time_str": "21:15:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260828/c679407221.shtml"}, {"id": "5060183", "title": "天府文旅：挂牌转让170处房产，底价5886.28万元", "content": "天府文旅公告，公司拟通过西南联合产权交易所公开挂牌整体转让嘉禾北京城项目170处营业用房产，首次挂牌价格不低于评估值5886.28万元。公司第十二届董事会第七次会议已审议通过相关议案，本次事项尚需提交股东会审批。", "ctime": 1787922950, "time_str": "21:15:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260828/c679407220.shtml"}, {"id": "5060179", "title": "宏微科技：2026年上半年净利润398.57万元，同比增长33.84%", "content": "宏微科技公告，2026年上半年营业收入7.38亿元，同比增长8.49%；归属于上市公司股东的净利润398.57万元，同比增长33.84%，上年同期为297.8万元；归属于上市公司股东的扣除非经常性损益的净利润亏损3534.84万元，上年同期亏损18.39万元。", "ctime": 1787922920, "time_str": "21:15:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260828/c679407216.shtml" // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
