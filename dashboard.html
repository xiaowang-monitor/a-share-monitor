ws.10jqka.com.cn/20260508/c676543194.shtml"}, {"id": "4339317", "title": "两家内地会计师事务所获准从事H股企业审计", "content": "经财政部、中国证监会内地会计师事务所从事H股企业审计业务审核推荐委员会审核认可，并经香港监管机构确认，容诚会计师事务所（特殊普通合伙）、天职国际会计师事务所（特殊普通合伙）获准自2026年5月15日起，可以本所名义在香港资本市场为符合条件的H股公司出具审计报告。增补两家内地会计师事务所从事H股企业审计业务，对于降低内地企业在港上市成本、推动两地资本市场互联互通、促进香港融入国家发展大局具有积极而深远的意义，将有助于进一步深化内地与香港会计交流合作，推动两地会计行业共同发展。财政部、中国证监会将根据内地与香港有关监管要求，对获准从事H股企业审计业务的会计师事务所进行严格管理，确保持续符合要求，推动其高质量完成H股企业审计业务。(人民财讯)", "ctime": 1778227784, "time_str": "16:09:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260508/c676543148.shtml"}, {"id": "4339315", "title": "晓鸣股份：2026年4月销售鸡产品收入1.06亿元，环比增加4.36%", "content": "晓鸣股份公告，公司2026年4月销售鸡产品2691.33万羽，销售收入1.06亿元，环比变动分别为-5.69%、4.36%，同比变动分别为8.18%、-4.16%。", "ctime": 1778227754, "time_str": "16:09:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260508/c676543087.shtml"}, {"id": "4339313", "title": "惠博普：天津百利机械装备集团受让公司25.60%股份 成为控股股东", "content": "惠博普公告，天津百利机械装备集团通过协议转让方式受让公司原控股股东长沙水业集团有限公司持有的3.41亿股股份（占公司总股本的25.60%），过户完成后，公司控制权发生变动，天津百利机械装备集团成为公司控股股东，公司实际控制人变更为天津市人民政府国有资产监督管理委员会。", "ctime": 1778227750, "time_str": "16:09:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260508/c676543068.shtml"}, {"id": "4339309", "title": "贵州省市场监督管理局原局长丁雄军被公诉", "content": "日前，贵州省市场监督管理局原党组书记、局长丁雄军（正厅级）涉嫌受贿罪、洗钱罪一案，由贵州省监察委员会调查终结，移送检察机关审查起诉。经贵州省人民检察院指定管辖，由黔东南州人民检察院依法向黔东南州中级人民法院提起公诉。案件正在进一步办理中。检察机关在审查起诉阶段，依法告知了被告人丁雄军享有的诉讼权利，并依法讯问了被告人，听取了辩护人的意见。黔东南州人民检察院起诉指控：被告人丁雄军利用担任贵州省清镇市委常委、副市长，贵阳市两湖一库管理局党委书记、局长，贵阳国家高新技术产业开发区党工委书记、贵阳市白云区委书记，贵阳市人民政府秘书长，毕节市委常委、市人民政府副市长，贵州省能源局党组书记、局长，中国贵州茅台酒厂（集团）有限责任公司党委书记、董事长等职务上的便利，以及职权或地位形成的便利条件，为他人谋取利益，非法收受他人财物，数额特别巨大；掩饰、隐瞒部分受贿所得的来源和性质，情节严重，依法应当以受贿罪、洗钱罪追究其刑事责任。（最高检）", "ctime": 1778227707, "time_str": "16:08:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260508/c676542873.shtml"}, {"id": "4339301", "title": "塞尔维亚与中国企业签署快速路项目合同", "content": "塞尔维亚政府与中国山东高速集团7日在贝尔格莱德签署一项商业及预融资合同，合作建设连接塞尔维亚中部和东部地区的“卡拉乔尔杰领袖走廊”快速路项目。 塞尔维亚总统武契奇在签约仪式上表示，这条快速路将有效连接首都贝尔格莱德南部郊区与塞中部地区。他高度评价中方合作伙伴展现出的高效率、严谨和责任感，并指出，塞尔维亚近年来基础设施建设快速发展，很大程度上得益于与中国企业的成功合作。 中国驻塞尔维亚大使李明表示，“卡拉乔尔杰领袖走廊”对促进塞尔维亚中东部地区互联互通具有重要意义。项目成功签约是中国企业深耕塞尔维亚市场的又一成果，也是中塞双方赓续友谊、共谋发展的重要见证。 根据合同，项目一期全长83公里，预计于2035年前完成二期建设，届时整条快速路总长将达到125公里。(新华社)", "ctime": 1778227611, "time_str": "16:06:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260508/c676542465.shtml"}, {"id": "4339297", "title": "美光科技美股盘前涨超2%", "content": "美光科技美股盘前涨超2%，现报659.82美元。", "ctime": 1778227568, "time_str": "16:06:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260508/c676542303.shtml"}, {"id": "4339291", "title": "民营造船新突破 我国10万立方米超大型乙烷运输船出江试航", "content": "5月8日上午，由我国民营船企建造的首制10万立方米超大型乙烷运输船（VLEC）“鑫福137”，在长江泰州段出江试航，标志着我国民营造船领域在高端特种船舶建造领域再攀高峰。“鑫福137”船长229.9米，型宽36.5米，舱容达10万立方米，技术指标、安全标准、绿色性能均达国际顶尖水平。该船为江苏扬子鑫福造船有限公司建造5艘同型船订单的首制船，这5艘特种船舶总投资约8亿美元。试航期间，江苏海事协调沿江各指挥中心全程进行动态跟踪与实时监控，及时发布航行警告与安全信息，并调派11艘海巡艇在关键航段进行全程护航与现场交通组织，为此次试航构筑了一条安全、畅通的“水上绿色通道”。（央视新闻）", "ctime": 1778227541, "time_str": "16:05:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260508/c676542226.shtml"}, {"id": "4339283", "title": "Hubspot美股盘前跌超20%", "content": "Hubspot美股盘前跌超20%，现报194.0美元。", "ctime": 1778227488, "time_str": "16:04:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260508/c676542061.shtml"}, {"id": "4339279", "title": "长江防总：预计长江流域主汛期降水总体偏少", "content": "5月7日，记者从长江防汛抗旱总指挥部了解到，今年汛期长江流域气候年景总体偏差，部分时段流域内可能旱涝并存。当前长江流域已全面进入汛期。据流域气象中心最新预测，2026年长江流域汛期涝旱并重，长江中游旱重于涝，强对流天 le": "金达威：预计触发可转债转股价格向下修正条件", "content": "金达威公告，自2026年4月21日至2026年5月7日，公司股票已有10个交易日的收盘价低于当期转股价格的85%，预计将可能触发“金威转债”转股价格向下修正条件。若触发条件，公司将于触发条件当日召开董事会审议决定是否修正转股价格，并及时履行信息披露义务。", "ctime": 1778227225, "time_str": "16:00:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260508/c676541086.shtml"}, {"id": "4339249", "title": "拉夫劳伦美股盘前跌超14%", "content": "拉夫劳伦美股盘前跌超14%，现报302.235美元。", "ctime": 1778227217, "time_str": "16:00:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260508/c676541080.shtml"}, {"id": "4339237", "title": "四川：修订省促进人工智能产业链发展若干政策，扩容“算力券”、启动“词元（Token）券”", "content": "四川省人民政府办公厅近日印发《四川省加快推进“人工智能+”一号创新工程实施方案》，其中提出，加强政策保障。修订省促进人工智能产业链发展若干政策，扩容“算力券”、启动“词元（Token）券”，整合相关产业链资金资源对重大标志性应用场景予以集中支持，提升政策精准度和及时性。建立融资“白名单”，为符合条件的创新型企业设置便捷审贷制度和放款绿色通道。优化人工智能基础设施地方政府专项债工作流程，提升项目谋划和建设质效。支持协会、联盟等开展产品推广、供需对接等服务。加大人工智能领域财政支持力度，加快推进核心技术攻关、重大示范应用、重大项目实施，以政府资金引导更多社会资本参与。（人民财讯）", "ctime": 1778227199, "time_str": "15:59:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260508/c676541051.shtml"}, {"id": "4339231", "title": "四川：到2027年新一代智能终端、智能体等应用普及率超70%", "content": "四川省人民政府办公厅近日印发《四川省加快推进“人工智能+”一号创新工程实施方案》，方案提出，到2027年，实现人工智能与重点领域广泛深度融合，新一代智能终端、智能体等应用普及率超70%，形成2—3个具有全国竞争力的细分赛道产业集群，重点支持打造10个左右具有全国影响力的行业标杆大模型、研发一批轻量化端侧模型，建设10个左右行业领域重大标志性应用场景，建成20个左右应用场景实验室等公共平台。到2030年，争创1—2个国家级新兴产业集群、建设200家智能制造先进工厂，集聚人工智能企业2500家以上、产业规模突破4000亿元，加快建成具有全国影响力的人工智能创新策源地和应用先导区，新一代智能终端、智能体等应用普及率超90%。到2035年，全面步入智能经济和智能社会发展新阶段。（人民财讯）", "ctime": 1778227061, "time_str": "15:57:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260508/c676540950.shtml"}, {"id": "4339219", "title": "外交部：中洪合作不针对第三方 也不应受第三方干扰", "content": "5月8日，外交部发言人林剑主持例行记者会。有记者就中洪关系提问。对此，林剑表示，世界上只有一个中国，台湾是中国领土不可分割的一部分，中华人民共和国政府是代表全中国的唯一合法政府。一个中国原则是国际社会普遍共识和国际关系基本准则，也是中洪发展关系、开展合作的政治基础和前提条件。中洪的合作不针对第三方，也不应受第三方干扰。（央视新闻）", "ctime": 1778226892, "time_str": "15:54:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260508/c676540864.shtml"}, {"id": "4339201", "title": "外交部回应3家中国企业入选美国《时代》周刊 “最具影响力人工智能公司”榜单", "content": "5月8日，外交部发言人林剑主持例行记者会。有记者问：日前，美国《时代》周刊发布了“2026年最具影响力的10家人工智能公司”榜单，中国有3家企业入选。有观点称这充分体现了中国AI产业和技术发展的成就。发言人对此有何回应？对此，林剑表示，在许多人工智能相关评选中，中国企业和产品都榜上有名。这是科技自主创新与发展进步的直接体现。中国始终坚持走开放共赢的人工智能创新之路，欢迎各国企业到中国市场的“健身房”一展身手，在创新发展中锤炼筋骨、相互成就。（央视新闻）", "ctime": 1778226749, "time_str": "15:52:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260508/c676540744.shtml"}, {"id": "4339195", "title": "中关村：下属公司多多药业非布司他片获得《药品注册证书》", "content": "中关村公告，下属公司多多药业有限公司研制的“非布司他片”通过药品注册审评审批，获得国家药品监督管理局核准签发的《药品注册证书》（证书编号：2026S01403、2026S01404）。非布司他片为2-芳基噻唑衍生物，适用于痛风患者高尿酸血症的长期治疗。除多多药业外，国内非布司他片上市销售的企业有42家。药智数据显示，2025年非布司他片在国内样本医院终端销售额为6.21亿元。截至本公告披露日，非布司他片仿制药注册申请项目公司已累计投入研发费用1143.9万元。", "ctime": 1778226708, "time_str": "15:51:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260508/c676540701.shtml"}, {"id": "4339175", "title": "中疾控：我国无安第斯病毒人类感染病例报告", "content": "世界卫生组织日前通报，4月1日，一艘从阿根廷出发的极地探险邮轮上，暴发了汉坦病毒感染疫情。记者8日从中国疾控中心了解到，本次疫情涉及的安第斯病毒目前在我国境内无自然宿主分布，也无人类感染病例报告。 根据中国疾控中心发布的健康提示，汉坦病毒是一组主要由啮齿动物携带的病毒，可引起明确疾病的汉坦病毒有20多种，不同种病毒引起的临床表现差异显著，主要分为肾综合征出血热和汉坦病毒肺综合征。其中，引起汉坦病毒肺综合征的病毒，主要包括新诺柏病毒、安第斯病毒等。 健康提示明确，汉坦病毒感染一般不引起人与人之间传播，日常社交、公共场所普通接触不会造成病毒传播。 减少人与啮齿类动物的接触，是预防汉坦病毒感染的主要策略，有效的措施包括保持家庭和工作场所清洁，及时清理杂物，避免直接接触鼠类及其排泄物、尸体；在野外露营、在农田、林区、工地劳作、进入久未有人居住的屋舍，避免接触各类野生动物及其排泄物或分泌物，避免坐在草丛或鼠洞附近；对啮齿动物尿液和粪便消毒处理等。(新华社)", "ctime": 1778226599, "time_str": "15:49:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260508/c676540597.sht const META     = {"update_time": "2026-05-08 16:45:58", "sentiment_score": 53.52422907488987, "agents": []};

// 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
