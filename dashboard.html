s.10jqka.com.cn/20260518/c676773339.shtml"}, {"id": "4375905", "title": "广西水利厅、气象局联合发布山洪灾害气象预警", "content": "广西水利厅和广西气象局于5月18日16时联合发布山洪灾害气象预警：预计，5月18日20时至5月19日20时，田林县发生山洪灾害可能性很大（红色预警），凌云县发生山洪灾害可能性大（橙色预警），融水苗族自治县发生山洪灾害可能性较大（黄色预警）。请各影响区注意做好监测、巡查、预警和转移避险等山洪灾害防范工作。（央视新闻）", "ctime": 1779100519, "time_str": "18:35:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260518/c676773241.shtml"}, {"id": "4375901", "title": "国内首次！128通道全植入式脑机接口开启临床试验", "content": "今天，我国正式启动首个128通道全植入式脑机接口系统多中心临床试验，这项试验由首都医科大学附属北京天坛医院担任组长单位，这也标志着我国自主研发的高通量侵入式脑机接口技术进入临床转化的快车道。此次研究采用的侵入式脑机接口系统，由皮层内植入式柔性电极与高集成度全植入式信号采集器两大模块构成。柔性电极采用超薄生物相容材料，可显著降低植入后的免疫反应，同时精准捕获具备高时空分辨率的单神经元动作电位，不仅让系统具备对精细脑电信息实时、高精度解码的能力，更使人机交互的信息传输速率实现数量级跃升。与之配套的全植入式信号采集器采用无线全埋置设计，内置医疗级可充电电池并支持无线充电，可同步采集并传输高通道神经信号。患者可以在更自然、舒适的环境中接受治疗与康复训练，真正满足临床应用的便捷与安全需求。（央视新闻）", "ctime": 1779100504, "time_str": "18:35:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260518/c676773234.shtml"}, {"id": "4375893", "title": "印尼雅加达西部一仓库发生严重火灾", "content": "印度尼西亚雅加达西部一处仓库18日下午发生严重火灾，记者看到现场升起滚滚浓烟。据当地有关部门消息，火灾于当地时间下午2时23分被报告。相关部门随即出动12辆消防车和60名消防人员参与灭火，消防人员迅速赶赴现场展开处置，暂无人员伤亡报告。据了解，火势被认定为红色级别，意味着火势无法依靠常规手段扑灭，须由相关人员进一步介入处理。（新华社）", "ctime": 1779100358, "time_str": "18:32:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260518/c676772811.shtml"}, {"id": "4375885", "title": "丁薛祥在调研算力网建设时强调 加快构建全国一体化算力网 赋能经济社会高质量发展", "content": "近日，中共中央政治局常委、国务院副总理丁薛祥先后在北京、河北、内蒙古调研算力网建设。他强调，要深入贯彻落实习近平总书记重要指示精神，按照“十五五”规划纲要部署，加强顶层设计和科学谋划，推进全国一体化算力网建设和集约高效利用，赋能经济社会高质量发展。（新华社）", "ctime": 1779100265, "time_str": "18:31:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260518/c676772668.shtml"}, {"id": "4375871", "title": "康达新材：向特定对象发行股票申请获同意", "content": "康达新材公告，公司于2026年5月18日收到中国证监会出具的《关于同意康达新材料（集团）股份有限公司向特定对象发行股票注册的批复》（证监许可〔2026〕1156号），同意公司向特定对象发行股票的注册申请。本次发行应严格按照报送深圳证券交易所的申报文件和发行方案实施，批复自同意注册之日起12个月内有效。", "ctime": 1779100223, "time_str": "18:30:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260518/c676772438.shtml"}, {"id": "4375869", "title": "中国卫星：控股股东空间技术院拟减持不超过3%", "content": "中国卫星公告，控股股东中国空间技术研究院持股6.09亿股，占51.46%；因业务发展需要，拟于2026年6月10日至2026年9月9日，通过集中竞价和大宗交易减持不超过3547.45万股，即不超3.00%。其中集中竞价减持不超过1182.48万股，不超1.00%；大宗交易减持不超过2364.97万股，不超2.00%。若期间公司股份发生变动，减持数量将相应调整。", "ctime": 1779100217, "time_str": "18:30:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260518/c676772434.shtml"}, {"id": "4375861", "title": "伊朗称已将最新谈判意见反馈给美方", "content": "伊朗伊斯兰共和国通讯社18日报道，伊朗外交部发言人巴加埃当天表示，伊朗通过巴基斯坦收到美国提出的一系列谈判意见。经过审议，伊方已将最新意见反馈给美方。巴加埃说，对话与谈判是一个持续进行的过程。尽管美国公开表示已拒绝伊朗就结束战争提出的“14点”书面方案，但伊方仍通过巴基斯坦收到一系列修改意见和关切事项。这类对话正通过巴基斯坦持续推进。巴加埃表示，伊朗不会把涉及伊朗权益的问题拿来谈判或妥协。根据《不扩散核武器条约》，伊朗和平利用核能的权利已获得承认，无需任何个人或第三方再次予以承认。伊美尚未讨论核问题的任何细节，现阶段重点放在结束战争上。（新华社）", "ctime": 1779100176, "time_str": "18:29:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260518/c676772403.shtml"}, {"id": "4375859", "title": "绿控传动创业板IPO审核状态变更为“上市委会议通过”", "content": "苏州绿控传动科技股份有限公司创业板IPO审核状态变更为“上市委会议通过”。", "ctime": 1779100100, "time_str": "18:28:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260518/c676772350.shtml"}, {"id": "4375857", "title": "恒翼能创业板IPO审核状态变更为“已问询”", "content": "广东恒翼能科技股份有限公司创业板IPO审核状态变更为“已问询”。", "ctime": 1779100089, "time_str": "18:28:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260518/c676772346.shtml"}, {"id": "4375855", "title": "华润新能源主板IPO审核状态变更为“注册生效”", "content": "华润新能源控股有限公司主板IPO审核状态变更为“注册生效”。", "ctime": 1779100067, "time_str": "18:27:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260518/c676772344.shtml"}, {"id": "4375843", "title": "韩正出席2026年全球贸易投资促进峰会开幕式并致辞", "content": "5月18日，国家副主席韩正在北京出席2026年全球贸易投资促进峰会开幕式并致辞。韩正表示，当前国际形势变乱交织，全球经贸秩序遭受严重冲击。习近平主席指出，面对风险和挑战，任何国家都不可能独善其身，坚持团结合作、开放包容才是人间正道。我们要坚定信念、携手前行，有效把握新机遇、应对新挑战，实现互利共赢基础上的共同发展。韩正提出4点建议，一是共同营造开放合作的国际经济环境，坚定维护多边主义和开放合作，持续推动全球贸易投资自由化便利化。二是共同塑造创新发展新优势，充分发挥新技术的驱动和赋能作用，让科技创新成果更好造福各国人民。三是共同提升产业链供应链韧性，加强产业协同、技术交流和标准对接。四是共同推动全球经济治理体系改革，积极落实全球治理倡议，坚持共商共建共享，坚定维护以世贸组织为核心、以规则为基础的多边贸易体制。韩正表示，今年是中国“十五五”开局之年。中国将持续推动高质量发展，扩大高水平对外开放，打造市场化、法治化、国际化一流营商环境，欢迎各国企业继续深耕中国市场。（新华社）", "ctime": 1779099949, "time_str": "18:25:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260518/c676772289.shtml"}, {"id": "4375829", "title": "国家发改委价格成本和认证中心赴国家能源集团开展座谈交流", "content": "5月13日，国家发改委价格成本和认证中心副主任成钢同志带队赴国家能源投资集团有限责任公司开展座谈交流。双方就新能源、储能、氢能、光热发电等产业发展情况展开交流，了解企业面临的困难和问题，听取有关意见建议。（人民财讯）", "ctime": 1779099693, "time_str": "18:21:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260518/c676772191.shtml"}, {"id": "4375827", "title": "罗马尼亚确诊一例汉坦病毒感染病例", "content": "当地时间18日，罗马尼亚国家公共卫生研究所发布报告称，该国西部城市阿拉德确诊一例汉坦病毒感染病例。目前患者情况稳定，正在接受治疗。罗马尼亚国家公共卫生研究所表示，该病例与暴发汉坦病毒疫情的“洪迪厄斯”号邮轮无关，患者过去三年没有出国旅行史。（央视新闻）", "ctime": 1779099641, "time_str": "18:20:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260518/c676772159.shtml"}, {"id": "4375825", "title": "受天气影响 武汉铁路部门临时停运荆州车站19趟列车", "content": "记者18日从中国铁路武汉局集团有限公司获悉，受天气影响，荆州车站已有19趟列车临时停运。据气象预报，5月17日晚至19日上午湖北全省有大雨到暴雨、局地大暴雨，并伴有强对流天气。为确保旅客列车运行安全，根据降雨影响范围，国铁武汉局18日计划临时停运汉宜铁路、宜万铁路、襄渝铁路等线路部分列车，其中荆州车站停运19趟，具体停运车次可在12306网站（App）查询。（新华社）", "ctime": 1779099621, "time_str": "18:20:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260518/c676772148.shtml"}, {"id": "4375821", "title": "伊朗媒体：伊朗通过巴基斯坦提交14点谈判文本", "content": "据伊朗塔斯尼姆通讯社18日援引消息人士的话报道称，伊朗已通过巴基斯坦将包含14点的最新谈判文本转交美方，核心内容为“结束战争”相关议题。（新华社）", "ctime": 1779099587, "time_str": "18:19:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260518/c676772137.shtml"}, {"id": "4375819", "title": "中国红十字会总会向贵州受灾地区调运物资", "content": "5月18日，针对贵州省多地洪涝、风雹灾害和救灾需求，中国红十字会总会启动四级应急响应，紧急向贵州受灾地区调拨赈济家庭包、毛巾被等物资共2000件，支持当地救灾救助工作。（央视新闻）", "ctime": 1779099547, "time_str": "18:19:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260518/c676772122.shtml"}, {"id": "4375813", "title": "*ST星农：公司股票将于5月20日撤销退市风险警示", "content": "*ST星农公告，公司股票将于2026年5月20日撤销退市风险警示，证券简称变更为“ST星农”。公司股票将在2026年5月19日开市起停牌1天，并于2026年5月20日开市起复牌。公司股票仍在风险警示板交易，日涨跌幅限制为5%。", "ctime": 1779099426, "time_str": "18:17:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260518/c676772049.shtml"}, {"id": "4375803", "title": "圣晖集成：公司中标3.36亿元项目", "content": "圣晖集成公告，近日收到庆鼎精密电子（淮安）有限公司发来的通知，拟委托公司承作「HB0708厂房&HB09厂房一期内装及动力机房一次配工程」案，工程总价预计为人民币3.36亿元（未税）。目前公司尚未与客户签署正式合同，合同签订和合同条款尚存在不确定性，项目实施以最终签署的合同为准。", "ctime": 1779099242, "time_str": "18:14:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260518/c676771962.shtml"}, {"id": "4375801", "title": "伊朗革命卫队称在多地逮捕与美以关联人员", "content": "当地时间18日，伊朗伊斯兰革命卫队表示，在加兹温省、克尔曼省等地采取行动，识别并逮捕了一些与美以有关联的人员。伊朗伊斯兰革命卫队称，这些人员“企图制造不安全或扰乱国家经济体系”。（央视新闻）", "ctime": 1779099213, "time_str": "18:13:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260518/c676771920.shtml"}, {"id": "4375797", "title": "伊朗成立管理霍尔木兹海峡新机构", "content": "伊朗成立管理霍尔木兹海峡的新机构“波斯湾海峡管理局（PGSA）”。记者在社交媒体上看到，一个名为“波斯湾海峡管理局”的账号当天上线。该账号发文自称为官方账号，将对霍尔木兹海峡最新进展进行实时更新。伊朗伊斯兰革命卫队海军转引了这条帖文。伊朗方面尚未就此正式发声。（新华社）", "ctime": 1779099123, "time_str": "18:12:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260518/c676771865.shtml"}, {"id": "4375795", "title": "智元WITA成为全国首例完成大模型备案的具身智能交互模型", "content": "5月18日，根据上海市网信办最新公告的上海市生成式人工智能服务备案情况，智元WITA成为全国第一款实现合规备案的具身智能交互大模型，标志着中国具身智能产业从“技术验证”进入“合规商用”的新阶段。（人民财讯）", "ctime": 1779099112, "time_str": "18:11:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260518/c676771862.shtml"}, {"id": "4375793", "title": "金橙子：收到上交所问询函", "content": "金橙子公告，公司于2026年5月18日收到上海证券交易所科创板公司管理部《关于对北京金橙子科技股份有限公司调整资产收购方案事项的问询函》。问询函要求公司核实并披露关于收益法评估、标的公司收入、交易目的及整合安排等事项。公司将按要求组织回复并履行信息披露义务。", "ctime": 1779099111, "time_str": "18:11:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260518/c676771861.shtml"}, {"id": "4375789", "title": "腾讯音乐发全员信：宣布完成对喜马拉雅收购", "content": "5月18日，腾讯音乐娱乐集团发布公告称，已正式完成对喜马拉雅并购交易的交割，喜马拉雅成为腾讯音乐的全资子公司。界面新闻获悉，当日下午，腾讯音乐娱乐集团执行董事长彭迦信、首席执行官梁柱与集团核心管理团队向全体员工发布全员信。全员信中提及，在AI技术迅猛发展的当下，音乐与音频内容作为人类创造力与智慧结晶的本质反而更加凸显，腾讯音乐与喜马拉雅长久以来的前进方向高度一致，喜马拉雅加入到TME，可以一同创造更大的用户价值，为在线音乐与音频行业开拓更广阔的空间。（界面新闻）", "ctime": 1779099036, "time_str": "18:10:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260518/c676771836.shtml"}, {"id": "4375787", "title": "北京暴雨蓝色预警解除 本次降雨过程结束", "content": "据北京市气象部门18日介绍，受偏南暖湿气流影响，5月16日中午前后至18日凌晨，北京出现明显降雨天气，全市累计降雨量达到暴雨量级。雨带已于18日早晨整体移出北京，暴雨蓝色预警已解除，本次降雨过程结束。（新华社）", "ctime": 1779098812, "time_str": "18:06:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260518/c676771579.shtml"}, {"id": "4375783", "title": "延江股份：终止发行股份及支付现金购买资产并募集配套资金暨关联交易事项", "content": "延江股份公告，公司于2026年5月18日召开第四届董事会第十五次会议，审议通过《关于终止发行股份及支付现金购买资产并募集配套资金暨关联交易的议案》，同意公司终止本次重大资产重组事项。公司原拟以发行股份及支付现金的方式购买宁波甬强科技有限公司98.54%股权，并募集配套资金。由于经与交易对方就本次重大资产重组交易方案进行多轮商洽，各方未能就业绩对赌、并购估值定价等关键核心条款达成一致，本次并购交易进度在执行上具有较大的不确定性，故决定终止本次重大资产重组。", "ctime": 1779098767, "time_str": "18:06:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260518/c676771561.shtml"}, {"id": "4375779", "title": "湖北多地遭遇破纪录强降雨", "content": "近日，湖北多地遭遇破纪录强降雨，多地出现城市内涝、农田被淹，抢险救灾工作正在紧张进行。湖北省气象台决策服务科副科长罗昱介绍，湖北多地遭遇历史同期少见的强降雨，过程极端性强，16日下午至18日13时，湖北恩施、宜昌、荆州等地有46个县（市、区）337个乡镇累计雨量超过100毫米，其中27个乡镇超过300毫米，最大为鹤峰五里乡507毫米。其中17日8时至18日8时，荆州国家站和鹤峰县、五峰县、公安县、荆州区等10个县（市、区）22个乡镇区域站降雨量破历史极值。（新华社）", "ctime": 1779098643, "time_str": "18:04:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260518/c676771484.shtml"}, {"id": "4375777", "title": "润都股份：替米沙坦化学原料药获上市批准", "content": "润都股份公告，近日收到国家药品监督管理局签发的关于替米沙坦化学原料药上市申请批准通知书。公司于2024年10月递交注册申报资料并获受理，2025年11月完成补充研究工作并递交资料，2026年5月获得批准通知书。替米沙坦片主要用于原发性高血压的治疗，原研为德国勃林格殷格翰公司。", "ctime": 1779098643, "time_str": "18:04:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260518/c676771483.shtml"}, {"id": "4375773", "title": "中创物流：董事刘青、楚旭日拟分别减持0.1298%和0.0663%", "content": "中创物流公告，董事、高级管理人员刘青持有公司180.2万股，占0.5198%；楚旭日持有92.4万股，占0.2665%。因个人资金需求，二人拟自本公告披露日起15个交易日后的3个月内，通过集中竞价或大宗交易方式分别减持不超45万股、23万股，分别占公司总股本0.1298%、0.0663%。若减持期间发生送股、资本公积金转增股本、配股等股份变动事项，将按变动情况调整减持数量。", "ctime": 1779098559, "time_str": "18:02:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260518/c676771443.shtml"}, {"id": "4375765", "title": "复洁科技：股东隽洁投资拟减持不超3%", "content": "复洁科技公告，持股7.19% // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}
