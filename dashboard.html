<style>
:root {

* { margin:0; padding:0; box-sizing:border-box; }
body {

  background: var(--bg-primary);
  color: var(--text-primary);
  min-height: 100vh;
}
.mono { font-family: 'JetBrains Mono', monospace; }
.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 20px;
  transition: all 0.2s;
}
.card:hover { background: var(--bg-card-hover); border-color: #334155; }
.badge {
  display: inline-flex; align-items: center; padding: 2px 8px;
  border-radius: 6px; font-size: 12px; font-weight: 500;
}
.badge-s { background: rgba(239,68,68,0.2); color: #ef4444; }
.badge-a { background: rgba(245,158,11,0.2); color: #f59e0b; }
.badge-b { background: rgba(59,130,246,0.2); color: #3b82f6; }
.badge-c { background: rgba(100,116,139,0.2); color: #94a3b8; }
.score-bar {
  height: 6px; border-radius: 3px; background: #1e293b; overflow: hidden;
}
.score-bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s; }
.up { color: var(--red); }
.down { color: var(--green); }
.pulse { animation: pulse 2s infinite; }
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}
.glow { box-shadow: 0 0 20px rgba(59,130,246,0.15); }
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg-primary); }
::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
</style>

              <th class="text-right py-2 px-1">现价</th>

          </thead>
          <tbody id="picks-table"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- 新闻流 + 交易代理 -->
<div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
  <div class="card">

  </div>
</div>

金及某互联网大厂联合领投，嘉御资本、鹏瑞基金、亦庄国投、上海半导体产投、南山战新投，以及老股东招商局创投、顺为资本、弘晖基金、厚雪资本、东方富海跟投。本轮资金将主要用于多模态具身交互系统与情绪基座模型的持续迭代升级，仿生面部核心部件与材料体系的规模化优化，以及标准化交付与全球市场拓展。（界面新闻）", "ctime": 1775539384, "time_str": "13:23:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260407/c675793893.shtml"}, {"id": "4191641", "title": "新石器在宿迁成立智驾智能科技公司", "content": "企查查APP显示，近日，新石器智驾（宿迁）智能科技有限公司成立，经营范围包含：人工智能基础软件开发；人工智能应用软件开发；人工智能理论与算法软件开发；智能机器人的研发；智能机器人销售等。企查查股权穿透显示，该公司由新石器慧通（北京）科技有限公司全资持股。（人民财讯）", "ctime": 1775539159, "time_str": "13:19:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260407/c675793863.shtml"}, {"id": "4191637", "title": "三大指数集体翻绿", "content": "三大指数集体翻绿，保险、银行、白酒板块跌幅居前。全市场仍有3400家个股上涨。", "ctime": 1775539150, "time_str": "13:19:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260407/c675793861.shtml"}, {"id": "4191621", "title": "新天绿能投资成立海上风电新公司", "content": "企查查APP显示，近日，新天绿能海上风电（昌黎）有限公司成立，注册资本3000万元，经营范围包含：风力发电技术服务；太阳能发电技术服务；发电技术服务等。企查查股权穿透显示，该公司由新天绿能、新天绿色能源（香港）有限公司共同持股。（人民财讯）", "ctime": 1775538790, "time_str": "13:13:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260407/c675793804.shtml"}, {"id": "4191615", "title": "中国国民党主席郑丽文率团抵达大陆", "content": "中国国民党主席郑丽文今天（7日）率团抵达上海，并赴南京。中国国民党郑丽文主席就任以来，多次表达希望来大陆访问的意愿。此次访问期间，郑丽文主席一行将到江苏、上海、北京参观访问。（央视新闻）", "ctime": 1775538755, "time_str": "13:12:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260407/c675793800.shtml"}, {"id": "4191607", "title": "国际能源署署长：当前能源危机已超过往三次总和 或迎“黑色四月”", "content": "国际能源署署长法提赫·比罗尔说，当前全球性能源危机程度“比1973年、1979年和2022年（能源危机）加起来还要严重”。他预测危机将加速可再生能源、核能以及电动汽车的开发与发展。据法国方面7日消息，比罗尔在采访中表示，各国短期内应“尽可能谨慎”地节约能源，因为全球能源市场可能面临“黑色四月”。“如果海峡在整个4月期间仍保持关闭状态，原油和成品油的短缺量将是3月的两倍之多。”（央视新闻）", "ctime": 1775538695, "time_str": "13:11:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260407/c675793791.shtml"}, {"id": "4191591", "title": "甘肃一化工厂火灾致3死2伤", "content": "记者4月7日从有关部门获悉，4月6日10时40分许，位于甘肃省玉门市化工园区的甘肃金特化学有限公司发生火灾，造成3人遇难2人受轻伤。记者了解到，事故发生地为企业一个车间，建筑结构为钢筋混凝土结构，总层高3层。事故发生后，当地迅速组织灭火、救援，6日12时14分，现场明火被扑灭；12时57分，现场搜救结束。记者采访了解到，两名伤员受轻伤，正在接受治疗，事故原因正在进一步调查中。目前，甘肃省有关部门正对省内相关化工企业进行风险隐患摸排，坚决防范同类事故重复发生。(新华社)", "ctime": 1775538543, "time_str": "13:09:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260407/c675793760.shtml"}, {"id": "4191539", "title": "仙乐健康回应“澳洲优思益”事件：仅代工两款产品 对公司无重大影响", "content": "仙乐健康微信公众号针对近期“澳洲优思益”产品的相关报道作出回应称，当前事件属于个别品牌营销问题，并不涉及生产制造环节的系统性风险，公司质量体系、合规能力及交付能力均保持稳定。同日，针对“澳洲优思益”品牌造假事件对公司生产经营是否带来影响，仙乐健康相关人士对记者回应称，公司确有接受过广州雅拉源健康产业有限公司的出口订单，由全资子公司安徽仙乐负责生产，但仅承接该客户两款产品的生产业务，并非其所有产品均由公司生产。关于此次事件对公司生产经营及订单交付的影响，仙乐健康相关人士表示无重大影响。（中国证券报）", "ctime": 1775537859, "time_str": "12:57:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260407/c675793610.shtml"}, {"id": "4191535", "title": "云南：加大对足球工作资金支持 全面普及校园足球", "content": "云南省人民政府办公厅发布印发《关于推进云南足球振兴发展的二十条措施》的通知。其中提出，加大对足球工作资金支持。按照零基预算管理要求，根据项目储备、预算执行、绩效管理等情况，结合年度财力状况、轻重缓急等统筹体彩公益金、教育专项经费对足球工作予以资金支持，支持资金重点用于足球青训体系建设、后备人才培养、校园足球、青少年及社会品牌赛事活动组织、足球专业人才培训等。全面普及校园足球。各中小学校要把足球运动纳入立德树人的整体布局和学校发展规划，将足球作为体育课教学内容，并纳入课后延时服务；广泛开展足球项目的教学训练、校园竞赛等活动。各校园足球特色学校要单独设置校园足球专项经费，建设至少1块足球场地，配足用于足球教学训练竞赛要求的器材设施，足球课程设置不得少于体育课总课时的三分之一；小学三年级以上建立班级、年级代表队，普遍建立校队；校队每周训练至少3次，每年组织校内足球联赛，积极组队参加省内各类青少年足球赛事。", "ctime": 1775537732, "time_str": "12:55:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260407/c675793577.shtml"}, {"id": "4191531", "title": "IMF总裁：中东战事将导致全球经济增速放缓", "content": "国际货币基金组织（IMF）总裁格奥尔基耶娃6日表示，中东战事将导致通胀走高和全球经济增长放缓。IMF将于下周公布最新全球经济预测。格奥尔基耶娃6日接受路透社采访时表示，即便中东军事冲突得到快速解决，IMF也将下调经济增长预期并上调通胀预期。如果战事拖延，其对通胀和增长的影响将更大。她说，如果没有这场战争，随着各经济体继续从疫情中复苏，IMF原本会小幅上调全球经济今明两年增长预期。现在，所有路径均指向更高的物价和更缓慢的增长。格奥尔基耶娃表示，缺少能源储备的贫穷和脆弱国家受当前中东冲突的影响将最为严重，一些国家已经开始寻求帮助。她警告，当今世界面临地缘政治紧张局势、技术进步、气候冲击和人口变化等带来的高不确定性。IMF和世界银行将于13日至18日在美国首都华盛顿特区举行2026年春季会议，预计IMF将于14日发布新的《世界经济展望报告》。(新华社)", "ctime": 1775537639, "time_str": "12:53:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260407/c675793562.shtml"}, {"id": "4191529", "title": "曾清林任奕境汽车品牌总经理", "content": "4月7日，曾清林发文官宣加入奕境品牌。曾清林个人微博账号显示，其已认证为“奕境汽车品牌总经理”。此前，东风与华为宣布共同推出全新汽车品牌奕境。", "ctime": 1775537494, "time_str": "12:51:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260407/c675793537.shtml"}, {"id": "4191521", "title": "监控系统出现漏洞，300多人被带走？海康威视回应：假的", "content": "4月7日，一则关于海康威视的传言在社交平台迅速传播。网传图片显示，海康威视监控系统出现漏洞，总部300多人被带走调查。针对这一传言，记者以投资者身份致电海康威视，接线工作人员明确表示，上述传言系谣言，公司不存在上述情况，并强调“不信谣不传谣”。据该工作人员个人了解，公司目前在伊朗暂无相关业务。（21世纪经济报道）", "ctime": 1775537187, "time_str": "12:46:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260407/c675793481.shtml"}, {"id": "4191519", "title": "沙特与巴林间的法赫德国王大桥暂停车辆通行", "content": "法赫德国王大桥管理局7日在社交媒体上发表声明说，因预警平台发布针对沙特阿拉伯东部省的袭击警报，已暂停法赫德国王大桥上的车辆通行。法赫德国王大桥是连接沙特与巴林的关键通道。(新华社)", "ctime": 1775537161, "time_str": "12:46:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260407/c675793474.shtml"}, {"id": "4191517", "title": "清明假期广东高速公路车流量、港珠澳大桥车流量均创历史新高", "content": "记者4月7日从广东省交通运输厅了解到，清明假期（4月4日—6日），广东全省高速公路累计车流量约3027.05万车次，日均车流量1009.02万车次，同比增长19.33%。其中，4月6日，全省高速公路车流量约1084.22万车次，港珠澳大桥车流量达31411车次，双双突破历史纪录。清明假期（4月4日—6日），广东全省跨区域人员流动量累计约1.08亿人次，同比增长18.28%。其中：铁路客运量达575.25万人次，同比增长8.87%。4月6日，广东省自主运营城际铁路客运量达27.13万人次，创历史新高。公路人员流动量累计达1.01亿人次，同比增长19.16%。水路客运量累计达41.93万人次。其中，琼州海峡轮渡旅客吞吐量达25.1万人次，同比增长11.87%。民航客运量累计达69.44万人次，同比增长3.71%。（央视新闻）", "ctime": 1775537041, "time_str": "12:44:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260407/c675793407.shtml"}, {"id": "4191497", "title": "商务部4月9日将召开新闻发布会，介绍近期商务领域重点工作有关情况", "content": "中国网消息，商务部定于4月9日（星期四）下午3时举行新闻发布会，请新闻发言人介绍近期商务领域重点工作有关情况，并答记者问。", "ctime": 1775536352, "time_str": "12:32:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260407/c675793262.shtml"}, {"id": "4191483", "title": "连接沙特和巴林关键桥梁交通中断", "content": "据外媒7日报道，连接沙特阿拉伯与巴林的关键通道——法赫德国王大桥因“伊朗袭击威胁”而交通中断。(新华社)", "ctime": 1775536176, "time_str": "12:29:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260407/c675793227.shtml"}, {"id": "4191469", "title": "美国众议院民主党议员推动弹劾防长赫格塞思", "content": "美国众议院民主党议员亚萨明·安萨里6日说，她将就伊朗战事提出弹劾美国国防部长赫格塞思。安萨里当天发表声明说：“下周我将对赫格塞思提出弹劾，指控他屡次违反就职誓言和宪法职责。只有国会才有权宣战，而不是一个无法无天的总统或他的走狗。”安萨里在声明中表示自己是一名伊朗移民的女儿。她还在社交媒体上说：“美国总统特朗普正在升级一场毁灭性的非法战争……过去48小时，其言论突破所有底线。赫格塞思是这场战争的同谋。”(新华社)", "ctime": 1775535535, "time_str": "12:18:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260407/c675793115.shtml"}, {"id": "4191467", "title": "伊朗设拉子传出剧烈爆炸声", "content": "总台记者当地时间7日获悉，伊朗设拉子传出剧烈爆炸声。（央视新闻）", "ctime": 1775535517, "time_str": "12:18:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260407/c675793113.shtml"}, {"id": "4191457", "title": "深城交牵头低空重点实验室揭牌，面向大规模飞行全链条验证", "content": "从深城交获悉，近日，深城交科技集团股份有限公司牵头，联合中山大学·深圳和电子科技大学（深圳）高等研究院共同建设的“深圳市低空智能交通运行系统重点实验室”正式获批并揭牌。据了解，作为深圳低空经济领域首个获批的重点实验室，该实验室致力于突破大规模飞行条件下低空交通的运行效率与安全韧性瓶颈，构建低空飞行全链路智能管控与安全保障体系，是深城交科研平台体系中的重要组成部分，以硬核科技构建以低空和自动驾驶为重点的地空一体智慧交通系统，为深圳打造全国低空经济发展标杆筑牢创新支点，支撑深圳引领低空产业新格局。（证券时报）", "ctime": 1775535080, "time_str": "12:11:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260407/c675793026.shtml"}, {"id": "4191455", "title": "我国近期查处水电气领域违法案件1万多起 罚没超2亿元", "content": "国家市场监督管理总局7日发布的信息显示，自2025年5月至2026年1月，市场监管总局在全国部署居民水电气计量和收费问题综合整治，共查处水电气领域违法案件约1.4万件，罚没金额约2.35亿元，惠及群众近4400万人。市场监管总局直面群众反映强烈的水电气计量不准、收费不规范等突出痛点，统筹各级市场监管部门协同发力，严处违法违规行为，规范市场秩序。加强民用“三表”计量和价格收费管理，依法严厉查处表具安装前未首检、明码标价不规范、不执行政府定价和政府指导价等违法违规行为，以严厉执法形成有力震慑。对查实存在违规收费行为的水电气公用企业，以“零容忍”态度推进退费整治，督促有关企业累计退费约3亿元。(新华社)", "ctime": 1775535056, "time_str": "12:10:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260407/c675793020.shtml"}, {"id": "4191451", "title": "特朗普威胁媒体交出美军飞行员失踪消息“泄密者”：要么交出消息来源，要么坐牢", "content": "综合美国《国会山报》、美国政治新闻网（Politico）等多家美媒报道，美国总统特朗普当地时间6日在白宫举行的新闻发布会上誓言要找出“泄密者”。据报道，特朗普称此人向媒体透露了美军战机在伊朗境内被击落后美军飞行员失踪的消息，让伊朗知晓有一名美国飞行员“在他们领土的某个地方”。特朗普6日在新闻发布会上对记者说，“他们基本上就是说，我们有（找到）一名（飞行员），还有一个人不见了”，他补充道，媒体原本并不知道有飞行员失踪，直到那名身份不明的泄密者把这一信息透露出去。特朗普说，媒体对此事的报道，使美军营救失踪飞行员的行动变得更加困难。“我们会去找发布这则消息的媒体公司，并告诉他们这是涉及国家安全问题，要么交出来（消息来源），要么就坐牢。我们知道是谁，你们也清楚我们在说谁，因为有些事情是不能做的，结果突然之间，整个伊朗都知道有一名飞行员落在他们领土的某个地方了。”(环球网)", "ctime": 1775534859, "time_str": "12:07:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260407/c675792977.shtml"}, {"id": "4191449", "title": "产业链人士：苹果首款折叠屏手机项目正常推进 产品下半年发布", "content": "4月6日，有媒体报道，富士康正在试产苹果首款折叠屏手机。对此，4月7日，苹果产业链人士向记者表示，苹果首款折叠屏手机项目方案早已确定，目前该项目正在正常推进中，试产是产品正式量产前必经阶段，一般需经过工程验证、设计验证、生产试产验证，最后再到正式量产，按正常推进计划，该产品将于今年秋季发布。（证券时报）", "ctime": 1775534704, "time_str": "12:05:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260407/c675792949.shtml"}, {"id": "4191447", "title": "甘肃玉门一化工企业发生火灾 已致3人死亡", "content": "记者多方核实了解到，4月6日，甘肃省玉门市一家化工企业发生火灾事故，初步掌握，已造成3人死亡2人受伤。目前，事故原因正在进一步调查中。（央视新闻）", "ctime": 1775534647, "time_str": "12:04:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260407/c675792931.shtml"}, {"id": "4191435", "title": "江波龙：存储行业处于高景气周期", "content": "江波龙在互动平台表示，目前存储行业受AI需求拉动，处于高景气周期。公司目前生产经营正常，发展趋势符合行业情况，并将于4月28日同时披露2025年年报和2026年第一季度报告。", "ctime": 1775534393, "time_str": "11:59:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260407/c675792841.shtml"}, {"id": "4191431", "title": "4月7日午间公告一览：距离“光力转债”停止转股日仅剩半个交易日", "content": "光力科技公告，2026年4月7日为“光力转债”最后一个转股日，当日收市前，持有“光力转债”的投资者仍可进行转股，2026年4月7日收市后，未实施转股的“光力转债”将停止转股，剩余“光力转债”将按照101.1元/张的价格被强制赎回。若被强制赎回，投资者可能面临损失。", "ctime": 1775534284, "time_str": "11:58:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260407/c675792816.shtml"}, {"id": "4191429", "title": "小鹏回应与澳大利亚经销商合作破裂：已终止其独家代理资格", "content": "近日小鹏澳大利亚经销商TrueEV公司进入托管程序引发关注。小鹏方面4月7日回应称，已正式向对方发出违约通知，终止其独家代理资格，但保留代理身份。小鹏方面称，在过去两年合作期间，小鹏通过多方渠道了解到，TrueEV已出现资金链断裂并被融资方接管，且超过一年未进行车辆采购，同时未能履行包括454台汽车在内的订单。TrueEV还与当地经销商发生公开商业冲突，导致双方信任基础严重受损。因此，小鹏依据合作协议约定，正式向对方发出违约通知，终止其独家代理资格，但保留代理身份。（新京报）", "ctime": 1775534248, "time_str": "11:57:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260407/c675792809.shtml"}, {"id": "4191427", "title": "盈新发展等成立商业发展新公司 注册资本5000万元", "content": "企查查APP显示，近日，盈新（广东）商业发展有限公司成立，法定代表人为张随心，注册资本为5000万元，经营范围包含：品牌管理；餐饮管理；酒店管理；住房租赁；物业管理；非居住房地产租赁；商业综合体管理服务等。企查查股权穿透显示，该公司由盈新发展、广州西霖朗晟产业服务有限公司等共同持股。（人民财讯）", "ctime": 1775534071, "time_str": "11:54:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260407/c675792764.shtml"}, {"id": "4191425", "title": "沙特完成单孔机器人活体供体肝部分切除术", "content": "沙特阿拉伯费萨尔国王专科医院及研究中心6日宣布，该机构成功完成了全球首批单孔机器人活体供体肝部分切除系列手术。 根据该机构发布的声明，手术通过一个不超过3.5厘米的单一切口完成，而不需要传统机器人手术所需的多个切口，在保持高安全标准的同时，减轻了术后疼痛并加快康复速度。声明说，这标志着器官移植领域的一项重大进步。 肝脏是自主再生能力很强的器官。肝脏移植时，通常只需将供体肝脏的一部分移植到受体体内，一段时间后供体的缺损肝脏就能再生修复到手术前水平。 活体供体通常是为了他人利益而接受手术的健康个体。单孔机器人实施肝部分切除对于保障供体的安全和健康尤为重要。声明介绍，在对6名供体实施的手术中，均只有微量出血且未出现并发症，术后疼痛程度较低，2到3天内即可出院。 声明还指出，该技术还可使为儿童受体供肝的过程更加安全，因为这种情况通常只需切取供体的肝脏左外叶，切除时非常适合单孔入路，可最大程度地减轻供体的手术负担。(新华社)", "ctime": 1775534058, "time_str": "11:54:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260407/c675792759.shtml"}, {"id": "4191423", "title": "北部湾港：平陆运河通航后 预计对公司经营产生积极影响", "content": "北部湾港4月7日在互动平台表示，平陆运河通航后，将有力提升西部陆海新通道运输能力和效率，有助于腹地货源更多地转到北部湾港出海，预计对公司经营产生积极影响。同时，为适应平陆运河通航后带来的运输格局变化，公司积极补齐配套工程设施，提前谋划江海联运港口布局以及实施方案，同时积极营销腹地货源通过平陆运河转北部湾港出海。（人民财讯）", "ctime": 1775533935, "time_str": "11:52:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260407/c675792726.shtml"}, {"id": "4191419", "title": "近期南方将有两轮降雨天气来袭 江南多地累计雨量较大", "content": "今天（4月7日），南方降雨将短暂减弱，但江南南部、华南多地仍有较强降雨。明后天随着副热带高压北抬，降雨核心区也将北移至长江中下游地区。预计4月中旬之前，还有两轮降雨过程将接连来袭，江南多地累计雨量较大，需警惕山体滑坡、泥石流等次生灾害发生。（中国天气网）", "ctime": 1775533711, "time_str": "11:48:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260407/c675792635.shtml"}, {"id": "4191391", "title": "欣旺达在浙江成立电子公司 注册资本1亿元", "content": "企查查APP显示，近日，浙江欣智旺电子有限公司成立，法定代表人为李载波，注册资本为1亿元，经营范围包含电子元器件制造；智能家庭消费设备制造；家用电器研发；家用电器制造；智能车载设备销售等。企查查股权穿透显示，该公司由欣旺达(300207)间接全资持股。（人民财讯）", "ctime": 1775532965, "time_str": "11:36:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260407/c675792447.shtml"}, {"id": "4191379", "title": "ETF午评：港股通50ETF领涨6.40%，科创创新药ETF领跌2.03%", "content": "ETF午间收盘涨跌不一，港股通50ETF（159 const SECTORS  = [{"name": "金融", "hit_count": 44, "etfs": []}, {"name": "消费", "hit_count": 21, "etfs": []}, {"name": "军工", "hit_count": 15, "etfs": []}, {"name": "数据要素", "hit_count": 14, "etfs": []}, {"name": "半导体", "hit_count": 11, "etfs": []}, {"name": "低空经济", "hit_count": 10, "etfs": []}, {"name": "新能源", "hit_count": 8, "etfs": []}, {"name": "人工智能", "hit_count": 8, "etfs": []}];
const META     = {"update_time": "2026-04-07 14:22:16", "sentiment_score": 52.901785714285715, "agents": []};

// 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
