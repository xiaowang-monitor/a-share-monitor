261113/c681797715.shtml"}, {"id": "5659411", "title": "余承东：华为与赛力斯合作进入新阶段", "content": "在今日问界M8上市发布会上，华为常务董事、终端BG董事长余承东表示，问界将进入新的合作阶段：华为继续主导核心技术、产品定义、产品设计及质量流程体系能力，赛力斯主导整车制造、研发工程实施、营销、销售、服务和升级维护。双方将开展联合研发、联合设计，华为主导的工作由赛力斯参与，赛力斯主导的工作华为也全面参与，将在各自擅长领域各司其职、紧密合作。（21世纪经济报道）", "ctime": 1794556454, "time_str": "15:54:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261113/c681797707.shtml"}, {"id": "5659375", "title": "外交部：本届进博会各国企业再次投下“信任票” 展现出深耕中国的意愿和信心", "content": "11月13日，外交部发言人毛宁主持例行记者会。针对第九届中国国际进口博览会在上海闭幕、参展企业数量、展示面积、意向成交额再创新高，百余家企业和机构已签约下届进博会的情况，毛宁表示，中国连续九年举办进博会，坚定敞开大门同世界共享发展机遇；本届进博会各国企业再次对中国市场投下“信任票”，展现出长期深耕中国的意愿和信心。中国市场吸引力源自巨大体量和潜力及制度优势，稳定的政策预期、持续优化的营商环境、不断完善的法律保障是最有效的定心丸。中国将继续办好进博会，坚持开放共赢，将中国高质量发展的确定性转化为世界共同发展的确定性。（央视新闻）", "ctime": 1794556089, "time_str": "15:48:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261113/c681797603.shtml"}, {"id": "5659355", "title": "泰国担心缅甸境内涉中国公司采矿活动或致流入泰国河流受污染，外交部回应", "content": "11月13日，外交部发言人毛宁在例行记者会上回应泰国关切：泰国担心缅甸境内涉中国公司采矿活动可能导致流入泰国的河流受砷污染。毛宁表示，中国政府一贯要求企业履行社会责任，严格保护环境，也愿意同泰国等湄公河国家加强水资源和生态环境保护合作。（澎湃新闻）", "ctime": 1794556020, "time_str": "15:47:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261113/c681797518.shtml"}, {"id": "5659353", "title": "跃岭股份：转让中石光芯5%股权已完成，收到全部股权转让款1.1亿元", "content": "跃岭股份公告，公司此前披露拟与大恒科技签署《股权转让协议》，转让所持中石光芯（石狮）有限公司5%股权，股权转让价格为1.1亿元。本次股权转让已依法完成工商变更登记手续，大恒科技已登记为中石光芯股东并载入股东名册。截至本公告披露日，大恒科技已按协议约定向公司支付全部股权转让价款，公司已收到本次股权转让的全部款项，合计1.1亿元。", "ctime": 1794556003, "time_str": "15:46:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261113/c681797509.shtml"}, {"id": "5659329", "title": "新版《公共场所卫生监督量化分级管理指南》发布 明年起正式实施", "content": "国家疾病预防控制局13日发布新修订的《公共场所卫生监督量化分级管理指南》，明年1月1日起正式实施。《指南》将公共场所卫生信誉度等级由原来的A、B、C三级改为A、B、C、D四级，设立动态管理机制：卫生条件、管理状况变化或出现投诉举报、社会舆情被查实的，监管部门将重新评定等级；因行政处罚等被调低等级的，至少3个月后才能申请重新评级。各级疾控部门应将量化分级结果作为年度监督抽查计划的重要依据，对A级场所可合理降低抽查比例，对D级场所要重点监管、责令整改并依法处理。（央视新闻）", "ctime": 1794555820, "time_str": "15:43:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261113/c681797430.shtml"}, {"id": "5659313", "title": "国家卫生健康委：我国严禁任何形式代孕", "content": "国家卫生健康委新闻发言人杨金瑞在11月13日举行的新闻发布会上表示，我国严禁任何形式代孕。组织代孕属于违法犯罪行为，将面临法律严惩，违背伦理道德。所谓“代孕协议”不受法律保护，参与者还可能面临法律追责。(新华社)", "ctime": 1794555701, "time_str": "15:41:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261113/c681797386.shtml"}, {"id": "5659307", "title": "廖岷会见美国泛大西洋投资集团董事长福特", "content": "2026年11月6日下午，财政部副部长廖岷在京会见美国泛大西洋投资集团董事长福特，就中美经贸关系、人工智能等进行沟通交流。（财政部）", "ctime": 1794555671, "time_str": "15:41:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261113/c681797382.shtml"}, {"id": "5659305", "title": "春秋航空：2026年10月旅客周转量54.91亿人公里，同比增长8.47%", "content": "春秋航空公告，2026年10月可用吨公里数6.17亿吨公里，同比增长8.23%，当年累计61.08亿吨公里，同比增长18.20%；运输周转量5.05亿吨公里，同比增长8.46%，当年累计49.09亿吨公里，同比增长14.65%；旅客周转量54.91亿人公里，同比增长8.47%，当年累计541.27亿人公里，同比增长14.41%；总载运人次306.85万人次，同比增长5.84%，当年累计3008.01万人次，同比增长10.74%；货邮载重量10293.6吨，同比增长2.96%，当年累计92418.19吨，同比增长15.65%；客座率93.41%，同比增加0.24个百分点。截至本月末，公司共运营140架空客A320系列机型飞机。", "ctime": 1794555655, "time_str": "15:40:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261113/c681797374.shtml"}, {"id": "5659297", "title": "栖霞建设：控股子公司提起诉讼追讨占用资金9495.18万元", "content": "栖霞建设公告，控股子公司南京星汇房地产开发有限公司因股东深圳市卓越商业管理有限公司占用资金，向江苏省南京江北新区人民法院提起诉讼，涉案金额9495.18万元，案件已受理未开庭。南京星汇请求判令卓越商管返还占用资金9495.18万元，卓越置业集团有限公司承担连带清偿责任。公司为原告，案件尚未开庭审理，目前尚无法判断对公司本期利润或期后利润的影响。", "ctime": 1794555586, "time_str": "15:39:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261113/c681797335.shtml"}, {"id": "5659295", "title": "ST人福：HW201877胶囊进入IIa期临床试验研究", "content": "ST人福公告，公司全资子公司湖北生物医药产业技术研究院有限公司近日在国家药品监督管理局药物临床试验登记与信息公示平台公示了HW201877胶囊IIa期临床试验登记信息，试验登记号CTR20264268，试验名称为一项评价HW201877胶囊治疗中重度活动性炎症性肠病（IBD）的有效性和安全性的IIa期、开放、多中心临床研究，评估其治疗中重度活动性溃疡性结肠炎（UC）及中重度活动性克罗恩病（CD）的有效性。该胶囊于2025年3月获批临床，适应症为炎症性肠病，目前国内暂无同靶点同适应症药物上市，该项目累计研发投入约为6000万元。", "ctime": 1794555581, "time_str": "15:39:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261113/c681797334.shtml"}, {"id": "5659291", "title": "广信股份：首次回购公司股份66500股，支付66.45万元", "content": "广信股份公告，公司此前审议通过回购公司股份用于员工持股计划或股权激励，回购资金总额不低于人民币5000万元且不超过1亿元，回购价格不超过人民币15.57元/股。2026年11月12日，公司通过集中竞价交易方式首次实施回购公司A股股份，回购股份数为66500股，占公司总股本的比例为0.0073%，成交最高价为人民币10.02元/股，成交最低价为9.98元/股，支付的资金总额为人民币66.45万元（不含交易费用）。", "ctime": 1794555570, "time_str": "15:39:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261113/c681797331.shtml"}, {"id": "5659255", "title": "弹劾防长不成 美民主党要查卫生部长", "content": "本周试图弹劾美国国防部长赫格塞思受阻后，国会民主党人着手调查卫生与公共服务部长小罗伯特·肯尼迪。据悉，随着明年1月民主党人重新掌控国会，包括国务卿鲁比奥在内一批高官也可能受到调查乃至弹劾。（央视新闻）", "ctime": 1794555213, "time_str": "15:33:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261113/c681797080.shtml"}, {"id": "5659235", "title": "爱克股份等成立智能科技公司 含云计算设备业务", "content": "据企查查APP显示，近日，巢湖爱克莱特智能科技有限公司成立，经营范围包含半导体照明器件制造、半导体照明器件销售、云计算装备技术服务、云计算设备销售、集成电路芯片设计及服务等。企查查股权穿透显示，该公司由爱克股份等共同持股。（人民财讯）", "ctime": 1794555131, "time_str": "15:32:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261113/c681797048.shtml"}, {"id": "5659225", "title": "西藏矿业：氯化钾为伴生产品当前营收占比相对有限", "content": "西藏矿业11月13日在互动平台表示，公司主要产品包括锂精矿、碳酸锂、氯化钾、铬铁矿，氯化钾为相关伴生产品，当前营收占比相对有限。（人民财讯）", "ctime": 1794555099, "time_str": "15:31:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261113/c681797038.shtml"}, {"id": "5659195", "title": "江苏省徐州市人大常委会党组书记、主任王安顺被查", "content": "江苏省徐州市人大常委会党组书记、主任王安顺涉嫌严重违纪违法，目前正接受江苏省纪委监委纪律审查和监察调查。（央视新闻）", "ctime": 1794555038, "time_str": "15:30:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261113/c681797014.shtml"}, {"id": "5659145", "title": "国家卫健委：重点人群应优先接种流感疫苗", "content": "国家卫健委举行新闻发布会介绍时令节气与健康有关情况。中国疾控中心研究员王大燕介绍，接种疫苗是预防流感最经济有效的措施，因流感病毒易变异，建议每年接种以降低重症、住院和死亡风险，重点人群应优先接种，6月龄及以上无接种禁忌者积极接种，尤其是婴幼儿、60岁及以上老年人、慢性病患者及学校、托幼机构、养老机构、医疗机构等重点场所相关人员。儿童、老年人等重点人群防护要坚持预防为主，出现发热、咳嗽等症状及时休息、必要时就医，在人员密集、通风不良场所及身边出现呼吸道传染病患者时建议科学佩戴口罩。外卖小哥、网约车司机等公共服务业从业人员接触人员多、流动性强，建议接种流感疫苗，出现流感样症状及时就医、遵医嘱规范治疗，不带病上岗。（央视新闻）", "ctime": 1794554867, "time_str": "15:27:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261113/c681796927.shtml"}, {"id": "5659139", "title": "中国中铁在成都新设商业管理合伙企业", "content": "据企查查APP显示，近日，成都通锦瑞达商业管理合伙企业（有限合伙）成立，经营范围包含商业综合体管理服务、以自有资金从事投资活动。企查查股权穿透显示，该企业由中国中铁间接全资持股。（人民财讯）", "ctime": 1794554790, "time_str": "15:26:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261113/c681796895.shtml"}, {"id": "5659117", "title": "外交部：中方一贯反对滥用出口管制措施 扰乱全球产供链的稳定", "content": "外交部发言人毛宁主持例行记者会。彭博社记者提问，第一个问题，据本社报道，英伟达的芯片目前出现在上海的数据中心，请问外交部对此有何评论？第二个问题是，美国议员和商务部正在推动通过芯片法案来阻止中国公司通过国外渠道来获取美国算力，请问中国是否认为这些限制措施违反了中美的贸易休战协议？鉴于APEC峰会即将召开，中方对作何回应？毛宁表示，你的第一个问题，我不了解有关情况。第二个问题，中方一贯反对滥用出口管制措施，扰乱全球产供链的稳定，这不符合任何一方的利益。中美双方应当共同落实好两国元首达成的重要共识，维护中美经贸关系稳定发展的态势。 (北京日报)", "ctime": 1794554591, "time_str": "15:23:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261113/c681796783.shtml"}, {"id": "5659115", "title": "外交部再回应所谓中国间谍论调", "content": "11月13日，外交部发言人毛宁主持例行记者会。彭博社记者提问，CNN报道称，美国情报部门正在研究中国企业女高管黄乐与中国政府之间的关系。有消息人士透露，目前的情报无法证明黄乐是中国的间谍。美国国家情报总监办公室官员表示，将黄乐定性为“中国间谍”是不准确的，且是被过度渲染的。请问外交部对此有何评论？毛宁表示，对于所谓的“中国间谍”论调，我们已经多次阐明了立场。(北京日报)", "ctime": 1794554576, "time_str": "15:22:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261113/c681796777.shtml"}, {"id": "5659091", "title": "外交部：期待各方进一步凝聚共识达成领导人深圳宣言", "content": "11月13日，外交部发言人毛宁主持例行记者会。有记者提问：中方发布了习近平主席将出席亚太经合组织第三十三次领导人非正式会议及相关活动的消息，能否请您进一步介绍会议整体情况及中方对会议的期待？毛宁表示，今年是中国时隔12年再次担任APEC东道主。下周APEC第三十三次领导人非正式会议将在深圳拉开帷幕。我们期待各方进一步凝聚共识，达成领导人深圳宣言，在贸易、互联互通、数字经济和人工智能等重要领域取得更多的务实成果，为亚太乃至全球繁荣增长注入强劲动力。（央视新闻）", "ctime": 1794554464, "time_str": "15:21:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261113/c681796720.shtml"}, {"id": "5659079", "title": "外交部回应中美俄三国元首会晤：中方同相关方保持着沟通", "content": "11月13日，外交部发言人毛宁主持例行记者会。法新社记者提问，首先，距离亚太经合组织（APEC）深圳峰会召开只有几天时间了，请问中方能否介绍一下，关于中俄美三国元首可能举行的会晤，目前是否有最新消息？第二，英国《卫报》昨天的一篇报道称，中国已排除主办第三十三届联合国气候变化大会（COP33）的可能性。请问这一报道是否属实？如果属实，中国为何不愿主办COP33？毛宁表示，首先回答第一个问题，对于中美俄三国元首的会晤，我们同相关方保持着沟通，如果有进一步的信息，我们会及时发布。毛宁说：“你的第二个问题，目前我不掌握有关情况，但是我可以告诉你的是，联合国气候变化框架公约的缔约方会议，是全球气候治理的重要平台，中国将继续致力于推动全球绿色低碳转型和应对气候变化的国际合作。”(北京日报)", "ctime": 1794554435, "time_str": "15:20:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261113/c681796706.shtml"}, {"id": "5659057", "title": "福建金融投资等成立新兴与未来创投母基金", "content": "据企查查APP显示，近日，福建省新兴与未来创业投资母基金合伙企业（有限合伙）成立，经营范围包含以私募基金从事股权投资、投资管理、资产管理等活动。企查查股权穿透显示，该企业由福建省金融投资有限责任公司、福建省省级政府投资基金有限公司等共同出资。（人民财讯）", "ctime": 1794554366, "time_str": "15:19:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261113/c681796673.shtml"}, {"id": "5659055", "title": "长城证券完成第三批互换便利回购融资并落地首批股票买入", "content": "长城证券宣布，已完成第三批“证券、基金、保险公司互换便利”回购融资并落地首批股票买入。长城证券表示，下一步将继续用好互换便利工具，坚持长期投资、价值投资，持续开展权益市场长期资产配置，用实际行动助力资本市场健康稳定发展。（人民财讯）", "ctime": 1794554357, "time_str": "15:19:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261113/c681796670.shtml"}, {"id": "5659035", "title": "伊朗称一艘液化气运输船在霍尔木兹海峡触雷爆炸", "content": "伊朗伊斯兰革命卫队海军公共关系部门13日发表声明说，一艘违规液化气运输船在霍尔木兹海峡东部触雷后发生爆炸并起火。声明说，这艘船在霍尔木兹海峡东部航行时，无视伊方多次警告，试图从海峡南部一条未经许可的航道通过，触雷后发生剧烈爆炸。声明说，伊方将坚定、严肃管控霍尔木兹海峡，任何试图违反伊朗有关霍尔木兹海峡规定、无视革命卫队海军警告并驶入未经许可和危险航道的船只都将面临同样的结局。(新华社)", "ctime": 1794554310, "time_str": "15:18:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261113/c681796628.shtml"}, {"id": "5659031", "title": "湖北：武汉将立足光谷打造科技金融“特区”", "content": "11月13日，湖北省人民政府新闻办召开新闻发布会，省委金融办会同省科技厅、省财政厅、人行湖北省分行等七部门联合印发《强化科技金融创新 赋能武汉区域科技创新中心建设若干措施（2026版）》，出台12条举措，回应科技企业轻资产缺抵押、早期项目融资、成果转化接续资金等诉求。《若干措施》确立“一条主线牵引、两类资金协同、三项改革赋能、四链融合发展”框架，立足光谷打造科技金融“特区”，依托光谷科技成果转化中心建设科技金融服务中心，线上归集融资需求、开展智能匹配，线下设立服务站，配备金融服务专员、专职技术经理人，创新举措先试点、成熟后向全省复制推广；统筹不少于200亿元再贷款、再贴现资金，综合运用财政补助、贴息、风险补偿、保费补贴等工具，引导各类资本投早、投小、投硬科技。（人民财讯）", "ctime": 1794554283, "time_str": "15:18:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261113/c681796591.shtml"}, {"id": "5659009", "title": "两部门：研究长时锂/钠离子电池储能技术 探索超长时、低成本氢储能、热化学储能技术", "content": "国家发展改革委、国家能源局印发《“十五五”新型储能实施方案》。其中提出，发展大容量长时物理储能技术。突破大容量高效压缩空气储能、高温熔盐储热、重力储能等技术；开展压缩二氧化碳储能、液态空气储能、热泵储电系统优化；攻关超临界二氧化碳储能、等温压缩空气储能、恒压压缩空气储能等高效压缩气体储能技术，及跨日跨季宽温域高效储热（冷）技术。发展低成本长时化学储能技术。突破规模化、长时间、高效率、低成本液流电池储能技术，研制高性能钒基、铁基、锌基及有机液流电池；研究长时锂/钠离子电池储能技术；探索超长时、低成本氢储能、热化学储能技术。", "ctime": 1794554165, "time_str": "15:16:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261113/c681796458.shtml"}, {"id": "5658967", "title": "两部门：加快锂离子电池储能迭代升级 推广钠离子电池储能应用", "content": "国家发展改革委、国家能源局印发《“十五五”新型储能实施方案》。其中提出，科学布局新型储能创新方向。加快锂离子电池储能迭代升级，推广钠离子电池储能应用。推动压缩空气储能、液流电池储能、飞轮储能等从试点应用向商业化应用过渡。鼓励超级电容、压缩二氧化碳储能、液态空气储能、重力储能、熔盐储热等技术试点应用。支持固态电池、热泵储电、热储能、氢储能等前沿技术储备。进一步推动构网型储能发展。以场景需求为牵引，积极稳妥推进构网型储能布局应用，验证构网型储能技术可靠性及其对电网的支撑能力，逐步完善构网型储能规划配置及设备技术要求等标准规范。", "ctime": 1794554039, "time_str": "15:13:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261113/c681796419.shtml"}, {"id": "5658963", "title": "内部现分歧 美参议院民主党领袖连任遭挑战", "content": "美国民主党籍联邦参议员范霍伦12日宣布，将在参议院民主党领袖选举中挑战已连任近10年的舒默。民主党在3日中期选举中夺回参众两院掌控权，据美方消息，领袖选举定于12月初举行，为闭门无记名投票。民主党内围绕是否继续支持舒默连任已现分歧：部分“进步”派人士呼吁范霍伦角逐，舒默获布朗等多人背书，仅阿卜杜勒·赛义德公开明确支持范霍伦。舒默称拥有继续出任领袖的支持票数，并已开始制订明年参议院政策议程。（央视新闻）", "ctime": 1794553991, "time_str": "15:13:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261113/c681796405.shtml"}, {"id": "5658959", "title": "微软加紧修复Outlook和Copilot系统故障 全球多地用户受到影响", "content": "在服务中断半天后，微软公司仍在努力恢复其旗舰软件的访问，用户无法使用电子邮件和聊天服务，这是这家科技巨头近年来最严重的服务中断之一。周五，全球用户都报告了Outlook、Teams和Copilot人工智能工具出现故障。此前一天，美国地区的许多用户无法使用这些服务。在追踪平台Downdetector上有约20万份与此次服务中断相关的用户问题报告，这是该公司最严重的服务故障之一。此前的服务中断很少超过几个小时。", "ctime": 1794553953, "time_str": "15:12:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261113/c681796392.shtml"}, {"id": "5658935", "title": "宇树科技与香港科技大学签署合作备忘录", "content": "2026年10月，宇树科技与香港科技大学签署合作备忘录。根据备忘录，宇树将为港科大计算机科学及工程学系正在建设的Future AI Lab提供硬件平台支持，双方将在具身AI、机器人安全、人机交互、自主导航等领域开展联合研究，并通过实习、研讨会和技术讲座等方式开展人才交流与培养。", "ctime": 1794553765, "time_str": "15:09:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261113/c681796320.shtml"}, {"id": "5658917", "title": "国防部：菲方应严格约束个别政客的危险言行", "content": "11月13日下午，国防部新闻发言人陈曦大校就近期涉军问题发布消息。陈曦表示，台湾问题纯属中国内政，如何解决是中国人自己的事，不容他人置喙。菲个别政客言论出于政治偏见和一己私利，背离菲政府在台湾问题上对中方作出的郑重承诺，中方对此强烈不满，坚决反对。中方维护主权和领土完整、实现国家统一的意志坚定不移。我们敦促菲方严格约束个别政客的危险言行，切实恪守一个中国原则，以实际行动维护中菲关系大局。（央视新闻）", "ctime": 1794553662, "time_str": "15:07:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261113/c681796198.shtml"}, {"id": "5658909", "title": "日本右翼势力种种行径是对战后国际秩序的公然挑衅", "content": "11月13日下午，国防部新闻发言人陈曦大校就近期涉军问题发布消息。陈曦表示，日本是二战战败国。历史上日本军国主义曾经犯下滔天罪行，给亚太和世界人民造成深重灾难。日方本应深刻反省侵略历史和所犯罪责，深刻汲取历史教训。然而日本右翼势力却不断编造所谓“中国威胁论”的虚假叙事，黑白颠倒编排“受害者”戏码，加速扩充防卫开支，强化进攻性作战和远程攻击力量，现在更是妄图实现渐进式核松绑，种种行径不仅是对自身和平承诺的背叛，更是对战后国际秩序和《不扩散核武器条约》权威性的公然挑衅。国际社会应高度警惕、共同遏止日本“再军事化”妄动，维护国际核不扩散体系，捍卫国际安全与和平。（新华社）", "ctime": 1794553627, "time_str": "15:07:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261113/c681796139.shtml"}, {"id": "5658875", "title": "中美两国防务部门就各层级交流对话保持沟通协调", "content": "11月13日下午，国防部新闻发言人陈曦大校就近期涉军问题发布消息。11月2日至3日，中美两军在华盛顿举行第4次危机沟通与预防工作组会议，双方就落实两国元首共识、加强沟通交流、避免误解误判等深入交换意见。保持中美两军关系稳定、健康、可持续发展符合双方共同利益，也是国际社会的普遍期待。中方重视中美两军战略沟通，两国防务部门就各层级交流对话保持着沟通协调。我们希望美方与中方一道，共同落实好两国元首重要共识，加强沟通对话，妥善管控分歧，为构建中美建设性战略稳定关系增添积极因素。（新华社）", "ctime": 1794553515, "time_str": "15:05:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261113/c681796082.shtml"}, {"id": "5658867", "title": "两部门：到2030年 可承担顶峰保供作用的电网侧独立新型储能规模约1.4亿千瓦", "content": "国家发展改革委、国家能源局印发《“十五五”新型储能实施方案》。其中提出，支撑新型配电系统建设。推动在配电网科学建设新型储能，优化配网增容，提升配电网接入分布式电源承载力，支撑主配微电网协同发展。围绕重大活动、重要电力负荷保供电需求，探索新型储能应用，提升应急供电保障能力。到2030年，可承担顶峰保供作用的电网侧独立新型储能规模约1.4亿千瓦。", "ctime": 1794553477, "time_str": "15:04:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261113/c681796071.shtml"}, {"id": "5658853", "title": "两部门：到2030年，新能源基地配置新型储能规模约5000万—6000万千瓦", "content": "国家发改委、国家能源局印发《“十五五”新型储能实施方案》 // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
