: false, "source": "", "url": "https://news.10jqka.com.cn/20260408/c675827733.shtml"}, {"id": "4198109", "title": "韩国开通“全国供应链问题热线”", "content": "韩联社、《首尔经济》等韩媒报道称，为降低中东局势震荡对韩国能源供应的影响，韩国政府7日开通“全国供应链问题热线”，集中受理企业与民众诉求，加快排查并解决进口、生产和流通环节的瓶颈问题。韩媒称，韩国经济对中东能源依赖度很高。2025年，韩国经霍尔木兹海峡进口的原油和石脑油占比分别达61%和54%。“全国供应链问题热线”旨在应对中东局势动荡引发的供应链不稳定，重点解决原材料及中间产品进口受阻、国际物流运输不畅等问题。“全国供应链问题热线”以韩国财政经济部官方社交平台账号为主要运行渠道，该部门官网也增设了专属入口，进一步扩大意见征集范围。企业与公众可通过留言等方式，提交自身在供应链方面遇到的实际困难或政策改进建议。与此同时，产业通商资源部、关税厅、国土交通部等韩国多个中央行政部门同步开放意见窗口，推动供应链相关问题跨部门协同处理。韩国政府还表示，将对收集的诉求进行快速评估并及时处理，必要时通过放宽管制加以解决，并推动将现场意见常态化纳入政策设计，完善供应链保障机制。(环球时报)", "ctime": 1775628417, "time_str": "14:06:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260408/c675827724.shtml"}, {"id": "4198105", "title": "南向资金净卖出超120亿港元", "content": "据同花顺iFinD数据，截至目前，南向资金净卖出超120亿港元，其中港股通（沪）卖出超101.03亿港元，港股通（深）卖出超19.41亿港元。", "ctime": 1775628392, "time_str": "14:06:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260408/c675827706.shtml"}, {"id": "4198103", "title": "黄金股集体走强，多家公司回应金价影响", "content": "4月8日早盘，黄金股持续走强。西部黄金“一”字涨停；山金国际盘中触及涨停，中午收盘上涨8.04%；晓程科技盘中涨超14%，中午收盘上涨13.02%；湖南黄金、紫金矿业、赤峰黄金、山东黄金跟涨。当日，COMEX黄金盘中大幅反弹，涨幅一度超过4%。西部黄金证券部工作人员独家回应中国证券报·中证金牛座记者，公司股价受多重因素影响，无法判断国际金价反弹与股价严格正相关。对于公司2026年度生产计划，上述西部黄金证券部工作人员表示，公司会按照此前披露的生产计划有序开展。其中，2026年计划生产黄金11010千克。对于金矿扩张动作，公司2025年收购了新疆有色持有的新疆美盛矿业有限公司100%股权，新疆美盛矿业有限公司持有的卡特巴阿苏金铜矿采矿权。未来是否有扩张动作，以公司公告为准。晓程科技证券部工作人员独家回应记者称，公司股价上涨主要受黄金板块整体回暖带动。金价反弹确实会对业绩会有一定提振，但是并非单一因素。除了金价外，开采成本和运营模式也会影响公司业绩，国内和国际开采成本相差也很大。公司年报尚未披露，具体业绩情况以公司年报为准。赤峰黄金证券部工作人员独家回应记者称，金价上涨对公司的利润会有正向影响。公司已经制定了2026年的生产计划，并会严控按照计划执行。开采成本与开采量、金矿品位高度相关，同时与资金投入关联度较大。(中证金牛座)", "ctime": 1775628376, "time_str": "14:06:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260408/c675827699.shtml"}, {"id": "4198099", "title": "淘宝天猫调整发货管理规范，预售订单商家自认缺货赔付比例下调至10%", "content": "4月8日，据“淘天速递”微信公众号消息，淘宝天猫调整发货管理规范、物流时效管理规范相关要求。变更要点：在“缺货-卖家/商家自主承认缺货”违规情形中，卖家/商家承诺发货时间大于48小时，针对卖家/商家在承诺发货时效内自主承认缺货的（即：商家主动服务消费者，明确告知缺货原因，与消费者协商达成一致后，并通过平台工具向消费者进行赔付），赔付比例调整由15%调整为10%。此次变更于4月2日公示，将于4月9日逐步生效。", "ctime": 1775628327, "time_str": "14:05:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260408/c675827687.shtml"}, {"id": "4198057", "title": "沪深京三市成交额超2万亿元，较上日此时放量6714亿元", "content": "据同花顺iFinD数据，沪深京三市成交额超2万亿元，较上日此时放量6714亿元，预计全天成交金额约2.4万亿元。截至目前，沪市成交额8781亿元，深市成交额11097亿元，北证50成交额127亿元。", "ctime": 1775628044, "time_str": "14:00:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260408/c675827620.shtml"}, {"id": "4198017", "title": "特斯拉推送FSD V14.3版本：反应速度提升20%", "content": "特斯拉宣布，FSD V14.3版本现已开始推送，其使用MLIR（多级中间表示）将AI编译器和运行环境从底层进行重写，从而将反应速度提升20%，并提高了模型迭代速度。此外，该版本升级了神经网络视觉编码器，提高了在低能见度场景下的理解能力，增强了3D几何理解能力，并扩展了对交通标志的理解。（科创板日报）", "ctime": 1775628010, "time_str": "14:00:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260408/c675827606.shtml"}, {"id": "4197985", "title": "上期所沪银主力合约大涨6%", "content": "上期所沪银主力合约大涨6%，报19065元/千克。", "ctime": 1775627530, "time_str": "13:52:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260408/c675827488.shtml"}, {"id": "4197981", "title": "沪深300股指期货(IF)主力合约日内涨超4%", "content": "沪深300股指期货(IF)主力合约日内涨超4%，现报4539.6点。", "ctime": 1775627512, "time_str": "13:51:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260408/c675827484.shtml"}, {"id": "4197983", "title": "马斯克：Colossus 2目前有7个模型在训练中", "content": "马斯克在社交平台表示，SpaceXAI的Colossus 2目前有7个模型正在训练中。（第一财经）", "ctime": 1775627512, "time_str": "13:51:52", "stock_code": " name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260408/c675827224.shtml"}, {"id": "4197835", "title": "银河航天在天津成立新公司 含多项卫星相关业务", "content": "企查查APP显示，近日，银河航天科技（天津）有限公司成立，法定代表人为徐鸣，经营范围包含卫星移动通信终端制造；卫星移动通信终端销售；卫星通信服务；卫星遥感数据处理；卫星遥感应用系统集成等。企查查股权穿透显示，该公司由银河航天（北京）科技集团股份有限公司全资持股。（人民财讯）", "ctime": 1775626114, "time_str": "13:28:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260408/c675827184.shtml"}, {"id": "4197831", "title": "海南省国际文化交流中心签署协议 拟推动海南F1方程式赛车项目引进落地", "content": "海南省国际文化交流中心今日官微消息，4月8日，海南省国际文化交流中心与鼎集汽车文化（海南）公司签署战略合作协议。双方将聚焦F1方程式赛车赛事引进落地、专业赛道规划建设、商业化赛事运营、汽车文化产业综合体打造及文体旅深度融合发展等核心领域，开展全方位合作。下一步，双方将高标准推动海南F1方程式赛车项目落地见效。而在4月3日，双方已举行交流座谈会，海南省国际文化交流中心主任李庚俊指出，海南F1方程式赛车赛事项目既是打造国际顶级体育赛事IP的重要载体，更是服务海南自贸港建设、加快培育国际旅游消费中心的关键抓手。根据介绍，项目将以F1国际顶级赛事为核心引擎，布局建设一级赛道、汽车改装厂、赛车培训学校、综合医疗服务、五星级酒店等多元业态，旨在打造集文旅休闲、商业消费、特色体验于一体的高端汽车文化产业综合体。（人民财讯）", "ctime": 1775626046, "time_str": "13:27:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260408/c675827159.shtml"}, {"id": "4197825", "title": "富时中国A50指数期货涨3%", "content": "富时中国A50指数期货涨幅扩大至3%。", "ctime": 1775625934, "time_str": "13:25:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260408/c675827140.shtml"}, {"id": "4197815", "title": "股指期货走高", "content": "中证500股指期货(IC)主力合约日内涨超5%，现报7761.2点。上证50股指期货(IH)主力合约日内涨超3%，现报2886.0点。", "ctime": 1775625789, "time_str": "13:23:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260408/c675827096.shtml"}, {"id": "4197811", "title": "港股恒生科技指数涨幅达5%", "content": "港股恒生科技指数涨幅扩大至5%，恒生指数现涨3.08%。", "ctime": 1775625748, "time_str": "13:22:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url" // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');

    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';

  }
  tbody.innerHTML = PICKS.map(p => {

      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
