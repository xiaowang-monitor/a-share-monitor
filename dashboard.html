经营业绩大幅提升，创历史同期最好水平。", "ctime": 1775642295, "time_str": "17:58:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260408/c675838243.shtml"}, {"id": "4199631", "title": "英利汽车：控股股东开曼英利拟减持不超过3%", "content": "英利汽车公告，控股股东开曼英利持有12.51亿股，占78.90%；拟因资金需求自公告披露日起15个交易日后的3个月内（2026年5月6日～2026年8月5日），通过集中竞价和大宗交易合计减持不超4757.36万股，即不超3%。其中集中竞价任意连续90日内不超1585.79万股（1%），大宗交易不超3171.57万股（2%）。", "ctime": 1775642289, "time_str": "17:58:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260408/c675838241.shtml"}, {"id": "4199627", "title": "Fabrinet美股盘前涨超10%", "content": "Fabrinet美股盘前涨超10%，现报618.99美元。", "ctime": 1775642265, "time_str": "17:57:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260408/c675838234.shtml"}, {"id": "4199621", "title": "特朗普称能轻易恢复对伊朗动武", "content": "美国总统特朗普8日表示，如果美国同伊朗谈判不顺，美方将能轻易恢复对伊朗的军事行动。特朗普当天接受英国天空新闻网采访时说，美伊两周停火“非常好”，在伊朗的所有军事目标都已经达成，“我们在军事上已经完成一切想做的事，美国在军事上取得了完全胜利”。（新华社）", "ctime": 1775642188, "time_str": "17:56:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260408/c675838211.shtml"}, {"id": "4199619", "title": "山金国际：黄金集团增持耗资5.1亿元，占0.2938%", "content": "山金国际公告，控股股东山东黄金矿业股份有限公司上层股东黄金集团完成增持计划，2025年7月31日至2026年4月8日通过集中竞价增持1354.51万股，耗资5.1亿元，占山东黄金总股本0.2938%；增持后黄金集团及一致行动人合计持有19.81亿股，占42.9760%。", "ctime": 1775642157, "time_str": "17:55:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260408/c675838202.shtml"}, {"id": "4199611", "title": "华建集团：国盛集团及现代集团构成一致行动人，合计持有公司19.11%股份", "content": "华建集团公告，2026年4月7日，持有公司5%以上股权的股东国盛集团通过无偿划转受让现代集团90%股权，现代集团成为国盛集团的控股子公司。根据《上市公司收购管理办法》相关规定，国盛集团和现代集团构成一致行动人，其在公司拥有的权益需合并计算。本次权益变动后，国盛集团及现代集团构成的一致行动主体合计持有公司1.85亿股，占公司总股本的19.11%。本次权益变动不会导致 国家安全委员会秘书处、政府有关部门正在评估谈判的各个方面和必要条件，并将很快发布官方公告。此前，伊朗学生通讯社、光明通讯社等报道说，伊朗伊斯兰议会议长卡利巴夫将率领伊朗代表团在巴基斯坦伊斯兰堡与美国举行谈判，美方由副总统万斯率团参加。（CCTV国际时讯）", "ctime": 1775641530, "time_str": "17:45:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260408/c675837895.shtml"}, {"id": "4199551", "title": "和远气体：2025年净利润6039.22万元，同比下降17.47%", "content": "和远气体发布业绩快报，2025年度实现营业总收入16.64亿元，同比增长8.55%；净利润6039.22万元，同比下降17.47%。报告期内，公司持续拓展大宗气体市场份额，氧气、氮气、氩气、二氧化碳等销量增长带动销售收入稳步增长。公司持续投建并调试潜江、宜昌两大电子特气及新材料产业园，资产总额增加。同时，新投建装置逐步转固新增折旧及财务费用，导致归属于上市公司股东的净利润及扣除非经常性损益后的归属于上市公司股东的净利润同比减少。", "ctime": 1775641524, "time_str": "17:45:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260408/c675837851.shtml"}, {"id": "4199537", "title": "龙旗科技：完成回购1.44%公司股份", "content": "龙旗科技公告，截至2026年4月7日，公司完成回购股份，通过集中竞价交易方式已实际回购公司股份749.99万股，占公司总股本的比例为1.44%，回购成交的最高价格为人民币42.49元/股，最低价格为人民币37.55元/股，回购均价为人民币39.98元/股，已支付的资金总额为3亿元（不含交易费用）。", "ctime": 1775641420, "time_str": "17:43:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260408/c675837801.shtml"}, {"id": "4199529", "title": "华南多地局地气温超40℃，专家：未来一周 高温范围将继续扩大", "content": "这两天，我国华南多地高温持续，海南澄迈、屯昌、白沙等地气温突破了40℃。\"气象专家指出，未来一周，高温的范围还将继续扩大至华南大部地区。（央视新闻）", "ctime": 1775641393, "time_str": "17:43:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260408/c675837788.shtml"}, {"id": "4199513", "title": "三安光电：副董事长兼总经理林科闯被留置", "content": "三安光电公告，公司于2026年4月7日收到重庆市渝中区监察委员会签发的通知书，副董事长兼总经理林科闯被留置、立案调查。目前，公司已对相关工作进行妥善安排，其他董事和高级管理人员均正常履职，董事会运作正常，生产经营、管理情况正常。公司尚未知悉事项进展及结论，将持续关注并按相关规定及时履行信息披露义务。", "ctime": 1775641247, "time_str": "17:40:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260408/c675837733.shtml"}, {"id": "4199503", "title": "智能眼镜企业Rokid创始人祝铭明回应上市传闻：重组改制是为了国内国际业务优化", "content": "近段时间智能眼镜企业上市消息不断，4月8日，有消息称热门智能眼镜公司Rokid最早将于4月底向香港提交上市申请。对此，Rokid创始人兼CEO祝铭明在朋友圈发布消息回应称，Rokid重组改制主要是为了国内国际业务优化，公司现在弹药储备非常充足，产品和市场势头也很迅猛，团队和投资人有耐心应对未来几年行业挑战和变革，目前公司专注今年新品开发。（人民财讯）", "ctime": 1775641119, "time_str": "17:38:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260408/c675837659.shtml"}, {"id": "4199499", "title": "安凯客车：3月产量815辆、销量805辆，累计产量增23.80%", "content": "安凯客车公告，2026年3月产量815辆，销量805辆；本年累计产量2247辆，同比增长23.80%，其中大型客车750辆，同比增长7.14%，中型客车1122辆，同比增长44.59%，轻型客车375辆，同比增长10.62%；累计销量1861辆，同比增长16.75%，其中大型客车466辆，同比下降20.21%，中型客车1105辆，同比增长70.00%，轻型客车290辆，同比下降19.44%。", "ctime": 1775641092, "time_str": "17:38:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260408/c675837644.shtml"}, {"id": "4199491", "title": "浩淼科技：拟与中平资本等共同投资设立安徽中平国珑智新股权投资基金合伙企业", "content": "浩淼科技公告，为借助专业投资机构的投资能力及资源优势，深化公司产业布局，推进公司整体发展战略，公司拟作为有限合伙人与普通合伙人上海中平国瑀资产管理有限公司及其他有限合伙人共同投资设立安徽中平国珑智新股权投资基金合伙企业（有限合伙）。投资基金总认缴出资额为人民币4.54亿元，其中公司以自有资金出资人民币3000万元，占比6.612%。投资基金主要投资于智能制造、新材料等战略新兴产业和经全体合伙人一致同意的其他行业。", "ctime": 1775641040, "time_str": "17:37:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260408/c675837602.shtml"}, {"id": "4199485", "title": "以色列被曝不愿收手 希望伊朗战事再持续至少一个月", "content": "美国白宫7日称，美国和以色列都同意与伊朗有条件停火两周。但两名前以色列高级官员表示，以色列认为现在停火为时过早，希望对伊朗的军事行动能再持续至少一个月。（央视新闻）", "ctime": 1775641018, "time_str": "17:36:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260408/c675837592.shtml"}, {"id": "4199477", "title": "海光DCU完成智谱旗舰模型GLM-5.1的Day-0适配", "content": "海光信息官微显示，4月8日海光DCU宣布完成对智谱新一代旗舰模型GLM-5.1的Day-0适配，提供推理部署全流程支持。目前，海光DCU正联合智谱持续推进GLM-5.1的深度适配优化工作，旨在进一步挖掘硬件潜力，开展更多场景化适配验证，加速该模型在真实软件开发、系统优化等领域的落地应用。", // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
