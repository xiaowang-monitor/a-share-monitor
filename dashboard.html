违规转让证券”的认定。明确《证券法》第一百八十六条规定的“转让证券”“在限制转让期内转让证券”“转让股票不符合法律、行政法规和国务院证券监督管理机构规定”的内涵、具体情形，以及一致行动人的违法主体认定。需要说明的是：违规转让证券的类型多样，为便于执法操作，《规则》根据证券性质、行为主体、行为特征、危害性大小等，将违规转让证券行为细分为“违反法律的‘在限制转让期内转让证券’”“在持有期限、卖出时间方面不符合行政法规、中国证监会规定”“在卖出数量、信息披露等方面不符合法律、行政法规和中国证监会规定”“未按规定暂停交易”四种类别，力求准确定性，精准执法。二是规范“违规转让证券”的处罚。针对不同类别，差异化设置不同的裁量阶次指标，力求过罚相当。同时，还对量罚调整情节做列举式规定，对并罚与从一重处的情形、调整适用的情形和市场禁入等作提示性规定。", "ctime": 1776421429, "time_str": "18:23:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260417/c676081091.shtml"}, {"id": "4242763", "title": "荣盛发展：子公司涉案金额866万元", "content": "荣盛发展公告，子公司唐山荣盛房地产开发有限公司作为被告，涉案金额为866万元。原告唐山冀东水泥胥建混凝土有限公司请求被告支付欠款及诉讼费、保全费。案件尚在一审阶段，未开庭。此外，公司及控股子公司还涉及约14.18亿元的其他诉讼仲裁事项，占公司最近一期经审计归母净资产的9.55%。", "ctime": 1776421415, "time_str": "18:23:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260417/c676081087.shtml"}, {"id": "4242761", "title": "立霸股份：2025年净利润1.57亿元，同比下降1.50%", "content": "立霸股份公告，2025年营业收入16.88亿元，同比下降1.28%。净利润1.57亿元，同比下降1.50%。拟以总股本2.66亿股扣除回购证券专用账户所持有的255.01万股后的余额股份数量2.64亿股为基数，每10股派发现金股利10元（含税），合计拟派发现金红利2.64亿元（含税）。本年度不以资本公积金转增股本、也不送红股。", "ctime": 1776421383, "time_str": "18:23:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260417/c676081071.shtml"}, {"id": "4242757", "title": "北方稀土：2025年净利润22.51亿元，同比增长124.17%", "content": "北方稀土公告，2025年营业收入425.63亿元，同比增长29.11%。净利润22.51亿元，同比增长124.17%。公司拟以总股本36.15亿股为基数，向全体股东每股派发现金红利0.13元（含税），合计派发现金红利4.7亿元（含税），占公司本年度净利润的20.88%。", "ctime": 1776421358, "time_str": "18:22:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260417/c676081066.shtml"}, {"id": "4242755", "title": "中基协：主动权益基金经理在管基金3年业绩跑输业绩比较基准应降绩效薪酬", "content": "针对主动权益类基金建立的阶梯化绩效薪酬调整机制，《基金管理公司绩效考核管理指引》明确，过去三年基金产品业绩低于业绩比较基准超过十个百分点且基金利润率为负的，基金经理绩效薪酬应当较上一年明显下降，降幅不得少于百分之三十；低于业绩比较基准超过十个百分点但基金利润率为正的，基金经理绩效薪酬应当下降；显著超过业绩比较基准且基金利润率为正的，基金经理绩效薪酬可以合理适度提高。", "ctime": 1776421337, "time_str": "18:22:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260417/c676081061.shtml"}, {"id": "4242753", "title": "德邦科技：国家大基金拟减持3%", "content": "德邦科技公告，持股1941.63万股占13.65%的国家集成电路产业投资基金股份有限公司因自身资金安排，拟于2026年5月14日～2026年8月13日，通过集中竞价减持不超过142.24万股、大宗交易减持不超过284.48万股，合计不超过426.72万股，占公司总股本3%；集中竞价任意连续90日内不超1%，大宗交易任意连续90日内不超2%。", "ctime": 1776421285, "time_str": "18:21:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260417/c676081037.shtml"}, {"id": "4242751", "title": "上交所：本周对*ST观典、*ST熊猫、*ST正平等异常波动退市风险警示股票进行重点监控", "content": "上交所公告，2026年4月13日至2026年4月17日，上交所对117起拉抬打压、虚假申报等证券异常交易行为采取了自律监管措施，对*ST观典、*ST熊猫、*ST正平等异常波动退市风险警示股票进行重点监控，对24起上市公司重大事项等进行专项核查，向证监会上报涉嫌违法违规案件线索1起。", "ctime": 1776421261, "time_str": "18:21:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260417/c676081028.shtml"}, {"id": "4242749", "title": "中基协：基金公司高管等当年全部绩效薪酬中不少于30%要自购旗下公募基金", "content": "《基金管理公司绩效考核管理指引》最新出台，其中明确提出，基金公司的高管、主要业务部门负责人、基金经理应当将一定比例的绩效薪酬购买本公司或者本人管理的公募基金，且持有期限不得少于一年。高管、主要业务部门负责人应当将不少于当年全绩效薪酬的百分之三十购买本公司管理的公募基金，其中购买权益类基金不得低于百分之六十，但是公司无权益类基金等情形除外。基金经理应当将不少于当年全部绩效薪酬的百分之四十购买本人管理的公募基金，其管理的基金处于封闭期等原因无法购买的，应当购买本公司管理的公募基金。基金经理兼任高管、主要业务部门负责人的，应当按照本指引对基金经理的要求执行。", "ctime": 1776421227, "time_str": "18:20:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260417/c676081021.shtml"}, {"id": "4242747", "title": "顺丰控股：3月速运物流业务收入180.19亿元，同比增长0.68%", "content": "顺丰控股公告，2026年3月速运物流业务收入180.19亿元，同比增长0.68%；供应链及国际业务收入62.83亿元，同比增长9.00%。速运物流业务收入增长主要得益于中高端时效业务收入的稳健增长，单票收入同比上升4.20%。供应链及国际业务收入增长主要由国际快递及跨境电商物流、国际供应链业务的强劲增长推动。", "ctime": 1776421198, "time_str": "18:19:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260417/c676081005.shtml"}, {"id": "4242745", "title": "康泰生物：二价肠道病毒灭活疫苗（Vero细胞）开启Ⅰ期临床试验", "content": "康泰生物公告，全资子公司北京民海生物科技有限公司研发的二价肠道病毒灭活疫苗（Vero细胞）已完成Ⅰ期临床试验准备工作，开启Ⅰ期临床试验，并成功完成首例受试者入组。该疫苗适用于6月龄及以上EV-A71、CV-A16易感者，用于预防肠道病毒EV-A71、CV-A16感染所致的手足口病等传染病。目前全球尚无该疫苗获批上市。", "ctime": 1776421192, "time_str": "18:19:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260417/c676081004.shtml"}, {"id": "4242741", "title": "宝鼎科技：公司及相关人员收到浙江证监局警示函", "content": "宝鼎科技公告，公司及相关人员收到浙江证监局警示函。2026年2月10日，重要子公司招远市河西金矿有限公司收到《烟台市矿山安全生产整治方案》，要求河西金矿暂时停止生产并进行安全生产整治。相关事项属于可能对公司股票交易价格产生较大影响的重大事件，公司未按照规定对上述信息予以披露。", "ctime": 1776421163, "time_str": "18:19:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260417/c676080988.shtml"}, {"id": "4242737", "title": "证监会征求意见：“余券”数量基准日规定为违法行为影响消除或违法行为结束后第五日", "content": "中国证监会研究起草了《中国证监会行政处罚案件违法所得认定办法（征求意见稿）》，现向社会公开征求意见。意见指出，“余券”数量及其账面盈亏直接影响违法所得金额。《办法》征求意见稿对于“余券”数量基准日规定为违法行为影响消除或违法行为结束后第五日。主要考虑是，该时间可以减少基准日的随机性、偶然性，同时和违法行为之间的因果关系更为紧密。而“余券”数量确定后，以哪个日期的价格计算“余券”的基准价值同样重要。《办法》征求意见稿拟将价格基准日和数量基准日予以统一，内幕交易按照内幕信息公开后打开涨跌停板日起5个交易日平均收盘价作为余券基准价格，操纵市场按照操纵行为结束后5个交易日平均收盘价作为余券基准价格。主要考虑是此方案能够最大程度体现违法行为和违法所得之间的因果关系，且具有客观公正、限缩裁量空间、平滑余券盈亏金额等优点。同时，如果涉案证券后续出现连续涨跌停的极端情况，5个交易日均价也不至于和违法行为结束时的价格偏离太大。", "ctime": 1776421068, "time_str": "18:17:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260417/c676080958.shtml"}, {"id": "4242735", "title": "中国证监会核准瑞德资产管理有限公司合格境外投资者资格", "content": "瑞德资产管理有限公司：你公司报送的关于合格境外投资者资格的申请及相关文件收悉。根据《合格境外机构投资者和人民币合格境外机构投资者境内证券期货投资管理办法》（证监会令第176号）等有关规定，经审核，现批复如下：一、核准瑞德资产管理有限公司（Reed Capital Partners Pte Ltd）合格境外投资者资格。二、你公司在开展合格境外投资者业务的过程中，应当严格遵守有关规定，依法履行职责、承担责任。（证监会）", "ctime": 1776421036, "time_str": "18:17:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260417/c676080951.shtml"}, {"id": "4242731", "title": "中无人机：第一季度净利润1686.45万元，同比增长0.11%", "content": "中无人机公告，2026年第一季度营收为5.74亿元，同比增长143.59%；净利润为1686.45万元，同比增长0.11%。", "ctime": 1776421014, "time_str": "18:16:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260417/c676080939.shtml"}, {"id": "4242719", "title": "中基协：基金公司董事长、高管等薪酬递延支付比例原则上不少于40%", "content": "中基协：基金公司董事长、高管等薪酬递延支付比例原则上不少于40%。《基金管理公司绩效考核管理指引》出台，就薪酬支付方面，指引中提到，基金管理公司应当建立绩效薪酬递延支付制度，绩效薪酬的递延支付期限、比例应当与基金投资收益、薪酬水平、业务开展、风险变化等情况相匹配，递延支付期限不少于三年，递延支付速度不得快于等分比例。董事长、高级管理人员、主要业务部门负责人、分支机构负责人和核心业务人员应当纳入递延支付人员范围，递延支付比例原则上不少于百分之四十。", "ctime": 1776420832, "time_str": "18:13:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260417/c676080856.shtml"}, {"id": "4242717", "title": "豫光金铅：2025年净利润8.6亿元，同比增长6.55%", "content": "豫光金铅公告，2025年实现营业收入495.54亿元，同比增长25.95%；净利润8.6亿元，同比增长6.55%。公司拟以2025年12月31日公司总股本12.09亿股为基数，向全体股东每10股派发现金红利2.15元（含税），共计派发现金红利2.6亿元（含税），占公司2025年度合并报表归属于上市公司股东净利润的30.23%。", "ctime": 1776420822, "time_str": "18:13:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260417/c676080855.shtml"}, {"id": "4242715", "title": "泽璟制药：控股股东盛泽林、股东宁波泽奥已分别减持0.1035%和0.9350%", "content": "泽璟制药公告，控股股东及实控人盛泽林于2026年4月16日通过集中竞价减持27.39万股，占公司总股本0.1035%；股东宁波泽奥于2026年3月30日至4月15日通过集中竞价减持247.51万股，占0.9350%。本次减持计划已全部实施完毕，盛泽林现持有4963.66万股，占18.7514%；宁波泽奥现持有1402.55万股，占5.2985%。", "ctime": 1776420816, "time_str": "18:13:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260417/c676080853.shtml"}, {"id": "4242713", "title": "中证协：券商禁止通过提高福利、津补贴等方式规避递延要求", "content": "证券业薪酬制度迎来修订。中证协最新发布《证券公司建立稳健薪酬制度指引》，记者梳理发现，2025版作出三项刚性约束：一是递延支付范围扩至所有对风险有直接或重要影响的岗位人员；二是递延起付时间不早于绩效薪酬归属年度后第2年（T+2年）；三是禁止通过提高福利、津补贴等方式规避递延要求。递延支付年限仍需与业务风险持续期限匹配，支付速度不快于等分比例，确保薪酬发放与长期风险挂钩。", "ctime": 1776420813, "time_str": "18:13:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260417/c676080852.shtml"}, {"id": "4242707", "title": "黎巴嫩方面消息称黎南部停火后仍遭炮击", "content": "据黎巴嫩方面17日消息，黎巴嫩和以色列间的停火生效后，敌军仍继续炮击该国南部希亚姆等城镇。同时，在黎南部上空监测到密集的无人机活动。(央视新闻)", "ctime": 1776420776, "time_str": "18:12:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260417/c676080837.shtml"}, {"id": "4242705", "title": "财政部等两部门：调整平潭综合实验区有关增值税和消费税退税货物范围", "content": "财政部、国家税务总局公告，调整平潭综合实验区有关增值税和消费税退税货物范围。内地经“二线”销往平潭与生产有关的货物视同出口，按现行税收政策规定实行增值税和消费税退税。但下列货物不包括在内：1.财政部和税务总局规定不适用增值税退（免）税和免税政策的出口货物。2.平潭的商业性房地产开发项目采购的货物。商业性房地产开发项目,是指兴建(包括改扩建)宾馆饭店、写字楼、别墅、公寓、住宅、商业购物场所、娱乐服务业场馆、餐饮业店馆以及其他商业性房地产项目。3.内地销往平潭不予退税的其他货物。具体范围见附件。4.按相关规定被取消退税或免税资格的企业购进的货物。（财政部）", "ctime": 1776420758, "time_str": "18:12:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260417/c676080834.shtml"}, {"id": "4242703", "title": "首药控股：2025年净亏损1.29亿元，同比减亏", "content": "首药控股公告，2025年营业收入866.76万元，同比增长119.88%。归属于上市公司股东的净亏损1.29亿元，同比减亏。公司拟不进行利润分配及以资本公积转增股本。", "ctime": 1776420708, "time_str": "18:11:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260417/c676080818.shtml"}, {"id": "4242701", "title": "证监会：对两个以上独立的违法行为分别计算违法所得 盈亏不得相抵", "content": "证监会就《中国证监会行政处罚案件违法所得认定办法（征求意见稿）》公开征求意见。证监会表示，当事人实施两个以上同类违法行为，不同行为既有盈利也有亏损的，计算违法所得时是否盈亏相抵，是起草中的焦点问题，在操纵市场案件中尤为明显。《办法》征求意见稿规定为，对于两个以上独立的违法行为分别计算违法所得，彼此盈亏不得相抵。（证监会）", "ctime": 1776420705, "time_str": "18:11:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https: }

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
