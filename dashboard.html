}
.score-bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s; }
.up { color: var(--red); }
.down { color: var(--green); }
.pulse { animation: pulse 2s infinite; }
@keyframes pulse {

  50% { opacity: 0.5; }
}

qka.com.cn/20261113/c681820074.shtml"}, {"id": "5664613", "title": "李强同泰国总理阿努廷会谈", "content": "11月13日下午，国务院总理李强在曼谷同泰国总理阿努廷举行会谈。李强表示，今年7月，阿努廷总理对中国进行正式访问，习近平主席同你举行会晤，共同规划中泰关系发展。我这次访泰，两国总理在四个月内实现互访，充分彰显双边关系的高水平。当前，中泰都处在国家建设发展的重要时期。中方坚定支持泰国政府顺利施政，愿同泰方进一步夯实政治互信基础，支持彼此核心利益和重大关切，用好外长和防长“2+2”战略对话、经贸联委会等机制，深挖各领域合作潜力，取得更多实际成果，更好惠及两国人民。（新华社）", "ctime": 1794580019, "time_str": "22:26:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261113/c681820056.shtml"}, {"id": "5664531", "title": "Sportradar Group美股盘前跌超10%", "content": "Sportradar Group美股盘前跌超10%，现报11.5美元。", "ctime": 1794579312, "time_str": "22:15:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261113/c681819981.shtml"}, {"id": "5664505", "title": "COMEX白银期货跌超1%", "content": "COMEX白银期货跌超1%，现报49.47美元/盎司。", "ctime": 1794579040, "time_str": "22:10:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261113/c681819961.shtml"}, {"id": "5664421", "title": "波兰华沙肖邦国际机场一架客机因无人机干扰中止降落", "content": "当地时间13日，波兰华沙肖邦国际机场一架从布拉格飞往华沙的波兰航空公司客机因无人机干扰中止降落。客机在较低高度发现无人机出现在进近航线上，机组增加推力复飞，在华沙上空盘旋约十几分钟后再次尝试降落并安全着陆。机场发言人鲁兹基证实事件发生，称中止降落属标准程序，机场运行安全未受影响。波兰对华沙周边空域实施特殊限制，操作无人机需获许可；若导致航空运输直接灾难危险，责任人最高可能面临5年监禁。（央视新闻）", "ctime": 1794578638, "time_str": "22:03:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261113/c681819912.shtml"}, {"id": "5664297", "title": "王毅同韩国外长赵显会谈", "content": "2026年11月13日，中共中央政治局委员、外交部长王毅在北京同韩国外交部长赵显举行会谈。王毅表示，去年底以来，习近平主席同李在明总统成功互访，推动中韩关系重回改善发展的正确轨道，今年两国贸易额再创新高，人员往来将达到千万人次。明年将迎来两国建交35周年，双方应以此为契机，共同推动中韩战略合作伙伴关系沿着正确道路向前发展。王毅说，中韩是搬不走的近邻，保持睦邻友好是彼此的正确选择。双方坚持与邻为善、以邻为伴，保持各层级沟通对话，深化各领域务实合作，给两国人民带来福祉，也促进了地区和平与发展。中方始终重视中韩关系，愿同韩方进一步增进互信，在传统合作基础上，拓展人工智能、生物医药、绿色低碳、银发经济等新兴领域合作，培育经济增长新引擎，不断做大共同利益。王毅表示，亚太地区是中韩人民的共同家园。APEC领导人非正式会议即将在深圳举行，包括李在明总统在内的各经济体领导人已确认与会。中方迄今为APEC“中国年”举办了300多场活动，赞赏韩方参与其中所作的努力，愿同韩方携手推进亚太共同体建设，促进地区共同发展、共同繁荣。韩方去年成功举办APEC会议，相信也会为APEC深圳会议作出贡献，双方的相互支持将为两国关系注入新的内涵和动力。（外交部网站）", "ctime": 1794578403, "time_str": "22:00:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261113/c681819867.shtml"}, {"id": "5664269", "title": "LME镍主力合约跌超1%", "content": "LME镍主力合约跌超1%，现报16030.0美元/吨。", "ctime": 1794578237, "time_str": "21:57:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261113/c681819843.shtml"}, {"id": "5664265", "title": "韩国考虑拨专款打击AI作弊行为", "content": "韩国正考虑采取措施防范国家资格考试中考生利用AI眼镜等高科技设备作弊。在野党议员金渭相提议，2027年度预算增加约65.7亿韩元，采购无线电信号探测设备并安排专职人员。韩国产业人力公团估算需36亿韩元采购7200台探测设备、29.7亿韩元安排23559名专职人员，方案尚需国会审议。截至10月底，今年国家资格考试已查获6起智能眼镜作弊案件。高考将于19日举行，教育部已将AI眼镜列入禁带物品清单，1312个考点将配备至少1名识别AI眼镜的监考人员，作弊者可能面临多至3年禁考及刑事责任。（新华社）", "ctime": 1794578229, "time_str": "21:57:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261113/c681819841.shtml"}, {"id": "5664231", "title": "美国微软公司多款应用出现大范围故障", "content": "据外媒12日报道，微软365多项服务当日发生大范围故障，波及Outlook、人工智能助手“智能副驾驶”等，影响多国政府机构、企业和个人用户。故障从美国东部时间12日中午前后开始，美国“网络探测器”网站数据显示，北京时间13日2时刚过时已有近13万名用户报告无法访问Outlook，数以千计用户报告Teams、“智能副驾驶”等故障。微软称未发现恶意活动，称部分基础设施“负载升高”可能是原因，正调整流量协议、重新分配流量及实施策略性流量阻断，已实施调整的地区部分恢复。这是微软365服务今年第二次中断，美国开放人工智能研究中心和Anthropic公司称旗下模型使用的微软连接器遭遇故障。（新华社）", "ctime": 1794578054, "time_str": "21:54:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261113/c681819821.shtml"}, {"id": "5664189", "title": "布伦特原油站上97美元/桶", "content": "布伦特原油站上97美元/桶，日内涨1.27%。", "ctime": 1794577789, "time_str": "21:49:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261113/c681819783.shtml"}, {"id": "5664003", "title": "美国10月PPI数据公布后，市场下调对美联储加息的预期", "content": "美国10月PPI数据公布后，市场下调对美联储加息的预期。", "ctime": 1794576996, "time_str": "21:36:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261113/c681819598.shtml"}, {"id": "5663869", "title": "美国10月PPI年率升至近四年来最高水平", "content": "美国10月PPI年率录得6.5%，为2022年11月以来最高水平，低于市场预期的6.6%。10月PPI月率录得0.3%，低于市场预期的0.4%。", "ctime": 1794576658, "time_str": "21:30:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261113/c681819471.shtml"}, {"id": "5663553", "title": "2030年全国新型储能装机规模有望达到3亿千瓦", "content": "国家发展改革委、国家能源局13日发布《“十五五”新型储能实施方案》，提出到2030年全国新型储能装机规模有望达到3亿千瓦，平均储能时长3小时左右，由规模化发展阶段步入市场化发展阶段。“十四五”期间装机从“十三五”末的300万千瓦提升至1.36亿千瓦。方案从电源侧、电网侧和创新场景构建多元应用场景，健全容量价值体现机制，建立电网侧独立新型储能容量电价机制。国家能源局有关负责人表示，将促进项目获得合理收益，以各地调节需求和电价承受能力为依据，将3亿千瓦装机目标与市场消纳能力、补偿机制承受力同步匹配，实现政策引导、市场主导。（新华社）", "ctime": 1794575492, "time_str": "21:11:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261113/c681819267.shtml"}, {"id": "5663549", "title": "美军否认在巴林的预警雷达遭伊朗摧毁", "content": "美军中央司令部13日在社交媒体发文，否认其在巴林的预警雷达遭伊朗摧毁，称伊朗伊斯兰革命卫队向巴林方向发射了两架无人机，均被美军击落，没有造成人员伤亡或财产损失。（新华社）", "ctime": 1794575446, "time_str": "21:10:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261113/c681819261.shtml"}, {"id": "5663305", "title": "期市夜盘开盘，国内期货主力合约多数上涨", "content": "期市夜盘开盘，国内期货主力合约多数上涨。涨幅方面，原油涨超2%，燃油、焦煤、PVC、甲醇、丙烯等涨超1%。跌幅方面，烧碱跌超2%。", "ctime": 1794574826, "time_str": "21:00:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261113/c681819009.shtml"}, {"id": "5663243", "title": "盛科通信：向特定对象发行A股股票申请获上交所受理", "content": "盛科通信公告，公司于2026年11月12日收到上海证券交易所出具的《关于受理苏州盛科通信股份有限公司科创板上市公司发行证券申请的通知》，上交所对公司报送的科创板上市公司发行证券的募集说明书及相关申请文件进行了核对，认为该项申请文件齐备，符合法定形式，决定予以受理并依法进行审核。公司本次向特定对象发行A股股票事项尚需通过上交所审核，并获得中国证监会作出同意注册的决定后方可实施。", "ctime": 1794574722, "time_str": "20:58:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261113/c681818982.shtml"}, {"id": "5663201", "title": "侨银股份：侨银转债存在无法按期足额兑付本息重大风险", "content": "侨银股份公告，公司此前公开发行4.2亿元“侨银转债”，到期日为2026年11月16日，到期兑付价格为130元人民币/张（含税及最后一期年度利息）。截至2026年11月12日，尚有419.65万张“侨银转债”未转股，占发行总量420万张的99.92%。因公司近期资金周转承压，流动资金出现短期错配，兑付资金正在统筹落实中，截至公告披露日尚未全部到位，公司现有货币资金无法兑付“侨银转债”本息，存在无法按期足额兑付本息的重大风险。", "ctime": 1794574475, "time_str": "20:54:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261113/c681818944.shtml"}, {"id": "5663123", "title": "Phaos Technology美股延续昨日涨势 盘前涨30.9%", "content": "Phaos Technology美股延续昨日涨势，盘前股价再涨30.9%，现报3.94美元；该股昨日股价暴涨超234%。", "ctime": 1794573987, "time_str": "20:46:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261113/c681818805.shtml"}, {"id": "5663099", "title": "万德斯：拟定增募资不超过5亿元用于偿还有息债务和补充流动资金", "content": "万德斯公告，拟向芜湖源昌股权投资有限公司发行股票，募集资金总额不超过人民币5亿元（含本数），扣除发行费用后全部用于偿还有息债务和补充流动资金。发行对象为公司间接控股股东瑞源国际之全资子公司，构成关联交易。本次发行数量不超过25499353股（含本数），发行价格不低于定价基准日前20个交易日公司股票交易均价的80%，认购股份自发行结束之日起36个月内不得转让。", "ctime": 1794573856, "time_str": "20:44:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261113/c681818781.shtml"}, {"id": "5663093", "title": "衢丽铁路衢松段最长大桥开启架梁施工", "content": "记者13日从中国铁建股份有限公司获悉，由浙江交通集团投资建设、中铁十一局承建的衢丽铁路衢江特大桥全面进入架梁施工阶段，标志着项目建设取得重要进展，为后续工程施工奠定坚实基础。(新华社)", "ctime": 1794573730, "time_str": "20:42:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261113/c681818765.shtml"}, {"id": "5663049", "title": "永悦科技：江苏华英1600万股将被司法拍卖，起拍价6657.6万元", "content": "永悦科技公告，控股股东江苏华英所持公司1600万股无限售流通股将被司法拍卖，约占公司总股本的4.45%。南京中院拟于2026年12月18日10时至2026年12月19日10时通过京东网司法拍卖平台公开拍卖，展示起拍价为6657.6万元。目前拍卖事项处于公示阶段，结果尚不确定；若竞拍成功并完成股份过户，江苏华英持股将变更为4265.95万股，预计占总股本的11.87%，可能导致公司控股股东及实控人发生变更。", "ctime": 1794573278, "time_str": "20:34:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261113/c681817428.shtml"}, {"id": "5662927", "title": "俄称尚未同意欧洲参与谈判", "content": "俄罗斯总统新闻秘书佩斯科夫在今天（11月13日）的例行记者会上说，俄方尚未同意让欧洲参与乌克兰问题谈判。佩斯科夫表示，只有在俄方明确欧洲国家拥有促进和平进程的真实意愿之后，才会做出“以更广泛的形式就乌克兰问题进行对话”的决定。此外，目前还无法谈及俄欧开展双边沟通的可能性，但俄方对此抱有意愿。乌克兰总统泽连斯基11月12日在爱尔兰首都都柏林与美国总统特使威特科夫和库什纳会谈后发表声明说，欧洲将派代表直接参与下一轮乌美俄三方会谈，他们将拥有发言权。库什纳也在社交媒体发帖称，俄乌已同意“扩大下一轮谈判的范围，将欧洲国家纳入其中”。本周，俄美乌三方会谈时隔9个月在阿联酋阿布扎比重启。会谈开始前，欧盟、法国、德国、英国、意大利及北约代表在阿布扎比与乌克兰、美国代表举行协调磋商。（CCTV国际时讯）", "ctime": 1794572803, "time_str": "20:26:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261113/c681816439.shtml"}, {"id": "5662911", "title": "南宁百货：拟挂牌转让南宁医药约46.26%股权，挂牌价4169.12万元", "content": "南宁百货公告，公司拟通过广西联交所公开挂牌转让所持南宁医药股份1387.66股，占总股本约46.26%，挂牌价格为人民币4169.12万元，最终交易价格及交易对手以公开挂牌交易结果为准。受让方还须全额承接南宁医药对公司的2967.48万元借款及相关利息。该事项已获董事会审议通过，尚需履行公开挂牌程序，交易对象、交易价格和交易时间尚未确定，交易能否达成存在不确定性。", "ctime": 1794572721, "time_str": "20:25:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261113/c681816432.shtml"}, {"id": "5662903", "title": "侨银股份：预中标珠海斗门区中转站管护项目，金额约4273万元", "content": "侨银股份公告，公司近日预中标广东省珠海市2026-2029年斗门区中转站管护和垃圾压缩转运服务项目，中标合同包号为合同包1，中标（成交）金额为4273.34万元/3年，服务期限自合同约定生效之日起三年。截至目前，公司尚未取得《中标通知书》，能否取得仍存在一定不确定性，项目总金额、具体实施内容等均以正式合同为准。", "ctime": 1794572675, "time_str": "20:24:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261113/c681816423.shtml"}, {"id": "5662809", "title": "Phaos Technology美股延续昨日涨势 盘前涨22.26%", "content": "Phaos Technology美股延续昨日涨势，盘前股价再涨22.26%，现报3.68美元；该股昨日股价暴涨超234%。", "ctime": 1794572215, "time_str": "20:16:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261113/c681816294.shtml"}, {"id": "5662795", "title": "事关流程工业智能工厂业务管理 市场监管总局发布国家标准", "content": "市场监管总局批准发布《智能制造 流程工业智能工厂业务管理规范》国家标准，自2027年5月1日起正式实施。该标准首次提出流程工业智能工厂业务管理框架，涵盖研发设计、生产制造、运营支撑、全链协同和管理方法五大模块，确立数据驱动、系统集成、安全环保、弹性适配和持续改进五项基本原则，将安全风险分级管控、隐患排查治理、特殊作业审批、危险化学品追溯等要求嵌入业务流程，推动采购计划、供应商管理、生产安排和客户服务等信息共享。（央视新闻）", "ctime": 1794572159, "time_str": "20:15:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261113/c681816276.shtml"}, {"id": "5662693", "title": "ST创意：申请撤销其他风险警示，已就行政处罚所涉事项完成追溯重述", "content": "ST创意公告，公司于2026年11月13日召开董事会审议通过《关于申请撤销其他风险警示的议案》，同意向深交所申请撤销股票交易其他风险警示。公司因2022年年报、2023年半年报多计营业收入，股票自2025年9月23日起被实施其他风险警示。公司已就行政处罚决定所涉事项对相应年度财务会计报告进行两次追溯重述，且自2025年10月24日收到《行政处罚决定书》之日起已满十二个月，经自查目前不存在其他触及风险警示的情形。本次申请尚需深交所审核，能否获批存在不确定性。", "ctime": 1794571729, "time_str": "20:08:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261113/c681816185.shtml"}, {"id": "5662617", "title": "东方精工：选举唐灼林为董事长，聘任邱业致为总经理", "content": "东方精工公告，公司第六届董事会第一次会议审议通过相关人事议案：选举唐灼林为公司董事长，聘任邱业致为公司总经理、邵永锋为财务负责人、殷健为董事会秘书，任期均为三年。会议还选举产生第六届董事会审计委员会、提名委员会、薪酬与考核委员会委员。", "ctime": 1794571533, "time_str": "20:05:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261113/c681816092.shtml"}, {"id": "5662599", "title": "国统股份：公司目前生产经营活动正常", "content": "国统股份公告，公司股票于11月12日、11月13日连续两个交易日收盘价格涨幅偏离值累计超过20%，属于股票交易异常波动情形。经公司自查并书面征询直接控股股东天山建材、间接控股股东中国物流，公司目前生产经营活动正常，内外部经营环境未发生重大变化，不存在应披露而未披露的重大事项。公司2026年1-9月实现营业收入2.27亿元，同比下降48.92%；归属于上市公司股东的净利润亏损1.59亿元，同比下降624.90%，主要系报告期产品订单减少，收入下降，产品毛利率降低及预提预计负债所致。", "ctime": 1794571513, "time_st const META     = {"update_time": "2026-11-13 22:49:31", "sentiment_score": 54.506437768240346, "agents": []};

// 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
