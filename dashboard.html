型，具备原生多模态视觉理解能力。据介绍，新一代模型大幅减少了KV Cache缓存的大小，与上一代模型相比，对HBM的需求减少到1/4，对SSD的需求减少到1/8。在Agent使用场景中，缓存命中的费用往往占比较高，对KV Cache的压缩大幅降低了Agent类任务的使用成本。", "ctime": 1789020182, "time_str": "14:03:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260910/c679778212.shtml"}, {"id": "5145459", "title": "重庆：拟打造词元交易服务平台 探索制定词元交易标准和词元结算规则", "content": "《重庆市培育发展词元经济行动计划（2026—2028年）（公开征求意见稿）》公开征求意见。其中提到，打造词元交易服务平台，搭建可信聚合服务专区，提供可信准入、计量结算等一站式服务。构建差异多元词元交易模式，推出通用基础、行业专属、场景限定的词元分层产品。推动数据要素流通体系改革突破，联动行业可信数据空间，建设工业词元专区。探索推进以词元为载体的数据确权、登记、定价、计量、存证、交付全流程服务。探索制定词元交易标准和词元结算规则，对模型调用、数据集使用等服务实施标准化计量核算。在国资国企领域推进数据资产入表并探索词元确权，形成可定价可交易的词元资产池。（人民财讯）", "ctime": 1789020156, "time_str": "14:02:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260910/c679778205.shtml"}, {"id": "5145385", "title": "Grab据悉正就收购金融科技公司Atome Financial进行谈判", "content": "9月10日，据报道，知情人士透露，东南亚网约车和外卖公司Grab正在就收购金融科技公司Atome Financial的多数股权进行谈判。这家公司总部位于新加坡，隶属于领创集团（Advance Intelligence Group）。知情人士称，这笔交易将使该公司的估值超20亿美元。目前相关商讨仍在进行中，尚未作出最终决定。（界面新闻）", "ctime": 1789020091, "time_str": "14:01:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260910/c679778193.shtml"}, {"id": "5145175", "title": "中粮糖业触及跌停", "content": "中粮糖业触及跌停，成交额34.84亿元，封单2265手。", "ctime": 1789019806, "time_str": "13:56:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260910/c679778131.shtml"}, {"id": "5145133", "title": "蚂蚁集团CEO韩歆毅：智能体供需两端尚未形成正循环 将推出开发者激励政策", "content": "2026Inclusion·外滩大会主论坛期间，蚂蚁集团CEO韩歆毅表示，过去半年与商家的交流中，感受到商家侧对AI时代新增长机会的需求非常强烈。许多商家希望参与智能体经济，但仍在探索如何把自身服务转化为可被智能体调用和完成的能力，目前整个智能体供需两端尚未形成正循环。韩歆毅透露，支付宝“阿宝”将推出发布智能体激励政策，支持开发者开发可用、好用的智能体，同时为用户表达新需求提供对应的激励入口，通过这种方式，把用户真实需求与开发者、商家服务供给连接起来。（科创板日报）", "ctime": 1789019634, "time_str": "13:53:54", "sto shtml"}, {"id": "5145019", "title": "台积电8月销售额5148亿元台币，同比增长53.3％", "content": "台积电8月销售额5148亿元台币，同比增长53.3％。台积前八月累计销售额3.39万亿元台币，同比增长39.3%。", "ctime": 1789018280, "time_str": "13:31:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260910/c679777735.shtml"}, {"id": "5144983", "title": "电力板块再度拉升，乐山电力等多股涨停", "content": "午后电力板块再度拉升，乐山电力涨停，此前闽东电力、华银电力、芯能科技、湖南发展涨停，九洲集团、豫能控股、华电辽能、明星电力等纷纷跟涨。", "ctime": 1789017591, "time_str": "13:19:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260910/c679777620.shtml"}, {"id": "5144933", "title": "卡塔尔能源与安哥拉签署海上区块协议", "content": "卡塔尔能源与安哥拉签署海上区块协议，根据协议，安哥拉国家石油公司将持有这两个海上区块20%的权益，卡塔尔能源将持有两个海上区块30%的权益，而壳牌（运营方）将持有50%。（财联社）", "ctime": 1789017225, "time_str": "13:13:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260910/c679777578.shtml"}, {"id": "5144931", "title": "面向东盟服务贸易合作推介会在京举办", "content": "9月9日下午，由广西壮族自治区人民政府、北京市人民政府、海南省人民政府共同主办的面向东盟服务贸易合作推介会在北京首钢园区举办。会上，桂京琼三地共同签署《桂京琼协同深化面向东盟服务贸易合作倡议》；启动“共建面向东盟服务贸易开放合作高地”建设。发布《中国—东盟数字贸易发展报告》《广西数字贸易合作机会清单》等研究成果、中国（广西）—东盟智慧职教平台等创新产品；签约一批服务贸易重点合作项目。国内外企业代表围绕贸易数字化、AI赋能跨境合作等议题作主旨分享。(人民财讯)", "ctime": 1789017206, "time_str": "13:13:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260910/c679777572.shtml"}, {"id": "5144921", "title": "多项新技术新成果亮相服贸会 中国服务加速出海", "content": "2026年服贸会今天（9月10日）进入第二天，多场活动密集举办，一批新技术新成果亮相首钢园。今天，像这样的新成果还要发布46项，从硬核装备到跨境物流、智慧医疗，“中国服务”的新成果，正在变成国际合作的新方案。新技术，也在让传统文化“活”起来。文旅服务专题展上，艺术数字沉浸展用AI重塑大师笔下的自然世界；首发首秀的“三山五园时空数字沙盘”，让观众戴上AR眼镜“飞”进畅春园，沉浸式感受中国文化。今天，服贸会还举办了服务贸易发展论坛、第五届气象经济论坛等6场主题论坛，还有19场专题论坛和46场洽谈推介同步举办。（央视新闻）", "ctime": 1789016979, "time_str": "13:09:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260910/c679777534.shtml"}, {"id": "5144889", "title": "风电设备板块短线拉升，天顺风能涨停", "content": "风电设备板块短线拉升，天顺风能涨停，海力风电、大金重工、新强联、泰胜风能、明阳智能等纷纷走高。", "ctime": 1789016654, "time_str": "13:04:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260910/c679777480.shtml"}, {"id": "5144839", "title": "零跑汽车技术日将发超五项最新技术，世界模型智驾有望覆盖ABCD全系车型", "content": "记者从知情人士处获悉，零跑汽车计划于9月16日的技术发布会上发布达到“全行业第一梯队”世界模型智驾、新移动空间架构及三电领域等超5项最新技术。其中，零跑ABCD四大系列车型将有望全系搭载世界模型智驾，产品价格覆盖6万-30万元区间。在2026年中期业绩会上，零跑汽车管理层曾透露，9月技术发布会上发布的辅助驾驶产品，相较于零跑现有辅助驾驶有巨大的、飞跃式的提升。（财联社）", "ctime": 1789015776, "time_str": "12:49:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260910/c679777384.shtml"}, {"id": "5144835", "title": "HD现代重工将投资8336亿韩元建设新发动机工厂", "content": "9月10日消息，HD现代重工将投资8336亿韩元，用于建设一座新的专用工厂及高功率发电发动机生产设施。该项目旨在扩大高功率发电机组产能，以满足全球电力需求增长。根据设计和施工进度安排，项目投资期为9月10日至2028年5月31日。（界面新闻）", "ctime": 1789015695, "time_str": "12:48:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260910/c679777376.shtml"}, {"id": "5144827", "title": "沐曦股份陈维良：从需求侧来说，现在还有极大的算力短缺", "content": "在今日的2026中国联通合作伙伴大会上，沐曦股份创始人陈维良发表演讲。他表示，AI在数据、算力、算法的飞轮推动下，正在飞速的发展。他同时指出，算力行业也面临着双重困境，从需求侧来说，现在还有极大的算力短缺。大模型的参数已经迈向万亿甚至十万亿级，训练与推理的算力消耗呈现指数级的增长。AI的应用从实验室走向规模化的商用，Token的用量呈现爆发式的增长，算力供给出现持续的缺口。（新浪财经）", "ctime": 1789015626, "time_str": "12:47:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260910/c679777362.shtml"}, {"id": "5144775", "title": "福然德：热成型业务产能爬坡尚在起步中", "content": "福然德在9月10日召开的2026年半年度网上业绩说明会上表示，铝压铸业务已于2025年第三季度开始量产和送货，产能爬坡进展正常，将根据下游客户订单情况合理调整产能情况。截至目前，相关项目的营收和利润不大，不会对公司业绩产生重大影响。热成型业务已于2025年第四季度进入试生产和送样阶段，目前产能爬坡尚在起步中，相关项目的营收和利润不大，不会对公司业绩产生重大影响。（人民财讯）", "ctime": 1789014257, "time_str": "12:24:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260910/c679777122.shtml"}, {"id": "5144773", "title": "苹果新机全面涨价带动二手交易，转转平台iPhone 17交易量环比增长700%", "content": "苹果2026年秋季新品发布后，二手消费电子市场苹果机型热度同步升温。转转平台数据显示，发布会后，转转平台苹果手机搜索量环比增长270%，苹果手机回收估价量环比增长311%。新机价格门槛整体抬升，在售旧款涨价，推高了上代产品在二手市场的关注度。转转数据显示，截止早上八点，发布会后iPhone 17系列搜索量环比增长470%，交易量环比上涨280%，其中iPhone17标准版交易量增长突破700%。转转方面分析，在今年苹果新品只推出折叠屏iPhone Duo与iPhone 18 Pro系列，标准版缺席，上调在售iPhone17官网定价背景下，iPhone 17系列作为去年9月发布的次新旗舰，其二手性价比进一步凸显，预计将成为今年下半年二手市场最受追捧的机型。（界面新闻）", "ctime": 1789014213, "time_str": "12:23:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260910/c679777111.shtml"}, {"id": "5144771", "title": "全球公共安全指数报告出炉 中国位居第一", "content": "9月10日，全球公共安全合作论坛（连云港）2026年大会新闻发布会在江苏省连云港市召开。记者从发布会上了解到，本届大会发布了《全球公共安全指数报告（2025—2026）》。全球公共安全指数采用百分制进行量化评估，指数得分越高，表明该国公共安全状况越好。今年指数研究范围进一步扩大，研究覆盖62个对象国，涵盖全球82.73%的人口、75.22%的陆地面积和87.47%的经济总量，数据覆盖更广，代表性更强。在此基础上，选取了根据数据计算所得安全治理水平较高的20个国家发布其得分情况。报告显示，2026年62个国家的公共安全指数平均得分为72.56分，较去年略有上升。其中，中国、新加坡、乌兹别克斯坦等10个国家得分在80分及以上，28个国家的得分在70—79.99分之间，其余24个国家的得分在70分以下。中国公共安全指数得分为84.62分，位居第一。（央视新闻）", "ctime": 1789014192, "time_str": "12:23:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260910/c679777103.shtml"}, {"id": "5144769", "title": "固德威：中长期盈利增长取决于工商储、大储及AIDC配储出海进展", "content": "9月10日上午，固德威在2026年半年度业绩说明会上表示，公司未来的盈利增长，短期取决于全球户储市场渗透率的持续提升与需求落地，中长期则取决于工商储、大储及AIDC配储等业务能否顺利出海、形成多元化布局，从而接力户储、成为新的增长极。（人民财讯）", "ctime": 1789014180, "time_str": "12:23:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260910/c679777101.shtml"}, {"id": "5144765", "title": "桑托斯与韩国浦项国际达成10年期LNG供应协议", "content": "9月10日，据报道，有知情交易员透露，澳大利亚油气公司桑托斯将从2030年起，在10年期内每年向浦项国际供应约六船液化天然气（LNG），交付至韩国。（界面新闻）", "ctime": 1789014096, "time_str": "12:21:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260910/c679777084.shtml"}, {"id": "5144763", "title": "欧盟气候机构：今年8月为有记录以来最热月份", "content": "欧盟气候监测机构哥白尼气候变化服务局10日发布公报说，2026年8月成为自1940年有相关记录以来最热的月份。数据显示，今年8月全球平均地表气温约为16.96摄氏度，略高于2023年7月创下的约16.95摄氏度的纪录，成为全球平均地表气温最高的月份。该月全球平均地表气温比1991年至2020年同期平均水平高0.85摄氏度，比工业化前（1850年至1900年）平均水平高1.65摄氏度。这是自2025年11月以来，全球单月平均气温再次较工业化前水平高出1.5摄氏度以上。（新华社）", "ctime": 1789013993, "time_str": "12:19:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260910/c679777064.shtml"}, {"id": "5144759", "title": "星巴克拟斥资10亿美元改造多达9000家门店", "content": "9月10日，据报道，星巴克咖啡门店设计与概念高级副总裁Dawn Clark表示，星巴克正斥资10亿美元重新设计多达9000家门店。Clark表示，新设计旨在营造社区归属感，设计变更包括增加座位数量。（界面新闻）", "ctime": 1789013896, "time_str": "12:18:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260910/c679776981.shtml"}, {"id": "5144753", "title": "美国本土经历有气象记录以来最热夏季", "content": "美国国家海洋和大气管理局下属国家环境信息中心9日发布报告说，2026年夏季是有相关气象记录以来美国本土最热夏季。今年夏季以及8月的美国本土平均气温均为有记录以来最高水平。报告称，2026年夏季美国本土平均气温约为23.6摄氏度，比20世纪平均水平升高约1.7摄氏度，比此前的最高纪录高约0.2摄氏度。2026年8月是有记录以来美国本土最热8月，平均气温约24.2摄氏度，比20世纪平均水平高约1.9摄氏度。8月每日最高气温的均值达到约31.4摄氏度，同样为有记录以来最高水平。（新华社）", "ctime": 1789013821, "time_str": "12:17:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260910/c679776905.shtml"}, {"id": "5144751", "title": "普京：将深化同越南的全面战略伙伴关系", "content": "俄罗斯总统普京9日同到访的越共中央总书记、国家主席苏林举行会谈，表示将进一步加强俄越全面战略伙伴关系。普京与苏林就当前国际和地区热点问题交换意见，主张应坚定维护国际法，共同倡导维护亚太稳定和可持续发展。普京表示，俄罗斯与越南双边贸易额不断增长，文化、教育和安全等领域的合作日益扩大。双方根据今年3月签署的政府间协议，将合作建设越南首座核电站。此外，双方还计划在越南建设一个核科学技术中心。（新华社）", "ctime": 1789013811, "time_str": "12:16:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260910/c679776904.shtml"}, {"id": "5144749", "title": "小米18 Fold今日开售，首销较自家上代折叠屏产品销量提升300%", "content": "9月10日，小米18 Fold开售，记者从小米集团获悉，作为小米首款起售价过万元的旗舰产品，首销较自家上代折叠屏产品销量提升300%。（人民财讯）", "ctime": 1789013723, "time_str": "12:15:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260910/c679776888.shtml"}, {"id": "5144747", "title": "挪威首相称泽连斯基所乘飞机“差点被无人机击中”", "content": "总台记者获悉，挪威首相当地时间9月9日表示，一架无人机差点击中乌克兰总统泽连斯基所乘坐的从摩尔多瓦前往挪威奥斯陆的飞机。挪威首相没有透露该信息的来源，也没有说明无人机距离飞机有多近。据悉，泽连斯基于8日晚抵达挪威首都奥斯陆。9日，泽连斯基参加了挪威已故国王哈拉尔五世的葬礼。截至目前，乌克兰方面对此消息暂未做出官方回应。（央视新闻）", "ctime": 1789013622, "time_str": "12:13:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260910/c679776874.shtml"}, {"id": "5144745", "title": "东方生物：已开发高质量埃博拉抗原检测及核酸检测试剂", "content": "东方生物在9月10日召开的2026年半年度网上业绩说明会上表示，公司已经开发了高质量的埃博拉抗原检测及核酸检测试剂，并布局了其他虫媒传播疾病的检测试剂，相关市场正在拓展中。此外，公司量子点流式荧光设备及试剂已取得国内外多项证书，已逐步产业化并进入国内外市场，市场反馈良好。（人民财讯）", "ctime": 1789013500, "time_str": "12:11:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260910/c679776840.shtml"}, {"id": "5144707", "title": "全国首个外籍人员入境综合保险保障产品在北京发布", "content": "全国首个外籍人员入境综合保险保障产品今天（10日）在北京发布，这个保险产品聚焦外籍人员短期入境的实际需求，一次投保可享受多种保障服务。据介绍，目前市场多数外籍人员入境保险，70周岁以上人员较难投保，婴幼儿也有投保限制。这款产品由三家保险公司共同承保，打破年龄限制，从出生满28天到80周岁人群都可以投保。保障也比此前单家公司的类似产品更全面。北京金融监管局局长朱衍生表示：突出了全面保障，只需要一张保单就可以获得意外伤害、医疗给付、救援服务等综合性的保障。保费最低50元，最高490元，风险保障最高可以达到150万元。这款保险分为两大类，分别适用于10天和30天入境人群。除了涵盖意外身故伤残、突发急性病身故、医疗费用以及海陆空全场景交通意外等保障，还把医疗转运、亲属探访、人员送返等救援实际支出都纳入了保险赔付范围，切实化解外籍人员在华就医救援面临的困难。（央视新闻）", "ctime": 1789012930, "time_str": "12:02:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260910/c679776734.shtml"}, {"id": "5144701", "title": "2026年侵权假冒伪劣商品全国统一销毁行动今日开展，覆盖200多个品种", "content": "今天（10日），国家质量强国建设协调推进领导小组办公室、市场监管总局联合组织开展2026年侵权假冒伪劣商品全国统一销毁行动，全国25个省（ // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
