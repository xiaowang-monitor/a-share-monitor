ck_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260821/c679165058.shtml"}, {"id": "5000315", "title": "财政部：正在继续研究制定新政策新举措 并于今年下半年推出", "content": "国新办举行“开局起步‘十五五’”系列主题新闻发布会。财政部有关负责人介绍，财政金融协同促内需政策已经优化完善，并从8月1日开始实施。据介绍，优化完善后的财政金融协同促内需政策，主要包括三个新举措：第一，拓宽贴息范围。在先前固定资金贷款基础上，将新发放的流动资金贷款纳入中小微企业贷款贴息政策范围；更好贴近大众消费习惯，将包括购车、装修在内新发生的各类信用卡分期消费都纳入政策支持范围，按此，消费者只要是用信用卡分期方式进行消费，都可以享受贴息优惠。第二，增加经办机构。进一步扩大中小微企业贷款贴息、服务业经营主体贷款贴息经办机构范围，从此前的约100家增加至约400家，包括21家全国性银行和金融监管评级3A及以上的城商行、农村合作金融机构、民营银行、外资银行，广泛覆盖城乡经营主体。第三，提高额度上限。将享受政策的中小微企业贴息贷款规模上限由5000万元提高至7500万元，将享受政策的服务业经营主体贴息贷款规模上限由1000万元提高至2000万元；将享受政策的个人消费贷款贴息上限由3000元提高至5000元，以更好满足经营主体投资、消费需求。财政部副部长廖岷表示，结合经济发展需要，我们正在继续研究制定新政策新举措，并于今年下半年推出。同时，强化统筹协调，我们将与央行、金融管理部门一道，推动财政金融联动的常态化、长效化。我们期待，这些政策能够进一步增加企业和居民的获得感。（新华社）", "ctime": 1787279329, "time_str": "10:28:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260821/c679164916.shtml"}, {"id": "5000311", "title": "九州通等成立医疗器械公司，注册资本3000万元", "content": "企查查APP显示，近日，湖北九州通硕宁医疗器械有限公司成立，法定代表人为罗昌，注册资本为3000万元，经营范围包含：第一类医疗器械销售；第二类医疗器械销售；普通机械设备安装服务；供应链管理服务等。企查查股权穿透显示，该公司由九州通旗下九州通医疗器械集团有限公司等共同持股。（人民财讯）", "ctime": 1787279232, "time_str": "10:27:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260821/c679164797.shtml"}, {"id": "5000309", "title": "十四届全国人大常委会第二十四次会议8月25日至28日在北京举行", "content": "记者从今天（21日）全国人大常委会法制工作委员会举行的记者会上了解到，十四届全国人大常委会第七十一次委员长会议决定，十四届全国人大常委会第二十四次会议8月25日至28日在北京举行。委员长会议建议，十四届全国人大常委会第二十四次会议审议医疗保障法、耕地保护和质量提升法、农业法（修订）、国防动员法（修订）、律师法（修正）、企业破产法（修订）、银行业监督管理法（修订）、水法（修订）草案；审议国务院关于提请审议道路交通安全法（修订）、国家监察委员会关于提请审议反跨境腐败法草案的议案。(央视新闻)", "ctime": 1787279121, "time_str": "10:25:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260821/c679164717.shtml"}, {"id": "5000307", "title": "财政部：“十五五”时期更加聚焦“投资于人”，合理提高公共服务支出占比", "content": "8月21日，财政部副部长廖岷在国新办新闻发布会上表示，“十五五”时期，财政部将更加注重提升财政宏观调控的有效性、精准性。围绕稳增长、稳就业、稳预期的政策目标，要加大逆周期和跨周期调节，在保持必要赤字规模和支出强度的同时，也要下力气优化支出结构，集中财力保证国家重大战略任务。我们将更加聚焦投资于人，合理提高公共服务支出占财政支出的比重，特别是在满足民生需求中来拓展发展空间。（人民财讯）", "ctime": 1787279094, "time_str": "10:24:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260821/c679164704.shtml"}, {"id": "5000297", "title": "今年前7个月 中国与APEC其他经济体进出口超18万亿", "content": "记者从2026年亚太经合组织（APEC）海关与商界对话会上获悉，今年前7个月，中国与APEC其他经济体进出口总额达18.03万亿元，同比增长21%。当前，亚太经济总量已超过全球六成，贸易总量已接近全球的一半。今年前7个月，中国与APEC其他经济体进出口增速高于同期中国货物贸易整体水平，显示出区域经济合作的巨大潜力。（央视新闻）", "ctime": 1787278655, "time_str": "10:17:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260821/c679164423.shtml"}, {"id": "5000289", "title": "能源金属板块异动走高，融捷股份涨停", "content": "能源金属板块异动走高，融捷股份涨停，盛新锂能、博迁新材、天齐锂业、西藏矿业、赣锋锂业等纷纷走高。", "ctime": 1787278622, "time_str": "10:17:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260821/c679164399.shtml"}, {"id": "5000287", "title": "财政部：“十五五”时期我国将建设更为强大稳固的财政", "content": "今天上午，国新办举行“开局起步‘十五五’”系列主题新闻发布会，财政部有关负责人介绍了发挥积极财政政策作用，推动经济社会高质量发展有关情况。财政部副部长廖岷表示，过去五年，财政宏观调控效能不断提升，有力支撑了经济社会高质量发展，并实现了财政可持续性，财政作为国家治理的基础和重要支柱作用进一步彰显。2021—2025年，全国一般公共预算收入共计106万亿元，支出合计135万亿元，较“十三五”时期均有较大幅度的增长。“十五五”时期，我们将努力构建一个更为强大、稳固、平衡、可持续的财政，为基本实现社会主义现代化取得决定性进展提供坚实财政保障。概括起来，就是要努力实现六个“进一步”：财政实力进一步增强；财政支出结构进一步优化，财政支出更多转向投资于人，支持国内消费，增强国内大循环内生动力；财政宏观调控效能要进一步提升；财税体制改革进一步深化；财政科学管理水平进一步提高；财政重点领域风险进一步化解。（央视新闻）", "ctime": 1787278606, "time_str": "10:16:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260821/c679164392.shtml"}, {"id": "5000261", "title": "上期所欧线集运主力合约暴涨10%", "content": "上期所欧线集运主力合约暴涨10%，报1930点。", "ctime": 1787278394, "time_str": "10:13:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260821/c679164181.shtml"}, {"id": "5000253", "title": "俄在争议岛屿附近进行导弹训练日本称“无法接受”", "content": "俄罗斯太平洋舰队20日在社交媒体平台上说，太平洋舰队一支混合打击部队在南千岛群岛（日本称北方四岛）附近海域对模拟敌舰进行了导弹发射训练，所有目标均被成功击中。 俄罗斯太平洋舰队在帖文中说，在南千岛群岛附近海域，导弹巡洋舰“瓦良格”号发射了“火神”反舰导弹，核动力潜艇“鄂木斯克”号发射了“花岗岩”巡航导弹，“堡垒”岸基反舰导弹系统发射了“缟玛瑙”反舰导弹。训练打击目标距离发射地点300多公里。 俄方没有提及此次训练的时间。 另据日本共同社21日报道，就俄方在日俄争议岛屿附近进行导弹发射训练一事，日本外务大臣茂木敏充当地时间20日在出访国阿曼向媒体表示，“在北方四岛加强军备有违日方立场，无法接受”。(新华社)", "ctime": 1787278176, "time_str": "10:09:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260821/c679163946.shtml"}, {"id": "5000247", "title": "多家商超上调鸡蛋售价", "content": "记者梳理发现，多家商超上调鸡蛋售价，山姆精选鲜鸡蛋售价由18.9元/盒上调至21.8元/盒；盒马安心保洁鲜鸡蛋从19.9元涨至22.8元；沃尔玛旗下沃集鲜无抗保洁鸡蛋从17.9元涨至18.9元，随后又涨至22.9元。 据Mysteel农产品数据，8月17日主产区鸡蛋均价已升至5.15元/斤，较8月8日上涨0.69元/斤，9天累计涨幅达15.5%，同比涨幅高达58.46%，为近三年同期最高水平。（蓝鲸新闻）", "ctime": 1787278107, "time_str": "10:08:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260821/c679163864.shtml"}, {"id": "5000235", "title": "黄山燕升任lululemon中国及亚太区总裁", "content": "8月21日，记者从lululemon方面获悉，中国区董事总经理黄山燕已升任中国及亚太区总裁。自2018年1月加入lululemon以来，黄山燕在推动中国业务发展方面发挥了关键作用，助力中国市场成长为lululemon最重要的国际市场之一。同时，Jeffrey Hang正式加入lululemon，担任亚太区高级副总裁兼董事总经理。履新后，黄山燕将负责推动中国及亚太市场的战略发展。Jeffrey将领导lululemon亚太区团队，聚焦加速增长、强化品牌影响力，并支持公司长期发展战略。（界面新闻）", "ctime": 1787277900, "time_str": "10:05:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260821/c679163654.shtml"}, {"id": "5000231", "title": "科创50指数涨幅扩大至1%", "content": "科创50指数涨幅扩大至1%，现报1669.66点。", "ctime": 1787277814, "time_str": "10:03:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260821/c679163576.shtml"}, {"id": "5000223", "title": "检察机关依法对江敦涛涉嫌受贿案提起公诉", "content": "记者8月21日从最高人民检察院获悉，重庆市政府原党组成员、副市长江敦涛涉嫌受贿一案，由国家监察委员会调查终结，移送检察机关审查起诉。最高人民检察院依法以涉嫌受贿罪对江敦涛作出逮捕决定，并指定由四川省乐山市人民检察院审查起诉。近日，乐山市人民检察院已向乐山市中级人民法院提起公诉。检察机关在审查起诉阶段，依法告知了被告人江敦涛享有的诉讼权利，并讯问了被告人，听取了辩护人的意见。检察机关起诉指控：被告人江敦涛利用担任共青团青岛市委常委、组织部部长，青岛市城阳区委常委、副区长，青岛市委组织部副部长，青岛市崂山区区长、青岛高科技工业园管委会主任，青岛市崂山区委书记，淄博市委书记，潍坊市委书记，重庆市政府党组成员、副市长等职务上的便利以及职权或者地位形成的便利条件，为他人谋取利益，非法收受他人财物，数额特别巨大，依法应当以受贿罪追究其刑事责任。（新华社）", "ctime": 1787277645, "time_str": "10:00:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260821/c679163387.shtml"}, {"id": "5000221", "title": "我国自研11.5万吨成品油轮今日正式交付", "content": "记者从中船集团获悉，今天（21日）我国自主研发建造的11.5万吨成品油轮正式交付用户。船舶发动机等核心设备实现国产化，载货量、航速、油耗指标均达到国际先进水平。(央视新闻)", "ctime": 1787277626, "time_str": "10:00:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260821/c679163361.shtml"}, {"id": "5000189", "title": "煤炭开采板块短线走低，宝泰隆跌停", "content": "煤炭开采板块短线走低，宝泰隆跌停，大有能源、辽宁能源、郑州煤电、恒源煤电、新大洲A等跟跌。", "ctime": 1787277213, "time_str": "09:53:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260821/c679162947.shtml"}, {"id": "5000185", "title": "元件板块异动走高，崇达技术涨停", "content": "元件板块异动走高，崇达技术涨停，生益科技、世运电路、华正新材、广合科技、奥士康等纷纷走高。", "ctime": 1787277197, "time_str": "09:53:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260821/c679162931.shtml"}, {"id": "5000173", "title": "沪深京三市成交额超5000亿元，较上日此时缩量888亿元", "content": "据同花顺iFinD数据，沪深京三市成交额超5000亿元，较上日此时缩量888亿元，预计全天成交金额约1.9万亿元。截至目前，沪市成交额2349亿元，深市成交额2614亿元，北证50成交额41亿元。", "ctime": 1787276947, "time_str": "09:49:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260821/c679162688.shtml"}, {"id": "5000165", "title": "CPO板块短线拉升，星网锐捷涨停", "co // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>

    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>

      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
