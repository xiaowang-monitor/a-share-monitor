联储在近期加息的一些压力。该基金经理指出，话虽如此，美联储主席凯文·沃什在其首次新闻发布会上评论称，就业数据只有在第三次修正后才变得有意义，而到那时就成了“历史的回声“。Smith说，在油价涨幅有所缓和的背景下，就业方面的一些疲软可能会让美联储按兵不动，至少在下一次会议上是这样。美国经济6月份新增5.7万个就业岗位，少于分析师预期的11.5万个。", "ctime": 1783058799, "time_str": "14:06:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260703/c677927789.shtml"}, {"id": "4649871", "title": "湖南省政协副主席张灼华接受国家监委监察调查", "content": "湖南省政协副主席张灼华涉嫌严重职务违法，目前正接受国家监委监察调查。(新华社)", "ctime": 1783058788, "time_str": "14:06:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260703/c677927784.shtml"}, {"id": "4649853", "title": "美股纳斯达克100指数期货涨超1%", "content": "美股纳斯达克100指数期货涨超1%，标普500指数期货涨0.38%，道琼斯指数期货涨0.2%。", "ctime": 1783058627, "time_str": "14:03:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260703/c677927740.shtml"}, {"id": "4649817", "title": "韩国推进开发前沿人工智能模型并扩展基础设施", "content": "韩国科学技术信息通信部副部长3日表示，韩国政府正在战略性地重新审视其自主人工智能基础模式的构建。政府将推进以AI基础设施、物理AI及自主模型能力建设为核心的大规模项目。副部长还指出，韩国为跻身全球前三AI强国，今年将AI预算提高至9.9万亿韩元，是去年的三倍。韩国政府正计划扩大AI数据中心建设，预计到2029年建成8.4吉瓦的数据中心容量，到2035年再新增10吉瓦的数据中心容量。政府还设定目标，到2030年在物理AI领域跃居全球第一。同时，将推进“全民AI”项目，使所有公民都能使用AI服务。", "ctime": 1783058416, "time_str": "14:00:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260703/c677927684.shtml"}, {"id": "4649797", "title": "巴基斯坦一客运巴士坠山 已致超30人死亡", "content": "巴基斯坦俾路支省灾害管理局3日通报，位于开伯尔-普什图省与俾路支省交界的达纳萨尔地区，一辆客运巴士当天翻车坠落山谷，事故造成30人死亡，多人受伤。另据当地救援组织称，死亡人数已升至39人。巴士车主介绍，这辆客车从俾路支省奎达出发时，包括司机在内共有36人乘车。（央视新闻）", "ctime": 1783058183, "time_str": "13:56:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260703/c677927622.shtml"}, {"id": "4649795", "title": "三星SDI将投资16万亿韩元研发下一代电池", "content": "三星SDI将投资16万亿韩元研发下一代电池。（财联社）", "ctime": 1783058112, "time_str": "13:55:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260703/c677927604.shtml"}, {"id": "4649779", "title": "氮化镓产品在上海慕尼黑电子展撤展下架？英飞凌回应", "content": "7月3日，针对英诺赛科于7月2日发布的相关公开声明，英飞凌通过其微信公众号发文回应：其表述未完整还原事件整体背景和具体情况。英飞凌表示，其严格遵守法律法规及现行裁定。本案涉及的10个MV CoolGaN  G3产品型号目前仍处于司法程序之中，其正依法通过相关法律程序主张自身合法权益，并就相关事实和法律问题寻求全面审查。7月2日，英诺赛科发文表示，英飞凌侵权产品在上海慕尼黑电子展遭当场撤展下架。英诺赛科称，2026年7月1日，因展出已被中国法院明确禁止销售、许诺销售、进口的侵权氮化镓（GaN）产品，被专利权人英诺赛科当场发现后，撤展下架。（新浪财经）", "ctime": 1783057556, "time_str": "13:45:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260703/c677927487.shtml"}, {"id": "4649775", "title": "花旗集团：随着霍尔木兹海峡的中断逐渐缓解，布伦特原油价格到年底可能跌至60美元/桶", "content": "花旗集团表示，随着霍尔木兹海峡的中断逐渐缓解，布伦特原油价格到年底可能跌至60美元/桶。（财联社）", "ctime": 1783057208, "time_str": "13:40:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260703/c677927417.shtml"}, {"id": "4649769", "title": "预告：上海市政府7月7日举行发布会 介绍2026世界人工智能大会筹备进展", "content": "2026世界人工智能大会暨人工智能全球治理高级别会议将于7月17日至20日在上海举行。7月7日，上海市政府举行新闻发布会，邀请市领导及外交部、国家发展改革委、工业和信息化部、市经济信息化委、东浩兰生集团等相关负责人出席，介绍大会筹备进展情况，并答记者问。", "ctime": 1783057076, "time_str": "13:37:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260703/c677927379.shtml"}, {"id": "4649759", "title": "韩国综指涨幅扩大至6%", "content": "韩国综指涨幅扩大至6%，现报8108.28点。个股方面，SK海力士涨超11%，三星电子涨超8%。", "ctime": 1783056783, "time_str": "13:33:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260703/c677927307.shtml"}, {"id": "4649755", "title": "侨批档案数据库共建启动 粤闽两省侨批已超42万件", "content": "记者从国家档案局获悉，今天广东省、福建省档案部门在汕头市签署侨批档案工作协作框架协议，启动侨批档案数据库共建。目前，广东各级档案馆、文博机构侨批总量已超34.2万件，福建省各级档案馆现有侨批档案数量8万多件。两省将从资源共享、史料征集、编研开发三大维度搭建粤闽协同、海内外联动的侨批活化与传承的工作机制。（央视新闻）", "ctime": 1783056745, "time_str": "13:32:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260703/c677927297.shtml"}, {"id": "4649745", "title": "光大期货：非农数据低于预期，黄金后市谨慎乐观", "content": "非农就业数据大幅低于预期，加息预期出现降温，隔夜伦敦现货黄金涨超2%，站上4100美元/盎司。宏观方面，美国劳工部数据显示，6月非农就业人口仅增加5.7万人，约为市场预期11.3万人的一半，并远低于5月下修后的12.9万人，非农就业数据超预期降温，令市场对就业前景的判断趋于审慎，并推动投资者重新评估美联储货币政策路径，加息预期明显降温。从昨晚市场反馈来看，美元指数快速下行，并推动金价走高，可以说市场对美联储政策调整最紧张的时刻已经过去。后期市场可能更加关注通胀数据，当前通胀风险依然要摆在就业前面，短期黄金审慎乐观看待，趋势性行情是否回归仍有待观察。（光大期货）", "ctime": 1783056525, "time_str": "13:28:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260703/c677927266.shtml"}, {"id": "4649741", "title": "上海召开四方座谈会 共商汽车行业网络乱象协同治理路径", "content": "近期，上海启动了规范汽车行业网上信息传播秩序专项整治行动。为加强多方沟通协商机制，探讨协同治理路径，7月2日下午，上海市委网信办会同市经信委、市商务委、市公安局网安总队等部门，联合召开“政府—协会—车企—平台”四方座谈会。小红书、哔哩哔哩、虎扑、抖音、百度等平台企业介绍了加强汽车领域信息内容审核、涉企侵权信息处置等方面的工作举措。上海市汽车零部件行业协会及上汽集团、比亚迪、特斯拉、蔚来、小鹏、理想、雷克萨斯等车企代表就抵制行业乱象、维护企业权益提出意见建议。（证券时报）", "ctime": 1783056329, "time_str": "13:25:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260703/c677927225.shtml"}, {"id": "4649739", "title": "伊外交部：百余国派代表出席哈梅内伊遗体告别仪式", "content": "当地时间7月3日，伊朗外交部发言人巴加埃表示，约100个国家派遣官方代表团、公众团体或知名人士出席伊朗已故最高领袖哈梅内伊遗体告别仪式。巴加埃表示，出席仪式的包括至少8位国家元首（总统或总理）、来自12个国家的议长，以及多个国家的外交部长、部长级官员或特使。他还表示，来自东欧各国的官方代表团、议员及民间人士也都出席仪式。但对于公开支持以色列和美国对伊朗发动军事行动的欧洲国家，伊方未邀请其参加。（央视新闻）", "ctime": 1783056223, "time_str": "13:23:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260703/c677927204.shtml"}, {"id": "4649711", "title": "欧洲央行行长拉加德暗示可能参加法国总统选举", "content": "欧洲央行行长拉加德2日暗示，她不排除辞去现任职务、参加明年法国总统选举的可能性。\n\n拉加德当天接受采访时，被问及若欧元区通胀形势趋于平稳，是否会考虑提前离任。她回答：“有可能。我认为在法国总统选举中应该有一种欧洲声音。”(央视新闻)", "ctime": 1783055769, "time_str": "13:16:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260703/c677927079.shtml"}, {"id": "4649685", "title": "人形机器人板块午后持续走强", "content": "人形机器人板块午后持续走强，日盈电子2连板，万里扬、夏厦精密等数十只个股涨停，万达轴承涨超20%，中简科技、奥比中光、长盛轴承、恒辉安防涨超15%，埃夫特、恒工精密等数十只个股涨超10%，奥迪威、光洋股份、奇德新材、隆盛科技、恒帅股份跟涨。相关ETF方面，机器人ETF富国（159272）涨8.64%，成交额3.48亿元，机器人ETF易方达（159530）涨8.87%，成交额16.41亿元。", "ctime": 1783055530, "time_str": "13:12:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260703/c677927015.shtml"}, {"id": "4649683", "title": "特斯拉：二季度全球超充桩同比增长17%", "content": "据特斯拉官方微博，2026年第二季度特斯拉充电成绩单出炉：充电网络再扩容。全球超充桩突破80000根，本季度新增2700根，同比增长17%；中国大陆地区超2600超充站，13000根超充桩 。充电量创新高。全球季度充电量达2.0TWh，服务6000万次充电；超充实时可用率达99.95%，到站就能充。", "ctime": 1783055506, "time_str": "13:11:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260703/c677927013.shtml"}, {"id": "4649655", "title": "存储芯片午后走强 德明利涨停", "content": "存储芯片午后走强，德明利涨停，普冉股份、北京君正、昌红科技、德福科技、蓝晓科技涨超10%，杭州柯林、生益科技、科翔股份、复旦微电、富满微跟涨。相关ETF方面，科创芯片ETF汇添富（588750）涨2.9%，成交额8.48亿元，芯片ETF广发（159801）涨2.95%，成交额2.99亿元。", "ctime": 1783055047, "time_str": "13:04:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260703/c677926890.shtml"}, {"id": "4649649", "title": "科创50指数午后直线拉升涨超2%", "content": "科创50指数午后直线拉升涨超2%。", "ctime": 1783054971, "time_str": "13:02:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260703/c677926749.shtml"}, {"id": "4649609", "title": "卓创资讯：6月白银宽幅下挫，后市关注油价回落情形下通胀数据修复情况", "content": "6月以来白银宽幅下跌，截至7月2日，国内现货1#白银报价14562元/千克，相较6月初累计下跌20.26%。宏观面，月初美伊矛盾加深，能源成本高企影响下，美国5月CPI录得4.2%；中下旬美伊谈判形势向好，谅解备忘录达成，市场情绪有所修复，但本月FOMC会议上沃什表现偏鹰，加之后续美财长贝森特公开发言中表达了后续将俄、伊石油结算纳入美元版图，美指持续走高压制白银。产业面，国内光伏逐渐进入装机淡季，对价格的支撑有限。后市来看，美国6月非农就业 // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>

      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
