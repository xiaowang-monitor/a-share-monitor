_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260603/c677187823.shtml"}, {"id": "4452497", "title": "凯盛科技：补缴税款及滞纳金合计1836.71万元", "content": "凯盛科技公告，公司及子公司近期对涉税事项开展自查，需补缴税款1479.65万元、滞纳金357.06万元，合计金额1836.71万元。截至本公告披露日，上述税款及滞纳金已全部缴纳完毕。该事项不属于前期会计差错，不涉及前期财务数据追溯调整，将计入2026年度当期损益，不会影响公司正常经营。", "ctime": 1780474390, "time_str": "16:13:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260603/c677187813.shtml"}, {"id": "4452493", "title": "港股收评：恒生指数跌1.56%，恒生科技指数跌2.74%", "content": "港股收盘，恒生指数跌1.56%，恒生科技指数跌2.74%。恒指港股通ETF银华（159318）跌1.2%，港股通科技ETF鹏华（159751）跌1.99%。板块方面，半导体产品与设备、电气设备板块涨幅靠前；客运航空公司、汽车板块跌幅靠前。个股方面，曦智科技-P涨16.83%，果下科技涨16.55%，上海石油化工股份涨15.79%，云英谷科技涨13.68%，力勤资源涨10.92%；智云科技建设跌13.56%，国富量子跌13.45%，高鑫零售跌8.96%，安井食品跌8.9%，金蝶国际跌7.79%。", "ctime": 1780474288, "time_str": "16:11:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260603/c677187732.shtml"}, {"id": "4452491", "title": "特朗普签署“妥协版”AI模型审查行政令", "content": "美国总统特朗普2日签署关于强化人工智能(AI)模型审查的行政令。原定上月签署的行政令原本允许美国政府在特定AI模型发布前至多90天获取其访问权限，在遭遇业界游说后，提前审查期限缩短为30天。曾任白宫人工智能事务主管的硅谷风险投资人戴维·萨克斯与多名科技行业高管经过游说，上月成功阻止特朗普签署行政令。多名未具名知情人士称，白宫办公厅主任苏茜·怀尔斯、美国财政部长贝森特和国家网络总监肖恩·凯恩克罗斯后续尝试推动行政令颁布。特朗普本月1日召开会议，贝森特、凯恩克罗斯和国防部长赫格塞思出席，萨克斯线上参与。正是这次会议达成将政府审查AI模型期限从90天缩短为30天的妥协。（新华社）", "ctime": 1780474279, "time_str": "16:11:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260603/c677187727.shtml"}, {"id": "4452479", "title": "Soul App开源端到端多人对话转录模型", "content": "据Soul官方消息，Soul App AI团队（Soul AI Lab）联合西北工业大学音频语音与语言处理研究组ASLP@NPU团队及Moonstep AI，正式开源端到端多人对话转录模型SoulX-Transcriber。作为一款面向长音频、多说话人场景设计的语音理解模型，该模型能够直接从多人对话音频中生成包含时间戳、说话人身份和转录文本的结构化结果。", "ctime": 1780474230, "time_str": "16:10:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260603/c677187686.shtml"}, {"id": "4452465", "title": "东山精密：高端光模块产品订单充足 整体出货规模有望实现稳步增长", "content": "东山精密发布投资者关系活动记录表公告，公司光芯片技术量产工艺及应用技术稳定可靠，下游光模块产品已实现多家行业头部客户产品落地及批量供货。随着行业的不断发展，高端光模块产品市场需求旺盛，客户订单充足，整体出货规模有望实现稳步增长。公司光模块海外生产基地建设稳步推进，助力海外客户交付。", "ctime": 1780474088, "time_str": "16:08:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260603/c677187257.shtml"}, {"id": "4452451", "title": "赖清德称要处理TikTok小红书对台青影响 国台办：表明其心虚胆寒", "content": "有记者问：近日，赖清德在与岛内高中生对谈时称，TikTok、小红书对台湾青年世代的影响已达安全危机，久而久之，台湾可能就没有守护民主的意志，会把“中国”当作好人；将要求教育、文化部门妥善处理。请问对此有何评论？国务院台办发言人朱凤莲3日在例行新闻发布会上答问指出，大陆社交软件助力台湾青年成长、发展、圆梦，而赖清德当局却不断进行抹黑，甚至对台湾青年进行恐吓、威胁，表明其心虚胆寒。无论赖当局如何处心积虑破坏两岸交流交融，都不会得逞。(新华社)", "ctime": 1780474003, "time_str": "16:06:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260603/c677186943.shtml"}, {"id": "4452437", "title": "友发集团：全资子公司唐山友发新型建材认缴出资1000万元设立创业投资基金", "content": "友发集团公告，全资子公司唐山友发新型建筑器材有限公司与天津蜂巢投资管理合伙企业（有限合伙）等合伙人共同投资仁爱礼恒（天津）创业投资合伙企业（有限合伙），全体合伙人的拟认缴规模为人民币1亿元，其中，唐山友发新型建材作为有限合伙人拟以自有/自筹资金认缴出资1000万元人民币，占认缴出资总额的10%。", "ctime": 1780473917, "time_str": "16:05:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260603/c677186799.shtml"}, {"id": "4452431", "title": "迈威尔科技美股盘前延续涨势，涨幅达13%", "content": "迈威尔科技美股盘前延续涨势，涨幅达13%，昨日收涨逾30%。", "ctime": 1780473883, "time_str": "16:04:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260603/c677186718.shtml"}, {"id": "4452427", "title": "金智科技：中标国家电网配网项目，金额1.81亿元", "content": "金智科技公告，公司近期中标国家电网有限公司下属子公司配网相关项目，累计中标金额1.81亿元。项目涉及一二次融合成套环网箱、柱上断路器、低压电力电缆等设备，交易对手方为国网江苏、浙江、安徽、湖南、四川、河北、陕西、辽宁等电力公司。该项目金额占公司2025年度营业总收入的比例为11.62%，公司已收到中标通知书，合同陆续签署中。", "ctime": 1780473846, "time_str": "16:04:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260603/c677186578.shtml"}, {"id": "4452423", "title": "海目星：液冷服务器机柜整机检测设备已实现批量交付", "content": "海目星6月3日在互动平台回复称，液冷板相关业务已切入国内头部算力客户，目前液冷板相关设备处于技术验证阶段，同时液冷服务器机柜整机检测设备已实现批量交付。", "ctime": 1780473824, "time_str": "16:03:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260603/c677186494.shtml"}, {"id": "4452419", "title": "国台办：台湾的未来只能也必须由包括台湾同胞在内的14亿多中国人民共同决定", "content": "国务院台办发言人朱凤莲3日在例行新闻发布会上表示，台湾是中国的台湾，台湾的未来只能也必须由包括台湾同胞在内的14亿多中国人民共同决定。“和平统一、一国两制”是实现国家统一的最佳方式，最符合包括台湾同胞在内的中华民族根本利益，也是维护台湾同胞现有社会制度和生活方式的最佳选择。(新华社)", "ctime": 1780473729, "time_str": "16:02:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260603/c677186098.shtml"}, {"id": "4452407", "title": "5月份中国物流业景气指数为50.3%", "content": "记者3日从中国物流与采购联合会获悉，5月份中国物流业景气指数为50.3%，较上月回升0.6个百分点，物流业景气指数重回扩张区间。业务总量指数扩张。5月份，我国物流业业务总量指数为50.3%，环比回升0.6个百分点。新订单指数回升。5月份，我国物流业新订单指数为50.2%，连续3个月回升。物流投资指数回升。5月份，我国物流业固定资产投资完成额指数为54.1%，环比回升0.4个百分点，保持扩张区间。市场保持乐观预期。5月份，我国物流业业务活动预期指数为55.9%。（新华社）", "ctime": 1780473697, "time_str": "16:01:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260603/c677185974.shtml"}, {"id": "4452405", "title": "现货白银失守74美元/盎司", "content": "现货白银失守74美元/盎司，日内跌1.49%。", "ctime": 1780473687, "time_str": "16:01:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260603/c677185928.shtml"}, {"id": "4452399", "title": "美股中概股盘前多数下跌，贝壳跌2%", "content": "美股中概股盘前多数下跌，盛美涨1%，哔哩哔哩、拼多多、携程、理想汽车、网易跌1%，京东、贝壳跌2%。", "ctime": 1780473670, "time_str": "16:01:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260603/c677185855.shtml"}, {"id": "4452397", "title": "美股大型科技股盘前多数下跌，特斯拉跌0.6%", "content": "美股大型科技股盘前多数下跌，Meta涨0.4%，谷歌A涨0.3%，亚马逊、英伟达跌0.1%，苹果跌0.2%，微软、特斯拉跌0.6%。", "ctime": 1780473668, "time_str": "16:01:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260603/c677185842.shtml"}, {"id": "4452347", "title": "银宝山新：董事兼总经理唐伟增持0.30%", "content": "银宝山新公告，董事兼总经理唐伟于2026年6月2日通过深圳证券交易所大宗交易方式增持公司股份150万股，占公司总股本0.30%，成交金额1134万元。本次增持金额已超计划下限800万元且未超上限1600万元，增持计划自2026年5月15日起6个月内实施，现已完成。增持后唐伟合计持有公司股份300万股，占公司总股本0.61%。", "ctime": 1780473601, "time_str": "16:00:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260603/c677185651.shtml"}, {"id": "4452341", "title": "联想创投入股高性能智能体CPU芯片研发商此芯科技", "content": "企查查APP显示，近日，此芯科技集团有限公司发生工商变更，新增联想创投旗下上海联想未来创业投资合伙企业（有限合伙）等多名股东，同时注册资本增至1311.81万元。企查查信息显示，该公司成立于2021年，经营范围包含：集成电路科技、电子科技、通讯科技、计算机软硬件科技领域内的技术服务等。此前，联想（北京）有限公司已对其持股4.1%。公开信息显示，此芯科技专注于研发高性能智能体CPU芯片、提供高能效算力解决方案。", "ctime": 1780473543, "time_str": "15:59:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260603/c677185632.shtml"}, {"id": "4452331", "title": "泽连斯基：乌军打击俄圣彼得堡石油码头等设施", "content": "乌克兰总统泽连斯基3日在社交媒体上说，乌军当天凌晨对俄罗斯境内多处重要设施实施打击，其中包括圣彼得堡石油码头、喀琅施塔得军事基地和坦波夫州一家生产武器的企业。（新华社）", "ctime": 1780473460, "time_str": "15:57:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260603/c677185572.shtml"}, {"id": "4452319", "title": "德国5月服务业PMI终值 48.1，预期 47.8，初值 47.8", "content": "德国5月服务业PMI终值 48.1，预期 47.8，初值 47.8。", "ctime": 1780473354, "time_str": "15:55:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260603/c677185534.shtml"}, {"id": "4452311", "title": "电科数字：子公司收到政府补助2260万元", "content": "电科数字公告，近日，子公司收到政府补助合计2260万元，补助类型为与收益相关，占2025年公司归母净利润的比例为6.87%。", "ctime": 1780473315, "time_str": "15:55:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260603/c677185456.shtml"}, {"id": "4452293", "title": "美国政府正式就退还关税裁决提起上诉", "content": "美国政府2日正式对美国国际贸易法院下令美国海关与边境保护局退还关税的裁决提起上诉。上诉结果关系到特朗普政府向美国进口商征收的大约1660亿美元关税收入，已启动的关税退还进程可能受到影响。（新华社）", "ctime": 1780473156, "time_str": "15:52:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260603/c677185373.shtml"}, {"id": "4452283", "title": "南方两轮降雨将波及十余省份 这些地方高考考生注意防雨", "content": "昨天（6月2日）夜间起，南方降雨再度回归，未来七天有两轮过程无缝衔接，强降雨将波及贵州、湖南、江西等十余省份。恰逢高考倒计时，中国天气网推出大城市降雨日历，盘点雨水全勤区域，提醒当地考生及家长提早做好防雨备考准备。（央视新闻）", "ctime": 1780473053, "time_str": "15:50:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260603/c677185265.shtml"}, {"id": "4452263", "title": "中国自主研发T1000级高性能碳纤维实现批量化生产", "content": "记者从中国石化了解到，我国自主研发工艺路线生产的 T1000级高性能碳纤维，在上海实现批量化生产。产品可用于航空航天、具身智能、低空经济等高端领域和未来产业，将为我国关键领域发展提供核心战略材料支撑。此次实现量产的T1000级高性能碳纤维为12K小丝束规格，即每束碳纤维由12000根单丝组成，单丝直径仅约7微米，相当于普通人头发丝直径的十分之一，单股丝束拉伸强度超过6.5吉帕，足以拉动一辆重约10吨的中型卡车。（央视新闻）", "ctime": 1780472851, "time_str": "15:47:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260603/c677185170.shtml"}, {"id": "4452255", "title": "上海：有序推进政务领域人工智能应用 促进城市治理现代化水平不断优化提升", "content": "上海市政务智能工作推进会6月2日上午举行。上海市委副书记、市长龚正指出，要按照市委部署，加强系统化谋划、体系性推进，加快形成本地区、本部门、本单位的“施工图”和“时间表”，以点带面、推动政务智能工作各项任务落地落实。要加强工作协同，进一步打通数据链、业务链、责任链，大力推动算力共用、语料关联、链智融合，形成更多具有引领性、示范性、带动性的政务智能成果以及相关产业发展成果。要坚持智能向善，一体推进内容、技术、数据、算法、伦理安全，强化开发、部署、应用、维护全周期安全管理，进一步完善政策规范、标准指引，有序推进政务领域人工智能应用，促进城市治理现代化水平不断优化提升。", "ctime": 1780472792, "time_str": "15:46:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260603/c677185140.shtml"}, {"id": "4452243", "title": "菲律宾参议长再次换人", "content": "记者获悉，菲律宾参议院参议长当地时间3日换人，参议员舍温·加查利安成为临时参议长，5月11日当选参议长的艾伦·卡耶塔诺不再担任这项职务。(央视新闻)", "ctime": 1780472737, "time_str": "15:45:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260603/c677185117.shtml"}, {"id": "4452227", "title": "南王科技：设立海外孙公司 注册资本100亿印尼盾", "content": "南王科技公告，公司控股子公司福建南王新材料科技有限公司在印度尼西亚设立控股子公司PT NANWANG NEW MATERIAL TECHNOLOGY INDONESIA，注册资本100亿印尼盾，南王新材料持有60%股权。该孙公司已办理工商注册登记并领取注册登记证明文件。孙公司经营范围包括纸制品及纸板制品贸易、办公设备及工业用大型机械设备贸易、家用电器及家居用品贸易。本次投资旨在拓展市场，提升公司竞争力，资金来源为公司自有资金。", "ctime": 1780472644, "time_str": "15:44:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260603/c677185067.shtml"}, {"id": "4452219", "title": "福安药业：子公司原料药获得FDA注册批准", "content": "福安药业公告，全资子公司广安凯特制药有限公司于近日收到美国食品药品监督管理局（FDA）签发的二氮嗪原料药注册批准通知书。二氮嗪（Diazoxide）是一种快速降压药及胰岛素分泌抑制剂，主要用于高血压危象和胰岛素瘤相关低血糖症的治疗。它通过激活血管平滑肌的钾离子通道，扩张血管降低血压，同时抑制胰腺β细胞释放胰岛素，调节血糖水平。", "ctime": 1780472634, "time_str": "15:43:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260603/c677185062.shtml"}, {"id": "4452217", "title": "三元生物：年产2万吨阿洛酮糖项目已实现全线投产", "content": "三元生物公告，公司“年产2万吨阿洛酮糖项目”中剩余1万吨阿洛酮糖产能顺利完成主体工程建设、设备安装调试及前期相关准备和验收工作，并正式投产。随着该项目的正式投产，公司“年产2万吨阿洛酮糖项目”已实现全线投产。", "ctime": 1780472630, "time_str": "15:43:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260603/c677185061.shtml"}, {"id": "4452199", "title": "深圳楼市新政满月：新房成交涨五成，首个“日光盘”诞生", "content": "深圳市住房和建设局消息，“4·29”楼市新政实施以来，房地产市场持续火热，新建高品质楼盘受追捧，二手房市场成交活跃度显著提升，呈现量价齐升趋势。4月30日—6月2日，深圳新建商品住宅和二手住宅网签量分别达5035套、6191套，同比分别增加约50%、30%。公积金贷款方面，新政实施以来累计受理公积金贷款4404笔，涉及金额68.2亿元，笔均金额155万元，较新政前增长21%，居民购房压力显著减轻。（21世纪经济报道）", "ctime": 1780472470, "time_str": "15:41:10", "stock_code": "",  "", "url": "https://news.10jqka.com.cn/20260603/c677184650.shtml"}, {"id": "4452163", "title": "外交部：与台独分裂势力捆绑没有前途", "content": "6月3日，外交部发言人毛宁主持例行记者会。有记者问：据多家非洲和台湾岛内媒体披露，赖清德窜访斯威士兰前后，民进党当局向该国投入总计约250亿元的新台币资金，并承诺项目收益全部属于斯威士兰国王及王室，台“驻斯代表”等也将从中受益。请问发言人对此有何评论？\n毛宁表示，有关报道再次证明，赖清德当局为了谋求“台独”私利，挥霍台湾民众的血汗钱。“台独”分裂势力与斯威士兰维系所谓的“邦交关系”，目的不是惠及广大民众，而是为少数既得利益者圈钱，是充斥贪婪腐败的“政治作秀”。一个中国原则是国际社会普遍共识，也是国际关系基本准则。斯威士兰是非洲大陆唯一的所谓“台湾邦交国”，与“台独”分裂势力捆绑没有前途，只会错失发展机遇，孤立于国际社会。", "ctime": 1780472015, "time_str": "15:33:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260603/c677184622.shtml"}, {"id": "4452159", "title": "南向资金净买入超170亿港元", "content": "据同花顺iFinD数据，截至目前，南向资金净买入超170亿港元，其中港股通（沪）买入超139.21亿港元，港股通（深）买入超31.63亿港元。", "ctime": 1780472003, "time_str": "15:33:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260603/c677184559.shtml"}, {"id": "4452141", "title": "外交部：中欧经贸关系的本质是互利共赢", "content": "6月3日，外交部发言人毛宁主持例行记者会。有记者就中欧经贸关系提问。毛宁表示，中欧经贸关系的本质是互利共赢，我们也在密切关注欧方有关动向。我们始终认为经贸问题应该通过对话沟通寻求妥善的解决方式，同时我们希望欧方能够恪守自由贸易、公平竞争、开放合作等市场经济的基本准则，避免搞保护主义的措施。（央视新闻）", "ctime": 1780471886, "time_str": "15:31:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260603/c677184501.shtml"}, {"id": "4452121", "title": "外交部回应当前美伊局势：战事再起不符合任何一方的利益", "content": "6月3日，外交部发言人毛宁主持例行记者会。针对当前美伊局势，毛宁表示，中方对当前局势深表关切，战事再起不符合任何一方的利益，希望相关各方珍惜和平机会，坚持通过政治外交途径化解争端。(央视新闻)", "ctime": 1780471792, "time_str": "15:29:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260603/c677184377.shtml"}, {"id": "4452109", "title": "外交部：关税战、贸易战不符合任何一方的利益", "content": "针对特朗普政府近日提议对部分国家商品加征额外进口关税，外交部发言人毛宁6月3日在例行记者会上答问时表示，中方一贯反对各种形式的单边关税措施，关税战、贸易战不符合任何一方的利益。经贸问题应该在平等、尊重、互惠的基础上，通过对话协商解决。（新华社）", "ctime": 1780471663, "time_str": "15:27:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260603/c677184252.shtml"}, {"id": "4452101", "title": "外交部回应日方不当言论：日本避而不谈军国主义侵略扩张罪行", "content": "6月3日，外交部发言人毛宁主持例行记者会。有记者问：中方此前批评日本防卫大臣小泉进次郎有关涉华言论后，日本防卫省发言人昨天在记者会上作出回应，称中方“反复提出不符合事实的主张”。发言人对此有何评论?毛宁表示，日本避而不谈军国主义侵略扩张罪行，反而以集体自卫权包装海外派兵，以发展反击能力粉饰加强进攻性力量，以装备技术合作掩盖杀伤性武器出口，企图通过偷换概念欺骗日本国内和国际社会。数字不会说谎，日本越是遮掩，国际社会越应该高度警惕。（央视新闻）", "ctime": 1780471530, "time_str": "15:25:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260603/c677184144.shtml"}, {"id": "4452081", "title": "扎波罗热核电站第17次完全失去外部供电", "content": "当地时间3日，国际原子能机构通报称，当日凌晨，扎波罗热核电站对岸的尼科波尔变电站遭无人机袭击，导致该核电站仅剩的一条外部输电线路停运约20分钟。这是自俄乌冲突爆发以来，该核电站第17次完全失去外部供电。国际原子能机构总干事格罗西表示，此次事件再次凸显战事给核电站核安全带来的持续性风险。（央视新闻）", "ctime": 1780471367, "time_str": "15:22:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260603/c677184067.shtml"}, {"id": "4452075", "title": "南向资金净买入超160亿港元", "content": "据同花顺iFinD数据，截至目前，南向资金净买入超160亿港元，其中港股通（沪）买入超130.70亿港元，港股通（深）买入超30.19亿港元。", "ctime": 1780471285, "time_str": "15:21:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260603/c677184041.shtml"}];

  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
