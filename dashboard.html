const NEWS     = [{"id": "4667773", "title": "*ST利源：董事长李红举拟增持不低于300万元", "content": "*ST利源公告，公司董事长兼总裁李红举计划自本公告披露之日起6个月内，通过集中竞价、大宗交易或法律法规允许的其他交易方式增持公司股份，增持金额合计不低于人民币300万元，增持价格不超过2.5元/股。本次增持前，李红举未持有公司股份。", "ctime": 1783420195, "time_str": "18:29:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260707/c678012208.shtml"}, {"id": "4667765", "title": "ST海龙：公司实际控制人胡兴荣被采取强制措施", "content": "ST海龙公告，公司第一大股东温州康南科技有限公司通知，公司实际控制人胡兴荣已被采取强制措施。胡兴荣未在公司担任职务，不参与公司日常生产经营决策。公司董事会及管理层各项决策机制运行正常，生产经营正常。", "ctime": 1783420150, "time_str": "18:29:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260707/c678012194.shtml"}, {"id": "4667757", "title": "五洲医疗：拟发行股份及支付现金收购旋智电子控股权，7月8日起停牌", "content": "五洲医疗公告，公司正在筹划发行股份及支付现金购买旋智电子科技（上海）有限公司控股权，标的公司主营业务为集成电路研发与半导体技术。因有关事项尚存在不确定性，公司股票自2026年7月8日开市起停牌，预计在不超过10个交易日内披露交易方案。最终交易价格将以评估结果为基础，由交易各方协商确定，本次交易尚存在较大不确定性。", "ctime": 1783420125, "time_str": "18:28:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260707/c678012192.shtml"}, {"id": "4667755", "title": "*ST清越：公司股票可能被实施重大违法强制退市", "content": "*ST清越公告，公司因涉嫌定期报告等财务数据虚假记载被中国证监会立案调查，并收到《行政处罚事先告知书》。根据告知书认定情况，公司可能触及《上海证券交易所科创板股票上市规则》规定重大违法行为，可能被实施重大违法强制退市。同时，公司股票2026年7月7日收盘价为0.89元，首次低于1元，可能触及交易类强制退市。", "ctime": 1783420104, "time_str": "18:28:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260707/c678012182.shtml"}, {"id": "4667753", "title": "中国冶金地质总局局长王文军一行到访中钢协", "content": "7月6日，中国冶金地质总局局长王文军一行到访中国钢铁工业协会，与中钢协党委书记、副会长兼秘书长姜维开展工作交流。双方围绕各自重点工作、行业发展实际情况深入沟通，聚焦“十五五”冶金地质发展规划、产业转型升级、资源保障等核心内容交流思路，明确了后续深化务实合作、助力钢铁行业高质量可持续发展的工作方向。（人民财讯）", "ctime": 1783420096, "time_str": "18:28:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https:/ 收入30.78亿元，同比下降37.44%", "content": "温氏股份公告，2026年6月销售肉猪收入30.78亿元，同比下降37.44%；销售肉鸡收入26.76亿元，同比增长16.96%。", "ctime": 1783419956, "time_str": "18:25:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260707/c678012122.shtml"}, {"id": "4667729", "title": "立讯精密：H股发行最终价格每股63.28港元", "content": "立讯精密公告，公司正在进行申请发行境外上市外资股（H股）并在香港联交所主板挂牌上市的相关工作，已确定本次H股发行的最终价格为每股63.28港元（不包括1%经纪佣金、0.0027%香港证券及期货事务监察委员会交易征费、0.00565%香港联交所交易费及0.00015%香港会计及财务汇报局交易征费），本次发行的H股预计于2026年7月9日在香港联交所主板挂牌并开始上市交易。", "ctime": 1783419920, "time_str": "18:25:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260707/c678012108.shtml"}, {"id": "4667723", "title": "锦浪科技：预计2026年上半年净利润同比下降23.61%～31.91%", "content": "锦浪科技公告，预计2026年1月1日至2026年6月30日归属于上市公司股东的净利润为4.1亿元至4.6亿元，同比下降23.61%至31.91%。扣除非经常性损益后的净利润预计为4.07亿元至4.57亿元，同比下降16.73%至25.84%。", "ctime": 1783419868, "time_str": "18:24:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260707/c678012090.shtml"}, {"id": "4667721", "title": "正元智慧：拟3570万元收购控股子公司坚果智慧34%股权，持股升至85%", "content": "正元智慧公告，公司于2026年7月6日召开董事会，审议通过收购控股子公司浙江坚果智慧科技有限公司34.00%股权的议案。公司拟以人民币3570万元收购周炜、王霞青持有的坚果智慧34.00%股权，其中以1575万元收购周炜持有的15.00%股权，以1995万元收购王霞青持有的19.00%股权。本次交易前公司持有坚果智慧51.00%股权，交易完成后持股比例增至85.00%。交易不涉及合并报表范围变更，对公司本期利润不产生影响。", "ctime": 1783419798, "time_str": "18:23:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260707/c678012070.shtml"}, {"id": "4667693", "title": "*ST柳化：预计2026年上半年净利润同比上升约308%", "content": "*ST柳化公告，预计2026年半年度实现归属于上市公司股东的净利润1400万元，与上年同期相比，将增加约1055万元，同比上升约308%；预计归属于上市公司股东扣除非经常性损益后的净利润1400万元，与上年同期相比，将增加约1080万元，同比上升339%。公司本次业绩预增主要原因是：报告期，双氧水市场行情向好，产品价格较上年同期有所上升；公司主动抢抓市场机遇，全力稳定生产经营，实现了装置的持续长周期、高产、低耗运行，经营业绩较上年同期实现显著增长。", "ctime": 1783419673, "time_str": "18:21:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260707/c678012033.shtml"}, {"id": "4667679", "title": "中国足协回应“佛得角邀国足踢友谊赛被婉拒”：消息不实", "content": "中国足协回应“佛得角邀国足踢友谊赛被婉拒”：消息不实。中国足协关注到网络上出现关于“佛得角邀国足踢友谊赛被婉拒”的不实信息。中国足协表示，不存在协会收到赛事邀约后予以拒绝的情况。中国足协对与佛得角足协及各国家地区足球协会进行赛事交流持开放态度。（界面新闻）", "ctime": 1783419561, "time_str": "18:19:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260707/c678011998.shtml"}, {"id": "4667675", "title": "熊猫乳品：拟以1500万元-2500万元回购公司股份", "content": "熊猫乳品公告，拟以1500万元-2500万元回购公司股份，回购价格不超过24元/股。", "ctime": 1783419493, "time_str": "18:18:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260707/c678011968.shtml"}, {"id": "4667659", "title": "沪硅产业：国家集成电路产业投资基金拟减持不超过2%股份", "content": "沪硅产业公告，持股12.49%的股东国家集成电路产业投资基金股份有限公司，基于自身经营管理需要，计划自2026年7月30日至2026年10月29日，通过大宗交易或集中竞价方式减持公司股份不超过6610.05万股，即不超过公司总股本的2%。该基金近12个月内已累计减持公司4.66%股份。", "ctime": 1783419431, "time_str": "18:17:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260707/c678011937.shtml"}, {"id": "4667657", "title": "国家医保局：郑重提醒广大医药企业，切勿采取违法违规手段干扰集采，否则后果自负", "content": "国家医保局发布风险提示，在第12批国家组织药品集中带量采购（以下简称“第12批集采”）确定采购品种阶段，某进口原研药企业提交了所谓“31家医院78名医生联署的专家建议函”，试图以此影响集采定品。经向“署名专家”本人逐一查证，80%以上签名不真实，涉及企业销售人员冒签、从他处抠图挪用、虚构人物等情况；少数确由专家本人签名的，多为企业销售人员以“售后回访”“调研问卷”等名义诱导签署。目前，该品种已按正常程序通过专家论证，正式纳入第12批集采范围，正在组织全国医药机构据实提报拟采购数量。国家医保局坚决维护各医药企业依法合规表达诉求的权利，持续全面畅通协商沟通渠道。今年上半年，已就第12批集采接待国内外企业沟通交流40批次以上，为企业解释政策、答疑解惑。同时，国家医保局坚决反对企业以不正当方式干扰药品集采工作，郑重提醒广大医药企业，切勿采取违法违规手段干扰集采，否则后果自负。", "ctime": 1783419423, "time_str": "18:17:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260707/c678011933.shtml"}, {"id": "4667639", "title": "摩根大通将苹果公司目标股价从325美元上调至345美元", "content": "摩根大通将苹果公司目标股价从325美元上调至345美元。（财联社）", "ctime": 1783419281, "time_str": "18:14:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260707/c678011854.shtml"}, {"id": "4667607", "title": "石化机械：预计上半年净亏损550万元～750万元", "content": "石化机械公告，预计2026年上半年净利润亏损550万元～750万元，上年同期盈利2802.86万元。2026年上半年，公司经营业绩出现亏损。主要原因如下：一是受上游油气勘探投资放缓影响，油气设备及工具服务的市场需求释放缓慢，公司订货、收入同比有所下降；二是受人民币升值影响，汇兑损失同比大幅增加；三是货款回收不及预期，信用减值损失同比增加；四是因减值准备变化等导致递延所得税同比增加。", "ctime": 1783419040, "time_str": "18:10:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260707/c678011750.shtml"}, {"id": "4667605", "title": "上游供应紧缺涨价推涨资源采购成本 本周行业和渠道DDR5内存条价格全面小幅拉涨", "content": "近期DDR5次级颗粒价格上扬推升行业SODIMM和渠道UDIMM生产成本，而个别PC OEM与原厂已提前锁定一定规模的供应，下半年原厂DDR5次级资源分货将更加有限，本周行业和渠道DDR5内存条价格小幅调涨。另外，行业存储厂商积极推进Q3新订单成交，个别客户订单已陆续落地，PC OEM价格承接度较强，但特定应用客户已难以接受高价，本周512GB PCIe 4.0 SSD价格继续小幅上涨，其余价格维持不变。 (科创板日报)", "ctime": 1783418996, "time_str": "18:09:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260707/c678011702.shtml"}, {"id": "4667601", "title": "荣晟环保：预计2026年上半年净利润同比增长50.40%到67.79%", "content": "荣晟环保公告，预计2026年半年度实现归属于上市公司股东的净利润为1.73亿元到1.93亿元，同比增长50.40%到67.79%；预计2026年半年度实现归属于上市公司股东的扣除非经常性损益的净利润为9119万元到1.11亿元，同比增长21.16%到47.74%。公司通过优化生产流程和设备运行效率，原纸产量同比增长，同时持续加大市场拓展力度，有效带动了营业收入的稳步提升。公司深入推进精益化管理，通过以销定产、市场化考核等举措，切实降低运营成本、提升经营效率。此外，理财收益同比增加，共同推动净利润实现增长。", "ctime": 1783418973, "time_str": "18:09:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260707/c678011692.shtml"}, {"id": "4667583", "title": "汇丰集团行政总裁艾桥智：汇丰计划扩大在香港的黄金储存能力 预计在未来几个月内提升至200吨", "content": "汇丰集团行政总裁艾桥智在“香港固定收益及货币峰会暨债券通论坛”上表示，香港推出黄金中央清算及结算系统是一个重大进展，这有助于提升流动性并增加交易。他透露，汇丰在伦敦拥有600吨黄金储存量，汇丰计划扩大在香港的黄金储存能力，预计在未来几个月内提升至200吨，以支持香港2000吨黄金储存能力的目标。此外，他还表示，汇丰在全球的黄金储存量已超过1000亿美元。艾桥智表示，香港财库局与上海黄金交易所启动首阶段“实物联通”，香港不仅能够联结亚洲与全球其他市场，同时也能通过这一机制将亚洲与内地市场联结起来。据了解，香港黄金中央清算及结算系统试运行首日，汇丰已经为多家企业和机构客户促成首批交易，并协助完成覆盖整个交易生命周期的各项活动。同日，汇丰也已通过“实物联通”完成首笔交易。（上证报）", "ctime": 1783418767, "time_str": "18:06:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260707/c678011515.shtml"}, {"id": "4667581", "title": "巨人网络：预计2026年上半年净利润同比增长157.38%～183.12%", "content": "巨人网络公告，预计2026年1月1日至2026年6月30日归属于上市公司股东的净利润为20亿元～22亿元，比上年同期增长157.38%～183.12%；扣除非经常性损益后的净利润为22亿元～24亿元，比上年同期增长172.74%～197.54%。公司预计2026年上半年营业收入及利润均实现同比大幅增长，主要系公司现象级手游《超自然行动组》持续贡献较高水平收入，为上半年业绩增长提供重要支撑。", "ctime": 1783418766, "time_str": "18:06:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260707/c678011513.shtml"}, {"id": "4667531", "title": "天齐锂业：60亿元债务融资工具获准注册", "content": "天齐锂业公告，公司此前于2025年12月8日、12月30日召开董事会和股东大会，审议通过向交易商协会申请注册发行不超过人民币60亿元债务融资工具的议案。2026年7月7日，公司收到交易商协会下发的《接受注册通知书》，同意接受公司债务融资工具注册，注册额度为60亿元，有效期2年，主承销商为兴业银行股份有限公司。公司将根据资金需求和市场情况择机一次或分期发行超短期融资券、短期融资券、中期票据、永续票据。", "ctime": 1783418452, "time_str": "18:00:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260707/c678011355.shtml"}, {"id": "4667497", "title": "威刚：Q3内存将涨价20%-30% 闪存将涨价35%-40%", "content": "威刚科技预警，2026年第三季度DRAM内存与NAND闪存价格将再度上调，内存及存储产品售价会进一步走高。威刚董事长陈立白表示，各大内存原厂已放出通知，2026年第三季度DRAM合约价将继续上涨20%至30%，NAND闪存价格涨幅更是达到35%至40%，两类存储芯片价格将持续上行，有望持续带动公司经营业绩增长。（科创板日报）", "ctime": 1783418410, "time_str": "18:00:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260707/c678011336.shtml"}, {"id": "4667483", "title": "东瑞股份：6月销售生猪收入1.52亿元，环比上升46.36%", "content": "东瑞股份公告，2026年6月份，公司共销售生猪12.54万头，销售收入1.52亿元，环比上升46.36%；商品猪销售均价10.82元/公斤，环比上升2.53%。其中向全资子公司河源市东瑞肉类食品有限公司销售生猪0.39万头。", "ctime": 1783418151, "time_str": "17:55:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260707/c678011163.shtml"}, {"id": "4667473", "title": "盛德鑫泰：实控人一致行动人质押可转债", "content": "盛德鑫泰公告，公司实际控制人之一致行动人常州联泓、常州鑫泰将所持盛德转债办理质押登记。本次质押数量分别为28.88万张、66000张，占公司可转债数量比例分别为7.1292%、1.6292%，质权人为云南国际信托有限公司，质押用途为资金需求。", "ctime": 1783418040, "time_str": "17:54:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260707/c678011036.shtml"}, {"id": "4667471", "title": "珠江股份：部分董高已增持16.26万股，达到增持计划下限", "content": "珠江股份公告，公司副董事长、总经理周星星，副总经理赵坤、喻勇，财务总监金沅武基于对公司发展前景的信心及长期投资价值的认可，此前披露拟于增持计划披露之日起6个月内通过集中竞价交易方式增持公司A股股份合计不低于16.15万股，不高于32.3万股。2026年6月23日至2026年7月7日，上述增持主体已通过集中竞价交易方式合计增持公司A股股份16.26万股，占公司总股本0.0147%，各增持主体增持数量已分别达到本次增持计划增持数量的下限。本次增持计划尚未实施完毕，增持主体后续仍将择机增持。", "ctime": 1783418037, "time_str": "17:53:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260707/c678011033.shtml"}, {"id": "4667439", "title": "苏交科：签订23亿元海外EPC+F合同，待总统令生效", "content": "苏交科公告，公司及控股子公司燕宁工科与乌兹别克斯坦塔什干投资公司签订《塔什干市道路及路边基础设施设计、施工、重建和维修项目EPC+F项目合同》，合同暂定总金额23亿元人民币，占公司2025年度经审计营业收入的55.18%。其中项目第一阶段分项工程暂定合同价为2.8亿元，占2025年度营收的6.72%。该合同为附生效条件合同，虽已签署但尚未生效，尚需取得乌兹别克斯坦共和国总统令或内阁令方生效。工程计划分7个阶段施工，总工期5年。", "ctime": 1783417908, "time_str": "17:51:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260707/c678010987.shtml"}, {"id": "4667429", "title": "证通电子：全资子公司出资200万元参与投资合伙企业", "content": "证通电子公告，公司全资子公司证通金信与合凡基金及其他有限合伙人签署协议，以自有资金200万元认购扬州合凡陆号股权投资合伙企业基金份额。该合伙企业已募集完成，证通金信已实缴出资200万元，主要投资高科技产业领域。", "ctime": 1783417826, "time_str": "17:50:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260707/c678010937.shtml"}, {"id": "4667423", "title": "万科：对23万科MTN004到期日兑付本金的40% 剩余60%本金展期一年", "co // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
