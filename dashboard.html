tock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260403/c675754553.shtml"}, {"id": "4184209", "title": "天通股份：公司及相关人员收到浙江证监局警示函", "content": "天通股份公告，公司及相关人员于2026年4月3日收到浙江证监局的警示函。警示函指出，2021年至2024年，徐州同鑫光电科技股份有限公司、徐州美兴光电科技有限公司和嘉兴天盈科技发展有限公司应认定为天通股份的关联方，但公司未披露。2022-2024年，公司与美兴光电发生的交易金额达到董事会审议标准，但公司未履行关联交易的审议程序和信息披露义务。上述行为违反了《上市公司信息披露管理办法》的规定，浙江证监局决定对公司采取责令改正的监督管理措施，并记入证券期货市场诚信档案。", "ctime": 1775202009, "time_str": "15:40:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260403/c675754552.shtml"}, {"id": "4184207", "title": "以军称过去一个月在黎巴嫩打死约1000名武装人员", "content": "当地时间4月3日，以色列国防军发布消息称，过去一个月内，以军在黎巴嫩境内对超过3500个目标实施打击，打死约1000名武装人员。声明称，目前以军由第91师、第146师、第36师和第162师主导推进在黎巴嫩南部的地面行动，并配合空中、海上打击，对武装人员、武器储存设施、发射阵地及指挥控制中心等目标实施打击。以军还表示，已打击5座关键桥梁，这些桥梁被指用于从黎巴嫩北部向南部转运武器和人员。此外，以军称，其还打击了“慈善贷款联盟”的相关资产及资金储存点，并指该机构利用民间资金，以支持黎巴嫩真主党。（央视新闻）", "ctime": 1775201992, "time_str": "15:39:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260403/c675754528.shtml"}, {"id": "4184203", "title": "柬埔寨参议院通过《反电信网络诈骗法》草案，待国王签署后实施", "content": "当地时间4月3日，柬埔寨参议院召开特别会议，审议并全票通过《反电信网络诈骗法》草案，将提交柬埔寨国王签署颁布实施。此前，柬埔寨首相洪玛奈称，柬埔寨政府将以最坚决措施铲除电信网络诈骗犯罪，彻底与电诈活动划清界限。（央视新闻）", "ctime": 1775201870, "time_str": "15:37:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260403/c675754482.shtml"}, {"id": "4184201", "title": "外交部驳斥美涉巴拿马有关港口言论：无中生有、颠倒黑白", "content": "4月3日，外交部发言人毛宁主持例行记者会。对于美方在巴拿马有关港口问题上发表的不当言论，毛宁回应指出，美方有关言论完全是无中生有，颠倒黑白，美方一再说三道四，只能暴露自身霸占运河的图谋。究竟是谁公然通过单边霸凌和胁迫破坏巴拿马运河的中立地位，破坏全球供应链的稳定，公道自在人心。中方在巴拿马有关港口问题上的立场是明确的，将坚定维护自身的正当权益。（央视新闻）", "ctime": 1775201836, "time_str": "15:37:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260403/c675754474.shtml"}, {"id": "4184185", "title": "国家互联网信息办公室就《数字虚拟人信息服务管理办法（征求意见稿）》公开征求意见", "content": "国家互联网信息办公室发布关于《数字虚拟人信息服务管理办法（征求意见稿）》公开征求意见的通知。通知提出，自数字虚拟人服务开始，数字虚拟人服务提供者、服务使用者及提供网络信息内容传播服务的服务提供者应当在数字虚拟人展示区域全程持续显示含有“数字人”字样的显著提示标识，并符合国家人工智能生成合成内容标识有关规定。（网信中国）", "ctime": 1775201518, "time_str": "15:31:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260403/c675754315.shtml"}, {"id": "4184179", "title": "海南高速：海南陵水海底智算中心已产生业务收入", "content": "海南高速4月3日在互动平台表示，公司投资建设的海南陵水海底智算中心自建成启动以来，运营情况良好，已产生业务收入。项目后续将积极关注相关补贴政策，适时申领。公司下一步将打造“交通+算力”融合生态，为智慧交通发展提供算力支撑。（人民财讯）", "ctime": 1775201485, "time_str": "15:31:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260403/c675754307.shtml"}, {"id": "4184175", "title": "北京太空算力创新中心发起筹建", "content": "在2026太空算力产业大会上，由北京经开区政府、中国信通院等联合发起的北京太空算力创新中心发起筹建。（科创板日报）", "ctime": 1775201446, "time_str": "15:30:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260403/c675754291.shtml"}, {"id": "4184163", "title": "外交部驳斥美方对中方“扣押”巴拿马籍船只的不实指责", "content": "针对美国国务卿近日指责中方“骚扰”并“扣押”巴拿马籍船只，外交部发言人毛宁4月3日在例行记者会上表示，美方有关言论完全是无中生有、颠倒黑白。美方一再说三道四，只能暴露自身霸占运河的图谋。究竟是谁公然通过单边霸凌和胁迫破坏巴拿马运河的中立地位，破坏全球供应链的稳定？公道自在人心。中方在巴拿马有关港口问题上的立场是明确的，将坚定维护自身的正当权益。(新华社)", "ctime": 1775201342, "time_str": "15:29:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260403/c675754226.shtml"}, {"id": "4184161", "title": "红果短剧下架违规短剧《桃花簪》 暂停出品方上传15天", "content": "4月3日，字节跳动旗下短剧平台红果短剧发文称：短剧《桃花簪》出品方未能向平台出具足够证实合规使用素材的证据。经细致比对核查，平台认定出品方违反相关内容合规使用规定，构成违规违约，即全面下架该剧，并暂停该出品方上传所有剧集15天。此前，一名普通人的脸部素材未经授权被用于一部AI短剧，且被塑造成贪财好色的形象，引发“AI短剧 偷脸”相关话题登上微博热搜。（第一财经）", "ctime": 1775201250, "time_str": "15:27:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260403/c675754187.shtml"}, {"id": "4184155", "title": "外交部：中美双方在禁毒执法等领域保持沟通合作 取得显著成效", "content": "4月3日，外交部发言人毛宁主持例行记者会。对于美方向中方遣返移交一名涉毒逃犯，毛宁回应表示，具体问题建议向中方的主管部门了解，我可以告诉你的是，中美双方本着平等、尊重和互惠的精神，在禁毒执法等领域保持着沟通和合作，也取得了显著的成效。（央视新闻）", "ctime": 1775201230, "time_str": "15:27:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260403/c675754181.shtml"}, {"id": "4184153", "title": "科威特一炼油厂遭无人机袭击起火", "content": "据科威特通讯社3日报道，科威特石油公司说该国艾哈迈迪港炼油厂当日凌晨遭无人机袭击，导致部分设施起火，暂无人员伤亡报告。科威特石油公司说，应急和消防部门已启动应急预案，正在全力控制火势。据报道，科威特石油公司正与环境部门协调监测炼油厂周边地区的空气质量。该公司说，截至目前，袭击事件未对环境造成负面影响。(新华社)", "ctime": 1775201170, "time_str": "15:26:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260403/c675754149.shtml"}, {"id": "4184147", "title": "中方斡旋促谈巴阿冲突，外交部回应外媒提问", "content": "在4月3日的外交部例行记者会上，有外媒记者提问关于阿富汗和巴基斯坦在中国举行的和谈及中方是否会提供保证以防止阿巴两国再起冲突。发言人毛宁表示，中方一直在以自己的方式斡旋促谈，多渠道、多层级同双方保持密切沟通，为对话创造条件、提供平台。巴基斯坦和阿富汗都重视和欢迎中方的斡旋，愿意坐下来再次商谈，这是好事。商谈的进程正在平稳落实和推进之中。三方对具体操作模式，包括新闻报道也有共识和约定，如果有进一步的消息，外交部会适时发布。（环球网）", "ctime": 1775201120, "time_str": "15:25:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260403/c675754128.shtml"}, {"id": "4184141", "title": "外交部回应伊朗桥梁遭袭：中方反对袭击民用设施 有关方应立即停火", "content": "4月3日，外交部发言人毛宁主持例行记者会。有记者问：昨日，美国总统特朗普在社交媒体发布视频，宣称美军空袭摧毁了伊朗一座民用桥梁，以此施压伊朗回到谈判桌前。对此，伊朗外长回应称，摧毁民用设施无法迫使伊朗屈服。中方对此有何评论？毛宁表示，美国和以色列对伊朗发动军事行动，未经联合国安理会授权，违反国际法。中方反对袭击民用设施，有关方应当立即停火，回到政治外交解决轨道，避免出现更大的人道灾难。（央视新闻）", "ctime": 1775201085, "time_str": "15:24:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260403/c675754109.shtml"}, {"id": "4184135", "title": "工业和信息化部批复设立深圳国家级互联网骨干直联点", "content": "2026年3月30日，工业和信息化部批复设立深圳国家级互联网骨干直联点。国家级互联网骨干直联点是实现互联网骨干网互联互通的核心节点，是汇聚和疏通网间流量的重要通信枢纽。截至目前，工业和信息化部共批复设立30个直联点，进一步优化我国互联互通基础设施布局，提升互联网整体通信性能和效率，带动地方传统产业数字化转型升级。下一步，工业和信息化部将指导广东省通信管理局、基础电信企业做好深圳直联点的建设及运行维护工作，确保深圳直联点顺利建成并发挥效用，助力区域数字经济高质量发展，为网络强国、数字中国建设提供有力支撑。（工信部）", "ctime": 1775201017, "time_str": "15:23:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260403/c675754063.shtml"}, {"id": "4184117", "title": "俄罗斯发射“联盟-2.1a”运载火箭 搭载军用卫星", "content": "俄罗斯国防部通报，莫斯科时间4月3日9时28分，一枚“联盟-2.1a”中型运载火箭从阿尔汉格尔斯克州的普列谢茨克航天发射场成功发射，火箭搭载了一颗军用卫星。（央视新闻）", "ctime": 1775200801, "time_str": "15:20:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260403/c675753936.shtml"}, {"id": "4184109", "title": "2026太空算力产业大会发布十大重点攻关项目", "content": "4月3日，在2026太空算力产业大会上，算力产业发展方阵“太空算力专业委员会”成立。大会当天发布十大重点攻关项目，包括卫星平台级、芯片级、载荷板卡级、组网运行级、硬件系统级、系统软件级、产业应用级、交叉-结构级、交叉-运载火箭级、交叉-散热级等关键技术，将联合产业界开展攻关合作。（第一财经）", "ctime": 1775200679, "time_str": "15:17:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260403/c675753870.shtml"}, {"id": "4184091", "title": "工信部电子信息司与中兴通讯、小米集团对接电子信息制造业“十五五”发展规划", "content": "近期，工业和信息化部电子信息司电子信息制造业“十五五”规划编制组与中兴通讯股份有限公司、小米集团先后开展专题座谈调研。中兴通讯股份有限公司、小米集团相关部门负责同志分别就芯片、基础网络、智能手机终端、彩电、智能可穿戴、智能家居、人工智能终端、数字化转型等领域做了专题介绍，表示“十五五”时期是电子信息制造业转型升级的关键窗口期，产业创新活力持续释放，智能化、绿色化、融合化发展趋势明显，以人工智能为核心的新一轮科技革命将深度重构产业生态，带动人工智能终端、算力基础设施、智能网联汽车等新兴领域加速崛起，推动电子信息制造业向高端化、智能化方向跃升，为数字经济发展和新型工业化建设提供坚实支撑。围绕“十五五”期间电子信息制造业重点发展方向，中兴通讯、小米集团分别研提了相关意见建议。（工信部）", "ctime": 1775200491, "time_str": "15:14:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260403/c675753762.shtml"}, {"id": "4184077", "title": "商务部等9部门联合印发《服务消费提质惠民行动2026年工作方案》", "content": "近日，商务部等9部门联合印发《服务消费提质惠民行动2026年工作方案》。《工作方案》从完善政策支持、创新消费场景、搭建平台载体、扩大对外开放、强化标准引领、优化消费环境等6个方面，提出64条具体任务举措，围绕餐饮住宿、养老托育、文娱旅游、体育健康等传统服务消费领域，和家政服务、网络视听、入境消费、演出服务等新增长点领域，从供给和需求两端协同发力，打造一批带动面广、显示度高的消费新场景。（商务部）", "ctime": 1775200263, "time_str": "15:11:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260403/c675753316.shtml"}, {"id": "4184069", "title": "中国外贸信托卫濛濛有新任职！原董事长调任中国中化", "content": "4月3日，中国外贸信托公告，李强因工作变动不再担任该公司董事长，由卫濛濛代为履行董事长职责，代为履职期限不超过6个月。从知情人士处获悉，卫濛濛即将出任中国外贸信托董事长，其任职资格经监管部门核准后生效，此前将代行董事长职责。同时，卫濛濛已升任中国外贸信托股东中化资本有限公司总经理、党委副书记。另据记者了解，外贸信托原董事长李强已调任中国中化集团；同时，外贸信托新任总经理目前也已有人选。(21世纪经济报道)", "ctime": 1775200202, "time_str": "15:10:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260403/c675753272.shtml"}, {"id": "4184059", "title": "小米线下策略调整，手机销量预计下降13%", "content": "知情人士透露，小米内部预计今年手机业务销量将下滑13%，正着手调整其线下门店策略，将营收重心转向大家电业务，停止线下门店扩张，线下门店也从“业务型”转向“经营型”来提效。截至发稿，小米对此没有回复。知情人士称，这些调整系由小米北京总部自上而下逐级传达。入职两三年的小米员工王勇（化名）透露，上周他们召开了“店长大会暨门店经营提质大赛启动会”，传达了上述调整方向。包括区域经理及店长等近300人到场，覆盖某沿海一二线城市。小米相关调整的核心原因在于成本压力。今年，手机厂商正面临近年来最严峻的成本考验。随着AI（人工智能）算力需求攀升，存储等核心器件价格持续走高，手机行业今年3月出现一轮新的集体涨价潮。主流手机厂商OPPO、vivo、荣耀相继上调部分机型售价，小米在4月3日也发布涨价公告，华为手机暂时还没有涨价。(财经杂志)", "ctime": 1775199948, "time_str": "15:05:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260403/c675753129.shtml"}, {"id": "4184047", "title": "泰国公主诗琳通将访华", "content": "外交部发言人宣布：应中国政府邀请，泰王国玛哈扎克里·诗琳通公主殿下将于4月4日至11日访问中国。(外交部网站)", "ctime": 1775199824, "time_str": "15:03:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260403/c675753079.shtml"}, {"id": "4184037", "title": "A股收评：三大指数缩量下跌上证指数跌1% 全市场超4700家个股下跌", "content": "截至收盘，上证指数跌1%报3880.10点，深证成指跌0.99%报13352.90点，创业板指跌0.73%报3149.60点，北证50跌2.12%报1254.68点。全市场成交额16689亿元，较上日成交额缩量1889亿元。\n板块题材上，光刻机、CPO板块涨幅居前；煤炭、油气、养殖业板块跌幅居前。\n盘面上，光刻机板块持续走高，中船特气20CM涨停，中润光学、美迪凯张超10%，中瓷电子涨停。CPO板块走强，易天股份、德科立、威腾电气20CM涨停，腾景科技、光库科技涨超10%。煤炭板块持续走弱，云煤能源、山西黑猫跌超8%，油气板块低开低走，博汇股份跌超10%，新天然气、蓝焰控股跌超5%。养殖业持续下挫，京基智农跌停，晓鸣股份、湘佳股份跌超5%。", "ctime": 1775199714, "time_str": "15:01:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260403/c675752979.shtml"}, {"id": "4184031", "title": "ETF收评：港股通100ETF领涨6.09%，养殖ETF领跌3.03%", "content": "ETF收盘涨跌不一，港股通100ETF（513900）领涨6.09%，港股通ETF（513990）涨3.86%，通信ETF（515880）涨2.78%，养殖ETF（159867）领跌3.03%，建材ETF（159745）跌2.88%，新能源ETF（516270）跌2.81%。", "ctime": 1775199676, "time_str": "15:01:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260403/c675752971.shtml"}, {"id": "4184023", "title": "股指期货午盘收盘 主力合约全线收跌", "content": "股指期货午盘收盘，主力合约全线收跌。沪深300股指期货(IF)主力合约跌0.41%，上证50股指期货(IH)主力合约跌0.55%，中证500股指期货(IC)主力合约跌0.35%，中证1000股指期货(IM)主力合约跌0.49%。", "ctime": 1775199648, "time_str": "15:00:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260403/c675752960.shtml"}, {"id": "4183963", "title": "天孚通信成交额达100亿元", "content": "天孚通信成交额达100亿元，现涨3.81%。", "ctime": 1775198519, "time_str": "14:41:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260403/c675752632.shtml"}, {"id": "4183957", "title": "以色列称美以伊冲突已致以方超6500人受伤", "content": "当地时间3日上午，以色列卫生部发布通告称，过去24小时内，共有148人在本轮美以伊冲突中受伤并被送医治疗。自2月28日以来，累计已有6594人入院治疗，统计数据涵盖军人和平民。（央视新闻）", "ctime": 1775198473, "time_str": "14:41:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260403/c675752617.shtml"}, {"id": "4183943", "title": "沪深京三市成交额超1.5万亿元，较上日此时缩量1895亿元", "content": "据同花顺iFinD数据，沪深京三市成交额超1.5万亿元，较上日此时缩量1895亿元，预计全天成交金额约1.6万亿元。截至目前，沪市成交额6433亿元，深市成交额8461亿元，北证50成交额111亿元。", "ctime": 1775198219, "time_str": "14:36:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260403/c675752536.shtml"}, {"id": "4183923", "title": "东航：4月5日起调整国内航线燃油附加费征收标准", "content": "中国东方航空股份有限公司4月3日发布通知，自2026年4月5日（含）起销售的客票，东航调整国内航线旅客运输燃油附加费征收标准。800公里（含）以下航段，每位旅客收取人民币60元；800公里以上航段，每位旅客收取人民币120元。此前，国航、厦航、中联航等多家航司也发布公告，调整国内航线旅客运输燃油附加费收取标准。", "ctime": 1775198040, "time_str": "14:34:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260403/c675752431.shtml"}, {"id": "4183911", "title": "日韩股市集体收涨", "content": "日经225指数收涨1.26%，报53123.49点。韩国综指收涨2.74%，报5377.30点。", "ctime": 1775197917, "time_str": "14:31:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260403/c675752382.shtml"}, {"id": "4183897", "title": "中科宇航运载火箭专利获授权 可改善火箭倒锥段噪声环境", "content": "企查查APP显示，近日，北京中科宇航技术有限公司“一种运载火箭”专利获授权。企查查专利摘要显示，本申请涉及火箭技术领域，包括：整流罩、倒锥段和箭体柱段，箭体柱段的上边缘与倒锥段的下边缘固定；倒锥段的上端插入至整流罩的内部，并且倒锥段的上边缘固定至整流罩的内壁靠近整流罩的下边缘的位置，将整流罩处于倒锥段的上边缘与整流罩的下边缘之间的部分作为遮蔽裙段，以对倒锥段遮蔽脉动压力。本申请可以降低倒锥段所受的脉动压力，并且同时还保证整流罩的容量，降低对倒锥段的结构强度要求，另外本申请还兼顾了整流罩、倒锥段和箭体柱段，使脉动压力的变化趋于平缓，改善了火箭倒锥段和仪器舱内的噪声环境。（人民财讯）", "ctime": 1775197753, "time_str": "14:29:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260403/c675752318.shtml"}, {"id": "4183891", "title": "谷歌更新Gemini API定价 按推理使用分档计费", "content": "谷歌近日对Gemini API的计费档位进行更新，优化方案与定价均基于实际推理使用需求制定。本次新增的推理服务档位包括：标准(Standard)、弹性(Flex)、优先(Priority)、批量(Batch)和缓存(Caching)版。其中，弹性推理档位通过利用非高峰闲置算力资源，提供标准价格五折优惠，目标延迟为1至15分钟，但不提供延迟保证。批量API档位同样提供标准费率五折优惠，延迟最长可达24小时。缓存档位计费依据缓存词元(Token)数量与存储时长，推荐用于搭载复杂系统指令的对话机器人、长视频文件重复分析，以及大规模文档集查询等场景。优先档位定价则比标准价格高出75%至100%，延迟可控制在毫秒至秒级。谷歌建议该档位用于实时客服聊天机器人、实时欺诈检测及业务关键型智能助手等场景。", "ctime": 1775197599, "time_str": "14:26:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260403/c675752252.shtml"}, {"id": "4183867", "title": "敏昂 // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
