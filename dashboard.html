ws.10jqka.com.cn/20260720/c678285390.shtml"}, {"id": "4756383", "title": "特斯拉FSD可个性化调整了 马斯克称特斯拉FSD会模仿驾驶风格", "content": "7月20日，埃隆·马斯克已确认特斯拉FSD（Full Self-Driving）软件正在从过去的“通用型、一套方案适用于所有用户”的驾驶系统，转变为真正的个性化驾驶系统。近日，一名特斯拉FSD用户在X平台上抱怨，车辆经常会在不该离开的位置驶出高载客车道或快速车道，主动退出左侧高效车道后进入拥堵车流，而旁边最左侧车道上的车辆仍然畅通无阻，非常令人烦恼。对此，马斯克回应称：“车辆将开始记住你具体的人工干预行为，并根据每个人的个人偏好进行调整。”（新浪财经）", "ctime": 1784522133, "time_str": "12:35:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260720/c678285380.shtml"}, {"id": "4756379", "title": "加拿大总理称该国面临“史上最严峻山火季之一”，美国总统特朗普对媒体称，就加拿大山火烟霾跨境蔓延至美国一事，与卡尼进行了沟通", "content": "19日当天，美国总统特朗普对媒体称，就加拿大山火烟霾跨境蔓延至美国一事，与卡尼进行了沟通。特朗普称，他告诉卡尼，“你们得阻止这些山火毒害我们的空气。”特朗普还说，“也许他们应该赔我们一些损失，或者我们应该收点关税。”（央视新闻）", "ctime": 1784521925, "time_str": "12:32:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260720/c678285339.shtml"}, {"id": "4756377", "title": "公司是否有自研芯片？国安达回复", "content": "有投资者向国安达提问，公司有没有自研芯片的？\n7月20日，公司回答表示，司暂无自研芯片。", "ctime": 1784521919, "time_str": "12:31:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260720/c678285337.shtml"}, {"id": "4756375", "title": "公司有存储芯片相关研究吗？兆驰股份回复", "content": "投资者向兆驰股份提问，公司有存储芯片相关研究吗？\n7月20日，公司回答表示，目前公司暂无存储芯片相关业务。", "ctime": 1784521897, "time_str": "12:31:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260720/c678285335.shtml"}, {"id": "4756373", "title": "AI机器人上新了 一大波机器人同事即将上岗", "content": "2026世界人工智能大会（WAIC）正在上海举行，AI正从前沿技术进化为智能伙伴，让每个人、每个产业用得上、用得起。本届WAIC发布了10件“镇馆之宝”。商用全尺寸人形机器人远征A3 Ultra成为其中唯一一款具身智能机器人产品。全球首款量产版载人变形机甲GD01在本届WAIC首展。这款“现实版高达”采用自研高精度伺服驱动系统与高强度结构，自研变形控制算法，攻克了传统载人机器人形态单一、复杂地形通过性差的行业难题。全球首个可变形个人机器人来了！区别于传统单一形态机器人，启元T1最大的特点在于能够根据环境变化，自主切换不同运动形态，以适应更加丰富的生活场景，以可变形态设计锚定家用多场景需求，为大众市场再次定义个人机器人全新产品形态。今年5月，上海明确提出，加速人形机器人等创新产品突破产业规模化发展瓶颈。到2028年，要推动大型企业实现智能工厂全覆盖，机器人密度提高到600台/万人。力争到“十五五”末推动10万台人形机器人进入工厂。从供给端的产量突破到需求端的工厂部署，人形机器人正在从“大型玩具”转变为真正的生产力工具。（央视财经）", "ctime": 1784521875, "time_str": "12:31:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260720/c678285328.shtml"}, {"id": "4756371", "title": "国际精密是否间接进入智元机器人的供应链？中国宝安回应", "content": "有投资者向中国宝安（000009.SZ）提问，有报道公司旗下的国际精密（00929.HK），谐波减速器及关节模组和丝杠产品有供货到具身机器人意优科技，是否意味间接进入智元机器人的供应链，不知道现在对意优科技的出货量有多少?\n7月20日，公司回答表示，国际精密与意优科技有业务合作，但目前业务占比不大。", "ctime": 1784521849, "time_str": "12:30:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260720/c678285326.shtml"}, {"id": "4756365", "title": "京东网上离境退税三项核心服务升级正式落地", "content": "7月20日，京东网上离境退税三项核心服务升级正式落地——离境退税办理全程无纸化、境外银行卡支付和“即买即退”。其中，京东支付“外卡内绑”成为此次升级的重要组成部分，进一步打通境外旅客购物支付与退税到账全流程，实现从支付到退税一张境外卡即可完成。(券中社)", "ctime": 1784521488, "time_str": "12:24:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260720/c678285285.shtml"}, {"id": "4756363", "title": "上半年我国创新药对外技术授权交易额创新高", "content": "工业和信息化部运行监测协调局局长陶青20日表示，今年上半年，我国创新药高质量成果不断涌现，38款创新药获批上市，其中国产创新药31款。创新药对外技术授权再创新高，交易总额超过1000亿美元。 陶青在当天举行的国新办新闻发布会上说，面对复杂严峻的外部环境和行业转型压力，我国医药工业展现出强大韧性。1至6月，规模以上医药工业增加值同比增长6.4%，其中，生物制品增速达到两位数，成为驱动行业发展提速的主要引擎。医药出口交货值超过2100亿元，同比增长9%，出口结构不断优化，化学制剂、生物制品等高附加值产品占比近20%，出口结构正从以原料药为主，向具有高附加值的制剂产品加速切换。 此外，数智技术、绿色技术赋能医药工业加速转型升级。全面协同推进医药工业数字化、智能化改造，梯度培育医药智能工厂，支持21家医药工业企业建设卓越级智能工厂，加快推进医药工业绿色低碳转型，累计培育300余家绿色工厂。 陶青表示，下一步将加快《医药工业发展“十五五”规划》宣贯落实，集中力量打造“创新医药”“数智医药”“普惠医药”和“开放医药”，继续加强原始技术和关键核心技术攻关，运用人工智能全面赋能产业发展。加强对“一老一小”、罕见病患者等重点群体用药保障，努力让每一位患者都能用得上、用得起、用得好，让更多“中国造”的好药、新药更快惠及全球患者。(新华社)", "ctime": 1784521475, "time_str": "12:24:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260720/c678285282.shtml"}, {"id": "4756361", "title": "建立全链条服务能力 我国在孵科技型企业和团队数量超42.5万家", "content": "在国务院新闻办公室今天举行的新闻发布会上，工业和信息化部相关负责人表示，目前，我国正聚焦畅通成果产业化渠道和科技型企业孵化链条，以培育壮大科技服务业为抓手，着力推动科技创新和产业创新更深度融合。工业和信息化部总工程师王卫明介绍，建立从“研发到中试再到孵化”的全链条服务能力。在研发服务阶段，新成立2家国家制造业创新中心，累计布局达到32家，持续提升行业关键共性技术的供给能力。在中试服务阶段，形成了由21家国家级制造业中试平台、331家重点培育平台和1800多家储备平台组成的全国制造业中试服务网络。在孵化服务阶段，认定并发布首批14家卓越级和402家标准级工业和信息化部科技型企业孵化器。截至目前，在孵企业和团队数量超过42.5万家。（央视新闻）", "ctime": 1784521393, "time_str": "12:23:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260720/c678285270.shtml"}, {"id": "4756357", "title": "三峡能源：控股股东三峡集团拟增持15亿至30亿元", "content": "三峡能源公告，控股股东三峡集团计划于2026年7月20日～2027年7月19日通过上海证券交易所系统以集中竞价、大宗交易等方式增持公司A股，拟增持股份金额不低于人民币15亿元、不高于人民币30亿元，资金来源为自有及自筹资金。本次增持不设定价格区间。", "ctime": 1784521218, "time_str": "12:20:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260720/c678285247.shtml"}, {"id": "4756355", "title": "上汽集团：控股股东承诺6个月内不以任何方式减持其持有的公司股份", "content": "上汽集团公告，收到控股股东承诺函，上汽总公司承诺自承诺函签署之日（2026年7月20日）起6个月内，不以任何方式减持其持有的公司股份，包括因公司资本公积转增股本、派送股票红利等事项取得的新增股份。", "ctime": 1784521163, "time_str": "12:19:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260720/c678285235.shtml"}, {"id": "4756353", "title": "韩国KOSPI指数跌幅扩大至5%", "content": "韩国KOSPI指数跌幅扩大至5%，SK海力士跌逾5%，三星电子跌逾4%。", "ctime": 1784521131, "time_str": "12:18:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260720/c678285232.shtml"}, {"id": "4756347", "title": "小商品城：董事长提议2026年中期利润分配不低于净利润25%", "content": "小商品城公告，公司董事会收到董事长陈德占先生关于制定2026年中期利润分配方案的提议。为积极回报投资者，结合公司经营发展、盈利水平及现金流等因素，董事长提议在符合相关法律法规及《公司章程》前提下，以未来实施2026年度中期利润分配方案的股权登记日公司总股本为基数，公司2026年度中期利润分配金额不低于公司2026年半年度归属于上市公司股东的净利润的25%。具体方案将由董事会根据半年度财务情况等在年度股东会授权范围内依法制定，并履行审批及信披义务。该方案尚需提交董事会审议通过后方可实施。", "ctime": 1784521028, "time_str": "12:17:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260720/c678285094.shtml"}, {"id": "4756345", "title": "我国电子信息制造业保持快速增长态势，盈利能力显著提升", "content": "在国务院新闻办公室今天举行的新闻发布会上，相关负责人介绍，今年以来，我国电子信息制造业继续保持快速增长态势，盈利能力显著提升，产业提质升级成效不断显现，实现“十五五”时期良好开局。工业和信息化部新闻发言人、运行监测协调局局长陶青介绍，规模以上计算机、通信和其他电子设备制造业增加值、营业收入均实现两位数增长。今年上半年，生产同比增长14.8%，投资同比增长6.5%；前5个月实现营业收入超7.5万亿元，同比增长17.1%；利润超4200亿元，较上年同期翻一番。上半年，电子信息制造业在技术和产品上创新亮点纷呈。一批人工智能终端企业，凭借灵活的市场机制和完善的产业链配套体系推出AI乐器、AI摄像头、AI耳机等多款产品，丰富消费市场选择。北斗独立定位芯片攻关突破取得新进展，北斗产品种类持续丰富，出货量快速攀升。（央视新闻）", "ctime": 1784520990, "time_str": "12:16:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260720/c678285087.shtml"}, {"id": "4756343", "title": "中国太保：将继续投资科技成长、消费、新能源等领域股票及ETF", "content": "中国太保公告，今年以来，公司持续发挥保险资金长期投资优势，加大权益配置比例。后续将继续投资科技成长、消费、新能源等领域股票及ETF，支持培育和发展新质生产力，做真正的市场耐心资本。2026年，公司着力优化分红节奏，积极筹备中期利润分配工作，根据公司2025年度股东会决议，授权董事会决定2026年中期利润分配方案，增强分红稳定性、持续性和可预期性，进一步提升投资者获得感。", "ctime": 1784520955, "time_str": "12:15:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260720/c678285079.shtml"}, {"id": "4756335", "title": "红塔证券：董事长提议以5000万元至1亿元回购股份用于注销", "content": "红塔证券公告，公司于2026年7月20日收到董事长景峰提交的《关于提议红塔证券进行股份回购注销的函》。提议基于对公司未来发展的信心和价值的认可，拟以自有资金通过集中竞价方式回购公司部分股份，回购资金总额不低于5000万元（含）且不超过1亿元（含），回购价格上限不高于董事会审议通过回购方案前30个交易日公司股票交易均价的150%，回购股份将用于减少注册资本。上述回购事项尚需经公司董事会及股东会审议通过，存在不确定性。", "ctime": 1784520695, "time_str": "12:11:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260720/c678285035.shtml"}, {"id": "4756331", "title": "中软国际：与月之暗面签署Token分成协议，基于万亿参数模型合作", "content": "中软国际公告，近日公司与北京月之暗面科技有限公司签署Token分成及联合创新合作协议，双方将共建FDE创新实验室，布局企业级Agentic AI业务。月之暗面拥有万亿参数基础模型Kimi K2.7 Code/K3，中软国际提供企业场景及行业knowhow，首期聚焦能源电力行业。双方采用Token分成机制，并推进算力合作。", "ctime": 1784520579, "time_str": "12:09:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260720/c678285022.shtml"}, {"id": "4756329", "title": "国家医保局：定点医药机构医保基金智能监管事前提醒接入率超七成", "content": "据国家医保局消息，近年来，医保部门在坚持严查严打、保持基金监管高压态势的同时，高度重视打防结合、关口前移，积极推动事前提醒在定点医药机构落地应用，把各类违法违规问题消灭在“萌芽”状态，从源头上减少违法违规问题的发生。\n根据国家医保信息平台数据，截至6月30日，全国定点医药机构事前提醒系统接入率已达到71%，提前完成了年初提出的70%的接入率目标。今年1—6月，医保智能监管事前提醒已累计5605万人次，涉及金额129亿元。", "ctime": 1784520549, "time_str": "12:09:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260720/c678285017.shtml"}, {"id": "4756325", "title": "水利部：广西东部部分地区发生山洪灾害可能性大", "content": "今天（20日）上午，水利部举行会商，分析研判全国的防汛形势，安排部署暴雨洪水防御工作。据预报，7月20日至7月22日，受降雨影响，珠江流域西江中游干流及支流郁江、柳江、桂江、贺江，长江中下游及洞庭湖水系湘江资水，鄱阳湖水系赣江修河昌江乐安河等主要河流将出现涨水过程，暴雨区内部分中小河流可能发生超警洪水。7月20日8时至7月21日8时，广西东部部分地区发生山洪灾害可能性大。水利部发布橙色山洪灾害气象预警，提醒暴雨洪水影响地区社会公众注意防范。（央视新闻）", "ctime": 1784520413, "time_str": "12:06:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260720/c678284961.shtml"}, {"id": "4756323", "title": "俄称击落大批飞向莫斯科的敌方无人机", "content": "当地时间20日，俄罗斯首都莫斯科市长索比亚宁在社交媒体发文称，当地时间19日20时30分至20日5时，超过400架敌方无人机飞向莫斯科地区，大部分在远距离被俄防空系统拦截，85架在接近莫斯科时被摧毁。本月7日，俄罗斯方面曾通报，6日傍晚至7日清晨，有超过430架无人机飞向莫斯科地区。有报道称，这是近两年来乌克兰武装部队对莫斯科较大规模的一次无人机袭击。（央视新闻）", "ctime": 1784520372, "time_str": "12:06:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260720/c678284954.shtml"}, {"id": "4756321", "title": "伊朗西部地区发生5.5级地震", "content": "据欧洲地中海地震中心消息，当地时间7月20日，伊朗西部地区发生5.5级地震。(央视新闻)", "ctime": 1784520321, "time_str": "12:05:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260720/c678284941.shtml"}, {"id": "4756317", "title": "同花顺：董事长提议2026年中期每10股派2元", "content": "同花顺公告，公司于2026年7月20日收到董事长易峥先生提议，拟以2026年6月30日总股本7.53亿股为基数，向全体股东每10股派发现金2元（含税），共计派发现金1.51亿元（含税），不送红股，不转增股本。该提议需经董事会审议及后续审批程序，尚存在不确定性。", "ctime": 1784520242, "time_str": "12:04:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260720/c678284929.shtml"}, {"id": "4756315", "title": "广汽本田合资续约到2038年", "content": "7月20日，本田中国宣布，本田和广汽就双方旗下广汽本田汽车有限公司（简称“广汽本田”）合资合作项目正式签署战略续约协议，在股比保持不变的同时将合作期限延长至2038年。本田中国称，当前中国已发展成为全球规模最大的汽车市场，并随着电动化、智能化技术的快速发展，竞争日益激烈。在此背景下，本田和广汽集团将充分发挥各自的技术和资源优势，全力推动广汽本田加速重塑核心竞争力，实现向新能源转型，持续提供满足用户需求的多样化产品。据了解，广汽本田是本田在中国负责汽车生产销售的首家合资公司，1998年7月成立，截至目前累计整车销量突破1100万辆。(新京报)", "ctime": 1784520211, "time_str": "12:03:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260720/c678284923.shtml"}, {"id": "4756307", "title": "7月20日午间公告一览：璞泰来预计2026年上半年净利润同比增长32.66%到42.14%", "content": "同花顺公告，董事长提议2026年中期每10股派2元；璞泰来公告，预计2026年上半年净利润同比增长32.66%到42.14%；西子洁能公告，筹划发行H股股票并在香港联合交易所有限公司上市；上海机场公告，控股股东提议将2026年度中期现金分红比例提升至55%；巨化股份公告，董事长周黎旸提议10派2.2元；长川科技公告，赵轶提议2026年中期利润分配方案，每10股派发现金红利1元（含税）；华东医药公告，董事长吕梁提议中期每10股派3.5元。", "ctime": 1784520106, "time_str": "12:01:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260720/c678284900.shtml"}, {"id": "4756303", "title": "港股午评：恒生指数涨2.07%，恒生科技指数涨2.91%", "content": "港股午间收盘，恒生指数涨2.07%，恒生科技指数涨2.91%。恒指港股通ETF银华（159318）涨2.53%，港股通科技ETF鹏华（159751）涨3.72%。板块方面，能源设备与服务、饮料板块涨幅靠前。个股方面，沪上阿姨涨28.26%，迅策涨17.78%，东阳光药涨11.43%，映恩生物-B涨10.7%，兖矿能源涨9.94%；环球华商俱乐部跌24.57%，真健康医疗-B跌21.77%，麦科医药-B跌14.58%，智谱跌13.01%，德适-B跌8.59%。", "ctime": 1784520069, "time_str": "12:01:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260720/c678284893.shtml"}, {"id": "4756297", "title": "伊朗革命卫队称打击科威特境内美军目标", "content": "伊朗伊斯兰革命卫队20日发布声明称，革命卫队当天打击了科威特境内多处美军目标。声明称，革命卫队当天使用无人机摧毁了美军位于科威特的一处预警雷达系统。在另一次行动中，伊朗打击了美军在科威特的阿里·萨利姆空军基地，击中一处飞机零件仓库、一座用于停放MQ－9无人机的机库，摧毁数架无人机。伊朗革命卫队在声明中写道：“科威特不应成为美军的避风港。”（新华社）", "ctime": 1784519964, "time_str": "11:59:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260720/c678284859.shtml"}, {"id": "4756295", "title": "日本防卫大臣称“有必要讨论核武器”", "content": "当地时间18日，日本防卫大臣小泉进次郎在一档节目中表示，为加强防卫能力，有必要就核武器展开相关讨论，“尽管这是很难在日本国内讨论的问题。”自1971年以来，“无核三原则”一直是日本政府关于核武器的基本政策，也就是“不拥有、不制造、不运进核武器”。据悉，高市政府企图对“无核三原则”中不运进核武器的原则进行修改。相关动向引发日本各界强烈担忧。自高市早苗政府去年10月成立以来，日本已有82个地方议会向中央政府或国会提交意见书，要求坚持“无核三原则”。（央视新闻）", "ctime": 1784519946, "time_str": "11:59:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260720/c678284857.shtml"}, {"id": "4756293", "title": "水利部维持对广西、湖北、湖南3省份的洪水防御Ⅳ级应急响应", "content": "记者20日从水利部组织的滚动会商获悉，当前水利部维持对广西、湖北、湖南3省份的洪水防御Ⅳ级应急响应。记者了解到，根据24小时降雨预报，水利部向河北、内蒙古、安徽、江西、山东、湖南、广东、广西等8省份发出“一省一单”靶向预警，通报强降雨覆盖范围县（市、区）名单、水库名单、山洪灾害风险区域及点位，提醒做好水库安全度汛、中小河流洪水和山洪灾害防御等工作。（新华社）", "ctime": 1784519763, "time_str": "11:56:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260720/c678284834.shtml"}, {"id": "4756289", "title": "洋河股份成立文化发展公司", "content": "企查查APP显示，近日，宿迁文启文化发展有限公司成立，法定代表人为薛永胜，经营范围包含组织文化艺术交流活动；非物质文化遗产保护；数字创意产品展览展示服务；互联网销售等。企查查股权穿透显示，该公司由洋河股份旗下江苏双沟酒业股份有限公司全资持股。（人民财讯）", "ctime": 1784519682, "time_str": "11:54:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260720/c678284822.shtml"}, {"id": "4756283", "title": "巴彦油田原油总产量突破600万吨", "content": "7月19日，位于内蒙古巴彦淖尔的巴彦油田原油总产量累计突破600万吨大关。这是继2025年12月突破500万吨后，仅用7个月时间再次跨越百万吨台阶。上半年，油田生产原油超87万吨，完成年度计划的51%，日产量稳定在4800吨，同比增长20%，贡献华北油田近三分之一日产量。河套盆地成藏条件复杂，主力油田平均埋深超5000米，是我国埋藏最深的整装陆相碎屑岩油藏。自2018年钻出首口高产工业油流井以来，高效开发不断提速：第一个百万吨用时49个月，随后四个百万吨依次缩短至13个月、10个月、9个月、8个月，如今第六个百万吨更压缩到7个月，效率越来越高，用时越来越短，整体呈跨越式增长态势，凸显勘探开发能力持续跃升。（央视新闻）", "ctime": 1784519515, "time_str": "11:51:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260720/c678284796.shtml"}, {"id": "4756281", "title": "截至6月底 我国5G基站达到510.2万个", "content": "在国务院新闻办公室今天举行的新闻发布会上，工业和信息化部相关负责人表示，上半年，电信业务总量同比增长7.9%，信息通信业总体呈现四个“稳步提升”的良好态势。工业和信息化部新闻发言人、信息通信管理局局长谢存介绍，基础设施支撑能力稳步提升。截至6月底，5G基站达到510.2万个，具备千兆网络服务能力的10GPON端口达3286万个。积极推进5G-A商用网络建设，万兆光网在小区、工厂、园区等场景实现试点部署。我国智能算力规模达2185EFLOPS，同比增长177%。（央视新闻）", "ctime": 1784519392, "time_str": "11:49:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260720/c678284766.shtml"}, {"id": "4756271", "title": "上海机场：控股股东提议将2026年度中期现金分红比例提升至55%", "content": "上海机场公告，控股股东上海机场（集团）有限公司提议公司在制定2026年度中期利润分配方案时考虑将2026年度中期现金分红比例提升至55%左右。公司2025年度股东会已授权董事会实施2026年度中期分红。公司董事会认为上述提议符合相关监管要求和《公司章程》有关规定，契合公司当前经营情况及未来发展需要，拟在审议2026年半年度报告时针对以上提议及时履行相应的审议程序和信息披露义务。", "ctime": 1784519100, "time_str": "11:45:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260720/c678284688.shtml"}, {"id": "4756269", "title": "长川科技：赵轶提议2026年中期利润分配方案 每10股派发现金红利1元（含税）", "content": "长川科技公告，公司实际控制人、董事长兼总经理赵轶先生提议2026年中期利润分配方案：以公司未来实施2026年中期利润分配方案的股权登记日的总股本为基数，向全体股东每10股派发现金红利1元（含税），不送红股，不以资本公积转增股本。", "ctime": 1784519090, "time_str": "11:44:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260720/c678284685.shtml"}, {"id": "4756267", "title": "西子洁能：筹划发行H股股票并在香港联合交易所有限公司上市", "content": "西子洁能公告，公司正在筹划境外发行股份（H股）并申请在香港联合交易所有限公司上市。截至本公告披露日，公司正与相关中介机构就本次H股发行上市的具体工作进行商讨，相关细节尚未确定。本次H股发行上市不会导致公司控股股东和实际控制人发生变化。", "ctime": 1784519069, "time_str": "11:44:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260720/c678284673.shtml"}, {"id": "4756265", // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

  tbody.innerHTML = PICKS.map(p => {

    const miniBar = dims.map(d => {

      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
