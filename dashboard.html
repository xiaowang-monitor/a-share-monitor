.score-bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s; }

.down { color: var(--green); }

url": "https://news.10jqka.com.cn/20260710/c678091161.shtml"}, {"id": "4693567", "title": "广西贵港市大将国际学校6000名受困学生已安全转运", "content": "连日来，受持续强降雨影响，广西贵港境内多条江河水位持续上涨。8日，内涝导致城市西部教育园区周边多所学校的上万名师生被困，多方救援力量在教育园区集结，有序转移被困人员。截至目前，广西贵港市大将国际学校6000名受困学生已全部安全转运。（央视新闻）", "ctime": 1783659020, "time_str": "12:50:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260710/c678091149.shtml"}, {"id": "4693555", "title": "应急管理部对浙江福建启动国家地质灾害三级应急响应", "content": "记者从应急管理部获悉，根据《国家突发地质灾害应急预案》及有关规定，应急管理部于7月10日针对浙江、福建启动地质灾害三级应急响应，派出工作组指导地质灾害防范应对工作。据气象部门预测，受今年第9号台风“巴威”影响，7月10日至13日，浙江南部、福建东北部等地有大到暴雨，局地大暴雨至特大暴雨。经应急管理部与自然资源部联合会商研判，浙江东南部、福建东北部发生地质灾害的风险高。应急管理部要求，受台风“巴威”影响的相关地区要切实做好地质灾害防范应对工作，压实地方防范应对主体责任，加强部门协同联动工作机制，密切监视雨情汛情和地质灾害灾情险情，加强会商研判和预警响应联动，预置前置救援力量、物资、装备，强化巡查排查和监测预警，坚决果断组织转移避险，确保应转尽转、应转早转，最大限度避免人员伤亡。（新华社）", "ctime": 1783658746, "time_str": "12:45:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260710/c678091119.shtml"}, {"id": "4693553", "title": "OpenAI推出GPT-5.6系列模型", "content": "美国开放人工智能研究中心（OpenAI）9日宣布，正式推出GPT-5.6系列模型，从即日起在ChatGPT、Codex和OpenAI API中逐步开放使用。该公司在官网发布的声明中说，GPT-5.6系列包括三个模型版本：旗舰模型Sol、适配日常办公的均衡型模型Terra，以及速度最快、成本最低的模型Luna。根据声明，GPT-5.6新增“max”和“ultra”等能力设置。前者可让模型投入更多时间进行推理，探索替代方案，检查并修正方法；后者则默认协调四个智能体并行处理复杂任务，以更高的词元使用量换取更强结果并缩短高难度任务的完成时间。（新华社）", "ctime": 1783658732, "time_str": "12:45:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260710/c678091090.shtml"}, {"id": "4693549", "title": "美机构说厄尔尼诺现象将持续增强并可能延续至明年", "content": "美国国家海洋和大气管理局下属的国家气象局气候预测中心9日发布分析报告说，厄尔尼诺现象将持续增强至今年年底并有极大概率持续至2027年初春。报告说，过去一个月，赤道太平洋中部和东部海表温度持续升高，海洋和大气耦合特征表明厄尔尼诺现象正在增强。最新的每周尼诺3.4区海表温度指数为正1.2摄氏度，表明该区域海表温度较常年同期偏高1.2摄氏度。报告说，厄尔尼诺现象预计将在今年下半年继续增强，并有97%的概率持续至2027年初春。今年10月至12月出现强厄尔尼诺事件的概率为81%，其强度可能跻身1950年以来最强厄尔尼诺事件之列。（央视新闻）", "ctime": 1783658603, "time_str": "12:43:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260710/c678091066.shtml"}, {"id": "4693541", "title": "马来西亚棕榈油局MPOB：马来西亚6月棕榈油出口为1204013吨 环比增长6.19%", "content": "据马来西亚棕榈油局MPOB，马来西亚6月棕榈油出口为1204013吨，环比增长6.19%；6月棕榈油进口为103113吨，环比增长135.33%；6月棕榈油产量为1638777吨，环比增长8.08%；6月棕榈油库存量为2544066吨，环比增长4.78%。", "ctime": 1783658163, "time_str": "12:36:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260710/c678091014.shtml"}, {"id": "4693513", "title": "“全球南方人工智能能力建设”边会关注弥合智能鸿沟", "content": "在日内瓦举行的2026年信息社会世界峰会论坛期间，中国科协联合国咨商信息与通信技术专委会举办“弥合智能鸿沟：面向全球南方的人工智能能力建设与知识共享”边会。与会嘉宾围绕全球南方人工智能能力建设的机遇与挑战、人工智能赋能全球南方的实践路径、适配全球南方的包容性人工智能治理体系与数据生态建设、中国与非洲人工智能务实合作的深化举措等话题展开深入交流。（新华社）", "ctime": 1783657568, "time_str": "12:26:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260710/c678090903.shtml"}, {"id": "4693511", "title": "长征十号乙运载火箭成功实现一子级可控回收", "content": "刚刚，长征十号乙运载火箭在海南商业航天发射场发射升空，火箭一二级分离约6分钟后，一子级垂直返回，在海上回收平台成功回收。这是我国首次成功实施运载火箭一子级可控回收，同时也是全球首次运载火箭网系回收。（央视新闻）", "ctime": 1783657524, "time_str": "12:25:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260710/c678090899.shtml"}, {"id": "4693501", "title": "卫星通信工作组在京正式成立", "content": "中国信通院今日宣布，近日，在工业和信息化部信息通信管理局指导下，工业互联网产业联盟卫星通信工作组在北京正式成立。卫星通信工作组由中国信息通信研究院作为牵头发起单位，联合中国卫星网络集团有限公司、中国时空信息集团有限公司、上海垣信卫星科技有限公司、中国卫通集团股份有限公司、中国空间技术研究院、北京国电高科科技有限公司、浙江时空道宇科技有限公司、中国电信集团有限公司、中国移动通信集团有限公司、中国联合网络通信集团有限公司等60余家单位共同成立，广泛汇聚卫星企业、电信运营商、设备商、终端企业、金融机构、科研机构等产业各方力量。（科创板日报）", "ctime": 1783656994, "time_str": "12:16:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260710/c678090794.shtml"}, {"id": "4693495", "title": "消息称台积电CoWoS 2027年月产能目标至少20万片", "content": "先进封装产能持续供不应求，台积电加速扩产。供应链指出，台积电所有新厂工程几乎都是24小时轮班施工，加速建设进度。设备厂商表示，据台积电释放出的信息来看，CoWoS月产能2024年约3万多片，2025年达7万片，2026年底原订11万片，但最终突破13万片，2027年扩产目标约20万片，但应为低标。市场乐观看待2027年底CoWoS月产能有望拉升至24万~26万片。不过，台积电至今仍未确立设备商的订单分配，导致供应链如坐针毡，担心形成降价抢单氛围，此外设备下单至生产出货时程至少7~9个月，供应商担心无法如期交付设备。 (科创板日报)", "ctime": 1783656891, "time_str": "12:14:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260710/c678090781.shtml"}, {"id": "4693493", "title": "韩国股市触发程序化买入暂停机制，KOSDAQ150期货涨幅超6%", "content": "韩国交易所（KRX）7月10日表示，由于KOSDAQ150期货和KOSDAQ150指数价格上涨，韩国KOSDAQ市场触发程序化买入暂停机制。根据公告，程序化交易买入报价在KOSDAQ市场暂停5分钟。公告显示，KOSDAQ150期货当前价格为1487.4点，前一交易日收盘价为1402.6点，涨幅为84.8点，涨幅比例为6.04%；KOSDAQ150指数当前价格为1476.37点，前一交易日收盘价为1386.92点，涨幅为89.45点，涨幅比例为6.44%。", "ctime": 1783656820, "time_str": "12:13:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260710/c678090774.shtml"}, {"id": "4693491", "title": "宇树科技王兴兴：机器人最终会走向普通消费者", "content": "宇树科技创始人王兴兴7月10日在2026王府井论坛上表示，当前人工智能正在以前所未有的速度走进产业，走进城市，并走进每一个普通人的生活。人工智能已经不再只是实验室的技术概念，而是正在成为推动经济发展、产业升级、消费变革的重要力量。“机器人最终一定会走向更广阔的市场，走向普通消费者，走向真实的生活。因此我们很早就开始探索面向普通大众用户的产品和渠道建设。一个新技术真正进入消费市场，不能只靠技术参数打动人，而是让消费者清楚地感受到它和自己生活之间的关系。”王兴兴说。（中证金牛座）", "ctime": 1783656747, "time_str": "12:12:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260710/c678090765.shtml"}, {"id": "4693485", "title": "内蒙古二连浩特铁路口岸运量已超1000万吨", "content": "记者从铁路部门获悉，今年以来，内蒙古二连浩特铁路口岸运量稳定增长，截至7月9日，年内进出口运量达1002.89万吨，较去年提前17天实现1000万吨，同比增长9.5％。其中进口货物运量834.82万吨，同比增长7.0％；出口货物运量168.07万吨，同比增长23.8％。今年以来，铁路部门持续优化运输组织，协调蒙方改善宽轨入境车流结构，扩大中蒙间敞顶箱使用范围，并深化与边检、海关协作、加强数据互通，有效提升了口岸通关和运输效率。（央视新闻）", "ctime": 1783656624, "time_str": "12:10:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260710/c678090748.shtml"}, {"id": "4693483", "title": "记者徒步进入广西镇龙乡受灾现场 当地断水断网断电", "content": "7月4日以来，广西南宁市出现了大范围持续性强降雨。受此影响，广西横州六蓝水库上游的镇龙乡河水水位暴涨，道路损毁，房屋倒塌。昨天（9日），随着道路逐步抢通，总台记者随同救援人员徒步进入镇龙乡受灾现场。记者在徒步前进时发现多处山体滑坡，桥梁损毁，大型机械难以从外部进入，救援物资只能通过人员徒步搬运或空中吊运。（央视新闻）", "ctime": 1783656620, "time_str": "12:10:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260710/c678090747.shtml"}, {"id": "4693477", "title": "港股午评：恒生指数涨1.86%，恒生科技指数涨2.69%", "content": "港股午间收盘，恒生指数涨1.86%，恒生科技指数涨2.69%。恒指港股通ETF银华（159318）涨1.68%，港股通科技ETF鹏华（159751）涨2.14%。板块方面，生命科学工具、客运航空公司板块涨幅靠前；能源设备与服务板块跌幅靠前。个股方面，珞石机器人涨23.46%，昭衍新药涨14.32%，康龙化成涨13.85%，百奥赛图-B涨11.28%，映恩生物-B涨11.26%；天数智芯跌13.91%，MINIMAX-W跌12.31%，智谱跌11.81%，迅策跌9.38%，怡俊集团控股跌7.29%。", "ctime": 1783656417, "time_str": "12:06:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260710/c678090630.shtml"}, {"id": "4693475", "title": "7月10日午间公告一览：石四药集团95个品种产品纳入国家基本药物目录", "content": "石四药集团公告，集团共95个品种（141个品规）产品已被纳入中国《国家基本药物目录(2026年版)》，包括新增的32个品种（37个品规）。该目录将于二零二六年九月一日起实行，预期对集团的增长及业务发展带来正面影响。", "ctime": 1783656340, "time_str": "12:05:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260710/c678090620.shtml"}, {"id": "4693451", "title": "韩国KOSPI指数涨幅扩大至5%", "content": "韩国KOSPI指数涨幅扩大至5%。三星电子涨逾6%，SK海力士涨2.6%。", "ctime": 1783656179, "time_str": "12:02:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260710/c678090584.shtml"}, {"id": "4693425", "title": "国家能源局：大力推动新能源重卡规模化应用 推动近海和内河船舶运输燃料液化天然气（LNG）、绿色氢氨醇和生物柴油规模化替代", "content": "国家能源局印发《能源领域节能降碳行动计划（2026—2028年）》。其中提到，推动交通用能清洁化。支持交通与能源设施一体化规划、开发，充分利用铁路、公路、枢纽场站及沿线周边等空间，开发利用风电、光伏等可再生能源。加强规划布局，大力推动新能源重卡规模化应用，推动近海和内河船舶运输燃料液化天然气（LNG）、绿色氢氨醇和生物柴油规模化替代。推进港口、船舶岸电改造和使用，推动机场飞机辅助动力系统替代设施改造和使用。建设快充为主、慢充为辅、大功率充电为有益补充的城市公共充电网络，加强高速公路沿线大功率充电设施、电动重卡充换电设施建设，率先对重大节假日期间利用率超过40%的充电设施实施大功率改造。进一步下沉建设农村地区充电网络。（财联社）", "ctime": 1783655937, "time_str": "11:58:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260710/c678090522.shtml"}, {"id": "4693419", "title": "国家能源局：支持算力设施提升绿电消费占比 深入挖掘算力负荷时空可调节潜力", "content": "国家能源局印发《能源领域节能降碳行动计划（2026—2028年）》。其中提到，促进绿色电力与新兴产业协同发展。推动新能源基地与算力设施协同规划、建设。支持算力设施提升绿电消费占比，深入挖掘算力负荷时空可调节潜力，促进算电协同运行。推动采用高效冷却、高性能供电、先进余热资源回收利用等节能技术装备，提升算力设施能效水平。布局建设一批自用消纳的新能源基地、流域水风光一体化基地，推动电力和先进制造业等产业协同布局。（财联社）", "ctime": 1783655790, "time_str": "11:56:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260710/c678090493.shtml"}, {"id": "4693417", "title": "国家能源局：稳妥有序关停一批具备条件的30万千瓦级及以下煤电机组 推动实施一批60万千瓦级煤电机组超（超）临界跨代升级改造", "content": "国家能源局印发《能源领域节能降碳行动计划（2026—2028年）》。其中提到，大力推动火电节能降碳。稳妥有序关停一批具备条件的30万千瓦级及以下煤电机组，鼓励按新一代煤电要求建设替代机组；推动实施一批60万千瓦级煤电机组超（超）临界跨代升级改造。支持对具备条件的机组实施零碳低碳燃料掺烧和碳捕集利用与封存（CCUS）改造建设，改造建设后度电碳排放水平应降低10%左右。实施一批煤电、气电与新能源融合项目，支持煤电与新能源通过储热储能耦合调峰及顶峰、一体化汇集送出等方式，达到融合降碳效果。（财联社）", "ctime": 1783655701, "time_str": "11:55:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260710/c678090482.shtml"}, {"id": "4693415", "title": "新宙邦持股公司成立科技公司，含电子专用材料研发业务", "content": "企查查APP显示，近日，淮安新原邦科技有限公司成立，法定代表人为易欢，注册资本为3000万元，经营范围包含：电子专用材料制造；电子专用材料研发；电子专用材料销售；合成材料销售；新材料技术研发等。企查查股权穿透显示，该公司由新宙邦持股的深圳新源邦科技有限公司全资持股。（人民财讯）", "ctime": 1783655575, "time_str": "11:52:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260710/c678090460.shtml"}, {"id": "4693413", "title": "北京已有7区发布暴雨红色预警", "content": "北京市门头沟区7月10日10:35发布暴雨红色预警：预计7月10日14时至12日08时，门头沟区有大暴雨。部分地区6小时累计雨量可达150毫米以上，24小时累计雨量可达200毫米以上，山区出现中小河流洪水、泥石流、滑坡等灾害的气象风险高，低洼地区易出现积水，请注意防范。截至目前，包括门头沟、密云、怀柔、顺义、平谷、房山、丰台在内，北京已有7个区发布暴雨红色预警。（央视新闻）", "ctime": 1783655487, "time_str": "11:51:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260710/c678090441.shtml"}, {"id": "4693397", "title": "天津启动洪涝灾害防御二级响应", "content": "记者从天津市水务局获悉，根据气象预报，7月10日至11日，受台风“巴威”远距离水汽输送和副热带高压相互作用影响，天津及海河流域有大范围强降雨过程，部分地区有暴雨到大暴雨；12日夜间至14日，台风“巴威”外围云系将给天津带来强风雨天气。天津市水务部门启动洪涝灾害防御二级应急响应，重点从加强水情监测联合会商、最大限度预腾调蓄空间、做好堤防巡查防守热备、强化局域性洪涝灾害防范四方面，全力做好台风迎战准备。（央视新闻）", "ctime": 1783654793, "time_str": "11:39:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260710/c678090283.shtml"}, {"id": "4693381", "title": "A股午评：沪指半日涨0.76%，创新药、医疗服务板块集体爆发", "content": "A股三大指数早盘涨跌不一，截至午盘，上证指数涨0.76%，深证成指涨0.61%，创业板指跌0.65%，北证50涨1.27%，科创50指数跌0.41%。全市场成交额21822亿元，较上日放量4737亿元，全市场超4400只个股上涨。板块题材上，创新药、AI视频、白酒、房地产、猪肉、贵金属、零售、游戏、汽车整车板块涨幅居前；电子化学品、证券、培育钻石、半导体、能源金属、铜箔、元件板块表现落后。盘面上，创新药、医疗板块早盘爆发，常山药业、昭衍新药、众生药业、立方制药、双鹭药业等股涨停，此前报道称国家基本药物目录时隔8年再次调整，创新药首次纳入。AI视频板块表现出色，福石控股20cm涨停，天娱数科、超讯科技同样封板。房地产、白酒等传统经济板块早盘上扬，盈新发展、华发股份等股涨停，古井贡酒、山西汾酒纷纷上扬。此外，猪肉、贵金属、汽车整车等板块表现活跃。另一方面，锂矿板块继续下跌，融捷股份盘中一度跌停，盛新锂能、天齐锂业、赣锋锂业跟跌。电子气体、氟化工板块同样表现不佳，中船特气、中巨芯盘中大跌超10%。", "ctime": 1783654300, "time_str": "11:31:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260710/c678089937.shtml"}, {"id": "4693379", "title": "ETF午评：疫苗ETF领涨6.08%，科创创业ETF领跌2.46%", "content": "ETF午间收盘涨跌不一，疫苗ETF（159643）领涨6.08%，科创创新药ETF（589120）涨5.58%，创业板医药ETF（159377）涨5.57%，科创创业ETF（159603）领跌2.46%，科创芯片ETF（589160）跌2.45%，消费电子ETF（159779）跌1.91%。", "ctime": 1783654265, "time_str": "11:31:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260710/c678089915.shtml"}, {"id": "4693377", "title": "股指期货早盘收盘 主力合约全线上涨", "content": "股指期货早盘收盘，主力合约全线上涨。沪深300股指期货(IF)主力合约涨0.61%，上证50股指期货(IH)主力合约涨1.20%，中证500股指期货(IC)主力合约涨1.18%，中证1000股指期货(IM)主力合约涨1.41%。", "ctime": 1783654234, "time_str": "11:30:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260710/c678089904.shtml"}, {"id": "4693367", "title": "联合国可持续发展高级别政治论坛边会聚焦绿色智慧交通", "content": "2026年联合国可持续发展高级别政治论坛可持续交通主题边会8日在纽约联合国总部举行。会议聚焦可复制的绿色智慧交通方案，推动落实“联合国可持续交通十年”各项优先行动。本次活动由中国和土库曼斯坦常驻联合国代表团、联合国经济和社会事务部（联合国经社部）及中国国际可持续交通创新与知识中心（国际中心）联合主办。有关国家、国际组织、多边金融机构、企业及智库等相关方代表参会。（央视新闻）", "ctime": 1783654071, "time_str": "11:27:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260710/c678089821.shtml"}, {"id": "4693363", "title": "三星堆最新研究成果！顶尊跪坐人像是“混搭”组装", "content": "四川省文物考古研究院发布最新研究成果，揭秘三星堆遗址三号祭祀坑出土铜顶尊跪坐人像的新发现。科研团队通过金相分析、合金成分检测、铅同位素对比等手段，系统还原了这件器物的合金配比、材料来源与制作工艺，为认识古蜀与中原、长江流域青铜文化的交流互动提供了新的实物证据。专家表示，这件器物印证了三星堆青铜体系“内外共生”的特征，礼器形制源自商文化与长江中游文明，人像、神树等造型为古蜀独创，充分体现中华文明多元一体、兼容互鉴的发展脉络。（央视新闻）", "ctime": 1783653978, "time_str": "11:26:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260710/c678089773.shtml"}, {"id": "4693329", "title": "福建已成立晋江鞋厂火灾事故调查组", "content": "7月9日12时许，福建泉州晋江市一鞋厂发生火灾，造成28人死亡。今天，当地召开新闻发布会，介绍相关情况。会上介绍，福建省政府已成立事故调查组，将尽快查明事故原因并严肃追责，已对涉事企业负责人和相关责任人采取控制措施。（央视新闻）", "ctime": 1783653261, "time_str": "11:14:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260710/c678089524.shtml"}, {"id": "4693319", "title": "上合组织给予老挝对话伙伴地位备忘录签署仪式举行", "content": "7月10日，关于给予老挝人民民主共和国上海合作组织对话伙伴地位的备忘录签署仪式在上合组织秘书处举行。2025年9月1日，在天津举行的上合组织成员国元首理事会第二十五次会议一致同意接收老挝为对话伙伴。（新华社）", "ctime": 1783653041, "time_str": "11:10:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260710/c678089471.shtml"}, {"id": "4693315", "title": "中国电信入股戴盟机器人，后者致力于触觉灵巧手等产品研发", "content": "企查查APP显示，近日，戴盟（深圳）机器人科技有限公司发生工商变更，新增中国电信集团投资有限公司等为股东，同时注册资本增至191.74万元。企查查信息显示，该公司成立于2021年，经营范围包含：智能机器人的研发；智能 // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
