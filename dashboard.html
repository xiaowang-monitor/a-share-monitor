505/c676454253.shtml"}, {"id": "4317765", "title": "红旗连锁：商投投资受让22.09%公司股份", "content": "红旗连锁公告，公司于2026年4月30日收到四川商投投资有限责任公司通知，曹世如、曹曾俊与商投投资协议转让股份事宜已完成过户登记手续，并取得《证券过户登记确认书》。商投投资权益变动前持股数量为2.3亿股，持股比例为16.91%，表决权比例为21.32%；权益变动后持股数量为3亿股，持股比例为22.09%，表决权比例为22.09%。", "ctime": 1777966386, "time_str": "15:33:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260505/c676454230.shtml"}, {"id": "4317759", "title": "齐心集团：控股股东齐心控股拟增持金额不低于6750万元", "content": "齐心集团公告，控股股东深圳市齐心控股有限公司拟自2026年5月7日起6个月内，通过深圳证券交易所集中竞价方式增持公司股份，增持金额不低于6750万元且不超过1.35亿元，增持股份总数不超过公司总股本的2.00%。资金来源为自有资金及股份增持专项贷款，其中专项贷款占比不超过90%，中国工商银行股份有限公司深圳市分行已出具《贷款承诺函》，承诺贷款金额不超过1.2亿元，期限不超过三年。", "ctime": 1777966368, "time_str": "15:32:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260505/c676454229.shtml"}, {"id": "4317757", "title": "万邦德：若公司下一个年度的财务报告内部控制仍被出具无法表示意见或者否定意见的审计报告，公司股票将会被实施退市风险警示", "content": "万邦德公告，因公司2025年度审计机构北京德皓对公司2025年度内部控制出具了否定意见的内部控制审计报告。根据《深圳证券交易所股票上市规则》第9.4.1条第（六）项的规定，若公司下一个年度的财务报告内部控制被出具无法表示意见或者否定意见的审计报告，公司股票将会被实施退市风险警示。", "ctime": 1777966363, "time_str": "15:32:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260505/c676454228.shtml"}, {"id": "4317755", "title": "伊朗外长喊话美方：别被“不怀好意者”再次拖入泥潭", "content": "伊朗外交部长阿拉格齐5日凌晨在社交媒体发文说，当对话在巴基斯坦推动下正在取得进展时，美国应保持警醒，避免再次被“不怀好意者”拖入冲突泥潭，阿联酋也应如此。阿拉格齐表示，当前霍尔木兹海峡局势表明，政治危机无法通过军事手段解决。美方在霍尔木兹海峡推进的所谓“自由计划”将变成“僵局计划”。美国总统特朗普3日在社交媒体发文称，美国将于中东当地时间4日上午在霍尔木兹海峡开始疏导行动，“引导”被困船只驶离海峡。特朗普将这项名为“自由计划”的疏导行动定位为“人道主义行动”。美军4日表示，作为疏导行动第一步，两艘悬挂美国国旗的商船已成功通过霍尔木兹海峡，美军击沉6艘试图阻挠商船航行的伊朗小型船只。(新华社)", "ctime": 1777966358, "time_str": "15:32:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260505/c676454227.shtml"}, {"id": "4317753", "title": "白云机场口岸广交会出入境外国人数超54万人次 创新高", "content": "五一假期最后一天，恰逢第139届广交会闭幕，记者从白云边检站了解到，本届广交会以来，截至5月5日0时，白云机场口岸共保障出入境人员超114万人次，同比增长14.5%。外籍商贸客商成为口岸客流增长核心主力，口岸出入境外国人超54万人次，同比增长20.8%，刷新广交会同期口岸客流历史纪录。（央视新闻）", "ctime": 1777966320, "time_str": "15:32:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260505/c676454225.shtml"}, {"id": "4317707", "title": "西班牙3月原油进口量同比下降13.8%至460万吨", "content": "西班牙3月原油进口量同比下降13.8%至460万吨。（财联社）", "ctime": 1777965672, "time_str": "15:21:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260505/c676454195.shtml"}, {"id": "4317703", "title": "现货白银日内涨1%", "content": "现货白银日内涨1%，现报73.41美元/盎司。", "ctime": 1777965551, "time_str": "15:19:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260505/c676454188.shtml"}, {"id": "4317681", "title": "哈萨克斯坦一工厂发生爆炸 致9人受伤", "content": "哈萨克斯坦紧急救援部门5日说，乌斯季卡缅诺戈尔斯克市一处工厂当天上午发生爆炸事故，造成9人受伤。据悉，事故发生在锌业股份公司的一处工厂，工厂内除尘设备发生爆炸，引发火灾并造成工厂部分建筑坍塌。目前，火已被完全扑灭，救援人员仍在继续搜寻受困人员。（央视新闻）", "ctime": 1777964845, "time_str": "15:07:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260505/c676454139.shtml"}, {"id": "4317671", "title": "欧洲主要股指开盘涨跌互现", "content": "欧洲主要股指开盘涨跌互现，欧洲斯托克50指数涨0.15%，英国富时100指数跌0.62%，法国CAC40指数跌0.19%，德国DAX指数持平。", "ctime": 1777964684, "time_str": "15:04:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260505/c676454117.shtml"}, {"id": "4317655", "title": "欧盟官员：能源价格飙升推高欧盟通胀", "content": "欧盟委员会负责经济事务的委员东布罗夫斯基斯表示，由于中东战事，能源价格飙升，上周石油价格突破每桶125美元。他指出，能源价格上涨影响欧洲经济中的每一个参与者，包括企业和家庭，这一现状正将欧盟经济推向增长放缓和通胀加剧的道路。此外，德国央行行长纳格尔4日表示，美国和以色列针对伊朗的打击导致严重经济后果，全球能源市场动荡正在冲击供应链和价值链，能源密集型产品价格走高、供应趋紧。欧洲央行管理委员会将于6月召开下一次货币政策会议，届时将发布新的预测数据，如果这些数据显示通胀前景没有显著改善，则可能支持加息。（央视新闻）", "ctime": 1777964457, "time_str": "15:00:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260505/c676454104.shtml"}, {"id": "4317601", "title": "伊朗议长：美国违反停火协议　危及航运安全", "content": "伊朗伊斯兰议会议长卡利巴夫5日在社交媒体上发文说，美国及其盟友违反停火协议并实施封锁，危及航运和能源运输安全。\n\n他在社交媒体上写道，“霍尔木兹海峡的新格局正在逐步形成”。对美国而言，维持现状是“不可持续的”。(新华社)", "ctime": 1777963474, "time_str": "14:44:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260505/c676454033.shtml"}, {"id": "4317585", "title": "哈萨克斯坦暂无计划退出OPEC+", "content": "据哈萨克斯坦能源部消息，哈萨克斯坦暂无计划退出OPEC+。(财联社)", "ctime": 1777963109, "time_str": "14:38:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260505/c676454017.shtml"}, {"id": "4317583", "title": "中国（陕西）-美国经贸对接会在纽约举办", "content": "由陕西省贸促会、新泽西贸易投资促进会联合主办的中国（陕西）-美国经贸对接会4日在美国纽约成功举办。对接会针对绿色健康、双向赋能核心主题，聚焦植物提取、大健康产业、绿色食品等领域，设置行业专题推介、产业产品交流对接、一对一商务洽谈、企业成果展览展示等多项务实环节。美国天然品联盟亚洲总裁丹尼尔·梅比说：“这是一次非常富有成效的会议，此次来访的陕西企业非常契合美方需要，是我们一直寻找的生产商。”他表示将于6月率团参加第四届中国国际供应链促进博览会（链博会）并回访陕西，进一步巩固合作成果。（新华社）", "ctime": 1777963075, "time_str": "14:37:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260505/c676454016.shtml"}, {"id": "4317577", "title": "伊高级指挥官说美无法扭转当前局面", "content": "伊朗伊斯兰革命卫队高级指挥官亚杜拉•贾瓦尼5月4日在伊朗国家电视台采访中确认，伊朗正在控制霍尔木兹海峡，任何通行船只须获伊朗许可才能保障安全，敌对势力舰船强行穿行将被坚决处置。他驳斥美国总统特朗普称出于人道主义“疏导”海峡航道的说法是谎言，称若对峙升级伊朗必将获胜。他说，美国绝无可能让局势重回2月28日之前，也无法扭转当前局面。（CCTV国际时讯）", "ctime": 1777963016, "time_str": "14:36:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260505/c676454014.shtml"}, {"id": "4317575", "title": "韩方称正在讨论是否参与美方霍尔木兹海峡行动", "content": "当地时间5日下午，针对美国总统特朗普要求韩国参与霍尔木兹海峡行动的表态，韩国总统府表示，正在从国内法律角度等出发，对其进行讨论。当地时间4日晚，据韩国外交部消息，韩国当地时间4日20时40分左右，一艘停靠在霍尔木兹海峡内由韩国船运公司运营的船只发生爆炸及火灾。事发船只上有6名韩国籍船员以及18名外国籍船员，无人员伤亡报告。美国总统特朗普5月3日宣布启动名为“自由计划”的行动，“引导”被困船只驶离霍尔木兹海峡。特朗普4日在社交媒体发文，称伊朗当天向包括一艘韩国货船在内的船只开火，敦促韩国政府参与美国所谓霍尔木兹海峡被困船只疏导行动。（央视新闻）", "ctime": 1777962963, "time_str": "14:36:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260505/c676454010.shtml"}, {"id": "4317565", "title": "乌称波尔塔瓦州遭袭 已致4死31伤", "content": "当地时间5月5日，乌克兰波尔塔瓦州军事管理局局长维塔利·迪亚基夫尼奇发布通报称，当天凌晨该地区遭到俄方袭击，已造成4人死亡、31人受伤，多处基础设施受损。迪亚基夫尼奇表示，俄方此次袭击使用了导弹和攻击型无人机，造成当地一家工业企业受损、3480户用户燃气供应中断，铁路基础设施也遭到不同程度破坏。俄罗斯国防部5日早间通报称，自当地时间4日20时至5日7时，俄军防空系统在布良斯克州、别尔哥罗德州、沃罗涅日州等多地上空拦截并摧毁了289架乌克兰无人机。俄罗斯莫斯科市长索比亚宁5日通报称，3架飞往莫斯科的无人机被击落。自当日零时起，共有6架无人机在接近莫斯科时被击落。（央视新闻）", "ctime": 1777962816, "time_str": "14:33:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260505/c676453996.shtml"}, {"id": "4317561", "title": "Alphabet 拟发行六期欧元债券", "content": "Alphabet 拟发行六期欧元债券。", "ctime": 1777962696, "time_str": "14:31:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260505/c676453993.shtml"}, {"id": "4317547", "title": "伊朗议长：霍尔木兹海峡的新规则正在确立", "content": "伊朗伊斯兰议会议长卡利巴夫当地时间5日在社交媒体发布消息表示，霍尔木兹海峡的新规则正在确立，由于美国及其盟友违反停火协议并实施封锁，航行安全与能源运输正面临威胁。他写道：“我们深知，维持现状对美国来说已是不可忍受的；而我们甚至还没有真正开始。”（央视新闻）", "ctime": 1777962251, "time_str": "14:24:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260505/c676453968.shtml"}, {"id": "4317541", "title": "浏阳全市所有烟花爆竹生产企业全面停产整顿 同步开展各领域安全生产大排查、大整治", "content": "长沙市政府今天召开新闻发布会，通报浏阳市华盛烟花公司爆炸事故相关情况。事故发生后，浏阳市举一反三，汲取教训，自5月4日19时起，全市所有烟花爆竹生产企业全面停产整顿，同步开展各领域安全生产大排查、大整治，堵塞监管漏洞，压实企业主体责任，全力提升本质安全水平。 (湖南日报)", "ctime": 1777961855, "time_str": "14:17:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260505/c676453939.shtml"}, {"id": "4317389", "title": "国际能源署：2025年甲烷排放仍居高位　减排可促进能源安全", "content": "国际能源署4日发布的《2026年全球甲烷追踪》报告显示，2025年全球化石燃料相关的甲烷排放仍处于“极高”水平，且在全球范围内尚无下降迹象。在当前能源危机背景下，治理甲烷排放可以带来重大能源安全利益。\n\n报告说，为了应对全球变暖并改善空气质量，近年来许多国家和企业提出甲烷减排目标。然而，2025年能源行业甲烷排放接近历史最高水平，显示了减排承诺与实施之间存在明显差距。报告指出，减少甲烷排放还有助于提升能源安全。霍尔木兹海峡航运受阻后，全球液化天然气供应减少约20%，能源安全已成为各国重要关切。(新华社)", "ctime": 1777960617, "time_str": "13:56:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260505/c676453874.shtml"}, {"id": "4317385", "title": "伊朗南部迪尔港多艘驳船起火", "content": "据伊朗迈赫尔通讯社5日报道，停泊在伊朗南部迪尔港一码头的多艘驳船起火，火情仍在持续，起火原因尚不明确。\n\n报道援引当地消防部门负责人的话说，两艘玻璃钢商业驳船先起火，其中一艘船火势基本被扑灭。与这两艘船相邻的两艘木制驳船因火势猛烈被引燃，灭火仍在进行。\n\n报道称，在彻底完成灭火前无法确定事故原因，后续将公布更多信息。(新华社)", "ctime": 1777960360, "time_str": "13:52:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260505/c676453863.shtml"}, {"id": "4317381", "title": "白宫附近发生交火　万斯车队刚驶过事发区域", "content": "美国特勤局特工4日在白宫附近与一名枪手发生交火，事发前，副总统万斯的车队刚驶过交火区域。目前暂不清楚枪手是否针对总统特朗普或万斯。(新华社)", "ctime": 1777960239, "time_str": "13:50:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260505/c676453857.shtml"}, {"id": "4317361", "title": "浏阳烟花厂爆炸事故发布会：已基本完成现场搜救", "content": "今天（5月5日），湖南长沙召开新闻发布会，介绍浏阳烟花厂爆炸事故最新救援进展。相关负责人介绍，已调动消防、应急、公安、卫健等部门1500余人，有序开展应急救援、现场处置、医疗救治等相关工作。目前，已基本完成现场搜救；依法对涉事企业负责人采取控制措施；实时监测空气和水体，相关环境指标正常。（央视新闻）", "ctime": 1777959730, "time_str": "13:42:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260505/c676453832.shtml"}, {"id": "4317359", "title": "哥伦比亚总统：参与他国冲突的雇佣兵违法", "content": "哥伦比亚总统佩特罗4日在社交媒体上表示，目前约有7000名接受过军事训练的哥伦比亚人正在一场不属于他们的冲突中作战，甚至毫无意义地死在乌克兰。佩特罗说：“我们不想输出死亡，雇佣兵是法律所禁止的。”有消息称，在乌克兰前线作战的哥伦比亚士兵有约7000人，人数超过其他任何外国籍士兵。（央视新闻）", "ctime": 1777959631, "time_str": "13:40:31", "stock_code": "", "stock_name": "", "stoc // 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
