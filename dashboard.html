行云控股有限责任公司近日与VB客户签署《算力服务协议》，深圳行云向其提供算力服务，服务期限5年，含税总金额10.14亿元。该合同已获公司第七届董事会第二十次会议审议通过，无需股东会审议，不涉及关联交易，亦不构成重大资产重组。合同若能顺利履行，预计将对公司经营成果产生一定影响。", "ctime": 1781609287, "time_str": "19:28:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260616/c677509036.shtml"}, {"id": "4537623", "title": "一博科技：公司光模块PCBA业务已进入量产阶段", "content": "一博科技投资者关系活动记录表公告，公司跟光模块客户有广泛的业务合作，从前端的PCB设计逐渐切入到后端的PCB制板、PCBA生产制造。目前合作比较多的是PCBA生产。公司珠海PCBA工厂建设有数条专门的生产线，主要为国内某光模块头部企业提供PCBA生产服务。目前，公司光模块PCBA业务已进入了量产阶段，光模块PCB生产目前以研发样品为主，预计到年底具备一定的量产能力。整体来看，光模块业务目前占公司整体营收的比例还不大，对总体业绩影响尚小，公司的未来的业务发展空间较大。", "ctime": 1781609214, "time_str": "19:26:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260616/c677509014.shtml"}, {"id": "4537619", "title": "国家地方共建人形机器人创新中心将在年内推出2.0版本具身智能机器人实训场", "content": "国家地方共建人形机器人创新中心首席科学家江磊透露，年内将联合几大头部企业，共同推出2.0版本的具身智能机器人实训场。去年1月，全国首个异构人形机器人训练场在国地中心（上海）启用，截至目前全国已建成7个互联互通的实训基地。当天，国地中心机器人全生命周期示范应用区发布。江磊表示，下半年，上海张江机器人谷将开放超1万平方米的实体示范场地，集中承载机器人数据采集、产品中试、检测检验、机器人“一机一码”全流程管控等功能。再进一步展望，整个上海张江机器人谷、张江AI创新小镇乃至浦东新区有望纳入示范应用区，打破园区边界限制，实现机器人同步落地数字虚拟空间与实体物理场景。", "ctime": 1781609189, "time_str": "19:26:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260616/c677509012.shtml"}, {"id": "4537591", "title": "科达利：拟在泰国设子公司投建谐波减速机基地，投资不超3.5亿元", "content": "科达利公告，公司拟与台湾盟立、台湾盟英共同投资在泰国设立泰国科盟创新机器人科技有限公司并投资建设谐波减速机生产基地。该项目计划投资金额不超过3.5亿元，其中，公司出资比例51%，台湾盟立出资比例39%，台湾盟英出资比例10%。", "ctime": 1781609015, "time_str": "19:23:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260616/c677508969.shtml"}, {"id": "4537573", "title": "*ST航图：公司股票自6月17日起将被叠加实施其他风险警示", "content": "*ST航图公告，由于公司资金紧张，无法按期偿还债权人债务本息，导致公司主要银行账户被冻结。截至本公告披露日，累计冻结金额1.35亿元，占公司最近一期经审计货币资金的108.93%。根据相关规定，公司股票自2026年6月17日起将被上海证券交易所叠加实施其他风险警示。同时，因公司2025年度经审计的期末净资产出现负值，以及审计机构对公司2025年度财务会计报告出具无法表示意见的审计报告，公司股票已于2026年5月6日被实施退市风险警示。", "ctime": 1781608818, "time_str": "19:20:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260616/c677508911.shtml"}, {"id": "4537569", "title": "智能眼镜线上卖爆了 空气循环扇订单量暴涨近350%", "content": "今年以来，线上消费从衣食类刚需转向高新智能产品，科技大件电商常态化。上半年，智能穿戴、家用机器人、康养智能设备持续热销，科技消费品成为拉动大盘增长主力。基于国补政策和平台直降等优惠的加持，智能家居、家电、数码类产品销售数据亮眼。居住体验更好的同时，还要配备更高效的生活“助手”。商务大数据监测，1-4月，智能眼镜线上零售额同比增长175.2%，智能助行外骨骼等新型智能设备线上销售额暴涨785.5%。随着夏季的到来，“清凉经济”也全面爆发，空气循环扇、制冰机、手机散热器等订单量分别同比增长348%、122%、167%。 (央视财经)", "ctime": 1781608805, "time_str": "19:20:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260616/c677508907.shtml"}, {"id": "4537503", "title": "特朗普称俄罗斯应与乌克兰达成协议", "content": "美国总统特朗普16日称，俄罗斯应该与乌克兰达成协议。当天在法国埃维昂莱班举行的七国集团峰会首场会议聚焦乌克兰危机。特朗普在会后对记者表示，俄乌两国在冲突中伤亡惨重，他将“尽其所能”解决这一冲突。（新华社）", "ctime": 1781608540, "time_str": "19:15:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260616/c677508788.shtml"}, {"id": "4537483", "title": "湖南推出整治烟花爆竹违法违规行为“硬措施”", "content": "记者16日从湖南省应急管理厅获悉，为深刻汲取事故教训，湖南省应急管理厅、省安委办近期专门印发《整治烟花爆竹突出违法违规行为“五项硬措施”》。“五项硬措施”提出，存在相关严重情形或重大事故隐患，依法责令暂时停产停业的，按严重程度，期限从不少于1个月至6个月。存在多股东各自独立进行烟花爆竹生产活动的、从事礼花弹生产的企业将礼花弹销售给未经公安机关批准的燃放活动的等情形的，依法暂扣安全生产许可证6个月。“五项硬措施”还提出，存在相关情形之一的，由县级以上应急管理部门提请属地人民政府依法予以关闭，有关部门应当吊销安全生产许可证。生产经营单位主要负责人五年内不得担任任何生产经营单位的主要负责人；情节严重的，终身不得担任本行业生产经营单位的主要负责人。包括，经停产停业整顿，仍不具备法律、行政法规和国家标准或者行业标准规定的安全生产条件的；不具备法律、行政法规和国家标准或者行业标准规定的安全生产条件，导致发生重大、特别重大生产安全事故的等。湖南省应急管理厅、省安委办要求，强化现场处置，健全“检查—整改—复查”闭环管理机制，坚决杜绝“一罚了之”“以罚代管”现象。（新华社）", "ctime": 1781608415, "time_str": "19:13:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260616/c677508736.shtml"}, {"id": "4537475", "title": "中国民用航空局副局长胡振江会见波音民机集团飞机项目与客户支持高级副总裁兼总经理迈克·弗莱明", "content": "6月16日，中国民用航空局副局长胡振江在京会见波音民机集团飞机项目与客户支持高级副总裁兼总经理迈克·弗莱明，双方就波音在华业务发展、加强波音与中国民航业界合作等共同关心的问题交换意见。（中国民航局）", "ctime": 1781608323, "time_str": "19:12:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260616/c677508710.shtml"}, {"id": "4537473", "title": "金刚光伏：拟与中国信达共同投资设立合伙企业，公司方认缴出资4.86亿元", "content": "金刚光伏公告，公司及全资子公司凤凰高科、全资孙公司金信昊达与鑫盛利保、中国信达甘肃省分公司签署合伙协议，共同投资设立天津陇金信企业管理合伙企业。公司方以持有的苏州金刚和苏州型材100%股权作价8538.28万元以及货币4.01亿元合计认缴4.86亿元，占合伙企业投资总额54.81%；信达方以货币认缴4.01亿元，占45.19%。合伙企业将直接持有上述两家子公司100%股权，仍纳入公司合并报表。合伙企业拟将信达方实缴的4亿元以股东借款方式出借给下属公司，公司控股股东欧昊集团拟为上述借款无偿提供股票质押担保及连带责任保证。", "ctime": 1781608318, "time_str": "19:11:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260616/c677508709.shtml"}, {"id": "4537471", "title": "天宇股份：首次回购0.0150%公司股份，成交总金额为99.85万元", "content": "天宇股份公告，2026年6月16日，公司通过回购专用证券账户以集中竞价交易方式实施了公司股份的首次回购。本次回购股份数量为52100股，占公司总股本的0.0150%，最高成交价为19.25元/股，最低成交价为19.01元/股，成交总金额为99.85万元（不含交易费用）。", "ctime": 1781608284, "time_str": "19:11:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260616/c677508703.shtml"}, {"id": "4537449", "title": "长盈通：5月6日至6月16日累计涨幅249% 明起停牌核查", "content": "长盈通公告，公司股票自2026年5月6日至6月16日期间多次触及异常波动及严重异常波动，累计涨幅达249.36%，远超同期行业及上证指数。公司基本面未发生重大变化，但股价已脱离基本面，存在市场情绪过热和非理性炒作风险。公司滚动市盈率高达1130.56倍，显著高于行业平均的63.38倍。2026年一季度净利润为589.87万元，同比下滑28.72%。公司股票将于6月17日开市起停牌，预计停牌不超过3个交易日，待披露核查公告后复牌。", "ctime": 1781608078, "time_str": "19:07:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260616/c677508469.shtml"}, {"id": "4537441", "title": "中广核格尔木350兆瓦光热示范项目开建", "content": "中国广核集团有限公司通报，中广核格尔木350兆瓦光热示范项目在青海省格尔木市乌图美仁光伏光热园区正式开工。项目采用熔盐塔槽结合技术路线，实现了中广核自主研发的8.6米光热熔盐槽式集热器成套装备及工艺的规模化应用。项目镜场总采光面积达370万平方米，包括3个110万平方米的塔式镜场和1个40万平方米的槽式镜场。其中，槽式镜场全部采用中广核自主研发的8.6米大开口槽式集热器。项目配套15小时大容量熔盐储热装置，储热容量为11747兆瓦时，可实现稳定发电，具备优异的电网灵活调峰能力，能有效提升青海电网新能源消纳效率与全域供电保障能力。项目建成后预计年发电量可达10亿千瓦时，等效节约标煤消耗32万吨、减排二氧化碳86万吨。（新华社）", "ctime": 1781608001, "time_str": "19:06:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260616/c677508415.shtml"}, {"id": "4537421", "title": "广东广西等地暴雨大暴雨持续 18日起主雨带将北抬至江南北部等地", "content": "6月12日以来，华南遭遇猛烈“龙舟水”侵袭，广东、广西等地暴雨如注、雨量惊人。今天夜间到明天，部分地区暴雨、大暴雨还将持续。18日之后天气形势发生变化，主雨带将北抬至江南北部等地，部分站点累计雨量可能接近或突破历史同期极值。（央视新闻）", "ctime": 1781607913, "time_str": "19:05:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260616/c677508386.shtml"}, {"id": "4537415", "title": "中国地震局对青海海西州6.3级地震启动三级应急响应", "content": "记者从中国地震局获悉，中国地震局对青海海西州6.3级地震启动三级应急响应。 据中国地震台网正式测定，2026年6月16日17时6分在青海海西州（北纬37.80度，东经95.56度）发生6.3级地震，震源深度10公里。震中10公里范围内平均海拔约4302米。 地震发生后，中国地震局有关负责人第一时间部署应急处置工作，视频连线中国地震台网中心、青海省地震局，要求有关单位加强震情监视跟踪研判，开展联合会商，及时报告有关情况。 目前，青海省地震局已派出现场工作队赶赴震区，协助地方政府开展应急处置工作。(新华社)", "ctime": 1781607898, "time_str": "19:04:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260616/c677508380.shtml"}, {"id": "4537409", "title": "ST瀚川：暂缓实施“智能换电设备生产建设项目”和“智能电动化汽车部件智能装备生产建设项目”", "content": "ST瀚川公告，公司于2026年6月16日召开董事会，审议通过了《关于对部分募集资金投资项目重新论证并暂缓实施的议案》，决定暂缓实施“智能换电设备生产建设项目”和“智能电动化汽车部件智能装备生产建设项目”。此次暂缓实施是基于对市场变化的审慎考虑，旨在规避行业下行风险，提高资金使用效率。截至2025年12月31日，募集资金使用及结余情况为：募集资金到账总额9.4亿元，累计投入金额6.37亿元，账户余额1239.24万元。", "ctime": 1781607891, "time_str": "19:04:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260616/c677508375.shtml"}, {"id": "4537403", "title": "工大科雅：中国电子系统技术有限公司拟公开征集转让10.54%公司股份", "content": "工大科雅公告，持股5%以上股东中国电子系统技术有限公司拟通过公开征集转让方式协议转让其持有的公司1270.5万股股份，约占公司总股本的10.54%，转让价格不低于22.6元/股。", "ctime": 1781607885, "time_str": "19:04:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260616/c677508371.shtml"}, {"id": "4537401", "title": "东山精密：子公司索尔思光电拟投资12亿美元实施光芯片及光模块扩建项目", "content": "东山精密公告，公司于2026年6月16日召开董事会，审议通过了子公司索尔思光电及其子公司在常州等地实施光芯片及光模块扩建项目，总投资额12亿美元。此举旨在提升索尔思光电整体产能规模，满足行业及下游客户需求。索尔思光电自2025年10月起纳入公司合并报表范围，2025年度并表后收入占公司合并营业收入的3.58%，利润占22.69%；2026年第一季度并表后收入占16.02%，利润占52.92%。", "ctime": 1781607878, "time_str": "19:04:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260616/c677508363.shtml"}, {"id": "4537377", "title": "伊朗副外长：美国已一定程度上解除对伊朗封锁", "content": "伊朗副外长拉万奇16日表示，美国解除对伊朗封锁“已在一定程度上得到落实”。（新华社）", "ctime": 1781607816, "time_str": "19:03:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260616/c677508308.shtml"}, {"id": "4537357", "title": "中广天择：控股股东筹划股份转让事项 公司股票将于6月17日起停牌", "content": "中广天择公告，公司控股股东长沙广播电视集团有限公司正在筹划涉及所持有公司股份转让的相关事宜，该事项可能导致公司控股股东发生变更。公司股票（证券代码：603721，证券简称：中广天择）将于2026年6月17日起停牌，预计停牌时间不超过2个交易日。", "ctime": 1781607756, "time_str": "19:02:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260616/c677508285.shtml"}, {"id": "4537345", "title": "昀冢科技：目前公司MLCC产品暂未应用于车规安全系统、AI算力服务器等", "content": "昀冢科技公告，目前公司MLCC产品，主要应用于智能手机、PC电脑、可穿戴智能设备等消费电子领域，暂未应用于车规安全系统、AI算力服务器等。高容值MLCC产品具有技术壁垒高、研发难度大等特点，下游终端客户准入标准严苛，产品全流程可靠性验证环节繁多，特殊应用领域认证周期跨度较长，存在认证进度不及预期、无法顺利导入批量供应链的风险。公司经营业绩受宏观经济、下游市场发展态势、公司产品竞争力、客户认可程度等多种因素影响，具有一定的不确定性。敬请投资者注意投资风险，理性决策，审慎投资。", "ctime": 1781607731, "time_str": "19:02:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260616/c677508231.shtml"}, {"id": "4537333", "title": "全国城镇燃气安全专项整治工作专班办公室组织召开工作调度视频会议", "content": "全国城镇燃气安全专项整治工作专班办公室6月16日组织召开工作调度视频会议，全面分析当前城镇燃气安全形势和面临问题，部署做好今后一段时期城镇燃气安全重点工作。会议强调，各地区、各部门要进一步树牢安全发展理念，履职尽责、真抓实干，持续深入推进城镇燃气安全专项整治。深入排查整治安全隐患，加大城镇燃气领域“打非治违”力度，推动液化石油气行业标准化专业化发展。持续强化燃气用户安全用气指导服务，推进城市燃气管道更新改造和安全保护，加强科技赋能和人才支撑，加大燃气安全宣传力度。要以“时时放心不下”和“事事落实到位”的责任担当，落实落细各项工作，坚决防范遏制重特大事故发生，守护好人民群众的生命财产安全。", "ctime": 1781607715, "time_str": "19:01:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260616/c677508208.shtml"}, {"id": "4537205", "title": "*ST亿晶：预重整方案获普通债权组89.34%债权总额同意", "content": "*ST亿晶公告，公司此前披露常州市中级人民法院对公司及子公司常州亿晶光电科技有限公司预重整予以备案登记，预重整引导人于2026年6月16日召开债权人会议。本次会议表决结果显示：亿晶光电预重整方案普通债权组表决同意的债权人共5家，占出席会议有表决权的普通债权人数的71.43%，表决同意的债权人所代表的债权总额为10.48亿元，占全部有表决权的普通债权人债权总额的89.34%，方案获得通过；预重整借款方案表决同意的债权人共1家，占出席会议有表决权的债权人数的14.29%，表决同意的债权人所代表的债权总额为843.3万元，占无财产担保债权总额的0.72%，未获通过。常州亿晶预重整方案中，建设工程价款优先债权组同意率100%，有财产担保债权组同意人数占75%、债权总额占比97.26%，普通债权组同意人数占91.38%、债权总额占比97.66%，均获通过。", "ctime": 1781607593, "time_str": "18:59:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260616/c677508153.shtml"}, {"id": "4537189", "title": "青海海西州直辖区发生6.3级地震", "content": "6月16日17时06分在青海海西州直辖区发生6.3级地震。据大柴旦地震局消息，截至18时40分，地震已造成1人死亡，4人受伤，震中附近煤矿企业相关作业人员已全部撤离，其他人员伤亡和财产损失情况正在排查中。（新华社）", "ctime": 1781607456, "time_str": "18:57:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260616/c677508103.shtml"}, {"id": "4537179", "title": "伊朗发布世界杯AI视频 悼念美以袭击中遇难儿童", "content": "伊朗多个驻外使馆日前在社交媒体上发布AI视频。在视频画面中，伊朗国家队球员与米纳卜小学遇难学生共同步入球场。美国和以色列2月28日对伊朗发起大规模军事行动。伊朗南部米纳卜市一所小学当日遭到袭击，168名儿童遇难。（新华社）", "ctime": 1781607361, "time_str": "18:56:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260616/c677508069.shtml"}, {"id": "4537171", "title": "A股年内已有13家PCB制造企业宣布扩产，整体规划投资总额近590亿元", "content": "6月16日，PCB概念再掀涨停潮，鸿仕达涨超23%，本川智能、逸豪新材、合力泰、正业科技等多股涨停，生益科技、大族数控、沪电股份等多股涨超5%。消息面上，PCB产业正 // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
