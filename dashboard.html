F（512050）成交额分别为67.51亿元56.13亿元55.18亿元", "ctime": 1776150034, "time_str": "15:00:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260414/c675972456.shtml"}, {"id": "4223507", "title": "运动训练机器人研发商庞伯特完成近2亿元A轮融资", "content": "运动训练机器人研发商庞伯特宣布完成近2亿元的A轮系列融资，投资方包括蓝驰创投、神骐资本、明势创投、锦秋基金和华创资本等。在本轮融资前，庞伯特已分别于2019年和2021年完成了天使轮及Pre-A轮融资，投资方包括新松投资、高通创投等。庞伯特2019年成立于上海，是一家服务于运动爱好者的AI机器人公司，该公司的核心产品包括网球发球机器人、乒乓球发球机器人及智能鹰眼系统SEEKER等。（科创板日报）", "ctime": 1776149929, "time_str": "14:58:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260414/c675972403.shtml"}, {"id": "4223489", "title": "现货黄金站上4780美元/盎司", "content": "现货黄金站上4780美元/盎司，日内涨0.82%。", "ctime": 1776149632, "time_str": "14:53:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260414/c675972272.shtml"}, {"id": "4223483", "title": "斯坦福大学报告：中国多项AI指标占据优势", "content": "美国斯坦福大学13日发布的《2026年人工智能指数报告》显示，尽管美国在顶级人工智能（AI）模型的产出数量及高影响力专利方面仍居领先地位，中国在论文发表数量、论文被引频次、专利产出总量以及工业机器人安装量等多项指标上已占据优势。 报告由斯坦福大学以人为本人工智能研究所发布。报告总结了AI发展的十大最新趋势：一是AI能力持续提升并快速普及；二是中美AI模型性能差距明显缩小；三是美国在AI数据中心规模方面居领先地位；四是AI模型在不同领域的能力呈现“参差不齐”特征；五是“负责任AI”发展滞后，相关风险事件有所增加；六是美国AI投资领先，但对全球人才吸引力下降；七是AI应用快速普及并创造显著经济价值；八是AI相关的教育发展相对滞后；九是“AI主权”成为各国政策重点，但各国AI能力差距显著；十是专家和公众对未来AI影响的认知存在明显分歧，各国对AI监管的信任程度不一。 报告显示，2025年推出的一些前沿模型在博士级别的科学问题、多模态推理和数学竞赛等领域已达到或超过人类水平。AI在各类组织中的应用普及率已达88%。 (新华社)", "ctime": 1776149559, "time_str": "14:52:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260414/c675972239.shtml"}, {"id": "4223477", "title": "证监会开展2026年信息技术系统服务机构年度备案", "content": "中国证监会发布《关于开展2026年信息技术系统服务机构年度备案的通知》。2020年，中国证监会发布了《<证券服务机构从事证券服务业务备案管理规定>第九条的适用意见—证券期货法律适用意见第16号》(证监会公告〔2020〕64号)和《监管规则适用指引—科技监管类第1号》,启动了信息技术系统服务机构备案工作。截至2025年12月31日，已有49家信息技术系统服务机构完成首次备案并公示。请上述机构于2026年5月15日前，登录中国证监会政务服务平台信息技术系统服务机构备案信息采集系统”中“年度事项备案”栏目报送年度备案材料。", "ctime": 1776149502, "time_str": "14:51:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260414/c675972217.shtml"}, {"id": "4223469", "title": "电池板块尾盘持续走高，海科新源涨停", "content": "电池板块尾盘持续走高，海科新源涨停，圣阳股份、维科技术、石大胜华此前封板, 杭可科技涨超10%，先惠技术、华盛锂电、天际股份、宏工科技、先导智能等跟涨。相关ETF方面，储能电池ETF易方达（159566）涨2.51%，成交额7.74亿元，电池ETF广发（159755）涨1.9%，成交额11.15亿元。", "ctime": 1776149375, "time_str": "14:49:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260414/c675972182.shtml"}, {"id": "4223461", "title": "富时中国A50指数期货涨1%", "content": "富时中国A50指数期货涨幅扩大至1%。", "ctime": 1776149283, "time_str": "14:48:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260414/c675972127.shtml"}, {"id": "4223451", "title": "集三项全国首创超充站落地深圳", "content": "粤港澳大湾区目前规模最大的车网互动超充示范站在深圳光明虹桥公园正式投运。这是南方电网深圳光明虹桥公园超充示范站（简称“虹桥公园超充站”）一期项目，配备了23台V2G（车网互动）充电桩，覆盖37个车位。据悉，虹桥公园超充站集中展现了3项“全国首创”成果。全国首座20千伏预装式“电力魔方”配电房在该站投用，不仅具备建设高效、施工静音、外观靓丽等优势，还通过配置光储一体化系统，实现了“零碳”运行。站内的1000千瓦超充桩也是全国首台全液冷乘用车单枪兆瓦级V2G桩，在提供极速充电体验的同时，基于互济架构可支持未来灵活扩容。此外，场站还配套了全国首个面向超充场景钠离子电池储能装置，以更稳定性能支持高功率充放电。（人民财讯）", "ctime": 1776149144, "time_str": "14:45:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260414/c675972078.shtml"}, {"id": "4223447", "title": "沪深京三市成交额超2.2万亿元，较上日此时放量1860亿元", "content": "据同花顺iFinD数据，沪深京三市成交额超2.2万亿元，较上日此时放量1860亿元，预计全天成交金额约2.3万亿元。截至目前，沪市成交额9185亿元，深市成交额12696亿元，北证50成交额118亿元。", "ctime": 1776149106, "time_str": "14:45:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260414/c675972054.shtml"}, {"id": "4223431", "title": "ETF两市成交额超4000亿元", "content": "截至目前，ETF两市成交额超4000亿元，报4012.13亿元，分类型来看，股票型ETF成交额 7927, "time_str": "14:25:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260414/c675971627.shtml"}, {"id": "4223305", "title": "伊朗石油部长：冲突爆发以来石油销售情况良好", "content": "当地时间4月14日，伊朗石油部长穆赫辛·帕克内贾德称，自本次与美国和以色列的军事冲突爆发以来，伊朗的石油销售情况良好，部分收入将用于石油工业的恢复。帕克内贾德说，伊朗石油产业工人在冲突期间维持了各设施的运行，确保石油出口“哪怕一天也未中断”，其中包括哈尔克岛等关键出口枢纽。（央视新闻）", "ctime": 1776147668, "time_str": "14:21:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260414/c675971556.shtml"}, {"id": "4223275", "title": "伊朗政府：美以军事行动致伊朗损失2700亿美元", "content": "据今日俄罗斯14日报道，伊朗政府发言人说，据初步估计，美国和以色列的军事打击给伊朗已造成2700亿美元损失。(新华社)", "ctime": 1776147022, "time_str": "14:10:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260414/c675971396.shtml"}, {"id": "4223273", "title": "中新（西兰）举行第四轮领事磋商（2026-04-14）", "content": "2026年4月13日，外交部领事司司长龙舟与新西兰外交贸易部领事司司长伯吉斯在北京共同主持中新第四轮领事磋商。双方就加强领事合作、便利人员往来、维护公民安全与合法权益等议题深入交换意见。双方一致同意积极落实两国领导人重要共识，进一步加强沟通，增进理解，深化领事领域交流合作，共同推动中新全面战略伙伴关系继续健康稳定发展。(外交部网站)", "ctime": 1776146936, "time_str": "14:08:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260414/c675971375.shtml"}, {"id": "4223257", "title": "诺和诺德与OpenAI合作，利用AI加速药物研发", "content": "诺和诺德4月14日宣布与OpenAI建立战略合作伙伴关系，此次合作将运用先进的人工智能能力，对复杂数据集进行分析，筛选具有潜力的候选药物，并缩短从基础研究到惠及患者所需的周期。（界面新闻）", "ctime": 1776146791, "time_str": "14:06:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260414/c675971330.shtml"}, {"id": "4223251", "title": "大批“五一”航班突然取消背后：高油价下的停飞潮正在全球蔓延", "content": "最近一段时间，不少网友在社交平台上，贴出了自己提前预订的“五一”假期机票被取消的截图，被取消的航班主要以飞东南亚和大洋洲居多。记者从多家航空公司获悉，从4月开始主动取消的航班确实有所增加，其中东南亚和大洋洲是重头，这与油价的大幅上涨不无关系。相比国内，部分国际机场加油价格更高，叠加需求和竞争的影响，部分航线的取消就首当其冲。而这样的情况，正在全球航线市场蔓延，也逐渐改变着航空业的竞争格局和旅客的出行选择。（第一财经）", "ctime": 1776146757, "time_str": "14:05:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260414/c675971314.shtml"}, {"id": "4223231", "title": "国开行一季度发放绿色贷款超1500亿元", "content": "记者4月14日从国家开发银行获悉，今年一季度，国开行发放绿色贷款超过1500亿元，全行绿色贷款在全部信贷资产中的占比进一步提升。 据介绍，国开行积极发挥政策性金融在服务绿色发展中的引领带动作用，加大对基础设施绿色升级、城乡建设绿色低碳发展等领域的支持力度，助力绿色交通、绿色建筑等基础设施绿色运营和升级改造，推动实现经济效益、社会效益、生态效益的有机统一。同时，用好专项贷款产品，支持清洁可再生能源发展、能源清洁高效利用和新型储能技术创新，助力优化能源结构，保障国家能源安全。 今年以来，国开行不断丰富绿色金融工具箱，持续提升金融服务质效。今年1月，国开行向中国光大环境（集团）有限公司发放了4.9亿元境外人民币可持续发展挂钩贷款。这笔贷款的利率与企业低碳转型目标挂钩，将碳排放强度、污水处理量等作为关键指标，如企业实现预定目标并通过第三方专业机构评估认证，贷款利率将给予优惠。 国家开发银行相关业务负责人表示，下一步，国开行将持续加大对基础设施绿色低碳发展、绿色低碳科技创新、重点产业绿色低碳转型、生态环境保护修复等领域的中长期融资支持，助力加快经济社会发展全面绿色转型和美丽中国建设。(新华社)", "ctime": 1776146656, "time_str": "14:04:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260414/c675971273.shtml"}, {"id": "4223225", "title": "中国石油集团董事长戴厚良拜会阿联酋阿布扎比王储", "content": "4月13日，中国石油集团董事长戴厚良在京拜会阿联酋阿布扎比王储哈立德，双方就深化能源领域合作交换意见。中国石油集团副总经理张道伟以及总经理助理李强参加会见。（中国石油报）", "ctime": 1776146603, "time_str": "14:03:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260414/c675971240.shtml"}, {"id": "4223213", "title": "机构：近期住房租金阶段性回升", "content": "根据中指研究院对50个重点城市住宅租赁价格的监测，3月一线城市住宅租金集体上涨，其中北上深的环比涨幅都在0.4%左右，幅度在50个城市中排名前三。中指研究院研究主管程威表示，近期住房租金的阶段性回升是季节性效应集中释放的结果，也符合往年同期租金变化的一般规律。展望后续市场走势，随着“返工潮”等季节性效应减退，重点城市住房租赁市场将回归常态运行。（人民财讯）", "ctime": 1776146545, "time_str": "14:02:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260414/c675971181.shtml"}, {"id": "4223165", "title": "伊朗外长和阿曼外交大臣通话 讨论维护地区和平", "content": "总台记者当地时间4月14日获悉，伊朗外交部长阿拉格齐与阿曼外交大臣巴德尔举行了电话会谈。阿拉格齐对阿曼在面对地区局势时所持有的负责任且坚持原则的立场表示感谢。他强调，伊朗致力于在所有地区国家的合作与参与下、在排除美国破坏性干预的情况下，维护地区的和平与稳定。巴德尔对伊朗在接受持续停火和进入外交进程方面所表现出的负责任态度表示欢迎，并希望和平与稳定能尽快重返该地区。（央视新闻）", "ctime": 1776146452, "time_str": "14:00:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260414/c675971157.shtml"}, {"id": "4223107", "title": "应对供应链挑战 日本客户代表团到访中矿资源", "content": "津巴布韦出台锂原矿及精矿出口禁令后，全球锂资源供应链受到直接冲击，也给高度依赖津巴布韦技术级透锂长石原材料的日本万古烧行业带来生产原料断供的可能。为纾解困境，2026年4月9日，日本客户代表团（日陶，Tomatec，銀峰，浅岡和迈可五家企业）专程到访中矿资源集团股份有限公司（简称“中矿资源”），就原材料保障合作事宜进行洽谈。中矿资源国际贸易部相关业务负责人接待，双方围绕当前供需形势及合作纾困方案展开深入交流。经充分沟通，双方达成共识：津巴布韦出口禁令解除后，中矿资源将优先保障上述长期合作伙伴的原材料需求，建立稳定供应通道，确保其生产持续运转。此次会谈进一步深化了双方战略合作关系。（人民财讯）", "ctime": 1776146340, "time_str": "13:59:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260414/c675971115.shtml"}, {"id": "4223103", "title": "房地产板块再度拉升，南山控股直线涨停", "content": "房地产板块再度拉升，南山控股直线涨停，黑牡丹、特发服务、世联行、华夏幸福、浦东金桥跟涨。相关ETF方面，房地产ETF华夏（515060）涨2.77%，成交额3388.43万元，金融地产ETF汇添富（159931）成交额29.56万元。", "ctime": 1776146127, "time_str": "13:55:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260414/c675971065.shtml"}, {"id": "4223101", "title": "原料供应紧张　韩国鼓励民众减少塑料消费", "content": "受中东战事影响，韩国用于制造塑料产品的关键原料供应紧张。韩国气候能源环境部13日在全国范围内启动一项为期6个月的活动，鼓励民众减少塑料消费。(新华社)", "ctime": 1776146118, "time_str": "13:55:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260414/c675971058.shtml"}, {"id": "4223091", "title": "美国能源部长改口：油价尚未触顶", "content": "美国能源部长克里斯·赖特13日说，预计油价在今后一段时间仍将维持高位，甚至可能进一步攀升。此前，赖特为安抚市场情绪，对外一直宣称油价可能很快回落。(新华社)", "ctime": 1776145973, "time_str": "13:52:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260414/c675971023.shtml"}, {"id": "4223087", "title": "横店影视成立横有文化运营公司", "content": "企查查APP显示，近日，横有文化运营（浙江）有限公司成立，注册资本5000万元，经营范围包含：数字文化创意软件开发；数字文化创意内容应用服务；数字创意产品展览展示服务等。企查查股权穿 stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260414/c675970892.shtml"}, {"id": "4223067", "title": "国家主席习近平会见西班牙首相桑切斯", "content": "4月14日上午，国家主席习近平在北京人民大会堂会见来华进行正式访问的西班牙首相桑切斯。习近平指出，尽管国际形势变乱交织，中国和西班牙关系始终稳步发展，打造了具有战略定力的中西关系，一条重要经验就是基于共同利益作出正确决策。事实证明，深化合作符合两国人民利益、顺应时代发展大势，增强了彼此走独立自主道路的实力和底气。双方要始终将发展中西关系置于彼此对外政策重要位置，相互支持对方捍卫国家主权和领土完整。中国把长远战略目标和阶段性目标统一起来，以一茬接着一茬干的历史耐心接续制定和实施五年规划。我们有坚定推进中国式现代化的决心，也有以高水平对外开放同世界共享发展机遇的胸怀，将以自身发展为全球经济增长注入信心和动力。双方要把握机遇，共谋创新发展，加强贸易、新能源、智能经济等领域合作，鼓励文化、教育、科研、体育交流，推动两国全面战略伙伴关系取得更多成果，为两国人民带来更多福祉。(新华社)", "ctime": 1776145375, "time_str": "13:42:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260414/c675970891.shtml"}, {"id": "4223065", "title": "美国学者：美国封锁伊朗海上交通无法令伊朗屈服", "content": "美国著名国际关系学者，芝加哥大学政治学教授米尔斯海默12日接受采访时表示，美国封锁伊朗海上交通无法令伊朗屈服，美国最终可能将不得不承认失败。美国著名国际关系学者米尔斯海默：首先，你必须明白，美国和以色列对伊朗构成生存威胁，而伊朗是一个民族主义情绪高涨、意志坚定的国家。一个民族主义情绪高涨、意志坚定的国家，在面临生存威胁时，能够承受巨大的压力，所以，认为我们能让伊朗人举手投降的想法是不切实际的。此外，还有另一个层面需要考虑，为什么我们最近允许伊朗石油进入全球石油市场，为什么我们临时豁免了对伊朗石油的制裁，因为我们需要伊朗石油进入到全球石油市场，以防止全球经济崩溃。如果我们阻止伊朗石油进入全球石油市场，只会对全球经济造成严重损害。最后一点，我敢打赌不久之后，也门胡塞武装和伊朗就会封锁红海。届时，石油、天然气和化肥不但无法从波斯湾运出，这些产品也将无法经由红海运出，这将严重打击世界经济，并迫使美国政府最终向伊朗人承认失败。（央视新闻）", "ctime": 1776145326, "time_str": "13:42:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260414/c675970875.shtml"}, {"id": "4223059", "title": "北部湾港：中越两国经贸合作持续深化，对公司业务开展影响积极", "content": "北部湾港今日在投资者平台表示，中越两国经贸合作持续深化，有利于区域跨境物流与贸易发展，对公司业务开展存在积极影响。公司围绕平陆运河即将通航，加快江海联运泊位及航道配套建设，优化“江铁海公”多式联运体系；提前布局货源对接，建立重点货类全程物流服务方案，保障运河通航即贯通。公司持续加强与东盟包括越南港口、航运企业的业务合作，稳步拓展航线网络，有序组织西南腹地与越南间双向货源。（人民财讯）", "ctime": 1776144989, "time_str": "13:36:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260414/c675970825.shtml"}, {"id": "4223021", "title": "4月13日芝商 // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">

      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>

      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
