ock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261020/c680886944.shtml"}, {"id": "5422601", "title": "国家药监局：运用人工智能提升药品安全治理水平", "content": "10月19日，国家药监局召开“人工智能+药品监管”工作推进会。会议指出，人工智能是影响未来发展的关键变量，正深度渗透药品研发、生产、流通、使用全链条，深刻改变产业形态与风险结构。会议强调，要立足监管职责，立规则、稳预期、强服务、育生态，积极促进人工智能赋能医药产业创新发展。要制定专项计划，支持重点赛道率先突破，把审评服务前移到创新源头，营造鼓励创新、包容审慎的监管环境。要运用人工智能提升药品安全治理水平，推动审评审批更智能、检查执法更精准、风险防控更灵敏、协同监管更高效。要夯实基础保障，建立覆盖全周期、持续迭代的人工智能应用管理机制，强化资源统筹，培养专业人才队伍，促进“技术向善”，守牢人工智能安全底线。", "ctime": 1792485642, "time_str": "16:40:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261020/c680886806.shtml"}, {"id": "5422585", "title": "台风“蔷琵”可能24日前后登陆台湾并二次登陆福建", "content": "今年第30号台风“蔷琵”（超强台风级）的中心10月20日14时位于距离台湾台北市东偏南方向约1660公里的西北太平洋洋面上，中心附近最大风力17级以上（62米/秒）。预计，“蔷琵”将以每小时25～30公里的速度继续向西偏北方向移动，逐渐向台湾以东洋面靠近，有可能于24日前后在台湾东部沿海登陆（42～50米/秒，强台风级），穿过台湾后在福建二次登陆（28～33米/秒，强热带风暴级或台风级）；也可能在台湾东北部海面转向东北方向移动，强度逐渐减弱。（新华社）", "ctime": 1792485395, "time_str": "16:36:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261020/c680886214.shtml"}, {"id": "5422583", "title": "“十五五”时期我国将加力攻关提升种业创新水平", "content": "农业现代化，种子是基础。农业农村部有关负责人19日表示，“十五五”时期将在有组织体系化育种攻关上再加力，加快提升种业创新水平。这是记者在农业农村部19日于广东省广州市召开的深入实施种业振兴行动推进会上了解到的。2021年7月，中央深改委第二十次会议审议通过《种业振兴行动方案》。经过持续攻坚，我国培育出抗赤霉病小麦、抗稻飞虱水稻、耐密宜机收玉米、高油高产大豆等一批生产急需的重大品种，更好保障国家粮食安全、更好守护人们的美好生活。农业农村部有关负责人表示，“十五五”时期种业振兴面临新形势新要求，任务仍然艰巨。如粮食和重要农产品需求发生深刻变化，必须把准种业发力方向，育种上既要注重产量，也要注重品质；气候变化对农业生产带来严峻挑战，必须把抗逆稳产摆在更加突出位置等。未来5年，是种业振兴“十年实现重大突破”的攻坚阶段。“我国育种创新已取得多点突破，但从0到1的原创性成果还不多，高油高产大豆、耐密宜机收玉米等品种的单产水平、抗逆性状，以及奶牛、肉牛、生猪等畜种的饲料转化率、繁殖效率等性能与国外先进水平仍有差距。”农业农村部有关负责人说，要统筹实施国家种业科技项目和育种联合攻关，围绕大面积单产提升、标准化设施种养殖等需求，加快培育一批突破性品种。还要加大育种创新支持力度，推动人工智能赋能育种创新，加力打造一流种业企业。（新华社）", "ctime": 1792485369, "time_str": "16:36:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261020/c680886125.shtml"}, {"id": "5422581", "title": "兴发集团：13名董事、高级管理人员拟合计增持26万～39万股", "content": "兴发集团公告，董事和高级管理人员共计13人计划自公告披露之日起2个月内，以自有或自筹资金通过集中竞价交易方式增持公司A股股份，每人拟增持20000～30000股，合计26万～39万股。此次增持不设置价格区间。", "ctime": 1792485347, "time_str": "16:35:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261020/c680886072.shtml"}, {"id": "5422563", "title": "三星研发24小时工作的机器人", "content": "统管三星电子机器人业务的RX业务推进室正在首尔牛眠洞首尔R&D园区验证可在产业现场24小时运转的机器人性能。这款机器人在执行搬运货物等制造、物流现场重复作业的同时，也在学习周边环境和作业方式。一位业界人士表示，“三星电子和合作公司员工正按24小时三班倒，检查机器人工作的过程”。据悉，三星电子正以包括这款机器人在内的多个候选产品为对象，研究是否参展CES。", "ctime": 1792485315, "time_str": "16:35:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261020/c680885968.shtml"}, {"id": "5422549", "title": "国药股份：2026年第三季度净利润5.96亿元，同比增长9.70%", "content": "国药股份公告，2026年第三季度营业收入138.78亿元，同比增长0.95%；归母净利润5.96亿元，同比增长9.70%；扣非净利润5.96亿元，同比增长10.59%。2026年前三季度营业收入406.06亿元，同比增长3.11%；归母净利润14.76亿元，同比下降1.07%；扣非净利润14.75亿元，同比增长0.36%。", "ctime": 1792485288, "time_str": "16:34:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261020/c680885899.shtml"}, {"id": "5422537", "title": "日久光电：控股股东及一致行动人股东权益被动增加触及1%整数倍", "content": "日久光电公告，公司回购注销2024年已回购的482.89万股股份后，总股本由2.81亿股减少至2.76亿股，控股股东、实际控制人陈超及其一致行动人陈晓俐、陈鑫帅合计持股比例由23.6257%被动增加至24.0387%，触及1%整数倍，持股数量均未发生变化，不涉及增持或减持情形。", "ctime": 1792485235, "time_str": "16:33:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261020/c680885786.shtml"}, {"id": "5422517", "title": "外汇局：9月银行结汇19897亿元人民币 售汇16098亿元人民币", "content": "国家外汇管理局统计数据显示，2026年9月，银行结汇19897亿元人民币，售汇16098亿元人民币。2026年1-9月，银行累计结汇163007亿元人民币，累计售汇135947亿元人民币。按美元计值，2026年9月，银行结汇2942亿美元，售汇2380亿美元。2026年1-9月，银行累计结汇23776亿美元，累计售汇19835亿美元。", "ctime": 1792485128, "time_str": "16:3 nt": "俄外长拉夫罗夫当天在德黑兰与伊朗外长阿拉格齐共同举行的记者会上表示，俄方无意放弃履行与伊朗在经济和投资领域达成的协议。俄技术专家正陆续返回伊朗南部的布什尔核电站项目。拉夫罗夫还表示，俄伊双边贸易快速增长，双方在油气资源开采与运输方面有广阔合作前景。（央视新闻）", "ctime": 1792483681, "time_str": "16:08:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261020/c680881437.shtml"}, {"id": "5422349", "title": "美股光通信板块盘前下挫", "content": "美股光通信板块盘前下挫，Coherent、Lumentum、迈威尔科技跌超2%，康宁跌近2%。", "ctime": 1792483611, "time_str": "16:06:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261020/c680881041.shtml"}, {"id": "5422341", "title": "周小川：应开展研究并做好预案，防范AI领域投资失败引发的金融风险", "content": "中国央行原行长周小川10月20日在2026外滩年会“AI与生产率变革：技术跃迁下的宏观冲击”圆桌论坛上表示，对于人工智能技术演进，我们无疑会面临部分投资失败、部分投资成功的局面，但考虑到如今有如此巨额的资金流向人工智能及相关基础设施，一旦其中一部分失败，就可能引发金融动荡，并酿成危机，这就需要采取大规模的行动来支撑经济，并对部分金融机构实施救助。因此，我们应当开展研究并做好预案，在政策工具箱中储备相应的政策工具，以应对这类动荡和影响。（界面新闻）", "ctime": 1792483588, "time_str": "16:06:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261020/c680880958.shtml"}, {"id": "5422315", "title": "工信部：分层分类推进国家级先进制造业集群提质能级跃升", "content": "10月20日，国务院新闻办公室举行新闻发布会介绍2026年前三季度工业和信息化发展情况。工业和信息化部总工程师王卫明表示，一艘船、一架飞机、一辆汽车整车背后不是单一企业的单打独斗，而是一条产业链的高效协同，一个创新网络的紧密联动，一套产业生态的合力支撑。下一步，工业和信息化部将深入贯彻全国先进制造业大会精神，系统性地推进国家级集群提质升级，能级跃升。首先突出分层、分类施策，对已经具备较强国际竞争优势的集群，重点提升创新资源、创新策源能力、全球资源配置能力，加快向世界级、世界级集群迈进。对于处于加速成长期的集群，聚焦补短板、锻长板、强主体、优生态，把产业发展潜力实打实地转化为核心竞争力；其次，深化跨域协同联动，引导先进制造业集群深化跨区域资源共享，跨领域技术融合，产业链上下游融通发展，打破地域壁垒和行业边界，形成“握指成拳”的合力。最后，强化政策精准支持，从创新平台布局，高端人才引育，要素资源保障等方面，加大对先进制造业集群的支持力度，推动集群从物力集聚向核心能力系统集成跃升，为构建以先进制造业为骨干的现代化产业体系提供硬核支撑。（人民财讯）", "ctime": 1792483479, "time_str": "16:04:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261020/c680880615.shtml"}, {"id": "5422299", "title": "华信新材：2026年第三季度净利润1376.85万元，同比增长11.37%", "content": "华信新材公告，2026年第三季度营业收入9444. , {"id": "5422175", "title": "工信部：坚决防范不合理创新设计和未经充分研发测试验证的汽车产品进入市场", "content": "国务院新闻办公室今日（10月20日）举行新闻发布会。安全是汽车企业的生命线与核心竞争力，任何研发活动都要以安全为第一前提，绝不能以牺牲安全为代价。下一步，工信部将积极研究吸纳各方面意见，会同相关部门加快编制印发《通知》，加快制修订相关标准，强化产品生产一致性监督检查、检验检测机构检查，通过事前准入、事中事后监督检查全链条监管，坚决防范不合理创新设计和未经充分研发测试验证的产品进入市场，坚决守牢汽车产品安全底线，切实维护消费者合法权益，推动汽车产业高质量发展。（央视新闻）", "ctime": 1792483196, "time_str": "15:59:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261020/c680879248.shtml"}, {"id": "5422153", "title": "西典新能：2026年第三季度净利润7051.93万元，同比下降1.83%", "content": "西典新能公告，2026年第三季度营业收入7.23亿元，同比增长3.11%；净利润7051.93万元，同比下降1.83%；扣非净利润6991.83万元，同比下降1.41%。2026年前三季度营业收入19.14亿元，同比下降8.59%；净利润1.54亿元，同比下降26.82%；扣非净利润1.51亿元，同比下降27.65%。", "ctime": 1792483020, "time_str": "15:57:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261020/c680879185.shtml"}, {"id": "5422139", "title": "新北洋：子公司正棋机器人中标项目总金额约8.2亿元", "content": "新北洋公告，公司控股子公司威海新北洋正棋机器人股份有限公司近日收到安徽省招标集团股份有限公司签发的《中标通知书》，确认为中国邮政集团有限公司湖北省分公司华中邮件处理中心带设备外包服务项目（二次）标包一中标人。项目外包期限5年，预计总外包业务量56.9亿袋件，外包期限内项目总金额约8.2亿元，其中2027年预计项目金额约1.64亿元。", "ctime": 1792482950, "time_str": "15:55:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261020/c680879135.shtml"}, {"id": "5422123", "title": "5年期以上LPR报3.5% 专家：短期内LPR定价基础会保持稳定", "content": "10月20日，中国人民银行授权全国银行间同业拆借中心公布，最新贷款市场报价利率（LPR）为：1年期LPR为3.0%，5年期以上LPR为3.5%。以上LPR在下一次发布LPR之前有效。东方金诚研究团队王青、冯琳指出，10月两个期限品种的LPR报价保持不变，符合市场预期。主要是9月末央行调整完善若干货币政策工具，主要政策利率保持稳定，这意味着10月LPR报价的定价基础没有变化。另外，当前银行净息差仍然处在历史低位附近，报价行也缺乏主动下调LPR报价加点的动力。王青、冯琳进一步认为，近期LPR报价保持稳定，根本原因是三季度GDP（国内生产总值）增速回升到4.5%，以高技术制造业为代表的新质生产力领域加速发展。在此背景下，总量型货币政策保持定力，货币政策加大逆周期调节力度，优先选择结构性货币政策工具发力。（每经）", "ctime": 1792482804, "time_str": "15:53:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261020/c680879060.shtml"}, {"id": "5422111", "title": "摩根资管5亿人民币自购旗下首只主动ETF 为公司近期最大单笔自购", "content": "摩根基金最新公告宣布，公司股东将通过关联方摩根资产管理（亚太），出资7500万美元（约合5亿元人民币），投向旗下首只主动ETF——摩根大盘成长主动股票ETF，投资将在基金上市后开展。据悉，这笔资金也是2023年以来，主动权益领域基金公司及股东、关联方规模最大的一笔自有资金投资。对此，摩根资产管理中国CEO王琼慧称，此次自购充分体现了公司对中国资本市场长期价值的认可，以及对主动ETF发展前景的积极预期。", "ctime": 1792482671, "time_str": "15:51:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261020/c680879019.shtml"}, {"id": "5422101", "title": "苏州龙杰：2026年1-9月普通切片采购价变动22.68%", "content": "苏州龙杰公告，公司披露2026年第三季度主要经营数据。2026年1-9月，FDY差别化产品产量11.21万吨、销量11.45万吨、营业收入11.49亿元；DTY差别化产品分别为3.39万吨、3.26万吨、3.86亿元；POY差别化产品分别为2.27万吨、0.09万吨、637.43万元。同期，FDY、DTY、POY差别化产品价格变动比例分别为18.95%、4.50%、18.70%；普通切片、全消光切片采购价变动比例分别为22.68%、21.05%。", "ctime": 1792482628, "time_str": "15:50:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261020/c680878895.shtml"}, {"id": "5422099", "title": "苏州龙杰：2026年第三季度净利润6172.78万元，同比增长189.28%", "content": "苏州龙杰公告，2026年第三季度营业收入6.59亿元，同比增长48.24%；归母净利润6172.78万元，同比增长189.28%；扣非净利润5825.8万元，同比增长218.61%。2026年前三季度营业收入15.68亿元，同比增长36.91%；归母净利润1.16亿元，同比增长113.12%；扣非净利润1.23亿元，同比增长218.66%。", "ctime": 1792482620, "time_str": "15:50:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261020/c680878887.shtml"}, {"id": "5422089", "title": "外交部：中国将坚持独立自主的和平外交政策", "content": "10月20日，外交部发言人毛宁主持例行记者会。有记者问：今年是中国工农红军长征胜利90周年。近日，俄罗斯外交部发言人扎哈罗娃积极评价中国发展的成就，并将中国推动构建人类命运共同体、共建“一带一路”等努力比作“新的伟大长征”。请问中方对此有何评论？长征精神对新时代中国外交和发展有何启示？对此，毛宁表示，我们注意到扎哈罗娃女士的积极表态，伟大长征精神鼓舞激励中国人民攻坚克难，取得了举世瞩目的发展成就。在实现中华民族伟大复兴的新长征路上，中国将坚持独立自主的和平外交政策，同包括俄罗斯在内的世界各国团结合作，共促和平与发展，携手构建人类命运共同体。（央视新闻）", "ctime": 1792482494, "time_str": "15:48:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261020/c6808 const SECTORS  = [{"name": "金融", "hit_count": 61, "etfs": []}, {"name": "人工智能", "hit_count": 31, "etfs": []}, {"name": "半导体", "hit_count": 26, "etfs": []}, {"name": "消费", "hit_count": 18, "etfs": []}, {"name": "数据要素", "hit_count": 17, "etfs": []}, {"name": "机器人", "hit_count": 15, "etfs": []}, {"name": "医药", "hit_count": 8, "etfs": []}, {"name": "军工", "hit_count": 8, "etfs": []}];
const META     = {"update_time": "2026-10-20 16:45:50", "sentiment_score": 59.053497942386834, "agents": []};

// 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
