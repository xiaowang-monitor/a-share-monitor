655, "time_str": "12:10:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260511/c676587872.shtml"}, {"id": "4344305", "title": "“玉米油第一股”西王食品境外子公司lovate重整获美国法院批准，可在最短时间内完成交割", "content": "5月11日，澎湃新闻获取到的一份裁定文件显示，“玉米油第一股”西王食品境外子公司Iovate的重整事项已有裁决，美国破产法院已对加拿大法院作出的批准举行听证并予以通过，可在合理可行的最短时间内完成交割。判决书同时明确，自破产监管人在加拿大破产程序中出具证明文件并送达认购方之日起，位于美国属地管辖范围内的除外资产，由第15章破产债务人转让至剩余资产公司的行为合法、有效并产生完整法律效力，剩余资产公司将完整取得第15章破产债务人对该等除外资产享有的全部权利、所有权及权益。（澎湃新闻）", "ctime": 1778472480, "time_str": "12:08:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260511/c676587825.shtml"}, {"id": "4344303", "title": "涉疫邮轮20名英国公民回国接受隔离观察", "content": "据英国媒体报道，“洪迪厄斯”号邮轮上的20名英国公民10日回国后，已被转运至英格兰西北部默西赛德郡一家医院接受医学观察。英国政府表示，目前疫情对公众的总体风险仍“非常低”。（新华社）", "ctime": 1778472459, "time_str": "12:07:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260511/c676587820.shtml"}, {"id": "4344299", "title": "COMEX黄金期货跌超1%", "content": "COMEX黄金期货跌超1%，现报4678.4美元/盎司。", "ctime": 1778472277, "time_str": "12:04:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260511/c676587766.shtml"}, {"id": "4344287", "title": "起火土耳其客机全员已被疏散 部分乘客受轻伤", "content": "当地时间11日上午，一架土耳其航空公司的客机在尼泊尔首都加德满都的特里布万国际机场降落时，起落架轮胎起火。经机场方面确认，机上全员安全疏散，部分乘客在救援疏散过程中受轻伤。目前这架飞机已被移至机场停放区。（央视新闻）", "ctime": 1778472094, "time_str": "12:01:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260511/c676587728.shtml"}, {"id": "4344285", "title": "港股午评：恒生指数跌0.29%，恒生科技指数涨0.04%", "content": "港股午间收盘，恒生指数跌0.29%，恒生科技指数涨0.04%。恒指港股通ETF银华（159318）跌0.51%，港股通科技ETF鹏华（159751）涨0.21%。板块方面，半导体产品与设备、电气设备板块涨幅靠前；客运航空公司、金属与采矿板块跌幅靠前。个股方面，乐动机器人涨128.0%，澜起科技涨20.61%，天岳先进涨18.3%，纳芯微涨16.47%，飞速创新涨14.16%；德适-B跌10.73%，灵宝黄金跌10.22%，潼关黄金跌8.71%，新秀丽跌8.03%，赤峰黄金跌7.92%。", "ctime": 1778472086, "time_str": "12:01:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260511/c676587723.shtml"}, {"id": "4344271", "title": "广东省地震局回应群发短信：不是地震预警", "content": "为让全省公众能及时接收地震预警信息，增强公众防灾减灾意识，广东省地震局于5月11日—17日，在全省范围内推送地震预警科学普及公益短信，提醒大家关注“南粤地震预警”微信小程序。（广东发布）", "ctime": 1778471806, "time_str": "11:56:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260511/c676587607.shtml"}, {"id": "4344259", "title": "5月11日午间公告一览：民德电子放弃广芯微电子增资优先认购权", "content": "民德电子公告，为增强控股子公司广芯微电子的综合资本实力，支持其稳健、高质量扩产，广芯微电子拟通过增资扩股的方式引入投资者凯联资本和芯立电子。凯联资本以8000万元认购新增注册资本492.93万元，芯立电子以4000万元认购新增注册资本246.46万元。公司及广芯微电子其他股东均放弃本次增资的优先认购权。增资完成后，广芯微电子注册资本由5545.45万元增加至6284.85万元，公司持有广芯微电子的股权比例下降至44.2059%。信息发展公告，公司于2026年5月8日召开第六届董事会第三十一次会议，审议通过《关于为全资子公司提供担保的议案》，拟为全资子公司光典信息发展有限公司向南京银行股份有限公司上海分行申请的人民币1000万元借款提供连带责任保证担保，担保额度为1000.00万元，保证期间为主合同项下债务履行期限届满之日起三年；截至公告披露日，相关担保协议尚未签署，最终实际担保金额不超过本次授予的担保额度。中国生物制药公告，公司附属公司正大天晴药业集团股份有限公司与葛兰素史克达成一项独家战略合作，加速bepirovirsen在中国内地的上市进程。根据协议条款，正大天晴将负责bepirovirsen在中国内地的进口、分销、医院准入以及推广和非推广活动，该产品产生的全部销售收入将确认为正大天晴的营业收入。", "ctime": 1778471360, "time_str": "11:49:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260511/c676587476.shtml"}, {"id": "4344255", "title": "特朗普：美方一直监控伊朗浓缩铀 谁靠近就“炸飞”", "content": "美国总统特朗普表示，美国一直在对伊朗掩埋在废墟下的浓缩铀进行监控，美国太空军在负责此事。特朗普在采访中被问及伊朗掩埋在废墟深处的浓缩铀时说：“我们迟早会拿到它，我们一直在监视它。我搞了个叫‘太空军’的东西，他们正在盯着。如果有人靠近那个地方，我们会知道，并且会把他们炸飞。”（新华社）", "ctime": 1778471265, "time_str": "11:47:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260511/c676587456.shtml"}, {"id": "4344253", "title": "鹿明机器人完成A1及A2轮融资，三菱电机领投", "content": "5月11日，鹿明机器人连续完成A1及A2两轮融资，公司累计融资近10亿元。A1轮由三菱电机智能制造科技（中国）集团有限公司领投，老股东普华资本、吴中金控等机构超额跟投；A2轮仍由三菱电机持续领投，恒生电子、海高集团、昆石投资等机构跟投。资金将用于公司具身大模型研发和场景拓展的持续投入。（第一财经）", "ctime": 1778471151, "time_str": "11:45:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260511/c676587435.shtml"}, {"id": "4344247", "title": "俄罗斯驻日大使：俄日关系进入“冰河期”", "content": "俄罗斯驻日本大使尼古拉·诺兹德廖夫表示，俄日关系已进入“冰河期”，双边关系正在经历二战后前所未有的退化。诺兹德廖夫说，俄日关系之所以会出现这种情况，是因为日本支持对俄制裁，并追随西方国家的反俄路线，日方政策造成双边关系成果付诸东流。因日本政府2022年以乌克兰问题为由对俄方实施制裁，围绕俄日和平条约的谈判已终止。因在南千岛群岛（日本称北方四岛）的归属问题上存在争议，俄日在二战结束后至今未缔结和平条约。（新华社）", "ctime": 1778470991, "time_str": "11:43:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260511/c676587397.shtml"}, {"id": "4344235", "title": "Sensor Tower：《王者荣耀》4月跃升至全球手游收入榜榜首", "content": "根据Sensor Tower应用表现洞察最新数据，《王者荣耀》在2026年4月跃升至全球手游收入榜榜首。紧随其后的是《Last War: Survival Game》、《Whiteout Survival》、《Royal Match》以及《Gossip Harbor》，共同跻身全球收入榜前五。", "ctime": 1778470816, "time_str": "11:40:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260511/c676587339.shtml"}, {"id": "4344221", "title": "泡泡玛特将在5月13日举行2026年一季度业务更新电话会", "content": "泡泡玛特将在5月13日举行2026年一季度业务更新电话会，届时将有公司高管团队参会。一季度电话会与股东周年大会同为5月13日举行。2023年至2025年，泡泡玛特仅发布了一季度相关营运数据公告，未有过公开的业务电话会。（界面新闻）", "ctime": 1778470457, "time_str": "11:34:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260511/c676587193.shtml"}, {"id": "4344213", "title": "期货午评：美伊互拒谈判方案！欧线大涨超5% 原油涨超3%", "content": "期货午评：早盘收盘，国内期货主力合约涨跌互现。集运欧线涨超5%，燃料油、低硫燃料油涨超4%，苯乙烯、鸡蛋、碳酸锂、原油涨超3%，PX、PTA涨超2%；跌幅方面，多晶硅跌超2%，尿素、烧碱、硅铁、20号胶、纯碱、橡胶跌超1%。", "ctime": 1778470325, "time_str": "11:32:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260511/c676587026.shtml"}, {"id": "4344211", "title": "A股午评：沪指半日涨近1%站上4200点，存储芯片、半导体设备等算力硬件股继续爆发", "content": "A股三大指数早盘集体上涨，截至午盘，上证指数涨0.94%，深证成指涨2.13%，创业板指涨3.03%，北证50跌0.1%，科创50指数涨5.27%。全市场成交额23233亿元，较上日放量3382亿元，全市场近3000只个股上涨。板块题材上，存储芯片、半导体、先进封装、CPO、铜缆高速连接、光纤、光伏设备、稀土永磁、卫星导航、PEEK材料概念股涨幅居前；港口航运、贵金属、机场航运、游戏、旅游及酒店、银行、免税店板块跌幅居前。盘面上，受益于AI浪潮，存储芯片、半导体设备、光纤等算力硬件股继续爆发，江波龙、北方华创、华海诚科等众多个股创出历史新高，创业板指盘中突破3900点刷新近11年新高，科创50指数盘中大涨5%逼近历史高点。4月中国稀土出口量价齐升推动相关板块走高，万朗磁塑收获涨停，中稀有色、北方稀土跟涨。商业航天迎密集催化，板块反复活跃，信维通信、飞沃科技领涨板块。此外，房地产、光伏设备、PEEK材料概念股均有表现。另一方面，霍尔木兹海峡情况依然复杂，港口航运板块回调，国航远洋、招商轮船等股下跌。游戏股同样调整，完美世界、世纪华通等股下挫。", "ctime": 1778470312, "time_str": "11:31:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260511/c676587025.shtml"}, {"id": "4344209", "title": "ETF两市成交额4397.89亿元", "content": "截至目前，ETF两市成交额报4397.89亿元，分类型来看，股票型ETF成交额1215亿元，债券型ETF成交额2524.99亿元，货币型ETF成交额181.94亿元，商品型ETF成交额58.67亿元，QDII型ETF成交额261.11亿元。其中，成交额最高的非货币型ETF分别是沪深300ETF（510300）中韩半导体ETF（513310）科创50ETF（588000）成交额分别为：64.65亿元44.02亿元43.57亿元", "ctime": 1778470308, "time_str": "11:31:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260511/c676587019.shtml"}, {"id": "4344205", "title": "ETF午评：中韩半导体ETF领涨8.94%，黄金股ETF领跌2.46%", "content": "ETF午间收盘涨跌不一，中韩半导体ETF（513310）领涨8.94%，半导体设备ETF（159327）涨8.17%，半导体设备ETF（159516）涨8.07%，黄金股ETF（517520）领跌2.46%，黄金股ETF（517400）跌2.41%，黄金股ETF（159562）跌2.39%。", "ctime": 1778470269, "time_str": "11:31:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260511/c676587004.shtml"}, {"id": "4344203", "title": "股指期货早盘收盘 主力合约全线上涨", "content": "股指期货早盘收盘，主力合约全线上涨。沪深300股指期货(IF)主力合约涨1.45%，上证50股指期货(IH)主力合约涨0.98%，中证500股指期货(IC)主力合约涨1.90%，中证1000股指期货(IM)主力合约涨1.58%。", "ctime": 1778470255, "time_str": "11:30:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260511/c676587003.shtml"}, {"id": // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
