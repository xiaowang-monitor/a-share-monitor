const NEWS     = [{"id": "4643991", "title": "华亚智能：实控人持股比例被动稀释0.99%至46.85%", "content": "华亚智能公告，因公司可转债转股使总股本增加，实际控制人及一致行动人持股数量未变情况下持股比例被动稀释。2026年6月26日至2026年7月1日期间，“华亚转债”累计有89.31万张转股，转股数量292.99万股，公司总股本由1.38亿股增至1.41亿股。实际控制人及一致行动人持股比例由47.84%变更为46.85%，被动稀释0.99%，触及1%整数倍。本次变动不涉及持股数量变化，不影响公司控制权。", "ctime": 1782987148, "time_str": "18:12:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260702/c677904514.shtml"}, {"id": "4643985", "title": "祥源新材：公司压阻/压电发泡材料尚处送样验证阶段，未形成实质性销售", "content": "祥源新材公告，公司股票于2026年6月30日、7月1日、7月2日连续三个交易日收盘价格涨幅累计偏离超过30%，属于股票交易异常波动。经公司自查，公司目前经营正常，内外部环境未发生重大变化，不存在应披露而未披露的重大事项。公司特别提示，其生产的用于机器人压阻传感器和压电传感器的压阻发泡材料（PU）、压电发泡材料（IXPP）目前仅处于送样验证阶段，暂未形成实质性销售，未来是否形成收入存在重大不确定性。", "ctime": 1782987116, "time_str": "18:11:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260702/c677904509.shtml"}, {"id": "4643973", "title": "北京君正：由于公司存储芯片持续在涨价 预计各季度毛利率会环比有所增长", "content": "北京君正发布投资者关系活动记录表公告，DRAM涨价比较多，一季度国内客户开始调价，二季度国内客户仍在继续涨价，同时海外客户也陆续开始调整价格，预计二季度收入和毛利率会继续增长；三季度价格会继续上调，四季度的价格政策要到三季度才能确定，不过目前看四季度供应仍然较为紧张，存在继续调价的可能性。随着客户用部分SRAM产品来代替DRAM方案，部分SRAM芯片二季度价格也有所上涨。NORFlash一、二季度都有涨价，涨价幅度总体来说比DRAM要小，NORFlash虽然产能也在趋紧，但比DRAM要好很多，一季度公司Flash产品线实现了很好的收入增长，其中销量的增长占比较大。三季度的价格是根据具体产品和具体客户情况确定的，不一定都会调价。由于公司存储芯片持续在涨价，预计各季度毛利率会环比有所增长。", "ctime": 1782986946, "time_str": "18:09:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260702/c677904419.shtml"}, {"id": "4643971", "title": "海航科技：截至2026年6月30日已累计回购479.54万元股份", "content": "海航科技公告，公司此前披露拟以9000万元至1.8亿元回购股份，用于员工持股计划或股权激励，回购价格上限不超过5.27元/股。截至2026年6月30日，公司已累计回购股份161.91万股，占总股本0.06%，成交最高价3.06元/股，最低价2.82元/股，已支付资金总额479.54万元（不含交易费用）。", "ctime": 1782986928, "time_str": "18:08:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260702/c677904417.shtml"}, {"id": "4643951", "title": "Meta出租算力类似以旧养新 而不是停止追逐高端算力", "content": "分析称，Meta正在筹划开展出租算力的云计算业务：一类是把部署在自身AI基础设施上的模型能力开放给外部客户，另一类是出租更底层的“裸算力”。但目前看，真实情况更倾向于是：Meta在把存量老旧算力做现金流回收，而不是停止追逐高端算力。6月中下旬，Meta被报道已与Crusoe签约，拟从Texas和Missouri州的两个数据中心获取合计约1.6GW的AI计算容量。同时，Meta 26Q1仍把全年资本开支指引上调到1250-1450亿美元。两件事放在一起看，更像是不同代际、不同用途的资源再配置：继续买新卡训练前沿模型，但旧卡（如H系列）用于推理大流量产品、托管外部模型等应用场景的，可以接受出租一部分，但这并不代表会放缓购买最紧缺的高端卡。", "ctime": 1782986776, "time_str": "18:06:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260702/c677904334.shtml"}, {"id": "4643943", "title": "东鹏饮料：截至2026年6月末已回购712.26万股，金额10.39亿元", "content": "东鹏饮料公告，公司于2026年4月1日及4月29日审议通过回购方案，拟以不低于10亿元且不超过20亿元回购A股股份，回购价格上限原为248元/股，因权益分派调整为188.85元/股，回购股份用于注销及员工持股或股权激励。截至2026年6月30日，公司已累计回购A股股份712.26万股，占总股本0.9701%，成交最高价154.9元/股，最低价134.2元/股，成交总金额10.39亿元（不含交易费用）。", "ctime": 1782986730, "time_str": "18:05:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260702/c677904291.shtml"}, {"id": "4643935", "title": "永和股份：预计2026年上半年净利润同比增长69.51%到102.68%", "content": "永和股份公告，预计2026年上半年净利润为4.6亿元到5.5亿元，同比增长69.51%到102.68%。报告期内，制冷剂行业受配额管理政策约束，供给端有序收紧，同时下游需求端持续回暖，整体供需格局进一步优化，市场竞争秩序持续改善，主要制冷剂产品价格维持高位运行。公司积极把握行业景气机遇，充分发挥产业链一体化优势，科学统筹生产排布与市场销售节奏，实现制冷剂板块营收与毛利的稳步提升。", "ctime": 1782986665, "time_str": "18:04:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260702/c677904255.shtml"}, {"id": "4643931", "title": "浙江自然：2025年年度利润分配拟向全体股东每10股派发现金红利1.42元（含税）", "content": "浙江自然公告，2025年年度利润分配拟向全体股东每10股派发现金红利1.42元（含税）不变，拟发放现金红利总额由2008.99万元（含税）调整为2000.02万元（含税）。", "ctime": 1782986654, "time_str": "18:04:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260702/c677904252.shtml"}, {"id": "4643923", "title": "吉祥航空：东航产投持股比例被动增加至12.00%", "content": "吉祥航空公告，公司回购注销股份已于2026年7月3日完成，总股本由21.84亿股变更为21.69亿股。持股5%以上股东东方航空产业投资有限公司在股份数量不变的情况下，持股比例由11.92%被动增加至12.00%，触及1%整数倍情形。本次权益变动不会导致公司控股股东及实际控制人发生变化。", "ctime": 1782986601, "time_str": "18:03:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260702/c677904230.shtml"}, {"id": "4643851", "title": "北约峰会将讨论防务承诺落实情况，美称峰会将“非常成功”", "content": "北约峰会定于7月7日至8日在土耳其首都安卡拉举行。美方官员单方定调称峰会将会“非常成功”，但事实上美欧在北约防务问题上面临诸多分歧。美方近期一直要求欧洲盟友补齐北约防务计划中美国留下的空档，但分析称欧洲国家填补这一空档面临不小挑战。与此同时，美国总统特朗普继续敲打欧洲盟友，要求后者增加防务开支，并点名批评西班牙“表现不好”。峰会未开已“成功”，美国常驻北约代表马修·惠特克7月1日在线上记者会上告诉媒体记者：“我们今年准备举行一次非常成功的峰会，因为去年（峰会成果）是前所未有的，而且意义重大。”北约去年6月在荷兰海牙举行峰会，北约秘书长吕特为特朗普“量身定做”峰会议程，成功让特朗普继续维持对这一军事联盟所作承诺。北约32个成员国最终承诺到2035年把各自防务开支占国内生产总值(GDP)的比重提升至5%。（新华社）", "ctime": 1782986305, "time_str": "17:58:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260702/c677903841.shtml"}, {"id": "4643839", "title": "牧原股份：80亿元债务融资工具获准注册", "content": "牧原股份公告，公司于近日收到中国银行间市场交易商协会下发的《接受注册通知书》，同意接受公司债务融资工具注册。本次债务融资工具注册金额为80亿元，注册额度自通知书落款之日起2年内有效，由中信银行、招商银行、兴业银行、交通银行和中国民生银行联席主承销。在注册有效期内，公司可分期发行超短期融资券、短期融资券、中期票据、永续票据。公司此前于2026年3月27日及5月13日分别召开董事会及股东会审议通过了相关授权议案。", "ctime": 1782986197, "time_str": "17:56:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260702/c677903794.shtml"}, {"id": "4643837", "title": "美诺华：股票交易异常波动，拟投资项目部分尚处立项阶段", "content": "美诺华公告，公司股票于2026年7月1日、7月2日连续两个交易日收盘价格涨幅偏离值累计超过20%，属于股票交易异常波动。经公司自查并向控股股东、实际控制人书面函证核实，截至公告日，公司、控股股东及实际控制人不存在应披露而未披露的重大信息，生产经营正常，主营业务未发生重大变化。公司于2026年7月2日披露的对外投资项目中，“高活性制剂及难溶性药物高端研发项目”涉及的覆盖心衰、降脂类等药物，以及聚焦前列腺癌、肺癌等靶向药，目前均处于立项或立项准备工作阶段，尚未进入实质性研发，后续工作尚需较长时间，存在较大不确定性。", "ctime": 1782986186, "time_str": "17:56:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260702/c677903791.shtml"}, {"id": "4643823", "title": "亚威股份：向特定对象发行股票已获注册批复，发行承销总结已备案通过", "content": "亚威股份公告，公司股票交易价格连续2个交易日（2026年7月1日、2日）收盘价格涨幅偏离值累计超过20%，属于异常波动。经公司自查及向相关方核实，公司前期披露信息无需更正补充，近期公共传媒无未公开重大信息，经营情况无重大变化。公司前期披露的向特定对象发行股票申请已通过深交所审核并获证监会注册批复，当前发行承销总结及相关文件已在深交所备案通过，公司将尽快办理新增股份登记事宜。除上述事项外，公司不存在应披露而未披露的重大事项。", "ctime": 1782986073, "time_str": "17:54:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260702/c677903653.shtml"}, {"id": "4643821", "title": "雷赛智能：股票交易异常波动，公司对2026年半年度业绩预告进行补充说明", "content": "雷赛智能公告，公司股票于2026年6月30日、7月1日、7月2日连续三个交易日收盘价格涨幅偏离值累计超过20%，属于股票交易异常波动情形。经公司自查及向控股股东、实际控制人核实，公司2026年7月2日披露的《2026年半年度业绩预告》存在补充之处，公司已于7月3日披露了补充说明公告；近期公司经营情况及内外部经营环境未发生重大变化，不存在应披露而未披露的重大事项。", "ctime": 1782986067, "time_str": "17:54:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260702/c677903651.shtml"}, {"id": "4643819", "title": "全球首份大语言模型安全防范能力测评报告发布", "content": "7月2日，在2026全球数字经济大会云智算安全论坛上，《全球大语言模型安全防范能力测评报告（2026）》正式发布，据介绍，该报告是全球首份大语言模型科技安全专项测评报告，以313条科技类高风险问题为测试集，报告显示，多数模型具备基础拒答能力，直接攻击总体成功率为7.6%，但在前缀注入、场景伪装、情感伪装，以及伪装与示例诱导结合的复合攻击下，部分模型的安全边界明显承压。（科创板日报）", "ctime": 1782986062, "time_str": "17:54:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260702/c677903647.shtml"}, {"id": "4643807", "title": "天和防务：向特定对象发行股票申请获得审核通过", "content": "天和防务公告，公司于2026年7月2日收到深圳证券交易所上市审核中心出具的审核中心意见告知函，对公司向特定对象发行股票的申请文件进行了审核，认为公司符合发行条件、上市条件和信息披露要求。后续深交所将按规定报中国证券监督管理委员会履行相关注册程序。公司本次向特定对象发行股票事项尚需获得中国证监会同意注册后方可实施，最终能否获得中国证监会同意注册的决定及其时间尚存在不确定性。", "ctime": 1782985942, "time_str": "17:52:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260702/c677903597.shtml"}, {"id": "4643805", "title": "璞泰来：控股子公司嘉拓智能北交所上市申请获受理后申请中止审核", "content": "璞泰来公告，公司此前审议通过控股子公司嘉拓智能申请向不特定合格投资者公开发行股票并在北交所上市的议案。嘉拓智能于2026年6月26日向北交所报送申报材料，2026年6月30日北交所正式受理其申请。同日，嘉拓智能向北交所提交中止审核申请，北交所于2026年6月30日同意该申请。", "ctime": 1782985936, "time_str": "17:52:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260702/c677903594.shtml"}, {"id": "4643803", "title": "水利部对三省份启动洪水防御Ⅳ级应急响应", "content": "记者从水利部获悉，水利部2日对广东、广西、海南三省份启动洪水防御Ⅳ级应急响应，并派出工作组赴海南省防御一线协助指导。记者了解到，受南海热带低压（可能发展成为台风）影响，7月3日至6日，华南大部及湖南、贵州南部、云南东部等地将有一次强降雨过程，以大到暴雨为主，其中海南、广东、广西等地部分地区将有大暴雨。受降雨影响，珠江流域片海南昌化江南渡江、西江上中游干流及支流郁江柳江桂江、粤西桂南沿海诸河，长江流域洞庭湖水系沅江、资水等河流将出现明显涨水过程；海南昌化江支流通什水、广东西江支流罗定江、广西红水河支流都乐河、贵州柳江支流龙江、湖南沅江支流酉水、云南南盘江支流巴江等中小河流可能发生超警以上洪水。（新华社）", "ctime": 1782985919, "time_str": "17:51:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260702/c677903584.shtml"}, {"id": "4643801", "title": "中元股份：向特定对象发行股票申请获深交所审核通过", "content": "中元股份公告，公司于2026年7月2日收到深圳证券交易所上市审核中心出具的《关于武汉中元华电科技股份有限公司申请向特定对象发行股票的审核中心意见告知函》。深交所发行上市审核机构对公司向特定对象发行股票的申请文件进行了审核，认为公司符合发行条件、上市条件和信息披露要求，后续深交所将按规定报中国证券监督管理委员会履行相关注册程序。公司本次向特定对象发行股票尚需经中国证监会同意注册后方可实施。", "ctime": 1782985917, "time_str": "17:51:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260702/c677903583.shtml"}, {"id": "4643797", "title": "天沃科技：选举姚丹花为董事长，聘任辛炜为副总经理", "content": "天沃科技公告，公司第四届董事会第八十三次会议审议通过选举姚丹花女士为董事长，任期自本次董事会审议通过之日起至本届董事会届满之日止。同时，董事会同意聘任辛炜先生担任公司副总经理，任期自本次董事会审议通过之日起至本届董事会期满换届为止。会议还调整了董事会专门委员会委员组成。", "ctime": 1782985845, "time_str": "17:50:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260702/c677903553.shtml"}, {"id": "4643795", "title": "正泰电源：放弃子公司股权优先购买权", "content": "正泰电源公告，公司全资子公司常熟通润装备发展有限公司分别持有江苏通润工具箱柜有限公司、常熟市通润机电设备制造有限公司、常熟市天狼机械设备制造有限公司各70%股权。新余市大森企业管理有限公司、新余市渝水区和润企业管理有限公司、新余市常银企业管理有限公司拟将分别持有的工具箱柜30%股权、通润机电30%股权、天狼机械30%股权转让予常熟市韵通企业管理有限公司。此次股权转让总价为5948.55万元，公司子公司装备发展放弃优先购买权。", "cti ，确认AI资本开支仍在扩张周期。应用材料、泛林半导体等设备龙头的订单数据同样验证了设备端的强劲需求，先进制程扩产正在从规划阶段进入实际采购阶段，设备交付周期延长进一步印证了供需紧平衡格局。（财联社）", "ctime": 1782985588, "time_str": "17:46:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260702/c677903435.shtml"}, {"id": "4643777", "title": "银河微电：股价异动，拟发行股份购买恒泰柯半导体100%股权", "content": "银河微电公告，公司股票于2026年7月1日、7月2日连续2个交易日内收盘价格涨幅偏离值累计达到30%，属于股票交易异常波动。经公司自查及向控股股东、实际控制人核实，公司生产经营正常，内外部经营环境未发生重大变化，不存在应披露而未披露的重大信息。公司已于2026年6月29日披露发行股份购买资产并募集配套资金预案，拟通过发行股份方式购买恒泰柯半导体（上海）有限公司100%股权并募集配套资金。本次交易预计不构成重大资产重组，构成关联交易。目前标的资产的审计、评估及尽职调查工作尚未完成，最终交易价格尚未确定，交易尚需公司董事会、股东会审议通过，并需上交所审核及证监会同意注册后方可实施。截至2026年7月2日，公司股票收盘价80元/股，滚动市盈率108.95倍，显著高于行业平均市盈率67.91倍。", "ctime": 1782985550, "time_str": "17:45:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260702/c677903419.shtml"}, {"id": "4643761", "title": "华海药业：重酒石酸间羟胺注射液获药品注册证书，2025年市场销售约4.04亿元", "content": "华海药业公告，公司于近日收到国家药品监督管理局核准签发的重酒石酸间羟胺注射液的《药品注册证书》，该药品规格为1ml:10mg，注册分类为化学药品3类。重酒石酸间羟胺注射液用于防治椎管内阻滞麻醉时发生的急性低血压、出血或休克等所致的低血压。根据米内网数据预测，该药品2025年国内市场销售金额约人民币4.04亿元。本次获批视同通过一致性评价，进一步丰富了公司产品线。", "ctime": 1782985487, "time_str": "17:44:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260702/c677903389.shtml"}, {"id": "4643757", "title": "国有大行5年期个人大额存单“再现江湖”  年化利率1.6%", "content": "尽管近两年来，主流国有大行、股份行均已经不再发行3年期以上的大额存单。但刚刚步入下半年，就有国有大行重新“上货”。7月1日，中国银行在官网发布公告称，该行将发售2024年第一期个人大额存单，包括1个月、3个月、6个月、1年、2年、3年、5年共计七个期限。由于目前市场上全国性商业银行发行的长期限大额存单已基本绝迹。本次中国银行发行的大额存单，也意味着来自国有大行的5年期大额存单产品“再现江湖”。 (财联社)", "ctime": 1782985432, "time_str": "17:43:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260702/c677903367.shtml"}, {"id": "4643751", "title": "同飞股份：向特定对象发行股票申请获深交所审核通过", "content": "同飞股份公告，公司于2026年7月2日收到深交所上市审核中心出具的《关于三河同飞制冷股份有限公司申请向特定对象发行股票的审核中心意见告知函》，深交所发行上市审核机构认为公司符合发行条件、上市条件和信息披露要求，后续深交所将按规定报中国证监会履行相关注册程序。公司本次向特定对象发行股票事项尚需获得中国证监会同意注册后方可实施，最终能否获得同意注册及其时间尚存在不确定性。", "ctime": 1782985389, "time_str": "17:43:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260702/c677903357.shtml"}, {"id": "4643745", "title": "金财互联：6票同意选举杨墨为董事长，变更法定代表人", "content": "金财互联公告，公司第七届董事会第五次会议以6票同意、0票反对、0票弃权审议通过了《关于选举公司董事长暨变更法定代表人的议案》，选举杨墨为公司第七届董事会董事长，并将法定代表人变更为杨墨，朱小军因工作调整辞去董事、董事长等职务。同时，会议以6票同意审议通过《关于补选公司第七届董事会非独立董事的议案》，提名史有森为非独立董事候选人，该议案尚需提交2026年第二次临时股东会审议。董事会还决议于2026年7月20日召开2026年第二次临时股东会。", "ctime": 1782985381, "time_str": "17:43:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260702/c677903353.shtml"}, {"id": "4643743", "title": "华津国际控股：下属公司出现52笔股权司法冻结", "content": "华津国际控股公告，公司自愿披露本集团若干中国内地附属公司股权遭司法冻结事宜。经全面核查，本集团合计出现52笔股权司法冻结记录，涉及华汇控股有限公司持有的江门市华津金属制品有限公司等8家标的附属公司，冻结均由外部第三方债权人因到期未偿款项向法院申请财产保全所致。所有冻结仅适用于下层内地附属公司所持股权，不涉及本公司于联交所上市股份。董事会认为该事宜目前不构成内幕消息，受影响附属公司维持正常营运。", "ctime": 1782985376, "time_str": "17:42:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260702/c677903351.shtml"}, {"id": "4643737", "title": "金山云加速GPU算力建设：小米百亿预算落地，阿里签五年数十亿长约", "content": "7月2日，记者获悉，金山云下半年将加速GPU算力集群建设，以满足头部客户爆发式增长的算力需求。其中，小米对金山云的GPU算力需求已从万卡集群升级为超大规模算力集群，相关投入预算由最初的近40亿元增至百亿元以上。另外，阿里大模型团队已与金山云签署了5年期的算力租赁合同，涉及3000余台八卡GPU服务器，按签约时月租价格测算，全部交付后月流水约3亿元，年化收入超过40亿元。界面新闻就此向金山小米和阿里求证，对方暂无回应。（界面新闻）", "ctime": 1782985273, "time_str": "17:41:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260702/c677903308.shtml"}, {"id": "4643719", "title": "中国中冶：截至6月末已累计回购A股约2.59亿元", "content": "中国中冶公告，截至2026年6月30日，公司通过集中竞价交易方式累计回购A股股份8573.16万股，占公司总股本（H股回购股份注销后）的0.4143%，成交最高价3.25元/股，最低价2.78元/股，成交总金额2.59亿元（不含交易费用）。公司A股回购方案计划回购金额不低于10亿元且不超过20亿元，回购价格上 // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>

}

      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
