": "4839837", "title": "7月以来极端天气影响的受灾用户已全部恢复供电", "content": "记者从国家能源局今天举行的新闻发布会上了解到，7月以来，受台风“巴威”“美莎克”“红霞”及强对流天气影响，浙江、广西、广东等地区部分输配电线路停运，累计造成800余万户用户停电。电力行业提前部署应急物资和抢修力量，第一时间抢修复电。截至目前，受灾用户现已全部恢复供电。（央视新闻）", "ctime": 1785390875, "time_str": "13:54:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260730/c678548123.shtml"}, {"id": "4839795", "title": "摩根大通将Meta Platforms目标价从725美元下调至640美元", "content": "摩根大通将Meta Platforms目标价从725美元下调至640美元。", "ctime": 1785390675, "time_str": "13:51:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260730/c678548090.shtml"}, {"id": "4839767", "title": "首创期货：波斯湾战火重燃与供应收紧共振，油价暴涨近7%", "content": "布伦特原油期货价格暴涨超7%。从消息面来看，推动油价暴涨的核心因素来自两个方面。首先，美伊停火正式宣告破裂，战火全面重燃。据央视新闻报道，伊朗于7月28日向位于约旦境内的一处美军基地发射多枚弹道导弹，均被美军成功拦截。伊朗伊斯兰革命卫队随后于7月29日发布公告，确认对位于约旦境内的美国空军基地和指挥中心实施了导弹打击。美国总统特朗普随即誓言对伊朗实施沉重打击，称“伊朗知道这一击在所难免，并请求美国不要发动打击”，但美国将“给他们一个教训”，并计划在相关法案中新增授权美国对伊朗征收关税的条款。地缘风险溢价正在强势回归。其次，美国原油库存超预期大幅下降，进一步印证了供应端的紧张格局。美国能源信息署数据显示，截至7月24日当周，美国商业原油库存量较前一周下降716.7万桶，降幅远超市场预期。战略石油储备也连续第18周下降，跌至1983年以来的最低点。短期建议观望为主，目前波动较大，谨慎操作。（首创期货）", "ctime": 1785390486, "time_str": "13:48:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260730/c678548051.shtml"}, {"id": "4839743", "title": "友达上半年营收1,399.2亿元台币，净利润1.996亿元台币，每股收益0.03元台币", "content": "友达上半年营收1,399.2亿元台币，净利润1.996亿元台币，每股收益0.03元台币。", "ctime": 1785390255, "time_str": "13:44:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260730/c678547959.shtml"}, {"id": "4839741", "title": "约旦称击落5枚伊朗导弹", "content": "约旦武装部队30日发表声明说，约旦防空系统当天凌晨拦截并击落了5枚来自伊朗的导弹。\n\n声明说，约旦防空系统进行高效和专业拦截，挫败了这一针对约旦的袭击，没有造成任何人员伤亡。武装部队将继续履行保护国家领空、维护国家安全和主权的职责，并保持最高级别戒备状态，坚决应对任何针对国家和公民安全的威胁。(新华社)", "ctime": 1785390220, "time_str": "13:43:40", "stock_code  "ctime": 1785388973, "time_str": "13:22:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260730/c678547681.shtml"}, {"id": "4839341", "title": "现货黄金失守4040美元/盎司", "content": "现货黄金失守4040美元/盎司，日内跌0.7%。", "ctime": 1785388730, "time_str": "13:18:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260730/c678547646.shtml"}, {"id": "4839273", "title": "日本开始第22轮核污染水排海", "content": "日本东京电力公司30日启动福岛第一核电站新一轮核污染水排海，这是本财年第4轮也是总计第22轮核污染水排海。据福岛当地媒体报道，当地时间30日11时28分（北京时间10时28分），东京电力公司开始本轮核污染水排海。根据东京电力公司28日发布的资料，本轮排海计划持续至8月17日，预计排放核污染水总量约7800吨，含放射性氚总量约1.3万亿贝克勒尔。2023年8月，日方无视国际社会的强烈质疑和反对，单方面强行启动福岛第一核电站核污染水排海。截至本月24日，共进行了21次核污染水排放，累计排放量约16.5万吨。（新华社）", "ctime": 1785388436, "time_str": "13:13:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260730/c678547583.shtml"}, {"id": "4839207", "title": "现货白银失守57美元/盎司", "content": "现货白银失守57美元/盎司，日内跌1.04%。", "ctime": 1785388068, "time_str": "13:07:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260730/c678547528.shtml"}, {"id": "4839181", "title": "日本熊本地震已致30人死亡", "content": "日本首相高市早苗30日在非常灾害对策本部上表示，截至当地时间30日中午12时30分，包括正在调查的是否与灾害有关联死亡案例在内，熊本地震死亡人数升至30人。据中国地震台网正式测定，当地时间28日16时27分（北京时间15时27分），日本九州岛发生6.8级地震，震源深度10公里。（央视新闻）", "ctime": 1785387992, "time_str": "13:06:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260730/c678547516.shtml"}, {"id": "4839133", "title": "长春都市圈环线高速公路全线贯通", "content": "记者从长春市交通运输局获悉，7月30日，长春都市圈西环高速公路正式通车，与东环高速公路形成闭合，至此，全长347公里的长春都市圈环线高速公路全线贯通，将为长春都市圈内城市互联互通、县域经济高质量发展提供有力支撑。据了解，长春都市圈环线高速公路（G9902）是国家高速公路网规划的重要组成部分。长春都市圈东环高速公路已于2024年11月通车，此次建成通车的西环高速公路路线全长143公里，采用双向四车道标准建设，设计时速120公里，并与长长、珲乌高速公路实现交通转换。（新华社）", "ctime": 1785387914, "time_str": "13:05:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260730/c678547429.shtml"}, {"id": "4839115", "title": "加速“能力出海”，深圳中基输出锂电装备制造硬实力", "content": "随着装备制造业向高端化、智能化、全球化纵深迈进，企业的系统集成、整线交付和全球化服务能力不断提升。深圳中基深耕锂电装备行业22年，始终坚持以工艺驱动装备创新，在长期研发与项目实践中，逐步构建起以“基础技术与应用技术”为支撑的核心技术体系。依托深圳、襄阳两大智能制造基地协同布局，公司形成从研发设计到调试验收的全流程制造能力，可以并行推进多个项目并实现高效交付。（新华社）", "ctime": 1785387904, "time_str": "13:05:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260730/c678547427.shtml"}, {"id": "4839063", "title": "北证50指数跌幅扩大至1%", "content": "北证50指数跌幅扩大至1%，现报1053.591点。", "ctime": 1785387820, "time_str": "13:03:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260730/c678547412.shtml"}, {"id": "4839023", "title": "沪深京三市成交额超1.5万亿元，较上日此时缩量299亿元", "content": "据同花顺iFinD数据，沪深京三市成交额超1.5万亿元，较上日此时缩量299亿元，预计全天成交金额约2.2万亿元。截至目前，沪市成交额6904亿元，深市成交额7999亿元，北证50成交额99亿元。", "ctime": 1785387775, "time_str": "13:02:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260730/c678547406.shtml"}, {"id": "4839013", "title": "深证成指跌4%", "content": "深证成指跌幅扩大至4%，上证指数跌1.35%，创业板指跌6.12%。", "ctime": 1785387674, "time_str": "13:01:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260730/c678547393.shtml"}, {"id": "4839009", "title": "中证500股指期货(IC)主力合约日内跌超4% 中证1000股指期货(IM)主力合约日内跌超3%", "content": "中证500股指期货(IC)主力合约日内跌超4%，现报7141.4点。中证1000股指期货(IM)主力合约日内跌超3%，现报6812.8点。", "ctime": 1785387615, "time_str": "13:00:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260730/c678547386.shtml"}, {"id": "4839005", "title": "阿联酋航空再次致歉", "content": "阿联酋航空今日发布针对7月22日搭乘EK302航班全体乘客的致歉信，就此次重大航班延误给出行计划带来的诸多不便深表歉意。公司称正主动联系受影响的乘客，提供相应补偿方案。同时也称对乘客因本次事件所产生的额外但合理的费用予以审核报销。7月22日阿联酋航空迪拜飞往上海的航班因遇上强雷雨天气备降杭州萧山机场，种种原因叠加导致机上373名旅客滞留机舱十几个小时，公司第二天发致歉信，并称网传边检不让旅客下飞机不属实。（第一财经）", "ctime": 1785387388, "time_str": "12:56:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260730/c678547353.shtml"}, {"id": "4839003", "title": "国家能源局：今年迎峰度夏电力供应总体平稳", "content": "记者从国家能源局今天举行的新闻发布会上了解到，今年迎峰度夏期间，全国用电负荷虽屡创历史新高，但总体上各地电力供应平稳。7月初以来，全国出现较大范围持续性高温天气。在经济运行持续向好与高温天气共同驱动下，多地用电需求持续旺盛增长，全国用电负荷三创历史新高，最高达15.53亿千瓦，较去年极值增长约4500万千瓦。6月以来，辽宁、江苏、湖北等15个省级电网用电负荷累计32次创新高。从电力供给看，当前全国各地电力供应形势总体平稳。国家能源局电力司副司长刘明阳介绍，与去年迎峰度夏相比，今年6月比去年6月全国新增发电装机约4亿千瓦，其中水电、气电、煤电等支撑性调节性电源新增装机1.1亿千瓦；今年度夏以来，电煤、天然气等一次能源供应充足，全国统调电厂存煤可用天数超过30天，处于历史较好水平，各类支撑性调节性电源应开尽开、稳发满发，全国电力供应保障形势平稳。刘明阳介绍，下一步，如遇大范围持续高温天气，预计全国最大用电负荷将可能达到16亿千瓦左右，较去年增长约9000万千瓦。国家能源局将会同有关方面，加强供需监测预警，统筹优化电力资源配置，持续筑牢电力安全生产防线，全力做好今年度夏能源电力保供工作。（央视新闻）", "ctime": 1785387356, "time_str": "12:55:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260730/c678547351.shtml"}, {"id": "4838989", "title": "截至6月底 全国投运新型储能装机1.53亿千瓦", "content": "记者从国家能源局今天举行的新闻发布会上了解到，今年以来，我国新型储能延续了良好的发展态势。截至6月底，全国已建成投运新型储能装机规模达1.53亿千瓦，同比增长61%。与此同时，上半年，我国新型储能利用小时数持续提升。（央视新闻）", "ctime": 1785387115, "time_str": "12:51:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260730/c678547333.shtml"}, {"id": "4838981", "title": "爱朋医疗：子公司完成收购注意力缺陷训练治疗软件 布局数字疗法领域", "content": "近日，爱朋医疗旗下子公司深圳朋睿脑科学技术有限公司完成对注意力缺陷训练治疗软件的收购，进一步布局数字疗法领域，完善ADHD（注意缺陷多动障碍）脑健康产品体系，加速构建软硬件融合创新模式。此次收购将进一步丰富朋睿脑科学ADHD产品布局，并与已有脑机相关技术形成协同。", "ctime": 1785387035, "time_str": "12:50:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260730/c678547323.shtml"}, {"id": "4838921", "title": "COMEX白银期货跌超1%", "content": "COMEX白银期货跌超1%，现报57.51美元/盎司。", "ctime": 1785386600, "time_str": "12:43:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260730/c678547247.shtml"}, {"id": "4838917", "title": "现货黄金失守4050美元/盎司", "content": "现货黄金失守4050美元/盎司，日内跌0.41%。", "ctime": 1785386574, "time_str": "12:42:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260730/c678547241.shtml"}, {"id": "4838907", "title": "法兴净利润超出预期 启动15亿欧元股份回购计划", "content": "法国兴业银行上调本年度盈利目标，并宣布实施15亿欧元（合17亿美元）股份回购计划，此前该行第二季度利润高于分析师预期。这家法国银行表示，目标将本年度有形股本回报率提升至约11%，高于此前设定的10%以上目标，同时计划加大成本压降力度。该行净利润同比增长23%，达到17.9亿欧元；市场分析师预期为15.9亿欧元。首席执行官斯拉沃米尔 克鲁帕于周四公告中表示：“营收增长叠加成本大幅下行，推动我们经营效率改善。良好经营态势显著提升集团盈利能力。”克鲁帕计划在9月公布最新战略规划。任职初期，他完成资本夯实、剥离部分业务板块，此后持续着力提升营收并加大股东回报。受控储蓄账户利率下调、成本管控成效推动法国本土零售银行业务回暖，但交易业务表现仍起伏不均。", "ctime": 1785386128, "time_str": "12:35:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260730/c678547135.shtml"}, {"id": "4838877", "title": "乌克兰克里沃伊罗格市遭弹道导弹袭击致6人死亡", "content": "乌克兰克里沃伊罗格市国防委员会主席亚历山大·维尔库尔30日在社交媒体发文称，当天凌晨，俄军发动的弹道导弹袭击已造成该市6人死亡，另有8人受伤。维尔库尔称，俄军从沃罗涅日州发射的一枚“伊斯坎德尔-M”弹道导弹击中了克里沃伊罗格郊区的私人住宅，造成2名儿童在内的6人死亡。维尔库尔称，救援工作仍在进行中，所有受伤人员均已获得必要救助。（新华社）", "ctime": 1785385820, "time_str": "12:30:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260730/c678547041.shtml"}, {"id": "4838853", "title": "机构：美联储缺乏利率行动短期内利好新兴市场", "content": "Capital XB执行董事Ajitabh Bharti表示，美联储缺乏决定性的利率行动，表明可能存在政治考量的因素。他在一份报告中称，在美国中期选举临近之际，人们认为美联储在短期内将稳定置于控制通胀之上。这种动态在短期内可能有利于印度等新兴市场。相对较弱的美元可能会缓解卢比的压力，并为资本流动和外部平衡提供一些喘息空间。然而，如果美国通胀因政策行动延迟而持续或重新加速，最终的修正可能会更加剧烈和具有破坏性，从而将波动性传导至包括印度在内的全球市场。", "ctime": 1785385399, "time_str": "12:23:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, " const META     = {"update_time": "2026-07-30 14:04:56", "sentiment_score": 56.33802816901408, "agents": []};

// 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

  const container = document.getElementById('hot7-list');

        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {

      { name: '情绪', val: p.sentiment, w: 25 },

      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },

    const miniBar = dims.map(d => {

      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
