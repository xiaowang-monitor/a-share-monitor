同比下降17.9%。日本游客海外消费2208亿日元，同比增长8.2%。 日本政府观光局此前发布的数据显示，4月访日外国游客人数同比减少5.5%。除中国内地游客人数大幅下降外，来自欧洲及中东地区的游客也明显减少。 分析人士认为，中东战事延宕导致部分国际航班停运，影响欧洲和中东地区游客赴日出行。此外，油价上涨推高航空燃油成本，多家航空公司上调燃油附加费，可能进一步抑制远程国际旅行需求，对日本旅游业构成压力。(新华社)", "ctime": 1780898732, "time_str": "14:05:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260608/c677287479.shtml"}, {"id": "4479759", "title": "南向资金净买入超60亿港元", "content": "据同花顺iFinD数据，截至目前，南向资金净买入超60亿港元，其中港股通（沪）买入超57.97亿港元，港股通（深）买入超2.37亿港元。", "ctime": 1780898517, "time_str": "14:01:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260608/c677287409.shtml"}, {"id": "4479553", "title": "韩国科斯达克（KOSDAQ）：熔断解除，恢复交易", "content": "韩国科斯达克（KOSDAQ）：熔断解除，恢复交易。", "ctime": 1780898286, "time_str": "13:58:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260608/c677287345.shtml"}, {"id": "4479551", "title": "安纳智芯完成新一轮数亿元融资", "content": "近日，成立仅半年的高精度现代模拟计算芯片公司——北京安纳智芯科技有限公司宣布完成新一轮数亿元融资，本轮由经纬创投领投，峰瑞资本、阿尔法公社跟投，老股东讯飞创投、中赢创投持续加码。安纳智芯开创性地建立了“现代模拟计算”这一新型计算范式——不再把矩阵方程拆解为一连串数字逻辑门执行的离散指令，而是把矩阵方程本身直接映射到物理电路中，由电压、电流、电导等物理量以类比的方式完成求解。（21世纪经济报道）", "ctime": 1780898231, "time_str": "13:57:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260608/c677287334.shtml"}, {"id": "4479501", "title": "国家发展改革委：统筹推进城市更新“硬投资”和“软建设”", "content": "在今天上午举行的国务院政策例行吹风会上，国家发展改革委相关负责人表示，“十五五”期间我国将继续加大对城市更新投资支持力度，统筹推进“硬投资”和“软建设”，将规划明确的主要目标和重点任务落实落细到群众可感可及的一个个具体项目上。据介绍，通过中央预算内投资，今年安排资金规模为970亿元，将惠及居民户数约800万户。同时，按照“两重”建设的工作部署，今年安排资金规模为1600亿元，比上一年增加250亿元。下一步，国家发展改革委将聚焦贯彻落实《城市更新“十五五”规划》，统筹推进“硬投资”和“软建设”。（央视新闻）", "ctime": 1780897750, "time_str": "13:49:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260608/c677287184.shtml"}, {"id": "4479497", "title": "首创期货：油价暴跌后小幅反弹", "content": "油价继续上涨，地缘政治风险明显加剧。从消息面来看，推动油价反弹的核心因素是伊朗与以色列再次爆发军事冲突。据伊朗伊斯兰共和国通讯社报道，伊朗伊斯兰革命卫队8日发表声明称，以色列使用空射弹道导弹对伊朗境内目标发动了袭击。此前，伊朗方面援引一名军事消息人士的话称，伊朗已做好应对以色列进一步行动的军事准备，并警告若局势升级将采取更大规模的打击行动。作为回应，伊朗当晚对以色列北部拉马特戴维空军基地实施弹道导弹打击。这是自美伊停火约两个月以来，伊朗首次直接攻击以色列。与此同时，黎以局势也在同步恶化。当地时间6月7日下午，以军空袭贝鲁特南郊，称其目标为黎巴嫩真主党一处指挥总部。此后，以色列国防军称监测到伊朗向以色列发射导弹，以色列北部多地拉响防空警报。美国总统特朗普随后呼吁伊朗就此收手，重返谈判桌，并表示会劝以方不要报复。伊朗武装部队哈塔姆安比亚中央司令部司令则警告，如以方进一步升级在黎巴嫩的军事行动，伊朗将对其实施更强烈的打击。美伊谈判尚未获得实质性进展，而战事再起，谈判困难重重，建议投资者观望为主。（首创期货）", "ctime": 1780897654, "time_str": "13:47:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260608/c677287130.shtml"}, {"id": "4479493", "title": "高德发布3D原生城市世界模型ABot-Earth0.5，已建成覆盖190多个国家和地区的3D地图", "content": "阿里巴巴集团旗下高德正式发布全球首个3D原生城市世界模型ABot-Earth0.5，该模型已建成全球覆盖面积最广的3D地图，遍及190多个国家和地区。其中模型输出的是可编辑的3DGS格式的素材，能够直接导入Unity、Unreal Engine等主流引擎进行交互开发。根据测算，ABot-Earth0.5的3D制图成本仅为传统方式的百分之一，效率却提升了约一千倍。这一突破不仅使高精度3D城市生成从“重资产”转变为“轻工具”，更有望为具身智能、低空经济等产业提供基础支撑。同时在应急救援场景中，ABot-Earth0.5的分钟级3D制图能力可快速还原灾祸现场三维环境，为指挥调度提供科学依据，为救援力量部署抢得宝贵时间。目前ABot-Earth0.5已正式开放内测体验，用户可前往官网abot-earth.amap.com提交测试申请，直观体验模型在3D城市生成上的表现。（科创板日报）", "ctime": 1780897619, "time_str": "13:46:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260608/c677287117.shtml"}, {"id": "4479491", "title": "倒计时一个月！交易所启动深化创业板改革交易机制全链路仿真测试", "content": "距7月6日《深圳证券交易所交易规则（2026年修订）》正式落地还有不到一个月，深交所技术备战悄然进入“临门一脚”的关键窗口。记者6月8日从业内独家获悉，深交所联合中国结算深圳分公司定于6月8日至6月12日在深市交易结算独立测试环境组织开展深化创业板改革交易机制相关业务仿真测试。据悉，本次测试的指向性极为明确—通过模拟深市各项交易业务的委托申报、成交回报、行情接收与展示、股份和资金清算交收等业务处理过程，对全市场参与各方的技术系统做一次“压力体检”，以确保改革正式切换时万无一失。(中证金牛座)", "ctime": 1780897563, "time_str": "13:46:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260608/c677287105.shtml"}, {"id": "4479485", "title": "广期所钯主力合约大跌7%", "content": "广期所钯主力合约大跌7%，报284.8元/克。", "ctime": 1780897550, "time_str": "13:45:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260608/c677287102.shtml"}, {"id": "4479481", "title": "山东墨龙成立石油科技公司，含海洋石油开采业务", "content": "企查查APP显示，近日，山东墨龙石油科技有限公司成立，注册资本1000万元，经营范围包含：海洋石油开采；海洋天然气开采；测绘服务；特种设备安装改造修理；金属与非金属矿产资源地质勘探等。企查查股权穿透显示，该公司由山东墨龙全资持股。（人民财讯）", "ctime": 1780897502, "time_str": "13:45:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260608/c677287083.shtml"}, {"id": "4479459", "title": "国债期货走弱 30年期主力合约跌超0.5%", "content": "国债期货走弱，30年期主力合约盘中跌0.50%，现报113.440元。10年期跌0.17%，现报109.035元。5年期跌0.12%，现报106.3元。2年期跌0.04%，现报102.59元。", "ctime": 1780897353, "time_str": "13:42:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260608/c677287035.shtml"}, {"id": "4479449", "title": "科创50指数跌幅扩大至5%，仅4只成分股上涨", "content": "科创50指数跌幅扩大至5%，翱捷科技、思特威、西部超导、天岳先进、佰维存储领跌。", "ctime": 1780897304, "time_str": "13:41:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260608/c677287023.shtml"}, {"id": "4479445", "title": "伊朗一能源设施遭以军空袭后疏散", "content": "据伊朗国家媒体报道称，今天（6月8日）早些时候遭到以军空袭后，位于胡齐斯坦省的马赫沙赫尔石油化工经济区正在进行疏散撤离。(CCTV国际时讯)", "ctime": 1780897280, "time_str": "13:41:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260608/c677287014.shtml"}, {"id": "4479441", "title": "创业板指跌4%", "content": "创业板指跌幅扩大至4%，上证指数跌2.15%，深证成指跌3.68%。", "ctime": 1780897232, "time_str": "13:40:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260608/c677287002.shtml"}, {"id": "4479425", "title": "富时中国A50指数期货跌超2%", "content": "富时中国A50指数期货跌超2%。", "ctime": 1780897163, "time_str": "13:39:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260608/c677286935.shtml"}, {"id": "4479415", "title": "韩国交易所启动韩国创业板指（KOSDAQ） 的熔断机制", "content": "韩国交易所启动韩国创业板指（KOSDAQ） 的熔断机制，因指数下跌8%，交易暂停20分钟。\n", "ctime": 1780897065, "time_str": "13:37:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260608/c677286907.shtml"}, {"id": "4479407", "title": "以色列调整全国民防措施，全国停课并限制聚集", "content": "当地时间6月8日，以色列后方司令部发布最新指示，因伊朗恢复向以色列发射导弹，以色列全国范围内自当地时间7日22时起至8日20时实施新的民防措施。根据指示，以色列全国所有教育活动暂停，包括学校、幼儿园、托儿机构及特殊教育机构等。聚集活动方面，户外聚集人数上限为200人，室内聚集上限为500人，前提是参与者能够在规定时间内进入标准防护空间。以色列后方司令部表示，民众可前往在规定时间内能够进入防护空间的工作场所。此外，根据最新指示，连接以色列和加沙地带的凯雷姆沙洛姆口岸也于8日起关闭，暂停向加沙地带运输货物。（央视新闻）", "ctime": 1780897039, "time_str": "13:37:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260608/c677286896.shtml"}, {"id": "4479389", "title": "凯瑞德等成立科技新公司，含AI及卫星相关业务", "content": "企查查APP显示，近日，中科智寻开矿科技（喀什）有限公司成立，经营范围包含：人工智能应用软件开发；卫星遥感应用系统集成；卫星导航服务；地理遥感信息服务；卫星遥感数据处理等。企查查股权穿透显示，该公司由凯瑞德等共同持股。（人民财讯）", "ctime": 1780897004, "time_str": "13:36:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260608/c677286889.shtml"}, {"id": "4479387", "title": "现货黄金失守4280美元/盎司 纽约期金失守4310美元/盎司", "content": "现货黄金失守4280美元/盎司，日内跌1.13%。纽约期金失守4310美元/盎司，日内跌1.29%。", "ctime": 1780896997, "time_str": "13:36:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260608/c677286887.shtml"}, {"id": "4479361", "title": "现货黄金失守4290美元/盎司 纽约期金失守4320美元/盎司", "content": "现货黄金失守4290美元/盎司，日内跌0.92%。纽约期金失守4320美元/盎司，日内跌1.24%。", "ctime": 1780896880, "time_str": "13:34:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260608/c677286864.shtml"}, {"id": "4479343", "title": "广东启动防汛Ⅳ级应急响应", "content": "广东省防汛防旱防风总指挥部6月8日10时启动防汛Ⅳ级应急响应。(新华社)", "ctime": 1780896819, "time_str": "13:33:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260608/c677286850.shtml"}, {"id": "4479331", "title": "美国旧金山机场实施停飞管制", "content": "美国联邦航空局当地时间6月7日晚发通告称，美国加利福尼亚州旧金山国际机场目前已启动停飞管制。通告未提供更多细节。(CCTV国际时讯)", "ctime": 1780896802, "time_str": "13:33:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260608/c677286827.shtml"}, {"id": "4479313", "title": "恒生科技指数跌幅扩大至3%", "content": "恒生科技指数跌幅扩大至3%，MINIMAX-W、百度集团-SW、华虹宏力跌幅居前。", "ctime": 1780896712, "time_str": "13:31:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260608/c677286804.shtml"}, {"id": "4479253", "title": "重庆30个区县出现暴雨 9条河流超警戒水位", "content": "记者从重庆市水文监测总站了解到，7日8时至8日8时，重庆市西部及东南部部分地区出现大到暴雨、局地大暴雨。受降雨影响，重庆市9条河流超警戒水位。重庆市两江新区、沙坪坝、九龙坡等30个区县出现暴雨，其中涪陵、九龙坡、南岸等15个区县出现大暴雨。最大日降雨量出现在重庆市酉阳县麻旺镇，为164.5毫米。受降雨影响，重庆市9条中小河流超警戒水位，其中6条河流超保证水位。截至8日9时，仍有1条河流超保。预计8日8时至9日8时，重庆市西部部分中小河流可能出现不同程度涨水过程，个别河流可能超警；9日8时至11日8时，重庆市中小河流水势基本平稳，无明显涨水过程。（新华社）", "ctime": 1780896603, "time_str": "13:30:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260608/c677286765.shtml"}, {"id": "4479251", "title": "文化传媒板块局部拉升，新华传媒直线涨停", "content": "文化传媒板块局部拉升，新华传媒直线涨停，凡拓数创、天娱数科此前涨停，流金科技、粤传媒、荣信文化跟涨。", "ctime": 1780896600, "time_str": "13:30:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260608/c677286764.shtml"}, {"id": "4479249", "title": "智飞生物控股子公司宸安生物上海创新孵化中心正式揭牌", "content": "6月8日上午，智飞生物控股子公司重庆宸安生物上海创新孵化中心（简称“宸安创新中心”）在上海浦东新区医谷PLUS正式揭牌。宸安创新中心将聚焦降糖、减重、代谢障碍相关脂肪肝炎（MASH）等重大疾病领域，定向开展创新药物研发攻关。（人民财讯）", "ctime": 1780896579, "time_str": "13:29:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260608/c677286762.shtml"}, {"id": "4479211", "title": "陈博远担任智源研究院中心负责人 主攻通用世界基座模型", "content": "近日，22岁北京大学青年学者、逆矩阵创始人陈博远担任北京智源人工智能研究院行为世界模型创新中心负责人，向智源研究院院长王仲远汇报。据悉，该创新中心聚焦下一代通用世界基座模型的学术研究与前沿探索，旨在构建面向真实物理世界的通用基座模型。据悉，七年来，智源累计孵化加速了20+家具有核心技术能力的创新企业。（科创板日报）", "ctime": 1780896346, "time_str": "13:25:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260608/c677286713.shtml"}, {"id": "4479159", "title": "伊朗革命卫队称打击以色列空军基地", "content": "据伊朗媒体8日报道，伊朗伊斯兰革命卫队公共关系部门发表声明说，为回应以色列对伊朗境内雷达站发动的袭击，伊朗对以色列两处空军基地发起打击。(新华社)", "ctime": 1780895999, "time_str": "13:19:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260608/c677286601.shtml"}, {"id": "4479137", "title": "安徽省出台《“低空+”应用场景拓展工程行动方案》", "content": "日前，安徽省政府出台《“低空+”应用场景拓展工程行动方案》，提出拓展“低空+”应用场景，推进生产作业、低空运输、公共治理、低空消费等应用场景有序规范发展。方案将稳步推进低空物流发展作为重点任务，要求探索跨市及长三角区域低空物流网络建设。在确保安全、避免扰民的前提下，支持有条件的市开展邮件快件、工业零部件、校园外卖等无人机末端配送服务。到2028年，力争开通城市低空末端物流配送航线100条。安徽省邮政管理局表示，将以本方案出台为契机，结合行业“十五五”发展规划制定，做好与省低空经济发展等相关专项规划衔接，实施无人机应用升级工程，支持省内低空寄递物流网络建设，有序发展同城、跨市无人机寄递业务。（科创板日报）", "ctime": 1780895870, "time_str": "13:17:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260608/c677286565.shtml"}, {"id": "4479135", "title": "习近平出席金正恩举行的欢迎仪式", "content": "当地时间6月8日中午，朝鲜劳动党总书记、国务委员长金正恩在平壤金日成广场为中共中央总书记、国家主席习近平举行盛大欢迎仪式。 金日成广场正中悬挂着中朝两党两国最高领导人巨幅肖像，两旁以中朝双语书写的“朝中友谊万古长青”“牢不可破的朝中友谊团结万岁”标语格外醒目。两国国旗迎风飘展，欢迎人群兴高采烈、翘首以盼。 习近平和夫人彭丽媛乘车抵达时，马队骑兵列队迎接，军乐团奏欢迎曲。金正恩和夫人李雪主在广场迎接。习近平夫妇和金正恩夫妇分别同对方陪同人员握手致意。两党两国最高领导人共同登上检阅台，军乐团奏中朝两国国歌，鸣放礼炮21响。习近平在金正恩陪同下，检阅朝鲜人民军三军仪仗队，仪仗队员用朝语高呼“祝习近平同志身体健康”。此后，习近平同金正恩一起观看分列式。 平壤各界群众和少年儿童身着节日盛装，手持旗帜、鲜花和气球，高喊中朝友好口号， // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
