"title": "苹果接受三星明年一季度存储报价", "content": "9月15日，从产业链获悉，苹果已接受三星电子2027年一季度存储芯片报价：DRAM（动态随机存取存储器）接近2.0美元/Gb，NAND闪存接近0.33美元/Gb，较今年三季度报价上涨30%-40%。就此消息向苹果求证，截至发稿暂无回应。(界面新闻)", "ctime": 1789439638, "time_str": "10:33:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260915/c679915054.shtml"}, {"id": "5172867", "title": "银联总裁郭大勇履新上海黄金交易所党委书记", "content": "9月15日，郭大勇于9月14日上午被任命为上海黄金交易所党委书记，提名为上海黄金交易所理事长。郭大勇原为中国银联党委副书记、总裁、副董事长。在此之前，上海黄金交易所原理事长余文建已于今年7月出任中国人民银行上海总部党委副书记、主任、上海市分行行长兼国家外汇管理局上海市分局局长，由此上海黄金交易所理事长一职空缺，直至郭大勇此番接任。对于这一人事调整，外界并不意外，上海黄金交易所和中国银联均属央行系统的金融基础设施，此前也曾有中国银联总裁转任上海黄金交易所“一把手”的先例。(上海证券报)", "ctime": 1789439590, "time_str": "10:33:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260915/c679915024.shtml"}, {"id": "5172863", "title": "华为、赛力斯合作将调整为轻资产模式", "content": "记者今日从知情人士处获悉，华为、赛力斯的智选车合作模式将在本周进行调整，未来华为将采用轻资产的方式与赛力斯合作，产品、营销、销售、服务等方面将由华为主导，调整为赛力斯主导，华为赋能。此次调整，鸿蒙智行将聚焦资源，加速智界、享界、尊界、尚界品牌成功，从而进一步夯实鸿蒙智行的行业与市场地位。（财联社）", "ctime": 1789439538, "time_str": "10:32:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260915/c679915007.shtml"}, {"id": "5172847", "title": "国民技术：800G、1.6T光模块专用MCU已小批量出货", "content": "国民技术在互动易表示，公司面向800G/1.6T高速光模块的专用MCU已在部分客户实现小批量出货，但相关收入占公司整体营收比重仍较小。同时，公司表示，在CPO方面，现有技术储备可支持相关MCU的适配开发，但产品开发及落地计划尚未明确，目前该业务尚未产生收入。", "ctime": 1789439378, "time_str": "10:29:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260915/c679914929.shtml"}, {"id": "5172835", "title": "中国人保原党委委员、副总裁于泽被提起公诉", "content": "记者今天（15日）从最高人民检察院获悉，中国人民保险集团股份有限公司原党委委员、副总裁于泽涉嫌受贿一案，由国家监察委员会调查终结，移送检察机关审查起诉。经最高人民检察院交办，北京市人民检察院依法以涉嫌受贿罪对于泽作出逮捕决定。近日，北京市人民检察院第二分院已向北京市第二中级人民法院提起公诉。检察机关在审查起诉阶段，依法告知了被告人于泽享有的诉讼权利，并讯问了被告人，听取了辩护人的意见。检察机关起诉指控：被告人于泽利用担任太平保险有限公司天津分公司党委书记、总经理，太平保险有限公司市场总监，太平财产保险有限公司助理总经理，党委委员、副总经理，党委副书记、副总经理，党委书记、总经理，中国人民保险集团股份有限公司党委委员、副总裁兼任中国人民财产保险股份有限公司党委书记、总裁，人保信息科技有限公司董事长等职务上的便利，为他人谋取利益，非法收受他人财物，数额特别巨大，依法应当以受贿罪追究其刑事责任。 （央视新闻）", "ctime": 1789439202, "time_str": "10:26:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260915/c679914801.shtml"}, {"id": "5172829", "title": "滨化股份：丙烷、丁烷原料目前库存可满足正常生产", "content": "滨化股份在9月15日举行的2026年半年度业绩说明会上表示，公司丙烷、丁烷原料目前库存可满足正常生产。公司通过灵活的采购策略、库存管理及原料替代，在一定程度上对冲原料价格波动风险。公司正加速构建电子化学品产业矩阵，6N级高纯氯气、半导体用高端剥离液等电子化学品系列化项目稳步推进。（人民财讯）", "ctime": 1789439115, "time_str": "10:25:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260915/c679914744.shtml"}, {"id": "5172823", "title": "国家统计局：8月份国民经济运行总体平稳", "content": "据中国网，国家统计局新闻发言人付凌晖表示，总的来看，8月份国民经济运行总体平稳，延续动能向新、结构向优的发展态势。但也要看到，外部环境不利影响加深，国内供强需弱矛盾突出，部分企业生产经营困难，经济稳中向好的基础还需巩固。下阶段，要坚持以习近平新时代中国特色社会主义思想为指导，坚持稳中求进工作总基调，完整准确全面贯彻新发展理念，加快构建新发展格局，坚持深化改革开放，强化宏观政策调节，着力扩大内需，推进产业升级，增强发展动力、激发社会活力，推动经济持续向新向优向好发展。", "ctime": 1789439103, "time_str": "10:25:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260915/c679914730.shtml"}, {"id": "5172821", "title": "港股恒生科技指数涨幅达1%", "content": "港股恒生科技指数涨幅扩大至1%，恒生指数现跌0.25%。", "ctime": 1789439056, "time_str": "10:24:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260915/c679914709.shtml"}, {"id": "5172811", "title": "多只科创半导体设备ETF涨超5%", "content": "科创半导体ETF华泰柏瑞（588710）、 科创半导体ETF鹏华（589020）等多只科创半导体设备ETF与半导体设备ETF广发（560780）、半导体设备ETF易方达（159558）等多只半导体设备ETF涨超5%。科创半导体材料设备指数自8月18日起已跌17.26%。", "ctime": 1789438866, "time_str": "10:21:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260915/c679914522.shtml"}, {"id": "5172809", "title": "科创50指数涨幅扩大至3%", "content": "科创50指数涨幅扩大至3%，现报1574.54点。华海清科、寒武纪、盛美上海涨幅居前。", "ctime": 1789438847, "time_str": "10:20:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260915/c679914517.shtml"}, {"id": "5172807", "title": "国家能源局主要负责人会见秘鲁能源和矿业部部长", "content": "国家能源局消息，9月10日，中国国家能源局局长王宏志会见来华出席APEC能源部长会的秘鲁能源和矿业部部长吉列尔莫·新野，双方就油气、电力、可再生能源等领域合作交换意见。王宏志表示，中秘两国是全面战略伙伴，能源合作是双边务实合作的重要组成部分。近年来，在两国元首战略引领下，能源合作不断开花结果，为两国经济社会发展注入强劲动力。中方愿与秘能矿部积极落实好两国元首关于能源合作的重要部署，务实拓展可再生能源、新型电力系统、新型储能、绿色矿业等多元投资合作空间，促进能源低碳转型，实现优势互补，惠及两国民生发展。吉列尔莫·新野表示，秘鲁高度重视对华能源合作，正持续扩大能源领域对外开放，优化营商环境。秘能矿部愿全力支持两国企业深度对接，围绕油气、电力、可再生能源等领域进一步深化合作，推动双边能源合作绿色、多元、高质量发展。", "ctime": 1789438806, "time_str": "10:20:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260915/c679914495.shtml"}, {"id": "5172801", "title": "豆包二代手机仍采用端云协同的整体方案", "content": "关于豆包手机一代到二代“端云”分工的问题，记者从知情人士获悉，无论是之前的技术预览版，还是这次的消费者版，都采用的是端云协同方案。原则上豆包手机助手始终保持端侧处理优先，但受限于当前行业技术能力，对于必须依赖云端处理的复杂任务，会用最小化上云原则进行数据处理，目前端云协同的整体方案并没变。（科创板日报）", "ctime": 1789438741, "time_str": "10:19:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260915/c679914441.shtml"}, {"id": "5172791", "title": "半导体设备板块持续拉升，华海清科涨超10%", "content": "半导体设备板块持续拉升，华海清科涨超10%，屹唐股份、富创精密、拓荆科技、盛美上海跟涨。", "ctime": 1789438676, "time_str": "10:17:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260915/c679914348.shtml"}, {"id": "5172775", "title": "沙特多地发布紧急预警", "content": "沙特民防部门当地时间9月15日凌晨向延布、吉达、塔伊夫、艾卜哈和吉赞等多座城市发布紧急预警。近来也门冲突升级，也门胡塞武装和支持也门政府的沙特频繁互袭。（央视新闻）", "ctime": 1789438561, "time_str": "10:16:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260915/c679914242.shtml"}, {"id": "5172769", "title": "科创50指数涨幅扩大至2%", "content": "科创50指数涨幅扩大至2%，现报1558.94点。", "ctime": 1789438413, "time_str": "10:13:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260915/c679914138.shtml"}, {"id": "5172761", "title": "风电设备板块短线拉升，吉鑫科技涨停", "content": "风电设备板块短线拉升，吉鑫科技涨停，大金重工、天顺风能、天能重工、新强联、振宏股份等纷纷走高。", "ctime": 1789438360, "time_str": "10:12:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260915/c679914108.shtml"}, {"id": "5172753", "title": "两部门对海南启动国家自然灾害救助四级应急响应", "content": "9月15日，国家防减救灾委、应急管理部针对近期强降雨对海南造成的严重灾害影响，启动国家自然灾害救助四级应急响应，派出工作组紧急赶赴灾区实地查看灾情，指导和协助地方做好灾情核查、群众转移安置、基本生活保障等灾害救助工作。（新华社）", "ctime": 1789438311, "time_str": "10:11:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260915/c679914054.shtml"}, {"id": "5172747", "title": "李家超：香港首个五年规划和2026施政报告超10万字", "content": "香港特区行政长官李家超今日（15日）表示，明天他将在立法会公布香港首个五年规划并发表2026年施政报告，两份文件内容详实，总计超过10万字。明天他将会简明扼要地进行发布，计划在两到三个小时内完成。（大湾区之声）", "ctime": 1789438181, "time_str": "10:09:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260915/c679913968.shtml"}, {"id": "5172735", "title": "车百会研究院师建华：当前汽车产业呈六大新发展格局，2026年全年出口预计近1100万辆", "content": "车百会研究院副理事长师建华今日表示，当前国内汽车产业呈现国内“冷”、内需承压；海外“热”、打通双循环；市场“卷”、出清加速；新能源“主导”、新质生产力；创新“活跃”、安全高效经济；跨界“融合”、人工智能驱动生态重构等六大新发展格局。车百会研究院预计，2026年全年中国汽车出口将接近1100万辆。（财联社）", "ctime": 1789438024, "time_str": "10:07:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260915/c679913863.shtml"}, {"id": "5172711", "title": "国家统计局：8月全国服务业生产指数同比增长4.1%", "content": "国家统计局数据显示，8月份，全国服务业生产指数同比增长4.1%。分行业看，信息传输、软件和信息技术服务业，租赁和商务服务业，交通运输、仓储和邮政业生产指数同比分别增长9.6%、9.0%、4.8%。1—8月份，全国服务业生产指数同比增长4.7%。8月份，服务业商务活动指数为49.3%，服务业业务活动预期指数为55.5%。其中，邮政、电信广播电视及卫星传输服务 // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
