is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260821/c679170230.shtml"}, {"id": "5002201", "title": "埃夫特携手启智参展WRC 聚焦工业具身智能落地", "content": "8月19日至23日，2026世界机器人大会（WRC）在北京亦庄举办，机器人企业埃夫特携手启智联合参展，展出全栈自主可控的通用技术底座，以及复合机器人、智能焊接、智能喷涂等落地成果，以“底座 + 整机 + 工艺”全链路能力助力工业具身智能落地，交出从实验室技术到真实产线应用的埃夫特方案。埃夫特首席科学家陈翡表示，未来三到五年，埃夫特的投入可以概括成三件“接地气”的事：造更好的机器人、做机器人的安卓和鸿蒙、让机器人的使用更加便利。（新华社）", "ctime": 1787295189, "time_str": "14:53:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260821/c679170201.shtml"}, {"id": "5002197", "title": "广西海事局保持防台二级响应 3000总吨以下小型海船回港避风", "content": "南海低压进入北部湾后，今天（8月21日）呈现反复回旋态势，风力逐渐加大，可能在今晚升级为今年第19号台风“紫檀”。广西海事局持续保持防台二级响应不改变。广西海事部门在北部湾划定17个网格，船舶按大小分级分类管控，正在组织北海、钦州、防城港沿海辖区停泊、作业的3000吨级以上海船离开台风影响水域避台，在港避风的所有44艘3000总吨以下小型海船安排进入内港避风，应撤人员247人全部撤离。小型危险品船舶、加油船等全部妥善安排在港内安全水域避台。实施应急力量网格化预置，指定14艘海巡艇、44艘港作拖轮、4艘专业救助船、8艘大马力三用拖轮在船厂、锚地等重点防台水域应急待命。（央视新闻）", "ctime": 1787295138, "time_str": "14:52:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260821/c679170191.shtml"}, {"id": "5002185", "title": "港股大模型概念股拉升，MINIMAX-W涨超14%", "content": "港股大模型概念股拉升，MINIMAX-W涨超14%，智谱涨超10%。", "ctime": 1787295084, "time_str": "14:51:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260821/c679170172.shtml"}, {"id": "5002183", "title": "沙钢集团抚顺特钢公司与中国科学院金属研究所研制出半导体领域用超高纯不锈钢316LVV", "content": "沙钢集团抚顺特钢公司与中国科学院金属研究所成功研制出半导体领域用超高纯不锈钢316LVV，并已实现定制化生产，先后为国内10多家半导体设备企业供货。(人民财讯)", "ctime": 1787295001, "time_str": "14:50:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260821/c679170150.shtml"}, {"id": "5002171", "title": "中国援建乌兹别克斯坦风电项目竣工", "content": "中国援建乌兹别克斯坦恰尔瓦克风电项目20日在乌塔什干州博斯坦雷克区竣工。据悉，该项目是共建“一带一路”倡议下绿色能源合作的标杆工程，是我国在中亚地区落地的援外示范项目。(新华社)", "ctime": 1787294779, 球超低风速区域量身打造。机组切入风速低至2.5m/s，单位千瓦扫风面积达7.74平方米/kW，在4.5m/s超低风速条件下，年发电小时数可达1850小时。(人民财讯)", "ctime": 1787293383, "time_str": "14:23:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260821/c679169655.shtml"}, {"id": "5001949", "title": "港股恒生科技指数涨幅达1%", "content": "港股恒生科技指数涨幅扩大至1%，恒生指数现涨0.93%。", "ctime": 1787293338, "time_str": "14:22:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260821/c679169651.shtml"}, {"id": "5001933", "title": "韩国主要半导体设备商订单积压量预计比去年年底翻一番", "content": "据韩媒报道，韩国半导体设备行业受益于三星电子和SK海力士的大规模半导体设施投资，截至今年上半年末，该国主要设备企业的订单积压量预计比去年年底翻了一番。预计从今年下半年开始，销售额将大幅增长。 (科创板日报)", "ctime": 1787293113, "time_str": "14:18:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260821/c679169574.shtml"}, {"id": "5001927", "title": "国电电力在四子王旗成立风力发电公司", "content": "企查查APP显示，近日，国电电力（四子王旗）风力发电有限公司成立，法定代表人为白建国，注册资本为1000万元，经营范围包含：发电技术服务；风力发电技术服务；太阳能发电技术服务；储能技术服务；电气设备修理等。企查查股权穿透显示，该公司由国电电力间接全资持股。（人民财讯）", "ctime": 1787293007, "time_str": "14:16:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260821/c679169496.shtml"}, {"id": "5001925", "title": "众擎发布“仿人脑”具身智能引擎EngineAI Awaken", "content": "世界机器人大会WRC上，众擎正式发布“仿人脑”具身智能引擎EngineAI Awaken，通过融合WAM与VLA模型，机器人仅需2小时实机部署与微调训练，长程动作成功率即可超过98%，实现低样本条件下的高效泛化。这套架构与众擎全栈自研的力控关节、灵巧手在物理世界中实现深度整合，通过真实数据持续循环，驱动软硬件协同进化。（人民财讯）", "ctime": 1787292983, "time_str": "14:16:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260821/c679169486.shtml"}, {"id": "5001919", "title": "金宏气体等成立股权投资合伙企业", "content": "企查查APP显示，近日，苏州金硕筑壹股权投资合伙企业（有限合伙）成立，出资额约2亿元，经营范围包含：股权投资；以自有资金从事投资活动。企查查股权穿透显示，该合伙企业由金宏气体全资子公司苏州金宏润投资有限公司等共同持股。（人民财讯）", "ctime": 1787292894, "time_str": "14:14:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260821/c679169461.shtml"}, {"id": "5001917", "title": "广州工控集团到访金溢科技，探讨多维度合作路径", "content": "8月20日，广州工业投资控股集团有限公司一行到访深圳市金溢科技股份有限公司参观考察。金溢科技副总裁张翼率核心团队接待，双方围绕产业布局、核心能力与资源优势展开深度交流，聚焦汽车电子、智能网联、交能融合、机器人应用、低空智联、产业投资等领域，探讨多维度合作路径。此次到访为双方首次正式对接，旨在打通产业、技术、资本、市场对接通道。(人民财讯)", "ctime": 1787292850, "time_str": "14:14:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260821/c679169452.shtml"}, {"id": "5001907", "title": "财政部：未来五年将持续加大科技领域投入力度", "content": "国新办今天举行“开局起步‘十五五’”系列主题新闻发布会。针对媒体提出的“‘十五五’时期，如何发挥财政的引导撬动作用，助力我国科技自立自强”，财政部有关负责人表示，未来五年，中央财政将进一步加大投入力度，提升财政资金效能。据介绍，这些年，中央财政持续加大科技领域投入力度，强化政策供给，推动我国科技事业取得历史性成就、发生历史性变革。“十四五”时期，科技投入强度前所未有，带动作用显著增强。财政部综合司司长李先忠介绍，“十四五”时期，全国一般公共预算科技支出比“十三五”时期增长了33%，全社会研发经费投入保持年均10%的增长，2025年研发经费更是超过了3.9万亿，投入强度达到2.8%，首次超过经合组织国家的平均水平。“十五五”时期是科技强国建设的关键攻坚期。财政部将更加有力有效支持科技自强自立。（央视新闻）", "ctime": 1787292618, "time_str": "14:10:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260821/c679169372.shtml"}, {"id": "5001867", "title": "古鳌科技、图灵量子等成立创投合伙企业", "content": "企查查APP显示，近日，嘉兴叠域创业投资合伙企业（有限合伙）成立，经营范围包含：创业投资（限投资未上市企业）。企查查股权穿透显示，该企业由古鳌科技、上海图灵智算量子科技股份有限公司等共同出资。（人民财讯）", "ctime": 1787292361, "time_str": "14:06:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260821/c679169219.shtml"}, {"id": "5001543", "title": "上海自贸区临港新片区“十五五”期间实现GDP年均增长7.5%", "content": "今天，上海自贸区临港新片区发布“十五五”规划，全国首创性制度创新案例新增达70项，全社会研发经费占GDP比重保持在6%以上，实现GDP年均增长7.5%，率先开展离岸金融先行先试，推动数据跨境的负面清单和操作指引迭代扩容。（央视新闻）", "ctime": 1787291972, "time_str": "13:59:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260821/c679169126.shtml"}, {"id": "5001537", "title": "美媒称美军考虑将一在建航母改以特朗普命名", "content": "美国有线电视新闻网20日发表独家报道称，美国海军正着手为在建航母“多里斯·米勒”号改名，可能转而以现任美国总统特朗普命名。 报道援引3名消息人士的话称，自今年年初以来，美国海军一直在推进“多里斯·米勒”号航母的更名工作。其中两名消息人士透露，内部讨论提过将其改以特朗普命名。 报道说，美国海军内部目前已停用“多里斯·米勒”号这一叫法，仅用舰体编号“CVN-81”来称呼该航母。他们正在考虑以“多里斯·米勒”命名另一艘军舰。 报道写道，美国海军“面临尽快确定航母名称的压力”，因为该航母龙骨铺设仪式预计将于今年年底举行，那标志着航母建造进入重要阶段。 报道指出，美国多数现役航母都以历任美国总统命名，并且，这些航母都没有在其同名总统任内下水，“以现任总统名字命名一艘航母前所未有”。 美国防部就此事回应称，目前没有任何消息可以公布。 在特朗普第一个总统任期内，美国海军宣布将“CVN-81”航母命名为“多里斯·米勒”号，以纪念1941年珍珠港事件中使用机枪射击日军飞机的非裔士兵多里斯·米勒。该航母预计2034年交付。(新华社)", "ctime": 1787291933, "time_str": "13:58:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260821/c679169115.shtml"}, {"id": "5001531", "title": "现货黄金站上4550美元/盎司", "content": "现货黄金站上4550美元/盎司，日内涨0.73%。", "ctime": 1787291752, "time_str": "13:55:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260821/c679169076.shtml"}, {"id": "5001525", "title": "沪深京三市成交额超1.5万亿元，较上日此时缩量1759亿元", "content": "据同花顺iFinD数据，沪深京三市成交额超1.5万亿元，较上日此时缩量1759亿元，预计全天成交金额约1.8万亿元。截至目前，沪市成交额6996亿元，深市成交额7904亿元，北证50成交额101亿元。", "ctime": 1787291671, "time_str": "13:54:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260821/c679169063.shtml"}, {"id": "5001523", "title": "拉加经委会预计地区经济今年增长2.2%", "content": "联合国拉丁美洲和加勒比经济委员会（拉加经委会）20日在智利首都圣地亚哥发布年度经济研究报告，预计2026年拉美和加勒比地区经济增长2.2%，2027年将增长2.5%。报告说，全球经济增长势头减弱、地缘政治紧张加剧、金融市场波动和能源价格上涨等外部因素，拖累拉美和加勒比地区经济增长前景。投资不足、生产率增长乏力以及就业市场疲软，是制约地区经济增长的主要结构性因素。（新华社）", "ctime": 1787291662, "time_str": "13:54:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260821/c679169060.shtml"}, {"id": "5001517", "title": "中国华能集团董事长温枢刚与华为CEO任正非举行会谈", "content": "中国华能集团有限公司董事长温枢刚，总经理钟国东8月20日在深圳与华为技术有限公司CEO任正非举行会谈。任正非对温枢刚一行来访表示欢迎。他表示，中国发展人工智能具有两项重要基础优势：一是电力优势，二是电信网络优势。下一步 const META     = {"update_time": "2026-08-21 15:24:02", "sentiment_score": 52.35042735042735, "agents": []};

// 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
