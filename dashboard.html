 "", "url": "https://news.10jqka.com.cn/20260603/c677194810.shtml"}, {"id": "4455097", "title": "湖南裕能：宁德时代拟减持不超过3%股份", "content": "湖南裕能公告，持股5%以上股东宁德时代持有公司股份5984.61万股（占总股本7.10%），计划自减持计划披露之日起15个交易日后的三个月内（2026年6月26日至2026年9月25日），通过集中竞价、大宗交易方式合计减持不超过2530.02万股（占总股本3%）。减持原因为正常投资安排和资金管理需求，减持价格根据二级市场价格确定。", "ctime": 1780487292, "time_str": "19:48:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260603/c677194809.shtml"}, {"id": "4455079", "title": "和而泰：拟受让舟山云创投资5%财产份额，认缴出资5250万元", "content": "和而泰公告，公司与弘信创投签署财产份额转让协议，拟受让其持有的舟山云创智月创业投资合伙企业（有限合伙）5%的财产份额，对应认缴出资5250万元，实缴出资0万元，转让价格为0元。该合伙企业总认缴出资额为10.5亿元，公司作为有限合伙人以自有资金认缴上述份额，占认缴出资总额的5%。合伙企业为投资某科技公司设立的专项基金，存续期7年。本次交易不构成关联交易及重大资产重组，无需提交董事会和股东会审议。", "ctime": 1780487226, "time_str": "19:47:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260603/c677194783.shtml"}, {"id": "4455047", "title": "实益达：公司间接持有宇树科技约0.01%股权，持股比例较低", "content": "实益达公告，公司股票连续2个交易日（2026年6月2日、6月3日）收盘价格涨幅偏离值累计超过20%，属于股票交易异常波动。经自查及问询控股股东、实际控制人，公司前期披露信息无需更正补充，未发现公共传媒报道未公开重大信息，经营情况及内外部环境未发生重大变化，控股股东、实际控制人在异常波动期间未买卖公司股票，不存在应披露而未披露的重大事项。针对市场传闻公司间接投资宇树科技，公司说明如下：公司全资子公司持有浙江容腾创业投资合伙企业0.8333%股权，容腾持有宇树科技1.1868%股权，股权穿透后公司持有宇树科技约0.01%股权，持股比例较低；宇树科技科创板IPO申请已于2026年6月1日获上交所上市审核委员会审议通过，但公司持股比例较低，预计对当期主要财务指标影响较小；公司不涉及机器人业务。", "ctime": 1780486987, "time_str": "19:43:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260603/c677194724.shtml"}, {"id": "4455041", "title": "德力股份：拟定增募集不超8.18亿元，控股股东将变更为翼元航空", "content": "德力股份公告，公司拟向特定对象发行A股股票数量不超过1.09亿股，募集资金总额不超过8.18亿元。本次发行对象为辽宁翼元航空科技有限公司，发行价格为7.53元/股。翼元航空将成为公司控股股东，本次交易构成关联交易。", "ctime": 1780486934, "time_str": "19:42:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260603/c677194706.shtml"}, {"id": "4455031", "title": "江铃汽车：5月总产量34922辆、总销量32278辆", "content": "江铃汽车公告，2026年5月总产量34922辆，同比增长9.70%，总销量32278辆，同比增长5.98%；1—5月累计产量15.62万辆，同比增长13.18%，累计销量15.33万辆，同比增长11.92%。其中，5月轻型客车产量10396辆，同比增长26.58%，销量10463辆，同比增长33.92%；卡车产量6133辆，同比增长26.17%，销量5686辆，同比增长22.65%；皮卡产量5771辆，同比增长10.22%，销量5328辆，同比增长10.36%；SUV产量12622辆，同比下降6.66%，销量10801辆，同比下降18.06%。", "ctime": 1780486898, "time_str": "19:41:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260603/c677194702.shtml"}, {"id": "4455023", "title": "山科智能：股东拟合计转让5%股份给临昭投资，转让价14.86元/股", "content": "山科智能公告，公司股东李郁丰、杭州晟捷投资管理合伙企业（有限合伙）、杭州晟盈投资管理合伙企业（有限合伙）与嘉兴临昭股权投资合伙企业（有限合伙）签署《股份转让协议》，拟合计转让公司股份979.7万股（占公司总股本的5.00%），转让价格为14.86元/股，转让价款总额为1.46亿元。其中李郁丰转让204万股（占比1.04%），晟捷投资转让660万股（占比3.37%），晟盈投资转让115.7万股（占比0.59%）。本次协议转让完成后，临昭投资将成为公司持股5%以上股东。受让方承诺在协议转让完成后的12个月内不减持所持股份。本次协议转让事项尚需深圳证券交易所合规性确认后办理过户手续。", "ctime": 1780486846, "time_str": "19:40:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260603/c677194675.shtml"}, {"id": "4455011", "title": "ST恒信：控股股东解除质押并再质押0.53%股份", "content": "ST恒信公告，本次控股股东孟宪民解除质押股份320万股，占其持股5.12%、占公司总股本0.53%，起始日2026年5月22日，解除日期2026年6月2日；同日再质押320万股，占其持股5.12%、占公司总股本0.53%，质权人为王瑞，用于为他人融资担保；截至公告日，其累计质押6165.5万股，占其持股98.58%、占公司总股本10.19%。", "ctime": 1780486794, "time_str": "19:39:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260603/c677194596.shtml"}, {"id": "4455005", "title": "硅宝科技携光储充方案亮相SNEC年度展会", "content": "6月3日，硅宝科技官微发布消息，2026SNEC PV&ES Expo国际光伏储能大会开幕，硅宝携光储充新材料方案亮相。在储能和充放电领域，硅宝科技展品包括“填补国内外空白，处于国际先进水平”的有机硅轻量化电池密封材料等产品，光储充方案系硅宝未来发力点之一。（人民财讯）", "ctime": 1780486759, "time_str": "19:39:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260603/c677194588.shtml"}, {"id": "4454991", "title": "美国俄勒冈州海岸附近发生5.5级地震", "content": "据德国地球科学研究中心消息，当地时间6月3日，美国俄勒冈州海岸附近发生5.5级地震，地震深度10公里。（央视新闻）", "ctime": 1780486575, "time_str": "19:36:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260603/c677194534.shtml"}, {"id": "4454953", "title": "重庆市与中国南水北调集团签署战略合作协议", "content": "6月3日下午，重庆市人民政府与中国南水北调集团有限公司签署战略合作协议。重庆市委书记袁家军会见了中国南水北调集团党组书记、董事长汪安南一行并见证签约。袁家军说，希望中国南水北调集团发挥水网建设国家队、主力军优势，以此次签约为新起点，强化中央企业与地方双向赋能，与重庆持续深化重大水利项目投资、节水技术创新、智慧水网建设等方面务实合作，共同打造互利共赢标志性成果。（重庆日报）", "ctime": 1780486203, "time_str": "19:30:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260603/c677194251.shtml"}, {"id": "4454917", "title": "澳大利亚外长称反对以色列升级黎巴嫩局势", "content": "澳大利亚外交部长黄英贤3日接受澳大利亚广播公司采访时表示，澳反对以色列升级黎巴嫩局势，中东停火协议必须包括黎巴嫩。黄英贤说，澳大利亚在这一问题上的态度很清晰。“我们不支持局势升级。我们认为停火从一开始就应该将黎巴嫩包括在内。”黄英贤同时证实澳大利亚2日对以色列的3名个人和4个实体实施了金融制裁和旅行限制，以回应以色列定居者对约旦河西岸巴勒斯坦人的暴力升级。（新华社）", "ctime": 1780485863, "time_str": "19:24:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260603/c677194174.shtml"}, {"id": "4454911", "title": "比亚迪入局人形机器人", "content": "近日，比亚迪集团执行副总裁李柯在一档访谈节目中明确表示：“比亚迪也在开发（人形机器人）。机器人的竞争在于谁有最强的制造能力、软件能力和硬件能力，而汽车相关AI能力与机器人有同源性，如果有一天我们认为机器人可以走向家庭，就可以通过经销商网络售卖比亚迪的机器人。”她还表示，比亚迪可以做一个开放的平台，既可以是比亚迪自己做机器人，也可以是跟其他企业合作的机器人。6月3日，据接近比亚迪人士处消息，该公司确实已在研发人形机器人。（第一财经）", "ctime": 1780485847, "time_str": "19:24:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260603/c677194166.shtml"}, {"id": "4454875", "title": "豆包：对于广大用户日常使用的功能 将保持目前的免费服务", "content": "豆包发布说明称，一、针对专业人群的生产力需求，豆包计划推出豆包专业版，将包含软件开发、数据分析、专业设计、流程自动化、金融分析、科学研究等专业服务。二、对于广大用户日常使用的豆包功能，包含搜索问答、写作生图、以及语音和视频对话等，我们将保持目前的免费服务，保证用户使用体验和习惯不受影响。我们也会不断为免费用户提供新的模型、能力和更好的体验。专业版的服务，也将在一定额度内免费。三、豆包专业版目前还在测试阶段，正式上线时，我们会通过官方渠道发布完整信息。四、我们观察到，近期有大量同IP的营销号，集中发布内容完全一致的不实信息，称豆包将通过降低基础功能体验来推动用户购买会员。该说法完全不实。", "ctime": 1780485564, "time_str": "19:19:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260603/c677194092.shtml"}, {"id": "4454855", "title": "科大国创：控股股东合肥国创与智德龙腾终止协议转让5.00%公司股份", "content": "科大国创公告，公司控股股东合肥国创与智德龙腾原计划转让1461万股，占总股本5.00%，但双方已于2026年6月3日签署终止协议，股份转让事项取消。此次终止不会导致公司控股股东、实际控制人变更，也不会对公司治理结构、持续经营产生影响。", "ctime": 1780485479, "time_str": "19:17:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260603/c677194067.shtml"}, {"id": "4454849", "title": "166家外资企业获增值电信业务经营试点批复", "content": "记者从工业和信息化部了解到，自2025年2月首批增值电信业务经营试点批复发放以来，已有166家外资企业获得批复。据了解，目前，全国外商投资电信企业超3100家，其经营范围已覆盖《电信业务分类目录》全部10项增值电信业务，获增值电信业务经营试点批复的相关企业可依法开展互联网数据中心、互联网接入服务、信息服务等增值电信业务，为我国消费者带来更加多元的电信服务和产品。工业和信息化部表示，将持续推动电信领域对外开放，支持更多符合条件的外资企业进入我国电信市场。（央视新闻）", "ctime": 1780485403, "time_str": "19:16:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260603/c677194053.shtml"}, {"id": "4454843", "title": "药易购：终止协议转让部分公司股份", "content": "药易购公告，公司控股股东、实际控制人李燕飞与甘孟先生签署的《股份转让协议》拟转让500万股，占总股本5.23%，价格为24元/股，总价1.2亿元。因甘孟先生自身原因，交易在确认意见书到期前终止。李燕飞直接持有3537万股，占总股本36.97%，及其一致行动人合计持股43.98%。此次终止不会影响公司控制权、治理结构及持续经营。", "ctime": 1780485367, "time_str": "19:16:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260603/c677194042.shtml"}, {"id": "4454829", "title": "石药集团：受托人根据2026年股份奖励计划在市场上购买1380万股公司股份", "content": "石药集团公告，于2026年6月3日，受托人根据2026年股份奖励计划之条款及条件在市场上购买合共1380万股公司股份，并为获选参与者之利益以信托方式持有该等股份。所购买股份总数：1380万股股份；所购买股份占于本公告日期已发行股份总数百分比：约0.12%；每股平均价格：约7.2港元；所购买股份之总代价（不包括交易成本）：约9931.3万港元。受托人于本公告日期所持股份结余：1380万股股份。", "ctime": 1780485215, "time_str": "19:13:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260603/c677194003.shtml"}, {"id": "4454827", "title": "精研科技：控股股东及一致行动人、董事拟分别减持1%和0.27%股份", "content": "精研科技公告，公司控股股东黄逸超持有911.07万股占4.90%，一致行动人常州创研660.9万股占3.55%，拟于2026年6月29日至9月28日期间，通过集中竞价合计减持不超186.08万股，占1%，其中黄不超74.43万股、常州创研不超111.65万股；董事邬均文持有370.01万股占1.99%，同期拟减持不超50万股占0.27%，任意连续90日内减持比例均不超1%。", "ctime": 1780485203, "time_str": "19:13:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260603/c677193983.shtml"}, {"id": "4454813", "title": "鼎汉技术：高管万卿拟减持0.05%股份", "content": "鼎汉技术公告，公司高级管理人员万卿持有109.13万股，占0.18%；计划自公告披露后15个交易日后的3个月内，即2026年06月26日至2026年09月25日，通过集中竞价减持不超过27.28万股，占0.05%，减持原因为自身资金需求，减持价格将按届时市场价格及规定确定。", "ctime": 1780485124, "time_str": "19:12:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260603/c677193957.shtml"}, {"id": "4454811", "title": "通富微电：向特定对象发行股票获深交所审核通过", "content": "通富微电公告，公司于2026年6月3日收到深圳证券交易所上市审核中心出具的《关于通富微电子股份有限公司申请向特定对象发行股票的审核中心意见告知函》。深交所发行上市审核机构对公司向特定对象发行股票的申请文件进行了审核，认为公司符合发行条件、上市条件和信息披露要求，后续深交所将按规定报中国证券监督管理委员会履行相关注册程序。该事项尚需获得中国证监会同意注册后方可实施。", "ctime": 1780485117, "time_str": "19:11:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260603/c677193955.shtml"}, {"id": "4454789", "title": "天源迪科：股东陈友拟减持0.6272%股份", "content": "天源迪科公告，公司持股5%以上股东陈友拟于2026年6月26日至2026年9月25日以集中竞价或大宗交易方式减持不超过400万股，占公司总股本0.6272%；其目前持有5213.78万股，占8.1753%。", "ctime": 1780485026, "time_str": "19:10:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260603/c677193880.shtml"}, {"id": "4454699", "title": "晶丰明源：募投项目结项并将节余7164.77万元补充流动资金", "content": "晶丰明源公告，公司本次募投项目结项并将节余募集资金7164.77万元永久补充流动资金。2026年向特定对象发行股份募集资金总额18亿元，募集资金净额17.88亿元。截至公告披露日，募集资金余额合计6.91亿元，扣减自筹资金6.19亿元后，拟将节余7164.77万元永久补充流动资金。", "ctime": 1780484737, "time_str": "19:05:37", "stock_code": "", "stock_name": "", "st // 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';

    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
