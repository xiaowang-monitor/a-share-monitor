.score-bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s; }
.up { color: var(--red); }
.down { color: var(--green); }

1%", "content": "海思科公告，股东郝聪梅、杨飞1000万股减持计划已完成。郝聪梅3月5日至3月17日集中竞价减持200万股，价格43.21—51.54元，减持均价48元/股，占0.18%；杨飞3月17日至4月3日集中竞价减持800万股，50—57.79元，减持均价53.14元/股，占0.71%。减持后郝聪梅持151.8万股，占0.14%；杨飞持3444.23万股，占3.08%。", "ctime": 1775460909, "time_str": "15:35:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260406/c675781001.shtml"}, {"id": "4188333", "title": "海泰科：拟发行股份及支付现金购买资产并募集配套资金 股票停牌", "content": "海泰科公告，公司正在筹划发行股份及支付现金购买资产，同时拟发行股份募集配套资金。因有关事项尚存在不确定性，公司股票自2026年4月7日开市时起开始停牌。公司预计在不超过10个交易日内披露本次交易方案，最晚在2026年4月21日前申请复牌。", "ctime": 1775460799, "time_str": "15:33:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260406/c675780997.shtml"}, {"id": "4188331", "title": "中国核电：2026年一季度发电量同比下降2.73%", "content": "中国核电公告，截至2026年3月31日，公司2026年一季度累计商运发电量为581.09亿千瓦时，同比下降2.73%；上网电量为549.25亿千瓦时，同比下降2.70%。其中，核电部分发电量为478.55亿千瓦时，同比下降3.29%；上网电量为448.51亿千瓦时，同比下降3.28%。新能源部分发电量为102.54亿千瓦时，同比下降0.05%；上网电量为100.74亿千瓦时，同比下降0.05%。", "ctime": 1775460741, "time_str": "15:32:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260406/c675780988.shtml"}, {"id": "4188329", "title": "大西洋：2025年净利润1.82亿元，同比增长17.56%", "content": "大西洋公告，2025年营业收入37.14亿元，同比增长4.31%。净利润1.82亿元，同比增长17.56%。董事会审议通过的利润分配预案是以公司2025年年度实施权益分派股权登记日登记的总股本为基数，向全体股东每10股分配现金红利1.2元（含税）。截至2025年12月31日，公司总股本为8.98亿股，以此计算共计拟派发现金红利1.08亿元。", "ctime": 1775460726, "time_str": "15:32:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260406/c675780987.shtml"}, {"id": "4188327", "title": "深南电A：控股孙公司拟投资不超过3.9亿元建设200MW/400MWh独立储能电站项目", "content": "深南电A公告，为抢抓储能产业机遇，进一步发挥控股孙公司西湾公司中山市翠亨新区300MW/600MWh独立储能电站（一期）项目的站点资源优势，实现规模效益最大化，拟由西湾公司投资建设中山市翠亨新区300MW/600MWh独立储能电站（二、三期）项目，建设规模为200MW/400MWh。项目建设总规模200MW/400MWh，项目静态总投资不超过3.9亿元，资金来源为自有资金及银行贷款，单位造价不超过0.973元/Wh。", "ctime": 1775460721, "time_str": "15:32:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260406/c675780986.shtml"}, {"id": "4188325", "title": "新余国科：2025年净利润8248.3万元，同比增长4.17%", "content": "新余国科公告，2025年营业收入4.47亿元，同比增长0.46%。净利润8248.3万元，同比增长4.17%。公司董事会审议通过的利润分配预案为：以总股本2.77亿股为基数，向全体股东每10股派发现金红利1.8元（含税），不送红股，不转增股本。", "ctime": 1775460709, "time_str": "15:31:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260406/c675780985.shtml"}, {"id": "4188323", "title": "万向钱潮：2025年净利润10.36亿元，同比增长8.89%", "content": "万向钱潮公告，2025年营业收入133.91亿元，同比增长4.06%。净利润10.36亿元，同比增长8.89%。公司董事会审议通过的利润分配预案为：以33.15亿为基数，向全体股东每10股派发现金红利2元（含税），送红股0股（含税），不以公积金转增股本。", "ctime": 1775460698, "time_str": "15:31:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260406/c675780984.shtml"}, {"id": "4188321", "title": "宏昌科技：2025年净利润3283.64万元，同比下降37.41%", "content": "宏昌科技公告，2025年营业收入为11.47亿元，同比增长11.68%。净利润为3283.64万元，同比下降37.41%。拟向全体股东每10股派发现金红利0.28元（含税）。", "ctime": 1775460689, "time_str": "15:31:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260406/c675780976.shtml"}, {"id": "4188317", "title": "伊朗称不会为暂时停火而重新开放霍尔木兹海峡", "content": "当地时间6日，伊朗政府高级官员表示，已收到调解方巴基斯坦提出的最新停火提案，目前正在审阅相关内容。该官员表示，伊朗不会接受设定最后期限或施加压力以迫使其作出决定。伊朗不会以“临时停火”为交换条件重新开放霍尔木兹海峡。伊朗认为美国尚未做好实现永久停火的准备。（央视新闻）", "ctime": 1775460607, "time_str": "15:30:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260406/c675780964.shtml"}, {"id": "4188309", "title": "英媒：美伊停火协议或将在6日生效", "content": "路透社6日援引一位消息人士的话说，美国和伊朗已收到关于停火协议的方案，该方案可能在6日生效。消息人士称，巴基斯坦已拟定一份结束冲突的框架方案，并已与美伊进行沟通。该方案拟先实现立即停火、重新开放霍尔木兹海峡，随后在15至20天内达成最终协议。最终协议或将包括伊朗承诺不寻求核武器，以换取制裁解除及被冻结资产解冻。（新华社）", "ctime": 1775460300, "time_str": "15:25:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260406/c675780950.shtml"}, {"id": "4188305", "title": "消息人士称美伊收到有关立即停火的计划", "content": "当地时间6日，总台记者获悉，据消息人士透露，伊朗和美国已收到一项结束敌对行动，立即停火的计划。消息人士称，巴基斯坦已制定了一个结束敌对行动的框架，并与伊朗和美国交换了意见，该框架概述了一种两步走的策略，即先立即停火，再达成全面协议。（央视新闻）", "ctime": 1775459866, "time_str": "15:17:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260406/c675780933.shtml"}, {"id": "4188295", "title": "司美格鲁肽口服减重药已开出超60万张处方 诺和诺德CEO：减重药市场目前仅触及“皮毛”", "content": "根据诺和诺德最新披露的数据，目前旗下司美格鲁肽口服减重药的处方量超过60万张。瑞银集团（UBS）估计，礼来公司的口服减重药物与诺和诺德的口服版司美格鲁肽在2026年合计将创造约50亿美元的收入。不过，在诺和诺德CEO看来，减重药市场规模庞大，制药行业目前仅触及“皮毛”。他表示，包括诺和诺德、礼来以及美国的多款减重药复方制剂生产商在内，目前所提供的减重药合计仅能满足10%至15%的肥胖症患者需求。（第一财经）", "ctime": 1775459753, "time_str": "15:15:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260406/c675780929.shtml"}, {"id": "4188293", "title": "韩国计划将可再生能源发电占比提升至20%", "content": "韩国气候能源环境部6日宣布，韩国计划到2030年将可再生能源发电占比提升到至少20%，以降低对进口能源的高度依赖，并应对高端产业发展带来的电力需求增加。根据气候能源环境部在内阁会议上汇报的这项计划，韩国将大力发展太阳能与风能发电，到2030年将可再生能源供电规模扩大至100吉瓦，到2040年逐步关停60座燃煤电厂。去年，韩国可再生能源在全国总发电量中占比为11.4%。（新华社）", "ctime": 1775459745, "time_str": "15:15:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260406/c675780928.shtml"}, {"id": "4188283", "title": "伊朗西德黑兰省警方称逮捕235名与敌对势力关联人员", "content": "当地时间6日，伊朗西德黑兰省警察局通报，近日警方通过情报侦查与技术监控，在该省各县查明并逮捕了235名与敌对势力有关联的叛国分子，其中93人已被移送监狱。警方表示，这些人员在社会上积极制造恐慌情绪，宣扬敌对势力主张，并通过向以色列-美国网络的国际组织发送图片与视频，煽动并组织网络空间的破坏活动。（央视新闻）", "ctime": 1775459566, "time_str": "15:12:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260406/c675780925.shtml"}, {"id": "4188277", "title": "俄航天集团：俄计 const META     = {"update_time": "2026-04-06 16:50:55", "sentiment_score": 46.041666666666664, "agents": []};

// 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';

  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">

        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
