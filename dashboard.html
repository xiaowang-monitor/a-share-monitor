超1%", "content": "COMEX白银期货涨超1%，现报65.71美元/盎司。", "ctime": 1786502603, "time_str": "10:43:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260812/c678888650.shtml"}, {"id": "4942787", "title": "现货白银涨超1%", "content": "现货白银涨超1%，现报65.42美元/盎司。", "ctime": 1786502564, "time_str": "10:42:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260812/c678888633.shtml"}, {"id": "4942785", "title": "河南发布政府投资基金重点投资领域清单", "content": "8月11日，记者从省发展改革委获悉，经省政府同意，该委近日印发《河南省政府投资基金重点投资领域清单》，明确了政府投资基金的重点投向，覆盖新兴支柱产业、未来产业、传统优势产业和现代服务业四大板块共78个细分领域。其中，未来产业包括人工智能与具身智能、氢能、生物制造、量子科技、新一代信息网络、类脑智能与脑机接口等6个领域，重点布局人形机器人、通用大模型、氢能全链条技术、生物育种、量子计算、6G移动通信等前沿方向。（河南日报）", "ctime": 1786502509, "time_str": "10:41:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260812/c678888608.shtml"}, {"id": "4942773", "title": "印尼股市基准指数上涨1%", "content": "印尼股市基准指数上涨1%至6331.15点。", "ctime": 1786502386, "time_str": "10:39:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260812/c678888541.shtml"}, {"id": "4942765", "title": "高争民爆股价创历史新高", "content": "高争民爆盘中股价创历史新高，现涨5.44%，报61.80元，总市值为169.50亿元。", "ctime": 1786502249, "time_str": "10:37:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260812/c678888361.shtml"}, {"id": "4942763", "title": "调查：全球科技巨头AI加速抢占韩国搜索市场，NAVER等本土服务面临显著差距", "content": "韩国科学技术信息通信部8月12日表示，今年6月发布的“2025年附加通信业务实态调查”显示，生成式AI用户中有60%回答，过半以上的搜索已通过AI进行。韩国信息通信政策研究院（KISDI）的分析显示，以2025年为准，生成式AI的主要使用目的中“搜索日常信息”位居首位，占比达42.5%。据韩国科技信息通信部调查，ChatGPT和Gemini在AI服务体验率（可多选）方面，分别以41.8%和9.8%的占比位居前二。加上微软的AI服务Copilot（2.2%），来自海外的三处AI服务体验率合计高达53.8%。而本土服务NAVER的CLOVA X仅为2%。", "ctime": 1786502200, "time_str": "10:36:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260812/c678888342.shtml"}, {"id": "4942755", "title": "ETF两市成交额报1643.08亿元，较昨日此时放量234.02亿元", "content": "截至目前，ETF两市成交额报1643.08亿元，较昨日此时放量234.02亿元，分类型来看，股票型ETF成交额537.78亿元，债券型ETF成交额766.36亿元，货币型ETF成交额61.77亿元，商品型ETF成交额34.08亿元，QDII型ETF成交额243.09亿元。", "ctime": 1786502107, "time_str": "10:35:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260812/c678888281.shtml"}, {"id": "4942751", "title": "今日MMLC电池级碳酸锂（早盘）价格较昨日上涨2850元/吨", "content": "据Mysteel数据显示，今日MMLC电池级碳酸锂（早盘）价格较昨日上涨2850元/吨，中间价报147850元/吨。", "ctime": 1786502045, "time_str": "10:34:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260812/c678888245.shtml"}, {"id": "4942749", "title": "今年第17号台风“浪卡”生成", "content": "今天上午，今年第17号台风“浪卡”生成。截至8时，台风“浪卡”中心位于北纬21.8度、东经141.7度，距离日本东京偏南方向约1560公里的海面上，强度为热带风暴级，中心附近最大风力8级（18米/秒），中心气压998百帕。预计，台风“浪卡”将以每小时35至40公里的速度向东北方向快速移动，强度变化不大。（中国天气网）", "ctime": 1786502014, "time_str": "10:33:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260812/c678888242.shtml"}, {"id": "4942747", "title": "韩国综指涨幅扩大至4%", "content": "韩国综指涨幅扩大至4%，现报6599.61点。个股方面，三星电子涨超6%，SK海力士涨超5%。", "ctime": 1786501934, "time_str": "10:32:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260812/c678888204.shtml"}, {"id": "4942727", "title": "国家防总、应急管理部将针对河南的防汛四级应急响应提升至三级", "content": "8月11日，河南省中东部等地出现暴雨或大暴雨，平顶山、洛阳等局地特大暴雨。据气象部门预报，12日至15日，黄淮中西部和南部、华北南部等地有暴雨或大暴雨，河南中部和西部沿山等地部分地区有特大暴雨。根据《国家防汛抗旱应急预案》及有关规定，国家防总、应急管理部决定于8月12日9时将针对河南省的防汛四级应急响应提升至三级。(央视新闻)", "ctime": 1786501612, "time_str": "10:26:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260812/c678888017.shtml"}, {"id": "4942725", "title": "中钨在线：钨价涨跌两难 钨市买卖不旺", "content": "据中钨在线公众号，8月12日，国内钨市场延续僵持横盘格局。近期交投活跃度有所回升，但尚未形成规模性支撑，价格驱动力不足，成交仍以商谈为主，整体按需进行。钨精矿市场上，矿商挺价意愿较强，场内低价货源难觅，55%以上品位钨精矿价格稳固在41万元/标吨上方，市场流动性相对局限。仲钨酸铵（APT）市场上，在成本支撑与需求承压的交织下多空博弈，成交重心持续僵持在60万元/吨关口附近。钨粉末市场上，买卖双方保持观望拉锯态势，市场订单有所增量，但议价水平仍有承压，钨粉交易重心在950元/公斤左右，碳化钨粉议价在880元/公斤左右。钨铁市场上，产业链上下游僵持背景下，交投主动性不足，行情维持横盘观望，70钨铁报价暂稳在66万元/吨左右。钨废料市场上，持货商惜售探高，但消费端与回收商接受度有限，市场涨跌两难，行情维持窄幅震荡整理。", "ctime": 1786501577, "time_str": "10:26:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260812/c678887994.shtml"}, {"id": "4942723", "title": "阿里云灵骏真武M890超节点实例上线，首批在乌兰察布开服", "content": "阿里云灵骏真武M890超节点实例正式上线，首批已在乌兰察布地域开售。这也是国内首个成功运行超2万亿参数大模型的超节点形态算力，Kimi K3和Qwen3.8 Max均已通过该实例对外提供服务。据悉，灵骏真武M890超节点实例支持 FP8/FP4 低精度计算，通过ICN Switch 1.0 芯片Scale-up互联规模由16卡拉升至64卡，卡间互联提升至800GB/s。在智能驾驶、具身智能等训练场景中，相比上一代真武810E，训练性能提升三倍。（科创板日报）", "ctime": 1786501367, "time_str": "10:22:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260812/c678887852.shtml"}, {"id": "4942721", "title": "光伏加工设备板块走高，金辰股份涨停", "content": "光伏加工设备板块走高，金辰股份涨停，迈为股份、连城数控、奥特维、捷佳伟创、欧普泰等纷纷走高。", "ctime": 1786501365, "time_str": "10:22:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260812/c678887848.shtml"}, {"id": "4942717", "title": "法国热浪影响范围扩大 78个省份面临高温橙色警报", "content": "法国气象部门当地时间11日表示，法国新一轮热浪的影响范围持续扩大，78个省份面临高温橙色警报，其中一些地区的气温将再度逼近40摄氏度。", "ctime": 1786501296, "time_str": "10:21:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260812/c678887822.shtml"}, {"id": "4942711", "title": "Google Gemma 4全球下载量突破3亿", "content": "从Google I/O上海了解到，Google Gemma 4模型下载量已突破3亿。今年4月，谷歌发布Gemma 4系列模型，专为高级推理和智能体(Agentic)工作流而设计。（界面新闻）", "ctime 业层面看，当前具备多重有利支撑：一是全球海事环保政策持续推进，新能源相关政策带来行业发展机遇；二是行业进入换船周期，老旧船舶竞争力下降，带动多用途船等船型更新需求，也是公司现阶段订单的重要来源；三是全球贸易格局多元化，贸易需求具备刚性，地缘政治不确定性也许会给航运及造船行业带来一定的业务机会。综合来看，目前行业整体处于较好的发展窗口，但行情持续时长、景气高度难以做准确预测。", "ctime": 1786500310, "time_str": "10:05:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260812/c678887049.shtml"}, {"id": "4942681", "title": "南方电网公司谋划实施进一步深化改革", "content": "近日，南方电网公司召开2026年年中工作会议，进一步深化改革工作要点（2026—2029年）及台账作为会议成果之一进行发布。南方电网公司贯彻落实党中央关于进一步深化国资国企改革的重大决策部署，聚焦破除体制机制障碍和高质量发展中的突出问题，深入研究提出7个方面、22条、123项改革任务举措，已完成企业内部决策程序，即将正式印发实施。在“十五五”开局之年，南方电网公司新一轮国资国企改革就此拉开帷幕。围绕构建与“三个新型”建设相适应的新型能源生产关系，提出健全适应新型能源体系的市场价格机制和管理体系、加快南方区域电力市场建设、构建多元主体涉网技术监督体系、加快建设主配微协同的新型电网平台、建设权威互认的新型电力系统标准体系、加快“电碳算”协同发展和“六网”协同发展等。（人民财讯）", "ctime": 1786500229, "time_str": "10:03:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260812/c678886997.shtml"}, {"id": "4942673", "title": "最高法发布7件特许经营典型案例 明确被特许人享有“冷静期”单方解除权", "content": "今天，最高人民法院发布7件关于特许经营的典型案例，引导和规范经营主体诚信合规经营，促进特许经营健康有序发展。其中一个特点是依法保障被特许人合法权益。在特许经营活动中，特许人与被特许人信息不对称、签约能力不对等，被特许人处于相对弱势地位，容易发生权利义务失衡。案例二中，虽然涉案合同未明确约定被特许人在特许经营合同订立后一定期限内可以单方解除合同（俗称“冷静期”条款），但人民法院明确被特许人享有的“冷静期”单方解除权属于法定权利，被特许人可以在经营资源尚未被实际利用的合理期限内依法行使。案例五中，特许人在合同履行期间被撤销备案资格，履约能力明显弱化，人民法院依法支持了被特许人解除合同的诉请。(央视新闻)", "ctime": 1786500112, "time_str": "10:01:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260812/c678886901.shtml"}, {"id": "4942665", "title": "广期所碳酸锂主力合约站上15万元/吨", "content": "广期所碳酸锂主力合约站上15万元/吨，日内涨3.18%。", "ctime": 1786499862, "time_str": "09:57:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260812/c678886638.shtml"}, {"id": "4942663", "title": "韩国最高法院裁定三星证券向韩国国民年金公团支付18.6亿韩元", "content": "韩国最高法院裁定，三星证券必须向韩国国民年金公团（NPS）支付18.6亿韩元，以弥补因2018年股息支付错误造成的 const META     = {"update_time": "2026-08-12 11:33:02", "sentiment_score": 62.26851851851852, "agents": []};

// 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
