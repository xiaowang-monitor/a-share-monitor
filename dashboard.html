.card {

  transition: all 0.2s;
}
.card:hover { background: var(--bg-card-hover); border-color: #334155; }
.badge {

  height: 6px; border-radius: 3px; background: #1e293b; overflow: hidden;
}
.score-bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s; }
.up { color: var(--red); }
.down { color: var(--green); }
.pulse { animation: pulse 2s infinite; }
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}
.glow { box-shadow: 0 0 20px rgba(59,130,246,0.15); }

          <tbody id="picks-table"></tbody>
        </table>

    </div>
  </div>

缩小分歧，工会累计举行44小时罢工。工会主要要求加薪、提高奖金、恢复被解雇工会成员职位以及延长退休年龄等。(界面)", "ctime": 1786693347, "time_str": "15:42:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260814/c678963970.shtml"}, {"id": "4959903", "title": "铜冠铜箔到三孚新科考察交流", "content": "8月13日，铜冠铜箔总经理印大维携团队到三孚新科考察交流，双方围绕高端铜箔产业链的技术研发与产业协同展开深入交流。此次考察交流，为铜冠铜箔与三孚新科在高端铜箔制备领域的工艺、化学品、设备与耗材等方面的产业协同与合作奠定基础。双方一致认为，高端铜箔作为电子信息与新能源产业的关键基础材料，其制造装备与专用材料的协同创新与国产替代，对提升产业链自主可控水平、支撑下游高性能铜箔需求具有重要意义。未来，双方将保持密切沟通，围绕铜箔产业高质量发展，共同探讨铜箔产业链上下游协同发展的更多可能。(人民财讯)", "ctime": 1786693303, "time_str": "15:41:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260814/c678963942.shtml"}, {"id": "4959897", "title": "欣界能源完成超1亿美元B轮融资", "content": "近日，欣界能源宣布完成超1亿美元B轮融资，由普华资本领投。本轮资金将主要用于锂金属固态电池量产和持续交付、研发团队扩建，以及新增3GWh高能量高安全固态电池量产线。新增产线预计于2026年底至2027年初陆续投产。(人民财讯)", "ctime": 1786693251, "time_str": "15:40:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260814/c678963912.shtml"}, {"id": "4959883", "title": "应急管理部调派救援力量驰援河南周口处置溃口险情", "content": "记者从应急管理部获悉，应急管理部调派中国安能工程救援力量200人，携带动力舟桥、水陆两栖挖掘机、装载机等大型工程机械装备110台（套），紧急驰援周口灾区。以上力量14日已到达现场投入抢险救援工作。 据了解，8月13日23时许，受贾鲁河上游来水和沙颍河倒灌顶托挤压影响，河南省周口市川汇区新北环桥下贾鲁河东岸堤坝出现溃口。 国家防灾减灾救灾委员会14日针对今年第13号台风“白海豚”残涡及强降雨对河南的严重灾害影响，启动国家四级救灾应急响应，前期派出的救灾工作组继续在灾区实地查看灾情，指导和协助地方做好灾情核查、群众转移安置、基本生活保障等救灾救助工作。 同日，国家防灾减灾救灾委员会办公室、应急管理部针对近期持续暴雨洪涝灾害导致河南周口、许昌等地险情灾情，根据灾区群众避险转移和安置救助需要，会同国家粮食和物资储备局调拨折叠床、褥子、毛毯、夏凉被、夏装、家庭应急包等3万件中央救灾物资，支持河南做好受灾群众安置救助工作。(新华社)", "ctime": 1786693092, "time_str": "15:38:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260814/c678963818.shtml"}, {"id": "4959865", "title": "国电南瑞：拟以5亿元-10亿元回购公司股份", "content": "国电南瑞公告，拟以不低于人民币5亿元（含本数）、不超过人民币10亿元（含本数）回购公司股份，回购价格不超过35.17元/股（含本数），回购资金来源为自有资金。回购股份用于未来实施股权激励计划，公司如在股份回购完成之后36个月内未能实施上述用途，或所回购的股份未全部用于上述用途，未使用的部分将履行相关程序予以注销。", "ctime": 1786693026, "time_str": "15:37:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260814/c678963729.shtml"}, {"id": "4959857", "title": "上海机场：7月浦东旅客吞吐量807.16万人次，同比7.89%", "content": "上海机场公告，2026年7月浦东国际机场飞机起降量51280架次，同比5.37%，旅客吞吐量807.16万人次，同比7.89%，货邮吞吐量40.68万吨，同比14.59%；虹桥国际机场飞机起降量24530架次，同比2.93%，旅客吞吐量443.73万人次，同比4.85%，货邮吞吐量3.52万吨，同比-0.87%。", "ctime": 1786692860, "time_str": "15:34:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260814/c678963626.shtml"}, {"id": "4959853", "title": "万朗磁塑等成立智能科技公司 含智能无人飞行器制造业务", "content": "企查查APP显示，近日，安徽航蜂智能科技有限公司成立，法定代表人为张飞龙，注册资本为1000万元，经营范围包含：智能无人飞行器制造；智能无人飞行器销售；电子元器件制造；电子元器件批发；民用航空器维修等。企查查股权穿透显示，该公司由万朗磁塑旗下安徽航蜂低空科技有限公司等共同持股。（人民财讯）", "ctime": 1786692851, "time_str": "15:34:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260814/c678963607.shtml"}, {"id": "4959849", "title": "陕建股份：下属子公司中标11.56亿元云境智算中心EPC项目", "content": "陕建股份公告，2026年7月，公司下属子公司陕西建工第十六建设有限公司中标云境智算中心项目（EPC），项目地点位于甘肃省白银市景泰县，中标金额11.56亿元。", "ctime": 1786692848, "time_str": "15:34:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260814/c678963603.shtml"}, {"id": "4959845", "title": "春秋航空：2026年7月可用座公里数62.9亿人公里，同比增8.02%", "content": "春秋航空公告，2026年7月可用座公里数62.9亿人公里，同比增8.02%，环比增12.41%；旅客周转量58.69亿人公里，同比增9.72%，环比增14.18%；客座率93.31%，同比增1.45个百分点，环比增1.45个百分点。当月总载运人次322.7万人次，同比增5.14%。当年累计可用座公里数401.01亿人公里，同比增14.15%。", "ctime": 1786692831, "time_str": "15:33:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260814/c678963592.shtml"}, {"id": "4959835", "title": "中国海警舰艇编队8月14日在我钓鱼岛及其附属岛屿领海内维权巡航", "content": "8月14日，中国海警梅山舰编队在我钓鱼岛及其附属岛屿领海内维权巡航。这是中国海警依法开展的维权巡航活动。(新华社)", "ctime": 1786692740, "time_str": "15:32:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260814/c678963539.shtml"}, {"id": "4959811", "title": "贵州茅台集团党委原副书记赵书跃接受审查调查", "content": "中央纪委国家监委网站通报，据贵州省纪委监委消息：中国贵州茅台酒厂（集团）有限责任公司党委原副书记赵书跃涉嫌严重违纪违法，目前正接受贵州省纪委监委纪律审查和监察调查。（界面新闻）", "ctime": 1786692650, "time_str": "15:30:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260814/c678963519.shtml"}, {"id": "4959803", "title": "科泰电源在江苏成立新公司", "content": "企查查APP显示，近日，科泰电源（江苏）有限公司成立，法定代表人为周路来，注册资本为5000万元，经营范围包含发电机及发电机组制造；智能输配电及控制设备销售；电力电子元器件制造；电池制造；储能技术服务等。企查查股权穿透显示，该公司由科泰电源全资持股。（人民财讯）", "ctime": 1786692623, "time_str": "15:30:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260814/c678963507.shtml"}, {"id": "4959781", "title": "LG Innotek上半年据报对苹果销售额创同期新高", "content": "8月14日，LG Innotek公布半年报，今年上半年对单一客户的销售额达8.84万亿韩元（约合62.4亿美元），创公司上半年对单一客户销售额历史新高。该客户销售额占LG Innotek同期总销售额逾10%，涵盖光学和封装业务。LG Innotek未公布该客户名称，但从销售规模及业务结构来看，该客户被认为是苹果。LG Innotek为苹果iPhone供应摄像头模组、基板等关键零部件。（界面新闻）", "ctime": 1786692495, "time_str": "15:28:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260814/c678963360.shtml"}, {"id": "4959771", "title": "美国30年期国债拍卖中标收益率升至26年来最高水平", "content": "美国财政部13日公布的数据显示，当日拍卖的250亿美元30年期国债中标收益率为5.216%，升至2001年以来的最高水平，美国政府面临发行长期债券资金成本上涨的压力。数据显示，这一笔债券发行日期为8月17日，将于2056年8月15日到期。尽管市场投标总金额达598亿美元，但投资者要求获得更高的资金回报。此外，美国财政部在12日拍卖420亿美元10年期国债中标收益率为4.683%，为2007年以来的最高水平。（新华财经）", "ctime": 1786692380, "time_str": "15:26:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260814/c678963250.shtml"}, {"id": "4959743", "title": "李乐成调研盐湖产业和工业绿色低碳发展", "content": "近日，工业和信息化部党组书记、部长李乐成赴青海、甘肃、宁夏等地调研盐湖产业和工业绿色低碳发展情况。在青海格尔木市，李乐成先后到青海盐湖镁业、钾肥、锂电公司，调研盐湖金属镁一体化、钾肥、锂盐等项目生产情况。他强调，要深入贯彻落实习近平总书记关于加快建设世界级盐湖产业基地的重要指示精神，落实党中央、国务院决策部署，把建设世界级盐湖产业基地作为推进新型工业化、发展新质生产力的重大任务，为维护国家粮食和能源资源安全、加快建设现代化产业体系提供坚实保障。要科学谋划盐湖产业发展战略，加强政策支持和要素保障，做优做强企业，促进资源整合和产业协同，攻坚盐湖资源开发关键核心技术，提高钾、锂、镁等资源开发利用效率和精深加工水平，打造特色优势产业链，构建技术先进、保障有力、绿色智能、效益一流的产业体系，全面提升产业国际竞争力，推动盐湖产业高质量发展迈上新台阶。李乐成还深入青海清洁能源和绿色算力调度中心、甘肃资源综合利用有关企业、宁夏宁东能源化工基地以及六盘山实验室等，实地察看算力电力协同和绿色算力产业发展、废旧新能源汽车动力电池回收再利用产业情况，详细了解宁东200万千瓦复合光伏项目、宁东煤化工基地建设以及仪器仪表领域中试验证平台能力建设情况。他强调，要发挥碳达峰碳中和战略牵引作用，坚持智能化、绿色化、融合化方向，统筹推进产业绿色化和绿色产业化，以务实举措培育壮大绿色生产力。(工信微报)", "ctime": 1786691978, "time_str": "15:19:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260814/c678963039.shtml"}, {"id": "4959729", "title": "第三方机构：前7个月股票策略私募产品平均盈利0.12%", "content": "根据第三方机构私募排排网最新监测，受7月股票市场回调等因素影响，在该平台有业绩记录的8162只股票策略产品，7月份的平均收益率为-9.50%，今年前7个月的收益率为0.12%，正收益产品占比为44.90%。相关监测数据还显示，截至7月31日，有业绩记录的总计12695只私募证券基金产品7月平均收益率为-7.33%，为今年以来单月最差表现。受此影响，今年以来私募证券基金产品的平均收益率降至0.43%，其中正收益产品占比为49.77%。分策略来看，在证券私募基金的五大策略（期货及衍生品策略、债券策略、股票策略、多资产策略、组合基金策略）中，期货及衍生品策略今年前7个月的平均收益率为2.80%，排名第一，债券策略以0.80%的平均收益率排名第二，股票策略排名第三。(中证金牛座)", "ctime": 1786691797, "time_str": "15:16:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260814/c678962955.shtml"}, {"id": "4959693", "title": "WTI原油涨超2%", "content": "WTI原油涨超2%，现报82.88美元/桶。", "ctime": 1786691635, "time_str": "15:13:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260814/c678962899.shtml"}, {"id": "4959673", "title": "国防部：“台独”死局演不赢、改不了", "content": "8月14日下午，国防部新闻发言人陈曦大校就近期涉军问题发布消息。记者：据报道，今年台“汉光42号演习”期间，赖清德演练“战时逃亡”路线，台军发生坦克零件掉落、战机冲出跑道等事故，模拟通信降速、阶段性断网引发民众恐慌。请问对此有何评论？陈曦：所谓“汉光演习”从来都是装腔作势、劳民伤财的把戏，今年更让我们看清了赖清德假防卫、真逃跑的胆怯本性。民进党当局还肆意妄为地制造战争恐慌，加速把城市变战场、让民众上前线，破坏台湾社会安宁，损害老百姓安全福祉。正告民进党当局，“台独”死局演不赢、改不了。解放军枕戈待旦备实当下，持续提升反分裂反干涉实战能力，始终是捍卫国家主权和领土完整、维护台海和平稳定的稳固底牌。（央视新闻）", "ctime": 1786691394, "time_str": "15:09:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260814/c678962838.shtml"}, {"id": "4959667", "title": "国防部：中方将继续在仁爱礁附近海域开展维权执法行动", "content": "8月14日下午，国防部新闻发言人陈曦大校就近期涉军问题发布消息。记者：据报道，菲律宾和澳大利亚近期举行防长会并发表联合声明，对中国海警近期位仁爱礁采取的行动表达“严重关切”，敦促各方“专业、安全地”开展行动。请问有何评论？陈曦：我们坚决反对菲澳对中方的无端指责和攻击抹黑。关于菲方在仁爱礁蓄意挑衅、袭击中方人员一事，中国海警已经发布了消息，并公布了现场证据。中方采取必要应对措施，专业克制、无可非议。需要强调的是，仁爱礁是中国南沙群岛的一部分，是中国固有领土，菲方不管说什么、做什么都改变不了这一事实。菲方应该做的就是尽快拖走非法“坐滩”的57号舰。中方将继续开展维权执法行动，坚决挫败一切侵权挑衅，维护国家领土主权和海洋权益。我们敦促有关国家停止渲染炒作、挑动对抗，停止损害地区和平稳定。（新华社）", "ctime": 1786691369, "time_str": "15:09:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260814/c678962828.shtml"}, {"id": "4959665", "title": "7月中国快递发展指数同比增长2.4%", "content": "记者14日从国家邮政局获悉，7月中国快递发展指数同比增长2.4%。“快递进村”工程的持续深入，正不断激发农村消费活力，让越来越多村民享受到便捷的网购服务。（央视新闻）", "ctime": 1786691303, "time_str": "15:08:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260814/c678962805.shtml"}, {"id": "4959635", "title": "中埃将举行“文明之鹰-2026”空军联合训练", "content": "8月14日下午，国防部新闻发言人陈曦大校就近期涉军问题发布消息。陈曦：8月中旬至9月上旬，中国与埃及两国空军将在埃举行“文明之鹰-2026”联合训练，重点开展空战战术、制空作战、战斗搜救等课目训练，并进行兵力运用演练。这是双方第2次举办该系列联训，将持续增进双方互信与传统友谊，深化两军务实合作，共同维护地区和平稳定。(新华社)", "ctime": 1786691137, "time_str": "15:05:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260814/c678962746.shtml"}, {"id": "4959627", "title": "四部门发布关于集成电路企业、工业母机企业非货币性资产交换企业所得税政策的公告", "content": "财政部、税务总局、国家发展改革委、工业和信息化部发布关于集成电路企业、工业母机企业非货币性资产交换企业所得税政策的公告，集成电路企业、工业母机企业在2026年1月1日至2028年12月31日期间发生非货币性资产交换，按规定确认的非货币性资产交换所得，可在不超过5年期限内分期均匀计入相应年度的应纳税所得额，按现行政策规定计算缴纳企业所得税；企业进行非货币性资产交换所发生的损失，不得分期确认。", "ctime": 1786691085, "time_str": "15:04:45", "stock_code": "", " const META     = {"update_time": "2026-08-14 15:57:24", "sentiment_score": 59.60698689956332, "agents": []};

// 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

  const container = document.getElementById('hot7-list');

    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';

  }

    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">

      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {

      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },

    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);

        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
