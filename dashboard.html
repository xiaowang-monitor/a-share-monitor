const NEWS     = [{"id": "4433003", "title": "沪深京三市成交额超2.5万亿元，较上日此时缩量3729亿元", "content": "据同花顺iFinD数据，沪深京三市成交额超2.5万亿元，较上日此时缩量3729亿元，预计全天成交金额约2.9万亿元。截至目前，沪市成交额11380亿元，深市成交额13458亿元，北证50成交额165亿元。", "ctime": 1780294871, "time_str": "14:21:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260601/c677115989.shtml"}, {"id": "4432999", "title": "高盛：存储市场供应短缺情况将持续至2028年", "content": "高盛5月31日发布研究观点预计，到2027年，传统DRAM、NAND和HBM的供需状况都将较2026年更为紧张，且这种紧张态势将持续至2028年，这将有助于存储器企业在未来数年内实现更高的盈利水平。该机构认为市场尚未充分认识到当前存储器行业上行周期的持久性，大多数存储器股票的市盈率仍低至中个位数水平便是明证。高盛在研究报告中重点指出三点。其一，需求前景更为明朗，服务器和人工智能设备配置比例显著提升且代理型AI应用持续扩展；其二，因产能扩张步伐放缓且HBM交易占比更高，供应增长受限；其三，客户通过长期协议作出更明确承诺，并实施更高效的资本支出规划。以上因素将推动需求持续超越供给，从而形成更长的上升周期。机构甚至预期，即便到2028年，DRAM/NAND/HBM市场仍将面临供应短缺。基于对行业供需趋紧的判断，高盛上调了对存储芯片制造商DRAM、NAND及HBM产品的定价预期。预计三星电子的传统DRAM平均销售价格在2026财年和2027财年将分别同比增长326%和27%，NANDASP则分别增长283%和33%；同时坚持看涨观点：HBMASP相较于传统DRAM实现“追赶\"效应，有望推动其在2027财年实现约50%的同比增幅，并分别带动2026财年、2027财年及2028财年的HBM市场总规模达到560亿美元、1160亿美元和1680亿美元。(财联社)", "ctime": 1780294847, "time_str": "14:20:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260601/c677115977.shtml"}, {"id": "4432993", "title": "本周72只基金密集启募 科技基金仍扎堆发行", "content": "公募排排网数据显示，按认购起始日统计，本周全市场共有72只基金开启募集，环比增长80%，且单周发行数量创下近301周新高。值得注意的是，新发基金数量已连续5周站上40只关口，足见基金发行市场之热度。分基金类型来看，权益类依然是本周新发的主力品种。本周开启募集的权益基金达47只，包括31只股票型和16只偏股混合型基金，合计占到总量的65.28%。权益类中，科技基金仍在扎堆发行。本周开启募集的权益基金中，名称中带有“科创板”、“电子”、“软件”等科技字眼的基金达14只，占到权益基金总量的29.79%。此外，FOF基金的发行热度也在持续，本周9只FOF基金开启募集，创下近13周新高。（蓝鲸新闻）", "ctime": 1780294804, "time_str": "14:20:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260601/c677115955.shtml"}, {"id": "4432959", "title": "华磊迅拓：与光模块龙头中际旭创旗下深度智冷合作 构建柔性制造体系", "content": "近日，华磊迅拓与广东深度智冷科技正式召开MOM项目启动会，该项目旨在通过导入华磊迅拓MOM系统，助力深度智冷科技实现制造全流程的数字化、智能化转型。广东深度智冷科技聚焦“AI+液冷”融合创新，由全球光模块龙头中际旭创与电子新材料及液冷技术领军企业东阳光股份联合注资成立，致力于为数据中心算力设施输出包括3DVC、液冷板、快接头、Manifold、CDU、冷却工质等全链路散热产品。双方将以启动会为起点，助力深度智冷科技构建精益、敏捷、柔性的制造能力，提高液冷板等产品生产质量和生产效率。（人民财讯）", "ctime": 1780294444, "time_str": "14:14:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260601/c677115806.shtml"}, {"id": "4432949", "title": "美提议黎真主党首先停止攻击以色列", "content": "据美国媒体“阿克西奥斯新闻网（Axios）”当地时间5月31日晚援引美国官员的消息报道，美国国务卿鲁比奥已分别与黎巴嫩总统奥恩、以色列总理内塔尼亚胡进行了通话，试图推动以黎新停火倡议。报道称，美方提议“黎巴嫩真主党首先停止对以色列的所有袭击”，“作为交换，以色列将避免在贝鲁特采取升级行动”。(CCTV国际时讯)", "ctime": 1780294392, "time_str": "14:13:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260601/c677115795.shtml"}, {"id": "4432935", "title": "上海：将集中力量 重点突破工业软件、基础软件等领域的底层关键核心技术", "content": "上海市新闻发布会6月1日召开，介绍《上海市服务业发展“十五五”规划》相关情况。上海市经济信息化委副主任葛东波表示，预计到2030年，上海市软件和信息服务业营收规模有望达到3万亿元左右，行业增加值突破1万亿元。上海将集中力量，重点突破工业软件、基础软件等领域的底层关键核心技术，加快完成传统软件产品的价值重构。同时，加快推动人工智能全面赋能软件全生命周期，覆盖需求分析、代码生成、测试验证等各个关键环节，积极培育“智能体即服务”“结果即服务”等新型业态，探索软件研发新范式，培育服务新形态与商业新模式。（人民财讯）", "ctime": 1780294092, "time_str": "14:08:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260601/c677115734.shtml"}, {"id": "4432929", "title": "首批公募基准调整今日落地 关键词：是调基准，并非调仓", "content": "公募基金业绩比较基准调整6月1日迎来首批集中落地。中国证监会发布的《公开募集证券投资基金业绩比较基准指引》自3月1日起正式施行后，自6月1日起首批调整落地。据统计，此次12家基金公司共有195只存量基金涉及调整，类型涵盖股票型、混合型、债券型、FOF和QDII。蓝鲸新闻记者多方采访了解到，根据指引，调整后的基准将更加匹配基金产品定位和实际持仓风格，而不是调了基准导致调仓。事实上，监管此前就曾多渠道宣导，首先设置一年过渡期，并在一年过渡期内要指导行业机构以“尽量调整基准而不调仓”原则，做好存量基金的业绩基准调整工作。整体结论来看，截至2026年6月1日，新规施行已近3个月，消费/医药主题基金并无需集中减仓科技股，通过“去主题化转型+平滑调仓”，对科技股实质影响有限，可在不集中减持科技股的前提下完成合规。也因此，科技股核心驱动仍看产业趋势与业绩。(蓝鲸新闻)", "ctime": 1780294045, "time_str": "14:07:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260601/c677115723.shtml"}, {"id": "4432805", "title": "韩国航空航天企业工厂爆炸事故伤亡人数修正为5死2伤", "content": "总台记者获悉，当地时间6月1日，位于韩国大田市的韩华航空航天的工厂发生爆炸事故，爆炸引发了火灾。据现场消防救援人员的最新消息，此前公布的人员死伤数字现已修正为5人死亡、2人受伤。据悉，发生事故的韩华航空航天大田工厂负责战术武器和大型推进器的生产和研发。此前，该工厂曾在2018年和2019年先后两次发生过爆炸事故并造成人员伤亡。2018年5月，该工厂在注入火箭燃料时发生爆炸，造成现场2人死亡，3人严重烧伤并在医院接受治疗期间死亡。2019年2月，该工厂自火箭推进器中提取燃料的部门发生爆炸并起火，导致3人死亡。(央视新闻)", "ctime": 1780293478, "time_str": "13:57:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260601/c677115570.shtml"}, {"id": "4432799", "title": "特朗普再称伊朗很想达成协议", "content": "美国东部时间今天（6月1日）凌晨，美国总统特朗普在社交媒体平台发帖称，“伊朗真的很想达成协议，而且这对美国以及我们的盟友来说都是好事。(CCTV国际时讯)", "ctime": 1780293373, "time_str": "13:56:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260601/c677115551.shtml"}, {"id": "4432793", "title": "赛力斯旗下重庆蓝电科技公司更名 新增宁德时代等多名股东", "content": "企查查APP显示，近日，由赛力斯汽车（湖北）有限公司全资持股的重庆蓝电科技有限公司发生工商变更，新增宁德时代全资子公司宁波梅山保税港区问鼎投资有限公司、星宇股份、博俊科技等多名股东，同时企业名称变更为重庆赛豆科技有限公司，注册资本由3.2亿元增至9.71亿元。企查查信息显示，该公司成立于2026年4月，经营范围包含：汽车销售；新能源汽车整车销售；汽车零部件及配件制造；机械零件、零部件销售等。（人民财讯）", "ctime": 1780293341, "time_str": "13:55:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260601/c677115548.shtml"}, {"id": "4432789", "title": "美媒称美军“悄悄”引导约70艘商船通过霍尔木兹海峡", "content": "美国《纽约时报》5月31日援引匿名美方官员的话说，美军过去三周内“悄悄”引导约70艘商船通行霍尔木兹海峡。 报道说，上述美方官员拒绝说明在美军引导下进出霍尔木兹海峡船只的具体型号和路线，但暗示至少有一条不在伊朗海岸线附近的航线。另有航运分析人士称，美军引导的通航航线大多更靠近阿曼海域。此外，由于美方引导的通航均在关闭船舶应答器的状态下完成，他们无法独立核实此类通航船只的实际数量。 报道同时说，在美国和以色列对伊朗发动军事打击前，每天有超100艘商船经由霍尔木兹海峡通行。因此，过去三周由美方协调达成的“日均三艘”通行量，远不能意味着海峡通行“迎来大幅复苏”。 美军5月初曾启动寻求疏导霍尔木兹海峡被困船只通行的“自由计划”，但美国总统特朗普随后很快宣布这一行动暂停。据美国媒体报道，由于该行动未提前与海湾盟友协调，引发沙特阿拉伯方面不满，拒绝美军使用沙特基地和空域。此后，特朗普多次宣称可能恢复“自由计划”行动。 美军中央司令部发言人蒂姆·霍金斯5月30日在一份声明中说，尽管目前美军不再护航，美方将继续与寻求“安全自由通过霍尔木兹海峡”的商船进行沟通协调。(新华社)", "ctime": 1780293312, "time_str": "13:55:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260601/c677115539.shtml"}, {"id": "4432785", "title": "存储芯片板块走低，东芯股份跌超10%", "content": "存储芯片板块走低，东芯股份跌超10%，拓荆科技跌近6%，江波龙、香农芯创、德明利、佰维存储跟跌。", "ctime": 1780293287, "time_str": "13:54:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260601/c677115537.shtml"}, {"id": "4432777", "title": "大商所焦炭主力合约大涨6%", "content": "大商所焦炭主力合约大涨6%，报2016元/吨。", "ctime": 1780293148, "time_str": "13:52:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260601/c677115503.shtml"}, {"id": "4432775", "title": "大商所焦煤主力合约触及涨停", "content": "大商所焦煤主力合约触及涨停，报1387.5元/吨，现涨幅为7.98%。", "ctime": 1780293119, "time_str": "13:51:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260601/c677115496.shtml"}, {"id": "4432771", "title": "OpenAI进军机器人赛道，专注研发协助型机器人", "content": "6月1日，OpenAI CEO山姆·奥特曼在社交平台发布招聘信息，称公司正在寻找杰出的全栈硬件、运营、系统及机器学习工程师，共同编程并制造对社会真正有用的机器人。奥特曼表示，人工智能应当能够在现实世界中帮助人类。短期内，OpenAI专注于研发能够协助技术工人建设未来基础设施的机器人；长远来看，公司设想未来的每个人都能拥有一个可以完成各种需求的个人机器人。（澎湃新闻）", "ctime": 1780293066, "time_str": "13:51:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260601/c677115483.shtml"}, {"id": "4432769", "title": "上海：开发“数字员工”等多智能体协同产品", "content": "上海市新闻发布会6月1日召开，介绍《上海市服务业发展“十五五”规划》相关情况。上海市经济信息化委副主任葛东波表示，加快“人工智能+”生产性服务业发展。将优化模型、算力、语料供给，加快培育工业设计、供应链管理、质量检测、设备运维等生产性服务业。推广订单履约监控、智能排产等云化服务，开发“数字员工”等多智能体协同产品，部署“小快轻准”解决方案，推动AI+生产性服务业创新发展。（人民财讯）", "ctime": 1780293054, "time_str": "13:50:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260601/c677115481.shtml"}, {"id": "4432765", "title": "长生人寿拟增资扩股引进战略投资者", "content": "北京产权交易所披露了长生人寿保险有限公司增资扩股引进战略投资者项目，披露起止日期为6月1日至6月22日。长生人寿成立于2003年9月，总部位于上海市，公司现有3家股东，其中，中国长城资产管理股份有限公司持股51%，日本生命保险相互会社持股30%，长城国富置业有限公司持股19%。据长生人寿披露信息，公司2026年第一季度综合偿付能力充足率为55.5%，2025年第二季度风险综合评级为B类。偿付能力充足率未达到监管要求。（人民财讯）", "ctime": 1780292872, "time_str": "13:47:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260601/c677115373.shtml"}, {"id": "4432755", "title": "以军称拦截黎真主党火箭弹并打击其火箭发射装置", "content": "当地时间6月1日，以色列国防军表示，当天清晨从黎巴嫩境内发射、指向以色列上加利利地区的一枚火箭弹被以军成功拦截。以军同时称，在以北部城市谢莫纳上空发射了一枚拦截弹，用于应对一架疑似由黎真主党操控的无人机，目前拦截效果仍在评估中。以军还表示，6月1日凌晨，其对一处真主党火箭弹发射装置实施空袭。自当天凌晨以来，以色列北部疑似因火箭弹和无人机来袭多次拉响防空警报。（央视新闻）", "ctime": 1780292739, "time_str": "13:45:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260601/c677115300.shtml"}, {"id": "4432751", "title": "零跑汽车：2026年5月交付量达81569台，同比增长81%", "content": "零跑汽车：2026年5月交付量达81569台，同比增长81%。", "ctime": 1780292732, "time_str": "13:45:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260601/c677115298.shtml"}, {"id": "4432749", "title": "我国最北高铁哈伊高铁开行首趟动车组测试列车", "content": "我国在建纬度最高的高速铁路哈尔滨至伊春高铁迎来重要节点。6月1日7时25分，在黑龙江省哈尔滨站内，一列CRH5型测试动车组驶向伊春西站，这是哈伊高铁自5月30日启动联调联试以来开行的首趟动车组测试列车。哈伊高铁通车后，哈尔滨至伊春的旅客列车运行时间将由7小时压缩至2小时以内，对于助力东北全面振兴、推动沿线冰雪旅游和生态资源开发、完善区域路网布局具有重要意义。（央视新闻）", "ctime": 1780292710, "time_str": "13:45:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260601/c677115288.shtml"}, {"id": "4432733", "title": "追觅开放融资 单笔投资门槛最低3.5亿 Pre-IPO轮投前估值或700亿", "content": "从知情人士处获悉，追觅近期开放直接融资窗口，计划释放部分Pre-IPO份额。本轮投前估值或锁定约700亿元人民币，单笔投资最低门槛高达3.5亿元，整个融资窗口预计于7月初关闭。另外，此次整体释放的份额区间为5%至10%，若按700亿元估值计算，对应融资规模约在35亿至70亿元之间。从交易结构来看，本轮Pre-IPO份额并非单一的增发或转让，而是同时包含创始团队老股转让与公司层面新股增发两部分。“一部分来自创始人俞浩个人直接持有的老股，其余部分则通过公司增资形式释放。不过，最终的老股与新股配比仍需内部确认，并可能根据领投机构的意向进行调整。”知情人士表示。关于估值，知情人士透露：“700亿元为投前估值，最终正式估值需与领投机构共同敲定，当前可视作谈判基准。”相较追觅此前的融资轮次，这一估值已实现明显跃升。（蓝鲸财经）", "ctime": 1780292452, "time_str": "13:40:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260601/c677115203.shtml"}, {"id": "4432717", "title": "曹操出行成立智行科技公司，含AI相关业务", "content": "企查查APP显示，近日，曹操智行科技（上海）有限公司成立，注册资本5000万元，经营范围包含：人工智能基础软件开发；人工智能应用软件开发；软件开发；计算机系统服务等。企查查股权穿透显示，该公司由曹操出行关联公司杭州优行科技有限公司全资持股。（人民财讯）", "ctime": 1780292132, "time_str": "13:35:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260601/c677115077.shtml"}, {"id": "4432715", "title": "并行科技成立科技新公司 含AI软件开发业务", "content": "企查查APP显示，近日，深圳市并行科技有限公司成立，经营范围包含：计算机系统服务；人工智能应用软件开发；人工智能基础软件开发；数字创意产品展览展示服务等。企查查股权穿透显示，该公司由并行科技全资持股。（人民财讯）", "ctime": 1780292097, "time_str": "13:34:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260601/c677115068.shtml"}, {"id": "4432695", "title": "ETF两市成交额超4000亿元", "content": "截至目前，ETF两市成交额超4000亿元，报4016.31亿元，分类型来看，股票型ETF成交额1231亿元，债券型ETF成交额1828.69亿元，货币型ETF成交额168.44亿元，商品型ETF成交额36.20亿元，QDII型ETF成交额475.39亿元。其中，成交额最高的非货币型ETF分别是中韩半导体ETF（513310）、科创50ETF（588000）、科创芯片ETF（588200），成交额分别为96.25亿元、53.60亿元、48.20亿元。", "ctime": 1780291854, "time_str": "13:30:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260601/c677115021.shtml"}, {"id": "4432689", "title": "国产世界模型登顶WorldArena榜单", "content": "近日，国内AI企业考拉悠然联合同济大学空间智能团队打造的悠然无界世界模型开源版本BLM斩获WorldArenaTrack-1（视频质量赛道）榜单第一，闭源版本BWM-Fast拿下全球第二。WorldArena是世界模型国际权威评测基准，由清华大学联合普林斯顿大学、北京大学等8所学术机构发起和制定，Track-1从视觉质量、运动质量、物理遵循性、内容一致性、三维空间准确性以及可控性6大评测维度（16项细分指标）进行综合考量，检验模型的交互能力、物理一致性与未来时空预测能力。据介绍，考拉悠然选择了训练数据增强与智能增广策略，最大化释放单位数据的训练价值，用更高的数据利用效率领先堆量策略。同时，基于DiT架构，引入首帧引导、动态记忆机制以及双通路动作控制调制策略，从场景初始化、长时序记忆建模到动作响应控制多维度系统增强。生成结果在时空连贯性、动作可控性与物理一致性上取得领先。（澎湃新闻）", "ctime": 1780291723, "time_str": "13:28:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260601/c677114996.shtml"}, {"id": "4432687", "title": "电机板块短线拉升", "content": "电机板块短线拉升，神力股份、星德胜此前涨停，卧龙电驱、江苏雷利、三协电机、方正电机、兆威机电等跟涨。", "ctime": 1780291709, "time_str": "13:28:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260601/c677114990.shtml"}, {"id": "4432685", "title": "广州—乌鲁木齐—法兰克福航线开通 中欧往返可节省10余小时时长", "content": "今天（6月1日），广州—乌鲁木齐—法兰克福国际航线正式通航，这是我国西北地区首条直达德国的洲际客运航线。新航线贯通粤港澳大湾区、丝绸之路经济带核心区与欧洲腹地，搭建起高效畅通的亚欧空中互联互通通道，填补了我国西北地区无直达德国洲际客运航线的空白，为新疆向西开放搭建起全新的亚欧空中桥梁。据了解，该航线由波音787-9宽体客机执飞，每周一、周五常态化运营，往返可提供近600个客座，航班号为CZ6041/CZ6042。（央视新闻）", "ctime": 1780291645, "time_str": "13:27:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260601/c677114969.shtml"}, {"id": "4432683", "title": "南向资金净买入超70亿港元", "content": "据同花顺iFinD数据，截至目前，南向资金净买入超70亿港元，其中港股通（沪）买入超27.46亿港元，港股通（深）买入超42.87亿港元。", "ctime": 1780291625, "time_str": "13:27:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260601/c677114962.shtml"}, {"id": "4432681", "title": "浙江：拟实施“星火计划”培育未来产业行动 加速量子技术产品规模化应用", "content": "《浙江省实施“星火计划”培育壮大未来产业行动方案（2026—2030年）（征求意见稿）》公开征求意见，提到重点发展具身智能、生物制造、量子科技、脑机接口、氢能和绿色燃料、6G、前沿新材料、细胞与基因治疗、深海科技、空天科技等10个基础条件好、爆发力强的领域。其中，重点发展量子计算核心赛道，做强量子测量优势赛道，做优量子通信潜力赛道，推动量子芯片、核心器件、软件算法与场景应用协同发展，加速量子技术产品规模化应用，抢占量子科技产业发展机遇，打造全国知名的量子产业创新发展高地。", "ctime": 1780291608, "time_str": "13:26:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260601/c677114960.shtml"}, {"id": "4432677", "title": "英伟达将与宇树科技等全球人形机器人制造商合作开发研究用途机器人", "content": "英伟达计划除了与中国宇树科技合作外，也将与美国、欧洲及韩国的人形机器人制造商合作，打造研究用途机器人。（蓝鲸新闻）", "ctime": 1780291579, "time_str": "13:26:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "so const META     = {"update_time": "2026-06-01 14:22:51", "sentiment_score": 59.285714285714285, "agents": []};

// 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';

    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">

        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');

    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>

      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
