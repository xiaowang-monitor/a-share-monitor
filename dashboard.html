司股份2528.44万股，占总股本0.84%，增持金额5.97亿元（不含交易费用）。本次增持计划尚未实施完毕；增持后，深圳东阳光实业及其一致行动人合计持股比例由53.48%升至54.32%，权益变动触及1%刻度。", "ctime": 1793790480, "time_str": "19:08:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261104/c681469793.shtml"}, {"id": "5567103", "title": "伊朗最高领袖称美中期选举结果不会改变美方敌意", "content": "当地时间4日，伊朗最高领袖穆杰塔巴发表声明称，认为美国中期选举结果能改变美方对伊朗敌意的人大错特错，对“霸权敌人”稍有屈服倾向就会令其更加肆无忌惮。他表示，伊朗控制霍尔木兹海峡并摧毁美国在地区国家的军事基地，虽是对美国侵略罪行的回应，但也是一场针对傲慢的斗争；若美国侵略行径重演，伊朗反应将更加广泛，战争规模将会更大。多家美国媒体预测，美国民主党在3日举行的中期选举中力压共和党夺回参议院和众议院控制权，特朗普政府未来两年施政空间将明显收窄，可能在很多方面不得不作出妥协甚至与民主党合作。（央视新闻）", "ctime": 1793790352, "time_str": "19:05:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261104/c681469717.shtml"}, {"id": "5567087", "title": "江苏雷利：实际控制人苏达2026年11月4日被证监会立案", "content": "江苏雷利公告，公司实际控制人、董事、总经理苏达于2026年11月4日收到中国证监会《立案告知书》，因涉嫌信息披露、减持违法违规，中国证监会决定对苏达立案。本次立案调查事项仅为对苏达个人的调查，目前公司各项业务及经营管理情况正常，不会对公司董事会运作及日常经营活动产生重大影响。苏达将积极配合中国证监会的相关调查工作。", "ctime": 1793790334, "time_str": "19:05:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261104/c681469709.shtml"}, {"id": "5566933", "title": "上海银行：董事、高管等增持计划实施完毕，累计增持213.75万股", "content": "上海银行公告，公司部分董事、高级管理人员及中层干部此前计划自2026年7月21日起6个月内以自有资金不低于人民币1500万元增持公司A股股份。截至2026年11月4日，增持主体通过集中竞价累计增持213.75万股，累计增持金额1977.22万元，占本次增持股份计划金额下限的131.81%，本次增持计划实施完毕；增持后合计持有441.61万股，占总股本的0.031%。", "ctime": 1793790128, "time_str": "19:02:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261104/c681469639.shtml"}, {"id": "5566781", "title": "澳新银行：中东铝产能加速恢复 全球铝市2027年或转向过剩", "content": "澳新银行（ANZ）研报称，中东铝产能加速恢复、中国生产维持高位及印尼持续扩产，正推动全球铝市供应紧张局面缓解。该行预计，今年供应缺口将收窄，2027年转为过剩。不过，中东供应风险仍可能使铝价在明年初维持3000美元/吨以上。", "ctime": 1793789956, "time_str": "18:59:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261104/c681469165.shtml"}, {"id": "5566753", "title": "鼎智科技：实际控制人苏达2026年11月4日收到立案告知书", "content": "鼎智科技公告，公司实际控制人、董事苏达于2026年11月4日收到中国证监会《立案告知书》，因苏达涉嫌信息披露、减持违法违规，中国证监会决定对苏达立案。本次立案调查仅为对苏达个人的调查，目前公司各项业务及经营管理情况正常，不会对公司董事会运作及公司日常经营活动产生重大影响，苏达将积极配合中国证监会的相关调查工作。", "ctime": 1793789788, "time_str": "18:56:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261104/c681469116.shtml"}, {"id": "5566721", "title": "首批18只主动ETF，全部结束募集", "content": "11月4日晚间，建信基金发布公告称，建信均衡优选主动管理ETF于10月23日开始募集，原定募集截止日为11月6日，根据有关规定，公司决定将该基金募集截止日期提前至11月4日，即自11月5日起不再接受认购申请。至此，首批18只主动ETF已全部结束募集。（中证金牛座）", "ctime": 1793789539, "time_str": "18:52:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261104/c681469016.shtml"}, {"id": "5566699", "title": "腾亚精工：南京倚峰及南京运航拟向马俊等转让10.00%股份", "content": "腾亚精工公告，实际控制人之一致行动人南京倚峰、南京运航与马俊、芯景铄签订股份转让协议，拟合计转让20753800股，占总股本10.00%；其中南京倚峰转让5.3408%，南京运航转让4.6592%，马俊、芯景铄各受让5.0000%。转让价11.57元/股，总金额2.4亿元。本次转让不会导致控股股东、实际控制人变更，尚需深交所合规性审核及中登公司过户登记。", "ctime": 1793789363, "time_str": "18:49:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261104/c681468951.shtml"}, {"id": "5566679", "title": "弘景光电：董事长兼总经理等7人拟增持不低于1500万元", "content": "弘景光电公告，公司董事长兼总经理赵治平、部分董事及高级管理人员共7人拟自本公告披露之日起6个月内，通过集中竞价交易方式增持公司股份，增持金额合计不低于人民币1500万元，不设定价格区间，资金来源为自有及自筹资金。各主体增持下限：赵治平350万元、周东350万元、程芳陆200万元、赵卫平200万元、曹秀锋200万元、林琼芸100万元、周伟刚100万元。增持股份自实施完成后锁定6个月。", "ctime": 1793789166, "time_str": "18:46:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261104/c681468888.shtml"}, {"id": "5566661", "title": "时隔8年我国罕见病目录制订工作程序迎来修订", "content": "记者4日从国家卫生健康委获悉，为进一步加强我国罕见病管理，提升罕见病目录制订工作的科学性和合理性，强化我国罕见病诊疗和保障水平，国家卫生健康委、国家中医药局对2018年制定的《罕见病目录制订工作程序》进行修订，形成了《罕见病目录制订工作程序（2026年版）》。 新版工作程序明确了纳入目录病种应当同时满足的条件、增加目录病种的申请主体、申请材料的要求、国家卫生健康委罕见病诊疗与保障专家委员会及专家委员会办公室的工作职能、目录调整工作程序等内容。 本次修订的主要内容包括：一是增加了可纳入罕见病目录的情形，扩大了罕见病目录覆盖病种范围；二是增加目录病种的申请主体，充分发挥各有关专业机构的作用；三是增加国家中医药局作为联合发文单位，明确中医药主管部门职责，强化罕见病防治工作中的中西医协同融合；四是优化罕见病目录制订周期，实践中根据实际情况及时更新；五是明确了罕见病目录供有关部门在工作中参考使用。(新华社)", "ctime": 1793789052, "time_str": "18:44:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261104/c681468847.shtml"}, {"id": "5566645", "title": "伊朗最高领袖回应美国中期选举", "content": "伊朗最高领袖穆杰塔巴11月4日就伊美关系发表声明，表示认为美国党派更迭能够改变华盛顿对伊朗敌意的人大错特错，实现绝对威慑的道路在于一个“更加强大的伊朗”。（CCTV国际时讯）", "ctime": 1793788940, "time_str": "18:42:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261104/c681468812.shtml"}, {"id": "5566643", "title": "已有20城落地“8·28”新政实施细则", "content": "根据中指研究院监测数据显示，截至11月4日，8·28新政后已有北京、上海、广州、深圳、武汉、杭州等20城落地实施细则， 另有南昌、绵阳、泸州等城市对实施细则征求意见。各地共同以“新老划断、分类推进”落实预售要求，明确重点监管额度、现房销售、主办银行制和土地款分期等细则，更多城市土地出让金分期缴纳余款在2年内缴清，并鼓励保函置换，支持项目分期开发、分期竣备等。", "ctime": 1793788922, "time_str": "18:42:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261104/c681468794.shtml"}, {"id": "5566599", "title": "江苏有线：全资子公司拟不高于1亿元参与设立产业并购基金", "content": "江苏有线公告，公司全资子公司江苏睿辉股权投资管理有限责任公司拟作为有限合伙人认购江苏省产业并购基金（有限合伙）份额，认购金额不高于1亿元，基金总规模70亿元。本次交易已获公司第六届董事会第二十六次会议审议通过，无需提交股东会审议。基金目前处于筹备阶段，尚未正式签署合伙协议，未完成工商注册登记，尚需完成中国证券投资基金业协会备案手续。", "ctime": 1793788603, "time_str": "18:36:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261104/c681468689.shtml"}, {"id": "5566593", "title": "步长制药：泸州步长增资完成工商变更，公司持股92.3641%", "content": "步长制药公告，公司此前披露控股子公司四川泸州步长生物制药有限公司拟增资扩股引入外部投资者，公司放弃优先认购权并承担回购义务。近日，泸州步长已完成上述增资事项的工商变更登记手续，并取得泸县市场监督管理局换发的营业执照，注册资本为肆亿陆仟陆佰陆拾叁万壹仟伍佰柒拾玖元整。本次变更后，公司持有泸州步长92.3641%股权。", "ctime": 1793788598, "time_str": "18:36:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261104/c681468687.shtml"}, {"id": "5566583", "title": "美光科技美股盘前涨超2%", "content": "美光科技美股盘前涨超2%，现报872.72美元。", "ctime": 1793788572, "time_str": "18:36:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261104/c681468666.shtml"}, {"id": "5566569", "title": "五部门：系统推进矿产资源节约集约利用，加强重要战略性矿产高质高效综合利用", "content": "国家发展改革委等五部门印发《实施全面节约战略行动方案》，其中提到，加强矿产资源综合利用。系统推进矿产资源节约集约利用，加强重要战略性矿产高质高效综合利用，强化开采回采率、选矿回收率、综合利用率等关键指标的激励约束作用。深化战略性矿产共伴生、低品位资源再评价，鼓励对共伴生矿产进行综合利用。到2030年，主要有色金属共伴生矿产综合利用率比2025年提高2—3个百分点。", "ctime": 1793788520, "time_str": "18:35:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261104/c681468630.shtml"}, {"id": "5566565", "title": "英伟达美股盘前涨超2%", "content": "英伟达美股盘前涨超2%，现报210.845美元。", "ctime": 1793788492, "time_str": "18:34:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261104/c681468619.shtml"}, {"id": "5566563", "title": "五部门：加快绿色矿山建设，新建矿山正式投产1—2年内建成绿色矿山", "content": "国家发展改革委等五部门印发《实施全面节约战略行动方案》，其中提到，推进绿色勘查开采。全面推进绿色勘查，推广应用智能化绿色化勘查开发技术装备。加快绿色矿山建设，新建矿山正式投产1—2年内建成绿色矿山，在产矿山加快绿色化升级改造。到2030年，持证在产大型矿山90%以上、中型矿山80%以上达到绿色矿山标准，小型矿山参照绿色矿山标准加强管理。", "ctime": 1793788485, "time_str": "18:34:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261104/c681468618.shtml"}, {"id": "5566551", "title": "五部门：推进算力、通信基站和机房等基础设施节能降碳改造", "content": "国家发展改革委等五部门印发《实施全面节约战略行动方案》，其中提到，大力推进重点领域节能。聚焦钢铁、有色、石化、化工、建材等重点行业，“一行一策”开展节能降碳改造，持续提升能效水平。积极推进既有建筑节能降碳改造，促进超低能耗建筑规模化发展。推广节能低碳运输工具，合理优化车辆能耗限值要求，大力发展新能源重卡和绿色燃料船舶。加大公共机构节能降碳改造挖潜力度，推广合同能源管理等第三方治理模式。推进算力、通信基站和机房等基础设施节能降碳改造，优化用能结构。提高能源生产效率，加强煤电机组低碳化改造等，稳步降低电网综合线损率。到2030年， 利共赢的美好未来。", "ctime": 1793788011, "time_str": "18:26:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261104/c681468392.shtml"}, {"id": "5566401", "title": "大众汽车（中国）销售有限公司、上汽大众汽车有限公司、一汽-大众汽车有限公司召回部分进口及国产汽车", "content": "大众汽车（中国）销售有限公司、上汽大众汽车有限公司、一汽-大众汽车有限公司根据《缺陷汽车产品召回管理条例》等要求，向国家市场监督管理总局备案召回计划，自2027年1月15日起，召回部分进口及国产汽车。召回范围为：进口高尔夫及途威系列22036辆；国产途昂116864辆、途昂X 24977辆、威然8529辆、奥迪Q6 20369辆；国产揽境29264辆、奥迪Q3 388258辆。因长期受水分及道路融雪剂影响，副车架与转向机右侧固定螺栓可能锈蚀断裂，导致转向功能受限。厂家将委托授权经销商免费更换改进后的固定螺栓，并通过短信、挂号信等方式通知车主。（市场监管总局）", "ctime": 1793787919, "time_str": "18:25:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261104/c681468353.shtml"}, {"id": "5566399", "title": "克莱斯勒（中国）汽车销售有限公司、斯泰兰蒂斯（上海）汽车有限公司召回部分进口牧马人和角斗士汽车", "content": "克莱斯勒（中国）汽车销售有限公司、斯泰兰蒂斯（上海）汽车有限公司根据《缺陷汽车产品召回管理条例》等要求，向国家市场监督管理总局备案召回计划：克莱斯勒召回2020年8月22日至2024年8月19日生产的部分进口牧马人18544辆、2022年1月4日至2022年9月1日生产的部分进口角斗士1853辆；斯泰兰蒂斯召回2023年6月7日至2024年10月15日生产的部分进口牧马人5948辆、2023年4月3日至2023年12月20日生产的部分进口角斗士1811辆。因制造原因，电动液压助力转向泵连接器针脚排不符合规范，可能造成电气连接不良、转向助力失效，极端情况下可能引发连接器和周边区域过热、存在起火风险。召回范围内车辆将免费检查连接器与泵端接口是否完全插合，若不符合则免费更换电动液压助力转向泵及线束。（市场监管总局）", "ctime": 1793787880, "time_str": "18:24:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261104/c681468334.shtml"}, {"id": "5566395", "title": "广汽丰田汽车有限公司召回部分国产汽车", "content": "广汽丰田汽车有限公司根据《缺陷汽车产品召回管理条例》等要求，向国家市场监督管理总局备案召回计划：召回编号S2026M0124V，召回2025年2月27日至2026年3月26日期间生产的部分铂智3X车辆100175辆，因固定前悬架平衡杆拉杆螺母设计考虑不充分，螺母可能松动异响，极端情况下脱出影响行驶稳定性；召回编号S2026M0125V，召回2025年10月28日至2026年8月3日期间生产的部分铂智7车辆18130辆，因舒适停车功能软件控制程序考虑不充分，低速行驶特定条件下制动力输出可能受限、制动距离变长；召回编号S2026M0126V，召回2026年3月10日至2026年5月15日期间生产的部分铂智7车辆2955辆，因前部识别摄像机软件控制程序考虑不充分，OTA升级过程中可能异常，激活集成式巡航辅助功能后可能引发方向盘非预期转动。广汽丰田将免费更换螺母或升级软件程序消除隐患，并通过手机APP、电话等方式通知用户。（市场监管总局）", "ctime": 1793787833, "time_str": "18:23:53", "stock_code": "", "stock_name" const SECTORS  = [{"name": "金融", "hit_count": 42, "etfs": []}, {"name": "半导体", "hit_count": 21, "etfs": []}, {"name": "消费", "hit_count": 15, "etfs": []}, {"name": "人工智能", "hit_count": 13, "etfs": []}, {"name": "数据要素", "hit_count": 11, "etfs": []}, {"name": "医药", "hit_count": 10, "etfs": []}, {"name": "新能源", "hit_count": 7, "etfs": []}, {"name": "军工", "hit_count": 4, "etfs": []}];
const META     = {"update_time": "2026-11-04 19:20:47", "sentiment_score": 61.228813559322035, "agents": []};

// 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
