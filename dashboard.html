ock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260902/c679534535.shtml"}, {"id": "5091171", "title": "伟思医疗：胡平拟减持不超过2%股份", "content": "伟思医疗公告，股东胡平持有公司1571.8万股，占总股本16.41%，拟通过集中竞价、大宗交易方式减持不超过191.54万股，占总股本不超过2%。其中，集中竞价和大宗交易方式分别减持不超过95.77万股，减持期间为2026年9月24日至2026年12月22日。", "ctime": 1788345991, "time_str": "18:46:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260902/c679534534.shtml"}, {"id": "5091139", "title": "台积电季度芯片制造设备需求今年几乎翻倍", "content": "台积电联席首席运营官侯永清今日表示，随着公司扩大产能以满足人工智能需求，其对芯片制造设备的需求较去年年底以来几乎翻了一倍。侯永清称，公司已将季度设备采购预估提高至去年12月预测水平的约1.9倍。这是人工智能开发商需求旺盛以及全球数据中心大规模扩建进一步推高芯片需求的最新迹象。台积电目前还面临缺乏有经验建筑工人的问题，公司正试图在中国台湾地区及海外建设并配备约20座工厂，其扩张力度在公司历史上前所未有。过去，台积电通常同时推进4至5座新厂房的建设。侯永清表示：“目前几乎是在以过去4到5倍的速度追赶，但依然无法满足需求。”", "ctime": 1788345729, "time_str": "18:42:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260902/c679534457.shtml"}, {"id": "5091133", "title": "节卡机器人回应专利诉讼：未收到正式法律文书", "content": "针对有媒体报道称，美国泰瑞达公司位于丹麦的子公司泰瑞达机器人对节卡机器人德国子公司 JAKA Robotics (Germany) GmbH 提起专利诉讼，节卡机器人方面表示，截至本声明日，公司尚未收到上述案件的正式法律文书。基于完整技术溯源与专利比对分析，节卡机器人认为不存在侵犯对方专利权的情形。公司充分尊重知识产权，同时也会坚定维护公司合法权益不受侵害。针对本次诉讼，公司已启动法律应对程序。（科创板日报）", "ctime": 1788345711, "time_str": "18:41:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260902/c679534455.shtml"}, {"id": "5091121", "title": "翰宇药业：坪山分公司第二次通过FDA现场检查", "content": "翰宇药业公告，坪山分公司于2026年6月18日至26日接受美国FDA cGMP常规监督检查，近日收到FDA签发的EIR报告，检查结论为VAI（Voluntary Action Indicated，自愿整改），质量管理体系符合美国FDA cGMP要求。此次为坪山分公司继2023年7-8月首次通过FDA批准前检查（PAI）后第二次接受FDA检查并顺利通过。", "ctime": 1788345592, "time_str": "18:39:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260902/c679534430.shtml"}, {"id": "5091103", "title": "以军称袭击黎南部真主党目标", "content": "以色列军方2日发表声明称，当天凌晨，黎巴嫩真主党向驻扎在黎南部“安全区”的以军发射两架自杀式无人机，以军随后对真主党目标发动袭击。\n\n声明称，以军击落其中一架无人机，并打击了黎南部奈拜提耶地区的真主党军事设施。以军将继续在阿里·塔赫尔山脊地区开展行动。\n\n另据黎巴嫩方面消息称，以色列军队2日凌晨持续对黎南部奈拜提耶地区进行空袭和炮击，造成多处房屋等设施受损。目前，暂无人员伤亡报告。\n\n黎以美三方6月26日在美国华盛顿完成谈判后，宣布达成框架协议。根据协议设想，以军将从黎南部部分地区撤出，由黎军队接管当地安全事务。但自协议达成以来，以军仍多次对黎境内目标发动军事打击。(央视新闻)", "ctime": 1788345376, "time_str": "18:36:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260902/c679534399.shtml"}, {"id": "5091085", "title": "普京：俄方希望结束战争而非临时冻结", "content": "当地时间9月1日，俄罗斯总统普京在上合组织比什凯克峰会结束后的记者会上表示，俄方希望结束战争，在乌克兰和整个欧洲实现持久、彻底的和平，俄方随时准备与任何愿意参与谈判的人进行谈判。\n\n在提及乌克兰总统泽连斯基关于“俄罗斯领空不再安全”的讲话时，普京称相关言论属于“国家恐怖主义行径”。俄方尊重主张和平解决乌克兰问题的伙伴国家立场，但俄方不会同“恐怖分子”进行谈判。他还否认了俄方将在国家杜马选举后进行新一轮动员的传言，称此类消息是针对俄方的“信息战”。(央视新闻)", "ctime": 1788345169, "time_str": "18:32:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260902/c679534292.shtml"}, {"id": "5091077", "title": "安集科技：2026年9月2日递交H股发行并上市申请", "content": "安集科技公告，公司此前审议通过发行H股股票并在香港联合交易所有限公司上市相关议案。2026年9月2日，公司已通过保密形式向香港联合交易所有限公司递交H股发行并上市申请资料，并将履行中国证券监督管理委员会备案手续。", "ctime": 1788345151, "time_str": "18:32:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260902/c679534286.shtml"}, {"id": "5091071", "title": "海关总署发布第九届进博会通关便利措施", "content": "海关总署近日发布《2026年第九届中国国际进口博览会海关通关须知》与《海关支持2026年第九届中国国际进口博览会便利措施》，在总结前八届进博会监管服务经验基础上，推出系列通关便利化举措，全力护航第九届进博会顺利举办。本次出台的两套文件，围绕展品入境申报、查验监管、展后处置全链条明确操作规范，聚焦境外参展企业实际痛点，优化通关流程、简化审批手续，落实展品税收优惠、担保模式、检验检疫便利等支持政策，降低展商参展制度性成本。", "ctime": 1788345096, "time_str": "18:31:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260902/c679534266.shtml"}, {"id": "5091035", "title": "紫金龙净：向紫金矿业发行1.42亿股完成登记", "content": "紫金龙净公告，公司此前披露2025年度向特定对象发行A股股票。本次公司于2026 s.10jqka.com.cn/20260902/c679533869.shtml"}, {"id": "5090873", "title": "欣天科技：石伟平等拟转让22.4999%股份获深交所确认", "content": "欣天科技公告，公司此前披露石伟平、刘辉、薛枫、汪长华拟通过协议转让方式向深圳元启转让合计4342.24万股股份，占总股本的22.4999%。2026年9月2日，公司获悉深交所已出具股份协议转让确认书，确认书有效期为六个月，后续需办理股份过户登记。", "ctime": 1788343772, "time_str": "18:09:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260902/c679533822.shtml"}, {"id": "5090843", "title": "中国人民银行行长潘功胜：中国人民银行将持续推进货币政策框架转型，继续实施好适度宽松的货币政策", "content": "2026年8月31日至9月1日，二十国集团（G20）在美国阿什维尔召开今年第二次财长和央行行长会议。会议讨论了全球经济形势与前景、促进经济增长、全球失衡、发展中国家主权债务等议题。中国人民银行行长潘功胜出席会议并发言。与会各方认为全球经济增长面临多重风险挑战但仍保持韧性。为实现稳定、可预期的经济增长环境，各国应加强政策协调，降低市场主体面临的不确定性。各方支持G20财金渠道加强经验互鉴，应对经济增长障碍。各方呼吁G20加强合作，支持发展中国家解决债务问题，呼吁顺差国和逆差国携手共同缓解全球失衡。潘功胜表示，中国经济运行总体平稳向好，结构持续优化，高质量发展不断取得新进展，金融市场平稳运行，经济长期向好的基本面与支撑条件没有改变。中国政府坚持并持续推进经济结构的转型升级，并将此作为“十五五”规划的战略重点。中方从不刻意追求贸易顺差，坚持扩大内需、坚持高水平对外开放，以中国大市场为各方提供新机遇，为新一轮全球经济动态平衡贡献力量。中国人民银行将持续推进货币政策框架转型，完善利率体系，继续实施好适度宽松的货币政策，为中国经济稳定增长和金融市场的平稳运行营造良好的货币金融环境。(央行)", "ctime": 1788343718, "time_str": "18:08:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260902/c679533796.shtml"}, {"id": "5090835", "title": "日本防卫省2027财年预算创下历史新高，AI领域是重点", "content": "据日本多家媒体报道，8月31日，日本防卫省对外公布2027财年预算申请草案，总额约8.89万亿日元（约合人民币3738亿元），创下历史新高。另外，推进人工智能（AI）的军事化应用也是本次预算申请重点。据《日本经济新闻》8月31日援引一名负责防卫政策的自民党议员消息，最终预算总额可能突破10万亿日元。高市早苗上台以来，日本“新型军国主义”引发多方警惕。日本此次预算不仅金额巨大且提高了积极进攻能力，再次敲响警钟。（环球时报）", "ctime": 1788343636, "time_str": "18:07:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260902/c679533747.shtml"}, {"id": "5090787", "title": "俄罗斯总统普京在上合组织比什凯克峰会结束后的记者会上表示，俄方希望结束战争", "content": "当地时间9月1日，俄罗斯总统普京在上合组织比什凯克峰会结束后的记者会上表示，俄方希望结束战争，在乌克兰和整个欧洲实现持久、彻底的和平，俄方随时准备与任何愿意参与谈判的人进行谈判。（CCTV国际时讯）", "ctime": 1788343419, "time_str": "18:03:39", "stock_code": "", "stock_name": "", "stock_market": "", "i   const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
