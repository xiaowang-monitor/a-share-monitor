升高，有关方宣称本地区石油、电力等基础设施可能成为重要打击目标。中国驻沙特大使馆再次提醒在沙中国公民密切关注安全形势和沙有关部门发布的相关公告和警报，遵守当地法律法规，切实增强安全防范意识，减少外出。远离敏感区域，不随意拍摄，不在社交媒体传播相关信息。保持冷静，如遇紧急情况，及时采取就地避难等措施，报警并联系中国驻沙特大使馆、驻吉达总领馆寻求协助。", "ctime": 1775454344, "time_str": "13:45:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260406/c675780733.shtml"}, {"id": "4188127", "title": "中国AI大模型调用量环比增逾31% 连续五周超越美国", "content": "记者根据OpenRouter最新数据测算，上周（3月30日至4月5日）全球AI大模型总调用量为27万亿Token，环比增长18.9%。其中，上榜的AI大模型中，中国AI大模型的周调用量上升至12.96万亿Token，较此前一周上涨31.48%；美国AI大模型周调用量为3.03万亿Token，环比增长0.76%。中国AI大模型周调用量连续五周增长，且连续五周超越美国。 (每日经济新闻)", "ctime": 1775453706, "time_str": "13:35:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260406/c675780719.shtml"}, {"id": "4188121", "title": "东盟与中日韩宏观经济研究办公室：2026年地区经济预计增长4%", "content": "东盟与中日韩宏观经济研究办公室发布年度报告《2026年东盟与中日韩区域经济展望》。报告预计，东盟与中日韩地区2026年和2027年经济增长均为4.0%。报告同时指出，中东冲突持续升级以及全球能源供应受扰显著加大区域经济前景的下行风险。报告显示，2025年该地区经济增长达4.3%，高于此前预期。其中，人工智能带动的半导体需求成为出口增长的重要动力。报告显示，东盟与中日韩区域经济结构正在发生深刻变化。目前，该地区已成为全球最大市场之一，占全球最终需求的28%。与此同时，对美国市场的依赖程度明显下降，区域经济正由“面向外部市场的生产基地”向“以内需驱动的区域市场”转型。报告同时指出，中东冲突对该地区的影响将取决于其持续时间。若冲突延续，其冲击可能更加广泛且持久，不仅局限于能源市场，还将波及工业投入品、物流、食品价格、旅游业以及跨境汇款等领域。", "ctime": 1775452990, "time_str": "13:23:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260406/c675780692.shtml"}, {"id": "4188047", "title": "韩国考虑避开霍尔木兹海峡找油", "content": "韩国知情官员6日说，执政党共同民主党与政府当天达成一致，准备派特使前往沙特阿拉伯、阿曼和阿尔及利亚开拓原油进口渠道。韩国共同民主党国会议员安道杰6日告诉韩联社，共同民主党议员与政府官员当天在国会讨论寻找新的原油进口来源，以弥补因霍尔木兹海峡航运受阻造成的原油缺口。韩国能源高度依赖进口，约七成原油来自中东地区，其中95%以上经由霍尔木兹海峡运输。安道杰说，韩国正与不经由霍尔木兹海峡出口的产油国联系协商。另外，韩国打算向沙特红海港口延布派遣5艘悬挂韩国国旗的船只运油。 (新华社)", "ctime": 1775451485, "time_str": "12:58:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260406/c675780651.shtml"}, {"id": "4188021", "title": "泽连斯基访叙利亚 “推销”武器和粮食", "content": "乌克兰总统泽连斯基5日抵达叙利亚，这是他在两国去年9月恢复外交关系后首次访问叙利亚。按照多家媒体说法，泽连斯基此行意在向叙新政权兜售反无人机系统和粮食。泽连斯基5日晚些时候在社交媒体上说，同叙过渡政府总统沙拉在大马士革举行会谈，就加强安全合作达成一致。泽连斯基还说，他向沙拉表示，乌克兰作为产粮大国，是“可信赖的粮食供应方”，愿为中东地区粮食安全作出贡献。 (新华社)", "ctime": 1775449674, "time_str": "12:27:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260406/c675780572.shtml"}, {"id": "4188003", "title": "伊朗导弹击中以色列海法居民楼 已致2人死亡", "content": "以色列消防救援部门6日称，在海法被伊朗弹道导弹击中的居民楼废墟下，已找到两具遇难者遗体。该部门表示，目前救援行动仍在进行中，以营救另外两名下落不明的人员。当地时间4月5日下午，在伊朗发射的导弹袭击中，有导弹击中以色列北部城市海法，当地一处住宅楼严重受损。据以色列军方消息称，以色列防空系统发射了多枚拦截导弹，但最终未能拦截伊朗导弹。(央视新闻)", "ctime": 1775449034, "time_str": "12:17:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260406/c675780553.shtml"}, {"id": "4187995", "title": "清明假期迎返程高峰 三天假期跨区域人员流动量预计达8.4亿人次", "content": "今天是清明假期的最后一天，全国出行迎来返程高峰，全社会跨区域人员流动量增长明显。交通运输部数据显示，三天假期，全社会跨区域人员流动量预计达8.4亿人次，铁路、公路、民航首日客运量均超历史同期峰值。今天，全国铁路预计发送旅客2080万人次，计划加开旅客列车1369列。（央视新闻）", "ctime": 1775448497, "time_str": "12:08:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260406/c675780529.shtml"}, {"id": "4187925", "title": "以军称打击了德黑兰的伊朗国家机构目标", "content": "以色列国防军6日在社交媒体上发文称，以军完成了一轮针对位于德黑兰的伊朗国家机构目标的打击。另据多家伊朗媒体6日早些时候报道，德黑兰多次响起爆炸声。 (新华社)", "ctime": 1775445799, "time_str": "11:23:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260406/c675780400.shtml"}, {"id": "4187905", "title": "美以空袭伊朗谢里夫理工大学", "content": "据伊朗方面6日消息，美国和以色列对伊朗谢里夫理工大学实施了空袭。消息称，空袭破坏了谢里夫理工大学的燃气站，该地区暂时面临燃气中断。另据伊朗方面发布的照片，该大学清真寺也遭到空袭，屋内墙体、天花板遭到破坏，地面堆积家具碎片、灰尘遍布。据伊朗方面4日消息，伊朗科学部长侯赛因·西迈·萨拉夫说，伊朗已有30所大学遭到直接攻击，5名教授和60多名大学生在美以袭击中丧生，袭击基础设施是“反人类罪行”。 (央视新闻)", "ctime": 1775444983, "time_str": "11:09:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260406/c675780363.shtml"}, {"id": "4187871", "title": "埃及上调电价以应对能源危机", "content": "埃及政府近日宣布，将全面上调商业电价并调高部分居民用户电价，以应对美以伊战事引发的能源危机。埃及电力和可再生能源部发表声明称，自4月起，商业电价将平均上调20%；针对居民用电，月用电量超出规定阶梯额度的部分平均涨价16%。声明称，埃及电网约四成居民用户的用电量处于较低阶梯水平，其中大部分人将不受电价上调影响。 (央视新闻)", "ctime": 1775444071, "time_str": "10:54:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260406/c675780309.shtml"}, {"id": "4187853", "title": "消息人士：美伊调解方为争取45天停火做最后努力", "content": "记者获悉，当地时间4月5日，据四位了解谈判情况的消息人士透露，美国、伊朗和一组地区调解人正在讨论一项可能为期45天的停火协议，该协议有望永久结束这场战事。消息人士称，未来48小时内达成部分协议的可能性微乎其微。但这项最后的努力是阻止战事急剧升级的唯一机会，否则伊朗民用基础设施将遭受大规模袭击，且海湾国家的能源和水利设施会遭受报复。白宫方面目前对此拒绝置评。 (央视新闻)", "ctime": 1775442725, "time_str": "10:32:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260406/c675780237.shtml"}, {"id": "4187821", "title": "六部门：支持符合条件的电商企业发行债券融资 优化融资等政策流程", "content": "商务部等6部门发布关于更好服务实体经济 推进电子商务高质量发展的指导意见。其中提到，发挥产业投资基金和科创母基金作用，在依法合规、风险可控前提下，鼓励金融机构结合电商企业融资需求，完善多样化的金融服务模式。综合运用贷款、股权等手段，为电商业态模式创新提供全链条全生命周期、多元化接力式金融服务。鼓励金融机构与电商企业合作，创新信贷产品和服务。支持符合条件的电商企业发行债券融资，优化融资等政策流程，支持符合条件的电商企业在境内外上市融资。", "ctime": 1775441447, "time_str": "10:10:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260406/c675780150.shtml"}, {"id": "4187801", "title": "六部门：发展“人工智能+电商” 引导电商企业加强人工智能大模型等技术研发应用", "content": "商务部等6部门发布关于更好服务实体经济 推进电子商务高质量发展的指导意见。其中提到，支持头部电商企业加大研发投入，加强重点领域核心技术攻关，构建“产研协同、学用转化”创新生态。发展“人工智能+电商”，引导电商企业加强人工智能大模型等技术研发应用，优化消费体验、降低运营成本、提升流通效能。鼓励电商企业科技向善，统筹各方利益优化算法规则。加强电商领域技术成果司法保护，探索建立证据披露、证据妨碍排除等规则，适当减轻权利人举证负担。开展电商科技创新应用案例遴选，深化数字技术应用。", "ctime": 1775440882, "time_str": "10:01:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260406/c675780103.shtml"}, {"id": "4187781", "title": "日本政府考虑5月追加释放国家石油储备", "content": "日本媒体5日报道，受中东局势影响，日本原油进口量骤降，引发广泛担忧。日本政府正考虑于5月追加释放国家石油储备，释放量相当于日本约20天的用量。（新华社）", "ctime": 1775440596, "time_str": "09:56:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260406/c675780077.shtml"}, {"id": "4187769", "title": "伊称向以发射三轮导弹 以称其中至少10枚导弹携带集束弹头", "content": "伊朗方面称，在20分钟内，伊朗向以色列领土发射了三轮导弹。以色列方面称，伊朗在三轮导弹袭击中，发射了至少10枚携带集束弹头的导弹。 (央视新闻)", "ctime": 1775439612, "time_str": "09:40:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260406/c675780030.shtml"}, {"id": "4187765", "title": "华泰证券：看好中国头部家电企业继续提升中东市场份额", "content": "华泰证券研报表示，中东地缘冲突持续，霍尔木兹海峡航线受阻、区域消费信心短期承压，对我国家电出口带来一定扰动。若海峡持续封锁，此类高强度扰动带来的短期冲击主要体现在海湾国家终端消费信心走弱、经销商库存趋于保守、进入海湾港口航次减少、保险和运价上升，从而压制家电订单节奏；但从中长期看，海湾国家人口增长、地产与基建扩张、高温气候强化空调刚需，以及中国品牌持续替代日韩品牌的逻辑并未改变。华泰证券看好中国头部家电企业继续提升中东市场份额。", "ctime": 1775439345, "time_str": "09:35:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260406/c675780009.shtml"}, {"id": "4187755", "title": "伊朗最高领袖顾问警告美国：或将封锁曼德海峡作为反制", "content": "伊朗最高领袖外事顾问韦拉亚提5日警告美国，若“再犯错误”，伊朗主导的抵抗阵线将以封锁曼德海峡作为反制措施。韦拉亚提当天在社交媒体上发文说：“今天，抵抗阵线的统一指挥部视曼德海峡如同霍尔木兹海峡一般。如果白宫再犯愚蠢错误，它很快就会意识到，只需一个举动，全球能源和贸易流通就会中断。”曼德海峡连接红海和亚丁湾，是连通大西洋、地中海和印度洋的咽喉要道。这一海峡处于也门胡塞武装控制范围内。有媒体认为，韦拉亚提的帖文是对美国总统特朗普当天对伊朗所发出威胁的回应。特朗普5日发帖文，再次要求伊朗打开霍尔木兹海峡，并威胁说“4月7日将是伊朗的发电厂日和大桥日”，暗示要猛烈轰炸伊朗的发电厂和大桥。 (新华社)", "ctime": 1775438776, "time_str": "09:26:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260406/c675779962.shtml"}, {"id": "4187733", "title": "全国铁路今天预计发送旅客2080万人次", "content": "记者从国铁集团获悉，今天（4月6日）全国铁路预计发送旅客2080万人次，计划加开旅客列车1369列。昨天（4月5日），全国铁路发送旅客1475.6万人次，运输安全平稳有序。 (央视新闻)", "ctime": 1775437693, "time_str": "09:08:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260406/c675779865.shtml"}, {"id": "4187725", "title": "三月深圳楼市“量涨价稳” 一二手房网签量创近11个月新高", "content": "记者从深圳市房地产业协会获悉，3月深圳楼市回暖，一、二手房网签量7898套，环比上涨117%，创近11个月新高，市场活跃度明显提升，呈现“量涨价稳”的复苏态势。3月深圳一手住宅预售网签1571套，环比上涨109%；现售网签1256套，环比上涨130%；合计网签2827套，环比上涨118%。深圳市房地产业协会负责人认为，受春节假期后市场复工、房企推盘节奏恢复、购房需求集中释放等因素带动，3月深圳新房市场较2月淡季实现明显回暖。当前市场复苏力度弱于去年同期，市场呈现季节性修复、复苏力度偏弱的特征。3月二手房市场趋稳，回暖趋势明显。乐有家研究中心数据显示，全月二手住宅网签5071套，环比上涨117%，持续稳定在业内公认的5000套“荣枯线”水平之上。 (深圳特区报)", "ctime": 1775437457, "time_str": "09:04:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260406/c675779830.shtml"}, {"id": "4187705", "title": "伊朗外长与印度外长就中东局势通话", "content": "据伊朗国家电视台5日报道，伊朗外长阿拉格齐当天与印度外长苏杰生通话，就近期中东局势进行讨论。阿拉格齐表示，美国和以色列对伊朗人民犯下严重罪行，对伊朗工业和生产基础设施、和平利用且受到保护的核设施进行攻击。美国持续公开威胁攻击伊朗能源基础设施，国际社会和联合国有责任制止这一行为，遏制战争罪行正常化。阿拉格齐还说，美国和以色列的军事侵略将对地区乃至世界的稳定与安全造成日益严重的后果。苏杰生强调恢复地区稳定与安全的重要性，并表示印度支持在地区和国际层面为制止战争所作的努力。 (新华社)", "ctime": 1775436879, "time_str": "08:54:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260406/c675779789.shtml"}, {"id": "4187697", "title": "伊朗强调继续封锁霍尔木兹海峡", "content": "伊朗最高领袖办公室5日在社交媒体上摘发最高领袖穆杰塔巴·哈梅内伊首次讲话内容，强调伊朗人民希望继续进行有效且令对方蒙羞的抵御行为，重申必须继续封锁霍尔木兹海峡。 (新华社)", "ctime": 1775436359, "time_str": "08:45:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260406/c675779751.shtml"}, {"id": "4187691", "title": "以军称正拦截从伊朗发射的导弹", "content": "以色列国土防卫司令部当地时间6日凌晨称监测到从伊朗向以色列发射的导弹，正在进行拦截。以色列中部多地响起防空警报。 (央视新闻)", "ctime": 1775436142, "time_str": "08:42:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260406/c675779737.shtml"}, {"id": "4187687", "title": "超百家机构扎堆调研5只脑机接口概念股", "content": "在多重因素叠加推动下，脑机接口技术有望进入大规模商业化落地“黄金窗口期”，2026年成为脑机接口规模化应用元年。据统计，A股市场涉及脑机接口概念的股票合计不到30只，这些概念股中，一部分通过参股脑机接口企业间接布局，另一部分通过与院校合作进行开发，还有部分自研了脑机接口产品。机构调研信息揭示了脑机接口概念股的布局进展。据统计，截至4月3日收盘，今年以来合计有5只概念股获得100家以上机构调研，分别是翔宇医疗、爱朋医疗、熵基科技、博拓生物、三七互娱。 (证券时报)", "ctime": 1775436035, "time_str": "08:40:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260406/c675779734.shtml"}, {"id": "4187677", "title": "伊朗库姆省一民宅遭美以袭击 已造成5人死亡", "content": "当地时间6日，据伊朗方面消息，库姆省负责政治和安全事务的副省长表示，当天上午，库姆市一处民宅遭到美以袭击，造成5人死亡。由于目前仍在进行废墟清理工作，死亡人数可能还会增加。(央视新闻)", "ctime": 1775435671, "time_str": "08:34:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260406/c675779680.shtml"}, {"id": "4187657", "title": "青岛9部门联合发布 推动57个过亿元汽车产业项目建设", "content": "青岛市工业和信息化局、青岛市发展改革委等9部门近日联合印发《青岛市汽车行业稳增长工作方案》，明确2026年产业发展目标和重点发力方向。方案提出，2026年度青岛整车产量稳定在100万辆左右，其中，新能源汽车产量达到45万辆，进一步补齐“三电”系统、车用芯片、智能座舱等核心配套短板。从项目上看，青岛将推动57个过亿元汽车产业项目建设，加快一汽锻造、解放商用车、奇瑞KD项目等2025年总投资142亿元的16个过亿元竣工项目达产，2026年新增产值128亿元；推动总投资158亿元的28个在建项目建设，预计2026年竣工项目27个，全部达产后新增产值135亿元。 (青岛日报)", "ctime": 1775434949, "time_str": "08:22:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260406/c675779565.shtml"}, {"id": "4187651", "title": "韩国KOSPI指数涨幅扩大至2%", "content": "韩国综合指数（KOSPI）涨幅扩大至2%，现报5486.89点。三星电子涨近4%，SK海力士涨超2%。", "ctime": 1775434895, "time_str": "08:21:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260406/c675779563.shtml"}, {"id": "4187619", "title": "海南首条沥青特种集装箱直达航线开通", "content": "据海南日报，4月5日，载有20个沥青特种集装箱的“港宏瑞福”轮从洋浦港驶离，启航前往泰国林查班港。这标志着洋浦港至泰国林查班港的沥青罐式集装箱直达航线正式开通并顺利实现首航启运，同时这也是我省首条沥青特种集装箱直达航线。", "ctime": 1775433818, "time_str": "08:03:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260406/c675779442.shtml"}, {"id": "4187613", "title": "一季度ETF总规模蒸发逾万亿元 部分公司逆势“吸金”", "content": "截至一季度末，全市场ETF合计规模约4.99万亿元，较去年底减少约1.03万亿元。尽管宽基品种成为主要拖累，仍有部分公司实现逆势增长。其中，海富通基金一季度规模增量超过300亿元，居行业首位；国泰基金增量逾160亿元，总规模成功突破3000亿元；永赢基金增量超140亿元，位列第三。从产品端看，电网设备、短融、黄金、卫星通信等主题类ETF成为资金流入的主力方向，取代了传统的宽基品种，显示出震荡市中投资者偏好正加速向细分赛道与避险资产切换。（证券时报）", "ctime": 1775433145, "time_str": "07:52:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260406/c675779315.shtml"}, {"id": "4187599", "title": "上海电气总包兰州新区绿色甲醇项目正式开工", "content": "近日，兰州新区10万吨/年生物质绿色甲醇项目正式开工。上海电气电站集团将为其提供关键技术、核心装备及EPC总承包服务。项目位于兰州新区化工园区，核心建设年产10万吨生物质绿色甲醇生产线，同步配套建设生物质原料预处理中心、生物质气化、绿色甲醇合成及精馏车间等全套设施，建成后将带动该地区农业、新能源、绿色化工等产业融合发展。", "ctime": 1775432169, "time_str": "07:36:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260406/c675779275.shtml"}, {"id": "4187595", "title": "上海电气大型铸锻件产业能级提升项目一期工程开工", "content": "近日，上海电气上重铸锻有限公司“大型铸锻件产业能级提升项目”一期工程在闵行顺利开工，旨在构建上海及长三角地区大型高端材料研发、制造和应用基地，打造具有世界先进水平的大型特种合金铸锭及100MN数智化快锻生产线。该项目由上海电气环保集团（机电院）承担设计，一期工程竣工后可实现30吨级钛合金、30吨级高温合金铸锭的自主制造，重点服务先进核能、航空航天、海洋工程等战略前沿领域，形成一体化高端特材制造体系，为我国高端装备制造业发展提供关键基础部件。", "ctime": 1775432044, "time_str": "07:34:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260406/c675779263.shtml"}, {"id": "4187587", "title": "伊朗最高领袖：将继续利用封锁霍尔木兹海峡这一战略杠杆", "content": "当地时间4月5日，伊朗最高领袖穆杰塔巴·哈梅内伊在社交媒体发文称，伊朗人民的意愿是继续开展有效的国土防御行动，同时，封锁霍尔木兹海峡这一战略杠杆也必须继续加以运用。（央视新闻）", "ctime": 1775431936, "time_str": "07:32:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260406/c675779256.shtml"}, {"id": "4187581", "title": "伊朗首都德黑兰传出爆炸声", "content": "当地时间6日凌晨2时39分，伊朗首都德黑兰传出爆炸声。 (央视新闻)", "ctime": 1775431642, "time_str": "07:27:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260406/c675779233.shtml"}, {"id": "4187579", "title": "我国海上风电累计并网装机连续5年全球居首", "content": "我国海上风电产业正在全球范围内构建新的竞争优势。20兆瓦海上风机成功吊装，刷新全球实际海洋环境中已吊装机组单机容量最大纪录；叶轮直径252米、全球首台16兆瓦漂浮式海上风电机组完成一体化组装……我国海上风电大容量风电机组引领全球，国产替代技术不断取得新突破，漂浮式海上风电进入试验示范阶段。国家能源局发布数据显示：截至今年2月底，全国风电装机容量6.5亿千瓦，同比增长22.8%。全国海上风电累计并网装机超4700万千瓦，连续5年全球居首。 (人民日报)", "ctime": 1775431508, "time_str": "07:25:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260406/c675779226.shtml"}, {"id": "4187349", "title": "匈牙利将军事保护“土耳其溪”天然气管道匈牙利段", "content": "匈牙利外长西雅尔多当地时间5日在布达佩斯表示，鉴于针对“土耳其溪”天然气管道的袭击愈加频繁，匈牙利将军事保护“土耳其溪”天然气管道匈牙利段，包括从塞尔维亚—匈牙利边境到斯洛伐克—匈牙利边境。西雅尔多表示，乌克兰方面先是炸毁“北溪”天然气管道，随后封锁“友谊”石油管道，切断俄罗斯向匈牙利和斯洛伐克的石油供应。最近几周，乌克兰动用数十架无人机袭击了位于俄罗斯境内，同样向匈牙利运输天然气的“土耳其溪”管道。 (央视新闻)", "ctime": 1775402102, "time_str": "23:15:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260405/c675778856.shtml"}, {"id": "4187347", "title": "伊朗：通过收取通行费获得战争损失赔偿后，霍尔木兹海峡将重新开放", "content": "伊朗总统府通讯与信息事务副手在社交媒体上表示，只有在新法律框架下，通过部分过境通行费收入“全额赔偿”强加于伊朗的战争所造成的损失后，伊朗才会重新开放霍尔木兹海峡。（央视新闻）", "ctime": 1775401740, "time_str": "23:09:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260405/c675778851.shtml"}, {"id": "4187329", "title": "特朗普称最后期限前伊朗或达成协议", "content": "据美国福克斯新闻今天（4月5日）报道，美国总统特朗普在接受其采访时表示“4月6日前有可能与伊朗达成协议”，并称伊朗方面“正在参与谈判”。特朗普称，如果伊朗不愿达成协议，他正在考虑“炸毁一切并夺取（伊朗）石油”，“人们将会看到伊朗全国各地的桥梁和发电厂（遭轰炸）倒塌。”特朗普此前曾威胁如果伊朗不在美国东部时间4月6日晚8点前与美国达成协议或开放霍尔木兹海峡，美以将轰炸伊朗发电厂等基础设施。 特朗普还透露，今年早些时候，美国曾“通过库尔德人向伊朗抗议者输送武器”，但他认为这些武器“被库尔德人拿了”。 （CCTV国际时讯）", "ctime": 1775400239, "time_str": "22:43:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260405/c675778839.shtml"}, {"id": "4187311", "title": "王毅同俄罗斯外长拉夫罗夫通电话", "content": "中共中央政治局委员、外交部长王毅5日应约同俄罗斯外长拉夫罗夫通电话，就当前中东形势交换意见。拉夫罗夫表示，俄方对中东形势持续升级高度关切。关于当前战事和霍尔木兹海峡问题，俄方主张必须立即停止军事行动，回归政治和外交轨道，解决冲突产生的根源。联合国安理会应为此发挥建设性作用。俄方愿同中方密切沟通协调，继续为推动停火止战发声出力。王毅表示，中俄作为联合国安理会常任理事国，应在大是大非问题上体现公道，采取客观平衡做法，并争取国际社会更多理解和支持。中方始终主张通过对话谈判政治解决国际和地区热点问题。当前，中东局势仍在恶化、战事还在升级。解决霍尔木兹海峡通航问题的根本是尽快停火止战。中方愿同俄方在联合国安理会继续合作，在重大问题上及时沟通，为局势降温以及维护地区和平稳定和世界共同安全做出努力。（新华社）", "ctime": 1775399453, "time_str": "22:30:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260405/c675778815.shtml"}, {"id": "4187305", "title": "以军称打死伊朗革命卫队石油部门高级指挥官", "content": "当地时间5日下午，以色列国防军发表声明称，其在3日针对伊朗首都德黑兰的空袭行动中，打死伊斯兰革命卫队石油部门高级指挥官穆罕默德·礼萨·阿什拉菲·卡希。声明称，革命卫队石油部门通过销售石油产生的利润绕过国际制裁，为革命卫队持续运作和军事能力建设提供支持。声明指出，阿什拉菲管理着石油部门的商业运作，据估算年贸易额达数十亿美元。该人推动伊朗伊斯兰革命卫队及其在中东地区代理人的军事能力发展，其中首要对象包括也门胡塞武装、黎巴嫩真主党和哈马斯等组织。以军还称，这些活动为革命卫队的弹道导弹和无人机编队提供资金，而这些武器被用于对以色列领土及海湾国家发动袭击，并攻击地区内的石油基础设施。以军表示，此次行动是继伊朗武装部队石油总部指挥官贾姆希德·埃沙基被清除后的又一重大进展，被视为对伊朗安全体系经济基础的进一步打击。伊朗方面对此暂无回应。（央视新闻）", "ctime": 1775398940, "time_str": "22:22:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260405/c675778805.shtml"}, {"id": "4187283", "title": "以色列宣布已停止所有对法国防采购", "content": "当地时间5日，总台记者获悉，据以色列国防军发言人消息，由于法国采取了多项“损害以色列安全”的措施，包括禁止以色列军机利用法国领空执行针对伊朗的作战任务，以国防部已停止所有来自法国的国防采购。该发言人表示，当前以色列正在针对伊朗进行军事行动，而法国“正在积极阻挠向以色列转运弹药”。该发言人说，伊朗的弹道导弹“具备打击包括巴黎在内的欧洲城市的能力”。该发言人表示，“尽管事先进行了协调，尽管明确解释了这些弹药仅针对伊朗，且尽管双方都理解这一努力对欧洲安全同样至关重要，但法国依然实施了禁令” 。该发言人称，作为回应，以色列国防部总干事阿米尔·巴拉姆“已决定将所有来自法国的国防采购降至零”，并以国内采购或从“盟友国家”采购取而代之。并称这是“建立完全国防自主、不依赖不可信国家”战略的一部分。该发言人补充道，以国防部已联同以色列国家安全委员会通知法国国防部长沃特兰，“我们不打算与其会面，且不会与法国军方进行新的业务往来”。对此，法国方面暂无回应。（央视新闻）", "ctime": 1775398021, "time_str": "22:07:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260405/c675778768.shtml"}, {"id": "4187259", "title": "特朗普表示，他相信自己能在周一前与伊朗达成协议", "content": "美国总统特朗普当地时间4月5日表示，他相信能在6日之前与伊朗达成协议，伊朗目前正在进行谈判。特朗普稍早前表示，他将于6日下午与军方共同举行新闻发布会。 (央视新闻)", "ctime": 1775397063, "time_str": "21:51:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260405/c675778744.shtml"}, {"id": "4187257", "title": "美以对伊朗胡齐斯坦省发动空袭 阿瓦士国际机场遭袭", "content": "伊朗胡齐斯坦省负责安全事务的副省长5日表示，位于该省首府阿瓦士的苏莱曼尼中将国际机场遭到美国与以色列的空袭，机场建筑被击中。此次袭击尚未造成人员伤亡。胡齐斯坦省副省长指出，过去数日内，该省多地频繁遭到空袭，并伴随有多次爆炸发生。（央视新闻）", "ctime": 1775396452, "time_str": "21:40:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260405/c675778727.shtml"}, {"id": "4187249", "title": "以防长说袭击持续伊将付出沉重代价", "content": "以色列国防部长卡茨今天（4月5日）在结束形势评估后表示，伊朗的石化工业为伊斯兰革命卫队提供资金，并助力其导弹生产。他表示，只要针对以色列的袭击持续，伊朗就必将付出“沉重代价”，其国家基础设施将“被削弱并被摧毁”。针对美国总统特朗普称在伊朗被击落的F-15E战斗机上的第二名机组人员获救，卡茨表示，这再次体现了以色列与美国之间的密切合作。此前，有以色列国防官员对媒体表示，此次搜救行动得到了以色列方面的情报支持。另有官员称，以色列空军在搜救期间推迟了对相关区域的空袭行动。（CCTV国际时讯）", "ctime": 1775396220, "time_str": "21:37:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260405/c675778721.shtml"}, {"id": "4187189", "title": "俄外交官：西方拉海合会讨论中东局势只为“挽回颜面”", "content": "七国集团(G7)与海湾阿拉伯国家合作委员会（海合会）定于下周开会讨论霍尔木兹海峡局势。俄罗斯新闻社5日援引俄罗斯外交官马拉特·别尔季耶夫的话报道，西方国家在中东地区制造“人为混乱”，如今“疯狂地”寻找退路。七国集团拉海合会开会，无非想是“挽回颜面”。七国集团轮值主席国法国外交部发言人帕斯卡尔·孔法弗勒2日宣布上述会议安排。俄罗斯外交部分管二十国集团(G20)和亚太经合组织(APEC)事务的无任所大使别尔季耶夫就此评论：“显然，（七国集团）试图与海湾国家达成共识，但迄今为止我没有看到这方面的任何严肃方案。在我看来，我们正目睹七国集团和西方国家都想在国际关系中挽回颜面的局面。”（新华社）", "ctime": 1775393318, "time_str": "20:48:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260405/c675778637.shtml"}, {"id": "4187185", "title": "三连冠！孙颖莎再夺世界杯女单冠军 王曼昱获亚军", "content": "北京时间4月5日晚，国际乒联单打世界杯女单决赛，孙颖莎4-1战胜王曼昱，卫冕国际乒联世界杯女单冠军。(央视新闻)", "ctime": 1775392922, "time_str": "20:42:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260405/c675778620.shtml"}, {"id": "4187183", "title": "特朗普威胁伊朗：4月7日将是伊朗的发电厂日和大桥日", "content": "美国总统特朗普5日再次要求伊朗打开霍尔木兹海峡并威胁称，如果不这样做的话，伊朗将“活在地狱中”。特朗普在社交媒体上发文说，“4月7日将是伊朗的发电厂日和大桥日”，暗示要猛烈轰炸伊朗的发电厂和大桥。他还说：“打开那个该死的海峡，否则你们将活在地狱中——走着瞧！”特朗普4日在社交媒体上发文，要求伊朗4月6日前“达成协议”或“开放霍尔木兹海峡”，并威胁称“时间所剩无几——距离一切灾难降临在他们头上仅剩48小时了”。伊朗武装部队哈塔姆安比亚中央总部司令阿卜杜拉希当天作出回应，强调伊朗军方将坚定捍卫民族权利、保护国家资产，让侵略者付出代价。（新华社）", "ctime": 1775392875, "time_str": "20:41:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260405/c675778619.shtml"}];

  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
