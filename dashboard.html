stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260423/c676218696.shtml"}, {"id": "4267347", "title": "股指期货午盘收盘 主力合约全线收跌", "content": "股指期货午盘收盘，主力合约全线收跌。沪深300股指期货(IF)主力合约跌0.27%，上证50股指期货(IH)主力合约跌0.08%，中证500股指期货(IC)主力合约跌0.77%，中证1000股指期货(IM)主力合约跌0.99%。", "ctime": 1776927649, "time_str": "15:00:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260423/c676218689.shtml"}, {"id": "4267331", "title": "大渡河老鹰岩二级水电站成功截流 实现关键节点目标", "content": "记者今天（23日）从国家能源集团获悉，大渡河老鹰岩二级水电站河道截流圆满完成，顺利实现关键节点目标。大江截流是水电工程建设中具有里程碑意义的控制性环节，标志着项目由辅助工程正式转入主体工程施工，为后续主体工程混凝土浇筑提供无水干地条件。此次电站截流的围堰最大填筑量约65万立方米，采用混凝土防渗墙，墙体厚度达1米，最大深度达91米，以应对河床60至90米深厚覆盖层的复杂地质条件。老鹰岩二级水电站计划于2029年首台机组投产，总装机容量420兆瓦，设计年发电量18.38亿千瓦时，每年可节约标准煤超50万吨、减少二氧化碳排放超150万吨，将显著补强区域电力供应保障能力。（央视新闻）", "ctime": 1776927493, "time_str": "14:58:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260423/c676218654.shtml"}, {"id": "4267327", "title": "国家能源局：3月全国新增建档立卡新能源发电（不含户用光伏）项目共6228个", "content": "国家能源局发布数据，2026年3月，全国新增建档立卡新能源发电（不含户用光伏）项目共6228个，其中风电项目44个，光伏发电项目6179个（集中式光伏发电项目34个，工商业分布式光伏发电项目6145个），生物质发电项目5个。（国家能源局）", "ctime": 1776927430, "time_str": "14:57:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260423/c676218638.shtml"}, {"id": "4267321", "title": "上期所燃油主力合约大涨6%", "content": "上期所燃油主力合约大涨6%，报4070元/吨。", "ctime": 1776927370, "time_str": "14:56:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260423/c676218604.shtml"}, {"id": "4267311", "title": "以色列国防部采购价值逾2亿美元的空射武器", "content": "以色列国防部23日称，为提升近期作战能力并应对未来十年的安全挑战，其国防采购局已向以色列埃尔比特系统公司签下总额逾2亿美元的多年期空射武器采购订单。埃尔比特系统公司是以色列规模最大、最重要的军工企业之一，是以色列军方的主要供应商。（央视新闻）", "ctime": 1776927110, "time_str": "14:51:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260423/c676218553.shtml"}, {"id": "4267287", "title": "本田汽车业务将于2026年底退出韩国市场", "content": "据报道，本田汽车业务将于2026年底退出韩国市场，但仍将继续在韩国销售摩托车。（第一财经）", "ctime": 1776926685, "time_str": "14:44:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260423/c676218398.shtml"}, {"id": "4267285", "title": "中科曙光与海尔集团签署战略合作协议", "content": "中科曙光消息，4月22日，中科曙光与海尔集团正式签署集团级战略合作协议。根据合作内容，双方将围绕国产芯终端联合共研、工业互联网算力底座、智算中心共建、绿色低碳数据中心、供应链协同、产业生态共建六大领域展开全面合作。通过技术互通、资源共享、场景共建，打通底层算力、平台支撑到场景应用的全链条体系，推动算力服务向规模化、场景化、高效化转型。（第一财经）", "ctime": 1776926662, "time_str": "14:44:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260423/c676218389.shtml"}, {"id": "4267283", "title": "优必城（上海）科技有限公司成立，注册资本5000万元", "content": "企查查APP信息显示，优必城（上海）科技有限公司近日成立，法定代表人为王琳，注册资本达5000万元。该公司主要业务涵盖电力电子元器件制造、服务消费机器人及工业机器人制造，以及智能机器人的研发。企查查股权结构显示，优必选为该公司唯一股东。（人民财讯）", "ctime": 1776926625, "time_str": "14:43:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260423/c676218380.shtml"}, {"id": "4267279", "title": "青岛啤酒、广西国资等成立文旅产业发展公司", "content": "企查查APP显示，近日，广西桂泰文旅产业发展有限公司成立，注册资本为1000万元，经营范围包含：旅游开发项目策划咨询；人工智能应用软件开发；市场营销策划；物业管理；酒店管理等。企查查股权穿透显示，该公司由Trillion Brewery Co., Ltd.、广西旅发置业集团有限公司、青岛啤酒全资子公司深圳市青岛啤酒华南投资有限公司共同持股。（人民财讯）", "ctime": 1776926583, "time_str": "14:43:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260423/c676218359.shtml"}, {"id": "4267275", "title": "乌称第聂伯罗市遭俄军袭击 已致2死10伤", "content": "乌克兰第聂伯罗彼得罗夫斯克州军政管理部门23日通报称，乌克兰第聂伯罗市当天遭俄军袭击，已致2人死亡、10人受伤，造成居民楼、商店、行政办公楼等建筑受损。俄罗斯方面对此暂无回应。（央视新闻）", "ctime": 1776926558, "time_str": "14:42:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260423/c676218344.shtml"}, {"id": "4267269", "title": "香港中小上市公司协会副会长陈熙：香港资本参与跨境并购意愿强烈", "content": "香港中小上市公司协会副会长、华升证券董事总经理、香港证监会1、4号牌持牌负责人陈熙认为，2025年以来，深港跨境并购正迎来历史性的窗口期。随着相关政策的出台，香港正从一个单纯的融资市场，向产业资本化平台和跨境整合枢纽升级。据她观察，香港资本参与深圳并购基金的意愿十分强烈，随着两地交易所互联互通持续推进，有望实现资本与产业的双赢。（21财经）", "ctime": 1776926429, "time_str": "14:40:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260423/c676218286.shtml"}, {"id": "4267255", "title": "南通产控思源人工智能先导基金登记成立，出资额2.71亿", "content": "天眼查App显示，4月22日，南通产控思源人工智能先导基金（有限合伙）成立，执行事务合伙人为南通科技创业投资管理有限公司，出资额2.71亿人民币，经营范围为创业投资，以私募基金从事股权投资、投资管理、资产管理等活动。合伙人信息显示，该基金由南通产业控股集团有限公司、南通经济技术开发区控股集团有限公司、南通投资管理有限公司、南通科技创业投资管理有限公司、上海菡源投资中心（有限合伙）共同出资。（界面新闻）", "ctime": 1776926233, "time_str": "14:37:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260423/c676218221.shtml"}, {"id": "4267231", "title": "日韩股市收盘涨跌互现", "content": "日经225指数收跌0.75%，报59140.23点。韩国综指收涨0.89%，报6475.36点。", "ctime": 1776925873, "time_str": "14:31:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260423/c676218089.shtml"}, {"id": "4267193", "title": "ETF两市成交额超4000亿元", "content": "截至目前，ETF两市成交额超4000亿元，报4000.54亿元，分类型来看，股票型ETF成交额1465亿元，债券型ETF成交额1594.65亿元，货币型ETF成交额209.87亿元，商品型ETF成交额99.06亿元，QDII型ETF成交额419.78亿元。其中，成交额最高的非货币型ETF分别是A500ETF（563360）中韩半导体ETF（513310）中证A500ETF（159338）成交额分别为59.75亿元59.06亿元54.46亿元", "ctime": 1776925658, "time_str": "14:27:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260423/c676217999.shtml"}, {"id": "4267189", "title": "福建：支持厦门建设基金集聚区 吸引境内外长期资本、耐心资本投资金砖合作项目", "content": "福建省人民政府印发《关于支持金砖国家新工业革命伙伴关系创新基地高质量发展的意见》。《意见》提出，强化金融赋能。支持厦门建设基金集聚区，发挥合格境外有限合伙人试点政策优势，吸引境内外长期资本、耐心资本投资金砖合作项目。探索与金砖国家在跨境交易、支付结算、监管协同等领域合作，打造“产业+金融+数据”三位一体的跨境合作新模式。支持金砖创新基地设立跨境人民币业务培训中心，提供政策宣导与服务对接。引导金融机构在金砖创新基地设立金砖业务专营中心，依法依规为相关企业提供授信额度、高效跨境结算通道等特色服务。（人民财讯）", "ctime": 1776925547, "time_str": "14:25:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260423/c676217950.shtml"}, {"id": "4267185", "title": "马士基称霍尔木兹海峡仍处于“紧紧关闭”状态", "content": "丹麦航运巨头马士基在致客户的最新通告中称，中东局势持续紧张，本周已有三艘集装箱船遭伊朗军队袭击，霍尔木兹海峡目前仍处于“紧紧关闭”状态。(蓝鲸新闻)", "ctime": 1776925532, "time_str": "14:25:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260423/c676217934.shtml"}, {"id": "4267181", "title": "蓝牙技术联盟首席执行官穆雷：2026年蓝牙设备出货量将达59亿台", "content": "蓝牙技术联盟首席执行官穆雷在2026蓝牙亚洲大会上表示，2026年蓝牙设备出货量将达到59亿台，未来有望达到百亿台。据介绍，蓝牙技术联盟成员数量超过4.3万家，其中，亚太地区占比最高达到38%。（人民财讯）", "ctime": 1776925450, "time_str": "14:24:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260423/c676217893.shtml"}, {"id": "4267169", "title": "沪深京三市成交额超2.5万亿元，较上日此时放量2932亿元", "content": "据同花顺iFinD数据，沪深京三市成交额超2.5万亿元，较上日此时放量2932亿元，预计全天成交金额约2.9万亿元。截至目前，沪市成交额10980亿元，深市成交额13856亿元，北证50成交额165亿元。", "ctime": 1776925269, "time_str": "14:21:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260423/c676217801.shtml"}, {"id": "4267167", "title": "总投资10亿元，灵猴智能机器人创新中心基地项目在苏州吴江奠基", "content": "4月22日上午，苏州灵猴智能机器人创新中心基地项目奠基仪式在吴江经济技术开发区举行。本次灵猴智能机器人创新中心基地项目，总投资达10亿元，新增工业用地57.4亩，规划建筑面积10.4万平方米。项目建成后，可实现年产85万台视觉模组、45万台核心运动控制部件、8万台具身机器人。（界面新闻）", "ctime": 1776925229, "time_str": "14:20:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260423/c676217784.shtml"}, {"id": "4267163", "title": "福建：加强与金砖国家海洋产业合作", "content": "福建省人民政府印发《关于支持金砖国家新工业革命伙伴关系创新基地高质量发展的意见》。《意见》提出，加强与金砖国家海洋产业合作。全面深化与金砖国家在现代海洋渔业、船舶和海工装备、海洋信息等领域的交流合作。加 // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
