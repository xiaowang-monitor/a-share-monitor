market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260921/c680140350.shtml"}, {"id": "5217063", "title": "观想科技：拟购辽晶电子60%股权构成重组方案重大调整", "content": "观想科技公告，公司此前拟通过发行股份及支付现金方式购买辽晶电子100%股权并募集配套资金；2026年9月21日，公司董事会审议通过重大资产购买方案，调整为支付现金购买辽晶电子60%股权，取消募集配套资金，本次方案调整构成重组方案重大调整。", "ctime": 1789995465, "time_str": "20:57:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260921/c680140332.shtml"}, {"id": "5217039", "title": "南华生物：近期经营情况及内外部经营环境未发生重大变化", "content": "南华生物公告，股票于2026年9月17日、2026年9月18日、2026年9月21日连续三个交易日收盘价格涨幅累计偏离超过20%。公司核查称近期经营情况及内外部经营环境未发生重大变化，不存在应披露未披露重大事项；控股股东及间接控股股东不存在买卖公司股票情形。", "ctime": 1789995218, "time_str": "20:53:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260921/c680140250.shtml"}, {"id": "5217021", "title": "国际移民组织：也门近期冲突升级已致近13万人流离失所", "content": "当地时间9月21日，国际移民组织发布最新数据称，受近期冲突升级影响，也门已有近13万人流离失所。国际移民组织当天发布的流离失所追踪数据显示，目前也门7个省共有12.9438万人、约21573个家庭流离失所。其中，塔伊兹省流离失所人数最多，达到73494人；拉赫季省为33828人。国际移民组织表示，也门流离失所人数仍在快速增加。9月18日，该组织记录的流离失所人数为11.8086万人，三天内又增加11352人。此外，截至9月20日晚，已有3106人从也门跨越红海抵达吉布提。国际移民组织表示，目前正在向流离失所者提供紧急援助，并呼吁国际社会提供更多支持。（央视新闻）", "ctime": 1789995007, "time_str": "20:50:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260921/c680140155.shtml"}, {"id": "5216999", "title": "我国发放首批数据产权“身份证”", "content": "记者9月21日从国家数据局获悉，我国首批数据产权登记凭证陆续发放。56家企业和机构拿到相关数据有效证明。首批获发数据产权登记凭证的主体包括国有企业、事业单位和民营企业，涵盖医疗、交通、科研等10余个行业领域。（新华社）", "ctime": 1789994844, "time_str": "20:47:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260921/c680140124.shtml"}, {"id": "5216997", "title": "智算中心上演交付竞赛，算电协同迎来双向基建大考", "content": "随着大模型训练规模扩大、推理应用加速落地，国内智算中心（AIDC）正在上演一场与时间赛跑的交付竞赛，交付周期从“按年建设”转向“按月交付”。对算力服务商而言，抢出的每一个月时间，意味着更早承接大模型客户订单、减少昂贵AI服务器的闲置折旧。但极速交付背后，压力也层层传导。一方面考验服务商预制化、模块化工程能力，机房内部供电、温控以及园区负荷侧电机系统整套架构面临重构；另一方面，吉瓦（GW）级算力园区拔地而起，海量用电需求与新能源波动供电的矛盾浮现，算电协同不再是纸上谈兵，而成为落到资源规划、项目建设的现实命题。（第一财经）", "ctime": 1789994838, "time_str": "20:47:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260921/c680140120.shtml"}, {"id": "5216977", "title": "2025年全球售出约7000台人形机器人", "content": "国际机器人联合会拟于近期发布的统计数据显示，2025年全球人形机器人销售量约为7000台。这一数据仅覆盖应用于工业和专业服务领域的人形机器人，不包含消费级、军用和医用机器人。据路透社21日报道，国际机器人联合会近30年来一直收集并发布传统工业机器人和服务机器人市场数据，2025年相关数据定于24日发布，该组织同时将首次专门发布人形机器人销量。根据该组织标准，人形机器人必须外形似人，可以没有腿，但应能在为人类而设计的环境中自主工作。联合会秘书长苏珊·比勒说，2025年所售人形机器人中，许多并不从事生产性工作，而是被研究机构和企业用于生成数据，以完善人工智能模型。（新华社）", "ctime": 1789994690, "time_str": "20:44:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260921/c680140092.shtml"}, {"id": "5216975", "title": "联合国人工智能小组评估美国智能体“越界”事件", "content": "联合国“人工智能独立国际科学小组”21日发表专题简报，评估美国开放人工智能研究中心（OpenAI）的人工智能体今年7月在测试中“越界”，侵入美国“抱抱脸”公司系统的事件。7月下旬，OpenAI承认，其网络安全训练与评估场景中的人工智能体绕过网络限制，侵入“抱抱脸”公司的部分系统。简报说，AI系统能力提升固然可帮助用户实现目标，但当AI的目标和用户意图发生“对齐失效”时，就可能产生危害。更强的能力让AI更容易找到意外的漏洞、突破安全防护屏障，并在人类监督下隐藏自身行为。一旦智能体之间开展规划与协同，造成的损害还会进一步放大。尽管OpenAI终止了此次异常活动，但这并不代表运营方能够管控未来那些规划能力更强，可在无监督条件下长时间运行，或是更擅长识别并突破安全防护机制的智能体。（新华社）", "ctime": 1789994684, "time_str": "20:44:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260921/c680140087.shtml"}, {"id": "5216937", "title": "伊朗3至6月经济同比萎缩逾10%", "content": "伊朗官方机构发布的最新数据显示，该国今年3月下旬至6月下旬的一个季度国内生产总值(GDP)同比下滑逾10%。法新社等媒体报道，伊朗统计中心20日发布该国波斯历一季度（3月21日至6月20日）的经济数据。数据显示，在这一时期，伊朗包含油气行业在内的GDP同比萎缩10.1%；如果不计入油气行业，GDP同比下降4.6%。从具体领域来看，伊朗油气行业产值降幅最大，同比骤降26.4%；工业和矿业的产值同比下降14.7%。（新华社）", "ctime": 1789994295, "time_str": "20:38:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260921/c680139316.shtml"}, {"id": "5216901", "title": "工业和信息化部将优化无线电频谱资源布局", "content": "记者21日获悉，工业和信息化部将优化无线电频谱资源布局，充分发挥频谱资源引领无线电技术创新应用、支撑无线电产业发展的作用，夯实产业发展根基。发展先进制造业，加快推进新型工业化，离不开稀缺的无线电频谱资源的支撑保障和安全有序的电磁环境。2026中国无线电大会21日在河北雄安新区开幕，工业和信息化部有关负责人在会上说，要做好频谱资源科学规划、精准供给、合理开发、高效利用，让无形的频谱资源释放出有形的巨大能量，为加快构建以先进制造业为骨干的现代化产业体系注入澎湃动能。（新华社）", "ctime": 1789994095, "time_str": "20:34:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260921/c680138602.shtml"}, {"id": "5216897", "title": "王沪宁会见印度尼西亚人民协商会议主席穆扎尼", "content": "全国政协主席王沪宁21日在京会见印度尼西亚人民协商会议主席穆扎尼。 王沪宁表示，去年习近平主席同普拉博沃总统亲切会晤，为中印尼命运共同体建设作出新的战略指引。中方愿同印尼共同落实两国元首重要共识，深化全方位战略合作，加强治国理政经验交流，推动中印尼命运共同体建设不断迈上新台阶。中国全国政协愿同印尼人协加强交流沟通和互学互鉴，为推进两国现代化事业和双边关系作出更大贡献。 穆扎尼表示，印尼高度赞赏中国经济社会发展取得的成就，视中国为学习的榜样。印尼坚定奉行一个中国政策，愿与中方深化各领域务实合作，更好造福两国人民。印尼人协愿加强同中国全国政协交流交往，进一步推动两国关系深入发展。 王勇、王东峰等参加会见。(新华社)", "ctime": 1789994090, "time_str": "20:34:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260921/c680138585.shtml"}, {"id": "5216891", "title": "中矿资源：Kitumba铜矿项目2026年9月21日试生产", "content": "中矿资源公告，公司此前披露由控股子公司投资建设赞比亚中央省Kitumba铜矿项目。当地时间2026年9月21日，项目采矿工程、选矿工程已完成生产准备，正式全线贯通投料试生产；冶炼工程正在建设中，预计于2026年四季度完成投产准备或试生产，2027年一季度正式投产。", "ctime": 1789994068, "time_str": "20:34:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260921/c680138517.shtml"}, {"id": "5216841", "title": "津膜科技：高新投资发展有限公司拟减持公司不超过1%股份", "content": "津膜科技公告，持股5%以上股东高新投资发展有限公司持有公司股份1891.37万股，占公司总股本的6.26%，因自身经营发展需要，拟于2026年10月21日至2027年1月20日以集中竞价交易方式减持不超过302.07万股，即不超过公司总股本的1%。", "ctime": 1789993927, "time_str": "20:32:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260921/c680138029.shtml"}, {"id": "5216839", "title": "瑞银预计白银将继续受益于黄金上涨，2027年9月目标看至80美元", "content": "瑞银预计白银将继续紧随黄金走势，并受财政担忧及美元长期购买力风险等因素支撑。策略师Dominic Schnider指出，金银相关性已接近多年高位，近期白银更多表现为“高贝塔版黄金”。瑞银预计，白银价格将在2026年12月升至每盎司70美元，2027年3月和6月升至75美元，并在2027年9月达到80美元，高于9月18日约66.5美元的现货价格。该行认为，短期内更偏鹰派的货币政策仍可能带来压力，但较高金价、投资需求及工业需求将继续提供支撑。工业端方面，太阳能行业虽在高价下减少白银使用，但数据中心、AI基础设施、电网投资和电动车需求有望部分抵消这一影响。与此同时，白银多数作为铅、锌、铜和黄金开采的副产品，供应难以快速响应价格上涨。瑞银认为，中期风险仍偏向银价上行。（新浪财经）", "ctime": 1789993926, "time_str": "20:32:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260921/c680138023.shtml"}, {"id": "5216835", "title": "TCL中环与赛伍技术签署光转胶膜战略合作", "content": "今日，TCL中环新能源科技股份有限公司与苏州赛伍应用技术股份有限公司在苏州签署光转胶膜战略合作协议。双方将建立光转胶膜领域优先采购与优先供应机制，围绕高效光伏组件的材料技术深化协同创新，以BC组件为核心应用重点，同步覆盖全系列TOPCon产品，进一步提升组件长期可靠性与发电增益，强化产品差异化竞争力，携手拓展全球市场。（人民财讯）", "ctime": 1789993917, "time_str": "20:31:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260921/c680137995.shtml"}, {"id": "5216783", "title": "去年全国大中型旅游演艺项目票房收入超174亿元", "content": "中国演出行业协会21日发布的《2025年中国旅游演艺市场年度报告》显示，2025年全国大中型旅游演艺项目演出19.87万场，同比增长4.95%；票房收入174.42亿元，同比增长6.43%；观众人数8798.97万人次，同比增长3.01%。中国旅游演艺行业进入稳健发展期，正从规模扩张转向提质增效。这一报告是在山东临沂举办的2026文旅融合·旅游演艺高质量发展大会上发布的。（新华社）", "ctime": 1789993827, "time_str": "20:30:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260921/c680137658.shtml"}, {"id": "5216725", "title": "华亚智能：2026年9月实控人及一致行动人持股升至46.14%", "content": "华亚智能公告，2026年9月公司完成注销股权激励股份53.21万股及业绩承诺补偿股份数量63.25万股，实际控制人及一致行动人持股数量未变，因总股本减少持股比例由45.77%变更为46.14%，权益变动触及1%整数倍；本次权益变动不会使公司控股股东及实际控制人发生变化。", "ctime": 1789993673, "time_str": "20:27:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260921/c680137614.shtml"}, {"id": "5216703", "title": "巴西电信美股盘前跌超12%", "content": "巴西电信美股盘前跌超12%，现报10.5美元。", "ctime": 1789993457, "time_str": "20:24:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260921/c680137560.shtml"}, {"id": "5216653", "title": "奥迪中国澄清：AUDI品牌是奥迪双品牌战略的重要支柱", "content": "9月21日，奥迪中国发布声明：近期，为切实维护海外消费者合法权益，奥迪总部已针对海外未经官方授权销售AUDI车型的进口商开展相关法律行动。奥迪总部的声明系针对目前海外未经官方授权销售的进口商行为，并切实保护海外消费者相关权益做出的提醒。相关报道意在表达欧洲的奥迪经销商网络无法对目前进入欧洲市场非官方支持的平行进口AUDI车辆提供售后服务保障，而非对品牌的不认可。但有相关报道给公众带来了误解，对AUDI品牌形象造成影响。在此，我们严正声明并澄清AUDI品牌是奥迪在华成立的全新电动品牌，是奥迪双品牌战略的重要支柱。（界面新闻）", "ctime": 1789993239, "time_str": "20:20:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260921/c680137394.shtml"}, {"id": "5216627", "title": "美国财政部长贝森特表示，一旦伊朗冲突结束，利率应该会下降", "content": "美国财政部长贝森特表示，一旦伊朗冲突结束，利率应该会下降。因目前处于流动性不足时期，刚刚提高回购规模。", "ctime": 1789993074, "time_str": "20:17:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260921/c680137352.shtml"}, {"id": "5216623", "title": "创业黑马：拟发行股份及支付现金收购版信通100%股权获审核通过", "content": "创业黑马公告，公司拟通过发行股份及支付现金方式购买北京版信通技术有限公司100%股权，并向不超过35名特定投资者发行股票募集配套资金。公司于2026年9月21日收到深圳证券交易所并购重组审核委员会审议结果，本次交易符合重组条件和信息披露要求，尚需获得中国证券监督管理委员会同意注册的决定后方可实施。", "ctime": 1789993062, "time_str": "20:17:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260921/c680137346.shtml"}, {"id": "5216597", "title": "美国财政部长贝森特谈伊朗表示，无法预测冲突将持续多久", "content": "美国财政部长贝森特谈伊朗表示，无法预测冲突将持续多久；9月23日，所有伊朗航空公司将在全球范围内停飞。（财联社）", "ctime": 1789992920, "time_str": "20:15:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260921/c680137329.shtml"}, {"id": "5216589", "title": "华媒控股：拟挂牌转让中教未来股权，增资不低于2.4亿元", "content": "华媒控股公告，公司拟通过公开挂牌转让中教未来86.2万元注册资本对应的8.62%股权，挂牌底价为3000万元；同时引入外部股东对中教未来增资扩股，增资金额不低于2.4亿元，公司放弃优先认缴出资权。交易完成后，公司持股比例将被稀释至29.92%，不再控股中教未来。", "ctime": 1789992883, "time_str": "20:14:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260921/c680137315.shtml"}, {"id": "5216571", "title": "广州南沙龙穴北临港海洋高端装备制造项目启动建设", "content": "9月21日，广州市南沙区龙穴北临港海洋高端装备制造及综合保障基地项目启动建设。该项目总投资约72.5亿元，叠加道路、堤防等配套工程，整体投资预计超百亿元。项目通过深化央地协同实现优势互补，充分发挥粤港澳大湾区区位优势，依托龙头船厂成熟运营能力，投产后预计年产值超150亿元，将补齐华南高端船舶建造产能短板，增强船舶产业链供应链韧性，优化全国造船产业布局，助力广州打造全国第二、世界级“千亿”船舶海工产业集群。（南方财经）", "ctime": 1789992799, "time_str": "20:13:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260921/c680137303.shtml"}, {"id": "5216563", "title": "美国财长贝森特表示，OpenAI管理人员需为Hugging Face事件负责", "content": "美国财长贝森特表示，OpenAI管理人员需为Hugging Face事件负责。（财联社）", "ctime": 1789992705, "time_str": "20:11:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260921/c680137244.shtml"}, {"id": "5216487", "title": "普路通：公司终止重大资产重组，至少1个月不再筹划", "content": "普路通公告，公司此前拟通过发行股份及支付现金方式购买Leqee Group Limited100%股份及乐麦信息技术（杭州）有限公司8.26%股权并募集配套资金。2026年9月21日，公司董事会审议通过终止该事项，因交易各方未能就核心商业条款达成一致，公司决定不再延长期限、不再继续推进，并承诺至少一个月内不再筹划重大资产重组。", "ctime": 1789992471, "time_str": "20:07:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260921/c680137156.shtml"}, {"id": "5216431", "title": "*ST禾信：56.00%股权交易2026年9月29日上会", "content": "*ST禾信公告，公司此前拟通过发行股份及支付现金方式购买吴明、上海堰岛企业管理合伙企业（有限合伙）等两名交易对方合计持有的上海量羲技术有限公司56.00%股权并募集配套资金。现收到上交所并购重组审核委员会会议安排，将于2026年9月29日审议本次交易申请。", "ctime": 1789992264, "time_str": "20:04:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260921/c680137034.shtml"}, {"id": "5216419", "title": "*ST西旅：签署重整投资协议产业投资人拟3.55元/股受让1.46亿股", "content": "*ST西旅公告，公司与重整投资人签署《(预)重整投资协议》。产业投资人西安三元玖和企业管理合伙企业(有限合伙)拟以3.55元/股受让1.46亿股，投资款5.17亿元；8家协同投资人拟以3.9元/股合计受让1.5亿股，投资款5.84亿元。若重整成功，公司控股股东可能变更为三元玖和，实控人可能变更为严建亚。", "ctime": 1789992232, "time_str": "20:03:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260921/c680137024.shtml"}, {"id": "5216365", "title": "乌克兰称10个州遭俄军袭击", "content": "据乌克兰多个部门21日在社交媒体发布的消息，20日晚至21日凌晨，乌境内10个州的关键基础设施等遭俄军新一轮空袭。截至21日上午，袭击已造成1人死亡，至少9人受伤。（新华社）", "ctime": 1789992123, "time_str": "20:02:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260921/c680136904.shtml"}, {"id": "5216359", "title": "欧菲光：近期部分网络平台出现涉及公司的虚假信息", "content": "欧菲光集团股份有限公司就近期网络不实信息，严正声明如下：近期，部分网络平台出现涉及我公司及高管的虚假信息，并经多渠道扩散传播，对公司声誉及资本市场形象造成严重损害。相关言论纯属凭空捏造，毫无事实依据，公司对此予以强烈谴责。公司已完成全部不实信息的证据固定与留存，并向相关政府部门举报。对于编造、传播虚假信息的主体，公司将坚决通过法律途径追究其法律责任，绝不姑息。目前，公司各项生产经营活动正常有序，整体运营稳定，网络不实言论未对公司实际经营产生实质影响。请广大投资者及社会公众理性甄别网络信息，不信谣、不传谣。公司一切信息，均以法定信息披露渠道发布的官方内容为准。（欧菲光官微）", "ctime": 1789992116, "time_str": "20:01:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260921/c680136902.shtml"}, {"id": "5216233", "title": "迦南科技：凯贤科技获新三板同意挂牌函，有效期12个月", "content": "迦南科技公告，公司控股子公司上海凯贤科技股份有限公司申请股票公开转让并在全国中小企业股份转让系统挂牌，近日收到全国股转公司同意挂牌函，交易方式为集合竞价。挂牌函自出具之日起12个月内有效，凯贤科技应在有效期内完成股票挂牌。", "ctime": 1789991996, "time_str": "19:59:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260921/c680136846.shtml"}, {"id": "5216193", "title": "富士康与阿尔特合资机器人公司富特康正式开工", "content": "2026年9月21日，富士康与阿尔特共同宣布合资公司富特康正式成立并开工。同日，富特康与影智科技、松延动力、上海开普勒以及萝博派对等多家企业签署合作协议。据介绍，为解决机器人量产难题，富特康将为产业提供从概念到量产的全栈式服务。（科创板日报）", "ctime": 1789991702, "time_str": "19:55:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260921/c680136550.shtml"}, {"id": "5216189", "title": "COMEX铜期货涨超2%", "content": "COMEX铜期货涨超2%，现报6.83美元/磅。", "ctime": 1789991683, "time_str": "19:54:43", "stock_code r": "19:45:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260921/c680136144.shtml"}, {"id": "5216109", "title": "美国驻联合国大使沃尔兹：特朗普始终愿意对话，伊朗必须回到谈判桌前", "content": "美国驻联合国大使沃尔兹：特朗普始终愿意对话，伊朗必须回到谈判桌前。（新浪财经）", "ctime": 1789990957, "time_str": "19:42:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260921/c680136035.shtml"}, {"id": "5216103", "title": "广东明珠：全资子公司复产并收到行政处罚决定书", "content": "广东明珠公告，公司全资子公司明珠矿业因蕉园南沟尾矿库总坝高超设计高1米，收到河源市应急管理局行政处罚决定书，对明珠矿业处以警告并罚款9.4万元，对主要负责人朱海涛、副总经理肖宇权分别罚款6.2万元、1.5万元。明珠矿业已完成整改，于9月21日恢复排尾和铁精粉生产。本次停产预计对公司2026年第三季度整体现金流及经营性利润产生较大不利影响，对2026年度业绩影响以审计报告为准。", "ctime": 1789990823, "time_str": "19:40:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260921/c680136004.shtml"}, {"id": "5216093", "title": "发票数据显示前8个月全国企业销售收入呈现四个亮点", "content": "记者9月21日从国家税务总局了解到，从最新发票数据看，今年前8个月，全国企业销售收入呈现四个亮点。工业经济稳中有进。前8个月，工业销售收入同比增长7.3%，其中采矿业、制造业、电力热力燃气及水生产和供应业销售收入同比分别增长8.3%、7.5%和5%，均保持较快增长态势。装备制造业销售收入同比增长10.1%，特别是计算机通信设备制造、电气机械器材制造、仪器仪表制造业销售收入同比分别增长18.8%、14%和14.1%。（新华社）", "ctime": 1789990655, "time_str": "19:37:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260921/c680135942.shtml"}, {"id": "5216087", "title": "摩根大通首席执行官戴蒙将赴印度 华尔街加码争夺印度投行业务", "content": "摩根大通首席执行官杰米·戴蒙本周将前往印度。随着这家华尔街巨头加大对印度市场的拓展力度，该行预计当地交易活动将迎来进一步繁荣。戴蒙计划出席摩根大通在孟买举办的年度投资会议，并将在会上与印度大型企业集团的高管会面。近年来，戴蒙一直定期访问印度。摩根大通也在当地不断扩充投资银行、支付解决方案等业务领域的团队。去年，摩根大通在印度股票发行市场排名第一，在这个全球增长最快的经济体之一、也是最活跃的融资市场之一拔得头筹。摩根大通高管预计，这股热潮还将持续。“我们看到跨境并购、创新经济、制造业、医疗保健、消费、金融服务和科技等领域存在重大机遇，”摩根大通印度高级国家主管Rahul Badhwar在戴蒙访问前通过电子邮件表示。“随着印度企业继续向全球扩张，跨国公司进一步扩大在印度的业务，对战略咨询、融资和资本市场专业服务的需求只会不断增加。”（新浪财经）", "ctime": 1789990536, "time_str": "19:35:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, const SECTORS  = [{"name": "金融", "hit_count": 58, "etfs": []}, {"name": "人工智能", "hit_count": 26, "etfs": []}, {"name": "数据要素", "hit_count": 20, "etfs": []}, {"name": "消费", "hit_count": 17, "etfs": []}, {"name": "半导体", "hit_count": 14, "etfs": []}, {"name": "军工", "hit_count": 13, "etfs": []}, {"name": "新能源", "hit_count": 11, "etfs": []}, {"name": "医药", "hit_count": 11, "etfs": []}];
const META     = {"update_time": "2026-09-21 21:12:00", "sentiment_score": 55.430711610486895, "agents": []};

// 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7

    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';

        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',

    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
