qka.com.cn/20260526/c676972083.shtml"}, {"id": "4406263", "title": "深圳“十五五”规划纲要：到2030年金融业增加值突破7000亿元", "content": "《深圳市国民经济和社会发展第十五个五年规划纲要》发布，其中提出，推动法人总部银行增加资本规模，持续优化公司治理，提升综合竞争优势；支持民营银行打造数字化普惠金融服务样板。推动证券、基金、期货机构提升创新能力；支持头部证券公司成为综合型全能型投资银行，推动国资大型证券公司提升资本实力，打造国际一流投资银行和投资机构；推动基金公司做优做强，提升市场份额。支持保险法人机构设立资产管理、产业投资、医疗、健康、养老等专业子公司。支持银行理财公司、财务公司、消费金融公司、信托公司、金融租赁公司高质量发展。鼓励符合条件的制造业企业设立融资租赁公司，围绕飞机、船舶、海洋工程机械等大型设备租赁打造特色融资租赁集群。到2030年，金融业增加值突破7000亿元。（人民财讯）", "ctime": 1779769196, "time_str": "12:19:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260526/c676971937.shtml"}, {"id": "4406261", "title": "深圳“十五五”规划纲要：到2030年全市实时可用算力规模超150EFlops，国产芯片部分指标和算力集群达到国际先进水平", "content": "《深圳市国民经济和社会发展第十五个五年规划纲要》发布，其中提出，统筹推进智算芯片研发制造、算力设施建设和模型算法发展，打造高效易用的人工智能技术底座。夯实算力芯片产业根基，推动昇腾等训练芯片及端侧推理芯片优化迭代和应用适配，促进国产人工智能算力生态繁荣。夯实多层次智能算力底座，高标准建设训力基础设施，打造超智协同、异构融合、普惠泛在的可持续算力供给体系。加强人工智能基础理论研究和模型基础架构创新，培育国际领先的国产通用大模型和行业应用模型，以高价值应用场景推动模型算法应用落地。到2030年，全市实时可用算力规模超150EFlops，国产芯片部分指标和算力集群达到国际先进水平，形成能力强大、支撑全面应用的大模型底座。", "ctime": 1779769129, "time_str": "12:18:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260526/c676971928.shtml"}, {"id": "4406243", "title": "5月26日午间公告一览：拓维信息董事会同意向股东会提请免去宋隽逸先生的董事职务", "content": "拓维信息公告，为进一步完善公司治理，提升公司规范运作水平，董事会同意向股东会提请免去宋隽逸先生的董事职务。本议案已经公司董事会提名委员会审议通过，尚需提交股东会审议。", "ctime": 1779768434, "time_str": "12:07:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260526/c676971678.shtml"}, {"id": "4406231", "title": "东方电热：机器人液冷散热模组订单总金额占比较小 对经营业绩没有重大影响", "content": "东方电热在互动平台表示，温擎智控正在和一些潜在客户陆续签订开发订单。此外，温擎智控是国内首家推出“系统级机器人液冷散热模组”的企业，产品获得多家机器人企业认可。截至目前，公司签订的机器人液冷散热模组订单总金额占公司当期营业收入的比重较小，对公司经营业绩没有重大影响，请注意投资风险。（人民财讯）", "ctime": 1779768255, "time_str": "12:04:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260526/c676971621.shtml"}, {"id": "4406215", "title": "港股午评：恒生指数涨0.54%，恒生科技指数涨2.29%", "content": "港股午间收盘，恒生指数涨0.54%，恒生科技指数涨2.29%。恒指港股通ETF银华（159318）涨0.61%，港股通科技ETF鹏华（159751）涨1.87%。板块方面，客运航空公司、半导体产品与设备板块涨幅靠前；能源设备与服务、建筑材料板块跌幅靠前。个股方面，东岳集团涨24.41%，联想集团涨17.84%，联想集团-R涨17.74%，五一视界涨16.79%，南山铝业国际涨15.85%；国富量子跌19.09%，海致科技集团跌8.59%，东鹏饮料跌8.58%，长飞光纤光缆跌8.17%，钧达股份跌8.07%。", "ctime": 1779768072, "time_str": "12:01:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260526/c676971584.shtml"}, {"id": "4406201", "title": "菲律宾民众集会抗议菲日防务合作", "content": "26日，部分菲律宾民众在日本驻菲律宾大使馆外举行抗议集会。民众手持标语和离世的菲律宾慰安妇受害者照片，抗议菲律宾与日本在防卫安全领域深度绑定。据悉，菲律宾总统马科斯于26日至29日访问日本。近期，日本政府“再军事化”动作频频。在5月初的美菲联合军演中，日本自卫队发射岸基反舰导弹，这是二战后日本首次在菲律宾发射进攻型导弹。与此同时，日本政府大幅修改“防卫装备转移三原则”，积极推动与菲律宾等国防务合作，并向地区国家兜售武器装备。分析指出，这实质是为构建地区武器出口体系投石问路，借机实现日本军事力量向海外扩张。煽动周边安全焦虑、人为制造“外部威胁”，其背后的地缘算计与整军扩武野心昭然若揭。（央视新闻）", "ctime": 1779767507, "time_str": "11:51:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260526/c676971413.shtml"}, {"id": "4406199", "title": "三六零等在扬州成立股权投资合伙企业", "content": "企查查APP显示，近日，扬州奇宏股权投资合伙企业（有限合伙）成立，出资额4000万，经营范围包含：股权投资；创业投资。企查查股权穿透显示，该合伙企业由三六零旗下北京奇虎科技有限公司、北京万世一合投资基金管理有限公司等共同持股。（人民财讯）", "ctime": 1779767348, "time_str": "11:49:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260526/c676971356.shtml"}, {"id": "4406187", "title": "以军称打死一名哈马斯武器生产关键人物", "content": "以色列国防军25日在社交媒体上说，24日对加沙地带中部实施精准打击，打死巴勒斯坦伊斯兰抵抗运动（哈马斯）武器生产的关键人物穆罕默德·阿布·马卢。以军说，马卢是哈马斯武器生产部门核心人物，为该组织武器生产提供关键技术支持。以军称，在以色列与哈马斯停火期间，马卢仍在制造武器，对在加沙地带行动的以色列军队和平民“构成威胁”。以军说，在此次行动中进行了空中侦察，使用了精确制导弹药。（新华社）", "ctime": 1779767008, "time_str": "11:43:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260526/c676971281.shtml"}, {"id": "4406185", "title": "小米汽车发布世界模型全新框架：重建 + 生成一体化，主流基准测试全面 SOTA", "content": "小米技术官方宣布，小米汽车今日发布 Xiaomi Auto World Model 全新框架，为业界辅助驾驶世界模型提供了新的框架路径，推动行业从“场景感知”向“认知推演、场景进化”的高阶形态跃迁。据介绍，这是小米首次将三维重建与视频生成深度耦合的一体化架构，以「重建锚定几何、生成填补想象」的新范式，打破行业长期采用的重建、生成独立拆分路线。在 Waymo、nuScenes 等主流基准测试中全面取得 SOTA，并已在小米汽车合成数据、仿真测试、智能座舱三大核心场景完成业务落地。", "ctime": 1779766983, "time_str": "11:43:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260526/c676971274.shtml"}, {"id": "4406183", "title": "深圳深港智投私募股权投资基金合伙企业成立，出资额21亿", "content": "天眼查App显示，近日，深圳深港智投私募股权投资基金合伙企业（有限合伙）成立，执行事务合伙人为信达资本管理有限公司、深圳港创新私募股权基金管理（深圳）有限公司，出资额21亿人民币，经营范围为以私募基金从事股权投资、投资管理、资产管理等活动。合伙人信息显示，该基金由深圳市深圳港资本有限公司、中国信达、中国东方资产管理股份有限公司等共同出资。（界面新闻）", "ctime": 1779766702, "time_str": "11:38:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260526/c676971162.shtml"}, {"id": "4406167", "title": "期货午评：几内亚拟限制铝矿出口 氧化铝涨超5%", "content": "期货午评：截止午盘，大宗商品以下跌为主。跌幅方面，苯乙烯、原油跌超3%，纯苯跌近3%，硅铁、合成橡胶、聚丙烯、丙烯、甲醇跌超2%。涨幅方面，焦煤涨超6%，氧化铝涨超5%，焦炭涨超2%，沪锡涨超1%，棉花、纸浆、鸡蛋涨近1%。", "ctime": 1779766314, "time_str": "11:31:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260526/c676970936.shtml"}, {"id": "4406165", "title": "ETF午评：恒生港股通科技ETF领涨3.62%，信创ETF领跌7.17%", "content": "ETF午间收盘涨跌不一，恒生港股通科技ETF（159015）领涨3.62%，标普油气ETF（513350）涨2.90%，港股通科技ETF（159120）涨2.81%，信创ETF（159539）领跌7.17%，半导体设备ETF（560780）跌4.59%，卫星ETF（159206）跌4.58%。", "ctime": 1779766314, "time_str": "11:31:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260526/c676970933.shtml"}, {"id": "4406159", "title": "阿里云面向海外发布Qwen Cloud及MuleRun", "content": "5月26日，阿里云在新加坡面向海外市场发布全新AI产品官网Qwen Cloud、Agent产品MuleRun，以及智能体编程平台Qoder、通用桌面智能体 QoderWork的一系列更新，同步实现面向Agent的云基础设施升级。阿里云首席技术官、国际业务总裁李飞飞表示，海外市场对AI的需求持续旺盛，尤其是Agent的爆发让模型调用量和云资源消耗呈指数级增长。（人民财讯）", "ctime": 1779766271, "time_str": "11:31:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260526/c676970920.shtml"}, {"id": "4406155", "title": "A股午评：科创50震荡调整跌近3%，半导体板块、光纤概念跌幅居前", "content": "A股三大指数早盘集体下跌，截至午盘，上证指数跌0.84%，深证成指跌0.87%，创业板指跌0.51%，北证50跌2.71%，科创50指数跌2.88%。全市场成交额21734亿元，较上日放量821亿元，全市场超4500只个股下跌。板块题材上，贵金属、证券、电机板块涨幅居前；半导体、光纤、存储芯片板块跌幅居前。盘面上，贵金属板块低开后拉升，招金黄金涨停，西部黄金、紫金矿业跟涨。证券板块亦低开高走，锦龙股份早盘涨停，中信建投、中国银河涨幅居前。受宇树科技IPO上会时间确定影响，部分人形机器人概念股早盘走高，中大力德涨停，科达自控涨超18%，上纬新材涨超13%。半导体板块低开低走迎来调整，诚邦股份跌停，裕太微、凯德石英、炬光科技跌超10%。光纤概念股方面，三旺通信跌超10%，通鼎互联、杭电股份跌幅居前。", "ctime": 1779766255, "time_str": "11:30:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260526/c676970912.shtml"}, {"id": "4406153", "title": "ETF两市成交额2810.85亿元", "content": "截至目前，ETF两市成交额报2810.85亿元，分类型来看，股票型ETF成交额1101亿元，债券型ETF成交额984.51亿元，货币型ETF成交额117.14亿元，商品型ETF成交额25.02亿元，QDII型ETF成交额353.00亿元。其中，成交额最高的非货币型ETF分别是中韩半导体ETF（513310）、香港证券ETF（513090）、科创芯片ETF（588200），成交额分别为：72.85亿元、45.94亿元、45.68亿元。", "ctime": 1779766246, "time_str": "11:30:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260526/c676970910.shtml"}, {"id": "4406151", "title": "日本对外净资产规模降为全球第三", "content": "日本财务省26日公布数据显示，截至2025年末，日本对外净资产为561.75万亿日元（1美元约合159日元），同比增长4.4%。从国家和地区排名看，日本由全球第二位降至第三位。(新华社)", "ctime": 1779766224, "time_str": "11:30:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260526/c676970897.shtml"}, {"id": "4406149", "title": "股指期货早盘收盘 主力合约多数下跌", "content": "股指期货早盘收盘，主力合约多数下跌。沪深300股指期货(IF)主力合约涨0.02%，上证50股指期货(IH)主力合约跌0.15%，中证500股指期货(IC)主力合约跌1.33%，中证1000股指期货(IM)主力合约跌1.80%。", "ctime": 1779766222, "time_str": "11:30:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260526/c676970895.shtml"}, {"id": "4406145", "title": "我国主持的1项IEC铁路国际标准正式发布实施", "content": "近日，国际电工委员会（IEC）正式发布IEC 60310:2026《轨道交通 机车车辆变压器和电抗器》国际标准。该标准由国家铁路局统筹组织、我国主持制定，标志着中国铁路技术标准在国际舞台的又一次重大突破。（国家铁路局）", "ctime": 1779766211, "time_str": "11:30:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260526/c676970892.shtml"}, {"id": "4406143", "title": "北京正试点手术机器人租赁入院 多家三甲医院已经开展相关工作", "content": "记者近日从北京市医院管理中心获悉，北京正在试点手术机器人租赁入院，多家三甲医院已经开展相关工作，未来将覆盖更多手术科室。据悉，北京将进行为期3年的手术机器人租赁试点工作，主要先在北京市属医院开展试点工作，本市行政区域内的公立医院结合实际可参照执行。支持的手术机器人应该符合政府采购本国产品标准，在中国境内完成实质性生产，具有技术先进性和创新性，知识产权明晰等。试点任务包括逐步实现手术机器人在相应的学科基础临床需求的医院租赁入院，并且覆盖更多的手术科室，形成适应手术机器人租赁工作的管理制度和运行机制，形成可复制可推广的经验做法。（新京报）", "ctime": 1779766202, "time_str": "11:30:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260526/c676970889.shtml"}, {"id": "4406139", "title": "广东科技厅：将推动金融资本向科技企业集聚 带动更多社会资本投早、投小、投长期、投硬科技", "content": "广东省人民政府新闻办公室5月26日举行“开局起步‘十五五’”广东专场新闻发布会。广东省科学技术厅厅长王月琴表示，广东将推动金融资本向科技企业集聚。广东狠抓创新链产业链资金链人才链深度融合，发挥国家创业投资引导基金粤港澳大湾区区域基金、广东省战略性新兴产业投资引导基金的引导作用，带动更多社会资本投早、投小、投长期、投硬科技。推动科技信贷、科技保险增容扩面，完善财政资金“补改投”支持方式，深化“创新积分制”的科技企业推荐机制，推动金融资本与科技企业“双向奔赴”。（财联社）", "ctime": 1779765902, "time_str": "11:25:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260526/c676970731.shtml"}, {"id": "4406137", "title": "行云科技官宣合同总金额3.22亿元的企业级SSD硬盘大单 负责交付的控股子公司成立仅两个月", "content": "5月25日晚间，近期股价大涨的“算力租赁”概念股行云科技披露了一笔由控股子公司签下的大额订单。根据公告，此次拟出售的产品为公司自有品牌企业级PCIe SSD产品（一种采用高速串行计算机扩展总线接口的固态硬盘），主要面向AI（人工智能）服务器相关业务，含税总金额为3.22亿元。记者注意到，合同涉及的自研企业级SSD硬盘存储业务，是行云科技首次进入的全新业务领域。今年3月底，行云科技公告称，公司拟对外投资设立合资公司，该合资公司就是此次签订合同的控股子公司——行云存算（深圳）科技有限公司。值得注意的是，从行云科技宣布成立合资公司到此次披露超3亿元的大额订单，中间仅过去不到两个月的时间。（每日经济新闻）", "ctime": 1779765888, "time_str": "11:24:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260526/c676970728.shtml"}, {"id": "4406131", "title": "今年美山火为近20年来同期最多", "content": "今年春季以来，美国各地山火频发，数据显示，截至5月22日，美国今年已发生近3万起山火，为近20年来同期最多，总过火面积超过8000平方公里，是过去10年平均水平的两倍，山火造成的损失则创下14年来新高。报道指出，干旱与厄尔尼诺现象是导致今年美国山火形势“异常严峻”的重要原因。截至今年4月底，不同程度的干旱覆盖了全美近63%的地区。厄尔尼诺现象则将带来更多的高温和雷暴天气。预计未来几个月内，美国的山火形势还将进一步恶化。（CCTV国际时讯）", "ctime": 1779765871, "time_str": "11:24:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260526/c676970725.shtml"}, {"id": "4406125", "title": "广东：坚定不移强化企业创新主体地位", "content": "5月26日，广东省人民政府新闻办公室举行“开局起步‘十五五’”广东专场新闻发布会。广东省科学技术厅厅长王月琴表示，广东区域创新综合能力连续9年全国第一，其中最大优势就是企业创新能力强。全省高新技术企业7.4万家、入库科技型中小企业5.6万家，均居全国前列，涌现出一批具有全球影响力的科技领军企业。“十五五”时期，广东将坚定不移强化企业创新主体地位，把平台、项目、人才、资金等创新资源，更多布局到企业、对接到企业。（上证报）", "ctime": 1779765744, "time_str": "11:22:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260526/c676970686.shtml"}, {"id": "4406123", "title": "韩国金融监督院称三星成韩国负债最多企业集团", "content": "韩国金融监管机构在声明中表示，三星已成为韩国负债最多的企业集团，到2025年底总负债超过了SK集团。芯片制造商SK海力士的母公司SK集团排名落至第三位，现代汽车排名第二；之后是乐天第四，LG第五。总体而言，共有42家企业集团被认定为高负债企业，上一年41家。截至去年底，这些集团的银行信贷未偿余额为386.9万亿韩元（2,550亿美元），比上年增长4.1%。", "ctime": 1779765725, "time_str": "11:22:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260526/c676970676.shtml"}, {"id": "4406105", "title": "通信网络设备及器件板块持续走低", "content": "通信网络设备及器件板块持续走低，美利信跌超11%，三旺通信、光库科技、仕佳光子、德科立等跟跌。", "ctime": 1779765346, "time_str": "11:15:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260526/c676970519.shtml"}, {"id": "4406101", "title": "特朗普：伊朗持有的浓缩铀要么由美方运回美国销毁，要么在相关机构监督下在伊朗销毁", "content": "美国总统特朗普25日在社交媒体发文说，伊朗持有的浓缩铀要么由美方运回美国销毁，要么在相关机构监督下在伊朗销毁。特朗普写道，伊朗浓缩铀“要么立即交给美国”，由美方运回国内予以销毁；“更好的是，在与伊朗伊斯兰共和国通力协作与协调下，就地或在另一处可以接受的地点销毁”，整个过程及相关事宜须由“原子能委员会”或等同机构全程见证。美国有线电视新闻网认为，与特朗普以往表态相比，此次表态显示他对伊朗参与处置浓缩铀过程持“开放态度”。（新华社）", "ctime": 1779765319, "time_str": "11:15:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260526/c676970509.shtml"}, {"id": "4406087", "title": "两部门再次紧急预拨1.6亿元中央自然灾害救灾资金", "content": "记者从财政部了解到，在此前预拨1.2亿元基础上，5月26日，财政部、应急管理部再次紧急预拨1.6亿元中央自然灾害救灾资金，支持湖南、重庆等5省（区、市）做好自然灾害应急抢险救灾工作。5月中旬以来，我国南方多地遭遇持续强降雨，引发严重洪涝、地质灾害；广西柳州5.2级地震造成人员伤亡和财产损失。此次，两部门预拨1.1亿元，支持安徽、湖南、重庆、贵州4省（市）开展防汛救灾工作，重点做好排危除险、搜救转移安置受灾人员等工作，切实保障人民群众生命财产安全；预拨0.5亿元，支持广西做好地震灾害受灾群众救助和倒损民房修复等工作，推动灾区尽快恢复正常生产生活秩序。当前，我国正值汛期，防汛救灾形势复杂严峻。财政部称，将切实绷紧防汛救灾这根弦，始终把保障人民群众生命财产安全放在第一位，紧盯灾情发展变化，强化资金保障，支持地方做好防汛救灾工作。（新华社）", "ctime": 1779764826, "time_str": "11:07:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260526/c676970291.shtml"}, {"id": "4406083", "title": "沪深京三市成交额超2万亿元，较上日此时放量805亿元", "content": "据同花顺iFinD数据，沪深京三市成交额超2万亿元，较上日此时放量805亿元，预计全天成交金额约3.3万亿元。截至目前，沪市成交额8882亿元，深市成交额11003亿元，北证50成交额129亿元。", "ctime": 1779764755, "time_str": "11:05:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260526/c676970237.shtml"}, {"id": "4406081", "title": "广州：去除“本市唯一住房”和公积金贷款使用次数的限制", "content": "2026年5月26日，广州住房公积金管理中心印发规范性文件《广州商业性个人住房贷款转住房公积金个人住房贷款实施办法（暂行）》。其中提出，扩大商业贷款银行范围，取消“原商贷银行为住房公积金受托银行”的限制，允许非住房公积金承办银行的商业贷款申请转为纯住房公积金贷款。放宽贷款类型、年限和公积金缴存时限要求，对于住房公积金贷款承办银行的商转公业务，允许申请人可申请的商转公贷款额度不足以全额偿还原商业贷款本息的，可以选择转为组合贷款。开户并累计缴存住房公积金时限要求从满“60个月”减少为“36个月”。原商业贷款放款年限从“3年以上”缩短为“2年以上”。去除“本市唯一住房”和公积金贷款使用次数的限制，不再要求“贷款房屋是申请人家庭在本市唯一住房”，支持首套及第二套改善型住房申请。申请人“未使用过或只使用过一次住房公积金贷款”也可办商转公，不受“未使用过住房公积金贷款”的限制。", "ctime": 1779764752, "time_str": "11:05:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260526/c676970235.shtml"}, 本次“商转公”政策的修订，系统性地扩大受益面，降低转贷门槛。原办法只能在公积金受托银行申请商转公，修订后，非公积金受托银行的商业贷款，符合条件的也可以申请转为公积金贷款。商转公可贷额度的计算比例，由原来的70%提高到现在的80%，进一步加大对存量商业贷款的支持力度，尽力减轻缴存人的贷款利息负担。（南方Plus）", "ctime": 1779764324, "time_str": "10:58:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260526/c676970099.shtml"}];

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
