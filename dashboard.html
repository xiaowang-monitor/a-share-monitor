3日登上南千岛群岛（日本称北方四岛），并视察了伊图鲁普岛（日本称择捉岛）上一家水产品加工厂。克里姆林宫在社交媒体发布消息说，普京与水产品加工厂员工交谈，并与他们合影留念。他还品尝了当地生产的鱼子酱。记者获悉，这是普京首次登上南千岛群岛。因在南千岛群岛（日本称北方四岛）的归属问题上存在争议，俄日在二战结束后至今未缔结和平条约。（央视新闻）", "ctime": 1786597428, "time_str": "13:03:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260813/c678924487.shtml"}, {"id": "4950595", "title": "联想集团港股直线拉升，涨超12%", "content": "联想集团港股直线拉升，涨超12%，报32.72港元。消息面上，联想集团披露了2026/27财年第一财季业绩，实现营收269.43亿美元(约1834亿元)，同比增长43%，创单季度历史新高；经调整净利润10.75亿美元(约73亿元)，同比增长176%，首次突破10亿美元里程碑；经调整净利润率达4%。", "ctime": 1786597345, "time_str": "13:02:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260813/c678924464.shtml"}, {"id": "4950589", "title": "剑桥科技触及涨停", "content": "剑桥科技触及涨停，成交额35.41亿元。", "ctime": 1786597274, "time_str": "13:01:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260813/c678924451.shtml"}, {"id": "4950587", "title": "“十五五”首条千万吨级原油管道投产", "content": "国家管网集团8月13日宣布，国家石油天然气基础设施重点项目——连云港至仪征原油管道工程连云港至淮安段投产一次成功。这是我国“十五五”开局投产的首条千万吨级原油管道，对优化我国中东部地区供能结构、完善油气“全国一张网”布局具有重要意义。连仪管道连淮段投产后，与已投运的日仪管道联通，将原油最终输送至我国东部原油枢纽仪征站，日输量最高可达7万吨，服务保障江苏省及长江沿线炼化企业，有效提升长江沿线用户用能多通道资源保障能力，对我国长三角区域油气管网布局优化、进口原油资源统一调配等发挥重要作用。（新华社）", "ctime": 1786597134, "time_str": "12:58:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260813/c678924438.shtml"}, {"id": "4950579", "title": "机构：第二季度全球OLED显示器出货季增26.1%", "content": "根据TrendForce集邦咨询最新调查，2026年第二季全球OLED显示器市场展现强劲的成长韧性。在各大品牌厂商陆续推出新机种、带动整体出货量的同时，适逢“618”年度大型电商节庆促销档期的拉货效益加持，加上市场主力27英寸QHD规格机种持续渗透与积极推广，整体产业链动能全面升温。这波多重利好的叠加，推升第二季OLED显示器出货量季增26.1%，与2025年同期相比，年增率更高达98%，几乎实现翻倍成长，反映出OLED显示技术在电竞与高端显示市场的渗透率正在快速扩大。（界面新闻）", "ctime": 1786596685, "time_str": "12:51:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260813/c678924374.shtml"}, {"id": "4950577", "title": "普京：必须确保俄所有边境和领土安全", "content": "俄罗斯总统普京13日在“瓦良格”号导弹巡洋舰上与俄太平洋舰队司令等高级军官举行会议。他在会上表示，必须确保俄所有边境和领土安全。普京说，目前确保俄国家安全的任务主要通过对乌克兰特别军事行动完成，俄还要确保所有边境和领土的安全。普京12日还观摩了太平洋舰队的演习。（央视新闻）", "ctime": 1786596479, "time_str": "12:47:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260813/c678924345.shtml"}, {"id": "4950573", "title": "日本央行考虑10月提高利率，政府支持以维持干预措施有效性", "content": "消息人士透露，日本央行正在考虑在10月份提高利率，政府也支持这一举措，以维持其干预措施的有效性。（新浪财经）", "ctime": 1786596449, "time_str": "12:47:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260813/c678924338.shtml"}, {"id": "4950571", "title": "世卫组织说刚果（金）埃博拉疫情传播之快前所未有", "content": "世界卫生组织总干事谭德塞12日说，刚果（金）本轮埃博拉疫情传播速度之快前所未有，可能成为全球有记录以来规模最大的埃博拉疫情。 “这已是有记录以来第二大埃博拉疫情，传播速度超过以往任何一次。”谭德塞当天在日内瓦举行的例行记者会上说，“按照目前的发展速度，其规模可能超过2014年至2016年的西非埃博拉疫情。” 谭德塞说，刚果（金）已累计报告埃博拉确诊病例4449例，死亡2061例，防控工作一直处于被动追赶状态。最令人担忧的是，较高比例的死亡病例出现在社区，既不在治疗中心内，也不在密切接触者名单中，这表明存在尚未被发现的传播链条。只有摸清并切断所有传播链，疫情才能得到遏制。 世卫组织官员阿卜迪拉赫曼·马哈茂德说，眼下疫情仍未达到峰值，如果加强监测、完善护理、落实安全安葬等防控措施能够在各传播区同步推进，疫情形势有望在3个月内出现转折。 世卫组织网站数据显示，2014年至2016年的西非埃博拉疫情是1976年埃博拉病毒被发现以来规模最大的一次，累计报告病例超过2.86万例，约1.13万人死亡。(新华社)", "ctime": 1786596431, "time_str": "12:47:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260813/c678924336.shtml"}, {"id": "4950561", "title": "中国钙钛矿量产技术再登《自然》", "content": "南京大学助理教授肖科、教授谭海仁课题组联合仁烁光能产业化团队，开发出一种基于羧酸铅材料的表面钝化新策略，成功制备出认证效率达22.0%（0.72m²全面积）的钙钛矿光伏组件，并通过IEC61215/IEC61730全序列可靠性测试。研究成果以“Lead carboxylates passivation for meter-scale perovskite solar modules”为题，于2026年8月12日在线发表于国际顶级学术期刊《自然》。（上海证券报）", "ctime": 1786596018, "time_str": "12:40:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260813/c678924246.shtml"}, {"id": "4950495", "title": "安徽启用茨淮新河分泄颍河洪水", "content": "记者从安徽省水利厅了解到，8月13日，安徽启用茨淮新河分泄颍河洪水，全力降低颍河水位。颍河是淮河重要支流。受颍河上游河南省持续来水影响，安徽颍河水位快速上涨，预计阜阳闸8月15日洪峰水位31.4米，超警戒水位0.9米。安徽省水利厅提前研判，经商水利部淮河水利委员会及沿线各市，决定于13日11时启用茨淮新河分泄颍河洪水，全力降低颍河水位，最大限度减轻流域防洪压力。茨淮新河起自阜阳茨河铺，与颍河相接，是一条大型人工河道，全长134.2公里。（新华社）", "ctime": 1786595400, "time_str": "12:30:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260813/c678924026.shtml"}, {"id": "4950483", "title": "2026年7月，中国绿证价格指数收于222.8点，环比上涨23.1%", "content": "国家能源局数据显示，2026年7月，中国绿证价格指数收于222.8点（以2025年1月为基期100点），环比上涨23.1%，同比上涨11.2%。", "ctime": 1786595135, "time_str": "12:25:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260813/c678923984.shtml"}, {"id": "4950477", "title": "摩洛哥称监测到社媒帖文煽动民众偷渡 已展开调查", "content": "当地时间12日，摩洛哥内政部发言人哈勒菲发表声明称，内政部近日监测到部分社交媒体平台上流传来源不明的帖文，煽动大规模群体性偷渡。摩洛哥政府正密切监控相关动向，已对多名涉嫌煽动非法偷渡的嫌疑人展开调查。摩洛哥政府已采取一切必要措施，严厉打击任何企图非法跨越边境前往休达的行为，并拦截所有参与者。据悉，部分社交媒体平台上出现帖文，煽动民众在8月15日从摩洛哥越境进入西班牙飞地休达。休达位于非洲西北部、直布罗陀海峡附近的地中海沿岸，与摩洛哥接壤。近日，大批非法移民从摩洛哥方向进入休达，引发近年来西班牙最严重的边境移民危机。（央视新闻）", "ctime": 1786594713, "time_str": "12:18:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260813/c678923831.shtml"}, {"id": "4950469", "title": "8月13日午间公告一览：联想集团第一季度收入269亿美元，同比增长43%", "content": "联想集团公告，截至2026年6月30日止三个月（2026/27财年第一季度），集团收入269.43亿美元，同比增长43%，创单季度新高。公司权益持有人应占亏损为6.09亿美元，而去年同期溢利为5.05亿美元；经调整公司权益持有人应占溢利同比增长176%至10.75亿美元，首次突破10亿美元。", "ctime": 1786594279, "time_str": "12:11:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260813/c678923687.shtml"}, {"id": "4950465", "title": "大陆航空科技控股：预计上半年亏损不多于1.05亿港元", "content": "大陆航空科技控股公告，预期截至2026年6月30日止六个月录得除税后亏损不多于1.05亿港元，上年同期除税后溢利约6400万港元。亏损由盈利警告公告所述的7000万港元最多增至1.05亿港元，乃由于就物业出售重新计量持作出售资产所产生的估计亏损拨备约3800万港元所致。", "ctime": 1786594231, "time_str": "12:10:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260813/c678923676.shtml"}, {"id": "4950461", "title": "联想集团：第一季度收入269亿美元，同比增长43%", "content": "联想集团公告，截至2026年6月30日止三个月（2026/27财年第一季度），集团收入269.43亿美元，同比增长43%，创单季度新高。公司权益持有人应占亏损为6.09亿美元，而去年同期溢利为5.05亿美元；经调整公司权益持有人应占溢利同比增长176%至10.75亿美元，首次突破10亿美元。", "ctime": 1786594226, "time_str": "12:10:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260813/c678923673.shtml"}, {"id": "4950459", "title": "希慎兴业：2026年上半年基本溢利11.07亿港元同比增7.4%", "content": "希慎兴业公告，截至2026年6月30日止6个月，营业额17.28亿港元，同比微降0.1%。经常性基本溢利10.49亿港元，同比增长1.7%；基本溢利11.07亿港元，同比增长7.4%，主要受惠于出售竹林苑住宅单位的公平值收益带动。公布溢利7300万港元，同比下降2.7%。每股基本盈利7港仙。董事会宣派第一次中期股息每股27港仙，与上年持平。", "ctime": 1786594220, "time_str": "12:10:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260813/c678923670.shtml"}, {"id": "4950453", "title": "欧洲最高活火山持续喷发 西西里岛航班遭严重干扰", "content": "由于意大利西西里岛东岸的“欧洲最高活火山”埃特纳火山持续喷发，位于火山附近的卡塔尼亚机场12日两次宣布延长关闭状态，最新时限至当地时间14日2时。自7日以来，埃特纳火山喷发出大量火山灰和炽热的碎岩石。意大利国家地球物理学与火山学研究所说，两股浓密的熔岩流分别从海拔2360米和2750米的两个位置涌出。此后，又有两股新的熔岩流形成。火山喷发严重干扰了西西里岛的航班运行。卡塔尼亚机场12日先是宣布将暂停航班起降延长至13日16时，当天深夜又将停航时限延长至14日2时。此次断航正值度假高峰期，该机场自8日以来已有数百航班取消，另有大量航班延误或转至西西里岛其他机场起降，数千旅客行程受到影响。埃特纳火山喷发还波及马耳他，当地因出现火山灰云而取消部分航班。（新华社）", "ctime": 1786594022, "time_str": "12:07:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260813/c678923592.shtml"}, {"id": "4950449", "title": "探索“红灯停表”等 京沪共治外卖平台“内卷式”竞争", "content": "平台经济“破卷向善”第二次协商对话在京召开。京沪两地市场监管部门围绕外卖骑手算法优化，组织三家外卖平台与骑手共商共治，同时邀请专家学者、人大代表等多方协商优化举措，进一步保护外卖骑手合法权益，推动行业从“速度竞赛”转向“质量竞争”，围绕算法评估优化、加强管理引导、常态化协商共治等三方面推出一系列措施。（央视新闻）", "ctime": 1786593970, "time_str": "12:06:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260813/c678923583.shtml"}, {"id": "4950443", "title": "诺仕机器人完成近亿元A+轮融资", "content": "精密传动部件供应商诺仕机器人（NOUSBOT）近日完成近亿元A+轮融资。本轮由顺为资本领投，望千铭诚跟投。资金将主要用于微型行星滚柱丝杠产能扩张、产品迭代及海外市场布局。至此，该公司已完成四轮融资，历史投资方包括上汽创投、浦东科创、联想创投等产业资本。（科创板日报）", "ctime": 1786593910, "time_str": "12:05:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260813/c678923563.shtml"}, {"id": "4950439", "title": "港股午评：恒生指数涨0.07%，恒生科技指数涨0.3%", "content": "港股午间收盘，恒生指数涨0.07%，恒生科技指数涨0.3%。恒指港股通ETF银华（159318）涨0.08%，港股通科技ETF鹏华（159751）涨0.44%。板块方面，被动元件、可选消费经销Ⅲ板块涨幅靠前；种植业、铝板块跌幅靠前。个股方面，剑桥科技涨15.37%，布鲁可涨15.26%，三环集团涨11.75%，耐世特涨11.61%，博泰车联涨9.18%；旺山旺水-B跌20.05%，创新实业跌8.26%，嘉耀控股跌7.97%，鹰普精密跌7.36%，思格新能跌6.98%。", "ctime": 1786593814, "time_str": "12:03:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260813/c678923551.shtml"}, {"id": "4950391", "title": "外卖平台“破卷向善” 三大平台将在京率先落地“红灯停表”", "content": "今天（13日），记者从北京市市场监督管理局获悉，平台经济“破卷向善”第二次协商对话在京召开。京沪两地市场监管部门围绕外卖骑手算法优化，组织三家外卖平台与骑手共商共治，同时邀请专家学者、人大代表等多方协商优化举措，进一步保护外卖骑手合法权益，推动行业从“速度竞赛”转向“质量竞争”，围绕算法评估优化、加强管理引导、常态化协商共治等三方面推出一系列措施。（央视新闻）", "ctime": 1786593210, "time_str": "11:53:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260813/c678923426.shtml"}, {"id": "4950381", "title": "机构：第二季度中国平板电脑市场出货量796万台，同比下降4.4%", "content": "国际数据公司（IDC）发布了2026年第二季度中国平板电脑市场季度跟踪报告。数据显示，2026年第二季度，中国平板电脑市场出货量为796万台，同比下降4.4%，降幅较第一季度小幅收窄。但从市场表现来看，市场压力并未缓解，反而进一步放大。商用市场的大幅增长主要来自涨价预期下的需求前置，而消费市场则在成本上涨、需求提前释放等因素影响下同比下降9.8%。表面上市场跌幅收窄，实际上成本上涨正在加速向需求端传导。", "ctime": 1786592989, "time_str": "11:49:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260813/c678923390.shtml"}, {"id": "4950373", "title": "沧州明珠：具备生产5u超薄高强隔膜的能力 目前该类产品尚未形成批量供应、批量销售", "content": "沧州明珠8月13日在互动平台表示，公司具备生产5u超薄高强隔膜的能力。目前该类产品尚未形成批量供应、批量销售，针对客户尚处于小批量试用阶段。", "ctime": 1786592806, "time_str": "11:46:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260813/c678923366.shtml"}, {"id": "4950367", "title": "川润股份：向特定对象发行股票申请获深交所受理", "content": "川润股份公告，公司近日收到深交所出具的《关于受理四川川润股份有限公司向特定对象发行股票申请文件的通知》（深证上审〔2026〕244号），深交所认为申请文件齐备，决定予以受理。本次发行事项尚需通过深交所审核并获得中国证监会同意注册的批复后方可实施，最终能否通过及时间尚存在不确定性。", "ctime": 1786592524, "time_str": "11:42:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260813/c678923326.shtml"}, {"id": "4950365", "title": "美团上线外卖骑手“等灯停表”功能，首批路测已完成", "content": "美团今天上线外卖骑手“等灯停表”功能在京首个正式版本，试点区域已开始路测。从多位骑手处证实，首批路测已完成。据悉，今年上半年，美团配送安全技术团队已在北京部分道路开展产品内测，并搭建产品雏形，为全国各地试点落地提供了范本，目前已在率先接入交通数据的北京朝阳区、通州区、经济技术开发区的部分道路进行试点路测。（新浪科技）", "ctime": 1786592514, "time_str": "11:41:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260813/c678923324.shtml"}, {"id": "4950359", "title": "国内多家金店金饰价格多数上涨，最高报1340元/克", "content": "据同花顺iFinD数据，今日国内黄金饰品价格对比显示，黄金珠宝品牌公布的境内足金首饰价格较昨日多数上涨，最高报1340元/克。", "ctime": 1786592425, "time_str": "11:40:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260813/c678923298.shtml"}, {"id": "4950355", "title": "南向资金净买入超50亿港元", "content": "据同花顺iFinD数据，截至目前，南向资金净买入超50亿港元，其中港股通（沪）买入超28.55亿港元，港股通（深）买入超21.67亿港元。", "ctime": 1786592328, "time_str": "11:38:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260813/c678923274.shtml"}, {"id": "4950347", "title": "软通动力中标哈电集团财务公司核心业务系统信创升级改造项目", "content": "近日，软通动力成功中标哈尔滨电气集团财务有限责任公司核心业务系统信创升级改造项目。（软通动力）", "ctime": 1786592218, "time_str": "11:36:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260813/c678923131.shtml"}, {"id": "4950327", "title": "ETF两市成交额报2937.04亿元，较昨日此时放量515.46亿元", "content": "截至目前，ETF两市成交额报2937.04亿元，较昨日此时放量515.46亿元，分类型来看，股票型ETF成交额953.51亿元，债券型ETF成交额1452.02亿元，货币型ETF成交额88.18亿元，商品型ETF成交额49.09亿元，QDII型ETF成交额394.25亿元。", "ctime": 1786591902, "time_str": "11:31:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260813/c678923010.shtml"}, {"id": "4950325", "title": "ETF午评：科创创新药ETF领涨5.09%，工业有色ETF领跌2.69%", "content": "ETF午间收盘涨跌不一，科创创新药ETF（589720）领涨5.09%，科创创新药ETF（589120）涨4.84%，科创医药ETF（588860）涨4.32%，工业有色ETF（159032）领跌2.69%，黄金股ETF（517400）跌2.68%，黄金股ETF（517520）跌2.55%。", "ctime": 1786591858, "time_str": "11:30:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260813/c678922994.shtml"}, {"id": "4950323", "title": "A股午评：双创指数均涨超1%，医疗服务、CRO概念、创新药板块涨幅居前", "content": "A股三大指数早盘集体上涨，截至午盘，上证指数涨0.42%，深证成指涨0.73%，创业板指涨1.61%，北证50涨0.51%，科创50指数涨1.9%。全市场成交额15997亿元，较上日放量2085亿元，全市场超3000只个股下跌。板块题材上，医疗服务、CRO概念、创新药、生物制品、细胞免疫治疗板块涨幅居前；贵金属、油气开采及服务、工业金属、房地产、光伏设备板块跌幅居前。盘面上，创新药板块探底回升，博济医药、万邦医药、陇神戎发、新里程等股涨停，舒泰神、药石科技、上海凯宝涨幅居前。CPO板块表现活跃，共进股份、天洋新材涨停，天孚通信一度涨超13%，金禄电子、长盈通、德科立、炬光科技涨幅居前。算力租赁板块冲高回落，城地香江、立昂技术、利通电子、群兴玩具等股涨停，宏景科技、金刚光伏、汉鑫科技涨幅居前。贵金属板块震荡走低，晓程科技、招金黄金、湖南白银跌幅居前。油气开采及服务板块低开低走，通源石油、科力股份、贝肯能源跌幅居前。", "ctime": 1786591843, "time_str": "11:30:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260813/c678922992.shtml"}, {"id": "4950321", "title": "今年三峡枢纽通过量已达1亿吨", "content": "记者从长江三峡通航管理局了解到，截至2026年8月13日0时40分，三峡枢纽通过量达1亿吨。其中，三峡船闸运行5863闸次，通过船舶21562艘次，通过量9727.6万吨；三峡升船机运行2557厢次，通过船舶2590艘次、旅客44.6万人次。共保障2846.8万吨民生物资、77.8万吨重点急运物资便捷过坝。自2011年首次突破1亿吨大关以来，三峡枢纽年通过量已连续15年保持高位运行，且2021—2025年连续5年突破1.5亿吨，持续为长江经济带产业链供应链稳定、沿江地区民生物资保供及长江流域经济社会高质量发展提供 2亿元，建设周期为三年。基地核心布局碳化硅零部件、高纯硅精密零部件、氮化铝陶瓷材料及配套零部件三大品类，属于芯片刻蚀、薄膜沉积等前道制造环节刚需耗材。基地投产后，可快速扩充公司现有产能，就近服务华中区域晶圆制造企业，缩短交付周期。（中国光谷）", "ctime": 1786591314, "time_str": "11:21:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260813/c678922795.shtml"}, {"id": "4950289", "title": "复旦团队首次制备单铜氧层高温超导体", "content": "高温超导电性是未来高效电力传输和高性能电子器件发展的重要方向，但其微观机理始终是凝聚态物理的“皇冠之谜”。北京时间8月12日晚间，复旦大学物理学系张远波教授团队与合作者以“Superconducting 2D cuprate with a single CuO  plane”为题在《自然》（Nature）发表研究成果，成功将铜基高温超导体削薄至仅含一个超导平面——即单个CuO 面。这一“极限操作”不仅证实了高温超导的二维本质，更在超导-绝缘体转变的临界点发现了奇异的“反常金属态”和量子临界现象，为研究高温超导机理提供了全新的量子实验平台。（复旦大学）", "ctime": 1786591081, "time_str": "11:18:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260813/c678922657.shtml"}, {"id": "4950267", "title": "沪深京三市成交额超1.5万亿元，较上日此时放量2066亿元", "content": "据同花顺iFinD数据，沪深京三市成交额超1.5万亿元，较上日此时放量2066亿元，预计全天成交金额约2.5万亿元。截至目前，沪市成交额6785亿元，深市成交额8130亿元，北证50成交额94亿元。", "ctime": 1786590653, "time_str": "11:10:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260813/c678922498.shtml"}, {"id": "4950257", "title": "一年来我国已累计清理处置6000多万吨固体废物", "content": "国务院新闻办公室今天（13日）举行“开局起步‘十五五’”系列主题新闻发布会。会上介绍，自去年6月启动全国非法倾倒处置固体废物专项整治行动以来，我国已累计排查发现问题5.6万多个，完成整改4.5万多个，清理处置各类固体废物6000多万吨，一大批存量污染问题得到有效整治。（央视新闻）", "ctime": 1786590513, "time_str": "11:08:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260813/c678922430.shtml"}, {"id": "4950253", "title": "南向资金净买入超40亿港元", "content": "据同花顺iFinD数据，截至目前，南向资金净买入超40亿港元，其中港股通（沪）买入超24.56亿港元，港股通（深）买入超15.65亿港元。", "ctime": 1786590432, "time_str": "11:07:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260813/c678922398.shtml"}, {"id": "4950241", "title const SECTORS  = [{"name": "数据要素", "hit_count": 40, "etfs": []}, {"name": "人工智能", "hit_count": 32, "etfs": []}, {"name": "金融", "hit_count": 32, "etfs": []}, {"name": "消费", "hit_count": 21, "etfs": []}, {"name": "半导体", "hit_count": 13, "etfs": []}, {"name": "地产", "hit_count": 11, "etfs": []}, {"name": "医药", "hit_count": 11, "etfs": []}, {"name": "军工", "hit_count": 10, "etfs": []}];
const META     = {"update_time": "2026-08-13 13:16:25", "sentiment_score": 62.78538812785388, "agents": []};

// 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}
