}

.score-bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s; }
.up { color: var(--red); }
.down { color: var(--green); }
.pulse { animation: pulse 2s infinite; }
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}
.glow { box-shadow: 0 0 20px rgba(59,130,246,0.15); }

有1家机构专用席位净卖出878.95万元。", "ctime": 1790065409, "time_str": "16:23:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260922/c680170184.shtml"}, {"id": "5223181", "title": "商务部副部长兼中华人民共和国国际贸易谈判副代表凌激赴北京市开展调研并主持召开外资企业圆桌会", "content": "9月21日，商务部副部长兼中华人民共和国国际贸易谈判副代表凌激赴北京市中关村生命科学园开展调研并主持召开外资企业圆桌会。康明斯、诺和诺德、ABB、丹纳赫等30多家外资企业代表参加活动。北京市副市长唐文弘出席活动。凌激表示，北京在营造良好营商环境、扩大服务业开放方面持续发挥示范作用，大量外资企业看好北京发展前景并持续在京布局，投资科技创新，打造良好的产业生态。中国将坚定不移扩大高水平对外开放，为外资企业在华经营提供稳定性、确定性。参加活动的外资企业表示，北京创新要素集聚、营商环境优越，为企业在京发展提供了广阔空间，坚定了企业继续扩大在华投资的信心，愿继续扎根北京、深耕中国，积极参与中国高质量发展。（商务部）", "ctime": 1790065364, "time_str": "16:22:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260922/c680170130.shtml"}, {"id": "5223175", "title": "拓新药业：甲磺酸沙非胺原料药获批Y20240000472号", "content": "拓新药业公告，全资子公司新乡制药股份有限公司甲磺酸沙非胺原料药获得国家药品监督管理局签发的《化学原料药上市申请批准通知书》（登记号：Y20240000472），审批结论为符合药品注册有关要求，批准注册。完成GMP符合性检查后，该原料药将具备国内市场生产销售资格。", "ctime": 1790065292, "time_str": "16:21:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260922/c680170030.shtml"}, {"id": "5223173", "title": "马克龙呼吁欧盟管控能源价格", "content": "法国总统马克龙近日致信欧盟委员会主席冯德莱恩，呼吁欧盟立刻采取放松燃料质量标准等措施，以压低能源价格。马克龙希望欧盟暂时放宽炼油企业的技术标准，以便将航空燃料和柴油的产量提高至多20%。他同时希望欧盟允许分销商用含有10%生物燃料的B10柴油替换含有7%生物燃料的B7柴油，后者是当前欧洲普遍采用的混合燃料。在马克龙看来，这项措施将支持柴油供应，并为燃料供应“提供额外的利润空间”。第三项措施则涉及欧盟2024年5月通过的旨在控制能源部门甲烷排放的“欧盟甲烷法规”。马克龙希望将该法规的生效期从明年1月再推迟一年。（新华社）", "ctime": 1790065281, "time_str": "16:21:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260922/c680169998.shtml"}, {"id": "5223151", "title": "拉加经委会：极端天气或重创拉美和加勒比地区经济", "content": "联合国拉丁美洲和加勒比经济委员会（拉加经委会）21日发布报告说，2026至2027年可能出现超高强度厄尔尼诺现象，严重冲击拉美和加勒比地区经济，加剧贫困，并影响能源、农业、渔业和基础设施等多领域。报告指出，一次极端厄尔尼诺事件将在三年内造成拉美地区国内生产总值（GDP）累计至少损失2%，其中一半集中在事件发生后的第一年；到本十年末，贫困人口最多将增加480万人。（新华社）", "ctime": 1790065102, "time_str": "16:18:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260922/c680169788.shtml"}, {"id": "5223139", "title": "科森科技：签署股权转让协议，徐正良以0.4261%股权补偿", "content": "科森科技公告，公司此前披露特丽亮第三期业绩承诺未完成，业绩补偿义务人需补偿；2026年9月21日，公司与徐正良签署《股权转让协议》，徐正良以其持有的特丽亮0.4261%股权（对应出资额610,428.49元）按人民币0元价格转让给公司。截至公告披露日，标的股权尚未完成工商变更登记。", "ctime": 1790065024, "time_str": "16:17:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260922/c680169710.shtml"}, {"id": "5223133", "title": "金陵药业：控股子公司获盐酸阿罗洛尔原料药上市批准", "content": "金陵药业公告，控股子公司池州东升药业近日收到国家药监局下发的《化学原料药上市申请批准通知书》，批准盐酸阿罗洛尔原料药注册。该药品主要用于治疗原发性高血压、心绞痛等疾病，获批后可在国内市场生产销售，有利于丰富公司原料药产品线，但暂不会对当期业绩产生重大影响。", "ctime": 1790064947, "time_str": "16:15:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260922/c680169649.shtml"}, {"id": "5223131", "title": "中船特气回应8月六氟化钨出口环比回落：相关产品出口订单总量未受冲击", "content": "在今日举行的中船特气 2026年半年度业绩会上，针对投资者提问，公司8月六氟化钨出口环比下滑（约64吨降至39吨），及三、四季度销量预期，该公司董事长宫志刚表示，8月份，受台风等天气影响，发往部分境外国家、地区的出口船期出现堆积、运输延后等情况，本次事件仅影响物流交付节奏，出口订单总量及境外客户合作关系均未受到冲击。公司基于“一企一策”制定了差异化销售策略，现阶段，公司六氟化钨产品以季度议价为主。（科创板日报）", "ctime": 1790064925, "time_str": "16:15:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260922/c680169625.shtml"}, {"id": "5223127", "title": "健友股份：子公司获美国FDA硫酸阿米卡星注射液增加生产场地注册批件", "content": "健友股份公告，公司子公司Meitheal近日收到美国FDA签发的硫酸阿米卡星注射液增加生产场地的批件，批准在南京健友生化制药股份有限公司场地生产。该药品用于治疗敏感革兰阴性菌所致严重感染，规格为500mg/2mL和1g/4mL。截至目前，公司在该项目上已投入研发费用约409.08万元。新批准产品进一步丰富了公司国际化的产品管线，强化国际市场布局，若后续推进美国市场上市销售，有望对公司经营业绩产生积极影响。", "ctime": 1790064901, "time_str": "16:15:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260922/c680169597.shtml"}, {"id": "5223121", "title": "汇丰新人工智能模型预测一个月后美国收益率下行", "content": "汇丰开发的全新机器学习模型DUSTIN（美国国债方向指标），坚定预判未来一个月美国国债收益率将走低。托马斯·德夫林等分析师在上周日发布的研报中写道：“近期国债曲线短端（3个月期与2年期美国国债）遭到抛售，叠加经济活动数据超预期，促使DUSTIN模型判断未来一个月利率下行。”（新浪财经）", "ctime": 1790064838, "time_str": "16:13:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260922/c680169518.shtml"}, {"id": "5223119", "title": "*ST高科：收到应诉通知书，法院已立案", "content": "*ST高科公告，公司收到北京市顺义区人民法院送达的《应诉通知书》，涉及原告请求确认公司2026年7月16日董事会决议及2026年8月3日临时股东会决议无效等事项。目前案件已立案受理，尚未开庭审理，不涉及具体金额给付请求。", "ctime": 1790064831, "time_str": "16:13:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260922/c680169508.shtml"}, {"id": "5223117", "title": "星源卓镁：签署2.8亿元项目建设协议", "content": "星源卓镁公告，公司此前披露拟由全资子公司星源卓镁（宁波奉化）技术有限公司在奉化经济开发区投资建设轻量化精密结构件智能制造项目。2026年9月21日，公司与奉化经济开发区管理委员会签署项目产业用地建设投资协议，投资2.8亿元人民币建设该项目。", "ctime": 1790064826, "time_str": "16:13:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260922/c680169503.shtml"}, {"id": "5223109", "title": "阿里Qwen Intelligence开启公测，负责人许主洪：我们不做AI手机硬件", "content": "在云栖大会现场，阿里巴巴ATH事业群副总裁、Token Foundry Qwen手机智能负责人许主洪宣布，Qwen Intelligence开启公测，并发布面向下一代AI手机智能的ToB产品——专为手机场景深度优化的模型与Agent解决方案。在方案定位上，许主洪明确表示，Qwen Intelligence不去做手机硬件，而是为行业提供三类核心价值：底层是基于Qwen大模型、专为手机场景深度定制的智能底座；中间层是全栈产品化平台，支持模块化按需组合，兼顾降本与差异化定制；上层是高价值垂直场景解决方案，满足客户真实需求。（新浪科技）", "ctime": 1790064686, "time_str": "16:11:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260922/c680169334.shtml"}, {"id": "5223089", "title": "港股收评：恒生指数涨0.18%，恒生科技指数涨0.34%", "content": "港股收盘，恒生指数涨0.18%，恒生科技指数涨0.34%。恒指港股通ETF银华（159318）涨0.47%，港股通科技ETF鹏华（159751）涨0.46%。板块方面，种植业、安全和报警服务板块涨幅靠前；油品石化贸易、铅锌板块跌幅靠前。个股方面，中环新能源涨10.4%，珞石机器人涨9.82%，海致科技集团涨9.15%，应星控股涨9.11%，康耐特光学涨9.06%；智汇矿业跌11.5%，蓝月亮集团跌8.74%，博泰车联跌6.67%，长光辰芯跌6.61%，智谱跌6.55%。", "ctime": 1790064602, "time_str": "16:10:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260922/c680169038.shtml"}, {"id": "5223077", "title": "海光信息发布首款面向端侧的算力芯片CPU1000系列", "content": "海光信息算力芯片CPU 1000系列正式发布，该产品是面向低功耗、嵌入式和端侧算力需求，采用C86架构打造的轻量级CPU。海光信息总裁沙超群表示，1000系列是海光首款面向端侧智能的算力芯片，标志着公司的算力版图从云侧延伸到边缘和端侧；1000系列并非单一芯片，而是一个面向端侧算力的产品系列，将根据不同场景需求调配CPU、GPU、NPU算力，持续丰富嵌入式产品矩阵。（财联社）", "ctime": 1790064542, "time_str": "16:09:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260922/c680168780.shtml"}, {"id": "5223065", "title": "新朋股份：出资1亿元共投基金完成备案", "content": "新朋股份公告，公司此前经董事会审议通过，拟出资1亿元认购宁波智兴悦恒创业投资合伙企业（有限合伙）基金份额。近日，公司收到基金管理人通知，智兴悦恒已在中国证券投资基金业协会完成备案，备案日期为2026年9月21日，备案编码为SEY290。", "ctime": 1790064466, "time_str": "16:07:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260922/c680168401.shtml"}, {"id": "5223053", "title": "《2026年中国人工智能计算力发展评估报告》：全球AI算力需求满足率将由2024年的79%下降至2027年71%的谷底", "content": "9月21日，在AICC2026人工智能计算大会上，《2026年中国人工智能计算力发展评估报告》（下称《报告》）对外发布。《报告》指出，智能体正成为AI算力需求增长的关键新变量，并以乘数效应推动Token（词元）消耗加速跃升，由此推动中国智能算力增长斜率大幅上调。据悉，该《报告》由国际数据公司（IDC）与浪潮信息联合发布。IDC预测，全球活跃智能体数量将从2026年的7940万个增长至2030年的22.16亿个，复合增长率达到129.8%。同期全球Token消耗量复合增长率达到4822.6%，约为活跃智能体数量增速的37倍。（每日经济新闻）", "ctime": 1790064365, "time_str": "16:06:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260922/c680168062.shtml"}, {"id": "5223043", "title": "科威尔：任毅2026年9月18日至21日减持20万股", "content": "科威尔公告，持股5%以上股东任毅此前披露减持股份计划，2026年9月18日至2026年9月21日通过集中竞价交易累计减持公司股份20万股，直接持股数量由779.47万股减少至759.47万股，占公司总股本由7.15%减少至6.97%，权益变动触及1%刻度。", "ctime": 1790064311, "time_str": "16:05:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.1  "现货黄金失守4300美元/盎司，日内跌0.97%。", "ctime": 1790063852, "time_str": "15:57:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260922/c680166872.shtml"}, {"id": "5222927", "title": "英国首次用无人潜航器发射鱼雷", "content": "英国政府当地时间21日宣布，英国首次用无人潜航器试射一枚鱼雷。据悉，本次试射由英国制造的“神剑”号无人潜航器于上周在英国水域进行，所用鱼雷系美国和澳大利亚联合开发的重型鱼雷。英国政府称，此次试射标志着英美澳三国在潜艇技术方面的“重大进步”。据了解，“神剑”号无人潜航器长12米，正在进行海上测试，其功用之一是保护英国海底电缆和管道。此次试射是美英澳三边安全伙伴关系（AUKUS）防务合作的一部分。这三个国家2021年9月宣布建立AUKUS并开展核潜艇合作。澳大利亚是无核国家，三国推动极具核扩散风险的核潜艇合作，引发国际社会对三国深化军事同盟、破坏地区安全稳定的疑虑和担忧。（央视新闻）", "ctime": 1790063766, "time_str": "15:56:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260922/c680166811.shtml"}, {"id": "5222903", "title": "理奇智能：公司正式签署20亿元投资合作协议", "content": "理奇智能公告，公司此前披露拟与无锡宛山湖产业发展有限公司签订《投资合作协议》，投资建设理奇锂电设备智能制造生产基地及研发中心项目；2026年9月21日，公司正式签署该协议，项目总投资20亿元，协议主要内容与此前披露一致。", "ctime": 1790063622, "time_str": "15:53:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260922/c680166775.shtml"}, {"id": "5222881", "title": "云征动力成功完成数千万元新一轮融资", "content": "近日，江苏云征智能动力科技有限公司（云征动力）成功完成数千万元新一轮融资。本轮融资投资方为无锡梁溪产业协同发展创业投资合伙企业（有限合伙）。本轮募集资金，将主要用于产品批量生产、微小型航空发动机中试平台建设及系列新品开发，支撑规模化交付能力建设。（界面新闻）", "ctime": 1790063483, "time_str": "15:51:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260922/c680166724.shtml"}, {"id": "5222871", "title": "2026中国民企500强发布 营收超千亿元企业达110家", "content": "22日，全国工商联在天津发布“2026中国民营企业500强”及相关调研分析报告。结果显示，2025年，民营企业500强营业收入总额44.93万亿元，营收超过千亿元的企业达110家，其中，京东集团、阿里巴巴（中国）有限公司、恒力集团有限公司位居前三。据介绍，今年全国工商联组织开展第28次上规模民营企业调研，共有6350家2025年营业收入10亿元以上的企业参加，其中营业收入前500位的企业为“2026中国民营企业500强”。根据调研结果，2025年，我国民营企业创新能力、经营效益和核心竞争力持续提升，整体呈现向新向优的发展态势。（新华社）", "ctime": 1790063423, "time_str": "15:50:23", "stock_code": "", "stock_name": "", "stock_market": "", "i const SECTORS  = [{"name": "金融", "hit_count": 51, "etfs": []}, {"name": "人工智能", "hit_count": 42, "etfs": []}, {"name": "半导体", "hit_count": 29, "etfs": []}, {"name": "数据要素", "hit_count": 28, "etfs": []}, {"name": "消费", "hit_count": 17, "etfs": []}, {"name": "新能源", "hit_count": 16, "etfs": []}, {"name": "医药", "hit_count": 14, "etfs": []}, {"name": "军工", "hit_count": 13, "etfs": []}];
const META     = {"update_time": "2026-09-22 16:42:30", "sentiment_score": 60.79545454545455, "agents": []};

// 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
