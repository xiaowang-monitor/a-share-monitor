}

.score-bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s; }
.up { color: var(--red); }
.down { color: var(--green); }
.pulse { animation: pulse 2s infinite; }

const NEWS     = [{"id": "4471139", "title": "英国大曼彻斯特市长伯纳姆亮相补选辩论，挑战工党党首地位", "content": "英国大曼彻斯特市长安迪·伯纳姆4日参加英格兰马克菲尔德选区下院议员补选的候选人辩论，表示将挑战现任首相斯塔默的工党党首地位。伯纳姆强调工党需要进行根本性变革。随着工党近期在地方选举中遭遇重挫，党内要求斯塔默下台的呼声高涨，这场首相争夺战已然白热化。伯纳姆并非首次冲击工党党首之位，此前曾两次竞选失败。现年56岁的伯纳姆并非首次冲击工党党首之位。他2001年起担任下院议员，在2010年和2015年两次竞选工党党首失败后，于2017年离开议会，随后出任大曼彻斯特市长。（新华社）", "ctime": 1780655509, "time_str": "18:31:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260605/c677255869.shtml"}, {"id": "4471115", "title": "乌克兰一食品加工厂遭袭致至少4人死亡", "content": "乌克兰基辅州州长卡拉什尼克5日在社交媒体上发文说，当地一家食品加工厂遭无人机袭击，造成至少4人死亡、11人受伤。卡拉什尼克说，袭击导致工厂起火，办公楼受损，有2人可能被埋在受损建筑物下。乌克兰国家紧急情况局等应急部门的人员正在现场开展救援和清理工作。乌国家紧急情况局发布的救援现场图片和信息显示，遭袭的是基辅州一家儿童乳制品加工厂。乌克兰空军5日在社交媒体发文称，4日晚至5日凌晨，俄军向乌境内发射2枚导弹和216架无人机，其中198架无人机被拦截。俄军16架攻击型无人机击中乌境内13处地点，俄军导弹未击中目标。（新华社）", "ctime": 1780655385, "time_str": "18:29:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260605/c677255811.shtml"}, {"id": "4471109", "title": "巨人网络：公司拟出资1.5亿元参与认购云锋元创私募基金份额", "content": "巨人网络公告，公司与上海麒鹏投资管理有限公司于近日签署了《上海云锋元创私募基金中心（有限合伙）有限合伙协议》，公司拟作为有限合伙人以自有资金认缴出资1.5亿元参与认购上海云锋元创私募基金中心（有限合伙）的基金份额，基金管理人为上海云锋新创投资管理有限公司。", "ctime": 1780655326, "time_str": "18:28:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260605/c677255795.shtml"}, {"id": "4471099", "title": "ST华谊：公开招募重整投资人 报名保证金为人民币5000万元", "content": "ST华谊公告，临时管理人决定公开招募、遴选公司重整投资人。报名时间为2026年7月6日17:00前。报名保证金为人民币5000万元。意向投资人应为依照中华人民共和国法律设立并有效存续的境内企业法人或非法人组织，具有较高的社会责任感和良好的商业信誉。", "ctime": 1780655233, "time_str": "18:27:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260605/c677255765.shtml"}, {"id": "4471089", "title": "天保基建：对全资孙公司增资8.55亿元", "content": "天保基建公告，为满足子公司经营业务发展需求，公司全资子公司天津滨海开元房地产开发有限公司拟以自有资金对其全资子公司天津天保德源房地产开发有限公司增加投资8.55 /20260605/c677255681.shtml"}, {"id": "4471069", "title": "寒锐钴业：拟投资20.03亿元建设年产4万吨电积镍及4万吨电池级硫酸镍项目", "content": "寒锐钴业公告，公司拟通过全资子公司赣州寒锐新能源科技有限公司在江西省赣州市投资建设“年产4万吨电积镍及4万吨（镍金属量）电池级硫酸镍项目”，项目总投资为20.03亿元，项目资金为公司自有资金或自筹资金。2026年6月4日，公司第五届董事会第二十二次会议审议通过了该议案，本议案尚需提交股东会审议。", "ctime": 1780654979, "time_str": "18:22:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260605/c677255672.shtml"}, {"id": "4471065", "title": "特朗普“老冤家”博尔顿被曝同意认罪", "content": "知情人士4日透露，美国前总统国家安全事务助理约翰·博尔顿与司法部就一项涉“非法保存机密记录”的指控达成认罪协议，他将面临高达225万美元的罚金，但有可能避免最多5年的监禁。法官将决定是否批准这一认罪协议。博尔顿2025年10月受到指控，涉嫌非法存储和传输国防机密信息等18项罪名。据美联社等多家媒体报道，马里兰州一家联邦法院定于26日再次提审博尔顿，届时博尔顿可能正式认罪。（新华社）", "ctime": 1780654963, "time_str": "18:22:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260605/c677255667.shtml"}, {"id": "4471055", "title": "*ST国中：中标1.97亿元项目", "content": "*ST国中公告，控股子公司中科国益中标太原市杨家堡污水处理厂水质提升工程施工项目，中标价为1.97亿元，工期为210日历天。项目包括新建粗格栅及进水泵房、生物池及二沉池等设施，设计规模维持16万吨/日不变。预计项目合同履行将对公司未来经营发展产生积极影响，但目前尚未签订正式合同，合同条款存在不确定性。", "ctime": 1780654845, "time_str": "18:20:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260605/c677255619.shtml"}, {"id": "4471045", "title": "ST晨鸣：收到山东证监局行政监管措施决定书", "content": "ST晨鸣公告，公司于2026年6月5日收到山东证监局下发的行政监管措施决定书，指出2019年至2024年公司向上海仕芥实业有限公司等5家关联方借款，未履行相应审议程序，未及时披露，也未在相关定期报告中予以披露。公司已全部结清与上述关联方的相关业务，且之后未再发生新的业务。公司将健全关联交易及内控管理体系，提高信息披露质量，维护公司及全体股东的利益。", "ctime": 1780654756, "time_str": "18:19:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260605/c677255531.shtml"}, {"id": "4471041", "title": "人形机器人拥有“身份证” 行业探索全生命周期管理", "content": "近日，由工业和信息化部人形机器人与具身智能标准化技术委员会牵头搭建的全国首个人形机器人全生命周期管理服务平台发布，配套的《人形机器人 全生命周期管理规范》标准也同步出台。标准的一大亮点是提出每台人形机器人都将拥有29位字符的身份编码。标委会副主任委员、中国电子学会副秘书长梁靓说，这标志着我国人形机器人产业正式迈入“源头可溯、全程可控、风险可防、责任可究”的规范化发展新阶段。（新华社）", "ctime": 1780654726, "time_str": "18:18:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260605/c677255526.shtml"}, {"id": "4471029", "title": "中塑股份创业板IPO审核状态变更为'提交注册'", "content": "广东中塑新材料股份有限公司创业板IPO审核状态变更为'提交注册'，保荐机构为国信证券。", "ctime": 1780654677, "time_str": "18:17:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260605/c677255490.shtml"}, {"id": "4471017", "title": "ST万邦：石杉碱甲控释片Ⅱ、Ⅲ期临床试验完成200例受试者入组", "content": "ST万邦公告，全资子公司万邦德制药集团有限公司的2.2类新药石杉碱甲控释片用于治疗轻、中度阿尔茨海默病型痴呆的II/III期关键注册临床试验，于近日完成200例受试者入组。", "ctime": 1780654531, "time_str": "18:15:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260605/c677255439.shtml"}, {"id": "4471005", "title": "嘉立创主板IPO审核状态变更为'注册生效'", "content": "深圳嘉立创科技集团股份有限公司主板IPO审核状态变更为'注册生效'，保荐机构为国泰海通。", "ctime": 1780654476, "time_str": "18:14:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260605/c677255413.shtml"}, {"id": "4470997", "title": "河北启动防汛Ⅳ级应急响应", "content": "据河北省气象部门预测，6月5日傍晚到6日，保定、廊坊以南地区有大雨到暴雨，个别地点有大暴雨，保定南部、石家庄、沧州、衡水、邢台北部等地的部分地区6小时雨量可达70毫米以上。经会商研判，依据《河北省防汛抗旱防台风应急预案》，河北省防汛抗旱指挥部决定于6月5日16时对以上区域启动防汛Ⅳ级应急响应。（新华社）", "ctime": 1780654297, "time_str": "18:11:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260605/c677255348.shtml"}, {"id": "4470995", "title": "刚取消小微增速考核 又有大行要求已授信企业补充抵押担保", "content": "金融监管总局取消全国统一的硬性普惠小微贷款增速指标之后，银行业落地情况如何？一家国有大行二级分行人士向记者透露，该行已经开始改变普惠业务的规则，前期通过授信的小微企业，现在被要求补充增加抵押和担保措施，目前KPI导向已经明显向资产质量倾斜。 (21财经)", "ctime": 1780654281, "time_str": "18:11:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260605/c677255346.shtml"}, {"id": "4470993", "title": "深交所：新增关于部分港股通股票上市时间短、自由流通量低、限售股大量解禁等情形的风险揭示", "content": "6月5日，深圳证券交易所发布通知，根据《深圳证券交易所深港通业务实施办法》、中国证券登记结算有限责任公司《内地与香港股票市场交易互联互通机制登记、存管、结算业务实施细则》等有关规定，深圳证券交易所和中国证券登记结算有限责任公司对《深圳证券交易所港股通交易风险揭示书必备条款》（以下简称《必备条款》）进行了修订，新增关于部分港股通股票上市时间短、自由流通量低、限售股大量解禁等情形的风险揭示，现予发布，自2026年6月8日起施行。", "ctime": 1780654247, "time_str": "18:10:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260605/c677255341.shtml"}, {"id": "4470975", "title": "前4个月我国服务进出口总额同比增长4.9%", "content": "商务部5日发布数据显示，2026年1至4月，我国服务进出口总额24853.2亿元，同比增长4.9%。数据显示，1至4月，我国服务出口9850亿元，同比增长15%；服务进口15003.2亿元，同比下降0.8%。服务贸易逆差5153.2亿元，比上年同期缩小1397.4亿元。具体来看，知识密集型服务出口保持较快增长。1至4月，知识密集型服务进出口11041.8亿元，同比增长5.1%，占总体服务进出口的比重为44.4%。知识密集型服务出口5440.9亿元，同比增长11.7%，其中，个人文化和娱乐服务、知识产权使用费增长最快，增速分别为39.5%和20.8%；知识密集型服务进口5600.9亿元，同比下降0.7%。（新华社）", "ctime": 1780654157, "time_str": "18:09:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260605/c677255282.shtml"}, {"id": "4470973", "title": "华兰疫苗：新型佐剂流感病毒裂解疫苗获临床试验批准通知书", "content": "华兰疫苗公告，公司近日收到国家药品监督管理局核准签发的关于新型佐剂流感病毒裂解疫苗的《药物临床试验批准通知书》，注册分类为预防用生物制品3.2类，适应症为预防疫苗相关型别的流感病毒引起的流行性感冒，尤其是增强老年人等免疫力较弱人群的免疫反应水平。该疫苗采用流感病毒裂解抗原并引入以角鲨烯为主要成分的佐剂系统，目前国内尚无同类佐剂流感疫苗产品正式获批上市。本次获批标志着该疫苗研发可正式进入临床试验阶段。", "ctime": 1780654130, "time_str": "18:08:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260605/c677255270.shtml"}, {"id": "4470961", "title": "日本宪法学者：修订“安保三文件”动向危险 难以接受", "content": "近期，日本自民党举行相关会议，就修订“安保三文件”进行讨论，拟进一步提升防卫费支出，强化海上、空中等防卫力量。对此，日本体育大学宪法学教授清水雅彦表示，对于一个拥有和平宪法的国家来说，此举无论如何都难以接受。日本体育大学宪法学教授 清水雅彦：对于一个拥有和平宪法的国家来说，不是增加教育和社会福利支出，而是大幅增加军费，这是无论如何都难以接受的。日本宪法学者：推动构建情报体系无异于构建战争体制（央视新闻）", "ctime": 1780654039, "time_str": "18:07:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260605/c677255228.shtml"}, {"id": "4470953", "title": "利和兴：拟购买深圳市龙华区观湖街道A912-0637号地块的国有建设用地使用权并投资不超过3亿元", "content": "利和兴公告，公司根据战略发展规划，拟与深圳市欧盛自动化有限公司作为联合竞买申请人联合竞买位于深圳市龙华区观湖街道A912-0637号地块的国有建设用地使用权。公司取得前述国有土地使用权后，拟在该地块上投资建设高端半导体及自动化设备研发生产基地项目，投资项目计划投资总额预计不超过人民币3亿元。", "ctime": 1780653851, "time_str": "18:04:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260605/c677255106.shtml"}, {"id": "4470947", "title": "国际原子能机构：袭击核设施存在风险 应避免核安全危机", "content": "国际原子能机构总干事格罗西5日在国际原子能机构理事会开幕式上表示，针对核设施的军事行动将带来不可接受的风险，任何用于和平目的的核设施都不应成为攻击目标。格罗西透露，5月17日阿联酋巴拉卡核电站遭无人机袭击，导致外部供电设施受损，一度需要启动应急发电机保障3号机组运行。尽管未造成人员伤亡，辐射水平保持正常，但事件已严重损害核安全。格罗西指出，如果运行中的核电站遭直接打击，可能导致大量放射性物质释放，甚至引发堆芯熔毁等严重后果。他同时表示，扎波罗热核电站和伊朗布什尔核电站近期也受到冲突波及。他呼吁各方遵守国际原子能机构关于冲突期间核安全与安保的基本原则，通过对话与外交途径降低风险，避免发生核安全危机。（央视新闻）", "ctime": 1780653824, "time_str": "18:03:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260605/c677255090.shtml"}, {"id": "4470945", "title": "中钨高新：选举沈慧明为董事长，李仲泽辞职", "content": "中钨高新公告，公司董事会近日收到李仲泽先生的书面辞职报告，因工作调动辞去董事长、董事及董事会专门委员会职务，辞职后不再担任公司任何职务。公司于2026年6月5日召开第十一届董事会第十一次（临时）会议，同意选举沈慧明先生为公司董事长，任期自本次董事会审议通过之日起至第十一届董事会任期届满之日止，沈慧明先生同时成为公司法定代表人。", "ctime": 1780653820, "time_str": "18:03:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260605/c677255087.shtml"}, {"id": "4470897", "title": "居然智家：控股股东质押0.52%股份", "content": "居然智家公告，控股股东居然控股于2026年6月4日将其持有的32400000股质押给中信银行股份有限公司北京分行，为融资提供质押担保；质押股数占其持股1.97%、占公司总股本0.52%，质押期限至解除质押登记日。质押后居然控股质押股份增至4.82亿股，占其持股29.26%、占公司总股本7.75%。", "ctime": 1780653612, "time_str": "18:00:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260605/c677254972.shtml"}, {"id": "4470883", "title": "泰嘉股份：控股股东长沙正元拟减持3%", "content": "泰嘉股份公告，控股股东长沙正元计划于2026年6月5日至2026年9月2日减持不超过755.21万股，占3%，其中集中竞价不超251.74万股，占1%，大宗交易不超503.48万股，占2%。2026年6月5日已通过大宗交易减持99.78万股，占0.40%，持股由5134.53万股降至5034.75万股，比例由20.40%降至20.00%，触及5%整数倍。", "ctime": 1780653481, "time_str": "17:58:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260605/c677254884.shtml"}, {"id": "4470879", "title": "香港证监会将上市基金范围扩展至以香港上市个股作为标的之杠杆及反向产品 并加强保障措施", "content": "香港证监会今天发出经修订的通函，旨在扩大上市结构性基金的范围，从而纳入以具高流通量的香港上市超高市值股票作为标的之个股杠杆及反向产品。就所有杠杆及反向产品而言，证监会现时明确规定产品提供者须持续监察其产品的容量，确保能支持产品的目标杠杆或反向敞口，维持合理的缓冲，以及在产品运作可能受到干扰时及时通知香港证监会。就个股杠杆及反向产品而言，香港证监会亦已引入更严格的产品提供者资格准则，并规定产品提供者须制订稳健的业务应急计划，以减低该等产品较高的营运风险。此外，就以香港上市股票作为标的之个股杠杆及反向产品而言，证监会规定，如其相关股票短暂停牌或停牌，该产品须自动暂停买卖。此类复杂产品的其他保障措施将继续适用，包括最大杠杆倍数为2倍至-2倍。（香港证监会）", "ctime": 1780653417, "time_str": "17:56:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260605/c677254851.shtml"}, {"id": "4470877", "title": "伯特利：股东奇瑞科技拟减持3%", "content": "伯特利公告，股东芜湖奇瑞科技有限公司持有公司1.31亿股，占14.56%，因资金需要计划减持不超2692.92万股，不超总股本3%。其中，通过集中竞价方式减持不超897.64万股，将于本减持计划公告之日起15个交易日后的90天内实施，且任意连续90个自然日内减持总数不超公司股份总数1%；通过大宗交易方式减持不超1795.28万股，将于同一期限内实施，且任意连续90个自然日内减持总数不超公司股份总数2%。", "ctime": 1780653347, "time_str": "17:55:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260605/c677254823.shtml"}, {"id": "4470871", "title": "中国信通院牵头立项两项AI宽带网国际标准", "content": "中国信通院近日联合中国联通、中国移动、沃达丰、华为等十余家国内外电信运营商、设备制造商及科研机构，牵头提交的《Service Framework for AI in Broadband》（宽带网络人工智能业务框架）和《Service Requirements for AI Agents in Broadband Networks》（宽带网络智能体业务要求）两项标准提案，在宽带论坛2026年春季会员会议上正式立项。这标志着我国人工智能与宽带网融合领域的国际标准化工作取得重要进展。", "ctime": 1780653296, "time_str": "17:54:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260605/c677254743.shtml"}, {"id": "4470851", "title": "“世界杯”将成为小红书App一级入口", 005.shtml"}];
const SECTORS  = [{"name": "金融", "hit_count": 48, "etfs": []}, {"name": "人工智能", "hit_count": 26, "etfs": []}, {"name": "半导体", "hit_count": 24, "etfs": []}, {"name": "数据要素", "hit_count": 16, "etfs": []}, {"name": "消费", "hit_count": 12, "etfs": []}, {"name": "军工", "hit_count": 11, "etfs": []}, {"name": "机器人", "hit_count": 6, "etfs": []}, {"name": "医药", "hit_count": 5, "etfs": []}];
const META     = {"update_time": "2026-06-05 18:32:19", "sentiment_score": 53.21888412017167, "agents": []};

// 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
