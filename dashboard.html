<style>
:root {

* { margin:0; padding:0; box-sizing:border-box; }
body {

  background: var(--bg-primary);
  color: var(--text-primary);
  min-height: 100vh;
}
.mono { font-family: 'JetBrains Mono', monospace; }
.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 20px;
  transition: all 0.2s;
}
.card:hover { background: var(--bg-card-hover); border-color: #334155; }
.badge {
  display: inline-flex; align-items: center; padding: 2px 8px;
  border-radius: 6px; font-size: 12px; font-weight: 500;
}
.badge-s { background: rgba(239,68,68,0.2); color: #ef4444; }
.badge-a { background: rgba(245,158,11,0.2); color: #f59e0b; }
.badge-b { background: rgba(59,130,246,0.2); color: #3b82f6; }
.badge-c { background: rgba(100,116,139,0.2); color: #94a3b8; }
.score-bar {
  height: 6px; border-radius: 3px; background: #1e293b; overflow: hidden;
}
.score-bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s; }
.up { color: var(--red); }
.down { color: var(--green); }
.pulse { animation: pulse 2s infinite; }
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}
.glow { box-shadow: 0 0 20px rgba(59,130,246,0.15); }
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg-primary); }

</style>

              <th class="text-left py-2 px-1">名称</th>
              <th class="text-right py-2 px-1">现价</th>

              <th class="text-right py-2 px-1">评分</th>
              <th class="py-2 px-1 text-center" style="min-width:160px">评分分布</th>
              <th class="text-right py-2 px-1">板块</th>
              <th class="text-right py-2 px-1">连涨</th>
            </tr>
          </thead>
          <tbody id="picks-table"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- 新闻流 + 交易代理 -->
<div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
  <div class="card">
    <h2 class="text-sm font-medium text-gray-400 mb-4">实时新闻流</h2>

</div>

3315", "title": "午间公告集锦", "content": "德琪医药公告，自优时比(UCB)收到6000万美元ATG-201首付款。收到与优时比(UCB)订立的这项里程碑式协议项下的首付款，进一步巩固了本集团的现金状况，为推进本集团创新药物管线的发展及加快惠及更多患者提供了强有力的财务支持。\n中广核新能源公告，2026年6月公司及其附属公司按合并报表口径完成发电量1331.5吉瓦时，较2025年同比下降5.1%。其中，中国风电项目减少17.1%，中国太阳能项目增加33.5%，中国燃气项目增加6.3%，中国水电项目减少10.5%，韩国项目减少6.5%。2026年1-6月，累计完成发电量9307.3吉瓦时，同比下降2.2%。其中，中国风电项目减少17.9%，中国太阳能项目增加35.3%，中国燃气项目增加3.7%，中国水电项目增加12.3%，韩国项目增加12.8%。", "ctime": 1783915963, "time_str": "12:12:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260713/c678128412.shtml"}, {"id": "4703305", "title": "全国46条河流发生超警以上洪水", "content": "记者从水利部了解到，受降雨影响，昨天到今天，浙江椒江及其支流永安溪、钱塘江支流武义江，福建富屯溪上游，安徽水阳江，江西信江支流白塔河、泸溪水等46条河流发生超警以上洪水，其中浙江椒江、安徽水阳江、黑龙江蚂蚁河分别发生编号洪水，浙江台州永安溪发生小幅超保洪水。（央视新闻）", "ctime": 1783915772, "time_str": "12:09:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260713/c678128355.shtml"}, {"id": "4703303", "title": "路劲基建：重组支持协议的加入率已逾60%", "content": "路劲基建公告，于早鸟重组支持协议费用截止时间届满日期（即二零二六年七月十日），持有现有票据及现有永续证券本金总额逾60%的持有人已加入重组支持协议。", "ctime": 1783915546, "time_str": "12:05:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260713/c678128297.shtml"}, {"id": "4703301", "title": "美的：2万台移动空调紧急追加订单发运法国", "content": "欧洲极端高温天气持续，法国市场空调需求激增。财联社记者获悉，美的近日承接的法国客户2万台移动空调紧急追加订单已悉数发运，该订单首次采用跨境陆运方案，约15天可送达客户仓库，整体交付周期较海运减半。美的集团方面表示，当前国内空调市场处于产销旺季，工厂国内订单排期饱满，通过抽调人力与产能资源协助，得以保障该批法国追加订单的交付。(新浪财经)", "ctime": 1783915539, "time_str": "12:05:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260713/c678128296.shtml"}, {"id": "4703291", "title": "中广核新能源：6月发电量1331.5吉瓦时，同比下降5.1%", "content": "中广核新能源公告，2026年6月公司及其附属公司按合并报表口径完成发电量1331.5吉瓦时，较2025年同比下降5.1%。其中，中国风电项目减少17.1%，中国太阳能项目增加33.5%，中国燃气项目增加6.3%，中国水电项目减少10.5%，韩国项目减少6.5%。2026年1-6月，累计完成发电量9307.3吉瓦时，同比下降2.2%。其中，中国风电项目减少17.9%，中国太阳能项目增加35.3%，中国燃气项目增加3.7%，中国水电项目增加12.3%，韩国项目增加12.8%。", "ctime": 1783915325, "time_str": "12:02:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260713/c678128268.shtml"}, {"id": "4703289", "title": "德琪医药：自愿公告自优时比(UCB)收到6000万美元ATG-201首付款", "content": "德琪医药公告，自优时比(UCB)收到6000万美元ATG-201首付款。收到与优时比(UCB)订立的这项里程碑式协议项下的首付款，进一步巩固了本集团的现金状况，为推进本集团创新药物管线的发展及加快惠及更多患者提供了强有力的财务支持。", "ctime": 1783915315, "time_str": "12:01:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260713/c678128265.shtml"}, {"id": "4703281", "title": "港股午评：恒生指数跌0.11%，恒生科技指数跌0.81%", "content": "港股午间收盘，恒生指数跌0.11%，恒生科技指数跌0.81%。恒指港股通ETF银华（159318）跌0.63%，港股通科技ETF鹏华（159751）跌2.35%。板块方面，酒店和度假村REIT板块涨幅靠前；工业集团企业、汽车板块跌幅靠前。个股方面，真健康医疗-B涨28.81%，维立志博-B涨24.1%，基本半导体涨10.86%，威华达控股涨5.47%，芯碁微装涨5.26%；海螺创业跌19.12%，建滔集团跌16.73%，建滔积层板跌15.13%，长飞光纤光缆跌14.89%，MINIMAX-W跌14.22%。", "ctime": 1783915277, "time_str": "12:01:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260713/c678128260.shtml"}, {"id": "4703269", "title": "国家工业信息安全发展研究中心开始征集大模型安全测评基准共建单位", "content": "国家工业信息安全发展研究中心正在建设大模型安全测评基准，围绕大模型真实应用中的安全治理需求构建全景评估框架，覆盖内容安全、价值对齐、鲁棒稳健、公平无偏、隐私保护、真实可信六大核心安全维度，形成系统化的全链路评测体系。现开始征集大模型安全测评基准共建单位，打造覆盖全维度、系统化的人工智能安全评测体系。（人民财讯）", "ctime": 1783915191, "time_str": "11:59:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260713/c678128197.shtml"}, {"id": "4703257", "title": "日经225指数跌幅扩大至2%", "content": "日经225指数跌幅扩大至2%，现报67188.59点。", "ctime": 1783914785, "time_str": "11:53:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260713/c678128135.shtml"}, {"id": "4703245", "title": "伊朗军方谴责美国屡次“非法袭击”", "content": "当地时间7月13日，伊朗陆军公共关系部发表声明，表示针对美国屡次非法袭击伊朗的行为，数小时前，伊朗陆军再次发动无人机袭击，目标是驻科威特的美军基地、防御和导弹系统、掩体以及美国军队的支援设施。伊朗陆军谴责美国屡次袭击部分军事中心、民用基础设施和民众，并严重违反《联合国宪章》基本原则。伊朗陆军强调将以坚定决心和意志，动用一切力量，毫不犹豫地捍卫伊朗的主权、领土完整和独立，抵御任何敌人的侵略。（央视新闻）", "ctime": 1783914499, "time_str": "11:48:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260713/c678128068.shtml"}, {"id": "4703223", "title": "陈龙强离任百信银行首席数字官，出任京东科技副总裁", "content": "记者获悉，原百信银行首席数字官陈龙强已正式离职，现出任京东科技副总裁，主要负责不良资产收购及数字化运营体系的搭建。陈龙强此番回归京东科技，正值京东在金融牌照布局上取得重大突破之际。2026年4月，京东科技完成地方AMC（资产管理公司）的收购，通过全资子公司网银在线（北京）商务服务有限公司控股中信青岛资产管理有限公司，认缴出资20亿元，持股比例66.67%，正式拿下稀缺不良资产处置资质。这也是京东继2024年收购捷信消费金融、拿下消费金融牌照后，在持牌金融领域的又一重要布局。（21世纪经济报道）", "ctime": 1783914380, "time_str": "11:46:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260713/c678128058.shtml"}, {"id": "4703217", "title": "泰国曼谷酒吧火灾原因初步推断为空调设备电路短路", "content": "泰国曼谷市防灾减灾办公室当地时间13日通报称，根据对曼谷酒吧火灾的初步调查，起火原因推断为天花板上的空调设备发生电路短路。此次火灾过火面积约164平方米，相关部门正进一步调查事故具体原因。当地时间12日23时57分许，泰国曼谷乍都乍区拉抛路附近一家酒吧发生火灾。泰国曼谷市市长差察·西迪汶13日通报说，酒吧火灾已确认造成27人遇难、63人受伤，其中22人伤势危重。（央视新闻）", "ctime": 1783914235, "time_str": "11:43:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260713/c678128023.shtml"}, {"id": "4703209", "title": "中国诚通在南京成立新科创公司", "content": "天眼查App显示，近日，诚通科创（江苏）有限公司成立，法定代表人为王静波，注册资本2000万人民币，经营范围包括创业空间服务、企业管理咨询、软件开发等，由诚通科创私募基金管理（北京）有限公司全资持股。（南方财经）", "ctime": 1783914140, "time_str": "11:42:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260713/c678128001.shtml"}, {"id": "4703197", "title": "亿帆医药首个HMOs系列合成生物技术产品2'-FL取得食品生产许可证", "content": "近日，亿帆医药全资子公司杭州鑫富科技有限公司（简称“杭州鑫富”）合成生物技术产品母乳低聚糖（HMOs）系列——2'-岩藻糖基乳糖（2'-FL）正式取得杭州市市场监督管理局颁发的食品生产许可证，标志着杭州鑫富的生产环境、生产设备、质量管理、产品检验等各项条件，均已符合食品法规要求。(人民财讯)", "ctime": 1783913958, "time_str": "11:39:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260713/c678127972.shtml"}, {"id": "4703189", "title": "国新办就2026年上半年国民经济运行情况举行新闻发布会", "content": "国务院新闻办公室定于2026年7月15日（星期三）上午10时举行新闻发布会，请国家统计局副局长毛盛勇介绍2026年上半年国民经济运行情况，并答记者问。(中国网)", "ctime": 1783913811, "time_str": "11:36:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260713/c678127931.shtml"}, {"id": "4703171", "title": "ETF两市成交额报3805.23亿元，较昨日此时放量855.13亿元", "content": "截至目前，ETF两市成交额报3805.23亿元，较昨日此时放量855.13亿元，分类型来看，股票型ETF成交额1337.01亿元，债券型ETF成交额1670.78亿元，货币型ETF成交额91.32亿元，商品型ETF成交额32.74亿元，QDII型ETF成交额673.38亿元。", "ctime": 1783913505, "time_str": "11:31:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260713/c678127783.shtml"}, {"id": "4703169", "title": "ETF午评：标普油气ETF领涨4.05%，通用航空ETF领跌7.22%", "content": "ETF午间收盘涨跌不一，标普油气ETF（513350）领涨4.05%，中药ETF（562390）涨3.64%，中药ETF（561510）涨3.51%，通用航空ETF（159283）领跌7.22%，航空ETF（159257）跌7.05%，卫星ETF（159206）跌6.74%。", "ctime": 1783913478, "time_str": "11:31:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260713/c678127773.shtml"}, {"id": "4703165", "title": "A股午评：沪指低开低走跌1.54%，军工电子、培育钻石、商业航天板块跌幅居前", "content": "A股三大指数早盘集体下跌，截至午盘，上证指数跌1.54%，深证成指跌2.61%，创业板指跌2.38%，北证50跌3.9%，科创50指数跌1.84%。全市场成交额18642亿元，较上日缩量3180亿元，全市场超4500只个股下跌。板块题材上，中药、银行、燃气、医药电商、芬太尼板块涨幅居前；军工电子、中船系、培育钻石、影视院线、商业航天板块跌幅居前。盘面上，中药板块低开高走，陇神戎发、天目药业涨停，上海凯宝、生物谷、九芝堂涨幅居前。银行板块震荡走高，苏州银行盘中涨超6%，宁波银行、厦门银行、建设银行纷纷上扬。燃气板块亦有所表现，水发燃气、九丰能源一字涨停，天壕能源、新奥股份、深圳燃气涨幅居前。培育钻石板块持续下挫，黄河旋风、博云新材跌停，惠丰钻石、四方达、沃尔德跌幅居前。商业航天板块深度调整，航天发展、上海港湾、西部材料、上海沪工、神剑股份、通宇通讯等十余股跌停，信维通信、电科蓝天、盟升电子跌幅居前。PCB概念板块亦表现疲软，大族激光、金安国纪、安泰科技等多股跌停，回天新材、金禄电子跌幅居前。", "ctime": 1783913460, "time_str": "11:31:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260713/c678127769.shtml"}, {"id": "4703155", "title": "股指期货早盘收盘 主力合约全线下跌", "content": "股指期货早盘收盘，主力合约全线下跌。沪深300股指期货(IF)主力合约跌1.65%，上证50股指期货(IH)主力合约跌1.68%，中证500股指期货(IC)主力合约跌3.63%，中证1000股指期货(IM)主力合约跌3.73%。", "ctime": 1783913418, "time_str": "11:30:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260713/c678127755.shtml"}, {"id": "4703143", "title": "多家券商正按监管要求，稳步出清经纪人，一年半减员近1.2万", "content": "记者从行业了解到，对于经纪人清退，行业执行力度有所差别。有地方局强调规范清退流程，但无统一时间表，后续监管层会对清退过程规范性进行核查。值得关注的是，监管层早在2023年已向行业传达，应顺应财富管理转型方向，逐步压降并出清经纪人存量。数据层面的变化已经非常明显。2025年以来，券商行业证券经纪人已减少近1.2万人。公开数据显示，截至2025年末，全行业证券经纪人为2.24万人；到2026年上半年末降至约1.75万人，仅上半年就减少约5674人，降幅超过两成。（财联社）", "ctime": 1783913086, "time_str": "11:24:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260713/c678127654.shtml"}, {"id": "4703141", "title": "巴林再次拉响防空警报", "content": "巴林内政部13日在社交媒体上说，巴林再次拉响防空警报。这是该国当天第二次拉响防空警报。当天早些时候，伊朗对位于巴林的美军设施实施了报复性打击。(新华社)", "ctime": 1783913057, "time_str": "11:24:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260713/c678127648.shtml"}, {"id": "4703137", "title": "今年第11号台风“海神”生成", "content": "据中央气象台消息，今年第11号台风“海神”（热带风暴级；英文名称：Haishen；名字来源：中国；名称意义：神话中的大海之神）已于今天（13日）上午在西北太平洋洋面上生成，上午8时其中心位于美国关岛西偏南方向约930公里的洋面上，即北纬10.6度、东经136.7度，中心附近最大风力有8级（18米/秒），中心最低气压为998百帕，七级风圈半径为150-180公里。预计，“海神”将以每小时5—10公里的速度向西北转偏北方向移动，强度变化不大。未来“海神”对我国海域无影响。（央视新闻）", "ctime": 1783912913, "time_str": "11:21:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260713/c678127610.shtml"}, {"id": "4703131", "title": "知名经济学家王连洲去世", "content": "知名经济学家王连洲先生于7月12日因病离世，享年87岁。王连洲家人于7月13日发布讣告，将于7月16日举行遗体告别仪式。资料显示，王连洲曾担任我国信托法、证券法和基金法三部重要的行业金融法律法规的起草工作小组组长。在中国资本市场建立初期，王连洲积极推动资本市场的立法建制，其在推动资本市场的健康发展过程中曾起到重要作用，也因此被业内誉为“基金业之父”，备受尊重。(上海证券报)", "ctime": 1783912895, "time_str": "11:21:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260713/c678127607.shtml"}, {"id": "4703127", "title": "伊朗强烈谴责美国“侵略性”袭击", "content": "伊朗外交部13日凌晨发表声明，强烈谴责过去24小时内美国对伊朗发动的“侵略性”袭击。 声明说，这些野蛮的袭击违反《联合国宪章》有关条款，严重威胁国际和平与安全，使过去几个月为缓和地区紧张局势、建立和平所做的一切努力付诸东流。 声明说，伊美签署谅解备忘录仅过去25天，美国就公然违反该备忘录几乎所有内容。美国袭击伊朗交通基础设施、船只、气象设施等，犯下战争罪行。美国公然干涉伊朗在霍尔木兹海峡实施必要管理安排的进程，导致海峡安全局势再次恶化，并干扰了国际商业航运。 伊朗强调将坚定捍卫主权和领土完整，抵御美国及任何其他侵略者的军事侵略。同时，伊朗对任何参与或配合侵略方行动的行为发出警告：任何针对伊朗发动袭击的源头，都将成为伊朗武装力量实施防御性打击的合法目标。(新华社)", "ctime": 1783912830, "time_str": "11:20:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260713/c678127586.shtml"}, {"id": "4703113", "title": "韩国综指跌幅扩大至7%", "content": "韩国综指跌幅扩大至7%，现报6952.65点。个股方面，SK海力士跌超12%，三星电子跌超7%。", "ctime": 1783912664, "time_str": "11:17:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260713/c678127556.shtml"}, {"id": "4703111", "title": "韩国连锁超市品牌Homeplus今起暂停大型超市营业", "content": "据报道，韩国大型连锁超市品牌Homeplus于7月13日起暂停旗下大型超市营业。Homeplus方面当天发布新闻稿称，公司运营资金枯竭，已经到了货款及超市门店水电费都无法承担的地步，故决定暂停营业。除超市外，其他入驻商店可按照业主意愿继续营业。（界面新闻）", "ctime": 1783912608, "time_str": "11:16:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260713/c678127534.shtml"}, {"id": "4703091", "title": "现货白银失守58美元/盎司", "content": "现货白银失守58美元/盎司，日内跌3.09%。", "ctime": 1783912368, "time_str": "11:12:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260713/c678127464.shtml"}, {"id": "4703085", "title": "SK海力士下跌超12%", "content": "SK海力士下跌超12%。", "ctime": 1783912235, "time_str": "11:10:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260713/c678127364.shtml"}, {"id": "4703077", "title": "菲律宾4月吸收外国直接投资大幅下降", "content": "菲律宾央行日前公布的最新数据显示，2026年4月菲律宾吸收外国直接投资净额为2.5亿美元，创下自2016年6月以来最低月度水平。菲律宾媒体12日援引菲央行数据报道，4月菲律宾外国直接投资净额较2025年同期下降58.8%。今年前4个月，菲律宾吸收外国直接投资净额约为20亿美元，同比下降26.5%。菲律宾联合银行首席经济学家鲁本·阿松森表示，最新数据反映在全球经济不确定性背景下，外国投资者对投资菲律宾采取了更加谨慎的立场。全球投资环境仍受地缘政治紧张局势和市场波动加剧的挑战，这些因素导致投资者推迟对菲律宾的长期投资决策。近期，国际货币基金组织和亚洲开发银行分别下调未来两年菲律宾经济增长预期，原因是2026年第一季度菲律宾经济表现不佳，以及中东冲突对菲律宾通胀和经济活动的影响超出预期。（新华社）", "ctime": 1783912176, "time_str": "11:09:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260713/c678127355.shtml"}, {"id": "4703075", "title": "现货黄金失守4060美元/盎司", "content": "现货黄金失守4060美元/盎司，日内跌1.47%。", "ctime": 1783912033, "time_str": "11:07:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260713/c678127307.shtml"}, {"id": "4703069", "title": "伊朗称彻底摧毁科威特美军基地多处军事设施", "content": "总台记者获悉，当地时间7月13日，伊朗伊斯兰革命卫队发布公告，称在报复行动的第三阶段，彻底摧毁了位于科威特的阿里·萨利姆美军基地的燃料罐和“爱国者”防空导弹系统，以及位于艾哈迈德·贾比尔空军基地的FPS战略雷达系统。伊朗伊斯兰革命卫队表示，反击行动仍在继续。(央视新闻)", "ctime": 1783911963, "time_str": "11:06:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260713/c678127219.shtml"}, {"id": "4703067", "title": "北证50指数跌幅扩大至4%", "content": "北证50指数跌幅扩大至4%，现报1160.662点。", "ctime": 1783911948, "time_str": "11:05:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260713/c678127216.shtml"}, {"id": "4703065", "title": "培育钻石板块持续下挫，黄河旋风触及跌停", "content": "培育钻石板块持续下挫，黄河旋风触及跌停，惠丰钻石跌超11%，博云新材、四方达、沃尔德、力量钻石跟跌。", "ctime": 1783911943, "time_str": "11:05:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260713/c678127213.sh const META     = {"update_time": "2026-07-13 12:53:48", "sentiment_score": 49.271844660194176, "agents": []};

// 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
