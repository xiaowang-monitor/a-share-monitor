.down { color: var(--green); }

10jqka.com.cn/20260729/c678512626.shtml"}, {"id": "4830481", "title": "感染致死率上升 智利发布汉坦病毒公共卫生警报", "content": "智利卫生部28日发布公报说，由于智利今年以来汉坦病毒感染致死率有所上升，政府决定针对该病毒发布公共卫生警报。警报覆盖智利16个大区中的13个，将持续至2027年7月31日。 据公报介绍，汉坦病毒在智利呈地方性流行，通常由啮齿动物传播，卫生部一直在监测其动态。截至上周，智利今年以来共记录到46例汉坦病毒感染病例，其中18例死亡，感染致死率高达39%；而2025年这一比例为18%。 公报说，此次警报属于预防性措施，可在出现严重健康风险的紧急情况时赋予相关部门特殊权力，以加强监测、及时调配资源、聘用专业人员、开展卫生防控行动，并通过直接采购方式快速获取物资。公报同时强调，该警报并不意味着疫情暴发或医疗系统已不堪重负。 智利卫生部专家呼吁民众保持警惕，包括避免接触啮齿动物、注意房屋通风、妥善存放食物等，一旦出现发热、剧烈肌肉疼痛、呼吸困难等症状且曾到过鼠类常出没地区，应立即前往医疗机构，并主动报告相关情况。(新华社)", "ctime": 1785296750, "time_str": "11:45:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260729/c678512448.shtml"}, {"id": "4830477", "title": "OceanBase启动首次外部融资 拟募资20-30亿元", "content": "蚂蚁集团旗下独立运营的OceanBase正在与投资者洽谈A轮融资，目标融资规模约20亿至30亿元人民币。本轮融资将支持OceanBase增强独立运营能力，并加大对AI数据平台领域和海外市场的投入。据悉，OceanBase 2026年年化收入超过14亿元，同比增长约70%。（科创板日报）", "ctime": 1785296595, "time_str": "11:43:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260729/c678512376.shtml"}, {"id": "4830475", "title": "2026 IPC CEMAC电子制造年会将于9月在沪举办", "content": "记者获悉，2026 IPC CEMAC电子制造年会将于9月17-18日在上海举办。大会将聚焦先进电子封装互连与系统集成、数字化与智能制造、电子装联与高可靠制造等核心方向。期间将发布IPC-6931光模块印制板验收规范等多项行业新标，公布玻璃基板技术白皮书编制，并演示智能制造示范产线等。（界面新闻）", "ctime": 1785296459, "time_str": "11:40:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260729/c678512336.shtml"}, {"id": "4830471", "title": "知情人士：市场监管总局将开展光伏行业价格合规指导活动", "content": "记者从业内人士处获悉，国家市场监督管理总局价格监督检查和反不正当竞争局定于7月31日开展光伏行业价格合规指导活动，邀请参会单位包括中国光伏行业协会和相关光伏行业企业。据悉，此次会议为指导光伏行业加强成本核算，落实《光伏行业成本核算模型通则》，遏制非理性竞争。（财联社）", "ctime": 1785296260, "time_str": "11:37:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260729/c678512187.shtml"}, {"id": "4830465", "title": "韩国KOSPI指数跌超8%触发熔断机制", "content": "韩国KOSPI指数跌超8%触发熔断机制，交易暂停20分钟。这是韩国股市今年以来第九次触发熔断机制。", "ctime": 1785296175, "time_str": "11:36:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260729/c678512093.shtml"}, {"id": "4830463", "title": "上海中心城区全面推进收购二手房用作保租房，三个试点区已收购551套", "content": "上海中心城区收购二手住房工作全面加快推进。2026年7月26日，记者从上海市房管局获悉，自今年2月启动收购二手住房用于保障性租赁住房（以下简称“保租房”）试点以来，徐汇、浦东和静安三区积极探索，截至7月25日，三个试点区共收购二手住房551套，其中16户居民已完成置换购置新房。黄浦、长宁、虹口、普陀、杨浦五个区随后于5月扩围实施，积极服务居民置换安居，促进存量住房资产有效流动，加快中心城区保租房筹措供应。（澎湃新闻）", "ctime": 1785296096, "time_str": "11:34:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260729/c678512046.shtml"}, {"id": "4830459", "title": "日经225指数跌幅扩大至2%", "content": "日经225指数跌幅扩大至2%，现报61081.12点。", "ctime": 1785296042, "time_str": "11:34:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260729/c678512024.shtml"}, {"id": "4830453", "title": "ETF两市成交额报3104.06亿元，较昨日此时放量108.24亿元", "content": "截至目前，ETF两市成交额报3104.06亿元，较昨日此时放量108.24亿元，分类型来看，股票型ETF成交额1311.95亿元，债券型ETF成交额1086.66亿元，货币型ETF成交额161.91亿元，商品型ETF成交额28.41亿元，QDII型ETF成交额514.96亿元。", "ctime": 1785295979, "time_str": "11:32:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260729/c678511986.shtml"}, {"id": "4830449", "title": "A股午评：创业板指低位震荡跌0.47% 消费板块大幅走强", "content": "截至午盘，上证指数跌0.53%，深证成指跌0.43%，创业板指跌0.47%，北证50涨0.41%。三市成交额14896亿元，较上日放量1530亿元。全市场超3400家个股上涨。\n板块题材上，乳业、教育、零售板块涨幅居前；光刻机、存储芯片、元件概念板块跌幅居前。\n盘面上，乳业板块再度走高，一鸣食品2连板，良品铺子、南侨食品、欢乐家、阳光乳业、李子园、天润乳业、均瑶健康涨停，骑士乳业涨超15%，品渥食品涨超10%，熊猫乳品、三元股份、洽洽食品、西部牧业、妙可蓝多跟涨。教育板块持续走高，传智教育3连板，中公教育、全通教育涨停，华图山鼎涨超10%，科德教育、凯文教育、昂立教育、博通股份、学大教育跟涨。零售板块表现强势，东百集团2连板，国芳集团、国光连锁涨停，博士眼镜、小商品城、万辰集团、中国中免、孩子王跟涨。光刻机板块低开低走，茂莱光学跌超15%，芯碁微装、波长光电、蓝英装备、新莱应材、华辰装备跌超10%，永新光学、华特气体、炬光科技、同飞股份、华亚智能跟跌。存储芯片持续走弱，雅克科技、兆易创新、通富微电、至纯科技、彤程新材触及跌停，微导纳米跌超15%，精智达、精测电子、艾森股份、兴福电子、汇成股份、广钢气体、西安奕材、有研硅、科翔股份跌超10%，太极实业、有研新材、华特气体、先导基电、炬光科技跟跌。元件板块震荡走弱，科翔股份跌超10%，中富电路、华正新材、景旺电子跟跌。", "ctime": 1785295923, "time_str": "11:32:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260729/c678511966.shtml"}, {"id": "4830445", "title": "ETF午评：港股通汽车ETF领涨6.57%，半导体设备ETF领跌7.62%", "content": "ETF午间收盘涨跌不一，港股通汽车ETF（159121）领涨6.57%，港股通汽车ETF（159239）涨6.24%，港股通汽车ETF（520680）涨6.14%，半导体设备ETF（560780）领跌7.62%，半导体设备ETF（562590）跌7.56%，半导体设备ETF（159558）跌7.53%。", "ctime": 1785295853, "time_str": "11:30:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260729/c678511917.shtml"}, {"id": "4830443", "title": "股指期货早盘收盘 主力合约多数下跌", "content": "股指期货早盘收盘，主力合约多数下跌。沪深300股指期货(IF)主力合约涨0.14%，上证50股指期货(IH)主力合约跌0.20%，中证500股指期货(IC)主力合约跌0.15%，中证1000股指期货(IM)主力合约跌0.66%。", "ctime": 1785295848, "time_str": "11:30:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260729/c678511916.shtml"}, {"id": "4830433", "title": "韩国交易所对KOSDAQ指数启动熔断机制，交易暂停20分钟", "content": "韩国交易所对KOSDAQ指数启动熔断机制，交易暂停20分钟。", "ctime": 1785295261, "time_str": "11:21:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260729/c678511544.shtml"}, {"id": "4830421", "title": "雷军回应小米为何要做增程车：增程市场远未饱和，大有可为", "content": "7月29日，小米创办人、董事长兼CEO雷军微博发文解释小米澎程为什么要做增程。“增程还是纯电，没有技术路线的绝对优劣，只有产品体验的高下之分。”雷军表示，增程市场远未饱和，反而大有可为，“小米澎程的增程，解决了非常多槽点，和早期增程已经不可同日而语”。", "ctime": 1785295050, "time_str": "11:17:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260729/c678511403.shtml"}, {"id": "4830413", "title": "伊朗称在霍尔木兹海峡拦截3艘“违规”油轮", "content": "伊朗伊斯兰革命卫队29日发布多份公告说，伊朗伊斯兰革命卫队海军继续“全面掌控霍尔木兹海峡”，几小时前打击并拦截了3艘“违规”油轮。公告说，这些油轮“无视其警  "韩国综指跌幅扩大至8%，现报5539.64点。个股方面，SK海力士跌超12%，三星电子跌超7%。", "ctime": 1785294259, "time_str": "11:04:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260729/c678510923.shtml"}, {"id": "4830379", "title": "希捷CEO：公司客户并未缩减长期规划周期", "content": "当地时间7月28日，硬盘制造商希捷科技董事长兼首席执行官戴夫·莫斯利（Dave Mosley）在财报会上透露：“公司客户并未缩减长期规划周期，多家厂商主动提出将规划周期延长至2029年及以后，足以证明客户对自身长期基础设施投入的信心。”", "ctime": 1785294223, "time_str": "11:03:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260729/c678510901.shtml"}, {"id": "4830373", "title": "国家知识产权局：目前83家国家级知识产权保护中心在建", "content": "今天（29日），国家知识产权局在国务院新闻办公室举行的发布会上介绍，积极推进知识产权快速协同保护工作。目前，已经在全国布局建设83家国家级知识产权保护中心和54家快速维权中心，形成了布局均衡、分层分类、导向鲜明的快速协同保护网络，为地方优势产业创新主体提供快速预审、快速确权、快速维权等“一站式”知识产权保护综合服务。国家知识产权局表示，“十五五”时期，将进一步高质量建设国家级知识产权保护中心和快维中心，推动工作机制更加协调完善，预审授权更加优质精准，维权援助更加及时规范，协同保护更加顺畅高效，深度融入国家重大战略实施，更加有力服务重点产业创新升级，支撑经济社会高质量发展。（央视新闻）", "ctime": 1785294122, "time_str": "11:02:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260729/c678510845.shtml"}, {"id": "4830371", "title": "国家知识产权局：我国商标领域立法从“局部修改”向“系统完善”转变升级", "content": "今天（29日）上午，国务院新闻办公室举行“开局起步‘十五五’”系列主题新闻发布会，国家知识产权局介绍，今年6月26日，十四届全国人大常委会第二十三次会议审议通过新修订的商标法，这是商标法自1983年施行以来的首次全面修订，体现了我国商标领域立法从“局部修改”向“系统完善”的转变升级。本次修改亮点：一是突出诚实守信。明确强调申请注册和使用商标，应当遵循诚信原则，不得滥用权利损害国家利益、社会公共利益或者他人的合法权益。二是完善商标注册条件。进一步拓宽商标可注册要素类别，规定动态标志及其与相关要素的组合，例如手机开机动画可以作为商标申请注册，回应新技术、新业态企业需求。三是健全驰名商标制度。一方面，将商标驰名情况作出“认定”的表述修改为“确认”，遏制过度追求驰名认定的现象。另一方面，不再以注册与否区分驰名商标能否跨类保护，更好对接高标准国际经贸规则。四是加大商标管理力度。完善闲置商标退出机制，推动解决商标“注而不用”问题。严厉打击以误导公众的方式使用注册商标的行为。五是从严监管商标代理。明确了从业准则、受托事项、备案义务等，细化了违法情形及处罚标准，进一步加强行业自律，促进商标代理行业健康发展。六是明确部门职责。进一步明确商标注册、管理、执法等部门的职责，完善商标案件行刑衔接机制和跨部门协作机制。修改后的商标法将于明年1月1日正式施行。（央视新闻）", "ctime": 1785294113, "time_str": "11:01:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260729/c678510839.shtml"}, {"id": "4830345", "title": "韩国综指跌幅扩大至7%", "content": "韩国综指跌幅扩大至7%，现报5599.13点。个股方面，SK海力士跌超10%，三星电子跌超6%。", "ctime": 1785293642, "time_str": "10:54:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260729/c678510631.shtml"}, {"id": "4830341", "title": "游戏板块持续回暖 巨人网络逼近涨停", "content": "游戏板块盘中持续回暖，巨人网络逼近涨停，恺英网络、吉比特、世纪华通、姚记科技、三七互娱、完美世界等涨幅靠前。", "ctime": 1785293631, "time_str": "10:53:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260729/c678510622.shtml"}, {"id": "4830337", "title": "光大期货：关注美联储议息会议，短线黄金轻仓观察", "content": "隔夜伦敦现货贵金属震荡走弱，未能守住4100美元/盎司关口，跌幅1.17%，SHFE黄金盘中震荡，收跌0.73%。关注周四凌晨美联储议息会议，预计利率水平大概率维持 3.5%-3.75% 不变，核心看点为沃什讲话、官员投票分歧、9 月加息指引，短期黄金以震荡思路对待。\n地缘政治方面，美以领导人会晤，聚焦伊朗核问题，以方称美方并未向以方施压，也未要求以方放弃在黎巴嫩或加沙地带所取得的军事成果。随着美以会晤市场预期美伊再次达成停火协议的概率回升。但油价回落，及美元走弱，并未带动金价走高，这可能与美联储议息会议临近以及美股出现大幅回落有关。短期来看，仍以防御应对高波动环境为主，静待FOMC落地，行情不明朗下轻仓观察为主。银铂钯依然跟随金价涨跌，受地缘影响波动较大。（光大期货）", "ctime": 1785293555, "time_str": "10:52:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260729/c678510593.shtml"}, {"id": "4830327", "title": "美国7月消费者信心指数下滑", "content": "当地时间28日，美国研究机构世界大型企业联合会发布的数据显示，美国7月消费者信心指数较上月有所下降。美国研究机构世界大型企业联合会28日发布的初步调查结果显示，美国7月消费者信心指数为90.8，低于6月的92.2。调查显示，7月美国消费者对当前商业和就业市场条件的评估指数下降3.6，至114.9。反映短期收入前景、商业和就业市场环境的消费者预期指数则维持在74.7不变。（央视新闻）", "ctime": 1785293453, "time_str": "10:50:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260729/c678510546.shtml"}, {"id": "4830325", "title": "国台办：对迫害陆配者将依法终身追责、决不宽贷", "content": "7月29日，国务院台办举行例行新闻发布会。有记者问，台媒报道，“台湾新住民关怀总会”理事长、陆配周满芝被控涉所谓“接受大陆指示与资助在台发展组织”，一审被认定罪证不足、判决无罪后，又被二审判决徒刑8年，其上诉被驳回。陆委会称将注销其台湾身份。请问对此有何评论？ 发言人陈斌华答问表示，大陆配偶是台湾同胞的家人、亲人，是台湾社会的建设者、贡献者，但是多年来在台湾始终未获得公平、公正的待遇。近年来，民进党当局更是违背人伦、丧尽天良，对大陆配偶极尽打压迫害之能事，有的被驱离台湾，有的被取消公职，受害最严重的获罪入刑。周满芝一案就是民进党当局对陆配进行司法迫害、搞“绿色恐怖”的典型罪证，证明在“绿色威权”之下，确实是“欲加之罪，何患无辞”。他表示，我们坚决反对民进党当局无端迫害大陆配偶，坚定支持两岸婚姻家庭团结起来捍卫自身合法正当权益，希望台湾同胞看清民进党当局的丑恶嘴脸，给陆配群体以支持和关爱。我也要再次强调，对充当“台独”打手、帮凶迫害陆配者，我们将依法终身追责，决不宽贷。（央视新闻）", "ctime": 1785293424, "time_str": "10:50:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260729/c678510539.shtml"}, {"id": "4830323", "title": "OpenAI发布开源版Codex Security CLI", "content": "OpenAI当地时间7月28日在社交媒体平台X发文称，已发布开源版Codex Security CLI。用户现可利用该工具扫描代码仓库、跨多次运行追踪发现的问题、验证修复结果，并将安全检查纳入持续集成和持续交付（CI/CD）流程。OpenAI表示，该产品目前仍处于早期发布阶段，未来将根据用户反馈持续改进。（科创板日报）", "ctime": 1785293342, "time_str": "10:49:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260729/c678510507.shtml"}, {"id": "4830313", "title": "华为将发布798g笔记本电脑", "content": "7月29日，华为终端官宣将于8月5日发布华为MateBook Pro S，该机仅重798g。（每日经济新闻）", "ctime": 1785293316, "time_str": "10:48:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260729/c678510471.shtml"}, {"id": "4830293", "title": "国台办：大陆在台东部海域渔业资源调查完全正当合法", "content": "7月29日，国务院台办举行例行新闻发布会。有记者问，近期，大陆“蓝海201”科研船在台湾岛东部海域进行渔业资源调查，民进党当局称，“对岸动作是为宣称对该海域有管辖权，恶意进行政治操作及认知作战”，这类状况愈来愈多，海巡和台军面临很大挑战，希望支持相关预算。发言人陈斌华答问表示，7月17日到23日，中国水产科学研究院的科学调查船在台湾岛以东海域开展渔业资源调查，是为全面了解中国管辖海域渔业资源状况，为在该海域开展海洋渔业资源的养护、促进海洋渔业可持续发展提供科学依据，完全正当合法，也是利在两岸的正常科学调查工作。民进党当局没有理由对此说三道四。至于借机鼓噪“增加海上力量预算”，更是别有用心的政治操弄，企图挑动两岸对立对抗。（央视新闻）", "ctime": 1785292917, "time_str": "10:41:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260729/c678510259.shtml"}, {"id": "4830289", "title": "COMEX白银期货涨超1%", "content": "COMEX白银期货涨超1%，现报58.17美元/盎司。", "ctime": 1785292869, "time_str": "10:41:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share":   const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
