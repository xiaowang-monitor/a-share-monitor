国银行公告，公司于2026年7月20日在全国银行间债券市场发行减记型无固定期限资本债券，并于2026年7月22日发行完毕。本期债券发行规模为300亿元人民币，前5年票面利率为1.91%，每5年调整一次，在第5年及之后的每个付息日附发行人赎回权。本期债券募集的资金将依据适用法律和监管部门的批准，补充公司的其他一级资本。", "ctime": 1784711885, "time_str": "17:18:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260722/c678355996.shtml"}, {"id": "4778043", "title": "大秦铁路：董事长陆勇提议以4亿元-5亿元回购公司股份", "content": "大秦铁路公告，董事长陆勇提议以4亿元-5亿元回购公司股份，回购价格上限不高于公司董事会审议通过回购股份方案决议前30个交易日公司股票交易均价的 150%。", "ctime": 1784711880, "time_str": "17:18:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260722/c678355991.shtml"}, {"id": "4778041", "title": "北矿科技：2026年半年度净利润6798.85万元，同比增长25.18%", "content": "北矿科技发布业绩快报，2026年上半年，公司实现营业总收入6.57亿元，同比增长19.00%；净利润6798.85万元，同比增长25.18%。2026年上半年，公司经营态势平稳向好。报告期内，公司实现营业总收入6.57亿元，同比增长19.00%，实现利润总额7918.79万元，同比增长23.71%；归属于上市公司股东的净利润6798.85万元，较上年同期增长25.18%；归属于上市公司股东的扣除非经常性损益的净利润6345.89万元，较上年同期增长41.57%，主要是公司充分把握矿产资源高效开发利用和矿冶装备智能化、绿色化升级的市场机遇，持续开发新技术新产品，矿冶装备和磁性材料产品结构不断优化，公司主营业务盈利能力增强。", "ctime": 1784711875, "time_str": "17:17:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260722/c678355990.shtml"}, {"id": "4778039", "title": "津膜科技：股东华益公司已减持2.82%", "content": "津膜科技公告，持股5%以上股东华益公司减持计划期限届满。减持计划期间内，华益公司通过集中竞价方式减持公司股份247.11万股，通过大宗交易方式减持公司股份604.1万股，共减持公司股份851.21万股，占公司总股本2.82%。本次减持后，华益公司合计持有股份2234.03万股，占总股本比例7.40%。", "ctime": 1784711869, "time_str": "17:17:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260722/c678355987.shtml"}, {"id": "4778037", "title": "中润光学：预计2026年上半年净利润同比增长45.88%到70.20%", "content": "中润光学公告，预计2026年上半年净利润为3000万元到3500万元，与上年同期相比，将增加943.54万元到1443.54万元，同比增加45.88%到70.20%。报告期内，公司原有光学镜头业务保持快速增长，其中高清拍摄及显示、智能移动机器感知、视频通讯及交互等业务板块增长较快。湖南戴斯光电有限公司上年同期尚未纳入公司合并报表范围，本报告期合并其经营业绩，使得先进制造及检测领域收入规模同比增加；同时，受该领域下游行业需求增长带动，相关精密光学元件订单及销售规模进一步扩大，提升了该业务板块的收入及业绩贡献。", "ctime": 1784711864, "time_str": "17:17:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260722/c678355985.shtml"}, {"id": "4778029", "title": "撤换防长引抗议 泽连斯基又撤乌军总司令", "content": "乌克兰总统泽连斯基21日晚在社交媒体上宣布，决定解除亚历山大·瑟尔斯基的乌武装部队总司令职务，由米哈伊尔·德拉帕特接任。泽连斯基上周解职与瑟尔斯基不睦的国防部长米哈伊洛·费多罗夫，引发乌民众持续抗议。英国《金融时报》将这一人事任免称作乌军事领导层自2024年以来的最大改组。按美国《华尔街日报》说法，这可能成为乌克兰危机全面升级4年多来的一个关键时刻。（新华社）", "ctime": 1784711735, "time_str": "17:15:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260722/c678355922.shtml"}, {"id": "4778027", "title": "德国防长支持车企造武器 “转向”前景受质疑", "content": "德国国防部长鲍里斯·皮斯托里乌斯21日说，在德国汽车产业面临压力背景下，他支持德国车企生产军工产品。对于这类“转向”能否产生效果，也有人提出质疑。据俄新社报道，皮斯托里乌斯当天参观德法合资军工企业KNDS防御系统公司在德国的一家工厂时表示，德国汽车产业正面临困难，而军工产业对劳动力和生产设施“需求巨大”，前者调整生产方向将使两个产业“都受益”。（新华社）", "ctime": 1784711731, "time_str": "17:15:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260722/c678355919.shtml"}, {"id": "4778025", "title": "大同证券：短期A股存在“被动”超跌可能，核心板块基本面仍具备支撑力度", "content": "大同证券策略分析师景剑文7月22日发布最新策略观点，称近期外部环境的剧烈波动或是拖累A股的主要原因之一，一方面美国通胀数据不佳，美联储紧缩预期反复；另一方面美以伊冲突再度升温，战争预期不可控性不断提升。叠加海外主要股指高位回调，引发跨境资本短期避险性流出，造成全球资本市场同步回落。景剑文表示，国内经济基本面并未出现同步恶化，出口韧性和内需修复趋势保持稳定，因此，A股在此轮调整中更多扮演“被动跟跌”角色，而非受自身经济形势恶化影响。景剑文表示，从结构性视角看，科技成长赛道的基本面仍具备强有力支撑，科技成长赛道虽整体承压，但业绩表现强势。半导体设备、AI算力硬件等细分领域的中报预增个股占比超六成，国产替代与产业升级逻辑并未被破坏，龙头公司合同负债及研发投入仍保持高增长，说明产业趋势并未逆转，当前回调更多是资金面扰动而非基本面证伪。", "ctime": 1784711722, "time_str": "17:15:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260722/c678355912.shtml"}, {"id": "4777973", "title": "马斯克旗下资产受热捧！脑机接口公司Neuralink估值飙至逾2800亿", "content": "据报道，马斯克旗下脑机接口初创公司Neuralink在近期的私募股权二级市场交易中，估值已经突破了420亿美元大关（约合2844亿元人民币）。这一数字较该公司去年6月上一轮融资时的估值增长了近四倍。这反映出投资者对马斯克旗下更多领域资产的浓厚兴趣。", "ctime": 1784711443, "time_str": "17:10:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260722/c678355771.shtml"}, {"id": "4777893", "title": "京源环保：全资子公司提起诉讼 涉案金额2250.3万元及相应逾期付款违约金148.09万元", "content": "京源环保公告，全资子公司南通京源云计算科技有限公司因算力云服务合同纠纷对蓝耘科技集团股份有限公司及李健提起诉讼。涉案金额为2250.3万元及相应逾期付款违约金148.09万元（暂计）。截至公告日，案件已受理但尚未开庭审理。", "ctime": 1784711131, "time_str": "17:05:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260722/c678355474.shtml"}, {"id": "4777879", "title": "卓兆点胶：多名股东拟减持股份", "content": "卓兆点胶公告，控股股东、实控人的一致行动人苏州特瑞特云帆壹号、星熠贰号、特瑞特企业拟自本公告披露之日起15个交易日后3个月内，通过集中竞价分别减持196.08万股、29.51万股、42056股，占总股本1.7064%、0.2568%、0.0366%。", "ctime": 1784711079, "time_str": "17:04:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260722/c678355448.shtml"}, {"id": "4777869", "title": "体育强国建设“十五五”规划发布：到2030年产业规模破7万亿元", "content": "经国务院批复同意，体育总局今天发布《体育强国建设“十五五”规划》（以下简称《规划》）。这是首个以“体育强国”为主题的国家级专项规划，对“十五五”时期加快建设体育强国、推动体育高质量发展作出了系统部署。《规划》提出，到2030年，体育整体发展质量和效益显著提升，综合价值和多元功能充分彰显，体育成为中华民族伟大复兴的标志性事业基础更加坚实，并设定5项主要发展指标：人均体育场地面积达到4平方米左右，经常参加体育锻炼人数比例达到40%左右，国民体质优良率达到31.1%，获得世界冠军数量位居前列，体育产业总规模突破7万亿元。《规划》全文共11个部分，分为总论、重点任务和保障措施三大板块。在重点任务部分，围绕全民健身、竞技体育、青少年体育、“三大球”、体育产业、体育文化、体育对外及对港澳台交往以及体育教育、科技、人才、法治、反兴奋剂、安全等方面提出了38项重点任务，配套设置了8个专栏工程，涉及场地设施建设、运动项目布局、训练基地提升、后备人才培养、户外运动产业升级、体育科技创新、体育人才培养、反兴奋剂生态体系建设等关键领域。", "ctime": 1784711055, "time_str": "17:04:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260722/c678355429.shtml"}, {"id": "4777865", "title": "云意电气：拟使用自有或自筹资金3000万欧元在比利时投资设立全资子公司", "content": "云意电气公告，为进一步落实公司全球化发展战略，完善公司海外市场布局，公司拟使用自有或自筹资金3000万欧元，在比利时投资设立全资子公司。", "ctime": 1784711003, "time_str": "17:03:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260722/c678355406.shtml"}, {"id": "4777863", "title": "美国纽约市军团病疫情致5人死亡", "content": "美国纽约市卫生部门官员21日说，该市近期暴发的军团病疫情已致5人死亡，过去一月累计感染人数超过60人，但细菌源头仍未查明。卫生部门7月2日发现本轮感染。在纽约曼哈顿上东区，8名感染者目前仍在住院接受治疗，56名感染者已治愈出院。感染源方面，据纽约市卫生部门通报，已在数十栋建筑的冷却塔检出军团菌，正对80栋建筑的82个冷却塔进行全面消杀。纽约市今年升级病菌检测新规，并增加巡检人员预算，在一些高档社区的豪华公寓楼、私立学校和知名博物馆的空调设备中检测出军团菌。一些感染者的律师质疑说，纽约市有相关防疫规定，为何军团病疫情仍反复暴发。纽约市卫生部门说，今年上半年已完成近1600次冷却塔检查，比2025年同期增加35%。（央视新闻）", "ctime": 1784710985, "time_str": "17:03:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260722/c678355398.shtml"}, {"id": "4777839", "title": "尔康制药：控股股东帅放文已减持0.52%", "content": "尔康制药公告，控股股东帅放文减持计划期限届满，2026年4月23日至2026年7月22日通过集中竞价减持1077.6万股，占总股本0.52%，减持均价4.38元/股。本次减持后，帅放文持有8.43亿股，占总股本40.86%。", "ctime": 1784710884, "time_str": "17:01:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260722/c678355344.shtml"}, {"id": "4777799", "title": "安孚科技：拟以1亿元-1.5亿元回购公司股份", "content": "安孚科技公告，拟以1亿元-1.5亿元回购公司股份，回购价格不超过76.64元/股。", "ctime": 1784710725, "time_str": "16:58:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260722/c678355221.shtml"}, {"id": "4777787", "title": "东星医疗：拟以2000万元-4000万元回购公司股份", "content": "东星医疗公告，拟以2000万元-4000万元回购公司股份，回购价格不超过41.7元/股。", "ctime": 1784710646, "time_str": "16:57:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260722/c678355175.shtml"}, {"id": "4777779", "title": "富国银行：黄金下行风险有限 2027年底有望攀升至6000美元/盎司", "content": "富国银行认为黄金下行风险有限，长期上涨空间可观。该行该策略师称加息预期已大部分计入金价，短期金价有跌至3500美元可能，但该行预测2026、2027年底金价将分别涨至5300-5500美元、5800-6000美元/盎司。（财联社）", "ctime": 1784710587, "time_str": "16:56:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "h // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
