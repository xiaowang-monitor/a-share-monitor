n/20261023/c681018215.shtml"}, {"id": "5462185", "title": "宝马聂科维：对中国汽车市场的长期发展潜力充满信心", "content": "在2026世界智能网联汽车大会上，宝马集团董事长聂科维指出，智能网联新能源汽车是中国高质量发展的重要驱动力，《智能网联新能源汽车产业发展“十五五”规划》 的发布也为智能化和电动化出行提出宏伟愿景。宝马集团对中国汽车市场的长期发展潜力充满信心，并将继续发挥连接中国、德国与欧洲的桥梁作用，汇聚各方优势，深化国际合作。（人民财讯）", "ctime": 1792735216, "time_str": "14:00:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261023/c681018190.shtml"}, {"id": "5462173", "title": "元戎启行周光：自动驾驶领域的人才密度仍然不够", "content": "10月23日，在2026世界智能网联汽车大会关键技术论坛上，深圳元戎启行科技有限公司CEO周光表示，目前自动驾驶领域的人才密度仍然不够，具备顶尖大模型经验的人才非常稀缺，此外算力和资金，对于自动驾驶团队而言都非常关键。（人民财讯）", "ctime": 1792735183, "time_str": "13:59:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261023/c681018174.shtml"}, {"id": "5462171", "title": "万联证券郦彬：A股情绪集中释放后定价将回归基本面", "content": "万联证券研究所所长郦彬认为，当前A股市场情绪集中释放，随着“9·29”一揽子宏观新政及近期金融街论坛系列增量政策逐步显效，第四季度消费与投资企稳回升动能坚实，叠加三季报结构性业绩亮点频现、市场估值处于高性价比区间、中长期资金加速入市，市场信心有望迎来实质性修复，可以把握岁末年初配置窗口的时机。郦彬表示，客观审视近期全球市场波动可以发现，尽管近期中美股市表面上呈现同频调整，但其背后的调整逻辑存在本质差异，海外风险因素与A股基本面的直接关联度相对有限。近期A股调整，更多是在外部情绪扰动下，场内部分存量资金因连续回调影响带来交易行为变化，微观交易结构阶段性走弱，带动市场情绪趋于谨慎。随着短期情绪层面的抛压逐步消化，市场定价将更多回归国内扎实的基本面与政策面。（人民财讯）", "ctime": 1792735175, "time_str": "13:59:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261023/c681018173.shtml"}, {"id": "5462161", "title": "沪深京三市成交额超1.5万亿元，较上日此时放量3293亿元", "content": "据同花顺iFinD数据，沪深京三市成交额超1.5万亿元，较上日此时放量3293亿元，预计全天成交金额约2.0万亿元。截至目前，沪市成交额6792亿元，深市成交额8082亿元，北证50成交额127亿元。", "ctime": 1792735054, "time_str": "13:57:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261023/c681018089.shtml"}, {"id": "5462151", "title": "光大证券王开：A股市场的制度建设正从应对波动走向塑造韧性和常态化赋能", "content": "光大证券首席资产配置分析师王开表示，证监会主席吴清近日在2026金融街论坛年会上发表主旨讲话，释放的积极信号不止在于短期提振信心，更在于回答了一个根本的问题——市场稳定靠什么。短期靠稳市机制防风险，中期靠长线资金和机构化进程增韧性，长期靠投融资协调改革、上市公司提质增效和高水平开放提质量。把这三层连起来看，A股市场的制度建设正在从应对波动走向塑造韧性和常态化赋能。当政策托底、资金结构优化和盈利修复同向发力，市场信心就更有条件转为内生修复，迈向长期投资决策。（人民财讯）", "ctime": 1792734953, "time_str": "13:55:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261023/c681018036.shtml"}, {"id": "5462105", "title": "受台风影响 福建沿海56条客渡运航线停航 转移13.41万人", "content": "今天，受台风“蔷琵”影响，福建沿海出现8级及以上大风。福建省防汛抗旱指挥部维持防台风三级应急响应。为了确保安全，截至23日11时，福建沿海共有56条客渡运航线、130艘客渡船停航，其中，4条两岸“小三通”客运航线全部停航。111个水上施工作业项目全部停工。福建海事局已调派部署专业大型救助船、海巡船艇、应急拖轮等海上应急力量靠前值守，随时做好应急抢险准备。目前，福建全省海上渔船和沿海养殖渔排上的人员已全部撤离，全省累计转移海上、陆上危险区域群众13.41万人。（央视新闻）", "ctime": 1792734737, "time_str": "13:52:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261023/c681017936.shtml"}, {"id": "5462097", "title": "日本能源白皮书：中东局势暴露日本能源体系弱点", "content": "日本政府23日发布的2025财年（2025年4月至2026年3月）能源白皮书指出，随着中东局势恶化，日本能源供需结构的脆弱性再次凸显。 白皮书指出，长期以来，日本原油进口超九成依赖中东。今年2月底美国和以色列对伊朗发动军事打击后，作为全球能源运输重要通道的霍尔木兹海峡通航受阻，原油及石油产品供应面临不确定性，石脑油等部分石油相关产品的流通因此出现阻滞。 为保障国内能源供应，日本政府自3月以来采取了释放石油储备、加大从中东以外地区替代采购力度等措施。白皮书认为，这些措施帮助日本确保了原油供应。但与此同时，部分石油相关产品出现了因市场对供应前景担忧而引发的囤积库存情况，导致流通不畅和供应分布不均。 白皮书认为，日本在上世纪70年代石油危机以后数十年间建立的能源危机应对机制，已难以应对新的能源供应风险。 日本政府通常在每年6月前后发布能源白皮书，今年为纳入中东局势变化情况及相关应对措施，推迟至10月发布。(新华社)", "ctime": 1792734678, "time_str": "13:51:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261023/c681017924.shtml"}, {"id": "5462065", "title": "西藏自治区财政厅拨付那曲市巴青县自然灾害救灾资金7000万元", "content": "10月22日22时33分，那曲市巴青县发生7.0级地震。为认真贯彻落实习近平总书记重要指示精神，按照自治区党委、政府决策部署，自治区财政厅快速建立资金保障绿色通道。10月23日，自治区财政厅紧急拨付中央自然灾害救灾资金5000万元，加上自治区安排的救灾资金2000万元，已累计预拨自然灾害救灾资金7000万元，全力保障做好抢险救灾工作。(央视新闻)", "ctime": 1792734542, "time_str": "13:49:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261023/c681017823.shtml"}, {"id": "5462057 : "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261023/c681016845.shtml"}, {"id": "5461519", "title": "中共中央政治局召开会议 审议《关于二十届中央第七轮巡视情况的综合报告》中共中央总书记习近平主持会议", "content": "中共中央政治局10月23日召开会议，审议《关于二十届中央第七轮巡视情况的综合报告》。中共中央总书记习近平主持会议。(新华社)", "ctime": 1792732500, "time_str": "13:15:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261023/c681016774.shtml"}, {"id": "5461485", "title": "中国代表：要改变安理会发达国家代表性过剩的局面", "content": "中国常驻联合国代表傅聪22日在联大全会审议安理会改革问题时发言，强调安理会改革最终目的是要改变发达国家代表性过剩的局面。傅聪说，当前国际形势动荡变革，地缘冲突延宕升级，危机挑战层出不穷。会员国普遍期待联合国发挥更大作用，迫切期盼安理会肩负起维护国际和平与安全的首要责任。中方支持安理会通过必要、合理改革提高权威和效率，更好应对危机和挑战，履行好《联合国宪章》赋予的职责。（新华社）", "ctime": 1792732452, "time_str": "13:14:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261023/c681016756.shtml"}, {"id": "5461479", "title": "津药达仁堂与华润医药商业达成战略合作", "content": "近日，津药达仁堂集团与华润医药商业集团战略签约，双方就津药达仁堂金芪降糖片、癃清片两大品种的全国总经销、渠道运营与终端推广等事宜达成深度共识。（人民财讯）", "ctime": 1792732442, "time_str": "13:14:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261023/c681016755.shtml"}, {"id": "5461473", "title": "艾可蓝赴科泰电源走访交流", "content": "近日，艾可蓝董事长刘屹带领技术与市场团队，赴科泰电源走访交流。双方围绕发电机组尾气排放治理、海外数据中心备电需求及后续合作进行了深入沟通。(人民财讯)", "ctime": 1792732407, "time_str": "13:13:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261023/c681016741.shtml"}, {"id": "5461451", "title": "两只热门宽基ETF成交双双破百亿", "content": "午后创业板ETF易方达（159915）、沪深300ETF华泰柏瑞（510300）成交额均突破100亿元。", "ctime": 1792732349, "time_str": "13:12:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261023/c681016712.shtml"}, {"id": "5461443", "title": "新西兰国防军司令因“诚信问题”辞职", "content": "新西兰国防军司令托尼·戴维斯23日因“诚信问题”辞职。新西兰国防部长保罗·戈德史密斯发表声明说，戴维斯已告知他将辞去国防军司令一职，辞职即刻生效。声明说，戴维斯作出这一决定的原因涉及“诚信问题”，这些问题他此前并未披露。戈德史密斯还表示，他将建议新西兰总督接受戴维斯的辞呈。在正式任命新司令前，国防军副司令马特·威廉姆斯将代理司令一职。（新华社）", "ctime": 1792732322, "time_str": "13:12:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261023/c681016690.shtml"}, {"id": "5461437", "title": "2000平方米永久性具身智能场景实训空间落地上海张江", "content": "2026全球开发者先锋大会暨国际具身智能技能大赛10月23日开幕。本届大赛以数智技术改造提升传统产业为目标，将机器人能力拆解为可复用的作业技能包，覆盖上下料搬运、焊接、精密装配、质量检测、能源巡检、安防巡防、商超零售、快递分拣等真实应用场景。举办地上海张江科学会堂改造2000平方米场地，打造永久性具身智能场景实训空间。（人民财讯）", "ctime": 1792732288, "time_str": "13:11:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261023/c681016674.shtml"}, {"id": "5461395", "title": "互联网金融板块午后拉升，汇金科技20cm涨停", "content": "互联网金融板块午后拉升，汇金科技20cm涨停，汇金股份、同花顺、华信永道、大智慧纷纷上扬。", "ctime": 1792732125, "time_str": "13:08:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261023/c681016588.shtml"}, {"id": "5461377", "title": "创业板指大幅拉升翻红，现涨0.84%", "content": "创业板指大幅拉升翻红，现涨0.84%，同花顺、华利集团、华大九天、宁德时代涨幅居前。", "ctime": 1792732039, "time_str": "13:07:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261023/c681016545.shtml"}, {"id": "5461369", "title": "海尔生物：目前公司已有并购目标标的", "content": "海尔生物在2026年第三季度业绩说明会上表示，目前公司已有并购目标标的，主要围绕“生物制造的核心装备和试剂耗材”和“高点卡位技术外延支持新场景拓展”这两方面持续推进。中长期来看，公司将围绕三条增长曲线持续拓展，通过“内生+外延”双轮驱动，推动公司从产品驱动的设备提供商逐步成长为科技驱动的科学服务平台，力争3年内实现并购事业收入占比不低于40%的目标。（人民财讯）", "ctime": 1792732029, "time_str": "13:07:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261023/c681016544.shtml"}, {"id": "5461333", "title": "创业板指跌0.46%，此前一度跌超3%", "content": "三大指数午后集体反弹，沪指现跌0.75%，深证成指跌0.54%，创业板指跌0.46%。", "ctime": 1792731927, "tim const META     = {"update_time": "2026-10-23 14:10:08", "sentiment_score": 55.89622641509434, "agents": []};

// 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
