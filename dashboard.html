arket": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260925/c680282970.shtml"}, {"id": "5248643", "title": "港股生物医药概念走高，金斯瑞生物科技涨超9%", "content": "港股生物医药概念走高，金斯瑞生物科技涨超9%，药明生物、药明康德涨超2%。", "ctime": 1790316741, "time_str": "14:12:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260925/c680282872.shtml"}, {"id": "5248495", "title": "哈尔滨至伊春高铁9月28日开通运营 将实施市场化票价机制", "content": "记者从国铁集团获悉，哈尔滨至伊春高速铁路（以下简称哈伊高铁）将于9月28日开通运营，哈尔滨至伊春间最快1小时46分钟可达，为满足旅客不同出行需求，铁路部门在哈伊高铁实施灵活折扣、差异化的市场化票价机制，为旅客出行提供更多选择。（央视新闻）", "ctime": 1790314373, "time_str": "13:32:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260925/c680282786.shtml"}, {"id": "5248493", "title": "象屿集团与辽阳市政府、比亚迪股份签署战略合作协议", "content": "9月23日，在中国辽宁国际投资贸易洽谈会上，辽阳市人民政府、象屿集团、比亚迪股份签署战略合作协议。根据战略合作协议，三方将在供应链协同、新能源重卡与物流电动化、储能及零碳园区建设、产学研合作等领域深化协同，共同打造政企联动、产业链深度融合的示范样板。", "ctime": 1790313962, "time_str": "13:26:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260925/c680282768.shtml"}, {"id": "5248481", "title": "日均240万人次 中秋、国庆假期民航旅客量将再创同期新高", "content": "民航局相关负责人表示，中秋、国庆假期也是民航旅客出行的高峰，环线游、出境游增速非常明显。假日出行还呈现出去程渐次达峰、回程集中抵离的特点。民航的旅客量有望再创历史同期新高。中国民航局副局长马兵介绍，整体来看，从9月25日到10月7日，全国民航预计运输旅客量3119万人次，日均240万人次，增长率3.6%。单日峰值有望突破260万人次，超过去年同期水平。", "ctime": 1790312253, "time_str": "12:57:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260925/c680282693.shtml"}, {"id": "5248459", "title": "港股午评：恒生指数跌1.69%，恒生科技指数跌2.14%", "content": "港股午间收盘，恒生指数跌1.69%，恒生科技指数跌2.14%。大型科网股普跌，小米集团跌逾3%，阿里巴巴、百度集团、美团、京东跌超2%。", "ctime": 1790308917, "time_str": "12:01:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260925/c680282500.shtml"}, {"id": "5248451", "title": "马尔代夫总统：愿与中方进一步巩固传统友谊", "content": "马累消息：马尔代夫总统穆伊兹24日在马累表示，马尔代夫高度重视同中国的长期友好关系，期待同中方共同应对挑战、把握机遇，进一步巩固传统友谊。穆伊兹当天出席中国驻马尔代夫大使馆举办的庆祝中华人民共和国成立77周年招待会，并向中国政府和人民致以国庆祝贺。穆伊兹说，中国走过了一段坚韧不拔、深刻变革的非凡历程，凭借坚定意志和远见卓识为世界作出重要贡献，在经济发展、科技、基础设施建设和民生福祉等领域取得的成就广受认可。(新华社)", "ctime": 1790308069, "time_str": "11:47:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260925/c680282473.shtml"}, {"id": "5248443", "title": "最快45分钟可达！西渝高铁西安至安康段9月28日开通运营", "content": "记者从国铁集团获悉，西渝高铁西安至安康段将于9月28日开通运营，西安东站至安康西站最快45分钟可达，将为区域经济社会协调发展注入新动能。西渝高铁起自西安东站，经商洛、安康、达州、广安等地，接入重庆西站，分西安至安康、安康至重庆两段建设。目前，安康至重庆段在建，此次开通的西安至安康段起自西安东站，途经陕西省西安市、商洛市、安康市，接入安康西站，线路全长171公里，设计时速350公里，全线共设西安东、牛背梁、柞水西、镇安西、安康西5座车站。 (央视新闻)", "ctime": 1790305990, "time_str": "11:13:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260925/c680282367.shtml"}, {"id": "5248419", "title": "国家统计局：第四次全国农业普查进入清查摸底阶段", "content": "农业普查是一项重大国情国力调查。我国每10年会进行一次农业普查，尾数逢6的年份为普查年度。国家统计局四农普集中办兰翔表示，截至目前，我们已经完成了普查方案制定、普查区划分及建筑物标绘、普查指导员和普查员选聘等工作，前期的各项任务取得阶段性成效。按照四农普的工作安排，接下来我们会在9月到11月在全国范围内开展清查摸底。据介绍，清查摸底是第四次全国农业普查中重要的前置环节，它的核心任务是为了在明年1—5月份普查入户登记工作正式开展前，“找全、查清、划准”普查对象。 (央视新闻)", "ctime": 1790303687, "time_str": "10:34:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260925/c680282247.shtml"}, {"id": "5248397", "title": "韩正会见保加利亚总统约托娃", "content": "当地时间2026年9月24日，国家副主席韩正在纽约出席联合国大会期间会见保加利亚总统约托娃。韩正向约托娃转达习近平主席的亲切问候和良好祝愿。韩正表示，保加利亚和中国虽然相距遥远，但传统友好、互利共赢始终是双边关系的鲜明底色。近年来，在两国元首战略引领下，两国互信持续深化，各领域务实合作稳步推进。中方愿继续同保方加强高层交往，筑牢政治互信，照顾彼此核心利益和重大关切，进一步促进双边关系健康稳定发展。中保在农业、信息通信、汽车零部件制造等领域合作富有成效，中方愿继续同保方深化青年、教育、文旅等领域交流，促进民心相通，加强多边协作，以更多合作成果造福两国人民。(新华社)", "ctime": 1790302727, "time_str": "10:18:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260925/c680282172.shtml"}, {"id": "5248303", "title": "9月全国日均揽收快递5.85亿件 单日峰值超6.1亿件", "content": "今年1—8月份，全国日均揽收快件5.23亿件。进入9月份以来，日均揽收快递已攀升至5.85亿件，其中，单日峰值超过6.1亿件。预计节日期间，快递业务量较节前有所回落，节后将迅速恢复到常态化高位运行水平。", "ctime": 1790301308, "time_str": "09:55:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260925/c680282025.shtml"}, {"id": "5248271", "title": "恒生科技指数跌幅扩大至2%", "content": "恒生科技指数跌幅扩大至2%。阿里巴巴、小米集团跌逾3%，美团、百度、京东跌超2%。", "ctime": 1790299990, "time_str": "09:33:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260925/c680281951.shtml"}, {"id": "5248237", "title": "港股开盘：恒生指数跌0.96%，恒生科技指数跌0.99%", "content": "港股开盘，恒生指数跌0.96%，恒生科技指数跌0.99%。个股方面，金斯瑞生物科技涨6.29%，环球新材国际涨4.47%，威高股份涨4.45%，阅文集团涨4.22%，周大福创建涨3.61%；白鸽在线跌5.71%，耐世特跌3.73%，广合科技跌3.11%。", "ctime": 1790299321, "time_str": "09:22:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260925/c680281900.shtml"}, {"id": "5248211", "title": "习近平在美国总统特朗普举行的欢迎宴会上的祝酒辞（全文）", "content": "习近平在美国总统特朗普举行的欢迎宴会上的祝酒辞（全文）（央视新闻）", "ctime": 1790298586, "time_str": "09:09:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260925/c680281848.shtml"}, {"id": "5248205", "title": "柳州：全力做好向海图强、开放发展“123”文章", "content": "据柳州市全力做好向海图强、开放发展“123”文章，推动高质量发展新闻发布会消息，2025年柳州新能源汽车产销量均首次突破百万大关，零部件本地配套率达68%；柳工集团海外营收占比超50%。战略性新兴产业产值占工业比重达33.6%，累计建成新能源电池电芯产能57.5GWh。柳江航道升级为Ⅱ级航道，2000吨级船舶可通江达海；“柳州—钦州—东盟”铁海联运专列成功开行。获批设立中国（柳州）跨境电商综合试验区，2025年工业出口交货值达319.7亿元。从内陆腹地到开放前沿，柳州正把向海图强势能转化为开放发展实绩。", "ctime": 1790298447, "time_str": "09:07:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260925/c680281750.shtml"}, {"id": "5248175", "title": "长安汽车：力争在2028年实现人形机器人量产", "content": "长安汽车近日在路演活动中表示，公司将加速推动具身智能人形机器人、飞行汽车等新兴产业布局和产业化落地，力争在2028年实现人形机器人量产、2030年推出商用航线飞行汽车，各项研发均按计划有序推进，具体进展以公司官方发布为准。", "ctime": 1790297659, "time_str": "08:54:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260925/c680281665.shtml"}, {"id": "5248135", "title": "商务部：今年前8个月 我国服务外包稳步发展", "content": "商务部最新数据显示：今年前8个月，我国服务外包稳步发展，其中，维修维护服务和研发服务增长较快。据介绍，今年前8个月，我国企业承接服务外包合同额12852.4亿元。其中，承接离岸服务外包合同额同比增长4%。从业务结构看，我国企业承接离岸业务流程外包执行额同比增长8.3%。其中，维修维护服务和研发服务增长较快，分别增长8.8%、10.8%。从国际市场看，美国、中国香港、新加坡居离岸服务外包来源地的前三位，合计占离岸服务外包执行总额的53.2%。", "ctime": 1790296394, "time_str": "08:33:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260925/c680281559.shtml"}, {"id": "5247945", "title": "马克龙称将派兵保护沙特延布石油设施", "content": "法国总统马克龙24日说，法国将派兵保护沙特阿拉伯西海岸延布港的石油设施免受也门胡塞武装袭击，以稳定石油供给、控制油价上涨。(新华社)", "ctime": 1790292740, "time_str": "07:32:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260925/c680279627.shtml"}, {"id": "5247829", "title": "全球最大的白银ETF iShares Silver Trust持仓量较前日增加11.23吨", "content": "截至2026年09月24日，全球最大的白银ETF iShares Silver Trust持仓量为15361.83吨，较前一个交易日增加11.23吨。", "ctime": 1790289676, "time_str": "06:41:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260925/c680279258.shtml"}, {"id": "5247805", "title": "法国拟召集七国集团商讨释放战略石油储备", "content": "法国总统马克龙24日晚接受两家法国电视台联合采访时说，法国拟召集七国集团成员国开会商讨释放战略石油储备，以稳定国际油价。 近期，美国和欧洲多国柴油价格均创下新高。马克龙说，七国集团成员国可研究如何通过相互协调的方式向市场释放战略石油储备，从而降低油价。 马克龙说，伊朗局势是全球油价飙升的主要原因，法国将致力于推动地区恢复稳定。此外，俄乌冲突对油价也有影响，法国就此呼吁双方停止攻打彼此能源目标。(新华社)", "ctime": 1790288822, "time_str": "06:27:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260925/c680279214.shtml"}, {"id": "5247683", "title": "哥伦比亚宣布与伊朗断交 const SECTORS  = [{"name": "金融", "hit_count": 57, "etfs": []}, {"name": "人工智能", "hit_count": 31, "etfs": []}, {"name": "数据要素", "hit_count": 25, "etfs": []}, {"name": "半导体", "hit_count": 21, "etfs": []}, {"name": "军工", "hit_count": 11, "etfs": []}, {"name": "新能源", "hit_count": 11, "etfs": []}, {"name": "医药", "hit_count": 10, "etfs": []}, {"name": "地产", "hit_count": 7, "etfs": []}];
const META     = {"update_time": "2026-09-25 16:59:53", "sentiment_score": 56.54761904761905, "agents": []};

// 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
