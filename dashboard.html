const NEWS     = [{"id": "4623955", "title": "深中华A：黄金珠宝业务收入占总营业收入的比重为99%以上 目前已没有开展锂电池材料业务", "content": "深中华A发布股票交易异常波动公告，近期公司经营情况正常，内外部经营环境未发生重大变化。公司目前主要经营业务为黄金珠宝业务，黄金珠宝业务收入占总营业收入的比重为99%以上，自行车及其他业务收入占总营业收入的比重已不足1%，目前已没有开展锂电池材料业务。", "ctime": 1782815599, "time_str": "18:33:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260630/c677840986.shtml"}, {"id": "4623939", "title": "全国首条海河联运枢纽零碳航线开通", "content": "6月30日，随着“宁远电鹏”轮满载集装箱缓缓驶离浙江嘉兴港独山港区，开往宁波舟山港金塘港区，标志着全国首条海河联运枢纽零碳航线正式开通。“宁远电鹏”轮由宁波远洋运输股份有限公司投建，总长127.8米、宽21.6米，可装载742标准箱，采用10个标准化箱式电池作为核心动力，总储电量约2万千瓦时，预计每年可节约燃油约800吨、减少二氧化碳排放超2000吨。吉利汽车长兴制造基地的汽车成套散件是这条零碳航线的首批“乘客”，产品从浙江长兴港出发，搭乘64标准箱纯电动内河集装箱船抵达嘉兴港，再换乘万吨级纯电动集装箱船“宁远电鹏”轮前往宁波舟山港，全程零燃油消耗、零尾气排放。根据测算，单个集装箱全程可减少碳排放约60千克。海河联运枢纽零碳航线赋予货物“低碳身份证”，提升产业附加值，为长三角外贸企业低碳出口提供全新水运方案。（新华社）", "ctime": 1782815561, "time_str": "18:32:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260630/c677840969.shtml"}, {"id": "4623937", "title": "兴业银锡：拟收购阿特拉斯锡业剩余25%股权", "content": "兴业银锡公告，公司全资子公司旗下大西洋锡业私人有限公司目前持有Atlas Tin SAS 75%股权。公司拟通过海外新设子公司收购丰田通商株式会社和日铁矿业株式会社合计持有的目标公司25%股权（共106.02万股），总对价2311.36万美元，资金来源为自有资金或自筹资金。交易完成后公司将通过旗下子公司间接持有目标公司100%股权，实现对目标公司的全资控股。该事项已获公司第十届董事会第三十六次会议审议通过，相关《股份购买协议》已于2026年6月30日签署。", "ctime": 1782815548, "time_str": "18:32:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260630/c677840966.shtml"}, {"id": "4623935", "title": "中国化学：选举莫鼎革为董事长，聘任7名高级管理人员", "content": "中国化学公告，公司第六届董事会第一次会议于2026年6月29日召开，审议通过选举莫鼎革为公司第六届董事会董事长，任期与本届董事会相同；同意第六届董事会各专门委员会组成人员；同意聘任邓兆敬为公司总经理，聘任刘东进为公司总会计师、总法律顾问，聘任赵涛、赵亮、梁军湘为公司副总经理，聘任杨志明为公司总经理助理，聘任朱今风为公司董事会秘书，聘任谭华为公司证券事务代表。", "ctime": 1782815539, "time_str": "18:32:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260630/c677840963.sht 选址，公司已于2025年12月签署补充协议，目前各方正推进审批工作。", "ctime": 1782815469, "time_str": "18:31:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260630/c677840865.shtml"}, {"id": "4623895", "title": "桂林旅游：收到结案通知书，35%股权已过户且执行完毕", "content": "桂林旅游公告，公司此前就与文良天等人的股权转让纠纷提起诉讼，经一审、二审及强制执行后，于2026年6月29日收到象山法院（2026）桂0304执101号《结案通知书》。本案执行完毕，被执行人文良天名下的桂林桂圳投资置业有限责任公司35%股权已过户至公司名下，公司通过法院扣划存款及执行和解收回相关债权。本案对公司本期利润或期后利润不会产生重大影响。", "ctime": 1782815461, "time_str": "18:31:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260630/c677840812.shtml"}, {"id": "4623893", "title": "桂林旅游：全资子公司债务豁免增加净利润约323万元", "content": "桂林旅游公告，公司全资子公司桂圳公司此前因天之泰工程尚欠广西四建公司1593.13万元。2026年6月30日，公司董事会审议通过桂圳公司与广西四建签署《结算协议书》，广西四建同意减免323.13万元，桂圳公司一次性支付1270万元后双方债权债务关系消灭。该债务豁免预计增加公司2026年度归属于上市公司股东的净利润约323万元。", "ctime": 1782815452, "time_str": "18:30:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260630/c677840749.shtml"}, {"id": "4623883", "title": "美锦能源：董事会提议向下修正美锦转债转股价格，当前转股价5.26元/股", "content": "美锦能源公告，截至2026年6月30日，公司股票已触发“美锦转债”转股价格向下修正条款。公司于2026年6月30日召开十届五十二次董事会，审议通过《关于董事会提议向下修正“美锦转债”转股价格的议案》，同意向下修正转股价格，并提议将该方案提交公司2026年第二次临时股东会审议。修正后的转股价格应不低于股东会召开日前二十个交易日公司股票交易均价和前一个交易日均价之间的较高者，且不得低于最近一期经审计每股净资产值和股票面值。如审议时上述任一指标高于调整前转股价5.26元/股，则无需调整。", "ctime": 1782815444, "time_str": "18:30:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260630/c677840687.shtml"}, {"id": "4623881", "title": "沃尔核材：控股子公司上海科特北交所上市申请获受理", "content": "沃尔核材公告，公司此前审议通过控股子公司上海科特新材料股份有限公司申请向不特定合格投资者公开发行股票并在北京证券交易所上市的议案。上海科特于2026年6月25日向北交所报送申报材料，并于2026年6月29日收到北交所出具的《受理通知书》（编号：GF2026060060），北交所已正式受理其上市申请。同日，上海科特招股说明书等文件已在北交所官网披露。", "ctime": 1782815436, "time_str": "18:30:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260630/c677840638.shtml"}, {"id": "4623879", "title": "诚志股份：第九届董事会选举张栋国为董事长，获9票同意", "content": "诚志股份公告，公司于2026年6月29日召开第九届董事会第一次会议，选举张栋国担任公司第九届董事会董事长、法定代表人，任期三年；选举王皓担任副董事长。会议同时聘任邹勇华为总裁，刘明为人事总监、董事会秘书，梁晋为财务总监，秦宝剑、刘明、李庆中、李瑞、王欣、左皓、谭斌为副总裁，李坤为证券事务代表，以上人员任期均为三年。上述议案表决结果均为9票同意、0票反对、0票弃权。", "ctime": 1782815427, "time_str": "18:30:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260630/c677840629.shtml"}, {"id": "4623865", "title": "天禄科技：一致行动协议到期，梅坦成为控股股东、实际控制人并持股21.71%", "content": "天禄科技公告，公司股东梅坦先生和陈凌先生于2016年8月19日、2021年1月12日分别签订《一致行动协议》及《一致行动协议之补充协议》，双方一致行动关系于2026年6月30日协议到期后终止，且不再续签。本次权益变动不涉及股东持股数量变动。梅坦先生持有公司股份2394.8万股，持股比例21.71%；陈凌先生持有2303.22万股，持股比例20.88%。一致行动关系终止后，公司控股股东、实际控制人由梅坦先生和陈凌先生变更为梅坦先生。", "ctime": 1782815416, "time_str": "18:30:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260630/c677840622.shtml"}, {"id": "4623863", "title": "东岳硅材：参股公司撤回科创板上市申请，公司持股5.14%", "content": "东岳硅材公告，公司参股公司山东东岳未来氢能材料股份有限公司（简称“未来材料”）首次公开发行股票并在科创板上市申请已于2025年6月27日获上海证券交易所受理。近日，未来材料基于其业务发展调整，经综合研判，已向上海证券交易所申请撤回首次公开发行股票并在科创板上市的申请文件，并已收到上交所出具的终止审核决定。未来材料后续将择机适时提交新一轮IPO申报。截至公告日，公司持有未来材料5.14%的股份，本次撤回申请不会对公司生产经营造成重大不利影响。", "ctime": 1782815400, "time_str": "18:30:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260630/c677840598.shtml"}, {"id": "4623849", "title": "中国置业投资：延迟刊发2026年年度业绩，股份自7月2日起暂停买卖", "content": "中国置业投资公告，因需要额外时间向银行等各方发送及接收审核确认函，以及收集核数师所要求的必要文件以完成审核程序，公司延迟刊发截至2026年3月31日止年度的经审核年度业绩。公司原须于2026年6月30日或之前刊发该业绩，预计将延迟至2026年7月中旬前发布。根据上市规则，公司股份预计自2026年7月2日上午九时正起暂停在联交所买卖，直至刊发年度业绩为止。", "ctime": 1782815325, "time_str": "18:28:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260630/c677840571.shtml"}, {"id": "4623847", "title": "中国广核：两名独董辞任，将补选新任独立董事", "content": "中国广核公告，2026年6月29日，公司董事会收到独立董事李馥友先生、徐华女士书面辞职报告。李馥友先生因连续任职独立董事即将满六年，申请辞去公司独立董事、董事会提名委员会主任委员、董事会审计与风险管理委员会委员和董事会核安全委员会委员等职务；徐华女士因个人职业发展规划，申请辞去公司独立董事、董事会审计与风险管理委员会主任委员、董事会薪酬委员会委员和董事会提名委员会委员等职务。因辞任将导致独立董事人数占公司董事会人数比例低于三分之一，李馥友先生和徐华女士将继续履行相关职责，辞任将在公司临时股东会选举产生新任独立董事之日起生效。公司将于近期召开董事会、股东会尽快完成补选。", "ctime": 1782815317, "time_str": "18:28:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260630/c677840561.shtml"}, {"id": "4623845", "title": "ST通脉：撤销其他风险警示，日涨跌幅限制由5%变为10%", "content": "ST通脉公告，公司此前因2022年度、2023年度内部控制审计报告被出具否定意见而实施其他风险警示。经2025年度内部控制缺陷整改完毕，中兴华会计师事务所已对公司2025年度内部控制有效性出具标准无保留意见审计报告，确认2023年度非标事项已消除。公司股票将于2026年7月1日停牌一天，自2026年7月2日起复牌并撤销其他风险警示，A股股票简称由“ST通脉”变更为“中通国脉”，股票日涨跌幅限制由5%变为10%。", "ctime": 1782815307, "time_str": "18:28:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260630/c677840542.shtml"}, {"id": "4623843", "title": "宇晶股份：实际控制人杨佳葳拟增持公司股份，金额不低于500万元且不超过1000万元", "content": "宇晶股份公告，公司实际控制人之一、董事、总经理杨佳葳先生计划自公告之日起6个月内，通过深圳证券交易所集中竞价交易方式增持公司股份，增持金额不低于500万元（含）且不超过1000万元（含），增持价格不设定价格区间，资金来源为自有或自筹资金。截至公告日，杨佳葳先生直接持有公司股份4394万股，占公司总股本16.47%，其与一致行动人合计持有公司股份9651.91万股，占总股本36.17%。", "ctime": 1782815298, "time_str": "18:28:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260630/c677840533.shtml"}, {"id": "4623841", "title": "星云股份：选举李有财为董事长，获8票赞成通过", "content": "星云股份公告，公司于2026年6月29日召开第五届董事会第一次会议，会议选举李有财先生为公司第五届董事会董事长，刘作斌先生为公司副董事长，选举并任命了战略、审计、提名、薪酬与考核等各专门委员会委员及主任委员。同时，董事会聘任刘作斌先生为公司总经理，聘任许龙飞女士、汤慈全先生、张孝仲先生为副总经理，聘任许龙飞女士为董事会秘书，聘任张孝仲先生为财务总监，聘任周超女士为证券事务代表，聘任刘林秀女士为内审部负责人。上述人员任期均自本次董事会审议通过之日起至第五届董事会任期届满之日止。", "ctime": 1782815288, "time_str": "18:28:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260630/c677840530.shtml"}, {"id": "4623839", "title": "中国广核：收购苍南核电46%及苍南第二核电51%股权完成交割", "content": "中国广核公告，公司此前披露拟向中国广核集团有限公司收购中广核苍南核电有限公司46%股权及中广核苍南第二核电有限公司51%股权，该交易已于2026年6月18日经股东会审议通过。近日，公司已完成本次交易款项的支付，于2026年6月30日，中广核苍南核电有限公司、中广核苍南第二核电有限公司成为公司的子公司。", "ctime": 1782815278, "time_str": "18:27:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260630/c677840528.shtml"}, {"id": "4623837", "title": "诺思格：和谐成长二期减持计划实施完成，减持191.98万股", "content": "诺思格公告，特定股东和谐成长二期（义乌）投资中心（有限合伙）此前计划于2026年5月26日至2026年8月25日期间减持公司股份不超过191.98万股（占总股本2.0000%）。截至2026年6月30日，该减持计划已实施完成。本次减持前和谐成长二期持有公司股份333.25万股，占剔除回购股份后总股本的3.4716%；减持后持有141.27万股，占剔除当前回购股份后总股本的1.4747%。", "ctime": 1782815271, "time_str": "18:27:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260630/c677840526.shtml"}, {"id": "4623829", "title": "证监会：共同营造“不敢造假、不能造假、不想造假”的市场生态", "content": "证监会召开资本市场财务造假综合惩防体系央地协同工作推进会。吴清总结指出，要认真落实党中央、国务院决策部署，全面认识加快构建综合惩防体系的全局意义，共同扛起打击和防范资本市场财务造假的政治责任，协力坚决铲除财务造假滋生的土壤和条件。上市公司是资本市场的基石，也是地方营商环境、经济成色和法治水平的“窗口”，守住上市公司真实透明、合规经营的底线，也就守住了地方发展的根本。地方政府是构建综合惩防体系至关重要的主体，长期以来对资本市场改革发展稳定给予了大力支持。证监会将继续主动加强与各地的沟通协作，在源头把关、信息共享、协同执法、风险处置、投资者保护等方面进一步汇聚合力，央地“同下一盘棋”，统筹推进防风险强监管促高质量发展，共同营造“不敢造假、不能造假、不想造假”的市场生态，更好服务地方经济高质量发展，更好服务金融强国建设和中国式现代化大局。（证监会）", "ctime": 1782815192, "time_str": "18:26:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260630/c677840496.shtml"}, {"id": "4623813", "title": "海尔智家：2026年6月回购4.43亿元，累计回购14.88亿元", "content": "海尔智家公告，公司此前披露拟以不超过35元/股回购总金额30亿元至60亿元，用于员工持股计划或股权激励。2026年6月，公司通过集中竞价交易方式累计回购A股股份2160.08万股，占公司总股本0.230%，购买最高价21.25元/股、最低价19.6元/股，支付金额4.43亿元。截至2026年6月底，公司累计回购股份7104.33万股，占总股本0.758%，累计支付金额14.88亿元。", "ctime": 1782815160, "time_str": "18:26:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260630/c677840486.shtml"}, {"id": "4623801", "title": "证监会召开资本市场财务造假综合惩防体系央地协同工作推进会", "content": "6月30日，中国证监会党委书记、主席吴清在北京主持召开资本市场财务造假综合惩防体系央地协同工作推进会。参会单位围绕重点工作开展情况、下一步工作进行了深入研究。会议讨论认为，经过近两年的共同努力，综合惩防体系日益健全，市场生态持续净化，打击和防范资本市场财务造假需要继续同向发力、协同共治。一是继续完善联合惩戒，加强社会监督，强化失信约束，构建防治造假机制。二是继续强化监管协作，提升信息共享水平，增强风险处置合力。三是继续打击配合造假，进一步完善线索通报与反馈机制，加大处置力度，坚决破除造假生态圈。(证监会)", "ctime": 1782815110, "time_str": "18:25:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260630/c677840466.shtml"}, {"id": "4623797", "title": "康惠股份：全资子公司中标数据中心改造项目，金额5059.92万元", "content": "康惠股份公告，公司全资子公司上海康惠智创网络科技有限公司以邀请招标方式中标河北亿广云数据有限公司的数据中心改造项目，中标价格（含税）5059.92万元，其中施工工程中标价格（含税）为2953.39万元，设备采购中标价格（含税）为2106.54万元。亿广云系公司实际控制人李红明、王雪芳夫妇控制的北京亿安天下科技股份有限公司的全资子公司，本次交易构成关联交易，尚需提交公司股东会审议。", "ctime": 1782815062, "time_str": "18:24:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260630/c677840429.shtml"}, {"id": "4623795", "title": "宝丽迪：拟投资3亿元在泗阳建设化纤母粒等生产基地", "content": "宝丽迪公告，公司拟与江苏泗阳经济开发区管理委员会签订《工业项目进区合同书》，投资建设化纤母粒、特种纤维及功能性新材料生产基地，项目总投资约3亿元，计划用地约100亩。同时，泗阳经开区管委会拟对公司全资子公司宝丽迪（宿迁）材料科技有限公司位于泗阳的原厂区土地及房屋进行收储或盘活，具体价格以市场评估价为准。公司于2026年6月29日召开董事会审议通过该议案，本次投资在董事会审批权限范围内，无需提交股东会批准。", "ctime": 1782815048, "time_str": "18:24:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260630/c677840421.shtml"}, {"id": "4623787", "title": "中国人民银行行长潘功胜会见德意志银行集团首席执行官克里斯蒂安·泽温", "content": "2026年6月30日，中国人民银行行长潘功胜会见德意志银行集团首席执行官克里斯蒂安·泽温。双方就当前中国及全球经济金融形势、德意志银行集团在华业务开展情况等议题进行了交流。(中国人民银行)", "ctime": 1782814966, "time_str": "18:22:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260630/c677840393.shtml"}, {"id": "4623749", "title": "高阳科技：前五个月经营亏损约1.96亿港元", "content": "高阳科技公告，公司预期截至2026年6月30日止六个月（2026年中期）录得经营亏损增加，相较于2025年中期经营亏损约1.41亿港元。截至2026年5月31日止五个月，本集团录得经营亏损约1.96亿港元，去年同期为约9610万港元；总收入同比增长约10%。亏损增加主要由于股份奖励及购股权确认的非现金股份偿付开支增加、销售及行政支出上升、信贷减值亏损以及支付数字化转型导致毛利率压力。", "ctime": 1782814843, "time_str": "18:20:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260630/c677840354.shtml"}, {"id": "4623733", "title": "宁波远洋：完成64,500TEU集装箱建造招标，合同总金额8.56亿元", "content": "宁波远洋公告，公司此前披露拟使用不超过10亿元投资建造64,500TEU集装箱。截至公告日，公司已完成全部集装箱建造厂商招标工作，分别与七家中标企业签署11份集装箱购置合同，总量合计64,500TEU，合同总金额8.56亿元。", "ctime": 1782814806, "time_str": "18:20:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260630/c677840328.shtml"}, {"id": "4623731", "title": "今天国际：控股股东签署补充协议，转让价5.4元/股", "content": "今天国际公告，公司于2024年7月31日披露控股股东、实际控制人邵健伟拟向邵健锋、圆安贵、邵泽天、詹保胜转让其直接和间接持有的全部上市公司股份，构成管理层收购暨控制权拟变更。2026年6月11日，邵健伟与邵健锋、圆安贵、邵泽天签署补充协议，约定以5.4元/股的价格分别转让3451万股、1.01亿股、5355.3万股，转让价款合计约10.24亿元。2026年6月29日，邵健伟质押于国泰海通证券的2660万股已解除质押，其持有的1.9亿股不存在质押情形。本次交易已通过董事会、监事会及股东大会审议，但因补充协议修订核心条款需重新召开董事会、股东会审议。目前交易各方正有序推进相关工作。", "ctime": 1782814796, "time_str": "18:19:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260630/c677840325.shtml"}, {"id": "4623729", "title": "云想科技：独立调查及内控审查完成，预计2026年8月前刊发2025年业绩", "content": "云想科技公告，公司此前因延迟刊发业绩自2025年4月1日起停牌，并收到联交所复牌指引。本次季度更新显示：独立调查已于2026年4月2日完成并公布主要调查结果；内部监控审查已于2026年6月22日完成并提交报告，整改建议将近完成；2024年度经审核业绩已于2026年6月26日刊发，2024年年报正作最终确定；公司正全力配合核数师完成2025年综合财务报表审计，预计2026年8月前刊发2025年中期业绩及全年业绩。截至公告日，集团各项业务正常开展，但2026年第二季度整体营收同比下降，公司股份将继续暂停买卖。", "ctime": 1782814787, "time_str": "18:19:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260630/c677840318.shtml"}, {"id": "4623727", "title": "利和兴：联合竞得龙华区工业用地，成交价3733万元", "content": "利和兴公告，公司于2026年6月5日董事会审议通过拟联合竞买深圳市龙华区观湖街道宗地A912-0637土地使用权并投资建设高端半导体及自动化设备研发生产基地项目，计划投资总额不超过3亿元。近 // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
