.score-bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s; }

.down { color: var(--green); }
.pulse { animation: pulse 2s infinite; }
@keyframes pulse {

  50% { opacity: 0.5; }

: "https://news.10jqka.com.cn/20261006/c680444290.shtml"}, {"id": "5321369", "title": "欧洲主要股指延续涨势", "content": "欧洲主要股指延续涨势，欧洲斯托克600指数、法国CAC40指数涨超1%，西班牙IBEX35指数、意大利富时MIB指数涨近1.5%。（财联社）", "ctime": 1791276549, "time_str": "16:49:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261006/c680444154.shtml"}, {"id": "5321365", "title": "欧洲央行管委雷恩：能源价格压力可能会持续一段时间，没有看到二次效应的迹象", "content": "欧洲央行管委雷恩表示，能源价格压力可能会持续一段时间，没有看到二次效应的迹象。（财联社）", "ctime": 1791276524, "time_str": "16:48:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261006/c680444153.shtml"}, {"id": "5321323", "title": "法德10年期国债收益率利差收窄8个基点至129个基点", "content": "法德10年期国债收益率利差收窄8个基点至129个基点。（财联社）", "ctime": 1791276182, "time_str": "16:43:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261006/c680444140.shtml"}, {"id": "5321315", "title": "巴基斯坦开伯尔-普什图省发生两起袭击事件，致5人死亡", "content": "巴基斯坦警方称，6日，武装人员在开伯尔-普什图省的德拉伊斯梅尔汗发动两起袭击，造成5人死亡。警方表示，4名在海关机构工作的人员遭武装分子开枪袭击，全部死亡。在另一起袭击中，不明身份人员向一辆交通警察巡逻车开枪，造成1名警员死亡，另有1名警员受伤。警方表示，目前尚无任何组织或个人宣称对袭击负责，这两起事件被定性为恐怖主义行为。（央视新闻）", "ctime": 1791276037, "time_str": "16:40:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261006/c680444134.shtml"}, {"id": "5321291", "title": "OpenAI在其智能体擅访澳数据后采取新防范措施", "content": "美国开放人工智能研究中心（OpenAI）首席战略官贾森 权6日在悉尼表示，OpenAI一个智能体未经授权访问澳大利亚国民医疗保险体系数据门户后，其公司已采取新防范监控措施，并已从事件中吸取教训。权当天接受澳议会下设人工智能联合特别委员会质询时说，该事件促使公司增设了监控机制：一旦模型以违规方式接入互联网，工作人员可立即介入终止训练；同时该公司支持澳大利亚针对同类事件建立强制报告制度。权就智能体擅访澳医保数据事件致歉，并表示需付出努力重建澳民众的信任。他说，OpenAI公司本应更早将智能体擅访澳医保数据告知澳政府，但当时未这样做是“希望在通知相关方前，能弄清更多事实”。他说：“我们已吸取教训：即使掌握信息有限，也最好通知受影响方。”（新华社）", "ctime": 1791275800, "time_str": "16:36:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261006/c680444127.shtml"}, {"id": "5321271", "title": "多家外资机构最新观点：对华配置升级", "content": "国庆长假期间，市场并不平静。10年期美债收益率一度升破5.34%，创24年新高。但高利率阴云之下，外资对中国资产的关注度却不降反升。美银最新报告显示，全球主动型多头基金对中国股票的配置已从“低配”升至“基准中性”，结束了长达四年的低配状态。富达国际、威灵顿投资等全球资管巨头亦相继发声，试图在复杂宏观中寻觅中国“新一代赢家”。多家外资机构军表达了对中国市场的关注。高盛认为中国资产是分散化配置的好地方，且A股优于H股；瑞银证券预计2026年A股盈利增长15%；贝莱德对中国股票维持中性，但明确关注AI硬件、电力电网设备与物理AI；景顺看好中国科技生态。此前花旗、渣打亦将中国股票上调至“超配”。（证券时报）", "ctime": 1791275626, "time_str": "16:33:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261006/c680444119.shtml"}, {"id": "5321221", "title": "伊朗称捣毁三个恐怖组织行动小组", "content": "伊朗情报部当地时间6日宣布在该国东南部捣毁三个恐怖组织行动小组。行动中，两名恐怖分子在与安全部队的交火中被打死，另有10人被逮捕。伊朗情报部表示，这些恐怖分子曾在境外接受过军事、炸弹制造及暗杀等训练，其潜入伊朗意图制造破坏与动荡。（央视新闻）", "ctime": 1791275199, "time_str": "16:26:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261006/c680444106.shtml"}, {"id": "5321195", "title": "雪佛龙首席执行官表示，伊朗战争后，石油和天然气需求将持续增长", "content": "雪佛龙首席执行官表示，伊朗战争后，石油和天然气需求将持续增长。（财联社）", "ctime": 1791274963, "time_str": "16:22:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261006/c680444101.shtml"}, {"id": "5321191", "title": "乌克兰基辅一数据中心遭俄军袭击后停止运行", "content": "乌克兰电信公司“欧米茄电信”当地时间10月6日在社交媒体上发布消息称，该公司位于基辅的数据中心在俄军大规模袭击后停止运行。目前公司正通过备用站点恢复通信线路和互联网接入。（央视新闻）", "ctime": 1791274940, "time_str": "16:22:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261006/c680444100.shtml"}, {"id": "5321173", "title": "Constellation Energy美股盘前涨超3%", "content": "Constellation Energy美股盘前涨超3%，消息面上，据报道称Alphabet接近与公司达成核能交易。（财联社）", "ctime": 1791274768, "time_str": "16:19:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261006/c680444097.shtml 22日。（财联社）", "ctime": 1791273482, "time_str": "15:58:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261006/c680444049.shtml"}, {"id": "5320945", "title": "古巴官员：古美保持“沟通渠道”", "content": "古巴驻美国大使馆临时代办利亚尼丝·托雷斯·里韦拉5日接受采访时表示，古巴与美国保持着“沟通渠道”，但未展开任何正式谈判。托雷斯表示，古巴对古美开展“互相尊重的对话”持开放态度，双方的外交接触包括举行会议、通电话及借助聊天软件沟通，但双方在敲定谈判议程或重启正式谈判方面没有取得任何进展。托雷斯没有透露古美“沟通”的时间、主题和参与者等信息。（财联社）", "ctime": 1791273255, "time_str": "15:54:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261006/c680444037.shtml"}, {"id": "5320881", "title": "世界银行：东亚太平洋地区2026年经济增速上调至4.5% 多国预算改善", "content": "世界银行6日发布东亚和太平洋地区经济预测更新报告，将2026年该地区经济增速预测上调至4.5%，较4月预测高0.3个百分点。报告表示，这一经济增速上调很大程度上是由于作为人工智能价值链一部分的国家高技术投资和出口表现强劲。在市场力量、可再生能源使用增加、动用库存和消费者补贴等因素共同作用下，高能源价格的拖累没有预期那样严重。世界银行表示，在高技术产品制造和出口推动下，该地区多个经济体今年经济增速超出此前预期。其中，越南、马来西亚和泰国今年经济增速预测被分别上调1.1个百分点、0.7个百分点和0.7个百分点。对高能源价格敏感和对外部冲击缓冲有限的太平洋岛国今年经济增速预测被下调0.5个百分点。世界银行负责东亚和太平洋地区的副行长卡洛斯·费利佩·哈拉米略说，全球人工智能相关活动大幅增加，东亚和太平洋地区与全球价值链的深度融合让该地区从中受益。现在的挑战是要将该地区在生产人工智能相关商品方面的优势转化为大范围的人工智能应用，从而提振生产力并带来更多更好的就业。（财联社）", "ctime": 1791272211, "time_str": "15:36:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261006/c680444009.shtml"}, {"id": "5320843", "title": "沙特民航局表示，纳季兰机场和吉赞机场周一晚间遭到袭击", "content": "沙特民航局表示，纳季兰机场和吉赞机场周一晚间遭到袭击。袭击造成三人受伤，并有财产受损报告。（财联社）", "ctime": 1791272015, "time_str": "15:33:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261006/c680444008.shtml"}, {"id": "5320831", "title": "快手旗下视频生成大模型可灵AI将启动港股上市，预计2027年初递表，融资至少10亿美元", "content": "快手旗下视频生成大模型可灵AI将启动港股上市，预计2027年初向港交所递交上市申请，至少融资10亿美元。据知情人士消息，可灵AI已选择中金公司、高盛和瑞银作为其香港IPO的承销商。此前，可灵AI已获得近30亿美元的独立融资，估值约为1228亿人民币。（科创板日报）", "ctime": 1791271893, "time_str": "15:31:33", "stock_code": "", "stock_name": "", "stock_ma // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

}
