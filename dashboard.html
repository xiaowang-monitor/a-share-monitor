tock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260729/c678515555.shtml"}, {"id": "4832105", "title": "深圳金融监管局：辖内银行已审批“白名单”项目443个，放款4365亿元", "content": "深圳金融监管局党委委员、一级巡视员陈飞鸿在该局2026年上半年新闻发布会上透露，该局持续发挥房地产融资协调机制作用，截至6月末，辖内银行累计审批“白名单”项目443个、发放贷款4365.24亿元。同时，该局积极与住建等部门联动，协同推进城市更新重点项目攻坚。（人民财讯）", "ctime": 1785305144, "time_str": "14:05:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260729/c678515516.shtml"}, {"id": "4831751", "title": "聚焦智能家电质量安全风险 市场监管总局发布国家标准", "content": "记者今天了解到，市场监管总局批准发布《智能家用电器质量安全风险分类评价指南》国家标准，将于2027年2月1日起实施。该标准确立了智能家用电器风险分类评价的基本原则、评价指标与评价方法，助力化解传统物理安全与新型信息安全叠加隐患，推动智能家电产业规范化、高质量发展。针对智能家电兼具传统电器硬件风险与联网数字化新型风险的行业现状，该标准主要作出三方面规定。一是划定四类安全风险。将智能家电质量安全风险分为电器安全、功能安全、信息安全、数据与隐私保护四大类别，既覆盖漏电起火、机械夹伤、温控失灵等传统家电物理危害，也针对联网智能特性新增网络入侵、系统漏洞、用户隐私泄露、第三方违规读取数据等数字化风险，全方位守护消费者人身、财产与个人信息安全。二是实现产品风险综合量化研判。建立兼顾产品本身安全属性、行业监管合规数据、消费者实际使用感受的综合评价框架，既明确产品硬件、控制系统、网络传输等实测考核内容，还结合电商评价、安全舆情等群众反馈情况，让产品安全评判更加客观全面。三是统一评估流程与风险分级机制。制定一套完整可落地的闭环评价流程，配套多种适配不同家电品类的评估方法，同时按照风险高低划分A、B、C、D四个等级。家电企业可提前排查产品隐患，针对高风险问题优化设计、升级固件，实现安全风险早识别、早处置。（央视新闻）", "ctime": 1785304840, "time_str": "14:00:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260729/c678515457.shtml"}, {"id": "4831623", "title": "川崎重工可骑行四足机器人计划2035年开始销售", "content": "日本川崎重工针对该公司正在开发的四足行走机器人“CORLEO”召开了项目说明会。该公司于4月启动了由数十人组成的开发团队，正在借助与英伟达的合作，加快开发控制技术等，计划2028年完成试制机，2035年开始销售。(科创板日报)", "ctime": 1785304683, "time_str": "13:58:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260729/c678515419.shtml"}, {"id": "4831615", "title": "上半年信贷投向出炉 金融资源向新质生产力集聚", "content": "中国人民银行昨天（28日）公布上半年信贷投向。上半年，人民币贷款增加了10.72万亿元。梳理贷款投向，记者发现，上半年信贷资金流向呈现明显结构性变化。传统房地产贷款增速放缓，而聚焦科技创新等领域的贷款增速亮眼，金融资源正向科创、算力新基建等新质生产力领域加速集聚。（央视新闻）", "ctime": 1785304616, "time_str": "13:56:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260729/c678515402.shtml"}, {"id": "4831613", "title": "青海兴海地震后当地已转移三万余人 设置集中避险点120个", "content": "昨天（28日）青海海南州兴海县多次发生5级以上地震。目前，当地的抗震救灾工作正在紧张进行中，截至今早10时，当地已紧急避险转移35086人，设置集中避险点120个，搭建帐篷1010顶。此次地震造成震中及周边区域部分居民房屋、道路设施等不同程度受损，其中，震中温泉乡倒塌房屋5户13间。截至目前，此次地震未造成人员伤亡情况，水电通信等一切正常，当地正平稳有序开展灾后房屋安全隐患排查等工作。（央视新闻）", "ctime": 1785304606, "time_str": "13:56:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260729/c678515401.shtml"}, {"id": "4831601", "title": "中国信通院：6月国内市场手机出货量1914.9万部 5G手机出货量同比下降12.1%", "content": "中国信通院数据显示，2026年6月，国内市场手机出货量1914.9万部，同比下降15.3%，其中，5G手机1620.1万部，同比下降12.1%，占同期手机出货量的84.6%。", "ctime": 1785304467, "time_str": "13:54:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260729/c678515374.shtml"}, {"id": "4831593", "title": "但斌：大跌一定要敢买，刚把剩余的子弹打光", "content": "7月29日，但斌在社交媒体称“大跌一定要敢买，刚把剩余的子弹打光”。\n\n此前其发文表示，“2倍做多海力士ETF此刻大跌25.72%。杠杆工具既能放大收益，也会成倍放大风险，潮水退去之时，更能看清市场波动的残酷。由此可见，这类杠杆产品需要格外谨慎。”\n\n但斌认为，海力士也成为这一轮AI行情阶段性标志的公司之一。按当下这种调整节奏，短期方向大概率很快见分晓。当然，拉长时间维度，唯有供需格局持续优化、盈利能力稳步改善的企业，才有机会穿越一轮轮周期。（财闻）", "ctime": 1785304413, "time_str": "13:53:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260729/c678515367.shtml"}, {"id": "4831437", "title": "现货黄金站上4040美元/盎司 现货白银站上58美元/盎司", "content": "现货黄金站上4040美元/盎司，日内涨0.29%。现货白银站上58美元/盎司，日内涨1.65%。", "ctime": 1785303953, "time_str": "13:45:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260729/c678515202.shtml"}, {"id": "4831405", "title": "科创50指数翻红", "content": "科创50指数翻红，此前一度跌近5%。", "ctime": 1785303852, "time_str": "13:44:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260729/c678515167.shtml"}, {"id": "4831359", "title": "放量！2只双创ETF成交额均突破100亿", "content": "今日宽基ETF再度显著放量，科创50ETF华夏（588000）、创业板ETF易方达（159915）成交额均突破100亿，此外中证1000ETF南方（512100）、沪深300ETF华泰柏瑞（510300）成交额均接近50亿。7月以来科创50ETF华夏（588000）累计申赎净流入348亿、沪深300ETF华泰柏瑞（510300）累计申赎净流入295亿，创业板ETF易方达（159915）累计申赎净流入293亿。", "ctime": 1785303677, "time_str": "13:41:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260729/c678515097.shtml"}, {"id": "4831357", "title": "韩国财政部长：为单股杠杆ETF在未经过仔细考虑的情况下推出表示歉意", "content": "韩国财政部长：为单股杠杆ETF在未经过仔细考虑的情况下推出表示歉意。", "ctime": 1785303675, "time_str": "13:41:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260729/c678515096.shtml"}, {"id": "4831291", "title": "中亚专家：世界人工智能合作组织成立是“里程碑”", "content": "中亚人工智能协会主席、上海合作组织前秘书长弗拉基米尔·伊马莫维奇·诺罗夫近日接受新华社记者采访时表示，世界人工智能合作组织的成立“是一个真正的历史性里程碑”，标志着国际社会在人工智能领域从技术竞争向建设性制度发展的决定性转变。(新华社)", "ctime": 1785303431, "time_str": "13:37:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260729/c678515026.shtml"}, {"id": "4831289", "title": "创业板指涨2% 全市场超4300家个股上涨", "content": "创业板指涨幅扩大至2%，上证指数涨0.68%，深证成指涨1.42%。全市场超4300家个股上涨。", "ctime": 1785303406, "time_str": "13:36:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260729/c678515019.shtml"}, {"id": "4831277", "title": "中证1000股指期货(IM)主力合约日内涨超2%", "content": "中证1000股指期货(IM)主力合约日内涨超2%，现报7059.2点。", "ctime": 1785303355, "time_str": "13:35:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260729/c678514953.shtml"}, {"id": "4831275", "title": "长鑫科技午后持续上扬涨超10%", "content": "长鑫科技午后持续上扬，涨超10%，报51.70元，市值3.46万亿元。", "ctime": 1785303350, "time_str": "13:35:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260729/c678514951.shtml"}, {"id": "4830983", "title": "证券板块午后持续上扬 华林证券涨停", "content": "证券板块午后持续上扬，华林证券涨停，中银证券、国盛证券、华安证券、国金证券、首创证券跟涨。相关ETF方面，证券ETF广发（159016）涨2.07%，成交额2307.97万元，证券ETF易方达（512570）涨2.29%，成交额1.3亿元。", "ctime": 1785302903, "time_str": "13:28:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260729/c678514851.shtml"}, {"id": "4830969", "title": "多位逆变器厂商人士回应美国市场禁令：对行业影响比较大", "content": "消息显示，7月28日，美国联邦通信委员会（FCC）更新《受限设备清单》，根据文件要求，境外全新高端机器人设备、电力逆变器，原则上无法取得FCC设备授权，不得进口、宣传及在美国境内销售。\n\n一家逆变器行业上市公司高管向记者表示，从现有信息来看，禁令将不再批准新的逆变器型号在美国进行认证，因此禁令主要是对未来的产品销售有影响，公司现有产品不受影响，已获认证的产品型号仍可以销往美国市场。不过，该高管也反馈，由于美国市场政策多变，公司也在跟进相关市场研究以进一步评估。另外一位逆变器厂商人士向记者介绍，其所在公司目前在美国市场业务占比较小，但是，此次禁令的落地对行业影响会比较大。(证券时报)", "ctime": 1785302756, "time_str": "13:25:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260729/c678514822.shtml"}, {"id": "4830879", "title": "深证成指午后走强涨1% 全市场超4200家个股上涨", "content": "深证成指涨幅扩大至1%，上证指数涨0.41%，创业板指涨1.51%。全市场超4200家个股上涨。", "ctime": 1785302118, "time_str": "13:15:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260729/c678514650.shtml"}, {"id": "4830863", "title": "中证500股指期货(IC)主力合约日内涨超2%", "content": "中证500股指期货(IC)主力合约日内涨超2%，现报7474.6点。", "ctime": 1785302096, "time_str": "13:14:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260729/c678514619.shtml"}, {"id": "4830853", "title": "机构：美联储的信号被视为“有些模棱两可”", "content": "Mediolanum International Funds的Daniel Loughney在一份报告中表示，美联储目前的信号有些模棱两可。这位固定收益主管表示，市场将美联储主席凯文·沃什在其首次美国联邦公开市场委员会会议上的言论解读为偏紧缩，并从市场预期降息转向预期加息。伦敦证券交易所集团的数据显示，目前市场预期周三晚些时候加息的概率为31.5%，并预计美联储将在未来12个月内加息略超过50个基点。“我们认为，市场对美联储意图的解读是错误的，加息是不合理的，“他说。Loughney补充说，Mediolanum认为凯文·沃什在上次会议上的立场既不偏紧缩也不偏宽松。", "ctime": 1785302014, "time_str": "13:13:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260729/c678514591.shtml"}, {"id": "4830831", "title": "北证50指数涨幅扩大至1%", "content": "北证50指数涨幅扩大至1%，现报1065.83点。", "ctime": 1785301943, "time_str": "13:12:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260729/c678514563.shtml"}, {"id": "4830829", "title": "央行上海总部谈自由贸易账户功能升级试点：继续积极推动数字人民币在试点中的应用", "content": "7月29日，中国人民银行上海总部召开2026年第三季度新闻发布会，介绍今年上半年上海金融运行情况。央行上海总部宏观审慎管理部副主任施建东表示，上海自由贸易账户功能升级试点自2025年12月正式启动以来，受到企业广泛欢迎，跨境与境内业务运行平稳，业务类型多元，资金划拨高效，取得预期成效。据介绍，目前已有11家银行、42家优质企业参与试点，服务对象涵盖了央国企、外资、民营等多类经济主体，服务汽车制造、现代农业、半导体等多个行业领域，试点项下跨境资金收付规模折合人民币已超过1330亿元。“下一步，央行上海总部将继续深化自由贸易账户功能升级试点，稳步推进业务扩面提质，扩大政策惠及面，引导更多优质企业参与，切实提升跨境贸易投融资便利化水平，支持实体经济发展；继续积极推动数字人民币在试点中的应用，提升跨境支付效率与安全性；以试点为抓手，探索跨境资金流动管理制度型开放路径，更好服务国家金融高水平开放。”施建东表示。（澎湃新闻）", "ctime": 1785301936, "time_str": "13:12:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260729/c678514560.shtml"}, {"id": "4830819", "title": "消费电子板块直线拉升", "content": "消费电子板块直线拉升，国光电器涨停, 昀冢科技涨超10%，蓝思科技、长盈精密、影石创新、惠威科技、朗特智能等跟涨。", "ctime": 1785301918, "time_str": "13:11:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260729/c678514541.shtml"}, {"id": "4830627", "title": "韩国KOSPI指数跌幅收窄至9%，此前一度跌超12%", "content": "韩国KOSPI指数跌幅收窄至9%，此前一度跌超12%。", "ctime": 1785301362, "time_str": "13:02:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260729/c678514284.shtml"}, {"id": "4830621", "title": "沪深京三市成交额超1.5万亿元，较上日此时放量1530亿元", "content": "据同花顺iFinD数据，沪深京三市成交额超1.5万亿元，较上日此时放量1530亿元，预计全天成交金额约2.2万亿元。截至目前，沪市成交额6937亿元，深市成交额7976亿元，北证50成交额103亿元。", "ctime": 1785301238, "time_str": "13:00:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260729/c678514237.shtml"}, {"id": "4830599", "title": "浙江：到2030年海洋经济综合实力位居全国前列", "content": "近日，浙江省政府办公厅印发《浙江省“十五五”海洋经济发展规划》，为今后五年海洋经济发展描绘了清晰路线图。《规划》提出到2030年，海洋经济综合实力位居全国前列，浙江海洋生产总值年均增速高于GDP增速一个百分点，海洋生产总值占GDP比重达14%。", "ctime": 1785300834, "time_str": "12:53:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260729/c678514106.shtml"}, {"id": "4830569", "title": "美股纳斯达克100指数期货跌超1%", "content": "美股纳斯达克100指数期货跌超1%，标普500指数期货跌0.35%，道琼斯指数期货跌0.24%。", "ctime": 1785300348, "time_str": "12:45:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260729/c678513970.shtml"}, {"id": "4830561", "title": "日经225指数跌幅扩大至3%", "content": "日经225指数跌幅扩大至3%，现报60490.58点。", "ctime": 1785300211, "time_str": "12:43:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260729/c678513877.shtml"}, {"id": "4830559", "title": "比亚迪李云飞：王传福个人没有直接投资长鑫科技", "content": "近日，关于比亚迪董事长王传福个人参投长鑫科技的消息，引发外界关注。7月28日深夜，比亚迪集团品牌及公关处总经理李云飞回应称，比亚迪所有的投资，均由比亚迪股份有限公司直投，没有管理第三方的资金，也没有管理所有高管个人的资金。“所以，王总（王传福）个人并没有直接投资长鑫科技。”李云飞强调。(每日经济新闻)", "ctime": 1785300166, "time_str": "12:42:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260729/c678513866.shtml"}, {"id": "4830557", "title": "机构：DRAM超越SoC成为旗舰智能手机中最昂贵单一元器件", "content": "根据Counterpoint Research内存价格跟踪，智能手机内存价格在2026年第二季度环比增长了80%以上。这种显著的增长对智能手机BOM成本造成了持续的结构性影响。根据该机构估算，与2025年推出的同级别型号相比，2026年智能手机的BoM成本结构发生了进一步的改变。2026年第二季度，低端机型（批发价<200美元）方面，相似配置的机型的BOM成本同比增长70%，几乎所有增长都是由存储驱动的；中端机型（批发价400 const SECTORS  = [{"name": "金融", "hit_count": 32, "etfs": []}, {"name": "人工智能", "hit_count": 23, "etfs": []}, {"name": "数据要素", "hit_count": 21, "etfs": []}, {"name": "半导体", "hit_count": 18, "etfs": []}, {"name": "消费", "hit_count": 16, "etfs": []}, {"name": "军工", "hit_count": 6, "etfs": []}, {"name": "机器人", "hit_count": 4, "etfs": []}, {"name": "地产", "hit_count": 2, "etfs": []}];
const META     = {"update_time": "2026-07-29 14:13:03", "sentiment_score": 54.166666666666664, "agents": []};

// 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
