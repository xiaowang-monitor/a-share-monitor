.score-bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s; }

.down { color: var(--green); }
.pulse { animation: pulse 2s infinite; }

049838.shtml"}, {"id": "5722543", "title": "巨化股份：控股股东一致行动人巨化投资拟增持1亿元至2亿元公司股份", "content": "巨化股份公告，公司控股股东巨化集团有限公司全资子公司浙江巨化投资有限公司（与巨化集团构成一致行动人）计划自2026年11月21日起3个月内，通过上海证券交易所交易系统以集中竞价交易方式增持公司A股股份，增持金额不少于人民币1亿元，不超过人民币2亿元。本次增持不设定价格区间，资金来源为自有及自筹资金。截至公告日，巨化集团直接持有公司14.23亿股，巨化投资持有2385.42万股，二者合计持有14.47亿股，约占公司已发行总股份的53.58%。巨化投资承诺在增持计划实施期限内及法定期限内不减持所持公司股份。", "ctime": 1795163072, "time_str": "16:24:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261120/c682049372.shtml"}, {"id": "5722523", "title": "中新签署关于启动双边自贸协定4.0版升级谈判的谅解备忘录", "content": "11月20日，商务部部长王文涛与新加坡副总理兼能源、贸易及工业部长颜金勇签署《关于启动中国—新加坡自由贸易协定4.0版升级谈判的谅解备忘录》。双方同意在中国—东盟自贸区、《区域全面经济伙伴关系协定》、中国—新加坡自贸协定及升级议定书基础上，进一步在政府采购、数字相关经贸规则等双方共同感兴趣的领域开展谈判，以期进一步扩大中新经贸合作，推动双边关系深化发展。中国—新加坡自贸协定于2008年10月签署，并于2018年11月、2023年12月两次升级，总体实施情况良好，对推动双边经贸合作发展发挥了重要作用。（商务部）", "ctime": 1795162908, "time_str": "16:21:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261120/c682049024.shtml"}, {"id": "5722495", "title": "赛力斯：已回购1779.57万股并注销，控股股东累计增持622.35万股", "content": "赛力斯公告，截至2026年11月20日，公司通过集中竞价交易方式已回购公司股份1779.57万股，占公司总股本的1.02%，回购最高价91元/股、最低价42.24元/股，支付总金额9.94亿元人民币（不含交易费用），回购股份将全部依法注销。自2026年7月13日以来，控股股东已累计增持公司股票622.35万股，其中A股303.11万股，增持金额1.57亿元人民币；H股319.24万股，增持金额1.1亿港元。公司团队近三年增持约3.7亿元人民币。", "ctime": 1795162719, "time_str": "16:18:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261120/c682048565.shtml"}, {"id": "5722477", "title": "福蓉科技：关联方南铝工程中标公司配套生活区综合改造工程，中标金额不超800万元", "content": "福蓉科技公告，公司绿色低碳铝合金新材料项目配套生活区综合改造施工经公开招标，中标人为关联方福建省南铝工程股份有限公司，中标金额为不超过800万元（实际金额按工程造价优惠10.16%）。南铝工程公司系公司控股股东控制的企业，构成关联交易，因系公开招标形成，可免于按关联交易方式审议和披露。过去12个月公司及全资子公司与南铝工程公司累计已发生的各类关联交易合同总额为1793.99万元（含本次交易）。", "ctime": 1795162607, "time_str": "16:16:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261120/c682048158.shtml"}, {"id": "5722453", "title": "道琼斯指数期货转涨", "content": "道琼斯指数期货转涨，纳斯达克100指数期货跌幅由最多时的1.4%收窄至0.7%，报26393.8点。", "ctime": 1795162513, "time_str": "16:15:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261120/c682047922.shtml"}, {"id": "5722449", "title": "特来电充电网平台日充电量首次突破1亿度", "content": "财闻独家获悉，11月20日，特锐德旗下特来电充电网平台日充电量达到1亿零225万度，首次突破1亿度。每天超过1亿度电，通过国内最大的充电运营商平台输送给全国的新能源汽车。从零起步，到如今每天为新能源汽车提供超过1亿度电，特来电用12年时间，把分散在全国各地的充电设备、场站和用户连接成一张规模化运营的充电网。目前，特来电平台已上线充电终端103万台，覆盖366座城市及地区，充电网覆盖公快、公交、小区、园区、物流五大场景，平台注册用户7290万，累计充电量836亿度，积累充电数据20.6PB。（财闻）", "ctime": 1795162504, "time_str": "16:15:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261120/c682047902.shtml"}, {"id": "5722433", "title": "金雷股份：控股股东、实际控制人、董事长提议回购公司股份，资金总额5000万元-1亿元", "content": "金雷股份公告，公司于2026年11月20日收到控股股东、实际控制人、董事长伊廷雷出具的提议回购公司股份的函。伊廷雷基于对公司未来发展前景的信心和对公司价值的认可，提议公司使用自有资金以集中竞价交易方式回购部分A股股票，用于维护公司价值及股东权益，并择机用于出售。本次回购资金总额不超过1亿元（不含），不低于5000万元（含），回购价格不高于董事会通过回购股份决议前三十个交易日公司股票交易均价的150%，实施期限为自董事会审议通过最终回购股份方案之日起不超过三个月。伊廷雷承诺将积极推动公司尽快召开董事会审议回购股份事项，并投赞成票。", "ctime": 1795162423, "time_str": "16:13:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261120/c682047714.shtml"}, {"id": "5722407", "title": "世界数据组织医疗健康专业委员会启动运行", "content": "记者今天从世界数据组织了解到，世界数据组织医疗健康专业委员会在北京启动运行，这是全球首个聚焦医疗数据合作的专业性平台。世界数据组织医疗健康专业委员会在中国发起成立，由北京数据集团、北京大学医学部等国内外近百家单位联合组建，未来将助力全球药物研发与智慧医疗。目前，全球医疗健康数据开发利用面临现实瓶颈：数据标准化程度不高、“数据孤岛”问题突出；高质量数据供给不足，制约人工智能在辅助诊疗、药物研发、公共卫生等场景中的深度应用。（央视新闻）", "ctime": 1795162280, "time_str": "16:11:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261120/c682047279.shtml"}, {"id": "5722403", "title": "苏州高新：产城公司向新景湾增资6.85亿元", "content": "苏州高新公告，控股子公司产城公司与景域公司拟共同向新景湾增资7.3亿元，其中产城公司出资6.85亿元，景域公司出资4498万元。增资后产城公司持股比例由70%升至92.60%。新景湾取得增资款后将向其全资子公司新景泓增资，用于苏地2026-WG-Z47号宗地开发建设。本次交易未达到股东会审议标准，尚需取得国有资产监督管理部门的批准。", "ctime": 1795162268, "time_str": "16:11:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261120/c682047211.shtml"}, {"id": "5722383", "title": "宁波银行提示近期贵金属业务市场风险", "content": "11月20日，宁波银行发布公告称，近期国内外贵金属价格波动剧烈，不确定性因素显著增强。请客户在投资该行贵金属业务时，提高贵金属业务的风险防范意识，基于自身财务状况和风险承受能力理性投资，从资产配置角度合理配置贵金属资产。请及时关注持仓情况，合理控制仓位，注意分散配置，避免单一重仓贵金属。", "ctime": 1795162207, "time_str": "16:10:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261120/c682046901.shtml"}, {"id": "5722381", "title": "港股收评：恒生指数跌1.89%，恒生科技指数跌3.78%", "content": "港股收盘，恒生指数跌1.89%，恒生科技指数跌3.78%。恒指港股通ETF银华（159318）跌1.95%，港股通科技ETF鹏华（159751）跌2.62%。板块方面，电脑与电子产品零售、休闲设施板块涨幅靠前；互动家庭娱乐、娱乐板块跌幅靠前。个股方面，科拓股份涨7.13%，商米科技-W涨7.02%，力勤资源涨5.32%，怡俊集团控股涨5.2%，五一视界涨3.77%；网易跌17.6%，长光辰芯跌14.84%，优必选跌13.32%，罗博特科跌13.22%，传音控股跌13.15%。", "ctime": 1795162197, "time_str": "16:09:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261120/c682046846.shtml"}, {"id": "5722365", "title": "金发科技：已累计回购公司股份344.54万股，支付3998.62万元", "content": "金发科技公告，公司此前审议通过回购股份方案，拟使用自有资金及自筹资金以集中竞价交易方式回购公司股份，回购股份全部用于注销并减少注册资本，回购价格不超过人民币19.57元/股（含），回购资金总额不低于人民币3亿元（含）且不超过人民币5亿元（含），回购期限为2026年11月12日至2027年11月11日。截至2026年11月20日，公司通过集中竞价交易方式累计回购公司股份344.54万股，占公司总股本的比例为0.13%，最低成交价为11.25元/股，最高成交价为11.84元/股，累计支付的资金总额为人民币3998.62万元（不含交易费用）。", "ctime": 1795162118, "time_str": "16:08:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261120/c682046401.shtml"}, {"id": "5722361", "title": "澳门将稳步推进与横琴粤澳深合区规则衔接机制对接", "content": "澳门特区政府行政法务司司长黄少泽20日表示，行政法务范畴将按照特区行政长官和特区政府的总体部署，紧扣“三五”规划目标任务，把稳步推进与横琴粤澳深度合作区规则衔接、机制对接作为2027年重点施政工作之一。(新华社)", "ctime": 1795162095, "time_str": "16:08:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261120/c682046284.shtml"}, {"id": "5722319", "title": "航民股份：首次回购公司股份304.04万股，支付1999.71万元", "content": "航民股份公告，公司此前审议通过以集中竞价交易方式回购公司股份方案，回购股份数量不超过2000万股、不低于1000万股，回购价格不超过人民币9.56元/股，回购用途为减少注册资本。2026年11月20日，公司首次通过集中竞价交易方式回购公司股份304.04万股，占公司总股本的0.2978%，成交最高价为人民币6.6元/股，最低价为人民币6.54元/股，支付的资金总额为人民币1999.71万元（不含交易费用）。", "ctime": 1795161873, "time_str": "16:04:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261120/c682045406.shtml"}, {"id": "5722283", "title": "雅运股份：实控人、董事长、总经理谢兵提议回购公司股份，资金总额不低于4000万元且不超过8000万元", "content": "雅运股份公告，公司董事会于2026年11月20日收到公司实际控制人、董事长、总经理谢兵先生《关于提议上海雅运纺织化工股份有限公司回购公司股份的函》。谢兵基于对公司长期发展的信心和对公司价值的认可，提议公司以集中竞价交易方式回购已发行的部分人民币普通股（A股），回购资金总额不低于人民币4000万元（含），不超过人民币8000万元（含），回购股份用于员工持股计划或股权激励，回购价格不高于董事会审议通过回购方案决议前30个交易日公司股票交易均价的150%，回购期限自董事会审议通过回购方案之日起12个月内。具体以董事会审议通过的回购方案为准。", "ctime": 1795161764, "time_str": "16:02:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261120/c682044810.shtml"}, {"id": "5722275", "title": "三星电气：实控人、董事郑坚江提议回购公司股份，金额不低于5000万元且不超过1亿元", "content": "三星电气公告，公司董事会于2026年11月20日收到公司实际控制人、董事郑坚江先生《关于提议宁波三星医疗电气股份有限公司回购公司股份的函》。基于对公司未来发展前景的信心和对公司价值的认可，提议公司使用自有资金和/或自筹资金通过集中竞价交易方式回购股份，回购资金总额不低于人民币5000万元（含），不超过人民币1亿元（含），回购股份价格不高于董事会通过回购股份决议前三十个交易日公司股票交易均价的150%，回购股份拟在未来适宜时机用于员工持股计划或股权激励计划，回购期限为自有权决策机构审议通过本次回购股份方案之日起6个月内。上述回购事项需按规定履行相关审批程序后方可实施，尚存在不确定性。", "ctime": 1795161745, "time_str": "16:02:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261120/c682044731.shtml"}, {"id": "5722271", "title": "摩登大道：控股股东普慧源2200万股解除司法冻结，占其所持股份34.48%", "content": "摩登大道公告，公司控股股东广州普慧源贸易有限公司所持公司部分股份此前被司法冻结，本次解除冻结股份22000000股，占其所持公司股份的34.48%，占公司总股本的3.09%，解除日期为2026年11月19日，申请人为广州市白云区人民法院。本次解除冻结后，普慧源所持公司股份不存在被冻结、拍卖等情形，不会导致公司控股股东、实际控制人发生变更。截至公告披露日，普慧源持股63809343股，持股比例8.96%，累计被质押股份41809343股，占其所持股份的65.52%，占公司总股本的5.87%。", "ctime": 1795161728, "time_str": "16:02:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261120/c682044642.shtml"}, {"id": "5722259", "title": "欧洲主要股指开盘多数下跌", "content": "欧洲主要股指开盘多数下跌，欧洲斯托克50指数跌1.16%，英国富时100指数跌0.29%，法国CAC40指数涨0.03%，德国DAX指数跌1.17%。", "ctime": 1795161688, "time_str": "16:01:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261120/c682044433.shtml"}, {"id": "5722253", "title": "厦钨新能：董事长提议回购公司股份，资金总额不低于5000万元且不超过1亿元", "content": "厦钨新能公告，公司董事会于2026年11月20日收到董事长杨金洪先生《关于提议厦门厦钨新能源材料股份有限公司回购公司部分股份的函》。基于对公司未来发展的信心和对公司价值的认可，为维护公司全体股东利益，增强投资者信心，同时进一步建立健全公司长效激励机制，提议公司通过集中竞价交易方式回购部分公司股份，回购的股份将于未来适宜时机用于员工持股计划或股权激励。回购股份的资金总额不低于人民币5000万元（含）且不超过人民币1亿元（含），回购价格上限不高于公司董事会审议通过回购股份方案决议前30个交易日公司股票交易均价的150%，回购期限自公司董事会审议通过回购股份方案之日起12个月内。提议人承诺将积极推动公司尽快召开董事会审议回购股份事项，并在董事会上对回购股份议案投赞成票。上述回购股份事项目前尚存在不确定性。", "ctime": 1795161662, "time_str": "16:01:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261120/c682044301.shtml"}, {"id": "5722251", "title": "圣泉集团：董事长提议以2亿元-4亿元回购公司股份", "content": "圣泉集团公告，公司董事会于2026年11月20日收到董事长唐一林先生出具的《关于提议济南圣泉集团股份有限公司回购公司股份的函》。唐一林先生提议公司通过集中竞价交易方式回购公司已发行的部分人民币普通股（A股）股票，回购股份的资金总额为人民币2亿元(含)-4亿元(含)，回购价格上限不高于公司董事会审议通过回购股份方案决议前30个交易日公司股票交易均价的150%，回购的股份将全部用于注销并减少公司注册资本，回购期限为自股东会审议通过方案之日起12个月内。", "ctime": 1795161654, "time_str": "16:00:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261120/c682044275.shtml"}, {"id": "5722223", "title": "中国石化在重庆成立油气勘探开发公司", "content": "企查查APP显示，近日，重庆渝星油气勘探开发有限公司成立，经营范围包含：陆地石油和天然气开采；矿产资源勘查；金属与非金属矿产资源地质勘探；燃气经营等。企查查股权穿透显示，该公司由中国石化全资持股。(人民财讯)" // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';

  return '#64748b';

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;

  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
