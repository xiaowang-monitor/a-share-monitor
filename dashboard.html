  color: var(--text-primary);

.mono { font-family: 'JetBrains Mono', monospace; }
.card {

  border-radius: 12px;
  padding: 20px;
  transition: all 0.2s;
}
.card:hover { background: var(--bg-card-hover); border-color: #334155; }
.badge {
  display: inline-flex; align-items: center; padding: 2px 8px;
  border-radius: 6px; font-size: 12px; font-weight: 500;
}
.badge-s { background: rgba(239,68,68,0.2); color: #ef4444; }

.score-bar {
  height: 6px; border-radius: 3px; background: #1e293b; overflow: hidden;
}
.score-bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s; }
.up { color: var(--red); }
.down { color: var(--green); }
.pulse { animation: pulse 2s infinite; }
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}
.glow { box-shadow: 0 0 20px rgba(59,130,246,0.15); }
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg-primary); }

</style>

om.cn/20261013/c680654524.shtml"}, {"id": "5377947", "title": "纳斯达克中国金龙指数跌幅扩大，现跌0.5%", "content": "纳斯达克中国金龙指数跌幅扩大，现跌0.5%，最新报5702.87点。", "ctime": 1791899648, "time_str": "21:54:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261013/c680654486.shtml"}, {"id": "5377917", "title": "邯郸市投资促进局：北京首家低空经济产业转移企业落户邯郸", "content": "首都禁飞区政策实施后，市投资促进局抢抓京津冀地区低空经济企业转移机遇，“点对点”精准对接意向外迁企业需求，联合临漳县快速承接，成功推动智能物流与特种作业无人机高新技术企业北京天隼创翼科技有限公司落户邯郸。项目主要包括“华北区域总部+总装制造+试飞测试+运维培训+场景运营”五个板块，分三阶段实施，先期占用4000平方米厂房，预计年产垂起固定翼无人机300架。10月12日下午，该项目首批设备顺利进场，成为首都禁飞区政策以来全市首家北京低空经济产业转移落地企业。（邯郸市投资促进局）", "ctime": 1791899436, "time_str": "21:50:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261013/c680654461.shtml"}, {"id": "5377907", "title": "盐城海事局发布航行警告：黄海南部部分海域10月15日至11月30日禁止驶入", "content": "盐城海事局发布航行警告，10月15日至11月30日，每日0时至24时，黄海南部部分海域进行实弹射击，禁止驶入。", "ctime": 1791899382, "time_str": "21:49:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261013/c680654456.shtml"}, {"id": "5377877", "title": "日本叶菜价格大幅上涨 白菜成“高价菜”", "content": "日本近期叶类蔬菜价格持续走高，白菜、生菜、圆白菜等价格较往年大幅上涨，一棵白菜零售价普遍超过1000日元（约合42.3元人民币），不少消费者直呼“太贵”。“叶菜太贵”近期成为日本社交媒体热门话题。有网友表示，去超市买菜时，看到叶菜价格“吓了一跳”，作为叶菜“平替”的豆芽常被抢购一空。业内人士分析，叶菜价格上涨与天气状况不利有关，日本近期多地持续降雨、光照不足，导致叶菜产量减少。预计短期内价格难以回落。（新华社）", "ctime": 1791899044, "time_str": "21:44:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261013/c680654409.shtml"}, {"id": "5377865", "title": "路畅科技：中联重科签署转让29.99%股份协议并复牌", "content": "路畅科技公告，公司此前披露控股股东中联重科筹划通过协议转让等方式变更公司控制权。最新进展为，中联重科已与远卓天使签署《股份转让协议》，拟转让3598.8万股股份，占总股本29.99%，转让价格为25元/股；交易完成后控股股东将变更为远卓天使，实际控制人将变更为张五堂先生，公司股票于2026年10月14日上午开市起复牌。", "ctime": 1791898976, "time_str": "21:42:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261013/c680654401.shtml"}, {"id": "5377785", "title": "苹果股价盘初上涨1.74% 再创历史新高", "content": "苹果股价盘初上涨1.74%，报346.892美元/股，总市值报5.06万亿美元，再创历史新高。", "ctime": 1791898501, "time_str": "21:35:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261013/c680654277.shtml"}, {"id": "5377767", "title": "竞业达与麒麟软件签署战略合作协议", "content": "10月13日，竞业达与麒麟软件战略合作签约仪式在京举办，双方将深化技术合作与市场协同，推进操作系统技术适配与人才联合培养，联合打造面向新质生产力的信创实验室，输出面向高等教育的智能硬件、数智化软件应用及智能体产品。（人民财讯）", "ctime": 1791898490, "time_str": "21:34:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261013/c680654276.shtml"}, {"id": "5377737", "title": "联合健康集团开盘上涨5.5%，创下7月16日以来最大盘中涨幅", "content": "10月13日，联合健康集团开盘上涨5.5%，创下7月16日以来最大盘中涨幅。", "ctime": 1791898362, "time_str": "21:32:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261013/c680654168.shtml"}, {"id": "5377733", "title": "美股开盘：美股三大指数涨跌不一", "content": "美股三大指数涨跌不一，标普500指数跌0.09%，道指涨0.76%，纳指跌0.38%。大型科技股方面，苹果涨1.55%，谷歌A涨1.15%，特斯拉跌1.65%，SpaceX跌1.91%，超威半导体跌2.99%。中概股方面，理想汽车涨1.49%，小鹏集团跌1.14%，阿里巴巴跌1.16%，蔚来跌2.02%。", "ctime": 1791898335, "time_str": "21:32:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261013/c680654164.shtml"}, {"id": "5377659", "title": "欧佩克上调2027年全球石油需求增长预期", "content": "当地时间10月13日，石油输出国组织发布2026年10月《石油市场月度报告》，将2027年全球石油需求增长预期从日均236万桶上调至255万桶。欧佩克当天还表示，欧佩克与非欧佩克产油国将继续在“欧佩克+”框架内磋商。与会方强调，除平衡供需外，确保能源运输通道安全畅通且具备经济可行性，对维护市场稳定同样至关重要。（央视新闻）", "ctime": 1791897964, "time_str": "21:26:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261013/c680654115.shtml"}, {"id": "5377629", "title": "波兰两大富豪联手布局核能，计划建设小型模块化核反应堆", "content": "波兰亿万富翁Michal Solowow与Solorz家族已同意联合建设小型模块化核反应堆。这是双方第二次尝试在核能项目上展开合作，正值波兰着手更新老旧电力设施之际。根据监管文件，Solowow旗下公司SGE SA与ZE PAK SA签署协议，旨在敲定未来共同建设和运营小型模块化核反应堆的合作细节。Solowow拥有GE Vernova Hitachi旗下BWRX-300反应堆的独家推广权，并将在新成立的合资企业中持有多数股权。波兰正大规模投资升级电力系统，通过增加可再生能源和燃气发电机组取代燃煤电厂。目前，煤炭发电仍占该国总发电量的一半以上。除小型核反应堆外，波兰还计划于2036年建成首座大型核电站。", "ctime": 1791897727, "time_str": "21:22:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261013/c680654082.shtml"}, {"id": "5377619", "title": "客机误发劫机警报 德国纽伦堡机场短暂停运后恢复起降", "content": "当地时间10月13日，德国纽伦堡机场在短暂停运后恢复航班起降。当天中午，一架从希腊科孚岛飞来的客机发出劫机警报代码，且飞行员一度无法通过无线电联系。警方出动特种部队并暂时封锁机场。该客机随后安全降落，警方与机组人员取得联系后确认现场不存在危险，并解除警报。警方表示，警报原因仍在调查中。一名警方发言人称，驾驶舱无线电设备故障可能是原因之一。（央视新闻）", "ctime": 1791897615, "time_str": "21:20:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261013/c680654068.shtml"}, {"id": "5377541", "title": "巴基斯坦军方宣布成功试射增程型高超音速弹道导弹", "content": "巴基斯坦三军新闻局13日发表声明说，巴陆军当天成功试射了“法塔赫-2”增程型高超音速弹道导弹。声明说，该武器系统配备了先进的导航装置和航空电子设备，凭借独特的飞行轨迹和机动性能，能够高精度打击目标并突破敌方导弹防御系统。其增程性能将进一步拓展巴陆军作战范围，提升对纵深目标的打击能力。（新华社）", "ctime": 1791897155, "time_str": "21:12:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261013/c680653976.shtml"}, {"id": "5377537", "title": "“沙特阿美石油设施将是合法打击目标” 胡塞武装发撤离警告", "content": "当地时间13日下午，也门胡塞武装对外发布信息，警告所有在沙特阿美石油公司设施附近的工作人员和民众立即撤离相关区域，并与这些设施保持距离。胡塞武装称，“沙特阿美旗下石油设施将成为其合法打击目标”。（央视新闻）", "ctime": 1791897140, "time_str": "21:12:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261013/c680653975.shtml"}, {"id": "5377521", "title": "美国两年期国债收益率转涨", "content": "美国两年期国债收益率转涨，最新上涨0.64个基点，报4.797%。", "ctime": 1791897060, "time_str": "21:11:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261013/c680653956.shtml"}, {"id": "5377479", "title": "苹果发布新一代HomePod mini 支持Siri AI 售价149美元", "content": "苹果发布新一代HomePod mini，支持Siri AI，提供全新配色并升级音质，售价为149美元。目前该产品已开启预订，将于10月30日在线下门店开售。", "ctime": 1791896711, "time_str": "21:05:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261013/c680653868.shtml"}, {"id": "5377381", "title": "苹果推出HomeView智能家居管理设备 售价299美元 11月13日开售", "content": "苹果推出HomeView设备，支持娱乐和智能家居管理，提供标准版和壁挂版，售价均为299美元。该设备今日开启预订，计划于11月13日上市，但不在欧盟市场销售。（蓝鲸新闻）", "ctime": 1791896449, "time_str": "21:00:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261013/c680653609.shtml"}, {"id": "5377297", "title": "期市夜盘开盘，国内期货主力合约多数下跌，20号胶跌超1%", "content": "期市夜盘开盘，国内期货主力合约多数下跌。跌幅方面，甲醇、纯碱、LPG、橡胶、20号胶跌超1%。涨幅方面，纯苯、沪铅涨超1%。", "ctime": 1791896402, "time_str": "21:00:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261013/c680653578.shtml"}, {"id": "5377283", "title": "俄称“能源停火”无新进展 泽连斯基称俄继续打击乌", "content": "俄罗斯总统新闻秘书佩斯科夫13日表示，关于“能源停火”的接触仍在进行中，与12日相比“没有新的进展需要补充发布”。乌克兰总统泽连斯基13日称，自美国总统特朗普宣布乌克兰与俄罗斯“能源停火”两天来，乌克兰没有对俄罗斯炼油厂或其能源行业实施打击，但俄方继续袭击乌能源设施和关键基础设施，并造成人员伤亡。（新华社）", "ctime": 1791896293, "time_str": "20:58:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261013/c680653553.shtml"}, {"id": "5377235", "title": "百亿量化负责人或将“奔私”", "content": "从业内获悉，华安基金现任量化投资部助理总监张序，后续或将“奔私”。目前拟定接手华安基金量化投资部管理职责的，是华泰柏瑞基金量化与海外投资部副总监兼基金经理孔令烨。目前张序尚未正式卸任，旗下仍管理着11只基金。截至今年三季度末，其公募管理规模超过110亿元。（21世纪经济报道）", "ctime": 1791896197, "time_str": "20:56:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261013/c680653511.shtml"}, {"id": "5377103", "title": "中联重科：拟转让路畅科技29.99%股份", "content": "中联重科公告，2026年10月13日，公司与远卓天使（龙游）新能源合伙企业（有限合伙）签署股份转让协议，拟以每股人民币25元转让路畅科技3598.8万股股份，占其总股本的29.99%，转让价款合计人民币9亿元。公司另拟申报预受路畅科技14%股份的部分要约。交易完成后，公司将不再为路畅科技控股股东；协议转让尚需取得深交所合规确认并完成股份过户登记。", "ctime": 1791895472, "time_str": "20:44:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261013/c680653315.shtml"}, {"id": "5377101", "title": "兄弟科技：控股股东钱志达减持计划于2026年10月13日届满未减持", "content": "兄弟科技公告，控股股东、实际控制人及董事长钱志达此前拟减持不超过1142.82万股，占公司总股本的1.00%。截至2026年10月13日，减持计划期限届满，钱志达未减持公司股份。", "ctime": 1791895465, "time_str": "20:44:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261013/c680653314.shtml"}, {"id": "5377093", "title": "沙特阿美总裁：全球原油库存逼近“危险低位”", "content": "沙特阿拉伯国家石油公司（沙特阿美公司）总裁兼首席执行官阿明·纳赛尔12日在第二十五届世界石油理事会能源大会（世界石油大会）上表示，全球原油库存正逼近“极度危险”的低位，可能需要两年时间才能恢复至正常水平。受霍尔木兹海峡局势影响，全球能源供应链持续承压，原油供应紧张程度加剧。纳赛尔表示，当前商业陆上石油库存已低于60亿桶，这已经是“最后可用的缓冲”，但这些库存绝大多数实际上无法为市场所用。纳赛尔认为，由于全球原油消费需求依然在持续攀升，即便霍尔木兹海峡在短期内完全重新开放、市场信心全面恢复，想要彻底补充消耗殆尽的库存，至少需要长达两年的“超负荷加班生产”。（新华社）", "ctime": 1791895397, "time_str": "20:43:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261013/c680653276.shtml"}, {"id": "5377029", "title": "神州细胞：神州安隆、神州安乾拟减持不超过0.03%股份", "content": "神州细胞公告，股东暨员工持股平台神州安隆、神州安乾因个人资金需求，拟通过集中竞价方式分别减持不超过56700股、76600股，合计不超过13.33万股，占公司总股本不超过0.03%；减持期间为2026年11月4日～2027年2月3日。", "ctime": 1791895055, "time_str": "20:37:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261013/c680652427.shtml"}, {"id": "5377015", "title": "Suzano美股盘前跌超10%", "content": "Suzano美股盘前跌超10%，现报7.65美元。", "ctime": 1791894991, "time_str": "20:36:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261013/c680652227.shtml"}, {"id": "5376985", "title": "金斯瑞：CAR // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {

  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
