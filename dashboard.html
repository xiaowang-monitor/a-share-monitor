, "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260626/c677740820.shtml"}, {"id": "4603639", "title": "现货白银涨超1%", "content": "现货白银涨超1%，现报58.2美元/盎司。", "ctime": 1782457032, "time_str": "14:57:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260626/c677740788.shtml"}, {"id": "4603637", "title": "沪深京三市成交额超3.5万亿元，较上日此时缩量523亿元", "content": "据同花顺iFinD数据，沪深京三市成交额超3.5万亿元，较上日此时缩量523亿元，预计全天成交金额约3.5万亿元。截至目前，沪市成交额15885亿元，深市成交额18894亿元，北证50成交额226亿元。", "ctime": 1782457030, "time_str": "14:57:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260626/c677740787.shtml"}, {"id": "4603613", "title": "美团CFO：当前公司价值被严重低估 美团计划进行股票回购", "content": "在美团股东周年大会上，美团CEO王兴表示，过去几年公司股价不理想，对此深感责任重大。“我们一方面会积极应对经营好公司，另一方面呼吁整个行业更理性发展。”此外美团也会通过其他措施尽量给市场更多信心，例如美团在外部有一些不错的投资，可能上市就会获得好的回报，美团会考虑在合适的情况下积极退出。美团CFO陈少晖表示，当前公司价值被严重低估，美团计划进行股票回购。（第一财经）", "ctime": 1782456750, "time_str": "14:52:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260626/c677740711.shtml"}, {"id": "4603597", "title": "美团CEO王兴回应股价低迷：呼吁行业理性发展", "content": "6月26日，在美团股东周年大会上，美团CEO王兴表示，过去几年公司股价不理想，对此深感责任重大。他表示，美团一方面会积极应对经营好公司，另一方面呼吁整个行业更理性发展。此外，美团也会通过其他措施尽量给市场更多信心，例如美团在外部有一些不错的投资，可能上市就会获得好的回报，美团会考虑在合适的情况下积极退出。美团CFO陈少晖表示，当前公司价值被严重低估，美团计划进行股票回购。（第一财经）", "ctime": 1782456538, "time_str": "14:48:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260626/c677740651.shtml"}, {"id": "4603593", "title": "水贝有金店爆满但成交不及去年一半", "content": "近期国际金价持续回调，一度跌破4000美元大关。第一财经记者走访深圳水贝市场发现，端午过后市场客流持续旺盛，但观望情绪浓厚。商家表示，相较去年金价上涨时的热销行情，如今整体销量下滑明显，成交规模不足去年一半，高位买入过黄金的消费者，当下入手意愿更是大幅降低。多数消费者仍认为当前价位偏高，心中理想入手价在500元/克左右。受金价反复震荡影响，即便有意入手，大家也只挑选小巧吊坠自戴，不敢大额囤金。（第一财经）", "ctime": 1782456501, "time_str": "14:48:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260626/c677740640.shtml"}, {"id": "4603551", "title": "《中国—韩国自由贸易协定》联委会第七次会议在京举行", "content": "据商务部消息，6月25日，中国—韩国自由贸易协定联委会第七次会议在北京举行。商务部国际贸易谈判代表兼副部长李成钢和韩国产业通商部通商交涉本部长吕翰九共同主持会议。双方共同回顾了中韩自贸协定实施情况，高度评价协定对促进两国产业链供应链融合、推动经济增长所作贡献，就自贸协定实施中的有关具体关注问题深入沟通。会议期间，协定下设原产地规则和海关程序、技术性贸易壁垒、知识产权、经济合作等相关委员会做了工作报告。双方同意继续推动中韩自贸协定高质量实施，早日完成中韩自贸协定第二阶段谈判，进一步提升中韩服务投资领域开放水平，为两国企业和民众带来更多实实在在的利益。", "ctime": 1782455993, "time_str": "14:39:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260626/c677740500.shtml"}, {"id": "4603527", "title": "宏川智算：与长兴半导体打通算力存储供应链，DDR5内存条送达某头部GPU设计厂商", "content": "近日，宏川智慧子公司宏川智算完成一批企业级DDR5内存条交付，已顺利送达至国内某头部GPU设计厂商，用于其AI算力芯片的服务器验证与算力中心建设。这是宏川智算自2026年5月获长兴半导体官方代理授权后落地的首批重要订单之一，标志着国产高端存储与国产GPU芯片设计厂商的产业链协同迈出实质性一步。为支撑此次合作及后续采购，宏川智算母公司宏川智慧于2026年6月份公告，拟为宏川智算向长兴半导体采购内存条等产品提供最高1.6亿元连带责任担保，同时还拟为向燧原科技采购GPU卡及算力服务器设备提供最高4亿元担保。凭借母公司的资本支持和长兴半导体的产品优势，宏川智算有望成为国产算力存储供应链中的关键枢纽。（人民财讯）", "ctime": 1782455720, "time_str": "14:35:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260626/c677740407.shtml"}, {"id": "4603477", "title": "日韩股市集体收跌", "content": "日经225指数收跌4.15%，报69360.88点。韩国综指收跌5.81%，报8411.20点。", "ctime": 1782455480, "time_str": "14:31:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260626/c677740321.shtml"}, {"id": "4603479", "title": "宁德时代盘中跌超5%", "content": "A股宁德时代盘中跌5.01%，现报381.76元。", "ctime": 1782455480, "time_str": "14:31:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260626/c677740322.shtml"}, {"id": "4603455", "title": "沪深京三市成交额超3.2万亿元，较上日此时缩量412亿元", "content": "据同花顺iFinD数据，沪深京三市成交额超3.2万亿元，较上日此时缩量412亿元，预计全天成交金额约3.5万亿元。截至目前，沪市成交额14542亿元，深市成交额17256亿元，北证50成交额204亿元。", "ctime": 1782455351, "time_str": "14:29:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260626/c677740297.shtml"}, {"id": "4603433", "title": "全球首个自动驾驶系统全球技术法规获批发布", "content": "记者26日从工业和信息化部获悉，全球首个自动驾驶系统全球技术法规获批发布。我国在这一法规制定过程中发挥了重要的牵头与推动作用。 6月22日至26日，联合国世界车辆法规协调组织第199次全体会议在瑞士日内瓦召开。会上，由中国、欧盟、英国、美国、加拿大和日本共同牵头制定的联合国自动驾驶系统全球技术法规（ADS GTR）经全体缔约方投票表决，正式获批发布。这一法规明确了自动驾驶系统产品核心技术指标等，构建起覆盖产品全生命周期的法规框架。作为全球首个自动驾驶全球技术法规，将为自动驾驶技术有序安全落地提供统一遵循。 据悉，在深度参与国际法规研制的同时，工业和信息化部加快推进我国自动驾驶系统强制性国家标准制定工作，目前已完成标准编制，正在履行报批程序。与ADS GTR相比，国内标准全面覆盖其核心技术内容，同时立足我国产业实际与监管需要，针对L3级、L4级自动驾驶系统提出更为细化的技术要求，清晰划定不同级别产品的安全底线；进一步完善用户使用培训与告知等内容，防范误用和滥用风险；在国际通行的“多支柱法”试验方案基础上，创新性提出统一的标准化试验场景，为国际法规落地实施提供支撑。(新华社)", "ctime": 1782455164, "time_str": "14:26:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260626/c677740227.shtml"}, {"id": "4603431", "title": "中际旭创成交额达400亿元", "content": "中际旭创成交额达400亿元，现跌4.48%。", "ctime": 1782455160, "time_str": "14:26:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260626/c677740226.shtml"}, {"id": "4603413", "title": "意大利监管机构就“Microsoft 365”涨价一事对微软展开调查", "content": "意大利反垄断监管机构周五表示，已针对微软公司展开调查，原因是该公司涉嫌在“Microsoft 365”订阅服务涨价过程中存在不公平商业行为。该监管机构称，这家Windows系统制造商未充分告知消费者，其Microsoft 365服务已与人工智能工具Copilot和Designer整合。该监管机构在声明中补充道，除非消费者主动选择退出，否则将被自动转入更昂贵的订阅套餐，而他们收到的信息不足以决定是否续约。监管机构还指出，这家科技巨头的做法可能被视为“强硬”，因为它不当限制了消费者的选择自由。微软尚未立即对此置评。", "ctime": 1782454985, "time_str": "14:23:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260626/c677740167.shtml"}, {"id": "4603383", "title": "美银证券：AI内存供给短缺至少会持续到明年底", "content": "美银证券高级半导体分析师Vivek Arya最新表示，内存行业正在经历一场由人工智能驱动的根本性结构变革，美光科技最新的季度业绩表明，制造专为人工智能优化的存储芯片所需的产能是传统计算产品的三到四倍。他在接受最新采访时解释说，“没有存储芯片，就没有人工智能”，并指出近期看到的盈利激增——远远超过了人们的预期——反映的是一种永久性的转变，而不是典型的周期性上升。\nArya还预计，AI内存的供需失衡至少会持续到明年年底。他提到，美光已宣布与16家不同的客户达成里程碑式的协议，这些协议将提供多年价格、数量和供应方面的可见性。“我认为这次的周期持久性有所不同，”他说道，并强调即使存储芯片制造商想要提高产量，但土地、电力和制造空间等物理限制使得快速扩张几乎不可能。", "ctime": 1782454626, "time_str": "14:17:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260626/c677740085.shtml"}, {"id": "4603377", "title": "算力租赁板块震荡走弱，利通电子、盈峰环境跌停", "content": "算力租赁板块震荡走弱，利通电子、盈峰环境跌停，亿田智能跌超10%，杰创智能、紫光股份、工业富联、润建股份、嘉环科技跟跌。", "ctime": 1782454495, "time_str": "14:14:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260626/c677740051.shtml"}, {"id": "4603307", "title": "海光信息：已提前准备“CPU+DCU”双芯融合技术开发", "content": "海光信息高管向记者表示，基于海光“CPU+DCU”双芯一体化方案，用户无需区分算力优化工作由CPU还是DCU承载，整套系统可统一输出高效算力。未来CPU将承载更多原本由加速芯片承担的运算任务，部分轻量化应用也可直接运行在DCU上，而对于仅布局单一品类芯片的厂商而言，很难匹配这类复合需求。据透露，海光已提前准备双芯融合的相关技术开发。 （科创板日报）", "ctime": 1782453924, "time_str": "14:05:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260626/c677739834.shtml"}, {"id": "4603289", "title": "国家能源局：到2030年我国充电基础设施将达到4000万个", "content": "国家能源局副局长万劲松表示，“十五五”期间，我国将进一步加快布局建设新型能源基础设施。新型能源基础设施是新型能源体系的“大骨架”“硬支撑”，能让风光水电等清洁能源送得出、接得住、用得好，未来要加快布局促进新能源发展的能源基础设施。国家能源局副局长万劲松表示，将优化开发方式，建设“三北”风电光伏、西南水风光一体化等清洁能源基地，因地制宜发展绿电直连，建设低碳零碳油气田，推动新能源集成融合发展。同时，提升新能源的接入和消纳能力，加快打造安全可靠、绿色低碳、坚强韧性、智能灵活的新型电网，推动源储调节能力增长40%以上。同时，还要加快布局新技术新模式带动的能源基础设施，包括可再生能源制氢、绿色燃料、充电设施、核能综合利用、虚拟电厂、综合能源站等。到2030年，我国的充电基础设施将达到4000万个、实现倍增发展。可再生能源制氢规模将达到200万吨，用于钢铁化工生产等。虚拟电厂的调节能力将达到5000万千瓦以上，相当于50台不烧煤的大型火电机组。（央视新闻）", "ctime": 1782453819, "time_str": "14:03:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260626/c677739810.shtml"}, {"id": "4603269", "title": "沪深京三市成交额超3万亿元，较上日此时缩量470亿元", "content": "据同花顺iFinD数据，沪深京三市成交额超3万亿元，较上日此时缩量470亿元，预计全天成交金额约3.5万亿元。截至目前，沪市成交额13641亿元，深市成交额16173亿元，北证50成交额189亿元。", "ctime": 1782453761, "time_str": "14:02:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260626/c677739800.shtml"}, {"id": "4603251", "title": "埃塞俄比亚航空高管：零关税政策令非洲农产品对华出口爆发式增长", "content": "“自2026年5月1日起中国对53个非洲建交国全面实施零关税以来，中非双向贸易扩容，非洲咖啡、鲜花、水果、牛羊肉等特色农产品对华出口爆发式增长。”6月26日，在2026亚洲航空货运博览会期间，Dereje Derero对记者透露，中国出口非洲增速最快的货物品类以跨境电商商品为首，出货量较往年同期增幅超20%。Temu、SHEIN等中国跨境电商平台正在加速拓展非洲市场，带动航空货运需求持续增长。（第一财经）", "ctime": 1782453724, "time_str": "14:02:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260626/c677739793.shtml"}, {"id": "4603091", "title": "有机硅板块震荡上扬，三孚股份、新亚强涨停", "content": "有机硅板块震荡上扬，三孚股份、新亚强涨停，润禾材料涨超10%，锦华新材、东岳硅材、江瀚新材、硅宝科技、回天新材跟涨。", "ctime": 1782453372, "time_str": "13:56:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260626/c677739731.shtml"}, {"id": "4603077", "title": "习近平会见柬埔寨人民党主席、参议院主席洪森", "content": "2026年6月26日上午，中共中央总书记、国家主席习近平在人民大会堂会见柬埔寨人民党主席、参议院主席洪森。\n\n习近平祝贺柬埔寨人民党成立75周年，祝愿柬埔寨人民党领导柬不断开创国家建设和民族振兴事业新局面。习近平表示，去年4月，我对柬埔寨进行国事访问，同柬领导人一道开启构建新时代全天候中柬命运共同体新篇章。一年多来，两国互信持续增强，各领域合作不断深入，中柬传统友好展示新的时代内涵。中方一贯将柬埔寨作为周边外交重点方向，坚定支持柬埔寨维护国家主权和安全、走出符合自身国情的发展道路。中方愿同柬方一道，共守和平、共谋发展、共创繁荣，扎实推进中柬命运共同体建设，为推动构建人类命运共同体树立典范。(外交部网站)", "ctime": 1782453164, "time_str": "13:52:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260626/c677739683.shtml"}, {"id": "4603067", "title": "新易盛成交额达300亿元", "content": "新易盛成交额达300亿元，现跌5.83%。", "ctime": 1782453008, "time_str": "13:50:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260626/c677739649.shtml"}, {"id": "4603035", "title": "印度对涉华热敏纸启动反倾销调查", "content": "据中国贸易救济信息网消息，6月24日，印度商工部发布公告称，应印度国内行业协会Indian Association of Thermal Paper Manufacturers' & Allied Industries提交的申请，对原产于或进口自中国、美国和韩国的热敏纸（Thermal Paper or Thermal Sensitive Paper）启动反倾销调查。本案主要涉及印度海关编码48119093、48119094、48119095、48119096和48119099项下的产品以及48119011项下的部分产品。本案倾销调查期为2025年1月1日至2025年12月31日（12个月），损害调查期为2022年至2023年、2023年至2024年、2024年至2025年以及2025年1月1日至2025年12月31日。(界面)", "ctime": 1782452740, "time_str": "13:45:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260626/c677739558.shtml"}, {"id": "4603029", "title": "亚马逊全球开店推出“拉美速通计划”，要扶持3000个中国品牌深耕拉美", "content": "亚马逊全球开店推出“拉美速通计划”，在2026年内面向3000个中国品牌，提供包括巴西中方控股本土公司注册协助、墨西哥优化RFC税号解决方案、最高12,000美元注册补贴、亚马逊物流费用减免、客户经理全程陪跑等在内的一站式拉美拓展方案，帮助中国品牌跨过拉美经营门槛，深耕墨西哥及巴西。", "ctime": 1782452621, "time_str": "13:43:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260626/c677739520.shtml"}, {"id": "4603005", "title": "商业航天板块再度拉升，中国卫星涨停", "content": "商业航天板块再度拉升，中国卫星涨停，航天动力此前封板，电科蓝天、上海瀚讯、广联航空涨超10%。消息面上，6月24日，中国首艘火箭网系回收船舶“领航者”首次靠泊三亚南山港。该船长144米、满载排水量2.5万吨。2025年12月18日，在海南自贸港启动全岛封关首日，三亚海事局为“领航者”颁发了船舶所有权和国籍证书。此次靠泊由三亚海事局“一船一策”专项保障，标志着海南海上航天回收保障体系进一步完善，为商业火箭回收基础设施提供重要支撑，助力自贸港商业航天产业链闭环构建。", "ctime": 1782452196, "time_str": "13:36:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260626/c677739382.shtml"}, {"id": "4602997", "title": "Anthropic进一步抢占OpenAI市场份额：付费收入和用户持续增长", "content": "美国顶尖人工智能企业OpenAI与Anthropic之间的竞争日益激烈。据一份报告称，Anthropic正在快速抢占OpenAI的付费用户市场份额。信用卡交易分析公司Indagari数据显示，Anthropic旗舰模型Claude付费用户和收入逐月增长，自2026年1月以来，该细分市场的收入增长了约75%。Indagari的数据来自2800万美国消费者的数千亿笔匿名信用卡交易记录，覆盖了2025年至2026年5月10日之间的每周交易。另一个AI在线教育平台DataCamp也给出了类似的结论。其指出，平台上的用户今年对Claude的兴趣呈爆炸式增长，Claude已经成为该网站上搜索量最高的词条，甚至超过了AI。(财联社)", "ctime": 1782452138, "time_str": "13:35:38", "stock_code": "", "stock_name": "", "stock_market": "", ": "4602935", "title": "韩国总统李在明表示，到2030年培育五家价值1万亿韩元的国防创新企业", "content": "韩国总统李在明表示，到2030年培育五家价值1万亿韩元的国防创新企业。(蓝鲸新闻)", "ctime": 1782451534, "time_str": "13:25:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260626/c677739197.shtml"}, {"id": "4602921", "title": "小鹏机器人调整：新设九部门，何小鹏兼任产品部负责人", "content": "为进一步推动机器人业务的发展和量产落地，小鹏集团最近对机器人中心作出了新一轮的组织架构升级和人事任命。记者获悉，小鹏机器人中心新设立九个二级部门。其中，何小鹏宣布亲自兼任机器人中心负责人，目前还兼任机器人中心产品部负责人，直接听取产品部内各组织负责人汇报。另外，何小鹏还直接听取顾捷、刘先明、于涛等部门负责人汇报，后者分别担任具身系统工程部、通用基座部（虚拟）与品牌营销部（代）的负责人。此前何小鹏在内部信中表示，他基本每周有完整的一天“围绕着机器人业务和机器人团队做深入的思考、讨论”。（21世纪经济报道）", "ctime": 1782451413, "time_str": "13:23:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260626/c677739170.shtml"}, {"id": "4602915", "title": "一季度全国市场监管部门完成食品安全监督抽检58.61万批次", "content": "记者今天了解到，2026年一季度，全国市场监管部门坚持问题导向，强化全链条抽检，完成食品安全监督抽检58.61万批次，总体不合格率为1.88%。从食品品种看，粮食加工品，食用油、油脂及其制品，畜禽肉及副产品，肉制品，鲜蛋，乳制品不合格率分别为0.30%、0.48%、0.51%、1.17%、1.53%、0.08%；蔬菜、水果、水产品不合格率分别为4.05%、5.28%、2.80%。从检验项目看，农药残留不合格率3.22%，有机物污染不合格率1.33%，超范围超限量使用食品添加剂不合格率0.86%，微生物污染不合格率0.84%，兽药残留不合格率0.81%，质量指标不合格率0.45%，重金属污染不合格率0.14%。从变化趋势看，水产制品、水产品、鲜蛋等15类食品不合格率与上年同期相比有所降低，特殊膳食食品、豆类、保健食品等24类食品不合格率与上年同期相比有所上升。针对抽检不合格产品，市场监管部门已经及时开展核查处置，严格控制食品安全风险。（央视新闻）", "ctime": 1782451319, "time_str": "13:21:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260626/c677739154.shtml"}, {"id": "4602911", "title": "泽连斯基称已批准新情报行动", "content": "乌克兰总统泽连斯基25日在社交媒体发文称已批准一项为期40天的情报行动，旨在“迫使”俄方结束战事。连续数月以来，乌克兰国家安全局通过使用各类无人机，在乌前线阵地上展现了“最高水平”的作战效能。乌国家安全局下属的“阿尔法”特种作战中心在打击俄军人员及装备方面“处于领先地位”。（新华社）", "ctime": 1782451183, "time_str": "13:19:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260626/c677739128.shtml"}, {"id": "4602909", "title": "半导体材料板块午后持续活跃，有研硅触及20CM涨停" const META     = {"update_time": "2026-06-26 15:06:54", "sentiment_score": 55.25114155251141, "agents": []};

// 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });

  chart.setOption({

    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
