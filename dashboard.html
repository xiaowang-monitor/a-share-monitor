例超40%", "content": "8月24日，阿里巴巴宣布完成800亿港元（约102亿美元）新股配售定价，配售所得款项净额将100%用于投资全栈AI能力，加强AI基础设施建设。据接近交易的消息人士称，本次配售获近3倍超额认购，超2000亿港元。主权和长线基金最终认购比例超40%，反响热烈，订单质量很高。阿里AI投入清晰可见的回报路径，让全球长线资本对此次配售投出信任票。中东、欧洲、亚洲等地区的主要主权基金均积极参与了此次认购。（上证报）", "ctime": 1787552981, "time_str": "14:29:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260824/c679219310.shtml"}, {"id": "5010975", "title": "中国黄金协会赴上海黄金交易所拜访交流", "content": "8月21日上午，中国黄金协会党委书记、副会长严弟勇带队赴上海黄金交易所拜访，与上金所党委副书记、总裁孔燕开展座谈交流。双方紧扣国家金融战略、黄金产业升级与市场稳定大局进行深度交流，进一步凝聚合作共识。(人民财讯)", "ctime": 1787552929, "time_str": "14:28:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260824/c679219294.shtml"}, {"id": "5010965", "title": "韩正会见科威特外交大臣杰拉赫", "content": "8月24日，国家副主席韩正在北京会见科威特外交大臣杰拉赫。 韩正表示，中国和科威特传统友谊深厚。近年来，在习近平主席和米沙勒埃米尔战略引领下，中科关系保持良好发展势头，各领域交流合作不断取得进展。今年是中科建交55周年，中方愿同科方共同落实两国元首重要共识，夯实政治互信，拓展务实合作，密切多边协作，推动中科战略伙伴关系迈上更高水平。中方愿继续劝和促谈，为早日恢复中东地区和平安宁作出努力。 杰拉赫表示，科中关系源远流长，感谢中方长期以来对科宝贵支持。科方坚定恪守一个中国原则，高度赞赏中方在国际和地区事务中发挥的重要作用，愿以两国建交55周年为契机，深化双方各领域合作，不断开辟科中战略伙伴关系新前景。(新华社)", "ctime": 1787552827, "time_str": "14:27:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260824/c679219246.shtml"}, {"id": "5010955", "title": "小米手机：玄戒O3正式发布", "content": "据小米手机微博，玄戒O3正式发布，这是小米为最高端产品打造的「AI旗舰SoC」，安兔兔跑分高达522万分，是首个突破500万分的旗舰SoC。CPU采用十核全大核设计，多核跑分首次突破15000分，性能提升60%。GPU首发G2-UltraNX图形处理器，前所未有的跨代式升级，性能大幅提升85%，功耗降低64%。玄戒O3还是全球首个支持LPDDR6的移动处理器，带宽高达113.8GB/s，相比玄戒O1提升48%。NPU架构全面重构，专为XiaomiMiMo端侧大模型而生，拥有夸张的200TOPS张量算力、3.13TFLOPS向量算力，端侧AI性能大幅提升45%。不仅拥有强大的NPU，玄戒O3更将全模块AllinAI。CPU增加双SME2加速单元、GPU新增8颗NX神经网络加速器、ISP内置AINR单元、DPU内置硬件AI超分辨率单元、ADSP内置AI引擎，不论端侧AI性能、硬件级超分插帧、还是夜景视频降噪，玄戒O3都将全面进化。针对功耗和流畅性，玄戒O3进行大量优化，采用玄戒统一融合总线架构、顶层金属走线等技术，实现行业领先的82ns静态时延表现。", "ctime": 1787552543, "time_str": "14:22:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260824/c679219193.shtml"}, {"id": "5010939", "title": "煤炭开采板块走高 大有能源涨停", "content": "煤炭开采板块走高，大有能源涨停，上海能源此前封板，郑州煤电、辽宁能源、昊华能源、盘江股份、中煤能源等跟涨。", "ctime": 1787552345, "time_str": "14:19:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260824/c679219129.shtml"}, {"id": "5010935", "title": "欧盟批准61亿欧元对乌军援", "content": "欧盟委员会24日批准向乌克兰提供61亿欧元国防援助，用于采购乌克兰急需的导弹防御系统、弹药和雷达。（新华社）", "ctime": 1787552298, "time_str": "14:18:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260824/c679219123.shtml"}, {"id": "5010909", "title": "国务院国资委召开中央企业6G未来产业推进会", "content": "8月20日，国务院国资委召开中央企业6G未来产业推进会。会议强调，推动6G未来产业发展是中央企业落实国家战略部署、履行战略使命的必然要求，中央企业要主动衔接国家、地方、行业规划，加快实现产业发展目标。要补齐技术短板，加强基础理论源头创新，推动关键技术器件底层突破，构建安全稳定的6G产业链供应链。要夯实产业底座，加强创新平台建设、市场主体培育、人才队伍锻造，筑牢6G高质量发展基础。要加快国际合作，构建多元合作体系，全方位提升国际话语权。要孵化场景业态，积极推进6G技术与实体经济融合，全面构筑应用生态先发优势，加快实现6G商业闭环。会前，与会人员参观了中央企业6G未来产业成果展。会上发布了中央企业6G未来产业场景共创任务。国务院国资委有关厅局负责同志、6G未来产业相关31家中央企业负责同志和相关部门负责同志参加会议。（国资小新）", "ctime": 1787551869, "time_str": "14:11:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260824/c679219056.shtml"}, {"id": "5010899", "title": "三预警齐发，三级重大气象灾害应急响应启动", "content": "中央气象台24日10时同时发布台风蓝色预警、暴雨黄色预警和强对流天气蓝色预警。11时50分，中国气象局升级调整重大气象灾害（台风、暴雨）四级应急响应为（台风、暴雨、强对流）三级应急响应。 中央气象台预计，受台风及西南季风影响，24日至26日，福建、广东、广西、海南等地有强降雨，北部湾、台湾海峡、东海等海域及沿海地区风力大。此外，24日，辽宁、吉林等局地有强降雨；25日起，西北地区东部、华北、东北地区自西向东将有明显降雨过程，并伴有强对流天气。 中央气象台同时预计，台风“紫檀”将继续在北部湾海面回旋少动，强度维持或略有增强，25日后将转向东北方向移动，逐渐向广西至广东雷州半岛西侧一带沿海靠近；台风“简拉维”24日12时30分在福建省泉州市沿海登陆，将继续向西北方向移动，强度逐渐减弱；台风“沙德尔”将于26日进入东海，逐渐向我国华东沿海靠近。(新华社)", "ctime": 1787551710, "time_str": "14:08:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260824/c679219022.shtml"}, {"id": "5010889", "title": "辽宁大连发布暴雨橙色预警", "content": "8月24日12时大连市气象台发布暴雨橙色预警信号。预计未来3小时，大连市中山区、西岗区、沙河口区、甘井子区、高新区部分街道将出现30到50毫米的降水。大连市防汛办提醒相关地区、部门要密切监视、果断处置，确保人民群众生命财产安全。请广大市民暂停户外作业，注意内涝引起的道路安全。(央视新闻)", "ctime": 1787551455, "time_str": "14:04:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260824/c679218961.shtml"}, {"id": "5010875", "title": "新版强制国标发布 将提升车用压缩天然气产品质量", "content": "记者了解到，市场监管总局（国家标准委）近日批准发布《车用压缩天然气》强制性国家标准，将自2027年8月1日起实施。本次标准修订旨在提升产品质量、保障使用安全、促进贸易公平。一是技术指标持续健全，新增甲烷值和互换性要求，明确车用压缩天然气的甲烷值应不小于65，与欧洲标准的要求保持一致，当甲烷值小于70时，加气站须在经营场所显著位置向社会公示具体数值。同一地区的车用压缩天然气应能互换使用，确保不同气源的天然气在切换使用时不影响发动机性能和安全性。二是试验方法全面升级，新增或调整了高位发热量、总硫、硫化氢、二氧化碳、氧气、水露点、水含量等项目的检测方法，其中甲烷值计算方法新增丙烷爆震指数法（PKI-MN法）作为仲裁试验方法，与国际标准接轨。三是取样与判定规则不断完善，新增“取样”独立章节，取样点设在车用压缩天然气交接点。判定规则明确检验结果达到全部质量要求视为合格，不符合时应复测。该标准的发布实施将有效规范我国压缩天然气产品质量管控，促进车用压缩天然气行业高质量发展，保障天然气汽车正常运行，持续提升人民群众出行安全水平。（央视新闻）", "ctime": 1787551320, "time_str": "14:02:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260824/c679218939.shtml"}, {"id": "5010831", "title": "朝中社：日本军国主义野心严重挑战世界和平与安全", "content": "朝中社24日发表评论文章说，在战败投降日之际，在日本再次上演集体参拜靖国神社的闹剧，首相高市早苗还遥拜了神社，这一严重动向是对人类企盼的世界和平与安全的重大挑战。 文章说，高市上台后，日本政府频繁做出极其危险的军事动向，此次“远距离参拜”凸显了高市的军国主义野心。在遥拜后举行的“全国战殁者追悼仪式”上，高市闭口不提“反省”，为摆脱20世纪日本给亚洲诸国人民造成不可估量的不幸和痛苦的侵略战争责任，狡猾地玩起了语言游戏。 文章还说，日本防卫大臣再次参拜靖国神社，也清楚地表明此次“拜鬼”的危险性质。 文章最后警告说，日本刻意回避战败国家历史，不吸取教训，必将重演其历史。日本在战败投降日之际掀起新军国主义狂风，将给其国家和民众带来灾难。(新华社)", "ctime": 1787550831, "time_str": "13:53:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260824/c679218807.shtml"}, {"id": "5010829", "title": "富时中国A50指数期货跌2%", "content": "富时中国A50指数期货跌幅扩大至2%。", "ctime": 1787550766, "time_str": "13:52:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260824/c679218800.shtml"}, {"id": "5010819", "title": "CPO概念持续下挫 “易中天”均跌近10%", "content": "午后CPO概念持续下挫，中际旭创跌近10%，总市值跌破1万亿，天孚通信跌超11%，新易盛跌超9%。", "ctime": 1787550684, "time_str": "13:51:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260824/c679218775.shtml"}, {"id": "5010813", "title": "报告显示福岛核电站人员受辐射量远超日本其他核电站", "content": "据日本方面24日消息，2025财年东京电力公司福岛第一核电站作业人员的受辐射量明显高于其他核电站。这意味着在核泄漏事故15年后，影响仍在持续。消息援引日本各电力公司向日本原子能规制委员会提交的报告书称，福岛第一核电站作业人员累计受辐射量在日本所有核电站中居于首位，高达20.97人·希沃特，而排在第二位的关西电力公司高滨核电站只有2.22人·希沃特。福岛第一核电站是第二名的9倍多。“人·希沃特”评估单次作业的总体影响。人·希沃特是集体剂量的单位，表示受照群体中以人数加权后的个体剂量的总和。它可用于估计一次作业或事故造成的总体健康影响。（央视新闻）", "ctime": 1787550596, "time_str": "13:49:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260824/c679218741.shtml"}, {"id": "5010801", "title": "台风“简拉维”已在福建泉州沿海登陆", "content": "据福建省气象台消息，今年第20号台风“简拉维”24日11时由热带低压加强为热带风暴级，其中心已于12时30分在福建泉州台商投资区张坂镇沿海登陆，登陆时中心附近最大风力8级（18米/秒），中心最低气压998百帕。登陆后，“简拉维”将继续向西北方向移动，强度逐渐减弱。（新华社）", "ctime": 1787550453, "time_str": "13:47:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260824/c679218644.shtml"}, {"id": "5010787", "title": "俄罗斯成功发射“联盟-2.1b”运载火箭", "content": "当地时间8月24日，俄罗斯国防部通报，莫斯科时间24日5时40分，俄空天军太空部队在阿尔汉格尔斯克州的国家测试航天发射场，即普列谢茨克发射场成功实施了一次“联盟-2.1b”中型运载火箭的发射，火箭搭载了俄国防部所需的航天器。（央视新闻）", "ctime": 1787549947, "time_str": "13:39:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260824/c679218489.shtml"}, {"id": "5010785", "title": "贵州国资成立产业并购股权投资基金", "content": "企查查APP显示，近日，贵州省金合产业并购股权投资基金合伙企业（有限合伙）成立，经营范围包含：以私募基金从事股权投资、投资管理、资产管理等活动。企查查股权穿透显示，该企业由贵州省贵鑫瑞和创业投资管理有限责任公司、贵州省国有资本运营有限责任公司共同出资。（人民财讯）", "ctime": 1787549882, "time_str": "13:38:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url" function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
