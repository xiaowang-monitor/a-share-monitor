<style>

}

.badge {

.badge-s { background: rgba(239,68,68,0.2); color: #ef4444; }

.score-bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s; }
.up { color: var(--red); }
.down { color: var(--green); }
.pulse { animation: pulse 2s infinite; }
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}
.glow { box-shadow: 0 0 20px rgba(59,130,246,0.15); }

频道全面清除虚假宣传医药广告", "content": "针对广播电视医药广告一度存在的虚假宣传、夸张夸大、用疗效作证明、宣传治愈率有效率等损害人民群众权益问题，国家广播电视总局自2025年8月起在全国范围内开展集中整治，会同省级广电行政部门制定专门工作方案，采取投诉受理、监测排查、研判认定、督促整改等措施，加大处置力度，加强协同治理，确保对违规广告及时发现、准确识别、有效处理。截至今年3月底，全国电视频道已经全面清除虚假宣传医药广告。（国家广播电视总局）", "ctime": 1775714700, "time_str": "14:05:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260409/c675860792.shtml"}, {"id": "4204343", "title": "港股汽车股午后持续回落，小鹏集团跌超5%", "content": "港股汽车股午后持续回落，小鹏集团-W跌超5%，比亚迪股份跌超4%，赛力斯、理想汽车-W等跟跌。", "ctime": 1775714651, "time_str": "14:04:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260409/c675860781.shtml"}, {"id": "4204325", "title": "对非零关税举措为中国与津巴布韦农业合作带来新机遇", "content": "随着中国对53个非洲建交国全面实施零关税举措日期临近，越来越多中国企业来到津巴布韦开拓商机。津巴布韦政府与中国农产品采购商对接会8日在该国马尼卡兰省举行，津农业官员、农户代表和中国采购商达成多项合作意向。 津贸促会首席执行官艾伦·马朱鲁在活动现场说，近年来，津巴布韦牛油果、蓝莓、夏威夷果等农产品因其优良品质在中国市场受到欢迎，津巴布韦正完善各项措施以利用零关税举措进一步扩大农产品输华。 马朱鲁说：“我相信强劲的津中贸易关系会增强中国采购商的信心，期待中国贸易商加强与我们的合作，共同迎来更多增长机遇。” 中国采购商领队王南告诉记者，中国企业看好津巴布韦等非洲国家农产品出口潜力。“我们随行的企业和津巴布韦辣椒生产商计划签署合作备忘录，此次预计会有5000吨的采购量。” 中国驻津巴布韦大使馆经商参赞黄名海表示，中国零关税政策将进一步扩大津巴布韦农产品对华出口，推动津从出口初级农产品向高附加值农产品转型。该政策将促进津巴布韦进一步丰富出口结构，持续提升经济稳定性和抗风险能力。 中方将于5月1日起对53个非洲建交国全面实施零关税举措，同时继续推动商签共同发展经济伙伴关系协定，并通过升级“绿色通道”等进一步扩大非洲输华产品准入。(新华社)", "ctime": 1775714565, "time_str": "14:02:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260409/c675860750.shtml"}, {"id": "4204279", "title": "伊朗军方发言人称击落敌方一架先进战斗机", "content": "据伊朗学生通讯社9日报道，伊朗军方发言人称伊朗“击落了敌方所有先进战斗机中的至少一架”。报道没有具体说明何时何地击落该战机，也没有说明“敌方”是以色列还是美国。 (新华社)", "ctime": 1775714469, "time_str": "14:01:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260409/c675860727.shtml"}, {"id": "4204199", "title": "机构预估2026年中国人形机器人市场产量将年增94%", "content": "根据TrendForce集邦咨询最新人形机器人深度研究报告，2026下半年全球人形机器人产业将进入商业化的关键期。其中，中国厂商锁定的商用化目标与场景逐渐明确，并积极提升产量，预估将激励2026全年中国人形机器人市场产量年增高达94%。宇树科技、智元机器人凭借盈利能力与量产进度，在激烈竞争中脱颖而出，预估两者合计将囊括近80%的出货占比。TrendForce集邦咨询表示，过去多数人形机器人厂商专注在感知、动态平衡与语意理解等底层能力的累积，至2026下半年焦点将转向提供给用户的真实价值。观察全球最大的中国市场，产业以多元商用发展为主轴，正呈现产品应用收敛、通用机器人的大型语言模型(LLM)深度整合，以及投资热潮延续等趋势。(集邦咨询)", "ctime": 1775714404, "time_str": "14:00:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260409/c675860712.shtml"}, {"id": "4204193", "title": "南向资金净买入超50亿港元", "content": "据同花顺iFinD数据，截至目前，南向资金净买入超50亿港元，其中港股通（沪）买入超40.98亿港元，港股通（深）买入超9.40亿港元。", "ctime": 1775714195, "time_str": "13:56:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260409/c675860687.shtml"}, {"id": "4204185", "title": "华为云计划6月发布AI全系产品", "content": "华为云将发布AI全系产品。在基础设施层面，华为云将推出AI Infra分布式AI云基础设施，并同步升级一站式AI训推平台能力；华为云还计划发布行业智能体开发平台，并发布多款自研“龙虾”系列产品。此外，面向具身智能等新兴方向，其一站式具身智能开发平台新品也有望同步亮相。（科创板日报）", "ctime": 1775713932, "time_str": "13:52:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260409/c675860620.shtml"}, {"id": "4204175", "title": "松延动力增资至约409万", "content": "天眼查工商信息显示，近日，北京松延动力科技集团股份有限公司发生工商变更，注册资本由约324.6万人民币增至约409万人民币，增幅约26%。 该公司成立于2023年9月，法定代表人为姜哲源，经营范围包括工业机器人销售、智能机器人的研发、智能机器人销售等。股东信息显示，该公司由姜哲源、张世璞、北京机器人产业发展投资基金（有限合伙）等共同持股。变更记录显示，去年2月以来，该公司已多次增资。(蓝鲸新闻)", "ctime": 1775713601, "time_str": "13:46:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260409/c675860525.shtml"}, {"id": "4204169", "title": "沪深京三市成交额超1.7万亿元，较上日此时缩量2078亿元", "content": "据同花顺iFinD数据，沪深京三市成交额超1.7万亿元，较上日此时缩量2078亿元，预计全天成交金额约2.2万亿元。截至目前，沪市成交额7139亿元，深市成交额9759亿元，北证50成交额105亿元。", "ctime": 1775713513, "time_str": "13:45:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.1 昨日芝商所黄金、白银、铜期货成交量增加，未平仓合约数量增加", "content": "昨日芝商所黄金、白银、铜期货成交量增加，未平仓合约数量增加，市场交易情况相对前一日转好。黄金期货成交量为240591手，较上个交易日增加84812手。未平仓合约为375326手，较上个交易日增加20449手。白银期货成交量为80955手，较上个交易日增加30558手。未平仓合约为121693手，较上个交易日增加6555手。铜期货成交量为124592手，较上个交易日增加73662手。未平仓合约为234636手，较上个交易日增加10002手。", "ctime": 1775712739, "time_str": "13:32:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260409/c675860009.shtml"}, {"id": "4204105", "title": "国际航协：航油价格翻倍航空业承压 全球多家航司削减航班", "content": "国际航空运输协会理事长威利·沃尔什8日警告说，全球航空燃油供应要想恢复至正常水平仍需要数月的时间。航空燃油价格通常与原油价格同步波动，但本轮中东冲突爆发后，航油供应持续紧张，叠加区域炼油设施受损，航空燃油价格的同期涨幅已显著高于原油。近期全球多家航空公司纷纷削减航班，在起飞机场运载额外燃油并增设经停加油点，这让本就因航油价格翻倍而承压的航空业面临更大压力。（央视财经）", "ctime": 1775712702, "time_str": "13:31:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260409/c675859998.shtml"}, {"id": "4204093", "title": "巴西总统呼吁加强国防力量并设公共安全部", "content": "巴西总统卢拉8日接受采访时表示，巴西必须加强国防力量以应对美国威胁。他说，巴西将推动一项宪法修正案，并设立公共安全部和国民警卫队。卢拉在采访中表示，美国已获准在巴拉圭“设立军事基地”，巴西不能毫无防备，必须更严肃地思考安全问题。巴西有漫长的边境线，稀土、矿产、森林和石油资源丰富。巴西政府需要加强国防工业，并重新审视安全政策。（央视新闻）", "ctime": 1775712663, "time_str": "13:31:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260409/c675859979.shtml"}, {"id": "4204075", "title": "龙磁科技：碳酸锶价格出现大幅上涨 公司已进行战略性集中采购", "content": "龙磁科技近日接受机构调研时表示，公司磁瓦生产所需的主要原料为铁红和碳酸锶。铁红是钢厂生产过程中的副产品，我国是钢铁生产大国，铁红供应相对充足，价格波动幅度较小。碳酸锶也是铁氧体永磁生产的重要原料，伊朗是全球高品位天青石矿（锶矿）储量最高的国家，国内天青石矿储量虽高，但整体品位低、开采成本高，因此进口依赖度较大。受美伊冲突影响，碳酸锶价格出现大幅上涨。公司一直对原料安全库存做动态储备，对碳酸锶进行战略性集中采购，这也是上年末原材料存货账面价值较高的主要原因，为我们赢得了宝贵的缓冲期，预计在未来一段时间内，对公司的永磁原料供应及成本影响较小。但若冲突长期持续，碳酸锶供应紧缺，将可能对整个永磁铁氧体行业的稳定生产和订单交付构成压力。我们始终保持与供应商及客户的紧密沟通与协同，积极评估和布局多元化的供应渠道，以保障供应链的长期安全与韧性。（人民财讯）", "ctime": 1775712404, "time_str": "13:26:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260409/c675859807.shtml"}, {"id": "4204065", "title": "伊朗驻巴基斯坦大使：伊朗代表团9日晚抵达伊斯兰堡", "content": "伊朗驻巴基斯坦大使穆加达姆9日在社交媒体上发文说，尽管以色列方面屡次违反停火协议，但应巴基斯坦总理夏巴兹邀请，伊朗代表团将于9日晚抵达伊斯兰堡，就伊朗方面提出的10项停战条款展开严肃对话。(新华社)", "ctime": 1775712237, "time_str": "13:23:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260409/c675859718.shtml"}, {"id": "4204053", "title": "巴基斯坦强烈谴责以色列对黎巴嫩持续军事行动", "content": "总台记者获悉，巴基斯坦外交部4月9日发文称，巴基斯坦以最强烈措辞谴责“以色列当前对黎巴嫩持续进行的侵略”，这些行为已造成无辜平民伤亡，并对基础设施造成广泛破坏。巴外交部称，以色列的行为破坏了国际社会为实现地区和平与稳定所作的努力，公然违反国际法和基本人道主义原则。巴基斯坦呼吁国际社会采取紧急且切实的措施，制止以色列针对黎巴嫩的侵略行径。巴基斯坦重申，在这一困难时期，将坚定不移地与黎巴嫩政府和人民站在一起，支持黎巴嫩的主权和领土完整，以及其和平与稳定。（央视新闻）", "ctime": 1775712070, "time_str": "13:21:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260409/c675859628.shtml"}, {"id": "4204029", "title": "伊朗副议长说伊朗损失必须得到赔偿", "content": "当地时间4月8日，伊朗伊斯兰议会副议长阿里·尼克扎德在接受媒体采访时说，要达成停火协议，美军必须撤离，伊朗必须掌握霍尔木兹海峡目前和未来的通行权，必须解除主要制裁，伊朗的损失必须得到赔偿。(CCTV国际时讯)", "ctime": 1775711698, "time_str": "13:14:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260409/c675859446.shtml"}, {"id": "4204021", "title": "上证50股指期货(IH)主力合约日内跌超1%", "content": "上证50股指期货(IH)主力合约日内跌超1%，现报2854.0点。沪深300股指期货(IF)主力合约日内跌超1%，现报4486.6点。", "ctime": 1775711638, "time_str": "13:13:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260409/c675859414.shtml"}, {"id": "4204013", "title": "古特雷斯谴责以色列对黎巴嫩全境发动大规模袭击", "content": "联合国秘书长古特雷斯的发言人迪雅里克8日发表声明说，古特雷斯谴责以色列当天对黎巴嫩全境发动大规模袭击。这些袭击导致包括儿童在内的逾千名平民伤亡，并对民用基础设施造成破坏。 声明说，古特雷斯强烈谴责袭击造成平民死亡，并对平民伤亡人数不断攀升深感震惊。古特雷斯向黎巴嫩政府和人民致以最深切的慰问，并祝愿伤者早日康复。古特雷斯再次呼吁各方立即停止敌对行动。 声明强调，任何时候都必须遵守包括国际人道法在内的国际法，平民及民用设施在任何时候都必须受到保护。针对平民及民用设施的袭击“不可接受”。冲突没有军事解决方案。秘书长呼吁各方利用外交渠道，重新致力于全面执行联合国安理会第1701号决议。 伊朗与美国停火后，以色列8日大规模空袭黎巴嫩。据黎巴嫩民防部门报告，空袭已造成至少254人死亡、1165人受伤。黎巴嫩总理纳瓦夫·萨拉姆宣布，4月9日为全国哀悼日，悼念空袭中遇难的无辜平民。(新华社)", "ctime": 1775711517, "time_str": "13:11:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260409/c675859377.shtml"}, {"id": "4204007", "title": "美媒称8日仅有4艘船只获准通过霍尔木兹海峡", "content": "据美国《华尔街日报》8日报道，美国和伊朗宣布停火后，8日仅有4艘船只通过霍尔木兹海峡。 《华尔街日报》援引标普全球市场财智公司的数据报道说，8日仅有4艘船获准通过霍尔木兹海峡，是4月份以来最少的一天。而在伊朗战事开始以前，每天有超过100艘船通过霍尔木兹海峡。 报道称，在等待通过霍尔木兹海峡的船只中，有超过425艘油轮及近20艘装载液化天然气的船只。伊朗方面对调解方说，伊朗将每天通过海峡的船只数量限制在12艘左右。伊方警告停靠在霍尔木兹海峡附近的船只必须得到伊朗许可才能通过。 另据伊朗法尔斯通讯社8日报道，在以色列袭击黎巴嫩之后，伊朗暂停了霍尔木兹海峡的油轮通行。报道说，在美伊达成停火后，有2艘油轮获得伊朗许可，当天上午得以安全通过霍尔木兹海峡。(新华社)", "ctime": 1775711464, "time_str": "13:11:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260409/c675859353.shtml"}, {"id": "4203995", "title": "煤化工板块短线拉升，诚志股份涨停", "content": "煤化工板块短线拉升，诚志股份涨停，金牛化工、金煤科技、鲁西化工、宝丰能源、华谊集团等跟涨。", "ctime": 1775711371, "time_str": "13:09:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260409/c675859321.shtml"}, {"id": "4203993", "title": "油脂市场受原油暴跌影响震荡偏弱", "content": "昨日CBOT豆油市场大幅下挫，受到原油暴跌的拖累。昨日马来西亚棕榈油市场触及两周低点，生柴需求炒作降温，棕榈油跟随原油大幅下跌。原油自高位急跌将削弱棕榈油生柴需求炒作预期，并增加印尼B50计划落地的不确定性，棕榈油带领油脂板块进入回吐此前风险溢价阶段。受国际原油大跌及外盘豆油走弱拖累，虽国内豆油库存偏低、油厂开机不高对现货有支撑，但下游拿货观望、成交清淡，预计近期油脂震荡偏弱，价格走势仍受原油及外盘影响明显。（饲料行业信息网）", "ctime": 1775711361, "time_str": "13:09:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260409/c675859317.shtml"}, {"id": "4203983", "title": "沪深京三市成交额超1.5万亿元，较上日此时缩量1343亿元", "content": "据同花顺iFinD数据，沪深京三市成交额超1.5万亿元，较上日此时缩量1343亿元，预计全天成交金额约2.2万亿元。截至目前，沪市成交额6292亿元，深市成交额8618亿元，北证50成交额95亿元。", "ctime": 1775711304, "time_str": "13:08:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260409/c675859303.shtml"}, {" // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

  const container = document.getElementById('hot7-list');

        <p class="text-xs text-gray-500 mono">${item.symbol}</p>

    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
