。该计划提到，未来五年防卫预算的重点是大规模采购无人机，以及为应对长期战争储备弹药和导弹。日本防卫省此前曾估算，如果根据其认为必要的装备和防卫体制进行简单测算，所需经费将达到70万亿至80万亿日元。据美国方面13日消息，知情人士透露，日本财务省官员曾提议，将未来五年防卫预算开支控制在50万亿至60万亿日元之间。(央视新闻)", "ctime": 1794582776, "time_str": "23:12:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261113/c681820364.shtml"}, {"id": "5665145", "title": "国标发布 流程工业智能工厂管理有了统一“标尺”", "content": "记者11月13日了解到，市场监管总局（国家标准委）批准发布《智能制造 流程工业智能工厂业务管理规范》国家标准，将自2027年5月1日起正式实施。流程工业是支撑国民经济发展的基础性产业，涵盖石油化工、钢铁、制药、建材等领域，具备生产连续化、工艺耦合度高、安全风险较高等特点。此次发布的标准立足流程工业特点，对智能工厂主要业务活动提出系统性要求。(新华社)", "ctime": 1794582746, "time_str": "23:12:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261113/c681820363.shtml"}, {"id": "5665131", "title": "OpenAI推出ChatGPT Wallet 支持智能体代理支付", "content": "OpenAI推出ChatGPT Wallet，允许用户保存银行卡，并授权旗下智能体代表用户完成购物、酒店预订等交易。用户在支付前需审核并批准每笔交易，系统通过生成支付令牌替代真实银行卡信息，以降低支付信息泄露风险。目前该功能面向美国Pro用户开放，支持符合条件的美国发行信用卡，用户需年满18岁，并通过生物识别验证批准交易。(财联社)", "ctime": 1794582567, "time_str": "23:09:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261113/c681820333.shtml"}, {"id": "5665103", "title": "美股半导体板块集体走低 费城半导体指数跌4.3%", "content": "美股半导体板块盘中普遍下跌，费城半导体指数跌4.29%。成分股方面，AMD跌8.35%，闪迪跌7.28%，Coherent跌7.00%，迈威尔科技跌6.25%，Lumentum跌6.05%，应用材料跌5.09%，博通跌5.19%，英伟达跌2.46%，台积电跌1.92%，美光科技跌4.18%。三倍做多半导体ETF-Direxion跌13.63%。(财联社)", "ctime": 1794582374, "time_str": "23:06:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261113/c681820325.shtml"}, {"id": "5665091", "title": "2025年上海自贸区文物艺术品进出境货值超60亿元", "content": "11月13日，记者从在上海东方枢纽国际商务合作区举办的第十一届“上海对话”活动中获悉，2025年上海自贸区文物艺术品进出境货值60.19亿元，稳居全国领先地位。据悉，本次活动由上海外高桥集团股份有限公司、上海自贸区国际文化投资发展有限公司主办。活动现场，《Artprice当代艺术市场2026报告》《中拍协2025中国文物艺术品拍卖市场统计年报》《雅昌指数：2026年上半年艺术市场报告》等多份行业重磅指数同步首发，《2026上海自贸区文化产业蓝皮书》集中展示了上海自贸区在文化艺术品领域不断创新的实践成果。中国嘉德、北京保利、永乐、华艺、朵云轩、西泠印社等15家行业头部企业分享了2026年度良好案例，中国拍卖行业协会同步发布文物艺术品拍卖企业自律公约2026年成员名单。(上海证券报)", "ctime": 1794582339, "time_str": "23:05:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261113/c681820324.shtml"}, {"id": "5665085", "title": "OpenAI：ChatGPT钱包初期将通过Dots面向美国ChatGPT Pro订阅用户开放", "content": "OpenAI表示，ChatGPT钱包初期将通过Dots面向美国ChatGPT Pro订阅用户开放。（新浪财经）", "ctime": 1794582295, "time_str": "23:04:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261113/c681820314.shtml"}, {"id": "5665079", "title": "OpenAI：ChatGPT钱包由OpenAI与美国运通、万事达和Visa合作打造", "content": "OpenAI表示，ChatGPT钱包由OpenAI与美国运通、万事达和Visa合作打造。（新浪财经）", "ctime": 1794582268, "time_str": "23:04:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261113/c681820310.shtml"}, {"id": "5665075", "title": "美联储古尔斯比：通胀已超出能源范畴，美联储尚未走在回2%的路上", "content": "芝加哥联储主席古尔斯比表示，即使油价迅速下跌，炼油能力依然“存在问题”，这将使柴油和航空燃油价格维持高位。他表示，通胀目前正向那些价格并非由能源成本上涨驱动的类别蔓延，如果需求过热，美联储就无法对通胀视而不见。古尔斯比认为数据中心正在推高物价，而服务通胀和不断上涨的医疗成本给人的感觉绝对是短期内不会迅速回落。古尔斯比补充说，目前美联储并未走在实现2%通胀目标的轨道上，央行需要应对这一问题以确保需求不会过热；如果数据表明通胀正在恶化，这将促使美联储在政策上采取更激进的行动。", "ctime": 1794582223, "time_str": "23:03:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261113/c681820308.shtml"}, {"id": "5665053", "title": "全链条打击盗版周边 米哈游多措并举维权取得阶段性成果", "content": "11月13日，记者从米哈游获悉，米哈游“打击游戏盗版周边专项行动”再获阶段性成果。截至目前，涉案产品品类覆盖十余种，累计涉案金额超4000万元。公司通过刑事、行政、民事等多种手段持续打出维权“组合拳”，全链条遏制盗版周边在多渠道蔓延。(上海证券报)", "ctime": 1794582149, "time_str": "23:02:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261113/c681820302.shtml"}, {"id": "5665019", "title": "期市夜盘收盘，国内期货主力合约多数上涨", "content": "期市夜盘收盘，国内期货主力合约多数上涨。涨幅方面， 113/c681820095.shtml"}, {"id": "5664627", "title": "DeepSeek 发布全家桶应用 API", "content": "DeepSeek宣布：在 DeepSeek App（含网页端）的对话服务中，联网搜索、文件输入、阅读链接、语音交互及安全等能力与模型推理相互配合，构成了用户熟悉的对话体验。而开发者如果想要在应用中实现类似功能，除接入原有 DeepSeek API 外，往往还需耗费大量精力去对接外部工具、处理调用衔接。 今天，我们正式开放这套全家桶应用 API：在原有 API 中开启对应参数，即可获得深度思考搜索、文件输入等对话功能；语音及相关底层能力也已开放独立接口（含 OCR、ASR、TTS 等），支持单独或组合调用。开发者可以在自己的应用中轻松实现复杂的对话功能，甚至 1:1 复刻出完整的 DeepSeek App。", "ctime": 1794580091, "time_str": "22:28:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261113/c681820074.shtml"}, {"id": "5664613", "title": "李强同泰国总理阿努廷会谈", "content": "11月13日下午，国务院总理李强在曼谷同泰国总理阿努廷举行会谈。李强表示，今年7月，阿努廷总理对中国进行正式访问，习近平主席同你举行会晤，共同规划中泰关系发展。我这次访泰，两国总理在四个月内实现互访，充分彰显双边关系的高水平。当前，中泰都处在国家建设发展的重要时期。中方坚定支持泰国政府顺利施政，愿同泰方进一步夯实政治互信基础，支持彼此核心利益和重大关切，用好外长和防长“2+2”战略对话、经贸联委会等机制，深挖各领域合作潜力，取得更多实际成果，更好惠及两国人民。（新华社）", "ctime": 1794580019, "time_str": "22:26:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261113/c681820056.shtml"}, {"id": "5664531", "title": "Sportradar Group美股盘前跌超10%", "content": "Sportradar Group美股盘前跌超10%，现报11.5美元。", "ctime": 1794579312, "time_str": "22:15:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261113/c681819981.shtml"}, {"id": "5664505", "title": "COMEX白银期货跌超1%", "content": "COMEX白银期货跌超1%，现报49.47美元/盎司。", "ctime": 1794579040, "time_str": "22:10:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261113/c681819961.shtml"}, {"id": "5664421", "title": "波兰华沙肖邦国际机场一架客机因无人机干扰中止降落", "content": "当地时间13日，波兰华沙肖邦国际机场一架从布拉格飞往华沙的波兰航空公司客机因无人机干扰中止降落。客机在较低高度发现无人机出现在进近航线上，机组增加推力复飞，在华沙上空盘旋约十几分钟后再次尝试降落并安全着陆。机场发言人鲁兹基证实事件发生，称中止降落属标准程序，机场运行安全未受影响。波兰对华沙周边空域实施特殊限制，操作无人机需获许可；若导致航空运输直接灾难危险，责任人最高可能面临5年监禁。（央视新闻）", "ctime": 1794578638, "time_str": "22:03:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261113/c681819912.shtml"}, {"id": "5664297", "title": "王毅同韩国外长赵显会谈", "content": "2026年11月13日，中共中央政治局委员、外交部长王毅在北京同韩国外交部长赵显举行会谈。王毅表示，去年底以来，习近平主席同李在明总统成功互访，推动中韩关系重回改善发展的正确轨道，今年两国贸易额再创新高，人员往来将达到千万人次。明年将迎来两国建交35周年，双方应以此为契机，共同推动中韩战略合作伙伴关系沿着正确道路向前发展。王毅说，中韩是搬不走的近邻，保持睦邻友好是彼此的正确选择。双方坚持与邻为善、以邻为伴，保持各层级沟通对话，深化各领域务实合作，给两国人民带来福祉，也促进了地区和平与发展。中方始终重视中韩关系，愿同韩方进一步增进互信，在传统合作基础上，拓展人工智能、生物医药、绿色低碳、银发经济等新兴领域合作，培育经济增长新引擎，不断做大共同利益。王毅表示，亚太地区是中韩人民的共同家园。APEC领导人非正式会议即将在深圳举行，包括李在明总统在内的各经济体领导人已确认与会。中方迄今为APEC“中国年”举办了300多场活动，赞赏韩方参与其中所作的努力，愿同韩方携手推进亚太共同体建设，促进地区共同发展、共同繁荣。韩方去年成功举办APEC会议，相信也会为APEC深圳会议作出贡献，双方的相互支持将为两国关系注入新的内涵和动力。（外交部网站）", "ctime": 1794578403, "time_str": "22:00:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261113/c681819867.shtml"}, {"id": "5664269", "title": "LME镍主力合约跌超1%", "content": "LME镍主力合约跌超1%，现报16030.0美元/吨。", "ctime": 1794578237, "time_str": "21:57:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261113/c681819843.shtml"}, {"id": "5664265", "title": "韩国考虑拨专款打击AI作弊行为", "content": "韩国正考虑采取措施防范国家资格考试中考生利用AI眼镜等高科技设备作弊。在野党议员金渭相提议，2027年度预算增加约65.7亿韩元，采购无线电信号探测设备并安排专职人员。韩国产业人力公团估算需36亿韩元采购7200台探测设备、29.7亿韩元安排23559名专职人员，方案尚需国会审议。截至10月底，今年国家资格考试已查获6起智能眼镜作弊案件。高考将于19日举行，教育部已将AI眼镜列入禁带物品清单，1312个考点将配备至少1名识别AI眼镜的监考人员，作弊者可能面临多至3年禁考及刑事责任。（新华社）", "ctime": 1794578229, "time_str": "21:57:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261113/c681819841.shtml"}, {"id": "5664231", "title": "美国微软公司多款应用出现大范围故障", "content": "据外媒12日报道，微软365多项服务当日发生大范围故障，波及Outlook、人工智能助手“智能副驾驶”等，影响多国政府机构、企业和个人用户。故障从美国东部时间12日中午前后开始，美国“网络探测器”网站数据显示，北京时间13日2时刚过时已有近13万名用户报告无法访问Outlook，数以千计用户报告Teams、“智能副驾驶”等故障。微软称未发现恶意活动，称部分基础设施“负载升高”可能是原因，正调整流量协议、重新分配流量及实施策略 // 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
