}
.score-bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s; }
.up { color: var(--red); }
.down { color: var(--green); }
.pulse { animation: pulse 2s infinite; }
@keyframes pulse {

  50% { opacity: 0.5; }

 "4973159", "title": "启明星辰：公司目前尚未与英伟达开展合作", "content": "启明星辰8月18日在互动平台表示，公司目前尚未与英伟达开展合作。", "ctime": 1787024968, "time_str": "11:49:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260818/c679039119.shtml"}, {"id": "4973157", "title": "国联股份在内蒙古成立智算科技公司", "content": "企查查APP显示，近日，内蒙古呼云智算科技有限公司成立，法定代表人为魏力强，注册资本为1亿元，经营范围包含：互联网数据服务；人工智能硬件销售；人工智能通用应用系统；人工智能基础软件开发；5G通信技术服务等。企查查股权穿透显示，该公司由国联股份控股的北京智算多多科技有限公司全资持股。", "ctime": 1787024947, "time_str": "11:49:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260818/c679039112.shtml"}, {"id": "4973143", "title": "四部门发布《关于加强医院法治建设的意见》", "content": "国家卫生健康委、教育部、国家中医药局、国家疾控局今天联合印发《关于加强医院法治建设的意见》。《意见》指出，当前，医院法治体系还比较薄弱，部分医院存在法治思维不足、法律风险防范机制不完善等明显短板弱项，急需改进提升。《意见》坚决贯彻落实《中国共产党领导全面依法治国工作条例》要求，将党对医院法治建设的领导、树立预防性法治理念、提升人民群众卫生健康法治获得感作为重点，突出问题导向，确定医院法治建设的目的，明晰医院法治建设的主体责任和监督责任，对医院法治建设总体工作作出部署安排。（央视新闻）", "ctime": 1787024636, "time_str": "11:43:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260818/c679039050.shtml"}, {"id": "4973113", "title": "深圳市与中国电信签署战略合作框架协议", "content": "8月18日，深圳市人民政府与中国电信集团有限公司签署战略合作框架协议。根据协议，双方将在新型基础设施建设、人工智能、卫星通信、城市数字化治理等领域开展深度合作。当天，现场还见证了深圳市机场（集团）有限公司与中国电信集团投资有限公司签署合作备忘录。（深视新闻）", "ctime": 1787024086, "time_str": "11:34:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260818/c679038846.shtml"}, {"id": "4973111", "title": "北京：1-7月，全市市场总消费额同比增长1.8%", "content": "据北京市统计局消息，1-7月，全市房地产开发投资同比下降11.6%，房屋施工面积9356.9万平方米，下降6.3%，其中住宅施工面积4684.9万平方米，下降5.3%。全市商品房销售面积609.1万平方米，同比增长1.4%，其中，住宅销售面积447.7万平方米，增长14.9%，保障性住宅是主要带动因素。1-7月，全市市场总消费额同比增长1.8%。其中，服务性消费额增长4.6%，信息、交通、体育等领域较快增长；实现社会消费品零售总额7517.5亿元，下降2%，降幅比上半年收窄0.2个百分点。社会消费品零售总额中，按消费形态分，商品零售6776.6亿元，下降2.3%；餐饮收入740.9亿元，增长0.6%。", "ctime": 1787024068, "time_st 袭的影响，粮食概念板块大涨，金健米业、农发种业、京粮控股、黑芝麻等股涨停，秋乐种业一度30cm涨停，康农种业、神农种业、大北农涨幅居前。猪肉板块表现活跃，天邦食品、罗牛山涨停，大禹生物、傲农生物、新希望涨幅居前。油气开采及服务板块高开震荡，海油工程、科力股份、石化油服涨幅居前。算力租赁板块低开低走，鸿博股份、行云科技、汇金股份跌幅居前。软件开发板块亦走势疲软，大恒科技、迪普科技、绿盟科技领跌。", "ctime": 1787023856, "time_str": "11:30:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260818/c679038791.shtml"}, {"id": "4973087", "title": "日经225指数跌幅扩大至2%", "content": "日经225指数跌幅扩大至2%，现报67802.54点。", "ctime": 1787023851, "time_str": "11:30:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260818/c679038789.shtml"}, {"id": "4973085", "title": "股指期货早盘收盘 主力合约全线下跌", "content": "股指期货早盘收盘，主力合约全线下跌。沪深300股指期货(IF)主力合约跌1.02%，上证50股指期货(IH)主力合约跌0.85%，中证500股指期货(IC)主力合约跌1.20%，中证1000股指期货(IM)主力合约跌1.17%。", "ctime": 1787023844, "time_str": "11:30:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260818/c679038788.shtml"}, {"id": "4973069", "title": "四川：支持成都大力提升国际物流服务能力和水平", "content": "四川省人民政府办公厅近日印发《关于加快推进通道网、物流网、数联网“三网”融合的实施意见》，意见提出，构建高效韧性现代物流服务网络。支持成都大力提升国际物流服务能力和水平，建强国家物流枢纽、国家骨干冷链物流基地、深入实施国家综合货运枢纽补链强链，加快建设全球性国际邮政快递枢纽承载城市，提升枢纽城市衔接转换、集聚辐射功能。提升中欧（亚）班列、西部陆海新通道班列、长江班列、大湾区班列、“北向”班列运营效能，增强京昆、成渝、沿江等廊道物流组织能力及出疆入藏战略通道物资保障能力。结合优势产业分布、进出川货物流量流向及文旅消费流线，打造全省物流网络“一张图”。加快建设“一带一路”进出口商品集散中心，打造三文鱼、榴莲等特色单品进口集散中心。加快智慧口岸建设，提升通关便利化水平。（人民财讯）", "ctime": 1787023611, "time_str": "11:26:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260818/c679038695.shtml"}, {"id": "4973059", "title": "菲律宾校园枪击案致1死9伤 枪手为7年级学生", "content": "菲律宾三宝颜市市长奥拉索表示，雅典耀大学中学部发生枪击事件，造成1人死亡、9人受伤，枪手为一名7年级学生，行凶后在校园内自杀。警方正在调查，校园已封闭，家长陆续赶到学校撤离学生。（央视新闻）", "ctime": 1787023367, "time_str": "11:22:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260818/c679038646.shtml"}, {"id": "4973057", "title": "两部门再次预拨6000万元支持河南做好防汛应急抢险救灾工作", "content": "近期，受强台风“白海豚”残余环流影响。河南出现大范围持续性强降雨，引发灾情险情。在前期预拨4000万元中央自然灾害救灾资金的基础上，8月18日，财政部、应急管理部再次预拨6000万元中央自然灾害救灾资金，支持河南做好防汛应急抢险救灾工作，重点做好受灾群众转移安置、排危除险等应急处置、过渡期生活救助以及倒损民房修复等工作，切实减轻灾害损失，保障受灾群众基本生活。(央视新闻)", "ctime": 1787023267, "time_str": "11:21:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260818/c679038627.shtml"}, {"id": "4973017", "title": "首批国家公园生态系统质量和旗舰物种数量实现双提升", "content": "记者从国家林草局了解到，我国全面推进以国家公园为主体的自然保护地体系建设，取得显著阶段性成效，首批国家公园生态系统质量和旗舰物种数量实现双提升。在生境恢复方面，首批5个国家公园整合120多个各类自然保护地，全面优化生态系统的原真性、完整性，整体保护长江、黄河、澜沧江源头生态系统，连通野生大熊猫13个局域种群栖息地；旗舰物种种群得到有效恢复，藏羚种群数量增至7万余只，野生东北虎由公园建设初期的27只增至72只、野生东北豹由42只增至115只，海南长臂猿种群增至7群44只，武夷山发现雨神角蟾等多个新物种，实现了生态系统质量和旗舰物种数量双提升。（央视新闻）", "ctime": 1787022591, "time_str": "11:09:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260818/c679038413.shtml"}, {"id": "4973013", "title": "美国ITC正式对变压器及其部件启动337调查", "content": "8月17日，美国国际贸易委员会（ITC）投票决定对特定变压器及其部件启动337调查（调查编码：337-TA-1517）。2026年7月16日，美国Ayr Energy向美国ITC提出337立案调查申请，主张对美出口、在美进口和在美销售的该产品违反了美国337条款（盗用商业秘密、虚假广告、不正当竞争、商标侵权、虚假原产地标注等），请求美国ITC发布有限排除令、禁止令。印度Zetwerk Manufacturing、美国Zetwerk Manufacturing、印度KRYFS Power Components、美国Unimacts Global为列名被告。美国国际贸易委员会将于立案后45天内确定调查结束期。除美国贸易代表基于政策原因否决的情况外，美国国际贸易委员会在337案件中发布的救济令自发布之日生效并于发布之日后的第60日起具有终局效力。（中国贸易救济信息网）", "ctime": 1787022571, "time_str": "11:09:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260818/c679038409.shtml"}, {"id": "4973011", "title": "创业板指跌2%", "content": "创业板指跌幅扩大至2%，上证指数跌0.64%，深证成指跌1.61%。", "ctime": 1787022570, "time_str": "11:09:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260818/c679038408.shtml"}, {"id": "4973003", "title": "上证50股指期货(IH)主力合约日内跌超1%", "content": "上证50股指期货(IH)主力合约日内跌超1%，现报2887.6点。", "ctime": 1787022508, "time_str": "11:08:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260818/c679038341.shtml"}, {"id": "4973001", "title": "沪深京三市成交额超1.5万亿元，较上日此时放量1267亿元", "content": "据同花顺iFinD数据，沪深京三市成交额超1.5万亿元，较上日此时放量1267亿元，预计全天成交金额约2.6万亿元。截至目前，沪市成交额7053亿元，深市成交额7832亿元，北证50成交额120亿元。", "ctime": 1787022341, "time_str": "11:05:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260818/c679038269.shtml"}, {"id": "4972993", "title": "特朗普与记者发生激烈争执 称美航母问题报道是假新闻", "content": "特朗普当地时间8月17日在白宫与一名CNN记者发生激烈争执时称，有关“林肯”号航空母舰上状况恶化的报道是“假的”。由于严重超期部署，林肯号航母正面临着一系列问题，包括基本物资短缺、安全和卫生问题以及舰员精神健康状况恶化。据美国媒体此前报道，舰员士气低落和疲惫不堪的现象很普遍。《军事时报》11日报道称，至少有两名水兵试图跳海自杀。（澎湃新闻）", "ctime": 1787022203, "time_str": "11:03:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260818/c679038242.shtml"}, {"id": "4972989", "title": "南向资金净买入超60亿港元", "content": "据同花顺iFinD数据，截至目前，南向资金净买入超60亿港元，其中港股通（沪）买入超44.90亿港元，港股通（深）买入超15.98亿港元。", "ctime": 1787022152, "time_str": "11:02:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260818/c679038222.shtml"}, {"id": "4972975", "title": "富时中国A50指数期货跌1%", "content": "富时中国A50指数期货跌幅扩大至1%。", "ctime": 1787021897, "time_str": "10:58:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260818/c679038168.shtml"}, {"id": "4972963", "title": "沪深300股指期货(IF)主力合约日内跌超1%", "content": "沪深300股指期货(IF)主力合约日内跌超1%，现报4646.0点。", "ctime": 1787021717, "time_str": "10:55:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260818/c6 // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
