<style>
:root {
  --bg-primary: #0a0e17;
  --bg-card: #111827;
  --bg-card-hover: #1a2332;
  --border: #1e293b;
  --text-primary: #e2e8f0;
  --text-secondary: #94a3b8;

  --red: #ef4444;
  --red-bg: rgba(239,68,68,0.1);

  --green-bg: rgba(34,197,94,0.1);
  --gold: #f59e0b;
  --blue: #3b82f6;
  --purple: #8b5cf6;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Noto Sans SC', sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  min-height: 100vh;
}
.mono { font-family: 'JetBrains Mono', monospace; }
.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 20px;
  transition: all 0.2s;
}
.card:hover { background: var(--bg-card-hover); border-color: #334155; }
.badge {
  display: inline-flex; align-items: center; padding: 2px 8px;
  border-radius: 6px; font-size: 12px; font-weight: 500;
}
.badge-s { background: rgba(239,68,68,0.2); color: #ef4444; }
.badge-a { background: rgba(245,158,11,0.2); color: #f59e0b; }
.badge-b { background: rgba(59,130,246,0.2); color: #3b82f6; }
.badge-c { background: rgba(100,116,139,0.2); color: #94a3b8; }
.score-bar {
  height: 6px; border-radius: 3px; background: #1e293b; overflow: hidden;
}
.score-bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s; }
.up { color: var(--red); }
.down { color: var(--green); }
.pulse { animation: pulse 2s infinite; }
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}
.glow { box-shadow: 0 0 20px rgba(59,130,246,0.15); }
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg-primary); }
::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
</style>

<!-- 顶部状态栏 -->
<div class="flex flex-wrap items-center justify-between mb-6 gap-4">
  <div class="flex items-center gap-3">

<div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-6">
  <!-- 左列: Hot7 + 板块 -->

    <div class="card">

  </div>

  <!-- 中列: 精选个股 -->
  <div class="lg:col-span-2">
    <div class="card">
      <div class="flex items-center justify-between mb-4">

      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-sm">
          <thead>
            <tr class="text-gray-500 text-xs border-b border-gray-800">
              <th class="text-left py-2 px-2">代码</th>
              <th class="text-left py-2 px-1">名称</th>
              <th class="text-right py-2 px-1">现价</th>
              <th class="text-right py-2 px-1">涨幅</th>
              <th class="text-right py-2 px-1">评分</th>
              <th class="py-2 px-1 text-center" style="min-width:160px">评分分布</th>
              <th class="text-right py-2 px-1">板块</th>
              <th class="text-right py-2 px-1">连涨</th>
            </tr>
          </thead>
          <tbody id="picks-table"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- 新闻流 + 交易代理 -->
<div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
  <div class="card">
    <h2 class="text-sm font-medium text-gray-400 mb-4">实时新闻流</h2>
    <div id="news-feed" class="space-y-2 max-h-96 overflow-y-auto pr-2"></div>
  </div>
  <div class="card">
    <h2 class="text-sm font-medium text-gray-400 mb-4">交易代理状态</h2>
    <div id="agent-status" class="space-y-3"></div>
  </div>
</div>

监会批准数字公募基金24/7二级市场交易", "content": "10月26日，全球首创的数字公募基金24/7全天候二级市场交易服务在香港正式向公众开放。10月26日，香港证监会宣布，已批准全球首批向公众开放的代币化基金在香港证监会持牌虚拟资产交易平台（以下简称VATP）上进行二级市场交易。两只现有的香港证监会认可代币化货币市场基金已于当日开始提供全天候二级市场交易，它们分别是以港元买卖的华夏基金港元数字货币市场基金和以美元买卖的华夏基金美元数字货币市场基金。上述全球首创的由香港证监会批准的数字公募基金24/7全天候二级市场交易服务，由华夏基金（香港）有限公司（以下简称华夏基金〔香港〕）与猎豹交易（香港）有限公司（以下简称猎豹交易）联合推出。猎豹交易由富途控股有限公司全资持有，是香港证监会VATP。作为亚太地区首家面向零售投资者推出获香港证监会批准的数字公募货币市场基金的资产管理公司，华夏基金(香港)此次采用“双轨机制”设计：以二级市场交易支持基金份额流通，并以一级市场申购与赎回机制作为流动性后备支持。在遵守平台运营规则的前提下，零售投资者可以通过此平台每周七天、每天24小时交易上述数字货币市场基金，突破传统公募基金固定交易时段、多日结算周期的限制。(中国基金报)", "ctime": 1792995723, "time_str": "14:22:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261026/c681077446.shtml"}, {"id": "5476121", "title": "腾景科技：800G、1.6T光模块配套无源光学元组件正在批量交付", "content": "腾景科技在2026年第三季度业绩说明会上表示，公司800G、1.6T光模块配套无源光学元组件正在批量交付。公司的核心技术具有较强的平台化复用属性，具备适配可插拔光模块、OCS、CPO/NPO等多元光通信技术路线的精密光学能力。随着光通信技术不断迭代升级和应用，产品品类也在持续丰富。（人民财讯）", "ctime": 1792995602, "time_str": "14:20:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261026/c681077397.shtml"}, {"id": "5476079", "title": "联想创投入股环启新肽", "content": "企查查APP显示，近日，上海环启新肽科技有限公司发生工商变更，新增上海联想未来创业投资合伙企业（有限合伙）等为股东，同时注册资本增至264.04万元。企查查信息显示，该公司成立于2026年7月，经营范围包含生物基材料技术研发；工业酶制剂研发；人工智能应用软件开发；人工智能行业应用系统集成服务；人工智能硬件销售等。（人民财讯）", "ctime": 1792995126, "time_str": "14:12:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261026/c681077202.shtml"}, {"id": "5476075", "title": "ETF两市成交额超5000亿元", "content": "截至目前，ETF两市成交额超5000亿元。其中，成交额最高的非货币型ETF分别是创业板ETF（159915）、科创50ETF（588000）、中韩半导体ETF（513310），成交额分别为109.53亿元、89.74亿元、70.58亿元。", "ctime": 1792995072, "time_str": "14:11:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261026/c681077166.shtml"}, {"id": "5476061", "title": "日本防卫省展示“25式地对舰导弹”", "content": "日本防卫省在日美联合军演中展示了“25式地对舰导弹”，这是该导弹自今年3月部署以来首次投入大规模演习。演习中未进行实弹发射，但附近居民和民间团体表达了担忧，要求事前说明和停止演习。（央视新闻）", "ctime": 1792995024, "time_str": "14:10:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261026/c681077148.shtml"}, {"id": "5475981", "title": "科大讯飞推出数字员工平台和智能决策本体平台", "content": "AI办公竞赛火热，记者获悉，科大讯飞近日发布了WinWork数字员工平台、SuperButton智能决策本体平台两款产品。WinWork面向政企构建人机协同、能力构建、AI Connection、安全可控、全生命周期管理五大核心能力，提供SaaS订阅、混合部署、私有化部署三种交付形态，覆盖采购、法务、风控、客服、营销、研发、人力等专业领域。SuperButton智能决策本体平台通过“本体引擎+连接引擎”双引擎架构，将企业业务规则与数据沉淀为可计算的语义资产，并连接存量业务系统，实现业务操作闭环。目前，平台已形成金融营销、商情分析、风控三大行业本体应用。（21世纪经济报道）", "ctime": 1792994561, "time_str": "14:02:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261026/c681076900.shtml"}, {"id": "5475961", "title": "“双十一”促销季警惕降价假象，中消协发布消费提示", "content": "“双十一”促销季来临，各类满减、预售、直播活动密集上线。从近年来消费者的投诉情况看，价格不透明、规则复杂化、宣传失真等问题仍然是消费者权益受损的集中地带。中国消费者协会、中国市场监督管理学会、中国物品编码中心提醒广大消费者：在参与促销活动时，把“看清楚”放在“抢得快”前面，把“用得上”放在“看起来便宜”前面。警惕“价格魔术”，不以页面折价幅度判断优惠。看清“定金”性质，谨慎对待预售锁定。拆解“卡券迷阵”，不被复杂规则牵着走。辨别直播与“测评”，不被失真信息误导。远离“私域引流”，不私下交易。恪守“量入为出”，妥善留存交易凭证。（央视新闻）", "ctime": 1792994504, "time_str": "14:01:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261026/c681076866.shtml"}, {"id": "5475837", "title": "未来车辆将被强制安装C-V2X？知情人士称“相关部门已启动强标制定工作”，智能汽车又迎新风口", "content": "“相关部门已经在推动车辆安装C-V2X（蜂窝车联网）的强标制定工作。相关工作组已经成立，有几十家单位已经参与进来了。”日前，一位不愿透露姓名的C-V2X领域从业者向记者透露了上述信息。据了解，营运车辆已被率先要求安装C-V2X。今年7月，交通运输部办公厅曾发布由交通运输部公路科学研究所承担的国家标准《营运车辆运营安全技术和管理要求》（计划编号：20254333-Q-348）征求意见稿。根据此前明确划定的落地时间表，该标准实施满25个月后，国内所有新增营运客车、货车、牵引列车必须出厂搭载LTE-V2X直连车载交互终端。这也意味着C-V2X终端首次以强制国标形式要求前装量产。中信科智联科技有限公司副总经理范炬在接受记者采访时认为，在相关政策法规的进一步推动下，我国C-V2X产业将跨越“试点示范”的鸿沟，进入爆发式增长的新阶段。（每日经济新闻）", "ctime": 1792994139, "time_str": "13:55:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261026/c681076751.shtml"}, {"id": "5475815", "title": "远程商用车科技公司增资至约11.5亿元", "content": "天眼查App显示，10月21日，远程商用车科技有限公司发生工商变更，新增上海隐成企业管理合伙企业（有限合伙）、上海远见越商企业管理合伙企业（有限合伙）等为股东，同时，注册资本由约10.6亿元人民币增至约11.5亿元人民币。值得一提的是，本月以来，该公司注册资本由约4.9亿元人民币增至约11.5亿元人民币，增幅约138%。该公司成立于2021年7月，法定代表人为戴庆，经营范围包括电池制造、电池销售、企业管理咨询等，现由浙江远程新能源商用车集团有限公司、李书福及上述新增股东等共同持股。（界面新闻）", "ctime": 1792993778, "time_str": "13:49:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261026/c681076611.shtml"}, {"id": "5475755", "title": "港股物理AI板块午后走强", "content": "港股物理AI板块午后走强，欢创科技涨超13%，越疆涨超11%，禾赛-W涨超10%，优必选涨超5%。", "ctime": 1792993142, "time_str": "13:39:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261026/c681076264.shtml"}, {"id": "5475747", "title": "英国决定不加入加拿大牵头的防务银行", "content": "英国和加拿大两国财政部发表联合声明，表示英国参与建立的“多边防务机制”与加拿大牵头筹建的“防务、安全与韧性银行”将作为两个不同但互补的伙伴机制来运营。尽管双方原本有意将两个机制合并，但英国决定单干。声明指出，两个机制各自运营、相互支持才是最优方案。英国首相伯纳姆曾与加拿大总理卡尼商讨英方加入防务银行事宜，但后续磋商暴露分歧。英国财政大臣约翰·希利有意加大对“多边防务机制”的资金投入，以填补英国防务预算缺口。（央视新闻）", "ctime": 1792993086, "time_str": "13:38:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261026/c681076236.shtml"}, {"id": "5475701", "title": "人形机器人板块短线拉升 上纬新材20CM涨停", "content": "人形机器人板块短线拉升，上纬新材20CM涨停，泛亚微透涨停，万向钱潮、兰生股份、模塑科技此前封板, 万凯新材、宇树科技涨超10%，敏芯股份、祥源新材、日盈电子、洛轴股份、鹿山新材等跟涨。相关ETF方面，机器人ETF汇添富（159213）成交额2911.67万元。", "ctime": 1792992534, "time_str": "13:28:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261026/c681076003.shtml"}, {"id": "5475689", "title": "宇树科技盘中涨超10%", "content": "A股宇树科技盘中涨超10%，现报687.00元。", "ctime": 1792992397, "time_str": "13:26:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261026/c681075947.shtml"}, {"id": "5475687", "title": "伊朗宣布沙特、土耳其、巴基斯坦三国官员将访伊", "content": "当地时间26日，伊朗最高国家安全委员会副秘书巴盖里表示，沙特国防大臣、巴基斯坦陆军总参谋长、土耳其情报局局长将访问伊朗并举行联合会议。巴盖里表示，参与此次会议的三国可以与伊朗一起，采取有效措施，朝着建立本土区域安全方向迈进。目前，伊朗暂未宣布具体会议时间。（央视新闻）", "ctime": 1792992377, "time_str": "13:26:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261026/c681075942.shtml"}, {"id": "5475681", "title": "胡塞武装称袭击沙特主导联军集结点和武器库 致数十人死伤", "content": "也门胡塞武装发言人当地时间25日早间发表声明称，也门胡塞武装使用多枚弹道导弹袭击了沙特主导联军方面位于也门亚丁省萨拉赫丁地区和拉赫季省瓦赫特地区的人员集结点及武器库。但声明未提及具体袭击时间。声明还称，袭击造成数十人死伤，部分车辆和武器库被摧毁并起火。（央视新闻）", "ctime": 1792992211, "time_str": "13:23:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261026/c681075884.shtml"}, {"id": "5475609", "title": "风暴袭击欧洲 影响多国电力供应和交通", "content": "两场风暴25日侵袭欧洲部分地区，影响英国、法国、德国等国的电力供应、手机网络和交通，并造成人员伤亡。据法新社25日报道，风暴“奥斯汀”和“布洛”在24小时内接连过境期间，带来大风和降雨。英国苏格兰局地记录下时速高达135公里的强风；大风吹倒树木、刮落电线，导致苏格兰以及英格兰北部地区道路和铁路受阻，这两个地区还面临洪涝风险。风暴致英国累计超过40万户家庭、法国约28.8万户家庭以及德国西南部至少1万户家庭停电。截至25日中午，法国仍有近6万户停电，主要分布在诺曼底和布列塔尼地区。由于风暴导致停电，德国西南部小城布赖斯高地区弗赖堡的几家主要医院25日表示，只接收急诊患者。停电还导致当地手机网络中断。（新华社）", "ctime": 1792991794, "time_str": "13:16:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261026/c681075747.shtml"}, {"id": "5475607", "title": "全长48.22公里 广东河紫高速今日开工", "content": "今天（10月26日），记者从广东交通集团了解到，河源紫金至江东新区高速公路，也就是河紫高速，正式进入建设阶段。项目起于广东省河源市紫金县紫城镇黄花村，接国道G236线，终于河源市江东新区临江镇年丰村，顺接国道G355线，全长48.22公里，设计时速100公里，采用双向四车道标准。（央视新闻）", "ctime": 1792991635, "time_str": "13:13:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261026/c681075686.shtml"}, {"id": "5475599", "title": "A股三大指数探底回升 上证指数翻红", "content": "A股三大指数探底回升，上证指数翻红，深成指跌0.53%，创业板指跌幅收窄至0.92%。全市场超3000家个股上涨。", "ctime": 1792991461, "time_str": "13:11:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261026/c681075621.shtml"}, {"id": "5475591", "title": "文化传媒概念板块短线拉升", "content": "文化传媒概念板块短线拉升，南方传媒、创维数字、盛通股份涨停, 盛天网络、锋尚文化涨超10%，上海电影、元隆雅图、广电网络、上海建科、中国出版等跟涨。相关ETF方面，传媒ETF华夏（516190）涨1.68%，成交额811.83万元，传媒ETF广发（512980）涨1.9%，成交额2.33亿元。", "ctime": 1792991304, "time_str": "13:08:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261026/c681075575.shtml"}, {"id": "5475565", "title": "约旦逮捕3名教堂枪击事件嫌疑人", "content": "约旦安全部门26日发表声明说，已逮捕3名涉嫌参与23日教堂枪击事件的嫌疑人。 声明说，经过调查，约旦安全部门当天凌晨抓获3名嫌疑人。嫌疑人藏匿在卡拉克省一栋废弃房屋内，拒绝投降，后与安全部队发生交火，3人均受伤。 声明说，安全部门在嫌疑人藏身处起获多支枪支及弹药。 声明强调，“恐怖主义没有立足之地”，重申将坚决打击任何企图危害约旦国家安全和公民安全的行为。 一伙不明身份的武装分子23日在约旦南部卡拉克省一教堂内开枪，造成9人死亡、多人受伤。(新华社)", "ctime": 1792990662, "time_str": "12:57:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261026/c681075360.shtml"}, {"id": "5475561", "title": "日本前首相福田康夫去世", "content": "日本媒体10月26日报道，日本前首相福田康夫去世。（CCTV国际时讯）", "ctime": 1792990646, "time_str": "12:57:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261026/c681075349.shtml"}, {"id": "5475539", "title": "拉美多国领导人祝贺卢拉连任巴西总统", "content": "巴西总统卢拉在当地时间25日举行的总统选举第二轮投票中战胜自由党候选人、前总统雅伊尔·博索纳罗之子弗拉维奥·博索纳罗，赢得连任，将开启他的第四个总统任期。拉美多国领导人表示祝贺。墨西哥总统克劳迪娅·辛鲍姆祝贺卢拉胜选。她在社交媒体上写道：“巴西人民赢了！祝贺卢拉总统！”（新华社）", "ctime": 1792989879, "time_str": "12:44:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261026/c681075082.shtml"}, {"id": "5475537", "title": "联合免疫疗法在晚期黑色素瘤临床试验中展现潜力", "content": "英国皇家马斯登医院日前发布消息说，一项临床试验显示，接受两种免疫疗法联合治疗的晚期黑色素瘤患者中，近三成在影像检查中肿瘤完全消失。这一结果为改善晚期黑色素瘤治疗提供了新思路。这项Ⅱ期临床试验由皇家马斯登医院等机构参与开展，采用肿瘤浸润淋巴细胞（TIL）疗法Lifileucel与免疫检查点抑制剂帕博利珠单抗联合治疗。共有27名晚期黑色素瘤患者接受联合治疗，其中24人被纳入主要疗效分析。在中位随访26.9个月后，研究人员发现，24名患者中有7人影像检查显示肿瘤完全消失，占患者总数的29.2%。包括这7人在内，共有15人肿瘤显著缩小，占患者总数的62.5%，其中13人维持缓解至少12个月，10人在最近一次评估时仍处于完全或部分缓解。研究还显示，患者的中位无进展生存期（即患者癌症复发或进展前的时间）为19.8个月。TIL疗法和帕博利珠单抗治疗都属于免疫疗法，前者从患者自身肿瘤中提取免疫细胞，在体外扩增后再回输，以增强这些细胞识别和攻击癌细胞的能力；后者则通过解除免疫系统受到的抑制，帮助免疫细胞攻击肿瘤。研究负责人之一、皇家马斯登医院肿瘤内科专家安德鲁·弗内斯表示，结果表明，将上述两种免疫疗法联合用于一线治疗，可能带来显著且持久的疗效。研究人员表示，目前正在开展规模更大的Ⅲ期临床试验，以进一步评估这种联合疗法的有效性和安全性。（新华社）", "ctime": 1792989825, "time_str": "12:43:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261026/c681075059.shtml"}, {"id": "5475535", "title": "日本开始第25轮核污染水排海", "content": "日本东京电力公司26日开始福岛第一核电站2026财年第7轮核污染水排海，这也是总计第25轮核污染水排放。 据福岛电视台报道，本轮核污染水排放于当地时间26日11时29分（北京时间10时29分）开始。 东京电力公司此前发布的资料显示，本轮排放按计划将持续至11月13日。预计排放核污染水总量约7800吨，含放射性氚总量约1.4万亿贝克勒尔。 2023年8月，日方无视国际社会的强烈质疑和反对，单方面强行启动福岛第一核电站核污染水排海。东京电力公司于本月23日结束第24轮核污染水排海。24轮核污染水排海总计排放量达18.84万吨。(新华社)", "ctime": 1792989755, "time_str": "12:42:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261026/c681075040.shtml"}, {"id": "5475529", "title": "长川科技：目前客户需求旺盛 产品订单充裕", "content": "记者从长川科技获悉，受益于半导体行业市场需求持续回暖，目前公司客户需求旺盛、产品订单充裕。前三季度，公司测试机、分选机等核心设备出货增长，销售收入同比大幅提升；公司预计，随着业务规模持续扩大，规模效应逐步释放，盈利水平改善，将共同带动净利润同比显著增长。（人民财讯）", "ctime": 1792989484, "time_str": "12:38:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261026/c681074950.shtml"}, {"id": "5475527", "title": "新三板股票交易风险提示要求将于11月2日起实施", "content": "记者了解到，新三板股票交易风险提示有关新要求将于2026年11月2日起实施。根据全国股转公司要求，券商主要完成四大调整：一是投资者开通新三板交易权限后60个交易日内，委托买入名单内股票的，逐笔弹窗提示（含盘中限价买入委托和大宗交易买入委托）；二是买入环节两次风险提示，输入代码或简称时首次弹窗，确认买入时二次弹窗；三是名单根据股权集中度、交易流动性确定，限期有效，但不对外展示；四是券商须建立灵活可控的风险提示管理机制，配合并满足监管相应要求。（蓝鲸新闻）", "ctime": 1792989348, "time_str": "12:35:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261026/c681074917.shtml"}, {"id": "5475525", "title": "新易盛：三季度产量环比增长 高速率产品放量提速", "content": "记者从新易盛方面获悉，公司第三季度产品产量较第二季度保持增长，业务交付规模进一步提升。新易盛此前在投资者交流中表示，800G光模块出货量持续提升，已成为今年交付主力；1.6T产品也已进入持续放量阶段，预计下半年放量节奏将进一步加快。随着高速率产品需求持续释放，公司产品交付规模有望稳步提升。（人民财讯）", "ctime": 1792989339, "time_str": "12:35:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261026/c681074916.shtml"}, {"id": "5475523", "title": "商务部：今年1月至9月我国批发和零售业增加值11.1万亿元，同比增长4.4%", "content": "今年以来，商务部深入贯彻落实党中央、国务院决策部署，创新推动现代商贸流通体系建设，促进批发和零售业高质量发展，为全方位扩大国内需求、建设强大国内市场提供有力支撑。据国家统计局数据，1—9月，我国批发和零售业增加值11.1万亿元，同比增长4.4%，增速较上半年提高0.7个百分点，占GDP比重为10.4%。行业发展总体向好，为全方位扩大国内需求、做强国内大循环提供有力支撑。（央视新闻）", "ctime": 1792989023, "time_str": "12:30:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261026/c681074765.shtml"}, {"id": "5475521", "title": "也门首都萨那传出巨大爆炸声", "content": "当地时间26日早间，也门首都萨那传出巨大爆炸声和战斗机飞行的声音，疑似再遭沙特主导的联军空袭。（央视新闻）", "ctime": 1792989018, "time_str": "12:30:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261026/c681074763.shtml"}, {"id": "5475517", "title": "10月26日午间公告一览：科伦药业控股子公司科伦博泰2026年ESMO中位OS延长8.5个月", "content": "科伦药业公告，控股子公司科伦博泰在2026年欧洲肿瘤内科学会大会公布多项创新药物研究成果。OptiTROP-Lung04研究预设OS最终分析显示，芦康沙妥珠单抗组中位OS为25.9个月，含铂双药化疗组为17.4个月，延长8.5个月，死亡风险降低31%。", "ctime": 1792988536, "time_str": "12:22:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261026/c681074621.shtml"}, {"id": "5475515", "title": "沙特称摧毁胡塞多处导弹设施", "content": "沙特阿拉伯主导的联军今天（10月26日）称，已在也门胡塞控制区摧毁5处弹道导弹储存设施及4套导弹发射平台，以“消除威胁来源”。据称其中包括曾向沙特首都利雅得发射导弹的发射架胡塞武装称再袭利雅得机场胡塞武装稍早前则称，已袭击沙特东西输油管道泵站及利雅得的哈立德国王国际机场，但沙特方面未予以证实。(CCTV国际时讯)", "ctime": 1792987896, "time_str": "12:11:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "sourc function impactBadge(score) {

  if (score >= 50) return '<span class="badge badge-b">B</span>';

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
