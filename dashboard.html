<style>
:root {
  --bg-primary: #0a0e17;

* { margin:0; padding:0; box-sizing:border-box; }

  background: var(--bg-primary);
  color: var(--text-primary);

}
.mono { font-family: 'JetBrains Mono', monospace; }
.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 20px;
  transition: all 0.2s;
}
.card:hover { background: var(--bg-card-hover); border-color: #334155; }
.badge {
  display: inline-flex; align-items: center; padding: 2px 8px;
  border-radius: 6px; font-size: 12px; font-weight: 500;
}
.badge-s { background: rgba(239,68,68,0.2); color: #ef4444; }
.badge-a { background: rgba(245,158,11,0.2); color: #f59e0b; }
.badge-b { background: rgba(59,130,246,0.2); color: #3b82f6; }
.badge-c { background: rgba(100,116,139,0.2); color: #94a3b8; }
.score-bar {
  height: 6px; border-radius: 3px; background: #1e293b; overflow: hidden;
}
.score-bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s; }
.up { color: var(--red); }
.down { color: var(--green); }
.pulse { animation: pulse 2s infinite; }
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}
.glow { box-shadow: 0 0 20px rgba(59,130,246,0.15); }
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg-primary); }

</style>

              <th class="text-right py-2 px-1">现价</th>
              <th class="text-right py-2 px-1">涨幅</th>
              <th class="text-right py-2 px-1">评分</th>
              <th class="py-2 px-1 text-center" style="min-width:160px">评分分布</th>
              <th class="text-right py-2 px-1">板块</th>
              <th class="text-right py-2 px-1">连涨</th>
            </tr>
          </thead>
          <tbody id="picks-table"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- 新闻流 + 交易代理 -->
<div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
  <div class="card">

</div>

const NEWS     = [{"id": "4799711", "title": "国内首条穿越长江高铁隧道贯通", "content": "记者从渝黔铁路有限责任公司获悉，24日，随着隧道最后一次掘进施工完成，渝厦高铁重庆菜园坝长江铁路隧道顺利贯通，为渝厦高铁全线通车运营打下坚实基础。这条隧道也是国内首条穿越长江并实现贯通的高铁隧道。重庆菜园坝长江铁路隧道由中铁二院勘察设计、中铁十四局负责施工，为渝厦高铁全线重点控制性工程。据渝黔铁路有限责任公司武隆指挥部指挥长杨智勇介绍，隧道位于重庆市渝中区与南岸区，总长11942米，施工线路下穿城市市政道路、高架桥梁、轨道交通线路、多处居民区建筑群、长江主航道以及南山山体，面临穿山、穿城、穿江、跨水域多重复杂施工条件，整体施工难度大、技术标准严苛。（新华社）", "ctime": 1784872975, "time_str": "14:02:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260724/c678411607.shtml"}, {"id": "4799559", "title": "台风“红霞”趋近，交通运输部启动台风三级防御响应", "content": "中央气象台今早继续发布台风橙色预警，交通运输部已启动台风三级防御响应。预计“红霞”25日晚上至26日早晨在广东珠海到福建漳浦一带沿海登陆。交通运输部严格落实灾害天气主动防御措施，做到应停尽停、应关尽关、应撤尽撤；强化应急力量预置。交通运输部也将根据天气预警变化，及时调整防御响应等级。（央视新闻）", "ctime": 1784872840, "time_str": "14:00:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260724/c678411594.shtml"}, {"id": "4799463", "title": "美国防部公布下调的对伊战事美军阵亡人数", "content": "美国国防部23日更新了美伊冲突中美军阵亡人数，由此前公布的18人下调至14人。据美国媒体报道，针对此次数据下调原因，美军方内部说法与国防部给出的官方解释相互矛盾。 美国国防部官网当天将美伊冲突中美军阵亡人数调整为14人，其中7人被划定为交战阵亡。 美国国防部代理新闻秘书乔尔·瓦尔迪兹对《纽约时报》表示，此次数据变动为官网“临时数据故障”所致，且相关问题将很快修复，并称国防部“致力于保障所有伤亡通报信息的准确”。 另据《纽约时报》援引3名匿名美军官员的说法报道，作出上述修改，是因为日前在约旦身亡的3名美军和在伊拉克北部身亡的1名美军，其死亡时间均在美国总统特朗普4月宣布美伊临时停火之后，故此不再计入对伊战事的美军阵亡名单。 美国舆论表示，美伊停火协议破裂以来，美国防部甚少披露美方军事部署情况，且公布美军人员伤亡相关信息迟缓。包括民主党联邦参议员在内的批评人士认为，美政府有义务向公众公开战事进展相关情况。(新华社)", "ctime": 1784872667, "time_str": "13:57:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260724/c678411546.shtml"}, {"id": "4799445", "title": "百亿私募希瓦再出手自购", "content": "7月24日，海南希瓦发布公告称，基于对中国资本市场长期健康稳定发展的信心，公司希瓦自由之路系列基金经理徐大为当天使用自有资金申购希瓦私募旗下希瓦自由之路系列基金产品份额共计1000万元。（新浪财经）", "ctime": 1784872537, "time_str": "13:55:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260724/c678411519.shtml"}, {"id": "4799439", "title": "SK海力士清州P&T7洁净室将提前三个月投入使用", "content": "SK海力士正在加快其清州P&T7先进半导体封装工厂的建设，将其首个洁净室的启用时间提前了约三个月。据业内人士7月23日透露，SK海力士目前预计最早将于2027年7月启用位于P&T7的首个洁净室。该公司此前曾宣布的目标是2027年10月。一位业内人士透露：“SK海力士近期提前启动了P&T7洁净室公用设施和基础设施项目的招标工作。公司内部预计，洁净室的启用时间将比原计划提前约一个季度。”部分设备相关的招标项目未能吸引到投标人，目前正在重新发布。业内人士预计，所有公用设施基础设施的招标工作最迟将于8月左右完成。(科创板日报)", "ctime": 1784872483, "time_str": "13:54:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260724/c678411508.shtml"}, {"id": "4799413", "title": "巴西政府：美国征收关税新名目“缺乏法律依据”", "content": "巴西政府23日发表声明，反对美国以所谓“强迫劳动”为由对巴西征收12.5%的关税，认为该措施“缺乏法律依据”。巴西方面将立即启动相关程序以维护国家利益。巴西发展、工业与贸易部长马尔西奥·罗萨当天表示，巴西是国际劳工组织相关公约的缔约国，长期致力于打击强迫劳动。美方以所谓“强迫劳动”为名征收新关税，完全是“建立在不真实的信息基础之上”。罗萨指出，叠加美国近期对部分巴西产品加征25%的关税，巴西鞋类、机械设备、零部件、服装及非医药化工等多个行业面临最高37.5%的税率，产业或受到严重冲击。他表示，巴西希望通过谈判推动美国取消相关关税，但不放弃采取对等措施的可能性。（新华社）", "ctime": 1784872265, "time_str": "13:51:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260724/c678411462.shtml"}, {"id": "4799395", "title": "金信资本等成立低空经济产业创投基金", "content": "企查查APP显示，近日，东莞金信低空经济产业创业投资基金合伙企业（有限合伙）成立，出资额3亿元，经营范围包含以私募基金从事股权投资、投资管理、资产管理等活动。企查查股权穿透显示，该合伙企业由广东金信资本投资有限公司、东莞市创新创业投资母基金合伙企业（有限合伙）、东莞市科创资本投资管理有限公司共同持股。（人民财讯）", "ctime": 1784872033, "time_str": "13:47:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260724/c678411392.shtml"}, {"id": "4799375", "title": "联合国举行秘书长候选人辩论会", "content": "联合国7月23日举行下一任秘书长候选人辩论会，六名候选人回答了主持人以及现场人士的提问。辩论会由第80届联大主席贝尔伯克召集，彭博电视台两位主持人主持辩论会。下一任联合国秘书长候选人智利前总统巴切莱特、来自厄瓜多尔的前联大主席埃斯皮诺萨、来自阿根廷的现任国际原子能机构总干事格罗西、来自哥斯达黎加的现任联合国贸易和发展会议秘书长格林斯潘、圭亚那常驻联合国代表罗德里格斯－伯基特、塞内加尔前总统萨勒参加了辩论。贝尔伯克在辩论开始前说，辩论会是联合国秘书长遴选的关键步骤。联合国秘书长可能是世界上最具挑战性也最值得钦佩的工作之一。在挑战与机遇共存的当下，联合国秘书长肩负捍卫《联合国宪章》和联合国三大支柱，即和平与安全、发展、人权的任务。（央视新闻）", "ctime": 1784871931, "time_str": "13:45:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260724/c678411384.shtml"}, {"id": "4799371", "title": "沪深京三市成交额超1.5万亿元，较上日此时缩量2540亿元", "content": "据同花顺iFinD数据，沪深京三市成交额超1.5万亿元，较上日此时缩量2540亿元，预计全天成交金额约1.9万亿元。截至目前，沪市成交额7017亿元，深市成交额7883亿元，北证50成交额103亿元。", "ctime": 1784871869, "time_str": "13:44:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260724/c678411342.shtml"}, {"id": "4799369", "title": "沈阳飞机工业（集团）有限公司一行到华中数控考察调研", "content": "7月19日，沈阳飞机工业（集团）有限公司党委副书记、总经理左林玄一行到公司考察调研。双方围绕高端数控系统核心技术攻关、国产设备规模化应用等议题展开深入探讨。随后，双方人员一同前往华中科技大学机械科学与工程学院及国家智能设计与数控技术创新中心，开展专题技术交流。座谈会上，校企三方就联合技术攻关、创新成果转化、应用场景拓展等达成多项共识。(人民财讯)", "ctime": 1784871856, "time_str": "13:44:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260724/c678411340.shtml"}, {"id": "4799351", "title": "富时中国A50指数期货跌1%", "content": "富时中国A50指数期货跌幅扩大至1%。", "ctime": 1784871749, "time_str": "13:42:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260724/c678411330.shtml"}, {"id": "4799337", "title": "台湾岛以东相关海域治理进入经济领域", "content": "为全面了解我国管辖海域渔业资源状况，7月17日至23日，农业农村部中国水产科学研究院东海水产研究所，在我国台湾岛以东海域开展了渔业资源调查。近两个月来，我们多次前往这片海域，开展多项行动。6月1日，中国海警在中国台湾岛以东海域依法开展执法巡查；6月10日，交通运输部台湾岛东部海域海上交通专项执法和扫测行动圆满结束；6月16日至18日，自然资源部在我国台湾岛以东海域开展了海洋环境调查。现在，行动进一步延伸到了渔业资源调查。（央视新闻）", "ctime": 1784871711, "time_str": "13:41:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260724/c678411319.shtml"}, {"id": "4799327", "title": "首钢气体完成两轨卫星推进剂加注", "content": "据首钢集团消息，近日，首钢气体依托自研航天氙氪智能加注成套装备，圆满完成两轨共计42颗卫星电推进剂加注任务。这套自主研发设备填补国内商业航天高纯智能加注技术空白。(人民财讯)", "ctime": 1784871681, "time_str": "13:41:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260724/c678411314.shtml"}, {"id": "4799267", "title": "韩国法院判令SK海力士会长崔泰源向前妻支付约6.43亿美元离婚财产分割款", "content": "SK海力士的亿万富豪崔泰源（CheyTae won），其个人财富因人工智能热潮大幅飙升。近日，韩国法院在新一轮判决中，判令他向前妻支付9440亿韩元（约合6.43亿美元）离婚财产分割款，这场旷日持久的天价离婚官司至此接近尾声。若该判决最终生效，这将是韩国史上金额最高的离婚案。据彭博亿万富豪指数，崔泰源当前身家约56亿美元，过去一年净资产已翻倍以上。目前法院尚未明确，这笔巨款将以现金还是股票形式支付。（财联社）", "ctime": 1784871280, "time_str": "13:34:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260724/c678411251.shtml"}, {"id": "4799185", "title": "广期所钯主力合约大跌7%", "content": "广期所钯主力合约大跌7%，报291.95元/克。", "ctime": 1784871033, "time_str": "13:30:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260724/c678411205.shtml"}, {"id": "4799173", "title": "伊朗袭击约旦和巴林境内美军基地", "content": "伊朗军方今天（7月24日）发布声明称，在“闪电”行动第24阶段中，伊朗军方今天凌晨使用“阿拉什”无人机，对巴林谢赫伊萨基地内的燃料储存设施、装备仓库和人员驻地发动袭击。声明称，伊朗军方还对约旦阿兹拉克基地内的飞机库、飞机维修设施和人员驻地发动无人机袭击。(CCTV国际时讯)", "ctime": 1784870920, "time_str": "13:28:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260724/c678411192.shtml"}, {"id": "4799153", "title": "小马智行、中国外运成立物流科技公司 含多项AI业务", "content": "企查查APP显示，近日，北京青骓物流科技有限公司成立，法定代表人为贺星，经营范围包含人工智能基础软件开发；人工智能应用软件开发；电子产品销售；智能车载设备销售；汽车零部件研发等。企查查股权穿透显示，该公司由青骓物流科技有限公司全资持股，后者由小马智行关联公司北京小马慧行科技有限公司、中国外运共同持股。（人民财讯）", "ctime": 1784870669, "time_str": "13:24:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260724/c678411159.shtml"}, {"id": "4799107", "title": "宏微科技：子公司宏微爱赛与合肥工业大学布局GaN板级电源技术", "content": "7月17日，公司子公司上海宏微爱赛半导体有限公司与合肥工业大学正式签署校企合作协议。双方将围绕AI数据中心（AIDC）板级供电核心需求，联合开展基于GaN HEMT的AIDC三级电源关键技术研究。(人民财讯)", "ctime": 1784870160, "time_str": "13:16:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260724/c678411081.shtml"}, {"id": "4799085", "title": "网传券商内部发文防范长鑫科技上市炒作，多家券商分支机构人士称未收到类似通知", "content": "今日上午，一份疑似券商内部风控通知在资本市场流传，针对即将登陆科创板的长鑫科技，要求分支机构防范新股炒作，引发市场广泛关注。网传通知显示，该券商要求各分公司、各营业部通过有效方式提示50万元以上客户避免参与长鑫科技上市初期炒作，理性合规交易；重点关注惯于炒新追热点、多次触发合规预警的客户，对交易所重点监控账户进行电话警示，严防异常交易行为。记者就此向多家券商分支机构、财富管理条线人士进行核实，这些受访人士均表示暂未收到此类正式通知。有券商资深投顾向记者表示，自己从业多年至今，从未接到公司内部针对单只新股的类似通知。业内分析认为，不排除个别券商出于合规审慎原则，自行向客户做出交易提示，属于常规投资者教育范畴，但并非行业统一部署。（每日经济新闻）", "ctime": 1784870076, "time_str": "13:14:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260724/c678411064.shtml"}, {"id": "4799071", "title": "科创50指数涨幅扩大至2%", "content": "科创50指数涨幅扩大至2%，现报1825.85点。", "ctime": 1784869898, "time_str": "13:11:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260724/c678410996.shtml"}, {"id": "4799059", "title": "半导体设备午后持续走高 托伦斯逼近20CM涨停", "content": "半导体设备午后持续走高，至纯科技涨停，托伦斯逼近20CM涨停，中科飞测、芯源微、拓荆科技、强一股份、京仪装备跟涨。", "ctime": 1784869800, "time_str": "13:10:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260724/c678410983.shtml"}, {"id": "4799045", "title": "据报伊朗防空系统击落一飞行器", "content": "据伊朗媒体报道，伊朗南部霍尔木兹甘省、西南部胡齐斯坦省，以及中部亚兹德省、中央省等多地传出爆炸声。首都德黑兰的防空系统启动，应对“敌对”空中威胁。据报道，位于波斯湾的伊朗最大岛屿格什姆岛，防空系统击落一架飞行器。(CCTV国际时讯)", "ctime": 1784869689, "time_str": "13:08:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260724/c678410921.shtml"}, {"id": "4799023", "title": "李乐成出席亚太经合组织数智赋能高级别对话", "content": "7月24日，工业和信息化部在四川省成都市举办亚太经合组织（APEC）数智赋能高级别对话。该对话是2026年“APEC数字周”的重要活动之一。工业和信息化部部长李乐成，四川省省长施小琳出席开幕式并致辞。李乐成表示，希望APEC经济体加强政策、技术、人才、标准等领域的交流合作，不断强化数智赋能，塑造亚太创新发展新优势。一是共同把握技术变革的战略机遇，通过技术推广、联合研发等形式，加快数智技术赋能千行百业。二是共同促进创新成果的普惠共享，加强普惠数字服务能力建设协作，推广低门槛、易部署、可负担的轻量化智能工具与解决方案，加速弥合数字和人工智能鸿沟。三是共同培育开放互通的统一市场，维护全球数字和人工智能产业链供应链的稳定与韧性，深化技术开源开放合作，创建具有竞争力的开放创新生态。四是共同确保数智治理的安全向善，加强协调与合作，形成具有广泛共识的治理框架和标准规范。（人民财讯）", "ctime": 1784869593, "time_str": "13:06:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260724/c678410896.shtml"}, {"id": "4799021", "title": "贸仲上半年受理案件平均争议金额同比增25.3%", "content": "记者在今天举办的中国国际经济贸易仲裁委员会成立七十周年座谈会上了解到，今年上半年，贸仲受理外方当事人诉外方当事人的案件38件，争议金额人民币14.72亿元，同比增长356%。同时，上半年受理案件的个案平均争议金额同比增长25.3%，体现出贸仲正在成为高价值、复杂商业争议的优选机构，这将更好推动我国建设国际商事纠纷解决优选地。（央视新闻）", "ctime": 1784869559, "time_str": "13:05:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260724/c678410888.shtml"}, {"id": "4799019", "title": "中国—国际可再生能源署（IRENA）合作专项工作组换届及扩容结果公布", "content": "国家能源局公告，为深化中国与国际可再生能源署（IRENA）务实合作，2026年3月，国家能源局发布公告，对中国—IRENA“1+1+N”（1个合作指导委员会、1个合作办公室和N个合作专项工作组）合作机制下首批能源转型、水电、太阳能、氢能、电网5个专项工作组进行换届，并增设储能、风能、教育与青年3个专项工作组，面向社会公开征集新一届组成单位。经自主申报、协商确认和择优遴选，现将新一届组成单位名单予以公布，其中各组长（副组长）单位任期3年，自发布之日起。（人民财讯）", "ctime": 1784869495, "time_str": "13:04:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260724/c678410874.shtml"}, {"id": "4798919", "title": "国防部长董军同泰国国防部长举行会谈", "content": "7月24日，国防部长董军应邀访问泰国期间与泰国防部长阿敦举行会谈，就两国两军关系、国际地区形势和共同关心的问题深入交换意见。双方一致认为，要在两国领导人战略引领下，推动中泰军事合作提质升级。中方始终致力于维护地区和平稳定，支持泰柬双方巩固停火、重建互信、和平解决争端。会谈前，阿敦为董军举行欢迎仪式，并陪同检阅仪仗队。（国防部）", "ctime": 1784869237, "time_str": "13:00:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260724/c678410831.shtml"}, {"id": "4798913", "title": "辽宁上半年绿电交易量突破100亿千瓦时", "content": "记者7月24日从国网辽宁省电力有限公司获悉，辽宁持续深化绿色低碳发展，上半年绿电交易量达到102.61亿千瓦时，较去年同期实现跨越式增长。依托丰富的风光资源禀赋，辽宁加快构建新型能源体系，绿电消费占比持续提升，为全省经济社会绿色转型注入强劲动能。（新华社）", "ctime": 1784869229, "time_str": "13:00:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260724/c678410828.shtml"}, {"id": "4798863", "title": "上半年农产品与食材消费市场规模约4.68万亿元 同比增长2.02%", "content": "记者今天从中国物流与采购联合会了解到，今年上半年，我国农产品与食材供应链行业呈现“市场规模温和增长、内部结构深度调整”的运行态势。今年上半年，我国农产品与食材消费市场规模约为4.68万亿元，同比增长2.02%，处于温和增长区间。其中，零售端市场规模约3.55万亿元，增速1.76%，继续占据主导地位；餐饮端市场规模1.13万亿元，增速2.82%，成为拉动农产品与食材消费增长的重要引擎。品类价格分化显著，猪肉持续探底，牛羊肉高位上行，蔬菜水果季节性波动加剧。进出口方面，牛肉、水产品进口大幅增长，猪肉、蔬菜进口持续收缩。（央视新闻）", "ctime": 1784869211, "time_str": "13:00:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260724/c678410825.shtml"}, {"id": "4798791", "title": "消息人士称伊朗拒绝特朗普停火提议", "content": "据美国方面当地时间23日消息，伊朗和伊拉克官员称，伊朗当天拒绝了美国总统特朗普经由伊拉克总理扎伊迪转交的一份停火提议。此次调解努力正值特朗普威胁要重启对伊朗的大规模作战行动。（央视新闻）", "ctime": 1784868721, "time_str": "12:52:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260724/c678410767.shtml"}, {"id": "4798789", "title": "世界银行：委内瑞拉地震直接实物损失约196亿美元", "content": "世界银行23日发布一份初步评估报告显示，6月24日发生在委内瑞拉的两场地震造成的直接实物损失估计为196亿美元，但重建成本可能是这个数字的两倍甚至更多。报告说，这两场地震对建筑和基础设施资产造成的直接经济损失估计为196亿美元。其中，住宅建筑损失约93亿美元，非住宅建筑损失约50亿美元，基础设施损失约52亿美元。重建升级、废墟清理及其他相关费用可能使总恢复成本增至近500亿美元。“这对任何经济体来说都是一个惊人的数字，需要协调一致的应对措施。”世界银行负责拉丁美洲和加勒比地区的副行长苏珊娜·科代罗·格拉说。世界银行表示，正与委内瑞拉政府、美洲开发银行和拉丁美洲开发银行合作，对委内瑞拉的灾后恢复和重建成本进行更全面评估，此类研究通常需要数月时间。（新华社）", "ctime": 1784868716, "time_str": "12:51:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260724/c678410765.shtml"}, {"id": "4798787", "title": "巴林全境拉响警报 美国海军第五舰队总部附近传出爆炸声", "content": "总台记者获悉，当地时间24日早，巴林境内美国海军第五舰队总部所在区域附近传出爆炸声。巴林内政部当天表示，因伊朗导弹袭击，巴林全境已拉响警报。（央视新闻）", "ctime": 1784868708, "time_str": "12:51:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260724/c678410763.shtml"}, {"id": "4798743", "title": "伊朗外长：扣押他国资产“极具煽动性”", "content": "伊朗外交部长阿拉格齐24日表示，美国总统特朗普关于“扣押他国资产来支付无关的未来索赔”的言论，是“一个极具煽动性的先例”。阿拉格齐在社交媒体上说：“那些为此欢呼或从此类资金中获利的人应该记住：一旦政府将没收行为常态化，没有人的资产是安全的。随之而来的混乱，不会令人愉快，也不和平。”特朗普23日在社交媒体发文称，美国将用其控制的伊朗资金“赔偿”因伊方袭击受损的船只和货物。他还说，尽管此类赔偿金额可能巨大，但这仍是“公平合理”的做法。（新华社）", "ctime": 1784867701, "time_str": "12:35:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260724/c678410596.shtml"}, {"id": "4798731", "title": "台风“红霞”已生成 广东启动防风Ⅳ级应急响应", "content": "24日凌晨，菲律宾以东的热带低压已加强为今年第12号台风“红霞”。鉴于当前形势，广东省防汛防旱防风总指挥部于24日9时启动防风Ⅳ级应急响应。预计，其将以每小时30至35公里的速度向西偏北方向快速移动，强度逐渐增强，在25日晚上至26日凌晨以台风或强台风级（12至14级，35至45米/秒）在广东潮州到深圳一带沿海登陆。（新华社）", "ctime": 1784867611, "time_str": "12:33:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260724/c678410586.shtml"}, {"id": "4798691", "title": "国家首版商保创新药目录再添落地城市青岛", "content": "近日，青岛市“琴岛e保”产品更新上线，并于2026年7月1日上线发售。10种商保创新药目录内产品首次纳入“琴岛e保”惠民保保障范围，特药特材及罕见病药品总数增至33种，涵盖CAR-T、恶性肿瘤等前沿治疗领域。“琴岛e保”是青岛市唯一一款政府参与指导的城市定制型商业保险，2025年7月1日至2026年5月底，“琴岛e保”累计投保848万人次，为13.54万名参保人提供理赔服务，赔付金额达9.36亿元，其中特药累计赔付1.08亿元。（人民财讯）", "ctime": 1784866918, "time_str": "12:21:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260724/c678410477.shtml"}, {"id": "4798689", "title": "摩根大通：英特尔目标价从45美元上调至85美元", "content": "摩根大通：英特尔目标价从45美元上调至85美元。", "ctime": 1784866913, "time_str": "12:21:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260724/c678410476.shtml"}, {"id": "4798683", "title": "伊朗称两地遭美方袭击 有人员受伤", "content": "当地时间24日，伊朗中部伊斯法罕省相关负责人表示，当天凌晨3时，该省纳因县一处地区遭到美国袭击。目前，有关袭击造成的人员伤亡及设施受损情况尚不清楚。此外，当天，伊朗西部洛雷斯坦省相关负责人表示，该省省会城市霍拉马巴德郊区遭到美方无人机袭击，造成2人受伤。（央视新闻）", "ctime": 1784866600, "time_str": "12:16:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260724/c678410360.shtml"}, {"id": "4798681", "title": "派珀·桑德勒将特斯拉目标股价从500美元下调至450美元", "content": "派珀·桑德勒将特斯拉目标股价从500美元下调至450美元。", "ctime": 1784866493, "time_str": "12:14:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260724/c678410343.shtml"}, {"id": "4798679", "title": "SK海力士股价跌幅扩大，现跌7.7%", "content": "7月24日，韩国股指延续跌势，SK海力士股价跌幅扩大，现跌7.7%。", "ctime": 1784866394, "time_str": "12:13:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260724/c678410317.shtml"}, {"id": "4798677", "title": "全国首个海陆一体柔直工程海上换流站完成安装", "content": "7月23日，在离广东阳江市海岸近100公里的南海海域，阳江三山岛海上风电柔直输电工程海上换流站顺利完成安装，工程全面转入海缆贯通、海陆联调的冲刺新阶段。（央视新闻）", "ctime": 1784866306, "time_str": "12:11:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260724/c678410296.shtml"}, {"id": "4798675", "title": "港股瑛泰医疗“回A”辅导期卷入杭州“准独角兽”股权纠纷，德诺电生理股东会两议案遭投资方股东四大质疑", "content": "三个月前，“德诺系”公司——“准独角兽”杭州德诺电生理医疗科技有限公司（简称德诺电生理）被投资方股东曝出存在“反稀释权和优先清算权”的股东权利纠纷。近期，这起收购案又有了新的进展。\n记者从前新财富医药“一姐”张明芳处了解到，德诺电生理将于7月29日召开临时股东会，审议上海辰耀基金和瑛泰医疗提供的增资方案以及修改公司章程议案。张明芳对这两个议案的审议内容提出四点质疑：一是，本次增资是公司大股东为满足一己之私所做的“预备动作”；二是，公司以5亿元估值增资扩股已经触发了投资方小股东的“反稀释权”；三是，公司拒绝向包括馨瑞元福在内的股东提供财务报表、审计报告等重要信息；四是，瑛泰医疗多次公告收购德诺系医疗资产，且多为低价收购控制权实现实控人股权退出。\n对此，上海明伦律师事务所王智斌律师向记者表示，公司法明确规定股东享有查阅、复制财务会计报告的权利，投资协议或股东协议中也通常对此有具体约定。在公司拟进行增资扩股的背景下，财务信息是股东行使表决权的重要基础，公司更应当以合理方式保障股东获取相关文件的权利。(每日经济新闻)", "ctime": 1784866297, "time_str": "12:11:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260724/c678410291.shtml"}, {"id": "4798669", "title": "中方代表团有力驳斥日方攻击抹黑", "content": "在菲律宾马尼拉举行的东盟地区论坛和东亚峰会外长会期间，日本炒作台海、南海、中国威胁等问题，对此，中方代表团予以有力驳斥。关于台湾问题，中方指出，台湾问题是中国的内政。中国决不允许“台独”分裂势力以任何名义、任何方式把台湾从中国分裂出去。国际社会反对“台独”分裂活动的立场越鲜明，坚持一个中国原则的立场越坚定，台海的和平稳定就越有保障。关于南海问题，中方指出，作为世界上最繁忙、最安全、最自由的航道，每年全球30%的集装箱、34%的液化天然气和40%的原油运经南海，另有上百万架次民用飞机在南海上空活动，没有哪一艘船哪一架飞机受到过任何干扰和阻碍。倒是个别国家派军舰和军机不远万里来到南海挑事碰瓷。中国愿继续同有关直接当事国通过双边友好协商妥善解决有关争议，同时同东盟国家一道全面有效落实《南海各方行为宣言》，争取尽早达成“南海行为准则”，共同维护南海和平与稳定。外部势力越少挑拨离间，越少煽风点火，地区国家越有信心和能力维护好本地区和平稳定。（央视新闻）", "ctime": 1784866232, "time_str": "12:10:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260724/c678410272.shtml"}, {"id": "4798667", "title": "公司是否考虑增持进行维稳？捷捷微电回应", "content": "有投资者向捷捷微电（300623.SZ）提问，公司出现连续大跌，已经跌到近几年最低水平，行业上涨的时候你没怎么涨，下跌的时候一个星期就把这几年涨幅全跌没了，其他公司纷纷进行回购增持，公司是否考虑增持进行维稳？\n7月24日，公司回答表示，公司生产、销售及运营一切正常，二级市场股价波动的影响因素很多，股市有风险，投资需谨慎。公司高度重视品牌形象和股东信心，并已采取多项措施。在品牌建设方面，公司坚持弘扬捷捷文化与价值观，致力于打造功率器件世界一流品牌，深耕品牌价值，以提升市场影响力和竞争价值。在提振股东信心方面，公司强化投资者关系管理，严格遵守信息披露规则，通过电话、邮件、深交所互动易平台、业绩说明会等多种形式加强与投资者的双向沟通，及时传递公司发展战略和经营信息，有效传导公司价值。公司已制定了市值管理制度，市值管理主要目的是通过充分、合规的信息披露，增强公司透明度，引导公司的市场价值与内在价值趋同，同时利用资本运作、权益管理、投资者关系管理等手段，使公司价值得以充分实现，建立稳定和优质的投资者基础，获得长期的市场支持，从而达到公司整体利益最 大化和股东财富增长并举的目标。后续如有相关回购增持计划，公司将按照相关规定及时履行信息披露义务，敬请关注公司公告。", "ctime": 1784866225, "time_str": "12:10:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260724/c678410267.shtml"}, {"id": "4798665", "title": "多品牌金饰价格下调", "content": "北京时间24日，现货黄金、现货白银持续下跌。记者梳理发现，国内品牌金饰价格经历三连涨后再次大跌，周生生足金饰品报1227元/克，单日大跌31元；老庙黄金足金饰品现报1231元/克，单日大跌27元；老凤祥足金饰品现报1229元/克，单日大跌24元。（中新经纬）", "ctime": 1784866132, "time_str": "12:08:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260724/c678410239.shtml"}, {"id": "4798663", "title": "诺华盐酸伊普可泮胶囊获美国FDA常规批准", "content": "诺华近日宣布，美国食品药品监督管理局（FDA）已授予盐酸伊普可泮胶囊常规批准，用于减缓存在疾病进展风险的成人原发性免疫球蛋白A肾病（IgAN）患者的肾功能下降。盐酸伊普可泮胶囊是一款同类首创的补体抑制剂，此前已于2024年8月获得FDA的加速批准，用于降低原发性IgAN患者的蛋白尿。本次批准在FDA授予的优先审评资格下完成。（界面新闻）", "ctime": 1784865941, "time_str": "12:05:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260724/c678410127.shtml"}, {"id": "4798653", " // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
