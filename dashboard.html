 "title": "铁路“轻装行”服务范围扩大 新增101座车站可预约", "content": "为更好地满足旅客出行需求，铁路部门在暑运期间进一步扩大“轻装行”服务覆盖范围。新增吉林、赤峰、牡丹江、运城、临汾、包头、乌兰察布、新乡、威海、烟台、淄博、苏州、无锡、三亚、海口、哈密、格尔木等101座车站，办理车站总数达到212座，服务站点基本覆盖省会城市、直辖市、计划单列市。此次扩大服务范围，保持“轻装行”服务的预约方式、受理流程等不变。已购车票的旅客可通过铁路12306App、微信小程序及中铁快运微信小程序预约“轻装行”服务。在同城距离车站35公里内，旅客根据实际需要可选择以下两种“轻装行”服务。一是出发旅客“门到站”行李搬运服务。旅客在开车前48小时至4小时预约，“轻装行”工作人员到指定位置上门收取符合托运规定的行李并搬运至出发车站，通过安检后，在开车前30分钟将行李存入服务柜或在开车前10分钟送至站台。二是到达旅客“站到门”行李搬运服务。旅客在列车到站前24小时至1小时进行预约，“轻装行”工作人员在列车到达站台或到站服务柜取件后5小时内送达指定位置。（央视新闻）", "ctime": 1783487755, "time_str": "13:15:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260708/c678032350.shtml"}, {"id": "4674171", "title": "软件开发板块震荡走高，绿盟科技20cm涨停", "content": "软件开发板块震荡走高，绿盟科技20cm涨停，南天信息、大恒科技此前封板，达梦数据、拓维信息、亚信安全跟涨。", "ctime": 1783487627, "time_str": "13:13:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260708/c678032321.shtml"}, {"id": "4674161", "title": "厄瓜多尔与秘鲁陆路口岸全部恢复开放", "content": "厄瓜多尔政府部长纳塔莉·莫里略7日表示，总统丹尼尔·诺沃亚已下令重新开放该国南部洛哈省与秘鲁接壤的陆路边境口岸。至此，两国间的陆路口岸全部恢复开放。 莫里略当天通过社交平台发布消息说：“我们曾临时关闭位于洛哈省的南部边境，以遏制武器走私，并加强边境管控。今天，在对该措施实施效果进行评估后，总统丹尼尔·诺沃亚已决定重新开放边境。” 莫里略表示，由厄国家警察和武装部队组成的安全联合行动机制将继续在边境地区部署力量，以确保边境管控和厄民众安全。 厄瓜多尔和秘鲁之间一共有三个陆路口岸，其中两个位于厄南部的洛哈省。自去年12月起，作为安全措施的一部分，厄政府暂停了洛哈省马卡拉和萨波蒂约两个边境口岸的通行。(新华社)", "ctime": 1783487519, "time_str": "13:11:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260708/c678032303.shtml"}, {"id": "4674149", "title": "我国起吊能力最大全回转半潜起重船今天交付投用", "content": "7月8日，我国起吊能力最大全回转半潜起重船“四航永盛”号在广东江门正式交付。这是一艘集起重、海上运输功能于一身的非自航半潜驳船，船长110米，型宽43.8米，型深8米，运载面积4800平方米，相当于大型物流中心一整层仓储库区的面积。该船艉部设有一台巨大的全回转变幅式起重机，起重机臂长149米，最大起重高度达172.5米，相当于在50多层楼的高空精准“抓取”货物。船舶在固定艉吊时，可一次吊起2200吨重的货物，相当于一次性吊起1500辆家用小汽车，是目前国内起吊能力最大的全回转半潜起重船。（央视新闻）", "ctime": 1783487282, "time_str": "13:08:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260708/c678032263.shtml"}, {"id": "4674143", "title": "南向资金净买入超110亿港元", "content": "据同花顺iFinD数据，截至目前，南向资金净买入超110亿港元，其中港股通（沪）买入超52.40亿港元，港股通（深）买入超57.65亿港元。", "ctime": 1783487170, "time_str": "13:06:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260708/c678032234.shtml"}, {"id": "4674139", "title": "港股科网股午后继续走高，阿里巴巴大涨10%", "content": "港股科网股午后继续走高，阿里巴巴-W大涨10%，快手-W涨近7%，小米集团-W涨超6%，百度集团-SW涨超5%。", "ctime": 1783487158, "time_str": "13:05:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260708/c678032230.shtml"}, {"id": "4674079", "title": "中老铁路跨境货物运输量突破2000万吨", "content": "记者今天从国铁昆明局了解到，截至7月8日，中老铁路跨境货物运输量累计突破2000万吨，开行跨境货物列车超2.3万列。中老铁路自2021年12月3日开通运营以来，跨境货物运输量节节攀升——开通首年即突破100万吨，2023年突破500万吨，2024年突破1000万吨。今年以来，中老铁路跨境货物运输持续保持高位运行，日均运输跨境货物1.7万吨，同比实现稳定增长，全线累计货物运输量也突破2000万吨大关。（央视新闻）", "ctime": 1783486738, "time_str": "12:58:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260708/c678032163.shtml"}, {"id": "4674065", "title": "香港财政司司长陈茂波：今年稍后将再次出访沙特阿拉伯", "content": "香港财政司司长陈茂波表示，计划今年稍后再次率领代表团访问沙特阿拉伯，将到访当地基础设施、绿色科技、医疗保健和先进制造领域的龙头企业。访问团成员包括来自金融、投资和专业服务行业精英，将共同探讨具体项目，以深化香港与中东之间伙伴关系。（界面新闻）", "ctime": 1783486564, "time_str": "12:56:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260708/c678032132.shtml"}, {"id": "4674063", "title": "韩国综指跌幅扩大至6%", "content": "韩国综指跌幅扩大至6%，现报7191.33点。个股方面，三星电子跌超7%，SK海力士跌超4%。", "ctime": 1783486546, "time_str": "12:55:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260708/c678032131.shtml"}, {"id": "4674021", "title": "韩国智库：芯片繁荣对冲制造业疲软，韩国经济仍处复苏轨道", "content": "韩国官方智库周三表示，韩国经济仍处于复苏轨道，芯片产业的繁荣抵消了整体制造业的放缓。韩国开发研究院（KDI）在月度经济评估报告中指出，在强劲的人工智能相关需求推动下，韩国的出口继续“强劲”扩张。韩国6月单月出口首次突破1000亿美元大关，达到1022.5亿美元，同比增长70.9%，再创历史新高。KDI表示：“尽管半导体出口量增速有所放缓，但在价格持续上涨的支撑下，出口额仍保持强劲。”在存储芯片需求激增的推动下，半导体出口额接近三倍，达到448.2亿美元，月度出口首次突破400亿美元。不过，KDI指出，制造业产出略有下滑，因“半导体前期快速增长的势头有所放缓，其他板块仍显低迷”。KDI补充称，高油价和韩元兑美元走弱可能“继续对价格构成上行压力，增加进一步加息的风险，从而拖累消费复苏”。", "ctime": 1783486001, "time_str": "12:46:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260708/c678032090.shtml"}, {"id": "4674019", "title": "阿布扎比国家石油公司与韩国签署协议 扩大原油供应", "content": "阿布扎比国家石油公司（ADNOC）宣布，已与韩国签署协议，扩大在原油供应、应急供应协调和战略原油储存领域的合作。包括向韩国供应至多2400万桶阿联酋原油。阿布扎比国家石油公司和韩国计划支持增加对国内炼油厂的长期原油供应，加强在紧急情况下的合作，并促进韩国境内国际联合原油储备方面的合作。（新浪财经）", "ctime": 1783485997, "time_str": "12:46:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260708/c678032089.shtml"}, {"id": "4674007", "title": "韩国KOSPI指数跌幅扩大至5%", "content": "韩国KOSPI指数跌幅扩大至5%，较6月高点跌超20%。", "ctime": 1783485492, "time_str": "12:38:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260708/c678031989.shtml"}, {"id": "4674005", "title": "青岛创投风投大会召开，青岛市基金产业发展联盟成立", "content": "7月8日，2026·青岛创投风投大会在青岛国际会议中心召开。会上，青岛市基金产业发展联盟正式成立，联盟已吸引超100家机构加盟，涵盖国有企业、头部投资机构、金融机构、中介服务机构、科研院所等，旨在搭建政企联动、多方协同的产融对接平台，培育壮大长期资本、耐心资本。同时，青岛市政府与上海浦东发展银行、国泰海通证券、中泰证券签署战略合作协议。青岛市委金融办与工商银行、农业银行、中国银行、建设银行、交通银行五大银行国际投行共同启动了赋能青岛万千科创仪式。大会聚焦青岛市“10+1”创新型产业体系，相关区市、部门集中签约12个基金项目，主要涉及先进制造、新能源、航空航天、海洋电子信息等重点领域，构建起“央地合作、市区联动”的项目融资矩阵。（人民财讯）", "ctime": 1783485410, "time_str": "12:36:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260708/c678031983.shtml"}, {"id": "4673999", "title": "韩国交易所对KOSPI指数启动熔断机制", "content": "韩国交易所对KOSPI指数启动熔断机制。", "ctime": 1783485256, "time_str": "12:34:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260708/c678031940.shtml"}, {"id": "4673997", "title": "伊朗已故最高领袖哈梅内伊悼念活动在伊拉克南部举行", "content": "当地时间8日6时起，伊朗已故最高领袖哈梅内伊悼念活动自伊拉克南部城市纳杰夫开始举行。据伊拉克官方此前公布的安排，载有哈梅内伊灵柩的车队将继续驶往伊拉克南部城市卡尔巴拉，并于当天16时在该地继续举行悼念活动。2月28日，美国和以色列对伊朗发动军事打击，哈梅内伊在空袭中遇害。（央视新闻）", "ctime": 1783485235, "time_str": "12:33:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260708/c678031935.shtml"}, {"id": "4673979", "title": "调查显示美国6月消费者通胀预期升温", "content": "美国纽约联邦储备银行7日发布的月度调查数据显示，6月美国消费者对近期和中期的通胀预期回升，长期通胀预期则保持不变。这项线上调查覆盖大约1300个美国家庭，持续整个6月份。数据显示，与前一个月相比，美国消费者对未来1年通胀预期中位数增加0.2个百分点至3.7%，为2023年9月以来最高水平；对未来3年通胀预期升高0.2个百分点至3.3%，为2022年6月以来最高水平。同时，消费者对未来5年通胀预期维持在3%不变。调查还显示，虽然消费者对未来1年食品、大学教育和汽油成本涨幅预期下降，但对医疗保健和房租成本上涨预期上升。同时，消费者对未来1年就业市场状况的预期有所改善，对家庭财务状况前景预期更为乐观。（新华社）", "ctime": 1783484759, "time_str": "12:25:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260708/c678031862.shtml"}, {"id": "4673977", "title": "海通国际张忆东：压力进一步释放后AI行情有望重回上行", "content": "海通国际首席经济学家张忆东7月8日表示，6月下旬美联储议息会议之后，加息预期升温，美元持续走强，上半年结束前围绕业绩基准的配置再平衡，这些因素叠加上META算力事件引发的AI需求担忧，最终导致7月初全球AI科技股大幅震荡调整。张忆东认为，AI行情调整的时间还不够充分，仍需要以时间换空间释放风险。当前全球主要股市尚未充分price in强势美元的影响以及高通胀黏性、美联储加息预期的影响，另外，微观流动性方面，AI行情交易过度拥挤的情况、AI相关股权和债权融资压力都需要时间缓解。从调整空间上看，短期大幅下跌后，美元、油价通胀和微观拥挤等三重扰动风险得到初步释放，仍未完全消化，后续AI行情有望从急跌转向震荡拉锯、分化缓跌，同时消费及红利资产等避险资产获得短期强势，但是，待压力进一步释放后，AI行情仍有望重回上行。（人民财讯）", "ctime": 1783484676, "time_str": "12:24:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260708/c678031845.shtml"}, {"id": "4673971", "title": "韩国综指跌幅扩大至4%", "content": "韩国综指跌幅扩大至4%，现报7349.87点。个股方面，三星电子跌超4%，SK海力士跌超1%。", "ctime": 1783484468, "time_str": "12:21:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260708/c678031820.shtml"}, {"id": "4673959", "title": "民政部：我国三级养老服务网络建设取得初步成效", "content": "民政部有关负责人介绍，截至2025年年底，我国养老机构和设施数量已达39.6万个，其中养老机构护理型床位占比达67.5%。县级公办养老机构基本实现全覆盖，约30%具备县级综合养老服务管理平台功能，60%以上的乡镇（街道）建有区域养老服务中心。城市嵌入式社区养老服务中心、农村邻里互助点和农村幸福院等设施不断增多，专业化、连锁化、品牌化养老服务经营主体逐步培育壮大，各地三级养老服务网络建设取得初步成效。（央视新闻）", "ctime": 1783483992, "time_str": "12:13:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260708/c678031690.shtml"}, {"id": "4673957", "title": "“巴威”趋向我国，交通运输部启动台风四级防御响应", "content": "今年第9号台风“巴威”（超强台风级）的中心今天早晨5时位于台湾基隆市东偏南方向约1650公里的洋面上，中心附近最大风力有17级（60米/秒），中心最低气压为920百帕，七级风圈半径为350至500公里，十级风圈半径280至300公里，十二级风圈半径100至150公里。预计，“巴威”将以每小时20至25公里的速度向偏西方向移动，今天夜间逐渐转向西北方向移动，强度变化不大，逐渐趋向台湾以东洋面。根据防御台风有关预案和工作程序要求，交通运输部决定于7月8日9时启动台风四级防御响应。（人民财讯）", "ctime": 1783483900, "time_str": "12:11:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260708/c678031683.shtml"}, {"id": "4673951", "title": "伊朗伊斯兰革命卫队称打击美军85处军事设施", "content": "当地时间8日，伊朗伊斯兰革命卫队发表声明称，美军当天凌晨对伊朗霍尔木兹甘省沿海地区和马赫沙赫尔的部分沿海基地及非军事设施发动空袭，违反停火协议，并违反《伊斯兰堡谅解备忘录》。声明称，作为对此次袭击的初步回应，伊朗伊斯兰革命卫队海军和航空航天部队实施联合导弹和无人机行动，对位于萨勒曼港、美海军第五舰队巴林总部以及科威特阿里·萨利姆空军基地的85处美军重要军事设施实施打击，并击落一架试图干预行动的MQ－9型无人机。（央视新闻）", "ctime": 1783483796, "time_str": "12:09:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260708/c678031670.shtml"}, {"id": "4673949", "title": "国台办：民进党当局无底线“媚美卖台”换来得寸进尺", "content": "7月8日，国务院台办举行例行新闻发布会，有记者就美国总统特朗普近期再度点名台湾半导体产业提问。发言人陈斌华表示，民进党当局无底线“媚美卖台”，换来的不过是美国得寸进尺、吃干榨净，台积电一旦变成“美积电”，将带动上下游人才、技术、资金整体外迁，成为台湾产业“压死骆驼的最后一根稻草”，受伤害的将是广大台湾民众。（央视新闻）", "ctime": 1783483783, "time_str": "12:09:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260708/c678031667.shtml"}, {"id": "4673941", "title": "美国撤销60天出口豁免 伊朗浮于海上的石油前途未卜", "content": "美国取消一项允许伊朗伊斯兰共和国出售原油的豁免，这导致数千万桶已装载在油轮上的伊朗石油陷入了进退两难。据媒体基于Vortexa数据计算得出的结论，目前约有6300万桶伊朗原油处于海上，有的在运输途中，有的则处于待命状态。这些原油分布在波斯湾及亚洲海域的船只上。其中大多数船只没有显示明确目的地，或者显示“待售”状态，这意味着尚未找到买家。美国的豁免是华盛顿和德黑兰之间临时和平协议的一部分，于6月下旬发布，给予伊朗60天时间出售石油而不受美国制裁。但为了报复伊朗在霍尔木兹海峡袭击油轮，美国撤销了豁免。（新浪财经）", "ctime": 1783483497, "time_str": "12:04:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260708/c678031541.shtml"}, {"id": "4673925", "title": "港股午评：恒生指数涨2.38%，恒生科技指数涨4.34%", "content": "港股午间收盘，恒生指数涨2.38%，恒生科技指数涨4.34%。恒指港股通ETF银华（159318）涨2.29%，港股通科技ETF鹏华（159751）涨3.55%。板块方面，能源设备与服务、半导体产品与设备板块涨幅靠前；生命科学工具板块跌幅靠前。个股方面，智谱涨17.95%，深演智能涨15.96%，芯碁微装涨14.29%，华勤技术涨13.8%，基本半导体涨13.22%；埃斯顿跌13.39%，领益智造跌9.17%，科伦博泰生物跌7.39%，溜溜梅跌7.02%，亮晴控股跌6.65%。", "ctime": 1783483271, "time_str": "12:01:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260708/c678031519.shtml"}, {"id": "4673913", "title": "南向资金净买入超100亿港元", "content": "据同花顺iFinD数据，截至目前，南向资金净买入超100亿港元，其中港股通（沪）买入超48.45亿港元，港股通（深）买入超51.85亿港元。", "ctime": 1783483131, "time_str": "11:58:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260708/c678031480.shtml"}, {"id": "4673903", "title": "南向资金净买入超90亿港元", "content": "据同花顺iFinD数据，截至目前，南向资金净买入超90亿港元，其中港股通（沪）买入超43.40亿港元，港股通（深）买入超46.96亿港元。", "ctime": 1783482592, "time_str": "11:49:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260708/c678031395.shtml"}, {"id": "4673895", "title": "强降雨持续 交通运输部部署广西抢险救灾工作", "content": "7月4日以来，广西中东部和南部持续出现暴雨到大暴雨，局地特大暴雨，累计降水量100～400毫米，局地达900毫米以上。中央气象台预计，7月8日14时至9日14时，广西上述地区还将有大到暴雨，南部局地大暴雨（100～220毫米）。7月8日，交通运输部视频调度广西、广东、辽宁省(区)交通运输厅，要求保持高度警惕，紧盯强降雨密集地区和连续降雨高风险区域，加强调度，完善工作机制，压实各方责任，督促“响应、巡查、管控”主动防御措施落实，坚决防范遏制重特大事故发生。调度强调，要切实做好广西受灾地区抢险救灾工作，重点做好交通运输领域防汛工作，优先保障广西防汛抢险人员、防汛救灾物资运输，做好灾害损毁路段的抢通保通。（人民财讯）", "ctime": 1783482238, "time_str": "11:43:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260708/c678031310.shtml"}, {"id": "4673893", "title": "聚焦政务平台适老化服务建设，首个国家标准发布", "content": "记者今天了解到，市场监管总局（国家标准委）近日批准发布《政务服务平台适老化服务建设指南》国家标准。该标准是我国政务服务领域首个聚焦平台适老化服务建设的标准，标志着政务服务平台适老化服务迈入标准化建设新阶段。该标准通过总结提炼地方政务服务适老化改造的典型经验与成熟做法，以“易用性、包容性、无障碍、安全性”为核心原则，构建了普惠包容、合规安全、触手可及的适老化服务建设指导框架。（央视新闻）", "ctime": 1783482234, "time_str": "11:43:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260708/c678031309.shtml"}, {"id": "4673885", "title": "多位“果链”企业人士：预计苹果折叠机可正常交付 “没听说”产品延期发售", "content": "近期有市场传闻称，苹果首款折叠机产品或因产品组装复杂、良率较低等原因延期发售。对此，财联社记者采访多位苹果链企业人士获悉，苹果折叠机产品方案早已确定，目前相关企业已进入生产旺季，相关产品正常量产中。多位人士还表示，9月交付应该“没问题”，对于产品延期传闻发售，则表示“没听说”。（财联社）", "ctime": 1783481812, "time_str": "11:36:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260708/c678031028.shtml"}, {"id": "4673879", "title": "A股午评：科创50指数“V形回升”半日大涨3% 算力租赁、AI服务器方向集体爆发", "content": "A股三大指数早盘集体上涨，截至午盘，上证指数涨0.52%，深证成指涨0.08%，创业板指涨0.95%，北证50跌0.71%，科创50指数涨3.13%。全市场成交额17155亿元，较上日放量736亿元，全市场超3400只个股下跌。板块题材上，油气开采及服务、贵金属、云计算、计算机设备、算力租赁、旅游及酒店、半导体、软件开发板块涨幅居前；能源金属、电池、电机、工程机械、猪肉、光伏设备、人形机器人概念股跌幅居前。盘面上，半导体板块盘初探底后快速回升，灿芯股份20cm涨停，华虹宏力、盛科通信等股创历史新高。算力租赁板块表现强势，网宿科技、深信服收获20cm涨停，浪潮信息公布业绩预告后一字涨停，数据港、云赛智联等股同样涨停。贵金属板块盘中拉升，招金黄金封板，晓程科技、赤峰黄金跟随上涨，此前中国央行连续20个月增持黄金。此外，油气开采、软件开发、旅游及酒店等板块均有表现。另一方面，新能源产业链早盘下跌，锂矿、能源金属方向领跌，融捷股份跌停，盛新锂能、天齐锂业、永杉锂业跌幅居前。人形机器人概念股表现不佳，日发精机、埃斯顿盘中跌停，绿的谐波大跌10%。", "ctime": 1783481530, "time_str": "11:32:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260708/c678030852.shtml"}, {"id": "4673873", "title": "ETF午评：云计算ETF领涨6.98%，机器人ETF领跌4.66%", "content": "ETF午间收盘涨跌不一，云计算ETF（159890）领涨6.98%，云计算50ETF（560 // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;

  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
