意大雷雨，部分地区已出现暴雨。 据台湾媒体报道，在屏东长治乡、九如乡等地区已出现大面积淹水。有民众贴出长治德荣村的状况，称下厝街淹水，已经有半个轮胎高，几乎连道路都看不见，一整片全是水流。面对猛烈雨势，不少人在社群平台发帖表示，“雨都淹到膝盖”“雨用倒的”。 此前在花莲万里溪上游发现一处堰塞湖，当地林保部门持续空拍观测，预计未来48小时内恐发生溢流，下游受影响区域民众已依照地方政府指示采取疏散避难措施，万荣乡开始执行保全户预防性撤离，凤林镇预计下午1时30分撤离，共超过200人。 台气象部门提醒，下午随着风向角度的变化，配合地形及降雨辐合区改变，显著性降雨可能转移或扩散到其他地区。26日上午各地仍须留意较强降雨，晚间雨势才会略减缓。(新华社)", "ctime": 1782363022, "time_str": "12:50:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260625/c677705120.shtml"}, {"id": "4592737", "title": "天华新能在杭州成立科技公司 含电子专用材料研发业务", "content": "企查查APP显示，近日，宜锂科技（杭州）有限公司成立，法定代表人为王荣刚，注册资本为3000万元，经营范围包含：电子专用材料研发；电子专用材料制造；电子专用材料销售；合成材料销售等。企查查股权穿透显示，该公司由天华新能旗下江苏宜锂科技有限责任公司全资持股。（人民财讯）", "ctime": 1782362621, "time_str": "12:43:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260625/c677705000.shtml"}, {"id": "4592733", "title": "刚果（金）加强疫区人员旅行管理 法国隔离密接者", "content": "刚果（金）政府24日宣布，来自该国埃博拉疫区的人员在进行国内或国际旅行前，须先完成21天自我观察，以降低疫情传播风险。法国24日报告确诊一例从刚果（金）返回的输入性病例后，该国卫生部已确认并隔离5名密切接触者。 刚果（金）政府当天发表公告说，法国报告的病例曾于5月22日至6月19日在刚果（金）东部伊图里省鲁万帕拉镇一处埃博拉治疗中心工作，是一名医生，结束轮换后返回法国。该医生在刚果（金）期间未出现异常症状。 公告说，已同法国政府联系并共享相关数据，以便追踪可能的接触者。刚果（金）政府同时宣布，来自该国埃博拉疫区人员在进行国内或国际旅行前，须先完成21天自我观察，相关部门须加强对潜在暴露人员的管理。 法国卫生部长斯特凡妮·里斯特24日对媒体说，上述确诊病例在医院接受隔离治疗，已确认并隔离5名密切接触者，他们乘坐同一航班返回法国。 刚果（金）政府24日发布的疫情数据显示，该国本轮埃博拉疫情累计确诊病例升至1118例，其中291例死亡。(新华社)", "ctime": 1782362480, "time_str": "12:41:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260625/c677704973.shtml"}, {"id": "4592729", "title": "柬埔寨人民党主席、参议院主席洪森抵京访华", "content": "柬埔寨人民党主席、参议院主席洪森6月25日抵达北京，开始对中国进行正式友好访问。（新华社）", "ctime": 1782362466, "time_str": "12:41:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260625/c677704971.shtml"}, {"id": "4592711", "title": "泰和科技：7N级四氯化硅项目已完成小试", "content": "泰和科技6月25日在互动平台表示，泰和科技的7N级四氯化硅项目已完成小试，暂时还没有规模化生产，中试设备已安装就绪，近期准备投产。该产品暂未形成销售，中试产品质量及出合格产品的时间有不确定性，请注意投资风险。（人民财讯）", "ctime": 1782361761, "time_str": "12:29:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260625/c677704811.shtml"}, {"id": "4592707", "title": "第六次中蒙进出口食品安全磋商机制会议在厦门召开", "content": "6月24日，海关总署副署长王军与蒙古国食品、农业与轻工业部国务秘书扎木巴勒策仁在厦门共同主持召开第六次中蒙进出口食品安全磋商机制会议。双方就落实中蒙两国元首重要共识，围绕深化检验检疫领域务实合作、推进电子证书联网、促进农食产品贸易发展等议题交换意见，达成广泛共识，并签署会议纪要和相关合作文件。（人民财讯）", "ctime": 1782361695, "time_str": "12:28:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260625/c677704796.shtml"}, {"id": "4592705", "title": "国家文物局发布盐业考古最新研究进展", "content": "国家文物局25日在京召开“考古中国”重大项目重要进展工作会，聚焦于盐业考古最新研究进展，发布浙江舟山群岛盐业遗址群、江苏东部沿海地区盐业考古新发现、重庆彭水中堡盐业遗址、山东渤海南岸盐业考古新进展等4项考古研究成果。 浙江舟山群岛盐业遗址群发现有距今约4800至2500年内不同阶段的制盐遗存，是近年来考古调查发现并确认的我国境内目前已知规模最大、起始年代最早的从事海盐生产的遗址群。 江苏东部沿海地区新石器时代晚期至汉代一系列盐业遗址的发现，填补了该区域盐业考古时空两方面空白，首次发现国内汉代完整的制盐生产操作链，并实证了汉代盐渎县治所在地。 自20世纪90年代起重庆市持续开展盐业考古相关研究，近年来彭水县中堡盐业遗址发现从战国至近现代井盐生产的相关遗存，完整呈现了中国井盐两千余年的发展演变历程。 山东渤海南岸首次明确揭示了魏晋南北朝时期和金元时期盐业遗存，完善了该区域盐业发展的时空框架，实证了环渤海“取卤煎盐”生产模式2000多年传统的延续。 据悉，国家文物局将深入践行“大考古”理念，构建“大保护”格局，持续推进“考古中国”重大项目，统筹协调各方力量，凝练、策划重大研究课题，推动考古事业高质量发展。(新华社)", "ctime": 1782361684, "time_str": "12:28:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260625/c677704794.shtml"}, {"id": "4592687", "title": "我国注册船员达208万人", "content": "记者从交通运输部海事局了解到，今天是第十六个“世界海员日”，今年世界海员日的主题为“承天下之商，担海上之险”。截至2025年底，全国注册船员达208万人，同比增长2.6%。全年外派船员18.5万人次，同比增长11.5%，外派规模创近年新高。全球与我国签署船员证书合作文件的国家和地区增至31个。（央视新闻）", "ctime": 1782361277, "time_str": "12:21:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260625/c677704729.shtml"}, {"id": "4592679", "title": "精工科技：公司碳纤维材料尚未向AI眼镜企业供货", "content": "精工科技6月25日在互动平台表示，截至目前，公司碳纤维材料尚未向AI眼镜企业供货。", "ctime": 1782360912, "time_str": "12:15:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260625/c677704581.shtml"}, {"id": "4592669", "title": "B站视频播客单日播放时长突破1亿分钟", "content": "6月25日，B站发布《哔哩哔哩视频播客创作手册》（1.0版本），首次系统披露平台视频播客生态的增长情况、内容特征与创作趋势。其中提到，今年5月13日，B站视频播客单日播放时长首次突破1亿分钟；预计到明年，视频播客日均播放时长有望达到3亿分钟，同比增长300%。在B站，超过一半的视频播客内容时长超过30分钟，2小时以上的“超长播客”投稿量增长了近9倍。（第一财经）", "ctime": 1782360890, "time_str": "12:14:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260625/c677704578.shtml"}, {"id": "4592657", "title": "金融监管总局系统指导保险业做好夏粮农险理赔服务", "content": "国家金融监督管理总局6月25日介绍，受近期强降雨等因素影响，部分夏粮主产省份受灾严重。金融监管总局系统积极推动保险业加大农业保险理赔力度，提升服务水平，有效发挥农业保险经济补偿功能，最大限度降低农业生产损失，稳定农民收益。 数据显示，今年1至5月，全国农业保险已赔付370亿元，受益农户1209万户次。粮食作物保险已赔付60.47亿元，受益农户546.31万户次，其中，小麦保险已赔付30.93亿元，受益农户343.42万户次。农险赔款为受灾农户恢复再生产发挥了重要作用。 据介绍，金融监管总局召开视频调度会，对8个省份和8家主要财险公司开展夏粮农险理赔工作进行调度。金融监管总局要求保险公司规范查勘定损操作、提升理赔服务效率、加大基层资源投入；加强夏粮主产区主粮作物理赔案件回访，及时关注投保农户的投诉，对反映的问题线索进行全面核查和整改。 金融监管总局要求各金融监管局加强与财政、农业农村等相关部门的沟通协调，统筹辖内分局、支局监管资源，紧盯夏粮理赔滞后、服务缺位等突出问题，开展辖内夏粮农险理赔督导工作。(新华社)", "ctime": 1782360835, "time_str": "12:13:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260625/c677704566.shtml"}, {"id": "4592643", "title": "特朗普：委内瑞拉强震造成惨重死亡", "content": "美国总统特朗普24日在社交媒体上说，委内瑞拉刚刚发生的两场强震，“规模都极其巨大，造成惨重死亡，初步报告显示情况不容乐观”。(新华社)", "ctime": 1782360365, "time_str": "12:06:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260625/c677704401.shtml"}, {"id": "4592641", "title": "香港新一份施政报告29日展开公众咨询", "content": "香港特区行政长官李家超今日（25日）宣布，新一份施政报告的公众咨询将从下周一（29日）起展开，并将同时收集市民对香港首份五年规划的意见。（大湾区之声）", "ctime": 1782360287, "time_str": "12:04:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260625/c677704396.shtml"}, {"id": "4592631", "title": "港股午评：恒生指数跌1.38%，恒生科技指数跌1.67%", "content": "港股午间收盘，恒生指数跌1.38%，恒生科技指数跌1.67%。恒指港股通ETF银华（159318）跌0.82%，港股通科技ETF鹏华（159751）跌0.59%。板块方面，客运航空公司板块涨幅靠前；金属与采矿、水务板块跌幅靠前。个股方面，琻捷电子科技涨13.62%，九方智投控股涨12.09%，英矽智能涨9.53%，仙工智能涨8.96%，海清智元涨8.83%；舜宇光学科技跌10.34%，携程集团-S跌10.29%，拓璞数控跌9.14%，招金矿业跌8.83%，中国有色矿业跌8.79%。", "ctime": 1782360069, "time_str": "12:01:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260625/c677704356.shtml"}, {"id": "4592619", "title": "中国信通院人工智能所联合发布《企业级智能体技术与应用研究报告（2026年）》", "content": "6月24日，在第十四届互联网安全大会上，中国信通院人工智能研究所联合三六零安全科技股份有限公司共同发布《企业级智能体技术与应用研究报告（2026年）》。报告聚焦智能体在企业级领域的应用研究，重点围绕企业级智能体的发展概述、技术能力、运营管理、应用实践、趋势展望五大篇章展开。通过梳理企业级智能体技术与应用发展现状，呈现行业应用成效，分析当前问题挑战，旨在加速企业级智能体规模化落地应用，促进产业发展。", "ctime": 1782359603, "time_str": "11:53:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260625/c677704229.shtml"}, {"id": "4592617", "title": "胜宏科技回应压价：已量产高端PCB价格稳定 新产品遵循市场化定价原则", "content": "胜宏科技公告投资者关系活动记录表，其中提到，目前公司已有部分ASIC相关PCB产品进行批量生产，业务进展顺利。供需情况方面，胜宏科技表示，目前公司在手订单饱满，业务进展顺利，订单生产和交付均在正常履行中。从中期来看，高端产品的供给仍将处于相对紧张的状态，下游有充足的需求消化新增产能。有投资者提问胜宏科技是否会被客户压价，公司表示，其前期量产高端产品原材料价格平稳，产品定价较为稳定，新产品定价遵循市场化定价原则，将根据具体产品料号的制造难度、市场供需、原材料价格波动情况等与客户协商定价。", "ctime": 1782359400, "time_str": "11:50:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260625/c677704190.shtml"}, {"id": "4592613", "title": "6月25日午间公告一览：港迪技术全资子公司中标6916.8万元项目", "content": "港迪技术公告，全资子公司武汉港迪智能技术有限公司收到广州港股份有限公司发送的中标通知书，确定港迪智能为广州港煤矿装卸智能化项目中标人。中标金额为6916.8万元。", "ctime": 1782359254, "time_str": "11:47:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260625/c677704118.shtml"}, {"id": "4592609", "title": "IDC：一季度全球手持智能相机市场出货量同比增长33%", "content": "6月25日，国际数据公司（IDC）最新报告显示，2026年第一季度全球手持智能相机市场出货量达到414万台，同比增长33%。销售额超过105亿元人民币，同比增长20%。IDC预计，至2030年，全球手持智能相机市场规模将会超过4000万台，五年复合增长率接近18%。", "ctime": 1782359222, "time_str": "11:47:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260625/c677704110.shtml"}, {"id": "4592591", "title": "中国制冷学会公开征集数据中心液冷技术需求与科技成果", "content": "6月25日，中国制冷学会发布通知，为加速数据中心液冷技术研发与产业化应用，推动绿色低碳解决方案落地，中国制冷学会现依托中国科协“科创中国”数字平台，面向全国公开征集数据中心液冷技术需求及科技成果。后续，中国制冷学会将对征集的技术需求进行梳理和识别，选择其中有代表性的难题，组建专家团队组织专项“线上问诊+线下对接”活动，形成技术解决方案；从征集成果中遴选潜力较大、应用预期较好的项目，策划专场对接会，推动转化落地实施。", "ctime": 1782359038, "time_str": "11:43:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260625/c677704058.shtml"}, {"id": "4592587", "title": "高盛：印尼有望在改革推动下维持MSCI新兴市场地位", "content": "高盛分析师在一份报告中指出，尽管随着更新后的股权披露信息的纳入，指数权重进一步下调和部分股票被剔除的可能性依然存在，但预计印尼仍将维持其MSCI新兴市场地位。MSCI近期维持印尼的新兴市场地位不变，同时认可其市场改革取得的进展，并将最终决定推迟至11月作出。分析师表示，指数调整的不确定性以及充满挑战的经济环境，可能会继续拖累投资者情绪。他们补充道，较高的利率水平有助于稳定印尼盾，但国内需求疲软、信贷增长放缓以及零售销售降温，都可能构成下行风险。高盛维持对印尼股市的“减持”评级。", "ctime": 1782358924, "time_str": "11:42:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260625/c677704029.shtml"}, {"id": "4592585", "title": "曹操出行：将开拓欧洲Robotaxi市场", "content": "曹操出行宣布，公司与全球自动驾驶技术企业May Mobility正式达成战略合作。双方将在国际市场合作探索Robotaxi 大规模商业化运营。", "ctime": 1782358844, "time_str": "11:40:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260625/c677704010.shtml"}, {"id": "4592583", "title": "法国高温天气造成数十万只家禽死亡", "content": "法国农业组织估算，持续多日的高温天气造成该国数十万只家禽死亡，死禽清运处理系统不堪负荷，两大主产区的政府正考虑允许养殖户就地掩埋死禽。（央视新闻）", "ctime": 1782358752, "time_str": "11:39:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.c const SECTORS  = [{"name": "数据要素", "hit_count": 36, "etfs": []}, {"name": "金融", "hit_count": 29, "etfs": []}, {"name": "人工智能", "hit_count": 22, "etfs": []}, {"name": "半导体", "hit_count": 20, "etfs": []}, {"name": "消费", "hit_count": 12, "etfs": []}, {"name": "军工", "hit_count": 5, "etfs": []}, {"name": "新能源", "hit_count": 3, "etfs": []}, {"name": "医药", "hit_count": 2, "etfs": []}];
const META     = {"update_time": "2026-06-25 13:35:10", "sentiment_score": 57.76699029126213, "agents": []};

// 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'

  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
