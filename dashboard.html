 1794323909, "time_str": "23:18:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261110/c681676739.shtml"}, {"id": "5620275", "title": "美国10月核心通胀压力持续", "content": "美国劳工部10日发布的数据显示，由于能源价格涨幅回落，美国10月消费者价格指数（CPI）环比涨幅放缓，但核心通胀环比涨幅保持不变。数据显示，10月消费者价格指数环比上涨0.4%，低于9月的0.6%，但扣除食品和能源后的核心消费者价格指数环比涨幅保持在0.3%不变。\n美国劳工部表示，10月居住成本环比上涨0.3%，占当月消费者价格指数涨幅的30%以上。由于政府拨款问题导致去年同期未能提供调查数据，因而无法提供今年10月消费者价格指数的同比数据。数据显示，10月食品和能源价格指数分别环比上涨0.5%和0.7%。医疗卫生商品价格结束此前几个月连续环比下跌，10月转为环比上涨0.5%。10月交通服务成本环比涨幅进一步提高至0.8%。最新通胀数据公布后，市场对美联储加息预期增强，与短期利率联系密切的美国2年期国债收益率大幅上涨超过15个基点，突破4.72%；同时，美国10年期国债收益率涨幅一度达到10个基点。(新华社)", "ctime": 1794323845, "time_str": "23:17:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261110/c681676730.shtml"}, {"id": "5620249", "title": "IBM将终止对其最大业务部门相关职位的移民担保", "content": "IBM将终止对其最大业务部门相关职位的移民担保。（财联社）", "ctime": 1794323684, "time_str": "23:14:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261110/c681676721.shtml"}, {"id": "5620239", "title": "MiniMax H3-Image正式发布", "content": "MiniMax正式发布MiniMax H3-Image并开放权重。这是一款衍生自H3的图像生成模型，其具备文本生成图像、图像参考和图像编辑能力。它能够在10秒内生成一张4096 x 4096像素、约16MP（4K）的高分辨率图像。(第一财经)", "ctime": 1794323596, "time_str": "23:13:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261110/c681676709.shtml"}, {"id": "5620215", "title": "伊拉克调整与伊朗边境口岸的开放安排", "content": "当地时间11月10日，伊拉克边境口岸管理局宣布，伊拉克与伊朗之间的谢卜边境口岸已重新开放。该口岸已满足了相关技术要求并完成必要程序。此外，伊拉克与伊朗之间的曼达利边境口岸将从13日上午起因技术要求和维护工作临时关闭。伊拉克政府发言人10月21日曾称，出于技术原因关闭谢卜口岸。此前，伊拉克外长侯赛因接受采访时透露，美国已要求伊拉克关闭几乎所有与伊朗接壤的边境口岸，仅保留两个口岸开放。侯赛因称，关闭全部口岸有难度且影响经济，正与美方进行讨论。(央视新闻)", "ctime": 1794323409, "time_str": "23:10:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261110/c681676701.shtml"}, {"id": "5620209", "title": "伊朗否认参与对法国网络攻击", "content": "伊朗外交部10日发表声明，否认法国政府有关伊朗参与对法网络攻击的说法，并对法国的指控表示强烈谴责。声明说，法国对伊朗提出指控，是此前一系列指控的延续，是破坏伊朗与其他国家关系“极不负责任且卑劣的做法”，只会“令美国和以色列感到满意”。声明称，这些指控实际上是在掩盖法国的“治理弱点”，法国政府无法满足民众诉求，未能解决国家管理体系存在的问题。声明还说，法方应对其违反国际法的行为以及对伊朗实施非法干涉承担责任。伊朗将采取必要且适当的措施，维护自身利益和国家安全。法国外长巴罗9日在巴黎参加七国集团外长会后接受媒体采访时称，伊朗对近期法国超市制冷系统受到网络攻击“负有责任”。(新华社)", "ctime": 1794323341, "time_str": "23:09:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261110/c681676692.shtml"}, {"id": "5620185", "title": "高盛分析师表示，预计到2030年，Anthropic的营收将达到6850亿美元", "content": "高盛分析师表示，预计到2030年，Anthropic的营收将达到6850亿美元。（财联社）", "ctime": 1794322935, "time_str": "23:02:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261110/c681676641.shtml"}, {"id": "5620177", "title": "纳斯达克100指数转涨", "content": "美股三大股指拉升，纳斯达克100指数转涨，抹去此前1.3%的跌幅，道指、标普500指数跌幅分别收窄至0.3%、0.17%。", "ctime": 1794322882, "time_str": "23:01:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261110/c681676639.shtml"}, {"id": "5620159", "title": "期市夜盘收盘，国内期货主力合约多数下跌", "content": "期市夜盘收盘，国内期货主力合约多数下跌。跌幅方面，燃油、合成橡胶、低硫燃油跌超2%。涨幅方面，烧碱、棕榈油涨超1%。", "ctime": 1794322828, "time_str": "23:00:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261110/c681676635.shtml"}, {"id": "5620145", "title": "吸引海外央行存金 新加坡争当“世界金库”", "content": "新加坡金融管理局（央行）10日宣布为外国央行、国际金融机构和主权实体提供黄金存储服务，以期巩固新加坡作为关键贵金属交易中心的地位。新加坡金管局在声明中说，新加坡将为外国央行、国际金融机构和主权实体提供存储黄金的安全选择。这些黄金将存储在新加坡国家金库内，现阶段存储库容为500吨，日后将随着需求增加相应扩大。（新华社）", "ctime": 1794322717, "time_str": "22:58:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261110/c681676623.shtml"}, {"id": "5620117", "title": "美国务卿：“没必要”对伊朗开展大规模作战行动", "content": "美国务卿鲁比奥10日在巴黎表示，美国对伊经济制裁和海上封锁成效“非常显著”，没必要对伊朗开展大规模作战行动；华盛顿对达成“真正的协议”持开放态度，但德黑兰条件十分“荒谬”。伊朗索要战事赔偿，特朗普已明确表示不可能。谈及美乌俄三方会谈，鲁比奥认为“非常富有成效”，应扩大会谈范围让欧洲参与。特朗普8日表示，只要美伊谈判取得进展，美国“极不可能”恢复对伊大规模军事行动，但驻中东美军已“准备就绪”，并未排除再次动武可能。（新华社）", "ctime": 1794322614, "time_str": "22:56:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261110/c681676621.shtml"}, {"id": "5620079", "title": "欧盟延长乌克兰军事援助团任期并设驻乌机构", "content": "欧盟理事会9日发布公告，决定将欧盟乌克兰军事援助团任期延长两年至2028年11月15日，并在乌设立常驻机构，拨款近3亿欧元。援助团自2022年10月应乌方请求设立以来，已培训超过10万名乌军士兵，将继续与美国、英国、加拿大和挪威等国际伙伴密切协调，并与北约开展合作。（新华社）", "ctime": 1794322386, "time_str": "22:53:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261110/c681676608.shtml"}, {"id": "5620077", "title": "英伟达盘中跌至170美元：较52周高点回撤30%", "content": "美股盘中，英伟达股价最低跌至170.24美元，较52周高点243.37美元下跌约30.1%。按约241亿股总股本估算，英伟达市值较高点最多蒸发约1.76万亿美元，折合约1.76万亿美元（约1.76万亿美元，即1.76万亿美元）。", "ctime": 1794322339, "time_str": "22:52:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261110/c681676607.shtml"}, {"id": "5620065", "title": "阿联酋阿布扎比国家石油公司一船只在波斯湾遭袭", "content": "当地时间10日晚，阿联酋阿布扎比国家石油公司发布声明称，当天下午该公司一艘船只在波斯湾阿联酋领海遭袭受损。（央视新闻）", "ctime": 1794322185, "time_str": "22:49:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261110/c681676590.shtml"}, {"id": "5620057", "title": "美国10年期国债收益率当日上涨10个基点至4.99%", "content": "美国10年期国债收益率当日上涨10个基点至4.99%。", "ctime": 1794322122, "time_str": "22:48:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261110/c681676582.shtml"}, {"id": "5620047", "title": "肯尼亚北部发生武装袭击事件已造成8人死亡", "content": "肯尼亚北部曼德拉郡10日上午发生武装袭击，已造成8人死亡。据肯尼亚媒体报道，袭击发生在7时左右，涉嫌关联索马里“青年党”的武装分子袭击了一支正在检查肯尼亚农村公路管理局承建公路项目的工程队，死者包括2名警察后备队员、5名施工人员和1名司机。警方正在追捕袭击者并展开调查。“青年党”是与“基地”组织有关联的极端组织，近年来在索马里及其邻国肯尼亚频繁发动恐怖袭击。（新华社）", "ctime": 1794322029, "time_str": "22:47:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261110/c681676565.shtml"}, {"id": "5619991", "title": "也门胡塞武装称袭击沙特哈立德国王国际机场等目标", "content": "当地时间10日，也门胡塞武装称再次袭击沙特哈立德国王国际机场、金融中心、石油设施、军事集结点等目标，使用多枚弹道导弹和无人机展开四轮袭击：第一轮打击国王国际机场及利雅得输油管道泵站，目标直接命中并引发火灾；第二轮打击沙特阿美石油公司布盖格设施；第三轮打击拉赫季省由沙特军官领导的军事集结点，造成大量人员伤亡；第四轮打击利雅得金融中心。胡塞武装警告投资者和企业撤离在沙特的投资，建议转移至和平安全国家，并否认沙特有关麦地那输油管道被袭的说法，称打击的是利雅得管道。其称将继续打击沙特军事集结点，直至沙特停止对也门的军事行动并解除封锁。（央视新闻）", "ctime": 1794321543, "time_str": "22:39:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261110/c681676506.shtml"}, {"id": "5619963", "title": "徐工集团与山东重工潍柴集团座谈交流", "content": "11月10日，徐工集团、徐工机械党委书记、董事长杨东升与山东重工集团党委书记、董事长王志坚与进行座谈交流。双方表示，将进一步在矿山机械、挖掘机械、铲运机械、起重机械、路面机械、新能源等领域拓展业务协同的广度与深度，用高品质产品开拓全球高端市场、引领行业转型升级。（人民财讯）", "ctime": 1794321323, "time_str": "22:35:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261110/c681676495.shtml"}, {"id": "5619941", "title": "中亦科技：暂未涉及人形机器人或工业机器人领域", "content": "中亦科技11月10日在互动平台表示，公司是一家IT基础架构全栈式、全周期的“服务+产品”提供商，主营业务专注于IT基础架构层。截至目前，公司暂未涉及人形机器人或者工业机器人领域。（人民财讯）", "ctime": 1794321246, "time_str": "22:34:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261110/c681676489.shtml"}, {"id": "5619895", "title": "美股开盘：美股三大指数集体低开", "content": "美股三大指数集体低开，标普500指数跌0.66%，道指跌0.46%，纳指跌0.81%。大型科技股方面，特斯拉跌1.56%，英伟达跌2.82%，SpaceX跌2.98%。中概股方面，理想汽车涨3.65%，蔚来跌1.32%。", "ctime": 1794321057, "time_str": "22:30:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261110/c681676461.shtml"}, {"id": "5619875", "title": "如瑞迪博士美股盘前跌超10%", "content": "如瑞迪博士美股盘前跌超10%，现报13.5美元。", "ctime": 1794320981, "time_str": "22:29:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261110/c681676453.shtml"}, {"id": "5619853", "title": "阿里拟分拆平头哥赴港上市 估值或在200亿至300亿美元", "content": "阿里巴巴公告称，拟分拆全资子公司平头哥（上海）技术股份有限公司赴香港联交所主板独立上市。一名专业投资机构人士在接受记者采访时，对平头哥给出的估值为200亿至300亿美元。（财联社）", "ctime": 1794320593, "time_str": "22:23:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261110/c681676417.shtml"}, {"id": "5619815", "title": "海合会决定在科威特设立前方军事指挥部", "content": "海合会秘书长布达维10日表示，成员国当天决定在科威特设立联合军事司令部前方指挥部并配属相应兵力，以加强海湾国家联合防御能力。海合会联合防务理事会第23次会议10日在巴林首都麦纳麦举行，各成员国国防部长出席，作出设立前方指挥部等一系列决定。布达维谴责也门胡塞武装袭击沙特及其宗教圣地，强调海合会成员国与沙特团结一致，全力支持沙特维护国家安全、领土完整和宗教圣地安全。（新华社）", "ctime": 1794320237, "time_str": "22:17:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261110/c681676346.shtml"}, {"id": "5619813", "title": "海合会秘书长欢迎新一轮俄美乌三方会谈在阿布扎比举行", "content": "当地时间10日，海合会秘书长布达维在阿联酋首都阿布扎比举行的新一轮俄美乌三方会谈启动时表示欢迎，称阿联酋积极发挥外交作用，为各方增进理解、开展对话创造了有利条件，赞赏美国促成会谈的努力，希望会谈取得积极成果，推动采取切实措施结束俄乌危机，减轻人道主义、安全和经济影响，实现公正、持久的和平，维护地区和国际安全稳定，重申海合会支持通过和平方式解决争端的所有外交努力和国际行动，相关努力应遵循国际法原则和《联合国宪章》。（央视新闻）", "ctime": 1794320228, "time_str": "22:17:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261110/c681676345.shtml"}, {"id": "5619777", "title": "第九届巴黎和平论坛呼吁多边合作应对全球挑战", "content": "第九届巴黎和平论坛10日在法国巴黎开幕，主题为“从主权到合作”，350多名全球各界人士将就“和平与地缘政治”“发展”“新兴科技”等议题讨论，11日闭幕。联合国秘书长古特雷斯视频致辞呼吁各方在国际法基础上构建多极化世界；论坛主席菲利普·艾蒂安表示主权也意味着承担相互合作的责任。（新华社）", "ctime": 1794319959, "time_str": "22:12:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261110/c681676324.shtml"}, { const SECTORS  = [{"name": "金融", "hit_count": 37, "etfs": []}, {"name": "人工智能", "hit_count": 22, "etfs": []}, {"name": "半导体", "hit_count": 21, "etfs": []}, {"name": "数据要素", "hit_count": 17, "etfs": []}, {"name": "消费", "hit_count": 14, "etfs": []}, {"name": "军工", "hit_count": 11, "etfs": []}, {"name": "医药", "hit_count": 8, "etfs": []}, {"name": "机器人", "hit_count": 6, "etfs": []}];
const META     = {"update_time": "2026-11-10 23:31:28", "sentiment_score": 55.869565217391305, "agents": []};

// 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
