.score-bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s; }

头在澳大利亚被调查", "content": "澳大利亚网络安全监管机构3月31日宣布，正对全球五大社交媒体平台展开调查，指控其涉嫌违反该国16岁以下未成年人社交媒体平台禁令。这是澳方迄今释放的最强烈信号，涉事企业或将面临严厉处罚。此次公告，也是澳大利亚政府首次就该法案的执行情况公开表态。据悉，这项全球首创的监管模式，已受到全球多国关注。(央视新闻)", "ctime": 1774951360, "time_str": "18:02:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260331/c675668355.shtml"}, {"id": "4167979", "title": "复宏汉霖：重组人透明质酸酶注射液的临床试验申请获国家药品监督管理局批准", "content": "复宏汉霖公告，近日，公司自主研发的 HLXTE-HAase02（重组人透明质酸酶注射液）的 1 期临床试验申请（IND）获国家药品监督管理局（NMPA）批准。公司拟于条件具备后于中国境内（不包括中国港澳台地区）开展相关临床试验。", "ctime": 1774951351, "time_str": "18:02:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260331/c675668349.shtml"}, {"id": "4167963", "title": "伊朗官员称当下国家治理不存在内部分歧", "content": "伊朗第一副总统办公室负责新闻与通信事务的副主任阿巴斯·帕祖基3月31日说，当下伊朗国家治理不存在内部分歧，总统、第一副总统、议长等在伊朗最高领袖的指导下治理国家。(新华社)", "ctime": 1774951126, "time_str": "17:58:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260331/c675668248.shtml"}, {"id": "4167961", "title": "皇氏集团修正2025年度业绩预告 预计净利润为-4.9亿元至-4.2亿元", "content": "皇氏集团发布2025年度业绩预告修正公告，预计净利润为-4.9亿元至-4.2亿元。公司原预计净利润为-2.8亿元至-1.9亿元。", "ctime": 1774951114, "time_str": "17:58:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260331/c675668242.shtml"}, {"id": "4167959", "title": "2025年我国保险行业承保新能源汽车同比增长40.1%", "content": "中国精算师协会、中国银行保险信息技术管理有限公司发布我国新能源车险2025年有关赔付信息。数据显示：2025年，我国保险行业承保新能源汽车4358万辆（其中客车4181万辆，货车177万辆），比上年增加1248万辆，增长40.1%；保费收入1900亿元，提供风险保障金额159万亿元；承保亏损56亿元，同比减亏1亿元；综合成本率同比下降1.3个百分点。新能源汽车规模车系数量429个，其中客车370个、货车59个。（央视新闻）", "ctime": 1774951107, "time_str": "17:58:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260331/c675668241.shtml"}, {"id": "4167957", "title": "豪能股份：2025年净利润2.83亿元，同比减少12.22%", "content": "豪能股份发布业绩快报，2025年度公司实现营业总收入26.89亿元，同比增长13.96%；净利润2.83亿元，同比减少12.22%。公司营业收入同比增长，主要系公司将新能源汽车核心零部件作为战略发展的重点，布局的相关产品系列日益丰富且随着产能释放以及客户订单增加等，不断提升公司营收规模。报告期内，公司主营业务运营持续向好，但受计提商誉减值准备的影响，归属于上市公司股东的净利润减少", "ctime": 1774951031, "time_str": "17:57:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260331/c675668218.shtml"}, {"id": "4167955", "title": "深市公司2026年一季报预约披露时间出炉 沃华医药、*ST云网拔得头筹", "content": "深市公司2026年一季报预约披露时间出炉，沃华医药、*ST云网将于2026年4月8日率先披露第一季度季报，凯瑞德、钧达股份、润泽科技、晨化股份等紧随其后，分别在2026年4月9日、2026年4月10日披露。", "ctime": 1774950985, "time_str": "17:56:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260331/c675668206.shtml"}, {"id": "4167953", "title": "对伊朗动武前就想发战争财？美防长被曝试图“重仓”军工基金", "content": "英国《金融时报》3月30日爆料，美国和以色列对伊朗发起军事打击前不久，美国国防部长赫格塞思的一名投资经纪人曾尝试将大笔资金投入军工类基金。由于所涉时机与赫格塞思身份敏感，这一消息引发外界对“内幕交易”的怀疑，可能触发相关部门调查。五角大楼斥之为“无稽之谈”，并要求媒体撤稿。(新华社)", "ctime": 1774950972, "time_str": "17:56:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260331/c675668203.shtml"}, {"id": "4167951", "title": "西部材料：控股股东西北有色院拟减持不超过1%", "content": "西部材料公告，控股股东西北有色金属研究院持有1.2亿股，占24.68%，拟自披露之日起15个交易日后3个月内，通过集中竞价或大宗交易方式减持不超过488.21万股，占1%；减持价格区间按实施时的市场价格确定，减持原因为股东自身资金需求。", "ctime": 1774950862, "time_str": "17:54:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260331/c675668104.shtml"}, {"id": "4167949", "title": "蓝科高新：苏美达受让6000万股成为控股股东", "content": "蓝科高新公告，国机资产与苏美达协议转让公司6000万股股份已于2026年3月31日完成过户登记，苏美达受让股份占公司总股本的16.92%，交易总价款为人民币4.03亿元。本次权益变动后，苏美达持有公司7700万股股份，占公司总股本的21.72%，成为公司控股股东。国机资产与苏美达签署的《表决权委托协议之解除协议》已生效，国机资产将不再委托中国浦发对剩余股份行使表决权。公司实际控制人仍为国机集团。", "ctime": 1774950858, "time_str": "17:54:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260331/c675668103.shtml"}, {"id": "4167945", "title": "福元医药：贝美前列素涂剂获得药物临床试验批准通知书", "content": "福元医药公告，全资子公司安徽福元收到国家药监局核准签发的贝美前列素涂剂的《药物临床试验批准通知书》。贝美前列素涂剂通过促进睫毛的生长，使睫毛变得更长、更浓密和更黑，用于治疗睫毛稀少症。截至目前，安徽福元对贝美前列素涂剂已投入研发费用约人民币436.73万元。", "ctime": 1774950708, "time_str": "17:51:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260331/c675668060.shtml"}, {"id": "4167943", "title": "印尼沉船事故21名船员全部获救", "content": "印度尼西亚搜救部门3月31日说，该国北马鲁古省附近海域发生船只沉没事件后，船上的21名船员已全部获救。 当地时间31日早晨，搜救人员在北苏拉威西省附近海域发现这些幸存者正漂浮在一艘备用艇上。 这艘船3月30日凌晨在北马鲁古省附近海域沉没。30日10时左右，船主向当地有关部门报告沉船事故，搜救行动随即启动。 搜救负责人里扎尔表示，船员人数从最初报告的27人修正为21人，全部为当地渔民。搜救行动已结束，获救人员已被转移至附近医院接受检查。(新华社)", "ctime": 1774950683, "time_str": "17:51:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260331/c675668033.shtml"}, {"id": "4167933", "title": "伊朗逮捕54名美以关联人员", "content": "当地时间3月31日，伊朗情报部门发布消息称，当天在全国四个省份共查明并逮捕54名受雇于美国和以色列的人员。其中，41人被指向以色列方面泄露了包括德黑兰检查站、防御中心及敏感设施在内的位置信息和相关数据。执法人员在行动中缴获通信设备3台、一支手枪以及一套“星链”卫星互联网设备。根据通报，伊方在法尔斯省捣毁两个被指为恐怖组织的小组，逮捕5名成员，成功阻止其实施袭击计划，并查获大量自制爆炸装置及冷兵器。此外，在吉兰省和克尔曼沙赫省，情报部门逮捕8名被指与相关组织有关联的人员，并缴获两支手枪。（央视新闻）", "ctime": 1774950583, "time_str": "17:49:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260331/c675667958.shtml"}, {"id": "4167931", "title": "海油工程：完成收购中海福陆49%股权", "content": "海油工程公告，公司全资子公司海洋石油工程（珠海）有限公司以自有资金8.59亿元人民币收购福陆国际持有的中海福陆重工有限公司全部49%股权。交易完成后，海工珠海所持中海福陆股权比例由51%变更为100%。", "ctime": 1774950566, "time_str": "17:49:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260331/c675667955.shtml"}, {"id": "4167925", "title": "全球首艘能装一万多辆汽车的运输船今天试航", "content": "3月31日，中船广船国际为韩国HMM公司建造的10800车LNG双燃料汽车运输船（PCTC）1号船出海试航，这是目前全球在建的首艘万车级双燃料汽车运输船。据了解，该船体总长230米，型宽40米，结构吃水10.5米，航速约19节，在高效运输与稳定航行间实现完美平衡。其中14层车库甲板设计，可灵活装载电动汽车、氢能源汽车及重型卡车等多元车型，单船最大装车量达10800辆。按5米一台标准车，所装载的车首尾相连，超过50公里。这艘船采用燃油和LNG双燃料推进系统，配置轴带发电机，可以一边航行一边完成发电，从而达到节能减排的目的。这艘船环保性能卓越，满足国际海事组织Tier Ⅲ排放标准。（央视新闻）", "ctime": 1774950480, "time_str": "17:48:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260331/c675667931.shtml"}, {"id": "4167923", "title": "海亮股份：控股子公司拟投资50.5亿元建设年产6.75万吨铜箔生产线项目", "content": "海亮股份公告，控股子公司甘肃海亮新能源材料有限公司拟在浙江省诸暨市投资建设年产6.75万吨铜箔生产线项目。项目将由甘肃海亮投资设立全资子公司浙江海亮新能源材料有限公司作为实施主体，分三期进行建设，预计全部投产后形成约6.75万吨/年电解铜箔生产能力。项目总投资额预计为50.5亿元，其中固定资产投资额预计38.5亿元。", "ctime": 1774950387, "time_str": "17:46:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260331/c675667897.shtml"}, {"id": "4167921", "title": "B站AI创作产品“updream”已开启内测", "content": "B站面向专业创作者自研的AI视频创作产品“updream”已开启内测。同日，B站首届AI创作大赛落幕，平台于颁奖活动中透露，首批创作者们已通过邀请码参与“updream”的内测。公司披露的数据显示，2026年第一季度，每天有将近2400万人在B站观看AI相关内容。（界面新闻）", "ctime": 1774950360, "time_str": "17:46:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260331/c675667889.shtml"}, {"id": "4167919", "title": "九联科技：向特定对象发行股票申请获同意", "content": "九联科技公告，公司收到中国证券监督管理委员会出具的《关于同意广东九联科技股份有限公司向特定对象发行股票注册的批复》（证监许可〔2026〕608号），同意公司向特定对象发行股票的注册申请。公司董事会将按照批复文件和相关法律法规的要求及公司股东会授权，在规定时间内办理本次简易程序向特定对象发行股票的相关事宜，并将根据该事项的进展情况及时履行信息披露义务。", "ctime": 1774950331, "time_str": "17:45:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260331/c675667844.shtml"}, {"id": "4167905", "title": "中国商火公布9次长征系列运载火箭搭载及拼车机会", "content": "据中国商业火箭微信公众号今日下午消息，2026-2027年中国航天科技集团有限公司运载火箭最新搭载及拼车机会发布，截至2026年3月数据，九次发射任务（长征系列运载火箭）中可用余量共5150公斤，发射窗口期横跨2026年11月至2027年12月。", "ctime": 1774950302, "time_str": "17:45:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260331/c675667798.shtml"}, {"id": "4167897", "title": "中国—刚果（布）共同发展经济伙伴关系协定早期收获安排明日生效", "content": "2025年11月4日，中国和刚果（布）签署《中华人民共和国政府与刚果共和国政府关于共同发展经济伙伴关系协定早期收获的安排》。目前，中刚双方已完成各自国内批约程序，早收安排将于2026年4月1日正式生效。中刚早收安排主要涵盖货物贸易关税减让相关内容。根据安排，中方100%税目产品将对刚方最终实现零关税，刚方的茯苓、花生、可可豆等特色农产品将加速进入中国市场；刚方也将对中方部分产品实施零关税，中方的机械设备、化学品等将更好助力刚工业化进程。双方还就原产地规则和实施程序、机制设置等内容达成一致。（央视新闻）", "ctime": 1774950241, "time_str": "17:44:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260331/c675667785.shtml"}, {"id": "4167893", "title": "小摩：胡塞入局冲击红海航运 油价或再涨20美元", "content": "摩根大通在最新研报中指出，也门胡塞武装已正式加入持续升级的中东冲突，这将威胁到红海和曼德海峡的石油运输，进而可能使国际油价再上涨20美元/桶。摩根大通大宗商品策略师Natasha Kaneva等人称，冲突不再局限于波斯湾和霍尔木兹海峡，已扩展至红海和曼德海峡，这在红海引入了第二个海上压力点，使全球两条主要的能源贸易走廊同时面临风险。（财联社）", "ctime": 1774950222, "time_str": "17:43:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260331/c675667782.shtml"}, {"id": "4167891", "title": "联想推出两款“养虾”专用终端", "content": "联想集团31日正式发布YOGA AI Mini与Think AI Tiny两款AI原生智能终端，其中面向个人消费市场的YOGA AI Mini精准对标当下被众多用户用于运行OpenClaw的Mac mini。官方信息显示，联想YOGA AI Mini主打一键部署、原生养虾适配、系统级安全防护等核心优势，解决了Mac mini在“养虾”过程中存在的部署复杂、硬件适配不足、安全防护缺失等痛点，成为专为OpenClaw打造的“养虾”专用迷你终端，而Think AI Tiny则切入企业办公场景，完成联想在AI智能体终端ToC+ToB的全市场布局。联想将这两款新品定位为“专门给AI使用的电脑”。(国是直通车)", "ctime": 1774950208, "time_str": "17:43:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260331/c675667772.shtml"}, {"id": "4167889", "title": "以军称暂不调整战时防护指引 继续限制大型集会", "content": "当地时间3月31日，以色列国防军本土守备司令部表示，鉴于伊朗导弹袭击仍在持续，目前暂无计划调整战时防护指引。以方称，现行措施包括限制大型集会和暂停大部分地区的教育活动。数据显示，近两周伊朗对以色列的导弹发射频率已降至每日约10至15枚，低于冲突初期水平。以方还表示，相关袭击已造成以色列境内16人死亡，约5500人因房屋受损被迫撤离。（央视新闻）", "ctime": 1774950169, "time_str": "17:42:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260331/c675667760.shtml"}, {"id": "4167871", "title": "美媒称美军使用钻地弹袭击伊弹药库", "content": "《华尔街日报》3月30日报道，一名美国官员称，美军使用2000磅（约907公斤）钻地弹， 袭击了伊朗中部伊斯法罕市一个大型弹药库。报道称，美国总统特朗普当地时间30日晚在社交媒体发布了一段没有字幕说明的视频。视频中可以看到一连串爆炸。美国官员称，该视频记录了此次袭击。目前美国军方、以及伊朗方面对此没有回应。(CCTV国际时讯)", "ctime": 1774950050, "time_str": "17:40:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260331/c675667732.shtml"}, {"id": "4167859", "title": "全国新能源汽车动力电池溯源信息平台启动会在天津召开", "content": "2026年3月31日，全国新能源汽车动力电池溯源信息平台启动会在天津召开。来自动力电池、新能源汽车、换电租赁、报废机动车回收拆解、综合利用等企业，以及有关行业协会、国际机构等单位的500余名代表参会。会上，节能与综合利用司有关同志介绍了新能源汽车废旧动力电池回收利用相关工作进展情况及下一步工作考虑。中国汽车技术研究中心有关专家解读了《新能源汽车废旧动力电池回收和综合利用管理暂行办法》，详细介绍了全国新能源汽车动力电池溯源信息平台的操作要点。全国新能源汽车动力电池溯源信息平台，面向产业链上下游相关主体集成动力电池流向数据信息，具备信息溯源、企业履责评价、溯源信息分析、产业专项调研等功能，支撑对动力电池开展全生命周期溯源管理，为提升新能源汽车废旧动力电池回收利用监管水平提供有力技术保障。(工信部)", "ctime": 1774950018, "time_str": "17:40:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260331/c675667718.shtml"}, {"id": "4167849", "title": "英国首相：无论谁施压 我们不会被卷入中东的战争", "content": "英国首相斯塔默30日说，英国不会被卷入中东的战争。他当天在英国伍尔弗汉普顿市作出上述表态。他说：“这不是我们的战争，我们也不会卷入其中。”他还强调：“无论压力多大，无论谁给我们施压，这就是我们的决定。”此前，斯塔默曾表示，在伊朗问题上，英国的任何行动都必须有合法依据和深思熟虑的可行计划。(新华社)", "ctime": 1774949908, "time_str": "17:38:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260331/c675667668.shtml"}, {"id": "4167845", "title": "安德利：拟出资5000万元认购四川鼎兴未来创业投资基金（有限合伙）约16.67%的基金份额", "content": "安德利公告，公司拟作为有限合伙人以自有资金出资人民币5000万元认购四川鼎兴未来创业投资基金（有限合伙）（拟定名，以实际注册登记为准）约16.67%的基金份额。基金认缴出资额为人民币3亿元，公司拟以自有资金认缴出资人民币5000万元，约占基金认缴出资总额的16.67%（基金尚处于募集阶段，基金总认缴出资额及公司持有基金份额比例以最终募集完成情况为准）。", "ctime": 1774949848, "time_str": "17:37:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260331/c675667636.shtml"}, {"id": "4167841", "title": "华懋科技：收到上海证券交易所同意恢复审核的通知", "content": "华懋科技公告，公司拟通过发行股份及支付现金方式购买深圳市富创优越科技有限公司9.93%股权、深圳市洇锐科技有限公司100%股权、深圳市富创优越壹号企业管理合伙企业（有限合伙）100%出资份额、深圳市富创优越贰号企业管理合伙企业（有限合伙）100%出资份额、深圳市富创优越叁号企业管理合伙企业（有限合伙）100%出资份额，并向东阳华盛企业管理合伙企业（有限合伙）发行股份募集配套资金。公司已收到上海证券交易所同意恢复审核的通知。", "ctime": 1774949818, "time_str": "17:36:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260331/c675667624.shtml"}, {"id": "4167835", "title": "分析人士：以色列打造“地区联盟”战略鲁莽且不切实际", "content": "以色列总理办公室前高级顾问丹尼尔·利维日前在接受总台《高端访谈》采访时表示，他认为以色列方面犯了一个错误：有人以为巴勒斯坦问题是次要的、地区核心是伊朗，实则不然。近两年以色列在加沙推行针对巴勒斯坦人的零和消灭计划，其行径有目共睹。利维说，以色列向地区各国传递信号，要各国接受它对巴勒斯坦人的掌控，不许建巴勒斯坦国、不承认巴勒斯坦人的权利，甚至根本不承认“巴勒斯坦人”这一民族的存在。利维认为，巴以局势一旦失控，外溢效应将波及海湾国家和土耳其，以色列方面认为这会迫使这些国家在美国支持下进一步深化与以同盟关系，届时其或许会打造由自己主导的地区联盟，在巴勒斯坦问题上为所欲为。然而这一战略定位极为鲁莽，根本无法实现且完全脱离现实。（央视新闻）", "ctime": 1774949747, "time_str": "17:35:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260331/c675667585.shtml"}, {"id": "4167833", "title": "工信部印发《工业产品质量控制和技术评价实验室管理办法（修订）》", "content": "工信部印发《工业产品质量控制和技术评价实验室管理办法（修订）》，《管理办法》明确，实验室主要任务是聚焦推动产业增品种、提品质、创品牌，面向企业提供高水平质量技术服务，面向行业开展关键共性质量技术攻关、推广先进质量技术方法、培育优秀质量人才、加强质量技术交流合作，面向政府提供质量管理工作决策支撑和技术支持，为增强产业基础能力、加快制造强国和网络强国建设提供质量技术支撑。《管理办法》包含总则、职责、认定、运行、管理、附则等六章28条，自5月1日起施行。(工信部)", "ctime": 1774949656, "time_str": "17:34:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260331/c675667553.shtml"}, {"id": "4167831", "title": "腾讯于3月31日在港交所回购62.1万股，涉资3.006亿港元", "content": "腾讯于3月31日在港交所回购62.1万股，涉资3.006亿港元。", "ctime": 1774949628, "time_str": "17:33:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260331/c675667539.shtml"}, {"id": "4167829", "title": "中国证监会主席吴清会见澳门金融管理局行政管理委员会主席黄善文", "content": "2026年3月30日上午，中国证监会主席吴清会见了来访的澳门金融管理局行政管理委员会主席黄善文一行。 // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>

}

    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
