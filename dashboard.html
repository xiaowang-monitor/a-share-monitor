期低价囤货的红利正在消退，未来采购成本逐步上升，盈利空间可能收窄。16日，针对公司二季度净利润环比下滑、存储行业后市研判等问题，记者致电德明利，公司进行了回应。针对市场关注的公司二季度净利润环比下滑的情况，德明利回应称，二季度净利润表现受多方面因素影响：一是费用端有所抬升，包括研发投入增加、产能建设带来计提增加、股份支付费用提升等；二是公司持续看好后续行业景气度继续向上，积极加大战略储备支撑业务快速扩张，存货战略储备充足；三是客户拓展投入增加，公司企业级存储、嵌入式存储，内存等业务仍处于加速扩张阶段，此类产品认证周期较长、前期适配测试投入较大，且研发费用、销售费用亦有所增加，业务扩张期相应投入需逐步兑现业绩。上述投入均为长期战略布局，并已在二季度开始逐步产生积极贡献，后续将为公司业绩释放奠定扎实基础。(上海证券报)", "ctime": 1784191050, "time_str": "16:37:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260716/c678224920.shtml"}, {"id": "4738541", "title": "美国商务部：特朗普政府为台积电争取到额外1000亿美元的半导体制造投资额度，总额达到2650亿美元", "content": "美国商务部：特朗普政府为台积电争取到额外1000亿美元的半导体制造投资额度，总额达到2650亿美元。", "ctime": 1784190906, "time_str": "16:35:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260716/c678224840.shtml"}, {"id": "4738535", "title": "智翔金泰：泰利奇拜单抗注射液成人中、重度特应性皮炎适应症上市申请获得受理", "content": "智翔金泰公告，近日，公司就泰利奇拜单抗注射液（GR1802注射液）用于成人中、重度特应性皮炎适应症向国家药品监督管理局（NMPA）药品审评中心（CDE）提交了新药上市申请并获得受理。泰利奇拜单抗注射液（GR1802注射液）是一款由公司自主研发的重组全人源抗IL-4Rα单克隆抗体，作用靶点为IL-4Rα。", "ctime": 1784190892, "time_str": "16:34:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260716/c678224810.shtml"}, {"id": "4738517", "title": "百度集团：寻求于香港联合交易所有限公司主板自愿转换为双重主要上市", "content": "百度集团公告，公司董事会批准根据香港联交所指引信HKEX-GL112-22寻求于香港联交所主板自愿转换为双重主要上市的动议。主要转换事项后，公司将成于香港联交所主板及纳斯达克全球精选市场双重主要上市的公司，其A类普通股及美国存托股将继续于两个证券交易所内买卖（视情况而定），且仍可互相转换。", "ctime": 1784190743, "time_str": "16:32:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260716/c678224707.shtml"}, {"id": "4738507", "title": "上海市新增4款已完成登记的生成式人工智能服务", "content": "7月16日，据“网信上海”微信公众号消息，截至7月16日，上海市新增4款已完成登记的生成式人工智能服务，累计已完成200款生成式人工智能服务登记。", "ctime": 1784190686, "time_str": "16:31:26", "stock_code": "", "stock_name": "", "stock_mark 始对乌克兰的访问。报道将此次出访描述为“告别访问”，因为斯塔默已经确定即将卸任英国首相。据《乌克兰真理报》报道，官方并没有提前发布公开信息预告斯塔默对乌克兰的访问。《卫报》提到，在斯塔默访问乌克兰前夕，乌克兰总统泽连斯基撤换了乌克兰国防部长费多罗夫，这一决定在乌克兰引发争议。报道称，对于即将结束英国首相生涯、并渴望强调在其首相任期内英国对乌克兰支持的斯塔默来说，这个时机有点尴尬。（环球网）", "ctime": 1784189955, "time_str": "16:19:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260716/c678224276.shtml"}, {"id": "4738409", "title": "英伟达：新建AI工厂将为日本开发面向物理AI的多模态基础模型项目提供算力基础设施", "content": "英伟达：新建AI工厂将为日本开发面向物理AI的多模态基础模型项目提供算力基础设施。", "ctime": 1784189853, "time_str": "16:17:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260716/c678224243.shtml"}, {"id": "4738391", "title": "COMEX白银期货跌超1%", "content": "COMEX白银期货跌超1%，现报56.85美元/盎司。", "ctime": 1784189721, "time_str": "16:15:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260716/c678224151.shtml"}, {"id": "4738377", "title": "联环药业：控股子公司获达格列净二甲双胍缓释片注册证书，研发投入约963万元", "content": "联环药业公告，公司控股子公司常乐制药于近日收到国家药监局核准签发的关于达格列净二甲双胍缓释片(Ⅰ/Ⅱ/Ⅲ）的《药品注册证书》，注册分类为化学药品4类。该药品配合饮食控制和运动，适用于2型糖尿病成人患者改善血糖控制。2026年第一季度全国二级以上医院达格列净二甲双胍缓释片（Ⅰ）销售额达2.46亿元。截至本公告披露日，常乐制药针对该药品的研发投入约为人民币963.00万元。本次获得《药品注册证书》视同通过仿制药质量和疗效一致性评价。", "ctime": 1784189682, "time_str": "16:14:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260716/c678224140.shtml"}, {"id": "4738359", "title": "优必选与哈萨克斯坦签署全面战略合作备忘录", "content": "近日，优必选科技与哈萨克斯坦共和国代表团在上海举行高层会晤，并在哈萨克斯坦总统托卡耶夫的亲自见证下，正式签署全面战略合作备忘录。此次合作将依托优必选全栈式人形机器人技术优势，深度融合哈萨克斯坦的政策红利与本土市场潜能，旨在打造中亚地区具身智能领域的标杆企业，全面助推哈萨克斯坦科技人才培养体系与高端制造产业升级。根据协议，双方将围绕产业落地、科研创新、教育普及三大核心维度展开深度合作。", "ctime": 1784189592, "time_str": "16:13:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260716/c678224099.shtml"}, {"id": "4738351", "title": "苏垦 rce": "", "url": "https://news.10jqka.com.cn/20260716/c678223659.shtml"}, {"id": "4738317", "title": "大地熊：实控人曹庆香拟增持0.35%～0.70%", "content": "大地熊公告，公司实际控制人、董事曹庆香拟自本公告披露之日起6个月内，通过上海证券交易所系统以集中竞价方式增持公司A股股份，拟增持金额A股：1000万元（含）～2000万元（含），拟增持股份数量A股：40万股～80万股，比例0.35%～0.70%。", "ctime": 1784189111, "time_str": "16:05:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260716/c678222794.shtml"}, {"id": "4738291", "title": "美股中概股盘前普涨，小鹏集团涨4%", "content": "美股中概股盘前普涨，小鹏集团涨4%，哔哩哔哩涨3%，携程、贝壳涨2%，京东、理想汽车、蔚来、阿里巴巴涨1%。", "ctime": 1784188956, "time_str": "16:02:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260716/c678222392.shtml"}, {"id": "4738289", "title": "美股大型科技股盘前多数上涨，SK海力士跌5%", "content": "美股大型科技股盘前多数上涨，微软涨0.6%，谷歌A涨0.3%，SpaceX、亚马逊涨0.2%，苹果涨0.1%，特斯拉跌0.1%，Meta跌0.2%，英伟达跌0.9%，美光科技跌1%，SK海力士跌5%。", "ctime": 1784188950, "time_str": "16:02:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260716/c678222373.shtml"}, {"id": "4738285", "title": "习近平会见哈萨克斯坦总统托卡耶夫", "content": "7月16日下午，国家主席习近平在上海西郊宾馆会见来华出席2026世界人工智能大会暨人工智能全球治理高级别会议的哈萨克斯坦总统托卡耶夫。（央视新闻）", "ctime": 1784188936, "time_str": "16:02:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260716/c678222314.shtml"}, {"id": "4738225", "title": "2030年我国光热发电规模将达1500万千瓦", "content": "中国电力企业联合会数据显示，“十四五”以来，我国光热发电产业年度复合增长率达11.7%，显著高于全球4.24%的增速。“十五五”时期，我国光热发电产业将进一步进入发展快车道，到2030年，我国光热发电总装机规模将达到1500万千瓦左右。（央视新闻）", "ctime": 1784188806, "time_str": "16:00:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260716/c678221899.shtml"}, {"id": "4738221", "title": "中国医药：子公司获依折麦布原料药上市批准，累计投入约1473.19万元", "content": "中国医药公告，公司下属全资子公司天方药业收到国家药监局核准签发的依折麦布《化学原料药上市申请批准通知书》，该药品主要用于原发性高胆固醇血症、纯合子家族性高胆固醇血症等。截至公告日，天方药业在该药品原料和制剂的累计投入约1,473.19万元人民币（未经审计）。", "ctime": 1784188715, "time_str": "15:58:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260716/c678221875.shtml"}, {"id": "4738219", "title": "千问首款AI智能体耳机将在WAIC亮相", "content": "记者获悉，2026世界人工智能大会（WAIC）期间，阿里巴巴旗下个人AI助手千问首款AI智能体耳机将亮相。此前，千问曾宣布年内将推出多款不同形态的AI硬件产品，AI耳机正是其中之一。接近千问AI硬件业务的人士表示，更多产品信息将在WAIC期间正式发布。 (财联社)", "ctime": 1784188681, "time_str": "15:58:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260716/c678221846.shtml"}, {"id": "4738211", "title": "有外媒渲染中国提供开源AI模型是“陷阱”，外交部：反对以意识形态划线", "content": "外交部发言人林剑主持例行记者会。有记者提问，即将在上海举行的2026世界人工智能大会暨人工智能全球治理高级别会议受到国际舆论高度关注。外媒普遍认为，大会将汇聚尖端AI技术，并展现中国在全球AI规则制定方面的努力。但也有观点认为，中国希望通过大会寻求全球南方支持，在AI领域占据“大国竞争”领导地位。《经济学人》等还渲染中国提供开源AI模型是“陷阱”、世界拥抱中国是“高风险”。中方如何看待上述观点？\n林剑表示，人工智能的发展关乎全人类共同福祉，各方应弥合数智鸿沟，守牢安全底线，完善全球治理，共同推动人工智能开放、包容、普惠、向善。中方反对以意识形态划线和技术封锁，致力于统筹发展与安全，愿同各方共享经验，提升全球人工智能创新发展水平。“明天，2026世界人工智能大会暨人工智能全球治理高级别会议将在上海开幕。中方将以本次大会为契机，同各方坦诚交流、凝聚共识，让智能时代的红利更多惠及发展中国家，让技术进步真正促进人类社会的发展繁荣。”", "ctime": 1784188411, "time_str": "15:53:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260716/c678221748.shtml"}, {"id": "4738209", "title": "乌称在黑海击中2艘俄“影子舰队”油轮", "content": "当地时间16日，乌克兰国家安全局通报称，乌方使用“马迈”海上无人艇，在黑海成功击中俄罗斯“影子舰队”旗下的两艘油轮。通报称，这两艘油轮分别为“Louise 1”号与“Banda”号，长期为俄罗斯承担石油运输任务。目前，俄罗斯方面对此暂无回应。（央视新闻）", "ctime": 1784188392, "time_str": "15:53:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260716/c678221730.shtml"}, {"id": "4738197", "title": "柬埔寨首相洪玛奈抵达上海", "content": "7月16日，来华出席2026世界人工智能大会暨人工智能全球治理高级别会议的柬埔寨首相洪玛奈抵达上海。2026世界人工智能大会暨人工智能全球治理高级别会议将于7月17日至20日在上海举行。（新华社）", "ctime": 1784188167, "time_str": "15:49:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260716/c678221586.shtml"}, {"id": "4738193", "title": "柬埔寨首相洪玛奈抵达上海 出席2026世界人工智能大会暨人工智能全球治理高级别会议", "content": "16日下午，柬埔寨首相洪玛奈乘机抵达上海虹桥国际机场，他将出席7月17日至20日在上海举行的2026世界人工智能大会暨人工智能全球治理高级别会议。\n\n2025年中柬签署关于深化人工智能合作的谅解备忘录，加强人工智能发展和治理合作，推动人工智能技术造福两国人民。(央视新闻)", "ctime": 1784188007, "time_str": "15:46:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260716/c678221478.shtml"}, {"id": "4738191", "title": "美武器库存消耗加剧，特朗普再促军工增产", "content": "美国总统特朗普15日要求本国军工企业加快武器生产、扩充产能。乌克兰危机和美伊战事持续消耗美国武器库存，暴露出美国防务供应链短板。特朗普当天在宾夕法尼亚州举行的国防与创新峰会上对防务企业高管说，美国生产武器的速度还需提高。峰会于14日至15日在美国陆军军事学院召开，军方高级将领、防务企业高管、投资者和科技企业高管等与会，讨论加强国防工业基础和加快先进武器系统交付。宾夕法尼亚州联邦参议员戴夫·麦考密克在会上宣布30多项投资和合作计划，涵盖造船、人工智能、机器人、航天和先进制造等领域。（新华社）", "ctime": 1784187963, "time_str": "15:46:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260716/c678221461.shtml"}, {"id": "4738189", "title": "巴基斯坦呼吁美伊停止军事冲突并恢复技术层级谈判", "content": "当地时间16日，巴基斯坦外交部举行记者会，呼吁美国和伊朗停止军事冲突，尽快恢复技术层级谈判。巴基斯坦外交部发言人安德拉比当天在例行记者会上表示，随着过去一周敌对行动持续升级，巴基斯坦再次呼吁各方最大限度保持克制，避免采取任何进一步破坏地区和平与稳定的行动。他强调，巴基斯坦始终认为，实现持久和平、稳定与发展的共同目标，除了持续开展接触、对话和外交之外，没有其他选择。他还指出，所有冲突和争端最终都需要通过对话来解决，而美国与伊朗上月签署的《伊斯兰堡谅解备忘录》仍然是促进和平、相互尊重和共同繁荣的持久框架。（央视新闻）", "ctime": 1784187953, "time_str": "15:45:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260716/c678221458.shtml"}, {"id": "4738179", "title": "“好房子”建设指南再次公开征求意见", "content": "记者16日从住房城乡建设部了解到，于今年3月向社会公开征求意见的《“好房子”建设指南（试行）（征求意见稿）》，在进行相关修改后，于近日再次向社会公开征求意见。 据了解，经过相关修改后的征求意见稿，包括“好房子”内涵与实施路径、安全耐久、舒适健康、绿色低碳、智慧便捷等五部分内容，对新时代“好房子”安全、舒适、绿色、智慧四大核心内涵进行了详细阐释。 经过相关修改后的征求意见稿指出，“好房子”建设是一项系统工程，需要政府、企业、社会多方协同，从好标准、好设计、好材料、好建造、好运维五个方面统筹推进。坚持“问需于民、系统集成”，通过完善标准、精心设计、优选材料、精工建造、长效运维等举措，推动保障性住房率先建成“好房子”，引导商品住房满足多样化住房需求，并结合城市更新将“老房子”改造成“好房子”，惠及千家万户。 经过相关修改后的征求意见稿，内容聚焦群众居住痛点，从场地结构安全、室内健康环境、节能降碳技术、智慧小区与智能家居等维度细化技术要求，兼顾适老适幼、全龄友好、管线分离、空间可变等人性化设计，着力解决渗漏、隔声差、反味堵塞、能耗偏高等民生难题。(新华社)", "ctime": 1784187904, "time_str": "15:45:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260716/c678221431.shtml"}, {"id": "4738177", "title": "中国首个水风光一体化智慧运营大模型发布", "content": "16日，中国首个面向千万千瓦级水风光一体化清洁能源基地的智慧运营大模型在四川发布，通过人工智能+能源，赋能资源预测、电力调度等业务场景，为大型清洁能源基地智能化运行探索新路径。此次发布的雅砻江水风光一体化智慧运营大模型，由国投集团雅砻江流域水电开发有限公司牵头建设，依托国产算力底座和国内首个高海拔岩洞式智算中心，整合流域水文、气象、风光资源、设备运行、电力市场等多源数据，形成覆盖资源预测、电力调度、生产运行等环节的智能辅助决策体系。（新华社）", "ctime": 1784187823, "time_str": "15:43:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260716/c678221399.shtml"}, {"id": "4738171", "title": "习近平将会见哈萨克斯坦总统托卡耶夫", "content": "7月16日下午，国家主席习近平将在上海西郊宾馆会见来华出席2026世界人工智能大会暨人工智能全球治理高级别会议的哈萨克斯坦总统托卡耶夫。(央视新闻)", "ctime": 1784187725, "time_str": "15:42:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260716/c678221344.shtml"}, {"id": "4738163", "title": "日本将购买27500颗英伟达RUBIN芯片，用于构建机器人人工智能系统", "content": "日本计划采购2.75万颗英伟达下一代Rubin芯片，用于开发本土基础机器人AI模型。 新成立的Noetra公司已从政府财政中获得3873亿日元拨款，公司表示将负责统筹该项目并建设一座大型数据中心。这一计划是日本政府降低对外国技术依赖、加强国家安全一系列举措的一部分。Noetra计划于明年3月前发布首个AI模型，并持续进行更新。Noetra总裁Hironobu Tamba表示，长期目标是在未来几年推出专门面向机器人应用的AI模型。开发本土物理人工智能模型是日本打造全球领先人工智能和机器人产业中心总体战略的重要组成部分。日本政府的目标是，到2040年占据全球约60万亿日元机器人市场30%以上的份额。", "ctime": 1784187651, "time_str": "15:40:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260716/c678221324.shtml"}, {"id": "4738153", "title": "市场人士：长鑫科技IPO抽血是个“伪命题”", "content": "近期，长鑫科技集团股份有限公司（以下简称“长鑫科技”）启动发行受到市场高度关注。有一些声音担心：如此大的募资规模和上市后预计体量会不会影响二级市场？甚至把近期科技板块的调整与之相关联讨论。这些探讨的背后，其实还是一个市场回避不了的问题：IPO融资对二级市场走势究竟有怎样的影响？市场资深人士告诉记者：这其实是个伪命题。（证券日报）", "ctime": 1784187562, "time_str": "15:39:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260716/c678221283.shtml"}, {"id": "4738151", "title": "华胜天成：全资子公司拟出售不超过22.82万股天数智芯股票", "content": "华胜天成公告，全资子公司华胜天成科技（香港）有限公司拟出售其持有的上海天数智芯半导体股份有限公司的股票不超过22.82万股，预计交易金额为1.28亿元港币，账面成本为4307万元港币。本次交易已经公司2026年第三次临时董事会会议审议通过，尚需提交公司股东会审议。", "ctime": 1784187552, "time_str": "15:39:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260716/c678221281.shtml"}, {"id": "4738143", "title": "台积电美股夜盘下跌2%", "content": "台积电美股夜盘下跌2%，此前台积电公布二季度业绩。", "ctime": 1784187491, "time_str": "15:38:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260716/c678221251.shtml"}, {"id": "4738137", "title": "外交部：不断拓展中俄各领域互利合作 为两国人民带来更多福祉", "content": "7月16日，外交部发言人林剑主持例行记者会。有记者提问，今年是《中俄睦邻友好合作条约》签署25周年，请问中方如何评价中俄在这25年来在此框架下的发展以及如何看待中俄关系的未来？\n\n林剑表示，今年是《中俄睦邻友好合作条约》签署25周年。5月，习近平主席同普京总统在北京成功会晤，一致同意《中俄睦邻友好合作条约》继续延期，共同引领中俄关系进入更有作为更快发展的新阶段。双方将在两国元首的战略引领下，继续秉持条约确立的宗旨和原则，不断拓展两国各领域的互利合作，为两国人民带来更多福祉，为世界注入更多稳定预期和发展信心。(央视新闻)", "ctime": 1784187424, "time_str": "15:37:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260716/c678221197.shtml"}, {"id": "4738087", "title": "外交部：坚决反对美国国家民主基金会煽炒“中国威胁论”", "content": "7月16日，外交部发言人林剑主持例行记者会。近日，美国国家民主基金会发布报告煽炒“中国威胁论”。林剑在记者会上表示，美国国家民主基金会炮制发布的所谓“报告”充斥谎言和虚假信息，蓄意捏造渲染所谓“威权扩张”的叙事，诋毁抹黑中国对外交往和国际合作，煽炒“中国威胁论”，居心叵测、行为恶劣。中方对此坚决反对。我们敦促美国有关机构和个人端正对华认知，摒弃偏见傲慢，停止政治操弄，多关心自己国家的事。（央视新闻）", "ctime": 1784187252, "time_str": "15:34:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260716/c678221113.shtml"}, {"id": "4738031", "title": "商务部谈台风“美莎克”和“巴威”影响：目前全国生活必需品市场总体供应充足", "content": "7月16日，商务部举行例行新闻发布会。商务部新闻发言人何亚东回应了我国多地受台风“美莎克”和“巴威”影响下的生活必需品保供情况。他说，目前全国生活必需品市场总体供应充足，全国商务系统将持续紧盯市场供应形势，加大货源组织的力度，做好调运支援的准备，切实保障市场的平稳运行。（澎湃新闻）", "ctime": 1784187098, "time_str": "15:31:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260716/c678221023.shtml"}, {"id": "4738009", "title": "京东：推出京麦AI经营中心", "content": "7月16日，据京东黑板报消息，京东日前宣布正式推出京麦AI经营中心，并向商家全量开放22款核心AI工具。京东京麦相关负责人表示，京麦AI经营中心是京东专为商家打造的一站式AI经营聚合平台。目前，京麦AI经营中心首期功能已全面上线。（京东黑板报）", "ctime": 1784187006, "time_str": "15:30:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260716/c678220984.shtml"}, {"id": "4738007", "title": "中方反对美方炮制报告抹黑中国", "content": "7月16日，外交部发言人林剑主持例行记者会。有记者提问，7月15日，美国国家民主基金会召开发布会推介及撰写的“报告”，试探“极限中国与俄罗斯在有罪不罚新时代下的权威影响力”。请问中方对此有何评论？林剑指出，美国国家民主基金会炮制发布的所谓“报告”充斥谎言谬论和虚假信息，蓄意捏造渲染所谓“威权扩张”的叙事，诋毁抹黑中国对外交往和国际合作，翻炒“中国威胁论”，居心叵测、行为恶劣，中方对此坚决反对。林剑表示，长期以来，美国国家民主基金会打着促进民主的幌子，颠覆他国政权，干涉别国内政，煽动分裂对抗，蛊惑干扰舆论，实施思想渗透，造成深重危害，早已劣迹斑斑，臭名昭著，为国际社会所不耻。林剑强调，中国始终坚持在和平共处五项原则基础上，同世界各国发展友好合作，坚持同世界共享发展机遇，维护国际公平正义，被公认为世界和平的建设者、全球发展的贡献者、国际秩序的维护者。“我们敦促美国有关机构和个人端正对华认知，摒弃偏见傲慢，停止政治操弄，多关心自己国家的事。”（北京日报）", "ctime": 1784186984, "time_str": "15:29:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260716/c678220965.shtml"}, {"id": "4737999", "title": "伊朗军方：若敌对行动持续，冲突将扩展至新领域", "content": "当地时间16日，伊朗军方发言人穆罕默德·阿克拉米尼亚表示，域外国家应在相互尊重基础上与伊朗开展交往，伊朗武装力量已做好维护国家安全和国家利益的充分准备。阿克拉米尼亚表示，伊朗始终主张同地区邻国和伊斯兰国家发展合作与兄弟关系，无意与其发生对抗。阿克拉米尼亚还表示，伊朗武装力量仍有相当一部分能力尚未展示。如果针对伊朗的敌对行动持续，伊方将根据实际情况作出回应，且回应将超出对手预期，冲突也将扩展至新的领域。（央视新闻）", "ctime": 1784186868, "time_str": "15:27:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260716/c678220906.shtml"}, {"id": "4737983", "title": "四川2026上半年GDP达3.36万亿元，同比增长4.8%", "content": "四川省统计局官微消息，根据地区生产总值统一核算结果，2026年上半年四川地区生产总值（GDP）为33629.45亿元，按不变价格计算，同比增长4.8%。其中，第一产业增加值1953.46亿元，同比增长3.6%；第二产业增加值11641.08亿元，增长4.9%；第三产业增加值20034.92亿元，增长4.8%。分产品看，锂离子电池增长62.7%，智能电视增长52.2%，集成电路增长18.6%，工业机器人增长15.7%。", "ctime": 1784186675, "time_str": "15:24:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260716/c678220835.shtml"}];

  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
