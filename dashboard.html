  color: var(--text-primary);

.card {

}
.card:hover { background: var(--bg-card-hover); border-color: #334155; }
.badge {

}
.badge-s { background: rgba(239,68,68,0.2); color: #ef4444; }

.score-bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s; }
.up { color: var(--red); }
.down { color: var(--green); }
.pulse { animation: pulse 2s infinite; }
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}
.glow { box-shadow: 0 0 20px rgba(59,130,246,0.15); }

万亿元，较上日此时放量2747亿元", "content": "据同花顺iFinD数据，沪深京三市成交额超2.1万亿元，较上日此时放量2747亿元，预计全天成交金额约3.2万亿元。截至目前，沪市成交额9473亿元，深市成交额11473亿元，北证50成交额132亿元。", "ctime": 1778043633, "time_str": "13:00:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260506/c676469516.shtml"}, {"id": "4323111", "title": "日元大幅上扬 美元全线走软", "content": "日元兑美元汇率一度上涨1.4%，延续了日本4月30日干预市场支撑日元汇率后引发的涨势。周三亚洲交易时段，日元兑美元一度升至155.7。日本政府在4月末对外汇市场进行了2024年以来的首次干预，推动日元盘中一度飙升3%。尽管日本官方拒绝直接评论当局是否进行了干预，但知情人士称干预确实发生，而对日本央行账目的分析表明，干预规模可能约为345亿美元。", "ctime": 1778043541, "time_str": "12:59:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260506/c676469492.shtml"}, {"id": "4323105", "title": "JSR将与台积电共同开发先进光刻胶产品", "content": "全球第二大光刻胶供应商日本JSR与中国台湾当地企业合资成立新公司，计划投资数十亿日元新建生产基地，力争最早2028年投产。同时，JSR还将与台积电共同开发先进光刻胶产品。（科创板日报）", "ctime": 1778043377, "time_str": "12:56:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260506/c676469445.shtml"}, {"id": "4323081", "title": "三一重卡考虑香港IPO，或筹资约5亿美元", "content": "三一重卡据悉考虑香港IPO，或筹资约5亿美元。（财联社）", "ctime": 1778043030, "time_str": "12:50:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260506/c676469381.shtml"}, {"id": "4323079", "title": "伊朗最大岛屿防空系统拦截小型飞行器和无人机", "content": "当地时间5月6日上午，伊朗霍尔木兹甘省省长办公室公共关系部发布消息称，格什姆岛传出拦截小型飞行器和侦察无人机的声音。该部门表示，其间“并未造成任何撞击、损坏或爆炸”。格什姆岛是伊朗最大岛屿，位于霍尔木兹海峡北侧。尽管美以伊4月8日达成临时停火协议，但伊朗防空系统近几周仍多次拦截无人机，其中多发生在德黑兰上空。（央视新闻）", "ctime": 1778043010, "time_str": "12:50:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260506/c676469378.shtml"}, {"id": "4323059", "title": "高盛报告：全球石油库存下降或致部分地区供应短缺", "content": "美国高盛集团日前发布的一份研究报告显示，当前全球石油库存正接近达到8年来的最低水平，库存下降速度不一、地区分配不平衡，引发人们对部分地区成品油率先出现供应短缺的担忧。高盛在报告中预计，包括陆上、海上原油储备和成品油库存在内，全球石油总库存目前能够满足101天的需求总量，到5月底可能仅能满足98天的需求总量。成品油方面，全球库存在中东战事爆发前可以满足50天需求，目前仅能满足45天需求。（新华社）", "ctime": 1778042824, "time_str": "12:47:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260506/c676469342.shtml"}, {"id": "4323031", "title": "阿联酋迪拜一在建建筑起火 原因尚不明", "content": "据阿联酋媒体6日报道，迪拜一在建建筑物起火。社交媒体画面显示，现场出现大量浓烟。火灾原因尚不明。（新华社）", "ctime": 1778042690, "time_str": "12:44:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260506/c676469269.shtml"}, {"id": "4323029", "title": "全国铁路“五一”假期累计发送旅客约1.58亿人次", "content": "铁路“五一”假期运输自4月29日启动到今天结束。记者从国铁集团了解到，为期8天的全国铁路“五一”假期运输，累计发送旅客约1.58亿人次，多项指标创出新高。今年“五一”假期叠加各地中小学春假，旅游、探亲、休闲等出行需求旺盛，铁路客流保持高位运行，假期首尾以长途客流为主、中间以短途客流为主。（央视新闻）", "ctime": 1778042630, "time_str": "12:43:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260506/c676469259.shtml"}, {"id": "4323023", "title": "伊朗媒体称特朗普暂停“自由计划”是为掩盖失败", "content": "美国总统特朗普5日宣布暂停“引导”霍尔木兹海峡被困船只通行的“自由计划”行动后，一些伊朗媒体同日称，特朗普此举是为掩盖计划的失败。伊朗法尔斯通讯社和伊朗学生通讯社发文说，特朗普宣布暂停“自由计划”是迫于伊朗的坚定立场和严厉警告，以及美国未能实现该行动的目标。（新华社）", "ctime": 1778042444, "time_str": "12:40:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260506/c676469206.shtml"}, {"id": "4323015", "title": "提升版权保护意识 国家广播电视总局开展电视剧侵权传播集中治理", "content": "近日，国家广播电视总局召开集中治理电视剧侵权传播动员会。会议指出，电视剧（网络剧）侵权传播严重损害制片方、播出方合法权益，破坏广电视听行业健康可持续发展。广电总局立足行业管理职责，会同国家版权局等相关监管部门，压实网络平台主体责任，重点治理非法网站和浏览器、搜索引擎、网盘的电视剧侵权传播问题。会议强调，要坚持标本兼治、综合施治、防治并举，集中治理与常态化落实相结合，做好电视剧侵权传播治理工作与国家版权局“剑网2026”专项行动的有效衔接，加强广电视听媒体宣传，在全社会普及版权知识，提升版权保护意识。未来，在片头加注版权保护重要提示语，将成为各大长视频平台和电视台新上剧集的“标准动作”。（央视新闻）", "ctime": 1778042155, "time_str": "12:35:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260506/c676469112.shtml"}, {"id": "4323009", "title": "美元/日元短线跳水，日内跌超1%", "content": "美元/日元短线跳水，日内跌超1%。", "ctime": 1778042056, "time_str": "12:34:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260506/c676469054.shtml"}, {"id": "4323003", "title": "韩国KOSPI指数日内暴涨7%", "content": "韩国KOSPI指数日内暴涨7%，现报7422.26点。三星电子飙涨16%，SK海力士公司大涨超10%。", "ctime": 1778041976, "time_str": "12:32:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260506/c676469035.shtml"}, {"id": "4323001", "title": "国家数据领域国际合作上海综合试点启动", "content": "记者从5月6日在上海开幕的2026全球数字合作交流会暨全球数据周活动上了解到，在国家数据局指导下，上海作为数据领域国际合作首批试点，正式启动国家数据领域国际合作上海综合试点工作。本次试点聚焦6大板块、17项具体任务，面向2030年，上海着力构建设施领先、规则互认、载体赋能、场景融合的国际数据合作新体系，紧扣释放数据价值、繁荣数字经济、推进数字出海服务，打造“高标准跨境数据新基座、高质量规则互认新体系、高能级国际合作新载体、高协同出海服务新生态”的工作格局，为参与全球数字治理、推动数据跨境便捷流动探索创新。（央视新闻）", "ctime": 1778041969, "time_str": "12:32:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260506/c676469033.shtml"}, {"id": "4322997", "title": "全球AI电源芯片龙头MPS：今年营收目标上调至同比增长85%", "content": "全球电源芯片龙头MPS（Monolithic Power Systems）首席财务官在财报电话会上表示，受光模块和交换机电源需求拉动，公司将制造产能目标从40亿美元上调至约60亿美元。他提到，今年一季度后，管理层看到去年开始的强劲订单势头仍在延续，有信心把将今年的营收目标进一步上调，预计将同比增长约85%。（界面新闻）", "ctime": 1778041851, "time_str": "12:30:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260506/c676469009.shtml"}, {"id": "4322977", "title": "泰国4月整体通胀率达2.89%，创三年多新高", "content": "泰国商务部周三公布，泰国4月整体居民消费价格指数同比上涨2.89%，为三年多来最大涨幅；3月该指数曾同比下降0.08%。商务部表示，能源价格高企推升了通胀水平，本次数据远高于媒体调查预估的1.81%涨幅。这是自2025年3月以来泰国整体CPI首次实现同比上涨，同时创下2023年2月以来的最高同比增幅。泰国商务部维持今年全年通胀预期在1.5%至2.5%区间，处于央行1%至3%的目标区间之内。剔除波动较大的能源及生鲜食品价格后，泰国4月核心CPI同比上涨0.83%。泰国贸易政策与战略办公室主任南塔蓬 吉拉莱萨蓬在新闻发布会上表示，受能源价格影响，预计5月整体通胀率将达3.06%，二季度整体通胀率为3.67%。南塔蓬称，尽管经济增速放缓、通胀居高不下，但泰国经济并未陷入滞胀。（新浪财经）", "ctime": 1778041410, "time_str": "12:23:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260506/c676468908.shtml"}, {"id": "4322967", "title": "五一假期长三角铁路发送超2138万人次，同比增长超5.6%", "content": "5月6日，记者从中国铁路上海局集团有限公司获悉，刚刚过去的“五一”假期（5月1日-5日）长三角铁路发送旅客约2138.1万人次，日均发送427.6万人次，日均较去年同期多发送旅客约22.8万人次，增幅超5.6%。其中，5月1日单日发送旅客473.8万人次，创上铁集团单日旅客发送量新高，5月5日返程最高峰发送431.1万人次。5月6日，长三角铁路将继续迎来返程客流小高峰，预计当天发送旅客370万人次，计划增开旅客列车260列（其中直通旅客列车121列，管内旅客列车139列，含夜间高铁列车104列），动车组重联256列。（澎湃新闻）", "ctime": 1778041106, "time_str": "12:18:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260506/c676468831.shtml"}, {"id": "4322963", "title": "聚焦四个方面 新版绿色物流国家标准增加这些关键指标", "content": "记者今天了解到，5月1日起，新修订的《绿色物流指标构成与核算方法》国家标准开始实施。相比2018年版标准，新版标准对绿色物流评价指标体系进行升级，从管理、资源、运营、环境四个方面，共提出14个二级指标和42个三级指标。在管理方面，此次修订将“管理指标”提级为一级指标，引导企业在物流活动中采用先进技术和管理方法，优化资源利用，减少环境影响和温室气体排放。在资源方面，此次修订新增可再生能源发电与储能系统、环保油墨使用率等指标，修订载运工具吨公里能耗、减量化包装使用率等指标，从设施建设、设备选用、能源消耗、包装材料等方面，系统推动物流要素资源绿色化转型。（央视新闻）", "ctime": 1778040921, "time_str": "12:15:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260506/c676468708.shtml"}, {"id": "4322959", "title": "中东战火烧高能源成本 意大利瓷砖业遭重创", "content": "近日，受中东局势紧张影响，全球能源价格上涨，意大利瓷砖制造企业的成本也水涨船高。意大利共有超过120家瓷砖制造企业，雇佣1.8万名员工，年营业收入约为60亿欧元。其中大多数企业集中在北部鲁比亚市的萨苏奥洛区，该区域生产了全国超过80%的瓷砖。由于生产瓷砖所用的窑炉高度依赖天然气，该行业极其容易受到天然气供应中断或价格上涨的冲击。（央视新闻）", "ctime": 1778040866, "time_str": "12:14:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260506/c676468697.shtml"}, {"id": "4322945", "title": "5月6日午间公告一览：石四药集团三款药品获国家药监局生产注册批件", "content": "盛龙股份公告，根据中共洛阳国晟投资控股集团有限公司委员会的决定，任命李建科同志为中共洛阳盛龙矿业集团股份有限公司委员会党委委员、副书记、纪委书记，免去张保民同志中共洛阳盛龙矿业集团股份有限公司委员会党委委员、副书记职务，免去王二军同志中共洛阳盛龙矿业集团股份有限公司委员会党委委员、纪委书记职务。石四药集团发布自愿公告，公司成为国内首家获批脂溶性维生素注射液（I）（10ml）药品生产注册批 const META     = {"update_time": "2026-05-06 14:16:51", "sentiment_score": 65.04629629629629, "agents": []};

// 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

function renderHot7() {
  const container = document.getElementById('hot7-list');

        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>

      <span class="text-xs text-gray-400">${item.mentions}次提及</span>

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
