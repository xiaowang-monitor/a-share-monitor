const NEWS     = [{"id": "4569041", "title": "香港交易所宣布优化客户按金规定，提升衍生品市场效率", "content": "6月22日，香港交易所宣布优化旗下衍生产品结算所的客户按金规定，以提升资本效率、降低市场参与者的融资成本，支持香港衍生品市场长远发展。根据修订后的安排，客户基本按金及客户维持按金规定将分两个阶段调整，以便市场准备充分和顺利过渡。第一阶段计划将于2026年9月21日实施，第二阶段待监管机构批准后，预期于2027年3月推行。客户基本按金第一阶段拟由结算所按金的1.33倍下调至1.2倍，第二阶段进一步下调至1.1倍。(中证金牛座)", "ctime": 1782132997, "time_str": "20:56:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260622/c677625820.shtml"}, {"id": "4569033", "title": "英特尔CEO陈立武：已投资人造金刚石晶圆公司，看好芯片散热应用前景", "content": "英特尔首席执行官陈立武近日表示，公司已投资一家金刚石晶圆企业，并将合成金刚石视为具有优异导热性能的新材料之一。陈立武称，随着先进制程持续逼近物理极限，英特尔正加大对玻璃基板、合成金刚石、氮化镓等新材料的布局，希望通过先进封装和材料创新推动芯片技术进一步发展。（界面新闻）", "ctime": 1782132936, "time_str": "20:55:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260622/c677625802.shtml"}, {"id": "4569031", "title": "伊朗司法部门：美以伊战事中丧生者达3519人", "content": "伊朗法尔斯通讯社22日援引伊朗司法机关发言人的话报道说，根据伊朗法医组织最新统计数据，伊朗共有3519人在近期的美以伊战事中丧生。该发言人说，死者中男性3002人、女性517人。发言人未进一步公布死者身份构成、地区分布及伤亡原因等更详细的信息。（新华社）", "ctime": 1782132925, "time_str": "20:55:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260622/c677625799.shtml"}, {"id": "4569023", "title": "飞鹿股份：实际控制人章卫国拟向君拓启航转让10.00%股份，转让总价款3.14亿元", "content": "飞鹿股份公告，2026年6月22日，公司控股股东、实际控制人章卫国与青岛君拓启航智能科技有限公司签署《股份转让协议》，约定君拓启航以协议转让方式受让章卫国持有的公司2295.41万股股份（占公司总股本的10.00%），转让价格确定为13.7元/股，标的股份转让总价款为3.14亿元。本次协议转让完成后，章卫国持股比例将从13.06%降至3.06%，君拓启航将持有公司10.00%股份，公司实际控制人、控股股东将发生变更。本次交易尚需通过深圳证券交易所的合规性审核，并在中国证券登记结算有限责任公司深圳分公司办理协议转让相关过户手续。", "ctime": 1782132836, "time_str": "20:53:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260622/c677625774.shtml"}, {"id": "4568977", "title": "惠誉评定SpaceX拟议发行的高级无担保票据的评级为“BBB+”", "content": "惠誉评定SpaceX拟议发行的高级无担保票据的评级为“BBB+”。", "ctime": 1782132585, "ti 8713", "title": "微软宣布在美国得克萨斯州投建2吉瓦数据中心园区，为公司史上最大单次扩容", "content": "微软6月22日宣布，将在美国得克萨斯州皮科斯市建设新数据中心园区，新增约2吉瓦全球数据中心容量，称这是公司历史上单次最大规模扩容。项目将在未来五至七年内分期投入数十亿美元，高峰建设期预计支持逾6000个施工就业岗位，并创造数百个永久运营岗位。", "ctime": 1782131078, "time_str": "20:24:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260622/c677624117.shtml"}, {"id": "4568705", "title": "我国发生今年大江大河首次编号洪水", "content": "受降雨影响，珠江流域西江出现明显洪水过程。6月22日17时30分，西江干流武宣水文站（广西来宾）流量涨至25000立方米每秒，依据水利部《全国主要江河洪水编号规定》，此次洪水编号为“西江2026年第1号洪水”，为我国今年大江大河首次编号洪水。(新华社)", "ctime": 1782130997, "time_str": "20:23:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260622/c677624092.shtml"}, {"id": "4568695", "title": "德龙激光：拟定增募资不超过3亿 用于激光器生产建设项目", "content": "德龙激光公告，公司2026年度拟向特定对象发行A股股票募集资金不超过3亿元，扣除发行费用后的净额将用于激光器生产建设项目（拟投入17,000.00万元）、总部研发中心建设项目（拟投入7,000.00万元）及补充流动资金（拟投入6,000.00万元）。本次发行股票数量不超过3100.8万股，发行价格将不低于定价基准日前20个交易日公司股票交易均价的80%。本次发行尚需公司股东会审议通过、上海证券交易所审核通过并经中国证监会注册。", "ctime": 1782130930, "time_str": "20:22:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260622/c677624077.shtml"}, {"id": "4568693", "title": "圣泉集团：发行可转换公司债券募集25亿元 拟用于绿色新能源电池材料产业化项目及补充流动资金", "content": "圣泉集团公告，公司向不特定对象发行可转换公司债券，募集资金总额为人民币25亿元，发行数量为250万手（25,000,000张），每张面值100元。扣除发行费用后，募集资金拟用于绿色新能源电池材料产业化项目（20亿元）及补充流动资金（5亿元）。本次可转债信用评级为AA+sti，主体信用等级为AA+sti，评级展望稳定。原股东优先配售股权登记日为2026年6月24日。", "ctime": 1782130902, "time_str": "20:21:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260622/c677624074.shtml"}, {"id": "4568691", "title": "上海市政府常务会议研究战兴产业和数字上海“十五五”规划，部署促进民间投资发展", "content": "上海市委副书记、市长龚正今天（6月22日）主持召开市政府常务会议，要求按照市委部署，全力保持经济韧性增长势头；下大力气提升战略性新兴产业发展能级；促进民间投资高质量发展；扎实推进“数字上海”建设。\n会议指出，二季度是承上启下的关键阶段，各区、各部门要强化实干担当，全力延续一季度经济增长的良好势头，全力冲刺半年经济增长目标。要聚力促进主要行业拉长板、补短板，推动权重行业切实成为“定盘星”、承压行业加快形成“转折点”。聚力支持重点区域挑重担、作贡献，在研究新情况、解决新问题上下功夫、出经验，统筹推进短期稳增长和中长期转型发展。聚力推动经营主体稳预期、强信心，坚持规范与服务并重、政策与活动并举，认真落实好全国统一大市场建设要求，不断提升政策精准性、有效性，同时精心办好重大活动，强化文商旅体展联动，更好助力全市经济增长。\n会议原则同意《上海市战略性新兴产业发展“十五五”规划》并指出，要抢抓新赛道、开辟新领域，更好发挥战新产业对经济发展的引领带动作用。要注重创新引领，紧扣三大先导产业等重点产业链锻造硬核实力，瞄准前沿技术领域深化前瞻布局，围绕细分赛道壮大产业集群。注重改革赋能，推进制度创新，扩大场景开放，强化要素保障，最大程度释放经营主体活力。注重开放合作，深化对内联动和对外开放，推动提升产业发展质效再上新台阶。(第一财经)", "ctime": 1782130889, "time_str": "20:21:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260622/c677624072.shtml"}, {"id": "4568679", "title": "瑞士：欢迎美伊谈判取得“建设性进展”", "content": "瑞士外交部22日发表声明说，瑞士对美伊谈判取得的“建设性进展”表示欢迎，并随时准备支持后续进程。声明说，瑞士注意到了美伊谈判调解方卡塔尔和巴基斯坦当天发表的联合声明。瑞士对21日至22日在比尔根山举行的密集外交会谈所取得的“建设性进展”表示欢迎。声明说，在谅解备忘录的基础上设立一个高级别委员会是“积极的一步”，将有助于规划政治和技术进程的下一阶段。瑞士尤其欢迎各方就60天内达成最终协议的路线图达成一致，认为该路线图为立即启动技术层面讨论创造了条件。声明说，“瑞士将继续秉持其斡旋传统，随时准备支持这一进程”。（新华社）", "ctime": 1782130698, "time_str": "20:18:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260622/c677624020.shtml"}, {"id": "4568677", "title": "*ST棒杰：与7家财务投资人签署重整投资协议，认购价2.6元/股", "content": "*ST棒杰公告，公司及预重整管理人与湖北华楚佳兴六号科技合伙企业（有限合伙）、国民信托有限公司（代表“国民信托-棒杰股份重整财务投资集合资金信托计划”）、疆北星辰（上海）企业管理合伙企业（有限合伙）、广州市清景联科技合伙企业（有限合伙）、兴业资产管理有限公司、严燕茹、邹晓华共7家财务投资人签署《重整投资协议》。根据协议，财务投资人合计受让棒杰股份转增股票3500万股，受让价格为2.6元/股，合计支付对价9100万元。财务投资人承诺自取得标的股票之日起十二个月内不进行处置。此外，财务投资人承诺配合产业投资人共同创设不低于6.5亿元资本公积金。", "ctime": 1782130694, "time_str": "20:18:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260622/c677624016.shtml"}, {"id": "4568671", "title": "藏格矿业：子公司藏格锂业收到项目备案通知书", "content": "藏格矿业公告，近日，公司全资子公司格尔木藏格锂业有限公司收到青海省工业和信息化厅签发的《工业和信息化项目备案通知书》。项目名称为2万吨/年碳酸锂项目一期工程采用循环吸附工艺回收沉锂母液锂离子技术改造项目，建设地点为格尔木市察尔汗盐湖，总投资3200万元，资金来源为企业自筹。项目无新增用地，无新增构筑物，采用循环吸附工艺回收沉锂母液锂离子技术，对原有1万吨碳酸锂生产装置锂钠分离沉锂母液回收系统进行改造，在不新增老卤消耗的情况下，新增2000吨电池级碳酸锂生产能力。建设周期为2026年6月—2026年12月。", "ctime": 1782130679, "time_str": "20:17:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260622/c677624013.shtml"}, {"id": "4568667", "title": "SpaceX公司持有1008亿美元的现金及现金等价物", "content": "文件显示，截至6月19日，SpaceX公司持有1008亿美元的现金及现金等价物。", "ctime": 1782130641, "time_str": "20:17:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260622/c677624004.shtml"}, {"id": "4568659", "title": "罗博特科：拟发行不超过3401.45万股境外上市普通股并在香港联合交易所上市", "content": "罗博特科公告，公司于近日收到中国证监会出具的《关于罗博特科智能科技股份有限公司境外发行上市备案通知书》。备案通知书主要内容如下：一、你公司拟发行不超过3401.45万股境外上市普通股并在香港联合交易所上市。", "ctime": 1782130596, "time_str": "20:16:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260622/c677623992.shtml"}, {"id": "4568615", "title": "伊朗公布已故最高领袖葬礼仪式安排", "content": "伊朗革命烈士领袖纪念委员会22日宣布，已故最高领袖阿里·哈梅内伊的告别、送葬和安葬仪式将于7月4日起在德黑兰、库姆和马什哈德举行。 据伊朗迈赫尔通讯社22日报道，纪念委员会发言人伊曼·阿塔尔扎德在新闻发布会上表示，哈梅内伊遇袭身亡已过去100余天，相关筹备工作此前已完成，但由于战事发展、敌方袭击以及保障民众安全等因素，仪式举行时间被推迟。 阿塔尔扎德说，德黑兰送葬活动路线已最终确定，具体安排将由相关负责人于未来数日内公布。据他介绍，伊朗全国行政和服务机构都参与了仪式的筹备工作。 他说，根据目前安排，7月7日将在库姆举行哈梅内伊及其家属遗体送葬仪式，并举行相关殡礼活动。应伊拉克各界人士要求，7月8日还将在伊拉克什叶派圣城纳杰夫和卡尔巴拉举行送葬仪式，具体时间和地点将由伊拉克方面另行公布。7月9日，将在伊朗东北部圣城马什哈德举行遗体送葬及安葬仪式。(新华社)", "ctime": 1782130426, "time_str": "20:13:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260622/c677623946.shtml"}, {"id": "4568601", "title": "SpaceX启动首期高级无抵押债券发行", "content": "SpaceX启动首期高级无抵押债券发行，将用净收益偿还未偿贷款。（财联社）", "ctime": 1782130292, "time_str": "20:11:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260622/c677623909.shtml"}, {"id": "4568599", "title": "伊朗央行行长：伊朗资产解冻有“显著进展”", "content": "据伊朗塔斯尼姆通讯社22日报道，伊朗中央银行行长赫马提表示，在近期谈判中，被冻结伊朗资产解冻问题取得“显著进展”，相关文件已在本轮谈判期间签署。\n赫马提说，伊朗央行被冻结资产问题是当前谈判中最复杂的议题之一。根据有关安排，未来数日内，相关资金将依据既定条件并按照伊朗中央银行制定的程序逐步投入使用。\n在谈及石油和石化产品出口问题时，赫马提表示，根据伊朗与美国达成的谅解备忘录，涉及伊朗能源出口的制裁豁免机制应已启动。目前已商定由美国财政部外国资产控制办公室负责落实相关安排。(新华社)", "ctime": 1782130270, "time_str": "20:11:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260622/c677623898.shtml"}, {"id": "4568583", "title": "谷歌云与诺基亚宣布合作", "content": "谷歌云与诺基亚宣布合作，将谷歌的Gemini模型整合到诺基亚保障中心。（财联社）", "ctime": 1782130100, "time_str": "20:08:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260622/c677623827.shtml"}, {"id": "4568579", "title": "李强：要大力发展高端装备制造业，加快建设现代化产业体系", "content": "中共中央政治局常委、国务院总理李强6月22日在辽宁省大连市调研。他强调，要深入贯彻落实习近平总书记关于新时代东北全面振兴和建设现代化产业体系的重要指示精神，坚持智能化、绿色化、融合化方向，加强原创性、引领性科技攻关，强化产业基础再造，大力发展高端装备制造业，加快建设现代化产业体系，为高质量发展不断注入新动能。（央视新闻）", "ctime": 1782130088, "time_str": "20:08:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260622/c677623825.shtml"}, {"id": "4568529", "title": "新亚强：孙秀杰持股比例下降至5%", "content": "新亚强公告，信息披露义务人孙秀杰基于自身资金需求减持公司股份。本次权益变动前，孙秀杰持有公司1951.77万股，占公司总股本的6.18%；本次权益变动后，孙秀杰持有公司1578.93万股，占公司总股本的5.00%。", "ctime": 1782129972, "time_str": "20:06:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260622/c677623789.shtml"}, {"id": "4568527", "title": "外汇交易中心离岸人民币外汇衍生品交易有序落地", "content": "据中国外汇交易中心消息，6月22日，工商银行、中国银行、交通银行和中信银行依托中国外汇交易中心交易平台，落地多笔离岸人民币外汇期权、货币掉期等衍生品交易，交易期限从1周到1年期，交易对手覆盖多家境外金融机构。\n6月17日试点政策一经宣布，6家试点银行即达成离岸人民币外汇即期、远期和掉期交易。今日落地离岸货币掉期和外汇期权交易，进一步展现了试点银行离岸人民币外汇衍生品定价及交易能力。\n近日，外汇交易中心平台离岸人民币外汇市场流动性持续优化，交易活跃度进一步提升，目前已有22家机构提供流动性。试点银行中，工商银行、中国银行和交通银行已实现离岸人民币外汇自动化接口报价，持续向市场提供连续、具有竞争力的可成交报价，市场最优买卖报价点差约0.5bp。", "ctime": 1782129966, "time_str": "20:06:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260622/c677623782.shtml"}, {"id": "4568463", "title": "Strategy以总价3490万美元购入520枚比特币", "content": "Strategy以总价3490万美元购入520枚比特币。（财联社）", "ctime": 1782129774, "time_str": "20:02:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260622/c677623693.shtml"}, {"id": "4568445", "title": "6月22日 周一《新闻联播》要闻20条", "content": "1、【牢记初心使命 奋进复兴征程】赓续延安精神 书写时代新篇；\n2、李强在辽宁大连调研；\n3、李强将出席第十七届夏季达沃斯论坛；\n4、王沪宁主持召开全国政协主席会议；\n5、丁薛祥出席第四届中国国际供应链促进博览会开幕式并作主旨讲话；\n6、国家出台多项举措推动利用外资固稳促优；\n7、【在希望的田野上】全国夏播进入高峰 科技赋能提质增效；\n8、海军辽宁舰编队完成远海实战化训练；\n9、全国人大常委会启动青藏高原生态保护法执法检查；\n10、南方多地强降雨 各部门多举措应对；\n11、中央财政下达农业生产防灾救灾资金2.19亿元；\n12、“十五五”时期全国公共机构单位建筑面积碳排放将力争下降8.5%；\n13、端午假期全国各口岸出入境人员666.7万人次；\n14、端午假期全国食品安全总体平稳；\n15、广肇高速新建金马大桥合龙；\n16、伊美比尔根山首轮谈判结束 建立技术性谈判机制 以称将依自身需要在黎南部长期驻留 黎真主党称侵略者必须撤离；\n17、英国首相斯塔默宣布辞职；\n18、俄称打击乌物流中心 乌称持续跨境打击；\n19、美芝加哥发生数十起枪击 至少8人死亡；\n20、欧洲多国发布高温警报。（央视新闻）", "ctime": 1782129725, "time_str": "20:02:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260622/c677623670.shtml"}, {"id": "4568423", "title": "高市以“难保工作时间”回应丑闻质询 引发舆论哗然", "content": "日本首相高市早苗22日在国会答辩期间，面对有关自身丑闻的质询时表示，近期连续回应相关问题已影响其“作为首相的工作时间”。相关言论引发舆论哗然。 近日，日本《周刊文春》杂志连续以邮件、录音等证据爆料，揭露高市阵营在2025年自民党总裁选举及今年众议院选举期间，曾利用人工智能技术制作并传播诽谤、抹黑其他候选人的视频。22日上午，“中道改革联合”众议员后藤祐一在国会就此向高市提出质询，追问其阵营与相关事件的关系。 对此高市回应称，自己近期“曾多次在深夜乃至凌晨致电秘书核实情况”，并称由于连续应对相关问题，“越来越难以保证作为首相的工作时间”。 此番言论引发舆论哗然。立宪民主党党首水冈俊一在记者会上表示，在野党目前都是尽早提前告知政府质询内容，但高市反复以“深夜才看到问题”等理由回避，令人深感遗憾和愤怒。 社交媒体上也批评不断。日本法政大学教授山口二郎表示，高市试图将责任归咎于他人的做法“十分幼稚”。日本前外务省官员孙崎享批评高市的答辩“敷衍搪塞”，并指出，当前丑闻持续发酵的原因正是高市本人始终未能将事实经过说明清楚。(新华社)", "ctime": 1782129675, "time_str": "20:01:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260622/c677623606.shtml"}, {"id": "4568381", "title": "博云新材：2026年至今未向中钨高新子公司供应高端钻针母材 未向日本佑能出口产品", "content": "博云新材公告，公司关注到市场对硬质合金棒材类产品关注度较高，有投资者发布不实言论称“子公司博云东方麓谷基地满产后PCB专用纳米钨棒总产能1800吨/年”“产能从400吨/年扩增至2400吨/年”“向中钨高新供货”“向日企供货份额提升至50%以上”等。公司核实后澄清：博云东方麓谷基地硬质合金棒材类产品合计设计产能约为800吨/年，传闻的1800吨/年与事实严重不符；2025年度纳米晶硬质合金棒材销售收入占公司总营收比例不足7%。2026年1月1日至本公告日，博云东方暂未向中钨高新子公司金洲精工供应高端钻针母材产品，亦未向日本佑能出口高性能硬质合金棒材产品；向鼎泰高科供应极少量的数控刀具钨钢棒料，占同期销售收入比例不足0.1%。", "ctime": 1782129640, "time_str": "20:00:40", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260622/c677623595.shtml"}, {"id": "4568319", "title": "柳江1号洪水洪峰过境柳州市区 超警3.14米", "content": "记者从柳州市防汛抗旱指挥部获悉，今年柳江1号洪水洪峰过境柳州市区，超警3.14米。据了解，柳江柳州水文站于6月22日16时15分出现85.64米的洪峰水位，超过82.5米的警戒水位3.14米，相应流量19600立方米每秒，目前水位缓慢下降。(央视新闻)", "ctime": 1782129554, "time_str": "19:59:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260622/c677623563.shtml"}, {"id": "4568315", "title": "卡塔尔首相：当前首要任务是推动地区局势降温", "content": "当地时间6月22日，卡塔尔首相兼外交大臣穆罕默德表示，卡塔尔当前的首要任务是为地区局势“灭火”，推动局势降温，尽快实现平静与稳定。穆罕默德表示，有关各方必须坚持通过外交途径解决分歧，防止危机进一步升级甚至失控。他还表示，一些国家试图破坏美国与伊朗之间的谈判进程，但卡塔尔及其他斡旋方能够感受到，美伊双方均展现出解决问题的意愿。穆罕默德强调，中东地区任何地点的局势升级，无论是在黎巴嫩还是其他地区，都可能对谈判进程产生影响。（央视新闻）", "ctime": 1782129539, "time_str": "19:58:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260622/c677623560.shtml"}, {"id": "4568295", "title": "前5个月快递业务量同比增长5.2%", "content": "记者6月22日从国家邮政局获悉，前5个月，邮政行业寄递业务量累计完成898.9亿件，同比增长4.3%。其中，快递业务量累计完成828.7亿件，同比增长5.2%。(新华社)", "ctime": 1782129344, "time_str": "19:55:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260622/c677623501.shtml"}, {"id": "4568289", "title": "天原股份：拟定增募资不超过4.79亿元，获宜宾发展控股集团批准", "content": "天原股份公告，公司此前披露2026年度向特定对象发行股票预案（二次修订稿）。近日，公司取得国家出资企业宜宾发展控股集团有限公司批复，原则同意本次修订后向特定对象发行股票事项。本次定增募集资金总额不超过4.79亿元（含本数），发行数量不超过9614.46万股（含本数），定价基准日为发行期首日，发行价格不低于定价基准日前20个交易日股票均价的80%。本次定增尚需经深交所审核通过及中国证监会作出同意注册的决定后方可实施。", "ctime": 1782129322, "time_str": "19:55:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260622/c677623434.shtml"}, {"id": "4568285", "title": "隆扬电子：控股股东及其一致行动人合计持股比例降至69.94%", "content": "隆扬电子公告，公司控股股东隆扬国际及其一致行动人昆山群展商务咨询合伙企业（有限合伙）计划在2026年5月19日披露的《关于控股股东及其一致行动人减持股份预披露的公告》发布之日起15个交易日后的3个月内，以集中竞价和大宗交易方式合计减持公司股份不超过565.45万股（占公司总股本比例为1.99%）。其中，隆扬国际计划通过大宗交易的方式减持本公司股份不超过53万股（即不超过公司总股本的0.19%），群展咨询计划通过集中竞价或/和大宗交易的方式减持本公司股份不超过512.45万股(即不超过公司总股本的1.81%)。2026年6月18日，群展咨询通过大宗交易方式减持16.97万股，占总股本的比例为0.06%。本次权益变动后，控股股东及其一致行动人合计持有的公司股份占公司总股本的比例由70.00%下降至69.94%，本次权益变动触及1%刻度。", "ctime": 1782129294, "time_str": "19:54:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260622/c677623430.shtml"}, {"id": "4568271", "title": "中船特气：股价累计涨幅388.77%，6月23日起停牌核查", "content": "中船特气公告，公司股票价格自2026年5月11日至2026年6月22日期间多次触及股票交易异常波动及严重异常波动，累计涨幅388.77%（经前复权计算）。为维护投资者利益，公司将就股票交易波动情况进行停牌核查，股票将于2026年6月23日（星期二）开市起停牌，自披露核查公告后复牌。截至2026年6月18日，公司滚动市盈率535.1倍，静态市盈率557.73倍，显著高于同行业平均水平。公司提醒投资者注意二级市场交易风险。", "ctime": 1782129088, "time_str": "19:51:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260622/c677623349.shtml"}, {"id": "4568263", "title": "多家银行收紧黄金白银杠杆交易 金银杠杆交易保证金飙至140%", "content": "华夏银行、广发银行、中国银行先后发布官方公告，同步调整代理上海黄金交易所个人贵金属交易业务延期合约保证金比例。其中，华夏银行将全品类金银延期合约保证金统一上调至120%，广发银行将保证金从100%上调至140%，两家银行的最新标准均自6月22日收盘清算时起执行。（中新经纬）", "ctime": 1782129006, "time_str": "19:50:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260622/c677623333.shtml"}, {"id": "4568261", "title": "宏英智能：全资子公司签署6.64亿元储能电站PC总承包合同", "content": "宏英智能公告，公司全资子公司上海宏英新能源科技有限公司作为联合体牵头方，与宁夏交通建设股份有限公司、内蒙古银河电力安装工程有限公司组成的联合体，于2026年6月18日与英卓绿能（甘肃）新能源开发有限公司签署了《英华甘肃白银200MW/800MWh独立储能电站项目工程PC总承包合同》，合同总价款（含税）为人民币6.64亿元。其中，宏英新能源供应设备及完成总承包合同约定工作内容的费用总计（含税）人民币 // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
