20261016/c680778761.shtml"}, {"id": "5406497", "title": "巴克莱：大型科技企业财报是市场信心关键", "content": "由埃马纽埃尔·考牵头的巴克莱策略师团队表示，股市想要在年底前走高，投资者需要看到利率与油价企稳；大型科技企业的财报，是维持市场对人工智能资本开支周期信心的关键。尽管美国通胀高于预期、存在货币收紧可能性、芯片股大跌，且财报季开局喜忧参半，但股票仍存在“小幅上行的有限路径”。考提醒不要全盘抛售人工智能相关个股。考在研报中写道：“人工智能主题行情的高光阶段或许已经过去，这一点完全有可能，因此我们认为投资者应当大幅提高选股标准。”该团队倾向配置更加分散的股票组合，可布局欧洲市场。", "ctime": 1792138451, "time_str": "16:14:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261016/c680778504.shtml"}, {"id": "5406487", "title": "卡尼：外部势力企图分化加拿大", "content": "加拿大总理马克·卡尼当地时间15日晚在艾伯塔省卡尔加里发表讲话，警示“外部势力”正企图分化并控制加拿大，呼吁艾伯塔省选民在即将举行的公投中选择留在加拿大联邦内。（央视新闻）", "ctime": 1792138258, "time_str": "16:10:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261016/c680778061.shtml"}, {"id": "5406483", "title": "我国水稻大面积单产提升取得新进展", "content": "10月16日是世界粮食日。由中国水稻研究所与全国农业技术推广服务中心联合主办的全国水稻大面积单产提升现场推进会当日在浙江衢州江山市召开，集中展示以科技为核心抓手推动水稻整县制单产提升成效，为南方水稻主产区大面积单产提升提供示范样板。会上发布的信息显示，科技正助推良种潜力转化为实际产量。此次现场推进会重点展示了机插壮秧“田中密、丛中稀”的基本苗配置高产栽培模式。该模式在合理提升水稻种植密度基础上，充分发挥壮秧个体生长优势与田间群体均衡优势，目前已在南方双季稻区、南方单季稻区、北方单季稻区等水稻主产区形成较成熟的机插方案。（新华社）", "ctime": 1792138227, "time_str": "16:10:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261016/c680777963.shtml"}, {"id": "5406481", "title": "港股收评：恒生指数涨0.52%，恒生科技指数涨1.16%", "content": "港股收盘，恒生指数涨0.52%，恒生科技指数涨1.16%。恒指港股通ETF银华（159318）涨0.81%，港股通科技ETF鹏华（159751）涨1.15%。板块方面，建筑产品Ⅲ、建筑产品Ⅳ板块涨幅靠前；计算机存储设备、休闲设施板块跌幅靠前。个股方面，上海复旦涨13.11%，易控智驾涨11.28%，映恩生物-B涨10.89%，溜溜梅涨10.86%，迈富时涨9.85%；中环新能源跌9.93%，自由黄金-DRS跌9.41%，赣锋锂业跌6.41%，应星控股跌6.29%，天域半导体跌5.84%。", "ctime": 1792138209, "time_str": "16:10:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261016/c680777844.shtml"}, {"id": "5406477", "title": "金洲管道：2026年第三季度净利润2559.52万元，同比下降28.74%", "content": "金洲管道公告，2026年第三季度营业收入9.74亿元，同比下降15.95%；净利润2559.52万元，同比下降28.74%；扣非净利润2331.56万元，同比下降23.12%。2026年前三季度营业收入30.29亿元，同比下降4.70%；净利润1.11亿元，同比增长18.77%；扣非净利润1.01亿元，同比增长18.58%。", "ctime": 1792138174, "time_str": "16:09:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261016/c680777601.shtml"}, {"id": "5406471", "title": "贝达药业：BPI-57.23万联用临床申请获受理，3个受理号", "content": "贝达药业公告，公司2026年1月申报的BPI-57.23万胶囊临床试验获批开展，目前处于剂量爬坡和剂量回填阶段；近日，全资子公司景曜生物申报的该胶囊联合化疗、PD-1/VEGF双抗、PD-1单抗+含铂化疗、FAK抑制剂、EGFR抗体等方案的临床试验申请获国家药品监督管理局受理，受理号为CXHL2601291、CXHL2601292、CXHL2601293。", "ctime": 1792137963, "time_str": "16:06:03", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261016/c680776686.shtml"}, {"id": "5406467", "title": "商务部：判别具体“出海”情形是否属于技术出口管理的范围，核心在于是否涉及限制类技术从中国境内向境外转移", "content": "商务部回应人工智能大模型“出海”是否属于技术出口管理范围问题，指出判别核心在于是否涉及限制类技术从中国境内向境外转移。此次纳入监管的人工智能技术范围精准有限，绝大部分人工智能技术仍可自由出口。对于纳入限制类的人工智能技术，开展海外本地化部署属于技术出口管理范围，但若部署在海外自有云等风险可控情形下，可适用自动许可等便利措施。企业利用限制类大模型对外提供API调用、APP/网页交互、SaaS应用、本地端侧轻量化部署等情形，不属于大模型技术出口管理范围。", "ctime": 1792137948, "time_str": "16:05:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261016/c680776607.shtml"}, {"id": "5406463", "title": "资本集团研究管理副董事长Noriko Chen：在华投资敞口约500亿美元", "content": "资本集团研究管理副董事长Noriko Chen在全球财富管理论坛·2026上海苏河湾大会上表示，资本集团目前对中国资产的投资敞口约500亿美元，涵盖境内外股票、美国存托凭证（ADR）及固定收益资产，较2023年增长18%。Noriko Chen表示，这一增长是在市场波动和地缘政治紧张的背景下实现的。“当不确定性上升时，我们没有减少敞口，反而加大了投资”。她还透露，资本集团已扩大中国内地办公室规模，并将其迁至上海。目前，资本集团管理资产规模约3.6万亿美元。（财联社）", "ctime": 1792137930, "time_str": "16:05:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261016/c680776507.shtml"}, {"id": "5406457", "title": "六部门：启动城镇供热“温暖工程”三年行动", "content": "记者今天（16日）从住房城乡建设部获悉，为加快解决城镇供热工作中出现的热源保障能力不足、设施设备故障等问题，住房城乡建设部、国家发展改革委等六部门联合印发通知，启动城镇供热“温暖工程”三年行动，要求到2028年底前，存量供热老化管网更新改造要取得明显进展。（央视新闻）", "ctime": 1792137863, "time_str": "16:04:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261016/c680776189.shtml"}, {"id": "5406455", "title": "泰恩康：全资子公司获聚多卡醇注射液注册证书（2ml：20mg）", "content": "泰恩康公告，全资子公司山东华铂凯盛生物科技有限公司近日收到国家药监局签发的聚多卡醇注射液《药品注册证书》，规格为2ml：20mg，药品批准文号为国药准字H20266266。", "ctime": 1792137857, "time_str": "16:04:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261016/c680776159.shtml"}, {"id": "5406453", "title": "陕建股份：2026年1-9月新签合同金额1446.45亿元", "content": "陕建股份公告，公司及下属子公司2026年1月至9月累计新签合同1580个，新签合同金额1446.45亿元。2026年7月至9月新签单笔合同金额在5亿元人民币以上的较大施工项目合同，金额分别为25.75亿元、12.42亿元、11.55亿元、10.5亿元。", "ctime": 1792137853, "time_str": "16:04:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261016/c680776152.shtml"}, {"id": "5406451", "title": "迪安诊断：公司因未及时披露2025年度述职报告被责令改正", "content": "迪安诊断公告，公司因未及时办理披露独立董事2025年度述职报告，收到浙江证监局责令改正措施决定；董事会秘书陶钧因对上述违规行为承担主要责任，收到警示函措施决定。两项措施均记入证券期货市场诚信档案。公司已于公告同日补充披露3份述职报告，并将于收到决定书之日起10个工作日内提交书面报告。", "ctime": 1792137850, "time_str": "16:04:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261016/c680776133.shtml"}, {"id": "5406449", "title": "中科软：公司高级管理人员增持计划实施完毕，合计增持76.58万股", "content": "中科软公告，公司此前披露时任高级管理人员共8位拟于2026年5月1日至2026年10月30日增持公司股份。截至2026年10月16日，全部增持主体通过上海证券交易所集中竞价方式合计增持76.58万股，占公司股份总数的0.0921%，增持金额合计人民币1008.42万元，已达到计划金额下限，增持计划实施完毕。", "ctime": 1792137846, "time_str": "16:04:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261016/c680776121.shtml"}, {"id": "5406447", "title": "《中国禁止出口限制出口技术目录》拟新增技术的范围有哪些？商务部回应", "content": "商务部新闻发言人就修订《中国禁止出口限制出口技术目录》答记者问。问：《目录》拟新增技术的范围有哪些？\n答：此次公开征求意见涉及拟增列的人工智能、生物医药、光伏三个领域40项关键技术。其中，拟禁止出口技术14项，包括：人工智能驱动的恶意代码生成与变异技术、具有自主知识产权的细胞和基因治疗技术工艺平台、钙钛矿及叠层电池组件生产技术等；拟限制出口技术26项，包括：人工智能辅助漏洞挖掘技术、具有自主知识产权的通用型细胞和基因治疗全新靶点发现和验证技术、单线产能≥3万吨/年的多晶硅工程技术等。公告还明确了适用便利措施等情形。详情请参考公告原文。", "ctime": 1792137781, "time_str": "16:03:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261016/c680775855.shtml"}, {"id": "5406429", "title": "邵阳液压：联合体总中标价格4.62亿元", "content": "邵阳液压公告，公司于2026年10月14日收到中标通知书，与华自科技组成的联合体中标志丹200MW/600MWh构网型独立储能项目储能系统设备及升压站设备，联合体总中标价格4.62亿元（含税）。公司预计负责约39.00%的建设内容，约1.8亿元；截至公告披露日，正式合同尚未签署。", "ctime": 1792137706, "time_str": "16:01:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261016/c680775523.shtml"}, {"id": "5406427", "title": "海康威视：2026年第三季度净利润50.16亿元，同比增长36.97%", "content": "海康威视公告，2026年第三季度营业收入272.22亿元，同比增长13.71%；归属于上市公司股东的净利润50.16亿元，同比增长36.97%；扣非净利润49.84亿元，同比增长43.13%。2026年前三季度营业收入740.44亿元，同比增长12.60%；归属于上市公司股东的净利润129.11亿元，同比增长38.55%；扣非净利润126.96亿元，同比增长41.52%。", "ctime": 1792137703, "time_str": "16:01:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261016/c680775511.shtml"}, {"id": "5406423", "title": "美股中概股盘前涨跌互现，贝壳涨2%", "content": "美股中概股盘前涨跌互现，贝壳涨2%，百济神州涨0.8%，携程涨0.6%，拼多多跌0.1%，阿里巴巴跌0.2%，网易跌0.5%，百度跌0.6%，京东跌1%。", "ctime": 1792137696, "time_str": "16:01:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261016/c680775471.shtml"}, {"id": "5406421", "title": "美股大型科技股盘前涨跌互现，特斯拉涨超4%", "content": "美股大型科技股盘前涨跌互现，特斯拉涨超4%，SpaceX涨超2%，英伟达涨0.4%，微软涨0.2%；Meta、苹果、谷歌A持平；SK海力士跌超2%，美光科技跌超1%，亚马逊跌0.1%。", "ctime": 1792137689, "time_str": "16:01:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261016/c680775423.shtml"}, {"id": "5406393", "title": "常山药业：依诺肝素钠注射液获蒙古国注册证书，2031年到期", "content": "常山药业公告，公司近日收到通知，依诺肝素钠注射液获得蒙古国药品监督管理部门签发的药品注册证书，注册证有效期至2031年9月11日。该药品规格为60mg/0.6ml；N2（即2支/盒包装）。", "ctime": 1792137549, "time_str": "15:59:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261016/c680775091.shtml"}, {"id": "5406391", "title": "光大期货：PPI数据爆表，为何黄金不跌反涨？", "content": "宏观方面，美国劳工部数据显示，9月PPI同比涨6.3%、远超预期的5.4%，为2022年12月以来最高；9月CPI同比上涨3.7%，为五个月来最大涨幅，高于预期值3.6%和前值3.4%；与此同时，剔除食品和能源的核心PPI同比上涨5.0%，高于预期值4.4%和前值4.6%，环比上涨0.7%，亦超出预期的0.3%；能源价格传导依然是核心驱动力，而通胀扩散化趋势更令市场担忧。另外，纽约联储10月制造业景气指数大幅攀升17.9点至25.5，超出预期，为近五年来最强劲增长，新订单与出货量均显著扩张，显示实体经济活动仍具韧性。\n政策与表态方面，美联储内部呈现“鹰声渐起”的格局。美联储主席沃什正试图打破前瞻指引、甚至评估取消“点阵图”以打造“安静央行”，此举引发内部强烈反对，多位高官密集发声纠偏。若通胀迟迟不受控，市场担心美联储12月加息幅度或翻倍至50个基点。同时，美国通胀压力的持续性超出市场此前预判，投资者上调对美联储10月加息的押注，10月加息概率升至50%。短期关注今晚欧元区9月CPI终值、美国9月工业产出。（光大期货）", "ctime": 1792137475, "time_str": "15:57:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261016/c680775064.shtml"}, {"id": "5406383", "title": "杰富瑞警告：美国AI投资规模将创历史纪录，放缓恐冲击经济", "content": "随着市场对债务融资驱动的AI投资热潮能否持续的担忧加剧，美元与美国国债收益率双双下跌。杰富瑞经济学家莫希特·库马尔在报告中指出，未来三年，美国预计将投入相当于GDP的2.5%至3%的资金用于资本支出和AI基础设施建设，其规模将超过美国历史上任何一次基础设施建设扩张。他警告称，如果AI基础设施建设步伐放缓，将对相关企业及美国整体经济产生重大影响。", "ctime": 1792137295, "time_str": "15:54:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261016/c680774967.shtml"}, {"id": "5406377", "title": "商务部、科技部拟修订《中国禁止出口限制出口技术目录》 增列部分人工智能、生物医药、光伏技术", "content": "根据《中华人民共和国对外贸易法》和《中华人民共和国技术进出口管理条例》，商务部、科技部拟修订《中国禁止出口限制出口技术目录》，增列部分人工智能、生物医药、光伏技术。经批准，现向社会公开征求意见，并同步对相关技术实施出口前登记管理。\n\n此次公开征求意见涉及人工智能、生物医药、光伏三个领域40项技术。人工智能领域包括大模型、智能体、算力集群、信息处理相关23项技术；对已通过开源、发表学术论文等方式进入公共领域的技术，不纳入管理范围。生物医药领域包括细胞和基因治疗、小核酸药、病原微生物相关5项技术；对不涉及所有权转让的对外授权模式，适用自动许可等便利措施。光伏领域包括多晶硅制造、硅片制造、电池制造相关12项技术；技术管理范围也包含承载相关技术的关键和核心设备。", "ctime": 1792137161, "time_str": "15:52:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261016/c680774930.shtml"}, {"id": "5406359", "title": "盟固利：2026年第三季度报告延期至2026年10月29日披露", "content": "盟固利公告，公司原定于2026年10月23日披露《2026年第三季度报告》，结合目前定期报告编制及向特定对象发行股票工作等情况的综合考虑，本着审慎原则及对广大投资者负责的态度，为保证信息披露的准确性和完整性，经向深圳证券交易所申请，将披露时间调整至2026年10月29日。", "ctime": 1792137011, "time_str": "15:50:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261016/c680774876.shtml"}, {"id": "5406343", "title": "金徽股份：2026年第三季度净利润2.38亿元，同比增长155.90%", "content": "金徽股份公告，2026年第三季度营业收入5.98亿元，同比增长54.23%；归母净利润2.38亿元，同比增长155.90%；扣非净利润2.34亿元，同比增长159.13%。2026年前三季度营业收入16.83亿元，同比增长42.67%；归母净利润6.47亿元，同比增长86.86%；扣非净利润6.37亿元，同比增长95.08%。", "ctime": 1792136749, "time_str": "15:45:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261016/c680774610.shtml"}, {"id": "5406327", "title": "上交所副总经理苑多然：上交所基金今年前9个月成交额65.4万亿元", "content": "上交所副总经理苑多然在全球财富管理论坛·2026上海苏河湾大会上表示，今年1—9月，上交所基金成交额65.4万亿元，其中，ETF成交额和市值分别位居亚洲第一和第三，成为中长期资金配置的重要底仓。截至今年9月，上交所挂牌基金1124只，总市值3.5万亿元。", "ctime": 1792136657, "time_str": "15:44:17", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261016/c680774586.shtml"}, {"id": "5406325", "title": "印度指责中方设置贸易壁垒，外交部：中方从不刻意追求贸易顺差", "content": "10月16日，外交部发言人毛宁主持例行记者会。有外媒记者提问，印度贸易部长称，印度对中国贸易逆差在扩大，他批评中方设置贸易壁垒，导致印度没有办法利用中国的大市场。请问中方对此有何评论？\n\n毛宁表示，这个问题的具体情况我建议你向中方的主管部门了解。但我可以告诉你的是，中方从不刻意追求贸易顺差，我们愿意同印方加强合作，平衡解决彼此的经贸关系关切，推动两国关系持续的发展。(澎湃新闻)", "ctime": 1792136641, "time_str": "15:44:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261016/c680774580.shtml"}, {"id": "5406315", "title": "中证协拟要求券商按照\"一年建机制、三年见成效、五年成常态\"的节奏推进文化建设", "content": "记者获悉，中证协已起草形成《关于进一步深化证券行业文化建设工作的意见》，正向券商征意中。新规拟要求各券商制定五年文化建设专项规划及年度实施方案，按照\"一年建机制、三年见成效、五年成常态\"的梯度节奏推进：一年内完成现状摸排与短板诊断，健全组织领导、制度规范、考核评价三大体系；三年取得实质性成效，差异化、特色化发展格局初步成型；五年实现从制度刚性约束向全员行为自觉的全面转变。（财联社）", "ctime": 1792136534, "time_str": "15:42:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261016/c680774474.shtml"}, {"id": "5406313", "title": "中证协拟建立从业人员电子化职业道德档案 覆盖招录至离职全周期", "content": "记者获悉，中证协已起草形成《关于进一步深化证券行业文化建设工作的意见》，正向券商征意中。新规提出对照《证券从业人员职业道德准则》，完善券商从业人员职业道德规范、执业行为指引等配套制度体系。文件要求围绕员工招录、岗位管理、职级晋升、离岗离职的全职业周期，分层明确依法合规执业红线与职业道德约束标准；并建立从业人员电子化职业道德档案并动态更新，实现执业品行全程留痕、量化评价、刚性约束。新规同时提出创新培训方式、创新培训课程，推动职业道德教育提质增效，从业人员职业道德和合规意识显著提升、风清气正的行业生态基本稳固。（财联社）", "ctime": 1792136518, "time_str": "15:41:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261016/c680774466.shtml"}, {"id": "5406311", "title": "中证协拟健全不实信息快速澄清机制", "content": "记者获悉，中证协已起草形成《关于进一步深化证券行业文化建设工作的意见》，正向券商征意中。新规拟提出常态化推进行业舆情正面宣传引导，系统讲好资本市场高质量发展故事。文件提出构建分众化、全媒体传播矩阵，面向不同受众推送差异化内容，宏观与微观叙事相结合，广泛传播行业及公司价值理念；完善预期引导与舆情管理机制，建立首席经济学家等智库常态化发声渠道，在重大政策出台、市场波动加大、热点事件发酵时，及时准确解读政策、回应市场关切；提出策划推出兼具思想性与传播力的文化精品，生动传递专业价值，稳步提升行业社会美誉度与公众认可度。（财联社）", "ctime": 1792136472, "time_str": "15:41:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261016/c680774454.shtml"}, {"id": "5406309", "title": "中证协拟搭建专业智库 加大绿色金融ESG管理、跨境服务研发投入", "content": "记者获悉，中证协已起草形成《关于进一步深化证券行业文化建设工作的意见》，正向券商征意中。新规拟要求搭建专业智库与前瞻性研究成果转化机制，设立专项研究课题，加大绿色金融、ESG管理、跨境综合服务等前沿领域研发投入，促进研究成果高效赋能业务与产品创新；并建立专业能力分层培育体系，围绕投行定价、深度研究、资产配置等核心能力，构建适配新形势新监管要求的精准培训体系，形成与时俱进的专业人才培养与能力评价标准，推动专业文化理念在行业层面沉淀为可复用的能力资产。（财联社）", "ctime": 1792136455, "time_str": "15:40:55", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261016/c680774436.shtml"}, {"id": "5406293", "title": "特朗普称正与中俄磋商无核化问题，外交部：中国核力量同美俄完全不在一个量级", "content": "10月16日，外交部发言人毛宁主持例行记者会。德新社记者提问，美国总统特朗普表示，美方正就无核化问题与中俄进行磋商。请问中方对此有何回应？“这个问题中方已经多次阐明立场。”毛宁表示，作为拥有庞大核武库的国家，美方理应切实履行核裁军的特殊优先责任，这是国际社会的普遍共识。中国的核力量同美国俄罗斯完全不在一个量级，现阶段要求中方参加所谓的裁军谈判不公平、不合理，也不可能。（澎湃新闻）", "ctime": 1792136235, "time_str": "15:37:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261016/c680774269.shtml"}, {"id": "5406289", "title": "欧盟正准备对华的新贸易工具？外交部：望欧方避免出台保护主义政策", "content": "10月16日，外交部发言人毛宁主持例行记者会。彭博社记者提问，虽然中方与欧盟就混合动力汽车贸易已经达成了协议，但有报道称欧盟正准备新的贸易工具，以减少对华的贸易赤字。中方对此有何评论？毛宁指出，中欧经贸关系本质上是互利共赢的，近期中欧贸易投资磋商机制第二次例会取得积极进展，表明双方完全可以通过对话妥善处理分歧。毛宁表示，我们希望欧方恪守自由开放的承诺和世贸组织规则，避免出台保护主义和歧视性的政策措施，同中方相向而行，共同推动中欧贸易向上平衡可持续发展，共同维护全球产供链的稳定畅通。（澎湃新闻）", "ctime": 1792136173, "time_str": "15:36:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261016/c680774236.shtml"}, {"id": "5406271", "title": "诺德股份：出售江苏联鑫30%股权已完成工商变更", "content": "诺德股份公告，公司此前披露拟将持有的江苏联鑫30%的股权以7500万元转让给江苏吉岛。截至公告日，公司已收到股权转让价款共人民币7500万元，本次交易已完成交割；近日，江苏联鑫已完成工商变更登记，公司不再持有江苏联鑫股份。", "ctime": 1792136036, "time_str": "15:33:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261016/c680774184.shtml"}, {"id": "5406269", "title": "宁波建工：2026年第三季度新签合同金额同比下降70.16%", "content": "宁波建工公告，2026年第三季度公司及下属子公司新签合同433个，合同金额35.67亿元，较2025年同期减少70.16%；截至2026年9月，累计新签合同1236个，合同金额约102.73亿元，较2025年同期减少60.73%。", "ctime": 1792136033, "time_str": "15:33:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20261016/c680774183.shtml"}, {"id": "5406267", "title": "悦达投资：控股股东江苏悦达集团有限公司增持达总股本1%", "content": "悦达投资公告，控股股东江苏悦达集团有限公司此前计划自2026年7月31日起12个月内增持公司股份。截至公告披露日，其于2026年7月31日至2026年10月15日通过集中竞价方式增持850.9万股，占公司总股本的1%，累计增持金额3808万元。增持后，悦达集团直接持有公司股份2.98亿股，占总股本的35%。", "ctime": 1792136031, "time_str": "15:33:51", // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
