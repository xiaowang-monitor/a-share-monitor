定”扣押哪些西方国家船只，作为对西方国家扣押俄船只行为的反制。拉夫罗夫说，西方国家把“强盗行径和海盗行为”当作官方政策，俄罗斯将从服务于西方国家利益的船只中自主选择扣押目标，至于如何处理“将由俄方自行决定”。西方国家指责俄罗斯利用油轮等商用船只逃避西方制裁，将这些商用船只称为“影子舰队”。欧洲多国近来在相关水域拦截多艘所谓俄“影子舰队”船只。拉夫罗夫表示，所有不遵从欧盟要求的船只，无论悬挂何种旗帜，都被欧盟划定为“影子舰队”。欧盟这一“非法决定”意在遏制俄罗斯在全球市场获利。这种做法“极其危险”。（新华社）", "ctime": 1786678186, "time_str": "11:29:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260814/c678959807.shtml"}, {"id": "4958207", "title": "上海前7个月累计实现进出口3万亿元，同比增长17.7%", "content": "据上海海关统计，今年前7个月，上海累计实现进出口3万亿元，同比增长17.7%。其中，7月份上海市进出口4475.7亿元，同比增长12.6%，连续18个月保持增长。（人民财讯）", "ctime": 1786677538, "time_str": "11:18:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260814/c678959577.shtml"}, {"id": "4958203", "title": "东方甄选回应遭“薅羊毛式”黑灰产诈骗：犯罪嫌疑人已被警方采取强制措施", "content": "东方甄选官方号8月13日发文称，近日，东方甄选在订单数据日常监测中发现大量异常仅退款订单，涉及金额较大，存在“薅羊毛式”黑灰产诈骗嫌疑。公司立即固定证据并向公安机关报案，全程配合调查取证。经警方缜密工作，目前，某张姓犯罪嫌疑人因涉嫌诈骗罪，已被警方依法采取刑事强制措施，案件正在进一步办理中。东方甄选表示，未来将持续完善风控体系，加大对恶意退赔、职业索赔等行为的排查与打击力度。（第一财经）", "ctime": 1786677529, "time_str": "11:18:49", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260814/c678959572.shtml"}, {"id": "4958201", "title": "韩国市民团体敦促日本向“慰安妇”受害者道歉赔偿", "content": "8月14日是世界“慰安妇”纪念日。强征“慰安妇”是日本军国主义对外侵略扩张期间犯下的严重反人类罪行。韩国市民团体定于今天在首尔等多地举行活动，敦促日本政府承认战争罪行，向“慰安妇”制度受害者正式道歉并赔偿。（央视新闻）", "ctime": 1786677430, "time_str": "11:17:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260814/c678959500.shtml"}, {"id": "4958187", "title": "快手短剧7月头部十家版权分账1300万", "content": "快手内容消费中心数据显示，原生短剧版权方7月分账金额环比6月翻倍，单月规模创历史新高。其中，Top10版权方分账金额达1300万，环比增幅113%。预计8月短剧分账规模将再翻倍。（第一财经）", "ctime": 1786677051, "time_str": "11:10:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260814/c678959398.shtml"}, {"id": "4958185", "title": "人形机器人试验方法系列国家标准编制工作启动", "content": "8月13日，《人形机器人试验方法》系列国家标准启动会在光谷举行。会上，总则、环境感知、决策规划、运动控制等7项标准同步启动编制。现场，湖北省电子信息标准化技术委员会人形机器人与具身智能标准工作组揭牌成立，首批委员涵盖湖北人形机器人创新中心、湖北省计量测试技术研究院、武汉大学、华中科技大学等29家单位。（中国光谷）", "ctime": 1786677022, "time_str": "11:10:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260814/c678959388.shtml"}, {"id": "4958181", "title": "食品加工制造板块短线冲高，桂发祥直线涨停", "content": "食品加工制造板块短线冲高，桂发祥直线涨停，莲花控股此前涨停，三全食品、黑芝麻、仙乐健康、青岛食品、安井食品跟涨。", "ctime": 1786676948, "time_str": "11:09:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260814/c678959369.shtml"}, {"id": "4958179", "title": "热浪再袭欧洲逾1.35亿人遭遇高温", "content": "随着新一轮热浪来袭，英国、法国、意大利和西班牙等地民众13日遭遇高温。据估算，当天欧洲地区有超过1.35亿人被35摄氏度以上高温笼罩。据法新社报道，法国部分地区气温飙升至42摄氏度以上。法国气象局在该国中部的沙托梅扬测得42.5摄氏度气温，为当日法国最高；首都巴黎的气温也达到38摄氏度。当天法国大部分地区发布了高温警报，从西南部的阿基坦地区到东部的罗讷河谷，多地气温冲到41摄氏度。(新华社)", "ctime": 1786676909, "time_str": "11:08:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260814/c678959349.shtml"}, {"id": "4958155", "title": "TrendForce：DDR5 16Gb (2Gx8) 4800/5600现货均价较上日持平", "content": "TrendForce数据显示，8月14日内存颗粒DDR5 16Gb (2Gx8) 4800/5600现货均价较上日持平，DDR4 16Gb (2Gx8) 3200现货均价较上日上涨0.56%，DDR4 8Gb (1Gx8) 3200现货均价较上日上涨0.25%。", "ctime": 1786676414, "time_str": "11:00:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260814/c678959206.shtml"}, {"id": "4958151", "title": "中国人民银行副行长邹澜出席金砖国家财长和央行行长会议", "content": "央行消息，2026年8月12日至13日，中国人民银行副行长邹澜出席在印度斋浦尔举行的本年度首次金砖国家财长和央行行长会议，与会各方围绕全球经济发展与治理，完善应急储备安排，加强金砖国家在跨境支付、可持续金融、信息安全和金融科技等方面的合作进行了讨论。", "ctime": 1786676404, "time_str": "11:00:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260814/c678959196.shtml"}, {"id": "4958147", "title": "比尔·盖茨访问韩国，将同政商界人士商讨核电合作方案", "content": "据报道，美国微软公司联合创始人、新一代核电企业泰拉能源创始人比尔·盖茨13日访问韩国。这是盖茨自去年8月之后时隔一年再次访韩。访韩期间，他将会见韩国政府、国会和商界主要人士，就扩大小型模块化反应堆（SMR）的合作方案等进行交流。（第一财经）", "ctime": 1786676257, "time_str": "10:57:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260814/c678959156.shtml"}, {"id": "4958145", "title": "微信明确：朋友圈未来不会推出二次编辑功能", "content": "8月14日，微信官方账号“微信派”发布《为什么朋友圈没有编辑功能？》一文。其中提到，“朋友圈现在、过去、未来都不会有二次编辑功能”。", "ctime": 1786676189, "time_str": "10:56:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260814/c678959134.shtml"}, {"id": "4958141", "title": "越南VN指数下跌1%", "content": "越南VN指数下跌1%至1747.88点。", "ctime": 1786675922, "time_str": "10:52:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260814/c678959048.shtml"}, {"id": "4958125", "title": "青岛今年前7个月进出口5548.7亿元，同比增长6.4%", "content": "据青岛海关统计，今年前7个月，青岛市进出口5548.7亿元，占全省进出口总值的26.1%；同比增长6.4%，高于全省2.1个百分点。其中，出口3377.1亿元，同比增长8.3%；进口2171.6亿元，同比增长3.5%。7月份当月，青岛市进出口877.5亿元，同比增长10.5%。其中，出口560.1亿元，同比增长16.3%；进口317.4亿元，同比增长1.5%。", "ctime": 1786675702, "time_str": "10:48:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260814/c678958895.shtml"}, {"id": "4958123", "title": "广达：AI服务器需求强劲 订单可见度延续至2028年", "content": "广达首席财务官杨俊烈表示，AI服务器的需求强劲，订单可见度将延续至2028年。广达正大力投资扩大生产以满足客户需求，计划到2026年底，新的AI服务器容量预计将比去年翻一番，到2028年容量将再次翻倍。广达还将今年资本支出从原先的300亿新台币提高至400亿新台币，增长超过33%。(财联社)", "ctime": 1786675686, "time_str": "10:48:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260814/c678958885.shtml"}, {"id": "4958119", "title": "电力板块持续下挫，华银电力、梅雁吉祥逼近跌停", "content": "电力板块持 const SECTORS  = [{"name": "数据要素", "hit_count": 34, "etfs": []}, {"name": "金融", "hit_count": 33, "etfs": []}, {"name": "人工智能", "hit_count": 21, "etfs": []}, {"name": "半导体", "hit_count": 18, "etfs": []}, {"name": "消费", "hit_count": 16, "etfs": []}, {"name": "医药", "hit_count": 13, "etfs": []}, {"name": "新能源", "hit_count": 9, "etfs": []}, {"name": "地产", "hit_count": 7, "etfs": []}];
const META     = {"update_time": "2026-08-14 11:33:45", "sentiment_score": 60.39823008849557, "agents": []};

// 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',

  container.innerHTML = agents.map(a => `

        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>

          <span class="text-sm font-medium">${a.name || a.symbol}</span>

        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

renderKPI();

setInterval(updateCountdown, 1000);
