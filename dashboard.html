": "4864575", "title": "台风“白海豚”减弱为强台风级 周四起影响我国", "content": "今年第13号台风“白海豚”已于今天早晨由超强台风级减弱为强台风级，其中心上午8时位于琉球群岛那霸市偏东方向大约2090公里的西北太平洋上。预计，“白海豚”将以每小时20～25公里的速度向西偏北方向移动，强度变化不大。它的风雨影响将会在本周四开始显现，华东沿海本周末将会有明显风雨天气，在缓和高温酷热的同时，浙江、江西等省份要防范台风可能带来的暴雨。（央视新闻）", "ctime": 1785730141, "time_str": "12:09:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260803/c678619282.shtml"}, {"id": "4864571", "title": "意军方称在地中海拦截一艘俄“影子舰队”油轮", "content": "意大利国防部2日发表声明说，在地中海执行欧盟长期军事行动的意大利海军当天拦截一艘受制裁的俄罗斯“影子舰队”油轮。意国防部在声明中说，这艘受欧盟制裁的油轮在地中海潘泰莱里亚以西海域被拦截。该油轮船长拒绝配合，意大利军方小组对其进行登船检查。行动得到一艘希腊海军舰艇和一架波兰海上巡逻机的支援。声明说，该船悬挂喀麦隆国旗，7月16日从贝宁科托努港出发，目的地为土耳其伊斯坦布尔。登船检查后获取的信息和文件正在审查中。西方国家指责俄罗斯利用油轮等商用船只逃避西方制裁，将这些商用船只称为“影子舰队”。(新华社)", "ctime": 1785729957, "time_str": "12:05:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260803/c678619201.shtml"}, {"id": "4864551", "title": "港股午评：恒生指数涨0.04%，恒生科技指数涨0.74%", "content": "港股午间收盘，恒生指数涨0.04%，恒生科技指数涨0.74%。恒指港股通ETF银华（159318）涨0.3%，港股通科技ETF鹏华（159751）涨1.24%。板块方面，可选消费经销Ⅳ、可选消费经销Ⅲ板块涨幅靠前；摄影器材、IT咨询与其他服务板块跌幅靠前。个股方面，时代天使涨18.65%，创想三维涨17.41%，迅策涨14.3%，联想控股涨10.56%，福莱特玻璃涨10.07%；富智康集团跌13.47%，京能清洁能源跌9.07%，华勤技术跌8.0%，智谱跌7.9%，东阳光药跌7.51%。", "ctime": 1785729671, "time_str": "12:01:11", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260803/c678619061.shtml"}, {"id": "4864539", "title": "8月3日午间公告一览：科源制药子公司盐酸倍他司汀片获批上市许可持有人变更", "content": "科源制药公告，全资子公司力诺制药近日收到国家药品监督管理局签发的药品补充申请批准通知书，批准盐酸倍他司汀片（4mg、8mg）上市许可持有人由“森淼（山东）药业有限公司”变更为“山东力诺制药有限公司”，药品批准文号不变。同时，力诺制药参加第12批国家组织药品集中带量采购投标，注射用硫酸艾沙康唑（0.2g）拟中选本次集中采购，盐酸倍他司汀片拟中选企业后期将变更为力诺制药。\n一品红公告，公司全资子公司一品红制药及联瑞制药于2026年7月31日参加第十二批全国药品集中采购，注射用硫酸艾沙康唑和培哚普利氨氯地平片（Ⅲ）拟中标。培哚普利氨氯地平片（Ⅲ）2025年度销售收入348.17万元，占公司2025年度营业收入0.37%。采购周期自中选结果执行之日起至2029年12月31日。", "ctime": 1785729611, "time_str": "12:00:11", "stock_code": "", "stock_name": "", "stock_market":  "11:41:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260803/c678618546.shtml"}, {"id": "4864475", "title": "DeepSeek-V4-Flash正式版API登陆国家超算互联网", "content": "DeepSeek-V4-Flash正式版API近日面向公众开启公测，国家超算互联网已同步上线DeepSeek-V4-Flash模型API调用与下载服务，用户可一键快速调用DeepSeek-V4-Flash能力。据介绍，使用者可登录国家超算互联网官网，通过首页服务板块进入模型服务专区接入API；也可在超算互联网AI社区下载模型，借助可信Notebook环境一站式完成微调、部署、适配全流程开发，高效落地AI应用。（科创板日报）", "ctime": 1785728032, "time_str": "11:33:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260803/c678618105.shtml"}, {"id": "4864473", "title": "ETF两市成交额报3006.8亿元，较上一交易日此时缩量896.85亿元", "content": "截至目前，ETF两市成交额报3006.8亿元，较上一交易日此时缩量896.85亿元，分类型来看，股票型ETF成交额1078.29亿元，债券型ETF成交额1295.43亿元，货币型ETF成交额120.91亿元，商品型ETF成交额32.98亿元，QDII型ETF成交额480.8亿元。", "ctime": 1785728017, "time_str": "11:33:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260803/c678618075.shtml"}, {"id": "4864471", "title": "期货午评：美伊谈判突现变数！燃油跌超4% 多晶硅暴涨逾7%", "content": "期货午评：早盘收盘，国内期货主力合约跌多涨少，燃料油、红枣跌超4%，尿素跌近4%，原油跌近3%，铁矿石、乙二醇跌超2%，沪镍跌近2%，锰硅跌超1%。涨幅方面，多晶硅涨超7%，集运欧线涨近3%，鸡蛋、PTA、菜籽、沪锌涨超1%，工业硅涨近1%。", "ctime": 1785727932, "time_str": "11:32:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260803/c678618040.shtml"}, {"id": "4864467", "title": "ETF午评：线上消费ETF领涨3.06%，半导体设备ETF领跌7.12%", "content": "ETF午间收盘涨跌不一，线上消费ETF（159793）领涨3.06%，中概互联网ETF（513050）涨2.88%，恒生互联网ETF（159688）涨2.70%，半导体设备ETF（561980）领跌7.12%，科创半导体设备ETF（589020）跌6.92%，半导体设备ETF（159516）跌6.87%。", "ctime": 1785727864, "time_str": "11:31:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260803/c678618011.shtml"}, {"id": "4864469", "title": "A股午评：科创50指数低开低走跌3.73%，算力硬件股集体回调", "content": "A股三大指数早盘集体下跌，截至午盘，上证指数跌0.59%，深证成指跌0.45%，创业板指跌0.44%，北证50跌0.66%，科创50指数跌3.73%。全市场成交额13747亿元，较上日缩量4233亿元，全市场超3700只个股上涨。板块题材上，电网设备、可控核聚变、光伏设备、种植业与林业、电机板块涨幅居前；电子化学品、半导体、存储芯片、光刻机、油气开采及服务板块跌幅居前。盘面上，电网设备板块高开高走，久盛电气、百利电气、长缆科技等股涨停，益坤电气、新特电气涨幅居前。可控核聚变板块表现活跃，中国核建、合锻智能、中岩大地等多股涨停，哈焊华通、常辅股份涨幅居前。光伏设备板块早盘持续拉升，国晟科技、福莱特涨停，大全能源、国际实业、宇邦新材涨幅居前。半导体板块早盘持续走低，长川科技、芯源微、拓荆科技涨幅居前。电子化学品板块表现疲软，三孚新科、宏和科技、兴福电子跌幅居前。", "ctime": 1785727859, "time_str": "11:30:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260803/c678618012.shtml"}, {"id": "4864461", "title": "股指期货早盘收盘 主力合约全线下跌", "content": "股指期货早盘收盘，主力合约全线下跌。沪深300股指期货(IF)主力合约跌0.72%，上证50股指期货(IH)主力合约跌1.39%，中证500股指期货(IC)主力合约跌0.81%，中证1000股指期货(IM)主力合约跌0.09%。", "ctime": 1785727818, "time_str": "11:30:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260803/c678617982.shtml"}, {"id": "4864459", "title": "AI原生游戏《共鸣计划》亮相2026 ChinaJoy，玩家为试玩排长队", "content": "近日，2026年中国国际数码互动娱乐展览会召开。本届展会首次设立“Next Play创新游戏体验场”，集中展示了超过70个AIGC相关项目，涵盖AI NPC（非玩家角色）、互动叙事、生成式内容等前沿应用。其中，在《共鸣计划》试玩区，其通过创新玩法吸引了大量年轻观众驻足，有玩家为试玩排起长队。据悉，该款是由灵榫游戏研发的AI原生少女乐队养成游戏。玩家在游戏中扮演经纪人，通过提示词与AI交互，生成性格各异的角色并与固定主角“星音”组建乐队。（新浪科技）", "ctime": 1785727799, "time_str": "11:29:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260803/c678617975.shtml"}, {"id": "4864453", "title": "“AI支出巨浪”很快消退？资深策略师“捕捉”到两大危险信号", "content": "长期看涨市场的华尔街知名人物、Leuthold Group首席投资策略师Jim Paulsen认为，AI领域的支出浪潮将很快消退，并捕捉到两大市场趋势预示着未来道路将出现坎坷。第一个市场趋势是人工智能股票近期的表现不佳。他认为，这是一个警告信号，表明投资者已经在为支出增长放缓做好准备。财报显示，许多大型科技公司计划继续加大投入。市场对此的反应——Alphabet、特斯拉和Meta等公司的股价在财报发布后暴跌——清楚地表明，投资者希望看到这些巨额投资的回报。\n第二个市场趋势是美国核心资本货物订单近期急剧下降。Paulsen表示，随着油价、债券收益率和美元飙升，投资者已经将核心资本支出放缓的预期计入了市场。(蓝鲸新闻)", "ctime": 1785727713, "time_str": "11:28:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260803/c678617917.shtml"}, {"id": "4864443", "title": "南向资金净买入超40亿港元", "content": "据同花顺iFinD数据，截至目前，南向资金净买入超40亿港元，其中港股通（沪）买入超13.26亿港元，港股通（深）买入超26.88亿港元。", "ctime": 1785727483, "time_str": "11:24:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260803/c678617777.shtml"}, {"id": "4864441", "title": "自变量机器人发布HOST框架并开源", "content": "自变量机器人今日发布HOST框架（Human-to-robot One-Shot Skill AcquisiTion，人类到机器人单样本技能获取）并开源，能让机器人仅观察一段数十秒的人类视频就学会新技能，同时保留已掌握的技能。(人民财讯)", "ctime": 1785727462, "time_str": "11:24:22", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260803/c678617757.shtml"}, {"id": "4864437", "title": "四川宜宾市高县发生3.6级地震 震源深度5公里", "content": "中国地震台网正式测定：8月3日11时11分，在四川宜宾市高县（北纬28.54度，东经104.67度）发生3.6级地震，震源深度5公里。（央视新闻）", "ctime": 1785727440, "time_str": "11:24:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260803/c678617746.shtml"}, {"id": "4864429", "title": "标普500指数成分股二季度盈利同比增速有望达47.4% 创下五年来最高水平", "content": "美股企业陆续公布第二季度财报。据美国金融数据、分析软件服务商FactSet的数据显示，基于已公布财报公司的数据以及对尚未公布财报公司的分析师预测，标普500指数成分股公司本季度的盈利有望实现47.4%的同比增长。这将是过去五年中盈利增长最强劲的一个季度。就已公布财报的158家美股公司而言，其中123家公司营收超出市场预期，34家不及预期，1家持平。总体而言，138家公司达成了营收的同比增长。摩根大通全球市场策略师Hugh Gimber表示，美股公司业绩表现非常稳健，从企业公布的数据来看，过去几周的情况非常积极。虽然科技行业再次处于领先地位，但更多的行业参与到增长当中。", "ctime": 1785727307, "time_str": "11:21:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260803/c678617669.shtml"}, {"id": "4864419", "title": "香港证监会主席黄天祐：港交所国债期货是离岸产品的重大突破", "content": "8月3日，在香港交易所举办的中国国债期货上市仪式上，香港证监会主席黄天祐表示，作为目前唯一在离岸市场上市的中国国债期货，这一创举意义深远：一方面，它为全球投资者提供了对冲在岸利率风险的有效工具，助力资产配置的持续优化；另一方面，它能有效提升国债市场的参与度、流动性及定价效率，进一步促进内地与海外市场之间的双向资本流动。因此，国债期货不仅是离岸产品的重大突破，更是内地金融市场推进高水平对外开放、深化人民币国际化进程中，一座举足轻重的里程碑。", "ctime": 1785726805, "time_str": "11:13:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260803/c678617309.shtml"}, {"id": "4864417", "title": "国际标准化组织人工冰雪景观技术委员会秘书处落户中国", "content": "记者今天了解到，国际标准化组织近日批准人工冰雪景观技术委员会秘书处落户中国，这是中国在冰雪领域承担的首个ISO技术机构秘书处。人工冰雪景观技术委员会秘书处工作范围是人工冰雪景观构筑物（室内和室外）的安全、设计、建造、运营、维护及可持续发展的国际标准化工作，拟开展的工作包括人工冰雪景观相关术语、设计原则与框架等基础通用标准，人工冰雪景观建造等技术标准，人工冰雪景观安全与防护规范、可持续管理体系等管理标准。此次秘书处落户中国，是我国冰雪领域国际标准化的重大突破，将有利于推动我国在人工冰雪景观建造技术、安全管理、可持续发展等方面的优势技术成果与国际标准有效对接，为全球畅享人工冰雪景观提供技术支撑，助力打破时空限制，让冰雪魅力跨越四季、传遍世界，进一步激活全球冰雪经济。中国将联合各成员国，共同为本领域国际标准化发展作出更多贡献。（央视新闻）", "ctime": 1785726714, "time_str": "11:11:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260803/c678617259.shtml"}, {"id": "4864411", "title": "阿里“千问办公”开启公测，将推出国际版", "content": "8月3日，阿里“千问办公”开启公测，个人和企业用户均可通过“千问办公”官网体验。目前，“千问办公”已初步打通钉钉，未来将连接企业真实数据流和工作流。记者了解到，“千问办公”未来还将上线独立App端并推出国际版，实现多端联动，覆盖更多办公场景。（第一财经）", "ctime": 1785726593, "time_str": "11:09:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260803/c678617188.shtml"}, {"id": "4864407", "title": "小摩：对光伏行业看法转趋选择性乐观，升信义光能及福莱特玻璃评级至“增持”", "content": "摩根大通发表研报指，中国光伏板块年初至今平均下跌约30%，部分股份估值已接近历史低位，目前对该行业看法转趋选择性乐观，预期下半年光伏需求将受季节性因素带动而复苏，加上停产安排，光伏玻璃的供需前景有望改善。该行将信义光能及福莱特玻璃的评级由“中性”上调至“增持”，憧憬若行业整合，信义光能及福莱特玻璃有望取得更多市场份额；同时维持协鑫科技“增持”评级。（新浪财经）", "ctime": 1785726448, "time_str": "11:07:28", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260803/c678617079.shtml"}, {"id": "4864399", "title": "埃及开罗省发生5.5级地震 暂无人员伤亡报告", "content": "埃及国家天文与地球物理研究所3日发布声明说，埃及开罗省当天凌晨3时许发生5.5级地震。埃及红新月会说，截至目前尚未接到人员伤亡或财产损失报告。根据埃及国家天文与地球物理研究所数据，此次地震震中位于开罗省东部，震源深度10公里。新华社记者在埃及首都开罗感受到明显震感。埃及红新月会发布声明说，已在有震感地区启动应急预案，提醒民众避免靠近老旧建筑及出现裂缝的建筑物。德国地球科学研究中心此前报道此次地震的震级为5.4级。（新华社）", "ctime": 1785726346, "time_str": "11:05:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260803/c678617026.shtml"}, {"id": "4864387", "title": "光纤概念板块短线拉升，天孚通信涨超7%", "content": "光纤概念板块短线拉升，天孚通信涨超7%，太辰光、光库科技、德科立、蘅东光等跟涨。", "ctime": 1785726124, "time_str": "11:02:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260803/c678616895.shtml"}, {"id": "4864383", "title": "侵入式脑机接口公司主动科技完成3.3亿元天使轮融资", "content": "脑机接口公司主动科技8月3日宣布，已完成3.3亿元人民币天使轮融资。本轮融资由中科创星领投，联想之星、九合创投、道彤投资、英诺天使基金、华大松禾生科基金、济峰资本、嘉道资本共同投资。融资资金将主要用于场地扩展、设备完善、临床试验推进与团队扩充等方面，全面加速侵入式脑机接口产品的临床转化与产业化落地。此次融资也创下中国脑机接口领域天使轮融资纪录。（科创板日报）", "ctime": 1785726024, "time_str": "11:00:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260803/c678616850.shtml"}, {"id": "4864345", "title": "通用视频模型MiniMax H3正式开源", "content": "MiniMax正式开源新一代通用视频模型MiniMax H3。据介绍，该模型能够统一理解由文本、图像、视频和音频构成的多模态上下文，并可生成最高2K分辨率、最长15秒、带有原生立体声音频的视频。", "ctime": 1785725394, "time_str": "10:49:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260803/c678616566.shtml"}, {"id": "4864315", "title": "电池化学品板块短线拉升，威尔泰涨停", "content": "电池化学品板块短线拉升，威尔泰涨停，吉和昌、天华新能、丰元股份、石大胜华、海科新源等跟涨。", "ctime": 1785724733, "time_str": "10:38:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260803/c678616198.shtml"}, {"id": "4864313", "title": "吴清主席在香港推出人民币国债期货上市仪式上的致辞", "content": "深化务实合作 密切协同发展 共创“十五五”资本市场高水平开放新局面——吴清主席在香港推出人民币国债期货上市仪式上的致辞", "ctime": 1785724733, "time_str": "10:38:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260803/c678616197.shtml"}, {"id": "4864311", "title": "再次纳入中国芯片龙头 全球最火存储ETF纳入长鑫科技", "content": "7月底，全球“最火”内存ETF——Roundhill Memory E ": 1785723429, "time_str": "10:17:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260803/c678615490.shtml"}, {"id": "4864243", "title": "摩根士丹利：韩股杠杆出清后 仍有36%上涨空间", "content": "摩根士丹利将韩国股票评级从平配上调至高配，称近期“杠杆出清”，为投资者参与人工智能交易和工业超级周期主题提供了更好的入场机会。Daniel K Blake等策略师在报告中写道，随着拥挤交易和杠杆头寸的大幅平仓，Kospi指数较其9000点的目标位仍有36%的上涨空间。周一该指数一度下跌5.5%，上周五创纪录上涨18%。分析师表示，近期抛售“主要是技术性因素所致”，并称“杠杆ETF、对冲基金杠杆以及散户保证金交易的去杠杆过程已过半程”。Kospi指数自6月高点以来已累计下跌逾30%。作为亚洲人工智能需求风向标，韩国股市被投资者迅速抛售，而个股杠杆ETF激增以及指数权重过度集中，进一步加剧了这轮跌势。摩根士丹利预计，Kospi指数短期将在5500点至10500点区间波动，并认为三星电子和SK海力士将为市场提供估值支撑；工业、国防和金融等行业的股票料将受益于利好因素。（新浪财经）", "ctime": 1785723225, "time_str": "10:13:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260803/c678615390.shtml"}, {"id": "4864241", "title": "南向资金净买入超30亿港元", "content": "据同花顺iFinD数据，截至目前，南向资金净买入超30亿港元，其中港股通（沪）买入超11.84亿港元，港股通（深）买入超19.01亿港元。", "ctime": 1785723219, "time_str": "10:13:39", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260803/c678615388.shtml"}, {"id": "4864233", "title": "韩国拟引入“紧急权限” 可将单股杠杆倍数限制在1.5倍", "content": "韩国金融监管部门正在推动引入一项“紧急行动权限”，允许监管机构在紧急情况下快速降低单股杠杆产品的杠杆倍数。此前，这类产品被认为是导致市场剧烈波动的主要因素之一。监管部门同时也在研究其他限制措施，包括设定杠杆投资额度上限，以及进一步提高基础保证金要求。据韩联社报道，韩国金融委员会（FSC）将与金融监督院（FSS）共同起草《金融投资业与资本市场法》修正案，为紧急情况下采取市场稳定措施建立法律依据。此次调整的核心内容，是允许金融监管部门临时调整单股杠杆ETF的杠杆倍数。目前，韩国国内的单股杠杆产品旨在追踪2倍收益。通过紧急行动授权，如果认为有必要保护投资者，杠杆倍数将被降低至1.5倍或1倍。（新浪财经）", "ctime": 1785723158, "time_str": "10:12:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260803/c678615351.shtml"}, {"id": "4864229", "title": "分析师：英伟达Rubin Ultra的HBM规格尚未确定", "content": "分析师Qinbafrank发文称，市场关于英伟达Rubin HBM减配的传闻，并非指已经开始交付并逐步放量的标准版Vera Rubin NVL72，而是计划于2027年下半年推出的升级版Rubin Ultra配置规格尚未最终确定，多家机构预计，相较于英伟达此前在GTC展示的激进配置，其最终量产版本的规格存在下调的可能。（科创板日报）", " // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
