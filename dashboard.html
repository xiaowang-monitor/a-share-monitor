了红海沿岸的摩卡港以及具有战略意义的哈尼什群岛，这意味着红海航线的安全风险正在从威胁变为现实。霍尔木兹海峡与曼德海峡同时面临实质性封锁威胁，全球两大能源运输动脉的通行安全同时受到挑战。原油的基本面强势具有确定性，但当前价格不宜追高。（首创期货）", "ctime": 1789112636, "time_str": "15:43:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260911/c679824402.shtml"}, {"id": "5156169", "title": "中国对尼泊尔第五批紧急援助物资运抵加德满都", "content": "当地时间9月11日，中国对尼泊尔第五批紧急援助物资运抵尼泊尔首都加德满都特里布万国际机场。据悉，随着救灾工作持续推进，本批援助物资紧扣尼方当前最迫切需求，主要包括柴油发电机、医用防护口罩、太平柜、DNA检测设备及试剂、水域救援装备等，为尼方开展后续工作提供有力保障。(央视新闻)", "ctime": 1789112147, "time_str": "15:35:47", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260911/c679824155.shtml"}, {"id": "5156163", "title": "美媒：沙特王储要求美方打击胡塞武装遭拒", "content": "沙特阿拉伯王储穆罕默德要求美方打击也门胡塞武装，但被美国总统特朗普拒绝。据报道，穆罕默德两次致电特朗普，要求下令美军对胡塞武装实施打击，但特朗普拒绝。美国政府目前没有直接打击胡塞武装的计划。约有200名美军人员驻扎在沙特，美方将提供有关胡塞武装的情报和相关数据，但不会直接参与军事行动。美军中央司令部司令库珀参加“紧急协调会议”。分析人士认为，胡塞武装攻占穆哈并继续向曼德海峡推进，红海航运面临新变局。（新华社）", "ctime": 1789112065, "time_str": "15:34:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260911/c679824119.shtml"}, {"id": "5156161", "title": "外交部：各国应当提供公平、公正、非歧视的营商环境", "content": "9月11日，外交部发言人毛宁主持例行记者会。有记者问，韩国正在修订防范工业间谍的相关法律。中方对此有何评论？毛宁表示，中国政府一贯要求中国企业在遵守国际规则和法律法规的基础上开展国际合作，同时我们认为各国都应当保障企业正常的投资经营活动，并为此提供公平、公正、非歧视的营商环境。（央视新闻）", "ctime": 1789112053, "time_str": "15:34:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260911/c679824113.shtml"}, {"id": "5156159", "title": "上海亚虹：控制权变更事项2026年9月14日起继续停牌", "content": "上海亚虹公告，控股股东海南宁生旅游集团有限公司正在筹划可能导致公司控制权变更的重大事项。因事项仍在讨论中，公司股票自2026年9月14日开市起继续停牌，预计停牌时间不超过3个交易日。", "ctime": 1789112041, "time_str": "15:34:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260911/c679824109.shtml"}, {"id": "5156155", "title": "浙江东方：收购杭州联合银行4%股份完成权属变更，持股7.94%", "content": "浙江东方公告，公司此前拟以10.65元/股收购控股股东省国贸集团持有的杭州联合银行4%股份，对应股数8721.85万股。近日，国家金融监督管理总局浙江监管局已就股权变更出具同意批复，截至公告披露日交易已办理完毕权属变更流程，公司持有杭州联合银行7.94%股份，合并报表范围没有发生变化。", "ctime": 1789112000, "time_str": "15:33:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260911/c679824076.shtml"}, {"id": "5156147", "title": "常青股份：刘堃等四名董高增持计划实施完毕", "content": "常青股份公告，公司此前披露实际控制人、董事长兼总经理吴应宏等七名增持主体拟自2026年9月7日起6个月内增持公司A股股份，合计拟增持金额不低于人民币1360万元（含）。2026年9月7日至2026年9月11日，刘堃、宋方明、何旭光、王斌分别增持17.13万股、18万股、17.66万股、13.68万股，占公司股份总数的0.0720%、0.0756%、0.0742%、0.0575%，上述四人的增持计划已实施完毕。", "ctime": 1789111993, "time_str": "15:33:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260911/c679824066.shtml"}, {"id": "5156109", "title": "《绿色矿山建设规范》系列国家标准发布，10类主要矿产实现全覆盖", "content": "近日，由自然资源部、国家市场监管总局联合制定的《绿色矿山建设规范》系列国家标准正式发布。该系列标准共10个部分，实现了对我国煤炭矿山、陆上油气田、黑色金属矿山、有色金属矿山、化工矿山、非金属矿山、黄金矿山、砂石矿山、水泥用灰岩矿山、地热矿泉水矿山等主要矿产的全覆盖，标志着我国绿色矿山建设迈入体系化、标准化、规范化的新阶段。（人民财讯）", "ctime": 1789111808, "time_str": "15:30:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260911/c679823930.shtml"}, {"id": "5156105", "title": "外交部：中国的创新从来不谋求垄断", "content": "9月11日，外交部发言人毛宁主持例行记者会。有记者问，世界知识产权组织近日发布《全球创新指数》百强创新集群报告。中国凭借25个全球百强创新集群，连续第四年位居上榜集群数量世界第一。按集群规模排名，“深圳－香港－广州”集群蝉联第一。评论认为，创新已经成为中国发展的重要动力，世界应该正视中国创新带来的红利和机遇。发言人对此有何评论？毛宁表示，创新驱动是中国经济长期向好、产业竞争力快速提升的关键密码，中国的创新发展也为世界提供了机遇，越来越多的外国企业选择研发在中国、创新在中国，在中国的大市场培育全球竞争力。中国的创新从来不谋求垄断，我们愿同世界共享创新红利，实现共同发展。（央视新闻）", "ctime": 1789111763, "time_str": "15:29:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260911/c679823872.shtml"}, {"id": "5156095", "title": "中方赴印代表团规模有多大？外交部：目前无可提供的信息", "content": "9月11日，外交部发言人毛宁主持例行记者会。印度报业托拉斯记者提问，发言人能否介绍习主席率代表团赴印的具体情况？代表团规模有多大？据报道，代表团阵容相当庞大，特别是还有许多企业界人士将出席金砖国家工商论坛。发言人能否确认？对此，毛宁表示：“目前我没有可以提供的信息。习主席赴印度出席金砖峰会的情况，我们会及时发布。”（澎湃新闻）", "ctime": 1789111621, "time_str": "15:27:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260911/c679823801.shtml"}, {"id": "5156093", "title": "外交部：一中原则是中意关系、中欧关系的政治基础", "content": "外交部发言人毛宁11日在例行记者会上表示，中方已经就“台独”政客赴意大利出席有关会议，向意方、欧方提出严正交涉。民进党当局和个别政客挖空心思四处蹭热度，打着“民主”“自由”的幌子“倚外谋独”，这种行为令人不齿、终归徒劳。毛宁说，世界上只有一个中国，台湾是中国领土不可分割的一部分。中方一贯坚决反对建交国与中国台湾地区进行任何形式的官方往来。一个中国原则是公认的国际关系准则和国际社会普遍共识，也是中意关系、中欧关系的政治基础。我们敦促有关方面以实际行动恪守一个中国原则。（新华社）", "ctime": 1789111611, "time_str": "15:26:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260911/c679823800.shtml"}, {"id": "5156089", "title": "中印正在安排习近平主席同印度总理莫迪举行双边会晤", "content": "外交部发言人毛宁11日在例行记者会上说，中印双方正在安排习近平主席同印度总理莫迪举行双边会晤，这将是两国领导人继喀山、天津会晤之后连续第三年会晤。(新华社)", "ctime": 1789111552, "time_str": "15:25:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260911/c679823785.shtml"}, {"id": "5156083", "title": "中方上调日本公民赴华签证费用 外交部：根据对等原则作出的安排", "content": "9月11日，外交部发言人毛宁主持例行记者会。有记者问，中方宣布上调日本公民赴华签证的费用，外交部对此有何评论？毛宁表示，中国驻日本使馆已经发布了通知，这次调整是根据对等的原则作出的安排。（央视新闻）", "ctime": 1789111355, "time_str": "15:22:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260911/c679823705.shtml"}, {"id": "5156075", "title": "沙特敦促美国打击胡塞武装 但遭美方拒绝", "content": "两名美国官员表示，沙特王储兼首相穆罕默德当天两次致电美国总统特朗普，敦促美国对也门胡塞武装发动打击，但特朗普表示拒绝。美国官员强调，美国政府目前没有对胡塞武装实施直接干预的计划。消息称，美国正在加大对沙特的支持，但同时避免直接的军事介入。（央视新闻）", "ctime": 1789111238, "time_str": "15:20:38", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260911/c679823664.shtml"}, {"id": "5156051", "title": "国轩高科拿下沙特首批大型电池储能项目6GWh储能订单", "content": "记者获悉，近日沙特首批大型电池储能项目正式落地并进入实质性建设阶段，国轩高科成功拿下该项目核心6GWh储能订单，为沙特三大主力储能站点提供全套储能解决方案，标志着公司正式突破中东高端储能市场。据悉，方案搭载国轩高科乾元智储储能系统，产品具备高集成度、大容量、长循环寿命等优势。（人民财讯）", "ctime": 1789111025, "time_str": "15:17:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260911/c679823536.shtml"}, {"id": "5156029", "title": "中国—保加利亚经济联委会第19次会议在北京召开", "content": "9月10日上午，商务部副部长兼国际贸易谈判副代表凌激在京与保加利亚经济、投资和工业部副部长亚基莫夫共同主持召开中国—保加利亚经济联委会第19次会议。保加利亚副总理兼经济、投资和工业部部长普列夫出席并致开幕辞。凌激表示，在中保战略伙伴关系引领下，近年来两国贸易稳步增长，投资合作持续深化。欢迎保方企业参加进博会、中国—中东欧国家博览会等展会，推介优势产品，扩大对华出口。希望双方加强投资政策对话，推动新能源、交通物流、农产品加工、智能制造等领域合作，希保方在市场准入、公共采购等方面为中国企业提供公平、非歧视的待遇，共同做大合作蛋糕。中方高度关注欧盟出台的系列贸易保护措施，希保方积极推动欧盟同中方相向而行，在中欧贸易投资磋商机制项下，通过对话妥处分歧，推动中欧经贸关系稳定健康发展。保方表示，保新政府高度重视对华经贸合作，期待取得更多实质性成果。保方将致力于推动双边贸易平衡发展，并愿与中方加强交通物流、农业科技、新能源和金融等领域合作。保方欢迎中国企业参与保公路、铁路、港口、新能源电站等基础设施项目，将进一步完善营商环境，为中资企业在保经营提供便利。保方认为，欧盟应理性务实看待对华合作，保持双边经贸关系稳定。（商务部）", "ctime": 1789110749, "time_str": "15:12:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260911/c679823417.shtml"}, {"id": "5156027", "title": "中国与塞舌尔签署《关于共同发展经济伙伴关系协定早期收获的安排》", "content": "9月10日，商务部部长王文涛与塞舌尔财政、经济规划、贸易和投资部部长拉波特签署《中华人民共和国政府与塞舌尔共和国政府关于共同发展经济伙伴关系协定早期收获的安排》（以下简称早期收获安排），国际贸易谈判代表兼副部长李成钢与塞方会见，并交换早期收获安排文本。(商务部)", "ctime": 1789110739, "time_str": "15:12:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260911/c679823414.shtml"}, {"id": "5156025", "title": "王文涛部长会见保加利亚副总理兼经济、投资和工业部部长普列夫", "content": "9月10日上午，商务部部长王文涛会见保加利亚副总理兼经济、投资和工业部部长普列夫，双方就中保、中欧经贸关系交换意见。(商务部)", "ctime": 1789110722, "time_str": "15:12:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260911/c679823399.shtml"}, {"id": "5155939", "title": "ETF两市成交额报4627.33亿元，较昨日此时放量702.71亿元", "content": "截至目前，ETF两市成交额报4627.33亿元，较昨日此时放量702.71亿元，分类型来看，股票型 00指数期货涨0.43%，纳斯达克100指数期货涨0.41%。", "ctime": 1789109419, "time_str": "14:50:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260911/c679822549.shtml"}, {"id": "5155757", "title": "落实《南海各方行为宣言》第58次联合工作组会在菲律宾马尼拉举行", "content": "2026年9月10日至11日，中国和东盟十国在菲律宾马尼拉举行落实《南海各方行为宣言》第58次联合工作组会，继续推进“南海行为准则”磋商。会议由外交部边海司副司长檀勍生与马来西亚外交部海洋司司长阿迪娜共同主持。（央视新闻）", "ctime": 1789109233, "time_str": "14:47:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260911/c679822485.shtml"}, {"id": "5155751", "title": "雀巢宣布提高部分产品价格", "content": "瑞士食品巨头雀巢集团全球首席执行官费耐睿9日表示，为应对能源、货运和原材料成本上升，雀巢正在重新规划产品结构，提高部分产品价格，并且削减消费者不愿意花更多钱买的产品。费耐睿表示，尽管中东冲突对雀巢销售几乎没有直接影响，但加剧了雀巢供应商面临的通胀压力，这些成本会传导至雀巢。中东业务约占雀巢销售额的2%至3%，影响主要在通货膨胀方面。近期，雀巢出售了其瓶装水业务的半数股权，同时也退出了维生素、矿物质补充剂业务。2025年，雀巢实现销售额894.9亿瑞士法郎，约合7382亿元人民币。（央视财经）", "ctime": 1789109178, "time_str": "14:46:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260911/c679822469.shtml"}, {"id": "5155729", "title": "贵州全面推行急难事项“小额快救”", "content": "11日，记者从贵州省民政厅举行的加强和改进临时救助工作政策解读新闻发布会上了解到，为提高救助时效性，简化审核审批程序，贵州全面推行急难事项“小额快救”。据了解，实施“小额快救”的困难情形主要包括五种类型：一是因突发重大疾病导致个人或家庭自身难以保障基本生活的；二是因火灾等导致家庭财产重大损失，个人或家庭成员衣、食、住等基本生活得不到保障的；三是因火灾、车祸、溺水、矿难等人身意外伤害导致严重受伤或死亡，责任主体暂不明确、责任主体无赔偿能力且个人或家庭自身难以保障基本生活的；四是最低生活保障对象、特困人员、孤儿和事实无人抚养儿童、最低生活保障边缘家庭人口、刚性支出困难家庭人口等人员中基本生活出现严重困难的；五是其他发生急难情况导致个人或家庭基本生活无法保障，且需立即采取措施防止造成无法挽回的损失或无法改变严重后果的。此外，乡镇人民政府（街道办事处）、县级人民政府民政部门受理“小额快救”申请后，确认申请对象提供的相关材料及遭遇的急难情形属实的，不再进行家庭经济状况核对和公示，直接登记救助对象、事由、金额等信息，并给予救助。在实施“小额快救”后基本生活仍然存在困难的，可按程序申请常规临时救助。据介绍，“小额快救”最高不超过当地1个月最低生活保障标准，其他临时救助最高不超过当地城市最低生活保障月标准的6倍。（新华社）", "ctime": 1789108885, "time_str": "14:41:25", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260911/c679822363.shtml"}, {"id": "5155643", "title": "日韩股市集体收跌", "content" const META     = {"update_time": "2026-09-11 16:12:42", "sentiment_score": 54.95495495495496, "agents": []};

// 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
