is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260914/c679895212.shtml"}, {"id": "5169757", "title": "慧与美股盘前跌超10%", "content": "慧与美股盘前跌超10%，现报55.81美元。", "ctime": 1789392296, "time_str": "21:24:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260914/c679895137.shtml"}, {"id": "5169725", "title": "伊朗：因美国施压缺席国际原子能机构大会", "content": "伊朗伊斯兰共和国广播电视台14日报道说，伊朗原子能组织主席伊斯拉米12日搭乘航班前往奥地利参加国际原子能机构第70届大会，但因受到美国等方面阻挠，12日当天返回伊朗首都德黑兰。伊朗驻国际原子能机构代表14日在大会上谴责此举侵犯其成员国权利。 伊朗外交部发言人巴加埃当天在新闻发布会上说，奥地利未给伊朗代表团签发入境签证，奥地利政府向伊朗表示此举源于美国施压。 巴加埃表示，奥地利政府的这一举动，“是绝对不可接受的”。按照他们的承诺，他们本应为伊朗代表团发放入境签证。他说，任何国际组织所在国或国际会议主办国政府，都应当首先顾及自身信誉，不让美国压力导致自己无法履行承诺。 国际原子能机构第70届大会于14日至18日在奥地利首都维也纳举行。伊朗驻国际原子能机构代表礼萨·纳杰菲14日在大会发言说，伊斯拉米被奥地利拒绝入境，侵犯了伊朗作为国际原子能机构成员国出席大会的权利，“这是一起严重事件，违反了机构章程所确立的主权平等原则”。 国际原子能机构大会是该机构成员国年度会议，也是该机构主要决策会议。大会每年举行一次，成员国代表审议机构工作，讨论核领域重要问题，并就机构工作和优先事项作出决定。(新华社)", "ctime": 1789392101, "time_str": "21:21:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260914/c679895104.shtml"}, {"id": "5169707", "title": "广汽集团：拟发行股份收购某整车合资公司部分股权并停牌", "content": "广汽集团公告，公司与一汽股份签署《意向协议》，拟发行股份购买一汽股份持有的某整车合资公司的部分股权并募集配套资金。本次交易尚处筹划阶段，预计构成重大资产重组及关联交易，不构成本公司实际控制人变更，不构成重组上市；公司A股自2026年9月14日开市起停牌，预计停牌时间不超过10个交易日。", "ctime": 1789391976, "time_str": "21:19:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260914/c679895077.shtml"}, {"id": "5169679", "title": "永泰运：王巧玲减持计划期限届满，减持49.35万股", "content": "永泰运公告，持股5%以上股东王巧玲原计划于2026年6月12日至2026年9月11日减持不超过297.93万股，占剔除公司回购专用证券账户股份后总股本的3.00%。截至期限届满，王巧玲通过集中竞价交易于2026年7月10日至2026年7月20日减持49.35万股，减持比例0.48%，减持后持股550.65万股，占总股本5.30%。", "ctime": 1789391813, "time_str": "21:16:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260914/c679895053.shtml"}, {"id": 破1200亿美元", "content": "今年以来，我国创新药出海步伐再提速，对外授权交易总额突破1200亿美元，同比增长36%。其中首付款规模超百亿美元，市场同时呈现单笔平均交易金额稳步增长、首付款金额与占比双双提升、大额交易频频落地的特点，彰显出本土创新药的含金量不断提高。这一数据由国家药监局在14日举行的2026年全国药品安全宣传周启动仪式上发布。国家药监局有关负责人介绍，近年来国家药监局持续深化监管改革，推动医药产业从“量的增长”向“质的飞跃”转型，全链条释放医药创新活力。（新华社）", "ctime": 1789390711, "time_str": "20:58:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260914/c679894706.shtml"}, {"id": "5169269", "title": "2026年上半年德企对华投资同比增长三分之一", "content": "德国经济研究所14日发布分析报告显示，德国企业对华投资继续保持较高水平，2026年上半年新增投资同比增长约三分之一。 报告基于德国央行数据分析说，今年上半年，德企对华新增投资额达到56亿欧元。该研究所此前分析显示，2025年全年，德企对华新增投资额约70亿欧元。 报告说，多数德国企业持续看重中国市场。报告援引中国德国商会的调查说，超过85%的在华德企计划维持或扩大目前业务规模，超半数计划进一步增加投资。 德国经济研究所专家于尔根·马特斯表示，德国企业继续选择在中国投资，一个重要原因是中国不仅是德企重要销售市场，也是其提升自身竞争力的“健身房”。德企在中国市场积累经验，有助于其在全球市场竞争中取得成功。(新华社)", "ctime": 1789390431, "time_str": "20:53:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260914/c679894628.shtml"}, {"id": "5169231", "title": "三星电机与高通据报合作开发有机桥技术", "content": "据报道，三星电机正与高通共同开发用于AI芯片先进封装的“有机桥”技术，双方已开展研发和验证工作超过一年。三星电机还在与其他客户同步开发基于有机桥的2.1D封装基板。据报道，三星电机计划将具有5至7层重新布线层（RDL）的有机桥嵌入FC-BGA基板，目标将线宽和线距缩小至1.5至2微米。该技术被视为英特尔EMIB硅桥封装技术的潜在替代方案。（界面新闻）", "ctime": 1789390289, "time_str": "20:51:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260914/c679894545.shtml"}, {"id": "5169223", "title": "小马智行第四代自动驾驶重卡亮相，将于年内规模量产", "content": "9月14日，小马智行与广汽领程联合打造的L4级自动驾驶重卡在汉诺威国际商用车展（IAA Transportation）首发。该车型基于广汽领程T9纯电重卡打造，为小马智行第四代自动驾驶重卡家族成员之一，计划于今年内实现规模化量产，并投放至干线物流、专线物流及港口运输等场景。新车搭载小马智行第四代L4级自动驾驶卡车系统及广汽领程全冗余线控底盘，配置9颗激光雷达、3颗毫米波雷达和13个摄像头，并采用与第七代Robotaxi相同的域控制器。（界面新闻）", "ctime": 1789390250, "time_str": "20:50:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260914/c679894529.shtml"}, {"id": "5169213", "title": "立航科技：刘随阳拟协议转让15.91%股份", "content": "立航科技公告，控股股东、实际控制人刘随阳于2026年9月14日签署《股份转让协议》，拟将1233.45万股股份协议转让给泓川源善渊和李奔，其中845.93万股占10.91%、387.53万股占5.00%，转让价格均为51.21元/股。本次权益变动尚需取得上交所合规性确认并办理股份过户登记，不涉及公司控制权变更。", "ctime": 1789390213, "time_str": "20:50:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260914/c679894512.shtml"}, {"id": "5169109", "title": "键凯科技：LNP下半年收入需要以实际交付订单情况为准", "content": "在半年度业绩会上，键凯科技介绍，盘锦工厂的产能利用率较去年同期有所提升，除了为天津键凯提供原材料和中间体以外，已经开始向部分新进客户稳定供应终产品。LNP业务方面，公司目前向国内外约200个LNP相关客户供应LNP产品或提供与LNP相关的技术服务，其中绝大多数为国内早期研发阶段的客户，因此下半年相关收入情况需要以实际交付的订单情况为准。目前mRNA领域的需求主要有mRNA疫苗、in vivo CAR、基因编辑等几个方向。除了销售产品，公司还为客户提供定制服务、质量研究、注册申报等配套技术服务。（人民财讯）", "ctime": 1789389683, "time_str": "20:41:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260914/c679894345.shtml"}, {"id": "5169101", "title": "LME三个月期铜跌破每吨14000美元，最新下跌1.8%", "content": "LME三个月期铜跌破每吨14000美元，最新下跌1.8%。", "ctime": 1789389664, "time_str": "20:41:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260914/c679894327.shtml"}, {"id": "5169093", "title": "麦克莫兰铜金美股盘前跌超5%", "content": "麦克莫兰铜金美股盘前跌超5%，现报67.5美元。", "ctime": 1789389623, "time_str": "20:40:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260914/c679894253.shtml"}, {"id": "5169077", "title": "戴尔科技美股盘前跌超5%", "content": "戴尔科技美股盘前跌超5%，现报538.46美元。", "ctime": 1789389553, "time_str": "20:39:13", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260914/c679893989.shtml"}, {"id": "5169049", "title": "美年健康：实控人一致行动人拟合计减持不超2066.6万股", "content": "美年健康公告，公司实际控制人俞熔的一致行动人通怡桃李3号、通怡桃李12号私募证券投资基金拟自减持预披露公告发布之日起15个交易日后的3个月内，通过集中竞价方式合计减持不超过2066.6万股，占公司总股本的0.53%。其中，通怡3号拟减持不超过1406.95万股，占总股本的0.36%；通怡1 // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
