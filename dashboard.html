}
.card:hover { background: var(--bg-card-hover); border-color: #334155; }
.badge {

  height: 6px; border-radius: 3px; background: #1e293b; overflow: hidden;
}
.score-bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s; }
.up { color: var(--red); }
.down { color: var(--green); }
.pulse { animation: pulse 2s infinite; }
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}
.glow { box-shadow: 0 0 20px rgba(59,130,246,0.15); }

t": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260612/c677429478.shtml"}, {"id": "4522229", "title": "建業地產：5月份，本集团取得物业合同销售额6.96亿元，同比增加1.2%", "content": "建業地產公告，2026年5月份，本集团取得物业合同销售额6.96亿元，同比增加为1.2%；合同销售建筑面积10.54万平方米，同比增加为7.0%；每平方米平均销售价格为6602元，同比减少为5.4%。截至2026年5月31日止5个月，本集团已取得物业合同销售总额29.16亿元，同比减少为14.1%；总合同销售建筑面积44.37万平方米，同比减少为19.0%；每平方米平均销售价格为6572元，同比增加为6.0%。", "ctime": 1781261064, "time_str": "18:44:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260612/c677429471.shtml"}, {"id": "4522227", "title": "证监会：同意长鑫科技集团股份有限公司首次公开发行股票注册", "content": "证监会发布关于同意长鑫科技集团股份有限公司首次公开发行股票注册的批复。", "ctime": 1781261045, "time_str": "18:44:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260612/c677429462.shtml"}, {"id": "4522217", "title": "泽连斯基签署法令实施新一轮对俄制裁", "content": "当地时间12日，乌克兰总统办公室官网发布消息，总统泽连斯基已签署总统令，落实该国国家安全与国防委员会出台的新一轮对俄制裁决议，本次制裁覆盖29名自然人与17家俄罗斯媒体机构。目前制裁细则与具体实施范围，仍待乌克兰相关部门发布完整官方文件予以明确。（央视新闻）", "ctime": 1781260971, "time_str": "18:42:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260612/c677429429.shtml"}, {"id": "4522205", "title": "伊美谅解备忘录文本框架公布", "content": "伊朗国家通讯社公布伊美谅解备忘录文本框架，主要内容包括核问题保持不变、霍尔木兹海峡管理权不移交、在所有战线结束战争、解冻伊朗被冻结资产、战争赔偿议题、解除制裁细节及60天谈判期等。（央视新闻）", "ctime": 1781260796, "time_str": "18:39:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260612/c677429360.shtml"}, {"id": "4522201", "title": "*ST立航：公司股票将于6月16日撤销退市风险警示", "content": "*ST立航公告，公司股票将于2026年6月15日停牌一天，6月16日起复牌并撤销退市风险警示。撤销后A股简称将由“*ST立航”变更为“立航科技”，日涨跌幅限制由5%调整为10%。此前，因2024年年度经审计的利润总额、净利润或扣除非经常性损益后的净利润孰低者为负值且营业收入低于3亿元，公司股票自2025年4月29日起被实施退市风险警示。2025年营业收入为3.45亿元，扣除与主营业务无关的营业收入为3.35亿元，利润总额为-2.06亿元，归属于母公司所有者的净利润为-2.08亿元，归属于母公司所有者的扣除非经常性损益的净利润为-2.13亿元，2025年末 k_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260612/c677429213.shtml"}, {"id": "4522125", "title": "多部门部署加强重点时段农村务农务工出行安全整治", "content": "抽水蓄能作为技术成熟、经济性优、具备大规模开发潜力的绿色灵活调节电源，是保障电力系统安全稳定运行不可或缺的核心力量。此次发布的报告显示，我国抽水蓄能行业发展从“规模扩张”转向“规模与质量并重”，“十五五”，我国将新增投产抽水蓄能1亿千瓦左右。(新华社)", "ctime": 1781260352, "time_str": "18:32:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260612/c677429162.shtml"}, {"id": "4522117", "title": "*ST东易：持股5%以上股东霖鲲科技被司法冻结0.32%公司股份", "content": "*ST东易公告，持股5%以上股东天津东易霖鲲科技有限公司所持有本公司的300万股股份被司法冻结，占其所持股份比例为4.43%，占公司总股本比例为0.32%。本次司法冻结起始日为2026年6月10日，到期日为2026年12月9日，司法冻结履行为国家税务总局中新天津生态城税务局，原因为司法冻结。", "ctime": 1781260318, "time_str": "18:31:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260612/c677429151.shtml"}, {"id": "4522115", "title": "富淼科技：拟51%股权收购沃特泰科", "content": "富淼科技公告，拟以现金方式购买嘉兴沃特泰科环保科技股份有限公司6名股东持有的51.00%股权。沃特泰科是一家集工业水处理化学品的研发、生产和销售，以及定制化运营管理服务于一体的工业水处理综合服务提供商。本次交易完成后，沃特泰科将成为富淼科技的控股子公司。", "ctime": 1781260304, "time_str": "18:31:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260612/c677429145.shtml"}, {"id": "4522113", "title": "富淼科技：与沃特泰科签署战略合作框架协议", "content": "富淼科技公告，公司与沃特泰科于2026年6月12日签署了《战略合作框架协议》。双方旨在推动中国工业水处理行业高质量发展，通过资源整合、技术协作、市场协同，共同打造具有行业影响力的工业水处理整体解决方案能力。合作内容包括产品与供应链合作、技术与研发合作、市场与项目合作、生产与制造合作、产业链延伸与新兴市场领域合作以及人才与管理合作。协议自双方法定代表人或授权代表签字并加盖公章之日起生效，有效期为三年。本次协议对公司2026年度及未来业绩不构成直接影响。", "ctime": 1781260296, "time_str": "18:31:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260612/c677429135.shtml"}, {"id": "4522109", "title": "美媒称伊最高领袖或未批准美伊协议", "content": "美国总统特朗普当地时间6月11日下午在白宫对媒体表示，美国已与伊朗达成一项协议，可能本周末在欧洲签署，美国副总统万斯将在场。据美国“阿克西奥斯新闻网站（Axios）”援引一名美国官员和一位来自调解国消息人士的话报道称，美国和伊朗已经就协议文本达成一致，但该文本可能尚未得到伊朗最高领袖穆杰塔巴·哈梅内伊的批准。报道称，来自卡塔尔方面的调解人和伊朗外长阿拉格齐6月10日谈了几个小时，于当晚达成初步协议。会谈期间，卡塔尔官员多次与美国总统特使威特科夫等人通电话。报道还提到，4架美国空军C-17飞机已启程前往欧洲，为万斯可能在未来几天参加的、在瑞士日内瓦举行的签字仪式提供支持。(CCTV国际时讯)", "ctime": 1781260265, "time_str": "18:31:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260612/c677429124.shtml"}, {"id": "4522069", "title": "生物股份：取得兴业银行呼和浩特分行股票回购专项贷款承诺函", "content": "生物股份公告，近日，公司取得兴业银行股份有限公司呼和浩特分行出具的《贷款承诺函》，主要内容如下：1、贷款金额：不超过人民币3.6亿元（且不超过公司回购股票金额的90%）；2、贷款期限：不超过3年；3、贷款用途：用于回购公司股票。本次股票回购专项贷款的相关事项以双方正式签订的股票回购贷款合同为准。", "ctime": 1781260209, "time_str": "18:30:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260612/c677429031.shtml"}, {"id": "4522057", "title": "优必选携手沐曦 夯实国产具身智能产业根基", "content": "6月11日，国产高性能GPU领军企业沐曦股份与“人形机器人第一股”优必选科技在南京正式签订战略合作协议，合资成立曦选创智科技（无锡）有限公司，旨在打通具身智能终端场景与国产高端算力之间的协同壁垒，助力国内具身智能产业迈向自主高质量发展新阶段。此次落地无锡高新区的曦选创智项目注册资本为1亿元，由沐曦股份、优必选科技等企业联合成立。项目计划于2028年实现量产，届时将为中国具身智能产业打造安全、可靠的“国产大脑”，大幅提升人形机器人的自主感知、决策与执行能力。此外，项目将推动具身智能数据采集中心落地，规划部署数百台优必选工业级机器人，利用产线及真实工况数据持续“喂养”模型训练、算子优化与系统评测。（新华社）", "ctime": 1781260152, "time_str": "18:29:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260612/c677428989.shtml"}, {"id": "4522055", "title": "美迪西：股东林长青拟减持不超1.12%公司股份", "content": "美迪西公告，股东林长青拟减持不超1.12%公司股份。", "ctime": 1781260150, "time_str": "18:29:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260612/c677428985.shtml"}, {"id": "4522017", "title": "三佳科技：拟向合肥创新投发行股票数量不超过公司总股本的30%", "content": "三佳科技公告，公司与合肥创新投签署《补充协议》，调整后本次发行定价基准日为发行期首日，发行价格不低于定价基准日前20个交易日股票交易均价的80%。发行股票数量为按照募集资金总额除以发行价格确定，且不超过本次发行前公司总股本的30%。本次发行尚需提交公司股东会审议，上交所审核通过和中国证监会同意注册。", "ctime": 1781259980, "time_str": "18:26:20", "stock_code": "", "stock_name ", "content": "6月12日，菲律宾国家减灾委发布报告，对此前发布的地震灾情数据进行了更正。减灾委称，由于持续不断地验证和核实，相关的数据在一定程度上会发生变化。根据最新的报告，截至6月12日上午8时，6月8日的南部强震导致的死亡人数从此前报告的55人调整为46人，受伤人数从此前报告的1120人下调为688人，失踪人数由31人上调至38人。此外，报告还显示，地震造成的受灾人数超过39万。有近2万处房屋受损。292处包括学校、政府机构、医院在内的公共设施受损。有13个城镇已经宣布进入灾难状态。（央视新闻）", "ctime": 1781259559, "time_str": "18:19:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260612/c677428602.shtml"}, {"id": "4521947", "title": "中芯国际：已完成向中芯北方集成电路制造（北京）有限公司支付购买资产款项", "content": "中芯国际公告，公司已完成向中芯北方集成电路制造（北京）有限公司支付购买资产款项，本次交易涉及标的资产的过户手续已经办理完毕，标的公司49%股权已经变更登记至公司名下，截至本公告披露日，标的公司成为公司直接及间接持股的全资子公司。", "ctime": 1781259490, "time_str": "18:18:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260612/c677428561.shtml"}, {"id": "4521937", "title": "洁美科技：全资子公司浙江洁美电材拟投资7亿元建设新型材料项目", "content": "洁美科技公告，为进一步提升公司高端电子元器件封装材料的生产技术水平，扩大产能规模，满足持续增长的下游高端电子元器件封装材料的需求，公司全资子公司浙江洁美电子信息材料有限公司于2026年6月12日与浙江省安吉县梅溪镇人民政府签署了《安吉县招商引资项目投资合同》，拟投资7亿元在浙江省安吉县梅溪镇临港工业园区投资建设“年产5万吨高端电子元器件封装新型材料项目”。", "ctime": 1781259484, "time_str": "18:18:04", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260612/c677428554.shtml"}, {"id": "4521935", "title": "福光股份：应用于航天领域的产品销售收入占营业收入的比例约为3.48% 对公司业绩影响较小", "content": "福光股份公告，公司股票交易连续3个交易日内（2026年6月10日、2026年6月11日、2026年6月12日）收盘价格涨幅偏离值累计达到30%，属于股票交易异常波动。经公司自查，并发函询证公司控股股东、实际控制人，截至本公告披露日，不存在应披露而未披露的重大信息。公司目前生产经营正常，生产经营未发生重大变化。应用于航天领域的产品销售收入占营业收入的比例约为3.48%，对公司业绩影响较小，敬请投资者注意投资风险。", "ctime": 1781259450, "time_str": "18:17:30", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260612/c677428542.shtml"}, {"id": "4521931", "title": "合金投资：拟设立全资子公司昌吉九洲恒昌睿达物流有限公司", "content": "合金投资公告，公司拟以自有或自筹资金对外投资设立全资子公司昌吉九洲恒昌睿达物流有限公司，注册资本1500万元人民币。", "ctime": 1781259436, "time_str": "18:17:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260612/c677428535.shtml"}, {"id": "4521927", "title": "中航西飞：公司及所属子公司与北方特气(自贡)材料科技有限公司无直接或间接股权关系", "content": "中航西飞发布澄清公告，近日，公司关注到互联网上一则消息流传，消息称：“近日，中航西飞旗下北方特气(自贡)材料科技有限公司正式发布高端电子特气产业基地建设规划，为破解高端特气‘卡脖子’难题注入强劲动力。该项目总投资30 亿元，明确规划新增六氟化钨产线。”\n经核查，公司及所属子公司与北方特气(自贡)材料科技有限公司无直接或间接股权关系，也无业务合作关系。\n北方特气(自贡)材料科技有限公司与西安飞机工业装饰装修工程股份有限公司（以下简称“西飞装饰”）存在股权关系，公司全资子公司西安飞机工业（集团）有限责任公司（以下简称“航空工业西飞”）是西飞装饰的原始发起人、原控股股东，根据《中华人民共和国市场主体登记管理条例》的规定，股份有限公司仅登记发起人信息，故仍将航空工业西飞登记为西飞装饰股东之一，上述登记信息与实际情况不符。截至目前，西飞装饰的股东情况已发生变化，其控股股东实际为“西安航空发动机集团天鼎有限公司”，与公司及航空工业西飞无任何直接或间接股权关系。\n目前，公司科研生产按计划有序开展。", "ctime": 1781259402, "time_str": "18:16:42", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260612/c677428520.shtml"}, {"id": "4521919", "title": "中基协发布《公开募集证券投资基金可持续投资策略应用指引（试行）》", "content": "为了规范公开募集证券投资基金可持续投资策略应用，保护投资者合法权益，中国证券投资基金业协会（简称协会）起草了《公开募集证券投资基金可持续投资策略应用指引（试行）》（以下简称《指引》），经协会理事会审议通过，现予发布。《指引》自发布之日起实施，各公募基金管理人应用可持续投资策略的基金不符合《指引》第十一条规定的，应当按照中国证监会关于公开募集证券投资基金业绩比较基准的相关规定予以调整；不符合《指引》其他规定的，应当自施行之日起一年内予以调整。", "ctime": 1781259334, "time_str": "18:15:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260612/c677428496.shtml"}, {"id": "4521911", "title": "上海凯宝：控股股东、实际控制人等拟增持不低于人民币 150 万元公司股份", "content": "上海凯宝公告，控股股东、实际控制人及部分董事、高级管理人员拟增持不低于人民币 150 万元公司股份。", "ctime": 1781259284, "time_str": "18:14:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260612/c677428476.shtml"}, {"id": "4521883", "title": "京东方Ａ：农业银行北京市分行承诺提供不超 9 亿元的专项贷款资金，用于公司股份回购", "content": "京东方Ａ公告，近日，公司收到中国农业银行股份有限公司北京市分行（以下简称“农业银行北京市分行”）出具的《贷款承诺函》，农业银行北京市分行承诺为公司提供不超过人民币 9 亿元的专项贷款资金用于公司股份回购。", "ctime": 1781259075, "time_str": "18:11:15", "stock_code": "", "stock_name": "", "stock_market": "", const SECTORS  = [{"name": "金融", "hit_count": 44, "etfs": []}, {"name": "半导体", "hit_count": 25, "etfs": []}, {"name": "人工智能", "hit_count": 16, "etfs": []}, {"name": "数据要素", "hit_count": 16, "etfs": []}, {"name": "军工", "hit_count": 13, "etfs": []}, {"name": "消费", "hit_count": 10, "etfs": []}, {"name": "医药", "hit_count": 8, "etfs": []}, {"name": "新能源", "hit_count": 6, "etfs": []}];
const META     = {"update_time": "2026-06-12 18:49:29", "sentiment_score": 55.65217391304348, "agents": []};

// 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
