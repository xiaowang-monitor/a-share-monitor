发布暴雨蓝色预警", "content": "中央气象台5月20日18时继续发布暴雨蓝色预警：预计，5月20日20时至21日20时，湖南南部、江西中南部、福建西部、广西中北部和东南部、广东北部和西南部以及陕西西部等地部分地区有大到暴雨，其中，广西东北部和东南部、广东北部和西南部等地部分地区有大暴雨（100～220毫米）。上述部分地区伴有短时强降水（最大小时降雨量30～50毫米，局地可超过70毫米），局地有雷暴大风等强对流天气。", "ctime": 1779271557, "time_str": "18:05:57", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260520/c676839904.shtml"}, {"id": "4385621", "title": "菲参议员向最高法院申请阻止将其逮捕的请求被驳回", "content": "菲律宾最高法院20日发表声明，驳回了菲参议员、前国家警察总监罗纳德·德拉罗萨向最高法院发出的颁布临时限制令的请求，该限制令旨在阻止政府将其逮捕。德拉罗萨随即请求菲最高法院立即阻止政府逮捕他本人或将他移交给国际刑事法院。国际刑事法院本月11日发表声明，公开了去年11月秘密签发的针对德拉罗萨的逮捕令，理由是他参与了菲前总统杜特尔特领导的打击毒品犯罪行动。（新华社）", "ctime": 1779271464, "time_str": "18:04:24", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260520/c676839841.shtml"}, {"id": "4385581", "title": "国家组织冠脉支架接续采购落地 临床主流产品普遍中选", "content": "“国家组织冠脉支架集中带量采购”第二轮接续采购20日在天津开标。共15家企业的30个产品参与投标，投标企业全部中选，27个产品获拟中选资格，临床在用的国内外企业主流产品普遍中选。冠脉支架是首个纳入国家组织高值医用耗材集中带量采购的品种。此次共4468家医疗机构填报需求量，较首次集采的2408家增加86%，较上一轮接续采购的3626家增加23%，更多医疗机构开展支架植入术，将为急性心梗患者就近治疗、挽救生命赢得更多宝贵时间。据悉，医疗机构年度采购需求量约273万个，较首次集采的107万个增加155%，较上一轮接续采购的186万个增加47%，集采中选产品越来越被临床所认可。（新华社）\n　　", "ctime": 1779271258, "time_str": "18:00:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260520/c676839777.shtml"}, {"id": "4385539", "title": "中国高校包揽第13届世界大学生超级计算机竞赛冠亚军", "content": "5月20日，第13届ASC世界大学生超级计算机竞赛总决赛在江苏无锡落幕。本届比赛吸引了25支来自全球高校的大学生队伍，在量子计算、人工智能等前沿领域，进行同场竞技。经过为期5天的激烈角逐，北京大学、清华大学分获总决赛冠亚军。据了解，这项由中国发起的国际大学生超算赛事，目前已累计吸引全球超过一万名大学生参赛，为全球青年科技人才搭建起AI时代的实战训练平台。（央视新闻）", "ctime": 1779270951, "time_str": "17:55:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260520/c676839627.shtml"}, {"id": "4385537", "title": "吉鑫科技：股东张毅洁拟减持不超过0.62%", "content": "吉鑫科技公告，公司持股5%以上股东张毅洁现持有4865.97万股，占5.02%；计划自2026年6月11日至2026年9月10日期间，通过集中竞价方式减持不超过600万股，占0.62%，减持价格根据减持时二级市场价格确定。", "ctime": 1779270833, "time_str": "17:53:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260520/c676839471.shtml"}, {"id": "4385535", "title": "廖岷会见美国科恩集团高级顾问艾伦", "content": "2026年5月19日上午，财政部副部长廖岷在北京会见美国科恩集团高级顾问艾伦，就中美关系和中美经贸关系等议题交换了意见。 (财政部)", "ctime": 1779270813, "time_str": "17:53:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260520/c676839456.shtml"}, {"id": "4385515", "title": "东宏股份：签订7276.08万元采购合同", "content": "东宏股份公告，公司近日与山东筑畅建材有限公司签订了《采购合同》，合同金额为人民币7276.08万元。合同标的为预制直埋保温管及配套管件。合同自双方法定代表人或委托代理人签字或盖章并加盖公司公章或采购专用章之日起生效，自双方权利、义务履行完毕之日止。若合同顺利履行，将对公司本年度及未来业绩产生一定积极影响。", "ctime": 1779270593, "time_str": "17:49:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260520/c676839356.shtml"}, {"id": "4385491", "title": "高测股份：董事长张顼累计减持2074.37万股，持股比例降至20.00%", "content": "高测股份公告，公司控股股东、实际控制人、董事长张顼于2026年4月15日至2026年5月19日通过集中竞价交易和大宗交易方式合计减持公司股份2074.37万股，占公司总股本的2.50%，持股比例由22.50%减少至20.00%，权益变动触及5%整数倍。", "ctime": 1779270188, "time_str": "17:43:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260520/c676839145.shtml"}, {"id": "4385489", "title": "中俄投资合作委员会秘书长第21次会议在京召开", "content": "5月18日，周海兵副主任与俄罗斯联邦经济发展部副部长伊利乔夫在京共同主持召开中俄投资合作委员会秘书长第21次会议，协调推动两国投资合作。国家发展改革委、外交部等相关政府部门，俄驻华使馆以及中俄有关企业代表参加了会议。(国家发展改革委)", "ctime": 1779270181, "time_str": "17:43:01", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260520/c676839143.shtml"}, {"id": "4385479", "title": "工信部决定组织开展2026年度道路机动车辆生产企业及产品生产一致性监督检查工作", "content": "工业和信息化部装备工业一司决定组织开展2026年度道路机动车辆生产企业及产品生产一致性监督检查工作。对于生产一致性保证能力等发生重大变化、不能持续保持生产准入条件的道路机动车辆生产企业，采取公开通报、暂停相关产品《公告》、暂停企业新产品申报等处理处罚措施。坚持问题导向，赴道路机动车辆生产企业、产品经销场所等抽取样车和部分关键零部件，加大对非理性竞争问题反映多、生产一致性和质量安全风险较高等企业相关车型的抽查力度。样品抽取后，对样品软硬件状态进行封样，转送至有关道路机动车辆检验检测机构。组织有关道路机动车辆检验检测机构对送检样品开展相关国家标准符合性等检验检测，重点开展整车结构参数核查、整车碰撞、电动汽车安全要求等整车检验检测项目和电动汽车用动力蓄电池包安全要求等零部件检验检测项目。同时，随机抽取部分样品开展交叉复检，加强对道路机动车辆检验检测机构工作质效监督检查。对于经检验检测相关产品不符合国家标准和生产一致性管理要求的道路机动车辆生产企业，采取公开通报、暂停相关产品《公告》、暂停企业新产品申报等处理处罚措施。（工信部）", "ctime": 1779270014, "time_str": "17:40:14", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260520/c676839060.shtml"}, {"id": "4385465", "title": "广东江门发布防汛Ⅲ级应急响应 广茂铁路部分列车停运", "content": "记者从广东省江门市三防指挥部获悉，据气象部门预计，今晚到明天继续受季风上岸影响，江门市有大到暴雨局部大暴雨，伴有雷暴和局地8级左右短时大风；累积雨量40～60毫米，局部200～250毫米，最大小时雨量70～90毫米；强降雨易发生在夜间至早晨时段。截至今日15时10分，江门市恩平、新会、台山发布红色暴雨预警信号，开平、鹤山发布橙色暴雨预警信号，蓬江、江海发布黄色暴雨预警信号。江门市气象局于5月20日15时将暴雨Ⅲ级预警升级为Ⅱ级预警。根据《江门市防汛防旱防风防冻应急预案》，江门市三防指挥部决定于5月20日15时15分将防汛Ⅳ级应急响应提升为防汛Ⅲ级应急响应。受暴雨天气影响，国铁广州局计划5月20日至21日对广茂铁路部分列车采取停运措施，具体停运车次可在12306网站（App）查询。部分列车也将出现不同程度晚点，旅客可以密切关注铁路12306网站及车站公告，掌握列车开行信息。（央视新闻）", "ctime": 1779269729, "time_str": "17:35:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260520/c676838931.shtml"}, {"id": "4385459", "title": "世卫组织：埃博拉疫情在全球范围流行的风险较低", "content": "当地时间20日，世界卫生组织总干事谭德塞表示，紧急委员会一致同意埃博拉疫情构成国际关注的突发公共卫生事件，但并非全球大流行。目前埃博拉疫情在国家和区域层面的风险较高，全球范围流行的风险较低。谭德塞通报称，除已确诊病例外，还有近600例疑似埃博拉病例和139例疑似因埃博拉造成的死亡病例。（央视新闻）", "ctime": 1779269623, "time_str": "17:33:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260520/c676838891.shtml"}, {"id": "4385457", "title": "罕王黄金：Mt Bundy金矿项目启动道路及矿山营地建设工程", "content": "罕王黄金公告，公司董事会宣布在Mt Bundy金矿项目矿山管理计划获批及矿山作业授权获授予后，项目现场已启动进场道路、258人矿山营地以及相关配套设施的建设工程。Mt Bundy金矿项目位于澳大利亚北领地达尔文市东南约100公里处，拥有符合JORC规范（2012版本）的347万盎司黄金资源量及188万盎司黄金储量。根据更新版的最终可行性研究，预计项目在最初的17年矿山服务年限内，前10年平均年产黄金15万盎司。公司目标于2028年第一季度开始生产黄金，届时该金矿预计将成为北领地第二大金矿。项目建设阶段预计将创造超过400个就业岗位，并为当地承包商、供应商及服务提供商带来显著收益。", "ctime": 1779269613, "time_str": "17:33:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260520/c676838889.shtml"}, {"id": "4385443", "title": "南向资金今日净买入57.08亿港元 中芯国际获净买入居前", "content": "南向资金今日净买入57.08亿港元。中芯国际、中国移动分别获净买入约21.66亿港元、15.64亿港元；兆易创新、阿里巴巴-W分别遭净卖出4.70亿港元、1.68亿港元。", "ctime": 1779269478, "time_str": "17:31:18", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260520/c676838810.shtml"}, {"id": "4385433", "title": "中创智领集团新能源汽车高端零部件产业基地项目开工", "content": "5月20日，中创智领集团新能源汽车高端零部件产业基地项目在武进高新区正式开工。中创智领集团是全球领先的煤矿综采装备供应商和国际知名的汽车零部件制造企业。项目持续投资约100亿元，规划建设标准无尘车间、十万级洁净室、智能化仓储基地及专业研发实验室。项目预计2027年6月建成投产，全面达产后，电动化、智能化系列产品年产能将超700万套。核心产品涵盖驱动电机定转子、线控刹车电机、全主动悬架电液泵、线控转向电机等，广泛应用于智能底盘线控执行系统，可充分满足高阶智能驾驶对底盘精准响应、高效执行的核心要求，同时补强常州新能源汽车产业链，带动上下游企业集聚发展。（常州发布）", "ctime": 1779269309, "time_str": "17:28:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260520/c676838688.shtml"}, {"id": "4385425", "title": "中蒙边界联委会第七次会议在北京举行", "content": "2026年5月19日至20日，中国蒙古边界联合委员会第七次会议在北京举行。双方积极评价双边关系，充分肯定两国边界管理与合作成果，就中蒙边界管理制度条约执行情况、边界管理、边境管控和执法安全合作、口岸和互联互通合作、边境防火、边界水等议题深入交换意见并达成广泛共识。双方同意继续落实好两国领导人重要共识，以构建中蒙命运共同体为指引，进一步发挥联委会作用，维护两国边境地区和平安宁，深化各领域涉边合作，促进边境地区发展繁荣。（央视新闻）", "ctime": 1779269187, "time_str": "17:26:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260520/c676838627.shtml"}, {"id": "4385419", "title": "帝奥微：拟3500万元出售灵心巧手0.21%股份", "content": "帝奥微公告，拟与德诺资本签订《关于灵心巧手（北京）科技股份有限公司之股份转让协议》等相关协议，出售所持灵心巧手0.21%股份，转让对价为3500万元。交易完成后，帝奥微持有灵心巧手股份比例由1.40%下降至1.19%。本次交易基于公司发展规划，有利于整合和优化资产结构，提高资产流动性及使用效率，增加运营资金，为公司经营提供资金支持，更加聚焦主业，持续提升核心竞争力。", "ctime": 1779269146, "time_str": "17:25:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260520/c676838613.shtml"}, {"id": "4385407", "title": "长虹华意：首席合规官杨凡及原董事史强增持股份", "content": "长虹华意公告，公司首席合规官杨凡及原董事兼董事会秘书史强于2026年5月19日通过深交所集中竞价方式分别增持公司股份31500股、33200股，成交均价分别为9.61元/股、9.57元/股；增持后，杨凡持股54.58万股，占总股本0.08%；史强持股34.27万股，占总股本0.05%。本次增持符合相关法规，不影响公司股权分布及控制权，增持主体承诺自增持完成之日起三年内不得减持。", "ctime": 1779269083, "time_str": "17:24:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260520/c676838584.shtml"}, {"id": "4385405", "title": "璞泰来：拟投资56亿元建设年产72亿平方米锂离子电池隔膜建设项目", "content": "璞泰来公告，公司计划投资56亿元建设年产72亿平方米锂离子电池隔膜建设项目，其中一期投资26亿元，二期投资30亿元。项目分两期实施，一期由四川卓勤新材料科技有限公司建设8条基膜生产线，预计形成年产32亿平方米锂离子电池隔膜的生产能力；二期由四川高聚材料科技有限公司在邛崃市建设8条基膜生产线，预计形成年产40亿平方米锂离子电池隔膜的生产能力。项目旨在提升公司基膜自供率，实现基膜及涂覆加工业务协同发展和市场占有率的同步提升。", "ctime": 1779269026, "time_str": "17:23:46", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260520/c676838563.shtml"}, {"id": "4385403", "title": "通鼎互联：公司目前未开展光模块业务", "content": "通鼎互联5月20日在业绩说明会表示，公司目前未开展光模块业务。公司主营业务聚焦于光纤光缆、通信电缆、电力电缆及储能安防等领域。（人民财讯）", "ctime": 1779268982, "time_str": "17:23:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260520/c676838544.shtml"}, {"id": "4385399", "title": "玲珑轮胎：控股股东拟增持1.8亿元至2.3亿元", "content": "玲珑轮胎公告，公司控股股东玲珑集团计划自2026年5月21日至2026年11月20日期间，通过上海证券交易所集中竞价交易方式增持公司股票，增持金额不低于1.8亿元，不高于2.3亿元。本次增持拟使用自有资金和自筹资金。增持计划基于对公司未来发展的信心和价值认可，同时旨在提升投资者信心。本次增持未设置具体增持数量和价格，但增持期间控股股东承诺不减持所持公司股份。", "ctime": 1779268973, "time_str": "17:22:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260520/c676838543.shtml"}, {"id": "4385389", "title": "机构：中东战事或将英国家庭能源支出推高13%", "content": "英国能源咨询公司“康沃尔洞察”19日发布2026年7月至9月家庭能源价格上限预测报告说，中东战事导致的能源价格上涨可能使英国家庭年度能源支出上限增长13%。根据报告显示的最终预测结果，一个同时使用燃气和电力的英国家庭，全年的能源账单最高预计可达1850英镑（1英镑约合1.339美元），而此前 , "ctime": 1779268192, "time_str": "17:09:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260520/c676838060.shtml"}, {"id": "4385327", "title": "摩根大通（JPMorgan）对药明康德的多头持仓比例增至10.17%", "content": "据香港交易所披露，摩根大通（JPMorgan）对无锡药明康德新药开发股份有限公司 - H股的多头持仓比例于2026年5月15日从10.06%增至10.17%。", "ctime": 1779268107, "time_str": "17:08:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260520/c676837964.shtml"}, {"id": "4385303", "title": "李强签署国务院令公布《中华人民共和国矿产资源法实施条例》", "content": "国务院总理李强日前签署国务院令，公布《中华人民共和国矿产资源法实施条例》（以下简称《条例》），自2026年6月15日起施行。 《条例》旨在保障修订后的矿产资源法有效实施，促进矿产资源合理开发利用，加强矿产资源和生态环境保护，推动矿业高质量发展，保障矿产资源安全。《条例》共8章79条，主要规定了以下内容。 一是进一步完善矿业权制度。对矿业权的设立、出让、续期、转让等作出具体规定。 二是细化矿产资源勘查、开采相关制度。规定建立健全基础性地质调查技术标准和规范体系，明确申请勘查许可证、采矿许可证的程序，强化矿业用地保障，促进矿产资源综合利用，明确矿产资源储量报告的法定效力。 三是细化矿区生态修复相关制度。明确采矿权人是矿区生态修复的责任人，细化矿区生态修复方案应当明确的内容，规定了矿区生态修复的完成时限和验收程序。 四是进一步完善矿产资源储备和应急制度。明确构建战略性矿产资源储备体系应当遵循的原则，对战略性矿产资源产品储备、产能储备和产地储备相关制度作进一步细化，完善矿产资源应急处置措施。 五是进一步完善监督管理制度。细化矿产资源开发利用水平评估制度，对从事矿产资源勘查的单位实行备案和分级分类监管，明确矿业权人之间争议的解决机制。完善法律责任，明确相关违法行为涉及战略性矿产资源的，在法定幅度内从重处罚。(新华社)", "ctime": 1779267631, "time_str": "17:00:31", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260520/c676837665.shtml"}, {"id": "4385289", "title": "以色列空袭黎巴嫩南部造成至少19人死亡", "content": "黎巴嫩公共卫生部20日发表声明说，以色列国防军19日对黎巴嫩南部多地发动多轮空袭，造成包括3名儿童在内的至少19人死亡，另有32人受伤。 声明说，以色列发动的空袭主要集中在黎巴嫩南部提尔地区的城镇、奈拜提耶市及其周边地区。 据黎巴嫩公共卫生部19日公布的统计数据，自3月2日黎以战火重燃以来，以色列对黎巴嫩发动的袭击已造成3042人死亡、9301人受伤。(新华社)", "ctime": 1779267413, "time_str": "16:56:53", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260520/c676837426.shtml"}, {"id": "4385279", "title": "中科飞测今日涨17.43%，3家机构专用席位净买入4.44亿元", "content": "中科飞测今日涨17.43%，成交额44.11亿元，换手率4.95%，盘后龙虎榜数据显示，沪股通专用席位买入3.77亿元并卖出4.34亿元，3家机构专用席位净买入4. // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
