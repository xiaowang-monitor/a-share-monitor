.score-bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s; }
.up { color: var(--red); }
.down { color: var(--green); }
.pulse { animation: pulse 2s infinite; }
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }

.glow { box-shadow: 0 0 20px rgba(59,130,246,0.15); }

          </thead>
          <tbody id="picks-table"></tbody>

  </div>

const NEWS     = [{"id": "5270203", "title": "居民房贷贴息政策10月1日起实施", "content": "财政部、中国人民银行、金融监管总局9月29日联合对外发布通知，明确自2026年10月1日起，实施居民购房贷款贴息政策，政策实施期暂定1年。这是中央财政首次对商业性个人住房贷款进行贴息。此次发布的通知明确，对同时符合以下条件的居民家庭给予贴息支持：一是使用新发放的商业性个人住房贷款购买首套住房，不包括存量贷款置换；二是所购住房建筑面积不超过120平方米；三是所购住房价格不超过150万元。根据通知，可享受贴息的贷款规模最高可达100万元，财政部门给予年化1个百分点的贴息，贴息期限最长5年。（新华社）", "ctime": 1790676050, "time_str": "18:00:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260929/c680372125.shtml"}, {"id": "5270135", "title": "以总理密访阿联酋，辛贝特状告以媒“走漏风声”", "content": "以色列国家安全总局（辛贝特）28日要求军事审查机构对以色列第12频道电视台采取法律行动，称后者在总理内塔尼亚胡密访阿拉伯联合酋长国回国途中就把消息捅了出去，属于“严重违反军事审查规定”。第12频道电视台27日援引消息人士的说法率先披露，内塔尼亚胡当天中午搭乘一架私人飞机前往阿联酋首都阿布扎比并在当地停留4个小时，其中1个小时与阿联酋总统穆罕默德会谈。次日，这家电视台继续爆料，称会谈在阿布扎比一座机场举行。以总理府28日发表声明说，辛贝特当天向军事审查机构投诉，第12频道电视台于27日晚9时38分报道相关消息，当时内塔尼亚胡搭乘的返程飞机尚未进入以色列领空，报道不仅危及出访人员，还对此次行动本身以及以军构成威胁。（新华社）", "ctime": 1790675961, "time_str": "17:59:21", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260929/c680372035.shtml"}, {"id": "5270129", "title": "中方世贸组织改革提案关于发展的建议获成员积极回应", "content": "世界贸易组织28日举行“发展轨道”改革专题会议。中国常驻世贸组织代表李詠箑在会上介绍《中方关于世贸组织改革的进一步思考和建议》提案，围绕发展议题在世贸组织改革中的定位等议题提出系统主张，得到各方广泛关注和积极回应。李詠箑指出，世贸组织成立30多年来，发展中经济体在全球经济和贸易中的比重显著上升，但许多发展中成员在出口多元化、生产能力提升等方面仍面临制约。中方主张始终将发展置于世贸组织改革的中心位置，并以问题导向的方式推进具体讨论；世贸组织改革的“发展轨道”应发挥统筹作用，处理跨委员会、跨协定的系统性问题。（新华社）", "ctime": 1790675930, "time_str": "17:58:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260929/c680372021.shtml"}, {"id": "5270125", "title": "央行：将“六张网”建设纳入抵押补充贷款支持领域", "content": "中国人民银行调整完善若干货币政策工具，扩大抵押补充贷款支持领域。将水网、新型电网、算力网、新一代通信网、城市地下管网、物流网等“六张网”建设纳入抵押补充贷款支持领域，引导政策性银行加大对“六张网”建设的金融支持，助力扩大有效投资，深入挖掘内需潜力。", "ctime": 1790675847, "time_str": "17:57:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260929/c680371991.shtml"}, {"id": "5270123", "title": "东阳光：控股股东提议拟以6亿元-12亿元回购公司股份", "content": "东阳光公告，控股股东深圳市东阳光实业发展有限公司提议公司以自有或自筹资金，通过集中竞价交易方式回购A股股份，资金规模不低于人民币6亿元（含）且不超过人民币12亿元（含），回购价格不超过董事会通过回购股份决议前30个交易日公司股票交易均价的150%，实施期限为董事会审议通过回购方案之日起6个月内。", "ctime": 1790675843, "time_str": "17:57:23", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260929/c680371988.shtml"}, {"id": "5270101", "title": "电投水电：拟与重庆公司签订委托管理协议，年收费6700万元", "content": "电投水电公告，公司拟与国家电投集团重庆电力有限公司签署《委托管理协议》，由公司对重庆公司实施经营管理，协议自签订生效之日起至2028年12月31日，管理费用按每年6700万元（含税）收取。重庆公司为公司实际控制人国家电投集团全资子公司，本次构成关联交易；相关议案已获公司第十一届董事会第七次（临时）会议审议通过。", "ctime": 1790675794, "time_str": "17:56:34", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260929/c680371968.shtml"}, {"id": "5270067", "title": "央行：下调抵押补充贷款（PSL）利率0.25个百分点", "content": "为贯彻中央政治局会议精神和国务院常务会议部署，实施好适度宽松的货币政策，中国人民银行在充分发挥各项存量政策效能的基础上，决定进一步调整完善几项货币政策工具，为经济平稳增长、高质量发展和金融市场稳定运行创造适宜的货币金融环境，推动经济持续向新向优向好发展，支持“十五五”实现良好开局。一是下调抵押补充贷款（PSL）利率0.25个百分点。一年期抵押补充贷款利率从1.75%降至1.5%，更好激励政策性银行支持实体经济、服务国家战略。二是扩大抵押补充贷款支持领域。将水网、新型电网、算力网、新一代通信网、城市地下管网、物流网等“六张网”建设纳入抵押补充贷款支持领域，引导政策性银行加大对“六张网”建设的金融支持，助力扩大有效投资，深入挖掘内需潜力。三是增加科技创新和技术改造再贷款额度2000亿元，并将该项再贷款支持比例统一从60%提高至100%。调增后，科技创新和技术改造再贷款额度从1.2万亿元增至1.4万亿元，且支持比例更高，有助于引导银行加大对中小科技型企业贷款投放，更好地支持企业扩大重点领域设备更新投资。四是增加支农支小再贷款额度5000亿元，其中民营企业再贷款额度增加3000亿元。（央行）", "ctime": 1790675647, "time_str": "17:54:07", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260929/c680371873.shtml"}, {"id": "5270061", "title": "九华旅游：董事会通过1.12亿元缆车升级项目", "content": "九华旅游公告，公司拟以自有资金投资建设九华山百岁宫缆车升级改造项目，项目总投资估算为人民币1.12亿元。2026年9月29日，公司第九届董事会第十七次会议审议通过该议案，本项目已完成可行性研究、立项备案等工作，无需提交股东会审议。", "ctime": 1790675516, "time_str": "17:51:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260929/c680371828.shtml"}, {"id": "5270055", "title": "大唐电信：转让合同权益获董事会通过，9935.22万元", "content": "大唐电信公告，公司拟向关联方联芯科技有限公司转让《研发楼认购协议》及《研发楼认购补充协议》的部分合同权益，转让价格9935.22万元。2026年9月29日，公司董事会审议通过相关议案，关联董事回避表决；本次交易尚需提交股东会审议。", "ctime": 1790675472, "time_str": "17:51:12", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260929/c680371805.shtml"}, {"id": "5270049", "title": "国家外汇管理局：6月末我国外债形势总体平稳", "content": "国家外汇管理局公布了2026年6月末中国全口径外债数据。数据显示，截至2026年6月末，我国全口径（含本外币）外债余额为24982亿美元，较2026年3月末增长861亿美元，增幅4%。国家外汇管理局副局长、新闻发言人李斌介绍，2026年二季度，我国外债形势总体平稳。外债规模小幅上升。主要是受跨境贸易较为活跃等因素影响，企业贸易信贷、关联公司间贷款等均有增长。外债币种结构有所优化，期限结构基本稳定。2026年6月末，本币外债占56%，较2026年3月末上升1个百分点；中长期外债占41%，与3月末持平。（央视新闻）", "ctime": 1790675452, "time_str": "17:50:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260929/c680371797.shtml"}, {"id": "5270023", "title": "市北高新：市北发展签订商品房出售合同5.69亿元", "content": "市北高新公告，全资子公司市北发展与北方集团签订《上海市商品房出售合同》，出售上海市静安区寿阳路相关房产，建筑面积为14232.38平方米，总房价款为人民币5.69亿元。合同采取分期付款方式，北方集团应于2026年9月30日前支付首付款1.14亿元，并于2026年11月30日前支付4.55亿元。", "ctime": 1790675388, "time_str": "17:49:48", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260929/c680371748.shtml"}, {"id": "5270017", "title": "财付通降费让利政策再延一年", "content": "2026年9月29日，财付通宣布，面向小微经营主体的降费让利政策将再延续一年，有效期至2027年9月30日。根据公告，本次政策继续覆盖符合标准的小微企业、个体工商户及有经营行为的个人。支付手续费方面，符合标准的经营主体可在微信支付官网公示标准的基础上享受9折优惠，活动期间自动享受，无需额外操作。此外，财付通针对不同的行业、支付场景提供了其他优惠活动，相关主体可根据自身实际情况选择参与。提现手续费方面，符合标准的小微企业、个体工商户及有经营行为的个人，可根据实际经营场景享受对应的政策支持。（界面新闻）", "ctime": 1790675359, "time_str": "17:49:19", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260929/c680371742.shtml"}, {"id": "5270013", "title": "津药药业：子公司盐酸罗哌卡因注射液2026年9月获药品注册证书", "content": "津药药业公告，子公司湖北津药近日收到国家药品监督管理局核准签发的盐酸罗哌卡因注射液《药品注册证书》，规格为10ml：75mg、10ml：100mg，药品批准文号为国药准字H20266080、国药准字H20266081。该药用于外科手术麻醉、急性疼痛控制。", "ctime": 1790675349, "time_str": "17:49:09", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260929/c680371734.shtml"}, {"id": "5270011", "title": "津药药业：湖北津药获批盐酸尼卡地平注射液10ml：10mg", "content": "津药药业公告，子公司湖北津药收到国家药品监督管理局核准签发的盐酸尼卡地平注射液《药品注册证书》，规格10ml：10mg，药品批准文号国药准字H20266042。该药品于2026年9月取得证书，按化学药品4类注册申报，获批后视同通过仿制药质量和疗效一致性评价。", "ctime": 1790675345, "time_str": "17:49:05", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260929/c680371733.shtml"}, {"id": "5270005", "title": "精研科技：黄逸超、邬均文减持计划期限届满，分别减持37.36万股、10万股", "content": "精研科技公告，黄逸超、常州创研投资咨询有限公司及董事邬均文减持计划实施期间为2026年6月29日至2026年9月28日，期限已届满。期间黄逸超通过集中竞价减持37.36万股，占公司总股本0.20%；邬均文减持10万股，占0.05%；常州创研未实施减持。", "ctime": 1790675288, "time_str": "17:48:08", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260929/c680371708.shtml"}, {"id": "5270001", "title": "美国对多名拉美高官实施签证限制", "content": "美国政府28日以打击腐败和贩毒活动为名，宣布对玻利维亚、哥伦比亚、厄瓜多尔、秘鲁4个拉美国家的27名国民及其直系家属实施签证限制，其中包括玻利维亚总检察长罗赫尔·马里亚卡等多名高级官员。(新华社)", "ctime": 1790675253, "time_str": "17:47:33", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260929/c680371699.shtml"}, {"id": "5269999", "title": "丽珠集团：上海丽珠11.25mg规格药品获批上市", "content": "丽珠集团公告，控股子公司上海丽珠收到国家药品监督管理局核准签发的《药品补充申请批准通知书》，其生产的注射用醋酸亮丙瑞林微球11.25mg（3个月剂型）获批上市，药品批准文号为国药准字H20269239，有效期至2029年4月27日。", "ctime": 1790675252, "time_str": "17:47:32", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260929/c680371696.shtml"}, {"id": "5269989", "title": "三大运营商叫停“0元购机” 免费手机的套路走到头了？", "content": "近日，三大运营商同步按下暂停键：绑定消费贷款的金融分期类“0元购机”业务停止新增办理，存量合同继续履约，预存话费等传统合约购机形式则不受影响。所谓金融分期购机，是用户在获赠手机、签约套餐之外再签一份消费贷款合同，贷款方为用户本人，合约期内由运营商代偿，表面零元拿机，实则被套餐和贷款双重绑定。（央视新闻）", "ctime": 1790675159, "time_str": "17:45:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260929/c680371657.shtml"}, {"id": "5269975", "title": "太辰光：公司以1860万元竞得1.72万㎡土地使用权", "content": "太辰光公告，公司此前审议通过购买土地使用权并投资建设项目。近日，公司参与深圳市坪山区坑梓街道G14316-0123宗地挂牌出让活动，以人民币1860万元竞得该地块使用权，并签署《成交确认书》。土地用途为工业用地，使用年期30年。", "ctime": 1790674963, "time_str": "17:42:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260929/c680371555.shtml"}, {"id": "5269951", "title": "伟明环保：完成回购1911.62万股，价格区间13.33元/股~17.34元/股，支付3亿元", "content": "伟明环保公告，公司此前拟以1.5亿元~3亿元回购股份，回购价格不超过20元/股，回购股份用于转换公司可转债。截至2026年9月28日，公司完成回购，累计回购1911.62万股，占总股本的0.93%，回购均价15.69元/股，已支付资金总额3亿元（不含交易费用）。回购股份将在本公告后3年内全部用于转换公司可转债。", "ctime": 1790674614, "time_str": "17:36:54", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260929/c680371203.shtml"}, {"id": "5269947", "title": "三峡水利：乌江实业、乌江电力拟捆绑挂牌转让100%股权及资产", "content": "三峡水利公告，乌江实业拟公开挂牌转让武陵锰业100%股权，乌江电力拟同步挂牌转让油菜沟锰渣库相关资产，两项标的捆绑转让，挂牌底价分别为6.65亿元、1.85亿元（不含增值税）。本次交易已获董事会审议通过，尚需提交股东会审议。", "ctime": 1790674586, "time_str": "17:36:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260929/c680371159.shtml"}, {"id": "5269869", "title": "南向资金今日净买入0.15亿港元 友邦保险获净买入居前", "content": "南向资金今日净买入0.15亿港元。友邦保险、小米集团-W分别获净买入约8.09亿港元、3.84亿港元；康方生物、南方恒生科技分别遭净卖出5.76亿港元、5.70亿港元。", "ctime": 1790674276, "time_str": "17:31:16", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260929/c680370778.shtml"}, {"id": "5269851", "title": "NASA：“星际客机”修补后接着用，但先别载人", "content": "美国国家航空航天局(NASA)28日宣布，将继续采用波音公司的“星际客机”执行不载人飞往国际空间站任务，但只有在该飞船“改进设计”后才会开展新的载人飞行任务。就在今年2月，NASA发布调查报告认定，“星际客机”首次载人试飞任务出现的故障为严重程度等级最高的“A类”事故。此前美国“挑战者号”“哥伦比亚号”航天飞机事故均被认定为同类别事故。NASA局长贾里德·艾萨克曼28日在新闻发布会上说，到今年12月，“星际客机”将完成改进，展开前往国际空间站的载货飞行。不过，由于进一步改进安全设计仍需时日，“星际客机”无望在2028年之前展开载人飞行任务。艾萨克曼说，“重启载人任务之前”，飞船的部分推进器需要“改进设计”。（新华社）", "ctime": 1790674244, "time_str": "17:30:44", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260929/c680370742.shtml"}, {"id": "5269823", "title": "Anthropic警示AI“灾难性”风险，去年销售额46亿美元", "content": "人工智能公司Anthropic在其招股说明书中警告，其技术可能带来“灾难性或生存性风险”，包括AI可能试图维持自身运行、抵制被关闭、隐瞒或操纵信息等行为。Anthropic去年销售额达46亿美元，同比增长11倍，其中近四分之一收入来自两家客户。尽管如此，该公司同期经调整后的运营亏损超过80亿美元，并计划未来几年在云、算力和基础设施建设方面投资5180亿美元。（财联社）", "ctime": 1790674169, "time_str": "17:29:29", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260929/c680370652.shtml"}, {"id": "5269809", "title": "纳指科技ETF景顺：将于9月30日开市起至当日10:30停牌", "content": "景顺长城基金公告，景顺长城纳斯达克科技市值加权交易型开放式指数证券投资基金（场内简称：纳指科技ETF景顺，代码：159509）将于2026年9月30日开市起停牌，自2026年9月30日10:30起复牌。近期该基金二级市场交易价格明显高于基金份额参考净值，出现较大幅度溢价，公司提示投资者关注溢价风险，审慎做出投资决策。", "ctime": 1790674078, "time_str": "17:27:58", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260929/c680370563.shtml"}, {"id": "5269799", "title": "贵州轮胎：贵阳产控转让贵阳工投17.3471%股权获批签约", "content": "贵州轮胎公告，公司此前披露贵阳产控拟通过非公开协议方式向省产发公司转让所持贵阳工投约17.35%股权。最新进展为，交易双方国资审批已完成，并于2026年9月29日签署协议，省产发公司收购贵阳工投17.3471%股权；完成后将持有贵阳工投100%股权，工商变更登记尚未办理。", "ctime": 1790674063, "time_str": "17:27:43", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260929/c680370545.shtml"}, {"id": "5269797", "title": "纳指ETF广发：将于9月30日开市起至当日10:30停牌", "content": "广发基金公告，广发纳斯达克100交易型开放式指数证券投资基金（基金代码：159941）因二级市场交易价格明显高于基金份额参考净值，出现较大幅度溢价，为保护投资者利益，将于2026年9月30日开市起停牌，自2026年9月30日10:30起复牌。停牌期间本基金赎回业务照常办理。", "ctime": 1790674061, "time_str": "17:27:41", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260929/c680370544.shtml"}, {"id": "5269795", "title": "迪哲医药：公司收到阿斯利康6亿美元首付款", "content": "迪哲医药公告，公司于2026年7月14日与阿斯利康签署《许可协议》，授予阿斯利康在全球范围内独家开发、商业化舒沃哲 的权利，协议于2026年8月31日正式生效。近期公司已收到阿斯利康支付的6亿美元首付款。", "ctime": 1790674057, "time_str": "17:27:37", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260929/c680370537.shtml"}, {"id": "5269793", "title": "健康元：上海丽珠11.25mg剂型获批上市", "content": "健康元公告，控股子公司丽珠集团的控股子公司上海丽珠收到国家药品监督管理局核准签发的《药品补充申请批准通知书》，注射用醋酸亮丙瑞林微球11.25mg（3个月剂型）获批上市，审批同意增加11.25mg规格并核发药品批准文号国药准字H20269239。", "ctime": 1790674040, "time_str": "17:27:20", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260929/c680370519.shtml"}, {"id": "5269775", "title": "湖北：力争2030年省级水网工程覆盖度提升至90%", "content": "9月29日，湖北省政府新闻办举行绿色水经济高质量发展新闻发布会。湖北省水利厅厅长孙国荣表示，将聚焦“补短、联网、提能、安全、生态”，加快“荆楚安澜”现代水网建设，谋划推进水网项目，力争2030年省级水网工程覆盖度提升至90%。严格规范涉水开发经营边界，严守水安全、水生态安全、水资源安全三条底线，严格落实水资源刚性约束制度，以完备工程、严密制度筑牢水安全底座，推动水网建设保障产业发展、产业发展反哺水利建设，实现高标准安全和高质量发展良性互动。（人民财讯）", "ctime": 1790673960, "time_str": "17:26:00", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260929/c680370451.shtml"}, {"id": "5269697", "title": "6月末我国银行业对外金融资产21443亿美元", "content": "国家外汇管理局公布了2026年6月末中国银行业对外金融资产负债数据。数据显示，2026年6月末，我国银行业对外金融资产21443亿美元，对外负债14726亿美元，对外净资产6717亿美元，其中，人民币净负债754亿美元，外币净资产7470亿美元。（央视新闻）", "ctime": 1790673495, "time_str": "17:18:15", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260929/c680369946.shtml"}, {"id": "5269653", "title": "上海十批次土拍收金159.69亿元 两宗地溢价率超20%", "content": "上海十批次土拍今日开拍，4宗涉宅用地总土地出让面积12.11万平方米，起始总价141.93亿元。最终，4宗地全部成交，成交总金额159.69亿元。其中，闵行古美地块经过177轮竞价，由招商蛇口、南山、滨江联合体以64.16亿元竞得，成交楼面价54971元/平方米，溢价率24.44%；杨浦五角场地块经过109轮竞价，由招商蛇口、南山联合体以29.20亿元竞得，成交楼面价65574元/平方米，溢价率21.46%。 (财联社)", "ctime": 1790673350, "time_str": "17:15:50", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260929/c680369771.shtml"}, {"id": "5269607", "title": "伊朗革命卫队发言人：美国若想结束战争则必须承认战败", "content": "当地时间29日，伊朗伊斯兰革命卫队发言人穆赫比表示，革命卫队已经准备好一封写给美国人民的信，旨在以真诚态度让美国人民了解伊朗立场。他表示，如果美国高昂的军费开支是为了保卫其领土，那么美国的国防形势自然是安全的，它并不需要在世界各地设立800个军事基地。谈到核问题时，穆赫比指出，25年前，美国总统就曾宣布伊朗距离拥有核武器“只有几周时间”，如果伊朗寻求核武器，而美国声称不会允许伊朗获得核武器，那么美国为何要撕毁伊核协议？美国的问题不在于核武器，而在于掠夺和分裂伊朗，“他们的目的是将伊朗变成他们的殖民地。”穆赫比表示，美国人民并不了解事实，即美国在过去的70年里一直处于战争状态，现在美国与不同国家的冲突更加激烈。伊朗将继续保卫国家，生产新型武器，“如果冲突演变成其他形式，我们一定会将新式武器投入战场。”美国以为凭借军事能力就可以让伊朗投降，但他们失败了。经济战和海上封锁也会再次失败。美国别无选择，只能承认战败并从该地区撤军，只有这样才能结束战争。（央视新闻）", "ctime": 1790673225, "time_str": "17:13:45", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260929/c680369639.shtml"}, {"id": "5269605", "title": "日久光电：3名董高增持83100股、8000股、38.74万股计划完成", "content": "日久光电公告，董事彭磊、董事兼董事会秘书徐一佳、实际控制人的一致行动人及高级管理人员陈鑫帅增持股份计划已实施完成。截至2026年9月29日，彭磊累计增持83100股，金额105.01万元；徐一佳累计增持8000股，金额10万元；陈鑫帅累计增持38.74万股，金额512.32万元。", "ctime": 1790673216, "time_str": "17:13:36", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260929/c680369633.shtml"}, {"id": "5269603", "title": "华纳药厂：25mg艾拉莫德片获得药品注册证书", "content": "华纳药厂公告，公司收到国家药品监督管理局核准签发的艾拉莫德片《药品注册证书》，规格为25mg，注册分类为化学药品4类，视同通过一致性评价。该药品用于治疗活动性类风湿关节炎，药品批准文号为国药准字H20266052。", "ctime": 1790673206, "time_str": "17:13:26", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260929/c680369623.shtml"}, {"id": "5269601", "title": "中国汽研：中国中检拟增持公司股份6000万元至1.2亿元", "content": "中国汽研公告，控股股东中国检验认证（集团）有限公司拟以自有资金通过上海证券交易所系统以集中竞价方式增持公司A股股份，金额不低于人民币6000万元且不高于人民币1.2亿元，实施期限为自增持计划公告之日起6个月内。本次增持前，中国中检持有公司5.35亿股，占总股本53.33%。", "ct // 工具函数
function pctClass(v) { return v >= 0 ? 'up' : 'down'; }
function pctStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function impactBadge(score) {
  if (score >= 80) return '<span class="badge badge-s">S</span>';
  if (score >= 65) return '<span class="badge badge-a">A</span>';
  if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
