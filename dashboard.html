: "", "url": "https://news.10jqka.com.cn/20260527/c677018593.shtml"}, {"id": "4413839", "title": "拼多多2026年Q1营收1062亿元，上年同期956.7亿元", "content": "拼多多2026年Q1营收1062亿元，上年同期956.7亿元。", "ctime": 1779877916, "time_str": "18:31:56", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260527/c677018574.shtml"}, {"id": "4413833", "title": "因美国未批准发放签证 俄伊官员未能出席联合国会议", "content": "俄罗斯常驻联合国代表涅边贾在安理会发言时表示，俄罗斯代表团本应派出负责联合国事务的俄外交部副部长亚历山大·阿利莫夫出席会议，但美方没有批准向他发放签证，这违反了《联合国和美国关于联合国总部的协定》中的义务，其中规定“所有联合国会员国官员都有权进入联合国总部”。另据伊朗外交部5月25日消息，伊朗外长阿拉格齐也因“签证问题”无法参加同一场安理会会议。联合国秘书长副发言人法尔汉·哈克在记者会上回应此事时，敦促美国向所有需要参加联合国总部活动的人员发放签证。（央视新闻）", "ctime": 1779877827, "time_str": "18:30:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260527/c677018542.shtml"}, {"id": "4413813", "title": "全国人大常委会委员长赵乐际对哈萨克斯坦进行正式友好访问", "content": "应哈萨克斯坦议会下院议长科沙诺夫邀请，全国人大常委会委员长赵乐际25日至27日对哈萨克斯坦进行正式友好访问，在阿斯塔纳会见哈萨克斯坦总统托卡耶夫，同议会上院议长阿希姆巴耶夫、下院议长科沙诺夫分别举行会谈。 会见托卡耶夫时，赵乐际首先转达了习近平主席的亲切问候和良好祝愿。赵乐际表示，在习近平主席和总统先生的战略引领和亲自擘画下，中哈关系实现跨越式发展，达到永久全面战略伙伴的高水平。中方愿同哈方一道，在涉及彼此核心利益问题上坚定相互支持，加强发展战略对接，深入推进高质量共建“一带一路”，巩固投资、能源、矿产、互联互通等领域合作，打造新能源、数字经济、人工智能、跨境电商、智慧城市等合作新增长点。共同办好“中哈文化交流年”，拓展文化、教育、科技、旅游等领域合作，促进两国人民相知相亲。在联合国、上合组织、中国－中亚机制等多边框架内加强协调配合，维护两国共同利益和国际公平正义。(新华社)", "ctime": 1779877690, "time_str": "18:28:10", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260527/c677018450.shtml"}, {"id": "4413811", "title": "迪哲医药：舒沃哲新药上市申请获国家药监局受理并纳入优先审评", "content": "迪哲医药公告，公司自主研发的舒沃哲 （舒沃替尼片）新增适应症新药上市申请（NDA）获国家药品监督管理局药品审评中心正式受理，并纳入优先审评程序，用于表皮生长因子受体（EGFR）20号外显子插入突变的局部晚期或转移性非小细胞肺癌（NSCLC）成人患者。该申请成为目前全球首个且唯一在EGFR exon20ins NSCLC一线治疗领域获NDA受理并纳入优先审评的口服靶向药。本次申请基于开放标签、随机对照、国际多中心III期确证性研究“悟空28”（WU-KONG28）的积极结果，与含铂双药化疗相比，舒沃哲 在无进展生存期（PFS）上展现出具有统计学意义和临床意义的显著改善，详细数据将于2026年美国临床肿瘤学会（ASCO）年会以最新突破摘要口头报告形式公布。", "ctime": 1779877612, "time_str": "18:26:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260527/c677018419.shtml"}, {"id": "4413809", "title": "日月光推310mm面板级封装自动化 目标明年上半年量产", "content": "日月光投控旗下日月光半导体表示，已研发出业内首条 310mm×310mm 面板级封装（Panel-Level Packaging）自动化产线。该产线实现了晶圆级封装到面板级封装的无缝衔接，同时兼容 FOCoS（基板扇出型封装）与 FOCoS-Bridge 两大封装平台的设计规范，有助于提升规模效应。这条全新面板级封装产线，预计将于 2027 年上半年正式投产。(科创板日报)", "ctime": 1779877611, "time_str": "18:26:51", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260527/c677018418.shtml"}, {"id": "4413807", "title": "恒银科技：子公司司法拍卖流拍，标的评估值2.39亿元", "content": "恒银科技公告，公司控股子公司智筑空间（天津）科技有限公司作为申请执行人参与天津市第一中级人民法院组织的第二次公开司法拍卖，交易标的为天津市红桥区瑞玺大厦112套不动产，评估值2.39亿元，起拍价1.8亿元。因本次拍卖无其他竞买人参与竞价，智筑空间亦未出价，司法拍卖最终流拍。智筑空间已交纳的3000万元竞买保证金将按法院要求原路退回。", "ctime": 1779877595, "time_str": "18:26:35", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260527/c677018415.shtml"}, {"id": "4413805", "title": "英媒：9国退出供乌弹药采购联盟", "content": "英国《金融时报》26日报道，去年12月以来，已有9个国家退出由捷克发起的供乌克兰弹药采购倡议，参与这个采购倡议的国家比高峰期少了一半。捷克总统、北约军事委员会前主席彼得·帕维尔希望在7月北约峰会上讨论该采购机制的存续问题。自2024年以来，所谓“捷克倡议”的参与国家已向乌克兰提供超过400万枚大口径炮弹，约占供乌大口径弹药总量的50%。参与国家去年一度达18个，如今降至9个，引发对其内部责任分摊及其前景的疑虑。帕维尔告诉《金融时报》，定于7月在土耳其首都安卡拉举行的北约峰会理应将该倡议存续问题纳入议程。（新华社）", "ctime": 1779877562, "time_str": "18:26:02", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260527/c677018400.shtml"}, {"id": "4413803", "title": "大豪科技：股东郑建军拟减持不超过1%股份", "content": "大豪科技公告，公司执行董事、股东郑建军持有公司股份1.45亿股，占公司总股本13.00%，其因个人资产配置需要，拟自2026年6月18日至2026年9月17日通过集中竞价交易方式减持不超过1116.65万股，即不超过公司总股本的1.00%。减持价格按市场价格确定，若期间公司有送股、转增等股份变动事项，减持数量将相应调整。", "ctime": 1779877552, "time_str": "18:25:52", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260527/c677018398.shtml"}, {" url": "https://news.10jqka.com.cn/20260527/c677018124.shtml"}, {"id": "4413763", "title": "分析人士：日本强化情报机构 与二战前如出一辙", "content": "近来，日本当局在情报领域动作频频，推动多层面整合升级情报力量，强化首相对情报工作的集权式控制。分析人士指出，这一系列动向，与二战前日本军国主义强化情报机构的种种做法如出一辙，日本首相高市早苗正在打造“新战前情报体系”。有日本媒体指出，重组后的政府情报体系相当于“直属”于首相，存在被政治化滥用风险，可能沦为高市政府操纵国内舆论、压制不同声音的工具，侵犯民众隐私权及言论自由。不少网友评论称，这很容易让人联想起二战前的日本情报机构——“特高课”。（央视新闻）", "ctime": 1779876959, "time_str": "18:15:59", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260527/c677018085.shtml"}, {"id": "4413757", "title": "顺丰控股：控股子公司参投基金完成私募备案，目标规模7亿元", "content": "顺丰控股公告，公司此前披露下属上市子公司顺丰同城全资子公司深圳同城作为有限合伙人参与投资苏州小雨成溪创业投资合伙企业（有限合伙），基金目标规模7亿元，首次认缴出资总额4.36亿元，深圳同城认缴2.13亿元。近日，基金已完成私募投资基金备案手续并取得备案证明，备案日期为2026年5月26日，托管人为中信银行股份有限公司。", "ctime": 1779876867, "time_str": "18:14:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260527/c677018017.shtml"}, {"id": "4413755", "title": "河化股份：证券简称5月28日起变更为中哲精化", "content": "河化股份公告，公司此前披露拟变更公司名称及证券简称。近日，公司完成工商变更登记，公司名称由“广西河池化工股份有限公司”变更为“广西中哲精化科技股份有限公司”，证券简称由“河化股份”变更为“中哲精化”，启用日期为2026年5月28日，证券代码“000953”保持不变。", "ctime": 1779876846, "time_str": "18:14:06", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260527/c677017922.shtml"}, {"id": "4413753", "title": "昂利康：拟出资1000万元与专业投资机构共同投资医疗健康领域基金", "content": "昂利康公告，公司拟使用自有资金参与投资专项基金——江苏源津瑞泓创业投资合伙企业（有限合伙）1000万元，该基金主要对医疗健康行业领域非上市企业进行直接或间接的股权投资，基金管理人为上海源津禾润私募基金管理有限公司。本次投资事项在经营管理层权限范围内，无需提交董事会、股东会审议，不构成关联交易及重大资产重组。", "ctime": 1779876807, "time_str": "18:13:27", "stock_code": "", "stock_name": "", "stock_market": "", "is_a_share": false, "source": "", "url": "https://news.10jqka.com.cn/20260527/c677017645.shtml"}, {"id": "4413751", "title": "滔搏：2026财年净利润12.67亿元，同比下降1.49%", "content": "滔搏公告，截至2026年2月28日止年度，公司收入257.4亿元，同比下降4.71%；毛利97.85亿元，同比下降5.77%；本公司权益持有人应占利润12.67亿元，同比下降1.49%。董事会建议派发末期   if (score >= 50) return '<span class="badge badge-b">B</span>';
  return '<span class="badge badge-c">C</span>';
}
function barColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 65) return '#f59e0b';
  if (score >= 50) return '#3b82f6';
  return '#64748b';
}

// 市场状态
function updateMarketStatus() {
  const el = document.getElementById('market-status');
  const now = new Date();
  const bjHour = (now.getUTCHours() + 8) % 24;
  const bjMin = now.getUTCMinutes();
  const t = bjHour * 100 + bjMin;
  const day = (now.getUTCDay() + (now.getUTCHours() + 8 >= 24 ? 1 : 0)) % 7;
  if (day === 0 || day === 6) {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">休市</span>';
  } else if (t >= 930 && t <= 1130 || t >= 1300 && t <= 1500) {
    el.innerHTML = '<span class="badge" style="background:rgba(34,197,94,0.2);color:#22c55e"><span class="pulse">●</span>&nbsp;交易中</span>';
  } else if (t >= 915 && t < 930) {
    el.innerHTML = '<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b">集合竞价</span>';
  } else {
    el.innerHTML = '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">已收盘</span>';
  }
  document.getElementById('update-time').textContent = META.update_time || '';
}

// KPI 卡片
function renderKPI() {
  const container = document.getElementById('kpi-cards');
  const sentimentScore = META.sentiment_score || 50;
  const pickCount = PICKS.length;
  const topScore = PICKS.length > 0 ? PICKS[0].total : 0;
  const hotSector = SECTORS.length > 0 ? SECTORS[0].name : '-';

  const kpis = [
    { label: '市场情绪', value: sentimentScore.toFixed(0), unit: '分', color: sentimentScore >= 60 ? '#ef4444' : sentimentScore >= 40 ? '#f59e0b' : '#22c55e' },
    { label: '精选个股', value: pickCount, unit: '只', color: '#3b82f6' },
    { label: '最高评分', value: topScore.toFixed(1), unit: '分', color: topScore >= 80 ? '#ef4444' : '#f59e0b' },
    { label: '热门板块', value: hotSector, unit: '', color: '#8b5cf6' },
  ];

  container.innerHTML = kpis.map(k => `
    <div class="card glow" style="border-left: 3px solid ${k.color}">
      <p class="text-xs text-gray-500 mb-1">${k.label}</p>
      <p class="text-2xl font-bold mono" style="color:${k.color}">${k.value}<span class="text-sm text-gray-500 ml-1">${k.unit}</span></p>
    </div>
  `).join('');
}

// Hot7
function renderHot7() {
  const container = document.getElementById('hot7-list');
  if (!HOT7 || HOT7.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无数据</p>';
    return;
  }
  container.innerHTML = HOT7.map((item, i) => `
    <div class="flex items-center gap-3 py-2 ${i < HOT7.length - 1 ? 'border-b border-gray-800' : ''}">
      <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
        ${i < 3 ? 'bg-red-500/20 text-red-400' : 'bg-gray-700 text-gray-400'}">${i+1}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${item.name || item.symbol}</p>
        <p class="text-xs text-gray-500 mono">${item.symbol}</p>
      </div>
      <span class="text-xs text-gray-400">${item.mentions}次提及</span>
    </div>
  `).join('');
}

// 精选个股
function renderPicks() {
  const tbody = document.getElementById('picks-table');
  if (!PICKS || PICKS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-600 py-8">暂无符合条件的个股</td></tr>';
    return;
  }
  tbody.innerHTML = PICKS.map(p => {
    const dims = [
      { name: '情绪', val: p.sentiment, w: 25 },
      { name: '板块', val: p.sector, w: 20 },
      { name: '龙头', val: p.leader, w: 20 },
      { name: '资金', val: p.fund, w: 15 },
      { name: '量价', val: p.vp, w: 10 },
      { name: '封单', val: p.seal, w: 10 },
    ];
    const miniBar = dims.map(d => {
      const pct = (d.val / 100 * d.w).toFixed(1);
      return `<div class="flex items-center gap-1" title="${d.name}: ${d.val.toFixed(0)}">
        <span class="text-gray-600" style="font-size:9px;width:18px">${d.name.substring(0,2)}</span>
        <div class="score-bar flex-1"><div class="score-bar-fill" style="width:${d.val}%;background:${barColor(d.val)}"></div></div>
      </div>`;
    }).join('');
    return `<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">
      <td class="py-2.5 px-2 mono text-xs text-gray-400">${p.symbol}</td>
      <td class="py-2.5 px-1 font-medium text-sm">${p.name}</td>
      <td class="py-2.5 px-1 text-right mono text-sm">${p.price.toFixed(2)}</td>
      <td class="py-2.5 px-1 text-right mono text-sm ${pctClass(p.pct)}">${pctStr(p.pct)}</td>
      <td class="py-2.5 px-1 text-right">${impactBadge(p.total)} <span class="mono text-sm ml-1">${p.total.toFixed(1)}</span></td>
      <td class="py-2.5 px-1"><div class="space-y-0.5">${miniBar}</div></td>
      <td class="py-2.5 px-1 text-right text-xs text-gray-400">${p.sector_name || '-'}</td>
      <td class="py-2.5 px-1 text-right mono text-xs ${p.consecutive_ups >= 3 ? 'text-red-400' : 'text-gray-400'}">${p.consecutive_ups || 0}天</td>
    </tr>`;
  }).join('');
}

// 板块热度图
function renderSectorChart() {
  if (!SECTORS || SECTORS.length === 0) return;
  const chart = echarts.init(document.getElementById('sector-chart'), null, { renderer: 'svg' });
  const names = SECTORS.map(s => s.name);
  const counts = SECTORS.map(s => s.hit_count);
  chart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 80, right: 20, top: 10, bottom: 30 },
    xAxis: { type: 'value', axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#64748b', fontSize: 11 }, splitLine: { lineStyle: { color: '#1e293b' } } },
    yAxis: { type: 'category', data: names.reverse(), axisLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8', fontSize: 12 } },
    series: [{
      type: 'bar', data: counts.reverse(), barWidth: 18,
      itemStyle: { borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: '#3b82f6' }, { offset: 1, color: '#8b5cf6' }
        ])
      },
      label: { show: true, position: 'right', color: '#94a3b8', fontSize: 11 }
    }],
    tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } }
  });
  window.addEventListener('resize', () => chart.resize());
}

// 新闻流
function renderNews() {
  const container = document.getElementById('news-feed');
  const items = (NEWS || []).slice(0, 30);
  if (items.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">暂无新闻</p>';
    return;
  }
  container.innerHTML = items.map(n => {
    const stockTag = n.stock_name ? `<span class="text-xs text-blue-400 ml-2">${n.stock_name}</span>` : '';
    return `<div class="py-2 border-b border-gray-800/50">
      <div class="flex items-start gap-2">
        <span class="mono text-xs text-gray-600 mt-0.5 shrink-0">${n.time_str || ''}</span>
        <p class="text-sm text-gray-300 leading-relaxed">${n.title}${stockTag}</p>
      </div>
    </div>`;
  }).join('');
}

// 交易代理状态
function renderAgentStatus() {
  const container = document.getElementById('agent-status');
  const stateColors = {
    'IDLE': '#64748b', 'OBSERVE': '#f59e0b', 'READY': '#3b82f6',
    'HOLD': '#ef4444', 'EXIT': '#22c55e'
  };
  const agents = META.agents || [];
  if (agents.length === 0) {
    container.innerHTML = '<p class="text-gray-600 text-sm">无活跃交易代理</p>';
    return;
  }
  container.innerHTML = agents.map(a => `
    <div class="flex items-center justify-between py-2 border-b border-gray-800/50">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" style="background:${stateColors[a.state] || '#64748b'}"></span>
        <div>
          <span class="text-sm font-medium">${a.name || a.symbol}</span>
          <span class="mono text-xs text-gray-500 ml-2">${a.symbol}</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge" style="background:${stateColors[a.state]}22;color:${stateColors[a.state]}">${a.state}</span>
        <span class="mono text-xs text-gray-400">评分 ${a.score}</span>
      </div>
    </div>
  `).join('');
}

// 倒计时
let nextRefresh = 180;
function updateCountdown() {
  nextRefresh--;
  if (nextRefresh <= 0) {
    location.reload();
    return;
  }
  document.getElementById('countdown').textContent = `刷新 ${nextRefresh}s`;
}

// 初始化
updateMarketStatus();
renderKPI();
renderHot7();
renderPicks();
renderSectorChart();
renderNews();
renderAgentStatus();
setInterval(updateCountdown, 1000);
setInterval(updateMarketStatus, 30000);
</script>
</body>
</html>
